progression:
- phase: Infantile and early childhood onset
  age_range: Infancy to early childhood
  notes: >-
    Episodes begin in infancy or early childhood and are at their most frequent
    and severe during childhood, when they disrupt sleep, activity and
    schooling.
  evidence:
  - reference: PMID:30549873
    reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Affected participants were characterized by infantile recurrent pain episodes,
      with spontaneous mitigation around adolescence
    explanation: Gives both the onset and the natural history in one sentence.
- phase: Spontaneous attenuation around adolescence
  age_range: Adolescence
  notes: >-
    Episodes diminish or remit around adolescence without disease-modifying
    treatment. The mechanism of the age dependence is not established. This is
    what makes the long-term prognosis benign despite a severe childhood
    symptom burden.
  evidence:
  - reference: PMID:39058404
    reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FEPS appears in early childhood, gradually disappearing with age, and
      pain episodes can be triggered by fatigue, bad weather, and cold temperatures
    explanation: States the age-dependent remission together with the triggers.
prevalence:
- population: Japan
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Forty-eight Japanese families had been recruited by 2018, the largest series
    reported. No population rate has been estimated for this disorder anywhere,
    so the qualitative band is the only claim the sources support.
  evidence:
  - reference: PMID:30557356
    reference_title: "Familial episodic limb pain in kindreds with novel Nav1.9 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we recruited an additional 42 new unrelated Japanese FEP families, between
      March 2016 and March 2018
    explanation: Gives the size of the largest reported series.
environmental:
- name: Cold ambient exposure
  description: >-
    Cold precipitates episodes and the affected region feels cold to the
    patient, while warming relieves the pain. The cellular counterpart is that
    gain-of-function NaV1.9 confers hyperexcitability that persists at cold
    temperatures, where nociceptor firing would normally be suppressed.
  influences_mechanisms:
  - target: Nociceptor Hyperexcitability with Reduced Firing Threshold
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Cold is the modality at which the mutant channel's hyperexcitability
      is retained, which is why cooling provokes rather than suppresses firing.
    evidence:
    - reference: PMID:26645915
      reference_title: "Cold-aggravated pain in humans caused by a hyperactive NaV1.9 channel mutant."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: cause cold-resistant hyperexcitability of nociceptors, suggesting a mechanistic
        basis for the temperature dependence of the pain phenotype
      explanation: Ties the cold trigger to the cellular mechanism explicitly.
  evidence:
  - reference: PMID:39058404
    reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: pain episodes can be triggered by fatigue, bad weather, and cold temperatures
    explanation: Records cold as a clinical trigger of episodes.
  review_notes: >-
    ECTO was searched for an ambient-cold exposure term and none fits: the
    closest matches are exposure to cold room, exposure to cold water immersion
    therapy and exposure to cold cereal via ingestion, none of which names
    ambient cold or cold weather. Left unbound rather than bound to a near miss.
- name: Physical fatigue
  description: >-
    Physical exertion and fatigue precipitate episodes; rest and warming
    mitigate them. Reported consistently across the Japanese families.
  influences_mechanisms:
  - target: Ectopic Nociceptive Signalling from Distal Limb Afferents
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Fatigue is a reproducible clinical trigger, but no mechanism connecting
      exertion to NaV1.9 activity has been demonstrated.
    evidence:
    - reference: PMID:30549873
      reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The pain is often induced by fa- tigue and is a prelude of bad weather
      explanation: Records fatigue as a trigger, from the clinical description of six
        families.
  evidence:
  - reference: PMID:30549873
    reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The pain is often induced by fa- tigue and is a prelude of bad weather
    explanation: Establishes fatigue and impending weather change as episode triggers.
  review_notes: >-
    ECTO was searched for a physical-exertion or fatigue exposure term and no
    suitable match was found, so this entry is deliberately left unbound.
treatments:
- name: Warming and Trigger Avoidance
  description: >-
    The first-line and most effective intervention: warming the affected limb
    relieves an episode, and avoiding cold and fatigue reduces episode
    frequency. It is unusual for a behavioural measure to be first-line, and it
    follows directly from the mechanism - the trigger is the cold-resistant
    hyperexcitability, so removing the cold removes the drive.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Nociceptor Hyperexcitability with Reduced Firing Threshold
    description: Warming removes the thermal condition under which the mutant channel
      sustains firing.
    evidence:
    - reference: PMID:30549873
      reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The affected regions feel cold in the patients, and warming the lesions
        relieves the symptoms
      explanation: Reports symptomatic relief by warming in the founding families.
  evidence:
  - reference: PMID:30549873
    reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The affected regions feel cold in the patients, and warming the lesions
      relieves the symptoms
    explanation: The clinical observation that warming relieves the pain.
- name: Genetic Counseling
  description: >-
    Counselling for the fifty percent recurrence risk of an autosomal dominant
    condition, with cascade testing of at-risk relatives once a familial variant
    is known. Counselling can be unusually reassuring here, because the natural
    history is benign and remits with age.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39058404
    reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This variant was confirmed in other affected members but not in the unaffected
      father
    explanation: Illustrates the familial segregation testing that cascade counselling
      rests on.
animal_models:
- name: Scn11a R222S knock-in mouse
  species: Mouse
  genotype: Scn11a p.R222S knock-in
  publication: PMID:30549873
  description: >-
    A knock-in mouse carrying one of the two alleles found in the founding
    Japanese families, generated in the same study that identified them.
  modeled_mechanisms:
  - target: Nociceptor Hyperexcitability with Reduced Firing Threshold
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces both the cellular defect - increased input impedance and
      evoked firing frequency in dorsal root ganglion neurons - and a
      behavioural correlate of the thermal sensitivity.
    limitations: >-
      The mouse cannot model the episodic, weather-triggered character of the
      human pain or its spontaneous remission in adolescence, which are the two
      features that define the syndrome clinically.
    readouts:
    - name: Evoked action potential firing frequency in DRG neurons
      target: Nociceptor Hyperexcitability with Reduced Firing Threshold
      direction: INCREASED
      interpretation: The direct electrophysiological correlate of the hyperexcitability
        node.
      evidence:
      - reference: PMID:30549873
        reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: showed significant increase of input impedance and firing frequency
          of evoked action potentials in p.R222S mice
        explanation: Reports the measurement in the knock-in model.
    - name: Behavioural sensitivity to hot and cold stimuli
      target: Nociceptor Hyperexcitability with Reduced Firing Threshold
      direction: INCREASED
      interpretation: Whole-animal correlate showing the cellular change reaches
        behaviour.
      evidence:
      - reference: PMID:30549873
        reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Behavioral tests showed that p.R222S mice were significantly more
          hypersensitive to hot and cold stimuli
        explanation: Reports the behavioural readout.
    evidence:
    - reference: PMID:30549873
      reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Next, we generated a knock-in mouse model harboring one of the mutations
        (p.R222S)
      explanation: Establishes that the model carries an actual patient allele, which
        is what makes it informative for this node.
- name: Scn11a F802C and F1125S knock-in mice
  species: Mouse
  genotype: Scn11a p.F802C or p.F1125S knock-in (orthologues of human p.F814C and p.F1146S)
  publication: PMID:30557356
  description: >-
    Knock-in mice for the mouse orthologues of two novel human alleles,
    generated specifically to classify those variants functionally.
  modeled_mechanisms:
  - target: Depolarized Resting Membrane Potential in Nociceptors
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Both lines show the raised resting membrane potential and increased firing
      that define this node, which is how the two human variants were assigned
      gain-of-function status.
    limitations: >-
      The alleles modelled are the mouse orthologous residues rather than the
      human variants themselves, and several action-potential parameters and the
      current threshold did not differ from wild type, so the effect is
      narrower than a global excitability increase.
    readouts:
    - name: Resting membrane potential in DRG neurons
      target: Depolarized Resting Membrane Potential in Nociceptors
      direction: INCREASED
      interpretation: The defining measurement for this node, in both knock-in lines.
      evidence:
      - reference: PMID:30557356
        reference_title: "Familial episodic limb pain in kindreds with novel Nav1.9 mutations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Dissected neurons of F802C and F1125S mice showed increased resting
          membrane potentials and firing frequency of the action potentials (APs) by
          high input-current stimulus compared with WT mice
        explanation: Reports the resting-potential and firing measurements in both
          lines.
    evidence:
    - reference: PMID:30557356
      reference_title: "Familial episodic limb pain in kindreds with novel Nav1.9 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These results suggest a higher level of excitability in the F802C or
        F1125S mice than in WT, and indicate that these novel mutations are gain of
        function mutations
      explanation: The authors' own conclusion that the models establish gain of
        function.
- name: Nav1.9-null mouse
  species: Mouse
  genotype: Scn11a knockout
  publication: PMID:27780178
  description: >-
    The loss-of-function counterpart. It does not model the disease - it carries
    the opposite lesion - but it establishes what NaV1.9 normally contributes,
    which is the necessity half of the causal argument the gain-of-function
    knock-ins make from the sufficiency side.
  modeled_mechanisms:
  - target: Nociceptor Hyperexcitability with Reduced Firing Threshold
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Deleting the channel moves nociceptor excitability in the opposite
      direction to the disease: C-fibre electrical threshold rises by 55% and
      mechanical and thermal thresholds rise with it.
    limitations: >-
      This is an inverted model. It removes the channel rather than carrying a
      disease variant, so it can support the direction of the mechanism but
      cannot recapitulate the syndrome, and no inference about the episodic
      phenotype can be drawn from it.
    readouts:
    - name: C-fibre electrical threshold
      target: Nociceptor Hyperexcitability with Reduced Firing Threshold
      direction: INCREASED
      interpretation: >-
        Threshold rises on channel deletion, the mirror image of the reduced
        threshold that defines the node in disease.
      evidence:
      - reference: PMID:27780178
        reference_title: "Reduced excitability and impaired nociception in peripheral unmyelinated fibers from Nav1.9-null mice."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: the electrical threshold of NaV1.9 KO C fibers was elevated by 55%
          and the median von Frey threshold was 32 mN in contrast to 8 mN in wild types
        explanation: Quantifies the inverse effect; it supports the mechanism by
          inversion rather than by recapitulation.
    evidence:
    - reference: PMID:27780178
      reference_title: "Reduced excitability and impaired nociception in peripheral unmyelinated fibers from Nav1.9-null mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: NaV1.9 presumably contributes to acute thermal and mechanical nociception
        in mice, most likely through increasing the excitability
      explanation: Establishes the channel's normal excitability role, which is what
        makes the inverted model informative for this node.
histopathology:
- name: Reduced intraepidermal nerve fibre density with unmyelinated axon degeneration
  description: >-
    Skin biopsy in some patients shows reduced intraepidermal nerve fibre
    density and vacuolar degeneration of unmyelinated axons - a small-fibre
    neuropathy. This is the finding that qualifies the otherwise-true statement
    that investigation in this disease is normal: routine studies interrogate
    large fibres, and the lesion is in the small ones. It also matters for
    prognosis, since degeneration of the fibres carrying the pain has been
    proposed as a mechanism for the age-dependent remission.
  finding_term:
    preferred_term: reduced intraepidermal nerve fibre density
  evidence:
  - reference: PMID:36051609
    reference_title: "Familial Episodic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Skin biopsies in some FEPS3 patients have revealed different degrees of
      reduction of intraepidermal nerve fiber density and vacuolar degeneration of
      unmyelinated axons, indicating small-fiber neuropathy
    explanation: Reports the histological lesion and names it as small-fibre
      neuropathy.
  notes: >-
    Present in some patients rather than all, and the source does not report a
    frequency.
diagnosis:
- name: Sodium-channelopathy gene panel sequencing
  description: >-
    The definitive diagnostic. Because FEPS1, FEPS2, FEPS3 and FEPS4 are
    clinically overlapping and separated only by genotype, a panel covering
    SCN11A, SCN10A, SCN9A and TRPA1 is a more sensible first test than
    single-gene sequencing, with exome or genome sequencing for
    panel-negative cases.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36051609
    reference_title: "Familial Episodic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FEPS at least includes four subtypes of FEPS1, FEPS2, FEPS3, and FEPS4,
      which are caused by mutations in the TRPA1, SCN10A, SCN11A, and SCN9A genes,
      respectively
    explanation: The four-gene overlap is what makes panel sequencing rather than
      single-gene testing the appropriate approach.
  - reference: PMID:39058404
    reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Sequencing of SCN9A, SCN10A, and SCN11A in the proband revealed a novel
      heterozygous variant of SCN11A'
    explanation: A worked example of the panel approach reaching the diagnosis.
- name: Quantitative sensory testing and nerve conduction studies
  description: >-
    Nerve conduction studies are normal in most patients, which is a useful
    negative: it excludes a large-fibre neuropathy. Quantitative sensory
    testing is the informative one, showing abnormal cold and warm thresholds
    in some patients - the objective correlate of the thermal sensitivity that
    defines the syndrome clinically.
  diagnosis_term:
    preferred_term: quantitative sensory testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:36051609
    reference_title: "Familial Episodic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nerve conduction studies were normal in most patients, while QST showed
      abnormal cold and warm temperature thresholds in some patients
    explanation: Gives both the normal large-fibre result and the abnormal thermal
      thresholds in one sentence.
differential_diagnoses:
- name: Inherited erythromelalgia
  disease_term:
    preferred_term: erythromelalgia
  description: >-
    The differential most worth stating, because the two look superficially
    similar and are separated by a single bedside observation that runs the
    opposite way. Curated in this knowledge base as Primary_Erythermalgia. Erythromelalgia produces red, hot, hyperperfused extremities
    relieved by cooling; FEPS3 patients report that the affected region feels
    cold and that warming relieves the pain.
  evidence:
  - reference: PMID:29299961
    reference_title: "Erythromelalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: by the permanent occurrence of extremely painful hyperperfused skin
    explanation: Gives the hyperperfused character of erythromelalgia, which is the
      direct opposite of the cold, warmth-relieved pain of this disorder and is what
      separates them at the bedside.
  - reference: PMID:29299961
    reference_title: "Erythromelalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: affecting SCN9A, SCN10A, and SCN11A coding for NaV1.7, NaV1.8, and NaV1.9
    explanation: Notes that erythromelalgia arises from the same three sodium-channel
      genes, so the gene alone does not distinguish the two conditions and the clinical
      thermal character has to.
- name: Growing pains
  description: >-
    The differential a clinician actually faces first. A child with recurrent
    self-limited limb pain that resolves with age is far more likely to have
    benign growing pains than a sodium channelopathy; what separates them is a
    segregating family history in an autosomal dominant pattern, the
    reproducible cold and fatigue triggers, and a molecular diagnosis.
  evidence:
  - reference: PMID:36051609
    reference_title: "Familial Episodic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: characterized by early-childhood onset of severe episodic pain mainly
      affecting the distal extremities and tend to attenuate or diminish with age
    explanation: The features quoted here are exactly the ones growing pains shares,
      which is what makes the distinction rest on family history and genotype rather
      than on the pain description.
- name: Other familial episodic pain syndromes
  description: >-
    FEPS1 (TRPA1), FEPS2 (SCN10A) and FEPS4 (SCN9A) produce overlapping
    distal episodic pain and are separated only by sequencing. FEPS2 in
    particular also causes distal, predominantly lower-limb episodic pain, which
    is why a gene panel rather than single-gene testing is the sensible first
    test.
  evidence:
  - reference: PMID:36051609
    reference_title: "Familial Episodic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FEPS at least includes four subtypes of FEPS1, FEPS2, FEPS3, and FEPS4,
      which are caused by mutations in the TRPA1, SCN10A, SCN11A, and SCN9A genes,
      respectively
    explanation: Enumerates the sibling subtypes this entry must be distinguished from.
- name: Congenital insensitivity to pain
  description: >-
    Curated in this knowledge base as Congenital_Insensitivity_to_Pain. Not a
    clinical mimic but the opposite phenotype from the same gene, and the
    reason variant interpretation here cannot rely on "gain of function" alone.
    Extreme gain of function produces sustained depolarization block and loss of
    firing; at the Leu811 residue the substitution decides which phenotype
    results.
  evidence:
  - reference: PMID:39058404
    reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: On the other hand, the c.2432T>C (p.Leu811Pro) variant is known to cause
      congenital insensitivity to pain (CIP)
    explanation: Documents the opposite phenotype arising at the same residue.
discussions:
- discussion_id: gain_of_function_degree_threshold
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What determines whether a gain-of-function SCN11A variant causes episodic
    pain or congenital insensitivity to pain?
  attaches_to:
  - pathophysiology#Hyperpolarized NaV1.9 Activation with Enlarged Window Current
  - genetic#SCN11A
  rationale: >-
    Both phenotypes arise from gain of function in the same channel, and at
    Leu811 they arise from different substitutions of the same residue. The
    proposed explanation is that moderate gain of function lowers the firing
    threshold while extreme gain of function depolarizes the membrane far enough
    to inactivate the sodium channels needed to fire at all. No study has
    measured a quantitative boundary between the two regimes, so a novel variant
    with demonstrated gain of function cannot yet be assigned to a phenotype on
    biophysics alone. This matters clinically because the two conditions have
    opposite management.
  evidence:
  - reference: PMID:26645915
    reference_title: "Cold-aggravated pain in humans caused by a hyperactive NaV1.9 channel mutant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we propose a model in which the physiological consequence of a mutation,
      that is, augmented versus absent pain, is critically dependent on the type of
      NaV1.9 hyperactivity
    explanation: States the proposal as a model rather than a demonstrated threshold,
      which is precisely the gap.
  - reference: PMID:39058404
    reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Thus, we speculate that p.Leu811Phe may lead to current leakage, while
      p.Leu811Pro can increase the current through Nav1.9
    explanation: The authors' own hedging ("we speculate") shows the divergence is
      not yet mechanistically settled even for the one residue where both phenotypes
      are observed.
- discussion_id: age_dependent_remission_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Why do episodes attenuate spontaneously around adolescence when the causal
    variant is present for life?
  attaches_to:
  - progression#Spontaneous attenuation around adolescence
  - pathophysiology#Nociceptor Hyperexcitability with Reduced Firing Threshold
  rationale: >-
    The remission is the most clinically important fact about this disease -
    it is why the prognosis is benign - and no mechanism has been demonstrated.
    The germline variant does not change, so the attenuation must come from
    something acquired or developmental: changing NaV1.9 expression, changing
    nociceptor properties, or changing central processing. A fourth candidate is
    proposed in the literature and is the most uncomfortable one, because it
    makes the good news and the bad news the same event: long-term NaV1.9
    dysfunction may itself degenerate the unmyelinated fibres, so pain could
    remit because the fibres carrying it are being lost. That would tie this gap
    directly to the small-fibre histopathology curated in this entry. It is
    offered speculatively by its authors and has not been measured across the
    relevant age range in patients, nor in the knock-in mice, which are studied
    at six to eight weeks.
  evidence:
  - reference: PMID:30549873
    reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Affected participants were characterized by infantile recurrent pain episodes,
      with spontaneous mitigation around adolescence
    explanation: Establishes the phenomenon that lacks a demonstrated mechanism.
  - reference: PMID:36051609
    reference_title: "Familial Episodic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: long-term dysfunction of the Nav1.9 channel may cause degeneration of
      the unmyelinated fibers in FEPS3 patient with pain remission
    explanation: The one candidate mechanism the literature offers for the remission,
      hedged by its own authors as a possibility rather than a finding.
notes: >-
  Scope, and why this entry is SCN11A only. The disease name "predominantly
  lower limb involvement" does not by itself pick a gene, and the deep-research
  report says so explicitly in its own limitations: FEPS2 (SCN10A) also causes
  distal, predominantly lower-limb episodic pain. The preflight check flagged
  the same risk, with SCN10A mentioned at 43% of the rate of SCN11A. The
  question is settled by the ontology rather than by the prose: MONDO:0014247
  carries OMIM 615552, which is FEPS3, which is SCN11A. FEPS1 (TRPA1), FEPS2
  (SCN10A) and FEPS4 (SCN9A) each have their own concepts and are curated here
  as differentials, not as content. Sections of the report covering SCN10A
  biology were excluded on that basis.

  Terms deliberately not bound. Neither environmental trigger carries an
  exposure_term. ECTO was searched for ambient cold and for physical exertion;
  the closest cold matches are exposure to cold room, exposure to cold water
  immersion therapy and exposure to cold cereal via ingestion, none of which
  names ambient cold or cold weather, and nothing suitable exists for fatigue.
  Both are left unbound with the search recorded in review_notes rather than
  bound to a near miss. The myenteric neuron node is bound to CL:0000101
  sensory neuron rather than to an enteric neuron type: the report proposed
  CL:0011103 for "enteric neuron" and that identifier is sympathetic neuron.

  Report term corrections. This report's suggested identifiers were unusually
  unreliable and none of the following was used. Five were flagged by the
  report's own term validation as naming a different concept: HP:0025277,
  offered for episodic pain, is Gustatory sweating; HP:0500152, offered for
  cold-induced pain, is Hypocystinemia; HP:0003394, offered for limb pain, is
  Muscle spasm; GO:0045211, offered for "axon/terminal", is postsynaptic
  membrane; and UBERON:0001132, offered for trigeminal ganglion, is parathyroid
  gland. A sixth, CL:0011103 for enteric neuron, is sympathetic neuron. Beyond
  those, all four NCIT identifiers the report proposed for treatments are wrong,
  and none was caught by the report's own validation because that section does
  not check NCIT: C15272, offered for Supportive Care, is Lobectomy; C376,
  offered for Carbamazepine, is Cisplatin; C198, offered for NSAID, is
  Acetaminophen; and C15311, offered for Genetic Counseling, is Quality Control.
  The correct terms NCIT:C15747 and NCIT:C15240 are used here. Every identifier
  in this entry was checked against its ontology before binding, and HP:0032148
  Episodic pain - which the report did not propose at all - is the exact term
  for the defining phenotype.

  Deliberately not curated, and five references read and set aside. No
  treatments beyond warming, trigger avoidance and genetic counselling. The
  report lists NSAIDs, carbamazepine, lidocaine and mexiletine as off-label
  symptomatic options, but the one paper it cites for any of them reports
  carbamazepine correcting the gating of a NaV1.8-S242T channel in a patient
  with painful diabetic neuropathy - a different channel in a different
  disease. Curating that as a treatment here would assert a clinical use no
  source supports. The PRMT7 inhibitor DS-437 and transcutaneous cholesterol
  are preclinical mouse findings about channel regulation, not treatments for
  this disorder. A NaV1.8/NaV1.9 double-knockout study and a general
  sodium-channel-analgesia review are likewise about the target rather than the
  disease. All five were fetched by the research run, read, and their caches
  are not shipped. No prevalence rate: none exists in the literature, so only
  the qualitative band is claimed.

  Source defects reproduced rather than repaired. The cached abstract of
  PMID:30549873 carries line-break hyphenation artifacts from its source
  ("fa- tigue", "in- creasing", "var- iants"). Where a quote spans one of these,
  the artifact is reproduced exactly, because the snippet must be a true
  substring of the cited source and silently repairing a quote is worse than an
  ugly one.

  Review round two. The entry originally claimed there is no tissue damage at
  any point. That was wrong, and wrong against a source this entry already cited
  five times: skin biopsy in some patients shows reduced intraepidermal nerve
  fibre density and vacuolar degeneration of unmyelinated axons. The narrower
  claims were and are correct - nerve conduction studies are normal, imaging and
  inflammatory markers are normal, there is no joint pathology - and the error
  was generalizing from those to the whole nervous system when routine studies
  interrogate large fibres and the lesion is in the small ones. The claim is now
  scoped, and the small-fibre lesion is curated as histopathology.

  That correction changes the remission gap too. The same paragraph of the same
  review proposes that long-term NaV1.9 dysfunction may itself degenerate the
  unmyelinated fibres in patients whose pain remits - which would make the good
  prognosis and the nerve damage the same event. The gap previously said the
  remission was entirely unexplained, which understated what the literature
  offers; it now carries this candidate, hedged as its authors hedge it.

  Also in round two: the resting-potential node was bound to GO:0086010,
  membrane depolarization during action potential, which contradicted the node's
  own statement that NaV1.9 does not drive the action potential upstroke;
  GO:0051899 membrane depolarization is used instead. The myenteric node was
  bound to CL:0000101 sensory neuron, which was a second wrong binding after
  correctly rejecting the report's CL:0011103; myenteric neurons are motor and
  interneuron populations, and CL:0007011 enteric neuron is used. Four nodes now
  declare conforms_to against nociceptor_sodium_channel_excitability, whose
  description names this disease by mechanism and which three sibling entries
  already conform to. A diagnosis section was added covering panel sequencing
  and quantitative sensory testing, the latter being the objective correlate of
  the thermal sensitivity that defines the syndrome.

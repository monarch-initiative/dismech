      id: CL:0000198
      label: pain receptor cell
  - preferred_term: dorsal root ganglion sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: membrane depolarization
    term:
      id: GO:0051899
      label: membrane depolarization
    modifier: INCREASED
  evidence:
  - reference: PMID:31551682
    reference_title: "A Novel Gain-of-Function Nav1.9 Mutation in a Child With Episodic Pain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Current-clamp recordings in DRG neurons shows that N816K channels depolarize
      RMP of small DRG neurons by 7 mV
    explanation: Quantifies the resting-potential shift in the relevant neuron type.
  - reference: PMID:39836077
    reference_title: "Nociceptor sodium channels shape subthreshold phase, upstroke, and shoulder of action potentials."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Nav1.9, as it produces large persistent currents, is attributed a role
      in determining the resting membrane potential
    explanation: Establishes why this channel, and not another sodium channel, is the
      one that moves the resting potential.
  downstream:
  - target: Nociceptor Hyperexcitability with Reduced Firing Threshold
    causal_link_type: DIRECT
    description: A membrane closer to threshold fires on smaller inputs and fires more
      often.
    evidence:
    - reference: PMID:31551682
      reference_title: "A Novel Gain-of-Function Nav1.9 Mutation in a Child With Episodic Pain."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: reduce current threshold of firing an action potential and render DRG
        neurons hyperexcitable
      explanation: States the step from resting-potential change to reduced threshold
        and hyperexcitability.

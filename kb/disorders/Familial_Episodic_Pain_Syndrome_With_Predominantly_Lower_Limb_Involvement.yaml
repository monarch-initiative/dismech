name: Familial_Episodic_Pain_Syndrome_With_Predominantly_Lower_Limb_Involvement
category: Mendelian
creation_date: '2026-09-01T23:30:00Z'
description: >-
  Familial episodic pain syndrome 3 (FEPS3) is an autosomal dominant
  channelopathy caused by heterozygous gain-of-function missense variants in
  SCN11A, which encodes the tetrodotoxin-resistant voltage-gated sodium channel
  NaV1.9. NaV1.9 has the most hyperpolarized activation of any voltage-gated
  sodium channel and carries a large persistent current, so it sets the resting
  membrane potential of nociceptors rather than driving the action potential
  upstroke. A gain-of-function variant shifts activation further towards
  hyperpolarized potentials and enlarges the window current, depolarizing the
  resting potential of small-diameter dorsal root ganglion neurons, lowering
  their firing threshold, and rendering them hyperexcitable in a way that
  persists at cold temperatures. The clinical result is paroxysmal, severe pain
  of the distal limbs and predominantly the lower limbs, lasting fifteen to
  thirty minutes and recurring several times a day, triggered by fatigue, cold
  and falling weather. The affected region feels cold and warming it relieves
  the pain - the inverse of erythromelalgia, and the most useful bedside
  discriminator. Onset is in infancy or early childhood and episodes attenuate
  spontaneously around adolescence, so long-term disability is low and life
  expectancy is unaffected. Routine investigation is normal - nerve conduction
  studies, imaging and inflammatory markers - and there is no joint pathology
  despite the pain being localized to joints. The small fibres are a different
  matter: skin biopsy in some patients shows reduced intraepidermal nerve fibre
  density and degeneration of unmyelinated axons, so the disease is not purely
  a signalling abnormality.

phenotypes:
- name: Episodic pain
  category: Neurological
  description: >-
    Paroxysmal, severe pain lasting fifteen to thirty minutes and recurring
    several times a day, with complete freedom from pain between episodes. This
    is the defining feature and is present in essentially all affected
    individuals.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Episodic pain
    term:
      id: HP:0032148
      label: Episodic pain
  evidence:
  - reference: PMID:36051609

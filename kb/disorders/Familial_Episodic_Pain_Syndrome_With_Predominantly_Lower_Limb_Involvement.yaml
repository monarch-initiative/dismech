  evidence:
  - reference: PMID:31551682
    reference_title: "A Novel Gain-of-Function Nav1.9 Mutation in a Child With Episodic Pain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: significantly increases current density and hyperpolarizes voltage-dependence
      of activation by 10 mV, enabling a larger window current
    explanation: Quantifies the shift and the enlarged window current for a disease
      allele.
  - reference: PMID:39836077
    reference_title: "Nociceptor sodium channels shape subthreshold phase, upstroke, and shoulder of action potentials."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Nav1.9 exhibited the most hyperpolarized activation, while its fast inactivation
      resembled the depolarized inactivation of Nav1.8
    explanation: Establishes the wild-type baseline that the disease variants shift
      further, from a systematic comparison across nine channel subtypes.
  downstream:
  - target: Depolarized Resting Membrane Potential in Nociceptors
    causal_link_type: DIRECT
    description: Sustained subthreshold sodium influx near rest shifts the resting
      potential in the depolarizing direction.
    evidence:
    - reference: PMID:26645915
      reference_title: "Cold-aggravated pain in humans caused by a hyperactive NaV1.9 channel mutant."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Mutated channels diminish the resting membrane potential of mouse primary
        sensory neurons and cause cold-resistant hyperexcitability of nociceptors
      explanation: Links the gating change to the resting-potential change in sensory
        neurons.
- name: Depolarized Resting Membrane Potential in Nociceptors
  biological_scale: CELLULAR
  description: >-
    Small-diameter dorsal root ganglion neurons sit closer to threshold than
    they should. NaV1.9 is the channel that normally sets this potential, which
    is why a gating change in it moves the resting potential rather than the
    action potential upstroke.
  cell_types:
  - preferred_term: nociceptor

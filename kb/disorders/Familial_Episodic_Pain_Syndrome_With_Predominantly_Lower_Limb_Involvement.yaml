inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous gain-of-function missense variants segregate with the pain
    phenotype through multiple generations; unaffected relatives do not carry
    them.
  evidence:
  - reference: PMID:30549873
    reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This unique phenotype was inherited in an autosomal-dominant mode
    explanation: States the inheritance mode across six multigenerational Japanese
      families.
  - reference: PMID:39058404
    reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This variant was confirmed in other affected members but not in the unaffected
      father
    explanation: Segregation in a four-generation pedigree, with the variant absent
      from the unaffected parent.
genetic:
- name: SCN11A
  gene_term:
    preferred_term: SCN11A
    term:
      id: hgnc:10583
      label: SCN11A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:30549873
    reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: p.R222S and p.R222H, were identified in SCN11A by linkage analysis
    explanation: Gene identification by linkage and exome sequencing in the founding
      Japanese families.
  - reference: PMID:36051609
    reference_title: "Familial Episodic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FEPS at least includes four subtypes of FEPS1, FEPS2, FEPS3, and FEPS4,
      which are caused by mutations in the TRPA1, SCN10A, SCN11A, and SCN9A genes,
      respectively
    explanation: Places SCN11A as the FEPS3 gene within the four-subtype classification,
      which is what fixes this entry's scope.
  variants:
  - name: p.Arg222His
    description: The most frequently reported allele and a founder mutation in the
      Tohoku region of Japan, seen in seven of forty-eight families in the largest
      series.
    functional_effects:
    - function: NaV1.9 voltage-gated sodium channel gating
      description: Gain of function.
    evidence:
    - reference: PMID:30557356
      reference_title: "Familial episodic limb pain in kindreds with novel Nav1.9 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A founder mutation, SCN11A p.R222H was confirmed to be frequently observed
        in patients with FEP in the Tohoku region of Japan
      explanation: Establishes both the recurrence and the founder effect.
  - name: p.Arg222Ser
    description: The second allele identified in the founding series, and the one modelled
      as a knock-in mouse.
    functional_effects:
    - function: NaV1.9 voltage-gated sodium channel gating
      description: Gain of function, demonstrated in a knock-in mouse.
    evidence:
    - reference: PMID:30549873
      reference_title: "[Paroxysmal limb intolerable pain (infantile pain episodes associated with novel Nav1.9 mutations in familial episodic pain syndrome)]."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These results suggest that the novel mutation reported herein is a
        gain-of-function mu- tation that causes infantile familial episodic pain
      explanation: Assigns the gain-of-function consequence from the knock-in mouse
        experiments.
  - name: p.Arg225Cys
    description: Reported in a four-generation Chinese family in which early-onset
      episodic pain co-segregated with adult-onset essential tremor.
    functional_effects:
    - function: NaV1.9 voltage-gated sodium channel gating
      description: Gain of function.
    evidence:
    - reference: PMID:28298626
      reference_title: "Gain-of-function mutation p.Arg225Cys in SCN11A causes familial episodic pain and contributes to essential tremor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified a missense mutation of p.Arg225Cys in SCN11A in a four-generation
        Chinese family with early-onset familial episodic pain and adult onset familial
        essential tremor syndrome
      explanation: Reports the allele and the co-segregating tremor phenotype.
  - name: p.Phe814Cys and p.Phe1146Ser
    description: Two novel alleles from the forty-two-family Japanese expansion series,
      each validated by an orthologous knock-in mouse.
    functional_effects:
    - function: NaV1.9 voltage-gated sodium channel gating
      description: Gain of function, demonstrated by increased resting membrane potential
        and firing frequency in orthologous knock-in mice.
    evidence:
    - reference: PMID:30557356
      reference_title: "Familial episodic limb pain in kindreds with novel Nav1.9 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These results suggest a higher level of excitability in the F802C or
        F1125S mice than in WT, and indicate that these novel mutations are gain of
        function mutations
      explanation: Functional validation of both alleles through their mouse orthologues.
  - name: p.Val1184Ala
    description: Identified by exome sequencing in a European case with cold-aggravated
      peripheral pain, and the allele on which the cold-resistant hyperexcitability
      mechanism was demonstrated.
    functional_effects:
    - function: NaV1.9 voltage-gated sodium channel gating
      description: Gain of function through hyperpolarized shift in voltage dependence
        of opening.
    evidence:
    - reference: PMID:26645915
      reference_title: "Cold-aggravated pain in humans caused by a hyperactive NaV1.9 channel mutant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Applying whole-exome sequencing we here identify a missense change (p.V1184A)
        in NaV1.9, which leads to cold-aggravated peripheral pain in humans
      explanation: Reports the allele and its distinctive cold-aggravated phenotype.
  - name: p.Asn816Lys
    description: Reported in a child with early-onset episodic pain in both legs together
      with episodic abdominal pain and chronic constipation, which is the allele linking
      the enteric branch of the phenotype to the channel.
    functional_effects:
    - function: NaV1.9 voltage-gated sodium channel gating
      description: Gain of function through increased current density and a ten-millivolt
        hyperpolarizing shift in activation, enlarging the window current.
    evidence:
    - reference: PMID:31551682
      reference_title: "A Novel Gain-of-Function Nav1.9 Mutation in a Child With Episodic Pain."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Voltage-clamp recordings demonstrate that Nav1.9-N816K significantly
        increases current density and hyperpolarizes voltage-dependence of activation
        by 10 mV, enabling a larger window current
      explanation: Quantifies the biophysical gain of function for this allele.
  - name: p.Leu811Phe
    description: >-
      A novel allele in a four-generation Japanese pedigree, and the more
      informative half of a residue that diverges by substitution: p.Leu811Phe
      causes episodic pain while p.Leu811Pro at the same residue causes
      congenital insensitivity to pain.
    functional_effects:
    - function: NaV1.9 voltage-gated sodium channel gating
      description: Increases the structural stability of NaV1.9 and impedes the conformational
        changes required for normal gating, by molecular dynamics simulation.
    evidence:
    - reference: PMID:39058404
      reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Sequencing of SCN9A, SCN10A, and SCN11A in the proband revealed a novel
        heterozygous variant of SCN11A: g.38894937G>A (c.2431C>T, p.Leu811Phe)'
      explanation: Reports the allele and the genes excluded before it was called.
    - reference: PMID:39058404
      reference_title: "Familial Episodic Pain Syndrome: A Japanese Family Harboring the Novel Variant c.2431C>T (p.Leu811Phe) in SCN11A."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: Molecular dynamics simulations showed that p.Leu811Phe increased the
        structural stability of Nav1.9 and prevented the necessary conformational changes
      explanation: The proposed structural basis, from simulation rather than from
        electrophysiology.
  notes: >-
    Variants are point missense throughout; no frameshift, nonsense or
    structural variant has been reported for the episodic-pain phenotype, which
    is consistent with a mechanism that requires an altered channel rather than
    an absent one. The most instructive fact in the allelic series is that
    SCN11A is pleiotropic in a graded way: moderate gain of function gives
    episodic pain, while extreme gain of function gives congenital insensitivity
    to pain through sustained depolarization block. Leu811 shows this within a
    single residue.
pathophysiology:
- name: Heterozygous SCN11A Gain-of-Function Variant
  biological_scale: MOLECULAR
  conforms_to: "nociceptor_sodium_channel_excitability#Nociceptor Voltage-Gated Sodium Channel Variant"
  description: >-
    A germline missense variant in one SCN11A allele alters the NaV1.9 channel
    protein. The variant class matters: these are point substitutions that
    change gating, not alleles that remove the channel.
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:26645915
    reference_title: "Cold-aggravated pain in humans caused by a hyperactive NaV1.9 channel mutant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Gain-of-function mutations in the human SCN11A-encoded voltage-gated Na(+)
      channel NaV1.9 cause severe pain disorders
    explanation: States the causal relationship between gain-of-function SCN11A variants
      and pain disorders.
  downstream:
  - target: Hyperpolarized NaV1.9 Activation with Enlarged Window Current
    causal_link_type: DIRECT
    description: The substitution alters channel gating directly, as measured by voltage
      clamp on the mutant channel.
    evidence:
    - reference: PMID:26645915
      reference_title: "Cold-aggravated pain in humans caused by a hyperactive NaV1.9 channel mutant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Electrophysiological analysis reveals that p.V1184A shifts the voltage
        dependence of channel opening to hyperpolarized potentials thereby conferring
        gain-of-function characteristics to NaV1.9
      explanation: Direct measurement of the gating change caused by the variant.
- name: Hyperpolarized NaV1.9 Activation with Enlarged Window Current
  biological_scale: MOLECULAR
  conforms_to: "nociceptor_sodium_channel_excitability#Enhanced or Persistent Nociceptor Sodium Current"
  description: >-
    The mutant channel opens at more negative potentials than wild type and
    carries a larger persistent or window current, so more channels are open
    near the resting potential. This is the whole biophysical lesion; everything
    downstream follows from it.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:

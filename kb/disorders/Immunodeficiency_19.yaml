inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CD3D variants. Reported patients are homozygous, frequently born
    to consanguineous parents or within endogamous communities; heterozygous
    parents and siblings carrying one allele are clinically unaffected. Three
    recurrent alleles segregate with ancestry (Mennonite, Japanese, Ecuadorian),
    which the transplant series reads as separate founder effects rather than as
    a mutational hotspot.
  evidence:
  - reference: PMID:15546002
    reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the epsilon subunit of CD3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consanguinity, sex ratio, and absence of the phenotype in heterozygous carriers demonstrate autosomal recessive inheritance of the defects.
    explanation: >-
      States the inheritance mode directly, from the segregation observed in the
      three families in which CD3D and CD3E deficiency were defined.
  - reference: PMID:21757226
    reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three different mutations have been identified which segregate according to ethnic origin suggesting a different founder effect in each group (Table 1).
    explanation: >-
      Records the founder structure of the recurrent alleles across the largest
      assembled patient series.
has_subtypes:
- name: Complete deficiency
  display_name: Complete CD3delta deficiency (T-B+NK+ SCID)
  description: >-
    Nonsense or splice-acceptor alleles that abolish usable CD3delta. Thymocyte
    development is blocked and no alpha-beta or gamma-delta T cells reach the
    circulation. This is the form in which the disorder was defined and the one
    the older literature describes.
  genes:
  - preferred_term: CD3D
    term:
      id: hgnc:1673
      label: CD3D
  evidence:
  - reference: PMID:17277165
    reference_title: Differential biological role of CD3 chains revealed by human immunodeficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In contrast, all reported human complete CD3delta (or CD3epsilon) deficiencies are in infants with life-threatening SCID and very severe alphabeta and gammadelta T lymphocytopenia.
    explanation: >-
      States that every complete deficiency reported at that time was
      life-threatening SCID with loss of both T-cell lineages, which is what
      makes "complete" the load-bearing qualifier separating these two subtypes.
- name: Leaky splice allele
  display_name: Leaky CD3delta deficiency (Talphabeta-Tgammadelta+B+NK+ SCID)
  description: >-
    The homozygous IVS2+5G>A splice-donor allele, reported in two unrelated
    Ecuadorian children and, as c.274+5G>A, in the two Omenn-syndrome patients
    of the transplant series. It reduces but does not abolish CD3D transcript
    and CD3delta protein in T cells - enough for gamma-delta selection but not
    for alpha-beta selection, so the immunophenotype is
    Talphabeta-Tgammadelta+B+NK+ rather than T-B+NK+. The residual alpha-beta
    compartment is oligoclonal and T-cell help to B cells is impaired, so the
    leaky form is still a SCID.
  genes:
  - preferred_term: CD3D
    term:
      id: hgnc:1673
      label: CD3D
  evidence:
  - reference: PMID:21926461
    reference_title: A leaky mutation in CD3D differentially affects αβ and γδ T cells and leads to a Tαβ-Tγδ+B+NK+ human SCID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report 2 unrelated cases of SCID with a selective block in αβ but not in γδ T cell development, associated with a new splicing mutation in the CD3D gene.
    explanation: >-
      Defines the subtype: a CD3D splicing allele with a lineage-selective
      developmental block rather than a complete one.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists for CD3delta deficiency. A 2025 review of the
    CD3-subunit deficiencies assembled 18 CD3delta patients from the whole
    literature, which is the best available count; within genetically solved
    T-B+NK+ SCID cohorts the gene accounts for one or two patients at a time
    (two of nine in one North American series). Those denominators are
    ascertainment-selected SCID cohorts rather than populations, so no rate is
    recorded.
  evidence:
  - reference: PMID:40147628
    reference_title: Five Patients With Two Novel Homozygous Variants in CD3 Subunits and Comprehensive Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Our review of the medical literature revealed 11, 12, 18, and three patients with CD3ε, CD3γ, CD3δ, and CD3ζ deficiency, respectively.
    explanation: >-
      The literature-wide patient count for CD3delta deficiency, and the basis
      for the CASES_IN_LITERATURE measure.
  - reference: PMID:21883749
    reference_title: "Genotype, phenotype, and outcomes of nine patients with T-B+NK+ SCID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IL7R mutations were documented in four patients and CD3D mutations in two others.
    explanation: >-
      The CD3D share of one genetically characterised T-B+NK+ SCID cohort,
      showing how sparse the gene is even within its own immunophenotype.
pathophysiology:
- name: Biallelic CD3D Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous nonsense and splice-site variants in CD3D. The alleles that
    define the disorder are nonsense changes truncating the extracellular domain
    (C93X, R68X - the latter recurrent in Mennonite families as c.202C>T) and a
    splice-acceptor change in intron 2 (IVS2-2A>G) in a Japanese family. A
    separate splice-donor allele at the same intron, IVS2+5G>A, is hypomorphic
    rather than null and is curated as its own branch below.
  genes:
  - preferred_term: CD3D
    term:
      id: hgnc:1673
      label: CD3D
  evidence:
  - reference: PMID:15546002
    reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the epsilon subunit of CD3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients and affected fetuses from 2 families were homozygous for a mutation in the CD3D gene, and patients from the third family were homozygous for a mutation in the CD3E gene.
    explanation: >-
      The genotypes in the families in which CD3delta deficiency was
      characterised alongside CD3epsilon deficiency.
  - reference: PMID:15729559
    reference_title: Severe combined immunodeficiency caused by a splicing abnormality of the CD3delta gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a novel homozygous mutation in the splicing acceptor site of intron 2 (IVS2-2A --> G) in these patients.
    explanation: >-
      An independent splice-acceptor allele, extending the spectrum beyond the
      nonsense changes.
  downstream:
  - target: Loss of the CD3delta Chain
    description: >-
      Nonsense and splice-acceptor alleles abolish production of a usable
      CD3delta polypeptide, which is what the complete deficiency consists of.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16264327
      reference_title: CD3 deficiencies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Homozygous mutations in CD3D and CD3E genes lead to a complete block in T-cell development and thus to an early-onset severe combined immunodeficiency phenotype.
      explanation: >-
        Links homozygous CD3D genotypes to the complete loss of chain function
        that the rest of the chain follows from.
  - target: Residual CD3delta from a Leaky Splice Allele
    description: >-
      The IVS2+5G>A donor-site allele reduces rather than abolishes CD3D
      transcript, leaving some CD3delta protein in the patients' T cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21926461
      reference_title: A leaky mutation in CD3D differentially affects αβ and γδ T cells and leads to a Tαβ-Tγδ+B+NK+ human SCID.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The patients' T cells showed reduced CD3D transcripts, CD3δ proteins, surface TCR, and early TCR signaling.
      explanation: >-
        Measured on the patients' T cells: transcript and protein are reduced,
        not absent, which is what makes this allele hypomorphic rather than
        null.
- name: Loss of the CD3delta Chain
  biological_scale: MOLECULAR
  description: >-
    Absence of the CD3delta polypeptide. CD3delta is one of the invariant chains
    of the pre-TCR and of both mature receptor isotypes, carried into each as the
    CD3delta-epsilon dimer, so its loss removes a component every receptor on a
    developing thymocyte needs.
  evidence:
  - reference: PMID:36944331
    reference_title: Human T cell generation is restored in CD3δ severe combined immunodeficiency through adenine base editing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      CD3δ SCID is a devastating inborn error of immunity caused by mutations in CD3D, encoding the invariant CD3δ chain of the CD3/TCR complex necessary for normal thymopoiesis.
    explanation: >-
      States the structural role of the missing chain and that thymopoiesis
      depends on it.
  downstream:
  - target: Failure of pre-TCR and TCR Complex Assembly
    description: >-
      Without CD3delta the delta-epsilon dimer cannot form, so a complete
      receptor cannot be assembled and signalled through.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15546002
      reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the epsilon subunit of CD3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This indicates that CD3delta plays an essential role in promoting progression of early thymocytes toward double-positive stage.
      explanation: >-
        The functional consequence attributed to the missing chain at the
        receptor level in thymocytes.
- name: Residual CD3delta from a Leaky Splice Allele
  biological_scale: MOLECULAR
  description: >-
    The hypomorphic branch. The splice-donor allele causes exon 2 skipping in
    most transcripts, but some correctly spliced transcript remains, so T cells
    carry a reduced amount of CD3delta rather than none. This is the
    mechanistic reason severity in this disorder is graded, and it is curated
    separately because its downstream chain differs from the null branch: a
    lineage-selective block rather than an absolute one.
  evidence:
  - reference: PMID:36944331
    reference_title: Human T cell generation is restored in CD3δ severe combined immunodeficiency through adenine base editing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      A homozygous mutation in the splice donor site of intron 2 leads to abnormal splicing and exon 2 skipping (CD3D c.274+5G>A).
    explanation: >-
      Names the mis-spliced product of the leaky allele. The base-editing paper
      restates the patient genetics in a figure legend rather than measuring it,
      hence BACKGROUND.
  - reference: PMID:21926461
    reference_title: A leaky mutation in CD3D differentially affects αβ and γδ T cells and leads to a Tαβ-Tγδ+B+NK+ human SCID.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The patients' T cells showed reduced CD3D transcripts, CD3δ proteins, surface TCR, and early TCR signaling.
    explanation: >-
      Transcript and protein are reduced rather than absent in the patients' T
      cells, which is the residual function this node records.
  downstream:
  - target: Selective Block of Alpha-Beta T-Cell Selection
    description: >-
      Reduced CD3delta is sufficient for gamma-delta selection but not for
      alpha-beta selection in the human thymus.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21926461
      reference_title: A leaky mutation in CD3D differentially affects αβ and γδ T cells and leads to a Tαβ-Tγδ+B+NK+ human SCID.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analysis of individuals with this CD3D mutation thus demonstrates the contrasting CD3δ requirements for αβ versus γδ T cell development and TCR expression in humans
      explanation: >-
        The authors' conclusion that alpha-beta and gamma-delta development
        need different amounts of CD3delta, which is why a reduced amount blocks
        one lineage and spares the other.
- name: Failure of pre-TCR and TCR Complex Assembly
  biological_scale: MOLECULAR
  description: >-
    An incomplete receptor complex on developing thymocytes. The pre-TCR and the
    mature receptors all require the CD3delta-epsilon dimer, so the signals that
    drive progression and selection are not transmitted.
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:15546002
    reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the epsilon subunit of CD3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Intrathymic T lymphocyte differentiation requires appropriate signals from the pre-TCR (PreTα/TCRβ) and/or the TCR (TCRα/β or TCRγ/δ) (12–14).
    explanation: >-
      States the receptor-signal requirement that an incomplete CD3 complex
      fails to meet. The sentence is the paper's framing of established
      thymocyte biology rather than its own result, hence BACKGROUND.
  downstream:
  - target: Arrest of Thymocyte Development
    description: >-
      Thymocytes that cannot signal through the pre-TCR do not proliferate or
      progress past the intermediate single-positive stage.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16264327
      reference_title: CD3 deficiencies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Thymic studies have shown that the defect in T-cell development occurs at the transition between 'double-negative' and 'double-positive' thymocytes.
      explanation: >-
        Places the resulting arrest in thymocyte development, as read off the
        examined patient and fetal thymi.
- name: Arrest of Thymocyte Development
  biological_scale: CELLULAR
  description: >-
    Intrathymic arrest. The thymi of two affected fetuses lacked corticomedullary
    differentiation and showed very few Hassall corpuscles; thymocytes were
    abundant but were CD4+ CD8- CD45RO- intermediate single-positive cells with
    strongly reduced proliferation, so development stops at or just before entry
    to the double-positive stage. In patients rather than fetuses the same arrest
    is inferred from undetectable thymic output.
  cell_types:
  - preferred_term: intermediate CD4 single-positive thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
    modifier: DECREASED
  evidence:
  - reference: PMID:15546002
    reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the epsilon subunit of CD3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The thymus from a CD3delta-deficient fetus was analyzed and revealed that T cell differentiation was blocked at entry into the double positive (CD4+CD8+) stage with the accumulation of intermediate CD4-single positive cells.
    explanation: >-
      The directly observed arrest stage in a CD3delta-deficient human thymus.
  downstream:
  - target: Absence of Circulating T Cells
    description: >-
      With thymopoiesis blocked, no mature T cells of either lineage are
      exported to the periphery.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21757226
      reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        T cell receptor excision circles (TREC), a reflection of thymopoiesis were undetectable in all 4 patients tested.
      explanation: >-
        The absent thymic output that connects the intrathymic arrest to the
        empty peripheral compartment.
  - target: Abnormally low T cell receptor excision circle level
    description: >-
      The blocked thymus produces no new T cells, so the TREC assay that
      measures thymic output reads undetectable.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21757226
      reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        T cell receptor excision circles (TREC), a reflection of thymopoiesis were undetectable in all 4 patients tested.
      explanation: >-
        The undetectable TREC readout that the arrest produces, and the basis of
        newborn detection.
  - target: Thymus Loaded with Arrested Progenitors
    description: >-
      Because the block is intrathymic rather than a failure of thymic
      organogenesis, the organ can fill with progenitors that cannot mature.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21757226
      reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Unlike other types of SCID, the thymus in CD3δ was detected by ultrasound and appeared heavily populated with early T cell progenitors, in contrast with the marked peripheral lymphopenia.
      explanation: >-
        Records the loaded thymus as the direct consequence of an arrest that
        leaves the organ intact.
- name: Thymus Loaded with Arrested Progenitors
  biological_scale: TISSUE
  description: >-
    A thymus that is present, imageable and full of early T-cell progenitors
    while the blood is lymphopenic. This is a diagnostic trap - a visible thymus
    does not exclude SCID here - and a transplant consideration, since residual
    host progenitors occupying the thymic niche are part of why substantial
    conditioning appears to be needed. Thymic size is not the marker: the organ
    can be loaded regardless of its radiographic size. Small thymi have been
    reported (on chest imaging in one family, and by weight in the affected
    fetuses), but those same fetal thymi were abundantly populated with
    CD3epsilon-positive thymocytes, so a small size is compatible with a loaded
    organ rather than evidence against one; autopsy thymi are further depleted by
    preceding illness and immunosuppression.
  evidence:
  - reference: PMID:21757226
    reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thymic tissue shows marked accumulation of early T cell progenitors, mostly CD4/CD8 double negative cells, and a lack of Hassall’s corpuscles.
    explanation: >-
      The histological content of the loaded thymus - progenitors that
      accumulate because they cannot mature.
  - reference: PMID:15729559
    reference_title: Severe combined immunodeficiency caused by a splicing abnormality of the CD3delta gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chest X-ray films and computed tomography revealed small sized thymuses in these patients.
    explanation: >-
      A small radiographic thymus in one family, which is why the entry treats
      thymic size as uninformative rather than reassuring.
  - reference: PMID:15546002
    reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the epsilon subunit of CD3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      their density was reduced by 40% in comparison with that of normal thymus
    explanation: >-
      The affected fetal thymi were small yet still populated with thymocytes at
      60% of normal density, so small size and a loaded organ coexist rather than
      conflict.
- name: Selective Block of Alpha-Beta T-Cell Selection
  biological_scale: CELLULAR
  description: >-
    The leaky-allele counterpart of the complete arrest. Alpha-beta thymocyte
    selection fails while gamma-delta selection proceeds, so the scant
    peripheral alpha-beta T cells are oligoclonal, recent thymic emigrants are
    strongly decreased, and gamma-delta cells are present.
    Counterintuitively, surface receptor density is lower on the gamma-delta
    cells that survive than on the alpha-beta cells, so selection and surface
    expression are separately affected.
  cell_types:
  - preferred_term: alpha-beta T cell
    term:
      id: CL:0000789
      label: alpha-beta T cell
  biological_processes:
  - preferred_term: alpha-beta T cell differentiation
    term:
      id: GO:0046632
      label: alpha-beta T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:21926461
    reference_title: A leaky mutation in CD3D differentially affects αβ and γδ T cells and leads to a Tαβ-Tγδ+B+NK+ human SCID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report 2 unrelated cases of SCID with a selective block in αβ but not in γδ T cell development, associated with a new splicing mutation in the CD3D gene.
    explanation: >-
      States the lineage-selective developmental block that defines this node.
  - reference: PMID:21926461
    reference_title: A leaky mutation in CD3D differentially affects αβ and γδ T cells and leads to a Tαβ-Tγδ+B+NK+ human SCID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strikingly, despite the specific loss of αβ T cells, surface TCR expression was more reduced in γδ than in αβ T cells.
    explanation: >-
      Supports the separate effect on surface receptor density described
      above: it is lower on the spared gamma-delta cells than on the alpha-beta
      cells.
  downstream:
  - target: Decreased total T cell count with preserved gamma-delta T cells

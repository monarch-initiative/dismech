differential_diagnoses:
- name: Immunodeficiency 18
  description: >-
    CD3epsilon deficiency, the chain CD3delta pairs with. The two are
    clinically and immunophenotypically indistinguishable at the null end -
    both give T-B+NK+ SCID in infancy - and were characterised together in the
    same study. They are separated by sequencing, not by phenotype. The one
    asymmetry is that CD3epsilon partners both CD3gamma and CD3delta, so its
    loss removes two dimers rather than one; and the reported CD3epsilon
    spectrum includes a hypomorphic presentation with preserved T cells and
    reduced surface receptor, which CD3delta's leaky allele does not reproduce
    (there the residual compartment is lineage-restricted instead).
  disease_term:
    preferred_term: immunodeficiency 18
    term:
      id: MONDO:0014278
      label: immunodeficiency 18
  evidence:
  - reference: PMID:15546002
    reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the epsilon subunit of CD3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients and affected fetuses from 2 families were homozygous for a mutation in the CD3D gene, and patients from the third family were homozygous for a mutation in the CD3E gene.
    explanation: >-
      The two disorders being separated within one study by genotype alone, on
      an indistinguishable immunophenotype.
- name: Combined immunodeficiency due to CD3gamma deficiency
  description: >-
    The third invariant chain, and the boundary that defines this entry's
    severity. CD3gamma deficiency shares the biochemical lesion - an incomplete
    TCR/CD3 complex - but does not block thymopoiesis: T-cell numbers are
    normal or mildly reduced with low surface receptor, and immune
    dysregulation and autoimmunity dominate over infection, sometimes as the
    sole manifestation. The published comparison of the human deficiencies ranks
    CD3delta above CD3gamma in impact.
  disease_term:
    preferred_term: combined immunodeficiency due to CD3gamma deficiency
    term:
      id: MONDO:0014276
      label: combined immunodeficiency due to CD3gamma deficiency
  evidence:
  - reference: PMID:17277165
    reference_title: Differential biological role of CD3 chains revealed by human immunodeficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose a CD3delta >> CD3gamma hierarchy for the relative impact of their absence on the signaling for T cell production in humans.
    explanation: >-
      The explicit ranking of the two chains' impact on human T-cell production,
      which is the mechanistic content of this differential.
animal_models:
- name: Cd3d-null mouse
  species: Mouse
  genotype: Cd3d null (targeted deletion of the CD3 delta chain)
  publication: PMID:9135151
  description: >-
    The mouse line lacking CD3delta. It is cited here for what it does not
    reproduce: pre-TCR-mediated and gamma-delta development proceed normally,
    and the block falls at the double-positive to single-positive selection
    transition - later than, and functionally different from, the human arrest
    before the double-positive stage with loss of both lineages. The
    discordance is the reason the human thymic histology rather than the mouse
    is the basis of the pathophysiology chain above.
  modeled_mechanisms:
  - target: Arrest of Thymocyte Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The knockout arrests thymocyte development, but at a later checkpoint and
      in one lineage only, so it identifies a requirement for CD3delta without
      reproducing the human block.
    limitations: >-
      Species divergence is the whole point of this model's citation: the mouse
      spares gamma-delta development and blocks the double-positive to
      single-positive transition, whereas human complete CD3delta deficiency
      lacks both lineages and arrests at entry to the double-positive stage. The
      human leaky allele resembles the mouse phenotype, so the knockout is a
      better model of the hypomorph than of the null it was long read as
      modelling.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        The lineage requirement itself differs between species. In the mouse
        CD3delta is dispensable for pre-TCR and gamma-delta steps; in humans its
        complete absence removes alpha-beta and gamma-delta T cells alike. An
        arrest stage transferred from this model to the human disorder would be
        wrong about which cells are lost and at which checkpoint.
    readouts:
    - name: Progression from double-positive to single-positive thymocytes
      target: Arrest of Thymocyte Development
      direction: ABOLISHED
      interpretation: >-
        Locates the mouse requirement for CD3delta at thymic selection rather
        than at the pre-TCR checkpoint.
      evidence:
      - reference: PMID:9135151
        reference_title: CD3 delta deficiency arrests development of the alpha beta but not the gamma delta T cell lineage.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Absence of CD3 delta specifically blocks the thymic selection processes that mediate the transition from the double-positive to single-positive stages of development.
        explanation: >-
          The measured arrest point in the knockout.
    evidence:
    - reference: PMID:9135151
      reference_title: CD3 delta deficiency arrests development of the alpha beta but not the gamma delta T cell lineage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In particular, CD3 delta is not needed for steps in development mediated by pre-TCR or gamma delta TCR, but is required for further development of thymocytes expressing alpha beta TCR.
      explanation: >-
        The lineage-restricted mouse requirement, against which the human
        phenotype is discordant.
discussions:
- discussion_id: gap_cd3d_arrest_stage_two_studies
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Where exactly does thymocyte development arrest in human CD3delta
    deficiency - at the pre-TCR checkpoint or at the intermediate
    single-positive stage just before the double-positive transition?
  attaches_to:
  - pathophysiology#Arrest of Thymocyte Development
  - pathophysiology#Failure of pre-TCR and TCR Complex Assembly
  rationale: >-
    The two studies that examined CD3delta-deficient human thymic tissue do not
    agree on the stage. The earlier one, on infant thymi, placed the block at
    pre-TCR expression from reduced CD4 and CD8 message and protein; the later
    one, on fetal thymi, found abundant CD3epsilon-positive
    CD4+ CD45RO- CD8- intermediate single-positive cells with strongly reduced
    proliferation, and
    placed the block slightly later, at the ISP stage. The authors of the second
    study attribute the difference to the tissue examined (infant versus fetal)
    and to the analysis method rather than to a biological disagreement, and
    suggest that some pre-TCR-positive thymocytes may survive to the ISP stage in
    the absence of CD3delta. A third reading exists: the transplant series,
    summarising a biopsy and an autopsy, reports the arrest at the CD4/CD8
    double-negative stage - earlier than either primary study places it. No
    further human thymus has been examined since. The distinction is not
    academic: it determines whether the failing signal is the pre-TCR survival
    and proliferation signal or the subsequent progression signal, and the mouse
    cannot settle it because its arrest is at a different checkpoint again.
  evidence:
  - reference: PMID:15546002
    reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the epsilon subunit of CD3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some PreT α+/TCRβ+ thymocytes survive and progress up to the stage of ISP cells.
    explanation: >-
      The later study's own hedge on how the two thymic results can be
      reconciled, which is the open question this gap records.
  - reference: PMID:16264327
    reference_title: CD3 deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Thymic studies have shown that the defect in T-cell development occurs at the transition between 'double-negative' and 'double-positive' thymocytes.
    explanation: >-
      The review's summary, which resolves the two studies into a single
      double-negative-to-double-positive statement - a compression that is part
      of why the finer disagreement is easy to miss.
  - reference: PMID:21757226
    reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a thymus biopsy performed in one patient as well as analysis of a thymus at autopsy on another patient revealed an arrest at the CD4/CD8 double negative stage of thymocyte development
    explanation: >-
      A third placement of the arrest, at the double-negative stage - earlier
      than either primary study - summarised by the transplant series from a
      biopsy and an autopsy.

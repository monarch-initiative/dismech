- name: Newborn screening by T-cell receptor excision circle quantitation
  description: >-
    TREC measurement in a dried blood spot. Because the complete deficiency
    blocks thymopoiesis outright, TRECs are absent and the disorder is
    detectable at birth; a CD3delta-deficient newborn was among the T-negative
    SCID patients with zero TRECs in a retrospective Guthrie-card study. The
    leaky form, in which some thymic output persists, is not reliably detectable
    this way.
  results: Undetectable TRECs.
  diagnosis_term:

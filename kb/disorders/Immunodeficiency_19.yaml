phenotypes:
- name: Severe combined immunodeficiency
  category: Immunologic
  diagnostic: true
  frequency: OBLIGATE
  description: >-
    The defining clinical phenotype: profound T-cell deficiency with preserved
    B- and NK-cell numbers, presenting in the first months of life and fatal
    without immune reconstitution. A 2025 literature review of the CD3-subunit
    deficiencies found that CD3delta patients present as classic SCID, in
    contrast to CD3gamma deficiency, which may present as a milder combined
    immunodeficiency or as autoimmunity alone.
  phenotype_term:
    preferred_term: Severe combined immunodeficiency
    term:
      id: HP:0004430
      label: Severe combined immunodeficiency
  evidence:
  - reference: PMID:40147628
    reference_title: Five Patients With Two Novel Homozygous Variants in CD3 Subunits and Comprehensive Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Our results show that patients with CD3δ, CD3ε, and CD3ζ deficiencies typically present with a classic SCID phenotype.
    explanation: >-
      The literature-wide statement that CD3delta deficiency is a classic SCID.
  - reference: PMID:16264327
    reference_title: CD3 deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Homozygous mutations in CD3D and CD3E genes lead to a complete block in T-cell development and thus to an early-onset severe combined immunodeficiency phenotype.
    explanation: >-
      Links the genotype to early-onset SCID.
- name: Absent circulating T cells
  category: Immunologic
  diagnostic: true
  subtype: Complete deficiency
  description: >-
    The T-B+NK+ flow-cytometry pattern of the complete deficiency: no detectable
    CD3-positive cells of either lineage, B cells at or above the upper limit of
    normal, NK cells present. This is the result that selects a SCID gene panel,
    and in the largest series all but the two leaky-allele patients had fewer
    than 500 circulating CD3+ cells per microlitre.
  phenotype_term:
    preferred_term: Absent circulating T cells
    term:
      id: HP:0025805
      label: Absent circulating T cells
  evidence:
  - reference: PMID:15729559
    reference_title: Severe combined immunodeficiency caused by a splicing abnormality of the CD3delta gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients lacked T-cells with normal numbers of B-cells and natural killer cells in peripheral blood.
    explanation: >-
      The measured T-B+NK+ pattern in a genetically confirmed family.
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CD3 deficiency CD3D AR 186790 Very lowN ormalL ow Normal NK, no  T cells

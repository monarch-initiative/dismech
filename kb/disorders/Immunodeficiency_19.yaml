name: Immunodeficiency 19
creation_date: "2026-09-24T08:00:00Z"
category: Mendelian
synonyms:
- IMD19
- immunodeficiency type 19
- CD3-Delta deficiency
- CD3delta deficiency
- CD3D severe combined immunodeficiency
- SCID, T cell-negative, B cell-positive, NK cell-positive
description: >-
  Immunodeficiency 19 is an ultra-rare autosomal recessive severe combined
  immunodeficiency caused by biallelic loss-of-function variants in CD3D, the
  gene encoding the CD3delta invariant chain of the T-cell receptor (TCR)/CD3
  complex. CD3delta pairs with CD3epsilon in the pre-TCR and in both mature
  receptor isotypes, and in humans it is required early in thymopoiesis:
  thymocyte development arrests around entry to the CD4+CD8+ double-positive
  stage, and affected infants have no circulating alpha-beta or gamma-delta T
  cells while B and NK cells are present in normal or high numbers - the
  T-B+NK+ pattern. Presentation is in the first months of life with
  opportunistic and viral infection (Pneumocystis pneumonitis,
  cytomegalovirus), chronic diarrhoea, candidiasis and failure to thrive, and
  the disorder is fatal without allogeneic haematopoietic stem cell
  transplantation.

  Two features distinguish the entry from its CD3 siblings. First, the thymus is
  not characteristically absent: it can be detectable on imaging and loaded with
  early progenitors that cannot progress, so an easily seen thymus does not
  argue against the diagnosis, and residual host progenitors occupying the
  thymic niche are a consideration in choosing transplant conditioning. Second,
  the disorder is not phenotypically uniform. A leaky splice-donor allele
  (IVS2+5G>A) reduces rather than abolishes correctly spliced CD3D transcript
  and blocks alpha-beta but not gamma-delta selection, giving a
  Talphabeta-Tgammadelta+B+NK+ SCID; the same allele accounts for the two
  reported patients who presented with the erythroderma, lymphadenopathy,
  eosinophilia and raised IgE of Omenn syndrome. Both ends are curated here as
  one graded entity, split as subtypes rather than as separate diseases.

  The boundary with the neighbouring chains is mechanistic rather than a matter
  of degree. CD3gamma deficiency leaves thymopoiesis intact and presents with
  reduced surface receptor on a preserved T-cell compartment; CD3delta and
  CD3epsilon loss both abrogate T-cell development. The published comparison of
  the human deficiencies places CD3delta above CD3gamma in impact on T-cell
  production, and the CD3delta mouse is the standing example of a species
  mismatch in this complex: the knockout spares gamma-delta cells and blocks a
  later (double-positive to single-positive) transition than the human disorder
  does.

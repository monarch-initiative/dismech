treatments:
- name: Allogeneic haematopoietic stem cell transplantation
  description: >-
    The only definitive treatment. Thirteen patients transplanted across seven
    centres gave 62% survival; HLA-matched donors did markedly better than
    mismatched ones, and substantial conditioning appeared necessary - one
    matched-donor recipient given mild conditioning failed to engraft. The
    series reads the thymus loaded with host progenitors as a reason
    conditioning matters more here than in other SCID forms.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Arrest of Thymocyte Development
    treatment_effect: BYPASSES
    description: >-
      Donor progenitors carry wild-type CD3D, so thymopoiesis proceeds from
      donor-derived precursors; the patient's own precursors remain arrested.
    evidence:
    - reference: PMID:21757226
      reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Three other patients who received stem cells from a matched unrelated donor survived and enjoyed full immune reconstitution.
      explanation: >-
        Full immune reconstitution from donor progenitors, which is the arrested
        compartment being bypassed rather than repaired.
  evidence:
  - reference: PMID:21757226
    reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival rate was 62% with 8/13 patients alive to date.
    explanation: >-
      The outcome of the only assembled transplant series for this genotype.
  - reference: PMID:21757226
    reference_title: Hematopoietic stem cell transplantation for CD3δ deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (1) HLA-matched donor transplants are associated with superior reconstitution and survival than are mismatched donor transplants; (2) substantial conditioning appears necessary; and (3) early diagnosis and absence of opportunistic infections may affect outcome.
    explanation: >-
      The series' own conclusions on donor matching, conditioning and timing.
- name: Protective isolation and anti-infectious prophylaxis
  description: >-
    Supportive care bridging a T-cell-null infant to transplantation: protective
    isolation and antimicrobial prophylaxis. It does not touch the lesion, and
    in this disorder the pre-transplant interval is where patients are lost -

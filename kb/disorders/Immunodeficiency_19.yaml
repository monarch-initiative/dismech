notes: >-
  Scope. This is a standalone Disease entry rather than a has_subtypes row on
  Severe_Combined_Immunodeficiency, following the precedent of its three sibling
  chains: Immunodeficiency_18 (CD3E), Immunodeficiency_25 (CD247) and
  Combined_Immunodeficiency_Due_To_CD3gamma_Deficiency each have their own
  entry, and MONDO gives immunodeficiency 19 its own term under MONDO:0015703
  (T-B+ severe combined immunodeficiency due to CD3delta/CD3epsilon/CD3zeta).
  The two subtypes curated here are allele classes within one gene, which is
  what has_subtypes is for.

  GeneReviews. No GeneReviews chapter names this disease: `just
  check-genereviews` reports NO_CHAPTER for the entry, and a PubMed
  `genereviews[book]` title search for CD3 delta deficiency and for
  immunodeficiency 19 returns nothing. The phenotype baseline is therefore taken
  from the primary literature - principally the thirteen-patient transplant
  series (PMID:21757226), the two-family molecular study (PMID:15546002), the
  leaky-allele study (PMID:21926461) and the 2025 pooled review
  (PMID:40147628).

  Frequencies. Phenotype frequency bands are set strictly from the
  thirteen-patient transplant series (PMID:21757226 Table 1), the only cohort
  large enough to support them, against the Orphanet-style bands (FREQUENT
  30-79%, OCCASIONAL 5-29%): chronic diarrhoea 5/13 (38%) and failure to thrive
  4/13 (31%) are FREQUENT; Pneumocystis pneumonia 2/13 (15%), severe CMV 3/13
  (23%), recurrent candidiasis 3/13 (23%, two oral thrush plus one systemic),
  and each leaky-allele Omenn feature 2-3/13 are OCCASIONAL. They are counts in
  a transplant-referred series, not population frequencies. The 2025 review's
  percentages (recurrent infections 45%, diarrhoea 33%, candidiasis 30%) pool
  all four CD3-subunit deficiencies and are cited for orientation only, never to
  set a band.

  Thymic size is deliberately not curated as a phenotype. The transplant series
  describes a thymus detectable by ultrasound and loaded with progenitors, while
  the Japanese family had small thymi on chest imaging and the affected fetuses'
  thymi weighed a third of expected. Both observations are cited on the
  `Thymus Loaded with Arrested Progenitors` node; the usable claim is that
  thymic size does not exclude the diagnosis, not that the thymus is
  characteristically large or small.

  Quote artefacts. Snippets drawn from cached PDF extractions reproduce that
  text verbatim as exact-quote validation requires, including the source's
  "erythrodema" for erythroderma, column runs such as "Very lowN ormalL ow"
  from the IUIS table, and two quotes that begin or end mid-sentence where the
  extraction breaks a line ("of age, he presented with...", "some PreT
  α+/TCRβ+ thymocytes survive..."). Entry prose uses ordinary
  spellings.

  Evidence-source convention. Sentences whose subject is a patient's clinical
  state, immunophenotype, thymic histology or genotype are HUMAN_CLINICAL.
  Measurements requiring culture or molecular work on patient material - PHA
  proliferation assays, RT-PCR of CD3D splicing, base editing of patient HSPCs
  and their organoid differentiation - are IN_VITRO. Mouse data are
  MODEL_ORGANISM. The IUIS classification table and the PIDTC consensus
  definitions are OTHER. Review sentences reporting the field rather than the
  citing paper's own work carry quote_role REVIEW_SYNTHESIS; PMID:36944331's
  opening sentence describing the disease is BACKGROUND in a paper whose own
  results are the editing experiments.

  Not curated. No `biochemical:` block: the laboratory findings here are cell
  counts, receptor density, TREC levels and immunoglobulin concentrations, which
  are curated as phenotypes and diagnoses. No `environmental:` entries: nothing
  in this disorder's aetiology is an exposure. No prevalence rate: see the
  prevalence record. Grouping membership is out of scope and touches shared
  files. PMID:14602880 (Dadi 2003, the original description of CD3delta
  deficiency) is deliberately not cited: its PubMed record carries no abstract,
  so fetching it yields a cache with no quotable body (and no cache file is
  committed here), and a title is not a finding. Its
  content reaches the entry through PMID:15546002 and PMID:21757226, which both
  report and discuss it.

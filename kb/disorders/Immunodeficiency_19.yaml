      CD3D.
- name: Decreased total T cell count with preserved gamma-delta T cells
  category: Immunologic
  diagnostic: true
  subtype: Leaky splice allele
  description: >-
    The leaky-allele laboratory picture: scant, oligoclonal peripheral
    alpha-beta T cells, with gamma-delta T cells present, so the
    immunophenotype is Talphabeta-Tgammadelta+B+NK+. Recording it matters
    diagnostically because a SCID panel read only as total CD3 count can miss
    the pattern, and because it is the mirror image of the mouse knockout in
    which gamma-delta development is the spared lineage.
  phenotype_term:
    preferred_term: Decreased total T cell count
    term:
      id: HP:0005403
      label: Decreased total T cell count
  notes: >-
    HPO has no term for a selective reduction of alpha-beta T cells:
    `runoak -i ols:hp search "alpha-beta T cell proportion"` returns only CD4,
    CD8 and memory-subset proportion terms, and the gamma-delta terms returned by
    `runoak -i ols:hp search "gamma-delta T cell"` (HP:0500269 abnormal,
    HP:0500270 increased, HP:0500271 decreased gamma-delta T cell proportion)
    describe an abnormal proportion rather than a preserved one. The total-count
    term is therefore bound and the lineage detail carried in `preferred_term`
    and the description.
  evidence:
  - reference: PMID:21926461
    reference_title: A leaky mutation in CD3D differentially affects αβ and γδ T cells and leads to a Tαβ-Tγδ+B+NK+ human SCID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report 2 unrelated cases of SCID with a selective block in αβ but not in γδ T cell development, associated with a new splicing mutation in the CD3D gene.
    explanation: >-
      The selective alpha-beta deficit with preserved gamma-delta development
      that this phenotype records.

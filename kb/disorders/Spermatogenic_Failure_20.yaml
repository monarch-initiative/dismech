    Two independent knockout lines. Males are sterile with immotile sperm and
    disorganized axonemes; females are fertile. Flagellar malformation is
    milder than in patients, and sperm show a fragmented mitochondrial sheath
    and some head defects but little chromatin-compaction defect.
  modeled_mechanisms:
  - target: Sperm Axonemal Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Knockout sperm reproduce the patients' axonemal defects.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nevertheless, TEM analysis of Cfap44−/− sperm evidenced ultrastructural defects similar to those found in CFAP44 patients, confirming that CFAP44 is necessary for axonemal organization and function both in mouse and human."
      explanation: Same ultrastructural defect as in patients.
    - reference: PMID:28552195
      reference_title: "Biallelic Mutations in CFAP43 and CFAP44 Cause Male Infertility with Multiple Morphological Abnormalities of the Sperm Flagella."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The flagellar ultrastructures of testicular sperm shown by TEM indicated a lack of the central pair of microtubules, which is consistent with the observations in human MMAF-affected subjects carrying biallelic mutations in CFAP43 or CFAP44."
      explanation: Central-pair loss in a second knockout line.
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Sterility and immotility are reproduced, flagellar malformation less so.
    limitations: >-
      Cfap44-/- sperm are immotile but their flagellar shape defects are
      subtler than in patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        In one knockout line Cfap44-deficient mouse sperm show subtler
        flagellar shape defects than the mostly short and absent flagella of
        patients, so the mouse can underestimate the human morphological
        defect while reproducing the motility loss.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cfap44−/− male mice were also infertile due to flagellar immotility, yet presenting subtler flagellar defects than those observed in patients with CFAP44 mutations"
      explanation: The authors' statement of the partial match.
    - reference: PMID:28552195
      reference_title: "Biallelic Mutations in CFAP43 and CFAP44 Cause Male Infertility with Multiple Morphological Abnormalities of the Sperm Flagella."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that both Cfap43- and Cfap44-deficient male mice were infertile, whereas female mice with corresponding mutants could generate offspring."
      explanation: Male-only infertility in an independent line.
- name: Trypanosoma brucei TbCFAP44 RNAi knockdown
  species: Trypanosoma brucei
  genotype: Tetracycline-inducible RNAi against TbCFAP44
  publication: PMID:29449551
  description: >-
    Knockdown in the protozoan parasite produces abnormal flagellar beating,
    disorganized axonemes, multiflagellated cells and growth arrest.
  modeled_mechanisms:
  - target: Sperm Axonemal Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Axonemal disorganization after knockdown in a flagellated protozoan.
    limitations: >-
      Trypanosome flagella have a paraflagellar rod instead of the fibrous
      sheath and outer dense fibres of sperm, and knockdown also blocks
      cytokinesis, which has no human counterpart.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The trypanosome flagellum is built on a paraflagellar rod rather than
        the sperm fibrous sheath, so the peri-axonemal partners of CFAP44
        differ between the model and human sperm.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In all cases, both TbCFAP44RNAi-induced and TbCFAP43RNAi-induced cells showed abnormal beating (Supplementary Movies 2–5) and stopped proliferating after 24 h and eventually died"
      explanation: Knockdown impairs flagellar beating.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect. In a retrospective series, CFAP44
    patients had a 76% fertilization rate, higher than DNAH1 patients, and
    half of couples achieved a delivery. In knockout mice, Cfap44-deficient
    sperm supported embryo development better than sperm from Cfap43 and
    other MMAF knockouts, although still below wild type.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar form and motility irrelevant to fertilization.
    evidence:
    - reference: PMID:30251428
      reference_title: "Patients with multiple morphological abnormalities of the sperm flagella harbouring CFAP44 or CFAP43 mutations have a good pregnancy outcome following intracytoplasmic sperm injection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For MMAF patients carrying CFAP44 mutations, the recorded rates of fertilisation, transferable embryos, pregnancy and delivery after ICSI were 76.47%, 88.46%, 50.0% and 50.0% respectively."
      explanation: Fertilization and delivery rates with CFAP44 patient sperm.
  evidence:
  - reference: PMID:30251428
    reference_title: "Patients with multiple morphological abnormalities of the sperm flagella harbouring CFAP44 or CFAP43 mutations have a good pregnancy outcome following intracytoplasmic sperm injection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fertilisation rate was significantly higher in the CFAP44+ group than in the DNAH1+ group (76.47% vs. 54.5%, p = 0.0196)."
    explanation: Fertilization compares favourably with another MMAF genotype.
  - reference: PMID:34529793
    reference_title: "Genetic diagnosis, sperm phenotype and ICSI outcome in case of severe asthenozoospermia with multiple morphological abnormalities of the flagellum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite occasional technical difficulties, ICSI outcomes for couples with MMAF do not differ from those of other couples requiring ICSI, irrespective of the genetic defect."
    explanation: A mixed-genotype MMAF series including CFAP44 patients.
  - reference: PMID:40070084
    reference_title: "A comprehensive study of the sperm head defects in MMAF condition and their impact on embryo development in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Sperm from all KO lines exhibited a marked decrease in supporting embryo development compared to the wild-type, with developmental failure rates ranked as follows: Ccdc146 > Cfap43 > Armc2 > Cfap44-deficient sperm."
    explanation: In mice, Cfap44-deficient sperm have the smallest embryo-development penalty after ICSI.
- name: Genetic Counseling
  description: >-
    Counselling for autosomal recessive recurrence and carrier testing of
    relatives once the familial CFAP44 alleles are known. A molecular
    diagnosis also predicts a generally good ICSI prognosis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29277146
    reference_title: "Novel Mutations in CFAP44 and CFAP43 Cause Multiple Morphological Abnormalities of the Sperm Flagella (MMAF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results provide researchers with a new insight to understand the genetic etiology of MMAF and to identify new loci for genetic counselling of MMAF."
    explanation: The authors name genetic counselling as an application of the diagnosis.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Establishes the diagnosis by exome sequencing or MMAF gene panels with
    Sanger confirmation. Deep-intronic splice variants need RNA or minigene
    studies to confirm. DNAH1, CFAP43 and CFAP44 together explain roughly a
    quarter to a third of MMAF in exome-sequenced cohorts.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, DNAH1, CFAP43, and CFAP44 mutations were identified in 28.2% of the analyzed subjects (n = 78) originating from North Africa, Europe, and the Middle East."
    explanation: Diagnostic yield of exome sequencing in MMAF.
  - reference: PMID:42371530
    reference_title: "A Novel Deep-Intronic CFAP44 Variant Underlies Multiple Morphological Abnormalities of the Sperm Flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Then, exon 15 skipping was identified through minigene assays and RT-PCR in vivo, resulting in a 111-bp deletion within the mutated sequence, thereby indicating a disruption in the normal splicing of the CFAP44 transcript."
    explanation: Splicing studies confirm a non-coding variant.
- name: Semen Analysis
  description: Shows MMAF with no progressive motility; no sperm are morphologically normal.
  evidence:
  - reference: PMID:28552195
    reference_title: "Biallelic Mutations in CFAP43 and CFAP44 Cause Male Infertility with Multiple Morphological Abnormalities of the Sperm Flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "light microscopy, which identified severely distorted sperm flagella, including absent, short, coiled, bent, and irregular-caliber flagella"
    explanation: Light-microscopic semen morphology defines MMAF.
- name: Transmission Electron Microscopy of Sperm Flagella
  description: >-
    Flagellar cross-sections show a missing or displaced central pair,
    disorganized doublets and thickened fibrous sheaths.
  diagnosis_term:
    preferred_term: Transmission Electron Microscopy
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  evidence:
  - reference: PMID:28552195
    reference_title: "Biallelic Mutations in CFAP43 and CFAP44 Cause Male Infertility with Multiple Morphological Abnormalities of the Sperm Flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cross section shows a thickened fibrous sheath and an absent central pair of microtubules."
    explanation: TEM findings in CFAP44 patient sperm.
- name: Immunofluorescence of Sperm Flagella
  description: >-
    Reduced RSPH1 and diffuse SPAG6 staining of patient sperm support
    pathogenicity of CFAP44 variants.
  evidence:
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In CFAP44-mutated patients’ sperm cells, RSPH1 staining was significantly reduced"
    explanation: Radial-spoke staining is reduced in patient sperm.

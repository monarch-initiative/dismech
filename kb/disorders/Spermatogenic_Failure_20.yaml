mechanistic_hypotheses:
- hypothesis_group_id: cfap43_cfap44_tether
  hypothesis_label: CFAP44 acts with its paralog CFAP43 in the I1 dynein tether/tether-head complex
  status: CANONICAL
  description: >-
    CFAP44 and CFAP43 are WD-repeat paralogs that interact and form the
    heterodimeric T/TH complex of the I1 inner dynein arm in ciliates.
    Biallelic loss of either gene gives the same MMAF phenotype in men and
    mice, consistent with a shared complex. In T. brucei, however, knockdown
    of one protein does not displace the other.
  evidence:
  - reference: PMID:29687140
    reference_title: "Ciliary proteins Fap43 and Fap44 interact with each other and are essential for proper cilia and flagella beating."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we provide evidence of a novel ciliary complex composed of two conserved WD-repeat proteins, Fap43p and Fap44p."
    explanation: The two orthologs interact in Tetrahymena.
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no significant difference between the three groups (Table 1) as illustrated by the similar morphologies of sperm from patient P43-8 and P44-3, mutated for CFAP43 and CFAP44, respectively"
    explanation: CFAP43 and CFAP44 patients have indistinguishable semen phenotypes.
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of TbCFAP43 by RNAi did not alter the amount and localization of TbCFAP44; conversely, inactivation of TbCFAP44 had no impact on TbCFAP43 protein"
    explanation: In trypanosomes the two proteins do not depend on each other for localization.
- hypothesis_group_id: cfap44_sperm_restricted
  hypothesis_label: CFAP44 loss causes isolated male infertility without motile-cilia disease
  status: CANONICAL
  description: >-
    No reported CFAP44 patient has respiratory symptoms, hydrocephalus or
    laterality defects, although the Tetrahymena ortholog is needed for
    normal ciliary beating. The original explanation was that CFAP43 and
    CFAP44 link the axoneme to sperm-specific peri-axonemal structures; the
    later finding of airway and brain phenotypes in Cfap43 knockout mice, and
    of respiratory symptoms in one CFAP43 family, leaves open whether CFAP44
    loss could also affect motile cilia. Cfap44 knockout mice have not been
    reported to have such phenotypes.
  evidence:
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These observations suggest that mutations in MMAF genes are only responsible for primary infertility without other PCD features and reinforce the presumption that the sperm flagellum is assembled and organized through a specific way, different from other cilia."
    explanation: CFAP44 patients in the largest cohort had no PCD features.
  - reference: PMID:29687140
    reference_title: "Ciliary proteins Fap43 and Fap44 interact with each other and are essential for proper cilia and flagella beating."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Loss of either protein results in altered waveform, beat stroke and reduced swimming speed."
    explanation: The ciliate ortholog is needed for motile-cilia beating, so a ciliary role in humans is plausible.

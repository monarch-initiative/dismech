name: Spermatogenic Failure 20
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF20
- spermatogenic failure 20
- CFAP44-related multiple morphological abnormalities of the sperm flagella
- CFAP44-related MMAF
description: >-
  Spermatogenic failure 20 (SPGF20) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in CFAP44 (formerly WDR52),
  which encodes a WD-repeat cilia- and flagella-associated protein. CFAP44 and
  its paralog CFAP43 form the heterodimeric tether/tether-head complex that
  anchors the motor domains of the regulatory I1 inner dynein arm to the
  doublet microtubule in ciliates, and in Trypanosoma both proteins sit next
  to doublets 5 and 6. CFAP44 is expressed predominantly in the testis.

  Affected men have asthenoteratozoospermia with multiple morphological
  abnormalities of the sperm flagella (MMAF): mostly short and absent
  flagella, with coiled, bent and irregular-caliber forms, and no
  progressive motility. Electron microscopy shows loss of the central pair in
  most flagella, displaced doublets and thickened fibrous sheaths, and
  radial-spoke staining is reduced. Respiratory or other motile-cilia
  disease has not been reported. Cfap44 knockout mice are sterile with
  immotile sperm but milder flagellar malformation than patients.
  Intracytoplasmic sperm injection (ICSI) gives good fertilization and
  pregnancy rates.
disease_term:
  preferred_term: spermatogenic failure 20
  term:
    id: MONDO:0054724
    label: spermatogenic failure 20
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 617593. ClinGen has no
  gene-disease validity curation for CFAP44 in the 2026-10-14 export, so no
  validity tier is recorded. No GeneReviews chapter covers the disorder.
  Unlike its paralog CFAP43, CFAP44 has no published patient with
  respiratory symptoms, hydrocephalus or laterality defects (PubMed search
  for CFAP44 or WDR52 with respiratory, ciliary dyskinesia, hydrocephalus or
  cilia, October 2026). A peptidase activity was described for an
  alternatively spliced central fragment of Cfap44 in transfected cells
  (PMID:28887034); it has not been linked to sperm or to this disease and is
  not modelled here.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic CFAP44 variants, mostly homozygous truncating
    or splice alleles in consanguineous North African and Chinese families,
    with putative compound heterozygous missense alleles in one patient.
    Parents are heterozygous carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28552195
    reference_title: "Biallelic Mutations in CFAP43 and CFAP44 Cause Male Infertility with Multiple Morphological Abnormalities of the Sperm Flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous frameshift mutation in CFAP44 (M6) was identified in one subject with MMAF (P002). Both of his parents carried the heterozygous mutation."
    explanation: Homozygous proband with carrier parents.
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, six subjects (7.7%) had a homozygous loss-of-function variant in CFAP44 (Table 2)."
    explanation: Homozygous loss-of-function alleles in six probands.
pathophysiology:
- name: Loss of the CFAP44 Tether Protein
  description: >-
    Nonsense, frameshift, canonical and deep-intronic splice variants abolish
    or sharply reduce CFAP44; patient sperm show very weak CFAP44 mRNA, and a
    deep-intronic variant causes exon 15 skipping. CFAP44 is one half of the
    tether/tether-head (T/TH) complex, which in ciliates links the I1 inner
    dynein arm motor domains to the A-tubule of the doublet microtubule;
    loss of this binding function is inferred from the orthologous complex.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP44
    term:
      id: hgnc:25631
      label: CFAP44
  molecular_functions:
  - preferred_term: dynein complex binding
    modifier: DECREASED
    term:
      id: GO:0070840
      label: dynein complex binding
  cellular_components:
  - preferred_term: Axoneme
    term:
      id: GO:0005930
      label: axoneme
  downstream:
  - target: Sperm Axonemal Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Without CFAP44 the sperm axoneme loses its central pair and its doublet
      arrangement. How loss of a dynein tether leads to this wider collapse is
      not established.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In CFAP43-mutated and CFAP44-mutated patients, approximately 95% of the cross-sections were abnormal and the main defect observed was the absence of the CPC (9+0 conformation) observed in 81.8, and 66.7% of the cases, respectively, compared to 0% in control fertile subject"
      explanation: Loss of CFAP44 is accompanied by central-pair loss in patient sperm.
  evidence:
  - reference: PMID:29277146
    reference_title: "Novel Mutations in CFAP44 and CFAP43 Cause Multiple Morphological Abnormalities of the Sperm Flagella (MMAF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Real-time quantitative polymerase chain reaction assays also demonstrated that CFAP44 expression was very weak in patient (P)1 and P3"
    explanation: Loss of CFAP44 transcript in patient sperm.
  - reference: PMID:30904354
    reference_title: "NovelCFAP43 andCFAP44 mutations cause male infertility with multiple morphological abnormalities of the sperm flagella (MMAF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The relative mRNA expression levels of CFAP43 in patients 1 and 9 and the levels of CFAP44 in patient 5 were significantly lower than those in control sperm samples."
    explanation: Reduced CFAP44 transcript with a homozygous nonsense allele.
  - reference: PMID:42371530
    reference_title: "A Novel Deep-Intronic CFAP44 Variant Underlies Multiple Morphological Abnormalities of the Sperm Flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Then, exon 15 skipping was identified through minigene assays and RT-PCR in vivo, resulting in a 111-bp deletion within the mutated sequence, thereby indicating a disruption in the normal splicing of the CFAP44 transcript."
    explanation: A deep-intronic allele disrupts splicing in patient RNA and a minigene.
  - reference: PMID:29514928
    reference_title: "The I1 dynein-associated tether and tether head complex is a conserved regulator of ciliary motility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "The tether and tether head (T/TH) complex was hypothesized to provide mechanical feedback during ciliary beating because it links the motor domains of the regulatory I1 dynein to the ciliary doublet microtubule."
    explanation: >-
      Cryo-electron tomography of ciliate axonemes identifies FAP43 and FAP44
      as the T/TH complex that binds the I1 dynein motor domains; the binding
      function of human CFAP44 is inferred from this ortholog.
  - reference: PMID:29514928
    reference_title: "The I1 dynein-associated tether and tether head complex is a conserved regulator of ciliary motility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "WT-mutant comparisons revealed that the heterodimeric T/TH complex is required for the positional stability of the I1 dynein motor domains, stable anchoring of CK1 kinase, and proper phosphorylation of the regulatory IC138-subunit."
    explanation: Mutants lacking the complex lose stable positioning of the I1 dynein motor domains.
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Immunoelectron and stimulated-emission-depletion microscopy performed on CFAP43 and CFAP44 orthologs in Trypanosoma brucei evidenced that both proteins are located between the doublet microtubules 5 and 6 and the paraflagellar rod."
    explanation: Localization of the trypanosome ortholog to a specific subset of doublets.
- name: Sperm Axonemal Disorganization
  description: >-
    Most flagellar cross-sections lack the central pair (9+0), and the
    central pair is disassembled or displaced when present; peripheral
    doublets are disorganized and fibrous sheaths thickened. Central-pair
    SPAG6 staining is diffuse and fades along the flagellum, and radial-spoke
    RSPH1 staining is strongly reduced.

name: Tetralogy of Fallot
creation_date: "2026-08-10T00:20:00Z"
category: Complex
disease_term:
  preferred_term: tetralogy of fallot
  term:
    id: MONDO:0008542
    label: tetralogy of fallot
description: >
  The most common cyanotic congenital heart disease. The name is a historical accident that
  obscures the mechanism: the four cardinal features are not four defects but four consequences
  of one, namely anterocephalad deviation of the outlet septum during outflow tract septation.
  A septum that deviates cannot close the interventricular communication, cannot leave the aorta
  aligned over the left ventricle, and cannot leave the subpulmonary infundibulum a normal
  calibre, and the right ventricle then hypertrophies against the resulting load. Everything
  clinically important follows from the severity of that last obstruction, which determines
  whether blood shunts left to right or right to left, and therefore whether the child is pink
  or blue.
parents:
- conotruncal heart defect
- cyanotic congenital heart disease

classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      A structural congenital cardiovascular malformation. The syndromic subgroup, principally
      22q11.2 deletion, carries immune, endocrine, and neurodevelopmental features outside this
      chapter; the entity curated here is the cardiac lesion.

pathophysiology:
- name: Second heart field and cardiac neural crest program disruption
  biological_scale: CELLULAR
  description: >
    A genetic lesion or teratogenic insult perturbs addition of second heart field progenitors to
    the developing outflow tract and migration of cardiac neural crest cells into it, during weeks
    three to eight of gestation. This is the same developmental program whose failure produces
    persistent truncus arteriosus, and the two diseases are best read as different severities and
    positions of failure in one process rather than as unrelated malformations.
  cell_types:
  - preferred_term: migratory cardiac neural crest cell
    term:
      id: CL:2000073
      label: migratory cardiac neural crest cell
  - preferred_term: outflow tract myogenic progenitor
    term:
      id: CL:0000513
      label: cardiac muscle myoblast
  biological_processes:
  - preferred_term: outflow tract morphogenesis
    term:
      id: GO:0003151
      label: outflow tract morphogenesis
    modifier: DECREASED
  - preferred_term: cardiac neural crest cell development
    term:
      id: GO:0061308
      label: cardiac neural crest cell development involved in heart development
    modifier: DECREASED
  locations:
  - preferred_term: outflow tract septum
    term:
      id: UBERON:0004142
      label: outflow tract septum
  downstream:
  - target: Anterocephalad deviation of the outlet septum
    causal_link_type: DIRECT
    description: >
      A disrupted progenitor and neural crest program produces a septum that forms in the wrong
      position rather than failing to form at all.
  evidence:
  - reference: PMID:34905512
    reference_title: "Sequencing of a Chinese tetralogy of Fallot cohort reveals clustering mutations in myogenic heart progenitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered that the candidate gene expression was enriched in the myogenic progenitors of the cardiac outflow tract."
    explanation: Localises the genes carrying damaging de novo variants in this disease to the specific progenitor population of the outflow tract, which is the cellular claim this node makes.
  - reference: PMID:34905512
    reference_title: "Sequencing of a Chinese tetralogy of Fallot cohort reveals clustering mutations in myogenic heart progenitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To assess the impact of these mutations on early cardiac development, we integrated single-cell and spatial transcriptomics of early human heart development with our genetic findings."
    explanation: States the method that joins the genetic findings to a developmental cell population, which is what makes the localisation more than an association.

- name: Anterocephalad deviation of the outlet septum
  biological_scale: TISSUE
  description: >
    The single anatomical lesion of this disease. The muscular outlet septum deviates
    anterocephalad relative to the muscular ventricular septum. Every one of the four cardinal
    features is a geometric consequence of that one deviation, which is why they occur together
    with essentially no exceptions and why the eponymous tetralogy is better understood as a
    monad.
  biological_processes:
  - preferred_term: outflow tract septum morphogenesis
    term:
      id: GO:0003148
      label: outflow tract septum morphogenesis
    modifier: DECREASED
  locations:
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  downstream:
  - target: Malalignment ventricular septal defect with overriding aorta
    causal_link_type: DIRECT
    description: >
      A deviated septum cannot close the interventricular communication, and leaves the aortic
      root straddling it.
  - target: Right ventricular outflow tract obstruction
    causal_link_type: DIRECT
    description: >
      The same deviation narrows the subpulmonary infundibulum.

- name: Malalignment ventricular septal defect with overriding aorta
  biological_scale: TISSUE
  description: >
    A large non-restrictive perimembranous defect, with the aortic valve annulus straddling it.
    Because the defect is non-restrictive, the two ventricles function as a single pumping
    chamber at systemic pressure, which is why the direction of shunting is decided entirely by
    the relative resistance of the two outflows rather than by the defect itself.
  locations:
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  downstream:
  - target: Shunt direction determined by outflow resistance
    causal_link_type: DIRECT
    description: >
      A non-restrictive communication allows flow to follow the path of least resistance.

- name: Right ventricular outflow tract obstruction
  biological_scale: TISSUE
  description: >
    Obstruction at infundibular, valvar, supravalvar, or branch pulmonary artery level, singly or
    in combination. The infundibular component is muscular and therefore dynamic, which is the
    mechanistic basis of the hypercyanotic spell and the reason severity can change from minute
    to minute in a way that fixed obstructions cannot.
  locations:
  - preferred_term: pulmonary valve
    term:
      id: UBERON:0002146
      label: pulmonary valve
  downstream:
  - target: Shunt direction determined by outflow resistance
    causal_link_type: DIRECT
    description: >
      Obstruction to pulmonary outflow raises the resistance against which the right ventricle
      must eject, relative to the systemic circuit.
  - target: Right ventricular hypertrophy
    causal_link_type: DIRECT
    description: >
      Chronic pressure loading of the right ventricle drives compensatory hypertrophy.

- name: Shunt direction determined by outflow resistance
  biological_scale: ORGANISM
  description: >
    The pivot of the whole disease. With a non-restrictive ventricular septal defect, flow goes
    wherever resistance is lower. Mild outflow obstruction leaves pulmonary resistance below
    systemic and the shunt is left to right, producing the acyanotic or pink presentation. Severe
    obstruction reverses that and produces right to left shunting with cyanosis. This is also why
    raising systemic vascular resistance, which squatting does mechanically and phenylephrine
    does pharmacologically, terminates a hypercyanotic spell.
  downstream:
  - target: Cyanosis and chronic hypoxaemia
    causal_link_type: DIRECT
    description: >
      Right to left shunting delivers systemic venous blood to the aorta without pulmonary gas
      exchange.

- name: Right ventricular hypertrophy
  biological_scale: TISSUE
  description: >
    Secondary and largely postnatal, developing as the right ventricle ejects against systemic
    level pressure. It is the one cardinal feature that is a response rather than a malformation,
    which is why it is not present at the same severity from birth.
  biological_processes:
  - preferred_term: cardiac muscle hypertrophy
    term:
      id: GO:0003300
      label: cardiac muscle hypertrophy
    modifier: INCREASED
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell

- name: Cyanosis and chronic hypoxaemia
  biological_scale: ORGANISM
  description: >
    Chronic arterial desaturation, with compensatory polycythaemia and, over years, digital
    clubbing. In the modern era of early repair these late consequences are increasingly historical
    in high-income settings and remain common where surgery is delayed.
  downstream:
  - target: Postoperative pulmonary regurgitation and right ventricular remodelling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Cyanosis is what forces early operation, and the operation itself creates the late lesion.

- name: Postoperative pulmonary regurgitation and right ventricular remodelling
  biological_scale: ORGANISM
  description: >
    The defining problem of the adult with repaired tetralogy, and an iatrogenic one. Relieving
    the outflow obstruction, especially with a transannular patch, leaves the pulmonary valve
    incompetent. Decades of free pulmonary regurgitation then dilate the right ventricle, drive
    fibrosis, and build an arrhythmogenic substrate. The disease of the survivor is therefore not
    the disease that was repaired, which is the central fact of lifelong follow-up in this
    population.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  downstream:
  - target: Ventricular arrhythmia and sudden death risk
    causal_link_type: DIRECT
    description: >
      Right ventricular dilation and fibrosis create the substrate for reentrant ventricular
      tachycardia.
  evidence:
  - reference: PMID:39569497
    reference_title: "Long-Term Management of Right Ventricular Outflow Tract Dysfunction in Repaired Tetralogy of Fallot: A Scientific Statement From the American Heart Association."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Right ventricular outflow dysfunction, manifesting as stenosis, regurgitation, or both, is nearly universal in patients with repaired tetralogy of Fallot, precipitating a complex pathophysiological cascade that leads to increasing rates of morbidity and mortality with advancing age."
    explanation: States that outflow dysfunction after repair is nearly universal and drives a cascade of rising morbidity and mortality with age, which is exactly the claim this node makes about the repair creating the next disease.

- name: Ventricular arrhythmia and sudden death risk
  biological_scale: ORGANISM
  description: >
    The principal late cause of death after successful repair. It is deliberately not curated as
    conforming to cardiac_ion_channel_repolarization, because the substrate here is structural,
    consisting of surgical scar and fibrosis in a dilated ventricle, rather than a primary
    channelopathy in a structurally normal heart.
  evidence:
  - reference: PMID:27329296
    reference_title: "Approach to residual pulmonary valve dysfunction in adults with repaired tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic severe pulmonary regurgitation as a result of surgical repair can lead to myriad complications including right ventricular dysfunction, decreased exercise tolerance, right heart failure and symptomatic arrhythmias."
    explanation: Attributes the late complications directly to the surgical repair, and names symptomatic arrhythmias among them, which is the specific claim this node makes.

phenotypes:
- category: Clinical
  name: Ventricular septal defect
  description: >
    Obligate. A large malalignment perimembranous defect, present in every case by definition.
  phenotype_term:
    preferred_term: Ventricular septal defect
    term:
      id: HP:0001629
      label: Ventricular septal defect
  frequency: OBLIGATE

- category: Clinical
  name: Overriding aorta
  description: >
    Obligate. The aortic valve annulus straddles the septal defect.
  phenotype_term:
    preferred_term: Overriding aorta
    term:
      id: HP:0002623
      label: Overriding aorta
  frequency: OBLIGATE

- category: Clinical
  name: Right ventricular outflow tract obstruction
  description: >
    Obligate in presence though highly variable in severity, ranging from mild infundibular
    narrowing to complete pulmonary atresia. That variability is what generates the entire
    clinical spectrum of this disease.
  phenotype_term:
    preferred_term: Pulmonic stenosis
    term:
      id: HP:0001642
      label: Pulmonic stenosis
  frequency: OBLIGATE

- category: Clinical
  name: Right ventricular hypertrophy
  description: >
    Obligate but secondary, developing in response to pressure loading rather than being present
    as a malformation from the outset.
  phenotype_term:
    preferred_term: Right ventricular hypertrophy
    term:
      id: HP:0001667
      label: Right ventricular hypertrophy
  frequency: OBLIGATE

- category: Clinical
  name: Cyanosis
  description: >
    Variable, and its timing is diagnostic of severity. Present from birth with severe outflow
    obstruction, emerging over weeks to months as dynamic infundibular obstruction progresses, or
    absent altogether in the acyanotic pink presentation.
  phenotype_term:
    preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis

- category: Clinical
  name: Hypercyanotic spells
  description: >
    Paroxysmal deep cyanosis with hyperpnoea and irritability, typically in infants of two to four
    months, caused by acute dynamic infundibular constriction abruptly increasing right to left
    shunting. No precise HPO term exists for the episodic entity, so this phenotype is bound to
    Cyanosis with a recurrent temporality qualifier rather than to an invented or approximate term.
    The spell is the reason this disease is an emergency rather than merely a malformation.
  phenotype_term:
    preferred_term: Hypercyanotic spell
    term:
      id: HP:0000961
      label: Cyanosis
    temporality: RECURRENT

- category: Clinical
  name: Heart murmur
  description: >
    A harsh systolic ejection murmur at the left upper sternal border, arising from the outflow
    obstruction rather than from the septal defect. Its intensity falls during a hypercyanotic
    spell, because less blood is crossing the obstruction, which is a counterintuitive and
    clinically vital sign.
  phenotype_term:
    preferred_term: Heart murmur
    term:
      id: HP:0030148
      label: Heart murmur

- category: Clinical
  name: Digital clubbing
  description: >
    A late consequence of chronic hypoxaemia, now largely historical where early repair is
    available.
  phenotype_term:
    preferred_term: Clubbing of fingers
    term:
      id: HP:0100759
      label: Clubbing of fingers

- category: Laboratory
  name: Polycythaemia
  description: >
    Compensatory erythrocytosis driven by chronic arterial desaturation.
  phenotype_term:
    preferred_term: Polycythemia
    term:
      id: HP:0001901
      label: Polycythemia

- category: Clinical
  name: Failure to thrive
  description: >
    Seen with significant cyanosis or heart failure.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive

- category: Clinical
  name: Right aortic arch
  description: >
    Present in roughly a quarter of cases overall and considerably more often in the 22q11.2
    deleted subgroup. It is a patterning anomaly of the same pharyngeal arch program, not a
    consequence of the septal deviation.
  phenotype_term:
    preferred_term: Right aortic arch with mirror image branching
    term:
      id: HP:0002627
      label: Right aortic arch with mirror image branching

- category: Clinical
  name: Anomalous coronary artery crossing the outflow tract
  description: >
    Uncommon but surgically decisive. A left anterior descending artery arising from the right
    coronary and crossing the right ventricular outflow tract can be transected by the very
    incision used to relieve the obstruction, which is why coronary anatomy is defined before
    operation rather than discovered during it.
  phenotype_term:
    preferred_term: Anomalous coronary artery arising from the opposite sinus
    term:
      id: HP:0025503
      label: Anomalous coronary artery arising from the opposite sinus
  evidence:
  - reference: PMID:32156463
    reference_title: "Coronary anomalies in tetralogy of Fallot - A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An anomalous coronary artery is reported in 2% to 23% of patients with tetralogy of Fallot (TOF). Knowledge of coronary anatomy prior to corrective surgery is vital to avoid damage to vessels crossing the right ventricular outflow tract (RVOT)."
    explanation: Gives the reported prevalence range and states the surgical consequence, which is the reason this phenotype is curated at all. No frequency band is assigned because a range spanning 2 to 23 percent crosses the OCCASIONAL and FREQUENT boundaries and the meta-analysis is reporting heterogeneity rather than a point estimate.

genetic:
- name: 22q11.2 deletion
  gene_term:
    preferred_term: TBX1
    term:
      id: hgnc:11592
      label: TBX1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    The single most common identifiable genetic cause, found in roughly seven percent of an
    unselected cohort. TBX1 haploinsufficiency is the principal candidate within the deleted
    interval, acting on second heart field progenitor addition. Identifying it changes management
    beyond the heart, because it brings immune, endocrine, and neurodevelopmental surveillance
    with it.
  evidence:
  - reference: PMID:19948535
    reference_title: "Comprehensive genotype-phenotype analysis in 230 patients with tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic genetic aberrations were found in 42 patients (18%), with 22q11.2 deletion as the most common diagnosis (7.4%), followed by trisomy 21 (5.2%) and other chromosomal aberrations or submicroscopic copy number changes (3%)."
    explanation: Quantifies the deletion as the most common identifiable cause in an unselected cohort of 230 patients, with a counted denominator.

- name: JAG1
  gene_term:
    preferred_term: JAG1
    term:
      id: hgnc:6188
      label: JAG1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    Notch ligand, mutated in Alagille syndrome and in some isolated cases. Its involvement is what
    first implicated Notch signalling in human outflow tract development.
  evidence:
  - reference: PMID:19948535
    reference_title: "Comprehensive genotype-phenotype analysis in 230 patients with tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in JAG1 were detected in three patients with Alagille syndrome (1.3%), while NKX2.5 mutations were seen in two patients with non-syndromic ToF (0.9%)."
    explanation: Quantifies the JAG1 and NKX2-5 contributions in the same cohort, with counted denominators.

- name: NKX2-5
  gene_term:
    preferred_term: NKX2-5
    term:
      id: hgnc:2488
      label: NKX2-5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    Cardiac transcription factor, mutated in a small fraction of nonsyndromic cases.
  evidence:
  - reference: PMID:19948535
    reference_title: "Comprehensive genotype-phenotype analysis in 230 patients with tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in JAG1 were detected in three patients with Alagille syndrome (1.3%), while NKX2.5 mutations were seen in two patients with non-syndromic ToF (0.9%)."
    explanation: Quantifies the NKX2-5 contribution at 0.9 percent of an unselected cohort, which is what places it among the minor rather than major contributors.

- name: FLT4
  gene_term:
    preferred_term: FLT4
    term:
      id: hgnc:3767
      label: FLT4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    VEGFR3. Identified by whole exome sequencing as one of the two largest single-gene
    contributors to nonsyndromic disease, alongside NOTCH1. Its emergence was a genuine surprise,
    since the gene was known for lymphatic rather than cardiac development.
  evidence:
  - reference: PMID:30582441
    reference_title: "Whole Exome Sequencing Reveals the Major Genetic Contributors to Nonsyndromic Tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The NOTCH1 locus is the most frequent site of genetic variants predisposing to nonsyndromic TOF, followed by FLT4. Together, variants in these genes are found in almost 7% of TOF patients."
    explanation: Ranks FLT4 as the second most frequent contributor after NOTCH1 and quantifies their combined yield at almost seven percent of patients, from a cohort of 829 undergoing whole exome sequencing.

- name: NOTCH1
  gene_term:
    preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    The single most frequent site of genetic variants predisposing to nonsyndromic disease,
    consistent with the established role of Notch signalling in outflow tract septation and neural
    crest patterning.
  evidence:
  - reference: PMID:30582441
    reference_title: "Whole Exome Sequencing Reveals the Major Genetic Contributors to Nonsyndromic Tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clustering of variants in 2 genes, NOTCH1 and FLT4, surpassed thresholds for genome-wide significance (assigned as P<5×10-8) after correction for multiple comparisons."
    explanation: Establishes that only these two genes reached genome-wide significance in a cohort of 829, which is what separates them from the many candidate genes proposed for this disease.
  - reference: PMID:30582441
    reference_title: "Whole Exome Sequencing Reveals the Major Genetic Contributors to Nonsyndromic Tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-one changes were observed in 37 probands (4.5%; 95% CI, 3.2%-6.1%) and included 7 loss-of-function variants 22 missense variants and 2 in-frame indels."
    explanation: Quantifies the NOTCH1 contribution with a confidence interval and characterises the variant classes involved.

inheritance:
- name: Non-Mendelian with a Mendelian minority
  description: >
    Most cases are sporadic and multifactorial. A substantial minority, around eighteen percent in
    a comprehensively investigated cohort, carry an identifiable chromosomal or single-gene cause,
    the most common being the 22q11.2 deletion. The practical consequence is that genetic testing
    is worthwhile in every case despite most results being negative, because a positive result
    changes both extracardiac surveillance and recurrence counselling.
  inheritance_term:
    preferred_term: Non-Mendelian inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  evidence:
  - reference: PMID:19948535
    reference_title: "Comprehensive genotype-phenotype analysis in 230 patients with tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic genetic aberrations were found in 42 patients (18%)"
    explanation: Quantifies the identifiable-cause fraction, which is what establishes that the majority is not Mendelian while a meaningful minority is.

environmental:
- name: Maternal pregestational diabetes
  description: >
    The best-characterised teratogenic exposure for this malformation and the only readily
    modifiable one. First-trimester hyperglycaemia acts during the same three to eight week window
    in which the outflow tract septates, which is why the exposure has to precede recognition of
    the pregnancy to matter. A meta-analysis of population-based studies covering over 80 million
    births gives a disease-specific relative risk of 1.41 for gestational diabetes, and reports
    that the risks for pre-gestational diabetes are higher still. The pre-gestational
    disease-specific estimate is not quoted here because it appears in the paper only as a forest
    plot figure rather than in quotable text, so what is asserted is the direction and the
    gestational figure rather than a pre-gestational number this entry cannot cite.
  influences_mechanisms:
  - target: Second heart field and cardiac neural crest program disruption
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Maternal hyperglycaemia during outflow tract septation is proposed to perturb the progenitor
      and neural crest program, though the teratogenic mechanism is not established.
    evidence:
    - reference: PMID:31454511
      reference_title: "Specific birth defects in pregnancies of women with diabetes: National Birth Defects Prevention Study, 1997-2011."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "however, the teratogenic mechanism behind the increase risk for birth defects is still unknown"
      explanation: PARTIAL, and quoted precisely because it states the limitation. Maternal diabetes is an established teratogen, and the step from that association to this particular developmental program is not evidenced.
  evidence:
  - reference: PMID:35104296
    reference_title: "Risks of specific congenital anomalies in offspring of women with diabetes: A systematic review and meta-analysis of population-based studies including over 80 million births."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "offspring of women with GDM had an increased risk of heterotaxia (RR = 5.70, 95% CI 1.09 to 29.92, I2 = 85.7%, P = 0.008), tetralogy of Fallot (RR = 1.41, 95% CI 1.20 to 1.66, I2 = 0%, P = 0.600)"
    explanation: A disease-specific relative risk for this malformation with a confidence interval clear of one, and with zero heterogeneity across the contributing studies, from a meta-analysis of over 80 million births.
  - reference: PMID:35104296
    reference_title: "Risks of specific congenital anomalies in offspring of women with diabetes: A systematic review and meta-analysis of population-based studies including over 80 million births."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RRs of overall CAs and CHDs in offspring of women with PGDM were higher than those in offspring of women with GDM."
    explanation: Establishes that pre-gestational diabetes carries the higher risk of the two, which is the direction this exposure entry asserts. The disease-specific pre-gestational figure appears in the paper only as a forest plot, so it is not quoted.
  - reference: PMID:31454511
    reference_title: "Specific birth defects in pregnancies of women with diabetes: National Birth Defects Prevention Study, 1997-2011."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "That analysis reported strong associations for pregestational diabetes with several birth defects, but few exposures among some of the less common birth defects led to unstable estimates with wide confidence intervals."
    explanation: PARTIAL. Corroborates the pre-gestational association at the level of birth defects generally, and notes the imprecision that affects rarer defects.
  notes: >
    No ECTO term is bound. Maternal pregestational diabetes is a maternal disease state rather than
    an exposure to an agent, and the exposure hierarchy has no term expressing it without asserting
    a specific chemical exposure the sources do not support.

experimental_models:
- name: Hey2 mutant mouse
  description: >
    A mouse null for the Notch effector Hey2 develops tetralogy of Fallot along with other
    congenital heart defects, which is one of the few models that reproduces the specific
    malformation rather than a general outflow tract abnormality. It is mechanistically
    informative because it places a Notch pathway effector upstream of this precise anatomy, at a
    time when the human evidence for Notch involvement was limited to JAG1 in Alagille syndrome.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Second heart field and cardiac neural crest program disruption
    description: >
      Loss of a Notch pathway effector perturbs the developmental program of the outflow tract.
  - target: Anterocephalad deviation of the outlet septum
    description: >
      The mutant reproduces the malformation itself rather than an unrelated cardiac defect.
  publication: PMID:12372254
  evidence:
  - reference: PMID:12372254
    reference_title: "Tetralogy of fallot and other congenital heart defects in Hey2 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recent studies have implicated the Notch signaling pathway in human cardiac development by demonstrating abnormalities of the JAG1 gene as the basis for Alagille syndrome and some cases of isolated tetralogy of Fallot or pulmonic stenosis."
    explanation: States the human Notch evidence that motivated the model, and connects it to the JAG1 gene curated in this entry.
  - reference: PMID:12372254
    reference_title: "Tetralogy of fallot and other congenital heart defects in Hey2 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the Hey family of basic helix-loop-helix (bHLH) transcription factors are candidates for mediating Notch signaling in the developing cardiovascular system"
    explanation: Establishes the rationale for targeting this specific effector, which is what makes the resulting phenotype mechanistically interpretable rather than incidental.

treatments:
- name: Complete surgical repair
  description: >
    The definitive treatment, consisting of patch closure of the ventricular septal defect and
    relief of outflow obstruction by infundibular resection, with a transannular patch where the
    pulmonary annulus is too small to preserve. The trade-off embedded in that last decision is
    the central surgical judgement of this disease. A transannular patch relieves the obstruction
    most completely and guarantees pulmonary regurgitation for life, so valve-sparing techniques
    are preferred wherever annulus size permits.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Malalignment ventricular septal defect with overriding aorta
    treatment_effect: BYPASSES
    description: >
      Patch closure eliminates the communication and restores the aorta to the left ventricle.
  - target: Right ventricular outflow tract obstruction
    treatment_effect: BYPASSES
    description: >
      Infundibular resection and, where needed, a transannular patch relieve the obstruction.
  evidence:
  - reference: PMID:39569497
    reference_title: "Long-Term Management of Right Ventricular Outflow Tract Dysfunction in Repaired Tetralogy of Fallot: A Scientific Statement From the American Heart Association."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Right ventricular outflow dysfunction, manifesting as stenosis, regurgitation, or both, is nearly universal in patients with repaired tetralogy of Fallot"
    explanation: PARTIAL, and cited here as the cost of the operation rather than its benefit. Nearly universal residual outflow dysfunction is what the repair trades for survival, and recording it on the treatment itself keeps that trade visible.

- name: Beta-blockade for hypercyanotic spells
  description: >
    Propranolol reduces dynamic infundibular constriction, used acutely during a spell and as
    prophylaxis in infants awaiting repair. It is the one pharmacotherapy in this disease that
    acts on the actual mechanism of the acute event rather than on its consequences.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: propranolol
      term:
        id: CHEBI:8499
        label: propranolol
  target_mechanisms:
  - target: Right ventricular outflow tract obstruction
    treatment_effect: INHIBITS
    description: >
      Beta-blockade relaxes the dynamic muscular component of the obstruction, which is the part
      that acutely worsens during a spell.

- name: Systemic vasoconstriction for hypercyanotic spells
  description: >
    Phenylephrine raises systemic vascular resistance and so reverses the resistance gradient that
    is driving right to left shunting. It is the pharmacological version of what a squatting child
    does mechanically, and it is a direct clinical application of the shunt-direction node in this
    entry.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenylephrine
      term:
        id: CHEBI:8093
        label: phenylephrine
  target_mechanisms:
  - target: Shunt direction determined by outflow resistance
    treatment_effect: MODULATES
    description: >
      Raising systemic resistance shifts the balance back towards pulmonary flow.

- name: Prostaglandin E1 for ductal-dependent pulmonary blood flow
  description: >
    Alprostadil maintains ductal patency in neonates whose pulmonary blood flow depends on the
    duct, buying time to intervention. It treats neither the septal defect nor the obstruction, and
    is purely a holding measure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alprostadil
      term:
        id: CHEBI:15544
        label: prostaglandin E1
  target_mechanisms:
  - target: Cyanosis and chronic hypoxaemia
    treatment_effect: MODULATES
    description: >
      Maintaining the duct provides an alternative source of pulmonary blood flow.

- name: Systemic to pulmonary shunt palliation
  description: >
    A modified Blalock-Taussig-Thomas shunt, or increasingly a transcatheter alternative such as
    outflow tract or ductal stenting, provides pulmonary blood flow in neonates too small or too
    high-risk for primary repair, and allows the pulmonary arteries to grow so that a transannular
    incision may later be avoided.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Cyanosis and chronic hypoxaemia
    treatment_effect: MODULATES
    description: >
      An alternative source of pulmonary blood flow raises systemic saturation without correcting
      the underlying anatomy.

- name: Pulmonary valve replacement after repair
  description: >
    The principal late reintervention, for symptomatic or haemodynamically significant chronic
    pulmonary regurgitation. It improves symptoms and is associated with a fall in ventricular
    tachycardia incidence, but current guidance does not accept arrhythmia risk alone as an
    indication, because the evidence that valve replacement reduces subsequent arrhythmia risk is
    not robust. That reservation is curated deliberately, since the intuitive inference from the
    remodelling mechanism is that restoring valve competence should reverse the substrate, and
    that inference is not established.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Postoperative pulmonary regurgitation and right ventricular remodelling
    treatment_effect: BYPASSES
    description: >
      Replacing the incompetent valve removes the regurgitant volume load driving right
      ventricular dilation.
    evidence:
    - reference: PMID:39569497
      reference_title: "Long-Term Management of Right Ventricular Outflow Tract Dysfunction in Repaired Tetralogy of Fallot: A Scientific Statement From the American Heart Association."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition, this scientific statement explores contemporary evidence for clinical choices such as transcatheter or surgical pulmonary valve replacement, discusses criteria and options for intervention for failing implanted bioprosthetic pulmonary valves, and considers a new approach to determining optimal timing and indications for pulmonary valve replacement."
      explanation: States that optimal timing and indications for this intervention are being reconsidered rather than settled, which is precisely the open question this entry curates as a discussion.

- name: Implantable cardioverter defibrillator and catheter ablation
  description: >
    Device therapy and ablation for the late ventricular arrhythmia of repaired disease. They are
    curated here so the arrhythmia node is not a dead end in the pathograph, and because they act
    on the arrhythmia itself rather than on the substrate that produces it. That distinction is the
    point of the timing discussion in this entry: valve replacement is the only intervention that
    could plausibly address the substrate, and it has not been shown to reduce arrhythmia risk.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Ventricular arrhythmia and sudden death risk
    treatment_effect: MODULATES
    description: >
      A defibrillator terminates the arrhythmia once it occurs and ablation modifies the reentrant
      circuit, neither of which reverses the underlying fibrosis and dilation.
    evidence:
    - reference: PMID:39569497
      reference_title: "Long-Term Management of Right Ventricular Outflow Tract Dysfunction in Repaired Tetralogy of Fallot: A Scientific Statement From the American Heart Association."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "including transcatheter and surgical pulmonary valve replacement strategies, as well as management of life-threatening arrhythmias"
      explanation: Names management of life-threatening arrhythmias as a distinct therapeutic domain in repaired disease, alongside valve replacement, which is the separation this treatment and the valve replacement treatment are curated to preserve.

diagnosis:
- name: Transthoracic echocardiography
  description: >
    The diagnostic modality, defining the septal defect, the degree of aortic override, the level
    and severity of outflow obstruction, and the arch sidedness. Definition of coronary anatomy
    before operation is a specific requirement rather than an optional refinement, because an
    anomalous vessel crossing the outflow tract changes the operation.
  evidence:
  - reference: PMID:32156463
    reference_title: "Coronary anomalies in tetralogy of Fallot - A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Knowledge of coronary anatomy prior to corrective surgery is vital to avoid damage to vessels crossing the right ventricular outflow tract (RVOT)."
    explanation: States that defining coronary anatomy before operation is required rather than optional, which is the specific diagnostic claim made here.

- name: Genetic testing including 22q11.2 deletion analysis
  description: >
    Worth performing in every case even though most results are negative, because the eighteen
    percent with an identifiable aberration acquire extracardiac surveillance and altered
    recurrence counselling as a result.
  evidence:
  - reference: PMID:19948535
    reference_title: "Comprehensive genotype-phenotype analysis in 230 patients with tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "230 patients with ToF were studied by karyotyping, comprehensive 22q11.2 deletion testing and sequencing of TBX1, NKX2.5 and JAG1, as well as molecular karyotyping in selected patients."
    explanation: Describes the testing strategy that produced the eighteen percent yield, which is what justifies testing unselected patients.

progression:
- phase: Fetal and neonatal period
  notes: >
    The malformation is complete by the eighth week of gestation and is increasingly detected on
    antenatal screening. At birth the presentation is decided by the severity of outflow
    obstruction. Severe obstruction gives ductal-dependent pulmonary blood flow and cyanosis from
    the first hours; mild obstruction gives a well-looking infant with a murmur.
- phase: Infancy
  notes: >
    Dynamic infundibular obstruction typically worsens over the first weeks to months, so a child
    who was pink at birth may become cyanotic and begin to have hypercyanotic spells, classically
    between two and four months. This is the period of greatest risk before repair, and the reason
    repair is not deferred indefinitely.
- phase: Surgical repair
  notes: >
    Complete repair is now usually performed in the first year, often electively in the first
    months. Operative survival is high in well-resourced settings, which is what has converted this
    from a disease of childhood mortality into a lifelong condition of adults.
- phase: Adult survivorship after repair
  notes: >
    Decades of pulmonary regurgitation, progressive right ventricular dilation, exercise
    intolerance, atrial and ventricular arrhythmia, and the question of when to replace the
    pulmonary valve. The population in this phase is growing and is the one in which most
    contemporary uncertainty about this disease now lies.

prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  notes: >
    The most common cyanotic congenital heart disease, accounting for roughly a tenth of all
    congenital heart disease. The class here is coarse because no cited source in this entry
    states a rate.
  evidence:
  - reference: PMID:34905512
    reference_title: "Sequencing of a Chinese tetralogy of Fallot cohort reveals clustering mutations in myogenic heart progenitors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Tetralogy of Fallot (TOF) is the most common cyanotic heart defect, yet the underlying genetic mechanisms remain poorly understood."
    explanation: PARTIAL. Establishes the rank among cyanotic defects but states no rate, so the prevalence class is coarse and no numeric figure is asserted.

differential_diagnoses:
- name: Persistent truncus arteriosus
  description: >
    The other conotruncal malformation of the same developmental program, and the closest
    mechanistic relative. In truncus the outflow tract fails to septate at all, leaving one
    vessel; here it septates in the wrong position. The physiological consequence is opposite in
    a way that matters clinically, since truncus produces unobstructed pulmonary overcirculation
    and heart failure, whereas this disease produces obstructed pulmonary flow and cyanosis.
- name: Double outlet right ventricle
  description: >
    Overlaps anatomically and the distinction can be arbitrary, resting on the degree of aortic
    override, conventionally at a fifty percent threshold.
- name: Pulmonary atresia with ventricular septal defect
  description: >
    Best regarded as the severe end of this disease's own spectrum rather than a separate entity,
    with pulmonary blood flow dependent on the duct or on collateral arteries.

discussions:
- discussion_id: tetralogy_is_one_lesion_not_four
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Should the four cardinal features be modelled as one lesion with four consequences, and does
    the eponym actively mislead?
  rationale: >
    The historical name enumerates four findings as though they were four defects, and generations
    of teaching have followed that enumeration. The embryological account is that a single
    anterocephalad deviation of the outlet septum produces all four as geometric consequences, and
    this entry models it that way, with one node for the deviation and separate downstream nodes
    for the septal defect, the obstruction, and the hypertrophy. The modelling choice is not
    merely tidy. It predicts that the features cannot be dissociated, which is what is observed,
    and it correctly identifies right ventricular hypertrophy as secondary and postnatal rather
    than congenital. It also makes the severity spectrum intelligible, since one deviation of
    varying degree explains a continuum from pink tetralogy to pulmonary atresia, whereas four
    independent defects would not. What remains genuinely open is whether the molecular lesions
    converge on septal position specifically or on outflow tract development broadly, with septal
    deviation being only one of several possible outcomes.
  attaches_to:
  - pathophysiology#Anterocephalad deviation of the outlet septum
  - pathophysiology#Second heart field and cardiac neural crest program disruption
  evidence:
  - reference: PMID:34905512
    reference_title: "Sequencing of a Chinese tetralogy of Fallot cohort reveals clustering mutations in myogenic heart progenitors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered that the candidate gene expression was enriched in the myogenic progenitors of the cardiac outflow tract."
    explanation: PARTIAL. Supports convergence of the genetic lesions on outflow tract development, which is the broader of the two readings; it does not establish that they converge on septal position specifically.
  proposed_experiments:
  - experiment_id: exp_tof_septal_position_quantification
    name: Quantitative morphometry of outlet septal position across genotype groups in fetal specimens
    description: >-
      Measure outlet septal deviation quantitatively across fetal specimens grouped by genotype,
      including 22q11.2 deleted, FLT4 or NOTCH1 variant, and genetically unexplained cases. If all
      genotypes converge on the same septal geometry, the single-lesion model holds across causes.
      If they differ systematically, the shared anatomy is a convergence point rather than the
      direct consequence of each lesion.

- discussion_id: the_repair_creates_the_next_disease
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Given that transannular repair reliably produces lifelong pulmonary regurgitation, and that
    valve replacement has not been shown to reduce arrhythmia risk, when should the valve be
    replaced?
  rationale: >
    This is the sharpest unresolved question in the modern management of this disease, and it
    exists because the operation succeeded. Relieving the outflow obstruction saved a generation of
    children and left them with an incompetent pulmonary valve, decades of right ventricular volume
    loading, and a late arrhythmic substrate. Valve replacement improves symptoms and is associated
    with lower observed ventricular tachycardia incidence, but current guidance declines to treat
    arrhythmia risk alone as an indication, because the evidence that replacement reduces
    subsequent arrhythmia is not robust. The clinician is therefore caught between operating early,
    committing a young patient to repeated prosthetic valve interventions over a lifetime, and
    operating late, by which point right ventricular remodelling may be irreversible. Resolving it
    requires knowing whether the fibrotic substrate regresses after unloading, which is a question
    about the biology of the remodelling node in this entry and not merely about trial design.
  attaches_to:
  - pathophysiology#Postoperative pulmonary regurgitation and right ventricular remodelling
  - pathophysiology#Ventricular arrhythmia and sudden death risk
  - treatments#Pulmonary valve replacement after repair
  proposed_experiments:
  - experiment_id: exp_pvr_timing_substrate_regression
    name: Serial cardiac magnetic resonance fibrosis mapping before and after pulmonary valve replacement stratified by preoperative right ventricular volume
    description: >-
      Follow patients undergoing pulmonary valve replacement with serial cardiac magnetic resonance
      fibrosis mapping and electrophysiological substrate assessment, stratified by preoperative
      right ventricular volume. The decision criterion is whether fibrotic burden regresses after
      unloading and whether that regression depends on operating before a volume threshold. A
      threshold effect would convert an open timing question into a measurable indication.

notes: >
  Deep-research provenance. Curated from a claude_code deep-research report treated as leads only.
  The report was detailed and explicitly asked that its ontology identifiers be verified before
  use, which was warranted.

  Deep-research provider ontology errors corrected. Three of the report's suggested identifiers
  were real CURIEs pointing at unrelated concepts, and three more had labels that did not match
  the identifier.

  CL:0002079 was suggested for cardiac neural crest cell and is actually pancreatic ductal cell.
  HP:0031264 was suggested for heart murmur and is actually Abnormal Bowman capsule morphology, a
  kidney term. HP:0004943 was suggested for the boot-shaped heart radiographic sign and is actually
  Accelerated atherosclerosis. HP:0001714 was suggested for right ventricular hypertrophy and is
  the generic Ventricular hypertrophy, so the specific HP:0001667 is used instead. HP:0004415 is
  real but is Pulmonary artery stenosis rather than the infundibular pulmonic stenosis the report
  labelled it. GO:0061308 is real but its canonical label is cardiac neural crest cell development
  involved in heart development, not involved in outflow tract morphogenesis as suggested.

  Absent bindings. HPO has no term for the
  boot-shaped heart radiographic sign, so that finding is not curated as a phenotype. HPO has no
  term for the hypercyanotic spell as an episodic entity, so it is bound to Cyanosis with a
  recurrent temporality qualifier rather than to an approximate term.

  Corrected term claims. An earlier revision of this entry asserted that CL has no cardiac neural
  crest cell term. That was wrong: CL:2000073 migratory cardiac neural crest cell exists and is
  used here, as it is in the sibling double outlet right ventricle and transposition entries. The
  outflow tract myogenic progenitor is likewise now bound to CL:0000513 cardiac muscle myoblast
  rather than to the generic cardiac muscle cell.

  Corrected provenance claims. An earlier revision of this entry asserted in three places that
  cached abstracts were truncated, and in one place that PMID:30582441 had no abstract body. All
  four claims were false. The caches are complete, and the apparent truncation was an artefact of
  a fixed-width extraction window used during curation rather than anything in the cache. Every
  affected snippet has been re-quoted at sentence boundaries from the full cached text.

  Module conformance. The late ventricular arrhythmia is deliberately not conformed to
  cardiac_ion_channel_repolarization, because its substrate is surgical scar and fibrosis in a
  dilated ventricle rather than a primary channelopathy in a structurally normal heart. This is the
  same judgement made for the atrial fibrillation of rheumatic heart disease.

  NEC preflight returned SKIP, since MONDO records no causal gene for this multifactorial disease.
  The manual fallback was run and passed. The OMIM identifier in the report, 187500, matches the
  OMIM cross-reference on MONDO:0008542 exactly, and the genes the report discusses most
  frequently, SHF, FLT4, NOTCH1, NKX2-5, and TBX1, are all genuine loci for this disease.

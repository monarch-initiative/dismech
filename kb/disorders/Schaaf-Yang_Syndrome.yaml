genetic:
- name: MAGEL2
  gene_term:
    preferred_term: MAGEL2
    term:
      id: hgnc:6814
      label: MAGEL2
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Autosomal dominant with genomic imprinting; only paternal-allele
      truncating variants are pathogenic.
    evidence:
    - reference: PMID:33570896
      reference_title: "Schaaf-Yang Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The 15q11.2 locus that includes MAGEL2 is maternally imprinted, meaning
        that only the paternally derived allele is expressed while the maternally
        derived allele is inactivated.
      explanation: >-
        GeneReviews establishes the imprinted, paternal-allele-only expression
        underlying MAGEL2's autosomal dominant, maternally imprinted inheritance.
  notes: >-
    SYS is caused by truncating (nonsense/frameshift) variants in the single-exon
    gene MAGEL2 on the paternally expressed allele. Nucleotides c.1990-1996 are a
    recurrent mutational hotspot, with a recurrent c.1996dupC (p.Q666fs)
    variant identified in multiple unrelated individuals.
  evidence:
  - reference: PMID:27195816
    reference_title: "The phenotypic spectrum of Schaaf-Yang syndrome: 18 new affected individuals from 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases harbor truncating mutations of MAGEL2, and nucleotides
      c.1990-1996 arise as a mutational hotspot, with 10 individuals and 1 fetus
      harboring a c.1996dupC (p.Q666fs) mutation
    explanation: >-
      Documents the truncating-variant class and the c.1996 mutational hotspot.

treatments:
- name: Feeding Therapy and Supplemental Tube Feeding
  description: >-
    Feeding therapy or supplemental (naso-gastric or gastrostomy) tube feeding is
    used for persistent infantile feeding difficulties and failure to thrive.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: NCIT:C52006
      label: Gastrostomy
  target_phenotypes:
  - preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  target_mechanisms:
  - target: Neonatal Suckling and Feeding Failure
    treatment_effect: BYPASSES
    description: >-
      Tube feeding does not correct the suckling deficit; it delivers nutrition
      through an alternative route, working around the disrupted mechanism.
  evidence:
  - reference: PMID:33570896
    reference_title: "Schaaf-Yang Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Feeding therapy or supplemental tube feeding may be required for
      persistent feeding issues
    explanation: >-
      GeneReviews management recommends feeding therapy / tube feeding.
- name: Oxytocin (Experimental)
  description: >-
    Early postnatal oxytocin administration is an experimental, preclinical
    strategy aimed at the hypothalamic oxytocin deficiency itself rather than at
    compensating for its consequences. In Magel2-deficient mice a single
    injection 3-5 hours after birth rescued the otherwise lethal suckling
    failure. This is NOT established human therapy for Schaaf-Yang syndrome: the
    supporting evidence is model-organism only, the authors' clinical proposal is
    framed for Prader-Willi neonates, and GeneReviews management does not include
    it.
  context: >-
    Experimental / preclinical. Recorded to capture the mechanism-directed
    therapeutic hypothesis and its evidence level, not as a clinical
    recommendation.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: oxytocin
      term:
        id: CHEBI:7872
        label: oxytocin
  target_mechanisms:
  - target: Hypothalamic Oxytocin Deficiency
    treatment_effect: RESTORES
    description: >-
      Exogenous oxytocin replaces the deficient hypothalamic oxytocin signal,
      restoring the suckling behaviour lost in Magel2-deficient neonates.
  target_phenotypes:
  - preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:20876615
    reference_title: "A single postnatal injection of oxytocin rescues the lethal feeding behaviour in mouse newborns deficient for the imprinted Magel2 gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a single injection of OT, 3-5 h after birth, rescued the phenotype of
      Magel2 mutant pups, allowing all of them to survive
    explanation: >-
      Preclinical proof of concept for oxytocin as a mechanism-directed therapy:
      a single postnatal injection rescued the lethal phenotype in the mouse
      model. Model-organism evidence only, which is why this treatment is
      labelled experimental and carries no human efficacy claim.
  - reference: PMID:20876615
    reference_title: "A single postnatal injection of oxytocin rescues the lethal feeding behaviour in mouse newborns deficient for the imprinted Magel2 gene."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that OT supply might constitute a promising avenue for the
      treatment of feeding difficulties in PW neonates
    explanation: >-
      The authors' own therapeutic proposal, graded PARTIAL because it is
      explicitly a proposal ("might constitute a promising avenue") and is
      framed for Prader-Willi neonates rather than Schaaf-Yang syndrome. The
      read-across rests on shared MAGEL2 involvement, so it supports the
      hypothesis but not clinical use in SYS.

- name: Progressive Hypothalamic Leptin Resistance
  description: >-
    In the Magel2-null mouse, arcuate POMC neurons progressively lose leptin
    responsiveness after the neonatal period, providing a mechanism by which
    early feeding difficulty can give way to later hyperphagia and excessive
    weight gain in the subset of individuals who develop obesity.
  mechanism_confidence: PROVISIONAL
  biological_scale: TISSUE
  evidence:
  - reference: PMID:25926624
    reference_title: "Progressive postnatal decline in leptin sensitivity of arcuate hypothalamic neurons in the Magel2-null mouse model of Prader-Willi syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Adult mice lacking Magel2 are insensitive to the anorexic effect of leptin
      treatment, and their hypothalamic pro-opiomelanocortin (POMC) neurons fail
      to depolarize in response to leptin.
    explanation: >-
      Progressive hypothalamic leptin resistance provides a mechanistic basis
      for later-onset hyperphagia/obesity.

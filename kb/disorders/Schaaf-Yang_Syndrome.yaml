        basis for later hyperphagia/obesity in a subset.

- name: Reduced Fetal Movement and Distal Contracture Formation
  description: >-
    At the severe end of the spectrum, MAGEL2 truncation reduces fetal movement,
    producing multiple distal joint contractures; complete loss of fetal
    movement manifests as arthrogryposis multiplex congenita and fetal akinesia.
    Paternal-allele mutant MAGEL2 transcripts are detected only in affected
    individuals, confirming the imprinted disease mechanism in these cases.
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:26365340
    reference_title: "Truncating Mutations of MAGEL2, a Gene within the Prader-Willi Locus, Are Responsible for Severe Arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthrogryposis multiplex congenita (AMC) is characterized by the presence
      of multiple joint contractures resulting from reduced or absent fetal
      movement.
    explanation: >-
      Defines the reduced-fetal-movement mechanism that produces the contracture
      phenotype seen with MAGEL2 truncation.
  - reference: PMID:26365340
    reference_title: "Truncating Mutations of MAGEL2, a Gene within the Prader-Willi Locus, Are Responsible for Severe Arthrogryposis."

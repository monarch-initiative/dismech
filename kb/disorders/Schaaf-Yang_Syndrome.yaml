  description: >-
    Central (hypogonadotropic) hypogonadism has been documented in Schaaf-Yang
    syndrome, consistent with the hypothalamic endocrine involvement shared with
    Prader-Willi syndrome. The evidence is thin: it rests on a single reported
    female with absent spontaneous secondary sexual development, and the same
    cohort states that no systematic endocrinological assessment of the
    syndrome has been published. The broader, better-supported Hypogonadism
    annotation below (cryptorchidism and micropenis in males) is retained
    separately because those male findings are not themselves evidence that the

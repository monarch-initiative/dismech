- name: Hypothalamic Oxytocin Deficiency
  description: >-
    MAGEL2 is highly expressed in hypothalamic oxytocin-producing nuclei.
    Magel2-deficient neonatal mice have reduced hypothalamic oxytocin and a
    lethal suckling/feeding deficit that is recapitulated by an oxytocin-receptor
    antagonist and rescued by a single early postnatal oxytocin injection,
    implicating oxytocin deficiency in the neonatal feeding failure of SYS/PWS.
  mechanism_confidence: PROVISIONAL
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: oxytocin production
    term:
      id: GO:0036162
      label: oxytocin production
  evidence:
  - reference: PMID:20876615
    reference_title: "A single postnatal injection of oxytocin rescues the lethal feeding behaviour in mouse newborns deficient for the imprinted Magel2 gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      injection of a specific OT receptor antagonist in wild-type neonates
      recapitulated the feeding deficiency seen in Magel2 mutants
    explanation: >-
      Pharmacologic recapitulation and rescue link hypothalamic oxytocin
      deficiency to the neonatal feeding failure.
  - reference: PMID:38396741
    reference_title: "The Pivotal Role of Oxytocin's Mechanism of Thermoregulation in Prader-Willi Syndrome, Schaaf-Yang Syndrome, and Autism Spectrum Disorder."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Oxytocin (Oxt) regulates thermogenesis, and altered thermoregulation
      results in Prader-Willi syndrome (PWS), Schaaf-Yang syndrome (SYS), and
      Autism spectrum disorder (ASD).
    explanation: >-
      Graded PARTIAL and tagged OTHER because this is a narrative review
      advancing a proposed hypothesis rather than reporting primary data: the
      authors explicitly "formulate a new hypothesis" linking disrupted
      oxytocin thermoregulation to SYS. It corroborates hypothalamic oxytocin
      as the affected system in SYS, but the thermoregulatory arm is not
      established, consistent with this node's PROVISIONAL
      mechanism_confidence.
  downstream:
  - target: Neonatal Suckling and Feeding Failure
    causal_link_type: DIRECT
    hypothesis_groups:
    - magel2_loss_of_function
    evidence:

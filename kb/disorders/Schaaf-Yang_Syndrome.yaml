  description: >-
    SYS is inherited in an autosomal dominant, maternally imprinted manner: a
    heterozygous pathogenic variant on the paternally derived MAGEL2 allele
    causes disease, whereas the same variant on the maternally derived allele
    does not, because the maternal MAGEL2 allele is normally silenced.
    Approximately half of affected individuals inherited the variant from a
    clinically unaffected father, and the remainder are de novo.
  evidence:
  - reference: PMID:33570896
    reference_title: "Schaaf-Yang Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Schaaf-Yang syndrome is inherited in an autosomal dominant, maternally
      imprinted manner (i.e., a heterozygous pathogenic variant on the
      paternally derived MAGEL2 allele results in disease; a pathogenic variant
      on the maternally derived MAGEL2 allele does not result in disease because
      normally the maternally derived MAGEL2 allele is silenced).
    explanation: >-
      GeneReviews states the autosomal dominant, maternally imprinted mode of
      inheritance.
  - reference: PMID:33570896
    reference_title: "Schaaf-Yang Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 50% of individuals diagnosed with SYS inherited a MAGEL2
      pathogenic variant from a clinically unaffected father and the remainder
      are de novo.
    explanation: >-
      GeneReviews quantifies the inherited-versus-de-novo split, reflecting the
      maternal imprinting of MAGEL2.

diagnosis:
- name: Molecular Genetic Testing of MAGEL2
  description: >-
    The diagnosis is established by identifying a heterozygous pathogenic
    variant on the paternally derived MAGEL2 allele. Because MAGEL2 is
    maternally imprinted, determining the parental origin of the variant is
    required to interpret the result, and parental testing is important for
    counseling.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:33570896
    reference_title: "Schaaf-Yang Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Schaaf-Yang syndrome is established in a proband by
      identification of a heterozygous pathogenic variant in the paternally
      derived MAGEL2 allele by molecular genetic testing.
    explanation: >-
      GeneReviews states the molecular diagnostic criterion for Schaaf-Yang
      syndrome.
  - reference: PMID:27195816
    reference_title: "The phenotypic spectrum of Schaaf-Yang syndrome: 18 new affected individuals from 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The familial association highlights the importance of parental testing,
      determination of the allelic location of the mutation, and the challenges
      for genetic counseling.
    explanation: >-
      Supports parental testing and allelic-origin determination as part of the
      diagnostic workup, which follows from the imprinted inheritance.
- name: MAGEL2 Testing After Negative Prader-Willi Methylation Analysis
  description: >-
    Schaaf-Yang syndrome is a principal differential diagnosis of Prader-Willi
    syndrome. MAGEL2 testing should be considered in a PWS-like phenotype with
    negative PWS methylation analysis. Neonatal contractures favor Schaaf-Yang
    syndrome, whereas childhood-onset hyperphagia is more characteristic of
    Prader-Willi syndrome, though no single feature is exclusive to either.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:27195816
    reference_title: "The phenotypic spectrum of Schaaf-Yang syndrome: 18 new affected individuals from 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the phenotypic overlap between PWS and SHFYNG, testing for mutations
      in MAGEL2 should be considered in the context of PWS-like phenotypes, but
      negative PWS methylation analysis.
    explanation: >-
      States the diagnostic trigger for MAGEL2 testing: a PWS-like phenotype
      with negative PWS methylation analysis.
  - reference: PMID:27195816
    reference_title: "The phenotypic spectrum of Schaaf-Yang syndrome: 18 new affected individuals from 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While SHFYNG and PWS share an appreciable amount of common features, and
      no specific feature appears to be exclusive of one or the other condition,
      the presence of contractures at birth makes SHFYNG more likely, while the
      development of hyperphagia in childhood appears to be more characteristic
      of PWS.
    explanation: >-
      Provides the discriminating clinical features between Schaaf-Yang and
      Prader-Willi syndrome, while noting that no feature is exclusive.


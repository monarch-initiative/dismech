    lethal suckling/feeding deficit that is recapitulated by an oxytocin-receptor
    antagonist and rescued by a single early postnatal oxytocin injection,
    implicating oxytocin deficiency in the neonatal feeding failure of SYS/PWS.
  mechanism_confidence: PROVISIONAL
  biological_scale: TISSUE

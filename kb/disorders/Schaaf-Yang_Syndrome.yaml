      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a Magel2-deficient mouse with 50% neonatal mortality had an altered
        onset of suckling activity and subsequent impaired feeding, suggesting a
        role of MAGEL2 in the suckling deficit seen in PW newborns.
      explanation: >-
        Magel2 loss causes a suckling/feeding deficit paralleling the human
        neonatal feeding difficulty.


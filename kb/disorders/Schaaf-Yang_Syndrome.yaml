- name: Stable Nuclear-Mislocalized Truncated MAGEL2
  description: >-
    Distinct from a simple null, the truncated MAGEL2 protein produced by SYS
    variants is stable and shifts to a predominantly nuclear distribution
    (versus the cytoplasmic wild-type). This supports a neomorphic/toxic
    gain-of-function contribution that may explain why truncating variants cause
    disease while whole-gene deletions largely do not, and is associated with
    altered fibroblast transcriptomic and metabolomic profiles.
  mechanism_confidence: PROVISIONAL
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:36243518
    reference_title: "Advancing in Schaaf-Yang syndrome pathophysiology: from bedside to subcellular analyses of truncated MAGEL2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also identified 132 differentially expressed genes, including
      non-coding RNAs (ncRNAs) such as HOTAIR, and many of them related to
      developmental processes and mitotic mechanisms.
    explanation: >-
      Patient fibroblasts carrying truncated MAGEL2 show a distinct
      transcriptomic signature consistent with an active molecular consequence.

- name: Impaired MAGE-L2-TRIM27 Endosomal Protein Recycling
  description: >-
    MAGEL2 forms the substrate-recognition module of the MAGE-L2-TRIM27 RING
    ubiquitin ligase, which localizes to endosomes via the retromer and
    K63-ubiquitinates WASH to nucleate endosomal F-actin required for
    retromer-mediated cargo recycling. Loss of this activity impairs retrograde
    endosome-to-Golgi transport and recycling of surface receptors, disturbing
    neuronal and neuroendocrine cell function.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: retrograde endosome-to-Golgi transport
    term:
      id: GO:0042147
      label: retrograde transport, endosome to Golgi
  - preferred_term: K63-linked ubiquitination of WASH by MAGE-L2-TRIM27
    term:
      id: GO:0070534
      label: protein K63-linked ubiquitination
    modifier: DECREASED
  cellular_components:
  - preferred_term: retromer cargo-selective complex
    term:
      id: GO:0030906
      label: retromer, cargo-selective complex
  evidence:
  - reference: PMID:23452853
    reference_title: "Regulation of WASH-dependent actin polymerization and protein trafficking by ubiquitination."

- name: Loss of Functional MAGEL2 Protein
  description: >-
    With no functional MAGEL2 expressed, the MAGE-L2-TRIM27 ubiquitin-ligase
    scaffold that normally supports endosomal protein recycling and hypothalamic
    neuroendocrine function is lost. This loss-of-function is proposed to
    underlie phenotypes shared with Prader-Willi syndrome.

mechanistic_hypotheses:
- hypothesis_group_id: magel2_loss_of_function
  hypothesis_label: MAGEL2 Loss-of-Function Branch
  status: CANONICAL
  description: >-
    Because MAGEL2 is expressed only from the paternal allele, a truncating
    variant on that allele leaves the individual with no functional MAGEL2
    protein (functional hemizygosity). Loss of MAGEL2's role in
    retromer/WASH-dependent endosomal recycling and hypothalamic neuroendocrine
    regulation is proposed to underlie many SYS (and shared PWS) phenotypes.
  evidence:
  - reference: PMID:24076603
    reference_title: "Truncating mutations of MAGEL2 cause Prader-Willi phenotypes and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the functional hemizygosity for this gene, a truncating mutation on
      the paternal allele leaves affected individuals without functional,
      expressed MAGEL2, making it potentially pathogenic.
    explanation: >-
      The discovery paper frames SYS as loss of functional MAGEL2 owing to
      paternal-allele functional hemizygosity.
- hypothesis_group_id: truncated_protein_neomorphic
  hypothesis_label: Neomorphic Truncated-Protein Branch
  status: EMERGING
  description: >-
    Loss of function alone does not fully explain SYS, because whole-gene
    deletions of paternal MAGEL2 produce little or no phenotype whereas
    truncating variants cause disease. Patient-derived and cell-based studies
    show that the truncated MAGEL2 protein is stable and mislocalizes to the
    nucleus, suggesting an additional neomorphic/toxic gain-of-function
    contribution beyond simple haploinsufficiency.
  evidence:
  - reference: PMID:36243518
    reference_title: "Advancing in Schaaf-Yang syndrome pathophysiology: from bedside to subcellular analyses of truncated MAGEL2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The truncated form of MAGEL2 displayed a stability similar to the WT but
      it was significantly switched to the nucleus, compared with a mainly
      cytoplasmic distribution of the WT MAGEL2.
    explanation: >-
      Nuclear mislocalization of a stable truncated protein supports a
      neomorphic mechanism distinct from a simple null.
  - reference: PMID:27195816
    reference_title: "The phenotypic spectrum of Schaaf-Yang syndrome: 18 new affected individuals from 14 families."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the pathogenicity of truncating mutations of the paternal allele of
      MAGEL2 has been questioned, due to the small number of cases reported, but
      also because whole-gene deletions of the paternal copy of MAGEL2 appear to
      have no phenotype or very mild phenotypes.
    explanation: >-
      The deletion-versus-truncation discrepancy is the clinical observation
      motivating a non-null (neomorphic) contribution.

pathophysiology:
- name: MAGEL2 Truncating Variant on the Expressed Paternal Allele
  description: >-
    The initiating lesion is a truncating (nonsense or frameshift) pathogenic
    variant in MAGEL2 on the paternally expressed allele. MAGEL2 is a single-exon
    gene within the maternally imprinted Prader-Willi region at 15q11-q13, so
    only the paternal allele is transcribed; a truncating variant on that allele
    removes the C-terminal MAGE homology domain from the expressed protein.

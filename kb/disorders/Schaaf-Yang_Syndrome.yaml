name: Schaaf-Yang Syndrome
creation_date: "2026-07-29T00:00:00Z"
synonyms:
- SYS
- SHFYNG
- Prader-Willi-like syndrome due to MAGEL2 mutation
- MAGEL2-related Schaaf-Yang syndrome
description: >-
  Schaaf-Yang syndrome (SYS; OMIM 615547) is a rare autosomal dominant,
  maternally imprinted neurodevelopmental disorder caused by truncating
  pathogenic variants in the paternally expressed allele of MAGEL2, one of the
  protein-coding genes within the Prader-Willi critical region at 15q11-q13.
  Because MAGEL2 is maternally imprinted, only the paternally derived allele is
  transcribed, so a truncating variant on that allele (whether paternally
  inherited or a de novo variant on the paternal chromosome) leaves the
  individual without functional MAGEL2. SYS shares many features with the
  genetically related Prader-Willi syndrome — neonatal hypotonia, feeding
  difficulties that can transition to hyperphagia and obesity, developmental
  delay, and hypogonadism — but is clinically distinguished by a high frequency
  of distal joint contractures (ranging to arthrogryposis multiplex congenita
  and fetal akinesia at the severe end) and a strikingly elevated rate of autism
  spectrum disorder and more severe intellectual disability. MAGEL2 encodes a
  single-exon MAGE-family protein that scaffolds the MAGE-L2-TRIM27 ubiquitin
  ligase governing WASH-dependent, retromer-mediated endosomal protein recycling,
  and it modulates hypothalamic oxytocin and neuroendocrine systems. The
  prevailing model combines loss of MAGEL2 function with a possible neomorphic
  or toxic effect of the stable, nuclear-mislocalized truncated protein, since
  whole-gene deletions of paternal MAGEL2 produce little or no phenotype.

notes: >-
  IEMbase package seed WP-003 (GitHub issue 5558), classification code 1.6.01.02;
  OMIM:601815; ORPHA:79351. The entry is anchored to the exact PHGDH leaf
  MONDO:0011152. PHGDH-related Neu-Laxova syndrome 1 (MONDO:0009736) is modeled
  as its severe prenatal subtype; PSAT1- and PSPH-related serine-deficiency
  disorders remain separate disease entries and differentials. Mechanistic
  claims were recalibrated so that only the enzyme-to-low-serine chain is
  established, while proposed lipid and NMDA-signaling bridges remain explicit
  emerging hypotheses.
datasets:
- accession: geo:GSE8555
  title: Genome-wide analysis of Phgdh inactivation in murine embryonic head
  description: D-3-Phosphoglycerate dehydrogenase (Phgdh; EC 1.1.1.95) is a necessary enzyme for de novo L-serine biosynthesis via the phosphorylated pathway. We demonstrated previously that Phgdh is expressed exclusively by neuroepithelium and radial glia in developing mouse brain and later mainly by astrocytes. Mutations in the human PHGDH gene cause serine deficiency disorders (SDD) associated with severe neurological symptoms such as congenital microcephaly, psychomotor retardation, and intractable seizures.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: MICROARRAY
  sample_count: 8
  publication: PMID:18228065
  notes: Identified by GEO DataSets index search for 3-Phosphoglycerate Dehydrogenase Deficiency (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

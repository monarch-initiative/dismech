genetic:
- name: PHGDH
  gene_term:
    preferred_term: PHGDH
    term:
      id: hgnc:8923
      label: PHGDH
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic pathogenic PHGDH variants cause this disorder. Missense and
    frameshift variants occur across functional domains and can reduce enzyme
    activity. Residual activity as a predictor of clinical subtype remains a
    hypothesis rather than an established genotype-phenotype rule.
  evidence:
  - reference: PMID:19235232
    reference_title: Novel mutations in 3-phosphoglycerate dehydrogenase (PHGDH) are distributed throughout the protein and result in altered enzyme kinetics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We now describe five novel mutations in five patients with 3-PGDH deficiency; one frameshift mutation
    explanation: Establishes multiple PHGDH variant classes in affected individuals.
  - reference: PMID:25152457
    reference_title: Neu-Laxova syndrome is a heterogeneous metabolic disorder caused by defects in enzymes of the L-serine biosynthesis pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PHGDH missense mutations in three unrelated families of our cohort
    explanation: Extends the PHGDH association to Neu-Laxova syndrome 1.

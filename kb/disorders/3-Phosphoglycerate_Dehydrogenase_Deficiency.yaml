inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    3-PGDH deficiency is inherited in an autosomal recessive manner; affected
    individuals carry biallelic PHGDH variants. The severe, prenatally lethal
    Neu-Laxova syndrome 1 end of the spectrum is likewise autosomal recessive.
  evidence:
  - reference: PMID:19235232
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3-PGDH) deficiency is a rare recessive inborn error in the biosynthesis of the amino acid L-serine"
    explanation: States that 3-PGDH deficiency is a recessive inborn error of L-serine biosynthesis.
  - reference: PMID:25152457
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neu-Laxova syndrome (NLS) is a rare autosomal-recessive disorder"
    explanation: Establishes autosomal recessive inheritance for the severe Neu-Laxova end of the spectrum.
pathophysiology:
- name: PHGDH Enzyme Deficiency
  description: >-
    Biallelic PHGDH variants reduce or abolish 3-phosphoglycerate dehydrogenase
    activity, the first and rate-limiting enzyme of the phosphorylated pathway of
    de novo L-serine biosynthesis (NAD+-dependent oxidation of 3-phosphoglycerate
    to 3-phosphohydroxypyruvate).
  role: trigger
  genes:
  - preferred_term: PHGDH
    term:
      id: hgnc:8923
      label: PHGDH
  molecular_functions:
  - preferred_term: phosphoglycerate dehydrogenase activity
    term:
      id: GO:0004617
      label: phosphoglycerate dehydrogenase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: L-serine biosynthetic process
    term:
      id: GO:0006564
      label: L-serine biosynthetic process
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:11055895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3-phosphoglycerate dehydrogenase (PHGDH) deficiency is a disorder of L-serine biosynthesis"
    explanation: Identifies PHGDH deficiency as a disorder of L-serine biosynthesis.
  - reference: PMID:11055895
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro expression of these mutant proteins resulted in significant reduction of PHGDH enzyme activities."
    explanation: In vitro expression demonstrates that the patient PHGDH variants reduce enzyme activity.
  downstream:
  - target: L-Serine and Glycine Deficiency
    causal_link_type: DIRECT
    description: >-
      Reduced PHGDH activity lowers de novo L-serine synthesis, producing low
      L-serine and, secondarily, low glycine (derived from serine via serine
      hydroxymethyltransferase).
    evidence:
    - reference: PMID:12118526
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The enzyme defect results in low concentrations of serine and to a variable degree of glycine in plasma and cerebrospinal fluid."
      explanation: Directly links the enzyme defect to low serine and glycine in plasma and CSF.
- name: L-Serine and Glycine Deficiency
  description: >-
    The block in de novo synthesis lowers L-serine, D-serine, and glycine in
    plasma and cerebrospinal fluid; reduced 5-methyltetrahydrofolate is also seen,
    reflecting serine's role as a one-carbon donor. The CNS is preferentially
    affected because serine crosses the blood-brain barrier poorly and depends on
    local synthesis.
  role: central_effector
  biological_processes:
  - preferred_term: serine family amino acid biosynthetic process
    term:
      id: GO:0009070
      label: serine family amino acid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:19235232
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biochemical abnormalities associated with this disorder are low concentrations of L-serine, D-serine, and glycine in cerebrospinal fluid (CSF)."
    explanation: Reports low CSF L-serine, D-serine, and glycine as the defining biochemical abnormality.
  - reference: PMID:11508546
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low concentrations of the amino acids serine, glycine as well as 5-methyltetrahydrofolate were found in plasma and CSF"
    explanation: Documents low serine, glycine, and 5-methyltetrahydrofolate in plasma and CSF.
  downstream:
  - target: Impaired CNS Serine-Dependent Biosynthesis
    causal_link_type: DIRECT
    description: >-
      L-serine deficiency starves serine-dependent biosynthetic pathways in the
      developing brain — phospholipids, nucleotides, sphingolipids/myelin, and the
      neurotransmitters glycine and D-serine.
    evidence:
    - reference: PMID:15021249
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "L-serine is a precursor of important metabolites such as nucleotides, phospholipids and the neurotransmitters glycine and D-serine"
      explanation: Establishes the serine-dependent metabolites whose synthesis fails when L-serine is deficient.
- name: Impaired CNS Serine-Dependent Biosynthesis
  description: >-
    Deprivation of serine-derived building blocks impairs myelin membrane
    synthesis (hypomyelination) and normal neurodevelopment, and disturbs
    glycine/D-serine-mediated neurotransmission, contributing to seizures. These
    downstream deficits explain why the phenotype is dominated by CNS disease.
  role: consequence
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:11055895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an important role for PHGDH activity and L-serine biosynthesis in the metabolism, development, and function of the central nervous system"
    explanation: Ties PHGDH activity and L-serine biosynthesis to CNS metabolism, development, and function.
  downstream:
  - target: Neurodevelopmental and White Matter Impairment
    causal_link_type: DIRECT
    description: >-
      The biosynthetic deficit manifests as hypomyelination, congenital
      microcephaly, intractable seizures, and severe psychomotor retardation.
    evidence:
    - reference: PMID:11508546
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pre-treatment MRI demonstrated hypomyelination and profound white matter attenuation in all patients."
      explanation: Documents hypomyelination and white matter attenuation as the CNS structural correlate.
- name: Neurodevelopmental and White Matter Impairment
  description: >-
    Convergent CNS phenotype of 3-PGDH deficiency: congenital microcephaly,
    intractable seizures, severe psychomotor retardation, and hypomyelination.
    Because the underlying deficiency is of a synthesizable amino acid, these
    manifestations are partly responsive to L-serine (± glycine) supplementation,
    especially when treatment starts early.
  role: outcome
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:11055895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by congenital microcephaly, psychomotor retardation, and seizures"
    explanation: Summarizes the core CNS clinical triad of PHGDH deficiency.

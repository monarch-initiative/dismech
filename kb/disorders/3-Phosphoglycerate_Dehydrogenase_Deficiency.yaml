progression:
- phase: Prenatal multisystem disease with pre- or perinatal lethality
  subtype: Neu-Laxova
  age_range: Prenatal period through early infancy
  notes: >-
    PHGDH-related Neu-Laxova syndrome 1 is the severe prenatal end of the
    spectrum, with growth restriction, microcephaly, congenital anomalies, and
    frequent pre- or early-postnatal death.
  evidence:
  - reference: PMID:25152457
    reference_title: Neu-Laxova syndrome is a heterogeneous metabolic disorder caused by defects in enzymes of the L-serine biosynthesis pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neu-Laxova syndrome (NLS) is a rare autosomal-recessive disorder characterized by a recognizable pattern of severe malformations leading to prenatal or early postnatal lethality.
    explanation: Defines the prenatal or early-postnatal lethal natural history of Neu-Laxova syndrome.
  - reference: PMID:32579715
    reference_title: Expanding the genotypic and phenotypic spectrum of severe serine biosynthesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neu-Laxova syndrome represents the most severe expression and is characterized by multiple congenital anomalies and pre- or perinatal lethality.
    explanation: Independently supports the severe prenatal spectrum in a cohort including PHGDH-related families.
- phase: Congenital and infantile neurodevelopmental disease
  subtype: Infantile
  age_range: Birth through early childhood
  notes: >-
    The classic presentation begins with congenital microcephaly and severe
    developmental impairment; seizures and spasticity are variable, and MRI can
    show hypomyelination and profound white-matter attenuation.
  evidence:
  - reference: PMID:28135894
    reference_title: "Infantile Serine Biosynthesis Defect Due to Phosphoglycerate Dehydrogenase Deficiency: Variability in Phenotype and Treatment Response, Novel Mutations, and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: presented with psychomotor delay, growth failure, microcephaly, and spasticity
    explanation: Describes the shared infantile presentation in six PHGDH-deficient individuals from three families.
  - reference: PMID:28135894
    reference_title: "Infantile Serine Biosynthesis Defect Due to Phosphoglycerate Dehydrogenase Deficiency: Variability in Phenotype and Treatment Response, Novel Mutations, and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The phenotype was variable with absence of seizures in 2 sisters in family 1 and 1 infant in family 2 and seizures with pronounced happy affect in 3 sisters in family 3.
    explanation: Shows that seizures are not invariant even in the infantile presentation.
- phase: School-age absence-seizure presentation
  subtype: Juvenile
  age_range: Childhood through adolescence
  notes: >-
    A milder PHGDH-specific presentation has been reported in two siblings with
    normal or near-normal head size, absence seizures, mild developmental delay,
    behavioral abnormalities, and normal brain MRI.
  evidence:
  - reference: DOI:10.1007/s10545-010-9249-5
    reference_title: Expanding the clinical spectrum of 3‐phosphoglycerate dehydrogenase deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: two siblings with juvenile onset of absence seizures and mild developmental delay
    explanation: Defines the PHGDH-specific juvenile presentation in two siblings.
- phase: Reported adult axonal neuropathy presentation
  subtype: Adult
  age_range: Adulthood
  notes: >-
    The adult presentation is based on one 31-year-old individual with chronic
    axonal sensorimotor polyneuropathy, slight ataxia, mild lifelong
    developmental impairment, and congenital cataracts. Its frequency and
    natural history are unknown.
  evidence:
  - reference: PMID:22393170
    reference_title: A serine synthesis defect presenting with a Charcot-Marie-Tooth-like polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A 31-year-old man with congenital cataracts, mild psychomotor retardation, slight cerebellar ataxia, and chronic axonal sensorimotor polyneuropathy.
    explanation: Documents the single PHGDH-specific adult neuropathy case.
mechanistic_hypotheses:
- hypothesis_group_id: serine_derived_cns_insufficiency_model
  hypothesis_label: Serine-derived CNS biosynthesis and signaling insufficiency
  status: EMERGING
  applies_to_subtypes:
  - Infantile
  - Juvenile
  description: >-
    Low L-serine may impair phospholipid synthesis and reduce glycine and
    D-serine availability, contributing to hypomyelination,
    neurodevelopmental impairment, and seizures. The precursor relationships
    are established, but the phenotype-causing intermediates are incompletely
    demonstrated in patients.
  evidence:
  - reference: PMID:29269105
    reference_title: Disturbed phospholipid metabolism in serine biosynthesis defects revealed by metabolomic profiling.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: The observed low phosphatidylcholine species in children with serine biosynthesis defects that improved after serine supplementation, supports the role of serine as a significant precursor for phosphatidylcholine.
    explanation: Supports a serine-to-phospholipid link in a mixed cohort, but not a causal link to neurologic manifestations.
  - reference: PMID:31548413
    reference_title: The NMDA receptor activation by d-serine and glycine is controlled by an astrocytic Phgdh-dependent serine shuttle.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: inhibition of astrocytic Phgdh suppressed the de novo synthesis of l-and d-serine and reduced the NMDAR synaptic potentials and long-term potentiation
    explanation: Provides model-system support for a PHGDH-dependent serine/NMDA-signaling pathway, not proof of the human disease mechanism.

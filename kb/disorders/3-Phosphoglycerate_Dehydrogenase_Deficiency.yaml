biochemical:
- name: Cerebrospinal fluid and plasma L-serine
  presence: DECREASED
  notes: >-
    Low fasting plasma and, more consistently, low cerebrospinal fluid L-serine
    is the primary biochemical marker; CSF sampling is the most sensitive because
    the CNS deficit can exceed the plasma abnormality.
  biomarker_term:
    preferred_term: L-serine
    term:
      id: CHEBI:17115
      label: L-serine
  readouts:
  - target: L-Serine and Glycine Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Decreased L-serine in plasma/CSF reports the PHGDH synthetic block and is
      the key diagnostic marker of serine-deficiency disorders.
    evidence:
    - reference: PMID:19235232
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "low concentrations of L-serine, D-serine, and glycine in cerebrospinal fluid (CSF)"
      explanation: Decreased CSF L-serine is the diagnostic biochemical readout of the enzyme block.
  evidence:
  - reference: PMID:11508546
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low concentrations of the amino acids serine, glycine as well as 5-methyltetrahydrofolate were found in plasma and CSF"
    explanation: Confirms low serine (and glycine) in plasma and CSF in affected patients.
- name: Cerebrospinal fluid and plasma glycine
  presence: DECREASED
  notes: >-
    Glycine, a serine-derived amino acid, is reduced to a variable degree; the
    combination of low serine with low (rather than high) glycine distinguishes
    this disorder from nonketotic hyperglycinemia.
  biomarker_term:
    preferred_term: glycine
    term:
      id: CHEBI:15428
      label: glycine
  evidence:
  - reference: PMID:12118526
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "low concentrations of serine and to a variable degree of glycine in plasma and cerebrospinal fluid"
    explanation: Documents variably reduced glycine alongside low serine.
genetic:
- name: PHGDH
  gene_term:
    preferred_term: PHGDH
    term:
      id: hgnc:8923
      label: PHGDH
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic PHGDH variants cause the disorder. The first-described alleles were
    the carboxy-terminal missense variants p.V490M and p.V425M; additional
    missense and frameshift variants across the nucleotide-binding and regulatory
    domains have since been reported, with residual enzyme activity correlating
    broadly with phenotype severity.
  evidence:
  - reference: PMID:19235232
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only two missense mutations (p.V425M and p.V490M) have been identified in PHGDH, the gene encoding 3-PGDH"
    explanation: Establishes PHGDH as the disease gene and names the two originally reported variants.
  - reference: PMID:11055895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "predicted to change valine at position 490 to methionine"
    explanation: Identifies the recurrent p.V490M PHGDH variant in patients.
- name: PHGDH (Neu-Laxova severe allele)
  gene_term:
    preferred_term: PHGDH
    term:
      id: hgnc:8923
      label: PHGDH
  relationship_type: CAUSATIVE
  notes: >-
    Homozygous PHGDH missense variants also underlie Neu-Laxova syndrome 1
    (MONDO:0009736, OMIM:256520), the severe prenatally lethal end of the
    serine-deficiency spectrum.
  evidence:
  - reference: PMID:25152457
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous mutations in PHGDH, a gene involved in the first and limiting step in L-serine biosynthesis, were recently identified as the cause of the disease"
    explanation: Identifies homozygous PHGDH variants as a cause of Neu-Laxova syndrome.
has_subtypes:
- name: Infantile
  display_name: Infantile (classic) 3-PGDH deficiency
  description: >-
    Classic severe form presenting with congenital microcephaly, intractable
    seizures, and severe psychomotor retardation, with hypomyelination on MRI.
  evidence:
  - reference: PMID:9708551
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are affected with congenital microcephaly, psychomotor retardation, and intractable seizures."
    explanation: Describes the classic infantile presentation.
- name: Neu-Laxova
  display_name: Neu-Laxova syndrome 1 (severe/lethal)
  description: >-
    Severe, prenatally or early-postnatally lethal end of the spectrum
    (MONDO:0009736, OMIM:256520), with a recognizable pattern of severe
    malformations (microcephaly, ichthyosis, limb contractures, intrauterine
    growth restriction), caused by severe PHGDH (or other L-serine pathway)
    deficiency.
  evidence:
  - reference: PMID:25152457
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NLS represents the severe end of serine-deficiency disorders"
    explanation: Positions Neu-Laxova syndrome as the severe end of the serine-deficiency spectrum.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    3-PGDH deficiency is very rare, with only small numbers of families reported
    in the literature; a precise prevalence is not established.
  evidence:
  - reference: PMID:19235232
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3-PGDH) deficiency is a rare recessive inborn error"
    explanation: States that the disorder is rare.
treatments:
- name: L-Serine (and glycine) supplementation
  description: >-
    Oral L-serine supplementation, sometimes combined with glycine, replenishes
    the deficient amino acids. It reduces seizure frequency and, when begun early,
    can improve myelination and developmental outcome; addition of glycine can
    abolish seizures in patients incompletely controlled on L-serine alone.
    Serine-deficiency disorders are, unusually among neurometabolic disorders,
    potentially treatable.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: MAXO:0000088
      label: dietary intervention
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
    - preferred_term: glycine
      term:
        id: CHEBI:15428
        label: glycine
  target_mechanisms:
  - target: L-Serine and Glycine Deficiency
    treatment_effect: RESTORES
    description: Amino acid supplementation directly corrects the serine (and glycine) deficiency.
  evidence:
  - reference: PMID:9708551
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that 3-PGDH can be treated effectively by a combination of L-serine and glycine."
    explanation: Concludes that combined L-serine and glycine effectively treat 3-PGDH deficiency.
  - reference: PMID:15021249
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can be treated with supplementation of L-serine, sometimes combined with glycine"
    explanation: States that serine-deficiency symptoms can be treated with L-serine, sometimes with glycine.
  - reference: PMID:12118526
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A major reduction in seizure frequency occurred in all patients; two patients became free of seizures."
    explanation: Reports the seizure response to amino acid therapy in a treated cohort.
discussions:
- discussion_id: gap_phgdh_early_and_prenatal_treatment
  prompt: >-
    To what extent can early postnatal — or prenatal maternal — L-serine
    supplementation prevent the irreversible neurodevelopmental damage of 3-PGDH
    deficiency, and what residual PHGDH activity threshold separates the treatable
    infantile/juvenile forms from the prenatally lethal Neu-Laxova end of the
    spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Amino acid therapy reduces seizures reliably but developmental improvement is
    seen mainly with very early treatment, implying a narrow window before fixed
    injury; the genotype/residual-activity determinants of the treatable-versus-
    lethal boundary are not firmly established.
  attaches_to:
  - pathophysiology#Neurodevelopmental and White Matter Impairment
notes: >-
  IEMbase package seed WP-003 (issue #5558), classification code 1.6.02.01
  (PHGDH-related 3-phosphoglycerate dehydrogenase deficiency); OMIM:601815;
  ORPHA:79351. Anchored to the exact MONDO leaf MONDO:0011152 (PHGDH deficiency),
  which is_a the grouping term MONDO:0018491 (3-phosphoglycerate dehydrogenase
  deficiency). The prenatally lethal Neu-Laxova syndrome 1 (MONDO:0009736,
  OMIM:256520) is modeled as the severe subtype of the same L-serine-biosynthesis
  spectrum rather than as a separate entry. NEC preflight (CLAUDE.md §2b) passed:
  MONDO:0011152 def/xrefs name PHGDH and OMIM:601815, matching the seed row.
  Sibling serine-biosynthesis defects PSAT1 (1.6.02.01 partner) and PSPH
  (1.6.03.01) are deferred to later WP-003 increments.

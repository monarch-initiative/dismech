inheritance:
- name: Autosomal recessive inheritance with variable expressivity
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Affected individuals carry biallelic germline PHGDH variants. Expressivity
    ranges from prenatal Neu-Laxova syndrome 1 to infantile, juvenile, and a
    reported adult presentation; clinical severity cannot currently be predicted
    reliably from routine biochemical measurements or variant position alone.
  evidence:
  - reference: DOI:10.1007/s10545-010-9249-5
    reference_title: Expanding the clinical spectrum of 3‐phosphoglycerate dehydrogenase deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is an autosomal recessive disorder caused by a defect in the synthesis of the amino acid L-serine.
    explanation: Directly states the autosomal recessive inheritance of PHGDH deficiency.
  - reference: PMID:25152457
    reference_title: Neu-Laxova syndrome is a heterogeneous metabolic disorder caused by defects in enzymes of the L-serine biosynthesis pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Homozygous mutations in PHGDH, a gene involved in the first and limiting step in L-serine biosynthesis, were recently identified as the cause of the disease in three families.
    explanation: Establishes biallelic PHGDH variation in families with Neu-Laxova syndrome.
  - reference: PMID:37347880
    reference_title: Serine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      each sib of an affected individual has at conception a 25% chance of being
      affected, a 50% chance of being an asymptomatic carrier, and a 25% chance
      of inheriting neither of the familial pathogenic variants.
    explanation: >-
      GeneReviews states the recurrence risks when both parents are known
      heterozygotes; these figures do not replace family-specific counseling.

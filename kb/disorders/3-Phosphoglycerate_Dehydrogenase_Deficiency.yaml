    snippet: Patients' fibroblasts displayed a significant, but incomplete, reduction in maximal enzyme activities associated with all missense mutations.
    explanation: Supports the functional enzyme assay.
differential_diagnoses:
- name: PSAT deficiency
  disease_term:
    preferred_term: PSAT deficiency
    term:
      id: MONDO:0012596
      label: PSAT deficiency
  description: PSAT1 deficiency causes an overlapping autosomal recessive serine-biosynthesis disorder with low serine and infantile or prenatal neurologic disease.
  distinguishing_features:
  - Biallelic PSAT1 variants, rather than PHGDH variants, establish this diagnosis.
  evidence:
  - reference: PMID:37347880
    reference_title: Serine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: biallelic pathogenic variants in PHGDH, PSAT1, or PSPH identified by molecular genetic testing
    explanation: Supports gene-specific molecular differentiation within the serine-deficiency group.
- name: PSPH deficiency
  disease_term:
    preferred_term: PSPH deficiency
    term:
      id: MONDO:0013531
      label: PSPH deficiency
  description: PSPH deficiency can produce overlapping serine-deficiency biochemistry and neurodevelopmental disease.
  distinguishing_features:
  - Biallelic PSPH variants, rather than PHGDH variants, establish this diagnosis.
  evidence:
  - reference: PMID:25152457
    reference_title: Neu-Laxova syndrome is a heterogeneous metabolic disorder caused by defects in enzymes of the L-serine biosynthesis pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a homozygous frameshift mutation in PSPH, the gene encoding phosphoserine phosphatase
    explanation: Establishes PSPH as a distinct causal gene in the serine-biosynthesis/NLS differential.
- name: Neu-Laxova syndrome 2
  disease_term:
    preferred_term: Neu-Laxova syndrome 2
    term:
      id: MONDO:0014466
      label: Neu-Laxova syndrome 2
  description: Neu-Laxova syndrome 2 overlaps the prenatal malformation and lethal presentation of PHGDH-related NLS1.
  distinguishing_features:
  - Neu-Laxova syndrome 2 is caused by biallelic PSAT1 variants; PHGDH-related disease is Neu-Laxova syndrome 1.
  evidence:
  - reference: PMID:25152457
    reference_title: Neu-Laxova syndrome is a heterogeneous metabolic disorder caused by defects in enzymes of the L-serine biosynthesis pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: six families with three different missense and frameshift PSAT1 mutations fully segregating with the disease
    explanation: Supports PSAT1-related NLS as a genetically distinct differential.
treatments:
- name: L-Serine supplementation
  action_category: THERAPEUTIC
  description: >-
    Oral L-serine bypasses the biosynthetic block and restores serine
    concentrations. Repeated small cohorts show the clearest benefit for seizure
    control and sometimes spasticity or well-being. Developmental improvement is
    inconsistent, especially after established injury; MRI improvement occurred
    in two of four treated individuals in one series.
  treatment_term:
    preferred_term: amino acid supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Cerebral hypomyelination
    term:
      id: HP:0006808
      label: Cerebral hypomyelination
  target_mechanisms:
  - target: PHGDH Enzyme Deficiency
    treatment_effect: BYPASSES
    description: Exogenous L-serine supplies pathway product downstream of deficient PHGDH.
    evidence:
    - reference: PMID:12118526
      reference_title: "Congenital microcephaly and seizures due to 3-phosphoglycerate dehydrogenase deficiency: outcome of treatment with amino acids."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: oral treatment with the deficient amino acids
      explanation: Supports substrate replacement as the treatment rationale but does not directly assay pathway flux.
  - target: Low L-Serine and Downstream Metabolites
    treatment_effect: RESTORES
    description: Supplementation normalizes plasma and CSF serine in treated patients.
    evidence:
    - reference: DOI:10.1007/s10545-010-9249-5
      reference_title: Expanding the clinical spectrum of 3‐phosphoglycerate dehydrogenase deficiency
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The values of CSF and plasma serine normalised during treatment.
      explanation: Directly supports biochemical restoration in a juvenile patient.
  evidence:
  - reference: PMID:12118526
    reference_title: "Congenital microcephaly and seizures due to 3-phosphoglycerate dehydrogenase deficiency: outcome of treatment with amino acids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A major reduction in seizure frequency occurred in all patients; two patients became free of seizures.
    explanation: Reports seizure benefit in five treated patients; psychomotor progress occurred in only one, diagnosed early and treated at high dose.
  - reference: PMID:28135894
    reference_title: "Infantile Serine Biosynthesis Defect Due to Phosphoglycerate Dehydrogenase Deficiency: Variability in Phenotype and Treatment Response, Novel Mutations, and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The initiation of serine treatment had pronounced effect on seizures and spasticity in the sisters in family 3, but minimal developmental effects on the children in families 1 and 2.
    explanation: Supports seizure/spasticity response and limited developmental recovery in a PHGDH-specific cohort.
  - reference: PMID:11508546
    reference_title: Hypomyelination and reversible white matter attenuation in 3-phosphoglycerate dehydrogenase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: a significant increase in white matter volume was found and a progress of myelination in two patients
    explanation: Supports treatment-associated imaging improvement in two of four individuals.
  - reference: PMID:37347880
    reference_title: Serine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: L-serine therapy is more effective than anti-seizure medication for treatment of seizures
    explanation: >-
      GeneReviews supports L-serine as the preferred disease-directed treatment
      for seizures while the primary cohorts above define the small evidence base.
- name: Adjunct glycine supplementation
  action_category: THERAPEUTIC
  description: >-
    Glycine has been added when high-dose L-serine did not control seizures. The
    evidence is limited to two siblings and should not be generalized as a
    universal requirement.
  treatment_term:
    preferred_term: amino acid supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: glycine
      term:
        id: CHEBI:15428
        label: glycine
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  target_mechanisms:
  - target: Low L-Serine and Downstream Metabolites
    treatment_effect: RESTORES
    description: Adjunct glycine supplies one variably deficient downstream amino acid.
    evidence:
    - reference: PMID:9708551
      reference_title: Beneficial effects of L-serine and glycine in the management of seizures in 3-phosphoglycerate dehydrogenase deficiency.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: Addition of glycine 200 mg/kg/day resulted in complete disappearance of seizures.
      explanation: Demonstrates clinical response in two siblings but does not separately quantify mechanism restoration.
  evidence:
  - reference: PMID:9708551
    reference_title: Beneficial effects of L-serine and glycine in the management of seizures in 3-phosphoglycerate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: L-Serine up to 500 mg/kg/day was not sufficient for seizure control. Addition of glycine 200 mg/kg/day resulted in complete disappearance of seizures.
    explanation: Supports adjunct glycine after inadequate L-serine response in two siblings.
- name: Maternal prenatal L-serine supplementation
  action_category: THERAPEUTIC
  context: Single molecularly diagnosed affected fetus; unreplicated case report, not established routine care.
  description: >-
    Maternal L-serine was given after declining fetal head circumference in one
    affected pregnancy. Fetal head growth increased and development was reported
    as unremarkable at 48 months, but efficacy, safety, dose, and generalizability
    remain unestablished.
  treatment_term:
    preferred_term: amino acid supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
  target_phenotypes:
  - preferred_term: Primary microcephaly
    term:
      id: HP:0011451
      label: Primary microcephaly
  target_mechanisms:
  - target: Low L-Serine and Downstream Metabolites
    treatment_effect: RESTORES
    description: Maternal supplementation was intended to supply serine to the affected fetus.
    evidence:
    - reference: PMID:15610810
      reference_title: Prenatal and early postnatal treatment in 3-phosphoglycerate-dehydrogenase deficiency.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: L-serine was then given to the mother
      explanation: Documents the intervention but does not directly demonstrate fetal biochemical normalization.
  evidence:
  - reference: PMID:15610810
    reference_title: Prenatal and early postnatal treatment in 3-phosphoglycerate-dehydrogenase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: L-serine was then given to the mother, which resulted in an enlarged fetal head circumference to the 76th percentile at 31 weeks.
    explanation: Supports the reported response in one fetus; no replication or comparator establishes general efficacy.
- name: Longitudinal clinical surveillance
  action_category: MONITORING
  description: >-
    Follow-up should be individualized across the broad PHGDH spectrum and
    monitor seizures, tone and contractures, development and behavior, growth and
    nutrition, feeding and constipation, respiratory and musculoskeletal issues,
    and family support needs. GeneReviews recommends dental evaluation every six
    months.
  evidence:
  - reference: PMID:37347880
    reference_title: Serine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surveillance: Monitor for seizures, changes in tone, contractures,
      developmental and educational needs, behavior issues, growth and nutrition,
      constipation and feeding issues, respiratory issues, musculoskeletal
      manifestations, and family needs at each visit. Dental evaluation every six
      months.
    explanation: >-
      GeneReviews gives the multisystem surveillance domains and dental interval
      for serine deficiency disorders.
- name: Seizure-trigger avoidance counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Families should receive anticipatory counseling and illness planning around
    recognized seizure triggers, including infection and physical or emotional
    stress.
  evidence:
  - reference: PMID:37347880
    reference_title: Serine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Agents/circumstances to avoid: Known triggers of seizure activity (e.g.,
      infection, physical stress, emotional stress).
    explanation: >-
      GeneReviews identifies clinically relevant seizure triggers for anticipatory
      counseling and illness planning.
discussions:
- discussion_id: gap_phgdh_treatment_timing_and_generalizability
  prompt: How reproducible, safe, dose-dependent, and timing-dependent are early postnatal and antenatal L-serine benefits in PHGDH deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Seizure improvement is repeated across small cohorts, but developmental
    recovery is inconsistent. One antenatally treated fetus had improved head
    growth and an unremarkable 48-month outcome, which establishes precedent but
    not general efficacy or safety.
  attaches_to:
  - pathophysiology#Low L-Serine and Downstream Metabolites
  - pathophysiology#Infantile and Juvenile Neurologic Disease
  proposed_experiments:
  - experiment_id: phgdh_prospective_treatment_registry
    name: Prospective genotype- and treatment-timing registry
    description: >-
      Enroll molecularly confirmed PHGDH cases before treatment and collect
      standardized dose, treatment-age, seizure, development, amino-acid, and
      longitudinal MRI outcomes, with a separately governed prenatal cohort.
    decision_criterion: A reproducible dose/timing-response relationship across independent families with prospectively defined biochemical and clinical outcomes.
    would_support:
    - pathophysiology#Low L-Serine and Downstream Metabolites
  evidence:
  - reference: PMID:15610810
    reference_title: Prenatal and early postnatal treatment in 3-phosphoglycerate-dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At birth, the girl's head circumference was normal, and at 48 months' follow-up, her psychomotor development has been unremarkable.
    explanation: Defines the promising but unreplicated prenatal observation.
  - reference: PMID:12118526
    reference_title: "Congenital microcephaly and seizures due to 3-phosphoglycerate dehydrogenase deficiency: outcome of treatment with amino acids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A progress of psychomotor development was only observed in one patient, diagnosed early and treated with a high dosage of L-serine.
    explanation: Shows the limited and timing-associated developmental response that a prospective registry must resolve.
- discussion_id: gap_phgdh_genotype_residual_activity
  prompt: Which PHGDH variant, domain, or residual-activity features, if any, predict infantile, juvenile, adult, or Neu-Laxova syndrome 1 presentation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Residual enzyme activity is hypothesized to influence severity, yet severe
    and mild presentations can have overlapping serine concentrations and
    fibroblast activity. No clinically reliable genotype-phenotype rule is
    established.
  attaches_to:
  - pathophysiology#PHGDH Enzyme Deficiency
  proposed_experiments:
  - experiment_id: phgdh_variant_function_registry
    name: Standardized PHGDH variant-function and phenotype study
    description: >-
      Measure expression, stability, kinetics, and pathway flux for PHGDH
      variants under one protocol and link results to harmonized longitudinal
      clinical phenotypes and treatment exposure.
    decision_criterion: Prespecified functional measurements predict subtype and severity in an independent validation cohort beyond treatment timing and family background.
    would_support:
    - pathophysiology#PHGDH Enzyme Deficiency
  evidence:
  - reference: PMID:32579715
    reference_title: Expanding the genotypic and phenotypic spectrum of severe serine biosynthesis disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: We postulate that the individual residual enzyme activity of mutant proteins is the major determinant of the phenotypic variability
    explanation: States the residual-activity model explicitly as a postulate requiring further functional study.
  - reference: DOI:10.1007/s10545-010-9249-5
    reference_title: Expanding the clinical spectrum of 3‐phosphoglycerate dehydrogenase deficiency
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: mild clinical phenotype could not be predicted from the biochemical or molecular analysis
    explanation: Shows why routine measurements cannot yet predict clinical severity.
- discussion_id: gap_phgdh_tissue_selective_vulnerability
  prompt: Which serine-derived pathways produce central nervous system, peripheral nerve, eye/skin, and prenatal multisystem phenotypes in PHGDH deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Human phospholipid profiles and an astrocytic PHGDH-dependent serine shuttle
    provide candidate mechanisms, but neither explains the full tissue and
    subtype spectrum or has been causally validated in human disease models.
  attaches_to:
  - pathophysiology#Serine-Dependent CNS Biosynthetic and Signaling Insufficiency
  - pathophysiology#Adult Axonal Neuropathy Syndrome
  - pathophysiology#Prenatal Neu-Laxova Multisystem Developmental Disruption
  proposed_experiments:
  - experiment_id: phgdh_isogenic_tissue_flux_models
    name: Isogenic human tissue-selective serine-flux models
    description: >-
      Compare matched PHGDH-deficient and corrected neural progenitor,
      astrocyte-neuron, oligodendrocyte, peripheral-nerve, lens, and fetal
      developmental models using isotope-resolved serine, lipid, nucleotide,
      glycine, and D-serine flux with L-serine rescue.
    decision_criterion: A tissue-specific deficit is reproduced across variants, corrected by isogenic repair, and rescued by pathway-specific supplementation in parallel with disease-relevant cellular readouts.
    would_support:
    - pathophysiology#Serine-Dependent CNS Biosynthetic and Signaling Insufficiency
  evidence:
  - reference: PMID:29269105
    reference_title: Disturbed phospholipid metabolism in serine biosynthesis defects revealed by metabolomic profiling.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: low phospholipid species, including glycerophosphocholine, glycerophosphoethanolamine, and sphingomyelin
    explanation: Supplies a human metabolic candidate requiring tissue-level causal testing.
  - reference: PMID:31548413
    reference_title: The NMDA receptor activation by d-serine and glycine is controlled by an astrocytic Phgdh-dependent serine shuttle.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: implicate both d-serine and glycine in mediating NMDAR synaptic activation at the mature hippocampus through a Phgdh-dependent shuttle mechanism
    explanation: Supplies a model-system signaling candidate requiring translation to human PHGDH deficiency.

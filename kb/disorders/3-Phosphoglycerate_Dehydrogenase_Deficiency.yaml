name: 3-Phosphoglycerate Dehydrogenase Deficiency
creation_date: "2026-07-08T12:00:00Z"
category: Mendelian
synonyms:
- PHGDH deficiency
- 3-PGDH deficiency
- Phosphoglycerate dehydrogenase deficiency
description: >-
  3-Phosphoglycerate dehydrogenase deficiency is an autosomal recessive
  L-serine-biosynthesis disorder caused by biallelic pathogenic variants in
  PHGDH. Reduced activity of the first enzyme in the phosphorylated serine
  pathway causes low cerebrospinal-fluid L-serine and D-serine, variably low
  glycine in plasma and CSF, and usually low or borderline-low fasting plasma
  L-serine. PHGDH-related disease spans a classic
  infantile neurodevelopmental presentation, a milder juvenile presentation
  with absence seizures, a single reported adult neuropathy presentation, and
  the severe prenatal Neu-Laxova syndrome 1 spectrum. L-serine treatment most
  consistently improves seizures; developmental recovery is variable and
  appears strongly dependent on treatment timing. The human pathways linking
  serine deficiency to neurodevelopmental injury, hypomyelination, peripheral
  neuropathy, and prenatal multisystem malformations remain incompletely
  resolved.
classifications:
  icimd_category:
  - classification_value: gly_and_ser
    notes: >-
      ICIMD places PHGDH deficiency among disorders of glycine and serine
      metabolism. This entry is restricted to PHGDH-related disease rather than
      the broader serine-deficiency-disorder grouping.
    evidence:
    - reference: PMID:19235232
      reference_title: Novel mutations in 3-phosphoglycerate dehydrogenase (PHGDH) are distributed throughout the protein and result in altered enzyme kinetics.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a rare recessive inborn error in the biosynthesis of the amino acid L-serine
      explanation: Supports classification as an inherited disorder of serine metabolism.

name: 3-Phosphoglycerate Dehydrogenase Deficiency
creation_date: "2026-07-08T12:00:00Z"
description: >-
  3-Phosphoglycerate dehydrogenase (3-PGDH / PHGDH) deficiency is an autosomal
  recessive neurometabolic disorder of L-serine biosynthesis caused by biallelic
  PHGDH pathogenic variants. PHGDH catalyzes the first and rate-limiting step of
  the phosphorylated pathway of de novo L-serine synthesis (oxidation of
  3-phosphoglycerate to 3-phosphohydroxypyruvate). Loss of enzyme activity
  produces low concentrations of L-serine and, secondarily, glycine (a
  serine-derived metabolite) in plasma and cerebrospinal fluid. Because L-serine
  is a precursor of phospholipids, nucleotides, sphingolipids/myelin, and the
  neurotransmitters glycine and D-serine — and the brain depends heavily on local
  synthesis because serine crosses the blood-brain barrier poorly — the deficit
  falls most heavily on the developing central nervous system. The classic
  infantile form presents with congenital microcephaly, intractable seizures,
  and severe psychomotor retardation, with hypomyelination on MRI; a milder
  juvenile form and, at the severe end, the prenatally lethal Neu-Laxova syndrome
  1 are part of the same phenotypic spectrum. Unusually among neurometabolic
  disorders, serine-deficiency disorders are potentially treatable with oral
  L-serine supplementation, sometimes combined with glycine.
category: Metabolic Disorder
parents:
- Metabolic Disease
- Inborn Error of Metabolism
- Neurometabolic disorder due to serine deficiency
synonyms:
- PHGDH deficiency
- 3-PGDH deficiency
- Phosphoglycerate dehydrogenase deficiency
- Serine deficiency disorder
- Serine-deficiency syndrome
classifications:
  icimd_category:
  - classification_value: gly_and_ser
    notes: >-
      ICIMD "Disorders of glycine and serine metabolism" (super-domain
      intermediary metabolism — nutrients). PHGDH deficiency is the defect of the
      first, rate-limiting step of the phosphorylated pathway of de novo L-serine
      biosynthesis.

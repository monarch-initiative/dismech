inheritance:
- name: Multifactorial susceptibility
  description: >-
    Cardiac sarcoidosis is not a Mendelian disorder. It arises in genetically
    susceptible individuals as an organ-specific expression of systemic
    sarcoidosis, whose susceptibility is polygenic (HLA and non-HLA alleles); no
    causal gene is established for the cardiac phenotype specifically, and
    MONDO:0001707 records no causal gene relation.
  evidence:
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Major progress in the care of CS awaits the key to its molecular-genetic
      pathogenesis and large-scale controlled clinical trials.
    explanation: >-
      Supports the absence of an established molecular-genetic basis for cardiac
      sarcoidosis indirectly, by naming it as an outstanding research need rather
      than asserting a specific inheritance model.
prevalence:
- population: Patients with systemic/pulmonary sarcoidosis (clinically manifest cardiac involvement)
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    Clinically manifest cardiac involvement in approximately 5% of sarcoidosis
    patients. This is a proportion of the sarcoidosis population, not a general
    population rate, so no rate_per_100000 is asserted.
  evidence:
  - reference: PMID:27443438
    reference_title: Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically manifest cardiac involvement occurs in perhaps 5% of patients with sarcoidosis.
    explanation: States the proportion of sarcoidosis patients with clinically manifest cardiac disease.
- population: Patients with systemic/pulmonary sarcoidosis (clinically silent cardiac involvement)
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Occult (imaging- or autopsy-detected) cardiac involvement in 20-25% of
    sarcoidosis patients - four to five times the clinically detectable rate.
    Again a within-sarcoidosis proportion, not a population rate.
  evidence:
  - reference: PMID:27443438
    reference_title: Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An estimated 20% to 25% of patients with pulmonary/systemic sarcoidosis
      have asymptomatic cardiac involvement (clinically silent disease).
    explanation: Quantifies clinically silent cardiac involvement among sarcoidosis patients.
  - reference: PMID:28501519
    reference_title: The Utility of Cardiac Magnetic Resonance Imaging in the Diagnosis of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autopsy reports suggest that cardiac sarcoidosis occurs in 20 to 25% of
      patients with pulmonary sarcoidosis, yet the clinical ante-mortem diagnosis
      is made in only 5% of cases.
    explanation: >-
      Independently corroborates the autopsy-versus-clinical detection gap that
      separates the two prevalence records.
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Manifest CS, however, constitutes only the top of an iceberg as advanced
      imaging uncovers cardiac involvement 4 to 5 times more commonly than what
      is clinically detectable.
    explanation: Quantifies the ratio of imaging-detected to clinically detected cardiac involvement.
has_subtypes:
- name: Isolated CS
  display_name: Isolated cardiac sarcoidosis
  description: >-
    Sarcoid granulomatous disease confined to the heart, without demonstrable
    extracardiac organ involvement. Diagnostically the hardest form (no
    extracardiac biopsy target) and prognostically the worst.
  evidence:
  - reference: PMID:41193496
    reference_title: "Isolated cardiac sarcoidosis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isolated cardiac sarcoidosis is a distinct entity of sarcoidosis
      characterized by disease confined exclusively to the heart, without
      involvement of other organs.
    explanation: Defines the isolated cardiac subtype as a distinct entity.
  - reference: PMID:41193496
    reference_title: "Isolated cardiac sarcoidosis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with multi-organ cardiac sarcoidosis, isolated cardiac
      sarcoidosis is associated with lower left ventricular ejection fraction and
      poorer survival.
    explanation: Establishes the prognostic separation of the isolated subtype from multi-organ disease.
- name: Systemic CS
  display_name: Cardiac sarcoidosis with extracardiac involvement
  description: >-
    Cardiac involvement occurring in a patient with demonstrable extracardiac
    sarcoidosis, either as the presenting organ or superimposed on established
    systemic disease. Extracardiac histology can substitute for myocardial biopsy
    in the diagnostic pathway.
  evidence:
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CS can appear as the first or only organ manifestation of sarcoidosis or on
      top of pre-existing extracardiac disease.
    explanation: Distinguishes cardiac-first and superimposed presentations from isolated disease.
definitions:
- name: 2014 Heart Rhythm Society (HRS) expert consensus criteria
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The 2014 HRS international expert consensus statement is the most widely
    used framework in Europe and North America. It allows a clinical diagnosis
    of cardiac sarcoidosis from histologically proven extracardiac sarcoidosis
    plus a qualifying cardiac abnormality (high-grade AV block, ventricular
    arrhythmia, reduced LVEF, or characteristic CMR/FDG-PET findings), with
    histologic diagnosis reserved for myocardial biopsy. Its screening arm is
    symptoms plus electrocardiography plus conventional echocardiography.
  scope: Clinical and histologic diagnosis of cardiac involvement in sarcoidosis
  evidence:
  - reference: PMID:37123482
    reference_title: Comparing and Contrasting Guidelines for the Management of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also, in 2014, the Heart Rhythm Society (HRS) published their
      international guideline document.
    explanation: >-
      Establishes the 2014 HRS document as one of the three standing
      cardiac-sarcoidosis guideline frameworks.
  - reference: PMID:40445485
    reference_title: Screening for cardiac involvement in patients with sarcoidosis using AIIMS algorithm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heart Rhythm Society (HRS) screening algorithm is commonly used and
      comprises the presence of cardiac symptoms, electrocardiography and
      conventional echocardiography.
    explanation: >-
      Specifies the three components of the HRS screening arm, which is why
      echocardiography is curated as a first-line diagnostic rung in this entry.
- name: 2016 Japanese Circulation Society (JCS) guideline criteria
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The JCS guideline is the Japanese national framework, developed by a
    community that has led cardiac-sarcoidosis guideline work. It differs from
    HRS in both diagnostic thresholds and management triggers - for example it
    recommends an electrophysiological study in all patients with LVEF 35-50%
    - and it is markedly more restrictive than HRS when both are applied to the
    same cohort.
  scope: Clinical and histologic diagnosis and management of cardiac sarcoidosis
  evidence:
  - reference: PMID:37123482
    reference_title: Comparing and Contrasting Guidelines for the Management of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Japanese Circulation Society (JCS) recently published new guidelines
      for the diagnosis and treatment of Cardiac Sarcoidosis (CS).
    explanation: Establishes the JCS guideline as a distinct diagnostic and treatment framework.
  - reference: PMID:37123482
    reference_title: Comparing and Contrasting Guidelines for the Management of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2016 JCS document is broadly similar, with the major exception that it
      is recommended that all patients with LVEF 35-50% should have an EP study.
    explanation: >-
      Documents a concrete management divergence between the JCS and HRS
      frameworks, supporting the description's claim that they differ in
      practice and not only in wording.
- name: WASOG Sarcoidosis Organ Assessment Instrument
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The WASOG instrument is not a cardiac-specific guideline but an
    organ-involvement probability tool covering all sarcoidosis organs,
    grading each clinical manifestation as highly probable, probable, or
    possible evidence of sarcoidosis involvement in that organ. It requires
    histologic granulomatous inflammation in some other organ and exclusion of
    alternative causes, so it classifies cardiac involvement probabilistically
    rather than issuing a binary cardiac diagnosis.
  scope: Probability of sarcoidosis involvement of a given organ, including the heart
  evidence:
  - reference: PMID:24751450
    reference_title: "The WASOG Sarcoidosis Organ Assessment Instrument: An update of a previous clinical tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the World Association of Sarcoidosis and Other Granulomatous Diseases
      (WASOG) developed a new sarcoidosis organ assessment instrument
    explanation: Establishes the instrument and its issuing body.
  - reference: PMID:24751450
    reference_title: "The WASOG Sarcoidosis Organ Assessment Instrument: An update of a previous clinical tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical manifestations were assessed as either: a) highly probable:
      likelihood of sarcoidosis causing this manifestation of at least 90%.; b)
      probable: likelihood of sarcoidosis causing this manifestation of between
      50 and 90%; c) possible: likelihood of sarcoidosis causing this
      manifestation of less than 50%.
    explanation: >-
      Gives the probabilistic grading that distinguishes WASOG from the binary
      HRS and JCS cardiac diagnoses.
  - reference: PMID:37123482
    reference_title: Comparing and Contrasting Guidelines for the Management of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are two other guideline documents, the World Association of
      Sarcoidosis and Other Granulomatous Disorders Sarcoidosis Organ (WASOG)
      Assessment Instrument created in 1999 and updated in 2014.
    explanation: Places WASOG alongside HRS and JCS as one of the three standing frameworks.
pathophysiology:
- name: Antigen-Driven CD4+ T-Cell and Macrophage Activation
  conforms_to: "granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation"
  biological_scale: CELLULAR
  description: >-
    As in sarcoidosis at any other site, an unidentified poorly degradable
    antigen encountered by a genetically susceptible host drives antigen
    presentation to CD4+ T cells, Th1-skewed cytokine production (IL-2, TNF,
    IFN-gamma), and sustained macrophage activation. This upstream immune
    program is shared with systemic sarcoidosis and is not cardiac-specific; it
    is curated here because it is the trigger of the cardiac chain that follows.
  cell_types:
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  - preferred_term: antigen processing and presentation
    modifier: INCREASED
    term:
      id: GO:0019882
      label: antigen processing and presentation
  - preferred_term: macrophage activation
    modifier: INCREASED
    term:
      id: GO:0042116
      label: macrophage activation
  - preferred_term: cytokine production
    modifier: INCREASED
    term:
      id: GO:0001816
      label: cytokine production
  downstream:
  - target: Myocardial Non-Caseating Granuloma Formation
    description: >-
      Sustained Th1/macrophage activation in the myocardium organizes into
      epithelioid-cell granulomas, the defining lesion of cardiac sarcoidosis.
    evidence:
    - reference: PMID:36924191
      reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cardiac sarcoidosis (CS) results from epithelioid cell granulomas
        infiltrating the myocardium and predisposing to conduction disturbances,
        ventricular tachyarrhythmias, and heart failure.
      explanation: >-
        Establishes myocardial epithelioid-cell granuloma formation as the
        proximate lesion of cardiac sarcoidosis, the target of this edge.
  evidence:
  - reference: ORPHA:797
    reference_title: Sarcoidosis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare multisystemic, autoinflammatory disorder of unknown etiology
      characterized by the formation of immune, non-caseating granulomas in any
      organ(s), leading to variable clinical symptoms and severity.
    explanation: >-
      Orphanet establishes the systemic autoinflammatory granuloma-forming
      process that this node represents upstream of cardiac localization.
- name: Myocardial Non-Caseating Granuloma Formation
  conforms_to: "granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation"
  biological_scale: TISSUE
  description: >-
    Activated macrophages within the myocardium undergo the defining
    granulomatous transformations - differentiation into tightly packed
    epithelioid cells and fusion into multinucleated giant cells - producing
    compact non-caseating granulomas cuffed by lymphocytes. Distribution is
    characteristically patchy and multifocal, favouring the left ventricular free
    wall, the interventricular septum, and the right ventricle. This patchiness
    is directly responsible for the low sensitivity of endomyocardial biopsy.
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  cell_types:
  - preferred_term: epithelioid macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  biological_processes:
  - preferred_term: granuloma formation
    modifier: INCREASED
    term:
      id: GO:0002432
      label: granuloma formation
  - preferred_term: Macrophage fusion into multinucleated giant cells
    modifier: INCREASED
    term:
      id: GO:0000768
      label: syncytium formation by cell-cell fusion
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Active Granulomatous Myocardial Inflammation
    description: >-
      Established granulomas sustain an actively inflamed, oedematous myocardial
      focus with inflammatory-cell infiltration of surrounding working myocardium
      and conduction tissue.
    evidence:
    - reference: PMID:28501519
      reference_title: The Utility of Cardiac Magnetic Resonance Imaging in the Diagnosis of Cardiac Sarcoidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Late gadolinium enhancement was present in 22%, indicating myocardial
        involvement, and 70% had corresponding hyper-intense T2 signal indicating
        active inflammation.
      explanation: >-
        Imaging demonstrates that myocardial sarcoid involvement co-localizes
        with an active inflammatory (oedematous, T2-bright) signal, the target of
        this edge.
  evidence:
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although granulomas are often composed of tight epithelioid macrophage
      aggregates, early granulomas comprise loosely associated macrophages with
      lymphocyte predominance.
    explanation: >-
      Pathology series documents the epithelioid macrophage aggregate that
      defines the myocardial granuloma, and its lymphocyte-predominant early
      form.
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Irregular left ventricular free wall involvement is most common, followed
      by the interventricular septum and right ventricle.
    explanation: >-
      Establishes the anatomical distribution and the irregular (patchy)
      character of myocardial involvement curated on this node.
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Definite diagnosis of CS requires myocardial biopsy and histopathology,
      but a sufficient diagnostic likelihood can be achieved by combining
      extracardiac histology of sarcoidosis with clinical manifestations and
      findings on cardiac imaging.
    explanation: >-
      Confirms that the granulomatous lesion of this node is the histopathologic
      referent that defines the disease.
- name: Active Granulomatous Myocardial Inflammation
  biological_scale: TISSUE
  description: >-
    An actively inflamed myocardial focus - oedema, glucose-avid inflammatory
    cells, and injury to adjacent cardiomyocytes and specialized conduction
    tissue. This is the potentially reversible stage: conduction disturbance
    arising from inflammation rather than from established scar can recover under
    immunosuppression. FDG avidity of these lesions is the basis of PET imaging
    and of treatment monitoring.
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: cardiac muscle cell apoptotic process
    modifier: INCREASED
    term:
      id: GO:0010659
      label: cardiac muscle cell apoptotic process
  downstream:
  - target: Conduction System Involvement and Atrioventricular Block
    description: >-
      Active inflammation involving the basal septum and the atrioventricular
      conduction axis impairs AV conduction. Because this arm is inflammatory
      rather than fibrotic, it is the arm that can reverse with corticosteroid
      therapy.
    evidence:
    - reference: PMID:33687942
      reference_title: "Complete heart block in cardiac sarcoidosis reversed by corticosteroid therapy: time course of resolution."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Imaging suggested active inflammation in the septum affecting
        atrioventricular (AV) conduction but no irreversible fibrosis.
      explanation: >-
        Directly attributes AV conduction impairment to active septal
        inflammation, distinct from fixed fibrosis, in a case with imaging
        separation of the two.
  - target: Post-Inflammatory Replacement Fibrosis and Myocardial Scar
    description: >-
      Granulomas that persist rather than resolve evolve into replacement
      fibrosis, converting a reversible inflammatory lesion into fixed
      myocardial scar.
    evidence:
    - reference: PMID:31769474
      reference_title: The Many Faces of Cardiac Sarcoidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Chronic disease leads to fibrosis and end-stage heart failure.
      explanation: >-
        Pathology review states the progression from chronic granulomatous
        disease to fibrosis, the target of this edge.
  evidence:
  - reference: PMID:28501519
    reference_title: The Utility of Cardiac Magnetic Resonance Imaging in the Diagnosis of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late gadolinium enhancement was present in 22%, indicating myocardial
      involvement, and 70% had corresponding hyper-intense T2 signal indicating
      active inflammation.
    explanation: >-
      T2 hyper-intensity co-localizing with sarcoid myocardial involvement is the
      imaging correlate of the active inflammatory state this node represents.
- name: Conduction System Involvement and Atrioventricular Block
  biological_scale: TISSUE
  description: >-
    Granulomatous inflammation and scar involving the basal interventricular
    septum and the atrioventricular conduction axis interrupt AV conduction,
    producing Mobitz II second-degree or third-degree block. High-grade AV block
    is the single most common presenting manifestation of cardiac sarcoidosis and
    is frequently the only one at presentation ("lone AVB"). It is the cardiac
    consequence that most sharply distinguishes this entry from sarcoidosis at
    other sites.
  locations:
  - preferred_term: atrioventricular node
    term:
      id: UBERON:0002352
      label: atrioventricular node
  - preferred_term: interventricular septum
    term:
      id: UBERON:0002094
      label: interventricular septum
  biological_processes:
  - preferred_term: cardiac conduction
    modifier: DECREASED
    term:
      id: GO:0061337
      label: cardiac conduction
  downstream:
  - target: Atrioventricular Block
    description: >-
      Conduction-axis involvement manifests clinically as symptomatic high-grade
      atrioventricular block.
    evidence:
    - reference: PMID:30354309
      reference_title: Outcome of Cardiac Sarcoidosis Presenting With High-Grade Atrioventricular Block.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Symptomatic high-grade atrioventricular block (AVB) is the most common
        and often the only presenting manifestation (lone AVB) of cardiac
        sarcoidosis.
      explanation: >-
        Nationwide registry analysis establishes symptomatic high-grade AV block
        as the dominant clinical expression of this node.
  evidence:
  - reference: PMID:31230070
    reference_title: "Sudden death in cardiac sarcoidosis: an analysis of nationwide clinical and cause-of-death registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-grade atrioventricular block was the most common first sign of CS
      (n = 147, 42%) followed by heart failure (n = 58, 17%)
    explanation: >-
      Quantifies high-grade AV block as the most frequent first sign of cardiac
      sarcoidosis in a nationwide series of 351 cases.
  - reference: PMID:27443438
    reference_title: Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 3 principal manifestations of cardiac sarcoidosis (CS) are conduction
      abnormalities, ventricular arrhythmias, and heart failure.
    explanation: >-
      Names conduction abnormality as one of the three principal manifestations
      that this and the two sibling consequence nodes represent.
- name: Post-Inflammatory Replacement Fibrosis and Myocardial Scar
  conforms_to: "granuloma_formation#Tissue Containment versus Destruction and Fibrosis"
  biological_scale: TISSUE
  description: >-
    Persistent granulomas are replaced by collagenous scar. The resulting
    fibrosis is patchy and multifocal - confluent in the right ventricle,
    patchier in the left with a predilection for the basal septum, anterior wall,
    and perivalvular regions - and it is fixed: unlike the inflammatory stage it
    does not regress with immunosuppression. Scar burden on late gadolinium
    enhancement is the durable arrhythmic and functional substrate of the
    disease.
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  cell_types:
  - preferred_term: fibroblast of cardiac tissue
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: collagen fibril organization
    modifier: INCREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Scar-Mediated Re-entrant Ventricular Tachyarrhythmia
    description: >-
      Patchy scar interleaved with surviving myocyte bundles creates zones of
      slow conduction and unidirectional block, the classic substrate for
      macro-re-entrant ventricular tachycardia.
    evidence:
    - reference: PMID:25527825
      reference_title: "Ventricular tachycardia in cardiac sarcoidosis: characterization of ventricular substrate and outcomes of catheter ablation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Multiple inducible VTs were observed with mechanism consistent with
        scar-mediated re-entry in all VTs.
      explanation: >-
        Electroanatomic mapping in cardiac sarcoidosis established scar-mediated
        re-entry as the mechanism of every induced VT, the target of this edge.
  - target: Progressive Ventricular Dysfunction and Heart Failure
    description: >-
      Loss of contractile myocardium to granuloma and scar, together with adverse
      remodeling of the residual myocardium, produces progressive ventricular
      dysfunction.
    evidence:
    - reference: PMID:33070538
      reference_title: "Cardiac sarcoidosis: diagnosis and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Cardiac fibrosis leads to congestive heart failure, arrhythmias and sudden cardiac death.
      explanation: >-
        Directly states the causal step from cardiac fibrosis to congestive heart
        failure that this edge represents.
  evidence:
  - reference: PMID:25527825
    reference_title: "Ventricular tachycardia in cardiac sarcoidosis: characterization of ventricular substrate and outcomes of catheter ablation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Left ventricular scarring was patchy with a predilection for the basal
      septum, anterior wall, and perivalvular regions.
    explanation: >-
      Voltage mapping characterizes the patchy distribution and regional
      predilection of the scar curated on this node.
  - reference: PMID:28501519
    reference_title: The Utility of Cardiac Magnetic Resonance Imaging in the Diagnosis of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late gadolinium enhancement was 18%+/-9.7% of overall left ventricular
      (LV) mass and most commonly located in the basal to mid septum.
    explanation: >-
      Cardiac MRI localizes the late gadolinium enhancement (scar) of this node
      to the basal-to-mid septum, matching the electroanatomic findings.
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Chronic disease leads to fibrosis and end-stage heart failure.
    explanation: Pathology review anchors replacement fibrosis as the chronic-stage lesion.
- name: Scar-Mediated Re-entrant Ventricular Tachyarrhythmia
  biological_scale: ORGANISM
  description: >-
    Fixed myocardial scar sustains multiple macro-re-entrant circuits. Both
    ventricles contribute: right ventricular scar is widespread and confluent
    (with epicardial extent exceeding the endocardial), while left ventricular
    scar is patchy. Because the substrate is structural rather than a primary
    channelopathy, arrhythmia can persist after inflammation has resolved on PET
    - which is why suppressing inflammation does not by itself abolish arrhythmic
    risk.
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  biological_processes:
  - preferred_term: cardiac conduction
    modifier: ABNORMAL
    term:
      id: GO:0061337
      label: cardiac conduction
  - preferred_term: regulation of heart rate
    modifier: ABNORMAL
    term:
      id: GO:0002027
      label: regulation of heart rate
  downstream:
  - target: Ventricular Tachycardia
    description: >-
      Re-entrant circuits within sarcoid scar generate sustained and
      non-sustained ventricular tachycardia.
    evidence:
    - reference: PMID:25527825
      reference_title: "Ventricular tachycardia in cardiac sarcoidosis: characterization of ventricular substrate and outcomes of catheter ablation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with cardiac sarcoidosis and VT exhibit ventricular substrate
        characterized by confluent right ventricular scarring and patchy left
        ventricular scarring capable of sustaining a large number of re-entrant
        circuits.
      explanation: >-
        Characterizes the sarcoid ventricular substrate as able to sustain many
        re-entrant circuits, the immediate cause of the VT phenotype.
  - target: Sudden Cardiac Death
    description: >-
      Degeneration of scar-mediated ventricular tachycardia to fibrillation, and
      high-grade conduction block, underlie sudden death - which is frequently
      the first recognized event and often occurs in patients whose cardiac
      granulomas were never diagnosed in life.
    evidence:
    - reference: PMID:31230070
      reference_title: "Sudden death in cardiac sarcoidosis: an analysis of nationwide clinical and cause-of-death registries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Nearly two-thirds of all fatalities from CS are caused by undiagnosed
        granulomas in the heart.
      explanation: >-
        Nationwide cause-of-death linkage attributes most cardiac sarcoidosis
        fatalities to undiagnosed cardiac granulomas, supporting sudden death as
        the terminal event of this node.
  evidence:
  - reference: PMID:25527825
    reference_title: "Ventricular tachycardia in cardiac sarcoidosis: characterization of ventricular substrate and outcomes of catheter ablation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Voltage maps showed widespread and confluent right ventricular scarring.
    explanation: >-
      Documents the confluent right ventricular scar component of the
      arrhythmogenic substrate this node represents.
  - reference: PMID:28501519
    reference_title: The Utility of Cardiac Magnetic Resonance Imaging in the Diagnosis of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of LGE was highly correlated with clinically significant
      arrhythmias and lower LVEF.
    explanation: >-
      Links imaging-quantified scar burden to clinically significant arrhythmia,
      supporting scar as the arrhythmic substrate.
  notes: >-
    Deliberately NOT declared as conforming to cardiac_ion_channel_repolarization.
    That module models arrhythmia arising from an ion-channel or calcium-handling
    variant in a structurally normal heart; cardiac sarcoidosis arrhythmia is
    structural, arising from macro-re-entry around fixed granulomatous scar
    (PMID:25527825). Forcing conformance would misstate the mechanism.
- name: Progressive Ventricular Dysfunction and Heart Failure
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  biological_scale: ORGANISM
  description: >-
    Cumulative replacement of contractile myocardium by granuloma and scar,
    together with remodeling of the residual myocardium, produces falling
    ejection fraction and clinical heart failure. The extent of left ventricular
    dysfunction is the strongest prognostic determinant in clinically manifest
    disease, and end-stage cases proceed to mechanical support or
    transplantation.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: cardiac muscle contraction
    modifier: DECREASED
    term:
      id: GO:0060048
      label: cardiac muscle contraction
  - preferred_term: heart contraction
    modifier: ABNORMAL
    term:
      id: GO:0060047
      label: heart contraction
  downstream:
  - target: Congestive Heart Failure
    description: >-
      Progressive contractile failure manifests clinically as congestive heart
      failure.
    evidence:
    - reference: PMID:33070538
      reference_title: "Cardiac sarcoidosis: diagnosis and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Cardiac fibrosis leads to congestive heart failure, arrhythmias and sudden cardiac death.
      explanation: States the progression to congestive heart failure that this edge represents.
  evidence:
  - reference: PMID:27443438
    reference_title: Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with clinically manifest CS, the extent of left ventricular
      dysfunction seems to be the most important predictor of prognosis.
    explanation: >-
      Establishes left ventricular dysfunction - the state this node represents -
      as the dominant prognostic variable.
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Chronic disease leads to fibrosis and end-stage heart failure.
    explanation: Pathologic confirmation of the fibrosis-to-end-stage-heart-failure endpoint.
  - reference: PMID:33059834
    reference_title: "Challenges in Cardiac and Pulmonary Sarcoidosis: JACC State-of-the-Art Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CS is problematic to diagnose and may cause significant morbidity and death
      from heart failure or ventricular arrhythmias.
    explanation: >-
      Names heart failure alongside ventricular arrhythmia as the two dominant
      causes of death, the two terminal arms of this pathograph.
phenotypes:
- name: Atrioventricular Block
  category: Cardiac
  frequency: FREQUENT
  description: >-
    Mobitz type II second-degree or third-degree atrioventricular block from
    granulomatous involvement of the basal septum and AV conduction axis. The
    most common presenting manifestation of cardiac sarcoidosis, and often the
    only one at presentation.
  phenotype_term:
    preferred_term: Atrioventricular block
    term:
      id: HP:0001678
      label: Atrioventricular block
  evidence:
  - reference: PMID:31230070
    reference_title: "Sudden death in cardiac sarcoidosis: an analysis of nationwide clinical and cause-of-death registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-grade atrioventricular block was the most common first sign of CS
      (n = 147, 42%) followed by heart failure (n = 58, 17%)
    explanation: >-
      Nationwide series of 351 cases gives 42% as the proportion presenting with
      high-grade AV block, supporting the FREQUENT (30-79%) band directly.
  - reference: PMID:30354309
    reference_title: Outcome of Cardiac Sarcoidosis Presenting With High-Grade Atrioventricular Block.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic high-grade atrioventricular block (AVB) is the most common and
      often the only presenting manifestation (lone AVB) of cardiac sarcoidosis.
    explanation: Independently confirms high-grade AV block as the dominant presentation.
- name: Ventricular Tachycardia
  category: Cardiac
  frequency: OCCASIONAL
  description: >-
    Sustained or non-sustained ventricular tachycardia arising from
    macro-re-entrant circuits within granulomatous myocardial scar. May be the
    presenting event or emerge later, and may persist after myocardial
    inflammation has been suppressed.
  phenotype_term:
    preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: PMID:31230070
    reference_title: "Sudden death in cardiac sarcoidosis: an analysis of nationwide clinical and cause-of-death registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      unexpected fatal (n = 38) or aborted (n = 12) SCD (14%), and sustained
      ventricular tachycardia (n = 48, 14%)
    explanation: >-
      Nationwide series gives 14% presenting with sustained VT, which maps to the
      OCCASIONAL (5-29%) band. Note this counts VT as the *presenting*
      manifestation; lifetime VT burden is higher.
  - reference: PMID:25527825
    reference_title: "Ventricular tachycardia in cardiac sarcoidosis: characterization of ventricular substrate and outcomes of catheter ablation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple inducible VTs were observed with mechanism consistent with
      scar-mediated re-entry in all VTs.
    explanation: Characterizes the mechanism of the VT phenotype as scar-mediated re-entry.
- name: Congestive Heart Failure
  category: Cardiac
  frequency: OCCASIONAL
  description: >-
    Heart failure from cumulative granulomatous and fibrotic replacement of
    contractile myocardium. Presents with dyspnoea and exercise intolerance; in a
    minority progresses to end-stage disease requiring mechanical support or
    transplantation.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:31230070
    reference_title: "Sudden death in cardiac sarcoidosis: an analysis of nationwide clinical and cause-of-death registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-grade atrioventricular block was the most common first sign of CS
      (n = 147, 42%) followed by heart failure (n = 58, 17%)
    explanation: >-
      17% of 351 cases presented with heart failure, supporting the OCCASIONAL
      (5-29%) band. Note this counts heart failure as the *presenting*
      manifestation, so it is a lower bound on lifetime frequency.
  - reference: PMID:33070538
    reference_title: "Cardiac sarcoidosis: diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cardiac fibrosis leads to congestive heart failure, arrhythmias and sudden cardiac death.
    explanation: Links the fibrotic mechanism curated in the pathograph to this phenotype.
- name: Sudden Cardiac Death
  category: Cardiac
  frequency: OCCASIONAL
  description: >-
    Sudden death from ventricular tachyarrhythmia degenerating to fibrillation,
    or from high-grade conduction block. Frequently the first recognized
    manifestation, and most cardiac sarcoidosis deaths occur in patients whose
    cardiac granulomas were never diagnosed during life.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:31230070
    reference_title: "Sudden death in cardiac sarcoidosis: an analysis of nationwide clinical and cause-of-death registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      unexpected fatal (n = 38) or aborted (n = 12) SCD (14%), and sustained
      ventricular tachycardia (n = 48, 14%)
    explanation: >-
      Fatal or aborted sudden cardiac death accounted for 14% of presentations in
      351 nationwide cases, supporting the OCCASIONAL (5-29%) band. As with the
      other bands here this counts the *presenting* event, so it is a lower
      bound on lifetime risk.
  - reference: PMID:31230070
    reference_title: "Sudden death in cardiac sarcoidosis: an analysis of nationwide clinical and cause-of-death registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly two-thirds of all fatalities from CS are caused by undiagnosed
      granulomas in the heart.
    explanation: >-
      Supports the description's claim that sudden death frequently occurs in
      undiagnosed disease.
- name: Reduced Left Ventricular Ejection Fraction
  category: Cardiac
  description: >-
    Depressed left ventricular systolic function from myocardial replacement by
    granuloma and scar. The extent of LV dysfunction is the most important
    prognostic determinant in clinically manifest disease, and is more severe in
    isolated cardiac sarcoidosis than in multi-organ disease.
  phenotype_term:
    preferred_term: Reduced left ventricular ejection fraction
    term:
      id: HP:0012664
      label: Reduced left ventricular ejection fraction
  evidence:
  - reference: PMID:27443438
    reference_title: Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with clinically manifest CS, the extent of left ventricular
      dysfunction seems to be the most important predictor of prognosis.
    explanation: Establishes LV dysfunction as a curated phenotype with prognostic weight.
  - reference: PMID:41193496
    reference_title: "Isolated cardiac sarcoidosis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with multi-organ cardiac sarcoidosis, isolated cardiac
      sarcoidosis is associated with lower left ventricular ejection fraction and
      poorer survival.
    explanation: Supports the subtype-dependent severity of reduced LVEF stated in the description.
- name: Myocardial Fibrosis
  category: Cardiac
  description: >-
    Patchy replacement fibrosis of the myocardium, detected in life as late
    gadolinium enhancement on cardiac MRI, typically in the basal-to-mid septum
    and left ventricular free wall. Scar burden correlates with arrhythmia and
    with reduced ejection fraction.
  phenotype_term:
    preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
  evidence:
  - reference: PMID:28501519
    reference_title: The Utility of Cardiac Magnetic Resonance Imaging in the Diagnosis of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of LGE was highly correlated with clinically significant
      arrhythmias and lower LVEF.
    explanation: >-
      Late gadolinium enhancement is the in-vivo readout of myocardial fibrosis,
      and correlates with the arrhythmic and functional consequences.
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Chronic disease leads to fibrosis and end-stage heart failure.
    explanation: Histopathologic confirmation of myocardial fibrosis in chronic cardiac sarcoidosis.
- name: Syncope
  category: Cardiac
  description: >-
    Loss of consciousness from bradyarrhythmia (high-grade AV block) or from
    ventricular tachyarrhythmia. Recurrent syncope in a patient without an
    established cardiac diagnosis is a recognized trigger for evaluating cardiac
    sarcoidosis.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
  evidence:
  - reference: PMID:33687942
    reference_title: "Complete heart block in cardiac sarcoidosis reversed by corticosteroid therapy: time course of resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 53-year-old man was admitted for recurrent syncope and found to have
      complete heart block (CHB).
    explanation: >-
      Case report documents syncope as the presenting symptom of conduction-block
      cardiac sarcoidosis. Single-case evidence, so no frequency band is asserted.
- name: Bundle Branch Block
  category: Cardiac
  description: >-
    Right bundle branch block and other intraventricular conduction delay from
    granulomatous involvement of the distal conduction system, reported alongside
    atrioventricular block as the most common conduction manifestation. No
    frequency band is asserted: the cited source ranks it as most common without
    giving a proportion of patients.
  phenotype_term:
    preferred_term: Bundle branch block
    term:
      id: HP:0011710
      label: Bundle branch block
  evidence:
  - reference: PMID:33059834
    reference_title: "Challenges in Cardiac and Pulmonary Sarcoidosis: JACC State-of-the-Art Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Right bundle branch block (RBBB) and atrioventricular block (AVB), ranging
      from first to third degree, are the most common manifestation
    explanation: >-
      Names right bundle branch block alongside AV block as the most common
      conduction manifestation of cardiac sarcoidosis.
- name: Atrial Fibrillation
  category: Cardiac
  description: >-
    Atrial fibrillation and other supraventricular arrhythmias occur in cardiac
    sarcoidosis, attributable to atrial granulomatous involvement and to atrial
    stretch from ventricular dysfunction. It is uncommon as a presenting feature
    but accumulates over the disease course, so the two cited sources describe
    different time points and no single frequency band is asserted.
  phenotype_term:
    preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  evidence:
  - reference: PMID:33059834
    reference_title: "Challenges in Cardiac and Pulmonary Sarcoidosis: JACC State-of-the-Art Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      atrial fibrillation (AF) can occur as well (up to 32% of subjects)
    explanation: >-
      Establishes atrial fibrillation as a recognized manifestation and gives an
      upper-bound cumulative estimate.
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atrial fibrillation is rare at presentation but has a considerable later
      incidence.
    explanation: >-
      Supplies the temporal qualification stated in the description, and is why
      no frequency band is asserted for this phenotype.
histopathology:
- name: Non-caseating granulomatous myocarditis
  description: >-
    Compact non-caseating granulomas of epithelioid macrophages and
    multinucleated giant cells with a lymphocytic cuff, distributed irregularly
    through the left ventricular free wall, interventricular septum, and right
    ventricle, with replacement fibrosis in chronic disease. The patchiness is
    the reason endomyocardial biopsy is insensitive despite being highly
    specific.
  diagnostic: true
  context: Endomyocardial biopsy or explanted/autopsy heart
  evidence:
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although granulomas are often composed of tight epithelioid macrophage
      aggregates, early granulomas comprise loosely associated macrophages with
      lymphocyte predominance.
    explanation: Describes the granuloma cellular composition and its early/late variation.
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sampling errors and variable histology cause low endomyocardial biopsy sensitivity.
    explanation: >-
      Directly attributes the low biopsy sensitivity to sampling error against
      patchy lesions, the claim made in this entry's description.
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Irregular left ventricular free wall involvement is most common, followed
      by the interventricular septum and right ventricle.
    explanation: Gives the anatomical distribution of the histopathologic lesion.
diagnosis:
- name: Cardiac magnetic resonance imaging
  description: >-
    CMR with late gadolinium enhancement detects myocardial scar and, with T2
    imaging, active oedema. It uncovers cardiac involvement far more often than
    clinical criteria do, and LGE burden carries arrhythmic and functional
    prognostic weight.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:28501519
    reference_title: The Utility of Cardiac Magnetic Resonance Imaging in the Diagnosis of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late gadolinium enhancement was present in 22%, indicating myocardial
      involvement, and 70% had corresponding hyper-intense T2 signal indicating
      active inflammation.
    explanation: >-
      Demonstrates CMR detection of both scar (LGE) and active inflammation (T2)
      in a biopsy-proven sarcoidosis cohort.
  - reference: PMID:28501519
    reference_title: The Utility of Cardiac Magnetic Resonance Imaging in the Diagnosis of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using CMR, we identified a higher prevalence of cardiac sarcoidosis than
      previously reported clinical studies, a prevalence which is more consistent
      with autopsy data.
    explanation: Supports CMR as the modality that closes the clinical-versus-autopsy detection gap.
- name: FDG-PET assessment of myocardial inflammation
  description: >-
    18F-FDG PET detects glucose-avid inflammatory cells in active granulomatous
    lesions, and is used both diagnostically and to monitor response to
    immunosuppression. It is a surrogate imaging biomarker, adopted because
    endomyocardial biopsy yield is low.
  diagnosis_term:
    preferred_term: FDG-positron emission tomography
    term:
      id: NCIT:C103400
      label: FDG-Positron Emission Tomography
  evidence:
  - reference: PMID:33059834
    reference_title: "Challenges in Cardiac and Pulmonary Sarcoidosis: JACC State-of-the-Art Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CS usually requires surrogate cardiac imaging biomarkers,
      as endomyocardial biopsy has relatively low yield, even with directed
      electrophysiological mapping.
    explanation: >-
      Establishes the reliance on surrogate cardiac imaging biomarkers in place
      of biopsy, the rationale for this diagnostic modality.
  - reference: PMID:31538835
    reference_title: Long-Term Corticosteroid-Sparing Immunosuppression for Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methotrexate±low-dose prednisone resulted in initial reduction (88%) or
      elimination (60%) of 18-fluorodeoxyglucose uptake
    explanation: >-
      Demonstrates FDG uptake being used as the treatment-response readout, the
      monitoring role described here.
- name: Endomyocardial biopsy
  description: >-
    Histologic demonstration of non-caseating myocardial granulomas is the only
    route to a definite diagnosis, but sensitivity is low because lesions are
    patchy; electroanatomic- or image-guided sampling improves but does not solve
    the yield problem.
  diagnosis_term:
    preferred_term: endomyocardial biopsy
    term:
      id: NCIT:C51674
      label: Endomyocardial Biopsy
  evidence:
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Definite diagnosis of CS requires myocardial biopsy and histopathology
    explanation: States the role of myocardial biopsy in establishing a definite diagnosis.
  - reference: PMID:31769474
    reference_title: The Many Faces of Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sampling errors and variable histology cause low endomyocardial biopsy sensitivity.
    explanation: Quantifies the limitation of the modality described here.
- name: Electrocardiography
  description: >-
    ECG identifies the conduction abnormalities that most often bring cardiac
    sarcoidosis to attention - high-grade AV block, bundle branch block, and
    ventricular arrhythmia - and is the entry point for screening patients with
    known systemic sarcoidosis.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:33687942
    reference_title: "Complete heart block in cardiac sarcoidosis reversed by corticosteroid therapy: time course of resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three weeks later, ECG with pacing inhibited showed second-degree AV block
      Mobitz type II and 4 weeks later, AV conduction recovery.
    explanation: >-
      Illustrates ECG being used to grade and follow the conduction abnormality
      that defines the cardiac presentation.
- name: Echocardiography
  description: >-
    Transthoracic echocardiography is the first-line imaging rung of the HRS
    screening algorithm, ahead of CMR and FDG-PET. Typical findings are regional
    wall thinning and contraction abnormalities in basal, septal, and lateral
    segments. Sensitivity is low - a normal echocardiogram does not exclude
    cardiac sarcoidosis - so it triages patients toward advanced imaging rather
    than settling the diagnosis.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:37682338
    reference_title: "[Imaging diagnostics of cardiac sarcoidosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typical echocardiographic findings include regional thinning and
      contraction abnormalities particularly in basal, septal and lateral
      locations.
    explanation: >-
      Gives the characteristic echocardiographic findings, whose regional
      distribution matches the granuloma and scar distribution curated in the
      pathograph.
  - reference: PMID:37682338
    reference_title: "[Imaging diagnostics of cardiac sarcoidosis]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the sensitivity of echocardiography is low and cardiac sarcoidosis can be
      present even when an echocardiogram is unrevealing
    explanation: >-
      Records the limitation that makes echocardiography a triage rather than a
      confirmatory modality.
  - reference: PMID:40445485
    reference_title: Screening for cardiac involvement in patients with sarcoidosis using AIIMS algorithm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 100 patients screened, 23% had cardiac symptoms, 23% had ECG
      changes, 16% had abnormalities on conventional echocardiography, 32% of
      patients had abnormal GLS, 16% and 19% of patients were positive for
      Troponin I and NT-Pro BNP respectively.
    explanation: >-
      Quantifies the yield of conventional echocardiography within a
      prospective sarcoidosis screening cohort, alongside the other screening
      rungs curated in this entry.
treatments:
- name: Corticosteroid Therapy
  description: >-
    Corticosteroids are first-line therapy for clinically manifest cardiac
    sarcoidosis, aimed at suppressing active granulomatous myocardial
    inflammation before it converts to fixed scar. The best-quality evidence is
    for recovery of atrioventricular conduction and prevention of deterioration
    in left ventricular function; evidence is explicitly inadequate to claim a
    ventricular-arrhythmia or mortality benefit, and no randomized trial exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  target_mechanisms:
  - target: Active Granulomatous Myocardial Inflammation
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids suppress the active granulomatous inflammatory lesion. The
      therapeutic window is the inflammatory stage: AV conduction impaired by
      active septal inflammation can recover, whereas established fibrosis
      cannot.
    evidence:
    - reference: PMID:34472360
      reference_title: "Corticosteroid and Immunosuppressant Therapy for Cardiac Sarcoidosis: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There were 178 patients treated for atrioventricular conduction disease,
        with 76/178 (42.7%) improving.
      explanation: >-
        Systematic review quantifies AV conduction recovery under
        corticosteroid/immunosuppressant therapy, the effect of inhibiting this
        node.
    - reference: PMID:33687942
      reference_title: "Complete heart block in cardiac sarcoidosis reversed by corticosteroid therapy: time course of resolution."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This highlights the importance of immediate therapy in reversing AV
        conduction abnormalities in CS.
      explanation: >-
        Case-level demonstration that the reversible target is the inflammatory,
        not the fibrotic, lesion.
  evidence:
  - reference: PMID:34472360
    reference_title: "Corticosteroid and Immunosuppressant Therapy for Cardiac Sarcoidosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, 21 patients were not treated with corticosteroids and/or
      immunosuppressant therapy, and none of them improved.
    explanation: >-
      Provides the untreated comparator (0/21 improved) against which the 42.7%
      treated improvement rate is read.
  - reference: PMID:34472360
    reference_title: "Corticosteroid and Immunosuppressant Therapy for Cardiac Sarcoidosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therapy was associated with the prevention of deterioration in left ventricular function.
    explanation: Supports the second of the two outcomes for which evidence quality is adequate.
  - reference: PMID:34472360
    reference_title: "Corticosteroid and Immunosuppressant Therapy for Cardiac Sarcoidosis: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data quality is too limited to draw conclusions for ventricular
      arrhythmias and mortality.
    explanation: >-
      Records the explicit limit of the evidence base, so this treatment entry
      does not overstate benefit beyond conduction and LV function.
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, the treatment involves corticosteroid-based, tiered
      immunosuppression to control myocardial inflammation with medical and
      device-based therapy for symptomatic atrioventricular block, ventricular
      tachyarrhythmias, and heart failure.
    explanation: Confirms corticosteroid-based immunosuppression as the therapeutic backbone.
- name: Methotrexate Corticosteroid-Sparing Maintenance
  description: >-
    Methotrexate, with or without low-dose prednisone, is used as maintenance
    therapy after an initial corticosteroid response, reducing cumulative steroid
    exposure. Efficacy is judged by suppression of myocardial FDG uptake; relapse
    after cessation supports ongoing surveillance.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: Active Granulomatous Myocardial Inflammation
    treatment_effect: INHIBITS
    description: >-
      Steroid-sparing immunosuppression suppresses the same active granulomatous
      lesion as corticosteroids, measured as reduction or elimination of
      myocardial FDG uptake.
    evidence:
    - reference: PMID:31538835
      reference_title: Long-Term Corticosteroid-Sparing Immunosuppression for Cardiac Sarcoidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Methotrexate±low-dose prednisone resulted in initial reduction (88%) or
        elimination (60%) of 18-fluorodeoxyglucose uptake
      explanation: >-
        Quantifies suppression of the active inflammatory node under
        methotrexate-based maintenance specifically. The adalimumab arm of the
        same study is curated separately under TNF Inhibitor Therapy.
  evidence:
  - reference: PMID:31538835
    reference_title: Long-Term Corticosteroid-Sparing Immunosuppression for Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroid-sparing regimens containing methotrexate with or without
      adalimumab is an effective maintenance therapy in patients after an initial
      response is confirmed.
    explanation: States the maintenance role and the precondition (confirmed initial response).
  - reference: PMID:31538835
    reference_title: Long-Term Corticosteroid-Sparing Immunosuppression for Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease recurrence in patients on and off immunosuppression support need
      for ongoing radiologic surveillance regardless of immunosuppression
      regimen.
    explanation: Supports the surveillance requirement stated in the description.
- name: TNF Inhibitor Therapy
  description: >-
    TNF-neutralizing biologics - infliximab (chimeric) and adalimumab (fully
    human) - are used in cardiac sarcoidosis refractory to corticosteroids and
    conventional steroid-sparing agents. This instantiates the granuloma-formation
    drug-target design pattern: TNF is the non-redundant amplifier that drives
    macrophage accumulation and activation, so its blockade acts on the
    Th1/TNF node rather than on the mature granuloma. Safety caveat specific to
    this disease: anti-TNF therapy carries a risk of increased mortality in
    patients with severe cardiomyopathy, so it must be used with caution in
    exactly the cardiac sarcoidosis patients whose ventricular function is most
    impaired.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
  target_mechanisms:
  - target: Antigen-Driven CD4+ T-Cell and Macrophage Activation
    treatment_effect: INHIBITS
    description: >-
      TNF neutralization removes the amplifier that drives macrophage
      accumulation and activation, the mechanism by which anti-TNF agents
      prevent granuloma formation. This is the same node that conforms to
      granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and
      Activation, which the module's own TNF-inhibitor pattern targets.
    evidence:
    - reference: PMID:36924191
      reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Biologic anti-tumor necrosis factor (TNF) agents can prevent granuloma
        formation, and observational data support their efficacy in CS when
        other therapies have failed.
      explanation: >-
        States both the mechanism (prevention of granuloma formation) and the
        cardiac-sarcoidosis-specific efficacy setting for this edge.
    - reference: PMID:33059834
      reference_title: "Challenges in Cardiac and Pulmonary Sarcoidosis: JACC State-of-the-Art Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IFN-γ and TNF-α promote the accumulation and activation of macrophages
      explanation: >-
        Identifies TNF as a driver of the macrophage accumulation and activation
        that this node represents, so neutralizing it acts here.
  - target: Active Granulomatous Myocardial Inflammation
    treatment_effect: INHIBITS
    description: >-
      Adalimumab-containing regimens suppress the active myocardial lesion,
      measured as improvement or resolution of myocardial FDG uptake.
    evidence:
    - reference: PMID:31538835
      reference_title: Long-Term Corticosteroid-Sparing Immunosuppression for Cardiac Sarcoidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        patients receiving adalimumab-containing regimens experienced improved
        (84%) or resolved (63%) 18-fluorodeoxyglucose uptake
      explanation: >-
        Quantifies suppression of the active inflammatory node under
        adalimumab-containing therapy.
  evidence:
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infliximab is a chimeric TNF antibody which in doses <10 mg/kg is well
      tolerated even in patients with impaired LV function.
    explanation: Establishes infliximab as one of the two agents in this treatment class.
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adalimumab, a human monoclonal TNF antibody, is a subcutaneously
      administered alternative.
    explanation: Establishes adalimumab as the second agent in this treatment class.
  - reference: PMID:33059834
    reference_title: "Challenges in Cardiac and Pulmonary Sarcoidosis: JACC State-of-the-Art Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, because of the risk of increased mortality associated with use of
      anti-TNF therapy in patients with severe CMP (130), one must use with
      caution.
    explanation: >-
      Source for the disease-specific safety caveat stated in the description.
      Note the two cited reviews are not fully concordant on tolerability in
      impaired ventricular function, which is why the caveat is curated rather
      than only the favourable statement.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    ICD implantation for prevention of sudden cardiac death. Because arrhythmic
    risk arises from fixed scar and persists even when conduction recovers, an
    ICD rather than a pacemaker is recommended whenever permanent pacing is
    needed in cardiac sarcoidosis. Device therapy addresses the arrhythmic
    consequence; it does not modify the granulomatous disease.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Scar-Mediated Re-entrant Ventricular Tachyarrhythmia
    treatment_effect: INHIBITS
    description: >-
      The device terminates scar-mediated ventricular tachyarrhythmia when it
      occurs, preventing progression to sudden death, without altering the
      underlying scar substrate.
    evidence:
    - reference: PMID:32062788
      reference_title: "Outcome of implantable cardioverter defibrillator in cardiac sarcoidosis: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Appropriate and inappropriate ICD treatments (AT and IAT) were reported
        in 39% and 15% of patients respectively
      explanation: >-
        Meta-analysis documents that 39% of implanted patients received
        appropriate device therapy for the arrhythmia this node represents.
  evidence:
  - reference: PMID:30354309
    reference_title: Outcome of Cardiac Sarcoidosis Presenting With High-Grade Atrioventricular Block.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consensus recommendation to implant an intracardiac cardioverter
      defibrillator whenever permanent pacing is needed seems well-founded.
    explanation: >-
      Nationwide outcome data support ICD over pacemaker whenever pacing is
      indicated, the recommendation stated in this treatment entry.
  - reference: PMID:32062788
    reference_title: "Outcome of implantable cardioverter defibrillator in cardiac sarcoidosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: High degree AV block appears to be predictive of appropriate ICD therapy.
    explanation: >-
      Supports the link between the conduction-block presentation and subsequent
      arrhythmic events that motivates ICD rather than pacemaker selection.
  - reference: PMID:27443438
    reference_title: Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Device therapy, primarily with implantable cardioverter-defibrillators, is
      often recommended for patients with clinically manifest disease.
    explanation: Independent statement of the device recommendation in manifest disease.
- name: Permanent Pacing
  description: >-
    Pacemaker implantation for symptomatic high-grade atrioventricular block.
    In cardiac sarcoidosis, current recommendation is that a defibrillator be
    implanted instead of a pacemaker whenever permanent pacing is indicated,
    because of the persisting risk of ventricular tachyarrhythmia.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: pacemaker placement
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_mechanisms:
  - target: Conduction System Involvement and Atrioventricular Block
    treatment_effect: BYPASSES
    description: >-
      Pacing bypasses the interrupted atrioventricular conduction axis, treating
      the bradyarrhythmic consequence without addressing the granulomatous cause.
    evidence:
    - reference: PMID:30354309
      reference_title: Outcome of Cardiac Sarcoidosis Presenting With High-Grade Atrioventricular Block.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Implantation of an intracardiac cardioverter defibrillator instead of a
        pacemaker is recommended, but the true risk of fatal arrhythmia, one
        incident to lone AVB in particular, remains poorly known.
      explanation: >-
        Establishes permanent pacing as the indicated therapy for this node while
        recording the device-selection caveat stated in the description.
- name: Catheter Ablation for Ventricular Tachycardia
  description: >-
    Catheter ablation of scar-mediated ventricular tachycardia circuits, used for
    recurrent VT or VT storm alongside antiarrhythmic drugs. It is palliative:
    acute success is high but recurrence is common, because septal intramural
    circuits and extensive right ventricular scar leave residual inducible
    circuits.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cardiac ablation
    term:
      id: NCIT:C100068
      label: Cardiac Ablation
  target_mechanisms:
  - target: Scar-Mediated Re-entrant Ventricular Tachyarrhythmia
    treatment_effect: INHIBITS
    description: >-
      Ablation interrupts individual re-entrant circuits within sarcoid scar,
      controlling VT burden without eliminating the substrate.
    evidence:
    - reference: PMID:25527825
      reference_title: "Ventricular tachycardia in cardiac sarcoidosis: characterization of ventricular substrate and outcomes of catheter ablation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Catheter ablation is effective in terminating VT storm and eliminating
        ≥1 inducible VT in the majority of patients, but recurrences are common.
      explanation: >-
        Reports ablation efficacy against the scar-mediated arrhythmia of this
        node, in the same cohort in which the mechanism was mapped, together
        with the recurrence caveat that makes the effect palliative.
  evidence:
  - reference: PMID:25527825
    reference_title: "Ventricular tachycardia in cardiac sarcoidosis: characterization of ventricular substrate and outcomes of catheter ablation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Failure to abolish all inducible VTs was because of septal intramural
      circuits or extensive right ventricular scarring.
    explanation: >-
      Names the anatomical reasons ablation is palliative rather than curative,
      as stated in the description.
  - reference: PMID:25527825
    reference_title: "Ventricular tachycardia in cardiac sarcoidosis: characterization of ventricular substrate and outcomes of catheter ablation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple procedure VT-free survival was 37% at 1 year, but VT control was
      achievable in the majority of patients with fewer antiarrhythmic drugs
      compared with preablation
    explanation: Quantifies the recurrence rate that makes this a palliative rather than curative therapy.
- name: Heart Transplantation
  description: >-
    Cardiac transplantation for end-stage cardiac sarcoidosis refractory to
    immunosuppression and device therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  evidence:
  - reference: PMID:33059834
    reference_title: "Challenges in Cardiac and Pulmonary Sarcoidosis: JACC State-of-the-Art Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of CS is often multifactorial, involving a combination of
      antigranulomatous therapy and pharmacotherapy for cardiac arrhythmias
      and/or heart failure in addition to device placement and cardiac
      transplantation.
    explanation: >-
      Places cardiac transplantation within the treatment repertoire for cardiac
      sarcoidosis.
clinical_trials:
- name: NCT06660732
  phase: PHASE_II
  status: RECRUITING
  description: >-
    REPAIR-CS - a randomized Phase II trial (n=60) of the IL-1 trap rilonacept
    added to standard therapy versus standard therapy alone, with the primary
    endpoint being improvement in myocardial inflammation at 24 weeks. It targets
    the active granulomatous inflammation node of this entry's pathograph, and
    is the design that would begin to answer the randomized-evidence gap recorded
    in the immunosuppression KNOWLEDGE_GAP - though its endpoint is imaging
    inflammation, not arrhythmia or mortality.
  target_phenotypes:
  - preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
  evidence:
  - reference: clinicaltrials:NCT06660732
    reference_title: "A RandomizEd PhAse II TrIal of Rilonacept in Subjects With Cardiac Sarcoidosis (REPAIR-CS)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary objective of this study is to evaluate the effect of
      rilonacept, added to standard therapy and compared with standard therapy
      alone, on improvement in myocardial inflammation in subjects with cardiac
      sarcoidosis after 24 weeks of therapy.
    explanation: >-
      States the randomized comparison and the myocardial-inflammation endpoint
      that make this trial relevant to the active-inflammation node.
- name: NCT04017936
  phase: PHASE_II
  status: COMPLETED
  description: >-

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with active cardiac sarcoidosis, does treatment with
      baricitinib improve cardiac sarcoidosis disease activity as assessed by
      changes on cardiac FDG-PET/CT?
    explanation: >-
      States the intervention and the FDG-PET activity endpoint, the same
      readout used for the curated immunosuppression treatments.
- name: NCT07159074
  phase: PHASE_II
  status: RECRUITING
  description: >-
    A Phase II diagnostic study (n=15) testing whether Tc 99m tilmanocept
    SPECT/CT - a macrophage-mannose-receptor-directed tracer - can identify
    cardiac sarcoidosis. Unlike FDG, which reports generic glucose-avid
    inflammation and needs demanding dietary preparation, this tracer targets
    the macrophage lineage that forms the granuloma itself.
  evidence:
  - reference: clinicaltrials:NCT07159074
    reference_title: "Repurposing Tc 99m Tilmanocept Imaging for Cardiac Sarcoidosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to see if Tc 99m Tilmanocept SPECT/CT imaging
      can be used to identify cardiac sarcoidosis.
    explanation: States the diagnostic objective of the trial.
biochemical:
- name: Elevated high-sensitivity cardiac troponin
  presence: Elevated
  context: >-
    High-sensitivity cardiac troponin reports ongoing cardiomyocyte injury from
    the active granulomatous lesion, and is repeatable enough to follow disease
    activity serially under immunosuppression. Cumulative troponin release after
    prednisolone initiation - rather than any single pre- or post-treatment
    value - predicts ventricular arrhythmia, worsening heart failure, and sudden
    cardiac death, which fits the entry's model in which the reversible
    inflammatory arm and the fixed scar arm diverge over time.
  readouts:
  - target: Active Granulomatous Myocardial Inflammation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Rising cumulative troponin reports continuing cardiomyocyte injury from the
      active granulomatous lesion this node represents.
    evidence:
    - reference: PMID:37591415
      reference_title: Association of longitudinal cardiac troponin trajectory with adverse events in patients with cardiac sarcoidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A higher area under the cTnT trajectory was significantly associated with
        an increased incidence of the primary outcome (P = 0.027)
      explanation: >-
        The specific measurement behind this readout: cumulative troponin release
        predicted the composite of sustained VT/VF, worsening heart failure, and
        sudden cardiac death.
  evidence:
  - reference: PMID:37591415
    reference_title: Association of longitudinal cardiac troponin trajectory with adverse events in patients with cardiac sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although high-sensitivity cardiac troponins may be sensitive and easily
      repeatable markers of disease activity in patients with cardiac
      sarcoidosis (CS), the association between longitudinal cardiac troponin
      trajectory and adverse events remains unclear.
    explanation: >-
      Establishes hs-cardiac troponin as a repeatable marker of cardiac
      sarcoidosis disease activity, the basis for attaching it to the
      active-inflammation node.
  - reference: PMID:37591415
    reference_title: Association of longitudinal cardiac troponin trajectory with adverse events in patients with cardiac sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Longitudinal cTnT trajectory following PSL initiation was associated with
      adverse cardiac events in patients with CS
    explanation: >-
      Supports the prognostic endpoint context: it is the cumulative trajectory,
      not a single value, that carries the signal.
  - reference: PMID:40445485
    reference_title: Screening for cardiac involvement in patients with sarcoidosis using AIIMS algorithm.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      16% and 19% of patients were positive for Troponin I and NT-Pro BNP
      respectively
    explanation: >-
      Gives the proportion of a screened sarcoidosis cohort positive for
      troponin. Partial because this quantifies screening yield in sarcoidosis
      generally rather than troponin behaviour within established cardiac
      sarcoidosis.
- name: Elevated NT-proBNP
  presence: Elevated
  context: >-
    N-terminal pro-B-type natriuretic peptide reports ventricular wall stress
    and is elevated in cardiac sarcoidosis independently of ejection fraction and
    pulmonary artery pressure. It discriminates cardiac involvement well
    (AUC 0.913) but does not identify pulmonary hypertension in the same
    patients, so it is a cardiac-involvement marker rather than a general
    sarcoidosis severity marker.
  readouts:
  - target: Progressive Ventricular Dysfunction and Heart Failure
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated NT-proBNP reports the ventricular wall stress and contractile
      failure that this node represents.
    evidence:
    - reference: PMID:21086902
      reference_title: Significance of plasma NT-proBNP levels as a biomarker in the assessment of cardiac involvement and pulmonary hypertension in patients with sarcoidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Plasma NT-proBNP showed good accuracy in identifying patients with
        cardiac sarcoidosis (area under the ROC curve; AURC = 0.913).
      explanation: >-
        The specific measurement behind this readout, with its discrimination
        quantified as an area under the ROC curve.
  evidence:
  - reference: PMID:21086902
    reference_title: Significance of plasma NT-proBNP levels as a biomarker in the assessment of cardiac involvement and pulmonary hypertension in patients with sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma NT-proBNP levels were significantly higher in patients with cardiac
      sarcoidosis (p < 0.0001).
    explanation: Directly establishes NT-proBNP elevation in cardiac sarcoidosis.
  - reference: PMID:21086902
    reference_title: Significance of plasma NT-proBNP levels as a biomarker in the assessment of cardiac involvement and pulmonary hypertension in patients with sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stepwise regression analysis showed that presence of cardiac sarcoidosis,
      decreased ejection fraction and increased sPAP were all independently
      associated with higher plasma NT-proBNP levels.
    explanation: >-
      Supports the independence claim in the context field, and ties the marker
      to reduced ejection fraction - the phenotype of the target node.
  - reference: PMID:21086902
    reference_title: Significance of plasma NT-proBNP levels as a biomarker in the assessment of cardiac involvement and pulmonary hypertension in patients with sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with sarcoidosis, plasma NT-proBNP levels are a useful
      biomarker to identify cardiac involvement, but not to identify PH.
    explanation: >-
      Records the specific scope of the marker, preventing it being read as a
      general sarcoidosis-severity readout.
  notes: >-
    Systemic sarcoidosis activity markers - serum ACE, soluble IL-2 receptor,
    CRP and ESR - are deliberately NOT duplicated here; they are curated in
    kb/disorders/Sarcoidosis.yaml because they report the systemic granulomatous
    process rather than the cardiac lesion. Only the two cardiac-specific
    biomarkers that attach to nodes in this entry's pathograph are curated here.
    No serum biomarker independently establishes a diagnosis of cardiac
    sarcoidosis.
progression:
- phase: Survival in clinically manifest disease
  notes: >-
    Contemporary survival in manifest cardiac sarcoidosis is reported as roughly
    90-96% at 5 years and 80-90% at 10 years in specialist series; a nationwide
    Finnish series including autopsy-detected cases reported 85% at 5 years and
    76% at 10 years from symptom onset. The difference between these figures
    reflects ascertainment - the nationwide series includes cases first
    identified at death.
  evidence:
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent outcome data indicate 90% to 96% 5-year survival in manifest CS
      with the 10-year figures ranging from 80% to 90%.
    explanation: Gives the specialist-series survival estimates.
  - reference: PMID:31230070
    reference_title: "Sudden death in cardiac sarcoidosis: an analysis of nationwide clinical and cause-of-death registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Kaplan-Meier estimate (95% CI) of survival from symptom onset was 85%
      (80-90%) at 5 years and 76% (68-84%) at 10 years.
    explanation: Gives the nationwide-registry survival estimates for contrast.
differential_diagnoses:
- name: Arrhythmogenic right ventricular cardiomyopathy
  disease_term:
    preferred_term: arrhythmogenic right ventricular cardiomyopathy
    term:
      id: MONDO:0016587
      label: arrhythmogenic right ventricular cardiomyopathy
  description: >-
    Isolated cardiac sarcoidosis and ARVC overlap closely: both produce right
    ventricular scar, ventricular arrhythmia, and conduction abnormality in a
    structurally abnormal heart. The dismech ARVC entry reciprocally lists
    cardiac sarcoidosis as one of its own key differentials.
  evidence:
  - reference: PMID:33070538
    reference_title: "Cardiac sarcoidosis: diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      isolated cardiac sarcoidosis is difficult to differentiate from other
      causes of arrhythmogenic cardiomyopathy
    explanation: >-
      Directly states the diagnostic difficulty separating isolated cardiac
      sarcoidosis from arrhythmogenic cardiomyopathy.
discussions:
- discussion_id: gap_cardiac_sarcoidosis_immunosuppression_arrhythmia_mortality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does immunosuppression in cardiac sarcoidosis reduce ventricular arrhythmia
    burden or mortality, or only recover atrioventricular conduction and
    stabilize left ventricular function?
  attaches_to:
  - pathophysiology#Active Granulomatous Myocardial Inflammation
  - pathophysiology#Scar-Mediated Re-entrant Ventricular Tachyarrhythmia
  rationale: >-
    The curated treatment chain models corticosteroids as inhibiting the active
    inflammatory node, which is well supported for AV conduction recovery and for
    prevention of LV functional deterioration. It is deliberately NOT extended to
    the scar-mediated arrhythmia node, because the systematic review of 34
    publications and 1297 patients found no randomized trials and explicitly
    declined to draw conclusions for ventricular arrhythmia and mortality. This
    matters mechanistically: if arrhythmic risk is carried by fixed scar rather
    than by active inflammation, suppressing inflammation should not be expected
    to abolish it, and the persistence of VT after PET normalization is
    consistent with that. Curators must not add a treatment edge from
    immunosuppression to the arrhythmia node on current evidence.
  proposed_experiments:
  - experiment_id: exp_cardiac_sarcoidosis_rct_arrhythmic_endpoints
    name: Randomized trial of immunosuppression with arrhythmic endpoints
    description: >-
      A randomized controlled trial of corticosteroid-based versus
      steroid-sparing immunosuppression in clinically manifest cardiac
      sarcoidosis, powered for device-detected ventricular arrhythmia burden and
      all-cause mortality rather than for imaging surrogates.
  evidence:
  - reference: PMID:34472360
    reference_title: "Corticosteroid and Immunosuppressant Therapy for Cardiac Sarcoidosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data quality is too limited to draw conclusions for ventricular
      arrhythmias and mortality.
    explanation: >-
      The systematic review's own statement of the evidence gap this discussion
      records.
- discussion_id: gap_cardiac_sarcoidosis_sex_race_phenotype_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do sex and race modify the presenting phenotype and arrhythmic risk of
    cardiac sarcoidosis, and does this reflect biology or differential
    ascertainment and treatment?
  attaches_to:
  - pathophysiology#Myocardial Non-Caseating Granuloma Formation
  - pathophysiology#Progressive Ventricular Dysfunction and Heart Failure
  rationale: >-
    A tertiary-center cohort of 252 patients found that women and Black patients
    more often presented with symptomatic heart failure, while male sex carried
    more than twice the adjusted hazard of ventricular arrhythmia - i.e. the same
    granulomatous lesion appears to distribute its downstream consequences
    differently by sex and race. Treatment also differed by group. Nothing in the
    curated mechanism explains this, and the study cannot separate a biological
    modifier of the granulomatous or fibrotic response from differences in
    referral, diagnosis, and management.
  evidence:
  - reference: PMID:37062472
    reference_title: Sex and Race Differences in Cardiac Sarcoidosis Presentation, Treatment and Outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At presentation with CS, females vs males (P = 0.001) and Black vs White
      individuals (P = 0.001) more commonly had symptomatic heart failure (HF),
      with HF most common in Black females
    explanation: Documents the sex and race differences in presenting phenotype.
  - reference: PMID:37062472
    reference_title: Sex and Race Differences in Cardiac Sarcoidosis Presentation, Treatment and Outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Male sex had an adjusted hazard ratio of 2.34 (95% CI 1.13, 4.80;
      P = 0.021) for ventricular arrhythmia.
    explanation: Quantifies the sex difference in arrhythmic risk that this gap concerns.
- discussion_id: gap_cardiac_sarcoidosis_criteria_framework_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which of the three competing cardiac sarcoidosis criteria frameworks (2014
    HRS, 2016 JCS, WASOG) identifies the patients who actually have myocardial
    granulomas, given that they classify substantially different fractions of the
    same cohort?
  attaches_to:
  - pathophysiology#Myocardial Non-Caseating Granuloma Formation
  - pathophysiology#Active Granulomatous Myocardial Inflammation
  rationale: >-
    This entry curates three diagnostic frameworks because no one of them is
    authoritative, and they are not interchangeable. Applied to the same
    324-patient cohort of histologically proven sarcoidosis with suspected
    cardiac involvement, the HRS consensus criteria classified 22.7% of women and
    36.0% of men as having cardiac sarcoidosis, while the 2016 JCS criteria
    classified 8.0% and 19.3% - roughly a two- to threefold difference in the
    same patients. Because definite diagnosis requires myocardial biopsy and
    biopsy sensitivity is low, there is no accessible gold standard against which
    to adjudicate, so the disagreement cannot currently be resolved by
    comparison to truth. This is not a curation gap in this entry; it is the
    defining clinical problem of the disease, and it propagates into every
    cohort-derived number curated here - prevalence, phenotype frequencies, and
    treatment-response rates all depend on which framework selected the cohort.
  proposed_experiments:
  - experiment_id: exp_cardiac_sarcoidosis_criteria_head_to_head_outcome_anchored
    name: Outcome-anchored head-to-head comparison of HRS, JCS and WASOG criteria
    description: >-
      Apply all three frameworks prospectively to a single multicentre cohort of
      patients with suspected cardiac sarcoidosis and adjudicate them not against
      each other but against hard downstream outcomes (device-detected
      ventricular arrhythmia, heart failure hospitalization, sudden cardiac
      death) and, where tissue becomes available through transplantation or
      autopsy, against myocardial histology. Report reclassification between
      frameworks and the outcome yield of the patients each framework uniquely
      captures or uniquely misses.
  evidence:
  - reference: PMID:34546787
    reference_title: Sex Differences in Patients With Suspected Cardiac Sarcoidosis Assessed by Cardiovascular Magnetic Resonance Imaging.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      less often met criteria for a clinical diagnosis of cardiac sarcoidosis
      (Heart Rhythm Society consensus criteria, 22.7% versus 36.0%; P=0.012 and
      2016 Japanese Circulation Society guideline criteria, 8.0% versus 19.3%;
      P=0.005), indicating lesser cardiac involvement
    explanation: >-
      Reports both frameworks applied to the same cohort, giving the paired
      percentages that quantify their discordance. The paper's own subject is
      sex differences, so the framework comparison is read off its data rather
      than being its stated conclusion.
  - reference: PMID:36924191
    reference_title: "Cardiac sarcoidosis: phenotypes, diagnosis, treatment, and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Definite diagnosis of CS requires myocardial biopsy and histopathology,
      but a sufficient diagnostic likelihood can be achieved by combining
      extracardiac histology of sarcoidosis with clinical manifestations and
      findings on cardiac imaging.
    explanation: >-
      Establishes that the frameworks exist precisely because the histologic gold
      standard is usually unavailable, which is why the discordance cannot be
      adjudicated directly.
notes: >-
  Scope. This entry models the CARDIAC arm of sarcoidosis: the myocardial
  mechanism chain, the cardiac phenotypes it produces, the cardiac-specific
  diagnostic pathway and criteria frameworks, cardiac-specific biomarkers, and
  the cardiac treatment repertoire and trial landscape. Deliberately OUT of
  scope, and curated in kb/disorders/Sarcoidosis.yaml instead, are the
  sarcoidosis-general layers that are not cardiac-specific: genetic
  susceptibility (HLA-DQB1*06:01, familial clustering, TLR3/ANXA11 and other
  association signals), environmental and occupational exposures, and the
  systemic activity biomarkers (serum ACE, soluble IL-2 receptor, CRP, ESR).
  Duplicating those here would restate the parent entry rather than add to it.

  Relationship to the sibling dismech entries. kb/disorders/Sarcoidosis.yaml
  models the systemic disease and carries a "Cardiac Sarcoidosis" subtype with
  four cardiac phenotypes, but no cardiac pathophysiology: its pathograph stops
  at generic Granuloma Formation and Fibrotic Tissue Remodeling. This entry adds
  the cardiac-specific mechanism arm - myocardial granulomatous infiltration,
  the reversible active-inflammation stage, conduction-axis involvement producing
  AV block, post-inflammatory replacement fibrosis, scar-mediated re-entrant
  ventricular tachyarrhythmia, and progressive ventricular dysfunction - plus
  the three competing cardiac diagnostic criteria frameworks (2014 HRS, 2016 JCS,
  WASOG), the cardiac diagnostic pathway (echocardiography, CMR, FDG-PET,
  endomyocardial biopsy, ECG), the two node-attached cardiac biomarkers
  (hs-cardiac troponin, NT-proBNP), the cardiac treatment repertoire
  (corticosteroids, methotrexate maintenance, TNF inhibitors, ICD, pacing,
  ablation, transplantation), and the cardiac-sarcoidosis trial landscape.
  kb/disorders/Neurosarcoidosis.yaml is the organ-specific precedent this entry
  follows. MONDO:0001707 also appears in
  kb/disorders/Arrhythmogenic_Right_Ventricular_Cardiomyopathy.yaml as a
  differential-diagnosis cross-reference; that link is reciprocated here.

  Phenotypes considered and NOT added. Pericardial effusion, ventricular
  premature beats, and late gadolinium enhancement were reviewed as candidate
  phenotypes. No quotable cardiac-sarcoidosis-specific statement was found in
  the cached references for the first two, so adding them would have meant
  unevidenced content; late gadolinium enhancement is an imaging finding already
  modelled as the Myocardial Fibrosis phenotype plus the cardiac MRI diagnosis
  entry, and is not separately curated as a phenotype.

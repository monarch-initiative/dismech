name: Cardiac Sarcoidosis
creation_date: "2026-08-19T00:00:00Z"
category: Immune
description: >-
  Cardiac sarcoidosis is myocardial involvement by sarcoidosis, in which
  non-caseating epithelioid-cell granulomas infiltrate the heart. Granulomatous
  infiltration follows the same antigen-driven CD4+ T-cell / Th1 / macrophage
  program as sarcoidosis elsewhere, but in the myocardium it acquires an
  organ-specific consequence set that no other sarcoid organ shares: the
  granulomas and the patchy replacement fibrosis they leave behind disrupt the
  atrioventricular conduction axis (producing high-grade AV block), create the
  fixed scar substrate for macro-re-entrant ventricular tachyarrhythmia, and
  drive progressive ventricular dysfunction and heart failure. Sudden cardiac
  death may be the first recognized manifestation. Lesions favour the left
  ventricular free wall, basal interventricular septum, and right ventricle, and
  are characteristically patchy - which is why endomyocardial biopsy has low
  sensitivity and diagnosis rests on cardiac MRI and FDG-PET. Clinically manifest
  cardiac involvement is recognized in roughly 5% of sarcoidosis patients, while
  imaging and autopsy detect involvement in 20-25%. Disease may also be confined
  to the heart (isolated cardiac sarcoidosis), where it carries a worse prognosis
  and is difficult to distinguish from arrhythmogenic cardiomyopathy.

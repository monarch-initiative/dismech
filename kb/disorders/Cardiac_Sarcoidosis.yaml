    reference_title: "Interleukin-1 Blockade for Treatment of Cardiac Sarcoidosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the current study, researchers aim to evaluate the safety and efficacy
      of IL-1 blockade with anakinra (IL-1 receptor antagonist) in patients with
      cardiac sarcoidosis.
    explanation: States the intervention and objective of the trial.
  - reference: clinicaltrials:NCT04017936
    reference_title: "Interleukin-1 Blockade for Treatment of Cardiac Sarcoidosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cardiac disease generally progresses from areas of focal inflammation to
      scar
    explanation: >-
      The trial registration independently states the focal-inflammation-to-scar
      progression that is the backbone of this entry's pathograph.
- name: NCT06868381
  phase: PHASE_II
  status: NOT_RECRUITING
  description: >-
    A single-site open-label Phase IIa trial (n=10) of the JAK inhibitor
    baricitinib added to steroid-sparing therapy in active cardiac sarcoidosis,
    with cardiac FDG-PET/CT change as the primary endpoint. Status is
    not-yet-recruiting.
  evidence:
  - reference: clinicaltrials:NCT06868381

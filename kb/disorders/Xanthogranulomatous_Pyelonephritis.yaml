      we note that the latter is a more reliable source for establishing the
      causing pathogen and its microbiological sensitivity.
    explanation: >-
      The authors specifically concluded that kidney urine culture is more
      reliable than bladder urine for establishing the XGP pathogen and its
      antimicrobial sensitivity.
treatments:
- name: Culture-directed antibiotic therapy
  description: >-
    Empiric broad antibacterial therapy is narrowed to the organism and
    susceptibility profile recovered from bladder urine, kidney urine, or
    drained collections; antibiotics are used before surgery in diffuse disease
    and can be definitive in selected focal pediatric disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Obstructed Infected Collecting System
    treatment_effect: INHIBITS
    description: >-
      Antibiotics lower viable uropathogen burden in the infected collecting
      system and abscess cavities.
  evidence:
  - reference: PMID:33827527
    reference_title: "Xanthogranulomatous pyelonephritis: a focus on microbiological and antibiotic resistance profiles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      XGP can be a life-threatening condition; thus, data about culture isolates
      and antimicrobial resistances may guide antibiotic treatment in these
      cases.
    explanation: >-
      The microbiology-focused 27-patient series supports selecting XGP
      antibiotics with attention to culture isolates and antimicrobial
      resistance profiles.
- name: Nephrectomy for diffuse destructive disease
  description: >-
    Simple or radical nephrectomy removes the chronically infected,
    nonfunctioning kidney in diffuse adult XGP, although dense perinephric
    adhesions and adjacent-organ invasion make the operation morbidity-prone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Nephrectomy
    term:
      id: NCIT:C15284
      label: Nephrectomy
  target_mechanisms:
  - target: Renal Parenchymal Replacement
    treatment_effect: INHIBITS
    description: >-
      Nephrectomy removes the destroyed infected kidney that contains the
      xanthogranulomatous mass and abscess cavities.
  - target: Perinephric and Psoas Extension
    treatment_effect: INHIBITS
    description: >-
      When XGP extends through the capsule, nephrectomy is combined with
      debridement or repair of the involved perinephric and adjacent tissues.
  evidence:
  - reference: PMID:37610600
    reference_title: Nephrectomy for xanthogranulomatous pyelonephritis-a not-so-simple solution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      An open nephrectomy was performed in all but one case (91%, n = 10). A
      postoperative complication occurred in 73% (n = 8), with 50% (n = 4) of
      complications Clavien Dindo grade 3 or higher, including one patient
      mortality.
    explanation: >-
      The surgical case series supports nephrectomy as common and technically
      high-morbidity in surgically managed XGP.
review_notes: >-
  XGP is curated as a rare chronic infectious kidney disease rather than as
  acute pyelonephritis: the defining lesion is the chronic obstructed
  upper-tract infection with lipid-laden macrophage xanthogranulomas. Duplicate
  preflight before claim #16420 searched `origin/main`, local ignored files,
  open PRs, and all-state GitHub issues/PRs for `MONDO:0007022`, the exact
  label, and `Xanthogranulomatous_Pyelonephritis`; the only remote match was an
  Immunodeficiency_76 PR body mentioning XGP as a secondary infection in a
  single FCHO1-deficient patient.

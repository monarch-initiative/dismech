name: Xanthogranulomatous Pyelonephritis
creation_date: "2026-11-03T22:13:00Z"
description: >-
  Xanthogranulomatous pyelonephritis is a rare chronic destructive bacterial
  kidney infection in which obstructing stones and persistent upper-tract
  uropathogens drive suppurative inflammation, incomplete phagolysosomal
  bacterial degradation, lipid-laden macrophage accumulation, granulomatous
  parenchymal replacement, and an enlarged masslike kidney that often mimics
  renal malignancy.
category: Infectious Disease
disease_term:
  preferred_term: xanthogranulomatous pyelonephritis
  term:
    id: MONDO:0007022
    label: xanthogranulomatous pyelonephritis
parents:
- Chronic pyelonephritis
synonyms:
- XGP
- XGPN
- XPN
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: INFECTIOUS_DISEASES
prevalence:
- population: Published case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    Xanthogranulomatous pyelonephritis has no reliable population prevalence
    estimate and is represented mainly by retrospective nephrectomy series and
    case reports; a 2024 pooled quantitative analysis reviewed 251 published
    cases.
  evidence:
  - reference: PMID:34522121
    reference_title: "Xanthogranulomatous Pyelonephritis: A Narrative Review with Current Perspectives on Diagnostic Imaging and Management, Including Interventional Radiology Techniques."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An increased incidence of calyceal stones and staghorn calculi, recurrent
      urinary tract infections and chronic interstitial nephritis is well
      established and these are the most common associations.
    explanation: >-
      Supports renal calculi and recurrent upper-tract infection as central
      associated antecedents of XGP.
  - reference: PMID:39254583
    reference_title: "Xanthogranulomatous Pyelonephritis: A pooled quantitative analysis of published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Among the 251 patients, the mean age was 36.1 years, and 57.4% were female.
    explanation: >-
      Establishes the 251-patient pooled published-case evidence base rather
      than a denominator-based prevalence estimate.
progression:
- phase: Chronic obstructed upper-tract infection
  duration: Weeks to years before diagnosis
  notes: >-
    Most cases are chronic and arise in the setting of obstruction or stones,
    although focal pediatric lesions can present as a localized renal mass
    without a long history.
  evidence:
  - reference: PMID:21526966
    reference_title: Xanthogranulomatous pyelonephritis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Xanthogranulomatous pyelonephritis is an uncommon chronic destructive
      granulomatous process of renal parenchyma in association with long-term
      urinary tract obstruction and infection.
    explanation: >-
      Defines XGP as a chronic destructive renal process associated with
      long-term infection and obstruction.
- phase: Diffuse destructive disease
  notes: >-
    In diffuse adult disease, granulomatous replacement and abscess formation
    can destroy most of the affected kidney and make nephrectomy the standard
    treatment.
  evidence:
  - reference: PMID:41250779
    reference_title: Xanthogranulomatous Pyelonephritis in the Tropics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      After histopathological analysis, 40 patients were diagnosed with pure
      XGPN, 7 with associated chronic pyelonephritis, 3 with hydronephrosis, 2
      with pyonephrosis, 1 with nephrocutaneous fistula, 1 with high-grade
      urothelial carcinoma and 1 with serositis.
    explanation: >-
      Shows the surgical end-stage spectrum in a 55-specimen histopathology
      series, including pure XGP, chronic pyelonephritis, hydronephrosis,
      pyonephrosis, fistula, and malignancy overlap.
- phase: Focal pediatric disease
  age_range: Childhood
  notes: >-
    Children more often have focal lesions that mimic renal abscess or tumor;
    selected stable focal cases can resolve with prolonged antibiotics and
    drainage or biopsy rather than nephrectomy.
  evidence:
  - reference: PMID:41341186
    reference_title: "Case Report: Focal xanthogranulomatous pyelonephritis in children: diagnostic pitfalls and the role of conservative management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Literature review of 34 pediatric XGP cases (median age 11.1 years)
      showed that 53% were focal lesions. Conservative management with
      antibiotics, with or without drainage, succeeded in 64% of cases, and
      overall outcomes were favorable, with stable renal function and no
      reported mortality.
    explanation: >-
      Quantifies focal disease and kidney-sparing conservative management in
      the pediatric XGP literature reviewed by the two-case report.
infectious_agent:
- name: Escherichia coli
  description: >-
    Escherichia coli is one of the two predominant uropathogens cultured from
    xanthogranulomatous pyelonephritis, especially from bladder or kidney urine
    collected from the infected obstructed kidney.
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:37242365
    reference_title: "Clinical Presentation, Microbiological Characteristics, and Their Implications for Perioperative Outcomes in Xanthogranulomatous Pyelonephritis: Perspectives from a Real-World Multicenter Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In our series, Escherichia coli was the most common isolated pathogen in
      both bladder and kidney urine cultures.
    explanation: >-
      The 365-patient multicenter series identified E. coli as the most common
      pathogen in both urine-culture compartments.
- name: Proteus mirabilis
  description: >-
    Proteus mirabilis is a recurrent XGP pathogen; its urease activity promotes
    alkaline urine and struvite calculi, reinforcing the stone-obstruction and
    infection loop that favors XGP.
  infectious_agent_term:
    preferred_term: Proteus mirabilis
    term:
      id: NCBITaxon:584
      label: Proteus mirabilis
  evidence:
  - reference: PMID:21526966
    reference_title: Xanthogranulomatous pyelonephritis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Urine cultures most often reveal Escherichia coli and Proteus mirabilis .
    explanation: >-
      The pathology review names E. coli and Proteus mirabilis as the usual
      cultured organisms in XGP.
transmission:
- name: Obstructed endogenous upper-tract infection
  description: >-
    XGP is not externally transmitted. Uropathogens persist and proliferate in
    the renal collecting system when calculi or another obstructive lesion
    prevent clearance, making kidney urine and tissue cultures more directly
    informative than bladder urine in advanced disease.
  evidence:
  - reference: PMID:37242365
    reference_title: "Clinical Presentation, Microbiological Characteristics, and Their Implications for Perioperative Outcomes in Xanthogranulomatous Pyelonephritis: Perspectives from a Real-World Multicenter Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In our series, 46.8% and 18.1% of urine and kidney cultures were sterile,
      respectively.
    explanation: >-
      The multicenter study found kidney cultures more often positive than
      bladder urine cultures, supporting compartmentalized infection in the
      affected obstructed kidney.
environmental:
- name: Obstructive nephrolithiasis
  description: >-
    Renal or ureteral calculi predispose to XGP by obstructing urinary flow and
    creating stasis that permits chronic infection in the renal pelvis and
    calyces; struvite staghorn stones are common but not required.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  influences_mechanisms:
  - target: Obstructed Infected Collecting System
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Stones mechanically obstruct the collecting system and create the stasis
      that permits chronic uropathogen persistence.
  evidence:
  - reference: PMID:39254583
    reference_title: "Xanthogranulomatous Pyelonephritis: A pooled quantitative analysis of published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common symptom and finding were fever (55.0%) and renal stones
      (53.8%), respectively.
    explanation: >-
      The pooled quantitative analysis identified renal stones in more than
      half of 251 XGP cases.
pathophysiology:
- name: Obstructed Infected Collecting System
  role: trigger
  biological_scale: TISSUE
  description: >-
    Uropathogens persist behind a renal calculus, staghorn stone, ureteral
    obstruction, or other outflow block in the renal pelvis and calyces.
  locations:
  - preferred_term: renal pelvis
    term:
      id: UBERON:0001224
      label: renal pelvis
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Chronic Suppurative Renal Inflammation
    causal_link_type: DIRECT
    description: >-
      Long-term bacterial persistence in the obstructed collecting system
      sustains suppurative pyelonephritis within the renal parenchyma.
  evidence:
  - reference: PMID:41250779
    reference_title: Xanthogranulomatous Pyelonephritis in the Tropics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Computed tomography (CT) scans revealed segments of low attenuation,
      hydronephrosis with expansion of renal calyces, parenchymal inflammation
      and thickening of renal fascia in all patients.
    explanation: >-
      The histopathology series links XGP with obstructed collecting-system
      morphology and parenchymal inflammation on CT.
- name: Chronic Suppurative Renal Inflammation
  biological_scale: TISSUE
  description: >-
    Persistent infection recruits neutrophils and other inflammatory cells into
    renal parenchyma, generating a chronic pyogenic inflammatory nidus.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: kidney interstitium
    term:
      id: UBERON:0005215
      label: kidney interstitium
  biological_processes:
  - preferred_term: chronic inflammatory response
    modifier: INCREASED
    term:
      id: GO:0002544
      label: chronic inflammatory response
  - preferred_term: phagocytosis
    modifier: INCREASED
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Incomplete Phagolysosomal Bacterial Degradation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The infected suppurative core contains bacteria within phagocytes and
      phagocytic vacuoles, while peripheral histiocytes accumulate
      phagolysosomal material and lipid droplets.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Persistent renal infection and suppuration drive fever.
  - target: Leukocytosis
    causal_link_type: DIRECT
    description: >-
      Chronic bacterial kidney infection drives systemic leukocytosis.
  - target: Pyuria
    causal_link_type: DIRECT
    description: >-
      Neutrophil-rich infection of the kidney and collecting system sheds
      leukocytes into urine.
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      The infected obstructed kidney can progress to systemic urosepsis.
  evidence:
  - reference: PMID:41250779
    reference_title: Xanthogranulomatous Pyelonephritis in the Tropics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Histologically, all cases revealed sheets of foamy histiocytes, along with
      a few multinucleated giant cells and chronic inflammation.
    explanation: >-
      Confirms chronic inflammatory histology in every case from the 55-specimen
      surgical pathology series.
- name: Incomplete Phagolysosomal Bacterial Degradation
  biological_scale: CELLULAR
  description: >-
    Phagocytes in the lesion retain bacteria, electron-dense phagolysosomal
    debris, and lipid droplets, indicating incomplete bacterial degradation and
    altered macrophage processing inside xanthogranulomas.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    modifier: INCREASED
    term:
      id: GO:0042116
      label: macrophage activation
  downstream:
  - target: Foam-Cell Xanthogranulomatous Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Lipid droplets and phagolysosomal bacterial remnants accumulate in
      histiocytes, producing the foam-cell layer that gives XGP its
      xanthogranulomatous morphology.
  evidence:
  - reference: PMID:7076194
    reference_title: Ultrastructural demonstration of intracellular bacteria in xanthogranulomatous pyelonephritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our study suggests that xanthogranulomatous pyelonephritis is a bacteria
      induced process. Its histological appearance may be related to incomplete
      bacterial degradation and altered host response.
    explanation: >-
      The five-case electron-microscopy study directly supports a
      bacteria-induced process with incomplete bacterial degradation as the
      basis of XGP histology.
- name: Foam-Cell Xanthogranulomatous Inflammation
  biological_scale: TISSUE
  description: >-
    Lipid-laden macrophages, giant cells, neutrophils, lymphocytes, and plasma
    cells form a yellow xanthogranulomatous infiltrate that expands through and
    replaces renal parenchyma.
  cell_types:
  - preferred_term: macrophage derived foam cell
    term:
      id: CL:0000517
      label: macrophage derived foam cell
  biological_processes:
  - preferred_term: macrophage derived foam cell differentiation
    modifier: INCREASED
    term:
      id: GO:0010742
      label: macrophage derived foam cell differentiation
  downstream:
  - target: Renal Parenchymal Replacement
    causal_link_type: DIRECT
    description: >-
      Sheets of foamy macrophages, abscesses, fibrosis, and granulomatous
      tissue replace functioning renal parenchyma.
  - target: Anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic inflammatory XGP frequently presents with anemia.
  evidence:
  - reference: PMID:21526966
    reference_title: Xanthogranulomatous pyelonephritis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Histologically, xanthogranulomatous pyelonephritis presents a
      granulomatous inflammatory infiltrate composed of neutrophils,
      lymphocytes, plasma cells, xanthomatous histiocytes, and multinucleated
      giant cells.
    explanation: >-
      Summarizes the foam-cell-rich mixed inflammatory infiltrate that defines
      XGP histology.
- name: Renal Parenchymal Replacement
  biological_scale: TISSUE
  description: >-
    The involved kidney becomes enlarged and masslike as xanthogranulomatous
    inflammation, abscesses, and fibrosis replace functioning renal parenchyma.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Flank pain
    causal_link_type: DIRECT
    description: >-
      The enlarged inflamed kidney and stretched perinephric tissues cause
      lumbar or flank pain.
  - target: Hematuria
    causal_link_type: DIRECT
    description: >-
      Destructive inflammation of the collecting system and renal parenchyma
      permits blood to enter the urine.
  - target: Abdominal mass
    causal_link_type: DIRECT
    description: >-
      In advanced disease, the enlarged xanthogranulomatous kidney can present
      as a palpable abdominal mass.
  - target: Perinephric and Psoas Extension
    causal_link_type: DIRECT
    description: >-
      Transmural inflammation and abscesses can extend beyond the renal
      capsule into perinephric fat, psoas muscle, skin, or adjacent bowel.
  evidence:
  - reference: PMID:41250779
    reference_title: Xanthogranulomatous Pyelonephritis in the Tropics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cut-section showed dilated pelvicalyceal system with loss of cortico-
      medullary differentiation and replacement of renal parenchyma by multiple
      yellow fatty nodular areas.
    explanation: >-
      Gross pathology from nephrectomy specimens shows parenchymal replacement
      by yellow xanthogranulomatous nodules.
- name: Perinephric and Psoas Extension
  biological_scale: TISSUE
  description: >-
    In locally invasive XGP, inflammation leaves the kidney and spreads into
    perinephric or paranephric soft tissue, including psoas muscle, producing
    psoas abscesses, perinephric abscesses, or fistulae.
  locations:
  - preferred_term: psoas muscle
    term:
      id: UBERON:0008450
      label: psoas muscle
  downstream:
  - target: Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Perinephric abscess and adjacent-organ invasion increase the burden of
      infection and can precipitate sepsis.
  evidence:
  - reference: PMID:36105829
    reference_title: "Unusual case of urothelial carcinoma disguised as xanthogranulomatous pyelonephritis and causing reno-colic fistula: Case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The complications of this type of pyelonephritis are due to the
      involvement of adjacent organs. The most frequent ones are Psoas abscess,
      perinephric abscess, and sepsis. Nephrocutaneous and renocolic fistulas
      are less common.
    explanation: >-
      The review summarizes the adjacent-organ complications of destructive XGP,
      including psoas abscess, perinephric abscess, sepsis, and fistulae.

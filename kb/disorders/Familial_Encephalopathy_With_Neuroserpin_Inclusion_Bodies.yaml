- name: Neuroserpin Loop-Sheet Polymerization
  description: >-
    Destabilized mutant neuroserpin undergoes ordered intermolecular linkage in
    which the reactive centre loop of one molecule inserts into beta-sheet A of
    the next, forming loop-sheet polymers under physiological conditions.
    Polymerization rate scales with the severity of the variant.
  role: intermediate
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: neuroserpin loop-sheet polymerization
    term:
      id: GO:0051258
      label: protein polymerization
    modifier: INCREASED
  evidence:
  - reference: PMID:11880376
    reference_title: Mutant Neuroserpin (S49P) that causes familial encephalopathy with neuroserpin inclusion bodies is a poor proteinase inhibitor and readily forms polymers in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: An assessment by circular dichroism showed that S49P neuroserpin had a lower melting temperature than wild-type protein (49.9 and 56.6 degrees C, respectively) and more readily formed loop-sheet polymers under physiological conditions.
    explanation: >-
      Purified S49P neuroserpin is thermally destabilized and polymerizes more
      readily than wild type.
  - reference: PMID:10517635
    reference_title: Familial dementia caused by polymerization of mutant neuroserpin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: histologically by unique neuronal inclusion bodies and biochemically by polymers of the neuron-specific serpin, neuroserpin
    explanation: >-
      Patient inclusions are composed of neuroserpin polymers.

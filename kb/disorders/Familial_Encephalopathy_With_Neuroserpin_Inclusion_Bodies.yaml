pathophysiology:
- name: SERPINI1 Destabilizing Missense Variant
  description: >-
    Heterozygous germline missense variants in SERPINI1 substitute residues in
    the shutter region and adjacent structural elements of neuroserpin (S49P
    Syracuse, S52R Portland, H338R, G392E, G392R, R393P), lowering the
    conformational stability of the native serpin fold. Variants differ in how
    strongly they destabilize the protein, setting the downstream rate of
    polymer formation.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SERPINI1
    term:
      id: hgnc:8943
      label: SERPINI1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Toxic gain of function through polymerization, combined with reduced
      inhibitory activity of the mutant protein.
  evidence:
  - reference: PMID:10517635
    reference_title: Familial dementia caused by polymerization of mutant neuroserpin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report the cosegregation of point mutations in the neuroserpin gene (PI12) with the disease in two families.
    explanation: >-
      Point mutations in SERPINI1 (PI12) cosegregate with FENIB in the founding
      families.
  - reference: PMID:12103288
    reference_title: Association between conformational mutations in neuroserpin and onset and severity of dementia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Each of the families was heterozygous for an amino acid substitution that affected the conformational stability of neuroserpin.
    explanation: >-
      Across five families, each heterozygous substitution destabilizes the
      neuroserpin conformation.

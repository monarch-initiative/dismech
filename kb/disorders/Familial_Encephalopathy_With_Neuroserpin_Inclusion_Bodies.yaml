- name: Progressive Neuronal Degeneration
  description: >-
    Chronic proteotoxic burden from ER-retained neuroserpin polymers, with
    oxidative and mitochondrial injury, drives progressive dysfunction and loss
    of cortical and subcortical neurons. Neuronal loss in frontal and association
    cortices underlies the frontal-predominant dementia, and its progression
    parallels the inclusion burden set by the variant.
  role: effector

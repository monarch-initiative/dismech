    causal_link_type: DIRECT
- name: Reduced tPA Inhibitory Activity of Mutant Neuroserpin
  description: >-
    Mutant neuroserpin forms unstable complexes with tissue plasminogen
    activator and has a much higher inhibition constant than wild type, and
    polymerized neuroserpin retained in the ER is not secreted, so inhibitory
    capacity toward tPA is reduced. Whether this loss of function contributes to
    the clinical phenotype is unsettled.
  role: intermediate
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  molecular_functions:
  - preferred_term: tissue plasminogen activator inhibitory activity
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11880376
    reference_title: Mutant Neuroserpin (S49P) that causes familial encephalopathy with neuroserpin inclusion bodies is a poor proteinase inhibitor and readily forms polymers in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, S49P neuroserpin formed unstable complexes with an association rate constant and K(i) of 0.3 x 10(4) m(-1) s(-1) and 533.3 nm, respectively.
    explanation: >-
      S49P neuroserpin inhibits tPA roughly two orders of magnitude less
      potently than wild type (Ki 533 nM versus 5.8 nM).
- name: Retention of Neuroserpin Polymers in the Neuronal Endoplasmic Reticulum
  description: >-
    Polymerized mutant neuroserpin is retained within the endoplasmic reticulum
    of cortical and subcortical neurons instead of being secreted, building up
    over time into Collins bodies. The neuronal polymer load correlates with the
    severity of the causative variant, and in mouse models inclusions accumulate
    long before clinical signs appear.

treatments:
- name: Antiseizure pharmacotherapy
  description: >-
    Myoclonus and seizures are treated with antiseizure drugs (for example
    valproate and levetiracetam), which are frequently only partly effective.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  evidence:
  - reference: PMID:36417830
    reference_title: "Role of SERPINI1 pathogenic variants in familial encephalopathy with neuroserpin inclusion bodies: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "9 out of 12 patients did not respond to ASMs"
    explanation: Antiseizure medications are the mainstay but are often ineffective.
- name: Supportive and palliative care
  description: >-
    Management is symptomatic, including aspiration prevention and supportive
    care as the disease progresses.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic counseling
  description: >-
    Autosomal dominant transmission carries a 50% recurrence risk; counseling and
    predictive testing are offered to at-risk relatives.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Embelin (experimental anti-polymerization)
  description: >-
    Preclinical: the small molecule embelin destabilises neuroserpin conformers
    and impairs polymerization in vitro; it is not a clinical therapy.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: ER Loop-Sheet Polymerization
    treatment_effect: INHIBITS
    description: >-
      Embelin binds neuroserpin and impairs its loop-sheet polymerization, acting
      on the same step the serpinopathy module's investigational polymerization
      inhibitor targets.
    evidence:
    - reference: PMID:26732982
      reference_title: Embelin binds to human neuroserpin and impairs its polymerisation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "NS polymers disaggregate in the presence of EMB, and their formation is prevented"
      explanation: Embelin prevents and reverses neuroserpin polymerization, so it acts on this node.
  evidence:
  - reference: PMID:26732982
    reference_title: Embelin binds to human neuroserpin and impairs its polymerisation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NS polymers disaggregate in the presence of EMB, and their formation is prevented"
    explanation: Embelin prevents and reverses neuroserpin polymerization in vitro.
animal_models:
- name: G392E neuroserpin transgenic mouse
  species: Mouse
  genotype: Neuron-specific human G392E neuroserpin transgene
  publication: PMID:18940798
  description: >-
    Transgenic mice expressing the severe G392E variant accumulate neuroserpin in
    neurons in an age- and dose-dependent way; S49P/S52R transgenic lines model
    the milder variants.
  modeled_mechanisms:
  - target: Collins Body Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Age- and dose-dependent neuronal accumulation of mutant neuroserpin.
    limitations: >-
      An overexpression transgene rather than a knock-in, and accumulation
      requires homozygous high expression.
    evidence:
    - reference: PMID:18940798
      reference_title: "Mutation-, aging-, and gene dosage-dependent accumulation of neuroserpin (G392E) in endoplasmic reticula and lysosomes of neurons in transgenic mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "G392E neuroserpin accumulated age-dependently in neurons of the neocortex"
      explanation: Reproduces age-dependent neuronal accumulation of the mutant protein.
  evidence:
  - reference: PMID:18940798
    reference_title: "Mutation-, aging-, and gene dosage-dependent accumulation of neuroserpin (G392E) in endoplasmic reticula and lysosomes of neurons in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "G392E neuroserpin accumulated age-dependently in neurons of the neocortex"
    explanation: Establishes the G392E transgenic mouse as a FENIB model.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence rate is documented; about 15-20 families or sporadic
    cases have been reported.
progression:
- phase: Presymptomatic accumulation
  notes: >-
    Mutant neuroserpin polymers accumulate in neurons before symptoms, the pace
    set by the variant's instability.
- phase: Onset
  notes: >-
    Presenile frontal dementia (fifth-sixth decade) in mild variants, or
    childhood/adolescent progressive myoclonus epilepsy in severe variants.
- phase: Progression
  notes: >-
    Progressive cognitive decline with drug-resistant myoclonus and seizures, and
    cortical atrophy in the most severe cases.
- phase: Advanced disease
  notes: >-
    Loss of independence, status epilepticus and aspiration pneumonia, with
    shortened life expectancy.

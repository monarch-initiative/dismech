name: Familial Encephalopathy With Neuroserpin Inclusion Bodies
category: Mendelian
creation_date: '2026-10-03T21:59:18Z'
synonyms:
- FENIB
- Encephalopathy, familial, with neuroserpin inclusion bodies
- Familial dementia with neuroserpin inclusion bodies
- Neuroserpin encephalopathy
- Neuroserpinopathy
description: >-
  Familial encephalopathy with neuroserpin inclusion bodies (FENIB) is an
  autosomal dominant neurodegenerative serpinopathy caused by heterozygous
  missense variants in SERPINI1, which encodes neuroserpin, a neuron-secreted
  serine protease inhibitor of tissue plasminogen activator. Destabilizing
  substitutions (S49P, S52R, H338R, G392E, G392R and others) make neuroserpin
  form ordered loop-sheet polymers during biosynthesis; the polymers are retained
  in the endoplasmic reticulum of cortical and subcortical neurons as
  eosinophilic, PAS-positive inclusions called Collins bodies. Clinically the
  disorder spans presenile dementia with frontal-executive and behavioural
  features through childhood- or adolescent-onset progressive myoclonus epilepsy
  with cognitive decline, often refractory to antiseizure medication, with
  dyskinesia, brain atrophy and early death in the severe forms. Age of onset
  and severity track the polymerization propensity of the variant: the
  least disruptive allele (S49P) gives dementia after age 45 with sparse
  inclusions, whereas G392E gives adolescent progressive myoclonus epilepsy with
  inclusions in almost all neurons. Retained polymers activate an ER overload
  response with calcium-dependent NF-kappaB signalling rather than the canonical
  unfolded protein response, and are cleared by ER-associated degradation and
  autophagy. There is no disease-modifying therapy; care is symptomatic.

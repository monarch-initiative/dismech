discussions:
- discussion_id: gap_gof_vs_lof_contribution
  prompt: >-
    How much of the FENIB phenotype, and the epilepsy in particular, is driven by
    the toxic gain of function of ER-retained neuroserpin polymers versus the loss
    of neuroserpin's inhibitory function on tissue plasminogen activator?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced tPA Inhibitory Activity of Mutant Neuroserpin
  - pathophysiology#Neuronal Hyperexcitability
  rationale: >-
    The polymer gain-of-function is well supported: inclusion burden tracks
    variant instability and predicts severity, and polymers are directly toxic in
    cell and fly models. The loss-of-function contribution is less settled.
    Mutant neuroserpin is a poor tPA inhibitor and is largely not secreted, which
    could leave synaptic tPA unopposed and raise excitability, but neuroserpin
    inactivity alone was judged insufficient to cause seizures in the transgenic
    mouse work, and a secreted G392E polymer was not synaptotoxic to primary
    neurons. Resolving the relative contribution matters for whether a therapy
    should block polymerization, restore inhibitory function, or both.
  evidence:
  - reference: PMID:33888787
    reference_title: G392E neuroserpin causing the dementia FENIB is secreted from cells but is not synaptotoxic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Altogether, we report here that a polymerogenic mutant form of neuroserpin is secreted from cells but is not toxic in the extracellular milieu.
    explanation: >-
      Argues against an extracellular/loss-of-function toxic mechanism for the
      secreted G392E polymer, framing the open question.
  - reference: PMID:17392169
    reference_title: Accumulation of mutant neuroserpin precedes development of clinical symptoms in familial encephalopathy with neuroserpin inclusion bodies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Therefore, we think that inactivity of neuroserpin alone is not sufficient to cause symptoms like epileptic seizure.
    explanation: >-
      Model-based argument that loss of neuroserpin activity alone does not
      account for seizures.

- name: ER Overload Response with NF-kappaB Activation
  description: >-
    Ordered neuroserpin polymers in the ER activate NF-kappaB through a
    calcium-dependent ER overload response that is independent of the IRE1, ATF6
    and PERK limbs of the canonical unfolded protein response. This distinguishes
    FENIB from classic UPR-driven ER stress disorders; UPR induction in models is
    at most limited and transient.
  role: intermediate
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: ER overload response activating NF-kappaB
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:19423713
    reference_title: Neuroserpin polymers activate NF-kappaB by a calcium signaling pathway that is independent of the unfolded protein response.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show here that intracellular neuroserpin polymers activate NF-kappaB by a pathway that is independent of the IRE1, ATF6, and PERK limbs of the canonical unfolded protein response but is dependent on intracellular calcium.
    explanation: >-
      Defines the ER overload response as a calcium-dependent, UPR-independent
      reaction to neuroserpin polymers.
  - reference: PMID:26733586
    reference_title: Limited Unfolded Protein Response and Inflammation in Neuroserpinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The sequestration of UPR activators GRP78 and GRP94 in neuroserpin inclusions might explain the limited UPR responses despite the accumulation of neuroserpin in the ER in this FENIB mouse model.
    explanation: >-
      In Tg-Syracuse mice the UPR is limited, consistent with a non-canonical ER
      stress response.
- name: ER-Associated Degradation and Autophagic Clearance of Mutant Neuroserpin
  description: >-
    Mutant neuroserpin is disposed of by the ubiquitin-proteasome system via
    ER-associated degradation and by autophagy, which together determine the net
    polymer burden. The OS-9 ER lectin delivers mutant neuroserpin to ERAD, and
    sterol (SREBP/cholesterol) metabolism modulates degradation of the G392E
    polymer. Insufficient clearance permits inclusion accumulation.
  role: intermediate
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: ER-associated protein degradation of mutant neuroserpin
    term:
      id: GO:0036503
      label: ERAD pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:19549782
    reference_title: Endoplasmic reticulum-associated degradation (ERAD) and autophagy cooperate to degrade polymerogenic mutant serpins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Inhibition of the proteasome with MG132 reveals that both mutant neuroserpin and alpha(1)-antitrypsin are degraded predominantly by endoplasmic reticulum-associated degradation (ERAD).
    explanation: >-
      Mutant neuroserpin is cleared predominantly by proteasomal ERAD, with
      autophagy as a parallel route.
  - reference: PMID:24795221
    reference_title: Lectin OS-9 delivers mutant neuroserpin to endoplasmic reticulum associated degradation in familial encephalopathy with neuroserpin inclusion bodies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings show that OS-9 delivers mutant neuroserpin to ERAD by recognition of glycan side chains and provide the first in vivo proof of involvement of ERAD in degradation of mutant neuroserpin.
    explanation: >-
      Identifies OS-9 as the ER lectin routing mutant neuroserpin into ERAD, in
      cells and in a FENIB mouse model.
  - reference: PMID:23814041
    reference_title: Sterol metabolism regulates neuroserpin polymer degradation in the absence of the unfolded protein response in the dementia FENIB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The degradation of G392E neuroserpin results from SREBP-dependent activation of the cholesterol biosynthetic pathway in cells that express polymers of neuroserpin (G392E).
    explanation: >-
      Links sterol metabolism to clearance of the G392E polymer via SREBP.
- name: Oxidative Stress and Mitochondrial Dysfunction in Polymer-Laden Neurons
  description: >-
    Neurons retaining neuroserpin polymers mount an antioxidant defence response
    and, when that defence is pharmacologically blocked, become susceptible to
    apoptosis. Polymer-containing neurons also show perinuclear mitochondrial
    redistribution, reduced mitochondrial membrane potential, and fewer
    ER-mitochondria contact sites, implicating oxidative and mitochondrial injury
    in neuronal toxicity.
  role: intermediate
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28363799
    reference_title: Neuroserpin polymers cause oxidative stress in a neuronal model of the dementia FENIB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our results support a role for oxidative stress in the cellular toxicity underlying the neurodegenerative dementia FENIB.
    explanation: >-
      Transcriptomics and pharmacology in G392E neural progenitor-derived
      neurons implicate oxidative stress in polymer toxicity.
  - reference: PMID:35864382
    reference_title: Polymerogenic neuroserpin causes mitochondrial alterations and activates NFκB but not the UPR in a neuronal model of neurodegeneration FENIB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mitochondrial membrane potential and contact sites between mitochondria and the ER were reduced in neurons expressing the G392E mutation.
    explanation: >-
      Documents mitochondrial membrane-potential loss and reduced ER-mitochondria
      contacts in polymer-laden neurons.
  downstream:
  - target: Progressive Neuronal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Neuronal Hyperexcitability
  description: >-
    Polymer-laden neurons become hyperexcitable, lowering the seizure threshold.
    Proposed contributors include increased intracellular calcium release
    associated with the ER overload response and, in the loss-of-function model,
    unopposed tissue plasminogen activator activity at synapses; G392E transgenic
    mice are markedly more susceptible to kainate-induced seizures. This step
    produces the myoclonus and seizures of FENIB.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"

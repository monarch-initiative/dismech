name: Familial Encephalopathy With Neuroserpin Inclusion Bodies
creation_date: "2026-10-29T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: familial encephalopathy with neuroserpin inclusion bodies
  term:
    id: MONDO:0011412
    label: familial encephalopathy with neuroserpin inclusion bodies
synonyms:
- FENIB
- familial dementia with neuroserpin inclusion bodies
- neuroserpinosis
- neuroserpin encephalopathy
- progressive myoclonus epilepsy associated with neuroserpin inclusion bodies
notes: >-
  FENIB is a dominant conformational serpinopathy: a destabilising SERPINI1
  missense variant makes neuroserpin polymerise as loop-sheet polymers in the
  neuronal endoplasmic reticulum, accumulating as Collins bodies. It is curated
  as one DISEASE with variant detail in genetic[].variants; the
  dementia-predominant and progressive-myoclonus-epilepsy presentations are a
  phenotypic spectrum driven by how strongly each variant destabilises the
  protein, not separate disease strata. The entry conforms to the serpinopathy
  module across its chain: ER Loop-Sheet Polymerization is the key node
  (serpinopathy#Serpin Polymerization), with Neuroserpin Fold Destabilization,
  Collins Body Accumulation and ER Overload Response conforming to the module's
  trigger, retention and proteotoxicity nodes. The module captures the conserved
  loop-sheet polymerization of a destabilised serpin that defines this disease
  class. The loss-of-tPA-inhibition node is left unconformed on purpose:
  neuroserpin acts locally in the brain, so the module's plasma-framed
  Circulating Serpin Deficiency node is not a clean instance. Two neighbouring
  modules are deliberately not used:
  the loss_of_proteostasis module is an aging hallmark (network decline during
  aging) rather than a Mendelian conformational defect overwhelming a normal
  network, and the amyloidogenesis module is cross-beta amyloid rather than serpin
  loop-sheet polymers. The toxic mechanism
  is a dominant conformational (polymerization) gain of a toxic species with a
  secondary partial loss of tPA inhibition; functional_impact_category is left
  unset because neither GAIN_OF_FUNCTION, NEOMORPHIC nor DOMINANT_NEGATIVE is
  established for it.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, from a heterozygous SERPINI1 missense variant (germline
    or de novo).
  evidence:
  - reference: PMID:10595921
    reference_title: Familial encephalopathy with neuroserpin inclusion bodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a pattern of inheritance consistent with an autosomal dominant mode of transmission"
    explanation: The founder family showed autosomal dominant transmission.
genetic:
- name: SERPINI1
  gene_term:
    preferred_term: SERPINI1
    term:
      id: hgnc:8943
      label: SERPINI1
  relationship_type: CAUSATIVE
  notes: >-
    SERPINI1 encodes neuroserpin, a neuron-specific serine protease inhibitor of
    tissue plasminogen activator. Pathogenic variants are heterozygous missense
    changes in the shutter/breach region that destabilise the fold; disease onset
    and severity track the variant's polymerization rate (S49P/Syracuse mildest,
    G392E most severe).
  variants:
  - name: S49P (Syracuse)
    description: >-
      The least destabilising variant; presents as presenile dementia after the
      fifth decade.
  - name: S52R (Portland)
    description: >-
      A more destabilising shutter variant with earlier onset and progressive
      myoclonus epilepsy with a frontal syndrome.
  - name: G392E
    description: >-
      The most destabilising variant; severe childhood/adolescent progressive
      myoclonus epilepsy, and can arise de novo.
  - name: H338R
    description: A shutter-region neuroserpin variant.
  evidence:
  - reference: PMID:10517635
    reference_title: Familial dementia caused by polymerization of mutant neuroserpin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cosegregation of point mutations in the neuroserpin gene"
    explanation: Point mutations in the neuroserpin gene cosegregate with disease.
  - reference: PMID:12103288
    reference_title: Association between conformational mutations in neuroserpin and onset and severity of dementia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "onset and severity of the disease is associated with the rate and magnitude of neuronal protein aggregation"
    explanation: Variant severity tracks the rate and magnitude of aggregation.
pathophysiology:
- name: SERPINI1 Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous SERPINI1 missense variant in the shutter/breach region of the
    serpin fold.
  genetic_context:
    variant_origin: GERMLINE
  genes:
  - preferred_term: SERPINI1
    term:
      id: hgnc:8943
      label: SERPINI1
  molecular_functions:
  - preferred_term: serine-type endopeptidase inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
  downstream:
  - target: Neuroserpin Fold Destabilization
    description: The variant destabilises the neuroserpin fold.
  evidence:
  - reference: PMID:10517635
    reference_title: Familial dementia caused by polymerization of mutant neuroserpin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cosegregation of point mutations in the neuroserpin gene"
    explanation: Identifies the causal SERPINI1 (neuroserpin) point mutations.
- name: Neuroserpin Fold Destabilization
  conforms_to: "serpinopathy#Serpin Conformational Instability"
  biological_scale: MOLECULAR
  description: >-
    The mutant protein's fold is destabilised, making it prone to open beta-sheet
    A and self-associate instead of folding and being secreted.
  biological_processes:
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  downstream:
  - target: ER Loop-Sheet Polymerization
    description: The destabilised protein polymerises by loop-sheet linkage.
  evidence:
  - reference: PMID:17392169
    reference_title: Accumulation of mutant neuroserpin precedes development of clinical symptoms in familial encephalopathy with neuroserpin inclusion bodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "point mutations in neuroserpin resulting in its destabilization"
    explanation: The disease variants destabilise neuroserpin.
- name: ER Loop-Sheet Polymerization
  conforms_to: "serpinopathy#Serpin Polymerization"
  biological_scale: MOLECULAR
  description: >-
    Destabilised neuroserpin forms loop-sheet polymers and is retained within the
    neuronal endoplasmic reticulum instead of being secreted.
  biological_processes:
  - preferred_term: protein polymerization
    modifier: INCREASED
    term:
      id: GO:0051258
      label: protein polymerization
  downstream:
  - target: Collins Body Accumulation
    description: Retained polymers accumulate as inclusions.
  - target: Loss of Neuroserpin tPA Inhibition
    description: Polymerized/retained neuroserpin can no longer inhibit tPA.
  evidence:
  - reference: PMID:15090543
    reference_title: Mutants of neuroserpin that cause dementia accumulate as polymers within the endoplasmic reticulum.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutant neuroserpin is retained within the endoplasmic reticulum as polymers"
    explanation: A cell model shows ER retention of mutant neuroserpin as polymers.
- name: Collins Body Accumulation
  conforms_to: "serpinopathy#Intracellular Polymer Retention"
  biological_scale: CELLULAR
  description: >-
    Polymers build up as eosinophilic, PAS-positive, diastase-resistant
    neuronal inclusions (Collins bodies) when clearance is outpaced.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: ER Overload Response
    description: Inclusion load triggers a Ca2+-dependent ER overload response.
  - target: Mitochondrial Dysfunction
    description: Inclusion load disrupts ER-mitochondria contacts and mitochondrial function.
  - target: Neuronal Loss and Neurodegeneration
    description: Inclusion-body formation is sufficient to drive neurodegeneration.
  evidence:
  - reference: PMID:10595921
    reference_title: Familial encephalopathy with neuroserpin inclusion bodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neuronal inclusion bodies distributed throughout the gray matter of the cerebral cortex"
    explanation: Collins bodies are distributed through the cortical gray matter.
- name: ER Overload Response
  conforms_to: "serpinopathy#Polymer Proteotoxicity"
  biological_scale: CELLULAR
  description: >-
    Polymer load triggers a Ca2+-dependent ER overload response with NF-kB
    activation, rather than the canonical unfolded protein response.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: ER overload response
    modifier: INCREASED
    term:
      id: GO:0006983
      label: ER overload response
  downstream:
  - target: Neuronal Loss and Neurodegeneration
    description: Sustained ER overload contributes to neuronal death.
  evidence:
  - reference: PMID:35864382
    reference_title: Polymerogenic neuroserpin causes mitochondrial alterations and activates NFκB but not the UPR in a neuronal model of neurodegeneration FENIB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These alterations were associated with a pattern of ER stress that involved the ER overload response but not the unfolded protein response"
    explanation: The ER stress is an ER overload response, not the unfolded protein response.
- name: Mitochondrial Dysfunction
  biological_scale: CELLULAR
  description: >-
    Polymer load reduces mitochondrial membrane potential and ER-mitochondria
    contact sites and mispositions mitochondria, adding oxidative stress.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: mitochondrion organization
    modifier: ABNORMAL
    term:
      id: GO:0007005
      label: mitochondrion organization
  downstream:
  - target: Neuronal Loss and Neurodegeneration
    description: Mitochondrial injury contributes to neuronal death.
  evidence:
  - reference: PMID:35864382
    reference_title: Polymerogenic neuroserpin causes mitochondrial alterations and activates NFκB but not the UPR in a neuronal model of neurodegeneration FENIB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial membrane potential and contact sites between mitochondria and the ER were reduced in neurons expressing the G392E mutation"
    explanation: Mitochondrial membrane potential and ER-mitochondria contacts are reduced in mutant neurons.
- name: Loss of Neuroserpin tPA Inhibition
  biological_scale: MOLECULAR
  description: >-
    Retained or inactive neuroserpin leaves tissue plasminogen activator
    uninhibited at synapses, which is thought to add to cortical hyperexcitability
    and seizures.
  molecular_functions:
  - preferred_term: serine-type endopeptidase inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
  downstream:
  - target: Seizure
    description: Unchecked tPA activity contributes to cortical hyperexcitability and seizures.
  - target: Myoclonus
    description: Cortical hyperexcitability manifests as myoclonus.
  evidence:
  - reference: PMID:27618835
    reference_title: Progressive myoclonus epilepsy associated with neuroserpin inclusion bodies (neuroserpinosis)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "non-cell autonomous toxicity, caused by loss of protease inhibition, in this case the dysregulated protease is likely to be tissue plasminogen activator (tPA)"
    explanation: Non-cell-autonomous toxicity is attributed to loss of inhibition of tPA; the in-vivo contribution is inferred.
  - reference: PMID:18940798
    reference_title: "Mutation-, aging-, and gene dosage-dependent accumulation of neuroserpin (G392E) in endoplasmic reticula and lysosomes of neurons in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "G392E neuroserpin transgenic mice were much more susceptible to seizures induced by kainate administration than nontransgenic mice"
    explanation: The mutant protein heightens seizure susceptibility in mice; this shows increased excitability rather than directly proving the tPA route.
- name: Neuronal Loss and Neurodegeneration
  biological_scale: CELLULAR
  description: >-
    Cortical and subcortical neurons dysfunction and die, with inclusion-body
    formation itself sufficient to drive the neurodegeneration.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Dementia
    description: Cortical (especially frontal) neuronal loss produces progressive dementia.
  - target: Cerebral cortical atrophy
    description: Neuronal loss produces cortical atrophy in severe disease.
  - target: Dyskinesia
    description: Subcortical neuronal dysfunction produces involuntary movements.
  - target: Impaired executive functioning
    description: Frontal cortical involvement produces a dysexecutive syndrome.
  evidence:
  - reference: PMID:12103288
    reference_title: Association between conformational mutations in neuroserpin and onset and severity of dementia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inclusion-body formation is in itself a sufficient cause of neurodegeneration"
    explanation: Inclusion-body formation is sufficient to cause neurodegeneration.

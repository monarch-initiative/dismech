  OMIM phenotype entry is MIM 604218; MIM 602445 is the SERPINI1 gene entry, not
  the disease. Prevalence below 1 in 1,000,000 is reported by Orphanet
  (ORPHA:85110), but the Orphanet record is not available in the local
  structured-source cache, so the prevalence record below is supported by a
  literature case count instead.

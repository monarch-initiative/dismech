- name: Cortical Neural Precursor Apoptosis
  biological_scale: CELLULAR
  description: >-
    In Nestin-Cre neural-specific Tra2b knockout mice, neural and glial
    precursors in the cortical ventricular layers undergo massive apoptosis,
    with p21 (Cdkn1a) upregulation, and cortical development is severely
    abnormal. Shown only for complete loss of Tra2b in mice; whether the
    human dominant-negative alleles cause precursor loss is not known.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  evidence:
  - reference: PMID:24586484
    reference_title: "Neuronal-specific deficiency of the splicing factor Tra2b causes apoptosis in neurogenic areas of the developing mouse brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Neuronal-specific Tra2b knock-out mice die immediately after birth and show severe abnormalities in cortical development, which are caused by massive apoptotic events in the ventricular layers of the cortex, demonstrating a pivotal role of Tra2b for the developing central nervous system."
    explanation: Apoptosis of cortical ventricular-layer precursors in the knockout.
  - reference: PMID:24586484
    reference_title: "Neuronal-specific deficiency of the splicing factor Tra2b causes apoptosis in neurogenic areas of the developing mouse brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we found increased expression of the cyclin dependent kinase inhibitor 1a (p21) which we could functionally link to neuronal precursor cells in the affected brain regions."
    explanation: p21 upregulation in the affected neural precursors.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24586484
      reference_title: "Neuronal-specific deficiency of the splicing factor Tra2b causes apoptosis in neurogenic areas of the developing mouse brain."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Neuronal-specific Tra2b knock-out mice die immediately after birth and show severe abnormalities in cortical development, which are caused by massive apoptotic events in the ventricular layers of the cortex, demonstrating a pivotal role of Tra2b for the developing central nervous system."
      explanation: >-
        Loss of cortical precursors in the knockout mouse is a plausible route
        to reduced brain growth; the link to human microcephaly is inferred.
  - target: Abnormal Brain Morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24586484
      reference_title: "Neuronal-specific deficiency of the splicing factor Tra2b causes apoptosis in neurogenic areas of the developing mouse brain."

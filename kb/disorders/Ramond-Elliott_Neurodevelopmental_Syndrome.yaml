animal_models:
- name: Nestin-Cre neural-specific Tra2b knockout mouse
  species: Mouse
  genotype: Tra2b conditional knockout in neuronal and glial precursors (Nestin-Cre)
  publication: PMID:24586484
  description: >-
    Mice lacking Tra2b in neural precursors die immediately after birth with
    severe abnormalities of cortical development caused by apoptosis in the
    cortical ventricular layers, accompanied by p21 upregulation.
  modeled_mechanisms:
  - target: Cortical Neural Precursor Apoptosis
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Massive apoptosis in the cortical ventricular layers of the knockout.
    limitations: >-
      Complete loss of Tra2b, whereas the human alleles are heterozygous and
      act through overexpression of the short Tra2-beta-3 isoform; the
      knockout is perinatally lethal, unlike the human disorder.
    evidence:
    - reference: PMID:24586484
      reference_title: "Neuronal-specific deficiency of the splicing factor Tra2b causes apoptosis in neurogenic areas of the developing mouse brain."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neuronal-specific Tra2b knock-out mice die immediately after birth and show severe abnormalities in cortical development, which are caused by massive apoptotic events in the ventricular layers of the cortex, demonstrating a pivotal role of Tra2b for the developing central nervous system."
      explanation: Establishes the knockout phenotype in neural precursors.

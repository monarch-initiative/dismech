    snippet: "Increased expression of Tra2β-3-GFP were shown to interfere with the incorporation of CHEK1 exon 3 into its mature transcript, normally incorporated by Tra2β-1."
    explanation: A Tra2-beta-1-dependent exon is repressed by the short isoform.
  - reference: PMID:24586484
    reference_title: "Neuronal-specific deficiency of the splicing factor Tra2b causes apoptosis in neurogenic areas of the developing mouse brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using whole brain RNA on exon arrays we identified differentially expressed alternative exons of Tubulinδ1 and Shugoshin-like2 as in vivo targets of Tra2b."
    explanation: In mouse brain, loss of Tra2b alters alternative exon use of specific targets.
  downstream:

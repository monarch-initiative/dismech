notes: >-
  Evidence comes from two publications covering 13 individuals. The Ramond
  et al. 2023 cohort paper (PMID:36549593) is cached as abstract only: it is
  not in PMC, and both a forced PMID re-fetch and the DOI fetch returned no
  full text. Per-feature cohort counts, the specific MRI findings, and features
  named only in its full text (absent speech, constipation, scoliosis,
  self-injury, a father-to-son transmission) are therefore not recorded here.
  The Shatokhina et al. case report is cached as full text and supplies the
  hypotonia, motor delay, regression, hypsarrhythmia, white matter, skeletal
  and treatment details for its single proband. The mouse data are for
  complete loss of Tra2b and are used only as indirect support for the neural
  precursor step.

pathophysiology:
- name: TRA2B 5' Variant Isoform Switch
  biological_scale: MOLECULAR
  description: >-
    The truncating variants all lie in the 5' part of TRA2B, upstream of an
    alternative translation start site. In patient-derived cells they lower
    the canonical full-length Tra2-beta-1 isoform and raise the noncanonical
    Tra2-beta-3 isoform, which starts downstream and lacks the N-terminal RS1
    domain. Tra2-beta is a sequence-specific splicing regulator that binds
    GAA-rich motifs in pre-mRNA; the bound molecular function is marked
    dysregulated because the binding-and-activating canonical protein is
    replaced by a shorter repressive form. RNA binding by Tra2-beta-3 was
    not measured.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
  genes:
  - preferred_term: TRA2B
    term:
      id: hgnc:10781
      label: TRA2B
  molecular_functions:
  - preferred_term: pre-mRNA binding
    modifier: DYSREGULATED
    term:
      id: GO:0036002
      label: pre-mRNA binding
  evidence:
  - reference: PMID:36549593
    reference_title: "Clustered variants in the 5' coding region of TRA2B cause a distinctive neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants clustered in the 5' part of TRA2B, upstream of an alternative translation start site responsible for the expression of the noncanonical Tra2β-3 isoform."
    explanation: The variant cluster sits upstream of the alternative start site.
  - reference: PMID:36549593
    reference_title: "Clustered variants in the 5' coding region of TRA2B cause a distinctive neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Experimental studies showed that these variants decreased the expression of the canonical Tra2β-1 isoform, whereas they increased the expression of the Tra2β-3 isoform, which is shorter and lacks the N-terminal RS1 domain."
    explanation: Patient-cell studies show the isoform switch.
  - reference: PMID:24586484
    reference_title: "Neuronal-specific deficiency of the splicing factor Tra2b causes apoptosis in neurogenic areas of the developing mouse brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "The splicing factor Tra2b (Sfrs10) can modulate splicing inclusion of exons by specifically detecting GAA-rich binding motifs and its absence causes early embryonic lethality in mice."
    explanation: Background on Tra2-beta as a sequence-specific pre-mRNA binding splicing regulator.
  downstream:
  - target: Disrupted Tra2-beta-Dependent Exon Inclusion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36549593
      reference_title: "Clustered variants in the 5' coding region of TRA2B cause a distinctive neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Increased expression of Tra2β-3-GFP were shown to interfere with the incorporation of CHEK1 exon 3 into its mature transcript, normally incorporated by Tra2β-1."
      explanation: Overexpressed Tra2-beta-3 interferes with a Tra2-beta-1-dependent splicing event in HEK-293 cells.
- name: Disrupted Tra2-beta-Dependent Exon Inclusion
  biological_scale: MOLECULAR
  description: >-
    Tra2-beta-3 interferes with inclusion of exons that canonical Tra2-beta-1
    normally promotes, shown for CHEK1 exon 3 in transfected HEK-293 cells.
    Which neural splicing targets are affected in patients is not known.

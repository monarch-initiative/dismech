name: Ramond-Elliott Neurodevelopmental Syndrome
creation_date: "2026-10-23T01:58:03Z"
category: Mendelian
parents:
- Mendelian neurodevelopmental disorder
synonyms:
- TRA2B-related neurodevelopmental syndrome
description: >-
  An autosomal dominant neurodevelopmental syndrome caused by heterozygous,
  mostly de novo, predicted loss-of-function variants in TRA2B, which encodes
  the sequence-specific splicing regulator Tra2-beta. The defining report
  described 12 individuals from 11 families; a second report added one child
  with a de novo splice-donor variant. All affected individuals have
  intellectual disability and/or developmental delay, frequently with
  infantile spasms or other seizures, microcephaly, brain anomalies, autism
  spectrum disorder, feeding difficulties and short stature. The variants
  cluster in the 5' coding region, upstream of an alternative translation
  start site. In patient cells they reduce the canonical Tra2-beta-1 isoform
  and raise the shorter Tra2-beta-3 isoform, which lacks the N-terminal RS1
  domain and represses inclusion of a Tra2-beta-1-dependent exon, so the
  proposed mechanism is dominant negative rather than simple haploinsufficiency.
  A neural-specific Tra2b knockout mouse dies at birth with apoptosis of
  cortical neural precursors. No disease-specific treatment exists.
references:
- reference: PMID:36549593
  title: "Clustered variants in the 5' coding region of TRA2B cause a distinctive neurodevelopmental syndrome."
- reference: PMID:37958557
  title: "TRA2B Gene Splice Variant Linked to Seizures and Neurodevelopmental Delay: A Second Case Study."
- reference: PMID:24586484
  title: "Neuronal-specific deficiency of the splicing factor Tra2b causes apoptosis in neurogenic areas of the developing mouse brain."

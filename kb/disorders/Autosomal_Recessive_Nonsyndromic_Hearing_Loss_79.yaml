- name: Progressive Stereocilia Retraction and Fusion
  description: >-
    Bundles that formed acceptably then deteriorate. Stereocilia are pruned and retract
    asynchronously, individual stereocilia are missing from the first and third rows, the
    outer hair cell V shape is distorted, and inner hair cell stereocilia fuse. Scanning
    electron microscopy in one knockout line traces the inner hair cell course from
    apparently normal at postnatal day 3 to scattered absence at day 15 and substantial loss
    by day 30; a second line reports outer hair cell degeneration from day 30. The two
    published lines disagree about which cell type leads, and both should be read as
    describing a progressive loss rather than a fixed pattern.

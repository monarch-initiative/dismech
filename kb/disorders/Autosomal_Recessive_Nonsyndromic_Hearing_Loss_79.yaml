name: Autosomal Recessive Nonsyndromic Hearing Loss 79
category: Mendelian
creation_date: "2026-09-01T00:00:00Z"
synonyms:
- DFNB79
- autosomal recessive nonsyndromic deafness 79
- autosomal recessive nonsyndromic deafness type 79
- deafness, autosomal recessive 79
- deafness, autosomal recessive type 79
- autosomal recessive deafness 79
- autosomal recessive nonsyndromic deafness caused by mutation in TPRN
- TPRN autosomal recessive nonsyndromic deafness
description: >-
  DFNB79 is autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic
  truncating variants in TPRN, which encodes taperin. Every human allele reported so far is
  a frameshift or nonsense change in the first coding exon, so the disease is studied
  entirely through protein loss rather than through a graded allelic series.

  Taperin sits at the taper: the narrowed base of the hair cell stereocilium, where the
  rod pivots against the cuticular plate when sound deflects it. That address was how the
  protein got its name, and it puts DFNB79 in the same structural compartment as the CLIC5
  disease already curated here (DFNB103) - the two proteins are physical partners, and
  super-resolution imaging shows TPRN, CLIC5 and PTPRQ arranged as concentric rings around
  the actin core at the taper.

  What taperin does there took fifteen years to establish. It is an F-actin bundler. Its
  N-terminal region cross-links actin filaments into bundles that are notably bendable
  rather than rigid, which is the property a pivot point needs, and it binds the membrane
  receptor PTPRQ, tying the actin core to the overlying plasma membrane. Losing it does not
  stop stereocilia being built. Bundles form, and then come apart: rootlets warp, TRIOBP-5
  and ANKRD24 disappear from the rootlets of the shortest row, stereocilia are pruned,
  retract asynchronously and fuse, and inner hair cells later accumulate abnormal
  endosome-like vesicles and acquire efferent contacts on the cell body that normally exist
  only in immature or damaged cochleae. This is a maintenance disease, not a morphogenesis
  disease.

  Two features separate DFNB79 from its taper-region neighbour DFNB103, and both are
  negative findings that should not be overwritten by analogy. First, the vestibular system
  is spared: Tprn-null mice have no circling or head bobbing and no significant vestibular
  evoked potential deficit through two months, and the affected children in whom balance
  was formally tested had normal Romberg and tandem gait. CLIC5 loss, by contrast, causes
  vestibular areflexia in patients and florid circling in mice. Second, the human hearing
  phenotype is inconsistent in a way that is not explained by allele. The same
  c.42_52del11 null allele produced stable severe hearing loss into the third decade in a
  Moroccan family, severe-to-profound loss in one Pakistani family, and progressive loss in
  another; the authors who found the discordance proposed a genetic modifier and nobody has
  mapped it.

  Gene replacement is a live preclinical prospect and a dosage problem at the same time.
  AAV delivery of Tprn at an appropriate level restores the rings and rescues hearing in
  Tprn knockout mice - but overexpressing taperin is itself pathogenic, causing excessive
  actin bundling, extra stereocilia rows, over-elongation and degeneration. Too little and
  too much both destroy the bundle, which is an unusual constraint for a recessive
  loss-of-function disease and the central practical question this entry records.

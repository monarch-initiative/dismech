phenotypes:
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Bilateral sensorineural hearing loss whose course differs between families carrying the
    same null allele. The Dutch family carrying c.1347delG has rapidly progressive loss; one
    Pakistani family homozygous for c.42_52del11 progressed from moderate at ages 7 to 9 to
    moderate-to-profound by 13 to 17, with the high frequencies deteriorating faster than
    the low ones; a Moroccan family with the identical allele had severe loss that was
    stable into the third decade. Progression should therefore be expected but cannot be
    predicted from the genotype.

    Bound to HP:0008619 rather than HP:0001730 so the record carries laterality as well as
    course: the loss is bilateral in every reported family, and `clinical_course: PROGRESSIVE`
    supplies the progression the plainer term would otherwise have to carry alone. Severity is
    deliberately not set here, because it is the moving quantity - the point of the record is
    that where a given family ends up is not predictable.
  phenotype_term:
    preferred_term: Progressive bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20170898
    reference_title: "Mutations in TPRN cause a progressive form of autosomal-recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified another family with progressive ARNSHL linked to this locus, whose affected members were shown to carry a causative 1 bp deletion (c.1347delG) in exon 1 of TPRN."
    explanation: The family in which progression was first documented, and its allele.
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current audiograms of the two affected individuals revealed moderate to profound hearing loss"
    explanation: >-
      The audiometric endpoint in the progressive Pakistani family, against the moderate
      loss the same two children had at school entry.
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is interesting to note that the loss in hearing is quite similar at low frequencies, and dramatic shifts of 20-30 dB are observed between the siblings at frequencies of 2-4 KHz."
    explanation: >-
      The frequency asymmetry of the progression, high frequencies moving faster, which
      matches the mouse course.
- name: Prelingual Severe to Profound Hearing Impairment
  category: Auditory
  description: >-
    The presentation in the founding Pakistani pedigree and in the Moroccan family: hearing
    loss present before speech acquisition, severe to profound, and in the Moroccan family
    stable rather than deteriorating. This is the other pole of the same disease, and it is
    the reason DFNB79 cannot be summarised as a purely postlingual progressive entity.
    `severity: SEVERE` follows the reported audiometric range in these families, severe to
    profound; some individuals reach the profound end and the enum has no value spanning
    both.
  phenotype_term:
    preferred_term: Prelingual sensorineural hearing impairment
    term:
      id: HP:0000399
      label: Prelingual sensorineural hearing impairment
    severity: SEVERE
  evidence:
  - reference: PMID:19603065
    reference_title: "DFNB79: reincarnation of a nonsyndromic deafness locus on chromosome 9q34.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of an inbred Pakistani family PKDF280, segregating prelingual severe to profound sensorineural hearing loss, provided evidence for a DFNB locus on human chromosome 9q34.3."
    explanation: The phenotype of the pedigree the locus was named for.
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same mutation was identified in members of a large Moroccan family suffering a severe degree of hearing loss, which is stable in the third decade of life"
    explanation: >-
      The stable severe presentation on the same allele that elsewhere progresses, which is
      why both phenotype records are curated rather than one.
- name: Normal Vestibular Function
  category: Vestibular
  frequency: EXCLUDED
  description: >-
    Balance is spared, and this is a positive finding rather than an absence of enquiry.
    Romberg and tandem gait testing were normal in the affected children of the progressive
    Pakistani family, and quantitative vestibular sensory evoked potentials in Tprn-null
    mice show no significant difference from wild-type littermates at postnatal day 30 or
    60, with no circling or head bobbing at any age.

    Recorded explicitly because the neighbouring taper-region disease behaves differently:
    DFNB103 (CLIC5) presents with vestibular areflexia in patients and florid circling in
    mice. Two proteins in the same rings, and only one of them is needed for vestibular hair
    cells.

    `frequency: EXCLUDED` carries the absence, because that is what the HPOA exporter reads
    to emit a NOT-qualified row; `modifier: ABSENT` alone documents intent and is not
    consulted. Neither slot is a prevalence claim, and none is made here - three children
    with bedside tests is not a denominator, and the mouse data cannot supply one for
    humans.
  phenotype_term:
    preferred_term: Normal vestibular function
    term:
      id: HP:0001751
      label: Abnormal vestibular function
    modifier: ABSENT
  evidence:
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tandem walking was normal, and the Romberg test was also negative among affected children, suggesting normal vestibular function."
    explanation: >-
      The only formal human vestibular assessment in a reported DFNB79 family, and its
      result.
  - reference: PMID:40471101
    reference_title: "Taperin bundles F-actin at stereocilia pivot points enabling optimal lifelong mechanosensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Thus, TPRN is necessary for auditory hair cell function and, at least in the first few months of life, is not necessary for vestibular hair cell function."
    explanation: >-
      The mouse counterpart, quantitative rather than bedside. Indirect with respect to the
      human claim because it is a different species, and the authors themselves limit it to
      the first few months of life.
genetic:
- name: TPRN
  notes: >-
    TPRN, previously C9orf75, lies at 9q34.3 and encodes taperin, a vertebrate-specific
    protein named for where it sits rather than for what it does. Its N-terminal region
    cross-links F-actin; a C-terminal region carries a nuclear localisation signal, and the
    protein docks the alpha isoform of protein phosphatase 1 through a classic RVxF motif,
    suppressing the phosphatase's general activity. Steady-state localisation in
    non-sensory cells is predominantly nuclear, and taperin is recruited to sites of DNA
    damage in complex with Ku70, Ku80, PARP and topoisomerases. None of that nuclear biology
    has been connected to deafness, and it is recorded here because it is the reason a
    taperin-directed therapy cannot be assumed to be inner-ear-specific.

    Taperin shares an ancestral relationship with phostensin, a cytosolic actin-binding PP1
    partner, which was the basis for the original guess - made when the gene was found and
    before any activity was measured - that it would turn out to have a role in actin
    dynamics.

    Penetrance has not been formally estimated. Every reported homozygote in every family is
    affected and no unaffected homozygote has been described - but the pedigrees were
    ascertained through deafness, which is the ascertainment that makes complete penetrance
    look inevitable whether or not it is. Heterozygotes are consistently unaffected, in
    families and in mice.

    Dosage runs in both directions. Overexpressing taperin in wild-type hair cells causes
    excessive actin bundling, extra stereocilia rows, over-elongation and degeneration, and
    reducing taperin expression rescues the stereocilia defects and partially restores
    hearing in Grxcr2-null mice, whose primary lesion is failure to keep taperin restricted
    to the stereocilia base. Taperin is therefore a protein whose level, not merely whose
    presence, is the phenotype-determining variable.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TPRN
    term:
      id: hgnc:26894
      label: TPRN
  evidence:
  - reference: PMID:20170899
    reference_title: "Targeted capture and next-generation sequencing identifies C9orf75, encoding taperin, as the mutated gene in nonsyndromic deafness DFNB79."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although TPRN is expressed in many tissues, immunolocalization of the protein product in the mouse cochlea shows prominent expression in the taper region of hair cell stereocilia. Consequently, we named the protein taperin."
    explanation: >-
      The localisation that gave the protein its name, and the observation that expression
      is not restricted to the ear.
  - reference: PMID:23213405
    reference_title: "Taperin (c9orf75), a mutated gene in nonsyndromic deafness, encodes a vertebrate specific, nuclear localized protein phosphatase one alpha (PP1alpha) docking protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taperin associates with PP1 through a classic 'RVxF' motif and suppresses the general phosphatase activity of the enzyme."
    explanation: >-
      The biochemical activity outside the ear, which is the basis for the caution about
      systemic effects of any taperin-directed intervention.
  - reference: PMID:23213405
    reference_title: "Taperin (c9orf75), a mutated gene in nonsyndromic deafness, encodes a vertebrate specific, nuclear localized protein phosphatase one alpha (PP1alpha) docking protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taperin also shares an ancestral relationship with the cytosolic actin binding protein phostensin, another PP1 interacting partner."
    explanation: >-
      The homology that predicted the actin function years before it was demonstrated
      biochemically.
  - reference: PMID:35752427
    reference_title: "Reducing Taperin Expression Restores Hearing in Grxcr2 Mutant Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Functional analysis further confirmed that reducing taperin expression partially restored hearing in Grxcr2 null mice."
    explanation: >-
      Evidence that taperin level is itself a determinant of hearing. Indirect with respect
      to DFNB79, because the experiment lowers taperin in a different mutant background
      rather than testing a TPRN genotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    DFNB79 has been reported in a small number of families - four Pakistani pedigrees linked
    to the locus, a Moroccan family and a Dutch family in the founding reports, and single
    additional families since. No population prevalence estimate exists and no
    rate_per_100000 is recorded, because none has been published; ULTRA_RARE is the
    qualitative band rather than a numeric conversion.
  evidence:
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DFNB79 locus harbors TPRN mutations in which have been reported in a few families with deafness."
    explanation: The size of the reported literature, in the authors' own words.
- population: Consanguineous Pakistani families and sporadic cases with moderate to severe hearing loss
  measure_type: UNKNOWN
  notes: >-
    A targeted screen of 50 consanguineous multiplex families and 57 sporadic cases from
    Pakistan found no further DFNB79-linked family and no case homozygous for markers
    spanning TPRN. That is a negative diagnostic yield in an ascertained cohort, not a
    population rate, so no prevalence_class or rate_per_100000 is recorded; putting a
    numeric band here would assert an occurrence estimate the study does not make. The
    ascertainment also selected for moderate-to-severe rather than progressive loss, which
    the authors identify as the limitation on what the negative result means.
  evidence:
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that TPRN is not a significant contributor to moderate to severe hearing loss in the Pakistani population, although its contribution to progressive hearing loss remains to be determined."
    explanation: >-
      The negative screen and the authors' own statement of what it does and does not
      exclude.
progression:
- phase: Onset
  age_range: prelingual to about 2 years
  notes: >-
    Onset is early. In the progressive Pakistani family the parents noticed the loss by age
    2; in the founding pedigree and the Moroccan family the loss was prelingual. A newborn
    hearing screen has not been reported as passed or failed in any DFNB79 family, so this
    entry does not state whether the disease is detectable at birth.
  evidence:
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to the parents, the onset of hearing loss was noticed by 2 years of age."
    explanation: The reported age of recognition in the family with the best-documented history.
- phase: Deterioration or stability
  age_range: childhood to third decade
  notes: >-
    Where the disease progresses it does so through childhood and adolescence, faster at
    high frequencies. Where it does not, the loss reported in the Moroccan family remained
    stable into the third decade. Which course a given family follows is not predictable
    from the TPRN allele, and serial audiometry is the only way to tell them apart.
  evidence:
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that hearing at high frequencies worsens rapidly, while loss of hearing at lower frequencies may be more gradual."
    explanation: The frequency-dependent shape of the progression where it occurs.
diagnosis:
- name: TPRN sequencing on recessive nonsyndromic hearing loss panels
  description: >-
    DFNB79 is reached by exome sequencing or a deafness panel containing TPRN, after GJB2
    has been excluded. Because every reported allele lies in exon 1, sequencing that exon
    alone was proposed as a cheap first pass in recessive nonsyndromic hearing loss,
    particularly where there are signs of progression. Vestibular testing does not
    discriminate - it is normal in DFNB79 - so a progressive recessive loss with normal
    balance is the clinical shape that should prompt the test, and vestibular involvement
    argues for a different taper-region gene.
  evidence:
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of this exon may be considered in recessively inherited cases of nonsyndromic hearing loss, especially if signs of progression are present"
    explanation: The explicit testing recommendation and the clinical trigger for it.
treatments:
- name: Genetic Counselling with Serial Audiometry
  description: >-
    Counselling for a recessive condition with a 25 percent sibling recurrence risk, and
    repeated rather than single audiometric assessment. Serial testing is the substantive
    part: the same TPRN allele produces a stable loss in one family and a progressive one in
    another, so a single audiogram establishes the current threshold and nothing about the
    trajectory. Where progression occurs it is faster at high frequencies, which is where
    the follow-up should be looking.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus the same mutation of TPRN can be associated with different thresholds of hearing as well as differences in the stability of the phenotype."
    explanation: >-
      The reason a single assessment is insufficient: the genotype does not fix either the
      threshold or the trajectory.
  notes: >-
    No target_mechanisms link is recorded on this treatment. Counselling and surveillance do
    not act on a pathograph node at all, and no TreatmentEffectEnum value describes them -
    INHIBITS, ACTIVATES, MODULATES, BYPASSES and RESTORES are all claims about changing a
    mechanism, and measuring one is none of those. Asserting the least-wrong value would put
    a false mechanistic claim in a machine-readable slot; the two device treatments below
    carry the section's join points into the graph instead.

    AAV gene replacement is not curated as a treatment: the work is preclinical and is
    recorded under animal_models, where the dosage constraint can be stated beside it.
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    The standard intervention for severe-to-profound sensorineural hearing loss, and the
    mechanism here argues for it directly. The DFNB79 lesion is inside the hair cell
    stereocilium: the bundle fails, and the hair cell can no longer convert sound into a
    receptor potential. An implant stimulates the spiral ganglion electrically and does not
    need a working bundle, so it operates downstream of everything this entry's pathograph
    describes.

    One caveat belongs beside that argument rather than after it. Tprn-null mice develop
    inner hair cell synaptic and vesicular abnormalities and acquire efferent contacts on the
    cell body, and the same study raises the possibility of a direct role for taperin in
    vesicular trafficking rather than a purely secondary consequence of losing transduction.
    If that turns out to be true in patients, the neural side of the pathway is not entirely
    spared and implant outcome would be less predictable than the bundle-lesion argument
    implies. Nobody has looked.
  target_mechanisms:
  - target: Progressive Stereocilia Retraction and Fusion
    treatment_effect: BYPASSES
    description: >-
      Electrical stimulation of the spiral ganglion substitutes for the transduction current
      a fused or retracted bundle can no longer generate, so the implant works downstream of
      the node that fails.
  notes: >-
    Carries no evidence item deliberately. No DFNB79 patient has a reported implantation
    outcome - the published literature is a handful of families, and the one report that
    mentions devices at all says none of the affected children wore hearing aids. The
    mechanistic argument above is this entry's inference from the site of the lesion and is
    labelled as such; quoting the general cochlear-implant literature here would attach
    evidence about a different population to a claim about this disease. Follows the pattern
    used in Autosomal_Recessive_Nonsyndromic_Hearing_Loss_97.
- name: Hearing Amplification
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  description: >-
    Amplification is the first-line intervention while useful residual hearing remains, which
    in DFNB79 is most of childhood in the families whose loss begins mild or moderate. Unlike
    an implant it does not bypass the lesion - it raises the stimulus reaching a bundle that
    still partly works - so its useful life is bounded by how fast the loss progresses, and
    that rate is not predictable from the genotype.
  target_mechanisms:
  - target: Progressive Sensorineural Hearing Impairment
    description: >-
      Compensates for the threshold loss by raising the sound pressure reaching a bundle that
      is degenerating but not yet lost. It does not act on the taper defect or slow the
      stereocilia degeneration driving it, which is why no treatment_effect value is
      recorded - the enum's values all assert a change to the mechanism, and amplification
      makes no such claim.
  notes: >-
    Carries no evidence item deliberately, for the same reason as the implantation record. The
    only DFNB79 report that mentions devices states that none of the affected individuals in
    that family wore hearing aids, which is a description of what happened in one Pakistani
    village rather than evidence about efficacy, and it is not quoted here as though it were
    either.
animal_models:
- name: Tprn TALEN knockout mouse
  species: Mouse
  genotype: Tprn -/-, 11 bp deletion at nucleotides 177-187 of exon 1
  publication: PMID:27693694
  description: >-
    The first taperin knockout, made with TALENs and carrying an 11 bp exon 1 deletion of
    the same class as the human founding allele. Homozygotes have progressive sensorineural
    hearing loss on click and tone-burst auditory brainstem response at postnatal days 15,
    30 and 60; heterozygotes are indistinguishable from wild type, which matches the
    recessive human inheritance. Hair cell counts are preserved on phalloidin labelling
    while the stereocilia themselves degenerate, so the model separates bundle failure from
    cell death.
  genes:
  - preferred_term: TPRN
    term:
      id: hgnc:26894
      label: TPRN
  modeled_mechanisms:
  - target: Progressive Stereocilia Retraction and Fusion
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The structural lesion, from a normal starting point. Bundles are unremarkable at
      postnatal day 3 and then deteriorate, which is the sequence the human progressive
      phenotype implies but which no patient material shows.
    limitations: >-
      The mouse course runs over weeks where the human one runs over years, and this line
      reports inner hair cell stereocilia leading with outer hair cells much less severely
      affected, which is the opposite emphasis to the CRISPR null line. The disagreement is
      unresolved, so neither line should be treated as fixing which cell type fails first in
      patients. The allele is a protein-null; whether human truncating alleles in exon 1
      behave identically has not been shown at the protein level in patients.
    readouts:
    - name: Inner hair cell stereocilia by scanning electron microscopy
      target: Progressive Stereocilia Retraction and Fusion
      direction: DECREASED
      interpretation: >-
        Stereocilia are progressively lost from normal-appearing bundles between postnatal
        days 3 and 30.
      evidence:
      - reference: PMID:27693694
        reference_title: "Progressive hearing loss and degeneration of hair cell stereocilia in taperin gene knockout mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "scanning electronic microscopy revealed progressive degeneration of inner hair cell stereocilia, from apparently normal at postnatal days 3 (P3) to scattered absence at P15 and further to substantial loss at P30"
        explanation: The structural measurement and its time course.
    - name: Auditory brainstem response threshold
      target: Progressive Stereocilia Retraction and Fusion
      direction: INCREASED
      interpretation: >-
        Thresholds rise across postnatal days 15, 30 and 60 - hearing gets worse, so the
        threshold value goes up.
      evidence:
      - reference: PMID:27693694
        reference_title: "Progressive hearing loss and degeneration of hair cell stereocilia in taperin gene knockout mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Homozygous TPRN-/- mice exhibited progressive sensorineural hearing loss as reflected by auditory brainstem response to both click and tone burst stimuli at postnatal days 15 (P15), 30 (P30), and 60 (P60)."
        explanation: The functional measurement behind this readout and the ages tested.
    evidence:
    - reference: PMID:27693694
      reference_title: "Progressive hearing loss and degeneration of hair cell stereocilia in taperin gene knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous TPRN+/- mice showed apparently normal auditory phenotypes to their wide-type (WT) littermates."
      explanation: >-
        The recessive behaviour of the mouse allele, which is what makes the line
        informative for a recessive human disease rather than for a dominant one.
- name: Tprn CRISPR-null mouse on CBA/CaJ
  species: Mouse
  genotype: Tprn-null, CRISPR/Cas9-generated, CBA/CaJ background
  publication: PMID:30159668
  description: >-
    An independent null on a background without the age-related hearing loss confounder that
    complicates other strains. This is the line in which the rootlet lesion was described:
    curved rootlet shafts, hollow central cores with loose peripheral dense rings, dispersal
    of radixin along the stereocilia shafts, and reduced radixin and beta-actin levels.
    Outer hair cell stereocilia degenerate from postnatal day 30.
  genes:
  - preferred_term: TPRN
    term:
      id: hgnc:26894
      label: TPRN
  modeled_mechanisms:
  - target: Stereociliary Rootlet Destabilization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Where the rootlet claim comes from. Rootlet ultrastructure cannot be examined in
      living patients, so this is not corroboration of a human finding; it is the experiment
      in which the lesion was defined.
    limitations: >-
      The rootlet abnormalities were described qualitatively from transmission electron
      micrographs rather than quantified, and the radixin and beta-actin reductions are
      whole-cochlea measurements that cannot localise the loss to the taper. The line
      reports outer hair cells degenerating first, which the TALEN line does not.
    readouts:
    - name: Rootlet ultrastructure by transmission electron microscopy
      target: Stereociliary Rootlet Destabilization
      direction: ALTERED
      interpretation: >-
        Rootlets are present but malformed - curved shafts, hollow cores, loose peripheral
        rings - so the defect is in maintaining the structure rather than in building it.
      evidence:
      - reference: PMID:30159668
        reference_title: "Tprn is essential for the integrity of stereociliary rootlet in cochlear hair cells in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Transmission electron microscopy images of stereociliary bundles in the mutant mice showed some stereociliary rootlets with curved shafts. The central cores of the stereociliary rootlets possessed hollow structures with surrounding loose peripheral dense rings."
        explanation: The ultrastructural measurement behind this readout.
    - name: Radixin distribution along stereocilia
      target: Stereociliary Rootlet Destabilization
      direction: ALTERED
      interpretation: >-
        Radixin leaves the taper and spreads along the shaft, which is the partner-protein
        signature of a failed taper complex.
      evidence:
      - reference: PMID:30159668
        reference_title: "Tprn is essential for the integrity of stereociliary rootlet in cochlear hair cells in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Radixin, a protein expressed at stereocilia tapering, was abnormally dispersed along the stereocilia shafts in Tprn-null mice."
        explanation: The immunolocalisation measurement behind this readout.
    evidence:
    - reference: PMID:30159668
      reference_title: "Tprn is essential for the integrity of stereociliary rootlet in cochlear hair cells in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The generated Tprn-null mice are ideal models of human hereditary deafness DFNB79."
      explanation: >-
        The authors' own claim for the line's relevance. Recorded as their assessment rather
        than endorsed - the limitations above are the reasons this entry does not repeat the
        word "ideal".
- name: Tprn knockout mouse treated with AAV-Tprn
  species: Mouse
  genotype: Tprn knockout treated with promoter-driven recombinant AAV carrying Tprn
  publication: PMID:37952086
  description: >-
    A gene-replacement experiment whose result cuts two ways. Delivering Tprn by AAV at an
    appropriate level restores the concentric rings at the taper and repairs hearing in Tprn
    knockout mice. In the same study, overexpressing taperin is one of the two manipulations
    used to break the rings deliberately - the other being competitive inhibition of the
    taperin-CLIC5 interaction - and it produces stereocilia degeneration and severe hearing
    loss on its own.
  genes:
  - preferred_term: TPRN
    term:
      id: hgnc:26894
      label: TPRN
  modeled_mechanisms:
  - target: Loss of F-Actin Bundling at the Stereocilia Taper
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The forward test of the mechanism: restoring the protein restores the structure and
      the function. That is a stronger argument for the ring being the operative unit than
      any correlation between its absence and the phenotype.
    limitations: >-
      Rescue is conditional on dose. The same paper uses taperin overexpression as a tool to
      destroy the rings, so the therapeutic window is bounded above as well as below, and no
      dose-response curve mapping that window has been published. The experiment is also a
      mouse cochlea injected under laboratory conditions; nothing here addresses the age at
      which a patient with an already-degenerated bundle could be treated, and the human
      onset is prelingual or early childhood in every reported family.
    readouts:
    - name: Auditory function after AAV-Tprn delivery
      target: Loss of F-Actin Bundling at the Stereocilia Taper
      direction: RESTORED
      interpretation: >-
        Hearing is repaired when the rings are restored, tying the auditory outcome to the
        structure rather than to the presence of the protein anywhere in the cell.
      evidence:
      - reference: PMID:37952086
        reference_title: "Critical role of TPRN rings in the stereocilia for hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "restoration of the TPRN rings can rescue the damaged auditory function of Tprn knockout mice by exogenously expressing TPRN at an appropriate level in HCs via promoter recombinant adeno-associated virus (AAV)"
        explanation: >-
          The rescue measurement, including the authors' own qualifier "at an appropriate
          level", which is the dosage constraint this model is curated to record.
    evidence:
    - reference: PMID:37952086
      reference_title: "Critical role of TPRN rings in the stereocilia for hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "TPRN ring restoration in stereocilia by AAV-Tprn effectively repairs damaged hearing, which lays the foundation for the clinical application of AAV-mediated gene therapy in patients with TPRN mutation."
      explanation: >-
        The authors' statement of translational intent, recorded as their claim. The
        overexpression toxicity documented in the same study is why this entry treats it as
        a foundation rather than a plan.
discussions:
- discussion_id: tprn_dosage_window_for_gene_replacement
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    AAV delivery of Tprn repairs hearing in taperin-null mice, but taperin overexpression is
    itself used as a tool to destroy the stereocilia rings and causes deafness. Is there a
    dose of taperin that is therapeutic in a human cochlea, and how would anyone know they
    were inside it?
  attaches_to:
  - animal_models#Tprn knockout mouse treated with AAV-Tprn
  - pathophysiology#Loss of F-Actin Bundling at the Stereocilia Taper
  - genetic#TPRN
  rationale: >-
    Most recessive loss-of-function diseases have a one-sided dosage problem: more protein
    is better up to normal, and the engineering question is how to deliver enough. Taperin
    is not like that. In the same study that reports the AAV rescue, exogenous taperin
    overexpression is one of the two deliberate methods used to disrupt the rings, and it
    produces stereocilia degeneration and severe hearing loss. An independent group reports
    the same in wild-type hair cells: excessive F-actin bundling, extra rows, over-elongated
    and degenerating stereocilia. And from the opposite direction, lowering taperin rescues
    a different mutant - Grxcr2-null mice, whose lesion is failure to keep taperin confined
    to the base - which is only coherent if the pathogenic quantity is taperin activity in
    the wrong place or the wrong amount rather than its absence.

    The rescue was reported as expression "at an appropriate level", which is the honest
    description of an experiment in which the level was achievable and not of one in which
    the window was measured. No dose-response curve bounding it has been published, and AAV
    transduction of a cochlea is not uniform: the same injection gives different copy
    numbers in different cells along the cochlear duct, so a dose that is therapeutic at the
    apex may be toxic at the base. In a disease where too much protein is a known cause of
    the same lesion, that heterogeneity is not a delivery inconvenience, it is the safety
    question.

    Two further mismatches sit underneath. Human onset is prelingual or by about age 2 in
    every reported family, so a patient's bundles have already deteriorated before a
    diagnosis exists, while the mouse experiments target a cochlea that is still developing.
    And taperin is expressed in many tissues and is a nuclear PP1-docking protein recruited
    to sites of DNA damage; a systemically delivered vector raises questions the cochlear
    experiments do not address.
  evidence:
  - reference: PMID:37952086
    reference_title: "Critical role of TPRN rings in the stereocilia for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The disruption of TPRN rings, triggered by the competitive inhibition of the interaction of TPRN and CLIC5 or exogenous TPRN overexpression, leads to stereocilia degeneration and severe hearing loss."
    explanation: >-
      Overexpression used as a method of causing the disease phenotype, in the same paper
      that reports the rescue.
  - reference: PMID:37952086
    reference_title: "Critical role of TPRN rings in the stereocilia for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "restoration of the TPRN rings can rescue the damaged auditory function of Tprn knockout mice by exogenously expressing TPRN at an appropriate level in HCs via promoter recombinant adeno-associated virus (AAV)"
    explanation: >-
      The rescue, with the dosage qualifier the authors attach to it and no published bound
      on what "appropriate" means.
  - reference: PMID:40471101
    reference_title: "Taperin bundles F-actin at stereocilia pivot points enabling optimal lifelong mechanosensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, TPRN overexpression causes excessive F-actin bundling, extra rows, and over-elongation of stereocilia during development."
    explanation: >-
      Independent replication of the overexpression toxicity, in a different laboratory and
      with a different construct.
  - reference: PMID:35752427
    reference_title: "Reducing Taperin Expression Restores Hearing in Grxcr2 Mutant Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Reducing the expression of taperin, a protein that interacts with GRXCR2 at the base of stereocilia, corrects the morphological defects of stereocilia and restores hearing in Grxcr2 null mice."
    explanation: >-
      The other end of the dosage argument: lowering taperin is therapeutic in a different
      genotype. Indirect with respect to DFNB79 because the background is a Grxcr2 null, not
      a TPRN one.
  proposed_experiments:
  - experiment_id: exp_dfnb79_aav_tprn_dose_response
    name: Dose-response and cochlear-position mapping of AAV-Tprn rescue
    description: >-
      Deliver AAV-Tprn to Tprn-null mice across at least five vector doses spanning two
      orders of magnitude, and at two ages - one before and one after the stereocilia lesion
      is established - with auditory brainstem response and distortion product otoacoustic
      emissions as function, scanning electron microscopy of bundle morphology, and
      single-cell quantification of taperin immunofluorescence and vector genome copy number
      at apical, middle and basal positions. Include wild-type animals at the top doses to
      separate overexpression toxicity from incomplete rescue of the null.
    would_support:
    - pathophysiology#Loss of F-Actin Bundling at the Stereocilia Taper
    supporting_outcome:
    - >-
      A reproducible dose band exists in which hearing is restored at every cochlear
      position without inducing the over-elongation phenotype, and per-cell taperin levels
      inside that band cluster around the wild-type level, which would make an expression
      target rather than a vector dose the thing a clinical protocol has to hit.
    would_refute:
    - pathophysiology#Loss of F-Actin Bundling at the Stereocilia Taper
    refuting_outcome:
    - >-
      No dose rescues the base without over-elongating the apex, because the per-cell
      expression distribution from a single injection is wider than the therapeutic window,
      which would mean unregulated AAV replacement is the wrong modality for this gene
      regardless of vector improvements.
- discussion_id: tprn_identical_allele_discordant_progression
  kind: KNOWLEDGE_GAP
  prompt: >-
    The same c.42_52del11 null allele produces stable severe hearing loss into the third
    decade in one family and progressive loss in another. What determines whether DFNB79
    progresses?
  attaches_to:
  - phenotypes#Progressive Sensorineural Hearing Impairment
  - phenotypes#Prelingual Severe to Profound Hearing Impairment
  - genetic#TPRN
  rationale: >-
    This is not the ordinary observation that a rare disease is clinically variable. The
    allele is the same 11 bp deletion in exon 1, it is homozygous in both settings, and it
    is almost certainly a complete null - so the usual explanation for variable expressivity
    in a recessive disease, residual protein differing between genotypes, is unavailable
    here. The authors who found the discordance said so plainly and proposed a genetic
    modifier.

    Nobody has looked for it. In the fifteen years since, DFNB79 has been reported in only a
    handful of families, and no study has assembled enough homozygotes for the same allele
    to run a modifier search. That is a real obstacle rather than an oversight: modifier
    mapping needs numbers this disease does not have in any single population.

    The question is worth keeping open because the answer would be actionable in a way the
    diagnosis currently is not. A family told that their child is homozygous for
    c.42_52del11 cannot be told whether the loss will stay where it is or progress to
    profound, which is exactly the information that determines when to consider
    implantation and how often to re-test. It also bears on the mechanism: something that
    modifies the rate of a rootlet-maintenance failure is a candidate for the same
    protective role in commoner acquired progressive hearing loss.

    The obvious first candidates are the other taper-region proteins the pathophysiology
    section already names - CLIC5, PTPRQ, TRIOBP, ANKRD24, GRXCR2 - since taperin's function
    is defined by that complex and GRXCR2 dosage is already known to change what taperin
    does. Testing them requires only sequencing existing DFNB79 families, not new
    recruitment.
  evidence:
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to the previously reported individuals affected by the same mutation, hearing loss is likely to be progressive in this family."
    explanation: The discordance itself, on an identical genotype.
  - reference: PMID:23340767
    reference_title: "The c.42_52del11 mutation in TPRN and progressive hearing loss in a family from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.42_52del11 is most likely to be a null mutation. Therefore, its involvement in progressive hearing loss in a family from Pakistan and in stable hearing loss phenotype in another Pakistani and a Moroccan family strongly suggests the presence of a genetic modifier."
    explanation: >-
      The authors' own reasoning, including the step this gap depends on: a null allele
      leaves no room for a residual-function explanation.
  - reference: PMID:30380417
    reference_title: "GRXCR2 Regulates Taperin Localization Critical for Stereocilia Morphology and Hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We show that taperin and GRXCR2 form a complex and that taperin is diffused throughout the stereocilia length in Grxcr2-deficient hair cells."
    explanation: >-
      Why GRXCR2 is a named candidate modifier rather than a generic suggestion: it already
      determines where taperin is. Indirect because no human DFNB79 family has been
      genotyped at GRXCR2.
  proposed_experiments:
  - experiment_id: exp_dfnb79_taper_complex_modifier_screen
    name: Targeted sequencing of taper-complex genes in discordant DFNB79 homozygotes
    description: >-
      Sequence CLIC5, PTPRQ, TRIOBP, ANKRD24, GRXCR2, RDX and MYO6 in all available
      individuals homozygous for TPRN c.42_52del11 from the Moroccan and both Pakistani
      families, together with serial audiograms defining each individual as progressive or
      stable, and test whether any variant or haplotype in these genes segregates with the
      progressive course across families rather than within one of them.
    would_support:
    - phenotypes#Progressive Sensorineural Hearing Impairment
    supporting_outcome:
    - >-
      A variant in one of the taper-complex genes tracks with progression across families
      carrying the same TPRN null, which would give the counselling answer and would
      identify the complex as the site of the rate-limiting step.
    would_refute:
    - phenotypes#Progressive Sensorineural Hearing Impairment
    refuting_outcome:
    - >-
      No taper-complex variant distinguishes progressive from stable individuals, which
      would move the search to genome-wide modifiers or to non-genetic determinants such as
      noise exposure history, and would mean the complex hypothesis had been tested rather
      than left as a plausible guess.

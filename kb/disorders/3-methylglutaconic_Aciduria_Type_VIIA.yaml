  rationale: >-
    Both are caused by heterozygous CLPB missense variants that inhibit
    wild-type CLPB dominant-negatively, and the arginine finger R561 is mutated
    in both. The distinction rests partly on 3-methylglutaconic aciduria, which
    was not measured in about half of the published neutropenia cases. A
    variant-level comparison of residual disaggregase activity against
    neurological outcome would test whether the two are a continuum.

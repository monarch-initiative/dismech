    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Using Gene Ontology (GO) analysis for cellular component, we found that proteins in the inner mitochondrial membrane and intermembrane space were enriched in the insoluble fraction in the absence of Skd3"
    explanation: >-
      Complete CLPB knockout cells accumulate insoluble intermembrane-space
      proteins; the dominant-negative variants are expected to act through the
      same loss of activity.
  downstream:

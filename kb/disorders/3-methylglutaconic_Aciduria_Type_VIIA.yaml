inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous CLPB missense variant is sufficient. All affected
    individuals reported to date carry a de novo variant, so no vertical
    transmission has been observed; offspring of an affected individual would
    have a 50% risk.
  evidence:
  - reference: PMID:27891836
    reference_title: CLPB Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CLPB deficiency associated with specific heterozygous CLPB pathogenic variants is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the dominant mode of inheritance for the monoallelic form.
  - reference: PMID:27891836
    reference_title: CLPB Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "All individuals reported to date with autosomal dominant CLPB deficiency have the disorder as the result of a de novo CLPB pathogenic variant. Each child of an individual with a heterozygous CLPB pathogenic variant has a 50% chance of inheriting the pathogenic variant."
    explanation: All reported cases are de novo, with a 50% risk to offspring.
  - reference: PMID:34140661
    reference_title: Neutropenia and intellectual disability are hallmarks of biallelic and de novo CLPB deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In each individual, we identified one of four different de novo monoallelic missense variants in CLPB."
    explanation: Six unrelated probands each carried a de novo monoallelic CLPB variant.
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It should be underlined that variants causative for the dominant disease have not been reported in families with recessive disease nor in populational databases, and all occurred as a de novo events"
    explanation: Review stating that all dominant-disease variants arose de novo and are absent from population databases.
  - reference: PMID:41560087
    reference_title: "CLPB deficiency-associated congenital neutropenia: A rare case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent whole-exome sequencing identified a pathogenic missense mutation in the CLPB gene (c.1681C>T), which was confirmed by segregation analysis as a de novo event"
    explanation: A further de novo p.R561W case with neutropenia and neurological involvement.
prevalence:
- population: Worldwide published and survey cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The original report described six probands (PMID:34140661). A 2026
    literature and survey cohort counted 22 individuals with monoallelic CLPB
    variants, but that count pools the dominant neurological form with isolated
    CLPB-related neutropenia (SCN type 9), so it is an upper bound for this
    entry rather than a count of it.
  evidence:
  - reference: PMID:34140661
    reference_title: Neutropenia and intellectual disability are hallmarks of biallelic and de novo CLPB deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated six unrelated probands from four countries in three continents, with neutropenia and a phenotype dominated by epilepsy, developmental issues, and 3-methylglutaconic aciduria with next-generation sequencing."
    explanation: The defining case series of six probands.
  - reference: PMID:41719910
    reference_title: "From genotype to outcome: Zygosity-specific insights in 63 cases of CLPB-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty-three individuals (41 biallelic, 22 monoallelic; 6 unpublished) with disease-causing CLPB variants were identified via literature review and a multicenter survey."
    explanation: Gives the number of monoallelic cases known in 2026, pooled across both dominant disorders.

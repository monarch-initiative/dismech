notes: >-
  Scope: this entry covers the autosomal dominant CLPB disorder with
  neurological involvement, OMIM 619835 (MONDO:0859237), first described in six
  probands with de novo monoallelic CLPB variants (PMID:34140661). The recessive
  form, OMIM 616271, is curated separately as
  3-methylglutaconic_Aciduria_Type_VIIB. Heterozygous CLPB variants with
  isolated neutropenia, classified as severe congenital neutropenia type 9
  (OMIM 619813, PMID:34115842), are a different MONDO concept and are not
  curated here; that study is cited only for the dominant-negative mechanism the
  two dominant disorders share, and each such use says so. Several cohort
  studies pool all monoallelic patients without separating these two dominant
  disorders (PMID:41719910); figures from it describe monoallelic CLPB disease
  as a whole. The mechanistic study PMID:35499078 includes heterozygous
  patients of both kinds. Most of the imaging, speech, movement and growth
  phenotypes below come from a single de novo p.R561W case (PMID:41560087)
  in which urinary 3-methylglutaconic acid was not measured; R561 variants
  occur in both dominant disorders, and that case is placed here because of
  its neurological involvement. GeneReviews lists hypotonia and feeding
  problems for CLPB deficiency without separating the two inheritance forms;
  they are not recorded here until a source reports them in the dominant
  form. The only ClinGen gene-disease validity
  record for CLPB in cache/clingen/gene_validity.csv is for Leigh syndrome
  (MONDO:0009723), a different disease, so no gene_disease_validity assertion is
  recorded.

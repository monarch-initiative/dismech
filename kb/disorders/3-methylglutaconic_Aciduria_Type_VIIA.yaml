experimental_models:
- name: MGCA7A patient fibroblasts (complexome profiling)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from patients with de novo monoallelic CLPB variants,
    analysed by complexome profiling against control fibroblasts.
  publication: PMID:34140661
  modeled_mechanisms:
  - target: HAX1 Insolubility and Altered CLPB-HAX1 Interaction
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Shows HAX1 migrating at high molecular mass with CLPB in patient cells,
      where it is mostly monomeric in controls.
    limitations: >-
      Fibroblasts are not the cell type that fails in the neutropenia, and the
      complexome shift shows altered assembly rather than its consequence for
      granulocytes.
    evidence:
    - reference: PMID:34140661
      reference_title: Neutropenia and intellectual disability are hallmarks of biallelic and de novo CLPB deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In control fibroblasts, HAX1 migrated predominantly as monomer while in patient samples multiple HAX1 peaks were observed at higher molecular masses comigrating with CLPB thus suggesting a longer-lasting interaction between CLPB and HAX1."
      explanation: Patient fibroblasts measure the altered CLPB-HAX1 assembly.
- name: Human hematopoietic progenitors expressing dominant CLPB variants
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Human hematopoietic progenitor cells expressing heterozygous CLPB variants
    from severe congenital neutropenia patients, or with CLPB knocked out, and
    differentiated toward granulocytes.
  publication: PMID:34115842
  modeled_mechanisms:
  - target: Granulocytic Precursor Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Expression of the variants increases apoptosis of the progenitors.
    limitations: >-
      The variants tested come from SCN type 9 patients with isolated
      neutropenia, not from the type VIIA series, and are expressed alongside
      endogenous CLPB rather than from the native locus.
    evidence:
    - reference: PMID:34115842
      reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Both genetic loss of CLPB and expression of CLPB variants result in impaired granulocytic differentiation of human hematopoietic progenitor cells and increased apoptosis."
      explanation: The progenitor model reproduces precursor apoptosis.
  - target: Impaired Neutrophil Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Expression of the variants impairs granulocytic differentiation.
    limitations: >-
      The variants tested come from SCN type 9 patients with isolated
      neutropenia, not from the type VIIA series, and are expressed alongside
      endogenous CLPB rather than from the native locus.
    evidence:
    - reference: PMID:34115842
      reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Both genetic loss of CLPB and expression of CLPB variants result in impaired granulocytic differentiation of human hematopoietic progenitor cells and increased apoptosis."
      explanation: The progenitor model reproduces impaired differentiation.
discussions:
- discussion_id: gap_mgca7a_vs_scn9_boundary
  prompt: >-
    Are 3-methylglutaconic aciduria type VIIA (dominant CLPB deficiency with

- name: HAX1 Insolubility and Altered CLPB-HAX1 Interaction
  description: >-
    HAX1 depends on CLPB for solubility. In fibroblasts from patients with de
    novo CLPB variants HAX1 comigrates with CLPB in high-molecular-mass
    complexes rather than as a monomer, suggesting a prolonged CLPB-HAX1
    interaction. HAX1 deficiency itself causes severe congenital neutropenia
    (Kostmann syndrome).
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HAX1

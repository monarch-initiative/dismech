pathophysiology:
- name: Dominant-Negative Inhibition of CLPB Disaggregase
  description: >-
    Mutant CLPB subunits carrying the dominant variants assemble with wild-type
    subunits into the hexameric and dodecameric disaggregase and poison it,
    abolishing most disaggregase activity and to a lesser degree ATPase
    activity. Subunits carrying the recessive (MGCA7) variants do not do this,
    which is why one recessive allele is harmless while one dominant allele
    causes disease.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CLPB
    term:
      id: hgnc:30664
      label: CLPB
  molecular_functions:
  - preferred_term: ATP-dependent protein disaggregase activity
    term:
      id: GO:0140545
      label: ATP-dependent protein disaggregase activity
    modifier: DECREASED
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial intermembrane space
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:34140661
    reference_title: Neutropenia and intellectual disability are hallmarks of biallelic and de novo CLPB deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that these variants disturb refoldase and to a lesser extent ATPase activity of CLPB in a dominant-negative manner."
    explanation: The variants of this disorder inhibit wild-type CLPB activity dominant-negatively.
  - reference: PMID:36170828
    reference_title: "Unique structural features govern the activity of a human mitochondrial AAA+ disaggregase, Skd3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Importantly, SCN-linked subunits sharply inhibit disaggregase activity, whereas MGCA7-linked subunits do not."
    explanation: >-
      Mixed-hexamer experiments show that dominant-disease subunits poison
      wild-type CLPB while recessive-disease subunits do not. The dominant
      subunits tested were those reported in severe congenital neutropenia
      patients, so this supports the shared dominant-negative mechanism
      indirectly.
  - reference: PMID:34115842
    reference_title: Heterozygous variants of CLPB are a cause of severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "These CLPB variants associate with wild-type CLPB and inhibit its adenosine triphosphatase and disaggregase activity in a dominant-negative fashion."
    explanation: >-
      Shows the same physical association and dominant-negative inhibition for
      heterozygous variants from patients with isolated neutropenia (SCN type
      9), the sister dominant disorder.
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The dominant mutations, K404T, P427L, N496K, E557K, G560R, R561G and R620C, also decreased the disaggregase activity of the wild-type subunits in mixed oligomers."
    explanation: >-
      Summarises mixed-oligomer assays across dominant variants, including
      K404T, a variant of this disorder.
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "None of the mutations abolish hexamer or dodecamer formation"
    explanation: >-
      In 1:1 mixtures with wild-type protein (K404T, P427L, G560R) the
      dominant variants still form hexamers and dodecamers, so the mutant
      subunits are incorporated into the complex rather than excluded.
  - reference: PMID:40194906
    reference_title: CLPB Deficiency, a Mitochondrial Chaperonopathy With Neutropenia and Neurological Presentation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "which demonstrates that the dominant phenotype of the disorder is brought about by the inhibitory effect of mutant subunits on the wild type ones in mixed oligomers."
    explanation: Review conclusion that the dominant phenotype is due to poisoning of wild-type subunits.

name: 3-Methylglutaconic Aciduria Type VIIA
creation_date: "2026-10-20T01:00:00Z"
category: Mendelian
description: >-
  3-methylglutaconic aciduria type VIIA (MGCA7A) is the autosomal dominant form
  of CLPB deficiency. It is caused by specific heterozygous missense variants in
  CLPB, all reported so far as de novo, that lie in the nucleotide-binding
  domain of this ATP-dependent AAA+ disaggregase of the mitochondrial
  intermembrane space. Mutant subunits assemble with wild-type CLPB and inhibit
  its disaggregase activity, and to a lesser extent its ATPase activity, in a
  dominant-negative manner. The result resembles the recessive form (type
  VIIB): congenital neutropenia with recurrent infections, epilepsy,
  developmental delay and intellectual disability, with brain atrophy and white
  matter abnormalities in some patients, and raised urinary 3-methylglutaconic
  acid in some. Cataracts, a feature of the recessive form, have not been
  reported. Management is supportive, with granulocyte colony-stimulating factor
  for the neutropenia. The boundary with the other dominant CLPB disorder,
  severe congenital neutropenia type 9 (isolated neutropenia, OMIM 619813), is
  not settled.

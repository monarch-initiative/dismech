  evidence:
  - reference: PMID:34140661
    reference_title: Neutropenia and intellectual disability are hallmarks of biallelic and de novo CLPB deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In control fibroblasts, HAX1 migrated predominantly as monomer while in patient samples multiple HAX1 peaks were observed at higher molecular masses comigrating with CLPB thus suggesting a longer-lasting interaction between CLPB and HAX1."
    explanation: Complexome profiling in patient fibroblasts from this disorder shows altered HAX1 assembly with CLPB.
  - reference: PMID:32573439
    reference_title: Skd3 (human ClpB) is a potent mitochondrial protein disaggregase that is inactivated by 3-methylglutaconic aciduria-linked mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "In wild-type cells, HAX1 remained predominantly soluble (Figure 7d,e). However, when Skd3 was deleted HAX1 became predominantly insoluble (Figure 7d,e). Thus, Skd3 is essential for HAX1 solubility in cells."
    explanation: CLPB is required for HAX1 solubility; shown in knockout cells rather than dominant-negative patient cells.
  - reference: PMID:42244541
    reference_title: HAX1 drives assembly and activation of the mitochondrial intermembrane space chaperone CLPB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Through biochemical reconstitution, we here find that HAX1 is a direct stimulatory cofactor of CLPB."
    explanation: HAX1 and CLPB act as one functional unit, so disturbing either affects the other.
  - reference: PMID:39644357
    reference_title: Mitochondrial CLPB is a pro-survival factor at the onset of granulocytic differentiation of mouse myeloblastic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "We found that CLPB-deficient 32Dcl3 cells showed a decreased mitochondrial membrane potential and increased levels of insoluble HAX1 aggregates in mitochondria, as compared to control cells."
    explanation: Insoluble HAX1 accumulates in CLPB-deficient mouse myeloblastic cells, the cell lineage that fails in the neutropenia.
  downstream:

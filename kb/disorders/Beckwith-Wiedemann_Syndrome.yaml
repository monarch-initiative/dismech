    snippet: "Out of the 126 patients reported in this group, four of whom had NBL (3.2%)(9). Other tumor types were observed in <1% of cases."
    explanation: >-
      The 2024 AACR Pediatric Cancer Working Group update on Wilms tumor and
      hepatoblastoma surveillance reports that 4 of the 126 reported patients
      with BWSp due to CDKN1C pathogenic variants had neuroblastoma (3.2%)
      and that other tumor types were seen in under 1%, the counts this

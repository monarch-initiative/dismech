    reference_title: "Expert consensus document: Clinical and molecular diagnosis, screening and management of Beckwith-Wiedemann syndrome: an international consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "For patients with BWSp and a CDKN1C mutation, abdominal ultrasound scan (USS) for neuroblastoma every 3 months until age 7 years is recommended."
    explanation: >-
      Recommendation 61 of the 2018 international BWS consensus (Table 6,
      management working group) states the claim itself: for patients with
      BWSp and a CDKN1C mutation, abdominal ultrasound for neuroblastoma
      every 3 months until age 7 years is recommended. It is the consensus
      group's own voted recommendation, not new patient data or an outcome
      study. Its strength is A+: on the paper's voting key, '+' means 26-49%
      of the votes, the lowest of the three levels, whereas the ultrasound
      recommendations for the upd(11)pat, IC1 GOM and 11p15 duplication
      subgroups (R58, R59 and R62) are graded A+++.
  - reference: PMID:39320341
    reference_title: "Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann Syndrome and Other Predisposition Syndromes."

    reference_title: "Beckwith-Wiedemann Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For most BWS molecular subtypes, tumor screening consists of abdominal ultrasound with views of the liver, adrenal glands, and kidneys every three months until age four years followed by kidney ultrasound only every three months from age four to seven years. Serum alpha-fetoprotein (AFP) levels are performed every three months until age four years."
    explanation: The GeneReviews abstract specifies the BWS tumor-surveillance protocol with abdominal/kidney ultrasound and serum AFP.
  - reference: PMID:39320341
    reference_title: "Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann Syndrome and Other Predisposition Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "members of the American Association for Cancer Research Pediatric Cancer Working Group met to update those guidelines with a review of more recently published evidence and risk estimates"
    explanation: Supports the existence of updated harmonized surveillance guidelines for Wilms tumor and hepatoblastoma in BWS.
- name: Neuroblastoma surveillance (CDKN1C subgroup)
  description: >-
    Patients with BWSp caused by a maternal CDKN1C loss-of-function variant
    (the CDKN1C subtype) have an increased risk of neuroblastoma: 2-5% in the
    2017 AACR recommendations, and neuroblastoma in 4 of 126 reported patients
    with CDKN1C pathogenic variants (3.2%) in the 2024 AACR Wilms tumor and
    hepatoblastoma update. For this subgroup the 2018 international consensus
    recommends abdominal ultrasound for neuroblastoma every 3 months until age 7
    years (recommendation 61), and the 2024 update recommends screening for
    neuroblastoma, by ultrasound without serum AFP, rather than for Wilms tumor
    and hepatoblastoma. Guidelines disagree on urinary catecholamine
    metabolites: the 2018 consensus does not recommend catecholamine screening
    for patients with BWSp (recommendation 65), whereas the 2017 AACR
    recommendations and the 2025 Italian BWSp association update add them to
    ultrasound; the 2024 AACR neuroblastoma update reports minor updates to the
    2017 recommendations without naming BWS or CDKN1C in its abstract. Both the
    2018 consensus and the 2025 Italian update state that there is no evidence
    that neuroblastoma screening improves treatment or survival.
  action_category: SCREENING
  treatment_term:
    preferred_term: neuroblastoma screening by abdominal ultrasound
    term:
      id: NCIT:C15641
      label: Screening for Neuroblastoma
  evidence:

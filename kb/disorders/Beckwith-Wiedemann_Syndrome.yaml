      outcomes is not proven and that further studies are needed.
  - reference: PMID:29377879
    reference_title: "Expert consensus document: Clinical and molecular diagnosis, screening and management of Beckwith-Wiedemann syndrome: an international consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "there is currently no evidence that neuroblastoma screening in BWSp improves treatment and survival"
    explanation: >-
      The 2018 international BWS consensus states that there is currently
      no evidence that neuroblastoma screening in BWSp improves treatment and
      survival, which is the absence-of-evidence statement in this
      treatment's description. It is the consensus group's judgement of the
      evidence available in 2018, not a report of patient data. The sentence
      ends with a cross-reference to recommendation 65 (catecholamine
      screening not recommended), and its first half says that earlier
      urinary-marker screening in large-scale pediatric settings had a very
      minor influence on neuroblastoma morbidity and mortality. It does not
      say surveillance is ineffective: the same consensus still recommends
      abdominal ultrasound for neuroblastoma every 3 months until age 7 years
      in the CDKN1C subgroup (recommendation 61).
  - reference: PMID:41126215
    reference_title: "Beckwith-Wiedemann spectrum (BWSp): an update on diagnosis, management, and follow-up from the scientific committee of the Italian BWSp association."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The usefulness of cancer surveillance for NB remains debated as there is no evidence to support that neuroblastoma screening improves treatment outcomes or survival rates"
    explanation: >-
      In its paragraph on neuroblastoma, which it reports most often with
      CDKN1C loss-of-function variants, the 2025 Italian BWSp association
      update states that the usefulness of neuroblastoma surveillance remains
      debated because there is no evidence that screening improves treatment
      outcomes or survival. This is the review committee's position, not an
      outcome analysis of screened patients. The same committee nonetheless
      proposes urinary tumor markers plus abdominal ultrasound every three
      months until age 7 for patients with CDKN1C variants.
  notes: >-
    Applies only to the CDKN1C subtype listed under has_subtypes. The
    Treatment class has no subtype slot, so the restriction is carried by the
    name and description. The 2024 AACR neuroblastoma update (PMID:38860978)
    had no PMC full text when checked in October 2026, and its abstract does
    not give the update's tests for BWS with germline CDKN1C mutations. The
    AACR test list in the description is therefore the 2017 one
    (PMID:28674118).

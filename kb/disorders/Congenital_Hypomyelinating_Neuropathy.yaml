genetic:
- name: MPZ
  gene_term:
    preferred_term: MPZ
    term:
      id: hgnc:7225
      label: MPZ
  relationship_type: CAUSATIVE
  association: >-
    Variants in MPZ, encoding myelin protein zero, cause CHN2. The same gene
    produces a phenotypic range from adult-onset CMT1B to neonatal CHN; the CHN
    variants are those that most severely disrupt folding, stability and
    trafficking of the protein.
  evidence:
  - reference: PMID:15184631
    reference_title: "A novel MPZ gene mutation in congenital neuropathy with hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors describe the clinical and morphologic features of a patient
      with CHN and the identification of a novel Thr124Lys mutation in the MPZ
      gene.
    explanation: >-
      Reports a causative MPZ variant in a biopsy-confirmed CHN patient.
  - reference: PMID:22176150
    reference_title: "Congenital hypomyelinating neuropathy due to a novel MPZ mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case illustrates the clinical heterogeneity that exists in
      neuropathies associated with MPZ mutations
    explanation: >-
      Establishes the phenotypic breadth of MPZ variants, of which CHN is the
      severe extreme.
- name: EGR2
  gene_term:
    preferred_term: EGR2
    term:
      id: hgnc:3239
      label: EGR2
  relationship_type: CAUSATIVE
  association: >-
    Variants in EGR2/KROX20, the transcription factor controlling the Schwann
    cell myelination program, cause CHN1 (catalogued as CMT4E). Residual
    DNA-binding capacity of zinc-finger variants correlates directly with disease
    severity across the CMT1 / Dejerine-Sottas / CHN spectrum.
  evidence:
  - reference: PMID:10369870
    reference_title: "Functional consequences of mutations in the early growth response 2 gene (EGR2) correlate with severity of human myelinopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The zinc finger mutations affect DNA binding and the amount of residual
      binding directly correlates with disease severity.
    explanation: >-
      Supplies the genotype-phenotype mechanism placing CHN at the severe end of
      the EGR2 allelic series.
- name: PMP22
  gene_term:
    preferred_term: PMP22
    term:
      id: hgnc:9118
      label: PMP22
  relationship_type: CAUSATIVE
  association: >-
    PMP22 variants are among the causes of CHN. As with MPZ, the same gene
    produces a wide severity range — the common CMT1A duplication and the HNPP
    deletion sit at the mild end of the same dosage axis — and the CHN-causing
    alleles are at the severe extreme.
  evidence:
  - reference: PMID:15184631
    reference_title: "A novel MPZ gene mutation in congenital neuropathy with hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several mutations in the MTMR2, PMP22, EGR2, and MPZ genes have been found
      in patients with CHN.
    explanation: >-
      Lists PMP22 among the genes in which mutations have been found in CHN
      patients.
- name: MTMR2
  gene_term:
    preferred_term: MTMR2
    term:
      id: hgnc:7450
      label: MTMR2
  relationship_type: CAUSATIVE
  association: >-
    MTMR2 variants are among the causes of CHN. MTMR2 encodes a
    myotubularin-family phosphoinositide phosphatase and is better known as the
    CMT4B1 gene; the lesion is Schwann cell membrane trafficking rather than a
    compact-myelin structural protein, so this arm reaches the shared
    myelination-failure node by a different route than MPZ or EGR2.
  evidence:
  - reference: PMID:15184631
    reference_title: "A novel MPZ gene mutation in congenital neuropathy with hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several mutations in the MTMR2, PMP22, EGR2, and MPZ genes have been found
      in patients with CHN.
    explanation: >-
      Lists MTMR2 among the genes in which mutations have been found in CHN
      patients.
- name: CNTNAP1
  gene_term:
    preferred_term: CNTNAP1
    term:
      id: hgnc:8011
      label: CNTNAP1
  relationship_type: CAUSATIVE
  association: >-
    Biallelic CNTNAP1 variants cause CHN3. The mechanism is paranodal rather than
    compact-myelin: the mutant protein is depleted from the paranode, axo-glial
    junctions fail to form, and myelin loops evert.
  evidence:
  - reference: PMID:37862170
    reference_title: "Mouse models of human CNTNAP1-associated congenital hypomyelinating neuropathy and genetic restoration of murine neurological deficits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human CNTNAP1 mutations are linked to hypomyelinating neuropathy-3, which
      causes severe neurological deficits.
    explanation: >-
      Establishes CNTNAP1 as the CHN3 gene.
  - reference: PMID:37862170
    reference_title: "Mouse models of human CNTNAP1-associated congenital hypomyelinating neuropathy and genetic restoration of murine neurological deficits."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The paranodal ultrastructure shows everted myelin loops and the absence of
      axo-glial junctions.
    explanation: >-
      Documents the paranodal mechanism that distinguishes CHN3 from the
      compact-myelin forms. Evidence source is MODEL_ORGANISM because the
      ultrastructural finding is from knock-in mice.

diagnosis:
- name: Nerve conduction studies
  description: >-
    Motor nerve conduction velocities are severely slowed, which is the first
    objective step in separating CHN from the non-neuropathic causes of neonatal
    hypotonia. Separating it from early-onset CMT1 rests on the biopsy picture
    and the age of onset rather than on a cited velocity cut-off.
  evidence:
  - reference: PMID:22176150
    reference_title: "Congenital hypomyelinating neuropathy due to a novel MPZ mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nerve conduction velocities were severely slowed and sural nerve biopsy
      revealed non-myelinated and poorly myelinated axons
    explanation: >-
      Pairs the electrophysiological and histological diagnostic findings.
- name: Sural nerve biopsy
  description: >-
    Biopsy shows non-myelinated and poorly myelinated axons with basal-lamina
    onion bulbs and — the discriminating feature — no myelin breakdown products,
    indicating that myelin was never formed rather than lost.
  evidence:
  - reference: PMID:15184631
    reference_title: "A novel MPZ gene mutation in congenital neuropathy with hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sural nerve biopsy shows a characteristic picture of nonmyelinated and
      poorly myelinated axons with basal lamina onion bulbs and lack of myelin
      breakdown products.
    explanation: >-
      States the diagnostic biopsy picture, including the negative finding that
      distinguishes hypomyelination from demyelination.
- name: Molecular genetic testing
  description: >-
    Exome or targeted panel sequencing establishes the causative gene. Because
    the neonatal phenotype is non-specific, the diagnosis is frequently reached
    by sequencing first and reverse-phenotyping afterwards.
  evidence:
  - reference: PMID:35058287
    reference_title: "Diagnosis of a floppy neonate with misleading clues: unraveled as congenital hypomyelinating neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detection of a pathogenic variant in CNTNAP1 gene by clinical exome
      sequencing and subsequent reverse phenotyping confirmed CHN as the
      aetiology for this floppy neonate
    explanation: >-
      Documents the sequencing-first, reverse-phenotyping diagnostic route used
      in practice.

treatments:
- name: Supportive and respiratory care
  description: >-
    No disease-modifying therapy exists. Management is supportive: ventilatory
    support, feeding support, and physical therapy. Outcomes in the severe forms
    are poor, with death commonly resulting from complications of prolonged
    ventilation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35058287
    reference_title: "Diagnosis of a floppy neonate with misleading clues: unraveled as congenital hypomyelinating neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The baby was given supportive care and she succumbed secondary to
      complications of prolonged ventilation.
    explanation: >-
      Documents supportive care as the available management and its limits.

animal_models:
- name: Cntnap1 C324R and R765C knock-in mice
  species: Mouse
  genotype: Cntnap1 C324R and Cntnap1 R765C knock-in, modelling human CNTNAP1 C323R and R764C
  publication: PMID:37862170
  description: >-
    Knock-in mice carrying the mouse equivalents of two human CHN3 variants.
    They reproduce reduced nerve conduction and progressive motor dysfunction,
    and the paranodal ultrastructural lesion; postnatal transgenic re-expression
    of Cntnap1 rescues the phenotype, which is the proof-of-concept for gene
    therapy in this form.
  modeled_mechanisms:
  - target: Severe Nerve Conduction Slowing
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Both knock-in lines show reduced nerve conduction and progressive motor
      dysfunction, matching the human CHN3 electrophysiological phenotype.
    limitations: >-
      Mice model the CNTNAP1 paranodal form only; they say nothing about the
      compact-myelin (MPZ, EGR2, PMP22) arm of this disorder, and the human
      variants were transposed to the orthologous mouse residues rather than
      introduced verbatim.
    readouts:
    - name: Nerve conduction velocity
      target: Severe Nerve Conduction Slowing
      direction: DECREASED
      interpretation: >-
        Electrophysiological correlate of the paranodal junction failure.
      evidence:
      - reference: PMID:37862170
        reference_title: "Mouse models of human CNTNAP1-associated congenital hypomyelinating neuropathy and genetic restoration of murine neurological deficits."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Both Cntnap1 mutants show weight loss, reduced nerve conduction, and
          progressive motor dysfunction.
        explanation: >-
          Reports the conduction measurement behind this readout.
    - name: Motor function after postnatal Cntnap1 re-expression
      target: Severe Nerve Conduction Slowing
      direction: RESTORED
      interpretation: >-
        The conduction and motor phenotype is reversible by restoring the
        protein postnatally, indicating the deficit is not fixed at birth in this
        model.
      evidence:
      - reference: PMID:37862170
        reference_title: "Mouse models of human CNTNAP1-associated congenital hypomyelinating neuropathy and genetic restoration of murine neurological deficits."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Postnatal transgenic expression of Cntnap1 in the mutant backgrounds
          rescues the phenotypes and restores the organization of axonal domains
          with improved motor function.
        explanation: >-
          Reports the rescue experiment behind this readout.
    evidence:
    - reference: PMID:37862170
      reference_title: "Mouse models of human CNTNAP1-associated congenital hypomyelinating neuropathy and genetic restoration of murine neurological deficits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To understand the human neuropathology and to model human CNTNAP1C323R
        and CNTNAP1R764C mutations, we generated Cntnap1C324R and Cntnap1R765C
        mouse mutants, respectively.
      explanation: >-
        Establishes that these lines were built specifically to model the human
        CHN3 variants, supporting their use as informative for this node.

differential_diagnoses:
- name: Congenital Myasthenic Syndrome
  description: >-
    Both present as a floppy neonate with weakness and facial involvement, and
    the partial response to a neostigmine challenge seen in some CHN3 infants can
    reinforce the wrong diagnosis. Nerve conduction studies separate them: CHN
    shows severely slowed conduction, which a neuromuscular-junction disorder
    does not.
  evidence:
  - reference: PMID:35058287
    reference_title: "Diagnosis of a floppy neonate with misleading clues: unraveled as congenital hypomyelinating neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no clinical improvement on initiation of anticholinesterase drug
      for suspected congenital myasthenia and hence stopped.
    explanation: >-
      Documents the misdiagnosis and its resolution in a real case.
- name: Charcot-Marie-Tooth Disease Type 1
  description: >-
    The same genes (MPZ, EGR2, PMP22) cause both. CHN is distinguished by onset
    in the neonatal or early infantile period, far slower conduction velocities,
    and biopsy showing hypomyelination without myelin breakdown products, rather
    than the de- and remyelination of CMT1.
  evidence:
  - reference: PMID:10369870
    reference_title: "Functional consequences of mutations in the early growth response 2 gene (EGR2) correlate with severity of human myelinopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in the human EGR2 gene have recently been associated with the
      inherited peripheral neuropathies Charcot-Marie-Tooth type 1,
      Dejerine-Sottas syndrome and congenital hypomyelinating neuropathy.
    explanation: >-
      Establishes that these three entities form one allelic spectrum, which is
      why the distinction rests on severity and timing rather than on gene
      identity.

notes: >-
  GeneReviews: no chapter exists for congenital hypomyelinating neuropathy. A
  PubMed check of `congenital hypomyelinating neuropathy[TI] GeneReviews[TI]`,
  `CNTNAP1 AND GeneReviews[Book]` and `Dejerine-Sottas AND GeneReviews[Book]`
  returns nothing; the CMT1, CMT2 and CMT4 chapters are all marked RETIRED, and
  `Hypomyelination and Congenital Cataract` (PMID:20301737) is a different,
  central-nervous-system disease. The nearest live chapter, the
  Charcot-Marie-Tooth Hereditary Neuropathy Overview (PMID:20301532), is neither
  CHN-specific nor structured into the four minable sections, so it is not cited
  here. This entry is therefore built from primary literature by design, not by
  omission.

  No frequency bands are asserted for the clinical phenotypes. The available
  cited sources are two single-case reports and a series description; neither
  supports a quantitative band, and the frequency SOP says to omit rather than
  to estimate. The one exception is the conduction-velocity phenotype, which is
  OBLIGATE because reduced conduction velocity is part of the cited definition
  of the disorder rather than an observed proportion.

  The primary disease term MONDO:0033352 carries the label "neuropathy,
  congenital hypomelinating" — the misspelling is upstream in MONDO and is
  reproduced verbatim in `term.label` because term labels must match the
  ontology exactly; `preferred_term` carries the corrected spelling.

  MONDO catalogues the EGR2 form as Charcot-Marie-Tooth disease type 4E rather
  than as CHN1, so that is the term bound to the CHN1 subtype. This is an
  ontology-level naming choice, not a claim that the EGR2 form is a CMT4
  recessive demyelinating neuropathy.

  CHN3 (CNTNAP1) is grouped here because MONDO places it under the same parent
  and because it shares the clinical presentation, but its mechanism is
  paranodal axo-glial junction failure rather than compact-myelin failure. Its
  pathophysiology is therefore represented only through the shared conduction
  and clinical nodes; it is deliberately NOT asserted to conform to the
  compact-myelin trigger and mistrafficking nodes, which describe the MPZ/EGR2
  arm.

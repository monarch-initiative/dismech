  downstream:
  - target: Severe Nerve Conduction Slowing
  - target: Onion bulb formation

- name: Severe Nerve Conduction Slowing
  description: >-
    Motor nerve conduction velocities are severely slowed, the electrophysiological
    correlate of near-absent myelin. Clinical accounts describe the slowing as
    severe; the cited sources do not give a numeric threshold separating CHN from
    early-onset CMT1, so none is asserted here.
  role: effector
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Nerve Conduction Slowing and Conduction Block"
  biological_processes:

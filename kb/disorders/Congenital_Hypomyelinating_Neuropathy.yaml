pathophysiology:
- name: Myelination Gene Lesion in Developing Schwann Cells
  description: >-
    A variant in a gene the Schwann cell requires to build compact myelin — MPZ
    (the principal compact-myelin adhesion protein), EGR2/KROX20 (the
    transcription factor driving the myelination program), PMP22, or MTMR2 —
    disables myelination during the perinatal window when peripheral nerve is
    normally myelinated. Because the lesion strikes before rather than after
    myelin is laid down, the resulting nerve is hypomyelinated from the outset
    rather than demyelinated, which is the defining difference between CHN and
    the later-onset demyelinating neuropathies caused by variants in the same
    genes.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  biological_processes:
  - preferred_term: myelination in peripheral nervous system
    term:
      id: GO:0022011
      label: myelination in peripheral nervous system
    modifier: DECREASED
  evidence:
  - reference: PMID:15184631
    reference_title: "A novel MPZ gene mutation in congenital neuropathy with hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several mutations in the MTMR2, PMP22, EGR2, and MPZ genes have been found
      in patients with CHN.
    explanation: >-
      Enumerates the causative myelination genes that constitute this trigger
      node.
  - reference: PMID:10369870
    reference_title: "Functional consequences of mutations in the early growth response 2 gene (EGR2) correlate with severity of human myelinopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in the human EGR2 gene have recently been associated with the
      inherited peripheral neuropathies Charcot-Marie-Tooth type 1,
      Dejerine-Sottas syndrome and congenital hypomyelinating neuropathy.
    explanation: >-
      Establishes the EGR2 arm of the trigger and places CHN at the severe end of
      a single gene's phenotypic range.
  downstream:
  - target: Myelin Protein Mistrafficking and Loss of Surface Adhesion
    description: >-
      Structural-protein variants prevent the protein reaching the myelin
      membrane.
  - target: Failure of Peripheral Nerve Myelination
    description: >-
      Loss of the transcriptional myelination program blocks myelination
      directly, without an intervening trafficking defect.

- name: Myelin Protein Mistrafficking and Loss of Surface Adhesion
  description: >-
    CHN-causing MPZ variants are predicted to destabilize the protein's fold, and
    the mutant protein fails to reach the plasma membrane, accumulating instead
    in the cytosol with reduced adhesive properties. Because myelin protein zero
    compacts myelin lamellae by homophilic adhesion across the extracellular
    face, a protein that never reaches the surface cannot perform that function,
    whatever else is wrong with it.

    Evidence scope: the localization was measured in transfected cells, not in
    Schwann cells, and the destabilization is a modeling prediction rather than a
    measurement. The mislocalization is specifically *cytosolic*, which is not
    the same as the ER and Golgi retention documented for other myelin-gene
    variants — so this node evidences the mistrafficking arm of the module node
    it conforms to, and NOT the proteostatic-stress/unfolded-protein-response
    arm. A curator should not read ER stress into this entry without evidence
    for it in CHN.
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "schwann_cell_myelin_maintenance#Schwann Cell Proteostatic Stress and Myelin Protein Mistrafficking"
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:22176150
    reference_title: "Congenital hypomyelinating neuropathy due to a novel MPZ mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Subcellular location studies were performed and revealed that the mutant
      protein loses its correct location on the cell membrane surface and is
      mainly expressed in the cytosol, reducing its adhesive properties.
    explanation: >-
      Direct demonstration of the mistrafficking mechanism and its functional
      consequence for myelin adhesion.
  - reference: PMID:22176150
    reference_title: "Congenital hypomyelinating neuropathy due to a novel MPZ mutation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In silico analyses and molecular modeling predicted that the replacement of
      a serine by a phenylalanine is a non-tolerated change and may affect the
      folding and the stability of the protein.
    explanation: >-
      Supplies the structural rationale for the trafficking defect. Evidence
      source is COMPUTATIONAL because this is a modeling prediction, not a
      measurement.
  downstream:
  - target: Failure of Peripheral Nerve Myelination

- name: Failure of Peripheral Nerve Myelination
  description: >-
    Peripheral nerve fibers remain non-myelinated or only thinly myelinated. The
    histological signature on sural nerve biopsy is diagnostic and distinguishes
    CHN from acquired and later-onset inherited demyelinating neuropathy: poorly
    myelinated and unmyelinated axons surrounded by basal-lamina onion bulbs,
    with an absence of myelin breakdown products, because the myelin was never
    made rather than destroyed. The onion bulbs here reflect abortive Schwann
    cell ensheathment attempts rather than the repeated demyelination-remyelination
    cycles that produce them in CMT1.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Dysmyelination and Segmental Demyelination of Peripheral Nerve"
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218

name: Congenital Hypomyelinating Neuropathy
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Congenital hypomyelinating neuropathy (CHN) is the most severe end of the
  hereditary demyelinating neuropathy spectrum: a neuropathy of neonatal or
  early-infantile onset in which peripheral nerves are never adequately
  myelinated in the first place, rather than losing myelin they once had. Infants
  present as floppy neonates with profound hypotonia, areflexia, feeding and
  respiratory difficulty, and sometimes arthrogryposis from intrauterine
  akinesia. Motor nerve conduction velocities are extremely slow — typically far
  below the CMT1 range — and sural nerve biopsy shows non-myelinated and poorly
  myelinated axons with basal-lamina onion bulbs and, diagnostically, an absence
  of myelin breakdown products, because there was little myelin to break down.
  CHN is genetically heterogeneous and inherited as an autosomal dominant or
  recessive trait; causative variants have been found in MPZ, EGR2, PMP22, MTMR2
  and, in the paranodal form, CNTNAP1. Mechanistically it is the developmental
  extreme of the same Schwann cell myelination failure that produces
  Charcot-Marie-Tooth disease type 1 and Dejerine-Sottas syndrome, and the
  severity gradient across these three entities tracks the severity of the
  underlying molecular lesion rather than distinguishing separate mechanisms.
category: Mendelian
parents:
- Peripheral Neuropathy
- hereditary disease
disease_term:
  preferred_term: neuropathy, congenital hypomyelinating
  term:
    id: MONDO:0033352
    label: neuropathy, congenital hypomelinating
has_subtypes:
- name: CHN1
  display_name: CHN1 (EGR2-related, Charcot-Marie-Tooth disease type 4E)
  description: >-
    The EGR2/KROX20 form, catalogued in MONDO as Charcot-Marie-Tooth disease type
    4E. EGR2 is the transcription factor that drives the Schwann cell myelination
    program, so its loss disables myelination at the level of the transcriptional
    switch rather than of a single structural protein. Zinc-finger domain
    variants act dominantly and their residual DNA-binding capacity correlates
    inversely with disease severity; a recessive variant in the NAB co-repressor
    binding domain acts by increasing transcriptional activity instead.
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease type 4E
    term:
      id: MONDO:0011527
      label: Charcot-Marie-Tooth disease type 4E
- name: CHN2
  display_name: CHN2 (MPZ-related)
  description: >-
    The MPZ form. Myelin protein zero is the principal structural adhesion
    protein of compact peripheral myelin; CHN-causing variants disrupt its
    folding and trafficking so that it fails to reach the cell surface. The same
    gene produces a phenotypic range from adult-onset CMT1B to neonatal CHN
    depending on the variant.
  subtype_term:
    preferred_term: neuropathy, congenital hypomyelinating, 2
    term:
      id: MONDO:0020765
      label: neuropathy, congenital hypomyelinating, 2
- name: CHN3
  display_name: CHN3 (CNTNAP1-related, paranodal)
  description: >-
    The CNTNAP1 form, mechanistically distinct from the compact-myelin arm:
    contactin-associated protein 1 builds the axo-glial septate-like junctions of
    the paranode, so the lesion is a failure to organize the axonal domains that
    make saltatory conduction possible rather than a failure to make compact
    myelin. It carries a high neonatal mortality and can present as a floppy
    neonate mimicking congenital myasthenic syndrome.
  subtype_term:
    preferred_term: neuropathy, congenital hypomyelinating, 3
    term:
      id: MONDO:0020766
      label: neuropathy, congenital hypomyelinating, 3

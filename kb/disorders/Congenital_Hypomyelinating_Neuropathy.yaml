    explanation: >-
      Establishes the defining histopathology of this node, including the absence
      of breakdown products that marks hypomyelination rather than
      demyelination.
  - reference: PMID:22176150
    reference_title: "Congenital hypomyelinating neuropathy due to a novel MPZ mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sural nerve biopsy revealed non-myelinated and poorly myelinated axons,

    term:
      id: GO:0019226
      label: transmission of nerve impulse
    modifier: DECREASED
  evidence:
  - reference: PMID:22176150
    reference_title: "Congenital hypomyelinating neuropathy due to a novel MPZ mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital hypomyelinating neuropathy (CHN) is a severe inherited
      neuropathy with neonatal or early infancy onset, reduced nerve conduction
      velocity, and pathological evidence of hypomyelination.
    explanation: >-
      Establishes reduced conduction velocity as a defining feature of the
      disorder alongside the histological hypomyelination.
  downstream:
  - target: Neonatal Neuromuscular Failure
  - target: Decreased motor nerve conduction velocity

- name: Neonatal Neuromuscular Failure
  description: >-
    The clinical terminus: a floppy neonate with profound hypotonia and weakness,
    progressing in the severe forms to cranial nerve dysfunction, bulbar and
    respiratory failure. Unlike the later-onset demyelinating
    neuropathies, where disability accrues over decades through secondary axonal
    loss, disability in CHN is present from birth and is driven by the failure of
    conduction itself.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22176150
    reference_title: "Congenital hypomyelinating neuropathy due to a novel MPZ mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a case of CHN that presented with neonatal hypotonia and a
      progressive downhill clinical course, developing cranial nerve dysfunction,
      and respiratory failure.
    explanation: >-
      Documents the neonatal presentation and its progression to cranial and
      respiratory involvement.
  - reference: PMID:35058287
    reference_title: "Diagnosis of a floppy neonate with misleading clues: unraveled as congenital hypomyelinating neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a neonate with an atypical presentation in the form of global
      hypotonia, facial diparesis and partial response to neostigmine challenge
      test.
    explanation: >-
      Documents the floppy-neonate presentation in the CNTNAP1 form, including
      the facial involvement and the neuromuscular-junction mimicry that
      complicates diagnosis.
  downstream:
  - target: Neonatal hypotonia
  - target: Respiratory insufficiency
  - target: Facial palsy


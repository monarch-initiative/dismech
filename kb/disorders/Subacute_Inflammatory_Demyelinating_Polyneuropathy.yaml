differential_diagnoses:
- name: Guillain-Barre syndrome
  disease_term:
    preferred_term: Guillain-Barre syndrome
    term:
      id: MONDO:0016218
      label: Guillain-Barre syndrome
  description: >-
    Acute immune-mediated polyradiculoneuropathy that reaches clinical nadir within 4 weeks,
    whereas SIDP progresses to nadir between 4 and 8 weeks.
  distinguishing_features:
  - Time to nadir is 4 weeks or less in Guillain-Barre syndrome versus 4 to 8 weeks in SIDP.
  evidence:
  - reference: PMID:14663033
    reference_title: Subacute inflammatory demyelinating polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subacute inflammatory demyelinating polyneuropathy is a definite entity bridging the gap between Guillain-Barré syndrome and chronic inflammatory demyelinating polyneuropathy.
    explanation: Establishes Guillain-Barre syndrome as the acute boundary of the inflammatory demyelinating polyneuropathy spectrum relative to SIDP.
  - reference: PMID:14663033
    reference_title: Subacute inflammatory demyelinating polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For a diagnosis of "definite SIDP," there were four mandatory criteria: 1) progressive motor and/or sensory dysfunction consistent with neuropathy in more than one limb with time to nadir between 4 and 8 weeks, 2) electrophysiologic evidence of demyelination in at least two nerves, 3) no other etiology of neuropathy, and 4) no relapse on adequate follow-up.
    explanation: Defines the 4-to-8-week progression window to nadir that distinguishes SIDP from acute (<4 weeks) Guillain-Barre syndrome.
- name: Chronic inflammatory demyelinating polyradiculoneuropathy
  disease_term:
    preferred_term: chronic inflammatory demyelinating polyradiculoneuropathy
    term:
      id: MONDO:0006702
      label: chronic inflammatory demyelinating polyradiculoneuropathy
  description: >-
    Chronic acquired demyelinating polyneuropathy characterized by progression beyond 8 weeks
    or relapsing-remitting course, in contrast to the 4-to-8-week monophasic course of definite SIDP.
  distinguishing_features:
  - Progression exceeds 8 weeks or relapses occur on follow-up in CIDP, whereas definite SIDP reaches nadir in 4 to 8 weeks without relapse.
  - Definite SIDP exhibits a higher rate of antecedent infection (38%) and a higher rate of complete recovery to normal (69%) than typical CIDP.
  evidence:
  - reference: PMID:14663033
    reference_title: Subacute inflammatory demyelinating polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Definite SIDP had all the characteristics of CIDP with three exceptions: a higher rate of antecedent infection, no relapse rate, and a high rate of recovery to normal.
    explanation: Directly contrasts definite SIDP with CIDP by antecedent infection rate, absence of relapse, and higher complete recovery rate.

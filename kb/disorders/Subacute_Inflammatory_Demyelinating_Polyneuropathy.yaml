    by an antecedent infection, without Mendelian inheritance.
  evidence:
  - reference: PMID:14663033
    reference_title: Subacute inflammatory demyelinating polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen definite SIDP patients were identified among 29 probable SIDP patients. An antecedent infection was found in 38% of cases.
    explanation: Supports a non-familial, acquired disease course in which 38% of cases followed an antecedent infection.

progression:
- phase: Subacute Progression to Nadir
  duration: 4 to 8 weeks
  notes: Defining temporal progression of motor and/or sensory neuropathy in more than one limb reaching nadir between 4 and 8 weeks.
  evidence:
  - reference: PMID:14663033
    reference_title: Subacute inflammatory demyelinating polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For a diagnosis of "definite SIDP," there were four mandatory criteria: 1) progressive motor and/or sensory dysfunction consistent with neuropathy in more than one limb with time to nadir between 4 and 8 weeks, 2) electrophysiologic evidence of demyelination in at least two nerves, 3) no other etiology of neuropathy, and 4) no relapse on adequate follow-up.
    explanation: Defines the mandatory 4-to-8-week subacute progression window to nadir.
- phase: Monophasic Recovery Phase
  notes: Definite SIDP follows a monophasic course without relapse on follow-up, achieving complete recovery in 69% of cases and partial recovery in the remainder with immunotherapy.
  evidence:
  - reference: PMID:14663033
    reference_title: Subacute inflammatory demyelinating polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost all patients were treated with prednisone and some with additional immunotherapies. Complete recovery was achieved in 69% of cases and partial recovery in others. Definite SIDP had all the characteristics of CIDP with three exceptions: a higher rate of antecedent infection, no relapse rate, and a high rate of recovery to normal.
    explanation: Documents the monophasic non-relapsing recovery phase and high complete recovery rate in definite SIDP.
pathophysiology:
- name: Immune-mediated peripheral nerve demyelination
  description: >-
    SIDP is characterized by subacute immune-mediated demyelination in multiple
    peripheral nerves, causing slowed conduction, conduction block, weakness,
    sensory loss, and reduced reflexes.
  downstream:
  - target: Peripheral neuropathy
    causal_link_type: DIRECT
    description: Multifocal peripheral nerve demyelination disrupts motor and sensory conduction across multiple limbs.
    evidence:
    - reference: PMID:14663033
      reference_title: Subacute inflammatory demyelinating polyneuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        For a diagnosis of "definite SIDP," there were four mandatory criteria: 1) progressive motor and/or sensory dysfunction consistent with neuropathy in more than one limb with time to nadir between 4 and 8 weeks, 2) electrophysiologic evidence of demyelination in at least two nerves, 3) no other etiology of neuropathy, and 4) no relapse on adequate follow-up.
      explanation: Links electrophysiologic demyelination in multiple nerves to clinical motor and sensory polyneuropathy.
  - target: Muscle weakness
    causal_link_type: DIRECT
    description: Motor nerve demyelination causes conduction slowing and conduction block along motor axons, producing symmetric motor-sensory or pure motor weakness.
    evidence:
    - reference: PMID:14663033
      reference_title: Subacute inflammatory demyelinating polyneuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The two most common neuropathy types were a symmetric motor-sensory neuropathy and a pure motor neuropathy. Cranial nerve deficits and respiratory failure were rare. Spinal fluid protein was high in 93% of cases. Demyelination was documented by the motor nerve conduction in 88% of cases and by the near-nerve needle sensory nerve conduction in two cases.
      explanation: Connects motor nerve demyelination documented on nerve conduction studies to clinical motor weakness.
  - target: Reduced tendon reflexes
    causal_link_type: DIRECT
    description: Peripheral nerve demyelination desynchronizes afferent and efferent reflex arcs, resulting in hyporeflexia or areflexia characteristic of CIDP-spectrum demyelinating neuropathies.

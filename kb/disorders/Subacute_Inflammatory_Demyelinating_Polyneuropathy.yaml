classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:14663033
      reference_title: Subacute inflammatory demyelinating polyneuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Subacute inflammatory demyelinating polyneuropathy is a definite entity bridging the gap between Guillain-Barré syndrome and chronic inflammatory demyelinating polyneuropathy.
      explanation: Establishes SIDP as an inflammatory demyelinating peripheral neuropathy within neurologic disorders.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:14663033
      reference_title: Subacute inflammatory demyelinating polyneuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Supportive criteria included high spinal fluid protein level (>55 mg/dL) and inflammatory cells in the nerve biopsy. A diagnosis of "probable SIDP" required progression of demyelinating neuropathy over a 4- to 8-week period.
      explanation: Nerve biopsy inflammation places SIDP among immune-mediated disorders.
inheritance:

    explanation: >-
      Kinetic assays of recombinant mutant ELAC2 quantify the activity loss for
      the most severe missense substitutions.
  - reference: PMID:31045291
    reference_title: "Mutations in ELAC2 associated with hypertrophic cardiomyopathy impair mitochondrial tRNA 3'-end processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      suggesting that the substitutions do not severely alter stability of ELAC2
    explanation: >-
      The recurrent missense proteins express well, so for these alleles the
      deficit is catalytic rather than a loss of protein.
  - reference: PMID:36836802
    reference_title: "Novel ELAC2 Mutations in Individuals Presenting with Variably Severe Neurological Disease in the Presence or Absence of Cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO

name: Combined Oxidative Phosphorylation Defect Type 17
creation_date: "2026-10-15T12:00:00Z"
category: Mendelian
synonyms:
- COXPD17
- ELAC2 combined oxidative phosphorylation deficiency
- combined oxidative phosphorylation deficiency caused by mutation in ELAC2
- combined oxidative phosphorylation deficiency type 17
- ELAC2-related mitochondrial disease
description: >-
  Combined oxidative phosphorylation defect type 17 (COXPD17) is an autosomal
  recessive mitochondrial disease caused by biallelic variants in ELAC2, which
  encodes the long form of RNase Z. Human mitochondrial DNA is transcribed as
  long polycistronic precursors in which the mt-tRNA genes punctuate the rRNA
  and mRNA genes; each transcript is released by 5' cleavage by the
  mitochondrial RNase P complex (TRMT10C/MRPP1, HSD17B10/MRPP2, PRORP/MRPP3) and
  3' cleavage by ELAC2. Disease variants lower ELAC2 catalytic activity or
  protein abundance, so 3'-unprocessed mt-tRNA-mRNA and mt-tRNA-rRNA junctions
  accumulate. In patient fibroblasts the steady-state levels of mature mt-tRNAs,
  mt-mRNAs and mt-rRNAs are not reduced, yet mitochondrial translation falls,
  and the resulting respiratory chain defect is usually an isolated complex I
  deficiency in skeletal muscle, sometimes with complex IV involvement.

  The dominant presentation is infantile hypertrophic cardiomyopathy with
  lactic acidosis, onset in the first months of life and death in infancy from
  cardiac failure or cardiogenic shock; pericardial effusion is a recurrent
  echocardiographic finding, and some patients progress to or present with a
  dilated phenotype. The recurrent p.Phe154Leu allele is a founder variant in
  consanguineous Arabian Peninsula families and has a uniformly fatal infantile
  course in the Saudi and Kuwaiti series. A smaller group of patients survives
  longer with milder or absent cardiomyopathy and a neurological picture of
  developmental delay, intellectual disability, ataxia, epilepsy, neuropathy
  and sensorineural deafness. These are treated here as one allelic spectrum
  under a single MONDO concept rather than as separate entities.

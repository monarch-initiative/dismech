      Fibroblasts show a much smaller processing defect than skeletal muscle
      and are not an affected tissue; cardiac and neurological effects are not
      modelled.
    evidence:
    - reference: PMID:23849775
      reference_title: "ELAC2 mutations cause a mitochondrial RNA processing defect associated with hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results imply that impaired RNase Z activity in mutant ELAC2 is
        responsible for the mt-tRNA processing defect in all three individuals.
      explanation: >-
        Conclusion of the complementation experiment.
diagnosis:
- name: Genetic testing for ELAC2 in infantile cardiomyopathy
  description: >-
    ELAC2 belongs in gene panels for infantile-onset hypertrophic
    cardiomyopathy. In populations with a high rate of consanguinity, targeted
    testing for p.Phe154Leu is proposed for infants with idiopathic
    cardiomyopathy and persistent lactic acidosis.
  evidence:
  - reference: PMID:31045291
    reference_title: "Mutations in ELAC2 associated with hypertrophic cardiomyopathy impair mitochondrial tRNA 3'-end processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, the ELAC2 gene should be included in gene panels to screen
      infantile-onset cases of patients with HCM.
    explanation: >-
      Recommendation from the 2019 series.
  - reference: PMID:42477863
    reference_title: "A Homozygous Founder ELAC2 Variant in Kuwaiti Infants With Fatal Cardiomyopathy and Refractory Severe Lactic Acidosis: A Retrospective Review of the Clinical, Cardiological and Molecular Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we recommend targeted ELAC2 screening in infants with idiopathic
      cardiomyopathy and persistent lactic acidosis, particularly in
      consanguineous populations
    explanation: >-
      Targeted testing recommendation from the Kuwaiti cohort.
- name: Respiratory chain enzymology in skeletal muscle
  description: >-
    Complex I deficiency, isolated or with complex IV, in muscle. A normal or
    mild result does not exclude the disease.
  evidence:
  - reference: PMID:31045291
    reference_title: "Mutations in ELAC2 associated with hypertrophic cardiomyopathy impair mitochondrial tRNA 3'-end processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with isolated Complex I deficiency prevailing in most of the patients
    explanation: >-
      The usual enzymatic pattern.
treatments:
- name: Heart failure management and supportive care
  description: >-
    Anticongestive therapy, nutritional support and intensive care. There is
    no disease-specific therapy. Reported cardiac deterioration has continued
    despite treatment, and supplementation with coenzyme Q10 and riboflavin is
    recorded in individual patients without evidence of benefit.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:23849775
    reference_title: "ELAC2 mutations cause a mitochondrial RNA processing defect associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This girl died at the age of 4 years and 9 months from cardiac failure
      despite intense anticongestive therapy and treatment with coenzyme Q10 and
      riboflavin.
    explanation: >-
      Shows the limits of medical and cofactor therapy in one patient.
- name: Heart transplantation
  description: >-
    Reported in three patients of the 2019 series: two survived long term after
    transplantation at 3.8 years and 10 months, and one had two failed
    transplants. Extracardiac disease, especially neurological, should be
    weighed before transplantation.
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  evidence:
  - reference: PMID:31045291
    reference_title: "Mutations in ELAC2 associated with hypertrophic cardiomyopathy impair mitochondrial tRNA 3'-end processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      P7 and P10 were successfully treated by heart transplantation at age 3.8
      years and 10 months, respectively
    explanation: >-
      Two long-term survivors after transplantation.
- name: Genetic counseling and carrier testing
  description: >-
    Recurrence risk is 25% for carrier parents. In populations where the
    founder allele is common, premarital carrier screening and cascade testing
    are proposed.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

    reference_title: "A Homozygous Founder ELAC2 Variant in Kuwaiti Infants With Fatal Cardiomyopathy and Refractory Severe Lactic Acidosis: A Retrospective Review of the Clinical, Cardiological and Molecular Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Premarital carrier testing and early family counseling should be
      prioritized to support preventive strategies.
    explanation: >-
      Prevention recommendation from the Kuwaiti cohort.
differential_diagnoses:
- name: Combined oxidative phosphorylation defect type 30 (TRMT10C/MRPP1)
  description: >-
    The 5'-processing counterpart: biallelic TRMT10C variants impair RNase P
    cleavage at the other end of the same mt-tRNAs, with precursor accumulation
    and defective mitochondrial translation. Its two reported patients
    presented at birth with lactic acidosis, hypotonia and deafness.
  disease_term:
    preferred_term: combined oxidative phosphorylation defect type 30
    term:
      id: MONDO:0014856
      label: combined oxidative phosphorylation defect type 30
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analyses of fibroblasts from affected individuals harboring TRMT10C
      missense variants revealed decreased protein levels of MRPP1 and an
      increase in mt-RNA precursors indicative of impaired mt-RNA processing and
      defective mitochondrial protein synthesis.
    explanation: >-
      The same processing-to-translation chain from the RNase P side.
- name: HSD10 mitochondrial disease
  description: >-
    X-linked disease of the MRPP2 subunit of RNase P, which also impairs
    mitochondrial precursor processing and can include cardiomyopathy, but with
    a progressive neurodegenerative course in boys.
  disease_term:
    preferred_term: HSD10 mitochondrial disease
    term:
      id: MONDO:0010327
      label: HSD10 mitochondrial disease
  evidence:
  - reference: PMID:24549042
    reference_title: "Mutation or knock-down of 17β-hydroxysteroid dehydrogenase type 10 cause loss of MRPP1 and impaired processing of mitochondrial heavy strand transcripts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings indicate that HSD10 is important for the maintenance of the
      MRPP1-HSD10 subcomplex of RNase P and that loss of HSD10 causes impaired
      mitochondrial precursor transcript processing
    explanation: >-
      Shared lesion in the same processing pathway.
discussions:
- discussion_id: elac2_processing_translation_link
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does a 3'-processing defect reduce mitochondrial translation when mature
    mt-tRNA, mt-mRNA and mt-rRNA levels are preserved in patient fibroblasts?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial tRNA 3'-End Processing
  - pathophysiology#Impaired Mitochondrial Protein Synthesis
  rationale: >-
    The defining report proposes two models, a reduced pool of translatable
    mature mt-mRNA in muscle where precursors rise up to 400-fold, or
    interference with translation by unprocessed intermediates, and could not
    distinguish them because muscle was scarce. The conditional knockout mouse
    shows ELAC2 is required for all mature mitochondrial RNAs, which fits the
    first model for a null but leaves open what limits translation with the
    hypomorphic human alleles.
- discussion_id: elac2_cardiac_tropism_and_splice_alleles
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the heart the main target, and why do patients with exon 15 donor
    splice alleles have neurological disease without significant
    cardiomyopathy?
  attaches_to:
  - pathophysiology#Infantile Cardiomyocyte Remodeling
  - pathophysiology#Neurological Energy Failure
  rationale: >-
    Two unrelated families with variants at the same exon 15 donor site had
    little or no cardiac involvement, and the 2019 authors suggest
    tissue-specific splice-site usage in heart as one explanation. This has not
    been tested. Whether the nuclear ELAC2 isoform contributes to the
    neurological disease is also unknown.
notes: >-
  Lump/split: MONDO:0014190 (OMIM 615440) covers all biallelic ELAC2 disease,
  and the infantile cardiomyopathy and the neurological-predominant
  presentations share the same processing defect in patient cells, so they are
  curated here as one allelic spectrum rather than as subtypes; neither has its
  own MONDO term.

  Not curated as evidence: a Korean infant with encephalopathy and epilepsy
  carrying a single heterozygous ELAC2 variant (PMID:29302266), because a
  second allele was not identified and the relevance of the variant is
  uncertain; and a single case of pseudohypoaldosteronism type 1 with
  hypertrophic cardiomyopathy attributed to an ELAC2 variant (PMID:35946480),
  whose abstract does not give the genotype. Neither is reflected in the
  phenotype list.

  ELAC2 has a separate, contested history as a hereditary prostate cancer
  susceptibility gene (the p.Ser217Leu and p.Ala541Thr variants). That
  association is about heterozygous carriers and adult cancer risk, is outside
  this entry, and is mentioned only so the two are not conflated. The 2019
  series found that p.Arg781His, an allele first reported in a prostate cancer
  pedigree, impairs mitochondrial RNase Z activity and occurs in compound
  heterozygous patients with this disease.

  No GeneReviews chapter names this disease or its synonyms (Bookshelf index
  snapshot of 2026-09-10, plus a live PubMed title search in October 2026), so
  the phenotype baseline is the primary case series.

progression:
- phase: Infantile cardiac presentation
  notes: >-
    Onset of cardiomyopathy, failure to thrive and lactic acidosis between the
    first days of life and 12 months, most often in the first months.
  evidence:
  - reference: PMID:42477863
    reference_title: "A Homozygous Founder ELAC2 Variant in Kuwaiti Infants With Fatal Cardiomyopathy and Refractory Severe Lactic Acidosis: A Retrospective Review of the Clinical, Cardiological and Molecular Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with symptoms appearing between the second day of life and 12 months of
      age (median: 2 months)
    explanation: >-
      Age at onset in the largest cohort.
- phase: Death in infancy
  notes: >-
    In p.Phe154Leu homozygotes the course is uniformly fatal, with median age at
    death of 3 to 4 months; about a third of the Saudi infants died at the
    initial presentation. Survival beyond infancy is recorded with some other
    genotypes, after heart transplantation, and in the neurological-predominant
    group.
  evidence:
  - reference: PMID:28441660
    reference_title: "The Phenotype and Outcome of Infantile Cardiomyopathy Caused by a Homozygous ELAC2 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All infants died with a median age of death of 4 months. Almost 1/3 of
      them died during the initial presentation.
    explanation: >-
      Outcome of 16 Saudi p.Phe154Leu homozygotes.
  - reference: PMID:42477863
    reference_title: "A Homozygous Founder ELAC2 Variant in Kuwaiti Infants With Fatal Cardiomyopathy and Refractory Severe Lactic Acidosis: A Retrospective Review of the Clinical, Cardiological and Molecular Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease course was fatal in all, with most patients dying in infancy.
    explanation: >-
      Outcome in the Kuwaiti founder cohort.
- phase: Longer survival with neurological disease
  notes: >-
    Patients with milder or absent cardiomyopathy survive into childhood or
    adulthood with developmental delay, intellectual disability and, in some,
    progressive ataxia, epilepsy, neuropathy and deafness. One compound
    heterozygous woman was evaluated at 69 years for a Huntington-like
    hyperkinetic disorder with psychosis and acanthocytosis.
  evidence:
  - reference: PMID:36836802
    reference_title: "Novel ELAC2 Mutations in Individuals Presenting with Variably Severe Neurological Disease in the Presence or Absence of Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study expands the genetic spectrum of ELAC2-linked disease and

- name: Impaired Mitochondrial tRNA 3'-End Processing
  biological_scale: MOLECULAR
  description: >-
    3'-unprocessed mt-tRNA precursors, extended by the downstream mt-mRNA or
    mt-rRNA, accumulate at tRNA-punctuated junctions such as mt-tRNAVal-16S rRNA,
    mt-tRNAMet-ND2 and mt-tRNALeu(UUR)-ND1. The increase is far larger in skeletal
    muscle (up to about 400-fold) than in fibroblasts (up to about 30-fold).
    Junctions not punctuated by a tRNA are processed normally. Lentiviral
    wild-type ELAC2 normalises the precursor levels in patient fibroblasts.

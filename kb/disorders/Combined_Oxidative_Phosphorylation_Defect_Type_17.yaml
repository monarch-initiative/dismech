genetic:
- name: ELAC2
  notes: >-
    Encodes the long form of RNase Z (RNase ZL), dual targeted to mitochondria
    and nucleus. The recurrent c.460T>C (p.Phe154Leu) allele is an Arabian
    founder variant. ClinGen classifies ELAC2 as Definitive for autosomal
    recessive "mitochondrial disease" (MONDO:0044970), a lumped ClinGen disease
    rather than this entry's MONDO term, so it is cited as evidence but not
    recorded as gene_disease_validity. ELAC2 was earlier proposed as a
    hereditary prostate cancer susceptibility gene; that association concerns
    common or rare heterozygous variants, has been contested, and is a
    separate question that this entry does not curate.
  gene_term:
    preferred_term: ELAC2
    term:
      id: hgnc:14198
      label: ELAC2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23849775
    reference_title: "ELAC2 mutations cause a mitochondrial RNA processing defect associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complementation experiments in mutant cell lines restored RNA processing
      and a yeast model provided additional evidence for the disease-causal role
      of defective ELAC2, thereby linking mtRNA processing to human disease.
    explanation: >-
      Functional rescue in patient cells supports causality.
  - reference: PMID:42477863
    reference_title: "A Homozygous Founder ELAC2 Variant in Kuwaiti Infants With Fatal Cardiomyopathy and Refractory Severe Lactic Acidosis: A Retrospective Review of the Clinical, Cardiological and Molecular Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 34 individuals from 23 consanguineous families were
      identified, of whom 30 were genetically confirmed to harbor the homozygous
      ELAC2 founder variant c.460T>C; p.(Phe154Leu).
    explanation: >-
      The recurrent founder genotype in the largest cohort.
  - reference: CGGV:assertion_ff57f761-51cd-41aa-a287-7387e0f5f028-2022-07-21T040000.000Z
    reference_title: "ELAC2 / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ELAC2 | HGNC:14198 | mitochondrial disease | MONDO:0044970 | AR | Definitive"
    explanation: >-
      ClinGen Mitochondrial Diseases GCEP classifies ELAC2 as definitive for
      the lumped autosomal recessive mitochondrial disease entity.

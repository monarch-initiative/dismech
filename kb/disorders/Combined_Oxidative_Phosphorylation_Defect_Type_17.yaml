    complex I deficiency (7 of 10 tested patients in the 2019 series), with
    complex IV, and less often complex III or V, also reduced in some patients.
    Complex II was increased in one patient's muscle. Muscle histology ranges
    from normal to ragged-red and COX-deficient fibres. The defect is more
    pronounced in muscle than in fibroblasts.

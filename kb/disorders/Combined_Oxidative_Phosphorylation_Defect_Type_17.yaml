  - reference: PMID:21559454
    reference_title: "Localization of human RNase Z isoforms: dual nuclear/mitochondrial targeting of the ELAC2 gene product by alternative translation initiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that alternative translation initiation is responsible for the
      dual targeting of RNase Z(L).
    explanation: >-
      Establishes the mitochondrial and nuclear isoforms of ELAC2 produced from
      one transcript.
  - reference: PMID:29040705
    reference_title: "The MRPP1/MRPP2 complex is a tRNA-maturation platform in human mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      MRPP1/2 is not only a component of the mitochondrial RNase P but that it
      retains the tRNA product from the 5'-processing step and significantly
      enhances the efficiency of ELAC2-catalyzed 3'-processing
    explanation: >-
      Places ELAC2 downstream of, and partnered with, the MRPP1/MRPP2 subcomplex
      shared with COXPD30 and HSD10 disease. Indirect because the work is on
      wild-type proteins and does not test disease variants.
  - reference: PMID:39516281
    reference_title: "Structural basis of 3'-tRNA maturation by the human mitochondrial RNase Z complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Here, we present several cryo-EM structures of the mitochondrial RNase Z
      complex (ELAC2/SDR5C1/TRMT10C) bound to different maturation states of
      mitochondrial tRNAHis, showing the molecular basis for tRNA-substrate
      selection and catalysis.
    explanation: >-
      Structural definition of the mitochondrial RNase Z complex in which
      ELAC2 acts. Indirect because the structures are of wild-type complex.
  downstream:

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic ELAC2 variants, homozygous in consanguineous families (the
    recurrent c.460T>C p.Phe154Leu founder allele in Saudi and Kuwaiti families;
    c.1267C>T p.Leu423Phe; the c.1423+2T>A splice allele) and compound
    heterozygous in outbred families, often pairing a truncating or splice
    allele with a missense allele. Heterozygous parents are asymptomatic.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:42477863
    reference_title: "A Homozygous Founder ELAC2 Variant in Kuwaiti Infants With Fatal Cardiomyopathy and Refractory Severe Lactic Acidosis: A Retrospective Review of the Clinical, Cardiological and Molecular Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation analysis confirmed autosomal recessive inheritance in all
      families, with both parents of affected individuals shown to be
      heterozygous asymptomatic carriers.
    explanation: >-
      Segregation in 23 consanguineous Kuwaiti families confirms recessive
      inheritance with asymptomatic heterozygous carriers.
  - reference: PMID:23849775
    reference_title: "ELAC2 mutations cause a mitochondrial RNA processing defect associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together, the identification of four different alleles (Figure 1B) in five
      affected individuals from three families with a similar phenotype provides
      strong evidence for a disease-causing role of mutant ELAC2 in recessively
      inherited mitochondrial disease.
    explanation: >-
      The disease-defining report establishes recessive inheritance across
      three families.
pathophysiology:
- name: Biallelic ELAC2 Variants
  biological_scale: MOLECULAR
  description: >-
    Missense, nonsense, frameshift and canonical splice-site variants across
    ELAC2. In the reported genotypes at least one allele is typically a missense
    or splice variant that leaves some activity; a conditional mouse knockout is
    lethal, so complete loss is not expected to be compatible with a liveborn
    phenotype, although no human genotype has been shown to be fully null.
  genes:
  - preferred_term: ELAC2
    term:
      id: hgnc:14198
      label: ELAC2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    gene:
      preferred_term: ELAC2
      term:
        id: hgnc:14198
        label: ELAC2
    notes: >-
      Recorded as partial loss of function because the recurrent missense
      alleles reduce but do not abolish RNase Z activity in vitro (p.Phe154Leu
      and p.Thr520Ile at 20-80% of wild-type kcat/KM), and the splice alleles
      reduce ELAC2 expression. Zygosity and allele type are left off because
      both vary between families.
  evidence:
  - reference: PMID:23849775
    reference_title: "ELAC2 mutations cause a mitochondrial RNA processing defect associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the identification of mutations in ELAC2 in five individuals
      with infantile hypertrophic cardiomyopathy and complex I deficiency.
    explanation: >-
      The disease-defining report identifying biallelic ELAC2 variants.
  - reference: PMID:31045291
    reference_title: "Mutations in ELAC2 associated with hypertrophic cardiomyopathy impair mitochondrial tRNA 3'-end processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the identification of 16 novel ELAC2 variants in
      individuals presenting with mitochondrial respiratory chain deficiency,
      hypertrophic cardiomyopathy (HCM), and lactic acidosis.
    explanation: >-
      Extends the allelic series to 16 further variants with the same core
      phenotype.
  - reference: PMID:27769300
    reference_title: "A homozygous splicing mutation in ELAC2 suggests phenotypic variability including intellectual disability with minimal cardiac involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whole-exome sequencing identified a homozygous splicing mutation (c.1423 +
      2 T > A) in ELAC2 gene that disrupted the canonical donor splice site of
      intron 15 of all known isoforms
    explanation: >-
      Documents a canonical splice-site allele, the allele class associated
      with the neurological-predominant presentation.
  downstream:
  - target: Reduced Mitochondrial RNase Z Activity
    description: >-
      The variants lower ELAC2 catalytic efficiency or the amount of ELAC2
      protein.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31045291
      reference_title: "Mutations in ELAC2 associated with hypertrophic cardiomyopathy impair mitochondrial tRNA 3'-end processing."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Pathogenic variants in ELAC2 impair the RNase Z activity of this
        critical mitochondrial enzyme.
      explanation: >-
        Conclusion drawn from kinetic assays of recombinant mutant ELAC2 on
        mitochondrial pre-tRNA substrates.
- name: Reduced Mitochondrial RNase Z Activity
  biological_scale: MOLECULAR
  description: >-
    Two routes lead to the same deficit. Most missense substitutions leave a
    stable recombinant protein with reduced catalytic efficiency, mostly through
    lower kcat; the reduction ranges from moderate (p.Phe154Leu, p.Thr520Ile) to
    about 1% of wild type (p.Pro493Leu, p.Tyr729Cys). Other variants, including
    the c.1423+2T>A splice allele and the variants in the 2023 French series,
    reduce ELAC2 expression or protein abundance in patient cells. ELAC2 is dual
    targeted: translation from the first AUG produces the mitochondrial isoform
    and from the second AUG a nuclear isoform, and the disease mechanism curated
    here concerns the mitochondrial activity. ELAC2 acts in a complex with the
    MRPP1/MRPP2 (TRMT10C/HSD17B10) subcomplex, which retains the 5'-processed
    tRNA and enhances 3' cleavage.
  genes:
  - preferred_term: ELAC2
    term:
      id: hgnc:14198
      label: ELAC2
  molecular_functions:
  - preferred_term: 3'-tRNA processing endoribonuclease activity

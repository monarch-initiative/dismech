    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Biallelic NAGA loss-of-function variants (such as p.Arg329Trp, p.Arg329Gln, or
    p.Glu193*) destabilize the homodimeric lysosomal exoglycosidase or truncate the
    polypeptide, abolishing removal of terminal alpha-N-acetylgalactosamine residues from
    O-linked glycopeptides and glycolipids.

classifications:
  lysosomal_storage_category:
    classification_value: glycoproteinosis
    evidence:
    - reference: PMID:19683538
      reference_title: "The 1.9 a structure of human alpha-N-acetylgalactosaminidase: The molecular basis of Schindler and Kanzaki diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "alpha-N-acetylgalactosaminidase (alpha-NAGAL; E.C. 3.2.1.49) is a lysosomal exoglycosidase that cleaves terminal alpha-N-acetylgalactosamine residues from glycopeptides and glycolipids. In humans, a deficiency of alpha-NAGAL activity results in the lysosomal storage disorders Schindler disease and Kanzaki disease."
      explanation: "Deficient lysosomal degradation of O-linked glycopeptides and glycoproteins establishes Kanzaki disease as a glycoproteinosis."
  icimd_category:
  - classification_value: glycoprotein_degradation
    notes: "ICIMD (Ferreira et al. 2021, PMID:33340416): group 'Disorders of glycoprotein degradation' under category 'Disorders of complex molecule degradation'."
    evidence:
    - reference: PMID:19683538
      reference_title: "The 1.9 a structure of human alpha-N-acetylgalactosaminidase: The molecular basis of Schindler and Kanzaki diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The human lysosomal enzyme α-NAGAL (E.C. 3.2.1.49) removes terminal α-GalNAc monosaccharides from glycolipids and glycoproteins (primarily O-linked sugars attached to serine and threonine residues)"
      explanation: "Impaired lysosomal cleavage of O-linked glycoprotein terminal alpha-GalNAc residues places NAGA deficiency in disorders of glycoprotein degradation."
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:
    - reference: PMID:31890708
      reference_title: "A New Case of Schindler Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Schindler disease is an autosomal recessive, inherited LSD caused by defective or non-existent activity of the enzyme α-N-acetylgalactosaminidase (α-NAGA)."
      explanation: "As an inherited lysosomal storage disorder of glycoprotein catabolism, Kanzaki disease falls under metabolic storage disorders."
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:14685826
      reference_title: "Structural and immunocytochemical studies on alpha-N-acetylgalactosaminidase deficiency (Schindler/Kanzaki disease)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Alpha-N-acetylgalactosaminidase (alpha-NAGA) deficiency (Schindler/Kanzaki disease) is a clinically and pathologically heterogeneous genetic disease with a wide spectrum including an early onset neuroaxonal dystrophy (Schindler disease) and late onset angiokeratoma corporis diffusum (Kanzaki disease)."
      explanation: "Autosomal recessive single-enzyme deficiency in NAGA places the disorder in inherited genetic disease."

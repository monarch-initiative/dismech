  description: >-
    Small-molecule active-site pharmacological chaperones (such as iminosugar
    galactose/GalNAc mimetics) that stabilize misfolded mutant alpha-NAGA dimers
    have been investigated preclinically as potential disease-modifying agents
    but remain experimental.

    causal_link_type: DIRECT
    description: Loss of lysosomal alpha-NAGA exoglycosidase activity prevents cleavage of terminal alpha-GalNAc residues from O-linked glycopeptides.
- name: Lysosomal Tn-antigen Glycopeptide Accumulation
  biological_scale: CELLULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  description: >-
    Failure to cleave terminal alpha-N-acetylgalactosamine causes intralysosomal storage of
    Tn-antigen (GalNAc-alpha-1-O-Ser/Thr)-bearing O-linked glycopeptides demonstrated in
    cultured dermal fibroblasts, accompanied by systemic accumulation and urinary excretion
    of O-linked sialylglycopeptides; the intermediate tissue-level mechanisms linking
    glycopeptide storage to neurological, cochleovestibular, lymphatic, soft-tissue, and
    cardiac manifestations remain incompletely defined.

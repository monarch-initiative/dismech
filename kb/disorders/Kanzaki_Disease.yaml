diagnosis:
- name: Leukocyte and Fibroblast Alpha-NAGA Enzyme Activity Assay
  description: >-
    Biochemical assay of peripheral blood leukocytes or cultured skin fibroblasts
    demonstrates markedly diminished or absent alpha-N-acetylgalactosaminidase
    activity alongside normal alpha-galactosidase A activity (excluding Fabry disease).
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  presence: Markedly decreased or absent alpha-N-acetylgalactosaminidase catalytic activity in blood leukocytes or cultured fibroblasts
  measurements:
  - preferred_term: Alpha-NAGA activity
    term:
      id: LOINC:LP14015-9
      label: Alpha-N-acetylgalactosaminidase
  notes: >-
    Specimen-generic LOINC Part LP14015-9 is bound because alpha-NAGA activity
    is assayed across blood leukocytes or cultured skin fibroblasts rather than
    a single specimen type; alpha-galactosidase A is not bound because its
    normal activity is measured solely to exclude Fabry disease. No
    reference_ranges band is recorded because the cited source reports
    diminished activity qualitatively without a numeric cut-off.
  evidence:
  - reference: PMID:31890708
    reference_title: "A New Case of Schindler Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enzymatic analysis through a blood test shows diminished α-NAGA activity"
    explanation: Reduced alpha-NAGA enzyme activity is the primary biochemical diagnostic test.

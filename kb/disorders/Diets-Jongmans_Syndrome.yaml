      explanation: >-
        Mouse evidence connecting Kdm3b-dependent IGF-1 maintenance to
        postnatal growth.
- name: Impaired Hematopoietic Stem and Progenitor Cell Differentiation
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Homozygous Jmjd1b (Kdm3b) knockout mice fail to activate genes needed for
    hematopoietic stem and progenitor cell differentiation and show leukocytosis,
    mild anemia and granulocytosis, which the authors correlate with
    myelodysplastic syndrome. This is a homozygous-null phenotype. It has not
    been shown in heterozygous animals or in people with the syndrome, and it is
    deliberately not connected to the leukemia, lymphoma or neutropenia
    phenotypes, whose relationship to germline KDM3B variants is unestablished
    (see the cancer-predisposition discussion).
  cell_types:

name: Diets-Jongmans Syndrome
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
synonyms:
- DIJOS
- Intellectual developmental disorder with distinctive facial dysmorphism
- KDM3B-related intellectual disability-facial dysmorphism-short stature syndrome
- KDM3B-related neurodevelopmental disorder
description: >-
  Diets-Jongmans syndrome (DIJOS) is an autosomal dominant neurodevelopmental
  syndrome caused by heterozygous germline variants in KDM3B (5q31.2), which
  encodes a JmjC-domain histone demethylase that removes mono- and
  di-methylation from histone H3 lysine 9 (H3K9me1/2) and, in mouse
  hematopoietic cells, symmetric dimethylation from histone H4 arginine 3.
  The syndrome was delineated in 2019 from 17 individuals (14 probands and 3
  similarly affected parents) and is defined by developmental delay or mild to
  moderate intellectual disability affecting motor and language function,
  short stature, neonatal feeding difficulties, and a facial gestalt (long
  ears, broad nasal tip, low-hanging columella, wide mouth, thin upper lip
  vermilion, pointed chin) that computational facial analysis separates from
  other intellectual-disability syndromes. Behavioral features (ADHD, autism
  spectrum disorder), childhood hypotonia, epilepsy, joint hypermobility,
  hearing loss and isolated congenital anomalies (hernias, cryptorchidism) are
  variably present. Most variants arise de novo; transmission
  from similarly or more mildly affected parents is documented, and later
  reports describe individuals whose presentation is predominantly growth
  restriction with normal or mildly impaired cognition, so expressivity is
  markedly variable. Two of the 17 founding individuals developed a childhood
  hematologic malignancy (acute myeloid leukemia, Hodgkin lymphoma), but both
  were ascertained through a childhood cancer predisposition study, and whether
  germline KDM3B variants raise cancer risk is unresolved.
disease_term:
  preferred_term: Diets-Jongmans syndrome
  description: >-
    Autosomal dominant KDM3B-related syndrome of developmental delay or
    intellectual disability, short stature and facial dysmorphism (OMIM:618846).
  term:
    id: MONDO:0030012
    label: Diets-Jongmans syndrome
parents:
- Neurodevelopmental disorder
- Chromatinopathy
- Epigenetic machinery disorder
notes: >-
  Lump/split. The entry is a single Disease: DIJOS has one causal gene, no MONDO
  subtypes, and one conserved mechanism (reduced KDM3B dosage), and no
  allelic subtype has been proposed. The growth-predominant presentations with
  normal or mildly impaired neurodevelopment (PMID:41898828, PMID:41239187, and
  the short-statured transmitting mother without intellectual disability in
  PMID:41878155) are modeled as variable expressivity within the one entity
  rather than as a separate subtype, because they occur in the same families
  and with the same variant classes as the classic presentation. A tentative
  genotype-phenotype suggestion (truncating variants associated with milder
  neurodevelopmental involvement than missense variants; PMID:41898828) is
  recorded as an open question rather than used to split the entry.

  Ontology duplication. MONDO currently carries two classes for this disease:
  MONDO:0030012 "Diets-Jongmans syndrome" (xref OMIM:618846, a child of
  "hereditary disease") and MONDO:0858999 "KDM3B-related intellectual
  disability-facial dysmorphism-short stature syndrome" (xref ORPHA:633004, a
  child of "multiple congenital anomalies/dysmorphic syndrome-intellectual
  disability"). Orphanet itself maps ORPHA:633004 to OMIM:618846 as an exact
  match and lists "Diets-Jongmans Syndrome" as its synonym, so the two MONDO
  classes denote one disease; MONDO:0858999 is recorded as an exact mapping
  below. Orphanet's own ORPHA:633004 row names MONDO:0858999, not
  MONDO:0030012.

  Germline disorder versus somatic tumor biology. KDM3B lies in the 5q31
  region deleted in myeloid neoplasms and was proposed as a candidate 5q31
  myeloid tumor suppressor from somatic studies (PMID:11687974, PMID:21536236,
  PMID:28540746); homozygous Jmjd1b/Kdm3b-null mice show hematopoietic
  abnormalities the authors correlate with myelodysplastic syndrome
  (PMID:29641999). That somatic and model-organism literature is kept in the
  cancer-predisposition discussion below and is not curated as mechanism of
  this germline syndrome. The acute myeloid leukemia and Hodgkin lymphoma
  phenotypes are recorded because individuals with the syndrome were reported
  with them; they are not connected to any pathophysiology node, because
  causality is unestablished and both cases were ascertained through a
  cancer-predisposition study.

  Evidence available for the founding cohort. The founding report
  (PMID:30929739) is not open access: its publisher blocks PMC XML download,
  Europe PMC serves no full text for it, and the only open location Unpaywall
  lists is a publisher PDF that refuses automated retrieval. Only its PubMed
  abstract can be quoted and checked by this repository's reference validator.
  Founding-cohort phenotype counts are therefore cited from the pooled Table 3
  of the 2026 case series and literature review (PMID:41898828), which
  tabulates each feature for the Diets cohort and for all 27 published
  individuals, and features named only in the founding paper's abstract are
  cited there directly. Statements that exist only in the founding paper's full
  text are not curated: the ocular findings (nystagmus, strabismus, refraction
  anomalies), aggressive behavior without a psychiatric diagnosis, hypospadias,
  the per-feature Table 2 denominators, the transient character of the
  epilepsy, the exclusion of loss of heterozygosity and a second KDM3B hit in
  the leukemia, the inconclusive HEK293 H3K9-methylation assay of the missense
  variants, the statement that no genotype-phenotype correlation was observed,
  and the authors' advice against malignancy screening.

  Gaps. No GeneReviews chapter exists (checked against the Bookshelf index and
  PubMed). ClinGen has a Definitive gene-disease validity assertion for KDM3B,
  but it is made against the broader "syndromic intellectual disability"
  (MONDO:0000508), not against MONDO:0030012; ClinGen has no dosage-sensitivity
  curation for KDM3B. No whole-gene or intragenic KDM3B deletion has been
  reported as a cause of the syndrome: the PubMed query "5q31.2 AND deletion AND
  (intellectual OR developmental) AND KDM3B" returned no records, and every
  reported case carries a single-nucleotide, small-indel or splice variant. No
  patient-derived chromatin, transcriptome or DNA-methylation (episignature)
  data exist; the PubMed query "KDM3B AND (episignature OR DNA methylation
  signature)" returned two records, neither about a KDM3B-associated
  syndrome (PMID:31271662 on JMJD1C inhibitors in leukemia cells, PMID:28706564
  on vitamin C and H3K9me2 in mouse embryonic stem cells). No source was found
  that states a numerical recurrence risk, so none is given. A child with
  pulmonary arterial hypertension and interstitial lung disease carrying both a
  KDM3B and a SIN3A variant (PMID:38314229) is not curated as a phenotype,
  because the second diagnosis confounds attribution.

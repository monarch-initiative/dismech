pathophysiology:
- name: KDM3B Heterozygous Loss of Function
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  role: trigger
  description: >-
    A heterozygous germline KDM3B variant reduces functional KDM3B, a JmjC-domain
    demethylase of H3K9me1/2. Haploinsufficiency is the proposed mechanism on
    the strength of the nonsense, frameshift and splice variants (one splice
    variant shown to produce truncated transcripts) and the gene's constraint
    against loss of function. It is not established for the missense variants,
    whose effect on demethylase activity has not been measured experimentally.
    The confidence is therefore PROVISIONAL rather than ESTABLISHED.
  genes:
  - preferred_term: KDM3B
    term:
      id: hgnc:1337
      label: KDM3B
  molecular_functions:
  - preferred_term: histone H3K9me1/me2 demethylase activity
    term:
      id: GO:0140683
      label: histone H3K9me/H3K9me2 demethylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30929739
    reference_title: "De Novo and Inherited Pathogenic Variants in KDM3B Cause Intellectual Disability, Short Stature, and Facial Dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified missense and truncating variants, suggesting that KDM3B
      haploinsufficiency is the underlying mechanism for this syndrome.
    explanation: >-
      The founding cohort proposes haploinsufficiency from the variant spectrum.
  - reference: PMID:36757469
    reference_title: "Two patients with KDM3B variants and new presentations of Diets-Jongmans syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptional experiments of the splicing variant c.5070 + 1G > A
      revealed aberrant transcripts leading to truncated protein products.
    explanation: >-
      Minigene evidence that a canonical splice variant yields truncated
      products, consistent with loss of function.
  - reference: PMID:23593242
    reference_title: "Protein complex interactor analysis and differential activity of KDM3 subfamily members towards H3K9 methylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that full-length KDM3A and KDM3B are H3K9me1/2 histone
      demethylases whereas we fail to observe histone demethylase activity for
      JMJD1C using immunocytochemical and biochemical approaches.
    explanation: >-
      Establishes KDM3B's substrate specificity (H3K9me1/2), the activity the
      GO binding records.
  - reference: PMID:22615488
    reference_title: "KDM3B is the H3K9 demethylase involved in transcriptional activation of lmo2 in leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      KDM3B displayed histone H3K9-me1/2 demethylase activity
    explanation: >-
      Independent biochemical confirmation of H3K9me1/2 demethylase activity.
  downstream:
  - target: Increased H3K9 Methylation at KDM3B Target Loci
    causal_link_type: DIRECT
    description: >-
      Reduced KDM3B dosage lowers removal of H3K9me1/2 at the loci it acts on.
    evidence:
    - reference: PMID:34217333
      reference_title: "Kdm3b haploinsufficiency impairs the consolidation of cerebellum-dependent motor memory in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we used heterozygous Kdm3b knockout (Kdm3b+/-) mice, which show reduced
        lysine 9 on histone 3 (H3K9) demethylase activity. H3K9 di-methylation
        is significantly increased selectively in the granule cell layer of the
        cerebellum of Kdm3b+/- mice.
      explanation: >-
        In a heterozygous (haploinsufficiency) mouse model, halving Kdm3b
        increases H3K9me2 in cerebellar granule cells, supporting this edge.
- name: Increased H3K9 Methylation at KDM3B Target Loci
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    With less KDM3B, repressive H3K9me1/2 accumulates at its target loci. This
    has been shown in Kdm3b heterozygous mouse cerebellum (H3K9me2) and in
    Kdm3b knockout mouse ovary and uterus (H3K9me1/2/3). In homozygous
    Jmjd1b-null mouse hematopoietic cells, symmetric dimethylation of histone
    H4 arginine 3 (H4R3me2s) also fails to be removed at a distinct set of
    genes. The state has not been measured in cells or tissue from people
    with the syndrome.
  cell_types:
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  biological_processes:
  - preferred_term: epigenetic regulation of gene expression
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25892958
    reference_title: "The histone H3K9 demethylase Kdm3b is required for somatic growth and female reproductive function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      these female reproductive phenotypes were associated with significantly
      increased levels of H3K9me1/2/3 in the ovary and uterus.
    explanation: >-
      Kdm3b loss raises H3K9 methylation in vivo in the tissues examined.
  - reference: PMID:29641999
    reference_title: "JMJD1B Demethylates H4R3me2s and H3K9me2 to Facilitate Gene Expression for Development of Hematopoietic Stem and Progenitor Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      knockout of JMJD1B blocks demethylation of H4R3me2s and/or H3K9me2 at
      distinct clusters of genes and impairs the activation of genes important
      for HSPC differentiation and development.
    explanation: >-
      In homozygous knockout hematopoietic cells, loss of JMJD1B (KDM3B)
      leaves H3K9me2 and H4R3me2s in place at specific gene clusters.
  downstream:
  - target: Altered Expression of Plasticity-Related Genes
    causal_link_type: DIRECT
    description: >-
      H3K9me2 is a repressive mark; its accumulation is expected to lower
      activation of KDM3B target genes. Shown for plasticity-related genes in
      heterozygous mouse cerebellum.
  - target: Reduced Circulating IGF-1
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In Kdm3b knockout mice, loss of Kdm3b lowers renal IGFBP-3 expression and
      circulating IGF-1. The chromatin intermediates between Kdm3b loss and
      reduced IGFBP-3 expression were not characterized.
  - target: Impaired Hematopoietic Stem and Progenitor Cell Differentiation
    causal_link_type: DIRECT
    description: >-
      In homozygous Jmjd1b-null mice, failure to demethylate H4R3me2s and/or
      H3K9me2 blocks activation of genes needed for hematopoietic stem and
      progenitor cell differentiation.
    evidence:
    - reference: PMID:29641999
      reference_title: "JMJD1B Demethylates H4R3me2s and H3K9me2 to Facilitate Gene Expression for Development of Hematopoietic Stem and Progenitor Cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        knockout of JMJD1B blocks demethylation of H4R3me2s and/or H3K9me2 at
        distinct clusters of genes and impairs the activation of genes important
        for HSPC differentiation and development.
      explanation: >-
        Links the chromatin-state change to the hematopoietic differentiation
        defect in the knockout.
- name: Altered Expression of Plasticity-Related Genes
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In Kdm3b heterozygous mouse cerebellum, RNA-seq showed altered expression of
    several plasticity-related genes. Which KDM3B target genes are dysregulated
    in the developing human brain is unknown.
  cell_types:
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  evidence:
  - reference: PMID:34217333
    reference_title: "Kdm3b haploinsufficiency impairs the consolidation of cerebellum-dependent motor memory in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNA-seq analyses revealed that the expression levels of several
      plasticity-related genes were altered in the mutant cerebellum.
    explanation: >-
      Transcriptional consequence in the heterozygous haploinsufficiency model.
  downstream:
  - target: Impaired Memory Consolidation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors connect active histone-methylation regulation to cerebellar
      memory consolidation; which altered genes mediate the deficit was not
      determined.
    evidence:
    - reference: PMID:34217333
      reference_title: "Kdm3b haploinsufficiency impairs the consolidation of cerebellum-dependent motor memory in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our study suggests that active regulation of histone methylation is
        critical for the consolidation of cerebellar motor memory.
      explanation: >-
        The authors' conclusion linking the chromatin and transcriptional
        changes to the memory phenotype.
- name: Impaired Memory Consolidation
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Impaired Neuronal Maturation, Plasticity, and Postnatal Neurogenesis"
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Kdm3b heterozygous mice have normal basal oculomotor performance and normal
    acquisition of cerebellum-dependent optokinetic learning but fail to
    consolidate the memory. This is the only neural-plasticity phenotype
    reported for a Kdm3b haploinsufficiency model. Its relevance to the human
    intellectual disability and developmental delay is an inference, and the
    edges from this node to those phenotypes carry no direct evidence.
  biological_processes:
  - preferred_term: motor learning
    term:
      id: GO:0061743
      label: motor learning
    modifier: DECREASED
  - preferred_term: memory
    term:
      id: GO:0007613
      label: memory
    modifier: DECREASED
  evidence:
  - reference: PMID:34217333
    reference_title: "Kdm3b haploinsufficiency impairs the consolidation of cerebellum-dependent motor memory in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the cerebellum-dependent optokinetic response (OKR) learning, Kdm3b+/-
      mice show deficits in memory consolidation, whereas they are normal in
      basal oculomotor performance and OKR acquisition.
    explanation: >-
      Direct behavioral evidence of the plasticity deficit in the
      haploinsufficiency model.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred by analogy with the module chain; no study links the mouse
      memory-consolidation deficit to the human cognitive phenotype.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred by analogy with the module chain; not directly tested.
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred by analogy with the module chain; not directly tested.
  - target: Motor delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred; the mouse deficit is in cerebellar motor-memory consolidation,
      whereas the human phenotype is delayed motor milestones.
- name: Reduced Circulating IGF-1
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In Kdm3b knockout mice, loss of Kdm3b reduces renal IGFBP-3 expression and
    circulating IGFBP-3, which accelerates IGF-1 degradation and lowers
    circulating IGF-1, with restricted postnatal growth. A later review
    proposes this as the explanation for the short stature of people with KDM3B
    variants; it has not been demonstrated in patients. This mouse mechanism is
    IGF-1 loss through IGFBP-3, not growth hormone deficiency; growth hormone
    deficiency, documented in one individual, is recorded separately as a
    phenotype.
  biological_processes:

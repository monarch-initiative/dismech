treatments:
- name: Recombinant human growth hormone
  description: >-
    Recombinant human growth hormone has been given to one individual with the
    syndrome, whose height moved from below -3 SD to between -1 and -2 SD over
    about six years, with IGF-1, thyroid function and glucose remaining within
    normal ranges on monitoring. The treating authors describe the effect as
    partially promoting growth and do not report growth hormone deficiency in
    this individual, so the indication was short stature rather than a
    documented hormone deficit; growth hormone deficiency in this syndrome,
    documented in two other individuals, is recorded separately as a phenotype.
    The treating authors caution that, because KDM3B has been linked to
    myelodysplastic syndrome and acute myeloid leukemia, the potential
    oncogenic risk of growth hormone must be weighed; no guideline addresses
    this. Evidence is a single treated case.
  therapeutic_modality: PROTEIN_REPLACEMENT

prevalence:
- population: Worldwide, published molecularly confirmed individuals
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2026 literature review counted 27 published individuals (23 from six
    earlier reports plus its own four). Several further case reports have
    appeared since, so this is a lower bound on published cases, not a
    population frequency.
  evidence:
  - reference: PMID:41898828
    reference_title: "De Novo Heterozygous KDM3B Variants Expand the Mutational Spectrum of Diets-Jongmans Syndrome: Case Series and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined with our study, a total of 27 patients with DIJOS have been
      described to date.
    explanation: >-
      Pooled count of published individuals at the time of that review.
inheritance:
- name: Autosomal dominant, mostly de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  de_novo_rate: >-
    Across the published cases the great majority of variants are de novo, with
    only a minority inherited from a similarly affected parent.
  description: >-
    Heterozygous KDM3B variants cause the syndrome in a dominant manner. Most
    arise de novo, but parent-to-child transmission is documented, including
    from parents with milder phenotypes (a mother with short stature and no
    intellectual disability; a family in which only one of four affected
    relatives met criteria for intellectual developmental disorder), which is
    the basis for recording variable expressivity. Penetrance has not been
    formally estimated.
  evidence:
  - reference: PMID:30929739
    reference_title: "De Novo and Inherited Pathogenic Variants in KDM3B Cause Intellectual Disability, Short Stature, and Facial Dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using exome sequencing and a gene matching approach, we identified de
      novo and inherited pathogenic variants in KDM3B in 14 unrelated
      individuals and three affected parents with varying degrees of
      intellectual disability (ID) or developmental delay (DD) and short
      stature.
    explanation: >-
      The founding report identifies both de novo variants and variants
      inherited from affected parents.
  - reference: PMID:41898828
    reference_title: "De Novo Heterozygous KDM3B Variants Expand the Mutational Spectrum of Diets-Jongmans Syndrome: Case Series and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In terms of variant origin, the vast majority were sporadic de novo
      variants, with only a minority being familial.
    explanation: >-
      Pooled variant-origin tally across the published cases, supporting the
      recorded de novo rate.
  - reference: PMID:41878155
    reference_title: "Diets-Jongmans Syndrome due to a Novel KDM3B Variant: The First Molecularly Confirmed Case from Turkey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short stature without intellectual disability was noted in the mother,
      indicating intrafamilial phenotypic variability.
    explanation: >-
      A transmitting parent with a milder phenotype than her child, supporting
      variable expressivity.
  - reference: PMID:42186234
    reference_title: "The variable neuropsychological profile of Diets-Jongmans syndrome: a case series of four family members."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cognitive profile of DIJOS is more variable than suggested by existing
      literature, with only 1 of 4 family members meeting DSM-5-TR criteria for
      IDD.
    explanation: >-
      Intrafamilial variability in cognitive outcome among relatives sharing one
      variant.
genetic:
- name: KDM3B
  gene_term:
    preferred_term: KDM3B
    term:
      id: hgnc:1337
      label: KDM3B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported disease-associated variants comprise missense, nonsense,
    frameshift and splice-site variants, and missense variants have been
    reported in the catalytic Jumonji-C (JmjC) domain. Whether variant class
    predicts neurodevelopmental severity is unsettled; see the
    missense-mechanism discussion.
  notes: >-
    KDM3B (lysine demethylase 3B; previous symbol JMJD1B) is at 5q31.2. Variant
    origin is recorded as GERMLINE because both de novo and parentally
    transmitted variants are reported (see the inheritance block). ClinGen's
    Definitive classification is for "syndromic intellectual disability"
    (MONDO:0000508), a broader disease concept than this entry.
  evidence:

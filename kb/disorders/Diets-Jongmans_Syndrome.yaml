discussions:
- discussion_id: dijos_cancer_predisposition
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do germline KDM3B variants predispose to childhood hematologic malignancy,
    and should people with Diets-Jongmans syndrome have any cancer surveillance?
  attaches_to:
  - phenotypes#Acute myeloid leukemia
  - phenotypes#Hodgkin lymphoma
  - pathophysiology#Impaired Hematopoietic Stem and Progenitor Cell Differentiation
  rationale: >-
    Two of the 17 founding individuals had a childhood hematologic malignancy,
    but both were recruited through a childhood cancer predisposition exome
    study, which introduces ascertainment bias. None of the later case reports
    and series cited in this entry (about ten further individuals) describes a
    malignancy, though follow-up in them is short. Separately,
    KDM3B lies in the 5q31 region lost in myeloid neoplasms and was proposed as
    a candidate somatic tumor suppressor there, and homozygous Kdm3b-null mice
    have hematopoietic abnormalities resembling myelodysplastic syndrome. The
    somatic evidence is not uniformly tumor-suppressive: in other leukemia cell
    work KDM3B activates the LMO2 oncogene and represses differentiation. None
    of this somatic or homozygous-model evidence establishes that a single
    germline loss-of-function allele raises cancer risk, and no surveillance
    guideline addresses the syndrome. One later report cites the leukemia
    association when weighing growth hormone therapy.
  proposed_experiments:
  - experiment_id: exp_dijos_malignancy_incidence_cohort
    name: Malignancy incidence in individuals ascertained for developmental phenotypes
    description: >-
      Follow individuals with DIJOS ascertained through developmental or
      growth referral (not through cancer studies) and compare observed with
      expected childhood hematologic malignancy incidence.
  - experiment_id: exp_kdm3b_heterozygous_hematopoiesis
    name: Hematopoiesis in Kdm3b heterozygous mice
    description: >-
      Test whether heterozygous, rather than homozygous-null, Kdm3b mice
      develop myelodysplasia-like changes or leukemia with aging or
      cooperating lesions.
  evidence:
  - reference: PMID:29351919
    reference_title: "High Yield of Pathogenic Germline Mutations Causative or Likely Causative of the Cancer Phenotype in Selected Children with Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we identified two genes, KDM3B and TYK2, which are possibly
      involved in genetic cancer predisposition.
    explanation: >-
      The childhood cancer predisposition exome study through which the two
      affected individuals were ascertained proposes KDM3B only as a possible
      predisposition gene.
  - reference: PMID:11687974
    reference_title: "A novel nuclear protein, 5qNCA (LOC51780) is a candidate for the myeloid leukemia tumor suppressor gene on chromosome 5 band q31."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose 5qNCA is a good candidate for the del(5q) tumor suppressor gene
      based on its predicted function and growth suppressive activities
    explanation: >-
      Somatic context only. 5qNCA is the former name of KDM3B; proposed as a
      5q31 myeloid tumor suppressor candidate from somatic deletion mapping and
      cell-line growth suppression, not from germline data.
  - reference: PMID:21536236
    reference_title: "A cryptic deletion in 5q31.2 provides further evidence for a minimally deleted region in myelodysplastic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggests that the proximal boundary of the common deleted region may lie
      within the KDM3B gene
    explanation: >-
      Somatic context only: a myelodysplastic-syndrome case with a cryptic 5q31.2
      deletion places the deleted-region boundary within KDM3B.
  - reference: PMID:28540746
    reference_title: "KDM3B shows tumor-suppressive activity and transcriptionally regulates HOXA1 through retinoic acid response elements in acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Collectively, we found that KDM3B exhibits potential tumor-suppressive
      activity and transcriptionally modulates HOXA1 expression via RARE in AML.
    explanation: >-
      Somatic/cell-line context only: KDM3B shows tumor-suppressive activity in
      AML cell lines.
  - reference: PMID:22615488
    reference_title: "KDM3B is the H3K9 demethylase involved in transcriptional activation of lmo2 in leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The combined results of this study provide evidence that the H3K9-me1/2
      demethylase KDM3B might play a role in leukemogenesis via activation of
      lmo2
    explanation: >-
      Somatic/cell-line context: here KDM3B acts in a leukemia-promoting
      direction, supporting the rationale's statement that its somatic role is
      not uniformly tumor-suppressive.
  - reference: PMID:29641999
    reference_title: "JMJD1B Demethylates H4R3me2s and H3K9me2 to Facilitate Gene Expression for Development of Hematopoietic Stem and Progenitor Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results suggest that JMJD1B might be a tumor suppressor gene and
      contribute to MDS through regulation of the H4R3me2s marker to regulate
      gene expression.
    explanation: >-
      Homozygous knockout mouse evidence that the authors interpret as a
      tumor-suppressor role in myelodysplastic syndrome.
- discussion_id: dijos_missense_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the disease-associated KDM3B missense variants reduce demethylase
    activity (haploinsufficiency-equivalent), or act by another mechanism, and
    does variant class predict neurodevelopmental severity?
  attaches_to:
  - pathophysiology#KDM3B Heterozygous Loss of Function
  - genetic#KDM3B
  rationale: >-
    Haploinsufficiency is inferred from truncating and splice variants. About
    half of reported variants are missense, and their effect on demethylase
    activity has not been measured: the one reported assessment of a missense
    variant is an in silico structural prediction. A later review suggests that
    truncating variants may be associated with milder neurodevelopmental
    involvement than missense variants, which would imply that some missense
    variants act other than by simple loss of function, but that observation
    rests on small numbers.
  proposed_experiments:
  - experiment_id: exp_kdm3b_missense_demethylase_assay
    name: Demethylase activity of patient missense variants
    description: >-
      Measure H3K9me1/2 (and H4R3me2s) demethylase activity and protein
      stability of each reported missense variant against wild type at matched
      expression levels.
  evidence:
  - reference: PMID:41898828
    reference_title: "De Novo Heterozygous KDM3B Variants Expand the Mutational Spectrum of Diets-Jongmans Syndrome: Case Series and Literature Review."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Experimental validation is required to confirm the predicted local
      conformational changes and their functional implications for KDM3B
      enzymatic activity.
    explanation: >-
      The only reported assessment of a disease-associated missense variant is
      an in silico structural prediction, which its authors state needs
      experimental validation.
  - reference: PMID:41898828
    reference_title: "De Novo Heterozygous KDM3B Variants Expand the Mutational Spectrum of Diets-Jongmans Syndrome: Case Series and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This finding suggests that LOF variants may confer a relatively milder
      neurodevelopmental phenotype
    explanation: >-
      Tentative genotype-phenotype suggestion from pooled small numbers.
- discussion_id: dijos_mouse_to_human_neurodevelopment
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the cerebellar motor-memory consolidation deficit of Kdm3b heterozygous
    mice a valid model of the developmental delay and intellectual disability
    of Diets-Jongmans syndrome?
  attaches_to:
  - pathophysiology#Altered Expression of Plasticity-Related Genes
  - pathophysiology#Impaired Memory Consolidation
  rationale: >-
    The heterozygous mouse is the right genetic model for a haploinsufficiency
    disorder, and it shows increased H3K9me2 and altered plasticity-gene
    expression in the cerebellum. But its phenotype is a selective deficit in
    consolidating one cerebellum-dependent memory, with normal acquisition and
    basal performance, whereas the human syndrome is global developmental and
    language delay beginning in infancy. No developmental, cortical or
    language-relevant phenotype has been reported in the mouse, and no
    patient-derived neural cells have been studied.
  proposed_experiments:
  - experiment_id: exp_kdm3b_patient_ipsc_neurons
    name: Patient-derived neuronal chromatin and transcriptome profiling
    description: >-
      Profile H3K9me2 and gene expression in iPSC-derived cortical neurons from
      individuals with truncating and missense KDM3B variants against isogenic
      corrected controls.
  evidence:
  - reference: PMID:34217333
    reference_title: "Kdm3b haploinsufficiency impairs the consolidation of cerebellum-dependent motor memory in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the cerebellum-dependent optokinetic response (OKR) learning, Kdm3b+/-
      mice show deficits in memory consolidation, whereas they are normal in
      basal oculomotor performance and OKR acquisition.
    explanation: >-
      The mouse phenotype is narrow and adult-behavioral, unlike the human
      developmental phenotype.

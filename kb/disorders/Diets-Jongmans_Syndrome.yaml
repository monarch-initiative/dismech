  evidence:
  - reference: PMID:25892958
    reference_title: "The histone H3K9 demethylase Kdm3b is required for somatic growth and female reproductive function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that Kdm3b ablation decreased IGFBP-3 expressed in the kidney by
      53% and significantly reduced IGFBP-3 in the blood, which caused an
      accelerated degradation of IGF-1 and a 36% decrease in circulating IGF-1
      concentration.
    explanation: >-
      Mouse knockout evidence for the IGFBP-3/IGF-1 mechanism.
  - reference: PMID:41898828
    reference_title: "De Novo Heterozygous KDM3B Variants Expand the Mutational Spectrum of Diets-Jongmans Syndrome: Case Series and Literature Review."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, postnatal somatic growth restriction in Kdm3b-null mice is
      closely associated with reduced levels of insulin-like growth factor
      binding protein-3 (IGFBP-3) in the kidney and blood, as well as reduced
      serum insulin-like growth factor-1 (IGF-1).
    explanation: >-
      The review restates the mouse IGFBP-3/IGF-1 result as the proposed
      explanation for short stature in this syndrome; the quoted sentence
      describes knockout mice, not patients, so the human claim follows only
      by extrapolation.
  downstream:
  - target: Short stature
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Lower circulating IGF-1 restricts postnatal somatic growth in the mouse;
      proposed, not demonstrated, as the cause of human short stature.
    evidence:
    - reference: PMID:25892958
      reference_title: "The histone H3K9 demethylase Kdm3b is required for somatic growth and female reproductive function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that Kdm3b-mediated H3K9 demethylation plays
        essential roles in maintenance of the circulating IGF-1, postnatal
        somatic growth, circulating 17beta-estradiol, and female reproductive

    reference_title: The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lowry Wood syndrome (LWS; OMIM #226969) is characterized by multiple epiphyseal dysplasia (MED) without spinal involvement"
    explanation: >-

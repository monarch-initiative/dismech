pathophysiology:
- name: Biallelic Hypomorphic RNU4ATAC Variants
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    RNU4ATAC (2q14.2) is a non-protein-coding gene for U4atac snRNA. Lowry-Wood
    syndrome arises from biallelic variants that impair, but do not abolish,
    U4atac function. Compared with MOPD I, whose variants concentrate in the
    5' stem-loop needed for U4atac/U6atac.U5 tri-snRNP formation, the variants
    reported in Lowry-Wood syndrome are dispersed across the RNA and affect less
    conserved nucleotides, which fits its milder phenotype. The correlation is
    imperfect: the same alleles (for example n.46G>A and n.111G>A) recur across
    all three named RNU4ATAC phenotypes.
  genes:
  - preferred_term: RNU4ATAC
    term:
      id: hgnc:34016
      label: RNU4ATAC
  molecular_functions:
  - preferred_term: U4atac base-pairing with U6atac snRNA
    term:
      id: GO:0030624
      label: U6atac snRNA binding
    modifier: DECREASED
  downstream:
  - target: Defective U12-Type Minor Intron Splicing
  evidence:
  - reference: PMID:29265708
    reference_title: The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe three patients with Lowry Wood syndrome with biallelic RNU4ATAC pathogenic variants."
    explanation: Establishes biallelic RNU4ATAC variants as the cause of the syndrome.
  - reference: PMID:29265708
    reference_title: The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "where they are likely to disrupt both internal pairing to form the loop structure and essential base-pairing with u6atac"
    explanation: >-
      The first confirmed patient's two variants are predicted, not shown, to
      disrupt U4atac base-pairing with U6atac, the molecular function bound on
      this node.
  - reference: PMID:30368667
    reference_title: "Lowry-Wood syndrome: further evidence of association with RNU4ATAC, and correlation between genotype and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FitCons scores for nucleotides mutated in the more severe MOPD are higher than RS or LWS and that they were more frequently located in the 5' Stem-Loop of the RNA critical for the formation of the U4/U6.U5 tri-snRNP complex, whereas the variants are more dispersed in the other conditions"
    explanation: >-
      Supports the genotype-phenotype pattern placing Lowry-Wood variants at
      less conserved, more dispersed positions than MOPD I variants.
  - reference: PMID:32628740
    reference_title: "Clinical interpretation of variants identified in RNU4ATAC, a non-coding spliceosomal gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "variants found in RFMN patients were globally associated with stronger effects than those identified in TALS patients, while those identified in LWS had the lowest effects"
    explanation: >-
      A splicing-efficiency assay of RNU4ATAC variants found the smallest
      functional effects for Lowry-Wood alleles, consistent with hypomorphic
      variants.
- name: Defective U12-Type Minor Intron Splicing
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  biological_scale: MOLECULAR
  description: >-
    U4atac base-pairs with U6atac and is required to excise U12-type (minor)
    introns, present in roughly 750 human genes. In peripheral blood
    mononuclear cells from an adult with Lowry-Wood syndrome, minor intron
    retention was markedly elevated over his heterozygous father and healthy
    controls, and alternative splicing around minor introns was increased, so
    the splicing lesion has been measured directly in this phenotype rather than
    only inferred from MOPD I and Roifman syndrome.
  biological_processes:
  - preferred_term: U12-type (minor) intron splicing
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  cellular_components:
  - preferred_term: U12-type (minor) spliceosome
    term:
      id: GO:0005689
      label: U12-type spliceosomal complex
  downstream:
  - target: Secondary Primary Cilium Dysfunction
  - target: Decreased Serum Immunoglobulins
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Low IgG and IgM without clinical immunodeficiency have been documented in
      Lowry-Wood syndrome. In Roifman syndrome the corresponding defect is a
      transitional B-cell arrest from disturbed minor splicing of MAPK1, but
      that route has not been studied in Lowry-Wood syndrome.
  evidence:
  - reference: PMID:30368667
    reference_title: "Lowry-Wood syndrome: further evidence of association with RNU4ATAC, and correlation between genotype and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in RNU4ATAC, an RNA of the minor spliceosome important for the excision of U12-dependent introns, have been recently associated with LWS."
    explanation: Places the causal gene in the minor (U12-dependent) splicing pathway.
  - reference: PMID:33660780
    reference_title: "Disruption of exon-bridging interactions between the minor and major spliceosomes results in alternative splicing around minor introns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This revealed that the median %MSIRet was significantly elevated in the individual with Lowry–Wood syndrome (60%) compared to the unaffected carrier (26%) and the unrelated healthy controls (P< 0.0001)."
    explanation: >-
      Direct measurement of increased minor intron retention in cells from a
      patient with Lowry-Wood syndrome.
  - reference: PMID:33660780
    reference_title: "Disruption of exon-bridging interactions between the minor and major spliceosomes results in alternative splicing around minor introns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we detected alternatively spliced MIG transcripts in peripheral blood mononuclear cells (PBMCs) from individuals with Roifman syndrome (RNU4ATAC), Lowry–Wood syndrome (RNU4ATAC) and early-onset cerebellar ataxia (RNU12), suggesting they contribute to disease pathogenesis"
    explanation: >-
      Adds increased alternative splicing of minor-intron-containing genes in
      Lowry-Wood patient cells.
  - reference: PMID:36802443
    reference_title: "Deficiency of the minor spliceosome component U4atac snRNA secondarily results in ciliary defects in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In the human genome, about 750 genes contain one intron excised by the minor spliceosome."
    explanation: Gives the size of the gene set whose splicing depends on U4atac.
- name: Secondary Primary Cilium Dysfunction
  biological_scale: CELLULAR
  description: >-
    Cilium assembly is over-represented among minor-intron-containing genes, and
    U4atac deficiency alters primary cilium function in patient fibroblasts and
    causes ciliopathy-related traits in a u4atac zebrafish model. This is the
    proposed route from the splicing lesion to the skeletal, retinal and brain
    features of the RNU4ATAC spectrum. It was shown across RNU4ATAC patients,
    not specifically in Lowry-Wood syndrome, and the steps from cilium
    dysfunction to epiphyseal dysplasia or microcephaly have not been
    demonstrated, so the edges below are marked as indirect.
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: DECREASED
  downstream:
  - target: Multiple Epiphyseal Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinal Dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Developmental Delay and Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36802443
    reference_title: "Deficiency of the minor spliceosome component U4atac snRNA secondarily results in ciliary defects in human and zebrafish."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "alterations of primary cilium function in TALS and JBTS-like patient fibroblasts"
    explanation: >-
      Altered primary cilium function in fibroblasts from patients with other
      RNU4ATAC genotypes (MOPD I and a Joubert-like presentation). Not shown in
      Lowry-Wood syndrome specifically.
  - reference: PMID:36802443
    reference_title: "Deficiency of the minor spliceosome component U4atac snRNA secondarily results in ciliary defects in human and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "indicating ciliary dysfunction as a mechanism downstream of minor splicing defects"
    explanation: >-
      States that ciliary dysfunction follows from the splicing defect rather
      than being a parallel lesion.
  - reference: PMID:36802443
    reference_title: "Deficiency of the minor spliceosome component U4atac snRNA secondarily results in ciliary defects in human and zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "our data indicate that alteration of cilium biogenesis is part of the physiopathological mechanisms of TALS/RFMN/LWS, secondarily to defects of minor intron splicing"
    explanation: >-
      The authors' conclusion names Lowry-Wood syndrome (LWS) among the
      phenotypes whose mechanism includes altered cilium biogenesis. The
      conclusion rests on patient fibroblasts from MOPD I and Joubert-like cases
      and on the zebrafish model, so for Lowry-Wood syndrome it is an
      inference rather than a direct observation.
phenotypes:
- category: Skeletal

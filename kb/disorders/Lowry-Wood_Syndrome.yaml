- name: COMP-Related Multiple Epiphyseal Dysplasia
  description: >-
    Autosomal dominant multiple epiphyseal dysplasia from COMP variants produces
    similar epiphyseal changes but without microcephaly, eye involvement or
    intellectual disability. COMP analysis was negative in a patient with the
    mildest reported Lowry-Wood presentation.
  distinguishing_features:
  - Microcephaly and congenital nystagmus point to Lowry-Wood syndrome
  - COMP-related MED is autosomal dominant
  evidence:

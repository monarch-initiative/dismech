  frequency: VERY_FREQUENT
  description: >-
    The defining skeletal feature. The epiphyses are affected without spinal
    involvement, which separates Lowry-Wood syndrome from the
    spondyloepiphyseal dysplasia of Roifman syndrome and the
    spondyloepimetaphyseal dysplasia of MOPD I. The proximal femoral epiphyses
    can be the most severely affected.
  evidence:

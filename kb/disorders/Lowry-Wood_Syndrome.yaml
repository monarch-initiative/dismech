genetic:
- name: RNU4ATAC
  gene_term:
    preferred_term: RNU4ATAC
    term:
      id: hgnc:34016
      label: RNU4ATAC
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported Lowry-Wood genotypes are compound heterozygous, for example
    n.51G>A with n.5A>C, n.111G>A with n.46G>A, and n.120T>G with n.114G>C.
    Several alleles are shared with MOPD I and Roifman syndrome, so the allele
    pair rather than any single variant decides the phenotype. RNU4ATAC is a
    small non-coding gene that standard exome capture may not cover, which is a
    recognized cause of missed diagnoses.
  evidence:
  - reference: PMID:29265708
    reference_title: The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report expands the phenotypic spectrum for biallelic RNU4ATAC disorder causing variants and is the first to establish the genetic cause for Lowry Wood syndrome."
    explanation: First report establishing RNU4ATAC as the causal gene.
  - reference: PMID:30368667
    reference_title: "Lowry-Wood syndrome: further evidence of association with RNU4ATAC, and correlation between genotype and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report RNU4ATAC pathogenic variants in two further patients."
    explanation: Independent replication in further patients.
  - reference: PMID:32628740
    reference_title: "Clinical interpretation of variants identified in RNU4ATAC, a non-coding spliceosomal gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only one other variant was found in all three RNU4ATAC-associated syndromes, namely n.46G>A (one TALS, one RFMN and one LWS families)."
    explanation: Shows a single allele recurring across all three named phenotypes.
diagnosis:
- name: Targeted RNU4ATAC Sequencing
  presence: Biallelic pathogenic variants in affected individuals
  description: >-
    Diagnosis is confirmed by finding biallelic pathogenic RNU4ATAC variants in
    a person with suggestive findings. Because exome capture designed around
    protein-coding exons may miss the gene, targeted or Sanger sequencing of
    RNU4ATAC is recommended when epiphyseal dysplasia occurs with microcephaly,
    intellectual disability, immunodeficiency, or retinal anomalies.
  evidence:
  - reference: PMID:29265708
    reference_title: The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since RNU4ATAC is not consistently targeted in standard exome capture methodologies that only target protein-coding exons, many such cases will be missed. Sanger sequencing of this locus is needed for a complete assessment."
    explanation: States why targeted sequencing is needed.
  - reference: PMID:36795902
    reference_title: RNU4atac-opathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of RNU4atac-opathy is established in a proband with suggestive findings and biallelic pathogenic (or likely pathogenic) variants in RNU4ATAC identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion for the RNU4ATAC spectrum.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    No disease-specific therapy exists. Management is supportive, including
    orthopedic follow-up of the skeletal dysplasia and immunological assessment,
    with antibiotics or immunoglobulin replacement where an antibody deficiency
    is clinically significant, and immunological evaluation before live
    vaccines.
  treatment_term:
    preferred_term: Multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36795902
    reference_title: RNU4atac-opathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Supportive care to improve quality of life, maximize function, and reduce complications is recommended. This ideally involves multidisciplinary care by specialists in relevant fields, including orthopedists to monitor the associated skeletal dysplasia and immunologists"
    explanation: GeneReviews management recommendation for the RNU4ATAC spectrum.
  - reference: PMID:36795902
    reference_title: RNU4atac-opathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Perform immunologic evaluation prior to administration of live vaccines."
    explanation: >-
      GeneReviews advice behind the immunological evaluation before live
      vaccines named in this treatment's description.
animal_models:
- name: u4atac zebrafish morphant (Khatri 2023)
  species: Zebrafish
  genotype: u4atac antisense morpholino knockdown (5' stem-loop or stem II)
  publication: PMID:36802443
  description: >-
    Morpholino knockdown of zebrafish u4atac targeting the 5' stem-loop or
    stem II. Phenotypes were rescued by wild-type human U4atac but not by
    U4atac carrying patient variants.
  modeled_mechanisms:
  - target: Secondary Primary Cilium Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      u4atac deficiency produces ciliopathy-related phenotypes and ciliary
      defects, supporting the cilium arm of the RNU4ATAC mechanism.
    limitations: >-
      Transient, dose-dependent morpholino knockdown rather than a patient
      genotype, read out in embryos. The model is not specific to Lowry-Wood
      syndrome: the patient variants tested for rescue came from other
      RNU4ATAC phenotypes, and the fish phenotypes (body axis curvature,
      pronephric cysts, otolith defects) are not the epiphyseal dysplasia that
      defines Lowry-Wood syndrome.
    evidence:
    - reference: PMID:36802443
      reference_title: "Deficiency of the minor spliceosome component U4atac snRNA secondarily results in ciliary defects in human and zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "u4atac zebrafish model, which exhibits ciliopathy-related phenotypes and ciliary defects. These phenotypes could be rescued by WT but not by pathogenic variants-carrying human U4atac."
      explanation: >-
        Knockdown phenotypes and their allele-specific rescue support the model
        as informative for the cilium node.

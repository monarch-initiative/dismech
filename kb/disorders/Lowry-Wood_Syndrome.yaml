name: Lowry-Wood Syndrome
creation_date: "2026-10-26T00:00:00Z"
description: >-
  Lowry-Wood syndrome is a rare autosomal recessive skeletal dysplasia caused by
  biallelic pathogenic variants in RNU4ATAC, which encodes the U4atac small
  nuclear RNA of the minor (U12-dependent) spliceosome. Its defining features
  are multiple epiphyseal dysplasia without spinal involvement together with
  microcephaly, accompanied by variable short stature, developmental delay or
  intellectual disability, eye involvement (congenital nystagmus, retinal
  dystrophy), joint dislocations and contractures, and subclinical antibody
  deficiency. It is the mildest of the three historically named RNU4ATAC
  phenotypes, alongside microcephalic osteodysplastic primordial dwarfism type I
  and Roifman syndrome, and the three are now regarded as points on one
  phenotypic spectrum (RNU4atac-opathy).
category: Mendelian

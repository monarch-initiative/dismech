    reference_title: A new patient with Lowry-Wood syndrome with mild phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a new case of MED and microcephaly, without other additional features, suggesting a mild form of LWS. Molecular analysis of the cartilage oligomeric matrix protein (COMP) gene was performed and failed to find mutations."
    explanation: COMP-related MED was considered and excluded in a mild Lowry-Wood case.
discussions:
- discussion_id: lws_rnu4atac_allele_phenotype_determinant
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a biallelic RNU4ATAC genotype produces Lowry-Wood
    syndrome rather than Roifman syndrome or MOPD I, given that some alleles
    recur in all three?
  rationale: >-
    The proposed rule that two severe alleles give MOPD I and a severe plus a
    mild allele give Roifman syndrome did not fit the first molecularly
    confirmed Lowry-Wood patient, whose two variants both lie in regions
    predicted to matter for splicing. Variant severity alone does not explain
    the phenotype, and modifier genes or tissue-specific splicing thresholds
    remain open possibilities.
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic RNU4ATAC Variants
  evidence:
  - reference: PMID:29265708
    reference_title: The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mechanism through which RNU4ATAC variants cause different clinical phenotypes is unclear."
    explanation: States the open question directly.
  - reference: PMID:29265708
    reference_title: The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, both of the variants in patient 1 are in regions predicted by Merico et al. to be important for splicing (Supplemental Figure S1), which is inconsistent with their theory."
    explanation: The observation that contradicts the severe-plus-mild allele rule.
notes: >-
  The clinical reports from before 2018 (Nevin 1986, Hankenson 1989, Yamamoto
  1995, Brunetti-Pierri 2003, Magnani 2009) diagnosed Lowry-Wood syndrome on
  clinical grounds only, and none was molecularly confirmed. They are cited here
  for features also seen in confirmed patients. The 1995 report of corpus
  callosum hypoplasia and leukonychia (PMID:7747786) is not encoded as a
  phenotype because the authors themselves presented it only as a possible
  variant of the syndrome. The OMIM number is 226960, as listed in the ISDS
  2023 nosology (PMID:36779427) and the later RNU4ATAC literature; Farach et
  al. 2018 prints 226969, which disagrees with both.

  Features reported across RNU4ATAC cohorts but not yet documented in a
  patient diagnosed with Lowry-Wood syndrome are not encoded as phenotypes
  here: chilblain-like skin lesions with enhanced type I interferon signalling
  (PMID:40415209), and reduced JAK1 signalling, shown in Roifman syndrome
  patients and a Drosophila U4atac mutant (PMID:42463491). The same applies to
  the cerebral anomalies reported across the RNU4ATAC spectrum (PMID:42322193):
  no brain malformation of the kind seen in MOPD I has been reported in a
  molecularly confirmed Lowry-Wood patient, where the only intracranial
  finding is an arachnoid cyst in patient 1 of PMID:29265708. The clinically
  diagnosed 1995 case with corpus callosum hypoplasia (PMID:7747786) is the
  exception noted above.

inheritance:
- name: Autosomal recessive
  description: >-
    Both reports describe biallelic (homozygous) DEF6 variants. In the second
    family Sanger sequencing confirmed homozygosity in all four affected
    siblings of a consanguineous kindred while both parents were heterozygous
    and unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify biallelic mutations in three patients from two unrelated families"
    explanation: Biallelic variants in affected individuals from unrelated families indicate recessive inheritance.
genetic:
- name: DEF6
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: DEF6
    term:
      id: hgnc:2760
      label: DEF6
  notes: >-
    DEF6 encodes a guanine nucleotide exchange factor acting on the Rho GTPases
    Cdc42 and Rac1 and recruited to the immunological synapse during T-cell
    receptor signalling. Reported disease alleles are homozygous missense
    variants (p.Tyr210Asp; p.Glu331Lys) and a homozygous nonsense variant
    (p.Gln314Ter) behaving as a null.
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify biallelic mutations in three patients from two unrelated families in differentially expressed in FDCP6 homolog (DEF6) as the molecular cause of an inborn error of immunity with systemic autoimmunity"
    explanation: Identifies DEF6 as the causative gene.
experimental_models:
- name: DEF6-knockout Jurkat T-cell line
  experimental_model_type: CELL_LINE
  description: >-
    A DEF6-knockout human T-cell line generated in the index report. It is the
    strongest causality evidence in the disease: the patient CTLA-4 trafficking
    defect is reproduced in cells whose only relevant difference is the absence
    of DEF6, which rules out the patient-specific confounders (including the
    SKIV2L variant carried by two of the three index patients) that the
    observational data cannot.
  modeled_mechanisms:
  - target: Reduced Surface CTLA-4 Availability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knockout line reproduces the impaired CTLA-4 surface trafficking seen
      in patient T cells.
    limitations: >-
      Jurkat is a transformed leukaemic line, not a primary regulatory T cell,
      so it models the trafficking machinery rather than Treg suppressive
      function, and it cannot speak to the organism-level autoimmunity.
    readouts:
    - name: Surface CTLA-4 availability on stimulated T cells
      target: Reduced Surface CTLA-4 Availability
      direction: DECREASED
      interpretation: >-
        Reduced functional CTLA-4 at the cell surface is the measurement that
        makes this line informative for the node.
      evidence:
      - reference: PMID:31308374
        reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "which is replicated in DEF6-knockout Jurkat cells"
        explanation: The knockout line reproduces the reduced surface CTLA-4 measured in patient T cells.
    evidence:
    - reference: PMID:31308374
      reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "which is replicated in DEF6-knockout Jurkat cells"
      explanation: States that the patient CTLA-4 trafficking phenotype is reproduced in the knockout line.
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient T cells exhibit impaired regulation of CTLA-4 surface trafficking associated with reduced functional CTLA-4 availability, which is replicated in DEF6-knockout Jurkat cells."
    explanation: Establishes the knockout line as an informative model of the CTLA-4 trafficking defect.
treatments:
- name: Abatacept (CTLA-4-Ig)
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    A soluble CTLA-4-Ig fusion protein that supplies extracellularly the
    B7-binding function the patient's T cells cannot deliver to their own
    surface — a direct pharmacological substitution for the trafficking defect.
    One patient in the index report achieved sustained remission on it. The
    evidence for this disease is therefore a single treated patient, and the
    supporting review evidence is extrapolated from the larger CTLA-4

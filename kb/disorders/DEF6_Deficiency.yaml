inheritance:
- name: Autosomal recessive
  description: >-
    Both reports describe biallelic (homozygous) DEF6 variants. In the second
    family Sanger sequencing confirmed homozygosity in all four affected
    siblings of a consanguineous kindred while both parents were heterozygous
    and unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify biallelic mutations in three patients from two unrelated families"
    explanation: Biallelic variants in affected individuals from unrelated families indicate recessive inheritance.
genetic:
- name: DEF6
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: DEF6
    term:
      id: hgnc:2760
      label: DEF6
  notes: >-
    DEF6 encodes a guanine nucleotide exchange factor acting on the Rho GTPases
    Cdc42 and Rac1 and recruited to the immunological synapse during T-cell
    receptor signalling. Reported disease alleles are homozygous missense
    variants (p.Tyr210Asp; p.Glu331Lys) and a homozygous nonsense variant
    (p.Gln314Ter) behaving as a null.
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify biallelic mutations in three patients from two unrelated families in differentially expressed in FDCP6 homolog (DEF6) as the molecular cause of an inborn error of immunity with systemic autoimmunity"
    explanation: Identifies DEF6 as the causative gene.
treatments:
- name: Abatacept (CTLA-4-Ig)
  therapeutic_modality: OTHER
  description: >-
    A soluble CTLA-4-Ig fusion protein that supplies extracellularly the
    B7-binding function the patient's T cells cannot deliver to their own
    surface — a direct pharmacological substitution for the trafficking defect.
    One patient in the index report achieved sustained remission on it. The
    evidence for this disease is therefore a single treated patient, and the
    supporting review evidence is extrapolated from the larger CTLA-4
    insufficiency and LRBA deficiency cohorts.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: abatacept
      term:
        id: NCIT:C28898
        label: Abatacept
  target_mechanisms:
  - target: Defective Regulatory T Cell Suppression
    treatment_effect: BYPASSES
    description: >-
      Soluble CTLA-4-Ig binds B7 ligands directly, restoring the co-stimulatory
      blockade that surface-CTLA-4-deficient Tregs cannot impose.
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the patients has been treated with CTLA-4-Ig and achieved sustained remission."
    explanation: The single reported treatment response in DEF6 deficiency.
  - reference: PMID:33996698
    reference_title: "Different Apples, Same Tree: Visualizing Current Biological and Clinical Insights into CTLA-4 Insufficiency and LRBA and DEF6 Deficiencies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Successful treatment options include regular administration of soluble CTLA-4-Ig fusion protein, Treg cell-sparing immune suppressants like sirolimus or mycophenolate mofetil, and hematopoietic stem cell transplantation."
    explanation: >-
      Review-level support for CTLA-4-Ig, but stated for the CTLA-4/LRBA/DEF6
      group as a whole rather than for DEF6 deficiency specifically.
- name: Hematopoietic stem cell transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    Allogeneic HSCT is the only potentially curative option in this group of
    immune-dysregulation disorders. No DEF6-specific transplant outcome series
    exists; the recommendation is extrapolated from CTLA-4 insufficiency and
    LRBA deficiency.
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Biallelic DEF6 Loss of Function
    treatment_effect: RESTORES
    description: Replacing the haematopoietic compartment with donor cells restores DEF6-competent T cells.
  evidence:
  - reference: PMID:41158012
    reference_title: "CTLA4-related primary immune dysregulatory disorders."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "hematopoietic stem cell transplantation (HSCT) remains the only curative option"
    explanation: >-
      Review states HSCT is the only curative option for the CTLA4-related
      disorders; DEF6-specific transplant evidence is absent.
discussions:
- discussion_id: def6_skiv2l_confound
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Biallelic DEF6 Loss of Function
  - disease#DEF6 Deficiency
  prompt: >-
    Which features of the originally reported DEF6 phenotype are attributable to
    DEF6 and which to the co-occurring SKIV2L variant?
  rationale: >-
    Two of the three patients in the index report also carried a homozygous
    predicted-pathogenic SKIV2L variant. SKIV2L deficiency causes
    trichohepatoenteric syndrome, whose features — intractable diarrhoea, liver
    disease, developmental abnormality and combined immunodeficiency — overlap
    substantially with the severe digestive and cardiac involvement described in
    those patients. The second report makes this point explicitly and describes
    a four-sibling family with no other pathogenic variant detected, in whom the
    phenotype is autoimmunity and EBV susceptibility without the
    extrahaematologic features. Until more unconfounded patients are reported,
    the digestive and cardiac manifestations should not be treated as
    established DEF6 phenotypes.
  evidence:
  - reference: PMID:32562707
    reference_title: "DEF6 deficiency, a mendelian susceptibility to EBV infection, lymphoma, and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, 2\nof the 3 patients were also carrying a predicted pathogenic\nhomozygous variant in SKIV2L"
    explanation: Documents the co-occurring SKIV2L variant in the index cohort.
- discussion_id: def6_ebv_effector_defect
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Control of Epstein-Barr Virus
  prompt: >-
    What is the effector defect that makes DEF6-deficient patients unable to
    control EBV, and is it downstream of the CTLA-4 trafficking lesion at all?
  rationale: >-
    EBV susceptibility and EBV-driven lymphoma were the presenting features of
    the second family but were not described in the index report, where the
    CTLA-4 trafficking mechanism was worked out. Reduced surface CTLA-4 explains
    loss of tolerance, but it is not an obvious explanation for failed antiviral
    control, which usually reflects a cytotoxic T-cell or NK-cell defect. Whether
    the two arms share a mechanism or DEF6 has a separate role in cytotoxic
    lymphocyte function is unresolved, and no experiment in either report
    addresses it.

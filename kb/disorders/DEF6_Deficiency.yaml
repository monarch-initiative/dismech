  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Seven patients from three kindreds have been reported: three patients from
    two unrelated families in the index report, and four affected siblings of a
    single consanguineous family in the second. No population prevalence
    estimate exists.
  evidence:
  - reference: PMID:31308374

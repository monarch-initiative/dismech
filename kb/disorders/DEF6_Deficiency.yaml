  - reference: PMID:32562707
    reference_title: "DEF6 deficiency, a mendelian susceptibility to EBV infection, lymphoma, and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the index case patient (patient 2) experienced an EBV -\npositive nodular sclerosis classic Hodgkin lymphoma (HL)"
    explanation: Documents lymphoma in a DEF6-deficient patient.
  - reference: PMID:33996698
    reference_title: "Different Apples, Same Tree: Visualizing Current Biological and Clinical Insights into CTLA-4 Insufficiency and LRBA and DEF6 Deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "these patients suffer an increased risk of developing malignancies, especially Non-Hodgkin's lymphoma"

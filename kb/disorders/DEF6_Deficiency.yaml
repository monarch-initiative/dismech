    explanation: Establishes the size and family structure of the index cohort.
pathophysiology:
- name: Biallelic DEF6 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic DEF6 variants abolish or cripple the guanine nucleotide exchange
    factor. Two mechanisms are documented: homozygous missense variants that
    leave protein expression strongly reduced (index report), and a homozygous
    nonsense variant (c.940C>T, p.Gln314Ter) that behaves as a null allele with
    complete loss of detectable DEF6 in patient T-cell blasts (second family).
  genes:
  - preferred_term: DEF6
    term:
      id: hgnc:2760
      label: DEF6
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify biallelic mutations in three patients from two unrelated families in differentially expressed in FDCP6 homolog (DEF6) as the molecular cause of an inborn error of immunity with systemic autoimmunity"
    explanation: Establishes biallelic DEF6 loss as the molecular cause of the disorder.
  downstream:
  - target: Disrupted RAB11-Dependent CTLA-4 Vesicle Trafficking
    causal_link_type: DIRECT
    description: Loss of DEF6 removes the RAB11 interaction required to load CTLA-4 into recycling vesicles.
- name: Disrupted RAB11-Dependent CTLA-4 Vesicle Trafficking
  biological_scale: CELLULAR
  description: >-
    DEF6 interacts with the small GTPase RAB11, which governs the recycling
    endosome. Mutant DEF6 shows disrupted binding to RAB11, and DEF6-mutated
    cells contain fewer RAB11-positive, CTLA-4-positive vesicles. The lesion is
    therefore in the delivery machinery for CTLA-4, not in CTLA-4 itself — the
    same failure point that LRBA deficiency reaches by a different route.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: vesicle-mediated transport
    term:
      id: GO:0016192
      label: vesicle-mediated transport
    modifier: DECREASED
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identify the small GTPase RAB11 as an interactor of the guanine nucleotide exchange factor DEF6, and find disrupted binding of mutant DEF6 to RAB11 as well as reduced RAB11+CTLA-4+ vesicles in DEF6-mutated cells"
    explanation: Establishes the RAB11 interaction and its disruption as the trafficking defect.
  - reference: PMID:41158012
    reference_title: "CTLA4-related primary immune dysregulatory disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recent studies highlight the importance of LRBA/DEF6-mediated CTLA-4 recycling to maintain immune tolerance."
    explanation: Independent review placing DEF6 in the CTLA-4 recycling machinery alongside LRBA.
  downstream:
  - target: Reduced Surface CTLA-4 Availability
    causal_link_type: DIRECT
    description: Fewer CTLA-4-loaded recycling vesicles reach the plasma membrane, lowering surface CTLA-4.
- name: Reduced Surface CTLA-4 Availability
  biological_scale: CELLULAR
  description: >-
    Patient T cells show impaired regulation of CTLA-4 surface trafficking and
    reduced functional CTLA-4 availability, a phenotype reproduced in
    DEF6-knockout Jurkat cells. This is a functional CTLA-4 insufficiency
    arising from a normal CTLA4 locus, which is why the disorder is clinically
    grouped with CTLA-4 insufficiency and LRBA deficiency despite having a
    different causal gene.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient T cells exhibit impaired regulation of CTLA-4 surface trafficking associated with reduced functional CTLA-4 availability, which is replicated in DEF6-knockout Jurkat cells."
    explanation: Establishes reduced functional surface CTLA-4 in patient cells and its reproduction in a knockout cell line.
  downstream:
  - target: Defective Regulatory T Cell Suppression
    causal_link_type: DIRECT
    description: CTLA-4 is the effector molecule of Treg-mediated suppression; less surface CTLA-4 means less suppression.
- name: Defective Regulatory T Cell Suppression
  biological_scale: CELLULAR
  description: >-
    With insufficient surface CTLA-4, regulatory T cells cannot compete for and
    transendocytose B7 ligands from antigen-presenting cells, so co-stimulation
    of conventional T cells goes unrestrained. This is the shared final common
    step of the CTLA-4/LRBA/DEF6 group of immune-dysregulation disorders.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: negative regulation of T cell activation
    term:
      id: GO:0050868
      label: negative regulation of T cell activation
    modifier: DECREASED
  evidence:
  - reference: PMID:33996698
    reference_title: "Different Apples, Same Tree: Visualizing Current Biological and Clinical Insights into CTLA-4 Insufficiency and LRBA and DEF6 Deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "mainly attributed to a defective suppressive activity of Tregs, as all three diseases reduce overall surface expression of CTLA-4"
    explanation: Attributes the shared phenotype to defective Treg suppression secondary to reduced surface CTLA-4.
  downstream:
  - target: Systemic Autoimmunity and Lymphoproliferation
    causal_link_type: DIRECT
    description: Unrestrained T-cell activation drives multi-organ autoimmunity and lymphoproliferation.
  - target: Impaired Control of Epstein-Barr Virus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - dysregulated cytotoxic T-cell and NK-cell responses to EBV-infected B cells
    description: >-
      Immune dysregulation extends to failure of EBV control, though the precise
      effector defect responsible has not been resolved.
- name: Systemic Autoimmunity and Lymphoproliferation
  biological_scale: ORGANISM
  description: >-
    The dominant clinical arm: early-onset multi-organ autoimmunity, prominently
    autoimmune cytopenias, together with lymphoproliferation. Autoantibodies
    were detectable in three of four siblings in the second family, and the
    youngest developed severe autoimmune haemolytic anaemia and thrombocytopenia
    in the first year of life.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as the molecular cause of an inborn error of immunity with systemic autoimmunity"
    explanation: Systemic autoimmunity is the defining clinical consequence in the index cohort.
- name: Impaired Control of Epstein-Barr Virus
  biological_scale: ORGANISM
  description: >-
    The second reported family established a distinct arm not evident in the
    index report: chronic high-level EBV viraemia and EBV-driven
    lymphoproliferation, including EBV-positive nodular sclerosis classic
    Hodgkin lymphoma in the proband. This is why the second report titled the
    condition a mendelian susceptibility to EBV infection.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:32562707
    reference_title: "DEF6 deficiency, a mendelian susceptibility to EBV infection, lymphoma, and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients 1 and 3 also showed abnormal detectable blood EBV\nloads (>4 log copies/mL) over 6 months"
    explanation: Documents sustained high EBV viral loads in affected siblings.
  - reference: PMID:32562707
    reference_title: "DEF6 deficiency, a mendelian susceptibility to EBV infection, lymphoma, and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the index case patient (patient 2) experienced an EBV -\npositive nodular sclerosis classic Hodgkin lymphoma (HL)"
    explanation: Documents EBV-driven Hodgkin lymphoma in the proband of the second family.

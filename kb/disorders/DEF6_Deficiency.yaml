name: DEF6 Deficiency
creation_date: "2026-08-27T16:00:00Z"
category: Mendelian
synonyms:
- immunodeficiency 87 and autoimmunity
- IMD87
- immunodeficiency due to DEF6 deficiency
disease_term:
  preferred_term: DEF6 deficiency
  term:
    id: MONDO:0030457
    label: immunodeficiency 87 and autoimmunity
parents:
- Primary Immunodeficiency
description: >-
  An autosomal recessive inborn error of immunity caused by biallelic loss of
  DEF6, a guanine nucleotide exchange factor. DEF6 binds the small GTPase RAB11
  and is required for delivery of the checkpoint receptor CTLA-4 from its
  intracellular vesicle pool to the T-cell surface. Losing it produces a
  functional CTLA-4 insufficiency: regulatory T cells cannot mobilise enough
  surface CTLA-4 to restrain co-stimulation, and patients develop early-onset
  systemic autoimmunity, lymphoproliferation, and — in the second reported
  family — chronic EBV viraemia and EBV-driven lymphoma. Because the lesion is
  a shortage of available CTLA-4 rather than of the protein itself, CTLA-4-Ig
  (abatacept) is a mechanistically direct replacement therapy, and the one
  patient treated with it achieved sustained remission.

  The entire human evidence base is seven patients from three kindreds in two
  reports, and two of the three patients in the first report also carried a
  homozygous pathogenic SKIV2L variant, so some of the originally described
  extrahaematologic phenotype may not be attributable to DEF6. See the
  discussions section.

discussions:
- discussion_id: def6_skiv2l_confound
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Biallelic DEF6 Loss of Function
  - disease#DEF6 Deficiency
  prompt: >-
    Which features of the originally reported DEF6 phenotype are attributable to
    DEF6 and which to the co-occurring SKIV2L variant?
  rationale: >-
    Two of the three patients in the index report also carried a homozygous
    predicted-pathogenic SKIV2L variant. SKIV2L deficiency causes
    trichohepatoenteric syndrome, whose features — intractable diarrhoea, liver
    disease, developmental abnormality and combined immunodeficiency — overlap
    substantially with the severe digestive and cardiac involvement described in
    those patients. The second report makes this point explicitly and describes
    a four-sibling family with no other pathogenic variant detected, in whom the
    phenotype is autoimmunity and EBV susceptibility without the
    extrahaematologic features. Until more unconfounded patients are reported,
    the digestive and cardiac manifestations should not be treated as
    established DEF6 phenotypes, and the same applies to the severe bacterial and
    respiratory infections, which the second report also localises to the SKIV2L
    carriers. The phenotypes section is scoped accordingly.
  evidence:
  - reference: PMID:32562707
    reference_title: "DEF6 deficiency, a mendelian susceptibility to EBV infection, lymphoma, and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, 2\nof the 3 patients were also carrying a predicted pathogenic\nhomozygous variant in SKIV2L"
    explanation: Documents the co-occurring SKIV2L variant in the index cohort.
  - reference: PMID:31308374
    reference_title: "Human DEF6 deficiency underlies an immunodeficiency syndrome with systemic autoimmunity and aberrant CTLA-4 homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "could represent\na disease-modifying factor potentially affecting cardiac function"
    explanation: >-
      The index authors reach the same conclusion independently, treating the
      SKIV2L variant as a disease modifier for the cardiac and bowel features
      while holding that it does not explain the autoimmune presentation. Both
      reports agreeing is what makes the confound a settled caveat rather than
      one group's critique of another.
- discussion_id: def6_ebv_effector_defect
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Control of Epstein-Barr Virus
  prompt: >-
    What is the effector defect that makes DEF6-deficient patients unable to
    control EBV, and is it downstream of the CTLA-4 trafficking lesion at all?
  rationale: >-
    EBV susceptibility and EBV-driven lymphoma were the presenting features of
    the second family but were not described in the index report, where the
    CTLA-4 trafficking mechanism was worked out. Reduced surface CTLA-4 explains
    loss of tolerance, but it is not an obvious explanation for failed antiviral
    control, which usually reflects a cytotoxic T-cell or NK-cell defect. Whether
    the two arms share a mechanism or DEF6 has a separate role in cytotoxic
    lymphocyte function is unresolved, and no experiment in either report
    addresses it.

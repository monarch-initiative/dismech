  relationship_type: CAUSATIVE
  notes: >
    PRPF31 (pre-mRNA processing factor 31) encodes a U4/U6.U5 tri-snRNP
    spliceosomal component. It is the second most common genetic cause of
    autosomal dominant retinitis pigmentosa in most populations studied.
  case_fractions:

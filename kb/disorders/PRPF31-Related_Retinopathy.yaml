treatments:
- name: PRPF31 Gene Augmentation Therapy
  description: >
    Investigational AAV-mediated gene augmentation, delivering a wild-type
    copy of PRPF31, is under active preclinical investigation as a
    mutation-independent approach exploiting the haploinsufficiency
    mechanism of disease.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:35974011
    reference_title: "Modeling PRPF31 retinitis pigmentosa using retinal pigment epithelium and organoids combined with gene augmentation rescue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The rescue of RPE and photoreceptor defective phenotypes by PRPF31 gene augmentation provide the proof of concept"
    explanation: >
      Demonstrates proof-of-concept rescue of both RPE and photoreceptor
      defective phenotypes by AAV-mediated PRPF31 gene augmentation in
      patient-derived organoid models.
- name: Genetic Counseling
  description: >
    Genetic counseling is particularly important in PRPF31-RP given its
    incomplete penetrance -- asymptomatic obligate carriers can still
    transmit disease to offspring, complicating risk assessment and
    segregation analysis.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Low Vision Rehabilitation
  description: >
    Supportive low-vision aids and rehabilitation; no approved
    disease-modifying therapy is currently available for PRPF31-related
    retinopathy.
  treatment_term:
    preferred_term: low vision rehabilitation
    term:
      id: NCIT:C15747
      label: Supportive Care
discussions:
- discussion_id: gap_prpf31_photoreceptor_vs_rpe_primary_site
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Pre-mRNA Splicing of Photoreceptor Genes
  prompt: >-
    Are photoreceptors or the retinal pigment epithelium the primary
    cell type affected by PRPF31 haploinsufficiency?
  rationale: >-
    PRPF31 is ubiquitously expressed and its core splicing function is not
    retina-specific, yet disease is confined to the retina. Some studies
    report retina-enriched PRPF31 expression while others find no tissue
    enrichment, and separate lines of evidence implicate the retinal pigment
    epithelium rather than photoreceptors as the primary affected tissue.
    Resolving this is important for interpreting model systems and designing
    cell-type-appropriate gene therapy delivery.
  evidence:
  - reference: PMID:32014492
    reference_title: "Mutation spectrum of PRPF31, genotype-phenotype correlation in retinitis pigmentosa, and opportunities for therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It remains unclear whether the photoreceptor cells are the primary affected cells in RP associated with PRPF31, with a number of studies suggesting that the RPE is the primary affected tissue"
    explanation: >
      States the open question directly: whether photoreceptors or RPE are
      the primary PRPF31-RP-affected cell type remains unresolved.

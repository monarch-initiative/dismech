name: PRPF31-Related Retinopathy
creation_date: "2026-07-09T00:00:00Z"
category: Mendelian
description: >
  PRPF31-related retinopathy (retinitis pigmentosa 11, RP11) is an autosomal
  dominant inherited retinal dystrophy caused by heterozygous variants in
  PRPF31, which encodes a component of the U4/U6.U5 tri-snRNP spliceosomal
  complex required for pre-mRNA splicing. PRPF31 is the second most common
  genetic cause of autosomal dominant retinitis pigmentosa in most populations.
  Pathogenic variants act through haploinsufficiency: they reduce functional
  PRPF31 protein below the threshold required for efficient spliceosome
  assembly, preferentially disrupting splicing of highly-expressed
  photoreceptor transcripts such as rhodopsin and driving rod photoreceptor
  degeneration. RP11 is distinguished among Mendelian disorders by frequent,
  well-characterized incomplete penetrance: some heterozygous mutation
  carriers remain entirely asymptomatic, an outcome modulated by trans-acting
  expression of the wild-type PRPF31 allele.
disease_term:
  preferred_term: PRPF31-related retinopathy
  term:
    id: MONDO:0800395
    label: PRPF31-related retinopathy
synonyms:
- Retinitis Pigmentosa 11
- RP11
- PRPF31 retinitis pigmentosa
parents:

      evidence_source: HUMAN_CLINICAL
      snippet: "they are the second most common genetic cause of adRP in most populations, accounting for 6% of US cases (Sullivan et al., 2013)"
      explanation: Quantifies PRPF31's share of adRP cases in a US cohort.
  evidence:
  - reference: PMID:11545739
    reference_title: "A human homolog of yeast pre-mRNA splicing gene, PRP31, underlies autosomal dominant retinitis pigmentosa on chromosome 19q13.4 (RP11)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report mutations in a gene (PRPF31) homologous to Saccharomyces cerevisiae pre-mRNA splicing gene PRP31 in families with autosomal dominant retinitis pigmentosa linked to chromosome 19q13.4 (RP11; MIM 600138)."
    explanation: >
      Original identification of PRPF31 as the RP11 disease gene.

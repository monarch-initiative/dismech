inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    PRPF31-RP shows frequent, well-documented incomplete penetrance: some
    heterozygous mutation carriers remain entirely asymptomatic (complete
    non-penetrance), while others show highly variable severity within the
    same family carrying the identical variant. This is a rare true
    non-penetrance phenomenon in Mendelian disease, distinct from variable
    expressivity, and complicates both genetic diagnosis and prevalence
    estimation.
  evidence:
  - reference: PMID:26853529
    reference_title: "Variant haploinsufficiency and phenotypic non-penetrance in PRPF31-associated retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An intriguing feature of RP11 is the presence of non-penetrance, which has been observed in the majority of PRPF31 mutation-carrying families. In contrast to variable expressivity, which is highly pervasive, true non-penetrance is a very rare phenomenon in Mendelian disorders."
    explanation: >
      Establishes non-penetrance (distinct from variable expressivity) as a
      defining and unusually common feature of PRPF31-RP among Mendelian
      disorders.
  - reference: PMID:32014492
    reference_title: "Mutation spectrum of PRPF31, genotype-phenotype correlation in retinitis pigmentosa, and opportunities for therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "obligate carriers may be totally asymptomatic, showing complete non-penetrance"
    explanation: >
      Confirms that some obligate PRPF31 mutation carriers show complete
      non-penetrance, contributing to underestimation of disease prevalence.
pathophysiology:
- name: PRPF31 Haploinsufficiency and Tri-snRNP Assembly Defect
  description: >
    PRPF31 encodes a component of the U4/U6.U5 tri-snRNP spliceosomal
    particle, bridging the U4/U6 di-snRNP to U5 during spliceosome assembly.
    Heterozygous pathogenic variants -- nonsense, frameshift, splice-site, and
    missense substitutions that reduce protein solubility -- lower functional
    PRPF31 protein levels. Missense variants act primarily through reduced
    protein solubility causing insufficiency of functional protein, with a
    minor direct negative effect on splicing function, rather than a purely
    dominant-negative mechanism.
  biological_processes:
  - preferred_term: spliceosomal tri-snRNP complex assembly
    term:
      id: GO:0000244
      label: spliceosomal tri-snRNP complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:11545739
    reference_title: "A human homolog of yeast pre-mRNA splicing gene, PRP31, underlies autosomal dominant retinitis pigmentosa on chromosome 19q13.4 (RP11)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The level of sequence identity to the yeast PRP31 gene indicates that PRPF31 is also likely to be involved in pre-mRNA splicing."
    explanation: >
      Original gene-identification study establishing PRPF31 as a pre-mRNA
      splicing factor homologous to yeast PRP31.
  - reference: PMID:18431455
    reference_title: "Disease mechanism for retinitis pigmentosa (RP11) caused by missense mutations in the splicing factor gene PRPF31."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The RP11 missense mutations exert their pathology mainly via a mechanism based on protein insufficiency due to protein insolubility, but there is also a minor direct negative effect on function."
    explanation: >
      Establishes protein insufficiency from reduced solubility, not a purely
      dominant-negative mechanism, as the predominant pathogenic route for
      RP11 missense variants.
  downstream:
  - target: Impaired Pre-mRNA Splicing of Photoreceptor Genes
    description: >-
      Reduced functional PRPF31 and consequent tri-snRNP assembly deficits
      preferentially compromise splicing capacity for the high-volume,
      alternatively-spliced pre-mRNA burden characteristic of photoreceptors.
- name: CNOT3-Mediated Modulation of Wild-Type PRPF31 Expression
  description: >
    Penetrance of PRPF31 mutations is determined by a trans-acting genetic
    modifier: CNOT3, a subunit of the CCR4-NOT transcription complex, binds
    the PRPF31 promoter and transcriptionally represses it. CNOT3 expression
    is inversely correlated with PRPF31 expression across family members. In
    asymptomatic mutation carriers, low CNOT3 expression permits higher
    transcription from the wild-type PRPF31 allele, raising total functional
    PRPF31 above the pathogenic threshold and preventing retinal degeneration
    despite carrying the same causative variant as affected relatives.
  biological_processes:
  - preferred_term: spliceosomal tri-snRNP complex assembly
    term:
      id: GO:0000244
      label: spliceosomal tri-snRNP complex assembly
    modifier: INCREASED
  evidence:
  - reference: PMID:23144630
    reference_title: "CNOT3 is a modifier of PRPF31 mutations in retinitis pigmentosa with incomplete penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNOT3 directly binds to a specific PRPF31 promoter sequence, while next-generation sequencing of the CNOT3 genomic region indicated that its variable expression is associated with a common intronic SNP. In conclusion, we identify CNOT3 as the main modifier gene determining penetrance of PRPF31 mutations, via a mechanism of transcriptional repression."
    explanation: >
      Establishes CNOT3 as the main penetrance modifier gene for PRPF31
      mutations, acting via direct promoter binding and transcriptional
      repression.
  - reference: PMID:23144630
    reference_title: "CNOT3 is a modifier of PRPF31 mutations in retinitis pigmentosa with incomplete penetrance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In asymptomatic carriers CNOT3 is expressed at low levels, allowing higher amounts of wild-type PRPF31"
    explanation: >
      Demonstrates the mechanistic basis of non-penetrance: low CNOT3
      expression in asymptomatic carriers permits higher wild-type PRPF31
      output that compensates for the mutant allele.
  downstream:
  - target: Impaired Pre-mRNA Splicing of Photoreceptor Genes
    description: >-
      Low CNOT3 expression raises wild-type PRPF31 output above the
      pathogenic haploinsufficiency threshold, mitigating (rather than
      driving) the downstream splicing defect -- the mechanistic basis of
      non-penetrance in asymptomatic carriers.
- name: Impaired Pre-mRNA Splicing of Photoreceptor Genes
  description: >
    Photoreceptors are among the most transcriptionally and metabolically
    active cells in the body, with an unusually high burden of pre-mRNA
    splicing to sustain phototransduction-gene expression. Reduced PRPF31
    availability significantly inhibits splicing of intron 3 in the rhodopsin
    (RHO) gene, linking PRPF31 dysfunction mechanistically to RHO, another
    major adRP gene. Whether photoreceptors themselves or the retinal pigment
    epithelium are the primary affected cell type remains an open question in
    the field.
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  evidence:
  - reference: PMID:15659613
    reference_title: "Mutations in PRPF31 inhibit pre-mRNA splicing of rhodopsin gene and cause apoptosis of retinal cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutant PRPF31 proteins significantly inhibited pre-mRNA splicing of intron 3 in RHO gene."
    explanation: >
      Directly demonstrates that mutant PRPF31 impairs splicing of the RHO
      transcript, mechanistically linking the two major adRP genes.
  downstream:
  - target: Rod Photoreceptor Apoptosis
    description: >-
      Impaired splicing of photoreceptor-specific transcripts, particularly
      rhodopsin, reduces expression of essential phototransduction proteins
      and triggers photoreceptor cell death.
- name: Rod Photoreceptor Apoptosis
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >
    Reduced rhodopsin expression secondary to defective PRPF31-dependent
    splicing causes apoptosis of rhodopsin-positive retinal cells, producing
    progressive rod photoreceptor loss with secondary cone involvement and
    the classic retinitis pigmentosa clinical phenotype.
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:15659613
    reference_title: "Mutations in PRPF31 inhibit pre-mRNA splicing of rhodopsin gene and cause apoptosis of retinal cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In primary retinal cell cultures, expression of the mutant PRPF31 proteins reduced rhodopsin expression and caused apoptosis of rhodopsin-positive retinal cells."
    explanation: >
      Direct experimental demonstration that mutant PRPF31 expression reduces
      rhodopsin and causes apoptosis of rhodopsin-expressing retinal cells.
phenotypes:
- name: Night blindness
  category: Ophthalmologic
  frequency: VERY_FREQUENT
  description: >
    Night blindness is typically the earliest presenting symptom, with median
    age of onset ranging from 8-12 years for nonsense/frameshift/indel
    variants to around 27 years for missense or in-frame variants.
  phenotype_term:
    preferred_term: Night blindness
    term:
      id: HP:0000662
      label: Nyctalopia
  evidence:
  - reference: PMID:32014492
    reference_title: "Mutation spectrum of PRPF31, genotype-phenotype correlation in retinitis pigmentosa, and opportunities for therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age of onset of first symptoms (usually night-blindness) is lowest in patients with nonsense, frameshift or indel variants, with median age of onset between 8 and 12 years of age."
    explanation: >
      Establishes night blindness as the usual first symptom, with age of
      onset varying significantly by variant class.
- name: Progressive peripheral visual field loss
  category: Ophthalmologic
  frequency: VERY_FREQUENT
  description: >
    Progressive rod-cone degeneration constricts the peripheral visual field,
    often the reason patients are diagnosed with RP.
  phenotype_term:
    preferred_term: Peripheral visual field constriction
    term:
      id: HP:0001133
      label: Constriction of peripheral visual field
  evidence:
  - reference: PMID:32014492
    reference_title: "Mutation spectrum of PRPF31, genotype-phenotype correlation in retinitis pigmentosa, and opportunities for therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with nonsense, frameshift or splice variants were diagnosed at a median age of 20–30 years (usually because of loss of peripheral vision alongside night blindness)"
    explanation: >
      Confirms peripheral visual field loss, alongside night blindness, as a
      principal driver of clinical diagnosis in PRPF31-RP.
- name: Rod-cone dystrophy
  category: Ophthalmologic
  frequency: VERY_FREQUENT
  description: >
    PRPF31-RP follows the classic rod-cone dystrophy pattern: rod
    dysfunction and loss predominate, with secondary cone involvement.
  phenotype_term:
    preferred_term: Rod-cone dystrophy
    term:
      id: HP:0000510
      label: Rod-cone dystrophy
  evidence:
  - reference: PMID:30582903
    reference_title: "Time Course of Disease Progression of PRPF31-mediated Retinitis Pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 6 patients had a non-recordable cone response on their initial visit, suggesting that rod function deteriorates before cone function."
    explanation: >
      Natural-history cohort study directly demonstrates the rod-predominant
      dystrophy pattern: cone responses remained recordable in most patients
      while rod function deteriorated first.
- name: Spicular retinal pigmentation
  category: Ophthalmologic
  frequency: FREQUENT
  description: >
    Bone-spicule-like pigment deposits in the mid-peripheral fundus are a
    classic hallmark of RP-type retinal remodeling.
  phenotype_term:
    preferred_term: Spicular pigmentation of the retina
    term:
      id: HP:0007737
      label: Spicular pigmentation of the retina
  evidence:
  - reference: PMID:30582903
    reference_title: "Time Course of Disease Progression of PRPF31-mediated Retinitis Pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fundus appearance of all affected individuals was consistent with retinitis pigmentosa, with waxy pallor of the optic nerve, retinal vessel attenuation, and bone spicule pigment"
    explanation: >
      Natural-history cohort study directly documents bone-spicule pigment on
      fundus exam in all affected PRPF31 mutation carriers.
- name: Abnormal electroretinogram
  category: Ophthalmologic
  frequency: VERY_FREQUENT
  description: >
    Rod-predominant ERG abnormalities, ranging from reduced amplitude to
    non-recordable responses, reflect the underlying rod photoreceptor loss.
  phenotype_term:
    preferred_term: Abnormal electroretinogram
    term:
      id: HP:0000512
      label: Abnormal electroretinogram
  evidence:
  - reference: PMID:30582903
    reference_title: "Time Course of Disease Progression of PRPF31-mediated Retinitis Pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding the rod and cone ERG waveforms, 21 patients had no detectable rod b-wave at their initial visit, while 5 patients had rod b-wave amplitude severely reduced in amplitude."
    explanation: >
      Clinical cohort study directly documents rod-predominant ERG
      abnormality (non-detectable or severely reduced rod b-wave) in
      affected PRPF31 mutation carriers.

notes: >-
  No GeneReviews chapter covers HMGCS1-related myopathy (Bookshelf index
  snapshot 2026-09-10 plus a live PubMed title search, 2026-10-30). The
  founding report (PMID:39531736) is the only patient series. Its PubMed
  abstract is cached, but the PMC record is not open access, so allele names
  beyond the four tested missense variants, ages at onset, and individual
  clinical details are not quotable here. The HPO disease annotations for
  OMIM:621433, curated from that full text and served by the Monarch API,
  additionally record reduced forced vital capacity (5/5), proximal muscle
  weakness (4/5), scapular winging (4/5), distal muscle weakness (3/5), high
  palate (2/5), bulbar palsy (1/5) and fatty replacement of skeletal muscle
  (2/2), and record facial weakness, ptosis and reduced left ventricular
  ejection fraction as absent (0/5) and myositis as absent (0/4). These are
  not curated here because no citable quote is available for them. The
  drugs that worsened the course are not named in the abstract. The Disease
  Ontology definition of DOID:0061259 (exercise intolerance and early fatigue)
  does not match the published phenotype. No module in kb/modules covers
  mevalonate-pathway myopathy; the HMGCR entry (Muscular Dystrophy,
  Limb-Girdle, Autosomal Recessive 28) and the GGPS1 entry (Muscular
  Dystrophy, Congenital Hearing Loss and Ovarian Insufficiency Syndrome) model
  the same pathway.

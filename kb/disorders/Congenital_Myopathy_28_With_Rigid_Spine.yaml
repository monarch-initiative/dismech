name: Congenital Myopathy 28 With Rigid Spine
creation_date: "2026-10-30T12:00:00Z"
category: Mendelian
synonyms:
- CMYO28
- congenital myopathy 28
- HMGCS1-related rigid spine syndrome
description: >-
  Autosomal recessive rigid spine myopathy caused by biallelic variants in
  HMGCS1, which encodes cytosolic 3-hydroxy-3-methylglutaryl-CoA synthase, the
  enzyme of the first step of the mevalonate pathway that supplies cholesterol
  and isoprenoids. The founding report described five patients from four
  unrelated families carrying six missense variants and one frameshift
  variant. All had spinal rigidity mainly of the cervical and dorsolumbar
  spine, scoliosis and respiratory insufficiency; creatine kinase was variably
  raised, and muscle biopsy showed irregular oxidative enzyme staining with
  occasional internal nuclei and rimmed vacuoles. The course worsened with
  intercurrent illness or certain drugs in some patients, and one patient died
  of respiratory failure after an infection. Recombinant missense proteins keep
  their dimeric state but are less thermostable or subtly altered in activity,
  and they rescue hmgcs1 mutant zebrafish less well than wild-type HMGCS1, so
  the missense alleles are hypomorphic. The disease sits with HMGCR and GGPS1
  muscle disease as a mevalonate-pathway myopathy. Mevalonic acid lessens the
  severity of hmgcs1 mutant zebrafish, but no patient has been treated.

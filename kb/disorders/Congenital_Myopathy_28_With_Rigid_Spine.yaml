    explanation: Biallelic variants in every affected individual across four families establish recessive inheritance.
pathophysiology:
- name: Hypomorphic HMGCS1 Variants
  biological_scale: MOLECULAR
  description: >-
    Six missense variants and one frameshift variant are distributed across
    HMGCS1. Four missense proteins (p.Q29L, p.M70T, p.C268S, p.S447P) remain
    dimeric; three are less thermostable and two show subtle changes in
    enzymatic activity. All four rescue hmgcs1 mutant zebrafish less well than
    wild-type HMGCS1 mRNA, so the missense alleles retain partial function
    rather than abolishing it.
  genes:
  - preferred_term: HMGCS1
    term:
      id: hgnc:5007
      label: HMGCS1
  molecular_functions:
  - preferred_term: hydroxymethylglutaryl-CoA synthase activity
    term:
      id: GO:0004421
      label: hydroxymethylglutaryl-CoA synthase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:39531736
    reference_title: "HMGCS1 variants cause rigid spine syndrome amenable to mevalonic acid treatment in an animal model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These included six missense variants and one frameshift variant distributed throughout HMGCS1."
    explanation: The allelic spectrum found in patients.
  - reference: PMID:39531736
    reference_title: "HMGCS1 variants cause rigid spine syndrome amenable to mevalonic acid treatment in an animal model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Three of the four mutants exhibited reduced thermal stability, and two mutants showed subtle changes in enzymatic activity compared to the wildtype."
    explanation: Recombinant protein assays show destabilized or functionally altered missense HMGCS1.
  - reference: PMID:39531736
    reference_title: "HMGCS1 variants cause rigid spine syndrome amenable to mevalonic acid treatment in an animal model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that the four variants tested (S447P, Q29L, M70T and C268S) have reduced function compared to wild-type HMGCS1 in zebrafish rescue assays."
    explanation: In vivo complementation shows the patient missense alleles have reduced, not absent, function.
  - reference: PMID:28686747
    reference_title: "Functional analysis of the zebrafish ortholog of HMGCS1 reveals independent functions for cholesterol and isoprenoids in craniofacial development."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The first step of the pathway is mediated by HMGCS1, the gene that encodes HMG-CoA synthase, which converts acetyl CoA and acetoacetyl-CoA into 3-hydroxy-3-methylglutaryl CoA (HMG-CoA)."
    explanation: States the reaction HMGCS1 catalyzes, which is the activity bound on this node.
  downstream:
  - target: Reduced Mevalonate Pathway Output
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30987969
      reference_title: "Mutations in the zebrafish hmgcs1 gene reveal a novel function for isoprenoids during red blood cell development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "hmgcs1 encodes the first enzyme in the cholesterol synthesis pathway and mutation of hmgcs1 inhibits cholesterol synthesis."
      explanation: >-
        A zebrafish hmgcs1 missense mutant reduces pathway output. The patient
        alleles themselves have not been shown to lower sterol or isoprenoid
        levels in human tissue.
- name: Reduced Mevalonate Pathway Output
  biological_scale: MOLECULAR
  description: >-
    HMG-CoA formed by HMGCS1 is reduced by HMGCR to mevalonate, which feeds
    both isoprenoid and cholesterol synthesis. Loss of HMGCS1 activity limits
    both branches; which product deficit drives the muscle disease has not
    been determined. In zebrafish, mevalonic acid bypasses the defective step
    and lessens mutant severity.
  biological_processes:
  - preferred_term: mevalonate pathway
    term:
      id: GO:0019287
      label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
    modifier: DECREASED
  - preferred_term: isoprenoid biosynthesis
    term:
      id: GO:0008299
      label: isoprenoid biosynthetic process
    modifier: DECREASED
  - preferred_term: cholesterol biosynthesis
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:24573296
    reference_title: "Mutation of 3-hydroxy-3-methylglutaryl CoA synthase I reveals requirements for isoprenoid and cholesterol synthesis in oligodendrocyte migration arrest, axon wrapping, and myelin gene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Through a forward genetic screen in zebrafish we discovered that mutation of hmgcs1, which encodes an enzyme necessary for isoprenoid and cholesterol synthesis, causes oligodendrocyte progenitor cells (OPCs) to migrate past their target axons and to fail to express myelin genes."
    explanation: >-
      Establishes HMGCS1 as required for both isoprenoid and cholesterol
      synthesis. The cellular phenotype studied (oligodendrocyte migration) is
      not part of the human myopathy.
  - reference: PMID:30987969
    reference_title: "Mutations in the zebrafish hmgcs1 gene reveal a novel function for isoprenoids during red blood cell development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "hmgcs1 encodes the first enzyme in the cholesterol synthesis pathway and mutation of hmgcs1 inhibits cholesterol synthesis."
    explanation: Mutation of zebrafish hmgcs1 reduces cholesterol synthesis.
  downstream:
  - target: Rigid Spine Myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39531736
      reference_title: "HMGCS1 variants cause rigid spine syndrome amenable to mevalonic acid treatment in an animal model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Additionally, we demonstrate the potential for mevalonic acid supplementation to reduce phenotypic severity in mutant zebrafish."
      explanation: >-
        Supplying the product downstream of the HMGCS1 step lessens the mutant
        phenotype, so the deficit in pathway output drives it. The zebrafish
        phenotype is early immobility and death, not a human-like myopathy.
    - reference: PMID:39531736
      reference_title: "HMGCS1 variants cause rigid spine syndrome amenable to mevalonic acid treatment in an animal model."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: "Notably, biallelic hypomorphic variants in downstream enzymes including HMGCR and GGPS1 are associated with muscular dystrophy resembling our cohort's presentation."
      explanation: >-
        Hypomorphic defects at later steps of the same pathway cause similar
        muscle disease, supporting reduced pathway output as the shared cause.

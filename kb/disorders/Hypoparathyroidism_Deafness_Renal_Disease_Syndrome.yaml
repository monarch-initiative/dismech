  evidence:
  - reference: PMID:41064049
    reference_title: "Long-Term Renal Transplant Success Is Possible in Hypoparathyroidism, Sensorineural Deafness, and Renal Dysplasia Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had a living donor kidney transplant at age 47 that was well tolerated
      until age 73, and he is now listed for a repeat transplant.
    explanation: >-
      Long-term graft survival after transplantation in HDR.
  - reference: PMID:41064049
    reference_title: "Long-Term Renal Transplant Success Is Possible in Hypoparathyroidism, Sensorineural Deafness, and Renal Dysplasia Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current limited evidence suggests kidney transplantation should be
      readily offered to individuals with end-stage renal disease due to HDR
      syndrome.
    explanation: >-
      Authors' recommendation, based on limited case evidence.
differential_diagnoses:
- name: 22q11.2 deletion syndrome
  description: >-
    Shares hypoparathyroidism and can include renal anomalies and hearing
    loss; distinguished by conotruncal heart defects, immunodeficiency and
    palatal anomalies. Terminal 10p deletions give an overlapping
    DiGeorge-like picture.
  disease_term:
    preferred_term: 22q11.2 deletion syndrome
    term:
      id: MONDO:0018923
      label: 22q11.2 deletion syndrome
  evidence:
  - reference: PMID:10935639
    reference_title: "GATA3 haplo-insufficiency causes human HDR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Terminal deletions of chromosome 10p result in a DiGeorge-like phenotype
      that includes hypoparathyroidism, heart defects, immune deficiency,
      deafness and renal malformations.
    explanation: >-
      Documents the phenotypic overlap between 10p deletions (including GATA3)
      and DiGeorge syndrome.
- name: Alport syndrome
  description: >-
    Combines sensorineural hearing loss with progressive kidney disease and can
    be misdiagnosed for HDR in adults; lacks hypoparathyroidism and congenital
    renal malformation, and has ocular findings and type IV collagen variants.
  disease_term:
    preferred_term: Alport syndrome
    term:
      id: MONDO:0018965
      label: Alport syndrome
  evidence:
  - reference: PMID:41064049
    reference_title: "Long-Term Renal Transplant Success Is Possible in Hypoparathyroidism, Sensorineural Deafness, and Renal Dysplasia Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This individual previously had a clinical diagnosis of Alport syndrome,
      but the presence of congenital symptoms in other family members suggested
      an alternative diagnosis.
    explanation: >-
      A documented misdiagnosis of HDR as Alport syndrome.
- name: Branchiootorenal syndrome
  description: >-
    Combines hearing loss with renal dysplasia or hypoplasia, but hearing loss
    is often conductive or mixed, branchial and ear malformations are present,
    and parathyroid function is normal.
  disease_term:
    preferred_term: branchiootorenal syndrome 1
    term:
      id: MONDO:0007236
      label: branchiootorenal syndrome 1
animal_models:
- name: Gata3 heterozygous knockout mouse
  species: Mouse
  genotype: Gata3 +/-
  publication: PMID:20484821
  description: >-
    The heterozygous null mouse is the genetic equivalent of HDR. Under a
    low-calcium, low-vitamin D diet it shows smaller parathyroids with low PTH
    and calcium; it has progressive cochlear hair cell degeneration with about
    30 dB hearing loss; and it has a mesangial precursor deficit with
    glomerular abnormalities. Homozygous nulls die in utero and lack
    parathyroid-thymus primordia and kidneys.
  modeled_mechanisms:
  - target: Parathyroid Gland Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      The parathyroid defect is exposed by dietary calcium and vitamin D
      restriction rather than being overt on a normal diet.
    evidence:
    - reference: PMID:20484821
      reference_title: "Gata3-deficient mice develop parathyroid abnormalities due to dysregulation of the parathyroid-specific transcription factor Gcm2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Compared with their wild-type littermates, Gata3+/- mice had lower
        plasma concentrations of calcium and parathyroid hormone (PTH) and
        smaller parathyroid glands with a reduced Ki-67 proliferation rate.
      explanation: >-
        Heterozygous mice reproduce the hypoplastic parathyroid and low PTH.
  - target: Cochlear Outer Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    evidence:
    - reference: PMID:15207274
      reference_title: "Hearing loss following Gata3 haploinsufficiency is caused by cochlear disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Auditory brainstem response (ABR) thresholds of alert heterozygous
        Gata3 mice, analyzed from 1 to 19 months of age, showed a hearing loss
        of 30 dB compared to wild-type littermates.
      explanation: >-
        Hearing loss in heterozygous mice, with cochlear origin.
  - target: Mesangial Cell Precursor Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    evidence:
    - reference: PMID:31405951
      reference_title: "A Novel Role for GATA3 in Mesangial Cells in Glomerular Development and Injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In mice, we uncover that GATA3 is essential for normal glomerular
        development, and mice with haploinsufficiency of Gata3 have too few MC
        precursors and glomerular abnormalities.
      explanation: >-
        Heterozygous mice show the mesangial precursor deficit.
notes: >-
  No GeneReviews chapter exists for this disease (checked with
  `just check-genereviews --online`, Bookshelf index snapshot 2026-09-10).
  Rare additional features reported in single cases include diabetes mellitus,
  congenital heart defects, choanal atresia and biliary atresia; they are not
  modeled here as their relationship to GATA3 is not established.

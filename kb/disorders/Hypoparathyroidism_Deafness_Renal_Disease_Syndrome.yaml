    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31405951
    reference_title: "A Novel Role for GATA3 in Mesangial Cells in Glomerular Development and Injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice, we uncover that GATA3 is essential for normal glomerular
      development, and mice with haploinsufficiency of Gata3 have too few MC
      precursors and glomerular abnormalities.
    explanation: >-
      Heterozygous Gata3 mice, the genetic equivalent of HDR, have a mesangial
      precursor deficit and glomerular abnormalities.
- name: Glomerular Injury and Progressive Nephron Loss
  biological_scale: TISSUE
  description: >-
    Dysplastic or hypoplastic kidneys and glomerular lesions lead in a subset
    of patients to proteinuria, sometimes in the nephrotic range, focal
    segmental glomerulosclerosis, and a progressive fall in kidney function.
    About one in ten reported patients reaches end-stage kidney disease, at ages
    from adolescence to late adulthood. The renal course is the main
    determinant of overall prognosis.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney

    causal_link_type: DIRECT
  - target: Focal segmental glomerulosclerosis
    causal_link_type: DIRECT
  - target: Stage 5 chronic kidney disease
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27387476
    reference_title: "Clinical and mutational spectrum of hypoparathyroidism, deafness and renal dysplasia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients displayed nephrotic-range proteinuria and reached end-stage

    reference_title: "Gata3 cooperates with Gcm2 and MafB to activate parathyroid hormone gene expression by interacting with SP1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gata3 interacted with Gcm2 and MafB, two known transcriptional regulators
      of parathyroid development, and synergistically stimulated the PTH

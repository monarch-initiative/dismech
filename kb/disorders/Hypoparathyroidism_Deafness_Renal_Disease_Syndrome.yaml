name: Hypoparathyroidism-Deafness-Renal Disease Syndrome
creation_date: "2026-09-23T19:10:07Z"
category: Mendelian
description: >-
  Hypoparathyroidism-deafness-renal disease (HDR) syndrome, also called Barakat
  syndrome, is an autosomal dominant developmental disorder caused by
  heterozygous loss-of-function variants or whole-gene deletions of GATA3, a
  dual zinc-finger transcription factor required for development of the
  parathyroid glands, the cochlea and the kidney. It is defined by the triad of
  hypoparathyroidism with hypocalcemia, bilateral sensorineural hearing loss and
  renal disease, which ranges from dysplasia, hypoplasia, agenesis, cysts and
  vesicoureteral reflux to glomerular disease with proteinuria and progression
  to end-stage kidney disease in a minority. Penetrance and expressivity of
  each component are variable, even within one family, and the penetrance of
  each defect increases with age. Hearing loss is the most constant feature;
  only about two thirds of reported patients show the complete triad.
synonyms:
- Barakat syndrome
- HDR syndrome
- hypoparathyroidism, sensorineural deafness, and renal dysplasia syndrome
- hypoparathyroidism, deafness, and renal anomalies syndrome
- hypoparathyroidism, sensorineural deafness, and renal disease
- nephrosis, nerve deafness, and hypoparathyroidism

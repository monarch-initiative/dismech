    explanation: >-
      Disease alleles lose this transactivation function.
- name: Deficient Parathyroid Hormone Secretion
  biological_scale: ORGANISM
  description: >-
    Circulating PTH is low or inappropriately normal for the serum calcium.
    Loss of PTH action reduces renal calcium reabsorption, bone resorption and
    renal phosphate excretion, producing hypocalcemia with hyperphosphatemia
    and, in treated patients, hypercalciuria.
  biological_processes:
  - preferred_term: parathyroid hormone secretion
    modifier: DECREASED
    term:
      id: GO:0035898
      label: parathyroid hormone secretion

  evidence:
  - reference: PMID:15207274
    reference_title: "Hearing loss following Gata3 haploinsufficiency is caused by cochlear disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cochleae of heterozygous Gata3 mice showed significant progressive
      morphological degeneration starting with the outer hair cells (OHCs) at
      the apex and ultimately affecting all hair cells and supporting cells in
      the entire cochlea
    explanation: >-
      Localizes the auditory lesion of Gata3 haploinsufficiency to cochlear
      hair cells, beginning with the outer hair cells.
  - reference: PMID:15994092
    reference_title: "GATA3 haploinsufficiency causes a rapid deterioration of distortion product otoacoustic emissions (DPOAEs) in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these findings indicate that outer hair cell malfunctioning
      plays a major role in the hearing loss in HDR-syndrome.
    explanation: >-
      Functional (DPOAE) and ultrastructural evidence for outer hair cell
      failure in the heterozygous mouse.
  - reference: PMID:24434941
    reference_title: "Audiometric characteristics of a dutch family with a new mutation in GATA3 causing HDR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, the results of the psychophysical measurements indicated
      characteristics of outer hair cell loss.
    explanation: >-
      Human psychophysical data consistent with the outer hair cell mechanism
      seen in mice.
  - reference: PMID:31069810
    reference_title: "Gata3 is required for the functional maturation of inner hair cells and their innervation in the mouse cochlea."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we find that in heterozygous gata3 null mice (gata3+/- ) outer hair
      cells (OHCs) differentiate normally but their numbers are significantly
      lower.
    explanation: >-
      Confirms outer hair cell loss in the heterozygous state, the genotype of
      HDR patients; the same study shows immature inner hair cells as a second
      contributor.
  - reference: PMID:23666531
    reference_title: "GATA3 controls the specification of prosensory domain and neuronal survival in the mouse cochlea."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of Gata3 function leads to the failure in the specification of
      prosensory domain and subsequently, to increased cell death in the
      cochlear duct.
    explanation: >-
      Complete inner-ear loss of Gata3 shows its requirement in cochlear
      development; this is a stronger lesion than the human heterozygous state.
- name: Dysregulated Nephric Duct and Ureteric Bud Development
  biological_scale: CELLULAR
  description: >-
    GATA3 is expressed in the nephric (Wolffian) duct downstream of PAX2/PAX8
    and beta-catenin and upstream of RET. Its loss causes premature nephric duct
    differentiation, loss of RET expression and ectopic ureteric budding,
    producing a spectrum of congenital anomalies of the kidney and urinary tract
    (renal adysplasia, duplex systems, hydroureter) and of the genital tract
    derived from the same primordia. This is the proposed basis for the
    dysplastic renal and genital malformations of HDR, although the mouse
    evidence comes from homozygous or conditional loss rather than
    heterozygosity.
  cell_types:
  - preferred_term: ureteric bud cell
    term:
      id: CL:4030066
      label: ureteric bud cell
  biological_processes:
  - preferred_term: mesonephric duct development
    modifier: ABNORMAL
    term:
      id: GO:0072177
      label: mesonephric duct development
  - preferred_term: ureteric bud development
    modifier: ABNORMAL
    term:
      id: GO:0001657
      label: ureteric bud development
  downstream:

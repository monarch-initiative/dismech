    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most frequently observed abnormality was deafness (93%), followed by
      hypoparathyroidism (87%) and renal defects (61%).
    explanation: >-
      Frequency of hypoparathyroidism across 177 reported patients.
  - reference: PMID:27387476
    reference_title: "Clinical and mutational spectrum of hypoparathyroidism, deafness and renal dysplasia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Review of 115 previously reported cases of GATA-3 mutations showed
      hypoparathyroidism and deafness in 95% of patients, and renal
      abnormalities in only 60%.
    explanation: >-
      Independent literature review with a similar frequency estimate.
  - reference: PMID:42595857
    reference_title: "Clinical and genetic characteristics of hypoparathyroidism, deafness, and renal dysplasia syndrome in a chronic kidney disease cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regarding the classical triad, hypoparathyroidism, deafness, and renal
      anomalies were observed in 45, 100, and 90% of patients, respectively.
    explanation: >-

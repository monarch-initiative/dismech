    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In humans, autosomal dominant GATA3 mutations can cause renal aplasia as
      part of the hypoparathyroidism, renal dysplasia, deafness (HDR) syndrome
      that includes mesangioproliferative GN.
    explanation: >-
      Background statement from the mouse study linking HDR to glomerular
      (mesangioproliferative) disease in patients.
phenotypes:
- category: Endocrine
  name: Hypoparathyroidism
  frequency: VERY_FREQUENT
  description: >-
    Present in about 87-95% of reported patients across literature reviews,
    though lower (45%) in patients ascertained through kidney disease clinics.
    Mean age at diagnosis is about 7.5 years, but it may be found incidentally
    in adulthood. It is usually the component that brings the patient to
    medical attention, through symptomatic hypocalcemia.
  phenotype_term:
    preferred_term: Hypoparathyroidism
    term:
      id: HP:0000829
      label: Hypoparathyroidism
  evidence:

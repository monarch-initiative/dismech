genetic:
- name: GATA3
  gene_term:
    preferred_term: GATA3
    term:
      id: hgnc:4172
      label: GATA3
  association: Heterozygous loss-of-function variants or whole-gene deletion
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    GATA3 maps to 10p14-p15. Larger terminal 10p deletions that remove GATA3
    produce HDR features as part of a contiguous gene syndrome that can overlap
    with the DiGeorge-like 10p13-p14 region. Missense variants cluster in the
    two zinc-finger domains. Patients with whole-gene deletions and
    protein-truncating variants are diagnosed earlier than those with missense
    variants. A missense variant with dominant-negative activity in vitro has
    been reported, but haploinsufficiency is the established mechanism.
    Isolated hypoparathyroidism without deafness or renal disease has not been
    associated with GATA3 variants.
  evidence:
  - reference: PMID:10935639
    reference_title: "GATA3 haplo-insufficiency causes human HDR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have performed deletion-mapping studies in two HDR patients, and here
      we define a critical 200-kilobase region which contains the GATA3 gene.
    explanation: >-
      Deletion mapping to GATA3, the first line of evidence for the gene.
  - reference: PMID:32442337
    reference_title: "Hypoparathyroidism, deafness, and renal dysplasia syndrome: 20 Years after the identification of the first GATA3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Missense mutations were found to cluster in the regions encoding the two
      GATA3 zinc-finger domains.
    explanation: >-
      Location of missense variants, stated in the notes.
  - reference: PMID:32442337
    reference_title: "Hypoparathyroidism, deafness, and renal dysplasia syndrome: 20 Years after the identification of the first GATA3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, patients with whole-gene deletions and protein-truncating
      mutations were diagnosed earlier than patients with missense mutations.
    explanation: >-
      The genotype-phenotype observation stated in the notes.
  - reference: PMID:21120445
    reference_title: "Novel dominant-negative mutant of GATA3 in HDR syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, mutated GATA3 exerted a dominant-negative effect over the
      transactivation activity of wild-type GATA3.
    explanation: >-
      The single reported dominant-negative missense allele (Cys321Ser).
  - reference: PMID:17210674
    reference_title: "Functional characterization of GATA3 mutations causing the hypoparathyroidism-deafness-renal (HDR) dysplasia syndrome: insight into mechanisms of DNA binding by the GATA3 transcription factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No mutations were identified in patients with isolated hypoparathyroidism,
      thereby indicating that GATA3 abnormalities are more likely to result in
      two or more of the phenotypic features of the HDR syndrome and not in one,
      such as isolated hypoparathyroidism.
    explanation: >-
      Negative screening of 14 isolated hypoparathyroidism patients.

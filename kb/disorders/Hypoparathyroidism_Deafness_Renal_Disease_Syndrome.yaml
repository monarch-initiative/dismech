diagnosis:
- name: Clinical and Molecular Diagnosis of HDR Syndrome
  description: >-
    HDR should be considered in any patient with two of the three components,
    and in particular in hypoparathyroidism with deafness whether or not renal
    disease is present, and in chronic kidney disease with sensorineural
    deafness. Apparently idiopathic hypoparathyroidism warrants evaluation of
    hearing and kidneys. The diagnosis is confirmed by a heterozygous
    pathogenic GATA3 variant; copy-number analysis is required because about
    15% of variants are whole-gene deletions. Relatives should be screened for
    parathyroid, auditory and renal involvement given the variable expressivity.
  evidence:
  - reference: PMID:27387476
    reference_title: "Clinical and mutational spectrum of hypoparathyroidism, deafness and renal dysplasia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of HDR should be considered in any patient with
      hypoparathyroidism and deafness, whether associated with renal
      abnormalities or not. HDR diagnosis is established through identification
      of a mutation in the GATA-3 gene.
    explanation: >-
      Diagnostic recommendation and confirmation by GATA3 testing.
  - reference: PMID:42595857
    reference_title: "Clinical and genetic characteristics of hypoparathyroidism, deafness, and renal dysplasia syndrome in a chronic kidney disease cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with CKD and sensorineural deafness, HDR syndrome should be
      considered, and comprehensive genetic testing, including copy number
      analysis, is essential for accurate diagnosis.
    explanation: >-
      Supports testing in CKD with deafness and the need for copy-number
      analysis.
  - reference: PMID:37561279
    reference_title: "Clinical and molecular characteristics of two Italian kindreds with hypoparathyroidism, deafness and renal dysplasia (HDR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HDR syndrome is a rare cause of hypoparathyroidism and must be excluded
      in all patients with apparently idiopathic hypoparathyroidism.
    explanation: >-
      Supports evaluating idiopathic hypoparathyroidism for HDR.
  - reference: PMID:29663634
    reference_title: "Barakat syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We suggest that the diagnosis could be confirmed in patients who have all
      three components, and in those who have two components with a positive
      family history.
    explanation: >-
      Proposed clinical diagnostic criteria from a review of 180 cases.
treatments:
- name: Calcium and Active Vitamin D Supplementation
  description: >-
    Hypocalcemia due to hypoparathyroidism is treated as in other forms of
    hypoparathyroidism, with oral calcium and an active vitamin D analogue
    such as calcitriol, aiming for low-normal serum calcium to limit
    hypercalciuria and nephrocalcinosis, a particular concern when the
    kidneys are already abnormal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium carbonate
      term:
        id: CHEBI:3311
        label: calcium carbonate
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
  target_mechanisms:
  - target: Hypocalcemia
    description: >-
      Replaces calcium and bypasses the lost PTH-dependent activation of
      vitamin D.
  evidence:
  - reference: PMID:37908274
    reference_title: "Hypoparathyroidism, Sensorineural Deafness, and Renal Disease Syndrome Presenting With Febrile Seizures and Hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypocalcemia was responsive to calcium carbonate and calcitriol treatment.
    explanation: >-
      Case report of response of HDR-related hypocalcemia to calcium carbonate
      and calcitriol.
- name: Parathyroid Hormone Replacement (Palopegteriparatide)
  description: >-
    Conventional calcium and active vitamin D does not replace the renal and
    skeletal actions of PTH and carries a risk of hypercalciuria,
    nephrocalcinosis and stones. Palopegteriparatide, a once-daily prodrug of
    PTH(1-34), is approved for chronic hypoparathyroidism as a replacement
    therapy and in the phase 3 PaTHway trial normalized urinary calcium and was
    associated with improved eGFR. The evidence is from adults with chronic
    hypoparathyroidism of mixed causes, not specifically HDR; it is relevant here
    because HDR patients often have structurally abnormal kidneys.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: palopegteriparatide
      term:
        id: CHEBI:759036
        label: palopegteriparatide
  target_mechanisms:
  - target: Deficient Parathyroid Hormone Secretion
    description: >-
      Replaces the missing hormone rather than compensating for its effects.
  evidence:
  - reference: PMID:28857066
    reference_title: "Hypoparathyroidism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Conventional treatment includes activated vitamin D and/or calcium
      supplements, but this treatment does not fully replace the functions of
      PTH and can lead to short-term problems (such as hypocalcaemia,
      hypercalcaemia and increased urinary calcium excretion) and long-term
      complications (which include nephrocalcinosis, kidney stones and brain
      calcifications).
    explanation: >-
      The limitation of conventional therapy that motivates PTH replacement.
  - reference: PMID:42166177
    reference_title: "Sustained improvement in renal function with palopegteriparatide in adults with chronic hypoparathyroidism: 2-year results from the phase 3 PaTHway-trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Palopegteriparatide treatment normalized mean (SD) 24-h urine calcium
      within 26 wk and maintained levels below 250 mg/d through Week 104
    explanation: >-
      Trial evidence in chronic hypoparathyroidism of any cause (not HDR
      specifically) that PTH replacement controls hypercalciuria.
  - reference: PMID:39987371
    reference_title: "PTH Substitution Therapy for Chronic Hypoparathyroidism: PTH 1-84 and Palopegteriparatide."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Recently, the Food & Drug Administration and the European Medicines
      Agency approved palopegteriparatide as the first true replacement therapy
      for hypoPT management.
    explanation: >-
      Regulatory approval status for hypoparathyroidism in general.
- name: Hearing Rehabilitation (Hearing Aids or Cochlear Implantation)
  description: >-
    Hearing should be assessed as early as possible. Management follows that
    of other sensorineural hearing loss: hearing aids for mild-to-moderate loss
    and cochlear implantation for severe-to-profound loss.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing device fitting and auditory rehabilitation

    reference_title: "HDR syndrome: Large cohort and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An autosomal dominant disease caused by heterozygous pathogenic GATA3
      variants, the penetrance of each associated condition is variable.
    explanation: >-
      States the dominant mode of inheritance and the variable penetrance of
      each component in a 28-patient cohort combined with a literature review.
  - reference: PMID:32442337
    reference_title: "Hypoparathyroidism, deafness, and renal dysplasia syndrome: 20 Years after the identification of the first GATA3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The hypoparathyroidism, deafness, and renal dysplasia (HDR) syndrome is an
      autosomal dominant disorder caused by heterozygous mutations of the GATA3
      gene.
    explanation: >-
      Review of all reported families restating the autosomal dominant
      inheritance of heterozygous GATA3 variants.
pathophysiology:
- name: GATA3 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous GATA3 variants (frameshift, nonsense, splice-site, missense
    and whole-gene deletions) halve the dose of functional GATA3. Over 90% of
    characterized variants abolish DNA binding by removing or disrupting the
    C-terminal zinc finger; missense variants cluster in the two zinc-finger
    domains and either abolish DNA binding, reduce binding affinity, or, for
    N-terminal finger variants, disrupt interaction with the cofactor FOG2.
    Whole-gene deletions produce the same syndrome, which is the primary
    argument for haploinsufficiency as the mechanism.
  genetic_context:
    gene:
      preferred_term: GATA3
      term:
        id: hgnc:4172
        label: GATA3
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: GATA3 sequence-specific DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity

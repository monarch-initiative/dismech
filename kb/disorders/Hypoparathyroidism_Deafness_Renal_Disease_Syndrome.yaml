      nephron complement, one route to later loss of kidney function.
  evidence:
  - reference: PMID:19112489
    reference_title: "Gata3 acts downstream of beta-catenin signaling to prevent ectopic metanephric kidney induction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that the nephric duct-specific inactivation of the
      transcription factor gene Gata3 leads to massive ectopic ureter budding.
      This results in a spectrum of urogenital malformations including kidney
      adysplasia, duplex systems, and hydroureter, as well as vas deferens
      hyperplasia and uterine agenesis.
    explanation: >-
      Links loss of Gata3 in the nephric duct to renal adysplasia and genital
      tract malformations resembling human CAKUT.
  - reference: PMID:19112489
    reference_title: "Gata3 acts downstream of beta-catenin signaling to prevent ectopic metanephric kidney induction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that Gata3 inactivation causes premature nephric duct cell
      differentiation and loss of Ret receptor gene expression.
    explanation: >-
      Identifies the cellular defect: premature differentiation and loss of RET.
  - reference: PMID:16319112
    reference_title: "Pax 2/8-regulated Gata 3 expression is necessary for morphogenesis and guidance of the nephric duct in the developing kidney."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At the molecular level, the nephric duct of Gata3(-/-) embryos is
      characterized by the loss of Ret expression and signaling
    explanation: >-
      Independent confirmation that Gata3 is required for RET expression in the
      nephric duct.
- name: Mesangial Cell Precursor Deficiency
  biological_scale: CELLULAR
  description: >-
    GATA3 is expressed in FOXD1-lineage stromal progenitors that give rise to
    glomerular mesangial cells and remains expressed in adult mesangial cells.
    Gata3 heterozygous mice have too few mesangial precursors and glomerular
    abnormalities, which offers a mechanism for the glomerular disease
    (mesangioproliferative glomerulonephritis, proteinuria, focal segmental
    glomerulosclerosis) seen in some HDR patients.
  cell_types:
  - preferred_term: glomerular mesangial cell
    term:
      id: CL:1000742
      label: glomerular mesangial cell
  biological_processes:
  - preferred_term: glomerulus development

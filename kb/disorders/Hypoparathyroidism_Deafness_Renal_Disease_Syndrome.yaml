      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:38940299
    reference_title: "HDR syndrome: Large cohort and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As mentioned in the literature, hearing function should always be
      assessed as early as possible
    explanation: >-
      Recommendation for early hearing assessment, the entry point to hearing
      rehabilitation.
  - reference: PMID:29073906
    reference_title: "HDR syndrome with a novel mutation in GATA3 mimicking a congenital X-linked stapes gusher: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 14-month-old boy, with sensorineural hearing loss in both ears, showed
      typical radiological features of X-linked stapes gusher on preoperative
      temporal bone computed tomography (CT) for cochlear implantations.
    explanation: >-
      An HDR infant evaluated for cochlear implantation; documents the use of
      implantation in this disease, not its outcome.
- name: Kidney Transplantation
  description: >-
    For patients reaching end-stage kidney disease, kidney transplantation has
    been performed with long-term success, including a living related graft
    functioning for 26 years.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_mechanisms:

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:10935639
    reference_title: "GATA3 haplo-insufficiency causes human HDR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigation for GATA3 mutations in three other HDR probands identified
      one nonsense mutation and two intragenic deletions that predicted a loss
      of function, as confirmed by absence of DNA binding by the mutant GATA3
      protein.
    explanation: >-
      The gene-discovery study: deletion mapping plus loss-of-function point
      variants establish GATA3 haploinsufficiency as the cause of HDR.
  - reference: PMID:17210674
    reference_title: "Functional characterization of GATA3 mutations causing the hypoparathyroidism-deafness-renal (HDR) dysplasia syndrome: insight into mechanisms of DNA binding by the GATA3 transcription factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Electrophoretic mobility shift assays (EMSAs) revealed three classes of
      GATA3 mutations: those that lead to a loss of DNA binding which represent
      over 90% of all mutations, and involved a loss of the carboxy-terminal
      zinc finger
    explanation: >-
      Functional assays showing that the large majority of HDR alleles abolish
      DNA binding, the molecular basis of the dosage loss.
  - reference: PMID:14985365
    reference_title: "Characterization of GATA3 mutations in the hypoparathyroidism, deafness, and renal dysplasia (HDR) syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations involving GATA3 ZnF2 or adjacent basic amino acids resulted in a
      loss of DNA binding, but those of ZnF1 either lead to a loss of
      interaction with specific FOG2 ZnFs or altered DNA-binding affinity.
    explanation: >-
      Distinguishes the two functional classes of zinc-finger variants
      summarized in the node description.
  - reference: PMID:32442337
    reference_title: "Hypoparathyroidism, deafness, and renal dysplasia syndrome: 20 Years after the identification of the first GATA3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reported mutations consist of 40% frameshift deletions or insertions, 23%
      missense mutations, 14% nonsense mutations, 6% splice-site mutations, 1%
      in-frame deletions or insertions, 15% whole-gene deletions, and 1%
      whole-gene duplication.
    explanation: >-
      Allelic spectrum across 124 reported families; the prominence of
      truncating variants and whole-gene deletions supports dosage loss.
- name: Reduced GCM2 Expression in Parathyroid Progenitors
  biological_scale: MOLECULAR
  description: >-
    GATA3 binds a double-GATA motif in the promoter of GCM2 (GCMB), the
    parathyroid-specific transcription factor, and is required for its
    expression in the third pharyngeal pouch. Halving GATA3 dose reduces the
    number of GCM2-expressing parathyroid progenitors.
  cell_types:
  - preferred_term: parathyroid chief cell progenitor
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  biological_processes:
  - preferred_term: parathyroid gland development
    modifier: DECREASED
    term:
      id: GO:0060017
      label: parathyroid gland development
  downstream:
  - target: Parathyroid Gland Hypoplasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20484821
    reference_title: "Gata3-deficient mice develop parathyroid abnormalities due to dysregulation of the parathyroid-specific transcription factor Gcm2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Electrophoretic mobility shift, luciferase reporter, and chromatin
      immunoprecipitation assays showed that GATA3 binds specifically to a
      functional double-GATA motif within the GCMB promoter.
    explanation: >-
      Direct binding of GATA3 to the GCMB promoter places GCM2 downstream of
      GATA3.
  - reference: PMID:20484821
    reference_title: "Gata3-deficient mice develop parathyroid abnormalities due to dysregulation of the parathyroid-specific transcription factor Gcm2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At E11.5, Gata3+/- embryos had smaller parathyroid-thymus primordia with
      fewer cells expressing the parathyroid-specific gene glial cells missing 2
      (Gcm2), the homolog of human GCMB.
    explanation: >-
      Heterozygous mouse embryos, the genetic equivalent of HDR, have fewer
      Gcm2-expressing parathyroid progenitors.
- name: Parathyroid Gland Hypoplasia
  biological_scale: TISSUE
  description: >-
    Reduced specification and survival of parathyroid progenitors leaves
    smaller parathyroid glands with reduced proliferative capacity, which cannot
    mount an adequate response to hypocalcemic challenge.
  locations:
  - preferred_term: parathyroid gland
    term:
      id: UBERON:0001132
      label: parathyroid gland
  downstream:
  - target: Deficient Parathyroid Hormone Secretion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20484821
    reference_title: "Gata3-deficient mice develop parathyroid abnormalities due to dysregulation of the parathyroid-specific transcription factor Gcm2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Compared with their wild-type littermates, Gata3+/- mice had lower plasma
      concentrations of calcium and parathyroid hormone (PTH) and smaller
      parathyroid glands with a reduced Ki-67 proliferation rate.
    explanation: >-
      Gata3 heterozygous mice have hypoplastic, hypoproliferative parathyroids
      together with low PTH and calcium.
- name: Reduced PTH Gene Transactivation
  biological_scale: MOLECULAR
  description: >-
    In addition to its developmental role, GATA3 cooperates with GCM2, MAFB and
    SP1 to activate the parathyroid hormone gene promoter. HDR-associated GATA3
    mutants fail to activate the PTH promoter, so PTH output per parathyroid
    cell may also be reduced.
  biological_processes:
  - preferred_term: GATA3-dependent activation of PTH transcription
    modifier: DECREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II

    reference_title: "Hypoparathyroidism, Sensorineural deafness and renal disease (Barakat syndrome) caused by a reduced gene dosage in GATA3: a case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical investigations showed persistent low serum corrected calcium
      levels with hyperphosphataemia, hypomagnesaemia, low parathyroid hormone
      levels, hypercalciuria, and low total 25-hydroxy vitamin D levels.
    explanation: >-
      The biochemical profile of PTH deficiency in a patient with a GATA3
      whole-gene deletion.
- name: Cochlear Outer Hair Cell Degeneration
  biological_scale: CELLULAR
  description: >-
    The hearing loss of HDR is peripheral (cochlear) rather than central. In
    Gata3 heterozygous mice, degeneration starts in the outer hair cells at the
    cochlear apex and progresses to involve all hair cells and supporting cells;
    otoacoustic emissions deteriorate rapidly and outer hair cells accumulate
    vacuoles. Psychophysical testing in HDR patients shows the signature of
    outer hair cell loss. Complete loss of Gata3 in the developing inner ear
    additionally abolishes prosensory specification and depletes spiral
    ganglion neurons, showing that the gene is required at several steps of
    cochlear development.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea

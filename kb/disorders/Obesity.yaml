  notes: Sedentary behaviour is associated with becoming overweight or obese (OR 1.33
    highest vs lowest category), though its association with body weight itself is
    small and inconsistent
  evidence:
  - reference: PMID:29189928
    reference_title: "Sedentary Behavior and Body Weight and Composition in Adults: A Systematic Review and Meta-analysis of Prospective Studies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-analysis of data from prospective cohort studies showed small, inconsistent and non-significant associations between sedentary behavior and body weight"
    explanation: "PARTIAL, and the note was rewritten, because this is less settled than it is usually assumed to be. The same meta-analysis did find a significant odds ratio of 1.33 for becoming overweight or obese in the highest versus lowest sedentary category, and a small waist-circumference effect -- but not an association with body weight, and it does not evidence the reduced-energy-expenditure mechanism the note previously asserted."
  - reference: PMID:29189928
    reference_title: "Sedentary Behavior and Body Weight and Composition in Adults: A Systematic Review and Meta-analysis of Prospective Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The odds ratio of becoming overweight or obese was 1.33 (95% CI 1.11-1.60; p = 0.001) in the highest compared with lowest categories of sedentary behavior"
    explanation: "Quotes the odds ratio the rewritten note states, so the note is self-supporting rather than relying on a figure the reader must go to the abstract to find. Paired deliberately with the PARTIAL item above: this is the positive signal, that one is the null result it sits inside."

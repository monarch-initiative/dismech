- name: Pasteurized Akkermansia muciniphila MucT Supplementation
  therapeutic_modality: OTHER
  description: >
    Daily oral capsules of pasteurized Akkermansia muciniphila MucT (heat-treated 30
    minutes at 70 C; 3 x 10^10 inactivated cells per capsule) taken during the weight
    maintenance phase that follows a low-energy diet. Heat inactivation removes the
    oxygen sensitivity and manufacturing constraints of the live organism while
    preserving the thermostable outer-membrane protein Amuc_1100, and in rodents it
    increased rather than abolished the metabolic benefit. The indication tested is
    maintenance of weight already lost, not weight loss itself.
  treatment_term:
    preferred_term: pasteurized Akkermansia muciniphila MucT supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    qualifiers:
    - predicate:
        preferred_term: dietary supplement
        term:
          id: NCIT:C1505
          label: Dietary Supplement
      value:
        preferred_term: pasteurized Akkermansia muciniphila MucT
        term:
          id: NCIT:C200541
          label: Akkermansia muciniphila Probiotic
  notes: >
    The agent term NCIT:C200541 is carried as a qualifier rather than in
    therapeutic_agent because it sits under Dietary Supplement (NCIT:C1505) and is not
    reachable from NCIT:C1909 (Pharmacologic Substance), the root of the
    ChemicalEntityTerm enum that binds therapeutic_agent. Two limits on the claim:
    pasteurized cells are non-viable and do not colonize, so the effect is
    host-directed rather than a restoration of the endogenous Akkermansia population,
    and the trial found no between-group difference in fecal microbiota composition;
    and no arm received a MucT strain lacking Amuc_1100, so specificity to that
    protein is not established in humans.
  target_mechanisms:
  - target: Post-Weight-Loss Weight Regain
    treatment_effect: INHIBITS
    description: >
      The registered primary outcome. Over 24 weeks of ad libitum healthy diet after
      an 8-week low-energy diet, the supplemented group regained less weight than
      placebo and ended with greater net weight loss from baseline.
    evidence:
    - reference: PMID:42120725
      reference_title: "Pasteurized Akkermansia muciniphila Muc(T) for weight loss maintenance in people with overweight and obesity: a controlled randomized trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Here we show that MucT led to lower body weight regain versus placebo at the end of the weight maintenance period (MucT: 1.2 ± 0.7 kg, placebo: 3.2 ± 0.4 kg, P = 0.012)."
      explanation: Primary outcome of the randomized trial, stating the effect on the targeted mechanism.
  - target: Efficient Intestinal Energy Harvest
    treatment_effect: INHIBITS
    description: >
      Proposed mechanism: a shift of ingested energy from absorption to fecal
      excretion. Established in diet-induced obese mice; in the human trial the
      increase in fecal energy content did not reach significance, and only the
      within-group inverse association with weight change supported it.
    evidence:
    - reference: PMID:32167023
      reference_title: "Pasteurized Akkermansia muciniphila increases whole-body energy expenditure and fecal energy excretion in diet-induced obese mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "We confirmed that daily oral administration of pasteurized A. muciniphila alleviated diet-induced obesity and decreased food energy efficiency."
      explanation: Shows the treatment acts on how efficiently ingested energy is retained.
  - target: Intestinal Barrier Dysfunction and Metabolic Endotoxemia
    treatment_effect: RESTORES
    description: >
      Proposed mechanism: the thermostable outer-membrane protein Amuc_1100 signals
      through TLR2 and improves gut barrier function, which is the route by which a
      non-viable preparation can act on host metabolism without colonizing.
    evidence:
    - reference: PMID:27892954
      reference_title: "A purified membrane protein from Akkermansia muciniphila or the pasteurized bacterium improves metabolism in obese and diabetic mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "We demonstrated that Amuc_1100, a specific protein isolated from the outer membrane of A. muciniphila, interacts with Toll-like receptor 2, is stable at temperatures used for pasteurization, improves the gut barrier and partly recapitulates the beneficial effects of the bacterium."
      explanation: Establishes the barrier-directed mechanism and that it survives pasteurization.
  evidence:
  - reference: PMID:42120725
    reference_title: "Pasteurized Akkermansia muciniphila Muc(T) for weight loss maintenance in people with overweight and obesity: a controlled randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Additionally, the MucT group had a greater net weight loss from baseline to end of maintenance than the placebo group (3.1 ± 0.7 kg, P = 0.009)."
    explanation: Net weight loss from baseline to the end of maintenance, the secondary anthropometric outcome.
  - reference: PMID:42120725
    reference_title: "Pasteurized Akkermansia muciniphila Muc(T) for weight loss maintenance in people with overweight and obesity: a controlled randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "No serious adverse events related to the treatment were observed."
    explanation: Safety outcome of the 24-week maintenance trial.
  - reference: PMID:31263284
    reference_title: "Supplementation with Akkermansia muciniphila in overweight and obese human volunteers: a proof-of-concept exploratory study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

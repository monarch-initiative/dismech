discussions:
- discussion_id: obesity_pgsxc_reverse_causation
  prompt: >-
    Are the obesity PGS×context interactions driven by adverse exposures causally
    amplifying genetic risk, or are some "contexts" (e.g. fasting insulin, leptin,
    reduced physical activity) actually downstream consequences of adiposity
    (reverse causation)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Energy Imbalance
  - biochemical#Leptin
  - biochemical#Fasting Insulin
  - environmental#Sedentary Lifestyle
  rationale: >-
    Population PGS×context analyses (Nagpal & Gibson 2026, PMID:42443528) are
    largely unable to establish the causality of specific contexts. For obesity
    this is acute for the biochemical "contexts": leptin and fasting insulin rise
    as a consequence of increased fat mass and are modelled in this entry as
    readouts of adipose dysfunction rather than upstream drivers, and reduced
    physical activity or slower walking pace may be consequences of established
    obesity rather than causes. Distinguishing genuine amplification of genetic
    effects from reverse causation determines whether the modelled lifestyle
    interventions would actually reduce risk.
  proposed_experiments:
  - experiment_id: obesity_pgsxc_mr_direction
    name: Mendelian randomization of exposure-to-obesity direction across PGS strata
    description: >-
      Use bidirectional / multivariable Mendelian randomization to test whether
      each candidate context (physical activity, alcohol, fasting insulin, leptin)
      causally affects adiposity versus being a consequence of it, and whether the
      causal effect estimate scales with polygenic liability as the amplification
      model predicts.
    decision_criterion: >-
      A context is retained as a causal amplifier if MR supports
      exposure-to-disease directionality and the exposure-attributable risk
      difference increases across increasing PGS strata; it is flagged as a
      reverse-causation suspect otherwise.
  - experiment_id: obesity_pgsxc_prospective_temporal
    name: Prospective incident-obesity analysis restricted to pre-onset exposure
      windows
    description: >-
      Restrict exposures to measurements taken well before obesity onset and
      repeat the PGS×context liability-threshold modelling on incident cases only,
      to reduce the chance that exposure values (particularly activity and
      metabolic biomarkers) reflect established adiposity rather than antecedent
      risk.
    decision_criterion: >-
      Amplification is supported if the PGS×context deviation from additivity
      persists when only pre-onset exposure windows and incident cases are used.
- discussion_id: akkermansia_baseline_abundance_responder
  prompt: >-
    Does baseline fecal Akkermansia muciniphila abundance decide who benefits from
    A. muciniphila supplementation, and if so, is the mechanism headroom for
    improvement or something about the resident community?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Pasteurized Akkermansia muciniphila MucT Supplementation
  - pathophysiology#Depletion of Mucosal Symbiont Akkermansia muciniphila
  rationale: >-
    Two independent trials of different preparations point the same way. In the
    weight-maintenance trial (PMID:42120725) participants stratified below the median
    fecal A. muciniphila level after weight loss regained less weight and improved
    more in insulin sensitivity, blood pressure and fecal energy content than those
    above it, with no such split in the placebo arm; that analysis was exploratory and
    post hoc. In a separate trial of live AKK-WST01 in overweight/obese type 2
    diabetes (PMID:39879980), benefit and colonization were likewise confined to the
    low-baseline group. If this holds prospectively it makes baseline abundance a
    pre-treatment stratifier rather than an incidental covariate, and it would change
    how a maintenance trial is powered and who is enrolled. The competing readings are
    not distinguished by the current data: greater room for improvement in depleted
    individuals, versus a resident community in high-abundance individuals that
    resists an added preparation. Note the mechanism cannot simply be colonization for
    the pasteurized product, which is non-viable.
  evidence:
  - reference: PMID:42120725
    reference_title: "Pasteurized Akkermansia muciniphila Muc(T) for weight loss maintenance in people with overweight and obesity: a controlled randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Initial Akkermansia spp. abundance was associated with cardiometabolic response to MucT."
    explanation: States the baseline-abundance dependence that this gap is about.
  - reference: PMID:39879980
    reference_title: "Akkermansia muciniphila supplementation in patients with overweight/obese type 2 diabetes: Efficacy depends on its baseline levels in the gut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "AKK-WST01 supplementation showed high colonization efficiency and significant reductions in body weight, fat mass, and HbA1c, which were not found in the placebo group."
    explanation: >
      Independent trial of a live preparation showing the same restriction of benefit
      to participants with low baseline abundance.
  proposed_experiments:
  - experiment_id: akkermansia_baseline_stratified_rct
    name: Prospectively stratified maintenance trial by baseline fecal A. muciniphila
    description: >-
      Randomize weight-loss-maintenance participants to pasteurized MucT or placebo
      within strata defined prospectively by quantitative fecal A. muciniphila
      measured before randomization, powered on the stratum-by-treatment interaction
      rather than on the marginal effect, with fecal energy excretion measured against
      total daily fecal output.
    decision_criterion: >-
      Baseline abundance is a genuine response modifier if the stratum-by-treatment
      interaction on weight regain is significant in a prospectively powered design;
      it is an artifact of the post hoc median split otherwise.


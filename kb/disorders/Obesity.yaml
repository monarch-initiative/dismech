      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: the number of and distance to unhealthy food outlets increased the likelihood of fast-food consumption and higher BMI for children of any SES
      explanation: Systematic review restricted to causal-inference studies. The environment acts through consumption and the energy-imbalance node rather than on body mass directly, and the BMI effect is established for children of any socioeconomic status but among adults only for selected groups.

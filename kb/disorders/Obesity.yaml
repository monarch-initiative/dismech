environmental:
- name: High-Calorie Diet
  exposure_term:
    preferred_term: high-calorie dietary pattern
    modifier: INCREASED
    term:
      id: XCO:0000013
      label: diet
  notes: Especially ultra-processed foods
  evidence:
  - reference: PMID:31105044
    reference_title: "Ultra-Processed Diets Cause Excess Calorie Intake and Weight Gain: An Inpatient Randomized Controlled Trial of Ad Libitum Food Intake."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "participants gaining 0.9 ± 0.3 kg (p = 0.009) during the ultra-processed diet and losing 0.9 ± 0.3 kg (p = 0.007) during the unprocessed diet"

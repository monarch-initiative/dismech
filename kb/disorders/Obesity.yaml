      The earlier proof-of-concept human trial in metabolic syndrome, which found the
      metabolic signal without a significant weight effect on an unchanged ad libitum diet.
  - reference: PMID:31263284
    reference_title: "Supplementation with Akkermansia muciniphila in overweight and obese human volunteers: a proof-of-concept exploratory study."
    supports: SUPPORT

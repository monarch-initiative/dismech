    evidence_source: HUMAN_CLINICAL
    snippet: "participants gaining 0.9 ± 0.3 kg (p = 0.009) during the ultra-processed diet and losing 0.9 ± 0.3 kg (p = 0.007) during the unprocessed diet"
    explanation: "Inpatient randomized crossover trial with diets matched for presented calories, energy density, macronutrients, sugar, sodium and fibre -- so the 508 kcal/day excess intake and the weight change are attributable to processing itself rather than to nutrient composition. This is the strongest available design for the annotation claim."
- name: Sedentary Lifestyle

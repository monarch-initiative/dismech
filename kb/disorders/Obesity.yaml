      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: participants gaining 0.9 ± 0.3 kg (p = 0.009) during the ultra-processed diet and losing 0.9 ± 0.3 kg (p = 0.007) during the unprocessed diet
      explanation: Inpatient randomised crossover trial in which the excess intake and weight gain are attributable to food processing itself rather than nutrient composition. This is direct experimental support for the energy-imbalance node.
- name: Sedentary Lifestyle
  exposure_term:
    preferred_term: sedentary lifestyle
    term:
      id: ECTO:6000004
      label: exposure to sedentary lifestyle
  notes: Sedentary behaviour is associated with becoming overweight or obese (OR 1.33
    highest vs lowest category), though its association with body weight itself is
    small and inconsistent
  evidence:
  - reference: PMID:29189928
    reference_title: "Sedentary Behavior and Body Weight and Composition in Adults: A Systematic Review and Meta-analysis of Prospective Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-analysis of data from prospective cohort studies showed small, inconsistent and non-significant associations between sedentary behavior and body weight"
    explanation: "PARTIAL, and the note was rewritten, because this is less settled than it is usually assumed to be. The same meta-analysis did find a significant odds ratio of 1.33 for becoming overweight or obese in the highest versus lowest sedentary category, and a small waist-circumference effect -- but not an association with body weight, and it does not evidence the reduced-energy-expenditure mechanism the note previously asserted."
  - reference: PMID:29189928
    reference_title: "Sedentary Behavior and Body Weight and Composition in Adults: A Systematic Review and Meta-analysis of Prospective Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The odds ratio of becoming overweight or obese was 1.33 (95% CI 1.11-1.60; p = 0.001) in the highest compared with lowest categories of sedentary behavior"
    explanation: "Quotes the odds ratio the rewritten note states, so the note is self-supporting rather than relying on a figure the reader must go to the abstract to find. Paired deliberately with the PARTIAL item above: this is the positive signal, that one is the null result it sits inside."
- name: Obesogenic Environment
  notes: Food availability, marketing, built environment
  evidence:
  - reference: PMID:35290815
    reference_title: "The impact of the consumer and neighbourhood food environment on dietary intake and obesity-related outcomes: A systematic review of causal impact studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the number of and distance to unhealthy food outlets increased the likelihood of fast-food consumption and higher BMI for children of any SES"
    explanation: "Systematic review restricted to causal-inference studies. PARTIAL on two counts: the BMI effect is established for children of any socioeconomic status but among adults only for selected groups (females, black and Hispanic residents of low and medium density areas), and the marketing component of this annotation is not covered."
  influences_mechanisms:

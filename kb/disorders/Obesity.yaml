name: Obesity
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Obesity is a chronic metabolic disease characterized by excessive body fat
  accumulation resulting from sustained positive energy balance, in which
  regulatory systems involving leptin, ghrelin, and insulin fail to restore
  homeostasis. Expanded, dysfunctional adipose tissue develops chronic
  low-grade inflammation and altered adipokine secretion, while hypothalamic
  dysregulation and leptin resistance perpetuate excess intake. Genetic
  susceptibility (FTO, MC4R, LEP, LEPR) interacts with environmental and
  behavioral factors, and the resulting state drives insulin resistance,
  dyslipidemia, hypertension, and other cardiometabolic complications.
category: Complex
parents:
- Metabolic Disease
disease_term:
  preferred_term: obesity disorder
  term:
    id: MONDO:0011122
    label: obesity disorder
pathophysiology:
- name: Energy Imbalance
  description: >
    Chronic positive energy balance from excess caloric intake relative
    to expenditure leads to fat accumulation. Multiple regulatory systems
    (leptin, ghrelin, insulin) fail to restore balance.
  biological_processes:
  - preferred_term: Energy Homeostasis
    term:
      id: GO:0097009
      label: energy homeostasis
  evidence:
  - reference: PMID:17212793
    reference_title: "The role of leptin and ghrelin in the regulation of food intake and body weight in humans: a review."
    supports: SUPPORT
    snippet: "Leptin is a mediator of long-term regulation of energy balance, suppressing food intake and thereby inducing weight loss. Ghrelin on the other hand is a fast-acting hormone, seemingly playing a role in meal initiation."
    explanation: Describes the role of leptin and ghrelin as key hormones regulating energy balance in obesity.
  - reference: PMID:17212793
    reference_title: "The role of leptin and ghrelin in the regulation of food intake and body weight in humans: a review."
    supports: SUPPORT
    snippet: "In obese subjects the circulating level of the anorexigenic hormone leptin is increased, whereas surprisingly, the level of the orexigenic hormone ghrelin is decreased. It is now established that obese patients are leptin-resistant."
    explanation: Explains the paradox of elevated leptin levels in obesity with concurrent leptin resistance, contributing to failed energy balance restoration.
- name: Adipose Tissue Dysfunction
  description: >
    Expanded adipose tissue becomes dysfunctional with increased inflammation,
    altered adipokine secretion, and impaired metabolic function. Adipocyte
    hypertrophy leads to hypoxia and macrophage infiltration.
  cell_types:
  - preferred_term: Adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: Adipose Tissue Macrophage
    term:
      id: CL:0000863
      label: M1 macrophage
  biological_processes:
  - preferred_term: Adipokine Secretion
    term:
      id: GO:0070163
      label: regulation of adiponectin secretion
  evidence:
  - reference: PMID:39456156
    reference_title: "Adipose Tissue Plasticity: A Comprehensive Definition and Multidimensional Insight."
    supports: SUPPORT
    snippet: "Under various physiological or pathological conditions, adipose tissue shifts cellular composition, lipid storage, and organelle dynamics to respond to the stress; this remodeling is called \"adipose tissue plasticity\"."
    explanation: Describes the dynamic remodeling of adipose tissue in response to obesity, including changes in cellular composition and metabolic function.
  - reference: PMID:14679177
    reference_title: "Chronic inflammation in fat plays a crucial role in the development of obesity-related insulin resistance."
    supports: SUPPORT
    snippet: "Histologically, there is evidence of significant infiltration of macrophages, but not neutrophils and lymphocytes, into WAT of obese mice, with signs of adipocyte lipolysis and formation of multinucleate giant cells."
    explanation: Provides histological evidence of macrophage infiltration into dysfunctional adipose tissue in obesity.
  - reference: PMID:14679177
    reference_title: "Chronic inflammation in fat plays a crucial role in the development of obesity-related insulin resistance."
    supports: SUPPORT
    snippet: "These data suggest that macrophages in WAT play an active role in morbid obesity and that macrophage-related inflammatory activities may contribute to the pathogenesis of obesity-induced insulin resistance."
    explanation: Establishes the causal role of adipose tissue macrophages in obesity-related metabolic dysfunction.
- name: Chronic Low-Grade Inflammation
  description: >
    Systemic inflammation from adipose tissue contributes to insulin
    resistance, cardiovascular disease, and other complications. Elevated
    CRP, IL-6, and TNF-alpha levels.
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:14679177
    reference_title: "Chronic inflammation in fat plays a crucial role in the development of obesity-related insulin resistance."
    supports: SUPPORT
    snippet: "Increasing evidence from human population studies and animal research has established correlative as well as causative links between chronic inflammation and insulin resistance."
    explanation: Establishes both correlative and causative links between chronic inflammation and insulin resistance in obesity.
  - reference: PMID:14679177
    reference_title: "Chronic inflammation in fat plays a crucial role in the development of obesity-related insulin resistance."
    supports: SUPPORT
    snippet: "We propose that obesity-related insulin resistance is, at least in part, a chronic inflammatory disease initiated in adipose tissue."
    explanation: Proposes that obesity-induced insulin resistance represents a chronic inflammatory disease originating in adipose tissue.
  - reference: PMID:27503945
    reference_title: "Adipose tissue inflammation: a cause or consequence of obesity-related insulin resistance?"
    supports: SUPPORT
    snippet: "Particularly chronic inflammation in adipose tissue seems to play an important role in the development of obesity-related insulin resistance."
    explanation: Highlights the central role of chronic adipose tissue inflammation in obesity-related insulin resistance.
- name: Hypothalamic Dysregulation
  description: >
    Central appetite regulation becomes impaired with leptin resistance
    and altered reward signaling, perpetuating overeating despite adequate
    energy stores. Hypothalamic neuroinflammation involves microglial and
    astrocyte activation that impairs melanocortin signaling.
  cell_types:
  - preferred_term: Hypothalamus Cell
    term:
      id: CL:2000030
      label: hypothalamus cell
  - preferred_term: Microglial Cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: Feeding Behavior
    term:
      id: GO:0007631
      label: feeding behavior
  evidence:
  - reference: PMID:38490517
    reference_title: "Novel mechanisms involved in leptin sensitization in obesity."
    supports: SUPPORT
    snippet: "Leptin acts through its receptor LepRb, expressed mainly in the hypothalamus, and induces a negative energy balance by potent inhibition of feeding and activation of energy expenditure."
    explanation: Describes the central hypothalamic mechanism by which leptin normally regulates energy balance.
  - reference: PMID:38490517
    reference_title: "Novel mechanisms involved in leptin sensitization in obesity."
    supports: SUPPORT
    snippet: "However, the majority of patients with obesity presents elevated leptin production, suggesting that in this setting leptin is ineffective in the regulation of energy balance."
    explanation: Explains leptin resistance in obesity where elevated leptin fails to regulate energy balance through hypothalamic circuits.
- name: Adipocyte Mitochondrial Dysfunction
  description: >
    Obesity causes mitochondrial fragmentation in white adipocytes through
    RalA-mediated activation of the fission protein DRP1 (DNM1L). This leads
    to reduced oxidative capacity and contributes to weight gain and insulin
    resistance. Mitochondrial dynamics shift toward excessive fission.
  cell_types:
  - preferred_term: Adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  biological_processes:
  - preferred_term: Mitochondrial Fission
    term:
      id: GO:0000266
      label: mitochondrial fission
  - preferred_term: Fatty Acid Oxidation
    term:
      id: GO:0019395
      label: fatty acid oxidation
  evidence:
  - reference: PMID:38286821
    reference_title: "Obesity causes mitochondrial fragmentation and dysfunction in white adipocytes due to RalA activation."
    supports: SUPPORT
    snippet: "Here we show that high-fat diet (HFD) feeding causes mitochondrial fragmentation in inguinal white adipocytes from male mice, leading to reduced oxidative capacity by a process dependent on the small GTPase RalA."
    explanation: Demonstrates that obesity causes mitochondrial fragmentation through RalA in white adipocytes.
  - reference: PMID:38286821
    reference_title: "Obesity causes mitochondrial fragmentation and dysfunction in white adipocytes due to RalA activation."
    supports: SUPPORT
    snippet: "Mechanistically, RalA increases fission in adipocytes by reversing the inhibitory Ser637 phosphorylation of the fission protein Drp1, leading to more mitochondrial fragmentation."
    explanation: Describes the molecular mechanism by which RalA promotes mitochondrial fission through DRP1 dephosphorylation.
  - reference: PMID:38286821
    reference_title: "Obesity causes mitochondrial fragmentation and dysfunction in white adipocytes due to RalA activation."
    supports: SUPPORT
    snippet: "Adipose tissue expression of the human homolog of Drp1, DNM1L, is positively correlated with obesity and insulin resistance."
    explanation: Provides human evidence linking DNM1L expression to obesity and insulin resistance.
- name: Depletion of Mucosal Symbiont Akkermansia muciniphila
  description: >
    Akkermansia muciniphila is a mucin-degrading symbiont of the colonic mucus
    layer that uses host-derived mucus as its primary carbon and nitrogen source,
    placing it directly at the host-microbe interface. Its relative abundance is
    reduced in obesity, type 2 diabetes and metabolic syndrome and correlates
    inversely with body weight in rodents and humans. Loss of this population
    removes a signal that supports mucus-layer thickness and epithelial barrier
    integrity, and is the state that A. muciniphila-directed interventions are
    designed to compensate for.
  biological_processes:
  - preferred_term: mucus-layer maintenance at the colonic epithelium
    modifier: DECREASED
    term:
      id: GO:0030277
      label: maintenance of gastrointestinal epithelium
  notes: >
    The taxon (Akkermansia muciniphila, phylum Verrucomicrobiota; 1-5% of the
    healthy adult fecal microbiome) is deliberately not bound in cell_types, which
    is CL-only and covers host cells. Depletion is consistently reported but the
    direction of causation in humans is not settled: the cohort associations are
    cross-sectional, and the causal evidence that restoring the organism improves
    metabolism is from rodents.
  downstream:
  - target: Intestinal Barrier Dysfunction and Metabolic Endotoxemia
    description: >
      Fewer mucus-resident Akkermansia is associated with a thinner mucus layer
      and a more permeable epithelium in rodent models of diet-induced obesity.
  evidence:
  - reference: PMID:23671105
    reference_title: "Cross-talk between Akkermansia muciniphila and intestinal epithelium controls diet-induced obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "This study demonstrated that the abundance of A. muciniphila decreased in obese and type 2 diabetic mice."
    explanation: Direct measurement showing the symbiont is depleted in obese and diabetic animals.
  - reference: PMID:31263284
    reference_title: "Supplementation with Akkermansia muciniphila in overweight and obese human volunteers: a proof-of-concept exploratory study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "In humans, studies have provided evidence for a negative correlation between Akkermansia muciniphila abundance and overweight, obesity, untreated type 2 diabetes mellitus or hypertension"
    explanation: >
      States the human cohort evidence for depletion in obesity. The quoted sentence
      is this trial report's summary of prior human studies rather than its own
      measurement, hence quote_role BACKGROUND; the correlation is also
      cross-sectional, so it bears on the depletion claim only indirectly.
  - reference: PMID:32167023
    reference_title: "Pasteurized Akkermansia muciniphila increases whole-body energy expenditure and fecal energy excretion in diet-induced obese mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The abundance of A. muciniphila is severely reduced in several pathological conditions (i.e., obesity, type 2 diabetes, inflammatory bowel diseases, and appendicitis)."
    explanation: >
      Restates the human disease-state depletion across conditions. Quoted from the
      introduction of a mouse study, so the paper is MODEL_ORGANISM work but the
      sentence reports the human clinical picture.
- name: Intestinal Barrier Dysfunction and Metabolic Endotoxemia
  biological_scale: TISSUE
  description: >
    Thinning of the colonic mucus layer and loss of epithelial barrier integrity
    allow bacterial lipopolysaccharide to reach the systemic circulation, producing
    the low-grade endotoxemia that couples the gut to adipose inflammation and
    insulin resistance. A. muciniphila supports barrier function at least partly
    through its abundant outer-membrane protein Amuc_1100, a Toll-like receptor 2
    ligand that survives pasteurization.
  biological_processes:
  - preferred_term: lipopolysaccharide-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0031663
      label: lipopolysaccharide-mediated signaling pathway
  downstream:
  - target: Chronic Low-Grade Inflammation
    description: >
      Circulating lipopolysaccharide engages innate immune receptors and sustains
      the systemic inflammatory tone already established in expanded adipose tissue.
  evidence:
  - reference: PMID:23671105
    reference_title: "Cross-talk between Akkermansia muciniphila and intestinal epithelium controls diet-induced obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "we demonstrated that A. muciniphila treatment reversed high-fat diet-induced metabolic disorders, including fat-mass gain, metabolic endotoxemia, adipose tissue inflammation, and insulin resistance"
    explanation: >
      The barrier/endotoxemia step is inferred from the therapeutic result: restoring
      the symbiont reverses metabolic endotoxemia and adipose inflammation in mice.
      Graded INDIRECT because the claim follows from the response to treatment rather
      than from a measurement of the untreated mechanism.
  - reference: PMID:27892954
    reference_title: "A purified membrane protein from Akkermansia muciniphila or the pasteurized bacterium improves metabolism in obese and diabetic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "We demonstrated that Amuc_1100, a specific protein isolated from the outer membrane of A. muciniphila, interacts with Toll-like receptor 2, is stable at temperatures used for pasteurization, improves the gut barrier and partly recapitulates the beneficial effects of the bacterium."
    explanation: >
      Identifies the molecular route from the symbiont to barrier function, and the
      thermostability that makes a pasteurized preparation plausible.
- name: Efficient Intestinal Energy Harvest
  biological_scale: ORGANISM
  description: >
    The share of ingested energy that is absorbed rather than excreted in feces is a
    determinant of energy balance that sits upstream of adipose expansion. In
    diet-induced obese mice, pasteurized A. muciniphila lowers food energy efficiency
    and raises fecal energy excretion, apparently through reduced carbohydrate
    absorption and faster intestinal epithelial turnover, implying that the untreated
    state retains a correspondingly larger fraction of ingested energy.
  biological_processes:
  - preferred_term: intestinal absorption
    modifier: INCREASED
    term:
      id: GO:0050892
      label: intestinal absorption
  notes: >
    The human evidence for this node is weaker than the rodent evidence. In the
    weight-maintenance trial (PMID:42120725) the rise in fecal energy content under
    pasteurized MucT did not reach significance, and total daily fecal output was not
    measured; only the within-group inverse association between change in fecal energy
    and change in body weight pointed this way.
  downstream:
  - target: Energy Imbalance
    description: >
      Energy retained rather than excreted adds to the positive balance that drives
      fat accumulation.
  evidence:
  - reference: PMID:32167023
    reference_title: "Pasteurized Akkermansia muciniphila increases whole-body energy expenditure and fecal energy excretion in diet-induced obese mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "we observed that treatment with pasteurized A. muciniphila increased energy excretion in the feces"
    explanation: >
      The absorption step is inferred from its modification: treatment shifts energy
      from absorption to excretion, so the untreated state absorbs more.
  - reference: PMID:32167023
    reference_title: "Pasteurized Akkermansia muciniphila increases whole-body energy expenditure and fecal energy excretion in diet-induced obese mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "we demonstrated that this effect was not due to the modulation of intestinal lipid absorption or chylomicron synthesis but likely involved a reduction of carbohydrates absorption and enhanced intestinal epithelial turnover"
    explanation: >
      Localizes the effect to carbohydrate absorption and epithelial turnover rather
      than to lipid handling.
- name: Post-Weight-Loss Weight Regain
  biological_scale: ORGANISM
  description: >
    After energy restriction the body defends its previous mass through a coordinated
    set of responses: resting energy expenditure falls disproportionately to fat-free
    mass, anorexigenic signals fall while orexigenic signals rise, and shrinking
    adipocytes generate extracellular-matrix stress and immune activation in
    subcutaneous adipose tissue. Adipose tissue additionally retains a transcriptional
    and epigenetic memory of the prior obese state that primes it for accelerated
    regain. This node, rather than weight loss itself, is what maintenance therapy
    targets.
  biological_processes:
  - preferred_term: defense of pre-diet body mass
    term:
      id: GO:0097009
      label: energy homeostasis
  downstream:
  - target: Increased Body Mass Index
    description: >
      Regain restores the adiposity phenotype that the weight-loss phase reduced.
  evidence:
  - reference: PMID:30655624
    reference_title: "Mechanisms of weight regain after weight loss - the role of adipose tissue."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "we show that weight loss-induced variations in cellular stress, extracellular matrix remodelling, inflammatory responses, adipokine secretion and lipolysis seem to be associated with the amount of weight that is regained after successful weight loss"
    explanation: >
      Synthesis of the human adipose-tissue responses associated with how much weight
      is regained. It is a review's synthesis of work it did not perform, hence
      quote_role REVIEW_SYNTHESIS.
  - reference: PMID:39558077
    reference_title: "Adipose tissue retains an epigenetic memory of obesity after weight loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Mice carrying this obesogenic memory show accelerated rebound weight gain"
    explanation: >
      Shows the adipose memory is not merely correlative: animals carrying it regain
      weight faster. The corresponding human data in the same study are
      transcriptional rather than an observed regain rate.

mechanistic_hypotheses:
- hypothesis_group_id: pgs_context_amplification
  hypothesis_label: Amplification of polygenic obesity risk in adverse contexts
    via shared energy-imbalance convergence
  status: EMERGING
  description: >-
    Polygenic-score-by-context (PGS×C) interactions reported for obesity in the
    UK Biobank appear to reflect amplification rather than context-specific
    causal variants: the same susceptibility loci (e.g. FTO, MC4R, and other
    appetite/CNS-acting variants) exert systematically larger effects in
    disease-promoting contexts. This entry proposes that the amplification arises
    because polygenic liability and adverse exposures — obesogenic diet, physical
    inactivity, alcohol intake and socioeconomic deprivation — converge on the
    shared Energy Imbalance node, so their joint effect on the liability-threshold
    scale is super-additive rather than additive. Nagpal & Gibson (Nat Genet
    2026, PMID:42443528) show amplifying context pairs for BMI-defined obesity
    (e.g. glucose with omega-3 fatty acids, and walking pace with beer intake)
    and note that the major contexts differ between BMI- and waist-to-hip-ratio
    definitions, consistent with BMI polymorphisms acting on central appetite
    regulation versus WHR variants acting on peripheral metabolic traits.
  evidence:
  - reference: PMID:42443528
    reference_title: "Pervasive interactions between exposures and polygenic risk can inform more effective clinical and behavioral interventions."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The predominant mechanism for PGS×C is the amplification of genetic
      effects in adverse contexts, such as low polyunsaturated fatty acids or social
      determinants of ill health
    explanation: >-
      Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and
      75 contexts, amplification of genetic effects in adverse contexts is
      identified as the predominant mechanism of PGS×context interaction — the
      mechanism applied in this hypothesis.
  - reference: PMID:37228747
    reference_title: "Amplification is the primary mode of gene-by-sex interaction in complex human traits."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: GxSex is pervasive but acts primarily through systematic sex differences
      in the magnitude of many genetic effects
    explanation: >-
      Corroborates amplification — systematic differences in the magnitude of
      polygenic effects rather than in the identity of causal variants — as the
      primary mode of gene-by-context interaction.
  notes: >-
    EMERGING hypothesis motivated by population-scale PGS×context analyses
    (primary source PMID:42443528; general amplification mechanism corroborated
    by PMID:37228747). The convergence claim (polygenic liability + adverse
    exposures → Energy Imbalance) is a mechanistic interpretation and is not
    itself established as causal — see the reverse-causation knowledge gap under
    discussions.

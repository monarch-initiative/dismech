- name: NPHP3-related Meckel-like syndrome
  subtype_term:
    preferred_term: NPHP3-related Meckel-like syndrome
    term:
      id: MONDO:0009966
      label: NPHP3-related Meckel-like syndrome
  description: >-
    The MKS7 locus. MONDO names this row for its gene rather than by number, and
    "Meckel-like" is the source literature's own hedge: complete loss of
    nephrocystin-3 gives embryonic lethality with a Meckel-Gruber-like picture
    plus situs inversus and renal-hepatic-pancreatic dysplasia, while hypomorphic
    NPHP3 alleles give isolated nephronophthisis. It is curated here as a subtype
    rather than in the nephronophthisis entry because the lethal end is the Meckel
    phenotype.

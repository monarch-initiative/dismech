- name: Lethal fetal cerebrorenogenitourinary agenesis/hypoplasia syndrome
  display_name: KIF14-related lethal fetal ciliopathy (OMIM MKS12)
  subtype_term:
    preferred_term: lethal fetal cerebrorenogenitourinary agenesis/hypoplasia syndrome
    term:
      id: MONDO:0014552
      label: lethal fetal cerebrorenogenitourinary agenesis/hypoplasia syndrome
  description: >-
    The weakest row in this series, and deliberately labelled with MONDO's name
    rather than as "Meckel syndrome, type 12". OMIM numbers this entity MKS12 and
    MONDO classifies it under Meckel syndrome, but the report that defined it
    described an undescribed lethal fetal syndrome - intrauterine growth
    restriction, severe microcephaly, renal cystic dysplasia or agenesis, complex
    brain and genitourinary malformations - that was compatible with a ciliopathy
    but "not diagnostic of any known condition", and the classic occipital
    encephalocele plus postaxial polydactyly triad is not what it reports. A
    separate prenatal series does place KIF14 in a Meckel diagnosis, but in trans
    with a TMEM67 deletion and read by its authors as digenic.
  genes:
  - preferred_term: KIF14
    term:
      id: hgnc:19181
      label: KIF14
  evidence:
  - reference: PMID:24128419
    reference_title: "Exome sequencing identifies mutations in KIF14 as a novel cause of an autosomal recessive lethal fetal ciliopathy phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified novel autosomal recessive truncating mutations in KIF14 that segregated with the phenotype."
    explanation: >-
      Establishes biallelic KIF14 truncating variants as the cause of this entity.
  - reference: PMID:24128419
    reference_title: "Exome sequencing identifies mutations in KIF14 as a novel cause of an autosomal recessive lethal fetal ciliopathy phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical signs included intrauterine growth restriction (IUGR), severe microcephaly, renal cystic dysplasia/agenesis and complex brain and genitourinary malformations. The phenotype was compatible with a ciliopathy, but not diagnostic of any known condition."
    explanation: >-
      The authors' own statement that the phenotype is not that of a recognized
      condition, which is the basis for the nosological caveat in this row.
  - reference: PMID:34821546
    reference_title: "Meckel Gruber and Joubert Syndrome Diagnosed Prenatally: Allelism between the Two Ciliopathies, Complexities of Mutation Types and Digenic Inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Multiexon deletion in TMEM67 and KIF14 present in trans was identified in the third case (Meckel syndrome), likely resulting in digenic inheritance."
    explanation: >-
      The only cached report placing KIF14 in a case diagnosed as Meckel syndrome,
      and it is a digenic reading with a TMEM67 deletion, so it supports the link
      only indirectly.
  review_notes: >-
    Added in the wiring-013 genetics pass, with the caveat above. MONDO:0014552
    is_a MONDO:0018921 Meckel syndrome, so it is inside this entry's anchor, but
    dismech should not silently restate OMIM's MKS12 numbering as though the
    defining report had diagnosed Meckel syndrome. If a later series establishes
    the classic triad in KIF14 patients, promote this row's wording.
notes: >-
  No GeneReviews chapter exists for Meckel syndrome. `just check-genereviews`
  reports NO_CHAPTER, and re-running the query it reads (`grep -i "meckel"
  cache/bookshelf/genereviews.csv`, snapshot 2026-09-10) returns nothing. The
  nearest chapters are for the allelic ciliopathies - NBK1325 "Joubert Syndrome"
  and NBK368475 "Nephronophthisis-Related Ciliopathies" - which cover different
  diseases, so the per-locus primary reports cited below are the baseline used
  instead.
synonyms:
- Meckel-Gruber syndrome
- Meckel-Gruber syndrome (MKS)
- MKS
classifications:
  isds_skeletal_category:
  - classification_value: polydactyly_syndactyly_triphalangism
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019 revision
      (Mortier et al., PMID:31633310), Table 1 group 41
      "Polydactyly-Syndactyly-Triphalangism group"; listed as "Meckel syndrome types
      1-6".
prevalence:
- population: European births (EUROCAT)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.6
  percentage: 0.0026
  notes: Mean prevalence across registries with good ascertainment (1990-2011).
  evidence:
  - reference: PMID:25182137
    reference_title: "Meckel-Gruber Syndrome: a population-based study on prevalence, prenatal diagnosis, clinical features, and survival in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean prevalence was 2.6 per 100,000 births in a subset of registries
      with good ascertainment."
    explanation: This population-based study provides a prevalence estimate for
      MKS.
inheritance:
- name: Autosomal recessive
  description: >-
    Meckel syndrome is inherited in an autosomal recessive pattern and sits on
    a ciliopathy spectrum with Joubert/related disorders, reflecting allelic
    series across shared ciliary genes.
  evidence:
  - reference: PMID:25182137
    reference_title: "Meckel-Gruber Syndrome: a population-based study on prevalence, prenatal diagnosis, clinical features, and survival in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meckel-Gruber Syndrome is a rare autosomal recessive lethal ciliopathy"
    explanation: This statement supports autosomal recessive inheritance of MKS.
  - reference: PMID:26729329
    reference_title: "Enhanced diagnostic yield in Meckel-Gruber and Joubert syndrome through exome sequencing supplemented with split-read mapping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two clinically and genetically heterogeneous neurodevelopmental conditions
      that define a phenotypic spectrum, with MKS at the severe end."
    explanation: This cohort study frames MKS and JBTS as a phenotypic spectrum,
      consistent with allelic series across ciliopathy genes.
- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    Beyond classic autosomal recessive transmission, Meckel syndrome can show
    digenic inheritance across the shared ciliopathy gene set, with pathogenic
    variants in two different ciliary genes (in trans) contributing to the
    phenotype.
  evidence:
  - reference: PMID:34821546
    reference_title: "Meckel Gruber and Joubert Syndrome Diagnosed Prenatally: Allelism between the Two Ciliopathies, Complexities of Mutation Types and Digenic Inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiexon deletion in TMEM67 and KIF14 present in trans was identified in
      the third case (Meckel syndrome), likely resulting in digenic inheritance.
    explanation: >-
      This prenatal case series documents variants in two ciliary genes (TMEM67
      and KIF14) in trans, consistent with digenic inheritance in Meckel
      syndrome.

    preferred_term: Meckel syndrome, type 1
    term:
      id: MONDO:0009571
      label: Meckel syndrome, type 1
  description: >-
    The founding Meckel locus. The MKS1 product localizes to the base of the
    cilium and is required for ciliogenesis.
  genes:
  - preferred_term: MKS1
    term:
      id: hgnc:7121
      label: MKS1
  evidence:
  - reference: PMID:23349226
    reference_title: "Mutations in TMEM231 cause Meckel-Gruber syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Twelve genes are known to cause this disorder when mutated: MKS1, TMEM216 (MKS2), TMEM67 (MKS3), CEP290 (MKS4), RPGRIP1L (MKS5), CC2D2A (MKS6), NPHP3 (MKS7), TCTN2 (MKS8), B9D1 (MKS9), B9D2 (MKS10), TMEM237, and C5orf42."
    explanation: >-
      Maps each numbered MKS locus to its gene. Quoted from this paper's
      introduction, where it restates the established locus series rather than
      reporting the authors' own finding.
  - reference: PMID:19776033
    reference_title: "A mouse model for Meckel syndrome reveals Mks1 is required for ciliogenesis and Hedgehog signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "The gene mutated in type 1 MKS encodes a protein associated with the base of the cilium in vertebrates and nematodes."
    explanation: >-
      Ties the type 1 locus to a ciliary base protein, which is the claim this
      row's description makes.

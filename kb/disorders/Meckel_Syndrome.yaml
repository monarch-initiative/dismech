  variant_origin: GERMLINE
  subtype: Lethal fetal cerebrorenogenitourinary agenesis/hypoplasia syndrome
  notes: >-
    Biallelic truncating KIF14 variants cause the lethal fetal ciliopathy that OMIM
    numbers MKS12 and that MONDO places under Meckel syndrome as
    MONDO:0014552. KIF14 is a mitotic kinesin whose role in cytokinesis the authors
    link to primary cilium function; the phenotype is microcephaly and renal
    cystic dysplasia/agenesis rather than the classic encephalocele-plus-polydactyly
    triad. See the corresponding has_subtypes row for the nosological caveat.
  evidence:
  - reference: PMID:24128419
    reference_title: "Exome sequencing identifies mutations in KIF14 as a novel cause of an autosomal recessive lethal fetal ciliopathy phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified novel autosomal recessive truncating mutations in KIF14 that segregated with the phenotype."
    explanation: >-
      Segregating biallelic truncating KIF14 variants in the family that defined
      this entity.
  - reference: PMID:24128419
    reference_title: "Exome sequencing identifies mutations in KIF14 as a novel cause of an autosomal recessive lethal fetal ciliopathy phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the first human phenotype, a novel lethal ciliary disorder, associated with biallelic inactivating mutations in KIF14."
    explanation: >-
      The authors' own summary of the gene-disease claim, and of the fact that they
      treated it as a new disorder rather than as Meckel syndrome.
  review_notes: >-
    Added in the wiring-013 genetics pass. MONDO records KIF14 as causal for
    MONDO:0014552, which is_a Meckel syndrome, but the gap list for this job did
    not include it because dismech's Meckel entry had no KIF14 record at all rather
    than because MONDO lacks the assertion.
clinical_trials:
- name: NCT01401998
  description: >-
    Observational translational resource for hepato/renal fibrocystic diseases,
    including Meckel-Gruber syndrome, collecting clinical data and biospecimens.
  phase: NOT_APPLICABLE
  evidence:
  - reference: clinicaltrials:NCT01401998
    reference_title: "Core A: The Hepato/Renal Fibrocystic Diseases Translational Resource (ARPKD Database Study)"
    supports: SUPPORT
    snippet: "Hepato-renal fibrocystic diseases (HRFD) is a term developed that encompasses
      rare diseases such as Autosomal Recessive Polycystic Kidney Disease (ARPKD),
      and other diseases with common features (Joubert syndrome, Bardet Biedl syndrome,
      Meckel-Gruber syndrome, congenital hepatic fibrosis (CHF), Caroli syndrome (CS),
      polycystic liver disease, oro-facial-digital syndrome, nephronophithisis (NPHP),
      and glomerulocystic Kidney Disease)."
    explanation: The trial encompasses Meckel-Gruber syndrome within a
      hepato-renal fibrocystic disease registry.
  - reference: clinicaltrials:NCT01401998
    reference_title: "Core A: The Hepato/Renal Fibrocystic Diseases Translational Resource (ARPKD Database Study)"
    supports: SUPPORT
    snippet: "This study aims to build a registry of a clinical database (medical
      health information), a mutational database (genetic information) and an educational
      resource about HRFD"
    explanation: The trial is structured as a translational resource and
      registry.

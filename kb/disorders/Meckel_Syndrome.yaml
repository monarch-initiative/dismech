    reference_title: "A mouse model for Meckel syndrome type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In humans, the underlying mutated gene, TMEM67, encodes transmembrane protein 67, also called meckelin (OMIM 609884), which is an integral protein of the renal epithelial cell and membrane of the primary cilium."
    explanation: >-
      TMEM67/meckelin is an integral primary cilium membrane protein implicated in
      MKS3. Regraded from MODEL_ORGANISM in the wiring-013 pass: the sentence
      states the human genetics, quoted from this mouse-model paper's background.

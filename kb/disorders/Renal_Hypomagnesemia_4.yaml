name: Renal Hypomagnesemia 4
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  Renal hypomagnesemia 4 (HOMG4), also called isolated recessive renal
  hypomagnesemia, is an autosomal recessive renal magnesium-wasting disorder
  caused by a homozygous missense variant in EGF, the gene for pro-epidermal
  growth factor. The variant, p.Pro1070Leu, removes the second proline of a
  PXXP basolateral sorting motif in the cytoplasmic tail of pro-EGF, so the
  precursor is no longer delivered to the basolateral membrane of distal
  convoluted tubule (DCT) cells. Without basolateral EGF, the EGF receptor on
  DCT cells is not stimulated and the apical magnesium channel TRPM6 is not
  activated, so tubular magnesium reabsorption fails and magnesium is lost in
  the urine. Serum and urinary calcium remain normal. The disease is known from
  a single consanguineous Dutch family, in which two sisters had low serum
  magnesium with inappropriately high urinary magnesium, epileptic seizures
  from the first year of life, psychomotor delay in childhood and moderate
  intellectual disability as adults. The renal mechanism is supported by cell
  studies and by the hypomagnesemia seen with the EGFR antibody cetuximab. Why
  the sisters are intellectually disabled is not known, and the original
  clinicians judged the convulsions to be unrelated to hypomagnesemia.
notes: >-
  The entry is anchored on MONDO:0012717 (OMIM 611718) and EGF (hgnc:3229).
  All human data come from one family with two affected sisters, so no
  frequency band is recorded and every phenotype should be read as a two-case
  observation.

  Seizures and intellectual disability are curated as phenotypes without an
  incoming edge from the magnesium-wasting chain. The 1987 clinical report
  states that the convulsions were unrelated to hypomagnesemia (PMID:3436090),
  and the 2007 molecular report raises EGF's role in brain development as an
  open question (PMID:17671655). Linking either phenotype to hypomagnesemia
  would assert a mechanism neither source supports.

  No treatment specific to this disease has been studied. Magnesium
  replacement is the general management of renal magnesium wasting, but no
  cited source reports it in these patients, so it is not curated as a
  treatment.

  No GeneReviews chapter covers this disease; just check-genereviews reports
  NO_CHAPTER against the 2026-09-10 Bookshelf index.

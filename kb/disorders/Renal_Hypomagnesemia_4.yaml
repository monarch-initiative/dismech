  evidence:
  - reference: PMID:17671655
    reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, stimulation of TRPM6 channel activity was only observed with basolaterally collected wild-type pro-EGF medium, not with the basolateral mutant pro-EGF media (Figure 3E)."
    explanation: >-
      In polarized MDCK cells, mutant pro-EGF fails to deliver active EGF to
      the basolateral side.
  downstream:
  - target: Inadequate Renal EGFR Stimulation
    causal_link_type: DIRECT
    description: >-
      Without basolateral EGF, the basolateral EGF receptor of DCT cells is
      under-stimulated.
    evidence:
    - reference: PMID:17671655
      reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As a consequence, the renal EGFR is inadequately stimulated, resulting in insufficient activation of the epithelial Mg(2+) channel TRPM6 (transient receptor potential cation channel, subfamily M, member 6) and thereby Mg(2+) loss."
      explanation: States the link from missorted pro-EGF to EGFR under-stimulation.
- name: Inadequate Renal EGFR Stimulation
  biological_scale: CELLULAR
  description: >-
    EGF acts as a local magnesiotropic signal on EGFR at the basolateral
    membrane of DCT cells. Blocking EGFR with cetuximab in cancer patients
    lowers serum magnesium, which supports this step independently of the
    family.
  cell_types:
  - preferred_term: kidney distal convoluted tubule epithelial cell
    term:
      id: CL:1000849
      label: kidney distal convoluted tubule epithelial cell

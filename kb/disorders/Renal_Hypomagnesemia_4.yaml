      explanation: >-
        A commentary summarizing the cascade from basolateral EGFR to apical
        TRPM6 and magnesium reabsorption.
- name: Renal Magnesium Wasting
  biological_scale: ORGANISM
  description: >-
    Urinary magnesium stays relatively high despite low serum magnesium,
    which shows a tubular reabsorption defect. Magnesium infusion studies
    showed a lowered renal threshold with a normal tubular maximum. Urinary
    calcium is normal, which separates this disorder from the hypercalciuric
    forms of renal magnesium wasting.
  locations:
  - preferred_term: distal convoluted tubule
    term:
      id: UBERON:0001292
      label: distal convoluted tubule
  biological_processes:
  - preferred_term: magnesium ion homeostasis
    term:
      id: GO:0010960
      label: magnesium ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:3436090
    reference_title: "Isolated autosomal recessive renal magnesium loss in two sisters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnesium infusion studies revealed a lowered threshold but a normal tubular maximum for magnesium."
    explanation: Characterizes the renal handling defect in the affected sisters.
  - reference: PMID:17671655
    reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the low serum Mg2+ levels, urinary Mg2+ excretion was relatively high, indicating a renal Mg2+ reabsorption defect."
    explanation: Inappropriate urinary magnesium loss despite low serum levels.
  downstream:
  - target: Renal magnesium wasting
    causal_link_type: DIRECT
    description: The tubular defect is measured clinically as renal magnesium wasting.
    evidence:
    - reference: PMID:17671655
      reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Given the low serum Mg2+ levels, urinary Mg2+ excretion was relatively high, indicating a renal Mg2+ reabsorption defect."
      explanation: Urinary magnesium is inappropriately high in both patients.
  - target: Hypomagnesemia
    causal_link_type: DIRECT
    description: Continuing urinary loss lowers serum magnesium.
    evidence:
    - reference: PMID:17671655
      reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In short, 2 patients of this family, V3 and V4, had serum Mg2+ levels of 0.53 mM and 0.56 mM and urinary Mg2+ values of 3.9 mmol/24 h and 3.7 mmol/24 h, respectively."
      explanation: Low serum magnesium alongside urinary losses in both sisters.

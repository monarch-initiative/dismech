  evidence:
  - reference: PMID:17671655
    reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, we show that colorectal cancer patients treated with cetuximab, an antagonist of the EGFR, develop hypomagnesemia, emphasizing the significance of EGF in maintaining Mg(2+) balance."
    explanation: >-
      Pharmacologic EGFR blockade reproduces magnesium loss. This supports the
      EGFR step by analogy; it is not an observation in the HOMG4 family.
  downstream:
  - target: Insufficient TRPM6 Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      EGFR stimulation activates TRPM6 through Src-family kinases and Rac1,
      which move TRPM6 from intracellular stores to the plasma membrane, and
      through ERK/AP-1, which raises TRPM6 transcription.
    intermediate_mechanisms:
    - Src-family kinase and Rac1 signaling
    - ERK/AP-1 transcriptional activation
    evidence:
    - reference: PMID:19073827
      reference_title: "EGF increases TRPM6 activity and surface expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In summary, EGF-mediated stimulation of TRPM6 occurs via signaling through Src kinases and Rac1, thereby redistributing endomembrane TRPM6 to the plasma membrane."
      explanation: Identifies the signaling path from EGFR to TRPM6 surface expression.
    - reference: PMID:19937979
      reference_title: "Up-regulation of TRPM6 transcriptional activity by AP-1 in renal epithelial cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results suggest that EGF up-regulates TRPM6 mRNA expression mediate via the activation of ERK/AP-1-dependent pathway."
      explanation: A second, transcriptional route from EGF to TRPM6.
- name: Insufficient TRPM6 Activation
  biological_scale: CELLULAR
  description: >-
    TRPM6 is the apical magnesium channel that carries transcellular magnesium
    reabsorption in the DCT. Less EGF stimulation means less TRPM6 at the
    apical surface and less magnesium entry from the tubular fluid.

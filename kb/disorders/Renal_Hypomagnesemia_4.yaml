pathophysiology:
- name: Homozygous EGF p.Pro1070Leu Variant
  biological_scale: MOLECULAR
  description: >-
    The c.3209C>T variant replaces proline 1070, the second proline of the
    1067PKNP1070 basolateral sorting motif in the cytoplasmic tail of pro-EGF,
    with leucine.

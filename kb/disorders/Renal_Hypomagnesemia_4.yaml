      explanation: States the direct consequence of the variant.
- name: Impaired Basolateral Sorting of Pro-EGF
  biological_scale: CELLULAR
  description: >-
    Polarized cells expressing mutant pro-EGF release EGF activity into the
    apical medium as wild-type cells do, but not into the basolateral medium,
    where the EGF receptor of DCT cells sits.
  cell_types:
  - preferred_term: kidney distal convoluted tubule epithelial cell
    term:
      id: CL:1000849
      label: kidney distal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: protein localization to basolateral plasma membrane
    term:
      id: GO:1903361

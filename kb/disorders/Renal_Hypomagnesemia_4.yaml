genetic:
- name: EGF
  gene_term:
    preferred_term: EGF
    term:
      id: hgnc:3229
      label: EGF
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    EGF (4q25) encodes pro-epidermal growth factor, a type I membrane precursor
    processed to the 53-amino-acid EGF peptide. In the DCT it acts as a local
    magnesiotropic hormone. Only one disease allele is known.
  notes: >-
    The gene-disease link rests on one family. Other known causes of isolated
    renal magnesium wasting (SLC12A3, CLDN16, FXYD2 and TRPM6) were excluded in
    the two sisters before EGF was found.
  evidence:
  - reference: PMID:17671655
    reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through the discovery of a mutation in the EGF gene in isolated autosomal recessive renal hypomagnesemia, we have, for what we believe is the first time, identified a magnesiotropic hormone crucial for total body Mg(2+) balance."
    explanation: Identifies EGF as the causal gene.

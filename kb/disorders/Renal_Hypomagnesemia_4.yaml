    zygosity: HOMOZYGOUS
  evidence:
  - reference: PMID:17671655
    reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals both have a homozygous mutation C3209T in exon 22, resulting in the amino acid substitution P1070L."
    explanation: Identifies the causal variant in both affected sisters.
  - reference: PMID:17671655
    reference_title: "Impaired basolateral sorting of pro-EGF causes isolated recessive renal hypomagnesemia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "P1070 is strongly conserved among different species and forms the second proline of a basolateral PXXP sorting motif."
    explanation: Places the substituted residue in a basolateral sorting motif.
  downstream:
  - target: Impaired Basolateral Sorting of Pro-EGF
    causal_link_type: DIRECT
    description: >-
      Loss of the sorting motif stops pro-EGF from reaching the basolateral
      membrane of polarized epithelial cells; apical delivery is unaffected.
    evidence:
    - reference: PMID:17671655

discussions:
- discussion_id: gap_mgors_licensing_severity_uncoupling
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does the measured origin licensing deficit in patient cells fail to
    predict S-phase progression rate or clinical severity?
  attaches_to:
  - pathophysiology#Impaired Replication Origin Licensing
  - pathophysiology#Delayed S-Phase Entry and Reduced Cell Proliferation
  rationale: >-
    Licensing capacity is impaired in all MGORS patient cells regardless of gene,
    yet it does not correlate with the rate of S-phase progression, and the
    clinical severity gradient (ORC1 and ORC4 most severe) is not explained by
    licensing measurements alone. This uncoupling is a central unresolved
    question of MGORS pathogenesis and is what motivates the parallel
    non-replicative arms, notably the centriole and ciliogenesis route. Whether
    the non-canonical roles of these proteins, tissue-specific proliferative
    demand, or something else supplies the missing explanatory variable is
    unknown. One partial answer already exists for the ORC1 arm specifically:
    the BAH domain reads H4K20me2 to target ORC to origins, so BAH mutations
    remove a chromatin-targeting step rather than simply lowering licensing
    capacity. Whether an analogous upstream-targeting defect distinguishes the
    other severe arms has not been tested.
  proposed_experiments:
  - experiment_id: exp_mgors_licensing_vs_output_allelic_series
    name: Parallel licensing, fork, cell-cycle and ciliogenesis phenotyping across an isogenic MGORS allelic series
    description: >-
      Measure licensed origin density, fork speed, cell cycle length and
      ciliogenesis competence in parallel across an isogenic allelic series
      spanning the licensing module (ORC1, ORC4, CDT1) and the CMG module
      (CDC45, GINS2, GINS3), in a developmentally relevant proliferating cell
      type such as iPSC-derived chondroprogenitors, and test which measure
      predicts differentiation output.
    decision_criterion: >-
      The measure whose variation across the allelic series best predicts
      chondrogenic differentiation output identifies the rate-limiting step.
    supporting_outcome:
    - Ciliogenesis competence predicts differentiation output better than licensed origin density, supporting the non-replicative arm as the severity determinant
    refuting_outcome:
    - Licensed origin density predicts differentiation output linearly, restoring the simple licensing-deficit model
  evidence:
  - reference: PMID:23516378
    reference_title: "Deficiency in origin licensing proteins impairs cilia formation: implications for the aetiology of Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, the replicative capacity in MGS patient cells does not correlate with clinical manifestation."
    explanation: >-
      States the uncoupling between replicative capacity and clinical severity
      that defines this knowledge gap.
- discussion_id: gap_mgors_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines the tissue selectivity of MGORS, so that external ear
    cartilage, the patella, mammary tissue and the external genitalia are
    affected out of proportion to overall stature?
  attaches_to:
  - pathophysiology#Tissue-Disproportionate Growth Failure
  - pathophysiology#Reduced Hedgehog Signaling and Impaired Chondroinduction
  rationale: >-
    A uniform, cell-autonomous replication deficit should scale all tissues
    together, yet the phenotype is strikingly selective, and it is that
    selectivity, not the short stature, that makes MGORS clinically
    recognizable. Candidate explanations include narrow developmental windows of
    unusually intense proliferation in these structures and the ciliary Hedgehog
    and chondroinduction arm, but no cell-type-resolved human data exist.
  proposed_experiments:
  - experiment_id: exp_mgors_progenitor_demand_mapping
    name: Cell-type-resolved mapping of proliferative demand in MGORS-vulnerable human embryonic structures
    description: >-
      Build a cell-type-resolved map of proliferative demand and replication
      stress in human embryonic auricular cartilage, patellar anlage and
      mammary bud, and test whether a licensing-deficient background
      preferentially depletes progenitors in exactly those compartments.
    decision_criterion: >-
      Preferential progenitor depletion in the MGORS-vulnerable compartments
      relative to matched control compartments supports proliferative demand as
      the selectivity mechanism.
    supporting_outcome:
    - MGORS-vulnerable compartments show the highest proliferative demand and the greatest progenitor loss under a licensing-deficient background
    refuting_outcome:
    - Progenitor loss is uniform across compartments, implicating a tissue-specific signaling requirement instead
  evidence:
  - reference: PMID:23023959
    reference_title: "Meier-Gorlin syndrome: growth and secondary sexual development of a microcephalic primordial dwarfism disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we highlight that growth is disproportionately affected in certain structures"
    explanation: >-
      Documents the disproportionate, structure-selective growth failure whose
      mechanism this gap concerns.
- discussion_id: mismatch_mgors_gins3_mouse_lethality
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the GINS3 D24 mouse model, which is embryonic lethal, faithfully
    represent human GINS3-related Meier-Gorlin syndrome, in which affected
    individuals survive?
  attaches_to:
  - pathophysiology#Global Prenatal and Postnatal Growth Restriction
  rationale: >-
    Homozygous D24 mouse embryos show intrauterine growth retardation and do not
    survive to birth, while the seven humans reported with the corresponding
    hypomorphic GINS3 genotypes survive with an MGORS-like phenotype. The mouse
    therefore recapitulates growth restriction but overshoots on severity, so
    mechanistic inferences drawn from it, particularly the accelerated
    senescence of the derived fibroblasts, may reflect a more complete loss of
    function than human disease alleles produce.
  proposed_experiments:
  - experiment_id: exp_mgors_gins3_humanized_allelic_series
    name: Humanized GINS3 allelic series calibrating mouse severity against patient fibroblasts
    description: >-
      Generate a mouse allelic series carrying the specific human GINS3
      hypomorphic substitutions at matched residues, and compare residual
      protein level, fork progression and senescence markers against
      patient-derived fibroblasts to calibrate where the human alleles sit on
      the murine severity curve.
    decision_criterion: >-
      Concordance of residual protein level, fork speed and senescence markers
      between the humanized mice and patient fibroblasts establishes the
      translational validity of the murine readouts.
    supporting_outcome:
    - Humanized alleles produce viable mice whose fibroblast phenotypes match patient cells, validating the model
    refuting_outcome:
    - Humanized alleles remain lethal or produce senescence far exceeding patient cells, confining the model to loss-of-function extremes
  evidence:
  - reference: PMID:35603789
    reference_title: "Hypomorphic GINS3 variants alter DNA replication and cause Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further showed that mouse embryos homozygous for a D24 variant presented intrauterine growth retardation and did not survive to birth"
    explanation: >-
      Documents the murine lethality that the surviving human patients do not
      show, which is the mismatch at issue.

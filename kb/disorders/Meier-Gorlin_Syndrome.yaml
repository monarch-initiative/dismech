diagnosis:
- name: Clinical triad criteria
  description: >-
    The diagnosis should be considered when at least two of the three cardinal
    features are present: microtia, patellar anomalies, and pre- and postnatal
    growth retardation. Requiring the complete triad would miss a substantial
    minority, since the full triad is present in roughly 82% of molecularly
    confirmed individuals.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:26381604
    reference_title: "Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis MGS should be considered in patients with at least two of the three features of the clinical triad of microtia, patellar anomalies, and pre- and postnatal growth retardation."
    explanation: >-
      States the two-of-three clinical diagnostic threshold recommended by the
      management review.
- name: Patellar imaging
  description: >-
    Because the patella ossifies late, patellar assessment must be
    age-appropriate: ultrasonography before age six and radiography thereafter.
    Skipping this step is a common reason the diagnosis is missed in a child
    presenting only with short stature and microtia.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:26381604
    reference_title: "Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with short stature and/or microtia, the patellae should be assessed with care by ultrasonography before age 6 or radiography thereafter."
    explanation: >-
      Specifies the age-appropriate imaging modality for detecting patellar
      anomalies.
- name: Molecular genetic testing
  description: >-
    Molecular confirmation uses a primordial dwarfism panel spanning all thirteen
    replication-initiation genes, or exome or genome sequencing with copy-number
    analysis. Testing limited to the five founding pre-replication complex genes
    identifies only about two-thirds to three-quarters of patients, and
    exome-only pipelines can miss deep-intronic splice-altering alleles.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:26381604
    reference_title: "Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in one of five genes (ORC1, ORC4, ORC6, CDT1, and CDC6) of the pre-replication complex, involved in DNA-replication, are detected in approximately 67-78% of patients with MGS."
    explanation: >-
      Quantifies the diagnostic yield of the original five-gene panel, motivating
      broader testing.
  - reference: PMID:37059840
    reference_title: "The expanding genetic and clinical landscape associated with Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following the initial identification of genetic causes in 2011, a total of 13 genes have been identified to date associated with MGORS."
    explanation: >-
      Establishes the current thirteen-gene testing target for MGORS.
treatments:
- name: Growth hormone therapy
  description: >-
    Recombinant growth hormone is used off-label for short stature. It is
    ineffective in most individuals, whose growth velocity normalizes after the
    first year of life without treatment, but a subgroup benefits: those with
    documented growth hormone deficiency, delayed bone age, or low IGF-1, in whom
    substantial height gains have been reported. Screening for growth hormone
    deficiency is therefore recommended before deciding.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

    label: Meier-Gorlin syndrome
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Most MGORS is autosomal recessive, arising from biallelic partial
    loss-of-function (hypomorphic) variants in a replication-initiation gene.
    Homozygous or compound heterozygous null genotypes are not observed, since
    complete loss of these essential replication factors is presumed
    incompatible with survival.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21358632
    reference_title: "Mutations in the pre-replication complex cause Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meier-Gorlin syndrome (ear, patella and short-stature syndrome) is an autosomal recessive primordial dwarfism syndrome characterized by absent or hypoplastic patellae and markedly small ears"
    explanation: >-
      The gene-discovery study establishes autosomal recessive inheritance and
      the defining clinical triad.
  - reference: PMID:22333897
    reference_title: "Meier-Gorlin syndrome genotype-phenotype studies: 35 individuals with pre-replication complex gene mutations and 10 without molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No homozygous or compound heterozygous null mutations were detected."
    explanation: >-
      Across the largest genotyped cohort, only hypomorphic biallelic genotypes
      were found, supporting the requirement for residual replication activity.
- name: Autosomal dominant inheritance
  description: >-
    A distinct dominant form arises from de novo heterozygous GMNN variants that
    delete the geminin destruction box, stabilizing the licensing inhibitor
    rather than disabling a licensing activator. This is the mechanistic and
    inheritance exception within MGORS.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26637980
    reference_title: "De Novo GMNN Mutations Cause Autosomal-Dominant Primordial Dwarfism Associated with Meier-Gorlin Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present data supporting a gain-of-function mechanism, in which the GMNN mutations result in proteins lacking the destruction box and hence increased protein stability and prolonged inhibition of replication leading to autosomal-dominant MGS."
    explanation: >-
      Establishes the dominant, gain-of-function GMNN arm as an exception to
      the otherwise recessive inheritance of MGORS.

differential_diagnoses:
- name: Seckel syndrome
  description: >-
    The other classical microcephalic primordial dwarfism caused by a
    replication-associated defect, but via the ATR DNA damage response and
    centrosome genes rather than origin licensing.
  disease_term:
    preferred_term: Seckel syndrome
    term:
      id: MONDO:0019342
      label: Seckel syndrome
  distinguishing_features:
  - Disproportionately severe microcephaly with intellectual disability, versus preserved intellect in MGORS
  - Bird-headed facial appearance rather than the small mouth and micro-retrognathia gestalt
  - Absence of microtia and patellar aplasia
  evidence:
  - reference: PMID:21358633
    reference_title: "Mutations in ORC1, encoding the largest subunit of the origin recognition complex, cause microcephalic primordial dwarfism resembling Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies into disorders of extreme growth failure (for example, Seckel syndrome and Majewski osteodysplastic primordial dwarfism type II) have implicated fundamental cellular processes of DNA damage response signaling and centrosome function in the regulation of human growth."
    explanation: >-
      Places Seckel syndrome and MOPD II as the mechanistically adjacent
      primordial dwarfisms that must be distinguished from MGORS.
- name: Microcephalic osteodysplastic primordial dwarfism type II
  description: >-
    The other primordial dwarfism most often confused with MGORS, caused by
    biallelic PCNT variants affecting centrosome function rather than
    replication initiation. Shares extreme pre- and postnatal growth failure but
    is distinguished by disproportionately severe microcephaly, skeletal
    dysplasia, and a cerebrovascular risk (moyamoya, aneurysm) that MGORS does
    not carry.
  disease_term:
    preferred_term: microcephalic osteodysplastic primordial dwarfism type II
    term:
      id: MONDO:0008872
      label: microcephalic osteodysplastic primordial dwarfism type II
  distinguishing_features:
  - Cerebrovascular disease (moyamoya, intracranial aneurysm) is characteristic of MOPD II and not of MGORS
  - Skeletal dysplasia with disproportionate short stature, versus generally proportionate short stature in MGORS
  - Absence of microtia and patellar aplasia
  evidence:
  - reference: PMID:21358633
    reference_title: "Mutations in ORC1, encoding the largest subunit of the origin recognition complex, cause microcephalic primordial dwarfism resembling Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies into disorders of extreme growth failure (for example, Seckel syndrome and Majewski osteodysplastic primordial dwarfism type II) have implicated fundamental cellular processes of DNA damage response signaling and centrosome function in the regulation of human growth."
    explanation: >-
      Names MOPD II alongside Seckel syndrome as the centrosome-and-damage-response
      primordial dwarfisms that MGORS must be distinguished from.
- name: Hutchinson-Gilford progeria syndrome
  description: >-
    Considered in the differential when an MGORS infant presents with a neonatal
    progeroid appearance, lipodystrophy, thin skin and alopecia, as reported in

- name: Tissue-Disproportionate Growth Failure
  biological_scale: TISSUE
  description: >-
    Growth failure in MGORS is not uniform. External ear cartilage, the patella,
    mammary tissue and the external genitalia are affected out of proportion to
    overall stature, which is why the clinical triad and the mammary and genital
    findings, rather than short stature alone, define the syndrome.

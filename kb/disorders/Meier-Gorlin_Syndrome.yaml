classifications:
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", which lists all eleven Meier-Gorlin rows as
      "Ear-patella-primordial short stature syndrome (Meier-Gorlin),
      <GENE>-related" across the pre-replication-complex genes curated here
      (ORC1, ORC4, ORC6, CDT1, CDC6, GMNN, CDC45, MCM3, MCM5, MCM7, GINS2).
      This supersedes the earlier assignment to the patellar dysostoses group,
      taken from the 2019 revision (Mortier et al., PMID:31633310), Table 1
      group 36 "Patellar dysostoses". The syndrome's own name is the trap: it
      begins "ear-patella", so the patellar group looks correct, and the 2023
      name change to "ear-patella-primordial short stature" is what signals the
      move. Placement follows the committee's listing, not the name.
      Re-verified against the 2023 table: the eleven rows are NOS 21-0250
      through NOS 21-0350. Note that DONSON, the thirteenth Meier-Gorlin gene
      curated in this entry's CMG-helicase node, is not one of them - the 2023
      table lists it separately at NOS 21-0200, as "Microcephalic
      osteodysplastic primordial dwarfism, or microcephaly-short
      stature-micromelia-limb abnormalities, DONSON-related", because the
      DONSON-Meier-Gorlin association was published after the table closed.
      That does not change this assignment, since NOS 21-0200 is in the same
      group; it does mean the entry is broader than the eleven rows it cites.
      The 2023 table prints NOS 21-0250 with the name "ORC4-related" against
      the gene ORC1 and OMIM 224690 (Meier-Gorlin syndrome 1); the name is a
      typographical error in the source and the gene column is what identifies
      the row.
pathophysiology:
- name: Hypomorphic Pre-Replication Complex Defect
  biological_scale: MOLECULAR
  description: >-
    Biallelic partial loss-of-function variants in ORC1, ORC4, ORC6, CDT1 or
    CDC6 reduce the level, stability, chromatin association or complex assembly
    of pre-replication complex components. Because these are essential genes,
    only hypomorphic allele combinations are compatible with survival, and
    residual activity largely sets disease severity.
  genes:
  - preferred_term: ORC1
    term:
      id: hgnc:8487
      label: ORC1
  - preferred_term: ORC4
    term:
      id: hgnc:8490
      label: ORC4
  - preferred_term: ORC6
    term:
      id: hgnc:17151
      label: ORC6
  - preferred_term: CDT1
    term:
      id: hgnc:24576
      label: CDT1
  - preferred_term: CDC6
    term:
      id: hgnc:1744
      label: CDC6
  molecular_functions:
  - preferred_term: DNA replication origin binding
    term:
      id: GO:0003688
      label: DNA replication origin binding
    modifier: DECREASED
  evidence:
  - reference: PMID:21358632
    reference_title: "Mutations in the pre-replication complex cause Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of these genes encode components of the pre-replication complex, implicating defects in replication licensing as the cause of a genetic syndrome with distinct developmental abnormalities."
    explanation: >-
      Establishes the pre-replication complex as the shared molecular lesion of
      MGORS.
  - reference: PMID:21358633
    reference_title: "Mutations in ORC1, encoding the largest subunit of the origin recognition complex, cause microcephalic primordial dwarfism resembling Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We establish that these mutations disrupt known ORC1 functions including pre-replicative complex formation and origin activation."
    explanation: >-
      Functional demonstration that patient ORC1 alleles impair pre-replicative
      complex formation and origin activation.
  downstream:
  - target: Impaired Replication Origin Licensing
    description: >-
      Loss of ORC, CDC6 or CDT1 function reduces the efficiency with which
      MCM2-7 is loaded onto origins during G1.
- name: Loss of ORC1 BAH Recognition of H4K20me2
  biological_scale: MOLECULAR
  description: >-
    In metazoans, ORC is directed to origins by chromatin rather than by DNA
    sequence, and the ORC1 BAH domain performs that reading step by binding
    histone H4 dimethylated at lysine 20. MGORS-associated BAH domain mutations
    abrogate this recognition, reducing ORC1 occupancy at origins and ORC
    chromatin loading. This is a candidate explanation for why the ORC1 arm sits
    at the severe end of the clinical gradient, since it removes the targeting
    step upstream of licensing rather than merely reducing licensing capacity.
  genes:
  - preferred_term: ORC1
    term:
      id: hgnc:8487
      label: ORC1
  molecular_functions:
  - preferred_term: DNA replication origin binding
    term:
      id: GO:0003688
      label: DNA replication origin binding
    modifier: DECREASED
  evidence:
  - reference: PMID:22398447
    reference_title: "The BAH domain of ORC1 links H4K20me2 to DNA replication licensing and Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "H4K20me2 is enriched at replication origins, and abrogating ORC1 recognition of H4K20me2 in cells impairs ORC1 occupancy at replication origins, ORC chromatin loading and cell-cycle progression."
    explanation: >-
      Demonstrates that loss of the ORC1 BAH to H4K20me2 interaction impairs
      origin occupancy, chromatin loading and cell-cycle progression.
  - reference: PMID:22398447
    reference_title: "The BAH domain of ORC1 links H4K20me2 to DNA replication licensing and Meier-Gorlin syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We find that wild-type human ORC1, but not ORC1-H4K20me2-binding mutants, rescues the growth retardation of orc1 morphants."
    explanation: >-
      Rescue experiment establishing that H4K20me2 binding specifically, not
      ORC1 protein presence alone, is what the growth phenotype depends on.
  downstream:
  - target: Impaired Replication Origin Licensing
    description: >-
      Failure to read H4K20me2 leaves ORC poorly positioned at origins, so
      fewer pre-replicative complexes are assembled.
- name: Stabilized Geminin and Excess Licensing Inhibition
  biological_scale: MOLECULAR
  description: >-
    De novo heterozygous GMNN variants remove the N-terminal destruction box that
    normally targets geminin for degradation by the anaphase-promoting complex.
    The resulting stabilized geminin persists and continues to inhibit CDT1, so
    the dominant arm of MGORS reaches the same licensing deficit by gaining an
    inhibitor rather than losing an activator.
  genes:
  - preferred_term: GMNN
    term:
      id: hgnc:17493
      label: GMNN
  evidence:
  - reference: PMID:26637980
    reference_title: "De Novo GMNN Mutations Cause Autosomal-Dominant Primordial Dwarfism Associated with Meier-Gorlin Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Geminin is present during the S, G2, and M phases of the cell cycle and is degraded during the metaphase-anaphase transition by the anaphase-promoting complex (APC), which recognizes the destruction box sequence near the 5' end of the geminin protein."
    explanation: >-
      Describes the normal destruction-box-dependent turnover of geminin that
      the MGORS alleles abolish.
  downstream:
  - target: Impaired Replication Origin Licensing
    description: >-
      Persistent geminin sustains CDT1 inhibition, blocking MCM2-7 loading in
      G1.
- name: Impaired Replication Origin Licensing
  biological_scale: MOLECULAR
  description: >-
    The convergent molecular consequence of both the loss-of-activator and the
    gain-of-inhibitor arms is inefficient assembly of the pre-replicative complex
    during G1, leaving fewer origins licensed and available to fire in S phase.
    Notably, the measured licensing deficit in patient cells does not track
    linearly with S-phase progression rate, so licensing capacity alone does not
    predict clinical severity.
  biological_processes:
  - preferred_term: pre-replicative complex assembly
    term:
      id: GO:0006267
      label: pre-replicative complex assembly involved in nuclear cell cycle DNA replication
    modifier: DECREASED
  - preferred_term: DNA replication initiation
    term:
      id: GO:0006270
      label: DNA replication initiation
    modifier: DECREASED
  evidence:
  - reference: PMID:27374770
    reference_title: "Mutations in CDC45, Encoding an Essential Component of the Pre-initiation Complex, Cause Meier-Gorlin Syndrome and Craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impaired licensing of origins of replication during the G1 phase of the cell cycle has been implicated in Meier-Gorlin syndrome (MGS), a disorder defined by the triad of short stature, microtia, and a/hypoplastic patellae."
    explanation: >-
      States the central licensing-deficit model linking the molecular lesion to
      the clinical triad.
  - reference: PMID:23516378
    reference_title: "Deficiency in origin licensing proteins impairs cilia formation: implications for the aetiology of Meier-Gorlin syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Here, we show that although origin licensing capacity is impaired in all patient cells with mutations in origin licensing component proteins, this does not correlate with the rate of progression through S phase."
    explanation: >-
      Confirms the licensing deficit in all patient cells but qualifies the
      simple licensing-to-severity model, motivating the parallel ciliary arm.
  downstream:
  - target: Delayed S-Phase Entry and Reduced Cell Proliferation
    description: >-
      Fewer licensed origins slow S-phase entry and lengthen the cell cycle.
  - target: Impaired Centriole Duplication and Primary Cilium Formation
    description: >-
      Origin licensing proteins are independently required for centriole copy
      number control and ciliogenesis, a non-replicative route out of the same
      lesion.
- name: Impaired CMG Helicase Assembly and Origin Firing
  biological_scale: MOLECULAR
  description: >-
    A second mechanistic module lies downstream of licensing: CDC45, the GINS
    subunits GINS2 and GINS3, the MCM2-7 core subunits MCM3, MCM5 and MCM7, and
    the replisome factor DONSON build and activate the CDC45-MCM2-7-GINS (CMG)
    replicative helicase. Hypomorphic variants here leave origins licensed but
    unable to fire efficiently, and additionally slow ongoing fork progression
    during S phase. DONSON is the outlier of the set: it has no role in the
    pre-replication or pre-initiation complexes themselves, and its requirement
    for CDC45 and GINS chromatin loading was only established in 2023.

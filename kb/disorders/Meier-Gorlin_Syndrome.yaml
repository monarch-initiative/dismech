- name: Global Prenatal and Postnatal Growth Restriction
  biological_scale: ORGANISM
  description: >-
    The organism-level consequence is severe growth failure beginning in utero.
    Growth velocity is most impaired during pregnancy and the first year of life,
    after which height tracks parallel to normal centiles from a much lower
    starting point, producing a mean adult height near four and a half standard
    deviations below the mean.
  downstream:
  - target: Intrauterine growth retardation
    description: >-
      Prenatal arm of the licensing-driven proliferation deficit.
  - target: Short stature
    description: >-
      Postnatal arm of the same deficit.
  - target: Microcephaly
    description: >-
      Neural progenitor expansion is licensing-dependent; microcephaly is
      variable in this disorder but follows the same route.
  - target: Delayed skeletal maturation
    description: >-
      Skeletal maturation lags because growth-plate chondrocyte turnover
      shares the S-phase delay.
  - target: Feeding difficulties
    description: >-
      Grouped with the growth phenotype, which it compounds; no independent
      mechanism is established.
  - target: Decreased response to growth hormone stimulation test
    description: >-
      A cell-intrinsic proliferation defect limits the response to GH, which
      is why this is a growth-hormone-resistant rather than deficient state.

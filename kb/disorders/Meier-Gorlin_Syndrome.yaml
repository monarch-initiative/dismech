  - target: Breast hypoplasia
    description: >-
      Mammary tissue is among the selectively affected tissues; grouped with
      the other disproportionate deficits.
  - target: Hypoplastic labia minora
    description: >-
      Genital hypoplasia, grouped with the other tissue-selective deficits.
  - target: Clitoral hypertrophy

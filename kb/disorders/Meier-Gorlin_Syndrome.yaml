name: Meier-Gorlin syndrome
creation_date: "2026-08-01T02:53:03Z"
description: >-
  Meier-Gorlin syndrome (MGORS, historically ear-patella-short stature syndrome)
  is a rare microcephalic primordial dwarfism disorder caused by hypomorphic
  defects in the machinery that licenses and fires DNA replication origins. It is
  defined by the clinical triad of bilateral microtia, absent or hypoplastic
  patellae, and severe pre- and postnatal growth restriction, with mammary
  hypoplasia and genital anomalies as additional characteristic features.
  Thirteen replication-associated genes spanning the pre-replication complex, the
  MCM2-7 helicase core, and the CDC45-MCM-GINS (CMG) activation module have been
  implicated; because complete loss of these essential factors is incompatible
  with development, disease alleles are almost always partial loss-of-function.
category: Mendelian
parents:
- syndromic disease
- autosomal recessive disease
synonyms:
- MGORS
- MGS
- ear-patella-short stature syndrome
- ear, patella, short stature syndrome

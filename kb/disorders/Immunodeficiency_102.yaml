- name: NK Cell Depletion and Impaired Cytotoxicity
  biological_scale: CELLULAR
  description: >-
    NK cell numbers are reduced in most reported patients, and NK deficiency is
    a recurring feature of the SASH3 cases ascertained through congenital
    neutropenia sequencing. The mechanism is the least settled part of this
    entry. In the mouse, SLy1 in NK cells does not act as a signalling scaffold
    at all: it stabilises the ribosome, and its loss frees ribosomal proteins,
    stabilises p53, and drives NK senescence and exhaustion with reduced
    cytotoxicity. Whether human SASH3 has the same non-signalling role in NK
    cells has not been tested, so the mouse mechanism is recorded here but not
    asserted of patients.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell mediated cytotoxicity
    term:
      id: GO:0042267
      label: natural killer cell mediated cytotoxicity
    modifier: DECREASED
  evidence:
  - reference: PMID:40510848
    reference_title: Expanding the phenotypic and genetic landscape of congenital neutropenia through whole-exome and genome sequencing.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: A shared feature among these cases was a tendency toward reduced lymphocyte subsets, particularly NK cells.
    explanation: >-
      The human observation, and marked INDIRECT because of the inference step
      it needs: the sentence is about the immunodeficiency-gene subset of a
      congenital-neutropenia cohort as a whole, not about the SASH3 patient in
      it. SASH3 is named among those genes elsewhere in the same paper, so NK
      reduction in this disease follows from the cohort statement rather than
      being asserted by it.
  - reference: PMID:28123874
    reference_title: Deficiency of the adaptor protein SLy1 results in a natural killer cell ribosomopathy affecting tumor clearance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unlike the case for T or B lymphocytes, where SLy1 shuttles between the cytoplasm and nucleus to facilitate signal transduction, in NK cells SLy1 functions as a ribosomal protein and is located solely in the cytoplasm."
    explanation: The reason this node is drawn as a separate branch rather than downstream of the signalling node. In the mouse the NK role is a different molecular function altogether.
  - reference: PMID:42327758
    reference_title: "SLy1-deficiency results in functional impaired, exhausted and senescent NK cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In brief, we demonstrated that SLy1 is indispensable for adequate numbers of viable, activatable NK cells with an intact cytolytic capacity, and that those phenotypic alterations are p53-mediated."
    explanation: Ties NK number, viability and cytotoxicity to SLy1 loss in the mouse, and attributes them to p53.
  downstream:
  - target: Reduced total natural killer cell count
    causal_link_type: DIRECT
    description: >-
      The measurable phenotype. NK lymphopenia is present in the index cohort
      and in the congenital neutropenia cases, though at least one reported
      patient had a normal NK percentage.
    evidence:
    - reference: PMID:33876203
      reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These patients also manifested neutropenia and B-cell and natural killer (NK)-cell lymphopenia.
      explanation: NK lymphopenia in the index cohort.

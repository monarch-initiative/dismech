inheritance:
- name: X-linked recessive
  description: >-
    SASH3 is on the X chromosome, and every reported patient is a hemizygous
    male. The one case in which the parental origin was established carried a
    variant inherited from a heterozygous mother.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:33876203
    reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we identified 3 novel SASH3 deleterious variants in 4 unrelated male patients with a history of combined immunodeficiency and immune dysregulation that manifested as recurrent sinopulmonary, cutaneous, and mucosal infections and refractory autoimmune cytopenias.
    explanation: Four unrelated affected individuals, all male, in the index cohort that defined the disease.
  - reference: PMID:33876203
    reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The SASH3 gene is located on the X-chromosome.
    explanation: States the chromosomal location that makes affected males hemizygous.
pathophysiology:
- name: SASH3 Adaptor Loss in Lymphocytes
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. SASH3 is expressed only in lymphocytes and has no
    enzymatic activity; it is a scaffold whose SH3 and sterile alpha motif
    domains recruit and connect downstream effectors. Nonsense variants
    (p.Gln169*, p.Arg245*, p.Arg288*) abolish the protein, and the single
    reported missense variant, p.Arg347Cys, falls in a conserved motif adjacent
    to the Ser349 phosphorylation site. Because expression is lymphocyte
    restricted, the consequences of losing it are confined to the lymphoid
    compartment rather than being systemic.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Hemizygous germline loss-of-function variants in SASH3 on the X
      chromosome. Three of the four reported variant types are nonsense.
  molecular_functions:
  - preferred_term: SASH3 signalling adaptor activity
    term:
      id: GO:0035591
      label: signaling adaptor activity
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  evidence:
  - reference: PMID:33876203
    reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sterile alpha motif (SAM) and Src homology-3 (SH3) domain-containing 3 (SASH3), also called SH3-containing lymphocyte protein (SLY1), is a putative adaptor protein that is postulated to play an important role in the organization of signaling complexes and propagation of signal transduction cascades in lymphocytes.
    explanation: Establishes SASH3 as a lymphocyte adaptor whose role is the organisation of signalling complexes, which is the function lost here.
  - reference: PMID:40947476
    reference_title: "Osteogenesis imperfecta, intellectual disability and recurrent infections in a male with a pathogenic SASH3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Src Homology 3 Domain-containing Adaptor Protein 3 (SASH3) deficiency is an X-linked immune disorder.
    explanation: A later independent group describing the entity in the same terms.
  downstream:
  - target: Failure of Antigen Receptor Signal Propagation
    causal_link_type: DIRECT
    description: >-
      Loss of the scaffold removes the protein-protein connections that couple
      an engaged antigen receptor to its downstream effectors. Restoring the
      protein by lentiviral transfer restores signalling, which is what makes
      this a direct rather than an inferred link.
    evidence:
    - reference: PMID:33876203
      reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Lentivirus-mediated transfer of the SASH3 complementary DNA-corrected protein expression, in vitro proliferation, and signaling in SASH3-deficient Jurkat and patient-derived T cells.
      explanation: Gene restoration rescues signalling in both a cell line and patient T cells, tying the signalling failure to the absent protein rather than to a correlate.
  - target: NK Cell Depletion and Impaired Cytotoxicity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      NK cells are also SASH3-expressing lymphocytes and are reduced in
      patients, but the route from adaptor loss to NK loss is not established in
      humans. In the mouse, SLy1 behaves in NK cells as a ribosomal stabiliser
      rather than a signalling scaffold, so the two branches of this pathograph
      may not share a mechanism.
    evidence:
    - reference: PMID:33876203
      reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These patients also manifested neutropenia and B-cell and natural killer (NK)-cell lymphopenia.
      explanation: Records the NK lymphopenia in the index cohort; it does not establish the intervening steps, which is why the link is marked indirect with unknown intermediates.
- name: Failure of Antigen Receptor Signal Propagation
  biological_scale: MOLECULAR
  description: >-
    Without the SASH3 scaffold, signals initiated at the T-cell and B-cell
    antigen receptors are not propagated normally. In the mouse the same
    protein is phosphorylated on Ser27 upon T- or B-cell receptor engagement
    and shuttles from nucleus to cytoplasm, which is the molecular event this
    node loses. In patients the readout is abnormal T-cell activation and
    proliferation, and the defect is corrected by re-expressing SASH3.
  biological_processes:
  - preferred_term: T cell receptor signaling
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    modifier: DECREASED
  - preferred_term: B cell receptor signaling
    term:
      id: GO:0050853
      label: B cell receptor signaling pathway
    modifier: DECREASED
  - preferred_term: intracellular signal transduction downstream of the antigen receptor
    term:
      id: GO:0035556
      label: intracellular signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:35464398
    reference_title: "Case Report: X-Linked SASH3 Deficiency Presenting as a Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SASH3 deficiency was described as a novel X-linked combined immunodeficiency with immune dysregulation, associated with impaired TCR signaling and thymocyte survival in humans.
    quote_role: BACKGROUND
    explanation: States the human signalling defect. The sentence is this case report restating the index cohort's result rather than its own, hence BACKGROUND.
  - reference: PMID:16227612
    reference_title: Impaired immune responses and prolonged allograft survival in Sly1 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: SLY1 was recently identified as an X-chromosomal SH3 protein that is serine phosphorylated (Ser27) upon B-and T-cell receptor engagement.
    quote_role: BACKGROUND
    explanation: Identifies antigen-receptor engagement as the stimulus that modifies the protein, which is the molecular basis for placing it in this pathway. The sentence restates earlier work, so it is marked BACKGROUND.
  downstream:
  - target: Thymocyte Survival Failure and Reduced Thymic Output
    causal_link_type: DIRECT
    description: >-
      Developing thymocytes depend on pre-T-cell-receptor and Notch-derived
      survival signals passing through this scaffold; without it they die before
      completing the double-negative to double-positive transition.
    evidence:
    - reference: PMID:33876203
      reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In vitro T-cell differentiation of CD34+ cells and molecular signatures of rearrangements at the T-cell receptor α (TRA) locus were indicative of impaired thymocyte survival.
      explanation: The human evidence that the signalling lesion translates into thymocyte survival failure, obtained by differentiating patient CD34+ cells in vitro rather than by sampling thymus.
  - target: Defective T Cell Proliferation and Increased Activation-Induced Apoptosis
    causal_link_type: DIRECT
    description: >-
      Mature peripheral T cells that do reach the periphery fail to mount a
      normal proliferative response when the receptor is engaged.
    evidence:
    - reference: PMID:33876203
      reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients exhibited CD4+ T-cell lymphopenia, decreased T-cell proliferation, cell cycle progression, and increased T-cell apoptosis in response to mitogens.
      explanation: The proliferative and apoptotic defect measured in patient cells in response to receptor and mitogen stimulation.
  - target: Impaired Germinal Center Reaction and Loss of Class-Switched Memory B Cells
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      B-cell receptor signalling runs through the same scaffold, so the humoral
      arm fails both cell-intrinsically and through the loss of T-cell help
      modelled on the separate edge from the T-cell proliferation node.
    evidence:
    - reference: PMID:16227612
      reference_title: Impaired immune responses and prolonged allograft survival in Sly1 mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: B- and T-cell proliferation is attenuated and T-cell cytokine production is severely reduced.
      explanation: Shows the proliferative defect is not T-cell restricted in the mouse, supporting a B-cell-intrinsic contribution alongside the loss of help.
    - reference: PMID:40947476
      reference_title: "Osteogenesis imperfecta, intellectual disability and recurrent infections in a male with a pathogenic SASH3 variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Although the total B cell count and IgG levels did not decrease, these results indicated a clear impairment in B cell differentiation.
      explanation: A patient in whom B-cell numbers and IgG were preserved but memory B-cell differentiation was not, which is the human observation this edge asserts.
- name: Thymocyte Survival Failure and Reduced Thymic Output
  biological_scale: CELLULAR
  description: >-
    Developing thymocytes require the SASH3 scaffold to survive the transition
    from the CD4-CD8- double-negative to the CD4+CD8+ double-positive stage. In
    patients this is inferred from in vitro differentiation of CD34+ progenitors
    and from the rearrangement signature at the T-cell receptor alpha locus,
    which reports how long thymocytes survive at the double-positive stage. In
    the mouse the block is direct and staged: thymic cellularity falls by about
    half and precursors are deleted by premature programmed cell death, with
    reduced proliferation in the DN3 subpopulation contributing.
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  - preferred_term: double negative thymocyte
    term:
      id: CL:0002489
      label: double negative thymocyte
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
    modifier: DECREASED
  - preferred_term: thymocyte apoptosis
    term:
      id: GO:0070242
      label: thymocyte apoptotic process
    modifier: INCREASED
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:33876203
    reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In vitro T-cell differentiation of CD34+ cells and molecular signatures of rearrangements at the T-cell receptor α (TRA) locus were indicative of impaired thymocyte survival.
    explanation: The human basis for this node. It is an in vitro differentiation assay plus a rearrangement signature, not a thymic biopsy, which is why the staging detail below comes from the mouse.
  - reference: PMID:19604361
    reference_title: The orphan adapter protein SLY1 as a novel anti-apoptotic protein required for thymocyte development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: SLY1 was identified as a novel anti-apoptotic protein required for developmental progression of T cell precursors to the CD4+CD8+ double-positive stage by protecting from premature programmed cell death initiation in developing CD4-CD8- double-negative thymocytes.
    explanation: Names the developmental checkpoint and the mechanism of loss in the mouse. It is the source of the staging claim and cannot stand for the human block on its own.
  - reference: PMID:36401605
    reference_title: Knockout of SLy1 decreases double-negative thymocyte proliferation and protects mice from p53-induced tumor formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Studies of apoptosis and proliferation in SLy1KO thymocytes revealed decreased proliferation in the DN3 subpopulation as a possible reason for the decreased thymocyte number.
    explanation: Adds reduced DN3 proliferation alongside apoptosis as a contributor to the reduced thymocyte number in the mouse.
  downstream:
  - target: Decreased total CD4+ T cell count
    causal_link_type: DIRECT
    description: >-
      Reduced thymic output is the proximate explanation for the CD4+ T-cell
      lymphopenia that is the most consistent laboratory finding in this
      disease.
    evidence:
    - reference: PMID:33876203
      reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients exhibited CD4+ T-cell lymphopenia, decreased T-cell proliferation, cell cycle progression, and increased T-cell apoptosis in response to mitogens.
      explanation: Records the CD4+ lymphopenia in the index cohort.
  - target: Decreased total T cell count
    causal_link_type: DIRECT
    description: >-
      Both CD4+ and CD8+ compartments are affected, so total T-cell numbers fall
      as well.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The SH3-domain containing protein SASH3 contributes to B and T cell developments
      explanation: The IUIS expert committee's statement that SASH3 contributes to T cell development, which is what a reduced total T cell count reports.
  - target: Severe varicella zoster infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of T-cell numbers and function is what allows an otherwise
      containable herpesvirus reactivation to become severe. In the one adult
      case this was the observation that redirected a long-standing common
      variable immunodeficiency diagnosis toward a T-cell defect.
    evidence:
    - reference: PMID:35464398
      reference_title: "Case Report: X-Linked SASH3 Deficiency Presenting as a Common Variable Immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two separate, severe viral infections drew our attention and pointed to an underlying T cell defect: severe varicella zoster virus (VZV) infection at the age of 4 years and bilateral pneumonia due type A influenza infection at the age of 38."
      explanation: The authors' own inference from the severe VZV episode to an underlying T-cell defect, which is the edge asserted here.
  - target: Combined immunodeficiency
    causal_link_type: DIRECT
    description: >-
      The cellular arm of the combined defect. Reduced thymic output is what
      distinguishes this disease from a purely humoral immunodeficiency,
      notwithstanding that several patients were first labelled with one.
    evidence:
    - reference: PMID:33876203
      reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These findings define a new type of X-linked combined immunodeficiency in humans that recapitulates many of the abnormalities reported in mice with Sly1-/- and Sly1Δ/Δ mutations, highlighting an important role of SASH3 in human lymphocyte function and survival.
      explanation: The classification of the entity as a combined, rather than purely humoral, immunodeficiency.
- name: Defective T Cell Proliferation and Increased Activation-Induced Apoptosis
  biological_scale: CELLULAR
  description: >-
    Peripheral T cells that reach the circulation respond poorly to receptor and
    mitogen stimulation: proliferation is reduced, cell-cycle progression is
    impaired, and apoptosis is increased. In the mouse the corresponding defect
    is dysregulated Foxo1 shuttling after T-cell receptor signalling, which
    raises cell-cycle inhibitor expression and limits clonal expansion; whether
    the human proliferative defect runs through Foxo1 has not been tested.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell proliferation
    term:
      id: GO:0042098
      label: T cell proliferation
    modifier: DECREASED
  - preferred_term: cell cycle progression after antigen receptor engagement
    term:
      id: GO:0007049
      label: cell cycle
    modifier: DECREASED
  - preferred_term: activation-induced T cell apoptosis
    term:
      id: GO:0043065
      label: positive regulation of apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:33876203
    reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients exhibited CD4+ T-cell lymphopenia, decreased T-cell proliferation, cell cycle progression, and increased T-cell apoptosis in response to mitogens.
    explanation: All three components of this node, measured directly in patient cells.
  - reference: PMID:35464398
    reference_title: "Case Report: X-Linked SASH3 Deficiency Presenting as a Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient's immunological phenotype included marked B cell lymphopenia with reduced pre-switch and switch memory B cells, decreased CD4+ and CD8+ naïve T cells, elevated CD4+ and CD8+ TEMRA cells, and abnormal T cell activation and proliferation.
    explanation: Independent confirmation of abnormal T-cell activation and proliferation in a second, unrelated patient.
  - reference: PMID:26306874
    reference_title: SLy1 regulates T-cell proliferation during Listeria monocytogenes infection in a Foxo1-dependent manner.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The increased susceptibility of SLy1 knock-out (KO) mice was caused by reduced proliferation of differentiated T cells.
    explanation: The mouse counterpart, which additionally supplies the Foxo1 mechanism the description flags as untested in humans.
  downstream:
  - target: Decreased antigen-specific T cell proliferation
    causal_link_type: DIRECT
    description: >-
      The measurable clinical correlate of this node: patient T cells do not
      expand normally when stimulated.
    evidence:
    - reference: PMID:37646304
      reference_title: Evans syndrome caused by a deleterious mutation affecting the adaptor protein SASH3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The autoimmune phenotype was associated with an increased CD21low T-bet+ CD11c+ subset along with decreased regulatory T cells, impaired T-cell proliferation and T-cell exhaustion.
      explanation: Impaired T-cell proliferation reported in a further patient, alongside the exhaustion phenotype.
  - target: Impaired Germinal Center Reaction and Loss of Class-Switched Memory B Cells
    causal_link_type: DIRECT
    description: >-
      The germinal centre is T-cell dependent, so a CD4+ compartment that is
      both reduced in number and poorly proliferative cannot supply the cognate
      help the reaction requires.
    evidence:
    - reference: PMID:40947476
      reference_title: "Osteogenesis imperfecta, intellectual disability and recurrent infections in a male with a pathogenic SASH3 variant."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: Antibody responses to T-dependent and T-independent antigens are impaired.
      explanation: The T-dependent antibody failure in the Sly1-deficient mouse, restated here by a human case report summarising the mouse literature. Graded MODEL_ORGANISM because the finding is a mouse result, and BACKGROUND because the citing paper did not produce it.
  - target: Breakdown of Peripheral Tolerance and Autoimmune Cytopenias
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Patients have reduced regulatory T cells, an expanded CD21low T-bet+
      CD11c+ population and T-cell exhaustion alongside the proliferative
      defect. The association is reported; the causal steps from adaptor loss to
      loss of tolerance are not worked out, which is why this link is marked
      indirect with unknown intermediates.
    evidence:
    - reference: PMID:37646304
      reference_title: Evans syndrome caused by a deleterious mutation affecting the adaptor protein SASH3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The autoimmune phenotype was associated with an increased CD21low T-bet+ CD11c+ subset along with decreased regulatory T cells, impaired T-cell proliferation and T-cell exhaustion.
      explanation: Reports the association between the autoimmune phenotype and the regulatory and exhaustion abnormalities, without establishing direction.
- name: Impaired Germinal Center Reaction and Loss of Class-Switched Memory B Cells
  biological_scale: TISSUE
  conforms_to: "germinal_center_reaction#Germinal Center Reaction"
  description: >-
    The humoral arm fails at the germinal centre. Splenic histology in one
    patient, examined after a clinically indicated splenectomy, showed severe
    hypoplasia or absence of germinal centres. Patients consistently lose
    class-switched and IgM memory B cells even when total B-cell numbers and IgG
    are preserved, and serum IgM is frequently low. In the Sly1 mutant mouse the
    corresponding defect is a selective block at the marginal-zone B-cell
    transition with severely impaired antibody responses to both T-dependent and
    T-independent antigens.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: class switched memory B cell

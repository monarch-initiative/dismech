- name: Breakdown of Peripheral Tolerance and Autoimmune Cytopenias
  biological_scale: ORGANISM
  description: >-
    Immune dysregulation is a defining half of this disease rather than an
    incidental complication. Patients develop refractory autoimmune cytopenias,
    and in the one case studied in detail the autoimmune phenotype came with
    reduced regulatory T cells, T-cell exhaustion, and an expanded CD21low
    T-bet+ CD11c+ population. How loss of a lymphocyte adaptor produces loss of
    tolerance is not established; the thymocyte selection defect and the
    regulatory T-cell deficit are both plausible routes and neither has been
    tested against the other in patients.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:

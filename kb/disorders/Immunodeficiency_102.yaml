    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immunohistochemistry performed after clinically indicated splenectomy revealed severe hypoplasia/absence of germinal centres.
    explanation: The only direct human histological observation of the germinal centre in this disease, and the reason this node is placed at the germinal centre rather than downstream of it.
  - reference: PMID:40947476
    reference_title: "Osteogenesis imperfecta, intellectual disability and recurrent infections in a male with a pathogenic SASH3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, further analysis of B cells demonstrated a considerable reduction in IgM memory B cells (CD19+CD27+IgD+) at 1.6% and switched memory B cells (CD19+CD27+IgD−) at 2.4%
    explanation: Quantifies the memory B-cell loss in a patient whose total B-cell count and IgG were normal, separating the germinal-centre output defect from B-cell lymphopenia.
  - reference: PMID:16227612
    reference_title: Impaired immune responses and prolonged allograft survival in Sly1 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Sly1(d/d) mice exhibit reduced lymphoid organ sizes, diminished marginal zone B-cell numbers, and severely impaired antibody responses against T-dependent and -independent antigens.
    explanation: The mouse humoral phenotype. It supports the T-dependent antibody failure but is a marginal-zone rather than a germinal-centre lesion, so it is supporting rather than defining evidence here.

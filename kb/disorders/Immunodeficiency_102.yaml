name: Immunodeficiency 102
creation_date: "2026-09-18T00:00:00Z"
category: Mendelian
synonyms:
- IMD102
- SASH3 deficiency
- X-linked combined immunodeficiency due to SASH3 deficiency
- SLY1 deficiency
description: >-
  Immunodeficiency 102 is an X-linked combined immunodeficiency with immune
  dysregulation caused by hemizygous loss-of-function variants in SASH3, which
  encodes an adaptor protein expressed only in lymphocytes and also known as
  SLY1 (SH3 protein expressed in lymphocytes 1). SASH3 carries a bipartite
  nuclear localisation signal, an SH3 domain and a sterile alpha motif, has no
  known catalytic activity, and works by nucleating signalling complexes
  downstream of the T-cell and B-cell antigen receptors. In the mouse it is
  found in both the cytoplasm and the nucleus of lymphocytes, and it is
  phosphorylated and exported to the cytoplasm on antigen receptor engagement;
  the human protein has not been localised in the same way.

  The lesion is therefore a signalling lesion, not a receptor-assembly or
  nucleotide-metabolism lesion, and the gene's expression pattern would
  confine its consequences to the lymphoid compartment. The reported
  neutropenia is the one finding that does not fit that expectation, and this
  entry records it as unexplained rather than explaining it away. Patients
  have CD4+ T-cell lymphopenia, poor T-cell proliferation, impaired cell-cycle
  progression
  and excess activation-induced apoptosis; the in vitro differentiation and
  T-cell receptor alpha rearrangement data point to thymocyte survival failure
  upstream of that. B-cell and natural killer cell lymphopenia, loss of
  class-switched memory B cells, neutropenia and refractory autoimmune
  cytopenias complete the picture. Clinically this is recurrent sinopulmonary,
  cutaneous and mucosal infection plus autoimmune haemolytic anaemia and immune
  thrombocytopenia.

  The disease is defined by a small number of reported patients, and their
  presentations are strikingly heterogeneous: a phenotype indistinguishable from
  common variable immunodeficiency in one adult, Evans syndrome in another, an
  asymptomatic brother carrying the same variant as an affected proband, and one
  case ascertained through congenital neutropenia sequencing rather than through
  an immunological presentation. Curating it therefore means being explicit
  about which claims rest on the four-patient index cohort, which come from
  single later case reports, and which come only from the Sly1-deficient mouse.
  The mouse literature substantially predates the human disease and is far
  larger than it, so mouse-derived claims are graded MODEL_ORGANISM throughout
  and are never the sole support for a human phenotype.

  One pathophysiology node declares conforms_to, against
  germinal_center_reaction#Germinal Center Reaction. kb/modules/ was searched
  for a T-cell receptor proximal signalling, thymocyte selection, or lymphocyte
  survival module and none exists; the antigen-receptor signalling chain that
  carries most of this entry is consequently modelled in the entry itself.

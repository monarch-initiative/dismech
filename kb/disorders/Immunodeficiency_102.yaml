genetic:
- name: SASH3
  gene_term:
    preferred_term: SASH3
    term:
      id: hgnc:15975
      label: SASH3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Hemizygous germline loss-of-function variants in SASH3 on the X
    chromosome. No cited source in this entry states the cytogenetic band, so
    none is recorded. Four variant types had been reported worldwide as of
    the 2025 case report PMID:40947476, which tabulates them: three nonsense
    (c.505C>T p.Gln169*, c.733C>T p.Arg245*, c.862C>T p.Arg288*) and one
    missense (c.1039C>T p.Arg347Cys). Arg347 is conserved from Xenopus to human
    and sits in a putative protein-kinase-A binding motif adjacent to the
    Ser349 phosphorylation site, which is the proposed reason a single missense
    substitution behaves like a null. The gene is also known as SLY1; the mouse
    literature, which is far larger than the human, uses that name.
  evidence:
  - reference: PMID:33876203
    reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we identified 3 novel SASH3 deleterious variants in 4 unrelated male patients with a history of combined immunodeficiency and immune dysregulation that manifested as recurrent sinopulmonary, cutaneous, and mucosal infections and refractory autoimmune cytopenias.
    explanation: The gene-disease association as originally established, in four unrelated patients.
  - reference: PMID:35753512
    reference_title: "Clinical exome sequencing of 1000 families with complex immune phenotypes: Toward comprehensive genomic evaluations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This program also facilitated the discovery of new gene-disease associations such as SASH3-related immunodeficiency.
    explanation: The sequencing program in which the association was made, which also reports how rare the diagnosis was within its own cohort.
  - reference: PMID:35464398
    reference_title: "Case Report: X-Linked SASH3 Deficiency Presenting as a Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genetic testing using an NGS-based custom-targeted gene panel revealed a novel hemizygous loss-of-function variant in the SASH3 gene (c.505C>T/p.Gln169*).
    explanation: An independently ascertained hemizygous loss-of-function variant, establishing the association beyond the index cohort.
  - reference: PMID:40947476
    reference_title: "Osteogenesis imperfecta, intellectual disability and recurrent infections in a male with a pathogenic SASH3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This pathogenic variant was inherited from the mother, who carries the same variant in the heterozygous state.
    explanation: The only reported case in which parental origin was established, confirming maternal carriage and X-linked transmission.
  - reference: PMID:33710696
    reference_title: The emerging and diverse roles of the SLy/SASH1-protein family in health and disease-Overview of three multifunctional proteins.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The initial characterization of the first member SLy1/SASH3 (SH3 protein expressed in lymphocytes 1) in 2001 was rapidly followed by identification of SLy2/HACS1 (hematopoietic adaptor containing SH3 and SAM domains 1) and SASH1/SLy3 (SAM and SH3 domain containing 1).
    explanation: >-
      Records that SASH3 belongs to a three-member family whose other members,
      SAMSN1 and SASH1, are separate genes with different expression patterns
      and disease associations. Cited here so the gene binding cannot be read
      as covering SASH1, which is ubiquitously expressed and is curated in the
      literature as a tumour suppressor rather than an immunodeficiency gene.
  - reference: PMID:40947476
    reference_title: "Osteogenesis imperfecta, intellectual disability and recurrent infections in a male with a pathogenic SASH3 variant."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: BACKGROUND
    snippet: investigated sequence motifs surrounding Arg347, a highly conserved residue from Xenopus to humans, and identified a putative protein-kinase-A-binding motif using a three-dimensional model of SASH3.
    explanation: >-
      The structural argument for why the single reported missense substitution behaves like a null. It is a three-dimensional model rather than an experiment, hence COMPUTATIONAL, and the citing paper is restating the index cohort's modelling rather than its own, hence BACKGROUND.
animal_models:
- name: Sly1 knockout mouse
  species: Mouse
  genotype: Sly1 targeted null (Sly1-/-), whole-body
  publication: PMID:19604361
  description: >-
    Complete deletion of the SLy1 protein. This is the model that identified the
    thymocyte survival checkpoint, and the human index cohort was explicitly
    described as recapitulating many of its abnormalities. It substantially
    predates the human disease.
  modeled_mechanisms:
  - target: Thymocyte Survival Failure and Reduced Thymic Output
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Thymic cellularity falls by roughly half, with a block at the
      double-negative to double-positive transition driven by premature
      programmed cell death.
    limitations: >-
      The human block is inferred from in vitro differentiation of patient
      CD34+ cells and from a T-cell receptor alpha rearrangement signature, not
      from thymic tissue, so the staging observed in the mouse has never been
      confirmed in a patient. The mouse is also a complete null, whereas one
      human variant is missense.
    evidence:
    - reference: PMID:19604361
      reference_title: The orphan adapter protein SLY1 as a novel anti-apoptotic protein required for thymocyte development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: SLY1 was identified as a novel anti-apoptotic protein required for developmental progression of T cell precursors to the CD4+CD8+ double-positive stage by protecting from premature programmed cell death initiation in developing CD4-CD8- double-negative thymocytes.
      explanation: Establishes the model as informative for the thymocyte survival node.
    readouts:
    - name: Ribosomal protein S6 phosphorylation and nutrient receptor induction in thymocytes
      target: Thymocyte Survival Failure and Reduced Thymic Output
      direction: DECREASED
      interpretation: >-
        Read as a failure of mTOR complex activation downstream of the pre-T-cell
        receptor and Notch, which is the proposed proximate cause of the
        survival failure in this model.
      evidence:
      - reference: PMID:19604361
        reference_title: The orphan adapter protein SLY1 as a novel anti-apoptotic protein required for thymocyte development.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: SLY1-deficient thymocytes were compromised in inducing nutrient receptor expression and ribosomal protein S6 phosphorylation, indicating a defect in mTOR complex activation.
        explanation: The measurement behind this readout and the authors' interpretation of it.
  - target: Defective T Cell Proliferation and Increased Activation-Induced Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Differentiated T cells from knockout mice proliferate poorly after
      infection, through dysregulated Foxo1 shuttling and increased expression
      of cell-cycle inhibitory genes.
    limitations: >-
      The Foxo1 mechanism has not been looked for in patients, so the model
      supplies a mechanism for the human proliferative defect that remains
      untested in humans.
    evidence:
    - reference: PMID:26306874
      reference_title: SLy1 regulates T-cell proliferation during Listeria monocytogenes infection in a Foxo1-dependent manner.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The increased susceptibility of SLy1 knock-out (KO) mice was caused by reduced proliferation of differentiated T cells.
      explanation: Attributes the in vivo phenotype to the same proliferative defect seen in patients.
  - target: NK Cell Depletion and Impaired Cytotoxicity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Knockout mice have reduced NK numbers, viability and cytotoxicity, with
      senescence and exhaustion. The number and function phenotypes match the
      patients; the molecular route does not obviously transfer.
    limitations: >-
      In the mouse the NK phenotype runs through a ribosomal rather than a
      signalling role for SLy1, with p53 stabilisation as the effector. No
      human study has tested whether SASH3 has a ribosomal role in NK cells, so
      the mouse mechanism cannot be carried across; only the direction of the NK
      phenotype is shared.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The mouse attributes the NK phenotype to ribosomal instability and p53
        accumulation. Whether that pathway operates in human NK cells is
        untested, so the cause the model represents may not be the cause
        operating in patients.
    evidence:
    - reference: PMID:28123874
      reference_title: Deficiency of the adaptor protein SLy1 results in a natural killer cell ribosomopathy affecting tumor clearance.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In its absence, ribosomal instability results in p53-mediated NK cell senescence and decreased clearance of malignancies.
      explanation: The mouse NK mechanism, and the reason the fidelity of this link is graded LOW.
- name: Sly1 N-terminal deletion mouse
  species: Mouse
  genotype: Sly1 delta/delta, N-terminal 81-amino-acid deletion removing Ser27 and part of the nuclear localisation signal
  publication: PMID:16227612
  description: >-
    A hypomorphic-by-design model expressing a truncated SLy1 that is confined
    to the cytoplasm. It separates the phosphorylation and nuclear-shuttling
    function from the rest of the protein, and it is the source of the humoral
    phenotype data.
  modeled_mechanisms:
  - target: Impaired Germinal Center Reaction and Loss of Class-Switched Memory B Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reduced lymphoid organ size, loss of marginal-zone B cells, and severely
      impaired antibody responses to both T-dependent and T-independent
      antigens, including the polysaccharide response.
    limitations: >-
      The mouse lesion is at the marginal-zone B-cell transition, with reduced
      Notch target gene expression, whereas the single human histological
      observation is germinal-centre hypoplasia in the spleen. These are
      adjacent but not the same compartment, and no patient has been studied for
      a marginal-zone defect.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Marginal-zone B cells and their dependence on Notch signalling are much
        better defined in mouse spleen than in human, so a marginal-zone lesion
        does not map cleanly onto the human compartment in which germinal-centre
        hypoplasia was seen.
    evidence:
    - reference: PMID:16227612
      reference_title: Impaired immune responses and prolonged allograft survival in Sly1 mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Sly1(d/d) mice exhibit reduced lymphoid organ sizes, diminished marginal zone B-cell numbers, and severely impaired antibody responses against T-dependent and -independent antigens.
      explanation: The humoral phenotype this link asserts the model informs.
    readouts:
    - name: Antigen-specific IgM after pneumococcal polysaccharide immunisation
      target: Impaired Germinal Center Reaction and Loss of Class-Switched Memory B Cells
      direction: DECREASED
      interpretation: >-
        The mouse counterpart of the suboptimal pneumococcal polysaccharide
        vaccine response reported in the adult patient.
      evidence:
      - reference: PMID:18950867
        reference_title: Reduced notch activity is associated with an impaired marginal zone B cell development and function in Sly1 mutant mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Consistent with the loss of MZ B cells, the production of antigen-specific IgM antibodies following immunization with pneumococcal polysaccharides was severely impaired in Sly1(d/d) mice.
        explanation: The specific immunisation experiment behind this readout.
treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Replacement immunoglobulin for the antibody deficiency. It is the standard
    of care for the humoral arm of a combined immunodeficiency with
    hypogammaglobulinaemia and poor specific antibody responses, both of which
    are recorded for this disease in the IUIS table. No published series
    reports outcomes on replacement in SASH3 deficiency specifically, so this
    entry records the indication rather than a genotype-specific efficacy claim.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Impaired Germinal Center Reaction and Loss of Class-Switched Memory B Cells
    description: >-
      Replacement bypasses the germinal centre rather than repairing it: it
      supplies the antibody the reaction fails to produce and does nothing to
      the reaction itself.
  evidence:
  - reference: PMID:35464398
    reference_title: "Case Report: X-Linked SASH3 Deficiency Presenting as a Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immunoglobulin replacement therapy was not prescribed at that time.
    explanation: >-
      A negative datum, quoted deliberately. This is the only mention of
      immunoglobulin replacement in the SASH3 case literature, and it records
      that a patient with low IgG and IgM was not started on it. It supports the
      indication being considered in these patients; it does not support an
      efficacy claim, and no efficacy claim is made here.
- name: Antimicrobial Prophylaxis
  description: >-
    Prophylactic antimicrobials against the recurrent sinopulmonary, cutaneous
    and mucosal infections. As with immunoglobulin replacement, this is the
    general management of a combined immunodeficiency with this infection
    pattern; no SASH3-specific prophylaxis regimen or outcome has been
    published.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  target_phenotypes:
  - preferred_term: Recurrent sinopulmonary infections
    term:
      id: HP:0005425
      label: Recurrent sinopulmonary infections
  evidence:
  - reference: PMID:33876203
    reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we identified 3 novel SASH3 deleterious variants in 4 unrelated male patients with a history of combined immunodeficiency and immune dysregulation that manifested as recurrent sinopulmonary, cutaneous, and mucosal infections and refractory autoimmune cytopenias.
    explanation: Establishes the infection burden this treatment addresses. It does not report prophylaxis, which is why the description states the indication rather than an outcome.
- name: Immunosuppressive Therapy for Autoimmune Cytopenias
  description: >-
    Treatment directed at the immune dysregulation rather than the
    immunodeficiency. The cytopenias are described as refractory in the index
    cohort, and in one reported patient management reached splenectomy. Naming
    specific agents would go beyond what the case literature records, so none
    are named here.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  target_mechanisms:
  - target: Breakdown of Peripheral Tolerance and Autoimmune Cytopenias
    description: >-
      Suppresses the autoreactive response, leaving the underlying adaptor
      deficiency untouched.
  evidence:
  - reference: PMID:33876203
    reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we identified 3 novel SASH3 deleterious variants in 4 unrelated male patients with a history of combined immunodeficiency and immune dysregulation that manifested as recurrent sinopulmonary, cutaneous, and mucosal infections and refractory autoimmune cytopenias.
    explanation: >-
      The word that carries this treatment is "refractory": a cytopenia is
      called refractory only after therapy has been tried and has not held, so
      the index cohort establishes both that immunosuppressive treatment is
      given in this disease and that it is often inadequate. The paper names no
      agent, which is why none is named here.
- name: Splenectomy
  description: >-
    Surgical removal of the spleen as second-line therapy for the refractory
    autoimmune cytopenias, reported in one patient. It removes the principal
    site of antibody-mediated blood-cell destruction; it does nothing to the
    underlying adaptor deficiency, and it adds a lifelong encapsulated-organism
    infection risk to a patient who is already immunodeficient. Recorded here
    because it happened and is documented, not as a recommendation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  target_mechanisms:
  - target: Breakdown of Peripheral Tolerance and Autoimmune Cytopenias
    description: >-
      Acts on the effector end of this node by removing the site of
      destruction, not on the loss of tolerance that drives it.
  evidence:
  - reference: PMID:37646304
    reference_title: Evans syndrome caused by a deleterious mutation affecting the adaptor protein SASH3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immunohistochemistry performed after clinically indicated splenectomy revealed severe hypoplasia/absence of germinal centres.
    explanation: >-
      Documents that a splenectomy was performed, and that it was clinically
      indicated rather than diagnostic. The germinal-centre finding it reports
      is curated separately on the germinal-centre pathophysiology node; what
      this item supports is only that the procedure occurred in this disease.
- name: Genetic Counseling
  description: >-
    X-linked inheritance with a demonstrated carrier mother in the one family
    where parental origin was established, and an asymptomatic hemizygous
    brother in another. Counselling therefore has to cover both carrier
    detection in female relatives and the possibility that a hemizygous male
    relative is clinically well.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40947476
    reference_title: "Osteogenesis imperfecta, intellectual disability and recurrent infections in a male with a pathogenic SASH3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This pathogenic variant was inherited from the mother, who carries the same variant in the heterozygous state.
    explanation: Documented maternal carrier state, which is the fact counselling turns on.
  - reference: PMID:37646304
    reference_title: Evans syndrome caused by a deleterious mutation affecting the adaptor protein SASH3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The younger brother carries the same SASH3 mutation and shares immunophenotypic features but is currently clinical asymptomatic, indicating heterogeneity of SASH3 deficiency.
    explanation: An asymptomatic hemizygous sibling, which is why counselling cannot promise a predictable phenotype from the genotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only a small number of patients have been reported, and the counts
    overlap: four in the index cohort, five recognised by the 2022 IUIS
    classification, and a handful of single case reports since. No total is
    asserted here, because no source states one. No prevalence or incidence
    estimate exists and none is attempted here. For scale on the denominator, a dedicated sequencing
    program for suspected inborn errors of immunity, covering 1505 individuals
    from 1000 families, returned SASH3 in two of them.
  evidence:
  - reference: PMID:35753512
    reference_title: "Clinical exome sequencing of 1000 families with complex immune phenotypes: Toward comprehensive genomic evaluations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Specifically, these included individuals with pathogenic variants in GIMAP5 (n = 2) and SASH3 (n = 2).
    explanation: >-
      Two SASH3 diagnoses in a cohort of 1505 individuals from 1000 families
      selected for suspected or known inborn errors of immunity. This is a
      yield within a highly enriched referral population, not a population
      prevalence, and is recorded only as a scale marker.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The reported range runs from an asymptomatic hemizygous brother, through an
    adult carried for decades under a common variable immunodeficiency label
    with two severe viral episodes, to refractory autoimmune cytopenias
    requiring splenectomy. Recurrent sinopulmonary, cutaneous and mucosal
    infection is the common thread, and the immune dysregulation rather than
    the infection burden is what drives the most severe presentations. With
    fewer than a dozen reported patients and a median follow-up measured in
    single case reports, any single burden level would overstate what is known.
  evidence:
  - reference: PMID:37646304
    reference_title: Evans syndrome caused by a deleterious mutation affecting the adaptor protein SASH3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The younger brother carries the same SASH3 mutation and shares immunophenotypic features but is currently clinical asymptomatic, indicating heterogeneity of SASH3 deficiency.
    explanation: The authors' own statement of phenotypic heterogeneity, from a family carrying one variant across two very different clinical states.
  - reference: PMID:35464398
    reference_title: "Case Report: X-Linked SASH3 Deficiency Presenting as a Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our patient displays a milder phenotype than has been reported previously in these patients, thus expanding the clinical spectrum of this recently identified inborn error of immunity.
    explanation: A second, independent statement that the severity spectrum is wider than the index cohort suggested.
discussions:
- discussion_id: sash3_neutropenia_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes the neutropenia in SASH3 deficiency, given that SASH3
    expression is restricted to lymphocytes?
  attaches_to:
  - phenotypes#Decreased total neutrophil count
  rationale: >-
    Neutropenia is reported in the index cohort and is prominent enough that
    SASH3 turns up in cohorts sequenced for suspected congenital neutropenia.
    But the gene is lymphocyte restricted, so a neutrophil-intrinsic effect has
    no obvious basis, and autoimmune destruction, the usual alternative in an
    immune-dysregulation disorder, has not been demonstrated in any reported
    patient. No mouse study has reported neutropenia either. The phenotype is
    therefore deliberately left with no incoming causal edge in this entry: the
    two candidate mechanisms are both untested, and drawing an edge to either
    would assert more than the literature does.
- discussion_id: sash3_nk_role_human_vs_mouse
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does human SASH3 act as a ribosomal stabiliser in NK cells, as mouse SLy1
    does, or does the human NK phenotype arise some other way?
  attaches_to:
  - pathophysiology#NK Cell Depletion and Impaired Cytotoxicity
  rationale: >-
    The mouse work is explicit that SLy1 does something different in NK cells
    than in T and B cells: it is a cytoplasmic ribosomal protein rather than a
    shuttling signalling scaffold, and its loss causes ribosomal instability,
    p53 accumulation, senescence and exhaustion. That is a well-worked-out
    mechanism with a matching phenotype. The human evidence is only that NK
    cells are reduced. Nobody has looked for a ribosomal role for SASH3 in human
    NK cells, so the entry records the NK phenotype as a branch of its own
    rather than placing it downstream of the signalling node, and marks the
    model link LOW fidelity with a CAUSE_UNREPRESENTED divergence.
- discussion_id: sash3_extra_immune_manifestations
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are the skeletal and neurodevelopmental findings reported in one patient
    with a SASH3 missense variant part of the disease, or coincidental?
  attaches_to:
  - genetic#SASH3
  rationale: >-
    One reported patient had osteogenesis imperfecta, metaphyseal dysplasia,
    intellectual disability, hearing loss, cleft lip and palate and renal
    agenesis alongside the immunological phenotype. Exome sequencing in that
    patient found no pathogenic variant in any gene linked to osteogenesis
    imperfecta or intellectual disability. The reporting authors explicitly
    declined to attribute the skeletal and neurological findings to SASH3, and
    no other patient has had them. This entry follows them: those features are
    not curated as phenotypes of immunodeficiency 102, and this discussion
    records why the decision could go the other way if a second such patient is
    reported.
  evidence:
  - reference: PMID:40947476
    reference_title: "Osteogenesis imperfecta, intellectual disability and recurrent infections in a male with a pathogenic SASH3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While immunological features in this case were characterized, further studies are needed to determine the association between the SASH3 variant and the skeletal or neurological manifestations.
    explanation: The reporting authors' own statement that the association is unestablished, which is the basis for excluding these features from the phenotype list.
notes: >-
  Entry-type decision. Curated as a standalone DISEASE. MONDO:0024781 records
  no descendants and a single causal gene (SASH3, hgnc:15975); the label and
  gene appear nowhere else in kb/; and the 2022 IUIS classification lists SASH3
  deficiency as its own entity in the table of immunodeficiencies affecting
  cellular and humoral immunity. There is no parent disease in kb/ for it to
  become a has_subtypes row of, and it is a single-gene entity rather than a
  union, so GROUPING and SUBTYPE were both ruled out.

  Naming. The file follows the Immunodeficiency_NNN convention used by the
  other 39 numbered immunodeficiency entries in kb/disorders/, with SASH3
  deficiency carried as a synonym. The closest precedent is
  Immunodeficiency_105, which likewise keeps the MONDO-style numbered name and carries its gene-based alias (CD45
  deficiency) as a synonym rather than in the filename.

  GeneReviews. There is no GeneReviews chapter for SASH3 deficiency or
  immunodeficiency 102. Verified offline against the committed Bookshelf index
  with `just check-genereviews`, not asserted from memory.

  Evidence balance. The SLy1 literature begins with the protein's initial
  characterization in 2001 and the first mutant mouse in 2005, against a human
  disease literature that begins in 2021, and the mouse literature is the
  larger of the two. Every mouse-derived claim in this entry is graded
  MODEL_ORGANISM and is paired with a human observation on the same node; no human phenotype rests on mouse evidence alone. Where a
  human case report restates a mouse or index-cohort finding rather than
  producing it, the evidence item carries quote_role: BACKGROUND.

  Mucosal infection is not curated as a phenotype, and not for want of
  looking. PMID:33876203 gives the infection pattern as "recurrent
  sinopulmonary, cutaneous, and mucosal infections"; the first two are curated
  and the third has no HPO term that fits. Searched
  `runoak -i ols:hp search "mucosal infection"` (returns only HP:0020342
  Unusual stomatitis), `search "Recurrent mucocutaneous infection"` (no hits),
  `search "t~mucosal"` (morphology terms only), and the is-a descendants of
  HP:0002719 Recurrent infections, whose only mucosal members are site-specific
  (HP:0004798 Recurrent infection of the gastrointestinal tract, HP:0031123
  Recurrent gastroenteritis, HP:0009098 Chronic oral candidiasis). Binding any
  of those would assert a site the index cohort does not name, and
  HP:0002728 Recurrent mucocutaneous candidiasis would assert an organism no
  source reports. No term beats a bad one, so none is bound.

  Orphanet prevalence is deliberately not curated. MONDO:0024781 xrefs
  Orphanet:653751, and the deep-research report states Orphanet classifies this
  disease as <1/1,000,000. That could not be verified here: `just
  fetch-reference ORPHA:653751` fails with "No source found", because ORPHA
  records are built from the Orphadata bulk XML rather than fetched per
  identifier, and that build is not present in this worktree. The prevalence
  record therefore stays CASES_IN_LITERATURE / ULTRA_RARE on evidence that is
  cached and quotable, rather than importing an unverified band from a report.

  Treatments. No published series reports treatment outcomes in SASH3
  deficiency. Four of the five treatments curated here record standard
  management of a combined immunodeficiency with this phenotype, and each says
  so; none makes a genotype-specific efficacy claim. The fifth, splenectomy, is
  the one procedure a published patient actually underwent, and is recorded as
  a documented event rather than a recommendation. Haematopoietic stem cell transplantation is
  deliberately absent: it is the obvious curative candidate for a combined
  immunodeficiency, but no reported SASH3 patient has been described as
  transplanted. The cached text of all five human SASH3 papers (PMID:33876203,
  PMID:35464398, PMID:37646304, PMID:40947476, PMID:40510848) was searched for
  transplant, HSCT and stem cell with no hit; the only hit anywhere in the
  cited set is a cohort-wide actionability tally in PMID:35753512 that is not
  about these patients. Asserting transplantation here would be inventing a
  treatment record. Note that PMID:33876203 is cached abstract-only, so absence
  there is weaker than in the four full texts.

  Deep research. research/Immunodeficiency_102-deep-research-claude_code.md was
  generated after the entry was drafted and is committed alongside it, so it is
  a cross-check rather than a source: no claim in this entry was taken from it.
  It reports 16/16 references verified with a 0.0 confabulation rate, and
  `just preflight-dr` returns WARN only because CD4 is mentioned 17 times
  against SASH3's 67 — CD4 here is the lymphopenic cell population, not a rival
  disease gene, and the report's OMIM (301082) matches MONDO's. The cross-check
  changed nothing about the phenotype list or the causal chain, both of which it
  reproduces independently. Two things came out of it: splenectomy was promoted
  to its own treatment, and the two cohort-level PMID:40510848 items were marked
  directness: INDIRECT. Its Xq26.1 band and its Orphanet prevalence class were
  both declined as unverifiable here, for the reasons given above.

    evidence_source: MODEL_ORGANISM
    snippet: Consistent with the loss of MZ B cells, the production of antigen-specific IgM antibodies following immunization with pneumococcal polysaccharides was severely impaired in Sly1(d/d) mice.
    explanation: The mouse counterpart of the poor polysaccharide vaccine response reported in the adult patient with a common-variable-immunodeficiency-like presentation.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we identified 3 novel SASH3 deleterious variants in 4 unrelated male patients with a history of combined immunodeficiency and immune dysregulation that manifested as recurrent sinopulmonary, cutaneous, and mucosal infections and refractory autoimmune cytopenias.
    explanation: Refractory autoimmune cytopenias in the index cohort, alongside the infectious picture.
  - reference: PMID:37646304
    reference_title: Evans syndrome caused by a deleterious mutation affecting the adaptor protein SASH3.

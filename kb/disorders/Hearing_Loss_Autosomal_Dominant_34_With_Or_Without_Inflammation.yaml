    Hearing loss segregates alone. Family LMG113 carried p.Arg918Gln across four
    generations with no other target-organ manifestation of CAPS, which is what
    makes DFNA34 a nonsyndromic deafness locus rather than a CAPS variant.
  evidence:
  - reference: PMID:28847925
    reference_title: "NLRP3 mutation and cochlear autoinflammation cause syndromic and nonsyndromic hearing loss DFNA34 responsive to anakinra therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

diagnosis:
- name: Audiologic evaluation with speech recognition testing
  description: >-
    Pure-tone audiometry establishes the sensorineural loss and its
    high-frequency-weighted shape; speech recognition scoring is what localises
    it. Scores disproportionately good for the pure-tone thresholds point to a
    cochlear rather than a retrocochlear lesion, which is the distinction that
    puts DFNA34 on the differential at all.
  markers: Pure-tone thresholds; speech recognition score
  evidence:
  - reference: PMID:29342053
    reference_title: "Gradual Symmetric Progression of DFNA34 Hearing Loss Caused by an NLRP3 Mutation and Cochlear Autoinflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Speech recognition scores ranging from 60 to 100% were consistent with cochlear, but not retrocochlear, etiology."
    explanation: The measurement and the inference it licenses, in the DFNA34 families themselves.
- name: Post-contrast MRI-FLAIR of the cochlea
  description: >-
    Cochlear enhancement on post-contrast FLAIR is the imaging correlate of
    blood-labyrinth barrier breakdown, and is the one test that shows the
    autoinflammatory mechanism rather than its consequence. It is also
    prognostic here: baseline enhancement is among the features associated with
    anakinra response, so it informs treatment and not only diagnosis. Note the
    enhancement in DFNA34 is milder than in NOMID or Muckle-Wells, so its
    absence does not exclude the diagnosis.
  markers: Cochlear signal on post-contrast MRI-FLAIR
  evidence:
  - reference: PMID:29342053
    reference_title: "Gradual Symmetric Progression of DFNA34 Hearing Loss Caused by an NLRP3 Mutation and Cochlear Autoinflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "On post-contrast MRI-FLAIR, pathologic enhancement of the cochlea was identified in an affected individual, similar to but less severe than that observed in the patients with NOMID or MWS."
    explanation: Reports both the finding and the degree, which is what makes a negative study uninformative rather than exclusionary.
- name: NLRP3 sequencing
  description: >-
    Molecular confirmation. Both originally reported families carry
    p.Arg918Gln (c.2753G>A); a second pedigree carries a different NLRP3
    variant, so a variant-specific assay is not sufficient and the gene has to
    be sequenced.
  evidence:
  - reference: PMID:28847925
    reference_title: "NLRP3 mutation and cochlear autoinflammation cause syndromic and nonsyndromic hearing loss DFNA34 responsive to anakinra therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here, we show that a missense mutation, p.Arg918Gln (c.2753G > A), of NLRP3 causes autosomal-dominant sensorineural hearing loss in two unrelated families."
    explanation: The recurrent allele in the two defining families, which is what a sequencing result is compared against.
- name: Monocyte IL-1 beta secretion assay
  description: >-
    Functional confirmation that a candidate NLRP3 variant is activating.
    Patient monocytes stimulated with LPS alone secrete IL-1 beta where control
    monocytes secrete none, because the variant removes the requirement for a
    second activating signal. This is what established the second DFNA34
    pedigree's novel variant as pathogenic, and it is the assay to reach for
    when sequencing returns a variant of uncertain significance.
  markers: IL-1 beta in monocyte culture supernatant after LPS priming
  evidence:
  - reference: PMID:35572943
    reference_title: "Auditory and Vestibular Characteristics of NLRP3 Inflammasome Related Autoinflammatory Disorders: Monogenic Hearing Loss Can Be Improved by Anti-interleukin-1 Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "monocytes from three affected individuals were cultured with lipopolysaccharide and the cells secreted high levels of IL-1β compared with non-detectable levels of IL-1β secreted by healthy control monocytes."
    explanation: The assay and its result in affected individuals, against a control secreting none.

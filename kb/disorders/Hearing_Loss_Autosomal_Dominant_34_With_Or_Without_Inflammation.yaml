name: Hearing Loss Autosomal Dominant 34 With or Without Inflammation
creation_date: "2026-09-15T00:00:00Z"
category: Mendelian
synonyms:
- DFNA34
- NLRP3-related autoinflammatory sensorineural hearing loss
- autosomal dominant deafness 34
- cochlea-restricted NLRP3-associated autoinflammatory disease
disease_term:
  preferred_term: hearing loss, autosomal dominant 34, with or without inflammation
  term:
    id: MONDO:0033261
    label: hearing loss, autosomal dominant 34, with or without inflammation
parents:
- Autosomal Dominant Nonsyndromic Hearing Loss
- Autoinflammatory Syndrome
description: >-
  DFNA34 is autosomal dominant, postlingual, slowly progressive bilateral
  sensorineural hearing loss caused by gain-of-function variants in NLRP3, the
  sensor of the NLRP3 inflammasome. It is the entity that established the
  cochlea as a site where innate immunity alone can cause deafness: the
  p.Arg918Gln variant was found in two unrelated families, one in which hearing
  loss came with autoinflammatory signs and one in which it segregated with no
  other target-organ manifestation at all, and the same work showed the NLRP3
  inflammasome can be activated in resident macrophage/monocyte-like cells of
  the mouse cochlea with secretion of IL-1 beta.

  The mechanism is therefore local rather than systemic. Mutant NLRP3 lowers the
  assembly threshold of the inflammasome in cochlea-resident macrophages;
  caspase-1 matures pro-IL-1 beta; local IL-1 beta disrupts the blood-labyrinth
  barrier and recruits further macrophages; and sustained cochlear
  autoinflammation injures the sensory epithelium. The intermediate steps are
  visible clinically as pathologic cochlear enhancement on post-contrast
  MRI-FLAIR, and experimentally as blood-labyrinth barrier disruption and
  macrophage infiltration in NLRP3-mutant mice.

  Two things make the entry worth curating separately from the CAPS entries
  driven by the same gene. First, the hearing loss can be the whole disease:
  family LMG113 had no systemic phenotype. Second, it is treatable - IL-1
  blockade improved or reversed hearing loss in affected individuals, which is
  rare for a genetic sensorineural hearing loss, and the mouse work shows the
  same effect for both an IL-1 receptor antagonist and the NLRP3-specific
  inhibitor MCC950. The therapeutic window is narrow: response tracks with
  younger age and better baseline thresholds.

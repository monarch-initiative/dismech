  relationship_type: CAUSATIVE
  notes: >-
    Encodes the inflammasome sensor cryopyrin. p.Arg918Gln (c.2753G>A) is the
    variant in both originally reported DFNA34 families; a second pedigree with
    a different NLRP3 variant was subsequently reported with in vitro support.
  evidence:
  - reference: PMID:28847925
    reference_title: "NLRP3 mutation and cochlear autoinflammation cause syndromic and nonsyndromic hearing loss DFNA34 responsive to anakinra therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that a missense mutation, p.Arg918Gln (c.2753G > A), of NLRP3 causes autosomal-dominant sensorineural hearing loss in two unrelated families."
    explanation: Establishes NLRP3 as the causative gene.
  - reference: PMID:33020839
    reference_title: "Otological aspects of NLRP3-related autoinflammatory disorder focusing on the responsiveness to anakinra."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified the second DNFA34 pedigree worldwide with a novel NLRP3 variant supported by in vitro analysis."
    explanation: Independent second pedigree with a different NLRP3 variant, with functional support. The source spells the locus "DNFA34"; the snippet is quoted as printed.
inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous NLRP3 variants segregating with hearing loss over four
    generations in the index family, with age-dependent penetrance - three
    carriers aged 16 to 32 had normal thresholds.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29342053
    reference_title: "Gradual Symmetric Progression of DFNA34 Hearing Loss Caused by an NLRP3 Mutation and Cochlear Autoinflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three subjects (16, 22, and 32 yr old) had normal hearing thresholds."
    explanation: Unaffected young carriers document the age-dependent penetrance of the dominant allele.
treatments:
- name: Anakinra
  description: >-
    Recombinant IL-1 receptor antagonist. This is the treatment that makes the
    entry unusual: hearing loss was reversed or improved in affected members of
    the syndromic family, and improvement against natural course was seen in
    three probands in an independent cohort. Response is not universal - a
    baseline threshold worse than 60 dB and cochlear enhancement on MRI both
    track with poor audiologic response even when systemic symptoms settle.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: Local Cochlear IL-1 beta Secretion
    description: >-
      Blocks signalling by the IL-1 beta that the activated cochlear
      inflammasome secretes, rather than the inflammasome itself.
    evidence:
    - reference: PMID:33020839
      reference_title: "Otological aspects of NLRP3-related autoinflammatory disorder focusing on the responsiveness to anakinra."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Significant improvement of hearing status against the natural course, showing response to anakinra, was identified in three probands, one of whom used to have severe SNHL."
      explanation: Clinical response to IL-1 receptor blockade is the therapeutic test of this mechanism node.
  evidence:
  - reference: PMID:28847925
    reference_title: "NLRP3 mutation and cochlear autoinflammation cause syndromic and nonsyndromic hearing loss DFNA34 responsive to anakinra therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family LMG446, hearing loss is accompanied by autoinflammatory signs and symptoms without serologic evidence of inflammation as part of an atypical CAPS phenotype and was reversed or improved by IL-1β blockade therapy."
    explanation: Reports reversal or improvement of hearing loss under IL-1 blockade.
  - reference: PMID:35572943
    reference_title: "Auditory and Vestibular Characteristics of NLRP3 Inflammasome Related Autoinflammatory Disorders: Monogenic Hearing Loss Can Be Improved by Anti-interleukin-1 Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, it should be noted that there is a window of opportunity to respond to treatment, and younger patients are most likely to respond."
    explanation: Qualifies the treatment claim with the therapeutic window; recorded so the entry does not overstate responsiveness.
  notes: >-
    Anakinra is a recombinant form of the endogenous IL-1 receptor antagonist,
    so it is recorded as PROTEIN_REPLACEMENT under the therapeutic-modality
    vocabulary; clinically it is used as a receptor blocker rather than to
    correct a deficiency.
- name: Cochlear Implantation
  description: >-
    For hearing loss too advanced to respond to IL-1 blockade. The theoretical
    concern was that ubiquitous resident macrophages involving the spiral
    ganglion and cochlear nerve would predict poor outcomes; the reported
    outcomes were good.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: PMID:33156237
    reference_title: "Outcome of Cochlear Implantation in NLRP3-related Autoinflammatory Inner Ear Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three subjects showed excellent audiological outcomes with rapid improvement of speech perception test result reaching plateau at 3 months after CI, although distribution of the disease predicted poor outcome based on theoretical analysis."
    explanation: Reports outcomes after implantation in NLRP3-related disease, one of the three subjects having DFNA34.
animal_models:
- name: Cochlear macrophage-restricted Nlrp3 D301N mouse (CX3CR1-driven)
  species: Mouse
  genotype: Conditional Nlrp3 D301N expression in CX3CR1-positive cochlea-resident macrophages
  publication: PMID:35870427
  description: >-
    Puts the CAPS-associated mutation only in the cell population this entry
    says matters, then challenges it with systemic LPS. It is the cleanest
    available test that a cochlear macrophage inflammasome is sufficient to
    mediate hearing loss.
  modeled_mechanisms:
  - target: Blood-Labyrinth Barrier Disruption and Macrophage Infiltration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces barrier disruption, macrophage infiltration and cochlear
      inflammasome activation, and shows the dependence on NLRP3.
    limitations: >-
      The phenotype requires an LPS challenge rather than arising
      spontaneously, and the allele is D301N (a NOMID/CINCA-associated variant),
      not the p.Arg918Gln of the human DFNA34 families. Whether the human
      variant behaves the same without a systemic trigger is untested.
    readouts:
    - name: Blood-labyrinth barrier integrity after repetitive low-dose LPS
      target: Blood-Labyrinth Barrier Disruption and Macrophage Infiltration
      direction: DECREASED
      interpretation: Barrier permeability rises and macrophages enter the cochlea, in an NLRP3-dependent manner.
      evidence:
      - reference: PMID:35870427
        reference_title: "Therapeutic effect of NLRP3 inhibition on hearing loss induced by systemic inflammation in a CAPS-associated mouse model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Peripheral inflammation induced by a repetitive low dose of LPS injection caused a blood-labyrinth barrier disruption, macrophage infiltration into cochlea and cochlear inflammasome activation in an NLRP3-dependent manner."
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:35870427
      reference_title: "Therapeutic effect of NLRP3 inhibition on hearing loss induced by systemic inflammation in a CAPS-associated mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated a mice with conditional expression of CAPS-associated NLRP3 mutant (D301N) in cochlea-resident CX3CR1 macrophages and examined the susceptibility of CAPS mice to inflammation-mediated hearing loss in a local and systemic inflammation context."
      explanation: Describes the model construction, establishing that it targets the cell population this node is about.
  - target: Local Cochlear IL-1 beta Secretion
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Both an IL-1 receptor antagonist and the NLRP3-specific inhibitor MCC950
      alleviate the LPS-induced hearing loss, which is the pharmacological test
      of the IL-1 step.
    limitations: >-
      Rescue is demonstrated against an LPS-provoked phenotype, not against the
      slow spontaneous course seen in human DFNA34.
    evidence:
    - reference: PMID:35870427
      reference_title: "Therapeutic effect of NLRP3 inhibition on hearing loss induced by systemic inflammation in a CAPS-associated mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, NLRP3-specific inhibitor, MCC950, as well as an interleukin-1 receptor antagonist significantly alleviated systemic LPS-induced hearing loss and inflammatory phenotypes in NLRP3 mutant mice."
      explanation: Reports the rescue on which this link rests.
- name: Nlrp3 D301NneoR/+; Gfi1 Cre/+ mouse
  species: Mouse
  genotype: Nlrp3 D301NneoR/+; Gfi1 Cre/+
  publication: PMID:35812087
  description: >-
    Conditional mutant Nlrp3 activation in the cochlea and hematopoietic cells.
    Earlier mutant Nlrp3 animals died before hearing could be tested, so this is
    the first model in which Nlrp3-driven hearing loss is quantifiable.
  modeled_mechanisms:
  - target: Progressive Cochlear Sensory Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Gives severe to profound hearing loss with a disorganized organ of Corti,
      confirming that Nlrp3 alteration alone can damage the cochlea.
    limitations: >-
      The course is wrong in every temporal respect: severe loss by postnatal
      day 20 against adult onset in humans, limited life expectancy, and a
      cochlear abnormality that resolves by P15 and so reads as a developmental
      lag rather than the progressive inflammatory injury of human DFNA34. The
      allele is again D301N rather than p.Arg918Gln.
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The human disease is slowly progressive over decades from an adult
        onset. This model shows severe to profound loss by P20 with a transient
        cochlear disorganization that normalizes by P15, so the window it
        observes is early development rather than the chronic course the node
        describes.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mutant allele expressed is Nlrp3 D301N, the mouse counterpart of a
        NOMID-associated human variant, not the p.Arg918Gln allele that causes
        DFNA34. Severity across NLRP3 alleles is not interchangeable.
    readouts:
    - name: Auditory brainstem response thresholds at P20
      target: Progressive Cochlear Sensory Injury
      direction: DECREASED
      interpretation: Severe to profound hearing loss, establishing that the cochlear lesion is functionally significant.
      evidence:
      - reference: PMID:35812087
        reference_title: "Auditory Phenotype and Histopathologic Findings of a Mutant Nlrp3 Expression Mouse Model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "ABR recordings of Nlrp3 D301NneoR/+; Gfi1 Cre/+ mice, albeit with limited life expectancy, exhibited severe to profound hearing loss at postnatal day 20 (P20)."
        explanation: Reports the ABR measurement behind this readout.
    evidence:
    - reference: PMID:35812087
      reference_title: "Auditory Phenotype and Histopathologic Findings of a Mutant Nlrp3 Expression Mouse Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This morphologic feature gradually returned to normal by P15."
      explanation: Recorded as part of the model's evidence because it is the observation that limits how far this model can stand in for chronic human cochlear injury.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two unrelated North American families in the original report, and a second
    pedigree reported subsequently from a Korean cohort of 17 NLRP3-related
    families. No population-level estimate exists.
  evidence:
  - reference: PMID:33020839
    reference_title: "Otological aspects of NLRP3-related autoinflammatory disorder focusing on the responsiveness to anakinra."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified the second DNFA34 pedigree worldwide with a novel NLRP3 variant supported by in vitro analysis."
    explanation: A 2021 report describing its pedigree as only the second worldwide bounds how few cases are on record.
differential_diagnoses:
- name: Muckle-Wells Syndrome
  description: >-
    The same gene and the same cochlear mechanism, but with systemic
    autoinflammation and serologic evidence of inflammation. The dividing line
    is clinical, and in the syndromic DFNA34 family it is thin.
- name: Autosomal Dominant Nonsyndromic Hearing Loss
  description: >-
    Several DFNA loci give adult-onset, high-frequency, slowly progressive
    sensorineural loss at a similar rate - DFNA2 (KCNQ4), DFNA9 (COCH),
    DFNA15 (POU4F3). Audiometry alone does not separate them from DFNA34, which
    matters because only DFNA34 has a drug.
review_notes: >-
  Lump/split: curated as a Disease entry rather than as a subtype of the CAPS
  entries, on the grounds that the pathograph differs, not merely the severity.
  In DFNA34 the inflammasome lesion is expressed by cochlea-resident
  macrophages and the systemic branch may be entirely absent (family LMG113),
  which is a different chain from Muckle-Wells syndrome rather than a mild end
  of it. MONDO and OMIM also keep the concept separate (MONDO:0033261,
  OMIM 617772). The counter-argument - that MONDO is splitting one NLRP3
  continuum and DFNA34 is its cochlea-limited expression - is real, and the
  syndromic subtype curated here is exactly where the two views touch. Recorded
  here so a future reviewer inherits the argument rather than the conclusion.

  Not curated: vestibular involvement, which the review literature discusses
  for the NLRP3 spectrum but does not separate out for DFNA34; and cochlear
  histopathology in humans, which does not exist because inner-ear tissue is
  not available for biopsy.

  Two points from review are recorded rather than acted on. The node
  "Blood-Labyrinth Barrier Disruption and Macrophage Infiltration" names two
  coupled events and would be more atomic if split; it is left whole because
  the cited mouse work reports barrier breakdown and macrophage infiltration as
  one NLRP3-dependent observation in one experiment, so splitting would create
  a second node whose evidence is the same sentence.

  And anakinra's therapeutic_modality is OTHER rather than PROTEIN_REPLACEMENT.
  The KB is split on this: the three sibling NLRP3 entries
  (Familial_Cold_Autoinflammatory_Syndrome, Muckle-Wells_Syndrome,
  Periodic_Fever_Immunodeficiency_and_Thrombocytopenia_Syndrome) use OTHER,
  while Mevalonate_Kinase_Deficiency and Pericarditis use PROTEIN_REPLACEMENT
  for the same drug. This entry follows its own family. The split is worth
  resolving repo-wide, since anakinra is a recombinant form of a natural
  antagonist given at antagonist doses and neither value is obviously right.

  The human evidence for the gain-of-function step is peripheral, not cochlear.
  Monocyte IL-1 beta secretion is measured in blood; the cochlear compartment
  of the same step is shown only in mouse. The IL-1 beta node states that
  inference explicitly rather than letting the two sit next to each other, and
  the monocyte assay is curated under diagnosis as the functional test for a
  variant of uncertain significance.

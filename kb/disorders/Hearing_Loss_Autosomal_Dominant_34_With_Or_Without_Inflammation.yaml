pathophysiology:
- name: NLRP3 Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant in NLRP3 - p.Arg918Gln (c.2753G>A) in the
    leucine-rich repeat domain in both originally reported families - lowers the
    activation threshold of the NLRP3 sensor. The same class of variant causes
    the cryopyrin-associated periodic syndromes; what distinguishes DFNA34 is
    which tissue manifests the consequence, not the nature of the lesion.
  gene:
    preferred_term: NLRP3
    term:
      id: hgnc:16400
      label: NLRP3
  genetic_context:
    gene:
      preferred_term: NLRP3
      term:
        id: hgnc:16400
        label: NLRP3
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  downstream:
  - target: Constitutive Inflammasome Assembly in Cochlear Macrophages
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28847925
      reference_title: "NLRP3 mutation and cochlear autoinflammation cause syndromic and nonsyndromic hearing loss DFNA34 responsive to anakinra therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Gain-of-function mutations of NLRP3 result in abnormal activation of the NLRP3 inflammasome, and cause the autosomal dominant systemic autoinflammatory disease spectrum, termed cryopyrin-associated periodic syndromes (CAPS)."
      explanation: States the causal step from a gain-of-function NLRP3 variant to abnormal inflammasome activation, which is the edge being asserted here.
  evidence:
  - reference: PMID:28847925
    reference_title: "NLRP3 mutation and cochlear autoinflammation cause syndromic and nonsyndromic hearing loss DFNA34 responsive to anakinra therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that a missense mutation, p.Arg918Gln (c.2753G > A), of NLRP3 causes autosomal-dominant sensorineural hearing loss in two unrelated families."
    explanation: Establishes the specific NLRP3 variant as the cause of autosomal dominant sensorineural hearing loss in the two index families.
- name: Constitutive Inflammasome Assembly in Cochlear Macrophages
  biological_scale: CELLULAR
  description: >-
    Mutant NLRP3 oligomerizes and recruits ASC and pro-caspase-1 with a reduced
    requirement for a second activating signal. The cells that matter for this
    entry are the macrophage/monocyte-like cells resident in the cochlea, which
    express NLRP3 and carry a functional inflammasome; this was the observation
    that made a cochlea-only phenotype mechanistically coherent rather than
    merely an odd CAPS variant.
  cell_types:
  - preferred_term: cochlea-resident macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Monocyte
    term:
      id: CL:0000576
      label: monocyte
  locations:
  - preferred_term: Cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  downstream:
  - target: Local Cochlear IL-1 beta Secretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28847925
      reference_title: "NLRP3 mutation and cochlear autoinflammation cause syndromic and nonsyndromic hearing loss DFNA34 responsive to anakinra therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The NLRP3 inflammasome can indeed be activated in resident macrophage/monocyte-like cells in the mouse cochlea, resulting in secretion of IL-1β."
      explanation: Directly reports inflammasome activation in cochlear resident macrophages producing IL-1 beta, which is this edge.
  - target: Systemic Autoinflammatory Activation
    causal_link_type: DIRECT
    description: >-
      The branch that is present in some carriers and absent in others. It is
      the same molecular lesion acting outside the cochlea.
  evidence:
  - reference: PMID:32194497
    reference_title: "Genetic Hearing Loss Associated With Autoinflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "The inflammasome can indeed be activated in macrophage/monocyte-like cells of the mouse cochlea, with secretion of IL-1β."

    explanation: Supports the existence of a functional, activatable NLRP3 inflammasome in cochlear macrophage-like cells.
- name: Local Cochlear IL-1 beta Secretion
  biological_scale: CELLULAR
  description: >-
    Active caspase-1 cleaves pro-IL-1 beta to mature IL-1 beta, which is
    secreted into the cochlear microenvironment. The human evidence that the
    variant is functionally activating is peripheral rather than cochlear:
    monocytes from affected individuals secrete IL-1 beta on priming alone,
    where control monocytes secrete none and require a second signal. The
    cochlear compartment of the same step is shown only in mouse, so the
    inference this node makes is that the cell-autonomous defect measured in
    blood monocytes is the same one operating in cochlea-resident macrophages.
  cell_types:
  - preferred_term: cochlea-resident macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: positive regulation of interleukin-1 beta production
    term:
      id: GO:0032731
      label: positive regulation of interleukin-1 beta production
    modifier: INCREASED
  downstream:
  - target: Blood-Labyrinth Barrier Disruption and Macrophage Infiltration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35870427
      reference_title: "Therapeutic effect of NLRP3 inhibition on hearing loss induced by systemic inflammation in a CAPS-associated mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Peripheral inflammation induced by a repetitive low dose of LPS injection caused a blood-labyrinth barrier disruption, macrophage infiltration into cochlea and cochlear inflammasome activation in an NLRP3-dependent manner."
      explanation: Ties inflammasome activation to barrier disruption and macrophage infiltration, and shows the link is NLRP3-dependent.
  evidence:
  - reference: PMID:35572943
    reference_title: "Auditory and Vestibular Characteristics of NLRP3 Inflammasome Related Autoinflammatory Disorders: Monogenic Hearing Loss Can Be Improved by Anti-interleukin-1 Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "NLRP3 variants cause CAPS and DFNA34 by constitutively activating the NLRP3 inflammasome and increasing IL-1β release."
    explanation: States increased IL-1 beta release as the shared consequence of the NLRP3 variants that cause DFNA34.
  - reference: PMID:35572943
    reference_title: "Auditory and Vestibular Characteristics of NLRP3 Inflammasome Related Autoinflammatory Disorders: Monogenic Hearing Loss Can Be Improved by Anti-interleukin-1 Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "monocytes from three affected individuals were cultured with lipopolysaccharide and the cells secreted high levels of IL-1β compared with non-detectable levels of IL-1β secreted by healthy control monocytes."
    explanation: The human functional measurement behind this node - patient monocytes secrete IL-1 beta where control monocytes secrete none - which is what makes the gain-of-function call a human observation rather than an inference from the mouse.
  - reference: PMID:35572943
    reference_title: "Auditory and Vestibular Characteristics of NLRP3 Inflammasome Related Autoinflammatory Disorders: Monogenic Hearing Loss Can Be Improved by Anti-interleukin-1 Therapy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Monocytes from patients with CAPS only require an initial priming signal to induce IL-1β secretion, whereas wild-type control cells require a second activating signal (25)."
    explanation: Gives the mechanistic form of the same result - the variant removes the requirement for a second signal - which is what "constitutively activating" means at this step.
- name: Blood-Labyrinth Barrier Disruption and Macrophage Infiltration
  biological_scale: TISSUE
  description: >-
    IL-1 beta and downstream mediators increase permeability of the
    blood-labyrinth barrier, admitting circulating macrophages into cochlear
    tissue. In DFNA34 patients this is seen indirectly as pathologic enhancement
    of the cochlea on post-contrast MRI-FLAIR; in NLRP3-mutant mice it is
    measured directly, and both resident and infiltrating macrophages contribute
    to the resulting hearing loss.
  cell_types:
  - preferred_term: infiltrating macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: Membranous labyrinth
    term:
      id: UBERON:0001849
      label: membranous labyrinth
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Progressive Cochlear Sensory Injury
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35870427
    reference_title: "Therapeutic effect of NLRP3 inhibition on hearing loss induced by systemic inflammation in a CAPS-associated mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, both cochlea-infiltrating and -resident macrophages contribute to peripheral inflammation-mediated hearing loss of CAPS mice."
    explanation: Attributes the hearing loss to both macrophage populations, supporting infiltration as a mechanistically active step rather than a bystander finding.
  - reference: PMID:29342053
    reference_title: "Gradual Symmetric Progression of DFNA34 Hearing Loss Caused by an NLRP3 Mutation and Cochlear Autoinflammation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "On post-contrast MRI-FLAIR, pathologic enhancement of the cochlea was identified in an affected individual, similar to but less severe than that observed in the patients with NOMID or MWS."
    explanation: Cochlear enhancement is the imaging correlate of barrier breakdown; it evidences the node by inference from contrast behaviour rather than by direct measurement of the barrier.
- name: Systemic Autoinflammatory Activation
  biological_scale: ORGANISM
  description: >-
    The extracochlear branch, present in family LMG446 and absent in LMG113.
    Its variability at a single genotype is the unexplained part of the entry:
    the same p.Arg918Gln allele produced an atypical CAPS phenotype in one
    kindred and isolated hearing loss in the other.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Recurrent Fever
  - target: Urticaria
  - target: Arthralgia
  evidence:
  - reference: PMID:28847925
    reference_title: "NLRP3 mutation and cochlear autoinflammation cause syndromic and nonsyndromic hearing loss DFNA34 responsive to anakinra therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family LMG446, hearing loss is accompanied by autoinflammatory signs and symptoms without serologic evidence of inflammation as part of an atypical CAPS phenotype and was reversed or improved by IL-1β blockade therapy."
    explanation: Documents the systemic branch in one of the two index families, including its dissociation from serologic inflammatory markers.
- name: Progressive Cochlear Sensory Injury
  biological_scale: TISSUE
  description: >-
    Sustained cochlear autoinflammation injures the sensory epithelium of the
    organ of Corti and its supporting structures, producing bilateral
    high-frequency-predominant loss that extends to lower frequencies with age.
    Human cochlear histopathology is unavailable, so the cellular detail is
    supplied by mouse models: conditional mutant Nlrp3 expression yields severe
    hearing loss with a disorganized organ of Corti.
  locations:
  - preferred_term: Organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  cell_types:
  - preferred_term: Auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  downstream:
  - target: Progressive Sensorineural Hearing Loss
  - target: High-Frequency Hearing Impairment
  - target: Bilateral Symmetric Hearing Loss
  evidence:
  - reference: PMID:35812087
    reference_title: "Auditory Phenotype and Histopathologic Findings of a Mutant Nlrp3 Expression Mouse Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The hematoxylin-eosin sections of Nlrp3 D301NneoR/+; Gfi1 Cre/+ mice cochleae at P12 exhibited a disorganized organ of Corti between the outer hair cells/supporting Deiters' cells and basilar membrane compared with the normal phenotype mice, leading to a collapsed Nuel's space."
    explanation: Direct histopathologic evidence that altered Nlrp3 disorganizes the organ of Corti, the structural correlate of this node.
  - reference: PMID:29342053
    reference_title: "Gradual Symmetric Progression of DFNA34 Hearing Loss Caused by an NLRP3 Mutation and Cochlear Autoinflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Speech recognition scores ranging from 60 to 100% were consistent with cochlear, but not retrocochlear, etiology."
    explanation: Localizes the lesion to the cochlea rather than the auditory nerve or central pathway, which is what this node asserts.

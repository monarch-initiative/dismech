phenotypes:
- name: Visual impairment
  description: >
    Progressive visual loss is often the presenting feature of classic CLN3
    and is also documented in juvenile CLN1, CLN5, CLN7, and CLN10. Its timing
    is not uniform across the genetically heterogeneous umbrella, and early
    visual loss is not required in CLN8 EPMR.
  phenotype_term:
    preferred_term: Visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      He described a juvenile-onset disorder with blindness and progressive
      dementia.
    explanation: The historical juvenile NCL description establishes visual loss as a defining feature.
- name: Cognitive impairment
  description: >
    Cognitive slowing and decline are central juvenile NCL manifestations,
    although they follow vision loss in classic CLN3 and may precede it in
    juvenile CLN1.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:

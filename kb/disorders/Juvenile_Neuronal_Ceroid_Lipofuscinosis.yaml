genetic:
- name: CLN3
  association: Causative
  gene_term:
    preferred_term: CLN3
    term:
      id: hgnc:2074
      label: CLN3
  notes: >
    Biallelic CLN3 variants cause classic juvenile NCL (Batten / Spielmeyer-Vogt
    disease), by far the most common genetic cause of the juvenile-onset form. A
    recurrent ~1.02-kb intragenic deletion is the most frequent CLN3 allele.
    CLN3 encodes a lysosomal transmembrane protein. Juvenile onset can less
    commonly arise from variants in other CLN genes, making JNCL a genetically
    heterogeneous, onset-defined entity.
  evidence:
  - reference: PMID:26486417
    reference_title: "Novel morphological macular findings in juvenile CLN3 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile CLN3 disease, one of the most common forms of a group of lysosomal storage diseases called neuronal ceroid lipofuscinoses (NCLs), is a progressive neurodegenerative disorder with initial visual deterioration."
    explanation: Establishes CLN3 disease as the common juvenile form of the NCLs.
  - reference: PMID:26026925
    reference_title: "Genetics of the neuronal ceroid lipofuscinoses (Batten disease)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than a dozen genes containing over 430 mutations underlying human NCLs have been identified."
    explanation: Documents the genetic heterogeneity underlying the NCLs, of which juvenile onset is one presentation.
  - reference: PMID:26026925
    reference_title: "Genetics of the neuronal ceroid lipofuscinoses (Batten disease)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "many transmembrane proteins with different subcellular locations (CLN3, CLN6, CLN7, CLN8, CLN12)"
    explanation: Identifies CLN3 as encoding a transmembrane protein among the NCL genes.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Juvenile NCL, including the classic CLN3 form, is inherited in an autosomal
    recessive manner; affected individuals carry biallelic pathogenic variants.
  evidence:
  - reference: PMID:26026925
    reference_title: "Genetics of the neuronal ceroid lipofuscinoses (Batten disease)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "disease usually begins in childhood, and most types are inherited in an autosomal recessive manner."
    explanation: Documents childhood onset and autosomal recessive inheritance for most NCL types.
treatments:
- name: Antiseizure Management
  description: >
    Anticonvulsant therapy for the epilepsy of juvenile NCL. Seizures are managed
    symptomatically as part of supportive care.
  treatment_term:
    preferred_term: Anticonvulsant agent therapy
    term:
      id: MAXO:0000167
      label: anticonvulsant agent therapy
- name: Multidisciplinary Supportive Care
  description: >
    There is no curative therapy for CLN3-associated juvenile NCL. Management is
    supportive and symptomatic, addressing vision loss, epilepsy, motor and
    cognitive decline, and progressive disability across a multidisciplinary team.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >
    Counseling for families regarding autosomal recessive inheritance, carrier
    testing, and reproductive options once the familial CLN gene variants are known.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

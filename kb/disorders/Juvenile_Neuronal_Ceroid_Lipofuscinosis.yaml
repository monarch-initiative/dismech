      We present a family with typical NCL pathology in which we performed exome
      sequencing and identified a single homozygous mutation in ATP13A2 that
      fully segregates with disease within the family.
    explanation: >
      The founding CLN12 family links recessive ATP13A2 directly to NCL
      pathology; the juvenile onset is supplied independently by the
      classification table.
classifications:
  lysosomal_storage_category:
    classification_value: neuronal ceroid lipofuscinosis
    notes: >
      The entry is an onset-defined neuronal ceroid lipofuscinosis umbrella
      with the same lysosomal ceroid-lipofuscin storage criterion as its
      genotype-specific members.
  icimd_category:
  - classification_value: neuronal_ceroid_lipofuscinosis
    notes: >
      ICIMD places the neuronal ceroid lipofuscinoses among disorders of
      complex-molecule degradation. This classification describes the shared
      disease family and does not collapse the supported juvenile genotypes.
notes: >
  Entity boundary. MONDO:0019262 describes a genetically heterogeneous group
  and carries an editor note that it is kept separate from CLN3 disease because
  it groups different CLNs. The current KB already models the same ontology
  altitude for adult NCL at MONDO:0019260. This record therefore mirrors that
  onset-grouping precedent and does not replace
  `Neuronal_Ceroid_Lipofuscinosis_3.yaml` (MONDO:0008767).

  Subtype guardrail. CLN2, CLN7, and CLN8 are not listed here. Although their
  onset ranges can overlap school age in individual reports, the 2022
  childhood-NCL classification used for this curation places them under
  classical or variant late-infantile disease rather than under its juvenile
  rows. The issue required each juvenile-onset genotype to be sourced
  independently and directed curators to drop unsupported candidates; this
  entry follows that conservative rule.

  Deep-research provenance. A sanctioned `claude_code` run on 2026-08-08
  (1,217 seconds, 11 web searches, 49 citations) was explicitly prompted for
  the genetically heterogeneous MONDO:0019262 entity and its distinction from
  MONDO:0008767. The automated named-entity preflight returned SKIP because
  this onset grouping has no single MONDO causal gene; manual review confirmed
  that the report remained anchored to MONDO:0019262 and assessed each
  candidate genotype separately. An earlier run that re-anchored the target to
  CLN3 disease failed that manual entity check and was discarded wholesale.
  Every PMID and evidence snippet used in this entry was then independently
  fetched and verified against the generated reference cache.

    supports: SUPPORT
    evidence_source: OTHER
    snippet: "With the exception of CLN4 disease, all CLNs are recessive disorders."
    explanation: >
      The only dominant exception is the adult CLN4 branch; every juvenile
      genotype represented here is therefore recessive.

- name: CLN12 disease, late juvenile onset
  description: >
    The ATP13A2/CLN12 juvenile NCL presentation begins in adolescence and is
    dominated at onset by rigidity and hypokinesia. It overlaps genetically
    with ATP13A2-related parkinsonism but is included here only at the
    NCL-pathology/onset altitude documented by the classification source.
  genes:
  - preferred_term: ATP13A2
    term:
      id: hgnc:30213
      label: ATP13A2
  evidence:
  - reference: PMID:35359645
    reference_title: "Neuronal Ceroid Lipofuscinosis: The Multifaceted Approach to the Clinical Issues, an Overview."

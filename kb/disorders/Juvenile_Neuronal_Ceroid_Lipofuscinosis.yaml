    label: juvenile neuronal ceroid lipofuscinosis
description: >
  Juvenile neuronal ceroid lipofuscinosis (JNCL; also Batten disease,
  Spielmeyer-Vogt disease) is the juvenile-onset form of the neuronal ceroid
  lipofuscinoses (NCLs), a group of inherited lysosomal storage diseases unified
  by the intraneuronal accumulation of autofluorescent ceroid-lipofuscin storage
  material. It is an onset-defined, genetically heterogeneous clinical entity:
  disease typically begins at early school age with progressive vision loss due
  to retinal degeneration, followed by seizures and the decline of cognitive and
  motor capacities, and ultimately premature death. The classic and by far most
  common cause is biallelic variants in CLN3 (the Batten disease / Spielmeyer-Vogt
  branch), although juvenile onset also occurs with variants in other CLN genes.
  This entry models the onset-defined clinical syndrome (MONDO:0019262) that sits
  above the gene-specific dismech entries; the CLN3-specific molecular entry is
  curated separately as Neuronal Ceroid Lipofuscinosis 3 (MONDO:0008767), and the
  broader class as the Neuronal Ceroid Lipofuscinoses grouping.
pathophysiology:
- name: Lysosomal Ceroid-Lipofuscin Accumulation
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  description: >
    Loss of function of the causative NCL gene (CLN3 in classic JNCL, or another
    CLN gene) impairs lysosomal turnover, causing the progressive intralysosomal
    accumulation of undegraded autofluorescent ceroid-lipofuscin storage material
    within neurons and other post-mitotic cells, including retinal
    photoreceptors. Despite the diverse underlying biochemical defects across the
    NCLs, this intraneuronal lipopigment storage is the shared, defining effector
    event, consistent with the conserved lysosomal-substrate-accumulation
    mechanism.

biochemical:
- name: Autofluorescent ceroid-lipofuscin storage
  presence: INCREASED
  context: >
    Intracellular autofluorescent ceroid-lipofuscin is the defining storage
    readout across NCLs. Ultrastructural morphology differs by genotype, so no
    single inclusion pattern is asserted for the entire juvenile umbrella.
  readouts:
  - target: Lysosomal Ceroid-Lipofuscin Storage
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Increased autofluorescent lipopigment reports the shared storage node.
    evidence:
    - reference: PMID:23838030
      reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The neuronal ceroid lipofuscinoses represent a group of disorders
        characterized by neurodegeneration and intracellular accumulation of an
        auto-fluorescent lipopigment (ceroid lipofuscin).
      explanation: Defines the diagnostic storage material.
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The neuronal ceroid lipofuscinoses represent a group of disorders
      characterized by neurodegeneration and intracellular accumulation of an
      auto-fluorescent lipopigment (ceroid lipofuscin).
    explanation: Supports increased intracellular ceroid-lipofuscin as the shared readout.
diagnosis:
- name: Broad molecular panel with deletion and copy-number analysis
  description: >
    A child with a juvenile NCL phenotype should undergo molecular testing
    broad enough to distinguish the supported CLN3, PPT1, TPP1, CLN5, CLN6,
    MFSD8, CLN8, CTSD, and ATP13A2 branches. Age and presenting sequence guide
    interpretation but do not reliably identify the genotype by themselves.
    The assay must include deletion/copy-number detection, because the common
    CLN3 lesion and other multi-exon deletions can be missed by sequence-only
    pipelines.
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most experts in neuronal ceroid lipofuscinosis now recommend primary
      classification by gene (or protein), with secondary classification by
      age of onset and clinical features.
    explanation: Supports gene-first classification for an onset-defined clinical presentation.
  - reference: PMID:31926949
    reference_title: "Juvenile Batten Disease (CLN3): Detailed Ocular Phenotype, Novel Observations, Delayed Diagnosis, Masquerades, and Prospects for Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common sequence variant in CLN3 is a homozygous 1 kb deletion,
      accounting for approximately 85% of cases of JNCL.
    explanation: >
      A recurrent deletion in the classic branch makes deletion/copy-number
      coverage an essential part of the molecular workflow.
- name: Lysosomal enzyme assay triage
  description: >
    PPT1, TPP1, and CTSD activity assays provide a rapid biochemical route into
    the CLN1, CLN2, and CLN10 branches, respectively. Enzyme results complement
    rather than replace biallelic molecular confirmation.
  evidence:
  - reference: PMID:35359645
    reference_title: "Neuronal Ceroid Lipofuscinosis: The Multifaceted Approach to the Clinical Issues, an Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      enzymatic assays became available for four lysosomal enzym es: CTSD, CTSF
      , PPT1, and TPP1
    explanation: >
      The diagnostic review identifies CTSD, PPT1, and TPP1 among the lysosomal
      enzymes with available biochemical assays; the spacing reflects the
      source PDF extraction.
- name: Peripheral blood film and storage-inclusion screening
  description: >
    In a child with rapid bilateral visual loss suggestive of classic CLN3,
    vacuolated lymphocytes on peripheral blood film provide a rapid screening
    clue and fingerprint lysosomal inclusions can be demonstrated by electron
    microscopy. These findings do not identify every non-CLN3 juvenile branch.
  evidence:
  - reference: PMID:31926949
    reference_title: "Juvenile Batten Disease (CLN3): Detailed Ocular Phenotype, Novel Observations, Delayed Diagnosis, Masquerades, and Prospects for Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blood film microscopy performed for all 8 patients demonstrated
      vacuolated lymphocytes. Electron microscopy was done sequentially in 7
      patients, and all showed lysosomal (fingerprint) inclusions.
    explanation: >
      Directly supports both screening steps in a molecularly confirmed CLN3
      juvenile cohort.
- name: Retinal electrophysiology and multimodal imaging
  description: >
    Full-field electroretinography, fundus autofluorescence, and OCT can expose
    severe generalized retinal and macular dysfunction when rapid visual loss
    raises classic CLN3 suspicion. These are phenotype-directed adjuncts, not a
    gene-independent confirmation test for the whole umbrella.
  evidence:
  - reference: PMID:31926949
    reference_title: "Juvenile Batten Disease (CLN3): Detailed Ocular Phenotype, Novel Observations, Delayed Diagnosis, Masquerades, and Prospects for Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full-field and flash ERGs were recorded in all patients under photopic and
      scotopic conditions. Cases 1, 2, 4, and 5 had undetectable ERGs, in
      keeping with severe rod and cone photoreceptor dysfunction
    explanation: Demonstrates a severe electrophysiologic retinal signature in CLN3 disease.
  - reference: PMID:36964447
    reference_title: "Early recognition of CLN3 disease facilitated by visual electrophysiology and multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Best corrected visual acuity (BCVA), electroretinogram (ERG), ultra-widefield
      (UWF) fundus photography and fundus autofluorescence (FAF), and optical
      coherence tomography (OCT) studies were undertaken.
    explanation: Independently documents the multimodal retinal assessment set in CLN3 disease.
- name: Ultrastructural storage-pattern analysis
  description: >
    Electron microscopy can classify granular osmiophilic, curvilinear,
    fingerprint, or rectilinear storage patterns and thereby focus biochemical
    and molecular testing. Overlap between newer genotype-defined NCLs means
    ultrastructure remains supportive rather than definitive.
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The distinctive ultrastructural patterns are granular osmiophilic deposits
      in infantile neuronal ceroid lipofuscinosis, curvilinear profiles in
      late-infantile neuronal ceroid lipofuscinosis, fingerprint bodies in
      juvenile neuronal ceroid lipofuscinosis, and rectilinear profiles in
      adult-onset neuronal ceroid lipofuscinosis.
    explanation: >
      Defines the classic electron-microscopy patterns while the adjacent review
      text cautions that newer forms overlap.
treatments:
- name: Supportive care
  description: >
    Management is genotype- and symptom-specific and remains primarily
    supportive. This onset umbrella does not extrapolate a therapy studied in
    CLN3 or another single genotype to every juvenile NCL branch.

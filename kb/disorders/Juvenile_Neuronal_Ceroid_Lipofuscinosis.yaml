notes: >
  Entity boundary. MONDO:0019262 describes a genetically heterogeneous group
  and carries an editor note that it is kept separate from CLN3 disease because
  it groups different CLNs. The current KB already models the same ontology
  altitude for adult NCL at MONDO:0019260. This record therefore mirrors that
  onset-grouping precedent and does not replace
  `Neuronal_Ceroid_Lipofuscinosis_3.yaml` (MONDO:0008767).

  Subtype guardrail. Each listed genotype has its own exact, independently
  verified human PMID supporting a juvenile presentation. CLN2, CLN7, and CLN8
  are limited here to their atypical juvenile/protracted presentations; their
  common late-infantile phenotypes are not relabeled. No additional CLN
  designation was added without direct juvenile-onset evidence.

  Genetic interpretation guardrail. Each modeled association is causative,
  germline, and recessive at the gene-disease level, but the cited literature
  does not establish a single penetrance estimate for juvenile presentation.
  Carrier-frequency estimates are therefore recorded only as ancestry-aware
  testing context, never converted into affected prevalence or penetrance.
  CLN6 intrafamilial observations demonstrate variable expressivity even with
  the same variant, while the recurrent CLN3 deletion requires explicit
  deletion/copy-number detection.

  Deep-research provenance. A sanctioned `claude_code` run on 2026-08-08
  (1,217 seconds, 11 web searches, 49 citations) was explicitly prompted for
  the genetically heterogeneous MONDO:0019262 entity and its distinction from
  MONDO:0008767. The automated named-entity preflight returned SKIP because
  this onset grouping has no single MONDO causal gene; manual review confirmed
  that the report remained anchored to MONDO:0019262 and assessed each
  candidate genotype separately. An earlier run that re-anchored the target to
  CLN3 disease failed that manual entity check and was discarded wholesale.
  Every PMID and evidence snippet used in this entry was then independently
  fetched and verified against the generated reference cache. The GeneReviews
  overview (PMID:20301601) is registered as a tagged orientation source, but
  its generated cache is metadata-only; no section-level evidence is attributed
  to that stub.

pathophysiology:
- name: Lysosomal Ceroid-Lipofuscin Storage
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_scale: CELLULAR
  description: >
    The supported juvenile genotypes disrupt different lysosomal or
    endomembrane proteins, but converge at the disease-family level on
    intracellular ceroid-lipofuscin storage and progressive neurodegeneration.
    The onset umbrella does not assert one gene-specific upstream mechanism for
    all six branches.

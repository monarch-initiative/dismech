name: Juvenile Neuronal Ceroid Lipofuscinosis
category: Mendelian
creation_date: '2026-08-08T00:00:00Z'
description: >
  Juvenile neuronal ceroid lipofuscinosis (juvenile NCL) is a genetically
  heterogeneous, onset-defined umbrella within the neuronal ceroid
  lipofuscinoses. It is typically recognized at school age through progressive
  visual, cognitive, behavioral, seizure, and motor manifestations caused by
  lysosomal storage neurodegeneration. Classic juvenile NCL is CLN3 disease,
  but the MONDO entity is deliberately broader than CLN3: juvenile
  presentations are also documented for PPT1/CLN1 and CLN5, with later
  juvenile presentations attributed to CLN6, CTSD/CLN10, and ATP13A2/CLN12.
  The entry therefore models the shared onset/clinical altitude and records
  each supported genotype, while leaving gene-specific molecular mechanisms
  in the corresponding genotype entries rather than duplicating CLN3 content.
disease_term:
  preferred_term: juvenile neuronal ceroid lipofuscinosis
  term:
    id: MONDO:0019262
    label: juvenile neuronal ceroid lipofuscinosis
synonyms:
- juvenile NCL
- JNCL
- Spielmeyer-Vogt disease
- Batten-Spielmeyer-Vogt disease
- juvenile Batten disease
parents:
- Neuronal Ceroid Lipofuscinosis
- Lysosomal Storage Disease
- Neurodegenerative Disease
has_subtypes:
- name: CLN3 disease, classic juvenile onset
  description: >
    CLN3 disease is the classic and most familiar juvenile NCL branch. It
    typically begins between four and seven years with rapidly progressive
    visual loss, followed by cognitive and behavioral decline, seizures, and
    motor deterioration.
  genes:
  - preferred_term: CLN3
    term:
      id: hgnc:2074
      label: CLN3
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CLN3 disease is the classic juvenile-onset form of neuronal ceroid
      lipofuscinosis.
    explanation: >
      This clinical classification review identifies CLN3 as the classic
      juvenile-onset genotype without equating CLN3 with the entire onset
      umbrella.
  - reference: PMID:38500130
    reference_title: "The parent and family impact of CLN3 disease: an observational survey-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CLN3 disease (also known as CLN3 Batten disease or Juvenile Neuronal
      Ceroid Lipofuscinosis) is a rare pediatric neurodegenerative disorder
      caused by biallelic mutations in CLN3.
    explanation: >
      A clinical cohort independently identifies the classic juvenile branch
      and its biallelic CLN3 basis.
- name: CLN1 disease, juvenile onset
  description: >
    A later-onset PPT1/CLN1 presentation begins between approximately five and
    ten years. Cognitive decline is followed by seizures, motor decline, and
    later visual loss, distinguishing its sequence from classic CLN3 disease.
  genes:
  - preferred_term: PPT1
    term:
      id: hgnc:9325
      label: PPT1
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A juvenile-onset form of CLN1 disease has also been described and has
      been referred to “juvenile neuronal ceroid lipofuscinosis with granular
      osmiophilic deposits.”
    explanation: >
      The review explicitly recognizes a juvenile-onset CLN1 presentation.
  - reference: PMID:17388982
    reference_title: "Juvenile-onset neuronal ceroid lipofuscinosis with infantile CLN1 mutation and palmitoyl-protein thioesterase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a patient with juvenile-onset NCL phenotype with a new CLN1
      mutation and deficient PPT activity.
    explanation: >
      A molecularly and enzymatically characterized patient independently
      establishes juvenile-onset PPT1/CLN1 disease.
- name: CLN5 disease, juvenile onset
  description: >
    CLN5 disease has a broad onset range that crosses the late-infantile and
    juvenile intervals. Juvenile presentations may include psychomotor
    regression, ataxia, myoclonic epilepsy, visual failure, and behavioral
    problems.
  genes:
  - preferred_term: CLN5
    term:
      id: hgnc:2076
      label: CLN5
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The age of onset in CLN5 disease varies from 4 to 17 years, with a mean
      of 5.6 years.
    explanation: >
      The documented range includes a substantial juvenile-onset interval.
  - reference: PMID:20157158
    reference_title: "CLN5 mutations are frequent in juvenile and late-onset non-Finnish patients with NCL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The age at disease onset in this cohort is predominantly juvenile rather
      than late infantile.
    explanation: >
      A ten-patient pathogenic-CLN5 cohort independently establishes that
      juvenile onset is common outside the original Finnish classification.
- name: CLN6 disease, late juvenile onset
  description: >
    A late juvenile CLN6 presentation begins around eight to twelve years and
    is characterized especially by myoclonic seizures and cognitive decline.
    This branch is distinct from both earlier variant late-infantile CLN6 and
    adult CLN6-related Kufs disease.
  genes:

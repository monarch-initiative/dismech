- name: Cerliponase alfa for the TPP1/CLN2 branch
  description: >
    Intracerebroventricular recombinant human TPP1 enzyme replacement targets
    the proximal enzyme lesion in CLN2 disease and slows motor-language decline.
    The efficacy trial summarized by the source focused on late-infantile CLN2,
    not a juvenile-onset-stratified cohort; use for atypical juvenile CLN2
    therefore requires genotype confirmation and specialist assessment rather
    than extrapolation to every juvenile NCL branch.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
  target_mechanisms:
  - target: TPP1 lysosomal peptidase deficiency
    treatment_effect: RESTORES
    description: Cerliponase alfa replaces the deficient TPP1 enzyme in the CLN2 branch.
    evidence:
    - reference: PMID:31884868
      reference_title: "Review of Cerliponase Alfa: Recombinant Human Enzyme Replacement Therapy for Late-Infantile Neuronal Ceroid Lipofuscinosis Type 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cerliponase alfa is recombinant human tripeptidyl peptidase 1 enzyme
        replacement therapy.
      explanation: Directly identifies the replacement protein and proximal treatment target.
  evidence:
  - reference: PMID:31884868
    reference_title: "Review of Cerliponase Alfa: Recombinant Human Enzyme Replacement Therapy for Late-Infantile Neuronal Ceroid Lipofuscinosis Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with intracerebroventricular cerliponase alfa resulted in slower

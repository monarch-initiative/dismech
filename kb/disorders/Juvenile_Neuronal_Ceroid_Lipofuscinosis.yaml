discussions:
- discussion_id: juvenile_ncl_grouping_vs_cln3_identity
  prompt: Is juvenile neuronal ceroid lipofuscinosis identical to CLN3 disease?
  kind: CONTROVERSY
  status: RESOLVED
  rationale: >
    Historical and much modern clinical literature uses JNCL as a synonym for
    classic CLN3 disease. MONDO:0019262, however, explicitly preserves a
    separate genetically heterogeneous onset grouping, and the clinical
    classification literature documents juvenile presentations outside CLN3.
  resolution_note: >
    Curate MONDO:0019262 as an onset grouping alongside the existing CLN3
    genotype entry. Keep CLN3-specific variants, molecular mechanisms, trials,
    and natural history in `Neuronal_Ceroid_Lipofuscinosis_3.yaml`.
  evidence:
  - reference: PMID:23838030
    reference_title: "Classification and natural history of the neuronal ceroid lipofuscinoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A juvenile-onset form of CLN1 disease has also been described and has
      been referred to “juvenile neuronal ceroid lipofuscinosis with granular
      osmiophilic deposits.”
    explanation: Demonstrates that juvenile NCL terminology is not exclusive to CLN3.

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      He described a juvenile-onset disorder with blindness and progressive
      dementia.
    explanation: The historical juvenile NCL description establishes visual loss as a defining feature.
- name: Cognitive impairment
  description: >
    Cognitive slowing and decline are central juvenile NCL manifestations,
    although they follow vision loss in classic CLN3 and may precede it in
    juvenile CLN1.
  phenotype_term:

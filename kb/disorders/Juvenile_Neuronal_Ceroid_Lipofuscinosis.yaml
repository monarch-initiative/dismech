      dementia.
    explanation: The classic juvenile phenotype explicitly includes progressive dementia.
- name: Seizure
  description: >
    Epileptic seizures occur across the juvenile NCL spectrum, but their onset
    and semiology vary by genotype; myoclonic seizures are especially prominent
    in later juvenile CLN6, while generalized seizures define CLN8 EPMR onset.
  phenotype_term:
    preferred_term: Seizure

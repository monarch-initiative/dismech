phenotypes:
- name: Visual impairment
  description: >
    Progressive visual loss is often the presenting feature of classic CLN3
    and is also documented in juvenile CLN1, CLN5, and CLN10. Its timing is not
    uniform across the genetically heterogeneous umbrella.
  phenotype_term:
    preferred_term: Visual impairment

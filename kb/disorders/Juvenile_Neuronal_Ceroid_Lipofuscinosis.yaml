      Myoclonic seizures, cognitive decline; ataxia, cognitive decline, visual
      loss;
    explanation: >
      The childhood-NCL classification table assigns CLN6 to the late juvenile
      8–12-year band and gives its presenting manifestations.
  - reference: PMID:22883287
    reference_title: "Mutation of the CLN6 gene in teenage-onset progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a multiplex family with autosomal recessive teenage-onset
      progressive myoclonus epilepsy that had remained undiagnosed despite
      extensive genetic and pathologic testing.
    explanation: >
      The family was molecularly diagnosed with CLN6, independently supporting
      a teenage-onset CLN6 branch.

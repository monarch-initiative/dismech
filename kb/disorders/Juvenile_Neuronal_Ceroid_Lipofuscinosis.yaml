    explanation: >
      The review's childhood-NCL table explicitly places ATP13A2/CLN12 in the
      13–16-year juvenile-onset band.
  - reference: PMID:22388936
    reference_title: "Mutation of the parkinsonism gene ATP13A2 causes neuronal ceroid-lipofuscinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

progression:
- phase: Localized Deep Soft Tissue Presentation
  age_range: Young adulthood
  notes: >-
    Typically presents in young adults in the deep soft tissues of the
    extremities involving tendons and aponeuroses.
  evidence:
  - reference: PMID:40004764
    reference_title: "Clear Cell Sarcoma (CCS) of the Soft Tissue: An Update Narrative Review with Emphasis on the Utility of PRAME in Differential Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clear Cell Sarcoma (CCS) of soft tissue is a rare and highly malignant neoplasm primarily affecting young adults, often presenting in the deep soft tissues of the extremities."
    explanation: Supports presentation in young adults in the deep soft tissues of the extremities.
- phase: Regional and Distant Metastatic Progression
  notes: >-
    High propensity for regional lymph node and distant relapse with poor
    response to conventional systemic chemotherapy and high disease-specific
    mortality.
  evidence:
  - reference: PMID:41749894
    reference_title: "Clear Cell and Histiocytic/Dendritic Cell Sarcomas: Clinical Outcomes, Molecular Features, and Diagnostic Pitfalls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among CCS patients who received systemic therapies, 3 of 4 (75%) progressed during or shortly after treatment. Overall mortality occurred in 4 of 10 DHCS patients (40%) and 3 of 5 CCS patients (60%)."
    explanation: Documents frequent progression on systemic therapy and high overall mortality in CCS.
diagnosis:
- name: Molecular Genetic Testing for EWSR1-ATF1/CREB1 Fusion
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Detection of the t(12;22)(q13;q12) EWSR1-ATF1 (or EWSR1-CREB1) gene fusion
    by FISH, RT-PCR, or next-generation sequencing is essential to confirm the
    diagnosis of clear cell sarcoma and differentiate it from cutaneous or
    metastatic melanoma.
  evidence:
  - reference: PMID:40004764
    reference_title: "Clear Cell Sarcoma (CCS) of the Soft Tissue: An Update Narrative Review with Emphasis on the Utility of PRAME in Differential Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite morphological and immunophenotypic similarities to melanoma, CCS arises from connective tissues and is characterized by a distinct genetic hallmark: the EWSR1-ATF1 fusion resulting from t(12;22)(q13;q12) translocation. This genetic signature is absent in melanoma, making molecular diagnosis essential for accurate differentiation."
    explanation: Establishes molecular detection of the EWSR1-ATF1 fusion as essential for diagnosing CCS and distinguishing it from melanoma.
- name: Histopathology and Immunohistochemistry (S100, HMB-45, MITF, PRAME)
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  description: >-
    Tissue biopsy shows lobular nests of spindle-to-epithelioid cells with clear
    cytoplasm and immunoreactivity for melanocytic markers (S-100, HMB-45,
    Melan-A, MITF), complemented by PRAME immunohistochemistry and molecular
    fusion testing.
  evidence:
  - reference: PMID:40004764
    reference_title: "Clear Cell Sarcoma (CCS) of the Soft Tissue: An Update Narrative Review with Emphasis on the Utility of PRAME in Differential Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, CCS features lobular growth, spindle-to-epithelioid cells with clear cytoplasm, and low mitotic activity, often necessitating a multimodal diagnostic approach incorporating histopathology, immunohistochemistry, and molecular testing."
    explanation: Supports multimodal histopathologic and immunohistochemical biopsy evaluation for diagnosing CCS.
  - reference: PMID:11211309
    reference_title: "Clear cell sarcoma shows immunoreactivity for microphthalmia transcription factor: further evidence for melanocytic differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoreactivity in a nuclear pattern for D5 was present in 8 of 12 (75%) tumors. D5 staining was strong in three tumors, moderate in two, and weak in three. S-100 protein expression was seen in all 12 cases that had clear cell sarcoma examined. HMB-45 staining was seen in 11 of 12 (92%) tumors. Focal Melan-A positivity was seen in 3 of 7 (43%) tumors."
    explanation: Directly documents immunohistochemical positivity for MITF (D5), S-100, HMB-45, and Melan-A in clear cell sarcoma biopsy specimens.
  - reference: DOI:10.1007/s00432-024-05980-3
    reference_title: "Prognostic factors in clear cell sarcoma: an analysis of soft tissue sarcoma in 43 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "90.6% of analyzed tissue was found to be positive for S-100 (incl. 2/3 GINET), 87% for HMB-45 (1/2 GINET) and 77.4% for Melan-A (1/3 GINET) staining."
    explanation: Confirms high diagnostic sensitivity of S-100, HMB-45, and Melan-A immunohistochemistry in a 43-patient CCS cohort.
differential_diagnoses:
- name: Cutaneous or Metastatic Melanoma
  disease_term:
    preferred_term: cutaneous melanoma
    term:
      id: MONDO:0005012
      label: cutaneous melanoma
  description: >-
    Cutaneous or metastatic malignant melanoma shares morphological features and
    melanocytic marker expression (S100, HMB-45, Melan-A, MITF) with clear cell
    sarcoma, requiring molecular testing for EWSR1-ATF1/CREB1 fusions and adjunct
    PRAME immunohistochemistry for accurate distinction.
  distinguishing_features:
  - Absence of EWSR1-ATF1 or EWSR1-CREB1 translocation in melanoma
  - Superficial localization with epidermal infiltration and higher mitotic activity in melanoma versus deep location associated with tendons and aponeuroses and low mitotic activity in CCS
  - Diffuse nuclear PRAME positivity in cutaneous melanoma versus typically absent or focal PRAME staining in CCS (used as an adjunct immunohistochemical discriminator alongside molecular fusion testing)
  evidence:
  - reference: PMID:40004764
    reference_title: "Clear Cell Sarcoma (CCS) of the Soft Tissue: An Update Narrative Review with Emphasis on the Utility of PRAME in Differential Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite morphological and immunophenotypic similarities to melanoma, CCS arises from connective tissues and is characterized by a distinct genetic hallmark: the EWSR1-ATF1 fusion resulting from t(12;22)(q13;q12) translocation. This genetic signature is absent in melanoma, making molecular diagnosis essential for accurate differentiation."
    explanation: Directly supports melanoma as the primary differential diagnosis of CCS and establishes EWSR1-ATF1 testing as the key discriminator.
  - reference: DOI:10.1007/s00432-024-05980-3
    reference_title: "Prognostic factors in clear cell sarcoma: an analysis of soft tissue sarcoma in 43 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "superficial localization with infiltration of the epidermis vs. deep location with relation to tendons and aponeuroses in CCS, high number vs. low number of mitoses in CSS"
    explanation: Documents clinicopathologic criteria distinguishing cutaneous melanoma from clear cell sarcoma.
treatments:
- name: Wide Surgical Resection
  description: >-
    Wide surgical excision with negative margins is the primary treatment.
    The tendency to arise near tendons and joints may complicate resection.
    Amputation may be necessary for large or recurrent tumors.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:40004764
    reference_title: "Clear Cell Sarcoma (CCS) of the Soft Tissue: An Update Narrative Review with Emphasis on the Utility of PRAME in Differential Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapeutically, wide surgical excision remains the cornerstone for localized disease"
    explanation: Directly supports wide surgical excision as the cornerstone treatment for localized CCS.
- name: Sentinel Lymph Node Biopsy
  description: >-
    Given the propensity for lymph node metastasis, sentinel lymph node biopsy

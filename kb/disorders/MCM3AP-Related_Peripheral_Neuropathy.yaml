name: MCM3AP-Related Peripheral Neuropathy
creation_date: "2026-09-05T10:00:00Z"
category: Mendelian
synonyms:
- PNRIID
- peripheral neuropathy, autosomal recessive, with or without impaired intellectual development
- MCM3AP-related Charcot-Marie-Tooth disease
- GANP-related neuropathy
description: >-
  MCM3AP-related peripheral neuropathy is an autosomal recessive, childhood-onset
  sensorimotor neuropathy, usually axonal, with mild to moderate intellectual
  disability in most affected individuals. It is caused by biallelic variants in
  MCM3AP, which encodes GANP, the Sac3-domain scaffold subunit of the TREX-2
  complex that docks at the nuclear pore and hands newly transcribed messenger
  ribonucleoproteins to the mRNA export receptor.

  The disease is therefore a nuclear mRNA export defect presenting as a
  Charcot-Marie-Tooth phenotype, which is what separates it from the rest of the
  recessive CMT differential. Nothing in its mechanism concerns myelin proteins,
  axonal transport motors or mitochondrial dynamics, the usual CMT categories.

  Two features of the genotype-phenotype relationship are unusually well
  resolved for a disease this rare, and both follow from where a variant sits in
  the protein. Variants that deplete GANP produce a more severe phenotype than
  variants that alter critical residues within the Sac3 mRNA-binding domain,
  which spare protein levels. And in patient fibroblasts the transcriptome
  changes are structured by intron content rather than being uniform, with all
  differentially expressed intronless genes downregulated. That is the most
  concrete lead available for why long-axoned peripheral neurons are selectively
  vulnerable, and it is also the point at which the mechanism stops being
  demonstrated and starts being inferred.

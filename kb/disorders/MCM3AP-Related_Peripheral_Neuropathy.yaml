diagnosis:
- name: Whole-exome sequencing with copy-number analysis
  description: >-
    Exome sequencing finds the point and splice variants; copy-number analysis
    is needed as well, because multi-exon deletions are part of the reported
    allele spectrum and are invisible to sequencing alone.
  evidence:
  - reference: PMID:39228414
    reference_title: "Identification of biallelic mutations in MCM3AP and comprehensive literature analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing (WES) combined with copy number variation sequencing (CNV-seq) were performed on the genomic DNA isolated from a Chinese family"
    explanation: The combined assay approach used to reach a molecular diagnosis in this family.
- name: Splicing analysis for candidate splice variants
  description: >-
    A splice-site variant needs functional confirmation, because the
    consequence, and therefore whether the allele is null, is not predictable
    from the genomic change. In the reported case reverse-transcription PCR
    showed an aberrant transcript eliminated by nonsense-mediated decay.
  evidence:
  - reference: PMID:32319184
    reference_title: "Genetic spectrum of MCM3AP and its relationship with phenotype of Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional studies showed that c.5634-1G>T led to splicing defect and aberrant transcript eliminated by nonsense-mediated mRNA decay."
    explanation: The functional work that established this allele as null, which is what places a patient in the more severe genotype group.
- name: Nerve conduction studies and sural nerve biopsy
  description: >-
    Electrophysiology and biopsy establish whether the neuropathy is axonal or
    demyelinating. Both patterns occur, so the result narrows the differential
    without settling it.
  evidence:
  - reference: PMID:32202298
    reference_title: "Distinct effects on mRNA export factor GANP underlie neurological disease phenotypes and alter gene expression depending on intron content."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological testing and sural nerve biopsy are most compatible with an axonal sensorimotor neuropathy, whereas some patients have signs of demyelination."
    explanation: What the two investigations show and the limit of what they settle.
differential_diagnoses:
- name: Other recessive Charcot-Marie-Tooth neuropathies
  description: >-
    Clinically this presents as recessive childhood-onset CMT and is
    indistinguishable from the rest of that group on examination. What separates
    it is the mechanism: a nuclear mRNA export defect rather than a myelin,
    axonal transport or mitochondrial lesion. That distinction is only
    accessible through sequencing.
  evidence:
  - reference: PMID:28633435
    reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of MCM3AP variants in affected individuals from multiple centres establishes it as a disease gene for childhood-onset recessively inherited Charcot-Marie-Tooth neuropathy with intellectual disability."
    explanation: Places the disorder inside the recessive CMT group that this differential covers.
- name: Multiple sclerosis
  description: >-
    Not only a mimic but a documented co-occurrence. Three affected members of
    one family homozygous for a Sac3-domain variant had CMT together with
    multiple sclerosis, which the authors propose should put MCM3AP into
    consideration when the two present together.
  evidence:
  - reference: PMID:32954258
    reference_title: "Recessive Charcot-Marie-Tooth and multiple sclerosis associated with a variant in MCM3AP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report a novel variant in MCM3AP (p.Ile954Thr), in a family including three affected individuals with characteristic features of Charcot-Marie-Tooth neuropathy and multiple sclerosis, an inflammatory condition of the central nervous system without known genetic cause"
    explanation: The reported co-occurrence in a single family.
  - reference: PMID:32954258
    reference_title: "Recessive Charcot-Marie-Tooth and multiple sclerosis associated with a variant in MCM3AP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MCM3AP should be considered in patients with accompaniment of recessive motor axonal Charcot-Marie-Tooth neuropathy and multiple sclerosis"
    explanation: The authors' recommendation, which is what makes this a differential rather than an incidental observation.
- name: Motor neuronopathy and anterior horn cell disease
  description: >-
    A single reported patient presented with a motor neuronopathy phenotype and
    widespread fasciculations, a picture that would ordinarily point away from a
    peripheral neuropathy gene.
  evidence:
  - reference: PMID:41819534
    reference_title: "Motor Neuronopathy With Widespread Fasciculations in MCM3AP-Related Disorder: Clinical and Muscle MRI Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To describe a patient with biallelic MCM3AP variants presenting with a motor neuronopathy phenotype and to provide the first whole-body muscle MRI characterization associated with this gene."
    explanation: The single case that extends the presentation into anterior horn territory.
discussions:
- discussion_id: mcm3ap_length_dependence_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a general nuclear mRNA export defect produce a length-dependent
    peripheral neuropathy rather than a generalized cellular disease?
  attaches_to:
  - pathophysiology#Length-Dependent Peripheral Axonal Degeneration
  rationale: >-
    GANP and TREX-2 operate in every nucleus, so selective vulnerability of long
    peripheral axons is the central unexplained feature of this disease. The
    best available lead is that the transcriptome changes are structured by
    intron content rather than being uniform, which could concentrate the effect
    on a particular set of transcripts. But no work connects that transcript set
    to axonal length, and the original cohort paper presents the export-to-axonal-degeneration
    link as a suggestion. This entry types that edge as having unknown
    intermediates for that reason.
  evidence:
  - reference: PMID:28633435
    reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus our results suggest defective mRNA export from nucleus as a potential pathogenic mechanism of axonal degeneration in these patients."
    explanation: The hedged framing in the disease-defining paper, which is the state of the evidence this gap records.
- discussion_id: mcm3ap_genotype_phenotype_power
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the association between null MCM3AP alleles and worse cognitive and
    ambulatory outcome real, or an artifact of small cohorts?
  attaches_to:
  - genetic#MCM3AP
  rationale: >-
    Two separate lines point the same way: patient fibroblasts show that
    depleting alleles give more severe phenotypes than Sac3-domain alleles, and
    cohort analysis finds delayed independent walking in the null group. But the
    cohort's intellectual disability and loss-of-ambulation comparisons did not
    reach statistical significance, and the authors say so. With fewer than
    thirty reported individuals in the largest retrospective series, the
    question is one of power rather than of contradictory evidence, and this
    entry quotes the non-significant result rather than rounding it up.
  evidence:
  - reference: PMID:32319184
    reference_title: "Genetic spectrum of MCM3AP and its relationship with phenotype of Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The percentage of intellectual disability and loss of ambulation in the null group tended to be greater, although this failed to reach statistical significance."
    explanation: The explicit statement of non-significance that this gap is about.
  - reference: PMID:39228414
    reference_title: "Identification of biallelic mutations in MCM3AP and comprehensive literature analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MCM3AP genotype-phenotype correlation and prognosis remain unclear."
    explanation: A later review reaching the same conclusion, which is what makes this an open question rather than a settled one.

    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for MCM3AP
    variants. The reported allele types span missense, splice, frameshift,
    nonsense and multi-exon deletion.
  evidence:
  - reference: PMID:28633435
    reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals were either compound heterozygous or homozygous for different MCM3AP variants, which were predicted to cause depletion of GANP or affect conserved amino acids with likely importance for its function."
    explanation: The disease-defining cohort's genotypes, and the two functional classes the entry's genotype-phenotype section turns on.
genetic:
- name: MCM3AP
  gene_term:
    preferred_term: MCM3AP
    term:
      id: hgnc:6946
      label: MCM3AP
  association: >-
    MCM3AP encodes GANP, the scaffold subunit of the TREX-2 nuclear mRNA export
    complex. Biallelic hypomorphic or loss-of-function variants cause
    childhood-onset recessive Charcot-Marie-Tooth neuropathy with or without
    impaired intellectual development.
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:28633435
    reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of MCM3AP variants in affected individuals from multiple centres establishes it as a disease gene for childhood-onset recessively inherited Charcot-Marie-Tooth neuropathy with intellectual disability."
    explanation: The statement establishing the gene-disease relationship, and the multi-centre ascertainment behind it.
  variants:
  - name: MCM3AP Sac3-domain missense variants
    description: >-
      Variants altering critical residues within the Sac3 mRNA-binding domain do
      not deplete GANP, and are associated with a milder phenotype than the
      depleting alleles. This is the structural basis of the reported
      genotype-phenotype correlation.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32202298
      reference_title: "Distinct effects on mRNA export factor GANP underlie neurological disease phenotypes and alter gene expression depending on intron content."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "our analysis of skin fibroblasts from affected individuals from seven unrelated families indicates that disease variants result in depletion of GANP except when they alter critical residues in the Sac3 mRNA binding domain"
      explanation: Measured protein levels in patient fibroblasts separating the two allele classes.
  - name: MCM3AP null and depleting variants
    description: >-
      Splice, frameshift, nonsense and deletion alleles that reduce GANP
      protein. In cohort analysis these are associated with delayed independent
      walking, and with a numerically higher rate of intellectual disability and
      loss of ambulation.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32319184
      reference_title: "Genetic spectrum of MCM3AP and its relationship with phenotype of Charcot-Marie-Tooth disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genotype-phenotype correlation analysis indicated that affected individuals with null mutations presented with delayed independent walking."
      explanation: The one genotype-phenotype association this cohort reports as established.
    - reference: PMID:32319184
      reference_title: "Genetic spectrum of MCM3AP and its relationship with phenotype of Charcot-Marie-Tooth disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The percentage of intellectual disability and loss of ambulation in the null group tended to be greater, although this failed to reach statistical significance."
      explanation: A trend the authors explicitly report as not statistically significant, quoted here so the entry does not overstate it. It is indirect because the association is suggested rather than demonstrated.
pathophysiology:
- name: Biallelic MCM3AP Variants
  biological_scale: MOLECULAR
  description: >-
    Missense, splice, frameshift, nonsense and multi-exon deletion alleles in
    trans or in homozygosity. The functional consequence divides into two
    classes that behave differently: alleles that deplete GANP protein, and
    Sac3-domain missense alleles that leave protein levels intact and impair
    mRNA binding instead.
  gene:
    preferred_term: MCM3AP
    modifier: LOSS_OF_FUNCTION
    term:
      id: hgnc:6946
      label: MCM3AP
  evidence:
  - reference: PMID:28633435
    reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report mutations in the gene MCM3AP, encoding the germinal center associated nuclear protein (GANP), in nine affected individuals from five unrelated families."
    explanation: The original variant identification.
  downstream:
  - target: GANP Depletion or Sac3-Domain Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28633435
      reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Accordingly, fibroblasts of affected individuals from one family demonstrated severe depletion of GANP."
      explanation: Direct measurement of the protein consequence in patient cells.
- name: GANP Depletion or Sac3-Domain Dysfunction
  biological_scale: MOLECULAR
  description: >-
    The protein-level consequence, and the point at which the two allele classes
    diverge. Depleting alleles remove the TREX-2 scaffold; Sac3-domain missense
    alleles leave it present but impaired. The depleting class is associated with
    the more severe clinical picture, which is the mechanistic basis of the
    genotype-phenotype correlation.
  molecular_functions:
  - preferred_term: histone acetyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0004402
      label: histone acetyltransferase activity
  cellular_components:
  - preferred_term: nuclear pore
    term:
      id: GO:0005643
      label: nuclear pore
  evidence:
  - reference: PMID:32202298
    reference_title: "Distinct effects on mRNA export factor GANP underlie neurological disease phenotypes and alter gene expression depending on intron content."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GANP depletion was associated with more severe phenotypes compared with the Sac3 variants."
    explanation: Ties the protein-level divergence to clinical severity, which is what makes this node a branch point rather than a single state.
  - reference: PMID:32954258
    reference_title: "Recessive Charcot-Marie-Tooth and multiple sclerosis associated with a variant in MCM3AP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "MCM3AP encoded protein functions as an acetyltransferase that acetylates the replication protein, MCM3, and plays a key role in the regulation of DNA replication."
    explanation: Records GANP's second, non-export function. It is indirect because no reported work shows this activity contributing to the neuropathy, and the entry does not claim it does.
  downstream:
  - target: Impaired TREX-2-Mediated Nuclear mRNA Export
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28633435
      reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "GANP has been described to function as an mRNA export factor, and to suppress TDP-43-mediated motor neuron degeneration in flies."
      explanation: The export function whose loss this edge asserts, together with the fly result that first connected it to motor neuron degeneration.
- name: Impaired TREX-2-Mediated Nuclear mRNA Export
  biological_scale: CELLULAR
  description: >-
    Loss of the TREX-2 scaffold impairs handoff of messenger ribonucleoproteins
    to the export receptor at the nuclear pore. Defects in mRNA export from the
    nucleus were already linked to neurodegenerative disease before this gene
    was implicated, which is the general context that made the finding
    interpretable.
  biological_processes:
  - preferred_term: mRNA export from nucleus
    modifier: DECREASED
    term:
      id: GO:0006406
      label: mRNA export from nucleus
  cellular_components:
  - preferred_term: nuclear pore
    term:
      id: GO:0005643
      label: nuclear pore
  evidence:
  - reference: PMID:28633435
    reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in mRNA export from the nucleus have been linked to various neurodegenerative disorders."
    explanation: The prior context that makes an export defect a plausible neurodegenerative mechanism.
  - reference: PMID:32202298
    reference_title: "Distinct effects on mRNA export factor GANP underlie neurological disease phenotypes and alter gene expression depending on intron content."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Defects in the mRNA export scaffold protein GANP, encoded by the MCM3AP gene, cause autosomal recessive early-onset peripheral neuropathy with or without intellectual disability."
    explanation: States the export-scaffold role and the disease it causes in one sentence.
  downstream:
  - target: Intron-Content-Dependent Transcriptome Alteration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32202298
      reference_title: "Distinct effects on mRNA export factor GANP underlie neurological disease phenotypes and alter gene expression depending on intron content."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patient fibroblasts showed transcriptome alterations that suggested intron content-dependent regulation of gene expression."
      explanation: The measured transcriptome consequence in patient cells.
- name: Intron-Content-Dependent Transcriptome Alteration
  biological_scale: CELLULAR
  description: >-
    The export defect does not perturb the transcriptome uniformly. In patient
    fibroblasts every differentially expressed intronless gene was
    downregulated, and one of them is ATXN7L3B, which itself couples mRNA export
    to transcription activation through the TREX-2 and SAGA complexes. That
    makes the perturbation partly self-reinforcing, and it is the most specific
    available account of why a general export defect should hit some cells
    harder than others.
  biological_processes:
  - preferred_term: mRNA transport
    modifier: ABNORMAL
    term:
      id: GO:0051028
      label: mRNA transport
  evidence:
  - reference: PMID:32202298
    reference_title: "Distinct effects on mRNA export factor GANP underlie neurological disease phenotypes and alter gene expression depending on intron content."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For example, all differentially expressed intronless genes were downregulated, including ATXN7L3B, which couples mRNA export to transcription activation by association with the TREX-2 and SAGA complexes."
    explanation: The specific finding, including the feedback relationship the description turns on.
  downstream:
  - target: Length-Dependent Peripheral Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28633435
      reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Thus our results suggest defective mRNA export from nucleus as a potential pathogenic mechanism of axonal degeneration in these patients."
      explanation: The authors present the link between the export defect and axonal degeneration as a suggested potential mechanism, and this entry types the edge accordingly rather than asserting it.
- name: Length-Dependent Peripheral Axonal Degeneration
  biological_scale: TISSUE
  description: >-
    Degeneration of long peripheral motor and sensory axons, confirmed on
    electrophysiology and sural nerve biopsy as an axonal sensorimotor
    neuropathy in most patients. A minority have demyelinating features instead,
    including one of the five original families, so the axonal picture is
    predominant rather than exclusive.
  cell_types:

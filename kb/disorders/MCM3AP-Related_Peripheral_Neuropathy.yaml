      label: peripheral nervous system
  - preferred_term: sural nerve
    term:
      id: UBERON:0015488
      label: sural nerve
  evidence:
  - reference: PMID:32202298
    reference_title: "Distinct effects on mRNA export factor GANP underlie neurological disease phenotypes and alter gene expression depending on intron content."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological testing and sural nerve biopsy are most compatible with an axonal sensorimotor neuropathy, whereas some patients have signs of demyelination."
    explanation: The two investigations that establish the axonal character, and the acknowledged demyelinating minority.
  - reference: PMID:28633435
    reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants were associated with severe childhood onset primarily axonal (four families) or demyelinating (one family) Charcot-Marie-Tooth neuropathy."
    explanation: The four-to-one split between axonal and demyelinating presentations in the original families.
  downstream:
  - target: Distal Muscle Weakness
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32202298
      reference_title: "Distinct effects on mRNA export factor GANP underlie neurological disease phenotypes and alter gene expression depending on intron content."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This childhood-onset neurologic syndrome is progressive and causes distal motor impairment and gait difficulties, often resulting in wheelchair dependency and in difficulties using proximal limbs."
      explanation: The clinical course produced by the axonal degeneration, including its progression to proximal involvement.
  - target: Distal Sensory Impairment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28633435
      reference_title: "MCM3AP in recessive Charcot-Marie-Tooth neuropathy and mild intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "severe childhood onset primarily axonal (four families) or demyelinating (one family) Charcot-Marie-Tooth neuropathy"
      explanation: Charcot-Marie-Tooth neuropathy is by definition sensorimotor, so the sensory arm follows from the diagnosis the cohort establishes.

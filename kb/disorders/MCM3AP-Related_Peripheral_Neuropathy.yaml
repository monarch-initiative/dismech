notes: >-
  Deep-research provenance. Curated alongside an OpenScientist report
  (research/MCM3AP-Related_Peripheral_Neuropathy-deep-research-openscientist.md).
  All 18 of its references resolved, and its causal chain matched the one built
  here from the primary literature.

  Its quote validation flagged two references whose attributed quotes could not
  be found in the record: PMID:23652018 and PMID:27235683. Neither is cited in
  this entry, and no quoted material from either was reused.

  PMID:28969388 has no abstract available in PubMed, so it carries no evidence
  item and appears in the reference block only. It is kept there because it is
  one of the concurrent papers that established the gene-disease relationship.

  Where the mechanism stops being demonstrated. The chain from biallelic
  variants through GANP depletion to impaired mRNA export is measured. The step
  from impaired export to length-dependent axonal degeneration is not: the
  disease-defining paper presents it as a suggested potential mechanism, and
  that edge is typed INDIRECT_UNKNOWN_INTERMEDIATES with a knowledge gap
  attached rather than being asserted. The report's own chain labels the same
  step "(Inferred.)", which agrees.

  The R-loop and transcription-coupled genome instability branch that the report
  describes is not curated as a pathophysiology node. The report itself marks
  the contribution of that branch to the neuropathy as inferred, and the sources
  cached here do not carry a quotable statement connecting R-loops to this
  disease, so a node would assert more than the evidence supports.

  GANP's acetyltransferase activity is recorded on the protein-level node with
  directness INDIRECT and an explanation stating that no reported work shows it
  contributing to the neuropathy. It is included because it is what a reader
  encountering the gene's other literature will need to place.

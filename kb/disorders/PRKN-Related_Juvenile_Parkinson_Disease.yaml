    cognitive impairment or dementia in any case. This relative cognitive
    sparing is a genuine point of clinical divergence and is consistent with
    the restricted neuropathology (no involvement of the nucleus basalis of
    Meynert). The substantive curated claim here is the ABSENCE of dementia,
    not a positive phenotype.
  phenotype_term:
    preferred_term: Cognition relatively preserved (no HPO term; NTR candidate)
  notes: >-
    NEEDS-TERM-REQUEST (NTR). This entry deliberately carries NO `term:` binding.
    HPO has no positive term for "cognition preserved", and both available
    workarounds are wrong: binding an HP dementia term would be read by
    downstream tooling as the disease HAVING dementia (the opposite of the
    curated finding, since dismech's phenotype model has no negation slot), and
    binding the general parent HP:0001300 Parkinsonism - which this entry did
    until PR review - is misleading because it labels a cognitive observation
    with a motor term that is already asserted elsewhere in the entry. An
    unbound `preferred_term` is the honest representation: the substantive claim
    is carried by the description and the two evidence items. An HPO term
    request for a "cognitive function preserved / not more frequent than
    population baseline" concept would be needed to bind this properly.
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cognitive decline appears to be no more frequent than in the general
      population
    explanation: >-
      GeneReviews states that cognitive decline is not over-represented,
      supporting relative cognitive sparing.
  - reference: PMID:23459986
    reference_title: "Parkin disease: a clinicopathologic entity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No patients had any evidence of cognitive impairment or dementia."
    explanation: >-
      Autopsy-confirmed series with no cognitive impairment in any of five
      cases.
histopathology:
- name: Lewy-Body-Negative Nigral Degeneration
  description: >-
    The distinguishing neuropathology of PARK-PRKN. Severe neuronal loss in the
    substantia nigra pars compacta occurs in the ABSENCE of the alpha-synuclein
    Lewy-body pathology that defines idiopathic Parkinson disease. Where Lewy
    bodies have been found in autopsy-confirmed parkin cases they were sparse
    and present in a minority of cases. The loss is topographically restricted
    - predominantly ventral tier, with relative dorsal-tier preservation, and
    limited extranigral involvement. This makes parkin disease a
    clinicopathologically distinct entity rather than simply an early-onset
    variant of idiopathic Parkinson disease, and is the single strongest
    argument for curating it as a separate dismech entry.
  finding_term:
    preferred_term: Lewy-body-negative nigral neuronal degeneration
    term:
      id: NCIT:C50774
      label: Tissue Degeneration
  diagnostic: true
  notes: >-
    The finding_term is bound to the generic NCIT morphologic finding "Tissue
    Degeneration" because neither NCIT nor the allowed HP branch provides a
    histopathology-result term for nigral neuronal loss or for absence of Lewy
    bodies. The specific finding is carried by `preferred_term`, the
    description, and the evidence.
  evidence:
  - reference: PMID:23459986
    reference_title: "Parkin disease: a clinicopathologic entity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support the notion that parkin disease is characterized by
      a more restricted morphologic abnormality than is found in PD, with
      predominantly ventral nigral degeneration and absent or rare Lewy bodies.
    explanation: >-
      The definitive statement of the distinguishing neuropathology from a
      controlled autopsy series (5 parkin cases vs 5 pathologically confirmed
      PD cases and 4 controls).
  - reference: PMID:23459986
    reference_title: "Parkin disease: a clinicopathologic entity?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sparse Lewy bodies were identified in 2 cases (brainstem and cortex).
    explanation: >-
      Marked PARTIAL because it qualifies the claim: Lewy bodies are usually
      but not invariably absent - 2 of 5 cases had sparse Lewy bodies. Curated
      explicitly so the entry does not overstate "Lewy-body negative" as
      absolute.
  - reference: PMID:10994015
    reference_title: "[18 F]-dopa PET study in patients with juvenile-onset PD and parkin gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parkin gene mutations cause a form of early-onset autosomal recessive PD
      with neuronal loss in the substantia nigra and no Lewy bodies.
    explanation: >-
      Independent statement of the nigral-loss-without-Lewy-bodies pathology.
  - reference: PMID:23459986
    reference_title: "Parkin disease: a clinicopathologic entity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The few available detailed neuropathologic reports suggest that homozygous
      and compound heterozygous parkin mutations are characterized by severe
      substantia nigra pars compacta neuronal loss.
    explanation: >-
      Establishes the severity of nigral loss in biallelic parkin mutation
      carriers.
imaging_findings:
- name: Reduced Striatal 18F-Dopa Uptake
  description: >-
    18F-dopa PET in juvenile-onset patients with parkin mutations shows a
    profound presynaptic dopaminergic deficit, with uptake reduced to
    approximately 28% of control values in the putamen and 44% in the caudate
    nucleus - a putamen-predominant gradient similar to idiopathic Parkinson
    disease.
  evidence:
  - reference: PMID:10994015
    reference_title: "[18 F]-dopa PET study in patients with juvenile-onset PD and parkin gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      representing 28% of putamen and 44% of caudate nucleus control subject
      values
    explanation: >-
      Quantifies the imaging phenotype. Based on three cases (one familial, two
      sporadic), so the point estimates should be read as illustrative.
  - reference: PMID:10994015
    reference_title: "[18 F]-dopa PET study in patients with juvenile-onset PD and parkin gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PD caused by parkin gene mutations is distinct from idiopathic PD on
      molecular grounds but has similar clinical and PET findings.
    explanation: >-
      Important nuance: imaging does NOT distinguish parkin disease from
      idiopathic Parkinson disease - the divergence is molecular and
      neuropathologic.
diagnosis:
- name: PRKN Molecular Genetic Testing with Exon-Dosage Analysis
  description: >-
    Diagnosis is established by identifying biallelic pathogenic PRKN variants.
    Because exonic deletions and duplications dominate the mutational spectrum,
    sequence analysis alone is insufficient and must be paired with a
    copy-number/dosage method (e.g. MLPA). A single heterozygous point mutation
    should prompt dosage testing for a second, rearrangement allele in trans.
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PARK-PRKN is established in a proband with suggestive
      findings and biallelic pathogenic variants in PRKN identified by
      molecular genetic testing.
    explanation: States the diagnostic standard.
  - reference: PMID:10824074
    reference_title: "Association between early-onset Parkinson's disease and mutations in the parkin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All subjects were screened for mutations in the parkin gene with use of a
      semiquantitative polymerase-chain-reaction assay that simultaneously
      amplified several exons.
    explanation: >-
      Illustrates that a dosage-sensitive (semiquantitative, multi-exon) assay
      rather than plain sequencing was required to detect the rearrangements
      that made up the majority of alleles found.
  - reference: PMID:10824074
    reference_title: "Association between early-onset Parkinson's disease and mutations in the parkin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accurate diagnosis of these cases cannot be based only on the clinical
      manifestations of the disease.
    explanation: >-
      Supports the requirement for molecular confirmation rather than clinical
      diagnosis alone.
- name: Periodic Neurologic, Autonomic and Cognitive Surveillance
  description: >-
    Ongoing surveillance rather than one-off diagnosis. GeneReviews recommends
    neurologic examination together with assessment of autonomic function and
    cognitive issues every six to 12 months. The autonomic and cognitive
    components are the reason this is not simply motor follow-up: they are the
    domains that generate the non-motor management needs (constipation,
    genitourinary, sleep, orthostatic hypotension) curated under treatments.
  diagnosis_term:
    preferred_term: neurologic examination
    term:
      id: NCIT:C81313
      label: Neurologic Examination
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: Neurologic examination and assessment of autonomic function
      and cognitive issues every six to 12 months.
    explanation: >-
      The GeneReviews Surveillance recommendation, including its six-to-12-month
      interval, quoted verbatim.
treatments:
- name: Levodopa/Carbidopa
  description: >-
    Dopamine replacement is the mainstay of therapy and PARK-PRKN responds
    excellently and durably, often at low doses. Carbidopa is a peripheral
    DOPA-decarboxylase inhibitor co-administered to reduce peripheral
    conversion. IMPORTANT SAFETY NOTE from the GeneReviews
    agents/circumstances-to-avoid section: levodopa dosing beyond what is needed
    for satisfactory clinical response should be avoided, because
    levodopa-induced dyskinesias occur frequently and early in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
    - preferred_term: carbidopa
      term:
        id: CHEBI:3395
        label: carbidopa
  target_mechanisms:
  - target: Nigrostriatal Dopamine Deficiency
    treatment_effect: RESTORES
    description: >-
      Levodopa is decarboxylated to dopamine in surviving nigrostriatal
      terminals and other striatal cells, replacing the missing neurotransmitter
      downstream of the degenerated neurons. It restores striatal dopaminergic
      neurotransmission without addressing the upstream mitophagy defect, which
      is why the response is symptomatic rather than disease-modifying.
    evidence:
    - reference: PMID:10994015
      reference_title: "[18 F]-dopa PET study in patients with juvenile-onset PD and parkin gene mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        representing 28% of putamen and 44% of caudate nucleus control subject
        values
      explanation: >-
        Quantifies the striatal dopaminergic deficit that dopamine replacement
        therapy compensates for.
  target_phenotypes:
  - preferred_term: Bradykinesia
    term:
      id: HP:0002067
      label: Bradykinesia
  - preferred_term: Rigidity
    term:
      id: HP:0002063
      label: Rigidity
  - preferred_term: Resting tremor
    term:
      id: HP:0002322
      label: Resting tremor
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Levodopa and dopamine receptor agonists,
      monoamine oxidase type B inhibitors, catechol-O-methyltransferase
      inhibitors, amantadine, adenosine A2A receptor antagonists,
      anticholinergics
    explanation: GeneReviews management recommendation naming levodopa first-line.
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Use of levodopa therapy that exceeds the
      dose needed for satisfactory clinical response.
    explanation: >-
      The GeneReviews drug-safety warning motivating dose restraint, given the
      frequent early levodopa-induced dyskinesias.
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dopamine-blocking therapies (both typical and atypical dopamine-blocking
      psychiatric medications as well as dopamine blockers for gastrointestinal
      causes) may exacerbate parkinsonism in individuals with PARK-PRKN and
      should be avoided, when possible.
    explanation: >-
      Second GeneReviews drug-safety warning: dopamine-blocking agents,
      including antiemetics, worsen parkinsonism and should be avoided.
- name: Deep Brain Stimulation
  description: >-
    Deep brain stimulation is recommended for individuals experiencing
    difficulty with levodopa therapy - in PARK-PRKN typically those limited by
    levodopa-induced dyskinesias and motor fluctuations rather than by loss of
    dopaminergic responsiveness.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_phenotypes:
  - preferred_term: Dyskinesia
    term:
      id: HP:0100660
      label: Dyskinesia
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      deep brain stimulation for those experiencing difficulty with levodopa
      therapy
    explanation: GeneReviews management recommendation for DBS.
- name: Physical, Occupational and Speech Therapy
  description: >-
    Non-pharmacological rehabilitation: exercise as tolerated (aerobic,
    strength building and integrative), physical and occupational therapy, and
    speech and voice therapy. Particularly relevant here given the long disease
    duration and young age at onset.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      exercise as tolerated (aerobic, strength building, and integrative);
      physical and occupational therapy; speech and voice therapy
    explanation: GeneReviews management recommendations for rehabilitation.
- name: Non-Motor and Autonomic Symptom Management
  description: >-
    PARK-PRKN care is not confined to the motor syndrome. GeneReviews specifies
    symptomatic treatment of constipation; urology management of genitourinary
    manifestations; sleep aids, minimizing caffeine, good sleep hygiene and
    light therapy for sleep problems; and standard treatment of orthostatic
    hypotension. These matter disproportionately in this disorder because onset
    is early and disease duration can exceed 60 years, so the cumulative
    non-motor burden is carried for decades.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      symptomatic treatment of constipation; urology management of
      genitourinary manifestations; sleep aids, minimizing caffeine, good sleep
      hygiene, and light therapy for sleep problems; standard treatment of
      orthostatic hypotension
    explanation: >-
      The GeneReviews Management recommendations for the constipation,
      genitourinary, sleep and orthostatic-hypotension domains, quoted verbatim.
- name: Cognitive and Dementia Management
  description: >-
    Where cognitive impairment does occur, GeneReviews recommends cognitive
    behavioral therapy, pharmacologic treatment, and/or a cholinesterase
    inhibitor as needed. Note this is an "as needed" contingency rather than an
    expected course: cognitive decline in PARK-PRKN is no more frequent than in
    the general population (see the "Relative Cognitive Sparing" phenotype), in
    contrast to idiopathic Parkinson disease where dementia is a common late
    outcome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholinesterase inhibitor
      term:
        id: NCIT:C47792
        label: Acetylcholinesterase Inhibitor
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cognitive behavioral therapy, pharmacologic treatment, and/or
      cholinesterase inhibitor as needed for dementia
    explanation: >-
      The GeneReviews Management recommendation for cognitive/dementia care,
      quoted verbatim.
- name: Genetic Counseling
  description: >-
    Autosomal recessive recurrence counseling. Once the familial PRKN variants
    are known, heterozygote testing for at-risk relatives and prenatal or
    preimplantation genetic testing are possible.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for a PRKN pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of being affected, a 50% chance of being heterozygous, and a 25% chance of
      inheriting neither of the familial PRKN pathogenic variants.
    explanation: GeneReviews recurrence-risk counseling content.
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the PRKN pathogenic variants have been identified in an affected
      family member, heterozygote testing for at-risk relatives and
      prenatal/preimplantation genetic testing are possible.
    explanation: GeneReviews statement on cascade and reproductive testing.
differential_diagnoses:
- name: Idiopathic (late-onset) Parkinson Disease
  description: >-
    The principal differential. Distinguishing features favouring PARK-PRKN are
    early median onset (~31 years), lower-limb dystonia at presentation,
    hyperreflexia, symmetric involvement, slow progression, absence of cognitive
    decline, and Lewy-body-negative ventral-predominant nigral degeneration at
    autopsy. Critically, 18F-dopa PET does NOT separate the two entities.
    Curated separately in dismech as `Parkinsons_Disease` (MONDO:0005180).
  evidence:
  - reference: PMID:23459986
    reference_title: "Parkin disease: a clinicopathologic entity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support the notion that parkin disease is characterized by
      a more restricted morphologic abnormality than is found in PD, with
      predominantly ventral nigral degeneration and absent or rare Lewy bodies.
    explanation: >-
      Establishes parkin disease as pathologically distinct from idiopathic
      Parkinson disease.
  - reference: PMID:10994015
    reference_title: "[18 F]-dopa PET study in patients with juvenile-onset PD and parkin gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PD caused by parkin gene mutations is distinct from idiopathic PD on
      molecular grounds but has similar clinical and PET findings.
    explanation: >-
      Explicitly notes that PET imaging cannot make the distinction, so
      molecular testing is required.
- name: PINK1-related and DJ-1-related early-onset Parkinson disease
  description: >-
    PARK6 (PINK1) and PARK7 (DJ-1) are the other two autosomal recessive
    early-onset Parkinson disease genes and are clinically very similar,
    sharing early onset, excellent treatment response, dystonia and dyskinesia,
    and relative cognitive sparing. They cannot be reliably separated
    clinically and are frequently conflated in the literature (the PARK
    numbered series is a high named-entity-confusion risk class). PINK1 acts
    directly upstream of parkin in the same mitophagy pathway, which explains
    the phenotypic convergence. Molecular testing is the discriminator.
  evidence:
  - reference: PMID:29644727
    reference_title: "Genotype-Phenotype Relations for the Parkinson's Disease Genes Parkin, PINK1, DJ1: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This first comprehensive MDSGene review is devoted to the 3 autosomal
      recessive Parkinson's disease forms: PARK-Parkin, PARK-PINK1, and
      PARK-DJ1.
    explanation: >-
      Establishes the three-gene recessive differential that this entry must be
      distinguished from.
  - reference: PMID:22956510
    reference_title: "Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PINK1 mutations were more common in Asian subjects.
    explanation: >-
      Documents ancestry-dependent differences in the relative contribution of
      the recessive EOPD genes, relevant to differential prioritization.
discussions:
- discussion_id: hmm_prkn_knockout_mouse_no_nigral_degeneration
  prompt: >-
    Why does germline parkin knockout in mice fail to reproduce the substantia
    nigra pars compacta dopaminergic neuron loss that is the defining
    neuropathology of human PARK-PRKN, and does this reflect species-specific
    compensation, insufficient lifespan/oxidative burden, or a genuinely
    different human disease mechanism?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Accumulation of Damaged Mitochondria
  - pathophysiology#Oxidative Stress and Respiratory Chain Deficiency
  - pathophysiology#Selective Dopaminergic Neuron Loss in the Substantia Nigra Pars Compacta
  rationale: >-
    This is a textbook human-model mismatch and it sits precisely on the
    load-bearing edge of the pathograph. Parkin-null mice faithfully reproduce
    the UPSTREAM biology - impaired mitochondrial respiration, reduced complex
    I and IV subunits, reduced antioxidant capacity, increased protein and lipid
    peroxidation, altered striatal dopamine handling and nigrostriatal
    behavioural deficits - yet the number of dopaminergic neurons in the
    substantia nigra remains NORMAL up to 24 months of age. Human biallelic
    parkin carriers, by contrast, show nigral neuronal loss as severe as
    idiopathic Parkinson disease at autopsy. Evidence is therefore not absent
    (which would make this a KNOWLEDGE_GAP) but present-and-discordant: the
    mouse establishes the mitochondrial/oxidative arm while failing to
    translate it into the cell-death endpoint that defines the human disease.
    The mismatch has direct consequences for the knowledge base - it is why the
    edge from "Oxidative Stress and Respiratory Chain Deficiency" to
    "Selective Dopaminergic Neuron Loss in the Substantia Nigra Pars Compacta"
    in this entry is typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT -
    and for translation, since preclinical efficacy in this model cannot be read
    as protection against nigral degeneration. Candidate explanations include
    rodent lifespan being too short to accumulate the required oxidative/mtDNA
    burden, redundancy from other mitochondrial quality-control ligases, and
    species differences in nigral dopaminergic neuron vulnerability (pacemaking
    calcium load, neuromelanin, axonal arbor size).
  proposed_experiments:
  - experiment_id: exp_prkn_ipsc_nigral_neuron_survival
    name: >-
      Isogenic patient-derived iPSC nigral dopaminergic neuron survival under
      chronic mitochondrial stress
    description: >-
      Differentiate midbrain dopaminergic neurons from PRKN biallelic patient
      iPSCs and isogenic gene-corrected controls, apply chronic low-grade
      mitochondrial stress and extended culture, and measure mitophagic flux,
      mtDNA damage/release, cGAS-STING activation and neuron survival. This
      tests directly whether human nigral dopaminergic neurons, unlike mouse
      ones, convert the parkin-loss mitochondrial phenotype into cell death,
      and isolates whether the missing factor is cell-intrinsic species biology
      rather than duration of exposure.
  - experiment_id: exp_prkn_aged_stressed_model_nigral_counts
    name: >-
      Stereological nigral counts in aged and mitochondrially stressed
      parkin-null models
    description: >-
      Perform blinded stereological tyrosine-hydroxylase-positive nigral neuron
      counts in parkin-null animals aged to the limit of lifespan and/or
      sensitized with an independent mitochondrial-stress burden, in parallel
      with longitudinal pS65-ubiquitin and cell-free mtDNA measurements. A
      positive result would support the "insufficient cumulative burden"
      explanation; a persistently negative result would argue for genuine
      species-specific compensation and would strengthen the case for
      human-based models.
  evidence:
  - reference: PMID:12930822
    reference_title: "Parkin-deficient mice exhibit nigrostriatal deficits but not loss of dopaminergic neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The number of dopaminergic neurons in the substantia nigra of parkin-/-
      mice, however, is normal up to the age of 24 months, in contrast to the
      substantial loss of nigral neurons characteristic of Parkinson's disease.
    explanation: >-
      The primary statement of the mismatch: the mouse knockout does not
      reproduce the defining human nigral degeneration even at 24 months.
  - reference: PMID:12930822
    reference_title: "Parkin-deficient mice exhibit nigrostriatal deficits but not loss of dopaminergic neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together these findings provide the first evidence for a novel role of
      parkin in dopamine regulation and nigrostriatal function, and a
      non-essential role of parkin in the survival of nigral neurons in mice.
    explanation: >-
      Explicitly frames parkin as non-essential for nigral neuron survival in
      mice, in direct tension with the human neuropathology.
  - reference: PMID:14985362
    reference_title: "Mitochondrial dysfunction and oxidative damage in parkin-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      provide the first direct evidence of mitochondrial dysfunction and
      oxidative damage in the absence of nigral degeneration in a genetic mouse
      model of Parkinson's disease
    explanation: >-
      Confirms the dissociation: the upstream mitochondrial/oxidative phenotype
      is faithfully modelled while the downstream degeneration is not.
  - reference: PMID:23459986
    reference_title: "Parkin disease: a clinicopathologic entity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuronal counts in the substantia nigra pars compacta revealed that
      neuronal loss in the parkin cases was as severe as that seen in PD
    explanation: >-
      The human side of the mismatch: severe nigral loss is unambiguous in
      biallelic parkin patients.
- discussion_id: gap_prkn_nigral_selectivity
  prompt: >-
    What makes substantia nigra pars compacta dopaminergic neurons - and
    specifically the ventral tier - selectively vulnerable to loss of
    parkin-dependent mitophagy, when parkin is broadly expressed and the
    PINK1-parkin pathway operates in all cell types?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Mitophagy
  - pathophysiology#Selective Dopaminergic Neuron Loss in the Substantia Nigra Pars Compacta
  rationale: >-
    Parkin is expressed in many human tissues, yet biallelic loss produces a
    strikingly organ- and even sub-nucleus-restricted phenotype: severe ventral
    nigral loss with relative dorsal-tier preservation, mild locus coeruleus and
    dorsal vagal involvement, and sparing of the nucleus basalis of Meynert and
    raphe. No mechanism in this entry's pathograph explains that selectivity;
    the mitophagy defect as modelled is cell-type agnostic. Resolving this is
    the difference between a generic mitochondrial-quality-control story and an
    account that predicts which neurons die. Candidate but unresolved factors
    include the exceptionally large unmyelinated axonal arbor and consequent
    bioenergetic load of nigral dopaminergic neurons, autonomous pacemaking with
    sustained calcium influx, dopamine metabolism as an endogenous oxidant
    source, and regional differences in baseline mitophagic flux.

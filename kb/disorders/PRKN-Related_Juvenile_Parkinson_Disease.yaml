notes: >-
  Lump-vs-split rationale: this entry is deliberately kept SEPARATE from the
  existing `Parkinsons_Disease` entry (MONDO:0005180), which curates the
  common, largely sporadic, late-onset alpha-synucleinopathy. The two are
  complementary rather than redundant. (1) Different mechanism anchor: the
  dismech `Parkinsons_Disease` graph is built on misfolded alpha-synuclein
  aggregation and Lewy-body pathology, whereas PARK-PRKN is a monogenic
  mitochondrial-quality-control (PINK1-parkin mitophagy) disorder in which
  Lewy bodies are usually absent. (2) Different neuropathology: PARK-PRKN
  shows predominantly ventral-tier nigral loss with relative dorsal-tier
  preservation and absent or rare Lewy bodies (PMID:23459986). (3) Different
  clinical signature: early median onset, dystonia at presentation,
  hyperreflexia, excellent sustained levodopa response with early dyskinesias,
  and slow progression. (4) Different actionable genetics: the mutational
  spectrum is dominated by whole-exon deletions and duplications that
  sequencing-only panels miss, so dosage analysis (e.g. MLPA) is required.
  The existing `Parkinsons_Disease` entry already lists PRKN in its `genetic`
  section as one contributor to the broader PD gene landscape; that remains
  appropriate and is not duplicated here. ClinGen curates the PRKN
  gene-disease relationship at the broad "Parkinson disease" (MONDO:0005180)
  level rather than against MONDO:0010820, which is why the gene-validity
  evidence in this entry cites that broader assertion.
  Named-entity-confusion (NEC) preflight was performed before curation: the
  PARK numbered series is a high-NEC-risk class and PARK2/PRKN, PARK6/PINK1
  and PARK7/DJ-1 are frequently conflated in the literature. MONDO:0010820 was
  confirmed via OAK to carry `RO:0004003 HGNC:8607 ! PRKN`, `xref OMIM:600116`,
  and the synonyms "PARK2" and "PRKN young-onset Parkinson disease". All
  evidence in this entry was checked to be about PRKN/parkin rather than PINK1
  or DJ-1; where a cited study reports PRKN and PINK1 jointly (PMID:33029617,
  PMID:29644727) that joint scope is stated explicitly in the evidence
  explanation.
  Deep-research provenance: a `claude_code` deep-research run was performed
  (`research/PRKN-Related_Juvenile_Parkinson_Disease-deep-research-claude_code.md`
  plus its `.citations.md` sidecar; 13 web searches, 42 citations, 306 s).
  It was used as a completeness cross-check only - every claim in this entry is
  sourced to a `just fetch-reference`-cached primary reference that was read
  directly, not to the DR narrative. A gene-frequency NEC check on the report
  itself passed: PRKN/PARK2 is mentioned ~108 times versus PINK1 13 and DJ-1 2,
  confirming the report resolved to the intended entity rather than a PARK-series
  sibling.
  Retracted-literature note: PMID:30135585 (Sliter et al., Nature 2018,
  "Parkin and PINK1 mitigate STING-induced inflammation") is the most widely
  cited source for the parkin-STING innate-immune arm, but it was RETRACTED in
  2025 (Nature 644:1116). It is therefore deliberately NOT cited anywhere in
  this entry. The innate-immune arm is instead sourced to the independent
  human study PMID:33029617.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    PARK-PRKN is inherited in an autosomal recessive manner; affected
    individuals carry biallelic (homozygous or compound heterozygous)
    pathogenic PRKN variants. Heterozygous carriers are generally unaffected,
    although heterozygosity has been proposed as a Parkinson disease risk
    factor.
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PARK-PRKN is inherited in an autosomal recessive manner."
    explanation: >-
      GeneReviews states the mode of inheritance directly, supporting the
      HP:0000007 binding.
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PARK-PRKN is established in a proband with suggestive
      findings and biallelic pathogenic variants in PRKN identified by
      molecular genetic testing.
    explanation: >-
      Confirms that two pathogenic PRKN alleles are required, i.e. recessive
      rather than dominant gene action.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No direct population-based prevalence estimate for PARK-PRKN specifically
    was identified in the sources used for this entry, so only the coarse
    qualitative band is asserted. The rarity can be bounded indirectly: only a
    small minority of Parkinson disease is early-onset, and only a minority of
    early-onset cases carry biallelic PRKN variants (see the structured
    `case_fractions` on the PRKN `genetic` entry, which is the well-quantified
    dimension). Do not read this record as a measured rate.
  evidence:
  - reference: PMID:22956510
    reference_title: "Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 3.6% of patients with Parkinson's disease develop symptoms
      before age 45.
    explanation: >-
      Supports the rarity band only indirectly. It quantifies the early-onset
      Parkinson disease denominator, not the prevalence of PARK-PRKN itself;
      PRKN-attributable cases are a minority of that already small subgroup.
      Marked PARTIAL because the quoted statistic does not measure this
      disease's occurrence.
progression:
- phase: Age at onset
  notes: >-
    Median age at onset approximately 31 years, with a very wide reported range
    (1-84 years). Progression is slow and disease duration of more than 60
    years has been reported, in contrast to the more rapid course typical of
    late-onset Parkinson disease.
  evidence:
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at onset is 31 years (range: 1-84 years)."
    explanation: GeneReviews gives the median and range of age at onset.
  - reference: PMID:20301651
    reference_title: "PRKN-Related Early-Onset Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease is slowly progressive: a disease duration of more than 60
      years has been reported.
    explanation: Supports the slow rate of progression and long disease duration.
  - reference: PMID:29644727
    reference_title: "Genotype-Phenotype Relations for the Parkinson's Disease Genes Parkin, PINK1, DJ1: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      median age at onset of ∼30 years for carriers of at least 2 mutations in
      any of the 3 genes
    explanation: >-
      Independent systematic-review confirmation of the early median onset.
      Note the MDSGene figure pools carriers of biallelic variants in Parkin,
      PINK1 or DJ1 rather than PRKN alone.
genetic:
- name: PRKN
  gene_term:
    preferred_term: PRKN
    term:
      id: hgnc:8607
      label: PRKN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: present
  association: >-
    Biallelic loss-of-function variants in PRKN (formerly PARK2), encoding the
    RING-between-RING E3 ubiquitin ligase parkin, cause autosomal recessive
    juvenile/early-onset Parkinson disease. The gene lies at 6q25.2-q27, spans
    more than 500 kb, and has 12 exons.
  notes: >-
    MUTATIONAL SPECTRUM - CLINICALLY IMPORTANT: large intragenic copy-number
    changes (whole-exon deletions and duplications/multiplications) are a major
    component of the PRKN mutational spectrum, alongside point mutations, and
    the first pathogenic alleles ever described in this gene were exon
    deletions. This is consistent with the gene's very large genomic footprint
    (>500 kb across 12 exons). The practical consequence is that a
    sequencing-only panel or exome cannot detect this class of allele at all:
    exon-dosage analysis (MLPA or an equivalent copy-number method) is required
    to avoid false-negative genetic testing, and an apparently "single
    heterozygous point mutation" result should prompt dosage testing for a
    second, exonic rearrangement allele in trans. Deliberately NOT asserted
    here: the proportion of patients or alleles attributable to rearrangements
    versus point mutations. The cited sources report counts of DISTINCT variant
    types (19 rearrangements vs 16 point mutations in PMID:10824074), which is
    not the same quantity, and no source examined reports the allele-share
    split.
  evidence:
  - reference: PMID:9560156
    reference_title: "Mutations in the parkin gene cause autosomal recessive juvenile parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the newly identified gene appear to be responsible for the
      pathogenesis of AR-JP, and we have therefore named the protein product
      'Parkin'.
    explanation: >-
      The original positional-cloning report establishing PRKN/parkin as the
      gene underlying autosomal recessive juvenile parkinsonism.
  - reference: PMID:9560156
    reference_title: "Mutations in the parkin gene cause autosomal recessive juvenile parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene spans more than 500 kilobases and has 12 exons, five of which
      (exons 3-7) are deleted in the patient. Four other AR-JP patients from
      three unrelated families have a deletion affecting exon 4 alone.
    explanation: >-
      Documents the gene structure and the founding observation that
      multi-exon and single-exon deletions - not point mutations - were the
      first pathogenic alleles identified, anchoring the CNV-dominant
      mutational spectrum.
  - reference: PMID:10824074
    reference_title: "Association between early-onset Parkinson's disease and mutations in the parkin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nineteen different rearrangements of exons (deletions and
      multiplications) and 16 different point mutations were detected.
    explanation: >-
      Quantifies the DIVERSITY of the mutational spectrum in a large
      multicentre series: 19 distinct exonic rearrangements versus 16 distinct
      point mutations. Note this counts distinct variant types, NOT the share of
      alleles or patients attributable to each class - the abstract does not
      report that split - so the claim made here is only that exonic
      rearrangements are a large and irreducible part of the spectrum, which is
      why copy-number analysis is required for complete PRKN testing.
  - reference: CGGV:assertion_6b39c4a0-f6bd-4afc-b2a7-f234eab5a667-2023-01-18T190000.000Z
    reference_title: "PRKN / Parkinson disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PRKN | HGNC:8607 | Parkinson disease | MONDO:0005180 | AR | Definitive"
    explanation: >-
      The ClinGen Parkinson's Disease Gene Curation Expert Panel classifies the
      PRKN gene-disease relationship as Definitive with autosomal recessive
      inheritance. ClinGen curates this against the broad Parkinson disease
      concept (MONDO:0005180) rather than against MONDO:0010820.
  case_fractions:
  - population: >-
      Early-onset Parkinson disease, pooled systematic review of previously
      reported studies
    case_fraction_percent: 8.6
    cohort_size: 5800
    notes: >-
      Weighted mean proportion of early-onset Parkinson disease cases carrying
      PARK2/PRKN mutations across a systematic review of more than 5800 unique
      cases. The authors state only that the overall frequency was lower than
      previously estimated; they do not attribute that gap to any specific
      cause, so no explanation for it is asserted here.
    evidence:
    - reference: PMID:22956510
      reference_title: "Systematic review and UK-based study of PARK2 (parkin), PINK1, PARK7 (DJ-1) and LRRK2 in early-onset Parkinson's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our systematic review included information from >5800 unique cases.
        Overall, the weighted mean proportion of cases with PARK2 (parkin),
        PINK1, and PARK7 (DJ-1) mutations was 8.6%, 3.7%, and 0.4%,
        respectively.
      explanation: >-
        Directly quantifies the PARK2/PRKN share of early-onset Parkinson
        disease cases in a pooled systematic review.
  - population: >-
      European families with early-onset Parkinson disease (onset at or before
      age 45, unaffected parents)
    case_fraction_percent: 49.0
    cohort_size: 73
    notes: >-
      Family-ascertained cohort, so this fraction is substantially higher than
      the pooled systematic-review estimate; recessive inheritance is enriched
      by requiring an affected sib-ship with unaffected parents.
    evidence:
    - reference: PMID:10824074
      reference_title: "Association between early-onset Parkinson's disease and mutations in the parkin gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among the families with early-onset Parkinson's disease, 36 (49
        percent) had parkin mutations.
      explanation: Direct case-fraction statistic for the familial EOPD cohort.
  - population: >-
      Isolated (non-familial) Parkinson disease with age at onset 20 years or
      younger
    case_fraction_percent: 77.0
    cohort_size: 13
    notes: >-
      The case fraction is strongly age-at-onset dependent: 77% at onset 20
      years or younger versus only 3% at onset over 30 years in the same study.
      Small denominator (13 patients) for the youngest stratum.
    evidence:
    - reference: PMID:10824074
      reference_title: "Association between early-onset Parkinson's disease and mutations in the parkin gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among the patients with isolated Parkinson's disease, mutations were
        detected in 10 of 13 patients (77 percent) with an age at onset of 20
        years or younger, but in only 2 of 64 patients (3 percent) with an age
        at onset of more than 30 years.
      explanation: >-
        Quantifies the steep dependence of the PRKN case fraction on age at
        onset, with both the youngest and the older strata reported.
pathophysiology:
- name: PRKN Biallelic Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous or compound heterozygous loss-of-function PRKN alleles - most
    often whole-exon deletions or duplications, and less often point mutations
    - abolish functional parkin, an E3 ubiquitin ligase. This is the initiating
    molecular lesion of PARK-PRKN.
  genes:
  - preferred_term: PRKN
    term:
      id: hgnc:8607
      label: PRKN
  gene:
    preferred_term: PRKN
    term:
      id: hgnc:8607
      label: PRKN
  molecular_functions:
  - preferred_term: parkin ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:9560156
    reference_title: "Mutations in the parkin gene cause autosomal recessive juvenile parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      encoding a protein of 465 amino acids with moderate similarity to
      ubiquitin at the amino terminus and a RING-finger motif at the carboxy
      terminus
    explanation: >-
      Identifies parkin as a RING-finger (E3 ubiquitin ligase family) protein
      disrupted by deletion in AR-JP patients.
  - reference: PMID:24784582
    reference_title: "Ubiquitin is phosphorylated by PINK1 to activate parkin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PINK1 (PTEN induced putative kinase 1) and PARKIN (also known as PARK2)
      have been identified as the causal genes responsible for hereditary
      recessive early-onset Parkinsonism.
    explanation: >-
      Confirms PRKN/PARK2 as a causal gene for hereditary recessive
      early-onset parkinsonism and situates it in the PINK1-parkin axis.
  downstream:
  - target: Failure of Phospho-Ubiquitin-Dependent Parkin Recruitment and E3 Ligase Activation
    causal_link_type: DIRECT
    description: >-
      With no functional parkin protein, the recruitment/activation step of the
      PINK1-parkin axis cannot proceed regardless of an intact upstream PINK1
      signal.
    evidence:
    - reference: PMID:20126261
      reference_title: "PINK1 is selectively stabilized on impaired mitochondria to activate Parkin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        disease-causing mutations in PINK1 and Parkin disrupt Parkin
        recruitment and Parkin-induced mitophagy at distinct steps
      explanation: >-
        Shows directly that disease-causing parkin mutations break the
        recruitment/mitophagy pathway.
- name: Mitochondrial Depolarization
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss of inner mitochondrial membrane potential marks an individual
    mitochondrion as damaged. This is the upstream damage state that the
    PINK1-parkin quality-control system detects; it is scale-MOLECULAR and is
    modelled separately from the PINK1 sensing response it triggers.
  biological_processes:
  - preferred_term: mitochondrial depolarization
    term:
      id: GO:0051882
      label: mitochondrial depolarization
  evidence:
  - reference: PMID:20126261
    reference_title: "PINK1 is selectively stabilized on impaired mitochondria to activate Parkin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Parkin is selectively recruited to damaged mitochondria that have lost
      their membrane potential
    explanation: >-
      Establishes loss of membrane potential as the damage state that the
      pathway acts on.
  downstream:
  - target: PINK1 Accumulation on the Outer Mitochondrial Membrane
    causal_link_type: DIRECT
    description: >-
      Depolarization blocks the voltage-dependent proteolysis that normally
      keeps outer-membrane PINK1 low, so PINK1 accumulates selectively on the
      depolarized organelle.
    evidence:
    - reference: PMID:20126261
      reference_title: "PINK1 is selectively stabilized on impaired mitochondria to activate Parkin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we show that expression of PINK1 on individual mitochondria is regulated
        by voltage-dependent proteolysis to maintain low levels of PINK1 on
        healthy, polarized mitochondria, while facilitating the rapid
        accumulation of PINK1 on mitochondria that sustain damage
      explanation: >-
        Directly demonstrates that membrane potential gates PINK1 abundance on
        the outer membrane.
- name: PINK1 Accumulation on the Outer Mitochondrial Membrane
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Full-length PINK1 accumulates on the outer membrane of the depolarized
    organelle with its kinase domain facing the cytosol. This is the
    damage-sensing step that flags an individual mitochondrion for disposal and
    is the immediate upstream requirement for parkin recruitment.
  biological_processes:
  - preferred_term: PINK1 kinase autophosphorylation and stabilization
    term:
      id: GO:0018105
      label: peptidyl-serine phosphorylation
  evidence:
  - reference: PMID:20126261
    reference_title: "PINK1 is selectively stabilized on impaired mitochondria to activate Parkin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Selective accumulation of PINK1 on the impaired mitochondria recruits
      Parkin, and Parkin, in turn, induces the degradation of the damaged
      mitochondria.
    explanation: >-
      States the sensing step and its immediate consequence for parkin
      recruitment.
  downstream:
  - target: Failure of Phospho-Ubiquitin-Dependent Parkin Recruitment and E3 Ligase Activation
    causal_link_type: DIRECT
    description: >-
      Accumulated PINK1 is necessary and sufficient to recruit parkin; in
      PARK-PRKN the PINK1 signal is generated normally but has no competent
      effector.
    evidence:
    - reference: PMID:20126261
      reference_title: "PINK1 is selectively stabilized on impaired mitochondria to activate Parkin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        PINK1 accumulation on mitochondria is both necessary and sufficient for
        Parkin recruitment to mitochondria
      explanation: >-
        Defines the causal dependency of parkin recruitment on PINK1
        accumulation.
- name: Failure of Phospho-Ubiquitin-Dependent Parkin Recruitment and E3 Ligase Activation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Mitochondrial PINK1 phosphorylates ubiquitin at Ser65. Phospho-ubiquitin is
    the genuine parkin activator: it binds parkin allosterically, unlocking the
    autoinhibited catalytic cysteine, while PINK1-dependent phosphorylation of
    parkin itself completes full activation. In PARK-PRKN this convergence step
    fails because parkin is absent or catalytically dead, so the Ser65
    phospho-ubiquitin signal is generated but not transduced.
  molecular_functions:
  - preferred_term: parkin E3 ubiquitin ligase activation
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: PINK1-mediated ubiquitin Ser65 phosphorylation
    term:
      id: GO:0018105
      label: peptidyl-serine phosphorylation
  evidence:
  - reference: PMID:24784582
    reference_title: "Ubiquitin is phosphorylated by PINK1 to activate parkin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we report that ubiquitin is the genuine substrate of PINK1. PINK1
      phosphorylated ubiquitin at Ser 65 both in vitro and in cells
    explanation: >-
      Identifies ubiquitin Ser65 as the PINK1 substrate that constitutes the
      activating signal.
  - reference: PMID:24784582
    reference_title: "Ubiquitin is phosphorylated by PINK1 to activate parkin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The phosphorylation-dependent interaction between ubiquitin and parkin
      suggests that phosphorylated ubiquitin unlocks autoinhibition of the
      catalytic cysteine.
    explanation: >-
      Provides the allosteric mechanism by which phospho-ubiquitin activates
      parkin's latent E3 activity.
  - reference: PMID:24784582
    reference_title: "Ubiquitin is phosphorylated by PINK1 to activate parkin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PINK1 acts as an upstream factor for parkin and is essential both for the
      activation of latent E3 parkin activity and for recruiting parkin onto
      depolarized mitochondria.
    explanation: >-
      States the epistatic ordering (PINK1 upstream of parkin) and the dual
      recruitment/activation role.
  downstream:
  - target: Loss of Ubiquitination of Outer Mitochondrial Membrane Substrates
    causal_link_type: DIRECT
    description: >-
      Activated parkin is the enzyme that transfers ubiquitin onto
      outer-membrane proteins; without activation this transfer does not occur.
    evidence:
    - reference: PMID:24784582
      reference_title: "Ubiquitin is phosphorylated by PINK1 to activate parkin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        parkin is an E3 ubiquitin ligase that catalyses ubiquitin transfer to
        mitochondrial substrates
      explanation: >-
        Establishes the enzymatic step that is lost downstream of failed parkin
        activation.
- name: Loss of Ubiquitination of Outer Mitochondrial Membrane Substrates
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Activated parkin decorates outer mitochondrial membrane proteins with
    ubiquitin chains, which are further phosphorylated by PINK1 to generate a
    feed-forward amplification loop and to build the autophagy-receptor
    recognition signal on the damaged organelle. In PARK-PRKN this ubiquitin
    coat is not deposited, so the damaged mitochondrion is never tagged for
    disposal.
  biological_processes:
  - preferred_term: ubiquitination of outer mitochondrial membrane substrates
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:24784582
    reference_title: "Ubiquitin is phosphorylated by PINK1 to activate parkin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that PINK1-dependent phosphorylation of both parkin and
      ubiquitin is sufficient for full activation of parkin E3 activity.
    explanation: >-
      Supports that parkin E3 activity - and hence substrate ubiquitination -
      is the output of this module and is lost when parkin is absent.
  downstream:
  - target: Impaired Mitophagy
    causal_link_type: DIRECT
    description: >-
      The parkin-deposited ubiquitin signal is what commits the damaged
      mitochondrion to autophagic engulfment; its absence blocks mitophagy.
    evidence:
    - reference: PMID:20126261
      reference_title: "PINK1 is selectively stabilized on impaired mitochondria to activate Parkin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Parkin is selectively recruited from the cytosol to damaged
        mitochondria to trigger their autophagy.
      explanation: >-
        Links parkin action on damaged mitochondria directly to their
        autophagic degradation.
- name: Impaired Mitophagy
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-

name: PRKN-Related Juvenile Parkinson Disease
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Autosomal recessive juvenile Parkinson disease 2 (PARK2 / PARK-PRKN) is an
  early-onset parkinsonian disorder caused by biallelic loss-of-function
  variants in PRKN, which encodes the RING-between-RING E3 ubiquitin ligase
  parkin. Parkin is the downstream effector of the PINK1-parkin mitochondrial
  quality-control axis: mitochondrial depolarization stabilizes PINK1 on the
  outer mitochondrial membrane, PINK1 phosphorylates ubiquitin at Ser65 to
  recruit and allosterically activate parkin, and parkin then ubiquitinates
  outer-membrane substrates to mark the damaged organelle for autophagic
  clearance (mitophagy). Biallelic parkin loss disables this arm, allowing
  damaged mitochondria, oxidative damage, and released mitochondrial DNA to
  accumulate, with selective degeneration of substantia nigra pars compacta
  dopaminergic neurons and consequent nigrostriatal dopamine deficiency.
  Clinically the disorder is distinguished from common late-onset Parkinson
  disease by its early median onset (~31 years), frequent lower-limb dystonia
  at presentation, hyperreflexia, an excellent and sustained levodopa response
  complicated by early levodopa-induced dyskinesias, slow progression, and
  cognitive decline no more frequent than in the general population.
  Neuropathologically it is characterized by severe but topographically
  restricted (predominantly ventral) nigral neuronal loss that is usually
  Lewy-body negative, a genuine point of divergence from idiopathic Parkinson
  disease.
category: Mendelian
parents:
- Neurodegenerative Disease
- Movement Disorder

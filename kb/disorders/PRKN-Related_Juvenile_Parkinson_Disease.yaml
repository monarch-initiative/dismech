- name: Selective Dopaminergic Neuron Loss in the Substantia Nigra Pars Compacta
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Dopaminergic neurons of the substantia nigra pars compacta degenerate. In
    autopsy-confirmed parkin disease the magnitude of nigral neuronal loss is
    as severe as in idiopathic Parkinson disease, but the topography differs:
    loss is predominantly ventral with relative preservation of the dorsal
    tier. Mild neuronal loss also occurs in the locus coeruleus and dorsal motor
    nucleus of the vagus, but not in the nucleus basalis of Meynert, raphe
    nucleus, or other brain regions - a markedly more restricted distribution
    than in idiopathic Parkinson disease.

name: Immunodeficiency Due To MASP-2 Deficiency
creation_date: "2026-10-15T02:18:25Z"
category: Mendelian
description: >-
  MASP-2 deficiency is an inherited defect of the lectin pathway of complement
  caused, in Europeans, by homozygosity for the MASP2 missense variant
  c.359A>G (p.D120G, rs72550870). MASP-2 is the protease that cleaves C4 after
  a lectin-pathway recognition molecule - mannose-binding lectin, a ficolin or
  a collectin - has bound its ligand, so it is the one component of the arm
  that none of the others can substitute for. The D120G substitution abolishes
  the interaction with mannose-binding lectin, so no C4 is cleaved and lectin
  pathway activity is lost completely rather than partially.

  Whether that loss is a disease is genuinely unsettled, and this entry curates
  the dispute rather than resolving it. The deficiency was reported in 2003 in
  an adult with autoimmune and inflammatory disease and recurrent pneumococcal
  infection, and has been listed since 2004 among the primary immunodeficiencies
  as a complement defect predisposing to pyogenic infection, inflammatory lung
  disease and autoimmunity. Against that, the largest targeted study found no
  homozygote among 1495 adults hospitalised with community-acquired pneumonia,
  103 children with invasive pneumococcal disease or 186 patients with systemic
  lupus erythematosus, while finding homozygotes among its healthy controls;
  its review of the literature counted eleven affected individuals with no
  shared phenotype against nine healthy homozygotes, nearly all of both groups
  found by chance in association studies. Its authors conclude that MASP-2 is
  largely redundant in human defence. Supporting negative results come from a
  neonatal cohort, a cystic fibrosis cohort and a MASP-2-deficient mouse line.
  The positive signals that survive are narrow: an excess of febrile
  neutropenia in children receiving chemotherapy, and two adults with herpes
  simplex encephalitis carrying rare MASP2 variants other than D120G.

  So the honest reading is of a complete, well-characterised molecular lesion
  with no established clinical penetrance. The entry records both readings, with
  the contradicting evidence curated as REFUTE items rather than omitted.

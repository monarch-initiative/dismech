classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A primary complement deficiency listed among the inborn errors of immunity
      and discussed in terms of pyogenic infection and autoimmunity, placing it
      in Harrison's immune/rheumatologic Part beside the sibling
      Ficolin_3_Deficiency and Complement_Component_2_Deficiency entries.
  iuis_category:
    classification_value: complement deficiency
    notes: >-
      IUIS Table 8 carries a MASP2 deficiency row. This is the lectin-pathway
      enzyme row, as distinct from the lectin-pathway recognition-molecule row
      that Ficolin_3_Deficiency carries.
inheritance:
- name: Autosomal Recessive
  description: >-
    The deficiency state requires homozygosity for MASP2 p.D120G. Heterozygotes
    have reduced serum MASP-2 but retain lectin-pathway function and are not
    described as a disease state.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Europeans, MASP-2 deficiency, due to homozygosity for c.359A > G"
    explanation: >-
      States that the deficiency state is the homozygous genotype, which is what
      the recessive mode of inheritance rests on.
  - reference: PMID:19307021
    reference_title: "Mannan-binding lectin-associated serine protease-2 (MASP-2) in a large cohort of neonates and its clinical associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for this allele significantly influenced the protein concentration, but not the lectin pathway of complement activity"
    explanation: >-
      Separates the heterozygous carrier state, which lowers protein level
      without abolishing function, from the homozygous deficiency.
pathophysiology:
- name: MASP2 p.D120G Loss of Binding to Lectin Pathway Recognition Molecules
  biological_scale: MOLECULAR
  description: >-
    MASP-2 circulates in complexes with the recognition molecules of the lectin
    pathway and is activated when one of them binds a microbial or altered-self
    surface. The p.D120G substitution falls in the region that mediates that
    association: recombinant D120G MASP-2 does not bind mannose-binding lectin,
    so the enzyme is never recruited to a recognised surface. The variant is
    found in Europeans and in Inuit from West Greenland and not in the other
    populations surveyed.
  genetic_context:
    gene:
      preferred_term: MASP2
      term:
        id: hgnc:6902
        label: MASP2
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: MASP-2 serine protease activity on recognised surfaces
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:19234189
    reference_title: "Polymorphisms in mannan-binding lectin (MBL)-associated serine protease 2 affect stability, binding to MBL, and enzymatic activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that D120G and CHNHdup could not associate with MBL, whereas R99Q, P126L, H155R, V377A, R439H, and wild-type MASP-2 bound equally well to MBL."
    explanation: >-
      The direct demonstration, in recombinant protein, that D120G abolishes the
      interaction with the recognition molecule. This is what LOSS_OF_FUNCTION
      rests on, and it distinguishes D120G from the several MASP2 polymorphisms
      that bind normally.
  - reference: PMID:17252003
    reference_title: "Deficiency of mannan-binding lectin associated serine protease-2 due to missense polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.D120G was found only in Caucasians and Inuits from West-Greenland."
    explanation: >-
      Establishes the population distribution of the causal allele, which is why
      the prevalence record below is restricted to Europeans.
  downstream:
  - target: Failure of Lectin Pathway C4 Cleavage
    causal_link_type: DIRECT
    description: >-
      An enzyme that cannot be recruited to a recognised surface cannot cleave
      the substrate waiting there, so the binding defect is the whole of the
      functional defect.
    evidence:
    - reference: PMID:19234189
      reference_title: "Polymorphisms in mannan-binding lectin (MBL)-associated serine protease 2 affect stability, binding to MBL, and enzymatic activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "when D120G and CHNHdup were mixed with MBL, no activation of complement factor C4 was observed"
      explanation: >-
        Tests the two steps in the same experiment: the variants that fail to
        associate with MBL are the variants that produce no C4 activation.
- name: Failure of Lectin Pathway C4 Cleavage
  biological_scale: MOLECULAR
  description: >-
    C4 is cleaved by MASP-2 alone among the MASPs, so loss of MASP-2 function
    removes the lectin pathway's route to the C3 convertase C4b2a and abolishes
    lectin-pathway activity outright. This is a stronger molecular lesion than a
    recognition-molecule deficiency such as ficolin-3 deficiency, where the
    remaining recognition molecules still reach the same enzyme. The classical
    and alternative pathways are unaffected.
  biological_processes:
  - preferred_term: complement activation, lectin pathway
    term:
      id: GO:0001867
      label: complement activation, lectin pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "is an indispensable enzyme for the activation of the lectin pathway of complement"
    explanation: >-
      States that the enzyme is non-redundant within the pathway, which is why
      the block is complete. The sentence is the paper's framing of MASP-2
      biology rather than its own measurement.
  - reference: PMID:15654829
    reference_title: "Deficiency of the mannan-binding lectin pathway of complement and poor outcome in cystic fibrosis: bacterial colonization may be decisive for a relationship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As expected, MBL pathway function in serum was reduced both in MBL-deficient patients and in patients carrying a mutant MASP-2 allele."
    explanation: >-
      Confirms in patient serum, rather than in recombinant protein, that
      carrying a mutant MASP2 allele reduces measured lectin-pathway function.
  downstream:
  - target: Reduced Lectin Pathway Opsonization of Microbial Surfaces
    causal_link_type: DIRECT
    description: >-
      C4b and the C3 convertase it forms are what deposit opsonins on a
      recognised surface, so a pathway that cannot cleave C4 deposits none by
      this route.
  - target: Impaired Lectin Pathway Antiviral Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed rather than established. The herpes simplex encephalitis report
      that motivates this node measured reduced antiviral activity for a rare
      MASP2 variant, not for D120G, so the edge is drawn from a different
      genetic lesion in the same gene, and how lectin-pathway activity restrains
      the virus is not established.
- name: Reduced Lectin Pathway Opsonization of Microbial Surfaces
  biological_scale: CELLULAR
  description: >-
    With no lectin-pathway C4 cleavage, complement opsonins are not deposited by
    this route, and complement-receptor-mediated uptake of the organism by
    neutrophils and macrophages is correspondingly reduced. This is the
    mechanism the classification of MASP-2 deficiency as a primary
    immunodeficiency assumes. Whether it produces measurable susceptibility in
    people is the entry's central open question: the classical and alternative
    pathways still opsonise, and the evidence below runs both ways.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: opsonization
    term:
      id: GO:0008228
      label: opsonization
    modifier: DECREASED
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Its deficiency is classified as a primary immunodeficiency associated to pyogenic bacterial infections, inflammatory lung disease, and autoimmunity."
    explanation: >-
      Records the standing classification that this node represents. The
      sentence reports how the deficiency is classified, not a measurement the
      paper made, and the same paper's own conclusion is curated as the REFUTE
      item below.
  - reference: PMID:17984804
    reference_title: "Deficiency of mannose-binding lectin-associated serine protease-2 associated with increased risk of fever and neutropenia in pediatric cancer patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "In this study, MASP-2 deficiency was associated with an increased risk of FN in children treated with chemotherapy for cancer."
    explanation: >-
      The clearest positive clinical signal in the literature, and the support
      is indirect in two ways: deficiency here is a low serum MASP-2
      concentration rather than a genotype, and the children were neutropenic
      from chemotherapy, so the finding bears on MASP-2 as a contributory factor
      under a second immune defect rather than on the deficiency alone.
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Cumulative evidence suggests that MASP-2, and even other components of the LP, are largely redundant in human defenses and that individuals with MASP-2 deficiency do not seem to be particularly prone to infectious or autoimmune diseases."
    explanation: >-
      The conclusion of the largest targeted study of the question,
      contradicting the claim that this node produces clinical susceptibility.
      Curated as REFUTE rather than omitted, because the disagreement is the
      state of the evidence.
  - reference: PMID:25548381
    reference_title: "Deficiency in mannose-binding lectin-associated serine protease-2 does not increase susceptibility to Trypanosoma cruzi infection."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Total absence of lectin pathway functional activity did not confer higher susceptibility to T. cruzi infection, suggesting that it plays a minor role in the immune response against this parasite."
    explanation: >-
      A MASP-2-deficient mouse line with no lectin-pathway activity at all is
      not more susceptible to a pathogen the pathway recognises in vitro. One
      organism in one species, so it bounds rather than settles the claim.
  downstream:
  - target: Recurrent Bacterial Infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The proposed route from the molecular lesion to the clinical phenotype
      that the primary-immunodeficiency classification asserts. The edge is
      contested, not established; see the attached discussion and the REFUTE
      items on this node.
  - target: Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired complement-dependent handling of microbial and altered-self
      surfaces is the route by which early complement deficiencies are held to
      cause autoimmunity, and it is the basis of the autoimmunity half of the
      standing classification. No study of MASP-2-deficient individuals has
      demonstrated it.
- name: Impaired Lectin Pathway Antiviral Activity
  biological_scale: CELLULAR
  description: >-
    Two adults with herpes simplex encephalitis carried rare heterozygous MASP2
    missense variants, G634R and R203W, which reduce or abolish secretion of the
    protein and, for G634R, prevent autoactivation of the zymogen and reduce
    antiviral activity in vivo. This node is a different genetic architecture
    from the rest of the entry - rare heterozygous alleles in adults, not D120G
    homozygosity - and the association rests on two cases, so the node records a
    proposed antiviral role for the pathway rather than an established mechanism
    of MASP-2 deficiency.
  evidence:
  - reference: PMID:31869396
    reference_title: "Herpes simplex encephalitis in adult patients with MASP-2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Altogether, these data suggest that MASP-2 deficiency can increase susceptibility to adult HSE."
    explanation: >-
      The authors' own conclusion, which they state as a suggestion. Graded
      INDIRECT because the inference runs from two cases plus in vitro and mouse
      work to a susceptibility claim about the human deficiency state.
  - reference: PMID:31869396
    reference_title: "Herpes simplex encephalitis in adult patients with MASP-2 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a lost capability to cleave MASP-2 precursor into its active form"
    explanation: >-
      The functional defect measured for the G634R allele, establishing that
      these are loss-of-function variants rather than incidental rare ones.
  downstream:
  - target: Herpes Simplex Virus Encephalitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed on the strength of two adult cases with functionally defective
      rare MASP2 alleles and a mouse model lacking the associated recognition
      molecule.
phenotypes:
- category: Immunological
  name: Recurrent Bacterial Infection
  description: >-
    Recurrent pyogenic infection is the phenotype the primary-immunodeficiency
    classification of MASP-2 deficiency asserts, and the 2003 index patient
    presented with it. No frequency is tagged, and that is the point of this
    record: the eleven published homozygous patients have no shared
    presentation, nine published homozygotes are healthy, and a study powered
    to find them identified no homozygote among 1495 adults with
    community-acquired pneumonia or 103 children with invasive pneumococcal
    disease. Both readings are curated below.
  phenotype_term:
    preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  evidence:
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Its deficiency is classified as a primary immunodeficiency associated to pyogenic bacterial infections, inflammatory lung disease, and autoimmunity."
    explanation: >-
      The standing classification that attributes pyogenic infection to this
      deficiency, quoted from the reviewing paper's framing of the field rather
      than from its own result.
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "a total of eleven patients with a highly heterogeneous range of disorders and nine healthy controls"
    explanation: >-
      Eleven affected individuals with no shared phenotype against nine healthy
      homozygotes is not the distribution a penetrant infection phenotype
      produces, which is why no frequency band is tagged on this record.
  - reference: PMID:19307021
    reference_title: "Mannan-binding lectin-associated serine protease-2 (MASP-2) in a large cohort of neonates and its clinical associations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "That group had a shorter mean gestational age and a higher incidence of premature and low birthweight babies, but not of perinatal infections when compared with the others."
    explanation: >-
      In 1788 neonates, biochemically MASP-2-deficient babies had no excess of
      perinatal infection. The deficiency here is defined by serum
      concentration, not genotype, so it bears on low MASP-2 generally rather
      than on the homozygous state specifically.
  - reference: PMID:15654829
    reference_title: "Deficiency of the mannan-binding lectin pathway of complement and poor outcome in cystic fibrosis: bacterial colonization may be decisive for a relationship."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No correlation to reduced lung function or need for lung transplantation was seen, either for MBL deficiency, MASP-2 gene mutation or reduced MBL pathway function."
    explanation: >-
      In a disease defined by chronic airway infection, where an opsonisation
      defect would be expected to show, MASP2 genotype did not track outcome.
- category: Immunological
  name: Autoimmunity
  description: >-
    Autoimmune and inflammatory disease was present in the index patient and is
    half of the standing classification, but no study of MASP-2-deficient
    individuals has borne it out. The targeted study found no p.D120G homozygote
    among 186 patients with systemic lupus erythematosus. No frequency is
    tagged.
  phenotype_term:
    preferred_term: Autoimmunity
    term:
      id: HP:0002960
      label: Autoimmunity
  evidence:
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "inflammatory lung disease, and autoimmunity"
    explanation: >-
      The autoimmunity half of the classification this record represents, quoted
      from the reviewing paper's framing rather than from its own result.
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals with MASP-2 deficiency do not seem to be particularly prone to infectious or autoimmune diseases"
    explanation: >-
      The study's own conclusion on the autoimmune half of the classification,
      reached after genotyping a lupus cohort and reviewing every published
      homozygote.
- category: Neurological
  name: Herpes Simplex Virus Encephalitis
  description: >-
    Reported in two adults carrying rare heterozygous MASP2 loss-of-function
    variants, G634R and R203W, identified in a screen of 15 adults with herpes
    simplex encephalitis against 294 controls. This is not the D120G homozygous
    deficiency the rest of the entry describes, and two cases cannot establish a
    phenotype; the record exists so the observation is visible rather than
    asserted as characteristic.
  phenotype_term:
    preferred_term: HSV encephalitis
    term:
      id: HP:0012302
      label: HSV encephalitis
  evidence:
  - reference: PMID:31869396
    reference_title: "Herpes simplex encephalitis in adult patients with MASP-2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Altogether, these data suggest that MASP-2 deficiency can increase susceptibility to adult HSE."
    explanation: >-
      The authors state the association as a suggestion drawn from two cases
      plus supporting functional and mouse data, which is why the support is
      graded indirect and no frequency is tagged.
prevalence:
- population: Europeans
  measure_type: UNKNOWN
  rate_low: 70.0
  rate_high: 140.0
  notes: >-
    7 to 14 per 10,000 Europeans, which is the frequency of the p.D120G
    homozygous genotype rather than of a clinical phenotype. measure_type is
    UNKNOWN for that reason: most carriers of this genotype identified so far
    were found in control groups and were healthy, so reading the figure as a
    disease prevalence would assert the penetrance this entry records as
    unsettled.

    No prevalence_class is set. The range straddles a band boundary - 7 per
    10,000 is below 1 in 1,000 and 14 per 10,000 is above it - so any single
    band would be a choice the source does not support. Only the range bounds
    (rate_low/rate_high) are recorded; no single rate_per_100000 is set, because
    the source gives a range and not a point estimate.
  evidence:
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "occurs in 7 to 14/10,000 individuals"
    explanation: >-
      The source of the range this record normalizes to cases per 100,000.
biochemical:
- name: Serum MASP-2 concentration
  presence: DECREASED
  notes: >-
    The screening abnormality. There is no single agreed cut-off: a neonatal
    cohort set deficiency at below 42 ng/ml in cord serum while a paediatric
    oncology study used below 200 ng/mL, and normal medians differ severalfold
    between populations. A low concentration is not the same claim as the
    homozygous genotype, and several of the clinical associations in this entry
    were made on concentration rather than on genotype.
  evidence:
  - reference: PMID:19307021
    reference_title: "Mannan-binding lectin-associated serine protease-2 (MASP-2) in a large cohort of neonates and its clinical associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonates with MASP-2 concentrations below 42 ng/ml were deemed to be MASP-2 deficient."
    explanation: >-
      One of the two operational definitions in use, and the one applied in the
      largest cohort.
  - reference: PMID:17252003
    reference_title: "Deficiency of mannan-binding lectin associated serine protease-2 due to missense polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MASP-2 levels were lowest in Africans from Zambia"
    explanation: >-
      Supports the caveat that normal ranges differ by population, so a single
      numeric threshold does not transfer between cohorts.
- name: Lectin pathway functional activity
  presence: DECREASED
  notes: >-
    The functional counterpart of the concentration measurement, and the one
    that distinguishes a deficiency state from a merely low level: homozygotes
    have no lectin-pathway activity, whereas heterozygotes have reduced protein
    with preserved activity.

    The two cohorts cited below disagree on heterozygote function. The neonatal
    cohort (PMID:19307021) found heterozygosity lowered the protein but not
    pathway activity; the cystic fibrosis cohort (PMID:15654829) found pathway
    function reduced in carriers of a mutant MASP-2 allele, who in that series
    were mostly heterozygous. The disagreement is left standing rather than
    resolved, because the two measured different populations with different
    assays.
  evidence:
  - reference: PMID:19307021
    reference_title: "Mannan-binding lectin-associated serine protease-2 (MASP-2) in a large cohort of neonates and its clinical associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for this allele significantly influenced the protein concentration, but not the lectin pathway of complement activity"
    explanation: >-
      Establishes that concentration and function come apart in heterozygotes,
      which is why both measurements are curated.
  - reference: PMID:15654829
    reference_title: "Deficiency of the mannan-binding lectin pathway of complement and poor outcome in cystic fibrosis: bacterial colonization may be decisive for a relationship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MBL pathway function in serum was reduced both in MBL-deficient patients and in patients carrying a mutant MASP-2 allele"
    explanation: >-
      Measured reduction of pathway function in serum from carriers of a mutant
      MASP2 allele.
genetic:
- name: MASP2
  gene_term:
    preferred_term: MASP2
    term:
      id: hgnc:6902
      label: MASP2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    p.D120G is the allele behind essentially every reported European case. Other
    MASP2 missense alleles lower the protein or its activity without abolishing
    pathway function - V377A lowers serum levels with normal enzyme activity,
    P126L gives serum that is non-functional in homozygotes (PMID:17252003)
    although recombinant P126L cleaves C4 with activity comparable to wild-type
    (PMID:19234189) - the two results are reported together rather than
    reconciled - R439H binds mannose-binding lectin but cannot autoactivate and
    is common in sub-Saharan Africa - so a MASP2 variant and MASP-2 deficiency
    are not interchangeable.

    The geographic distribution of the D120G allele has been read as selection
    for low lectin-pathway activity: a Siberian survey found it commoner in
    Russians than in the Nenets and Dolgan-Nganasan aboriginal populations. That
    is a hypothesis the authors advance, not a demonstrated history.

    No ClinGen gene-disease validity assertion is recorded here because none was
    found for this pair; gene_disease_validity is left absent rather than filled
    with a curator's own tier.
  evidence:
  - reference: PMID:31828694
    reference_title: "Should MASP-2 Deficiency Be Considered a Primary Immunodeficiency? Relevance of the Lectin Pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Europeans, MASP-2 deficiency, due to homozygosity for c.359A > G"
    explanation: >-
      Names the gene and the allele whose homozygosity defines the deficiency.
  - reference: PMID:19234189
    reference_title: "Polymorphisms in mannan-binding lectin (MBL)-associated serine protease 2 affect stability, binding to MBL, and enzymatic activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the R439H variant was deficient in this process despite its normal binding to MBL."
    explanation: >-
      Supports the notes' claim that MASP2 carries several functionally distinct
      alleles, of which D120G is one, with different molecular consequences.
  - reference: PMID:36574978
    reference_title: "Ficolin-3 and MASP-2 gene variants in Siberian arctic populations: Summarized evidence of selective pressure for the high frequency of lectin complement pathway deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of the rs72550870*G allele in the MASP2 gene associated with low serum protease activity was found to be increased in Russians compared with Nenets and Dolgan-Nganasans"
    explanation: >-
      The population-distribution observation behind the selection hypothesis
      recorded in the notes.
  variants:
  - name: p.D120G
    description: >-
      MASP2 c.359A>G, rs72550870. Abolishes association with mannose-binding
      lectin and so prevents lectin-pathway C4 cleavage; homozygosity is the
      deficiency state.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:19234189
      reference_title: "Polymorphisms in mannan-binding lectin (MBL)-associated serine protease 2 affect stability, binding to MBL, and enzymatic activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that D120G and CHNHdup could not associate with MBL"
      explanation: >-
        The functional consequence on which the pathogenic classification of
        this allele rests. The clinical consequence of carrying two copies is
        what this entry records as unsettled; the molecular consequence is not
        in dispute.
discussions:
- discussion_id: masp2_complete_lesion_without_penetrance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Lectin Pathway Opsonization of Microbial Surfaces
  - phenotypes#Recurrent Bacterial Infection
  prompt: >-
    Why does a complete, non-redundant block of the lectin pathway produce no
    consistent clinical phenotype, when comparably complete blocks of the
    classical and terminal pathways produce characteristic ones?
  rationale: >-
    The usual explanation offered for an unpenetrant lectin-pathway deficiency
    is redundancy among the recognition molecules: lose ficolin-3 and
    mannose-binding lectin still initiates. That explanation is unavailable
    here. MASP-2 is the only protease that cleaves C4, so D120G homozygotes have
    no lectin-pathway activity by any route, and they are still mostly healthy.
    The remaining candidates are redundancy of the whole pathway against the
    classical and alternative pathways, an effect too small for the cohorts
    assembled so far, or an effect confined to people with a second immune
    defect.

    The third is the one with a positive signal behind it: the febrile
    neutropenia association was found in children already neutropenic from
    chemotherapy. What would discriminate the three is a cohort of genotyped
    homozygotes followed prospectively, with any second immune defect recorded,
    rather than homozygotes recovered by chance from case-control studies -
    which is how almost every published individual was found.
- discussion_id: masp2_rare_variants_versus_d120g
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Lectin Pathway Antiviral Activity
  - phenotypes#Herpes Simplex Virus Encephalitis
  prompt: >-
    Do rare heterozygous MASP2 loss-of-function alleles belong to the same
    disease concept as D120G homozygosity?
  rationale: >-
    The herpes simplex encephalitis report is titled as MASP-2 deficiency, but
    its two patients are heterozygous for rare alleles that reduce secretion or
    block autoactivation, not homozygous for D120G. Heterozygotes for D120G have
    reduced MASP-2 protein with preserved pathway function, so if the
    encephalitis association is real it is unlikely to act through the same
    complete-pathway-loss mechanism, and may reflect a dominant-negative effect
    or a quantitative threshold specific to antiviral defence.

    dismech curates both under this entry because MONDO carries one term, but
    the two arms are kept as separate nodes and the phenotype record states
    which genotype it came from. Resolving this needs the two adults' alleles
    tested for pathway function in heterozygous serum, and D120G homozygotes
    assessed for herpes simplex encephalitis risk - neither of which has been
    done.
notes: >-
  The entry's literature was assembled directly from PubMed rather than from a
  narrative deep-research report: the configured Falcon/Edison provider failed
  authentication on two attempts. The committed Asta report
  (research/Immunodeficiency_Due_To_MASP-2_Deficiency-deep-research-asta.md) is
  retrieval-only and surfaced no MASP-2 source this entry does not already
  cite - its retrieval is dominated by unrelated immunodeficiency and
  proteomics papers, which its own 16-of-36 on-topic count reflects. Every
  claim here is cited from a reference fetched into references_cache.

  Four sources that bear directly on this disease carry no abstract in PubMed
  and so could not be quoted: the 2003 index case report PMID:12904520, the
  low-penetrance letter PMID:17137870, the Polish homozygote case report
  PMID:24332888 and the tuberculosis case series PMID:24658431. Their content
  reaches this entry only through PMID:31828694, which reviews all of them, and
  claims that exist only in those papers - the index patient's individual
  features, the single-case descriptions - are deliberately left uncurated
  rather than cited to a text that cannot be checked.

  The counts quoted in the description and the discussions - eleven affected
  homozygotes, nine healthy ones, the cohort sizes - come from PMID:31828694,
  whose abstract states the eleven-and-nine figure and the cohort sizes. The
  per-individual breakdown sits in that paper's tables rather than its abstract,
  so it is described here and not quoted as an evidence snippet.

  No GeneReviews chapter exists for this disease: `just check-genereviews`
  reports NO_CHAPTER against the entry's name, its synonyms and its MONDO term,
  against the committed Bookshelf index.

  No treatments are curated. Nothing in the literature reviewed describes a
  treatment of MASP-2 deficiency itself, and for a deficiency whose clinical
  consequence is unsettled, writing one in from general complement-deficiency
  practice would assert a disease needing treatment.

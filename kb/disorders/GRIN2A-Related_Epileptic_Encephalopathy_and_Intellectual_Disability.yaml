    An ultra-rare disorder. Across the whole GRIN2A phenotypic spectrum (of
    which this severe developmental and epileptic encephalopathy is a minority)
    a comprehensive 2019 curation assembled 248 individuals with pathogenic or
    likely pathogenic variants. No population-based prevalence or incidence
    estimate specific to the severe GRIN2A encephalopathy has been published.
  evidence:
  - reference: PMID:30544257
    reference_title: "GRIN2A-related disorders: genotype and functional consequence predict phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resulting in a total of 248 individuals"
    explanation: >-
      Total reported individuals across the GRIN2A spectrum, indicating
      ultra-rare occurrence.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    The diagnosis is established by identifying a heterozygous pathogenic
    GRIN2A variant, usually via exome or genome sequencing or an epilepsy gene
    panel. Because treatment direction depends on functional class, the variant
    should be localized to a protein domain and, where possible, functionally
    characterized.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27683935
    reference_title: "GRIN2A-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of a GRIN2A-related disorder is established in a proband by
      the identification of a GRIN2A heterozygous pathogenic variant on
      molecular genetic testing.
    explanation: >-
      Defines the molecular diagnostic criterion.
- name: NMDA Receptor Functional Assay for Variant Classification
  description: >-
    In vitro electrophysiological characterization (agonist potency,
    deactivation kinetics, magnesium block, calcium permeability, surface
    expression) assigns a GRIN2A variant to the gain-of-function or
    loss-of-function class. This assignment is a prerequisite for
    mechanism-directed therapy, because channel blockers and co-agonist
    supplementation are indicated in opposite functional classes.
  evidence:
  - reference: PMID:41489401
    reference_title: "Memantine treatment in individuals with GRIN gain-of-function variants is associated with improvements in behavior, development, and seizure frequency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our retrospective observational study outlines the importance of correct
      classification of GRIN variants with regard to pathogenicity and
      functional consequence prior to applying memantine or other precision
      medicine approaches in clinical trials.
    explanation: >-
      Establishes functional classification as a prerequisite for precision
      therapy.
  - reference: PMID:34997442
    reference_title: "L-Serine Treatment is Associated with Improvements in Behavior, EEG, and Seizure Frequency in Individuals with GRIN-Related Disorders Due to Null Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A second individual with a GoF missense variant was erroneously treated
      with L-serine and experienced immediate temporary behavioral deterioration
      further supporting the supposed functional pathomechanism.
    explanation: >-
      A misclassified variant led to clinical deterioration, showing that
      functional-class assignment is safety-critical, not merely academic.
differential_diagnoses:
- name: Landau-Kleffner Syndrome
  disease_term:
    preferred_term: Landau-Kleffner syndrome
    term:
      id: MONDO:0009509
      label: Landau-Kleffner syndrome
  description: >-
    The GRIN2A epilepsy-aphasia phenotype: previously normal children who lose
    acquired language in association with sleep-activated continuous
    spike-and-wave (ESES/CSWS). Distinguished from this entity by normal early
    development followed by regression rather than delay from infancy, by the
    obligate sleep-activated EEG pattern, and mechanistically by a
    loss-of-function (null or ATD/LBD missense) rather than transmembrane/linker
    gain-of-function genotype.
  evidence:
  - reference: PMID:24839611
    reference_title: "GRIN2A mutation and early-onset epileptic encephalopathy: personalized therapy with memantine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These EEGs were noted to only have very mild activation of the right-sided
      discharge during sleep and were without any features of electrical status
      epilepticus of sleep (ESES).
    explanation: >-
      The absence of ESES separates the severe early-onset phenotype from
      Landau-Kleffner syndrome and CSWS.
- name: Self-Limited Epilepsy with Centrotemporal Spikes
  disease_term:
    preferred_term: GRIN2A-related self-limited epilepsy with centrotemporal spikes
    term:
      id: MONDO:1060142
      label: GRIN2A-related self-limited epilepsy with centrotemporal spikes
  description: >-
    The mildest GRIN2A-associated epilepsy phenotype, with normal or near-normal
    development, mild focal epilepsy and speech delay or apraxia, and
    spontaneous remission. Occupies the opposite pole of the same gene's
    spectrum. Bound to the GRIN2A-specific MONDO term rather than the generic
    self-limited epilepsy with centrotemporal spikes (MONDO:0007295) because this
    differential is scoped to the GRIN2A-associated form; note that GRIN2A
    explains only a minority of centrotemporal-spike epilepsy overall, so the
    broader term remains the right one for the syndrome in general.
  evidence:
  - reference: PMID:30544257
    reference_title: "GRIN2A-related disorders: genotype and functional consequence predict phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic spectrum ranged from normal or near-normal development with
      mild epilepsy and speech delay/apraxia to severe developmental and
      epileptic encephalopathy, often within the epilepsy-aphasia spectrum.
    explanation: >-
      Defines the two poles of the GRIN2A spectrum that must be distinguished.
  - reference: PMID:23933819
    reference_title: "Mutations in GRIN2A cause idiopathic focal epilepsy with rolandic spikes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic focal epilepsy (IFE) with rolandic spikes is the most common
      childhood epilepsy
    explanation: >-
      The founding GRIN2A study establishes the rolandic-spike focal epilepsy
      phenotype as a common childhood epilepsy, and therefore as the highest-yield
      differential at the mild pole of the GRIN2A spectrum.
- name: GRIN2B-Related Developmental and Epileptic Encephalopathy
  disease_term:
    preferred_term: GRIN2B-related complex neurodevelopmental disorder
    term:
      id: MONDO:0700350
      label: GRIN2B-related complex neurodevelopmental disorder
  description: >-
    The paralogous NMDA-receptor subunit disorder, likewise presenting with
    developmental delay, intellectual disability, seizures, movement disorder,
    and cortical visual impairment, and likewise partitioned into
    gain-of-function and loss-of-function variant classes. Distinguished only by
    the gene; GluN2B-containing receptors predominate earlier in development,
    which shifts the timing of the insult. Granularity note: the bound MONDO term
    is the gene-level GRIN2B-related complex neurodevelopmental disorder, which is
    BROADER than the developmental and epileptic encephalopathy named here (the
    dismech entry for the DEE end binds MONDO:0014505, developmental and epileptic
    encephalopathy 27); the broader term is used because it is the closest
    non-obsolete MONDO class covering the whole GRIN2B spectrum this differential
    spans.
  evidence:
  - reference: PMID:20890276
    reference_title: "Mutations in GRIN2A and GRIN2B encoding regulatory subunits of NMDA receptors cause variable neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that disturbances in the neuronal
      electrophysiological balance during development result in variable
      neurological phenotypes depending on which NR2 subunit of NMDA receptors
      is affected.
    explanation: >-
      Explicitly contrasts the GRIN2A and GRIN2B phenotypes as subunit-dependent.
treatments:
- name: Anti-Seizure Medication
  description: >-
    Seizures are treated with standard anti-seizure medications, but at this
    severe end of the spectrum the epilepsy is characteristically refractory:
    monotherapy and multi-drug regimens frequently fail to control seizures.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:27683935
    reference_title: "GRIN2A-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures should be treated with anti-seizure medication (ASM)."
    explanation: >-
      GeneReviews recommends standard anti-seizure medication for the epilepsy.
  - reference: PMID:32577763
    reference_title: "Modelling and treating GRIN2A developmental and epileptic encephalopathy in mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard anti-epileptic drug monotherapy was ineffective in the patient."
    explanation: >-
      Documents the limited efficacy of standard anti-seizure monotherapy in
      this severe phenotype.
- name: Memantine (NMDA Receptor Channel Blockade for Gain-of-Function Variants)
  description: >-
    Mechanism-directed therapy for gain-of-function GRIN2A variants: the
    use-dependent open-channel blocker memantine reduces the excessive
    NMDA-receptor current. In the index patient with the linker variant
    p.Leu812Met, in vitro screening confirmed retained memantine sensitivity and
    adjunct memantine cut seizure frequency from an average of 11.1 to 3.3
    episodes per week, abolished the myoclonic jerks, and cleared the frontal
    spike-wave discharges from the EEG. A retrospective multicentre series of 34
    individuals with GRIN variants found that 74% of those with gain-of-function
    variants benefited, whereas those with loss-of-function or indeterminate
    variants benefited significantly less. Because blocker potency varies
    between variants (dextromethorphan and dextrorphan are more potent on
    p.Asn615Lys but less potent on p.Leu812Met), and because the distance of the
    variant from the memantine binding site tracks the response, blocker choice
    should be variant-specific. GeneReviews cautions that NMDA-receptor blockers
    be used with care in individuals with loss-of-function or null variants.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: memantine
      term:
        id: CHEBI:64312
        label: memantine
  target_mechanisms:
  - target: NMDA Receptor Gain-of-Function
    treatment_effect: INHIBITS
    description: >-
      Use-dependent open-channel blockade counteracts the excessive receptor
      activity of gain-of-function variants.
    evidence:
    - reference: PMID:24839611
      reference_title: "GRIN2A mutation and early-onset epileptic encephalopathy: personalized therapy with memantine."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        memantine inhibited GluN2A-L812M-containing NMDARs with an IC50 of 12
      explanation: >-
        Direct measurement of memantine inhibition of the gain-of-function
        receptor, the mechanistic basis for this treatment-target edge.
  evidence:
  - reference: PMID:24839611
    reference_title: "GRIN2A mutation and early-onset epileptic encephalopathy: personalized therapy with memantine."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro analysis with NMDA receptor blockers indicated that
      GLuN2A-L812M-containing NMDARs retained their sensitivity to the
      use-dependent channel blocker memantine
    explanation: >-
      Establishes retained memantine sensitivity as the rationale for the
      therapy.
  - reference: PMID:24839611
    reference_title: "GRIN2A mutation and early-onset epileptic encephalopathy: personalized therapy with memantine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over a 54-week period prior to memantine treatment, the proband averaged
      11.1 episodes per week (SEM = 0.5). Once the full memantine dosage was
      achieved, there was a decrease in average seizure frequency to 3.3 per
      week (SEM = 0.3).
    explanation: >-
      Quantifies the clinical seizure reduction with adjunct memantine.
  - reference: PMID:41489401
    reference_title: "Memantine treatment in individuals with GRIN gain-of-function variants is associated with improvements in behavior, development, and seizure frequency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen of 19 individuals (74%) benefited from memantine, comprising
      improvements in behavior (71%), development (50%), and seizure frequency
      (39%).
    explanation: >-
      A multicentre retrospective series quantifies memantine benefit in GRIN
      gain-of-function variants.
  - reference: PMID:41489401
    reference_title: "Memantine treatment in individuals with GRIN gain-of-function variants is associated with improvements in behavior, development, and seizure frequency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with either LoF or a functionally indeterminate or no effect
      GRIN variant (15/34 individuals) showed significantly less benefit from
      memantine treatment
    explanation: >-
      Restricts the indication: the benefit is confined to the gain-of-function
      class, so functional classification must precede treatment.
  - reference: PMID:27683935
    reference_title: "GRIN2A-Related Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In individuals with pathogenic missense variants inhibiting the NMDAR as
      well as null variants, NMDA receptor blockers should be used with caution
      (e.g., memantine, dextromethorphan, ketamine).
    explanation: >-
      Records the reciprocal caution: channel blockers are not appropriate for
      the loss-of-function class.
- name: L-Serine Supplementation (NMDA Receptor Co-Agonist for Loss-of-Function Variants)
  description: >-
    Mechanism-directed therapy for the opposite functional class: oral L-serine
    is the metabolic precursor of the NMDA-receptor co-agonists D-serine and
    glycine, and supplementation potentiates hypofunctional receptors. A
    retrospective n-of-1 series of ten individuals with GRIN2A- or
    GRIN2B-related disorders found improvement in behaviour in 8 of 9 (89%) with
    loss-of-function missense or null variants, and a phase 2A open-label trial
    (NCT04646447) in 24 children with GRIN loss-of-function variants, 5 of whom
    had GRIN2A variants, reported improved adaptive behaviour, motor function,
    and quality of life, EEG normalization in five children, and reduced seizure
    frequency in one, with better response in milder phenotypes. Critically,
    L-serine must be avoided in individuals with gain-of-function variants: a
    gain-of-function patient treated in error experienced immediate behavioral
    deterioration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
  target_mechanisms:
  - target: NMDA Receptor Loss-of-Function
    treatment_effect: RESTORES
    description: >-
      L-serine supplies NMDA-receptor co-agonist to potentiate hypofunctional
      receptors carrying loss-of-function variants.
    evidence:
    - reference: PMID:34997442
      reference_title: "L-Serine Treatment is Associated with Improvements in Behavior, EEG, and Seizure Frequency in Individuals with GRIN-Related Disorders Due to Null Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This observation gave rise to the hypothesis of successfully treating
        GRIN-related disorders due to LoF variants with co-agonists of the NMDAR.
      explanation: >-
        States the co-agonist rationale that this treatment-target edge encodes.
  evidence:
  - reference: PMID:27683935
    reference_title: "GRIN2A-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In some individuals with pathogenic loss-of-function and null GRIN2A
      variants, treatment with the N-methyl-D-aspartate receptor (NMDAR)
      coagonist L-serine was associated with improvements in behavior,

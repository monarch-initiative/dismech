- name: NMDA Receptor Gain-of-Function
  description: >-
    Transmembrane and linker missense variants increase NMDA-receptor function
    by several convergent biophysical routes: increased agonist (glutamate and
    glycine) potency, slowed deactivation after synaptic glutamate is cleared,
    and loss of the voltage-dependent extracellular magnesium block of the
    channel pore, which renders receptor calcium signaling voltage-independent.
    The net effect is greater charge transfer per receptor activation. Notably,
    pore-loop variants can simultaneously reduce calcium permeability while
    abolishing magnesium block, so gain-of-function here denotes increased
    overall charge transfer and excitatory drive rather than a uniform increase
    in every biophysical parameter.

- name: Impaired Activity-Dependent Synaptic Maturation and Plasticity
  description: >-
    NMDA-receptor calcium signaling is the instructive signal for
    activity-dependent synapse formation, pruning, and long-term potentiation
    and depression. Dysregulation on either side of the optimum disrupts
    dendritic and synaptic maturation and produces altered hippocampal
    morphology, providing the substrate for global developmental delay,
    intellectual disability, and the prominent speech and language impairment of
    GRIN2A-related disorders.

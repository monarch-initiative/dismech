- name: GluN2A C-Terminal Domain Truncation and Receptor Mistargeting
  description: >-
    A mechanistically distinct third route to reduced GluN2A function, separate
    from gene-dosage loss and from impaired agonist binding: a frameshift
    truncating the GluN2A intracellular C-terminal domain leaves the receptor able
    to reach the postsynaptic membrane but destroys its PDZ interaction with the
    scaffolding protein PSD-95, so the receptor is mislocalized to extrasynaptic
    membrane while retaining Scribble1-mediated recycling. The consequence is
    fewer synapses and reduced dendritic spine density. This is a trafficking and
    localization defect rather than a channel-gating defect, and it was identified
    in a patient with epileptic encephalopathy, multiple seizure types, and severe
    aphasia.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cortical glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:

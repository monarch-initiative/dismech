- name: Excessive NMDA Receptor-Mediated Charge Transfer and Calcium Signaling
  description: >-
    The immediate cellular consequence of gain-of-function receptors is enhanced
    NMDA-receptor-mediated cation flux, with excessive depolarizing charge
    transfer and excessive calcium entry, at synapses that are simultaneously
    less able to terminate the signal (slow deactivation) and less protected by
    magnesium block at resting potential. Because calcium entry through NMDA
    receptors during coincident pre- and postsynaptic activity is the principal
    instructive signal for activity-dependent synaptic refinement, the excess is
    both an excitatory and a developmental-signaling insult, and the loss of its
    voltage dependence destroys the coincidence detection the signal depends on.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cortical glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    term:

    reference_title: "GRIN2A-related disorders: genotype and functional consequence predict phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that pathogenic missense variants in transmembrane and linker
      domains (misTMD+Linker) were associated with severe developmental
      phenotypes
    explanation: >-
      Identifies transmembrane/linker missense variants as the genotype class
      underlying the severe developmental phenotype.
  - reference: PMID:24839611
    reference_title: "GRIN2A mutation and early-onset epileptic encephalopathy: personalized therapy with memantine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation resulted in a leucine to methionine substitution
      (NP_000824.1:p.L812M) in the linker region connecting the ligand-binding
      domain to the pore-forming transmembrane region of GluN2A
    explanation: >-
      Localizes the p.L812M early-onset epileptic encephalopathy variant to the
      ligand-binding-domain-to-transmembrane linker.

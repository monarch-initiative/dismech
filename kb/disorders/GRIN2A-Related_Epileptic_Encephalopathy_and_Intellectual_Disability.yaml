- name: GRIN2A Null or Ligand-Binding/Amino-Terminal Domain Missense Variant
  description: >-
    The alternative genotype class: GRIN2A null variants (nonsense, frameshift,
    splice, exon-disrupting deletions) and missense variants confined to the
    amino-terminal or ligand-binding domains (misATD+LBD). These act through
    loss of receptor function. This class predominantly produces the milder
    GRIN2A epilepsy-aphasia phenotypes curated separately (self-limited epilepsy
    with centrotemporal spikes, Landau-Kleffner syndrome), and is included here
    because a minority of individuals at the severe developmental end carry
    loss-of-function variants and because this class defines eligibility for
    co-agonist (L-serine) therapy.

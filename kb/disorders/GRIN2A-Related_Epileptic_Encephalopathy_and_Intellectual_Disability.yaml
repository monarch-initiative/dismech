inheritance:
- name: Autosomal dominant
  description: >-
    GRIN2A-related disorders are autosomal dominant. Roughly half of all
    probands across the GRIN2A spectrum carry a de novo variant; at the severe
    developmental and epileptic encephalopathy end the causative missense
    variants are characteristically de novo, whereas inherited (often null)
    variants segregate with the milder epilepsy-aphasia phenotypes, sometimes
    through mildly affected or apparently unaffected carriers.
  inheritance_term:

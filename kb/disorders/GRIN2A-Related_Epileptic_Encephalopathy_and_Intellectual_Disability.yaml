- name: Progressive Cerebral Parenchymal Volume Loss and Abnormal Myelination
  description: >-
    Serial brain MRI in the severe GRIN2A phenotype shows widespread and
    progressive cerebral parenchymal volume loss with a thin corpus callosum and
    abnormal myelination of the terminal zones and temporal lobes, while the
    cerebellum and brainstem are relatively spared. This progressive structural
    loss distinguishes the severe developmental and epileptic encephalopathy
    from the structurally subtle perisylvian and hippocampal changes described in
    the GRIN2A epilepsy-aphasia phenotypes, and it is the anatomical correlate
    of the static, profoundly impaired developmental trajectory. Whether it is
    driven by receptor-mediated excitotoxicity, by the seizure burden, or by an
    independent process is unresolved.

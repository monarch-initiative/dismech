      label: protein localization to synapse
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38050135
    reference_title: "A Frameshift Variant of GluN2A Identified in an Epilepsy Patient Results in NMDA Receptor Mistargeting."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We observed that the GluN2A P1199Rfs*32-containing receptors traffic
      efficiently to the postsynaptic membrane but have increased extra-synaptic
      expression relative to WT GluN2A-containing NMDARs.
    explanation: >-
      Establishes the mistargeting phenotype: trafficking to the membrane is
      preserved but synaptic localization is lost.
  - reference: PMID:38050135
    reference_title: "A Frameshift Variant of GluN2A Identified in an Epilepsy Patient Results in NMDA Receptor Mistargeting."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Indeed, we observed impaired binding to the scaffolding protein postsynaptic
      protein-95 (PSD-95); however, we found the mutant interacts with Scribble1,
      which facilitates the recycling of both the mutant and the WT GluN2A.
    explanation: >-
      Identifies loss of PSD-95 binding with retained Scribble1 recycling as the
      molecular basis of the mislocalization.
  downstream:
  - target: NMDA Receptor Loss-of-Function
    causal_link_type: DIRECT
    hypothesis_groups:
    - grin2a_domain_localization_functional_class_severity
    description: >-
      Extrasynaptic mislocalization removes GluN2A from the synapse, producing net
      loss of synaptic NMDA-receptor function.
    evidence:
    - reference: PMID:38050135
      reference_title: "A Frameshift Variant of GluN2A Identified in an Epilepsy Patient Results in NMDA Receptor Mistargeting."
      supports: SUPPORT

      id: hgnc:4585
      label: GRIN2A
  description: >-
    Knock-in mouse carrying the patient-derived gain-of-function Grin2a
    p.Ser644Gly variant. Homozygotes show altered hippocampal morphology by 2
    weeks and uniformly lethal tonic-clonic seizures by the middle of the third
    week; heterozygous adults are susceptible to induced generalized seizures
    and show hyperactivity and repetitive behaviours. Network recordings

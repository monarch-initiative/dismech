genetic:
- name: GRIN2A
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GRIN2A
    term:
      id: hgnc:4585
      label: GRIN2A
  notes: >-
    Heterozygous GRIN2A variants cause the disorder. At this severe end the
    variants are characteristically de novo missense changes in the
    transmembrane domains or the linkers coupling the ligand-binding domain to
    the channel, which predominantly confer NMDA-receptor gain-of-function. Null
    variants and missense variants in the amino-terminal or ligand-binding
    domains confer loss-of-function and predominantly produce the milder
    epilepsy-aphasia phenotypes. Assigning the functional class is a
    prerequisite for mechanism-directed treatment, because the two available
    precision therapies act in opposite directions.
  evidence:
  - reference: PMID:27683935
    reference_title: "GRIN2A-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of a GRIN2A-related disorder is established in a proband by
      the identification of a GRIN2A heterozygous pathogenic variant on
      molecular genetic testing.
    explanation: >-
      A heterozygous GRIN2A pathogenic variant establishes the diagnosis.
  - reference: PMID:30544257
    reference_title: "GRIN2A-related disorders: genotype and functional consequence predict phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Applying the criteria of the American College of Medical Genetics and
      Genomics to all published variants yielded 156 additional cases with
      pathogenic or likely pathogenic variants in GRIN2A, resulting in a total of
      248 individuals.
    explanation: >-
      Establishes the size and curation basis of the GRIN2A variant-phenotype
      dataset supporting the genotype-severity model.
variants:
- name: GRIN2A p.Leu812Met (c.2434C>A)
  gene:
    preferred_term: GRIN2A
    term:
      id: hgnc:4585
      label: GRIN2A
  type: missense
  clinical_significance: PATHOGENIC
  description: >-
    De novo missense variant in the linker connecting the ligand-binding domain
    to the M4 transmembrane region. Increases NMDA-receptor charge transfer via
    an approximately eightfold increase in glutamate potency and a comparable
    increase in glycine potency, with a partial reduction in magnesium block.
    Receptors carrying it remain sensitive to memantine, which was the basis for
    successful adjunct memantine therapy in the index patient.
  functional_effects:
  - function: NMDA glutamate receptor activity
    type: gain-of-function
    description: >-
      Increased agonist potency and increased charge transfer through
      GluN2A-L812M-containing NMDA receptors.
  evidence:
  - reference: PMID:24839611
    reference_title: "GRIN2A mutation and early-onset epileptic encephalopathy: personalized therapy with memantine."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Receptors containing GluN2A-L812M showed an eightfold reduction in EC50
      (i.e., increased potency) for glutamate
    explanation: >-
      Quantifies the gain-of-function effect on glutamate potency.
- name: GRIN2A p.Asn615Lys (c.1845C>A)
  gene:
    preferred_term: GRIN2A
    term:
      id: hgnc:4585
      label: GRIN2A
  type: missense
  clinical_significance: PATHOGENIC
  description: >-
    De novo missense variant near the apex of the pore-lining M2 reentrant loop,
    identified in the index girl with GRIN2A early-onset epileptic
    encephalopathy. It eliminates the voltage-dependent extracellular magnesium
    block at physiological concentrations while also reducing calcium
    permeability. Unlike p.Leu812Met, agonist potency is unchanged, and
    dextromethorphan and dextrorphan are more rather than less potent on
    N615K-containing receptors, illustrating that channel-blocker choice is
    variant-specific.
  functional_effects:
  - function: NMDA glutamate receptor voltage-dependent magnesium block
    type: gain-of-function
    description: >-
      Loss of the voltage-dependent magnesium block, permitting
      NMDA-receptor-mediated current at resting membrane potentials, with a
      concomitant decrease in calcium permeability.
  evidence:
  - reference: PMID:20890276
    reference_title: "Mutations in GRIN2A and GRIN2B encoding regulatory subunits of NMDA receptors cause variable neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      receptor currents revealed a loss of the Mg²(+) block and a decrease in
      Ca²(+) permeability
    explanation: >-
      Defines the biophysical consequence of p.N615K.
  - reference: PMID:24839611
    reference_title: "GRIN2A mutation and early-onset epileptic encephalopathy: personalized therapy with memantine."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      showed enhanced potency on N615K-containing NMDARs in comparison to
      wild-type NMDARs
    explanation: >-
      Shows that channel-blocker pharmacology differs between GRIN2A
      gain-of-function variants, so blocker selection is variant-specific.
- name: GRIN2A p.Ser644Gly
  gene:
    preferred_term: GRIN2A
    term:
      id: hgnc:4585
      label: GRIN2A
  type: missense
  clinical_significance: PATHOGENIC
  description: >-
    De novo missense variant identified in a child with GRIN2A developmental and
    epileptic encephalopathy and modelled with a knock-in mouse. Confers
    enhanced agonist potency and markedly slowed deactivation after synaptic
    glutamate clearance, prolonging NMDA-receptor-mediated synaptic currents.
  functional_effects:
  - function: NMDA glutamate receptor deactivation kinetics
    type: gain-of-function
    description: >-
      Enhanced agonist potency and slow deactivation, with prolonged
      NMDA-receptor-mediated synaptic current deactivation in heterozygous
      hippocampal slices.
  evidence:
  - reference: PMID:32577763
    reference_title: "Modelling and treating GRIN2A developmental and epileptic encephalopathy in mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NMDA receptor-mediated synaptic currents in heterozygous hippocampal
      slices also showed a prolonged deactivation time course.
    explanation: >-
      Confirms the slowed-deactivation gain-of-function mechanism at native
      synapses.

- name: Dysregulated NMDA Receptor-Mediated Glutamatergic Signaling
  description: >-
    The convergence point of both functional classes: NMDA-receptor-mediated
    glutamatergic signaling and its calcium-dependent downstream cascades fall
    outside the narrow range that the developing cortex requires. Because GluN2A
    expression rises through late infancy and childhood as GluN2B-containing
    receptors are replaced, the perturbation lands on a moving developmental
    target, which is one reason the same gene produces phenotypes ranging from
    isolated speech apraxia to a lethal encephalopathy.

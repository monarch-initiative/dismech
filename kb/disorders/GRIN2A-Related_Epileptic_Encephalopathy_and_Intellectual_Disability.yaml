- name: Radiprodil (Investigational GluN2B-Selective Negative Allosteric Modulator)
  description: >-
    Investigational mechanism-directed therapy for the gain-of-function class,
    currently in an open-label phase 1b trial restricted to GRIN-related disorder
    with a gain-of-function variant (NCT05818943). Radiprodil is a
    GluN2B-selective negative allosteric modulator, which is mechanistically
    counterintuitive for a GRIN2A (GluN2A) disorder; the preclinical rationale is
    that it dose-dependently suppressed audiogenic seizures in Grin2a p.Asn615Ser
    gain-of-function mice, plausibly by damping total NMDA-receptor drive through
    the GluN2B-containing population that remains in the same circuits. Two
    caveats temper the expectation: the rescue was sex-dependent for reasons that
    are unexplained, and the wider question of how well induced-seizure paradigms
    in Grin2a mice predict human response is captured in the
    grin2a_dee_mouse_model_paradoxical_seizure_resistance discussion. No human
    efficacy result is available.

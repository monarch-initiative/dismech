name: GRIN2A-Related Epileptic Encephalopathy and Intellectual Disability
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- Early-onset epileptic encephalopathy and intellectual disability due to GRIN2A mutation
- GRIN2A-related developmental and epileptic encephalopathy
- GRIN2A-related early-onset epileptic encephalopathy
- GRIN2A encephalopathy
description: >-
  The severe end of the GRIN2A phenotypic spectrum: an early-onset developmental
  and epileptic encephalopathy with global developmental delay evolving to mild
  to profound intellectual disability, multiple usually drug-resistant focal and
  generalized seizure types with variably abnormal EEG, and progressive cerebral
  parenchymal volume loss with a thin corpus callosum on brain MRI. It is caused
  by heterozygous, typically de novo, variants in GRIN2A, which encodes the
  GluN2A (NR2A) subunit of the N-methyl-D-aspartate (NMDA) glutamate receptor.
  Mechanistically the disorder is distinguished from the milder GRIN2A-related
  epilepsy-aphasia phenotypes (self-limited epilepsy with centrotemporal spikes,
  Landau-Kleffner syndrome, epileptic encephalopathy with continuous
  spike-and-wave during sleep) by where in the protein the variant falls:
  missense variants in the transmembrane and linker domains predominantly confer
  NMDA-receptor gain-of-function and severe developmental phenotypes, whereas
  missense variants in the amino-terminal or ligand-binding domains and null
  variants cause loss-of-function and less severe phenotypes. A third,
  trafficking-based route to loss of function - C-terminal-domain truncation that
  mislocalizes the receptor away from the synapse - is modelled as its own
  pathophysiology node. Excessive
  NMDA-receptor-mediated charge transfer and calcium influx during a critical
  developmental window drives cortical excitation-inhibition imbalance
  (seizures), impaired activity-dependent synaptic maturation (developmental
  delay and intellectual disability), and progressive neuronal loss. The
  functional class of the variant is directly actionable and bidirectionally
  consequential: gain-of-function receptors retain sensitivity to use-dependent
  NMDA-receptor channel blockers such as memantine and are the target of
  GluN2B-selective negative allosteric modulators now in trial, whereas
  loss-of-function variants are the target of co-agonist supplementation with
  L-serine, a therapy that has caused immediate behavioral deterioration when
  given in error to a gain-of-function patient.

mechanistic_hypotheses:
- hypothesis_group_id: grin2a_domain_localization_functional_class_severity
  hypothesis_label: >-
    Variant domain localization determines NMDA-receptor functional class, which
    in turn determines phenotype severity
  status: CANONICAL
  description: >-
    The prevailing pathomechanistic model for the GRIN2A spectrum holds that the
    protein domain in which a variant falls predicts its electrophysiological
    consequence, and that consequence predicts clinical severity. Missense
    variants in the transmembrane and linker domains (misTMD+Linker) sit in the
    gating machinery and the ion-permeation pathway and predominantly produce
    NMDA-receptor gain-of-function, yielding the severe developmental and
    epileptic encephalopathy phenotype curated here. Missense variants in the
    amino-terminal or ligand-binding domains (misATD+LBD) exclusively produce
    loss-of-function and, together with null variants, yield the less severe
    epilepsy-aphasia phenotypes. This model is the basis for stratifying
    patients to opposite precision therapies (channel blockade versus co-agonist
    supplementation).
  evidence:
  - reference: PMID:30544257
    reference_title: "GRIN2A-related disorders: genotype and functional consequence predict phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that pathogenic missense variants in transmembrane and linker
      domains (misTMD+Linker) were associated with severe developmental
      phenotypes, whereas missense variants within amino terminal or
      ligand-binding domains (misATD+LBD) and null variants led to less severe
      developmental phenotypes
    explanation: >-
      Establishes the domain-localization to severity relationship in a
      discovery and a validation cohort.
  - reference: PMID:30544257
    reference_title: "GRIN2A-related disorders: genotype and functional consequence predict phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, this was paralleled by electrophysiology data, where
      misTMD+Linker predominantly led to NMDAR gain-of-function, while
      misATD+LBD exclusively caused NMDAR loss-of-function.
    explanation: >-
      Links the domain-localization axis to the electrophysiological
      gain-of-function versus loss-of-function axis.
  - reference: PMID:30544257
    reference_title: "GRIN2A-related disorders: genotype and functional consequence predict phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This new pathomechanistic model may ultimately help in predicting
      phenotype severity as well as eligibility for potential precision medicine
      approaches in GRIN2A-related disorders.
    explanation: >-
      The authors frame the domain/function/severity relationship explicitly as
      a pathomechanistic model with precision-medicine consequences.
  - reference: PMID:33240831
    reference_title: "Clinical Forms and GRIN2A Genotype of Severe End of Epileptic-Aphasia Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our finding also enforced the current genotype-phenotype relationship theory"
    explanation: >-
      An independent cohort and literature review explicitly reports its findings
      as reinforcing the GRIN2A genotype-phenotype model, which is the
      corroboration this CANONICAL status rests on.
pathophysiology:
- name: GRIN2A Missense Variant in the Transmembrane and Linker Domains
  description: >-
    A heterozygous, typically de novo, GRIN2A missense variant falling in the
    transmembrane domains or the linkers that couple the ligand-binding domain
    to the channel (misTMD+Linker) alters the GluN2A subunit within the gating
    and ion-permeation machinery of the NMDA receptor. Recurrent examples
    include p.Leu812Met in the S2-M4 linker, p.Asn615Lys and p.Asn615Ser in the
    pore-lining M2 reentrant loop, and p.Ser644Gly. This variant class is the
    genetic entry point for the severe developmental and epileptic
    encephalopathy end of the GRIN2A spectrum.
  biological_scale: MOLECULAR

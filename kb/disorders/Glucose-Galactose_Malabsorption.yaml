    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the kidneys are usually unaffected in GGM, impaired renal
      function associated with nephrolithiasis as a result of chronic
      dehydration has been documented
    explanation: >-
      Directly documents nephrolithiasis as a reported renal complication of
      GGM linked to chronic dehydration.
- name: Elevated Stool Reducing Substances
  category: Laboratory
  description: >-
    Stool testing shows positive reducing substances because unabsorbed
    glucose and galactose remain in the intestinal lumen. Small-bowel biopsy
    disaccharidase (lactase, sucrase, maltase) activities are normal,
    distinguishing GGM from primary disaccharidase deficiencies such as
    congenital lactase deficiency or sucrase-isomaltase deficiency.
  phenotype_term:
    preferred_term: Elevated stool reducing substances
    term:
      id: HP:6001295
      label: Elevated stool reducing substances
  evidence:
  - reference: PMID:42160565
    reference_title: "Congenital glucose-galactose malabsorption due to SLC5A1 mutation: A case of hypernatraemic dehydration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reducing substances 2+"
    explanation: >-
      Directly documents positive stool reducing substances in a genetically
      confirmed GGM case.
- name: Positive Hydrogen Breath Test
  category: Laboratory
  description: >-
    An oral glucose or galactose challenge followed by a positive hydrogen
    breath test supports malabsorption of the challenged sugar, consistent
    with GGM; the test is negative for a fructose challenge.
  phenotype_term:
    preferred_term: Positive hydrogen breath test
    term:
      id: HP:6000259
      label: Positive hydrogen breath test
  notes: >-
    Diagnostic breath testing with a glucose or galactose challenge is a
    standard ancillary tool alongside stool reducing substances and molecular
    SLC5A1 testing; a normal disaccharidase panel on small-bowel biopsy helps
    exclude primary disaccharidase deficiencies as an alternative cause of
    carbohydrate malabsorption.
diagnosis:
- name: Molecular SLC5A1 Genetic Testing
  description: >-
    Confirmatory molecular testing for biallelic SLC5A1 variants establishes
    the diagnosis and distinguishes GGM from other congenital diarrheal
    disorders and disaccharidase deficiencies.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic pathogenic SLC5A1 variants.
  evidence:
  - reference: PMID:33433815
    reference_title: "Long-Term Dietary Changes in Subjects with Glucose Galactose Malabsorption Secondary to Biallelic Mutations of SLC5A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All six patients presented with profound diarrhea at birth with a
      significant improvement after glucose and galactose elimination and were
      eventually diagnosed with GGM by molecular analysis of the SLC5A1 gene.
    explanation: Documents molecular SLC5A1 analysis as the diagnostic confirmation method.
treatments:
- name: Fructose-Based Glucose/Galactose-Free Formula
  description: >-
    Definitive first-line management is lifelong dietary elimination of
    glucose, galactose, and their disaccharides (lactose, sucrose, maltose),
    with fructose substituted as the primary dietary carbohydrate source
    because fructose absorption via GLUT5 is unaffected. In infancy this is
    delivered as a fructose-based, carbohydrate-free formula; the diet is
    progressively liberalized with age as clinical tolerance to small amounts
    of glucose/galactose develops.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Failure of Active Intestinal Glucose/Galactose Absorption
    treatment_effect: MODULATES
    description: >-
      Eliminating dietary glucose/galactose removes the unabsorbed osmotic
      substrate that drives diarrhea, while fructose substitution exploits
      the spared GLUT5 pathway to provide dietary carbohydrate.
    evidence:
    - reference: PMID:33433815
      reference_title: "Long-Term Dietary Changes in Subjects with Glucose Galactose Malabsorption Secondary to Biallelic Mutations of SLC5A1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The standard of care for patients with GGM is lifelong restriction of
        dietary glucose and galactose. During infancy, the primary nutrition
        is a fructose-based formula, either as a Ross Carbohydrate-Free
        formula (Abbott Nutrition) with fructose supplementation, or a
        ready-made formula
      explanation: >-
        Documents the fructose-based, glucose/galactose-free formula as the
        standard-of-care first-line treatment for GGM.
  evidence:
  - reference: PMID:31142420
    reference_title: "A Rare Cause of Intractable Diarrhea of Infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an appropriate rational diagnosis can lead to life-saving treatment as
      depicted in this case report.
    explanation: >-
      Supports that timely diagnosis and initiation of the appropriate
      carbohydrate-restricted diet is life-saving in GGM.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No formal population prevalence estimate is documented; the disorder is
    described as extremely rare, with approximately several hundred cases
    diagnosed worldwide in the literature.
  evidence:
  - reference: PMID:33433815
    reference_title: "Long-Term Dietary Changes in Subjects with Glucose Galactose Malabsorption Secondary to Biallelic Mutations of SLC5A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GGM is extremely rare, with approximately several hundred people
      diagnosed worldwide
    explanation: >-
      Direct statement of the extreme rarity and approximate worldwide case
      count of GGM.
- population: Västerbotten County, Northern Sweden
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    A founder Q457R SLC5A1 variant is markedly enriched in this Swedish
    region relative to general Swedish and European populations, explaining a
    local cluster of GGM cases traced through a pedigree back to the late
    17th century.
  evidence:
  - reference: PMID:34485913
    reference_title: "The Molecular Basis of Glucose Galactose Malabsorption in a Large Swedish Pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of the Q457R variant in Västerbotten County genomes,
      0.0067, is higher than in the general Swedish population, 0.0015, and
      higher than the general European population, 0.000067. This explains
      the high number of GGM cases in this region of Sweden.
    explanation: >-
      Quantifies the founder-variant allele frequency enrichment underlying a
      regional cluster of GGM cases in Sweden.
notes: >-
  SLC5A1 also has an independent, mechanistically distinct role: common
  SLC5A1 variants have been examined in GWAS for association with type 2
  diabetes and glucose-absorption-related metabolic traits in adults. That
  common-variant/complex-trait literature is NOT part of this entry, which is
  scoped strictly to the congenital, biallelic-loss-of-function disorder
  (OMIM:606824 / MONDO:0011731). SGLT2 inhibitors (e.g., gliflozins used in
  type 2 diabetes and heart failure) act on the renal paralog SGLT2/SLC5A2,
  not SGLT1, and are likewise out of scope for this entry (see
  Familial_Renal_Glucosuria for SLC5A2). Severe diarrheal episodes can raise
  acid-base concerns clinically, but no exact quote in the reviewed GGM cache
  directly documented metabolic acidosis; it is therefore not modeled as a
  structured phenotype here.

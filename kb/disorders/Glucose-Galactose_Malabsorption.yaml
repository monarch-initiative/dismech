name: Glucose-Galactose Malabsorption
creation_date: "2026-07-06T00:00:00Z"
category: Mendelian
synonyms:
- GGM
- CGGM
- Congenital glucose-galactose malabsorption
- SGLT1 deficiency
- Intestinal sodium-glucose cotransporter 1 deficiency
description: >-
  Glucose-galactose malabsorption (GGM) is a rare, potentially lethal,
  autosomal recessive disorder of intestinal monosaccharide transport caused
  by biallelic loss-of-function variants in SLC5A1, which encodes the
  brush-border sodium/glucose cotransporter SGLT1. Loss of SGLT1-mediated
  active transport abolishes intestinal absorption of glucose and galactose
  (fructose absorption via the facilitated transporter GLUT5/SLC2A5 is
  spared), so any glucose-, galactose-, or lactose/sucrose-containing feed
  produces severe osmotic watery diarrhea from the first days of life,
  leading to life-threatening dehydration unless the infant is switched to a
  fructose-based, glucose/galactose-free formula.
disease_term:
  preferred_term: glucose-galactose malabsorption
  term:
    id: MONDO:0011731
    label: glucose-galactose malabsorption
parents:
- Gastrointestinal Disease
- Inborn error of carbohydrate metabolism
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    GGM is an autosomal recessive disease caused by biallelic loss-of-function
    variants in SLC5A1; the founding family study identified a missense
    mutation cosegregating with the GGM phenotype.
  evidence:
  - reference: PMID:2008213
    reference_title: "Glucose/galactose malabsorption caused by a defect in the Na+/glucose cotransporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glucose/galactose malabsorption (GGM) is an autosomal recessive disease
      manifesting within the first weeks of life and characterized by a
      selective failure to absorb dietary glucose and galactose from the
      intestine.
    explanation: >-
      The original SGLT1-mutation discovery paper establishes GGM as an
      autosomal recessive disorder.
genetic:
- name: SLC5A1 loss-of-function variants
  gene_term:
    preferred_term: SLC5A1
    term:
      id: hgnc:11036
      label: SLC5A1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic SLC5A1 variants (missense, nonsense, frameshift) abolish or
    severely impair SGLT1 Na+/glucose cotransport activity. Some missense
    variants cause loss of sugar-binding affinity while the protein still
    reaches the plasma membrane; most others cause defective trafficking of
    SGLT1 to the brush-border apical membrane.
  evidence:
  - reference: PMID:2008213
    reference_title: "Glucose/galactose malabsorption caused by a defect in the Na+/glucose cotransporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of the amplified products has revealed a single
      missense mutation in SGLT1 which cosegregates with the GGM phenotype
      and results in a complete loss of Na(+)-dependent glucose transport in
      Xenopus oocytes injected with this complementary RNA.
    explanation: >-
      Founding paper identifying SLC5A1/SGLT1 as the causative gene for GGM
      and demonstrating loss of transport function for the disease-associated
      missense variant.
  - reference: PMID:34485913
    reference_title: "The Molecular Basis of Glucose Galactose Malabsorption in a Large Swedish Pedigree."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Electrophysiological experiments, both steady-state and presteady-state,
      demonstrated that the mutant bound sugar with an affinity lower than the
      WT transporter.
    explanation: >-
      Demonstrates reduced sugar-binding affinity as one molecular mechanism
      of SLC5A1 loss of function in GGM, distinct from apical trafficking
      defects seen in other GGM variants.
pathophysiology:
- name: SLC5A1/SGLT1 Loss of Function
  conforms_to: "diet_induced_osmotic_diarrhea#Loss of a Substrate-Specific Brush-Border Digestive or Absorptive Step"
  description: >-
    Biallelic pathogenic SLC5A1 variants abolish or severely reduce the
    Na+/glucose(galactose) cotransport activity of SGLT1 in the intestinal
    brush-border membrane, either through loss of sugar-binding affinity or
    through defective apical membrane trafficking of the mutant transporter.
  genes:
  - preferred_term: SLC5A1
    term:
      id: hgnc:11036
      label: SLC5A1
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  molecular_functions:
  - preferred_term: D-glucose:sodium symporter activity
    term:
      id: GO:0005412
      label: D-glucose:sodium symporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:2008213
    reference_title: "Glucose/galactose malabsorption caused by a defect in the Na+/glucose cotransporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal glucose absorption is mediated by the Na+/glucose cotransporter
      in the brush border membrane of the intestinal epithelium. Cellular
      influx is driven by the transmembrane Na+ electrochemical potential
      gradient; thereafter the sugar moves to the blood across the basolateral
      membrane via the facilitated glucose carrier.
    explanation: >-
      Establishes the normal SGLT1-mediated apical Na+/glucose cotransport
      mechanism that is disrupted in GGM.
  downstream:
  - target: Failure of Active Intestinal Glucose/Galactose Absorption
    causal_link_type: DIRECT
    description: >-
      Loss of apical SGLT1 activity directly abolishes active transcellular
      absorption of glucose and galactose by small-intestinal enterocytes.
    evidence:
    - reference: PMID:33433815
      reference_title: "Long-Term Dietary Changes in Subjects with Glucose Galactose Malabsorption Secondary to Biallelic Mutations of SLC5A1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glucose galactose malabsorption (GGM) is a congenital diarrheal
        disorder of intestinal Na+/glucose cotransport (SGLT1/SLC5A1).
      explanation: >-
        Supports that GGM is a congenital intestinal SGLT1/SLC5A1 glucose
        cotransport disorder; the upstream evidence item establishes the
        SLC5A1 loss-of-function lesion.
- name: Failure of Active Intestinal Glucose/Galactose Absorption
  conforms_to: "diet_induced_osmotic_diarrhea#Unabsorbed Dietary Solute Retention in the Intestinal Lumen"
  description: >-
    Active transcellular absorption of dietary glucose and galactose (and,
    following brush-border disaccharidase hydrolysis, the glucose/galactose
    moieties of lactose, sucrose, and maltose) fails in enterocytes of the
    small intestine, while facilitated absorption of fructose via GLUT5
    (SLC2A5), which is independent of SGLT1, is unaffected.
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  evidence:
  - reference: PMID:33433815
    reference_title: "Long-Term Dietary Changes in Subjects with Glucose Galactose Malabsorption Secondary to Biallelic Mutations of SLC5A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      resulting in bloating, cramping, flatulence, and a
      dose-dependent osmotic diarrhea
    explanation: >-
      Documents the direct clinical consequences of failed apical
      glucose/galactose absorption.
  downstream:
  - target: Fructose Absorption Spared (GLUT5)
    causal_link_type: DIRECT
    description: >-
      Because GLUT5-mediated fructose transport is independent of SGLT1,
      fructose absorption remains intact even as glucose/galactose absorption
      fails, forming the basis for fructose-based dietary substitution.
    evidence:
    - reference: PMID:33433815
      reference_title: "Long-Term Dietary Changes in Subjects with Glucose Galactose Malabsorption Secondary to Biallelic Mutations of SLC5A1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        membrane-facilitated transporter (GLUT5/SLC2A5), and its function is
        retained in GGM.
      explanation: >-
        States explicitly that fructose absorption via GLUT5 is retained in
        GGM, distinguishing it mechanistically from glucose/galactose
        transport.
  - target: Osmotic Diarrhea and Dehydration
    causal_link_type: DIRECT
    description: >-
      Unabsorbed luminal glucose and galactose, with accompanying sodium and
      water that are not reabsorbed because cotransport fails, create an
      osmotic gradient that drives fluid into the intestinal lumen.
    evidence:
    - reference: PMID:2008213
      reference_title: "Glucose/galactose malabsorption caused by a defect in the Na+/glucose cotransporter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The consequent severe diarrhoea and dehydration are usually fatal
        unless these sugars are eliminated from the diet.
      explanation: >-
        Establishes that unabsorbed glucose/galactose causes severe,
        potentially fatal diarrhea and dehydration in GGM.
- name: Fructose Absorption Spared (GLUT5)
  description: >-
    Unlike glucose and galactose, fructose is absorbed across the apical
    enterocyte membrane by the facilitated transporter GLUT5 (SLC2A5), which
    is independent of SGLT1 and functions normally in GGM. This selective
    sparing is the basis for fructose-based dietary management and explains
    why fructose becomes the primary dietary carbohydrate source for
    affected patients.
  genes:
  - preferred_term: SLC2A5
    term:
      id: hgnc:11010
      label: SLC2A5
  molecular_functions:
  - preferred_term: fructose transmembrane transporter activity
    term:
      id: GO:0005353
      label: fructose transmembrane transporter activity
  evidence:
  - reference: PMID:36673104
    reference_title: "Fructose Metabolism and Its Effect on Glucose-Galactose Malabsorption Patients: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Often, glucose-galactose malabsorption patients are highly dependent on
      fructose, their primary source of carbohydrates.
    explanation: >-
      Supports that fructose becomes the primary dietary carbohydrate source
      in GGM because of intact GLUT5-mediated absorption.
- name: Osmotic Diarrhea and Dehydration
  conforms_to: "diet_induced_osmotic_diarrhea#Substrate-Dependent Watery Diarrhea and Nutritional Consequences"
  description: >-
    Unabsorbed luminal glucose and galactose create an osmotic gradient that
    draws water into the intestinal lumen, producing severe watery diarrhea
    (HP:0033310 Osmotic diarrhea) beginning in the neonatal period; continued
    fluid and electrolyte losses lead to dehydration (HP:0001944), often
    hypernatremic, and metabolic acidosis if untreated. Diarrhea resolves
    rapidly on dietary elimination of glucose/galactose and recurs promptly
    on rechallenge, a pattern used diagnostically to confirm GGM.
  evidence:
  - reference: PMID:31142420
    reference_title: "A Rare Cause of Intractable Diarrhea of Infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Persistent diarrhea lead to prolonged hospitalisation and recurrent
      hypernatremic dehydration.
    explanation: >-
      Clinical case demonstrating recurrent hypernatremic dehydration as a
      consequence of the persistent osmotic diarrhea of GGM.
  downstream:
  - target: Dietary Rechallenge Recurrence
    causal_link_type: DIRECT
    description: >-
      Symptoms resolve when glucose/galactose is removed from the diet and
      recur on rechallenge, confirming the diet-dependence of the osmotic
      mechanism.
    evidence:
    - reference: PMID:33433815
      reference_title: "Long-Term Dietary Changes in Subjects with Glucose Galactose Malabsorption Secondary to Biallelic Mutations of SLC5A1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All six patients presented with profound diarrhea at birth with a
        significant improvement after glucose and galactose elimination and
        were eventually diagnosed with GGM by molecular analysis of the
        SLC5A1 gene.
      explanation: >-
        Documents the characteristic resolution of diarrhea upon glucose and
        galactose elimination that supports the GGM diagnosis.
- name: Dietary Rechallenge Recurrence
  description: >-
    Diarrhea resolves rapidly when glucose, galactose, and their
    disaccharides (lactose, sucrose) are removed from the diet, and recurs
    promptly on rechallenge with these sugars, a pattern used diagnostically
    to confirm GGM and distinguish it from other congenital diarrheal
    disorders.
  evidence:
  - reference: PMID:31142420
    reference_title: "A Rare Cause of Intractable Diarrhea of Infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relevant investigations clinched the diagnosis of ''congenital glucose
      galactose malabsorption (CGGM)''.
    explanation: >-
      Clinical case in which targeted investigation (including dietary
      response) established the CGGM diagnosis.

    Cytopenias are a presenting feature and may suggest acute leukemia before the
    diagnosis is made.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:39696449
    reference_title: "Clinical and Splenectomy-based Treatment Outcomes in 40 Cases of Hepatosplenic T-cell Lymphoma: A Comprehensive Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common laboratory findings included leukopenia, anemia, and thrombocytopenia."
    explanation: >-
      Names thrombocytopenia directly as a common finding in a 40-case series,
      rather than inferring it from an undifferentiated cytopenia claim.
  - reference: PMID:29337025
    reference_title: "Hepatosplenic T-cell Lymphoma: a review of clinicopathologic features, pathogenesis, and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Patients with HSTCL commonly present with B-symptoms and cytopenias, which may suggest a diagnosis of acute leukemia initially."
    explanation: >-
      Supporting context. Graded INDIRECT because the review does not break the
      cytopenias down by lineage, so thrombocytopenia follows only by inference.
- category: Hematologic
  name: Leukopenia
  description: >-
    Leukopenia is the most frequent of the three cytopenias at disease onset.
  phenotype_term:
    preferred_term: Leukopenia

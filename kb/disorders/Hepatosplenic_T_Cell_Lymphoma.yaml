    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were 7 cases of leukopenia at disease onset, as well as 8 cases of anemia (Hb < 120 g/L), and 5 cases of thrombocytopenia (PLT < 100 × 109/L)."
    explanation: >-
      Counts all three cytopenias in the ten-patient index cohort; leukopenia is the
      most common at 7 of 10.
- category: Hematologic
  name: Anemia
  description: Anemia at presentation, from marrow infiltration and splenic sequestration.

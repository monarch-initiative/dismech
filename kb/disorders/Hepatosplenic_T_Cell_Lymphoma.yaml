    reference_title: "The incidence of hepatosplenic T-cell lymphoma in a large managed care organization, with reference to anti-tumor necrosis factor therapy, Northern California, 2000-2006."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

biochemical:
- name: Serum ferritin
  notes: >-
    Ferritin was elevated in every patient in the index cohort. This is the strongest
    frequency claim available in the entry's sources, and it is not incidental:
    hyperferritinemia is the laboratory correlate of the systemic inflammatory state
    and of the hemophagocytic syndrome curated above.
  biomarker_term:
    preferred_term: elevated serum ferritin
    term:

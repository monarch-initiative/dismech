  evidence:
  - reference: PMID:33160933
    reference_title: "Outcomes of Hepatosplenic T-Cell Lymphoma: The Mayo Clinic Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Clinical characteristics include massive splenomegaly in 16 patients (73%), hepatic involvement in 13 (59%), and chronic immunosuppressed state in 8 (36%)."
    explanation: >-
      Graded INDIRECT and left without a frequency: the cohort reports hepatic

name: Hepatosplenic T-cell Lymphoma
creation_date: "2026-09-10T01:15:12Z"
category: Cancer
categories:
- Hematologic Malignancy
- T-cell Neoplasm
synonyms:
- HSTCL
- HSTL
- Hepatosplenic gamma/Delta T-cell lymphoma
- hepatosplenic gamma-delta T-cell lymphoma
description: >-
  Hepatosplenic T-cell lymphoma (HSTCL) is a rare and clinically aggressive mature
  T-cell non-Hodgkin lymphoma of cytotoxic T cells, usually bearing the gamma/delta
  T-cell receptor and most often the V-delta-1 subset. It is defined by where it
  grows rather than by a mass: neoplastic cells home to the sinusoidal compartments
  of spleen, liver and bone marrow, packing the splenic cords of Billroth and the
  hepatic sinusoids, while lymphadenopathy is characteristically absent. The
  genetic landscape is dominated by two cooperating classes of lesion - activating
  JAK-STAT mutations, chiefly in STAT5B, and loss of chromatin-modifying genes, of
  which SETD2 is the most frequently silenced and has been shown experimentally to
  act as a tumor suppressor. Isochromosome 7q is the characteristic cytogenetic
  abnormality. A substantial minority of cases arise on a background of chronic
  therapeutic immunosuppression, classically combined thiopurine and anti-TNF
  therapy for inflammatory bowel disease in young men, though population series
  show the association is neither necessary nor confined to that group. Outcome is
  poor, with median overall survival close to a year.
disease_term:
  preferred_term: hepatosplenic T-cell lymphoma
  term:
    id: MONDO:0019474
    label: hepatosplenic T-cell lymphoma
parents:
- T-cell non-Hodgkin lymphoma
notes: >-
  Scope and granularity. This is curated as a Disease entry at the histologic-entity
  level, which design decisions section 3a makes the default for a new cancer entry.
  The call is not automatic: MONDO:0019474 is a leaf whose only parent, MONDO:0015760
  (T-cell non-Hodgkin lymphoma), is itself curated as Peripheral_T_Cell_Lymphoma.yaml
  with six has_subtypes entries, so HSTCL could instead have been a seventh. It is
  kept separate because all six of those subtypes are nodal entities of alpha/beta or
  T-follicular-helper derivation, whereas HSTCL is an extranodal, sinusoidal,
  predominantly gamma/delta neoplasm, and WHO treats it as its own entity rather than
  a PTCL subtype. Adding it to that subtype list would have made the list incoherent.

  The alpha/beta minority is deliberately not split off. Yabe and colleagues describe
  the same clinicopathologic entity with T-cell receptor gamma/delta "or, less often,
  alpha/beta", and the Mayo series reports both phenotypes within one cohort, so the
  receptor type is recorded as a feature rather than as a subtype boundary.

  EBV status. HSTCL is conventionally described as EBV-negative, and no EBV claim is
  made in this entry. The one cited source that tests it is internally inconsistent
  and should not be quoted from its abstract: that abstract states "In the 10 HSTCL
  patients, Epstein-Barr virus (EBV) infection was confirmed", while the body of the
  same paper reports EBV confirmed in 2 patients and says "only 2 out of 10 patients
  showed signs of EBV infection, both presenting with hemophagocytic syndrome, which
  complicates the determination of its relationship with the onset of malignancy".
  The body is the accurate statement. Two of ten, both with hemophagocytic syndrome,
  is too confounded to curate as a disease-level EBV association, so it is recorded
  here rather than asserted.

  Nodal disease. The characteristic absence of lymphadenopathy is load-bearing here -
  it appears in the description, in the infiltration node and in the lump/split
  argument - so the contrary evidence is recorded rather than left out. A 40-case
  series cited throughout this entry reports lymph node enlargement in seven of its
  ten index patients, and that item is curated as a REFUTE on the histopathology
  claim. The same paper still describes nodal involvement as less common, so the
  entry keeps the WHO characterisation and treats the series as a qualification.

  One consequence is left explicit rather than silent. MONDO:0015760 does ontologically
  subsume MONDO:0019474, and Peripheral_T_Cell_Lymphoma.yaml binds that term only as a
  compromise - its own description records that MONDO lacks an exact family-level
  peripheral T-cell lymphoma umbrella term. So the shared parent is an artifact of that
  anchoring, not evidence the two concepts coincide, and the free-text parent recorded
  below reproduces the same label without asserting subsumption by that entry.
pathophysiology:
- name: Isochromosome 7q Formation
  biological_scale: MOLECULAR
  description: >-
    Isochromosome 7q, with loss of 7p and gain of 7q material, is the characteristic
    cytogenetic lesion of HSTCL and is present in the majority of karyotyped cases,
    frequently alongside trisomy 8. It is treated here as the transforming somatic
    event in the gamma/delta T-cell compartment.
  mechanism_confidence: PROVISIONAL
  notes: >-
    Marked PROVISIONAL because the cited sources establish that isochromosome 7q is
    the most frequent cytogenetic abnormality in HSTCL, not that it precedes the
    STAT5B and chromatin-modifier lesions. Treating it as the transforming event is
    the conventional reading and is what makes this the derived cell-of-origin node,
    but the ordering itself is not evidenced here.
  genetic_context:
    variant_origin: SOMATIC
  cell_types:
  - preferred_term: cytotoxic gamma-delta T cell
    term:
      id: CL:0000798
      label: gamma-delta T cell
  downstream:
  - target: Clonal Expansion of Cytotoxic Gamma-Delta T Cells
    causal_link_type: DIRECT
    description: >-
      The cytogenetic lesion establishes the clone from which the disease grows.
  evidence:
  - reference: PMID:33160933
    reference_title: "Outcomes of Hepatosplenic T-Cell Lymphoma: The Mayo Clinic Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cytogenetic abnormalities included isochromosome 7q (i7q) in 8 (62%) of 13 and trisomy 8 in 4 (44%) of 9."
    explanation: >-
      Establishes isochromosome 7q as the dominant recurrent cytogenetic abnormality
      in a consecutive single-institution HSTCL cohort.
- name: STAT5B Gain-of-Function Activation
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  biological_scale: MOLECULAR
  description: >-
    Activating mutations in STAT5B, and less often STAT3, drive ligand-independent
    JAK-STAT signalling. STAT5B is the most frequently mutated signalling gene in
    HSTCL and the pathway is a candidate therapeutic target.
  genes:
  - preferred_term: STAT5B
    term:
      id: hgnc:11367
      label: STAT5B
  biological_processes:
  - preferred_term: JAK-STAT signalling driven by activating STAT5B mutation
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
  downstream:
  - target: Clonal Expansion of Cytotoxic Gamma-Delta T Cells
    causal_link_type: DIRECT
    description: >-
      Constitutive JAK-STAT signalling supports survival and proliferation of the
      neoplastic clone.
    evidence:
    - reference: PMID:28122867
      reference_title: The Genetic Basis of Hepatosplenic T-cell Lymphoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we found that mutations in STAT5B and PIK3CD activate critical signaling pathways important to cell survival in HSTL"
      explanation: >-
        Cites the experimental result linking the STAT5B lesion specifically to
        survival signalling in HSTCL cells, which is the causal step this edge asserts.
  evidence:
  - reference: PMID:28122867
    reference_title: The Genetic Basis of Hepatosplenic T-cell Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSTLs manifest frequent mutations in STAT5B (31%), STAT3 (9%), and PIK3CD (9%), for which there currently exist potential targeted therapies."
    explanation: >-
      Whole-exome sequencing of 68 cases quantifies STAT5B as the dominant
      JAK-STAT lesion.
  - reference: PMID:29337025
    reference_title: "Hepatosplenic T-cell Lymphoma: a review of clinicopathologic features, pathogenesis, and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in STAT3 or STAT5B lead to activation of the JAK/STAT pathway, and mutations involving SETD2, IN080 and ARID1 are involved in chromatin modification."
    explanation: >-
      Review statement naming the pathway consequence of the STAT5B lesion.
- name: Chromatin Modifier Loss of Function
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function mutation of chromatin-modifying genes is the most common lesion
    class in HSTCL, affecting the majority of cases; SETD2, INO80 and ARID1B are the
    recurrently affected members. SETD2, the H3K36 trimethyltransferase, is bound here
    as the exemplar because it is the most frequently silenced single gene and the one
    shown experimentally to act as a tumor suppressor. The 62% figure below is the
    frequency of the lesion class, not of SETD2 alone.
  genes:
  - preferred_term: SETD2
    term:
      id: hgnc:18420
      label: SETD2
  molecular_functions:
  - preferred_term: SETD2 H3K36 trimethyltransferase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0140955
      label: histone H3K36 trimethyltransferase activity
  downstream:
  - target: Clonal Expansion of Cytotoxic Gamma-Delta T Cells
    causal_link_type: DIRECT
    description: >-
      Loss of the tumor suppressor removes a brake on proliferation of the clone.
  evidence:
  - reference: PMID:28122867
    reference_title: The Genetic Basis of Hepatosplenic T-cell Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromatin-modifying genes, including SETD2, INO80, and ARID1B, were commonly mutated in HSTL, affecting 62% of cases."
    explanation: >-
      Quantifies chromatin-modifier loss as the most frequent lesion class.
  - reference: PMID:28122867
    reference_title: The Genetic Basis of Hepatosplenic T-cell Lymphoma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We experimentally demonstrated that SETD2 acts as a tumor suppressor gene."
    explanation: >-
      Functional demonstration that SETD2 loss is causal rather than incidental.
- name: Clonal Expansion of Cytotoxic Gamma-Delta T Cells
  biological_scale: CELLULAR
  description: >-
    A monoclonal population of cytotoxic T cells, usually expressing the gamma/delta
    T-cell receptor with restricted V-delta-1 usage, expands. Clonality is
    demonstrable by T-cell receptor gamma and delta gene rearrangement.
  cell_types:
  - preferred_term: cytotoxic gamma-delta T cell
    term:
      id: CL:0000798
      label: gamma-delta T cell
  downstream:
  - target: Sinusoidal Infiltration of Spleen, Liver and Bone Marrow
    causal_link_type: DIRECT
    description: >-
      The expanded clone homes to and fills the sinusoidal compartments.
  - target: Systemic Inflammatory Response
    causal_link_type: DIRECT
    description: >-
      The neoplastic clone drives a systemic inflammatory state, which in a subset
      of patients reaches frank hemophagocytic syndrome.
  evidence:
  - reference: PMID:8314255
    reference_title: "Hepatosplenic T-cell lymphoma: an unusual case of a gamma delta T-cell lymphoma with a blast-like terminal transformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometry studies showed cells with an unusual T-cell phenotype expressing the gamma delta T-cell receptor and restricted expression of the V delta 1 but not the V delta 2 protein, indicating the clonal nature of the proliferation."
    explanation: >-
      Documents the restricted V-delta-1 gamma/delta phenotype and its clonality.
  - reference: PMID:15968729
    reference_title: Hepatosplenic gammadelta T-cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCR delta gene rearrangements were detected in six out of the eight cases"
    explanation: >-
      Molecular confirmation of clonal T-cell receptor delta rearrangement in a series.
- name: Sinusoidal Infiltration of Spleen, Liver and Bone Marrow
  biological_scale: TISSUE
  description: >-
    Neoplastic cells occupy the splenic red pulp cords and sinuses and the hepatic
    sinusoids, and infiltrate the bone marrow, producing organomegaly and cytopenias
    without nodal disease. This sinusoidal tropism is the defining tissue-level
    feature of the entity.
  locations:
  - preferred_term: red pulp of spleen
    term:
      id: UBERON:0001250
      label: red pulp of spleen
  - preferred_term: hepatic sinusoid
    term:
      id: UBERON:0001281
      label: hepatic sinusoid
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  downstream:
  - target: Splenomegaly
    causal_link_type: DIRECT
  - target: Hepatomegaly
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  - target: Anemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15968729
    reference_title: Hepatosplenic gammadelta T-cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, lymphoma cells infiltrated the cords of Billroth and often packed the sinuses."
    explanation: >-
      Describes the splenic red pulp infiltration pattern directly.
  - reference: PMID:15968729
    reference_title: Hepatosplenic gammadelta T-cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver biopsy showed lymphoma cell infiltrations in the sinusoids, and three cases showed involvements of the portal tracts."
    explanation: >-
      Documents the hepatic sinusoidal infiltration that names the disease.
  - reference: PMID:29337025
    reference_title: "Hepatosplenic T-cell Lymphoma: a review of clinicopathologic features, pathogenesis, and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients present with extranodal disease involving the spleen, liver and bone marrow; lymphadenopathy is usually absent."
    explanation: >-
      Establishes the three-compartment extranodal distribution and the absence of
      nodal disease that distinguishes HSTCL from most lymphomas.
- name: Systemic Inflammatory Response
  biological_scale: ORGANISM
  description: >-
    A systemic inflammatory state accompanies the disease, producing fever in
    essentially all patients and, in a subset, hemophagocytic syndrome. Hemophagocytic
    syndrome at onset marks a harder-to-treat course with higher mortality.
  downstream:
  - target: Fever
    causal_link_type: DIRECT
  - target: Hemophagocytosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39696449
    reference_title: "Clinical and Splenectomy-based Treatment Outcomes in 40 Cases of Hepatosplenic T-cell Lymphoma: A Comprehensive Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented with fever, with some exhibiting emaciation and/or hemophagocytic syndrome."
    explanation: >-
      Establishes fever as universal and hemophagocytic syndrome as a recognised
      subset presentation in a 40-case series.
phenotypes:
- category: Abdominal
  name: Splenomegaly
  description: >-
    Splenomegaly is near-universal and characteristically massive, reflecting

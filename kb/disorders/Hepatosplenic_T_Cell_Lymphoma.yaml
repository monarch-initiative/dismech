environmental:
- name: Chronic combined thiopurine and anti-TNF immunosuppression
  description: >-
    A substantial minority of HSTCL arises in patients on long-term therapeutic
    immunosuppression, classically a thiopurine combined with an anti-TNF agent for
    inflammatory bowel disease. The association is real but is neither necessary nor
    confined to young men, and population-based series have identified cohorts with
    no anti-TNF exposure at all.
  influences_mechanisms:
  - target: Clonal Expansion of Cytotoxic Gamma-Delta T Cells
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained pharmacologic immunosuppression is the setting in which the
      gamma/delta clone emerges in this subset of patients.
    evidence:
    - reference: PMID:21941193
      reference_title: "Hepatosplenic T-cell lymphoma in patients receiving TNF-α inhibitor therapy: expanding the groups at risk."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Twenty-four cases (96%) also received an immunomodulator (azathioprine, 6-mercaptopurine, or methotrexate)."
      explanation: >-
        In the FDA adverse-event series nearly every anti-TNF-associated case had
        concomitant immunomodulator exposure, which is the combination this link
        describes.
  evidence:
  - reference: PMID:21941193
    reference_title: "Hepatosplenic T-cell lymphoma in patients receiving TNF-α inhibitor therapy: expanding the groups at risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five cases of HSTCL were identified. Twenty-two (88%) patients had inflammatory bowel disease and three had rheumatoid arthritis."
    explanation: >-
      Establishes the immunosuppressed inflammatory-disease population in which
      these cases arose.
  - reference: PMID:21941193
    reference_title: "Hepatosplenic T-cell lymphoma in patients receiving TNF-α inhibitor therapy: expanding the groups at risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSTCL is no longer restricted to the previously identified risk group of young male patients, but can also occur in patients with rheumatoid arthritis, females and older adults receiving TNF-α inhibitors and immunomodulators."
    explanation: >-
      Qualifies the classic young-male IBD stereotype, which is why this entry does
      not state the association as a demographic rule.
  - reference: PMID:27099586
    reference_title: "Hepatosplenic T-Cell Lymphoma: A Population-Based Study Assessing Incidence and Association With Immune-Mediated Disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the 12 HSTCL patients had been treated with an anti-tumor necrosis factor-α agent."
    explanation: >-
      Supports this entry's claim that the exposure is neither necessary nor confined
      to the classic group: a complete-capture national series accrued twelve cases
      with no anti-TNF exposure at all. Graded INDIRECT because non-necessity follows
      by inference from the absence rather than being asserted. It is SUPPORT, not
      REFUTE, because the claim being evidenced is the qualified one this entry makes,
      not the stronger reading that the exposure is required.

progression:
- phase: Course after diagnosis
  notes: >-
    Rapidly progressive disease with short survival. A minority achieve long-term
    survival; liver involvement and chronic immunosuppression mark a worse course.
  evidence:
  - reference: PMID:33160933
    reference_title: "Outcomes of Hepatosplenic T-Cell Lymphoma: The Mayo Clinic Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median progression-free and overall survival were 9.5 months (95% CI, 1.8, 16.3) and 12.4 months (95% CI, 4.9, 18.5), respectively."
    explanation: Survival figures from a consecutive institutional cohort.
  - reference: PMID:33160933
    reference_title: "Outcomes of Hepatosplenic T-Cell Lymphoma: The Mayo Clinic Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver involvement and chronic immunosuppression were associated with shorter survival."
    explanation: Prognostic factors reported by the same cohort.
treatments:
- name: Combination Chemotherapy
  description: >-
    Combination chemotherapy is the backbone of initial treatment for most patients,
    with transplant added where feasible. Relapse is frequent and most patients die
    of the disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Clonal Expansion of Cytotoxic Gamma-Delta T Cells
    description: Cytotoxic therapy directed at the proliferating neoplastic clone.
  evidence:
  - reference: PMID:28122867
    reference_title: The Genetic Basis of Hepatosplenic T-cell Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most HSTL patients are treated with combination chemotherapy and, when feasible, bone marrow transplantation, but relapses are frequent and the overwhelming majority of patients succumb to HSTL."
    explanation: >-
      States the standard of care and, in the same sentence, its limits.
- name: Splenectomy
  description: >-
    Splenectomy followed by chemotherapy was associated with longer survival than
    chemotherapy alone in a 40-case series, and three of the four long-term survivors
    in a separate institutional cohort had splenectomy as part of initial treatment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Sinusoidal Infiltration of Spleen, Liver and Bone Marrow
    description: >-
      Removes the dominant compartment of tumor burden and the site of splenic
      sequestration driving the cytopenias.
  evidence:
  - reference: PMID:39696449
    reference_title: "Clinical and Splenectomy-based Treatment Outcomes in 40 Cases of Hepatosplenic T-cell Lymphoma: A Comprehensive Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who underwent splenectomy followed by chemotherapy had a higher median and average survival time compared to those who only received chemotherapy."
    explanation: >-
      Direct comparison of splenectomy-plus-chemotherapy against chemotherapy alone.
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    There is no consensus standard of care. Several studies support a role for
    allogeneic hematopoietic stem cell transplant, though the largest single-centre
    series did not demonstrate a statistically significant benefit, which it
    attributed to sample size.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Clonal Expansion of Cytotoxic Gamma-Delta T Cells
    description: >-
      Replaces the haematopoietic compartment harbouring the neoplastic clone.
    evidence:
    - reference: PMID:33160933
      reference_title: "Outcomes of Hepatosplenic T-Cell Lymphoma: The Mayo Clinic Experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Moreover, 3 of 4 long-term survivors had splenectomy as part of initial treatment, and 2 of 4 long-term survivors received an allogeneic hematopoietic cell transplant (allo-HCT)."
      explanation: >-
        Half of the long-term survivors in this cohort received allogeneic
        transplant. Graded INDIRECT because survival after transplant is an
        outcome from which clearance of the neoplastic clone is inferred; the
        cohort does not measure clone eradication directly.
  evidence:
  - reference: PMID:29337025
    reference_title: "Hepatosplenic T-cell Lymphoma: a review of clinicopathologic features, pathogenesis, and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although several studies support a role for allogeneic hematopoietic stem cell transplant"
    explanation: Review position on the role of allogeneic transplant.
  - reference: PMID:33160933
    reference_title: "Outcomes of Hepatosplenic T-Cell Lymphoma: The Mayo Clinic Experience."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "our data do not show a statistically significant benefit of splenectomy and/or allo-HCT, likely as a result of our small sample size."
    explanation: >-
      Recorded as REFUTE so the negative result stays visible, and INDIRECT because
      it bears on the claim only through inference: the tested exposure is the
      composite "splenectomy and/or allo-HCT" rather than transplant alone, and the
      authors read their own null as underpowered rather than as absence of benefit.
histopathology:
- name: Sinusoidal infiltration by atypical lymphocytes
  description: >-
    Lymphoma cells fill the splenic cords of Billroth and sinuses and the hepatic
    sinusoids, without a mass lesion and without nodal involvement.
  evidence:
  - reference: PMID:15968729
    reference_title: Hepatosplenic gammadelta T-cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spleens were enlarged and the cut surfaces were homogeneous and red-purple in color without identifiable gross lesions or enlarged hilar lymph nodes."
    explanation: >-
      Gross description recording the absence of a mass lesion and of nodal disease,
      which is what distinguishes this pattern from most lymphomas.
  - reference: PMID:39696449
    reference_title: "Clinical and Splenectomy-based Treatment Outcomes in 40 Cases of Hepatosplenic T-cell Lymphoma: A Comprehensive Analysis."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splenomegaly was evident in 10 cases, while 5 patients exhibited liver enlargement, 7 exhibited lymph node enlargement, and 5 exhibited bone marrow involvement."
    explanation: >-
      Contrary evidence, recorded rather than omitted. Seven of ten patients in this
      cohort had lymph node enlargement, against the characteristic absence of
      lymphadenopathy that this entry relies on in its description, its infiltration
      node and its lump/split argument. Graded INDIRECT because the same paper writes
      that "Lymph node involvement is less common", so the series qualifies the WHO
      characterisation rather than overturning it - and because radiological node
      enlargement in a systemically inflamed patient is not the same claim as nodal
      lymphomatous involvement.
- name: Cytotoxic T-cell immunophenotype
  description: >-
    Lymphoma cells are CD3 positive and characteristically CD4 negative, with variable
    CD8 and frequent CD56 expression, and express the gamma/delta T-cell receptor in
    the majority of cases and alpha/beta in a minority.
  evidence:
  - reference: PMID:15968729
    reference_title: Hepatosplenic gammadelta T-cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemically lymphoma cells were positive for CD3, CD43, and CD56 in all cases. Four of eight cases were positive for CD8, and all cases were negative for CD4 (6/6)."
    explanation: >-
      Immunophenotype of the neoplastic cells in a consecutive series.
  - reference: PMID:33160933
    reference_title: "Outcomes of Hepatosplenic T-Cell Lymphoma: The Mayo Clinic Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypically, lymphoma cells had gamma/delta T-cell receptor expression in 18 (82%) and alpha/beta in 4 patients."
    explanation: >-
      Quantifies the gamma/delta majority and the alpha/beta minority. This is the
      figure the scope note in `notes` argues from, recorded here rather than left
      implicit.

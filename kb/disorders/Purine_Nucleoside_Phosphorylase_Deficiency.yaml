genetic:
- name: PNP
  association: Biallelic loss-of-function variants
  gene_term:
    preferred_term: PNP
    term:
      id: hgnc:7892
      label: PNP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PNP is located on the long arm of chromosome 14. Reported pathogenic variants include
    missense substitutions abolishing catalytic activity, frameshifts and multi-exon
    deletions; a partial-activity missense allele (p.His257Asp) leaves 8-11% residual
    activity and a strikingly mild phenotype. The encoded protein is a trimer expressed in
    most tissues but at highest level in lymphoid tissue, which is the reason a
    ubiquitously expressed enzyme defect produces a predominantly lymphoid disease.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene for PNP has been cloned; it is located on the long arm of chromosome 14.
      Studies of a mutant PNP gene isolated from one patient showed that a point mutation
      resulting in an amino acid substitution was responsible for PNP deficiency.
    explanation: >-
      Establishes PNP as the causative gene, its chromosomal location, and a point
      mutation as a demonstrated mechanism of enzyme loss.
  - reference: PMID:39772979
    reference_title: >-
      Hematopoietic stem cell transplantation for purine nucleoside phosphorylase
      deficiency with two novel mutations: a case report and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One hemizygous variant was c.385dup (p.Ile129Asnfs*6) in exon 4. The other was a
      heterozygous deletion in exon 2-6.
    explanation: >-
      Documents the allelic spectrum beyond missense change, including frameshift and
      multi-exon deletion alleles.

pathophysiology:
- name: Biallelic PNP Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Inheritance of two defective PNP alleles abolishes or severely reduces purine
    nucleoside phosphorylase activity in every cell. Because one functional allele
    suffices for health, and because as little as 8-11% of normal activity supports
    near-normal immunity and entirely normal neurological development, the disease
    requires near-complete enzyme loss rather than mere reduction.
  downstream:
  - target: Loss of Purine Nucleoside Phosphorolysis
    causal_link_type: DIRECT
    description: >-
      Loss-of-function alleles remove the catalytic activity that this step depends on.
  evidence:
  - reference: PMID:32695102
    reference_title: >-
      Partial Purine Nucleoside Phosphorylase Deficiency Helps Determine Minimal Activity
      Required for Immune and Neurological Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PNP activity in various cells from two patients were 8-11% of the normal level.
    explanation: >-
      Establishes the residual-activity threshold: this level of activity was compatible
      with survival into the third decade and normal neurological development, so the
      severe disease requires near-complete loss.

- name: Loss of Purine Nucleoside Phosphorolysis
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    PNP catalyses the phosphorolysis of inosine, guanosine, deoxyinosine and
    deoxyguanosine in the purine salvage pathway. Losing that step blocks the route from
    these nucleosides onward to hypoxanthine, xanthine and ultimately uric acid, and
    leaves the substrates to accumulate. The disease is therefore driven by what builds up
    behind the block rather than by any product the cell fails to make.
  molecular_functions:
  - preferred_term: purine-nucleoside phosphorylase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004731
      label: purine-nucleoside phosphorylase activity
  biological_processes:
  - preferred_term: purine nucleoside catabolic process
    modifier: DECREASED
    term:
      id: GO:0006152
      label: purine nucleoside catabolic process
  downstream:
  - target: Accumulation of Deoxyguanosine and Other PNP Substrates
    causal_link_type: DIRECT
    description: >-
      Blocking phosphorolysis causes the enzyme's own substrates to accumulate in cells
      and body fluids.
  - target: Hypouricemia and Elevated Urinary Purine Nucleosides
    causal_link_type: DIRECT
    description: >-
      With the catabolic route to uric acid interrupted, serum urate falls and unmetabolised
      nucleosides are excreted.
  evidence:
  - reference: PMID:35063692
    reference_title: >-
      Combined immunodeficiency due to purine nucleoside phosphorylase deficiency: Outcome
      of three patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Purine nucleoside phosphorylase (PNP) is a key enzyme in the purine salvage pathway.
    explanation: >-
      Places the lost enzymatic step in the purine salvage pathway, which is the content of
      this node.

- name: Hypouricemia and Elevated Urinary Purine Nucleosides
  biological_scale: MOLECULAR
  role: biomarker
  description: >-
    Because uric acid is the end product of the interrupted pathway, serum urate is
    characteristically low - often strikingly so - and unmetabolised PNP substrates appear
    in the urine. This pairing is the cheap, widely available diagnostic clue that
    distinguishes PNP deficiency from other combined immunodeficiencies, and low uric acid
    in a lymphopenic infant should prompt the specific enzyme assay. Notably, urinary
    substrate elevation is the more sensitive of the two: partial-deficiency patients had
    entirely normal blood uric acid yet still excreted increased PNP substrates.
  evidence:
  - reference: PMID:33061764
    reference_title: >-
      Recurrent infections, neurologic signs, low serum uric acid levels, and lymphopenia in
      childhood: Purine nucleoside phosphorylase deficiency, an emergency for infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absolute lymphocyte counts and serum uric acid levels were very low, and serum
      immunoglobulin levels were normal or slightly lower in all cases.
    explanation: >-
      Documents the low serum uric acid with lymphopenia in all four cases of a case series,
      the diagnostic signature this node represents.
  - reference: PMID:32695102
    reference_title: >-
      Partial Purine Nucleoside Phosphorylase Deficiency Helps Determine Minimal Activity
      Required for Immune and Neurological Development.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All siblings had normal blood uric acid and increased PNP substrates in the urine.
    explanation: >-
      Shows the two biochemical markers dissociate in partial deficiency - urate normal,
      urinary substrates raised. Recorded as PARTIAL because it supports the urinary marker
      while contradicting hypouricemia as a universal finding.

- name: Accumulation of Deoxyguanosine and Other PNP Substrates
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Inosine, guanosine, deoxyinosine and above all deoxyguanosine accumulate behind the
    enzymatic block. Deoxyguanosine is the toxic species: unlike the ribonucleosides it can
    be phosphorylated onward to a deoxynucleotide triphosphate, and it is this conversion
    that converts a metabolic block into cell death.
  downstream:
  - target: Intracellular dGTP Pooling in Lymphoid Cells
    causal_link_type: DIRECT
    description: >-
      Accumulated deoxyguanosine is phosphorylated to dGTP, which is the proximate toxin;
      the T-cell-lethal arm of this conversion requires deoxycytidine kinase activity.
  - target: CNS Purine Nucleotide Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Systemic purine imbalance extends to the central nervous system, but the intermediates
      linking it to neuronal dysfunction are not established - see the
      `pnp-neurological-mechanism` knowledge gap.
  - target: Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands
    causal_link_type: DIRECT
    description: >-
      The same accumulating (deoxy)guanosine nucleosides are ligands for TLR7, so the
      metabolic block simultaneously removes a brake on innate nucleic-acid sensing.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The elevated dGTP found in PNP deficiency is thought to inhibit ribonucleotide
      reductase and, thus, impede cell division.
    explanation: >-
      Establishes deoxyguanosine-derived dGTP as the accumulating toxic species and names
      the classical downstream target.

- name: Intracellular dGTP Pooling in Lymphoid Cells
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Deoxyguanosine is phosphorylated to dGTP, which pools to toxic concentrations
    preferentially in lymphoid cells. The tissue selectivity is the crux of the disease and
    has a simple explanation: PNP is expressed in most tissues but at its highest levels in
    lymphoid tissue, so lymphoid cells carry the largest flux through the missing step and
    the largest substrate burden when it fails. This is why a ubiquitously expressed enzyme
    defect produces a predominantly lymphoid disease.
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Ribonucleotide Reductase Inhibition and Impaired DNA Replication
    causal_link_type: DIRECT
    description: >-
      dGTP is an allosteric inhibitor of ribonucleotide reductase, distorting the
      deoxyribonucleotide pools required for DNA synthesis.
  - target: Mitochondrial dGTP Accumulation and Impaired mtDNA Repair
    causal_link_type: DIRECT
    description: >-
      dGTP accumulating in mitochondria inhibits mitochondrial DNA repair.
  - target: SAMHD1-Dependent Synthetic Lethality in Developing T Cells
    causal_link_type: DIRECT
    description: >-
      The synthetic-lethal interaction is not a standing property of the thymocyte but is
      created by the accumulating dNTP load: SAMHD1 is the triphosphohydrolase that would
      dispose of it, and developing thymocytes physiologically downregulate SAMHD1, so the
      dGTP burden arrives in the one cell type that has stood down its disposal capacity.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is found in most tissues of the body but is at highest levels in lymphoid tissues.
      This tissue distribution explains why the lymphoid system is predominantly affected in
      PNP deficiency.
    explanation: >-
      Supplies the explanation for the lymphoid selectivity that is the defining feature of
      this node.

- name: Ribonucleotide Reductase Inhibition and Impaired DNA Replication
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Elevated dGTP allosterically inhibits ribonucleotide reductase, the enzyme that
    supplies deoxyribonucleotides for DNA synthesis. The consequence is distorted dNTP
    pools and impeded cell division, which falls hardest on the rapidly proliferating
    thymocyte compartment. This is the classical explanation for the immunodeficiency and
    the direct mechanistic parallel with adenosine deaminase deficiency, where accumulated
    dATP acts on the same enzyme.
  biological_processes:
  - preferred_term: DNA replication
    modifier: DECREASED
    term:
      id: GO:0006260
      label: DNA replication
  downstream:
  - target: Thymocyte and Peripheral T Lymphocyte Apoptosis
    causal_link_type: DIRECT
    description: >-
      Cells that cannot complete DNA replication in the proliferating thymocyte compartment
      die rather than mature.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The elevated dGTP found in PNP deficiency is thought to inhibit ribonucleotide
      reductase and, thus, impede cell division.
    explanation: >-
      States the ribonucleotide reductase mechanism and its consequence for cell division,
      which is the content of this node. The hedged wording of the source is preserved in
      the node description.

- name: Mitochondrial dGTP Accumulation and Impaired mtDNA Repair
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    A distinct and more specific mechanism, established in PNP-knockout mice: dGTP
    accumulating within mitochondria inhibits mitochondrial DNA repair, so T cells become
    hypersensitive to the spontaneous mitochondrial DNA damage they would ordinarily
    tolerate. The knockout mice reproduce the human pattern - T lymphocytes affected more
    severely than B, impaired thymocyte differentiation, reduced peripheral T cells - and
    their T cells show increased apoptosis in vivo and heightened sensitivity to gamma
    irradiation in vitro. The irradiation-sensitivity phenotype is directly corroborated in
    human cells: lymphoblastoid B cells from a patient with absent PNP activity survived
    irradiation markedly less well than cells from partial-deficiency patients or healthy
    controls.
  biological_processes:
  - preferred_term: mitochondrial DNA repair
    modifier: DECREASED
    term:
      id: GO:0043504
      label: mitochondrial DNA repair
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Thymocyte and Peripheral T Lymphocyte Apoptosis
    causal_link_type: DIRECT
    description: >-
      Unrepaired mitochondrial DNA damage triggers apoptosis of the T cells that carry it.
  evidence:
  - reference: PMID:10859343
    reference_title: >-
      Mitochondrial basis for immune deficiency. Evidence from purine nucleoside
      phosphorylase-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that the immune deficiency in PNP deficiency is a result of inhibition of
      mitochondrial DNA repair due to the accumulation of dGTP in the mitochondria.
    explanation: >-
      States the mitochondrial mechanism this node represents. Evidence source is
      MODEL_ORGANISM because the mechanism was established in PNP-knockout mice.
  - reference: PMID:10859343
    reference_title: >-
      Mitochondrial basis for immune deficiency. Evidence from purine nucleoside
      phosphorylase-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      T lymphocytes of PNP-deficient mice exhibit increased apoptosis in vivo and higher
      sensitivity to gamma irradiation in vitro.
    explanation: >-
      Supplies the apoptosis and DNA-damage-sensitivity phenotype that links this node to
      the downstream T-cell death node.
  - reference: PMID:32695102
    reference_title: >-
      Partial Purine Nucleoside Phosphorylase Deficiency Helps Determine Minimal Activity
      Required for Immune and Neurological Development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The survival of lymphoblastoid B cells from 2 partial PNP-deficient patients after
      irradiation was similar to that of PNP-proficient cells and markedly higher than the
      survival of cells from a patient with absent PNP activity
    explanation: >-
      Human-cell corroboration that DNA-damage sensitivity tracks residual PNP activity,
      which is what makes the murine mitochondrial mechanism credible for human disease.

- name: Thymocyte and Peripheral T Lymphocyte Apoptosis
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Converging nuclear and mitochondrial DNA insults drive apoptosis of thymocytes and
    peripheral T cells. This is the point at which a metabolic lesion becomes an immune
    one, and it explains a clinical peculiarity of PNP deficiency: T-cell function may be
    normal at birth and decline with time, or fluctuate between low and normal, because the
    defect is a progressive attritional loss of cells rather than a developmental failure to
    make them.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Impaired Thymocyte Development and Reduced T-Cell Output
    causal_link_type: DIRECT
    description: >-
      Loss of maturing thymocytes reduces the thymic production of peripheral T cells.
  evidence:
  - reference: PMID:10859343
    reference_title: >-
      Mitochondrial basis for immune deficiency. Evidence from purine nucleoside
      phosphorylase-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The end result is increased sensitivity of T cells to spontaneous mitochondrial DNA
      damage, leading to T cell depletion by apoptosis.
    explanation: >-
      States apoptotic T-cell depletion as the endpoint of the metabolic chain, the content
      of this node. Evidence source is MODEL_ORGANISM.
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      T-cell function may be profoundly deficient, may be normal at birth and then decrease
      with time, or may fluctuate repeatedly between low and normal.
    explanation: >-
      Documents the progressive and fluctuating T-cell course in patients, which is the
      clinical signature of attritional cell loss rather than a developmental block.

- name: Impaired Thymocyte Development and Reduced T-Cell Output
  biological_scale: TISSUE
  role: consequence
  description: >-
    The thymus fails as a T-cell factory: thymocyte differentiation is impaired and the
    numbers of maturing thymocytes and of peripheral T cells fall. Because the lesion is
    intrinsic to the haematopoietic compartment rather than to the thymic stroma, replacing
    the haematopoietic system corrects it - which is the mechanistic basis for
    transplantation being curative.
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  downstream:
  - target: T-Cell Predominant Combined Immunodeficiency
    causal_link_type: DIRECT
    description: >-
      Loss of thymic output produces the peripheral T-cell deficiency that defines the
      clinical immunodeficiency.
  evidence:
  - reference: PMID:10859343
    reference_title: >-
      Mitochondrial basis for immune deficiency. Evidence from purine nucleoside
      phosphorylase-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PNP knockout mice exhibit impaired thymocyte differentiation, reduced mitogenic and
      allogeneic responses, and decreased numbers of maturing thymocytes and peripheral T
      cells.
    explanation: >-
      Documents impaired thymocyte differentiation and reduced thymic output, the content of
      this node. Evidence source is MODEL_ORGANISM.

- name: CNS Purine Nucleotide Imbalance
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    Purine imbalance extends to the central nervous system, and depressed GTP levels have
    been proposed to correlate with the neurological dysfunction. This node is deliberately
    curated as a proposal rather than an established chain: the mechanism connecting purine
    imbalance to neuronal dysfunction in PNP deficiency is not settled, the neurological arm
    is not explained by the T-cell mechanism, and transplantation corrects the immune defect
    without reliably reversing established neurological disease. See the
    `pnp-neurological-mechanism` knowledge gap.
  downstream:
  - target: Neurological Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediates between CNS purine imbalance and neuronal dysfunction are not
      established; the edge is asserted at low confidence and flagged as an open gap.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Depressed GTP levels may correlate with neurologic dysfunction.
    explanation: >-
      The only mechanistic proposal available for the neurological arm, and the source
      itself states it only as a possible correlation. Recorded as PARTIAL for that reason.

- name: T-Cell Predominant Combined Immunodeficiency
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The resulting immunodeficiency is combined but asymmetric: T-cell numbers and function
    are profoundly affected while B-cell function is normal in most patients and deficient
    in roughly a third, and NK function is variable. Serum immunoglobulins are often normal
    or only slightly reduced, which is a diagnostic trap - normal immunoglobulins do not
    exclude the disease. PNP deficiency accounts for approximately 4% of severe combined
    immunodeficiency.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Recurrent and Opportunistic Infection
    causal_link_type: DIRECT
    description: >-
      Loss of T-cell immunity permits recurrent bacterial and opportunistic infection.
  - target: Immune Dysregulation with Autoimmunity and EBV-Driven Lymphoma
    causal_link_type: DIRECT
    description: >-
      Defective T-cell regulation and surveillance permit autoimmunity and uncontrolled
      EBV-driven lymphoproliferation.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      B-cell function can be normal but is deficient in approximately one third of patients.
    explanation: >-
      Quantifies the asymmetry between the T-cell and B-cell arms that defines this node.
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Purine nucleoside phosphorylase (PNP) deficiency is a rare inherited disease
      accounting for approximately 4% of patients with severe combined immunodeficiency.
    explanation: >-
      Places the disease quantitatively within the SCID population.

- name: Recurrent and Opportunistic Infection
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Recurrent respiratory and gastrointestinal infections, usually beginning in the first
    year of life, and opportunistic infections reflecting the T-cell defect. Infection is
    the commonest cause of death: in one four-patient series three died of sepsis during
    follow-up.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PNP-deficient patients suffer from recurrent infections, usually beginning in the
      first year of life.
    explanation: >-
      Establishes recurrent infection and its typical age of onset.
  - reference: PMID:33061764
    reference_title: >-
      Recurrent infections, neurologic signs, low serum uric acid levels, and lymphopenia in
      childhood: Purine nucleoside phosphorylase deficiency, an emergency for infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of the four patients were lost due to sepsis during follow-up, and one patient
      was lost due to veno-occlusive disease in the post-hematopoietic stem cell
      transplantation period.
    explanation: >-
      Documents infection as the dominant cause of death in an untransplanted cohort, the
      basis for treating the condition as a paediatric emergency.

- name: Immune Dysregulation with Autoimmunity and EBV-Driven Lymphoma
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Loss of T-cell regulation and surveillance produces two distinct complications.
    Autoimmunity affects about a third of patients, most often autoimmune haemolytic
    anaemia, with immune thrombocytopenic purpura and lupus also reported. Separately,
    failure of T-cell control of Epstein-Barr virus permits EBV-associated lymphoma, which
    has repeatedly proved fatal before transplantation could be undertaken - a specific
    reason the diagnosis is urgent rather than merely serious.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One third of patients develop autoimmune disease. The most common manifestation of
      this is autoimmune hemolytic anemia.
    explanation: >-
      Quantifies the autoimmune arm and names its commonest manifestation.
  - reference: PMID:31707514
    reference_title: The Broad Clinical Spectrum and Transplant Results of PNP Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient died of EBV-related lymphoma with CNS involvement prior to transplant.
    explanation: >-
      Documents fatal EBV-driven lymphoma occurring before transplantation, the specific
      malignancy risk of this node.

- name: Neurological Dysfunction
  biological_scale: ORGANISM
  role: consequence
  description: >-
    About two thirds of patients have neurological disease, ranging from spasticity through
    developmental delay to intellectual disability, and roughly a quarter first come to
    medical attention for neurological rather than infectious problems. The neurological arm
    is mechanistically separate from the immunological one: it is not explained by T-cell
    depletion, it is absent in some patients with full-blown immunodeficiency, and it is not
    reliably reversed by correcting the immune defect. Reported post-transplant neurological
    outcomes range from excellent to persistent mild developmental delay without further
    deterioration.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two thirds of patients have evidence of neurologic disorders. Findings range from
      spasticity to developmental delay, to mental retardation.
    explanation: >-
      Quantifies the neurological arm and describes its range, the content of this node.
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients usually present with infections but approximately one fourth have come to
      medical care initially for neurological problems.
    explanation: >-
      Shows the neurological arm can be the presenting problem, supporting its status as a
      partly independent disease dimension.
  - reference: PMID:30885031
    reference_title: >-
      The First Purine Nucleoside Phosphorylase Deficiency Patient Resembling IgA Deficiency
      and a Review of the Literature.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PNP deficiency should be considered in late-onset children with recurrent infections,
      autoimmune disorders without typical neurologic impairment.
    explanation: >-
      Documents a patient with full immunodeficiency and autoimmunity but no neurological
      dysfunction. Recorded as PARTIAL because it qualifies the neurological arm as
      non-obligate rather than supporting it.

- name: Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    This node resolves what would otherwise be the central paradox of the disease: how a
    profound T-cell immunodeficiency produces autoimmunity in a third of patients. PNP does
    not have one immunological job but two, in different lineages. In B lymphocytes and
    macrophages it controls the levels of the (deoxy)guanosine nucleosides that are the
    ligands of Toll-like receptor 7, so losing PNP removes a brake on innate nucleic-acid
    sensing. Overriding that brake drives germinal centre formation in the absence of any
    exogenous antigen and accelerates disease in a mouse autoimmunity model. Autoimmunity in
    PNP deficiency is therefore not merely the passive consequence of failed T-cell
    regulation - it has its own positive, lineage-specific mechanism running in parallel.
  biological_processes:
  - preferred_term: toll-like receptor 7 signaling pathway
    modifier: INCREASED
    term:
      id: GO:0034154
      label: toll-like receptor 7 signaling pathway
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Immune Dysregulation with Autoimmunity and EBV-Driven Lymphoma
    causal_link_type: DIRECT
    description: >-
      Unrestrained TLR7 signalling drives antigen-independent germinal centre formation and
      accelerates autoimmune disease.
  evidence:
  - reference: PMID:35653193
    reference_title: >-
      Purine nucleoside phosphorylase enables dual metabolic checkpoints that prevent T cell
      immunodeficiency and TLR7-associated autoimmunity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In B lymphocytes and macrophages, PNP regulates Toll-like receptor 7 signaling by
      controlling the levels of its (deoxy)guanosine nucleoside ligands.
    explanation: >-
      Establishes the lineage-specific TLR7 checkpoint that this node represents. Evidence
      source is MODEL_ORGANISM because the mechanism was established in mouse and cellular
      systems.
  - reference: PMID:35653193
    reference_title: >-
      Purine nucleoside phosphorylase enables dual metabolic checkpoints that prevent T cell
      immunodeficiency and TLR7-associated autoimmunity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overriding this regulatory mechanism promotes germinal center formation in the absence
      of exogenous antigen and accelerates disease in a mouse model of autoimmunity.
    explanation: >-
      Supplies the causal consequence of losing the TLR7 brake, which justifies the downstream
      edge to the immune-dysregulation node. Evidence source is MODEL_ORGANISM.
  - reference: PMID:35653193
    reference_title: >-
      Purine nucleoside phosphorylase enables dual metabolic checkpoints that prevent T cell
      immunodeficiency and TLR7-associated autoimmunity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This work reveals that one purine metabolism gene protects against immunodeficiency and
      autoimmunity via independent mechanisms operating in distinct immune lineages
    explanation: >-
      States explicitly that the immunodeficiency and autoimmunity arms are independent
      lineage-specific mechanisms, which is why they are modelled here as parallel branches
      rather than one causing the other.

- name: SAMHD1-Dependent Synthetic Lethality in Developing T Cells
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    The T-cell arm is not simply dGTP toxicity but a gene-interaction effect. During T-cell
    development, PNP inactivation is synthetically lethal with downregulation of the dNTP
    triphosphohydrolase SAMHD1 - the enzyme that would otherwise dispose of excess dNTPs.
    Developing thymocytes physiologically downregulate SAMHD1, so they lose the very
    safeguard that would protect them from an accumulating dNTP load, which is a second and
    more specific explanation for why the disease targets the developing T-cell compartment.
    The interaction requires deoxycytidine kinase activity and is antagonised by
    microenvironmental deoxycytidine, so it is in principle a modifiable dependency.
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  downstream:
  - target: Thymocyte and Peripheral T Lymphocyte Apoptosis
    causal_link_type: DIRECT
    description: >-
      Loss of the SAMHD1 safeguard during T-cell development converts the dNTP burden into
      lethality for the developing thymocyte.
  evidence:
  - reference: PMID:35653193
    reference_title: >-
      Purine nucleoside phosphorylase enables dual metabolic checkpoints that prevent T cell
      immunodeficiency and TLR7-associated autoimmunity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During T cell development, PNP inactivation is synthetically lethal with downregulation
      of the dNTP triphosphohydrolase SAMHD1.
    explanation: >-
      Establishes the synthetic-lethal gene interaction that gives the T-cell arm its
      developmental-stage specificity. Evidence source is MODEL_ORGANISM.
  - reference: PMID:35653193
    reference_title: >-
      Purine nucleoside phosphorylase enables dual metabolic checkpoints that prevent T cell
      immunodeficiency and TLR7-associated autoimmunity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This interaction requires deoxycytidine kinase activity and is antagonized by
      microenvironmental deoxycytidine.
    explanation: >-
      Identifies the kinase required for the toxic conversion and a microenvironmental
      antagonist, which is why the interaction is described here as potentially modifiable.

phenotypes:
- category: Clinical
  name: Combined immunodeficiency
  description: >-
    Combined T- and B-cell immunodeficiency with T cells affected disproportionately.
    PNP deficiency accounts for approximately 4% of severe combined immunodeficiency.
  phenotype_term:
    preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In PNP deficiency, T- and B-cell immunity are affected.
    explanation: >-
      Establishes the combined character of the immunodeficiency.

- category: Clinical
  name: Recurrent infections
  description: >-
    Recurrent bacterial and opportunistic infections beginning in the first year of life,
    dominated by respiratory and gastrointestinal disease, and the commonest cause of
    death.
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
    temporality: RECURRENT
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PNP-deficient patients suffer from recurrent infections, usually beginning in the
      first year of life.
    explanation: >-
      Establishes recurrent infection and its typical onset.

- category: Laboratory
  name: Decreased total T cell count
  description: >-
    Profound T-cell lymphopenia is the defining laboratory abnormality. Because the
    mechanism is attritional apoptosis rather than a developmental block, counts may be
    normal at birth and fall over time, or fluctuate - so a single normal result does not
    exclude the diagnosis.
  phenotype_term:
    preferred_term: Decreased total T cell count
    term:
      id: HP:0005403
      label: Decreased total T cell count
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:30885031
    reference_title: >-
      The First Purine Nucleoside Phosphorylase Deficiency Patient Resembling IgA Deficiency
      and a Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a rare autosomal recessive primary immunodeficiency disorder characterized by
      decreased numbers of T-cells, variable B-cell abnormalities, decreased amount of serum
      uric acid and PNP enzyme activity
    explanation: >-
      Names decreased T-cell numbers as a defining feature of the disorder.
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      T-cell function may be profoundly deficient, may be normal at birth and then decrease
      with time, or may fluctuate repeatedly between low and normal.
    explanation: >-
      Documents the progressive and fluctuating course that makes a single normal T-cell
      result non-exclusionary.

- category: Laboratory
  name: Hypouricemia
  description: >-
    Low serum uric acid, the direct biochemical consequence of interrupting the purine
    catabolic route to urate, and the cheapest available diagnostic clue in a lymphopenic
    infant. Not universal: patients with partial deficiency had normal blood uric acid while
    still excreting increased PNP substrates in urine.
  phenotype_term:
    preferred_term: Hypouricemia
    term:
      id: HP:0003537
      label: Hypouricemia
  evidence:
  - reference: PMID:33061764
    reference_title: >-
      Recurrent infections, neurologic signs, low serum uric acid levels, and lymphopenia in
      childhood: Purine nucleoside phosphorylase deficiency, an emergency for infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absolute lymphocyte counts and serum uric acid levels were very low, and serum
      immunoglobulin levels were normal or slightly lower in all cases.
    explanation: >-
      Documents low serum uric acid in all four cases of a confirmed case series, alongside
      the deceptively normal immunoglobulins.

- category: Neurologic
  name: Global developmental delay
  frequency: FREQUENT
  description: >-
    Developmental delay is one of the three characteristic neurological manifestations, the
    others being spasticity and intellectual disability, each curated separately. The FREQUENT
    band comes from the two-thirds figure for neurological disease as a whole rather than for
    developmental delay specifically, since the source reports the neurological arm as a single
    proportion - so the band is an upper bound for this individual manifestation. About a
    quarter of patients present neurologically rather than with infection. This arm is not
    explained by the T-cell mechanism and is not reliably reversed by transplantation.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two thirds of patients have evidence of neurologic disorders. Findings range from
      spasticity to developmental delay, to mental retardation.
    explanation: >-
      Two thirds is approximately 67%, which falls in the FREQUENT band (30-79%) and is the
      quantitative basis for the frequency asserted here.


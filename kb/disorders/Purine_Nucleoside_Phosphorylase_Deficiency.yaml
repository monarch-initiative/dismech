diagnosis:
- name: Purine nucleoside phosphorylase enzyme activity assay
  description: >-
    Demonstration of absent or severely reduced PNP catalytic activity, conventionally
    measured by conversion of labelled inosine in erythrocyte haemolysates, mononuclear cells
    or lymphoblastoid cells, is the confirmatory biochemical test. Quantitation rather than a
    simple present/absent result matters here, because residual activity predicts phenotype:
    8-11% of normal was compatible with survival into the third decade and normal
    neurological development.
  diagnosis_term:
    preferred_term: enzyme activity assay
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Absent or severely reduced PNP activity confirms the diagnosis; residual activity should be
    quantified because it predicts severity.
  evidence:
  - reference: PMID:32695102
    reference_title: >-
      Partial Purine Nucleoside Phosphorylase Deficiency Helps Determine Minimal Activity
      Required for Immune and Neurological Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PNP protein expression was determined by Western Blotting in lymphoblastoid B cells. DNA
      repair was quantified by measuring viability of lymphoblastoid B cells following ionizing
      irradiation.
    explanation: >-
      Describes the specimen types and the paired protein-expression and DNA-repair assays used
      to characterise PNP deficiency, complementing the catalytic-activity measurement.
  - reference: PMID:30885031
    reference_title: >-
      The First Purine Nucleoside Phosphorylase Deficiency Patient Resembling IgA Deficiency
      and a Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by decreased numbers of T-cells, variable B-cell abnormalities, decreased
      amount of serum uric acid and PNP enzyme activity
    explanation: >-
      Names reduced PNP enzyme activity, alongside T-cell depletion and low uric acid, as a
      defining diagnostic feature.

- name: Plasma and urine purine metabolite profiling
  description: >-
    Quantitation of inosine, deoxyinosine, guanosine and deoxyguanosine with serum uric acid.
    The characteristic pattern is raised PNP substrates with low urate. The urinary substrate
    elevation is the more sensitive half of the pair: in partial deficiency blood uric acid was
    entirely normal while urinary PNP substrates were still raised, so a normal urate does not
    exclude the diagnosis.
  diagnosis_term:
    preferred_term: metabolite profiling
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Elevated inosine, guanosine, deoxyinosine and deoxyguanosine in plasma and urine with low
    serum uric acid.
  evidence:
  - reference: PMID:24767876
    reference_title: >-
      Diagnosis of immunodeficiency caused by a purine nucleoside phosphorylase defect by using
      tandem mass spectrometry on dried blood spots.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      caused by a enzyme defect leading to the accumulation of inosine, 2'-deoxy-inosine
      (dIno), guanosine, and 2'-deoxy-guanosine (dGuo) in all cells, especially lymphocytes
    explanation: >-
      Names the four accumulating metabolites that constitute the diagnostic profile.
  - reference: PMID:32695102
    reference_title: >-
      Partial Purine Nucleoside Phosphorylase Deficiency Helps Determine Minimal Activity
      Required for Immune and Neurological Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All siblings had normal blood uric acid and increased PNP substrates in the urine.
    explanation: >-
      Demonstrates that urinary substrate elevation persists when serum urate is normal, which
      is why urate alone is an inadequate screen.

- name: Lymphocyte subset enumeration and immune function testing
  description: >-
    T, B and NK cell counts with immunoglobulins and proliferation responses. Two traps are
    worth recording. Serum immunoglobulins are frequently normal or only slightly reduced, so
    normal immunoglobulins do not exclude the diagnosis. And T-cell counts may be normal at
    birth and decline with time or fluctuate, because the defect is progressive attritional
    apoptosis rather than a developmental block - so a single normal result is not
    exclusionary either.
  diagnosis_term:
    preferred_term: immunophenotyping
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Reduced T-cell numbers with variable B and NK abnormalities; immunoglobulins may be normal.
  evidence:
  - reference: PMID:33061764
    reference_title: >-
      Recurrent infections, neurologic signs, low serum uric acid levels, and lymphopenia in
      childhood: Purine nucleoside phosphorylase deficiency, an emergency for infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absolute lymphocyte counts and serum uric acid levels were very low, and serum
      immunoglobulin levels were normal or slightly lower in all cases.
    explanation: >-
      Documents the lymphopenia-with-normal-immunoglobulins pattern that makes this a
      diagnostic trap.

- name: PNP gene sequencing with deletion and duplication analysis
  description: >-
    Confirmation of biallelic pathogenic PNP variants. Sequencing alone is insufficient: the
    reported allelic spectrum includes multi-exon deletions as well as point and frameshift
    variants, so copy-number analysis has to accompany sequence analysis or a second allele can
    be missed. Whole-exome sequencing has been the route to diagnosis in several reported
    atypical presentations.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Two pathogenic PNP alleles confirm the diagnosis; deletion/duplication analysis is required
    alongside sequencing.
  evidence:
  - reference: PMID:39772979
    reference_title: >-
      Hematopoietic stem cell transplantation for purine nucleoside phosphorylase deficiency
      with two novel mutations: a case report and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One hemizygous variant was c.385dup (p.Ile129Asnfs*6) in exon 4. The other was a
      heterozygous deletion in exon 2-6.
    explanation: >-
      A compound genotype pairing a frameshift with a multi-exon deletion, which is exactly the
      case sequencing alone would fail to resolve.
  - reference: PMID:30885031
    reference_title: >-
      The First Purine Nucleoside Phosphorylase Deficiency Patient Resembling IgA Deficiency
      and a Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, whole-exome sequencing was used to detect mutation in the case suspected
      of having primary immunodeficiency.
    explanation: >-
      Documents whole-exome sequencing as the diagnostic route in an atypical presentation.

- name: Newborn screening by TREC/KREC and dried-blood-spot tandem mass spectrometry
  description: >-
    Two complementary newborn-screening routes exist and the distinction matters. Tandem mass
    spectrometry on dried blood spots detects the purine metabolite signature directly and was
    the original route; TREC/KREC analysis detects the downstream T-cell lymphopenia and can
    also pick the disease up, as first reported in 2021. Because transplantation is curative
    but its success depends on being early - and because EBV-driven lymphoma before transplant
    is a documented cause of death - presymptomatic detection is unusually consequential here.
    A TREC-based screen may still miss milder or evolving disease, since it detects the
    consequence rather than the metabolic defect.
  diagnosis_term:
    preferred_term: newborn screening
    term:
      id: NCIT:C81178
      label: Newborn Screening
  results: >-
    Reduced TREC/KREC copy number and/or an abnormal dried-blood-spot purine profile prompt
    confirmatory enzyme and molecular testing.
  evidence:
  - reference: PMID:24767876
    reference_title: >-
      Diagnosis of immunodeficiency caused by a purine nucleoside phosphorylase defect by using
      tandem mass spectrometry on dried blood spots.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatments are available and curative for PNP deficiency, but their efficacy depends on
      the early approach. PNP-combined immunodeficiency complies with the criteria for
      inclusion in a newborn screening program.
    explanation: >-
      States the rationale for newborn screening - a curative treatment whose success is
      time-dependent - and the mass-spectrometry route.
  - reference: PMID:34698070
    reference_title: >-
      Early Diagnosis and Treatment of Purine Nucleoside Phosphorylase (PNP) Deficiency through
      TREC-Based Newborn Screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, PNP deficiency has been detected in newborn screening only through the use of
      liquid chromatography tandem mass spectrometry. We report the first case in which PNP
      deficiency was detected by TREC analysis.
    explanation: >-
      Documents the TREC route as a second, later-established screening modality distinct from
      mass spectrometry.
  - reference: PMID:40981309
    reference_title: >-
      The Success of Newborn Screening Beyond War: An International Collaborative Case of Purine
      Nucleoside Phosphorylase (PNP) Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ukraine successfully carried out NBS on a neonatal dried blood spot (DBS) by real-time
      PCR, which showed remarkably reduced T-cell receptor and kappa-deleting recombination
      excision circles (TREC/KREC).
    explanation: >-
      A worked case of TREC/KREC screening detecting PNP deficiency and leading to successful
      transplantation, demonstrating the screening-to-cure pathway in practice.

clinical_trials:
- name: NCT06092346
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    An NIH prospective observational natural-history protocol covering disorders of pyrimidine
    and purine metabolism, of which PNP deficiency is one. Observational rather than
    interventional, and relevant because the entry's principal knowledge gap - the mechanism and
    time course of the neurological arm - is exactly the kind of question a natural-history
    cohort with systematic phenotyping is positioned to answer.
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  evidence:
  - reference: clinicaltrials:NCT06092346
    reference_title: "Prospective Study of the Clinical, Genomic, Pharmacological, Laboratory, and Dietary Determinates of Pyrimidine and Purine Metabolism Disorders"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DPPMs can cause dysfunctions throughout the body, especially in the brain, blood, kidneys,
      and immune system.
    explanation: >-
      States the scope of the natural-history protocol, covering the neurological and immune
      dimensions that are this entry's two disease arms.

treatments:
- name: Allogeneic haematopoietic stem cell transplantation
  description: >-
    The only available cure. Replacing the patient's haematopoietic system with
    PNP-competent donor cells restores enzyme activity in the lymphoid compartment where
    the substrate burden is greatest, giving durable immune reconstitution. Reported
    outcomes are good when transplantation is performed in time - three of four patients in
    one Israeli series achieved good immune reconstitution over 8 to 108 months of
    follow-up with excellent neurological outcomes - but the qualifier matters: the fourth
    patient died of EBV-related lymphoma before transplant, and in a Turkish series a
    patient was lost to veno-occlusive disease after transplant. Neurological disease
    already established is not reliably reversed, though post-transplant series report no
    further deterioration.
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Loss of Purine Nucleoside Phosphorolysis
    treatment_effect: INHIBITS
    description: >-
      Donor-derived haematopoiesis supplies PNP-competent cells to the lymphoid compartment,
      restoring the missing phosphorolysis step where the substrate burden is greatest. This is
      why the therapeutic logic is metabolic rather than merely immunological, and why
      replacing the haematopoietic compartment suffices: the enzymatic lesion that matters is
      intrinsic to it. The partial-deficiency data suggest the bar is low, since 8-11% of normal
      activity supported near-normal immunity.
  - target: Impaired Thymocyte Development and Reduced T-Cell Output
    treatment_effect: INHIBITS
    description: >-
      Restoring enzyme-competent haematopoiesis re-establishes thymocyte development and
      peripheral T-cell output. Neurological disease already established at the time of
      transplant is not reliably reversed, which is the principal limit of the approach.
  - target: T-Cell Predominant Combined Immunodeficiency
    treatment_effect: INHIBITS
    description: >-
      Restoring enzyme-competent T-cell development corrects the combined immunodeficiency.
  evidence:
  - reference: PMID:35063692
    reference_title: >-
      Combined immunodeficiency due to purine nucleoside phosphorylase deficiency: Outcome of
      three patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hematopoietic stem cell transplantation (HSCT) is the only available cure for patients
      with PNP deficiency.
    explanation: >-
      Establishes transplantation as the only curative option.
  - reference: PMID:31707514
    reference_title: The Broad Clinical Spectrum and Transplant Results of PNP Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HSCT offers a good treatment option, with excellent clinical outcomes, when preformed in
      a timely manner.
    explanation: >-
      Supports transplantation with the timing qualifier that governs its success.
  - reference: PMID:35063692
    reference_title: >-
      Combined immunodeficiency due to purine nucleoside phosphorylase deficiency: Outcome of
      three patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over the course of post-HSCT, there was no further aggravation of the patients'
      neurological symptoms. Although both of the patients still had mild developmental delay,
      new developmental milestones were achieved.
    explanation: >-
      Documents that transplantation halts but does not reverse established neurological
      disease. Recorded as PARTIAL because it both supports the treatment and bounds what it
      achieves.

- name: Supportive care and infection prophylaxis
  description: >-
    Immunoglobulin replacement, antimicrobial prophylaxis and irradiated, CMV-safe blood
    products bridge the patient to transplantation. This is explicitly a bridge and not a
    treatment of the disease: no supportive or dietary approach has been consistently
    successful, and the older attempts - red cell transfusion to supply enzyme, dietary
    purine and pyrimidine supplementation - did not work.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Recurrent and Opportunistic Infection
    treatment_effect: INHIBITS
    description: >-
      Prophylaxis and immunoglobulin replacement reduce the infection burden without altering
      the underlying enzyme defect.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many different therapies have been utilized for PNP deficiency including bone marrow
      transplantation, red cell transfusions, and supplementation of the diet with purines and
      pyrimidines. None of these therapies has been consistently successful.
    explanation: >-
      Documents the historical failure of non-transplant approaches. Recorded as PARTIAL
      because it establishes what supportive care cannot do rather than supporting an
      effective therapy; note the review predates modern transplant outcomes, which are
      curated separately above.

animal_models:
- name: PNP-knockout mouse
  species: Mouse
  genotype: Pnp-deficient (knockout)
  publication: PMID:10859343
  description: >-
    Purpose-built to interrogate the mechanism of the human immunodeficiency, and the source of
    the mitochondrial hypothesis this entry curates. It reproduces the defining asymmetry of
    the human disease - T lymphocytes affected more severely than B - with impaired thymocyte
    differentiation, reduced mitogenic and allogeneic responses, and decreased numbers of
    maturing thymocytes and peripheral T cells.
  modeled_mechanisms:
  - target: Mitochondrial dGTP Accumulation and Impaired mtDNA Repair
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model is where this mechanism was established: mitochondrial dGTP accumulation
      inhibiting mtDNA repair, leaving T cells hypersensitive to spontaneous mitochondrial DNA
      damage.
    limitations: >-
      The mechanism is proposed from the murine phenotype and has not been demonstrated
      directly in human PNP-deficient tissue. The nearest human corroboration is indirect -
      irradiation survival of patient lymphoblastoid B cells tracking residual PNP activity -
      which supports DNA-damage hypersensitivity without confirming the mitochondrial locus.
      Notably, an independent PNP-deficient mouse line failed to show dGTP accumulation in
      thymocytes or spleen leucocytes at all, and instead had a secondary deficiency of
      deoxyguanosine kinase, so the murine metabolic phenotype is not uniform across lines.
    readouts:
    - name: T lymphocyte apoptosis and gamma-irradiation sensitivity
      target: Mitochondrial dGTP Accumulation and Impaired mtDNA Repair
      direction: INCREASED
      interpretation: >-
        Increased apoptosis in vivo with heightened sensitivity to DNA damage in vitro is the
        functional signature of impaired repair capacity.
      evidence:
      - reference: PMID:10859343
        reference_title: "Mitochondrial basis for immune deficiency. Evidence from purine nucleoside phosphorylase-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          T lymphocytes of PNP-deficient mice exhibit increased apoptosis in vivo and higher
          sensitivity to gamma irradiation in vitro.
        explanation: >-
          Reports the apoptosis and DNA-damage-sensitivity measurements underpinning this node.
    evidence:
    - reference: PMID:10859343
      reference_title: "Mitochondrial basis for immune deficiency. Evidence from purine nucleoside phosphorylase-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We propose that the immune deficiency in PNP deficiency is a result of inhibition of
        mitochondrial DNA repair due to the accumulation of dGTP in the mitochondria.
      explanation: >-
        Supports treating this model as the source of, and evidence for, the mitochondrial node.

  - target: Impaired Thymocyte Development and Reduced T-Cell Output
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model reproduces the human thymic phenotype closely: impaired thymocyte
      differentiation with reduced numbers of maturing thymocytes and peripheral T cells.
    limitations: >-
      Murine and human thymic development differ in tempo and in the duration of thymic output,
      so the timing of decline is not directly transferable; the model also does not reproduce
      the fluctuating T-cell counts described in patients.
    readouts:
    - name: Maturing thymocyte and peripheral T-cell numbers
      target: Impaired Thymocyte Development and Reduced T-Cell Output
      direction: DECREASED
      interpretation: >-
        Reduced thymocyte and peripheral T-cell numbers are the direct measurement of failed
        thymic output.
      evidence:
      - reference: PMID:10859343
        reference_title: "Mitochondrial basis for immune deficiency. Evidence from purine nucleoside phosphorylase-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          PNP knockout mice exhibit impaired thymocyte differentiation, reduced mitogenic and
          allogeneic responses, and decreased numbers of maturing thymocytes and peripheral T
          cells.
        explanation: >-
          Reports the thymocyte and peripheral T-cell measurements for this node.
    evidence:
    - reference: PMID:10859343
      reference_title: "Mitochondrial basis for immune deficiency. Evidence from purine nucleoside phosphorylase-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Similar to the human disease, PNP deficiency in mice causes an immunodeficiency that
        affects T lymphocytes more severely than B lymphocytes.
      explanation: >-
        States the correspondence with the human disease that justifies treating this model as
        informative for the thymic node.


- name: B6-NPE / B6-NPF ENU-induced PNP-deficient mouse strains
  species: Mouse
  genotype: >-
    Pnp hypomorphic ENU-induced point mutants (B6-NPE, B6-NPF); residual PNP activity with a
    secondary deficiency of deoxyguanosine kinase
  publication: PMID:7918681
  description: >-
    Chemically induced hypomorphic Pnp mutants, predating the Arpaia knockout by six years and
    carrying residual enzyme activity rather than a null allele. They are curated as a separate
    model precisely because the negative result below is theirs and not the knockout's: a
    hypomorph failing to accumulate dGTP is a materially weaker negative than a null failing to,
    and attaching that claim to the field's principal model would overstate it.
  modeled_mechanisms:
  - target: Intracellular dGTP Pooling in Lymphoid Cells
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      This is the honest negative result, and it is the structural counterpart of the
      HUMAN_MODEL_MISMATCH discussion. In the B6-NPE and B6-NPF PNP-deficient mouse lines, the
      dGTP accumulation that the whole human mechanism is built on was not detectable in
      thymocytes, spleen leucocytes or erythrocytes, and there were no changes in purine or
      pyrimidine ribonucleotide pools. The lines instead showed a secondary deficiency of
      deoxyguanosine kinase, which would prevent the toxic phosphorylation step from running -
      so the mouse partly protects itself from the very lesion the model is meant to represent.
    limitations: >-
      This failure is line-specific rather than a property of murine PNP deficiency in general,
      and it does not overturn the mitochondrial hypothesis; it does mean that a murine failure
      to accumulate dGTP cannot be read as evidence about the human metabolic phenotype, and
      that dGTP-pooling claims must rest on human data.
    readouts:
    - name: dGTP concentration in thymocytes, spleen leucocytes and erythrocytes
      target: Intracellular dGTP Pooling in Lymphoid Cells
      direction: UNCHANGED
      interpretation: >-
        No detectable dGTP accumulation in the very compartments where the human mechanism
        predicts it - a genuine negative measurement, not an absence of testing.
      evidence:
      - reference: PMID:7918681
        reference_title: "Secondary loss of deoxyguanosine kinase activity in purine nucleoside phosphorylase deficient mice."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found no evidence for dGTP accumulation in thymocytes or spleen leucocytes, < 1
          nmol/10(9) cells, nor in erythrocytes, < 0.05 nmol/10(9) cells, of the B6-NPE- or
          B6-NPF PNP-deficient mice strains.
        explanation: >-
          Directly reports the absence of dGTP accumulation in these mouse lines, which is why
          this link is recorded as FAILS_TO_RECAPITULATE.
    evidence:
    - reference: PMID:7918681
      reference_title: "Secondary loss of deoxyguanosine kinase activity in purine nucleoside phosphorylase deficient mice."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found no evidence for dGTP accumulation in thymocytes or spleen leucocytes, < 1
        nmol/10(9) cells, nor in erythrocytes, < 0.05 nmol/10(9) cells, of the B6-NPE- or
        B6-NPF PNP-deficient mice strains.
      explanation: >-
        The substantive negative finding required to justify a FAILS_TO_RECAPITULATE link.
    - reference: PMID:7918681
      reference_title: "Secondary loss of deoxyguanosine kinase activity in purine nucleoside phosphorylase deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fractionation of erythrocyte and liver lysates from the F mutation and the background
        strain, C57BL/6J, by anion exchange chromatography confirmed the secondary deficiency of
        deoxyguanosine kinase
      explanation: >-
        Identifies the secondary deoxyguanosine kinase deficiency that explains why these lines
        fail to accumulate dGTP - the mechanism of the model's failure, not merely its fact.

biochemical:
- name: Serum uric acid
  notes: >-
    Uric acid is the end product of the pathway PNP feeds, so it falls when the enzyme is
    absent. Together with lymphopenia it is the cheapest available diagnostic signal, and a low
    urate in a lymphopenic infant should prompt the specific enzyme assay. It is not perfectly
    sensitive: patients with partial deficiency had entirely normal serum urate.
  evidence:
  - reference: PMID:33061764
    reference_title: >-
      Recurrent infections, neurologic signs, low serum uric acid levels, and lymphopenia in
      childhood: Purine nucleoside phosphorylase deficiency, an emergency for infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absolute lymphocyte counts and serum uric acid levels were very low, and serum
      immunoglobulin levels were normal or slightly lower in all cases.
    explanation: >-
      Documents markedly low serum uric acid in all four cases of a confirmed series.
  - reference: PMID:32695102
    reference_title: >-
      Partial Purine Nucleoside Phosphorylase Deficiency Helps Determine Minimal Activity
      Required for Immune and Neurological Development.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All siblings had normal blood uric acid and increased PNP substrates in the urine.
    explanation: >-
      Bounds the marker: normal urate in partial deficiency, so a normal value does not exclude
      the diagnosis. Recorded as PARTIAL for that reason.

- name: Urinary purine nucleosides
  notes: >-
    Inosine, deoxyinosine, guanosine and deoxyguanosine accumulate behind the enzymatic block
    and are excreted. This is the more sensitive half of the biochemical pair: it remained
    abnormal in partial-deficiency patients whose serum urate was normal.
  evidence:
  - reference: PMID:32695102
    reference_title: >-
      Partial Purine Nucleoside Phosphorylase Deficiency Helps Determine Minimal Activity
      Required for Immune and Neurological Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All siblings had normal blood uric acid and increased PNP substrates in the urine.
    explanation: >-
      Shows urinary substrate elevation persisting when serum urate is normal, establishing it
      as the more sensitive marker.
  - reference: PMID:24767876
    reference_title: >-
      Diagnosis of immunodeficiency caused by a purine nucleoside phosphorylase defect by using
      tandem mass spectrometry on dried blood spots.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      caused by a enzyme defect leading to the accumulation of inosine, 2'-deoxy-inosine
      (dIno), guanosine, and 2'-deoxy-guanosine (dGuo) in all cells, especially lymphocytes
    explanation: >-
      Names the four accumulating substrates measured in this profile.

discussions:
- discussion_id: pnp-neurological-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#CNS Purine Nucleotide Imbalance
  - pathophysiology#Neurological Dysfunction
  prompt: >-
    What causes the neurological disease in PNP deficiency? About two thirds of patients have
    spasticity, developmental delay or intellectual disability, and about a quarter present
    neurologically rather than with infection, yet no established mechanism links the
    enzymatic defect to neuronal dysfunction. The only mechanistic proposal in the literature
    - that depressed GTP levels may correlate with neurologic dysfunction - is offered as a
    possible correlation rather than a demonstrated pathway.
  rationale: >-
    Three observations make this a real gap rather than a missing citation. The neurological
    arm dissociates from the immunological one: patients are described with full
    immunodeficiency and autoimmunity but no neurological impairment. It is not corrected by
    the treatment that cures the immunodeficiency, since transplantation halts progression but
    does not reverse established disease. And the partial-deficiency siblings, with 8-11%
    residual activity, had entirely normal neurological development, which implies a threshold
    effect but says nothing about the mechanism below it. The clinical stake is direct: if the
    neurological injury is a prenatal or early-postnatal process, then newborn screening and
    very early transplantation would be the intervention, whereas if it is an ongoing
    metabolic toxicity then enzyme- or substrate-directed therapy able to cross the
    blood-brain barrier would be needed, since donor haematopoietic cells largely do not.
  evidence:
  - reference: PMID:1931007
    reference_title: Purine nucleoside phosphorylase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Depressed GTP levels may correlate with neurologic dysfunction.
    explanation: >-
      The sole mechanistic proposal available, stated by the source itself only as a possible
      correlation - which is the gap.
  - reference: PMID:32695102
    reference_title: >-
      Partial Purine Nucleoside Phosphorylase Deficiency Helps Determine Minimal Activity
      Required for Immune and Neurological Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All siblings had typical (normal) neurological development.
    explanation: >-
      Partial deficiency with 8-11% residual activity spared neurological development entirely,
      establishing a threshold without explaining the mechanism operating below it.
  proposed_experiments:
  - experiment_id: pnp-cns-purine-timing
    name: CSF purine profiling and neuroimaging across the PNP activity range
    description: >-
      Measure CSF purine nucleoside and nucleotide profiles alongside serial neuroimaging in
      patients spanning the full range of residual PNP activity, including pre- and
      post-transplant timepoints, to establish whether CNS purine imbalance tracks neurological
      severity, whether it is corrected by transplantation, and at what developmental stage the
      injury is established.
    readouts:
    - name: CSF purine metabolite levels versus neurological severity and PNP activity
      target: pathophysiology#CNS Purine Nucleotide Imbalance
    would_support:
    - pathophysiology#CNS Purine Nucleotide Imbalance
    - pathophysiology#Neurological Dysfunction

- discussion_id: pnp-dual-checkpoint-human-validation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands
  - pathophysiology#SAMHD1-Dependent Synthetic Lethality in Developing T Cells
  prompt: >-
    The dual-checkpoint model - a SAMHD1-dependent synthetic lethality in developing T cells
    and a TLR7-ligand checkpoint in B cells and macrophages - elegantly explains why one
    metabolic gene produces both immunodeficiency and autoimmunity. It rests on mouse and
    cellular experiments. Do both checkpoints operate in human PNP deficiency, and does the
    TLR7 arm account for the autoimmunity seen in roughly a third of patients?
  rationale: >-
    Evidence for this model exists and is mechanistically strong, so the open question is
    translational validity rather than absence of data - which is what makes this a
    HUMAN_MODEL_MISMATCH rather than a knowledge gap. It matters for two reasons. If the human
    autoimmunity is TLR7-driven, then TLR7-directed or nucleoside-lowering therapy is a
    rational adjunct in patients awaiting transplant, whereas conventional immunosuppression
    in a patient who is already immunodeficient is an unattractive option. And if the T-cell
    arm genuinely depends on deoxycytidine kinase and is antagonised by microenvironmental
    deoxycytidine, that is a pharmacologically approachable dependency rather than an
    inevitability of the enzyme defect.
  evidence:
  - reference: PMID:35653193
    reference_title: >-
      Purine nucleoside phosphorylase enables dual metabolic checkpoints that prevent T cell
      immunodeficiency and TLR7-associated autoimmunity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PNP insufficiency in humans is paradoxically associated with both immunodeficiency and
      autoimmunity, but the mechanistic basis for these outcomes is incompletely understood.
    explanation: >-
      The paper's own framing states that the human mechanistic basis is incompletely
      understood, which is precisely the mismatch this discussion records. Evidence source is
      MODEL_ORGANISM as the resolving experiments are murine and cellular.
  - reference: PMID:35968787
    reference_title: 'Immunodeficiency and autoimmunity: companions not opposites.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In this issue of the JCI, Abt and colleagues report on purine nucleoside phosphorylase
      (PNP) deficiency, exploring the basis for the autoimmune complications that develop in
      this particular form of T cell immune deficiency and assigning a key role for
      overactivation of TLR7.
    explanation: >-
      Independent commentary confirming the TLR7 attribution and its significance. Evidence
      source is OTHER as this is an editorial commentary rather than primary data.
  proposed_experiments:
  - experiment_id: pnp-human-tlr7-checkpoint
    name: TLR7 pathway activity in human PNP-deficient B cells and macrophages
    description: >-
      In patients with PNP deficiency, measure TLR7 pathway activation and interferon
      signatures in primary B cells and monocyte-derived macrophages, correlate with
      (deoxy)guanosine nucleoside levels and with the presence of autoimmune manifestations,
      and test whether ex vivo TLR7 blockade or nucleoside depletion normalises the signature.
    readouts:
    - name: TLR7 pathway activation versus nucleoside levels and autoimmune status
      target: pathophysiology#Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands
    would_support:
    - pathophysiology#Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands

notes: >-
  Module conformance: none declared. `metabolic_intoxication_decompensation` is the nearest
  candidate and does not fit - that module models acute decompensation crises (metabolic
  acidosis, hyperammonemia, hypoglycemia) unmasked by catabolic stress, whereas PNP deficiency
  produces chronic substrate accumulation with progressive cell loss and no acute
  decompensation phenotype. `lysosomal_substrate_accumulation` is also inapplicable: the
  accumulating substrate is cytosolic and mitochondrial, not lysosomal, and the toxicity is
  nucleotide-pool distortion rather than storage. A future "nucleotide salvage toxicity"
  module covering PNP and adenosine deaminase deficiency together would be a natural fit,
  since ADA deficiency runs the same architecture with dATP in place of dGTP acting on the
  same ribonucleotide reductase target; the attachment point would be the dGTP-pooling node.

  Frequency discipline: two phenotypes carry bands, both taken from explicit proportions in a
  33-patient literature review - neurological disease at two thirds and autoimmunity at one
  third, which fall at the upper and lower ends of FREQUENT (30-79%) respectively. All other
  phenotypes are left unbanded because the available sources are case series of three or four
  patients, which cannot support a population proportion.

  Evidence-source balance: the two mechanism nodes explaining the immunodeficiency/autoimmunity
  paradox rest on murine and cellular work and are tagged MODEL_ORGANISM throughout, with the
  translational question recorded as an explicit HUMAN_MODEL_MISMATCH rather than being
  smoothed into the human narrative.

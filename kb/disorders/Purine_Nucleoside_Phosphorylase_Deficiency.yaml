- category: Clinical
  name: Autoimmunity
  frequency: FREQUENT
  description: >-
    Autoimmune disease develops in about a third of patients, placing it at the lower edge of
    the FREQUENT band (30-79%). Autoimmune haemolytic anaemia is the commonest manifestation;

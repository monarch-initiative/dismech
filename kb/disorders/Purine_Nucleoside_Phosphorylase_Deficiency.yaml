inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic loss-of-function variants in PNP on chromosome 14q are required; carriers
    with one functional allele are unaffected, and the demonstration that 8-11% residual
    activity supports near-normal immunity explains why heterozygotes are healthy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30885031
    reference_title: >-
      The First Purine Nucleoside Phosphorylase Deficiency Patient Resembling IgA
      Deficiency and a Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Purine nucleoside phosphorylase (PNP) deficiency is a rare autosomal recessive
      primary immunodeficiency disorder characterized by decreased numbers of T-cells,
      variable B-cell abnormalities, decreased amount of serum uric acid and PNP enzyme
      activity.
    explanation: >-
      States the autosomal recessive inheritance together with the defining immunological
      and biochemical features.


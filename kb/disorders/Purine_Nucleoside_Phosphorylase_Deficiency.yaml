name: Purine nucleoside phosphorylase deficiency
creation_date: '2026-08-19T23:40:00Z'
category: Inborn Error of Metabolism
description: >-
  Purine nucleoside phosphorylase (PNP) deficiency is an autosomal recessive inborn
  error of the purine salvage pathway causing a combined immunodeficiency that falls
  predominantly on T cells, together with neurological disease and autoimmunity. It
  accounts for roughly 4% of severe combined immunodeficiency.

  The mechanism is a substrate-toxicity chain rather than a loss of product. PNP
  normally phosphorolyses inosine, guanosine and their deoxy forms; without it,
  deoxyguanosine accumulates and is phosphorylated to dGTP, a conversion that in the
  T-cell-lethal arm requires deoxycytidine kinase.
  PNP is expressed in most tissues but at its highest levels in lymphoid tissue, which
  is why an enzyme defect present in every cell produces a disease of the lymphoid
  system. Elevated dGTP is thought to inhibit ribonucleotide reductase and so impede
  cell division; a complementary and more specific mechanism, established in
  PNP-knockout mice, is that mitochondrial dGTP accumulation inhibits mitochondrial DNA
  repair, leaving T cells hypersensitive to spontaneous mitochondrial DNA damage and
  driving their depletion by apoptosis. Thymocytes and peripheral T cells die, thymic
  output fails, and combined immunodeficiency follows.

  Two features make this entry more than a metabolic chain. First, the neurological arm
  - spasticity, developmental delay, ataxia - is present in about two thirds of patients
  and is NOT explained by the T-cell mechanism; its basis remains genuinely unresolved
  and is curated as an open knowledge gap rather than asserted. Second, the disease has a
  demonstrated activity threshold: siblings with roughly 8-11% residual PNP activity
  reached their third decade with mild immune abnormalities and entirely normal
  neurological development, which sets a quantitative floor on how much enzyme is
  actually needed and is directly relevant to what any future enzyme- or gene-directed
  therapy must achieve.

epidemiology:
- name: One-year patient and kidney outcomes
  description: >-
    Pooled one-year patient and kidney survival were 76.2% and 30.2%, respectively.
    Kidney function at diagnosis and the proportion of normal glomeruli were
    strong prognostic factors; these pooled outcomes should not be treated as an
    individual prognosis.
  evidence:
  - reference: PMID:38493958
    reference_title: "Epidemiology, clinical features, risk factors, and outcomes in anti-glomerular basement membrane disease: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled one-year patient and kidney survival rates were 76.2% and 30.2%,
      respectively. Kidney function on diagnosis and normal glomeruli percentage
      were identified as strong prognostic factors.
    explanation: Supports the one-year survival figures and the prognostic importance of baseline kidney function.
prevalence:
- population: General population across included epidemiologic studies
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_low: 0.06
  rate_high: 0.179
  notes: >-
    The systematic review reported 0.60-1.79 new cases per million population
    per year (0.06-0.179 per 100,000 per year). The range straddles the lower
    boundary of the coarse 1-9-per-million class.
  evidence:
  - reference: PMID:38493958
    reference_title: "Epidemiology, clinical features, risk factors, and outcomes in anti-glomerular basement membrane disease: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall incidence of anti-GBM disease ranged from 0.60 to 1.79 per
      million population per annum.
    explanation: Supports the annual incidence range and its normalized rate conversion.
progression:
- phase: Acute organ-threatening presentation
  notes: >-
    Classic disease generally presents as rapidly progressive glomerulonephritis,
    with pulmonary hemorrhage in about half of cases. Dialysis dependence at
    presentation is associated with a lower likelihood of kidney recovery.
  evidence:
  - reference: PMID:40973182
    reference_title: Anti-glomerular basement membrane disease-treatment standard.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is caused by autoantibodies directed against the α3 chain of type IV
      collagen, leading to rapidly progressive glomerulonephritis with pulmonary
      haemorrhage in ∼50% of cases.
    explanation: Supports the characteristic acute renal presentation and approximate pulmonary-hemorrhage proportion.
  - reference: PMID:40973182
    reference_title: Anti-glomerular basement membrane disease-treatment standard.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dialysis-dependent patients have a lower likelihood of renal recovery, and
      treatment decisions must consider biopsy findings, clinical severity and
      potential contraindications to standard immunosuppression.
    explanation: Supports the prognostic importance of dialysis dependence at presentation.
- phase: Relapse after remission
  notes: >-
    Relapse is rare in classic single-positive disease, so routine long-term
    maintenance immunosuppression is generally unnecessary. Double-positive
    anti-GBM/ANCA disease has higher relapse risk and requires an AAV-like
    maintenance strategy.
  evidence:
  - reference: PMID:40973182
    reference_title: Anti-glomerular basement membrane disease-treatment standard.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unlike anti-neutrophil cytoplasm antibody (ANCA)-associated vasculitis,
      relapses are rare in classic anti-GBM disease, and long-term maintenance
      immunosuppression is not routinely required. However, 'double positive'
      patients (anti-GBM and ANCA) have a higher relapse risk and require
      maintenance immunosuppressive treatment.
    explanation: Directly distinguishes classic monophasic disease from the relapse-prone double-positive subgroup.
differential_diagnoses:
- name: ANCA-associated vasculitis
  description: >-
    ANCA-associated vasculitis (granulomatosis with polyangiitis, microscopic
    polyangiitis) is the principal differential for a pulmonary-renal syndrome;
    it shows pauci-immune (not linear) staining, and may co-occur as
    double-positive disease.
  evidence:
  - reference: PMID:28506760
    reference_title: Patients double-seropositive for ANCA and anti-GBM antibodies have varied renal survival, frequency of relapse, and outcomes compared to single-seropositive patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Double-positive patients shared characteristics of ANCA-associated
      vasculitis (AAV), such as older age distribution and longer symptom
      duration before diagnosis, and features of anti-GBM disease
    explanation: >-
      Supports ANCA-associated vasculitis as the key differential/overlap entity,
      including the double-positive presentation.
animal_models:
- species: Mus musculus
  genotype: Complement C3-deficient, C4-deficient, and wild-type mice in a heterologous anti-GBM nephritis model
  description: >-
    C3 or C4 deficiency reduced neutrophil infiltration, proteinuria, and
    capillary thrombosis after nephritogenic antibody exposure, supporting a
    causal complement role. The heterologous antibody-transfer model bypasses
    human loss of tolerance, and protection was overcome at higher antibody dose.
  associated_phenotypes:
  - Proteinuria
  - Glomerular capillary thrombosis
  evidence:
  - reference: PMID:9409643
    reference_title: Protection against anti-glomerular basement membrane (GBM)-mediated nephritis in C3- and C4-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These studies support a critical role for complement in the development of
      anti-GBM disease. However, the protective effect of complement deficiency
      can be broken if the dose of nephritogenic antibody is increased.
    explanation: Supports complement dependence and states the antibody-dose limitation of the model.
- species: Rattus norvegicus
  genotype: alpha3(IV)NC1 127-148-immunized Wistar Kyoto rats
  description: >-
    Antigen-immunized rats model autoreactive anti-GBM nephritis. In this 2026
    study, butyrate-modified m-P14 peptide reduced renal injury and inflammatory
    readouts. This induced rodent model is preclinical and does not establish
    efficacy or safety in people.
  associated_phenotypes:
  - Proteinuria
  - Glomerular crescent formation
  evidence:
  - reference: PMID:42278340
    reference_title: Butyric Acid-Modified m-P14 Peptide Ameliorates Anti-Glomerular Basement Membrane Disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      M-P14-BA reduced proteinuria, crescent formation, glomerular IgG deposition,
      complement activation, and inflammatory cell infiltration, with overall
      efficacy comparable to m-P14 in early treatment settings.
    explanation: Directly reports the treatment effects in antigen-immunized rats.
discussions:
- discussion_id: gap_atypical_seronegative_management
  prompt: What diagnostic and treatment approach best identifies and manages atypical seronegative anti-GBM disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Recognition of atypical seronegative anti-GBM disease
  rationale: >-
    Biopsy-positive, seronegative cases are heterogeneous, and evidence does not
    justify assuming the natural history or treatment response of classic
    circulating-antibody-positive disease.
  evidence:
  - reference: PMID:40973182
    reference_title: Anti-glomerular basement membrane disease-treatment standard.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Atypical anti-GBM presentations, including seronegative cases, are now
      better recognized but their optimal management remains unclear.
    explanation: The current treatment standard explicitly identifies management as unresolved.
- discussion_id: gap_treatment_comparative_evidence
  prompt: Which induction regimen and emerging adjuncts improve patient and kidney outcomes in prespecified anti-GBM subgroups?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Cyclophosphamide
  - treatments#Rituximab
  - treatments#Imlifidase (investigational IgG-cleaving enzyme)
  rationale: >-
    Standard treatment is supported largely by observational experience, while
    rituximab evidence is selected and nonrandomized and the confirmatory
    imlifidase trial was terminated without posted results.
  evidence:
  - reference: PMID:40973182
    reference_title: Anti-glomerular basement membrane disease-treatment standard.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Future research should define the use of oral versus intravenous
      cyclophosphamide in anti-GBM disease, clarify the role of rituximab and
      determine the place of emerging therapies such as imlifidase.
    explanation: Directly identifies unresolved regimen and adjunctive-treatment questions.
notes: >-
  Anti-GBM disease is an acquired autoimmune disease with NO GeneReviews chapter
  and no causal germline mutation. The COL4A3/COL4A4/COL4A5 genes encode the
  type IV collagen network that is the AUTOANTIGEN target; loss-of-function
  variants in those same genes cause the hereditary structural disease Alport
  syndrome (GeneReviews PMID:20301386), which is mechanistically distinct and was
  deliberately NOT conflated with anti-GBM disease during curation. The
  molecular_mimicry_autoimmunity module was considered but not declared as a
  conformance target: anti-GBM disease is best modeled as a conformeropathy
  (cryptic-neoepitope unmasking) rather than classic post-infectious molecular
  mimicry, so no false conformance was asserted.
datasets:
- accession: geo:GSE303481
  title: Spatio-temporal interaction of immune and renal cells determines glomerular crescent formation in autoimmune kidney disease
  description: Rapidly progressive glomerulonephritis (RPGN) is the most aggressive group of autoimmune kidney disease with the worst prognosis. Anti-neutrophil cytoplasmic antibody (ANCA) associated vasculitis, anti-glomerular basement membrane (anti-GBM) and lupus nephritis are the most common causes of RPGN and are characterized by the formation of glomerular crescents and infiltration of leukocytes that eventually lead to glomerulosclerosis and kidney failure.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 15
  publication: PMID:41028563
  notes: Identified by GEO DataSets index search for Anti-Glomerular Basement Membrane Disease (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.

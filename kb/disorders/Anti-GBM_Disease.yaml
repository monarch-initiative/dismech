environmental:
- name: Cigarette smoking as a pulmonary-disease modifier
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  influences_mechanisms:
  - target: Alveolar capillary-wall disruption
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Exacerbating rather than triggering, because this exposure does not
      cause the disease: the antibody is already made, and smoking decides
      whether the lung is involved. The classic 1983 series settles both
      halves of that sentence. All 37 cigarette smokers in it had lung
      haemorrhage against 2 of 10 non-smokers, and crucially the anti-GBM
      antibody titres did not differ between the two groups, so smoking is
      not acting by making more antibody. That null result is what places
      this edge on the alveolar capillary wall rather than on the
      loss-of-tolerance node, and it is a stronger argument for the target
      than the association alone would be. One patient in that series
      resumed smoking and the lung haemorrhage returned, which is a
      within-patient rechallenge and the strongest causal design available
      anywhere in this entry.
    evidence:
    - reference: PMID:6140495
      reference_title: "Cigarette smoking and lung haemorrhage in glomerulonephritis caused by autoantibodies to glomerular basement membrane."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of these, all 37 cigarette smokers suffered lung haemorrhage, compared with only 2 of 10 non-smokers"
      explanation: >-
        A near-complete separation between smokers and non-smokers for lung
        involvement in a series of patients who all had the same
        autoantibody disease. It is the size of this contrast, not a
        mechanism, that carries the edge.
    - reference: PMID:6140495
      reference_title: "Cigarette smoking and lung haemorrhage in glomerulonephritis caused by autoantibodies to glomerular basement membrane."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There was no significant difference between the titres of circulating anti-GBM antibodies in smokers and non-smokers"
      explanation: >-
        The item that decides the target. Smokers and non-smokers had the
        same antibody titres, so smoking is not acting on the autoantibody
        arm at all, which is why this link points at the alveolar capillary
        wall and not at the loss-of-tolerance node upstream.
    - reference: PMID:6140495
      reference_title: "Cigarette smoking and lung haemorrhage in glomerulonephritis caused by autoantibodies to glomerular basement membrane."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 1 patient resumption of smoking was closely followed by recrudescence of lung haemorrhage"
      explanation: >-
        A within-patient rechallenge: the exposure stopped, resumed, and the
        bleeding returned with it. One patient only, but it is the strongest
        causal design in this entry and it is carried for that reason.
    - reference: PMID:8281713
      reference_title: "Anti-GBM disease: predictive value of clinical, histological and serological data."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Pulmonary disease was significantly associated with current smoking (p < 0.01)."
      explanation: >-
        Reports pulmonary disease significantly associated with current
        smoking. It reaches the clinical expression of this node rather than
        the wall disruption itself, and as an association within a case series
        it cannot separate smoking as cause of lung involvement from smoking
        as a marker of who gets it.
  description: >-
    Current smoking is associated with pulmonary involvement in anti-GBM disease.
    This observational association supports smoking as a harmful modifier of the
    pulmonary phenotype, not as a necessary cause of autoimmunity.
  effect: HARMFUL
  evidence:
  - reference: PMID:8281713
    reference_title: "Anti-GBM disease: predictive value of clinical, histological and serological data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pulmonary disease was significantly associated with current smoking (p < 0.01).
    explanation: Directly reports the association in a 29-patient retrospective cohort.
- name: Infection as a possible environmental trigger
  influences_mechanisms:
  - target: HLA-restricted loss of tolerance and anti-GBM IgG production
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pointed at the loss-of-tolerance node because the cited sentence
      conditions its claim on genetic susceptibility and that node is the one
      carrying the HLA restriction. Graded predisposing rather than triggering
      despite the sentence using the word trigger, because the sentence hedges
      it twice, saying clustering suggests environmental factors may trigger
      disease, and the exposure's own name calls infection possible. The
      intermediates are unknown in the strict sense: no organism is named and
      no route from infection to autoantibody production is given.
    evidence:
    - reference: PMID:28515156
      reference_title: "Anti-Glomerular Basement Membrane Disease."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "The recent confirmation of spatial and temporal clustering of cases suggests that environmental factors, including infection, may trigger disease in genetically susceptible individuals."
      explanation: >-
        States that confirmed spatial and temporal clustering of cases
        suggests environmental factors including infection may trigger disease
        in genetically susceptible individuals. Clustering is an argument that
        something environmental is at work rather than evidence that infection
        is the thing.
  description: >-
    Spatial and temporal clustering supports an environmental contribution, and
    infection is one proposed trigger in genetically susceptible people. The
    evidence does not identify a necessary or sufficient exposure.
  effect: HARMFUL
  evidence:
  - reference: PMID:28515156
    reference_title: Anti-Glomerular Basement Membrane Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The recent confirmation of spatial and temporal clustering of cases
      suggests that environmental factors, including infection, may trigger
      disease in genetically susceptible individuals.
    explanation: Directly supports infection as an environmental trigger in HLA-susceptible hosts.
diagnosis:
- name: Anti-GBM serology plus renal biopsy
  description: >-
    Diagnosis integrates the clinical presentation with serum anti-GBM antibody
    testing and kidney biopsy showing linear IgG deposition along the GBM.
    Either circulating antibody or characteristic biopsy evidence may establish
    antibody involvement; ANCA testing identifies double-positive disease.
  results: >-
    Positive circulating anti-GBM antibodies with linear GBM IgG on biopsy
    confirm the diagnosis; concurrent ANCA positivity defines double-positive
    disease.
  evidence:
  - reference: PMID:40973182
    reference_title: Anti-glomerular basement membrane disease-treatment standard.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis relies on clinical features, kidney biopsy showing linear IgG
      deposition along the GBM, and/or detection of circulating anti-GBM antibodies.
    explanation: >-
      Directly states the clinical, biopsy, and circulating-antibody diagnostic
      criteria without requiring every modality to be positive.
- name: Recognition of atypical seronegative anti-GBM disease
  description: >-
    Absence of detectable circulating anti-GBM antibodies does not exclude an
    atypical presentation when kidney biopsy shows linear GBM IgG. This category
    is heterogeneous and should not be assumed to follow classic disease.
  results: Linear GBM IgG with absent circulating anti-GBM antibodies.
  evidence:
  - reference: PMID:33013861
    reference_title: Clinical-Pathological Features and Outcome of Atypical Anti-glomerular Basement Membrane Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atypical cases of anti-glomerular basement membrane (GBM) disease had
      absent circulating antibodies but linear IgG deposits along GBM in the kidneys.
    explanation: Directly defines the seronegative, biopsy-positive atypical presentation in a 60-patient cohort.
histopathology:
- name: Linear IgG deposition along the glomerular basement membrane
  diagnostic: true
  description: >-
    Direct immunofluorescence shows pathognomonic linear (ribbon-like) IgG
    deposition along the GBM, distinguishing anti-GBM disease from pauci-immune
    (ANCA) and granular (immune-complex) glomerulonephritides.
  finding_term:
    preferred_term: linear glomerular basement membrane IgG deposition
  evidence:
  - reference: PMID:40973182
    reference_title: Anti-glomerular basement membrane disease-treatment standard.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis relies on clinical features, kidney biopsy showing linear IgG
      deposition along the GBM, and/or detection of circulating anti-GBM antibodies.
    explanation: >-
      Identifies linear GBM IgG deposition as the characteristic diagnostic
      biopsy finding.
treatments:
- name: Plasma exchange (plasmapheresis)
  description: >-
    Therapeutic plasma exchange rapidly removes circulating pathogenic anti-GBM
    IgG and is a cornerstone of induction therapy with glucocorticoids and
    cyclophosphamide.
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_phenotypes:
  - preferred_term: Glomerulonephritis
    term:
      id: HP:0000099
      label: Glomerulonephritis
  target_mechanisms:
  - target: Linear anti-GBM IgG deposition
    treatment_effect: INHIBITS
    description: >-
      Plasma exchange removes circulating pathogenic anti-GBM IgG, interrupting
      antibody binding and the downstream complement/neutrophil-mediated injury.
    evidence:
    - reference: PMID:28515156
      reference_title: Anti-Glomerular Basement Membrane Disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Treatment aims to rapidly remove pathogenic autoantibody, typically with
        the use of plasma exchange, along with steroids and cytotoxic therapy
      explanation: Directly supports antibody removal as the mechanism of plasma exchange.
  evidence:
  - reference: PMID:40973182
    reference_title: Anti-glomerular basement membrane disease-treatment standard.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Historically, untreated disease was rapidly fatal, but the introduction of
      plasma exchange combined with cyclophosphamide and glucocorticoids has
      significantly improved outcomes, particularly in patients who are not
      dialysis-dependent at presentation.
    explanation: Supports plasma exchange as one component of current combination induction therapy.
  - reference: PMID:41629746
    reference_title: "Plasma Exchange for Anti-GBM Disease With Dialysis Dependency: A Case Series on Clinical Outcomes and Safety."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients (22.2%) achieved dialysis independence at 10 and 11 months.
      Both patients had relatively preserved normal glomeruli (15.8%-37.2%) and
      achieved early remission.
    explanation: >-
      A 2026 nine-patient dialysis-dependent case series documents selected late
      recovery; PARTIAL reflects its size, selection, and lack of a control group.
  - reference: PMID:28515156
    reference_title: Anti-Glomerular Basement Membrane Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment aims to rapidly remove pathogenic autoantibody, typically with
      the use of plasma exchange, along with steroids and cytotoxic therapy
    explanation: Directly supports plasma exchange as the antibody-removal cornerstone of induction.
- name: High-dose glucocorticoids
  description: >-
    Glucocorticoids suppress inflammation and are given with plasma exchange and
    cyclophosphamide in standard induction therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  evidence:
  - reference: PMID:28515156
    reference_title: Anti-Glomerular Basement Membrane Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      along with steroids and cytotoxic therapy to prevent ongoing autoantibody
      production and tissue inflammation
    explanation: Supports steroids (with cytotoxic therapy) to control inflammation and autoantibody production.
- name: Cyclophosphamide
  description: >-
    The cytotoxic agent cyclophosphamide suppresses new autoantibody production
    and, with plasma exchange and steroids, completes standard induction therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
  target_mechanisms:
  - target: HLA-restricted loss of tolerance and anti-GBM IgG production
    treatment_effect: INHIBITS
    description: >-
      Cyclophosphamide suppresses the lymphocyte-driven production of new
      anti-GBM autoantibody, acting at the autoantibody-formation node.
    evidence:
    - reference: PMID:28515156
      reference_title: Anti-Glomerular Basement Membrane Disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        along with steroids and cytotoxic therapy to prevent ongoing autoantibody
        production and tissue inflammation
      explanation: Directly supports suppression of ongoing autoantibody production by cytotoxic therapy.
  evidence:
  - reference: PMID:28515156
    reference_title: Anti-Glomerular Basement Membrane Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      along with steroids and cytotoxic therapy to prevent ongoing autoantibody
      production and tissue inflammation
    explanation: >-
      Supports cytotoxic therapy (cyclophosphamide is the standard cytotoxic agent)
      to prevent ongoing autoantibody production.
- name: Rituximab
  description: >-
    Anti-CD20 B-cell depletion may be considered as second-line treatment when
    cyclophosphamide is contraindicated. Available outcome estimates are derived
    mainly from selected case reports and series, not randomized comparison. A
    2026 retrospective cohort found faster dialysis independence but no
    statistically significant difference in absolute dialysis independence or
    three-year kidney failure.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: HLA-restricted loss of tolerance and anti-GBM IgG production
    treatment_effect: INHIBITS
    description: >-
      Rituximab depletes CD20+ B cells upstream of new anti-GBM antibody
      production; it does not directly eliminate mature plasma cells.
    evidence:
    - reference: PMID:40225363
      reference_title: Efficacy and Safety of Rituximab in Antiglomerular Basement Membrane Disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The results indicate that rituximab can be considered as a second-line
        therapy in anti-GBM disease when cyclophosphamide is contraindicated.
      explanation: >-
        Supports clinical use of the B-cell-depleting agent; PARTIAL because the
        cited synthesis does not experimentally isolate this mechanistic edge.
  evidence:
  - reference: PMID:40225363
    reference_title: Efficacy and Safety of Rituximab in Antiglomerular Basement Membrane Disease.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acknowledging the limitations of our study, including publication and
      selection bias, rituximab had a favorable toxicity and efficacy profile.
      The results indicate that rituximab can be considered as a second-line
      therapy in anti-GBM disease when cyclophosphamide is contraindicated.
    explanation: >-
      An individual-patient synthesis of 67 selected published cases supports a
      second-line role while explicitly identifying publication and selection
      bias; PARTIAL reflects the nonrandomized evidence base.
  - reference: DOI:10.3389/fimmu.2026.1835889
    reference_title: "Rituximab is associated with accelerated dialysis independence in anti-glomerular basement membrane disease: a retrospective cohort analysis of renal survival"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the RTX group demonstrated only numerical advantages in the
      absolute rate of dialysis independence (50.0% vs. 21.05%, p=0.107) and the
      3-year ESRD incidence (42.86% vs. 63.46%, p=0.223), the median time to
      dialysis independence was significantly shorter in the RTX group compared
      to the control group (26 vs. 41 days, p=0.009).
    explanation: >-
      Directly distinguishes a statistically significant time-to-recovery result
      from nonsignificant absolute kidney outcomes in a retrospective cohort.
- name: Imlifidase (investigational IgG-cleaving enzyme)
  description: >-
    Imlifidase (IdeS), an IgG-degrading enzyme of Streptococcus pyogenes, cleaves
    circulating IgG. A 15-patient open-label Phase 2a study reported antibody
    levels below the assay reference range at six hours and a kidney-survival
    signal against historical controls, but required randomized confirmation.
    The subsequent GOOD-IDES-02 Phase 3 trial was terminated by sponsor decision
    and has no posted results.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:35260419
    reference_title: "Endopeptidase Cleavage of Anti-Glomerular Basement Membrane Antibodies in vivo in Severe Kidney Disease: An Open-Label Phase 2a Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Then 6 hours after imlifidase infusion, all patients had anti-GBM
      antibodies levels below the reference range of a prespecified assay.
    explanation: Directly supports rapid anti-GBM antibody cleavage in the 15-patient Phase 2a study.
  - reference: PMID:35260419
    reference_title: "Endopeptidase Cleavage of Anti-Glomerular Basement Membrane Antibodies in vivo in Severe Kidney Disease: An Open-Label Phase 2a Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this pilot study, the use of imlifidase was associated with a better
      outcome compared with earlier publications, without major safety issues,
      but the findings need to be confirmed in a randomized controlled trial.
    explanation: >-
      Supports an early efficacy signal while directly preserving the authors'
      requirement for randomized confirmation.
  - reference: clinicaltrials:NCT05679401
    reference_title: "GOOD-IDES-02: imlifidase in severe anti-GBM antibody disease (Goodpasture disease)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An open-label, controlled, randomised, multi-centre Phase 3 trial
      evaluating renal function in patients with severe anti-GBM disease
      comparing imlifidase and standard of care (SoC) with SoC alone.
    explanation: >-
      Supports imlifidase as an investigational Phase 3 therapy for severe
      anti-GBM disease aimed at rapid IgG clearance.

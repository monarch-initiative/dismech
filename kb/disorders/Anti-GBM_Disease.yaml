has_subtypes:
- name: Atypical seronegative anti-GBM disease
  display_name: Atypical seronegative anti-GBM disease
  description: >-
    A heterogeneous biopsy-defined presentation with linear GBM IgG but absent
    circulating anti-GBM antibodies. In a 60-patient cohort, kidney injury was
    generally milder than classic disease, but hematuria, proteinuria, complement
    deposition, crescent formation, kidney failure, and death still occurred.
  evidence:
  - reference: PMID:33013861
    reference_title: Clinical-Pathological Features and Outcome of Atypical Anti-glomerular Basement Membrane Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atypical cases of anti-glomerular basement membrane (GBM) disease had absent
      circulating antibodies but linear IgG deposits along GBM in the kidneys.
    explanation: Defines the seronegative, biopsy-positive atypical subtype.
  - reference: PMID:33013861
    reference_title: Clinical-Pathological Features and Outcome of Atypical Anti-glomerular Basement Membrane Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Though heterogeneous, a substantial number of the patients had complement
      activation and crescent formation. Patients having crescents presented with
      more severe clinical course and worse outcomes.
    explanation: Supports heterogeneity and clinically important crescentic disease within the atypical cohort.
- name: Double-positive anti-GBM and ANCA disease
  display_name: Double-positive anti-GBM and ANCA disease
  description: >-
    Anti-GBM disease with concurrent ANCA has the severe early presentation of
    anti-GBM disease but a longer-term relapse risk resembling ANCA-associated
    vasculitis, so maintenance immunosuppression differs from classic disease.
  evidence:
  - reference: PMID:28506760
    reference_title: Patients double-seropositive for ANCA and anti-GBM antibodies have varied renal survival, frequency of relapse, and outcomes compared to single-seropositive patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No single-positive anti-GBM patients experienced disease relapse, whereas
      approximately half of surviving patients with AAV and double-positive
      patients had recurrent disease
    explanation: Supports the relapse-prone double-positive trajectory.
pathophysiology:
- name: Conformational exposure of cryptic alpha3/alpha5(IV)NC1 epitopes
  role: trigger
  description: >-
    The immunodominant E_A and E_B epitopes are sequestered within the native,
    cross-linked alpha345NC1 hexamer. Dissociation or conformational alteration
    exposes epitopes on alpha3 and alpha5 NC1 monomers that patient antibodies
    can bind. This molecular architecture supports a cryptic-epitope model, but
    does not by itself establish which exposure initiates disease in humans.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: COL4A3
    term:
      id: hgnc:2204
      label: COL4A3
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: HLA-restricted loss of tolerance and anti-GBM IgG production
    description: >-
      Exposure of normally cryptic NC1 epitopes provides antigenic substrate for
      the autoreactive response in the conformeropathy model.
    hypothesis_groups:
    - conformeropathy
    evidence:
    - reference: PMID:20660402
      reference_title: Molecular architecture of the Goodpasture autoantigen in anti-GBM nephritis.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        The antibodies bound to distinct epitopes encompassing region E(A) in the
        alpha5NC1 monomer and regions E(A) and E(B) in the alpha3NC1 monomer, but
        they did not bind to the native cross-linked alpha345NC1 hexamer
      explanation: >-
        Supports cryptic-epitope exposure; PARTIAL because the human study does
        not establish that exposure temporally initiates loss of tolerance.
  evidence:
  - reference: PMID:20660402
    reference_title: Molecular architecture of the Goodpasture autoantigen in anti-GBM nephritis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The antibodies bound to distinct epitopes encompassing region E(A) in the
      alpha5NC1 monomer and regions E(A) and E(B) in the alpha3NC1 monomer, but
      they did not bind to the native cross-linked alpha345NC1 hexamer
    explanation: >-
      Shows the autoantibodies bind cryptic E_A/E_B neoepitopes exposed on
      dissociated alpha3/alpha5 NC1 monomers but not the intact native hexamer,
      supporting the conformeropathy model.
  - reference: PMID:19729652
    reference_title: A sulfilimine bond identified in collagen IV.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the cross-link also confers immune privilege to the collagen IV antigen of
      Goodpasture autoimmune disease
    explanation: >-
      Identifies the sulfilimine (S=N) cross-link that stabilizes the NC1 hexamer
      and confers immune privilege by sequestering the cryptic Goodpasture
      epitopes.
- name: HLA-restricted loss of tolerance and anti-GBM IgG production
  description: >-
    In susceptible hosts, alpha3(IV)NC1-reactive CD4+ T cells and B cells form an
    autoimmune response that produces directly pathogenic anti-GBM IgG. The
    strong HLA-DR15 association supports HLA-restricted antigen presentation;
    HLA susceptibility is not a causal germline mutation.

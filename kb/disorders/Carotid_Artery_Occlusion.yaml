      supports: SUPPORT
      evidence_source: OTHER
      snippet: Macrophage inflammatory chemoattractants stimulate infiltration and proliferation of smooth muscle cells. Smooth muscle cells produce the extracellular matrix providing a stable fibrous barrier between plaque prothrombotic factors and platelets.
      explanation: Connects macrophage inflammation to smooth-muscle-cell proliferation and extracellular-matrix production in the conserved central effector.

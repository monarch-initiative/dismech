  downstream:
  - target: Atherosclerotic carotid plaque formation
    description: Foam-cell inflammatory mediators recruit and stimulate vascular smooth muscle cells, which switch phenotype and assemble the plaque matrix.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - macrophage chemoattractant and cytokine signaling
    - vascular smooth muscle cell recruitment and phenotypic switching
    evidence:

  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Macrophage inflammation results in enhanced oxidative stress and cytokine/chemokine secretion, causing more LDL/remnant oxidation, endothelial cell activation, monocyte recruitment, and foam cell formation.

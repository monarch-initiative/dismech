name: Carotid Artery Occlusion
creation_date: "2026-05-06T03:11:16Z"
description: >-
  Carotid artery occlusion is a cerebrovascular disorder in which complete
  obstruction of the extracranial or intracranial carotid arterial lumen,
  usually after progressive carotid atherosclerosis, can reduce cerebral or
  retinal perfusion and increase risk for transient ischemic attack, ischemic
  stroke, and chronic hemodynamic compromise.
category: Complex
disease_term:
  preferred_term: carotid artery occlusion
  term:
    id: MONDO:0004450
    label: carotid artery occlusion
parents:
- Vascular disorder
synonyms:
- Carotid occlusive disease
- Internal carotid artery occlusion
- Extracranial internal carotid artery occlusion
- Chronic carotid artery occlusion
- Non-acute carotid artery occlusion
pathophysiology:
- name: Carotid Intimal ApoB Lipoprotein Retention
  role: trigger
  conforms_to: "atherogenesis#Endothelial Dysfunction and Subendothelial LDL Retention"
  description: >-
    Endothelial injury in the carotid arterial wall permits infiltration and
    retention of apoB-containing lipoproteins in the intima. Local modification
    of retained LDL initiates the inflammatory plaque-forming branch that can
    progress toward atherosclerotic carotid occlusion.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:
  - preferred_term: internal carotid artery
    term:
      id: UBERON:0001532
      label: internal carotid artery
  biological_processes:
  - preferred_term: cholesterol homeostasis
    term:
      id: GO:0042632
      label: cholesterol homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      infiltration and retention of apoB containing lipoproteins in the artery
      wall is a critical initiating event that sparks an inflammatory response
      and promotes the development of atherosclerosis.
    explanation: >-
      Establishes arterial-wall apoB-lipoprotein retention as the conserved
      initiating event; the internal carotid artery is the disease-specific site.
  downstream:
  - target: Carotid Monocyte Recruitment and Macrophage Foam Cell Formation
    description: >-
      Modified retained lipoproteins activate endothelium, recruit monocytes,
      and supply the substrate internalized by intimal macrophages.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - oxidative or enzymatic modification of retained apoB lipoproteins
    - endothelial activation and monocyte recruitment into the carotid intima
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Internalization of the apoB containing lipoproteins by macrophages promotes
        foam cell formation, which is the hallmark of the fatty streak phase of
        atherosclerosis.
      explanation: >-
        Supports macrophage uptake of retained apoB lipoproteins and subsequent
        foam-cell formation across the explicit recruitment intermediate.
- name: Carotid Monocyte Recruitment and Macrophage Foam Cell Formation
  role: amplifier
  conforms_to: "atherogenesis#Monocyte Recruitment and Macrophage Foam Cell Formation"
  description: >-
    Recruited carotid-intimal monocytes become macrophages, internalize modified
    apoB lipoproteins, and form lipid-laden foam cells. Macrophage inflammation
    amplifies LDL oxidation, endothelial activation, and additional monocyte
    recruitment in the plaque-forming branch.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: foam cell
    term:
      id: CL:0000891
      label: foam cell
  locations:
  - preferred_term: internal carotid artery
    term:
      id: UBERON:0001532
      label: internal carotid artery
  biological_processes:
  - preferred_term: foam cell differentiation
    term:
      id: GO:0090077
      label: foam cell differentiation
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Internalization of the apoB containing lipoproteins by macrophages promotes
      foam cell formation, which is the hallmark of the fatty streak phase of
      atherosclerosis.
    explanation: >-
      Directly supports macrophage apoB-lipoprotein uptake and foam-cell
      differentiation in the conserved amplifier.
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Macrophage inflammation results in enhanced oxidative stress and
      cytokine/chemokine secretion, causing more LDL/remnant oxidation,
      endothelial cell activation, monocyte recruitment, and foam cell formation.
    explanation: >-
      Documents the feed-forward inflammatory loop that amplifies foam-cell
      formation.
  downstream:
  - target: Atherosclerotic carotid plaque formation
    description: >-
      Foam-cell inflammatory mediators recruit and stimulate vascular smooth
      muscle cells, which switch phenotype and assemble the plaque matrix.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - macrophage chemoattractant and cytokine signaling
    - vascular smooth muscle cell recruitment and phenotypic switching
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Macrophage inflammatory chemoattractants stimulate infiltration and
        proliferation of smooth muscle cells. Smooth muscle cells produce the
        extracellular matrix providing a stable fibrous barrier between plaque
        prothrombotic factors and platelets.
      explanation: >-
        Connects macrophage inflammation to smooth-muscle-cell proliferation and
        extracellular-matrix production in the conserved central effector.
- name: Atherosclerotic carotid plaque formation
  role: central_effector
  conforms_to: "atherogenesis#Smooth Muscle Cell Switching and Fibrofatty Plaque Formation"
  description: >-
    Vascular smooth-muscle-cell phenotypic switching, proliferation, and
    extracellular-matrix secretion assemble a fibrofatty plaque with a fibrous
    cap in the carotid arterial wall. Progressive plaque growth creates the
    substrate for later stenosis and occlusion.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: smooth muscle cell proliferation
    modifier: INCREASED
    term:
      id: GO:0048661
      label: positive regulation of smooth muscle cell proliferation
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:37303351
    reference_title: "Carotid Artery Stenosis: A Look Into the Diagnostic and Management Strategies, and Related Complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CS is seen undergoing almost the same pathogenesis of any atherosclerotic plaque formation, from endothelial damage of the artery lumen to the formation of a fibrous cap with a foam cell, lipid-filled core.
    explanation: This review directly supports endothelial damage, fibrous cap formation, and foam-cell lipid core formation as carotid atherosclerotic plaque biology.
  - reference: PMID:39730871
    reference_title: Identification of shared genetic etiology of cardiovascular and cerebrovascular diseases through common cardiometabolic risk factors.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      They were enriched in pathways related to cellular response to external stimulus and regulation of the phosphate metabolic process and were highly expressed in endothelial cells, epithelial cells, and smooth muscle cells.
    explanation: This multi-trait genetic analysis supports endothelial and smooth-muscle cell involvement in related carotid/cerebrovascular atherosclerotic biology.
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      vascular smooth muscle cell phenotypic switching through transdifferentiation and stem/progenitor cell activation resulting in the promotion of inflammation, calcification, and secretion of extracellular matrix, altering fibrous cap structure, and necrotic core growth.
    explanation: >-
      This histopathology review supports the conserved smooth-muscle-cell
      switching and matrix-secretion program that builds the fibrous cap and
      enlarges the necrotic core of an atheroma.
  downstream:
  - target: Advanced carotid atheroma with necrotic core and fibrous cap
    description: >-
      Continued lipid accumulation, foam-cell death, and matrix remodeling
      mature the formed carotid plaque into a cap-and-core atheroma.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Continued lipid accumulation and foam-cell death enlarge the necrotic core.
    - Smooth-muscle-cell switching and matrix remodeling build and reshape the fibrous cap.
    evidence:
    - reference: PMID:37595697
      reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        vascular smooth muscle cell phenotypic switching through transdifferentiation and stem/progenitor cell activation resulting in the promotion of inflammation, calcification, and secretion of extracellular matrix, altering fibrous cap structure, and necrotic core growth.
      explanation: >-
        Supports smooth-muscle-cell switching and matrix secretion as
        intermediates that alter the fibrous cap and enlarge the necrotic core
        between initial plaque formation and advanced atheroma.
  - target: Thrombotic carotid occlusion
    description: >-
      Progressive atherosclerotic plaque can culminate in non-acute internal
      carotid occlusion, but the cohort does not resolve whether rupture,
      thrombosis, or chronic occlusive remodeling supplies the intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38740919
      reference_title: Significance of atherosclerotic plaque location in recanalizing non-acute long-segment occlusion of the internal carotid artery.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        patients with ICA occlusion caused by either proximal or distal
        atherosclerotic plaques
      explanation: >-
        Directly associates proximal or distal atherosclerotic plaque with ICA
        occlusion while leaving the intervening occlusive mechanism unresolved.
- name: Advanced carotid atheroma with necrotic core and fibrous cap
  role: effector
  conforms_to: "atherogenesis#Advanced Atheroma with Necrotic Core and Fibrous Cap"
  description: >-
    Continued lipid accumulation, foam-cell death, and matrix remodeling produce
    an advanced carotid atheroma with a lipid-rich necrotic core enclosed by a
    fibrous cap. Neovascularization, intraplaque hemorrhage, cap thinning, and
    surface ulceration can destabilize the lesion. This optional mature-plaque
    stage is represented without assuming that it caused every chronic or
    non-acute occlusion in the cited cohorts.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  locations:
  - preferred_term: internal carotid artery
    term:
      id: UBERON:0001532
      label: internal carotid artery
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: DOI:10.3390/ijms25084351
    reference_title: "Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In macroscopic evaluation, vulnerable plaques are characterized by one or more of the following features: microcalcification; neovascularization; lipid-rich necrotic cores (LRNCs); intraplaque hemorrhage (IPH); thin fibrous caps; plaque surface ulceration; huge dimensions, suggesting stenosis; and plaque rupture.
    explanation: >-
      Directly establishes the necrotic-core, fibrous-cap, hemorrhagic, and
      surface features of an advanced carotid atheroma.
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the local arterial microenvironment of a stable atheroma promotes destabilizing conditions that result in the transition to an unstable atheroma.
    explanation: >-
      Supports maturation and destabilization of a formed atheroma without
      asserting that destabilization is the only route to chronic occlusion.
- name: Thrombotic carotid occlusion
  description: >-
    Atherosclerotic plaque growth and associated thrombotic or occlusive
    remodeling can produce non-acute or chronic long-segment occlusion of the
    internal carotid artery. Occlusion anatomy and plaque location influence
    recanalization feasibility and re-occlusion risk. The available cohort
    evidence does not distinguish acute rupture or erosion from chronic plaque
    growth and occlusive remodeling, so this node is not restricted to the
    rupture-driven atherogenesis consequence.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:38740919
    reference_title: Significance of atherosclerotic plaque location in recanalizing non-acute long-segment occlusion of the internal carotid artery.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To investigate the significance of atherosclerotic plaque location in hybrid surgery comprising both endovascular recanalization approaches and carotid endarterectomy for symptomatic atherosclerotic non-acute long-segment occlusion of the internal carotid artery (ICA), 162 patients were enrolled, including 120 (74.1%) patients in the proximal plaque group and 42 (25.9%) in the distal plaque group.
    explanation: This cohort directly frames non-acute long-segment ICA occlusion as symptomatic atherosclerotic occlusion with plaque-location-dependent outcomes.
  - reference: PMID:37813974
    reference_title: Recanalization of chronic long-segment occlusion of the internal carotid artery with endovascular and hybrid surgery.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with chronic ICA occlusion treated with endovascular approach only or hybrid surgery were retrospectively enrolled.
    explanation: This supports chronic internal carotid artery occlusion as the treated vascular lesion in a human cohort.
  downstream:
  - target: Cerebral and retinal ischemia
    description: Completed carotid occlusion can reduce downstream blood flow or generate embolic ischemia in cerebral and retinal territories.
- name: Cerebral and retinal ischemia
  description: >-
    Reduced perfusion pressure from carotid occlusion, especially when collateral
    circulation is inadequate, and embolic obstruction from carotid plaque or
    thrombus can cause transient or permanent cerebral and retinal ischemic
    manifestations.
  evidence:
  - reference: clinicaltrials:NCT00029146
    reference_title: Carotid Occlusion Surgery Study
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to determine if extracranial-intracranial bypass surgery when added to best medical therapy can reduce the subsequent risk of ipsilateral stroke in high-risk patients with recently symptomatic carotid occlusion and increased cerebral oxygen extraction fraction measured by positron emission tomography (PET).
    explanation: This trial summary links symptomatic carotid occlusion with increased oxygen extraction fraction and ipsilateral stroke risk, supporting a hemodynamic ischemia mechanism.
  - reference: DOI:10.1093/cvr/cvad135
    reference_title: "Stroke risk management in carotid atherosclerotic disease: a clinical consensus statement of the ESC Council on Stroke and the ESC Working Group on Aorta and Peripheral Vascular Diseases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carotid atherosclerotic disease continues to be an important cause of stroke, often disabling or fatal.
    explanation: This consensus abstract supports carotid atherosclerotic disease as a major cause of disabling or fatal stroke.

notes: Atherosclerosis is the principal mechanism modeled here. Dissection-related occlusion and other arteriopathies have distinct etiologies and are not represented as atherosclerotic subtypes. Acute, non-acute, and chronic are temporal descriptions with study-specific thresholds, not genetically distinct disorders. No population frequency is inferred from stenosis registries or intervention-selected cohorts.
epidemiology:
- name: Spontaneous recanalization in heterogeneous occlusion cohorts
  description: A 2025 scoping review found a median recanalization proportion of 21.2% across 17 cohorts, with 39.7% in dissection studies and 8.75% in non-dissection studies. These are medians of heterogeneous study proportions, not a pooled probability for atherosclerotic occlusion. Timing of detection, incomplete surveillance, and possible misclassified near-occlusion limit interpretation.
  evidence:
  - reference: PMID:40644384
    reference_title: 'Spontaneous recanalization of extracranial internal carotid occlusion: A systematic scoping review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: When broken down by etiology, median proportion was 39.7% (IQR 32.8–54.3%) in dissection studies vs. 8.75% (IQR 5.70–10.5%) in non-dissection studies.
    explanation: Stratified full-text results prevent applying the mixed-etiology estimate to atherosclerotic occlusion.
  - reference: PMID:40644384
    reference_title: 'Spontaneous recanalization of extracranial internal carotid occlusion: A systematic scoping review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: there is no apparent consensus regarding the management of carotid recanalization whether symptomatic or not.
    explanation: The review does not establish a surveillance interval or routine intervention after recanalization.
- name: Recurrent stroke in hemodynamically compromised symptomatic occlusion
  description: In COSS, the two-year primary-event rate in the medically treated group was 22.7%. This is a selected recently symptomatic ICA-occlusion population with increased PET oxygen extraction, not an estimate for asymptomatic or well-collateralized occlusion.
  evidence:
  - reference: PMID:22068990
    reference_title: 'Extracranial-intracranial bypass surgery for stroke prevention in hemodynamic cerebral ischemia: the Carotid Occlusion Surgery Study randomized trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Two-year rates for the primary end point were 21.0% (95% CI, 12.8% to 29.2%; 20 events) for the surgical group and 22.7% (95% CI, 13.9% to 31.6%; 20 events) for the nonsurgical group
    explanation: Provides the selected-trial event rates; both groups received medical prevention.

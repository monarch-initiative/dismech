genetic:
- name: Shared cardiometabolic and stroke susceptibility loci (indirect context)
  association: Risk Factor
  presence: Positive
  notes: The European-ancestry GWAS examined coronary disease, myocardial infarction, heart failure, atrial fibrillation, all stroke, ischemic stroke, and risk-factor traits including carotid intima-media thickness. It did not ascertain complete carotid occlusion as an outcome. Its 11 loci mapped to 12 genes are shared vascular-risk context, not established carotid-occlusion genes or proof of a smooth-muscle mechanism in this disorder.
  evidence:
  - reference: PMID:39730871
    reference_title: Identification of shared genetic etiology of cardiovascular and cerebrovascular diseases through common cardiometabolic risk factors.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The 11 loci were mapped to 12 genes, namely CASZ1, CDKN1A, TWIST1, CDKN2B, ABO, SWAP70, SH2B3, LRCH1, FES, GOSR2, RPRML, and LDLR, where both GOSR2 and RPRML were mapped to one locus.
    explanation: The reported loci relate to the study's cardiovascular, cerebrovascular, and risk-factor traits; extrapolation to complete carotid occlusion is indirect.
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
- name: Diabetes-associated genetic markers and carotid plaque
  association: Risk Factor
  presence: Positive
  notes: In a Taiwanese community case-control study, 309 participants with carotid plaque and 439 without plaque were compared. Nine diabetes-associated SNPs met the exploratory inclusion threshold of 0.10, and four had significant independent associations. These are precursor-plaque associations, not validated predictors of complete carotid occlusion; the genetic risk scores are not clinical diagnostic tests.
  evidence:
  - reference: PMID:36894991
    reference_title: 'Associations of genetic markers of diabetes mellitus with carotid atherosclerosis: a community-based case-control study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified 9 DM SNPs showing promising associations with CP.
    explanation: Exploratory association with carotid plaque, not complete carotid artery occlusion.
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:36894991
    reference_title: 'Associations of genetic markers of diabetes mellitus with carotid atherosclerosis: a community-based case-control study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: To reduce the influence of false negativity, we used 0.10 as the pre-set inclusion criteria of promising SNPs.
    explanation: The full-text methods explain the exploratory threshold; not all nine SNPs were conventionally significant.

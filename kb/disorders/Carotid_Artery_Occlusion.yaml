stages:
- name: Non-acute occlusion (cohort-specific threshold)
  description: One 2024 atherosclerotic long-segment ICA cohort defined non-acute occlusion as more than seven days. This is an operational research threshold rather than a universal disease stage.
  evidence:
  - reference: PMID:38740919
    reference_title: Significance of atherosclerotic plaque location in recanalizing non-acute long-segment occlusion of the internal carotid artery.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: patients with non-acute (> 7 days) atherosclerotic ICA long-segment occlusion
    explanation: Specifies this cohort's temporal eligibility definition.
- name: Chronic occlusion (cohort-specific threshold)
  description: A 2023 cohort required at least three weeks of ICA occlusion after imaging confirmation. Organized thrombus may complicate reopening; this threshold is not interchangeable with every trial's non-acute definition.
  evidence:
  - reference: PMID:37813974
    reference_title: Recanalization of chronic long-segment occlusion of the internal carotid artery with endovascular and hybrid surgery.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: chronic atherosclerotic occlusion was defined as ICA occlusion over 3 weeks after imaging confirmation.
    explanation: States the study-specific definition.

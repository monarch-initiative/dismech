  description: Specialist series describe reopening selected symptomatic non-acute or chronic ICA occlusions using endovascular treatment or hybrid plaque removal and stenting. Technical success in retrospective single-center cohorts does not establish superiority over medical treatment; the cohorts may overlap and follow-up was incomplete. This differs from established endarterectomy indications for residual-lumen stenosis.

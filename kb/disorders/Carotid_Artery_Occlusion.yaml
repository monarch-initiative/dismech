- name: Advanced carotid atheroma with necrotic core and fibrous cap
  role: effector
  conforms_to: atherogenesis#Advanced Atheroma with Necrotic Core and Fibrous Cap
  description: Continued lipid accumulation, foam-cell death, and matrix remodeling produce an advanced carotid atheroma with a lipid-rich necrotic core enclosed by a fibrous cap. Neovascularization, intraplaque hemorrhage, cap thinning, and surface ulceration can destabilize the lesion. This optional mature-plaque stage is represented without assuming that it caused every chronic or non-acute occlusion in the cited cohorts.

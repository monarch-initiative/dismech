    reference_title: 'Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'In macroscopic evaluation, vulnerable plaques are characterized by one or more of the following features: microcalcification; neovascularization; lipid-rich necrotic cores (LRNCs); intraplaque hemorrhage (IPH); thin fibrous caps; plaque surface ulceration; huge dimensions, suggesting stenosis; and plaque rupture.'
    explanation: Directly establishes the necrotic-core, fibrous-cap, hemorrhagic, and surface features of an advanced carotid atheroma.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the local arterial microenvironment of a stable atheroma promotes destabilizing conditions that result in the transition to an unstable atheroma.
    explanation: Supports maturation and destabilization of a formed atheroma without asserting that destabilization is the only route to chronic occlusion.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  biological_scale: TISSUE

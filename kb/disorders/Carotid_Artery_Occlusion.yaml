- name: Extracranial-intracranial bypass under continued investigation
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Bypass
    term:
      id: NCIT:C15723
      label: Bypass
  description: Superficial-temporal-to-middle-cerebral artery bypass improves blood supply beyond the occlusion, but COSS and the prespecified two-year CMOSS analysis did not establish net clinical benefit over medical therapy. Extended CMOSS follow-up at median 7.6 years suggested a possible benefit on the composite primary outcome; it was post hoc, had substantial missing follow-up, and did not show significant secondary-outcome or per-protocol benefit. Routine benefit for chronic atherosclerotic ICA occlusion is therefore not established.

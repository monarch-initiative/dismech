name: Carotid Artery Occlusion
creation_date: '2026-05-06T03:11:16Z'
description: Carotid artery occlusion is complete obstruction of a carotid arterial lumen. This entry emphasizes atherosclerotic internal carotid artery occlusion, especially established extracranial or long-segment occlusion. Collateral circulation can preserve perfusion; inadequate compensation and artery-to-artery embolism can cause cerebral or retinal ischemia. Complete occlusion is distinct from severe stenosis and near-occlusion with residual flow. Acute ischemic stroke requires separate emergency assessment; chronic recanalization evidence cannot be substituted for acute stroke treatment evidence.
category: Complex
disease_term:
  preferred_term: carotid artery occlusion
  term:
    id: MONDO:0004450
    label: carotid artery occlusion
parents:
- Vascular disorder
synonyms:
- Carotid occlusive disease
- Internal carotid artery occlusion
- Extracranial internal carotid artery occlusion
- Chronic carotid artery occlusion
- Non-acute carotid artery occlusion
pathophysiology:
- name: Carotid Intimal ApoB Lipoprotein Retention
  role: trigger
  conforms_to: atherogenesis#Endothelial Dysfunction and Subendothelial LDL Retention
  description: Endothelial injury in the carotid arterial wall permits infiltration and retention of apoB-containing lipoproteins in the intima. Local modification of retained LDL initiates the inflammatory plaque-forming branch that can progress toward atherosclerotic carotid occlusion.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:
  - preferred_term: internal carotid artery
    term:
      id: UBERON:0001532
      label: internal carotid artery
  biological_processes:
  - preferred_term: cholesterol homeostasis
    term:
      id: GO:0042632
      label: cholesterol homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: infiltration and retention of apoB containing lipoproteins in the artery wall is a critical initiating event that sparks an inflammatory response and promotes the development of atherosclerosis.
    explanation: Establishes arterial-wall apoB-lipoprotein retention as the conserved initiating event; the internal carotid artery is the disease-specific site.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  downstream:
  - target: Carotid Monocyte Recruitment and Macrophage Foam Cell Formation
    description: Modified retained lipoproteins activate endothelium, recruit monocytes, and supply the substrate internalized by intimal macrophages.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - oxidative or enzymatic modification of retained apoB lipoproteins
    - endothelial activation and monocyte recruitment into the carotid intima
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Internalization of the apoB containing lipoproteins by macrophages promotes foam cell formation, which is the hallmark of the fatty streak phase of atherosclerosis.
      explanation: Supports macrophage uptake of retained apoB lipoproteins and subsequent foam-cell formation across the explicit recruitment intermediate.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
- name: Carotid Monocyte Recruitment and Macrophage Foam Cell Formation
  role: amplifier
  conforms_to: atherogenesis#Monocyte Recruitment and Macrophage Foam Cell Formation
  description: Recruited carotid-intimal monocytes become macrophages, internalize modified apoB lipoproteins, and form lipid-laden foam cells. Macrophage inflammation amplifies LDL oxidation, endothelial activation, and additional monocyte recruitment in the plaque-forming branch.

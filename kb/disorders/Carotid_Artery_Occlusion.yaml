    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the total success recanalization rate was 94.3%, whereas the success recanalization rate was 95.5% for the hybrid surgery and 93.0% for the endovascular approach.
    explanation: Selected 87-patient retrospective cohort; technical success, not comparative stroke-prevention efficacy.

- name: HADH Molecular Genetic Testing
  description: Identify biallelic pathogenic HADH variants using a suitable hyperinsulinism gene panel or exome/genome strategy, with attention to deletion detection and deep intronic variants. Exon-focused negative testing may require additional analysis because some HADH variants lie outside coding regions.
  diagnosis_term:
    preferred_term: DNA Sequencing
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  evidence:
  - reference: PMID:21252247
    reference_title: Genome-wide homozygosity analysis reveals HADH mutations as a common cause of diazoxide-responsive hyperinsulinemic-hypoglycemia in consanguineous pedigrees.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We recommend that HADH sequence analysis is considered in all patients with diazoxide-responsive HH when recessive inheritance is suspected.
    explanation: Recommends HADH sequence analysis for diagnostic confirmation in suspected recessive diazoxide-responsive hyperinsulinism.

    snippet: Six different HADH mutations were identified in 11/115 (10%) patients tested.
    explanation: Reports six distinct HADH variant types among the selected patients; the case-fraction notes preserve the uncertain pathogenicity of one alternative-transcript variant.
  - reference: PMID:26316438
    reference_title: 'A Deep Intronic HADH Splicing Mutation (c.636+471G>T) in a Congenital Hyperinsulinemic Hypoglycemia Case: Long Term Clinical Course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We present clinical and laboratory findings together with the long-term clinical course of a case with a deep intronic HADH splicing mutation (c.636+471G>T) causing neonatal-onset hyperinsulinemic hypoglycemia with mild progression.
    explanation: Documents deep intronic pseudoexon-creating HADH mutation causing hyperinsulinemic hypoglycemia.
  - reference: PMID:26316438
    reference_title: 'A Deep Intronic HADH Splicing Mutation (c.636+471G>T) in a Congenital Hyperinsulinemic Hypoglycemia Case: Long Term Clinical Course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: This mutation has been shown to introduce a cryptic splice donor site which results in pseudoexon activation and a premature termination codon and was also a founder mutation in the Turkish population (11).
    explanation: The review identifies the functional consequence and reported founder context of c.636+471G>T.
  case_fractions:
  - population: Selected patients with diazoxide-responsive hyperinsulinemic hypoglycemia after exclusion of common genetic causes
    case_fraction_percent: 9.6
    cohort_size: 115
    notes: The 11/115 reported yield applies to a selected referral cohort with ABCC8, KCNJ11, GCK, and HNF4A variants excluded; GLUD1 testing was performed in the seven patients with hyperammonemia. Consanguinity was reported in 18 probands, of whom five had reported HADH variants. This is not a worldwide prevalence or a fraction of an entirely consanguineous cohort. One reported compound heterozygote carried a second variant in an alternative transcript whose pathogenicity remained unproven in the paper.

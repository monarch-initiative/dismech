prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    HADH-related hyperinsulinemic hypoglycemia is an ultra-rare disorder accounting for less
    than 4% of all congenital hyperinsulinism cases, with an increased prevalence reported
    in consanguineous populations (up to 10% of consanguineous diazoxide-responsive cohorts).
    Approximately 40 cases have been reported in the medical literature.
  evidence:
  - reference: PMID:21252247
    reference_title: "Genome-wide homozygosity analysis reveals HADH mutations as a common cause of diazoxide-responsive hyperinsulinemic-hypoglycemia in consanguineous pedigrees."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six different HADH mutations were identified in 11/115 (10%) patients tested."
    explanation: Documents 10% frequency of HADH mutations in a consanguineous hyperinsulinism cohort.
  - reference: PMID:26316438
    reference_title: "A Deep Intronic HADH Splicing Mutation (c.636+471G>T) in a Congenital Hyperinsulinemic Hypoglycemia Case: Long Term Clinical Course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in other known genes (including HADH) together account for less than 4% of CHH (1)."
    explanation: Establishes that HADH variants account for less than 4% of total congenital hyperinsulinism cases.
progression:
- phase: Neonatal to early infancy onset
  notes: >-
    Onset is typically in the neonatal period or early infancy (commonly around 1 to 4 months of age),
    presenting with symptomatic fasting or protein-induced hypoglycemia, diaphoresis, jitteriness,
    and hypoglycemic convulsions.
  evidence:
  - reference: PMID:11489939
    reference_title: "Hyperinsulinism in short-chain L-3-hydroxyacyl-CoA dehydrogenase deficiency reveals the importance of beta-oxidation in insulin secretion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A female infant of nonconsanguineous Indian parents presented at 4 months with a hypoglycemic convulsion."
    explanation: Reports early infantile presentation with hypoglycemic convulsions at 4 months.
  - reference: PMID:26316438
    reference_title: "A Deep Intronic HADH Splicing Mutation (c.636+471G>T) in a Congenital Hyperinsulinemic Hypoglycemia Case: Long Term Clinical Course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation is mainly neonatal- or early infancy-onset HH and patients are diazoxide-responsive."
    explanation: Confirms that clinical presentation is predominantly neonatal or early infantile onset.
- phase: Chronic medical management
  notes: >-
    With ongoing diazoxide therapy and avoidance of fasting or excessive protein loads,
    long-term glycemic control is achieved and prevents recurrent neuroglycopenic seizures
    and irreversible brain damage. Diazoxide dosage can occasionally be tapered with age.
  evidence:
  - reference: PMID:26316438
    reference_title: "A Deep Intronic HADH Splicing Mutation (c.636+471G>T) in a Congenital Hyperinsulinemic Hypoglycemia Case: Long Term Clinical Course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following the diagnosis of CHH, she was commenced on 10 mg/kg/day of diazoxide and remained on that dose for five years."
    explanation: Demonstrates stable long-term control on maintenance diazoxide therapy.

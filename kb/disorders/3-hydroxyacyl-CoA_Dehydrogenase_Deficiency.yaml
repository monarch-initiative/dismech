  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in the nuclear HADH gene (encoding mitochondrial short-chain
    3-hydroxyacyl-CoA dehydrogenase, SCHAD) eliminate or drastically reduce SCHAD catalytic activity
    and protein abundance in mitochondria.

    explanation: The guideline explicitly identifies HADH as a gene with clinically relevant deep intronic variants missed by some tests.
- name: Evaluation of At-Risk Relatives
  description: Clarify the genetic status of at-risk siblings after identifying the familial HADH variants. At-risk newborns need glucose surveillance from birth and prompt diagnostic assessment. The Genetic Screening binding describes familial variant testing; glucose surveillance is an additional component. This applies general nonsyndromic genetic hyperinsulinism guidance to a molecularly defined HADH family.

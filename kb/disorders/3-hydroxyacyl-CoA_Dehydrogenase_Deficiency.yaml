      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Recessive mutations in the hydroxyacyl-CoA dehydrogenase (HADH) gene encoding the enzyme 3-hydroxyacyl-CoA dehydrogenase are a rare cause of diazoxide-responsive hyperinsulinemic hypoglycemia (HH) with just five probands reported to date.
      explanation: Confirms autosomal recessive inheritance of HADH-related hyperinsulinemic hypoglycemia.
  evidence:
  - reference: PMID:21252247

    evidence_source: MODEL_ORGANISM
    snippet: "hadh(-/-) islets have lower intracellular glutamate and aspartate levels, and this decrease can be prevented by high glucose."
    explanation: Demonstrates increased glutaminolysis and glutamine oxidation in SCHAD-deficient islets.
  - reference: PMID:19417036

name: 3-Hydroxyacyl-CoA Dehydrogenase Deficiency
category: Mendelian
creation_date: '2026-09-12T05:00:00Z'
synonyms:
- SCHAD deficiency
- Short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency
- HADH deficiency
- Hyperinsulinism due to short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency
- Short chain L-3-hydroxyacyl-CoA dehydrogenase deficiency
- HADH-related hyperinsulinemic hypoglycemia
description: >-
  3-Hydroxyacyl-CoA dehydrogenase deficiency (HADH deficiency, also known as short-chain
  3-hydroxyacyl-CoA dehydrogenase or SCHAD deficiency) is an autosomal recessive inborn error
  of metabolism caused by biallelic loss-of-function mutations in the nuclear HADH gene.
  HADH encodes mitochondrial short-chain 3-hydroxyacyl-CoA dehydrogenase, which catalyzes
  the penultimate NAD+-dependent oxidation of short- and medium-chain L-3-hydroxyacyl-CoAs
  to 3-ketoacyl-CoAs in the fatty acid beta-oxidation pathway. Uniquely among mitochondrial
  fatty acid beta-oxidation defects, the primary clinical presentation is persistent
  congenital hyperinsulinemic hypoglycemia and severe dietary protein (leucine) sensitivity,
  rather than cardiomyopathy, rhabdomyolysis, or severe hepatic failure. Pathophysiologically,
  this hyperinsulinemic phenotype arises because SCHAD directly interacts with and tonically
  inhibits mitochondrial glutamate dehydrogenase (GDH/GLUD1) in pancreatic beta cells.
  Loss of SCHAD protein eliminates this tonic inhibition, driving constitutive GDH activation,
  accelerated glutaminolysis, increased beta-cell ATP/ADP ratio, closure of ATP-sensitive
  potassium (K-ATP) channels, membrane depolarization, and dysregulated calcium-dependent
  insulin exocytosis. When residual enzyme activity is profoundly depleted, metabolic
  hallmarks including elevated plasma 3-hydroxybutyrylcarnitine (C4-OH) and urinary
  3-hydroxyglutarate are detected. Because beta-cell K-ATP channels remain structurally
  intact, hyperinsulinism in HADH deficiency is characteristically responsive to diazoxide.

- name: Pancreatic Beta-Cell Depolarization and Inappropriate Insulin Secretion
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Elevated ATP/ADP ratios induce closure of beta-cell ATP-sensitive potassium (K-ATP) channels,
    depolarizing the plasma membrane and opening voltage-gated calcium channels. Influx of calcium
    triggers continuous and inappropriate exocytosis of insulin granules into the circulation,
    uncoupled from physiological blood glucose levels.
  biological_processes:

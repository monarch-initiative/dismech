- name: Increased Islet GDH Activity
  biological_scale: MOLECULAR
  description: SCHAD-deficient islets show increased GDH affinity for alpha-ketoglutarate and catalytic efficiency in the reductive-amination assay under submaximal ADP stimulation. Oxidative-deamination kinetics could not be measured directly; increased glutamine oxidation supports the physiological interpretation. The kinetic effect was not found in liver or kidney, and GTP/ADP allosteric responses were preserved, distinguishing this regulatory defect from GLUD1 activating variants.

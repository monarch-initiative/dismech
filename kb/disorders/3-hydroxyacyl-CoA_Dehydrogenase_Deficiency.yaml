    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Because of the severe neurologic consequences of delayed diagnosis and treatment, it is imperative that at-risk newborns be followed closely from birth and a definitive diagnosis made as rapidly as possible.
    explanation: GeneReviews recommends early assessment of at-risk newborns; the surrounding section recommends molecular testing when the familial variants are known.
animal_models:
- name: Global Hadh Knockout Mouse
  species: Mouse
  genotype: Global Hadh-/-
  publication: PMID:20670938
  description: Global Hadh deletion produces fasting hypoglycemia and exaggerated insulin responses to oral amino acids. Isolated-islet experiments from the same model characterize GDH regulation, amino-acid oxidation, energy charge and calcium responses; those assays are distinguished from whole-animal measurements.
  notes: Normal basal insulin release and calcium in isolated islets do not negate the fasting phenotype in intact mice. No neuroglycopenic brain-injury outcome is claimed for this model. The C4-OH and urinary 3-hydroxyglutarate readouts are not assigned a causal role in hypoglycemia.
  evidence:
  - reference: PMID:20670938
    reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Following oral amino acid stimulation, there were significant decreases in glucose and increases in plasma insulin in the hadh−/− mice, whereas there were no significant changes in glucose or insulin levels in control mice.
    explanation: The intact-animal challenge demonstrates amino-acid-sensitive dysregulation.
  modeled_mechanisms:
  - target: Biallelic HADH Loss of Function
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Genetic ablation perturbs HADH function throughout the animal.
    limitations: The knockout is a mouse model; individual human HADH variants may preserve catalytic or regulatory functions that a null model removes.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: The present report describes studies of a mouse model of SCHAD deficiency that was developed by ablation of the mouse hadh gene.
      explanation: Identifies the genetic perturbation that defines the animal model.
  - target: Loss of SCHAD-GDH Inhibitory Interaction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Biochemical studies associated with the knockout model support a SCHAD-GDH protein interaction and its inhibitory regulatory role.
    limitations: The cited pull-down experiments used extracts or isolated proteins; they do not directly visualize the interaction in a living human beta cell.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Pull-down experiments with SCHAD, anti-SCHAD, or anti-GDH antibodies showed protein-protein interactions between SCHAD and GDH.
      explanation: Biochemical association assays support the regulatory mechanism.
  - target: Increased Islet GDH Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Islet homogenates from knockout mice show altered GDH substrate affinity under the assay conditions.
    limitations: Affinity was measured using alpha-ketoglutarate in the reductive-amination direction; the opposite oxidative-deamination direction could not be measured in these islet assays.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: GDH enzyme kinetics of hadh(-/-) islets showed an increase in GDH affinity for its substrate, α-ketoglutarate.
      explanation: The islet homogenate assay measures the altered kinetic property.
  - target: Increased Islet Glutamine Oxidation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Isolated knockout islets show increased glutamine oxidation.
    limitations: This is an ex vivo metabolic measurement. Glutamine alone did not stimulate insulin secretion; co-stimulation with other amino acids changes the response.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: glutamine oxidation was increased 2-fold in hadh−/− islets, providing further evidence of increased GDH activity.
      explanation: Radiotracer assays measure increased glutamine oxidation.
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: However, hadh−/− islets showed no insulin response to stimulation with glutamine alone (data not shown).
      explanation: The secretory effect requires the appropriate stimulation context.
  - target: Increased Islet ATP/ADP Ratio
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Amino-acid stimulation raises the ATP/ADP ratio in isolated knockout islets.
    limitations: The relevant response depends on stimulus composition. A basal trend toward increased ATP/ADP was insufficient to stimulate insulin release.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: In hadh−/− islets, the addition of 1.25 mm alanine to the glutamine/leucine mixture further increased both insulin release and the ATP/ADP ratio to the same level as stimulation with 12 mm AAM.
      explanation: The batch-incubation experiment measures energy charge under defined amino-acid stimulation.
  - target: Exaggerated Amino-Acid-Induced Calcium Response
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Calcium imaging of isolated knockout islets shows abnormal amino-acid responses with normal basal calcium.
    limitations: The assay is performed in isolated islets and does not establish every intervening channel step in vivo.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Measurement of cytosolic calcium showed normal basal levels and abnormal responses to amino acids in hadh(-/-) islets.
      explanation: Islet calcium imaging distinguishes basal and evoked responses.
  - target: Inappropriate Insulin Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The intact knockout responds to amino acids with excessive insulin relative to glucose. Separate isolated-islet tests limit an explanation based on a specific effect of accumulated fatty-acid intermediates.
    limitations: The knockout is a mouse model; individual human HADH variants may preserve catalytic or regulatory functions that a null model removes. The negative fatty-acid result comes from isolated-islet experiments and does not exclude every possible metabolic modifier.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Following oral amino acid stimulation, there were significant decreases in glucose and increases in plasma insulin in the hadh−/− mice, whereas there were no significant changes in glucose or insulin levels in control mice.
      explanation: The intact-animal challenge demonstrates dysregulated insulin response.
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The failure to observe a specific effect of fatty acids on insulin secretion in hadh−/− islets indicates that the hyperinsulinism is not the result of accumulation of fatty acid intermediates.
      explanation: The authors interpret a negative isolated-islet result as limiting a fatty-acid-intermediate explanation; this supports the stated limitation on the proposed metabolic mechanism.
  - target: Accumulation of 3-Hydroxybutyrylcarnitine
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The global knockout reproduces increased plasma 3-hydroxybutyrylcarnitine.
    limitations: This is a whole-animal biochemical readout. Metabolite abnormalities are variable in human disease, and their measurement does not establish that they drive insulin secretion.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: In vivo, hadh−/− mice had reduced plasma glucose, increased plasma 3-hydroxybutyrylcarnitine, and increased urinary 3-hydroxyglutarate, consistent with observations in affected children.
      explanation: The study reports the metabolite abnormalities in intact knockout mice.
  - target: Accumulation of 3-Hydroxyglutarate
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The global knockout reproduces increased urinary 3-hydroxyglutarate.
    limitations: This is a whole-animal biochemical readout. Metabolite abnormalities are variable in human disease, and their measurement does not establish that they drive insulin secretion.
    evidence:
    - reference: PMID:20670938
      reference_title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: In vivo, hadh−/− mice had reduced plasma glucose, increased plasma 3-hydroxybutyrylcarnitine, and increased urinary 3-hydroxyglutarate, consistent with observations in affected children.
      explanation: The study reports the metabolite abnormalities in intact knockout mice.
- name: Hadh-Null Islet Transplantation into Diabetic Mice
  species: Mouse
  genotype: Hadh-/- donor islets in streptozotocin-treated ICR-SCID recipients
  background: Donor SCHADKO mice were described as mixed B6/129; recipients were male ICR-SCID mice.
  publication: PMID:26953163
  description: Transplantation of Hadh-null islets under the renal capsule of diabetic recipients produces lower random and fasting glucose than transplantation of control islets. Removal of the graft-bearing kidney restores hyperglycemia. The experiment separates the islet contribution from a requirement for global SCHAD deficiency.
  notes: The authors establish sufficiency of mutant islets in this transplant setting, not beta-cell-specific autonomy or exclusion of all systemic modifiers. The study does not resolve contributions from alpha cells or metabolites generated within the transplanted islets.
  evidence:
  - reference: PMID:26953163
    reference_title: The Hypoglycemic Phenotype Is Islet Cell-Autonomous in Short-Chain Hydroxyacyl-CoA Dehydrogenase-Deficient Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: We therefore transplanted islets from global SCHAD knockout (SCHADKO) mice into mice with streptozotocin-induced diabetes.
    explanation: Defines the transplantation design separately from the global knockout.
  - reference: PMID:26953163
    reference_title: The Hypoglycemic Phenotype Is Islet Cell-Autonomous in Short-Chain Hydroxyacyl-CoA Dehydrogenase-Deficient Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: After transplantation, SCHADKO islet recipients exhibited significantly lower random and fasting blood glucose compared with mice transplanted with normal islets or nondiabetic, nontransplanted controls.
    explanation: The transplant transfers the glycemic phenotype.
  modeled_mechanisms:
  - target: Inappropriate Insulin Secretion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The transplant shows that mutant islets are sufficient to shift glucose regulation without a global Hadh deletion in the recipient.
    limitations: Glycemia and circulating insulin are whole-animal readouts. Insulin concentrations were not significantly higher at every time point, and the experiment does not distinguish beta-cell effects from contributions of other islet cells or local metabolites.
    evidence:
    - reference: PMID:26953163
      reference_title: The Hypoglycemic Phenotype Is Islet Cell-Autonomous in Short-Chain Hydroxyacyl-CoA Dehydrogenase-Deficient Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: We propose that SCHADKO islets alone are sufficient to recapitulate the hypoglycemic phenotype observed in the animal model of global SCHAD deficiency.
      explanation: The transplantation study localizes sufficiency to islets in this model.
    - reference: PMID:26953163
      reference_title: The Hypoglycemic Phenotype Is Islet Cell-Autonomous in Short-Chain Hydroxyacyl-CoA Dehydrogenase-Deficient Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Our study does not address a potential role of SCHAD in β-cells versus other cell types in the islet.
      explanation: The authors explicitly limit the cell-type interpretation.

  biological_scale: ORGANISM
  description: >-
    Upstream accumulation of 3-hydroxybutyryl-CoA results in transesterification to carnitine,
    causing elevated circulating plasma 3-hydroxybutyrylcarnitine (C4-OH), and alternative
    omega-oxidation yielding urinary excretion of 3-hydroxyglutaric acid and dicarboxylic acids.

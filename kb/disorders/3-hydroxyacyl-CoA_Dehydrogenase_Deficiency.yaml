diagnosis:
- name: Biochemical Diagnosis of Hyperinsulinism
  description: Assess insulin secretion and action during documented hypoglycemia using a critical sample that includes glucose, insulin, beta-hydroxybutyrate and free fatty acids. Suppressed ketones and free fatty acids or an inappropriate glucose response to glucagon may support excessive insulin action even when insulin is low. These findings establish hyperinsulinism; molecular testing determines whether HADH is responsible. Live NCIT searches for "biochemical analysis", "clinical chemistry" and "blood glucose" did not identify a procedure representing this composite assessment. Blood Glucose Measurement covers only one analyte, while Clinical Chemistry denotes a discipline; the broader source-facing descriptor is retained without either binding.
  diagnosis_term:
    preferred_term: Critical-sample biochemical assessment for hyperinsulinism
  evidence:
  - reference: PMID:37454648
    reference_title: International Guidelines for the Diagnosis and Management of Hyperinsulinism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The diagnosis of HI is made on the basis of increased insulin action and/or inadequate suppression of plasma insulin during either spontaneous or fasting-induced hypoglycemia.
    explanation: General diagnostic guidance defines hyperinsulinism without requiring a high insulin result alone.
  - reference: PMID:37454648
    reference_title: International Guidelines for the Diagnosis and Management of Hyperinsulinism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: inappropriately suppressed plasma concentrations of FFA and BOHB during hypoglycemia, and an inappropriate glycemic response to glucagon at a time of hypoglycemia (Table 1)
    explanation: The guideline describes metabolic indicators of excessive insulin action.
- name: Plasma Acylcarnitine Profiling
  description: Blood spot or plasma acylcarnitine analysis may identify elevated C4-OH and support investigation of HADH deficiency. Normal profiles do not exclude the disease and should not prevent genetic testing when clinically indicated.
  diagnosis_term:
    preferred_term: Acylcarnitine profiling

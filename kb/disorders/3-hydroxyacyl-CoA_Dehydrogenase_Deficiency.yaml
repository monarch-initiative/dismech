    snippet: The index case presented at 4 months of age with hypoglycemic seizures. Her HH responded to diazoxide, but she continued to have episodes of hypoglycemia even on diazoxide, especially when consuming high-protein foods.
    explanation: Demonstrates breakthrough hypoglycemia precipitated by high-protein food intake.
- name: Intravenous Glucose for Acute Hypoglycemia
  therapeutic_modality: SMALL_MOLECULE
  description: Prompt intravenous glucose is recommended for acute hypoglycemia, with ongoing infusion and monitoring as needed. This is general hyperinsulinism emergency management applied to HADH-related disease.

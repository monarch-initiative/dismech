genetic:
- name: HADH loss-of-function variants
  gene_term:
    preferred_term: HADH
    term:
      id: hgnc:4799
      label: HADH
  relationship_type: CAUSATIVE
  association: Causative
  features: Biallelic HADH variants cause autosomal recessive hyperinsulinemic hypoglycemia. Reported variants include missense, nonsense, frameshift, exon/promoter deletions, and deep intronic splice-altering variants. Protein abundance and residual catalytic activity vary by variant; a uniform loss of all protein expression should not be assumed. The deep intronic c.636+471G>T variant activates a pseudoexon and introduces a premature termination codon.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:

  description: >-
    Loss of SCHAD catalytic activity blocks the penultimate dehydrogenation of short- and
    medium-chain L-3-hydroxyacyl-CoAs to 3-ketoacyl-CoAs within the mitochondrial fatty acid
    oxidation cycle. This disrupts complete beta-oxidation of fatty acids and short-chain
    branched intermediates.

treatments:
- name: Diazoxide
  description: >-
    First-line medical therapy for HADH deficiency. In HADH deficiency, K-ATP channels (SUR1/Kir6.2)
    are structurally intact and functional. Diazoxide binds the SUR1 subunit and maintains K-ATP
    channels in the open state, hyperpolarizing the beta-cell plasma membrane, blocking voltage-gated
    calcium entry, and suppressing unregulated insulin exocytosis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazoxide
      term:
        id: CHEBI:4495
        label: diazoxide
  evidence:
  - reference: PMID:21252247
    reference_title: "Genome-wide homozygosity analysis reveals HADH mutations as a common cause of diazoxide-responsive hyperinsulinemic-hypoglycemia in consanguineous pedigrees."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diazoxide targets the ATP-sensitive potassium (KATP) channel in the pancreatic β-cell and is often the first line of treatment."
    explanation: Establishes complete diazoxide responsiveness in all HADH-mutated patients.
  - reference: PMID:11489939
    reference_title: "Hyperinsulinism in short-chain L-3-hydroxyacyl-CoA dehydrogenase deficiency reveals the importance of beta-oxidation in insulin secretion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's hyperinsulinism was easily controlled with diazoxide and chlorothiazide."
    explanation: Documents excellent glycemic control achieved with diazoxide and chlorothiazide.
- name: Chlorothiazide
  description: >-
    Thiazide diuretic frequently co-administered with diazoxide. Chlorothiazide exhibits a synergistic
    hyperglycemic action by inhibiting pancreatic phosphodiesterase, reducing insulin release, and
    counteracting diazoxide-induced fluid retention.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: chlorothiazide
      term:
        id: CHEBI:3640
        label: chlorothiazide
  evidence:
  - reference: PMID:11489939
    reference_title: "Hyperinsulinism in short-chain L-3-hydroxyacyl-CoA dehydrogenase deficiency reveals the importance of beta-oxidation in insulin secretion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's hyperinsulinism was easily controlled with diazoxide and chlorothiazide."
    explanation: Confirms successful combination therapy with diazoxide and chlorothiazide.
- name: Frequent Carbohydrate Feedings and Avoidance of Fasting
  description: >-
    Supportive dietary therapy to maintain blood glucose and prevent acute neuroglycopenia
    during intervals between feeds or physiological stress.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:27771675
    reference_title: Hyperinsulinemic Hypoglycemia of Infancy due to Novel HADH Mutation in Two Siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HADH mutations are rare causes of hypoglycemia and can be mitigated with diazoxide and appropriate dietary therapy if identified early."
    explanation: Recommends appropriate dietary therapy alongside diazoxide.
- name: Dietary Protein Moderation
  description: >-
    Because loss of SCHAD unleashes GDH allosteric activation, amino acid consumption (particularly
    protein/leucine-rich meals) triggers hyperactivation of glutamate dehydrogenase and causes
    postprandial hypoglycemic episodes. Moderating dietary protein intake prevents protein-induced
    hyperinsulinism.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:19417036
    reference_title: "3-Hydroxyacyl-coenzyme A dehydrogenase deficiency and hyperinsulinemic hypoglycemia: characterization of a novel mutation and severe dietary protein sensitivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index case presented at 4 months of age with hypoglycemic seizures. Her HH responded to diazoxide, but she continued to have episodes of hypoglycemia even on diazoxide, especially when consuming high-protein foods."
    explanation: Demonstrates breakthrough hypoglycemia precipitated by high-protein food intake.
animal_models:
- name: Hadh knockout mouse (Hadh-/-)
  species: Mouse
  genotype: Hadh knockout (Hadh-/-)
  publication: PMID:20670938
  description: >-
    Global Hadh knockout (Hadh-/-) mice exhibit amino acid hypersensitivity, hypoglycemia,
    and elevated insulin secretion. Isolated islets display increased glutamine oxidation and
    GDH hyperactivation, and islet transplantation into diabetic mice demonstrates the hypoglycemic
    phenotype is islet cell-autonomous.
  modeled_mechanisms:
  - target: Loss of Tonic SCHAD Inhibition of Glutamate Dehydrogenase
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Hadh knockout mice recapitulate the loss of tonic GDH inhibition by SCHAD, leading to
      increased GDH activity and amino acid-stimulated insulin secretion.
    evidence:
    - reference: PMID:20670938
      reference_title: "Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves activation of glutamate dehydrogenase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These studies indicate that SCHAD deficiency causes hyperinsulinism by activation of GDH via loss of inhibitory regulation of GDH by SCHAD."
      explanation: Demonstrates in Hadh-/- mice that loss of SCHAD activates GDH and causes hyperinsulinism.
    - reference: PMID:26953163
      reference_title: "The Hypoglycemic Phenotype Is Islet Cell-Autonomous in Short-Chain Hydroxyacyl-CoA Dehydrogenase-Deficient Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that hypoglycemia in SCHAD-CHI is islet cell-autonomous."
      explanation: Shows that transplantation of SCHAD-KO islets recapitulates hypoglycemia in recipient mice, confirming cell autonomy.

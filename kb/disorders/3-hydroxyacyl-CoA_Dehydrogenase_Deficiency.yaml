progression:
- phase: Neonatal or infantile presentation
  notes: Presentation varies from neonatal hypoglycemia to recognition later in infancy. In a selected series of 11 patients with reported HADH variants, median age at diagnosis was seven weeks, with a range from one day to 26 weeks. These are ages at diagnosis, not a population onset distribution.
  evidence:
  - reference: PMID:21252247
    reference_title: Genome-wide homozygosity analysis reveals HADH mutations as a common cause of diazoxide-responsive hyperinsulinemic-hypoglycemia in consanguineous pedigrees.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The median age at diagnosis of HH for patients with HADH mutations was 7 weeks (range 1 d to 26 weeks) and the median birth weight was 3.6 kg at 40 weeks gestation (range 2.8–4.35 kg) (Table 1).
    explanation: The cohort supplies the age-at-diagnosis range and median.
- phase: Ongoing medical management
  notes: Diazoxide responsiveness is characteristic, but control requires individualized treatment and follow-up. Protein-triggered episodes may persist during therapy. A patient followed to age 20 required continued low-dose diazoxide, with recurrent hypoglycemia during attempted withdrawal; dose reduction with age does not establish resolution.
  evidence:
  - reference: PMID:26316438
    reference_title: 'A Deep Intronic HADH Splicing Mutation (c.636+471G>T) in a Congenital Hyperinsulinemic Hypoglycemia Case: Long Term Clinical Course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Drug cessation was tried but because of repeated hypoglycemic attacks diazoxide was started again at a dose of 2.5 mg/kg/day.
    explanation: The longitudinal case demonstrates recurrence during attempted withdrawal.
  - reference: PMID:26316438
    reference_title: 'A Deep Intronic HADH Splicing Mutation (c.636+471G>T) in a Congenital Hyperinsulinemic Hypoglycemia Case: Long Term Clinical Course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Her blood glucose levels continued to be at normal levels with the low dose (2-3 mg/kg/day) of diazoxide she has been receiving.
    explanation: The patient remained controlled on low-dose treatment at long-term follow-up.
  - reference: PMID:19417036
    reference_title: '3-Hydroxyacyl-coenzyme A dehydrogenase deficiency and hyperinsulinemic hypoglycemia: characterization of a novel mutation and severe dietary protein sensitivity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Her HH responded to diazoxide, but she continued to have episodes of hypoglycemia even on diazoxide, especially when consuming high-protein foods.
    explanation: Protein-triggered breakthrough hypoglycemia can occur despite diazoxide.
pathophysiology:
- name: Biallelic HADH Loss of Function
  biological_scale: MOLECULAR
  description: 'Biallelic pathogenic HADH variants impair SCHAD function. Effects on catalytic activity, protein abundance and regulatory interactions need not be equivalent: protein-sensitive hyperinsulinism has been reported with substantial residual catalytic activity.'
  evidence:
  - reference: PMID:19417036
    reference_title: '3-Hydroxyacyl-coenzyme A dehydrogenase deficiency and hyperinsulinemic hypoglycemia: characterization of a novel mutation and severe dietary protein sensitivity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequencing of the HADH gene identified a homozygous missense mutation (c.562A>G; p.Met188Val).
    explanation: Identifies a biallelic HADH variant in a child with hyperinsulinemic hypoglycemia.
  - reference: PMID:19417036
    reference_title: '3-Hydroxyacyl-coenzyme A dehydrogenase deficiency and hyperinsulinemic hypoglycemia: characterization of a novel mutation and severe dietary protein sensitivity.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Hydroxyacyl-coenzyme A dehydrogenase activity was significantly decreased compared with controls (index patient, mean +/- sem, 26.8 +/- 4.8 mU/mg protein; controls, 48.0 +/- 8.1 mU/mg protein; P = 0.029) in skin fibroblasts.
    explanation: The patient-derived fibroblast assay demonstrates partial catalytic deficiency, rather than obligatory absence of enzyme activity.
  role: trigger

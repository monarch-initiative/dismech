- name: Reduced Short-Chain Hydroxyacyl-CoA Oxidation
  biological_scale: MOLECULAR
  description: SCHAD normally catalyzes the NAD+-dependent oxidation of short- and medium-chain L-3-hydroxyacyl-CoAs to 3-ketoacyl-CoAs. Reduced catalytic activity can produce characteristic metabolite abnormalities, but those abnormalities are not required for hyperinsulinism.
  evidence:
  - reference: PMID:19417036
    reference_title: '3-Hydroxyacyl-coenzyme A dehydrogenase deficiency and hyperinsulinemic hypoglycemia: characterization of a novel mutation and severe dietary protein sensitivity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HADH encodes for the enzyme 3-hydroxyacyl-coenzyme A dehydrogenase (HADH) and catalyses the penultimate reaction in the beta-oxidation of fatty acids.
    explanation: Defines the normal catalytic step affected by HADH deficiency.
    quote_role: BACKGROUND
  - reference: PMID:19417036
    reference_title: '3-Hydroxyacyl-coenzyme A dehydrogenase deficiency and hyperinsulinemic hypoglycemia: characterization of a novel mutation and severe dietary protein sensitivity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in the HADH gene are associated with protein-induced HH, and patients with HH due to HADH gene mutations may have normal acylcarnitines and urine organic acids.
    explanation: Clinical hyperinsulinism can occur without detectable metabolite abnormalities.

      explanation: Distinguishes the consanguineous subset from the rest of the cohort.
treatments:
- name: Diazoxide
  description: Diazoxide is the characteristic effective medical therapy for HADH-related hyperinsulinism. It opens beta-cell KATP channels and suppresses insulin secretion. Glycemic response and adverse effects require monitoring; protein-triggered breakthrough episodes may still occur.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazoxide
      term:
        id: CHEBI:4495
        label: diazoxide
  target_mechanisms:
  - target: Inappropriate Insulin Secretion
    treatment_effect: INHIBITS
    description: Diazoxide opens K-ATP channels, hyperpolarizing the pancreatic beta-cell membrane and inhibiting calcium influx and inappropriate insulin secretion.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1375/
    reference_title: Nonsyndromic Genetic Hyperinsulinism Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT

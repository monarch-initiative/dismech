  - reference: PMID:14693719
    reference_title: "Familial hyperinsulinemic hypoglycemia caused by a defect in the SCHAD enzyme of mitochondrial fatty acid oxidation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inappropriately elevated insulin secretion is the hallmark of persistent hyperinsulinemic hypoglycemia of infancy (PHHI), also denoted congenital hyperinsulinism."
    explanation: Confirms familial hyperinsulinemic hypoglycemia caused by SCHAD genetic defect.
  downstream:
  - target: Profound Hypoketotic Hypoglycemia and Neuroglycopenia
    causal_link_type: DIRECT
    description: Hyperinsulinemia suppresses hepatic glucose production, enhances peripheral uptake, and shuts down ketogenesis.
- name: Profound Hypoketotic Hypoglycemia and Neuroglycopenia
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Excessive circulating insulin simultaneously drives glucose uptake into skeletal muscle and
    adipose tissue, inhibits hepatic gluconeogenesis and glycogenolysis, and potently suppresses
    adipose lipolysis and hepatic ketogenesis. The dual depletion of glucose and alternative
    ketone fuels starves the brain, producing neuroglycopenia, lethargy, seizures, and risk
    of neurological sequelae.
  chemical_entities:
  - preferred_term: glucose
    term:
      id: CHEBI:17234
      label: glucose
    modifier: DECREASED
  evidence:
  - reference: PMID:26316438
    reference_title: "A Deep Intronic HADH Splicing Mutation (c.636+471G>T) in a Congenital Hyperinsulinemic Hypoglycemia Case: Long Term Clinical Course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical feature of this metabolic disease is hypoketotic hypoglycemia with hyperinsulinism which is different from other inherited defects of fatty acid β-oxidation that can present with symptoms such as hepatomegaly, myopathy and cardiomyopathy."
    explanation: Identifies hypoketotic hypoglycemia with hyperinsulinism as the defining clinical hallmark distinct from other beta-oxidation disorders.
  - reference: PMID:11489939
    reference_title: "Hyperinsulinism in short-chain L-3-hydroxyacyl-CoA dehydrogenase deficiency reveals the importance of beta-oxidation in insulin secretion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further episodes of hypoketotic hypoglycemia were associated with inappropriately elevated plasma insulin concentrations."
    explanation: Documents recurrent hypoketotic hypoglycemia with inappropriate hyperinsulinemia.

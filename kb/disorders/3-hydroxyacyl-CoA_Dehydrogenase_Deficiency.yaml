    reference_title: "3-hydroxyacyl-coenzyme a dehydrogenase deficiency: identification of a new mutation causing hyperinsulinemic hypoketotic hypoglycemia, altered organic acids and acylcarnitines concentrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that, when the residual catalytic activity of the mutated enzyme is seriously reduced, the biochemical hallmarks of the disease, namely plasma 3-hydroxybutyrylcarnitine and urinary 3-hydroxyglutaric acid, are invariably present."
    explanation: Establishes plasma C4-OH carnitine and urinary 3-hydroxyglutarate as the biochemical hallmarks of severe SCHAD deficiency.
- name: Loss of Tonic SCHAD Inhibition of Glutamate Dehydrogenase
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Under physiological conditions, the SCHAD protein physically binds to mitochondrial glutamate
    dehydrogenase (GDH/GLUD1) in pancreatic beta cells and exerts tonic allosteric inhibition.
    In HADH deficiency, absence of SCHAD protein eliminates this tonic inhibition, leaving GDH
    hyperactive and hyperresponsive to allosteric activation by amino acids like leucine.

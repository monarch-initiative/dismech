    explanation: Establishes that loss of GDH tonic inhibition by SCHAD causes GDH hyperactivation and hyperinsulinism.
  downstream:
  - target: Accelerated Glutaminolysis and Mitochondrial ATP Generation
    causal_link_type: DIRECT
    description: Relieved GDH inhibition accelerates oxidative deamination of glutamate to alpha-ketoglutarate.
- name: Accelerated Glutaminolysis and Mitochondrial ATP Generation
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Uninhibited GDH catalyzes excessive deamination of glutamate to alpha-ketoglutarate, fueling
    the tricarboxylic acid (TCA) cycle and oxidative phosphorylation in pancreatic beta cells.
    This produces an inappropriate surge in cytosolic ATP/ADP ratio even during periods of low
    ambient glucose or following dietary protein (leucine) consumption.
  cell_types:
  - preferred_term: type B pancreatic cell
    term:
      id: CL:0000169
      label: type B pancreatic cell

genetic:
- name: RNF31
  gene_term:
    preferred_term: RNF31
    term:
      id: hgnc:16031
      label: RNF31
  relationship_type: CAUSATIVE
  notes: >-
    RNF31 encodes HOIP (HOIL-1-interacting protein), the catalytic RBR E3 ligase subunit of
    LUBAC, at 14q12. The gene was reached in the founding kindred by combining genome-wide
    linkage with whole-exome sequencing after known autoinflammation, immunodeficiency and
    lymphangiectasia genes had been excluded. HOIP has no paralogue that substitutes for it:
    it is the only ligase component of the only complex known to make M1-linked chains.
  variants:
  - name: "c.215T>C (p.Leu72Pro)"
    description: >-
      Homozygous missense change at the start of the PUB domain in the founding Kuwaiti
      kindred. Absent from public databases covering up to 60,706 individuals at the time of
      publication; no mutant protein detectable on immunoblot.
  - name: "c.1197G>C and c.1737+3A>G"
    description: >-
      Compound heterozygous splice-region variants in the second patient, producing transcripts
      that skip exon 7 (out of frame, removing the whole UBA domain) or exon 9 (in frame,
      removing most of UBA-1 and with it SHARPIN binding).
  - name: "c.1654C>T (p.Gln552Ter) and c.3038A>C (p.His1013Pro)"
    description: >-
      Compound heterozygous nonsense plus missense pair in the fourth patient, both absent from
      ExAC, 1000 Genomes, HGMD and gnomAD.
  evidence:
  - reference: PMID:26008899
    reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These variants included a homozygous T-to-C substitution at position 215 (c.215T>C) in exon 2 of HOIP (also known as RNF31), which was identified in the patient and confirmed by Sanger sequencing"
    explanation: The gene-discovery result and the founding allele.
  - reference: PMID:26008899
    reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HOIP L72P variant was not found in public databases (NCBI, UCSC, 1000 genomes, or ExAC, reaching a total of up to 60,706 individuals) or in our own WES database (2,212 individuals)."
    explanation: >-
      Population-database absence, part of the case for pathogenicity of the founding allele.
  - reference: PMID:41026334
    reference_title: "Novel Compound Heterozygous Mutations in HOIP Result in Autoinflammation and Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations were absent in population databases such as ExAC, 1000 Genomes, HGMD, and gnomAD."
    explanation: The same argument for the fourth patient's two alleles.

animal_models:

- name: Constitutive and endothelial Hoip knockout mouse
  species: Mouse
  genotype: Hoip-/- ; Hoip fl/fl Tie2-Cre
  publication: PMID:25284787
  description: >-
    Germline and endothelium-restricted Hoip deletion. Both are lethal at midgestation from
    aberrant endothelial cell death and defective vascularisation, and both are rescued by
    concurrent deletion of TNFR1. This is the cleanest in vivo demonstration that the TNFR1
    death route, rather than the loss of NF-kappa-B output, is what kills LUBAC-deficient
    endothelium.
  modeled_mechanisms:
  - target: Sensitisation to TNFR1-Mediated Cell Death
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      HOIP-deficient cells from this model show increased TNF- and lymphotoxin-alpha-induced
      death through aberrant complex II, and TNFR1 ablation prevents the in vivo consequence.
    limitations: >-
      The rescue experiment that establishes the TNFR1 dependence is only possible in mice; in
      patients the corresponding evidence is caspase-3 and pRIPK1 staining of colonic mucosa,
      which shows the death route is active but not that it is necessary.
    evidence:
    - reference: PMID:25284787
      reference_title: "HOIP deficiency causes embryonic lethality by aberrant TNFR1-mediated endothelial cell death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ablation of tumor necrosis factor receptor 1 (TNFR1) prevents cell death, vascularization defects, and death at midgestation."
      explanation: The genetic epistasis that establishes TNFR1 as the route.
  - target: Lymphatic and Vascular Endothelial Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Endothelium-restricted deletion produces disrupted vasculature, the murine counterpart of
      the vascular and lymphatic phenotype in the founding patient.
    limitations: >-
      The mouse dies in utero from a blood-vessel defect, while the human phenotype is
      postnatal lymphangiectasia in one of four patients and explicitly absent in another. The
      model therefore speaks to endothelial vulnerability to TNFR1-driven death rather than to
      the human lymphatic syndrome, and complete HOIP loss is lethal in mouse where the human
      alleles are hypomorphic.
    evidence:
    - reference: PMID:25284787
      reference_title: "HOIP deficiency causes embryonic lethality by aberrant TNFR1-mediated endothelial cell death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, LUBAC and its linear-ubiquitin-forming activity are required for maintaining vascular integrity during embryogenesis by preventing TNFR1-mediated endothelial cell death."
      explanation: The authors' conclusion, which is the claim this link makes at tissue scale.
  evidence:
  - reference: PMID:29695863
    reference_title: "LUBAC is essential for embryogenesis by preventing cell death and enabling haematopoiesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both HOIL-1 and HOIP prevent embryonic lethality at mid-gestation by interfering with aberrant TNFR1-mediated endothelial cell death, which only partially depends on RIPK1 kinase activity."
    explanation: >-
      Independent replication of the model's central result, and the qualification that the
      death is only partly RIPK1 kinase-dependent.

- name: Dendritic cell-specific Hoip knockout mouse
  species: Mouse
  genotype: Hoip fl/fl CD11c-Cre
  publication: PMID:34253576
  description: >-
    Conditional Hoip deletion in dendritic cells, the model that separates the autoinflammatory
    arm from the TNF arm. These mice develop spontaneous systemic inflammation; crossing them
    to TNFR1-null mice does not rescue it, whereas MyD88 deficiency does and antibiotics reduce
    it, pointing at TLR/IL-1R rather than TNFR1 signalling as the driver of the inflammatory
    phenotype.
  modeled_mechanisms:
  - target: Systemic Autoinflammation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces spontaneous systemic inflammation from a HOIP lesion restricted to one myeloid
      lineage, and assigns it to MyD88-dependent signalling.
    limitations: >-
      The lesion is dendritic-cell-restricted and complete, whereas patients are hypomorphic in
      every cell. The MyD88 dependence is a mouse epistasis result with no human counterpart,
      and it sits awkwardly beside the clinical observation that anti-TNF therapy controls the
      autoinflammation in LUBAC-deficient patients.
    evidence:
    - reference: PMID:34253576
      reference_title: "MyD88-Dependent Signaling Is Required for HOIP Deficiency-Induced Autoinflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study, we found that dendritic cell (DC)-specific deletion of HOIP resulted in spontaneous inflammation, indicating the essential role of HOIP in maintaining DC homeostasis."
      explanation: The phenotype this link records.
    - reference: PMID:34253576
      reference_title: "MyD88-Dependent Signaling Is Required for HOIP Deficiency-Induced Autoinflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Importantly, MyD88 deficiency rescued the inflammatory phenotype in HoipDC KO mice."
      explanation: >-
        The epistasis result behind the limitation recorded above, and the reason this model is
        curated as partially rather than fully recapitulating.

- name: Epidermis-specific Rnf31 knockout mouse
  species: Mouse
  genotype: Rnf31 fl/fl K14-Cre
  publication: PMID:29728512
  description: >-
    Keratinocyte-restricted Rnf31 deletion, lethal in the early postnatal period from severe
    skin inflammation driven by TNF-induced keratinocyte apoptosis and rescued by TNFR1
    deletion. Included because it is the tissue-level demonstration that LUBAC loss converts a
    normal TNF signal into a cell-death signal in a differentiated epithelium.
  modeled_mechanisms:
  - target: Tissue Cell Death and Inflammatory Infiltration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Shows the whole chain within one tissue: HOIP loss, TNF-driven apoptosis, inflammatory
      infiltrate, and reversal of all of it by removing TNFR1.
    limitations: >-
      The severe inflammatory dermatitis of this model and of Sharpin-null mice has no close
      counterpart in HOIP-deficient patients, whose dermatological findings are eczematous
      rather than the fulminant skin disease seen here. Species differences in keratinocyte TNF
      sensitivity, and the fact that the mouse allele is a complete deletion, both bear on that
      gap.
    evidence:
    - reference: PMID:29728512
      reference_title: "RNF31 Regulates Skin Homeostasis by Protecting Epidermal Keratinocytes from Cell Death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistently, deleting TNF receptor 1 could rescue the lethality of RNF31 epidermis-specific KO mice and also the skin inflammation."
      explanation: >-
        The TNFR1 rescue that makes this a demonstration of the cell-death-to-inflammation step
        rather than of skin inflammation in general.


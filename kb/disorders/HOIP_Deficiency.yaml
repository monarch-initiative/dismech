description: >-
  HOIP deficiency is an autosomal recessive inborn error of immunity caused by biallelic
  hypomorphic or loss-of-function variants in RNF31, which encodes HOIP, the catalytic
  subunit of the linear ubiquitin chain assembly complex (LUBAC). LUBAC is the only
  ubiquitin ligase known to build head-to-tail (M1-linked, "linear") polyubiquitin chains,
  and it is HOIP that carries the catalytic RING-IBR-RING module; HOIL-1 (RBCK1) and
  SHARPIN are the other two subunits. Losing HOIP therefore does not merely remove one
  component: the whole ternary complex is destabilised, with HOIL-1 and SHARPIN protein
  falling alongside it, and linear ubiquitination in patient cells is essentially
  abolished.

  What makes the disease mechanistically interesting is that one molecular lesion produces
  two clinically opposite immune phenotypes at once. Linear ubiquitin chains on NEMO and
  RIPK1 are required both to activate canonical NF-kappa-B downstream of TNFR1, IL-1R, the
  TLRs and CD40, and to restrain the death-inducing complex II that assembles when those
  same receptors are engaged. Loss of the chains therefore gives immunodeficiency through
  the first arm - fibroblasts and B cells that cannot mount an NF-kappa-B response, failed
  CD40-driven B cell activation, absent germinal centres, poor antibody responses - and
  autoinflammation through the second, with patient cells sensitised to TNF-induced
  apoptosis and necroptosis. Cell type is the third variable: while patient fibroblasts are
  hyporesponsive to IL-1 beta, patient monocytes are hyperresponsive to it, which is the
  lineage-specific split the founding report proposed as the direct basis of the
  autoinflammation.

  The clinical syndrome is early-onset multiorgan autoinflammation (recurrent fever, raised
  CRP and ESR, arthritis, dermatitis) combined with recurrent bacterial, viral and fungal
  infection, and it may include subclinical amylopectinosis of skeletal muscle and systemic
  lymphangiectasia with protein-losing enteropathy. Fewer than ten patients have been
  published, and the four fully reported cases differ substantially from one another: only
  the founding case had lymphangiectasia and amylopectinosis, and the most recently reported
  patient died before the age of two. Two of the reported patients carry a type I interferon
  signature in blood, which is unexplained and is not, on the current evidence, enough to
  call the disease an interferonopathy.
notes: >-
  Scope and lump/split. This entry is the RNF31/HOIP disease only. The sibling LUBAC
  disorders - HOIL-1 deficiency (RBCK1; the MONDO concept "polyglucosan body myopathy 1 with
  or without immunodeficiency", MONDO:0014389) and SHARPIN deficiency - are separate MONDO
  concepts with separate genes and are deliberately not merged here, although their cellular
  phenotypes overlap almost completely and the literature routinely reports them together.
  RBCK1 disease additionally has a large non-immunological arm (progressive myopathy and
  cardiomyopathy with polyglucosan storage) that has no counterpart in the reported HOIP
  patients. Papers about HOIL-1 or SHARPIN are cited here only where they report data on
  HOIP patients or HOIP-deficient cells, and each such evidence item says which.

  Patient count. Four patients are fully reported in English as of the literature review in
  PMID:41026334, which covered HOIP cases through January 2025: Boisson 2015 (Kuwaiti woman,
  homozygous p.L72P), Oda 2019 (girl with compound heterozygous splice-region variants), a
  Chinese patient with a homozygous C-terminal frameshift (PMID:39009172), and the Chongqing
  boy with compound heterozygous p.Q552Ter and p.H1013Pro. A further HOIP-deficient patient
  contributes cell and tissue data to PMID:38609546 without a separate clinical report.
  Counts in this entry are counts of patients, and `frequency` is deliberately left unset
  throughout rather than computed from four cases.

  No GeneReviews chapter exists. PubMed with
  `term=(HOIP[TI] OR RNF31[TI] OR LUBAC[TI]) AND genereviews[book]` returns 0 records, and
  `just check-genereviews` reports NO_CHAPTER against the committed Bookshelf index with the
  synonyms above present.

  Haematopoietic stem cell transplantation is not curated as a treatment because no report
  of it in a HOIP-deficient patient was found. The PubMed searches run were
  `HOIL-1 deficiency hematopoietic stem cell transplantation` (0 records),
  `LUBAC deficiency transplantation RBCK1 HSCT` (0 records) and
  `(RNF31 OR HOIP) AND (anakinra OR transplantation OR tocilizumab OR JAK)` (12 records,
  none of them a transplant report in a patient). The published management is supportive:
  immunoglobulin replacement, antibiotic prophylaxis, TNF blockade, and diet plus octreotide
  for the lymphangiectasia. Colchicine was given for three years to the founding patient on
  a presumptive diagnosis of familial Mediterranean fever with no clinical benefit; that is
  left in the cited case description rather than curated as a treatment, because it is a
  failed empirical trial under a mistaken diagnosis rather than a therapy for this disease.

  No `conforms_to` is declared. `just list-modules` was searched for inflammatory,
  necroptosis/cell-death and NF-kappa-B module families; the nearest candidates
  (`nlrp3_inflammasome_activation`, `cytokine_storm_hyperinflammation`) describe a different
  chain - inflammasome priming, and IL-6-driven capillary leak and multiorgan shock - and
  neither matches a node here. A LUBAC/M1-ubiquitin module, or a TNFR1 complex-II
  cell-death module, would be the right conformance target and does not yet exist; this
  entry and the SHARPIN and HOIL-1 diseases would be its first conformers.

  Six phenotypes are deliberately left unwired to the pathograph: neonatal omphalitis,
  clubbing, anaemia, postnatal growth retardation, bronchiectasis and lower limb muscle
  weakness. Each has a textbook explanation - infection in an antibody deficiency, chronic
  inflammation, enteric loss, recurrent respiratory infection - and none of them has a source
  that makes the causal claim about a HOIP-deficient patient. The muscle weakness case is the
  clearest: the patient with the muscle polyglucosan had normal electromyography and normal
  creatine kinase in the same paragraph, so the obvious edge is the one the source excludes.

  Deep-research provenance. An OpenScientist report
  (`research/HOIP_Deficiency-deep-research-openscientist.md`) is committed alongside this
  entry. `just preflight-dr` returns WARN on two counts, both resolved on inspection: TNF is
  mentioned more often than RNF31 because TNF signalling is this disease's own mechanism
  rather than a second disease, and the OMIM number the report cites (612487) is RNF31's
  gene MIM where MONDO xrefs the phenotype MIM 620632. Its reference validation is 15/15
  resolved with 11/11 quotes matching; its term validation reports three mislabelled CURIEs,
  none of which is used here. One of those is worth naming: the report offers `GO:1990592`
  for "protein linear polyubiquitination", which GO calls protein K69-linked ufmylation. The
  term bound in this entry, `GO:0097039`, was looked up independently.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Reported patients are homozygous (p.L72P; a C-terminal frameshift) or compound
    heterozygous (splice-region variants; p.Q552Ter with p.H1013Pro) for RNF31 alleles that
    reduce HOIP protein. Parents and unaffected siblings are heterozygous carriers. Carrier
    status is clinically silent, but the asymptomatic mother in the second family carried the
    same type I interferon and TNF transcriptome signatures as her affected daughter, so
    haploinsufficiency has a measurable subclinical effect on mononuclear cells.
  evidence:
  - reference: PMID:26008899
    reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both parents and the healthy sibling of the patient were heterozygous for the mutation"
    explanation: >-
      Segregation in the founding consanguineous kindred: the patient is homozygous and the
      obligate carriers are unaffected, which is the recessive pattern.
  - reference: PMID:30936877
    reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated that these variants are inherited in trans by sub-cloning of the patient's genomic DNA"
    explanation: >-
      Confirms biallelic (in trans) inheritance of the two variants in the second family,
      excluding a cis configuration on one chromosome.
  - reference: PMID:30936877
    reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type I IFN and TNF-mediated inflammatory transcriptome signatures were also identified in the PBMCs of the asymptomatic mother"
    explanation: >-
      The basis for describing carrier status as clinically silent but not transcriptionally
      silent.

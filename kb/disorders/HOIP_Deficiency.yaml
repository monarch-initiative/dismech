treatments:

- name: Immunoglobulin Replacement Therapy
  description: >-
    Intravenous or subcutaneous immunoglobulin, given in every reported patient. It replaces
    the antibody the failed germinal centre cannot produce, and improves IgG trough levels and
    infection burden; in the second patient it was sufficient on its own to keep her stable
    with minimal inflammation. It does not address the autoinflammatory arm, and in the
    founding patient systemic oedema continued after it was started.
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Germinal Centre Failure and Impaired Antibody Production
    treatment_effect: BYPASSES
    description: >-
      Supplies pooled donor antibody rather than repairing the germinal centre defect, which is
      why it is curated as bypassing rather than inhibiting the node.
    evidence:
    - reference: PMID:26008899
      reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with intravenous immunoglobulins was initiated, leading to an improvement in IgG trough levels."
      explanation: The measured effect on the humoral deficit in the founding patient.
  evidence:
  - reference: PMID:30936877
    reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, the patient is stable with minimal inflammation on subcutaneous immunoglobulin supplementation."
    explanation: >-
      The subcutaneous route, and the observation that it was sufficient as sole therapy in one
      patient.

- name: TNF Blockade
  description: >-
    Etanercept and adalimumab have both been used in HOIP-deficient patients, and the rationale
    is the cell-death arm: if TNF signalling through a LUBAC-deficient TNFR1 complex is what
    kills cells and drives inflammation, blocking TNF should quieten it. The clinical picture
    is of real but incomplete and non-durable benefit - arthritis improved on etanercept in the
    second patient, and in the fourth each adalimumab dose produced defervescence and a CRP
    fall lasting fifteen to twenty-five days before fever returned. That patient died during a
    relapse. The strongest evidence for the strategy in a LUBAC disease comes from a
    SHARPIN-deficient patient, in whom anti-TNF produced complete clinical and transcriptomic
    resolution.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
  target_mechanisms:
  - target: Sensitisation to TNFR1-Mediated Cell Death
    treatment_effect: INHIBITS
    description: >-
      Removing the ligand prevents engagement of the TNFR1 complex that, without linear
      ubiquitin chains, converts into the death-inducing complex II.
    evidence:
    - reference: PMID:38609546
      reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The remarkable efficacy of anti-TNF therapy in one patient, supported by genetic dissection of joint inflammation using murine models, suggests that TNF-mediated cell death contributes to the autoinflammation."
      explanation: >-
        The authors' inference from treatment response to mechanism, in a LUBAC-deficient
        patient. That patient is SHARPIN- rather than HOIP-deficient, which is why this is
        graded indirect and why the entry does not present the mechanism as established for
        HOIP.
  evidence:
  - reference: PMID:41026334
    reference_title: "Novel Compound Heterozygous Mutations in HOIP Result in Autoinflammation and Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second dose on November 23 led to rapid defervescence and a significant drop in CRP(Fig. 1G)."
    explanation: >-
      Adalimumab in a HOIP-deficient patient: a clear but time-limited response, which is the
      basis for describing the benefit as incomplete.
  - reference: PMID:30936877
    reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was treated with corticosteroids, methotrexate, and eventually improved on TNF blockade with etanercept."
    explanation: Etanercept for the arthritis of the second patient, before her genetic diagnosis.

- name: Systemic Autoinflammation
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The clinical syndrome that the myeloid hyperresponsiveness and the tissue cell death
    converge on: recurrent fever with no identified pathogen, persistently raised CRP and ESR,
    arthritis, dermatitis and splenomegaly, beginning in the neonatal period or in infancy in
    every reported patient. It is separable from the infection burden - the founding patient
    was treated for three years as familial Mediterranean fever before any immunological work
    was done - and it is what TNF blockade addresses.
  evidence:
  - reference: PMID:26008899
    reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A patient with multiorgan autoinflammation, combined immunodeficiency, subclinical amylopectinosis, and systemic lymphangiectasia, is homozygous for a mutation in HOIP, the gene encoding the catalytic component of LUBAC."
    explanation: The founding clinical description, which names the autoinflammation as multiorgan.
  - reference: PMID:41026334
    reference_title: "Novel Compound Heterozygous Mutations in HOIP Result in Autoinflammation and Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient experienced recurrent fever, multiple site infections, and chronic diarrhea from the neonatal period, requiring repeated hospitalizations."
    explanation: The same syndrome in the most severely affected reported patient.
  downstream:
  - target: Recurrent fever
    causal_link_type: DIRECT
  - target: Elevated circulating C-reactive protein concentration
    causal_link_type: DIRECT
  - target: Elevated erythrocyte sedimentation rate
    causal_link_type: DIRECT
  - target: Polyarticular arthritis
    causal_link_type: DIRECT
  - target: Eczematoid dermatitis
    causal_link_type: DIRECT
  - target: Splenomegaly
    causal_link_type: DIRECT


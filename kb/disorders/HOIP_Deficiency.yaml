- name: Germinal Centre Failure and Impaired Antibody Production
  role: consequence
  biological_scale: TISSUE
  description: >-
    The tissue-level consequence, shown directly in a HOIP-deficient patient's lymph node:
    lymphoid follicles are fewer and disorganised, germinal centres are lacking, apoptotic
    cells are increased within follicles, and somatic hypermutation in sorted memory B cells
    is defective. Circulating memory B cells are low across the reported patients. The result
    is poor antibody output even where total IgG is not frankly low - the second patient had
    normal immunoglobulins and still failed to respond to pneumococcal vaccination.

    Both arms of the molecular lesion converge here, since the excess follicular apoptosis is
    not explained by the CD40 signalling defect alone.

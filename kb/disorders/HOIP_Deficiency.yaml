mechanistic_hypotheses:
- hypothesis_group_id: lubac_dual_lesion_model
  hypothesis_label: Dual Lesion Model - Lost NF-kappa-B Activation Plus Released Cell-Death Brake
  status: CANONICAL
  description: >-
    Linear ubiquitin chains at receptor signalling complexes both enable canonical NF-kappa-B
    activation and hold the complex out of its death-inducing configuration. Losing them
    therefore produces immunodeficiency and autoinflammation from one lesion: the first through
    failed NF-kappa-B output in fibroblasts, B cells and T cells, the second through TNF-driven
    apoptosis and necroptosis of tissue cells. The model is supported in humans by the patient
    allele that removes the catalytic domain and produces both effects in the same cells, and
    in mice by the TNFR1 rescue of the endothelial and epidermal phenotypes.
  evidence:
  - reference: PMID:28469620
    reference_title: "NF-κB Pathway in Autoinflammatory Diseases: Dysregulation of Protein Modifications by Ubiquitin Defines a New Category of Autoinflammatory Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Consequently, OTULIN or A20-deficient cells have an excess of Met1 or K63 Ub chains on NEMO, RIPK1, and other target substrates, which lead to constitutive activation of the NF-kB pathway."
    explanation: >-
      The mirror-image diseases. OTULIN and A20 deficiency remove the enzymes that take
      ubiquitin chains off the same substrates, and produce constitutive NF-kappa-B rather
      than deficient NF-kappa-B - which is what places LUBAC deficiency in a class defined by
      the direction of the ubiquitin imbalance, and is the main differential diagnosis to
      hold in mind.
- hypothesis_group_id: myeloid_hyperresponsiveness_model
  hypothesis_label: Lineage-Specific Myeloid IL-1 Hyperresponsiveness Model
  status: ALTERNATIVE
  description: >-
    The autoinflammation is driven not by cell death but by the paradoxical hyperresponsiveness
    of LUBAC-deficient monocytes to IL-1 beta, which the founding reports of both HOIL-1 and
    HOIP deficiency proposed. The mouse evidence pulls in the same direction:
    dendritic-cell-restricted Hoip deletion causes spontaneous inflammation that TNFR1 deletion
    fails to rescue and MyD88 deletion does. The two models are not exclusive and may operate
    in different tissues, but they predict different therapies - IL-1 blockade rather than TNF
    blockade - and no patient has been reported on IL-1 blockade.

discussions:

- discussion_id: hoip_autoinflammation_tnf_versus_myd88
  kind: CONTROVERSY
  prompt: >-
    Is the autoinflammation of HOIP deficiency driven by TNF-induced cell death, or by
    MyD88-dependent TLR and IL-1R signalling in myeloid cells?
  attaches_to:
  - pathophysiology#Systemic Autoinflammation
  - pathophysiology#Monocyte Hyperresponsiveness to IL-1 beta
  - pathophysiology#Sensitisation to TNFR1-Mediated Cell Death
  rationale: >-
    The two candidate drivers have evidence of different kinds pointing in different
    directions. For TNF: patient colonic mucosa carries markers of RIPK1 kinase-dependent
    death, TNFR1 deletion rescues the endothelial and epidermal mouse phenotypes, and anti-TNF
    therapy produces clinical responses in patients - complete in a SHARPIN-deficient patient,
    partial and non-durable in a HOIP-deficient one. For MyD88: in the
    dendritic-cell-restricted Hoip knockout, which is the model built specifically to ask this
    question about autoinflammation, crossing to TNFR1-null mice did not rescue the
    inflammation while MyD88 deficiency did, and the patient monocyte phenotype that both
    founding reports proposed as the basis of autoinflammation is IL-1 beta
    hyperresponsiveness, which is MyD88-dependent. The question is not academic: it decides
    whether IL-1 blockade should be tried in a patient whose fever breaks through anti-TNF, and
    no reported patient has received it.
- discussion_id: hoip_interferon_signature_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What produces the type I interferon signature in HOIP-deficient patients, and is it doing
    clinical work?
  attaches_to:
  - pathophysiology#Type I Interferon Pathway Activation
  rationale: >-
    Two unrelated patients with different genotypes carry an interferon-stimulated gene
    signature in blood, and a healthy carrier mother carries it too. The obvious candidate
    mechanism - LUBAC restraining type I interferon production by degrading TRIM25 - was tested
    in the second patient's PBMCs and TRIM25 was not increased. The signature appears to be T
    cell rather than monocyte driven, since excess STAT1 phosphorylation after interferon-alpha
    was found in naive CD4 and CD8 T cells but not in CD14-positive cells. Its therapeutic
    relevance is untested: no HOIP-deficient patient has received a JAK inhibitor, and the
    second patient's own authors decline to classify the disease as an interferonopathy on the
    available evidence.
  evidence:
  - reference: PMID:30936877
    reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we did not observe increased expression of TRIM25 in unstimulated HOIP deficient patient's PBMCs, compared to control cells (Figure S8)."
    explanation: >-
      The negative result that keeps this gap open: the TRIM25 route, which is the mechanism
      the literature proposed for LUBAC restraining type I interferon, was tested in a
      HOIP-deficient patient's own cells and not found.
  - reference: PMID:30936877
    reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At this point there is no strong evidence to categorize the HOIP deficiency as a new type I interferonopathy, and it is unclear whether these patients would benefit from treatment with JAK inhibitors."
    explanation: >-
      The authors' own statement of the two open questions this gap records: the disease
      classification and whether JAK inhibition is indicated.
- discussion_id: hoip_amylopectinosis_subunit_dependence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is amylopectinosis mild or absent in HOIP deficiency when it is early, severe and
    consistent in HOIL-1 deficiency, if both destabilise the same complex?
  attaches_to:
  - pathophysiology#Amylopectin Accumulation in Skeletal Muscle
  rationale: >-
    Both diseases abolish LUBAC assembly, yet the polyglucosan arm tracks with the HOIL-1
    lesion rather than with LUBAC loss as such. The founding HOIP report offers two readings
    and does not choose between them: either the storage phenotype depends on a HOIL-1 function
    outside the complex, or the HOIP L72P allele is simply not fully loss-of-function. The
    distinction matters for whether these are two presentations of one mechanism or two
    mechanisms sharing a complex, and it is also the point at which the boundary between this
    entry and the RBCK1 disease would be redrawn if the answer were the first one.
  evidence:
  - reference: PMID:23995275
    reference_title: "New insights in the field of muscle glycogenoses."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Polyglucosan body myopathy with cardiomyopathy has been associated with mutations in RBCK1, a ubiquitin ligase, which have also been reported in children with early-onset immune disorder."
    explanation: >-
      States the two-faced character of the RBCK1 disease - a muscle glycogenosis and an
      immune disorder from the same gene - which is the contrast this gap is about, since the
      HOIP patients show the immune arm without a comparable storage myopathy.
- discussion_id: hoip_mouse_null_versus_human_hypomorph
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can mouse Hoip-null models speak to the human disease at all, given that complete HOIP loss
    is embryonic lethal in mice while patients survive into adult life?
  attaches_to:
  - pathophysiology#Sensitisation to TNFR1-Mediated Cell Death
  - pathophysiology#Lymphatic and Vascular Endothelial Injury
  rationale: >-
    Every constitutive Hoip-null mouse dies at midgestation from TNFR1-driven endothelial
    death, so the entire murine literature on this gene is about complete loss, while every
    reported patient retains residual HOIP. This is not a reason to discard the models - the
    TNFR1 epistasis they establish is unobtainable in humans, and the colonic caspase-3 and
    pRIPK1 staining in a patient shows the same route is active - but it does mean the
    quantitative relationship between residual HOIP and phenotype severity is unaddressed by
    any model. It is a live clinical question, since the four reported patients differ widely in
    severity and the one who died before two years old carried a nonsense allele.
  proposed_experiments:
  - experiment_id: hoip_graded_hypomorphic_allelic_series
    name: Graded hypomorphic Hoip allelic series
    description: >-
      Generate a mouse allelic series producing defined residual HOIP levels, including
      knock-in of the human p.L72P and p.H1013Pro changes, and ask at what residual level
      embryonic lethality is escaped and which of the human arms - autoinflammation, antibody
      failure, lymphangiectasia, muscle polyglucosan - appear.
    would_support:
    - pathophysiology#Sensitisation to TNFR1-Mediated Cell Death
    supporting_outcome:
    - >-
      Surviving hypomorphic animals recapitulate autoinflammation and antibody failure at
      residual HOIP levels comparable with those measured in patient cells, with severity
      tracking residual protein.


- name: Type I Interferon Pathway Activation
  role: modifier
  biological_scale: CELLULAR
  description: >-
    Two unrelated patients, on two continents and with different genotypes, carry an
    interferon-stimulated gene signature in blood. In the second patient it is enriched in
    PBMCs rather than whole blood, tracks with excess STAT1 phosphorylation in naive CD4 and
    CD8 T cells but not in monocytes, and is present in the asymptomatic carrier mother as
    well.

    The mechanism is open. The obvious candidate - LUBAC degrading TRIM25, a positive
    regulator of type I interferon production - was tested directly in the patient's PBMCs and
    TRIM25 was not increased. The authors are explicit that the evidence does not yet make
    HOIP deficiency an interferonopathy, and that whether JAK inhibition would help is
    unknown.

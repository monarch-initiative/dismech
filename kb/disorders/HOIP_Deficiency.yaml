- name: Sensitisation to TNFR1-Mediated Cell Death
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The second arm of the lesion, and the one that best explains the autoinflammation.
    Without M1 chains holding the TNFR1 signalling complex together, the receptor's output
    shifts from gene activation towards the cytosolic complex II that drives RIPK1
    kinase-dependent apoptosis and necroptosis. In human patients the evidence is
    histological rather than biochemical: colon biopsies from a HOIP-deficient patient carry
    excess cleaved caspase-3 and Ser166-phosphorylated RIPK1, the two markers of exactly that
    death route. The corresponding biochemistry comes from patient-derived and engineered
    cells and from mice.

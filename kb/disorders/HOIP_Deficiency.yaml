- name: Monocyte Hyperresponsiveness to IL-1 beta
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The counterintuitive half of the disease. In the same patient whose fibroblasts respond
    poorly to IL-1 beta, circulating monocytes respond to it more strongly than control
    monocytes, producing more IL-6 and IL-1 beta. The identical dissociation was described
    first in HOIL-1 deficiency, so it is a property of LUBAC loss rather than of one gene,
    and the authors of both reports propose it as the direct cellular basis of the clinical
    autoinflammation. The fourth patient's monocytes instead accumulated more intracellular
    TNF after IL-1 beta, so the cytokine that is overproduced is not fixed across patients,
    but the direction of the monocyte response is.

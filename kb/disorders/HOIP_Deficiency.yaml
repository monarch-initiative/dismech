- name: Impaired TLR3-Dependent Antiviral Signalling
  role: consequence
  biological_scale: CELLULAR
  description: >-
    LUBAC components are part of the TLR3 signalling complex, and without them TLR3 ligation
    activates fewer genes while assembling more of a death-inducing complex. Both halves of
    that shift point the same way clinically: less antiviral gene induction, and more
    double-stranded-RNA-driven cell death. The evidence is from LUBAC-deficient cells and
    mice rather than from HOIP patients, and no reported HOIP-deficient patient has had
    influenza A infection, so this arm is a mechanistic candidate for the viral
    susceptibility rather than a demonstrated cause of it.
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:27810922
    reference_title: "--LUBAC deficiency perturbs TLR3 signaling to cause immunodeficiency and autoinflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We identify a pivotal role of LUBAC in TLR3 signaling and discover a functional interaction between LUBAC components and TLR3 as crucial for immunity to influenza A virus infection."
    explanation: >-
      The antiviral consequence of the LUBAC-TLR3 interaction, established in mice, which is
      the claim this node makes and the reason it is graded as model-organism evidence.
  - reference: PMID:27810922
    reference_title: "--LUBAC deficiency perturbs TLR3 signaling to cause immunodeficiency and autoinflammation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Absence of LUBAC components increases formation of a previously unrecognized TLR3-induced death-inducing SC, leading to enhanced cell death."
    explanation: >-
      The second half of the shift: the same receptor that loses gene-activating output gains
      a death-inducing one, which is the TLR3 counterpart of the TNFR1 node above.
  downstream:
  - target: Recurrent viral infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed route from the TLR3 signalling defect to the clinical viral susceptibility. No
      reported HOIP-deficient patient has had a TLR3-dependent infection characterised, so
      the link is inferred from the cellular and murine work rather than observed.

- name: Impaired T Cell Compartment
  role: consequence
  biological_scale: CELLULAR
  description: >-
    The T cell arm is real but variable, and the variability is the point. The founding
    patient had severe T cell lymphopenia affecting the naive compartment with an impaired
    proliferative response to anti-CD3; the second patient had normal T cell counts and
    normal responses to T cell stimulation; the fourth had reduced CD4 and CD8 T cells with
    loss of central and effector memory CD8 subsets, fewer circulating T follicular helper
    cells and more Th17 cells. Mouse work shows LUBAC is required for late thymocyte
    differentiation and for regulatory T cell development and homeostasis, which gives a
    candidate mechanism the human data do not yet discriminate between.

    In the founding patient a second route is available and was raised by her own authors:
    systemic lymphangiectasia causes lymphatic leak, and lymphatic leak causes lymphopenia
    independently of any signalling defect.

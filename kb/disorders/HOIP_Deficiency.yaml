pathophysiology:

- name: Biallelic RNF31 Loss-of-Function Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Reported alleles are spread across the protein and across variant classes: the homozygous
    p.L72P missense change at the start of the N-terminal PUB domain in the founding kindred;
    compound heterozygous splice-region variants (c.1197G>C and c.1737+3A>G) producing
    transcripts that skip exon 7 or exon 9 and so remove all or part of the UBA domain
    through which HOIP binds SHARPIN and HOIL-1; a homozygous C-terminal frameshift that
    deletes the catalytic domain outright; and a compound heterozygous nonsense plus missense
    pair (p.Q552Ter, p.H1013Pro).

    The alleles are hypomorphic rather than strictly null in most patients, which matters
    because complete Hoip loss is embryonic lethal in mice. p.L72P leaves no detectable
    protein on immunoblot yet is described by its own authors as at least severely hypomorphic
    rather than proven null.
  genes:
  - preferred_term: RNF31
    term:
      id: hgnc:16031
      label: RNF31
    modifier: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: HOIP ubiquitin ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: LOSS_OF_FUNCTION
  notes: >-
    On the term choice. `GO:0061630` is bound here rather than a linkage-specific one because
    GO has no molecular function for Met1/linear-linkage ubiquitin *ligase* activity: the
    linkage-specific terms it does carry are `GO:0061815` Met1-linked polyubiquitin
    deubiquitinase activity, which is the reverse reaction and OTULIN's activity rather than
    HOIP's, and `GO:1990450` linear polyubiquitin binding, which is a binding rather than a
    catalytic function (`runoak -i ols:go search` on "Met1", "linear polyubiquitin" and
    "ubiquitin ligase activity" returns those three and nothing nearer). The positive reason
    for `GO:0061630` is that its own GO definition already covers this reaction: it ends
    "or, in the linear extension of ubiquitin chains, a peptide bond the between the
    C-terminal glycine and N-terminal methionine of ubiquitin residues". The `preferred_term`
    carries the HOIP-specific reading the ontology label leaves out.

    The activity is annotated on this node rather than on `Loss of Linear (M1)
    Ubiquitination` so that the entry states the GO ladder once and in order - gene
    (`RNF31`) to molecular function (ligase activity, lost) to biological process
    (`GO:0097039` protein linear polyubiquitination, decreased, two nodes downstream).
  genetic_context:
    description: >-
      Germline biallelic RNF31 alleles. Missense, splice-region, nonsense and frameshift
      mechanisms are all represented, and all converge on reduced HOIP protein.
    allelic_events:
    - MISSENSE_VARIANT
    - FRAMESHIFT_VARIANT
    - SPLICE_SITE_VARIANT
    - NONSENSE_VARIANT
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:26008899
    reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The missense allele (L72P, in the PUB domain) is at least severely hypomorphic, as it impairs HOIP expression and destabilizes the whole LUBAC complex."
    explanation: >-
      The founding allele, its domain position, and the authors' own careful statement that it
      is severely hypomorphic rather than demonstrably null.
  - reference: PMID:30936877
    reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results: We identified biallelic variants in close proximity to splice sites (c.1197G>C and c.1737+3A>G) in the RNF31 gene."
    explanation: The splice-region genotype of the second patient.
  - reference: PMID:39009172
    reference_title: "A novel HOIP frameshift variant alleviates NF-kappaB signalling and sensitizes cells to TNF-induced death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant causes a frameshift and generates a premature termination codon in messenger RNA, resulting in a C-terminal truncated HOIP mutant, that is, the loss of the linear ubiquitin chain-specific catalytic domain."
    explanation: >-
      The one reported allele that removes the catalytic domain itself, which makes this
      patient the cleanest human evidence that it is HOIP's ligase activity that is lost.
  - reference: PMID:41026334
    reference_title: "Novel Compound Heterozygous Mutations in HOIP Result in Autoinflammation and Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted gene sequencing identified novel compound heterozygous mutations in HOIP (c.1654 C > T, p.Gln552Ter; c.3038 A > C, p.His1013Pro)."
    explanation: The fourth patient's genotype, extending the allelic spectrum to nonsense alleles.
  downstream:
  - target: LUBAC Complex Destabilisation
    causal_link_type: DIRECT
    description: >-
      Reduced or absent HOIP protein removes the scaffold on which the ternary complex
      assembles.
    evidence:
    - reference: PMID:26008899
      reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, the L72P mutation destabilizes the HOIP protein and, consequently, the overall LUBAC complex."
      explanation: >-
        States the causal step from the variant to complex destabilisation, measured in the
        patient's own fibroblasts and EBV-B cells.

- name: LUBAC Complex Destabilisation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    LUBAC is a ternary complex and behaves as one: losing HOIP takes HOIL-1 and SHARPIN down
    with it, in patients as in mice. This has been shown in three unrelated patients with
    three different genotypes, in fibroblasts and EBV-transformed B cells in the first and in
    PBMCs in the second and fourth, so it is not a property of one allele. The consequence is
    that HOIP deficiency is functionally a whole-LUBAC deficiency rather than the loss of one
    enzymatic subunit from an otherwise intact complex.

    Which interaction is lost depends on the allele. The exon-9-skipping transcript of the
    second patient removes most of the UBA-1 module and loses binding to SHARPIN while
    keeping HOIL-1 binding; the exon-7-skipping transcript removes the whole UBA domain and
    binds neither.
  protein_complexes:
  - preferred_term: LUBAC complex
    term:
      id: GO:0071797
      label: LUBAC complex
    modifier: DECREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:26008899
    reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SHARPIN and HOIL-1 protein levels were lower in the cells from the patient than in control cells"
    explanation: >-
      The direct measurement that the other two subunits fall when HOIP is lost, which is what
      makes this a whole-complex lesion.
  - reference: PMID:30936877
    reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The protein expression of HOIP, as well as HOIL-1 and SHARPIN, were markedly diminished in the patient's PBMCs, suggesting the destabilization of the LUBAC (Figure 2A)."
    explanation: Independent replication in a second patient with a different genotype, in PBMCs.
  - reference: PMID:41026334
    reference_title: "Novel Compound Heterozygous Mutations in HOIP Result in Autoinflammation and Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations significantly reduced HOIP and LUBAC protein expression and altered the HOIP protein structure."
    explanation: A third independent genotype giving the same complex-level result.
  downstream:
  - target: Loss of Linear (M1) Ubiquitination
    causal_link_type: DIRECT
    description: >-
      HOIP carries the catalytic RBR module, so a destabilised complex cannot conjugate
      M1-linked chains.
    evidence:
    - reference: PMID:26008899
      reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we detected linear polyubiquitin aggregates in TNF- and IL-1β–treated control cells, but almost none in the patient's cells"
      explanation: >-
        The direct demonstration in patient fibroblasts that the destabilised complex no longer
        produces linear chains on stimulation.

- name: Loss of Linear (M1) Ubiquitination
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    LUBAC is the only ligase known to build head-to-tail M1-linked polyubiquitin, and its
    substrates sit inside the receptor signalling complexes of TNFR1, IL-1R, the TLRs and
    CD40 - NEMO and RIPK1 among them. The chains do two jobs at once at those complexes: they
    recruit and activate the IKK complex, and they hold the receptor signalling complex in
    its gene-activating configuration rather than letting it convert into the death-inducing
    cytosolic complex II. Removing them therefore subtracts a signal and releases a brake in
    the same step, which is the structural reason a single lesion here produces both
    immunodeficiency and autoinflammation downstream.
  biological_processes:
  - preferred_term: protein linear polyubiquitination
    term:
      id: GO:0097039
      label: protein linear polyubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:26008899
    reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linear ubiquitination and NF-κB activation are impaired in the patient's fibroblasts stimulated by IL-1β or TNF."
    explanation: >-
      Establishes in patient cells that the ubiquitination defect and the signalling defect
      travel together.
  - reference: PMID:39009172
    reference_title: "A novel HOIP frameshift variant alleviates NF-kappaB signalling and sensitizes cells to TNF-induced death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The truncated HOIP mutant has impaired E3 ligase function in linear ubiquitination, leading to the suppression of canonical NF-κB signalling and increased TNF-induced multiple forms of cell death."
    explanation: >-
      A patient allele that removes the catalytic domain reproduces both downstream arms,
      which is what licenses drawing both edges from this node.
  - reference: PMID:22863777
    reference_title: "The E3 ligase HOIP specifies linear ubiquitin chain assembly through its RING-IBR-RING domain and the unique LDD extension."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that both LUBAC catalytic activity and LUBAC specificity for linear ubiquitin chain formation are embedded within the RING-IBR-RING (RBR) ubiquitin ligase subunit HOIP."
    explanation: >-
      Establishes that it is HOIP itself that carries both the ligase activity and the
      linkage specificity, which is why losing this subunit abolishes M1 chains rather than
      merely reducing LUBAC output.
  downstream:
  - target: Impaired Canonical NF-kappa-B Activation
    causal_link_type: DIRECT
    description: >-
      M1 chains on NEMO and RIPK1 are required for IKK recruitment and activation at the
      receptor signalling complex.
    evidence:
    - reference: PMID:26008899
      reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we found that the IL-1 β–induced formation of NEMO-containing structures was almost entirely abolished in HOIP L72P-expressing fibroblasts"
      explanation: >-
        The step between the two nodes measured directly: without linear chains, NEMO does not
        assemble into the punctate structures that mark early NF-kappa-B activation.
  - target: Sensitisation to TNFR1-Mediated Cell Death
    causal_link_type: DIRECT
    description: >-
      Without M1 chains the TNFR1 signalling complex converts into the death-inducing
      cytosolic complex II.
    evidence:
    - reference: PMID:25284787
      reference_title: "HOIP deficiency causes embryonic lethality by aberrant TNFR1-mediated endothelial cell death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "HOIP-deficient cells are more sensitive to death induction by both tumor necrosis factor (TNF) and lymphotoxin-α (LT-α), and aberrant complex-II formation is responsible for sensitization to TNFR1-mediated cell death in the absence of HOIP."
      explanation: >-
        Names complex II as the intermediate between loss of HOIP and TNFR1-driven death, which
        is the claim this edge makes.
  - target: Monocyte Hyperresponsiveness to IL-1 beta
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same loss of linear ubiquitination produces the opposite signalling outcome in
      monocytes, by a route that is not established.
    evidence:
    - reference: PMID:26008899
      reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, the patient's monocytes respond to IL-1β more vigorously than control monocytes."
      explanation: >-
        The observation the edge encodes. It is typed as indirect with unknown intermediates
        because the paper reports the lineage-specific reversal without establishing what
        mediates it.
  - target: Type I Interferon Pathway Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Two of the four reported patients carry an interferon-stimulated gene signature in
      blood; the mechanism linking it to loss of linear ubiquitination is unknown.
    evidence:
    - reference: PMID:30936877
      reference_title: "Second Case of HOIP Deficiency Expands Clinical Features and Defines Inflammatory Transcriptome Regulated by LUBAC."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RNA sequencing of whole blood RNA and PBMCs demonstrated a marked transcriptome wide change including differential expression of type I interferon regulated genes."
      explanation: >-
        The observation behind the edge. The authors tested and excluded the proposed TRIM25
        route, so the intermediates are recorded as unknown.
  - target: Impaired TLR3-Dependent Antiviral Signalling
    causal_link_type: DIRECT
    description: >-
      LUBAC components sit in the TLR3 signalling complex and are required for it to activate
      genes rather than assemble a death complex, so the same loss of linear chains
      compromises the double-stranded-RNA sensing arm.
    evidence:
    - reference: PMID:27810922
      reference_title: "--LUBAC deficiency perturbs TLR3 signaling to cause immunodeficiency and autoinflammation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "On the biochemical level, we identify LUBAC components as interacting with the TLR3-signaling complex (SC), thereby enabling TLR3-mediated gene activation."
      explanation: >-
        Places LUBAC inside the TLR3 signalling complex and makes gene activation there
        LUBAC-dependent, which is the step this edge asserts.
  - target: Amylopectin Accumulation in Skeletal Muscle
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Diastase-resistant polyglucosan accumulates in muscle of LUBAC-deficient patients. The
      route from the ubiquitination defect to the storage material is not established for
      HOIP.
    evidence:
    - reference: PMID:38609546
      reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Individuals with HOIP and HOIL-1 deficiencies present with severe immunodeficiency, autoinflammation and glycogen storage disease."
      explanation: >-
        Groups the glycogen-storage arm with the LUBAC lesion across both diseases. It
        establishes the association, not the intermediates, which is why the edge is typed as
        having unknown ones.

- name: Impaired Canonical NF-kappa-B Activation
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    In patient fibroblasts, IKK phosphorylation is impaired and IkappaB-alpha degradation
    delayed after TNF or IL-1 beta, and IL-6 output falls sharply. The same defect is seen in
    patient PBMCs after TNF and in patient T and B cells after LPS. Reintroducing wild-type
    HOIP into the patient's fibroblasts restores IKK phosphorylation, IkappaB-alpha turnover
    and IL-6 production, which is what makes this a consequence of the HOIP lesion rather
    than a correlate of it.


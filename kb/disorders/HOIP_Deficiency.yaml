  sequelae:
  - target: Chronic diarrhea
    causal_link_type: DIRECT
    description: >-
      The founding patient's diarrhoea was fatty and improved on a low-fat diet, which is the
      pattern of lymphangiectasia-driven fat malabsorption. The link holds for that patient;
      the fourth patient's diarrhoea belongs to his infectious and inflammatory picture and
      has no lymphangiectasia behind it.
  - target: Protein-losing enteropathy
    causal_link_type: DIRECT
    description: >-
      Lymphatic leak into the bowel lumen drains protein, which is the mechanism connecting
      this phenotype to the hypoalbuminaemia and oedema below.
    evidence:
    - reference: PMID:26008899
      reference_title: "Human HOIP and LUBAC deficiency underlies autoinflammation, immunodeficiency, amylopectinosis, and lymphangiectasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Further evidence of lymph vessel abnormalities was provided by a lymphangiogram (showing abnormal filling of the thoracic duct), high α-1-antitrypsin antibody, and triglyceride concentrations."
      explanation: >-
        Raised alpha-1-antitrypsin is the standard marker of enteric protein loss, and is what
        connects the lymphangiectasia to the protein-losing state in this patient.


- name: Amylopectin Accumulation in Skeletal Muscle
  role: consequence
  biological_scale: TISSUE
  description: >-
    Patchy diastase-resistant, PAS-positive material in scattered skeletal muscle fibres -
    polyglucosan, chemically an amylopectin-like glucan - on sternocleidomastoid biopsy in the
    founding patient. It was subclinical: no electrographic or echographic sign of myopathy or
    cardiomyopathy, and normal creatine kinase.

    This is where HOIP and HOIL-1 deficiency differ most. In HOIL-1 disease amylopectinosis is
    early, severe and consistent, and it dominates the non-immunological phenotype; in the
    HOIP patient it was a biopsy finding, which led the founding authors to suggest the storage
    arm depends more on HOIL-1 than on HOIP or on LUBAC as a whole. Neither of the later
    patients assessed had it, although in both cases muscle was not biopsied.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:

  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual who is heterozygous for an ADPKD-causing
      pathogenic variant has a 50% chance of inheriting the pathogenic variant.
    explanation: >-
      GeneReviews states the transmission risk this entry asserts, and adds that
      prenatal and preimplantation testing become available once the family
      variant is known.
progression:
- phase: Diagnosis
  notes: >-
    Median age at diagnosis is 42 years, and later in men than women - 47 versus
    40. Nearly a third of diagnoses are incidental findings on abdominal imaging
    ordered for something else, which is a direct consequence of how quiet the
    disease is at this stage.
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median age at diagnosis was 42 (range, 9-84.5) years (n = 262), and the
      diagnosis was made significantly earlier in women
    explanation: >-
      PKD2-specific age at diagnosis and its sex difference.
- phase: Hypertension
  notes: >-
    Hypertension develops at a median age of 49 years and reaches a cumulative
    probability of 75.2% by age 60, 79.2% by 65 and 94.3% by 70. Sex does not
    influence when it appears.
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whereas the probability of hypertension was 75.2% (95% CI, 68.5%-81.9%)
    explanation: >-
      Cumulative probability of hypertension by age 60 in the PKD2 cohort.
- phase: Kidney failure
  notes: >-
    End-stage renal disease arrives at a Kaplan-Meier median of 77.8 years.
    Cumulative probability is 9.8% at 60, 18.5% at 65 and 38.1% at 70 - so the
    steep part of the curve falls in the eighth decade, after most patients have
    accumulated competing causes of death.
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At age 60, 65, and 70 years, probabilities of having reached ESRD were
      9.8% (95% CI, 5.2%-14.4%), 18.5% (95% CI, 12.4%-24.6%), and 38.1% (95% CI,
      28.8%-47.4%), respectively.
    explanation: >-
      The full PKD2 renal-survival trajectory rather than a single endpoint.
- phase: Unexpectedly early kidney failure
  notes: >-
    An unusually early decline in a PKD2 patient should prompt a search for a
    second diagnosis rather than being attributed to the PKD2 allele. Among the
    Genkyst patients who reached ESRD before 60, 44% had an associated condition
    or nephropathy that plausibly explained it. This is the single most
    clinically actionable point in the entry.
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 18 patients with more severe outcomes (ESRD before age 60), 44%
      had associated conditions or nephropathies likely to account for the early
      progression to ESRD.
    explanation: >-
      Directly quantifies how often early ESRD in PKD2 is explained by something
      other than the PKD2 variant.
diagnosis:
- name: Unified age-specific ultrasound criteria
  description: >-
    The unified criteria exist because of PKD2. The older ultrasound criteria
    were derived from PKD1 families and performed suboptimally in PKD2 patients
    through reduced sensitivity - the milder, later-forming cysts simply were
    not there yet in a young at-risk PKD2 individual. The unified criteria for
    families of unknown genotype are three or more cysts, unilateral or
    bilateral, at ages 15 to 39; two or more in each kidney at 40 to 59; four or
    more in each kidney at 60 or above. Fewer than two cysts at age 40 or above
    excludes the disease. This is a genotype-driven difference in diagnostic
    threshold, which is exactly the kind of PKD2-specific fact this entry exists
    to carry.
  evidence:
  - reference: PMID:18945943
    reference_title: "Unified criteria for ultrasonographic diagnosis of ADPKD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnostic criteria currently in use performed suboptimally for
      individuals with mutations in PKD2 as a result of reduced test
      sensitivity.
    explanation: >-
      States the PKD2-specific failure of the previous criteria, which is the
      reason the unified criteria were derived.
  - reference: PMID:18945943
    reference_title: "Unified criteria for ultrasonographic diagnosis of ADPKD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In families of unknown genotype, the presence of three or more (unilateral
      or bilateral) renal cysts is sufficient for establishing the diagnosis in
      individuals aged 15 to 39 y, two or more cysts in each kidney is
      sufficient for individuals aged 40 to 59 y, and four or more cysts in each
      kidney is required for individuals > or = 60 yr.
    explanation: >-
      The operative age-specific thresholds.
  - reference: PMID:18945943
    reference_title: "Unified criteria for ultrasonographic diagnosis of ADPKD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, fewer than two renal cysts in at-risk individuals aged > or =
      40 yr is sufficient to exclude the disease.
    explanation: >-
      The exclusion criterion, which is what allows an at-risk relative to be
      released from surveillance.
- name: Molecular genetic testing
  description: >-
    Sequencing of PKD1 and PKD2 establishes the diagnosis where imaging is
    equivocal, and is what makes the PKD1-versus-PKD2 distinction - and
    therefore this entry's prognostic content - available to a clinician at all.
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ADPKD is established in a proband with age-specific
      kidney imaging criteria and either an affected first-degree relative with
      ADPKD or a heterozygous pathogenic variant in PKD1, PKD2, or one of the
      less common associated genes
    explanation: >-
      GeneReviews states the two routes to a diagnosis.
- name: Surveillance schedule
  description: >-
    GeneReviews sets out the ongoing monitoring for a diagnosed patient:
    abdominal imaging every one to five years depending on stage, blood-pressure
    monitoring every three years from age five, and urine studies for
    proteinuria. Given the PKD2 trajectory, the low-frequency end of each
    interval is usually the applicable one.
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: CT or MRI examination of the abdomen with and without
      contrast enhancement every one to five years in adults depending on
      disease stage; blood pressure monitoring every three years beginning at
      age five years in those with normal blood pressure
    explanation: >-
      The GeneReviews surveillance schedule for ADPKD.

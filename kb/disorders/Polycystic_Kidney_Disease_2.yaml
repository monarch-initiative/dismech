      snippet: >-
        these findings suggest that factor s in addition to the germline
        mutation of a polycystic kidney disease gene might be required for
        individual cyst formation
      explanation: >-
        Establishes that the germline variant alone is insufficient for focal
        cyst formation, which is the link from the germline node to the somatic
        one.
  - target: Cilium-dependent cAMP elevation in tubular epithelium
    description: >-
      Loss of the polycystin calcium signal disinhibits adenylate cyclase and
      raises intracellular cAMP in the mutant epithelium.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26877954

    explanation: >-
      Establishes that the liver phenotype does not follow the milder renal
      course of PKD2 - a genuinely PKD2-specific observation.
- category: Neurological
  name: Intracranial aneurysm
  frequency: OCCASIONAL
  description: >-
    Intracranial aneurysm risk is elevated across ADPKD. The frequency here is
    taken from the ADPKD-wide GeneReviews statement; the cited source does not

animal_models:
- name: Pkd2 conditional knockout mouse
  species: Mouse
  genotype: Conditional Pkd2 inactivation at defined postnatal stages
  publication: PMID:41077129
  description: >-
    Germline Pkd2 deletion is embryonic lethal, so conditional inactivation is
    the only route to an adult model. Inactivating Pkd2 at or beyond postnatal
    day 14 gives delayed cyst formation, mirroring the developmental switch seen
    in Pkd1 models.
  modeled_mechanisms:
  - target: Somatic second hit and clonal cyst initiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Conditional inactivation reproduces the consequence of losing both alleles
      in adult tubular epithelium, and the postnatal-day-14 switch shows the
      cystogenic response depends on developmental timing.
    limitations: >-
      The model deletes Pkd2 by design rather than by stochastic somatic
      mutation, so it reproduces the outcome of a second hit but not the process
      that produces one. Rodent Pkd1 and Pkd2 loci also escape the recurrent
      somatic mutagenesis seen at the human locus, so spontaneous two-hit
      cystogenesis is not modelled at all.
    evidence:
    - reference: PMID:41077129
      reference_title: "Inactivation of Pkd2 in adult mice results in delayed cyst formation and identifies sex as a major modifier of disease severity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        There is a similar developmental switch in Pkd2 conditional mice with
        delayed cyst formation after Pkd2 inactivation at or beyond postnatal
        day 14.
      explanation: >-
        Establishes that the model produces cysts on Pkd2 loss and that timing
        governs the result.
  evidence:
  - reference: PMID:41077129
    reference_title: "Inactivation of Pkd2 in adult mice results in delayed cyst formation and identifies sex as a major modifier of disease severity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We confirm that sex is a key modifier of ADPKD progression with
      differences in disease severity occurring in the context of significant
      transcriptional differences between males and females that are
      independent of the Pkd2 genotype
    explanation: >-
      A genotype-independent sex effect on severity, which is the model
      counterpart of the human observation that men have lower kidney function
      than women at equivalent age.
experimental_models:
- name: Patient-derived multi-lineage adult renal organoids
  experimental_model_type: ORGANOID
  description: >-
    Expandable organoids grown from ADPKD surgical specimens, including
    PKD2-mutant donors. They reproduce elongated primary cilia, polarity
    disruption and elevated Rho GTPase/planar-cell-polarity signalling, and
    support single-cell transcriptomics and drug screening across genotypes.
  modeled_mechanisms:
  - target: Polycystin-2 loss at the renal primary cilium
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The organoids reproduce the ciliary phenotype in human patient-derived
      tissue, and IFT88 ablation selectively attenuates the downstream signalling
      in mutant backgrounds, which is direct support for cilium-dependent
      cystogenesis.
    limitations: >-
      Derived from surgical specimens of advanced disease, so they capture an
      established cystic phenotype rather than initiation; and single-cell
      transcriptomics showed genotype-specific differences between PKD1 and
      PKD2 organoids, so a PKD1-derived result should not be assumed to hold
      for PKD2.
    evidence:
    - reference: PMID:41946363
      reference_title: "Patient-derived kidney organoids recapitulate ADPKD and facilitate the identification of Rho pathway inhibitors as candidate therapeutics."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Patient-derived MAROs faithfully reproduced hallmark cystogenic
        features, including elongated primary cilia, polarity disruption, and
        elevated Rho GTPase/planar cell polarity (PCP) signaling.
      explanation: >-
        Establishes that the organoids reproduce the ciliary and polarity
        phenotype this node describes.
  evidence:
  - reference: PMID:41946363
    reference_title: "Patient-derived kidney organoids recapitulate ADPKD and facilitate the identification of Rho pathway inhibitors as candidate therapeutics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Single-cell transcriptomics of PKD1/PKD2-mutant organoids revealed
      genotype-specific alterations.
    explanation: >-
      Supports treating this as informative for PKD2 specifically rather than
      for ADPKD in aggregate, while also being the reason the fidelity caveat
      above is recorded.
discussions:
- discussion_id: pkd2_tolvaptan_transportability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Tolvaptan vasopressin V2 receptor antagonist therapy
  prompt: >-
    Does tolvaptan slow progression in PKD2-related ADPKD specifically, and which
    PKD2 patients meet a rapid-progression threshold that justifies it?
  rationale: >-
    The pivotal tolvaptan trial enrolled ADPKD patients and did not report a
    PKD2-stratified result. Because PKD2 progresses about two decades more slowly,
    the absolute benefit over a fixed treatment horizon could differ substantially
    from the ADPKD-wide estimate, and the rapid-progression criteria used to select
    candidates were calibrated on a largely PKD1 population. This is the single
    most consequential open question for managing a PKD2 patient today, and it is
    an evidence-transportability question rather than a mechanistic one.
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our PKD2 cohort, only 25 patients, including 12 patients younger than
      30 years, had a CKD stage and age class matching these criteria.
    explanation: >-
      Quantifies the gap PKD2-specifically: out of 293 patients, 25 met the
      rapid-progression criteria used to select tolvaptan candidates. This is
      the PKD2 datum the transportability question turns on, rather than an
      inference from the ADPKD-wide trial.
- discussion_id: pkd2_allelic_effect_reproducibility
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#PKD2
  prompt: >-
    Is there a reproducible PKD2 allelic effect on renal outcome, or is the
    within-genotype variance simply too large?
  rationale: >-
    The two largest PKD2 genotype-phenotype studies disagree. Genkyst reports
    truncating variants associated with lower age-adjusted eGFR; the earlier
    international cohort found no effect of mutation position and a modest
    advantage for splice-site variants. Both find large variability among
    individuals carrying the same variant, and Genkyst's intraclass analysis
    attributes 34.1% of eGFR variance to pedigree but only 7.1% to the shared
    variant - which suggests modifiers rather than allele identity dominate.
references:
- reference: PMID:20301424
  title: "Polycystic Kidney Disease, Autosomal Dominant."
  tags:
  - GeneReviews
notes: >-
  Scope. This entry is deliberately restricted to what is measured in
  PKD2-genotyped cohorts, with ADPKD-wide statements marked as such. The
  intracranial-aneurysm phenotype and the tolvaptan efficacy claim are both
  graded PARTIAL for exactly that reason: the underlying sources report them for
  ADPKD without stratifying by PKD1 versus PKD2, so treating them as measured
  PKD2 findings would overstate the evidence. Where a PKD2-specific number
  exists (prevalence, hypertension, flank pain, haematuria, cyst infection, age
  at ESRD) it is used in preference to the ADPKD-wide figure.

  Relationship to the parent entry. kb/disorders/Autosomal_Dominant_Polycystic_Kidney_Disease.yaml
  covers ADPKD at MONDO:0004691 and carries no has_subtypes block, so this entry
  does not duplicate a subtype row. The mechanism is intentionally shared - both
  entries conform to the renal_cystogenesis module - and the substance that is
  specific to this entry is the timing, the PKD2-specific frequencies, and the
  weak and contested allelic effects.

      label: intracellular calcium ion homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polycystin 2 (PC2), a 968-amino-acid protein, is encoded by PKD2 and
      belongs to the transient receptor potential family of calcium-regulated
      cation channels.
    explanation: >-
      Identifies the PKD2 gene product and its channel family.
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cytoplasmic carboxy-terminal coiled-coil domain of PC1 is known to
      interact with PC2; this interaction is determinant for PC1 maturation,
      trafficking to the cilia, and stability.
    explanation: >-
      Explains why loss of polycystin-2 degrades the whole ciliary complex and
      not only the channel, which is the mechanistic basis for PKD1 and PKD2
      converging on one disease.
  - reference: PMID:26877954
    reference_title: "Cyst growth, polycystins, and primary cilia in autosomal dominant polycystic kidney disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PC1 forms a complex with PC2 via their respective carboxy-terminal tails.
      Both proteins are expressed in the primary cilia. Mutations in either
      gene affect the normal architecture of renal tubules, giving rise to
      ADPKD.
    explanation: >-
      Independent mechanistic review linking the ciliary polycystin complex to
      renal tubular architecture.
  downstream:
  - target: Somatic second hit and clonal cyst initiation
    description: >-
      The germline allele sets a heterozygous background on which individual
      tubular cells can lose the remaining wild-type copy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11286938
      reference_title: "A \"two-hit\" model of cystogenesis in autosomal dominant polycystic kidney disease?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        these findings suggest that factor s in addition to the germline
        mutation of a polycystic kidney disease gene might be required for
        individual cyst formation
      explanation: >-
        Establishes that the germline variant alone is insufficient for focal
        cyst formation, which is the link from the germline node to the somatic
        one.
  - target: Cilium-dependent cAMP elevation in tubular epithelium
    description: >-
      Loss of the polycystin calcium signal disinhibits adenylate cyclase and
      raises intracellular cAMP in the mutant epithelium.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26877954
      reference_title: "Cyst growth, polycystins, and primary cilia in autosomal dominant polycystic kidney disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cilia-dependent, cyst-promoting pathway that is normally repressed by
        polycystin function.
      explanation: >-
        Supports disinhibition of a cyst-promoting signal as the step downstream
        of polycystin loss.
- name: Somatic second hit and clonal cyst initiation
  biological_scale: CELLULAR
  description: >-
    Cyst formation in PKD2 is focal and sporadic, not uniform across the nephron
    population, and the germline heterozygous state alone does not explain that.
    The conventional account is cellular-recessive: an individual tubular
    epithelial cell acquires a somatic inactivating hit on its remaining
    wild-type allele, loses polycystin function outright, and clonally expands
    into a cyst. This is what reconciles a dominant disease with a focal lesion,
    and it is also the most plausible explanation for the large variability
    between individuals carrying the same PKD2 variant.
  cell_types:
  - preferred_term: kidney epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:11286938
    reference_title: "A \"two-hit\" model of cystogenesis in autosomal dominant polycystic kidney disease?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      inactivation of both copies of a polycystic kidney disease gene by
      germline and somatic mutations within an epithelial cell provides growth
      advantages for it to proliferate clonally into a cyst
    explanation: >-
      States the two-hit model directly. Note the cited article frames the model
      as a question in its own title and closes by discussing the controversies
      around it, so this node is curated as the conventional account rather than
      as settled fact.
  - reference: PMID:11286938
    reference_title: "A \"two-hit\" model of cystogenesis in autosomal dominant polycystic kidney disease?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An intriguing feature of autosomal dominant polycystic kidney disease
      ADPKD is the focal and sporadic nature of individual cyst formation.
    explanation: >-
      Establishes the observation the two-hit model exists to explain - the
      focality that a purely dominant germline mechanism does not account for.
  downstream:
  - target: Cilium-dependent cAMP elevation in tubular epithelium
    description: >-
      A cell that has lost both polycystin alleles has no ciliary calcium
      signal at all, so the cAMP disinhibition below is complete in that clone
      rather than partial.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11286938
      reference_title: "A \"two-hit\" model of cystogenesis in autosomal dominant polycystic kidney disease?"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        provides growth advantages for it to proliferate clonally into a cyst
      explanation: >-
        Supports clonal proliferation as the consequence of biallelic
        inactivation. Graded PARTIAL because the source establishes the growth
        advantage without tracing it specifically through the cAMP node.
- name: Cilium-dependent cAMP elevation in tubular epithelium
  conforms_to: "renal_cystogenesis#cAMP and Vasopressin-V2R Signaling Activation"
  biological_scale: CELLULAR
  description: >-
    Reduced intracellular calcium disinhibits adenylate cyclase, and vasopressin
    V2 receptor signalling in the distal nephron and collecting duct amplifies
    the effect. The resulting rise in cAMP is the node that both proliferative
    and secretory arms of cystogenesis depend on, and it is the node tolvaptan
    is aimed at.
  cell_types:
  - preferred_term: kidney collecting duct epithelial cell
    term:
      id: CL:1000454
      label: kidney collecting duct epithelial cell
  biological_processes:
  - preferred_term: cAMP biosynthetic process
    term:
      id: GO:0006171
      label: cAMP biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:23121377
    reference_title: "Tolvaptan in patients with autosomal dominant polycystic kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preclinical studies indicated that vasopressin V(2)-receptor antagonists
      inhibit cyst growth and slow the decline of kidney function.
    explanation: >-
      Establishes vasopressin-V2R-driven cAMP as the therapeutically addressable
      node upstream of cyst growth.
  downstream:
  - target: Cyst epithelial proliferation and transepithelial fluid secretion
    description: >-
      Elevated cAMP simultaneously drives mural epithelial proliferation and
      cAMP-dependent chloride and fluid secretion into the cyst lumen.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23121377
      reference_title: "Tolvaptan in patients with autosomal dominant polycystic kidney disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Preclinical studies indicated that vasopressin V(2)-receptor antagonists
        inhibit cyst growth and slow the decline of kidney function.
      explanation: >-
        Blocking the cAMP drive inhibits cyst growth, which supports cAMP as
        causal for the proliferative and secretory cyst phenotype.
- name: Cyst epithelial proliferation and transepithelial fluid secretion
  conforms_to: "renal_cystogenesis#Cyst-Lining Epithelial Proliferation and Transepithelial Fluid Secretion"
  biological_scale: CELLULAR
  description: >-
    The cyst-lining epithelium proliferates and secretes chloride and water into
    the lumen, so individual cysts enlarge after they have detached from the
    parent nephron and are no longer fed by glomerular filtrate.

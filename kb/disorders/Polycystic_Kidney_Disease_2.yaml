  downstream:
  - target: Progressive cyst expansion and nephron loss
    description: >-
      Continued proliferation and secretion expand cysts, which compress and
      replace adjacent functioning parenchyma.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26877954
      reference_title: "Cyst growth, polycystins, and primary cilia in autosomal dominant polycystic kidney disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutations in either
        gene affect the normal architecture of renal tubules, giving rise to
        ADPKD.
      explanation: >-
        Links cyst formation to destruction of normal tubular architecture.
- name: Progressive cyst expansion and nephron loss
  conforms_to: "renal_cystogenesis#Nephron Loss and Progressive Kidney Failure"
  biological_scale: ORGANISM
  description: >-
    Cumulative cyst burden destroys functioning nephrons and kidney function
    declines. In PKD2 this trajectory is displaced roughly two decades later than
    in PKD1: at age 60 only about one PKD2 patient in ten has reached end-stage
    renal disease, and the Kaplan-Meier median age at ESRD is near 78 years.
  cell_types:
  - preferred_term: kidney epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At age 60 years, the cumulative probability of end-stage renal disease
      (ESRD) was 9.8% (95% CI, 5.2%-14.4%)
    explanation: >-
      Quantifies how far the PKD2 trajectory is displaced relative to PKD1.
  - reference: PMID:10023895
    reference_title: "Comparison of phenotypes of polycystic kidney disease types 1 and 2. European PKD1-PKD2 Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although PKD2 is clinically milder than PKD1, it has a deleterious impact
      on overall life expectancy and cannot be regarded as a benign disorder.
    explanation: >-
      Establishes that the later trajectory is a shift in timing, not an absence
      of disease - the interpretive point this node exists to carry.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous PKD2 germline variant is sufficient. Cyst formation is
    focal rather than affecting every nephron, which is conventionally explained
    by a somatic second hit or by polycystin dosage falling below a threshold in
    individual tubular cells.
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ADPKD is established in a proband with age-specific
      kidney imaging criteria and either an affected first-degree relative with
      ADPKD or a heterozygous pathogenic variant in PKD1, PKD2, or one of the
      less common associated genes
    explanation: >-
      GeneReviews establishes that a single heterozygous PKD2 variant is
      diagnostic, consistent with dominant inheritance.
pathophysiology:
- name: Polycystin-2 loss at the renal primary cilium
  conforms_to: "renal_cystogenesis#Polycystin and Primary Cilium Signaling Loss"
  biological_scale: MOLECULAR
  description: >-
    PKD2 encodes polycystin-2, a transient receptor potential family cation
    channel. Its carboxy-terminal coiled-coil interaction with polycystin-1 is
    required for polycystin-1 maturation, ciliary trafficking and stability, so
    a PKD2 loss-of-function allele degrades the whole ciliary receptor-channel
    complex rather than only the channel arm. This is why PKD2 and PKD1 produce
    the same disease.

    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although there was no sex influence on renal survival, men had lower
      kidney function than women.
    explanation: >-
      Supports the sex difference in kidney function noted in the description,
      and the fact that it does not translate into a renal-survival difference.
- category: Renal
  name: Urinary tract infection
  frequency: OCCASIONAL
  description: >-
    Urinary-tract infection is part of the ADPKD picture but is significantly
    less frequent in PKD2 than in PKD1 - odds ratio 0.50. The entry's own

name: Polycystic Kidney Disease 2
creation_date: "2026-08-28T12:00:00Z"
category: Mendelian
description: >-
  Polycystic kidney disease 2 (PKD2-related autosomal dominant polycystic kidney
  disease) is the polycystin-2 form of ADPKD. PKD2 encodes polycystin-2 (PC2,
  TRPP2), a 968-amino-acid transient receptor potential family cation channel
  that partners with polycystin-1 (PC1, encoded by PKD1) through their
  carboxy-terminal coiled-coil domains. That interaction is what allows PC1 to
  mature, traffic to the primary cilium, and remain stable there, so the two
  genes converge on one ciliary receptor-channel complex and cause the same
  disease.

  Because the complex is shared, the mechanism is shared: loss of polycystin
  function in kidney tubular epithelium removes the ciliary calcium signal that
  normally restrains adenylate cyclase, intracellular cAMP rises, and the mutant
  epithelium both proliferates and secretes chloride and fluid into the tubule
  lumen. Focal cysts detach from the nephron, expand, and progressively destroy
  the surrounding parenchyma.

  What separates PKD2 from PKD1 is not the mechanism but its pace. PKD2
  accounts for roughly 15% to 20% of mutation-positive ADPKD pedigrees and runs
  about two decades behind PKD1: median age at end-stage renal disease is near
  78 years in PKD2 against about 54 years in PKD1, and only about 10% of
  patients have reached ESRD by age 60. Hypertension, haematuria and
  urinary-tract infection are all less frequent than in PKD1. This is a
  difference of degree that matters clinically - it changes surveillance
  intervals, tolvaptan candidacy, and reproductive counselling - but it is not
  benignity. PKD2 still shortens life expectancy relative to unaffected
  controls, and an unusually early decline in a PKD2 patient should prompt a
  search for a concomitant nephropathy rather than being attributed to the
  PKD2 allele.

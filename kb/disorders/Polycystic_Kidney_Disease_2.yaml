    case_fraction_percent: 20.2
    notes: >-
      PKD2 share of mutation-positive pedigrees in a population-based cohort;
      the authors note this is slightly higher than previously reported and
      still likely an underestimate.
    evidence:
    - reference: PMID:28356211
      reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PKD2 pedigrees represented 20.2% of the 1,006 mutation-positive pedigrees
        registered in the Genkyst cohort as of March 2016.
      explanation: >-
        Directly quantifies the PKD2 share of mutation-positive ADPKD pedigrees.
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations to PKD1 account for the disease in 80% to 85% of
      mutation-positive pedigrees, whereas PKD2 mutations are identified in the
      remaining 15% to 20%.
    explanation: >-
      Establishes PKD2 as the second major ADPKD locus and quantifies its share.
  - reference: PMID:12707387
    reference_title: "Genotype-renal function correlation in type 2 autosomal dominant polycystic kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most (94%) of these mutations were predicted to be inactivating.
    explanation: >-
      Supports loss of function as the operative mechanism of PKD2 variants.
  notes: >-
    Heterozygous loss-of-function variants in PKD2, on chromosome 4q21, account
    for 15% to 20% of mutation-positive ADPKD pedigrees. In the Genkyst cohort
    83 distinct variants were seen across 203 pedigrees, spanning the whole
    coding region, and they were overwhelmingly truncating.

    Allelic effects within PKD2 are weak and inconsistently replicated. Genkyst
    found truncating variants associated with lower age-adjusted eGFR, while the
    earlier international cohort found no effect of mutation position and only a
    modest advantage for splice-site variants. Both studies agree that variability
    between individuals carrying the same PKD2 variant is large, so PKD2 genotype
    should not be used to predict an individual's renal trajectory.
biochemical:
- name: Estimated glomerular filtration rate
  notes: >-
    eGFR is the principal quantitative marker of PKD2 progression. Genkyst used
    the CKD-EPI creatinine equation with a square-root transformation for
    regression.
  evidence:
  - reference: PMID:28356211
    reference_title: "PKD2-Related Autosomal Dominant Polycystic Kidney Disease: Prevalence, Clinical Presentation, Mutation Spectrum, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nontruncating mutations (n=36) were associated with higher age-adjusted
      estimated glomerular filtration rates.
    explanation: >-
      Establishes age-adjusted eGFR as the quantitative outcome measure used to
      test genotype effects in PKD2.
treatments:
- name: Tolvaptan vasopressin V2 receptor antagonist therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Tolvaptan is the only disease-modifying pharmacotherapy for ADPKD, approved
    for adults at high risk of rapid progression. Its relevance to PKD2 is
    conditional rather than automatic: because most PKD2 patients progress
    slowly, comparatively few meet rapid-progression criteria, and the pivotal
    trial was not powered to report a PKD2 subgroup.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tolvaptan
      term:
        id: CHEBI:32246
        label: tolvaptan
  target_phenotypes:
  - preferred_term: Renal cyst
    term:
      id: HP:0000107
      label: Renal cyst
  - preferred_term: Decreased glomerular filtration rate
    term:
      id: HP:0012213
      label: Decreased glomerular filtration rate
  target_mechanisms:
  - target: Cilium-dependent cAMP elevation in tubular epithelium
    treatment_effect: INHIBITS
    description: >-
      V2 receptor antagonism lowers the cAMP drive that sustains cyst epithelial
      proliferation and secretion.
    evidence:
    - reference: PMID:23121377
      reference_title: "Tolvaptan in patients with autosomal dominant polycystic kidney disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Preclinical studies indicated that vasopressin V(2)-receptor antagonists
        inhibit cyst growth and slow the decline of kidney function.
      explanation: >-
        Mechanistic rationale for tolvaptan acting on the cAMP node.
  evidence:
  - reference: PMID:23121377
    reference_title: "Tolvaptan in patients with autosomal dominant polycystic kidney disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tolvaptan, as compared with placebo, slowed the increase in total kidney
      volume and the decline in kidney function over a 3-year period in patients
      with ADPKD
    explanation: >-
      TEMPO 3:4 establishes efficacy in ADPKD. Graded PARTIAL for this entry
      because the trial enrolled ADPKD patients without reporting a PKD2-specific
      subgroup, so its applicability to PKD2 is by extension rather than direct
      measurement.
- name: Blood pressure control and dietary sodium restriction
  therapeutic_modality: BEHAVIORAL
  description: >-
    Blood pressure control and moderate sodium restriction are the mainstay of
    conservative management. Given the high cumulative incidence of hypertension
    in PKD2 (about 75% by age 60), this applies to most patients even though
    hypertension arrives later than in PKD1.
  treatment_term:
    preferred_term: dietary sodium intake avoidance
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_phenotypes:
  - preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:40126492
    reference_title: "Autosomal Dominant Polycystic Kidney Disease: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dietary sodium restriction (<2000 mg/d)"
    explanation: >-
      Supports sodium restriction as a management component in ADPKD.
- name: Kidney replacement therapy
  therapeutic_modality: SURGERY
  description: >-
    Dialysis and kidney transplantation are the treatment for end-stage renal
    disease. In PKD2 this need typically arises in the eighth decade, so many
    patients die of other causes before requiring it.
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_phenotypes:
  - preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ESKD is treated with dialysis and transplantation.
    explanation: >-
      GeneReviews states the standard treatment for end-stage kidney disease in
      ADPKD.
- name: Genetic counselling and at-risk family testing
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal dominant transmission gives each child a 50% risk. Counselling in
    PKD2 has to convey a specific and easily miscommunicated point: a much later
    expected onset than PKD1, but not an absence of risk.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:10023895
    reference_title: "Comparison of phenotypes of polycystic kidney disease types 1 and 2. European PKD1-PKD2 Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although PKD2 is clinically milder than PKD1, it has a deleterious impact
      on overall life expectancy and cannot be regarded as a benign disorder.
    explanation: >-
      Directly supports the counselling message that PKD2 is milder but not
      benign.
discussions:
- discussion_id: pkd2_tolvaptan_transportability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Tolvaptan vasopressin V2 receptor antagonist therapy
  prompt: >-
    Does tolvaptan slow progression in PKD2-related ADPKD specifically, and which
    PKD2 patients meet a rapid-progression threshold that justifies it?
  rationale: >-
    The pivotal tolvaptan trial enrolled ADPKD patients and did not report a
    PKD2-stratified result. Because PKD2 progresses about two decades more slowly,
    the absolute benefit over a fixed treatment horizon could differ substantially
    from the ADPKD-wide estimate, and the rapid-progression criteria used to select
    candidates were calibrated on a largely PKD1 population. This is the single
    most consequential open question for managing a PKD2 patient today, and it is
    an evidence-transportability question rather than a mechanistic one.
- discussion_id: pkd2_allelic_effect_reproducibility
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#PKD2
  prompt: >-
    Is there a reproducible PKD2 allelic effect on renal outcome, or is the
    within-genotype variance simply too large?
  rationale: >-
    The two largest PKD2 genotype-phenotype studies disagree. Genkyst reports
    truncating variants associated with lower age-adjusted eGFR; the earlier
    international cohort found no effect of mutation position and a modest
    advantage for splice-site variants. Both find large variability among
    individuals carrying the same variant, and Genkyst's intraclass analysis
    attributes 34.1% of eGFR variance to pedigree but only 7.1% to the shared
    variant - which suggests modifiers rather than allele identity dominate.
references:
- reference: PMID:20301424
  title: "Polycystic Kidney Disease, Autosomal Dominant."
  tags:
  - GeneReviews
notes: >-
  Scope. This entry is deliberately restricted to what is measured in
  PKD2-genotyped cohorts, with ADPKD-wide statements marked as such. The
  intracranial-aneurysm phenotype and the tolvaptan efficacy claim are both
  graded PARTIAL for exactly that reason: the underlying sources report them for
  ADPKD without stratifying by PKD1 versus PKD2, so treating them as measured
  PKD2 findings would overstate the evidence. Where a PKD2-specific number
  exists (prevalence, hypertension, flank pain, haematuria, cyst infection, age
  at ESRD) it is used in preference to the ADPKD-wide figure.

  Relationship to the parent entry. kb/disorders/Autosomal_Dominant_Polycystic_Kidney_Disease.yaml
  covers ADPKD at MONDO:0004691 and carries no has_subtypes block, so this entry
  does not duplicate a subtype row. The mechanism is intentionally shared - both
  entries conform to the renal_cystogenesis module - and the substance that is
  specific to this entry is the timing, the PKD2-specific frequencies, and the
  weak and contested allelic effects.

  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ocular involvement in MMP commonly presents with symptoms of any non-specific chronic conjunctival inflammation."
    explanation: Guideline description of the presenting ocular phenotype.
  - reference: PMID:32905166
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "characterized by a chronic bilateral conjunctivitis with relapsing-remitting periods"
    explanation: Review characterizing ocular cicatricial pemphigoid as chronic bilateral conjunctivitis.
- name: Conjunctival Subepithelial Fibrosis
  category: Ocular
  subtype: Ocular MMP
  phenotype_term:
    preferred_term: conjunctival subepithelial fibrosis
    term:

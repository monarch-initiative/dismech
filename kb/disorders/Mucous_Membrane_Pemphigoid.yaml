  - reference: PMID:16862049
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five (13%) had acute dyspnea."
    explanation: Acute dyspnoea occurred in 13% of patients with nose-and-throat symptoms.
- name: Esophageal Stricture

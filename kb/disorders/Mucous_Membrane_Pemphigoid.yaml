    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For severe MMP, dapsone and oral or intravenous cyclophosphamide and/or oral corticosteroids are recommended as first-line regimens."
    explanation: Guideline first-line regimen for severe MMP.

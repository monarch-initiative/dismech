    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Desquamative gingivitis ranges from localized gingival erythema to generalized inflammation with blistering or ulceration."
    explanation: Describes desquamative gingivitis as a presentation of oral MMP.
- name: Chronic Conjunctivitis
  category: Ocular
  description: >-
    Ocular MMP presents as non-specific chronic conjunctival inflammation,

  - reference: PMID:32905166
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Without therapy 75% of the cases develop visual loss due to major ocular complications (e.g. severe dry-eye syndrome, corneal erosions, corneal keratinization, entropion, symblepharon)."
    explanation: Lists entropion among the major ocular complications.
- name: Trichiasis
  category: Ocular
  subtype: Ocular MMP
  phenotype_term:
    preferred_term: trichiasis
    term:
      id: HP:0001128
      label: Trichiasis
  evidence:
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Eyelid malposition, symblepharon and trichiasis eventually develop and, together with secondary dry eye, chronic limbitis and subsequent limbal stem cell failure, contribute to keratopathy."
    explanation: Trichiasis develops as a cicatricial complication of ocular MMP.
- name: Dry Eye
  category: Ocular
  description: >-
    Scarring destroys lacrimal gland ductules and meibomian gland orifices,
    impairing both aqueous and lipid components of the tear film.
  subtype: Ocular MMP
  phenotype_term:
    preferred_term: secondary dry eye
    term:
      id: HP:0001097
      label: Keratoconjunctivitis sicca
  evidence:
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Untreated, ocular involvement in MMP eventually destroys the lacrimal gland ductules and meibomian gland orifices, impairing both the aqueous and the oily constituents of the tear film, resulting in secondary dry eye."
    explanation: Explains dry eye as a scarring consequence of ocular MMP.
- name: Blindness
  category: Ocular
  description: >-
    Progressive conjunctival and corneal scarring can end in blindness. Older
    age, bilateral ocular disease at presentation and scarring ocular lesions
    are associated with this outcome, although unilateral non-scarring
    presentations can still progress.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: blindness
    term:
      id: HP:0000618
      label: Blindness
  evidence:
  - reference: PMID:36630148
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "of whom 56 (46.3%) followed a refractory course and 13 (10.7%) developed blindness."
    explanation: Retrospective two-centre cohort (all MMP, not only ocular) with 10.7% progressing to blindness, supporting the OCCASIONAL band.
  - reference: PMID:36630148
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Development of blindness was associated with older age (≥68 years; OR, 6.38; 95% CI, 1.35-30.16; P = .009), initial presentation with bilateral ocular involvement (OR, 7.92; 95% CI, 2.04-30.68; P = .001), and scarring ocular lesions"
    explanation: Identifies clinical risk factors for blindness.
- name: Nasal Involvement
  category: Respiratory
  description: >-
    Nose and throat involvement occurs in at least a third of patients; atrophic
    rhinitis with crusting is the commonest lesion.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: atrophic rhinitis
    term:
      id: HP:0002257
      label: Chronic rhinitis
  evidence:
  - reference: PMID:16862049
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, at least 35% of MMP patients had NT involvement. Atrophic rhinitis was the most frequent lesion."
    explanation: Prospective study of 110 consecutive patients; 35% had nose-and-throat involvement, with atrophic rhinitis the most frequent lesion.
  - reference: PMID:16862049
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-three (87%) of the 38 symptomatic patients had lesions at physical examination: 30 (79%) nasal"
    explanation: Nasal lesions were found in 30 of the 110 patients (about 27%), supporting the OCCASIONAL band; this is a lower bound because only symptomatic patients were examined.
- name: Laryngeal Stenosis
  category: Respiratory
  description: >-
    Laryngeal scarring can cause severe, potentially fatal airway obstruction
    and may require tracheostomy. It is associated with severe ocular and
    multisite disease and is frequent in anti-laminin 332 MMP.
  phenotype_term:
    preferred_term: laryngeal stenosis
    term:
      id: HP:0001602
      label: Laryngeal stenosis
  evidence:
  - reference: PMID:16862049
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nasal valves, choanae, pharynx, and/or larynx were severely scarred in 7 (18%) patients, causing the death of 3."
    explanation: Severe upper airway scarring occurred in 18% of symptomatic patients and was fatal in three.
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Laryngeal involvement can result in severe laryngeal obstruction and become life-threatening, in severe cases sometimes requiring surgical interventions."
    explanation: Guideline synthesis on laryngeal obstruction.

  evidence:
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Conjunctiva: hyperaemia of bulbar and tarsal conjunctiva, limbitis, loss of plica semilunaris, subepithelial fibrosis, occlusion of lacrimal ductules, fornix shortening, symblepharon"
    explanation: The guideline's table of ocular signs lists fornix shortening.
- name: Symblepharon

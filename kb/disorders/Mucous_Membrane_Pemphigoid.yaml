    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "By the time of diagnosis or referral to a tertiary centre, most patients have moderate to severe conjunctival inflammation, with advanced cicatrizing disease and symblepharon formation"
    explanation: Symblepharon is typically already present at diagnosis of ocular MMP.
- name: Entropion
  category: Ocular

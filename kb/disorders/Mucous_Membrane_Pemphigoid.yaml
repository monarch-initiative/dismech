    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In Brunsting-Perry pemphigoid, a variant of MMP, skin lesions present mainly on the head and the neck region consisting of crusts, erosions, blisters and atrophic scars."
    explanation: Describes cutaneous blistering in the Brunsting-Perry variant of MMP.
- name: Associated Solid Malignancy
  category: Neoplasm
  description: >-
    Anti-laminin 332 MMP carries an increased risk of cancer, mostly solid
    tumours, often diagnosed within about a year of MMP onset; guidelines
    recommend testing all MMP patients for anti-laminin 332 reactivity. The
    direction of causality (paraneoplastic autoimmunity versus shared
    susceptibility) is not established.
  subtype: Anti-laminin 332 MMP
  phenotype_term:
    preferred_term: solid malignancy
    term:
      id: HP:0002664
      label: Neoplasm
    coarse_binding_basis: SOURCE_UNSPECIFIED
  evidence:
  - reference: PMID:11410196
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten patients in this cohort had solitary solid cancers; eight patients developed cancer after onset of AECP (seven within 14 months). The relative risk (RR) for cancer in this cohort was 6.8 (95% confidence intervals [CI]: 3.3-12.5)."
    explanation: Cohort of 35 anti-epiligrin (anti-laminin 332) patients compared with SEER rates shows a relative risk of 6.8 for cancer.
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In 25-30% of MMP patients with anti-laminin 332 reactivity, malignancies have been associated."
    explanation: Guideline estimate of the proportion of anti-laminin 332 MMP with malignancy.
  - reference: PMID:23426192
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-Lam332 autoantibodies are mainly detected in patients with severe MMP but not preferentially in those with a malignant neoplasm."
    explanation: In a 154-patient French series, anti-laminin 332 positivity by a new ELISA was not enriched in patients with malignancy, contradicting the association.
genetic:
- name: HLA-DQB1*03:01 Susceptibility
  gene_term:
    preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  relationship_type: SUSCEPTIBILITY
  association: >-
    HLA-DQB1*03:01 is the most consistently replicated susceptibility allele in
    MMP, with a stronger effect than in bullous pemphigoid.
  notes: >-
    Susceptibility genetics only. COL17A1, LAMA3, LAMB3, LAMC2, DST, ITGB4,
    ITGA6 and COL7A1 are autoantigen genes, curated on the autoantibody
    pathophysiology node; germline variants in them cause epidermolysis
    bullosa, a different disease.
  evidence:
  - reference: PMID:11531829
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DQB1*0301 allele confers a predisposition to all subgroups of MMP"
    explanation: Case-control HLA typing of 131 British Caucasian patients.
  - reference: PMID:39442009
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the risk conferred by the DQB1*0301 was significantly higher in MMP"
    explanation: Meta-analysis confirms DQB1*0301 as a stronger risk allele in MMP than in bullous pemphigoid.
- name: HLA-DRB1*11 Susceptibility
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  association: >-
    DRB1*11 allele frequency is increased in MMP and forms a risk haplotype with
    DQB1*03:01.
  evidence:
  - reference: PMID:11531829
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Class II DRB1 typing showed a significantly increased allelic frequency in MMP vs. controls for DRB1*11 (RR = 2.08, Pc < 0.0000056)."
    explanation: Case-control HLA typing shows DRB1*11 enrichment in MMP.
environmental:
- name: Dipeptidyl Peptidase-4 Inhibitor (Gliptin) Exposure
  description: >-
    In a French cohort of 313 MMP patients, 24 were taking a gliptin for type 2
    diabetes and 17 had an onset interval suggestive of or compatible with drug
    induction (vildagliptin, sitagliptin or saxagliptin). Gliptin-associated
    MMP had more cutaneous and less oral involvement, no IgA
    basement-membrane labelling and no anti-laminin 332 reactivity, and
    remitted more often after drug withdrawal.
  notes: >-
    exposure_term left unbound. `runoak -i sqlite:obo:ecto info "l~dipeptidyl"`
    returned only ECTO:9002035 and ECTO:0900275 (exposure to EC 3.4.14.2
    dipeptidyl-peptidase II inhibitor), a different enzyme class;
    `l~EC 3.4.14.5` returned only CHEBI:68612 with no ECTO exposure term;
    `l~gliptin` returned ECTO:9000698 exposure to sitagliptin, which names only
    one of the three gliptins implicated; `l~vildagliptin` returned nothing.
  influences_mechanisms:
  - target: Anti-Basement Membrane Zone Autoantibody Production
    environmental_effect: TRIGGERS
    causal_link_type: UNKNOWN
    description: Gliptin exposure is judged the probable trigger of autoantibody-mediated MMP in a subset of treated diabetic patients.
    evidence:
    - reference: PMID:29881377
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results strongly suggest that gliptins are probably responsible for some MMPs."
      explanation: Pharmacovigilance-style accountability scoring (dechallenge, rechallenge) in a 313-patient cohort implicates gliptins as triggers.
  evidence:
  - reference: PMID:29881377
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "17 out of 24 gliptin-treated diabetic MMP patients had suggestive (≤12 weeks) or compatible challenges. Complete remission at 1 year of follow-up was more frequent in the 11 dechallenged patients."
    explanation: Temporal association and better outcome after withdrawal support drug induction.
  - reference: PMID:29881377
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple autoantibody-target antigens/epitopes (BP180-NC16A, BP180 mid- and C-terminal parts, integrin α6β4) could be detected, but not laminin 332."
    explanation: Gliptin-associated cases have a distinct autoantibody profile lacking anti-laminin 332.
diagnosis:
- name: Direct Immunofluorescence of Perilesional Mucosa or Skin
  description: >-
    The diagnostic reference standard, showing linear deposition of IgG, IgA
    and/or C3 along the basement membrane zone in a perilesional biopsy. A
    negative result does not exclude ocular MMP.
  diagnosis_term:
    preferred_term: direct immunofluorescence microscopy
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
    qualifiers:
    - predicate:
        preferred_term: diagnostic procedure
        term:
          id: NCIT:C18020
          label: Diagnostic Procedure
      value:
        preferred_term: direct immunofluorescence
        term:
          id: NCIT:C17370
          label: Fluorescent Antibody Procedure
  results: Linear IgG, IgA and/or C3 along the epithelial basement membrane zone.
  evidence:
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Direct immunofluorescence microscopy to detect tissue-bound IgG, IgA and/or complement C3, combined with serological testing for circulating autoantibodies are recommended."
    explanation: S3 guideline diagnostic recommendation.
  - reference: PMID:32905166
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Conjunctival biopsy with direct immunofluorescence is the gold standard in diagnosis confirmation, but up to 40% of the patients have a negative biopsy result that does not rule out the diagnosis."
    explanation: Limitation of direct immunofluorescence in ocular disease.
- name: Serum Anti-Laminin 332 Autoantibody Testing
  description: >-
    Serological testing for circulating autoantibodies by indirect
    immunofluorescence on salt-split skin, ELISA or immunoblotting. Testing for
    anti-laminin 332 reactivity identifies the subtype that warrants a
    malignancy search.
  diagnosis_term:
    preferred_term: serum autoantibody testing
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Circulating IgG and/or IgA against BP180, laminin 332, BP230, type VII collagen or integrin alpha6beta4, usually at low titre.
  evidence:
  - reference: PMID:34995762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Assaying for anti-laminin 332 reactivity is pivotal, since in about a quarter of patients with anti-laminin 332 MMP, a malignancy, mainly solid cancers, is associated."
    explanation: Rationale for routine anti-laminin 332 testing.
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In most patients, serum autoantibodies are present only in low levels and in variable proportions, depending on the clinical sites involved."
    explanation: Circulating autoantibodies are typically low-titre.
treatments:
- name: Topical Corticosteroids
  description: >-
    Superpotent topical corticosteroids such as clobetasol propionate are
    first-line, alone or with systemic therapy, for mild or moderate oral and
    genital disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: topical corticosteroid therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clobetasol propionate
      term:
        id: CHEBI:31414
        label: clobetasol propionate
  evidence:
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Topical steroids, particularly the superpotent clobetasol propionate, can lead to remission."
    explanation: Guideline statement on topical clobetasol.
- name: Dapsone
  description: >-
    Anti-inflammatory sulfone regarded as first-choice therapy for mild or
    moderate MMP and combined with other agents in severe disease. G6PD
    activity must be checked before starting, because deficiency increases the
    risk of haemolytic anaemia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dapsone
      term:
        id: CHEBI:4325
        label: dapsone
  evidence:
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Due to its anti-inflammatory properties, dapsone is regarded as a first-choice treatment for mild/moderate MMP."
    explanation: Guideline first-line recommendation.
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prior to initiation of therapy, the patient's glucose-6-phosphate dehydrogenase (G6PD) level should be checked to be normal, since low levels are associated with a higher incidence of haemolytic anaemia."
    explanation: Safety requirement before dapsone therapy.
  - reference: PMID:31356420
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Response rates were 100%, 100%, 86%, 85%, and 80% for intravenous immunoglobulin, mycophenolate mofetil, rituximab, dapsone, and cyclophosphamide, respectively."
    explanation: Small ocular cohort (17 patients, 62 drug exposures) reporting per-drug response rates, including 85% for dapsone.
- name: Tetracyclines
  description: >-
    Tetracyclines, with anti-inflammatory and anti-collagenolytic activity, are
    a first-line option for mild or moderate MMP, often with topical
    corticosteroids.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tetracycline
      term:
        id: CHEBI:27902
        label: tetracycline
  evidence:
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "As first-line treatment of mild/moderate MMP, dapsone, methotrexate or tetracyclines and/or topical corticosteroids are recommended."
    explanation: Guideline first-line options for mild or moderate MMP.
- name: Methotrexate
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

pathophysiology:
- name: HLA Class II-Associated Loss of Tolerance to Basement Membrane Antigens
  description: >-
    Susceptibility is linked to HLA class II, most consistently HLA-DQB1*03:01,
    which is enriched across all clinical subgroups of MMP and in patients with
    circulating anti-basement-membrane IgG. The allele is thought to shape T-cell
    recognition of basement membrane zone antigens that then provides help for
    autoantibody production.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  genes:
  - preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
    term:
      id: GO:0002495
      label: antigen processing and presentation of peptide antigen via MHC class II
  downstream:
  - target: Anti-Basement Membrane Zone Autoantibody Production
    description: HLA-DQB1*03:01 carriage is associated with circulating anti-BMZ IgG, consistent with T-cell help for autoantibody production.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:11531829
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The DQB1*0301 allele confers a predisposition to all subgroups of MMP and may have a role in T-cell recognition of basement membrane antigens, resulting in the production of anti-BMZ IgG autoantibodies."
      explanation: The authors infer from the allele's enrichment in anti-BMZ IgG-positive patients that it acts through T-cell recognition leading to autoantibody production; this is an association-based inference, not a demonstrated mechanism.
  evidence:
  - reference: PMID:11531829
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For DQB1, MMP vs. controls, there was a significantly increased allelic frequency for DQB1*0301 (Pc < 0.00000028) in both males and females"
    explanation: Case-control HLA typing of 131 British patients shows DQB1*0301 enrichment in MMP.
  - reference: PMID:39442009
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the risk conferred by the DQB1*0301 was significantly higher in MMP"
    explanation: Meta-analysis finds DQB1*0301 confers greater pemphigoid risk in MMP than in bullous pemphigoid (the abstract reports a pooled OR of 5.25 for MMP).
- name: Anti-Basement Membrane Zone Autoantibody Production
  description: >-
    B cells and plasma cells produce IgG and/or IgA autoantibodies against
    components of the epithelial anchoring complex: the C-terminal region of
    BP180/type XVII collagen (about 75-80% of patients), laminin 332 (10-25%),
    BP230 (mostly with another antigen), integrin alpha6beta4, and rarely type
    VII collagen. Autoantibody targets differ from bullous pemphigoid, where
    the NC16A domain of BP180 is immunodominant.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell

    snippet: "For severe MMP, dapsone and oral or intravenous cyclophosphamide and/or oral corticosteroids are recommended as first-line regimens."
    explanation: Oral corticosteroids are part of first-line regimens for severe MMP.
- name: Mycophenolate Mofetil
  description: >-
    Inhibitor of de novo guanosine nucleotide synthesis used as a
    steroid-sparing immunosuppressant, particularly in ocular MMP.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  evidence:
  - reference: PMID:31356420
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Response rates were 100%, 100%, 86%, 85%, and 80% for intravenous immunoglobulin, mycophenolate mofetil, rituximab, dapsone, and cyclophosphamide, respectively."
    explanation: All six mycophenolate exposures in a small ocular cohort responded.
  - reference: PMID:32905166
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "more severe cases require immunosuppressant therapy with azathioprine, mycophenolate mofetil, methotrexate or cyclosporine."
    explanation: Review places mycophenolate among immunosuppressants for more severe ocular disease.
- name: Rituximab
  description: >-
    Anti-CD20 B-cell depletion for severe or refractory MMP, typically with
    dapsone or sulfasalazine and without other systemic immunosuppressants.
    Complete remission is slower than in pemphigus and relapse is common.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Anti-Basement Membrane Zone Autoantibody Production
    treatment_effect: INHIBITS
    description: CD20+ B-cell depletion removes the precursors of autoantibody-secreting plasma cells.
    evidence:
    - reference: PMID:34309078
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Rituximab is a chimeric monoclonal antibody directed against CD20, which is a cell surface marker expressed by B cells."
      explanation: States the B-cell target of rituximab; the reduction of autoantibody production is inferred from this mechanism rather than measured in the quote.
  evidence:
  - reference: PMID:21422323
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete responses in all affected sites (ocular and/or extraocular) were obtained in 17 patients (68%) by a median time of 12 weeks after the first cycle, and 5 additional patients responded completely after a second cycle, yielding an 88% complete response rate."
    explanation: Open case series of 25 patients with severe refractory MMP.
  - reference: PMID:21422323
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The occurrence of severe infections in patients receiving concomitant conventional immunosuppressants supports using rituximab without other immunosuppressants."
    explanation: Two infection deaths occurred with concomitant immunosuppression, informing the monotherapy approach.
  - reference: PMID:35844526
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This large study confirms that RTX is an effective therapy in patients with severe and/or refractory MMP"
    explanation: Retrospective single-centre study of 109 patients with a median 51-month follow-up.
  - reference: PMID:35844526
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Relapse occurred in 38.7% of cases, of whom 91.7% had achieved CR again at the last follow-up."
    explanation: Quantifies relapse after rituximab-induced remission.
- name: Intravenous Immunoglobulin
  description: >-
    IVIg (typically 2 g/kg over 2-4 days monthly) is used when conventional
    therapy is contraindicated or disease progresses despite it; cost is the
    main limitation. In the anti-laminin 332 mouse model it dampens neutrophil
    activation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Neutrophil Recruitment via the LTB4-BLT1 Axis
    treatment_effect: INHIBITS
    description: IVIg inhibits immune-complex activation of neutrophils and their release of ROS and LTB4.
    evidence:
    - reference: PMID:38692406
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This includes a direct, immediate inhibitory effect on neutrophil activation by immune complexes but not C5a, which blunts the release of ROS and leukotriene B4 from neutrophils."
      explanation: Mechanistic work in the anti-laminin 332 mouse model shows IVIg suppresses neutrophil activation and LTB4 release.
  evidence:
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "IVIg are used when conventional therapies are contraindicated, or when the disease is progressive despite conventional systemic therapies."
    explanation: Guideline positioning of IVIg.
  - reference: PMID:38692406
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We have examined the effect of IVIg in a mouse model of anti-laminin 332 mucous membrane pemphigoid and found that IVIg ameliorates both cutaneous and mucosal inflammatory lesions."
    explanation: IVIg improves lesions in the experimental model.
discussions:
- discussion_id: mmp_unexplained_site_phenotypes
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Chronic Conjunctivitis
  - phenotypes#Nasal Involvement
  - phenotypes#Dysphonia
  - phenotypes#Dyspnea
  - phenotypes#Dysphagia
  - phenotypes#Genital Mucosal Lesions
  - phenotypes#Entropion
  - phenotypes#Trichiasis
  - phenotypes#Dry Eye
  - phenotypes#Conjunctival Fornix Foreshortening
  - phenotypes#Esophageal Web
  - phenotypes#Associated Solid Malignancy
  prompt: >-
    Which mechanism nodes produce the site-specific phenotypes of MMP (chronic
    conjunctival inflammation, atrophic rhinitis, laryngeal and oesophageal
    symptoms, eyelid malposition, dry eye), and what links anti-laminin 332
    autoimmunity to malignancy?
  rationale: >-
    The cited sources describe these as manifestations of involvement at each
    site but do not state the mechanistic step (blistering, inflammation or
    scarring) that produces each one, so they are left without causal edges.
    Experimental work is concentrated on the anti-laminin 332 passive-transfer
    mouse model and on cultured conjunctival fibroblasts; the BP180-dominant
    form that most patients have lacks an equivalent model. Whether malignancy
    in anti-laminin 332 MMP is paraneoplastic, and whether the association
    holds at all, is contested (PMID:11410196 versus PMID:23426192).

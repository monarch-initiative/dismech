  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Oesophageal webs are thought to represent an early stage of the disease, whereas oesophageal strictures are more likely to represent a more advanced stage, secondary to scarring with fibrosis."

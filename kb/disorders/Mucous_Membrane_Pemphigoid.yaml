  evidence:
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Conjunctiva: hyperaemia of bulbar and tarsal conjunctiva, limbitis, loss of plica semilunaris, subepithelial fibrosis, occlusion of lacrimal ductules, fornix shortening, symblepharon, ankyloblepharon, entropion, trichiasis."
    explanation: The guideline's table of ocular signs lists subepithelial fibrosis.
  - reference: PMID:31356420
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corneal involvement was diagnosed in 30 of 34 eyes, and 22 of 34 eyes had progressive fibrosing conjunctival involvement."
    explanation: In a 17-patient ocular cohort, most eyes had progressive conjunctival fibrosis.
- name: Conjunctival Fornix Foreshortening
  category: Ocular
  subtype: Ocular MMP
  phenotype_term:
    preferred_term: conjunctival fornix foreshortening
    term:

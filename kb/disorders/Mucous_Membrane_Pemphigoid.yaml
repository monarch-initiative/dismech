name: Mucous Membrane Pemphigoid
creation_date: "2026-09-25T10:34:21Z"
description: >-
  Mucous membrane pemphigoid (MMP) is a heterogeneous group of chronic
  autoantibody-mediated subepithelial blistering diseases defined by
  predominant involvement of mucous membranes and a tendency to heal with
  scarring. IgG and/or IgA autoantibodies target structural proteins of the
  epithelial basement membrane zone - principally the C-terminal portion of
  BP180 (type XVII collagen, COL17A1), and less often laminin 332
  (LAMA3/LAMB3/LAMC2), BP230, integrin alpha6beta4 and type VII collagen.
  Autoantibody binding engages Fc-gamma receptors and complement, recruits
  neutrophils and separates the epithelium from the underlying stroma. In
  contrast to bullous pemphigoid, lesions outside the mouth heal with
  fibrosis driven by persistently activated profibrotic fibroblasts, so that
  conjunctival scarring can progress to blindness and laryngeal, nasal and
  oesophageal scarring to airway obstruction, stricture and death. The oral
  mucosa is the commonest site. Anti-laminin 332 MMP is associated with solid
  malignancy in about a quarter of patients. Treatment is systemic and
  site-tailored: dapsone, methotrexate, tetracyclines and topical
  corticosteroids for mild or moderate disease, and cyclophosphamide,
  systemic corticosteroids, rituximab or intravenous immunoglobulin for severe
  or refractory disease.
category: Autoimmune
parents:
- Dermatological Disease
- Autoimmune Disease
synonyms:
- cicatricial pemphigoid
- benign mucous membrane pemphigoid
- mucosal pemphigoid
- mucosynechial pemphigoid
- MMP
disease_term:
  preferred_term: mucous membrane pemphigoid
  term:
    id: MONDO:0018746
    label: mucous membrane pemphigoid
notes: >-
  No GeneReviews chapter exists for this acquired autoimmune disease. The
  primary baseline sources are the First International Consensus
  (PMID:11902988, cited in references; its cached abstract describes the
  consensus process only and carries no quotable clinical finding) and the
  2021 EADV S3 guideline (PMID:34245180, PMID:34309078).
has_subtypes:
- name: Ocular MMP
  display_name: Ocular mucous membrane pemphigoid (ocular cicatricial pemphigoid)
  description: >-
    MMP with conjunctival involvement, either isolated (pure ocular MMP) or as
    part of multisite disease. Chronic conjunctival inflammation causes
    subepithelial fibrosis, fornix foreshortening, symblepharon, entropion,
    trichiasis, secondary dry eye and limbal stem-cell failure, and can end in
    corneal keratinization and blindness. About half of ocular cases cannot be
    confirmed by basement-membrane autoantibody tests.
  subtype_term:
    preferred_term: ocular cicatricial pemphigoid
    term:
      id: MONDO:0008109
      label: ocular cicatricial pemphigoid
  evidence:
  - reference: PMID:32905166
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular cicatricial pemphigoid is a particular form of mucous membrane pemphigoid and it is characterized by a chronic bilateral conjunctivitis with relapsing-remitting periods."
    explanation: Defines ocular cicatricial pemphigoid as a form of MMP with chronic conjunctivitis.
  - reference: PMID:27193492
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Integrin β4 was considered to be the major and specific autoantigen for pure OMMP."
    explanation: In 43 pure ocular MMP sera, integrin beta4 was the dominant autoantigen, distinguishing the serological profile of this subtype.
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 50% of cases of ocular MMP cannot be confirmed by BMZ autoantibody detection tests."
    explanation: The S3 guideline records the diagnostic limitation specific to the ocular subtype.
- name: Anti-laminin 332 MMP
  display_name: Anti-laminin 332 mucous membrane pemphigoid (anti-epiligrin cicatricial pemphigoid)
  description: >-
    MMP with circulating autoantibodies against laminin 332 (formerly
    epiligrin/laminin 5), found in roughly 10-25% of patients. Clinically it
    resembles other MMP and is distinguished only serologically; patients
    frequently have severe multisite disease, and about a quarter have an
    associated, mainly solid, malignancy. No MONDO class exists for this
    serological subtype, so no subtype_term is bound; the genes listed encode
    the laminin 332 autoantigen chains and are not inherited disease genes.
  genes:
  - preferred_term: LAMA3
    term:
      id: hgnc:6483
      label: LAMA3
  - preferred_term: LAMB3
    term:
      id: hgnc:6490
      label: LAMB3
  - preferred_term: LAMC2
    term:
      id: hgnc:6493
      label: LAMC2
  evidence:
  - reference: PMID:36291670
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-laminin (LM) 332-type mucous membrane pemphigoid (MMP) is a rare autoimmune bullous disease and was originally discovered as anti-epiligrin cicatricial pemphigoid. Anti-LM332-type MMP has clinical manifestations similar to those of other types of MMP and can only be distinguished through the detection of circulating autoantibodies against LM332."
    explanation: Defines the subtype and states it is distinguished serologically rather than clinically.
  - reference: PMID:23426192
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results of this novel ELISA showed that serum anti-Lam332 autoantibodies are detected in 20.1% of patients with MMP."
    explanation: Multicentre French series of 154 MMP patients gives the frequency of the subtype.
  - reference: PMID:23426192
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with a positive Lam332 ELISA score frequently had more severe MMP (67.8% vs 47.2%; P = .04)."
    explanation: Anti-laminin 332 positivity is associated with more severe disease.

    term:
      id: GO:0002138
      label: retinoic acid biosynthetic process
    modifier: INCREASED
  downstream:
  - target: Mucosal Subepithelial Fibrosis
    description: Activated fibroblasts secrete excess type I collagen and contract matrix, producing conjunctival scarring.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27699226
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data suggest that progressive scarring in OMMP results from ALDH/RA fibroblast autoregulation"
      explanation: Links the ALDH/retinoic-acid fibroblast phenotype to progressive conjunctival scarring; the in vivo component used an allergic eye disease mouse as a surrogate, not an MMP model.
  evidence:
  - reference: PMID:21224056
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that pemphigoid fibroblasts showed increased cell division (P = 0.01), increased migration in serum-free medium"
    explanation: Primary conjunctival fibroblasts from patients proliferate and migrate more than normal fibroblasts.
  - reference: PMID:21224056
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, these findings indicate that pemphigoid conjunctival fibroblasts have a profibrotic phenotype that is maintained in vitro."
    explanation: The profibrotic phenotype is cell-intrinsic and persists outside the inflammatory milieu.
  - reference: PMID:27699226
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Aldehyde dehydrogenase family 1 (ALDH1) is upregulated in both ocular MMP (OMMP) conjunctiva and cultured fibroblasts."
    explanation: ALDH1 upregulation in patient tissue and cultured fibroblasts.
  - reference: PMID:35197965
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Whilst blocking of ALDH failed to significantly ameliorate disease activity, our data provide new insight into fibrotic processes"
    explanation: In the anti-laminin 332 mouse model, disulfiram ALDH inhibition did not reduce fibrosis or disease activity, contradicting a central role for ALDH in that model.
- name: Mucosal Subepithelial Fibrosis
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    Extra-oral lesions heal with subepithelial fibrosis. In the conjunctiva
    this produces fornix foreshortening, symblepharon, entropion and trichiasis
    and destroys lacrimal gland ductules and meibomian orifices; in the nose,
    pharynx, larynx and oesophagus it produces stenoses, webs and strictures.
    Experimental MMP lesions show increased collagen fibril density and
    altered collagen cross-linking.
  biological_scale: TISSUE
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  - preferred_term: larynx
    term:
      id: UBERON:0001737
      label: larynx
  - preferred_term: esophagus
    term:
      id: UBERON:0001043
      label: esophagus
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  downstream:
  - target: Conjunctival Subepithelial Fibrosis
    description: Conjunctival subepithelial fibrosis is the ocular manifestation of this node.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31356420
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "22 of 34 eyes had progressive fibrosing conjunctival involvement"
      explanation: Progressive conjunctival fibrosis observed in most eyes of an ocular MMP cohort.
  - target: Symblepharon
    description: Advanced cicatrizing conjunctival disease forms symblepharon.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34245180
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "with advanced cicatrizing disease and symblepharon formation"
      explanation: Associates symblepharon formation with advanced cicatrizing (scarring) disease.
  - target: Laryngeal Stenosis
    description: Scarring of the larynx and upper airway narrows the airway.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16862049
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nasal valves, choanae, pharynx, and/or larynx were severely scarred in 7 (18%) patients, causing the death of 3."
      explanation: Upper-airway scarring in MMP caused fatal obstruction.
  - target: Esophageal Stricture
    description: Oesophageal strictures arise secondary to scarring with fibrosis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34245180
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "oesophageal strictures are more likely to represent a more advanced stage, secondary to scarring with fibrosis"
      explanation: States that strictures result from fibrotic scarring.
  - target: Blindness
    description: Excessive conjunctival fibrosis is the cause of blindness in ocular MMP.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21224056
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Ocular mucous membrane pemphigoid is an immunobullous disease in which excessive conjunctival fibrosis causes blindness"
      explanation: Opening statement of the fibroblast study, stating the established clinical link between conjunctival fibrosis and blindness.
  evidence:
  - reference: PMID:35197965
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The extracellular matrix of MMP skin samples also showed altered post-translational collagen cross-linking with increased levels of both lysine- and hydroxylysine-derived collagen crosslinks supporting the fibrotic phenotype in experimental MMP compared to control animals."
    explanation: Quantifies fibrotic matrix remodeling in experimental MMP.
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Oesophageal webs are thought to represent an early stage of the disease, whereas oesophageal strictures are more likely to represent a more advanced stage, secondary to scarring with fibrosis."
    explanation: Places oesophageal strictures downstream of mucosal fibrosis.
phenotypes:
- name: Oral Mucosal Erosions and Blisters
  category: Oral
  description: >-
    The oral mucosa is the commonest and usually the first site involved, with
    blisters that rupture into erosions on the gingiva, buccal mucosa and
    palate. Oral lesions typically heal without scarring.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: oral mucosal erosions
    term:
      id: HP:0031446
      label: Erosion of oral mucosa
  evidence:
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In 85% of MMP patients, the oral mucosa is the site of onset, and most frequently involved."
    explanation: Guideline synthesis giving oral involvement as the commonest site, supporting the VERY_FREQUENT band.
  - reference: PMID:34995762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most frequently, the oral cavity and the conjunctivae are affected."
    explanation: Review naming the oral cavity as a leading site of involvement.
- name: Desquamative Gingivitis

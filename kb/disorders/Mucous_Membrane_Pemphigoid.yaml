- name: Genital Mucosal Lesions
  category: Genitourinary
  description: >-
    Anogenital erosions and scarring occur alone or with other sites and may be
    misdiagnosed as lichen sclerosus, lichen planus or sexual abuse.
  phenotype_term:
    preferred_term: genital mucosal erosions
    term:
      id: HP:0003249
      label: Genital ulcers
  evidence:
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In two cohorts of MMP patients, genital lesions were observed in 28-38% of the cases."
    explanation: Guideline synthesis of two cohorts; the 28-38% range straddles the OCCASIONAL/FREQUENT boundary, so no frequency band is assigned.
- name: Skin Blistering
  category: Integument
  description: >-
    Skin lesions occur in a minority of patients; in the Brunsting-Perry
    variant they are confined mainly to the head and neck and heal with
    atrophic scars.
  phenotype_term:
    preferred_term: skin blisters and erosions

  downstream:
  - target: Fc Receptor and Complement Activation at the Basement Membrane Zone
    description: Autoantibodies bound at the epithelial basement membrane engage Fc-gamma receptors and generate C5a.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28456612
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, disease development was abrogated in FcRγ chain-deficient mice and markedly reduced in C5aR1-deficient mice. Furthermore, wild-type mice injected with anti-mLAMα3 F(ab')2 were completely protected."
      explanation: In the passive-transfer anti-laminin 332 mouse model, Fc-less antibody fragments are non-pathogenic and disease requires FcR-gamma and C5aR1, placing Fc-receptor and complement effector activation directly downstream of antibody binding.
  evidence:
  - reference: PMID:34245180
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients' autoantibodies have been shown to be predominantly directed against BP180 (also called BPAG2, type XVII collagen), BP230, laminin 332 and type VII collagen, components of junctional adhesion complexes promoting epithelial stromal attachment in stratified epithelia."
    explanation: The S3 guideline summarizes the autoantigen spectrum and its role in epithelial-stromal attachment.
  - reference: PMID:34995762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Autoantibodies target BP180 (collagen type XVII), laminin 332, BP230 (nearly always in conjunction with other antigens), and type VII collagen in about 75%, 10-20%, 10-30%, and <5% of MMP patients, respectively."
    explanation: Review gives approximate frequencies of each autoantigen.
  - reference: PMID:12788530
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we confirmed that cicatricial pemphigoid sera mainly react with most C-terminal portion, whereas bullous pemphigoid sera react with more N-terminal domains."
    explanation: Recombinant-fragment immunoassays show MMP sera recognise the most C-terminal portion of BP180, distinct from bullous pemphigoid.
  - reference: PMID:34995762
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "While the main autoantibody isotype is IgG, additional, and less frequently exclusive, IgA autoantibodies can be detected in the majority of patients."
    explanation: Records the IgG and IgA isotypes of the autoantibodies.
- name: Fc Receptor and Complement Activation at the Basement Membrane Zone
  description: >-
    Tissue-bound IgG, IgA and complement C3 deposit linearly along the
    epithelial basement membrane zone. In experimental anti-laminin 332 MMP,
    lesion formation requires the Fc portion of the antibody and the Fc
    receptor gamma chain, and is markedly reduced without the C5a receptor
    C5aR1, indicating codominant roles for Fc-receptor engagement and
    complement activation.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: C5AR1
    term:
      id: hgnc:1338
      label: C5AR1
  biological_processes:
  - preferred_term: complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: INCREASED
  - preferred_term: Fc receptor mediated stimulatory signaling pathway
    term:
      id: GO:0002431
      label: Fc receptor mediated stimulatory signaling pathway
    modifier: INCREASED
  downstream:
  - target: Neutrophil Recruitment via the LTB4-BLT1 Axis
    description: Autoantibody binding at the junction triggers influx of inflammatory cells, predominantly neutrophils.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40985889
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "inflammation in MMP is triggered by specific binding of autoantibodies directed to different proteins of the dermal-epidermal/-epithelial junction, subsequently leading to the influx of inflammatory cells, particularly neutrophils, into the dermis."
      explanation: Background framing in a mouse-model paper linking autoantibody binding at the junction to neutrophil influx; the paper's own data address the neutrophil step.
  evidence:
  - reference: PMID:34309078
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Direct immunofluorescence visualizes in vivo bound immunoreactants in skin or mucosa and shows linear deposition of IgG and/or IgA and complement C3 along the BMZ in MMP."
    explanation: Linear C3 deposition with immunoglobulin in patient tissue shows complement fixation at the basement membrane zone.
  - reference: PMID:28456612
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings suggest a crucial codominant role of FcRγ and complement activation of the anti-mLAMα3 IgG-induced mouse model of mucous membrane pemphigoid."
    explanation: Passive-transfer mouse model identifies Fc-receptor and complement activation as effector mechanisms.
- name: Neutrophil Recruitment via the LTB4-BLT1 Axis
  description: >-
    Neutrophils are the dominant cell in the lesional infiltrate. In the
    anti-laminin 332 antibody-transfer model, their recruitment depends on
    5-lipoxygenase-derived leukotriene B4 acting on the BLT1 receptor on
    neutrophils; mice lacking Alox5 or Ltb4r1 (globally or in neutrophils only)
    fail to recruit neutrophils and are largely protected.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  genes:
  - preferred_term: ALOX5
    term:
      id: hgnc:435
      label: ALOX5
  - preferred_term: LTB4R (BLT1)
    term:
      id: hgnc:6713
      label: LTB4R
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  - preferred_term: leukotriene biosynthetic process
    term:
      id: GO:0019370
      label: leukotriene biosynthetic process
    modifier: INCREASED
  downstream:
  - target: Subepithelial Blister Formation
    description: Recruited neutrophils are required for lesion eruption and are thought to degrade the epithelial-stromal adhesion complex.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40985889
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, BLT1 was required on neutrophils, and neutrophil recruitment was indispensable for the eruption of lesions in MMP."
      explanation: Neutrophil-specific Ltb4r1 deficiency protected mice from lesions, showing neutrophil recruitment is required for blistering.
  evidence:
  - reference: PMID:40985889
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice deficient in 5-lipoxygenase (Alox5-/-) or in the leukotriene B4 (LTB4) receptor BLT1 (Ltb4r1-/-) were resistant to skin inflammation and exhibited substantially fewer mucosal lesions, with deficiency in either gene compromising the recruitment of neutrophils to the lesion."
    explanation: Genetic deletion of the LTB4 pathway abolishes neutrophil recruitment and protects against lesions.
  - reference: PMID:40985889
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Histopathologically, both mucosal and cutaneous lesions exhibit a mixed inflammatory infiltrate, with neutrophils usually constituting the largest cell population"
    explanation: Introduction of the mouse paper summarizing human MMP histopathology, where neutrophils predominate.
- name: Subepithelial Blister Formation
  description: >-
    Effector activity at the basement membrane zone separates the stratified
    epithelium from the underlying lamina propria or dermis, producing
    subepithelial blisters that rupture into erosions and ulcers on the oral,
    conjunctival, nasal, laryngeal, oesophageal and anogenital mucosa and, less
    often, the skin.
  biological_scale: TISSUE
  locations:
  - preferred_term: mucosa of oral region
    term:
      id: UBERON:0003343
      label: mucosa of oral region
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  downstream:
  - target: Oral Mucosal Erosions and Blisters
    description: Subepithelial blisters of the oral mucosa rupture into the erosions seen clinically.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8833897
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "subepidermal blisters of skin and mucous membranes"
      explanation: Passive transfer of anti-laminin 332 IgG produces mucosal subepithelial blisters, the lesion underlying clinical oral erosions.
  - target: Desquamative Gingivitis
    description: Gingival blistering and ulceration are the severe end of desquamative gingivitis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34245180
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Desquamative gingivitis ranges from localized gingival erythema to generalized inflammation with blistering or ulceration."
      explanation: Places blistering within the desquamative gingivitis phenotype.
  - target: Skin Blistering
    description: The same subepithelial split produces cutaneous blisters where skin is involved.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8833897
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "subepidermal blisters of skin and mucous membranes"
      explanation: Pathogenic anti-laminin 332 IgG produces subepidermal skin blisters in mice.
  - target: Mucosal Subepithelial Fibrosis
    description: Lesions outside the mouth heal with fibrosis; in the mouse model, lesional tissue shows increased collagen fibril density.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35197965
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In MMP mice, increased collagen fibril density was observed in skin and conjunctival lesions compared to mice injected with normal rabbit IgG."
      explanation: Antibody-induced lesions in the anti-laminin 332 model progress to a fibrotic collagen architecture.
    - reference: PMID:34995762
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Lesions outside the mouth tend to heal with scarring leading to visual impairment and finally blindness, as well as, more rarely, impairment of breathing and food intake."
      explanation: Clinical synthesis that extra-oral lesions heal with scarring.
  evidence:
  - reference: PMID:8833897
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice (n = 29) receiving purified anti-laminin 5 IgG developed, in a dose-related fashion, circulating anti-laminin 5 antibodies, deposits of rabbit IgG and murine C3 in epidermal basement membranes, and subepidermal blisters of skin and mucous membranes."
    explanation: Passive transfer of anti-laminin 332 IgG is sufficient to produce subepithelial blisters of skin and mucosa, establishing antibody pathogenicity.
  - reference: PMID:28456612
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conjunctival and oral/pharyngeal lesions with subepithelial splitting were found in 80% and 100% of mice, respectively."
    explanation: The adult-mouse model reproduces subepithelial splitting at the principal human mucosal sites.
- name: IL-13-Producing T Cell Infiltration of the Conjunctiva
  description: >-
    Active ocular MMP conjunctiva contains many IL-13-expressing stromal cells,
    most of them CD3+ T cells. Their number falls with systemic
    immunosuppression but remains above normal in clinically uninflamed treated
    eyes, providing a persistent profibrotic signal to conjunctival
    fibroblasts. How this T-cell infiltrate is linked to the
    autoantibody-driven blistering cascade is not established.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  genes:
  - preferred_term: IL13
    term:
      id: hgnc:5973
      label: IL13
  biological_processes:
  - preferred_term: interleukin-13 production
    term:
      id: GO:0032616
      label: interleukin-13 production
    modifier: INCREASED
  downstream:
  - target: Profibrotic Conjunctival Fibroblast Activation
    description: IL-13 drives contraction, migration and immune activation of conjunctival fibroblasts.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19910508
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "IL-13 stimulated collagen lattice contraction and migration, and decreased production of mmp-3 and mmp-10 by human conjunctival fibroblasts."
      explanation: IL-13 applied to human conjunctival fibroblasts induces profibrotic behaviour.
  evidence:
  - reference: PMID:19910508
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found high stromal cell expression of IL-13 in active ocular MMP by immunohistochemistry; 80% of these cells were CD3-positive T cells."
    explanation: Immunohistochemistry of patient conjunctiva localizes IL-13 mainly to T cells.
  - reference: PMID:19910508
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following immunosuppression, in clinically uninflamed, treated, ocular MMP patients, the number of IL-13 positive cells was significantly reduced, but this was still fourfold greater than in normal conjunctiva."
    explanation: The IL-13 signal persists after clinical inflammation is controlled.
- name: Profibrotic Conjunctival Fibroblast Activation
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  description: >-
    Conjunctival fibroblasts from ocular MMP retain a profibrotic phenotype in
    culture - increased proliferation, migration, collagen contraction and type
    I collagen secretion - regardless of whether they came from inflamed or
    uninflamed conjunctiva. Aldehyde dehydrogenase family 1 (ALDH1) is
    upregulated in these fibroblasts, and its product retinoic acid induces the
    diseased phenotype in normal fibroblasts, suggesting an autoregulatory loop
    that sustains scarring after inflammation subsides.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast of the conjunctiva
    term:
      id: CL:0002550
      label: fibroblast of the conjunctiva
  genes:
  - preferred_term: ALDH1A1
    term:
      id: hgnc:402
      label: ALDH1A1
  biological_processes:

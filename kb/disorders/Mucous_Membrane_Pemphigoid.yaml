    quote_role: REVIEW_SYNTHESIS
    snippet: "As first-line treatment of mild/moderate MMP, dapsone, methotrexate or tetracyclines and/or topical corticosteroids are recommended."
    explanation: Methotrexate is a guideline first-line option for mild or moderate MMP.
- name: Cyclophosphamide
  description: >-
    Oral or intravenous cyclophosphamide, usually with dapsone and/or

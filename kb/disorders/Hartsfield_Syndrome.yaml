name: Hartsfield Syndrome
synonyms:
- Hartsfield syndrome, FGFR1-related
- Hartsfield-Bixler-Demyer syndrome
- holoprosencephaly-ectrodactyly-cleft lip/palate syndrome
- holoprosencephaly-ectrodactyly-cleft lip palate syndrome
creation_date: '2026-04-04T12:00:00Z'
category: Mendelian
description: >-
  FGFR1-related Hartsfield syndrome is an ultrarare developmental malformation
  syndrome defined by the co-occurrence of holoprosencephaly (HPE) spectrum
  disorder and ectrodactyly spectrum disorder (split-hand/foot malformation).
  HPE arises from failed or incomplete midline division of the embryonic
  prosencephalon, ranging from alobar to semilobar and lobar forms, accompanied
  by corpus callosum agenesis, absent olfactory bulbs and tracts
  (arrhinencephaly), absent septum pellucidum, cerebellar vermis hypoplasia,
  craniofacial clefting, medically refractory seizures, spasticity, global
  developmental delay, and hypothalamic-pituitary endocrine deficits including
  hypogonadotropic hypogonadism and central diabetes insipidus. Most cases are
  caused by de novo heterozygous dominant-negative missense variants in the
  FGFR1 intracellular tyrosine kinase domain, while rare autosomal recessive
  cases result from biallelic variants in the extracellular ligand-binding
  domain.

  evidence:
  - reference: PMID:26931467
    reference_title: "Dominant-negative kinase domain mutations in FGFR1 can explain the clinical severity of Hartsfield syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate that of the nine FGFR1 mutations recently detected in our screen of over 200 HPE probands by next generation sequencing, only five distinct mutations in the kinase domain behave as dominant-negative mutations in zebrafish over-expression assays."
    explanation: Zebrafish morphant rescue and overexpression assays show that Hartsfield-associated FGFR1 kinase-domain variants act via a dominant-negative mechanism.
  - reference: PMID:30787447
    reference_title: "A novel dominant-negative FGFR1 variant causes Hartsfield syndrome by deregulating RAS/ERK1/2 pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Indeed, the phosphorylation of ERK1/2 elicited by FGF2 was significantly reduced when Ala645Val FGFR1 was co-expressed with the wild-type FGFR1 (Fig. 2a, lane 10; Fig. 2b), compared with cells transfected with wild-type FGFR1 (Fig. 2a, lane 6; Fig. 2b)."
    explanation: Co-expression in HEK293 cells demonstrates dominant-negative suppression of FGF2-induced ERK1/2 phosphorylation by a Hartsfield FGFR1 kinase-domain variant.
  - reference: PMID:23812909
    reference_title: "FGFR1 mutations cause Hartsfield syndrome, the unique association of holoprosencephaly and ectrodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected residues are highly conserved and are located in the extracellular binding domain of the receptor (two homozygous mutations) or the intracellular tyrosine kinase domain (four heterozygous de novo variants)."
    explanation: Establishes the two mutational classes in FGFR1 underlying Hartsfield syndrome across extracellular ligand-binding and intracellular kinase domains.
  downstream:
  - target: Impaired Forebrain Midline Patterning
    description: Severely reduced FGFR1 signaling in the anterior neural ridge disrupts embryonic prosencephalon and hypothalamic-olfactory patterning.
  - target: Impaired Limb Bud Patterning
    description: Severely reduced FGFR1 signaling in the developing limb bud disrupts apical ectodermal ridge and autopod central-ray specification.
- name: Impaired Forebrain Midline Patterning
  description: >-
    Loss of FGFR1 signaling in the rostral prosencephalon and anterior neural
    ridge during early embryogenesis impairs midline cleavage of the embryonic
    forebrain and development of commissural, olfactory placode, and
    hypothalamic-pituitary structures. This produces the holoprosencephaly
    spectrum (alobar, semilobar, or lobar), corpus callosum agenesis, absent
    septum pellucidum, arrhinencephaly, cerebellar vermis hypoplasia, midline
    craniofacial clefting and variable orbital spacing, neurologic dysfunction
    (including hypothalamic thermoregulatory and sleep-wake disturbances),
    postnatal growth retardation, and hypothalamic-pituitary endocrinopathies.

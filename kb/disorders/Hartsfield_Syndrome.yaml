    evidence:
    - reference: CGGV:assertion_ec5034c6-70cb-4ba3-bbb9-f65f6cad393d-2021-03-16T235509.401Z
      reference_title: "FGFR1 / Hartsfield-Bixler-Demyer syndrome (Moderate)"

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    FGFR1-related Hartsfield syndrome is typically inherited in an autosomal
    dominant manner, with most probands carrying de novo heterozygous missense
    variants in the FGFR1 tyrosine kinase domain. Parental germline or combined
    germline and somatic mosaicism accounts for sibling recurrence in roughly
    9% of reported families.
  evidence:
  - reference: PMID:26937548
    reference_title: "FGFR1-Related Hartsfield Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "FGFR1-related Hartsfield syndrome is typically an autosomal dominant (AD) disorder."
    explanation: GeneReviews establishes autosomal dominant inheritance as the typical transmission pattern.
  - reference: PMID:35338003
    reference_title: "Mosaicism in Hartsfield syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In light of our findings and those in the published literature, we suggest that mosaicism, either germline or germline and somatic, may be a relatively frequent finding, affecting 3 of 35 (9%) reported families, which has important implications for genetic counselling."
    explanation: Documents parental germline and somatic mosaicism as an important cause of familial recurrence in autosomal dominant Hartsfield syndrome.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Autosomal recessive inheritance due to homozygous loss-of-function missense
    variants in the extracellular immunoglobulin-like ligand-binding domain D2
    of FGFR1 has been documented in rare families with unaffected heterozygous
    carrier parents.
  evidence:
  - reference: PMID:26937548
    reference_title: "FGFR1-Related Hartsfield Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In two families reported to date, FGFR1-related Hartsfield syndrome was inherited in an autosomal recessive (AR) manner."
    explanation: GeneReviews documents rare autosomal recessive transmission in two families.
  - reference: PMID:23812909
    reference_title: "FGFR1 mutations cause Hartsfield syndrome, the unique association of holoprosencephaly and ectrodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two of our patients with Hartsfield syndrome, we identified homozygous mutations affecting amino acid residues located in the extracellular ligand binding domain D2 of FGFR1: L165S, in patient 1, with a severe phenotype, and L191S, in patient 2, with a moderate phenotype (table 1, figure 1). Both parents of patient 1 were heterozygous for the L165S mutation, and were reported to be asymptomatic and spontaneously fertile."
    explanation: Demonstrates autosomal recessive Hartsfield syndrome with unaffected heterozygous carrier parents for extracellular D2 domain FGFR1 variants.

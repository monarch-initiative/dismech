    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of FGFR1-related Hartsfield syndrome is established in a proband with suggestive findings and either an FGFR1 heterozygous pathogenic variant (in those with autosomal dominant inheritance) or FGFR1 biallelic pathogenic variants (in those with autosomal recessive inheritance) identified by molecular genetic testing."
    explanation: Establishes FGFR1 as the causative gene across both autosomal dominant and autosomal recessive inheritance patterns.
  - reference: PMID:23812909
    reference_title: "FGFR1 mutations cause Hartsfield syndrome, the unique association of holoprosencephaly and ectrodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dominant or recessive FGFR1 mutations are responsible for Hartsfield syndrome, consistent with the known roles of FGFR1 in vertebrate ontogeny and conditional Fgfr1-deficient mice."
    explanation: Original gene-discovery cohort identifying heterozygous de novo kinase-domain and homozygous extracellular-domain FGFR1 mutations in six patients with Hartsfield syndrome.

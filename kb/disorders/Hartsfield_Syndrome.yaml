notes: >-
  ORPHA:2117 lists several additional craniofacial, ocular, central nervous
  system, skeletal, and systemic HPO annotations at 80-99% (Very frequent) or
  30-79% (Frequent)—including telecanthus (HP:0000506), downslanted palpebral
  fissures (HP:0000494), depressed nasal bridge (HP:0005280), posteriorly
  rotated ears (HP:0000358), ptosis (HP:0000508), microphthalmia (HP:0000568),
  craniosynostosis (HP:0001363), encephalocele (HP:0002084), intrauterine
  growth retardation (HP:0001511), respiratory insufficiency (HP:0002093), and
  radial aplasia/hypoplasia (HP:0006501)—reflecting historical pre-molecular
  clinical aggregation of holoprosencephaly-ectrodactyly case reports alongside
  FGFR1-confirmed cases. These uncorroborated frequency bands are not imported
  into the molecularly defined FGFR1 entry because FGFR1-confirmed series
  (PMID:23812909, PMID:26931467, PMID:30787447) and GeneReviews (PMID:26937548)
  do not support 80-99% rates for encephalocele, ptosis, or respiratory
  insufficiency; associate craniosynostosis with FGFR1 gain-of-function
  disorders rather than dominant-negative or biallelic loss-of-function
  Hartsfield syndrome (PMID:26931467); note radial aplasia and eye defects as
  anecdotal pre-molecular reports or findings in an FGFR1-mutation-negative
  fetus with microphthalmia and forearm hypoplasia likely representing a
  distinct entity (PMID:23812909); document variable ocular spacing (both
  hypotelorism and occasional hypertelorism rather than 80-99% hypertelorism in
  PMID:23812909); and document predominantly postnatal growth retardation
  (PMID:23812909) rather than consistent intrauterine growth restriction. Outer
  ear anomalies (microtia, dysplastic, or low-set ears) occur variably across
  FGFR1-confirmed cases (PMID:23812909, PMID:26931467) rather than uniform
  posteriorly rotated ears at 80-99%.

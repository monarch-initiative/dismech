    description: Impaired limb-bud patterning disrupts central-ray formation across hands and feet, producing ectrodactyly.
  - target: Polydactyly
    description: Disrupted anteroposterior autopod ray specification in FGFR1 deficiency occasionally produces supernumerary or bifid digits.
  - target: Syndactyly
    description: Impaired interdigital separation and ray patterning in the developing autopod produce cutaneous or osseous syndactyly.

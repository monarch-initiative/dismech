  evidence:
  - reference: PMID:26937548
    reference_title: "FGFR1-Related Hartsfield Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ectrodactyly spectrum disorders are unilateral or bilateral malformations of the hands and/or feet characterized by a median cleft of hand or foot due to absence of the longitudinal central rays (also called split-hand/foot malformation)."
    explanation: Establishes defective longitudinal central-ray formation in the hands and feet as the core limb-patterning defect in Hartsfield syndrome.
  - reference: PMID:23812909
    reference_title: "FGFR1 mutations cause Hartsfield syndrome, the unique association of holoprosencephaly and ectrodactyly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "During mouse autopod patterning, depending on the time and localisation of conditional gene inactivation, an Fgfr1 insufficiency results in a variety of limb defects including loss restricted to the central digit or monodactyly."
    explanation: Conditional Fgfr1 deficiency during mouse autopod patterning directly recapitulates central-digit loss.
  downstream:

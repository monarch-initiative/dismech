      evidence_source: OTHER
      snippet: "| FGFR1 | HGNC:3688 | Hartsfield-Bixler-Demyer syndrome | MONDO:0014196 | AD | Moderate | SOP8 | Craniofacial Malformations Gene Curation Expert Panel | 2021-03-16T23:55:09.401Z |"
      explanation: ClinGen classifies the FGFR1-Hartsfield-Bixler-Demyer syndrome relationship as Moderate for autosomal dominant inheritance.
  notes: >-
    Heterozygous pathogenic missense variants in the intracellular tyrosine
    kinase domain (autosomal dominant, typically de novo or via parental
    germline mosaicism) or rare homozygous missense variants in the
    extracellular Ig-like ligand-binding domain (autosomal recessive) cause
    FGFR1-related Hartsfield syndrome.

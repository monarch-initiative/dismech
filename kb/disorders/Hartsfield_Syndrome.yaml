pathophysiology:
- name: Impaired FGFR1 Receptor Tyrosine Kinase Activity and RAS/ERK1/2 Signaling
  description: >-
    Heterozygous missense variants clustering in the ATP-binding and catalytic
    pocket of the FGFR1 intracellular tyrosine kinase domain create receptor
    subunits that form inactive dimers with wild-type FGFR1, exerting a
    dominant-negative blockade on receptor transphosphorylation and downstream
    FGF-stimulated RAS/ERK1/2 signaling and c-Fos induction. Rarely, homozygous
    missense variants in the extracellular Ig-like ligand-binding domain D2
    abolish FGF ligand binding and phenocopy severe FGFR1 signaling loss.
  biological_scale: MOLECULAR
  node_class: RECEPTOR_ADAPTOR_ACTIVITY
  gene:
    preferred_term: FGFR1
    description: Fibroblast growth factor receptor 1 transmembrane receptor tyrosine kinase.
    term:
      id: hgnc:3688
      label: FGFR1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    notes: >-
      Heterozygous kinase-domain missense variants (typically de novo) act via a
      dominant-negative mechanism, whereas rare homozygous extracellular D2
      domain missense variants act via biallelic loss of ligand-activated
      signaling.

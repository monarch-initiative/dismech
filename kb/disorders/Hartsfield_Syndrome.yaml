  evidence:
  - reference: PMID:26937548
    reference_title: "FGFR1-Related Hartsfield Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "HPE spectrum disorder, resulting from failed or incomplete forebrain division early in gestation, includes alobar, semilobar, or lobar HPE. Other observed midline brain malformations include corpus callosum agenesis, absent septum pellucidum, absent olfactory bulbs and tracts, and vermian hypoplasia."
    explanation: Documents failed embryonic forebrain division and associated midline cerebral, olfactory, and cerebellar malformations in Hartsfield syndrome.
  - reference: PMID:23812909
    reference_title: "FGFR1 mutations cause Hartsfield syndrome, the unique association of holoprosencephaly and ectrodactyly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Notably, in mice, the conditional lack of Fgfr1 expression in developing telencephalon results in loss of cerebral commissures, 16 and also in the absence of olfactory bulbs, 17 as early emergence of gonadotropin releasing hormone (GnRH) neurons from the embryonic olfactory placode is dependent on FGFR1 activation by FGF8."
    explanation: Explains how developmental FGFR1 deficiency in the embryonic telencephalon and olfactory placode causes commissural loss, absent olfactory bulbs, and GnRH deficiency.
  downstream:
  - target: Holoprosencephaly
    description: Failed or incomplete prosencephalon division is the core forebrain-patterning phenotype.
  - target: Agenesis of corpus callosum
    description: Forebrain midline-patterning disruption impairs telencephalic commissure formation, causing corpus callosum agenesis.
  - target: Absent septum pellucidum
    description: Midline prosencephalic cleavage failure disrupts formation of the septum pellucidum.
  - target: Arrhinencephaly
    description: Impaired FGFR1-dependent olfactory placode and forebrain development causes absence of olfactory bulbs and tracts.
  - target: Cerebellar vermis hypoplasia
    description: Midline central nervous system developmental disruption extends to cerebellar vermian hypoplasia.
  - target: Seizures
    description: Holoprosencephaly-spectrum cortical and midline malformation predisposes to medically refractory epilepsy.
  - target: Spasticity
    description: Structural forebrain malformation impairs upper motor neuron pathways, producing spasticity.
  - target: Global developmental delay
    description: Forebrain malformation and associated neurologic dysfunction cause global developmental delay.
  - target: Abnormality of temperature regulation
    description: Midline hypothalamic developmental dysfunction impairs central thermoregulation.
  - target: Sleep-wake cycle disturbance
    description: Midline hypothalamic developmental dysfunction disrupts circadian sleep-wake regulation.
  - target: Feeding difficulties
    description: Neurologic and oromotor dysfunction from forebrain malformation and craniofacial clefting cause feeding difficulties.
  - target: Hypogonadotropic hypogonadism
    description: Defective FGFR1-dependent hypothalamic GnRH neuron development causes hypogonadotropic hypogonadism.
  - target: Central diabetes insipidus
    description: Midline hypothalamic-posterior pituitary developmental dysfunction causes central diabetes insipidus.
  - target: Postnatal growth retardation
    description: Hypothalamic-pituitary dysfunction, feeding impairment, and FGFR1 developmental signaling deficiency contribute to postnatal growth retardation.
  - target: Micropenis
    description: Fetal gonadotropin deficiency secondary to hypogonadotropic hypogonadism leads to micropenis in affected males.
  - target: Cryptorchidism
    description: Deficient hypothalamic-pituitary-gonadal axis signaling impairs testicular descent, causing cryptorchidism.
  - target: Cleft lip
    description: Rostral midline prosencephalic and frontonasal patterning disruption causes cleft lip.
  - target: Cleft palate
    description: Midline craniofacial patterning disruption causes palatal clefting.
  - target: Hypotelorism
    description: Incomplete midline frontonasal and eye-field separation within the holoprosencephaly spectrum causes hypotelorism in a subset of patients.
  - target: Hypertelorism
    description: Variable frontonasal craniofacial dysmorphism in FGFR1-related Hartsfield syndrome occasionally manifests with ocular hypertelorism.
- name: Impaired Limb Bud Patterning
  description: >-
    Deficient FGFR1 signaling in the developing limb bud and apical ectodermal
    ridge disrupts anteroposterior and central-ray digit specification across
    both forelimb and hindlimb autopods, producing unilateral or bilateral
    ectrodactyly (split-hand/foot malformation) accompanied variably by
    syndactyly and polydactyly.
  biological_scale: TISSUE
  node_class: DEVELOPMENTAL_MALFORMATION
  conforms_to: limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification

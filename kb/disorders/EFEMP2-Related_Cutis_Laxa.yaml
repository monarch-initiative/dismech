genetic:
- name: EFEMP2
  gene_term:
    preferred_term: EFEMP2
    term:
      id: hgnc:3219
      label: EFEMP2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  features: >-
    EFEMP2, at 11q13, encodes fibulin-4 (also called FBLN4 and MBP1), a short
    fibulin built from tandem calcium-binding EGF-like domains and a
    C-terminal fibulin domain. Fibulin-4 binds tropoelastin, the lysyl oxidase
    propeptide, LTBP-1 and LTBP-4, fibrillin-1, collagen IV and the
    procollagen C-endopeptidase enhancer Pcolce, and it transfers copper from
    ATP7A to lysyl oxidase in the trans-Golgi network. Biallelic
    loss-of-function variants cause this disorder; most are missense
    substitutions in the calcium-binding EGF-like domains, and the molecular
    route to loss of function is allele-specific, running through transcript
    decay, impaired secretion, protein instability, or lost binding to
    individual partners. ClinGen's Hereditary Cardiovascular Disease expert
    panel classifies the gene-disease relationship as Definitive for autosomal
    recessive inheritance.
  notes: >-
    A heterozygous p.Arg83Cys allele has been proposed for dominant
    nonsyndromic thoracic aortic aneurysm on in-silico grounds alone
    (PMID:38113391); it is not reflected here because ClinGen's Definitive
    call covers autosomal recessive inheritance only and GeneReviews states
    that carriers are asymptomatic. In the mouse, a modest heterozygous dose
    reduction occasionally produced small aneurysms, so a weak heterozygous
    effect cannot be excluded on current evidence.
  evidence:
  - reference: "CGGV:assertion_8911130f-a1fc-4404-8905-5632a49a95fe-2024-08-23T160000.000Z"
    reference_title: "EFEMP2 / cutis laxa, autosomal recessive, type 1B (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In summary, EFEMP2 is definitively associated with autosomal recessive
      cutis laxa type 1B and aortic aneurysm.
    explanation: >-
      ClinGen Definitive gene-disease validity for EFEMP2 and MONDO:0013754,
      classified by the Hereditary Cardiovascular Disease Gene Curation Expert
      Panel on 2024-08-23.
  - reference: "CGGV:assertion_8911130f-a1fc-4404-8905-5632a49a95fe-2024-08-23T160000.000Z"
    reference_title: "EFEMP2 / cutis laxa, autosomal recessive, type 1B (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The mechanism of pathogenicity is proposed to be loss of function.
    explanation: The expert panel's mechanism call, consistent with the functional studies.
  - reference: PMID:16685658
    reference_title: "Fibulin-4: a novel gene for an autosomal recessive cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified a patient with recessive inheritance of a missense mutation
      (169G-->A; E57K) in the Fibulin-4 gene.
    explanation: The original gene-disease report.
  - reference: PMID:27339457
    reference_title: Functional consequence of fibulin-4 missense mutations associated with vascular and skeletal abnormalities and cutis laxa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      different mutations in the fibulin-4 gene result in different molecular
      defects affecting secretion rates, protein stability, LOX-induced
      cross-linking, or binding to other ECM components
    explanation: Allele-specific routes to loss of function across patient missense variants.
  variants:
  - name: c.169G>A (p.Glu57Lys)
    description: >-
      The first reported and a recurrent allele, in the first calcium-binding
      EGF-like domain. The protein is made but dimerizes, is inefficiently
      secreted and triggers an endoplasmic reticulum stress response; it also
      binds the lysyl oxidase propeptide less well. The knock-in mouse
      carrying it survives to adulthood with loose skin, bent forelimb, aortic
      aneurysm, tortuous arteries and emphysema.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:26178373
      reference_title: "Fibulin-4 E57K Knock-in Mice Recapitulate Cutaneous, Vascular and Skeletal Defects of Recessive Cutis Laxa 1B with both Elastic Fiber and Collagen Fibril Abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Here we generated a knock-in mouse strain bearing a recurrent fibulin-4
        E57K homozygous missense mutation.
      explanation: Confirms E57K is a recurrent patient allele and names the model built from it.
  - name: c.608A>C (p.Asp203Ala)
    description: >-
      The South Indian founder allele, in a conserved calcium-binding EGF-like
      sequence in exon 7. Homozygous in 21 of 22 infants in the Kerala cohort
      and compound heterozygous with p.Arg227Cys in one. Homozygosity was
      lethal in 17 of 21, at a median age of four months.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:22943132
      reference_title: "Characterization of a distinct lethal arteriopathy syndrome in twenty-two infants associated with an identical, novel mutation in FBLN4 gene, confirms fibulin-4 as a critical determinant of human vascular elastogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Genetic studies revealed an identical c.608A > C (p. Asp203Ala)
        mutation in exon 7 of the FBLN4 gene in all 22 patients, homozygous in
        21, and compound heterozygous in one patient with a p. Arg227Cys
        mutation in the same conserved cbEGF sequence.
      explanation: Founder allele identification and zygosity in the largest cohort.
  - name: p.Glu161Lys
    description: >-
      The Saudi founder allele, homozygous in all nine affected subjects from
      four unrelated consanguineous families. This genotype presents as severe
      recessive aortic aneurysm with no skin manifestations, and two relatives
      were found only on family screening at 17 and 20 years of age.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:22440127
      reference_title: Recessively inherited severe aortic aneurysm caused by mutated EFEMP2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Sequence analysis of EFEMP2, located on chromosome 11 at q13,
        identified a novel homozygous mutation (p.E161K) in all 9 affected
        subjects.
      explanation: Founder allele shared across four consanguineous families.
  - name: c.835C>T (p.Arg279Cys) with c.1070_1073dupCCGC
    description: >-
      The compound heterozygous genotype of a newborn who died at 27 days of
      pulmonary artery occlusion. The duplication allele is degraded by
      nonsense-mediated decay and the missense allele is barely secreted, so
      the patient's fibroblasts deposited no fibulin-4 at all.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:17937443
      reference_title: Compound heterozygous mutations in fibulin-4 causing neonatal lethal pulmonary artery occlusion, aortic aneurysm, arachnodactyly, and mild cutis laxa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        DNA analysis identified compound heterozygous mutations ((c.835C > T
        (p.R279C)/c.1070_1073dupCCGC) in fibulin-4, a recently recognized
        elastic fiber associated protein.
      explanation: The compound heterozygous genotype in a perinatally lethal case.
  - name: c.639C>A (p.Cys213Ter)
    description: >-
      Homozygous nonsense allele in two related fetuses whose pregnancies were
      terminated after second-trimester findings. Truncating genotypes sit at
      the lethal end of the severity range.
    clinical_significance: PATHOGENIC
    type: stop_gained
    evidence:
    - reference: PMID:30140196
      reference_title: Severe Phenotype of Cutis Laxa Type 1B with Antenatal Signs due to a Novel Homozygous Nonsense Mutation in EFEMP2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Sequencing of the EFEMP2 gene revealed a novel homozygous nonsense
        mutation: c.639C>A (p.Cys213*).
      explanation: Nonsense allele in the antenatally diagnosed severe cases.
  - name: p.Cys267Tyr
    description: >-
      Homozygous missense allele in a newborn of consanguineous parents with
      fetal overgrowth, contractural arachnodactyly, microcephaly and fatal
      soft tissue bleeding from fragile vessels. Impairs secretion of the
      protein in vitro.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:19664000
      reference_title: "Lethal cutis laxa with contractural arachnodactyly, overgrowth and soft tissue bleeding due to a novel homozygous fibulin-4 gene mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Sequencing of the elastin, fibulin-4 and fibulin-5 genes revealed a
        homozygous missense mutation (p.Cys267Tyr) in the fibulin-4 gene in the
        patient.
      explanation: Allele identification in the lethal overgrowth case.
  - name: p.Glu126Lys, p.Ala397Thr and p.Glu126Val with c.577delC
    description: >-
      Three genotypes found by screening 22 patients referred for arterial
      tortuosity, stenosis and aneurysms: two homozygous missense genotypes and
      one compound heterozygote with a frameshift. p.Glu126Lys loses binding to
      collagen IV, fibrillin-1, LTBP-1 and LTBP-4, and p.Ala397Thr loses LTBP-1
      binding.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:20389311
      reference_title: Altered TGFbeta signaling and cardiovascular manifestations in patients with autosomal recessive cutis laxa type I caused by fibulin-4 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        two homozygous missense mutations (p.Glu126Lys and p.Ala397Thr) and
        compound heterozygosity for missense mutation p.Glu126Val and
        frameshift mutation c.577delC
      explanation: Three further pathogenic genotypes from a vascular referral cohort.
treatments:
- name: Angiotensin Receptor Blockade for Aortic Root Dilatation
  description: >-
    Losartan or another angiotensin receptor blocker, offered on the strength
    of the mouse data and by analogy with Marfan syndrome. GeneReviews says it
    can be considered rather than recommending it. In the fibulin-4 smooth
    muscle knockout, losartan or captopril completely prevented aneurysm, but
    only inside a narrow window in the first month of life and without
    reversing the mechanical properties of the wall; in the adult hypomorph
    losartan reduced aneurysm size and improved survival without rescuing
    elastic fiber fragmentation. There is no human trial, and whether an
    equivalent early window exists in patients is unknown.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: angiotensin receptor blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Increased TGF-beta Signaling in the Aortic Wall
  - target: Ascending Aortic Dilation and Aneurysm
  evidence:
  - reference: PMID:21563328
    reference_title: EFEMP2-Related Cutis Laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of aortic root dilatation with beta-blockers or angiotensin
      receptor inhibitors can be considered.
    explanation: The GeneReviews recommendation, stated permissively.
  - reference: PMID:23636094
    reference_title: Angiotensin-converting enzyme-induced activation of local angiotensin signaling is required for ascending aortic aneurysms in fibulin-4-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      aneurysm formation was completely prevented by inhibition of the AngII
      pathway with losartan or captopril within a narrow therapeutic window
      during the first month of life
    explanation: The strongest preclinical result, with its timing caveat stated in the same sentence.
  - reference: PMID:26828783
    reference_title: "AT1-receptor blockade, but not renin inhibition, reduces aneurysm growth and cardiac failure in fibulin-4 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      No drug rescued elastic fiber fragmentation in established aneurysms,
      although losartan did reduce aneurysm size.
    explanation: Benefit in established disease is partial and does not restore wall structure.
- name: Beta-Blockade for Aortic Root Dilatation
  description: >-
    Beta-blockers to reduce haemodynamic stress on the aortic wall, offered on
    the same permissive GeneReviews footing as angiotensin receptor blockade
    and used with it in reported patients. The preclinical evidence is
    negative: propranolol had no effect on survival, aneurysm growth or
    cardiac function in aneurysmal fibulin-4 mice, whereas losartan did.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: beta-adrenergic blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: propranolol
      term:
        id: CHEBI:8499
        label: propranolol
  target_mechanisms:
  - target: Ascending Aortic Dilation and Aneurysm
  evidence:
  - reference: PMID:24276535
    reference_title: "Severe aortopathy due to fibulin-4 deficiency: molecular insights, surgical strategy, and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      She was initially treated with an angiotensin II receptor blocker and
      beta-blocker and eventually underwent total thoracic aortic replacement
    explanation: Reported clinical use, as a bridge to surgery rather than a definitive therapy.
  - reference: PMID:26828783
    reference_title: "AT1-receptor blockade, but not renin inhibition, reduces aneurysm growth and cardiac failure in fibulin-4 mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Losartan, but not aliskiren or propranolol, improved survival in
      fibulin-4 mice.
    explanation: >-
      Cuts against beta-blockade in this specific disorder: propranolol gave no
      survival benefit in the fibulin-4 hypomorph.
- name: Aortic Aneurysm Replacement Surgery
  description: >-
    Open replacement of the aneurysmal segment, the only intervention with
    documented success. Reported operations range from ascending aortic
    replacement in a 30-month-old child to valve-sparing root and total arch
    replacement and two-stage elephant trunk procedures for total thoracic
    aortic replacement. Residual tortuosity and aneurysm risk persist in
    unreplaced segments, and redo surgery for conduit stenosis or new aneurysm
    is reported, so operation does not end surveillance.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: aortic aneurysm replacement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Ascending Aortic Dilation and Aneurysm
  - target: Aortic Dissection and Rupture
  evidence:
  - reference: PMID:21563328
    reference_title: EFEMP2-Related Cutis Laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Aortic aneurysm replacement has been performed successfully.
    explanation: GeneReviews management statement on surgical replacement.
  - reference: PMID:42404516
    reference_title: Ascending aortic replacement for aneurysm in a 30-month-old child with EFEMP2-related cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The aneurysm gradually enlarged in size, and the patient required
      ascending aortic replacement using the J-Graft with a diameter of 24 mm.
    explanation: Successful replacement in a toddler, showing how early surgery may be needed.

pathophysiology:
- name: Biallelic EFEMP2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Germline homozygous or compound heterozygous EFEMP2 variants. Most are
    missense substitutions in the calcium-binding EGF-like domains (p.Glu57Lys,
    p.Glu126Lys, p.Glu161Lys, p.Asp203Ala, p.Cys267Tyr, p.Arg279Cys,
    p.Ala397Thr); frameshift and nonsense alleles also occur, and a 4-bp
    duplication allele is degraded by nonsense-mediated decay. All act by
    loss of function, through absent transcript, impaired secretion, or lost
    binding to partners.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: EFEMP2
    term:
      id: hgnc:3219
      label: EFEMP2
  evidence:
  - reference: PMID:16685658
    reference_title: "Fibulin-4: a novel gene for an autosomal recessive cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified a patient with recessive inheritance of a missense
      mutation (169G-->A; E57K) in the Fibulin-4 gene.
    explanation: First report of a recessive EFEMP2 (fibulin-4) allele, E57K.
  - reference: PMID:17937443
    reference_title: Compound heterozygous mutations in fibulin-4 causing neonatal lethal pulmonary artery occlusion, aortic aneurysm, arachnodactyly, and mild cutis laxa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      fibulin-4 mRNAs with the 4-bp duplication transcribed from one allele
      are probably subject to nonsense-mediated decay, whereas synthesis and
      secretion of the missense R279C fibulin-4 protein from the other allele
      is severely impaired
    explanation: >-
      Two loss-of-function routes in one patient's fibroblasts: transcript
      decay for the frameshift allele and failed secretion for the missense
      allele.
  - reference: PMID:27339457
    reference_title: Functional consequence of fibulin-4 missense mutations associated with vascular and skeletal abnormalities and cutis laxa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      different mutations in the fibulin-4 gene result in different molecular
      defects affecting secretion rates, protein stability, LOX-induced
      cross-linking, or binding to other ECM components
    explanation: Recombinant mutant proteins show allele-specific loss-of-function mechanisms.
  downstream:
  - target: Mutant Fibulin-4 Intracellular Retention and Reduced Secretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26178373
      reference_title: Fibulin-4 E57K Knock-in Mice Recapitulate Cutaneous, Vascular and Skeletal Defects of Recessive Cutis Laxa 1B with both Elastic Fiber and Collagen Fibril Abnormalities.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Biochemical studies of dermal fibroblasts showed that fibulin-4 E57K
        mutant protein was produced but was prone to dimer formation and
        inefficiently secreted
      explanation: The recurrent E57K allele is made but poorly secreted.
    - reference: PMID:27339457
      reference_title: Functional consequence of fibulin-4 missense mutations associated with vascular and skeletal abnormalities and cutis laxa.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        The substitutions E126K and C267Y impaired secretion of the protein,
        but not mRNA synthesis.
      explanation: Two further patient alleles impair secretion.
  - target: Reduced Fibulin-4 in the Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Direct route for null alleles removed by nonsense-mediated decay; missense
      alleles reach the same state through reduced secretion.
    evidence:
    - reference: PMID:17937443
      reference_title: Compound heterozygous mutations in fibulin-4 causing neonatal lethal pulmonary artery occlusion, aortic aneurysm, arachnodactyly, and mild cutis laxa.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Immunostaining demonstrated a total absence of fibulin-4 fibers in the
        extracellular matrix deposited by the patient's fibroblasts.
      explanation: Compound heterozygous patient fibroblasts deposit no fibulin-4 into their matrix.
  - target: Defective Copper Loading of Lysyl Oxidase
    causal_link_type: DIRECT
    description: >-
      Intracellular role: fibulin-4 acts in the trans-Golgi network, before
      secretion, so this branch leaves the trigger directly rather than via
      the matrix deficit.
    evidence:
    - reference: PMID:33239290
      reference_title: A matricellular protein fibulin-4 is essential for the activation of lysyl oxidase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Our studies showed that fibulin-4 is required for copper ion transfer
        from the copper transporter ATP7A to LOX in the trans-Golgi network
        (TGN), which is a necessary step for LTQ formation.
      explanation: Loss of fibulin-4 blocks copper transfer to LOX in the secretory pathway.

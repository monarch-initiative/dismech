- name: Cutis laxa
  category: Dermatologic
  description: >-
    Loose, redundant, inelastic skin, congenital and generalized when present.
    It names the disorder but is not obligate: 52% of the 22-infant South
    Indian founder cohort had it, and none of the nine Saudi p.Glu161Lys
    patients did, so EFEMP2 disease can present as recessive aortopathy with
    normal skin.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Generalized congenital cutis laxa
    term:
      id: HP:0000973
      label: Cutis laxa
    onset:
      onset_category: CONGENITAL
  evidence:
  - reference: PMID:22943132
    reference_title: "Characterization of a distinct lethal arteriopathy syndrome in twenty-two infants associated with an identical, novel mutation in FBLN4 gene, confirms fibulin-4 as a critical determinant of human vascular elastogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The phenotype included a variable combination of cutis laxa (52%), long
      philtrum-thin vermillion (90%), micrognathia (43%), hypertelorism (57%)
    explanation: Frequency in the largest cohort, with the authors calling the combination variable.
  - reference: PMID:16685658
    reference_title: "Fibulin-4: a novel gene for an autosomal recessive cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      She had multiple bone fractures at birth and was diagnosed with cutis
      laxa, vascular tortuosity, ascending aortic aneurysm, developmental
      emphysema, inguinal and diaphragmatic hernia, joint laxity, and pectus
      excavatum by age 2 years.
    explanation: The index p.Glu57Lys patient, in whom cutis laxa was a presenting feature.
  - reference: PMID:22440127
    reference_title: Recessively inherited severe aortic aneurysm caused by mutated EFEMP2.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The skin manifestations of cutis laxa were not found in any patient.
    explanation: >-
      Cuts against cutis laxa as an obligate feature: nine homozygous
      p.Glu161Lys patients with severe aortic aneurysm had normal skin.

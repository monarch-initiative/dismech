inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic EFEMP2 variants, homozygous in most reported families, many of
    which are consanguineous, or compound heterozygous. Heterozygous carriers
    are asymptomatic. Each sib of an affected individual has a 25% chance of
    being affected. Expressivity varies within families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

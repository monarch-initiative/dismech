genetic:
- name: Trisomy 13 (extra chromosome 13)
  association: Causal
  notes: >-
    Presence of an extra copy of chromosome 13 — free homogeneous trisomy (~80%,
    typically meiotic nondisjunction), mosaic trisomy, or a Robertsonian
    translocation (copy-number gain). No coordinate slot exists in the schema; the
    whole-chromosome gain is recorded here in prose.
  evidence:
  - reference: PMID:24340511
    reference_title: "Phenotypic variability in Patau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most frequent cytogenetic abnormality is free and homogeneous trisomy 13 (80.0%), rarely being detected trisomy mosaics or Robertsonian translocations."
    explanation: Gives the cytogenetic breakdown of the causative trisomy.
diagnosis:
- name: Karyotype Analysis
  presence: 47,XX,+13 or 47,XY,+13
  notes: Clinical diagnosis suggested by the triad; confirmed cytogenetically (karyotype), often prenatally.
  evidence:
  - reference: PMID:24340511
    reference_title: "Phenotypic variability in Patau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinical diagnosis being suggested by the triad cleft lip and palate, microphthalmia/anophthalmia and postaxial polydactyly"
    explanation: The clinical triad prompts cytogenetic confirmation of trisomy 13.
treatments:
- name: Supportive and Palliative Care
  description: >-
    No curative therapy exists. Management is supportive and individualized —
    respiratory, feeding, and cardiac support with attention to the severe
    malformation burden; intensity of care is decided with the family.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

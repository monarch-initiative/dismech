name: Trisomy 13
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Trisomy 13 (Patau syndrome) is an autosomal trisomy caused by the presence of an
  extra chromosome 13 — most often free, homogeneous trisomy, less commonly mosaic
  trisomy or a Robertsonian translocation. Whole-chromosome gene-dosage imbalance
  disrupts midline and forebrain development and multiple organ systems, producing
  the classic clinical triad of cleft lip/palate, microphthalmia/anophthalmia, and
  postaxial polydactyly, together with holoprosencephaly, congenital heart defects,
  scalp defects, ear anomalies, and capillary hemangiomas. Expression is highly
  variable, and the severe birth defects (brain and heart) drive high in-utero and
  perinatal mortality.
category: Genetic
synonyms:
- Patau syndrome
- trisomy 13 syndrome
- complete trisomy 13
parents:
- hereditary disease
- chromosomal disorder
disease_term:
  preferred_term: trisomy 13
  term:
    id: MONDO:0018068
    label: trisomy 13
has_subtypes:
- name: Full trisomy 13
  display_name: Free, homogeneous trisomy 13
  description: >-
    The most common form (~80%) — three complete copies of chromosome 13 in all
    cells from meiotic nondisjunction; associated with the full, severe phenotype.
  evidence:
  - reference: PMID:24340511
    reference_title: "Phenotypic variability in Patau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most frequent cytogenetic abnormality is free and homogeneous trisomy 13 (80.0%), rarely being detected trisomy mosaics or Robertsonian translocations."
    explanation: Establishes free homogeneous trisomy 13 as the predominant (~80%) cytogenetic form.
- name: Mosaic or translocation trisomy 13
  display_name: Mosaic trisomy 13 or Robertsonian translocation
  description: >-
    Mosaic trisomy (two cell lines) or a Robertsonian translocation. Mosaic cases
    typically show a less dysmorphic appearance and longer survival than full
    trisomy 13.
  evidence:
  - reference: PMID:25943247
    reference_title: "Cutaneous manifestations in trisomy 13 mosaicism: A rare case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a rule, the phenotype is mitigated to a less dysmorphic appearance and longer survival"
    explanation: Documents the milder phenotype and longer survival of mosaic trisomy 13.
prevalence:
- population: Live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 6.7
  rate_low: 5.0
  rate_high: 10.0
  notes: >-
    Incidence ~1 in 10,000 to 1 in 20,000 (5-10 per 100,000). Live-born prevalence
    is reduced by high in-utero and perinatal mortality.
  evidence:
  - reference: PMID:24340511
    reference_title: "Phenotypic variability in Patau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patau syndrome has an incidence of 1/10.000-20.000, the clinical diagnosis being suggested by the triad cleft lip and palate, microphthalmia/anophthalmia and postaxial polydactyly."
    explanation: Provides the incidence range and the diagnostic clinical triad.
pathophysiology:
- name: Trisomy 13 (Extra Chromosome 13)
  biological_scale: MOLECULAR
  description: >-
    Presence of a third copy of chromosome 13 — free homogeneous trisomy (most
    cases), mosaic trisomy, or a Robertsonian translocation.
  evidence:
  - reference: PMID:24340511
    reference_title: "Phenotypic variability in Patau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most frequent cytogenetic abnormality is free and homogeneous trisomy 13 (80.0%), rarely being detected trisomy mosaics or Robertsonian translocations."
    explanation: Establishes the causal lesion and its cytogenetic forms.
  downstream:
  - target: Chromosome 13 Gene Dosage Imbalance
    causal_link_type: DIRECT
    description: The extra chromosome raises the dosage of all chromosome 13 genes.
- name: Chromosome 13 Gene Dosage Imbalance
  biological_scale: MOLECULAR
  description: >-
    Increased dosage across chromosome 13 genes disrupts midline and forebrain
    development and multiple organ systems, producing a variably expressive pattern
    of severe malformations rather than acting through a single critical gene.
  evidence:
  - reference: PMID:24340511
    reference_title: "Phenotypic variability in Patau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patau syndrome is a disease with variable expression and is characterized by a pattern of abnormal prenatal development characterized by facial dysmorphia, polydactyly and severe birth defects (heart, brain) that generate an increased in utero and perinatal mortality."
    explanation: Describes the variably expressive multisystem malformation pattern and its mortality.
  downstream:
  - target: Impaired Forebrain/Midline Development
    causal_link_type: DIRECT
    description: Disruption of forebrain and midline development, with holoprosencephaly at the severe end.
  - target: Congenital Heart Defects
    causal_link_type: DIRECT
  - target: Postaxial Polydactyly
    causal_link_type: DIRECT
- name: Impaired Forebrain/Midline Development
  biological_scale: TISSUE
  description: >-
    Failure of normal forebrain cleavage and midline development produces
    holoprosencephaly (up to cyclopia at the severe extreme) and midline facial
    clefting.
  locations:
  - preferred_term: forebrain
    term:
      id: UBERON:0001890
      label: forebrain
  evidence:
  - reference: PMID:24340511
    reference_title: "Phenotypic variability in Patau syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "postaxial polydactyly (7 cases), scalp defects (6 cases), congenital heart anomalies (10 cases, 6 patients with atrial septal defect), complete holoprosencephaly (4 cases), ear abnormalities (11 cases), broad nasal root (10 cases)"
    explanation: Documents holoprosencephaly among the malformation counts in the cohort.
  downstream:
  - target: Holoprosencephaly
    causal_link_type: DIRECT
  - target: Orofacial Cleft
    causal_link_type: DIRECT

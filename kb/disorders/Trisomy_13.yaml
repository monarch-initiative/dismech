    explanation: Provides the incidence range and the diagnostic clinical triad.
pathophysiology:
- name: Trisomy 13 (Extra Chromosome 13)
  biological_scale: MOLECULAR
  description: Presence of a third copy of chromosome 13 — free homogeneous trisomy (most cases), mosaic
    trisomy, or a Robertsonian translocation.
  biological_processes:
  - preferred_term: chromosome segregation
    modifier: ABNORMAL
    term:
      id: GO:0007059
      label: chromosome segregation
  notes: The chromosome segregation term records how the lesion arises. In free trisomy the nondisjunction
    happens in a parental gamete, and in Robertsonian cases the lesion is an unbalanced translocation;
    it does not describe ongoing missegregation in the patient's own cells.
  evidence:
  - reference: PMID:24340511
    reference_title: Phenotypic variability in Patau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most frequent cytogenetic abnormality is free and homogeneous trisomy 13 (80.0%), rarely
      being detected trisomy mosaics or Robertsonian translocations.
    explanation: Establishes the causal lesion and its cytogenetic forms.
  downstream:
  - target: Chromosome 13 Gene Dosage Imbalance
    causal_link_type: DIRECT
    description: The extra chromosome raises the dosage of all chromosome 13 genes.
- name: Chromosome 13 Gene Dosage Imbalance
  biological_scale: MOLECULAR
  description: Increased dosage across chromosome 13 genes disrupts midline and forebrain development
    and multiple organ systems, producing a variably expressive pattern of severe malformations rather
    than acting through a single critical gene.

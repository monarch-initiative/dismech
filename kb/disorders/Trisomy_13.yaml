genetic:
- name: Trisomy 13 (extra chromosome 13)
  association: Causal
  relationship_type: CAUSATIVE
  features: Free homogeneous trisomy 13 (~80%), mosaic trisomy 13, or Robertsonian translocation involving
    chromosome 13
  notes: Presence of an extra copy of chromosome 13 — free homogeneous trisomy (~80%, typically meiotic
    nondisjunction), mosaic trisomy, or a Robertsonian translocation (copy-number gain). No coordinate
    slot exists in the schema; the whole-chromosome gain is recorded here in prose.
  evidence:
  - reference: PMID:24340511
    reference_title: Phenotypic variability in Patau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most frequent cytogenetic abnormality is free and homogeneous trisomy 13 (80.0%), rarely
      being detected trisomy mosaics or Robertsonian translocations.
    explanation: Gives the cytogenetic breakdown of the causative trisomy.
diagnosis:
- name: Karyotype Analysis
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  description: Cytogenetic karyotyping confirming the presence of a third copy of chromosome 13 (free
    homogeneous trisomy, mosaicism, or Robertsonian translocation), prompted by characteristic prenatal
    or neonatal malformations.
  presence: 47,XX,+13 or 47,XY,+13
  results: Free trisomy 13 (~80%), mosaic trisomy 13, or unbalanced Robertsonian translocation involving
    chromosome 13.
  notes: Clinical diagnosis suggested by the triad; confirmed cytogenetically (karyotype), often prenatally.
  evidence:
  - reference: PMID:24340511
    reference_title: Phenotypic variability in Patau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the clinical diagnosis being suggested by the triad cleft lip and palate, microphthalmia/anophthalmia
      and postaxial polydactyly
    explanation: The clinical triad prompts cytogenetic confirmation of trisomy 13.
  - reference: PMID:24340511
    reference_title: Phenotypic variability in Patau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The retrospective study was conducted on a trial group of 14 cases diagnosed cytogenetically
      with trisomy 13 between January 2000 and December 2012 at lasi Medical Genetics Centre.
    explanation: The cases in this cohort were confirmed by cytogenetic analysis.
treatments:
- name: Supportive and Palliative Care
  action_category: THERAPEUTIC
  description: No curative therapy exists. Management is supportive and individualized — respiratory,
    feeding, and cardiac support with attention to the severe malformation burden; intensity of care is
    decided with the family.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24340511
    reference_title: Phenotypic variability in Patau syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Patau syndrome is a disease with variable expression and is characterized by a pattern of
      abnormal prenatal development characterized by facial dysmorphia, polydactyly and severe birth defects
      (heart, brain) that generate an increased in utero and perinatal mortality.
    explanation: Reports the severe brain and heart malformations and high perinatal mortality that the
      supportive and palliative care described here responds to. The paper does not itself discuss management,
      so this supports the treatment only through that inference.
  - reference: PMID:30855930
    reference_title: Patau Syndrome (Archived).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Recently, there have been reports of several cases of longer survival due to aggressive medical
      therapy.
    explanation: A clinical review reporting that more intensive medical intervention has lengthened survival
      in some patients, which is why the intensity of care is an individualized decision rather than fixed
      palliation.
- name: Genetic Counseling
  action_category: COUNSELING_INFORMATIONAL
  description: Genetic counseling for affected families regarding cytogenetic etiology (free trisomy,
    mosaicism, or Robertsonian translocation), recurrence risk, and variable prognosis, particularly in
    mosaic cases where survival and phenotypic severity vary widely.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25943247
    reference_title: 'Cutaneous manifestations in trisomy 13 mosaicism: A rare case and review of the
      literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As a rule, the phenotype is mitigated to a less dysmorphic appearance and longer survival,
      making genetic counseling a difficult task.
    explanation: Highlights the importance and complexity of genetic counseling in trisomy 13, especially
      for mosaic cases with variable survival and phenotype.

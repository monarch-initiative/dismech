  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Autosomal trisomy caused by an extra copy of chromosome 13 (free trisomy, mosaicism, or Robertsonian
      translocation).
    evidence:
    - reference: PMID:24340511

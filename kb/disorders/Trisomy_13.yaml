  rate_per_100000: 6.7
  rate_low: 5.0
  rate_high: 10.0
  notes: Incidence ~1 in 10,000 to 1 in 20,000 (5-10 per 100,000). Live-born prevalence is reduced by
    high in-utero and perinatal mortality.

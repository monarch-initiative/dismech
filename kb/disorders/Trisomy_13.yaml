name: Trisomy 13
creation_date: '2026-08-22T00:00:00Z'
description: Trisomy 13 (Patau syndrome) is an autosomal trisomy caused by the presence of an extra chromosome
  13 — most often free, homogeneous trisomy, less commonly mosaic trisomy or a Robertsonian translocation.
  Whole-chromosome gene-dosage imbalance disrupts midline and forebrain development and multiple organ
  systems, producing the classic clinical triad of cleft lip/palate, microphthalmia/anophthalmia, and
  postaxial polydactyly, together with holoprosencephaly, congenital heart defects, scalp defects, ear
  anomalies, and capillary hemangiomas. Expression is highly variable, and the severe birth defects (brain
  and heart) drive high in-utero and perinatal mortality.
category: Genetic
synonyms:
- Patau syndrome
- trisomy 13 syndrome
- complete trisomy 13
parents:
- hereditary disease
- chromosomal disorder

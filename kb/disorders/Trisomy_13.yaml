        being detected trisomy mosaics or Robertsonian translocations.
      explanation: Establishes trisomy 13 as a chromosomal genetic disorder.
has_subtypes:
- name: Full trisomy 13
  display_name: Free, homogeneous trisomy 13
  description: The most common form (~80%) — three complete copies of chromosome 13 in all cells from
    meiotic nondisjunction; associated with the full, severe phenotype.
  evidence:
  - reference: PMID:24340511
    reference_title: Phenotypic variability in Patau syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most frequent cytogenetic abnormality is free and homogeneous trisomy 13 (80.0%), rarely
      being detected trisomy mosaics or Robertsonian translocations.
    explanation: Establishes free homogeneous trisomy 13 as the predominant (~80%) cytogenetic form.
- name: Mosaic or translocation trisomy 13
  display_name: Mosaic trisomy 13 or Robertsonian translocation
  description: Mosaic trisomy (two cell lines) or a Robertsonian translocation. Mosaic cases typically
    show a less dysmorphic appearance and longer survival than full trisomy 13.
  evidence:
  - reference: PMID:25943247
    reference_title: 'Cutaneous manifestations in trisomy 13 mosaicism: A rare case and review of the
      literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As a rule, the phenotype is mitigated to a less dysmorphic appearance and longer survival
    explanation: Documents the milder phenotype and longer survival of mosaic trisomy 13.

pathophysiology:
- name: ANO10 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Most disease alleles are truncating (frameshift, nonsense, canonical
    splice) and predicted to abolish anoctamin 10; a minority are missense or
    in-frame. Three tested missense disease variants are expressed and reach
    the ER but fail to complement TMEM16K-null cells.

- name: Impaired ER Phospholipid Scrambling
  biological_scale: MOLECULAR
  description: >-
    TMEM16K is an ER-resident, calcium-regulated phospholipid scramblase with
    non-selective ion channel activity, structurally a TMEM16 scramblase rather
    than a plasma-membrane chloride channel. TMEM16K-null fibroblasts lose
    calcium-induced phosphatidylserine redistribution in the ER. The older
    description of ANO10 as a calcium-activated chloride channel is not
    supported by whole-cell recordings.
  molecular_functions:
  - preferred_term: phospholipid scramblase activity
    term:
      id: GO:0017128
      label: phospholipid scramblase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:31477691
    reference_title: "The structural basis of lipid scrambling and inactivation in the endoplasmic reticulum scramblase TMEM16K."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that TMEM16K is an ER-resident lipid scramblase with a requirement for short chain lipids and calcium for robust activity."
    explanation: Reconstitution and localisation establish the normal function that is lost.
  - reference: PMID:31217287
    reference_title: "Predominant localization of phosphatidylserine at the cytoplasmic leaflet of the ER, and its TMEM16K-dependent redistribution."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This Ca2+-induced PtdSer redistribution was not observed in TMEM16K-null fibroblasts, but was recovered in these cells by reexpressing TMEM16K."
    explanation: Loss of TMEM16K abolishes ER scrambling in cells.
  - reference: PMID:31477691
    reference_title: "The structural basis of lipid scrambling and inactivation in the endoplasmic reticulum scramblase TMEM16K."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "However, the currents detected in TMEM16K-transfected cells did not differ from those seen in mock-transfected cells in either condition (Fig. 1e, f), suggesting that TMEM16K is not trafficked to PM and/or does not mediate PM Ca2+-activated currents."
    explanation: Refutes the plasma-membrane calcium-activated chloride channel model of ANO10 used in early SCAR10 reports.
  downstream:
  - target: Defective Endosomal Retrograde Sorting
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32620747
      reference_title: "TMEM16K is an interorganelle regulator of endosomal sorting."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our study further implicates TMEM16K lipid scrambling activity in endosomal sorting at these sites."
      explanation: Scramblase-domain chimeras tie scrambling to the sorting function.
- name: Defective Endosomal Retrograde Sorting
  biological_scale: CELLULAR
  description: >-
    TMEM16K forms ER-endosome contact sites with RAB7-positive endosomes.
    TMEM16K-null mouse fibroblasts fail to return CI-MPR and cholera toxin B
    from endosomes to the trans-Golgi network and show impaired endolysosomal
    acidification, while endocytosis and the biosynthetic pathway are
    unaffected. This has not been examined in neurons.
  biological_processes:
  - preferred_term: retrograde transport, endosome to Golgi
    term:
      id: GO:0042147
      label: retrograde transport, endosome to Golgi
    modifier: DECREASED
  evidence:
  - reference: PMID:32620747
    reference_title: "TMEM16K is an interorganelle regulator of endosomal sorting."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether, these data demonstrate that depletion of the ER-resident protein TMEM16K perturbs endosomal retrograde trafficking, a defect similar to that observed upon depletion of known cargo-sorting components"
    explanation: Retrograde trafficking defect in knockout fibroblasts.
  downstream:
  - target: Lower Motor Neuron and Neuromuscular Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same knockout mice have progressive neuromuscular dysfunction, but a
      causal link from the fibroblast sorting defect to neurons is not shown.
    evidence:
    - reference: PMID:32620747
      reference_title: "TMEM16K is an interorganelle regulator of endosomal sorting."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Loss of TMEM16K function led to impaired endosomal retrograde transport and neuromuscular function, one of the symptoms of SCAR10."
      explanation: Co-occurrence in one model; the authors do not test causation.
  - target: Cerebellar Cortical Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed by analogy with endolysosomal defects in other neurodegenerations; not tested in cerebellum.
    evidence:
    - reference: PMID:35648332

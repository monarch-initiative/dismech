    evidence_source: OTHER
    snippet: "HP:0002073 | Progressive cerebellar ataxia | Very frequent (99-80%)"
    explanation: Orphanet frequency annotation.
  - reference: PMID:25089919
    reference_title: "Autosomal recessive cerebellar ataxia type 3 due to ANO10 mutations: delineation and genotype-phenotype correlation study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at onset was 33 years (range, 17-43 years), and the disease progression was slow."
    explanation: Onset age and slow progression.
  - reference: PMID:38469933
    reference_title: "ANO10-Related Spinocerebellar Ataxia: MDSGene Systematic Literature Review and a Romani Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common variant was c.1150_1151del, found in all 29 patients of Romani ancestry, who had a 14-year earlier mean age at onset than patients homozygous for other LOF variants."

- category: Neurological
  name: Progressive cerebellar ataxia
  description: >-
    Slowly progressive ataxia is present in all patients; onset is usually
    adult (mean 33 years, range 17-43 in the French series; 27-53 in the
    Italian series), about 14 years earlier in Romani c.1150_1151del
    homozygotes. Disability is severe by the sixth decade.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    onset:

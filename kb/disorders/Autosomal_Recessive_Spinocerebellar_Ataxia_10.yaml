genetic:
- name: ANO10
  gene_term:
    preferred_term: ANO10
    term:
      id: hgnc:25519
      label: ANO10
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Over 40 SCAR10-associated variants are reported (NM_018075.5), more than
    80% loss-of-function. Recurrent alleles: c.1150_1151del (p.Leu384fs), a
    Romani founder allele found homozygous in all Romani patients and
    associated with earlier onset and intellectual decline; c.132dupA
    (p.Asp45Argfs*9), the most frequent allele in the French series and
    described there as never homozygous, though a later sibship was
    homozygous for it. Missense and splice-altering alleles include
    p.Leu510Arg (the original Dutch family), c.1163-9A>G and p.Met622Val.
    No ClinGen gene-disease validity record for this pair was found in the
    local cache.
  evidence:
  - reference: PMID:21092923
    reference_title: "Targeted next-generation sequencing of a 12.5 Mb homozygous region reveals ANO10 mutations in patients with autosomal-recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant was a leucine-to-arginine substitution in the DUF 590 domain of a 16K transmembrane protein, a putative calcium-activated chloride channel encoded by anoctamin 10 (ANO10)."
    explanation: Gene discovery in the Dutch family; Serbian and French families carried further alleles.
  - reference: PMID:22008874
    reference_title: "ANO10 c.1150_1151del is a founder mutation causing autosomal recessive cerebellar ataxia in Roma/Gypsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the history and population genetics of the Roma/Gypsies, we hypothesised that p.Leu384fs could be another founder mutation in this population, whose identification in a larger number of genetically homogeneous patients will contribute to defining the phenotypic spectrum of the disorder."
    explanation: Romani founder allele.
  - reference: PMID:25089919
    reference_title: "Autosomal recessive cerebellar ataxia type 3 due to ANO10 mutations: delineation and genotype-phenotype correlation study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent mutation, a mononucleotide expansion from a polyA repeat tract (c.132dupA) that causes protein truncation, was never observed in homozygosity."
    explanation: Most frequent allele in the French series.
  - reference: PMID:31423897
    reference_title: "Cognitive characterization of SCAR10 caused by a homozygous c.132dupA mutation in the ANO10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive spinocerebellar ataxia type 10 (SCAR10) caused by a homozygous c.132dupA mutation in the anoctamin 10 gene is infrequent and little is known about its cognitive profile."
    explanation: c.132dupA does occur homozygously, contrary to the earlier French observation.
  - reference: PMID:36698452
    reference_title: "Expanding the Allelic Heterogeneity of ANO10-Associated Autosomal Recessive Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients, both of Lebanese descent, had a homozygous intronic splicing variant in ANO10 (c.1163-9A > G) that introduced a cryptic splice site acceptor, producing 2 alternative transcription products and no detectable wild-type protein."
    explanation: Intronic splice allele with absent protein.
  - reference: PMID:30515630
    reference_title: "ANO10 mutational screening in recessive ataxia: genetic findings and refinement of the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 11 ANO10 gene variants in 10 patients from 8 families (10%): 4 mutations were previously described and 7 were novel."
    explanation: Diagnostic yield of 10% among adult-onset sporadic or recessive ataxia.
animal_models:
- name: TMEM16K knockout mouse
  species: Mus musculus
  genotype: Ano10 (TMEM16K) knockout, ubiquitous and neuron-specific
  publication: PMID:32620747
  modeled_mechanisms:
  - target: Defective Endosomal Retrograde Sorting
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Knockout embryonic fibroblasts show the endosome-to-Golgi retrograde trafficking defect.
    limitations: >-
      Measured in fibroblasts, not in cerebellar neurons; the defect has not
      been shown in patient cells.
    evidence:
    - reference: PMID:32620747
      reference_title: "TMEM16K is an interorganelle regulator of endosomal sorting."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of TMEM16K leads to impaired endosomal retrograde trafficking and dysfunction in the endolysosomal pathway."
      explanation: Cellular phenotype of knockout cells.
  - target: Lower Motor Neuron and Neuromuscular Involvement
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Progressive neuromuscular junction shrinkage, hindlimb clasping and impaired ledge walking.
    limitations: >-
      Coordination was assessed only by hindlimb clasping and ledge walking;
      cerebellar histology, Purkinje cell counts and gait analysis are not
      reported, so the model does not establish cerebellar degeneration.
    evidence:
    - reference: PMID:32620747
      reference_title: "TMEM16K is an interorganelle regulator of endosomal sorting."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we find that TMEM16K knockout mice display defects in neuromuscular function and motor behaviors, corresponding to ataxic phenotypes observed in human patients."
      explanation: Motor phenotype of the knockout mouse.
- name: Ano10 null mouse
  species: Mus musculus
  genotype: Ano10-/-
  publication: PMID:27838374
  modeled_mechanisms:
  - target: Deranged Local Calcium Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Intestinal epithelial cells and peritoneal macrophages from null mice show calcium-signalling, volume-regulation and apoptosis defects.
    limitations: >-
      Only epithelial cells and macrophages were studied; no neuronal or
      neurological phenotype is reported.
    evidence:
    - reference: PMID:27838374
      reference_title: "Cellular defects by deletion of ANO10 are due to deregulated local calcium signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Similar defects were found in mouse peritoneal Ano10 null macrophages and in human THP1 macrophages with reduced ANO10 expression."
      explanation: Ex vivo cells from null mice.

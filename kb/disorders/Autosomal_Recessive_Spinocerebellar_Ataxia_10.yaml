name: Autosomal Recessive Spinocerebellar Ataxia 10
creation_date: "2026-10-15T12:30:00Z"
category: Mendelian
synonyms:
- SCAR10
- spinocerebellar ataxia, autosomal recessive 10
- autosomal recessive cerebellar ataxia type 3
- ARCA3
- ATX-ANO10
- ANO10-related ataxia
- adult-onset autosomal recessive cerebellar ataxia
description: >-
  Slowly progressive autosomal recessive cerebellar ataxia caused by biallelic,
  mostly loss-of-function, variants in ANO10 (anoctamin 10, TMEM16K) on 3p22.
  Onset is usually in adulthood (mean about 33 years, range from the teens to
  the sixth decade), earlier in Romani patients homozygous for the founder
  c.1150_1151del. Gait, limb and truncal ataxia with dysarthria and
  oculomotor signs (downbeat nystagmus, dysmetric saccades) are accompanied by
  corticospinal tract signs, marked cerebellar atrophy on MRI, and, variably,
  executive cognitive impairment, epilepsy, lower motor neuron involvement,
  sphincter disturbance and retinal or lens changes; peripheral neuropathy is
  typically absent. TMEM16K is an endoplasmic reticulum calcium-regulated
  phospholipid scramblase with weak non-selective channel activity; its loss
  impairs ER-endosome contact-site sorting and local calcium signalling, and
  low coenzyme Q10 has been found in muscle of some patients. How these
  defects lead to cerebellar degeneration is not established.

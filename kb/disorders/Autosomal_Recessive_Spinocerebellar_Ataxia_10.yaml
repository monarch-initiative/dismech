notes: >-
  MONDO:0013392 corresponds to OMIM 613728 and ORPHA:284289. Not to be
  confused with spinocerebellar ataxia 10 (SCA10), the dominant ATXN10
  pentanucleotide-repeat disorder. Peripheral neuropathy is absent in most
  series (none of nine French patients), although polyneuropathy is listed
  among inconstant features in some reports.

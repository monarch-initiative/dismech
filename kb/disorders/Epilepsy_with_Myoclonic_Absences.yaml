  - name: Ketogenic diet for glucose transporter deficiency
    description: >-
      The one genotype-directed and mechanistically corrective treatment available
      in this syndrome, and it applies only to the small group whose myoclonic
      absences are caused by SLC2A1 variants. In glucose transporter type 1
      deficiency the brain cannot import enough glucose; ketones enter by a
      different transporter that is intact, so a ketogenic diet supplies the fuel
      the broken protein cannot. That makes testing for the gene worth doing even
      though it explains few cases, because the finding changes the treatment
      rather than only the label.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Ketogenic Diet
      term:
        id: NCIT:C173168
        label: Ketogenic Diet
    evidence:
      - reference: PMID:21546317
        reference_title: >-
          Video/EEG recording of myoclonic absences in GLUT1 deficiency syndrome
          with a hot-spot R126C mutation in the SLC2A1 gene.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Glucose transporter type 1 deficiency syndrome (GLUT1DS) is an inborn
          error of brain energy metabolism characterized by impaired glucose
          transport into the brain.
        explanation: >-
          Establishes the metabolic defect that the ketogenic diet is designed to
          bypass, in a patient whose presentation was myoclonic absence epilepsy.
          Marked PARTIAL because this report characterizes the disease and the case
          rather than reporting the dietary response.
      - reference: PMID:32913944
        reference_title: >-
          Glut1 Deficiency Syndrome (Glut1DS): State of the art in 2020 and
          recommendations of the international Glut1DS study group.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Age-specific ketogenic diet therapies remain the standard of care.
        explanation: >-
          Attests to the therapy itself rather than only to the disease, which is
          what this record needed. Tagged OTHER because it is a consensus review
          statement of standard practice rather than a reported patient series.
      - reference: PMID:32913944
        reference_title: >-
          Glut1 Deficiency Syndrome (Glut1DS): State of the art in 2020 and
          recommendations of the international Glut1DS study group.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Best outcomes correlate with early treatment.
        explanation: >-
          Supports the argument for testing early rather than after prolonged
          medication failure, which is the practical reason this gene is worth
          excluding in a child with myoclonic absences.
  - name: Avoidance of carbamazepine and other seizure-aggravating drugs
    description: >-
      Sodium channel blockers aggravate generalized absence seizures, and in this
      syndrome the effect has been documented dramatically: seizure frequency rose
      from five to a hundred a day on carbamazepine and phenobarbitone, and fell on
      withdrawal. This is a mechanism-derived contraindication, not a tolerability
      issue, and it matters because the conspicuous motor component invites a
      misdiagnosis of focal epilepsy, for which carbamazepine would be a natural
      choice.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:24491945
        reference_title: Epilepsy with myoclonic absences in siblings.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Increase in the seizure frequency from 5 to 100/day was observed due to
          use of carbamazepine and phenobarbitone which decreased with its
          withdrawal and introduction of valproate.
        explanation: >-
          Documents the aggravation and its reversal on withdrawal, which is about
          as close to a within-patient controlled observation as this literature
          offers.
  - name: Corpus callosotomy for the drug-resistant atonic subgroup
    description: >-
      Disconnecting the corpus callosum interrupts the rapid interhemispheric
      spread that synchronizes generalized seizures, and it is offered when
      medication fails, particularly in the subgroup with an atonic component in
      whom drop attacks are the disabling problem. The evidence in this syndrome is
      two patients, so it is curated as encouraging and unproven, which is how the
      reporting authors describe it.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: corpus callosotomy
      term:
        id: NCIT:C15329
        label: Surgical Procedure
    target_mechanisms:
      - target: Rhythmic Myoclonus with Progressive Tonic Contraction
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical
          heterogeneity and surgical management.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Two patients with epilepsy with myoclonic absences with atonia underwent
          corpus callosotomy; one patient was seizurefree eight months after
          surgery and the other had greater than 50% seizure reduction over a
          five-month period.
        explanation: >-
          Reports the outcomes in the only two operated patients. Marked PARTIAL
          because two patients with short follow-up cannot establish efficacy, and
          the authors say so.
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical
          heterogeneity and surgical management.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Corpus callosotomy was performed in two of these patients with
          encouraging seizure response thus far, however, the efficacy of this
          treatment should be further evaluated in a larger study.
        explanation: >-
          The authors' own statement of the evidential limits, which is why this
          record is framed as an option rather than a recommendation.
diagnosis:
  - name: Video-electroencephalography with surface electromyography
    description: >-
      The diagnostic test, and the reason the syndrome is under-recognized. The
      electroencephalogram alone shows generalized three-hertz spike-wave and
      looks like childhood absence epilepsy. What makes the diagnosis is
      simultaneous electromyography from the deltoids showing myoclonic bursts
      locked to each discharge on a rising baseline of tonic contraction. Without
      video and polygraphy the diagnosis is routinely missed.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Generalized three-hertz spike-wave with time-locked myoclonic bursts on
      surface electromyography, superimposed on a progressively increasing tonic
      contraction.
    evidence:
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          as such, despite an ECG, the diagnosis may be missed in the absence of
          video documentation of the seizure and/or adequate polygraphy
        explanation: >-
          States directly that the diagnosis depends on video and polygraphy rather
          than on the electroencephalogram alone.
      - reference: PMID:24491945
        reference_title: Epilepsy with myoclonic absences in siblings.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Myoclonic absences (MAs) were characterized by rhythmic, bilateral,
          synchronous, symmetric 3-Hz spike-wave discharges, associated with EMG
          myoclonic bursts at 3 Hz, superimposed on a progressively increasing
          tonic muscle contraction.
        explanation: >-
          Describes the polygraphic findings reported in the results field.
  - name: Brain MRI
    description: >-
      Imaging does not diagnose the syndrome; it decides which version of it the
      child has. A normal scan is consistent with the idiopathic form, and a
      structural abnormality reclassifies the case as symptomatic, which carries
      the worse prognosis and is the arm the outcome controversy in this entry
      turns on. That makes imaging part of the diagnostic pathway rather than an
      optional extra, and it is also the first test named in the proposed
      experiment of that discussion.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    results: >-
      Normal in the idiopathic form; a structural abnormality reclassifies the
      case as symptomatic.
    evidence:
      - reference: PMID:40380288
        reference_title: Research progress on epilepsy with myoclonic absence.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          magnetic resonance imaging (MRI) serving to exclude structural
          etiologies
        explanation: >-
          States the role of imaging in the diagnostic workup for this syndrome,
          alongside the polygraphic recording this entry already curates.
  - name: Lumbar puncture with paired CSF and blood glucose
    description: >-
      The test that finds the one treatable cause. Glucose transporter type 1
      deficiency is diagnosed by a low cerebrospinal fluid glucose against a
      normal blood glucose, and it is worth doing in a child with myoclonic
      absences precisely because a positive result changes the treatment to a
      ketogenic diet rather than only changing the label. It closes the loop the
      genetic section and the diet record open.
    diagnosis_term:
      preferred_term: Lumbar Puncture
      term:
        id: NCIT:C15327
        label: Lumbar Puncture
    results: >-
      Low cerebrospinal fluid glucose with low to low-normal lactate against
      normal blood values indicates glucose transporter type 1 deficiency.
    evidence:
      - reference: PMID:32913944
        reference_title: >-
          Glut1 Deficiency Syndrome (Glut1DS): State of the art in 2020 and
          recommendations of the international Glut1DS study group.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The principal diagnostic tool is a lumbar puncture showing low CSF
          glucose and low to low-normal lactate concentrations in the setting of
          normal blood glucose and lactate concentrations.
        explanation: >-
          States the diagnostic test and its expected result for the one cause in
          this syndrome that has a specific therapy.
  - name: Cytogenetic testing (karyotype or chromosomal microarray)
    description: >-
      Worth doing rather than relying on a gene panel alone, because the reported
      chromosomal causes of this syndrome are copy number changes that sequencing
      a gene list will not find. Trisomy 12p is the best-documented example, and
      the authors of that report argue from it that myoclonic absences can be a
      direct or indirect consequence of a chromosomal abnormality in at least some
      patients. This is the test that separates the symptomatic form from the
      idiopathic one when imaging is unrevealing.
    diagnosis_term:
      preferred_term: Cytogenetic Analysis
      term:
        id: NCIT:C18280
        label: Cytogenetic Analysis
    results: >-
      A copy number abnormality in the symptomatic minority; normal in the
      idiopathic form.
    evidence:
      - reference: PMID:9545186
        reference_title: Trisomy 12p and epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our patient and other sporadic reports in the literature seem to support
          the hypothesis that, at least in some cases, myoclonic absences can be a
          direct or indirect effect of a chromosomopathy.
        explanation: >-
          States the authors' inference that a chromosomal abnormality can produce
          this seizure syndrome, which is the rationale for testing for one.
      - reference: PMID:9545186
        reference_title: Trisomy 12p and epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We report the case of a 6-year-2-month-old female affected by trisomy 12p
          syndrome. Seizures were typical myoclonic absences from both the clinical
          and EEG points of view.
        explanation: >-
          The worked case, with seizures typical of the syndrome on both clinical
          and electrographic grounds, which is what makes it evidence for the
          syndrome rather than for a lookalike.
differential_diagnoses:
  - name: Childhood Absence Epilepsy
    disease_term:
      preferred_term: childhood absence epilepsy
      term:
        id: MONDO:0010826
        label: childhood absence epilepsy
    description: >-
      The nearest neighbour and the entity from which this syndrome is hardest to
      separate, because the electroencephalographic discharge is the same. The
      separation rests entirely on the motor phenomena, which is exactly why the
      distinctness of the syndrome is disputed.
    distinguishing_features:
      - Absences are unaccompanied by rhythmic myoclonus locked to the discharge.
      - No progressive tonic contraction raising the arms during the seizure.
      - Female preponderance rather than the male preponderance of myoclonic absences.
      - Higher rate of spontaneous remission and better medication response overall.
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The ictal EEG shows bilateral, synchronous and symmetrical spike and wave
          discharges repeated at 3 Hz (similar to that observed in typical absences
          of childhood absence epilepsy) in strict relation with myoclonias
          recorded on EMG.
        explanation: >-
          Establishes the electrographic identity with childhood absence epilepsy
          and the motor coupling that is the only difference, which is what makes
          this differential both necessary and difficult.
  - name: Epilepsy with Myoclonic-Atonic Seizures
    disease_term:
      preferred_term: epilepsy with myoclonic atonic seizures
      term:
        id: MONDO:0014633
        label: epilepsy with myoclonic atonic seizures
    description: >-
      A nomenclature trap as much as a clinical one. The names differ by one word
      and this entry now curates an atonic seizure phenotype in 40 percent of
      patients, so the two are easy to conflate on paper. The seizures are not the
      same event: there the myoclonic jerk and the loss of tone are one sequence
      producing a fall, here the jerks are locked to each spike-wave cycle on a
      rising background of tonic contraction, and the atonic component when present
      is an additional feature rather than the defining one.
    distinguishing_features:
      - The defining seizure is a myoclonic-atonic drop attack, not an absence with cycle-locked myoclonus.
      - Consciousness is not the primary casualty; the fall is.
      - Classified by the ILAE among the developmental and epileptic encephalopathies rather than among the generalized epilepsies.
      - No progressive tonic contraction building through the seizure.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          developmental and/or epileptic encephalopathies, comprising five
          syndromes: epilepsy with myoclonic-atonic seizures, Lennox-Gastaut
          syndrome, developmental and/or epileptic encephalopathy with
          spike-and-wave activation in sleep, hemiconvulsion-hemiplegia-epilepsy
          syndrome, and febrile infection-related epilepsy syndrome.
        explanation: >-
          Places epilepsy with myoclonic-atonic seizures in the encephalopathy
          category while this entry's syndrome sits among the generalized
          epilepsies, which is the classificatory basis of the distinction and the
          reason the near-identical names denote different things.
  - name: Epilepsy with Eyelid Myoclonia
    disease_term:
      preferred_term: epilepsy with eyelid myoclonia
      term:
        id: MONDO:0015346
        label: epilepsy with eyelid myoclonia
    description: >-
      The third ILAE childhood generalized syndrome, and the other one defined by
      an absence with a myoclonic accompaniment. The distinction is topographic:
      the jerking is confined to the eyelids rather than being diffuse and axial.
    distinguishing_features:
      - Myoclonus is confined to the eyelids with upward eye deviation.
      - Eye closure and photic stimulation are the characteristic triggers.
      - No progressive axial tonic contraction.
    evidence:
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          MA need to be distinguished from absences with other types of prominent
          myoclonic accompaniment (perioral, eyelid, limbs).
        explanation: >-
          States explicitly that absences with other patterns of myoclonic
          accompaniment, eyelid among them, must be separated from myoclonic
          absences.
  - name: Lennox-Gastaut Syndrome
    disease_term:
      preferred_term: Lennox-Gastaut syndrome
      term:
        id: MONDO:0016532
        label: Lennox-Gastaut syndrome
    description: >-
      Both a differential and a destination: some children with epilepsy with
      myoclonic absences evolve into Lennox-Gastaut syndrome, so the distinction is
      partly a matter of when in the course the child is seen.
    distinguishing_features:
      - Slow spike-wave at 1.5 to 2.5 hertz rather than three-hertz spike-wave.
      - Tonic seizures in sleep are mandatory and are not a feature of myoclonic absences.
      - Multiple seizure types with a diffusely abnormal background from the outset.
    evidence:
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These patients may experience cognitive deterioration and, in some cases,
          evolution towards a more severe form of epilepsy, including the
          Lennox-Gastaut syndrome.
        explanation: >-
          Establishes the evolution that makes this both a differential and a
          possible outcome of the same disease.
discussions:
  - discussion_id: ema_distinct_syndrome_or_absence_variant
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Is epilepsy with myoclonic absences a distinct syndrome, or is it childhood
      absence epilepsy with a prominent myoclonic accompaniment that happens to
      have been named separately?
    attaches_to:
      - pathophysiology#Hypersynchronous Three-Hertz Thalamocortical Spike-Wave Oscillation
      - pathophysiology#Cycle-Locked Recruitment of Motor Output
    rationale: >-
      The syndrome was defined on a seizure type rather than on an etiology, an
      age, or a gene, and the literature that defined it now describes it as a
      somewhat controversial entity in those words. The case for distinctness is
      real: the motor recruitment is not a soft accompaniment but a
      cycle-by-cycle coupling with a separate progressive tonic component, the sex
      ratio runs the opposite way to childhood absence epilepsy, drug resistance is
      commoner, and a subset evolve toward Lennox-Gastaut, which typical absences
      do not. The case against is equally real: the electroencephalographic
      discharge is explicitly described as similar to that of childhood absence
      epilepsy, no distinct genetic or structural basis has been identified, and
      myoclonic components have since been described across a range of generalized
      epilepsies with absences, which erodes the specificity of the original
      defining observation. If myoclonic accompaniments form a continuum, then
      where this syndrome ends and childhood absence epilepsy with myoclonia begins
      is a matter of degree, and the boundary is drawn by whoever is holding the
      electromyography leads. The practical stake is not trivial: the label carries
      a worse prognosis and a lower threshold for surgical referral, so
      misassignment in either direction changes what a family is told.
    proposed_experiments:
      - experiment_id: exp_ema_quantitative_myoclonus_continuum
        name: Quantitative polygraphic comparison across absence syndromes
        description: >-
          Apply identical quantitative electromyographic analysis, measuring burst
          amplitude, the proportion of discharge cycles carrying a burst, and tonic
          baseline drift, to unselected children with absence seizures across the
          syndromes, and test whether the distribution is bimodal, which would
          support two entities, or continuous, which would support one.
        decision_criterion: >-
          A bimodal distribution with a gap between myoclonic absences and other
          absences with myoclonic accompaniment would support distinctness. A
          continuous distribution would show the boundary is conventional, and the
          syndrome would be better modeled as a severity region of a spectrum.
      - experiment_id: exp_ema_genetic_architecture_comparison
        name: Shared versus distinct genetic architecture with childhood absence epilepsy
        description: >-
          Compare common-variant liability and rare-variant burden between children
          meeting criteria for epilepsy with myoclonic absences and children with
          childhood absence epilepsy, ascertained in the same centres with the same
          polygraphic protocol.
        decision_criterion: >-
          A shared genetic architecture would support one spectrum with the motor
          phenotype as a modifier. A distinguishable architecture would support two
          entities and would give the syndrome a basis beyond its seizure
          semiology.
    evidence:
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          epilepsy with myoclonic absences (EMA) stands out as a somewhat
          controversial entity
        explanation: >-
          States the controversy in the literature's own words, which is what makes
          this a curated dispute rather than a curator's doubt.
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          the sound and evident clinical characteristics on which it was identified
          some 30 years ago have evolved, mostly as a consequence of changes in the
          practical management of epilepsies and to the description of myoclonic
          components in a variety of other generalised epilepsies with absences
        explanation: >-
          Gives the specific reason the boundary has eroded, namely that the
          defining feature turned out not to be unique to this syndrome.
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          generalized epilepsies, comprising three syndromes: childhood absence
          epilepsy, epilepsy with myoclonic absence, and epilepsy with eyelid
          myoclonia
        explanation: >-
          Records the opposing position, that the ILAE currently treats this as one
          of three distinct childhood generalized syndromes, which is why this entry
          models it as a syndrome while flagging the dispute.
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          The ictal EEG shows bilateral, synchronous and symmetrical spike and wave
          discharges repeated at 3 Hz (similar to that observed in typical absences
          of childhood absence epilepsy) in strict relation with myoclonias
          recorded on EMG.
        explanation: >-
          Supports the lumping side by asserting electrographic similarity, and the
          splitting side by asserting strict motor coupling. Marked PARTIAL because
          it cuts both ways.
  - discussion_id: ema_why_is_the_motor_system_recruited
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Why does a three-hertz thalamocortical spike-wave discharge drive rhythmic
      myoclonus and a building tonic contraction in this syndrome, when the same
      discharge produces a motionless stare in childhood absence epilepsy?
    attaches_to:
      - pathophysiology#Cycle-Locked Recruitment of Motor Output
      - pathophysiology#Hypersynchronous Three-Hertz Thalamocortical Spike-Wave Oscillation
    rationale: >-
      This is the central unexplained fact of the syndrome and it is unusually
      well-posed, because the confounder is controlled by nature: the oscillation
      is described as similar in the two conditions, so whatever differs is
      downstream of it. Several accounts are available and none has been tested
      against the others. The discharge may involve motor cortex in this syndrome
      and not in childhood absence epilepsy, which is a straightforward
      source-localization question that modern high-density recording could answer
      and apparently has not. The coupling between cortical discharge and
      corticospinal output may be abnormally strong, which is a corticomuscular
      coherence question. The tonic component may not share a generator with the
      jerks at all, since it builds progressively rather than following the
      three-hertz rhythm, which would suggest a separate brainstem or
      reticulospinal contribution running in parallel. Or the difference may lie in
      developmental maturation of descending motor pathways, which would predict
      that age at onset, later here than in childhood absence epilepsy, is part of
      the explanation rather than an incidental demographic fact. Answering this
      would also bear directly on the nosological dispute curated alongside it,
      because a demonstrated difference in generator would settle the question of
      whether this is a separate entity.
    proposed_experiments:
      - experiment_id: exp_ema_source_localization_and_corticomuscular_coherence
        name: Source localization and corticomuscular coherence across absence syndromes
        description: >-
          High-density electroencephalography with simultaneous multi-muscle
          electromyography during spontaneous seizures in both syndromes, with
          source reconstruction of the discharge and measurement of
          corticomuscular coherence, testing whether motor cortex participates in
          the discharge in myoclonic absences and not in typical absences, and
          whether the cortex-to-muscle coupling differs in strength.
        decision_criterion: >-
          Motor cortex participation or stronger corticomuscular coherence specific
          to myoclonic absences would locate the difference in the cortical
          generator. Indistinguishable source and coherence would push the
          explanation subcortically, toward the descending pathways or the
          brainstem.
      - experiment_id: exp_ema_tonic_component_generator
        name: Separating the tonic component from the myoclonic component
        description: >-
          Analyse the progressive tonic contraction independently of the
          three-hertz bursts, relating its build-up to discharge features and to
          brainstem reflex measures, to test whether it is a slow envelope of the
          same cortical drive or an independently generated phenomenon.
        decision_criterion: >-
          A tonic component that tracks discharge parameters would indicate a
          single cortical generator with two output timescales. A tonic component
          that varies independently and correlates with brainstem measures would
          establish a second generator, and would explain why this syndrome sits
          closer than typical absence epilepsy to the tonic-seizure epilepsies it
          sometimes evolves into.
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The ictal EEG shows bilateral, synchronous and symmetrical spike and wave
          discharges repeated at 3 Hz (similar to that observed in typical absences
          of childhood absence epilepsy) in strict relation with myoclonias
          recorded on EMG.
        explanation: >-
          Establishes both premises of the gap: the discharge is similar between
          syndromes, and the motor coupling is strict, so the difference must lie
          downstream of the oscillation.
      - reference: PMID:24491945
        reference_title: Epilepsy with myoclonic absences in siblings.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Myoclonic absences (MAs) were characterized by rhythmic, bilateral,
          synchronous, symmetric 3-Hz spike-wave discharges, associated with EMG
          myoclonic bursts at 3 Hz, superimposed on a progressively increasing
          tonic muscle contraction.
        explanation: >-
          Documents that the tonic component is superimposed on rather than
          rhythmic with the bursts, which is the observation motivating the
          two-generator hypothesis.
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Neurophysiologically, axial hypertonia and rhythmic jerks may be recorded
          on polygraphic surface electromyogram leads in association with the
          typical SW discharges
        explanation: >-
          Confirms that both motor components are measurable with routine
          polygraphy, which is what makes the proposed experiments feasible rather
          than aspirational.
  - discussion_id: ema_two_diseases_behind_one_seizure
    kind: CONTROVERSY
    status: OPEN
    prompt: >-
      The outcome splits sharply according to whether generalized tonic-clonic
      seizures accompany the myoclonic absences. Are these two different diseases
      sharing a seizure type, or one disease with a severity gradient?
    attaches_to:
      - pathophysiology#Drug-Resistant Course with Cognitive Decline in a Subset
      - pathophysiology#Heritable Thalamocortical Susceptibility
    rationale: >-
      The prognostic split is unusually clean for a childhood epilepsy. Children
      with myoclonic absences as their only seizure type generally respond to
      combination therapy and do well; children who also have generalized
      tonic-clonic seizures often persist, deteriorate cognitively, or move toward
      Lennox-Gastaut syndrome. The two-disease reading takes the associated
      tonic-clonic seizures as a marker of a different underlying condition, most
      obviously a symptomatic form with a structural or chromosomal cause that
      happens to express myoclonic absences among its seizure types; the literature
      already distinguishes idiopathic from symptomatic forms, which gives this
      reading a foothold. The one-disease reading takes the tonic-clonic seizures
      as a severity marker of the same liability, on the grounds that additional
      seizure types accompany greater severity across the generalized epilepsies
      generally, and notes that no distinct etiology has actually been demonstrated
      for the worse-outcome group. A newer case series complicates both by
      identifying an atonic component as a separate and strong predictor of
      medication failure, three quarters of that subgroup failing to reach seizure
      freedom, which suggests the relevant stratification may not be the one the
      older literature drew. The stake is prognostic honesty: a family told at
      diagnosis that this syndrome usually responds well to valproate and
      ethosuximide is being given the statistics of a subgroup their child may not
      belong to.
    proposed_experiments:
      - experiment_id: exp_ema_etiology_stratified_outcome_cohort
        name: Etiology-stratified outcome cohort with systematic investigation
        description: >-
          A multicentre cohort in which every child meeting polygraphic criteria
          receives the same investigation, including high-resolution imaging,
          chromosomal microarray, and epilepsy gene panel, with outcome recorded
          against both the presence of generalized tonic-clonic seizures and the
          presence of an identified etiology and of an atonic component.
        decision_criterion: >-
          If poor outcome tracks identified etiology rather than seizure
          co-occurrence, the two-disease reading is supported and the prognosis
          should be given on etiology. If poor outcome tracks seizure co-occurrence
          independently of etiology, it is a severity marker within one disease.
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The evolution is variable and seems to depend on the existence or not of
          GTCS.
        explanation: >-
          States the prognostic split that this discussion is about.
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The more benign cases usually present with MA as the only seizure type,
          while patients who experience other seizures, especially generalised
          tonic-clonic seizures, in association with MA may have a less favourable
          outcome.
        explanation: >-
          Independent statement of the same split, which is what makes it a stable
          observation rather than one group's impression.
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical
          heterogeneity and surgical management.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Of patients with an atonic component, 75% did not achieve seizure freedom
          with medication alone.
        explanation: >-
          Identifies a different stratifying feature from the one the older
          literature emphasizes. Marked PARTIAL because ten patients cannot settle
          which stratification matters, but it is enough to show the question is
          open.
      - reference: PMID:24491945
        reference_title: Epilepsy with myoclonic absences in siblings.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Idiopathic and symptomatic EMAs need to be differentiated from childhood
          absence epilepsy with myoclonia.
        explanation: >-
          Establishes that an idiopathic and a symptomatic form are already
          recognized, which is the foothold for the two-disease reading.

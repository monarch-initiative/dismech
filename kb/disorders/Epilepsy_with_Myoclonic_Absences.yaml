        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Classical cotherapy with valproate and ethosuximide with appropriate
          plasma levels is more efficient if myoclonic absences are non-associated
          with GTCS.
        explanation: >-
          States both the combination and the patient group in which it works,
          which is the practical content of this record.
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Modern therapeutic combinations, such as valproic acid and ethosuximide,
          or valproic acid and lamotrigine, are usually effective; however, in a
          proportion of patients, seizures are resistant to drug treatment.
        explanation: >-
          Confirms the combination and names an alternative. Marked PARTIAL because
          it also records that a proportion of patients do not respond, so this is
          not a claim of reliable efficacy.
  - name: Valproate with lamotrigine
    description: >-
      The other combination named alongside valproate and ethosuximide as usually
      effective. It is worth curating separately from the topiramate record
      because the two sit on opposite sides of a small disagreement: the sibling

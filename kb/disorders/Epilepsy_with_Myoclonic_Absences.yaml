        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ten patients were identified including twins with myoclonic absence
          status epilepticus. Forty percent had an atonic component, 20% presented
          with myoclonic absence status epilepticus and 60% had incomplete control
          of seizures at last follow-up visit.
        explanation: >-
          Documents status epilepticus as a presenting feature and quantifies it.
  - category: Neurologic
    name: EEG abnormality with three-hertz generalized spike-wave
    description: >-
      Bilateral, synchronous, symmetrical spike-wave discharge at three per second,
      indistinguishable in itself from that of childhood absence epilepsy, and
      diagnostic only when recorded with simultaneous electromyography that shows
      the jerks locked to it.
    phenotype_term:
      preferred_term: EEG abnormality
      term:
        id: HP:0002353
        label: EEG abnormality
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The ictal EEG shows bilateral, synchronous and symmetrical spike and wave
          discharges repeated at 3 Hz (similar to that observed in typical absences
          of childhood absence epilepsy) in strict relation with myoclonias
          recorded on EMG.
        explanation: >-
          Describes the electrographic pattern and its indistinguishability from
          childhood absence epilepsy in isolation.
  - category: Neurologic
    name: Cognitive deterioration
    description: >-
      A subset of children, concentrated among those with drug-resistant seizures
      and associated generalized tonic-clonic seizures, decline cognitively rather
      than remaining stable.
    phenotype_term:
      preferred_term: Intellectual disability
      term:
        id: HP:0001249
        label: Intellectual disability
      clinical_course: PROGRESSIVE
    evidence:
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These patients may experience cognitive deterioration and, in some cases,
          evolution towards a more severe form of epilepsy, including the
          Lennox-Gastaut syndrome.
        explanation: >-
          Documents cognitive deterioration in the drug-resistant subset.
genetic:
  - name: SLC2A1
    gene_term:
      preferred_term: SLC2A1
      term:
        id: hgnc:11005
        label: SLC2A1
    relationship_type: CAUSATIVE
    association: >-
      Glucose transporter type 1 deficiency, caused by SLC2A1 variants, usually
      produces typical absences but can present with myoclonic absences. This is
      the single most management-relevant genetic cause in the syndrome, because
      the disease is an energy-delivery failure rather than a channel problem and
      it has a specific treatment: ketones reach the brain by a different
      transporter, so a ketogenic diet bypasses the broken one. A child with
      myoclonic absences who is not responding as expected is a child worth
      testing for this.
    evidence:
      - reference: PMID:21546317
        reference_title: >-
          Video/EEG recording of myoclonic absences in GLUT1 deficiency syndrome
          with a hot-spot R126C mutation in the SLC2A1 gene.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Here we describe a novel Turkish patient with a hot-spot mutation (R126C)
          in the SLC2A1 gene who presented with unusual myoclonic absence epilepsy
          and paroxysmal shivering.
        explanation: >-
          A documented case of myoclonic absence epilepsy caused by an SLC2A1
          variant, which is what puts this gene in the differential.
      - reference: PMID:21546317
        reference_title: >-
          Video/EEG recording of myoclonic absences in GLUT1 deficiency syndrome
          with a hot-spot R126C mutation in the SLC2A1 gene.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although typical absences are frequent in GLUT1DS, myoclonic absence
          seizures are rarely reported.
        explanation: >-
          Places the association honestly: this presentation is rare within
          glucose transporter deficiency, so the gene is a cause to exclude rather
          than a common explanation for the syndrome.
  - name: SYNGAP1
    gene_term:
      preferred_term: SYNGAP1
      term:
        id: hgnc:11497
        label: SYNGAP1
    relationship_type: CAUSATIVE
    association: >-
      Disruption of SYNGAP1, which encodes an NMDA-receptor-associated protein,
      has been reported in a patient with this syndrome and intellectual
      disability, through a de novo balanced translocation that truncated the
      gene. The mechanistic interest is that it lands on the glutamatergic
      synapse rather than on the thalamic calcium channels that absence epilepsy
      genetics usually implicates.
    evidence:
      - reference: PMID:22050443
        reference_title: >-
          A balanced translocation disrupts SYNGAP1 in a patient with intellectual
          disability, speech impairment, and epilepsy with myoclonic absences
          (EMA).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Herein, we describe a patient with EMA and intellectual disability who
          carries a de novo balanced translocation: t(6;22)(p21.32;q11.21).
        explanation: >-
          Documents the case and the de novo structural rearrangement that
          implicated this gene.
      - reference: PMID:22050443
        reference_title: >-
          A balanced translocation disrupts SYNGAP1 in a patient with intellectual
          disability, speech impairment, and epilepsy with myoclonic absences
          (EMA).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the breakpoint at 6p21.32 was found to truncate the
          N-methyl-d-aspartate (NMDA)-receptor associated gene SYNGAP1
        explanation: >-
          Identifies the disrupted gene and its synaptic function, which is what
          makes this a mechanistic observation rather than a coincidence of
          location.
      - reference: PMID:22050443
        reference_title: >-
          A balanced translocation disrupts SYNGAP1 in a patient with intellectual
          disability, speech impairment, and epilepsy with myoclonic absences
          (EMA).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The underlying etiology of EMA is unknown in the majority of patients.
        explanation: >-
          States plainly that most cases have no identified cause, which is why
          this section lists individual reported genes rather than claiming a gene
          panel for the syndrome.
prevalence:
  - population: Children with epilepsy
    measure_type: UNKNOWN
    prevalence_class: RARE
    notes: >-
      No population-based estimate is available. The syndrome is described as rare
      in the contemporary literature, and the largest recent single-centre series
      identified ten patients over four years, which indicates the order of
      magnitude rather than a rate.
    evidence:
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical
          heterogeneity and surgical management.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Epilepsy with myoclonic absences is a rare epilepsy syndrome with
          distinct features and high rates of drug resistance.
        explanation: >-
          Supports the qualitative rarity band and the drug-resistance claim.
progression:
  - phase: Onset in mid-childhood with daily myoclonic absences
    age_range: Around seven years
    notes: >-
      Onset averages about seven years, with a male preponderance, which
      distinguishes it demographically from childhood absence epilepsy where girls
      predominate. Seizures are frequent from the outset.
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The age at onset is about 7 years. There is a male preponderance.
        explanation: >-
          States the onset age and sex distribution described in this phase.
  - phase: Divergent course determined largely by associated seizure types
    age_range: Childhood into adolescence
    notes: >-
      Children whose only seizure type is the myoclonic absence generally respond
      to combination therapy. Those with associated generalized tonic-clonic
      seizures often do not, and may persist, deteriorate cognitively, or evolve
      toward a more severe generalized epilepsy.
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The evolution is variable and seems to depend on the existence or not of
          GTCS.
        explanation: >-
          States the prognostic dependence that defines this phase.
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          In cases where GTCS are associated, there is often an unfavourable
          outcome, with persistence of myoclonic absences or with modification of
          the epilepsy with a possible evolution towards a generalized cryptogenic
          or symptomatic form.
        explanation: >-
          Describes the unfavourable trajectory in the associated-seizure group.
treatments:
  - name: Valproate with ethosuximide
    description: >-
      The classical combination, and it works considerably better in the group
      without generalized tonic-clonic seizures. The two drugs act on different
      parts of the same mechanism, ethosuximide on the thalamic T-type calcium
      current that sustains the oscillation and valproate more broadly, which is
      the rationale for combining them rather than escalating either alone.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986

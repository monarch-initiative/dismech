references:
  - reference: PMID:15737698
    title: Epilepsy with myoclonic absences.
  - reference: PMID:17044728
    title: Epilepsy with myoclonic absences.
  - reference: PMID:35770757
    title: >-
      Epilepsy with myoclonic absences: a case series highlighting clinical
      heterogeneity and surgical management.
notes: >-
  Scope note. This entry models epilepsy with myoclonic absences as a distinct
  ILAE syndrome, which is how it is currently classified, while recording
  explicitly that its status as a separate entity is disputed in the literature
  rather than settled. The dispute is not a curation quibble: the syndrome was
  defined on a seizure type, and myoclonic components have since been described in
  several other generalized epilepsies with absences, so the boundary depends on
  where one draws the line between a defining feature and an accompaniment. That
  argument is curated in the discussions block.

  On the mechanism graph. The thalamocortical oscillation modeled here is
  deliberately described in the same terms as the sibling Childhood Absence
  Epilepsy and Juvenile Absence Epilepsy entries, because the electrographic
  discharge really is the same three-per-second generalized spike-wave. What this
  entry adds is a separate node for the cycle-locked recruitment of the motor
  system, which is the only thing that distinguishes the seizure, and which is
  where the unexplained biology sits.

  Module conformance note. Two nodes conform to
  epilepsy_excitation_inhibition_imbalance. As in the other absence entries, the
  module is joined at the hyperexcitability and recurrent-seizure nodes rather
  than at its ion-channel trigger, since no single channel defect is established
  for this syndrome.
inheritance:
  - name: Presumed polygenic, mostly sporadic
    description: >-
      No single-gene inheritance pattern is established. Most cases are sporadic,
      although sibling pairs are reported, and the syndrome sits within the
      genetic generalized epilepsies whose liability is generally polygenic. A
      minority of cases are symptomatic, occurring on the background of an
      identifiable structural or chromosomal abnormality, and those are not
      heritable in the same sense at all.
    inheritance_term:
      preferred_term: Sporadic
      term:
        id: HP:0003745
        label: Sporadic
    evidence:
      - reference: PMID:24491945
        reference_title: Epilepsy with myoclonic absences in siblings.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          To describe the clinical, electroencephalographic features, treatment
          strategies and outcome in this first case series of two siblings with
          normal intelligence presenting with EMAs.
        explanation: >-
          Documents familial occurrence in siblings, which is what makes a genetic
          contribution likely. Marked PARTIAL because two siblings establish
          familial aggregation, not a mode of inheritance.
      - reference: PMID:24491945
        reference_title: Epilepsy with myoclonic absences in siblings.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Idiopathic and symptomatic EMAs need to be differentiated from childhood
          absence epilepsy with myoclonia.
        explanation: >-
          Establishes that the syndrome has both idiopathic and symptomatic forms,
          which is why no single inheritance statement covers it.
pathophysiology:
  - name: Heritable Thalamocortical Susceptibility
    biological_scale: MOLECULAR
    description: >-
      The syndrome behaves like the other genetic generalized epilepsies at this
      level: a heritable liability to abnormal thalamocortical oscillation, with
      no single causal gene established and sibling recurrence reported. A subset
      of children instead have a symptomatic form on the background of a
      structural or chromosomal abnormality, reaching the same oscillation from a
      different starting point.
    biological_processes:
      - preferred_term: regulation of postsynaptic membrane potential
        term:
          id: GO:0060078
          label: regulation of postsynaptic membrane potential
        modifier: ABNORMAL
    downstream:
      - target: Hypersynchronous Three-Hertz Thalamocortical Spike-Wave Oscillation
    evidence:
      - reference: PMID:24491945
        reference_title: Epilepsy with myoclonic absences in siblings.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Idiopathic and symptomatic EMAs need to be differentiated from childhood
          absence epilepsy with myoclonia.
        explanation: >-
          Supports the split between idiopathic and symptomatic forms that this
          node represents. Marked PARTIAL because it asserts the distinction
          without characterizing the genetic architecture of the idiopathic arm.
  - name: Hypersynchronous Three-Hertz Thalamocortical Spike-Wave Oscillation
    biological_scale: CELLULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      The engine of the seizure is the same thalamocortical loop oscillation that
      produces typical absences, discharging bilaterally, synchronously, and
      symmetrically at three per second. The literature makes the equivalence
      explicit, comparing it directly to the discharge of childhood absence
      epilepsy. Because the oscillation itself is shared, nothing about this node
      explains what makes the syndrome different; the difference is entirely in
      what the oscillation is coupled to downstream.
    cell_types:
      - preferred_term: pyramidal neuron
        term:
          id: CL:0000598
          label: pyramidal neuron
    downstream:
      - target: Cycle-Locked Recruitment of Motor Output
      - target: Impairment of Awareness
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The ictal EEG shows bilateral, synchronous and symmetrical spike and wave
          discharges repeated at 3 Hz (similar to that observed in typical absences
          of childhood absence epilepsy) in strict relation with myoclonias
          recorded on EMG.
        explanation: >-
          States both halves of what this entry turns on: the discharge is the same
          as in childhood absence epilepsy, and it is in strict temporal relation
          with the muscle jerks.
      - reference: PMID:24491945
        reference_title: Epilepsy with myoclonic absences in siblings.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Myoclonic absences (MAs) were characterized by rhythmic, bilateral,
          synchronous, symmetric 3-Hz spike-wave discharges, associated with EMG
          myoclonic bursts at 3 Hz, superimposed on a progressively increasing
          tonic muscle contraction.
        explanation: >-
          Independent polygraphic confirmation of the frequency-matched coupling
          between the discharge and the muscle bursts.
  - name: Cycle-Locked Recruitment of Motor Output
    biological_scale: CELLULAR
    description: >-
      This is the node that makes the syndrome what it is. Each spike-wave cycle
      is accompanied by a muscle burst at the same three-per-second rate, and the
      relation is described as strict rather than approximate, which is what
      distinguishes a driven motor output from an incidental one. Superimposed on
      the rhythmic jerks is a tonic contraction that builds progressively through
      the seizure, raising the arms, and it is a separate phenomenon from the
      jerks rather than their summation. Why the same oscillation engages motor
      cortex and corticospinal output here and not in childhood absence epilepsy
      is not known, and is recorded as a knowledge gap.
    biological_processes:
      - preferred_term: regulation of postsynaptic membrane potential
        term:
          id: GO:0060078
          label: regulation of postsynaptic membrane potential
        modifier: ABNORMAL
    downstream:
      - target: Rhythmic Myoclonus with Progressive Tonic Contraction
    evidence:
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Neurophysiologically, axial hypertonia and rhythmic jerks may be recorded
          on polygraphic surface electromyogram leads in association with the
          typical SW discharges
        explanation: >-
          Establishes that both the tonic and the myoclonic components are
          measurable motor phenomena time-locked to the discharge, which is the
          content of this node.
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy with myoclonic absences is characterized clinically by absences
          accompanied by marked, diffuse, rhythmical myoclonias, often associated
          with a progressive tonic contraction.
        explanation: >-
          Names the two motor components and their relationship to the absence,
          which is what this node models.
  - name: Impairment of Awareness
    biological_scale: ORGANISM
    description: >-
      The absence itself, produced by the same thalamocortical discharge that
      produces it in any other absence epilepsy. Impairment is typically partial
      rather than complete, which combined with the conspicuous motor activity is
      why these events are sometimes mistaken for something other than seizures.
    downstream:
      - target: Drug-Resistant Course with Cognitive Decline in a Subset
    evidence:
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Myoclonic absences (MA) are described as typical absences with sudden
          onset and offset that are associated with generalised spike and wave (SW)
          discharges on the ECG, with distinctive traits.
        explanation: >-
          Establishes the absence component and its abrupt onset and offset, which
          is the feature shared with typical absences.
  - name: Rhythmic Myoclonus with Progressive Tonic Contraction
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      The visible seizure: rhythmic bilateral jerking of shoulders, arms, and legs
      at three per second, with the arms rising progressively as axial tone builds.
      Seizures occur many times a day, which is part of why the syndrome is
      disabling out of proportion to the individual event. In a substantial
      minority an atonic component is present instead of or alongside the tonic
      one, and those children do markedly worse on medication.
    downstream:
      - target: Myoclonic Absence Status Epilepticus
      - target: Drug-Resistant Course with Cognitive Decline in a Subset
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These seizures occur many times a day.
        explanation: >-
          Documents the seizure frequency that makes this syndrome disabling.
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical
          heterogeneity and surgical management.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Of patients with an atonic component, 75% did not achieve seizure freedom
          with medication alone.
        explanation: >-
          Documents the atonic subgroup and its markedly worse medication response,
          which is the clinical fact that motivates surgical consideration.
  - name: Myoclonic Absence Status Epilepticus
    biological_scale: ORGANISM
    description: >-
      A prolonged state in which the seizure pattern becomes continuous rather
      than repetitive, reported as the presenting problem in a fifth of one case
      series. It is worth curating separately because it is easy to miss: a child
      in this state looks confused and jerky rather than obviously convulsing.
    evidence:
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical
          heterogeneity and surgical management.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ten patients were identified including twins with myoclonic absence
          status epilepticus. Forty percent had an atonic component, 20% presented
          with myoclonic absence status epilepticus and 60% had incomplete control
          of seizures at last follow-up visit.
        explanation: >-
          Quantifies the frequency of status as a presentation, and of incomplete
          control, in a contemporary series.
  - name: Drug-Resistant Course with Cognitive Decline in a Subset
    biological_scale: ORGANISM
    description: >-
      The outcome splits, and it splits along a line that is visible at diagnosis.
      Children whose only seizure type is the myoclonic absence generally do well
      on combination therapy. Children who also have generalized tonic-clonic
      seizures do worse, and a subset deteriorate cognitively or evolve toward
      Lennox-Gastaut syndrome. Whether that reflects two different diseases wearing
      the same seizure or one disease with variable severity is unresolved and is
      curated as a discussion.
    evidence:
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These patients may experience cognitive deterioration and, in some cases,
          evolution towards a more severe form of epilepsy, including the
          Lennox-Gastaut syndrome.
        explanation: >-
          Documents the adverse trajectory that this node represents.
      - reference: PMID:17044728
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The more benign cases usually present with MA as the only seizure type,
          while patients who experience other seizures, especially generalised
          tonic-clonic seizures, in association with MA may have a less favourable
          outcome.
        explanation: >-
          States the prognostic split and the feature that predicts it, which is
          what makes the outcome heterogeneity structured rather than random.
phenotypes:
  - category: Neurologic
    name: Myoclonic absence seizure
    description: >-
      The defining seizure: an absence with rhythmic bilateral myoclonic jerking at
      three per second, time-locked to the spike-wave discharge, with a
      progressively building tonic contraction of the shoulders and arms.
    phenotype_term:
      preferred_term: Myoclonic absence seizure
      term:
        id: HP:0011150
        label: Myoclonic absence seizure
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy with myoclonic absences is characterized clinically by absences
          accompanied by marked, diffuse, rhythmical myoclonias, often associated
          with a progressive tonic contraction.
        explanation: >-
          States the defining seizure and its two motor components.
  - category: Neurologic
    name: Generalized tonic-clonic seizure
    description: >-
      Present in a substantial minority and prognostically important: its presence
      marks the group with the less favourable outcome and the poorer medication
      response.
    phenotype_term:
      preferred_term: Bilateral tonic-clonic seizure
      term:
        id: HP:0002069
        label: Bilateral tonic-clonic seizure
    frequency: FREQUENT
    evidence:
      - reference: PMID:15737698
        reference_title: Epilepsy with myoclonic absences.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Associated seizures are present in 2/3 of the cases, the most frequent
          association being GTCS in 45%.
        explanation: >-
          Reports generalized tonic-clonic seizures in 45 percent of patients with
          the syndrome, within the FREQUENT band of 30 to 79 percent. The
          denominator is all patients with the syndrome rather than a
          poor-outcome-selected subgroup, so the estimate is not circular.
  - category: Neurologic
    name: Atonic seizure
    description: >-
      An atonic component, a loss of tone rather than the usual build of it,
      occurs in a substantial minority and appears to matter more than its
      frequency suggests. Children with it are markedly less likely to reach
      seizure freedom on medication, and it is the feature that prompts surgical
      consideration. It is also the candidate stratifying variable in the
      outcome controversy curated below.
    phenotype_term:
      preferred_term: Atonic seizure
      term:
        id: HP:0010819
        label: Atonic seizure
    frequency: FREQUENT
    evidence:
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical
          heterogeneity and surgical management.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ten patients were identified including twins with myoclonic absence
          status epilepticus. Forty percent had an atonic component, 20% presented
          with myoclonic absence status epilepticus and 60% had incomplete control
          of seizures at last follow-up visit.
        explanation: >-
          Four of ten patients had an atonic component, which is 40 percent and
          falls in the FREQUENT band. The denominator is all patients in the
          series rather than a subgroup selected on outcome, so the estimate is not
          circular. Ten patients is a small base, which is why no narrower band is
          claimed.
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical
          heterogeneity and surgical management.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Of patients with an atonic component, 75% did not achieve seizure freedom
          with medication alone.
        explanation: >-
          Documents why this phenotype earns its own record rather than being a
          descriptive detail: it identifies the subgroup that medication fails.
  - category: Neurologic
    name: Myoclonic absence status epilepticus
    description: >-
      A prolonged continuous form of the seizure state, reported as the presenting
      problem in a fifth of one contemporary series.
    phenotype_term:
      preferred_term: Myoclonic absence status epilepticus
      term:
        id: HP:0032865
        label: Myoclonic absence status epilepticus
    evidence:
      - reference: PMID:35770757
        reference_title: >-
          Epilepsy with myoclonic absences: a case series highlighting clinical

name: Epilepsy with Myoclonic Absences
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  A childhood generalized epilepsy whose defining seizure is an absence that you
  can see happening. The child stops, as in any absence, but at the same time the
  shoulders and arms jerk rhythmically about three times a second, and the arms
  rise steadily as a tonic contraction builds through the seizure. The
  electroencephalogram shows the same three-per-second generalized spike-wave as
  childhood absence epilepsy, but here each spike is locked to a muscle jerk that
  can be recorded on surface electromyography. That motor recruitment is the
  whole mechanistic interest of the syndrome: the same thalamocortical
  oscillation that produces a silent stare in one epilepsy drives the motor system
  in this one, and nobody knows why. Seizures happen many times a day, respond
  poorly to medication in a substantial minority, and a subset of children
  deteriorate cognitively or evolve toward Lennox-Gastaut syndrome.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - EMA
  - myoclonic absence epilepsy
  - epilepsy with myoclonic absence
  - Tassinari syndrome
classifications:
  harrisons_chapter:
    - classification_value: NEUROLOGIC
      notes: >-
        An ILAE-recognized childhood generalized epilepsy syndrome, managed
        neurologically.

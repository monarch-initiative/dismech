name: Hearing Loss Autosomal Recessive 116
category: Mendelian
creation_date: "2026-09-07T00:00:00Z"
synonyms:
- DFNB116
- deafness, autosomal recessive 116
- CLDN9-related hearing loss
- autosomal recessive nonsyndromic deafness 116
description: >-
  DFNB116 is autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic
  variants in CLDN9, which encodes claudin-9, a constituent of the bicellular tight junctions
  of the epithelia that line the scala media. Three families are reported with functional
  support - a Turkish family with the truncating c.86delT (p.Leu29ArgfsTer4), and Pakistani
  and Moroccan families with the hypomorphic p.(Glu159Lys) and p.(Ile124dup) alleles - plus
  one further individual whose p.(Cys25Trp) allele is proposed rather than established.

  The mechanism this entry curates is a paracellular ion barrier failure, and it is worth
  being precise about which compartment fails, because "tight junction gene, therefore
  endolymph barrier" is the intuitive story and it is not quite what was measured. In the
  Cldn9 nmf329 mouse the endocochlear potential and the endolymphatic potassium
  concentration are both normal - the stria vascularis works - while the *perilymphatic*
  potassium concentration is raised. Claudin-9 sits in a subapical subdomain of the hair
  cell junctional complex, underneath the more apical strands built by other claudins, and
  what its loss does is let potassium leak from the endolymph past those outer strands to
  the basolateral face of the hair cell. Hair cells then die, from the cochlear base
  upward. That the potassium is what kills them is not inferred: outer hair cell loss is
  prevented by culturing the explanted organ of Corti in low potassium, and in vivo by
  deleting pou3f4 to collapse the endocochlear driving force.

  None of that has been measured in a human cochlea. The human evidence is segregation in
  consanguineous families plus heterologous-cell and structural-modelling work on the
  variant proteins; the barrier mechanism reaches humans by inference from the mouse, and
  the pathophysiology nodes downstream of the protein defect are marked PROVISIONAL for
  that reason. The mouse also diverges from the human phenotype in a way that matters: it
  is uniformly deaf across frequencies, whereas the human audiogram characteristically
  spares the low frequencies and slopes steeply above 1 kHz.

  Clinically, DFNB116 is a mild-to-profound, often asymmetric loss whose reported onset
  ranges from prelingual to adolescence, and which is progressive in some families and
  stable over a decade in others. That milder end is the ascertainment point the second
  report makes explicitly - recessive deafness genetics has concentrated on profound
  congenital cases, and CLDN9 is a gene to consider when the loss is moderate.

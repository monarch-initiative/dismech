notes: >-
  Curated from the three primary reports - the founding Turkish family, the two-family
  replication, and the Cldn9 mouse - plus a claude_code deep-research sweep used as a lead
  generator. Scope decisions worth recording:

  The fourth reported individual, with p.(Cys25Trp) and fluctuating hearing loss, is excluded
  from the phenotype and prevalence sections and handled as an open question instead; its
  primary report was available only as an abstract, which contains no CLDN9 sentence, so
  every statement about it here is quoted from the second study's description of it rather
  than from the source.

  Both device treatments are curated without evidence and say so in their own notes. Neither
  primary report describes the audiological management of a single affected patient, so
  citing a general hearing-loss source for them would attribute to DFNB116 something no
  source says about DFNB116. Note this is a plain statement, not the `review_notes` waiver
  sentinel, which applies only to `environmental:` entries.

  The pathophysiology chain deliberately stops short of conforming its final node to
  sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss, because progression is
  contradicted in one of the three families.

  It also declines that module's Cochlear Amplification Loss and Spiral Ganglion Neuron
  Degeneration node, for a separate reason: no CLDN9 source reports spiral ganglion
  neurons at all, in the nmf329 mouse or in patients. That is absence of evidence rather
  than a contradicted claim, so the node is left unconformed instead of being asserted
  from the module.

  GeneReviews PMID:20301607 is carried in the top-level references: block as a
  bibliographic tag only. Its cached abstract is a statement of the chapter's purpose
  with no mention of CLDN9 or claudin, so nothing in it is quotable and no evidence item
  cites it.

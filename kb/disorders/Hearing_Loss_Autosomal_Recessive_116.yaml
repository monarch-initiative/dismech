inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic CLDN9 variants, homozygous in all three functionally supported families, each
    of which is consanguineous or from a population where consanguinity is common.
    Heterozygous carriers are unaffected: the father in the Turkish family had a normal
    audiogram, and carriers in the Pakistani and Moroccan families were asymptomatic. The
    same recessive pattern holds in the mouse, where heterozygotes are audiometrically
    indistinguishable from wild type.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing of all four family members showed co-segregation of the variant with the phenotype as an autosomal recessive trait in the family"
    explanation: Recessive segregation of the truncating allele in the founding Turkish family.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical examinations and medical histories in both families did not reveal other clinically relevant phenotypes and carriers of the variants were asymptomatic"
    explanation: >-
      Carriers unaffected in both subsequently reported families, and no extra-auditory
      features - the two claims that make this recessive and nonsyndromic.
genetic:
- name: CLDN9
  notes: >-
    CLDN9 (16p13.3) is a single-coding-exon gene encoding claudin-9, a tetraspan integral
    membrane protein of bicellular tight junctions with two extracellular loops. EL1 carries
    the charged residues that set paracellular ionic selectivity and mediates trans-interaction
    with the claudin on the opposing membrane; EL2 mediates cis-interaction between claudins
    within the same membrane. Three disease alleles have functional support: the truncating
    c.86delT (p.Leu29ArgfsTer4), which falls at the start of EL1 and is a probable functional
    null - notable because a premature stop in a single-exon gene is unlikely to trigger
    nonsense-mediated decay, so the truncated protein may persist without functioning; and two
    hypomorphs, p.(Glu159Lys), which is predicted to disturb one of the two cis-interactions
    while leaving membrane targeting intact, and p.(Ile124dup), which locally misfolds the
    protein and fails to reach the membrane.

    Do not read across from the other claudins. CLDN14 (hgnc:2035) causes DFNB29 and is a
    separate nonsyndromic deafness entity; CLDN1 causes NISCH syndrome and CLDN19
    hypomagnesemia 5. CLDN9 is also similar in sequence to CLDN6, which matters practically:
    the 2021 study had to show its Cldn9 in situ probe was not detecting Cldn6.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE

pathophysiology:
- name: CLDN9 Truncating Loss of Function
  description: >-
    The founding allele, homozygous c.86delT (p.Leu29ArgfsTer4), truncates claudin-9 at the
    start of the first extracellular loop. Because CLDN9 has a single coding exon, a
    premature stop is unlikely to trigger nonsense-mediated decay, so the truncated protein
    may be made and simply fail to work. GFP-tagged mutant protein expressed in HEK293 cells
    stays in the cytosol instead of reaching the plasma membrane, so no functional claudin-9
    is delivered to the junction.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CLDN9
    term:
      id: hgnc:2051
      label: CLDN9
  genetic_context:
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE

        reference_title: "Genetic and pharmacologic alterations of claudin9 levels suffice to induce functional and mature inner hair cells."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "with ~5-15 dB threshold elevation in the Cldn9+/T mice"
        explanation: >-
          The functional readout. Graded REFUTE because a mild stable shift is not the

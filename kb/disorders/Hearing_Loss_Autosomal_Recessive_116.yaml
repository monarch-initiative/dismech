    snippet: "The variant is predicted to cause a frameshift and produce a truncated protein (p.Leu29ArgfsTer4) in this single-exon gene."
    explanation: The predicted molecular consequence, and the single-exon architecture that bears on whether the transcript escapes decay.
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This suggests that the variant disrupts the migration of CLDN9 to the plasma membrane."
    explanation: >-
      The measured cellular consequence in transfected HEK293 cells - the mutant protein
      does not reach the membrane where a claudin has to sit to do anything.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is not known if in the inner ear truncated CLDN9 protein remained stable or was degraded."
    explanation: >-
      Records the limit of what is known. The transfected-cell result does not establish
      what the truncated protein does in a human cochlea, and the later authors say so.
- name: CLDN9 Hypomorphic Missense and In-Frame Alleles
  description: >-
    The two subsequently reported alleles retain partial function and fail in different ways.
    p.(Glu159Lys) reaches the membrane normally in MDCK-II cells; structural modelling
    predicts it perturbs one of the two cis-interactions by which adjacent claudin protomers
    oligomerise within the same membrane, so the protein is present but the strand it should
    build is compromised. p.(Ile124dup), an in-frame single-residue duplication, is predicted
    to misfold locally and does not reach the HeLa cell membrane. The authors classify both
    as hypomorphic.

    Whether that residual function explains the milder end of the clinical spectrum is not
    settled by the data: the family carrying p.(Glu159Lys) had moderate-to-profound loss that
    was stable over ten years, while the family carrying the truncating allele included a
    profoundly deaf 46-year-old. Severity and progression do not sort cleanly by allele class
    across three families.

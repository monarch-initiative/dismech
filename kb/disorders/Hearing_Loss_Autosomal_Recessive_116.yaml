discussions:
- discussion_id: cldn9_barrier_mechanism_unmeasured_in_humans
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the cochlear paracellular potassium leak demonstrated in the Cldn9 mouse actually
    occur in humans with biallelic CLDN9 variants, and is it what deafens them?
  attaches_to:
  - pathophysiology#Failure of the Claudin-9 Paracellular Ion Barrier
  - pathophysiology#Basolateral Potassium Exposure of Cochlear Hair Cells
  rationale: >-
    The barrier mechanism is well demonstrated - in mice and in transfected epithelial
    monolayers. In humans it is entirely inferential. What has been shown in affected people
    is that a CLDN9 allele segregates with hearing loss and that the encoded protein behaves
    abnormally when overexpressed in HEK293, HeLa or MDCK cells. Nobody has measured a human
    perilymphatic potassium concentration, a human endocochlear potential, or the state of a
    human cochlear tight junction, and the tissue required is not obtainable during life.

    That gap is easy to overlook because the intermediate steps are individually plausible:
    claudin-9 is a tight junction protein, it is expressed in the cochlear epithelia, and the
    mouse phenotype matches. But the entry marks each downstream node PROVISIONAL rather than
    ESTABLISHED, because two of the three human alleles fail in a way the mouse allele does
    not - they never reach the membrane, whereas F35L sits in the membrane and simply stops
    sealing. A mistrafficked claudin could in principle disturb junction assembly more
    broadly than a barrier-dead one that is correctly incorporated.

    The tractable route is not a human measurement. It is a knock-in mouse carrying a human
    allele - which is exactly what the second report proposes - with the same electrode
    measurements repeated. If a p.(Glu159Lys) or p.(Ile124dup) knock-in shows the same
    isolated perilymphatic potassium rise with a preserved endocochlear potential, the
    inference to humans becomes much stronger; if it does not, the human alleles are doing
    something else.
  evidence:
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identifying additional mutant alleles of CLDN9 and engineering animal models with the corresponding human variants could further our understanding of pathogenic mechanisms that expose therapeutic opportunities."
    explanation: >-
      The authors propose allele-matched animal models, which is the experiment that would
      close this gap.
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Since CLDN9 is involved in paracellular permeability, this deformity is likely to impair functionality."
    explanation: >-
      Included as an example of the inferential step itself. The founding paper reasons from
      claudin-9's known role to the significance of a murine morphological finding; marked
      INDIRECT because that is a plausibility argument rather than a measurement.
- discussion_id: cldn9_mouse_human_audiometric_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why is the Cldn9 mouse uniformly and severely deaf across all frequencies from the onset
    of hearing, when humans with biallelic CLDN9 variants have normal low-frequency thresholds
    and a loss that can be as mild as moderate and may not progress at all?
  attaches_to:
  - pathophysiology#Basal-Predominant Outer Hair Cell Degeneration
  - phenotypes#High-Frequency Sensorineural Hearing Impairment
  - animal_models#nmf329 Cldn9 F35L mouse
  rationale: >-
    The mismatch is not subtle. ABR thresholds in the nmf329 mouse are uniformly elevated at
    8, 16 and 32 kHz and are already severe at P16, days after hearing normally begins. The
    human phenotype is the opposite shape - normal at 500 Hz, steeply sloping above 1 kHz -
    and spans mild to profound with recognition ranging from prelingual to age 17.

    Two explanations are separable and neither has been tested. The first is allele strength:
    the mouse F35L completely eliminates barrier function in the Ussing chamber assay, while
    two of three human alleles are explicitly described as hypomorphic, so the human cochlea
    may retain enough barrier to protect the apex. The second is that the mouse histology
    itself is not uniform - degeneration begins basally and reaches the apex only with age -
    so a uniformly flat ABR deficit in an animal with a basal-predominant lesion suggests the
    mouse cochlea is more vulnerable overall, or that the ABR at P28 is already reporting a
    later stage of the same gradient the human audiogram catches early.

    This matters for more than tidiness. If the human low-frequency sparing reflects residual
    barrier function rather than a slower version of the same total loss, then the apical
    cochlea in a DFNB116 patient contains living hair cells for decades, and the therapeutic
    question is preservation rather than restoration. A knock-in of a human hypomorphic allele
    with frequency-resolved ABR and turn-by-turn hair cell counts would separate the two
    accounts.
  proposed_experiments:
  - experiment_id: cldn9_human_allele_knockin_frequency_abr
    name: Frequency-resolved audiometry and cochlear histology in a human-allele knock-in mouse
    description: >-
      Generate mice carrying the human p.(Glu159Lys) or p.(Ile124dup) allele, measure ABR
      thresholds by frequency across the lifespan, and count hair cells turn by turn. A
      hypomorphic knock-in that reproduces apical sparing would attribute the human audiogram
      shape to residual barrier function; one that is uniformly deaf like nmf329 would locate
      the difference in species biology instead.
    would_support:
    - pathophysiology#CLDN9 Hypomorphic Missense and In-Frame Alleles
    supporting_outcome:
    - >-
      Knock-in mice carrying a human hypomorphic allele show elevated high-frequency ABR
      thresholds with preserved low-frequency thresholds, and hair cell counts that are
      reduced at the base and preserved at the apex.
    would_refute:
    - pathophysiology#CLDN9 Hypomorphic Missense and In-Frame Alleles
    refuting_outcome:
    - >-
      Knock-in mice are uniformly deaf across frequencies with pan-cochlear hair cell loss,
      indistinguishable from nmf329, indicating that allele strength does not explain the
      human audiogram shape.
  evidence:
  - reference: PMID:19696885
    reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The hearing loss of nmf329/nmf329 mice was equally severe at high- and low-frequency, as indicated by the uniformly high ABR thresholds at 8, 16, and 32 kHz"
    explanation: The mouse side of the mismatch, measured across three frequencies.
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing thresholds show a normal hearing level at 500 Hz and a steep decline after 1000 Hz in both sisters."
    explanation: The human side of the mismatch, in the family with the strongest (truncating) allele.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "here we report families with two likely pathogenic CLDN9 variants both of which appear to be hypomorphic."
    explanation: >-
      The residual-function hypothesis for the mismatch - the human alleles studied so far
      are not nulls.
- discussion_id: cldn9_dosage_versus_barrier_function
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is DFNB116 caused by having too little claudin-9, or by having claudin-9 that cannot
    seal - and do the hypomorphic human alleles act on the same axis as the mouse
    barrier-dead allele?
  attaches_to:
  - pathophysiology#CLDN9 Hypomorphic Missense and In-Frame Alleles
  - pathophysiology#Failure of the Claudin-9 Paracellular Ion Barrier
  - animal_models#nmf329 Cldn9 F35L mouse
  - animal_models#Cldn9 tet-OFF conditional knockdown mouse
  rationale: >-
    Two mouse manipulations of the same gene give opposite results. The nmf329 allele leaves
    normal amounts of claudin-9 in the membrane but abolishes its ion barrier function, and
    those mice lose their hair cells and go deaf within days of hearing onset. Reducing
    claudin-9 protein roughly eightfold with a tet-OFF transgene leaves outer hair cell
    counts normal at fifteen months and shifts ABR thresholds by only 5-15 dB; what it does
    instead is generate an extra row of functional inner hair cells, implicating claudin-9
    levels in lateral inhibition of hair cell fate during a window that closes by P14.

    So quantity and barrier competence are separable axes, and DFNB116 has been explained
    entirely on the barrier axis. That is very likely right for the truncating allele, which
    delivers no functional protein to the junction at all. It is less obviously right for
    p.(Glu159Lys), which reaches the membrane normally and is predicted to perturb a
    cis-interaction - a lesion that could plausibly reduce effective claudin-9 in strands
    rather than open a leak, which the knockdown data suggest would be relatively well
    tolerated. Nobody has measured paracellular permeability for any human CLDN9 allele.

    Two things would resolve it: Ussing-chamber permeability measurements on monolayers
    expressing each human variant, the assay that established the mouse F35L allele as
    barrier-dead; and attention to whether hypomorphic-allele carriers have any of the
    developmental signature - supernumerary inner hair cells are not visible on an
    audiogram, but the reduced afferent synapse counts that accompanied them in the mouse
    would show up as a wave I amplitude deficit disproportionate to threshold.
  evidence:
  - reference: PMID:37873357
    reference_title: "Genetic and pharmacologic alterations of claudin9 levels suffice to induce functional and mature inner hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The findings suggest that Cldn9 levels coordinate embryonic and postnatal HC differentiation, making it a viable target for altering IHC development pre- and post-terminal differentiation."
    explanation: >-
      The dosage axis stated by its own authors - claudin-9 level as a developmental
      variable, separate from the barrier role that explains the disease.
  - reference: PMID:37873357
    reference_title: "Genetic and pharmacologic alterations of claudin9 levels suffice to induce functional and mature inner hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By contrast, the P14 inner ear injected with Cldn9-shRNA produced no detectable increase in ectopic IHCs as counted by three independent blinded observers"
    explanation: >-
      Bounds the developmental window to before P14, which is what makes it a separate
      phenomenon from the degeneration that begins after the second postnatal week.
  - reference: PMID:19696885
    reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In an epithelial cell line, heterologous expression of wild-type claudin-9 reduced the paracellular permeability to Na+ and K+, and the nmf329 mutation eliminated this ion barrier function without affecting the plasma membrane localization of claudin-9."
    explanation: >-
      The barrier axis, and the assay that would have to be run on the human alleles to
      place them on it.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The localization of CLDN9 with the substitution of lysine at position 159 was similar to that of the wild-type, when expressed in MDCK-II cells."
    explanation: >-
      The human allele that makes the question live: it is in the membrane, so whether it
      leaks or merely thins the strand has not been distinguished.
- discussion_id: cldn9_cys25trp_allele_uncertain
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the CLDN9 c.75C>G p.(Cys25Trp) allele reported in a child with fluctuating hearing loss
    actually pathogenic, and does fluctuating hearing loss belong in the DFNB116 phenotype?
  attaches_to:
  - genetic#CLDN9
  - phenotypes#Bilateral Sensorineural Hearing Impairment
  rationale: >-
    A fourth individual has been reported with a CLDN9 missense allele at a highly conserved
    cysteine and a steeply sloping, fluctuating audiogram. It is deliberately excluded from
    this entry's phenotype and prevalence counts. The reasons are specific rather than
    generic caution: the same individual carried variants in FLNA and ANKRD11 and had
    unrelated upper airway findings, no functional work was done on the allele, and the
    subsequent authors said in print that more evidence would be needed.

    Fluctuation is the part worth resolving, because it is not merely an extra severity tier -
    it would be a different mechanism. Nothing in the potassium-leak model predicts a hearing
    threshold that recovers, since hair cell death does not reverse. A genuinely fluctuating
    CLDN9 phenotype would imply a reversible functional disturbance of the barrier rather
    than progressive cell loss, and that would change how the whole entry reads. Establishing
    it needs functional characterisation of p.(Cys25Trp) and at least one more family.
  evidence:
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, a c.75C>G;p.(Cys25Trp) CLDN9 variant was suggested to cause fluctuating hearing loss with a steeply sloping audiogram in one individual"
    explanation: The report of the fourth allele and its distinctive fluctuating course.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individual also had variants in FLNA and ANKRD11 and exhibited turbinate hypertrophy, allergic rhinitis and nasopharyngeal nodule."
    explanation: >-
      The confounding genotype and phenotype that make the attribution to CLDN9 uncertain in
      that individual.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional experimental evidence would be useful in evaluating the predicted pathogenicity of the CLDN9 c.75C>G;p.(Cys25Trp) variant."
    explanation: The subsequent authors' own judgement that the allele is not yet established.

- name: Loss of Cochlear Transduction in the High-Frequency Base
  description: >-
    Loss of outer hair cells removes cochlear amplification where those cells have died. In
    affected humans this presents as a sensorineural loss that spares the low frequencies and
    declines steeply above 1 kHz - normal thresholds at 500 Hz with a steep drop after 1000 Hz
    in the two Turkish sisters, and thresholds worse at high than at low frequencies in both
    of the later families. This node is deliberately not conformed to the module's
    "Progressive Sensorineural Hearing Loss" consequence: progression is inconsistent across
    the reported families, so a node asserting it would overstate the human data.

    explanation: The same high-frequency-predominant configuration in an independent family.
phenotypes:
- name: Bilateral Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Bilateral sensorineural loss in every reported affected individual, ranging from mild to
    profound across families and frequently asymmetric between ears. Severity within a family
    is not uniform: the Turkish family spanned moderate in the younger sister, severe in the
    elder, and profound in the 46-year-old mother.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  sequelae:
  - target: Tinnitus
    causal_link_type: UNKNOWN
  evidence:
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three affected members of the family had sensorineural hearing loss (SNHL) ranging from moderate to profound in severity."
    explanation: Severity range in the founding family.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Audiological examinations revealed an asymmetric mild to profound hearing loss with childhood or adolescent onset."
    explanation: >-
      Extends the severity range down to mild and records the asymmetry, which is the feature
      that separates the later families from the founding one.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Audiometric testing in family HLRBS10 revealed asymmetric moderate to profound and moderate to severe bilateral hearing loss in the affected individuals IV:2 and IV:3, respectively"
    explanation: Per-individual audiometric findings in the Pakistani family.
- name: High-Frequency Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    A steeply sloping audiogram with preserved low-frequency hearing is the characteristic
    configuration, and is the clinical signature that the basal cochlea is affected first.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0001757
      label: High-frequency sensorineural hearing impairment
  evidence:
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We, therefore, conclude that CLDN9 is essential for the hair cells in the base of cochlea from early on and that c.86delT variant results in steeply sloping high frequency moderate to profound SNHL."
    explanation: The authors' characterisation of the audiometric phenotype in the founding family.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar to the report of young affected individuals with a frameshift variant of CLDN9 (Sineni et al., 2019), mild to moderate degrees of hearing loss at lower frequencies were observed in affected individuals of family HLRBS10 and F7285."
    explanation: >-
      Replication of the low-frequency-sparing configuration across all three families,
      stated as such by the later authors.
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Progression is real but inconsistent, and this is the least settled part of the clinical
    picture. In the Moroccan proband the loss was mild at first and worsened over sixteen
    years; in the Turkish family cross-sectional severity rose with age across three
    individuals and the mother's low-frequency thresholds had deteriorated, which the authors
    read as progression. Against that, the two affected siblings in the Pakistani family were
    stable over ten years of follow-up. Frequency is graded FREQUENT rather than higher for
    that reason.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hearing loss was mild to begin with for the proband (IV:4; age 35 years), however, it gradually progressed over a period of 16 years to moderate."
    explanation: Documented longitudinal progression in one individual.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, progression of hearing loss was not observed over a period of 10 years for the affected members in family HLRBS10."
    explanation: >-
      Ten years of stable thresholds in two affected individuals, which contradicts
      progression as a general feature of DFNB116 and is why this phenotype is not graded
      VERY_FREQUENT.
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the 46-year-old mother, both 500 Hz and 1000 Hz hearing levels show significant HL, suggesting that HL has progressed in the mother."
    explanation: >-
      Marked INDIRECT because the inference is cross-sectional - the mother's audiogram is
      compared with her daughters' rather than with her own earlier one. The same paper notes
      the sisters' thresholds were unchanged three years apart.
- name: Adolescent to Adult Recognition of Hearing Loss
  category: Auditory
  description: >-
    Age at recognition is late relative to most recessive nonsyndromic deafness. All three
    affected members of the Turkish family were diagnosed after age 10 and the true onset was
    never established; the Moroccan proband first noticed her loss at 17. The exception is the
    Pakistani family, where the parents described a prelingual loss. Late recognition is
    consistent with a loss that begins in the high frequencies and spares speech-critical low
    frequencies for a time, but no reported patient has documented normal audiometry followed
    by a measured decline, so onset as distinct from recognition is genuinely unknown.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  evidence:
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three affected members of the family were diagnosed after age 10 years, while age of onset was not clearly delineated."
    explanation: >-
      Late diagnosis, and the explicit statement that onset was not established - the reason
      this phenotype is about recognition rather than about onset.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her hearing loss was first noticed at the age of 17 years and it worsened progressively."
    explanation: Adolescent recognition in the Moroccan proband.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents indicated that their children had a prelingual hearing loss."
    explanation: >-
      Prelingual onset in the Pakistani family, which contradicts postlingual recognition as
      a constant feature and shows the onset range spans the whole of childhood.
- name: Tinnitus
  category: Auditory
  description: >-
    Reported by the Moroccan proband and specifically not reported by the two affected
    individuals in the Pakistani family or by her affected sister, so it is an occasional
    accompaniment rather than part of the core phenotype. Both studies asked about it
    explicitly, which is why the negatives are informative.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She also reported the presence of tinnitus."
    explanation: The one affected individual reporting tinnitus.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Tinnitus was not reported by these individuals."
    explanation: >-
      Absent in the two affected Pakistani siblings despite being asked about, which is what
      keeps this graded OCCASIONAL.
- name: Normal Vestibular Function
  category: Vestibular
  description: >-
    Balance is spared. Formal Romberg and tandem gait testing was normal in the Pakistani
    family, and the Turkish family had normal gross motor development with no vertigo,
    dizziness or nystagmus and a negative Romberg. This is a curated negative, not an
    unexamined assumption, and it matches the mouse, which has normal rotarod balance despite
    claudin-9 expression in the vestibular system.
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gross motor development was normal with no history of balance problems, vertigo, dizziness, or nystagmus."
    explanation: Clinical vestibular assessment in the founding family.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Romberg and tandem gait tests in both individuals revealed a grossly normal balance function."
    explanation: Formal bedside vestibular testing in an independent family.
  - reference: PMID:19696885
    reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Equally good balance was demonstrated by wild-type, nmf329/+, and nmf329/nmf329 mice"
    explanation: >-
      Marked INDIRECT because it is a rotarod result in mice, cited in support of a human
      clinical negative. The gene is Cldn9 and the finding is concordant with the human
      examinations above.
  notes: >-
    No HP term is bound. HP codes abnormal phenotypes, and there is no appropriate term for
    a normal vestibular examination; binding an abnormality term with a negating description
    would be worse than leaving it unbound.
prevalence:
- population: Worldwide, published families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three families with functional support - one Turkish, one Pakistani, one Moroccan -
    comprising seven affected individuals, plus one further individual with a proposed
    p.(Cys25Trp) allele that the second study judged insufficiently evidenced. No incidence
    or carrier-frequency estimate exists for any population. Every statement in this entry
    about severity, onset and progression rests on those three families, and the frequency
    gradings on the phenotypes should be read as descriptions of that handful of people
    rather than as population estimates.
  evidence:
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together with the Cldn9 deaf mouse and a homozygous frameshift of CLDN9 previously associated with deafness, the two bi-allelic variants of CLDN9 described here point to CLDN9 as a bona fide human deafness gene."
    explanation: >-
      Establishes the size of the reported evidence base at the time of the most recent
      report: two families here plus the one previously published.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our work suggests that CLDN9 represents one of a few genes, variants of which should be considered for recessively inherited mild to moderate hearing loss in humans."
    explanation: >-
      The ascertainment argument for why the count is likely an underestimate - milder
      recessive hearing loss has been systematically under-sequenced.
diagnosis:
- name: Audiometry and Vestibular Examination
  description: >-
    Pure-tone audiometry establishes the sensorineural loss and its configuration; the
    steeply sloping shape with preserved low frequencies is what makes CLDN9 worth
    considering. Balance is assessed clinically - Romberg and tandem gait - and has been
    normal in every reported patient. Temporal bone CT in the founding proband showed no
    inner ear malformation, so imaging serves to exclude structural causes rather than to
    identify this one.
  diagnosis_term:
    preferred_term: pure-tone audiometry
    term:
      id: NCIT:C38036
      label: Audiometric Test
  markers: >-
    Bilateral sensorineural loss with normal thresholds at 500 Hz and a steep decline above
    1 kHz; normal Romberg and tandem gait; no inner ear anomaly on temporal bone CT.
  evidence:
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of sensorineural HL (SNHL) was established following standard audiometric testing in a soundproofed room in accordance with current clinical standards."
    explanation: How the auditory diagnosis was made in the founding family.
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High resolution computed tomography scan of the temporal bone did not show inner ear anomalies in the proband."
    explanation: >-
      Imaging is normal, so it excludes structural causes rather than contributing a positive
      finding.
- name: Genome or Exome Sequencing after Exclusion of Common Deafness Genes
  description: >-
    DFNB116 is not clinically distinguishable from other causes of sloping sensorineural
    loss, so it is found by sequencing. All three families were solved that way - whole-genome
    sequencing in the Turkish family after every known deafness gene had been excluded, and
    exome sequencing of the probands in the other two. Homozygosity mapping is what makes it
    tractable: the Turkish variant sat in the longest of six autozygous runs. Both later
    families were connected through GeneMatcher, which is worth noting for a gene this rare -
    a single family is not enough to publish a novel gene-disease relationship.
  diagnosis_term:
    preferred_term: whole genome sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  markers: >-
    Biallelic CLDN9 variants in a run of homozygosity, after exclusion of GJB2 and the other
    established nonsyndromic deafness genes.
  evidence:
  - reference: PMID:31175426
    reference_title: "A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After filtering and excluding variants in all known deafness genes, only one variant remained mapping to an autozygous region: CLDN9 NM_020982.3:c.86delT (p.Leu29ArgfsTer4)."
    explanation: >-
      The diagnostic route in the founding family, and the reason autozygosity mapping is
      the tool that made it work.
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A research collaboration between SN and CP was established using GeneMatcher (Sobreira et al., 2015)."
    explanation: >-
      Records how the two replicating families were brought together, which is the practical
      mechanism by which an ultra-rare gene accumulates enough families to be believed.
treatments:
- name: Hearing Amplification
  description: >-
    Hearing aids are the first-line management for a mild-to-severe sloping sensorineural
    loss, fitted to the audiogram. No reported DFNB116 patient's hearing aid use is described
    in the primary literature, and no disease-modifying therapy exists.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting and auditory rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  notes: >-
    Curated without evidence, deliberately. Neither primary report describes the audiological
    management of any affected individual, so there is no source that says amplification was
    used in DFNB116 specifically. It is curated because it is the management the audiometric findings
    imply, and it is flagged here rather than supported with a quotation from a general
    hearing-loss review, which would attribute to this disease something no source says about
    it. The binding is the clinical action NCIT:C15315 Rehabilitation, not a device term:
    NCIT has no clinical-action term for hearing aid fitting, and NCIT's hearing aid term is a device
    concept outside the NCIT:C25218 Clinical Intervention or Procedure hierarchy that
    TreatmentActionTerm requires. The device concept is therefore carried as a qualifiers
    predicate-value pair (NCIT:C16830 Medical Device / NCIT:C183182 Hearing Aid), the same
    pattern the cochlear implantation entry below uses, so the device stays queryable
    without sitting in a slot it is not reachable for.

    Speech and language therapy (NCIT:C159273) is deliberately not curated as a separate
    treatment. Its yield depends on age at onset relative to language acquisition, and this
    disease's onset is precisely what is unresolved - the entry carries a REFUTE item and an
    open question on whether the loss is prelingual or postlingual. Adding a third uncited
    treatment whose indication turns on the one variable no source settles would assert more
    than the amplification and implantation entries already do.
- name: Cochlear Implantation
  description: >-
    Standard of care for the profound end of the severity range in autosomal recessive
    nonsyndromic hearing loss generally. The 46-year-old mother in the Turkish family was
    profoundly deaf and so would fall within usual candidacy criteria, but no implantation is
    reported in any DFNB116 patient, and there is nothing in the mechanism to predict an
    outcome different from other cochlear causes of deafness.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  notes: >-
    Curated without evidence, on the same basis as the amplification entry above - no
    reported DFNB116 patient's management is described anywhere. Curated because it is the
    standard option at the profound end of this disease's own reported severity range, and marked here so a reader does not mistake it for a documented DFNB116
    outcome. The device term cannot be the treatment_term - NCIT:C157820 Cochlear Implant is
    not reachable from NCIT:C25218 - so it is carried as a qualifier on the surgical action.
- name: Genetic Counselling
  description: >-
    Recurrence risk is 25% per pregnancy for the parents of an affected child. Counselling is
    material in the populations where DFNB116 has been found, all three families being
    consanguineous or from populations where consanguineous union is common, and carriers are
    entirely asymptomatic so there is no clinical way to identify them.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34265170
    reference_title: "Variants of human CLDN9 cause mild to profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical examinations and medical histories in both families did not reveal other clinically relevant phenotypes and carriers of the variants were asymptomatic"
    explanation: >-
      Carriers are clinically silent, which is what makes molecular carrier testing rather
      than examination the only route to identifying them.
animal_models:
- name: nmf329 Cldn9 F35L mouse
  species: Mouse
  genotype: Cldn9 nmf329 (p.Phe35Leu) homozygous, ENU-induced
  publication: PMID:19696885
  description: >-
    An ENU-mutagenesis mouse recovered on a deafness screen and mapped by positional cloning
    to a missense substitution in Cldn9. It is the system in which the entire mechanism of
    this entry was established, and it preceded the human gene discovery by a decade. The
    allele is instructive in its own right: F35L abolishes claudin-9's paracellular ion
    barrier function in transfected epithelial monolayers while leaving the protein correctly
    inserted in the plasma membrane, so the mouse isolates loss of barrier function from loss
    of the protein - which is not what two of the three human alleles do, since those
    mistraffic.
  genes:
  - preferred_term: CLDN9
    term:
      id: hgnc:2051
      label: CLDN9
  modeled_mechanisms:
  - target: Basolateral Potassium Exposure of Cochlear Hair Cells
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      The only system in which the ionic disturbance has been measured at all. Endolymphatic
      and perilymphatic potassium and the endocochlear potential were measured directly by
      double-barrelled microelectrode in vivo, and the causal role of potassium was then
      tested by two independent rescues.
    limitations: >-
      The measurements are murine and have no human counterpart - cochlear fluids are not
      accessible in living patients - so the claim that this ionic disturbance occurs in
      affected humans is inference from a shared gene, not observation. The mouse allele is
      also a missense that preserves membrane targeting, whereas the human truncating and
      in-frame-duplication alleles fail to reach the membrane; the endpoint is likely the
      same but the molecular route differs.
    readouts:
    - name: Perilymphatic potassium concentration
      target: Basolateral Potassium Exposure of Cochlear Hair Cells
      direction: INCREASED
      interpretation: >-
        Raised perilymphatic potassium with normal endolymphatic potassium and normal
        endocochlear potential, localising the leak to the junction rather than the stria.
      evidence:
      - reference: PMID:19696885
        reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The perilymphatic K + concentration was higher in the nmf329/nmf329 cochleas, whereas the endolymphatic K + concentration was similar in cochleas of both genotypes"
        explanation: The measurement itself, with the internal control that makes it interpretable.
    - name: Endocochlear potential
      target: Basolateral Potassium Exposure of Cochlear Hair Cells
      direction: UNCHANGED
      interpretation: >-
        A real negative result. The endocochlear battery is intact, so this is not a strial
        or endolymph-generation defect.
      evidence:
      - reference: PMID:19696885
        reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The EPs were not significantly different in the two groups"
        explanation: Direct in vivo EP measurement at P70-P80, showing no difference from littermate controls.
    evidence:
    - reference: PMID:19696885
      reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, the hair-cell loss in the claudin-9-defective cochlea was rescued in vitro when the explanted hearing organs were cultured in a low-K+ milieu and in vivo when the endocochlear K+-driving force was diminished by deletion of the pou3f4 gene."
      explanation: >-
        Two independent rescues, one ex vivo and one genetic, which is what makes this model
        informative about causation rather than only about correlation.
  - target: Basal-Predominant Outer Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the cellular lesion and its base-to-apex gradient with histology that human
      material cannot supply.
    limitations: >-
      Fidelity is graded MODERATE rather than HIGH because the audiometric consequence
      diverges: the mouse is uniformly deaf across 8, 16 and 32 kHz and severely so within
      days of hearing onset, whereas affected humans have normal low-frequency thresholds and
      a range from mild to profound with onset from prelingual to adolescence. The cellular
      lesion is shared; its severity and frequency distribution are not.
    readouts:
    - name: Outer hair cell survival by cochlear turn
      target: Basal-Predominant Outer Hair Cell Degeneration
      direction: DECREASED
      interpretation: >-
        Loss of outer hair cells beginning at the base after the second postnatal week and
        extending apically with age.
      evidence:
      - reference: PMID:19696885
        reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found a widespread loss of sensory hair cells in the hearing organs of nmf329 mice after the second week of life."
        explanation: The histological readout and its timing.
    - name: Auditory brainstem response threshold
      target: Basal-Predominant Outer Hair Cell Degeneration
      direction: DECREASED
      interpretation: >-
        Severe threshold elevation already present at P16, three to four days after the
        normal onset of hearing, and equally severe at every frequency tested.
      evidence:
      - reference: PMID:19696885
        reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The hearing loss of nmf329/nmf329 mice was equally severe at high- and low-frequency, as indicated by the uniformly high ABR thresholds at 8, 16, and 32 kHz"
        explanation: >-
          The functional readout, and the point at which the model departs from the human
          audiogram, which spares low frequencies.
    evidence:
    - reference: PMID:19696885
      reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that the hearing loss of homozygous mutant mice was already severe at P16"
      explanation: >-
        Establishes early, near-congenital severity in the mouse - the timing that the human
        phenotype does not match.
  evidence:
  - reference: PMID:19696885
    reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Positional cloning revealed that the nmf329 strain carries a missense mutation in the claudin-9 gene, which encodes a tight junction protein with unknown biological function."
    explanation: Establishes that the deafness phenotype maps to Cldn9, which is what makes this a model of DFNB116.
  - reference: PMID:19696885
    reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, the ion barrier function of claudin-9 is essential in the cochlea, but appears to be dispensable in other organs."
    explanation: >-
      Organ specificity in the mouse, which is the model's counterpart of the nonsyndromic
      presentation in humans.
  - reference: PMID:19696885
    reference_title: "A claudin-9-based ion permeability barrier is essential for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "claudin-9 mutant mice exhibited no signs of vestibular, hepatic, or renal defects"
    explanation: >-
      The specific negative findings behind that organ specificity, including the vestibular
      system where claudin-9 is expressed.
- name: Cldn9 tet-OFF conditional knockdown mouse
  species: Mouse
  genotype: Cldn9+/T tet-OFF transgenic on doxycycline, approximately 8-fold reduced claudin-9 protein
  publication: PMID:37873357
  description: >-
    A dosage model rather than a disease model, and it is included here because of what it
    fails to show. Doxycycline-controlled tet-OFF transgenic mice with roughly eightfold
    reduced cochlear claudin-9 protein are not deaf: their ABR thresholds are elevated by
    only about 5-15 dB, stay constant over months of monitoring, and their outer hair cell
    counts are indistinguishable from wild type at P14 and at fifteen months. Instead they
    develop an extra row of functional, mechanotransducing, long-surviving ectopic inner
    hair cells, apparently because claudin-9 levels participate in lateral inhibition of
    hair cell fate during a postnatal window that has closed by P14.

    The bearing on DFNB116 is that reducing how much claudin-9 there is does not reproduce
    what abolishing its barrier function does. That is a substantive constraint on reading
    the human hypomorphic alleles, and it makes claudin-9 dosage a second, developmental
    axis distinct from the barrier axis this entry's pathophysiology chain describes.
  genes:
  - preferred_term: CLDN9
    term:
      id: hgnc:2051
      label: CLDN9
  modeled_mechanisms:
  - target: Basal-Predominant Outer Hair Cell Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Substantial reduction of claudin-9 protein does not produce the outer hair cell loss
      or the deafness seen with the barrier-abolishing nmf329 allele.
    limitations: >-
      This is knockdown, not a disease allele: the residual protein is presumably normal
      and still forms functional junctions, whereas F35L and the human variants deliver a
      protein that is dysfunctional or absent from the membrane. So the negative result
      constrains how claudin-9 quantity relates to the phenotype and says nothing directly
      about a mistrafficked or barrier-dead protein. The transgene is also on a CBA-CaJ
      background chosen to avoid age-related hearing loss, and the mild threshold elevation
      that is present is not mechanistically attributed.
    readouts:
    - name: Outer hair cell counts by cochlear turn
      target: Basal-Predominant Outer Hair Cell Degeneration
      direction: UNCHANGED
      interpretation: >-
        No outer hair cell loss at any cochlear location, in contrast to the widespread
        basal loss in the barrier-defective nmf329 mouse.
      evidence:
      - reference: PMID:37873357
        reference_title: "Genetic and pharmacologic alterations of claudin9 levels suffice to induce functional and mature inner hair cells."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "For OHCs, the numbers along the cochlear contour, apex, middle, and base were not significantly different among the two genotypes at P14"
        explanation: >-
          The negative structural readout. Graded REFUTE against the degeneration node
          because reduced claudin-9 does not produce it.

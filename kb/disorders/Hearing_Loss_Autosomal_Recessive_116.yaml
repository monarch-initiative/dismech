- name: Failure of the Claudin-9 Paracellular Ion Barrier
  description: >-
    Claudin-9 is present in the bicellular tight junctions of every sensory and non-sensory
    epithelial cell facing the endolymph of the scala media, and within the hair cell
    junctional complex it occupies a specific subapical subdomain, sitting beneath the more
    apical strands formed by other claudins. Heterologously expressed wild-type claudin-9
    lowers paracellular permeability to sodium and potassium; the deafness-causing mouse
    F35L substitution abolishes that barrier function while leaving the protein correctly
    located in the plasma membrane, which separates the barrier defect from a trafficking
    defect.

    What this node is not: a loss of the epithelial seal that maintains the endocochlear
    potential. The stria vascularis is unaffected in the mutant mouse. The claim is
    specifically that a deeper strand of the junction leaks.

- name: Basolateral Potassium Exposure of Cochlear Hair Cells
  description: >-
    Potassium leaks from the endolymph through the defective subapical junction into the
    perilymphatic space around the basolateral membranes of the hair cells. In the Cldn9
    mutant mouse the perilymphatic potassium concentration is measurably raised while the
    endolymphatic concentration and the endocochlear potential are both normal, so the
    disturbance is a redistribution of potassium across a leaky junction rather than a
    failure of strial potassium secretion or of the endocochlear battery.

    That this potassium is what damages the hair cells is established by two rescues rather
    than asserted. Explanted organ of Corti from mutant mice keeps all three rows of outer
    hair cells when cultured in low potassium, and in vivo deletion of pou3f4 - which
    removes the endocochlear potential and so the driving force pushing potassium through
    the leak - also prevents the loss.
  biological_scale: TISSUE

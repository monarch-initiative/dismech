      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, MYC amplification may play a crucial role in the angiogenic phenotype of AS through upregulation of the miR-17-92 cluster, which subsequently downregulates THBS1, a potent endogenous inhibitor of angiogenesis."
      explanation: The tumor-expression study supports the specified MYC-miRNA-THBS1 route to an angiogenic phenotype.
- name: Malignant Endothelial Proliferation and Vascular Tumor Growth
  description: >-
    Survival and proliferation of transformed endothelial cells produce an
    infiltrative vascular malignancy. Experimental VEGFR inhibition reduces
    proliferation and tumor growth, supporting this node as the tissue-level
    consequence of upstream angiogenic signaling.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: endothelial cell
    term:

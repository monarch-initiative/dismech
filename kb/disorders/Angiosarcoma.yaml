  markers: CD31 and ERG positive; CD34 variably positive
  results: Vasoformative or solid malignant morphology with endothelial-lineage immunophenotype supports angiosarcoma.
  description: >-
    Diagnosis requires clinicopathologic integration of biopsy morphology with
    endothelial immunohistochemistry. Tumors may be vasoformative, mixed, or

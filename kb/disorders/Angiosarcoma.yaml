disease_term:
  preferred_term: angiosarcoma
  term:
    id: MONDO:0016982
    label: angiosarcoma
description: >-
  Angiosarcoma is a rare, aggressive malignant neoplasm of endothelial lineage
  that arises from blood or lymphatic vascular structures. The disease is
  biologically heterogeneous across anatomic sites and etiologies. Its subtype
  labels therefore use overlapping axes: cutaneous head and neck, breast, and
  hepatic angiosarcoma are anatomic groupings, whereas radiation-associated and
  lymphedema-associated angiosarcoma are etiologic groupings. Core mechanisms
  converge on dysregulated angiogenic signaling, with subtype-enriched
  alterations including MYC amplification in secondary disease, KDR and PIK3CA
  mutations in primary breast disease, and ultraviolet-associated hypermutation
  in some head and neck lesions.
synonyms:
- hemangiosarcoma
- blood vessel sarcoma
prevalence:
- population: United States, 2019
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.33
  notes: >-
    The 2019 age-adjusted incidence was 3.3 cases per 1,000,000 person-years,
    equivalent to 0.33 per 100,000 person-years. This is an annual incidence
    estimate, not point prevalence.
  evidence:
  - reference: PMID:38607625
    reference_title: "Incidence and Presenting Characteristics of Angiosarcoma in the US, 2001-2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The US incidence of angiosarcoma doubled between 2001 (657 cases) and 2019 (1312 cases), reflecting both an increase in the adjusted incidence rate of 1.6% per year (P = .001), to 3.3 cases per 1 000 000 person-years (95% CI, 3.1-3.5 cases per 1 000 000 person-years)"
    explanation: This population study provides the 2019 US annual incidence rate used here.
has_subtypes:
- name: Cutaneous Head and Neck Angiosarcoma
  classification: anatomic
  description: >-
    Cutaneous head and neck angiosarcoma includes tumors of the scalp, face,
    head, and neck. Some tumors in this anatomic subset carry an ultraviolet
    mutational signature and high tumor mutation burden; UV-positive and
    UV-negative tumors should not be treated as biologically interchangeable.
  evidence:
  - reference: PMID:32042194
    reference_title: "The Angiosarcoma Project: enabling genomic and clinical discoveries in a rare cancer through patient-partnered research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Angiosarcoma of the head, neck, face and scalp (HNFS) was associated with a high tumor mutation burden (TMB) and a dominant ultraviolet damage mutational signature"
    explanation: This supports UV-associated hypermutation in a subset of head and neck angiosarcoma.
  - reference: PMID:37106027
    reference_title: Spatial transcriptomics reveal topological immune landscapes of Asian head and neck angiosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UV-positive AS-HN harbored significantly higher tumor mutation burden than UV-negative cases (p = 0.0294)."
    explanation: This cohort distinguishes UV-positive from UV-negative head and neck angiosarcoma.
- name: Radiation-Associated Angiosarcoma
  classification: etiologic
  description: >-
    Radiation-associated angiosarcoma is an etiologic secondary subtype that
    can arise in a previously irradiated field, especially the breast or chest
    wall. MYC amplification is a characteristic early genomic event in this
    subtype, and FLT4 can be coamplified in a subset.
  evidence:
  - reference: PMID:20949568
    reference_title: Consistent MYC and FLT4 gene amplification in radiation-induced angiosarcoma but not in other radiation-associated atypical vascular lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings reinforce the distinct pathogenesis of AS subtypes, with MYC amplification being an early, but necessary event in secondary AS."
    explanation: This study supports a distinct MYC-amplified pathogenesis in secondary angiosarcoma.
  - reference: PMID:37350195
    reference_title: Distinct genomic landscapes in radiation-associated angiosarcoma compared with other radiation-associated sarcoma histologies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RT-associated AS had more frequent MYC, FLT4, CRKL, HRAS, and KMT2D alterations than sporadic AS (enriched in TP53, KDR, ATM, ATRX)"
    explanation: This demonstrates that radiation-associated angiosarcoma is a molecularly distinct subtype.
- name: Lymphedema-Associated Angiosarcoma
  classification: etiologic
  description: >-
    Chronic lymphedema can predispose to secondary angiosarcoma, classically
    termed Stewart-Treves syndrome. This is an etiologic grouping and can
    overlap an anatomic subtype.
  evidence:
  - reference: PMID:38607625
    reference_title: "Incidence and Presenting Characteristics of Angiosarcoma in the US, 2001-2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Angiosarcoma is an aggressive vascular malignant neoplasm presenting either as a primary or secondary cancer, often arising after radiotherapy or in the context of preexisting lymphedema."
    explanation: This population-level study supports lymphedema-associated secondary angiosarcoma as a clinically recognized subtype.
- name: Primary Breast Angiosarcoma
  classification: anatomic_and_etiologic
  description: >-
    Primary breast angiosarcoma arises without prior radiation exposure and is
    molecularly distinct from radiation-associated breast angiosarcoma, with
    frequent KDR and PIK3CA/PIK3R1 alterations in one genomic series. The label
    therefore combines an anatomic site with a primary (non-radiation-associated)
    etiologic context.
  evidence:
  - reference: PMID:32123305
    reference_title: Primary mammary angiosarcomas harbor frequent mutations in KDR and PIK3CA and show evidence of distinct pathogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent genomic alterations were identified in KDR (70%), PIK3CA/PIK3R1 (70%), and PTPRB (30%), each at higher frequencies than reported in AS across all sites."
    explanation: This primary mammary series supports a distinct recurrent KDR and PI3K-pathway genomic profile.
- name: Hepatic Angiosarcoma
  classification: anatomic
  description: >-
    Hepatic angiosarcoma is a visceral subtype arising in the liver. It is the
    classic site of angiosarcoma associated with vinyl chloride or thorium
    dioxide exposure, although those exposures explain only a subset of hepatic
    cases and are not defining features of every tumor.
  evidence:
  - reference: PMID:33182685
    reference_title: Optimal Clinical Management and the Molecular Biology of Angiosarcomas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "more commonly occur in the head and neck and scalp regions, extremities, breast, heart and great vessels, and visceral organs such as the liver and spleen"
    explanation: This review identifies the liver as a recognized visceral site of angiosarcoma, supporting hepatic angiosarcoma as a distinct anatomic subtype.
  - reference: PMID:33182685
    reference_title: Optimal Clinical Management and the Molecular Biology of Angiosarcomas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chemical exposure to vinyl chloride and thorium dioxide have been well-documented to be associated with increased risk of liver AS"
    explanation: This supports the chemically induced etiology that biologically distinguishes hepatic angiosarcoma from sporadic and radiation-associated disease.
pathophysiology:
- name: Angiogenic Signaling Activation
  description: >-
    Dysregulated endothelial receptor and PI3K signaling is a convergent
    mechanism in angiosarcoma. Recurrent KDR and PIK3CA alterations in primary
    mammary disease and FLT4 amplification in some secondary tumors implicate
    VEGFR-family and downstream growth signaling, but these alterations are
    subtype enriched rather than universal.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  genes:
  - preferred_term: KDR
    term:

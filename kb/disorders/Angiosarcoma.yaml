  evidence:
  - reference: PMID:22431921
    reference_title: Efficacy of Tie2 receptor antagonism in angiosarcoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "VEGFR inhibition reduced tumor growth by lowering tumor cell proliferation."
    explanation: The xenograft intervention links endothelial growth signaling to tumor-cell proliferation and tumor growth.
  downstream:
  - target: Cutaneous or subcutaneous lesions
    description: Superficial vascular tumor growth produces clinically apparent cutaneous or subcutaneous lesions in cutaneous disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

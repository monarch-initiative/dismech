- accession: geo:GSE245935
  title: Chemo-senolytic therapeutic potential against angiosarcoma
  description: Angiosarcoma is an aggressive soft-tissue sarcoma with a poor prognosis. Chemotherapy for this cancer typically employs paclitaxel, one of the taxanes (genotoxic drugs), although it has a limited effect due to chemoresistance for prolonged treatment. Here we examine a new angiosarcoma treatment approach that combines chemotherapeutic and senolytic agents. We first find that the chemotherapeutic drugs, cisplatin and paclitaxel, efficiently induce cellular senescence of angiosarcoma cells. Subsequent treatment with a senolytic agent, ABT-263, eliminates senescent cells through the activation of the apoptotic pathway.
  organism:

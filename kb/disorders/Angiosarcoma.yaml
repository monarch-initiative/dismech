    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Angiosarcoma of the head, neck, face and scalp (HNFS) was associated with a high tumor mutation burden (TMB) and a dominant ultraviolet damage mutational signature"
    explanation: The Angiosarcoma Project links cutaneous head and neck angiosarcoma to ultraviolet-associated hypermutation.
  - reference: PMID:37106027
    reference_title: Spatial transcriptomics reveal topological immune landscapes of Asian head and neck angiosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UV-positive AS-HN harbored significantly higher tumor mutation burden than UV-negative cases (p = 0.0294)."
    explanation: This spatial transcriptomic cohort independently supports ultraviolet-associated hypermutation in head and neck angiosarcoma.
- name: Checkpoint-Relevant Cutaneous Tumor Immune State
  description: >-
    Cutaneous and head and neck angiosarcoma can exhibit heterogeneous immune
    states, including tumor-excluded inflammatory signals and checkpoint-relevant
    biomarkers such as PD-L1 positivity, high tumor mutation burden, and tertiary
    lymphoid structures. The cited evidence establishes an immune context, not a
    complete adaptive-immune-resistance mechanism or a universal relationship to
    ultraviolet mutagenesis.
  biological_scale: TISSUE
  subtypes:
  - Cutaneous Head and Neck Angiosarcoma
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  biological_processes:

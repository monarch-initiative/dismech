- accession: ega:EGAS00001003895
  title: Whole genome and whole transcriptome sequencing of patients diagnosed with angiosarcoma.
  description: Angiosarcomas are rare, clinically-aggressive tumors with a predilection for the elderly and immunosuppressed, which has incited suspicion of an oncogenic virus. We studied the metagenomic landscape of angiosarcomas and identified reads mapping to human herpesvirus-7 (HHV-7). Overall, HHV-7 was present in two-thirds of angiosarcomas, particularly in cases with low tumor mutation burden and lacking signatures of ultraviolet-induced DNA damage. Transcriptomic profiling revealed the enrichment of tumor inflammation signatures in HHV7-positive angiosarcomas. In conclusion, we identified a distinct “inflammatory” subtype of angiosarcoma associated with HHV-7.

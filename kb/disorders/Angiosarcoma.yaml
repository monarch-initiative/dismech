  evidence:
  - reference: PMID:33182685
    reference_title: Optimal Clinical Management and the Molecular Biology of Angiosarcomas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We also report the current understanding of the molecular pathways involved in angiosarcoma pathogenesis including MYC amplification, activation of angiogenic pathways and different molecular alterations that are associated with angiosarcomas of different aetiology."
    explanation: This review directly identifies angiogenic-pathway activation as a component of angiosarcoma pathogenesis.
  - reference: PMID:32123305
    reference_title: Primary mammary angiosarcomas harbor frequent mutations in KDR and PIK3CA and show evidence of distinct pathogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent genomic alterations were identified in KDR (70%), PIK3CA/PIK3R1 (70%), and PTPRB (30%), each at higher frequencies than reported in AS across all sites."
    explanation: The primary mammary cohort supports recurrent VEGFR2 and PI3K-pathway alterations in that subtype.
  - reference: PMID:20949568
    reference_title: Consistent MYC and FLT4 gene amplification in radiation-induced angiosarcoma but not in other radiation-associated atypical vascular lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coamplification of FLT4 (encoding VEGFR3) was identified in 25% of secondary AS, but not in other types."
    explanation: This study supports FLT4 amplification as a secondary-subtype alteration feeding VEGFR-family signaling.
  downstream:
  - target: Malignant Endothelial Proliferation and Vascular Tumor Growth
    description: Activated Tie2/VEGFR signaling supports angiosarcoma-cell survival, proliferation, and tumor growth.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - receptor-mediated endothelial cell survival signaling
    - proliferative signaling
    evidence:
    - reference: PMID:22431921
      reference_title: Efficacy of Tie2 receptor antagonism in angiosarcoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Tie2 and vascular endothelial growth factor receptor (VEGFR) antagonists inhibited SVR and MS1-VEGF angiosarcoma cell survival in vitro."
      explanation: Receptor antagonism reduced angiosarcoma-cell survival in vitro, supporting pathway dependence.
    - reference: PMID:22431921
      reference_title: Efficacy of Tie2 receptor antagonism in angiosarcoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vivo, Tie2 and VEGFR inhibition resulted in significant angiosarcoma growth delay."
      explanation: Xenograft growth delay after pathway inhibition supports a causal contribution to tumor growth.
- name: MYC-Amplified Secondary Angiosarcoma Program
  description: >-
    MYC amplification is an early genomic event in secondary angiosarcoma and
    can be accompanied by FLT4 coamplification. MYC-amplified tumors show
    upregulation of the miR-17-92 cluster and lower THBS1 expression, providing
    a mechanistic route from MYC amplification to an angiogenic phenotype.
  biological_scale: MOLECULAR
  subtypes:
  - Radiation-Associated Angiosarcoma
  cell_types:
  - preferred_term: endothelial cell

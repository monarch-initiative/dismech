      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinical presentation is variable, but cAS often arises from the head and neck."
      explanation: The review supports cutaneous head and neck presentation as a manifestation of superficial tumor growth.
  - target: Multifocal breast angiosarcoma presentation
    description: Neoplastic outgrowth within the breast can be multifocal in both primary and secondary breast angiosarcoma.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - multifocal endothelial tumor outgrowth in breast tissue
    evidence:
    - reference: PMID:38722225
      reference_title: Clinicopathologic and molecular correlates to neoadjuvant chemotherapy-induced pathologic response in breast angiosarcoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both primary and secondary breast angiosarcoma (AS) are characterized by multifocal presentation and aggressive behavior."
      explanation: The breast cohort directly supports multifocal presentation in both etiologic groups.
  - target: Hemoptysis
    description: Pulmonary metastatic deposits can bleed into airways or alveolar spaces and present with hemoptysis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - pulmonary metastatic involvement
    - hemorrhage into airways or alveoli
    evidence:

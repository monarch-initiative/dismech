- accession: geo:GSE240260
  title: Target gene regulatory network of miR-497 in angiosarcoma
  description: Angiosarcoma (AS) is a vascular sarcoma that is highly aggressive and metastatic. Due to its rarity, treatment options for patients are limited, therefore more research is needed to identify possible therapeutic vulnerabilities. We previously found that endothelial deletion of Dicer1 drives AS development in mice. Given the role of DICER1 in canonical microRNA (miRNA) biogenesis, this suggests that miRNA loss may be important in AS development. After testing miRNAs previously suggested to have a tumor-suppressive role in AS, microRNA-497-5p (miR-497) suppressed cell viability most significantly.

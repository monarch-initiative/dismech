treatments:
- name: Supportive care (physical therapy and rehabilitation)
  description: >-
    No curative or disease-modifying therapy is currently approved for any
    sarcoglycanopathy subtype; management is supportive, centered on
    physical therapy, stretching, and mobility aids to preserve function
    and prevent contractures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:

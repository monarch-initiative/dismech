name: Sarcoglycanopathy
creation_date: "2026-08-26T00:00:00Z"
category: Mendelian
synonyms:
- qualitative or quantitative defects of sarcoglycan
- sarcoglycan-deficient limb-girdle muscular dystrophy
- LGMD R3-R6
description: >-
  Sarcoglycanopathy is the mechanistically coherent subgroup of autosomal
  recessive limb-girdle muscular dystrophy (LGMD-R) caused by biallelic
  loss-of-function variants in one of the four sarcoglycan genes (SGCA, SGCB,
  SGCG, SGCD). The sarcoglycans co-assemble with sarcospan into a subcomplex
  of the dystrophin-glycoprotein complex (DGC) at the sarcolemma; loss of any
  one subunit destabilizes assembly and trafficking of the whole subcomplex,
  and secondarily reduces the other three sarcoglycans, undermining the DGC's
  mechanical linkage between the myofiber cytoskeleton and the extracellular
  matrix. The shared downstream consequence is a sarcolemma that cannot
  withstand contraction-induced mechanical stress, producing progressive
  myofiber degeneration, elevated serum creatine kinase, proximal
  limb-girdle weakness with calf hypertrophy, and, in a substantial fraction
  of patients, cardiac and respiratory muscle involvement. The four
  gene-defined forms (alpha/LGMDR3/SGCA, beta/LGMDR4/SGCB, gamma/LGMDR5/SGCG,
  delta/LGMDR6/SGCD) are together the most severe forms of LGMD-R, accounting
  for roughly 10-25% of LGMD cases overall, with usual onset in the first
  decade of life.

  This entry sits *below* `Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy`
  (MONDO:0015152), which is the broader LGMD-R root spanning genetically and
  mechanistically distinct causes (sarcolemmal repair failure in DYSF, a
  calcium-activated protease in CAPN3, alpha-dystroglycan glycosylation in
  FKRP). It captures specifically the sarcoglycan-complex/DGC-destabilization
  mechanism shared by SGCA/SGCB/SGCG/SGCD, matching MONDO's own class
  structure: MONDO:0016140 (sarcoglycanopathy) has four exact-child terms
  (MONDO:0016141-0016144, "qualitative or quantitative defects of
  alpha/beta/gamma/delta-sarcoglycan"), and each corresponding clinical LGMD
  subtype term (e.g. MONDO:0011968, LGMD type 2D) is multiply classified
  under both this term and MONDO:0015152. See the modeling-decision note
  below and the PR description for the lump-vs-split rationale.
disease_term:
  preferred_term: sarcoglycanopathy
  term:
    id: MONDO:0016140
    label: sarcoglycanopathy
parents:
- Autosomal Recessive Limb-Girdle Muscular Dystrophy
- Limb-Girdle Muscular Dystrophy
- Muscular Dystrophy

pathophysiology:
- name: Sarcoglycan-Sarcospan Subcomplex Assembly at the Sarcolemma
  biological_scale: MOLECULAR
  description: >-
    Alpha-, beta-, gamma-, and delta-sarcoglycan co-assemble with sarcospan
    into a subcomplex of the dystrophin-glycoprotein complex (DGC). A 2025
    cryo-EM structure of the native complex revised the earlier
    biochemical assembly model: beta-, gamma- and delta-sarcoglycan co-fold
    on the extracellular side to form a tower-like structure that provides
    binding sites for alpha-sarcoglycan and for dystroglycan, while in the
    transmembrane region the sarcoglycans and sarcospan flank and stabilize
    dystroglycan's single transmembrane helix rather than forming a
    separate subcomplex as earlier biochemical assembly models proposed.
    On the intracellular side, sarcoglycans and dystroglycan engage the
    dystrophin-dystrobrevin subcomplex through the ZZ domain of dystrophin,
    completing a continuous mechanical link across the sarcolemma between
    the extracellular matrix and the intracellular cytoskeleton.
  protein_complexes:
  - preferred_term: sarcoglycan complex
    term:
      id: GO:0016012
      label: sarcoglycan complex
  - preferred_term: dystrophin-associated glycoprotein complex
    term:
      id: GO:0016010
      label: dystrophin-associated glycoprotein complex
  cellular_components:
  - preferred_term: sarcolemma
    term:
      id: GO:0042383
      label: sarcolemma
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:39663450
    reference_title: "Structure and assembly of the dystrophin glycoprotein complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      on the extracellular side, beta-, gamma- and delta-sarcoglycans
      co-fold to form a specialized, extracellular tower-like structure,
      which has a central role in complex assembly by providing binding
      sites for alpha-sarcoglycan and dystroglycan. In the transmembrane
      region, sarcoglycans and sarcospan flank and stabilize the single
      transmembrane helix of dystroglycan, rather than forming a subcomplex
      as previously proposed
    explanation: >-
      High-resolution cryo-EM structure of the native mouse skeletal-muscle
      DGC establishes the current, revised model of sarcoglycan-sarcospan
      subcomplex assembly and its role linking dystroglycan to dystrophin.
  - reference: PMID:26709803
    reference_title: "The sarcoglycan complex in skeletal muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In skeletal muscle, the dystrophin-associated glycoprotein complex
      forms a link between the actin cytoskeleton and the extracellular
      matrix that is critical for muscle integrity. Within this complex
      resides the sarcoglycan subcomplex, which consists of four
      transmembrane glycoproteins (alpha-, beta-, gamma-, and
      delta-sarcoglycan).
    explanation: >-
      Establishes the sarcoglycan subcomplex's place within the DGC and its
      general cytoskeleton-to-ECM linking role (the earlier biochemical
      model of assembly order that the 2025 cryo-EM structure above
      revised).
  downstream:
  - target: Sarcoglycan Complex Loss and DGC Destabilization
    description: >-
      Biallelic loss-of-function variants in any one of the four
      sarcoglycan genes (SGCA, SGCB, SGCG, SGCD) prevents normal folding,
      trafficking, or membrane insertion of that subunit, which secondarily
      destabilizes and reduces the other three sarcoglycans and the whole
      DGC at the sarcolemma.
    causal_link_type: DIRECT
- name: Sarcoglycan Complex Loss and DGC Destabilization
  biological_scale: CELLULAR
  description: >-
    Loss of one sarcoglycan subunit impairs assembly of the sarcoglycan
    subcomplex; the other three sarcoglycans, which depend on the missing
    subunit for stable membrane insertion, are secondarily reduced. Because
    the sarcoglycan-sarcospan subcomplex flanks and stabilizes dystroglycan
    within the DGC, its loss destabilizes the mechanical linkage of the
    whole complex between the muscle-fiber cytoskeleton and the basement
    membrane. Two lesion classes converge on this loss: null/frameshift
    variants (about a third of reported alleles) abolish the protein
    outright, while the more common missense variants (about two-thirds)
    typically produce a misfolded sarcoglycan that is recognized and
    prematurely degraded by the endoplasmic-reticulum-associated
    degradation (ERAD) quality-control pathway before it ever reaches the
    sarcolemma.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  protein_complexes:
  - preferred_term: dystrophin-associated glycoprotein complex
    term:
      id: GO:0016010
      label: dystrophin-associated glycoprotein complex
    modifier: DECREASED
  evidence:
  - reference: PMID:38713975
    reference_title: "Advanced therapeutic approaches in sarcoglycanopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations impair the assembly of a key structural complex, which
      normally protects the sarcolemma of striated muscle from
      contraction-derived stress.
    explanation: >-
      States directly that sarcoglycan gene mutations impair assembly of the
      sarcoglycan/DGC structural complex, the shared upstream lesion across
      all four subtypes.
  - reference: PMID:36816759
    reference_title: "Systemic γ-sarcoglycan AAV gene transfer results in dose-dependent correction of muscle deficits in the LGMD 2C/R5 mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of functional γ-sarcoglycan protein in the dystrophin-associated
      protein complex destabilizes the sarcolemma, leading to eventual
      myofiber death.
    explanation: >-
      A gamma-sarcoglycan-null mouse model directly demonstrates that loss
      of one sarcoglycan subunit destabilizes the DGC/sarcolemma.
  - reference: PMID:37628888
    reference_title: "Modeling Sarcoglycanopathy in Danio rerio."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The δ-SG knockout line was further exploited to demonstrate that a
      δ-SG missense mutant is a substrate for
      endoplasmic-reticulum-associated degradation (ERAD), indicating premature degradation due
      to protein folding defects.
    explanation: >-
      A delta-sarcoglycan knockout zebrafish model directly demonstrates
      that a missense sarcoglycan variant is degraded by ERAD before
      reaching the membrane, the specific mechanism for the missense lesion
      class.
  - reference: PMID:37628888
    reference_title: "Modeling Sarcoglycanopathy in Danio rerio."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The genetic defects responsible for sarcoglycanopathy are, in most
      cases, missense mutations, accounting approximately for 67% of all
      cases, followed by frame shift and null mutations
    explanation: >-
      Directly supports the quantitative split between the missense (about
      two-thirds) and null/frameshift (about a third) lesion classes
      described in this node. Evidence source is OTHER because this
      specific statement is a background citation of another study's
      genetic survey, not this paper's own zebrafish data.
  downstream:
  - target: Contraction-Induced Sarcolemmal Membrane Damage
    description: >-
      A destabilized DGC can no longer transmit mechanical force across the
      sarcolemma, so the membrane can no longer withstand the stress of
      repeated muscle contraction.
    causal_link_type: DIRECT
- name: Contraction-Induced Sarcolemmal Membrane Damage
  biological_scale: CELLULAR
  description: >-
    The intact sarcoglycan-DGC complex normally undergoes chemical
    modification in response to contraction and mechanically stabilizes the
    sarcolemma against contraction-induced stress. With the complex
    destabilized, contraction produces microtears and, as in dystrophinopathy,
    a fragile and leaky sarcolemma; this alters intracellular calcium
    homeostasis and can eventually lead to mitochondrial dysfunction, driving
    cycles of myofiber injury.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: calcium ion transport
    term:
      id: GO:0006816
      label: calcium ion transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26709803
    reference_title: "The sarcoglycan complex in skeletal muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once integrated, the sarcoglycan complex plays a pivotal role in
      mechanically stabilising the sarcolemma as well as the
      dystrophin-associated glycoprotein complex. Additionally, the
      sarcoglycan complex undergoes chemical modifications in response to
      muscle contractions, thereby transducing mechanical information into
      a cellular signal.
    explanation: >-
      Establishes the sarcoglycan complex's normal role in mechanically
      stabilizing the sarcolemma during contraction and transducing
      mechanical stress into a cellular signal, the process lost when the
      complex is destabilized.
  - reference: PMID:38713975
    reference_title: "Advanced therapeutic approaches in sarcoglycanopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations impair the assembly of a key structural complex, which
      normally protects the sarcolemma of striated muscle from
      contraction-derived stress.
    explanation: >-
      Confirms that the sarcoglycan complex's normal function is to protect
      the sarcolemma from contraction-derived stress, and that this is what
      fails in sarcoglycanopathy.
  - reference: PMID:37628888
    reference_title: "Modeling Sarcoglycanopathy in Danio rerio."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      With the disruption of the SG-complex, it is thought that, like in
      DMD, the sarcolemma becomes fragile and leaky. This results in the
      subsequent alteration in the intracellular calcium homeostasis, which
      can eventually lead to mitochondrial dysfunction.
    explanation: >-
      Directly supports the calcium-ion-transport disturbance and downstream
      mitochondrial-dysfunction risk asserted on this node. Evidence source
      is OTHER because this is a discussion-section statement of the general
      sarcoglycanopathy mechanism (by analogy to DMD), not this paper's own
      zebrafish experimental data.
  downstream:
  - target: Progressive Myofiber Degeneration
    description: >-
      Repeated contraction-induced membrane injury that outpaces repair and
      regeneration leads to myofiber necrosis and chronic inflammation.
    causal_link_type: DIRECT
- name: Progressive Myofiber Degeneration
  biological_scale: CELLULAR
  description: >-
    Repeated contraction-induced membrane injury outpaces repair. Macrophages
    debride necrotic fibers and support satellite-cell-mediated regeneration,
    but when the degenerative process is massive or advanced, muscle stem
    cells can no longer sustain repair, so contractile tissue is
    progressively lost.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: muscle cell apoptotic process
    term:
      id: GO:0010657
      label: muscle cell apoptotic process
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:37628888
    reference_title: "Modeling Sarcoglycanopathy in Danio rerio."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      when the degenerative process is massive or at an advanced stage,
      muscle stem cells are unable to sustain the muscle repair, and the
      contractile muscle is progressively replaced by fibrotic or adipose
      tissue
    explanation: >-
      A delta-sarcoglycan knockout zebrafish model directly demonstrates
      that once regenerative capacity is exhausted, contractile tissue is
      progressively lost and replaced by fibrous and adipose tissue.
  downstream:
  - target: Fibrofatty Replacement of Skeletal Muscle
    description: >-
      Exhaustion of regenerative capacity leaves damaged contractile tissue
      progressively replaced by fibrous and adipose tissue.
    causal_link_type: DIRECT
- name: Fibrofatty Replacement of Skeletal Muscle
  biological_scale: TISSUE
  description: >-
    Contractile muscle tissue that outpaces regenerative capacity is
    progressively replaced by fibrous and adipose tissue, producing calf
    pseudohypertrophy early and irreversible weakness later.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:37628888
    reference_title: "Modeling Sarcoglycanopathy in Danio rerio."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest a severe skeletal muscle impairment, where damaged
      contractile tissue was partially replaced by fibrotic and adipose
      tissue, as demonstrated by the histological and TEM analyses of
      one-year-old zebrafish.
    explanation: >-
      Direct histological/ultrastructural demonstration of fibrofatty
      replacement of damaged contractile muscle in an adult sarcoglycan-null
      zebrafish model.
  - reference: PMID:39174842
    reference_title: "Molecular diagnosis of Alpha-sarcoglycanopathies by NGS in seven Moroccan families and report of two novel variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It appears in childhood by progressive weakness of pelvic and/or
      scapular girdle muscles and calf hypertrophy, with a wide range of
      clinical inter- and intra-familial clinical variability.
    explanation: >-
      Documents calf hypertrophy and progressive proximal weakness, the
      clinical correlates of fibrofatty replacement, in alpha-sarcoglycanopathy.
  downstream:
  - target: Progressive proximal muscle weakness
    description: >-
      Loss of functional contractile muscle mass and its replacement by
      fibrofatty tissue manifests clinically as progressive proximal
      limb-girdle weakness.
    causal_link_type: DIRECT
  - target: Calf muscle hypertrophy
    description: >-
      Fibrofatty replacement and reactive enlargement of the calf
      musculature produce calf pseudohypertrophy, a characteristic early
      sign of sarcoglycanopathy.
    causal_link_type: DIRECT


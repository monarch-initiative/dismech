prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Figure is sarcoglycanopathies as a share of LGMD-R cases, not a
    population point-prevalence rate. No independently verifiable
    population point-prevalence figure was found for sarcoglycanopathy as a
    whole (a deep-research draft cited a beta-sarcoglycanopathy rate that
    could not be located in the cited paper's cached abstract and was
    therefore not used - see the PR description). Sarcoglycanopathies are
    consistently described as rare to ultra-rare, constituting an
    estimated 10-25% of LGMD-R cases overall, with
    delta-sarcoglycanopathy/LGMDR6 specifically the least frequent and most
    severe subtype.
  evidence:
  - reference: PMID:34404573
    reference_title: "Sarcoglycanopathies: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sarcoglycanopathies are the most severe forms of autosomal recessive
      limb-girdle muscular dystrophies (LGMDs), constituting about 10-25%
      of LGMDs.
    explanation: >-
      Establishes sarcoglycanopathy's relative frequency among LGMD-R
      cases; a precise general-population prevalence figure was not
      independently verifiable.


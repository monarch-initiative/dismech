has_subtypes:
- name: SGCA
  display_name: LGMD R3 / alpha-sarcoglycanopathy (LGMD2D; SGCA)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2D
    term:
      id: MONDO:0011968
      label: autosomal recessive limb-girdle muscular dystrophy type 2D
  description: >-
    Caused by biallelic SGCA (alpha-sarcoglycan, 17q21.33) variants. Presents
    in childhood with progressive weakness of the pelvic and/or scapular
    girdle muscles and calf hypertrophy, with wide inter- and intra-familial
    clinical variability. Alpha-sarcoglycan is added to the sarcoglycan
    subcomplex last during assembly, docking onto the beta/gamma/delta core.
    In a large multicenter cohort, mean age at onset was 8 years (later than
    gamma-sarcoglycanopathy) and 66.7% of patients were wheelchair-bound at
    mean 22.9-year follow-up.
  genes:
  - preferred_term: SGCA
    term:
      id: hgnc:10805
      label: SGCA
  evidence:
  - reference: PMID:39174842
    reference_title: "Molecular diagnosis of Alpha-sarcoglycanopathies by NGS in seven Moroccan families and report of two novel variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Limb-girdle muscular dystrophy by alpha-sarcoglycan deficiency or LGMD
      R3 alpha-sarcoglycan-related is a subtype of the autosomal recessive
      sarcoglycanopathies caused by variants in the alpha-sarcoglycan gene
      (SGCA) at 17q21.33. It appears in childhood by progressive weakness of
      pelvic and/or scapular girdle muscles and calf hypertrophy, with a
      wide range of clinical inter- and intra-familial clinical variability.
    explanation: >-
      Confirms SGCA as the causal gene and documents the characteristic
      childhood-onset presentation of alpha-sarcoglycanopathy.
  - reference: PMID:33051934
    reference_title: "Clinical correlations and long-term follow-up in 100 patients with sarcoglycanopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The γ-SG patients had earlier disease onset than α-SG patients (5.5
      vs. 8 years; p = 0.022) and β-SG patients (24.4 years).
    explanation: >-
      A 100-patient multicenter cohort quantifies alpha-sarcoglycanopathy
      onset age relative to the other subtypes.
- name: SGCB
  display_name: LGMD R4 / beta-sarcoglycanopathy (LGMD2E; SGCB)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2E
    term:
      id: MONDO:0011423
      label: autosomal recessive limb-girdle muscular dystrophy type 2E
  description: >-
    Caused by biallelic SGCB (beta-sarcoglycan) variants. Beta-sarcoglycan
    co-folds with delta- and gamma-sarcoglycan to form the extracellular
    core of the subcomplex, so its loss is particularly disruptive to
    complex assembly. Clinically heterogeneous (often, but not always,
    severe childhood-onset disease; mean onset around 24 years in one
    multicenter series). Cardiac involvement is common, reported in 63% of
    a 32-patient cohort, often preceding overt skeletal muscle weakness;
    19% required assisted ventilation for restrictive respiratory
    insufficiency. First-in-human systemic AAV gene replacement therapy has
    reached Phase 3 (see Treatments).
  genes:
  - preferred_term: SGCB
    term:
      id: hgnc:10806
      label: SGCB
  evidence:
  - reference: PMID:25862795
    reference_title: "Clinical and genetic spectrum in limb-girdle muscular dystrophy type 2E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac involvement was observed in 20 patients (63%) even before
      overt muscle involvement. Six patients had restrictive respiratory
      insufficiency requiring assisted ventilation (19%).
    explanation: >-
      Quantifies cardiac and respiratory involvement in a 32-patient
      beta-sarcoglycanopathy (LGMDR4) cohort.
  - reference: PMID:12868499
    reference_title: "LGMD2E patients risk developing dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the age profile of the patients studied, the 50% cardiac
      involvement found in our LGMD2E patients is likely to be a
      conservative estimate. Careful cardiac monitoring should be carried
      out in beta-sarcoglycanopathy patients who are at high risk of
      developing cardiomyopathy.
    explanation: >-
      An earlier, smaller cohort independently documents high cardiac
      involvement in beta-sarcoglycanopathy/LGMDR4 and establishes the need
      for cardiac surveillance.
- name: SGCG
  display_name: LGMD R5 / gamma-sarcoglycanopathy (LGMD2C; SGCG)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2C
    term:
      id: MONDO:0009677
      label: autosomal recessive limb-girdle muscular dystrophy type 2C
  description: >-
    Caused by biallelic SGCG (gamma-sarcoglycan, 13q12.12) variants. The
    first sarcoglycanopathy to be molecularly characterized, and typically
    the earliest-onset and most severe subtype (mean onset 5.5 years in a
    100-patient cohort, versus 8 years for alpha- and 24.4 years for
    beta-sarcoglycanopathy). Shows strong founder effects in specific
    populations (>90% of patients homozygous for c.525delT in a French
    multicenter series; a near-exclusive c.521del founder mutation in
    Tunisia, historically called "Severe Childhood Autosomal Recessive
    Muscular Dystrophy"/Tunisian Muscular Dystrophy; a separate C283Y
    founder mutation in Roma/Gypsy populations across Europe). Frequently
    Duchenne-like in severity, with high rates of scoliosis, respiratory
    deficiency, and cardiomyopathy.
  genes:
  - preferred_term: SGCG
    term:
      id: hgnc:10809
      label: SGCG
  evidence:
  - reference: PMID:40757565
    reference_title: "An Update of Clinical, Epidemiological, and Psychosocial Features in Gamma-Sarcoglycanopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common symptoms are proximal limb-girdle muscle weakness or
      wasting (common in about 80-90% of cases); other frequent features are
      scoliosis (40%) cardiomyopathy (30%), respiratory deficiency (50-60%)
      and retractions (70%), which are frequently observed especially in
      advanced cases.
    explanation: >-
      Quantifies the frequency of the major clinical features of
      gamma-sarcoglycanopathy/LGMDR5 in a contemporary case series and
      literature review.
  - reference: PMID:15479193
    reference_title: "C283Y gamma-sarcoglycan gene mutation in the Bulgarian Roma (Gypsy) population: prevalence study and carrier screening in a high-risk community."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Limb-girdle muscular dystrophy type 2C (LGMD2C) is caused by mutations
      in the gamma-sarcoglycan gene where a founder Gypsy mutation C283Y was
      detected. The Bulgarian Gypsy LGMD2C patients, as the Gypsy patients
      from other countries, were found to be homozygous for this mutation.
    explanation: >-
      Documents the C283Y founder mutation and its high carrier frequency in
      Roma/Gypsy populations, a distinctive epidemiological feature of
      gamma-sarcoglycanopathy.
  - reference: PMID:33051934
    reference_title: "Clinical correlations and long-term follow-up in 100 patients with sarcoglycanopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The α-SG patients showed genetic heterogeneity, whereas >90% of γ-SG
      patients carried the homozygous c.525delT frameshift variant.
    explanation: >-
      Documents a second, independent gamma-sarcoglycan founder mutation
      (c.525delT) in a French multicenter cohort, distinct from the C283Y
      and c.521del founder alleles above.
- name: SGCD
  display_name: LGMD R6 / delta-sarcoglycanopathy (LGMD2F; SGCD)
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2F
    term:
      id: MONDO:0011028
      label: autosomal recessive limb-girdle muscular dystrophy type 2F
  description: >-
    Caused by biallelic loss-of-function SGCD (delta-sarcoglycan) variants.
    Delta-sarcoglycan co-folds with beta- and gamma-sarcoglycan to form the
    core of the extracellular subcomplex, so its recessive loss is highly
    disruptive to assembly of the whole complex. The least frequent and
    most severe sarcoglycanopathy subtype (considered ultra-rare): in the
    largest reported international cohort (23 patients from 18 families),
    87% had consanguineous parents, distal weakness appeared early in over
    half of patients, and 60% were wheelchair-bound from the early teens
    (median age 12 years). Note: separate, rare dominant-negative missense
    SGCD variants cause isolated familial dilated cardiomyopathy without
    skeletal myopathy — a mechanistically and clinically distinct entity
    from recessive LGMDR6 (see the discussion below).
  genes:
  - preferred_term: SGCD
    term:
      id: hgnc:10807
      label: SGCD
  evidence:
  - reference: PMID:26709803
    reference_title: "The sarcoglycan complex in skeletal muscle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During assembly, beta-sarcoglycan tightly associates with
      delta-sarcoglycan to form a functional core that then recruits gamma-
      and alpha-sarcoglycan to form the sarcoglycan complex.
    explanation: >-
      Establishes delta-sarcoglycan's central, early role in sarcoglycan
      subcomplex assembly, explaining why its recessive loss is disruptive
      to the whole complex.
  - reference: PMID:34515763
    reference_title: "Clinical and genetic spectrum of a large cohort of patients with δ-sarcoglycan muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-seven per cent of the patients had consanguineous parents.
      Ninety-one per cent of the patients were symptomatic at the time of
      the analysis. Proximal muscle weakness of the upper and lower limbs
      was the most common presenting symptom. Distal muscle weakness was
      observed early over the course of the disease in 56.5% of the
      patients. Cardiac involvement was reported in five patients (21.7%)
      and four patients (17.4%) required non-invasive ventilation. Sixty
      per cent of patients were wheelchair-bound since early teens (median
      age of 12.0 years).
    explanation: >-
      The largest reported delta-sarcoglycanopathy (LGMDR6) cohort
      quantifies its consanguinity rate, distal-weakness pattern, cardiac
      and respiratory involvement, and severe rate of ambulation loss.


inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All four sarcoglycanopathy subtypes are inherited in an autosomal
    recessive manner; affected individuals carry biallelic pathogenic
    variants in a single sarcoglycan gene (compound heterozygosity across
    different sarcoglycan genes does not cause disease).
  evidence:
  - reference: PMID:34404573
    reference_title: "Sarcoglycanopathies: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sarcoglycanopathies are the most severe forms of autosomal recessive
      limb-girdle muscular dystrophies (LGMDs), constituting about 10-25% of
      LGMDs.
    explanation: >-
      Establishes autosomal recessive inheritance and the overall severity
      and relative frequency of the sarcoglycanopathies among LGMDs.


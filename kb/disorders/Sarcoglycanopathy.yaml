    explanation: >-
      Confirms an AAV-SGCG gene therapy (ATA-200) has entered human clinical
      trial, the translation from the mouse proof-of-concept study above.
  target_mechanisms:
  - target: Sarcoglycan Complex Loss and DGC Destabilization
    treatment_effect: RESTORES
    description: >-
      AAV-mediated SGCG gene transfer restores gamma-sarcoglycan expression

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study demonstrates successful systemic delivery of the hSGCG
      transgene in SGCG -/- mice, with functional protein expression,
      reconstitution of the sarcoglycan complex, and corresponding
      physiological and functional improvements, which will help establish
      a minimal effective dose for translation of SRP-9005 gene transfer
      therapy in patients with LGMD 2C/R5.
    explanation: >-
      Preclinical mouse study establishing proof of principle for AAV
      gamma-sarcoglycan gene transfer, aimed at future clinical translation.
  - reference: clinicaltrials:NCT05973630
    reference_title: "A Phase 1-2, Open-label Study to Evaluate the Safety of Intravenous ATA-200, an Adeno-associated Viral Vector Carrying the Human SGCG Gene, in Patients With Gamma-sarcoglycanopathy (LGMDR5)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of ATA-003-GSAR study is to evaluate the safety and

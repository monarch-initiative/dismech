- name: AAV beta-sarcoglycan gene replacement therapy (SGCB)
  description: >-
    Bidridistrogene xeboparvovec (SRP-9003), an AAVrh74 vector delivering a
    codon-optimized SGCB transgene, produced robust dose-dependent
    beta-sarcoglycan expression (mean 36.2% and 62.1% of normal at Day 60
    in low- and high-dose cohorts, respectively) and preliminary motor
    improvements maintained through 2 years in a 6-patient Phase 1/2
    first-in-human trial, and has since progressed to a Phase 3
    multinational trial (NCT06246513) for beta-sarcoglycanopathy.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  therapeutic_modality: GENE_THERAPY
  evidence:
  - reference: PMID:38177855
    reference_title: "Gene therapy with bidridistrogene xeboparvovec for limb-girdle muscular dystrophy type 2E/R4: phase 1/2 trial results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Robust SGCB expression was observed: Day 60 mean (s.d.) percentage of
      normal expression 36.2% (2.7%) in Cohort 1 and 62.1% (8.7%) in Cohort
      2. Post hoc exploratory analysis showed preliminary motor
      improvements using the North Star Assessment for Limb-girdle Type
      Muscular Dystrophies maintained through Year 2.
    explanation: >-
      Reports the interim Phase 1/2 first-in-human results for AAV
      beta-sarcoglycan gene replacement therapy, the direct clinical
      precursor to the Phase 3 trial cited above.
  - reference: PMID:34404573
    reference_title: "Sarcoglycanopathies: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therapeutic approaches include the strategy of gene replacement
      mediated by a vector derived from adeno-associated virus (AAV).
      Pre-clinical studies have shown detectable levels of SG proteins in
      the muscle, and some improvement in the phenotype, in animal models.
      Therapeutic trials in humans are ongoing.
    explanation: >-
      Confirms AAV-mediated sarcoglycan gene replacement as an active
      therapeutic strategy across the sarcoglycanopathies generally.
  target_mechanisms:
  - target: Sarcoglycan Complex Loss and DGC Destabilization
    treatment_effect: RESTORES
    description: >-
      AAVrh74-mediated SGCB gene transfer restores beta-sarcoglycan
      expression, directly addressing the missing subunit that destabilizes
      the sarcoglycan subcomplex and the DGC.
    evidence:
    - reference: PMID:38177855
      reference_title: "Gene therapy with bidridistrogene xeboparvovec for limb-girdle muscular dystrophy type 2E/R4: phase 1/2 trial results."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Robust SGCB expression was observed: Day 60 mean (s.d.) percentage
        of normal expression 36.2% (2.7%) in Cohort 1 and 62.1% (8.7%) in
        Cohort 2.
      explanation: >-
        Directly demonstrates restoration of beta-sarcoglycan expression in
        human patients following AAV gene transfer.
- name: Investigational small-molecule ERAD inhibition
  description: >-
    Misfolded missense sarcoglycan variants are degraded by the
    ER-associated degradation (ERAD) quality-control pathway before reaching
    the sarcolemma; pharmacologically inhibiting this proteolysis is
    proposed as a mutation-class-specific small-molecule therapeutic
    strategy to increase the amount of (partially functional) sarcoglycan
    that reaches the membrane.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:40757565
    reference_title: "An Update of Clinical, Epidemiological, and Psychosocial Features in Gamma-Sarcoglycanopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The residual altered proteins are destroyed by a proteolytic
      quality-control system or endoplasmic reticulum-associated
      degradation, ERAD. The inhibition of this proteolysis makes these
      proteins more available to migrate to the sarcolemma and thus
      becomes a potential therapeutic objective
    explanation: >-
      States the ERAD-inhibition therapeutic rationale directly, applicable
      to missense sarcoglycan variants across subtypes.
  target_mechanisms:
  - target: Sarcoglycan Complex Loss and DGC Destabilization
    treatment_effect: INHIBITS
    description: >-
      Inhibiting ERAD-mediated proteolysis of misfolded missense sarcoglycan
      is intended to make more of the (partially functional) protein
      available to reach the sarcolemma, partially counteracting complex
      loss for the missense lesion class.
    evidence:
    - reference: PMID:40757565
      reference_title: "An Update of Clinical, Epidemiological, and Psychosocial Features in Gamma-Sarcoglycanopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The inhibition of this proteolysis makes these proteins more

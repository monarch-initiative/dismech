  publication: PMID:37628888
  description: >-
    Individual knockout of any one of Sgcb, Sgcg, or Sgcd in mice produces
    progressive skeletal-muscle dystrophy and, unlike the Sgca-null mouse
    below, dilated or hypertrophic cardiomyopathy — mirroring the
    beta-, gamma-, and delta-sarcoglycanopathy pattern of substantial human
    cardiac involvement.
  evidence:
  - reference: PMID:37628888
    reference_title: "Modeling Sarcoglycanopathy in Danio rerio."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All these KO animals present signs of progressive dystrophy in
      skeletal musculature, whereas dilated or hypertrophic cardiomyopathy
      develops in β- γ-, and δ-SG-, but not in α-SG-null mice
    explanation: >-
      Summary statement (citing the primary mouse-model literature) of the
      shared skeletal phenotype and beta/gamma/delta-specific cardiac
      phenotype across the individual sarcoglycan-null mouse lines.
      Evidence source is OTHER because this specific sentence summarizes

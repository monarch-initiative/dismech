prevalence:
- population: Worldwide (sarcoglycanopathies as a share of LGMD)
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No independently verifiable population point-prevalence figure was
    found for sarcoglycanopathy as a whole (a deep-research draft cited a
    beta-sarcoglycanopathy rate that could not be located in the cited
    paper's cached abstract and was therefore not used - see the PR
    description). Sarcoglycanopathies are consistently described as rare
    to ultra-rare, constituting an estimated 10-25% of LGMD-R cases
    overall, with delta-sarcoglycanopathy/LGMDR6 specifically the least
    frequent and most severe subtype.
  evidence:
  - reference: PMID:34404573
    reference_title: "Sarcoglycanopathies: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sarcoglycanopathies are the most severe forms of autosomal recessive
      limb-girdle muscular dystrophies (LGMDs), constituting about 10-25%
      of LGMDs.
    explanation: >-
      Establishes sarcoglycanopathy's relative frequency among LGMD-R
      cases; a precise general-population prevalence figure was not
      independently verifiable.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is established by identifying biallelic pathogenic variants in
    one of the four sarcoglycan genes, typically via a targeted
    neuromuscular NGS gene panel, supported by muscle biopsy
    immunohistochemistry showing loss or marked reduction of all four
    sarcoglycans (secondary to loss of the causal subunit).
  evidence:
  - reference: PMID:34404573
    reference_title: "Sarcoglycanopathies: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is currently based on the molecular screening for these mutations."
    explanation: >-
      Confirms molecular genetic screening as the current diagnostic
      standard for sarcoglycanopathy.
- name: Differential diagnosis - cognition is preserved
  description: >-
    Cognitive/intellectual impairment has never been reported in
    sarcoglycanopathy; new gait difficulty in a cognitively normal child is
    consistent with sarcoglycanopathy (or another muscular dystrophy) and
    should prompt CK testing and molecular workup rather than a primary
    neurodevelopmental diagnosis.
  evidence:
  - reference: PMID:37628888
    reference_title: "Modeling Sarcoglycanopathy in Danio rerio."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive impairment has never been reported."
    explanation: >-
      States directly that cognitive impairment is not a feature of
      sarcoglycanopathy.


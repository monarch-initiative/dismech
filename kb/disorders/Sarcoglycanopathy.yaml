diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is established by identifying biallelic pathogenic variants in
    one of the four sarcoglycan genes, typically via a targeted
    neuromuscular NGS gene panel, supported by muscle biopsy
    immunohistochemistry showing loss or marked reduction of all four
    sarcoglycans (secondary to loss of the causal subunit).
  evidence:
  - reference: PMID:34404573
    reference_title: "Sarcoglycanopathies: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is currently based on the molecular screening for these mutations."
    explanation: >-
      Confirms molecular genetic screening as the current diagnostic
      standard for sarcoglycanopathy.
  - reference: PMID:20301582
    reference_title: "Limb-Girdle Muscular Dystrophy Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical testing (i.e., protein testing by immunostaining or
      immunblotting) performed on a muscle biopsy can establish the
      diagnosis of the following LGMD types: sarcoglycanopathy,
      calpainopathy, dysferlinopathy, and O-linked glycosylation defects
      (also known as dystroglycanopathy).
    explanation: >-
      GeneReviews establishes muscle-biopsy immunostaining/immunoblotting as
      a route to establishing the sarcoglycanopathy diagnosis, complementing
      molecular genetic screening.
- name: Differential diagnosis - cognition is preserved
  description: >-
    Cognitive/intellectual impairment has never been reported in
    sarcoglycanopathy; new gait difficulty in a cognitively normal child is
    consistent with sarcoglycanopathy (or another muscular dystrophy) and
    should prompt CK testing and molecular workup rather than a primary
    neurodevelopmental diagnosis.
  evidence:
  - reference: PMID:37628888
    reference_title: "Modeling Sarcoglycanopathy in Danio rerio."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cognitive impairment has never been reported."
    explanation: >-
      States directly that cognitive impairment is not a feature of
      sarcoglycanopathy.


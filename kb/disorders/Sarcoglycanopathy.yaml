  description: >-
    A self-complementary AAVrh74 vector (SRP-9005) carrying a
    codon-optimized human SGCG transgene restored sarcoglycan complex
    expression, muscle histopathology, and functional performance in a
    Sgcg-null mouse model, supporting translation to human
    gamma-sarcoglycanopathy. An AAV vector carrying human SGCG (ATA-200) has
    since entered a Phase 1 human trial (NCT05973630) in ambulant children
    with gamma-sarcoglycanopathy (LGMDR5).

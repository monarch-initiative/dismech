    mapping_justification: >-
      Parent grouping term. Retained as a broad cross-reference now that the
      gene-specific PITA3 term (MONDO:0054665) is bound as this entry's
      disease_term. An earlier version of this block asserted that no PITA3
      term existed in the local ontology snapshot and used skos:closeMatch on

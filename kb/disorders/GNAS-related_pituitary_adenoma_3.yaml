      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        including the appropriate biochemical assessment, a therapeutic algorithm,
        including use of medical monotherapy or combination therapy, and
        management during pregnancy.
      explanation: >-
        Partial, and for a specific reason: this sentence enumerates what the
        guideline covers rather than reporting a result, so it establishes that
        biochemical assessment and mono/combination therapy are the components
        of guideline-directed care without stating any efficacy claim.
- reference: PMID:27812777
  title: "Acromegaly: clinical features at diagnosis."
  findings:
  - statement: >-
      Acromegaly produces somatic overgrowth and typical facial and acral
      overgrowth phenotypes downstream of GH/IGF-1 excess.
    evidence:
    - reference: PMID:27812777
      reference_title: "Acromegaly: clinical features at diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Excessive growth of hands and feet (predominantly due to soft tissue
        swelling) is present in the vast majority of acromegalic patients.
      explanation: >-
        Supports the acral arm of the finding, with a frequency statement.
    - reference: PMID:27812777
      reference_title: "Acromegaly: clinical features at diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The typical coarsening of facial features include furrowing of fronthead,
        pronounced brow protrusion, enlargement of the nose and the ears
      explanation: >-
        Supports the facial arm of the finding, which the acral quote does not

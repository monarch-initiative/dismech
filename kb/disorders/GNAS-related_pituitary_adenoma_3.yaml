diagnosis:
- name: Biochemical assessment of acromegaly
  diagnosis_term:
    preferred_term: hormone measurement
    term:
      id: NCIT:C74742
      label: Hormone Measurement
  description: >-
    GH and IGF-1 biochemical assessment establishes and monitors the acromegaly
    phenotype produced by GNAS-mutant somatotroph tumors.
  results: >-
    Elevated GH and IGF-1 support active acromegaly; normalization is used to
    assess treatment response.
  evidence:
  - reference: PMID:37923946
    reference_title: "Consensus on criteria for acromegaly diagnosis and remission."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a patient with typical acromegaly features, insulin-like growth factor
      (IGF)-I > 1.3 times the upper limit of normal for age confirms the
      diagnosis.
    explanation: >-
      The 14th Acromegaly Consensus Conference states the operative biochemical
      diagnostic criterion, giving this node a substantive threshold rather than
      a general statement that biochemical assessment occurs.
  - reference: PMID:37923946
    reference_title: "Consensus on criteria for acromegaly diagnosis and remission."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Random growth hormone (GH) measured after overnight fasting may be useful
      for informing prognosis, but is not required for diagnosis.
    explanation: >-
      This qualifies the role of GH measurement relative to IGF-I in the
      diagnostic algorithm captured by this node.
  - reference: PMID:25356808
    reference_title: "Acromegaly: an endocrine society clinical practice guideline."

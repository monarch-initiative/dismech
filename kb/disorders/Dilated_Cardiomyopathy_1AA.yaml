    modifier: DECREASED
  evidence:
  - reference: PMID:25224718
    reference_title: Exome sequencing identifies a mutation in the ACTN2 gene in a family with idiopathic ventricular fibrillation, left ventricular noncompaction, and sudden death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the ACTN2 gene can be responsible for marked cardiac phenotype
      heterogeneity in families. The diverse mechanistic roles of ACTN2 in the
      cardiac Z-disc may explain this heterogeneous clinical presentation.
    explanation: >-
      Supports both the dilated endpoint and the marked intrafamilial
      heterogeneity of expression in ACTN2 disease.
  - reference: PMID:14567970
    reference_title: Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutation also disrupted the interaction with MLP and appeared to
      inhibit alpha-actinin function in cultured cells, in respect to the nuclear
      localization of actinin and the initiation of cellular differentiation.
    explanation: >-
      Functional characterization of the original DCM-associated ACTN2 Q9R
      variant, linking it to loss of the alpha-actinin-2/MLP interaction.
      Evidence source is IN_VITRO because the assays were done in cultured cells.
  - reference: PMID:35708014
    reference_title: Frequency, Penetrance, and Variable Expressivity of Dilated Cardiomyopathy-Associated Putative Pathogenic Gene Variants in UK Biobank Participants.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      most commonly manifesting with arrhythmias in the absence of substantial
      ventricular dilation or dysfunction
    explanation: >-
      UK Biobank data on carriers of putative pathogenic variants in 44 DCM genes

- name: Loss of Sarcolemmal Partner Coupling and Arrhythmogenesis
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Beyond the sarcomere, the C-terminus of alpha-actinin-2 interacts with
    sarcolemma-associated proteins including alpha-actinin-1 (ACTN1) and
    connexin-43 (GJA1). C-terminal truncation disrupts these interactions,
    providing a mechanistic route from a Z-disc protein defect to impaired
    electrical coupling, arrhythmia, and abnormal relaxation. Clinically, ACTN2
    carriers show atrial and ventricular arrhythmias, conduction abnormalities,
    and idiopathic ventricular fibrillation, which can precede or occur without
    overt ventricular dilation.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Cell communication by electrical coupling involved in cardiac conduction
    term:
      id: GO:0086064
      label: cell communication by electrical coupling involved in cardiac conduction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34802252
    reference_title: Mono- and Biallelic Protein-Truncating Variants in Alpha-Actinin 2 Cause Cardiomyopathy Through Distinct Mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of the C-terminus of ACTN2 disrupts interaction with ACTN1
      (alpha-actinin 1) and GJA1 (gap junction protein alpha 1), 2
      sarcolemma-associated proteins, which may contribute to the clinical
      arrhythmic and relaxation defects.
    explanation: >-
      Supplies the molecular link between ACTN2 truncation and the arrhythmic and
      relaxation phenotype via loss of connexin-43 and ACTN1 coupling. The
      authors frame the clinical contribution as a possibility ("may
      contribute"), so this node is modeled as a mechanistic amplifier rather
      than a proven clinical driver.
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A study found that patients with ACTN2 presented with varying degrees and
      types of arrhythmias, including left bundle branch block, atypical flutter,
      paroxysmal atrial fibrillation or supraventricular tachycardia, as well as
      atrial, ventricular, or supraventricular premature beats
    explanation: >-
      Documents the clinical arrhythmia burden in ACTN2 variant carriers that
      this node accounts for.
  downstream:
  - target: Ventricular Arrhythmia
    causal_link_type: DIRECT
  - target: Sudden Cardiac Death
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES


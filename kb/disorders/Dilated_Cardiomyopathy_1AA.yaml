- category: Cardiovascular
  name: Myocardial Fibrosis
  description: >-
    Interstitial myocardial fibrosis accompanies the remodeling myocardium and is
    detectable in vivo as late gadolinium enhancement on cardiac MRI. In
    nonischemic dilated cardiomyopathy generally, LGE presence and extent — not
    ejection fraction — carry the dominant prognostic signal for mortality and
    arrhythmic events, which is why fibrosis imaging is part of the workup for an
    ACTN2 carrier rather than a purely descriptive finding.
  phenotype_term:
    preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
  notes: >-
    The prognostic evidence is DCM-wide rather than ACTN2-specific; no ACTN2
    cohort has reported LGE burden. Severe interstitial fibrosis in explanted
    ACTN2 p.Gln860Ter myocardium is described in the body (not the abstract) of
    PMID:34802252 and is therefore not quotable here.
  evidence:
  - reference: PMID:39298146
    reference_title: "Risk Stratification in Nonischemic Dilated Cardiomyopathy Using CMR Imaging: A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence and extent of LGE were associated with various adverse
      clinical outcomes, whereas LVEF was not significantly associated with
      mortality and arrhythmic end points in NIDCM.
    explanation: >-
      Meta-analysis of 103 studies establishes fibrosis (LGE) as the dominant
      prognostic marker in nonischemic DCM. Support is PARTIAL because the
      analysis is DCM-wide and not ACTN2-specific.
genetic:
- name: ACTN2 Pathogenic Variants
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ACTN2
    term:
      id: hgnc:164
      label: ACTN2
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  features: >-
    Reported ACTN2 variants are distributed across the gene rather than clustered
    in one domain: missense changes in the N-terminal actin-binding
    calponin-homology domains (Q9R, G111V, A119T), the spectrin-repeat rod
    (T495M, E583A, E628G), and the C-terminal EF-hand/calmodulin-like region
    (A868T), plus protein-truncating and splice variants. Heterozygous truncated
    protein can still be incorporated into the sarcomere (dominant-negative),
    while rare biallelic stop-gain genotypes act through a distinct, recessive
    mechanism; haploinsufficiency is not an established mechanism. Segregation
    and functional data are limited for many reported missense variants, so
    variant interpretation in this gene requires caution.
  variants:
  - name: ACTN2 Q9R
    description: >-
      Missense variant in the N-terminal region identified in a patient with
      dilated cardiomyopathy; abolishes the alpha-actinin-2 interaction with
      muscle LIM protein in cell-based assays. The founding CMD1AA variant.
    gene:
      preferred_term: ACTN2
      term:
        id: hgnc:164
        label: ACTN2
  - name: ACTN2 Ala119Thr
    description: >-
      Actin-binding-domain missense variant segregating with a strikingly
      heterogeneous cardiac phenotype (left ventricular noncompaction, dilated
      cardiomyopathy, idiopathic ventricular fibrillation, sudden unexplained
      death) in two families sharing a common ancestral haplotype; also reported
      in hypertrophic cardiomyopathy, and shown to perturb Z-disc localization
      and dynamics in cardiomyocytes.
    gene:
      preferred_term: ACTN2
      term:
        id: hgnc:164
        label: ACTN2
  - name: ACTN2 A868T
    description: >-
      Variant in the EF 3-4 region that interacts with titin, studied in
      explanted myocardium from a heart-failure patient; associated with
      increased myofilament calcium sensitivity and reduced sinusoidal stiffness.
    gene:
      preferred_term: ACTN2
      term:
        id: hgnc:164
        label: ACTN2
  evidence:
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, there is definitive evidence to support the relationship
      between ACTN2 and ACTN2-related cardiac and skeletal myopathy.
    explanation: >-
      ClinGen Hereditary Cardiovascular Disease GCEP classifies the ACTN2
      gene-disease relationship as Definitive (upgraded from moderate in 2023).
  - reference: PMID:33947203
    reference_title: Evidence-Based Assessment of Genes in Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven genes (14%; ACTC1, ACTN2, JPH2, NEXN, TNNI3, TPM1, VCL) including 2
      additional ontologies were classified as moderate evidence
    explanation: >-
      The DCM-specific ClinGen curation places ACTN2 in the moderate-evidence
      tier for the dilated phenotype, a narrower claim than the Definitive
      classification for the whole ACTN2 cardiac and skeletal spectrum.
  - reference: PMID:25224718
    reference_title: Exome sequencing identifies a mutation in the ACTN2 gene in a family with idiopathic ventricular fibrillation, left ventricular noncompaction, and sudden death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing identified an Ala119Thr mutation in the
      alpha-actinin-2 (ACTN2) gene that segregated with disease.
    explanation: >-
      Segregation evidence for an ACTN2 missense variant in a family with mixed
      dilated, noncompaction, and arrhythmic phenotypes.
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, limited segregation and functional data are available to support
      the pathogenicity of most previously reported missense variants and
      clear-cut genotype-phenotype correlations are currently only demonstrated
      for some ACTN2-related myopathies.
    explanation: >-
      Documents the interpretive caveat that much of the reported ACTN2 missense
      variation lacks robust segregation or functional support.
diagnosis:
- name: Echocardiography
  description: >-
    First-line imaging: left ventricular dimensions and ejection fraction
    establish the dilated phenotype, and the same study detects the prominent
    trabeculae and deep intertrabecular recesses of noncompaction and the
    near-normal cavity with impaired filling of the restrictive variant.
    Echocardiography is also the surveillance modality for genotype-positive,
    phenotype-negative relatives identified by cascade testing.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echocardiography and other imaging techniques are required to assess
      ventricular dysfunction and adverse myocardial remodelling, and
      immunological and histological analyses of an endomyocardial biopsy sample
      are indicated when inflammation or infection is suspected.
    explanation: >-
      Establishes echocardiography as the required modality for assessing
      ventricular dysfunction and remodeling in DCM, with biopsy reserved for
      suspected inflammation. Evidence source is OTHER because this is a review.
  - reference: PMID:37374362
    reference_title: "Impaired Cardiomyocyte Maturation Leading to DCM: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography showed an enlarged left ventricle and marked myocardial
      non-compaction.
    explanation: >-
      Worked example in an ACTN2-containing deletion: echocardiography
      simultaneously established the dilation and the noncompaction.
- name: Cardiac Magnetic Resonance Imaging with Late Gadolinium Enhancement
  description: >-
    CMR resolves trabecular architecture better than echocardiography (confirming
    or refuting noncompaction) and, with late gadolinium enhancement, quantifies
    myocardial fibrosis. In nonischemic DCM, LGE presence and extent — rather than
    ejection fraction — carry the dominant prognostic signal for mortality and
    arrhythmic events, so CMR informs risk stratification and ICD discussion as
    well as diagnosis.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging with late gadolinium enhancement
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:37374362
    reference_title: "Impaired Cardiomyocyte Maturation Leading to DCM: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac magnetic resonance imaging revealed increased left ventricular
      trabeculae, an enlarged left ventricle, and a reduced ejection fraction.
    explanation: >-
      Demonstrates the three CMR findings that matter in this disorder —
      trabeculation, chamber enlargement, and reduced ejection fraction — in a
      patient with an ACTN2-containing deletion.
  - reference: PMID:39298146
    reference_title: "Risk Stratification in Nonischemic Dilated Cardiomyopathy Using CMR Imaging: A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late gadolinium enhancement (LGE) presence and extent (per 1%) were
      associated with higher all-cause mortality
    explanation: >-
      Supports LGE as the prognostically load-bearing CMR measurement in
      nonischemic DCM. Support is PARTIAL because the meta-analysis is DCM-wide
      rather than ACTN2-specific.
- name: Electrocardiography and Ambulatory Rhythm Monitoring
  description: >-
    Resting ECG plus ambulatory (Holter or extended) rhythm monitoring is
    disproportionately important in this disorder because the arrhythmic arm can
    precede or occur without ventricular dilation: conduction disease, atrial
    fibrillation or flutter, ventricular ectopy, and idiopathic ventricular
    fibrillation are all part of the ACTN2 spectrum. In population data on DCM
    gene carriers, arrhythmia or conduction disease is the commonest early
    expression, which makes rhythm assessment the highest-yield test in an
    otherwise phenotype-negative carrier.
  diagnosis_term:
    preferred_term: electrocardiography and ambulatory rhythm monitoring
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:35708014
    reference_title: Frequency, Penetrance, and Variable Expressivity of Dilated Cardiomyopathy-Associated Putative Pathogenic Gene Variants in UK Biobank Participants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arrhythmias or conduction disease (15.2%) were the most common early DCM
      features
    explanation: >-
      Establishes rhythm and conduction abnormality as the commonest early
      expression in carriers of DCM-gene variants, justifying ECG plus ambulatory
      monitoring as the front-line test in phenotype-negative carriers.
  - reference: PMID:25224718
    reference_title: Exome sequencing identifies a mutation in the ACTN2 gene in a family with idiopathic ventricular fibrillation, left ventricular noncompaction, and sudden death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical evaluation of family members was performed, including physical
      examination, electrocardiography, 2D transthoracic echocardiography and
      review of autopsy records.
    explanation: >-
      Documents the actual evaluation protocol applied to an ACTN2 family:
      examination, ECG, and echocardiography.
- name: Natriuretic Peptide Measurement
  description: >-
    NT-proBNP (or BNP) supports detection and staging of heart failure in a
    carrier with symptoms or borderline imaging, and is the practical serum
    biomarker for longitudinal follow-up. It is neither diagnostic of DCM nor
    ACTN2-specific.
  diagnosis_term:
    preferred_term: NT-proBNP measurement
    term:
      id: NCIT:C96610
      label: N-Terminal ProB-type Natriuretic Peptide Measurement
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      new diagnostic tools, such as serum biomarkers, that enable early diagnosis
      and treatment
    explanation: >-
      The DCM primer identifies serum biomarkers as enabling early diagnosis, but
      does not name NT-proBNP or give thresholds, so support for this specific
      analyte is PARTIAL.
- name: Cardiomyopathy Multigene Panel Sequencing with Copy-Number Analysis
  description: >-
    The confirmatory test is molecular: a clinically curated cardiomyopathy panel
    that includes ACTN2, interpreted against the caveat that many reported ACTN2
    missense variants lack segregation or functional support. Copy-number analysis
    matters specifically here — two of the informative ACTN2 genotypes are
    structural rather than single-nucleotide (a heterozygous multi-exon deletion,
    and the 1q43 deletion removing ACTN2 with RYR2) — so a sequencing-only panel
    without CNV calling can return a false negative. Exome or genome sequencing is
    a useful adjunct when a family's presentations do not fit one cardiomyopathy
    label.
  diagnosis_term:
    preferred_term: cardiomyopathy multigene panel sequencing with copy-number analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25224718
    reference_title: Exome sequencing identifies a mutation in the ACTN2 gene in a family with idiopathic ventricular fibrillation, left ventricular noncompaction, and sudden death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing is a useful adjunct to cardiac genetic testing in families
      with mixed clinical presentations.
    explanation: >-
      Supports broader sequencing beyond a targeted panel when the family
      phenotype is heterogeneous, exactly the ACTN2 situation.
  - reference: PMID:37374362
    reference_title: "Impaired Cardiomyocyte Maturation Leading to DCM: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing revealed a restricted genomic depletion in the 1q43
      region
    explanation: >-
      Concrete evidence that a copy-number lesion at the ACTN2 locus can be the
      causal finding, which is why copy-number analysis must accompany sequencing.
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, limited segregation and functional data are available to support
      the pathogenicity of most previously reported missense variants and
      clear-cut genotype-phenotype correlations are currently only demonstrated
      for some ACTN2-related myopathies.
    explanation: >-
      The interpretive caveat that must accompany a panel result: an ACTN2
      missense variant of uncertain significance should not by itself be read as
      a CMD1AA diagnosis.
- name: Exclusion of Loading Conditions and Coronary Disease
  description: >-
    DCM is definitionally a diagnosis of exclusion: the dilation and systolic
    impairment must not be explained by hypertension, valvular disease, or
    coronary artery disease, and the acquired causes (myocarditis, alcohol and
    other toxins, the peripartum state, endocrine and autoimmune disease) must be
    considered before a genetic label is applied. A pathogenic ACTN2 genotype does
    not remove this step, because carriers can also acquire an unrelated
    cardiomyopathy and because penetrance is incomplete.
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dilated cardiomyopathy (DCM) is a clinical diagnosis characterized by left
      ventricular or biventricular dilation and impaired contraction that is not
      explained by abnormal loading conditions (for example, hypertension and
      valvular heart disease) or coronary artery disease.
    explanation: >-
      States the exclusion criteria that define the DCM diagnosis. Evidence source
      is OTHER because this is a review.
  - reference: PMID:20301486
    reference_title: Dilated Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide the evaluation strategy of a proband with nonsyndromic DCM
    explanation: >-
      The GeneReviews DCM overview exists to supply this proband evaluation
      strategy, of which categorization and exclusion of non-genetic causes is
      the first step. Evidence source is OTHER because GeneReviews is an
      expert-authored review resource.
differential_diagnoses:
- name: Ischemic and other acquired dilated cardiomyopathy
  description: >-
    Coronary artery disease, hypertension, valvular disease, tachyarrhythmia,
    alcohol and other cardiotoxins, and endocrine or autoimmune disease all
    produce a dilated, hypocontractile ventricle and must be excluded before a
    genetic diagnosis is made.
  distinguishing_features:
  - Regional (coronary-territory) wall-motion abnormality, ischemic LGE pattern, or obstructive disease on angiography favors ischemic cardiomyopathy.
  - Absent family history plus an identified exposure or loading condition, with recovery after its removal, favors an acquired cause.
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nongenetic forms of DCM can result from different aetiologies, including
      inflammation of the myocardium due to an infection (mostly viral); exposure
      to drugs, toxins or allergens; and systemic endocrine or autoimmune
      diseases.
    explanation: >-
      Enumerates the acquired etiologies that constitute this differential.
      Evidence source is OTHER because this is a review.
- name: Viral myocarditis
  description: >-
    Acute or chronic myocarditis can present with ventricular dilation and
    systolic dysfunction, and inflammatory presentations also occur in genetic
    arrhythmogenic cardiomyopathy, so the distinction is not always clean.
  distinguishing_features:
  - Recent viral prodrome, troponin release, and inflammatory LGE with recovery of function favor myocarditis.
  - Endomyocardial biopsy showing inflammatory infiltrate is indicated when inflammation or infection is suspected.
  disease_term:
    preferred_term: viral myocarditis
    term:
      id: MONDO:0023161
      label: viral myocarditis
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      immunological and histological analyses of an endomyocardial biopsy sample
      are indicated when inflammation or infection is suspected
    explanation: >-
      Supports biopsy as the discriminator when a myocarditic cause is suspected.
- name: Alcoholic cardiomyopathy
  description: >-
    Chronic heavy alcohol exposure produces a dilated cardiomyopathy that is
    clinically indistinguishable on imaging alone and can coexist with (and
    unmask) a genetic predisposition.
  distinguishing_features:
  - Documented sustained heavy alcohol intake with improvement on abstinence favors a toxic cause.
  - A pathogenic ACTN2 genotype or an affected first-degree relative argues for the genetic diagnosis even when exposure is present.
  disease_term:
    preferred_term: alcoholic cardiomyopathy
    term:
      id: MONDO:0006643
      label: alcoholic cardiomyopathy
- name: Peripartum cardiomyopathy
  description: >-
    De novo systolic heart failure in late pregnancy or the postpartum period
    overlaps clinically with a first presentation of genetic DCM unmasked by the
    hemodynamic load of pregnancy.
  distinguishing_features:
  - Onset confined to late pregnancy or the first months postpartum, in a woman without previous heart disease, defines the peripartum entity.
  - Persistent dysfunction outside the peripartum window, or an affected relative, favors an underlying genetic cardiomyopathy.
  disease_term:
    preferred_term: peripartum cardiomyopathy
    term:
      id: MONDO:0018920
      label: peripartum cardiomyopathy
- name: Isolated left ventricular noncompaction
  description: >-
    Noncompaction is part of the CMD1AA phenotype rather than a separate disease
    in ACTN2 carriers, but isolated noncompaction (and physiological
    hypertrabeculation in athletes or pregnancy) is the differential when
    trabeculation is the dominant finding and dilation is mild.
  distinguishing_features:
  - Noncompaction plus dilation with a pathogenic ACTN2 genotype is CMD1AA, not isolated LVNC.
  - Truncating variants in MYH7, ACTN2, and PRDM16 are the lesions specifically enriched in noncompaction cohorts, so genotype partly resolves the boundary.
  disease_term:
    preferred_term: left ventricular noncompaction
    term:
      id: MONDO:0018901
      label: left ventricular noncompaction
  evidence:
  - reference: PMID:33500567
    reference_title: Systematic large-scale assessment of the genetic architecture of left ventricular noncompaction reveals diverse etiologies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed substantial genetic overlap indicating that LVNC often
      represents a phenotypic variation of DCM or HCM.
    explanation: >-
      Establishes that noncompaction frequently is a phenotypic variant of DCM or
      HCM rather than a separate entity, which is exactly the boundary problem in
      an ACTN2 carrier.
- name: Sarcomeric and cytoskeletal dilated cardiomyopathy of other genotype
  description: >-
    TTN truncations, LMNA, FLNC, DSP, RBM20, BAG3, PLN, DES, and SCN5A account for
    far more genotyped familial DCM than ACTN2 does; on phenotype alone they are
    indistinguishable, so the differential is resolved by the panel result rather
    than by imaging.
  distinguishing_features:
  - LMNA and FLNC genotypes carry distinct arrhythmic risk and ICD thresholds, so the specific gene, not the DCM label, drives management.
  - ACTN2 sits in the moderate-evidence tier for DCM, so a variant there should be weighed more cautiously than one in a definitive-evidence gene.
  evidence:
  - reference: PMID:33947203
    reference_title: Evidence-Based Assessment of Genes in Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve genes (23%) from 8 gene ontologies were classified as having
      definitive (BAG3, DES, FLNC, LMNA, MYH7, PLN, RBM20, SCN5A, TNNC1, TNNT2,
      TTN) or strong (DSP) evidence.
    explanation: >-
      Names the definitive/strong DCM genes that constitute the genotypic
      differential and against which an ACTN2 finding must be weighed.
progression:
- phase: Genotype-positive, phenotype-negative
  notes: >-
    A relative identified by cascade testing may carry the ACTN2 variant with
    normal echocardiography, ECG, and function. Penetrance is incomplete —
    population data on DCM-gene carriers put combined clinical plus subclinical
    penetrance at no more than about 30% — so surveillance rather than treatment
    is the correct posture at this stage.
  evidence:
  - reference: PMID:35708014
    reference_title: Frequency, Penetrance, and Variable Expressivity of Dilated Cardiomyopathy-Associated Putative Pathogenic Gene Variants in UK Biobank Participants.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combined clinical/subclinical penetrance was ≤30% with all 3 variant
      filtering strategies.
    explanation: >-
      Quantifies incomplete penetrance across DCM genes; PARTIAL because the
      figure is gene-panel-wide rather than ACTN2-specific.
- phase: Early or subclinical expression
  notes: >-
    First expression is often electrical or subtle-structural rather than frankly
    dilated: conduction disease, atrial or ventricular ectopy, hypokinetic
    non-dilated cardiomyopathy, or isolated trabecular abnormality. In ACTN2
    families this stage includes resuscitated ventricular fibrillation in
    individuals without overt dilation, which is why rhythm surveillance is not
    optional.
  evidence:
  - reference: PMID:35708014
    reference_title: Frequency, Penetrance, and Variable Expressivity of Dilated Cardiomyopathy-Associated Putative Pathogenic Gene Variants in UK Biobank Participants.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ECG and cardiovascular magnetic resonance analysis revealed evidence of
      subclinical DCM in an additional 1.6% and early DCM features in an
      additional 15.9% of individuals with putative pathogenic variants.
    explanation: >-
      Documents a substantial subclinical and early-feature stage detectable by
      ECG and CMR before clinical DCM; PARTIAL because it is gene-panel-wide.
  - reference: PMID:25224718
    reference_title: Exome sequencing identifies a mutation in the ACTN2 gene in a family with idiopathic ventricular fibrillation, left ventricular noncompaction, and sudden death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While some individuals were asymptomatic, other presentations included left
      ventricular non-compaction, a resuscitated cardiac arrest due to idiopathic
      ventricular fibrillation, dilated cardiomyopathy, and sudden unexplained
      death.
    explanation: >-
      Shows the full range within one ACTN2 kindred, including arrhythmic
      presentation without overt dilation.
- phase: Overt cardiomyopathy
  notes: >-
    Established structural disease: left ventricular dilation with reduced
    ejection fraction (or the hypertrophic, restrictive, or noncompacted variant
    of the same allelic series), symptomatic heart failure, and cumulative
    arrhythmic risk. Guideline-directed heart-failure therapy and ICD
    consideration belong to this stage.
  evidence:
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals can show variable combinations of hypertrophy, dilatation,
      hyper/hypo contractility, and arrhythmias
    explanation: >-
      ClinGen records the variable structural expression that characterizes overt
      ACTN2 cardiomyopathy.
- phase: Advanced and end-stage disease
  notes: >-
    Progressive pump failure culminating in transplantation, or sudden cardiac
    death from the arrhythmic arm. The biallelic protein-truncating genotype is
    the most severe reported course, with transplantation in early adulthood;
    heterozygous carriers have also progressed to transplantation.
  evidence:
  - reference: PMID:37834023
    reference_title: "Disruption of Z-Disc Function Promotes Mechanical Dysfunction in Human Myocardium: Evidence for a Dual Myofilament Modulatory Role by Alpha-Actinin 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Left ventricular free wall samples were obtained at the time of cardiac
      transplantation from a heart failure patient with the ACTN2 A868T
      heterozygous variant.
    explanation: >-
      Documents progression to transplantation in a heterozygous ACTN2 carrier.
  - reference: PMID:20022194
    reference_title: "Mutations in alpha-actinin-2 cause hypertrophic cardiomyopathy: a genome-wide analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those with syncope, heart failure, and premature sudden death
    explanation: >-
      Documents the two end-stage outcomes, pump failure and premature sudden
      death, in an ACTN2 kindred.
treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard heart-failure therapy for left ventricular systolic dysfunction —
    the four contemporary HFrEF pillars: an angiotensin receptor-neprilysin
    inhibitor (or an ACE inhibitor / angiotensin receptor blocker where ARNI is
    not tolerated), a beta-blocker, a mineralocorticoid receptor antagonist, and
    an SGLT2 inhibitor — which together target the neurohormonal amplifier of
    adverse remodeling. There is no ACTN2-specific disease-modifying therapy, so
    management is the generic DCM regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: angiotensin receptor-neprilysin inhibitor (sacubitril/valsartan)
      term:
        id: NCIT:C190796
        label: Angiotensin Receptor-Neprilysin Inhibitor
    - preferred_term: ACE inhibitor (alternative to ARNI)
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: mineralocorticoid receptor antagonist (spironolactone as the class exemplar)
      term:
        id: NCIT:C840
        label: Spironolactone
    - preferred_term: SGLT2 inhibitor
      term:
        id: NCIT:C98083
        label: SGLT2 Inhibitor
  target_mechanisms:
  - target: Neurohormonal Activation
    treatment_effect: INHIBITS
    description: >-
      Neurohormonal blockade interrupts the maladaptive amplifier between the
      primary Z-disc lesion and adverse ventricular remodeling.
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As DCM eventually leads to impaired contractility, standard approaches to
      prevent or treat heart failure are the first-line treatment for patients
      with DCM.
    explanation: >-
      Establishes standard heart-failure therapy as first-line management for
      dilated cardiomyopathy, of which CMD1AA is a genetic form.
- name: Implantable Cardioverter Defibrillator
  description: >-
    Device therapy for primary or secondary prevention of sudden cardiac death in
    carriers with high arrhythmic risk — relevant here because ventricular
    fibrillation and sudden death can occur in ACTN2 carriers with limited or no
    ventricular dilation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  notes: >-
    Indication follows general cardiomyopathy and arrhythmia guidelines; no
    ACTN2-specific risk-stratification rule has been validated.
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac resynchronization therapy and implantable cardioverter-defibrillators
      may be required to prevent life-threatening arrhythmias.
    explanation: >-
      Establishes device therapy for arrhythmic protection as part of standard DCM
      management, the framework applied to ACTN2 carriers. Evidence source is
      OTHER because this is a Nature Reviews Disease Primers review.
- name: Cascade Genetic Testing and Counseling
  description: >-
    Predictive ACTN2 testing and cardiac surveillance of first-degree relatives,
    with counseling that addresses incomplete penetrance and the marked
    intrafamilial variability of expression (dilated, hypertrophic, noncompacted,
    or purely arrhythmic).
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25224718
    reference_title: Exome sequencing identifies a mutation in the ACTN2 gene in a family with idiopathic ventricular fibrillation, left ventricular noncompaction, and sudden death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing is a useful adjunct to cardiac genetic testing in families
      with mixed clinical presentations.
    explanation: >-
      Supports genetic testing as the tool that resolves the diagnosis in ACTN2
      families whose clinical presentations do not fit one cardiomyopathy label.
  - reference: PMID:20301486
    reference_title: Dilated Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide a basic view of genetic risk assessment of at-risk asymptomatic
      relatives of a proband with DCM to inform cardiac surveillance and allow
      early detection and treatment of DCM to improve long-term outcome.
    explanation: >-
      The GeneReviews DCM overview frames genetic risk assessment of at-risk
      asymptomatic relatives, with cardiac surveillance for early detection, as
      the purpose of cascade evaluation — precisely this treatment. Evidence
      source is OTHER because GeneReviews is an expert-authored review resource.
- name: Heart Transplantation
  description: >-
    Advanced therapy for end-stage heart failure; explanted ACTN2-variant
    myocardium obtained at transplantation has been the source of the human
    mechanical studies of this disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  evidence:
  - reference: PMID:37834023
    reference_title: "Disruption of Z-Disc Function Promotes Mechanical Dysfunction in Human Myocardium: Evidence for a Dual Myofilament Modulatory Role by Alpha-Actinin 2."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Left ventricular free wall samples were obtained at the time of cardiac
      transplantation from a heart failure patient with the ACTN2 A868T
      heterozygous variant.
    explanation: >-
      Documents that an ACTN2 variant carrier progressed to transplantation; this
      is incidental evidence of transplant use in this disease rather than an
      efficacy study, hence PARTIAL.
experimental_models:
- name: Patient-derived ACTN2 truncating-variant iPSC-cardiomyocytes
  description: >-
    Induced pluripotent stem cell-derived cardiomyocytes generated from carriers
    of monoallelic and biallelic ACTN2 protein-truncating variants, characterized
    by RNA sequencing, video-based edge detection of contraction,
    immunohistochemistry, electron microscopy, and affinity-purification mass
    spectrometry, with CRISPR-Cas9 verification of the stop-gain variant. The
    reference human model for the ACTN2 contractile and Z-disc-ultrastructure
    phenotype.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cell_source: Patient-derived iPSC lines from ACTN2 protein-truncating variant carriers
  publication: PMID:34802252
  modeled_mechanisms:
  - target: Impaired Z-Disc Force Transmission and Myofilament Regulation
    description: >-
      Contractility and electron-microscopy readouts measure Z-disc
      ultrastructure and force generation in the variant background.
  - target: Sarcomeric Disarray and Cardiomyocyte Hypertrophy
    description: >-
      Immunohistochemistry quantifies cellular hypertrophy and myofibrillar
      disarray.
  - target: Loss of Sarcolemmal Partner Coupling and Arrhythmogenesis
    description: >-
      Affinity-purification mass spectrometry identified the loss of ACTN1 and
      GJA1 interactions on C-terminal truncation.
  evidence:
  - reference: PMID:34802252
    reference_title: Mono- and Biallelic Protein-Truncating Variants in Alpha-Actinin 2 Cause Cardiomyopathy Through Distinct Mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In patient-derived iPSC-cardiomyocytes, we investigated transcriptional
      profiles using RNA sequencing, contractile properties using video-based
      edge detection, and cellular hypertrophy using immunohistochemistry.
    explanation: >-
      Describes the model system and its readouts as used to characterize ACTN2
      cardiomyopathy.
- name: Isogenic ACTN2 missense hiPSC-cardiomyocytes and engineered heart tissue
  description: >-
    CRISPR/Cas9-generated heterozygous functional knock-out hiPSC lines carrying
    either a wild-type or a missense ACTN2 allele, differentiated to
    cardiomyocytes and assembled into engineered heart tissue, and profiled by
    immunofluorescence, live-cell imaging, RNA sequencing, and mass spectrometry.
    Provides the isogenic comparison underlying the proteopathy arm.
  experimental_model_type: IPSC_DERIVED_MODEL

discussions:
- discussion_id: actn2_lumping_vs_mondo_splitting
  prompt: >-
    Should dismech keep phenotype-specific ACTN2 entities (CMD1AA, CMH23,
    restrictive and arrhythmogenic forms, ACTN2 myopathy) as separate entries, or
    follow ClinGen in lumping them into a single ACTN2-related cardiac and
    skeletal myopathy entity?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Alpha-Actinin-2 Z-Disc Dysfunction
  rationale: >-
    ClinGen's Hereditary Cardiovascular Disease GCEP explicitly applied the
    Lumping and Splitting framework and concluded there is insufficient evidence
    to split ACTN2 presentations by inheritance, phenotype, or mechanism, whereas
    MONDO retains the phenotype-specific nodes that dismech uses as disease_term.
    This entry is scoped to the dilated node (MONDO:0012808) and records the
    hypertrophic and noncompaction expressions as spectrum context; if the field
    converges on the lumped entity, the dismech representation should be revisited
    rather than duplicated across sibling entries.
  evidence:
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Per criteria outlined by the ClinGen Lumping and Splitting Working Group,
      all disease entities have been lumped into one inclusive disease entity,
      which is now being called ACTN2-related cardiac and skeletal myopathy.
    explanation: >-
      Documents the lumping decision that is in tension with the MONDO
      phenotype-specific nodes.
  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Previously reported variants are in varying locations across the gene, but
      the potential clustering effect of pathogenic locations is not clearly
      understood.
    explanation: >-
      Absence of a domain-to-phenotype mapping is part of why the phenotype split
      is hard to defend on mechanistic grounds.
- discussion_id: actn2_dcm_mechanism_gap
  prompt: >-
    Which molecular mechanism — dominant-negative incorporation of mutant
    alpha-actinin-2 into the Z-disc, altered myofilament calcium sensitivity,
    protein destabilization with proteostatic stress, or loss of sarcolemmal
    ACTN1/GJA1 coupling — actually drives the dilated (as opposed to hypertrophic
    or arrhythmic) presentation, and what determines which phenotype a given
    carrier develops?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Z-Disc Force Transmission and Myofilament Regulation
  - pathophysiology#Mutant Alpha-Actinin-2 Destabilization and Proteostatic Stress
  rationale: >-
    The same ACTN2 variant can produce dilation in one relative and hypertrophy,
    noncompaction, arrhythmia, or nothing in another, and the available
    mechanistic studies each characterize a different single variant in a
    different system (explanted myocardium, patient iPSC-cardiomyocytes, isogenic
    hiPSC lines, knock-in mouse, purified protein). Without a
    variant-to-mechanism map the pathograph cannot state which arm is
    rate-limiting for the dilated phenotype, and variant interpretation stays
    unanchored to mechanism.
  proposed_experiments:
  - experiment_id: exp_actn2_allelic_panel_isogenic_hipsc_cm
    name: Allelic-panel isogenic hiPSC-cardiomyocyte comparison of ACTN2 variants
    description: >-
      Systematically phenotype an allelic panel of dilated-, hypertrophic-, and
      noncompaction-associated ACTN2 variants in isogenic hiPSC-cardiomyocytes
      and engineered heart tissue with matched readouts (Z-disc incorporation,
      protein stability and aggregation, myofilament calcium sensitivity,
      connexin-43 localization, force), so that phenotype-specific mechanisms can
      be compared directly rather than inferred across heterogeneous studies.
  evidence:
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The disease mechanism is currently unclear and may be variant-specific
      since some variants have been shown to result in protein aggregation while
      others do not have this effect
    explanation: >-
      ClinGen states the mechanism gap directly, including its variant-specific
      character.
  - reference: PMID:34802252
    reference_title: Mono- and Biallelic Protein-Truncating Variants in Alpha-Actinin 2 Cause Cardiomyopathy Through Distinct Mechanisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanisms linking ACTN2 mutations to myocardial disease phenotypes are
      unknown.
    explanation: >-
      Independent statement of the same gap from the study that separated the
      monoallelic and biallelic mechanisms.
- discussion_id: actn2_mouse_heterozygote_model_mismatch
  prompt: >-
    Why does a heterozygous Actn2 missense knock-in mouse remain phenotypically
    normal while heterozygous human carriers of comparable ACTN2 missense
    variants develop cardiomyopathy, and can such mice be used to model dominant
    ACTN2 disease at all?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Mutant Alpha-Actinin-2 Destabilization and Proteostatic Stress
  - pathophysiology#Sarcomeric Disarray and Cardiomyocyte Hypertrophy
  rationale: >-
    The only published Actn2 missense knock-in mouse shows no overt cardiac
    phenotype in heterozygotes (only molecular changes, and only in mature males),
    while homozygosity is embryonically lethal — a dosage profile that does not
    reproduce autosomal dominant human ACTN2 cardiomyopathy. Mechanistic
    inferences drawn from that model (proteasomal activation, mitochondrial and
    cell-cycle defects) therefore rest on either subclinical heterozygote
    molecular readouts or a lethal homozygous state with no human counterpart, and
    their translational weight for the human dilated phenotype is uncertain.
  proposed_experiments:
  - experiment_id: exp_actn2_mouse_stress_and_aging_challenge
    name: Stress- and age-challenged Actn2 heterozygote phenotyping with human comparison
    description: >-
      Phenotype Actn2 missense heterozygous mice under hemodynamic, exercise, and
      aging challenge with sex stratification, and compare the resulting molecular
      signatures against human ACTN2-variant myocardium and hiPSC-cardiomyocytes,
      to determine whether the silent heterozygote reflects a genuine species
      difference or an unstressed baseline.
  evidence:
  - reference: PMID:36899856
    reference_title: Insights into the Role of a Cardiomyopathy-Causing Genetic Variant in ACTN2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heterozygous Actn2 p.Met228Thr mice have no overt phenotype. Only mature
      males show molecular parameters indicative of cardiomyopathy.
    explanation: >-
      Documents the absent heterozygous phenotype that constitutes the
      human-model mismatch.
  - reference: PMID:36899856
    reference_title: Insights into the Role of a Cardiomyopathy-Causing Genetic Variant in ACTN2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By contrast, the variant is embryonically lethal in the homozygous setting
      and E15.5 hearts show multiple morphological abnormalities.
    explanation: >-
      The homozygous state is embryonically lethal, so the mechanistic readouts
      come from a genotype without a human dominant-disease counterpart.

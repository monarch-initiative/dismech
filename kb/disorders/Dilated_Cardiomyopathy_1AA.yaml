- name: Impaired Z-Disc Force Transmission and Myofilament Regulation
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Because the Z-disc both transmits force between sarcomeres and relays
    regulatory information to the thin and thick filaments, an abnormal
    alpha-actinin-2 degrades contraction and relaxation simultaneously.
    Explanted myocardium carrying an ACTN2 EF-hand variant shows increased
    myofilament calcium sensitivity, reduced sinusoidal stiffness, faster tension
    redevelopment, and increased thick-to-thin filament separation, while
    patient-derived iPSC-cardiomyocytes show impaired contractility and aberrant
    calcium handling. Truncated alpha-actinin-2 that is still incorporated into
    the sarcomere distorts Z-disc ultrastructure, a dominant-negative pattern.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Muscle contraction
    term:
      id: GO:0006936
      label: muscle contraction
    modifier: ABNORMAL
  - preferred_term: Intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37834023
    reference_title: "Disruption of Z-Disc Function Promotes Mechanical Dysfunction in Human Myocardium: Evidence for a Dual Myofilament Modulatory Role by Alpha-Actinin 2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, contractile mechanics of permeabilized ACTN2 A868T variant cardiac
      tissue displayed higher myofilament Ca2+ sensitivity of isometric force,
      reduced sinusoidal stiffness, and faster rates of tension redevelopment at
      all Ca2+ levels.
    explanation: >-
      Direct mechanical measurement in human myocardium carrying an ACTN2 variant
      demonstrates altered myofilament calcium sensitivity and passive stiffness.
      Evidence source is IN_VITRO because the measurements were made on
      permeabilized explanted tissue.
  - reference: PMID:37834023
    reference_title: "Disruption of Z-Disc Function Promotes Mechanical Dysfunction in Human Myocardium: Evidence for a Dual Myofilament Modulatory Role by Alpha-Actinin 2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Small-angle X-ray diffraction indicated increased separation between thick
      and thin filaments, possibly contributing to changes in muscle kinetics.
    explanation: >-
      Structural correlate of the mechanical defect: Z-disc dysfunction
      translates into altered interfilament spacing within the sarcomere.
  - reference: PMID:34802252
    reference_title: Mono- and Biallelic Protein-Truncating Variants in Alpha-Actinin 2 Cause Cardiomyopathy Through Distinct Mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In heterozygous indel cells, the truncated protein incorporates into
      cardiac sarcomeres, leading to aberrant Z-disc ultrastructure.
    explanation: >-
      Shows that a truncated ACTN2 product is incorporated into the sarcomere and
      distorts Z-disc ultrastructure, the dominant-negative version of this node.
  - reference: PMID:27287556
    reference_title: Hypertrophic cardiomyopathy mutations in the calponin-homology domain of ACTN2 affect actin binding and cardiomyocyte Z-disc incorporation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The full length mEos2 tagged protein expressed in adult cardiomyocytes
      shows that both mutations additionally affect Z-disc localization and
      dynamic behaviour.
    explanation: >-
      Demonstrates that actin-binding-domain variants (including A119T, later
      found segregating with DCM/LVNC/ventricular fibrillation) disturb Z-disc
      localization and turnover in cardiomyocytes. The cohort studied was
      hypertrophic, so this supports the molecular step rather than the dilated
      phenotype itself.
  downstream:
  - target: Sarcomeric Disarray and Cardiomyocyte Hypertrophy
    causal_link_type: DIRECT
    hypothesis_groups:
    - actn2_zdisc_force_transmission_model

- name: Mutant Alpha-Actinin-2 Destabilization and Proteostatic Stress
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    For a subset of variants, mutant alpha-actinin-2 is destabilized, misfolds,
    and aggregates within the cardiomyocyte. In isogenic hiPSC-cardiomyocyte
    models the mutant allele produces protein aggregation, multinucleation,
    hypertrophy, and myofibrillar disarray with activation of both the
    ubiquitin-proteasome system and the autophagy-lysosome pathway, loss of
    sarcomere-associated proteins, and reduced force in engineered heart tissue;
    an Actn2 missense knock-in mouse independently shows a destabilized protein
    with increased ubiquitin-proteasome activity. This proteopathy arm is
    variant-specific and has not been demonstrated in patient myocardium.

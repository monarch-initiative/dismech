    reference_title: ACTN2 Mutant Causes Proteopathy in Human iPSC-Derived Cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, the expression of ACTN2mut was associated with a marked

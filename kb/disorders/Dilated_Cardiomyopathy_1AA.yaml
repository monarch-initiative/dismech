- name: Neurohormonal Activation
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Neurohormonal Activation"
  biological_scale: ORGANISM
  role: amplifier
  description: >-
    As in other cardiomyopathies, the fall in contractile performance activates
    the renin-angiotensin-aldosterone and sympathetic systems. Initially
    compensatory, chronic activation drives cardiomyocyte hypertrophy, apoptosis,
    and fibrosis, converting the primary Z-disc lesion into progressive
    structural remodeling; this axis is what standard heart-failure
    pharmacotherapy targets in ACTN2 disease as in DCM generally.
  biological_processes:
  - preferred_term: Response to angiotensin
    term:
      id: GO:1990776
      label: response to angiotensin
    modifier: INCREASED
  evidence:
  - reference: PMID:25445411
    reference_title: "Biomarkers of activation of renin-angiotensin-aldosterone system in heart failure: how useful, how feasible?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The systemic as well as the tissue RAAS are also dedicated to promote
      tissue remodeling, particularly relevant after damage, when chronic
      activation may configure as a maladaptive response, leading to fibrosis,
      hypertrophy and apoptosis, and organ dysfunction.
    explanation: >-
      Shared module evidence that chronic renin-angiotensin-aldosterone
      activation is the maladaptive amplifier between a cardiomyocyte insult and
      structural remodeling. Evidence source is OTHER because this is a review.
  downstream:
  - target: Adverse Ventricular Remodeling
    causal_link_type: DIRECT

- name: Adverse Ventricular Remodeling
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  biological_scale: TISSUE
  role: central_effector
  description: >-
    Cardiomyocyte hypertrophy and loss, cardiac fibroblast activation, and
    interstitial matrix deposition remodel the ventricle. In ACTN2 disease the
    net geometry is variable — the same gene, and sometimes the same variant, can
    yield a dilated, hypertrophic, restrictive, or noncompacted ventricle, and
    the dominant pattern can differ between relatives — but the remodeling
    machinery itself is the conserved cardiomyopathy step.
  cell_types:
  - preferred_term: Cardiac fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell

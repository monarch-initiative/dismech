  - reference: PMID:36116040
    reference_title: Mutation update for the ACTN2 gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ACTN2 encodes alpha-actinin-2, a protein expressed in human cardiac and
      skeletal muscle. The protein, located in the sarcomere Z-disk, functions as
      a link between the anti-parallel actin filaments. This important structural
      protein also binds N-terminal titins, and thus contributes to sarcomere
      stability.
    explanation: >-
      Establishes the normal Z-disc function of alpha-actinin-2 (actin
      cross-linking and titin anchoring) whose perturbation is the primary lesion
      of this disorder. Evidence source is OTHER because this is a
      mutation-update review.
  - reference: PMID:34802252
    reference_title: Mono- and Biallelic Protein-Truncating Variants in Alpha-Actinin 2 Cause Cardiomyopathy Through Distinct Mechanisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ACTN2 (alpha-actinin 2) anchors actin within cardiac sarcomeres. The
      mechanisms linking ACTN2 mutations to myocardial disease phenotypes are
      unknown.
    explanation: >-
      Confirms the actin-anchoring role of ACTN2 in cardiac sarcomeres and that
      the genotype-to-phenotype mechanism was still open when this study was
      designed. Evidence source is OTHER because the quote is the paper's
      background framing rather than its experimental result.
  - reference: PMID:14567970
    reference_title: Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In another patient with DCM, a Q9R mutation was identified in
      alpha-actinin-2.
    explanation: >-
      The founding CMD1AA observation: an ACTN2 missense variant identified in a
      patient with dilated cardiomyopathy.
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      gain of function or dominant-negative effects are most likely;
      haploinsufficiency is not an established mechanism
    explanation: >-
      ClinGen's mechanism statement supports modeling the trigger as a
      qualitative perturbation of alpha-actinin-2 function (dominant-negative or
      gain of function) rather than simple loss of one allele.
  - reference: PMID:33802723
    reference_title: The Role of Z-disc Proteins in Myopathy and Cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Numerous proteins interact in the Z-disc to facilitate force transduction
      and intracellular signalling in both cardiac and skeletal muscle.
    explanation: >-
      Frames the Z-disc as both a force-transducing and a signalling structure,
      which is why an alpha-actinin-2 defect produces mechanical and signalling
      consequences rather than a purely structural one. Evidence source is OTHER
      because this is a review of Z-disc protein biology.

name: Dilated Cardiomyopathy 1AA
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- CMD1AA
- ACTN2 familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1AA
- cardiomyopathy, dilated, 1AA, with or without LVNC
description: >-
  Dilated cardiomyopathy 1AA (CMD1AA) is the ACTN2-related form of familial
  isolated dilated cardiomyopathy. ACTN2 encodes alpha-actinin-2, the only
  alpha-actinin isoform expressed in cardiac muscle and the principal
  cross-linker of antiparallel actin thin filaments at the sarcomeric Z-disc,
  where it also anchors the N-terminal region of titin and scaffolds Z-disc
  partners such as muscle LIM protein (MLP/CSRP3). Variants in ACTN2 destabilize
  Z-disc force transmission and myofilament regulation, producing sarcomeric
  disarray, cardiomyocyte hypertrophy, adverse ventricular remodeling, left
  ventricular dilation with systolic dysfunction, and heart failure. The clinical
  picture is notably heterogeneous even within a single family: dilated
  cardiomyopathy may occur alone or together with left ventricular noncompaction
  (hence the OMIM designation "with or without LVNC"), and atrial and ventricular
  arrhythmias, idiopathic ventricular fibrillation, and sudden cardiac death are
  part of the spectrum. CMD1AA is one node of a broader ACTN2 allelic series that
  also includes hypertrophic (CMH23), restrictive, and left-dominant
  arrhythmogenic cardiomyopathy plus ACTN2-related skeletal myopathy; ClinGen has
  lumped that whole spectrum into a single "ACTN2-related cardiac and skeletal
  myopathy" entity with Definitive gene-disease validity, while MONDO keeps the
  phenotype-specific nodes (including MONDO:0012808) separate. Inheritance is
  predominantly autosomal dominant, with rare biallelic protein-truncating
  disease.
category: Genetic

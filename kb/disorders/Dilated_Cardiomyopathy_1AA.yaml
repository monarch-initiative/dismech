- category: Cardiovascular
  name: Restrictive Cardiomyopathy
  description: >-
    Restrictive physiology — impaired ventricular filling with near-normal cavity
    size and wall thickness — is the third structural expression of ACTN2
    variation, and is the phenotype reported for the homozygous protein-truncating
    genotype that anchors the recessive inheritance block in this entry (the
    p.Gln860Ter patient who progressed to transplantation in early adulthood).
    ACTN2 was also recovered as one of the pathogenic cytoskeletal-gene findings
    in a next-generation-sequencing cohort of idiopathic restrictive
    cardiomyopathy.

- name: Heart Failure and Sudden Cardiac Death
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint is structural and functional cardiac impairment:
    symptomatic heart failure that may progress to end-stage disease requiring
    transplantation, and — because the arrhythmic arm can act independently of
    pump failure — syncope, ventricular fibrillation, and sudden cardiac death,
    sometimes as the presenting event in an otherwise well relative.
  biological_processes:
  - preferred_term: Heart contraction
    term:
      id: GO:0060047
      label: heart contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20022194
    reference_title: "Mutations in alpha-actinin-2 cause hypertrophic cardiomyopathy: a genome-wide analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected family members showed marked clinical diversity, ranging from
      asymptomatic individuals to those with syncope, heart failure, and
      premature sudden death.
    explanation: >-
      Documents the clinical endpoints (heart failure, syncope, premature sudden
      death) in an ACTN2 kindred. The index family was hypertrophic, so this
      supports the endpoint spectrum of ACTN2 disease rather than the dilated
      phenotype specifically.
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As DCM eventually leads to impaired contractility, standard approaches to
      prevent or treat heart failure are the first-line treatment for patients
      with DCM.
    explanation: >-
      Shared module evidence that the dilated cardiomyopathy process culminates
      in impaired contractility managed as heart failure. Evidence source is
      OTHER because this is a review.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the ACTN2-specific form of
    dilated cardiomyopathy. ACTN2 is a minority cause of DCM: the ClinGen DCM
    gene-curation panel placed it in the "moderate evidence" tier (7 of 51
    curated genes), below the definitive/strong genes such as TTN, LMNA, and MYH7
    that account for most genotyped familial DCM.
  evidence:
  - reference: PMID:33947203
    reference_title: Evidence-Based Assessment of Genes in Dilated Cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven genes (14%; ACTC1, ACTN2, JPH2, NEXN, TNNI3, TPM1, VCL) including 2
      additional ontologies were classified as moderate evidence; these genes are
      likely to emerge as strong or definitive with additional evidence.
    explanation: >-
      Establishes ACTN2 as a moderate-evidence (i.e., minority, not
      high-frequency) monogenic cause of DCM in the ClinGen curation of 51 DCM
      genes. Supports the rarity statement but does not itself provide a
      population prevalence, hence PARTIAL.
inheritance:
- name: Autosomal Dominant
  description: >-
    Most reported ACTN2 cardiomyopathy families show autosomal dominant
    transmission of a heterozygous missense or truncating variant, with
    incomplete penetrance and marked intrafamilial variability in the resulting
    cardiac phenotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ACTN2 | HGNC:164 | ACTN2-related cardiac and skeletal myopathy |
      MONDO:0700349 | AD | Definitive
    explanation: >-
      ClinGen Hereditary Cardiovascular Disease GCEP records autosomal dominant
      inheritance for the ACTN2 gene-disease relationship, with Definitive
      clinical validity.
- name: Autosomal Recessive (Biallelic Truncating)
  description: >-
    Rare biallelic ACTN2 protein-truncating genotypes cause cardiomyopathy
    through a mechanism distinct from the heterozygous state; a homozygous
    stop-gain variant was functionally validated by CRISPR-Cas9 editing in
    patient-derived iPSC-cardiomyocytes.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34802252
    reference_title: Mono- and Biallelic Protein-Truncating Variants in Alpha-Actinin 2 Cause Cardiomyopathy Through Distinct Mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, these data advance our understanding of the role of ACTN2 in the
      human heart and establish recessive inheritance of ACTN2 truncation as
      causative of disease.
    explanation: >-
      Directly establishes a recessive (biallelic truncating) mode of inheritance
      for ACTN2 cardiomyopathy alongside the dominant form. Classified IN_VITRO
      because causality was demonstrated in patient-derived iPSC-cardiomyocytes
      with CRISPR-Cas9 validation.
mechanistic_hypotheses:
- hypothesis_group_id: actn2_zdisc_force_transmission_model
  hypothesis_label: Z-disc force-transmission and myofilament-regulation model
  status: CANONICAL
  description: >-
    The canonical model holds that ACTN2 variants degrade the mechanical and
    regulatory function of the Z-disc: cross-linking of antiparallel actin
    filaments and anchoring of Z-disc titin are perturbed, altering both
    thin-filament calcium sensitivity and thick-filament activation, so force
    generation and relaxation become abnormal and the myocardium remodels.
  evidence:
  - reference: PMID:37834023
    reference_title: "Disruption of Z-Disc Function Promotes Mechanical Dysfunction in Human Myocardium: Evidence for a Dual Myofilament Modulatory Role by Alpha-Actinin 2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results can be explained by two Z-disc mediated communication pathways
    explanation: >-
      The study of explanted human myocardium carrying an ACTN2 variant states
      the two-pathway (actin/thin-filament and titin/thick-filament) Z-disc
      communication model that underlies this hypothesis group. The quote stops
      before the clause naming the two pathways because the source text spells
      them with a Greek alpha; the quantitative findings are quoted on the
      corresponding pathophysiology node.
- hypothesis_group_id: actn2_variant_specific_proteotoxicity
  hypothesis_label: Variant-specific alpha-actinin-2 destabilization and proteostatic stress
  status: EMERGING
  description: >-
    An additional, variant-specific arm proposes that some mutant alpha-actinin-2
    proteins are destabilized, misfold, and aggregate, triggering
    ubiquitin-proteasome and autophagy-lysosome activation and depleting
    sarcomere-associated proteins — a proteopathy superimposed on the mechanical
    defect. Human isogenic hiPSC-cardiomyocytes and an Actn2 knock-in mouse both
    show proteasomal activation, but whether this arm operates in the dilated (as
    opposed to hypertrophic or myopathic) presentations, and in patient
    myocardium rather than engineered tissue, is unresolved; ClinGen notes that
    the ACTN2 disease mechanism remains unclear and may be variant-specific.
  evidence:
  - reference: PMID:36078153
    reference_title: ACTN2 Mutant Causes Proteopathy in Human iPSC-Derived Cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      our study highlights the activation of proteolytic systems in ACTN2mut
      hiPSC-CMs likely to cope with ACTN2 aggregation and therefore directs
      towards proteopathy as an additional cellular pathology caused by this
      ACTN2 variant
    explanation: >-
      Provides the primary in vitro basis for the proteotoxicity arm, and its
      authors frame it as an additional (not established) cellular mechanism.
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The disease mechanism is currently unclear and may be variant-specific
      since some variants have been shown to result in protein aggregation while
      others do not have this effect
    explanation: >-
      ClinGen explicitly records that aggregation is variant-specific and that
      the overall mechanism is unresolved, which is why this hypothesis group is
      EMERGING rather than canonical.
pathophysiology:
- name: Alpha-Actinin-2 Z-Disc Dysfunction
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    ACTN2 encodes alpha-actinin-2, the only alpha-actinin isoform expressed in
    cardiac muscle. As an antiparallel homodimer it cross-links thin filaments
    from adjacent sarcomeres at the Z-disc, anchors the N-terminal (Z-disc)
    region of titin, and provides a docking platform for Z-disc partners
    including muscle LIM protein (MLP/CSRP3). Disease-associated variants are
    distributed across the actin-binding calponin-homology domains, the
    spectrin-repeat rod, and the C-terminal EF-hand/calmodulin-like region; they
    perturb actin binding, titin interaction, Z-disc incorporation, protein
    stability, or partner binding rather than abolishing the protein, and
    haploinsufficiency is not an established mechanism.

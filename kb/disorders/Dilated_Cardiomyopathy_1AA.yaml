  evidence:
  - reference: CGGV:assertion_6710e329-d391-4355-85a5-02d03f8791a3-2025-07-23T040000.000Z
    reference_title: "ACTN2 / ACTN2-related cardiac and skeletal myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac phenotypes are associated with both gain and loss of function ACTN2
      variants and do not always fit well into classical cardiomyopathy diagnosis.
    explanation: >-
      Supports modeling remodeling geometry as variable in ACTN2 disease rather
      than fixed to the dilated pattern.
  - reference: PMID:22752727
    reference_title: "The role of TWEAK/Fn14 in cardiac remodeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiological basis of heart failure is cardiac remodeling, a
      process that comprises structural and functional changes including
      cardiomyocyte proliferation, hypertrophy, necrosis, apoptosis, autophagy,
      interstitial fibrosis, contractile dysfunction and ventricular dilatation.
    explanation: >-
      Shared module evidence enumerating the components of adverse remodeling
      that this node represents. Evidence source is OTHER because this is a
      mechanistic review.
  downstream:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    causal_link_type: DIRECT

- name: Failed Trabecular Compaction
  biological_scale: TISSUE
  role: effector
  description: >-
    A subset of ACTN2 carriers show left ventricular noncompaction — prominent
    trabeculae with deep intertrabecular recesses over a thin compacted layer —
    either isolated or together with ventricular dilation, which is why the OMIM
    entity is designated "with or without LVNC". In a large rare-variant
    association analysis, ACTN2 truncating variants were among the few lesions
    associated specifically with noncompaction rather than shared with DCM/HCM,
    suggesting a partly distinct developmental route, plausibly through impaired
    cardiomyocyte maturation.
  locations:
  - preferred_term: Heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:33500567
    reference_title: Systematic large-scale assessment of the genetic architecture of left ventricular noncompaction reveals diverse etiologies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, truncating variants in MYH7, ACTN2, and PRDM16 were uniquely
      associated with LVNC and may reflect a distinct LVNC etiology.
    explanation: >-
      Case-control rare-variant evidence that ACTN2 truncating variants are
      specifically associated with a noncompaction phenotype.
  - reference: PMID:25224718
    reference_title: Exome sequencing identifies a mutation in the ACTN2 gene in a family with idiopathic ventricular fibrillation, left ventricular noncompaction, and sudden death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While some individuals were asymptomatic, other presentations included left
      ventricular non-compaction, a resuscitated cardiac arrest due to idiopathic
      ventricular fibrillation, dilated cardiomyopathy, and sudden unexplained
      death.
    explanation: >-
      Family segregation study showing noncompaction and dilated cardiomyopathy
      co-occurring within one ACTN2 kindred.
  - reference: PMID:37374362
    reference_title: "Impaired Cardiomyocyte Maturation Leading to DCM: A Case Report and Literature Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report presents a rare case of DCM with myocardial non-compaction,
      probably resulting from allelic collapse of both the ACTN2 and RYR2 genes.
    explanation: >-
      Pediatric case of dilated cardiomyopathy with noncompaction attributed to a
      1q43 deletion, framed by the authors as impaired cardiomyocyte maturation.
      Support is PARTIAL because the deletion removes RYR2 as well as ACTN2, so
      the ACTN2 contribution cannot be isolated.
  downstream:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Left Ventricular Dilation and Systolic Dysfunction
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  biological_scale: ORGANISM
  role: effector
  description: >-
    The remodeled ventricle dilates and loses systolic shortening, producing the
    defining CMD1AA phenotype: left ventricular enlargement with reduced ejection
    fraction in the absence of loading conditions or coronary disease sufficient
    to explain it. Penetrance is incomplete and expression is heterogeneous, so
    affected relatives may be asymptomatic, dilated, hypertrophic, or arrhythmic;
    population data on DCM-gene carriers show that arrhythmia without substantial
    ventricular dilation is a common early expression.
  cell_types:

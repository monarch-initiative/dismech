notes: >-
  Scope: this entry models MONDO:0012808 (dilated cardiomyopathy 1AA), the
  ACTN2-related dilated node of the ACTN2 allelic series, and conforms to the
  cardiomyopathy_maladaptive_remodeling module. The hypertrophic (CMH23),
  restrictive, left-dominant arrhythmogenic, and skeletal-myopathy expressions of
  ACTN2 variation appear here only as spectrum context and in the
  lumping/splitting discussion; ClinGen curates them as one lumped entity
  (MONDO:0700349, the MONDO parent of this term).

  Named Entity Confusion preflight (per CLAUDE.md): MONDO:0012808 was verified
  with OAK before curation — the definition names ACTN2 as the causal gene, the
  OMIM xref is OMIM:612158, and synonyms include CMD1AA and "cardiomyopathy,
  dilated, 1AA, with or without LVNC". All curated evidence concerns ACTN2, and
  the OMIM entry's inclusion of "cardiomyopathy, hypertrophic, 23" as a synonym
  of the same locus is handled explicitly rather than silently mixed into the
  dilated phenotype.

  Several mechanistic evidence items come from ACTN2 variants first reported in
  hypertrophic cardiomyopathy (A119T, p.Met228Thr) or from explanted myocardium of
  a single heart-failure patient (A868T). These are retained because they
  characterize the shared Z-disc mechanism, and each explanation states the
  phenotype caveat explicitly rather than implying dilated-specific evidence.

  GeneReviews scope: there is no ACTN2-specific GeneReviews chapter, so the
  applicable resource is the disease-level "Dilated Cardiomyopathy Overview"
  (PMID:20301486), tagged accordingly in `references`. The indexed record carries
  a four-clause purpose statement rather than the full chapter text, so
  section-by-section GeneReviews mining (Clinical Characteristics, Management,
  Genetic Counseling) is not possible from the cache; the two clauses that are
  verbatim-quotable are cited — the proband-evaluation clause on the
  diagnosis-by-exclusion entry, and the at-risk-relative risk-assessment clause
  on cascade testing. The Z-disc protein review (PMID:33802723) is now cited on
  the trigger node for the force-transduction/signalling framing.

  Diagnostics are modeled DCM-wide where no ACTN2-specific study exists (CMR-LGE
  prognosis, natriuretic peptides, penetrance) and those items are marked PARTIAL
  with the reason stated. The one ACTN2-specific diagnostic point is copy-number
  analysis: two informative genotypes in this gene are structural (a heterozygous
  multi-exon deletion and the 1q43 deletion that also removes RYR2), so a
  sequencing-only panel can miss the diagnosis.

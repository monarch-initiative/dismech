epidemiology:
- name: Absence of an agreed case definition drives the prevalence spread
  description: >-
    Published prevalence ranges from 0.3% to 3% of pregnancies, and recurrence
    estimates range from 15% to 81%. Neither spread reflects real geographic or
    biological variation so much as the absence of an internationally agreed
    definition of hyperemesis: studies that define it as a hospital admission
    capture a small severe subset, while symptom-scale definitions capture a
    much broader group. This is the single largest obstacle to interpreting HG
    epidemiology and to counselling women about recurrence risk.
  evidence:
  - reference: PMID:32021976
    reference_title: "The chance of recurrence of hyperemesis gravidarum: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This systematic review found five heterogeneous studies reporting
      recurrence rates from 15 to 81%.
    explanation: >-
      Documents the extreme spread in recurrence estimates that motivates the
      definitional argument.
  - reference: PMID:32021976
    reference_title: "The chance of recurrence of hyperemesis gravidarum: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A prospective longitudinal cohort study using an internationally agreed
      definition of HG and outcomes meaningful to patients is required to
      establish the true recurrence rate of HG.
    explanation: >-
      The authors' explicit attribution of the uncertainty to the missing
      standard definition.
- name: Hospitalization burden
  description: >-
    Hyperemesis is one of the most common indications for hospital admission in
    pregnancy, which is why the condition's cost and service impact is out of
    proportion to its low case-fatality.
  evidence:
  - reference: PMID:28614956
    reference_title: "Interventions for treating hyperemesis gravidarum: a Cochrane systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is one of the most common indications for hospitalization in pregnancy.
    explanation: >-
      Establishes the service-level burden.
environmental:
- name: Maternal Helicobacter pylori infection
  description: >-
    Maternal H. pylori infection is modestly associated with hyperemesis (pooled
    OR 1.35 across 38 studies, 10,289 patients). The authors propose that
    detection and eradication could form part of management, but the effect is
    small, publication bias was present, and most contributing studies came from
    a single country — so this is a candidate modifier rather than an
    established cause.
  evidence:
  - reference: PMID:29178407
    reference_title: A meta-analysis of the association between Helicobacter pylori (H. pylori) infection and hyperemesis gravidarum.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      H. pylori infection was associated with an increased likelihood of
      hyperemesis gravidarum during pregnancy.
    explanation: >-
      Conclusion of the meta-analysis; typed PARTIAL because the same paper
      reports publication bias and definitional heterogeneity.
diagnosis:
- name: Validated severity scoring (PUQE, HELP)
  description: >-
    Diagnosis is clinical, and severity is graded with a validated instrument —
    the Pregnancy-Unique Quantification of Emesis (PUQE) or HyperEmesis Level
    Prediction (HELP) score — rather than with ketonuria, which guidelines
    explicitly reject as a marker of dehydration or severity.
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An objective and validated index of nausea and vomiting such as the
      Pregnancy-Unique Quantification of Emesis (PUQE) and HyperEmesis Level
      Prediction (HELP) tools can be used to classify the severity of NVP and HG.
    explanation: >-
      Grade C guideline recommendation defining the accepted severity
      instruments.
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ketonuria is not an indicator of dehydration and should not be used to
      assess severity.
    explanation: >-
      Grade A statement removing ketonuria from the assessment pathway.
treatments:
- name: First-Line Antiemetics (Antihistamines, Phenothiazines, Doxylamine/Pyridoxine)
  description: >-
    Antihistamines, phenothiazines and the doxylamine/pyridoxine combination
    have safety and efficacy data in pregnancy and are prescribed first. They
    act on histaminergic, dopaminergic and cholinergic inputs to the brainstem
    emetic circuitry rather than on the GDF15-GFRAL axis itself, which is why
    they are symptomatic rather than mechanism-directed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxylamine
      term:
        id: CHEBI:51380
        label: doxylamine
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
    - preferred_term: promethazine
      term:
        id: CHEBI:8461
        label: promethazine
  target_mechanisms:
  - target: Intractable Nausea, Vomiting and Food Aversion
    treatment_effect: INHIBITS
    description: >-
      Blockade of histaminergic and dopaminergic inputs to the brainstem emetic
      circuitry reduces nausea and vomiting downstream of the GDF15 signal.
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are safety and efficacy data for first line antiemetics such as anti
      (H1) histamines, phenothiazines and doxylamine/pyridoxine (Xonvea®) and
      they should be prescribed initially when required for NVP and HG
    explanation: >-
      Grade A guideline recommendation establishing this class as first-line.
- name: Ondansetron
  description: >-
    A 5-HT3 receptor antagonist used as second-line therapy when first-line
    antiemetics fail. The much-publicised first-trimester orofacial clefting
    signal is a very small absolute risk increase, and guidelines are explicit
    that fear of it should not lead to withholding effective treatment from a
    woman with poorly controlled hyperemesis — one of the clearest
    risk-communication statements in obstetric prescribing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ondansetron
      term:
        id: CHEBI:7773
        label: Ondansetron
  target_mechanisms:
  - target: Intractable Nausea, Vomiting and Food Aversion
    treatment_effect: INHIBITS
    description: >-
      5-HT3 antagonism at the area postrema and on vagal afferents suppresses
      the emetic reflex.
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is evidence that ondansetron is safe and effective. Its use as a
      second line antiemetic should not be discouraged if first line antiemetics
      are ineffective.
    explanation: >-
      Grade B recommendation positioning ondansetron as second-line.
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women can be reassured regarding a very small increase in the absolute
      risk of orofacial clefting with ondansetron use in the first trimester,
      which should be balanced with the risks of poorly managed HG.
    explanation: >-
      Records the teratogenicity signal and its guideline-sanctioned
      interpretation.
- name: Metoclopramide
  description: >-
    A dopamine D2 antagonist and prokinetic, safe and effective alone or in
    combination, but placed second-line because of extrapyramidal effects;
    intravenous doses are given by slow bolus over at least three minutes to
    limit them. Head-to-head with ondansetron there is no clear efficacy
    difference, but metoclopramide causes more drowsiness and dry mouth.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metoclopramide
      term:
        id: CHEBI:107736
        label: metoclopramide
  target_mechanisms:
  - target: Intractable Nausea, Vomiting and Food Aversion
    treatment_effect: INHIBITS
    description: >-
      Central D2 antagonism plus gastric prokinesis reduces nausea and vomiting.
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metoclopramide is safe and effective and can be used alone or in
      combination with other antiemetics.
    explanation: >-
      Grade B recommendation supporting efficacy and combination use.
  - reference: PMID:28614956
    reference_title: "Interventions for treating hyperemesis gravidarum: a Cochrane systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more women taking metoclopramide complained of drowsiness and dry mouth
    explanation: >-
      Head-to-head tolerability disadvantage versus ondansetron, informing the
      second-line placement.
- name: Intravenous Rehydration with Normal Saline and Potassium Chloride
  description: >-
    The core supportive intervention. Normal saline with added potassium
    chloride in each bag, titrated to daily electrolyte monitoring, corrects the
    volume depletion and the hypokalaemic hypochloraemic alkalosis. Dextrose is
    specifically avoided before thiamine is given.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fluid therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Volume Depletion and Electrolyte Derangement
    treatment_effect: INHIBITS
    description: >-
      Direct replacement of the water, sodium, chloride and potassium lost in
      vomitus.
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal saline (0.9% NaCl) with additional potassium chloride in each bag,
      with administration guided by daily monitoring of electrolytes, is the
      most appropriate intravenous hydration.
    explanation: >-
      Grade C recommendation specifying the replacement fluid.
- name: Thiamine Supplementation
  description: >-
    Given to every woman admitted with vomiting or severely reduced dietary
    intake, and specifically before any dextrose or parenteral nutrition,
    because a carbohydrate load in a thiamine-deplete patient can precipitate
    Wernicke encephalopathy. This is the one intervention in hyperemesis whose
    purpose is prevention of an irreversible complication rather than symptom
    relief.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: thiamine
      term:
        id: CHEBI:26948
        label: vitamin B1
  target_mechanisms:
  - target: Thiamine Depletion
    treatment_effect: INHIBITS
    description: >-
      Supplementation repletes the depleted thiamine stores directly. It acts on
      the depletion node rather than on the encephalopathy: preventing Wernicke
      encephalopathy is the downstream consequence of correcting the deficiency,
      not a separate action on the established neurological syndrome.
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thiamine supplementation (either oral 100 mg tds or intravenous as part of
      vitamin B complex (Pabrinex®)) should be given to all women admitted with
      vomiting, or severely reduced dietary intake, especially before
      administration of dextrose or parenteral nutrition.
    explanation: >-
      Guideline recommendation with the explicit dextrose-precedence warning.
- name: Corticosteroids
  description: >-
    Reserved for hyperemesis refractory to combination antiemetics. Trial data
    show no reduction in days of admission versus placebo but a reduced
    readmission rate, so the benefit is in preventing relapse rather than
    shortening the index episode.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Intractable Nausea, Vomiting and Food Aversion
    treatment_effect: INHIBITS
    description: >-
      Mechanism in hyperemesis is not established; the observed effect is a
      reduction in readmission rather than in index admission length.
  evidence:
  - reference: PMID:28614956
    reference_title: "Interventions for treating hyperemesis gravidarum: a Cochrane systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there was no difference in days of hospital admission compared to placebo
      (MD -0.30, 95% CI -0.70-0.10), but there was a decreased readmission rate
      (RR 0.69, 95% CI 0.50-0.94; 4 studies, 269 women)
    explanation: >-
      Quantifies the split result — no effect on index admission, reduced
      readmission — that defines the role of corticosteroids here.
- name: Psychological Support
  description: >-
    Depression and anxiety are markedly more frequent in hyperemesis, and the
    meta-analysis that established this concludes with a call to build
    psychological care into hyperemesis services. Treating the psychological
    burden as a consequence to be managed, rather than a cause to be diagnosed,
    is the practical corollary of deprecating the psychogenic model.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: psychotherapy
    term:
      id: NCIT:C15308
      label: Psychotherapy
  target_mechanisms:
  - target: Psychological Morbidity
    treatment_effect: INHIBITS
    description: >-
      Addresses the depression, anxiety and post-traumatic stress that follow
      severe or dismissed hyperemesis.
  evidence:
  - reference: PMID:27418035
    reference_title: "Psychological morbidity associated with hyperemesis gravidarum: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings should prompt service development for women with HG that
      includes provision of psychological care and support.
    explanation: >-
      The meta-analysis's own service recommendation.
differential_diagnoses:
- name: Nausea and vomiting of pregnancy (non-severe)
  description: >-
    The overwhelmingly more common condition, affecting roughly 80% of
    pregnancies. The boundary with hyperemesis is not sharp and is exactly what
    the absent international case definition fails to fix; severity instruments
    (PUQE, HELP) are the practical discriminator.
  evidence:
  - reference: PMID:28614956
    reference_title: "Interventions for treating hyperemesis gravidarum: a Cochrane systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While nausea and vomiting in early pregnancy are very common, affecting
      approximately 80% of the pregnancies, hyperemesis gravidarum is a severe
      form affecting 0.3-1.0% of the pregnancies.
    explanation: >-
      Quantifies the two-order-of-magnitude gap between the common condition and
      its severe form.
- name: Gestational trophoblastic disease
  description: >-
    Hydatidiform mole and choriocarcinoma secrete very large amounts of hCG and
    commonly cause both hyperemesis-like vomiting and frank hyperthyroidism.
    Removal of the mole or effective chemotherapy cures the hyperthyroidism —
    the cleanest demonstration that hCG drives the thyroid arm, and a reason
    ultrasound is part of the workup for severe early-pregnancy vomiting.
  evidence:
  - reference: PMID:10447009
    reference_title: "Human chorionic gonadotropin and the thyroid: hyperemesis gravidarum and trophoblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trophoblastic tumors, hydatidiform mole, and choriocarcinoma often cause
      hyperthyroidism because they secrete very large amounts of hCG.
    explanation: >-
      Establishes the differential and the shared hCG mechanism.
discussions:
- discussion_id: hg_gdf15_desensitization_human_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Low Prepregnancy GDF15 Exposure and Heightened Maternal Sensitivity
  prompt: >-
    Does the GDF15 desensitization demonstrated in mice actually operate in
    human pregnancy, and can prepregnancy GDF15 exposure therefore be used
    preventively?
  rationale: >-
    The desensitization step is the load-bearing part of the canonical model —
    it is what converts a correlation between GDF15 and vomiting into a
    prevention strategy — but the direct demonstration is a mouse food-intake
    experiment. The human side is inferential: two natural experiments
    (genetically low non-pregnant GDF15 raising risk, beta-thalassaemia lowering
    symptoms) are consistent with desensitization but do not measure it. Whether
    deliberate prepregnancy GDF15 exposure would desensitize a human woman
    safely and durably, and at what dose and interval, is untested. This is a
    model-fidelity question rather than an absence of evidence, so it is filed
    as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP.
  proposed_experiments:
  - experiment_id: exp_hg_preconception_gdf15_trajectory
    name: Preconception-to-first-trimester GDF15 trajectory cohort
    description: >-
      Measure GDF15 before conception and serially through the first trimester
      in a prospective preconception cohort, testing whether the ratio of
      gestational to prepregnancy GDF15 predicts hyperemesis severity better
      than the absolute gestational concentration. A ratio-dominant result would
      be the human counterpart of the murine desensitization finding.
  - experiment_id: exp_hg_gfral_tachyphylaxis_volunteers
    name: Controlled prepregnancy GDF15 exposure with nausea endpoints
    description: >-
      Dose-finding study of controlled GDF15 or GFRAL-agonist exposure in
      non-pregnant volunteers, measuring tachyphylaxis of the nausea and
      food-intake response, to establish whether human GFRAL desensitizes and
      over what timescale.
  - experiment_id: exp_hg_chronic_high_gdf15_populations
    name: Nausea and vomiting of pregnancy in other chronically GDF15-high populations
    description: >-
      Assess nausea and vomiting of pregnancy in human populations with
      chronically elevated GDF15 other than beta-thalassaemia (for example
      chronic kidney disease, or long-term metformin exposure) as independent
      replications of the beta-thalassaemia observation, guarding against a
      thalassaemia-specific confound.
- discussion_id: hg_true_recurrence_rate
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Intractable Nausea, Vomiting and Food Aversion
  prompt: >-
    What is the true recurrence rate of hyperemesis gravidarum in a subsequent
    pregnancy?
  rationale: >-
    Recurrence is the single question women most often ask, and the honest
    answer is currently a range from 15% to 81%. The systematic review that
    established this range found only five eligible studies, all of low quality,
    with heterogeneous definitions and follow-up from 2 to 31 years, and could
    not meta-analyse them. Because hyperemesis risk under the canonical model is
    partly a stable maternal trait (prepregnancy GDF15 set-point) and partly a
    pregnancy-specific variable (fetal GDF15 output), the recurrence rate is
    also a direct test of the model's structure — a very high recurrence rate
    would favour the maternal-trait component, a low one the fetal component.
  proposed_experiments:
  - experiment_id: exp_hg_standard_definition_recurrence_cohort
    name: Prospective recurrence cohort with an agreed HG definition
    description: >-
      Prospective longitudinal cohort using an internationally agreed HG
      definition and patient-meaningful outcomes, as called for by the
      systematic review authors, to produce a recurrence estimate not driven by
      admission-based ascertainment.
  - experiment_id: exp_hg_recurrence_maternal_vs_fetal_partition
    name: Partitioning recurrence into maternal and fetal contributions
    description: >-
      Stratify recurrence by maternal prepregnancy GDF15 genotype and by whether
      the subsequent pregnancy shares a paternal partner, separating the
      maternal-sensitivity and fetal-production contributions predicted by the
      canonical model.
- discussion_id: hg_psychological_morbidity_direction
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Psychological Morbidity
  prompt: >-
    Is the psychological morbidity of hyperemesis a cause or a consequence of
    the physical illness?
  rationale: >-
    For most of the twentieth century the causal arrow was drawn from psyche to
    stomach. The meta-analytic association is real and large, but it is
    cross-sectional and cannot establish direction. The contemporary consensus
    reverses the arrow, and dismech models it that way, for three reasons: the
    genetic and hormonal mechanism now accounts for the emesis without invoking
    psychology; the psychological findings include post-traumatic stress, which
    is by definition consequent; and the persistence of the psychogenic framing
    is itself documented as a barrier to care. The direction is nonetheless not
    formally proven and is recorded here as a live controversy rather than a
    settled point.
notes: >-
  Curated in response to issue #7837 (obstetrics coverage gap). Two references
  that looked promising were checked and discarded rather than used: PMID
  31548540, which a preliminary search suggested was the Nature Reviews Disease
  Primers article on nausea and vomiting of pregnancy, is in fact an unrelated
  paper on liver-disease imaging biomarkers; and the genuine Primers article
  (PMID:31515515) plus the CMAJ review (PMID:38621783) both cache without
  abstract text, so no snippet from either could be verified and neither is
  cited. Frequency qualifiers were deliberately omitted from all phenotypes: the
  available sources support the disease-phenotype associations but not specific
  HPO frequency bands, and HG's missing case definition makes any band
  assignment definition-dependent. The hCG-thyroid arm is modeled with an
  UNKNOWN-typed edge into the emesis node because no source establishes
  direction. Coverage that would extend this entry: quantitative first-trimester
  GDF15 trajectory data as a Biochemical marker with reference ranges, and the
  long-term offspring neurodevelopmental outcome literature.

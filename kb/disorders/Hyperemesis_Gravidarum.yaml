name: Hyperemesis Gravidarum
creation_date: '2026-08-03T00:00:00Z'
category: Complex
synonyms:
- HG
- severe nausea and vomiting of pregnancy
- pernicious vomiting of pregnancy
description: >-
  Hyperemesis gravidarum is nausea and vomiting in pregnancy severe enough to
  cause weight loss, dehydration, electrolyte imbalance and nutritional
  deficiency, and it is one of the most common indications for hospitalization
  in pregnancy. For most of the twentieth century its cause was attributed to
  psychological factors or to a shifting list of hormonal candidates, and the
  condition was widely dismissed as self-limiting. That position is no longer
  tenable. Genome-wide association work implicated GDF15 (chr19p13.11) and
  IGFBP7 (chr4q12), and a subsequent human genetic and mass-spectrometry study
  established a two-part mechanism: the vast majority of GDF15 in maternal
  plasma is derived from the feto-placental unit, and the maternal risk of
  hyperemesis is set not only by how much GDF15 the fetus makes but by how
  sensitive the mother is to it. Sensitivity is in turn shaped by prepregnancy
  exposure — women with genetically low non-pregnant GDF15 are at higher risk,
  while women with beta-thalassaemia, whose GDF15 is chronically high, report
  very little nausea and vomiting. GDF15 acts on GFRAL in the area postrema of
  the brainstem, the same receptor system that drives anorexia and aversive
  responses in cachexia, so the emetic phenotype has a defined receptor target
  and a desensitization-based prevention strategy. Downstream, reduced oral
  intake produces volume depletion, hypokalaemic hypochloraemic alkalosis and
  thiamine depletion that can progress to Wernicke encephalopathy, while the
  psychological burden — depression, anxiety, suicidal ideation, and
  termination of wanted pregnancies — is substantial and is increasingly read
  as a consequence rather than a cause of the illness.

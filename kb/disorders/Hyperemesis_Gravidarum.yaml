genetic:
- name: GDF15
  gene_term:
    preferred_term: GDF15
    term:
      id: hgnc:30142
      label: GDF15
  relationship_type: SUSCEPTIBILITY
  association: >-
    The principal susceptibility gene. The chr19p13.11 locus containing GDF15
    reached genome-wide significance in the first HG GWAS and was replicated in
    an independent cohort. Follow-up human genetics showed the risk direction is
    counterintuitive: variants conferring LOW GDF15 in the non-pregnant state
    increase HG risk, because they leave the maternal GFRAL system unhabituated
    to the gestational surge.
  evidence:
  - reference: PMID:29563502
    reference_title: Placenta and appetite genes GDF15 and IGFBP7 are associated with hyperemesis gravidarum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genes implicated at these two loci are GDF15 and IGFBP7 respectively,
      both known to be involved in placentation, appetite, and cachexia.
    explanation: >-
      Identifies GDF15 as the gene at the chr19p13.11 genome-wide significant
      locus.
  - reference: PMID:38092039
    reference_title: GDF15 linked to maternal risk of nausea and vomiting during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By studying carriers of rare and common genetic variants, we found that
      low levels of GDF15 in the non-pregnant state increase the risk of
      developing HG.
    explanation: >-
      Establishes the direction of effect, which is opposite to the naive
      expectation that higher GDF15 genotypes would confer risk.
- name: IGFBP7
  gene_term:
    preferred_term: IGFBP7
    term:
      id: hgnc:5476
      label: IGFBP7
  relationship_type: SUSCEPTIBILITY
  association: >-
    The second genome-wide significant locus (chr4q12), also a placentation and
    appetite/cachexia gene. Its mechanistic role in hyperemesis is far less
    developed than that of GDF15 and remains largely an association.
  evidence:
  - reference: PMID:29563502
    reference_title: Placenta and appetite genes GDF15 and IGFBP7 are associated with hyperemesis gravidarum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genes implicated at these two loci are GDF15 and IGFBP7 respectively,
      both known to be involved in placentation, appetite, and cachexia.
    explanation: >-
      Identifies IGFBP7 at the chr4q12 locus.
  - reference: PMID:29563502
    reference_title: Placenta and appetite genes GDF15 and IGFBP7 are associated with hyperemesis gravidarum.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While proving the casual roles of GDF15 and IGFBP7 in nausea and vomiting
      of pregnancy requires further study
    explanation: >-
      The authors' explicit caveat that causality was not established by the
      GWAS; for IGFBP7 that caveat still stands.
- name: GFRAL
  gene_term:
    preferred_term: GFRAL
    term:
      id: hgnc:32789
      label: GFRAL
  relationship_type: SUSCEPTIBILITY
  association: >-
    Encodes the receptor for GDF15, expressed almost exclusively in the area
    postrema. Implicated in HG genetics as a hormone-receptor locus, and the
    obligate mediator of GDF15's effects on food intake in vivo.
  evidence:
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current research has unearthed a genetic basis for HG that implicates
      growth differentiation factor 15, insulin-like growth factor binding
      protein 7, and hormone receptors (namely, glial cell line-derived
      neurogenic factor family receptor alpha-like and the progesterone
      receptor).
    explanation: >-
      Names GFRAL (glial cell line-derived neurotrophic factor family receptor
      alpha-like) among the loci implicated in HG.
  - reference: PMID:28846098
    reference_title: The metabolic effects of GDF15 are mediated by the orphan receptor GFRAL.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, our data demonstrate that GFRAL is a receptor for GDF15 that
      mediates the metabolic effects of GDF15.
    explanation: >-
      Establishes the ligand-receptor relationship that makes GFRAL
      mechanistically relevant to a GDF15-driven disease.
- name: PGR
  gene_term:
    preferred_term: PGR
    term:
      id: hgnc:8910
      label: PGR
  relationship_type: SUSCEPTIBILITY
  association: >-
    The progesterone receptor is the fourth locus named in contemporary reviews
    of HG genetics. Included for completeness; the supporting primary data are
    considerably thinner than for GDF15 and no mechanism is modeled here.
  evidence:
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hormone receptors (namely, glial cell line-derived neurogenic factor
      family receptor alpha-like and the progesterone receptor)
    explanation: >-
      Names the progesterone receptor among implicated loci; recorded as PARTIAL
      because this is a review assertion without accompanying primary data here.

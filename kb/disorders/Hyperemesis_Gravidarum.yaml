- category: Obstetric
  name: Premature birth
  description: >-
    Offspring phenotype. Meta-analysis found hyperemesis associated with preterm
    birth before 34 weeks and with low birth weight, though the mediating
    mechanism was not established.
  phenotype_term:
    preferred_term: Premature birth
    term:
      id: HP:0001622
      label: Premature birth
  evidence:
  - reference: PMID:36924660
    reference_title: "Perinatal outcomes of infants born to mothers with hyperemesis gravidarum: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperemesis gravidarum is associated with several adverse perinatal
      outcomes including low birth weight and preterm birth.
    explanation: >-
      Meta-analytic conclusion across 61 studies and more than 20 million

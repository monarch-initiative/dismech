mechanistic_hypotheses:
- hypothesis_group_id: gdf15_gfral_model
  hypothesis_label: Feto-placental GDF15 acting on maternal brainstem GFRAL, gated by maternal prepregnancy sensitivity
  status: CANONICAL
  description: >-
    The dominant contemporary model. GDF15 is produced by the feto-placental
    unit and accounts for the great majority of GDF15 in maternal plasma. It
    acts on GFRAL, a receptor restricted to the area postrema and adjacent
    brainstem, to suppress appetite and generate nausea and emesis. Critically,
    the model is not a simple dose-response: maternal sensitivity, set at least
    partly by prepregnancy GDF15 exposure, is a major determinant of severity.
    Women with constitutively low non-pregnant GDF15 are at increased risk,
    whereas chronically high prepregnancy GDF15 (as in beta-thalassaemia)
    associates with strikingly little nausea and vomiting — a desensitization
    pattern reproduced pharmacologically in mice. This is the first HG model
    that unifies the genetic association signal, the feto-placental origin of
    the ligand, the brainstem receptor, and a rationale for prevention.
  evidence:
  - reference: PMID:38092039
    reference_title: GDF15 linked to maternal risk of nausea and vomiting during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fetal production of GDF15 and maternal sensitivity to it both contribute
      substantially to the risk of HG
    explanation: >-
      States the two-component structure of the model — fetal ligand production
      plus maternal sensitivity — that distinguishes it from earlier
      single-hormone accounts.
  - reference: PMID:38092039
    reference_title: GDF15 linked to maternal risk of nausea and vomiting during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They also suggest mechanism-based approaches to the treatment and
      prevention of HG.
    explanation: >-
      The authors' own framing of the model's translational consequence: a
      defined ligand-receptor axis makes prevention by prepregnancy
      desensitization a testable strategy.
- hypothesis_group_id: hcg_thyrotropic_model
  hypothesis_label: Excess or variant hCG acting as a weak TSH agonist (gestational transient thyrotoxicosis)
  status: ALTERNATIVE
  description: >-
    The long-standing hormonal alternative. hCG is a weak thyrotropin agonist,
    and hyperemesis is usually associated with raised hCG; between a third and
    two-thirds of HG patients in different series have biochemical evidence of
    increased thyroid function, and a minority have frank gestational
    thyrotoxicosis. Variant hCG molecules with increased thyrotropic potency are
    the proposed effector. The model explains the biochemical thyroid
    abnormalities well but does not account for the genetic association signal,
    and the direction of causation between hCG, thyroid activation and emesis
    has never been established. In dismech it is retained as a mechanistically
    real concomitant arm rather than as the primary cause.
  evidence:
  - reference: PMID:10447009
    reference_title: "Human chorionic gonadotropin and the thyroid: hyperemesis gravidarum and trophoblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is abundant evidence that human chorionic gonadotropin (hCG) is a
      weak thyrotropin (TSH) agonist.
    explanation: >-
      Establishes the molecular premise of the model — cross-reactivity of hCG
      at the TSH receptor.
  - reference: PMID:10447009
    reference_title: "Human chorionic gonadotropin and the thyroid: hyperemesis gravidarum and trophoblastic tumors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A high proportion of patients with hyperemesis gravidarum, about one-third
      to two-thirds in different series, have evidence of increased thyroid
      function.
    explanation: >-
      Documents the association but not its direction; the wide between-series
      range is itself an indication of how ascertainment-dependent this arm is.
- hypothesis_group_id: h_pylori_model
  hypothesis_label: Maternal Helicobacter pylori infection as a contributory or modifying factor
  status: ALTERNATIVE
  description: >-
    Meta-analysis of 38 cross-sectional and case-control studies finds a
    statistically significant but modest association between maternal H. pylori
    infection and hyperemesis (pooled OR 1.35). The proposed mechanism is that
    pregnancy-associated shifts in fluid, electrolyte and immune status
    exacerbate latent gastric infection. The signal is weak, publication bias
    was detected, HG definitions differed between studies, and 15 of 38 studies
    came from one country — so this is best read as a candidate modifier of an
    already-susceptible pregnancy rather than an independent cause. It matters
    clinically mainly because eradication is a cheap, testable intervention.
  evidence:
  - reference: PMID:29178407
    reference_title: A meta-analysis of the association between Helicobacter pylori (H. pylori) infection and hyperemesis gravidarum.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analysis revealed a significant association between H. pylori
      infection and hyperemesis gravidarum during pregnancy, with a pooled odds
      ratio of 1.348 (95% CI: 1.156-1.539, P < .001).
    explanation: >-
      Quantifies the association; the small effect size is the reason this is an
      ALTERNATIVE modifier rather than a competing primary mechanism.
  - reference: PMID:29178407
    reference_title: A meta-analysis of the association between Helicobacter pylori (H. pylori) infection and hyperemesis gravidarum.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      publication bias was observed, and interstudy discrepancies in the
      diagnostic criteria adopted for hyperemesis gravidarum limit the
      reliability of findings
    explanation: >-
      The authors' own limitation statement, recorded here so the modest odds
      ratio is not over-read.
- hypothesis_group_id: psychogenic_model
  hypothesis_label: Psychogenic origin (conversion or rejection of pregnancy)
  status: DEPRECATED
  description: >-
    From the late nineteenth century to the mid-1980s hyperemesis was routinely
    attributed to psychological causes. Depression and anxiety are indeed far
    more frequent in women with HG, but contemporary reading of that association
    reverses its direction: the psychological morbidity is a consequence of a
    severe, poorly treated physical illness, and it coexists with suicidal
    ideation and post-traumatic stress. Retained here explicitly as DEPRECATED
    because the psychogenic framing continues to cause real harm — it underlies
    the dismissal of patients and the reluctance to prescribe that the current
    literature identifies as a barrier to care.
  evidence:
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From the late 1800s to the mid-1980s, the etiology was frequently cited to
      have psychological and/or-later-perhaps hormonal origins, which have
      numbered at least 10.
    explanation: >-
      Places the psychogenic model historically and contrasts it with the same
      review's statement that current research has established a genetic basis.
  - reference: PMID:41242332
    reference_title: Hyperemesis gravidarum.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      inaccurate assumptions that the condition is self-limiting result in women
      being dismissed and having difficulty accessing appropriate care
    explanation: >-
      Documents the clinical harm of the deprecated framing, which is why the
      hypothesis is retained as DEPRECATED rather than silently dropped.
pathophysiology:
- name: Feto-Placental GDF15 Production
  biological_scale: TISSUE
  description: >-
    GDF15 is synthesized by the feto-placental unit and released into the
    maternal circulation. Mass spectrometry of a naturally labelled GDF15
    variant established that the vast majority of GDF15 in maternal plasma
    during pregnancy is of feto-placental rather than maternal origin, which is
    what makes the fetus the source of the emetic signal and the mother the
    responder.
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  cell_types:
  - preferred_term: syncytiotrophoblast
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  molecular_functions:
  - preferred_term: hormone activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: INCREASED
  evidence:
  - reference: PMID:38092039
    reference_title: GDF15 linked to maternal risk of nausea and vomiting during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we demonstrate that the vast majority of GDF15 in the maternal plasma is
      derived from the feto-placental unit
    explanation: >-
      Direct mass-spectrometric attribution of circulating maternal GDF15 to the
      feto-placental compartment.
  downstream:
  - target: Elevated Maternal Circulating GDF15
    causal_link_type: DIRECT
    hypothesis_groups:
    - gdf15_gfral_model
    description: >-
      Placental secretion raises the concentration of GDF15 in maternal blood.
- name: Elevated Maternal Circulating GDF15
  biological_scale: ORGANISM
  description: >-
    Maternal plasma GDF15 rises steeply in the first trimester, and higher
    levels are associated with vomiting in pregnancy and with hyperemesis
    specifically. This is the circulating signal that reaches the brainstem; on
    its own, however, it is an incomplete predictor of severity, because the
    same concentration produces very different symptoms depending on maternal
    sensitivity.
  molecular_functions:
  - preferred_term: hormone activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: INCREASED
  evidence:
  - reference: PMID:38092039
    reference_title: GDF15 linked to maternal risk of nausea and vomiting during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We confirmed that higher GDF15 levels in maternal blood are associated
      with vomiting in pregnancy and HG.
    explanation: >-
      Establishes the exposure-outcome association for circulating maternal
      GDF15.
  downstream:
  - target: GDF15-GFRAL Signaling in the Area Postrema
    causal_link_type: DIRECT
    hypothesis_groups:
    - gdf15_gfral_model
    description: >-
      Circulating GDF15 engages GFRAL in the area postrema, a circumventricular
      organ outside the blood-brain barrier.
- name: Low Prepregnancy GDF15 Exposure and Heightened Maternal Sensitivity
  biological_scale: ORGANISM
  description: >-
    The maternal arm of the mechanism, and the reason hyperemesis is not simply
    a function of placental output. Carriers of rare and common variants
    conferring low non-pregnant GDF15 are at increased risk of hyperemesis,
    while women with beta-thalassaemia — in whom GDF15 is chronically elevated
    from ineffective erythropoiesis — report very low levels of nausea and
    vomiting of pregnancy. The inference is that the GDF15-GFRAL system
    desensitizes with sustained exposure, so a woman's prepregnancy set-point
    determines how strongly the pregnancy-associated surge is felt.
  biological_processes:
  - preferred_term: regulation of appetite
    term:
      id: GO:0032098
      label: regulation of appetite
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38092039
    reference_title: GDF15 linked to maternal risk of nausea and vomiting during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By studying carriers of rare and common genetic variants, we found that
      low levels of GDF15 in the non-pregnant state increase the risk of
      developing HG.
    explanation: >-
      Human genetic evidence that the maternal prepregnancy set-point, not just
      the fetal signal, sets risk.
  - reference: PMID:38092039
    reference_title: GDF15 linked to maternal risk of nausea and vomiting during pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      women with β-thalassaemia, a condition in which GDF15 levels are
      chronically high
    explanation: >-
      The natural human high-exposure comparison; these women report very low
      nausea and vomiting of pregnancy, the predicted desensitization phenotype.
  - reference: PMID:38092039
    reference_title: GDF15 linked to maternal risk of nausea and vomiting during pregnancy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice, the acute food intake response to a bolus of GDF15 is influenced
      bi-directionally by prior levels of circulating GDF15 in a manner
      suggesting that this system is susceptible to desensitization.
    explanation: >-
      Provides the mechanistic account of sensitivity in a model organism;
      recorded separately from the human genetic evidence because the
      desensitization step itself has not been demonstrated in humans.
  downstream:
  - target: GDF15-GFRAL Signaling in the Area Postrema
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - gdf15_gfral_model
    description: >-
      Low prepregnancy exposure leaves the GFRAL system unhabituated, amplifying
      the response to any given gestational GDF15 concentration.
- name: GDF15-GFRAL Signaling in the Area Postrema
  biological_scale: CELLULAR
  description: >-
    GFRAL is the receptor for GDF15. Its expression is essentially restricted to
    the area postrema and adjacent nucleus tractus solitarius — the brainstem
    chemoreceptor territory that lies outside the blood-brain barrier and is the
    canonical trigger zone for emesis. Receptor engagement suppresses food
    intake and generates nausea and aversive responses; this is the same axis
    that mediates anorexia in cancer cachexia, which is why the pharmacology is
    already well characterized and why blocking antibodies exist.
  locations:
  - preferred_term: area postrema
    term:
      id: UBERON:0002162
      label: area postrema
  - preferred_term: medulla oblongata
    term:
      id: UBERON:0001896
      label: medulla oblongata
  biological_processes:
  - preferred_term: negative regulation of appetite
    term:
      id: GO:0032099
      label: negative regulation of appetite
    modifier: INCREASED
  - preferred_term: feeding behavior
    term:
      id: GO:0007631
      label: feeding behavior
    modifier: DECREASED
  evidence:
  - reference: PMID:28846098
    reference_title: The metabolic effects of GDF15 are mediated by the orphan receptor GFRAL.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GFRAL binds to GDF15 in vitro and is required for the metabolic actions of
      GDF15 with respect to body weight and food intake in vivo in mice.
    explanation: >-
      Establishes GFRAL as the obligate receptor for the appetite-suppressing
      actions of GDF15.
  - reference: PMID:28846098
    reference_title: The metabolic effects of GDF15 are mediated by the orphan receptor GFRAL.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gfral mRNA is highly expressed in the area postrema of mouse, rat and
      monkey
    explanation: >-
      Localizes the receptor to the brainstem emetic trigger zone, the
      anatomical link between a circulating placental hormone and vomiting.
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current research has unearthed a genetic basis for HG that implicates
      growth differentiation factor 15, insulin-like growth factor binding
      protein 7, and hormone receptors (namely, glial cell line-derived
      neurogenic factor family receptor alpha-like and the progesterone
      receptor).
    explanation: >-
      Independent review confirming that GFRAL is among the loci implicated in
      human HG.
  downstream:
  - target: Intractable Nausea, Vomiting and Food Aversion
    causal_link_type: DIRECT
    hypothesis_groups:
    - gdf15_gfral_model
    description: >-
      Brainstem GFRAL activation produces the cardinal emetic and
      appetite-suppressing phenotype.
- name: Intractable Nausea, Vomiting and Food Aversion
  biological_scale: ORGANISM
  description: >-
    The defining clinical state: nausea and vomiting severe enough to prevent
    adequate oral intake. Severity is graded with validated instruments (PUQE,
    HELP) rather than with ketonuria, which is explicitly not an indicator of
    dehydration. This node is the convergence point of the canonical GDF15
    pathway and the alternative hCG and H. pylori arms.
  evidence:
  - reference: PMID:41242332
    reference_title: Hyperemesis gravidarum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperemesis gravidarum describes nausea and vomiting in pregnancy severe
      enough to cause weight loss, dehydration, electrolyte imbalance, and
      nutritional deficiencies.
    explanation: >-
      Contemporary definitional statement tying the emetic phenotype to its
      immediate metabolic consequences.
  downstream:
  - target: Reduced Oral Intake and Undernutrition
    causal_link_type: DIRECT
    description: >-
      Persistent vomiting and aversion prevent maintenance of caloric and
      micronutrient intake.
  - target: Volume Depletion and Electrolyte Derangement
    causal_link_type: DIRECT
    description: >-
      Loss of gastric fluid and reduced intake deplete extracellular volume and
      strip potassium, chloride and hydrogen ions.
  - target: Psychological Morbidity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Prolonged, poorly controlled symptoms generate depression, anxiety and
      post-traumatic stress.
  - target: Care Access and Prescribing Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Symptoms assumed to be self-limiting are met with dismissal and
      prescribing reluctance rather than treatment.
- name: Volume Depletion and Electrolyte Derangement
  biological_scale: ORGANISM
  description: >-
    Loss of hydrochloric acid and potassium in vomitus, with inadequate
    replacement, produces dehydration, hypokalaemia, hyponatraemia and a
    hypochloraemic metabolic alkalosis. This is the physiology that drives
    hospital admission and dictates the composition of replacement fluid —
    normal saline with added potassium chloride, titrated to daily electrolyte
    measurement.
  evidence:
  - reference: PMID:41242332
    reference_title: Hyperemesis gravidarum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      severe enough to cause weight loss, dehydration, electrolyte imbalance,
      and nutritional deficiencies
    explanation: >-
      Names dehydration and electrolyte imbalance as defining features of the
      severe phenotype.
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal saline (0.9% NaCl) with additional potassium chloride in each bag,
      with administration guided by daily monitoring of electrolytes, is the
      most appropriate intravenous hydration.
    explanation: >-
      The guideline's replacement prescription is a direct read-out of the
      underlying chloride- and potassium-losing physiology.
- name: Reduced Oral Intake and Undernutrition
  biological_scale: ORGANISM
  description: >-
    Sustained inability to eat produces weight loss and micronutrient depletion
    against the raised demands of pregnancy. Thiamine, with body stores
    sufficient for only a few weeks, is the critical deficiency; carbohydrate
    loading in a thiamine-deplete patient can precipitate encephalopathy, which
    is why guidelines require thiamine before dextrose or parenteral nutrition.
  evidence:
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperemesis gravidarum (HG), or the severe nausea and vomiting of
      pregnancy, is one of the most dreaded complications of gestation,
      affecting between 1.5% and 3.0% of pregnant women.
    explanation: >-
      Frames HG as a gestational malnutrition syndrome, the review's central
      claim and the premise for the thiamine-depletion node below.
  downstream:
  - target: Thiamine Depletion
    causal_link_type: DIRECT
    description: >-
      Sustained inability to eat depletes the few weeks of stored thiamine
      against the raised demands of pregnancy.
  - target: Adverse Perinatal Outcomes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Maternal undernutrition and low gestational weight gain shift fetal growth
      and gestational length by mechanisms that have not been established.
- name: Thiamine Depletion
  biological_scale: ORGANISM
  description: >-
    Body thiamine stores are sufficient for only a few weeks, so sustained
    vomiting and reduced intake deplete them quickly against the raised demands
    of pregnancy. The depletion is a metabolic state, distinct from the
    encephalopathy it can precipitate: it is silent until unmasked, and a
    carbohydrate load in a thiamine-deplete patient can convert it into overt
    disease. This is the node that thiamine supplementation repletes, and it is
    why guidelines require thiamine before dextrose or parenteral nutrition.
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thiamine supplementation (either oral 100 mg tds or intravenous as part of
      vitamin B complex (Pabrinex®)) should be given to all women admitted with
      vomiting, or severely reduced dietary intake, especially before
      administration of dextrose or parenteral nutrition.
    explanation: >-
      Universal thiamine prophylaxis for every admitted woman, and specifically
      ahead of a carbohydrate load, is a direct read-out of expected thiamine
      depletion in this population.
  downstream:
  - target: Wernicke Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Depleted thiamine impairs thiamine-dependent cerebral metabolism,
      precipitating Wernicke encephalopathy.
- name: Wernicke Encephalopathy
  biological_scale: ORGANISM
  description: >-
    The most feared neurological complication. Wernicke encephalopathy arising
    from hyperemesis carries high fetal and maternal mortality, and its
    presentation in this setting frequently departs from the classically taught
    triad, so a triad-based bedside rule will miss cases. It is preventable via
    the upstream depletion node: thiamine is given to every woman admitted with
    vomiting or severely reduced intake.
  locations:
  - preferred_term: medulla oblongata
    term:
      id: UBERON:0001896
      label: medulla oblongata
  evidence:
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Another devastating outcome of severe HG can be Wernicke's encephalopathy
      (WE), which has a high fetal and maternal mortality rate.
    explanation: >-
      Establishes Wernicke encephalopathy as a recognized and high-mortality
      complication of severe hyperemesis.
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We highlighted additional presenting features we believe also accompany,
      and sometimes replace, the classically taught triad components of WE:
      ataxia, confabulation, and nystagmus.
    explanation: >-
      Supports the clinically important caveat that the classical triad is an
      unreliable screen in hyperemesis-associated Wernicke encephalopathy.
- name: hCG Agonism at the TSH Receptor
  biological_scale: MOLECULAR
  description: >-
    The molecular half of the concomitant biochemical arm. hCG is a weak agonist
    at the TSH receptor, and hyperemesis is usually accompanied by raised hCG;
    variant hCG species with reduced sialic acid content, truncated C-terminal
    tails, or a nicked beta-subunit loop have increased thyrotropic potency.
  molecular_functions:
  - preferred_term: hormone activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: INCREASED
  evidence:
  - reference: PMID:10447009
    reference_title: "Human chorionic gonadotropin and the thyroid: hyperemesis gravidarum and trophoblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperemesis gravidarum, defined as severe vomiting in early pregnancy that
      causes 5% weight loss and ketonuria, is usually associated with increased
      hCG concentration.
    explanation: >-
      Links the hyperemesis phenotype to raised hCG, the ligand acting at the TSH
      receptor in this arm.
  downstream:
  - target: Gestational Transient Thyrotoxicosis
    causal_link_type: DIRECT
    description: >-
      Cross-reactive hCG stimulation of the TSH receptor suppresses TSH and
      raises free T4.
- name: Gestational Transient Thyrotoxicosis
  biological_scale: ORGANISM
  description: >-
    The organism-level endocrine state produced by the receptor cross-reactivity
    above, and a concomitant arm rather than the primary cause of the emesis.
    Suppressed TSH with modest free-T4 elevation occurs in a third to two-thirds
    of HG patients, and overt gestational thyrotoxicosis in a minority. It
    resolves with the pregnancy and generally does not require antithyroid
    therapy — which is why recognizing it as a distinct entity matters
    clinically.
  evidence:
  - reference: PMID:10447009
    reference_title: "Human chorionic gonadotropin and the thyroid: hyperemesis gravidarum and trophoblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only a small proportion of these patients have clinical hyperthyroidism,
      termed gestational thyrotoxicosis.
    explanation: >-
      Distinguishes the common biochemical abnormality from the uncommon
      clinical syndrome, the distinction that governs whether treatment is
      needed.
  downstream:
  - target: Intractable Nausea, Vomiting and Food Aversion
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - hcg_thyrotropic_model
    description: >-
      The association between hCG, thyroid activation and emesis is robust, but
      its direction has never been established; the edge is typed UNKNOWN rather
      than asserting causation from thyroid activation to vomiting.
- name: Care Access and Prescribing Failure
  biological_scale: ORGANISM
  description: >-
    A health-system rather than patient-level process, separated from the
    psychiatric outcome it aggravates because it has a different substrate and a
    different intervention. Reluctance to prescribe in pregnancy and the
    inaccurate assumption that the condition is self-limiting lead to women being
    dismissed and struggling to access care, which leaves the emesis undertreated
    for longer than it need be. Psychological support does not act on this node;
    clinician education, guideline adherence and service design do.
  evidence:
  - reference: PMID:41242332
    reference_title: Hyperemesis gravidarum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concerns regarding prescribing in pregnancy and inaccurate assumptions
      that the condition is self-limiting result in women being dismissed and
      having difficulty accessing appropriate care.
    explanation: >-
      Names both drivers of the care-access failure — prescribing reluctance and
      the self-limiting assumption — and their consequence, dismissal and
      impaired access.
  downstream:
  - target: Psychological Morbidity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dismissal and delayed access prolong untreated symptoms, compounding the
      psychological burden; the intermediate steps have not been established.
- name: Psychological Morbidity
  biological_scale: ORGANISM
  description: >-
    Depression and anxiety scale scores are markedly higher in women with
    hyperemesis than in controls, and the burden extends to suicidal ideation,
    post-traumatic stress and termination of wanted pregnancies. The
    historically assumed causal direction — psychological disturbance causing
    the vomiting — is not supported; the contemporary reading is that untreated
    severe emesis, compounded by the care-access failure modeled above, produces
    the psychological morbidity. This node exists so the association is modeled
    with its direction made explicit.
  evidence:
  - reference: PMID:27418035
    reference_title: "Psychological morbidity associated with hyperemesis gravidarum: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our systematic review and meta-analysis have shown a significantly
      increased frequency of depression and anxiety in women with HG.
    explanation: >-
      Quantifies the association across 59 studies with 12 in meta-analysis.
  - reference: PMID:41242332
    reference_title: Hyperemesis gravidarum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The condition can render women so physically and mentally unwell that they
      are at increased risk of terminating a wanted pregnancy and experiencing
      suicidal ideation.
    explanation: >-
      States the severity end of the psychological burden and attributes it to
      the physical illness, supporting the direction modeled here.
- name: Adverse Perinatal Outcomes
  biological_scale: ORGANISM
  description: >-
    A meta-analysis spanning more than 20 million participants found hyperemesis
    associated with preterm birth before 34 weeks, birth weight under 1500 g,
    neonatal resuscitation, NICU admission and placental abruption, and
    inversely associated with macrosomia and stillbirth. The mechanism linking
    maternal undernutrition to these outcomes was not investigated in that work,
    so the edge into this node is modeled with unknown intermediates.
  evidence:
  - reference: PMID:36924660
    reference_title: "Perinatal outcomes of infants born to mothers with hyperemesis gravidarum: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperemesis gravidarum is associated with several adverse perinatal
      outcomes including low birth weight and preterm birth.
    explanation: >-
      Headline conclusion of the largest synthesis of perinatal outcomes in
      hyperemesis.
  - reference: PMID:36924660
    reference_title: "Perinatal outcomes of infants born to mothers with hyperemesis gravidarum: A systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We were unable to investigate underlying mechanisms.
    explanation: >-
      The authors' own limitation, and the reason the causal edge into this node
      is not typed DIRECT.
phenotypes:
- category: Clinical
  name: Vomiting
  description: >-
    Persistent, intractable vomiting in early pregnancy is the defining
    manifestation and the feature that separates hyperemesis from the far more
    common nausea and vomiting of pregnancy.
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
    temporality: PROLONGED
  evidence:
  - reference: PMID:41242332
    reference_title: Hyperemesis gravidarum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperemesis gravidarum describes nausea and vomiting in pregnancy severe
      enough to cause weight loss, dehydration, electrolyte imbalance, and
      nutritional deficiencies.
    explanation: >-
      Definitional statement establishing vomiting as the cardinal phenotype.
- category: Clinical
  name: Nausea
  description: >-
    Nausea in hyperemesis is typically constant rather than episodic. Severity
    is graded with the PUQE or HELP instruments.
  phenotype_term:
    preferred_term: Nausea
    term:
      id: HP:0002018
      label: Nausea
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An objective and validated index of nausea and vomiting such as the
      Pregnancy-Unique Quantification of Emesis (PUQE) and HyperEmesis Level
      Prediction (HELP) tools can be used to classify the severity of NVP and HG.
    explanation: >-
      Establishes nausea as a graded, formally measured component of the
      phenotype rather than an incidental symptom.
- category: Clinical
  name: Weight loss
  description: >-
    Weight loss is part of most operational definitions of hyperemesis, commonly
    set at 5 percent of prepregnancy weight.
  phenotype_term:
    preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
  evidence:
  - reference: PMID:10447009
    reference_title: "Human chorionic gonadotropin and the thyroid: hyperemesis gravidarum and trophoblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperemesis gravidarum, defined as severe vomiting in early pregnancy that
      causes 5% weight loss and ketonuria
    explanation: >-
      Gives the quantitative weight-loss threshold used in the classical
      definition.
- category: Clinical
  name: Dehydration
  description: >-
    Volume depletion from vomiting and reduced intake is the usual reason for
    admission and for intravenous rehydration.
  phenotype_term:
    preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
  evidence:
  - reference: PMID:41242332
    reference_title: Hyperemesis gravidarum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      severe enough to cause weight loss, dehydration, electrolyte imbalance,
      and nutritional deficiencies
    explanation: >-
      Names dehydration among the defining consequences.
- category: Laboratory
  name: Hypokalemia
  description: >-
    Potassium is lost in vomitus and further shifted intracellularly by the
    accompanying alkalosis; replacement potassium chloride in every bag of
    saline is the guideline-recommended response.
  phenotype_term:
    preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal saline (0.9% NaCl) with additional potassium chloride in each bag,
      with administration guided by daily monitoring of electrolytes, is the
      most appropriate intravenous hydration.
    explanation: >-
      Routine potassium supplementation in every bag, titrated to daily
      electrolytes, reflects expected hypokalaemia.
- category: Laboratory
  name: Hypokalemic hypochloremic metabolic alkalosis
  description: >-
    The characteristic acid-base picture of protracted vomiting: hydrogen and
    chloride are lost in gastric fluid, potassium follows, and the result is a
    hypochloraemic metabolic alkalosis with hypokalaemia. Named separately from
    the isolated Hypokalemia phenotype above because the acid-base disturbance,
    not the potassium alone, is what dictates chloride-replete fluid.
  phenotype_term:
    preferred_term: Hypokalemic hypochloremic metabolic alkalosis
    term:
      id: HP:0004909
      label: Hypokalemic hypochloremic metabolic alkalosis
  evidence:
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal saline (0.9% NaCl) with additional potassium chloride in each bag,
      with administration guided by daily monitoring of electrolytes, is the
      most appropriate intravenous hydration.
    explanation: >-
      PARTIAL rather than SUPPORT: the guideline prescribes exactly the chloride-
      and potassium-replete fluid this acid-base disturbance requires, which
      evidences the hypochloraemia and hypokalaemia, but the abstract does not
      itself name the metabolic alkalosis — that step is inferred from the
      prescription and from the vomiting physiology.
- category: Laboratory
  name: Ketonuria
  description: >-
    Ketonuria appears with starvation ketosis and features in older diagnostic
    definitions of hyperemesis. Contemporary guidance explicitly rejects it as a
    severity or hydration marker — a rare instance where a long-used laboratory
    phenotype has been formally demoted.
  phenotype_term:
    preferred_term: Ketonuria
    term:
      id: HP:0002919
      label: Ketonuria
  evidence:
  - reference: PMID:10447009
    reference_title: "Human chorionic gonadotropin and the thyroid: hyperemesis gravidarum and trophoblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      severe vomiting in early pregnancy that causes 5% weight loss and
      ketonuria
    explanation: >-
      Documents ketonuria's historical place in the case definition.
  - reference: PMID:38311315
    reference_title: The Management of Nausea and Vomiting in Pregnancy and Hyperemesis Gravidarum (Green-top Guideline No. 69).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ketonuria is not an indicator of dehydration and should not be used to
      assess severity.
    explanation: >-
      Grade A guideline statement demoting ketonuria; recorded as PARTIAL
      because it confirms the phenotype occurs while refuting its diagnostic use.
- category: Laboratory
  name: Hyperthyroidism
  description: >-
    Biochemical thyroid overactivity is present in a third to two-thirds of
    women with hyperemesis, driven by hCG cross-reactivity at the TSH receptor.
    Only a minority have clinical gestational thyrotoxicosis, and it is
    self-limiting.
  phenotype_term:
    preferred_term: Gestational transient thyrotoxicosis
    term:
      id: HP:0000836
      label: Hyperthyroidism
    temporality: TRANSIENT
  evidence:
  - reference: PMID:10447009
    reference_title: "Human chorionic gonadotropin and the thyroid: hyperemesis gravidarum and trophoblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A high proportion of patients with hyperemesis gravidarum, about one-third
      to two-thirds in different series, have evidence of increased thyroid
      function.
    explanation: >-
      Quantifies the frequency of the biochemical phenotype.
- category: Neurologic
  name: Wernicke encephalopathy
  description: >-
    Thiamine-deficiency encephalopathy complicating severe hyperemesis, with
    high fetal and maternal mortality. Presentation often deviates from the
    classical triad, so a triad-based screen is unsafe here.
  phenotype_term:
    preferred_term: Wernicke encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  evidence:
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Another devastating outcome of severe HG can be Wernicke's encephalopathy
      (WE), which has a high fetal and maternal mortality rate.
    explanation: >-
      Establishes the complication and its mortality. HPO has no
      Wernicke-specific term, so the generic Encephalopathy term is bound with a
      more specific preferred_term.
- category: Psychiatric
  name: Depression
  description: >-
    Depression scale scores are very substantially higher in women with
    hyperemesis than in controls. Modeled as a consequence of the illness and
    its management, not as a cause.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:27418035
    reference_title: "Psychological morbidity associated with hyperemesis gravidarum: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analysis of depression scale scores demonstrated a very large effect
      with statistically significantly higher depression scale scores in women
      with HG
    explanation: >-
      Quantitative meta-analytic effect for depression in hyperemesis.
- category: Psychiatric
  name: Anxiety
  description: >-
    Anxiety disorder scale scores are also significantly elevated, and
    post-traumatic stress is described after severe episodes.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:27418035
    reference_title: "Psychological morbidity associated with hyperemesis gravidarum: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analysis of anxiety scores demonstrated a large effect with
      statistically significantly higher anxiety disorder scale scores in women
      with HG
    explanation: >-
      Quantitative meta-analytic effect for anxiety in hyperemesis.
  - reference: PMID:36250744
    reference_title: "Gestational malnutrition, hyperemesis gravidarum, and Wernicke's encephalopathy: What is missing?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The psychological trauma includes a high rate of suicidal ideation as well

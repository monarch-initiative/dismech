      label: Small for gestational age
  evidence:
  - reference: PMID:36924660
    reference_title: "Perinatal outcomes of infants born to mothers with hyperemesis gravidarum: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperemesis gravidarum is associated with several adverse perinatal
      outcomes including low birth weight and preterm birth.
    explanation: >-
      The meta-analysis names low birth weight alongside preterm birth; only the

progression:
- phase: Insidious adult-onset presentation
  age_range: Median 51 years at diagnosis; reported from age 3 years upward
  notes: >
    Most patients present as previously healthy adults with dyspnoea of insidious
    onset; the Japanese registry records a median diagnosis age of 51 years and a
    2.1:1 male predominance, and paediatric cases occur.
  evidence:
  - reference: PMID:18202348
    reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The male to female ratio was 2.1:1, and the median age at diagnosis was 51 years."
    explanation: The registry cohort defines the age and sex distribution at diagnosis.
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common presentation is dyspnea of insidious onset with or without cough, production of scant white and frothy sputum, and diffuse radiographic infiltrates in a previously healthy adult, but it can also occur in children as young as 3 years."
    explanation: >
      The review characterizes the typical insidious adult presentation and the
      paediatric age floor.
- phase: Asymptomatic screen-detected disease
  notes: >
    A substantial minority of patients are asymptomatic at diagnosis and are
    identified incidentally through health screening imaging.
  evidence:
  - reference: PMID:18202348
    reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, 31.8% of patients were asymptomatic and were identified by health screening."
    explanation: Nearly a third of registry patients were asymptomatic at ascertainment.
- phase: Progressive hypoxaemic respiratory insufficiency and late complications
  notes: >
    The course is variable, but progression to hypoxaemic respiratory
    insufficiency, secondary infection, pulmonary fibrosis, respiratory failure
    and death occurs in a subset.
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course, although variable, usually includes progressive hypoxemic respiratory insufficiency and, in some patients, secondary infections, pulmonary fibrosis, respiratory failure, and death."
    explanation: The review summarizes the disease trajectory and its late complications.
- phase: Spontaneous resolution
  notes: >-
    The course is not uniformly progressive. It resolves in a minority without
    treatment, which is why the three recognized trajectories are stable
    disease, progressive deterioration and spontaneous resolution, and why an
    uncontrolled improvement cannot be attributed to therapy.
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course of autoimmune PAP comprises three patterns: stable disease, progressive deterioration, and spontaneous resolution"
    explanation: >
      Names the three trajectories, establishing that progression is only one of
      the recognized courses.
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "7.9% of cases were reported to have experienced spontaneous resolution"
    explanation: >
      Quantifies spontaneous resolution in the largest meta-analysis, bounding
      the size of the non-progressive subset.
- phase: Long-term survival and cause of death
  notes: >-
    Survival is measured in years rather than months, but mortality is
    front-loaded: most deaths occur within the first year after diagnosis.
    Respiratory failure is the leading cause of death, with uncontrolled
    infection second - the two arms of the mechanism (surfactant accumulation
    and myeloid host-defence impairment) are also the two leading killers.
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the largest study reported to date, a meta-analysis of 343 patients with PAP revealed survival rates of 78% at 2 years, 75% at 5 years, and 68% at 10 years; more than 80% of deaths occurred within 12 months of diagnosis, and respiratory failure was the most common cause of death, followed by uncontrolled infection"
    explanation: >
      Provides the survival curve, the front-loaded mortality timing and the
      ranked causes of death.
  - reference: PMID:18202348
    reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune PAP had an incidence and prevalence higher than previously reported and was not strongly linked to smoking, occupational exposure, or other illnesses."
    explanation: >
      Counterweight on ascertainment: the systematically ascertained registry
      cohort was milder than referral-based series, so pooled survival figures
      drawn largely from referral cohorts may understate survival.
inheritance:
- name: Not inherited (acquired autoimmune disease with HLA-linked susceptibility)
  description: >
    aPAP is an acquired autoimmune disease rather than a Mendelian disorder; no
    familial transmission was observed in the Japanese registry cohort, although
    a GWAS demonstrates an HLA class II heritable susceptibility component.
  evidence:
  - reference: PMID:18202348
    reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A history of smoking occurred in 56%, and dust exposure occurred in 23%; instances of familial onset did not occur."
    explanation: >
      No familial onset occurred among 223 registry patients, supporting an
      acquired rather than Mendelian mode.
genetic:
- name: HLA-DRB1*08:03 susceptibility allele
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  features: >
    A Japanese GWAS with HLA fine-mapping identified HLA-DRB1*08:03 as the lead
    MHC class II risk allele for aPAP, and the same allele is associated with
    higher anti-GM-CSF antibody levels, linking MHC class II presentation to the
    loss of tolerance to GM-CSF.
  evidence:
  - reference: PMID:33589587
    reference_title: "Genetic determinants of risk in autoimmune pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HLA fine-mapping revealed that the common HLA class II allele, HLA-DRB1*08:03, strongly drove this signal"
    explanation: >
      HLA fine-mapping of the genome-wide significant MHC signal identifies
      HLA-DRB1*08:03 as the driving risk allele.
  - reference: PMID:33589587
    reference_title: "Genetic determinants of risk in autoimmune pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HLA-DRB1*08:03 was also associated with an increased level of anti-GM-CSF antibody, a key driver of the disease"
    explanation: >
      The risk allele is quantitatively linked to the pathogenic autoantibody,
      connecting genetic susceptibility to the effector mechanism.
  - reference: PMID:33589587
    reference_title: "Genetic determinants of risk in autoimmune pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrated a heritable component of aPAP, suggesting an underlying genetic predisposition toward an abnormal antibody production."
    explanation: >
      The authors frame the finding as a heritable predisposition to abnormal
      antibody production rather than Mendelian causation.
  notes: >
    The GWAS is a single-ancestry (Japanese) study of 198 cases and 395 controls;
    the HLA association has not been consistently replicated in other
    populations. See the KNOWLEDGE_GAP discussion on replication.
environmental:
- name: Cigarette smoking
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  influences_mechanisms:
  - target: Loss of Immune Tolerance to GM-CSF
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as modulating rather than predisposing, because the entry's own
      best evidence declines to support a risk claim. The registry that
      documents smoking in 56 percent of patients is the same one that
      concludes the disease was not strongly linked to smoking once
      ascertainment was systematic, and both sentences are carried here so the
      reader meets the refutation at the point of the claim. A prevalence
      among patients is not a risk, and this link is drawn to record the
      association without asserting one.
    evidence:
    - reference: PMID:18202348
      reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A history of smoking occurred in 56%, and dust exposure occurred in 23%; instances of familial onset did not occur."
      explanation: >-
        Registry cohort recording a smoking history in 56 percent of patients
        alongside dust exposure in 23 percent. Prevalence within the cohort,
        with no comparison group.
    - reference: PMID:18202348
      reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Autoimmune PAP had an incidence and prevalence higher than previously reported and was not strongly linked to smoking, occupational exposure, or other illnesses."
      explanation: >-
        The same cohort concluding that the disease was not strongly linked to
        smoking, occupational exposure or other illnesses. Carried
        deliberately: it is the strongest statement this entry has about the
        exposure and it points away from a causal reading.
  description: >
    Smoking is common in aPAP cohorts and is often described as a risk or
    aggravating factor, but the large registry study concluded that the disease
    was not strongly linked to smoking once ascertained systematically.
  presence: PRESENT
  evidence:
  - reference: PMID:18202348
    reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A history of smoking occurred in 56%, and dust exposure occurred in 23%; instances of familial onset did not occur."
    explanation: >
      Smoking history is frequent (56%) in the registry cohort, supporting an
      association but not a causal role.
  - reference: PMID:18202348
    reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune PAP had an incidence and prevalence higher than previously reported and was not strongly linked to smoking, occupational exposure, or other illnesses."
    explanation: >
      The same cohort explicitly refutes a strong causal link to smoking or
      occupational exposure, so this exposure is curated as an association only.
- name: Inhaled dust exposure
  exposure_term:
    preferred_term: exposure to inhaled dust
    term:
      id: ECTO:7000001
      label: exposure to dust
  influences_mechanisms:
  - target: Loss of Immune Tolerance to GM-CSF
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Graded identically to the smoking link and refuted by the same sentence,
      which names occupational exposure alongside smoking among the things the
      disease was not strongly linked to. Worth adding what this exposure's
      own description says and the evidence does not: inhalational exposures
      such as silica are more firmly tied to the secondary form of this
      disease than to the autoimmune form modelled here, so a dust-driven case
      may be a different entity rather than this one with an exposure.
    evidence:
    - reference: PMID:18202348
      reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A history of smoking occurred in 56%, and dust exposure occurred in 23%; instances of familial onset did not occur."
      explanation: >-
        Records dust exposure in 23 percent of the registry cohort. Prevalence
        among patients, without a comparison group.
  description: >
    Occupational or environmental dust exposure is reported in roughly a quarter
    of registry patients. Inhalational exposures such as silica are more firmly
    linked to secondary PAP than to the autoimmune form.
  presence: PRESENT
  evidence:
  - reference: PMID:18202348
    reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."

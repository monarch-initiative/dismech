    snippet: "A disease severity score reflecting the presence of symptoms and degree of hypoxemia correlated well with carbon monoxide diffusing capacity and serum biomarkers, less well with pulmonary function, and not with granulocyte/macrophage colony-stimulating factor autoantibody levels or duration of disease."

      Large-scale differential expression of both lncRNAs and mRNAs
      distinguishes aPAP peripheral blood from healthy controls.
    supporting_text: "In total, 12459 DE lncRNAs and 9331 DE mRNAs were identified in APAP patient samples."
  - statement: >-
      Twelve differentially expressed lncRNAs survived qRT-PCR validation as
      candidate contributors to pathogenesis.
    supporting_text: "A qRT-PCR validation of 20 DE lncRNAs and 20 mRNAs indicated that 12 DE lncRNAs may be involved in the pathogenesis of APAP."
  evidence:
  - reference: PMID:33820876

differential_diagnoses:
- name: Hereditary pulmonary alveolar proteinosis
  description: >
    Biallelic CSF2RA or CSF2RB defects disable the same GM-CSF axis at the
    receptor. GM-CSF autoantibody testing is negative and onset is typically
    earlier.
  evidence:
  - reference: PMID:30846703
    reference_title: "Pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hereditary (due to mutations in CSF2RA or CSF2RB, encoding GM-CSF receptor subunits)"
    explanation: The primer defines the hereditary form by CSF2RA/CSF2RB mutation.
- name: Secondary pulmonary alveolar proteinosis
  description: >
    PAP arising as a consequence of another disease (haematologic malignancy,
    immunodeficiency, chronic infection, or inhalational exposure) that reduces
    alveolar macrophage number or function; GM-CSF autoantibodies are absent.
  evidence:
  - reference: PMID:18202348
    reference_title: "Characteristics of a large cohort of patients with autoimmune pulmonary alveolar proteinosis in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired pulmonary alveolar proteinosis (PAP) is a syndrome characterized by pulmonary surfactant accumulation occurring in association with granulocyte/macrophage colony-stimulating factor autoantibodies (autoimmune PAP) or as a consequence of another disease (secondary PAP)."
    explanation: The cohort paper defines the autoimmune versus secondary distinction.
- name: Community-acquired pneumonia
  description: >
    The nonspecific clinical and radiographic picture commonly leads to initial
    misdiagnosis as pneumonia, substantially delaying diagnosis.
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low prevalence and nonspecific clinical, radiological, and laboratory findings commonly lead to misdiagnosis as pneumonia and substantially delay an accurate diagnosis."
    explanation: Misdiagnosis as pneumonia is explicitly identified as the common error.
treatments:
- name: Whole Lung Lavage
  description: >
    Sequential large-volume saline lavage of each lung under general anaesthesia
    physically removes accumulated alveolar surfactant. It remains the first-line
    therapy despite never having been tested in a randomized trial.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: whole lung lavage
    term:
      id: NCIT:C38068
      label: Lavage
  target_mechanisms:
  - target: Alveolar Surfactant Accumulation
    treatment_effect: INHIBITS
    description: >
      Lavage mechanically clears the accumulated alveolar material, acting
      downstream of the uncorrected autoantibody and macrophage defect.
    evidence:
    - reference: PMID:35227171
      reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although whole-lung lavage remains the first-line therapy, inhaled GM-CSF is a promising pharmacotherapeutic approach demonstrated in well-controlled trials to be safe, well tolerated, and efficacious."
      explanation: The review names whole-lung lavage as first-line therapy.
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although whole-lung lavage remains the first-line therapy, inhaled GM-CSF is a promising pharmacotherapeutic approach demonstrated in well-controlled trials to be safe, well tolerated, and efficacious."
    explanation: Establishes whole-lung lavage as standard first-line care.
  notes: >
    Symptomatic rather than mechanism-directed: it removes accumulated material
    without correcting the autoantibody or restoring macrophage differentiation,
    so relapse and repeat lavage are common.
- name: Inhaled Molgramostim
  description: >
    Once-daily inhaled recombinant human GM-CSF delivered directly to the alveolar
    compartment to overcome local autoantibody neutralization and restore alveolar
    macrophage GM-CSF signaling. Efficacy was shown in the phase 2/3 IMPALA trial
    (alveolar-arterial oxygen difference) and confirmed in the phase 3 IMPALA-2
    trial (DLCO).
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: molgramostim
      term:
        id: NCIT:C77591
        label: Molgramostim
  target_mechanisms:
  - target: GM-CSF Neutralization and Functional GM-CSF Deficiency
    treatment_effect: ACTIVATES
    description: >
      Supplying exogenous GM-CSF into the alveolus restores receptor engagement
      despite the neutralizing autoantibody, correcting the functional ligand
      deficiency at its point of action.
    evidence:
    - reference: PMID:32897035
      reference_title: "Inhaled Molgramostim Therapy in Autoimmune Pulmonary Alveolar Proteinosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is caused by disruption of granulocyte-macrophage colony-stimulating factor (GM-CSF) signaling, which pulmonary alveolar macrophages require to clear surfactant."
      explanation: >
        The trial rationale explicitly targets the disrupted GM-CSF signaling
        node that inhaled GM-CSF replaces.
  evidence:
  - reference: PMID:32897035
    reference_title: "Inhaled Molgramostim Therapy in Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "improvement was greater among patients receiving continuous molgramostim than among those receiving placebo"
    explanation: >
      The IMPALA randomized trial demonstrated superiority of continuous inhaled
      molgramostim over placebo on the alveolar-arterial oxygen difference.
  - reference: PMID:40834301
    reference_title: "Phase 3 Trial of Inhaled Molgramostim in Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once-daily inhaled molgramostim led to a greater increase in pulmonary gas transfer than placebo in patients with aPAP."
    explanation: >
      The phase 3 IMPALA-2 trial confirms benefit on gas transfer, the primary
      endpoint.
  - reference: PMID:40834301
    reference_title: "Phase 3 Trial of Inhaled Molgramostim in Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The least-squares mean change in DLCO from baseline to week 24 was 9.8 percentage points"
    explanation: >
      Quantifies the DLCO gain on molgramostim at the primary endpoint
      (versus 3.8 percentage points on placebo).
- name: Inhaled Sargramostim
  description: >
    Inhaled recombinant human GM-CSF (sargramostim), evaluated in a Japanese
    multicentre phase II trial with a 62% response rate and a sustained effect,
    without change in serum autoantibody levels.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sargramostim
      term:
        id: NCIT:C1492
        label: Sargramostim
  target_mechanisms:
  - target: Arrested Alveolar Macrophage Terminal Differentiation
    treatment_effect: ACTIVATES
    description: >
      Local GM-CSF supplementation drives alveolar macrophage differentiation and
      restores surfactant clearance capacity without lowering autoantibody titre.
    evidence:
    - reference: PMID:20167854
      reference_title: "Inhaled granulocyte/macrophage-colony stimulating factor as therapy for pulmonary alveolar proteinosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "No serious adverse events occurred, and serum GM-CSF autoantibody levels were unchanged."
      explanation: >
        Benefit occurs without reducing autoantibody, indicating the drug acts
        by restoring downstream signaling rather than removing the autoantibody.
  evidence:
  - reference: PMID:20167854
    reference_title: "Inhaled granulocyte/macrophage-colony stimulating factor as therapy for pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 35 patients completing the high- and low-dose therapy, 24 improved, resulting in an overall response rate of 62%"
    explanation: Quantifies the response rate to inhaled sargramostim.
  - reference: PMID:20167854
    reference_title: "Inhaled granulocyte/macrophage-colony stimulating factor as therapy for pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhaled GM-CSF therapy is safe, effective, and provides a sustained therapeutic effect in autoimmune PAP."
    explanation: The trial conclusion supports safety, efficacy and durability.
- name: Rituximab
  description: >
    Anti-CD20 B-cell depletion (two 1,000 mg intravenous infusions 15 days apart)
    used for disease refractory to lavage and inhaled GM-CSF. In an open-label
    phase II trial oxygenation improved in seven of nine completers, and
    anti-GM-CSF IgG fell in lavage fluid though not in serum.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Loss of Immune Tolerance to GM-CSF
    treatment_effect: INHIBITS
    description: >
      Depleting CD20-positive B lymphocytes reduces autoantibody production,
      acting on the upstream autoimmune trigger rather than the downstream
      surfactant load. Because most antibody-secreting plasma cells lack CD20,
      the serum autoantibody pool is only partly affected.
    evidence:
    - reference: PMID:21478218
      reference_title: "An open-label trial of rituximab therapy in pulmonary alveolar proteinosis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Total anti-GM-CSF immunoglobulin (Ig)G levels from baseline to 6 months were decreased in BAL fluids"
      explanation: >
        Autoantibody fell in the target organ but not in serum, supporting a
        partial effect on the autoantibody-producing compartment.
  evidence:
  - reference: PMID:21478218
    reference_title: "An open-label trial of rituximab therapy in pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both arterial oxygen tension and alveolar-arterial oxygen tension difference in room air improved in seven out of the nine patients completing the study."
    explanation: The open-label trial's primary oxygenation endpoint improved in most completers.
  - reference: PMID:21478218
    reference_title: "An open-label trial of rituximab therapy in pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reduction in anti-GM-CSF IgG levels in the lung correlated with disease changes, suggesting that disease pathogenesis is related to autoantibody levels in the target organ."
    explanation: >
      Links clinical response to lung-compartment autoantibody reduction,
      supporting the target-organ autoantibody model.
  notes: >
    Evidence is a single-centre, open-label, 10-patient trial without a placebo
    group; durability and optimal dosing remain undefined.
- name: Plasmapheresis
  description: >
    Therapeutic plasma exchange to lower circulating GM-CSF autoantibody in
    refractory disease. Evidence is limited to case-level reports with
    inconsistent responses, and some patients remain refractory despite
    documented antibody reduction.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: GM-CSF Neutralization and Functional GM-CSF Deficiency
    treatment_effect: INHIBITS
    description: >
      Plasma exchange removes circulating GM-CSF autoantibody, aiming to relieve
      the neutralization of GM-CSF. The autoantibody pool is large enough that
      the removal rate cannot keep pace with it.
    evidence:
    - reference: PMID:35227171
      reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "However, the procedure must be repeated frequently (daily for 2 wk) to reduce the very high autoantibody concentrations present"
      explanation: >
        The mechanism is sound but the required exchange frequency reflects the
        autoantibody burden, which is what limits the approach. Tagged OTHER
        because the source sentence attributes this to unpublished results
        (B. Trapnell) rather than to published clinical data.
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Thus, this approach appears impractical and unviable in our opinion."
    explanation: >
      The state-of-the-art review judges plasmapheresis impractical and
      unviable. Curated as REFUTE so the entry records the negative
      recommendation rather than implying plasmapheresis is a usable option.
      Tagged OTHER, not HUMAN_CLINICAL: the sentence is explicitly the authors'
      opinion ("in our opinion") resting on unpublished results, so this is
      expert judgement rather than published clinical data refuting the
      therapy.
  notes: >
    Retained for completeness of the therapeutic sequence and because the
    negative is informative: the mechanism is theoretically sound but defeated
    by the size of the autoantibody pool. Treat as not recommended rather than
    merely unproven.
- name: Lung Transplantation
  description: >
    Reserved for severe disease refractory to all other therapy. PAP recurrence
    in the allograft has been reported, consistent with the persistence of the
    circulating autoantibody after transplantation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: lung transplantation
    term:
      id: NCIT:C15274
      label: Lung Transplantation
  target_mechanisms:
  - target: Secondary Pulmonary Fibrosis
    treatment_effect: INHIBITS
    description: >
      Transplantation replaces the fibrotic lung once irreversible parenchymal
      distortion has made whole-lung lavage ineffective. It addresses the
      end-organ consequence, not the mechanism.
    evidence:
    - reference: PMID:35227171
      reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In patients with autoimmune PAP who develop pulmonary fibrosis, WLL becomes ineffective and lung transplantation is required; however, the autoimmune PAP lung disease returns and must be treated"
      explanation: >
        Establishes both the indication (fibrosis making lavage ineffective) and
        the boundary (disease returns in the allograft).
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the autoimmune PAP lung disease returns and must be treated"
    explanation: >
      Recurrence in the allograft is the decisive caveat: because the causal
      autoantibody is systemic and persists after transplantation, the new lung
      is exposed to the same lesion and requires ongoing treatment.
  notes: >
    Because the causal autoantibody is systemic and is not removed by replacing
    the lung, transplantation does not address the upstream mechanism, and PAP
    recurs in the allograft.
- name: Oral Statin Therapy (investigational)
  description: >
    Pathogenesis-based repurposing that targets alveolar macrophage cholesterol
    overload rather than the autoantibody. Supported by patient-level
    observational improvement, ex vivo human macrophage data, and rescue in
    Csf2rb-deficient mice; not established practice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: HMG-CoA reductase inhibitor
      term:
        id: NCIT:C1655
        label: HMG-CoA Reductase Inhibitor
  target_mechanisms:
  - target: Impaired Surfactant Catabolism and Macrophage Cholesterol Overload
    treatment_effect: INHIBITS
    description: >
      Statins lower alveolar macrophage cholesterol burden and increase
      cholesterol efflux, relieving the specific lipid lesion identified in PAP
      macrophages.
    evidence:
    - reference: PMID:30087322
      reference_title: "Statin as a novel pharmacotherapy of pulmonary alveolar proteinosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ex vivo statin treatment reduces cholesterol levels in explanted alveolar macrophages"
      explanation: >
        Direct ex vivo demonstration that statin lowers cholesterol in patient
        alveolar macrophages.
  evidence:
  - reference: PMID:30087322
    reference_title: "Statin as a novel pharmacotherapy of pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral statin therapy is associated with clinical, physiological, and radiological improvement in autoimmune PAP patients, and ex vivo statin treatment reduces cholesterol levels in explanted alveolar macrophages."
    explanation: >
      Observational human improvement plus ex vivo mechanism; note the human
      data are associational rather than randomized.
  - reference: PMID:30087322
    reference_title: "Statin as a novel pharmacotherapy of pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These results support the feasibility of statin as a novel pathogenesis-based pharmacotherapy of PAP."
    explanation: >
      Authors' overall conclusion. Tagged OTHER because it summarises pooled

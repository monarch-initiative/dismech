  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Research has established GM-CSF as a pulmonary regulatory molecule critical to surfactant homeostasis, alveolar stability, lung function, and host defense."
    explanation: >
      GM-CSF is the regulatory node whose neutralization explains both the
      surfactant and the host-defence arms of the disease.
  downstream:

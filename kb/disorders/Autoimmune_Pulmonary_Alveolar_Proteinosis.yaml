biochemical:
- name: Serum GM-CSF autoantibody
  presence: PRESENT
  specificity: >
    Diagnostic for the autoimmune form of PAP; reported sensitivity and
    specificity of 100% in the commercially available assay. Low-level GM-CSF
    autoantibodies are detectable in all healthy people, so the assay depends on
    a concentration threshold rather than mere detection.
  frequency: OBLIGATE
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenesis is driven by GM-CSF (granulocyte/macrophage colony-stimulating factor) autoantibodies, which are present at high concentrations in blood and tissues and form the basis of an accurate, commercially available diagnostic blood test with sensitivity and specificity of 100%."
    explanation: The serum autoantibody is both the pathogenic driver and the diagnostic test.
  - reference: PMID:10499925
    reference_title: "Idiopathic pulmonary alveolar proteinosis as an autoimmune disease with neutralizing antibody against granulocyte/macrophage colony-stimulating factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The antibody was found to be present in all specimens of bronchoalveolar lavage fluid obtained from 11 I-PAP patients but not in samples from 2 secondary PAP patients, 53 normal subjects, and 14 patients with other lung diseases."
    explanation: >
      The original description documents the discriminating presence of the
      autoantibody in autoimmune but not secondary PAP or controls.
  notes: >
    Autoantibody titre correlates poorly with disease severity; in the Japanese
    registry the severity score did not correlate with autoantibody level.

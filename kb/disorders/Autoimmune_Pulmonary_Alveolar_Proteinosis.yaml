classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
    notes: >-
      Primary clinical home: the defining lesion is alveolar surfactant
      accumulation with hypoxaemia, and management is pulmonary (whole-lung
      lavage, inhaled GM-CSF).
    evidence:
    - reference: PMID:35227171
      reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Autoimmune pulmonary alveolar proteinosis (PAP) is a rare disease characterized by progressive accumulation of surfactant in pulmonary alveoli and resulting hypoxemia"
      explanation: >
        The review frames the disease by alveolar surfactant accumulation and
        hypoxaemia, placing it in the respiratory Part.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      Secondary Part: the causal lesion is a neutralizing IgG autoantibody, and
      the disease is simultaneously an autoimmune disease and an acquired innate
      immunodeficiency. B-cell-depleting therapy targets this axis.
    evidence:
    - reference: PMID:10499925
      reference_title: "Idiopathic pulmonary alveolar proteinosis as an autoimmune disease with neutralizing antibody against granulocyte/macrophage colony-stimulating factor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report here that I-PAP is an autoimmune disease with neutralizing antibody of immunoglobulin G isotype against granulocyte/macrophage colony-stimulating factor (GM-CSF)."
      explanation: >
        The founding study establishes the disease as autoimmune, supporting the
        second Part assignment alongside the respiratory one.

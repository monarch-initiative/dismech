      label: Homo sapiens
  publication: PMID:33820876
  description: >-
    Microarray profiling of peripheral blood from five aPAP patients and five
    healthy volunteers. The sample source is peripheral blood rather than lung
    tissue, so it interrogates the systemic/autoimmune arm of the disease
    rather than the alveolar lesion directly.
  findings:

- name: Arrested Alveolar Macrophage Terminal Differentiation
  description: >
    Without GM-CSF signaling, alveolar macrophages fail to complete terminal
    differentiation, in particular failing to sustain the PU.1/PPAR-gamma
    transcriptional program that licenses surfactant lipid catabolism and
    cholesterol efflux.

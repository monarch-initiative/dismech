discussions:
- discussion_id: gap_apap_autoantibody_mediated_animal_model
  prompt: >-
    Does any available animal model reproduce the autoimmune arm of aPAP - the
    breakdown of tolerance to GM-CSF and sustained endogenous autoantibody
    production - rather than only the downstream GM-CSF-signaling loss modelled
    by Csf2 and Csf2rb knockouts?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Immune Tolerance to GM-CSF
  - pathophysiology#GM-CSF Neutralization and Functional GM-CSF Deficiency
  rationale: >-
    The standard model systems for PAP are germline knockouts of GM-CSF or its
    receptor, which faithfully reproduce the surfactant-clearance and
    foamy-macrophage phenotype but begin downstream of the autoimmune lesion:
    they model hereditary, not autoimmune, PAP. The one experiment that does
    reproduce the autoimmune arm - passive transfer of purified patient-derived
    GM-CSF autoantibody into macaques - is a passive-transfer challenge in a
    non-human primate, not a self-sustaining model of tolerance breakdown, and
    it does not recapitulate the HLA-DRB1*08:03-associated origin of the
    autoantibody response. Consequently, therapies aimed at the upstream
    autoimmune trigger (B-cell depletion, tolerance induction) cannot be
    evaluated preclinically in the way that surfactant-clearance therapies can,
    which is a concrete translational limitation rather than merely an
    unexplored question.
  proposed_experiments:
  - experiment_id: exp_apap_induced_autoimmunity_model
    name: Active-immunization or humanized-HLA model of endogenous anti-GM-CSF autoimmunity
    description: >-
      Develop a model in which endogenous anti-GM-CSF autoantibody production is
      induced and sustained rather than passively transferred, so that
      tolerance-directed therapies can be evaluated preclinically. Confirm that
      autoantibody rises above the reported critical threshold and that alveolar
      surfactant accumulation and foamy alveolar macrophages follow.
  - experiment_id: exp_apap_hla_drb1_0803_transgenic_challenge
    name: HLA-DRB1*08:03 transgenic GM-CSF immunization challenge
    description: >-
      Immunize HLA-DRB1*08:03 transgenic mice with GM-CSF and determine whether
      the risk allele permits breakdown of tolerance and development of alveolar
      surfactant accumulation, directly testing the MHC class II presentation
      hypothesis implied by the human GWAS.
  evidence:
  - reference: PMID:20042763
    reference_title: "Human GM-CSF autoantibodies and reproduction of pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these results show that GM-CSF autoantibodies reproduce the pathologic manifestations of idiopathic pulmonary alveolar proteinosis and provide strong evidence of causality in human idiopathic pulmonary alveolar proteinosis"
    explanation: >
      Passive transfer of patient autoantibody into primates reproduces the
      pathology, but this is an antibody-challenge experiment rather than a
      model of endogenous tolerance breakdown.
- discussion_id: gap_apap_hla_association_replication
  prompt: >-
    Is the HLA-DRB1*08:03 association with aPAP generalizable beyond the
    Japanese population, or is the MHC contribution to aPAP risk
    ancestry-specific?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Immune Tolerance to GM-CSF
  rationale: >-
    The only genome-wide significant genetic signal reported for aPAP comes from
    a single-ancestry Japanese study of 198 cases and 395 controls. Because aPAP
    occurs in individuals of all races and geographic regions at a similar
    prevalence, an ancestry-restricted MHC risk allele would imply either
    population-specific genetic architecture or a modest effect that smaller
    non-Japanese cohorts are underpowered to detect. The distinction matters for
    whether MHC class II presentation of GM-CSF is a general mechanism of
    tolerance loss in this disease or one of several routes to the same
    autoantibody endpoint.
  proposed_experiments:
  - experiment_id: exp_apap_multiancestry_hla_finemapping
    name: Multi-ancestry HLA fine-mapping in non-Japanese aPAP cohorts
    description: >-
      Assemble non-Japanese aPAP cohorts of sufficient size to detect an odds
      ratio near 5 at HLA-DRB1*08:03 and perform HLA imputation and fine-mapping
      to test whether the MHC class II signal replicates outside Japan.
  - experiment_id: exp_apap_hla_autoantibody_titre_correlation
    name: HLA-DRB1*08:03 carriage versus anti-GM-CSF autoantibody concentration
    description: >-
      In non-Japanese patients, test whether HLA-DRB1*08:03 carriage predicts
      anti-GM-CSF autoantibody concentration, which would support the allele
      acting through the magnitude of the autoantibody response independently of
      ancestry.
  evidence:
  - reference: PMID:33589587
    reference_title: "Genetic determinants of risk in autoimmune pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we conducted a genome-wide association study of aPAP in 198 patients and 395 control participants of Japanese ancestry."
    explanation: >
      The GWAS is restricted to a single ancestry and a modest sample size,
      which bounds the generalizability of the HLA claim.
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has a prevalence of 7-10 per million; occurs in individuals of all races, geographic regions, sex, and socioeconomic status; and accounts for 90% of all patients with PAP syndrome."
    explanation: >
      The disease occurs across all populations, making an ancestry-restricted
      risk allele a substantive open question.
notes: >
  Curated de novo from a claude_code deep-research report
  (research/Autoimmune_Pulmonary_Alveolar_Proteinosis-deep-research-claude_code.md)
  used as leads only; every PMID, snippet and ontology term was independently
  verified against PubMed/PMC and OAK. The deep-research report mislabelled two
  trial citations (it attached NEJMoa1816216 to IMPALA and NEJMoa1913590 to a
  sargramostim trial), so trial identities were re-derived from PubMed:
  PMID:32897035 is IMPALA (molgramostim, NEJM 2020), PMID:40834301 is IMPALA-2
  (phase 3, NEJM 2025), and PMID:20167854 is the Japanese inhaled sargramostim
  phase II trial. No GeneReviews chapter covers autoimmune PAP, which is
  expected for a non-Mendelian acquired disease.


  Publication-readiness review (2026-08-05). Gaps closed against the repo's own
  QC metrics rather than by free-form expansion: the `classifications` block was
  absent; pathograph phenotype connectivity was 50% (7/14) and causal-gene
  wiring 0% (HLA-DRB1 sat in `genetic` without reaching a mechanism node); the
  `imaging_findings`, `animal_models` and `datasets` blocks were absent; two
  treatments (plasmapheresis, lung transplantation) carried no evidence; and the
  IMPALA trial the entry already cited was not curated as a `clinical_trials`
  record. Most of the new evidence came from the full text of PMID:35227171,
  which is cached in full rather than abstract-only, so the natural-history data
  (survival curve, spontaneous resolution, cause of death) and the negative
  recommendation on plasmapheresis are now quotable. Connectivity is now 87%
  (13/15); the two remaining unconnected phenotypes are deliberate - chest pain
  has no asserted mechanistic route in the sources, and digital clubbing is
  curated as a REFUTE negative that must not be given a causal in-edge.
  GSE153957 was verified against GEO and its publication (PMID:33820876)
  independently fetched; NCT02702180 was read out of the cached IMPALA report
  rather than assumed.

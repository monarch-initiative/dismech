diagnosis:
- name: Serum GM-CSF autoantibody test
  description: >
    The defining diagnostic test. A serum GM-CSF autoantibody assay reliably
    identifies autoimmune PAP and separates it from hereditary PAP, secondary
    PAP, other lung diseases and healthy individuals, with reported sensitivity
    and specificity of 100%. Because low-level autoantibodies are ubiquitous in
    people without PAP, the test depends on a concentration threshold rather
    than on mere detection.
  diagnosis_term:
    preferred_term: serum GM-CSF autoantibody measurement
    term:
      id: NCIT:C181397
      label: Autoantibody Measurement
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with suspected or confirmed PAP, a serum GM-CSF autoantibody test (Figure 4A) should be performed because it is highly sensitive and specific for a diagnosis of autoimmune PAP, which accounts for 90% of all cases of PAP"
    explanation: Establishes the serum autoantibody assay as the test to perform in suspected PAP.
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a serum GM-CSF autoantibody test can reliably identify autoimmune PAP and can accurately distinguish it from other PAP-causing diseases, other lung diseases, and people without lung disease"
    explanation: >
      Documents the discriminating power of the assay against the full
      differential.
  - reference: PMID:19282464
    reference_title: "Granulocyte/macrophage-colony-stimulating factor autoantibodies and myeloid cell immune functions in healthy subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The critical threshold of GM-CSF autoantibodies associated with the development of PAP was determined."

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "our findings strongly suggest that neutralization of GM-CSF bioactivity by the antibody causes dysfunction of alveolar macrophages, which results in reduced surfactant clearance."
      explanation: >
        States the edge explicitly: GM-CSF neutralization causes alveolar
        macrophage dysfunction.
  - target: Systemic Myeloid Host Defence Impairment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19282464
      reference_title: "Granulocyte/macrophage-colony-stimulating factor autoantibodies and myeloid cell immune functions in healthy subjects."

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A thickened surfactant layer and surfactant-filled alveoli contribute to reduced oxygen delivery, resulting in hypoxemia, dyspnea, and in severe cases polycythemia, respiratory failure, and death."
    explanation: >

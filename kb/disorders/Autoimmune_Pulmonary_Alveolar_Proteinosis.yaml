    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: JAK-STAT signaling downstream of the GM-CSF receptor
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  evidence:
  - reference: PMID:10499925
    reference_title: "Idiopathic pulmonary alveolar proteinosis as an autoimmune disease with neutralizing antibody against granulocyte/macrophage colony-stimulating factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It specifically bound GM-CSF and neutralized bioactivity of the cytokine in vitro."
    explanation: >
      The autoantibody directly binds and neutralizes GM-CSF bioactivity,
      establishing functional ligand deficiency. The demonstration is an
      in vitro binding/neutralization assay, hence IN_VITRO rather than
      HUMAN_CLINICAL; the human-clinical arm of this node is carried by the
      other evidence items.
  - reference: PMID:32897035
    reference_title: "Inhaled Molgramostim Therapy in Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by disruption of granulocyte-macrophage colony-stimulating factor (GM-CSF) signaling, which pulmonary alveolar macrophages require to clear surfactant."
    explanation: >
      The trial report states the disruption of GM-CSF signaling required by
      alveolar macrophages for surfactant clearance.
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Research has established GM-CSF as a pulmonary regulatory molecule critical to surfactant homeostasis, alveolar stability, lung function, and host defense."
    explanation: >
      GM-CSF is the regulatory node whose neutralization explains both the
      surfactant and the host-defence arms of the disease.
  downstream:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In PAP patients, alveolar macrophages have a marked increase in cholesterol but only a minor increase in phospholipids, and pulmonary surfactant has an increase in the ratio of cholesterol to phospholipids."

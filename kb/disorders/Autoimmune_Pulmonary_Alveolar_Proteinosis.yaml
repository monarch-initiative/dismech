- name: Impaired Surfactant Catabolism and Macrophage Cholesterol Overload
  description: >
    Undifferentiated alveolar macrophages ingest surfactant but cannot catabolize
    its lipid or efflux the liberated cholesterol. Lipidomic analysis shows the
    accumulating species is predominantly cholesterol rather than phospholipid,
    reframing PAP as a disorder of macrophage cholesterol handling and
    identifying the foamy macrophage as a cholesterol-engorged cell.

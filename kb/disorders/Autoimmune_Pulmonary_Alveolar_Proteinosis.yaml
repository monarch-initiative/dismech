name: Autoimmune Pulmonary Alveolar Proteinosis
category: Respiratory Disease
creation_date: "2026-08-01T23:40:00Z"
synonyms:
- Autoimmune PAP
- aPAP
- Idiopathic pulmonary alveolar proteinosis
- Acquired pulmonary alveolar proteinosis
- Primary autoimmune PAP
description: >
  Autoimmune pulmonary alveolar proteinosis (aPAP) is an acquired diffuse lung
  disease caused by high-titre neutralizing IgG autoantibodies against
  granulocyte-macrophage colony-stimulating factor (GM-CSF). Loss of GM-CSF
  bioactivity blocks terminal differentiation of alveolar macrophages, so the
  GM-CSF-PU.1-PPAR-gamma-dependent catabolism of surfactant lipid and the efflux
  of cholesterol fail; PAS-positive lipoproteinaceous surfactant then accumulates
  within foamy alveolar macrophages and free in the alveolar spaces while the
  alveolar walls remain well preserved. Patients present with insidious
  exertional dyspnoea, cough, hypoxaemia and a crazy-paving pattern on HRCT.
  Because GM-CSF also primes neutrophil and macrophage host defence, aPAP is
  simultaneously an autoimmune disease and an acquired innate immunodeficiency,
  predisposing to opportunistic infection. It accounts for roughly 90% of the
  pulmonary alveolar proteinosis syndrome and is mechanistically distinct from
  hereditary PAP (biallelic CSF2RA/CSF2RB defects, MONDO:0012580), which
  disables the same axis at the receptor rather than the ligand, and from
  secondary PAP, in which an underlying disease reduces alveolar macrophage
  number or function.

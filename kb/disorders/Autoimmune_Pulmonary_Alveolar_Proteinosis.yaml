    explanation: Dust exposure is documented in 23% of the cohort.
pathophysiology:
- name: Loss of Immune Tolerance to GM-CSF
  description: >
    Loss of B-cell tolerance to GM-CSF, influenced by MHC class II background
    (HLA-DRB1*08:03), drives production of high-titre polyclonal neutralizing IgG
    autoantibodies against GM-CSF. Low-level GM-CSF autoantibodies are present in
    all healthy people, so disease requires crossing a critical concentration
    threshold rather than simply acquiring the antibody.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  - preferred_term: humoral immune response
    term:
      id: GO:0006959
      label: humoral immune response
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:10499925
    reference_title: "Idiopathic pulmonary alveolar proteinosis as an autoimmune disease with neutralizing antibody against granulocyte/macrophage colony-stimulating factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here that I-PAP is an autoimmune disease with neutralizing antibody of immunoglobulin G isotype against granulocyte/macrophage colony-stimulating factor (GM-CSF)."
    explanation: >
      The founding study identifies the neutralizing anti-GM-CSF IgG
      autoantibody as the autoimmune basis of the disease.
  - reference: PMID:19282464
    reference_title: "Granulocyte/macrophage-colony-stimulating factor autoantibodies and myeloid cell immune functions in healthy subjects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The critical threshold of GM-CSF autoantibodies associated with the development of PAP was determined."
    explanation: >
      Disease onset is threshold-dependent: autoantibodies exist physiologically
      and only cause PAP above a critical concentration.
  - reference: PMID:33589587
    reference_title: "Genetic determinants of risk in autoimmune pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HLA-DRB1*08:03 was also associated with an increased level of anti-GM-CSF antibody, a key driver of the disease"
    explanation: >
      MHC class II background modulates the magnitude of the autoantibody
      response, linking tolerance loss to genetic susceptibility.
  downstream:
  - target: GM-CSF Neutralization and Functional GM-CSF Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10499925
      reference_title: "Idiopathic pulmonary alveolar proteinosis as an autoimmune disease with neutralizing antibody against granulocyte/macrophage colony-stimulating factor."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "It specifically bound GM-CSF and neutralized bioactivity of the cytokine in vitro."
      explanation: >
        The autoantibody produced by the tolerance defect is the agent that
        neutralizes GM-CSF, closing this edge. The binding and neutralization
        were demonstrated in a cell-free/cell-based assay, so this is IN_VITRO
        evidence even though the antibody was purified from patients.
  - target: Autoimmune antibody positivity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10499925
      reference_title: "Idiopathic pulmonary alveolar proteinosis as an autoimmune disease with neutralizing antibody against granulocyte/macrophage colony-stimulating factor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The antibody was also found in sera from all I-PAP patients examined but not in sera from a secondary PAP patient or normal subjects, indicating that it exists systemically in I-PAP patients."
      explanation: >
        Loss of tolerance manifests directly as detectable systemic
        autoantibody, which is the definitional laboratory phenotype.
- name: GM-CSF Neutralization and Functional GM-CSF Deficiency
  description: >
    Circulating and alveolar autoantibodies bind GM-CSF and neutralize its
    bioactivity, producing a functional ligand deficiency despite normal CSF2
    expression and an intact GM-CSF receptor. This is the ligand-side mirror of
    the receptor-side lesion (biallelic CSF2RA/CSF2RB defects) that causes
    hereditary PAP.
  role: central_effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  locations:

definitions:
- name: Serologic case definition of autoimmune PAP
  definition_type: OTHER
  description: >
    A PAP syndrome (alveolar surfactant accumulation demonstrated by HRCT plus
    BAL cytology or lung biopsy) in which serum GM-CSF autoantibody testing is
    positive, distinguishing the autoimmune form from hereditary PAP
    (CSF2RA/CSF2RB defects) and secondary PAP.
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenesis is driven by GM-CSF (granulocyte/macrophage colony-stimulating factor) autoantibodies, which are present at high concentrations in blood and tissues and form the basis of an accurate, commercially available diagnostic blood test with sensitivity and specificity of 100%."
    explanation: >
      The state-of-the-art review establishes the serum GM-CSF autoantibody test
      as the defining diagnostic criterion, with reported sensitivity and
      specificity of 100%.

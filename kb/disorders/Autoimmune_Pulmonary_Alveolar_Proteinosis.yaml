    snippet: "we performed microarray analyses to identify differentially expressed (DE) lncRNAs and mRNAs between peripheral blood samples from five APAP patients and five healthy volunteers"
    explanation: Defines the dataset design, sample source and cohort size.
  notes: >-
    Exploratory and small (n=5 per group). The reported lncRNA and ceRNA
    networks are hypothesis-generating and are deliberately NOT curated as
    pathophysiology nodes; no mechanistic claim in this entry rests on them.
animal_models:
- species: Cynomolgus macaque (Macaca fascicularis)
  genotype: Wild type, passively immunized with patient-derived GM-CSF autoantibody
  category: Passive immunization / autoantibody transfer
  associated_phenotypes:
  - Alveolar filling with lipoproteinaceous material
  - Foamy alveolar macrophages
  - Milky bronchoalveolar lavage fluid
  description: >-
    Healthy primates given highly purified GM-CSF autoantibody from a patient,
    maintained at serum levels of 40 micrograms per millilitre or more for 10
    months, developed the full alveolar lesion. This is the model that closed
    the causality argument and licensed renaming the disease from "idiopathic"
    to "autoimmune" PAP. Its limitation is definitional: it transfers the
    effector antibody rather than inducing tolerance breakdown, so it models
    the downstream half of the disease only. See the
    gap_apap_autoantibody_mediated_animal_model discussion.
  evidence:
  - reference: PMID:20042763
    reference_title: "Human GM-CSF autoantibodies and reproduction of pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We administered highly purified GM-CSF autoantibodies derived from a patient with idiopathic pulmonary alveolar proteinosis to healthy nonhuman primates (Macaca fascicularis)."
    explanation: Defines the species and the passive-transfer design.
  - reference: PMID:20042763
    reference_title: "Human GM-CSF autoantibodies and reproduction of pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A diffuse, patchy distribution of lung lesions composed of well-preserved alveoli filled with eosinophilic, lipoproteinaceous material and enlarged, foamy alveolar macrophages developed in the macaques that received GM-CSF autoantibodies"
    explanation: >
      The transferred autoantibody reproduced the human alveolar lesion,
      including the well-preserved alveolar walls.
- species: Mouse (Mus musculus)
  genotype: Csf2, Csf2ra or Csf2rb knockout (Csf2KO, Csf2raKO, Csf2rbKO)
  category: Knockout
  genes:
  - preferred_term: CSF2
    term:
      id: hgnc:2434
      label: CSF2
  - preferred_term: CSF2RA
    term:
      id: hgnc:2435
      label: CSF2RA
  - preferred_term: CSF2RB
    term:
      id: hgnc:2436
      label: CSF2RB
  associated_phenotypes:
  - Alveolar surfactant accumulation
  - Foamy alveolar macrophages
  - Susceptibility to microbial pathogens
  - Polycythemia
  description: >-
    Germline disruption of GM-CSF or either GM-CSF receptor subunit produces
    spontaneous PAP that matches human autoimmune PAP physiologically,
    radiologically, histopathologically, biochemically and immunologically, and
    also reproduces the host-defence arm. Mechanistically, however, these mice
    model hereditary PAP: they ablate the axis at the ligand or receptor rather
    than by autoantibody, so they sit downstream of the autoimmune lesion.
    Because the lesion is genetic rather than autoimmune, the model cannot be
    used to evaluate tolerance-directed or B-cell-depleting therapy - the
    translational limitation recorded in the
    gap_apap_autoantibody_mediated_animal_model discussion.
  evidence:
  - reference: PMID:35227171
    reference_title: "Autoimmune Pulmonary Alveolar Proteinosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "spontaneously develop PAP similar to autoimmune PAP regarding physiological, radiological, histopathological, biochemical, and immunological manifestations"
    explanation: >
      Establishes the breadth of phenocopy across GM-CSF and receptor-subunit
      knockouts.
  - reference: PMID:30087322
    reference_title: "Statin as a novel pharmacotherapy of pulmonary alveolar proteinosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Csf2rb-/- mice, statin therapy reduces cholesterol accumulation in alveolar macrophages and ameliorates PAP, and ex vivo statin treatment increases cholesterol efflux from macrophages."
    explanation: >
      The knockout is tractable for testing surfactant-clearance therapies,
      which is how the statin hypothesis was established preclinically.

datasets: []
discussions:
- discussion_id: gap_lgs_convergent_syndrome_vs_disease
  prompt: >-
    Is Lennox-Gastaut syndrome a single disease with a unifying network
    mechanism, or a convergent electroclinical endpoint that many distinct
    etiologies reach when they perturb the immature brain — and what network
    property, if any, actually defines membership?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Heterogeneous Etiologic Brain Insult
  - pathophysiology#Diffuse Thalamocortical Network Dysfunction
  rationale: >-
    LGS is defined by a characteristic triad that appears despite highly
    diverse structural, genetic, and metabolic causes, which is why this entry
    models a heterogeneous insult converging on a shared network node rather
    than a single lesion. Whether there is a genuine unifying mechanism (a
    specific thalamocortical network signature that all cases share) or whether
    LGS is essentially a stereotyped way the immature network fails, with no
    deeper common cause, remains debated. The answer determines whether LGS
    should be modeled as one disease entity or as a syndromic label over many
    diseases, and whether a network-level therapeutic target could exist.
  evidence:
  - reference: PMID:24902608
    reference_title: "Lennox-Gastaut syndrome and phenotype: secondary network epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We previously found common cerebral networks involved during slow spike-and-wave (SSW) and generalized paroxysmal fast activity (PFA), characteristic interictal discharges."
    explanation: >-
      Supports a shared-network view by showing common cerebral networks engaged
      by the defining discharges across patients, the empirical basis for the
      convergent-syndrome position.
  proposed_experiments:
  - experiment_id: exp_lgs_shared_network_signature
    name: Cross-etiology network-signature comparison in LGS
    description: >-
      Using simultaneous EEG and functional MRI across patients with LGS of
      distinct etiologies (structural, genetic, post-infantile-spasms), test
      whether slow spike-and-wave and paroxysmal fast activity recruit the same
      thalamocortical hubs regardless of cause, and whether a shared network
      signature separates LGS from other generalized epilepsies.
    experiment_type:
      preferred_term: EEG-functional MRI network comparison experiment
    readouts:
    - name: Shared network recruitment
      target: pathophysiology#Diffuse Thalamocortical Network Dysfunction
      assays:
      - preferred_term: functional magnetic resonance imaging assay
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Non-LGS generalized epilepsy comparators
      description: Patients with other generalized epilepsies imaged under the same protocol.
    decision_criterion: >-
      A unifying-mechanism interpretation is supported if a common
      thalamocortical network is recruited across etiologies and distinguishes
      LGS from comparators; a purely convergent-label interpretation is favored
      if the network signature tracks etiology rather than the LGS diagnosis.
    would_support:
    - pathophysiology#Diffuse Thalamocortical Network Dysfunction

- discussion_id: gap_lgs_tonic_seizure_gpfa_circuit_mechanism
  prompt: >-
    What circuit generates the tonic seizures and their electrographic
    correlate, sleep-activated generalized paroxysmal fast activity — the
    near-specific hallmark of LGS — and why is it activated by non-REM sleep?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
  rationale: >-
    Generalized paroxysmal fast activity and tonic seizures are the most
    LGS-specific features, yet the circuit that produces them is poorly
    resolved. Competing accounts implicate thalamocortical mechanisms, brainstem
    arousal systems, and a sleep-state gating that selectively activates the
    discharge in non-REM sleep. Resolving the generator matters directly for
    neuromodulation targeting (for example centromedian thalamic stimulation)
    and for understanding why the hallmark seizure type is sleep-activated.
  evidence:
  - reference: PMID:24902608
    reference_title: "Lennox-Gastaut syndrome and phenotype: secondary network epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We previously found common cerebral networks involved during slow spike-and-wave (SSW) and generalized paroxysmal fast activity (PFA), characteristic interictal discharges."
    explanation: >-
      Identifies the network engaged by paroxysmal fast activity but does not
      resolve the specific generator or the sleep-state gating, which is the
      open question.
  proposed_experiments:
  - experiment_id: exp_lgs_gpfa_generator_localization
    name: Sleep-state localization of the paroxysmal fast activity generator
    description: >-
      Combine intracranial or high-density scalp recordings with sleep staging
      and thalamic recording where available to localize the onset of
      paroxysmal fast activity and test whether non-REM sleep gates a
      thalamocortical or brainstem generator.
    experiment_type:
      preferred_term: intracranial seizure-onset localization experiment
    readouts:
    - name: Fast-activity onset localization by sleep state
      target: pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
      assays:
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Wake-state recordings
      description: Matched recordings during wakefulness to isolate the sleep-gating effect.
    decision_criterion: >-
      A generator is supported if paroxysmal fast activity reproducibly arises
      from a defined thalamocortical or brainstem node under non-REM sleep and
      not during matched wakefulness.
    would_support:
    - pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation

- discussion_id: gap_lgs_epileptic_encephalopathy_cognition_reversibility
  prompt: >-
    How much of the cognitive impairment in LGS is driven by ongoing seizures
    and interictal epileptiform activity (and therefore potentially modifiable
    by seizure control) versus fixed injury from the underlying etiology?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Interictal Epileptiform Activity-Driven Cognitive Impairment
  - pathophysiology#Cognitive Impairment and Developmental Plateau
  rationale: >-
    The developmental and epileptic encephalopathy concept holds that the
    epileptic activity itself contributes to cognitive decline beyond the
    underlying cause. If a substantial fraction of the cognitive burden is
    activity-driven, then earlier and more complete seizure control could
    improve developmental outcome; if it is fixed etiologic injury, cognitive
    prognosis would be largely independent of seizure control. Because LGS is
    typically drug-resistant, this fraction has been very hard to estimate, and
    it is a central open question with direct therapeutic stakes.
  proposed_experiments:
  - experiment_id: exp_lgs_seizure_control_cognition_coupling
    name: Coupling of seizure/EEG burden to cognitive trajectory in LGS
    description: >-
      In a prospective LGS cohort, relate quantitative interictal
      epileptiform burden and seizure frequency to longitudinal
      neurodevelopmental trajectory, and where an intervention achieves marked
      seizure reduction, test whether cognitive trajectory inflects
      independently of etiology.
    experiment_type:
      preferred_term: longitudinal cohort coupling experiment
    readouts:
    - name: Cognitive trajectory versus epileptiform burden
      target: pathophysiology#Cognitive Impairment and Developmental Plateau
      assays:
      - preferred_term: neuropsychological assessment
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Etiology-stratified comparison
      description: Stratify by etiology to separate activity-driven from fixed injury effects.
    decision_criterion: >-
      An activity-driven contribution is supported if reductions in epileptiform
      burden are followed by improvement or stabilization of cognitive
      trajectory within etiology strata; a fixed-injury interpretation is
      favored if trajectory tracks etiology regardless of seizure control.
    would_support:
    - pathophysiology#Interictal Epileptiform Activity-Driven Cognitive Impairment

- discussion_id: gap_lgs_animal_model_convergent_syndrome_fidelity
  prompt: >-
    Can any animal model reproduce the convergent LGS electroclinical syndrome
    (tonic seizures with generalized paroxysmal fast activity plus slow
    spike-and-wave), or do current single-gene models only capture one
    etiologic entry point into the syndrome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Diffuse Thalamocortical Network Dysfunction
  - pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
  rationale: >-
    Because LGS is a convergent syndrome rather than a single-gene disease, a
    faithful model would need to reproduce the shared network phenotype, not
    just one causative lesion. Existing models (for example GABRB3 knock-in
    mice) recapitulate a single genetic etiology and some seizure features, but
    whether they reproduce the defining tonic-seizure and paroxysmal
    fast-activity network signature of human LGS is uncertain. This is a
    translational-validity gap, distinct from an absence of evidence: model
    data exist, but their fidelity to the convergent human syndrome is the open
    question.
  evidence:
  - reference: PMID:23934111
    reference_title: "De novo mutations in epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GABRB3, with de novo mutations in four patients, and ALG13, with the same de novo mutation in two patients; both genes show clear statistical evidence of association with epileptic encephalopathy."
    explanation: >-
      Identifies GABRB3 as an LGS-associated gene whose mouse models test a
      single etiology; the mismatch question is whether such single-gene models
      reproduce the convergent LGS network phenotype.
  proposed_experiments:
  - experiment_id: exp_lgs_model_network_phenotype_fidelity
    name: Network-phenotype fidelity testing across LGS etiologic models
    description: >-
      Phenotype several distinct LGS etiologic models (a GABA-A receptor model,
      an mTOR/structural model, and a synaptic model) with the same
      sleep-EEG and network readouts used clinically, testing whether any
      reproduces tonic seizures with sleep-activated fast activity and slow
      spike-and-wave.
    experiment_type:
      preferred_term: cross-model network phenotyping experiment
    readouts:
    - name: Tonic seizure and fast-activity phenotype
      target: pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
      assays:
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Wild-type littermates
      description: Matched wild-type animals recorded under identical protocols.
    decision_criterion: >-
      Human fidelity for a model is supported if it reproduces the sleep-activated
      paroxysmal fast activity and tonic seizure signature; models that show only
      isolated seizures without the network signature are flagged as capturing an
      etiologic entry point rather than the LGS syndrome.
    would_support:
    - pathophysiology#Diffuse Thalamocortical Network Dysfunction

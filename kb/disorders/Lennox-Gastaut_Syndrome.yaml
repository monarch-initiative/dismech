    evidence_source: HUMAN_CLINICAL
    snippet: "The most prevalent seizure types at follow-up were atypical absences (28/38), tonic (28/38), generalized tonic-clonic (17/38), focal (11/38), and myoclonic seizures (9/38)."
    explanation: >-
      Generalized tonic-clonic seizures were present in 17 of 38 adults with LGS
      at follow-up.
- name: Nonconvulsive Status Epilepticus
  description: >-
    Episodes of nonconvulsive status epilepticus (often with tonic and atypical
    absence features) recur over the disease course and are strongly associated
    with severe intellectual disability.
  phenotype_term:
    preferred_term: Nonconvulsive status epilepticus
    term:
      id: HP:0002133
      label: Status epilepticus
  evidence:
  - reference: PMID:11071139
    reference_title: "Nonconvulsive status epilepticus--a possible cause of mental retardation in patients with Lennox-Gastaut syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four independent risk factors for severe mental retardation were identified by multivariate analysis. These were in a decreasing order of importance: nonconvulsive status epilepticus (NCSE), odds ratio (OR) 25.2"
    explanation: >-
      Multicentre study of 101 patients with LGS documents nonconvulsive status
      epilepticus in the cohort and identifies it as the strongest independent
      risk factor for severe intellectual disability.
- name: Global Developmental Delay
  description: >-
    Global developmental delay frequently precedes or accompanies seizure onset
    and evolves into intellectual disability.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:21790560
    reference_title: "Definition and natural history of Lennox-Gastaut syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive stagnation and behavioral problems are seen in almost all patients and lead to a life of dependency."
    explanation: >-
      Review reports developmental stagnation in almost all patients with LGS,
      the developmental-delay counterpart of the seizure phenotype.
  - reference: PMID:11071139
    reference_title: "Nonconvulsive status epilepticus--a possible cause of mental retardation in patients with Lennox-Gastaut syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the last follow-up, 38% of the patients could not speak, 21% were unable to walk and only 4% were free of seizures."
    explanation: >-
      Long-term follow-up of 101 patients quantifies the global developmental

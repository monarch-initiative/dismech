    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lennox-Gastaut syndrome (LGS) is considered an epileptic encephalopathy and is defined by a triad of multiple drug-resistant seizure types, a specific EEG pattern showing bursts of slow spike-wave complexes or generalized paroxysmal fast activity, and intellectual disability."
    explanation: >-
      Review states that LGS is classified as an epileptic encephalopathy, with
      the defining triad including abundant interictal epileptiform activity.

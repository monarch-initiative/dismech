genetic:
- name: Genetically heterogeneous developmental and epileptic encephalopathy genes
  notes: >-
    LGS has no single causative gene. A minority of cases carry pathogenic
    variants in developmental and epileptic encephalopathy genes (reported
    examples include SCN1A, SCN2A, SCN8A, STXBP1, CHD2, DNM1, GABRB3, FOXG1,
    ALG13, and others); many cases are structural or of unknown cause. Most
    cases are sporadic, and when monogenic the causative variants are typically
    de novo. Contributing genes are named here rather than asserting a single
    Mendelian locus.
  evidence:
  - reference: PMID:23934111
    reference_title: "De novo mutations in epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "de novo mutations in patients with two classical epileptic encephalopathies: infantile spasms (n = 149) and Lennox-Gastaut syndrome (n = 115)."
    explanation: >-
      The Epi4K trio-exome study established that a substantial fraction of LGS
      is caused by de novo variants, sequencing 115 LGS probands alongside
      infantile spasms cases.
  - reference: PMID:23934111
    reference_title: "De novo mutations in epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GABRB3, with de novo mutations in four patients, and ALG13, with the same de novo mutation in two patients; both genes show clear statistical evidence of association with epileptic encephalopathy."
    explanation: >-
      Identifies GABRB3 and ALG13 as genome-wide-significant developmental and
      epileptic encephalopathy genes in the IS/LGS cohort, illustrating the
      genetic heterogeneity of LGS.
treatments:
- name: Broad-Spectrum Antiseizure Medication
  description: >-
    First-line pharmacotherapy uses broad-spectrum antiseizure medications
    (e.g., valproate, lamotrigine); LGS seizures are typically drug-resistant and
    require combination therapy. Narrow-spectrum sodium-channel blockers
    (carbamazepine, oxcarbazepine, phenytoin) and vigabatrin can aggravate
    atypical absence and myoclonic seizures and are generally avoided.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: LGS-Indicated Adjunctive Antiseizure Agents
  description: >-
    Several agents are specifically approved as adjunctive therapy for
    LGS-associated seizures, including rufinamide, clobazam, felbamate,
    topiramate, cannabidiol, and fenfluramine.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cannabidiol
      term:
        id: CHEBI:69478
        label: cannabidiol
    - preferred_term: fenfluramine
      term:
        id: CHEBI:5000
        label: fenfluramine
    - preferred_term: rufinamide
      term:
        id: CHEBI:134966
        label: rufinamide
    - preferred_term: clobazam
      term:
        id: CHEBI:31413
        label: clobazam
  evidence:
  - reference: PMID:29768152
    reference_title: "Effect of Cannabidiol on Drop Seizures in the Lennox-Gastaut Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median percent reduction from baseline in drop-seizure frequency during the treatment period was 41.9% in the 20-mg cannabidiol group"
    explanation: >-
      Randomized placebo-controlled trial (GWPCARE3) demonstrating that add-on
      cannabidiol reduces drop-seizure frequency in LGS, supporting its role as
      an LGS-indicated adjunctive agent.
- name: Ketogenic Diet Therapy
  description: >-
    Ketogenic and modified Atkins diets are used for drug-resistant LGS seizures.
  treatment_term:
    preferred_term: ketogenic diet intake
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
- name: Corpus Callosotomy
  description: >-
    Palliative corpus callosotomy is used to reduce drop attacks (tonic/atonic
    seizures) refractory to medication.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
- name: Vagus Nerve Stimulation
  description: >-
    Vagus nerve stimulation is a palliative neuromodulation option for
    drug-resistant LGS.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure

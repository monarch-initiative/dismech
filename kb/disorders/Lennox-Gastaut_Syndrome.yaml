genetic:
- name: Genetically heterogeneous developmental and epileptic encephalopathy genes
  notes: >-
    LGS has no single causative gene. A minority of cases carry pathogenic
    variants in developmental and epileptic encephalopathy genes (reported
    examples include SCN1A, SCN2A, SCN8A, STXBP1, CHD2, DNM1, GABRB3, FOXG1,
    ALG13, and others); many cases are structural or of unknown cause. Most
    cases are sporadic, and when monogenic the causative variants are typically
    de novo. Contributing genes are named here rather than asserting a single
    Mendelian locus.
  evidence:
  - reference: PMID:23934111
    reference_title: "De novo mutations in epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "de novo mutations in patients with two classical epileptic encephalopathies: infantile spasms (n = 149) and Lennox-Gastaut syndrome (n = 115)."
    explanation: >-
      The Epi4K trio-exome study established that a substantial fraction of LGS
      is caused by de novo variants, sequencing 115 LGS probands alongside
      infantile spasms cases.
  - reference: PMID:23934111
    reference_title: "De novo mutations in epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GABRB3, with de novo mutations in four patients, and ALG13, with the same de novo mutation in two patients; both genes show clear statistical evidence of association with epileptic encephalopathy."
    explanation: >-
      Identifies GABRB3 and ALG13 as genome-wide-significant developmental and
      epileptic encephalopathy genes in the IS/LGS cohort, illustrating the
      genetic heterogeneity of LGS.
treatments:
- name: Broad-Spectrum Antiseizure Medication
  description: >-
    First-line pharmacotherapy uses broad-spectrum antiseizure medications
    (e.g., valproate, lamotrigine); LGS seizures are typically drug-resistant and
    require combination therapy. Narrow-spectrum sodium-channel blockers
    (carbamazepine, oxcarbazepine, phenytoin) and vigabatrin can aggravate
    atypical absence and myoclonic seizures and are generally avoided.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:37212330
    reference_title: Current and emerging pharmacotherapy for the treatment of Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Valproate continues to be considered the first-line treatment, despite the absence of RDBCTs specifically in LGS."
    explanation: >-
      Review of the LGS trial evidence places valproate first-line while making
      the strength of that recommendation explicit -- it rests on clinical
      practice rather than on a randomized double-blind trial in LGS.
  - reference: PMID:20158289
    reference_title: Medical management of Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Valproate, lamotrigine and topiramate were considered recently by expert panels in the US and Europe to be the first-line drugs."
    explanation: >-
      Independent expert-panel consensus on both continents names the same
      broad-spectrum agents as first-line, supporting the composition of this
      treatment.
  - reference: PMID:9593229
    reference_title: Antiepileptic drug-induced worsening of seizures in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An inappropriate choice of the AED (i.e., a purely pharmacodynamic mechanism) can induce worsening when CBZ or VGB is used in absence and myoclonic seizures."
    explanation: >-
      Supports the avoidance clause in this treatment's description:
      carbamazepine and vigabatrin aggravate exactly the atypical absence and
      myoclonic seizure types that form part of the LGS repertoire.
- name: LGS-Indicated Adjunctive Antiseizure Agents
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Several agents are specifically approved as adjunctive therapy for
    LGS-associated seizures, including rufinamide, clobazam, felbamate,
    topiramate, cannabidiol, and fenfluramine.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cannabidiol
      term:
        id: CHEBI:69478
        label: cannabidiol
    - preferred_term: fenfluramine
      term:
        id: CHEBI:5000
        label: fenfluramine
    - preferred_term: rufinamide
      term:
        id: CHEBI:134966
        label: rufinamide
    - preferred_term: clobazam
      term:
        id: CHEBI:31413
        label: clobazam
  evidence:
  - reference: PMID:29768152
    reference_title: "Effect of Cannabidiol on Drop Seizures in the Lennox-Gastaut Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median percent reduction from baseline in drop-seizure frequency during the treatment period was 41.9% in the 20-mg cannabidiol group"
    explanation: >-
      Randomized placebo-controlled trial (GWPCARE3) demonstrating that add-on
      cannabidiol reduces drop-seizure frequency in LGS, supporting its role as
      an LGS-indicated adjunctive agent.
  - reference: PMID:37212330
    reference_title: Current and emerging pharmacotherapy for the treatment of Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence from RDBCTs supports the use of cannabidiol, clobazam, felbamate, fenfluramine, lamotrigine, rufinamide, and topiramate as adjunct treatments for drop seizures."
    explanation: >-
      Names the adjunctive agents with randomized double-blind placebo-controlled
      trial support in LGS, which is the set this treatment entry lists.
  - reference: PMID:35499850
    reference_title: "Efficacy and Safety of Fenfluramine for the Treatment of Seizures Associated With Lennox-Gastaut Syndrome: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The trial met its primary efficacy end point: patients in the 0.7-mg/kg/d fenfluramine group achieved a -19.9 percentage points (95% CI, -31.0 to -8.7 percentage points; P = .001) estimated median difference in drop seizures from baseline vs placebo."
    explanation: >-
      Phase 3 randomized placebo-controlled trial in 263 patients establishing
      adjunctive fenfluramine as effective against drop seizures in LGS.
  - reference: PMID:37212330
    reference_title: Current and emerging pharmacotherapy for the treatment of Lennox-Gastaut syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Percentage decreases in drop seizure frequency ranged from 68.3% with high-dose clobazam to 14.8% with topiramate."
    explanation: >-
      Qualifies the entry: the LGS-indicated adjuncts differ several-fold in
      effect size, so listing them together should not be read as claiming
      equivalent efficacy.
- name: Ketogenic Diet Therapy
  description: >-
    Ketogenic and modified Atkins diets are used for drug-resistant LGS seizures.
  treatment_term:
    preferred_term: ketogenic diet intake
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:22443637
    reference_title: "Efficacy of the ketogenic diet in Lennox-Gastaut syndrome: a retrospective review of one institution's experience and summary of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "after 6 months, 36 (51%) achieved more than 50% seizure reduction, 16 (23%) experienced more than 90% seizure reduction, and 1 (1%) achieved seizure freedom."
    explanation: >-
      Largest single-institution LGS ketogenic-diet series (71 children) with an
      intent-to-treat analysis: about half responded, quantifying the benefit
      claimed for this treatment.
  - reference: PMID:22443637
    reference_title: "Efficacy of the ketogenic diet in Lennox-Gastaut syndrome: a retrospective review of one institution's experience and summary of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the literature, 88 of 189 (47%) children with LGS had more than 50% seizure reduction after 3 to 36 months of ketogenic diet treatment."
    explanation: >-
      Pooled literature figure reproduces the same response rate outside the
      reporting institution, so the estimate is not single-centre.
  - reference: PMID:25616450
    reference_title: Long-term prognosis of patients with Lennox--Gastaut syndrome in recent decades.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The KD was administered to 19 patients, five patients maintained a seizure free state during the KD but only one patient was able to maintain a seizure free state by continuing on a modified Atkins diet."
    explanation: >-
      Supports short-term efficacy while qualifying durability: seizure freedom
      achieved on the ketogenic diet was largely not maintained on a modified
      Atkins diet in long-term follow-up.
- name: Corpus Callosotomy
  description: >-
    Palliative corpus callosotomy is used to reduce drop attacks (tonic/atonic
    seizures) refractory to medication.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:37823366
    reference_title: "Added value of corpus callosotomy following vagus nerve stimulation in children with Lennox-Gastaut syndrome: A multicenter, multinational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, there was at least a 50% reduction in drop attacks and other seizures in 83% and 60%, respectively."
    explanation: >-
      In 127 children with LGS whose vagus nerve stimulation had failed,
      callosotomy halved drop attacks in 83%, supporting the palliative
      drop-attack indication this treatment states.
  - reference: PMID:37823366
    reference_title: "Added value of corpus callosotomy following vagus nerve stimulation in children with Lennox-Gastaut syndrome: A multicenter, multinational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Permanent morbidity occurred in 1.5%, with no mortality."
    explanation: >-
      Quantifies the surgical risk that makes this a viable palliative option in
      the same multinational series.
  - reference: PMID:40937826
    reference_title: "Epileptic drop attacks: More than just atonic seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies suggest that epileptic spasms are cortically or hemispherically generated seizures and that disconnecting the corpus callosum potentially interrupts bilaterally synchronous seizure activities, supporting the rationale for surgery in patients with epileptic drop attacks."
    explanation: >-
      States the mechanistic rationale linking callosal disconnection to the
      bilaterally synchronous discharge that produces drop attacks.
- name: Vagus Nerve Stimulation
  description: >-
    Vagus nerve stimulation is a palliative neuromodulation option for
    drug-resistant LGS.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: DEVICE
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median percent reduction from baseline in drop-seizure frequency during the treatment period was 41.9% in the 20-mg cannabidiol group"
    explanation: >-
      Randomized placebo-controlled trial (GWPCARE3) demonstrating that add-on
      cannabidiol reduces drop-seizure frequency in LGS, supporting its role as

- name: Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
  description: >-
    The second defining electrographic feature is sleep-activated generalized
    paroxysmal fast activity (GPFA), the correlate of tonic seizures, which are
    the most characteristic seizure type of LGS and predominate in non-REM
    sleep. This node captures the single concept of fast-activity/tonic seizure
    generation.
  role: central_effector
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:21790560
    reference_title: "Definition and natural history of Lennox-Gastaut syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients have tonic seizures during sleep that may be subtle, and nearly all have treatment-resistant, lifelong epilepsy."
    explanation: >-
      Establishes the sleep-activated, universally present tonic seizure as the
      near-defining seizure type of LGS, the clinical half of the
      fast-activity/tonic-seizure node.
  - reference: PMID:31227617
    reference_title: "The epileptic network of Lennox-Gastaut syndrome: Cortically driven and reproducible across age."
    supports: SUPPORT

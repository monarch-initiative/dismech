prevalence:
- population: Children younger than 16 years, Wellington region, New Zealand
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 13.2
  rate_low: 4.1
  rate_high: 41.9
  notes: >-
    Population-based cumulative incidence through age 16, ascertained from EEG
    records across a defined region and syndrome-classified on medical-record
    and EEG review. Recorded here as a lifetime measure because it counts
    children affected at any point up to age 16 rather than at a single time
    point; the confidence interval is wide because LGS is a small subgroup of
    the ascertained cohort.
  evidence:
  - reference: PMID:36581463
    reference_title: Epidemiology of Developmental and Epileptic Encephalopathy and of Intellectual Disability and Epilepsy in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lennox-Gastaut syndrome 13.2 (95% CI 4.1-41.9)"
    explanation: >-
      Reports the population-based cumulative incidence per 100,000 children for
      LGS specifically, alongside the other developmental and epileptic
      encephalopathy syndromes.
epidemiology:
- name: Share of childhood epilepsy
  description: >-
    LGS accounts for a small share of childhood epilepsy, but the published
    figures span an order of magnitude: 1% to 10% of all childhood epilepsies.
    The bounds here are that full reported range rather than any single study's
    estimate; 3% is a commonly cited point value inside it. Camfield attributes
    the spread to how widely prevalence rates vary between reports, and
    differing case definitions and ascertainment are the usual explanation
    rather than genuinely different populations. This is a proportion of
    children who already have epilepsy, not a population prevalence, and must
    not be compared with the rate under `prevalence`.
  minimum_value: 1.0
  maximum_value: 10.0
  unit: percent of childhood epilepsies
  evidence:
  - reference: PMID:20158289
    reference_title: Medical management of Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lennox-Gastaut syndrome occurs in 3% of children with epilepsy"
    explanation: >-
      Gives a commonly cited point estimate for the share of childhood epilepsy
      accounted for by LGS, sitting inside the wider reported range.
  - reference: PMID:21790560
    reference_title: Definition and natural history of Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reported prevalence rates for LGS vary widely from 1-10% of all childhood epilepsies. Incidence rates are much lower."
    explanation: >-
      Supplies both bounds recorded here, and separates this prevalence-style
      share from the much lower incidence.
- name: Share of all epilepsy
  description: >-
    Among patients with epilepsy of any age, LGS accounts for an estimated 1-2%.
    As above, the denominator is the epilepsy population rather than the general
    population.
  minimum_value: 1.0
  maximum_value: 2.0
  unit: percent of all patients with epilepsy
  evidence:
  - reference: PMID:29124439
    reference_title: "Lennox-Gastaut syndrome: a comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of LGS is estimated between 1 and 2% of all patients with epilepsy."
    explanation: >-
      Gives the share of the whole epilepsy population accounted for by LGS.
progression:
- phase: Onset
  age_range: 1-8 years, peak 3-5 years
  notes: >-
    LGS begins in early childhood, typically between ages 1 and 8 with a peak at
    3-5 years. In a subset the syndrome is preceded by infantile spasms.
  evidence:
  - reference: PMID:21790560
    reference_title: Definition and natural history of Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lennox-Gastaut syndrome (LGS) is a rare epileptic encephalopathy with a peak age of onset of 3-5 years of age."
    explanation: >-
      Establishes the peak age of onset for the syndrome.
  - reference: PMID:10368073
    reference_title: The descriptive epidemiology of infantile spasms among Atlanta children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty percent of children with IS developed Lennox-Gastaut syndrome (LGS) before age 11 years."
    explanation: >-
      Places the West-syndrome-to-LGS transition inside the childhood onset
      window for the subset of patients who arrive at LGS that way.
- phase: Established childhood epileptic encephalopathy
  age_range: Childhood to adolescence
  notes: >-
    Multiple seizure types coexist and are drug-resistant, and cognitive
    development stagnates or regresses. Recurrent nonconvulsive status
    epilepticus during this phase is the strongest independent predictor of
    severe intellectual disability.
  evidence:
  - reference: PMID:21790560
    reference_title: Definition and natural history of Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive stagnation and behavioral problems are seen in almost all patients and lead to a life of dependency."
    explanation: >-
      Describes the developmental course during the established phase.
  - reference: PMID:11071139
    reference_title: "Nonconvulsive status epilepticus--a possible cause of mental retardation in patients with Lennox-Gastaut syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four independent risk factors for severe mental retardation were identified by multivariate analysis. These were in a decreasing order of importance: nonconvulsive status epilepticus (NCSE), odds ratio (OR) 25.2"
    explanation: >-
      Identifies the event during this phase that carries the greatest
      independent risk of severe intellectual disability.
- phase: Adult persistence
  age_range: Adulthood
  notes: >-
    Seizures persist into adult life in most patients. Waking EEG may normalize
    while sleep-recorded fast rhythms and sleep tonic seizures persist, so a
    standard waking EEG can be misleading in adults. Seizure freedom is reached
    by a minority even with diet and surgical options.
  evidence:
  - reference: PMID:20149600
    reference_title: "Lennox-Gastaut syndrome in adulthood: clinical and EEG features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At last observation, 11 patients only had TS during wakefulness, but all still presented TS during sleep; AA persisted in 6 patients."
    explanation: >-
      Shows the adult evolution of the seizure repertoire: waking tonic seizures
      and atypical absences decline while sleep tonic seizures persist in all.
  - reference: PMID:20149600
    reference_title: "Lennox-Gastaut syndrome in adulthood: clinical and EEG features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adult LGS patients TS during sleep remain the major seizure type; moreover, a standard waking EEG may be normal."
    explanation: >-
      Records the diagnostic consequence of that evolution for adults.
  - reference: PMID:25616450
    reference_title: Long-term prognosis of patients with Lennox--Gastaut syndrome in recent decades.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 39.7% of patients had intact independent daily living skills, and 25.4% could not walk, even with support."
    explanation: >-
      Quantifies the adult functional outcome after a mean 19.3 years of
      follow-up.
pathophysiology:
- name: Heterogeneous Etiologic Brain Insult
  description: >-
    LGS is not caused by a single lesion. A structurally, genetically,
    metabolically, or acquired-injury-based insult to the developing brain
    (e.g., hypoxic-ischemic encephalopathy, cortical malformation, tuberous
    sclerosis, CNS infection, or a monogenic developmental and epileptic
    encephalopathy variant) supplies the upstream cause. This node captures the
    single concept of the initiating brain insult; its diverse specific causes
    converge downstream on a shared network disorder.
  role: trigger
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29124439
    reference_title: "Lennox-Gastaut syndrome: a comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The etiology of LGS is often divided into two groups: identifiable (genetic-structural-metabolic) in 65 to 75% of the patients and LGS of unknown cause in others."
    explanation: >-
      Quantifies the heterogeneous upstream cause: an identifiable structural,
      genetic, or metabolic insult is present in roughly two-thirds to
      three-quarters of patients, with the remainder of unknown cause.
  - reference: PMID:21275978
    reference_title: EEG-fMRI reveals activation of brainstem and thalamus in patients with Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Even if etiologies of Lennox-Gastaut syndrome (LGS) are diverse, the multiple causes converge into a final common pathway that results in this specific epilepsy phenotype."
    explanation: >-
      States the convergence premise this node encodes: diverse initiating
      insults funnel into one downstream pathway rather than each producing its
      own distinct phenotype.
  downstream:
  - target: Age-Dependent Evolution from Infantile Spasms
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In a subset of children the same insult first manifests as infantile
      spasms and later transitions to the LGS electroclinical pattern.
  - target: Diffuse Thalamocortical Network Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Regardless of specific cause, the insult produces a diffusely dysfunctional
      thalamocortical network that generates the LGS phenotype.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The initiating brain insult frequently produces developmental delay that
      precedes or accompanies seizure onset, separately from the later
      seizure-driven cognitive plateau.
- name: Age-Dependent Evolution from Infantile Spasms
  description: >-
    In a substantial subset of patients, LGS emerges from a prior
    diagnosis of infantile spasms (West syndrome) as the developing brain's
    epileptic expression shifts with maturation. This node captures the single
    concept of the age-dependent syndrome transition, a distinctive route into
    LGS separate from de novo presentation.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:10368073
    reference_title: The descriptive epidemiology of infantile spasms among Atlanta children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty percent of children with IS developed Lennox-Gastaut syndrome (LGS) before age 11 years."
    explanation: >-
      Population-based surveillance quantifies the West-syndrome-to-LGS
      transition from the infantile-spasms side: half of children with
      infantile spasms went on to develop LGS in childhood.
  - reference: PMID:11071139
    reference_title: "Nonconvulsive status epilepticus--a possible cause of mental retardation in patients with Lennox-Gastaut syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a previous diagnosis of West syndrome (OR 11.6), a symptomatic etiology of epilepsy (OR 9.5), and an early age at onset of epilepsy (OR 4.7)"
    explanation: >-
      Multicentre LGS cohort records prior West syndrome as a recognised route
      into LGS and an independent risk factor for severe intellectual
      disability, establishing the transition as a clinically distinct
      trajectory rather than an incidental association.
  downstream:
  - target: Diffuse Thalamocortical Network Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The maturational transition consolidates into the diffuse thalamocortical
      network dysfunction underlying LGS.
- name: Diffuse Thalamocortical Network Dysfunction
  description: >-
    LGS behaves as a secondary network ("secondary generalized") epilepsy in
    which widespread, bilaterally synchronous epileptic activity is generated by
    a diffusely dysfunctional thalamocortical network rather than by a single
    cortical focus. This node captures the single concept of the network-level
    substrate that unifies the heterogeneous etiologies.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:24902608
    reference_title: "Lennox-Gastaut syndrome and phenotype: secondary network epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We previously found common cerebral networks involved during slow spike-and-wave (SSW) and generalized paroxysmal fast activity (PFA), characteristic interictal discharges."
    explanation: >-
      Neuroimaging evidence that the characteristic LGS discharges engage a
      shared cerebral network across etiologies, supporting the secondary
      network model in which a diffusely dysfunctional network, not a single
      focus, generates the phenotype.
  - reference: PMID:21275978
    reference_title: EEG-fMRI reveals activation of brainstem and thalamus in patients with Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual and group analyses revealed significant activation of brainstem and thalamus (especially centromedian and anterior thalamus) associated with epileptiform discharges in patients with LGS."
    explanation: >-
      Simultaneous EEG-fMRI in 11 children with LGS localises the discharge-linked
      network to thalamus (centromedian and anterior nuclei) and brainstem,
      naming the subcortical half of the thalamocortical substrate; the pattern
      was absent in the multifocal-epilepsy control children.
  - reference: PMID:25400619
    reference_title: Conceptualizing lennox-gastaut syndrome as a secondary network epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Electroencephalography (EEG) shows characteristic generalized epileptic activity that is similar in those with lesional, genetic, or unknown causes, suggesting a common underlying mechanism.'
    explanation: >-
      Systematic review of LGS neuroimaging argues that the electrographic
      phenotype is etiology-independent, which is the observation that motivates
      modelling a shared network node downstream of heterogeneous causes.
  downstream:
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Network dysfunction expresses locally as a shift toward excitation over
      inhibition in cortical circuits.
- name: Cortical Excitation-Inhibition Imbalance
  description: >-
    Within the dysfunctional network, the balance between synaptic excitation
    and GABAergic inhibition is shifted toward excitation, lowering the threshold
    for hypersynchronous discharges. This node captures the single concept of
    the excitation-inhibition imbalance and conforms to the shared epilepsy
    final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  cell_types:
  - preferred_term: GABAergic interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: Regulation of GABAergic synaptic transmission
    term:
      id: GO:0032228
      label: regulation of synaptic transmission, GABAergic
    modifier: DECREASED
  evidence:
  - reference: PMID:26950270
    reference_title: Epileptic encephalopathy de novo GABRB mutations impair γ-aminobutyric acid type A receptor function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LGS-associated GABRB3(D120N, E180G, Y302C) mutations located at β+ subunit interfaces reduced whole cell currents by decreasing single channel open probability without loss of surface receptors."
    explanation: >-
      Patch-clamp characterisation of the de novo GABRB3 variants found in LGS
      probands shows they reduce GABA-A receptor current, giving a direct
      molecular instance of the loss of GABAergic inhibition this node asserts.
      The evidence covers the monogenic GABA-A subset of LGS and does not
      establish the same lesion in structural or unknown-cause cases.
  - reference: PMID:23934111
    reference_title: "De novo mutations in epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GABRB3, with de novo mutations in four patients, and ALG13, with the same de novo mutation in two patients; both genes show clear statistical evidence of association with epileptic encephalopathy."
    explanation: >-
      Identifies GABRB3, a GABA-A receptor subunit gene, as a genome-wide
      significant cause in the IS/LGS cohort, linking the inhibitory synapse to
      LGS at the genetic level.
  downstream:
  - target: Slow Spike-and-Wave Discharge Generation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The imbalance supports the corticothalamic oscillation seen as slow
      spike-and-wave activity.
  - target: Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The imbalance also enables the sleep-activated fast-activity discharges
      that underlie tonic seizures.
  - target: Myoclonic Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same lowered threshold for hypersynchronous discharge supports the
      myoclonic seizures that commonly accompany the defining LGS seizure types.
  - target: Generalized Tonic-Clonic Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Bilateral tonic-clonic seizures arise when hypersynchronous discharge
      propagates through the diffusely disinhibited network.
- name: Slow Spike-and-Wave Discharge Generation
  description: >-
    A defining electrographic feature of LGS is the diffuse slow (<2.5 Hz)
    spike-and-wave complex, reflecting pathological corticothalamic oscillation.
    This node captures the single concept of slow spike-and-wave generation, the
    substrate of atypical absence seizures.
  role: central_effector
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:20149600
    reference_title: "Lennox-Gastaut syndrome in adulthood: clinical and EEG features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EEG showed slow background activity in 21/27 patients, diffuse slow spike-wave discharges (DSSW) during wakefulness in 22/27, and bursts of diffuse fast rhythms (DFR) in sleep in all patients."
    explanation: >-
      Documents diffuse slow spike-wave as the waking interictal signature in
      22 of 27 patients, establishing the discharge this node generates as a
      near-constant feature rather than an occasional finding.
  - reference: PMID:24902608
    reference_title: "Lennox-Gastaut syndrome and phenotype: secondary network epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSW showed mixed increased and decreased fMRI activity, with preevent increases in association cortex and thalamus, and then prominent postevent reduction."
    explanation: >-
      Event-related EEG-fMRI shows that slow spike-and-wave discharges are
      preceded by coupled association-cortex and thalamic activation, the
      corticothalamic signature this node attributes to them.
  downstream:
  - target: Multiple Drug-Resistant Seizure Types
    causal_link_type: DIRECT
    description: >-
      Slow spike-and-wave discharges manifest clinically as atypical absence
      seizures within the LGS seizure repertoire.
  - target: Atypical Absence Seizures
    causal_link_type: DIRECT
    description: >-
      The diffuse slow (<2.5 Hz) spike-and-wave discharge is the electrographic
      correlate of the atypical absence seizures seen clinically.
  - target: Nonconvulsive Status Epilepticus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Prolonged, near-continuous slow spike-and-wave activity underlies the
      episodes of nonconvulsive (atypical absence) status epilepticus that
      recur over the disease course.
- name: Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
  description: >-
    The second defining electrographic feature is sleep-activated generalized
    paroxysmal fast activity (GPFA), the correlate of tonic seizures, which are
    the most characteristic seizure type of LGS and predominate in non-REM
    sleep. This node captures the single concept of fast-activity/tonic seizure
    generation.
  role: central_effector
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:25400619
    reference_title: Conceptualizing lennox-gastaut syndrome as a secondary network epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scalp EEG of the tonic seizures of LGS is characterized by a diffuse high-voltage slow transient evolving into generalized low-voltage fast activity, likely reflecting sustained fast neuronal firing over a wide cortical area."
    explanation: >-
      Ties the tonic seizure directly to its fast-activity electrographic
      correlate and interprets it as sustained firing across a wide cortical
      area, which is the generation mechanism this node names.
  - reference: PMID:20149600
    reference_title: "Lennox-Gastaut syndrome in adulthood: clinical and EEG features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the contrary, sleep EEG showed the persistence of DFR in all."
    explanation: >-
      Sleep-recorded diffuse fast rhythms persisted in all 27 adults even after
      waking slow spike-wave had resolved in most, supporting the non-REM
      sleep activation of the fast-activity discharge that this node asserts.
  - reference: PMID:24902608
    reference_title: "Lennox-Gastaut syndrome and phenotype: secondary network epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PFA-robust fMRI signal increases were observed in frontal and parietal association cortical areas, thalamus, and pons, with simultaneous increases in both \"attention\" and resting-state (default mode) networks, a highly unusual pattern."
    explanation: >-
      Maps the generalized paroxysmal fast activity of this node onto a specific
      cortical-thalamic-pontine network, distinguishing it from the slow
      spike-and-wave pattern recorded in the same patients.
  downstream:
  - target: Atonic Drop Attack Generation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Tonic and related discharges contribute to sudden tone changes producing
      drop attacks.
  - target: Multiple Drug-Resistant Seizure Types
    causal_link_type: DIRECT
    description: >-
      Fast-activity discharges manifest clinically as tonic seizures.
  - target: Tonic Seizures
    causal_link_type: DIRECT
    description: >-
      Sleep-activated generalized paroxysmal fast activity is the electrographic
      correlate of the tonic seizures that are the most characteristic seizure
      type of LGS.
- name: Atonic Drop Attack Generation
  description: >-
    Sudden loss (atonic) or brief increase (tonic) of postural tone produces
    drop attacks (astatic seizures), a major source of injury in LGS. This node
    captures the single concept of drop-attack generation, distinct from the
    tonic and absence seizure mechanisms above.
  role: effector
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:37823366
    reference_title: "Added value of corpus callosotomy following vagus nerve stimulation in children with Lennox-Gastaut syndrome: A multicenter, multinational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dominant seizure type was drop attacks (tonic or atonic) in 102 patients."
    explanation: >-
      In a multinational series of 127 children with LGS, drop attacks of either
      tonic or atonic type dominated the seizure burden, supporting both the
      prominence of this node and its dual tone-change mechanism.
  - reference: PMID:40937826
    reference_title: "Epileptic drop attacks: More than just atonic seizures."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "drop attacks are rarely pure atonic seizures but are often epileptic spasms or other types of seizures with increased muscle tone"
    explanation: >-
      Video-EEG-electromyography evidence supports the increased-tone half of
      this node's mechanism but qualifies its atonic framing: pure atonic falls
      are the exception, and epileptic spasms account for many drop attacks, so
      the node's name should not be read as a claim that the mechanism is
      predominantly atonic.
  downstream:
  - target: Multiple Drug-Resistant Seizure Types
    causal_link_type: DIRECT
    description: >-
      Drop attacks are one of the multiple drug-resistant seizure types
      comprising the syndrome.
  - target: Atonic Seizures (Drop Attacks)
    causal_link_type: DIRECT
    description: >-
      Sudden loss of postural tone produces the atonic (astatic) drop attacks
      observed clinically, a major source of falls and injury.
- name: Interictal Epileptiform Activity-Driven Cognitive Impairment
  description: >-
    LGS is a developmental and epileptic encephalopathy: beyond any cognitive
    effect of the underlying cause, the frequent seizures and near-continuous
    interictal epileptiform activity are themselves thought to impair cognitive
    development and drive stagnation or regression. This node captures the single
    concept of the epileptic-encephalopathy contribution to cognition.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:26945476
    reference_title: "Abnormal cognitive network interactions in Lennox-Gastaut syndrome: A potential mechanism of epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal interactions were present during fMRI periods with and without discharges, indicating that impaired network behavior may endure during periods without scalp-detectable epileptic activity."
    explanation: >-
      Task-free EEG-fMRI in 15 patients versus 17 controls shows the cognitive
      networks recruited by LGS discharges are persistently disorganised between
      discharges, the mechanism by which epileptiform activity could impair
      cognition beyond the ictal event itself.
  - reference: PMID:28295228
    reference_title: Cognitive network reorganization following surgical control of seizures in Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case illustrates that the epileptic process of LGS can directly contribute to abnormal network organization, and that this network disruption may be reversible."
    explanation: >-
      Pre/post-surgical fMRI in a child whose seizures remitted after resection
      provides the directional evidence this node needs -- removing the epileptic
      activity reorganised the cognitive networks -- though as a single case it
      does not quantify how much of the cognitive burden is activity-driven.
  downstream:
  - target: Cognitive Impairment and Developmental Plateau
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ongoing epileptiform activity contributes to the cognitive plateau and
      regression characteristic of the syndrome.
  - target: Epileptic Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Frequent seizures together with abundant interictal epileptiform activity
      constitute the epileptic encephalopathy itself, the clinical designation
      of this mechanism.
- name: Multiple Drug-Resistant Seizure Types
  description: >-
    The clinical hallmark of LGS is the co-occurrence of several seizure types
    in one child, characteristically tonic, atonic, and atypical absence
    seizures, that are typically resistant to antiseizure medications. This node
    captures the single concept of the multiple-drug-resistant-seizure endpoint
    and conforms to the shared epilepsy final common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:37212330
    reference_title: Current and emerging pharmacotherapy for the treatment of Lennox-Gastaut syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals with LGS will require treatment with multiple ASMs."
    explanation: >-
      Review of randomized double-blind placebo-controlled trials in LGS
      concludes that polypharmacy is the norm, the practical expression of the
      drug resistance this endpoint node asserts.
  - reference: PMID:25616450
    reference_title: Long-term prognosis of patients with Lennox--Gastaut syndrome in recent decades.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For a mean follow-up duration of 19.3 years (range 8.3-32.5 years), finally sixteen patients (23.5%) were seizure-free."
    explanation: >-
      Quantifies the drug-resistant endpoint: even with ketogenic diet and
      epilepsy surgery available, fewer than a quarter of 68 patients reached
      seizure freedom over a mean of 19 years.
  - reference: PMID:29126048
    reference_title: "Lennox-Gastaut syndrome in adulthood: Long-term clinical follow-up of 38 patients and analysis of their recorded seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of our patients had 3 or more seizure types during their clinical history."
    explanation: >-
      Confirms the multiplicity half of this node's claim: every one of 38
      adults with LGS had at least three distinct seizure types over the disease
      course.
- name: Cognitive Impairment and Developmental Plateau
  description: >-
    Most children with LGS develop intellectual disability with developmental
    plateau or regression and frequent behavioural problems. This node captures
    the single concept of the cognitive/developmental outcome, the endpoint of
    both the underlying etiology and the epileptic encephalopathy.
  role: consequence
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:25616450
    reference_title: Long-term prognosis of patients with Lennox--Gastaut syndrome in recent decades.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In cognitive terms, 94.7% of patients exhibited moderate to profound mental retardation."
    explanation: >-
      In 68 adults followed a mean of 19.3 years, almost all had moderate to
      profound intellectual disability, quantifying the cognitive endpoint of
      this node.
  - reference: PMID:20149600
    reference_title: "Lennox-Gastaut syndrome in adulthood: clinical and EEG features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A moderate to severe cognitive impairment was observed in 26/27 patients."
    explanation: >-
      Independent adult LGS cohort reproduces the near-universal cognitive
      outcome, in patients aged 40-59 years and therefore decades after onset.
  downstream:
  - target: Intellectual Disability
    causal_link_type: DIRECT
    description: >-
      The developmental plateau or regression is expressed clinically as
      intellectual disability in most affected children.
  - target: Behavioral Abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hyperactivity, aggression, and autistic features accompany the cognitive
      outcome and add to the disability burden.
phenotypes:
- name: Tonic Seizures
  description: >-
    Tonic seizures, often nocturnal and sleep-activated, are the most
    characteristic seizure type of LGS.
  phenotype_term:
    preferred_term: Generalized tonic seizure
    term:
      id: HP:0010818
      label: Generalized tonic seizure
  evidence:
  - reference: PMID:21790560
    reference_title: "Definition and natural history of Lennox-Gastaut syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients have tonic seizures during sleep that may be subtle"
    explanation: >-
      Review of the definition and natural history of LGS states that tonic
      seizures, characteristically sleep-activated, occur in all patients.
  - reference: PMID:29126048
    reference_title: "Lennox-Gastaut syndrome in adulthood: Long-term clinical follow-up of 38 patients and analysis of their recorded seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prevalent seizure types at follow-up were atypical absences (28/38), tonic (28/38), generalized tonic-clonic (17/38), focal (11/38), and myoclonic seizures (9/38)."
    explanation: >-
      Long-term follow-up of 38 adults with LGS found tonic seizures among the
      two most prevalent seizure types.
- name: Atonic Seizures (Drop Attacks)
  description: >-
    Atonic (astatic) seizures cause sudden loss of postural tone and drop
    attacks with frequent falls and injuries.
  phenotype_term:
    preferred_term: Atonic seizure
    term:
      id: HP:0010819
      label: Atonic seizure
  evidence:
  - reference: PMID:29768152
    reference_title: "Effect of Cannabidiol on Drop Seizures in the Lennox-Gastaut Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the 28-day baseline period, the median number of drop seizures was 85 in all trial groups combined."
    explanation: >-
      In a 225-patient LGS trial cohort, drop seizures were frequent enough at
      baseline to serve as the primary endpoint, with a median of 85 per 28 days.
  - reference: PMID:29124439
    reference_title: "Lennox-Gastaut syndrome: a comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduction in frequency of the most incapacitating seizures (e.g., drop attacks and tonic-clonic seizures) should be the major objective."
    explanation: >-
      Clinical review identifies drop attacks as one of the most incapacitating
      seizure types encountered in LGS.
- name: Atypical Absence Seizures
  description: >-

  - reference: PMID:39854828
    reference_title: "Antiseizure medications for Lennox-Gastaut Syndrome: Comprehensive review and proposed consensus treatment algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, eight anti-seizure medications (ASMs) have been specifically approved by the U.S. Food and Drug Administration (FDA) for the treatment of LGS: clonazepam, felbamate, lamotrigine, topiramate, rufinamide, clobazam, cannabidiol, and fenfluramine."
    explanation: >-
      Enumerates the FDA-approved LGS-specific adjunctive agents, substantiating
      the list in this treatment's description and adding clonazepam and
      lamotrigine to it.
- name: Ketogenic Diet Therapy
  description: >-
    Ketogenic and modified Atkins diets are used for drug-resistant LGS seizures.
  treatment_term:
    preferred_term: ketogenic diet intake
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  evidence:
  - reference: PMID:33871716
    reference_title: "Efficacy and safety of corpus callosotomy and ketogenic diet in children with Lennox Gastaut syndrome: a systematic review and meta-analysis."
    supports: SUPPORT

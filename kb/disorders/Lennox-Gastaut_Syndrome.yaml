    snippet: "Tonic seizures (74.5 %) were most frequent followed by atypical absences (44.3 %), myoclonic (39.2 %), generalized (38.5 %), atonic (34.8 %), epileptic spasm (15.9 %), focal (11.4 %) and non-convulsive status epilepticus (7.0 %)."
    explanation: >-
      Pooled systematic review of 1167 patients showing tonic seizures are the

name: Lennox-Gastaut Syndrome
creation_date: "2026-07-17T00:00:00Z"
category: Complex
description: >-
  Lennox-Gastaut syndrome (LGS) is a severe childhood-onset developmental and
  epileptic encephalopathy defined by a triad of multiple drug-resistant seizure
  types (notably tonic seizures, atonic/drop attacks, and atypical absences), a
  characteristic interictal EEG showing diffuse slow (<2.5 Hz) spike-and-wave
  complexes together with sleep-activated generalized paroxysmal fast activity,
  and cognitive impairment with behavioural problems. Onset is typically between
  ages 1 and 8 years (peak 3-5). LGS is etiologically heterogeneous: roughly
  two-thirds of cases are symptomatic of an identifiable structural, genetic,
  metabolic, or acquired brain insult, a substantial subset evolves from
  infantile spasms (West syndrome), and the remainder are of unknown cause. It
  is best understood as a shared, age-dependent electroclinical final common
  pathway of diffuse thalamocortical network dysfunction rather than a single
  disease with a single mechanism.
parents:
- Epilepsy
- Neurodevelopmental Disorder
- Neurological Disease
synonyms:
- LGS
- Lennox syndrome
- Epileptic encephalopathy with diffuse slow spike-and-wave

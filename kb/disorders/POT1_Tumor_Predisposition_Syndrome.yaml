name: POT1 Tumor Predisposition Syndrome
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Telomere Biology Disorder
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: POT1 tumor predisposition
  term:
    id: MONDO:0014368
    label: tumor predisposition syndrome 3
synonyms:
- POT1-TPD
- POT1-related tumor predisposition syndrome
- POT1 tumor predisposition
- tumor predisposition syndrome 3
- melanoma, cutaneous malignant, susceptibility to, 10
- glioma susceptibility type 9
description: >-
  POT1 tumor predisposition is an autosomal dominant cancer predisposition syndrome
  caused by heterozygous germline loss of function variants in POT1, the
  single stranded DNA binding component of the shelterin complex that caps the
  telomeric 3' overhang. The characteristic tumor spectrum is cutaneous melanoma,
  often multiple, together with angiosarcoma (notably cardiac angiosarcoma), glioma,
  and chronic lymphocytic leukemia.
  Two things make this entry unusual among the hereditary cancer syndromes. The
  first is the direction of the telomere defect. Most inherited telomere biology
  disorders are short telomere syndromes; here the loss of POT1 removes a brake on
  telomerase access to the overhang, so telomeres become abnormally long. POT1-TPD
  is the long telomere counterpart of dyskeratosis congenita, and the marrow failure
  and pulmonary fibrosis of the short telomere disorders are absent.
  The second is that it is defined against a negative. The syndrome was found by
  sequencing TP53-negative Li-Fraumeni-like families, and it remains the diagnosis
  to consider when a Li-Fraumeni-like pedigree, especially one containing
  angiosarcoma, has no TP53 variant. Penetrance is not established, and most
  associated cancers present in adulthood, which is why predictive testing is not
  routinely offered in childhood.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most probands have an affected parent. The de novo proportion is unknown, and
    because the full phenotypic spectrum and penetrance are not established, the
    manifestations in a heterozygous relative cannot be predicted.
  evidence:
  - reference: PMID:33119245
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POT1-TPD is inherited in an autosomal dominant manner. To date, most individuals diagnosed with POT1-TPD have an affected parent; the proportion of individuals with POT1-TPD caused by a de novo pathogenic variant is unknown."
    explanation: GeneReviews statement of inheritance and the unknown de novo fraction.
  - reference: PMID:33119245
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations of POT1-TPD cannot be predicted in heterozygous family members because the full phenotypic spectrum and penetrance of POT1-TPD are unknown."
    explanation: >-
      Records the penetrance uncertainty explicitly, so the entry does not imply a
      quantified risk that has not been established.
pathophysiology:
- name: POT1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous germline variants throughout the POT1 reading frame, most commonly
    missense and nonsense changes. They act either by disrupting the
    oligonucleotide binding folds that contact the single stranded telomeric
    overhang, or by disrupting the interface between POT1 and its shelterin partner
    ACD/TPP1.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline missense, nonsense, frameshift, and splice site variants
      distributed across the POT1 reading frame, converging on loss of telomeric
      single stranded DNA binding or loss of the POT1 to ACD interaction.
  molecular_functions:
  - preferred_term: single-stranded telomeric DNA binding
    term:
      id: GO:0043047
      label: single-stranded telomeric DNA binding
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Defective Shelterin Capping of the Telomeric Overhang
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27528712
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The p.Tyr36Cys mutation is predicted to disrupt the interaction between POT1 and the telomeric overhang."
      explanation: >-
        Connects a specific germline allele to loss of the POT1 to overhang interaction,
        which is the step this edge asserts.
  evidence:
  - reference: PMID:33934394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These cancer-associated POT1 (caPOT1) mutations are generally heterozygous, missense, or nonsense mutations occurring throughout the POT1 reading frame."
    explanation: Characterizes the germline allele classes and their distribution across the gene.
  - reference: PMID:27528712
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome sequencing of 66 CLL families, identifying 4 families where loss-of-function mutations in protection of telomeres 1 (POT1) co-segregated with CLL."
    explanation: Establishes cosegregation of POT1 loss-of-function alleles with familial disease.
- name: Defective Shelterin Capping of the Telomeric Overhang
  biological_scale: MOLECULAR
  description: >-
    Less POT1 is bound at the telomere, so the single stranded 3' overhang is
    incompletely capped by shelterin. Carriers show reduced telomere bound POT1
    directly, not merely a predicted structural defect.
  biological_processes:
  - preferred_term: telomere capping
    term:
      id: GO:0016233
      label: telomere capping
    modifier: DECREASED
  downstream:
  - target: Unrestrained Telomerase Access and Telomere Elongation
    causal_link_type: DIRECT
  - target: Telomere Fragility and Genomic Instability
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26403419
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional and in vitro studies demonstrate that carriers of the mutation show reduced telomere-bound POT1 levels, abnormally long telomeres and increased telomere fragility."
    explanation: >-
      Measures reduced telomere-bound POT1 in human carriers, establishing the capping
      defect rather than inferring it from structure alone.
- name: Unrestrained Telomerase Access and Telomere Elongation
  biological_scale: CELLULAR
  description: >-
    POT1 normally limits telomerase access to the 3' overhang. Losing that restraint
    lets telomerase extend the telomere, so POT1-TPD telomeres are abnormally long.
    This is the mechanistic inversion that separates this syndrome from the short
    telomere biology disorders.
  biological_processes:
  - preferred_term: negative regulation of telomere maintenance via telomerase
    term:
      id: GO:0032211
      label: negative regulation of telomere maintenance via telomerase
    modifier: DECREASED
  downstream:
  - target: Extended Replicative Capacity of Incipient Cancer Cells
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33934394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, hESC lines with caPOT1 mutations showed no detectable telomere damage response while showing consistent telomere elongation."
    explanation: >-
      Engineered human stem cell lines show consistent elongation, isolating elongation as
      a direct and reproducible consequence of the POT1 lesion.
  - reference: PMID:38839987
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some POT1 gene pathogenic variants (PV) lead to telomere elongation, genomic instability and higher risk of cancer."
    explanation: States the elongation phenotype and its link to cancer risk in the clinical literature.
- name: Telomere Fragility and Genomic Instability
  biological_scale: CELLULAR
  description: >-
    An uncapped overhang also leaves the telomere structurally fragile, and tumors
    carrying POT1 variants show increased genomic instability. Whether this or the
    elongation is what actually drives tumorigenesis is not settled; see the
    discussion recorded on this entry.
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Extended Replicative Capacity of Incipient Cancer Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26403419
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional and in vitro studies demonstrate that carriers of the mutation show reduced telomere-bound POT1 levels, abnormally long telomeres and increased telomere fragility."
    explanation: Documents increased telomere fragility alongside the elongation in human carriers.
  - reference: PMID:33934394
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "HSCs with caPOT1 mutations did not show overt telomere damage."
    explanation: >-
      Argues against a damage-driven mechanism in the relevant stem cell compartment,
      which is why this node is marked provisional rather than established.
- name: Extended Replicative Capacity of Incipient Cancer Cells
  biological_scale: CELLULAR
  description: >-
    Longer telomeres postpone replicative senescence, so a cell that has acquired an
    initiating oncogenic lesion can keep dividing and accumulate further hits. This
    is the currently favoured account of why POT1 variants are selected for during
    cancer progression.
  biological_processes:
  - preferred_term: telomere maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: INCREASED
  downstream:
  - target: Cutaneous Melanoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Angiosarcoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Glioma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Chronic Lymphatic Leukemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thyroid Carcinoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Part of the expanding rather than the established spectrum; the edge is drawn
      because the same telomere mechanism is the only one proposed for it.
  evidence:
  - reference: PMID:33934394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, caPOT1 mutations are likely selected for during cancer progression because of their ability to elongate telomeres and extend the proliferative capacity of the incipient cancer cells."
    explanation: >-
      The authors' conclusion naming extended proliferative capacity as the selected
      advantage, quoted with its "likely" hedge intact.
phenotypes:
- category: Neoplastic
  name: Cutaneous Melanoma
  description: >-
    Often multiple primary melanomas. Onset spans a wide age range, from the second
    decade onward.
  phenotype_term:
    preferred_term: Cutaneous melanoma
    term:
      id: HP:0012056
      label: Cutaneous melanoma
  frequency: FREQUENT
  evidence:
  - reference: PMID:33119245
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POT1 tumor predisposition (POT1-TPD) is characterized by an increased lifetime risk for multiple cutaneous melanomas, sarcomas (particularly cardiac angiosarcomas), chronic lymphocytic leukemia (CLL), and gliomas."
    explanation: GeneReviews statement of the core tumor spectrum.
  - reference: PMID:33119245
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age of onset for first primary cutaneous melanoma ranges from 15 to 80 years."
    explanation: Gives the observed age range, which is what the surveillance start age is set against.
- category: Neoplastic
  name: Angiosarcoma
  description: >-
    Cardiac angiosarcoma is the characteristic sarcoma, and was the phenotype through
    which the syndrome was originally identified in TP53-negative Li-Fraumeni-like
    families.
  phenotype_term:
    preferred_term: Angiosarcoma
    term:
      id: HP:0200058
      label: Angiosarcoma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:26403419
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show, by whole-exome sequencing of a TP53-negative Li-Fraumeni-like (LFL) family including CAS cases, that a missense variant (p.R117C) in POT1 (protection of telomeres 1) gene is responsible for CAS."
    explanation: The gene-disease discovery study, linking POT1 to cardiac angiosarcoma.
  - reference: PMID:26403419
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same gene alteration is found in two other LFL families with CAS, supporting the causal effect of the identified mutation."
    explanation: Independent family replication supporting causality rather than a single-family finding.
- category: Neoplastic
  name: Glioma
  phenotype_term:
    preferred_term: Glioma
    term:
      id: HP:0009733
      label: Glioma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38839987
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is associated with increased risk of cutaneous melanoma, chronic lymphocytic leukaemia, angiosarcoma and gliomas."
    explanation: Names glioma among the established POT1-TPD tumor types.
- category: Neoplastic
  name: Chronic Lymphatic Leukemia
  phenotype_term:
    preferred_term: Chronic lymphatic leukemia
    term:
      id: HP:0005550
      label: Chronic lymphatic leukemia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:27528712
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a complementary analysis of 1083 cases and 5854 controls, the POT1 p.Gln376Arg variant, which has a global minor allele frequency of 0.0005, conferred a 3.61-fold increased risk of CLL (P = .009)."
    explanation: Quantifies the CLL risk conferred by a specific POT1 allele in a case-control analysis.
- category: Neoplastic
  name: Thyroid Carcinoma
  description: >-
    Reported in the broader phenotype described by extended-pedigree studies, as
    papillary thyroid cancer. Part of the expanding rather than the established
    spectrum.
  phenotype_term:
    preferred_term: Thyroid carcinoma
    term:
      id: HP:0002890
      label: Thyroid carcinoma
  frequency: VERY_RARE
  evidence:
  - reference: PMID:38839987
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POT1-TPD was observed, but also a higher incidence of other cancers (other sarcomas, papillary thyroid cancer, early onset prostate cancer and leukaemia)."
    explanation: >-
      Reports the additional malignancies seen in three extended pedigrees, which is the
      basis for treating thyroid cancer as an emerging rather than established association.
genetic:
- name: POT1
  gene_term:
    preferred_term: POT1
    term:
      id: hgnc:17284
      label: POT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous germline loss of function variants in POT1 cause POT1 tumor
    predisposition syndrome.
  notes: >-
    Reported alleles include missense (p.Arg117Cys, p.Tyr36Cys, p.Gln376Arg),
    nonsense, frameshift (p.Gln358SerfsTer13) and splice site (c.1164-1G>A) changes,
    distributed across the reading frame. They fall into two mechanistic classes:
    those that disrupt POT1 binding to the single stranded telomeric overhang, and
    those that disrupt the POT1 to ACD/TPP1 interface within shelterin. Germline
    variants in other shelterin components, ACD and TERF2IP, have been found in
    comparable families, so a POT1-negative pedigree of this shape is not
    necessarily shelterin-negative.
  evidence:
  - reference: PMID:27528712
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.1164-1G>A splice-site, p.Gln358SerfsTer13 frameshift, and p.Gln376Arg missense mutations are likely to impact the interaction between POT1 and adrenocortical dysplasia homolog (ACD), which is a part of the telomere-capping shelterin complex."
    explanation: Defines the second mechanistic class of alleles, those acting through the ACD interface.
  - reference: PMID:27528712
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified mutations in ACD (c.752-2A>C) and another shelterin component, telomeric repeat binding factor 2, interacting protein (p.Ala104Pro and p.Arg133Gln), in 3 CLL families."
    explanation: >-
      Supports the note that other shelterin genes produce comparable familial disease,
      which matters when POT1 sequencing is negative.
  - reference: PMID:26403419
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation is recently found once in 121,324 studied alleles in ExAC server but it is not described in any other database or found in 1,520 Spanish controls."
    explanation: Establishes the rarity of the discovery allele in population and control datasets.
treatments:
- name: Melanoma Surveillance
  description: >-
    Full skin examination by a dermatologist from age 18 years at least six monthly,
    with excision of suspicious lesions, intensified to three monthly for those with
    multiple atypical nevi or a melanoma history. Monthly self examination is
    encouraged alongside it.
  treatment_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Cutaneous Melanoma
  evidence:
  - reference: PMID:33119245
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Full skin examination by a dermatologist beginning at age 18 years at least every six months with excision of any lesions suspicious for melanoma"
    explanation: The GeneReviews dermatologic surveillance recommendation.
- name: Whole-Body MRI and Hematologic Surveillance
  description: >-
    Annual whole body MRI from age 18 years for non-cutaneous, non-brain
    malignancies, annual complete blood count with differential to screen for chronic
    lymphocytic leukemia, and brain MRI every one to two years depending on the
    family history of glioma.
  treatment_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Chronic Lymphatic Leukemia
  - target: Angiosarcoma
  - target: Glioma
  evidence:
  - reference: PMID:33119245
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual whole-body MRI beginning at age 18 years, or earlier depending on personal and family history of non-cutaneous, non-brain malignancies."
    explanation: The GeneReviews whole-body imaging recommendation and its age trigger.
  - reference: PMID:33119245
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual complete blood count with differential beginning at age 18 years to screen for CLL."
    explanation: The GeneReviews hematologic surveillance recommendation.
- name: Avoidance of Ultraviolet and Ionizing Radiation Exposure
  description: >-
    Tanning beds and unprotected sun exposure are to be avoided, as is radiation in
    diagnostic procedures. The radiation caution is why the imaging surveillance
    above is built on MRI rather than CT.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Cutaneous Melanoma
  evidence:
  - reference: PMID:33119245
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Tanning bed use and unprotected sun exposure; radiation in diagnostic procedures."
    explanation: The GeneReviews agents and circumstances to avoid statement.
differential_diagnoses:
- name: Li-Fraumeni syndrome
  disease_term:
    preferred_term: Li-Fraumeni syndrome
    term:
      id: MONDO:0018875
      label: Li-Fraumeni syndrome
  description: >-
    The clinical starting point for most POT1-TPD diagnoses. POT1-TPD was identified
    by sequencing TP53-negative Li-Fraumeni-like families, and it remains the
    syndrome to consider when such a pedigree, particularly one containing
    angiosarcoma, has no TP53 variant.
  distinguishing_features:
  - A TP53 pathogenic variant establishes Li-Fraumeni syndrome; POT1 tumor predisposition is found in TP53-negative Li-Fraumeni-like pedigrees.
  - Cardiac angiosarcoma with multiple cutaneous melanomas favors POT1 tumor predisposition.
  - Childhood adrenocortical carcinoma, choroid plexus carcinoma, and early osteosarcoma favor Li-Fraumeni syndrome; POT1-associated cancers are predominantly adult onset.
  evidence:
  - reference: PMID:26403419
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We extend the analysis to TP53-negative LFL families with no CAS and find the same mutation in a breast AS family."
    explanation: >-
      Documents the TP53-negative Li-Fraumeni-like ascertainment route through which this
      syndrome is found.
- name: Dyskeratosis congenita
  disease_term:
    preferred_term: dyskeratosis congenita
    term:
      id: MONDO:0015780
      label: dyskeratosis congenita
  description: >-
    The mechanistic mirror image. Dyskeratosis congenita is a short telomere
    syndrome presenting with bone marrow failure, mucocutaneous findings, and
    pulmonary fibrosis; POT1 tumor predisposition is a long telomere syndrome
    presenting with solid tumors and leukemia, without the marrow failure phenotype.
  distinguishing_features:
  - Short telomeres with bone marrow failure and pulmonary fibrosis favor dyskeratosis congenita.
  - Abnormally long telomeres with melanoma, angiosarcoma, glioma, or chronic lymphocytic leukemia favor POT1 tumor predisposition.
  evidence:
  - reference: PMID:38839987
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protection of Telomeres Protein 1 (POT1) protein is an essential subunit of the shelterin telomere binding complex, regulating telomere length."
    explanation: >-
      Places POT1 in the shelterin complex shared with the telomere biology disorders,
      which is what makes this a mechanistic differential rather than a clinical one.
discussions:
- discussion_id: pot1_elongation_versus_instability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is tumorigenesis in POT1 tumor predisposition driven by telomere elongation
    extending replicative capacity, or by the genomic instability that follows an
    uncapped telomere?
  attaches_to:
  - pathophysiology#Telomere Fragility and Genomic Instability
  - pathophysiology#Unrestrained Telomerase Access and Telomere Elongation
  rationale: >-
    Both phenotypes are observed in POT1 variant carriers, and the literature has not
    resolved which one is causal. Human carrier studies report abnormally long
    telomeres together with increased telomere fragility, while CRISPR engineered
    human embryonic and hematopoietic stem cells carrying the same class of variant
    show consistent elongation with no detectable telomere damage response. The
    engineered stem cell result favours elongation as the selected property and is why
    the instability node on this entry is marked provisional, but it is a stem cell
    model rather than a tumor, so it does not close the question. The distinction
    matters practically: an instability driven mechanism would predict sensitivity to
    DNA damaging therapy that an elongation driven mechanism would not.
  evidence:
  - reference: PMID:33934394
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cancers with caPOT1 mutations have elongated telomeres and show increased genomic instability, but which of the two phenotypes promotes tumorigenesis is unclear."
    explanation: >-
      The authors state the open question directly, which is what this discussion
      records rather than resolving.
references:
- reference: PMID:33119245
  title: POT1 Tumor Predisposition
  tags:

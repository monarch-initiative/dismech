- name: Defective Odontogenesis
  description: >-
    Tooth development fails in the dental lamina, giving severe agenesis and
    abnormal crown form. This is deliberately not filed as a fusion failure:
    the lip, palate and eyelid phenotypes are failures of two epithelial
    sheets meeting, where tooth agenesis is a failure of the dental lamina to
    initiate and shape a tooth germ. What the two have in common is the
    reduced cadherin adhesion upstream, not the morphogenetic event.

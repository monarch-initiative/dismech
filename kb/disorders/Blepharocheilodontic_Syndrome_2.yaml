  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified five CDH1 heterozygous missense mutations and three CTNND1 heterozygous truncating mutations leading to loss-of-function or haploinsufficiency."
    explanation: >-
      First report of CTNND1 variants in this syndrome, and the statement that
      they act by loss of function or haploinsufficiency.
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Mutations in CTNND1 have never been reported before. The encoded protein, p120ctn, prevents E-cadherin endocytosis and stabilizes its localization at the cell surface."
    explanation: The protein's function, which is what the truncating alleles remove.
  - reference: PMID:32196547
    reference_title: "Novel truncating mutations in CTNND1 cause a dominant craniofacial and cardiac syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify eight novel protein-truncating variants, six de novo, in 13 participants from nine families presenting with craniofacial dysmorphisms including cleft palate and hypodontia, as well as congenital cardiac anomalies, limb dysmorphologies and neurodevelopmental disorders"
    explanation: The largest cohort, its allele class, and the wider phenotype it established.
  variants:
  - name: c.83delG (p.Ala29Argfs*55)
    description: >-
      A frameshift deletion segregating through three generations of a Chinese
      pedigree, carried by the grandfather, the father and two offspring, so
      it is one of the transmitted rather than de novo CTNND1 alleles. The
      pedigree carries two further findings that are not part of this disease
      and should not be read as part of it: the elder brother's hearing loss
      is attributed to double heterozygous GJB2 and GJB3 variants, and a de
      novo 1.46 Mb 17q12 microdeletion in the mother is attributed to her
      bilateral renal cysts.
    type: frameshift variant
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: CTNND1
      term:
        id: hgnc:2515
        label: CTNND1
    evidence:
    - reference: PMID:36584998
      reference_title: "[Genetic analysis of a Chinese pedigree featuring non-simplex blepharocheilodontic syndrome]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The fetus and its elder brother, father and grandfather were found to harbor a heterozygous c.83delG (p.A29Rfs*55) variant of the CTNND1 gene, which was unreported previously."
      explanation: >-
        The variant, its carriers and its novelty, from the English structured
        abstract of this Chinese-language report.
    - reference: PMID:36584998
      reference_title: "[Genetic analysis of a Chinese pedigree featuring non-simplex blepharocheilodontic syndrome]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The c.83delG (p.A29Rfs*55) variant of the CTNND1 gene probably underlay the pathogenesis of non-simplex blepharocheilodontic syndrome in this pedigree."
      explanation: >-
        The authors' causal attribution, and the basis for recording the
        variant as pathogenic for this disease.
    - reference: PMID:36584998
      reference_title: "[Genetic analysis of a Chinese pedigree featuring non-simplex blepharocheilodontic syndrome]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The bilateral renal cysts in the mother may be attributed to the 17q12 microdeletion."
      explanation: >-
        Why the 17q12 microdeletion in this pedigree is not read as part of
        the CTNND1 phenotype: it is de novo in the mother and explains a
        finding of hers.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Blepharocheilodontic syndrome as a whole is rare, and the CTNND1 form is
    the smaller share of a small total: three CTNND1 families in the founding
    cohort of eight, and nine families in the largest CTNND1-specific cohort.
    No prevalence estimate has been published for either form.
  evidence:
  - reference: PMID:32196547
    reference_title: "Novel truncating mutations in CTNND1 cause a dominant craniofacial and cardiac syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "13 participants from nine families"
    explanation: The size of the largest assembled CTNND1 cohort.
pathophysiology:
- name: Heterozygous CTNND1 Truncating Variant
  description: >-
    A heterozygous protein-truncating or canonical splice-site change in
    CTNND1. The allele is lost to nonsense-mediated decay or produces a
    non-functional product, so the cell has roughly half the normal
    p120-catenin.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline, usually de novo, sometimes transmitted. LOSS_OF_FUNCTION
      rather than DOMINANT_NEGATIVE, which is the contrast with the CDH1
      alleles of blepharocheilodontic syndrome 1: those were shown to
      dimerize with wild-type E-cadherin and suppress junction formation,
      while these simply halve the amount of p120-catenin.
  molecular_functions:
  - preferred_term: p120-catenin binding to the cadherin juxtamembrane domain
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0045296
      label: cadherin binding
  genes:
  - preferred_term: CTNND1
    term:
      id: hgnc:2515
      label: CTNND1
  downstream:
  - target: Reduced p120-Catenin Dosage
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28301459
      reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "three CTNND1 heterozygous truncating mutations leading to loss-of-function or haploinsufficiency"
      explanation: States that the truncating alleles act by reducing functional gene dosage.
  evidence:
  - reference: PMID:32196547
    reference_title: "Novel truncating mutations in CTNND1 cause a dominant craniofacial and cardiac syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify eight novel protein-truncating variants, six de novo"
    explanation: The allele class of the initiating lesion.
- name: Reduced p120-Catenin Dosage
  description: >-
    About half the normal amount of p120-catenin. The protein's relevant job
    is to bind the cadherin cytoplasmic juxtamembrane domain and so prevent
    cadherin endocytosis. Mouse genetics has since narrowed which of
    p120-catenin's several functions matters here: binding to RhoA and to
    Kaiso is dispensable during mammalian development, while stabilisation of
    cadherins is crucial. That result is why this entry does not model the
    Wnt and Kaiso transcriptional branch as a parallel disease mechanism.
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  downstream:
  - target: Increased Cadherin Endocytosis and Turnover
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28301459
      reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "The encoded protein, p120ctn, prevents E-cadherin endocytosis and stabilizes its localization at the cell surface."
      explanation: >-
        The function stated here is exactly what is halved, so losing it
        releases cadherin to endocytosis.
  evidence:
  - reference: PMID:35700046
    reference_title: "CTNND1 variants cause familial exudative vitreoretinopathy through the Wnt/cadherin axis."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Variants in CTNND1 caused FEVR by compromising the expression of AJs and Wnt signaling activity."
    explanation: >-
      Attached here because this node's description is where the Wnt and Kaiso
      branch is set aside, and this narrows the scope of that reasoning.
      CTNND1 variants do reach disease through Wnt signalling in retinal
      endothelium, so dispensability during craniofacial development is not a
      statement about p120-catenin's functions in general. Graded REFUTE
      against that stated reason rather than against the dosage claim itself,
      and INDIRECT because it concerns a different disease in a different
      tissue; no BCDS phenotype has been attributed to this route.
  - reference: PMID:41231213
    reference_title: "Actomyosin contractility and a threshold of cadherin cell adhesion are required during tissue fusion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Generating a series of mice deficient in specific p120-catenin molecular functions, we reveal that p120-catenin binding to RhoA and Kaiso is dispensable during mammalian development, while stabilization of cadherins is crucial."
    explanation: >-
      An allelic series separating p120-catenin's functions, which is what
      identifies cadherin stabilisation as the one that matters for
      development.
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CTNND1 binds to CDH1 and controls the stability of the complex."
    explanation: The role of p120-catenin in holding the cadherin-catenin complex together.
- name: Increased Cadherin Endocytosis and Turnover
  description: >-
    With less p120-catenin capping the juxtamembrane domain, E-cadherin and
    P-cadherin are internalised and turned over faster, so the amount of
    cadherin at the cell surface falls. The adherens junction is quantitatively
    weakened rather than structurally broken.
  biological_scale: CELLULAR
  node_class: PROTEIN_TRAFFICKING_AND_LOCALIZATION
  biological_processes:
  - preferred_term: adherens junction organization
    modifier: ABNORMAL
    term:
      id: GO:0034332
      label: adherens junction organization
  cell_types:
  - preferred_term: embryonic surface epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  downstream:
  - target: Cadherin Adhesion Below the Lip-Fusion Threshold
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41231213
      reference_title: "Actomyosin contractility and a threshold of cadherin cell adhesion are required during tissue fusion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Through generating an allelic series of new compound P-cadherin/E-cadherin mouse mutations disrupting combined cadherin levels, we unveil an elevated cadherin cell adhesion threshold requirement specific to upper lip fusion."
      explanation: >-
        A dosage series of the two cadherins is what establishes that there is
        a threshold and that upper lip fusion sits above it.
  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "p120ctn, prevents E-cadherin endocytosis and stabilizes its localization at the cell surface"
    explanation: >-
      The step that fails. Surface cadherin is no longer protected from
      endocytosis.
- name: Cadherin Adhesion Below the Lip-Fusion Threshold
  description: >-
    Upper lip fusion needs more cadherin adhesion than neighbouring tissue
    does, so a general reduction in surface cadherin crosses that tissue's
    threshold while leaving others above theirs. This is the node that
    explains the syndrome's selectivity: a gene expressed throughout the
    embryonic epithelium produces a malformation concentrated in the lip,
    palate, eyelid margins and tooth-forming epithelium. Fusion itself is
    driven by actomyosin contractility along multicellular F-actin cables
    anchored at the fusion site, and attenuating that contractility
    pharmacologically or genetically also produces cleft lip.
  biological_scale: TISSUE
  node_class: DEVELOPMENTAL_MALFORMATION
  biological_processes:
  - preferred_term: cell-cell adhesion mediated by cadherin
    modifier: DECREASED
    term:
      id: GO:0044331
      label: cell-cell adhesion mediated by cadherin
  downstream:
  - target: Failed Lip and Palate Fusion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41231213
      reference_title: "Actomyosin contractility and a threshold of cadherin cell adhesion are required during tissue fusion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Actomyosin contractility drives lip fusion, and its pharmacological or genetic attenuation results in failed fusion and cleft lip."
      explanation: >-
        Shows that interfering with the fusion machinery produces the cleft,
        which is the step from a subthreshold tissue to a failed fusion.
  - target: Defective Eyelid Morphogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28301459
      reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Conditional deletion of Cdh1 and Ctnnd1 in various animal models induces features reminiscent of BCD syndrome and underlines critical role of the E-cadherin-p120ctn interaction in eyelid, craniofacial, and tooth development."
      explanation: >-
        Eyelid development is one of the three territories the conditional
        deletions disturb, which is the basis for a separate eyelid branch.
  - target: Defective Odontogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28301459
      reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Conditional deletion of Cdh1 and Ctnnd1 in various animal models induces features reminiscent of BCD syndrome and underlines critical role of the E-cadherin-p120ctn interaction in eyelid, craniofacial, and tooth development."
      explanation: >-
        Tooth development is the third territory, and the one that is not a
        fusion event, so it is modelled as its own branch.
  evidence:
  - reference: PMID:41231213
    reference_title: "Actomyosin contractility and a threshold of cadherin cell adhesion are required during tissue fusion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "revealing specific enrichment of F-actin that propagates in multicellular cables anchored at the fusion site"
    explanation: The cytoskeletal structure that performs the fusion this node fails to supply adhesion for.
  - reference: PMID:41231213
    reference_title: "Actomyosin contractility and a threshold of cadherin cell adhesion are required during tissue fusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, we identify CDH3 variants in individuals with cleft lip, supporting the relevance of this mechanism in human tissue fusion."
    explanation: >-
      Human variants in the P-cadherin gene with cleft lip, which is what
      carries the mouse threshold mechanism into human disease.
- name: Failed Lip and Palate Fusion
  description: >-
    The upper lip and palatal shelves fail to fuse. This is the branch the
    mouse work explains in most detail: fusion is driven by actomyosin
    contractility along F-actin cables anchored at the fusion site, and the
    adhesion it needs is what the subthreshold cadherin level no longer
    supplies.
  biological_scale: TISSUE
  node_class: DEVELOPMENTAL_MALFORMATION
  biological_processes:
  - preferred_term: roof of mouth development
    modifier: ABNORMAL
    term:
      id: GO:0060021
      label: roof of mouth development
  downstream:
  - target: Orofacial Cleft
    causal_link_type: DIRECT
    evidence:

- name: Defective Eyelid Morphogenesis
  description: >-
    Eyelid margin development is disturbed, producing the four eyelid
    anomalies that name the syndrome. Eyelid closure in the mouse embryo is a
    fusion event too, which is why it shares the adhesion mechanism, but it is
    recorded separately because its clinical consequence is an exposed ocular
    surface rather than a cleft.
  biological_scale: TISSUE

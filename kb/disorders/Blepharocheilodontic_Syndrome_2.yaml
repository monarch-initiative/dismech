differential_diagnoses:
- name: Blepharocheilodontic syndrome 1
  description: >-
    The CDH1-associated form, curated as Blepharocheilodontic_Syndrome_1. The
    same clinical triad, the same protein complex, and a different mechanism:
    CDH1 BCDS alleles are missense and in-frame changes in the extracellular
    cadherin repeats acting dominant-negatively, where CTNND1 alleles are
    truncating and act by haploinsufficiency. The founding cohort found the
    phenotype to appear more severe with CDH1 variants, though it could not
    establish a genotype-phenotype correlation from a cohort that size.
  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Establishment of detailed genotype-phenotype correlations was not possible because of the size of the cohort; however, the phenotype seems to appear more severe in case of CDH1 mutations."
    explanation: >-
      The suggested severity difference between the two genes, with the
      authors' own caveat about cohort size.
- name: Hereditary diffuse gastric cancer
  description: >-
    Relevant to the differential only through the other gene. CDH1 truncating
    variants cause hereditary diffuse gastric cancer, and the question of
    whether blepharocheilodontic syndrome carries a cancer risk belongs to the
    CDH1 form; no gastric or breast cancer was reported in the BCDS cases of
    the replication cohort. CTNND1 is not a hereditary cancer gene, so a
    CTNND1 diagnosis does not raise that question at all, which is a practical
    reason the molecular distinction between the two forms matters.
  evidence:
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in CDH1 have been linked to familial hereditary diffuse gastric cancer and invasive lobular breast cancer; however, no cases of gastric or breast cancer have been reported in our BCDS cases."
    explanation: >-
      The cancer question and its answer in that cohort. It concerns CDH1, not
      the gene of this entry.
- name: Lagophthalmos syndrome
  description: >-
    A pre-molecular nosological question rather than a current differential.
    Lagophthalmos syndrome and blepharocheilodontic syndrome overlap
    strikingly, and a child with features of both was reported as support for
    the two being a continuum. No gene is attached to the lagophthalmos
    syndrome concept, so the overlap cannot be resolved molecularly, and this
    entry does not treat the older reports as CTNND1 cases.
  evidence:
  - reference: PMID:15930907
    reference_title: "Blepharocheilodontic syndrome or lagophthalmos: a child with overlapping features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a child with manifestations of both syndromes, supporting the proposal that the two entities represent a continuum of a wider syndrome."
    explanation: >-
      The overlap, and the authors' reading of it. Predates the molecular
      split entirely.
- name: Non-syndromic bilateral cleft lip and palate
  description: >-
    The cleft alone can look the same, but the craniofacial skeleton does not:
    the class III malocclusion and reduced anterior lower face height are
    significantly more severe than in age-matched non-syndromic bilateral
    cleft lip and palate controls, and the eyelid and dental features are
    absent in the non-syndromic condition.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: bcds2_mesenchymal_role
  prompt: >-
    Which of the CTNND1 phenotypes beyond the classic triad come from the
    epithelial adhesion mechanism, and which require the separate mesenchymal
    role of p120-catenin that the largest cohort proposed?
  rationale: >-
    The cohort that established the wider phenotype drew the line itself: it
    reported a subset of phenotypes attributable to p120-catenin in epithelial
    integrity and turnover, and additional phenotypes suggesting mesenchymal
    roles. This entry models only the epithelial route, because that is the
    one the lip-fusion work has since worked out in detail and the one the
    p120-catenin allelic series supports. The cardiac, limb and
    neurodevelopmental features are therefore recorded as phenotypes with no
    mechanistic edge reaching them, which is honest but incomplete. Settling
    which mechanism produces them would decide whether this is one disease
    with one mechanism and a wide reach, or a syndrome with two.
  attaches_to:
  - pathophysiology#Failed Lip and Palate Fusion
  - pathophysiology#Defective Eyelid Morphogenesis
  - pathophysiology#Defective Odontogenesis
  - phenotypes#Congenital Cardiac Anomaly
  - phenotypes#Limb Dysmorphology
  - phenotypes#Neurodevelopmental Disorder
  evidence:
  - reference: PMID:32196547
    reference_title: "Novel truncating mutations in CTNND1 cause a dominant craniofacial and cardiac syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we identified a subset of phenotypes that can be linked to p120-catenin in epithelial integrity and turnover, and additional phenotypes that suggest mesenchymal roles of CTNND1"
    explanation: The authors' own division of the phenotype into two mechanistic groups.

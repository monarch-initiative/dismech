name: Blepharocheilodontic Syndrome 2
creation_date: "2026-11-17T09:00:00Z"
category: Mendelian
synonyms:
- BCDS2
- blepharocheilodontic syndrome type 2
- CTNND1 blepharo-cheilo-odontic syndrome
- blepharo-cheilo-odontic syndrome caused by mutation in CTNND1
- CTNND1-related blepharocheilodontic syndrome
disease_term:
  preferred_term: blepharocheilodontic syndrome 2
  term:
    id: MONDO:0040503
    label: blepharocheilodontic syndrome 2
parents:
- Blepharocheilodontic syndrome
- Ectodermal dysplasia syndrome
- Orofacial clefting syndrome
description: >-
  Blepharocheilodontic syndrome 2 (BCDS2, OMIM 617681) is the CTNND1-associated
  form of blepharocheilodontic syndrome, a rare autosomal dominant malformation
  syndrome of the eyelids, lips and teeth. The eyelid anomalies are
  lagophthalmos, ectropion of the lower eyelids, euryblepharon and
  distichiasis; the orofacial cleft is classically bilateral cleft lip and
  palate; the dental anomalies are oligodontia with conical and notched teeth,
  taurodontia and a severe class III malocclusion on a short, narrow maxilla.
  CTNND1 encodes p120-catenin, which binds the cadherin cytoplasmic
  juxtamembrane domain and prevents cadherin endocytosis, so holding
  E-cadherin and P-cadherin at the cell surface. BCDS2 alleles are
  heterozygous protein-truncating or splice variants acting by
  haploinsufficiency: with less p120-catenin, surface cadherin is lost to
  turnover, and adhesion falls below the threshold that epithelial fusion
  needs. Live imaging in the mouse embryo has since shown what that threshold
  is for: actomyosin contractility drives upper lip fusion along multicellular
  F-actin cables anchored at the fusion site, and upper lip fusion
  specifically requires an elevated level of cadherin adhesion, higher than
  neighbouring tissues need. The same work showed that p120-catenin's binding
  to RhoA and to Kaiso is dispensable in mammalian development while its
  stabilisation of cadherins is crucial, which is why this entry models the
  adhesion route and not the transcriptional one. The CTNND1 phenotype is
  wider than the classic triad: congenital cardiac anomalies, limb
  dysmorphologies and neurodevelopmental disorders were found across nine
  families, and single cases have added genitourinary anomalies and prenatal
  hydrocephalus.
notes: >-
  Scope. This entry covers only the CTNND1-associated form. The parent concept
  blepharocheilodontic syndrome (MONDO:0007339) also includes the
  CDH1-associated blepharocheilodontic syndrome 1 (MONDO:0054740), which is
  curated separately as Blepharocheilodontic_Syndrome_1 and is listed here
  only as a differential. The two are not redundant: the genes sit in the same
  complex but the allele classes and mechanisms differ, with CDH1 BCDS
  variants acting dominant-negatively on the extracellular cadherin repeats
  and CTNND1 variants acting by haploinsufficiency.
  Much of the clinical literature predates the molecular split. The dental
  and craniofacial series (PMID:28181393) and the older case reports describe
  BCD syndrome without a gene, so they may include CDH1 cases; evidence items
  drawn from them say so in their explanation, and the features reported only
  there are not asserted as CTNND1-specific.
  GeneReviews. No chapter covers this disease or CTNND1. PubMed searches of
  the GeneReviews book for the disease name and for the gene symbol
  (`"blepharocheilodontic"[TI] AND genereviews[book] NOT retired[TI]` and
  `CTNND1[TIAB] AND genereviews[book] NOT retired[TI]`, run 2026-11-13) both
  returned zero records, and `just check-genereviews` reports NO_CHAPTER.
  The baseline is the three molecular cohorts (PMID:28301459, PMID:29348693,
  PMID:32196547) plus the dental and craniofacial series.
  Deep-research report. The openscientist report for this entry came back with
  `citation_count: 0` and so carried no reference-validation or
  term-validation block, although its body does cite thirteen PMIDs. That is
  the #10979 shape, where an empty citation sidecar looks like a report with
  no identifiers. The identifiers were swept out of the body and the
  reference-validation section was retro-fitted with
  `just validate-research-reference`: 13 of 13 resolved, 12 of 13 on topic, no
  unresolved identifiers. The term-validation retro-fit could not be completed
  because `just validate-research-terms` aborts on a 5-second OLS timeout
  (dismech#11896) and, with `--skip-prefix MedGen` applied for the unsupported
  prefix it hit first (dismech#16582), then timed out on an ordinary HP CURIE.
  No CURIE in this entry comes from the report: each was looked up in OLS at
  the time of writing.
  Phenotype frequencies. The report tabulates HPOA-style frequencies (about
  100% for the dental and lower-eyelid signs, about 67% for clefting and the
  classic eyelid features). Those are not transcribed as `frequency:` values
  here, because the cohorts they come from are small, partly overlapping and
  partly pre-molecular, and the sources quoted below state presence rather
  than a rate. Where a source does state a rate for its own cohort, it is
  quoted.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous CTNND1 variants cause the disorder. Most are de novo: six of
    the eight truncating variants in the largest cohort arose de novo, and
    five of the eight families in the founding cohort were de novo cases.
    Transmitted variants occur, including in a four-generation pedigree.
    Expression is variable.
  evidence:
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blepharocheilodontic syndrome (BCDS) consists of lagophthalmia, ectropion of the lower eyelids, distichiasis, euryblepharon, cleft lip/palate and dental anomalies and has autosomal dominant inheritance with variable expression."
    explanation: >-
      States the inheritance pattern and the variable expression. The sentence
      describes BCDS as a whole, which at the time of that cohort covered both
      genes.
  - reference: PMID:32196547
    reference_title: "Novel truncating mutations in CTNND1 cause a dominant craniofacial and cardiac syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify eight novel protein-truncating variants, six de novo, in 13 participants from nine families"
    explanation: The predominance of de novo variants in the largest CTNND1 cohort.
  - reference: PMID:40028877
    reference_title: "New Genitourinary Findings in CTNND1 Blepharocheilodontic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified a de novo heterozygous pathogenic splice site variant in CTNND1, confirming the diagnosis."
    explanation: A further de novo heterozygous case, and the variant class.
genetic:
- name: CTNND1
  gene_term:
    preferred_term: CTNND1
    term:
      id: hgnc:2515
      label: CTNND1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Heterozygous protein-truncating or canonical splice-site variant
  notes: >-
    Reported BCDS2 alleles are frameshift, nonsense and canonical splice-site
    changes acting by haploinsufficiency. This is the mechanistic contrast
    with CDH1, the other blepharocheilodontic syndrome gene, whose BCDS
    alleles are missense and in-frame changes in the extracellular cadherin
    repeats that act dominant-negatively. relationship_type is CAUSATIVE
    because ClinGen rates the CTNND1 to this disease relationship Definitive
    (autosomal dominant, Craniofacial Malformations GCEP); that assertion is
    recorded under gene_disease_validity.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified five CDH1 heterozygous missense mutations and three CTNND1 heterozygous truncating mutations leading to loss-of-function or haploinsufficiency."
    explanation: >-
      First report of CTNND1 variants in this syndrome, and the statement that
      they act by loss of function or haploinsufficiency.
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Mutations in CTNND1 have never been reported before. The encoded protein, p120ctn, prevents E-cadherin endocytosis and stabilizes its localization at the cell surface."
    explanation: The protein's function, which is what the truncating alleles remove.
  - reference: PMID:32196547
    reference_title: "Novel truncating mutations in CTNND1 cause a dominant craniofacial and cardiac syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify eight novel protein-truncating variants, six de novo, in 13 participants from nine families presenting with craniofacial dysmorphisms including cleft palate and hypodontia, as well as congenital cardiac anomalies, limb dysmorphologies and neurodevelopmental disorders"
    explanation: The largest cohort, its allele class, and the wider phenotype it established.
  variants:
  - name: c.83delG (p.Ala29Argfs*55)
    description: >-
      A frameshift deletion reported in a four-generation Chinese pedigree,
      which is one of the transmitted rather than de novo CTNND1 alleles. A
      contiguous 17q12 microdeletion was an incidental, unrelated finding in
      the same family.
      No evidence item is attached. The source is PMID:36584998, whose cached
      record is a Chinese-language abstract with no English sentence that
      states this variant, so there is nothing to quote: the only quotable
      English token is the gene symbol, and a one-word snippet supports
      nothing. The variant detail above is therefore the deep-research
      report's reading of that abstract, recorded as description rather than
      asserted as a quoted finding, and it needs a curator who reads Chinese
      or has the full text to confirm it.
    type: frameshift variant
    gene:
      preferred_term: CTNND1
      term:
        id: hgnc:2515
        label: CTNND1
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Blepharocheilodontic syndrome as a whole is rare, and the CTNND1 form is
    the smaller share of a small total: three CTNND1 families in the founding
    cohort of eight, and nine families in the largest CTNND1-specific cohort.
    No prevalence estimate has been published for either form.

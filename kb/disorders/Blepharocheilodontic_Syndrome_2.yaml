  evidence:
  - reference: PMID:28181393
    reference_title: "Blepharocheilodontic (BCD) syndrome: New insights on craniofacial and dental features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variations in dental morphology included taurodontism, conical-shaped teeth, and notching of the incisal edges."
    explanation: The crown morphology, from the pre-molecular dental series.
- category: Clinical
  name: Taurodontia
  description: >-
    Enlarged pulp chambers with apically displaced furcation, reported among

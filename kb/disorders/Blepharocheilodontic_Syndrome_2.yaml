diagnosis:
- name: CTNND1 Molecular Testing
  description: >-
    Diagnosis is by identifying a heterozygous protein-truncating or splice
    variant in CTNND1, through exome sequencing or targeted sequencing. The
    syndrome can also be diagnosed prenatally by reverse phenotyping, where a
    CTNND1 variant found on sequencing directs re-examination of the
    ultrasound findings.
  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recruited 11 patients from 8 families and performed exome sequencing for 5 families with de novo BCD syndrome cases and targeted Sanger sequencing in the 3 remaining families"
    explanation: The sequencing approaches used in the founding cohort.
  - reference: PMID:39487033
    reference_title: "CTNND1-Related Disorder: New Insight on Prenatal Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report describes a prenatal case in which a CTNND1 pathogenic variant and reverse phenotyping allowed a diagnosis of Blefaro-cheilo-dontic syndrome"
    explanation: Prenatal molecular diagnosis with reverse phenotyping.
- name: Urinary Tract Ultrasound at Diagnosis
  description: >-
    Ultrasound evaluation of the urinary tract is recommended in newly
    diagnosed individuals, following the genitourinary anomalies reported in a
    CTNND1 case. The recommendation rests on one case, so it is screening
    prompted by a single observation rather than an established protocol.
  evidence:
  - reference: PMID:40028877
    reference_title: "New Genitourinary Findings in CTNND1 Blepharocheilodontic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recommending ultrasound evaluation of the urinary tract in newly diagnosed individuals"
    explanation: The authors' own recommendation, and its evidential basis of one case.
animal_models:
- name: Neural-crest p120-catenin conditional knockout mouse
  species: Mouse
  genotype: p120ctn(fl/fl);Wnt1Cre conditional deletion of Ctnnd1 in neural crest cells
  publication: PMID:22736606
  genes:
  - preferred_term: Ctnnd1
    term:
      id: MGI:105100
      label: Ctnnd1
  description: >-
    Homozygous conditional ablation of p120-catenin in neural crest cells. It
    is included for the mechanistic step rather than the phenotype: the
    cadherin consequence of losing p120-catenin is shown directly, while the
    eye phenotype it produces, anterior segment dysgenesis with glaucoma-like
    defects, is not a feature of blepharocheilodontic syndrome and is not
    recorded as one here.
  modeled_mechanisms:
  - target: Increased Cadherin Endocytosis and Turnover
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows that removing p120-catenin lowers cadherin at the plasma membrane,
      which is what this node asserts.
    limitations: >-
      Homozygous tissue-specific ablation rather than the heterozygous
      germline loss of the human disease, in neural crest rather than the
      embryonic surface epithelium where the triad arises, and read out on
      N-cadherin rather than the E-cadherin and P-cadherin this node names.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is N-cadherin and beta-catenin at the plasma
        membrane of periocular mesenchyme and trabecular meshwork cells. The
        node's quantity is surface E-cadherin and P-cadherin in embryonic
        surface epithelium. The direction of the effect transfers; the
        cadherin and the cell type do not.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        A mouse conditional allele. The human disease is caused by
        heterozygous truncating variants, so the model tests the consequence
        of losing the protein rather than of halving it.
    readouts:
    - name: N-cadherin at the plasma membrane
      target: Increased Cadherin Endocytosis and Turnover
      direction: DECREASED
      interpretation: >-
        The surface cadherin loss this node claims. The measurement comes from
        the paper's companion in vitro experiment, a p120-catenin-depleted
        human trabecular meshwork cell line, not from the mouse this link
        describes; the knockout tissue's own cadherin change is the node-level
        evidence on the model.
      evidence:
      - reference: PMID:22736606
        reference_title: "Ocular anterior segment dysgenesis upon ablation of p120 catenin in neural crest cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "A human trabecular meshwork cell line in which p120ctn was knocked down also showed decreased expression levels of N-cadherin and beta-catenin at the plasma membrane, but no defect in cell migration."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:22736606
      reference_title: "Ocular anterior segment dysgenesis upon ablation of p120 catenin in neural crest cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of p120ctn and the associated N-cadherin downregulation in NCC leads to ASD without affecting cell migration."
      explanation: >-
        The authors' own causal reading: losing p120-catenin downregulates
        cadherin, which is the step this node is about.
  evidence:
  - reference: PMID:22736606
    reference_title: "Ocular anterior segment dysgenesis upon ablation of p120 catenin in neural crest cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, the N-cadherin expression pattern was changed significantly in iridocorneal angle cells and corneal endothelium."
    explanation: >-
      The cadherin change in the knockout tissue, which is why this model is
      informative for the cadherin-turnover node despite its phenotype not
      being a BCDS phenotype.
treatments:
- name: Eyelid reconstruction
  description: >-
    Oculoplastic correction of the ectropion, eyelid retraction,
    euryblepharon and lagophthalmos, by lateral tarsal strips, lower eyelid
    retractor disinsertion, myocutaneous advancement, canthoplasty,
    tarsorrhaphy and midface augmentation. The purpose is to re-cover the
    ocular surface, which is the part of the syndrome that threatens function
    rather than appearance; more than one procedure is usually needed.
  treatment_term:

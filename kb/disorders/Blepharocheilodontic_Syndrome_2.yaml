  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Taurodontia
    term:
      id: HP:0000679
      label: Taurodontia
  evidence:
  - reference: PMID:28181393
    reference_title: "Blepharocheilodontic (BCD) syndrome: New insights on craniofacial and dental features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variations in dental morphology included taurodontism, conical-shaped teeth, and notching of the incisal edges."
    explanation: >-
      Taurodontia among the dental variations. The series predates the
      molecular split, so this is not asserted as CTNND1-specific.
- category: Clinical
  name: Dental Malocclusion
  description: >-
    A very severe skeletal class III malocclusion, significantly worse than in
    age-matched non-syndromic bilateral cleft lip and palate controls, with a
    short and narrow maxilla producing anterior and posterior cross bites and
    a reduced anterior lower face height. This is the finding that separates
    the syndrome's craniofacial skeleton from that of an ordinary cleft.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Dental malocclusion
    term:
      id: HP:0000689
      label: Dental malocclusion
  evidence:
  - reference: PMID:28181393
    reference_title: "Blepharocheilodontic (BCD) syndrome: New insights on craniofacial and dental features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCD syndrome patients showed a very severe skeletal III malocclusion (maxillary-mandibular sagittal discrepancy) and reduced anterior lower face measurement compared to non-syndromic BCLP and non-cleft controls"
    explanation: The malocclusion measured against two control groups.
  - reference: PMID:28181393
    reference_title: "Blepharocheilodontic (BCD) syndrome: New insights on craniofacial and dental features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had a short and narrow maxilla which translated into anterior and posterior cross bites."
    explanation: The maxillary skeletal basis of the malocclusion.
- category: Clinical
  name: Narrow Maxilla
  description: >-
    A short and narrow maxilla in every patient of the craniofacial series,

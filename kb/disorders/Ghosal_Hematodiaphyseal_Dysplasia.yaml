name: Ghosal Hematodiaphyseal Dysplasia
creation_date: "2026-11-05T18:55:31Z"
category: Mendelian
disease_term:
  preferred_term: ghosal hematodiaphyseal dysplasia
  term:
    id: MONDO:0009274
    label: ghosal hematodiaphyseal dysplasia
description: >
  Ghosal hematodiaphyseal dysplasia (GHDD, OMIM 231095, ORPHA:1802) is an
  ultra-rare autosomal recessive disorder caused by biallelic loss-of-function
  variants in TBXAS1, which encodes thromboxane A synthase (TXAS, CYP5A1), the
  enzyme that converts the cyclooxygenase product prostaglandin H2 into
  thromboxane A2. It usually presents in infancy or early childhood with a
  hematinic-refractory, often transfusion-dependent normocytic anemia (with
  thrombocytopenia or pancytopenia in some patients), splenomegaly, and a long
  bone dysplasia: cortical thickening and sclerosis of the diaphyses,
  metaphyseal widening, loss of normal diaphyseal constriction, narrowing of the
  medullary canal and bowing. The marrow is hypocellular and fibrotic, with
  increased reticulin and dyserythropoiesis. Platelets show a selective failure
  of arachidonic-acid-induced aggregation, but affected individuals are not
  reported to bleed. Both the anemia and the bone disease respond to low-dose
  corticosteroids, and cyclooxygenase-inhibiting NSAIDs (aspirin, ibuprofen)
  have produced rapid hematologic responses, consistent with the proposed
  mechanism that loss of TXAS diverts prostaglandin H2 into other prostanoids.
  Expressivity is variable, from transfusion-dependent infants to siblings with
  only radiographic cortical thickening, and first diagnosis in adulthood is
  documented.
synonyms:
- GHDD
- Ghosal syndrome
- Ghosal hematodiaphyseal dysplasia syndrome
- diaphyseal dysplasia-anemia syndrome
- hematodiaphyseal dysplasia, Ghosal type
parents:
- skeletal dysplasia
- inherited bone marrow failure syndrome
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0013597
      label: platelet-type bleeding disorder 14
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >
      MONDO:0013597 (BDPLT14, OMIM 614158, "thromboxane synthase deficiency")
      is a separate MONDO concept defined as a TBXAS1 platelet-type bleeding
      disorder. It is recorded here as relatedMatch, not as a merge. ClinGen's
      GHDD curation notes that the OMIM 614158 patients bled and had an
      arachidonic-acid aggregation defect, but were never genotyped, so no
      TBXAS1 variant has been shown to cause that bleeding phenotype; GHDD
      patients, by contrast, are reported not to bleed. Whether the two are one
      disease is unresolved and is not decided by this entry. The ClinGen
      evidence is cited under differential_diagnoses.

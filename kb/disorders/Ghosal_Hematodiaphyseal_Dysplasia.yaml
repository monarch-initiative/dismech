  biological_scale: CELLULAR
  description: >
    Patient platelets fail to aggregate to arachidonic acid because they cannot
    form TXA2. Despite this, ClinGen's review found no bleeding symptoms in the
    patients reported, and the entry therefore does not model a bleeding
    diathesis. Not conformed to the primary_hemostatic_plug_failure module,
    whose chain ends in failure of primary hemostatic plug formation and

  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    About 40 cases had been reported by 2024, mostly in childhood; ClinGen's
    2025 curation counted 20 genetically confirmed probands. Reported patients
    come mainly from the Indian subcontinent and the Middle East, with further
    cases from Europe, North America and Southeast Asia.

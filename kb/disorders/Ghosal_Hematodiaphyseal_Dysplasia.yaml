pathophysiology:
- name: Thromboxane A Synthase Deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic TBXAS1 variants (homozygous in consanguineous families, compound
    heterozygous otherwise; missense, frameshift and nonsense alleles) abolish
    or reduce the activity of thromboxane A synthase, the cytochrome P450 that
    converts prostaglandin H2 (PGH2) into thromboxane A2 (TXA2). ClinGen
    records the disease mechanism as homozygous loss of function.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also found that TXAS and TXA(2) modulated expression of TNFSF11 and TNFRSF11B (encoding RANKL and osteoprotegerin (OPG), respectively) in primary cultured osteoblasts."
    explanation: Cultured-osteoblast data are the basis for this node.
  downstream:
  - target: Diaphyseal Endosteal Hyperostosis With Medullary Narrowing
    description: >
      Proposed: a shift in the RANKL/OPG balance favours bone formation over
      resorption in the diaphyses. The step from the culture finding to the
      clinical bone phenotype is inferred.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18264100

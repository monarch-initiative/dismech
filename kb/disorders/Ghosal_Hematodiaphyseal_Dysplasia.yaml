animal_models:
- name: Tbxas1 knockout mouse (TXAS-/-)
  species: Mouse
  genotype: Tbxas1 -/- (constitutive targeted deletion)
  publication: PMID:15010374
  description: >
    Platelets of TXAS-deficient mice do not aggregate or make thromboxane to
    arachidonic acid and produce more PGE2, PGD2 and PGF2-alpha, reproducing
    the human biochemical defect. Thrombopoiesis and platelet counts are
    normal, the mice have a mild hemostatic defect, and they do not develop
    the increased bone density or myelophthisic anemia of GHDD.
  modeled_mechanisms:
  - target: Prostaglandin H2 Shunting to Other Prostanoids
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Knockout platelets shunt arachidonic acid into other prostaglandins.
    evidence:
    - reference: PMID:15010374
      reference_title: "TXAS-deleted mice exhibit normal thrombopoiesis, defective hemostasis, and resistance to arachidonate-induced death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Platelets from TXAS(-/-) mice failed to aggregate or generate thromboxane B(2) in response to arachidonic acid (AA) but produced increased prostaglandin-E(2) (PGE(2)), PGD(2), and PGF(2 alpha)."
      explanation: Same diversion of PGH2 as in patients.
  - target: Bone Marrow Fibrosis and Failure of Hematopoiesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: The knockout does not develop the marrow failure or bone phenotype.
    limitations: >
      Normal megakaryocytes and platelet counts, and no increased bone density,
      myelophthisic anemia, leukopenia or thrombocytopenia. Unlike patients, the
      mice have a prolonged bleeding time.
    evidence:
    - reference: CGGV:assertion_612c46e2-8b4f-4bff-9d8b-28769d8854e2-2025-04-07T160000.000Z
      reference_title: "TBXAS1 / ghosal hematodiaphyseal dysplasia (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "moreover the mouse model do not show increased bone density, myelophthisic anemia, leukopenia and thrombocytopenia"
      explanation: ClinGen's comparison of the knockout mouse with GHDD patients.
    - reference: PMID:15010374
      reference_title: "TXAS-deleted mice exhibit normal thrombopoiesis, defective hemostasis, and resistance to arachidonate-induced death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "TXAS(-/-) mice had normal bone marrow megakaryocytes, normal blood platelet counts, and normal CD4 and CD8 lymphocyte counts in thymus and spleen."
      explanation: Normal marrow megakaryocytes and platelet counts in the knockout.
discussions:
- discussion_id: ghdd_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Why does Tbxas1 loss produce osteosclerosis and marrow failure in humans but
    not in the knockout mouse, which reproduces the prostaglandin shunt?
  attaches_to:
  - pathophysiology#Bone Marrow Fibrosis and Failure of Hematopoiesis
  - pathophysiology#Diaphyseal Endosteal Hyperostosis With Medullary Narrowing
  rationale: >
    The mouse shows the shunt but not its proposed consequences, so either the
    shunt is not sufficient, the mouse eicosanoid-bone coupling differs, or the
    phenotype needs time, stress or a second factor absent in the mouse. Until
    this is resolved, the edges from the shunt and the RANKL/OPG change to the
    bone and marrow phenotypes rest on human therapeutic response and cultured
    osteoblasts.
  evidence:
  - reference: CGGV:assertion_612c46e2-8b4f-4bff-9d8b-28769d8854e2-2025-04-07T160000.000Z
    reference_title: "TBXAS1 / ghosal hematodiaphyseal dysplasia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "moreover the mouse model do not show increased bone density, myelophthisic anemia, leukopenia and thrombocytopenia"
    explanation: The phenotypic gap between the knockout and patients.
- discussion_id: ghdd_cno_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Is TBXAS1-associated chronic nonbacterial osteomyelitis without
    osteosclerosis or cytopenia a mild form of GHDD or a separate disease?
  attaches_to:
  - disease#Ghosal Hematodiaphyseal Dysplasia
  rationale: >
    TBXAS1 variants were found in a boy with multifocal CNO responsive to
    NSAIDs and in two siblings with CNO but no osteosclerosis or haematologic
    involvement. The authors themselves leave open whether this is a new CNO
    subtype or attenuated GHDD. This entry does not include CNO as a phenotype
    until that is settled.
  evidence:
  - reference: PMID:41148195
    reference_title: "TBXAS1 deficiency: a novel monogenic cause of chronic nonbacterial osteomyelitis responsive to COX inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, it remains uncertain whether TBXAS1 mutations define a new CNO subtype or represent an attenuated form of GHDD."
    explanation: The source states the lump/split question directly.
  - reference: PMID:41148195
    reference_title: "TBXAS1 deficiency: a novel monogenic cause of chronic nonbacterial osteomyelitis responsive to COX inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NGS revealed two siblings with the same variants who were also presented with CNO, but without signs of osteosclerosis or hematologic involvement."
    explanation: CNO without the defining GHDD features.
notes: >
  Lump/split. Two TBXAS1-related MONDO concepts exist. This entry covers
  MONDO:0009274 (GHDD) only. MONDO:0013597 (platelet-type bleeding disorder 14,
  OMIM 614158, "thromboxane synthase deficiency") describes bleeding patients
  with an arachidonic-acid aggregation defect who were never genotyped
  (ClinGen, cited under differential_diagnoses), whereas GHDD patients are
  reported not to bleed. The two are kept separate, linked by a relatedMatch
  mapping. For the same reason the platelet node is not conformed to the
  primary_hemostatic_plug_failure module, and the entry does not meet the
  abnormal-bleeding criterion of the Inherited_Platelet_Function_Disorders
  grouping. TBXAS1-associated chronic nonbacterial osteomyelitis without
  osteosclerosis or cytopenia is recorded as an open question (discussion
  ghdd_cno_spectrum), not as a phenotype. No GeneReviews chapter covers GHDD.

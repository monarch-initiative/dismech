- name: Prostaglandin H2 Shunting to Other Prostanoids
  biological_scale: MOLECULAR
  description: >
    Loss of TXAS diverts PGH2 into PGE2, PGD2 and PGF2-alpha. In patients,
    urinary prostaglandin metabolites are raised, together with the
    pro-inflammatory lipoxygenase products 5-HETE and leukotriene E4. The excess
    prostanoid output is the proposed driver of the marrow failure and the
    systemic inflammation; that link rests on the response to COX inhibition
    rather than on direct demonstration.
  chemical_entities:
  - preferred_term: prostaglandin H2
    term:
      id: CHEBI:15554
      label: prostaglandin H2
    modifier: INCREASED
  - preferred_term: prostaglandin E2
    term:
      id: CHEBI:15551
      label: prostaglandin E2
    modifier: INCREASED
  biological_processes:
  - preferred_term: prostaglandin biosynthetic process
    term:
      id: GO:0001516
      label: prostaglandin biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:36574346
    reference_title: "Nonsteroidal anti-inflammatory drugs as a targeted therapy for bone marrow failure in Ghosal hematodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mass spectrometry analysis demonstrated that urinary PG metabolites were increased along with proinflammatory lipoxygenase (LOX) products 5-hydroxyeicosatetraenoic acid and leukotriene E4."
    explanation: Patient urinary eicosanoid profiling shows the increased prostaglandin output.
  - reference: PMID:15010374
    reference_title: "TXAS-deleted mice exhibit normal thrombopoiesis, defective hemostasis, and resistance to arachidonate-induced death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Platelets from TXAS(-/-) mice failed to aggregate or generate thromboxane B(2) in response to arachidonic acid (AA) but produced increased prostaglandin-E(2) (PGE(2)), PGD(2), and PGF(2 alpha)."
    explanation: The Tbxas1 knockout mouse shows the same diversion of PGH2 into other prostaglandins.
  downstream:
  - target: Bone Marrow Fibrosis and Failure of Hematopoiesis
    description: >
      Proposed: excess prostanoid and lipoxygenase output drives the marrow
      failure. Supported by the rapid resolution of cytopenia when COX is
      inhibited, which is a therapeutic-response inference, not a direct
      demonstration.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36574346
      reference_title: "Nonsteroidal anti-inflammatory drugs as a targeted therapy for bone marrow failure in Ghosal hematodiaphyseal dysplasia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data show that NSAIDs at standard doses surprisingly reduced both COX and LOX products, leading to the resolution of cytopenia, and should be considered for first-line treatment for Ghosal hematodiaphyseal dysplasia syndrome."
      explanation: >
        Lowering COX and LOX products resolved the cytopenia in two patients;
        that the products caused the cytopenia is inferred from this response.
  - target: Systemic Inflammation
    description: >
      Proposed: the shunted prostaglandins and lipoxygenase products sustain a
      systemic inflammatory state that settles with anti-inflammatory treatment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36574346
      reference_title: "Nonsteroidal anti-inflammatory drugs as a targeted therapy for bone marrow failure in Ghosal hematodiaphyseal dysplasia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both patients had rapid improvements concerning hematologic parameters and inflammatory markers without adverse events."
      explanation: >
        Inflammatory markers fell when COX was inhibited; that the eicosanoid
        excess drives the inflammation is inferred from this response.
- name: Altered Osteoblast RANKL and Osteoprotegerin Expression
  biological_scale: CELLULAR
  description: >
    In primary cultured osteoblasts, TXAS and TXA2 modulate expression of
    TNFSF11 (RANKL) and TNFRSF11B (osteoprotegerin), the ligand and decoy
    receptor that control osteoclast formation. This is the only direct
    experimental link between the enzyme defect and bone remodelling; the
    direction of the change in vivo and its sufficiency to produce the
    diaphyseal sclerosis have not been shown.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: regulation of osteoclast differentiation
    term:
      id: GO:0045670
      label: regulation of osteoclast differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18264100

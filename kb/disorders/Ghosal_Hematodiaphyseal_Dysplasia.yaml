    reference_title: "Nonsteroidal anti-inflammatory drugs as a targeted therapy for bone marrow failure in Ghosal hematodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients had rapid improvements concerning hematologic parameters and inflammatory markers without adverse events."
    explanation: NSAID response in an adult and a child.
  - reference: PMID:38497148
    reference_title: "Low-dose non-steroidal anti-inflammatory drugs: a promising approach for the treatment of symptomatic bone marrow failure in Ghosal hematodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "were transfusion-independent at 1 month with resolution of bone pain"
    explanation: Low-dose aspirin series of four adults.
  - reference: PMID:39220787
    reference_title: "Middle-aged women with hematodiaphyseal dysplasia: Ghosal syndrome: Case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemoglobin improved to 11 gm/dL at 3-month follow-up visit."
    explanation: Response to aspirin 150 mg/day in an adult.
- name: Red Blood Cell Transfusion

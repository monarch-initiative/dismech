    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It should therefore be considered as a differential diagnosis of unusual anemia in early childhood, especially in children from the Middle East or the Indian subcontinent."
    explanation: Geographic clustering of reported cases.
progression:
- phase: Infantile or early-childhood onset
  age_range: infancy to about 5 years
  notes: >
    Most patients present in infancy or the first years of life with anemia,
    sometimes splenomegaly, and thick or bowed long bones. Orphanet records
    onset in the neonatal period and infancy.
  evidence:
  - reference: PMID:3385529
    reference_title: "Diaphyseal dysplasia associated with anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients in early childhood had moderate to marked anemia and clinically demonstrable thick long bones of the extremities with radiologic features of diaphyseal dysplasia."
    explanation: Early-childhood presentation in the original series.
  - reference: ORPHA:1802
    reference_title: "Ghosal hematodiaphyseal dysplasia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Infancy"
    explanation: Orphanet age-of-onset annotation.
- phase: Chronic course with delayed diagnosis
  age_range: childhood to adulthood
  notes: >
    Without treatment the anemia persists and the bone disease progresses. Some
    patients become transfusion-independent spontaneously for years and relapse
    in adulthood, and genetic diagnosis is often delayed by more than a decade;
    first diagnosis in the fourth decade is documented.
  evidence:
  - reference: PMID:38497148
    reference_title: "Low-dose non-steroidal anti-inflammatory drugs: a promising approach for the treatment of symptomatic bone marrow failure in Ghosal hematodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients #1 and #3 achieved spontaneous red blood cell (RBC) transfusion independence without treatment for over 20 years."
    explanation: Spontaneous transfusion independence for decades before adult relapse.
  - reference: PMID:38497148
    reference_title: "Low-dose non-steroidal anti-inflammatory drugs: a promising approach for the treatment of symptomatic bone marrow failure in Ghosal hematodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic diagnosis was made at a median time of 15.5 years (range, 4-34 years) after the first occurrence of symptomatic anemia."
    explanation: Long diagnostic delay.
  - reference: PMID:42059562
    reference_title: "Ghosal Hematodiaphyseal Dysplasia: A Case Report With Review of Genetically Confirmed Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GHDS is a systemic inflammatory syndrome that responds to anti-inflammatory therapy; however, if untreated, it may progress to transfusion-requiring anemia, bone marrow failure, or severe skeletal manifestations."
    explanation: Untreated course.
diagnosis:
- name: Long-Bone Radiography
  description: >
    Plain films of the long bones show diaphyseal and metaphyseal widening,
    loss of diaphyseal constriction and cortical thickening. In a child with
    unexplained refractory anemia, this finding points to GHDD.
  presence: PRESENT
  evidence:
  - reference: PMID:25374284
    reference_title: "Steroid-responsive anemia in patients of Ghosal hematodiaphyseal dysplasia: simple to diagnose and easy to treat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They were easily diagnosed with long-bone x-rays showing diaphyseal and metaphyseal widening and loss of diaphyseal constriction."
    explanation: Long-bone radiographs were diagnostic in three children.
- name: Bone Marrow Biopsy
  description: >
    Shows hypocellular or fibrocellular marrow with increased reticulin and
    dyserythropoiesis. Aspiration often fails. Useful to exclude malignancy,
    but not specific.
  presence: PRESENT
  evidence:
  - reference: PMID:38497148
    reference_title: "Low-dose non-steroidal anti-inflammatory drugs: a promising approach for the treatment of symptomatic bone marrow failure in Ghosal hematodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biopsies revealed hypoplasia of the three myeloid lineages with dysmyelopoietic features, edema and fibrosis"
    explanation: Marrow histology in four patients.
- name: Molecular Genetic Testing for TBXAS1
  description: >
    Confirmation is by finding biallelic TBXAS1 variants, by targeted
    sequencing, a bone marrow failure or skeletal dysplasia panel, or exome
    sequencing. TBXAS1 has also surfaced on iron-panel testing for refractory
    anemia.
  presence: PRESENT
  evidence:
  - reference: PMID:33595912
    reference_title: "Novel compound heterozygous variants of TBXAS1 presenting with Ghosal hematodiaphyseal dysplasia treated with steroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "analyzed using next-generation sequencing (NGS) on an in-house bone marrow failure syndrome panel"
    explanation: Diagnosis by a bone marrow failure gene panel.
  - reference: PMID:37951373
    reference_title: "Genomics of iron refractory iron deficiency anemia phenotype reveals a spectrum of novel pathogenic biallelic and monoallelic TMPRSS6 variants and rare overlapping disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, 2 (15 %) cases revealed rare SMAD4 and TBXAS1 gene variants that can present with refractory anemia but were consistent with diagnosis of hereditary hemorrhagic telangiectasia and Ghosal hematodiaphyseal dysplasia respectively."
    explanation: GHDD identified on an iron-refractory anemia gene panel.
- name: Platelet Aggregometry
  description: >
    Shows a selective defect in arachidonic-acid-induced aggregation, a
    supportive laboratory clue to thromboxane synthase deficiency.
  presence: PRESENT
  evidence:
  - reference: PMID:18264100
    reference_title: "Thromboxane synthase mutations in an increased bone density disorder (Ghosal syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelets from subjects with GHDD showed a specific deficit in arachidonic acid-produced aggregation."
    explanation: Patient platelet aggregometry.
differential_diagnoses:
- name: Camurati-Engelmann Disease
  description: >
    TGFB1 diaphyseal dysplasia (autosomal dominant) shares bone pain, difficulty
    walking and diaphyseal sclerosis with GHDD, and some patients also have
    marrow involvement.
  distinguishing_features:
  - Monoallelic TGFB1 rather than biallelic TBXAS1 variants
  - Refractory steroid-responsive anemia is not the leading feature
  evidence:
  - reference: PMID:40198394
    reference_title: "Insights into Natural History, Phenotypic, and Molecular Spectrum in a Large Cohort of Osteosclerotic Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CED and GHDD share bone pain, difficulty in walking, and diaphyseal sclerosis, with some patients also having bone marrow involvement."
    explanation: Direct clinical comparison of the two disorders in one cohort.
- name: Platelet-Type Bleeding Disorder 14 (Thromboxane Synthase Deficiency)
  description: >
    OMIM 614158 describes patients with a bleeding tendency, impaired
    arachidonic-acid aggregation with normal response to the thromboxane
    analogue U46619, and low serum TXB2. Their platelet biochemistry matches
    GHDD, but they bled, had no reported bone or marrow disease, and were never
    genotyped, so a TBXAS1 cause has not been shown.
  disease_term:
    preferred_term: platelet-type bleeding disorder 14
    term:
      id: MONDO:0013597
      label: platelet-type bleeding disorder 14
  distinguishing_features:
  - Clinical bleeding, which is not reported in GHDD
  - No diaphyseal dysplasia or marrow failure described
  - No molecular confirmation
  evidence:
  - reference: CGGV:assertion_612c46e2-8b4f-4bff-9d8b-28769d8854e2-2025-04-07T160000.000Z
    reference_title: "TBXAS1 / ghosal hematodiaphyseal dysplasia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, DNA analysis was not carried out in these patients and we can not establish an association with variants in TBXAS1."
    explanation: >
      ClinGen states that the bleeding "thromboxane synthase deficiency"
      patients were not genotyped, which is why that concept is kept separate
      from GHDD rather than lumped with it.
  - reference: CGGV:assertion_612c46e2-8b4f-4bff-9d8b-28769d8854e2-2025-04-07T160000.000Z
    reference_title: "TBXAS1 / ghosal hematodiaphyseal dysplasia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "None of the patients showed bleeding symptoms."
    explanation: The GHDD families did not bleed, the main clinical difference.
treatments:
- name: Low-Dose Corticosteroid Therapy
  description: >
    Oral prednisolone or another corticosteroid, usually at low dose and for
    years, normalises hemoglobin, ends transfusion dependence and halts or
    reverses the bone changes. It has been the standard treatment since the
    original description. Long-term use carries iatrogenic risk.
  treatment_term:
    preferred_term: Systemic Corticosteroid Therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:3385529
    reference_title: "Diaphyseal dysplasia associated with anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the anemia was persistent and not responsive to hematinics, prednisolone was administered to two of these patients and caused remarkable improvement of the anemia in both."
    explanation: Prednisolone response in the original series.
  - reference: PMID:3385529
    reference_title: "Diaphyseal dysplasia associated with anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Roentgenologic examination carried out after 1 year of corticosteroid therapy in one patient and after 11 years in another showed considerable improvement of the bony changes."
    explanation: Radiographic improvement of the bone disease on corticosteroids.
  - reference: PMID:25374284
    reference_title: "Steroid-responsive anemia in patients of Ghosal hematodiaphyseal dysplasia: simple to diagnose and easy to treat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases dramatically responded to oral steroid and no longer needed blood transfusion."
    explanation: Transfusion independence on oral steroid in three children.
  - reference: PMID:27156553
    reference_title: "Ghosal Type Hematodiaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low dose steroid therapy resulted in normalization of hemoglobin and prevented further progression of bony changes."
    explanation: Haematologic and skeletal response to low-dose steroid.
  - reference: PMID:38497148
    reference_title: "Low-dose non-steroidal anti-inflammatory drugs: a promising approach for the treatment of symptomatic bone marrow failure in Ghosal hematodiaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, patients often require long-term corticosteroids, leading to iatrogenic complications."
    explanation: The main limitation of corticosteroid treatment.
- name: NSAID Therapy (Aspirin or Ibuprofen)
  description: >
    Cyclooxygenase inhibition with aspirin or ibuprofen, at standard or low
    dose, gave rapid haematologic responses, transfusion independence,
    resolution of inflammation and of bone pain in small series of children and
    adults, including patients who had relapsed after steroids. One patient
    relapsed when aspirin was stopped and responded again on resumption. No
    controlled trial exists.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
    - preferred_term: ibuprofen
      term:
        id: CHEBI:5855
        label: ibuprofen
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Prostaglandin H2 Shunting to Other Prostanoids
    treatment_effect: INHIBITS
    description: >
      COX-1/COX-2 inhibition reduces formation of PGH2 and so the prostanoid
      excess that results from its diversion.
  target_phenotypes:
  - preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:

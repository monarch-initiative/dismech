pathophysiology:
- name: Epigenetic Regulator Loss in a Hematopoietic Progenitor
  description: >-
    Loss-of-function mutations in DNA- and chromatin-modifying genes — most
    consistently TET2, often biallelic, together with the canonical ASXL1
    c.1934dupG frameshift — arise in a hematopoietic progenitor and behave as
    founder events. The same variants are recoverable from a preceding or
    concurrent myeloid neoplasm in the same patient, which places the lesion
    upstream of pDC commitment rather than inside the pDC compartment.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TET2
    term:
      id: hgnc:25941
      label: TET2
  - preferred_term: ASXL1
    term:
      id: hgnc:18318
      label: ASXL1
  downstream:
  - target: Clonal Hematopoiesis of the Mutant Progenitor
    causal_link_type: DIRECT
    description: >-
      The loss-of-function lesion is what gives the progenitor its expansion
      advantage.
  - target: UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
    causal_link_type: DIRECT
    description: >-
      TET2 loss is itself what makes the premalignant pDC clone resistant to
      UV-induced death, so the founder lesion feeds this selection step
      directly rather than through an intermediate.
  evidence:
  - reference: PMID:36819168
    reference_title: "Biallelic TET2 mutations and canonical ASXL1 mutations are frequent and cooccur in Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): An institutional experience and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied the myeloid-related genetic mutations in a cohort of five patients with BPDCN and one paired relapse case at our institution and identified a high frequency of biallelic TET2 and canonical ASXL1 (c.1934dupG) mutations."
    explanation: Establishes biallelic TET2 and canonical ASXL1 loss as the recurrent lesion pair in this node.
  - reference: PMID:36819168
    reference_title: "Biallelic TET2 mutations and canonical ASXL1 mutations are frequent and cooccur in Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): An institutional experience and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the variant allele fraction (VAF) sums of the TET2 mutations, as well as the persistence of TET2 mutations in a case of relapsed BPDCN, suggest an ancestral/founder nature of TET2 clones in the cases"
    explanation: Supports the founder/ancestral ordering of the TET2 lesion, which is what makes this the initiating node.
  - reference: PMID:41451201
    reference_title: "Blastic plasmacytoid dendritic cell neoplasm secondary to acute myeloid leukemia with shared mutations in TET2 and DNMT3A: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these, TET2 mutations emerged as a common feature, present in BPDCN and the associated hematologic malignancies in 9 of the 10 patients."
    explanation: >-
      Shared TET2 variants between BPDCN and the patient's antecedent myeloid
      neoplasm place the lesion in a common progenitor rather than in the pDC clone.
  - reference: PMID:37286599
    reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we find that BPDCN arises from clonal (premalignant) haematopoietic precursors in the bone marrow"
    explanation: >-
      Phylogenomic evidence locating the founder clone in marrow precursors,
      which is what this node asserts.

- name: Clonal Hematopoiesis of the Mutant Progenitor
  description: >-
    The mutant progenitor expands as a premalignant clone in the bone marrow,
    still capable of normal differentiation. This is the state shared with the
    antecedent myeloid neoplasms that a fifth of BPDCN patients also carry,
    and it is the substrate the later lesions act on rather than the disease
    itself.
  biological_scale: CELLULAR
  downstream:
  - target: Plasmacytoid Dendritic Cell Differentiation Block
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The expanded premalignant clone is the population within which the
      pDC-lineage differentiation block is subsequently established.
  evidence:
  - reference: PMID:37286599
    reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we find that BPDCN arises from clonal (premalignant) haematopoietic precursors in the bone marrow"
    explanation: >-
      Names the premalignant clonal precursor state in marrow that this node
      separates out from the molecular lesion upstream of it.

- name: CDKN2A and CDKN2B Deletion at 9p21.3
  description: >-
    Recurrent copy-number loss at 9p21.3 removes the CDKN2A/CDKN2B cell-cycle
    inhibitors, and the same broad deletions take out neighbouring tumour
    suppressors including CDKN1B and RB1. Unlike most of the recurrent lesions
    here it is a deletion rather than a point mutation, and biallelic loss is
    among the few cytogenetic findings with a reported adverse prognostic
    effect.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  - preferred_term: CDKN2B
    term:
      id: hgnc:1788
      label: CDKN2B
  downstream:
  - target: Clonal Expansion of pDC-Lineage Blasts
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the p16/RB checkpoint removes a brake on G1/S progression.
  evidence:
  - reference: PMID:31846142
    reference_title: "Whole-genome analysis uncovers recurrent IKZF1 inactivation and aberrant cell adhesion in blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent copy number alterations (CNAs) in BPDCN include broad deletions within chromosomes 7, 9, 12, 13, and 15, particularly the regions containing tumor suppressors CDKN2A/B, CDKN1B, and RB1."
    explanation: >-
      Whole-genome evidence for the recurrent 9p21.3 deletion and the
      neighbouring tumour suppressors it removes.

- name: MYC Rearrangement at 8q24
  description: >-
    Rearrangement of the MYC locus, most often partnered with 6p21 (RUNX2)
    rather than an immunoglobulin locus, driving MYC overexpression. Reported
    frequencies differ substantially by cohort and ascertainment - 12% in one
    single-institution karyotype series, about a third in a cytogenetics
    review - and the rearranged cases are associated with an immunoblastoid
    cytomorphology.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  downstream:
  - target: Clonal Expansion of pDC-Lineage Blasts
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      MYC overexpression amplifies proliferative and biosynthetic
      transcriptional programs.
  evidence:
  - reference: PMID:29407586
    reference_title: "8q24/MYC rearrangement is a recurrent cytogenetic abnormality in blastic plasmacytoid dendritic cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that 8q24/MYC rearrangements occur in 10-15% of BPDCN, often partnered with non-immunoglobulin chromosomal loci, and may play a role in BPDCN pathogenesis."
    explanation: >-
      The primary series behind this node, giving both the frequency and the
      non-immunoglobulin partner pattern.
  - reference: PMID:32336417
    reference_title: "Cytogenetics of Blastic Plasmacytoid Dendritic Cell Neoplasm: Chromosomal Rearrangements and DNA Copy-Number Alterations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One-third of cases of BPDCN harbor the 8q24 rearrangement, most frequently with 6p21 harboring RUNX2, which is associated with immunoblastoid cytomorphology and MYC expression."
    explanation: >-
      A higher frequency estimate from a cytogenetics review, plus the RUNX2
      partner and the cytomorphologic association. Curated alongside the 10-15%
      figure rather than in place of it, because the two disagree.

- name: Glucocorticoid Resistance
  description: >-
    Reduced glucocorticoid-receptor dosage renders the clone corticoresistant.
    This is the functional consequence the NR3C1 deletion was characterized
    by, and it matters clinically because corticosteroids are otherwise a
    standard component of the lymphoma- and ALL-type regimens used here.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:27060168
    reference_title: "Haploinsufficiency for NR3C1, the gene encoding the glucocorticoid receptor, in blastic plasmacytoid dendritic cell neoplasms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "functional analyses coupled with gene expression profiling identified corticoresistance and loss-of-EZH2 function as major downstream consequences of NR3C1 deletion in BPDCN"
    explanation: >-
      Names corticoresistance as a demonstrated downstream consequence of the
      NR3C1 lesion, which is what this node records.

- name: Lymphoid Organ Infiltration
  description: >-
    Infiltration of lymph nodes and spleen. In the SEER population-based
    series lymph node was the most frequently recorded primary site, which
    makes this a major compartment rather than an afterthought to the
    cutaneous and marrow disease.
  biological_scale: TISSUE
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  evidence:
  - reference: PMID:37251924
    reference_title: "Primary blastic plasmacytoid dendritic cell neoplasm: a US population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mostly affected sites were lymph nodes (31.8%)."
    explanation: Population-based evidence that nodal involvement is a leading site.
  - reference: PMID:27986708
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm Is Dependent on BCL2 and Sensitive to Venetoclax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presents with skin nodules and tumors, lymph node and splenic enlargement"
    explanation: Names both compartments this node covers among the presenting features.

- name: ZRSR2 Loss-of-Function Splicing Defect
  description: >-
    ZRSR2, an X-linked minor-spliceosome component, is recurrently inactivated
    in BPDCN and almost exclusively in males. The resulting intron retention
    prevents pDCs from upregulating IRF7 after inflammatory stimulation, so
    the cells neither activate nor undergo the apoptosis that normally follows
    activation. This is the best-supported mechanistic account of the disease's
    approximately 3:1 male predominance.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ZRSR2
    term:
      id: hgnc:23019
      label: ZRSR2
  biological_processes:
  - preferred_term: RNA splicing
    modifier: DECREASED
    term:
      id: GO:0008380
      label: RNA splicing
  downstream:
  - target: Apoptosis Resistance in the pDC Compartment
    causal_link_type: DIRECT
    description: >-
      Failure to upregulate IRF7 after inflammatory stimulus removes the
      activation-coupled apoptotic response of normal pDCs.
    evidence:
    - reference: PMID:34615655
      reference_title: "Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ZRSR2 mutation impairs pDC activation and apoptosis after inflammatory stimuli, associated with intron retention and inability to upregulate the transcription factor IRF7."
      explanation: States the splicing lesion causes the apoptotic-resistance step directly, which is the edge claim rather than either node alone.
  evidence:
  - reference: PMID:34615655
    reference_title: "Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutations in ZRSR2, an X chromosome gene encoding a splicing factor, are enriched in BPDCN, and nearly all mutations occur in males."
    explanation: Establishes both the recurrence of the lesion in BPDCN and its near-exclusive occurrence in males.

- name: IKZF1 Structural Inactivation
  description: >-
    IKZF1, which encodes the transcription factor required for plasmacytoid
    dendritic cell precursor differentiation, is focally inactivated by
    recurrent structural rearrangements. Whole-genome sequencing found this
    to be the disease's most characteristic structural lesion, and the
    transcriptome carries the corresponding loss-of-IKZF1 target-gene
    signature together with the cell-adhesion program that IKZF1 deficiency
    de-represses.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: IKZF1
    term:
      id: hgnc:13176
      label: IKZF1
  downstream:
  - target: Plasmacytoid Dendritic Cell Differentiation Block
    causal_link_type: DIRECT
    description: >-
      IKZF1 is required for pDC precursor differentiation, so its focal
      inactivation blocks that program.
  - target: Aberrant Cell Adhesion Program
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31846142
    reference_title: "Whole-genome analysis uncovers recurrent IKZF1 inactivation and aberrant cell adhesion in blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed that IKZF1, a gene encoding a transcription factor required for the differentiation of plasmacytoid dendritic cell precursors, is focally inactivated through recurrent structural alterations in this neoplasm"
    explanation: Direct whole-genome evidence for recurrent focal IKZF1 inactivation and its role in pDC precursor differentiation.

- name: MYB Rearrangement
  description: >-
    Rearrangements fusing the MYB N-terminus to a partner C-terminus are
    markedly enriched in BPDCN relative to other blood cancers and are
    sometimes the only detectable somatic lesion. Chromatin profiling shows
    the fusion protein redirects MYB away from dendritic-cell lineage genes
    and onto G2/M cell-cycle control genes, converting a differentiation
    factor into a proliferation driver.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYB
    term:
      id: hgnc:7545
      label: MYB
  downstream:
  - target: Plasmacytoid Dendritic Cell Differentiation Block
    causal_link_type: DIRECT
  - target: Aberrant G2/M Cell Cycle Gene Regulation
    causal_link_type: DIRECT
    description: >-
      CUT&RUN profiling shows the fusion switches MYB's binding from lineage
      genes to G2/M cell-cycle control genes.
    evidence:
    - reference: PMID:39499902
      reference_title: "BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we found that, in BPDCN leukemogenesis, MYB switches from being a regulator of DC lineage genes to aberrantly regulating G2/M cell cycle control genes."
      explanation: States the redirection of MYB binding onto cell-cycle genes, which is precisely this edge.
  evidence:
  - reference: PMID:39499902
    reference_title: "BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rearrangements of the hematopoietic transcription factor MYB are recurrently found in 20% of patients with blastic plasmacytoid DC neoplasm (BPDCN), a rare leukemia arising from cells of the plasmacytoid DC (pDC) lineage"
    explanation: Quantifies the recurrence of MYB rearrangement in BPDCN.

- name: Plasmacytoid Dendritic Cell Differentiation Block
  description: >-
    The convergent consequence of the upstream lesions is arrest of the pDC
    differentiation program, producing an immature blast population that
    nevertheless retains defining pDC identity (CD123, TCF4, TCL1, CD303,
    CD304). It is this retained identity, not the block itself, that makes the
    lineage's own master regulators exploitable as therapeutic targets.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: plasmacytoid dendritic cell precursor
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: plasmacytoid dendritic cell differentiation
    modifier: DECREASED
    term:
      id: GO:0002273
      label: plasmacytoid dendritic cell differentiation
  downstream:
  - target: TCF4-Dependent Super-Enhancer Network Addiction
    causal_link_type: DIRECT
    description: >-
      The arrested cell remains within the pDC transcriptional program and so
      remains dependent on that program's master regulator.
  evidence:
  - reference: PMID:39499902
    reference_title: "BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "expression of MYB fusions in vivo impaired DC differentiation and induced transformation to generate a mouse model of myeloid-dendritic acute leukemia."
    explanation: >-
      In vivo demonstration that a BPDCN driver lesion produces a
      dendritic-cell differentiation block coupled to transformation.
  - reference: PMID:30323983
    reference_title: "Early detection of transformation to BPDCN in a patient with MDS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by neoplastic cells that are positive for CD123, CD4, BDCA2, and TCL1 and aberrant expression of CD56"
    explanation: >-
      Human evidence for the retained pDC identity markers this node asserts,
      so the node does not rest on model-organism evidence alone.

- name: TCF4-Dependent Super-Enhancer Network Addiction
  description: >-
    TCF4 (E2-2), the master transcription factor of normal pDC development,
    is retained by the malignant clone and establishes BPDCN-specific
    super-enhancers that recruit BRD4. RNAi knockdown of TCF4 collapses the
    BPDCN-specific expression program and triggers apoptosis, and BET
    inhibitors reproduce that effect pharmacologically — so this is a genuine
    oncogenic addiction rather than a lineage marker.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TCF4
    term:
      id: hgnc:11634
      label: TCF4
  - preferred_term: BRD4
    term:
      id: hgnc:13575
      label: BRD4
  molecular_functions:
  - preferred_term: TCF4 transcription factor activity at BPDCN super-enhancers
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  downstream:
  - target: CD123 Overexpression on Malignant pDC Blasts
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Retention of the pDC transcriptional program keeps the lineage's
      characteristic high surface IL3RA expression in place.
  - target: Clonal Expansion of pDC-Lineage Blasts
    causal_link_type: DIRECT
    description: >-
      Disrupting the TCF4-BRD4 network kills BPDCN cells, so the network is
      required for maintenance of the expanded clone.
    evidence:
    - reference: PMID:27846392
      reference_title: "A Druggable TCF4- and BRD4-Dependent Transcriptional Network Sustains Malignancy in Blastic Plasmacytoid Dendritic Cell Neoplasm."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "its downregulation caused the loss of the BPDCN-specific gene expression program and apoptosis"
      explanation: >-
        Loss-of-function of the node kills the expanded clone, which is this
        edge's causal claim. Quoted from the knockdown clause only: the
        sentence's first clause is a human-tissue immunostaining result and
        belongs to a different evidence source.
  evidence:
  - reference: PMID:27846392
    reference_title: "A Druggable TCF4- and BRD4-Dependent Transcriptional Network Sustains Malignancy in Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using RNAi screening, we identified the E-box transcription factor TCF4 as a master regulator of the BPDCN oncogenic program."
    explanation: Identifies TCF4 as the master regulator this node is built on.
  - reference: PMID:27846392
    reference_title: "A Druggable TCF4- and BRD4-Dependent Transcriptional Network Sustains Malignancy in Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "High-throughput drug screening revealed that bromodomain and extra-terminal domain inhibitors (BETis) induced BPDCN apoptosis, which was attributable to disruption of a BPDCN-specific transcriptional network controlled by TCF4-dependent super-enhancers."
    explanation: Establishes the BRD4/super-enhancer component of the network and its pharmacological tractability.

- name: CD123 Overexpression on Malignant pDC Blasts
  description: >-
    The malignant blasts express interleukin-3 receptor subunit alpha (IL3RA,
    CD123) at high density. It is both the diagnostic anchor and the address
    that every approved and investigational targeted agent in this disease is
    written to. Note what is *not* claimed here: tagraxofusp works by
    receptor-mediated delivery of a toxin payload, not by blocking IL-3
    signalling, and nothing curated in this entry establishes that CD123
    signalling itself drives survival.
  biological_scale: CELLULAR
  genes:
  - preferred_term: IL3RA
    term:
      id: hgnc:6012
      label: IL3RA
  gene_products:
  - preferred_term: interleukin-3 receptor alpha chain (CD123)
    term:
      id: NCIT:C39275
      label: Interleukin-3 Receptor Subunit Alpha
  downstream:
  - target: Clonal Expansion of pDC-Lineage Blasts
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31018069
    reference_title: "Tagraxofusp in Blastic Plasmacytoid Dendritic-Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blastic plasmacytoid dendritic-cell neoplasm (BPDCN) is an aggressive hematologic cancer that is caused by transformed plasmacytoid dendritic cells that overexpress interleukin-3 receptor subunit alpha (IL3RA or CD123)."
    explanation: States CD123 overexpression on the transformed pDCs as the defining molecular feature of this node.

- name: Apoptosis Resistance in the pDC Compartment
  description: >-
    Malignant pDCs escape apoptosis by two independently demonstrated routes:
    loss of the activation-coupled apoptotic response that follows ZRSR2
    inactivation, and dependence on the antiapoptotic protein BCL2. BH3
    profiling of primary patient cells shows the BCL2 dependence is uniform
    rather than confined to a genetic subgroup, which is why it does not have
    a companion biomarker.
  biological_scale: CELLULAR
  genes:
  - preferred_term: BCL2
    term:
      id: hgnc:990
      label: BCL2
  biological_processes:
  - preferred_term: negative regulation of apoptotic process
    modifier: INCREASED
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
  downstream:
  - target: Clonal Expansion of pDC-Lineage Blasts
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27986708
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm Is Dependent on BCL2 and Sensitive to Venetoclax."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that primary BPDCN cells were dependent on the antiapoptotic protein BCL2 and were uniformly sensitive to the BCL2 inhibitor venetoclax, as measured by direct cytotoxicity, apoptosis assays, and dynamic BH3 profiling."
    explanation: Functional profiling of primary patient tumour cells establishes uniform BCL2 dependence.
  - reference: PMID:34615655
    reference_title: "Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo, BPDCN-associated mutations promote pDC expansion and signatures of decreased activation."
    explanation: In vivo support for the expansion-with-reduced-activation state this node describes.

- name: Aberrant G2/M Cell Cycle Gene Regulation
  description: >-
    MYB fusion proteins bind G2/M cell-cycle control loci with greater
    magnitude than wild-type MYB, driving the corresponding expression changes.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: G2/M transition of mitotic cell cycle
    modifier: INCREASED
    term:
      id: GO:0000086
      label: G2/M transition of mitotic cell cycle
  downstream:
  - target: Clonal Expansion of pDC-Lineage Blasts
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39499902
    reference_title: "BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MYB fusions found in patients with BPDCN increased the magnitude of DNA binding at these locations, and this was linked to BPDCN-associated gene expression changes."
    explanation: Links the fusion's increased binding at G2/M loci to the expression changes this node names.

- name: NR3C1 Haploinsufficiency
  description: >-
    Monoallelic deletion of NR3C1 at 5q31, encoding the glucocorticoid
    receptor, occurs in roughly a quarter of cases without accompanying point
    mutations, lowering receptor expression. It marks a subgroup with markedly
    inferior survival and provides a mechanistic account of intrinsic
    corticosteroid resistance.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NR3C1
    term:
      id: hgnc:7978
      label: NR3C1
  downstream:
  - target: Glucocorticoid Resistance
    causal_link_type: DIRECT
    description: >-
      Halved receptor dosage is the direct cause of the corticoresistant
      phenotype.
  - target: Clonal Expansion of pDC-Lineage Blasts
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      NR3C1 behaves as a haploinsufficient tumour suppressor here, so losing
      one copy removes a brake on the expanding clone rather than driving it.
    evidence:
    - reference: PMID:27060168
      reference_title: "Haploinsufficiency for NR3C1, the gene encoding the glucocorticoid receptor, in blastic plasmacytoid dendritic cell neoplasms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "this work points to NR3C1 as a haploinsufficient tumor suppressor in a subset of BPDCN"
      explanation: >-
        Establishes the tumour-suppressor role that makes this edge a loss of
        restraint on expansion rather than a bare association.
  evidence:
  - reference: PMID:27060168
    reference_title: "Haploinsufficiency for NR3C1, the gene encoding the glucocorticoid receptor, in blastic plasmacytoid dendritic cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify monoallelic deletion of NR3C1 (5q31), encoding the glucocorticoid receptor (GCR), in 13 of 47 (28%) BPDCN patients"
    explanation: Quantifies the recurrence of the monoallelic NR3C1 deletion this node describes.
  - reference: PMID:27060168
    reference_title: "Haploinsufficiency for NR3C1, the gene encoding the glucocorticoid receptor, in blastic plasmacytoid dendritic cell neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency for NR3C1 defined a subset of BPDCN with lowered GCR expression and extremely poor overall survival (P = .0006)."
    explanation: Establishes both the reduced receptor expression and the prognostic consequence.

- name: UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
  description: >-
    Phylogenomic reconstruction places ultraviolet damage *before* the
    alterations associated with malignant transformation in at least some
    tumours - the source says UV damage "can precede" them, and BPDCN skin
    tumours appear first at sun-exposed anatomical sites carrying clonally
    expanded UV mutational signatures. The selection mechanism is
    lineage-specific: Tet2 loss of function confers resistance to UV-induced
    cell death in plasmacytoid but not conventional dendritic cells. The
    founder lesion therefore does more than permit transformation — it
    determines *where* the premalignant clone survives, which is why the
    disease presents in skin.
  biological_scale: CELLULAR
  genes:
  - preferred_term: TET2
    term:
      id: hgnc:25941
      label: TET2
  triggers:
  - preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  downstream:
  - target: Cutaneous Infiltration by Malignant pDC Blasts
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Preferential survival of the mutant clone at sun-exposed sites is the
      proposed reason the resulting tumours arise there.
    evidence:
    - reference: PMID:37286599
      reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We observe that BPDCN skin tumours first develop at sun-exposed anatomical sites and are distinguished by clonally expanded mutations induced by ultraviolet (UV) radiation."
      explanation: >-
        Ties the anatomical distribution of the tumours to UV exposure, which
        is the causal claim this edge makes.
  evidence:
  - reference: PMID:37286599
    reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we find that loss-of-function mutations in Tet2, the most common premalignant alteration in BPDCN, confer resistance to UV-induced cell death in plasmacytoid, but not conventional, dendritic cells"
    explanation: >-
      Establishes the lineage-specific survival advantage that this node
      proposes as the selection mechanism.
  - reference: PMID:37286599
    reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A reconstruction of tumour phylogenies reveals that UV damage can precede the acquisition of alterations associated with malignant transformation"
    explanation: >-
      Supports the ordering claim - UV damage before transformation - that
      makes this a selective step rather than a consequence of the tumour.

- name: Aberrant Cell Adhesion Program
  description: >-
    Transcriptome analysis shows upregulation of cell-cell and cell-matrix
    interaction programs, the expected consequence of IKZF1 deficiency. This
    is the closest thing the literature currently offers to a mechanism for
    the disease's characteristic tissue tropism, and it remains an association
    rather than a demonstrated cause of skin homing.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  downstream:
  - target: Cutaneous Infiltration by Malignant pDC Blasts
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Proposed, not demonstrated. The adhesion program is an association in
      bulk tumour transcriptome; no experiment ties it to skin homing.
  evidence:
  - reference: PMID:31846142
    reference_title: "Whole-genome analysis uncovers recurrent IKZF1 inactivation and aberrant cell adhesion in blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "up-regulation of cellular processes responsible for cell-cell and cell-ECM interactions, which is a hallmark of IKZF1 deficiency, was prominent in BPDCN"
    explanation: Reports the adhesion-program upregulation and attributes it to IKZF1 deficiency.

- name: Clonal Expansion of pDC-Lineage Blasts
  description: >-
    The differentiation-arrested, apoptosis-resistant clone expands, and this
    expanded population is what subsequently distributes to skin, marrow,
    blood, lymph nodes and the leptomeninges.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: malignant plasmacytoid dendritic cell blast
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Cutaneous Infiltration by Malignant pDC Blasts
    causal_link_type: DIRECT
  - target: Bone Marrow and Leukemic Dissemination
    causal_link_type: DIRECT
  - target: Central Nervous System Infiltration
    causal_link_type: DIRECT
  - target: Lymphoid Organ Infiltration
    causal_link_type: DIRECT
  - target: Diphthamide Pathway Silencing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Acquired within the expanded clone under selective pressure from
      CD123-directed toxin therapy. This edge is therapy-conditional rather
      than part of the untreated causal chain, and the steps between clonal
      expansion and the silencing event are not established.
  - target: T Cell Exhaustion in the Marrow Microenvironment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27986708
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm Is Dependent on BCL2 and Sensitive to Venetoclax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blastic plasmacytoid dendritic cell neoplasm (BPDCN) is an aggressive hematologic malignancy that presents with skin nodules and tumors, lymph node and splenic enlargement, central nervous system involvement, circulating leukemia, and/or bone marrow infiltration"
    explanation: Enumerates the compartments the expanded clone reaches, which are this node's downstream targets.

- name: Cutaneous Infiltration by Malignant pDC Blasts
  description: >-
    Blasts infiltrate the dermis and extend into subcutaneous fat, producing
    the disseminated erythematous to bluish-livid plaques and nodules that are
    the presenting sign in the great majority of patients. Cutaneous
    involvement characteristically precedes marrow and nodal dissemination.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:35788129
    reference_title: "Integrative molecular profiling identifies two molecularly and clinically distinct subtypes of blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cutaneous involvement often precedes bone marrow infiltration and dissemination into lymph nodes or other organs while primary leukemic disease is rare."
    explanation: Establishes the temporal precedence of the cutaneous compartment over marrow and nodal involvement.
  - reference: PMID:37407876
    reference_title: "[Blastic plasmacytoid dendritic cell neoplasm (BPDCN) : A rare hematologic neoplasm with frequent cutaneous involvement]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blastic plasmacytoid dendritic cell neoplasm (BPDCN) is a rare hematological malignancy that derives from precursors of plasmacytoid dendritic cells and is characterized by disseminated, erythematous or bluish-livid plaques or nodi."
    explanation: Describes the characteristic morphology of the cutaneous lesions this node produces.

- name: Bone Marrow and Leukemic Dissemination
  description: >-
    Marrow infiltration and circulating blasts follow, displacing normal
    haematopoiesis.
  biological_scale: TISSUE
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  downstream:
  - target: Marrow Failure Cytopenias
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BPDCN arises from plasmacytoid dendritic cells, manifesting primarily in the skin, bone marrow, and lymph nodes, occasionally involving the central nervous system (CNS)."
    explanation: Names marrow as a primary compartment of involvement.

- name: Marrow Failure Cytopenias
  description: >-
    Replacement of normal marrow produces anaemia, thrombocytopenia and
    neutropenia, with the attendant risks of infection and bleeding.
  biological_scale: ORGANISM
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:40525728
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): 2025 Update on Diagnosis, Pathophysiology, Risk Assessment, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Potential risk factors for shortened survival include older age, overt bone marrow involvement, and genetic abnormalities."
    explanation: >-
      Establishes overt marrow involvement as a clinically consequential
      state. Note it supports the marrow-replacement premise, not the
      cytopenias themselves; no cohort reporting anaemia, thrombocytopenia
      and neutropenia frequencies in BPDCN was found in this session, so the
      individual cytopenia phenotypes carry their own evidence where any
      exists rather than leaning on this item.

- name: Central Nervous System Infiltration
  description: >-
    Leptomeningeal involvement is characteristically occult: patients are
    usually neurologically asymptomatic, so it is missed unless cerebrospinal
    fluid is examined deliberately, and it most often becomes apparent at
    relapse. That combination - clinically silent, and therefore not ruled out
    by a normal neurological examination - is why CNS assessment and treatment
    are handled as a mandatory part of first-line management rather than as a
    reaction to symptoms. A frequently quoted figure of roughly 30% occult
    involvement at diagnosis is not curated here: it traces to a source this
    session did not fetch.
  biological_scale: TISSUE
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This presents challenges in diagnosis and treatment, with CNS involvement often overlooked in standard diagnostic workups due to BPDCN's rarity and patients often being neurologically asymptomatic at diagnosis."
    explanation: States that CNS involvement is present but clinically silent and therefore under-detected.

- name: Diphthamide Pathway Silencing
  description: >-
    Acquired resistance to tagraxofusp does not run through loss of the
    target. CD123 is retained; what the cell loses is the diphthamide
    biosynthesis pathway, silenced by DNA methylation, and diphthamide is the
    modified histidine residue the diphtheria-toxin moiety needs in order to
    ADP-ribosylate elongation factor 2. The drug still binds and still enters
    - it simply has nothing to act on. This is why a hypomethylating agent,
    which restores the pathway, is a rational partner rather than merely an
    additive cytotoxic.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:38338733
    reference_title: "Breakthrough in Blastic Plasmacytoid Dendritic Cell Neoplasm Cancer Therapy Owing to Precision Targeting of CD123."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Resistance in cancer cells does not stem from CD123 loss but rather from their ability to resist the diphtheria toxin, facilitated by the DNA methylation-induced silencing of genes in the diphthamide synthesis pathway"
    explanation: >-
      States both halves of this node: that resistance is not target loss, and
      that it is methylation-driven silencing of the diphthamide pathway.

- name: T Cell Exhaustion in the Marrow Microenvironment
  description: >-
    Single-cell profiling of BPDCN marrow shows T cells with an upregulated
    interferon-alpha response, downregulated TNF-alpha signalling, and
    exhaustion that scales with clonotype expansion — an immunosuppressive
    niche around a tumour that is itself made of professional
    interferon-producing immune cells.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD8-positive T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  evidence:
  - reference: PMID:35359938
    reference_title: "Single-Cell Multiomics Reveals Clonal T-Cell Expansions and Exhaustion in Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Integrating transcriptional data with T-cell receptor sequencing via shared barcodes reveals significant T-cell exhaustion in BPDCN that is positively correlated with T-cell clonotype expansion."
    explanation: Direct single-cell evidence for the T-cell exhaustion this node asserts.
  - reference: PMID:35359938
    reference_title: "Single-Cell Multiomics Reveals Clonal T-Cell Expansions and Exhaustion in Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T-cells in BPDCN patients consistently upregulate interferon alpha (IFNA) response and downregulate tumor necrosis factor alpha (TNFA) pathways"
    explanation: Supports the specific pathway directions described in this node.


treatments:
- name: Tagraxofusp
  description: >-
    An approved CD123-directed cytotoxin consisting of human interleukin-3 fused to truncated diphtheria toxin.
    Receptor-mediated uptake delivers the toxin to inhibit protein synthesis. In the long-term trial analysis,
    65 treatment-naive patients had a 75% overall response rate and 57% CR/CRc; median response duration was
    24.9 months. Capillary leak syndrome, including fatal events, is an important toxicity. This fusion toxin
    is not protein replacement.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tagraxofusp
      term:
        id: NCIT:C64769
        label: Tagraxofusp-erzs
  target_mechanisms:
  - target: CD123 Overexpression on Malignant pDC Blasts
    description: >-
      The agent's IL-3 moiety uses the node's own overexpressed receptor as
      its address.
    evidence:
    - reference: PMID:31018069
      reference_title: "Tagraxofusp in Blastic Plasmacytoid Dendritic-Cell Neoplasm."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Tagraxofusp (SL-401) is a CD123-directed cytotoxin consisting of human interleukin-3 fused to truncated diphtheria toxin."
      explanation: States the mechanism by which the drug engages the CD123 node.
      quote_role: BACKGROUND
      directness: DIRECT
  evidence:
  - reference: PMID:35820082
    reference_title: "Long-Term Benefits of Tagraxofusp for Patients With Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For treatment-naive patients, the overall response rate was 75%; 57% achieved CR + CRc."
    explanation: Long-term efficacy result from the largest prospective BPDCN trial.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35820082
    reference_title: "Long-Term Benefits of Tagraxofusp for Patients With Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Capillary leak syndrome occurred in 21% of patients (grade ≥ 3: 7%)."
    explanation: Quantifies the characteristic toxicity this treatment's description warns about.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Venetoclax
  description: >-
    A BCL2 inhibitor used off-label and in investigational combinations for BPDCN. Functional profiling showed
    BCL2 dependence in the studied BPDCN samples, without proving universal clinical sensitivity. Two initially
    reported salvage patients had short-lived or compartment-specific responses; one had no appreciable marrow
    response at four weeks. Combination regimens now have prospective BPDCN data.

experimental_models:
- name: CAL-1 and GEN2.2 BPDCN cell lines
  experimental_model_type: CELL_LINE
  description: >-
    The two established human BPDCN cell lines used across the mechanistic
    literature. They were the platform for the RNAi and drug screens that
    identified the TCF4-BRD4 dependency.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:27846392
  modeled_mechanisms:
  - target: TCF4-Dependent Super-Enhancer Network Addiction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The lines reproduce the BPDCN-specific TCF4-driven transcriptional
      program and die when it is disrupted genetically or pharmacologically.
    limitations: >-
      Established lines carry the transcriptional dependency but not the
      clonal-evolution history (founder TET2/ASXL1 lesions, transformation
      from an antecedent myeloid neoplasm) or the immune microenvironment,
      so they cannot report on the initiating steps of the chain.
    evidence:
    - reference: PMID:27846392
      reference_title: "A Druggable TCF4- and BRD4-Dependent Transcriptional Network Sustains Malignancy in Blastic Plasmacytoid Dendritic Cell Neoplasm."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "its downregulation caused the loss of the BPDCN-specific gene expression program and apoptosis"
      explanation: Establishes the lines as informative for the TCF4 dependency node.

      quote_role: PRIMARY_RESULT
      directness: DIRECT
- name: Tet2-edited HOXB8 dendritic differentiation culture
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Mus musculus
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  description: >-
    Mouse marrow progenitors immortalized with estrogen-responsive HOXB8 are gene-edited and differentiated
    into pDCs and cDCs after estrogen withdrawal. UV exposure is applied ex vivo during differentiation.
  publication: PMID:37286599
  modeled_mechanisms:
  - target: UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Tet2 knockout preferentially increases pDC survival after UV exposure.
    limitations: >-
      The experiment tests lineage-specific UV survival in culture. It does not reproduce skin homing, complete
      malignant transformation or systemic dissemination.
    evidence:
    - reference: PMID:37286599
      reference_title: Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        After UV exposure (100, 500 μJ cm−2), Tet2 knockout caused a further increase in the proportion of
        surviving
        pDCs, but had no protective effect on cDCs (Fig. 5e).
      explanation: >-
        Tet2 knockout was tested in differentiated mouse HOXB8 cultures ex vivo, not by inducing skin tumors
        with UV in living mice.
      quote_role: PRIMARY_RESULT
animal_models:
- name: BPDCN patient-derived xenograft
  species: Mouse
  genotype: Immunodeficient host engrafted with primary patient BPDCN cells
  description: >-
    Xenografts of primary patient BPDCN cells in immunodeficient mice, used to
    test BCL2 inhibition in vivo before the first off-label human use.
  publication: PMID:27986708
  modeled_mechanisms:
  - target: BCL2-Dependent Survival of Malignant pDCs
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Patient-derived xenografts retain the BCL2 dependence measured in
      primary cells and respond to venetoclax in vivo.
    limitations: >-
      Immunodeficient hosts cannot reproduce the T-cell exhaustion and
      interferon-skewed microenvironment described in patient marrow, so the
      model is silent on the immune component of the disease.
    evidence:
    - reference: PMID:27986708
      reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm Is Dependent on BCL2 and Sensitive to Venetoclax."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Animals bearing BPDCN patient-derived xenografts had disease responses and improved survival after venetoclax treatment in vivo"
      explanation: Establishes the xenograft as informative for the BCL2-dependent survival node.

      quote_role: PRIMARY_RESULT
      directness: DIRECT
- name: MYB fusion-driven myeloid-dendritic acute leukemia mouse
  species: Mouse
  genotype: MYB::PLEKHO1 or truncated MYB in Hoxb8-FL hematopoietic progenitors, with genotype-specific Cdkn2a status
  description: >-
    Transplanted Hoxb8-FL-derived cells expressing MYB::PLEKHO1 induced myeloid-dendritic leukemia with intact
    or deleted Cdkn2a. Truncated MYB required Cdkn2a knockout in this system.
  publication: PMID:39499902
  modeled_mechanisms:
  - target: Plasmacytoid Dendritic Cell Differentiation Block
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model reproduces the differentiation block and transformation caused
      by a MYB fusion.
    limitations: >-
      The leukemia is myeloid-dendritic rather than a complete phenocopy of human BPDCN. Hoxb8 immortalization
      creates a nonphysiological progenitor state, and the cooperating-lesion requirement differs between MYB
      constructs.
    evidence:
    - reference: PMID:39499902
      reference_title: "BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "expression of MYB fusions in vivo impaired DC differentiation and induced transformation to generate a mouse model of myeloid-dendritic acute leukemia."
      explanation: Establishes the model and the differentiation-block phenotype it reproduces.

      quote_role: PRIMARY_RESULT
      directness: DIRECT
    - reference: PMID:39499902
      reference_title: BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        In contrast to MYB-TR, MYB::PLEKHO1 did not require Cdkn2a KO to initiate leukemia in Hoxb8-FL cells.
      explanation: >-
        The two MYB constructs have different requirements for a cooperating cell-cycle lesion.
      quote_role: PRIMARY_RESULT
- name: Zrsr2 and Tet2 edited marrow chimera
  species: Mouse
  genotype: Cas9 marrow progenitors edited for Zrsr2, Tet2 or both, transplanted into irradiated wild-type recipients
  description: >-
    Eight-week marrow-chimera experiments test the effects of BPDCN-associated founder lesions on hematopoiesis,
    pDC abundance, RNA splicing and activation.
  publication: PMID:34615655
  modeled_mechanisms:
  - target: Blunted TLR-Induced pDC Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Mutant pDCs show altered splicing and reduced activation after a TLR agonist.
    limitations: >-
      No BPDCN or overt clonal evolution was observed in these short-term experiments. The model supports premalignant
      phenotypes, not sufficiency for malignant transformation.
    evidence:
    - reference: PMID:34615655
      reference_title: Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        In vivo, Zrsr2/Tet2-mutant pDCs had impaired activation after systemic exposure to R848 (Fig. 7F).
      explanation: >-
        Edited marrow chimeras reproduce reduced pDC activation in vivo.
      quote_role: PRIMARY_RESULT
environmental:
- name: Cutaneous ultraviolet radiation exposure
  description: >-
    UV-associated mutational signatures in BPDCN skin tumors and human clonal reconstructions implicate exposure
    during a cutaneous route to disease. Tet2-edited cultures support lineage-specific survival selection.
    These data do not estimate population-level risk per UV dose or establish UV as necessary for every BPDCN.
  exposure_term:
    preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  influences_mechanisms:
  - target: UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      UV exposure imposes the selective pressure under which Tet2-deficient pDCs preferentially survive in
      the ex vivo differentiation assay.
    evidence:
    - reference: PMID:37286599
      reference_title: Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        After UV exposure (100, 500 μJ cm−2), Tet2 knockout caused a further increase in the proportion of
        surviving
        pDCs, but had no protective effect on cDCs (Fig. 5e).
      explanation: >-
        Tet2 knockout was tested in differentiated mouse HOXB8 cultures ex vivo, not by inducing skin tumors
        with UV in living mice.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:37286599
    reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BPDCN skin tumours first develop at sun-exposed anatomical sites and are distinguished by clonally expanded mutations induced by ultraviolet (UV) radiation"
    explanation: >-
      Establishes the exposure's fingerprint in the tumours themselves rather
      than by epidemiologic inference.

    quote_role: PRIMARY_RESULT
    directness: DIRECT

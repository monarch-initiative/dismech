mechanistic_hypotheses:
- hypothesis_group_id: UV_ASSOCIATED_TRANSFORMATION
  hypothesis_label: UV selection during a cutaneous route to BPDCN
  status: EMERGING
  description: >-
    Human phylogenies and ex vivo Tet2 experiments support UV selection in a subset of BPDCN. The intervening
    transformation steps and applicability to noncutaneous disease remain unresolved.
  evidence:
  - reference: PMID:37286599
    reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A reconstruction of tumour phylogenies reveals that UV damage can precede the acquisition of alterations associated with malignant transformation"
    explanation: >-
      Supports the ordering claim - UV damage before transformation - that
      makes this a selective step rather than a consequence of the tumour.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
- hypothesis_group_id: ADHESION_SKIN_TROPISM
  hypothesis_label: Adhesion-gene dysregulation contributes to skin homing
  status: EMERGING
  description: >-
    IKZF1-associated expression changes may promote tissue retention or homing. Functional BPDCN migration
    and tissue-homing studies are needed.
  evidence:
  - reference: PMID:31846142
    reference_title: "Whole-genome analysis uncovers recurrent IKZF1 inactivation and aberrant cell adhesion in blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "up-regulation of cellular processes responsible for cell-cell and cell-ECM interactions, which is a hallmark of IKZF1 deficiency, was prominent in BPDCN"
    explanation: Reports the adhesion-program upregulation and attributes it to IKZF1 deficiency.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
- hypothesis_group_id: CHRONIC_IFN_TCELL_EXHAUSTION
  hypothesis_label: Accumulated blasts sustain interferon-associated T-cell exhaustion
  status: EMERGING
  description: >-
    The small single-cell study supports expression and clonotype associations; tumor-derived chronic interferon
    as their cause requires direct perturbation.
  evidence:
  - reference: PMID:35359938
    reference_title: Single-Cell Multiomics Reveals Clonal T-Cell Expansions and Exhaustion in Blastic Plasmacytoid Dendritic Cell Neoplasm.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      We hypothesize that, despite the tumor cells exhibiting lower IFNA production at the individual cell
      level, abnormal accumulation of pDC-like tumor cells in BPDCN may lead to increased IFNA production and
      chronic T-cell activation, eventually leading to T-cell exhaustion and consequent TNFA downregulation.
    explanation: >-
      The authors propose this sequence; cytokine production and its causal contribution were not experimentally
      demonstrated.
    quote_role: PRIMARY_RESULT

- name: CDKN2A and CDKN2B Deletion at 9p21.3
  description: >-
    Recurrent copy-number loss at chromosome 9p21.3 removes CDKN2A/CDKN2B cell-cycle inhibitors. CDKN1B and
    RB1 can also be deleted in BPDCN, but they reside on chromosomes 12 and 13, respectively, and are separate
    lesions. Loss of CDKN2A can cooperate with MYB-driven cell-cycle deregulation.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  - preferred_term: CDKN2B
    term:
      id: hgnc:1788
      label: CDKN2B
  downstream:
  - target: Clonal Expansion of pDC-Lineage Blasts
    description: >-
      Loss of the G1/S checkpoint can cooperate with MYB-mediated cell-cycle deregulation; this interaction
      is demonstrated in an engineered mouse model.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39499902
      reference_title: BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Interestingly, we found that, in the case of MYB-TR (which models the MYB::ZFAT fusion recurrent in
        BPDCN) (2), overriding the G1/S checkpoint by Cdkn2a KO was also required for leukemic transformation.
      explanation: >-
        Cdkn2a loss cooperated specifically with truncated MYB in the Hoxb8-derived mouse transplantation model.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:30381297
    reference_title: 'Blastic plasmacytoid dendritic cell neoplasm: genomics mark epigenetic dysregulation as a primary therapeutic target.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Whole-exome sequencing data were also used for cytogenetic CNV analysis, which highlighted extensive
      losses along the chromosome 9 and the associated deletion of the tumor suppressor CDKN2A gene in 8 out
      of 14 BPDCN samples (57%) (Online Supplementary Figure S2), as already reported in the literature.12,15,20
    explanation: >-
      Primary copy-number analysis directly supports chromosome-9 CDKN2A loss; the other tumor suppressors
      are on different chromosomes.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34615655
    reference_title: Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      These included loss of 7p (which harbors IKZF1), 9p (CDKN2A, CDKN2B), 12p (CDKN1B, ETV6), 13q (RB1),
      and 17p (TP53; Supplementary Fig. S2).
    explanation: >-
      Copy-number analysis of purified BPDCN cells places the recurrent losses on separate chromosomes.
    quote_role: PRIMARY_RESULT
- name: MYC Rearrangement at 8q24
  description: >-
    Rearrangement of the MYC locus, most often partnered with 6p21 (RUNX2)
    rather than an immunoglobulin locus, driving MYC overexpression. Reported
    frequencies differ substantially by cohort and ascertainment - 12% in one
    single-institution karyotype series, about a third in a cytogenetics
    review - and the rearranged cases are associated with an immunoblastoid
    cytomorphology.
  biological_scale: MOLECULAR
  genes:

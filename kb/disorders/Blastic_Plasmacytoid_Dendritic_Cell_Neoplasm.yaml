histopathology:
- name: Blastic Dermal Infiltrate
  description: >-
    A diffuse infiltrate of blastoid cells in an involved site. The
    morphology alone is not diagnostic and WHO-5 requires immunophenotypic
    confirmation, which is the only claim evidenced here; the commonly
    described dermal-to-subcutis extension is not separately cited and so is
    not asserted.
  finding_term:
    preferred_term: diffuse blastic infiltrate of dermis and subcutis
  diagnostic: false
  evidence:
  - reference: PMID:37946878
    reference_title: "A Case of Acute Myeloid Leukemia Mimicking Blastic Plasmacytoid Dendritic Cell Neoplasm: Utility of the Proposed Upcoming WHO-5 Diagnostic Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the morphology is not specific, and diagnostic characterization requires integration of immunophenotypic and genetic testing"
    explanation: Establishes that the morphologic finding alone does not carry the diagnosis.
  - reference: PMID:40525728
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): 2025 Update on Diagnosis, Pathophysiology, Risk Assessment, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is based on biopsy of an involved site and is typically based on the identification of blastoid cells displaying the classical immunophenotypes CD123, CD4, and CD56 in addition to specific pDC markers."
    explanation: >-
      Names the blastoid morphology on biopsy that this finding records, from
      a BPDCN source rather than from the AML case report above.

- name: CD123-Positive pDC Immunophenotype
  description: >-
    Co-expression of CD123 with pDC markers (TCF4, TCL1, CD303/BDCA2,
    CD304/BDCA4) and CD4 and/or CD56, in the absence of CD3, CD19, CD34,
    myeloperoxidase and lysozyme.
  finding_term:
    preferred_term: CD123-positive plasmacytoid dendritic cell immunophenotype
  diagnostic: true
  evidence:
  - reference: PMID:30323983
    reference_title: "Early detection of transformation to BPDCN in a patient with MDS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by neoplastic cells that are positive for CD123, CD4, BDCA2, and TCL1 and aberrant expression of CD56"
    explanation: States the marker combination that defines this immunophenotypic finding.

diagnosis:
- name: Immunophenotyping by Flow Cytometry or Immunohistochemistry
  description: >-
    The diagnosis is immunophenotypic. WHO-5 tightened the criteria
    specifically because acute myeloid leukaemia — monocytic subtypes in
    particular — can express CD4, CD56 and CD123 and mimic BPDCN morphologically.
  evidence:
  - reference: PMID:37946878
    reference_title: "A Case of Acute Myeloid Leukemia Mimicking Blastic Plasmacytoid Dendritic Cell Neoplasm: Utility of the Proposed Upcoming WHO-5 Diagnostic Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the overlapping features of acute myeloid leukemia and BPDCN, the 5th Edition of the World Health Organization (WHO) Classification of Haematolymphoid Tumours provides new criteria for the diagnosis of BPDCN."
    explanation: Explains why the WHO-5 immunophenotypic criteria exist and what they disambiguate.

- name: Cerebrospinal Fluid Examination
  description: >-
    Deliberate CSF examination at diagnosis, because CNS involvement is
    frequently present while the patient is neurologically asymptomatic.
  evidence:
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "with CNS involvement often overlooked in standard diagnostic workups due to BPDCN's rarity and patients often being neurologically asymptomatic at diagnosis"
    explanation: Justifies CSF examination as a deliberate rather than symptom-triggered step.

- name: Myeloid Next-Generation Sequencing Panel
  description: >-
    Targeted sequencing characterizes the clone and identifies prognostically
    relevant lesions, notably TET2 truncating mutations.
  evidence:
  - reference: PMID:36689729
    reference_title: "TET2 truncating mutations predict a worse outcome in blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In multivariate analysis, having at least 1 TET2 truncating mutation was the only risk factor significantly associated with overall survival"
    explanation: Identifies the specific sequencing result that carries prognostic weight.

differential_diagnoses:
- name: Acute Myeloid Leukemia with Monocytic Differentiation
  description: >-
    Acute monocytic leukaemia can express CD4, CD56 and CD123 and share the
    blastic morphology. Myeloperoxidase and lysozyme expression, and the
    absence of the full pDC marker set, resolve it.
  evidence:
  - reference: PMID:37946878
    reference_title: "A Case of Acute Myeloid Leukemia Mimicking Blastic Plasmacytoid Dendritic Cell Neoplasm: Utility of the Proposed Upcoming WHO-5 Diagnostic Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tandem flow cytometry showed an atypical population of dim CD45 events with expression of CD4, CD56, CD117, CD123, and monocytic markers such as CD64."
    explanation: A worked case in which AML reproduced the BPDCN marker profile, which is what makes this the key differential.

- name: Mature Plasmacytoid Dendritic Cell Proliferation Associated with Myeloid Neoplasm
  description: >-
    MPDMN is BPDCN's sibling under the same WHO-5 family and the hardest
    differential: the same lineage, frequently the same antecedent myeloid
    neoplasm, distinguished by the proliferating pDCs being mature rather than
    blastic. The distinction matters because the treatment paths diverge
    completely. Not otherwise curated in this entry - flagged here because a
    reader working from the CD123/CD4/CD56 immunophenotype alone will not
    separate them.
  notes: >-
    Left without a dedicated evidence item: no cached reference in this
    session characterizes MPDMN directly, and citing a BPDCN paper for a
    claim about a different entity is the failure mode this differential
    exists to warn about.

- name: Leukemia Cutis and Myeloid Sarcoma
  description: >-
    Cutaneous involvement by acute myeloid leukemia. Shares the site and the
    blastic morphology; separated by myeloperoxidase and lysozyme expression
    and the absence of the pDC marker set.
  evidence:
  - reference: PMID:40525728
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): 2025 Update on Diagnosis, Pathophysiology, Risk Assessment, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is based on biopsy of an involved site and is typically based on the identification of blastoid cells displaying the classical immunophenotypes CD123, CD4, and CD56 in addition to specific pDC markers."
    explanation: >-
      States the marker requirement - specific pDC markers on top of the
      CD123/CD4/CD56 triad - that separates BPDCN from myeloid infiltrates
      sharing that triad.


    term:
      id: GO:0008380
      label: RNA splicing
  downstream:
  - target: IRF7 Intron Retention and Impaired Induction
    description: >-
      ZRSR2 dysfunction is associated with retention of IRF7 intron 4 and reduced inducibility; CAL1 rescue
      experiments support the causal chain.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34615655
      reference_title: Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        IRF7 intron 4 was aberrantly retained in ZRSR2-mutant BPDCN (2 of 2), and the same intron–exon region
        was also misspliced in SRSF2-mutated (4 of 4) and SF3B1-mutated (1 of 1) cases but not in splicing
        factor wild-type BPDCN or in normal pDCs (Supplementary Table S4).
      explanation: >-
        IRF7 intron 4 is a weak, delayed-spliced U2-type intron; it is not a U12 intron.
      quote_role: PRIMARY_RESULT

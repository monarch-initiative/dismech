    systemic therapy. In a small prospective series, all six CSF-positive patients assessed at diagnosis cleared
    CSF tumor cells after intrathecal treatment; nonrandomized survival comparisons cannot isolate its effect.
    The 2026 ASTCT guideline also recommends post-HCT intrathecal chemotherapy regardless of prior CNS involvement.

treatments:
- name: Tagraxofusp
  description: >-
    A CD123-directed cytotoxin: human interleukin-3 fused to truncated
    diphtheria toxin. Binding to CD123 drives receptor-mediated
    internalization and toxin-mediated protein-synthesis arrest. It is the
    only agent approved specifically for BPDCN. Capillary leak syndrome is the
    characteristic toxicity and requires monitoring of albumin, weight and
    blood pressure.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tagraxofusp
      term:
        id: NCIT:C64769
        label: Tagraxofusp-erzs
  target_mechanisms:
  - target: CD123 Overexpression on Malignant pDC Blasts
    description: >-
      The agent's IL-3 moiety uses the node's own overexpressed receptor as
      its address.
    evidence:
    - reference: PMID:31018069
      reference_title: "Tagraxofusp in Blastic Plasmacytoid Dendritic-Cell Neoplasm."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Tagraxofusp (SL-401) is a CD123-directed cytotoxin consisting of human interleukin-3 fused to truncated diphtheria toxin."
      explanation: States the mechanism by which the drug engages the CD123 node.
  evidence:
  - reference: PMID:35820082
    reference_title: "Long-Term Benefits of Tagraxofusp for Patients With Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For treatment-naive patients, the overall response rate was 75%; 57% achieved CR + CRc."
    explanation: Long-term efficacy result from the largest prospective BPDCN trial.
  - reference: PMID:35820082
    reference_title: "Long-Term Benefits of Tagraxofusp for Patients With Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Capillary leak syndrome occurred in 21% of patients (grade ≥ 3: 7%)."
    explanation: Quantifies the characteristic toxicity this treatment's description warns about.

- name: Venetoclax
  description: >-
    A BCL2 inhibitor. Primary BPDCN cells are uniformly BCL2-dependent by BH3
    profiling, so sensitivity is a lineage property rather than a
    biomarker-selected one. Used off-label and in combination regimens,
    including with azacitidine to re-sensitize tagraxofusp-resistant disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: venetoclax
      term:
        id: CHEBI:133021
        label: venetoclax
  target_mechanisms:
  - target: Apoptosis Resistance in the pDC Compartment
    description: BCL2 inhibition restores the apoptotic response this node blocks.
    evidence:
    - reference: PMID:27986708
      reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm Is Dependent on BCL2 and Sensitive to Venetoclax."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Animals bearing BPDCN patient-derived xenografts had disease responses and improved survival after venetoclax treatment in vivo"
      explanation: In vivo demonstration that inhibiting the node's effector produces disease response.
  evidence:
  - reference: PMID:27986708
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm Is Dependent on BCL2 and Sensitive to Venetoclax."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, we report on 2 patients with relapsed/refractory BPDCN who received venetoclax off-label and experienced significant disease responses."
    explanation: First human responses to BCL2 inhibition in BPDCN, from the same study establishing the dependency.

- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    Consolidation of eligible patients in remission is the recommended
    standard. What the EBMT registry actually resolves is narrower than a
    transplant-versus-no-transplant comparison, which it did not make: among
    transplanted patients, myeloablative conditioning - ideally
    total-body-irradiation based - outperformed reduced-intensity
    conditioning, and did so *independently of* being in first complete
    remission, age and performance score. So the conditioning intensity, not
    merely the graft-versus-tumour effect, carries that difference. The same
    analysis found one-year outcomes comparable between allogeneic and
    autologous transplant, and offers autologous transplant for patients
    ineligible for myeloablative allografting.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Clonal Expansion of pDC-Lineage Blasts
    description: >-
      Conditioning ablates the expanded clone, and the graft supplies a
      replacement hematopoietic system - which also replaces the premalignant
      progenitor the disease arose from.
  - target: Clonal Hematopoiesis of the Mutant Progenitor
    description: >-
      Unlike every pharmacological agent here, an allograft can remove the
      founder clone itself rather than only its malignant descendants.
  evidence:
  - reference: PMID:36550212
    reference_title: "Retrospective analysis of hematopoietic cell transplantation for blastic plasmacytoid dendritic cell neoplasm: conditioning intensity matters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among alloHCT recipients, MAC with TBI significantly improved OS and PFS, independently of CR1, age, Karnofsky index and TCD."
    explanation: Registry evidence for the conditioning-intensity effect this treatment describes.
  - reference: PMID:36550212
    reference_title: "Retrospective analysis of hematopoietic cell transplantation for blastic plasmacytoid dendritic cell neoplasm: conditioning intensity matters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accordingly, MAC (ideally based on TBI) should be preferred for alloHCT recipients with BPDCN."
    explanation: The authors' explicit recommendation, which is the clinical content of this entry.
  - reference: PMID:36550212
    reference_title: "Retrospective analysis of hematopoietic cell transplantation for blastic plasmacytoid dendritic cell neoplasm: conditioning intensity matters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients who are not elegible for MAC alloHCT, autoHCT could be considered."
    explanation: >-
      The autologous alternative, which the earlier draft omitted while
      claiming allogeneic transplant was the intervention with the clearest
      benefit.
  - reference: PMID:40525728
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): 2025 Update on Diagnosis, Pathophysiology, Risk Assessment, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Eligible patients are recommended to be consolidated with hematopoietic allogeneic stem cell transplantation."
    explanation: >-
      An independent statement of the consolidation recommendation, which the
      EBMT conditioning-intensity analysis does not itself make.

- name: Intrathecal CNS-Directed Chemotherapy
  description: >-
    Intrathecal methotrexate and/or cytarabine, given prophylactically as well
    as therapeutically, because occult leptomeningeal disease is common and
    neither tagraxofusp nor AML-type systemic regimens prevent CNS relapse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
    - preferred_term: cytarabine
      term:
        id: CHEBI:28680
        label: cytarabine
  target_mechanisms:
  - target: Central Nervous System Infiltration
    description: Intrathecal delivery reaches the compartment systemic agents do not clear.
  evidence:
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment options for CNS involvement include intrathecal (IT) chemotherapies like methotrexate and cytarabine, often in combination with systemic agents."
    explanation: Names the agents and route this treatment describes.
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tagraxofusp and traditional regimens for acute myeloid leukemia show limited success at preventing CNS relapse"
    explanation: The negative result that makes a dedicated CNS-directed arm necessary rather than redundant.

- name: Intensive Induction Chemotherapy
  description: >-
    ALL-type (hyper-CVAD) and AML- or lymphoma-type multi-agent regimens.
    These are the backbone against which tagraxofusp is positioned, and remain
    an accepted upfront option rather than a historical one.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Clonal Expansion of pDC-Lineage Blasts
    description: >-
      Cytotoxic induction acts on the proliferating blast population rather
      than on any BPDCN-specific dependency.
  evidence:
  - reference: PMID:40525728
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): 2025 Update on Diagnosis, Pathophysiology, Risk Assessment, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Either chemotherapy-based regimens or tagraxofusp, a CD123-directed interleukin 3 conjugated with diphtheria toxin, may be used for upfront therapy."
    explanation: Places chemotherapy alongside tagraxofusp as an upfront option.
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "prompting exploration of combined therapies like hyperfractionated cyclophosphamide, vincristine, doxorubicin, and dexamethasone (HyperCVAD) with venetoclax and adding IT chemotherapy to other backbones."
    explanation: Names the hyper-CVAD regimen and the venetoclax and intrathecal additions built onto it.
  - reference: PMID:38132278
    reference_title: "Blastic Plasmocytoid Dendritic Cell Neoplasm (BPDCN): Clinical Features and Histopathology with a Therapeutic Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the main therapeutic schemes used were based on chemotherapy regimens already used in the treatment of lymphomas, acute lymphoblastic leukemia (ALL) and/or acute myeloid leukemia (AML)"
    explanation: >-
      Explains why the regimens here are borrowed ones - there was no
      BPDCN-specific consensus before tagraxofusp.

- name: Hypomethylating Agent Therapy
  description: >-
    Azacitidine, alone or in combination. Beyond its general activity in
    myeloid disease it has a mechanism-specific role here: tagraxofusp
    resistance is driven by DNA-methylation silencing of the diphthamide
    biosynthesis genes the toxin needs in order to act, and azacitidine
    reverses that silencing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azacitidine
      term:
        id: NCIT:C288
        label: Azacitidine
  target_mechanisms:
  - target: Diphthamide Pathway Silencing
    description: >-
      Reversing the methylation-driven silencing restores the substrate
      tagraxofusp's toxin moiety requires.
    evidence:
    - reference: PMID:38338733
      reference_title: "Breakthrough in Blastic Plasmacytoid Dendritic Cell Neoplasm Cancer Therapy Owing to Precision Targeting of CD123."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Azacytidine has proven effective in reversing diphthamide silencing, thus addressing Tag resistance"
      explanation: States the drug acting on precisely this mechanism.

- name: All-Trans Retinoic Acid
  description: >-
    Investigational and mechanism-specific to the MYB-rearranged subset: ATRA
    causes loss of MYB protein and cell death in BPDCN. Preclinical only.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: all-trans retinoic acid
      term:
        id: CHEBI:15367
        label: all-trans-retinoic acid
  target_mechanisms:
  - target: MYB Rearrangement
    description: The proposed action is loss of the MYB protein itself.
  evidence:
  - reference: PMID:39499902
    reference_title: "BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we present evidence that all-trans retinoic acid (ATRA) may cause loss of MYB protein and cell death in BPDCN."
    explanation: The preclinical result this investigational entry rests on, hedged as the source hedges it.

- name: BET Inhibition
  description: >-
    Investigational. BET inhibitors disrupt the TCF4-dependent super-enhancer
    network and kill BPDCN cells in vitro and in xenografts. No approved agent
    exists for this indication.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: TCF4-Dependent Super-Enhancer Network Addiction
    description: BET inhibition dismantles the BRD4-bound super-enhancers the node depends on.
    evidence:
    - reference: PMID:27846392
      reference_title: "A Druggable TCF4- and BRD4-Dependent Transcriptional Network Sustains Malignancy in Blastic Plasmacytoid Dendritic Cell Neoplasm."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "High-throughput drug screening revealed that bromodomain and extra-terminal domain inhibitors (BETis) induced BPDCN apoptosis, which was attributable to disruption of a BPDCN-specific transcriptional network controlled by TCF4-dependent super-enhancers."
      explanation: Attributes the killing directly to disruption of the targeted network.
  evidence:
  - reference: PMID:27846392
    reference_title: "A Druggable TCF4- and BRD4-Dependent Transcriptional Network Sustains Malignancy in Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BETis retarded the growth of BPDCN xenografts, supporting their clinical evaluation in this recalcitrant malignancy."
    explanation: In vivo efficacy supporting the investigational status of this approach.
  - reference: PMID:27060168
    reference_title: "Haploinsufficiency for NR3C1, the gene encoding the glucocorticoid receptor, in blastic plasmacytoid dendritic cell neoplasms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "identifies BET inhibition, acting at least partially via lncRNA blockade, as a novel treatment option in BPDCN"
    explanation: >-
      An independent route to the same conclusion - BET inhibition reached
      through NR3C1-deletion biology and lincRNA-3q blockade rather than
      through the TCF4 super-enhancer screen.

- name: CD123-Directed CAR-T and CAR-NK Cell Therapy
  description: >-

discussions:
- discussion_id: bpdcn_cutaneous_tropism_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Two mechanisms are on offer for BPDCN's skin presentation - UV selection of
    TET2-mutant precursors, and an IKZF1-associated adhesion program. Are they
    the same story, competing ones, or two contributions?
  rationale: >-
    The UV account is now the better evidenced of the two: tumour phylogenies
    put UV damage before transformation, skin tumours appear first at
    sun-exposed sites, and Tet2 loss confers UV-death resistance in
    plasmacytoid but not conventional dendritic cells. It explains *where the
    premalignant clone survives*. The adhesion account is a bulk-transcriptome
    association attributed to IKZF1 deficiency, and it would explain something
    different - *where circulating blasts stop*. Nothing in the literature
    tests them against each other, and the two are not mutually exclusive:
    a clone could be selected in sun-exposed skin and separately acquire an
    adhesion program that keeps it there. Both nodes are curated, neither is
    asserted to be the mechanism, and the question is which of them the
    disseminated phase actually depends on.
  attaches_to:
  - pathophysiology#UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
  - pathophysiology#Aberrant Cell Adhesion Program
  - pathophysiology#Cutaneous Infiltration by Malignant pDC Blasts

- discussion_id: bpdcn_models_omit_founder_lesion
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the available BPDCN models capture the initiating clonal-hematopoiesis
    step, or only the maintenance program of the established tumour?
  rationale: >-
    Every model in this entry enters the disease after transformation. CAL-1
    and GEN2.2 report the TCF4-BRD4 maintenance dependency; patient-derived
    xenografts report BCL2 dependence; the MYB fusion mouse reproduces a
    differentiation block from a driver that accounts for about a fifth of
    human cases. None of them begins from the founder TET2/ASXL1 lesion in a
    hematopoietic progenitor, which is what the human sequencing data place
    first and what links BPDCN to its antecedent myeloid neoplasms. The
    consequence is that the earliest and most consistently mutated step in the
    causal chain is the one with no experimental system attached to it.
  attaches_to:
  - pathophysiology#Epigenetic Regulator Loss in a Hematopoietic Progenitor
  - experimental_models#CAL-1 and GEN2.2 BPDCN cell lines
  - animal_models#MYB fusion-driven myeloid-dendritic acute leukemia mouse

notes: >-
  Entry name. The MONDO label for MONDO:0019467 is the WHO-2001-era
  "CD4+/CD56+ hematodermic neoplasm"; this entry uses the current clinical
  name, "blastic plasmacytoid dendritic cell neoplasm", which MONDO already
  carries as a synonym on the same term. No separate MONDO term exists for the
  current name, so no mapping is required.

  Granularity. Curated at the histologic/lineage-entity level per design
  decisions 3a: BPDCN is a WHO-5 entity in its own right, not a stratum of
  another leukaemia. The C1 (typical pDC-derived) and C2 (atypical,
  conventional-DC-enriched) transcriptomic subgroups reported in
  PMID:35788129 are deliberately not curated as `has_subtypes`. They are a
  single cohort's hierarchical clustering, they have no established
  therapeutic or diagnostic consequence, and promoting them would assert a
  stability the source does not claim.

  Nosology, and a known tension. `classifications.icdo_morphology` is
  `Leukemia` and `parents` is `myeloid neoplasm`, which is the 2016/2017
  placement and is what PMID:35788129 states. WHO-HAEM5 moved BPDCN into
  *plasmacytoid dendritic cell neoplasms* under histiocytic/dendritic cell
  neoplasms, alongside MPDMN - and the granularity argument above leans on
  WHO-5. The pre-WHO-5 values are kept for now because the KB's
  `icdo_morphology` vocabulary is shared with other entries and changing this
  one in isolation would make the corpus less consistent, not more. Recorded
  here rather than silently, because the entry should not cite WHO-5 in one
  paragraph and carry the superseded placement in another without saying so.

  Two survival estimates that disagree. The institutional and trial
  literature reports median overall survival of 12-24 months, while the SEER
  population-based series reports 5-year overall survival of 43.9%. Both are
  curated, in `progression`, as separate phases rather than reconciled: the
  cohorts differ in ascertainment (SEER counts only *primary* BPDCN and its
  mean age of 53.7 years is well below the seventh-decade median reported
  elsewhere) and in treatment era. Averaging them would manufacture a number
  neither source supports.

  Therapeutic modality of tagraxofusp. Recorded as `PROTEIN_REPLACEMENT`,
  whose enum description reads "Recombinant protein or enzyme replacement
  therapy" — the first half fits, the second does not. The drug is a
  recombinant fusion toxin, not a replacement for a missing protein. No
  closer value exists, and `OTHER` would lose the fact that it is a protein
  therapeutic, so this is the least-bad binding rather than a positive claim
  that anything is being replaced.

  Not curated. Germline GATA2 deficiency is left out because the material
  describing it is about GATA2 deficiency rather than about BPDCN; reduced
  TXNRD1 as a tagraxofusp-resistance marker and the candidate PLD4 biomarker
  are left out because they trace to sources this session did not fetch. An
  earlier draft of this note also listed diphthamide-pathway methylation as
  unverified. That was wrong: PMID:38338733 is cited four times in this entry
  and states the mechanism directly, so it is now curated as its own
  pathophysiology node with a hypomethylating-agent treatment targeting it.

  Response rates from one trial. The tagraxofusp entry quotes a 75% overall
  response rate and the NCT02113982 record quotes 90%. Both are from that
  trial and neither is wrong: the 90% is the NEJM report of 29 previously
  untreated patients at the 12 microgram/kg dose, the 75% the later JCO
  analysis of all 65 treatment-naive patients at longer follow-up. Quoted
  separately, from the sources that report them, rather than reconciled.

- name: Assessment of disease distribution
  description: >-
    Skin examination, marrow evaluation and imaging establish cutaneous, marrow, nodal and other extramedullary
    involvement. CSF assessment is considered separately because imaging and neurologic examination may miss
    occult disease.
  evidence:
  - reference: PMID:38132278
    reference_title: 'Blastic Plasmocytoid Dendritic Cell Neoplasm (BPDCN): Clinical Features and Histopathology with a Therapeutic Overview.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      A Positron Emission Tomography (PET)/CT or CT scan should then be performed to study the lymph nodes
      and extramedullary sites, which may or may not indicate the execution of a lymph node biopsy.
    explanation: >-
      The review summarizes the diagnostic staging approach.
    quote_role: REVIEW_SYNTHESIS
differential_diagnoses:
- name: Acute Myeloid Leukemia with Monocytic Differentiation
  description: >-
    Acute monocytic leukaemia can express CD4, CD56 and CD123 and share the
    blastic morphology. Myeloperoxidase and lysozyme expression, and the
    absence of the full pDC marker set, resolve it.
  evidence:
  - reference: PMID:37946878
    reference_title: "A Case of Acute Myeloid Leukemia Mimicking Blastic Plasmacytoid Dendritic Cell Neoplasm: Utility of the Proposed Upcoming WHO-5 Diagnostic Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tandem flow cytometry showed an atypical population of dim CD45 events with expression of CD4, CD56, CD117, CD123, and monocytic markers such as CD64."
    explanation: A worked case in which AML reproduced the BPDCN marker profile, which is what makes this the key differential.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Mature Plasmacytoid Dendritic Cell Proliferation Associated with Myeloid Neoplasm
  description: >-
    Mature plasmacytoid dendritic cell proliferation associated with a myeloid neoplasm shares the pDC lineage
    with BPDCN but consists of mature pDCs rather than blasts. Morphology and the associated myeloid neoplasm
    are important alongside immunophenotyping.
  evidence:
  - reference: PMID:38334635
    reference_title: 'Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      While both conditions have origins with proliferation of pDCs, MPDC is characterized by findings of normal
      morphologic and mature pDC proliferation, while BPDCN differs with regard to proliferation of the immature
      pDCs or blasts.
    explanation: >-
      Review-level comparison of the two pDC neoplasm categories.
    quote_role: REVIEW_SYNTHESIS
- name: Leukemia Cutis and Myeloid Sarcoma
  description: >-
    Cutaneous involvement by acute myeloid leukemia. Shares the site and the
    blastic morphology; separated by myeloperoxidase and lysozyme expression
    and the absence of the pDC marker set.
  evidence:
  - reference: PMID:40525728
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): 2025 Update on Diagnosis, Pathophysiology, Risk Assessment, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is based on biopsy of an involved site and is typically based on the identification of blastoid cells displaying the classical immunophenotypes CD123, CD4, and CD56 in addition to specific pDC markers."
    explanation: >-
      States the marker requirement - specific pDC markers on top of the
      CD123/CD4/CD56 triad - that separates BPDCN from myeloid infiltrates
      sharing that triad.

    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT

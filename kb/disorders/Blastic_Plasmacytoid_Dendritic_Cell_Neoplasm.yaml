name: Blastic Plasmacytoid Dendritic Cell Neoplasm
creation_date: '2026-09-06T00:00:00Z'
description: >-
  Blastic plasmacytoid dendritic cell neoplasm (BPDCN) is a rare, aggressive
  haematologic malignancy arising from precursors of plasmacytoid dendritic
  cells (pDCs). It typically presents with disseminated violaceous or
  bluish-livid cutaneous plaques and nodules, followed by bone marrow,
  peripheral blood, lymph node and — often occultly — central nervous system
  involvement. Diagnosis rests on an immunophenotype combining CD123 (IL3RA)
  with pDC-lineage markers (TCF4, TCL1, CD303/BDCA2, CD304/BDCA4) and CD4
  and/or CD56, in the absence of lineage-defining myeloid, B-cell and T-cell
  markers. BPDCN is a somatic clonal disease: recurrent loss-of-function
  lesions in epigenetic regulators (TET2, ASXL1), in the X-linked splicing
  factor ZRSR2, and in the pDC differentiation factor IKZF1 arise in a
  hematopoietic progenitor, frequently on a background of clonal
  hematopoiesis shared with a preceding or concurrent myeloid neoplasm. The
  transformed clone remains addicted to the normal pDC master transcription
  factor TCF4 acting through BRD4-bound super-enhancers, retains high surface
  CD123, and depends on BCL2 for survival — the three dependencies that
  underpin its current and investigational targeted therapies.
categories:
- Hematologic Malignancy
- Dendritic Cell Neoplasm
- Acute Leukemia
parents:
- myeloid neoplasm

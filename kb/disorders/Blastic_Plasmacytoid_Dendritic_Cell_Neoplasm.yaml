- name: UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
  description: >-
    Human tumor phylogenies identify a UV-associated route in which premalignant pDC-lineage cells acquire
    UV damage in skin before or during transformation. In an ex vivo mouse HOXB8 differentiation system, Tet2
    knockout selectively protects pDCs from UV-induced death. Together these findings support selection in
    sun-exposed skin in some cases, without making UV exposure necessary for every BPDCN or demonstrating complete
    UV-driven transformation in vivo.
  biological_scale: CELLULAR
  genes:
  - preferred_term: TET2
    term:
      id: hgnc:25941
      label: TET2
  triggers:
  - preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  downstream:
  - target: Cutaneous Infiltration by Malignant pDC Blasts
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Human phylogenies and ex vivo selection experiments support a proposed UV-associated route to skin tumors;
      further transforming events intervene.
    evidence:
    - reference: PMID:37286599
      reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We observe that BPDCN skin tumours first develop at sun-exposed anatomical sites and are distinguished by clonally expanded mutations induced by ultraviolet (UV) radiation."
      explanation: >-
        Ties the anatomical distribution of the tumours to UV exposure, which
        is the causal claim this edge makes.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    hypothesis_groups:
    - UV_ASSOCIATED_TRANSFORMATION
  evidence:
  - reference: PMID:37286599
    reference_title: Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      After UV exposure (100, 500 μJ cm−2), Tet2 knockout caused a further increase in the proportion of surviving
      pDCs, but had no protective effect on cDCs (Fig. 5e).
    explanation: >-
      Tet2 knockout was tested in differentiated mouse HOXB8 cultures ex vivo, not by inducing skin tumors
      with UV in living mice.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37286599
    reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
    supports: SUPPORT

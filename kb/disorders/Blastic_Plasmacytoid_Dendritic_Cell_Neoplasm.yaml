- name: ZRSR2 Loss-of-Function Splicing Defect
  description: >-
    Loss of the X-linked splicing factor ZRSR2 causes intron retention with a strong U12-intron bias, while
    also affecting selected U2 introns. Mutations were found in 24 of 93 BPDCN cases, 23 in males and one in
    a female; truncating loss-of-function variants occurred only in males in that cohort. ZRSR2 contributes
    to the male predominance but does not explain all of it.
  biological_scale: MOLECULAR

    explanation: Names marrow as a primary compartment of involvement.

    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Marrow Failure Cytopenias
  description: >-
    Marrow infiltration can impair normal hematopoiesis and contribute to cytopenias. Anemia, thrombocytopenia
    and neutropenia are reported manifestations, but an individual cytopenia requires assessment of other causes
    and treatment effects.
  biological_scale: ORGANISM
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:38132278
    reference_title: 'Blastic Plasmocytoid Dendritic Cell Neoplasm (BPDCN): Clinical Features and Histopathology with a Therapeutic Overview.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      The most common findings in the peripheral blood are thrombocytopenia (78%), anemia (65%), and neutropenia
      (34%).
    explanation: >-
      The review records disease-associated cytopenias; it does not establish marrow replacement as the cause
      in every patient.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:27986708
    reference_title: Blastic Plasmacytoid Dendritic Cell Neoplasm Is Dependent on BCL2 and Sensitive to Venetoclax.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      His platelets had been persistently below 10,000/μL despite transfusion, predating venetoclax treatment
      and likely related to bone marrow infiltration by BPDCN.
    explanation: >-
      A BPDCN patient had severe thrombocytopenia before venetoclax; marrow infiltration was the authors' likely
      explanation.
    quote_role: PRIMARY_RESULT
- name: Central Nervous System Infiltration
  description: >-
    BPDCN blasts may infiltrate the leptomeningeal/CSF compartment while neurologic examination remains normal.
    CNS involvement is also a recognized relapse pattern. Sensitive CSF flow cytometry can detect occult disease;
    the small available cohorts do not define a uniform prevalence at diagnosis.
  biological_scale: TISSUE
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This presents challenges in diagnosis and treatment, with CNS involvement often overlooked in standard diagnostic workups due to BPDCN's rarity and patients often being neurologically asymptomatic at diagnosis."
    explanation: States that CNS involvement is present but clinically silent and therefore under-detected.

    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:26840087
    reference_title: Blastic plasmacytoid dendritic cell neoplasm frequently shows occult central nervous system involvement at diagnosis and benefits from intrathecal therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      cerebrospinal fluid (CSF) samples positive for tumor plasmacytoid dendritic cells were found in 6/10
      (60%) cases studied at diagnosis
    explanation: >-
      Flow cytometry detected occult CSF disease in six of ten newly diagnosed patients in a small prospective
      cohort; this is not a population prevalence.
    quote_role: PRIMARY_RESULT
- name: Diphthamide Pathway Silencing
  description: >-
    Acquired tagraxofusp resistance can involve reduced diphthamide-pathway activity, including methylation-associated
    DPH1 downregulation. DPH1 loss impairs the eEF2 substrate modification required for toxin-mediated ADP-ribosylation.
    CAL1 knockout/add-back and azacitidine experiments establish a reversible route; small patient and xenograft
    analyses support pathway impairment in vivo. CD123 was retained in this study, but this does not exclude
    other resistance mechanisms or antigen loss in other settings.
  biological_scale: MOLECULAR
  evidence:
  - reference: url:https://www.jci.org/articles/view/128571
    reference_title: "JCI -\nDNA methyltransferase inhibition overcomes diphthamide pathway deficiencies underlying CD123-targeted treatment resistance"
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Re-expression of full-length DPH1 also restored the cytotoxic activity of tagraxofusp in resistant cells
    explanation: >-
      DPH1 add-back directly reversed acquired resistance in CAL1 BPDCN cells.
    quote_role: PRIMARY_RESULT
  - reference: PMID:31437130
    reference_title: DNA methyltransferase inhibition overcomes diphthamide pathway deficiencies underlying CD123-targeted treatment resistance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Expression of DPH1, encoding a diphthamide pathway enzyme, was reduced by DNA CpG methylation in resistant
      cells.
    explanation: >-
      Primary study of acquired resistance; CAL1 and AML perturbation experiments establish methylation-associated
      downregulation.
    quote_role: PRIMARY_RESULT
- name: T Cell Exhaustion in the Marrow Microenvironment
  description: >-
    Single-cell profiling of five BPDCN marrows and five healthy controls found increased interferon-alpha
    response signatures, reduced TNF-alpha signaling signatures and higher CD8 memory T-cell exhaustion scores.
    TCR analysis in four evaluable patients linked larger clonotypes to higher exhaustion scores. These are
    transcriptional associations; chronic interferon secretion by accumulated tumor cells was proposed but
    not directly measured as the cause.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD8-positive T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  evidence:
  - reference: PMID:35359938
    reference_title: "Single-Cell Multiomics Reveals Clonal T-Cell Expansions and Exhaustion in Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Integrating transcriptional data with T-cell receptor sequencing via shared barcodes reveals significant T-cell exhaustion in BPDCN that is positively correlated with T-cell clonotype expansion."
    explanation: Direct single-cell evidence for the T-cell exhaustion this node asserts.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35359938
    reference_title: "Single-Cell Multiomics Reveals Clonal T-Cell Expansions and Exhaustion in Blastic Plasmacytoid Dendritic Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T-cells in BPDCN patients consistently upregulate interferon alpha (IFNA) response and downregulate tumor necrosis factor alpha (TNFA) pathways"
    explanation: Supports the specific pathway directions described in this node.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: IRF7 Intron Retention and Impaired Induction
  description: >-
    ZRSR2-mutant BPDCN retains the weak fourth intron of IRF7 and fails to increase IRF7 protein normally after
    TLR stimulation. IRF7 is not a U12-intron-containing transcript. Missplicing in SRSF2- and SF3B1-mutant
    cases indicates that this defect is not restricted to ZRSR2.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:34615655
    reference_title: Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      IRF7 intron 4 was aberrantly retained in ZRSR2-mutant BPDCN (2 of 2), and the same intron–exon region
      was also misspliced in SRSF2-mutated (4 of 4) and SF3B1-mutated (1 of 1) cases but not in splicing factor
      wild-type BPDCN or in normal pDCs (Supplementary Table S4).
    explanation: >-
      IRF7 intron 4 is a weak, delayed-spliced U2-type intron; it is not a U12 intron.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34615655
    reference_title: Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Wild-type intronless IRF7, which would not require ZRSR2 for splicing, restored LPS-induced growth arrest
      in ZRSR2-mutant cells, whereas inactive IRF7 did not (Supplementary Fig. S5D).
    explanation: >-
      Endogenous-locus intronless IRF7 rescue links the splicing defect to the impaired stimulated growth response.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Blunted TLR-Induced pDC Activation
    description: >-
      Impaired IRF7 induction blunts the inflammatory activation program.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34615655
      reference_title: Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        IRF7 and TRAIL induction by LPS were partially rescued in ZRSR2-mutant cells by overexpression of wild-type
        ZRSR2 (Fig. 6E).
      explanation: >-
        The CAL1 rescue experiment supports impaired IRF7-dependent activation and TRAIL induction downstream
        of ZRSR2 loss.
      quote_role: PRIMARY_RESULT
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
- name: Blunted TLR-Induced pDC Activation
  description: >-
    After inflammatory TLR stimulation, ZRSR2-deficient pDC-lineage cells show reduced induction of IRF7, type

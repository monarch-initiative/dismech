    explanation: >-
      A worked route for the patient group the transplant entry identifies as
      ineligible for allografting: autologous transplant used as hematopoietic
      rescue for CAR-T-induced cytopenia.
  - reference: PMID:38338733
    reference_title: "Breakthrough in Blastic Plasmacytoid Dendritic Cell Neoplasm Cancer Therapy Owing to Precision Targeting of CD123."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ongoing developments with SL-401, IMGN632, CD123 chimeric antigen receptor (CAR) T-cells, and bispecific antibodies (BsAb) show promising advancements."
    explanation: Names CD123 CAR-T among the investigational modalities under development for BPDCN.

- name: CD123-Directed Antibody-Based Agents
  description: >-
    Investigational antibody-derived biologics against CD123 — the
    antibody-drug conjugate IMGN632 (pivekimab sunirine) and CD123xCD3
    bispecific T-cell engagers. Distinct from the CAR products above in
    platform, though they address the same antigen. None is approved for
    BPDCN.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: CD123-directed antibody-based immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: pivekimab sunirine (IMGN632)
      term:
        id: NCIT:C184834
        label: Pivekimab Sunirine
  target_mechanisms:
  - target: CD123 Overexpression on Malignant pDC Blasts
    description: Both platforms bind the node's overexpressed receptor to deliver payload or recruit T cells.
  evidence:
  - reference: PMID:38338733
    reference_title: "Breakthrough in Blastic Plasmacytoid Dendritic Cell Neoplasm Cancer Therapy Owing to Precision Targeting of CD123."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ongoing developments with SL-401, IMGN632, CD123 chimeric antigen receptor (CAR) T-cells, and bispecific antibodies (BsAb) show promising advancements."
    explanation: Names the antibody-drug conjugate and bispecific platforms this entry covers.
  - reference: PMID:38338733
    reference_title: "Breakthrough in Blastic Plasmacytoid Dendritic Cell Neoplasm Cancer Therapy Owing to Precision Targeting of CD123."
    supports: SUPPORT

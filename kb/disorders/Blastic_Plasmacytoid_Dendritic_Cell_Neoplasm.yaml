- name: Clonal Hematopoiesis of the Mutant Progenitor
  description: >-
    Premalignant hematopoietic clones in the marrow can retain multilineage differentiation and share founder
    mutations with BPDCN skin tumors or another myeloid neoplasm. Additional lineage-specific alterations accompany
    transformation. Shared variants establish ancestry but do not by themselves prove that an overt myeloid
    cancer directly converted into BPDCN.
  biological_scale: CELLULAR

histopathology:
- name: Blastic Dermal Infiltrate
  description: >-
    Monomorphic small-to-medium blastoid cells can infiltrate the dermis and deep subcutis with relative epidermal
    sparing. Morphology requires an accompanying pDC immunophenotype to establish BPDCN.
  finding_term:
    preferred_term: Monomorphic blastic dermal and subcutaneous infiltrate
    term:
      id: NCIT:C38666
      label: Monomorphic Cellular Infiltrate
  diagnostic: false
  evidence:
  - reference: PMID:37407876
    reference_title: '[Blastic plasmacytoid dendritic cell neoplasm (BPDCN) : A rare hematologic neoplasm with frequent cutaneous involvement].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Direkt unterhalb der Epidermis und bis in die tiefe Subkutis hineinreichend zeigten sich relativ monomorphe klein- bis mittelgroßzellige Infiltrate mit erhöhter mitotischer Aktivität (Abb. 2)."  # codespell:ignore-line
    explanation: >-
      Direct BPDCN skin histology documents dermal-to-subcutaneous extension and monomorphic cells.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38132278
    reference_title: 'Blastic Plasmocytoid Dendritic Cell Neoplasm (BPDCN): Clinical Features and Histopathology with a Therapeutic Overview.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      The appearance of the disease in the skin biopsy consists of a typical monomorphic and diffuse infiltrate
      involving the dermis, with sparing of the epidermis and the presence of a visible Grenz zone.
    explanation: >-
      The review describes the characteristic architecture, which is not sufficient alone for diagnosis.
    quote_role: REVIEW_SYNTHESIS
- name: CD123-Positive pDC Immunophenotype
  description: >-
    WHO-5 criteria use CD123 plus another pDC marker with CD4 and/or CD56, or any three pDC markers with absent
    expected negative markers. TCF4, TCL1, CD303 and CD304 support pDC differentiation; CD3, CD14, CD34, lysozyme
    and MPO help exclude competing lineages. The CD4/CD56/CD123 triad alone can also occur in AML.
  finding_term:
    preferred_term: CD123-positive plasmacytoid dendritic cell immunophenotype
  diagnostic: true
  evidence:
  - reference: PMID:37946878
    reference_title: 'A Case of Acute Myeloid Leukemia Mimicking Blastic Plasmacytoid Dendritic Cell Neoplasm: Utility of the Proposed Upcoming WHO-5 Diagnostic Criteria.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      The suggested diagnosis criteria based on immunophenotyping requires expression of CD123 and one other
      pDC marker (e.g., TCF4, TCL1, CD303, or CD304) in addition to CD4 and/or CD56, or, expression of any
      three pDC markers and absent expression of all expected negative markers (e.g., CD3, CD14, CD34, lysozyme,
      and MPO).
    explanation: >-
      This is the discussion's summary of WHO-5 BPDCN criteria. The paper's index patient had AML and is not
      a BPDCN clinical observation.
    quote_role: BACKGROUND

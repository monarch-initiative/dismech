    Malignant cells retain a pDC-associated immunophenotype while showing abnormal differentiation and function.
    MYB perturbation models directly impair dendritic differentiation; IKZF1-related changes provide another
    proposed route. These findings do not establish a single developmental arrest point in every BPDCN.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell

  description: >-
    Diagnosis integrates tissue morphology with flow cytometry or immunohistochemistry. A pDC marker panel
    and exclusion of competing lineages distinguish BPDCN from AML mimics; expression of the CD4/CD56/CD123
    triad alone is insufficient.

- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    The 2026 ASTCT guideline recommends allogeneic HCT for eligible patients in first or second complete remission.
    Myeloablative conditioning, preferably with total-body irradiation, is recommended for younger fit patients;
    reduced-intensity conditioning is recommended for older or frail patients. HCT is not recommended after
    primary induction failure or during active relapsed/refractory BPDCN. These recommendations should not
    be replaced by a causal interpretation of retrospective conditioning comparisons.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Clonal Expansion of pDC-Lineage Blasts
    description: >-
      Consolidation aims to control residual malignant hematopoiesis after remission induction; transplant
      outcomes do not isolate a single mechanistic component.
  - target: Clonal Hematopoiesis of the Mutant Progenitor
    description: >-
      Unlike every pharmacological agent here, an allograft can remove the
      founder clone itself rather than only its malignant descendants.
  evidence:
  - reference: PMID:42612729
    reference_title: 'Hematopoietic Cell Transplantation for Blastic Plasmacytoid Dendritic Cell Neoplasm: Clinical Practice Guidelines From the American Society for Transplantation and Cellular Therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      For BPDCN in first complete remission (CR1), the panelists recommended allogeneic HCT and suggested autologous
      HCT for patients who are unfit for allogeneic HCT but without BPDCN marrow involvement.
    explanation: >-
      The 17-expert guideline defines the preferred consolidation and the narrower autologous option.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42612729
    reference_title: 'Hematopoietic Cell Transplantation for Blastic Plasmacytoid Dendritic Cell Neoplasm: Clinical Practice Guidelines From the American Society for Transplantation and Cellular Therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      The panel recommended that conditioning intensity for younger fitter patients be myeloablative, preferentially
      containing total body irradiation, whereas reduced intensity conditioning was recommended for older and/or
      frail ones, in both CR1 or CR2.
    explanation: >-
      Conditioning recommendations depend on fitness and age.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42612729
    reference_title: 'Hematopoietic Cell Transplantation for Blastic Plasmacytoid Dendritic Cell Neoplasm: Clinical Practice Guidelines From the American Society for Transplantation and Cellular Therapy.'

pathophysiology:
- name: TET2 Loss in a Hematopoietic Precursor
  description: >-
    Somatic TET2 alterations occur in premalignant marrow hematopoietic precursors that can give rise to BPDCN.
    Truncating loss-of-function variants are common, but not every reported missense allele has demonstrated
    functional loss. Multiple TET2 variants and high combined variant allele fractions suggest biallelic involvement
    in some series; these observations do not phase every pair of variants. TET2 and ASXL1 can occur in different
    orders within branching clones.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TET2
    term:
      id: hgnc:25941
      label: TET2
  downstream:
  - target: Clonal Hematopoiesis of the Mutant Progenitor
    description: >-
      TET2 alterations mark expanded ancestral clones; the human reconstruction does not isolate their sufficiency
      for clonal expansion.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37286599
      reference_title: Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Overall, founder clones contained recurrent alterations in TET2 (5 out of 5 cases, 4 out of 5 cases
        with ≥2 alterations), ASXL1 (3 out of 5 cases) and splicing-factors (3 out of 5 cases), including ZRSR2
        (2 out of 5 cases), suggesting privileged roles in premalignant evolution in BPDCN (Fig. 1e (top)).
      explanation: >-
        Human phylogenies support recurrent founder lesions, without a fixed TET2-before-ASXL1 mutation order.
      quote_role: PRIMARY_RESULT
  - target: UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
    description: >-
      Tet2 knockout selectively increases pDC survival after UV exposure in the ex vivo culture model.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37286599
      reference_title: Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        After UV exposure (100, 500 μJ cm−2), Tet2 knockout caused a further increase in the proportion of
        surviving pDCs, but had no protective effect on cDCs (Fig. 5e).
      explanation: >-
        Tet2 knockout was tested in differentiated mouse HOXB8 cultures ex vivo, not by inducing skin tumors
        with UV in living mice.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:37286599
    reference_title: Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin.
    supports: SUPPORT

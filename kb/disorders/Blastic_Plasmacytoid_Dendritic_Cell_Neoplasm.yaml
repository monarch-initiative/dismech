- name: Pivekimab Sunirine
  description: >-
    Pivekimab sunirine-pvzy (Decnupaz) is a CD123-directed antibody conjugated to an alkylating payload, FDA-approved
    for adults with BPDCN on May 27, 2026. In the FDA CADENZA analysis, CR/CRc occurred in 23/33 treatment-naive
    patients (69.7%) and 8/51 relapsed/refractory patients (15.7%), with median response durations of 9.7 and
    9.2 months. Active CNS disease was excluded. The label carries a boxed warning for hepatotoxicity including
    hepatic veno-occlusive disease; other risks include infusion reactions, edema, sulfite allergy and embryo-fetal
    toxicity. The single-arm study does not establish superiority over another treatment.

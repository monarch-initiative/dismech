discussions:
- discussion_id: bpdcn_cutaneous_tropism_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How do UV selection and adhesion-gene dysregulation contribute to cutaneous disease?
  rationale: >-
    Human phylogenies and Tet2-edited cultures support UV-associated selection during a cutaneous route in
    some BPDCN cases. IKZF1-associated adhesion signatures suggest a separate possible contribution to homing
    or retention. Neither establishes a universal explanation for skin involvement, and the two processes have
    not been directly tested together.
  attaches_to:
  - pathophysiology#UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
  - pathophysiology#Aberrant Cell Adhesion Program
  - pathophysiology#Cutaneous Infiltration by Malignant pDC Blasts
- discussion_id: bpdcn_models_omit_founder_lesion
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Which additional events convert a premalignant pDC-lineage clone into BPDCN?
  rationale: >-
    Tet2-edited HOXB8 cultures model UV survival before transformation, and Zrsr2/Tet2 marrow chimeras model
    pDC expansion and impaired activation without developing BPDCN in the reported experiment. Thus founder-lesion
    models exist, but a complete model connecting clonal hematopoiesis, tissue exposure, additional lesions
    and human BPDCN remains missing.
  attaches_to:
  - pathophysiology#TET2 Loss in a Hematopoietic Precursor
  - experimental_models#Tet2-edited HOXB8 dendritic differentiation culture
  - animal_models#Zrsr2 and Tet2 edited marrow chimera
- discussion_id: bpdcn_txnrd1_resistance
  kind: KNOWLEDGE_GAP
  prompt: Does reduced TXNRD1 cause tagraxofusp resistance in patients?
  rationale: >-
    A 12-patient study found low TXNRD1 expression in residual tumor clusters and increased CAL1 viability
    after TXNRD1 inhibition. The proposed impairment of toxin processing or translocation was not directly
    measured; inhibitor-associated survival effects also occurred without tagraxofusp. TXNRD1 is a candidate
    biomarker and resistance mechanism requiring functional rescue and prospective validation.
  attaches_to:
  - pathophysiology#Diphthamide Pathway Silencing
  evidence:
  - reference: PMID:42410207
    reference_title: Decreased TXNRD1 is associated with resistance to tagraxofusp in blastic plasmacytoid dendritic cell neoplasms, as seen in phase II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Unlike that study, we found reduced expression of TXNRD1, a key enzyme in the cytosolic release of diphtheria
      toxin, in cluster 22.
    explanation: >-
      The primary observation concerns expression in residual tumor cells; the proposed toxin-processing consequence
      remains to be tested.
    quote_role: PRIMARY_RESULT
  - reference: PMID:42410207
    reference_title: Decreased TXNRD1 is associated with resistance to tagraxofusp in blastic plasmacytoid dendritic cell neoplasms, as seen in phase II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Here, we have identified TXNRD1 as a potential biomarker of response for further investigation.
    explanation: >-
      The authors explicitly treat the marker as a candidate rather than a validated predictor.
    quote_role: PRIMARY_RESULT
- discussion_id: bpdcn_pivek_resistance
  kind: KNOWLEDGE_GAP
  prompt: Which resistance changes in pivekimab-exposed GEN2.2 cells operate in patients?
  rationale: >-
    Serial pivekimab exposure generated resistant GEN2.2 cells with reduced CD123 protein but preserved RNA
    levels and increased ABCB1 expression. The study did not establish a functional ABCB1 rescue or validate
    these routes in patients. These observations show why CD123 retention in earlier tagraxofusp models should
    not be generalized to every CD123-directed therapy.
  attaches_to:
  - pathophysiology#CD123 Overexpression on Malignant pDC Blasts
  - treatments#Pivekimab Sunirine
  evidence:
  - reference: PMID:41641634
    reference_title: 'Pivekimab sunirine in blastic plasmacytoid dendritic cell neoplasm: assessing spatial response and unraveling resistance mechanisms.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Our results showed an antigen loss (CD123) at protein levels but not RNA levels.
    explanation: >-
      Protein and transcript findings diverged in the selected GEN2.2 resistance model.
    quote_role: PRIMARY_RESULT
- discussion_id: bpdcn_neural_program
  kind: KNOWLEDGE_GAP
  prompt: Do neural-associated expression programs promote BPDCN dissemination?
  rationale: >-
    miRNA/transcriptome analysis and immunohistochemistry found neural-associated gene expression in BPDCN
    cells, including DCX, UCHL1 and cholinergic machinery. The 15-biopsy validation set lacked tumor-associated
    nerve fibers or neural cells. Marker expression does not demonstrate neurotransmitter exchange, CNS migration
    or a clinically effective neural target; functional experiments are needed.
  attaches_to:
  - pathophysiology#Central Nervous System Infiltration
  evidence:
  - reference: PMID:34572907
    reference_title: Newly-Discovered Neural Features Expand the Pathobiological Knowledge of Blastic Plasmacytoid Dendritic Cell Neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Future studies are needed to assess their mechanistic role in BPDCN metastasis and evaluate their prognostic
      and or therapeutic relevance in the BPDCN clinical setting.
    explanation: >-
      The authors identify mechanistic and clinical validation as future work, despite suggestive expression
      and staining results.
    quote_role: PRIMARY_RESULT
notes: >-
  BPDCN is a distinct plasmacytoid dendritic cell neoplasm in WHO-HAEM5. The older MONDO label CD4+/CD56+ hematodermic
  neoplasm refers to the same disease concept. Molecular heterogeneity includes founder clonal hematopoiesis,
  lineage-regulatory abnormalities and several routes to treatment resistance; no single sequence of lesions
  accounts for every case.
biochemical:
- name: PLD4 expression in BPDCN tissue
  notes: >-
    An emerging tissue biomarker, not a stand-alone diagnostic criterion or validated therapeutic target. A
    single-patient multi-organ transcriptomic analysis nominated PLD4, with immunostaining assessed in two
    six-patient BPDCN cohorts and control tissues. Some controls stained positive; the small study does not
    establish universal specificity.
  evidence:
  - reference: PMID:41219867
    reference_title: Multi-organ single-cell analysis reveals PLD4 as a biomarker and potential therapeutic target of blastic plasmacytoid dendritic cell neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The specificity was 77.08% (37/48) for CD123 and 83.33% (40/48) for PLD4.
    explanation: >-
      The measured specificity is limited to this study's control panel, despite broader specificity language
      in the abstract.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41219867
    reference_title: Multi-organ single-cell analysis reveals PLD4 as a biomarker and potential therapeutic target of blastic plasmacytoid dendritic cell neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      To further assess the diagnostic accuracy, we performed IHC analysis on skin biopsies from the second
      validation cohort of six BPDCN patients, and the results showed that PLD4 was positive in the dermis
      of all patients (Fig. S3A).
    explanation: >-
      Independent small-cohort immunostaining supports further biomarker evaluation.
    quote_role: PRIMARY_RESULT

- name: CD123 Overexpression on Malignant pDC Blasts
  description: >-
    BPDCN blasts commonly express high levels of CD123, the IL3RA subunit. This provides the binding target
    for tagraxofusp, pivekimab and investigational CD123-directed cellular therapies. Tagraxofusp delivers

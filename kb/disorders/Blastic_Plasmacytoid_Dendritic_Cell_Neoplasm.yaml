      Its R/R analysis reports 7/51, whereas FDA reports 8/51; these analyses are not pooled.
    quote_role: PRIMARY_RESULT
- name: Autologous Hematopoietic Cell Transplantation
  description: >-
    The 2026 ASTCT guideline suggests autologous HCT for selected patients in CR1 or CR2 who are unfit for
    allogeneic HCT and have no BPDCN marrow involvement. A separate investigational CAR-T/ASCT case with residual
    marrow disease does not establish the safety or efficacy of broader autologous transplantation.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:42612729
    reference_title: 'Hematopoietic Cell Transplantation for Blastic Plasmacytoid Dendritic Cell Neoplasm: Clinical Practice Guidelines From the American Society for Transplantation and Cellular Therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      For BPDCN in first complete remission (CR1), the panelists recommended allogeneic HCT and suggested autologous
      HCT for patients who are unfit for allogeneic HCT but without BPDCN marrow involvement.
    explanation: >-
      The 17-expert guideline defines the preferred consolidation and the narrower autologous option.
    quote_role: REVIEW_SYNTHESIS
- name: CD123-Directed Bispecific Antibodies
  description: >-
    Investigational CD123-directed bispecific antibodies recruit T cells to malignant blasts. They are distinct
    from the approved CD123 antibody-drug conjugate pivekimab and from engineered CAR cell products.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
  target_mechanisms:
  - target: CD123 Overexpression on Malignant pDC Blasts
    description: Bispecific binding brings effector T cells into contact with CD123-expressing tumor cells.
  evidence:
  - reference: PMID:38338733
    reference_title: Breakthrough in Blastic Plasmacytoid Dendritic Cell Neoplasm Cancer Therapy Owing to Precision Targeting of CD123.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Ongoing developments with SL-401, IMGN632, CD123 chimeric antigen receptor (CAR) T-cells, and bispecific
      antibodies (BsAb) show promising advancements.
    explanation: >-
      The review identifies bispecific-antibody development; it predates the pivekimab approval.
    quote_role: REVIEW_SYNTHESIS
- name: Tagraxofusp, Azacitidine and Venetoclax Combination
  description: >-
    A 2026 single-arm phase 2 report included 27 BPDCN patients: 16 previously untreated and 11 relapsed/refractory.
    Composite CR/CRi/CRc rates were 88% and 64%, respectively; capillary leak occurred in 15%, mostly grade
    2. Many patients subsequently underwent allogeneic HCT. The endpoint includes incomplete count recovery
    and should not be equated with CADENZA CR/CRc or interpreted as a randomized comparison.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:42413008
    reference_title: Tagraxofusp, Azacitidine, and Venetoclax in Blastic Plasmacytoid Dendritic Cell Neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Twenty-seven patients were enrolled (16 1L, 11 R/R), with median age of 70 years (range 21-81). Composite
      complete remission (CR/CRi/CRc) rates were 88% in 1L and 64% in R/R cohorts.
    explanation: >-
      Prospective BPDCN-specific combination efficacy with explicit denominators and endpoint.
    quote_role: PRIMARY_RESULT
  - reference: PMID:42413008
    reference_title: Tagraxofusp, Azacitidine, and Venetoclax in Blastic Plasmacytoid Dendritic Cell Neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-

- name: CD123-Directed CAR-T and CAR-NK Cell Therapy
  description: >-
    CD123-directed CAR-T and CAR-NK products remain investigational. In the phase 1 CAR-T study, two BPDCN
    patients received autologous cells: one achieved CR, but both progressed by days 100 and 29; both subsequently
    underwent allogeneic transplantation. Neither developed CRS and both had grade 1 neurotoxicity. Separate
    reports describe severe toxicity, including a death after allogeneic UCART123 with no definitive cause
    established. A combined ASCT/CAR-T/venetoclax case achieved a 13-month remission but cannot isolate the
    benefit of each component. CAR-NK trial enrollment does not itself establish efficacy.

- name: Reduced H3K27 Trimethylation after GCR Attenuation
  description: >-
    In dexamethasone-treated CAL1 cells, GCR knockdown or expression of the NR3C1 fusion reduces global H3K27me3
    and repressive marks at HOXA promoters. The associated expression program resembles loss of EZH2 activity.
    The molecular connection between GCR and PRC2 remains unresolved.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:27060168
    reference_title: Haploinsufficiency for NR3C1, the gene encoding the glucocorticoid receptor, in blastic plasmacytoid dendritic cell neoplasms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Consistent with our GEP experiments, western blot analyses revealed global loss of H3K27me3 under attenuated
      GCR signaling (Figure 3D; supplemental Figure 3D).
    explanation: >-
      GCR knockdown or fusion expression in dexamethasone-treated CAL1 cells reduced H3K27me3; direct physical
      regulation of PRC2 remains unresolved.
    quote_role: PRIMARY_RESULT
  downstream: []
- name: lincRNA-3q-Dependent Cell-Cycle Program
  description: >-
    The nuclear lincRNA-3q is aberrantly expressed in BPDCN samples. Its depletion in CAL1 reduces E2F-associated
    transcription, clonogenicity and G1/S progression without directly inducing cell death in the reported
    assay. This is a separate experimentally supported dependency; whether NR3C1 loss causes its activation
    is still proposed.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:27060168
    reference_title: Haploinsufficiency for NR3C1, the gene encoding the glucocorticoid receptor, in blastic plasmacytoid dendritic cell neoplasms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      lincRNA-3q knockdown in CAL-1 and U937 cells induced a G1/S arrest (Figure 4Cand supplemental Figure
      4C, respectively), without inducing cell death (supplemental Figure 4D).
    explanation: >-
      CAL1 knockdown impairs cell-cycle progression; U937 is a separate AML comparator.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Clonal Expansion of pDC-Lineage Blasts
    description: >-
      lincRNA-3q-dependent cell-cycle and clonogenic programs support leukemia growth in experimental models.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27060168
      reference_title: Haploinsufficiency for NR3C1, the gene encoding the glucocorticoid receptor, in blastic plasmacytoid dendritic cell neoplasms.

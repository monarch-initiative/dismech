    explanation: Supports the combination strategies under investigation alongside these agents.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported as accounting for less than 0.5% of all haematologic
    malignancies. That is a proportional-burden figure, not a rate, so it
    does not by itself fix a numeric band - hence measure_type UNKNOWN and a
    qualitative tier rather than a rate_per_100000. No dedicated registry
    prevalence estimate was found.
  evidence:
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the incidence of BPDCN accounting for less than 0.5% of all hematologic malignancies"
    explanation: The proportional-burden figure this record records as a qualitative rarity tier.

epidemiology:
- name: Male Predominance
  description: >-
    BPDCN occurs at least three times more often in men than in women. The
    ZRSR2 finding — X-linked loss-of-function mutations occurring almost
    exclusively in males — is the first mechanistic account of this bias.
  evidence:
  - reference: PMID:34615655
    reference_title: "Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BPDCN occurs at least three times more frequently in men than in women, but the reasons for this sex bias are unknown."
    explanation: Quantifies the male predominance this record describes.
  - reference: PMID:37251924
    reference_title: "Primary blastic plasmacytoid dendritic cell neoplasm: a US population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 340 primary BPDCN patients were included in this study. The average age was 53.7 ± 19.4 years, with 71.5% being male."
    explanation: Independent population-based confirmation of the sex ratio.

- name: Age Distribution
  description: >-
    The dominant burden falls in older adults, with the median age at
    diagnosis in the seventh decade; a smaller paediatric and young-adult
    group also occurs.
  evidence:
  - reference: PMID:35788129
    reference_title: "Integrative molecular profiling identifies two molecularly and clinically distinct subtypes of blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at diagnosis lies within the seventh decennium and a male predominance is observed"
    explanation: States the median age this record describes.
  - reference: PMID:38334635
    reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm: A Comprehensive Review of the Disease, Central Nervous System Presentations, and Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BPDCN has also been seen in younger populations, including children in a bimodal distribution pattern."
    explanation: >-
      Supports the paediatric and young-adult half of this record, which the
      seventh-decade sentence above does not carry.

- name: Antecedent or Concurrent Myeloid Neoplasm
  description: >-
    A substantial minority of cases occur alongside or after another myeloid
    neoplasm — CMML, AML or MDS — reflecting a shared clonal-hematopoiesis
    origin rather than coincidence.
  evidence:
  - reference: PMID:35788129
    reference_title: "Integrative molecular profiling identifies two molecularly and clinically distinct subtypes of blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Syn- and metachronous myeloid neoplasms (CMML, AML and MDS) have been reported in up to 20% of cases"
    explanation: Quantifies the association this record describes.
  - reference: PMID:30323983
    reference_title: "Early detection of transformation to BPDCN in a patient with MDS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The case demonstrates that minimal transformative disease of BPDCN may be detectable in patients with MDS well before fulminant progression."
    explanation: >-
      A worked case showing the BPDCN clone emerging from an antecedent MDS,
      which is the clonal continuity this record asserts.

progression:
- phase: Chemotherapy-Era Outcome
  notes: >-
    Aggressive and rapid. Median overall survival is reported in the range of
    12 to 24 months from diagnosis, with relapse typical after an initial
    chemotherapy response. These are outcomes under conventional
    chemotherapy, not untreated natural history - both sources describe
    patients who responded and then relapsed.
  evidence:
  - reference: PMID:34615655
    reference_title: "Sex-Biased ZRSR2 Mutations in Myeloid Malignancies Impair Plasmacytoid Dendritic Cell Activation and Apoptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Outcomes for patients with BPDCN are poor, with a median survival of 12 to 24 months from diagnosis"
    explanation: The survival figure this phase records.
  - reference: PMID:31846142
    reference_title: "Whole-genome analysis uncovers recurrent IKZF1 inactivation and aberrant cell adhesion in blastic plasmacytoid dendritic cell neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median overall survival of patients with BPDCN ranges from 12 to 14 months as the disease typically relapses after initial response to chemotherapy."
    explanation: Independent survival estimate and the relapse pattern after initial chemotherapy response.

- phase: Population-Based Long-Term Survival
  notes: >-
    SEER data on 340 primary BPDCN patients diagnosed 2001-2019 give 1-, 3-,
    5- and 10-year overall survival of 68.7%, 49.8%, 43.9% and 39.2%. These
    are notably better than the institutional-series figures above; the
    cohorts differ in how disease is ascertained and in the era of treatment,
    so the two should not be read as one trend.
  evidence:
  - reference: PMID:37251924
    reference_title: "Primary blastic plasmacytoid dendritic cell neoplasm: a US population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For all the patients, the 1-year, 3-year, 5-year, and 10-year overall survival (OS) were 68.7%, 49.8%, 43.9%, and 39.2%, respectively"
    explanation: The population-based survival figures this phase records.
  - reference: PMID:37251924
    reference_title: "Primary blastic plasmacytoid dendritic cell neoplasm: a US population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multivariate AFT analysis indicated that older age was independently associated with worse survival, while second primary malignancies (SPMs) and radiation therapy were independently associated with extended survival."
    explanation: >-
      The full multivariate result. Three factors survived adjustment, not one:
      age adversely, and second primary malignancies and radiotherapy
      favourably. The latter two are hard to read causally in a registry
      series and are recorded as the source reports them.

clinical_trials:
- name: NCT02113982
  phase: PHASE_II
  status: COMPLETED
  description: >-
    The pivotal multicohort trial of tagraxofusp in treatment-naive and
    relapsed/refractory BPDCN, which supported approval.
  evidence:
  - reference: PMID:31018069
    reference_title: "Tagraxofusp in Blastic Plasmacytoid Dendritic-Cell Neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 29 previously untreated patients who received tagraxofusp at a dose of 12 μg per kilogram, the primary outcome occurred in 21 (72%), and the overall response rate was 90%"
    explanation: The primary efficacy result of this trial.

experimental_models:
- name: CAL-1 and GEN2.2 BPDCN cell lines
  experimental_model_type: CELL_LINE
  description: >-
    The two established human BPDCN cell lines used across the mechanistic
    literature. They were the platform for the RNAi and drug screens that
    identified the TCF4-BRD4 dependency.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:27846392
  modeled_mechanisms:
  - target: TCF4-Dependent Super-Enhancer Network Addiction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The lines reproduce the BPDCN-specific TCF4-driven transcriptional
      program and die when it is disrupted genetically or pharmacologically.
    limitations: >-
      Established lines carry the transcriptional dependency but not the
      clonal-evolution history (founder TET2/ASXL1 lesions, transformation
      from an antecedent myeloid neoplasm) or the immune microenvironment,
      so they cannot report on the initiating steps of the chain.
    evidence:
    - reference: PMID:27846392
      reference_title: "A Druggable TCF4- and BRD4-Dependent Transcriptional Network Sustains Malignancy in Blastic Plasmacytoid Dendritic Cell Neoplasm."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "its downregulation caused the loss of the BPDCN-specific gene expression program and apoptosis"
      explanation: Establishes the lines as informative for the TCF4 dependency node.

animal_models:
- name: BPDCN patient-derived xenograft
  species: Mouse
  genotype: Immunodeficient host engrafted with primary patient BPDCN cells
  description: >-
    Xenografts of primary patient BPDCN cells in immunodeficient mice, used to
    test BCL2 inhibition in vivo before the first off-label human use.
  publication: PMID:27986708
  modeled_mechanisms:
  - target: Apoptosis Resistance in the pDC Compartment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Patient-derived xenografts retain the BCL2 dependence measured in
      primary cells and respond to venetoclax in vivo.
    limitations: >-
      Immunodeficient hosts cannot reproduce the T-cell exhaustion and
      interferon-skewed microenvironment described in patient marrow, so the
      model is silent on the immune component of the disease.
    evidence:
    - reference: PMID:27986708
      reference_title: "Blastic Plasmacytoid Dendritic Cell Neoplasm Is Dependent on BCL2 and Sensitive to Venetoclax."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Animals bearing BPDCN patient-derived xenografts had disease responses and improved survival after venetoclax treatment in vivo"
      explanation: Establishes the xenograft as informative for the BCL2-dependent survival node.

- name: MYB fusion-driven myeloid-dendritic acute leukemia mouse
  species: Mouse
  genotype: Enforced expression of BPDCN-associated MYB fusion
  description: >-
    Expression of patient-derived MYB fusions in vivo impairs dendritic-cell
    differentiation and transforms cells, generating the first mouse model of
    a myeloid-dendritic acute leukemia driven by a BPDCN lesion.
  publication: PMID:39499902
  modeled_mechanisms:
  - target: Plasmacytoid Dendritic Cell Differentiation Block
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model reproduces the differentiation block and transformation caused
      by a MYB fusion.
    limitations: >-
      The resulting leukemia is described as myeloid-dendritic rather than as
      a full phenocopy of human BPDCN, and MYB rearrangement accounts for only
      about a fifth of human cases, so the model speaks to one driver route
      rather than to the disease as a whole.
    evidence:
    - reference: PMID:39499902
      reference_title: "BPDCN MYB fusions regulate cell cycle genes, impair differentiation, and induce myeloid-dendritic cell leukemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "expression of MYB fusions in vivo impaired DC differentiation and induced transformation to generate a mouse model of myeloid-dendritic acute leukemia."
      explanation: Establishes the model and the differentiation-block phenotype it reproduces.

environmental:
- name: Cutaneous ultraviolet radiation exposure
  description: >-
    Sun exposure of plasmacytoid dendritic cells or their committed precursors
    in the skin. This is not a conventional epidemiologic risk factor for
    BPDCN - no exposure-incidence study exists - but a mutational and
    selective process reconstructed directly from the tumours' own phylogenies.
  exposure_term:
    preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  influences_mechanisms:
  - target: UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      UV radiation supplies both the mutational signature found clonally
      expanded in these tumours and the selective pressure that TET2-mutant
      pDCs uniquely survive.
    evidence:
    - reference: PMID:37286599
      reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "implicating sun exposure of plasmacytoid dendritic cells or committed precursors during BPDCN pathogenesis"
      explanation: >-
        The authors' own statement of the exposure acting on this mechanism.
  evidence:
  - reference: PMID:37286599
    reference_title: "Ultraviolet radiation shapes dendritic cell leukaemia transformation in the skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BPDCN skin tumours first develop at sun-exposed anatomical sites and are distinguished by clonally expanded mutations induced by ultraviolet (UV) radiation"
    explanation: >-
      Establishes the exposure's fingerprint in the tumours themselves rather
      than by epidemiologic inference.


- name: Craniofacial and Upper Airway Malformation
  description: >
    MSS produces a characteristic craniofacial gestalt (high forehead, underdeveloped
    midface, proptosis, anteverted nares, everted lips) and associated upper-airway
    anomalies. The midface and airway malformation causes upper airway obstruction
    and respiratory compromise, historically the leading cause of early death.
    Progressive craniosynostosis with raised intracranial pressure can also occur.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:20949508
    reference_title: "Phenotype and natural history in Marshall-Smith syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial features are characteristic with high forehead, underdeveloped midface, proptosis, anteverted nares, and everted lips."
    explanation: >-

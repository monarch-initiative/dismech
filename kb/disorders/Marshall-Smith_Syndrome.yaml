pathophysiology:
- name: NFIX Truncating Variants Escaping Nonsense-Mediated Decay
  description: >
    Marshall-Smith syndrome is caused by heterozygous frameshift and splice-site
    NFIX variants (and recurrent deletions of exons 6 and 7) scattered through
    exons 6-10. In contrast to the exon-2 variants that cause Malan syndrome, the
    MSS-associated mutant mRNAs are not cleared by nonsense-mediated mRNA decay, so
    they persist and are translated into aberrant, C-terminally altered NFIX
    protein.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: NFIX
      term:
        id: hgnc:7788
        label: NFIX
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >
      Frameshift, splice-site, and exon 6-7 deletion variants in exons 6-10 escape
      NMD and encode truncated proteins acting in a dominant-negative manner;
      variants arise de novo.
  biological_processes:
  - preferred_term: escape from nonsense-mediated mRNA decay of mutant NFIX transcript
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: DECREASED
  downstream:
  - target: Dominant-Negative NFIX Transcriptional Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24924640
      reference_title: "Deletions in the 3' part of the NFIX gene including a recurrent Alu-mediated deletion of exon 6 and 7 account for previously unexplained cases of Marshall-Smith syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: "This is in line with the hypothesis that MSS-associated mutations encode dysfunctional proteins that act in a dominant negative manner."
      explanation: >-
        The dominant-negative mechanism is an in-silico inference from the predicted
        domain structure of the NMD-escaping mutant proteins, supporting the causal
        link through an inference step rather than a direct functional assay.
  evidence:
  - reference: PMID:20673863
    reference_title: "Distinct effects of allelic NFIX mutations on nonsense-mediated mRNA decay engender either a Sotos-like or a Marshall-Smith syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinct frameshift and splice NFIX mutations that escaped nonsense-mediated mRNA decay (NMD) were identified in nine MSS subjects."
    explanation: >-
      Original identification of NFIX as the MSS gene, showing MSS mutations escape
      NMD, unlike the NMD-triggering variants of Malan syndrome.
  - reference: PMID:24924640
    reference_title: "Deletions in the 3' part of the NFIX gene including a recurrent Alu-mediated deletion of exon 6 and 7 account for previously unexplained cases of Marshall-Smith syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MSS-associated mutant mRNAs are not cleared by nonsense-mediated mRNA decay"
    explanation: >-
      RT-PCR experiments confirm MSS-associated mutant transcripts escape NMD and persist.
  - reference: PMID:26200704
    reference_title: "Novel mutations of NFIX gene causing Marshall-Smith syndrome or Sotos-like syndrome: one gene, two phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marshall-Smith mutations are scattered through exons 6-10 of NFIX gene, while most point mutations causing an overgrowth syndrome are clustered in exon 2."
    explanation: >-
      Establishes the exon 6-10 clustering that distinguishes MSS from the exon-2
      overgrowth (Malan/Sotos-like) variants.
- name: Dominant-Negative NFIX Transcriptional Dysfunction
  description: >
    The NMD-escaping mutant NFIX proteins retain a preserved DNA-binding and
    dimerization domain but differ grossly in their C-terminal portion, so they
    dimerize with and interfere with wild-type NFIX transcription-factor function.
    NFIX is a nuclear factor I family transcription factor normally expressed
    prenatally during human brain development and skeletogenesis; its dominant-negative
    disruption dysregulates the transcriptional programs of those tissues.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24924640
    reference_title: "Deletions in the 3' part of the NFIX gene including a recurrent Alu-mediated deletion of exon 6 and 7 account for previously unexplained cases of Marshall-Smith syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Predicted MSS-associated mutant NFIX proteins consistently have a preserved DNA binding and dimerization domain, whereas they grossly vary in their C-terminal portion."
    explanation: >-
      Establishes the structural basis for a dominant-negative effect: retained
      dimerization/DNA-binding but a variable, dysfunctional C-terminus.
  - reference: PMID:20673863
    reference_title: "Distinct effects of allelic NFIX mutations on nonsense-mediated mRNA decay engender either a Sotos-like or a Marshall-Smith syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that NFIX is normally expressed prenatally during human brain development and skeletogenesis."
    explanation: >-
      Shows NFIX is normally active in the brain and skeleton, the tissues
      subsequently disrupted in MSS.
  downstream:
  - target: Dysregulated Osseous Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Craniofacial and Upper Airway Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Aortic Root Dilatation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28442439
      reference_title: "Marshall-Smith syndrome: Novel pathogenic variant and previously unreported associations with precocious puberty and aortic root dilatation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Additionally, the patient showed progressive dilatation of the aortic root."
      explanation: >-
        Reports aortic root dilatation as a newly recognized association of MSS,
        the intermediate steps between NFIX dysfunction and the aortic phenotype
        being unknown.
  - target: Precocious Puberty
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28442439
      reference_title: "Marshall-Smith syndrome: Novel pathogenic variant and previously unreported associations with precocious puberty and aortic root dilatation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient also presented with precocious puberty diagnosed at five years of age and had an abnormal GnRH stimulation test indicative of central precocious puberty."
      explanation: >-
        Reports central precocious puberty as a newly recognized association of MSS,
        with the intermediate mechanism linking NFIX dysfunction to the endocrine
        phenotype unknown.

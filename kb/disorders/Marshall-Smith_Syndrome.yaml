animal_models:
- name: Nfix-null mouse
  species: Mouse
  genotype: Nfix-deficient (Nfix knockout)
  publication: PMID:20673863
  description: >-
    Constitutive Nfix-null mice fail to gain weight, die within the first three
    postnatal weeks, and develop a spinal deformation with decreased bone
    mineralization. The mouse reproduces the skeletal and growth phenotype of MSS
    but through Nfix loss of function rather than the dominant-negative allelic
    mechanism operating in human MSS (the mechanism that instead underlies Malan
    syndrome).
  modeled_mechanisms:
  - target: Failure to Thrive
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Nfix-null mice fail to gain weight and die in early postnatal life,
      paralleling the failure to thrive of MSS.
    limitations: >-
      The mouse is Nfix loss of function, whereas human MSS is caused by
      dominant-negative NMD-escaping alleles; Nfix haploinsufficiency/loss in
      humans causes Malan syndrome, an overgrowth disorder, so the allelic
      mechanism does not match.
    evidence:
    - reference: PMID:20673863
      reference_title: "Distinct effects of allelic NFIX mutations on nonsense-mediated mRNA decay engender either a Sotos-like or a Marshall-Smith syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nfix-deficient mice are unable to gain weight and die in the first 3 postnatal weeks, while they also present with a spinal deformation and decreased bone mineralization."
      explanation: >-
        Reports the failure-to-gain-weight phenotype of Nfix-null mice as a partial
        correlate of MSS failure to thrive.
  - target: Kyphoscoliosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Nfix-null mice present with a spinal deformation, paralleling the
      kyphoscoliosis of MSS.
    limitations: >-
      The spinal deformation arises from Nfix loss of function, not the
      dominant-negative mechanism of human MSS; loss of NFIX in humans causes
      Malan syndrome rather than MSS.
    evidence:
    - reference: PMID:20673863
      reference_title: "Distinct effects of allelic NFIX mutations on nonsense-mediated mRNA decay engender either a Sotos-like or a Marshall-Smith syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nfix-deficient mice are unable to gain weight and die in the first 3 postnatal weeks, while they also present with a spinal deformation and decreased bone mineralization."
      explanation: >-
        Reports the spinal deformation of Nfix-null mice as a partial correlate of
        MSS kyphoscoliosis.
  - target: Dysregulated Osseous Maturation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Nfix-null mice show decreased bone mineralization, a skeletal correlate of
      the dysregulated osseous maturation (with osteopenia) of MSS.
    limitations: >-
      Decreased bone mineralization in the mouse reflects Nfix loss of function,
      not the dominant-negative allelic mechanism of MSS; the mouse also lacks the
      accelerated, dysharmonic bone maturation that defines the human phenotype.
    evidence:
    - reference: PMID:20673863
      reference_title: "Distinct effects of allelic NFIX mutations on nonsense-mediated mRNA decay engender either a Sotos-like or a Marshall-Smith syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nfix-deficient mice are unable to gain weight and die in the first 3 postnatal weeks, while they also present with a spinal deformation and decreased bone mineralization."
      explanation: >-
        Reports decreased bone mineralization in Nfix-null mice as a partial
        correlate of the MSS skeletal phenotype.
discussions:
- discussion_id: mss_mouse_allelic_mechanism_mismatch
  prompt: >-
    Does the Nfix-null mouse model MSS, given that it reproduces the skeletal and
    failure-to-thrive phenotype through loss of function rather than the
    dominant-negative allelic mechanism that causes human MSS?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated Osseous Maturation
  - animal_models#Mouse
  rationale: >-
    The only reported mouse reproduces the MSS skeletal phenotype (spinal
    deformation, decreased bone mineralization) and failure to thrive, but it is
    Nfix loss of function. In humans, NFIX loss of function / haploinsufficiency
    causes Malan syndrome (overgrowth), not MSS; MSS is caused by NMD-escaping
    dominant-negative alleles. The mouse therefore models the wrong allelic
    mechanism while reproducing the phenotype, so its findings cannot be treated as
    validating the dominant-negative mechanism of human MSS.
  evidence:
  - reference: PMID:20673863
    reference_title: "Distinct effects of allelic NFIX mutations on nonsense-mediated mRNA decay engender either a Sotos-like or a Marshall-Smith syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nfix-deficient mice are unable to gain weight and die in the first 3 postnatal weeks, while they also present with a spinal deformation and decreased bone mineralization."
    explanation: >-
      Documents the Nfix-null mouse phenotype whose loss-of-function basis mismatches
      the dominant-negative allelic mechanism of human MSS.

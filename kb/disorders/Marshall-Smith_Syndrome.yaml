    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Minor abnormalities of brain morphology such as hypoplasia of the corpus callosum are common."
    explanation: >-
      Documents structural brain anomalies (corpus callosum hypoplasia) as a common
      finding, reflecting impaired neurodevelopment.
  downstream:
  - target: Intellectual Disability
    causal_link_type: DIRECT
  - target: Absent Speech
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Corpus Callosum Hypoplasia
    causal_link_type: DIRECT
- name: Craniofacial and Upper Airway Malformation
  description: >
    MSS produces a characteristic craniofacial gestalt (high forehead, underdeveloped
    midface, proptosis, anteverted nares, everted lips) and associated upper-airway
    anomalies. The midface and airway malformation causes upper airway obstruction
    and respiratory compromise, historically the leading cause of early death.
    Progressive craniosynostosis with raised intracranial pressure can also occur.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:20949508
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial features are characteristic with high forehead, underdeveloped midface, proptosis, anteverted nares, and everted lips."
    explanation: >-
      Defines the characteristic craniofacial dysmorphism underlying this node.
  downstream:
  - target: Upper Airway Obstruction
    causal_link_type: DIRECT
  - target: Respiratory Insufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20949508
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "respiratory compromise secondary to upper airway obstruction"
      explanation: >-
        States that respiratory compromise in MSS is secondary to upper airway
        obstruction, supporting this causal edge.
  - target: Midface Retrusion
    causal_link_type: DIRECT
  - target: Craniosynostosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

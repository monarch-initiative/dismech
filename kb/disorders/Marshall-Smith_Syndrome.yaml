diagnosis:
- name: Molecular genetic testing of NFIX
  description: >
    MSS is confirmed by molecular analysis of NFIX. Conventional sequencing detects
    the frameshift and splice-site variants; multiplex ligation-dependent probe
    amplification (MLPA) is additionally required to detect the recurrent
    Alu-mediated deletion of exons 6 and 7 and other copy-number changes that
    sequencing misses.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous NFIX frameshift or splice-site variant, or a recurrent exon 6-7
    deletion, in exons 6-10.
  evidence:
  - reference: PMID:24924640
    reference_title: "Deletions in the 3' part of the NFIX gene including a recurrent Alu-mediated deletion of exon 6 and 7 account for previously unexplained cases of Marshall-Smith syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our study cohort of 17 patients with a clinical diagnosis of MSS, conventional sequencing of NFIX revealed frameshift and splice-site mutations in 10 individuals."
    explanation: >-
      Establishes conventional NFIX sequencing as the first-line molecular diagnostic
      test in clinically diagnosed MSS.
  - reference: PMID:24924640
    reference_title: "Deletions in the 3' part of the NFIX gene including a recurrent Alu-mediated deletion of exon 6 and 7 account for previously unexplained cases of Marshall-Smith syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using multiplex ligation-dependent probe amplification analysis, we identified a recurrent deletion of NFIX exon 6 and 7 in five individuals."
    explanation: >-
      Establishes that MLPA is needed to detect the recurrent exon 6-7 deletion that
      sequencing does not capture.

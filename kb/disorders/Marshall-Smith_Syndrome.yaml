genetic:
- name: NFIX
  gene_term:
    preferred_term: NFIX
    term:
      id: hgnc:7788
      label: NFIX
  association: Pathogenic Variants
  notes: >
    Marshall-Smith syndrome is caused by heterozygous NFIX frameshift and
    splice-site variants, and recurrent Alu-mediated deletions of exons 6 and 7,
    scattered through exons 6-10. These variants escape nonsense-mediated mRNA
    decay and encode truncated proteins with a preserved DNA-binding/dimerization
    domain that act in a dominant-negative manner. This mechanism is distinct from
    the exon-2 loss-of-function/haploinsufficiency variants that cause Malan
    syndrome. Variants arise de novo; MSS is a genetically homogeneous Mendelian
    disorder.
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24924640
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a recurrent deletion of NFIX exon 6 and 7 in five individuals"
    explanation: >-
      Documents the recurrent Alu-mediated exon 6-7 deletion as a cause of MSS.
  - reference: PMID:24924640
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings show that MSS is a genetically homogeneous Mendelian disorder."
    explanation: >-
      Establishes NFIX as the single causal gene for a genetically homogeneous MSS.
  - reference: PMID:20673863
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinct frameshift and splice NFIX mutations that escaped nonsense-mediated mRNA decay (NMD) were identified in nine MSS subjects."
    explanation: >-
      Original NFIX identification in MSS, showing the NMD-escaping variant class.

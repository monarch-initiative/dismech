    modifier: ABNORMAL
  evidence:
  - reference: PMID:20673863
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a severe malformation syndrome characterized by failure to thrive, respiratory insufficiency, accelerated osseous maturation, kyphoscoliosis, osteopenia, and unusual facies"
    explanation: >-
      Lists accelerated osseous maturation, kyphoscoliosis, osteopenia and failure
      to thrive as core skeletal/growth features of MSS.
  downstream:
  - target: Accelerated Skeletal Maturation
    causal_link_type: DIRECT
  - target: Kyphoscoliosis
    causal_link_type: DIRECT
  - target: Failure to Thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Neurodevelopment
  description: >
    NFIX is required for normal human brain development; dominant-negative
    dysfunction impairs nervous system development, producing moderate-to-severe
    developmental delay with absent or limited speech and structural brain anomalies
    such as hypoplasia of the corpus callosum.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: neuron
    term:

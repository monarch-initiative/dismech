name: Arteriosclerotic Retinopathy
creation_date: "2026-05-06T17:24:49Z"
description: >-
  Arteriosclerotic retinopathy is an ontology-backed name for funduscopically
  visible sclerosis of retinal arterioles. Contemporary screening studies more
  often call the finding retinal or fundus arteriosclerosis and grade it with a
  modified Scheie S scale or retinal arteriosclerosis index. It is primarily a
  retinal vascular morphology, often detected incidentally, rather than a
  syndrome defined by visual symptoms. It correlates with age, hypertension,
  and several systemic vascular or metabolic conditions, but cross-sectional
  associations must not be interpreted as proof that the retinal finding
  directly causes or specifically measures systemic atherosclerosis.
category: Complex
disease_term:
  preferred_term: arteriosclerotic retinopathy
  term:
    id: MONDO:0042495
    label: arteriosclerotic retinopathy
parents:
- Arteriosclerosis disorder
- Retinal vascular disorder
synonyms:
- Retinal arteriosclerosis
- Fundus arteriosclerosis
- Arteriosclerosis disorder of retina
- Retina arteriosclerosis disorder
- Retinopathy, arteriosclerotic
prevalence:
- population: South Korean tertiary-center health-screening cohort, 2003-2010
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4500.0
  percentage: 4.5
  notes: >-
    This is the prevalence of high-grade retinal arteriosclerosis index (RAI
    grade 2 or higher) among 74,608 screened adults, not a global disease
    prevalence. Selection into health screening, the modified grading system,
    and the study population limit generalization.
  evidence:
  - reference: PMID:42193361
    reference_title: "Retinal Arteriosclerosis in a Large Health Screening Cohort: Associations with Systemic Vascular Comorbidities and Stroke in Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: High-grade RAI was prespecified as ≥2.
    explanation: This supplies the threshold used for the cohort-specific estimate.
  - reference: PMID:42193361
    reference_title: "Retinal Arteriosclerosis in a Large Health Screening Cohort: Associations with Systemic Vascular Comorbidities and Stroke in Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: High-grade RAI was present in 4.5% of the participants and increased with age.
    explanation: This supplies the observed high-grade RAI prevalence in the screened cohort.
pathophysiology:
- name: Fundus-defined retinal arteriolar sclerosis
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The curated disease identity is the chronic arteriolar-wall phenotype
    operationalized by modified Scheie atherosclerotic/S grading. The visible
    pattern includes alteration of the arteriolar light reflex and
    arteriovenous crossing signs. The available population studies establish
    the imaging phenotype and its correlates, but do not establish a unique
    molecular lesion or prove that every such sign represents systemic plaque
    atherosclerosis.
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  - preferred_term: retinal arteriole
    term:
      id: UBERON:0001980
      label: arteriole
  biological_processes:
  - preferred_term: blood vessel remodeling
    modifier: ABNORMAL
    term:
      id: GO:0001974
      label: blood vessel remodeling
  evidence:
  - reference: PMID:42193361
    reference_title: "Retinal Arteriosclerosis in a Large Health Screening Cohort: Associations with Systemic Vascular Comorbidities and Stroke in Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinal arteriosclerosis was graded (0-4) by masked readers with a modified
      Scheie classification; a higher eye grade was defined as a person-level grade.
    explanation: >-
      The current large screening study operationalizes retinal
      arteriosclerosis as a graded fundus phenotype.
  - reference: PMID:33239480
    reference_title: Examination of Large Artery Atherosclerosis could Reveal Small Artery Retinopathy in Untreated Middle-Aged Individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence or presence and extent of retinopathy were characterized by
      ophthalmologists as hypertensive (H0-4) and atherosclerotic grades (S0-4)
      based on Scheie classification.
    explanation: >-
      Scheie grading explicitly records separate hypertensive and
      atherosclerotic axes rather than treating them as interchangeable.
  downstream:
  - target: Enhanced retinal arteriolar light reflex
    causal_link_type: UNKNOWN
    description: >-
      Enhanced wall reflex is part of the visible arteriosclerotic pattern, but
      its optical and histologic specificity is limited and the population
      evidence is observational.
    evidence:
    - reference: PMID:17070582
      reference_title: "Prevalence and associations of enhanced retinal arteriolar light reflex: a new look at an old sign."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The enhanced arteriolar light reflex sign was found in 1053 participants
        (31.7%, including 28.8% graded as mild and 2.9% as marked).
      explanation: >-
        This establishes the graded fundus sign but not a one-to-one causal or
        histologic mapping to retinal arteriosclerosis.
  - target: Arteriovenous crossing sign
    causal_link_type: UNKNOWN
    description: >-
      Arteriovenous nicking or crossing change clusters with enhanced arteriolar
      wall reflex, but the available cohort evidence supports association rather
      than a uniquely attributable causal pathway.
    evidence:
    - reference: PMID:17070582
      reference_title: "Prevalence and associations of enhanced retinal arteriolar light reflex: a new look at an old sign."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Strong associations were demonstrated between presence of mildly enhanced
        light reflex and either arteriovenous nicking (OR 3.12) or retinopathy
        (OR 1.96).
      explanation: >-
        The population study supports co-occurrence of the two fundus signs but
        not causal direction or disease specificity.
phenotypes:
- category: Ophthalmologic
  name: Enhanced retinal arteriolar light reflex
  diagnostic: true
  description: >-
    Broadening or intensification of the central arteriolar light reflex is a
    classic visible vessel-wall sign. The sign is not specific: in a general
    older population it was common, and only the marked grade correlated with
    elevated blood pressure after adjustment.
  evidence:
  - reference: PMID:17070582
    reference_title: "Prevalence and associations of enhanced retinal arteriolar light reflex: a new look at an old sign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this older population, the enhanced retinal arteriolar light reflex sign
      was a relatively common finding.
    explanation: This directly identifies the classic arteriolar wall-reflex sign.
  - reference: PMID:17070582
    reference_title: "Prevalence and associations of enhanced retinal arteriolar light reflex: a new look at an old sign."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although some associations of this sign with vascular risk factors were
      found, only a marked level of enhanced light reflex was correlated with
      elevated blood pressure, but not with poor survival.
    explanation: >-
      This bounds the sign's specificity and prognostic interpretation.
- category: Ophthalmologic
  name: Arteriovenous crossing sign
  diagnostic: true
  description: >-
    Arteriovenous nicking is a crossing-site change that can accompany the
    arteriosclerotic wall-reflex phenotype. It also occurs with cumulative
    hypertensive vascular injury and therefore does not distinguish etiology by
    itself.
  phenotype_term:
    preferred_term: Arteriovenous crossing sign
    term:
      id: HP:6001216
      label: Arteriovenous crossing sign
  evidence:
  - reference: PMID:17070582
    reference_title: "Prevalence and associations of enhanced retinal arteriolar light reflex: a new look at an old sign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strong associations were demonstrated between presence of mildly enhanced
      light reflex and either arteriovenous nicking (OR 3.12) or retinopathy
      (OR 1.96).
    explanation: This directly supports arteriovenous nicking as a co-occurring retinal sign.
  - reference: PMID:11525792
    reference_title: "Retinal microvascular abnormalities and their relationship with hypertension, cardiovascular disease, and mortality."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generalized arteriolar narrowing and arteriovenous nicking also appear to
      be irreversible long-term markers of hypertension, related not only to
      current but past blood pressure levels as well.
    explanation: >-
      This shows why arteriovenous nicking cannot be interpreted as specific to
      atherosclerotic disease or current blood pressure.
environmental:
- name: Hypertension and cumulative blood-pressure exposure
  presence: Positive
  description: >-
    Hypertension is strongly associated with high-grade retinal
    arteriosclerosis, and arteriovenous nicking can reflect past as well as
    current blood pressure. These data support a vascular-risk context, not a
    claim that every Scheie S sign is caused only by hypertension.
  evidence:
  - reference: PMID:42193361
    reference_title: "Retinal Arteriosclerosis in a Large Health Screening Cohort: Associations with Systemic Vascular Comorbidities and Stroke in Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After adjustment, high-grade RAI was associated with hypertension (OR,
      2.97; 95% CI, 2.73-3.23)
    explanation: >-
      The large current screening cohort establishes an adjusted association
      between hypertension and high-grade RAI.
  - reference: PMID:11525792
    reference_title: "Retinal microvascular abnormalities and their relationship with hypertension, cardiovascular disease, and mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinal microvascular abnormalities, such as generalized and focal
      arteriolar narrowing, arteriovenous nicking and retinopathy, reflect
      cumulative vascular damage from hypertension, aging, and other processes.
    explanation: >-
      The review supports cumulative pressure exposure and aging as contributors
      while explicitly allowing other processes.
- name: Type 2 diabetes and metabolic syndrome
  presence: Associated
  description: >-
    High-grade RAI was associated with type 2 diabetes and metabolic syndrome in
    the large screening cohort. These cross-sectional correlations do not show
    that the finding is diabetic retinopathy or establish causal direction.
  evidence:
  - reference: PMID:42193361
    reference_title: "Retinal Arteriosclerosis in a Large Health Screening Cohort: Associations with Systemic Vascular Comorbidities and Stroke in Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After adjustment, high-grade RAI was associated with hypertension (OR,
      2.97; 95% CI, 2.73-3.23), diabetes mellitus (OR, 1.35; 95% CI,
      1.22-1.50), cardiovascular disease (OR, 1.46; 95% CI, 1.25-1.71),
      metabolic syndrome (OR, 1.63; 95% CI, 1.49-1.78), and stroke (OR, 1.98;
      95% CI, 1.41-2.79) but not with hyperlipidemia.
    explanation: >-
      The study provides adjusted cross-sectional associations with diabetes and
      metabolic syndrome and also shows that hyperlipidemia was not associated.
diagnosis:
- name: Modified Scheie S-grade fundus assessment
  description: >-
    Dilated fundus examination or color fundus photography can identify and
    grade retinal arteriosclerotic signs. The S or retinal-arteriosclerosis axis
    must be recorded separately from the Scheie H hypertensive-retinopathy axis.
    Modern cohorts use modified protocols, so a grade is method-dependent rather
    than a universal molecular diagnosis.
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: MAXO:0001155
      label: eye examination
  results: >-
    Modified Scheie S or RAI grade 0-4 based on fundus-defined arteriolar
    sclerosis; report the eye-level method, reader protocol, and threshold.
  evidence:
  - reference: PMID:42193361
    reference_title: "Retinal Arteriosclerosis in a Large Health Screening Cohort: Associations with Systemic Vascular Comorbidities and Stroke in Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinal arteriosclerosis was graded (0-4) by masked readers with a modified
      Scheie classification; a higher eye grade was defined as a person-level grade.
    explanation: This directly supports masked modified-Scheie grading from fundus images.
  - reference: PMID:33239480
    reference_title: Examination of Large Artery Atherosclerosis could Reveal Small Artery Retinopathy in Untreated Middle-Aged Individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence or presence and extent of retinopathy were characterized by
      ophthalmologists as hypertensive (H0-4) and atherosclerotic grades (S0-4)
      based on Scheie classification.
    explanation: This directly supports separate H and S grading by ophthalmologists.
differential_diagnoses:
- name: Hypertensive retinopathy
  description: >-
    Hypertensive retinopathy reflects pressure-related retinal vascular and, in
    severe disease, parenchymal injury. Arteriolar narrowing belongs primarily
    to the hypertensive axis, while hemorrhages, hard exudates, cotton-wool spots,
    and optic-disc edema indicate more severe acute hypertensive injury. Chronic
    wall-reflex and crossing changes can coexist, so blood pressure and the
    complete fundus pattern must be interpreted together.
  distinguishing_features:
  - Modified Scheie H and S grades are separate axes and should both be reported when used.
  - Generalized or focal arteriolar narrowing favors the hypertensive vascular response rather than isolated arteriosclerotic S grading.
  - Retinal hemorrhages, hard exudates, cotton-wool spots, or optic-disc edema indicate parenchymal hypertensive injury and should not be collapsed into arteriosclerotic retinopathy.
  evidence:
  - reference: PMID:24121878
    reference_title: "[Hypertensive changes of the fundus]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypertensive retinopathy causes vascular constriction of retinal arterioles
      and typical fundus findings, such as blot hemorrhages, hard exudates and
      cotton wool spots resulting from ischemia within the nerve fiber layer.
    explanation: >-
      The review distinguishes constrictive and parenchymal hypertensive changes
      from the chronic arteriosclerotic wall phenotype.
  - reference: PMID:24121878
    reference_title: "[Hypertensive changes of the fundus]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, early stages with pure vascular pathology should be differentiated
      from severe forms of hypertensive retinopathy with parenchymal changes of
      the fundus.
    explanation: This explicitly supports separating vascular signs from severe hypertensive retinopathy.
discussions:
- discussion_id: arteriosclerotic_retinopathy_nomenclature_and_scope
  prompt: >-
    Should arteriosclerotic retinopathy be treated as a distinct clinical
    diagnosis, or as a graded retinal arteriolar morphology within broader
    hypertensive and vascular-risk assessment?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Fundus-defined retinal arteriolar sclerosis
  - diagnosis#Modified Scheie S-grade fundus assessment
  rationale: >-
    MONDO retains the disease label, whereas current clinical cohorts more often
    use retinal arteriosclerosis, fundus arteriosclerosis, RAI, or modified
    Scheie S grading. H and S axes overlap clinically but are not interchangeable,
    and grading systems vary across studies.
  evidence:
  - reference: PMID:33239480
    reference_title: Examination of Large Artery Atherosclerosis could Reveal Small Artery Retinopathy in Untreated Middle-Aged Individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence or presence and extent of retinopathy were characterized by
      ophthalmologists as hypertensive (H0-4) and atherosclerotic grades (S0-4)
      based on Scheie classification.
    explanation: The study demonstrates the continuing but separate use of H and S axes.
  - reference: PMID:42193361
    reference_title: "Retinal Arteriosclerosis in a Large Health Screening Cohort: Associations with Systemic Vascular Comorbidities and Stroke in Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinal arteriosclerosis was graded (0-4) by masked readers with a modified
      Scheie classification; a higher eye grade was defined as a person-level grade.
    explanation: The current study uses retinal arteriosclerosis and RAI terminology rather than a symptom-defined retinopathy syndrome.
- discussion_id: systemic_biomarker_causality_and_treatment_gap
  prompt: >-
    Do retinal arteriosclerotic grades independently predict future systemic
    vascular events, and does treatment of systemic risk factors alter the
    retinal grade or patient outcomes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Modified Scheie S-grade fundus assessment
  rationale: >-
    Recent cohorts show adjusted cross-sectional associations, but the available
    evidence does not establish temporal direction, independent causal
    specificity for systemic atherosclerosis, or a lesion-directed treatment
    effect. No disease-specific ocular therapy is curated without intervention
    evidence.
  evidence:
  - reference: PMID:42193361
    reference_title: "Retinal Arteriosclerosis in a Large Health Screening Cohort: Associations with Systemic Vascular Comorbidities and Stroke in Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support the potential role of retinal vascular changes as
      cross-sectional correlates of systemic vascular health. Longitudinal studies
      are needed to clarify temporal relationships and causality.
    explanation: The newest large cohort explicitly limits its conclusions to cross-sectional correlation.
  - reference: PMID:11525792
    reference_title: "Retinal microvascular abnormalities and their relationship with hypertension, cardiovascular disease, and mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are data supporting an association between retinal microvascular
      abnormalities and stroke, but there is no convincing evidence of an
      independent or direct association with atherosclerosis, ischemic heart
      disease, or cardiovascular mortality.
    explanation: >-
      The review records the longstanding uncertainty about direct systemic
      atherosclerosis and cardiovascular-outcome specificity.
review_notes: >-
  Re-review treated the MONDO class as a retinal arteriolar morphology that is
  still used in modified Scheie/RAI screening literature, while recognizing
  that the standalone label is not a standardized contemporary symptomatic
  syndrome. Retinal arteriolar narrowing, hemorrhages, hard exudates,
  cotton-wool spots, and optic-disc edema were not normalized as core phenotypes
  because they belong chiefly to hypertensive or other retinal injury patterns.
  OCT/OCTA cardiovascular analytics, serum urate, alcohol, and lipid associations
  were not promoted to diagnostic or causal mechanisms. No genetic cause,
  disease-specific biochemical biomarker, lesion-specific treatment, or clinical
  trial is asserted. The hypertensive-retinopathy differential is left without a
  structured disease binding because its current MONDO identifier does not pass
  the project's DiseaseTerm closure. Deep-research reports were treated only as
  leads; retained claims were checked against cached primary or review literature.

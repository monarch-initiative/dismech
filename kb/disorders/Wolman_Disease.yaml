  description: >
    Recombinant human lysosomal acid lipase replacement restores proximal enzyme
    function and substantially improves survival, growth, liver parameters, and
    other major disease manifestations when started early. Infusion management
    may require premedication or desensitization, and anti-drug antibodies can
    attenuate response in some patients.

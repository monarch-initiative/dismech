discussions:
- discussion_id: gap_wolman_adrenal_calcification_mechanism
  prompt: >
    Which in-vivo steps connect lysosomal neutral-lipid storage in the adrenal
    gland to adrenal necrosis and calcification in Wolman disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Adrenal Lipid Storage
  rationale: >
    Adrenal lipid infiltration, enlargement, and calcification are clinically
    documented, but the available mechanistic study is a cultured-cell hypothesis
    involving oxidized LDL uptake, calcium loading, cytotoxicity, and necrosis.
    It does not establish the sequence or its necessity in affected infants.
  proposed_experiments:
  - experiment_id: exp_wolman_adrenal_human_validation
    name: Human adrenal validation of the oxidized-LDL injury sequence
    description: >
      Compare LIPA-deficient and isogenic-corrected human adrenal cortical organoids
      after matched native- and mildly oxidized-LDL exposures, measuring LDL uptake,
      lysosomal neutral-lipid storage, calcium dynamics, necrosis, and mineral
      deposition over time. Compare the resulting molecular and spatial signature
      with archived adrenal tissue from affected infants and age-matched controls
      when such tissue is available.
    decision_criterion: >
      The cultured-cell mechanism is supported as a bridge to infant adrenal disease
      if LIPA deficiency produces an ordered excess-uptake, calcium-loading,
      necrosis, and mineralization sequence that is reversed by isogenic LIPA
      correction and is concordant with affected-infant adrenal pathology. Storage
      without the downstream injury sequence, or absence of that signature in
      affected-infant tissue, would refute the proposed bridge.
    would_support:
    - pathophysiology#Adrenal Lipid Storage
    - phenotypes#Adrenal calcification
    would_refute:
    - pathophysiology#Adrenal Lipid Storage
    - phenotypes#Adrenal calcification
  evidence:
  - reference: PMID:8037680
    reference_title: "New pathogenetic hypothesis for Wolman disease: possible role of oxidized low-density lipoproteins in adrenal necrosis and calcification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings support the hypothesis that the Wolman-disease adrenal damage (necrosis and calcification) could result from the association of the following events"
    explanation: The authors explicitly frame the oxidized-LDL mechanism as a hypothesis, leaving its in-vivo role unresolved.
- discussion_id: gap_wolman_lipa_aav_translation
  prompt: >
    Can liver-directed LIPA AAV safely and durably reproduce the knockout-mouse
    rescue in infants with rapidly progressive LAL-D?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Lysosomal Acid Lipase Deficiency
  rationale: >
    Liver-directed AAV produced broad biochemical and survival rescue in Lipa-null
    mice. The reviewed evidence is preclinical and therefore does not establish
    infant dosing, organ coverage, durability, vector immunity, or clinical safety.
  proposed_experiments:
  - experiment_id: exp_wolman_lipa_aav_human_translation
    name: Staged translation of liver-directed LIPA AAV to infantile LAL-D
    description: >
      Quantify dose, biodistribution, secreted LAL cross-correction, durability,
      pre-existing and treatment-emergent immunity, and organ toxicity in
      infant-relevant human hepatocyte-intestinal co-cultures and a nonhuman-primate
      bridging study. Advance only a candidate meeting prespecified bridging criteria
      to an early-phase infant study measuring LAL activity, organ lipid burden,
      liver and gastrointestinal disease, growth, vector immunity, and toxicity.
    decision_criterion: >
      Direct translation from the Lipa-null mouse is supported only if a tolerable
      exposure produces durable therapeutic LAL activity and cross-correction in the
      bridging systems and concordant biochemical and clinical improvement without
      unacceptable vector or immune toxicity in treated infants. Failure of organ
      coverage or durability, or dose-limiting toxicity before therapeutic activity,
      would refute direct extrapolation of the mouse rescue to infants.
    would_support:
    - experimental_models#Lipa-null mouse model with liver-directed LIPA AAV rescue
    - pathophysiology#Lysosomal Acid Lipase Deficiency
    would_refute:
    - experimental_models#Lipa-null mouse model with liver-directed LIPA AAV rescue
    - pathophysiology#Lysosomal Acid Lipase Deficiency
  evidence:
  - reference: PMID:39489913
    reference_title: Liver-directed AAV gene therapy normalizes disease symptoms and provides cross-correction in a model of lysosomal acid lipase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results show that this liver-directed LIPA gene therapy has the potential to be a transformative treatment for LAL-D."
    explanation: The investigators describe therapeutic potential based on a mouse study; clinical translation remains an open question.

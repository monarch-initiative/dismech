- name: Adrenal Lipid Storage
  biological_scale: TISSUE
  description: >
    Lipid deposition involves the adrenal glands and accompanies bilateral adrenal
    enlargement. The steps connecting storage to necrosis and calcification remain
    incompletely established.
  locations:
  - preferred_term: adrenal gland
    term:
      id: UBERON:0002369
      label: adrenal gland
  evidence:
  - reference: PMID:34401013
    reference_title: CT features of Wolman disease (lysosomal acid lipase enzyme deficiency) - A case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple organs such as adrenal glands, liver, spleen, bone marrow, small bowel loops, and abdominal lymph nodes are infiltrated by the deposition of lipids."
    explanation: The report directly supports adrenal lipid infiltration as part of multisystem storage.
  downstream:
  - target: Adrenal calcification
    description: >
      Adrenal lipid-storage disease is associated with calcification; oxidized-LDL
      uptake, cytotoxicity, calcium loading, and necrosis are a proposed intervening mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:8037680
      reference_title: "New pathogenetic hypothesis for Wolman disease: possible role of oxidized low-density lipoproteins in adrenal necrosis and calcification."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "These findings support the hypothesis that the Wolman-disease adrenal damage (necrosis and calcification) could result from the association of the following events: mild oxidation of LDL by adrenal cells, over-uptake of mildly oxidized LDL by Wolman cells (resulting from the block of the lysosomal degradation of cholesteryl esters in Wolman cells), and cytotoxicity related to the amount of mildly oxidized LDL internalized by cells."
      explanation: Human cultured-cell experiments support a mechanistic hypothesis, but do not establish the full causal sequence in infants in vivo.

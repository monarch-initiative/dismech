name: Wolman Disease
creation_date: '2026-04-14T19:53:03Z'
category: Mendelian
description: >
  Wolman disease is the rapidly progressive infantile phenotype of lysosomal acid
  lipase deficiency caused by biallelic pathogenic variants in LIPA. Near-complete
  loss of lysosomal acid lipase activity blocks lysosomal hydrolysis of cholesteryl
  esters and triglycerides, causing multisystem lipid storage in macrophages and
  parenchymal cells, especially in liver, intestine, spleen, lymphoid tissues,
  and adrenal cortex. The resulting hepatic dysfunction, malabsorption, failure
  to thrive, hepatosplenomegaly, anemia, and adrenal calcification lead to fatal
  multiorgan failure in early infancy if untreated. Early sebelipase alfa plus
  intensive nutritional management has changed survival substantially, although
  growth, gastrointestinal lipid storage, anemia, treatment immunogenicity, and
  other residual morbidity can persist. Wolman disease is the infantile end of
  the LAL-D spectrum, distinct from the later-onset cholesteryl ester storage
  disease phenotype.
disease_term:
  preferred_term: Wolman disease
  term:
    id: MONDO:0019148
    label: Wolman disease
parents:
- Lysosomal Storage Disease
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >
      Wolman disease is classified with metabolic disorders because its proximal
      lesion is inherited deficiency of the lysosomal neutral-lipid hydrolase LAL.
    evidence:
    - reference: PMID:26225414
      reference_title: Lysosomal Acid Lipase Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The phenotypic spectrum of lysosomal acid lipase deficiency (LAL-D) ranges from an infantile-onset form (previously known as Wolman disease) to childhood/adult-onset forms (previously known as cholesterol ester storage disease [CESD])."
      explanation: GeneReviews identifies Wolman disease as the infantile form of an inherited lysosomal enzyme deficiency, supporting placement in the metabolism chapter.
inheritance:
- name: Autosomal recessive
  description: >
    Wolman disease is inherited as an autosomal recessive disorder caused by
    biallelic LIPA pathogenic variants that severely reduce or abolish lysosomal
    acid lipase activity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28786388
    reference_title: "Wolman's disease and cholesteryl ester storage disorder: the phenotypic spectrum of lysosomal acid lipase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lysosomal acid lipase deficiency is a rare, autosomal recessive condition caused by mutations in the gene encoding lysosomal acid lipase (LIPA) that result in reduced or absent activity of this essential enzyme."
    explanation: This review directly supports autosomal recessive inheritance and LIPA-mediated lysosomal acid lipase deficiency.
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If both parents are known to be heterozygous for a LIPA pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews provides the autosomal-recessive sibling recurrence and carrier risks used in family counseling.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >
    Wolman disease is described as ultra-rare, but the reviewed sources do not
    provide a sufficiently robust population denominator for a numeric prevalence.
  evidence:
  - reference: PMID:39770929
    reference_title: Practical Recommendations for the Diagnosis and Management of Lysosomal Acid Lipase Deficiency with a Focus on Wolman Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lysosomal acid lipase deficiency (LAL-D) is an ultra-rare lysosomal storage disease with two distinct phenotypes, an infantile-onset form (formerly Wolman disease) and a later-onset form (formerly cholesteryl ester storage disease)."
    explanation: The expert recommendations characterize infantile-onset LAL-D as part of an ultra-rare disease spectrum without supplying a population rate.
progression:
- phase: Neonatal/Early infancy onset
  age_range: first weeks to months of life
  notes: >
    Symptoms begin in early infancy with persistent vomiting, failure to thrive,
    hepatosplenomegaly, liver dysfunction, and progressive gastrointestinal disease.
  evidence:
  - reference: PMID:24832708
    reference_title: "Infant case of lysosomal acid lipase deficiency: Wolman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In early onset LAL deficiency, clinical manifestations start in the first few weeks of life with persistent vomiting, failure to thrive, hepatosplenomegaly, liver dysfunction and hepatic failure."
    explanation: This infant case report and review directly supports early infantile onset with gastrointestinal and hepatic manifestations.
- phase: Untreated rapid progression
  age_range: first year of life
  notes: >
    Without treatment, disease progresses rapidly to multiorgan failure and death
    in infancy.
  evidence:
  - reference: PMID:34906190
    reference_title: "Sebelipase alfa enzyme replacement therapy in Wolman disease: a nationwide cohort with up to ten years of follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wolman disease (WD), the rapidly progressive phenotype of lysosomal acid lipase (LAL) deficiency, presents in neonates with failure to thrive and hepatosplenomegaly, and leads to multi-organ failure and death before 12 months of age."
    explanation: This nationwide cohort study summarizes the untreated natural history as rapidly progressive multiorgan failure in infancy.
- phase: Treatment-altered long-term course
  age_range: infancy through childhood
  notes: >
    Early diagnosis and sebelipase alfa have enabled multi-year survival and
    generally normal neurodevelopment, but residual growth, gastrointestinal,
    hematologic, and treatment-immunogenicity burdens require ongoing follow-up.
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, with early diagnosis and initiation of treatment, long-term survival has improved significantly, although treated individuals may continue to have suboptimal growth, iron deficiency anemia, and lipid accumulation in the gastrointestinal mucosa."
    explanation: GeneReviews directly defines the treatment-altered natural history and residual morbidity.
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Those with infantile-onset disease who are treated typically experience normal long-term intellectual and neurodevelopmental outcomes."
    explanation: GeneReviews supports generally normal long-term neurodevelopment among treated individuals.
  - reference: PMID:41270440
    reference_title: "Survival, growth, and safety findings in patients with rapidly progressive, infantile-onset LAL-D: Results from the international LAL-D registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 27 of 29 (93 %) patients survived during the median observation time (Q1, Q3) of 6.2 years (3.5, 8.4)."
    explanation: The international registry quantifies multi-year survival among 29 symptomatic infantile patients treated with sebelipase alfa.

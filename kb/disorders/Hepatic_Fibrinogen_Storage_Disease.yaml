  downstream:
  - target: ER Stress and Impaired Proteostasis
    description: >-
      The intracellular polymer burden imposes proteotoxic stress on the
      hepatocyte ER and overwhelms autophagic clearance.
  - target: Secondary Hypofibrinogenemia

infectious_agent:
- name: Burkholderia cepacia complex
  description: >-
    A group of closely related, intrinsically multidrug-resistant,
    environmentally ubiquitous Gram-negative bacteria that chronically infect the
    cystic fibrosis airway and, in a minority of infected patients, precipitate
    cepacia syndrome. Burkholderia cenocepacia and Burkholderia multivorans
    dominate among cystic fibrosis isolates.
  infectious_agent_term:
    preferred_term: Burkholderia cepacia complex
    term:
      id: NCBITaxon:87882
      label: Burkholderia cepacia complex
  evidence:
  - reference: PMID:36815622
    reference_title: "Cepacia syndrome in cystic fibrosis: A systematic review of the literature and possible new perspectives in treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Cepacia syndrome (CS) is an acute, necrotizing pneumonia with a high mortality rate, occurring in patients with cystic fibrosis (CF) infected with Burkholderia cepacia complex (BCC)."
    explanation: >-
      Defines cepacia syndrome as a complication of Burkholderia cepacia complex
      infection in cystic fibrosis.
  - reference: PMID:20880411
    reference_title: "Burkholderia cenocepacia in cystic fibrosis: epidemiology and molecular mechanisms of virulence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of the 17 formally named species within the complex, Burkholderia multivorans and Burkholderia cenocepacia dominate in CF."
    explanation: >-
      Establishes B. multivorans and B. cenocepacia as the dominant complex
      species in cystic fibrosis.
- name: Burkholderia cenocepacia
  description: >-
    The Burkholderia cepacia complex species most frequently responsible for
    cepacia syndrome, and the one associated with the worst cystic fibrosis
    outcomes. It includes the globally distributed epidemic ET12 (ST28) and ST32
    lineages, which spread between patients and carry virulence and
    antimicrobial-resistance determinants.
  infectious_agent_term:
    preferred_term: Burkholderia cenocepacia
    term:
      id: NCBITaxon:95486
      label: Burkholderia cenocepacia
  evidence:
  - reference: PMID:36815622
    reference_title: "Cepacia syndrome in cystic fibrosis: A systematic review of the literature and possible new perspectives in treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Burkholderia cenocepacia was the most frequently reported causative agent."
    explanation: >-
      In the 18 published cepacia syndrome cases reviewed, B. cenocepacia was the
      species most often reported.
  - reference: PMID:25694518
    reference_title: "Gene expression profiling of Burkholderia cenocepacia at the time of cepacia syndrome: loss of motility as a marker of poor prognosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The most common causative agent is Burkholderia cenocepacia, a clinically dominant Bcc species that contains the globally distributed epidemic strain sequence type 32 (ST32)."
    explanation: >-
      Names B. cenocepacia, and specifically the ST32 epidemic lineage, as the
      commonest cause of cepacia syndrome.
- name: Burkholderia multivorans
  description: >-
    The second Burkholderia cepacia complex species that dominates in cystic
    fibrosis and that can cause cepacia syndrome. It is now the most prevalent
    complex species in the United States and Canada, and is generally associated
    with less severe outcomes than B. cenocepacia.
  infectious_agent_term:
    preferred_term: Burkholderia multivorans
    term:
      id: NCBITaxon:87883
      label: Burkholderia multivorans
  evidence:
  - reference: PMID:15516469
    reference_title: "Burkholderia cenocepacia and Burkholderia multivorans: influence on survival in cystic fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Deaths from \"cepacia syndrome\" occurred in both BCC groups."
    explanation: >-
      In a cohort comparing B. multivorans and B. cenocepacia, deaths from
      cepacia syndrome occurred in both, so B. multivorans can also cause it.
  - reference: PMID:32946281
    reference_title: "Epidemiology of Burkholderia Infections in People with Cystic Fibrosis in Canada between 2000 and 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Forty-nine percent (n = 666) of all isolates and 47% (n = 179) of new incident infections were identified as B. multivorans."
    explanation: >-
      Documents B. multivorans as the most frequent complex species in a
      contemporary Canadian cystic fibrosis cohort.
classifications:
  harrisons_chapter:

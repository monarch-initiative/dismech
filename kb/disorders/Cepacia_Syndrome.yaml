notes: >-
  The literature on cepacia syndrome is thin: the largest synthesis is a
  systematic review of 18 published cases (PMID:36815622), and most other
  evidence is single case reports and small cystic fibrosis cohorts, so
  frequency figures beyond the defining triad are not reliably quantified.
  Reported case fatality ranges from about 50% (pooled cases) to 62% (the
  original series) and up to 75% in one non-CF report. Cystic fibrosis is the
  usual host; chronic granulomatous disease and, rarely, previously well
  non-CF hosts are also affected, and these are kept in one entry because they
  are the same pathogen-defined syndrome rather than distinct diseases.
review_notes: >-
  Deliberately lumped. The Burkholderia cepacia complex species that cause
  cepacia syndrome (B. cenocepacia including the ET12/ST28 and ST32 epidemic
  lineages, B. multivorans, and rarer complex members such as B. ambifaria) are
  kept in one entry because the published literature, searched on PubMed as
  "cepacia syndrome" and as Burkholderia cepacia with necrotizing pneumonia,
  describes one clinical syndrome (necrotizing pneumonia, bacteremia, rapid
  respiratory decline) whose presentation and management do not differ by
  species; the species differ chiefly in prognosis and in transplant
  eligibility, which are carried in the infectious_agent descriptions and the
  transplant treatment rather than as separate diseases. The host contexts
  (cystic fibrosis, chronic granulomatous disease, rare immunocompetent hosts)
  are likewise lumped as one pathogen-defined entity.

agent_life_cycle:
  description: >-
    Burkholderia cepacia complex bacteria are environmental saprophytes
    ubiquitous in soil and water that survive on abiotic hospital surfaces and in
    disinfectants, and that can be acquired both from the environment and, among
    people with cystic fibrosis, by patient-to-patient spread. The human airway
    is the site of chronic colonization from which cepacia syndrome arises.
  hosts:
  - preferred_term: Homo sapiens
    role: opportunistic host (cystic fibrosis, chronic granulomatous disease, rarely immunocompetent)
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:29082233
    reference_title: "Macrophages as drivers of an opportunistic infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "These bacteria are ubiquitously present in nature and are highly tolerant to many different stress conditions, allowing them to survive in industrial and hospital environments, persisting on abiotic surfaces or in supposedly sterile medical solutions and even disinfectants."
    explanation: >-
      Describes the environmental and hospital reservoirs from which BCC is
      acquired.
transmission:
- name: Patient-to-patient transmission among people with cystic fibrosis
  description: >-
    Burkholderia cepacia complex spreads between people with cystic fibrosis by
    direct and indirect contact, including social contact outside hospital, which
    is why cohort segregation and infection-control measures are central to
    prevention. Non-cystic-fibrosis acquisition is usually nosocomial from
    contaminated equipment or the environment.
  evidence:
  - reference: PMID:7505294
    reference_title: "Epidemic of Pseudomonas cepacia in an adult cystic fibrosis unit: evidence of person-to-person transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Investigation of the outbreak by ribotyping and pulsed-field gel electrophoresis to characterize P. cepacia strain genomes together with inquiry into social contacts between patients revealed evidence of person-to-person transmission outside the hospital environment."
    explanation: >-
      Documents person-to-person transmission of BCC between cystic fibrosis
      patients, including outside hospital.
  - reference: PMID:28878751
    reference_title: "Burkholderia cenocepacia Infections in Cystic Fibrosis Patients: Drug Resistance and Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Transmission of Bcc infection occurs as a consequence of both direct and indirect contact (e.g., via infectious droplets) between patients."
    explanation: >-
      States that BCC is transmitted between patients by direct and indirect
      contact.
progression:
- phase: Chronic BCC colonization
  notes: >-
    Years of chronic airway colonization by the Burkholderia cepacia complex
    usually precede cepacia syndrome; in the systematic review the median time
    from first BCC infection to cepacia syndrome was 5 years.
  evidence:
  - reference: PMID:36815622
    reference_title: "Cepacia syndrome in cystic fibrosis: A systematic review of the literature and possible new perspectives in treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "median time to CS after first infection by BCC was 5 years (range: 1-26 years)."
    explanation: >-
      Quantifies the latency from BCC acquisition to cepacia syndrome.
- phase: Acute necrotizing pneumonia with bacteremia
  notes: >-
    A rapid clinical deterioration follows, with high fever, progressive
    respiratory failure and dissemination of the organism into the bloodstream.
  evidence:
  - reference: PMID:6420530
    reference_title: "Pseudomonas cepacia infection in cystic fibrosis: an emerging problem."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A syndrome characterized by high fever, severe progressive respiratory failure, leukocytosis, and elevated erythrocyte sedimentation rate has occurred in eight patients over the past 3 years, with a 62% fatality rate."
    explanation: >-
      The original description of the acute phase of cepacia syndrome.
- phase: Septic shock and death, or recovery
  notes: >-
    Many patients progress to refractory shock and multiorgan dysfunction; about
    half of reported cases die, while aggressive combination therapy has salvaged
    a minority.
  evidence:
  - reference: PMID:36815622
    reference_title: "Cepacia syndrome in cystic fibrosis: A systematic review of the literature and possible new perspectives in treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Half of the patients died (9/18, 50%)."
    explanation: >-
      Reports the roughly 50% case fatality in the pooled published cases.
pathophysiology:
- name: Chronic BCC Airway Colonization
  role: trigger
  node_class: ENVIRONMENTAL_EFFECT
  biological_scale: TISSUE
  description: >-
    The Burkholderia cepacia complex chronically colonizes the lower airway, most
    often in cystic fibrosis, providing the persisting bacterial population from
    which cepacia syndrome arises.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Intramacrophage Survival and Replication
    causal_link_type: DIRECT
    description: >-
      Colonizing organisms are taken up by, and survive within, airway
      macrophages.
  - target: LPS-Driven TLR4 Hyperinflammation
    causal_link_type: DIRECT
    description: >-
      Bacterial lipopolysaccharide drives a Toll-like-receptor-4-dependent
      inflammatory response in the colonized airway.
  evidence:
  - reference: PMID:28878751
    reference_title: "Burkholderia cenocepacia Infections in Cystic Fibrosis Patients: Drug Resistance and Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It can infect cystic fibrosis (CF) patients causing a severe decline in lung function which can further develop into a life-threatening systemic infection known as cepacia syndrome."
    explanation: >-
      Places chronic airway infection as the precursor of the systemic cepacia
      syndrome.
- name: Intrinsic Multidrug Resistance
  role: disposition
  node_class: DISPOSITION
  biological_scale: MOLECULAR
  description: >-
    Burkholderia cepacia complex bacteria are constitutively resistant to many
    antibiotic classes through efflux pumps and their outer-membrane composition,
    so standard regimens frequently fail regardless of in vitro findings. This is
    a therapeutic-vulnerability node, not a step in the causal cascade.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
    modifier: INCREASED
  evidence:
  - reference: PMID:29082233
    reference_title: "Macrophages as drivers of an opportunistic infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The presence of a large number of efflux pumps and their membrane composition makes these bacteria highly resistant to many antibiotics used in clinical practice."
    explanation: >-
      Attributes intrinsic multidrug resistance to efflux pumps and membrane
      composition.
  - reference: PMID:6420530
    reference_title: "Pseudomonas cepacia infection in cystic fibrosis: an emerging problem."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Because P. cepacia strains are uniformly resistant to ticarcillin, piperacillin, and aminoglycosides, and because ceftazidime is ineffective despite in vitro activity, treatment of these infections is very difficult."
    explanation: >-
      Documents resistance to multiple antibiotic classes and in-vitro/in-vivo
      discordance.
- name: Intramacrophage Survival and Replication
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  node_class: CELLULAR_EFFECT
  biological_scale: CELLULAR
  description: >-
    Burkholderia cepacia complex is a facultative intracellular pathogen that
    survives and replicates within macrophages by interfering with phagosome
    maturation; in vivo the intramacrophage stage is required for bacterial
    proliferation and drives the fatal pro-inflammatory response. The
    intracellular niche also helps exclude poorly cell-penetrant antibiotics.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Systemic Dissemination and Bacteremia
    causal_link_type: DIRECT
    description: >-
      After cycles of intracellular replication the organism spreads
      systemically and re-enters the bloodstream.
  - target: LPS-Driven TLR4 Hyperinflammation
    causal_link_type: DIRECT
    description: >-
      Intramacrophage infection drives the pro-inflammatory response.
  evidence:
  - reference: PMID:29082233
    reference_title: "Macrophages as drivers of an opportunistic infection."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "we provide experimental evidence that macrophages are critically important for proliferation of B. cenocepacia, and are major drivers of fatal pro-inflammatory infections in zebrafish larvae."
    explanation: >-
      Shows the intramacrophage stage is required for proliferation and for the
      fatal inflammatory response in a zebrafish model.
  - reference: PMID:29082233
    reference_title: "Macrophages as drivers of an opportunistic infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A clinical study 16 years ago from Sajjan, at that time in the Forstner lab, localized Bcc bacteria in macrophages in infected CF lungs."
    explanation: >-
      Corroborates the intramacrophage localization in human cystic fibrosis
      lungs.
- name: LPS-Driven TLR4 Hyperinflammation
  node_class: CELLULAR_EFFECT
  biological_scale: CELLULAR
  description: >-
    Burkholderia cepacia complex lipopolysaccharide activates TLR4/CD14 signaling
    in monocytes and macrophages, driving MAP-kinase and NF-kappaB-dependent
    release of pro-inflammatory cytokines such as TNF and IL-6. B. cenocepacia
    LPS is a more potent cytokine inducer than B. multivorans LPS.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: toll-like receptor 4 signaling pathway
    term:
      id: GO:0034142
      label: toll-like receptor 4 signaling pathway
    modifier: INCREASED
  - preferred_term: positive regulation of tumor necrosis factor production
    term:
      id: GO:0032760
      label: positive regulation of tumor necrosis factor production
  - preferred_term: positive regulation of interleukin-6 production
    term:
      id: GO:0032755
      label: positive regulation of interleukin-6 production
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Necrotizing Pneumonia
    causal_link_type: DIRECT
    description: >-
      Unrestrained airway inflammation contributes to tissue destruction and
      necrotizing pneumonia.
  - target: Septic Shock and Multiorgan Dysfunction
    causal_link_type: DIRECT
    description: >-
      Systemic cytokine release contributes to septic shock.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      The systemic inflammatory response produces the high fever of the acute
      syndrome.
  - target: Increased total leukocyte count
    causal_link_type: DIRECT
    description: >-
      The acute inflammatory response produces the accompanying leukocytosis.
  - target: Elevated erythrocyte sedimentation rate
    causal_link_type: DIRECT
    description: >-
      The acute-phase inflammatory response raises the erythrocyte
      sedimentation rate.
  evidence:
  - reference: PMID:17002785
    reference_title: "Highly purified lipopolysaccharides from Burkholderia cepacia complex clinical isolates induce inflammatory cytokine responses via TLR4-mediated MAPK signalling pathways and activation of NFkappaB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "LPS from all clinical Bcc isolates induced significant pro-inflammatory cytokines and utilized TLR4 and CD14 to mediate activation of mitogen-activated protein kinase pathways, IkappaB-alpha degradation and NFkappaB activation."
    explanation: >-
      Demonstrates TLR4/CD14-dependent MAPK and NF-kappaB activation and cytokine
      induction by BCC LPS.
  - reference: PMID:17002785
    reference_title: "Highly purified lipopolysaccharides from Burkholderia cepacia complex clinical isolates induce inflammatory cytokine responses via TLR4-mediated MAPK signalling pathways and activation of NFkappaB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In cystic fibrosis (CF), bacteria of the Burkholderia cepacia complex (Bcc) can induce a fulminant inflammation with pneumonitis and sepsis."
    explanation: >-
      States that BCC drives fulminant inflammation with pneumonitis and sepsis.
  - reference: PMID:15044201
    reference_title: "Burkholderia cenocepacia lipopolysaccharide, lipid A, and proinflammatory activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We found varying biological activity within and between genomovars, with B. cenocepacia strains possessing the greatest cytokine induction activity."
    explanation: >-
      Shows B. cenocepacia LPS is the most potent cytokine inducer among complex
      species.
- name: Systemic Dissemination and Bacteremia
  node_class: SYSTEMIC_EFFECT
  biological_scale: ORGANISM
  description: >-

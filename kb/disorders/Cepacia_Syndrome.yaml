name: Cepacia Syndrome
creation_date: "2026-11-26T15:45:36Z"
description: >-
  Cepacia syndrome is an acute, often fatal clinical syndrome in which infection
  with the Burkholderia cepacia complex (BCC) progresses to a rapidly advancing
  necrotizing pneumonia with bacteremia, worsening respiratory failure, high
  fever and leukocytosis. It occurs chiefly in people with cystic fibrosis who
  are chronically colonized by BCC, typically years after acquisition, and is
  also reported in chronic granulomatous disease and, rarely, in previously
  well non-cystic-fibrosis hosts. Burkholderia cenocepacia, especially the
  epidemic ET12 (ST28) and ST32 lineages, is the species most often responsible,
  followed by Burkholderia multivorans. The organism is intrinsically resistant
  to many antibiotics, survives inside macrophages, and drives a
  lipopolysaccharide-mediated hyperinflammatory response; mortality is roughly
  half of reported cases. BCC infection is patient-to-patient transmissible, so
  segregation and infection-control measures are central to prevention, and
  B. cenocepacia infection is a relative or absolute contraindication to lung
  transplantation.
category: Infectious Disease

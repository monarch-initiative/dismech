treatments:
- name: Combination intravenous and inhaled antimicrobial therapy
  description: >-
    Because the organism is intrinsically multidrug-resistant, cepacia syndrome
    is treated with aggressive combinations of intravenous and inhaled
    antimicrobials, most often including cotrimoxazole
    (trimethoprim-sulfamethoxazole), ceftazidime, a carbapenem such as meropenem,
    and inhaled or enteral agents such as tobramycin and minocycline.

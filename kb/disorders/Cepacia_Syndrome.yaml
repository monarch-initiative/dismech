animal_models:
- name: Zebrafish larval B. cenocepacia infection
  species: Zebrafish
  genotype: wild-type larvae infected with B. cenocepacia K56-2
  publication: PMID:29082233
  description: >-
    Zebrafish larvae injected with B. cenocepacia K56-2 develop a rapid,
    macrophage-dependent, fatal pro-inflammatory infection; depleting
    macrophages abolishes bacterial proliferation, establishing the
    intramacrophage stage as the critical replication site in vivo.
  modeled_mechanisms:
  - target: Intramacrophage Survival and Replication
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Larval zebrafish have no cystic fibrosis airway background and no mature
      adaptive immunity at the stage assayed, so the model reports
      intramacrophage replication and the lethal inflammatory response without
      the chronic-colonization context that precedes the human syndrome, and
      no single animal model reproduces the full human cepacia-syndrome triad.
    evidence:

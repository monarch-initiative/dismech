inheritance:
- name: X-linked inheritance with mechanism-dependent expression in females
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  expressivity: VARIABLE
  description: >-
    GRIA3 is X-chromosomal, so transmission follows an X-linked pattern, but a single
    recessive/dominant label does not describe the disorder. Affected males most often carry
    a hemizygous loss-of-function allele inherited from a clinically healthy carrier mother,
    while affected females most often carry a de novo heterozygous gain-of-function allele.
    Both variant classes are disease-causing in both sexes.
  evidence:
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function and gain-of-function variants were disease-causing in both sexes but affected males often carried de novo or hemizygous loss-of-function variants inherited from healthy mothers, whereas affected females had mostly de novo heterozygous gain-of-function variants."
    explanation: >-
      States the sex- and mechanism-dependent transmission pattern that this inheritance
      block records, including that both allele classes affect both sexes.
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMPARs form by homo- or heteromeric assembly of subunits encoded by the GRIA1-GRIA4 genes, of which only GRIA3 is X-chromosomal."
    explanation: >-
      Establishes that GRIA3 is the X-chromosomal member of the AMPA receptor subunit family,
      which is why this disorder alone among the GRIA disorders is X-linked.
- name: X-linked recessive inheritance in carrier-mother pedigrees
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  penetrance: UNKNOWN
  description: >-
    The historical Wu-type pedigrees are classic X-linked recessive families in which
    hemizygous males are affected and heterozygous carrier mothers are clinically normal or
    only mildly affected. This describes many familial loss-of-function pedigrees but is
    incomplete for de novo gain-of-function disease.
  evidence:
  - reference: PMID:41462794
    reference_title: "Non-Convulsive Status Epilepticus and Mild Neurodevelopmental Phenotype in a Female with a Novel p.Thr657Ala Variant in the GRIA3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRIA3 is located on the X-chromosome, and pathogenic variants may be transmitted from unaffected carrier mothers to affected male offspring, a pattern typical of several X-linked neurodevelopmental disorders"
    explanation: >-
      Describes the carrier-mother-to-affected-son transmission that defines the recessive
      pedigree pattern.
  - reference: PMID:34731330
    reference_title: "Myoclonic status epilepticus and cerebellar hypoplasia associated with a novel variant in the GRIA3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The GRIA3 gene maps to chromosome Xq25 and the c.2360A > G variant was transmitted by his healthy mother."
    explanation: >-
      Worked example of maternal transmission of a pathogenic GRIA3 allele from a clinically
      healthy carrier to an affected son.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence, incidence or carrier-frequency estimate exists. The
    largest published series is 25 functionally characterised patients from 23 families, and
    fewer than a hundred individuals have been described in total, so only a qualitative
    ultra-rare band is defensible. A rate per 100,000 cannot be responsibly derived from
    case reports and is deliberately left unset.
  evidence:
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We collected detailed clinical data from 25 patients (from 23 families) harbouring 17 of these variants."
    explanation: >-
      The largest assembled cohort is 25 patients from 23 families, which is the scale of the
      published literature and the basis for the ultra-rare classification.
  - reference: PMID:36726007
    reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 20 variants have been reported, including balanced translocation, deletion, duplication, and missense variants."
    explanation: >-
      Independent confirmation that the total reported variant count was in the dozens, not a
      population-scale figure.

pathophysiology:
- name: GRIA3 Pathogenic Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A germline sequence or structural alteration of GRIA3 at Xq25 — missense, canonical
    splice-site, frameshift, multi-exon deletion or duplication, or a translocation
    disrupting the locus — is the initiating lesion. GRIA3 encodes GluA3, the sole
    X-chromosomal member of the GRIA1-GRIA4 family that assembles into AMPA-type ionotropic
    glutamate receptors, so a single hemizygous allele in a male is sufficient and a
    heterozygous allele in a female acts against a mosaic wild-type background.
  genes:
  - preferred_term: GRIA3
    term:
      id: hgnc:4573
      label: GRIA3
  downstream:
  - target: GluA3 Loss of Function
    causal_link_type: DIRECT
    description: >-
      Splice disruption, protein truncation, exon deletion, or a missense change that
      stabilises a non-conducting channel removes GluA3-mediated current.
    evidence:
    - reference: PMID:42666715
      reference_title: "Reclassification of the GRIA3 splice-site variant in an X-linked family with intellectual disability and psychiatric symptoms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The minigene assay further confirmed that this variant lead to exon 2 skipping."
      explanation: >-
        Demonstrates that a GRIA3 splice-site allele produces aberrant transcript processing,
        the transcriptional route from variant to loss of GluA3 function.
  - target: GluA3 Gain of Function
    causal_link_type: DIRECT
    description: >-
      A subset of missense alleles in and around the channel gate instead slows receptor
      desensitisation and deactivation, prolonging rather than abolishing current.
    evidence:
    - reference: PMID:35031858
      reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patch-clamp recordings showed that the human GluA3 mutant (p.Ala615Val) had slower desensitization and deactivation kinetics."
      explanation: >-
        Patch-clamp of the mutant receptor establishes that this class of GRIA3 variant acts
        by prolonging channel gating rather than by removing function.
  evidence:
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMPARs form by homo- or heteromeric assembly of subunits encoded by the GRIA1-GRIA4 genes, of which only GRIA3 is X-chromosomal."
    explanation: >-
      Identifies GRIA3 as the X-chromosomal AMPA receptor subunit gene whose alteration is the
      initiating lesion of this disorder.
  - reference: PMID:34731330
    reference_title: "Myoclonic status epilepticus and cerebellar hypoplasia associated with a novel variant in the GRIA3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the causative role of GRIA3 in XLID patients has been suggested also for Xq25 copy number variants"
    explanation: >-
      Records that structural Xq25 lesions, not only single-nucleotide variants, constitute the
      initiating GRIA3 alteration in X-linked intellectual disability.

- name: GluA3 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss-of-function alleles reduce or abolish GluA3 activity by disrupting transcription or
    splicing, truncating the protein, deleting exons, or — for the p.Ala653Thr gate variant —
    stabilising the assembled channel in a closed, non-conducting conformation. In the
    functionally screened variant set, loss and gain of function together accounted for 31 of
    44 tested alleles, so neither direction can be assumed from variant rarity alone.
  molecular_functions:
  - preferred_term: GluA3-containing AMPA receptor channel activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004971
      label: AMPA glutamate receptor activity
  genetic_context:
    gene:
      preferred_term: GRIA3
      term:
        id: hgnc:4573
        label: GRIA3
    allele_type: missense, canonical splice-site, frameshift, and multi-exon deletion alleles
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Typically hemizygous in affected males and inherited from a clinically healthy carrier
      mother, though de novo loss-of-function alleles also occur and heterozygous females can
      be affected, so zygosity is left unset rather than asserting the modal case. Mechanisms
      with direct functional support are exon-2 skipping from c.268+1G>C, the p.Glu787Gly
      allele that produced no measurable current, and the p.Ala653Thr closed-channel allele.
      A multi-exon deletion is also reported but only in a source with no PubMed record, so it
      is described here rather than cited. p.Gly630Arg is a segregating familial allele with no
      electrophysiology and is deliberately not assigned a functional direction.
  downstream:
  - target: Reduced AMPA Receptor-Mediated Excitatory Current
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29016847
      reference_title: "A point mutation in the ion conduction pore of AMPA receptor GRIA3 causes dramatically perturbed sleep patterns as well as intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro, the GRIA3(A653T) mutation stabilizes the channel in a closed conformation, in contrast to Lurcher."
      explanation: >-
        A closed-channel conformation is the direct biophysical route from a loss-of-function
        allele to reduced AMPA receptor current.
    - reference: PMID:34731330
      reference_title: "Myoclonic status epilepticus and cerebellar hypoplasia associated with a novel variant in the GRIA3 gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When glutamate (10 mM) was applied to HEK cells transfected with GluA3o and GluA3o_E787G, we observed the latter to produce no currents"
      explanation: >-
        A second loss-of-function allele measured directly: the mutant receptor carries no
        current at all, which is the edge stated as a measurement rather than an inference.
  evidence:
  - reference: PMID:35031858
    reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemizygous loss-of-function (LOF) variants in GRIA3 cause a neurodevelopmental disorder (NDD) in male individuals."
    explanation: >-
      States that hemizygous GRIA3 loss of function is an established cause of the
      neurodevelopmental phenotype in males.
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thirty-one variants alter receptor function and show loss-of-function or gain-of-function properties, whereas 13 appeared neutral."
    explanation: >-
      Systematic electrophysiological screening establishes loss of function as one of two
      distinct functional classes among pathogenic GRIA3 alleles, alongside a substantial
      functionally neutral fraction.
  - reference: PMID:29016847
    reference_title: "A point mutation in the ion conduction pore of AMPA receptor GRIA3 causes dramatically perturbed sleep patterns as well as intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation (A653T) falls within the highly conserved transmembrane domain of the ion channel gate"
    explanation: >-
      Locates the archetypal closed-channel loss-of-function allele in the ion-conduction gate,
      explaining why it removes current without removing the protein.

- name: GluA3 Gain of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Gain-of-function alleles prolong receptor activation by slowing desensitisation and
    deactivation, so each glutamate release event drives a longer-lasting depolarising
    current. This is a qualitative change in gating kinetics rather than simply more receptor
    activity, and it produces a clinical picture opposite to loss of function in muscle tone
    and seizure onset age.
  molecular_functions:
  - preferred_term: GluA3-containing AMPA receptor channel activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004971
      label: AMPA glutamate receptor activity
  genetic_context:
    gene:
      preferred_term: GRIA3
      term:
        id: hgnc:4573
        label: GRIA3
    allele_type: missense alleles clustering in and around the channel gate and M3-S2 linker
    variant_origin: DE_NOVO
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Zygosity is deliberately left unset because the single-valued slot cannot represent this
      branch: affected females are heterozygous and affected males hemizygous, and both occur.
      p.Ala615Val is the only allele here whose gain of function was measured, by patch clamp,
      in a hemizygous de novo male. The female alleles usually cited alongside it —
      p.Met661Thr and p.Thr657Ala — were never tested electrophysiologically; their assignment
      to this branch is inferred from residue position and from the hypertonic phenotype, and
      both source papers say so explicitly.
  downstream:
  - target: Prolonged AMPA Receptor-Mediated Excitatory Current
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35031858
      reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patch-clamp recordings showed that the human GluA3 mutant (p.Ala615Val) had slower desensitization and deactivation kinetics."
      explanation: >-
        Slowed desensitisation and deactivation are precisely the kinetic changes that prolong
        the receptor-mediated current, so this measurement is the edge itself.
  evidence:
  - reference: PMID:35031858
    reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His neurological signs, such as hypertonia and hyperreflexia, were opposite to those in previous cases having LOF GRIA3 variants."
    explanation: >-
      Establishes gain of function as a mechanistically distinct class whose clinical signs run
      opposite to loss of function, which is the reason this pathograph branches.
  - reference: PMID:35031858
    reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A fly line expressing a human GluA3 mutant possessing our variant and the Lurcher variant, which makes ion channels leaky, showed developmental defects, while one expressing a mutant possessing either of them did not."
    explanation: >-
      Transgenic Drosophila expressing the human mutant subunit shows a genetic interaction with
      a leaky-channel allele, independent in vivo support for a gain-of-function effect.
  - reference: PMID:37921875
    reference_title: "Clinical and functional consequences of GRIA variants in patients with neurological diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These variants produce changes in agonist EC50, response time course, desensitization, and/or receptor surface expression."
    explanation: >-
      Broader GRIA functional survey confirms that altered desensitisation and response time
      course are the recurring biophysical consequences of pathogenic AMPA receptor variants.

- name: Reduced AMPA Receptor-Mediated Excitatory Current
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss of GluA3 conductance reduces the fast excitatory postsynaptic current carried by
    GluA2/3 heterotetramers, one of the two major hippocampal AMPA receptor populations.
    Clinically this branch is enriched for low muscle tone, later seizure onset, and severely
    disorganised sleep-wake architecture.

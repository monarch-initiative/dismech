animal_models:
- name: Gria3 knockout mouse
  species: Mus musculus
  genotype: Gria3-/Y germline knockout on C57BL/6J background
  background: C57BL/6J
  publication: PMID:22285418
  category: Genetically engineered
  description: >-
    Constitutive germline null allele in hemizygous males. Reproduces behavioural and
    monoaminergic consequences of losing GluA3 but not the defining human cognitive phenotype.
  genes:
  - preferred_term: Gria3
    term:
      id: hgnc:4573
      label: GRIA3
  modeled_mechanisms:
  - target: GluA3 Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      A null allele is the cleanest available model of complete GluA3 loss of function and
      isolates the consequences of absent GluA3 from any residual mutant-subunit effect.
    limitations: >-
      A complete null is not what most patients carry: human loss-of-function alleles are
      usually missense or splice changes that still produce a subunit which is incorporated
      into heterotetramers, so a knockout cannot report dominant-negative or assembly effects.
      The null is also constitutive and whole-body rather than neuron- or stage-restricted.
    readouts:
    - name: Isolation-induced male aggression
      target: GluA3 Loss of Function
      direction: INCREASED
      interpretation: >-
        Behavioural consequence of absent GluA3, matching the aggressive outbursts described in
        affected adult males.
      evidence:
      - reference: PMID:22285418
        reference_title: "GluA3-deficiency in mice is associated with increased social and aggressive behavior and elevated dopamine in striatum."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Compared to wild type (WT) littermates (n=14), Gria3-/Y mice (n=13) showed an increase in isolation-induced male aggression (p=0.011) in home cage resident-intruder test"
        explanation: >-
          Reports the measured increase in aggression with its comparator and significance.
    - name: Striatal dopamine concentration
      target: GluA3 Loss of Function
      direction: INCREASED
      interpretation: >-
        Neurochemical correlate of GluA3 loss, indicating that the lesion propagates into
        monoaminergic circuitry rather than staying confined to glutamatergic synapses.
      evidence:
      - reference: PMID:22285418
        reference_title: "GluA3-deficiency in mice is associated with increased social and aggressive behavior and elevated dopamine in striatum."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Increased dopamine concentrations in stratum (p=0.034) and reduced serotonin turnover in olfactory bulb (p=0.002) were documented in Gria3-/Y mice."
        explanation: >-
          Reports the measured striatal dopamine increase and the olfactory-bulb serotonin change.
    evidence:
    - reference: PMID:22285418
      reference_title: "GluA3-deficiency in mice is associated with increased social and aggressive behavior and elevated dopamine in striatum."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results support a role of GluA3 in the modulation of social behavior through brain dopamine and/or serotonin signaling and different AMPA receptor subunits affect social behavior through distinct mechanisms."
      explanation: >-
        The authors' own conclusion that the knockout is informative for GluA3-dependent
        behavioural regulation.
  - target: Disturbed Excitatory Synaptic Transmission and Plasticity
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The knockout does not reproduce the cognitive impairment that defines the human disorder.
      Spatial memory was intact on both the Morris water maze and the Y-maze, so the model
      cannot be used to read out the learning-and-memory limb of this node.
    limitations: >-
      Rodent spatial navigation tasks are a narrow and species-specific proxy for human global
      developmental impairment, so an intact result does not prove the node is unaffected — only
      that this model does not report it. Compensation by GluA1- and GluA2-containing receptors
      during development is a plausible explanation that the study does not exclude.
    readouts:
    - name: Spatial memory in Morris water maze and Y-maze
      target: Disturbed Excitatory Synaptic Transmission and Plasticity
      direction: UNCHANGED
      interpretation: >-
        A genuine negative result: the cognitive readout most analogous to the human phenotype is
        unaffected in the null mouse.
      evidence:
      - reference: PMID:22285418
        reference_title: "GluA3-deficiency in mice is associated with increased social and aggressive behavior and elevated dopamine in striatum."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Gria3-/Y mice showed no significant deficit in spatial memory function in Morris-water maze and Y-maze tests, and normal levels of testosterone."
        explanation: >-
          Reports the negative spatial memory result that grounds the failure to recapitulate.
    evidence:
    - reference: PMID:22285418
      reference_title: "GluA3-deficiency in mice is associated with increased social and aggressive behavior and elevated dopamine in striatum."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Gria3-/Y mice showed no significant deficit in spatial memory function in Morris-water maze and Y-maze tests, and normal levels of testosterone."
      explanation: >-
        Substantiates the negative claim that this model does not reproduce the cognitive
        consequence of disturbed excitatory transmission.

- name: Gria3 A653T knock-in mouse
  species: Mus musculus
  genotype: Gria3 A653T hemizygous CRISPR-Cas9 knock-in
  publication: PMID:29016847
  category: Genetically engineered
  description: >-
    Allele-specific knock-in of the orthologue of the human closed-channel loss-of-function
    variant, generated to test whether that allele explains the extreme sleep-wake phenotype in
    the index sibship. It is the strongest allele-level human-to-mouse concordance in the
    disorder.
  genes:
  - preferred_term: Gria3
    term:
      id: hgnc:4573
      label: GRIA3
  modeled_mechanisms:
  - target: Reduced AMPA Receptor-Mediated Excitatory Current
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Carries the exact human loss-of-function allele and reproduces the sleep-architecture and
      light-sensitivity consequences attributed to reduced GluA3 current in the patients.
    limitations: >-
      Reproduces the sleep and circadian limb of the phenotype but not the developmental delay,
      epilepsy or tone abnormalities, so it models one downstream consequence of the reduced
      current rather than the disorder. Mouse sleep is polyphasic and its architecture is not
      directly comparable to the multi-day human wake and sleep periods that motivated the model.
    readouts:
    - name: Number of brief activity and sleep bouts
      target: Reduced AMPA Receptor-Mediated Excitatory Current
      direction: DECREASED
      interpretation: >-
        Loss of the normal polyphasic sleep structure, the murine counterpart of the very long
        consolidated wake and sleep periods seen in the patients.
      evidence:
      - reference: PMID:29016847
        reference_title: "A point mutation in the ion conduction pore of AMPA receptor GRIA3 causes dramatically perturbed sleep patterns as well as intellectual disability."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The Gria3A653T mouse showed significantly fewer brief bouts of activity and sleep than the wild-types."
        explanation: >-
          Reports the measured change in sleep and activity bout structure.
    - name: Circadian period lengthening under constant light
      target: Reduced AMPA Receptor-Mediated Excitatory Current
      direction: INCREASED
      interpretation: >-
        Enhanced circadian sensitivity to light in the mutant, indicating that reduced GluA3
        current alters photic entrainment as well as sleep consolidation.
      evidence:
      - reference: PMID:29016847
        reference_title: "A point mutation in the ion conduction pore of AMPA receptor GRIA3 causes dramatically perturbed sleep patterns as well as intellectual disability."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Gria3A653T mice showed enhanced period lengthening under constant light compared to wild-type mice, suggesting an increased sensitivity to light."
        explanation: >-
          Reports the measured circadian phenotype under constant light.
    evidence:
    - reference: PMID:29016847
      reference_title: "A point mutation in the ion conduction pore of AMPA receptor GRIA3 causes dramatically perturbed sleep patterns as well as intellectual disability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We introduced the orthologous mutation into a mouse strain by CRISPR-Cas9 mutagenesis and found that hemizygous mutants displayed significant differences in the structure of their activity and sleep compared to wild-type littermates."
      explanation: >-
        Establishes that the model carries the orthologous patient allele and that it produces a
        measurable phenotype, which is what makes it informative for this node.

- name: Transgenic Drosophila expressing mutant human GluA3
  species: Drosophila melanogaster
  genotype: transgenic expression of human GluA3 p.Ala615Val combined with the Lurcher leaky-channel alteration
  publication: PMID:35031858
  category: Genetically engineered
  description: >-
    Heterologous in vivo assay used to test whether the p.Ala615Val allele behaves as a gain of
    function. The mutant produced developmental defects only when combined with a leaky-channel
    alteration, a genetic interaction consistent with excess channel activity.
  modeled_mechanisms:
  - target: GluA3 Gain of Function
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Reads out the functional direction of a human allele through a developmental phenotype in
      a whole organism, complementing the patch-clamp measurement.
    limitations: >-
      Drosophila has no orthologous AMPA receptor heterotetramer and the assay requires
      co-expression with an artificial leaky-channel allele, so it reports the direction of the
      effect rather than any disease-relevant circuit consequence.
    evidence:
    - reference: PMID:35031858
      reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A fly line expressing a human GluA3 mutant possessing our variant and the Lurcher variant, which makes ion channels leaky, showed developmental defects, while one expressing a mutant possessing either of them did not."
      explanation: >-
        The synthetic genetic interaction with a leaky-channel allele is the in vivo readout for
        gain of function.

experimental_models:
- name: Heterologous AMPA receptor expression with patch-clamp electrophysiology
  experimental_model_type: CELL_LINE
  description: >-
    Recombinant expression of wild-type and variant GluA3 in a heterologous cell system,
    recorded by patch clamp, is the assay that assigns each GRIA3 allele to the
    loss-of-function, gain-of-function or functionally neutral class. It is the method behind
    the taxonomy on which this entry's whole pathograph branches.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38038360
  modeled_mechanisms:
  - target: GluA3 Gain of Function
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Measures agonist potency, response time course, desensitisation and deactivation, from
      which the gain-of-function direction is assigned.
    limitations: >-
      Recombinant receptors of defined subunit composition lack the auxiliary-subunit
      environment, developmental context and native heterotetramer stoichiometry of a real
      synapse, so the measured kinetics predict direction but not magnitude of circuit effect.
    readouts:
    - name: Receptor desensitisation and deactivation kinetics
      target: GluA3 Gain of Function
      direction: ALTERED
      interpretation: >-
        Slowed desensitisation and deactivation define the gain-of-function class.
      evidence:
      - reference: PMID:35031858
        reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Patch-clamp recordings showed that the human GluA3 mutant (p.Ala615Val) had slower desensitization and deactivation kinetics."
        explanation: >-
          Reports the measured kinetic parameters that define the gain-of-function assignment.
    evidence:
    - reference: PMID:37921875
      reference_title: "Clinical and functional consequences of GRIA variants in patients with neurological diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These variants produce changes in agonist EC50, response time course, desensitization, and/or receptor surface expression."
      explanation: >-
        Establishes the parameter set the assay reports and that it discriminates functional
        consequences of GRIA variants.
  - target: GluA3 Loss of Function
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The same assay assigns loss of function, including the closed-channel mechanism that
      leaves protein expression intact.
    limitations: >-
      Cannot distinguish reduced current caused by fewer surface receptors from reduced current
      per receptor without a separate surface-expression measurement, and gives no information
      about tissue-specific transcript abundance for splice alleles.
    evidence:
    - reference: PMID:38038360
      reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we evaluated the impact on AMPAR function of one frameshift and 43 rare missense GRIA3 variants identified in patients with NDD by electrophysiological assays."
      explanation: >-
        Describes the assay and the scale at which it was applied to assign functional class.

- name: HEK293T minigene splicing assay
  experimental_model_type: CELL_LINE
  description: >-
    Minigene reporter assay used to resolve GRIA3 splice-site variants of uncertain
    significance, by testing directly whether the candidate allele alters exon inclusion.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:42666715
  modeled_mechanisms:
  - target: GluA3 Loss of Function
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Demonstrates the RNA-level lesion — exon 2 skipping — through which a canonical
      splice-donor variant abolishes normal GluA3 production.
    limitations: >-
      A minigene reports splice-site strength in an artificial construct in a non-neuronal cell
      line; it validates aberrant splicing but not the transcript abundance or isoform ratio in
      patient brain.
    readouts:
    - name: Exon 2 inclusion in the minigene transcript
      target: GluA3 Loss of Function
      direction: DECREASED
      interpretation: >-
        Exon 2 skipping is the loss-of-function mechanism for this allele.
      evidence:
      - reference: PMID:42666715
        reference_title: "Reclassification of the GRIA3 splice-site variant in an X-linked family with intellectual disability and psychiatric symptoms."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The minigene in vitro splicing assay demonstrated that this variant affects splicing, leading to exon 2 skipping"
        explanation: >-
          Reports the measured splicing outcome.

discussions:
- discussion_id: gria3_ko_mouse_no_cognitive_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the Gria3 null mouse show no spatial memory deficit when global developmental
    impairment is present in every functionally characterised human patient?
  attaches_to:
  - pathophysiology#Disturbed Excitatory Synaptic Transmission and Plasticity
  - phenotypes#Global developmental delay
  - animal_models#Gria3 knockout mouse
  rationale: >-
    This is not an absence of evidence but a positive negative result: the knockout was tested
    on the Morris water maze and the Y-maze and performed normally, while reproducing
    aggression, sociality, motor and monoaminergic changes. Three readings are open and the
    data do not separate them. Developmental compensation by GluA1- and GluA2-containing
    receptors may mask the lesion in a constitutive null in a way that a patient missense
    allele — which still produces a subunit that assembles into heterotetramers — would not.
    Rodent spatial navigation may simply be the wrong proxy for human global developmental
    impairment. Or GluA3 loss may genuinely not be sufficient for the cognitive phenotype,
    with the human presentation requiring additional species-specific circuit context. Which
    of these holds matters for whether any Gria3 rodent model can serve as a preclinical
    efficacy readout for this disorder.
  evidence:
  - reference: PMID:22285418
    reference_title: "GluA3-deficiency in mice is associated with increased social and aggressive behavior and elevated dopamine in striatum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gria3-/Y mice showed no significant deficit in spatial memory function in Morris-water maze and Y-maze tests, and normal levels of testosterone."
    explanation: >-
      The negative cognitive result in the knockout that creates the mismatch with the human
      phenotype.
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had global developmental impairment, mostly moderate (9/25) or severe (12/25)."
    explanation: >-
      The human side of the mismatch: developmental impairment is universal in patients.

- discussion_id: female_heterozygote_severity_determinants
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a heterozygous female carrying a GRIA3 variant is unaffected,
    mildly affected, or has a developmental and epileptic encephalopathy?
  attaches_to:
  - pathophysiology#GluA3 Gain of Function
  - inheritance#X-linked inheritance with mechanism-dependent expression in females
  rationale: >-
    Carrier mothers transmitting loss-of-function alleles are usually clinically normal, yet
    females with de novo gain-of-function alleles can be as severely affected as any male, and
    one female with a de novo allele has only moderate intellectual disability with a good
    adaptive profile. X-chromosome inactivation generates a mosaic neuronal population
    expressing either the wild-type or the mutant allele, which is the obvious candidate
    explanation, but no study has measured skewing against severity in this gene, and the
    authors of the largest case series state explicitly that neither X-inactivation nor
    mosaicism fully accounts for the range of symptoms. The functional direction of the allele
    is a confounder that has never been controlled for: female cases are enriched for gain of
    function, so an apparent sex effect may partly be an allele-class effect. Resolving this
    matters directly for counselling carrier females.
  evidence:
  - reference: PMID:41462794
    reference_title: "Non-Convulsive Status Epilepticus and Mild Neurodevelopmental Phenotype in a Female with a Novel p.Thr657Ala Variant in the GRIA3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As an X-linked gene, GRIA3 is subject to X-chromosome inactivation (XCI), which generates mosaic expression in females and results in a mixed neuronal population expressing either the wild-type or the mutant allele."
    explanation: >-
      States the candidate mechanism whose contribution to female severity is unmeasured.
  - reference: PMID:36726007
    reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither X-inactivation nor mosaicism can entirely account for the range of symptoms or severity."
    explanation: >-
      Explicit statement that the obvious explanation is insufficient, which is what makes this a
      gap rather than a settled question.

- discussion_id: mechanism_matched_ampar_pharmacology
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should AMPA receptor pharmacology in GRIA3 disease be selected by the measured functional
    direction of the patient's own variant, and is an AMPAR antagonist such as perampanel
    appropriate for gain-of-function disease?
  attaches_to:
  - treatments#Carbamazepine for Gain-of-Function Disease
  - pathophysiology#GluA3 Gain of Function
  - pathophysiology#GluA3 Loss of Function
  rationale: >-
    The bidirectional allelic architecture makes this the sharpest open therapeutic question in
    the disorder. The sensitivity of variant receptors to AMPAR-selective modulators has been
    measured in recombinant assays, and one clinician group has proposed perampanel, a
    non-competitive AMPAR antagonist, as a candidate first-line agent. Against that, perampanel
    has already been tried and failed in two reported patients, in at least one case in
    documented loss-of-function disease where the authors state the failure was expected. But direction matters both ways:
    enhancing an already over-active receptor, or blocking one that is already under-conducting,
    would be expected to worsen the phenotype. The single supporting clinical observation is the
    N-of-1 carbamazepine response in a functionally confirmed gain-of-function male, and the one
    apparent counterexample is a carbamazepine failure in a patient whose variant was never
    tested electrophysiologically — which is exactly the ambiguity a mechanism-matched strategy
    is meant to remove. No trial has tested the strategy, and 13 of 44 tested rare GRIA3 missense
    alleles were functionally neutral, so the strategy also presupposes routine access to
    variant-level electrophysiology that does not currently exist in clinical practice.
  evidence:
  - reference: PMID:37921875
    reference_title: "Clinical and functional consequences of GRIA variants in patients with neurological diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We evaluated the sensitivity of variant receptors to AMPAR-selective modulators including FDA-approved drugs to explore potential targeted therapeutic options."
    explanation: >-
      Establishes that variant-specific pharmacological sensitivity has been measured in vitro,
      which is the basis for proposing a mechanism-matched strategy.
  - reference: PMID:34731330
    reference_title: "Myoclonic status epilepticus and cerebellar hypoplasia associated with a novel variant in the GRIA3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a targeted trial with a selective non-competitive AMPA receptor antagonist (Perampanel) proved to be ineffective, as expected in case of loss of function of the receptor"
    explanation: >-
      The mirror image of the carbamazepine result and the strongest published support for the
      mechanism-matched argument: an AMPAR antagonist failed in a patient whose receptor was
      already under-conducting, and the authors say that is what they expected.
  - reference: PMID:41462794
    reference_title: "Non-Convulsive Status Epilepticus and Mild Neurodevelopmental Phenotype in a Female with a Novel p.Thr657Ala Variant in the GRIA3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is worth considering that the trial of perampanel, an antiepileptic drug with the AMPA receptor mechanism of action, did not prove clinical or EEG improvement in a previous report"
    explanation: >-
      Independent report of the same perampanel failure, confirming it is not a single
      idiosyncratic result.
  - reference: PMID:35031858
    reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRIA3 GOF variants may cause an NDD phenotype distinctive from that of LOF variants, and drugs suppressing glutamatergic neurotransmission may ameliorate this phenotype."
    explanation: >-
      The clinical proposal that treatment should be matched to the functional direction of the
      variant.


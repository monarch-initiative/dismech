genetic:
- name: GRIA3
  gene_term:
    preferred_term: GRIA3
    term:
      id: hgnc:4573
      label: GRIA3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Sole causative gene. GRIA3 maps to Xq25 and encodes GluA3, the only X-chromosomal AMPA
    receptor subunit. Reported allele classes span missense, canonical splice-site,
    frameshift, multi-exon deletion and duplication, and translocations disrupting the locus.
  features: >-
    Functional direction, not variant class, is what predicts phenotype. Systematic
    electrophysiology of one frameshift and 43 rare missense alleles found 31 that alter
    receptor function as loss or gain of function and 13 that behave neutrally, so rarity and
    a plausible domain location do not by themselves establish pathogenicity.
  evidence:
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we evaluated the impact on AMPAR function of one frameshift and 43 rare missense GRIA3 variants identified in patients with NDD by electrophysiological assays."
    explanation: >-
      Describes the systematic functional screen behind the loss-of-function versus
      gain-of-function classification used throughout this entry.
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thirty-one variants alter receptor function and show loss-of-function or gain-of-function properties, whereas 13 appeared neutral."
    explanation: >-
      Quantifies the functionally neutral fraction, which is the reason variant interpretation in
      this gene needs functional data rather than in-silico prediction alone.
  - reference: PMID:24721225
    reference_title: "X-exome sequencing in Finnish families with intellectual disability--four novel mutations and two novel syndromic phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One novel missense mutation (c.1888G > C) was found in GRIA3"
    explanation: >-
      Independent X-exome study identifying a segregating GRIA3 missense allele in a Finnish
      X-linked intellectual disability family.
  variants:
  - name: c.1844C>T p.Ala615Val
    description: >-
      De novo hemizygous missense allele in a male. The functionally best-characterised
      gain-of-function allele in the disorder: patch clamp showed slowed desensitisation and
      deactivation, a transgenic fly assay confirmed a gain-of-function genetic interaction,
      and both seizures and hypertonia responded to carbamazepine.
    evidence:
    - reference: PMID:35031858
      reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a hemizygous de novo missense variant in GRIA3 in a boy with an NDD: c.1844C > T (p.Ala615Val) using whole-exome sequencing."
      explanation: >-
        Establishes the allele, its zygosity and its de novo origin in the index male.
  - name: c.1982T>C p.Met661Thr
    clinical_significance: LIKELY_PATHOGENIC
    description: >-
      De novo heterozygous missense allele in a female with developmental and epileptic
      encephalopathy, sitting in the M3-S2 linker next to the functionally confirmed
      gain-of-function residue p.Arg660. Absent from EVS, 1000 Genomes, dbSNP, gnomAD and HGVD.
      Direct electrophysiology was not performed, so its gain-of-function status is inferred
      from position and from the hypertonic phenotype rather than measured.
    evidence:
    - reference: PMID:36726007
      reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report a female patient with developmental and epileptic encephalopathy who carries the novel de novo GRIA3 variant NM_007325.5: c.1982T > C: p.Met661Thr."
      explanation: >-
        Establishes the allele, its de novo origin and the affected female carrier.
    - reference: PMID:36726007
      reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the variant was classified as likely pathogenic (PS2, PM2, PP2, PP3)"
      explanation: >-
        Records the ACMG classification and the specific criteria applied.
  - name: p.Ala653Thr
    description: >-
      Missense allele in the transmembrane ion-channel gate that stabilises the receptor in a
      closed conformation, so it is a loss-of-function allele that acts without reducing
      protein. Segregated in a sibship with severe developmental delay and the most extreme
      sleep-wake disorganisation reported in the disorder, and was modelled by CRISPR knock-in
      in mouse.
    evidence:
    - reference: PMID:29016847
      reference_title: "A point mutation in the ion conduction pore of AMPA receptor GRIA3 causes dramatically perturbed sleep patterns as well as intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro, the GRIA3(A653T) mutation stabilizes the channel in a closed conformation, in contrast to Lurcher."
      explanation: >-
        Defines the biophysical consequence that makes this a loss-of-function rather than a
        leaky-channel allele.
  - name: c.1969A>G p.Thr657Ala
    description: >-
      Novel de novo missense allele in a seven-year-old female presenting with developmental
      delay, spastic gait and non-convulsive status epilepticus — the mildest reported female
      course despite a severe acute epileptic episode.
    evidence:
    - reference: PMID:41462794
      reference_title: "Non-Convulsive Status Epilepticus and Mild Neurodevelopmental Phenotype in a Female with a Novel p.Thr657Ala Variant in the GRIA3 Gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we present the case of a seven-year-old female patient presenting with developmental delay, spastic gait, and non-convulsive status epilepticus (NCSE), who was found to carry a novel de novo GRIA3 missense variant (c.1969A > G; p.Thr657Ala)."
      explanation: >-
        Establishes the allele, its de novo origin and the associated clinical presentation.
  - name: c.268+1G>C
    clinical_significance: LIKELY_PATHOGENIC
    description: >-
      Canonical splice-donor variant reclassified from a variant of uncertain significance to
      likely pathogenic after co-segregation analysis and a minigene assay showing exon 2
      skipping. Segregated in an X-linked pedigree with intellectual disability, prominent
      psychiatric symptoms and spatial memory deficits.
    evidence:
    - reference: PMID:42666715
      reference_title: "Reclassification of the GRIA3 splice-site variant in an X-linked family with intellectual disability and psychiatric symptoms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we reported a pedigree that carried a novel splicing site variant of GRIA3 (c.268 + 1G>C) by whole exome sequencing (WES) and co-segregation analysis"
      explanation: >-
        Establishes the allele and its segregation in the reported family.
    - reference: PMID:42666715
      reference_title: "Reclassification of the GRIA3 splice-site variant in an X-linked family with intellectual disability and psychiatric symptoms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The minigene assay further confirmed that this variant lead to exon 2 skipping."
      explanation: >-
        RNA-level functional evidence that upgraded the variant classification.
  - name: c.2360A>G p.Glu787Gly
    description: >-
      Familial missense allele transmitted by a healthy carrier mother in an Italian pedigree
      whose proband had severe intellectual disability, myoclonic status epilepticus,
      cerebellar vermis hypoplasia and short stature.
    evidence:
    - reference: PMID:34731330
      reference_title: "Myoclonic status epilepticus and cerebellar hypoplasia associated with a novel variant in the GRIA3 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing identified a novel variant in GRIA3, c.2360A > G, p.(Glu787Gly)."
      explanation: >-

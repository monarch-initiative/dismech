    Present in every functionally characterised patient reported so far and the one feature
    that does not distinguish the loss-of-function from the gain-of-function branch. Graded
    VERY_FREQUENT rather than OBLIGATE because the cohort was selected for having both a
    functionally characterised variant and detailed clinical data, so 25/25 is not a
    penetrance estimate. Severity
    is graded moderate in 9 of 25 and severe in 12 of 25, so the modal patient is severely
    impaired.
  sequelae:
  - target: Delayed speech and language development
  - target: Severe global developmental delay
  evidence:
  - reference: PMID:38038360
    reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had global developmental impairment, mostly moderate (9/25) or severe (12/25)."
    explanation: >-

notes: >-
  Curated from the Edison/falcon deep-research report
  research/Syndromic_X-linked_Intellectual_Disability_94-deep-research-falcon.md. The
  named-entity preflight against MONDO:0010402 passed (GRIA3 mentioned 24 times, top gene in
  the report), so the report is genuinely about this disease.

  Corrections made to CURIEs the report proposed, all of which its own Term Validation section
  reported as clean (47/47 resolved, confabulation_rate 0.0) — that section checks only that a
  CURIE exists and is named consistently, not that it names the right concept.

  One was a wrong concept: the report offered HP:0002169 as "Hyperekplexia", but HP:0002169 is
  Clonus. Hyperekplexia is covered by HP:0002267 Exaggerated startle response, which is what
  this entry binds.

  Four were stale or paraphrased labels against the canonical HPO label: "Muscular hypotonia"
  for HP:0001252 (now Hypotonia), "Myoclonic seizure" for HP:0002123 (Generalized myoclonic
  seizure), "Movement abnormality" for HP:0100022 (Abnormality of movement), and "Abnormal
  sleep pattern" for HP:0002360 (Sleep disturbance). It also suggested "thalamus
  (UBERON:0001897)", whose canonical label is dorsal plus ventral thalamus; that term is not
  used in this entry.

  Three of the report's suggestions resolved to a term one level too general, and a more exact
  HPO term was bound instead: HP:0006979 Sleep-wake cycle disturbance rather than the parent
  HP:0002360; HP:0031475 Status epilepticus without prominent motor symptoms (exact synonym
  "Nonconvulsive status epilepticus") rather than the parent HP:0002133; and HP:0012389
  Appendicular hypotonia, defined as muscular hypotonia of one or more limbs, rather than
  HP:0001252, since the cohort figure being cited is specifically for limb hypotonia.

  All 13 of the report's citations are DOI-only — it states explicitly that PMIDs were not
  present in the retrieved metadata. Every DOI was resolved to a PMID before use (11 via the
  PMC ID converter, one — the Hamanaka carbamazepine paper, PMID:35031858 — by PubMed title
  search after the converter failed), so no evidence item in this entry sits on a DOI prefix
  that the gating reference validator skips.

  Two of the report's sources were deliberately not used. The exon 5-12 deletion prenatal
  diagnosis case (DOI 10.26717/BJSTR.2023.52.008322) is not indexed in PubMed or PMC and could
  not be given a PMID; its content — a hemizygous multi-exon deletion segregating through
  carrier females, detected prenatally in amniotic fluid — is therefore recorded here rather
  than curated as evidence, and the structural-variant claim in the pathograph is cited to
  PMID:34731330 instead. The Huang et al. brain-region transcriptomics work
  (DOI 10.1101/2024.11.15.623468) is an unreviewed bioRxiv preprint modelling a
  schizophrenia-associated protein-truncating Gria3 allele rather than this disorder, so the
  downstream regional transcriptional and glial adaptation it describes is not curated as a
  pathophysiology node.

  ClinicalTrials.gov was queried directly rather than trusting the report. A GRIA3 term search
  returns one study, NCT03676569, an intrathecal autologous adipose-derived regenerative cell
  trial in autoimmune refractory epilepsy with no GRIA3 relationship; a condition search for
  GRIA3-related neurodevelopmental disorder returns nothing. No clinical_trials block is
  therefore curated.

  Frequencies in the phenotypes section derive from the 25-patient functionally characterised
  cohort in PMID:38038360 and are cohort proportions, not population frequencies. Hypotonia and
  hypertonia are both tagged FREQUENT because the cohort mixes the two allele classes; within a
  branch they are close to mutually exclusive, which is what the pathograph records.

  Two claims from the source report were checked against the cached papers and found to
  overstate them, and are curated in the weaker form the sources actually support. The report
  presents the female non-convulsive status epilepticus case as the first report of that
  manifestation; the paper itself says status epilepticus was already documented in two
  patients and claims only the first *female* case, so both are recorded. The report also
  attributes hyperreflexia to the gain-of-function arm of the 25-patient cohort; the string
  does not occur anywhere in that paper, and hyperreflexia comes only from the single
  functionally confirmed p.Ala615Val male, so it is not curated as a cohort-level association.

  The strongest published support for treating allele direction as therapeutically decisive is
  not in the report at all and was found by reading the cached full texts: perampanel, an AMPA
  receptor antagonist, was tried and failed in a patient with documented loss-of-function
  disease, with the authors stating the failure was expected given the mechanism. That is the
  mirror image of the carbamazepine-in-gain-of-function result and is cited in the
  mechanism_matched_ampar_pharmacology discussion.

name: Syndromic X-linked Intellectual Disability 94
creation_date: "2026-09-04T02:26:58Z"
category: Mendelian
description: >-
  Syndromic X-linked intellectual disability 94 (MRXSW, Wu type; MONDO:0010402) is an
  ultra-rare X-linked neurodevelopmental disorder caused by germline variants in GRIA3
  (Xq25), which encodes GluA3, the only X-chromosomal subunit of the AMPA-type ionotropic
  glutamate receptor. The disorder is not a single haploinsufficiency syndrome: pathogenic
  GRIA3 alleles split into loss-of-function (LoF) and gain-of-function (GoF) classes that
  produce partly opposite phenotypes. In the largest functionally characterised cohort
  (25 patients from 23 families), all had global developmental impairment, while LoF was
  associated with later seizure onset, hypotonia and sleep disturbance, and GoF with much
  earlier seizure onset, hypertonia and movement disorder including hyperekplexia.
  Hyperreflexia is reported in the single functionally confirmed GoF male rather than as a
  cohort-level association. Affected males usually carry hemizygous LoF alleles inherited from healthy
  carrier mothers; affected females mostly carry de novo heterozygous GoF alleles. The
  allelic direction is therapeutically consequential — carbamazepine, which suppresses
  presynaptic glutamate release, ameliorated seizures and hypertonia in a functionally
  confirmed GoF case, and a drug that dampens AMPAR signalling would be expected to be
  unhelpful or harmful in LoF disease.

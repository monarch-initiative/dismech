- name: Disturbed Excitatory Synaptic Transmission and Plasticity
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Both branches converge here. Whether GluA3-mediated current is reduced or prolonged, the
    postsynaptic response to glutamate is mistimed relative to the activity-dependent rules
    that govern synaptic strengthening, so experience-dependent plasticity, learning and
    memory circuits develop abnormally. GluA2/3 receptors cycle constitutively under basal
    conditions and their auxiliary partners set trafficking and gating, so the lesion is felt
    at the level of synaptic maintenance as well as of acute transmission.
  biological_processes:
  - preferred_term: chemical synaptic transmission
    modifier: ABNORMAL
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  - preferred_term: regulation of synaptic plasticity
    modifier: DYSREGULATED
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
  - preferred_term: learning or memory
    modifier: ABNORMAL
    term:
      id: GO:0007611
      label: learning or memory

      id: UBERON:0000956
      label: cerebral cortex
  downstream:
  - target: Cortical Network Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The developmental impairment resolves into fixed intellectual disability in older
      children and adults, which is the term the adult pedigrees are described with.
  - target: Psychosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Psychiatric manifestations emerge in adulthood in some pedigrees. The step from
      disturbed excitatory transmission to psychosis is not measured in any patient and is
      asserted here only as the shared upstream lesion.
  - target: Aggressive behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Aggression is reported in affected adult males and is one of the few human features the
      Gria3 null mouse reproduces, which is why it is hung on the shared synaptic node rather
      than on either allele branch.
  - target: Autistic behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Autistic features recur across the older familial descriptions without segregating by
      allele class.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Global developmental impairment is the one feature present in every functionally
      characterised patient, on both branches, which is what makes it the convergent output of
      this shared node rather than of either allele class.
    evidence:
    - reference: PMID:38038360
      reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients had global developmental impairment, mostly moderate (9/25) or severe (12/25)."
      explanation: >-
        Universal developmental impairment across both functional classes is what identifies it
        as the shared downstream consequence of disturbed synaptic transmission.
  evidence:
  - reference: PMID:36429079
    reference_title: "Expression and Interaction Proteomics of GluA1- and GluA3-Subunit-Containing AMPARs Reveal Distinct Protein Composition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Several interactors were shown to affect biogenesis, AMPAR trafficking, and channel properties, alone or in distinct assemblies, and several revealed preferred binding to specific AMPAR subunits."
    explanation: >-
      Establishes that GluA3-containing receptor complexes have subunit-specific trafficking and
      gating regulation, so altering GluA3 perturbs synaptic receptor handling and not only
      instantaneous conductance.
  - reference: PMID:34731330
    reference_title: "Myoclonic status epilepticus and cerebellar hypoplasia associated with a novel variant in the GRIA3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMPARs are heterotetrameric receptors combining four different subunits, defined GluA1-4 and encoded by GRIA1-4 genes, respectively."
    explanation: >-
      Establishes that GluA3 is one subunit of an obligate heterotetramer, so a variant subunit
      is incorporated into and perturbs otherwise normal synaptic receptors.

- name: Cortical Network Hyperexcitability
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Mistimed excitatory drive in developing cortical and thalamocortical circuits lowers the
    threshold for synchronous discharge. EEG in affected individuals shows focal spikes that
    generalise readily, and in one female with a de novo allele the network state escalated to
    non-convulsive status epilepticus. The step from synaptic dysfunction to network
    hyperexcitability is inferred from clinical electrophysiology rather than measured
    directly in patient cortex, so it is recorded as provisional.
  biological_processes:
  - preferred_term: regulation of neuronal membrane potential
    modifier: DYSREGULATED
    term:
      id: GO:0042391
      label: regulation of membrane potential
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  downstream:
  - target: Seizure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36726007
      reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An electroencephalogram (EEG) showed frequent spikes in the central area, which readily developed into generalized spikes and waves"
      explanation: >-
        Cortical spikes that generalise readily are the electrographic expression of network
        hyperexcitability producing clinical seizures in a GRIA3 patient.
  evidence:
  - reference: PMID:36726007
    reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMPARs, including complexes with GluA3, are broadly distributed in the brain, particularly in the hippocampus, cerebral cortex, and thalamus, regions associated with epileptic activity"
    explanation: >-
      Places GluA3-containing receptors in exactly the cortical and thalamic circuits that
      generate epileptic activity, which is the anatomical basis for this node.
  - reference: PMID:41462794
    reference_title: "Non-Convulsive Status Epilepticus and Mild Neurodevelopmental Phenotype in a Female with a Novel p.Thr657Ala Variant in the GRIA3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The EEG revealed high-amplitude diffuse rhythmic theta/delta activity consistent with NCSE."
    explanation: >-
      Diffuse rhythmic electrographic activity documents sustained network-level hyperexcitability
      in a GRIA3 patient.

phenotypes:

treatments:
- name: Carbamazepine for Gain-of-Function Disease
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The one genotype-guided treatment observation in the disorder. In a male with the
    functionally confirmed gain-of-function allele p.Ala615Val, carbamazepine — which reduces
    presynaptic glutamate release rather than acting on the receptor itself — improved both
    seizures and hypertonia. This is an N-of-1 result and is explicitly not generalisable
    across the disorder: in a female whose allele was never functionally tested, carbamazepine
    was ineffective. Because the rationale is to reduce glutamatergic drive onto an
    over-active receptor, the same drug would not be expected to help, and could plausibly
    harm, a patient whose receptors are already under-conducting.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  target_mechanisms:
  - target: Prolonged AMPA Receptor-Mediated Excitatory Current
    treatment_effect: INHIBITS
    description: >-
      Reducing presynaptic glutamate release lowers the agonist transient reaching the
      slow-deactivating mutant receptor, shortening the excess charge transfer per synaptic
      event without acting on the channel itself.
    evidence:
    - reference: PMID:35031858
      reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "His seizures and hypertonia were ameliorated by carbamazepine, inhibiting glutamate release from presynapses."
      explanation: >-
        States both the clinical response and the presynaptic mechanism by which the drug is
        proposed to act on this node.
  evidence:
  - reference: PMID:35031858
    reference_title: "Amelioration of a neurodevelopmental disorder by carbamazepine in a case having a gain-of-function GRIA3 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRIA3 GOF variants may cause an NDD phenotype distinctive from that of LOF variants, and drugs suppressing glutamatergic neurotransmission may ameliorate this phenotype."
    explanation: >-
      The authors' own generalisation: suppressing glutamatergic transmission is the
      mechanistic rationale, and it is explicitly tied to the gain-of-function class.
  - reference: PMID:36726007
    reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with carbamazepine and ethosuximide was ineffective."
    explanation: >-
      Contradicts any claim that carbamazepine works across GRIA3 disease. This patient's
      p.Met661Thr allele was never functionally tested, so the failure is consistent with the
      mechanism-matched reading of the drug rather than with a general benefit.
  - reference: PMID:36726007
    reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our case, carbamazepine was ineffective, possibly because it does not act directly on AMPAR but inhibits glutamate release from presynaptic neurons"
    explanation: >-
      Independently confirms the indirect, presynaptic mechanism of action recorded on the
      mechanism link, while noting it as the reason the drug can fail.
  notes: >-
    Not a disease-modifying therapy and not tested in any trial. Treat as a hypothesis to be
    checked against the individual variant's measured functional direction, not as a
    recommendation.

- name: Multi-Agent Antiseizure Pharmacotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Seizures are frequently drug-resistant at onset but control often improves over time with
    sequential or combined conventional antiseizure medication. In the p.Met661Thr female,
    seizures initially resistant to carbamazepine and ethosuximide were gradually brought
    under control with lamotrigine, clobazam, levetiracetam and lacosamide. In the p.Thr657Ala
    female, non-convulsive status epilepticus resolved to baseline with levetiracetam and
    midazolam. There is no evidence that any of these agents is preferred on mechanistic
    grounds; selection follows general epilepsy practice by seizure type and EEG.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lamotrigine
      term:
        id: CHEBI:6367
        label: lamotrigine
    - preferred_term: clobazam
      term:
        id: CHEBI:31413
        label: clobazam
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: lacosamide
      term:
        id: CHEBI:135939
        label: lacosamide
    - preferred_term: midazolam
      term:
        id: CHEBI:6931
        label: midazolam
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Non-convulsive status epilepticus
    term:
      id: HP:0002133
      label: Status epilepticus
  evidence:
  - reference: PMID:36726007
    reference_title: "GRIA3 p.Met661Thr variant in a female with developmental epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The seizures, initially resistant to drug treatment, were gradually brought under control using lamotrigine, clobazam, levetiracetam, and lacosamide."
    explanation: >-
      Names the four agents that achieved control after initial drug resistance in a GRIA3
      patient.
  - reference: PMID:41462794
    reference_title: "Non-Convulsive Status Epilepticus and Mild Neurodevelopmental Phenotype in a Female with a Novel p.Thr657Ala Variant in the GRIA3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following intensive treatment with levetiracetam and midazolam, the patient gradually recovered to her baseline neurological status."
    explanation: >-
      Documents resolution of non-convulsive status epilepticus with conventional agents.

- name: Antipsychotic Pharmacotherapy for Psychiatric Manifestations
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Adult affected males in GRIA3 pedigrees can present with delusions, hallucinations,
    emotional instability and violent behaviour that dominate the clinical picture.
    Risperidone and clozapine were reported to be effective, and lorazepam improved sleep, in
    an X-linked splice-variant family. These are uncontrolled observations from a single
    pedigree.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: risperidone
      term:
        id: CHEBI:8871
        label: risperidone
    - preferred_term: clozapine
      term:
        id: CHEBI:3766
        label: clozapine
  target_phenotypes:
  - preferred_term: Delusions and hallucinations
    term:
      id: HP:0000709
      label: Psychosis
  - preferred_term: Aggressive outbursts
    term:
      id: HP:0000718
      label: Aggressive behavior
  evidence:
  - reference: PMID:42666715
    reference_title: "Reclassification of the GRIA3 splice-site variant in an X-linked family with intellectual disability and psychiatric symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risperidone and clozapine demonstrated good efficacy, while lorazepam effectively improved sleep disturbances."
    explanation: >-
      Reports the observed response of psychiatric and sleep symptoms to these agents in the
      affected family.

- name: Genetic Counseling and Prenatal Diagnosis
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Once a familial GRIA3 allele is identified, cascade testing of at-risk maternal relatives,
    carrier testing, and prenatal or preimplantation genetic testing become available. A
    carrier mother has a 50 percent chance of transmitting the allele in each pregnancy, with
    the expected consequence depending on fetal sex, the variant's functional direction and,
    in females, X-chromosome inactivation. A de novo result lowers but does not eliminate
    recurrence risk, because parental germline mosaicism cannot be excluded.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42666715
    reference_title: "Reclassification of the GRIA3 splice-site variant in an X-linked family with intellectual disability and psychiatric symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our results further support that this variant is likely pathogenic and may be the cause of their phenotype, which also provide evidence for its prenatal diagnosis and genetic counseling"
    explanation: >-
      States that establishing the variant's pathogenicity is what enables prenatal diagnosis and
      counselling in the family.

- name: Supportive and Rehabilitative Care
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Management is multidisciplinary and phenotype-directed: early intervention, individualised
    education, speech and augmentative communication therapy, occupational and physical
    therapy, tone management, orthopaedic surveillance for scoliosis and hip dislocation,
    behavioural support and sleep intervention. No disease-modifying or gene-directed therapy
    exists. This entry records the standard-of-care package rather than a GRIA3-specific
    intervention, and no GRIA3-specific trial of any of these components has been published.
  treatment_term:
    preferred_term: Supportive Care
    term:

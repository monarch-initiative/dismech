- name: Intellectual disability
  category: Neurologic
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  frequency: VERY_FREQUENT
  description: >-
    The developmental delay of infancy resolves into fixed intellectual disability, graded
    moderate to severe. This is the term the adult pedigrees are described with, where
    `Global developmental delay` no longer applies: the Finnish family D174 males were 35 to
    57 years old at report, and the Italian and Chinese pedigrees describe severe intellectual
    disability rather than delay.
  evidence:
  - reference: PMID:41462794
    reference_title: "Non-Convulsive Status Epilepticus and Mild Neurodevelopmental Phenotype in a Female with a Novel p.Thr657Ala Variant in the GRIA3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the following years, she developed a paraparetic spastic gait with hyperreflexia, expressive language impairment, and moderate intellectual disability (ID)."
    explanation: >-
      Records intellectual disability at the mild end of the reported range, formally assessed.
  - reference: PMID:34731330
    reference_title: "Myoclonic status epilepticus and cerebellar hypoplasia associated with a novel variant in the GRIA3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index subject was referred for severe ID, myoclonic seizures, cerebellar signs and short stature."
    explanation: >-
      Records intellectual disability at the severe end of the range in an independent pedigree.

- name: Hyporeflexia
  category: Neurologic
  phenotype_term:
    preferred_term: Hyporeflexia
    term:
      id: HP:0001265
      label: Hyporeflexia
  frequency: OCCASIONAL
  description: >-
    Depressed deep tendon reflexes are the reflex counterpart of the hypotonic,
    loss-of-function branch and the mirror image of the hyperreflexia seen with prolonged
    receptor current. Both appear in the disorder for the same reason both tone phenotypes do:
    the reported patients span two opposite functional classes.
  evidence:
  - reference: PMID:41462794
    reference_title: "Non-Convulsive Status Epilepticus and Mild Neurodevelopmental Phenotype in a Female with a Novel p.Thr657Ala Variant in the GRIA3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neurological phenotype is generally severe, with a combination of hypotonia, hypertonia, movement disorders, and hyporeflexia"
    explanation: >-
      Lists hyporeflexia as part of the neurological phenotype alongside the two opposite tone
      states.


      Low muscle tone is the tone phenotype specifically enriched in the loss-of-function
      branch of the cohort.
    evidence:
    - reference: PMID:38038360
      reference_title: "Gain-of-function and loss-of-function variants in GRIA3 lead to distinct neurodevelopmental phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with loss-of-function variants were older at the time of seizure onset (median age: 16 months), hypotonic and had sleeping disturbances."
      explanation: >-
        Directly associates the loss-of-function functional class with hypotonia rather than
        hypertonia, which is what this branch-specific edge asserts.
  - target: Hyporeflexia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Depressed deep tendon reflexes are the reflex counterpart of the low tone on this branch,

- accession: ega:EGAS00001004386
  title: Bulk RNAseq gene expression of baseline tumors from metastatic urothelial bladder cancer patients (IMvigor210) and metastatic renal cell carcinoma (IMmotion150)
  description: We examined tumors from a large cohort of patients with metastatic urothelial bladder cancer (mUC) and metastatic renal cell carcinoma (mRCC) treated with an anti-PD-L1 agent (atezolizumab) and found that high tumor IL8 gene expression was associated with worse overall survival (OS). We further identified the tumoral immune presence based on Teff signature. We found that high tumor IL8 expression continued to be associated with worse OS even in inflamed tumors in mUC and mRCC.

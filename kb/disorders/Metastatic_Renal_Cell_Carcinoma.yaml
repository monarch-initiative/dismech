- accession: ega:EGAS00001003605
  title: A Phase II Trial of High Dose Interleukin-2 and Multi-site Stereotactic Ablative Radiotherapy for Patients with Metastatic Renal Cell Carcinoma
  description: Immune-based therapies have improved outcomes for metastatic renal cell carcinoma (mRCC) but there is still a significant margin for improvement. Here, we report the results of a phase II trial combining high dose Interleukin-2 (HD-IL-2) with stereotactic ablative body radiotherapy (SAbR) for patients with metastatic renal cell carcinoma.

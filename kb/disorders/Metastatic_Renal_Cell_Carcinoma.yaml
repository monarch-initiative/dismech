- accession: ega:EGAS00001004208
  title: Pancreatic tropism of metastatic renal cell carcinoma
  description: Renal cell carcinoma (RCC) is characterized by a particularly broad metastatic swath, and enigmatically, when the pancreas is a destination, the disease is associated with improved survival. Intrigued by this observation, we sought to characterize the clinical behavior, therapeutic implications, and underlying biology. While pancreatic metastases (PM) are infrequent, we identified 31 patients across two institutional cohorts and show that improved survival is independent of established prognostic variables, that these tumors are exquisitely sensitive to anti-angiogenic agents and resistant to immune checkpoint inhibitors (ICI), and that they are characterized by a distinctive biology.

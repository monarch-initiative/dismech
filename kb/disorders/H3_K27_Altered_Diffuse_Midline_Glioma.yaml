- name: GD2-Directed CAR T Cell Therapy
  description: >-
    Autologous T cells engineered to express a GD2-directed chimeric antigen
    receptor (4-1BB co-stimulatory and CD3-zeta signalling domains), given
    intravenously after lymphodepleting chemotherapy and, in patients with
    benefit, by subsequent intracerebroventricular infusion. Investigational
    (phase I, NCT04196413). All treated patients developed tumour
    inflammation-associated neurotoxicity, which is manageable but requires
    neurocritical care because of the brainstem or cord location. Durability of
    response has so far been limited in many patients, though one trial patient
    remains in complete response beyond 30 months.
  therapeutic_modality: CELL_THERAPY

- name: PRC2 Complex Inhibition and H3K27me3 Loss
  biological_scale: MOLECULAR
  description: >-
    The H3 K27M mutant histone or overexpressed EZHIP binds to and inhibits EZH2,
    the catalytic subunit of PRC2, which normally trimethylates H3K27. This
    results in global loss of H3K27me3, a repressive epigenetic mark, leading to
    aberrant gene activation and loss of cell identity.
  evidence:
  - reference: PMID:37835563
    reference_title: "Decoding Diffuse Midline Gliomas: A Comprehensive Review of Pathogenesis, Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "H3 K27M has been shown to inhibit the activity of the PRC2 complex, which is responsible for adding the H3 K27me3 modification to histones. This results in a loss of gene silencing, leading to an increased expression of genes that are normally repressed."
    explanation: Confirms PRC2 inhibition by mutant H3 K27M and consequent loss of repressive H3K27me3 histone marks.
  biological_processes:
  - preferred_term: negative regulation of gene expression, epigenetic
    modifier: DECREASED
    term:
      id: GO:0045814
      label: negative regulation of gene expression, epigenetic
  downstream:

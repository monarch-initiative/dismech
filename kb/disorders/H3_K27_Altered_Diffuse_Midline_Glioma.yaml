- name: GD2 Surface Antigen Expression
  description: >-
    Patient-derived H3 K27M-mutant glioma cells express the disialoganglioside GD2
    uniformly and at high levels, at all three midline sites (pons, thalamus and
    spinal cord). The reported specificity contrast is against H3 wild-type,
    GD2-negative paediatric glioma cultures, which GD2-CAR T cells do not kill;
    GD2 expression in normal brain has been reported separately, and the argument
    for a therapeutic window rests instead on the absence of significant
    neurotoxicity in human trials using the same 14g2a-derived binding domain.
    GD2 is synthesised by GD2 synthase (B4GALNT1); CRISPR deletion of B4GALNT1
    abolishes GD2-CAR T cell recognition, establishing the ganglioside as the
    operative surface target rather than a bystander marker. This node is the
    therapeutic vulnerability that GD2-directed CAR T cell therapy addresses; it
    is not by itself a driver of tumour growth.

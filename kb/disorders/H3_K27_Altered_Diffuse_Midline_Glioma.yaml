    snippet: "This was associated with appearance of circulating Human Anti-CAR Antibodies (HACAs) that bound cells expressing the GD2-CAR, as well as clonal expansion of CSF B cells which produced HACA which impeded the cytotoxic activity of GD2-CAR T cells."

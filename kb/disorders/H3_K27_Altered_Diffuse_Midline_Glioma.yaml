name: Diffuse Midline Glioma, H3 K27-Altered
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Diffuse midline glioma, H3 K27-altered, is a highly aggressive CNS tumor
  predominantly affecting children and young adults, arising in midline structures
  including the pons (diffuse intrinsic pontine glioma/DIPG), thalamus, and spinal
  cord. WHO 2021 classification defines this entity by the presence of H3 K27M
  mutation (in H3F3A or HIST1H3B/C) or H3 K27 trimethylation loss through other
  mechanisms (e.g., EZHIP overexpression). The H3 K27M mutation acts as a dominant
  negative, inhibiting PRC2-mediated H3K27 trimethylation and causing global
  epigenetic dysregulation. The tumor is universally WHO grade 4, and the infiltrative
  location typically precludes surgical resection. Prognosis is extremely poor with
  median survival of 9-11 months for DIPG.
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Molecularly Defined Tumor
- High-Grade Glioma
parents:
- diffuse glioma
has_subtypes:
- name: Diffuse Intrinsic Pontine Glioma (DIPG)
  description: >-
    The most common form, arising in the pons with characteristic diffuse
    infiltration of pontine structures. Presents with classic triad of cranial
    nerve deficits, ataxia, and long tract signs. Diagnosis often made on imaging
    without biopsy. Median survival is less than 12 months.
  evidence:
  - reference: PMID:19338403
    reference_title: "Treatment of diffuse intrinsic brainstem gliomas: failed approaches and future strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse intrinsic pontine gliomas constitute ~ 60-75% of tumors found within the pediatric brainstem. These malignant lesions present with rapidly progressive symptoms such as cranial nerve, long tract, or cerebellar dysfunctions."
    explanation: This review identifies DIPG as the dominant pediatric brainstem glioma subtype and describes the rapidly progressive cranial nerve, long tract, and cerebellar presentation summarized in this subtype.
- name: Thalamic H3 K27M-Mutant Glioma
  description: >-
    H3 K27-altered glioma arising in the thalamus, often in children,
    adolescents, and younger adults. May present with hemiparesis,
    hydrocephalus, or cognitive changes. Bilateral thalamic involvement can
    occur.
  evidence:
  - reference: PMID:24285547
    reference_title: "H3F3A K27M mutations in thalamic gliomas from young adult patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that high-grade thalamic gliomas from young adults, like those from children and adolescents, frequently had H3F3A K27M."
    explanation: This thalamic glioma cohort directly establishes H3 K27M-altered thalamic tumors as a recognized midline subgroup enriched in younger patients.
- name: Spinal Cord H3 K27M-Mutant Glioma
  description: >-
    H3 K27-altered glioma arising in the spinal cord. Presents with progressive
    sensory or motor deficits from intramedullary cord involvement. This subtype
    is rare and clinically aggressive.
  evidence:
  - reference: PMID:35079510
    reference_title: "Spinal Cord Diffuse Midline Glioma, H3K27M- mutant Effectively Treated with Bevacizumab: A Report of Two Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinal cord DMG, H3K27M-mutant is relatively rare, with poor prognosis, and there are no effective treatment protocols."
    explanation: This case report identifies spinal cord H3 K27M-mutant diffuse midline glioma as a rare aggressive spinal subtype.
pathophysiology:
- name: H3 K27M Oncohistone Mutation
  description: >-
    Lysine-to-methionine substitution at position 27 of histone H3 (K27M) occurs
    in H3F3A (encoding H3.3) or HIST1H3B/HIST1H3C (encoding H3.1). Despite being
    present in only 5-15% of total H3 molecules, the mutant histone acts as a
    dominant negative, sequestering and inhibiting the PRC2 complex.
  evidence:
  - reference: PMID:41528563
    reference_title: "Early distant progression in adult Histone-3 K27-altered diffuse midline gliomas."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: H3 K27-altered diffuse midline glioma (DMG) is a molecularly defined, highly aggressive tumor entity since the 2016 revision of the World Health Organization (WHO) classification of tumors of the central nervous system (CNS).
    explanation: This abstract defines H3 K27-altered DMG as a molecularly defined aggressive entity, supporting the disease context for this mutation-driven tumor.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  molecular_functions:
  - preferred_term: histone H3K27 methyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0046976
      label: histone H3K27 methyltransferase activity
  locations:
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  - preferred_term: dorsal plus ventral thalamus
    term:
      id: UBERON:0001897
      label: dorsal plus ventral thalamus
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  downstream:
  - target: PRC2 Complex Inhibition and H3K27me3 Loss
    description: Mutant H3 K27M sequesters EZH2/PRC2 complex
- name: PRC2 Complex Inhibition and H3K27me3 Loss
  description: >-
    The H3 K27M mutant histone binds to and inhibits EZH2, the catalytic subunit
    of PRC2, which normally trimethylates H3K27. This results in global loss of
    H3K27me3, a repressive epigenetic mark, leading to aberrant gene activation
    and loss of cell identity.
  biological_processes:
  - preferred_term: negative regulation of gene expression, epigenetic
    modifier: DECREASED
    term:
      id: GO:0045814
      label: negative regulation of gene expression, epigenetic
  downstream:
  - target: Epigenetic Derepression and Aberrant Gene Activation
    description: Loss of H3K27me3 derepresses developmental and oncogenic genes
- name: Epigenetic Derepression and Aberrant Gene Activation
  description: >-
    Global loss of H3K27me3 causes derepression of genes normally silenced during
    development, including proliferative and stemness genes. Paradoxically, some
    loci show retained or increased H3K27me3, suggesting complex redistribution
    rather than simple loss.
  biological_processes:
  - preferred_term: gene expression
    modifier: INCREASED
    term:
      id: GO:0010467
      label: gene expression
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Loss of Glial Differentiation
    description: Epigenetic changes block normal differentiation programs
  - target: GD2 Surface Antigen Expression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Upregulation of ganglioside synthesis pathway component genes, including
      B4GALNT1 (GD2 synthase)
    description: >-
      H3 K27M-mutant paediatric high-grade gliomas show upregulation of
      ganglioside-synthesis pathway component genes relative to H3 wild-type
      paediatric high-grade gliomas, which the authors read as the oncohistone
      driving GD2 overexpression. GD2 is therefore a downstream product of the
      epigenetic derepression programme rather than of the differentiation
      block.
    evidence:
    - reference: PMID:29662203
      reference_title: "Potent antitumor efficacy of anti-GD2 CAR T cells in H3-K27M(+) diffuse midline gliomas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Upregulation of ganglioside synthesis pathway component genes in H3K27M mutant pediatric high-grade gliomas relative to H3 WT pediatric high-grade gliomas suggests this mutation drives GD2 overexpression."
      explanation: Attributes GD2 overexpression to the H3 K27M mutation acting through derepressed ganglioside-synthesis genes, which is what this edge asserts. The authors' own hedge ("suggests") is why the edge is typed indirect rather than DIRECT.
- name: Loss of Glial Differentiation
  description: >-
    Epigenetic dysregulation prevents normal glial differentiation, maintaining
    cells in a proliferative, undifferentiated state. This contributes to the
    aggressive behavior and treatment resistance of these tumors.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: glial cell differentiation
    modifier: DECREASED
    term:
      id: GO:0010001
      label: glial cell differentiation
- name: GD2 Surface Antigen Expression
  description: >-
    Patient-derived H3 K27M-mutant glioma cells express the disialoganglioside GD2
    uniformly and at high levels, at all three midline sites (pons, thalamus and
    spinal cord). The reported specificity contrast is against H3 wild-type,
    GD2-negative paediatric glioma cultures, which GD2-CAR T cells do not kill;
    GD2 expression in normal brain has been reported separately, and the argument
    for a therapeutic window rests instead on the absence of significant
    neurotoxicity in human trials using the same 14g2a-derived binding domain.
    GD2 is synthesised by GD2 synthase (B4GALNT1); CRISPR deletion of B4GALNT1
    abolishes GD2-CAR T cell recognition, establishing the ganglioside as the
    operative surface target rather than a bystander marker. This node is the
    therapeutic vulnerability that GD2-directed CAR T cell therapy addresses; it
    is not by itself a driver of tumour growth.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: H3 K27M-mutant glioma cell
    term:
      id: CL:0001064
      label: malignant cell
  biological_processes:
  - preferred_term: ganglioside biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0001574
      label: ganglioside biosynthetic process
  locations:
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  - preferred_term: dorsal plus ventral thalamus
    term:
      id: UBERON:0001897
      label: dorsal plus ventral thalamus
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:29662203
    reference_title: "Potent antitumor efficacy of anti-GD2 CAR T cells in H3-K27M(+) diffuse midline gliomas."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report that patient-derived H3-K27M-mutant glioma cell cultures exhibit uniform, high expression of the disialoganglioside GD2."
    explanation: Establishes uniform high GD2 surface expression on patient-derived H3 K27M-mutant glioma cultures, the observation this node records.
  - reference: PMID:29662203
    reference_title: "Potent antitumor efficacy of anti-GD2 CAR T cells in H3-K27M(+) diffuse midline gliomas."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In patient-derived cultures of pediatric H3K27M thalamic (QCTB-R059, derived from resection)4, and spinal cord (SU-pSCG1, derived post-mortem) DMGs, GD2 is also highly and uniformly expressed"
    explanation: Names thalamic and spinal cord patient-derived DMG cultures as also expressing GD2 uniformly and highly, so the antigen is not confined to the pons. This is why the node carries all three midline locations rather than pons alone.
  - reference: PMID:35130560
    reference_title: "GD2-CAR T cell therapy for H3K27M-mutated diffuse midline gliomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have previously shown that the disialoganglioside GD2 is highly expressed on H3K27M-mutated glioma cells"
    explanation: The first-in-human trial report restates high GD2 expression on H3K27M-mutated glioma as the rationale for targeting this antigen.
  downstream:
  - target: GD2-CAR T Cell-Mediated Tumour Cytotoxicity
    description: >-
      High, homogeneous GD2 expression permits antigen-dependent recognition and
      killing of glioma cells by GD2-directed CAR T cells. This edge is
      intervention-conditioned — it is realised only when GD2-CAR T cells are
      administered.
- name: GD2-CAR T Cell-Mediated Tumour Cytotoxicity
  description: >-
    Autologous T cells engineered with a GD2-directed chimeric antigen receptor
    (GD2 binding domain, 4-1BB co-stimulatory domain, CD3-zeta signalling domain)
    recognise GD2 on midline glioma cells and mediate antigen-dependent
    cytotoxicity. In orthotopic xenografts this clears engrafted tumour except for
    residual GD2-low cells; in the phase I trial it produced volumetric tumour
    reduction and neurological improvement in a subset of patients. Because the
    tumour sits in the brainstem or cord, the same inflammatory response produces
    tumour inflammation-associated neurotoxicity.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: GD2-CAR-engineered cytotoxic T cell
    term:
      id: CL:0000910
      label: cytotoxic T cell
  biological_processes:
  - preferred_term: T cell mediated cytotoxicity
    modifier: INCREASED
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
  evidence:
  - reference: PMID:29662203
    reference_title: "Potent antitumor efficacy of anti-GD2 CAR T cells in H3-K27M(+) diffuse midline gliomas."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In five independent patient-derived H3-K27M+ DMG orthotopic xenograft models, systemic administration of GD2-targeted CAR T cells cleared engrafted tumors except for a small number of residual GD2lo glioma cells."
    explanation: Preclinical xenograft evidence that GD2-CAR T cells clear H3 K27M-mutant tumour, and that GD2-low cells escape.
  - reference: PMID:39537919
    reference_title: "Intravenous and intracranial GD2-CAR T cells for H3K27M(+) diffuse midline gliomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients demonstrated major volumetric tumour reductions (52, 54, 91 and 100%), with a further three patients exhibiting smaller reductions."
    explanation: Phase I human evidence that GD2-CAR T cell administration produces measurable antitumour activity in this disease.
  downstream:
  - target: Anti-CAR Adaptive Immune Response
    description: >-
      The infused CAR construct carries murine-derived and engineered junctional
      sequences that are foreign to the host, so the therapeutic cell product is
      itself presented as an antigen and provokes an adaptive response against it.
- name: Anti-CAR Adaptive Immune Response
  description: >-
    Recipients mount a host adaptive immune response directed at the CAR construct
    rather than at the tumour. Peripheral CD4+ and CD8+ T cells react against
    epitopes concentrated in the murine-derived and engineered junctional regions
    of the receptor, and cerebrospinal-fluid B cells clonally expand and secrete
    human anti-CAR antibodies (HACAs) that bind GD2-CAR-expressing cells and
    impede their cytotoxic activity. This is an immunogenicity mechanism against
    the therapeutic product, distinct from tumour-intrinsic antigen loss.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cerebrospinal fluid B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: anti-CAR-reactive T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: adaptive immune response
    modifier: INCREASED
    term:
      id: GO:0002250
      label: adaptive immune response
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PPR:PPR1276296
    reference_title: "Anti-CAR Immunity Drives Acquired Therapeutic Resistance to GD2-CAR T Cell Therapy in Diffuse Midline Glioma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This was associated with appearance of circulating Human Anti-CAR Antibodies (HACAs) that bound cells expressing the GD2-CAR, as well as clonal expansion of CSF B cells which produced HACA which impeded the cytotoxic activity of GD2-CAR T cells."
    explanation: Directly reports the CSF B cell clonal expansion and HACA production that define this node. Non-peer-reviewed preprint - see the node notes.
  notes: >-
    The anti-CAR immunity evidence is currently a non-peer-reviewed preprint
    (PPR:PPR1276296) reporting correlative single-cell RNA/TCR sequencing from
    NCT04196413. Host anti-CAR immune rejection was already suspected during the
    same trial - the first-in-human report describes increased lymphodepletion
    before a re-infusion "given the concern for immune rejection of the CAR T
    cells" (PMID:35130560) - but the HACA mechanism itself awaits peer review and
    should not be treated as settled.
  downstream:
  - target: Loss of GD2-CAR T Cell Persistence
    description: >-
      HACA titres vary inversely with circulating CAR T cell persistence, and
      non-engineered lymphocytes outcompete CAR T cells in the CSF compartment.
- name: Loss of GD2-CAR T Cell Persistence
  description: >-
    GD2-CAR T cells in the cerebrospinal fluid show limited persistence and clonal
    expansion while non-engineered lymphocytes expand and come to dominate the CSF
    immune compartment. Circulating HACA levels correlate inversely with
    circulating CAR T cell persistence, consistent with immune-mediated clearance
    of the engineered product.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: GD2-CAR-engineered T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  evidence:
  - reference: PPR:PPR1276296
    reference_title: "Anti-CAR Immunity Drives Acquired Therapeutic Resistance to GD2-CAR T Cell Therapy in Diffuse Midline Glioma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSF GD2-CAR T cells manifested limited persistence and clonal expansion, while non-engineered CSF lymphocytes underwent significant clonal expansion and repertoire stabilization, ultimately dominating the CSF immune compartment."
    explanation: Reports the limited CSF persistence and clonal expansion of the engineered cells that this node records.
  - reference: PPR:PPR1276296
    reference_title: "Anti-CAR Immunity Drives Acquired Therapeutic Resistance to GD2-CAR T Cell Therapy in Diffuse Midline Glioma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "levels of circulating HACA inversely correlated with circulating CAR T cell persistence"
    explanation: Links the anti-CAR antibody response upstream to the loss of persistence recorded here. Correlative, not interventional.
  downstream:
  - target: Acquired Resistance to GD2-CAR T Cell Therapy
    description: >-
      Without persisting effector cells the antitumour response is not sustained,
      and tumour growth resumes.
- name: Acquired Resistance to GD2-CAR T Cell Therapy
  description: >-
    Initial clinical and radiographic benefit from GD2-CAR T cells is followed in
    many patients by loss of durable response and tumour progression. Responses
    are not uniformly lost - one trial patient remained in complete response
    beyond 30 months - so this node records a frequent rather than a universal
    outcome. Appearance of circulating HACA has been temporally associated with
    disease progression, identifying anti-CAR immunity as a contributor to
    acquired resistance alongside the GD2-low residual populations seen
    preclinically.
  biological_scale: ORGANISM
  evidence:
  - reference: PPR:PPR1276296
    reference_title: "Anti-CAR Immunity Drives Acquired Therapeutic Resistance to GD2-CAR T Cell Therapy in Diffuse Midline Glioma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the durability of response has been limited in many patients"
    explanation: The preprint's own statement of the outcome this node records, and the source of the "many patients" wording used in the description.
  - reference: PPR:PPR1276296
    reference_title: "Anti-CAR Immunity Drives Acquired Therapeutic Resistance to GD2-CAR T Cell Therapy in Diffuse Midline Glioma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In several cases, appearance of circulating HACA temporally correlated with disease progression"
    explanation: Ties the anti-CAR antibody response to clinical progression, the resistance outcome recorded by this node.
  - reference: PMID:39537919
    reference_title: "Intravenous and intracranial GD2-CAR T cells for H3K27M(+) diffuse midline gliomas."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "begin to identify potential contributors to, or correlates of, loss of durable response in patients"
    explanation: The peer-reviewed phase I report states that loss of durable response occurs and that its contributors are only beginning to be identified; it does not itself attribute the loss to anti-CAR immunity. The same report describes a complete response ongoing beyond 30 months, which is why this is PARTIAL support for a "many patients" claim rather than a universal one.

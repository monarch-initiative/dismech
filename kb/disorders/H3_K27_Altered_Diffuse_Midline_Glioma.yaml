    description: Loss of H3K27me3 derepresses developmental and oncogenic genes
- name: Epigenetic Derepression and Aberrant Gene Activation
  biological_scale: CELLULAR
  description: >-
    Global loss of H3K27me3 causes derepression of genes normally silenced during
    development, including proliferative and stemness genes. Paradoxically, some
    loci show retained or increased H3K27me3, suggesting complex redistribution
    rather than simple loss.
  evidence:
  - reference: PMID:37835563
    reference_title: "Decoding Diffuse Midline Gliomas: A Comprehensive Review of Pathogenesis, Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The H3 K27M mutation leads to a global reduction in tri-methylation of histone H3 at lysine 27 (H3 K27me3), a modification associated with the loss of gene repression and instead promotes an increase in mono-methylation of H3 K27 (H3 K27me1), a mark linked to active gene transcription. This epigenetic dysregulation disrupts normal gene expression patterns and drives tumor growth and progression"
    explanation: Supports global loss of H3K27me3-mediated transcriptional repression and active transcriptional dysregulation driving glioma proliferation.

    reference_title: "Anti-CAR Immunity Drives Acquired Therapeutic Resistance to GD2-CAR T Cell Therapy in Diffuse Midline Glioma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In several cases, appearance of circulating HACA temporally correlated with disease progression"
    explanation: Ties the anti-CAR antibody response to clinical progression, the resistance outcome recorded by this node.
  - reference: PMID:39537919
    reference_title: "Intravenous and intracranial GD2-CAR T cells for H3K27M(+) diffuse midline gliomas."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "begin to identify potential contributors to, or correlates of, loss of durable response in patients"
    explanation: The peer-reviewed phase I report states that loss of durable response occurs and that its contributors are only beginning to be identified; it does not itself attribute the loss to anti-CAR immunity, and the same report describes one ongoing complete response beyond 30 months, consistent with resistance occurring in many rather than all treated patients.

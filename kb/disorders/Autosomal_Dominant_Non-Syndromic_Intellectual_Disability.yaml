      moderate-to-severe mental retardation in all patients.
    explanation: >-
      Instrumented confirmation of the intellectual and adaptive-behaviour
      deficit in molecularly confirmed AD-NSID patients. The OBLIGATE band is
      definitional rather than measured: intellectual disability is the
      defining feature of this disease class, so by construction it is present
      in 100% of cases. No cohort frequency is cited because none is
      meaningful for a defining criterion.


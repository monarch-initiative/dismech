- hypothesis_group_id: nonsyndromic_boundary_is_ascertainment
  hypothesis_label: >-
    The non-syndromic/syndromic boundary reflects depth of phenotyping rather
    than a distinct mechanism
  status: EMERGING
  description: >-
    The non-syndromic label can reflect the phenotype recognized at a particular age and depth of assessment.
    Larger gene-specific series may reveal recurrent clinical patterns. Tissue expression may influence
    presentation but does not by itself prove an exclusively cognitive phenotype. These explanations can
    coexist; this category does not establish a unique common disease mechanism.
  evidence:
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several patients did not meet the expected syndromic manifestation,
      suggesting a strong bias in present clinical syndrome descriptions.
    explanation: >-
      Explicitly attributes syndromic/non-syndromic misclassification to bias
      in existing clinical syndrome descriptions.
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The large number of de-novo variants in known intellectual disability
      genes is only partially attributable to known non-specific phenotypes.
    explanation: >-
      Notes that patients ascertained as non-syndromic frequently carry
      variants in genes catalogued as syndromic.
  - reference: PMID:26989088
    reference_title: "Genetic and neurodevelopmental spectrum of SYNGAP1-associated intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SYNGAP1 encephalopathy is characterised by early neurodevelopmental
      delay typically preceding the onset of a relatively recognisable
      epilepsy comprising generalised seizures (absences, myoclonic jerks) and
      frequent triggers.
    explanation: >-
      Worked example of the predicted migration: SYNGAP1, first reported as a
      cause of NON-syndromic ID, is redescribed as a recognisable
      developmental and epileptic encephalopathy once a larger series is
      phenotyped.

- hypothesis_group_id: adnsid_regulatory_variants
  hypothesis_label: Regulatory variants may contribute to unresolved intellectual disability
  status: EMERGING
  description: A severe-ID study of 47 coding-negative individuals identified de novo variants in fetal-brain enhancers. Candidate target assignment combined chromatin contacts, epigenomic correlations and proximity; only the POU3F3 enhancer cluster showed significant enrichment in the larger replication cohort. Selected variants increased or decreased reporter activity. For one SOX8 candidate, precise variant introduction into HEK293T cells reduced SOX8 expression, while separate CRISPR interference of the whole enhancer in neural progenitors supported its regulatory role. These experiments distinguish sequence alteration, regulatory target and expression consequence, but do not establish clinical causality or penetrance for every candidate allele.
  evidence:
  - reference: PMID:36854624
    reference_title: Regulatory de novo mutations underlying intellectual disability.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We found that regulatory DNMs were selectively enriched in fetal brain-specific enhancers as compared with adult brain enhancers.
    explanation: Enrichment among regulatory candidates in a small, selected severe-ID cohort; it does not establish every variant as disease-causing.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  - reference: PMID:36854624
    reference_title: Regulatory de novo mutations underlying intellectual disability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using CRISPR-mediated mutation and editing of epigenomic marks, we show that DNMs at regulatory elements affect the expression of putative target genes.
    explanation: The precise SOX8-associated allele was tested in HEK293T cells; neural-progenitor CRISPR interference perturbed the enhancer rather than reproducing that allele.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT

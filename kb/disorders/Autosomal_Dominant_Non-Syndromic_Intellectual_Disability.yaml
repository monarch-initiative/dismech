differential_diagnoses:
- name: Syndromic Intellectual Disability
  description: >-
    A recognizable combination of findings can support a gene-specific syndrome. Mild dysmorphism, altered
    head size or a single imaging finding alone does not automatically settle the distinction. Presentation
    can become more recognizable with age and deeper phenotyping.
  distinguishing_features:
  - Presence of a recognisable dysmorphic gestalt or major malformation
  - Growth abnormality, microcephaly, or structural brain anomaly on imaging
  evidence:
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several patients did not meet the expected syndromic manifestation,
      suggesting a strong bias in present clinical syndrome descriptions.
    explanation: >-
      Documents the instability of the syndromic/non-syndromic distinction in
      real cohorts.

- name: X-linked Intellectual Disability
  description: >-
    X-linked causes can be inherited or de novo and can affect males or females. Chromosomal location,
    variant interpretation and segregation distinguish these disorders from autosomal causes; absence
    of a maternal family history does not exclude an X-linked diagnosis.
  distinguishing_features:
  - A pathogenic variant in an X-linked disease gene with compatible phenotype and inheritance
  - >-
    An affected maternal lineage can be informative, but de novo occurrence and affected females are possible
  evidence:
  - reference: PMID:23033978
    reference_title: "Diagnostic exome sequencing in persons with severe intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 10 de novo mutations and 3 X-linked (maternally inherited)
      mutations that had been previously predicted to compromise the function
      of known intellectual-disability genes were found in 13 patients.
    explanation: >-
      This cohort includes maternally inherited X-linked diagnoses; it does not define all X-linked inheritance
      patterns.

- name: Autosomal Recessive Non-Syndromic Intellectual Disability
  description: >-
    Biallelic causes remain a differential in both consanguineous and outbred families. Their frequency
    depends on ascertainment and ancestry. A low contribution in one selected outbred cohort does not
    exclude recessive disease in another patient or population.
  distinguishing_features:
  - Consanguinity or an endogamous founder population
  - Biallelic (homozygous or compound heterozygous) variants inherited from unaffected carrier parents
  evidence:
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive inheritance seems to contribute little in the
      outbred population investigated.
    explanation: >-
      A qualitative conclusion limited to the investigated outbred cohort, not a universal estimate.

- name: Copy Number Variant Intellectual Disability
  description: >-
    Pathogenic deletions or duplications can affect one gene or a larger interval and can be de novo or
    inherited. Some CNVs cause dominant gene-dosage disorders within this category rather than a mutually
    exclusive diagnosis. Detection depends on assay and pipeline; chromosomal microarray and suitably
    analyzed exome or genome sequencing have complementary capabilities.
  distinguishing_features:
  - A pathogenic dosage change affecting one gene or a multi-gene interval
  - >-
    Interpretation of the affected interval and gene dosage, using an assay validated for the relevant
    CNV class
  evidence:
  - reference: PMID:21076407
    reference_title: "A de novo paradigm for mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with de novo copy number variation, de novo point mutations of
      large effect could explain the majority of all mental retardation cases
      in the population.
    explanation: >-
      The authors proposed combined contributions from de novo CNVs and sequence variants; this is not
      a measured population fraction or proof that sequencing cannot detect CNVs.

    quote_role: BACKGROUND
    directness: INDIRECT
discussions:
- discussion_id: adnsid_clingen_disease_concept
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is `autosomal dominant non-syndromic intellectual disability` a
    disease concept that any gene-disease curation resource actually
    uses, or is it an ontology-only category that no expert panel
    curates against?
  attaches_to:
  - has_subtypes#
  rationale: >-
    This entry now carries 18 `has_subtypes` rows, one per gene-defined
    MONDO class that MONDO asserts as a direct subclass of MONDO:0015802
    and for which a causal gene is recorded. Sixteen of the 21 classes
    MONDO files here have a ClinGen Gene-Disease Validity curation, and
    not one is curated against a disease concept whose own label says
    non-syndromic. Eleven are curated against `complex
    neurodevelopmental disorder` (MONDO:0100038), one against `syndromic
    intellectual disability` (MONDO:0000508, NAA15), one against plain
    `intellectual disability` (MONDO:0001071, SET), one against
    `progressive myoclonus epilepsy` (MONDO:0020074, NUS1), one against
    `Coffin-Siris syndrome` (MONDO:0015452, ARID2) and one against an
    MRD-series identifier (MONDO:0032795, CAMK2G). That last is the only
    ClinGen record in the set naming an MRD term at all; it is graded
    `Limited`, and the same record describes the entity as `autosomal
    dominant syndromic intellectual disability`. The five genes with no
    ClinGen record are TAF4, HIVEP2, KCNQ5, CAMK2B and CLTC. The primary
    literature points the same way: the defining series for TLK2, STAG1,
    TAF4, NAA15 and HIVEP2 each report recurrent dysmorphic or
    extra-cognitive features, and two of them - TLK2 and STAG1 - call
    the entity syndromic in their own words. This is a second,
    independent line of evidence for the ascertainment-category
    hypothesis already recorded in `mechanistic_hypotheses`, and it is a
    different kind of evidence from the gene-by-gene reclassification
    anecdotes, because it is a property of the whole set. What it does
    not settle is whether the right response is to retire the category,
    to rebuild this entry as a Grouping over per-gene entries, or to
    keep it as the class-level home for shared diagnostic and
    counselling content while treating the non-syndromic label as
    ascertainment rather than biology.
  proposed_experiments:
  - experiment_id: exp_adnsid_clingen_concept_census
    name: Systematic census of the disease concepts expert panels curate these genes against
    description: >-
      For every gene-defined MONDO class asserted under MONDO:0015802,
      record the disease concept each of ClinGen, OMIM, Orphanet and
      GeneReviews curates the gene against, and test whether any
      resource independently uses a non-syndromic concept. A category
      that no curation resource instantiates is an ontology artefact;
      one that several use independently is a real clinical entity.

- discussion_id: adnsid_opentargets_gene_backlog
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which of the remaining Open Targets gene associations for MONDO:0015802
    warrant curation as full genetic records in this entry, and which are
    better placed on gene-specific syndromic entries?
  attaches_to:
  - pathophysiology#Haploinsufficiency of a Dosage-Sensitive Neurodevelopmental Gene
  rationale: >-
    Open Targets associates MONDO:0015802 with TLK2, ASH1L, STAG1, CLTC,
    CAMK2A, CIC, NAA15, TRIP12, KMT5B, TRIO, SET and DLG4. This entry curates
    four of those (CAMK2A, DLG4, KMT5B, TRIO) alongside six genes drawn from
    the general de novo ID literature (SYNGAP1, STXBP1, ZBTB18, GRIN2B,
    GATAD2B, MED13L). The gene list is deliberately illustrative of the major
    functional modules rather than exhaustive, so the remaining eight
    associations - TLK2, ASH1L, STAG1, CLTC, CIC, NAA15, TRIP12, SET - are
    recorded here as an explicit backlog rather than left as a silent
    omission. Triage is not purely mechanical: several of these are already
    described with recognisable syndromic features, so for each the curation
    decision is entangled with the syndromic/non-syndromic boundary question
    tracked in the adnsid_entity_boundary discussion. Note also that Open
    Targets associations are themselves reassessed over time, so the target
    list is a moving one.

    Update (series-019, issue 12226): seven of those eight - TLK2,
    STAG1, CLTC, CIC, NAA15, TRIP12 and SET - now have `has_subtypes`
    rows carrying the MONDO class and the gene binding, so they are no
    longer silent omissions; each row records whether the gene-disease
    pair looks syndromic and what ClinGen curated it against, which is
    the triage this discussion asked for. They are deliberately not
    promoted to full `genetic:` records, because that block remains
    illustrative of the functional modules by design. The eighth, ASH1L,
    resolves differently and is now closed: MONDO records ASH1L as the
    causal gene of `intellectual disability, autosomal dominant 52`
    (MONDO:0030918), a direct subclass of this entry's own term, and
    that class is already curated in this knowledge base as the
    standalone entry `Intellectual_Disability_Autosomal_Dominant_52`.
    ASH1L therefore needs neither a subtype row nor a genetic record
    here; it has a home.
  proposed_experiments:
  - experiment_id: exp_adnsid_opentargets_gene_triage
    name: Deep-phenotype triage of the remaining Open Targets associations
    description: >-
      For each of TLK2, ASH1L, STAG1, CLTC, CIC, NAA15, TRIP12 and SET,
      systematically review the published case series for recurrent
      dysmorphic, malformative, growth or neuroimaging features, and classify
      the gene-disease pair as (a) genuinely non-syndromic and therefore a
      curation target for this entry, or (b) syndromic and therefore better
      served by a dedicated gene-specific entry cross-referenced from here.
      The classification should record which specific feature drove any
      syndromic call, so the boundary decision is auditable rather than
      asserted.

- discussion_id: adnsid_gene_list_incomplete
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How many autosomal dominant non-syndromic intellectual disability genes
    remain undiscovered, and why has discovery not plateaued?
  attaches_to:
  - pathophysiology#Haploinsufficiency of a Dosage-Sensitive Neurodevelopmental Gene
  rationale: >-
    Modeling of de novo variant burden in 31,058 developmental-disorder trios predicted many undiscovered
    genes under specified mutation-rate and enrichment assumptions. Reduced penetrance or prenatal lethality
    are possible explanations for lower enrichment, not measured properties of every candidate. These
    estimates concern broader developmental disorders, not the number of AD-NSID genes specifically.
  proposed_experiments:
  - experiment_id: exp_adnsid_scale_trio_sequencing
    name: Scale trio sequencing to the calculated discovery-power threshold
    description: >-
      Expand pooled clinical and research parent-offspring trio sequencing
      toward the ~350,000-trio sample size calculated to give 80% power to
      detect a 10-fold de novo protein-truncating-variant enrichment for an
      average gene, and re-run gene-level enrichment testing.
  - experiment_id: exp_adnsid_penetrance_biobank
    name: Biobank penetrance test for low-enrichment candidate genes
    description: >-
      For candidate genes showing lower-than-expected de novo PTV enrichment,
      measure PTV frequency in unselected adult population biobanks to
      distinguish reduced penetrance from limited statistical power.
  evidence:
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Modelling suggests that more than 1,000 genes associated with
      developmental disorders have not yet been described, many of which are
      likely to be less penetrant than the currently known genes.
    explanation: >-
      Quantifies the size and expected properties of the undiscovered gene
      set.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We calculated that a sample size of ~350,000 parent-offspring trios
      would be needed to have 80% power to detect a 10-fold enrichment of de
      novo PTVs for an average gene.
    explanation: >-
      A modeled power calculation for an average gene and specified enrichment, not a guarantee of completing
      the gene list.

    directness: INDIRECT
- discussion_id: adnsid_critical_window_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which outcomes remain reversible at different ages in each gene-associated disorder, and how do mouse
    restoration experiments translate to humans?
  attaches_to:
  - pathophysiology#Altered Development and Function of Neural Circuits
  rationale: >-
    Earlier SYNGAP1 mouse studies found developmental restrictions for particular outcomes, while later
    adult restoration rescued remote memory and selected epileptiform phenotypes. Reversibility is endpoint-
    and model-dependent. These findings support further study of treatment timing rather than a class-wide
    prohibition on adult molecular therapy.
  proposed_experiments:
  - experiment_id: exp_adnsid_adult_rescue_chromatin_module
    name: Adult-rescue test in chromatin-module AD-NSID mouse models
    description: >-
      Repeat the conditional adult-restoration experiment in mouse models of
      chromatin-module AD-NSID genes (e.g. Gatad2b, Zbtb18) to test whether
      the critical-window property generalises beyond synaptic genes or is
      specific to the SYNGAP1 spine-maturation mechanism.
  - experiment_id: exp_adnsid_organoid_window_mapping
    name: Human cortical organoid staged-correction window mapping
    description: >-
      Use human iPSC-derived cortical organoids carrying an AD-NSID variant
      with an inducible correction system, applying correction at staged
      timepoints, to map the equivalent plasticity window on a human rather
      than murine developmental timetable.
  - experiment_id: exp_adnsid_partial_rescue_endpoints
    name: Compare age-dependent rescue across distinct endpoints
    description: Compare memory, adaptive behaviors and seizure-related outcomes using the same restoration schedule, without assuming that all cognitive endpoints share one closure time.
  evidence:
  - reference: PMID:23141534
    reference_title: "Pathogenic SYNGAP1 mutations impair cognitive development by disrupting maturation of dendritic spine synapses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inducing SYNGAP1 mutations after critical developmental windows closed
      had minimal impact on spine synapse function, whereas repairing these
      pathogenic mutations in adulthood did not improve behavior and
      cognition.
    explanation: >-
      Earlier endpoint-specific mouse findings must be interpreted alongside subsequent adult-rescue experiments.

  - reference: PMID:31025938
    reference_title: Re-expression of SynGAP protein in adulthood improves translatable measures of brain function and behavior.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: genetic reversal ofSyngap1pathogenicity in adult mice reverses deficits in remote memory
    explanation: Adult genetic restoration improved remote contextual memory in mice; this is endpoint-specific preclinical evidence and does not establish human therapeutic efficacy.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: adnsid_entity_boundary
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is autosomal dominant non-syndromic intellectual disability a coherent
    disease entity, or an ascertainment bin that should be dissolved into
    per-gene entries?
  attaches_to:
  - pathophysiology#Impaired Intellectual and Adaptive Function
  rationale: >-
    This category combines an inheritance pattern with the absence of a recognizable syndrome at ascertainment.
    It does not define one mechanism, complete penetrance, an exclusively de novo origin or a uniform
    trajectory. Several historical members now have gene-specific clinical descriptions. The existing
    subtype identities and historical context are retained while a future Grouping migration remains an
    explicit project-level scope decision.
  evidence:
  - reference: PMID:26989088
    reference_title: "Genetic and neurodevelopmental spectrum of SYNGAP1-associated intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SYNGAP1 encephalopathy is characterised by early neurodevelopmental
      delay typically preceding the onset of a relatively recognisable
      epilepsy comprising generalised seizures (absences, myoclonic jerks) and
      frequent triggers.
    explanation: >-
      The flagship member of the class redescribed as a recognisable syndrome,
      the core argument for dissolving the category.
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After exclusion of copy-number variants, de-novo point mutations and
      small indels are associated with severe, sporadic non-syndromic
      intellectual disability, accounting for 45-55% of patients with high
      locus heterogeneity.
    explanation: >-
      The counter-argument: the class does describe a real, quantified, shared
      genetic architecture even if its members are mechanistically diverse.

- discussion_id: adnsid_population_prevalence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What is the population prevalence of AD-NSID under an explicit clinical and molecular case definition?
  rationale: Published all-cause intellectual-disability prevalence and modeled birth prevalence of de novo developmental disorders describe different populations. Neither is a measured prevalence of AD-NSID. The DDD birth model includes recognizable syndromes and other dominant developmental disorders, while AD-NSID can also be inherited; the DDD estimate is therefore not an upper bound for this entire category.
  evidence:
  - reference: PMID:21236634
    reference_title: 'Prevalence of intellectual disability: a meta-analysis of population-based studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The prevalence of intellectual disability across all 52 studies included in the meta-analysis was 10.37/1000 population.
    explanation: Provides the all-cause ID denominator; supports the order of magnitude but not an AD-NSID-specific rate.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  - reference: PMID:28135719
    reference_title: Prevalence and architecture of de novo mutations in developmental disorders.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We estimate that developmental disorders caused by DNMs have an average prevalence of 1 in 213 to 1 in 448 births, depending on parental age.
    explanation: Mutation-rate modeling estimates parental-age-dependent birth prevalence of broader de novo developmental disorders, not AD-NSID prevalence.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  attaches_to: []
notes: 'This existing class-level entry is retained pending a deliberate migration to a Grouping or further gene-specific entries. Its shared diagnostic and counseling context does not imply a single mechanism, complete penetrance, a static course, brain-exclusive manifestations or one treatment status. The gene list and graph are representative; subtype-level ubiquitin-proteasome and N-terminal acetylation mechanisms are described without asserting a universal downstream sequence. Broader developmental-disorder gene-discovery models do not estimate the number of remaining AD-NSID genes.

  Series enumeration (issue 12226). MONDO asserts 26 classes as direct subclasses of MONDO:0015802. Five already have a home in this knowledge base and are deliberately not duplicated here: MONDO:0014599 (MRD34) and MONDO:0030918 (MRD52, ASH1L) are standalone entries under those names; MONDO:0032485 (IDD61) is the `disease_term` of `MED13_Syndrome`; MONDO:0032919 (IDD62) is the `disease_term` of `DLG4-Related_Synaptopathy`; and MONDO:0032939 (MRD63, with macrocephaly) is carried as the MRD63 `has_subtypes` row on `TRIO-Related_Neurodevelopmental_Disorder`. Of the remaining 21, eighteen are now `has_subtypes` rows on this entry. Three are dispositioned elsewhere, and the reasons are recorded rather than left implicit.

  MONDO:0033492 `Coffin-Siris syndrome 6` was declined for this entry and added as a subtype row on `Coffin_Siris_Syndrome` instead. MONDO''s own textual definition reads `any Coffin-Siris syndrome in which the cause of the disease is a mutation in the ARID2 gene`, ClinGen curates ARID2 against Coffin-Siris syndrome (MONDO:0015452), and that entry already carries ARID2 in its `genetic:` block. MONDO nevertheless asserts the class under this non-syndromic parent rather than under Coffin-Siris syndrome, which is a defect in MONDO rather than a curation choice available here.

  MONDO:0014580 `intellectual disability, autosomal dominant 33` (DPP6) was declined: ClinGen classifies the DPP6 gene-disease relationship as Disputed. It is recorded as a `genetic:` entry with `relationship_type: DISPUTED` so the disposition is queryable rather than only narrated.

  MONDO:0013266 `neurodevelopmental disorder with hypotonia, stereotypic hand movements, and impaired language` (MEF2C) was declined as a subtype row and proposed instead as a standalone entry, recorded in `stubs/Neurodevelopmental_Disorder_With_Hypotonia_Stereotypic_Hand_Movements_And_Impaired_Language.yaml`. MEF2C has its own GeneReviews chapter, `MEF2C-Related Disorder`, which this knowledge base treats as evidence that a concept carries enough independent clinical content to be a disease entry rather than a row; searching the committed Bookshelf index by gene symbol and by disease label found no dedicated chapter for any other gene-defined class in this set. The index does carry a Coffin-Siris syndrome chapter, but that is for the umbrella entity rather than for the ARID2-defined class. Note also that the MEF2C chapter is titled for the gene rather than for the non-syndromic intellectual disability concept.

  What the subtype rows do and do not claim. Each row asserts that MONDO files this class under this entry and names this gene as its cause, with the ClinGen classification and the defining series recorded. It does not assert that the phenotype is non-syndromic; several rows record evidence that it is not. See the adnsid_clingen_disease_concept discussion, which collects that observation across the whole set. Speech, hypotonia, walking delay, autistic behavior and hyperactivity remain without causal edges because the sources establish phenotype associations but do not resolve a common mechanism across this heterogeneous category.'

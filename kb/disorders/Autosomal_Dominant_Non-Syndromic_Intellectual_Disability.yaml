  description: >-
    MONDO carries no textual definition for this class; it asserts the class as a direct subclass of this
    entry's own term, MONDO:0015802, and records TLK2 as its causal gene by RO:0004003. TLK2 is a serine/threonine
    kinase whose physiological substrates include the H3-H4 chaperone ASF1 and histone H3, linking it
    to chromatin assembly and placing the subtype in this entry's chromatin and transcription module.
    ClinGen classifies the relationship as Definitive, against `complex neurodevelopmental disorder`.
    The defining 40-individual study calls the entity a distinct syndrome with a consistent facial gestalt
    and severe gastrointestinal involvement, and supports haploinsufficiency. RNA experiments demonstrated
    decay for two tested alleles, while a last-exon stop allele escaped decay. Some individuals had normal
    or borderline cognition, including a transmitting mother with low-normal IQ; neither every allele
    nor every carrier implies intellectual disability. The expert summary also notes possible
    dominant-negative effects for inactive kinase-domain alleles.

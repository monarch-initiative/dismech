- category: Neurologic
  name: Intellectual Disability
  description: >-
    Significantly impaired intellectual functioning and adaptive behaviour
    with onset in the developmental period. Severity across the AD-NSID class
    spans mild to severe; cohorts ascertained for trio exome sequencing have
    been enriched for moderate-to-severe disability (e.g. IQ below 50).
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  frequency: OBLIGATE
  diagnostic: true
  evidence:
  - reference: PMID:23033978
    reference_title: "Diagnostic exome sequencing in persons with severe intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We then sequenced the coding regions of more than 21,000 genes obtained
      from 100 patients with an IQ below 50 and their unaffected parents.
    explanation: >-
      Defines the core cognitive phenotype and the severity band of the
      cohorts in which the disease class was characterised.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scores on the Mullen Scales of Early Learning and the Vineland Adaptive
      Behavior Scales showed profiles that were consistent with
      moderate-to-severe mental retardation in all patients.
    explanation: >-
      Intellectual disability defines inclusion in this clinical category. This does not mean that every
      carrier of a variant in a listed gene has intellectual disability; some broader gene-associated
      cohorts include individuals with normal or borderline cognition.


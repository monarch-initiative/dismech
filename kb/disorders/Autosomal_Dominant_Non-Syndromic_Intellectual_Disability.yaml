    well-controlled generalised seizures to a pharmacoresistant developmental
    and epileptic encephalopathy. Its presence is one of the features that
    most often triggers reclassification of a nominally non-syndromic
    gene-disease pair as a recognisable syndrome; conversely, some MRD-series
    entities (e.g. ZBTB18/MRD22) present without epilepsy.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the patients were mildly epileptic."
    explanation: >-
      Epilepsy present in 2 of the 3 patients in the original non-syndromic
      SYNGAP1 series, and mild/controllable in both.
  - reference: PMID:19557857
    reference_title: "De novo STXBP1 mutations in mental retardation and nonsyndromic epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified de novo mutations in STXBP1 (nonsense, p.R388X; splicing,
      c.169+1G>A) in two patients with severe mental retardation and
      nonsyndromic epilepsy.
    explanation: >-
      Documents epilepsy co-occurring with non-syndromic ID under a de novo
      autosomal dominant lesion.
  - reference: PMID:38215144
    reference_title: "A de novo variant in ZBTB18 gene caused autosomal dominant non-syndromic intellectual disability 22 syndrome: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, he did not have growth retardation, microcephaly, corpus
      callosum hypoplasia, epilepsy, or dysmorphic facial features.
    explanation: >-
      Counter-example: a molecularly confirmed MRD22 patient without epilepsy,
      showing the feature is not obligate across the class. Frequency is
      intentionally omitted because the available sources are irreconcilable
      at class level: 2/3 in the index SYNGAP1 series, 17/17 in a larger
      SYNGAP1 cohort, and 0/1 here. Any single band would contradict at least
      one cited source.


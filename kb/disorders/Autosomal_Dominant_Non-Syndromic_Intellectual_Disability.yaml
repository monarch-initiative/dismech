  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO carries no textual definition for this class; it asserts the
    class as a direct subclass of this entry's own term, MONDO:0015802,
    and records CIC as its causal gene by RO:0004003. CIC encodes the
    transcriptional repressor capicua, which forms a repressor complex
    with ataxin 1, so the subtype is a chromatin and transcription
    module lesion. ClinGen classifies the relationship as Definitive,
    against `complex neurodevelopmental disorder`. The human probands
    were ascertained by reverse phenotyping from conditional mouse
    mutants rather than from a human non-syndromic intellectual
    disability cohort, which is worth recording because the
    ascertainment route shapes which features get reported.

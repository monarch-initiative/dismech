- category: Neurologic
  name: Intellectual Disability
  description: >-
    Significantly impaired intellectual functioning and adaptive behaviour
    with onset in the developmental period. Severity across the AD-NSID class
    spans mild to severe; cohorts ascertained for trio exome sequencing have
    been enriched for moderate-to-severe disability (e.g. IQ below 50).

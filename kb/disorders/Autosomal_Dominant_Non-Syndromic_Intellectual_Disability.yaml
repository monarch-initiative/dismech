  - reference: PMID:21237447
    reference_title: "De novo SYNGAP1 mutations in nonsyndromic intellectual disability and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We provide evidence that truncating mutations in SYNGAP1 are common in

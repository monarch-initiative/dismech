    directness: INDIRECT
  - reference: PMID:27418539
    reference_title: "Mutations specific to the Rac-GEF domain of TRIO cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a frameshift deletion in TRIO that segregated autosomal
      dominantly. By scrutinising data from DDD, we further identified three
      unrelated children with a similar phenotype who harboured de novo
      missense mutations in TRIO.
    explanation: >-
      Documents both an inherited autosomal dominant lesion and de novo
      lesions in the same gene, supporting the caveat that AD-NSID is not
      exclusively a de novo class.
  - reference: PMID:27418539
    reference_title: "Mutations specific to the Rac-GEF domain of TRIO cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, we identify pathogenic de novo missense mutations in TRIO
      associated with the same consistent phenotype, intellectual disability,
      microcephaly and dysmorphism with striking digital features.
    explanation: >-
      The reported microcephaly and dysmorphism limit the use of this series as evidence for a non-syndromic

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe six patients with developmental delay,
      intellectual disability, and dysmorphic features with de novo
      likely gene-damaging variants in HIVEP2 identified by
      whole-exome sequencing (WES).
    explanation: >-
      Six further probands with de novo likely gene-damaging HIVEP2
      variants, and the source of the dysmorphism caveat recorded
      above.
  - reference: PMID:27003583
    reference_title: "Mutations in HIVEP2 are associated with developmental delay, intellectual disability, and dysmorphic features."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HIVEP2 encodes a large transcription factor that regulates
      various neurodevelopmental pathways.
    explanation: >-
      Places HIVEP2 in this entry's chromatin and transcriptional
      regulation module.

    directness: INDIRECT

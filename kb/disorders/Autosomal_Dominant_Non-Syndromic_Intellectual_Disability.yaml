    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We then sequenced the coding regions of more than 21,000 genes obtained
      from 100 patients with an IQ below 50 and their unaffected parents.
    explanation: >-
      Defines the core cognitive phenotype and the severity band of the
      cohorts in which the disease class was characterised.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

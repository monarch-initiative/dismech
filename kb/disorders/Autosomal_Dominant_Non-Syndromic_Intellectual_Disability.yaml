diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    Parent-offspring trio exome (or genome) sequencing is the definitive
    diagnostic modality and is now recommended as a first-tier test for
    unexplained neurodevelopmental disorders, ahead of chromosomal microarray.
    Trio design is essential rather than merely convenient: de novo status is
    the primary evidence of pathogenicity for a novel heterozygous variant in
    a constraint-intolerant gene, and cannot be established from a
    proband-only test.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:31182824
    reference_title: "Meta-analysis and multidisciplinary consensus statement: exome sequencing is a first-tier clinical diagnostic test for individuals with neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Yield of ES was 36% overall, 31% for isolated NDD, and 53% for the NDD
      plus associated conditions.
    explanation: >-
      Quantifies exome yield, and specifically the ISOLATED (i.e.
      non-syndromic) NDD yield of 31% - directly relevant to this disease
      class.
  - reference: PMID:31182824
    reference_title: "Meta-analysis and multidisciplinary consensus statement: exome sequencing is a first-tier clinical diagnostic test for individuals with neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our review demonstrates that ES consistently outperforms CMA for
      evaluation of unexplained NDDs. We propose a diagnostic algorithm
      placing ES at the beginning of the evaluation of unexplained NDDs.
    explanation: >-
      Consensus recommendation placing exome sequencing first-tier, displacing
      chromosomal microarray.
  - reference: PMID:23033978
    reference_title: "Diagnostic exome sequencing in persons with severe intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      De novo mutations represent an important cause of intellectual
      disability; exome sequencing was used as an effective diagnostic
      strategy for their detection.
    explanation: >-
      Establishes trio exome sequencing as the effective diagnostic strategy
      for the de novo dominant class.
  - reference: PMID:39528574
    reference_title: "Trio-whole exome sequencing reveals the importance of de novo variants in children with intellectual disability and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      De novo variants in autosomal dominant genes are significant
      contributors to DD/ID, particularly in non-consanguineous families.
    explanation: >-
      Contemporary trio-WES cohort confirming the de novo autosomal dominant
      architecture, with the non-consanguineous qualifier that separates this
      class from recessive ID.
  - reference: PMID:39528574
    reference_title: "Trio-whole exome sequencing reveals the importance of de novo variants in children with intellectual disability and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnostic yield in the syndromic DD/ID group was higher than that
      in the non-syndromic DD/ID group (57.8% vs. 47.2%, P < 0.001).
    explanation: >-
      Important caveat for this specific class: yield is significantly lower
      in non-syndromic than syndromic DD/ID, so a negative trio exome is more
      common here than headline all-comers yields suggest.

- name: Exclusion of Recognised Syndromic and Metabolic Causes
  description: >-
    A non-syndromic designation requires prior exclusion of a recognised
    aetiology. Historically this meant karyotype, subtelomeric FISH or
    comparative genomic hybridisation, FMR1 repeat testing, and brain imaging;
    in current practice chromosomal microarray and targeted metabolic testing
    play this role, with exome sequencing increasingly performed in parallel
    rather than afterwards.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mental retardation was unexplained in these patients despite standard
      investigations, including karyotyping, subtelomeric fluorescence in situ
      hybridization analysis, or comparative genomic hybridization targeting
      regions associated with known syndromes, molecular testing for the
      common expansion mutation in FMR1, and computed tomography or magnetic
      resonance imaging of the brain.
    explanation: >-
      Specifies the exclusion workup that operationally defines the
      non-syndromic, unexplained category.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were examined by at least one experienced clinical
      geneticist, who ruled out the presence of specific dysmorphic features.
    explanation: >-
      Expert dysmorphology assessment is the clinical step that assigns a case
      to the non-syndromic category.

treatments:
- name: Genetic Counselling and Recurrence-Risk Assessment
  description: >-
    After a de novo variant is confirmed, sibling recurrence risk is low but
    not negligible, because a proportion of apparently de novo variants arise
    from undetected low-level parental gonadal or somatic mosaicism. Counsel
    on this residual risk rather than quoting a zero recurrence risk; parental
    mosaicism detectable in blood raises recurrence risk substantially more
    than mosaicism confined to the germline.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25087610
    reference_title: "Parental somatic mosaicism is underrecognized and influences recurrence risk of genomic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that somatic mosaicism for transmitted mutations among
      parents of children with simplex genetic disease is more common than
      currently appreciated.
    explanation: >-
      Establishes that apparently de novo variants in simplex cases can arise
      from underdetected parental mosaicism, the basis for a non-zero
      recurrence-risk counselling message.
  - reference: PMID:25087610
    reference_title: "Parental somatic mosaicism is underrecognized and influences recurrence risk of genomic disorders."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Integrated probabilistic modeling of gametogenesis developed in response
      to our observations predicts that mutations in parental blood increase
      recurrence risk substantially more than parental mutations confined to
      the germline.
    explanation: >-
      Provides the quantitative rationale distinguishing blood-detectable
      parental mosaicism from germline-confined mosaicism in recurrence-risk
      counselling.
  - reference: PMID:34697084
    reference_title: "Somatic mosaicism detected by genome-wide sequencing in 500 parent-child trios with suspected genetic disease: clinical and genetic counseling implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present 12 cases of apparent mosaicism identified in the CAUSES
      cohort: nine cases of parental mosaicism for a disease-causing variant
      found in a child and three cases of mosaicism in the proband for a de
      novo variant.
    explanation: >-
      Quantifies how often mosaicism is found in an unselected trio
      sequencing cohort of exactly the kind used to diagnose AD-NSID.
  - reference: PMID:34697084
    reference_title: "Somatic mosaicism detected by genome-wide sequencing in 500 parent-child trios with suspected genetic disease: clinical and genetic counseling implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In six of these cases, there was no evidence of mosaicism on Sanger
      sequencing-the variant was not detected on Sanger sequencing in three
      cases, and it appeared to be heterozygous in three others.
    explanation: >-
      Shows that confirmatory Sanger sequencing misses half of mosaic cases,
      which is why a "de novo" call from standard confirmation does not
      justify quoting a zero recurrence risk.

- name: Early Intervention, Rehabilitation, and Special Education
  description: >-
    There is no disease-modifying therapy. Management is developmental and
    supportive: individualised special education, early intervention
    programmes, rehabilitative training, and structured behavioural support.
    The critical-window biology gives an explicit mechanistic argument for
    intervening as early as possible, though it should not be over-read as
    evidence that any specific educational programme alters the underlying
    circuit defect.
  treatment_term:
    preferred_term: early intervention and special education
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:38215144
    reference_title: "A de novo variant in ZBTB18 gene caused autosomal dominant non-syndromic intellectual disability 22 syndrome: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "INTERVENTIONS: Rehabilitation training."
    explanation: >-
      Rehabilitative/developmental training was the entirety of the
      intervention offered in a molecularly confirmed MRD22 case, reflecting
      the absence of disease-specific therapy.

- name: Speech and Language Therapy
  description: >-
    Targeted therapy for the expressive language impairment that is
    disproportionately prominent in several AD-NSID entities, including
    augmentative and alternative communication for minimally verbal children.
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disruption of SYNGAP1 appears to be associated with a homogeneous
      clinical phenotype that is characterized by moderate-to-severe mental
      retardation accompanied by severe language impairment.
    explanation: >-
      Establishes the language impairment that this therapy targets; the
      citation supports the indication, not the efficacy of the intervention.

- name: Physical and Occupational Therapy
  description: >-
    Addresses the hypotonia, delayed gross motor milestones, and gait
    instability that commonly accompany AD-NSID, and supports acquisition of
    adaptive daily-living skills.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  - preferred_term: Delayed ability to walk
    term:
      id: HP:0031936
      label: Delayed ability to walk
  evidence:
  - reference: PMID:26989088
    reference_title: "Genetic and neurodevelopmental spectrum of SYNGAP1-associated intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypotonia and unstable gait were frequent associated neurological
      features.
    explanation: >-
      Documents the motor impairments that motivate physiotherapy; supports
      the indication rather than the efficacy.

- name: Antiseizure Pharmacotherapy for Comorbid Epilepsy
  description: >-
    When epilepsy is present, standard antiseizure medication is used.
    Response is variable and gene-dependent: seizures were well controlled by
    topiramate or valproate in the original SYNGAP1 series, whereas roughly
    half the patients in a larger SYNGAP1 cohort were pharmacoresistant. There
    is a mechanistic rationale for AMPA-directed agents in SYNGAP1
    haploinsufficiency, but it is a hypothesis generated from mouse work and
    small case observations, not a validated precision-therapy indication.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  target_mechanisms:
  - target: Cortical Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      Topiramate and valproate reduce AMPA-receptor-mediated excitatory
      transmission, the pathway de-repressed by SYNGAP1 haploinsufficiency.
      The drug edge attaches to the hyperexcitability node only: no available
      antiseizure medication reverses the upstream spine-maturation defect,
      which is why seizure control does not translate into cognitive rescue.
    evidence:
    - reference: PMID:19196676
      reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Indeed, topiramate directly inhibits AMPA-receptor activity, whereas
        valproate reduces the level of GluR1 AMPA-receptor subunit at
        hippocampal synapses and therefore indirectly reduces AMPA-receptor
        activity.
      explanation: >-
        Mechanistic rationale for the drug acting on the hyperexcitability
        node; authors' interpretation rather than a controlled trial.
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 had brief, generalized tonic–clonic seizures and was
      seizure-free while taking topiramate, whereas Patient 2 had some
      myoclonic and absence seizures, which were well controlled with
      valproate.
    explanation: >-
      Documents effective seizure control with standard antiseizure medication
      in molecularly confirmed AD-NSID.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Indeed, topiramate directly inhibits AMPA-receptor activity, whereas
      valproate reduces the level of GluR1 AMPA-receptor subunit at
      hippocampal synapses and therefore indirectly reduces AMPA-receptor
      activity.
    explanation: >-
      Gives the mechanistic rationale linking drug choice to the
      AMPA-receptor-mediated hyperexcitability node; this is authors'
      interpretation, not a controlled comparison.
  - reference: PMID:26989088
    reference_title: "Genetic and neurodevelopmental spectrum of SYNGAP1-associated intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were pharmacoresistant in half of the patients."
    explanation: >-
      Qualifies rather than endorses the efficacy claim: a larger series found
      half of patients pharmacoresistant, so antiseizure medication controls
      seizures in only about half of this group.

differential_diagnoses:
- name: Syndromic Intellectual Disability
  description: >-
    The primary differential. Any recognisable pattern of dysmorphic, growth,
    malformative, or neuroimaging features moves a case out of this class. The
    distinction is unstable in practice, since patients ascertained as
    non-syndromic frequently carry variants in genes catalogued as syndromic.
  distinguishing_features:
  - Presence of a recognisable dysmorphic gestalt or major malformation
  - Growth abnormality, microcephaly, or structural brain anomaly on imaging
  evidence:
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several patients did not meet the expected syndromic manifestation,
      suggesting a strong bias in present clinical syndrome descriptions.
    explanation: >-
      Documents the instability of the syndromic/non-syndromic distinction in
      real cohorts.

- name: X-linked Intellectual Disability
  description: >-
    X-linked non-syndromic ID was historically the best-characterised
    non-syndromic ID class and remains a major differential, particularly in
    affected males with a maternal family history. Trio sequencing
    distinguishes the two by demonstrating a maternally inherited hemizygous
    variant rather than an autosomal de novo one.
  distinguishing_features:
  - Male predominance with affected maternal male relatives
  - Maternally inherited hemizygous X-chromosome variant rather than an autosomal de novo variant
  evidence:
  - reference: PMID:23033978
    reference_title: "Diagnostic exome sequencing in persons with severe intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 10 de novo mutations and 3 X-linked (maternally inherited)
      mutations that had been previously predicted to compromise the function
      of known intellectual-disability genes were found in 13 patients.
    explanation: >-
      Shows both classes co-occurring in the same diagnostic cohort and
      distinguished by inheritance mode on trio analysis.

- name: Autosomal Recessive Non-Syndromic Intellectual Disability
  description: >-
    Biallelic recessive causes are the major alternative genetic architecture,
    prominent in consanguineous populations but contributing little in outbred
    populations - a key reason the de novo dominant model became dominant in
    European cohorts.
  distinguishing_features:
  - Consanguinity or an endogamous founder population
  - Biallelic (homozygous or compound heterozygous) variants inherited from unaffected carrier parents
  evidence:
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive inheritance seems to contribute little in the
      outbred population investigated.
    explanation: >-
      Quantifies the limited recessive contribution in an outbred cohort,
      supporting the dominant/de novo model for that setting.

- name: Copy Number Variant Intellectual Disability
  description: >-
    Pathogenic de novo copy number variants were the first recognised class of
    de novo dominant lesions in ID and remain a major cause. They are detected
    by chromosomal microarray and are excluded before, or in parallel with,
    sequence-level analysis.
  distinguishing_features:
  - Detected by chromosomal microarray rather than sequencing
  - Contiguous multi-gene deletion or duplication rather than a single-gene variant
  evidence:
  - reference: PMID:21076407
    reference_title: "A de novo paradigm for mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with de novo copy number variation, de novo point mutations of
      large effect could explain the majority of all mental retardation cases
      in the population.
    explanation: >-
      Places de novo CNVs alongside de novo point mutations as the two arms of
      the de novo dominant architecture.

discussions:
- discussion_id: adnsid_clingen_disease_concept
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is `autosomal dominant non-syndromic intellectual disability` a
    disease concept that any gene-disease curation resource actually
    uses, or is it an ontology-only category that no expert panel
    curates against?
  attaches_to:
  - has_subtypes#
  rationale: >-
    This entry now carries 18 `has_subtypes` rows, one per gene-defined
    MONDO class that MONDO asserts as a direct subclass of MONDO:0015802
    and for which a causal gene is recorded. Sixteen of the 21 classes
    MONDO files here have a ClinGen Gene-Disease Validity curation, and
    not one is curated against a disease concept whose own label says
    non-syndromic. Eleven are curated against `complex
    neurodevelopmental disorder` (MONDO:0100038), one against `syndromic
    intellectual disability` (MONDO:0000508, NAA15), one against plain
    `intellectual disability` (MONDO:0001071, SET), one against
    `progressive myoclonus epilepsy` (MONDO:0020074, NUS1), one against
    `Coffin-Siris syndrome` (MONDO:0015452, ARID2) and one against an
    MRD-series identifier (MONDO:0032795, CAMK2G). That last is the only
    ClinGen record in the set naming an MRD term at all; it is graded
    `Limited`, and the same record describes the entity as `autosomal
    dominant syndromic intellectual disability`. The five genes with no
    ClinGen record are TAF4, HIVEP2, KCNQ5, CAMK2B and CLTC. The primary
    literature points the same way: the defining series for TLK2, STAG1,
    TAF4, NAA15 and HIVEP2 each report recurrent dysmorphic or
    extra-cognitive features, and two of them - TLK2 and STAG1 - call
    the entity syndromic in their own words. This is a second,
    independent line of evidence for the ascertainment-category
    hypothesis already recorded in `mechanistic_hypotheses`, and it is a
    different kind of evidence from the gene-by-gene reclassification
    anecdotes, because it is a property of the whole set. What it does
    not settle is whether the right response is to retire the category,
    to rebuild this entry as a Grouping over per-gene entries, or to
    keep it as the class-level home for shared diagnostic and
    counselling content while treating the non-syndromic label as
    ascertainment rather than biology.
  proposed_experiments:
  - experiment_id: exp_adnsid_clingen_concept_census
    name: Systematic census of the disease concepts expert panels curate these genes against
    description: >-
      For every gene-defined MONDO class asserted under MONDO:0015802,
      record the disease concept each of ClinGen, OMIM, Orphanet and
      GeneReviews curates the gene against, and test whether any
      resource independently uses a non-syndromic concept. A category
      that no curation resource instantiates is an ontology artefact;
      one that several use independently is a real clinical entity.

- discussion_id: adnsid_opentargets_gene_backlog
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which of the remaining Open Targets gene associations for MONDO:0015802
    warrant curation as full genetic records in this entry, and which are
    better placed on gene-specific syndromic entries?
  attaches_to:
  - pathophysiology#Haploinsufficiency of a Dosage-Sensitive Neurodevelopmental Gene
  rationale: >-
    Open Targets associates MONDO:0015802 with TLK2, ASH1L, STAG1, CLTC,
    CAMK2A, CIC, NAA15, TRIP12, KMT5B, TRIO, SET and DLG4. This entry curates
    four of those (CAMK2A, DLG4, KMT5B, TRIO) alongside six genes drawn from
    the general de novo ID literature (SYNGAP1, STXBP1, ZBTB18, GRIN2B,
    GATAD2B, MED13L). The gene list is deliberately illustrative of the major
    functional modules rather than exhaustive, so the remaining eight
    associations - TLK2, ASH1L, STAG1, CLTC, CIC, NAA15, TRIP12, SET - are
    recorded here as an explicit backlog rather than left as a silent
    omission. Triage is not purely mechanical: several of these are already
    described with recognisable syndromic features, so for each the curation
    decision is entangled with the syndromic/non-syndromic boundary question
    tracked in the adnsid_entity_boundary discussion. Note also that Open
    Targets associations are themselves reassessed over time, so the target
    list is a moving one.

    Update (series-019, issue 12226): seven of those eight - TLK2,
    STAG1, CLTC, CIC, NAA15, TRIP12 and SET - now have `has_subtypes`
    rows carrying the MONDO class and the gene binding, so they are no
    longer silent omissions; each row records whether the gene-disease
    pair looks syndromic and what ClinGen curated it against, which is
    the triage this discussion asked for. They are deliberately not
    promoted to full `genetic:` records, because that block remains
    illustrative of the functional modules by design. The eighth, ASH1L,
    resolves differently and is now closed: MONDO records ASH1L as the
    causal gene of `intellectual disability, autosomal dominant 52`
    (MONDO:0030918), a direct subclass of this entry's own term, and
    that class is already curated in this knowledge base as the
    standalone entry `Intellectual_Disability_Autosomal_Dominant_52`.
    ASH1L therefore needs neither a subtype row nor a genetic record
    here; it has a home.
  proposed_experiments:
  - experiment_id: exp_adnsid_opentargets_gene_triage
    name: Deep-phenotype triage of the remaining Open Targets associations
    description: >-
      For each of TLK2, ASH1L, STAG1, CLTC, CIC, NAA15, TRIP12 and SET,
      systematically review the published case series for recurrent
      dysmorphic, malformative, growth or neuroimaging features, and classify
      the gene-disease pair as (a) genuinely non-syndromic and therefore a
      curation target for this entry, or (b) syndromic and therefore better
      served by a dedicated gene-specific entry cross-referenced from here.
      The classification should record which specific feature drove any
      syndromic call, so the boundary decision is auditable rather than
      asserted.

- discussion_id: adnsid_gene_list_incomplete
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How many autosomal dominant non-syndromic intellectual disability genes
    remain undiscovered, and why has discovery not plateaued?
  attaches_to:
  - pathophysiology#Haploinsufficiency of a Dosage-Sensitive Neurodevelopmental Gene
  rationale: >-
    Modelling of the residual de novo protein-truncating burden in 31,058
    trios implies roughly 1,000 further haploinsufficient developmental
    disorder genes, at a fold-enrichment about three times lower than for
    currently known genes. Lower enrichment implies reduced penetrance and/or
    pre/perinatal lethality, meaning the undiscovered tail is systematically
    different from the known genes and may not behave as cleanly monogenic.
    This is a first-order limit on the completeness of any AD-NSID gene list,
    including this entry's.
  proposed_experiments:
  - experiment_id: exp_adnsid_scale_trio_sequencing
    name: Scale trio sequencing to the calculated discovery-power threshold
    description: >-
      Expand pooled clinical and research parent-offspring trio sequencing
      toward the ~350,000-trio sample size calculated to give 80% power to
      detect a 10-fold de novo protein-truncating-variant enrichment for an
      average gene, and re-run gene-level enrichment testing.
  - experiment_id: exp_adnsid_penetrance_biobank
    name: Biobank penetrance test for low-enrichment candidate genes
    description: >-
      For candidate genes showing lower-than-expected de novo PTV enrichment,
      measure PTV frequency in unselected adult population biobanks to
      distinguish reduced penetrance from limited statistical power.
  evidence:
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Modelling suggests that more than 1,000 genes associated with
      developmental disorders have not yet been described, many of which are
      likely to be less penetrant than the currently known genes.
    explanation: >-
      Quantifies the size and expected properties of the undiscovered gene
      set.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We calculated that a sample size of ~350,000 parent-offspring trios
      would be needed to have 80% power to detect a 10-fold enrichment of de
      novo PTVs for an average gene.
    explanation: >-
      Sets the concrete sample-size target for completing the gene list.

- discussion_id: adnsid_critical_window_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the mouse critical-window result - that repairing the causal lesion
    in adulthood fails to rescue cognition - hold in humans, and does it
    genuinely foreclose postnatal molecular therapy for AD-NSID?
  attaches_to:
  - pathophysiology#Impaired Cortical Circuit Formation During Critical Developmental Windows
  rationale: >-
    The critical-window claim rests on conditional Syngap1 mouse genetics, and
    it is doing very heavy lifting: it is the main mechanistic argument that
    AD-NSID is therapeutically closed after early childhood. But the human
    cortical developmental timetable is far longer than the mouse's,
    plasticity windows differ by circuit, and the experiment has been
    performed for one gene in the synaptic module only - it has not been
    tested for the chromatin/transcription module at all. Treating a
    single-gene mouse result as a general prohibition on postnatal therapy
    across a class of hundreds of genes is an extrapolation the evidence does
    not license. Resolving this matters directly to whether ASO or gene-dosage
    therapies are worth developing for this class.
  proposed_experiments:
  - experiment_id: exp_adnsid_adult_rescue_chromatin_module
    name: Adult-rescue test in chromatin-module AD-NSID mouse models
    description: >-
      Repeat the conditional adult-restoration experiment in mouse models of
      chromatin-module AD-NSID genes (e.g. Gatad2b, Zbtb18) to test whether
      the critical-window property generalises beyond synaptic genes or is
      specific to the SYNGAP1 spine-maturation mechanism.
  - experiment_id: exp_adnsid_organoid_window_mapping
    name: Human cortical organoid staged-correction window mapping
    description: >-
      Use human iPSC-derived cortical organoids carrying an AD-NSID variant
      with an inducible correction system, applying correction at staged
      timepoints, to map the equivalent plasticity window on a human rather
      than murine developmental timetable.
  - experiment_id: exp_adnsid_partial_rescue_endpoints
    name: Partial-rescue endpoint analysis after window closure
    description: >-
      In existing adult-rescue paradigms, assess whether adaptive behaviour
      and seizure burden improve after window closure even when IQ-equivalent
      cognitive measures do not, to test whether "no rescue" is
      endpoint-specific rather than absolute.
  evidence:
  - reference: PMID:23141534
    reference_title: "Pathogenic SYNGAP1 mutations impair cognitive development by disrupting maturation of dendritic spine synapses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inducing SYNGAP1 mutations after critical developmental windows closed
      had minimal impact on spine synapse function, whereas repairing these
      pathogenic mutations in adulthood did not improve behavior and
      cognition.
    explanation: >-
      The mouse result whose human translational validity is the open
      question.

- discussion_id: adnsid_entity_boundary
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is autosomal dominant non-syndromic intellectual disability a coherent
    disease entity, or an ascertainment bin that should be dissolved into
    per-gene entries?
  attaches_to:
  - pathophysiology#Static Global Cognitive and Adaptive Impairment Without Syndromic Features
  rationale: >-
    The class is defined by a negative (no recognised gestalt) plus an
    inheritance mode, not by a shared mechanism - its members span synaptic,
    chromatin, and cytoskeletal biology. Several flagship members (SYNGAP1,
    MED13L) have already been redescribed as syndromic, and the ZBTB18 case
    literature shows the label persists mainly where case counts are small.
    Against dissolution: the class does capture a genuinely shared
    architecture (de novo, monoallelic, constraint-intolerant gene, static
    developmental course) that is clinically actionable - it is the group for
    which trio sequencing is the correct first test. For dismech, the open
    question is whether this should remain a Disease entry or be remodelled as
    a Grouping over per-gene MRD entries once enough of those exist.
  evidence:
  - reference: PMID:26989088
    reference_title: "Genetic and neurodevelopmental spectrum of SYNGAP1-associated intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SYNGAP1 encephalopathy is characterised by early neurodevelopmental
      delay typically preceding the onset of a relatively recognisable
      epilepsy comprising generalised seizures (absences, myoclonic jerks) and
      frequent triggers.
    explanation: >-
      The flagship member of the class redescribed as a recognisable syndrome,
      the core argument for dissolving the category.
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After exclusion of copy-number variants, de-novo point mutations and
      small indels are associated with severe, sporadic non-syndromic
      intellectual disability, accounting for 45-55% of patients with high
      locus heterogeneity.
    explanation: >-
      The counter-argument: the class does describe a real, quantified, shared
      genetic architecture even if its members are mechanistically diverse.

notes: >-
  Lump/split rationale: this entry is deliberately curated as a single
  class-level Disease rather than as a set of per-gene MRD entries, because
  the shared, clinically actionable content (de novo dominant architecture,
  trio-sequencing diagnostic strategy, static developmental course, absence of
  disease-modifying therapy, recurrence-risk counselling) sits at the class
  level, while gene-specific detail belongs in per-gene entries. If and when
  dismech accumulates enough individual MRD-series Disease entries, this should
  be reconsidered as a Grouping - see the adnsid_entity_boundary discussion.
  The genetic list is illustrative of the two major functional modules, not
  exhaustive: several hundred genes have been implicated, and modelling
  suggests over a thousand remain undescribed.

  Series enumeration (issue 12226). MONDO asserts 26 classes as direct
  subclasses of MONDO:0015802. Five already have a home in this knowledge
  base and are deliberately not duplicated here: MONDO:0014599 (MRD34) and
  MONDO:0030918 (MRD52, ASH1L) are standalone entries under those names;
  MONDO:0032485 (IDD61) is the `disease_term` of `MED13_Syndrome`;
  MONDO:0032919 (IDD62) is the `disease_term` of
  `DLG4-Related_Synaptopathy`; and MONDO:0032939 (MRD63, with
  macrocephaly) is carried as the MRD63 `has_subtypes` row on
  `TRIO-Related_Neurodevelopmental_Disorder`. Of the remaining 21,
  eighteen are now `has_subtypes` rows on this entry. Three are
  dispositioned elsewhere, and the reasons are recorded rather than left
  implicit.

  MONDO:0033492 `Coffin-Siris syndrome 6` was declined for this entry and
  added as a subtype row on `Coffin_Siris_Syndrome` instead. MONDO's own
  textual definition reads `any Coffin-Siris syndrome in which the cause
  of the disease is a mutation in the ARID2 gene`, ClinGen curates ARID2
  against Coffin-Siris syndrome (MONDO:0015452), and that entry already
  carries ARID2 in its `genetic:` block. MONDO nevertheless asserts the
  class under this non-syndromic parent rather than under Coffin-Siris
  syndrome, which is a defect in MONDO rather than a curation choice
  available here.

  MONDO:0014580 `intellectual disability, autosomal dominant 33` (DPP6)
  was declined: ClinGen classifies the DPP6 gene-disease relationship as
  Disputed. It is recorded as a `genetic:` entry with `relationship_type:
  DISPUTED` so the disposition is queryable rather than only narrated.

  MONDO:0013266 `neurodevelopmental disorder with hypotonia, stereotypic
  hand movements, and impaired language` (MEF2C) was declined as a subtype
  row and proposed instead as a standalone entry, recorded in
  `stubs/Neurodevelopmental_Disorder_With_Hypotonia_Stereotypic_Hand_Movements_And_Impaired_Language.yaml`.
  MEF2C has its own GeneReviews chapter, `MEF2C-Related Disorder`, which
  this knowledge base treats as evidence that a concept carries enough
  independent clinical content to be a disease entry rather than a row;
  searching the committed Bookshelf index by gene symbol and by disease
  label found no dedicated chapter for any other gene-defined class in
  this set. The index does carry a Coffin-Siris syndrome chapter, but that
  is for the umbrella entity rather than for the ARID2-defined class. Note
  also that the MEF2C chapter is titled for the gene rather than for the
  non-syndromic intellectual disability concept.

  What the subtype rows do and do not claim. Each row asserts that MONDO
  files this class under this entry and names this gene as its cause, with
  the ClinGen classification and the defining series recorded. It does not
  assert that the phenotype is non-syndromic; several rows record evidence
  that it is not. See the adnsid_clingen_disease_concept discussion, which
  collects that observation across the whole set.

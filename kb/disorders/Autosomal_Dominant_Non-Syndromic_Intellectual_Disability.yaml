- name: MRD46
  display_name: Intellectual disability, autosomal dominant 46 (KCNQ5-related)
  subtype_term:
    preferred_term: KCNQ5-related autosomal dominant intellectual disability
    term:
      id: MONDO:0030911
      label: intellectual disability, autosomal dominant 46
  genes:
  - preferred_term: KCNQ5
    term:
      id: hgnc:6299
      label: KCNQ5
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO carries no textual definition for this class; it asserts the class as a direct subclass of this
    entry's own term, MONDO:0015802, and records KCNQ5 as its causal gene by RO:0004003. KCNQ5 is widely
    expressed in the brain and generates the neuronal M-type potassium current. Frog-oocyte assays found
    both reduced and increased channel function for disease-associated variants. This subtype follows
    the altered-protein-activity branch; the assays do not directly establish an identical excitability
    change in patients for both directions. No ClinGen Gene-Disease Validity curation was found for KCNQ5
    in the gene-validity release read for this pass, searched by gene symbol across the full download.
  evidence:
  - reference: PMID:28669405
    reference_title: "Loss-of-Function and Gain-of-Function Mutations in KCNQ5 Cause Intellectual Disability or Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified de novo heterozygous missense
      mutations in four probands with intellectual disability,
      abnormal neurological findings, and treatment-resistant epilepsy
      (in two of four).
    explanation: >-
      The four-proband series establishing de novo KCNQ5 missense
      variants as a cause of intellectual disability.
  - reference: PMID:28669405
    reference_title: "Loss-of-Function and Gain-of-Function Mutations in KCNQ5 Cause Intellectual Disability or Epileptic Encephalopathy."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KCNQ5 is a highly conserved gene encoding an important channel
      for neuronal function; it is widely expressed in the brain and
      generates M-type current.
    explanation: >-
      Channel-function background; this is not a direct measurement of patient neuronal excitability.
    directness: INDIRECT
  - reference: PMID:28669405
    reference_title: "Loss-of-Function and Gain-of-Function Mutations in KCNQ5 Cause Intellectual Disability or Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Specifically, both loss-of-function and gain-of-function KCNQ5
      mutations, associated with increased excitability and decreased
      repolarization reserve, lead to pathophysiology.
    explanation: >-
      Oocyte electrophysiology demonstrates bidirectional changes in channel function. The proposed neuronal
      consequences are not a direct measurement in patient neurons.

- name: MRD47
  display_name: Intellectual disability, autosomal dominant 47 (STAG1-related)
  subtype_term:
    preferred_term: STAG1-related autosomal dominant intellectual disability
    term:
      id: MONDO:0030912
      label: intellectual disability, autosomal dominant 47
  genes:
  - preferred_term: STAG1
    term:
      id: hgnc:11354
      label: STAG1
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO carries no textual definition for this class; it asserts the class as a direct subclass of this
    entry's own term, MONDO:0015802, and records STAG1 as its causal gene by RO:0004003. STAG1 belongs
    to the STAG subunit of the core cohesin complex, making this subtype a cohesinopathy. ClinGen classifies
    the relationship as Definitive, against `complex neurodevelopmental disorder`. Its non-syndromic placement
    conflicts with its clinical description: MONDO itself also asserts MONDO:0030912 as a subclass of
    `multiple congenital anomalies/dysmorphic syndrome-intellectual disability`, so the two placements
    contradict each other within one ontology, and the defining case series reports shared facial features
    and calls the phenotype syndromic.
  evidence:
  - reference: CGGV:assertion_30cc66e4-e3cf-428d-9f27-58e8427c94f1-2022-09-20T060000.000Z
    reference_title: "STAG1 / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      STAG1 | HGNC:11354 | complex neurodevelopmental disorder |
      MONDO:0100038 | AD | Definitive | SOP9 | Intellectual Disability
      and Autism Gene Curation Expert Panel
    explanation: >-
      ClinGen's expert-panel gene-disease validity classification for
      this gene. The row also records which disease concept the panel
      curated against, which for this series is generally not the
      MRD-series term the subtype binds; the
      adnsid_clingen_disease_concept discussion on this entry collects
      that observation across all the subtypes.
  - reference: PMID:28119487
    reference_title: "STAG1 mutations cause a novel cohesinopathy characterised by unspecific syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an international series of 17 individuals from 16
      families presenting with syndromic unspecific ID that could be
      attributed to a STAG1 deletion or point mutation.
    explanation: >-
      The defining series, and the source of the observation that the
      authors themselves describe the phenotype as syndromic.
  - reference: PMID:28119487
    reference_title: "STAG1 mutations cause a novel cohesinopathy characterised by unspecific syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 17 patients shared common facial features, with wide mouth
      and deep-set eyes.
    explanation: >-
      The specific shared dysmorphic findings behind the syndromic
      characterisation.
  - reference: PMID:28119487
    reference_title: "STAG1 mutations cause a novel cohesinopathy characterised by unspecific syndromic intellectual disability."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STAG1 belongs to the STAG subunit of the core cohesin complex,
      along with five other subunits.
    explanation: >-
      Places the subtype among the cohesinopathies.

    directness: INDIRECT
- name: MRD49
  display_name: Clark-Baraitser syndrome (TRIP12-related, MRD49)
  subtype_term:
    preferred_term: TRIP12-related autosomal dominant intellectual disability
    term:
      id: MONDO:0030914
      label: Clark-Baraitser syndrome
  genes:
  - preferred_term: TRIP12
    term:
      id: hgnc:12306
      label: TRIP12
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    The one member of this series MONDO labels with an eponym rather than an MRD number; `MRD49` and `intellectual
    disability, autosomal dominant 49` are both MONDO synonyms of the same class, and MONDO asserts it
    as a direct subclass of this entry's own term with TRIP12 as its causal gene by RO:0004003. TRIP12
    encodes a HECT-domain E3 ubiquitin ligase on chromosome 2q36.3 and acts through haploinsufficiency,
    with variant-level support from reduced transcript abundance for one splice allele. Its proposed ubiquitin-proteasome
    consequences are distinct from the synaptic, chromatin and cytoskeletal examples in the graph. MONDO
    cross-references the class to both OMIM:617752 and OMIM:300602. ClinGen classifies the gene-disease
    relationship as Definitive, against `complex neurodevelopmental disorder`, and a peripheral-blood
    DNA methylation episignature has been reported. This is an adjunct to variant interpretation; two
    affected discovery samples were excluded as outliers, so the study does not
    establish perfect sensitivity for all alleles.
  evidence:
  - reference: CGGV:assertion_011b99b3-0d17-4615-800e-36f4bacd8117-2022-04-05T060000.000Z
    reference_title: "TRIP12 / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TRIP12 | HGNC:12306 | complex neurodevelopmental disorder |
      MONDO:0100038 | AD | Definitive | SOP9 | Intellectual Disability
      and Autism Gene Curation Expert Panel
    explanation: >-
      ClinGen's expert-panel gene-disease validity classification for
      this gene. The row also records which disease concept the panel
      curated against, which for this series is generally not the
      MRD-series term the subtype binds; the
      adnsid_clingen_disease_concept discussion on this entry collects
      that observation across all the subtypes.
  - reference: PMID:36430143
    reference_title: "Episignature Mapping of TRIP12 Provides Functional Insight into Clark-Baraitser Syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clark-Baraitser syndrome is a rare autosomal dominant
      intellectual disability syndrome caused by pathogenic variants
      in the TRIP12 (Thyroid Hormone Receptor Interactor 12) gene.
    explanation: >-
      Establishes that the eponymous syndrome is TRIP12-related and
      autosomal dominant.
  - reference: PMID:36430143
    reference_title: "Episignature Mapping of TRIP12 Provides Functional Insight into Clark-Baraitser Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a specific and sensitive DNA methylation (DNAm)
      episignature associated with pathogenic TRIP12 variants,
      establishing its utility as a clinical biomarker for
      Clark-Baraitser syndrome.
    explanation: >-
      Peripheral-blood classifier development and validation. Two discovery outliers were excluded; this
      supports a potential diagnostic adjunct, not universal sensitivity or a brain mechanism.
  - reference: PMID:28251352
    reference_title: "Haploinsufficiency of the E3 ubiquitin-protein ligase gene TRIP12 causes intellectual disability with or without autism spectrum disorders, speech delay, and dysmorphic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      qPCR data showed dramatic reduction of TRIP12 mRNA level in the proband compared to three unaffected
      family member controls
    explanation: >-
      RNA measured in the patient whole-blood sample supports reduced transcript abundance for c.3743+1G>A.
      The paper later classifies p.A761V as a VUS despite the abstract calling all nine variants pathogenic;
      de novo occurrence alone does not resolve that uncertainty.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:28251352
    reference_title: "Haploinsufficiency of the E3 ubiquitin-protein ligase gene TRIP12 causes intellectual disability with or without autism spectrum disorders, speech delay, and dysmorphic features."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only a handful of single-nucleotide variants (SNVs) and
      copy-number variants (CNVs) involving TRIP12, encoding a member
      of the HECT domain E3 ubiquitin ligases family on chromosome
      2q36.3 have been reported.
    explanation: >-
      Source for the protein family and the chromosomal location
      recorded above.

    directness: INDIRECT
- name: MRD50

      label: NAA15
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO carries no textual definition for this class; it asserts the
    class as a direct subclass of this entry's own term, MONDO:0015802,
    and records NAA15 as its causal gene by RO:0004003. NAA15 is the
    auxiliary subunit of the NatA N-terminal acetyltransferase complex,
    and haploinsufficiency is supported by both transcript degradation
    and copy-number deletions. ClinGen classifies the relationship as
    Definitive but curates it explicitly against `syndromic intellectual
    disability`, and the defining 38-individual cohort reports
    craniofacial dysmorphology, congenital cardiac anomalies and
    seizures in some subjects - so both the expert panel and the primary
    cohort contradict a non-syndromic placement.

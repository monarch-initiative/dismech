  description: >-
    MONDO defines this concept as any autosomal dominant non-syndromic intellectual disability in which
    the cause of the disease is a mutation in the TBL1XR1 gene. TBL1XR1 encodes an F-box-like/WD40 repeat-containing
    protein acting in nuclear-receptor-mediated transcription, which places the subtype in this entry's
    chromatin and transcription module. ClinGen classifies the relationship as Definitive, against `complex

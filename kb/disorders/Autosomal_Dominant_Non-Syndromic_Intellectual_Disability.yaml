- name: MRD41
  display_name: Intellectual disability, autosomal dominant 41 (TBL1XR1-related)
  subtype_term:
    preferred_term: TBL1XR1-related autosomal dominant intellectual disability
    term:
      id: MONDO:0014842
      label: intellectual disability, autosomal dominant 41
  genes:
  - preferred_term: TBL1XR1
    term:
      id: hgnc:29529
      label: TBL1XR1
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO defines this concept as any autosomal dominant non-syndromic
    intellectual disability in which the cause of the disease is a
    mutation in the TBL1XR1 gene. TBL1XR1 encodes an F-box-like/WD40
    repeat-containing protein acting in nuclear-receptor-mediated
    transcription, which places the subtype in this entry's chromatin
    and transcription module. ClinGen classifies the relationship as
    Definitive, against `complex neurodevelopmental disorder`. A
    caregiver-reported cross-sectional survey of 41 patients found
    language the most severely affected domain, and reports
    developmental regression in later childhood in a subset - a
    progressive element that sits awkwardly beside the static course
    this entry models at the class level.
  evidence:
  - reference: CGGV:assertion_8352a921-43c0-4097-9147-2618a4165b57-2020-07-07T170000.000Z
    reference_title: "TBL1XR1 / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TBL1XR1 | HGNC:29529 | complex neurodevelopmental disorder |

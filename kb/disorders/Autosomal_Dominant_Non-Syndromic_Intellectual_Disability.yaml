name: Autosomal Dominant Non-Syndromic Intellectual Disability
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Autosomal dominant non-syndromic intellectual disability (AD-NSID; the OMIM
  "mental retardation, autosomal dominant" / MRD series) is a genetically
  extremely heterogeneous class of intellectual disability in which
  significantly impaired intellectual functioning and adaptive behaviour occur
  in the absence of a consistent pattern of associated dysmorphic,
  malformative, metabolic, or neuroimaging features that would define a
  clinically recognisable syndrome. Almost all affected individuals are
  simplex cases: the causal lesion is typically a heterozygous de novo
  loss-of-function variant that halves the dose of a strongly
  constraint-intolerant neurodevelopmental gene, so autosomal dominance is
  inferred from the monoallelic, fully penetrant lesion rather than observed
  as vertical family transmission (reduced reproductive fitness makes
  multigenerational pedigrees rare). The class was essentially invisible to
  linkage mapping and was defined only after parent-offspring trio exome
  sequencing became feasible, beginning with the "de novo paradigm" studies of
  2010-2012 and continuing through the Deciphering Developmental Disorders
  study and its successors. Causal genes converge on a small number of
  biological modules - synaptic transmission and plasticity, chromatin and
  transcriptional regulation, and cytoskeletal/signalling control of neuronal
  morphogenesis - with SYNGAP1 (MRD5) the paradigmatic example. The
  syndromic/non-syndromic boundary is unstable: deeper phenotyping repeatedly
  reclassifies "non-syndromic" gene-disease pairs as syndromic, which has led
  to the proposal (see `mechanistic_hypotheses`) that AD-NSID is at least
  partly an ascertainment category defined by the current absence of a
  recognised phenotypic gestalt rather than a mechanistically distinct entity.
  A competing, not mutually exclusive model holds that a subset of causal genes
  is genuinely brain-restricted in expression and therefore produces isolated
  cognitive impairment; the boundary question remains open.
category: Genetic
disease_term:
  preferred_term: autosomal dominant non-syndromic intellectual disability
  term:
    id: MONDO:0015802
    label: autosomal dominant non-syndromic intellectual disability
parents:
- Non-Syndromic Intellectual Disability
- Intellectual Disability, Autosomal Dominant
synonyms:
- non-syndromic intellectual disability, autosomal dominant
- autosomal dominant mental retardation
- mental retardation, autosomal dominant (MRD)
- autosomal dominant nonsyndromic mental retardation
- AD-NSID


name: Autosomal Dominant Non-Syndromic Intellectual Disability
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Autosomal dominant non-syndromic intellectual disability is a genetically heterogeneous category in
  which intellectual and adaptive impairment initially lacks a recognizable syndromic pattern. Historical
  MRD-series diagnoses overlap with subsequently delineated neurodevelopmental syndromes, including disorders
  with epilepsy, behavioral differences and extra-neurological features. De novo variants are common in
  severe sporadic cohorts, but inherited variants and parental mosaicism also occur. Haploinsufficiency,
  gain of function and other altered-function mechanisms depend on the gene and allele; neither complete
  penetrance nor a uniform reduction of protein abundance defines this category. Candidate-gene sequencing
  identified SYNGAP1-related disease in 2009, followed by wider discovery through trio exome sequencing.
  Representative mechanisms affect synaptic function, gene regulation, cytoskeletal dynamics and neuronal
  development. Their inclusion here does not imply that every subtype
  follows one causal sequence. This entry retains its existing class-level scope and subtype identities
  while distinguishing that scope from individual clinical syndromes.
category: Genetic
disease_term:
  preferred_term: autosomal dominant non-syndromic intellectual disability
  term:
    id: MONDO:0015802
    label: autosomal dominant non-syndromic intellectual disability
parents:
- Non-Syndromic Intellectual Disability
- Intellectual Disability, Autosomal Dominant
synonyms:
- non-syndromic intellectual disability, autosomal dominant
- autosomal dominant mental retardation
- mental retardation, autosomal dominant (MRD)
- autosomal dominant nonsyndromic mental retardation
- AD-NSID


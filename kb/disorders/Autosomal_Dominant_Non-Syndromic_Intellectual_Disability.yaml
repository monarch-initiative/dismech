      label: CAMK2A
  - preferred_term: CAMK2B
    term:
      id: hgnc:1461
      label: CAMK2B
  biological_scale: CELLULAR
  description: >-
    A large fraction of AD-NSID genes encode components of the excitatory
    postsynaptic density, the NMDA-receptor-associated signalling complex, or
    the presynaptic release machinery. SYNGAP1, a brain-specific Ras
    GTPase-activating protein within the NMDA-receptor complex, is the
    paradigm: it normally restrains Ras-ERK signalling and thereby limits AMPA
    receptor insertion at the postsynaptic membrane. Presynaptic examples
    include STXBP1/Munc18-1, a regulator of SNARE-mediated neurotransmitter
    release. Reduced dosage of these proteins shifts excitatory synaptic
    strength and impairs activity-dependent plasticity, the cellular substrate
    of learning and memory.

- name: DPP6
  gene_term:
    preferred_term: DPP6
    term:
      id: hgnc:3010
      label: DPP6
  relationship_type: DISPUTED
  notes: >-
    Recorded as a disposition, not as a cause. MONDO asserts
    `intellectual disability, autosomal dominant 33` (MONDO:0014580) as
    a direct subclass of this entry's own term and defines it as any
    autosomal dominant non-syndromic intellectual disability caused by a
    mutation in DPP6. No `has_subtypes` row was created for
    MONDO:0014580, because ClinGen's Intellectual Disability and Autism
    Gene Curation Expert Panel classifies the DPP6 gene-disease
    relationship as Disputed and states that no valid evidence remains
    to support it. The panel re-examined the same 2013 microcephaly
    variants that the OMIM and MONDO concept rests on and did not score
    them. DPP6 is curated elsewhere in this knowledge base for an
    unrelated cardiac phenotype
    (`Paroxysmal_Familial_Ventricular_Fibrillation`); nothing here bears
    on that.
  evidence:
  - reference: CGGV:assertion_3d41cebe-5490-419d-882d-4f3c6856be07-2021-05-05T100000.000Z
    reference_title: "DPP6 / complex neurodevelopmental disorder (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      DPP6 | HGNC:3010 | complex neurodevelopmental disorder |
      MONDO:0100038 | AD | Disputed | SOP8 | Intellectual Disability
      and Autism Gene Curation Expert Panel
    explanation: >-
      The expert-panel classification itself: Disputed, not Definitive
      or Limited.
  - reference: CGGV:assertion_3d41cebe-5490-419d-882d-4f3c6856be07-2021-05-05T100000.000Z
    reference_title: "DPP6 / complex neurodevelopmental disorder (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Taken together, the available genetic evidence fails to support
      a role for heterozygous disruption of DPP6 in ID, autism or
      other neurodevelopmental disorders.
    explanation: >-
      The panel's summary judgement, which is the reason MONDO:0014580
      has no subtype row on this entry.
  - reference: CGGV:assertion_3d41cebe-5490-419d-882d-4f3c6856be07-2021-05-05T100000.000Z
    reference_title: "DPP6 / complex neurodevelopmental disorder (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Given the lack of evidence supporting their role in disease and

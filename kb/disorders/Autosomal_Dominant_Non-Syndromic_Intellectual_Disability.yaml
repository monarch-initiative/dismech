inheritance:
- name: Autosomal dominant, predominantly de novo
  description: >-
    AD-NSID is transmitted as an autosomal dominant trait at the level of the
    individual lesion - a single heterozygous loss-of-function allele is
    sufficient to cause disease - but affected individuals are almost always
    sporadic. Reduced reproductive fitness means the causal variant is usually
    de novo in the proband rather than inherited from an affected parent.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that SYNGAP1 disruption is a cause of autosomal
      dominant nonsyndromic mental retardation.
    explanation: >-
      First demonstration that de novo truncating variants in a single
      autosomal gene cause non-syndromic ID by an autosomal dominant
      mechanism.
  - reference: PMID:25356899
    reference_title: "De novo mutations in moderate or severe intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, no case was explained by inherited mutations."
    explanation: >-
      In a trio exome screen of moderate-to-severe ID, every solved case was
      accounted for by a de novo rather than an inherited variant, supporting
      the sporadic-dominant architecture.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Moreover, autosomal dominant genes have yet to be identified, mainly
      because mental retardation results in lower reproductive fitness, which
      in turn decreases the likelihood of identifying families that are
      amenable to linkage analysis.
    explanation: >-
      Explains why autosomal dominant non-syndromic ID genes could not be
      found by pedigree-based linkage and required a de novo, trio-sequencing
      approach.
  - reference: PMID:39528574
    reference_title: "Trio-whole exome sequencing reveals the importance of de novo variants in children with intellectual disability and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      95.4% (165/173) had no documented family history of epilepsy or DD/ID
    explanation: >-
      Quantifies how uninformative family history is in this class: a negative
      pedigree is the norm and does not argue against a dominant diagnosis.

prevalence:
- population: Worldwide (all-cause intellectual disability, the denominator class)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1037.0
  notes: >-
    Prevalence of intellectual disability from all causes, not of the autosomal
    dominant non-syndromic subset specifically. AD-NSID is a large but
    unquantified fraction of this total; because it is defined by a
    heterogeneous and still-expanding gene list, no direct population
    prevalence estimate exists.
  evidence:
  - reference: PMID:21236634
    reference_title: "Prevalence of intellectual disability: a meta-analysis of population-based studies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of intellectual disability across all 52 studies included
      in the meta-analysis was 10.37/1000 population.
    explanation: >-
      Provides the all-cause ID denominator; supports the order of magnitude
      but not an AD-NSID-specific rate.
- population: Live births, developmental disorders attributable to de novo mutations
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 320.0
  rate_low: 223.0
  rate_high: 469.0
  notes: >-
    Birth prevalence of de-novo-mutation-caused developmental disorders (1 in
    213 to 1 in 448 births, parental-age dependent). AD-NSID is the subset of
    this group that presents without recognised syndromic features, so this is
    an upper bound rather than a direct estimate.
  evidence:
  - reference: PMID:28135719
    reference_title: "Prevalence and architecture of de novo mutations in developmental disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We estimate that developmental disorders caused by DNMs have an average
      prevalence of 1 in 213 to 1 in 448 births, depending on parental age.
    explanation: >-
      Quantifies the birth prevalence of the de-novo-dominant developmental
      disorder class of which AD-NSID is the non-syndromic part.

pathophysiology:
- name: De Novo Heterozygous Variant in a Constraint-Intolerant Neurodevelopmental Gene
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a single new (de novo) protein-truncating or
    damaging missense variant arising in the parental germline and present
    heterozygously in the proband. Because such variants are not transmitted
    through families, this class of disease was undetectable by linkage and
    was only exposed by parent-offspring trio exome sequencing. The affected
    genes are drawn overwhelmingly from the minority of the genome under
    strong selective constraint against heterozygous protein-truncating
    variants, i.e. genes whose normal function requires two working copies.
    An emerging, mechanistically distinct minority arm of the same trigger is
    the NON-CODING de novo mutation: whole-genome sequencing of ID trios finds
    regulatory DNMs selectively enriched in fetal-brain-specific enhancers,
    including recurrently mutated enhancer clusters regulating nervous-system
    development genes. This arm is captured here as part of the trigger rather
    than as a separate node because the downstream consequence - dosage
    perturbation of a constraint-intolerant neurodevelopmental gene - is the
    same; only the lesion type differs. Evidence comes from small,
    mixed developmental-disorder cohorts rather than AD-NSID-specific series,
    so it is an emerging rather than established contributor for this class.
  role: trigger
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
  evidence:
  - reference: PMID:36854624
    reference_title: "Regulatory de novo mutations underlying intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that regulatory DNMs were selectively enriched in fetal
      brain-specific enhancers as compared with adult brain enhancers.
    explanation: >-
      Establishes the non-coding regulatory arm of the de novo trigger:
      enhancer DNMs are enriched specifically in fetal-brain enhancers,
      matching the critical-window logic modelled downstream.
  - reference: PMID:36854624
    reference_title: "Regulatory de novo mutations underlying intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified recurrently mutated enhancer clusters that regulate genes
      involved in nervous system development (CSMD1, OLFM1, and POU3F3).
    explanation: >-
      Names the recurrently mutated enhancer clusters and their
      nervous-system-development target genes, showing the regulatory arm
      converges on the same gene classes as the coding arm.
  - reference: PMID:36854624
    reference_title: "Regulatory de novo mutations underlying intellectual disability."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Using CRISPR-mediated mutation and editing of epigenomic marks, we show
      that DNMs at regulatory elements affect the expression of putative
      target genes.
    explanation: >-
      Functional confirmation that the regulatory lesions change target-gene
      expression. PARTIAL because the cohort is small and mixed
      developmental-disorder rather than AD-NSID-specific, so clinical
      penetrance for individual regulatory variants is not established.
  - reference: PMID:21076407
    reference_title: "A de novo paradigm for mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we used a family based exome sequencing approach to test this de
      novo mutation hypothesis in ten individuals with unexplained mental
      retardation. We identified and validated unique non-synonymous de novo
      mutations in nine genes.
    explanation: >-
      The founding trio-exome study establishing de novo point mutation as the
      causal mechanism in unexplained (non-syndromic) ID.
  - reference: PMID:21076407
    reference_title: "A de novo paradigm for mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with de novo copy number variation, de novo point mutations of
      large effect could explain the majority of all mental retardation cases
      in the population.
    explanation: >-
      States the central architectural claim - large-effect de novo lesions,
      not inherited variation, dominate the aetiology.
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After exclusion of copy-number variants, de-novo point mutations and
      small indels are associated with severe, sporadic non-syndromic
      intellectual disability, accounting for 45-55% of patients with high
      locus heterogeneity.
    explanation: >-
      Directly quantifies the contribution of de novo point mutations to
      severe sporadic NON-SYNDROMIC ID - the exact disease class curated here.
  - reference: PMID:26503795
    reference_title: "Genetic studies in intellectual disability and related disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic factors play a major part in intellectual disability (ID), but
      genetic studies have been complicated for a long time by the extreme
      clinical and genetic heterogeneity.
    explanation: >-
      Review statement of the extreme locus heterogeneity that defines this
      class and explains why it resisted pre-sequencing gene discovery.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Known dominant DD-associated genes are strongly enriched in the minority
      of genes that exhibit strong selective constraint on heterozygous PTVs
    explanation: >-
      Establishes that the target gene set is defined by intolerance to
      heterozygous protein-truncating variants, i.e. dosage sensitivity.
  downstream:
  - target: Haploinsufficiency of a Dosage-Sensitive Neurodevelopmental Gene
    causal_link_type: DIRECT
    description: >-
      A protein-truncating allele triggers nonsense-mediated decay or produces
      a non-functional protein, leaving a single functional copy.
    evidence:
    - reference: PMID:33057194
      reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This residual burden of protein-truncating DNMs is greatest in genes
        that are intolerant of PTVs in the general population
      explanation: >-
        Links the de novo protein-truncating lesion specifically to
        dosage-intolerant genes, i.e. to a haploinsufficiency outcome.

- name: Haploinsufficiency of a Dosage-Sensitive Neurodevelopmental Gene
  biological_scale: MOLECULAR
  description: >-
    Loss of one functional allele reduces gene product to roughly 50% of
    normal. For the genes implicated in AD-NSID this is below the threshold
    required for normal neurodevelopment, which is why they are among the most
    constraint-intolerant genes in the genome. Haploinsufficiency is the
    predominant - though not the only - mechanism: a growing minority of
    AD-NSID genes act instead through altered-function (dominant-negative or
    gain-of-function) missense alleles, and these two mechanisms are not
    interchangeable when interpreting a new variant.
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
  evidence:
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More participants in the case group had loss-of-function variants than
      in the control group (20/51 vs 2/20; p=0·022), suggesting their
      contribution to disease development.
    explanation: >-
      Demonstrates statistical excess of heterozygous loss-of-function alleles
      in non-syndromic ID cases versus controls.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This residual burden of protein-truncating DNMs is greatest in genes
      that are intolerant of PTVs in the general population
    explanation: >-
      Confirms the haploinsufficiency mechanism concentrates in
      constraint-intolerant genes and that many such disorders remain
      undiscovered.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequently, we expect that a greater proportion of the novel genes
      will act via altered-function mechanisms (e.g. dominant negative or
      gain-of-function).
    explanation: >-
      Qualifies the haploinsufficiency model: newly discovered dominant
      developmental-disorder genes increasingly act by altered function rather
      than pure dosage loss.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Second, mice that are heterozygous for null alleles of Syngap1 have
      impaired synaptic plasticity and learning, which suggests that the
      disruption of a single SYNGAP1 allele is sufficient to cause cognitive
      dysfunction in humans.
    explanation: >-
      Mouse heterozygote data establishing that a single-allele dose reduction
      is sufficient for the cognitive phenotype.
  downstream:
  - target: Disrupted Synaptic Transmission and Plasticity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      For the synaptic module of AD-NSID genes, reduced gene dosage directly
      perturbs postsynaptic signalling complexes and receptor trafficking.
  - target: Disrupted Chromatin and Transcriptional Regulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      For the chromatin/transcription module, reduced dosage of a
      chromatin-modifying or transcription-regulating factor dysregulates
      neurodevelopmental gene expression programmes.
  - target: Disrupted Neuronal Cytoskeletal Dynamics and Rho GTPase Signalling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      For the cytoskeletal module, reduced dosage of a cytoskeletal regulator
      or Rho GTPase pathway component impairs actin and microtubule dynamics
      in developing neurons.

- name: Disrupted Synaptic Transmission and Plasticity
  biological_scale: CELLULAR
  description: >-
    A large fraction of AD-NSID genes encode components of the excitatory
    postsynaptic density, the NMDA-receptor-associated signalling complex, or
    the presynaptic release machinery. SYNGAP1, a brain-specific Ras
    GTPase-activating protein within the NMDA-receptor complex, is the
    paradigm: it normally restrains Ras-ERK signalling and thereby limits AMPA
    receptor insertion at the postsynaptic membrane. Presynaptic examples
    include STXBP1/Munc18-1, a regulator of SNARE-mediated neurotransmitter
    release. Reduced dosage of these proteins shifts excitatory synaptic
    strength and impairs activity-dependent plasticity, the cellular substrate
    of learning and memory.
  cell_types:
  - preferred_term: glutamatergic (excitatory) neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  - preferred_term: hippocampal pyramidal neuron
    term:
      id: CL:0002608
      label: hippocampal neuron
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: ABNORMAL
  - preferred_term: regulation of synaptic plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
    modifier: DECREASED
  - preferred_term: regulation of postsynaptic AMPA receptor levels
    term:
      id: GO:0099072
      label: regulation of postsynaptic membrane neurotransmitter receptor levels
    modifier: ABNORMAL
  - preferred_term: learning or memory
    term:
      id: GO:0007611
      label: learning or memory
    modifier: DECREASED
  molecular_functions:
  - preferred_term: Ras GTPase-activating protein activity (SYNGAP1)
    term:
      id: GO:0005096
      label: GTPase activator activity
    modifier: DECREASED
  evidence:
  - reference: PMID:23141534
    reference_title: "Pathogenic SYNGAP1 mutations impair cognitive development by disrupting maturation of dendritic spine synapses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations that cause intellectual disability (ID) and autism spectrum
      disorder (ASD) are commonly found in genes that encode for synaptic
      proteins.
    explanation: >-
      States the synaptic-gene convergence that defines this pathophysiology
      module.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced the autosomal gene SYNGAP1, which encodes a ras
      GTPase-activating protein that is critical for cognition and synapse
      function, in 94 patients with nonsyndromic mental retardation.
    explanation: >-
      Identifies the molecular function (Ras GTPase-activating protein) whose
      loss underlies the paradigmatic AD-NSID gene.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SYNGAP1, a GTPase-activating protein that is selectively expressed in
      the brain and is a component of the NMDA-receptor complex, acts
      downstream of the receptor, blocking the insertion of the AMPA receptor
      at the postsynaptic membrane
    explanation: >-
      Describes the specific postsynaptic signalling step (restraint of AMPA
      receptor insertion via inhibition of RAS-ERK) that haploinsufficiency
      de-represses.
  - reference: PMID:19557857
    reference_title: "De novo STXBP1 mutations in mental retardation and nonsyndromic epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced genes coding for components of the SNARE complex (STX1A,
      VAMP2, SNAP25) and their regulatory proteins (STXBP1/Munc18-1, SYT1),
      which are essential for neurotransmission, in 95 patients with
      idiopathic mental retardation.
    explanation: >-
      Extends the synaptic module to the presynaptic release machinery,
      identifying STXBP1 as an AD-NSID gene.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The classic observation that various forms of mental retardation are
      associated with abnormalities in the morphology of dendritic spines
      suggests that disruption of pathways involved in synaptic plasticity may
      be a common mechanism of this disorder.
    explanation: >-
      States the long-standing convergence of ID pathophysiology on dendritic
      spine morphology and synaptic plasticity.
  downstream:
  - target: Premature Dendritic Spine Maturation
    causal_link_type: DIRECT
    description: >-
      In the SYNGAP1 model, de-repressed excitatory synaptic signalling
      accelerates spine maturation and raises circuit excitability.
    evidence:
    - reference: PMID:23141534
      reference_title: "Pathogenic SYNGAP1 mutations impair cognitive development by disrupting maturation of dendritic spine synapses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the SYNGAP1 mouse model of ID/ASD, we found that dendritic spine
        synapses develop prematurely during the early postnatal period.
        Premature spine maturation dramatically enhanced excitability in the
        developing hippocampus, which corresponded with the emergence of
        behavioral abnormalities.
      explanation: >-
        Demonstrates the causal step from synaptic-gene haploinsufficiency to
        accelerated spine maturation and hyperexcitability.

- name: Disrupted Chromatin and Transcriptional Regulation
  biological_scale: MOLECULAR
  description: >-
    The second major functional module among AD-NSID genes comprises
    chromatin modifiers, chromatin-remodelling complex subunits, and
    sequence-specific transcriptional regulators (e.g. ARID1B, CHD2, GATAD2B,
    MBD5, TCF4, MED13L, ZBTB18). Halving the dose of these factors
    dysregulates the coordinated gene-expression programmes that drive
    neuronal differentiation, migration, and synaptogenesis. Systematic
    phenomics analysis shows chromatin-related genes form one of the
    biologically coherent modules into which ID genes decompose.
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26748517
    reference_title: "Systematic Phenomics Analysis Deconvolutes Genes Mutated in Intellectual Disability into Biologically Coherent Modules."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Systematic identification of highly enriched functional themes and
      phenotypes revealed typical phenotype combinations characterizing
      process-defined groups of ID disorders, such as chromatin-related
      disorders and deficiencies in DNA repair.
    explanation: >-
      Establishes chromatin regulation as a distinct, statistically coherent
      functional module among ID-associated genes.
  - reference: PMID:26748517
    reference_title: "Systematic Phenomics Analysis Deconvolutes Genes Mutated in Intellectual Disability into Biologically Coherent Modules."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      we show that ID-AGs are substantially enriched with co-expression,
      protein-protein interactions, and specific biological functions.
    explanation: >-
      Demonstrates that the genetically heterogeneous ID gene set is
      functionally convergent rather than random.
  - reference: PMID:25356899
    reference_title: "De novo mutations in moderate or severe intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 12 likely pathogenic DNMs were identified in genes previously
      associated with ID (ARID1B, CHD2, FOXG1, GABRB3, GATAD2B, GRIN2B, MBD5,
      MED13L, SETBP1, TBR1, TCF4, WDR45), resulting in a diagnostic yield of
      ∼29%.
    explanation: >-
      The recovered gene list is dominated by chromatin and transcriptional
      regulators, illustrating this module in a real ID cohort.
  - reference: PMID:38215144
    reference_title: "A de novo variant in ZBTB18 gene caused autosomal dominant non-syndromic intellectual disability 22 syndrome: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant non-syndromic intellectual disability 22 is a rare
      genetic disorder caused by the ZBTB18 gene.
    explanation: >-
      A named MRD-series entity (MRD22) caused by haploinsufficiency of a zinc
      finger transcriptional repressor.
  - reference: PMID:36743289
    reference_title: "Dendritic spine and synapse pathology in chromatin modifier-associated autism spectrum disorders and intellectual disability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Emerging evidence highlights the critical status of these chromatin
      remodeling molecules in dendritic spine morphogenesis and synaptic
      functions.
    explanation: >-
      Links the chromatin module to the same dendritic-spine and synaptic
      endpoint as the synaptic module, supporting the convergence of the two
      arms rather than treating them as parallel unrelated pathways.
  downstream:
  - target: Impaired Cortical Circuit Formation During Critical Developmental Windows
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated transcriptional programmes alter neuronal differentiation
      and connectivity during cortical development.
  - target: Premature Dendritic Spine Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chromatin modifiers such as ARID1B, KANSL1, and WDR5 converge on
      dendritic spine morphogenesis and synaptic function, so the chromatin
      arm reaches the same synaptic endpoint as the synaptic arm.
    evidence:
    - reference: PMID:36743289
      reference_title: "Dendritic spine and synapse pathology in chromatin modifier-associated autism spectrum disorders and intellectual disability."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Emerging evidence highlights the critical status of these chromatin
        remodeling molecules in dendritic spine morphogenesis and synaptic
        functions.
      explanation: >-
        Supports the causal edge from the chromatin module to the dendritic
        spine/synaptic endpoint.

- name: Disrupted Neuronal Cytoskeletal Dynamics and Rho GTPase Signalling
  biological_scale: CELLULAR
  description: >-
    The third functional module comprises regulators of the neuronal actin and
    microtubule cytoskeleton, whose control converges on Rho GTPase
    transduction (e.g. TRIO, and the wider set of Rho-pathway ID genes).
    Cytoskeletal disruption acts earlier in neurodevelopment than the synaptic
    module: it impairs neuronal migration and neuritogenesis as well as
    synaptic plasticity, so the same molecular lesion propagates upward
    through cell processes, circuits, and finally cognition. Bibliomic
    analysis of the >1,000 known ID genes shows this convergence onto a small

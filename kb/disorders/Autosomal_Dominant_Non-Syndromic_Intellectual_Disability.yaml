    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental delay was the first manifestation of SYNGAP1-related
      encephalopathy; intellectual disability became progressively obvious and
      was associated with autistic behaviours in eight patients.

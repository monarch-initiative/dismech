        label: Autosomal dominant inheritance
  description: >-
    MONDO defines this concept as any autosomal dominant non-syndromic
    intellectual disability in which the cause of the disease is a
    mutation in the HIVEP2 gene. HIVEP2 encodes a large transcription
    factor regulating neurodevelopmental pathways, placing the subtype
    in this entry's chromatin and transcription module. No ClinGen
    Gene-Disease Validity curation was found for HIVEP2 in the
    gene-validity release read for this pass, searched by gene symbol
    across the full download. The subtype therefore rests on
    primary-literature series alone. Those series report dysmorphic
    features alongside the developmental delay, which is the same
    non-syndromic boundary problem this entry already documents for
    SYNGAP1, TRIO, MED13L and KMT5B.
  evidence:

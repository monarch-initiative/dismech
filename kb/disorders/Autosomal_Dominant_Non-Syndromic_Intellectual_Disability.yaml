    around a single recurrent p.Arg170Trp missense variant, and the reported mechanism is functional impairment
    of the AP-2 complex rather than reduced gene dosage, so it follows the altered-activity and endocytosis
    branch. Transferrin uptake was tested in human cells and cultured mouse astrocytes; these experiments
    do not directly measure neuronal synaptic-vesicle recycling. It pairs mechanistically with MRD56 (CLTC),
    which encodes the clathrin coat that AP-2 recruits. ClinGen's Epilepsy Gene Curation Expert Panel
    classifies the relationship as Definitive, against `complex neurodevelopmental
    disorder`. This MONDO class is already cited as a differential diagnosis on `Cardiofacioneurodevelopmental_Syndrome`,
    which models the AP-2 assembly chaperone CCDC32; that record describes the differential, while this
    row places the concept in the MRD series, so the two are complementary rather than duplicative. The
    panel leaves the gene-wide mechanism unresolved; the functional claim here is limited to the experimentally
    tested recurrent allele.

diagnosis:
- name: Molecular Diagnosis by Exome or Genome Sequencing
  description: Exome or genome sequencing is used early in the evaluation of unexplained developmental delay or intellectual disability. The 2021 ACMG guideline recommends it as a first- or second-tier test, guided by clinical context. Parental samples improve interpretation of de novo occurrence and segregation, but testing the child alone or with one parent remains useful when a trio is unavailable. A diagnosis requires a pathogenic or likely pathogenic result consistent with the gene mechanism and phenotype; de novo status or a variant of uncertain significance alone is insufficient. Copy-number sensitivity depends on the platform and analysis, and chromosomal microarray or other complementary testing may still be needed.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:31182824
    reference_title: 'Meta-analysis and multidisciplinary consensus statement: exome sequencing is a first-tier clinical diagnostic test for individuals with neurodevelopmental disorders.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Yield of ES was 36% overall, 31% for isolated NDD, and 53% for the NDD plus associated conditions.
    explanation: Meta-analysis of broader neurodevelopmental cohorts, including causes outside AD-NSID. The isolated-NDD yield is not a yield for confirmed autosomal dominant disease.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:31182824
    reference_title: 'Meta-analysis and multidisciplinary consensus statement: exome sequencing is a first-tier clinical diagnostic test for individuals with neurodevelopmental disorders.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our review demonstrates that ES consistently outperforms CMA for evaluation of unexplained NDDs. We propose a diagnostic algorithm placing ES at the beginning of the evaluation of unexplained NDDs.
    explanation: The 2019 consensus supports early exome sequencing; it does not establish that chromosomal microarray is unnecessary in every workflow.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: url:https://www.nature.com/articles/s41436-021-01242-6
    reference_title: 'Exome and genome sequencing for pediatric patients with congenital anomalies or intellectual disability: an evidence-based clinical guideline of the American College of Medical Genetics and Genomics (ACMG) | Genetics in Medicine'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Best practice includes familial comparators (“trio”) if available
    explanation: The same guideline paragraph explicitly allows effective proband-only or duo analysis with somewhat lower yield; trio design is preferred when available, not mandatory.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Exclusion of Recognised Syndromic and Metabolic Causes
  description: >-
    Clinical history, developmental assessment and examination guide the search for a recognizable syndrome
    or alternative cause. A non-syndromic presentation can change with age or deeper phenotyping. Tests
    for repeat expansions, methylation abnormalities, metabolic disease or structural brain findings should
    follow clinical context and assay limitations; the historical workup of a discovery cohort is not
    a universal modern prerequisite.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mental retardation was unexplained in these patients despite standard
      investigations, including karyotyping, subtelomeric fluorescence in situ
      hybridization analysis, or comparative genomic hybridization targeting
      regions associated with known syndromes, molecular testing for the
      common expansion mutation in FMR1, and computed tomography or magnetic
      resonance imaging of the brain.
    explanation: >-
      Describes enrollment investigations in the 2009 discovery cohort, rather than prescribing the same
      workup for every current patient.
    directness: INDIRECT
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were examined by at least one experienced clinical
      geneticist, who ruled out the presence of specific dysmorphic features.
    explanation: >-
      Expert dysmorphology assessment is the clinical step that assigns a case
      to the non-syndromic category.

treatments:
- name: Genetic Counselling and Recurrence-Risk Assessment
  description: >-
    Genetic counseling uses the molecular result, parental testing and phenotype to assess recurrence.
    Apparently de novo variants can reflect parental somatic or germline mosaicism. A negative blood test
    does not exclude germline mosaicism, and the blood variant fraction is not an individual gamete-based
    recurrence probability. The broader genomic-disorder models cited here do not provide one recurrence
    rate for all AD-NSID.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25087610
    reference_title: "Parental somatic mosaicism is underrecognized and influences recurrence risk of genomic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that somatic mosaicism for transmitted mutations among
      parents of children with simplex genetic disease is more common than
      currently appreciated.
    explanation: >-
      Establishes that apparently de novo variants in simplex cases can arise
      from underdetected parental mosaicism, the basis for a non-zero
      recurrence-risk counselling message.
  - reference: PMID:25087610
    reference_title: "Parental somatic mosaicism is underrecognized and influences recurrence risk of genomic disorders."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Integrated probabilistic modeling of gametogenesis developed in response
      to our observations predicts that mutations in parental blood increase
      recurrence risk substantially more than parental mutations confined to
      the germline.
    explanation: >-
      A probabilistic model of genomic-disorder recurrence, not an individualized risk rule inferred from
      blood mosaicism.
    directness: INDIRECT
  - reference: PMID:34697084
    reference_title: "Somatic mosaicism detected by genome-wide sequencing in 500 parent-child trios with suspected genetic disease: clinical and genetic counseling implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present 12 cases of apparent mosaicism identified in the CAUSES
      cohort: nine cases of parental mosaicism for a disease-causing variant
      found in a child and three cases of mosaicism in the proband for a de
      novo variant.
    explanation: >-
      Mosaicism found in 500 trios referred for suspected genetic disease, not an unselected population
      or an AD-NSID-specific frequency.
  - reference: PMID:34697084
    reference_title: "Somatic mosaicism detected by genome-wide sequencing in 500 parent-child trios with suspected genetic disease: clinical and genetic counseling implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In six of these cases, there was no evidence of mosaicism on Sanger
      sequencing-the variant was not detected on Sanger sequencing in three
      cases, and it appeared to be heterozygous in three others.
    explanation: >-
      Sanger sequencing did not identify mosaicism in six of these twelve selected cases. This is not
      an estimate of test sensitivity for all mosaic variants.

- name: Early Intervention, Rehabilitation, and Special Education
  description: >-
    Management includes individualized developmental, educational and rehabilitation support. Needs and
    services vary by age, function and molecular diagnosis. The cited evidence does not establish a universal
    treatment deadline or a single disease-modifying treatment status across all gene-associated disorders.
  treatment_term:
    preferred_term: early intervention and special education
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:38215144
    reference_title: "A de novo variant in ZBTB18 gene caused autosomal dominant non-syndromic intellectual disability 22 syndrome: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "INTERVENTIONS: Rehabilitation training."
    explanation: >-
      Rehabilitation was reported in one ZBTB18 case; treatment use alone does not demonstrate efficacy
      or absence of other therapeutic options.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK547654/?report=reader
    reference_title: Intellectual Disability - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: Educational support is a crucial component of the management of intellectual disability.
    explanation: General intellectual-disability care guidance supports educational services tailored to individual needs; it is not evidence of molecular correction or an AD-NSID-specific treatment effect.
- name: Speech and Language Therapy
  description: >-
    Communication support is tailored to language and adaptive needs. Severe language impairment in SYNGAP1
    motivates assessment and intervention, but the discovery series does not evaluate speech-therapy efficacy.
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disruption of SYNGAP1 appears to be associated with a homogeneous
      clinical phenotype that is characterized by moderate-to-severe mental
      retardation accompanied by severe language impairment.
    explanation: >-
      Establishes the language impairment that this therapy targets; the
      citation supports the indication, not the efficacy of the intervention.

    directness: INDIRECT
- name: Physical and Occupational Therapy
  description: >-
    Motor and adaptive support is tailored to hypotonia, delayed walking and gait difficulties when present.
    The cited SYNGAP1 phenotype series identifies treatment needs but does not establish the efficacy
    of physical or occupational therapy.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  - preferred_term: Delayed ability to walk
    term:
      id: HP:0031936
      label: Delayed ability to walk
  evidence:
  - reference: PMID:26989088
    reference_title: "Genetic and neurodevelopmental spectrum of SYNGAP1-associated intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypotonia and unstable gait were frequent associated neurological
      features.
    explanation: >-
      Documents the motor impairments that motivate physiotherapy; supports
      the indication rather than the efficacy.

    directness: INDIRECT
- name: Antiseizure Pharmacotherapy for Comorbid Epilepsy
  description: >-
    When epilepsy is present, standard antiseizure medication is used.
    Response is variable and gene-dependent: seizures were well controlled by
    topiramate or valproate in the original SYNGAP1 series, whereas roughly
    half the patients in a larger SYNGAP1 cohort were pharmacoresistant. There
    is a mechanistic rationale for AMPA-directed agents in SYNGAP1
    haploinsufficiency, but it is a hypothesis generated from mouse work and
    small case observations, not a validated precision-therapy indication.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  target_mechanisms:
  - target: Cortical Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      The authors proposed reduced AMPA-associated excitation as one rationale for observed seizure responses.
      This is not a complete account of either drug's action and does not establish precision efficacy
      or absence of cognitive benefit.
    evidence:
    - reference: PMID:19196676
      reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Indeed, topiramate directly inhibits AMPA-receptor activity, whereas
        valproate reduces the level of GluR1 AMPA-receptor subunit at
        hippocampal synapses and therefore indirectly reduces AMPA-receptor
        activity.
      explanation: >-
        Mechanistic rationale for the drug acting on the hyperexcitability
        node; authors' interpretation rather than a controlled trial.
      quote_role: BACKGROUND
      directness: INDIRECT
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 had brief, generalized tonic–clonic seizures and was
      seizure-free while taking topiramate, whereas Patient 2 had some
      myoclonic and absence seizures, which were well controlled with
      valproate.
    explanation: >-
      Documents effective seizure control with standard antiseizure medication
      in molecularly confirmed AD-NSID.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Indeed, topiramate directly inhibits AMPA-receptor activity, whereas
      valproate reduces the level of GluR1 AMPA-receptor subunit at
      hippocampal synapses and therefore indirectly reduces AMPA-receptor
      activity.
    explanation: >-
      Gives the mechanistic rationale linking drug choice to the
      AMPA-receptor-mediated hyperexcitability node; this is authors'
      interpretation, not a controlled comparison.
    quote_role: BACKGROUND
    directness: INDIRECT
  - reference: PMID:26989088
    reference_title: "Genetic and neurodevelopmental spectrum of SYNGAP1-associated intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were pharmacoresistant in half of the patients."
    explanation: >-
      The larger series reports pharmacoresistance in half of patients. The remaining patients cannot
      automatically be counted as seizure-free, and this is not a category-wide response rate.

- name: Topiramate for Associated Epilepsy
  description: Seizure freedom in one reported SYNGAP1 patient; an uncontrolled observation, not comparative efficacy.
  treatment_term:

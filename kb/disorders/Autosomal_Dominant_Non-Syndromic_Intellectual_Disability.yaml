  evidence:
  - reference: PMID:19196676
    reference_title: Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patient 1 had brief, generalized tonic–clonic seizures and was seizure-free while taking topiramate
    explanation: Seizure freedom in one reported SYNGAP1 patient; an uncontrolled observation, not comparative efficacy.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

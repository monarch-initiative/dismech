        label: Autosomal dominant inheritance
  description: >-
    MONDO carries no textual definition for this class; it asserts the class as a direct subclass of this
    entry's own term, MONDO:0015802, and records TAF4 as its causal gene by RO:0004003. It is the highest-numbered
    member of the series MONDO files under this entry. TAF4 is a subunit of the TFIID general transcription
    factor complex, so the subtype belongs to this entry's chromatin and transcription module and shares
    features with the other TAF-opathies. The defining cohort of eight individuals reports facial dysmorphisms
    alongside the intellectual disability and names the entity `TAF4-related NDD`, not a non-syndromic
    intellectual disability. No ClinGen Gene-Disease Validity curation was found for TAF4 in the gene-validity
    release read for this pass, searched by gene symbol across the full download. Seven of eight individuals
    had ID; one improved to normal cognitive performance. Loss of function was predicted from variant
    position rather than directly demonstrated for every allele, and
    mild facial findings did not define a recognizable gestalt.
  evidence:
  - reference: PMID:35904126
    reference_title: "De novo putative loss-of-function variants in TAF4 are associated with a neuro-developmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We here present a cohort of eight individuals, each carrying de
      novo putative loss-of-function (pLoF) variants in TAF4 and
      expressing phenotypes consistent with a neuro-developmental
      disorder (NDD).
    explanation: >-

    snippet: >-
      Here, we report the identification of a distinct syndrome due to
      de novo or inherited heterozygous mutations in Tousled-like
      kinase 2 (TLK2) in 38 unrelated individuals and two affected
      mothers
    explanation: >-
      The defining cohort, and the source of the observation that the
      authors describe a distinct syndrome rather than isolated
      cognitive impairment.
  - reference: PMID:29861108
    reference_title: "De Novo and Inherited Loss-of-Function Variants in TLK2: Clinical and Genotype-Phenotype Evaluation of a Distinct Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

- name: TRIO
  gene_term:
    preferred_term: TRIO
    term:
      id: hgnc:12303
      label: TRIO
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Illustrates the cytoskeletal/Rho GTPase module: TRIO is a Dbl-family
    guanine nucleotide exchange factor that activates Rac1 and controls actin
    dynamics in developing neurons. Included here with two explicit caveats
    that make it instructive rather than clean. First, the best-characterised
    TRIO series reports microcephaly and dysmorphism alongside the ID, so this
    gene-disease pair sits on the syndromic side of an unstable boundary.
    Second, that series includes an autosomal dominant frameshift that
    SEGREGATED through a family as well as de novo missense variants,
    demonstrating that the class is not exclusively de novo. Both caveats
    argue against treating "autosomal dominant" and "de novo" as synonyms.
    A third caveat is that the head-size feature is not directionally fixed:
    TRIO-related disease includes both MRD44 with microcephaly and MRD63 with
    macrocephaly. The dedicated TRIO-Related Neurodevelopmental Disorder entry
    now models that domain-resolved, RAC1-direction-dependent split and is the
    canonical home for TRIO variants and mechanisms. TRIO is retained here only
    as a boundary exemplar, not as a clean non-syndromic gene; the cephalic and
    dysmorphic findings illustrate why umbrella AD-NSID membership is partial
    (see GitHub issue 6041).
  evidence:
  - reference: PMID:27418539
    reference_title: "Mutations specific to the Rac-GEF domain of TRIO cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trio is a Dbl family guanine nucleotide exchange factor (GEF) and a
      major regulator of neuronal development, controlling actin cytoskeleton
      dynamics by activating the GTPase Rac1.
    explanation: >-
      Places TRIO in the cytoskeletal/Rho GTPase pathophysiology module.
  - reference: PMID:27418539
    reference_title: "Mutations specific to the Rac-GEF domain of TRIO cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a frameshift deletion in TRIO that segregated autosomal
      dominantly. By scrutinising data from DDD, we further identified three
      unrelated children with a similar phenotype who harboured de novo
      missense mutations in TRIO.
    explanation: >-
      Documents both an inherited autosomal dominant lesion and de novo
      lesions in the same gene, supporting the caveat that AD-NSID is not
      exclusively a de novo class.
  - reference: PMID:27418539
    reference_title: "Mutations specific to the Rac-GEF domain of TRIO cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, we identify pathogenic de novo missense mutations in TRIO
      associated with the same consistent phenotype, intellectual disability,
      microcephaly and dysmorphism with striking digital features.
    explanation: >-
      Only PARTIAL support for inclusion in a NON-syndromic class: the
      reported phenotype includes microcephaly and dysmorphism, so this
      gene-disease pair is arguably syndromic - the boundary problem this
      entry documents.

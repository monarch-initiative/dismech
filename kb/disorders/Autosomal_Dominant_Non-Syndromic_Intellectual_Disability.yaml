- category: Neurologic
  name: Seizures
  description: >-
    Epilepsy is a common comorbidity in several AD-NSID entities, ranging from
    well-controlled generalised seizures to a pharmacoresistant developmental
    and epileptic encephalopathy. Its presence is one of the features that
    most often triggers reclassification of a nominally non-syndromic
    gene-disease pair as a recognisable syndrome; conversely, some MRD-series
    entities (e.g. ZBTB18/MRD22) present without epilepsy.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the patients were mildly epileptic."
    explanation: >-

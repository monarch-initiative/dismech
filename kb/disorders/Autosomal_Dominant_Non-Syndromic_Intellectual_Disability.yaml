    Gene Curation Expert Panel classifies the DPP6 gene-disease
    relationship as Disputed and states that no valid evidence remains
    to support it. The panel re-examined the same 2013 microcephaly
    variants that the OMIM and MONDO concept rests on and did not score
    them. DPP6 is curated elsewhere in this knowledge base for an
    unrelated cardiac phenotype
    (`Paroxysmal_Familial_Ventricular_Fibrillation`); nothing here bears
    on that.

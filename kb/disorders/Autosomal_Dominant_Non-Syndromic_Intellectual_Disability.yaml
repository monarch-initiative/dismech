  genes:
  - preferred_term: ZBTB18
    term:
      id: hgnc:13030
      label: ZBTB18
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO defines this concept as any autosomal dominant non-syndromic intellectual disability in which
    the cause of the disease is a mutation in the ZBTB18 gene. ZBTB18 is already curated in this entry's
    `genetic:` block with its own primary-literature evidence and is assigned there to the chromatin and
    transcription module; this row adds the MONDO subtype identity that the gene record did not carry.
    ClinGen classifies the gene-disease relationship as Definitive, against `complex neurodevelopmental
    disorder`. Truncating alleles occur in the last exon and are not expected to undergo nonsense-mediated
    decay; selected missense alleles alter transcriptional repression in different ways.
  evidence:
  - reference: CGGV:assertion_d8ea518c-64da-4d4f-8551-66a005307e94-2026-05-22T100000.000Z
    reference_title: "ZBTB18 / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ZBTB18 | HGNC:13030 | complex neurodevelopmental disorder |
      MONDO:0100038 | AD | Definitive | SOP12 | Intellectual
      Disability and Autism Gene Curation Expert Panel
    explanation: >-
      ClinGen's expert-panel gene-disease validity classification for
      this gene. The row also records which disease concept the panel
      curated against, which for this series is generally not the
      MRD-series term the subtype binds; the
      adnsid_clingen_disease_concept discussion on this entry collects
      that observation across all the subtypes.

  - reference: CGGV:assertion_d8ea518c-64da-4d4f-8551-66a005307e94-2026-05-22T100000.000Z
    reference_title: ZBTB18 / complex neurodevelopmental disorder (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Nonsense and frameshift variants lead to a premature termination codon in the last (second) exon and are not expected to result in nonsense-mediated decay.
    explanation: 'Expert synthesis: predicted decay escape means truncation must not be equated with transcript loss; altered transcriptional repression remains variant-dependent.'
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT

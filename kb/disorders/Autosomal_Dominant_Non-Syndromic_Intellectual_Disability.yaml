- name: Impaired Cortical Circuit Formation During Critical Developmental Windows
  biological_scale: TISSUE
  description: >-
    The convergent consequence of both the synaptic and chromatin modules is
    maldevelopment of cortical and hippocampal circuits during time-limited
    windows of activity-dependent refinement. The window property is
    mechanistically important and therapeutically sobering: in the SYNGAP1
    model, introducing the mutation after the critical window has closed has
    little effect, and correcting it in adulthood does not rescue cognition.
    This is the principal reason AD-NSID is a static (non-progressive)
    developmental condition rather than a neurodegenerative one, and it sets a
    hard early-intervention constraint on any future molecular therapy.

    explanation: >-
      ClinGen's expert-panel gene-disease validity classification for
      this gene. The row also records which disease concept the panel
      curated against, which for this series is generally not the
      MRD-series term the subtype binds; the
      adnsid_clingen_disease_concept discussion on this entry collects
      that observation across all the subtypes.
  - reference: PMID:38378692
    reference_title: "The spectrum of neurological presentation in individuals affected by TBL1XR1 gene defects."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TBL1XR1 encodes a F-box-like/WD40 repeat-containing protein that
      plays a role in transcription mediated by nuclear receptors and
      is a known genetic cause of neurodevelopmental disease of
      childhood
    explanation: >-
      States the gene's molecular role and its established status as a
      neurodevelopmental disease gene. Quoted from the survey study's
      background rather than from its own results.
  - reference: PMID:38378692
    reference_title: "The spectrum of neurological presentation in individuals affected by TBL1XR1 gene defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Language appeared most significantly affected with only a
      minority of the cohort achieving more advanced milestones in
      this domain.
    explanation: >-
      The survey result behind the statement that language is the most
      severely affected domain.
  - reference: PMID:38378692
    reference_title: "The spectrum of neurological presentation in individuals affected by TBL1XR1 gene defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TBL1XR1-related disorder encompasses a spectrum of clinical
      presentations, marked by early developmental delay ranging in
      severity, with a subset of patients experiencing developmental
      regression in later childhood.
    explanation: >-
      Source for the later-childhood regression noted above, which is
      the basis for the caveat about a static course.

- name: MRD43
  display_name: Intellectual disability, autosomal dominant 43 (HIVEP2-related)
  subtype_term:
    preferred_term: HIVEP2-related autosomal dominant intellectual disability
    term:
      id: MONDO:0014858
      label: intellectual disability, autosomal dominant 43
  genes:
  - preferred_term: HIVEP2
    term:
      id: hgnc:4921
      label: HIVEP2
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO defines this concept as any autosomal dominant non-syndromic
    intellectual disability in which the cause of the disease is a
    mutation in the HIVEP2 gene. HIVEP2 encodes a large transcription
    factor regulating neurodevelopmental pathways, placing the subtype
    in this entry's chromatin and transcription module. No ClinGen
    Gene-Disease Validity curation was found for HIVEP2 in the
    gene-validity release read for this pass, searched by gene symbol
    across the full download. The subtype therefore rests on
    primary-literature series alone. Those series report dysmorphic
    features alongside the developmental delay, which is the same
    non-syndromic boundary problem this entry already documents for
    SYNGAP1, TRIO, MED13L and KMT5B.
  evidence:
  - reference: PMID:27003583
    reference_title: "Mutations in HIVEP2 are associated with developmental delay, intellectual disability, and dysmorphic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe six patients with developmental delay,
      intellectual disability, and dysmorphic features with de novo
      likely gene-damaging variants in HIVEP2 identified by
      whole-exome sequencing (WES).
    explanation: >-
      Six further probands with de novo likely gene-damaging HIVEP2
      variants, and the source of the dysmorphism caveat recorded
      above.
  - reference: PMID:27003583
    reference_title: "Mutations in HIVEP2 are associated with developmental delay, intellectual disability, and dysmorphic features."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HIVEP2 encodes a large transcription factor that regulates
      various neurodevelopmental pathways.
    explanation: >-
      Places HIVEP2 in this entry's chromatin and transcriptional
      regulation module.

- name: MRD45
  display_name: Intellectual disability, autosomal dominant 45 (CIC-related)
  subtype_term:
    preferred_term: CIC-related autosomal dominant intellectual disability
    term:
      id: MONDO:0030910
      label: intellectual disability, autosomal dominant 45
  genes:
  - preferred_term: CIC
    term:
      id: hgnc:14214
      label: CIC
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO carries no textual definition for this class; it asserts the
    class as a direct subclass of this entry's own term, MONDO:0015802,
    and records CIC as its causal gene by RO:0004003. CIC encodes the
    transcriptional repressor capicua, which forms a repressor complex
    with ataxin 1, so the subtype is a chromatin and transcription
    module lesion. ClinGen classifies the relationship as Definitive,
    against `complex neurodevelopmental disorder`. The human probands
    were ascertained by reverse phenotyping from conditional mouse
    mutants rather than from a human non-syndromic intellectual
    disability cohort, which is worth recording because the
    ascertainment route shapes which features get reported.
  evidence:
  - reference: CGGV:assertion_a0f9a222-8872-4054-b767-25f8fb4e404a-2023-01-18T110000.000Z
    reference_title: "CIC / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CIC | HGNC:14214 | complex neurodevelopmental disorder |
      MONDO:0100038 | AD | Definitive | SOP11 | Intellectual
      Disability and Autism Gene Curation Expert Panel
    explanation: >-
      ClinGen's expert-panel gene-disease validity classification for
      this gene. The row also records which disease concept the panel
      curated against, which for this series is generally not the
      MRD-series term the subtype binds; the
      adnsid_clingen_disease_concept discussion on this entry collects
      that observation across all the subtypes.
  - reference: PMID:28288114
    reference_title: "Disruption of the ATXN1-CIC complex causes a spectrum of neurobehavioral phenotypes in mice and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Informed by these neurobehavioral features in mouse mutants, we
      identified five individuals with de novo heterozygous truncating
      mutations in CIC who share similar clinical features, including
      intellectual disability, attention deficit/hyperactivity
      disorder (ADHD), and autism spectrum disorder.
    explanation: >-
      The human arm of the study establishing de novo truncating CIC
      variants as a cause of intellectual disability, and the source
      of the reverse-phenotyping ascertainment noted above.

- name: MRD46
  display_name: Intellectual disability, autosomal dominant 46 (KCNQ5-related)
  subtype_term:
    preferred_term: KCNQ5-related autosomal dominant intellectual disability
    term:
      id: MONDO:0030911
      label: intellectual disability, autosomal dominant 46
  genes:
  - preferred_term: KCNQ5
    term:
      id: hgnc:6299
      label: KCNQ5
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO carries no textual definition for this class; it asserts the
    class as a direct subclass of this entry's own term, MONDO:0015802,
    and records KCNQ5 as its causal gene by RO:0004003. KCNQ5 is widely
    expressed in the brain and generates the neuronal M-type potassium
    current. This subtype does not follow the haploinsufficiency
    architecture that this entry's root pathophysiology node models:
    both loss-of-function and gain-of-function variants are pathogenic,
    so its natural attachment point is the cortical hyperexcitability
    node rather than a gene-dosage node. No ClinGen Gene-Disease
    Validity curation was found for KCNQ5 in the gene-validity release
    read for this pass, searched by gene symbol across the full
    download.
  evidence:
  - reference: PMID:28669405
    reference_title: "Loss-of-Function and Gain-of-Function Mutations in KCNQ5 Cause Intellectual Disability or Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified de novo heterozygous missense
      mutations in four probands with intellectual disability,
      abnormal neurological findings, and treatment-resistant epilepsy
      (in two of four).
    explanation: >-
      The four-proband series establishing de novo KCNQ5 missense
      variants as a cause of intellectual disability.
  - reference: PMID:28669405
    reference_title: "Loss-of-Function and Gain-of-Function Mutations in KCNQ5 Cause Intellectual Disability or Epileptic Encephalopathy."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KCNQ5 is a highly conserved gene encoding an important channel
      for neuronal function; it is widely expressed in the brain and
      generates M-type current.
    explanation: >-
      States the gene's channel function, the basis for attaching this
      subtype to the cortical hyperexcitability node.
  - reference: PMID:28669405
    reference_title: "Loss-of-Function and Gain-of-Function Mutations in KCNQ5 Cause Intellectual Disability or Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Specifically, both loss-of-function and gain-of-function KCNQ5
      mutations, associated with increased excitability and decreased
      repolarization reserve, lead to pathophysiology.
    explanation: >-
      Frog-oocyte electrophysiology showing that both directions of
      channel dysfunction are pathogenic, which is the basis for the
      bidirectional-mechanism caveat recorded above.

- name: MRD47
  display_name: Intellectual disability, autosomal dominant 47 (STAG1-related)
  subtype_term:
    preferred_term: STAG1-related autosomal dominant intellectual disability
    term:
      id: MONDO:0030912
      label: intellectual disability, autosomal dominant 47
  genes:
  - preferred_term: STAG1
    term:
      id: hgnc:11354
      label: STAG1
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    MONDO carries no textual definition for this class; it asserts the
    class as a direct subclass of this entry's own term, MONDO:0015802,
    and records STAG1 as its causal gene by RO:0004003. STAG1 belongs to
    the STAG subunit of the core cohesin complex, making this subtype a
    cohesinopathy. ClinGen classifies the relationship as Definitive,
    against `complex neurodevelopmental disorder`. Its placement under a
    non-syndromic parent is the least defensible of any subtype on this
    entry: MONDO itself also asserts MONDO:0030912 as a subclass of
    `multiple congenital anomalies/dysmorphic syndrome-intellectual
    disability`, so the two placements contradict each other within one
    ontology, and the defining case series reports shared facial
    features and calls the phenotype syndromic.
  evidence:
  - reference: CGGV:assertion_30cc66e4-e3cf-428d-9f27-58e8427c94f1-2022-09-20T060000.000Z
    reference_title: "STAG1 / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      STAG1 | HGNC:11354 | complex neurodevelopmental disorder |
      MONDO:0100038 | AD | Definitive | SOP9 | Intellectual Disability
      and Autism Gene Curation Expert Panel
    explanation: >-
      ClinGen's expert-panel gene-disease validity classification for
      this gene. The row also records which disease concept the panel
      curated against, which for this series is generally not the
      MRD-series term the subtype binds; the
      adnsid_clingen_disease_concept discussion on this entry collects
      that observation across all the subtypes.
  - reference: PMID:28119487
    reference_title: "STAG1 mutations cause a novel cohesinopathy characterised by unspecific syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an international series of 17 individuals from 16
      families presenting with syndromic unspecific ID that could be
      attributed to a STAG1 deletion or point mutation.
    explanation: >-
      The defining series, and the source of the observation that the
      authors themselves describe the phenotype as syndromic.
  - reference: PMID:28119487
    reference_title: "STAG1 mutations cause a novel cohesinopathy characterised by unspecific syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 17 patients shared common facial features, with wide mouth
      and deep-set eyes.
    explanation: >-
      The specific shared dysmorphic findings behind the syndromic
      characterisation.
  - reference: PMID:28119487
    reference_title: "STAG1 mutations cause a novel cohesinopathy characterised by unspecific syndromic intellectual disability."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STAG1 belongs to the STAG subunit of the core cohesin complex,
      along with five other subunits.
    explanation: >-
      Places the subtype among the cohesinopathies.

- name: MRD49
  display_name: Clark-Baraitser syndrome (TRIP12-related, MRD49)
  subtype_term:
    preferred_term: TRIP12-related autosomal dominant intellectual disability
    term:
      id: MONDO:0030914
      label: Clark-Baraitser syndrome
  genes:
  - preferred_term: TRIP12
    term:
      id: hgnc:12306
      label: TRIP12
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    The one member of this series MONDO labels with an eponym rather
    than an MRD number; `MRD49` and `intellectual disability, autosomal
    dominant 49` are both MONDO synonyms of the same class, and MONDO
    asserts it as a direct subclass of this entry's own term with TRIP12
    as its causal gene by RO:0004003. TRIP12 encodes a HECT-domain E3
    ubiquitin ligase on chromosome 2q36.3 and acts through
    haploinsufficiency, so the subtype does follow this entry's root
    gene-dosage node, but its effector module is the
    ubiquitin-proteasome system rather than any of the three modules
    this entry currently curates. MONDO cross-references the class to
    both OMIM:617752 and OMIM:300602. ClinGen classifies the
    gene-disease relationship as Definitive, against `complex
    neurodevelopmental disorder`, and the concept now carries its own
    DNA methylation episignature - a degree of phenotypic consolidation
    that argues against a non-syndromic placement.
  evidence:
  - reference: CGGV:assertion_011b99b3-0d17-4615-800e-36f4bacd8117-2022-04-05T060000.000Z
    reference_title: "TRIP12 / complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TRIP12 | HGNC:12306 | complex neurodevelopmental disorder |
      MONDO:0100038 | AD | Definitive | SOP9 | Intellectual Disability
      and Autism Gene Curation Expert Panel
    explanation: >-
      ClinGen's expert-panel gene-disease validity classification for
      this gene. The row also records which disease concept the panel
      curated against, which for this series is generally not the
      MRD-series term the subtype binds; the
      adnsid_clingen_disease_concept discussion on this entry collects
      that observation across all the subtypes.
  - reference: PMID:36430143
    reference_title: "Episignature Mapping of TRIP12 Provides Functional Insight into Clark-Baraitser Syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clark-Baraitser syndrome is a rare autosomal dominant
      intellectual disability syndrome caused by pathogenic variants
      in the TRIP12 (Thyroid Hormone Receptor Interactor 12) gene.
    explanation: >-
      Establishes that the eponymous syndrome is TRIP12-related and
      autosomal dominant.
  - reference: PMID:36430143
    reference_title: "Episignature Mapping of TRIP12 Provides Functional Insight into Clark-Baraitser Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a specific and sensitive DNA methylation (DNAm)
      episignature associated with pathogenic TRIP12 variants,
      establishing its utility as a clinical biomarker for
      Clark-Baraitser syndrome.
    explanation: >-
      Source for the episignature statement above.
  - reference: PMID:28251352
    reference_title: "Haploinsufficiency of the E3 ubiquitin-protein ligase gene TRIP12 causes intellectual disability with or without autism spectrum disorders, speech delay, and dysmorphic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nine presented pathogenic variants further document that
      TRIP12 haploinsufficiency causes a childhood-onset
      neurodevelopmental disorder.
    explanation: >-
      Establishes haploinsufficiency as the mechanism, connecting this
      subtype to the entry's root pathophysiology node.
  - reference: PMID:28251352
    reference_title: "Haploinsufficiency of the E3 ubiquitin-protein ligase gene TRIP12 causes intellectual disability with or without autism spectrum disorders, speech delay, and dysmorphic features."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only a handful of single-nucleotide variants (SNVs) and
      copy-number variants (CNVs) involving TRIP12, encoding a member
      of the HECT domain E3 ubiquitin ligases family on chromosome
      2q36.3 have been reported.
    explanation: >-
      Source for the protein family and the chromosomal location
      recorded above.

- name: MRD50
  display_name: Intellectual disability, autosomal dominant 50 (NAA15-related)
  subtype_term:
    preferred_term: NAA15-related autosomal dominant intellectual disability
    term:
      id: MONDO:0030916
      label: intellectual disability, autosomal dominant 50
  genes:

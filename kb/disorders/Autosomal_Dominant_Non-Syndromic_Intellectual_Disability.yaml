    snippet: >-
      We estimate that developmental disorders caused by DNMs have an average
      prevalence of 1 in 213 to 1 in 448 births, depending on parental age.
    explanation: >-
      Quantifies the birth prevalence of the de-novo-dominant developmental
      disorder class of which AD-NSID is the non-syndromic part.

pathophysiology:
- name: De Novo Heterozygous Variant in a Constraint-Intolerant Neurodevelopmental Gene
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a single new (de novo) protein-truncating or
    damaging missense variant arising in the parental germline and present
    heterozygously in the proband. Because such variants are not transmitted
    through families, this class of disease was undetectable by linkage and
    was only exposed by parent-offspring trio exome sequencing. The affected
    genes are drawn overwhelmingly from the minority of the genome under
    strong selective constraint against heterozygous protein-truncating
    variants, i.e. genes whose normal function requires two working copies.
    An emerging, mechanistically distinct minority arm of the same trigger is
    the NON-CODING de novo mutation: whole-genome sequencing of ID trios finds
    regulatory DNMs selectively enriched in fetal-brain-specific enhancers,
    including recurrently mutated enhancer clusters regulating nervous-system
    development genes. This arm is captured here as part of the trigger rather
    than as a separate node because the downstream consequence - dosage
    perturbation of a constraint-intolerant neurodevelopmental gene - is the
    same; only the lesion type differs. Evidence comes from small,
    mixed developmental-disorder cohorts rather than AD-NSID-specific series,
    so it is an emerging rather than established contributor for this class.
  role: trigger
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
  evidence:
  - reference: PMID:36854624
    reference_title: "Regulatory de novo mutations underlying intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that regulatory DNMs were selectively enriched in fetal
      brain-specific enhancers as compared with adult brain enhancers.
    explanation: >-
      Establishes the non-coding regulatory arm of the de novo trigger:
      enhancer DNMs are enriched specifically in fetal-brain enhancers,
      matching the critical-window logic modelled downstream.
  - reference: PMID:36854624
    reference_title: "Regulatory de novo mutations underlying intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified recurrently mutated enhancer clusters that regulate genes
      involved in nervous system development (CSMD1, OLFM1, and POU3F3).
    explanation: >-
      Names the recurrently mutated enhancer clusters and their
      nervous-system-development target genes, showing the regulatory arm
      converges on the same gene classes as the coding arm.
  - reference: PMID:36854624
    reference_title: "Regulatory de novo mutations underlying intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using CRISPR-mediated mutation and editing of epigenomic marks, we show
      that DNMs at regulatory elements affect the expression of putative
      target genes.
    explanation: >-
      Functional confirmation that the regulatory lesions change target-gene
      expression. PARTIAL because the cohort is small and mixed
      developmental-disorder rather than AD-NSID-specific, so clinical
      penetrance for individual regulatory variants is not established.
  - reference: PMID:21076407
    reference_title: "A de novo paradigm for mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we used a family based exome sequencing approach to test this de
      novo mutation hypothesis in ten individuals with unexplained mental
      retardation. We identified and validated unique non-synonymous de novo
      mutations in nine genes.
    explanation: >-
      The founding trio-exome study establishing de novo point mutation as the
      causal mechanism in unexplained (non-syndromic) ID.
  - reference: PMID:21076407
    reference_title: "A de novo paradigm for mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with de novo copy number variation, de novo point mutations of
      large effect could explain the majority of all mental retardation cases
      in the population.
    explanation: >-
      States the central architectural claim - large-effect de novo lesions,
      not inherited variation, dominate the aetiology.
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After exclusion of copy-number variants, de-novo point mutations and
      small indels are associated with severe, sporadic non-syndromic
      intellectual disability, accounting for 45-55% of patients with high
      locus heterogeneity.
    explanation: >-
      Directly quantifies the contribution of de novo point mutations to
      severe sporadic NON-SYNDROMIC ID - the exact disease class curated here.
  - reference: PMID:26503795
    reference_title: "Genetic studies in intellectual disability and related disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic factors play a major part in intellectual disability (ID), but
      genetic studies have been complicated for a long time by the extreme
      clinical and genetic heterogeneity.
    explanation: >-
      Review statement of the extreme locus heterogeneity that defines this
      class and explains why it resisted pre-sequencing gene discovery.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Known dominant DD-associated genes are strongly enriched in the minority
      of genes that exhibit strong selective constraint on heterozygous PTVs
    explanation: >-
      Establishes that the target gene set is defined by intolerance to
      heterozygous protein-truncating variants, i.e. dosage sensitivity.
  downstream:
  - target: Haploinsufficiency of a Dosage-Sensitive Neurodevelopmental Gene
    causal_link_type: DIRECT
    description: >-
      A protein-truncating allele triggers nonsense-mediated decay or produces
      a non-functional protein, leaving a single functional copy.
    evidence:
    - reference: PMID:33057194
      reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This residual burden of protein-truncating DNMs is greatest in genes
        that are intolerant of PTVs in the general population
      explanation: >-
        Links the de novo protein-truncating lesion specifically to
        dosage-intolerant genes, i.e. to a haploinsufficiency outcome.

- name: Haploinsufficiency of a Dosage-Sensitive Neurodevelopmental Gene
  genes:
  - preferred_term: TRIP12
    term:
      id: hgnc:12306
      label: TRIP12
  - preferred_term: NAA15
    term:
      id: hgnc:30782
      label: NAA15
  - preferred_term: TLK2
    term:
      id: hgnc:11842
      label: TLK2
  biological_scale: MOLECULAR
  description: >-
    Loss of one functional allele reduces gene product to roughly 50% of
    normal. For the genes implicated in AD-NSID this is below the threshold
    required for normal neurodevelopment, which is why they are among the most
    constraint-intolerant genes in the genome. Haploinsufficiency is the
    predominant - though not the only - mechanism: a growing minority of
    AD-NSID genes act instead through altered-function (dominant-negative or
    gain-of-function) missense alleles, and these two mechanisms are not
    interchangeable when interpreting a new variant.
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
  evidence:
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More participants in the case group had loss-of-function variants than
      in the control group (20/51 vs 2/20; p=0·022), suggesting their
      contribution to disease development.
    explanation: >-
      Demonstrates statistical excess of heterozygous loss-of-function alleles
      in non-syndromic ID cases versus controls.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This residual burden of protein-truncating DNMs is greatest in genes
      that are intolerant of PTVs in the general population
    explanation: >-
      Confirms the haploinsufficiency mechanism concentrates in
      constraint-intolerant genes and that many such disorders remain
      undiscovered.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequently, we expect that a greater proportion of the novel genes
      will act via altered-function mechanisms (e.g. dominant negative or
      gain-of-function).
    explanation: >-
      Qualifies the haploinsufficiency model: newly discovered dominant
      developmental-disorder genes increasingly act by altered function rather
      than pure dosage loss.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Second, mice that are heterozygous for null alleles of Syngap1 have
      impaired synaptic plasticity and learning, which suggests that the
      disruption of a single SYNGAP1 allele is sufficient to cause cognitive
      dysfunction in humans.
    explanation: >-
      Mouse heterozygote data establishing that a single-allele dose reduction
      is sufficient for the cognitive phenotype.
  downstream:
  - target: Disrupted Synaptic Transmission and Plasticity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      For the synaptic module of AD-NSID genes, reduced gene dosage directly
      perturbs postsynaptic signalling complexes and receptor trafficking.
  - target: Disrupted Chromatin and Transcriptional Regulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      For the chromatin/transcription module, reduced dosage of a
      chromatin-modifying or transcription-regulating factor dysregulates
      neurodevelopmental gene expression programmes.
  - target: Disrupted Neuronal Cytoskeletal Dynamics and Rho GTPase Signalling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      For the cytoskeletal module, reduced dosage of a cytoskeletal regulator
      or Rho GTPase pathway component impairs actin and microtubule dynamics
      in developing neurons.

- name: Disrupted Synaptic Transmission and Plasticity
  genes:

  - reference: PMID:21237447
    reference_title: "De novo SYNGAP1 mutations in nonsyndromic intellectual disability and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, we reported de novo truncating mutations in the SYNGAP1 gene

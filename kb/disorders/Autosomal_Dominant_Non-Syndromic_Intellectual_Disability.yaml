  evidence:
  - reference: PMID:23141534
    reference_title: "Pathogenic SYNGAP1 mutations impair cognitive development by disrupting maturation of dendritic spine synapses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations that cause intellectual disability (ID) and autism spectrum
      disorder (ASD) are commonly found in genes that encode for synaptic
      proteins.
    explanation: >-
      States the synaptic-gene convergence that defines this pathophysiology
      module.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced the autosomal gene SYNGAP1, which encodes a ras
      GTPase-activating protein that is critical for cognition and synapse
      function, in 94 patients with nonsyndromic mental retardation.
    explanation: >-
      Identifies the molecular function (Ras GTPase-activating protein) whose
      loss underlies the paradigmatic AD-NSID gene.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SYNGAP1, a GTPase-activating protein that is selectively expressed in
      the brain and is a component of the NMDA-receptor complex, acts
      downstream of the receptor, blocking the insertion of the AMPA receptor
      at the postsynaptic membrane
    explanation: >-
      Describes the specific postsynaptic signalling step (restraint of AMPA
      receptor insertion via inhibition of RAS-ERK) that haploinsufficiency
      de-represses.
  - reference: PMID:19557857
    reference_title: "De novo STXBP1 mutations in mental retardation and nonsyndromic epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced genes coding for components of the SNARE complex (STX1A,
      VAMP2, SNAP25) and their regulatory proteins (STXBP1/Munc18-1, SYT1),
      which are essential for neurotransmission, in 95 patients with
      idiopathic mental retardation.
    explanation: >-
      Extends the synaptic module to the presynaptic release machinery,
      identifying STXBP1 as an AD-NSID gene.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The classic observation that various forms of mental retardation are
      associated with abnormalities in the morphology of dendritic spines
      suggests that disruption of pathways involved in synaptic plasticity may
      be a common mechanism of this disorder.
    explanation: >-
      States the long-standing convergence of ID pathophysiology on dendritic
      spine morphology and synaptic plasticity.
  downstream:
  - target: Premature Dendritic Spine Maturation
    causal_link_type: DIRECT
    description: >-
      In the SYNGAP1 model, de-repressed excitatory synaptic signalling
      accelerates spine maturation and raises circuit excitability.
    evidence:
    - reference: PMID:23141534
      reference_title: "Pathogenic SYNGAP1 mutations impair cognitive development by disrupting maturation of dendritic spine synapses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the SYNGAP1 mouse model of ID/ASD, we found that dendritic spine
        synapses develop prematurely during the early postnatal period.
        Premature spine maturation dramatically enhanced excitability in the
        developing hippocampus, which corresponded with the emergence of
        behavioral abnormalities.
      explanation: >-
        Demonstrates the causal step from synaptic-gene haploinsufficiency to
        accelerated spine maturation and hyperexcitability.


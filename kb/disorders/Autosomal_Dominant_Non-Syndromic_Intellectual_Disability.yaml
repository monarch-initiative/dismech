- name: Static Global Cognitive and Adaptive Impairment Without Syndromic Features
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint is significant, non-progressive impairment of
    intellectual functioning and adaptive behaviour with onset in the
    developmental period. What makes the presentation "non-syndromic" is the
    absence - on current examination - of a distinctive constellation of
    dysmorphic, growth, malformative, or neuroimaging features. This absence
    is partly a real biological property (several causal genes, such as
    SYNGAP1, are expressed almost exclusively in brain, so no somatic
    phenotype is expected) and partly an artefact of limited phenotyping and
    small case series: patients with variants in newly discovered dominant
    genes are, measurably, less phenotypically similar to one another than
    patients with variants in long-established genes.
  evidence:
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of specific dysmorphic features and growth abnormalities in
      these patients is consistent with the fact that SYNGAP1 is exclusively
      expressed in the brain.
    explanation: >-
      Gives the biological rationale for a genuinely brain-restricted,
      non-syndromic presentation.
  - reference: PMID:19196676
    reference_title: "Mutations in SYNGAP1 in autosomal nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most patients have the nonsyndromic form of the disorder, which is
      characterized by the absence of associated morphologic, radiologic, and
      metabolic features.
    explanation: >-
      Defines the non-syndromic category operationally.
  - reference: PMID:33057194
    reference_title: "Evidence for 28 genetic disorders discovered by combining healthcare and research data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with DNMs in the same novel DD-associated gene were less
      phenotypically similar to each other, on average, than patients with
      DNMs in a consensus gene
    explanation: >-
      Supports the ascertainment component of "non-syndromic": recently
      discovered dominant genes produce less distinctive, less consistent
      phenotypes.

mechanistic_hypotheses:
- hypothesis_group_id: nonsyndromic_boundary_is_ascertainment
  hypothesis_label: >-
    The non-syndromic/syndromic boundary reflects depth of phenotyping rather
    than a distinct mechanism
  status: EMERGING
  description: >-
    Under this model AD-NSID is not a mechanistically separate disease class
    but the leading edge of gene discovery: a gene-disease pair is labelled
    "non-syndromic" while the case count is small and the phenotyping shallow,
    and is reclassified as syndromic once enough patients are described to
    reveal a gestalt. The prediction is that MRD-series entities will migrate
    into named syndromes over time (as several already have), and that the
    residual truly non-syndromic set will be enriched for genes with
    brain-restricted expression. The competing model - that a real subclass of
    brain-restricted genes produces isolated cognitive impairment - is not
    mutually exclusive and is supported by SYNGAP1's expression pattern.
  evidence:
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several patients did not meet the expected syndromic manifestation,
      suggesting a strong bias in present clinical syndrome descriptions.
    explanation: >-
      Explicitly attributes syndromic/non-syndromic misclassification to bias
      in existing clinical syndrome descriptions.
  - reference: PMID:23020937
    reference_title: "Range of genetic mutations associated with severe non-syndromic sporadic intellectual disability: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The large number of de-novo variants in known intellectual disability
      genes is only partially attributable to known non-specific phenotypes.
    explanation: >-
      Notes that patients ascertained as non-syndromic frequently carry
      variants in genes catalogued as syndromic.
  - reference: PMID:26989088
    reference_title: "Genetic and neurodevelopmental spectrum of SYNGAP1-associated intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SYNGAP1 encephalopathy is characterised by early neurodevelopmental
      delay typically preceding the onset of a relatively recognisable
      epilepsy comprising generalised seizures (absences, myoclonic jerks) and
      frequent triggers.
    explanation: >-
      Worked example of the predicted migration: SYNGAP1, first reported as a
      cause of NON-syndromic ID, is redescribed as a recognisable
      developmental and epileptic encephalopathy once a larger series is
      phenotyped.


  icd10cm_mappings:
  - term:
      id: ICD10CM:N95.1
      label: Menopausal and female climacteric states
    mapping_predicate: skos:broadMatch
    mapping_source: manual curation
    mapping_justification: >-
      The only coded anchor this entry carries, and broader than the entry. ICD-10-CM
      N95.1 is the code for symptomatic menopausal and climacteric states generally, which
      includes the sleeplessness, headache and poor concentration of the transition as
      well as its vasomotor symptoms; this entry covers the vasomotor arm only. SKOS
      predicates read subject to object with the entry as subject, so the broader code is
      recorded as broadMatch. The code resolves under ICD10CM:N95 "Menopausal and other
      perimenopausal disorders" and ICD10CM:N80-N98, within ICD10CM:N00-N99. Because the
      predicate is broadMatch rather than exactMatch, the mapping is a cross-reference and
      does not retire anything from the curation queue.

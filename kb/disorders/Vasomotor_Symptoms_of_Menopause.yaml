  downstream:
  - target: Episodic Activation of Heat-Dissipation Effectors
    causal_link_type: DIRECT
    description: >-
      With the zone collapsed, ordinary small rises in core temperature cross the sweating
      threshold and recruit the heat-loss effectors.
- name: Episodic Activation of Heat-Dissipation Effectors
  biological_scale: ORGANISM
  description: >-
    The flush itself: cutaneous vasodilatation reddening the face and upper torso, sweating,
    and cold-seeking behaviour, with the core temperature falling afterwards as the
    effectors do their work. Sweat rates in symptomatic women are about double those in
    asymptomatic ones. The cutaneous vasodilatation arm is the one with a direct causal
    experiment behind it rather than an association: ablating the KNDy population in the rat
    arcuate nucleus lowers tail-skin temperature and blocks estradiol's effect on it, so
    those neurons facilitate the effector this node names.
  biological_processes:
  - preferred_term: episodic cutaneous vasodilatation
    term:
      id: GO:0042311
      label: vasodilation
    modifier: INCREASED
  - preferred_term: episodic sweating
    term:
      id: GO:0160269
      label: sweat secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In many women, the hallmark of a flush is the reddening of the face and upper torso due to cutaneous vasodilatation."
    explanation: >-
      The vasodilatation arm of this node as it presents clinically.
  - reference: PMID:10411797
    reference_title: Reduced thermoregulatory null zone in postmenopausal women with hot flashes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Sweat rates were significantly higher among the women with symptoms
    explanation: >-
      The sweating arm, measured rather than reported, in the same cohort whose
      interthreshold zones were narrowed.
  - reference: PMID:23150555
    reference_title: Role for kisspeptin/neurokinin B/dynorphin (KNDy) neurons in cutaneous vasodilatation and the estrogen modulation of body temperature.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Remarkably, KNDy neuron ablation consistently reduced tail-skin temperature (T(SKIN)), indicating that KNDy neurons facilitate cutaneous vasodilatation, an important heat dissipation effector."
    explanation: >-
      The causal experiment linking the arcuate population to the effector this node names:
      removing the neurons removes the vasodilatation. Graded INDIRECT and MODEL_ORGANISM
      because the manipulation is a saporin ablation in rat and tail-skin temperature is
      the rodent analogue of the human cutaneous flush.
  - reference: PMID:23150555
    reference_title: Role for kisspeptin/neurokinin B/dynorphin (KNDy) neurons in cutaneous vasodilatation and the estrogen modulation of body temperature.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, KNDy ablation blocked the reduction of T(SKIN) by 17β-estradiol (E(2)), which occurred in the environmental chamber during the light phase, but did not affect the E(2) suppression of T(SKIN) during the dark phase."
    explanation: >-
      The same experiment's estrogen arm, and the reason this entry does not claim the KNDy
      route is the whole story: ablation blocked estradiol's effect on skin temperature in
      the light phase only, so at least one estrogen-dependent thermoregulatory route runs
      outside this population.
  downstream:
  - target: Hot Flashes
    causal_link_type: DIRECT
    description: >-
      Daytime episodes of the effector activation this node describes are experienced and
      reported as hot flushes.
  - target: Night Sweats
    causal_link_type: DIRECT
    description: >-
      The same episodes during sleep present as night sweats.
phenotypes:
- category: Constitutional
  name: Hot Flashes
  description: >-
    Transient episodes of intense heat with flushing of the face and upper torso, sweating
    and often palpitations, lasting minutes and recurring from a few to dozens of times a
    day. Trial populations are typically recruited at seven or more moderate-to-severe
    episodes per day, which is the severity at which treatment is studied rather than the
    average experience.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hot flashes
    term:
      id: HP:0031217
      label: Hot flashes
    onset:
      onset_category: PERIMENOPAUSAL
      notes: >-
        Onset is commonly perimenopausal rather than postmenopausal, because the stimulus
        is the rate of estrogen withdrawal and estradiol fluctuates most widely before the
        final menstrual period. In the SWAN cohort the women whose symptoms began while
        they were still premenopausal or early perimenopausal had the longest total
        duration.
    temporality: RECURRENT
  evidence:
  - reference: PMID:28385352
    reference_title: "Neurokinin 3 receptor antagonism as a novel treatment for menopausal hot flushes: a phase 2, randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Hot flushes affect 70% of menopausal women and often severely impact physical, psychosocial, sexual, and overall wellbeing."
    explanation: >-
      The burden, and the figure on which the FREQUENT band rests: 70% falls inside the
      30-79% band and outside the 80-99% one. Quoted as BACKGROUND because the sentence
      opens the trial report's own framing rather than reporting its result; the evidence it
      describes is human epidemiology, which is why it is graded HUMAN_CLINICAL.
  - reference: PMID:42747278
    reference_title: "Global prevalence of vasomotor symptoms in the menopause transition: systematic review and meta-analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Pooled prevalence estimates ranged from 54.29% in Africa to 74.23% in the Americas and Europe.
    explanation: >-
      The best-measured figure behind the FREQUENT band, and the reason the band is not
      VERY_FREQUENT: every regional pooled estimate in a random-effects meta-analysis of 41
      population-based studies falls inside 30-79%. The denominator is perimenopausal and
      postmenopausal women aged 40 to 65 in the general population, and the pooled measure
      is the composite of hot flushes and night sweats rather than hot flushes alone.
      Heterogeneity was above 97%, so the regional spread is read as a range and not as a
      ranking.
  - reference: PMID:34033602
    reference_title: "Global cross-sectional survey of women with vasomotor symptoms associated with menopause: prevalence and quality of life burden."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most common menopausal symptoms reported in the MENQOL were feeling tired or worn out (Europe/US 74%, Japan 75%), aching in muscles and joints (Europe 69%, US 68%, Japan 61%), difficulty sleeping (Europe 69%, US 66%, Japan 60%), and hot flashes (Europe 67%, US 68%, Japan 62%)."
    explanation: >-
      A hot-flush-specific figure, on a different denominator from the meta-analysis above
      and recorded here so the two are not read as the same measure: these are the women
      who screened positive for moderate-to-severe vasomotor symptoms, reporting the
      symptom in the past week, so 62-68% is a within-syndrome frequency rather than a
      population prevalence. Both denominators give the same band.
  - reference: PMID:40330614
    reference_title: Effects of menopause on temperature regulation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence began increasing approximately four years before the last menstrual period, with about 48% reporting hot flashes in the final year before last menstrual period"
    explanation: >-
      The trajectory rather than a single figure, which is what makes the band defensible
      against a cross-sectional estimate taken at the wrong moment: prevalence rises through
      the perimenopause to a peak the same review puts at about 60% in the year after the
      final menstrual period, then declines. Every point on that curve is inside the
      FREQUENT band, and the rise before the final period is the measured basis for the
      perimenopausal onset recorded above.
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Hot flushes can be triggered by a variety of stimuli including thermal (increased ambient temperature or hot beverages), chemical (caffeine or spicy food) or other (stress or anxiety)"
    explanation: >-
      The trigger profile, which is what the narrowed thermoneutral zone above predicts: a
      heterogeneous set of ordinary stimuli, none of them specific, each capable of moving
      core temperature or skin blood flow a little.
- category: Constitutional
  name: Night Sweats
  description: >-
    The same episodes occurring during sleep, reported as drenching sweats that wake the
    sleeper. They are curated as a separate phenotype from hot flushes because they are
    separately measured in trials and because their consequence is different: it is the
    night sweats that drive the sleep disruption below.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Night sweats
    term:
      id: HP:0030166
      label: Night sweats
    onset:
      onset_category: PERIMENOPAUSAL
    temporality: NOCTURNAL
  evidence:
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Total VMS duration (in years) (hot flashes or night sweats) and post-FMP persistence (in years) into postmenopause."
    explanation: >-
      The cohort's own definition of the phenotype pair, which is the basis for curating hot
      flushes and night sweats as the two phenotypes of this entry. It is the outcome
      variable and carries no frequency, so it does not bear on the band below; the next
      item is what the band rests on.
  - reference: PMID:34033602
    reference_title: "Global cross-sectional survey of women with vasomotor symptoms associated with menopause: prevalence and quality of life burden."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other symptoms reported by a high proportion of women were aching in muscles and joints (69% in Europe, 68% in the US, 61% in Japan), difficulty sleeping (69% in Europe, 66% in the US, 60% in Japan), hot flashes (67% in Europe, 68% in the US, 62% in Japan), and night sweats (68% in Europe, 67% in the US, 52% in Japan)."
    explanation: >-
      The night-sweat-specific frequency the FREQUENT band rests on: 52-68% across three
      regions, every one of them inside 30-79%. The denominator is the survey's own
      moderate-to-severe vasomotor cohort reporting the symptom in the past week, so this is
      a within-syndrome frequency and not a population prevalence; it is quoted whole
      because the regional figures for night sweats sit in one sentence with the figures for
      the other symptoms.
  sequelae:
  - target: Sleep Disturbance
    causal_link_type: DIRECT
    description: >-
      Nocturnal episodes fragment sleep, which is the route by which the vasomotor arm
      produces its commonest secondary complaint.
- category: Neurologic
  name: Sleep Disturbance
  description: >-
    Fragmented, non-restorative sleep, recorded here as a sequela of the night sweats
    rather than as an independent manifestation of the transition. The attribution is
    partial: sleep disturbance in the menopausal transition has causes besides vasomotor
    symptoms, and this entry claims only the part that follows the nocturnal episodes. The
    evidence is pharmacological - a neurokinin-targeted drug that reduces the vasomotor
    phenotype also improves measured sleep disturbance - rather than a direct demonstration
    that the sweats cause the fragmentation.
  phenotype_term:
    preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
    onset:
      onset_category: PERIMENOPAUSAL
  evidence:
  - reference: PMID:39172446
    reference_title: "Elinzanetant for the Treatment of Vasomotor Symptoms Associated With Menopause: OASIS 1 and 2 Randomized Clinical Trials."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elinzanetant improved sleep disturbances and menopause-related quality of life at week 12, and the safety profile was favorable."
    explanation: >-
      Establishes sleep disturbance as a measured, treatment-responsive component of the
      vasomotor syndrome in two phase 3 trials. Graded INDIRECT because improvement under a
      drug that also reduces flushes does not by itself show that the flushes caused the
      sleep disturbance.
environmental:
- name: Estrogen Withdrawal
  description: >-
    The hormonal change that drives the entry, recorded as an exposure record with the
    direction reversed, per the convention design decisions section 19 sets for a menopause
    fact of this kind: bind the hormonal state rather than the life stage, because ECTO has
    no menopause term and a life stage is not an exposure. The record covers the
    iatrogenic routes as well as the natural one - bilateral oophorectomy, gonadotropin-releasing
    hormone agonists, aromatase inhibitors and tamoxifen - because the vasomotor arm is
    reached by all of them, and because that is the population in which one of this entry's
    cited trials was conducted.
  presence: Present
  exposure_term:
    preferred_term: withdrawal of systemic estrogen exposure
    term:
      id: ECTO:9000010
      label: exposure to estrogens
    modifier: DECREASED
  causal_role: NECESSARY
  evidence:
  - reference: PMID:23150555
    reference_title: Role for kisspeptin/neurokinin B/dynorphin (KNDy) neurons in cutaneous vasodilatation and the estrogen modulation of body temperature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Estrogen withdrawal in menopausal women leads to hot flushes, a syndrome characterized by the episodic activation of heat dissipation effectors."
    explanation: >-
      The causal claim this exposure record makes, stated as the premise of a rat study.
      Quoted as BACKGROUND and graded HUMAN_CLINICAL because the sentence describes the
      human clinical phenomenon rather than the paper's own rodent result.
  influences_mechanisms:
  - target: Systemic Estradiol Withdrawal
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The fall in systemic estrogen exposure is the route by which the hormonal state at
      the root of this entry's chain is established, whether it arises from follicle-pool
      exhaustion, oophorectomy or endocrine therapy.
    evidence:
    - reference: PMID:23872331
      reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Withdrawal of gonadal steroids induces flushes in a variety of patients: women treated with tamoxifen for breast cancer, women with premature ovarian failure, aging men with diminished testosterone, and men with prostate carcinoma undergoing androgen ablation therapy"
      explanation: >-
        The edge's own evidence, and the source for this record covering the iatrogenic
        routes: the same phenotype follows gonadal steroid withdrawal however it is
        produced, in women and in men.
treatments:
- name: Menopausal Hormone Therapy
  description: >-
    Systemic oestrogen, with a progestogen added for a woman who still has a uterus, given
    to replace the hormone whose withdrawal roots this entry's chain. It is the most
    effective treatment for the vasomotor arm and the only treatment curated here that acts
    on the root node rather than downstream of it: a meta-analysis of 24 placebo-controlled
    trials in 3,329 women puts the reduction in weekly flush frequency at 75% relative to
    placebo. That figure is relative because the placebo arms themselves improved by 58%,
    which is why the same review insists any competing therapy be tested against a placebo.
    The low-dose preparations now recommended were tested separately and do less: 0.5 mg
    oral oestradiol reduced symptoms by 2.3 more per day than placebo in the three-arm
    MsFLASH trial, 0.6 per day ahead of venlafaxine in the same trial, a margin that trial
    reports as small and of uncertain clinical relevance. Route is not a lever on efficacy:
    the oral and transdermal formulations are reported as comparable, so the choice between
    them turns on other considerations.

    The risks are as well characterised as the benefit, and are what moved the treatment
    from a default to a decision. The Women's Health Initiative randomised 27,347 postmenopausal women aged 50 to 79 to conjugated equine
    oestrogens, with or without medroxyprogesterone acetate, against placebo: both regimens
    raised stroke, venous thrombosis, gallbladder disease and urinary incontinence, and the
    combined regimen also raised invasive breast cancer, an elevation that persisted through
    13 years of cumulative follow-up. Those trials tested chronic-disease prevention, which
    they do not support for either regimen. Symptom management in a generally healthy woman
    in early menopause is a different indication and remains an accepted one, and the
    vasomotor benefit was measured inside the WHI itself, in the women aged 50 to 54 with
    moderate-to-severe symptoms at entry, and neither regimen raised all-cause mortality.
    When the cardiovascular risk is initiated matters: subanalysis of the WHI by age band,
    with the later KEEPS and ELITE trials, puts the risk of adverse cardiovascular events
    low for a woman under 60 or within ten years of her menopause, which is the timing
    hypothesis. The practical effect is that the treatment is offered after an individual
    assessment of cardiovascular and breast-cancer risk, at the lowest effective dose,
    rather than prescribed as a matter of course. In a breast cancer survivor it is
    reserved for severe symptoms refractory to everything else, because its safety with
    respect to recurrence has not been shown, which is the population the oxybutynin and
    elinzanetant rows below speak to.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: menopausal hormone therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: oral 17-beta-oestradiol
      term:
        id: CHEBI:16469
        label: 17beta-estradiol
    - preferred_term: conjugated equine oestrogens
      term:
        id: CHEBI:749574
        label: "estrogens, conjugated"
    - preferred_term: medroxyprogesterone acetate
      term:
        id: CHEBI:6716
        label: medroxyprogesterone acetate
  dosing_interval: once daily
  dosing_interval_days: 1.0
  target_mechanisms:
  - target: Systemic Estradiol Withdrawal
    treatment_effect: RESTORES
    description: >-
      Replacing systemic oestrogen reverses the node at the root of the chain, which is what
      separates this treatment from every other one curated here: the receptor antagonists
      and the non-hormonal agents all act downstream and leave the hormonal state in place.
      The lever is the systemic concentration rather than any node below it, which is why
      giving oestrogen and then withdrawing it again reinstates the flushes.
    evidence:
    - reference: PMID:15495039
      reference_title: Oral oestrogen and combined oestrogen/progestogen therapy versus placebo for hot flushes.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: Oral HT is highly effective in alleviating hot flushes and night sweats.
      explanation: >-
        The edge's own evidence: restoring the hormone the root node says has been withdrawn
        relieves both phenotypes of this entry, pooled over 24 placebo-controlled trials.
    - reference: PMID:23872331
      reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "However, even in these women, hot flushes may reoccur if estrogens are administered and then withdrawn"
      explanation: >-
        Why the edge is drawn at the systemic node: the response can be switched off by
        giving the hormone and on again by taking it away, so it is the systemic level that
        this treatment acts on. The same sentence is cited under the Remission phase for the
        complementary point about accommodation.
  target_phenotypes:
  - preferred_term: Hot flashes
    term:
      id: HP:0031217
      label: Hot flashes
  - preferred_term: Night sweats
    term:
      id: HP:0030166
      label: Night sweats
  evidence:
  - reference: PMID:15495039
    reference_title: Oral oestrogen and combined oestrogen/progestogen therapy versus placebo for hot flushes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: This was equivalent to a 75% reduction in frequency (95% CI 64.3 to 82.3) for HT relative to placebo.
    explanation: >-
      The magnitude of the effect, pooled over 24 double-blind placebo-controlled trials of
      at least three months, and the figure behind this entry's calling hormone therapy the
      most effective treatment for the vasomotor arm.
  - reference: PMID:15495039
    reference_title: Oral oestrogen and combined oestrogen/progestogen therapy versus placebo for hot flushes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In women who were randomised to placebo treatment, a 57.7% (95% CI 45.1 to 67.7) reduction in hot flushes was observed between baseline and end of study."
    explanation: >-
      The placebo arm, recorded because it is what makes the 75% figure above a relative one
      and because it sets the bar every other treatment row in this entry is measured
      against.
  - reference: PMID:24861828
    reference_title: "Low-dose estradiol and the serotonin-norepinephrine reuptake inhibitor venlafaxine for vasomotor symptoms: a randomized clinical trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Estradiol reduced the frequency of symptoms by 2.3 more per day than placebo (P < .001)
    explanation: >-
      The low-dose arm, which is the regimen now recommended and was not what the older
      fixed-dose trials pooled above tested. From a three-arm randomised double-blind trial
      in 339 perimenopausal and postmenopausal women.
  - reference: PMID:24084921
    reference_title: "Menopausal hormone therapy and health outcomes during the intervention and extended poststopping phases of the Women's Health Initiative randomized trials."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Women aged 50-54 with moderate-to-severe vasomotor symptoms at baseline experienced symptom reductions with hormone therapy
    explanation: >-
      The vasomotor benefit measured inside the WHI itself rather than in the efficacy
      trials, in the age band for which the treatment is now recommended.
  - reference: PMID:24084921
    reference_title: "Menopausal hormone therapy and health outcomes during the intervention and extended poststopping phases of the Women's Health Initiative randomized trials."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both regimens, however, were associated with increased risk of stroke, venous thrombosis, gallbladder disease, and urinary incontinence, without clear differences by age."
    explanation: >-
      The harms this row records alongside the benefit, from 27,347 randomised women. Shared
      by the oestrogen-alone and the combined regimen, and not confined to older women.
  - reference: PMID:24084921
    reference_title: "Menopausal hormone therapy and health outcomes during the intervention and extended poststopping phases of the Women's Health Initiative randomized trials."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "some elevation in breast cancer risk persisted during cumulative follow-up (434 cases for CEE plus MPA vs 323 for placebo; HR, 1.28 [95% CI, 1.11-1.48])"
    explanation: >-
      The harm specific to the combined regimen, and the one that did not dissipate when the
      intervention stopped. It is the reason a progestogen is added only where the uterus
      makes it necessary.
  - reference: PMID:24084921
    reference_title: "Menopausal hormone therapy and health outcomes during the intervention and extended poststopping phases of the Women's Health Initiative randomized trials."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "although HT remains a reasonable option for the management of moderate-to-severe menopausal symptoms among generally healthy women in early menopause, current WHI findings do not support the use of either estrogen-progestin or estrogen alone for chronic disease prevention"
    explanation: >-
      The boundary the WHI investigators draw themselves, and the reason the benefit and the
      risk in this row are not in tension: the indication the trials refute is
      chronic-disease prevention, and the indication this entry curates is symptom relief.
  - reference: PMID:26348174
    reference_title: Management of Menopausal Symptoms.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: Hormone therapy (HT) represents the most effective treatment for these symptoms with oral and transdermal estrogen formulations having comparable efficacy.
    explanation: >-
      The standing of this treatment relative to every other row in the entry, and the
      source for the route equivalence recorded in the description. Quoted as
      REVIEW_SYNTHESIS because it is a clinical review's summary of trial evidence it did
      not generate.
  - reference: PMID:26348174
    reference_title: Management of Menopausal Symptoms.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: Neither regimen increased all-cause mortality rates.
    explanation: >-
      The limit of the harm signal, which belongs beside the individual risks above: the
      WHI harms were specific outcomes, not a mortality difference.
  - reference: PMID:30484736
    reference_title: "The Timing Hypothesis: Hormone Therapy for Treating Symptomatic Women During Menopause and Its Relationship to Cardiovascular Disease."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: demonstrate that the risk of adverse cardiovascular events for HT are low for women <60 years of age or within 10 year from menopause
    explanation: >-
      The timing hypothesis, which is what makes the WHI cardiovascular result and current
      practice consistent with each other: the trial population averaged well past the
      window in which this treatment is now started. The supporting trials named in the
      same sentence are KEEPS and ELITE, neither of which is separately cited here.
  - reference: PMID:14663778
    reference_title: Estrogen deficiency symptom management in breast cancer survivors in the changing context of menopausal hormone therapy.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: the safety of estrogen and/or progestin regarding risk of recurrence or new cancer development in breast cancer survivors has not been demonstrated
    explanation: >-
      The contraindication that makes the non-hormonal rows below more than second
      preferences, and that the elinzanetant endocrine-therapy trial and the oxybutynin
      trial were both designed around.
  notes: >-
    Design decisions section 19 forbids reusing NCIT:C15599 Hormone Replacement Therapy for
    a treatment that is not menopausal hormone therapy, because NCIT defines it as
    post-menopausal or post-ovariectomy oestrogen replacement and other entries have bound
    it to growth-hormone, thyroid and adrenal replacement instead. This row is the on-label
    case, so the term is used here rather than avoided: the class was read from OLS on
    2026-11-14 and resolves under NCIT:C49236 Therapeutic Procedure and so under
    NCIT:C25218 Clinical Intervention or Procedure, which is what TreatmentTerm requires,
    and carries "menopausal hormone therapy" as an NCIT exact synonym.

    Conjugated equine oestrogens and medroxyprogesterone acetate are bound because they are
    the WHI agents; oral 17-beta-oestradiol because it is the MsFLASH agent. Tibolone, the
    transdermal and vaginal routes, and the oestrogen-plus-bazedoxifene combination are not
    curated: no source cited in this entry reports a vasomotor result for any of them.
- name: Fezolinetant
  description: >-
    A selective neurokinin-3 receptor antagonist, the first non-hormonal drug developed
    against this mechanism to reach approval. It acts at the preoptic receptor node and
    nowhere else in the chain - the follicle pool, the gonadotropin rise and the systemic
    estradiol fall are untouched - so its effect is the strongest pharmacological argument
    that the mechanism curated in this entry is the right one. Benefit appears within a
    week and is maintained over 52 weeks.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fezolinetant
      term:
        id: NCIT:C171845
        label: Fezolinetant
  target_mechanisms:
  - target: Increased Neurokinin B Signalling at NK3R in Preoptic Thermoregulatory Neurons
    treatment_effect: INHIBITS
    description: >-
      The drug blocks the receptor this node is named for, suppressing its output while
      leaving the hormonal state upstream unchanged.
  target_phenotypes:
  - preferred_term: Hot flashes
    term:
      id: HP:0031217
      label: Hot flashes
  evidence:
  - reference: PMID:36924778
    reference_title: "Fezolinetant for treatment of moderate-to-severe vasomotor symptoms associated with menopause (SKYLIGHT 1): a phase 3 randomised controlled study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Improvements in frequency and severity of vasomotor symptoms were observed after 1 week and maintained over 52 weeks.
    explanation: >-
      The onset and durability of the effect, from a 12-week randomised placebo-controlled
      phase 3 trial with a 40-week extension.
  - reference: PMID:36924778
    reference_title: "Fezolinetant for treatment of moderate-to-severe vasomotor symptoms associated with menopause (SKYLIGHT 1): a phase 3 randomised controlled study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Data support the clinical use of fezolinetant as a non-hormonal treatment for vasomotor symptoms associated with menopause.
    explanation: >-
      The trial's own conclusion, and the reason this treatment is recorded against the
      receptor node rather than against the hormone-withdrawal nodes above it.
  - reference: PMID:28385352
    reference_title: "Neurokinin 3 receptor antagonism as a novel treatment for menopausal hot flushes: a phase 2, randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: MLE4901 significantly reduced the total weekly number of hot flushes by 45 percentage points
    explanation: >-
      The proof-of-concept result for the whole drug class, obtained with an earlier
      neurokinin-3 receptor antagonist. Graded INDIRECT because the agent is MLE4901 rather
      than fezolinetant, so it supports this treatment row through the shared target.
  notes: >-
    MLE4901, the proof-of-concept antagonist cited here, was not developed further: three
    of 37 randomised participants developed a transaminase rise. Liver enzyme elevation is
    a recognised class effect and the SKYLIGHT 1 report records its incidence as low and
    the events as generally asymptomatic and transient; the trial record for both agents is
    in clinical_trials below.
- name: Elinzanetant
  description: >-
    A dual neurokinin-1 and neurokinin-3 receptor antagonist, curated as a separate
    treatment from fezolinetant rather than folded into a class row for two reasons: it
    adds an NK1 arm, which is a different pharmacology, and its phase 3 programme measured
    sleep disturbance and quality of life alongside flush frequency and improved both. Its
    separate trial in women on endocrine therapy for breast cancer also extends the
    mechanism to drug-induced withdrawal, a population for whom estrogen is contraindicated.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

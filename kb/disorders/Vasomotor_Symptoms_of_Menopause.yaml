name: Vasomotor Symptoms of Menopause
creation_date: '2026-11-14T00:00:00Z'
category: Endocrine
synonyms:
- VMS
- hot flushes
- hot flashes
- night sweats
- menopausal vasomotor symptoms
- menopausal and female climacteric states
description: >-
  Episodic activation of the body's heat-loss machinery - cutaneous vasodilatation,
  sweating and cold-seeking behaviour - triggered in most women by withdrawal of ovarian
  estrogen and experienced as a hot flush by day and as a night sweat during sleep. The
  core temperature preceding a flush is normal; what has changed is the width of the
  thermoregulatory interthreshold zone, which in symptomatic postmenopausal women collapses
  to near zero, so that ordinary small rises in core temperature cross the sweating
  threshold. The mechanism upstream of that narrowing runs through the arcuate (infundibular)
  nucleus: KNDy neurons, which co-express kisspeptin, neurokinin B and dynorphin and are
  restrained by estradiol acting at estrogen receptor alpha, hypertrophy and raise their
  neurokinin B and kisspeptin expression once the restraint is withdrawn, and project to
  preoptic thermoregulatory structures that carry the neurokinin-3 receptor. Three
  independent lines converge on that account: postmortem hypothalami of postmenopausal
  women show the hypertrophy and the raised transcripts; intravenous neurokinin B
  reproduces flushes in healthy premenopausal women; and neurokinin-3 receptor antagonists
  reduce flush frequency and severity in randomised, placebo-controlled trials without
  replacing the hormone. Unlike the genitourinary syndrome, the symptoms usually remit as
  the low-estrogen state is accommodated, but not quickly: the median total duration in a
  multi-ethnic US cohort was 7.4 years, and 4.5 years after the final menstrual period.

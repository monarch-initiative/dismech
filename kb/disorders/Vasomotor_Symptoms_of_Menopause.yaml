pathophysiology:
- name: Systemic Estradiol Withdrawal
  biological_scale: ORGANISM
  conforms_to: menopausal_estrogen_withdrawal#Systemic Estradiol Withdrawal
  description: >-
    Circulating estradiol falls as the ovarian follicle pool is exhausted. For this entry
    the rate matters more than the level: flushes track the withdrawal rather than the
    absolute concentration, which is why they are often worst in the perimenopause while
    estradiol still fluctuates, why abrupt surgical withdrawal is more severe than the
    natural transition, and why women in whom estrogen has been absent from birth do not
    flush unless exogenous estrogen is given and then stopped. The same consideration makes
    drug-induced withdrawal - gonadotropin-releasing hormone agonists, aromatase
    inhibitors, tamoxifen, androgen deprivation in men - a route into the same chain, which
    is why the neurokinin-3 receptor antagonist trials in that population are cited below
    as indirect support.
  biological_processes:
  - preferred_term: fall in circulating estradiol with exhaustion of the ovarian follicle pool
    term:
      id: GO:0010817
      label: regulation of hormone levels
    modifier: DECREASED
  evidence:
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In the majority of menopausal women, estrogen withdrawal causes hot flushes (also known as hot flashes), a disorder of hypothalamic thermoregulation."
    explanation: >-
      States the causal claim this node roots, and classifies the result as a
      thermoregulatory disorder rather than a vascular one, which is what the downstream
      nodes model.
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: It is not the absolute level of estrogens, but the rate of estrogen withdrawal that determines the onset of flushes
    explanation: >-
      The source for this node's claim that the rate rather than the level is what matters,
      and so for the perimenopausal onset recorded on the phenotypes below.
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: Hot flushes do not occur in situations where estrogen is chronically absent from birth, unless exogenous estrogens are administered and then subsequently withdrawn
    explanation: >-
      The strongest argument that withdrawal rather than deficiency is the stimulus: lifelong
      absence of estrogen does not produce flushes. Graded INDIRECT because it establishes
      the claim by the absence of the phenotype in a contrasting population.
  downstream:
  - target: Loss of KNDy Neuron Estrogen Receptor Signalling
    causal_link_type: DIRECT
    description: >-
      Falling estradiol removes receptor occupancy in the estrogen-responsive KNDy
      population of the arcuate nucleus.
- name: Loss of KNDy Neuron Estrogen Receptor Signalling
  biological_scale: CELLULAR
  conforms_to: menopausal_estrogen_withdrawal#Loss of Estrogen Receptor Signalling in the Target Tissue
  description: >-
    The module's tissue-agnostic receptor node, instantiated in the hypothalamus. The
    substitution is narrow here, and deliberately so: the responsive population is the
    KNDy neuron of the arcuate (infundibular) nucleus, and the receptor is estrogen
    receptor alpha specifically, because coexpression of kisspeptin, neurokinin B and that
    receptor has been identified only in arcuate neurons. ESR2 is not bound on this node,
    unlike the urogenital and myocardial conformers, for that reason. The receptors are
    intact; the ligand has gone.

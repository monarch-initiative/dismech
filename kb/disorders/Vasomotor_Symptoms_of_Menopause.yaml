- name: Arcuate KNDy Neuron Hypertrophy and Neuropeptide Upregulation
  biological_scale: CELLULAR
  conforms_to: menopausal_estrogen_withdrawal#Hypothalamic KNDy Neuron Disinhibition
  description: >-
    The neurons enlarge and raise their neuropeptide output. In postmenopausal hypothalami
    the cross-sectional area of infundibular neurons carrying neurokinin B transcripts
    rises to roughly double the premenopausal value, with a parallel increase in kisspeptin
    transcripts and labelled cell number; dynorphin neurons are also enlarged, although the
    number expressing dynorphin transcripts falls, which is why this node names
    neuropeptide output in general rather than asserting that all three peptides rise
    together. This is the node the module carries, and the entry conforms to it rather than
    restating its evidence; the two downstream steps below - the preoptic relay and the
    narrowed thermoneutral zone - are what the module deliberately omits and leaves to a
    vasomotor entry.

- name: Oxybutynin
  description: >-
    An antimuscarinic approved for overactive bladder and used off-label for flushes, on
    the reasoning that reduced sweating - an ordinary side effect of the drug, already
    exploited in the treatment of generalised hyperhidrosis - acts on the effector arm of
    the flush rather than on its hypothalamic trigger. In a randomised multicentre
    double-blind trial in 150 women having 28 or more flushes a week who were not
    candidates for oestrogen-based therapy, both 2.5 mg and 5 mg twice daily beat placebo
    on the weekly flush score and on flush frequency. Two thirds of the participants were
    taking tamoxifen or an aromatase inhibitor, so the trial speaks principally to the
    drug-induced withdrawal route into this entry's chain rather than to natural menopause.
    Dry mouth, difficulty urinating and abdominal pain were commoner than on placebo,
    though mostly mild.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

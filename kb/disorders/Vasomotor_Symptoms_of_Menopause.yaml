    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, KNDy ablation blocked the reduction of T(SKIN) by 17β-estradiol (E(2)), which occurred in the environmental chamber during the light phase, but did not affect the E(2) suppression of T(SKIN) during the dark phase."
    explanation: >-
      The same experiment's estrogen arm, and the reason this entry does not claim the KNDy
      route is the whole story: ablation blocked estradiol's effect on skin temperature in
      the light phase only, so at least one estrogen-dependent thermoregulatory route runs
      outside this population.
  downstream:
  - target: Hot Flashes
    causal_link_type: DIRECT
    description: >-
      Daytime episodes of the effector activation this node describes are experienced and
      reported as hot flushes.
  - target: Night Sweats
    causal_link_type: DIRECT
    description: >-
      The same episodes during sleep present as night sweats.
phenotypes:
- category: Constitutional
  name: Hot Flashes
  description: >-
    Transient episodes of intense heat with flushing of the face and upper torso, sweating
    and often palpitations, lasting minutes and recurring from a few to dozens of times a
    day. Trial populations are typically recruited at seven or more moderate-to-severe
    episodes per day, which is the severity at which treatment is studied rather than the
    average experience.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Hot flashes
    term:
      id: HP:0031217
      label: Hot flashes
    onset:
      onset_category: PERIMENOPAUSAL
      notes: >-
        Onset is commonly perimenopausal rather than postmenopausal, because the stimulus
        is the rate of estrogen withdrawal and estradiol fluctuates most widely before the
        final menstrual period. In the SWAN cohort the women whose symptoms began while
        they were still premenopausal or early perimenopausal had the longest total
        duration.
    temporality: RECURRENT
  evidence:
  - reference: PMID:28385352
    reference_title: "Neurokinin 3 receptor antagonism as a novel treatment for menopausal hot flushes: a phase 2, randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Hot flushes affect 70% of menopausal women and often severely impact physical, psychosocial, sexual, and overall wellbeing."
    explanation: >-
      Supports the frequency band and the burden. Quoted as BACKGROUND because the sentence
      opens the trial report's own framing rather than reporting its result; the evidence it
      describes is human epidemiology, which is why it is graded HUMAN_CLINICAL.
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Hot flushes can be triggered by a variety of stimuli including thermal (increased ambient temperature or hot beverages), chemical (caffeine or spicy food) or other (stress or anxiety)"
    explanation: >-
      The trigger profile, which is what the narrowed thermoneutral zone above predicts: a
      heterogeneous set of ordinary stimuli, none of them specific, each capable of moving
      core temperature or skin blood flow a little.
- category: Constitutional
  name: Night Sweats
  description: >-
    The same episodes occurring during sleep, reported as drenching sweats that wake the
    sleeper. They are curated as a separate phenotype from hot flushes because they are
    separately measured in trials and because their consequence is different: it is the
    night sweats that drive the sleep disruption below.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Night sweats
    term:
      id: HP:0030166
      label: Night sweats
    onset:
      onset_category: PERIMENOPAUSAL
    temporality: NOCTURNAL
  evidence:
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Total VMS duration (in years) (hot flashes or night sweats) and post-FMP persistence (in years) into postmenopause."
    explanation: >-
      The cohort's own definition of the phenotype pair, which is the basis for curating hot
      flushes and night sweats as the two phenotypes of this entry.
  sequelae:
  - target: Sleep Disturbance
    causal_link_type: DIRECT
    description: >-
      Nocturnal episodes fragment sleep, which is the route by which the vasomotor arm
      produces its commonest secondary complaint.
- category: Neurologic
  name: Sleep Disturbance
  description: >-
    Fragmented, non-restorative sleep, recorded here as a sequela of the night sweats
    rather than as an independent manifestation of the transition. The attribution is
    partial: sleep disturbance in the menopausal transition has causes besides vasomotor
    symptoms, and this entry claims only the part that follows the nocturnal episodes. The
    evidence is pharmacological - a neurokinin-targeted drug that reduces the vasomotor
    phenotype also improves measured sleep disturbance - rather than a direct demonstration
    that the sweats cause the fragmentation.
  phenotype_term:
    preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
    onset:
      onset_category: PERIMENOPAUSAL
  evidence:
  - reference: PMID:39172446
    reference_title: "Elinzanetant for the Treatment of Vasomotor Symptoms Associated With Menopause: OASIS 1 and 2 Randomized Clinical Trials."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elinzanetant improved sleep disturbances and menopause-related quality of life at week 12, and the safety profile was favorable."
    explanation: >-
      Establishes sleep disturbance as a measured, treatment-responsive component of the
      vasomotor syndrome in two phase 3 trials. Graded INDIRECT because improvement under a
      drug that also reduces flushes does not by itself show that the flushes caused the
      sleep disturbance.
environmental:
- name: Estrogen Withdrawal
  description: >-
    The hormonal change that drives the entry, recorded as an exposure record with the
    direction reversed, per the convention design decisions section 19 sets for a menopause
    fact of this kind: bind the hormonal state rather than the life stage, because ECTO has
    no menopause term and a life stage is not an exposure. The record covers the
    iatrogenic routes as well as the natural one - bilateral oophorectomy, gonadotropin-releasing
    hormone agonists, aromatase inhibitors and tamoxifen - because the vasomotor arm is
    reached by all of them, and because that is the population in which one of this entry's
    cited trials was conducted.
  presence: Present
  exposure_term:
    preferred_term: withdrawal of systemic estrogen exposure
    term:
      id: ECTO:9000010
      label: exposure to estrogens
    modifier: DECREASED
  causal_role: NECESSARY
  evidence:
  - reference: PMID:23150555
    reference_title: Role for kisspeptin/neurokinin B/dynorphin (KNDy) neurons in cutaneous vasodilatation and the estrogen modulation of body temperature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Estrogen withdrawal in menopausal women leads to hot flushes, a syndrome characterized by the episodic activation of heat dissipation effectors."
    explanation: >-
      The causal claim this exposure record makes, stated as the premise of a rat study.
      Quoted as BACKGROUND and graded HUMAN_CLINICAL because the sentence describes the
      human clinical phenomenon rather than the paper's own rodent result.
  influences_mechanisms:
  - target: Systemic Estradiol Withdrawal
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The fall in systemic estrogen exposure is the route by which the hormonal state at
      the root of this entry's chain is established, whether it arises from follicle-pool
      exhaustion, oophorectomy or endocrine therapy.
    evidence:
    - reference: PMID:23872331
      reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Withdrawal of gonadal steroids induces flushes in a variety of patients: women treated with tamoxifen for breast cancer, women with premature ovarian failure, aging men with diminished testosterone, and men with prostate carcinoma undergoing androgen ablation therapy"
      explanation: >-
        The edge's own evidence, and the source for this record covering the iatrogenic
        routes: the same phenotype follows gonadal steroid withdrawal however it is
        produced, in women and in men.
treatments:
- name: Fezolinetant
  description: >-
    A selective neurokinin-3 receptor antagonist, the first non-hormonal drug developed
    against this mechanism to reach approval. It acts at the preoptic receptor node and
    nowhere else in the chain - the follicle pool, the gonadotropin rise and the systemic
    estradiol fall are untouched - so its effect is the strongest pharmacological argument
    that the mechanism curated in this entry is the right one. Benefit appears within a
    week and is maintained over 52 weeks.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fezolinetant
      term:
        id: NCIT:C171845
        label: Fezolinetant
  target_mechanisms:
  - target: Increased Neurokinin B Signalling at NK3R in Preoptic Thermoregulatory Neurons
    treatment_effect: INHIBITS
    description: >-
      The drug blocks the receptor this node is named for, suppressing its output while
      leaving the hormonal state upstream unchanged.
  target_phenotypes:
  - preferred_term: Hot flashes
    term:
      id: HP:0031217
      label: Hot flashes
  evidence:
  - reference: PMID:36924778
    reference_title: "Fezolinetant for treatment of moderate-to-severe vasomotor symptoms associated with menopause (SKYLIGHT 1): a phase 3 randomised controlled study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Improvements in frequency and severity of vasomotor symptoms were observed after 1 week and maintained over 52 weeks.
    explanation: >-
      The onset and durability of the effect, from a 12-week randomised placebo-controlled
      phase 3 trial with a 40-week extension.
  - reference: PMID:36924778
    reference_title: "Fezolinetant for treatment of moderate-to-severe vasomotor symptoms associated with menopause (SKYLIGHT 1): a phase 3 randomised controlled study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Data support the clinical use of fezolinetant as a non-hormonal treatment for vasomotor symptoms associated with menopause.
    explanation: >-
      The trial's own conclusion, and the reason this treatment is recorded against the
      receptor node rather than against the hormone-withdrawal nodes above it.
  - reference: PMID:28385352
    reference_title: "Neurokinin 3 receptor antagonism as a novel treatment for menopausal hot flushes: a phase 2, randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: MLE4901 significantly reduced the total weekly number of hot flushes by 45 percentage points
    explanation: >-
      The proof-of-concept result for the whole drug class, obtained with an earlier
      neurokinin-3 receptor antagonist. Graded INDIRECT because the agent is MLE4901 rather
      than fezolinetant, so it supports this treatment row through the shared target.
  notes: >-
    MLE4901, the proof-of-concept antagonist cited here, was not developed further: three
    of 37 randomised participants developed a transaminase rise. Liver enzyme elevation is
    a recognised class effect and the SKYLIGHT 1 report records its incidence as low and
    the events as generally asymptomatic and transient; the trial record for both agents is
    in clinical_trials below.
- name: Elinzanetant
  description: >-
    A dual neurokinin-1 and neurokinin-3 receptor antagonist, curated as a separate
    treatment from fezolinetant rather than folded into a class row for two reasons: it
    adds an NK1 arm, which is a different pharmacology, and its phase 3 programme measured
    sleep disturbance and quality of life alongside flush frequency and improved both. Its
    separate trial in women on endocrine therapy for breast cancer also extends the
    mechanism to drug-induced withdrawal, a population for whom estrogen is contraindicated.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: elinzanetant
      term:
        id: NCIT:C174774
        label: Elinzanetant
  dosing_interval: once daily
  dosing_interval_days: 1.0
  target_mechanisms:
  - target: Increased Neurokinin B Signalling at NK3R in Preoptic Thermoregulatory Neurons
    treatment_effect: INHIBITS
    description: >-
      Blockade of the neurokinin-3 receptor at this node, with additional neurokinin-1
      receptor blockade whose contribution to the vasomotor effect is not separated by the
      trials cited.
  target_phenotypes:
  - preferred_term: Hot flashes
    term:
      id: HP:0031217
      label: Hot flashes
  - preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: PMID:39172446
    reference_title: "Elinzanetant for the Treatment of Vasomotor Symptoms Associated With Menopause: OASIS 1 and 2 Randomized Clinical Trials."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Elinzanetant was well tolerated and efficacious for moderate to severe menopausal VMS.
    explanation: >-
      The conclusion of two independent randomised double-blind phase 3 trials in 796
      postmenopausal participants.
  - reference: PMID:40454634
    reference_title: Elinzanetant for Vasomotor Symptoms from Endocrine Therapy for Breast Cancer.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Elinzanetant led to a significantly lower frequency of vasomotor symptoms associated with endocrine therapy than placebo.
    explanation: >-
      Extends the result to withdrawal produced by endocrine therapy rather than by
      follicle-pool exhaustion, which supports the entry's position that the mechanism is
      reached by more than one route. Graded INDIRECT because the population's withdrawal is
      drug-induced, so the inference to natural menopause is one step removed.

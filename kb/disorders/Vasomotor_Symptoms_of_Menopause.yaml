- name: Narrowed Thermoneutral Zone
  biological_scale: ORGANISM
  description: >-
    The interthreshold zone between the core temperatures at which sweating and shivering
    begin collapses to near zero in symptomatic postmenopausal women, against about 0.4
    degrees Celsius in asymptomatic ones. With no buffer, the small rises in core
    temperature that precede most flushes are enough to cross the sweating threshold, which
    is how an ordinary thermal, dietary or emotional stimulus comes to trigger a flush. The
    node explains two otherwise puzzling features recorded in its evidence: core temperature
    before a flush is normal, and placing a symptomatic woman in a cool environment
    suppresses flushes while warming her provokes them.
  biological_processes:
  - preferred_term: width of the thermoregulatory interthreshold zone
    term:
      id: GO:0001659
      label: temperature homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:10411797
    reference_title: Reduced thermoregulatory null zone in postmenopausal women with hot flashes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The women with symptoms had significantly smaller interthreshold zones than did the symptom-free women for all 3 measures of body temperature
    explanation: >-
      The measurement this node asserts, in symptomatic against asymptomatic postmenopausal
      women and consistent across three independent temperature measures.
  - reference: PMID:10411797
    reference_title: Reduced thermoregulatory null zone in postmenopausal women with hot flashes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Menopausal hot flashes in women with symptoms may be triggered by small elevations in body temperature acting within a reduced thermoneutral zone.
    explanation: >-
      The authors' own statement of the mechanism this node encodes, including the trigger
      half: it is the narrowed zone rather than an abnormal temperature that converts a
      small rise into a flush.
  - reference: PMID:10411797
    reference_title: Reduced thermoregulatory null zone in postmenopausal women with hot flashes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: During exercise all the women with symptoms and none of the women without symptoms had hot flashes.
    explanation: >-
      A within-study demonstration that raising core temperature inside the narrowed zone
      produces the phenotype, and in the same women whose zones were measured.
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the sensation of intense heat, the core temperature preceding the flush is normal."
    explanation: >-
      The feature this node exists to explain: a flush is not a fever, so the lesion is in

- name: Increased Neurokinin B Signalling at NK3R in Preoptic Thermoregulatory Neurons
  biological_scale: CELLULAR
  description: >-
    Neurokinin B released from the disinhibited arcuate population acts on neurokinin-3
    receptors in the median preoptic nucleus, part of the heat-defence pathway, and shifts
    the set point of the effectors it controls. This node is the entry's own rather than the
    module's: the module's notes state that it stops at the KNDy neuronal state and leaves
    the thermoregulatory steps to a vasomotor entry, naming the preoptic relay as one of
    them. It is also the node every drug in this entry acts on, which is the strongest
    argument for it: three neurokinin-3 receptor antagonists reduce flushes, and they touch
    nothing else in the chain. The direction of the receptor's own effect on temperature is
    recorded carefully in the cited review - activating the receptor in the median preoptic
    nucleus of the rat lowers body temperature - so the mapping from a raised ligand to a
    narrowed thermoneutral zone is not a simple one, and the description of the node below
    does not claim that it is.
  cell_types:
  - preferred_term: preoptic thermoregulatory neuron carrying the neurokinin-3 receptor
    description: >-
      Named in free text and not bound to a CL class. Searched OLS on 2026-11-14: CL
      "preoptic" returns one cell class, CL:4072012 A15 dopaminergic neuron, with the
      remaining hits anatomical terms from UBERON and the brain atlases; CL
      "thermoregulatory" returns nothing. CL has no class for a median preoptic
      thermoregulatory neuron, and binding the A15 dopaminergic population or a generic
      hypothalamic neuron class would assert a cell identity the cited sources do not
      establish. The anatomical location is bound instead.
  locations:
  - preferred_term: median preoptic nucleus
    term:
      id: UBERON:0002625
      label: median preoptic nucleus
  genes:
  - preferred_term: TACR3
    description: >-
      The gene encoding the neurokinin-3 receptor, the receptor this node is about and the
      target of every drug curated in this entry. Congenital loss of function in TACR3 or
      TAC3 causes hypogonadotropic hypogonadism, which is a different mechanism from the one
      modelled here and is deliberately not curated in this entry.
    term:
      id: hgnc:11528
      label: TACR3
  biological_processes:
  - preferred_term: neurokinin-3 receptor signalling in preoptic thermoregulatory neurons
    term:
      id: GO:0007217
      label: tachykinin receptor signaling pathway
    modifier: INCREASED
  molecular_functions:
  - preferred_term: neurokinin-3 receptor activity in the median preoptic nucleus
    term:
      id: GO:0004995
      label: tachykinin receptor activity
    modifier: INCREASED
  evidence:
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, activation of NK₃R in the median preoptic nucleus, part of the heat-defense pathway, reduces body temperature."
    explanation: >-
      Places the receptor in the heat-defence pathway and records the measured direction of
      its effect on core temperature. Quoted as it stands rather than paraphrased, because
      the direction is the awkward part of the hypothesis: raised neurokinin B signalling
      would be expected to lower core temperature, which is what a flush does once it
      starts, rather than to raise it. Graded INDIRECT and MODEL_ORGANISM because the
      pharmacology is in rat.
  - reference: PMID:25683060
    reference_title: Neurokinin B administration induces hot flushes in women.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight of ten participants experienced flushing during NKB infusion with none experiencing flushing during vehicle infusion (P = 0.0007)."
    explanation: >-
      The human experiment that makes this node sufficient rather than merely correlated:
      giving the ligand to healthy premenopausal women, in whom estrogen has not been
      withdrawn, produces the phenotype.
  downstream:
  - target: Narrowed Thermoneutral Zone
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered neurokinin-3 receptor signalling in the heat-defence pathway narrows the
      interthreshold zone between the sweating and shivering thresholds. The link is

      label: Hot flashes
  evidence:
  - reference: PMID:24045678
    reference_title: "Low-dose paroxetine 7.5 mg for menopausal vasomotor symptoms: two randomized controlled trials."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Paroxetine 7.5 mg is well-tolerated, is effective in reducing the frequency and severity of menopausal vasomotor symptoms, and demonstrates persistence of treatment benefit through 24 weeks of treatment."
    explanation: >-
      The conclusion of the two registration trials, covering frequency, severity and
      durability, which is the basis for curating this agent as a treatment rather than as a

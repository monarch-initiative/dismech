- name: Increased Neurokinin B Signalling at NK3R in Preoptic Thermoregulatory Neurons
  biological_scale: CELLULAR
  description: >-
    Neurokinin B released from the disinhibited arcuate population acts on neurokinin-3
    receptors in the median preoptic nucleus, part of the heat-defence pathway, and shifts
    the set point of the effectors it controls. This node is the entry's own rather than the
    module's: the module's notes state that it stops at the KNDy neuronal state and leaves
    the thermoregulatory steps to a vasomotor entry, naming the preoptic relay as one of
    them. It is the node the receptor antagonists in this entry act on, which is the
    strongest argument for it: three neurokinin-3 receptor antagonists reduce flushes
    without touching anything else in the chain. Two of the three, fezolinetant and
    elinzanetant, are curated as treatments below; the third is MLE4901, which was never
    developed past phase 2 and so is cited as proof-of-concept evidence on the fezolinetant
    row rather than carrying a treatment row of its own. The hormonal and non-hormonal
    treatments curated below act elsewhere - hormone therapy on the systemic node at the
    root, the others on targets this entry does not establish - which is why the argument
    from drug action is made from the antagonists alone. The direction of the receptor's own
    effect on temperature is recorded carefully in the cited review - activating the receptor in the median preoptic
    nucleus of the rat lowers body temperature - so the mapping from a raised ligand to a
    narrowed thermoneutral zone is not a simple one, and the description of the node below
    does not claim that it is.
  cell_types:
  - preferred_term: preoptic thermoregulatory neuron carrying the neurokinin-3 receptor
    description: >-
      Named in free text and not bound to a CL class. Searched OLS on 2026-11-14: CL
      "preoptic" returns one cell class, CL:4072012 A15 dopaminergic neuron, with the
      remaining hits anatomical terms from UBERON and the brain atlases; CL
      "thermoregulatory" returns nothing. CL has no class for a median preoptic
      thermoregulatory neuron, and binding the A15 dopaminergic population or a generic
      hypothalamic neuron class would assert a cell identity the cited sources do not
      establish. The anatomical location is bound instead.
  locations:
  - preferred_term: median preoptic nucleus
    term:
      id: UBERON:0002625
      label: median preoptic nucleus
  genes:
  - preferred_term: TACR3
    description: >-
      The gene encoding the neurokinin-3 receptor, the receptor this node is about and the
      target of every drug curated in this entry. Congenital loss of function in TACR3 or
      TAC3 causes hypogonadotropic hypogonadism, which is a different mechanism from the one
      modelled here and is deliberately not curated in this entry.
    term:
      id: hgnc:11528
      label: TACR3
  biological_processes:
  - preferred_term: neurokinin-3 receptor signalling in preoptic thermoregulatory neurons
    term:
      id: GO:0007217
      label: tachykinin receptor signaling pathway
    modifier: INCREASED
  molecular_functions:
  - preferred_term: neurokinin-3 receptor activity in the median preoptic nucleus
    term:

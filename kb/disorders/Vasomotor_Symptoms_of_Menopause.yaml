- name: Gabapentin
  description: >-
    An anticonvulsant used off-label for flushes. In a randomised double-blind
    placebo-controlled trial in 59 postmenopausal women having seven or more flushes a day,
    900 mg daily for 12 weeks cut flush frequency by 45% from baseline against 29% on
    placebo, and the composite frequency-and-severity score by 54% against 31%. Tolerance
    is the limit rather than efficacy: half the treated group reported at least one adverse
    event against a little over a quarter on placebo, and four treated participants
    withdrew for that reason, which is why the drug sits behind the approved agents rather
    than beside them.

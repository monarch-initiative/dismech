    snippet: Elinzanetant led to a significantly lower frequency of vasomotor symptoms associated with endocrine therapy than placebo.
    explanation: >-
      Extends the result to withdrawal produced by endocrine therapy rather than by
      follicle-pool exhaustion, which supports the entry's position that the mechanism is
      reached by more than one route. Graded INDIRECT because the population's withdrawal is
      drug-induced, so the inference to natural menopause is one step removed.
- name: Low-Dose Paroxetine
  description: >-
    Paroxetine mesylate 7.5 mg once daily, approved for moderate-to-severe vasomotor
    symptoms and, until the neurokinin-3 receptor antagonists arrived, the only approved
    non-hormonal treatment for them. The dose is well below the lowest antidepressant dose
    and was developed for this indication rather than borrowed from the psychiatric one.
    Two multicentre double-blind placebo-controlled phase 3 trials randomised 1,184
    postmenopausal women; all four primary endpoints were met in the 24-week study and
    three of four in the 12-week study, with the benefit still present at week 24. The
    effect is smaller than hormone therapy's.

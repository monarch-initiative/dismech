- name: Psychosocial Intervention including Cognitive Behavioural Therapy
  description: >-
    Cognitive behavioural therapy and related psychosocial interventions, the one
    non-pharmacological option curated here. What it changes is how much the symptoms
    intrude rather than how often they occur, and that distinction decides what it can be
    compared with: a systematic review of 28 randomised trials in 2,887 women, 24 pooled,
    found medium-to-large reductions in the bothersomeness of hot flushes and night sweats,
    held at medium-term follow-up, while the effects on frequency and severity were smaller.
    Sleep quality and insomnia improved as well, which matters for the sleep-disturbance
    sequela this entry records, and urogenital and sexual outcomes did not, which is a
    boundary against the genitourinary syndrome curated separately. Cognitive behavioural
    therapy is the form the review singles out. Retention across the trials averaged 87%, so
    the intervention is deliverable as well as effective.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: psychosocial intervention, including cognitive behavioural therapy
    term:
      id: NCIT:C63474
      label: "Behavioral, Psychological or Informational Intervention"
  target_phenotypes:

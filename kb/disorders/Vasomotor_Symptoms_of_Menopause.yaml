prevalence:
- population: Menopausal women, worldwide
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 70000.0
  rate_low: 70000.0
  rate_high: 80000.0
  rate_denominator: POPULATION
  notes: >-
    The two published figures the cited sources carry, as a range rather than a point: 70%
    of menopausal women in one and up to 80% during the transition in the other. Both are
    background statements citing earlier epidemiology rather than new measurements, and
    neither names the measure it reports, so the measure type is recorded as the lifetime
    prevalence the wording implies - the proportion of women who experience the symptoms at
    some point in the transition - and not as a point prevalence. The denominator is
    menopausal women, not the general population.
  evidence:
  - reference: PMID:28385352
    reference_title: "Neurokinin 3 receptor antagonism as a novel treatment for menopausal hot flushes: a phase 2, randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Hot flushes affect 70% of menopausal women
    explanation: >-
      The lower of the two published figures. Quoted as BACKGROUND because it is the trial
      report's framing sentence rather than its own result.
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Up to 80% of women experience VMS during the MT
    explanation: >-
      The upper figure, likewise a background statement in a paper whose own result is the
      duration recorded under progression.
progression:
- phase: Perimenopausal onset
  age_range: from the onset of cycle irregularity to the final menstrual period
  notes: >-
    Symptoms most often begin before the final menstrual period, while estradiol is still
    fluctuating widely, which is what the rate-of-withdrawal mechanism predicts. In the
    SWAN cohort the stage at which symptoms began was the strongest predictor of how long
    they lasted: women who were premenopausal or early perimenopausal at first report had a
    median total duration above 11.8 years, against 3.4 years for women whose symptoms began
    after the final menstrual period.
  evidence:
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women who were premenopausal or early perimenopausal when they first reported frequent VMS had the longest total VMS duration (median, >11.8 years) and post-FMP persistence (median, 9.4 years)."
    explanation: >-
      The stage-dependence of duration, measured prospectively across a median of 13 visits
      in 1449 women with frequent symptoms.
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women who were postmenopausal at the onset of VMS had the shortest total VMS duration (median, 3.4 years)."
    explanation: >-
      The contrasting arm of the same finding, which is what makes the comparison in this
      phase's notes a measured one.
- phase: Postmenopausal persistence
  age_range: from the final menstrual period onward, median 4.5 years
  notes: >-
    Symptoms do not stop at the final menstrual period. The median total duration of
    frequent symptoms in the SWAN cohort was 7.4 years and the median persistence after the
    final menstrual period was 4.5 years, with African American women reporting the longest
    total duration of any group at a median of 10.1 years. This is the figure that bears on
    treatment decisions, and it is why the duration-limited counselling that once
    accompanied this diagnosis was revised.
  evidence:
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The median total VMS duration was 7.4 years.
    explanation: >-
      The headline duration figure of the cohort.
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 881 women who experienced an observable FMP, the median post-FMP persistence was 4.5 years."
    explanation: >-
      The persistence figure recorded in this phase's age range, from the subset with an
      observed final menstrual period.
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with women of other racial/ethnic groups, African American women reported the longest total VMS duration (median, 10.1 years)."
    explanation: >-
      The between-group difference in duration, recorded because it is the largest reported
      and because this entry's prevalence record carries no such stratification.
- phase: Remission
  age_range: variable, usually years after the final menstrual period
  notes: >-
    Most but not all women eventually accommodate the low-estrogen state and the symptoms
    disappear. The accommodation is not a loss of responsiveness: giving estrogen and then
    withdrawing it can bring the flushes back in a woman whose symptoms had remitted, which
    is consistent with the rate-of-withdrawal account at the root of this entry rather than
    with depletion of the mechanism.
  evidence:
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Eventually, most (but not all) postmenopausal women will acclimate to the low estrogen level, and the flushes will disappear"
    explanation: >-
      States the remission this phase records, with the qualification that it is not
      universal.
  - reference: PMID:23872331
    reference_title: "Modulation of body temperature and LH secretion by hypothalamic KNDy (kisspeptin, neurokinin B and dynorphin) neurons: a novel hypothesis on the mechanism of hot flushes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "However, even in these women, hot flushes may reoccur if estrogens are administered and then withdrawn"
    explanation: >-
      The reason remission is recorded as accommodation rather than as resolution of the
      mechanism: the response can be reinstated by a fresh withdrawal.
discussions:
- discussion_id: vms_nkb_to_thermoneutral_zone_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what route does raised neurokinin B signalling at the neurokinin-3 receptor narrow
    the thermoregulatory interthreshold zone, and why does blocking that receptor relieve
    flushes when activating it in the rat median preoptic nucleus lowers body temperature?
  rationale: >-
    Both ends of this step are established and the step itself is not. Upstream, the
    arcuate hypertrophy and the raised neurokinin B transcripts are measured in human
    postmortem tissue, the change is induced by ovariectomy and reversed by estrogen in
    primates, infused neurokinin B reproduces flushes in healthy premenopausal women, and
    three receptor antagonists reduce them in randomised trials. Downstream, the
    interthreshold zone is measured as collapsed in symptomatic postmenopausal women. No
    cited work traces the neurokinin signal to that threshold change, and the sign of the
    receptor's own thermoregulatory effect runs the other way: activating the receptor in
    the rat median preoptic nucleus reduces body temperature. A mechanism that reconciles
    those would predict which patients respond to receptor blockade, which the trials do
    not currently do. The ablation experiment also showed that estradiol's effect on skin
    temperature was blocked only in the light phase, so at least one estrogen-dependent
    thermoregulatory route lies outside this population.
  attaches_to:
  - pathophysiology#Increased Neurokinin B Signalling at NK3R in Preoptic Thermoregulatory Neurons
  - pathophysiology#Narrowed Thermoneutral Zone
- discussion_id: vms_mondo_term_absent
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should MONDO carry a class for the vasomotor symptoms of menopause, and if so where
    should it sit?
  rationale: >-
    This entry has no disease_term because MONDO has no class for the concept. Searches of
    MONDO through OLS on 2026-11-14 for "vasomotor symptom", "hot flash", "hot flush" and
    "menopausal syndrome" return no matching class; the only hits match incidental words in
    other classes' definitions or synonyms, and the four MONDO classes whose labels carry
    the word "menopause" are premature menopause, postmenopausal osteoporosis,
    postmenopausal atrophic vaginitis and a malformation syndrome. The concept is
    nonetheless a named, diagnosed and separately treated clinical entity with two approved
    drugs and four phase 3 trial programmes, and it is coded in ICD-10-CM within N95.1. A
    MONDO term request, sibling to postmenopausal atrophic vaginitis, would let the entry
    carry a disease_term and would let the curation queue account for it. It has not been
    filed.
  attaches_to:
  - disease#Vasomotor Symptoms of Menopause
notes: >-
  Anchoring. The entry carries no disease_term, because MONDO has no class for the concept:
  searches of MONDO through OLS on 2026-11-14 for "vasomotor symptom", "hot flash", "hot
  flush" and "menopausal syndrome" returned no matching class. Design decisions section 19
  records the same finding and names HP:0031217 Hot flashes as the only identifier the
  concept has. The entry is therefore HP-bound at the phenotype level and the MONDO gap is
  recorded as a discussion above rather than papered over with a proxy class: in
  particular, MONDO:0001410 postmenopausal atrophic vaginitis is a different disorder of
  the same transition and is bound by the Genitourinary_Syndrome_of_Menopause entry, and
  GO:0042697 menopause is a phase term GO itself excludes from direct annotation, so
  neither is used here.

  ICD-11, and what could not be verified. No ICD-11 Foundation entity is asserted, and this
  is a limit of the session rather than a judgement that none exists. The WHO ICD-11 API at
  id.who.int requires an OAuth2 client credential and returns HTTP 401 without one; the
  ICD-11 browser's search endpoints returned 404 or a redirect; OLS does not host ICD-11;
  cache/icd11f/terms.csv holds 24 rows, none menopause-related; and the icd11f SQLite build
  the term validator would need is outside this session's disk budget. ICD-10-CM was
  reachable and is used instead. The N95 block was read from the NLM Clinical Table Search
  Service, which returned five codes - N95.0 Postmenopausal bleeding, N95.1 Menopausal and
  female climacteric states, N95.2 Postmenopausal atrophic vaginitis, N95.8 and N95.9 - and
  ICD10CM:N95.1 was then resolved against the local ICD-10-CM build, which gives the same
  label and places it under ICD10CM:N95 "Menopausal and other perimenopausal disorders".
  What was not verified is the code's inclusion notes: ICD-10-CM's tabular list is
  understood to file flushing under N95.1, but neither source read here returns the
  inclusion terms, so the mapping justification argues the code is broader than this entry
  from its label alone.

  GeneReviews. No chapter covers this syndrome, and none is expected: it has no Mendelian
  basis. `just check-genereviews` reports NO_CHAPTER against the entry's name, synonyms
  and mappings. StatPearls carries a chapter titled "Hot Flashes" (PMID:30969649), which
  is not cited, because StatPearls is never a phenotype baseline. The phenotype set here
  is the hot-flush and night-sweat pair the SWAN cohort and every cited trial measure.

  Conformance. Three nodes conform to menopausal_estrogen_withdrawal: the systemic node, the
  receptor node, and the KNDy node, which is the arm the module carries because its
  mechanism is conserved rather than tissue-specific. The module's notes state that it
  stops at the KNDy neuronal state and that the narrowed thermoneutral zone, the median
  preoptic relay, cutaneous vasodilatation and sweating are the steps a vasomotor entry
  would add; those are the three nodes below the conformance boundary here and they are
  this entry's own. The receptor-node substitution is narrower than the module's generic
  one: estrogen receptor alpha only, because co-expression of kisspeptin, neurokinin B and
  that receptor has been identified only in arcuate neurons, so ESR2 is not bound. The
  module's own Neurokinin-3 Receptor Antagonism treatment is not duplicated: the two
  treatment rows here are per-agent, carry their own trial evidence and their own trial
  registrations, and target this entry's preoptic receptor node rather than the module's
  KNDy node.

  Out of scope. Congenital loss of function in TACR3 or TAC3 causes hypogonadotropic
  hypogonadism, not this syndrome, and the module's notes forbid conforming such an entry
  to the KNDy node; it is named in the TACR3 descriptor so the distinction is visible where
  the gene is bound. Sleep disturbance is curated as a sequela of night sweats and claims
  only that part of the transition's sleep complaint; the mood, cognitive and
  musculoskeletal symptoms of the transition are not in this entry, and neither is the
  cardiovascular risk association that the SWAN cohort reports for vasomotor symptoms,
  which would need its own evidence.

  Treatments not curated. Menopausal hormone therapy is the most effective treatment for
  this phenotype and is deliberately absent: it would need its own trial evidence and its
  own account of the Women's Health Initiative risk findings, which this pass did not
  gather, and adding it on the strength of the cited reviews' passing mentions would put an
  unsourced treatment row in the entry. The same applies to the selective serotonin and
  serotonin-noradrenaline reuptake inhibitors, gabapentin, oxybutynin and cognitive
  behavioural therapy. Design decisions section 19 separately forbids reusing NCIT:C15599
  Hormone Replacement Therapy off-label, which is not at issue here because no hormonal
  treatment is curated.

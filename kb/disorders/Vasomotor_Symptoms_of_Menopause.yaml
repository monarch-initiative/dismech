  - reference: PMID:24045678
    reference_title: "Low-dose paroxetine 7.5 mg for menopausal vasomotor symptoms: two randomized controlled trials."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both studies, paroxetine 7.5 mg significantly reduced the mean weekly vasomotor symptom frequency compared with placebo on week 4"
    explanation: >-
      The frequency result replicated across both trials, which is the endpoint this entry's
      phenotypes are measured on.
  - reference: PMID:26348174
    reference_title: Management of Menopausal Symptoms.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: A low-dose formulation of paroxetine mesylate currently represents the only nonhormonal medication FDA-approved to treat vasomotor symptoms.
    explanation: >-
      The regulatory standing this row records. "Currently" is 2015, before either
      neurokinin-3 receptor antagonist was approved, which is the sense in which this row's
      description calls it the only approved non-hormonal treatment of its time.
  notes: >-
    Paroxetine at antidepressant doses is a different treatment and is not curated here. The
    nearest trial, a pilot of 20 mg daily against placebo in 90 Honduran women within six
    months of bilateral salpingo-oophorectomy, reports a Menopause Rating Scale benefit
    but is a pilot with 14% attrition in a surgically menopausal population, and its own
    authors call for larger trials; it is listed under references and carries no evidence
    item.

    No target_mechanisms link is recorded, because no route from a serotonergic agent to any
    node in this entry's chain is established. The only account the sources cited in this
    entry offer is a background sentence in the oxybutynin trial naming norepinephrine,
    serotonin and acetylcholine among the neurotransmitters implicated in a pathophysiology
    it describes as not fully understood, which names no node here. The entry's own
    knowledge gap on the step from neurokinin signalling to the thermoneutral zone is the
    same hole seen from the other side.
- name: Serotonergic Antidepressant Therapy
  description: >-
    Selective serotonin and serotonin-noradrenaline reuptake inhibitors other than the
    approved low-dose paroxetine, used off-label and widely enough that one of the trials
    cited here calls venlafaxine a first-line treatment for a woman unable or unwilling to
    take oestrogen. Two randomised placebo-controlled trials are curated. Escitalopram 10
    to 20 mg daily in 205 women halved flush frequency in 55% of the treated group against
    36% on placebo, and reduced severity as well; three weeks after it was stopped the
    treated women reported 1.6 more flushes a day than the placebo group, so the benefit
    does not outlast the drug. Venlafaxine extended release 75 mg daily, in the three-arm
    MsFLASH trial that also tested low-dose oestradiol, reduced symptoms by 1.8 more per
    day than placebo and came 0.6 per day short of the oestrogen arm.

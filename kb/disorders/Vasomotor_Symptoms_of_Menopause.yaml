prevalence:
- population: Menopausal women, worldwide
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 70000.0
  rate_low: 70000.0
  rate_high: 80000.0
  rate_denominator: POPULATION
  notes: >-
    The two published figures the cited sources carry, as a range rather than a point: 70%
    of menopausal women in one and up to 80% during the transition in the other. Both are
    background statements citing earlier epidemiology rather than new measurements, and
    neither names the measure it reports, so the measure type is recorded as the lifetime
    prevalence the wording implies - the proportion of women who experience the symptoms at
    some point in the transition - and not as a point prevalence. The denominator is
    menopausal women, not the general population.
  evidence:
  - reference: PMID:28385352
    reference_title: "Neurokinin 3 receptor antagonism as a novel treatment for menopausal hot flushes: a phase 2, randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Hot flushes affect 70% of menopausal women
    explanation: >-
      The lower of the two published figures. Quoted as BACKGROUND because it is the trial
      report's framing sentence rather than its own result.
  - reference: PMID:25686030
    reference_title: Duration of menopausal vasomotor symptoms over the menopause transition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Up to 80% of women experience VMS during the MT
    explanation: >-
      The upper figure, likewise a background statement in a paper whose own result is the
      duration recorded under progression.
- population: Perimenopausal and postmenopausal women aged 40 to 65, five global regions
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 54290.0
  rate_low: 54290.0
  rate_high: 74230.0
  rate_denominator: POPULATION
  notes: >-
    The measured counterpart of the record above, kept separate rather than merged with it
    because it reports a different measure on a different basis: a random-effects
    meta-analysis of 41 population-based studies published from 2014, in 28,955 women,
    pooling the proportion reporting vasomotor symptoms within each of five regions. The
    range is the spread of the regional pooled estimates, 54.29% in Africa to 74.23% in the
    Americas and Europe; no single global pooled figure is published, so the point value
    records the lowest regional estimate rather than an invented midpoint, and the range is
    where the information is. Heterogeneity was above 97%, which the authors read as
    cultural and methodological rather than biological variation, so the regional ordering
    should not be treated as a finding. These figures are what the FREQUENT bands on the two
    phenotypes rest on.
  evidence:
  - reference: PMID:42747278
    reference_title: "Global prevalence of vasomotor symptoms in the menopause transition: systematic review and meta-analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Pooled prevalence estimates ranged from 54.29% in Africa to 74.23% in the Americas and Europe.
    explanation: >-

- accession: geo:GSE271649
  title: Small RNA-seq analysis of circulating miRNAs in Cushing's syndrome
  description: Patients with Cushing’s syndrome (Cushing's syndrome) in remission show sustained fatigue, myopathy, and an increased prevalence of sarcopenia. The mechanisms that determine these persistent muscle problems are not well known. We aimed to identify circulating microRNAs (miRNAs) with differential expression that could be potential biomarkers for the diagnosis and/or prognosis in Cushing's syndrome.

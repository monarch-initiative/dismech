- accession: geo:GSE4060
  title: Transcriptome of GIP- and ACTH-dependent Cushing's syndrome.
  description: 'Abstract submitted to the Journal of clinical encodcrinology and metabolism: The molecular mechanisms responsible for the ectopic expression of the GIP receptor in the adrenal cortex of patients with GIP-dependent Cushing’s syndrome (CS) are unknown. Chronic adrenal stimulation by ACTH in Cushing’s disease (CD) or by GIP in GIP-dependent AIMAH both lead to induction of a set of genes which stimulate adrenal proliferation and steroidogenesis.'

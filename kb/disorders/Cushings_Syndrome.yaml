    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 36
  publication: PMID:39086897
  notes: Identified by GEO DataSets index search for Cushing's Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE156693
  title: Circulating miRNA sequencing in serum of patients with Cushing's syndrome and related controls
  description: 'Cushing’s syndrome (CS) is a rare disease with high morbidity and mortality. Diagnosis and subtyping are complex and challenging. Circulating microRNAs were described to be useful as minimally invasive diagnostic markers. Our aim was to determine and compare the circulating microRNA expression profiles of patients with CS and controls. We included three groups of patients of the German Cushing’s registry: A.) patients with florid adrenal dependent CS scheduled for adrenalectomy (CPA); B.) patients with florid pituitary dependent CS scheduled for surgery (CD); and C.) patients in whom CS had been ruled out (controls).'

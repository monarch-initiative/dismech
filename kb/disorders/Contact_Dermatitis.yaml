  effect: TRIGGERS
experimental_models:
- name: Human Cell Line Activation Test (h-CLAT)
  description: >-
    An OECD TG 442E method that reads sensitizer-induced activation of a
    dendritic-cell surrogate as CD86 and CD54 surface expression on the THP-1
    human monocytic leukemia line after 24 hours of chemical exposure.
  experimental_model_type: CELL_LINE
  publication: PMID:20510347
  modeled_mechanisms:
  - target: Skin innate immune activation during sensitization
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reads the dendritic-cell activation step of sensitization as two
      costimulatory and adhesion markers on a monocytic line.
    limitations: >-
      THP-1 is a monocytic leukemia line, not a dendritic cell, so marker
      upregulation stands in for antigen-presenting-cell activation rather than
      demonstrating it. About 15% of outcomes were misclassified in the COLIPA
      ring trials, with weak allergens and poorly soluble chemicals named as the
      failure classes. The assay reads a hazard call and carries little potency
      information, and being cell-only it cannot activate pro-haptens.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        CD86 and CD54 are the measured quantity; dendritic-cell activation in
        skin is the quantity of interest.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The assay observes single cells in suspension; the node is tissue-scale
        innate activation in skin. Nothing in the readout reports the tissue
        context — no keratinocyte crosstalk, no migration, no barrier — so the
        step from marker induction to skin-level activation is inferred.
    evidence:
    - reference: PMID:20510347
      reference_title: "Predicting skin sensitization potential and inter-laboratory reproducibility of a human Cell Line Activation Test (h-CLAT) in the European Cosmetics Association (COLIPA) ring trials."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        The human Cell Line Activation Test (h-CLAT) examines the level of CD86
        and CD54 expression on the surface of THP-1 cells, a human monocytic
        leukemia cell line, following 24h of chemical exposure.
      explanation: >-
        States the measured readout and the cell provenance, which is what fixes
        this model to the dendritic-cell activation step and bounds what it can
        show.
  evidence:
  - reference: PMID:20510347
    reference_title: "Predicting skin sensitization potential and inter-laboratory reproducibility of a human Cell Line Activation Test (h-CLAT) in the European Cosmetics Association (COLIPA) ring trials."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      From the RT data, the feasibility of utilizing cell lines as surrogate DC
      in development of in vitro skin sensitization methods shows promise.
    explanation: >-
      States what the ring trials establish about the model itself: that a cell
      line can serve as a dendritic-cell surrogate for this purpose. The assay's
      15% misclassification rate is the counterweight, and it is recorded in the
      link's limitations rather than here, because model-level evidence attests
      that the model is informative.
- name: GARDskin
  description: >-
    An OECD TG 442E method that reads sensitizer-induced activation of a
    dendritic-cell-like line as a multi-gene transcriptional signature rather
    than as individual surface markers.
  experimental_model_type: CELL_LINE
  publication: PMID:31099396
  modeled_mechanisms:
  - target: Skin innate immune activation during sensitization
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reads the dendritic-cell activation step as induced transcriptional change
      across co-stimulatory, stress and xenobiotic-response programs.
    limitations: >-
      The readout is a trained signature in the MUTZ-3 dendritic-cell-like
      myeloid line, so the prediction is model-dependent and the cell is a
      surrogate rather than a primary dendritic cell. Reported accuracy is tied
      to the 28-chemical blinded ring-trial set.
    divergences:
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The signature is measured in a single cultured cell type; the node is
        tissue-scale innate activation in skin. The transcriptional programs read
        out are cell-intrinsic, so the tissue-level claim is inferred rather than
        observed.
    evidence:
    - reference: PMID:31099396
      reference_title: "Validation of the GARD™skin Assay for Assessment of Chemical Skin Sensitizers: Ring Trial Results of Predictive Performance and Reproducibility."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        The methodology is based on a dendritic cell (DC)-like cell line, thus
        mimicking the mechanistic events leading to initiation and modulation of
        downstream immunological responses.
      explanation: >-
        States the biological basis the method claims, which is what maps it to
        the dendritic-cell activation step of sensitization.
- name: Human T-cell priming assay
  description: >-
    A co-culture of sorted naive human T cells with monocyte-derived dendritic
    cells pulsed with the test chemical, reading antigen-specific priming as
    IFN-gamma and TNF-alpha production at single-cell level.
  experimental_model_type: CO_CULTURE
  publication: PMID:22906571
  modeled_mechanisms:
  - target: Allergen-specific T-cell priming
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Primes an allergen-specific human T-cell response in vitro, which is the
      step this node asserts, using primary human cells on both sides of the
      interaction.
    limitations: >-
      The assay is not regulatory-validated and is low-throughput, and
      donor-to-donor variability is not yet well defined. It establishes that
      priming occurs in human cells but cannot establish the whole-organism
      adverse outcome.
    evidence:
    - reference: PMID:22906571
      reference_title: "Human T cell priming assay (hTCPA) for the identification of contact allergens based on naive T cells and DC--IFN-γ and TNF-α readout."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Using sorted naïve T cells and monocyte-derived dendritic cells pulsed
        with the test chemical or with chemical-protein conjugates, the
        successful priming of an antigen-specific T cell response is controlled
        after antigen-specific restimulation by cytokine readout.
      explanation: >-
        Describes priming of a chemical-specific naive human T-cell response,
        which is the mechanism this pathograph node records.
- name: Full-thickness skin equivalent with MUTZ-3-derived Langerhans cells
  description: >-
    An immunocompetent full-thickness skin equivalent whose epidermis carries
    keratinocytes, melanocytes and CD1a+ Langerin+ HLA-DR+ Langerhans cells
    derived from the MUTZ-3 line, over a fibroblast-populated dermis.
  experimental_model_type: CO_CULTURE
  publication: PMID:21697260
  modeled_mechanisms:
  - target: Skin innate immune activation during sensitization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces allergen-driven Langerhans cell maturation together with
      migration out of the epidermis toward the dermal compartment, which the
      monolayer dendritic-cell assays cannot show.
    limitations: >-
      The Langerhans cells are MUTZ-3-derived surrogates rather than primary
      cells, and the system is a research model without regulatory validation.
    evidence:
    - reference: PMID:21697260
      reference_title: "Technical advance: Langerhans cells derived from a human cell line in a full-thickness skin equivalent undergo allergen-induced maturation and migration."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Exposure of the SE to subtoxic concentrations of the allergens NiSO(4)
        and resorcinol resulted in LC migration out of the epidermis toward the
        fibroblast-populated dermal compartment.
      explanation: >-
        Demonstrates allergen-driven migration of epidermal Langerhans cells,
        the physical step of innate activation during sensitization that
        monolayer assays omit.
- name: Keratinocyte Keap1-Nrf2-ARE sensitizer-response models
  description: >-
    Four keratinocyte-based systems — primary human keratinocytes, N/TERT
    monolayers, and the Leiden and N/TERT reconstructed epidermal models — read
    for Nrf2 protein, nuclear translocation and Nrf2 target activation after
    exposure to a sensitizer versus an irritant. This is the biology OECD TG
    442D methods (KeratinoSens, LuSens) measure.
  experimental_model_type: OTHER
  publication: PMID:24794257
  modeled_mechanisms:
  - target: Keratinocyte activation and proinflammatory mediator release
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Measures keratinocyte activation through one electrophile-sensing pathway,
      and separates sensitizer-driven from irritant-driven activation.
    limitations: >-
      This node is curated as the irritant arm's keratinocyte step, downstream of
      barrier disruption, whereas these models activate keratinocytes through
      hapten electrophilicity with no barrier injury — the entry has no separate
      hapten-driven keratinocyte node, which is recorded as a knowledge gap.
      Induction of one transcription-factor pathway is also narrower than
      keratinocyte activation, which in skin also runs through IL-1 family
      danger signals.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The models are driven by hapten electrophilicity; the linked node is
        driven by irritant barrier injury.
    evidence:
    - reference: PMID:24794257
      reference_title: "Performance of the N/TERT epidermal model for skin sensitizer identification via Nrf2-Keap1-ARE pathway activation."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Results show that the Keap1-Nrf2-ARE pathway is activated by the
        sensitizer DNCB in monolayer keratinocytes and as well as the LEMs and
        NEMs and not by the irritant SDS.
      explanation: >-
        Establishes that this keratinocyte readout responds to a sensitizer and
        not to an irritant, which is both why it measures the key event and why
        it does not sit on the irritant-driven node.
animal_models:
- name: Langerin-DTA Langerhans-cell-deficient mouse
  species: Mus musculus
  genotype: human Langerin promoter-driven diphtheria toxin A BAC transgenic
  description: >-
    A BAC transgenic mouse with constitutive, durable absence of epidermal
    Langerhans cells and otherwise intact immunity, used to test whether
    Langerhans cells are required to prime contact hypersensitivity.
  publication: PMID:16356859
  modeled_mechanisms:
  - target: Skin innate immune activation during sensitization
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Removes Langerhans cells and shows contact hypersensitivity is amplified
      rather than abolished, so Langerhans cells are dispensable for priming and
      act to restrain it. This revises the antigen-presenting-cell assumption
      this node inherits.
    limitations: >-
      Mouse genetic ablation; the dendritic-cell subset that primes the response
      in the absence of Langerhans cells is not identified, in this work or
      since, and the human priming antigen-presenting cell remains unresolved.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The requirement was tested in mouse contact hypersensitivity; no
        equivalent human ablation experiment exists.
    evidence:
    - reference: PMID:16356859
      reference_title: "Epidermal langerhans cell-deficient mice develop enhanced contact hypersensitivity."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Unexpectedly, we found that contact hypersensitivity (CHS) was amplified
        rather than abrogated in the absence of LCs.
      explanation: >-
        Establishes what this model is informative for: ablating Langerhans cells
        changes contact hypersensitivity, and in the direction opposite to an
        obligatory priming role, which is what makes the model a usable probe of
        this node rather than a confirmation of it.
- name: NALP3- and ASC-deficient contact hypersensitivity mouse
  species: Mus musculus
  genotype: Nlrp3-deficient or Pycard (ASC)-deficient
  description: >-
    Inflammasome-component knockouts exposed to contact sensitizers, used to test
    whether keratinocyte inflammasome signaling is required for the innate arm of
    contact hypersensitivity.
  publication: PMID:17429439
  modeled_mechanisms:
  - target: Keratinocyte activation and proinflammatory mediator release
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Shows that loss of NALP3 or ASC impairs the response to contact
      sensitizers, establishing caspase-1-dependent IL-1beta and IL-18
      processing in keratinocytes as a required part of the activation step.
    limitations: >-
      Mouse knockouts; the companion human evidence is in keratinocytes in
      vitro rather than in human skin.
    evidence:
    - reference: PMID:17429439
      reference_title: "Activation of the IL-1beta-processing inflammasome is involved in contact hypersensitivity."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We also show that ASC- and NALP3-deficient mice display an impaired
        response to CS.
      explanation: >-
        Establishes the inflammasome as required for the contact-sensitizer
        response, which is what links this genotype to the keratinocyte
        activation step.
- name: DNFB contact hypersensitivity regulatory T-cell model
  species: Mus musculus
  genotype: wild type, with FoxP3 reporter strains for Treg origin
  description: >-
    A 2,4-dinitrofluorobenzene contact hypersensitivity model used to
    characterize the regulatory T-cell population that restrains priming of
    effector CD8+ T cells.
  publication: PMID:20624644
  modeled_mechanisms:
  - target: Breakdown of regulatory T-cell-mediated hapten tolerance
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Measures the regulatory arm whose failure this node asserts, rather than
      reproducing that failure. Hapten immunization of wild-type mice induces a
      CD4+CD25+ regulatory T-cell population that suppresses hapten-reactive
      CD8+ effectors in a hapten-specific manner, so the model shows the
      suppression intact and characterizes the population whose loss the node
      records.
    limitations: >-
      Mouse contact hypersensitivity; the human counterpart evidence for
      hapten tolerance is in vitro nickel-responsiveness in healthy donors
      rather than in vivo.
    evidence:
    - reference: PMID:20624644
      reference_title: "Inducible costimulator (ICOS) is a marker for highly suppressive antigen-specific T cells sharing features of TH17/TH1 and regulatory T cells."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        2,4-Dinitrofluorobenzene immunization induced a population of
        CD4(+)CD25(+) Treg cells that controlled CD8(+) T-cell effector
        responses in a hapten-specific manner in vivo.
      explanation: >-
        Establishes hapten-specific regulatory T-cell control of the effector
        arm, the mechanism whose breakdown this node asserts.
- name: Mouse local lymph node assay
  species: Mus musculus
  genotype: wild type
  description: >-
    The regulatory animal method (OECD TG 429, 442A, 442B) that reads
    sensitization as proliferation of T cells in the lymph node draining the
    site of dermal exposure.
  publication: PMID:24532485
  modeled_mechanisms:
  - target: Allergen-specific T-cell priming
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reads draining-lymph-node T-cell proliferation after dermal exposure, so
      it integrates penetration, metabolism, antigen-presenting-cell migration
      and clonal expansion in one whole-organism readout.
    limitations: >-
      Mouse; it misses metal sensitizers, with nickel sulfate hexahydrate
      recorded as a false negative, which is consistent with metals initiating
      through human TLR4 rather than covalent binding. Potency estimates are
      also vehicle-dependent.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The nickel false negative is mechanistically explained by human-specific
        TLR4 coordination that mouse TLR4 cannot reproduce.
    evidence:
    - reference: PMID:24532485
      reference_title: "Development and utilization of an ex vivo bromodeoxyuridine local lymph node assay protocol for assessing potential chemical sensitizers."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Exposure to a dermal sensitizer results in proliferation of local lymph
        node T cells
      explanation: >-
        States what the assay measures, which is the lymph-node priming step
        this node records. Cut before the isotope label, whose bracketed form
        the snippet validator normalizes away.
    - reference: PMID:24532485
      reference_title: "Development and utilization of an ex vivo bromodeoxyuridine local lymph node assay protocol for assessing potential chemical sensitizers."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        As anticipated, neither non-sensitizers isopropanol and lactic acid nor
        the false negative chemical nickel II sulfate hexahydrate induced a
        positive threshold response in the assay.
      explanation: >-
        Records nickel as a known false negative of the assay, treated by the
        authors as expected behaviour rather than an anomaly.
- name: Guinea pig maximization test
  species: Cavia porcellus
  genotype: wild type
  description: >-
    The more sensitive of the two guinea pig methods recommended by OECD TG 406.
    Induction combines intradermal injection with adjuvant and a topical
    application; after a rest interval the animal is challenged with a patch at
    a non-irritant concentration and the dermal reaction is graded by eye.
  publication: PMID:11028857
  modeled_mechanisms:
  - target: Re-exposure-driven effector T-cell recruitment
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The scored endpoint is the challenge-patch reaction in an animal already
      induced with the test chemical, so what the assay reads is the elicitation
      response to re-exposure rather than the priming that produced it. Priming
      is inferred from the presence of that reaction.
    limitations: >-
      Guinea pig rather than human, and the endpoint is a visually graded skin
      reaction rather than an antigen-specific cellular measurement. The
      adjuvant and intradermal induction are more aggressive than any topical
      human exposure, which is what makes this the sensitive member of the pair
      and also what makes a positive result an upper bound on potency.
      Chlorhexidine is negative in this test, and the guinea pig methods as a
      class have recorded false positives for vanillin and sulfanilic acid and
      a false negative for abietic acid.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        Erythema and swelling graded on a four-point scale stand in for
        effector T-cell recruitment. Nothing in the readout is
        antigen-specific or cellular, so an irritant reaction and an allergic
        one are separated by the choice of a non-irritant challenge dose rather
        than by the measurement itself.
    evidence:
    - reference: PMID:11028857
      reference_title: "Comparison of the sensitivities of the Buehler test and the guinea pig maximization test for predictive testing of contact allergy."
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "International test guidelines, such as the Organisation for Economic Cooperation and Development (OECD) guideline #406, recommend 2 guinea pig methods for testing of the contact allergenic potential of chemicals"
      explanation: >-
        Establishes this as one of the two methods the guideline recommends,
        which is the regulatory standing the record asserts. Graded OTHER
        because the quoted sentence describes a guideline rather than reporting
        any study, and BACKGROUND because it is the abstract's opening framing
        rather than a result this paper produced.
    - reference: PMID:32799435
      reference_title: "Trichloroethylene and trichloroethanol induce skin sensitization with focal hepatic necrosis in guinea pigs."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Allergenic reactions were scored using the Magnusson-Kligman grading
        scale to evaluate challenge patch test reactions as follows: 0, no
        visible change; 1, discrete or patchy erythema; 2, moderate, confluent
        erythema; and 3, intense erythema and swelling
      explanation: >-
        States the readout this link turns on: a graded dermal reaction at
        challenge, scored on the Magnusson-Kligman scale, which is the proxy
        the divergence records.
    - reference: PMID:11028857
      reference_title: "Comparison of the sensitivities of the Buehler test and the guinea pig maximization test for predictive testing of contact allergy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mercaptobenzothiazole, eugenol and chloraniline were all strong
        sensitizers in the GPMT
      explanation: >-
        Shows the test detecting three sensitizers that the Buehler method
        called negative or equivocal, which is the sensitivity difference
        separating the two records.
    - reference: PMID:20583317
      reference_title: "Skin sensitization, false positives and false negatives: experience with guinea pig assays."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        well-characterized examples of instances where both false negatives
        (including abietic acid and eugenol) or false positives (including
        vanillin and sulfanilic acid) have been recorded in guinea pig tests
      explanation: >-
        Supports the discordance in limitations, but graded INDIRECT because
        the review attributes these cases to guinea pig tests as a class and
        does not say which method produced each one. PMID:11028857 shows the
        eugenol case belongs to the Buehler test, not this one.
- name: Buehler occluded patch test
  species: Cavia porcellus
  genotype: wild type
  description: >-
    The second guinea pig method recommended by OECD TG 406. Induction is by
    repeated topical occluded patch without adjuvant, so exposure resembles
    topical human contact more closely than the maximization test does, and
    the challenge is read the same way. It is the less sensitive of the pair.
  publication: PMID:11028857
  modeled_mechanisms:
  - target: Re-exposure-driven effector T-cell recruitment
    relationship: MEASURES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Reads the same challenge-patch reaction as the maximization test, under a
      milder induction regimen. Fidelity is graded LOW because the method
      returns negative results for chemicals that are strong sensitizers in the
      parallel test, so a negative here does not constrain whether the
      mechanism occurred.
    limitations: >-
      Guinea pig, and the readout is a visually graded skin reaction. Eugenol
      and mercaptobenzothiazole are negative in this test while scoring as
      strong sensitizers in the maximization test under identical conditions,
      and higher induction concentrations are needed before allergenicity shows
      at all. For some allergens the protocol is not sensitive enough to
      demonstrate the potential, so negative results carry little weight.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        As in the maximization test, a graded erythema score stands in for
        effector T-cell recruitment, with no antigen-specific or cellular
        measurement behind it.
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: >-
        The induction regimen is mild enough that known strong sensitizers fail
        to induce a detectable response, so the model's negative range does not
        correspond to absence of the mechanism. This invalidates negative
        results specifically, not positive ones.
    evidence:
    - reference: PMID:11028857
      reference_title: "Comparison of the sensitivities of the Buehler test and the guinea pig maximization test for predictive testing of contact allergy."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        eugenol and mercaptobenzothiazole were negative in the Buehler test
      explanation: >-
        The head-to-head result behind the LOW fidelity grade: both chemicals
        are strong sensitizers in the maximization test run under identical
        conditions in the same study.
    - reference: PMID:11028857
      reference_title: "Comparison of the sensitivities of the Buehler test and the guinea pig maximization test for predictive testing of contact allergy."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Higher induction concentrations were needed to show allergenicity in
        the Buehler test and for some allergens the Buehler test protocol was
        not sensitive enough to demonstrate allergenic potential
      explanation: >-
        States the sensitivity shortfall directly, which is what the
        BOUNDARY_OMISSION divergence records.
    - reference: PMID:11028857
      reference_title: "Comparison of the sensitivities of the Buehler test and the guinea pig maximization test for predictive testing of contact allergy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Parallel GPMT and Buehler tests were conducted according to OECD guideline #406 using a multiple-dose design"
      explanation: >-
        Stands in for the challenge-reaction readout, which no cached source
        describes for this method specifically. It establishes that the method
        was run to the same guideline as the maximization test, whose readout
        PMID:32799435 does describe.
computational_models:
- name: Skin Allergy Risk Assessment (SARA) model
  description: >-
    A Bayesian model that infers a human-relevant sensitizer potency metric and a
    risk measure for a given consumer exposure from any combination of human
    patch test, local lymph node assay, DPRA, KeratinoSens, h-CLAT or U-SENS
    data.
  model_type: MACHINE_LEARNING
  publication: PMID:35311660
  notes: >-
    Carries no mechanism link, because what it predicts is the sensitization
    outcome and this entry has no adverse-outcome node to attach that to; see the
    no_node_for_integrated_outcome_prediction discussion. The potency metric is
    inferred statistically rather than measured, and the model is anchored on
    human patch test and local lymph node assay reference data, so it inherits
    those reference sets' domains. Whether the safety assessment factors used
    with animal data suit a non-animal point of departure is unresolved.
  evidence:
  - reference: PMID:35311660
    reference_title: "Next generation risk assessment for skin allergy: Decision making using new approach methodologies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The SARA model utilises a Bayesian statistical approach to infer a
      human-relevant metric of sensitiser potency and a measure of risk
      associated with a given consumer exposure based upon any combination of
      human repeat insult patch test, local lymph node, direct peptide
      reactivity assay, KeratinoSens™, h-CLAT or U-SENS™ data.
    explanation: >-
      States the inputs and the inferred quantity: the model's output is a
      statement about the human outcome, not a measurement of any single
      mechanism step in this entry.
- name: Decision-tree defined approach with Derek Nexus and a k-nearest-neighbours potency model
  description: >-
    A defined approach that applies exclusion criteria to prioritise in chemico
    and in vitro sources covering key events 1 to 3, combines them in a two out
    of three hazard call, and assigns a potency category using a
    k-nearest-neighbours model built on human and local lymph node assay data.
  model_type: MACHINE_LEARNING
  publication: PMID:30439387
  notes: >-
    Carries no mechanism link for the same reason as the SARA model: it
    integrates the per-key-event assay readouts into a hazard and potency
    prediction for the outcome, and this entry has no adverse-outcome node. Its
    inputs cover key events 1 to 3, so no single node corresponds to it either.
    Hazard accuracy is about 85 to 86 percent against local lymph node assay and
    human reference data, but the correct potency category is reached for only 59
    to 68 percent of chemicals. The structural component rests on chemical
    structure and statistical association rather than on the molecular processes
    of sensitization.
  evidence:
  - reference: PMID:30439387
    reference_title: "A defined approach for predicting skin sensitisation hazard and potency based on the guided integration of in silico, in chemico and in vitro data using exclusion criteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The DA correctly identified the hazard (sensitiser/non-sensitiser) for
      85% and 86% of a dataset with reference LLNA and human data.
    explanation: >-
      Gives the hazard performance against both reference sets, which bounds
      what the integrated prediction supports.

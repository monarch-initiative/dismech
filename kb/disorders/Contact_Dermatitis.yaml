discussions:
- discussion_id: no_node_for_hapten_driven_keratinocyte_activation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Keratinocyte activation and proinflammatory mediator release
  prompt: >-
    The only keratinocyte activation node sits in the irritant arm, downstream of
    barrier disruption. Should the sensitization arm carry its own keratinocyte
    activation step, driven by hapten electrophilicity rather than by barrier
    injury?
  rationale: >-
    The OECD TG 442D methods and the reconstructed-epidermis assays that extend
    them measure keratinocyte activation under hapten exposure with no barrier
    injury, and they separate a sensitizer from an irritant on exactly that
    readout. The existing node is curated as the consequence of irritant barrier
    failure, so mapping those methods onto it imports a cause the methods do not
    use. Two arms of keratinocyte activation are described in this literature —
    electrophile sensing through Keap1-Nrf2-ARE, and inflammasome-dependent IL-1
    family danger signalling — and the sensitization arm of this entry currently
    passes straight from hapten exposure to innate immune activation without
    either.
  evidence:
  - reference: PMID:24794257
    reference_title: "Performance of the N/TERT epidermal model for skin sensitizer identification via Nrf2-Keap1-ARE pathway activation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Results show that the Keap1-Nrf2-ARE pathway is activated by the sensitizer
      DNCB in monolayer keratinocytes and as well as the LEMs and NEMs and not by
      the irritant SDS.
    explanation: >-
      Shows the keratinocyte response discriminating sensitizer from irritant,
      which is what makes hapten-driven keratinocyte activation a distinct step
      from the irritant-driven node it would otherwise be mapped to.
- discussion_id: no_node_for_integrated_outcome_prediction
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Allergen-specific T-cell priming
  prompt: >-
    The two computational models predict sensitization hazard and potency for the
    whole outcome, not any single step. The entry's pathograph ends in mechanism
    nodes with no adverse-outcome node, so neither model has anything to attach
    to. Should the entry carry a sensitization-outcome node?
  rationale: >-
    Both the SARA model and the decision-tree defined approach take assay
    readouts spanning several key events and return one statement about the human
    outcome. That is a claim about the outcome, so linking either to a mechanism
    node would assert it measures a step it does not measure, and the two are
    recorded with no mechanism link for that reason. The regulatory framing has
    the same shape: OECD Guideline No. 497 exists to turn the per-key-event
    assays into a single classification, so an entry that curates the methods but
    has no node for what they jointly predict cannot represent the integration
    step at all. This discussion is attached to the most downstream sensitization
    node for want of an outcome node, which is the gap itself.
  evidence:
  - reference: PMID:35311660
    reference_title: "Next generation risk assessment for skin allergy: Decision making using new approach methodologies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The SARA model utilises a Bayesian statistical approach to infer a
      human-relevant metric of sensitiser potency and a measure of risk
      associated with a given consumer exposure based upon any combination of
      human repeat insult patch test, local lymph node, direct peptide
      reactivity assay, KeratinoSens™, h-CLAT or U-SENS™ data.
    explanation: >-
      The inferred quantity is a potency and risk metric for the outcome, which
      is what no node in this entry represents.
- discussion_id: no_node_for_non_covalent_metal_initiation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Hapten exposure
  prompt: >-
    Nickel and cobalt initiate sensitization by coordinating human TLR4 rather
    than by binding protein covalently. Should the entry carry that route
    separately, given that nickel is the most frequent cause of contact
    hypersensitivity?
  rationale: >-
    The entry's sensitization arm begins with hapten exposure understood as
    exposure to reactive chemicals that bind protein. Metals reach the same
    adverse outcome by a different initiating mechanism: direct, non-covalent
    coordination of two non-conserved histidines of human TLR4, which produces the
    proinflammatory signal. The route is also human-specific, which is the
    mechanistic explanation for nickel appearing as a false negative in the mouse
    local lymph node assay, and so it bears directly on how that assay's output
    should be read for metals.
  evidence:
  - reference: PMID:20711192
    reference_title: "Crucial role for human Toll-like receptor 4 in the development of contact allergy to nickel."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Ni(2+)-induced TLR4 activation was species-specific, as mouse TLR4 could
      not generate this response.
    explanation: >-
      Establishes the species specificity of the metal route, which is what makes
      it both a distinct initiating mechanism and the explanation for the animal
      assay's blind spot. The quoted comparison is receptor-level rather than in
      vivo: it sits between the human TLR4 activation result and the mutant-TLR4
      studies, and the paper's animal arm is the separate transgenic experiment,
      which is not what is quoted here.

    evidence_source: HUMAN_CLINICAL
    snippet: The authors report two families with onset of ataxia in adulthood (with pyramidal dysfunction and/or peripheral neuropathy variably present), who are clinically indistinguishable from other spinocerebellar ataxia patients.
    explanation: States the clinical indistinguishability that makes spinocerebellar ataxia the primary differential.
- name: CANVAS / RFC1 spectrum disorder
  disease_term:
    preferred_term: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
    term:
      id: MONDO:0044720
      label: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
  description: RFC1-related CANVAS is an important cause of late-onset ataxia with sensory neuronopathy, particularly when bilateral vestibular areflexia or chronic cough is present. It is a distinct recessive repeat-expansion disorder, not the MT-ATP6 disorder defined by OMIM 500010.
  distinguishing_features:
  - Bilateral vestibular areflexia
  - Sensory neuronopathy (ganglionopathy) rather than length-dependent axonal polyneuropathy
  - Chronic cough often preceding ataxia by years
  - Autosomal recessive biallelic RFC1 repeat expansion, not maternal inheritance
  evidence:
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We used non-parametric linkage analysis and genome sequencing to identify a biallelic intronic AAGGG repeat expansion in the replication factor C subunit 1 (RFC1) gene as the cause of familial CANVAS and a frequent cause of late-onset ataxia, particularly if sensory neuronopathy and bilateral vestibular areflexia coexist.
    explanation: Primary identification of an important differential; the selected referral cohort does not establish comparative population prevalence.
- name: Charcot-Marie-Tooth disease
  disease_term:
    preferred_term: Charcot-Marie-Tooth disease
    term:
      id: MONDO:0015626
      label: Charcot-Marie-Tooth disease
  description: The axonal sensorimotor neuropathy can dominate the presentation and lead to referral as suspected hereditary motor and sensory neuropathy.
  distinguishing_features:
  - Accompanying cerebellar ataxia
  - Maternal inheritance pattern
  - MT-ATP6 variant on mitochondrial DNA sequencing
  evidence:
  - reference: PMID:18055910
    reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In conclusion, m.8993T-->C MTATP6 should be considered in patients with unexplained ataxia, CMT or EA, but cases are uncommon.
    explanation: Names suspected Charcot-Marie-Tooth disease as one of the clinical contexts in which this variant should be sought.

biochemical:
- name: Cytochrome c oxidase muscle histochemistry
  notes: >-
    Unlike most adult mitochondrial disease, COX histochemistry on muscle is
    typically normal in MT-ATP6 disorders. This normal result is diagnostically
    important: it is the reason these patients are missed by the standard adult
    mitochondrial workup.
  presence: Normal
  evidence:
  - reference: PMID:18055910
    reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytochrome c oxidase muscle histochemistry, which is the standard
      clinical investigation for mitochondrial disease in adults, is usually
      normal in patients with MTATP6 mutations.
    explanation: >-
      States directly that the standard adult mitochondrial screening test is
      normal in MT-ATP6 disease.

- name: Respiratory chain enzyme activities
  notes: >-
    Respiratory-chain enzymology and muscle biopsy are non-specific or normal in
    adult-onset MT-ATP6 ataxia. The commonly used spectrophotometric complex V
    assay measures ATP hydrolysis, the reverse reaction, which does not require
    proton pumping and so under-detects this class of defect.
  presence: Normal
  evidence:
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other investigations including muscle biopsy and respiratory chain enzyme
      activity were non-specific or normal.
    explanation: >-
      Directly reports normal or non-specific respiratory-chain enzymology in
      adult-onset MT-ATP6 ataxia families.

genetic:
- name: MT-ATP6
  gene_term:
    preferred_term: MT-ATP6
    term:
      id: hgnc:7414
      label: MT-ATP6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heteroplasmic m.8993T>C (Leu156Pro) is the defining variant of OMIM 500010.
    Other MT-ATP6 missense variants (m.9035T>C, m.9185T>C) cause clinically
    indistinguishable adult-onset ataxia syndromes.
  inheritance:
  - name: Mitochondrial inheritance
    inheritance_term:
      preferred_term: Mitochondrial inheritance
      term:
        id: HP:0001427
        label: Mitochondrial inheritance
    description: >-
      Maternal transmission of a heteroplasmic mtDNA variant; mutant load
      segregates through the germline bottleneck, so sibs and offspring inherit
      varying loads and clinical expression is incompletely predictable.
    evidence:
    - reference: PMID:20301352
      reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Sibs may inherit the pathogenic variant at varying heteroplasmy levels
        due to the bottleneck effect and variant-specific segregation patterns.
      explanation: >-
        GeneReviews statement of maternal transmission with bottleneck-driven
        heteroplasmy variation; PARTIAL because the chapter covers mtDNA-Leigh
        syndrome spectrum generally rather than this adult-onset entity.
    - reference: PMID:18055910
      reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified a three-generation family with the m.8993T-->C mutation
        of mtDNA.
      explanation: >-
        A three-generation pedigree carrying the variant is direct evidence of
        vertical (maternal) transmission of m.8993T>C.
  evidence:
  - reference: PMID:16049925
    reference_title: Adult-onset ataxia and polyneuropathy caused by mitochondrial 8993T-->C mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a kindred with adult-onset slowly progressive ataxia and
      polyneuropathy and with the heteroplasmic 8993T-->C mutation.
    explanation: >-
      Establishes MT-ATP6 m.8993T>C as the causal variant for this entity.
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These families had the m.9185T>C and m.9035T>C mutations, respectively,
      which have not previously been associated with adult-onset cerebellar
      syndromes.
    explanation: >-
      Extends the causal gene beyond m.8993T>C to other MT-ATP6 missense
      variants producing adult-onset cerebellar syndromes.

diagnosis:
- name: Mitochondrial DNA sequencing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing of MT-ATP6 with heteroplasmy quantification is the only reliable
    route to diagnosis, and should be pursued in undiagnosed adult ataxia even
    when muscle biopsy and respiratory-chain studies are unremarkable. Because
    heteroplasmy differs between tissues, a negative or low-level blood result
    does not exclude the diagnosis.
  results: >-
    Identification of a pathogenic heteroplasmic MT-ATP6 variant (m.8993T>C, or
    another MT-ATP6 missense variant such as m.9035T>C or m.9185T>C) establishes
    the diagnosis.
  evidence:
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MTATP6 sequencing should be considered in the workup of undiagnosed
      ataxia, even if other investigations do not suggest a mitochondrial DNA
      disorder.
    explanation: >-
      Direct recommendation that MT-ATP6 sequencing be part of the undiagnosed
      adult ataxia workup regardless of other test results.
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The degree of mutant heteroplasmy for the m.8993T>C mutation was evaluated
      by real-time allele refractory mutation system quantitative PCR of mtDNA
      from hair bulbs (ectoderm) and blood leukocytes (mesoderm).
    explanation: >-
      Illustrates the multi-tissue heteroplasmy quantification this diagnostic
      step calls for. PARTIAL because the study quantified heteroplasmy in an
      m.8993T>C family diagnosed as NARP syndrome (MONDO:0010794); the method
      transfers, the cohort is a different entity.

- name: Nerve conduction studies and electromyography
  diagnosis_term:

differential_diagnoses:
- name: NARP syndrome
  disease_term:
    preferred_term: NARP syndrome
    term:
      id: MONDO:0010794
      label: NARP syndrome
  description: NARP shares MT-ATP6 variants and overlapping neuropathy/ataxia, with pigmentary retinopathy as a distinguishing clinical feature. NARP is not confined to childhood, and mutant load alone does not separate it from this adult-ataxia presentation.
  distinguishing_features:
  - Pigmentary retinopathy with neuropathy and ataxia
  - Overlapping age at onset and heteroplasmy; assess the whole phenotype
  evidence:
  - reference: PMID:16049925
    reference_title: Adult-onset ataxia and polyneuropathy caused by mitochondrial 8993T-->C mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 8993T-->C mutation in mitochondrial DNA (mtDNA) has been described previously to be associated with infantile- or childhood-onset phenotypes, ranging from Leigh's syndrome to neurogenic weakness, ataxia, and retinitis pigmentosa syndrome.
    explanation: The defining report explicitly contrasts this adult entity with the previously described childhood NARP and Leigh phenotypes of the same variant.
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The age at time of ﬁrst symptom ranged from ataxia at 13 months in subject D3 to visual impairment at 10, 12 and 34 years in D4, D1 and M1, respectively,
    explanation: The mother first had visual impairment at 34; NARP is not exclusively childhood-onset.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
- name: Leigh syndrome
  disease_term:
    preferred_term: Leigh syndrome
    term:
      id: MONDO:0009723
      label: Leigh syndrome
  description: Leigh syndrome spectrum commonly presents in infancy with regression and characteristic bilateral brainstem/basal-ganglia lesions, but onset is not an absolute boundary. It overlaps genetically with adult MT-ATP6 ataxia.
  distinguishing_features:
  - Onset typically between three and 12 months
  - Decompensation with elevated lactate
  - Bilateral symmetric basal ganglia and brainstem lesions
  evidence:
  - reference: PMID:20301352
    reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Mitochondrial DNA-LSS is characterized by onset of manifestations typically between ages three and 12 months, often following an intercurrent illness (usually viral) or metabolic challenge (vaccinations, surgery, prolonged fasting).
    explanation: Typical infantile presentation provides differential context, not an absolute age exclusion.
    quote_role: REVIEW_SYNTHESIS

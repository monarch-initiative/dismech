differential_diagnoses:
- name: NARP syndrome
  disease_term:
    preferred_term: NARP syndrome
    term:
      id: MONDO:0010794
      label: NARP syndrome
  description: >-
    NARP is caused by the same MT-ATP6 nucleotide-8993 substitutions but
    presents in childhood with the triad of neuropathy, ataxia and retinitis
    pigmentosa. Retinal involvement and earlier onset separate it from this
    adult entity, which is defined by ataxia plus axonal neuropathy without a
    required pigmentary retinopathy.
  distinguishing_features:
  - Childhood onset
  - Retinitis pigmentosa
  - Generally higher mutant load
  evidence:
  - reference: PMID:16049925
    reference_title: Adult-onset ataxia and polyneuropathy caused by mitochondrial 8993T-->C mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 8993T-->C mutation in mitochondrial DNA (mtDNA) has been described
      previously to be associated with infantile- or childhood-onset
      phenotypes, ranging from Leigh's syndrome to neurogenic weakness, ataxia,
      and retinitis pigmentosa syndrome.
    explanation: >-
      The defining report explicitly contrasts this adult entity with the
      previously described childhood NARP and Leigh phenotypes of the same
      variant.

- name: Leigh syndrome
  disease_term:
    preferred_term: Leigh syndrome
    term:
      id: MONDO:0009723
      label: Leigh syndrome
  description: >-
    Maternally inherited Leigh syndrome is the severe infantile end of the same
    MT-ATP6 spectrum, with subacute necrotising encephalopathy, developmental
    regression and high early mortality.
  distinguishing_features:
  - Onset typically between three and 12 months
  - Decompensation with elevated lactate
  - Bilateral symmetric basal ganglia and brainstem lesions
  evidence:
  - reference: PMID:20301352
    reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mitochondrial DNA-LSS is characterized by onset of manifestations
      typically between ages three and 12 months, often following an
      intercurrent illness (usually viral) or metabolic challenge
      (vaccinations, surgery, prolonged fasting).
    explanation: >-
      GeneReviews establishes the infantile onset that distinguishes Leigh
      syndrome spectrum from this adult-onset entity.

- name: Autosomal recessive and dominant spinocerebellar ataxias
  disease_term:
    preferred_term: cerebellar ataxia
    term:
      id: MONDO:0000437
      label: cerebellar ataxia
  description: >-
    Adult-onset MT-ATP6 ataxia is clinically indistinguishable from the common
    hereditary spinocerebellar ataxias, and is only separated from them by mtDNA
    sequencing.
  distinguishing_features:
  - Non-dominant (maternal) pedigree pattern
  - Normal cytochrome c oxidase histochemistry does not exclude the diagnosis
  - Requires mitochondrial DNA sequencing
  evidence:
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors report two families with onset of ataxia in adulthood (with
      pyramidal dysfunction and/or peripheral neuropathy variably present), who
      are clinically indistinguishable from other spinocerebellar ataxia
      patients.
    explanation: >-
      States the clinical indistinguishability that makes spinocerebellar ataxia
      the primary differential.

- name: CANVAS / RFC1 spectrum disorder
  disease_term:
    preferred_term: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
    term:
      id: MONDO:0044720
      label: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
  description: >-
    The single most important differential for the descriptive phrase
    "adult-onset ataxia and polyneuropathy". Biallelic intronic AAGGG repeat
    expansion in RFC1 is a common, recessively inherited cause of late-onset
    ataxia with sensory neuronopathy, and is far more prevalent than MT-ATP6
    disease. It is a mechanistically unrelated entity and must not be conflated
    with this MONDO/OMIM concept, which is defined by a maternally inherited
    MT-ATP6 variant.
  distinguishing_features:
  - Bilateral vestibular areflexia
  - Sensory neuronopathy (ganglionopathy) rather than length-dependent axonal polyneuropathy
  - Chronic cough often preceding ataxia by years
  - Autosomal recessive biallelic RFC1 repeat expansion, not maternal inheritance
  evidence:
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used non-parametric linkage analysis and genome sequencing to identify
      a biallelic intronic AAGGG repeat expansion in the replication factor C
      subunit 1 (RFC1) gene as the cause of familial CANVAS and a frequent cause
      of late-onset ataxia, particularly if sensory neuronopathy and bilateral
      vestibular areflexia coexist.
    explanation: >-
      Establishes biallelic RFC1 repeat expansion as a frequent cause of
      late-onset ataxia with neuropathy, making it the leading differential for
      an adult presenting with ataxia plus polyneuropathy.

- name: Charcot-Marie-Tooth disease
  disease_term:
    preferred_term: Charcot-Marie-Tooth disease
    term:
      id: MONDO:0015626
      label: Charcot-Marie-Tooth disease
  description: >-
    The axonal sensorimotor neuropathy can dominate the presentation and lead to
    referral as suspected hereditary motor and sensory neuropathy.
  distinguishing_features:
  - Accompanying cerebellar ataxia
  - Maternal inheritance pattern
  - MT-ATP6 variant on mitochondrial DNA sequencing
  evidence:
  - reference: PMID:18055910
    reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, m.8993T-->C MTATP6 should be considered in patients with
      unexplained ataxia, CMT or EA, but cases are uncommon.
    explanation: >-
      Names suspected Charcot-Marie-Tooth disease as one of the clinical
      contexts in which this variant should be sought.


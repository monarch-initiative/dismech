prevalence:
- population: Adults with unexplained ataxia or suspected Charcot-Marie-Tooth disease (United Kingdom referral cohorts)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Screening 308 patients with unexplained ataxia and 96 with suspected
    Charcot-Marie-Tooth disease identified a single m.8993T>C family; a further
    191 episodic-ataxia patients yielded none. Only a handful of kindreds with
    adult-onset MT-ATP6 ataxia have been reported worldwide.
  evidence:
  - reference: PMID:18055910
    reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore studied 308 patients with unexplained ataxia and 96 patients
      with suspected Charcot-Marie-Tooth disease to determine whether the
      m.8993T-->C MTATP6 mutation is common in unexplained inherited ataxia
      and/or polyneuropathy.
    explanation: >-
      Defines the screened cohorts from which the rarity estimate is drawn.
  - reference: PMID:18055910
    reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, m.8993T-->C MTATP6 should be considered in patients with
      unexplained ataxia, CMT or EA, but cases are uncommon.
    explanation: >-
      The authors' own summary that cases are uncommon, supporting the
      ULTRA_RARE band.

discussions:
- discussion_id: purkinje_neuropathology_unproven
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which cerebellar cell population is lost in adult-onset MT-ATP6 ataxia, and
    is the Purkinje neuron the primary target as it is in most hereditary
    ataxias?
  attaches_to:
  - pathophysiology#Cerebellar Degeneration
  rationale: >-
    Cerebellar atrophy in m.8993T>C carriers is documented only by MRI. No
    autopsy or quantitative neuropathological series exists for the adult-onset
    MT-ATP6 phenotype, so the assignment of the degeneration to Purkinje neurons
    is inference from the wider ataxia literature rather than a finding in this
    entity. This matters mechanistically because MT-ATP6 disease elsewhere
    (Leigh/NARP) preferentially injures brainstem and basal ganglia rather than
    cerebellar cortex, and the m.8993T>C ROS-weighted lesion may select a
    different population than the calcium-mediated Purkinje degeneration of the
    dominant spinocerebellar ataxias.
  evidence:
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-resolution retinal and brain imaging in NARP syndrome revealed
      analogous patterns of tissue injury characterized by heterogeneous areas
      of neuronal loss.
    explanation: >-
      The deepest tissue-level characterisation available for m.8993T>C carriers
      is imaging, which resolves regions rather than cell types. It is cited
      here as PARTIAL to document the ceiling of current evidence, which is
      exactly what this knowledge gap asserts.
  proposed_experiments:
  - experiment_id: cerebellar_neuropathology_mtatp6
    name: Post-mortem cerebellar neuropathology in genetically confirmed adult-onset MT-ATP6 ataxia
    description: >-
      Quantitative stereology of Purkinje, granule and dentate neurons with
      per-cell heteroplasmy measurement, compared against age-matched controls
      and against NARP/Leigh cerebellum.

- discussion_id: heteroplasmy_does_not_explain_onset
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why do some MT-ATP6 pedigrees with very high mutant load present in infancy
    with Leigh syndrome while others present only in adulthood with ataxia and
    neuropathy?
  attaches_to:
  - pathophysiology#Heteroplasmy Load Above the Phenotypic Threshold
  rationale: >-
    Mutant load is necessary but demonstrably not sufficient to predict age of
    onset or severity: patients with childhood-onset and adult-onset MT-ATP6
    ataxia have both been reported at 90-100% heteroplasmy, and within a single
    m.8993T>C family, phenotype differed markedly between members with
    comparably high ectodermal and mesodermal loads. Candidate modifiers include
    mtDNA haplogroup, nuclear background, mtDNA copy number, and differences in
    antioxidant scavenging capacity, none of which has been tested for this
    entity.
  evidence:
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were marked phenotypic differences between family members, even
      between individuals with the greatest degrees of ectodermal and mesodermal
      heteroplasmy.
    explanation: >-
      Demonstrates that measured heteroplasmy fails to explain within-family
      phenotypic variation in an m.8993T>C kindred. PARTIAL because that kindred
      was diagnosed as NARP syndrome (MONDO:0010794); the open question about
      load-versus-onset is nonetheless shared across the MT-ATP6 spectrum.

- discussion_id: antioxidant_rescue_in_cybrids_only
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the rescue of MT-ATP6 mutant cell death by CoQ10 and vitamin E in
    transmitochondrial cybrids translate into any clinical benefit in adult-onset
    MT-ATP6 ataxia?
  attaches_to:
  - pathophysiology#Neuronal Energy Deficit and Oxidative Stress
  rationale: >-
    Cybrids carrying an MT-ATP6 ataxia variant died by apoptosis or necrosis
    under metabolic stress, and both outcomes were prevented by CoQ10 and
    vitamin E, prompting the authors to propose antioxidant therapy. This is an
    in-vitro result in an immortalised cell background carrying a different
    MT-ATP6 variant (m.9035T>C) from the m.8993T>C that defines this entity, and
    the stressors used (glucose deprivation, tert-butyl hydroperoxide) are not
    models of the decades-long neurodegeneration seen in patients. No controlled
    trial of antioxidants exists for this disorder, and the entry therefore
    records no antioxidant treatment.
  evidence:
  - reference: PMID:19626676
    reference_title: Identification of ataxia-associated mtDNA mutations (m.4052T>C and m.9035T>C) and evaluation of their pathogenicity in transmitochondrial cybrids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both of these outcomes were prevented by the antioxidants CoQ(10) and
      vitamin E, suggesting that the abnormally high levels of ROS were the
      triggers of cell death.
    explanation: >-
      The cybrid rescue result whose translational validity this discussion
      questions.

notes: >-
  Scope. This entry is anchored on OMIM 500010 / MONDO:0010781, whose defining
  report is the Rantamaki 2005 Finnish kindred with heteroplasmic MT-ATP6
  m.8993T>C. It is deliberately kept distinct from NARP syndrome
  (MONDO:0010794), which shares the nucleotide-8993 substitutions but is defined
  by childhood onset with retinitis pigmentosa, and from Leigh syndrome
  (MONDO:0009723). Where the only available mechanistic or clinical evidence
  comes from a different MT-ATP6 variant in the same adult-onset ataxia spectrum
  (m.9035T>C, m.9185T>C), the evidence item is marked PARTIAL and the variant is
  named in its explanation.

  The same discipline is applied on the entity axis. PMID:20953793 phenotyped an
  m.8993T>C family diagnosed as NARP syndrome, and is the best available source
  for this entity's electrophysiology, cerebellar imaging, and heteroplasmy
  behaviour: the variant is the defining one, but the published diagnosis is the
  entity curated separately at MONDO:0010794. Every item drawn from it is
  therefore marked PARTIAL with the NARP cohort named, so that the file does not
  simultaneously assert that NARP is a distinct disease and treat NARP data as
  unqualified evidence for this one.

  Deep-research provenance and a Named Entity Confusion event. A falcon
  (Edison) deep-research run was performed for this entry and was DISCARDED in
  full. `just preflight-dr` returned SKIP (MONDO records no causal gene for
  MONDO:0010781), so the manual OMIM/gene preflight was applied and the report
  failed it: its dominant gene was RFC1 (61 mentions) and it contained zero
  mentions of MT-ATP6 or nucleotide 8993, having resolved the descriptive label
  "adult-onset ataxia and polyneuropathy" to RFC1 spectrum disorder / CANVAS
  (MONDO:0044720) instead of to OMIM 500010. No content, citation, or ontology
  term in this entry comes from that report; every reference here was found and
  cached independently from PubMed. CANVAS is nevertheless a real and important
  differential, and is curated as one below from an independently retrieved
  primary source.

  MONDO classification. MONDO:0010781 is currently placed under MONDO:0021190
  (DNA repair disease). That parent looks incorrect for a maternally inherited
  MT-ATP6 oxidative-phosphorylation defect - MedGen and MeSH both map this
  concept to mitochondrial disease and to Mitochondrial Proton-Translocating
  ATPases deficiency. The `parents` slot here records mitochondrial disease
  instead; the MONDO placement is worth reporting upstream.


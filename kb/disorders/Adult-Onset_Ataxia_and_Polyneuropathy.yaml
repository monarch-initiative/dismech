    description: Heteroplasmic mitochondrial missense substitution (Leu156Pro) inherited through the maternal line.
  evidence:
  - reference: PMID:16049925
    reference_title: Adult-onset ataxia and polyneuropathy caused by mitochondrial 8993T-->C mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a kindred with adult-onset slowly progressive ataxia and polyneuropathy and with the heteroplasmic 8993T-->C mutation.
    explanation: This is the defining report for OMIM 500010 and directly ties the heteroplasmic m.8993T>C MT-ATP6 variant to the adult-onset ataxia-plus-polyneuropathy phenotype.
  - reference: PMID:17568559
    reference_title: Biochemical phenotypes associated with the mitochondrial ATP6 gene mutations at nt8993.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two point mutations (T>G and T>C) at the same 8993 nucleotide of mitochondrial DNA (at comparable mutant load), affecting the ATPase 6 subunit of the F1F0-ATPase, result in neurological phenotypes of variable severity in humans.
    explanation: Locates the lesion in the ATPase 6 subunit of F1F0-ATP synthase and records that the two nucleotide-8993 substitutions differ in severity.
  downstream:
  - target: Impaired ATP Synthase Function
    description: The m.8993T>C ATP6 lesion is associated with bioenergetic dysfunction in patient lymphocytes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17568559
      reference_title: Biochemical phenotypes associated with the mitochondrial ATP6 gene mutations at nt8993.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Both 8993T>G and 8993T>C mutations led to energy deprivation and ROS overproduction.
      explanation: Measurements in patient lymphocytes, not neurons; the abstract reports both ATP-related energy deprivation and increased ROS.
      quote_role: PRIMARY_RESULT
- name: Heteroplasmy-Dependent Expression
  role: modulator
  biological_scale: CELLULAR
  description: Mutant load modifies clinical expression but is not a universal onset clock or a fixed threshold. The defining adult proband had 89% mutant mtDNA in blood; related adult-ataxia pedigrees had 90–99% in leukocytes. GeneReviews describes relatively little tissue- or age-dependent heteroplasmy variation for m.8993T>C/G, unlike some other mtDNA variants. Differences among tissues can nevertheless occur, and high load does not reliably predict an individual phenotype. Nuclear, haplogroup and copy-number modifiers remain candidate explanations rather than demonstrated determinants here.
  evidence:
  - &id007
    reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In our families, six patients had their genetic testing performed on leucocyte DNA, with heteroplasmy levels ranging from 90-99%.
    explanation: Related m.9185T>C and m.9035T>C families include high-load adult presentations; blood load is not a universal predictor of onset.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: There were marked phenotypic differences between family members, even between individuals with the greatest degrees of ectodermal and mesodermal heteroplasmy.
    explanation: In an m.8993T>C family, measured heteroplasmy did not account for the within-family phenotypic spread, supporting the modulator role and the limits of load as a predictor. Graded INDIRECT because the cohort was diagnosed as NARP syndrome (MONDO:0010794), an entity this entry keeps distinct; the observation carries across because the modulator claim is about m.8993T>C heteroplasmy behaviour rather than about either phenotype.

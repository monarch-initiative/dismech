      label: mitochondrion organization
  chemical_entities:
  - preferred_term: ATP
    modifier: DECREASED
    term:
      id: CHEBI:15422
      label: ATP
  - preferred_term: reactive oxygen species
    modifier: INCREASED
    term:
      id: CHEBI:26523
      label: reactive oxygen species
  evidence:
  - reference: PMID:17568559
    reference_title: Biochemical phenotypes associated with the mitochondrial ATP6 gene mutations at nt8993.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The 8993T>G change mainly induces an energy deficiency, whereas the
      8993T>C favours an increased ROS production.
    explanation: >-
      Establishes the ROS-weighted balance of the bioenergetic lesion for the
      m.8993T>C variant that defines this entry.
  - reference: PMID:19626676
    reference_title: Identification of ataxia-associated mtDNA mutations (m.4052T>C and m.9035T>C) and evaluation of their pathogenicity in transmitochondrial cybrids.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      They had less than half of the steady-state content of ATP and nearly an
      8-fold higher basal level of reactive oxygen species (ROS).
    explanation: >-
      Quantifies the combined ATP shortfall and ROS burden in cybrids carrying
      an MT-ATP6 ataxia variant. PARTIAL because the cybrids carried m.9035T>C.
  - reference: PMID:35159298
    reference_title: "Clinical Heterogeneity in MT-ATP6 Pathogenic Variants: Same Genotype-Different Onset."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bioenergetic measurements in fibroblasts from both patients detected
      reduced spare respiratory capacities and altered extracellular
      acidification rates, revealing a switch from mitochondrial respiration to
      glycolysis to uphold ATP production.
    explanation: >-
      Patient-derived fibroblast evidence of the compensatory glycolytic shift
      described in this node; PARTIAL because the variant was m.9035T>C.
  downstream:
  - target: Distal Axonal Degeneration of Peripheral Nerves
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The longest peripheral axons, which must maintain mitochondria far from
      the cell body, are the first to fail.
  - target: Cerebellar Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic bioenergetic stress in cerebellar cortex produces progressive
      cerebellar volume loss.

- name: Distal Axonal Degeneration of Peripheral Nerves
  role: effector
  biological_scale: TISSUE
  conforms_to: peripheral_axonal_degeneration#Length-Dependent Nerve Fiber Dysfunction
  description: >-
    A length-dependent, predominantly axonal sensorimotor polyneuropathy
    develops, producing distal sensory loss, depressed or absent ankle reflexes,
    and distal weakness. Nerve conduction studies show axonal rather than
    demyelinating features, which is why these patients are commonly referred
    with a working diagnosis of Charcot-Marie-Tooth disease.
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:

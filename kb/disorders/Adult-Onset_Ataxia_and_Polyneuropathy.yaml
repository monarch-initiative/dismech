prevalence:
- population: Adults with unexplained ataxia or suspected Charcot-Marie-Tooth disease (United Kingdom referral cohorts)
  measure_type: CASES_IN_LITERATURE
  notes: A selected UK referral study screened 308 unexplained-ataxia patients, 96 suspected CMT patients and 191 episodic-ataxia patients, identifying one m.8993T>C family. This is a study-specific case-finding result, not population prevalence or a quantitative rarity band.
  evidence:
  - reference: PMID:18055910
    reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We therefore studied 308 patients with unexplained ataxia and 96 patients with suspected Charcot-Marie-Tooth disease to determine whether the m.8993T-->C MTATP6 mutation is common in unexplained inherited ataxia and/or polyneuropathy.
    explanation: Defines the screened cohorts from which the rarity estimate is drawn.
  - reference: PMID:18055910
    reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In conclusion, m.8993T-->C MTATP6 should be considered in patients with unexplained ataxia, CMT or EA, but cases are uncommon.
    explanation: The authors describe cases as uncommon in these selected referrals; no general population rarity threshold follows.
discussions:
- discussion_id: purkinje_neuropathology_unproven
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which cerebellar cell population is lost in adult-onset MT-ATP6 ataxia, and is the Purkinje neuron the primary target as it is in most hereditary ataxias?
  attaches_to:
  - pathophysiology#Cerebellar Dysfunction
  rationale: The reviewed adult clinical reports establish cerebellar signs and variable MRI atrophy but not specific Purkinje-cell loss. The original family included a deceased childhood-onset sibling with nonspecific brain gliosis at autopsy and no documented molecular assay; that historical case does not establish adult cell-specific neuropathology.
  evidence:
  - *id009
  proposed_experiments:
  - experiment_id: cerebellar_neuropathology_mtatp6
    name: Post-mortem cerebellar neuropathology in genetically confirmed adult-onset MT-ATP6 ataxia
    description: Quantitative stereology of Purkinje, granule and dentate neurons with per-cell heteroplasmy measurement, compared against age-matched controls and against NARP/Leigh cerebellum.
- discussion_id: heteroplasmy_does_not_explain_onset
  kind: OPEN_QUESTION
  status: OPEN
  prompt: Why do some MT-ATP6 pedigrees with very high mutant load present in infancy with Leigh syndrome while others present only in adulthood with ataxia and neuropathy?
  attaches_to:
  - pathophysiology#Heteroplasmy-Dependent Expression
  rationale: 'Mutant load is necessary but demonstrably not sufficient to predict age of onset or severity: patients with childhood-onset and adult-onset MT-ATP6 ataxia have both been reported at 90-100% heteroplasmy, and within a single m.8993T>C family, phenotype differed markedly between members with comparably high ectodermal and mesodermal loads. Candidate modifiers include mtDNA haplogroup, nuclear background, mtDNA copy number, and differences in antioxidant scavenging capacity, none of which has been tested for this entity.'
  evidence:
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: There were marked phenotypic differences between family members, even between individuals with the greatest degrees of ectodermal and mesodermal heteroplasmy.
    explanation: Demonstrates that measured heteroplasmy fails to explain within-family phenotypic variation in an m.8993T>C kindred. Graded INDIRECT because that kindred was diagnosed as NARP syndrome (MONDO:0010794); the open question about load-versus-onset is nonetheless shared across the MT-ATP6 spectrum.
  - *id007
- discussion_id: antioxidant_rescue_in_cybrids_only
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Does the rescue of MT-ATP6 mutant cell death by CoQ10 and vitamin E in transmitochondrial cybrids translate into any clinical benefit in adult-onset MT-ATP6 ataxia?
  attaches_to:
  - pathophysiology#Reactive Oxygen Species Overproduction
  rationale: Related m.9035T>C cybrids showed antioxidant prevention of stress-induced cell death. The immortalized background, different variant and acute artificial stressors limit translation to the adult m.8993T>C syndrome. The sources reviewed and direct registry queries on 2026-09-21 did not identify an adult MT-ATP6 ataxia-specific interventional trial.
  evidence:
  - reference: PMID:19626676
    reference_title: Identification of ataxia-associated mtDNA mutations (m.4052T>C and m.9035T>C) and evaluation of their pathogenicity in transmitochondrial cybrids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both of these outcomes were prevented by the antioxidants CoQ(10) and vitamin E, suggesting that the abnormally high levels of ROS were the triggers of cell death.
    explanation: The cybrid rescue result whose translational validity this discussion questions.
    directness: INDIRECT
notes: 'Scope: anchored on OMIM 500010/MONDO:0010781 and the original m.8993T>C adult kindred. Related m.9035T>C/m.9185T>C ataxia and NARP/Leigh observations are qualified as indirect evidence. NARP is not restricted to childhood and is not separable by a universal heteroplasmy threshold. The original paper is available as a reprint in the author thesis; its four-page published article, rather than the entire thesis, supplied the URL evidence. The generated cache title is retained.

  GeneReviews NBK1173 is a shared Leigh-spectrum chapter. Clinical overlap, diagnostic methods, supportive care and maternal counseling were reviewed and used with explicit scope limits; infantile phenotype frequencies and treatment-trial claims were not transferred.

  The existing falcon deep-research report fails the disease-identity preflight: its body addresses RFC1/CANVAS (MONDO:0044720), not the MT-ATP6 disorder. Its mechanisms and therapeutic claims were excluded. CANVAS remains an independently sourced differential.

  The MONDO parent placement reported by the earlier curation requires separate ontology review; the descriptive parents here follow the established mitochondrial mechanism. No ontology-hierarchy change is part of this review.'

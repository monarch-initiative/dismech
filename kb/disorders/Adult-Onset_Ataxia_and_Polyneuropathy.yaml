name: Adult-Onset Ataxia and Polyneuropathy
creation_date: '2026-08-19T00:00:00Z'
description: >-
  Adult-onset ataxia and polyneuropathy (OMIM 500010) is a maternally inherited
  mitochondrial disorder defined by a kindred carrying the heteroplasmic
  m.8993T>C variant of MT-ATP6, in which slowly progressive cerebellar ataxia
  and axonal sensorimotor polyneuropathy begin in adult life. The same
  nucleotide-8993 substitution more commonly causes infantile or childhood
  disease (maternally inherited Leigh syndrome, NARP), so this entity marks the
  mild, late-onset end of a heteroplasmy- and modifier-dependent MT-ATP6
  spectrum rather than a distinct molecular lesion. Because standard adult
  mitochondrial screening (cytochrome c oxidase muscle histochemistry,
  respiratory-chain enzymology) is typically normal in MT-ATP6 disease, affected
  adults are readily misclassified as undiagnosed spinocerebellar ataxia or
  Charcot-Marie-Tooth disease unless mtDNA is sequenced. Other MT-ATP6 variants
  (m.9035T>C, m.9185T>C) produce clinically indistinguishable adult-onset
  ataxia with variable pyramidal and peripheral-nerve involvement.
category: Mendelian
parents:
- hereditary disease
- mitochondrial disease
synonyms:
- Ataxia and polyneuropathy, adult-onset
- Adult-onset MT-ATP6 ataxia and axonal neuropathy
disease_term:
  preferred_term: adult-onset ataxia and polyneuropathy
  term:
    id: MONDO:0010781
    label: ataxia and polyneuropathy, adult-onset

pathophysiology:
- name: MT-ATP6 m.8993T>C Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heteroplasmic thymine-to-cytosine transition at mtDNA nucleotide 8993
    substitutes the highly conserved leucine at codon 156 of the ATP6 subunit
    (subunit a) of mitochondrial ATP synthase. The same nucleotide is the site
    of the more severe m.8993T>G (Leu156Arg) NARP/MILS variant.
  genes:
  - preferred_term: MT-ATP6
    term:
      id: hgnc:7414
      label: MT-ATP6
  cellular_components:
  - preferred_term: proton-transporting ATP synthase complex
    term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
  genetic_context:
    gene:
      preferred_term: MT-ATP6
      term:
        id: hgnc:7414
        label: MT-ATP6
    allele_type: SNV
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Heteroplasmic mitochondrial missense substitution (Leu156Pro) inherited
      through the maternal line.
  molecular_functions:
  - preferred_term: proton-transporting ATP synthase activity, rotational mechanism
    term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    modifier: DECREASED
  evidence:
  - reference: PMID:16049925
    reference_title: Adult-onset ataxia and polyneuropathy caused by mitochondrial 8993T-->C mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a kindred with adult-onset slowly progressive ataxia and
      polyneuropathy and with the heteroplasmic 8993T-->C mutation.
    explanation: >-
      This is the defining report for OMIM 500010 and directly ties the
      heteroplasmic m.8993T>C MT-ATP6 variant to the adult-onset
      ataxia-plus-polyneuropathy phenotype.
  - reference: PMID:17568559
    reference_title: Biochemical phenotypes associated with the mitochondrial ATP6 gene mutations at nt8993.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two point mutations (T>G and T>C) at the same 8993 nucleotide of
      mitochondrial DNA (at comparable mutant load), affecting the ATPase 6
      subunit of the F1F0-ATPase, result in neurological phenotypes of variable
      severity in humans.
    explanation: >-
      Locates the lesion in the ATPase 6 subunit of F1F0-ATP synthase and
      records that the two nucleotide-8993 substitutions differ in severity.
  downstream:
  - target: Impaired ATP Synthase Function
    causal_link_type: DIRECT
    description: >-
      Substitution of the conserved Leu-156 residue in the membrane sector of
      subunit a degrades proton-driven ATP synthesis.
    evidence:
    - reference: PMID:17568559
      reference_title: Biochemical phenotypes associated with the mitochondrial ATP6 gene mutations at nt8993.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results possibly highlight the different pathogenic mechanism
        generated by the two mutations at position 8993 and provide useful
        information to better characterize the biochemical role of the highly
        conserved Leu-156 in ATPase 6 subunit of the mitochondrial ATP synthase
        complex.
      explanation: >-
        Directly attributes the biochemical defect to the conserved Leu-156
        residue of the ATP synthase ATPase 6 subunit.
  - target: Heteroplasmy Load Above the Phenotypic Threshold
    causal_link_type: DIRECT
    description: >-
      Because the variant is heteroplasmic, disease expression depends on the
      proportion of mutant mtDNA molecules reached in a given tissue.

- name: Impaired ATP Synthase Function
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Loss of the conserved subunit-a leucine impairs the proton-translocating
    membrane sector of complex V, so the proton-motive force is used
    inefficiently for ATP synthesis. Whether the primary lesion is catalytic or
    one of assembly and stability is not settled: complex V subcomplexes are
    detectable on native gels in patient tissue, which points toward an assembly
    or stability problem, and the authors who reported them said further work is
    needed to decide between the two readings.
  molecular_functions:
  - preferred_term: proton-transporting ATP synthase activity, rotational mechanism
    modifier: DECREASED
    term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
  biological_processes:
  - preferred_term: proton motive force-driven ATP synthesis
    modifier: DECREASED
    term:
      id: GO:0015986
      label: proton motive force-driven ATP synthesis
  cellular_components:
  - preferred_term: proton-transporting ATP synthase complex
    term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
  evidence:
  - reference: PMID:19626676
    reference_title: Identification of ataxia-associated mtDNA mutations (m.4052T>C and m.9035T>C) and evaluation of their pathogenicity in transmitochondrial cybrids.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We confirmed that the 4452T>C transition in tRNA(Met) represented a
      polymorphism; however, 9035T>C conversion in the ATP6 gene was
      responsible for a defective F(0)-ATPase.
    explanation: >-
      Cybrid evidence that an ataxia-associated MT-ATP6 missense variant
      produces a defective F0-ATPase. PARTIAL because this cybrid work used
      m.9035T>C, a different MT-ATP6 variant in the same adult-onset ataxia
      spectrum, not the m.8993T>C variant that defines this entry.
  - reference: PMID:35159298
    reference_title: "Clinical Heterogeneity in MT-ATP6 Pathogenic Variants: Same Genotype-Different Onset."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Native gels found presence of subcomplexes of complex V in fibroblast
      and/or skeletal muscle.
    explanation: >-
      Patient-tissue evidence that an MT-ATP6 ataxia variant perturbs complex V.
      PARTIAL because the patients carried m.9035T>C rather than m.8993T>C.
  - reference: PMID:35159298
    reference_title: "Clinical Heterogeneity in MT-ATP6 Pathogenic Variants: Same Genotype-Different Onset."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The occurrence of subcomplexes suggest that variant
      NC_012920.1(MT-ATP6):m.9035T>C could cause problems with complex V
      assembly or stability. However, further research is warranted to further
      evaluate these hypotheses.
    explanation: >-
      The authors' own reading of the subcomplex finding, and their statement
      that the assembly-versus-catalysis question is unresolved. Cited here so
      the node description does not over-read the native-gel result. PARTIAL
      because the variant is m.9035T>C rather than m.8993T>C.
  downstream:
  - target: Neuronal Energy Deficit and Oxidative Stress
    causal_link_type: DIRECT
    description: >-
      Inefficient oxidative phosphorylation lowers cellular ATP and raises
      reactive oxygen species output from the respiratory chain.
    evidence:
    - reference: PMID:17568559
      reference_title: Biochemical phenotypes associated with the mitochondrial ATP6 gene mutations at nt8993.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both 8993T>G and 8993T>C mutations led to energy deprivation and ROS
        overproduction.
      explanation: >-
        Patient lymphocytes carrying m.8993T>C show both of the downstream
        consequences asserted by this edge.

- name: Heteroplasmy Load Above the Phenotypic Threshold
  role: modulator
  biological_scale: CELLULAR
  description: >-
    Mitochondrial heteroplasmy is the gate between carrier state and disease.
    MT-ATP6 ataxia variants require a very high mutant load before symptoms
    appear, and mutant load segregates unpredictably between tissues and between
    generations through the germline bottleneck. This is the most plausible
    explanation for why the same nucleotide-8993 change causes infantile Leigh
    syndrome in some pedigrees and only adult-onset ataxia in others, although
    load alone does not fully predict severity.
  evidence:
  - reference: PMID:35159298
    reference_title: "Clinical Heterogeneity in MT-ATP6 Pathogenic Variants: Same Genotype-Different Onset."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The above mentioned findings suggest there is a very high heteroplasmy
      threshold required for NC_012920.1(MT-ATP6):m.9035T>C to trigger
      phenotypic manifestations, but once this threshold is exceeded, this can
      result in different clinical manifestations.
    explanation: >-
      States the high-threshold, poorly-predictive relationship between MT-ATP6
      mutant load and phenotype. PARTIAL because it was established for
      m.9035T>C rather than m.8993T>C.
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were marked phenotypic differences between family members, even
      between individuals with the greatest degrees of ectodermal and mesodermal
      heteroplasmy.
    explanation: >-
      In an m.8993T>C family, measured heteroplasmy did not account for the
      within-family phenotypic spread, supporting the modulator role and the
      limits of load as a predictor. PARTIAL because the cohort was diagnosed
      as NARP syndrome (MONDO:0010794), an entity this entry keeps distinct;
      the observation carries across because the modulator claim is about
      m.8993T>C heteroplasmy behaviour rather than about either phenotype.
  - reference: PMID:20301352
    reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Sibs may inherit the pathogenic variant at varying heteroplasmy levels due
      to the bottleneck effect and variant-specific segregation patterns.
    explanation: >-
      GeneReviews statement of the germline-bottleneck mechanism that generates
      the variable mutant loads this node depends on; PARTIAL because it is a
      general statement about mtDNA disorders rather than about this entity.
  downstream:
  - target: Neuronal Energy Deficit and Oxidative Stress
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Only tissues whose mutant load exceeds the threshold express a
      bioenergetic defect, which is why the phenotype is regionally restricted
      and appears late.

- name: Neuronal Energy Deficit and Oxidative Stress
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: peripheral_axonal_degeneration#Axonal Transport Impairment and Mitochondrial Dysfunction
  description: >-
    Cells above the heteroplasmy threshold sustain a chronic ATP shortfall and
    an increased reactive-oxygen-species burden, and compensate by shifting
    toward glycolysis. For the m.8993T>C substitution specifically the balance
    is tilted toward ROS overproduction rather than the more severe energy
    failure seen with m.8993T>G, which fits the milder, later-onset phenotype.
    Long projection neurons and cerebellar neurons, which depend on distributed
    mitochondrial ATP supply, are the tissues in which this shortfall becomes
    clinically apparent.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: reactive oxygen species metabolic process
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:

    modifier: DECREASED
    term:
      id: GO:0098930
      label: axonal transport
  - preferred_term: transmission of nerve impulse
    modifier: DECREASED
    term:
      id: GO:0019226
      label: transmission of nerve impulse
  evidence:
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EMG-NCS revealed varying degrees of length-dependent sensorimotor axonal
      polyneuropathy.
    explanation: >-
      Electrophysiological demonstration of length-dependent axonal sensorimotor
      polyneuropathy in an m.8993T>C family. PARTIAL because that family was
      diagnosed as NARP syndrome (MONDO:0010794), which this entry curates as a
      separate entity and a differential.
  - reference: PMID:16049925
    reference_title: Adult-onset ataxia and polyneuropathy caused by mitochondrial 8993T-->C mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that the 8993T-->C mtDNA mutation should be
      considered in the differential diagnosis of nondominant adult-onset ataxia
      and axonal neuropathy.
    explanation: >-
      The defining report characterises the neuropathy of this entity as
      axonal.
  downstream:
  - target: Adult-Onset Ataxia with Axonal Polyneuropathy
    causal_link_type: DIRECT
    description: >-
      Peripheral sensory loss compounds cerebellar incoordination, worsening
      gait instability.

- name: Cerebellar Degeneration
  role: effector
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Progressive cerebellar volume loss underlies the ataxia. Cerebellar atrophy
    is demonstrable on brain MRI in m.8993T>C carriers. The cell-level
    neuropathology has not been established for this adult-onset entity: no
    autopsy series localises the loss to Purkinje neurons specifically, so the
    Purkinje cell type is recorded here as the presumed but unproven substrate
    (see the KNOWLEDGE_GAP discussion).
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: nervous system process
    modifier: ABNORMAL
    term:
      id: GO:0050877
      label: nervous system process
  evidence:
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3-T MRI revealed cerebellar atrophy and cystic and cavitary T2
      hyperintensities in the basal ganglia.
    explanation: >-
      Imaging evidence of cerebellar atrophy in an m.8993T>C family, supporting
      cerebellar degeneration as the anatomical substrate of the ataxia. PARTIAL
      because that family was diagnosed as NARP syndrome (MONDO:0010794), which
      this entry curates as a separate entity and a differential.
  downstream:
  - target: Adult-Onset Ataxia with Axonal Polyneuropathy
    causal_link_type: DIRECT
    description: >-
      Loss of cerebellar cortical output produces gait and limb ataxia,
      dysarthria, and abnormal eye movements.

- name: Adult-Onset Ataxia with Axonal Polyneuropathy
  role: consequence
  biological_scale: ORGANISM
  conforms_to: cerebellar_purkinje_degeneration#Cerebellar Ataxia
  description: >-
    The combined clinical syndrome: slowly progressive cerebellar ataxia
    beginning in adulthood together with an axonal sensorimotor polyneuropathy,
    variably accompanied by pyramidal signs. It is clinically indistinguishable
    from other adult spinocerebellar ataxias, and the routine adult
    mitochondrial screening tests are normal, so mtDNA sequencing is the only
    route to diagnosis.
  evidence:
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors report two families with onset of ataxia in adulthood (with
      pyramidal dysfunction and/or peripheral neuropathy variably present), who
      are clinically indistinguishable from other spinocerebellar ataxia
      patients.
    explanation: >-
      Characterises the adult-onset MT-ATP6 syndrome as an ataxia with variable
      neuropathy and pyramidal involvement that mimics common spinocerebellar
      ataxias.


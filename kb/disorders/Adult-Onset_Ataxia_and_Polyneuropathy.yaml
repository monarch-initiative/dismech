biochemical:
- name: Cytochrome c oxidase muscle histochemistry
  notes: 'Unlike most adult mitochondrial disease, COX histochemistry on muscle is typically normal in MT-ATP6 disorders. This normal result is diagnostically important: it is the reason these patients are missed by the standard adult mitochondrial workup.'
  presence: Normal
  evidence:
  - reference: PMID:18055910
    reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cytochrome c oxidase muscle histochemistry, which is the standard clinical investigation for mitochondrial disease in adults, is usually normal in patients with MTATP6 mutations.
    explanation: States directly that the standard adult mitochondrial screening test is normal in MT-ATP6 disease.
- name: Respiratory chain enzyme activities
  notes: Routine respiratory-chain enzymology and muscle histology can be normal or nonspecific. The 2012 series measured complexes I–IV in two patients and had three nonspecific/normal biopsies; it did not demonstrate normal ATP synthesis. In the later m.9035T>C study, oligomycin-sensitive ATP hydrolysis was normal despite other evidence of mitochondrial dysfunction. Assay direction and preparation matter.
  presence: Normal
  evidence:
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Other investigations including muscle biopsy and respiratory chain enzyme activity were non-specific or normal.
    explanation: Directly reports normal or non-specific respiratory-chain enzymology in adult-onset MT-ATP6 ataxia families.
genetic:
- name: MT-ATP6
  gene_term:
    preferred_term: MT-ATP6
    term:
      id: hgnc:7414
      label: MT-ATP6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Heteroplasmic m.8993T>C (Leu156Pro) defines the original OMIM 500010 family. Related m.9035T>C (Leu170Pro) and m.9185T>C (Leu220Pro) can cause similar adult ataxia. High heteroplasmy and even homoplasmy do not uniquely determine age at onset. Protein substitutions in the discussion of the 2012 paper are swapped; the assignments here follow the 2022 primary paper and GeneReviews.
  inheritance:
  - name: Mitochondrial inheritance
    inheritance_term:
      preferred_term: Mitochondrial inheritance
      term:
        id: HP:0001427
        label: Mitochondrial inheritance
    description: Maternal transmission of a heteroplasmic mtDNA variant; mutant load segregates through the germline bottleneck, so sibs and offspring inherit varying loads and clinical expression is incompletely predictable.
    evidence:
    - reference: PMID:20301352
      reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: Sibs may inherit the pathogenic variant at varying heteroplasmy levels due to the bottleneck effect and variant-specific segregation patterns.
      explanation: GeneReviews statement of maternal transmission with bottleneck-driven heteroplasmy variation. Graded INDIRECT because the chapter covers mtDNA-Leigh syndrome spectrum generally rather than this adult-onset entity.
      quote_role: REVIEW_SYNTHESIS
    - reference: PMID:18055910
      reference_title: Episodic ataxia and hemiplegia caused by the 8993T->C mitochondrial DNA mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified a three-generation family with the m.8993T-->C mutation of mtDNA.
      explanation: A three-generation pedigree carrying the variant is direct evidence of vertical (maternal) transmission of m.8993T>C.
    - *id006
  evidence:
  - reference: PMID:16049925
    reference_title: Adult-onset ataxia and polyneuropathy caused by mitochondrial 8993T-->C mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a kindred with adult-onset slowly progressive ataxia and polyneuropathy and with the heteroplasmic 8993T-->C mutation.
    explanation: Establishes MT-ATP6 m.8993T>C as the causal variant for this entity.
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These families had the m.9185T>C and m.9035T>C mutations, respectively, which have not previously been associated with adult-onset cerebellar syndromes.
    explanation: Extends the causal gene beyond m.8993T>C to other MT-ATP6 missense variants producing adult-onset cerebellar syndromes.
  - *id007
diagnosis:
- name: Mitochondrial DNA sequencing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Molecular testing of MT-ATP6, through targeted sequencing or an appropriate comprehensive mitochondrial/genomic approach, should be considered in unexplained adult ataxia with neuropathy despite normal muscle investigations. Quantify heteroplasmy and interpret the pathogenic variant together with the phenotype. Leukocyte DNA was informative in the published adult MT-ATP6 families; tissue selection and assay sensitivity should be individualized, without importing the low-blood-load behavior of unrelated mtDNA variants.
  results: A pathogenic MT-ATP6 variant with a compatible phenotype establishes the molecular diagnosis; related variants may be heteroplasmic or homoplasmic. The molecular finding alone does not define the adult clinical subtype.
  evidence:
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MTATP6 sequencing should be considered in the workup of undiagnosed ataxia, even if other investigations do not suggest a mitochondrial DNA disorder.
    explanation: Direct recommendation that MT-ATP6 sequencing be part of the undiagnosed adult ataxia workup regardless of other test results.
  - reference: PMID:20953793
    reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: The degree of mutant heteroplasmy for the m.8993T>C mutation was evaluated by real-time allele refractory mutation system quantitative PCR of mtDNA from hair bulbs (ectoderm) and blood leukocytes (mesoderm).
    explanation: Illustrates the multi-tissue heteroplasmy quantification this diagnostic step calls for. Graded INDIRECT because the study quantified heteroplasmy in an m.8993T>C family diagnosed as NARP syndrome (MONDO:0010794); the method transfers, the cohort is a different entity.
  - reference: PMID:22577227
    reference_title: Adult-onset spinocerebellar ataxia syndromes due to MTATP6 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, unlike many mtDNA disorders, MTATP6 sequencing can be reliably performed on leucocyte DNA, and should be considered as a diagnostic test in the workup of ataxia and neuropathy, even when the routine clinical investigations for mitochondrial disease are normal.
    explanation: Direct diagnostic conclusion from the related adult pedigrees; not a guarantee that every assay or every mitochondrial variant is detectable in blood.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1173/
    reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Genome sequencing is preferred (if available), as it allows analysis of the mitochondrial and nuclear genome, and typically has the highest diagnostic rate.
    explanation: 'GeneReviews mtDNA-associated Leigh syndrome spectrum chapter: Shared diagnostic approach from the Leigh-spectrum chapter; this is not a measured diagnostic yield for the adult entity.'
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT

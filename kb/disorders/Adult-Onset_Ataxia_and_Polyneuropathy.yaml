  biological_scale: MOLECULAR
  description: 'The m.8993T>C ATP6 substitution perturbs ATP-synthase-related bioenergetics. In related m.9035T>C cybrids, F0-ATPase dysfunction was measured. Complex V subcomplexes in m.9035T>C patient material suggest altered assembly or stability, but that interpretation is provisional: oligomycin-sensitive ATP hydrolysis was normal in the later primary-fibroblast and muscle study. The assays and cellular backgrounds differ.'

name: Adult-Onset Ataxia and Polyneuropathy
creation_date: '2026-08-19T00:00:00Z'
description: Adult-onset ataxia and polyneuropathy (OMIM 500010) is a maternally inherited mitochondrial disorder anchored on a Finnish kindred with heteroplasmic MT-ATP6 m.8993T>C. Two of three examined adult siblings had slowly progressive overt ataxia and all three had axonal sensorimotor neuropathy; cerebellar and sensory dysfunction both contributed to the ataxia. Related m.9035T>C and m.9185T>C disorders can have similar adult presentations, with variable pyramidal signs. Adult onset can occur despite high mutant loads. Normal routine muscle histochemistry, respiratory-chain enzymology or MRI does not exclude an MT-ATP6 disorder. NARP and Leigh syndrome are overlapping presentations of the same broader mitochondrial spectrum, with different defining clinical patterns.
category: Mendelian
parents:
- hereditary disease
- mitochondrial disease
synonyms:
- Ataxia and polyneuropathy, adult-onset
- Adult-onset MT-ATP6 ataxia and axonal neuropathy
disease_term:
  preferred_term: adult-onset ataxia and polyneuropathy
  term:
    id: MONDO:0010781
    label: ataxia and polyneuropathy, adult-onset
inheritance:
- name: Maternal mitochondrial inheritance
  description: Maternal transmission of a mitochondrial MT-ATP6 variant, with variable heteroplasmy and expression. Adult onset is not explained simply by a low mutant load; related adult ataxia pedigrees had 90–99% heteroplasmy in leukocytes. Males do not transmit mtDNA variants; offspring of affected females are at risk, but inheritance does not guarantee clinical disease.
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  evidence:
  - reference: PMID:35159298
    reference_title: 'Clinical Heterogeneity in MT-ATP6 Pathogenic Variants: Same Genotype-Different Onset.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pathogenic variants in MT-ATP6 are a well-known cause of maternally-inherited mitochondrial disorders
    explanation: Establishes maternal transmission as the inheritance mode for MT-ATP6 disorders, the gene carrying this entry's causal variants.
  - &id006
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1173/
    reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: is transmitted by mitochondrial (maternal) inheritance.
    explanation: 'GeneReviews mtDNA-associated Leigh syndrome spectrum chapter: Maternal inheritance applies to this MT-ATP6 disorder, although the chapter is not an adult-ataxia-specific cohort.'
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
pathophysiology:
- name: MT-ATP6 m.8993T>C Variant
  role: trigger
  biological_scale: MOLECULAR
  description: The defining mitochondrial m.8993T>C missense variant substitutes proline for leucine at ATP6 residue 156. ATP6 encodes subunit a of ATP synthase. Related adult-ataxia variants m.9035T>C and m.9185T>C have distinct assay and clinical evidence; their results are qualified wherever used.

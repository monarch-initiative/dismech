discussions:
- discussion_id: gliotoxin_virulence_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does gliotoxin production contribute materially to Aspergillus virulence in
    human disease, or is its measured virulence contribution specific to
    invertebrate infection models?
  attaches_to:
  - pathophysiology#Gliotoxin-Mediated Suppression of Host Phagocyte Function
  rationale: >-
    The direct evidence tying virulence to gliotoxin production rather than to
    growth rate or enzyme activity comes from Galleria mellonella, and the
    authors qualify the finding to that model. Galleria has no adaptive immunity
    and no neutrophils, so it cannot test the phagocyte suppression that the
    mechanism is proposed to act through in humans. Human aspergillosis is
    dominated by host-side phagocyte defects, which this entry models upstream.
    The gap matters because gliotoxin is periodically proposed as a therapeutic
    or diagnostic target on the strength of model-system data.
  evidence:
  - reference: PMID:15487324
    reference_title: Correlation between gliotoxin production and virulence of Aspergillus fumigatus in Galleria mellonella.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      implicating a critical role for gliotoxin production rather than growth
      rate or enzymatic activity in the virulence of A. fumigatus in this model
    explanation: >-
      The authors themselves restrict the virulence conclusion to the Galleria
      model, which is the mismatch this discussion records.
notes: >-
  Concept decision (issue #9041): curated as a single root Disease with
  has_subtypes rather than as a kb/groupings/ Grouping. The forms share one
  conserved pathograph — inhalation of ubiquitous conidia, then a phagocyte
  gate whose state sets the branch — so they are specialisations of one
  mechanism rather than a union of mechanistically distinct diseases, which is
  the test a grouping would have to meet. The host-status axis is carried
  explicitly by the environmental block (corticosteroid exposure, severe viral
  critical illness) and the genetic block (CYBB, TLR4) rather than being
  implied by the subtype names.

  Related dismech entries: Cystic_Fibrosis and Hypersensitivity_Pneumonitis for
  the ABPA host context and the adjacent allergic lung disease;
  Chronic_Granulomatous_Disease for the phagocyte-defect host; Otomycosis for
  non-invasive Aspergillus disease outside the lung; and the
  fungal_cell_wall_glucan_synthesis_inhibition and
  antifungal_intrinsic_resistance_gating modules, both of which this entry
  conforms to.

  Deliberate omissions. ECTO has no term
  for exposure to Aspergillus, fungi, or airborne spores, so the conidial
  exposure is bound to the general ECTO:3000000 organism-exposure class. No
  datasets block is included: no Aspergillus-specific accession was verified for
  this entry, and an unverified accession is worse than none.

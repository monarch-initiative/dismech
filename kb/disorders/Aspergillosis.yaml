    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism of action of triazoles (Figure 2D-H) is based on the
      inhibition of the microsomal cytochrome P450 (CYP450) monooxygenase
      dependent 14-α-demethylase (Figure 3).
    explanation: >-
      Identifies the enzyme this node models as the triazole target. Evidence
      source is OTHER because this is a review.
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The combination of the accumulation of toxic 14-α-methylsterols and
      depletion of ergosterol results in the fungistatic effect
    explanation: >-
      States the consequence of inhibiting this step, which is why the node is
      a therapeutic vulnerability. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Ergosterol-Enriched Aspergillus Plasma Membrane
    causal_link_type: DIRECT
    description: >-
      Completing the demethylase step and the reactions downstream of it yields
      the ergosterol that is incorporated into the fungal plasma membrane.

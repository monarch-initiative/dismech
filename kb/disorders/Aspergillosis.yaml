- name: Environmental cyp51A-Mediated Azole Resistance
  biological_scale: MOLECULAR
  role: adaptive_escape
  conforms_to: fungal_ergosterol_synthesis_inhibition#Azole-Target Resistance
  description: >-
    Agricultural azole fungicides share the Cyp51 target with clinical
    triazoles, so field application selects pan-azole-resistant A. fumigatus in
    the environment rather than in the treated patient. The dominant genotype is
    TR34/L98H — a 34-bp tandem repeat in the cyp51A promoter driving
    overexpression, plus a leucine-to-histidine substitution at codon 98 — with
    TR46/Y121F/T289A the second common allele. Because selection happens outside
    the host, azole-naive patients can present with resistant disease, and the
    resistant genotypes have spread across Europe from a common ancestor.

name: Aspergillosis
creation_date: "2026-08-28T00:00:00Z"
category: Infectious Disease
description: >-
  Disease caused by inhaled Aspergillus species, predominantly Aspergillus
  fumigatus. Conidia are ubiquitous in air and are inhaled continuously by
  everyone, so the organism is not by itself the determinant of disease: the
  clinical form is set far more by the host than by the fungus. Where phagocyte
  number or function is lost — chemotherapy-induced neutropenia, corticosteroid
  therapy, transplantation, chronic granulomatous disease, severe influenza or
  COVID-19 — conidia germinate, hyphae invade tissue and blood vessels, and the
  disease is acute, angioinvasive and frequently fatal. Where innate immunity is
  intact but the lung is structurally damaged, the same organism produces
  indolent cavitary and fibrosing disease over months to years. Where immunity is
  intact but dysregulated toward a Th2/IgE response, it produces allergic disease
  in asthma and cystic fibrosis without tissue invasion at all. This entry curates
  the shared root mechanism — inhalation, phagocyte gating, and the branch point
  set by host status — and carries the clinical forms as subtypes.
parents:
- Fungal infection
synonyms:
- Aspergillus infection
- Pulmonary aspergillosis
disease_term:
  preferred_term: aspergillosis
  term:
    id: MONDO:0005657
    label: aspergillosis
infectious_agent:
- name: Aspergillus species
  infectious_agent_term:
    preferred_term: Aspergillus
    term:
      id: NCBITaxon:5052
      label: Aspergillus
  description: >-
    Aspergillus fumigatus causes the large majority of human aspergillosis;
    A. flavus, A. terreus, A. niger and A. nidulans account for most of the
    remainder and matter clinically because susceptibility differs by species
    (A. terreus is characteristically amphotericin B resistant). A. fumigatus is
    a soil saprotroph whose small hydrophobic conidia are dispersed in air and
    reach the alveolus on inhalation; its capacity to grow at 37 C and to
    tolerate host oxidative and nutritional stress is an adaptation to that
    saprotrophic niche rather than to parasitism, which is why disease is
    opportunistic.
  evidence:
  - reference: PMID:31722890
    reference_title: Aspergillus fumigatus and Aspergillosis in 2019.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus fumigatus is a saprotrophic fungus; its primary habitat is the
      soil. In its ecological niche, the fungus has learned how to adapt and
      proliferate in hostile environments. This capacity has helped the fungus to
      resist and survive against human host defenses
    explanation: >-
      Establishes A. fumigatus as an environmental saprotroph whose host-defence
      resistance derives from its environmental niche, which is the basis for
      treating aspergillosis as an opportunistic rather than an obligate
      infection. Evidence source is OTHER because this is a review.
transmission:
- name: Inhalation of airborne conidia
  description: >-
    Acquired by inhaling airborne Aspergillus conidia from the ambient
    environment. There is no established person-to-person transmission; the
    reservoir is soil, decaying vegetation and construction or ventilation dust.
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus species are ubiquitous in the environment. Aspergillosis is
      acquired by inhalation of Aspergillus spores. In normal hosts, spore
      inhalation rarely causes lung disease.
    explanation: >-
      States the route of acquisition and that inhalation alone is not
      sufficient for disease in a normal host. Evidence source is OTHER because
      this is a review.
has_subtypes:
- name: Invasive
  display_name: Invasive aspergillosis (including invasive pulmonary aspergillosis)
  subtype_term:
    preferred_term: invasive aspergillosis
    term:
      id: MONDO:0000240
      label: invasive aspergillosis
  description: >-
    Acute, tissue-invasive infection of the severely immunocompromised host —
    prolonged neutropenia after chemotherapy or allogeneic transplantation,
    high-dose corticosteroids, chronic granulomatous disease — and, increasingly,
    of the non-classically-immunocompromised ICU patient with severe influenza or
    COVID-19. Hyphae invade lung parenchyma and blood vessels, producing
    thrombosis, infarction and haematogenous spread. Mortality is high.
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Invasive Aspergillosis usually occurs in severely immunocompromised
      patients, typically in neutropenic but also in non-neutropenic patients.
    explanation: >-
      Defines the host context of the invasive subtype and notes that it is not
      restricted to neutropenic hosts. Evidence source is OTHER because this is
      a review.
- name: Chronic Pulmonary
  display_name: Chronic pulmonary aspergillosis (CCPA and chronic fibrosing forms)
  description: >-
    Slowly progressive cavitary and fibrosing lung infection in a patient with
    prior or current structural lung disease (treated tuberculosis, COPD,
    sarcoidosis, prior thoracic surgery) but without significant systemic
    immunocompromise. Chronic cavitary pulmonary aspergillosis is the commonest
    form and may progress to chronic fibrosing pulmonary aspergillosis. No
    subtype_term is bound: MONDO carries a term for pulmonary aspergilloma
    (bound on the Aspergilloma subtype) and for invasive aspergillosis, but none
    for chronic cavitary or chronic fibrosing pulmonary aspergillosis, which are
    covered only by the parent term MONDO:0005657 already on this entry.
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common form of CPA is chronic cavitary pulmonary aspergillosis
      (CCPA), which untreated may progress to chronic fibrosing pulmonary
      aspergillosis.
    explanation: >-
      The ESCMID/ERS guideline names CCPA as the commonest chronic form and its
      fibrosing endpoint, which is what this subtype covers. Evidence source is
      OTHER because this is a guideline review.
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic pulmonary Aspergillosis affects patients with chronic structural
      lung disease such as COPD or previous mycobacterial lung disease, but
      without other significant immunocompromise.
    explanation: >-
      States the defining host context that separates this subtype from the
      invasive one — structural lung disease without systemic immunocompromise.
      Evidence source is OTHER because this is a review.
- name: Aspergilloma
  display_name: Aspergilloma (pulmonary fungal ball)
  subtype_term:
    preferred_term: pulmonary aspergilloma
    term:
      id: MONDO:0000266
      label: pulmonary aspergilloma
  description: >-
    Saprophytic colonisation of a pre-existing pulmonary cavity by a conglomerate
    of hyphae, mucus and cellular debris, without tissue invasion. Usually
    minimally symptomatic, but haemoptysis from the bronchial circulation
    surrounding the cavity can be life-threatening. Formally a subset of chronic
    pulmonary aspergillosis; kept as its own subtype because it has its own MONDO
    identity, its own natural history and a distinct management pathway
    (surgical excision rather than long-term azole therapy).
  evidence:
  - reference: PMID:31536274
    reference_title: Aspergilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergilloma and chronic cavitary pulmonary aspergillosis (CCPA) refer to
      the inert saprophytic colonization of preexisting cavitary spaces in the
      pulmonary parenchyma
    explanation: >-
      Establishes the aspergilloma as saprophytic colonisation of a pre-existing
      cavity, the feature that distinguishes it from invasive disease. Evidence
      source is OTHER because this is a review.
- name: ABPA
  display_name: Allergic bronchopulmonary aspergillosis
  subtype_term:
    preferred_term: allergic bronchopulmonary aspergillosis
    term:
      id: MONDO:0015243
      label: allergic bronchopulmonary aspergillosis
  description: >-
    Th2-driven hypersensitivity to Aspergillus antigens in a host with asthma or
    cystic fibrosis, with no tissue invasion. Presents as poorly controlled
    asthma with recurrent pulmonary infiltrates, mucus plugging, marked total and
    Aspergillus-specific IgE elevation, eosinophilia and, over time, central
    bronchiectasis. The dismech entries for Cystic_Fibrosis and
    Hypersensitivity_Pneumonitis are the adjacent host-context and
    allergic-lung-disease entries.
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Allergic bronchopulmonary aspergillosis (ABPA) is an immunological
      pulmonary disorder caused by hypersensitivity to Aspergillus fumigatus,
      manifesting with poorly controlled asthma, recurrent pulmonary infiltrates
      and bronchiectasis.
    explanation: >-
      The ISHAM working-group review defines ABPA as a hypersensitivity disorder
      with this manifestation triad. Evidence source is OTHER because this is a
      review.
- name: Aspergillus Bronchitis
  display_name: Aspergillus bronchitis
  description: >-
    Aspergillus infection confined to the bronchial tree in a patient with
    pre-existing bronchial disease, typically bronchiectasis, without parenchymal
    invasion and without the IgE-mediated hypersensitivity that defines ABPA.
    No subtype_term is bound: MONDO carries no term for Aspergillus bronchitis
    and it is covered only by the parent term MONDO:0005657 already on this
    entry.
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus bronchitis affects patients with bronchial disease such as
      bronchiectasis.
    explanation: >-
      Names Aspergillus bronchitis as a distinct member of the pulmonary
      aspergillosis spectrum and gives its host context. Evidence source is
      OTHER because this is a review.
- name: Disseminated
  display_name: Disseminated and extrapulmonary aspergillosis
  description: >-
    Haematogenous spread from an angioinvasive pulmonary focus to brain, skin,
    eye, heart, bone or viscera, or primary cutaneous inoculation at a catheter
    or burn site. CNS involvement (neuroaspergillosis, MONDO:0005873) is the
    commonest and most lethal extrapulmonary site. No subtype_term is bound at
    this level: MONDO codes individual organ forms such as neuroaspergillosis but
    has no general disseminated-aspergillosis term, and binding the CNS term here
    would misdescribe the non-CNS forms this subtype also covers.
  evidence:
  - reference: PMID:17050430
    reference_title: Interactions of Aspergillus fumigatus with vascular endothelial cells.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Some of these hyphal fragments can break off and circulate in the
      bloodstream. In severely immunocompromised hosts, these blood-borne hyphal
      fragments adhere to the luminal surface of the endothelial cells and they
      penetrate the endothelial cell lining of the vasculature by passing from
      the luminal to the abluminal surface.
    explanation: >-
      The authors' characterisation of the vascular route by which an invasive
      pulmonary focus seeds distant organs, which is what defines this subtype.
      Graded PARTIAL because this sentence frames their model rather than
      reporting a measurement.
prevalence:
- subtype: Invasive
  population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 26.4
  notes: >-
    Derived from the 2024 global fungal-disease burden estimate of over 2 113 000
    incident invasive aspergillosis cases per year, normalised against a world
    population of approximately 8 billion. The source counts cases arising in
    adults with COPD, critical illness, lung cancer or haematological malignancy;
    the rate here is expressed against the whole population, not against that
    at-risk denominator. This is a modelled estimate over
    at-risk denominators, not a measured population rate, and it deliberately
    excludes influenza- and COVID-19-associated outbreaks.
  evidence:
  - reference: PMID:38224705
    reference_title: Global incidence and mortality of severe fungal disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Annually, over 2 113 000 people develop invasive aspergillosis in the
      context of chronic obstructive pulmonary disease, intensive care, lung
      cancer, or haematological malignancy, with a crude annual mortality of
      1 801 000 (85·2%).
    explanation: >-
      Source of the incidence figure and of the accompanying crude mortality.
      Evidence source is OTHER because this is a modelling and literature-synthesis
      study rather than a primary clinical cohort.
- subtype: Chronic Pulmonary
  population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 23.0
  notes: >-
    Derived from the modelled global annual incidence of 1 837 272 chronic
    pulmonary aspergillosis cases, normalised against a world population of
    approximately 8 billion. Case-fatality is far lower than for the invasive
    subtype.
  evidence:
  - reference: PMID:38224705
    reference_title: Global incidence and mortality of severe fungal disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The annual incidence of chronic pulmonary aspergillosis is 1 837 272, with
      340 000 (18·5%) deaths.
    explanation: >-
      Source of the chronic pulmonary aspergillosis incidence and mortality
      figures. Evidence source is OTHER because this is a modelling study.
- subtype: ABPA
  population: Adults with active asthma
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2500.0
  rate_low: 720.0
  rate_high: 3500.0
  notes: >-
    2.5% of adults with active asthma (range 0.72-3.5%), from a scoping review of
    five referral cohorts. The denominator is asthmatic adults, not the general
    population, and referral-cohort estimates are likely to overstate the rate in
    unselected asthma.
  evidence:
  - reference: PMID:23210682
    reference_title: Global burden of allergic bronchopulmonary aspergillosis with asthma and its complication chronic pulmonary aspergillosis in adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      From five referral cohorts (China, Ireland, New Zealand, Saudi Arabia and
      South Africa), we estimated the prevalence of ABPA in adults with asthma at
      2.5% (range 0.72-3.5%) (scoping review).
    explanation: >-
      Source of the ABPA-in-asthma prevalence and of its stated range. Evidence
      source is OTHER because this is a burden-modelling study.
progression:
- phase: Acute angioinvasive infection
  subtype: Invasive
  duration: Days to weeks
  notes: >-
    In the profoundly immunocompromised host the interval from conidial
    germination to established angioinvasive disease is short. In the ICU
    influenza cohort, invasive pulmonary aspergillosis was diagnosed a median of
    three days after ICU admission.
  evidence:
  - reference: PMID:30076119
    reference_title: "Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Invasive pulmonary aspergillosis was diagnosed in 83 (19%) of 432 patients
      admitted with influenza (influenza cohort), a median of 3 days after
      admission to the ICU.
    explanation: >-
      Quantifies how rapidly invasive disease becomes clinically apparent in a
      susceptible ICU population.
- phase: Chronic cavitary and fibrosing progression
  subtype: Chronic Pulmonary
  duration: Months to years
  notes: >-
    Chronic pulmonary aspergillosis is defined in part by persistence: the
    diagnostic criteria require the radiological, microbiological and
    immunological features to have been present for at least three months.
    Untreated chronic cavitary disease may progress over years to chronic
    fibrosing pulmonary aspergillosis.
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      exclusion of alternative diagnoses, all present for at least 3 months
    explanation: >-
      The three-month persistence requirement in the diagnostic criteria is what
      makes this a chronic rather than a subacute phase. Evidence source is OTHER
      because this is a guideline review.
pathophysiology:
- name: Inhalation and Alveolar Deposition of Airborne Aspergillus Conidia
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Aspergillus conidia are small enough to bypass mucociliary clearance and
    reach the distal airway and alveolus. Everybody inhales them daily; this node
    is therefore the shared entry point of every clinical form and is by itself
    insufficient for disease. What happens next is decided by the host.
  locations:
  - preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus species are ubiquitous in the environment. Aspergillosis is
      acquired by inhalation of Aspergillus spores. In normal hosts, spore
      inhalation rarely causes lung disease.
    explanation: >-
      Establishes inhalation as the initiating step and that it is not sufficient
      for disease in an immunocompetent host, which is what makes this node a
      trigger rather than a cause. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Alveolar Macrophage Dectin-1 Recognition of Aspergillus
    causal_link_type: DIRECT
    description: >-
      Deposited conidia are met by resident alveolar macrophages, whose
      beta-glucan recognition starts the response.
  - target: Oxidase-Independent Neutrophil Killing of Conidia
    causal_link_type: DIRECT
    description: >-
      Recruited neutrophils engage ungerminated conidia by an intracellular,
      oxidase-independent route.
  - target: NADPH Oxidase-Dependent Neutrophil Killing of Hyphae
    causal_link_type: DIRECT
    description: >-
      Conidia that escape early killing and germinate are attacked
      extracellularly by a separate, oxidase-dependent route.
  - target: Th2 Sensitisation and IgE-Mediated Hypersensitivity to Aspergillus Antigens
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In an atopic or cystic-fibrosis airway, the same inhaled conidia germinate
      and release antigen that drives an allergic rather than an invasive
      response.
  - target: Saprophytic Cavity Colonisation and Fungal Ball Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Where a pre-existing pulmonary cavity is present, inhaled conidia may
      colonise it saprophytically without ever invading tissue.
- name: Alveolar Macrophage Dectin-1 Recognition of Aspergillus
  biological_scale: CELLULAR
  role: effector
  description: >-
    Resident alveolar macrophages recognise beta-1,3-glucan exposed on the
    surface of swollen conidia and early germlings through dectin-1. Recognition
    tracks the fungal morphotype rather than the organism as such, and it drives
    the proinflammatory cytokine and chemokine output that recruits neutrophils.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:16344862
    reference_title: The beta-glucan receptor dectin-1 recognizes specific morphologies of Aspergillus fumigatus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The inflammatory response was triggered at the highest level by A.
      fumigatus swollen conidia and early germlings and correlated to the levels
      of surface-exposed beta glucans, indicating that dectin-1 preferentially
      recognizes specific morphological forms of A. fumigatus.
    explanation: >-
      Establishes dectin-1 recognition of surface beta-glucan as the trigger for
      the alveolar macrophage inflammatory response, and that recognition tracks
      the fungal morphotype.
  - reference: PMID:16344862
    reference_title: The beta-glucan receptor dectin-1 recognizes specific morphologies of Aspergillus fumigatus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intratracheal administration of A. fumigatus conidia to mice in the
      presence of a soluble dectin-Fc fusion protein reduced both lung
      proinflammatory cytokine/chemokine levels and cellular recruitment while
      modestly increasing the A. fumigatus fungal burden
    explanation: >-
      In vivo blockade of dectin-1 reduces recruitment and increases fungal
      burden, showing the recognition step is load-bearing and not merely
      correlative. Graded separately from the in vitro item because this
      sentence reports the murine arm of the same paper.
- name: Oxidase-Independent Neutrophil Killing of Conidia
  biological_scale: CELLULAR
  role: effector
  description: >-
    Neutrophils recognise ungerminated conidia through integrin CD11b/CD18 —
    not dectin-1 — and kill them intracellularly by a PI3K-dependent route that
    does not require the oxidative burst. This is the arm that survives in
    chronic granulomatous disease and is lost in neutropenia, which is why the
    two defects behave differently.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil-mediated killing of Aspergillus conidia
    term:
      id: GO:0070947
      label: neutrophil-mediated killing of fungus
  evidence:
  - reference: PMID:26718340
    reference_title: "Human Neutrophils Use Different Mechanisms To Kill Aspergillus fumigatus Conidia and Hyphae: Evidence from Phagocyte Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recognition of conidia involves integrin CD11b/CD18 (and not dectin-1),
      which triggers a PI3K-dependent nonoxidative intracellular mechanism of
      killing.
    explanation: >-
      Establishes the receptor, the signalling route, and the oxidase
      independence of the anti-conidial mechanism this node models.
- name: NADPH Oxidase-Dependent Neutrophil Killing of Hyphae
  biological_scale: CELLULAR
  role: effector
  description: >-
    Hyphae are too large to phagocytose, so neutrophils kill them
    extracellularly: antibody opsonisation, Fc-gamma receptor recognition, and
    Syk/PI3K/PKC signalling to the NADPH oxidase and myeloperoxidase. This is
    the arm lost in chronic granulomatous disease, and it is why CGD patients
    control conidia but not established hyphal growth. NET formation is induced
    by A. fumigatus but did not contribute to killing in this work.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil-mediated killing of Aspergillus hyphae
    term:
      id: GO:0070947
      label: neutrophil-mediated killing of fungus
  - preferred_term: respiratory burst
    term:
      id: GO:0045730
      label: respiratory burst
  evidence:
  - reference: PMID:26718340
    reference_title: "Human Neutrophils Use Different Mechanisms To Kill Aspergillus fumigatus Conidia and Hyphae: Evidence from Phagocyte Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the extracellular destruction of the Aspergillus hyphae needs opsonization
      by Abs and involves predominantly recognition via Fcγ receptors, signaling
      via Syk, PI3K, and protein kinase C to trigger the production of toxic
      reactive oxygen metabolites by the NADPH oxidase and myeloperoxidase
    explanation: >-
      Establishes the opsonisation requirement, the signalling route, and the
      NADPH oxidase/myeloperoxidase dependence of the anti-hyphal mechanism.
  - reference: PMID:26718340
    reference_title: "Human Neutrophils Use Different Mechanisms To Kill Aspergillus fumigatus Conidia and Hyphae: Evidence from Phagocyte Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A. fumigatus induces NET formation; however, NETs did not contribute to A.
      fumigatus killing.
    explanation: >-
      A negative result, recorded because it excludes NETs from the anti-hyphal
      mechanism this node describes.
- name: Failure of Phagocyte Clearance of Aspergillus
  biological_scale: CELLULAR
  role: consequence
  description: >-
    The branch point of the whole entry. Prolonged chemotherapy-induced
    neutropenia removes the effector cell; corticosteroids and calcineurin
    inhibitors impair macrophage and neutrophil function while the cells are
    still present; chronic granulomatous disease removes the NADPH
    oxidase-dependent anti-hyphal mechanism specifically; and severe influenza or
    COVID-19 produces a comparable functional defect in hosts with no classical
    EORTC/MSG host factor at all. Whatever the cause, ungated conidia germinate.
  biological_processes:
  - preferred_term: defense response to fungus
    modifier: DECREASED
    term:
      id: GO:0050832
      label: defense response to fungus
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:26718340
    reference_title: "Human Neutrophils Use Different Mechanisms To Kill Aspergillus fumigatus Conidia and Hyphae: Evidence from Phagocyte Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This is illustrated by the prevalence of Aspergillus infections in patients
      with neutropenia or phagocyte functional defects, such as chronic
      granulomatous disease.
    explanation: >-
      States the clinical corollary the paper's mechanism explains: both the
      number defect and the function defect produce Aspergillus disease.
  - reference: PMID:10844935
    reference_title: Chronic granulomatous disease. Report on a national registry of 368 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pneumonia was the most prevalent infection (79% of patients; Aspergillus
      most prevalent cause)
    explanation: >-
      In a 368-patient CGD registry, Aspergillus is the leading cause of the
      commonest infection, which is the human evidence that losing the NADPH
      oxidase route specifically permits Aspergillus disease.
  downstream:
  - target: Conidial Germination and Hyphal Tissue Invasion
    causal_link_type: DIRECT
    description: >-
      Unkilled conidia swell, germinate and extend hyphae into lung tissue.
- name: Gliotoxin-Mediated Suppression of Host Phagocyte Function
  biological_scale: MOLECULAR
  role: virulence_factor
  description: >-
    A. fumigatus secretes gliotoxin, an epipolythiodioxopiperazine mycotoxin with
    immunosuppressive activity that has long been implicated in assisting tissue
    penetration. This node is deliberately modelled as a contributory
    fungal-side input to phagocyte failure rather than as a sufficient cause: the
    direct virulence evidence is from an invertebrate infection model, and human
    disease is dominated by the host-side defects modelled upstream.
  chemical_entities:
  - preferred_term: gliotoxin
    term:
      id: CHEBI:5385
      label: gliotoxin
  evidence:
  - reference: PMID:15487324
    reference_title: Correlation between gliotoxin production and virulence of Aspergillus fumigatus in Galleria mellonella.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gliotoxin is an immunosuppressive agent previously implicated in assisting
      tissue penetration.
    explanation: >-
      States the proposed immunosuppressive and tissue-penetration role. Graded
      PARTIAL because the claim is background in this paper rather than its own
      result.
  - reference: PMID:15487324
    reference_title: Correlation between gliotoxin production and virulence of Aspergillus fumigatus in Galleria mellonella.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM

  phenotype_term:
    preferred_term: Cough
    term:
      id: HP:0012735
      label: Cough
    temporality: CHRONIC
  evidence:
  - reference: PMID:23496375
    reference_title: "Itraconazole in chronic cavitary pulmonary aspergillosis: a randomised controlled trial and systematic review of literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consecutive patients of CCPA with presence of chronic pulmonary/systemic

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The dominant resistance mechanism appears to be of environmental origin
      and involves the TR(34)/L98H mutations in cyp51A. This resistance
      mechanism is now also increasingly being found in other countries.
    explanation: >-
      Establishes the environmental rather than patient origin of the dominant
      resistance mechanism and its international spread. Evidence source is
      OTHER because this is a molecular-epidemiology study of fungal isolates
      rather than of human, animal, or cell-culture subjects.
  - reference: PMID:31236587
    reference_title: Prevalence of voriconazole-resistant invasive aspergillosis and its impact on mortality in haematology patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All but one resistant case harboured environment-associated resistance

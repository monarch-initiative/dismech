    reference_title: "Antifungal Drug Repurposing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Such long-term application of azole fungicides to crop fields provides
      environmental selection pressure for the emergence of pan-azole-resistant
      fungal strains such as Aspergillus fumigatus having TR34/L98H mutations,
      specifically, a 34 bp insertion into the cytochrome P450 51A (CYP51A) gene
      promoter region and a leucine-to-histidine substitution at codon 98 of
      CYP51A.
    explanation: >-
      Gives both the agricultural selection mechanism and the exact molecular
      composition of the TR34/L98H allele this node names. Evidence source is
      OTHER because this is a review.

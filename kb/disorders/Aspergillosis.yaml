name: Aspergillosis
creation_date: "2026-08-28T00:00:00Z"
category: Infectious Disease
description: >-
  Disease caused by inhaled Aspergillus species, predominantly Aspergillus
  fumigatus. Conidia are ubiquitous in air and are inhaled continuously by
  everyone, so the organism is not by itself the determinant of disease: the
  clinical form is set far more by the host than by the fungus. Where phagocyte
  number or function is lost — chemotherapy-induced neutropenia, corticosteroid
  therapy, transplantation, chronic granulomatous disease, severe influenza or
  COVID-19 — conidia germinate, hyphae invade tissue and blood vessels, and the
  disease is acute, angioinvasive and frequently fatal. Where innate immunity is
  intact but the lung is structurally damaged, the same organism produces
  indolent cavitary and fibrosing disease over months to years. Where immunity is
  intact but dysregulated toward a Th2/IgE response, it produces allergic disease
  in asthma and cystic fibrosis without tissue invasion at all. This entry curates
  the shared root mechanism — inhalation, phagocyte gating, and the branch point
  set by host status — and carries the clinical forms as subtypes.
parents:
- Fungal infection
synonyms:
- Aspergillus infection
- Pulmonary aspergillosis
disease_term:
  preferred_term: aspergillosis
  term:
    id: MONDO:0005657
    label: aspergillosis
infectious_agent:
- name: Aspergillus species
  infectious_agent_term:
    preferred_term: Aspergillus
    term:
      id: NCBITaxon:5052
      label: Aspergillus
  description: >-
    Aspergillus fumigatus causes the large majority of human aspergillosis;
    A. flavus, A. terreus, A. niger and A. nidulans account for most of the
    remainder and matter clinically because susceptibility differs by species
    (A. terreus is characteristically amphotericin B resistant). A. fumigatus is
    a soil saprotroph whose small hydrophobic conidia are dispersed in air and
    reach the alveolus on inhalation; its capacity to grow at 37 C and to
    tolerate host oxidative and nutritional stress is an adaptation to that
    saprotrophic niche rather than to parasitism, which is why disease is
    opportunistic.
  evidence:
  - reference: PMID:31722890
    reference_title: Aspergillus fumigatus and Aspergillosis in 2019.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus fumigatus is a saprotrophic fungus; its primary habitat is the
      soil. In its ecological niche, the fungus has learned how to adapt and
      proliferate in hostile environments. This capacity has helped the fungus to
      resist and survive against human host defenses
    explanation: >-
      Establishes A. fumigatus as an environmental saprotroph whose host-defence
      resistance derives from its environmental niche, which is the basis for
      treating aspergillosis as an opportunistic rather than an obligate
      infection. Evidence source is OTHER because this is a review.
transmission:
- name: Inhalation of airborne conidia
  description: >-
    Acquired by inhaling airborne Aspergillus conidia from the ambient
    environment. There is no established person-to-person transmission; the
    reservoir is soil, decaying vegetation and construction or ventilation dust.
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus species are ubiquitous in the environment. Aspergillosis is
      acquired by inhalation of Aspergillus spores. In normal hosts, spore
      inhalation rarely causes lung disease.
    explanation: >-
      States the route of acquisition and that inhalation alone is not
      sufficient for disease in a normal host. Evidence source is OTHER because
      this is a review.
has_subtypes:
- name: Invasive
  display_name: Invasive aspergillosis (including invasive pulmonary aspergillosis)
  subtype_term:
    preferred_term: invasive aspergillosis
    term:
      id: MONDO:0000240
      label: invasive aspergillosis
  description: >-
    Acute, tissue-invasive infection of the severely immunocompromised host —
    prolonged neutropenia after chemotherapy or allogeneic transplantation,
    high-dose corticosteroids, chronic granulomatous disease — and, increasingly,
    of the non-classically-immunocompromised ICU patient with severe influenza or
    COVID-19. Hyphae invade lung parenchyma and blood vessels, producing
    thrombosis, infarction and haematogenous spread. Mortality is high.
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Invasive Aspergillosis usually occurs in severely immunocompromised
      patients, typically in neutropenic but also in non-neutropenic patients.
    explanation: >-
      Defines the host context of the invasive subtype and notes that it is not
      restricted to neutropenic hosts. Evidence source is OTHER because this is
      a review.
- name: Chronic Pulmonary
  display_name: Chronic pulmonary aspergillosis (CCPA and chronic fibrosing forms)
  description: >-
    Slowly progressive cavitary and fibrosing lung infection in a patient with
    prior or current structural lung disease (treated tuberculosis, COPD,
    sarcoidosis, prior thoracic surgery) but without significant systemic
    immunocompromise. Chronic cavitary pulmonary aspergillosis is the commonest
    form and may progress to chronic fibrosing pulmonary aspergillosis. No
    subtype_term is bound: MONDO carries a term for pulmonary aspergilloma
    (bound on the Aspergilloma subtype) and for invasive aspergillosis, but none
    for chronic cavitary or chronic fibrosing pulmonary aspergillosis, which are
    covered only by the parent term MONDO:0005657 already on this entry.
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common form of CPA is chronic cavitary pulmonary aspergillosis
      (CCPA), which untreated may progress to chronic fibrosing pulmonary
      aspergillosis.
    explanation: >-
      The ESCMID/ERS guideline names CCPA as the commonest chronic form and its
      fibrosing endpoint, which is what this subtype covers. Evidence source is
      OTHER because this is a guideline review.
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic pulmonary Aspergillosis affects patients with chronic structural
      lung disease such as COPD or previous mycobacterial lung disease, but
      without other significant immunocompromise.
    explanation: >-
      States the defining host context that separates this subtype from the
      invasive one — structural lung disease without systemic immunocompromise.
      Evidence source is OTHER because this is a review.
- name: Aspergilloma
  display_name: Aspergilloma (pulmonary fungal ball)
  subtype_term:
    preferred_term: pulmonary aspergilloma
    term:
      id: MONDO:0000266
      label: pulmonary aspergilloma
  description: >-
    Saprophytic colonisation of a pre-existing pulmonary cavity by a conglomerate
    of hyphae, mucus and cellular debris, without tissue invasion. Usually
    minimally symptomatic, but haemoptysis from the bronchial circulation
    surrounding the cavity can be life-threatening. Formally a subset of chronic
    pulmonary aspergillosis; kept as its own subtype because it has its own MONDO
    identity, its own natural history and a distinct management pathway
    (surgical excision rather than long-term azole therapy).
  evidence:
  - reference: PMID:31536274
    reference_title: Aspergilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergilloma and chronic cavitary pulmonary aspergillosis (CCPA) refer to
      the inert saprophytic colonization of preexisting cavitary spaces in the
      pulmonary parenchyma
    explanation: >-
      Establishes the aspergilloma as saprophytic colonisation of a pre-existing
      cavity, the feature that distinguishes it from invasive disease. Evidence
      source is OTHER because this is a review.
- name: ABPA
  display_name: Allergic bronchopulmonary aspergillosis
  subtype_term:
    preferred_term: allergic bronchopulmonary aspergillosis
    term:
      id: MONDO:0015243
      label: allergic bronchopulmonary aspergillosis
  description: >-
    Th2-driven hypersensitivity to Aspergillus antigens in a host with asthma or
    cystic fibrosis, with no tissue invasion. Presents as poorly controlled
    asthma with recurrent pulmonary infiltrates, mucus plugging, marked total and
    Aspergillus-specific IgE elevation, eosinophilia and, over time, central
    bronchiectasis. The dismech entries for Cystic_Fibrosis and
    Hypersensitivity_Pneumonitis are the adjacent host-context and
    allergic-lung-disease entries.
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Allergic bronchopulmonary aspergillosis (ABPA) is an immunological
      pulmonary disorder caused by hypersensitivity to Aspergillus fumigatus,
      manifesting with poorly controlled asthma, recurrent pulmonary infiltrates
      and bronchiectasis.
    explanation: >-
      The ISHAM working-group review defines ABPA as a hypersensitivity disorder
      with this manifestation triad. Evidence source is OTHER because this is a
      review.
- name: Aspergillus Bronchitis
  display_name: Aspergillus bronchitis
  description: >-
    Aspergillus infection confined to the bronchial tree in a patient with
    pre-existing bronchial disease, typically bronchiectasis, without parenchymal
    invasion and without the IgE-mediated hypersensitivity that defines ABPA.
    No subtype_term is bound: MONDO carries no term for Aspergillus bronchitis
    and it is covered only by the parent term MONDO:0005657 already on this
    entry.
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus bronchitis affects patients with bronchial disease such as
      bronchiectasis.
    explanation: >-
      Names Aspergillus bronchitis as a distinct member of the pulmonary
      aspergillosis spectrum and gives its host context. Evidence source is
      OTHER because this is a review.
- name: Disseminated
  display_name: Disseminated and extrapulmonary aspergillosis
  description: >-
    Haematogenous spread from an angioinvasive pulmonary focus to brain, skin,
    eye, heart, bone or viscera, or primary cutaneous inoculation at a catheter
    or burn site. CNS involvement (neuroaspergillosis, MONDO:0005873) is the
    commonest and most lethal extrapulmonary site. No subtype_term is bound at
    this level: MONDO codes individual organ forms such as neuroaspergillosis but
    has no general disseminated-aspergillosis term, and binding the CNS term here
    would misdescribe the non-CNS forms this subtype also covers.
  evidence:
  - reference: PMID:17050430
    reference_title: Interactions of Aspergillus fumigatus with vascular endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Some of these hyphal fragments can break off and circulate in the
      bloodstream. In severely immunocompromised hosts, these blood-borne hyphal
      fragments adhere to the luminal surface of the endothelial cells and they
      penetrate the endothelial cell lining of the vasculature by passing from
      the luminal to the abluminal surface.
    explanation: >-
      Describes the vascular mechanism by which an invasive pulmonary focus
      seeds distant organs, which is what defines this subtype.
prevalence:
- subtype: Invasive
  population: >-
    Worldwide; adults with COPD, critical illness, lung cancer or haematological
    malignancy
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 26.4
  notes: >-
    Derived from the 2024 global fungal-disease burden estimate of over 2 113 000
    incident invasive aspergillosis cases per year, normalised against a world
    population of approximately 8 billion. This is a modelled estimate over
    at-risk denominators, not a measured population rate, and it deliberately
    excludes influenza- and COVID-19-associated outbreaks.
  evidence:
  - reference: PMID:38224705
    reference_title: Global incidence and mortality of severe fungal disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Annually, over 2 113 000 people develop invasive aspergillosis in the
      context of chronic obstructive pulmonary disease, intensive care, lung
      cancer, or haematological malignancy, with a crude annual mortality of
      1 801 000 (85·2%).
    explanation: >-
      Source of the incidence figure and of the accompanying crude mortality.
      Evidence source is OTHER because this is a modelling and literature-synthesis
      study rather than a primary clinical cohort.
- subtype: Chronic Pulmonary
  population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 23.0
  notes: >-
    Derived from the modelled global annual incidence of 1 837 272 chronic
    pulmonary aspergillosis cases, normalised against a world population of
    approximately 8 billion. Case-fatality is far lower than for the invasive
    subtype.
  evidence:
  - reference: PMID:38224705
    reference_title: Global incidence and mortality of severe fungal disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The annual incidence of chronic pulmonary aspergillosis is 1 837 272, with
      340 000 (18·5%) deaths.
    explanation: >-
      Source of the chronic pulmonary aspergillosis incidence and mortality
      figures. Evidence source is OTHER because this is a modelling study.
- subtype: ABPA
  population: Adults with active asthma
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2500.0
  rate_low: 720.0
  rate_high: 3500.0
  notes: >-
    2.5% of adults with active asthma (range 0.72-3.5%), from a scoping review of
    five referral cohorts. The denominator is asthmatic adults, not the general
    population, and referral-cohort estimates are likely to overstate the rate in
    unselected asthma.
  evidence:
  - reference: PMID:23210682
    reference_title: Global burden of allergic bronchopulmonary aspergillosis with asthma and its complication chronic pulmonary aspergillosis in adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      From five referral cohorts (China, Ireland, New Zealand, Saudi Arabia and
      South Africa), we estimated the prevalence of ABPA in adults with asthma at
      2.5% (range 0.72-3.5%) (scoping review).
    explanation: >-
      Source of the ABPA-in-asthma prevalence and of its stated range. Evidence
      source is OTHER because this is a burden-modelling study.
progression:
- phase: Acute angioinvasive infection
  subtype: Invasive
  duration: Days to weeks
  notes: >-
    In the profoundly immunocompromised host the interval from conidial
    germination to established angioinvasive disease is short. In the ICU
    influenza cohort, invasive pulmonary aspergillosis was diagnosed a median of
    three days after ICU admission.
  evidence:
  - reference: PMID:30076119
    reference_title: Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza; a retrospective cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Invasive pulmonary aspergillosis was diagnosed in 83 (19%) of 432 patients
      admitted with influenza (influenza cohort), a median of 3 days after
      admission to the ICU.
    explanation: >-
      Quantifies how rapidly invasive disease becomes clinically apparent in a
      susceptible ICU population.
- phase: Chronic cavitary and fibrosing progression
  subtype: Chronic Pulmonary
  duration: Months to years
  notes: >-
    Chronic pulmonary aspergillosis is defined in part by persistence: the
    diagnostic criteria require the radiological, microbiological and
    immunological features to have been present for at least three months.
    Untreated chronic cavitary disease may progress over years to chronic
    fibrosing pulmonary aspergillosis.
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      exclusion of alternative diagnoses, all present for at least 3 months
    explanation: >-
      The three-month persistence requirement in the diagnostic criteria is what
      makes this a chronic rather than a subacute phase. Evidence source is OTHER
      because this is a guideline review.
pathophysiology:
- name: Inhalation and Alveolar Deposition of Airborne Aspergillus Conidia
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Aspergillus conidia are small enough to bypass mucociliary clearance and
    reach the distal airway and alveolus. Everybody inhales them daily; this node
    is therefore the shared entry point of every clinical form and is by itself
    insufficient for disease. What happens next is decided by the host.
  locations:
  - preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus species are ubiquitous in the environment. Aspergillosis is
      acquired by inhalation of Aspergillus spores. In normal hosts, spore
      inhalation rarely causes lung disease.
    explanation: >-
      Establishes inhalation as the initiating step and that it is not sufficient
      for disease in an immunocompetent host, which is what makes this node a
      trigger rather than a cause. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Innate Phagocyte Recognition and Killing of Aspergillus
    causal_link_type: DIRECT
    description: >-
      Deposited conidia are met by resident alveolar macrophages and recruited
      neutrophils, the defence that determines whether the encounter ends here.
  - target: Th2 Sensitisation and IgE-Mediated Hypersensitivity to Aspergillus Antigens
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In an atopic or cystic-fibrosis airway, the same inhaled conidia germinate
      and release antigen that drives an allergic rather than an invasive
      response.
  - target: Saprophytic Cavity Colonisation and Fungal Ball Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Where a pre-existing pulmonary cavity is present, inhaled conidia may
      colonise it saprophytically without ever invading tissue.
- name: Innate Phagocyte Recognition and Killing of Aspergillus
  biological_scale: CELLULAR
  role: effector
  description: >-
    Two separable phagocyte functions clear the organism. Alveolar macrophages
    recognise surface-exposed beta-1,3-glucan on swollen conidia and germlings
    through dectin-1, which drives the proinflammatory cytokine and chemokine
    response that recruits neutrophils. Neutrophils then kill by two distinct
    mechanisms: an oxidase-independent, CD11b/CD18- and PI3K-dependent
    intracellular route against conidia, and an antibody-opsonisation- and NADPH
    oxidase/myeloperoxidase-dependent extracellular route against hyphae. The
    two-mechanism structure is why the oxidative-burst defect of chronic
    granulomatous disease and the cell-number defect of chemotherapy-induced
    neutropenia both cause disease, and why they behave differently.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil-mediated killing of Aspergillus hyphae
    term:
      id: GO:0070947
      label: neutrophil-mediated killing of fungus
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
  evidence:
  - reference: PMID:16344862
    reference_title: The beta-glucan receptor dectin-1 recognizes specific morphologies of Aspergillus fumigatus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The inflammatory response was triggered at the highest level by A.
      fumigatus swollen conidia and early germlings and correlated to the levels
      of surface-exposed beta glucans, indicating that dectin-1 preferentially
      recognizes specific morphological forms of A. fumigatus.
    explanation: >-
      Establishes dectin-1 recognition of surface beta-glucan as the trigger for
      the alveolar macrophage inflammatory response, and that recognition tracks
      the fungal morphotype.
  - reference: PMID:16344862
    reference_title: The beta-glucan receptor dectin-1 recognizes specific morphologies of Aspergillus fumigatus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intratracheal administration of A. fumigatus conidia to mice in the
      presence of a soluble dectin-Fc fusion protein reduced both lung
      proinflammatory cytokine/chemokine levels and cellular recruitment while
      modestly increasing the A. fumigatus fungal burden
    explanation: >-
      In vivo blockade of dectin-1 reduces recruitment and increases fungal
      burden, showing the recognition step is load-bearing and not merely
      correlative. Graded separately from the in vitro item because this
      sentence reports the murine arm of the same paper.
  - reference: PMID:26718340
    reference_title: "Human Neutrophils Use Different Mechanisms To Kill Aspergillus fumigatus Conidia and Hyphae: Evidence from Phagocyte Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recognition of conidia involves integrin CD11b/CD18 (and not dectin-1),
      which triggers a PI3K-dependent nonoxidative intracellular mechanism of
      killing.
    explanation: >-
      Establishes the oxidase-independent neutrophil route against conidia,
      one of the two killing mechanisms this node asserts.
  - reference: PMID:26718340
    reference_title: "Human Neutrophils Use Different Mechanisms To Kill Aspergillus fumigatus Conidia and Hyphae: Evidence from Phagocyte Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the extracellular destruction of the Aspergillus hyphae needs opsonization
      by Abs and involves predominantly recognition via Fcγ receptors, signaling
      via Syk, PI3K, and protein kinase C to trigger the production of toxic
      reactive oxygen metabolites by the NADPH oxidase and myeloperoxidase
    explanation: >-
      Establishes the NADPH oxidase-dependent extracellular route against
      hyphae, the mechanism lost in chronic granulomatous disease.
  downstream:
  - target: Failure of Phagocyte Clearance of Aspergillus
    causal_link_type: DIRECT
    description: >-
      Loss of either phagocyte number or either killing mechanism converts this
      protective node into the permissive state modelled downstream. The edge
      records the gating relationship, not a claim that intact killing causes
      failure.
- name: Failure of Phagocyte Clearance of Aspergillus
  biological_scale: CELLULAR
  role: consequence
  description: >-
    The branch point of the whole entry. Prolonged chemotherapy-induced
    neutropenia removes the effector cell; corticosteroids and calcineurin
    inhibitors impair macrophage and neutrophil function while the cells are
    still present; chronic granulomatous disease removes the NADPH
    oxidase-dependent anti-hyphal mechanism specifically; and severe influenza or
    COVID-19 produces a comparable functional defect in hosts with no classical
    EORTC/MSG host factor at all. Whatever the cause, ungated conidia germinate.
  biological_processes:
  - preferred_term: defense response to fungus
    modifier: DECREASED
    term:
      id: GO:0050832
      label: defense response to fungus
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:26718340
    reference_title: "Human Neutrophils Use Different Mechanisms To Kill Aspergillus fumigatus Conidia and Hyphae: Evidence from Phagocyte Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This is illustrated by the prevalence of Aspergillus infections in patients
      with neutropenia or phagocyte functional defects, such as chronic
      granulomatous disease.
    explanation: >-
      States the clinical corollary the paper's mechanism explains: both the
      number defect and the function defect produce Aspergillus disease.
  - reference: PMID:10844935
    reference_title: Chronic granulomatous disease. Report on a national registry of 368 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pneumonia was the most prevalent infection (79% of patients; Aspergillus
      most prevalent cause)
    explanation: >-
      In a 368-patient CGD registry, Aspergillus is the leading cause of the
      commonest infection, which is the human evidence that losing the NADPH
      oxidase route specifically permits Aspergillus disease.
  downstream:
  - target: Conidial Germination and Hyphal Tissue Invasion
    causal_link_type: DIRECT
    description: >-
      Unkilled conidia swell, germinate and extend hyphae into lung tissue.
- name: Gliotoxin-Mediated Suppression of Host Phagocyte Function
  biological_scale: MOLECULAR
  role: virulence_factor
  description: >-
    A. fumigatus secretes gliotoxin, an epipolythiodioxopiperazine mycotoxin with
    immunosuppressive activity that has long been implicated in assisting tissue
    penetration. This node is deliberately modelled as a contributory
    fungal-side input to phagocyte failure rather than as a sufficient cause: the
    direct virulence evidence is from an invertebrate infection model, and human
    disease is dominated by the host-side defects modelled upstream.
  chemical_entities:
  - preferred_term: gliotoxin
    term:
      id: CHEBI:5385
      label: gliotoxin
  evidence:
  - reference: PMID:15487324
    reference_title: Correlation between gliotoxin production and virulence of Aspergillus fumigatus in Galleria mellonella.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gliotoxin is an immunosuppressive agent previously implicated in assisting
      tissue penetration.
    explanation: >-
      States the proposed immunosuppressive and tissue-penetration role. Graded
      PARTIAL because the claim is background in this paper rather than its own
      result.
  - reference: PMID:15487324
    reference_title: Correlation between gliotoxin production and virulence of Aspergillus fumigatus in Galleria mellonella.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      implicating a critical role for gliotoxin production rather than growth
      rate or enzymatic activity in the virulence of A. fumigatus in this model
    explanation: >-
      Ties virulence to gliotoxin production rather than growth rate. Graded
      PARTIAL and MODEL_ORGANISM because the finding is from Galleria mellonella
      and the authors themselves qualify it to that model.
  downstream:
  - target: Failure of Phagocyte Clearance of Aspergillus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Secreted gliotoxin is proposed to add a fungal-side contribution to the
      phagocyte defect, on top of the host-side causes.
- name: Conidial Germination and Hyphal Tissue Invasion
  biological_scale: CELLULAR
  description: >-
    Surviving conidia swell, germinate and extend filamentous hyphae that
    penetrate alveolar epithelium and lung parenchyma. This is the step that
    separates the tissue-invasive forms from the allergic and saprophytic ones,
    which never reach it.
  biological_processes:
  - preferred_term: spore germination
    term:
      id: GO:0009847
      label: spore germination
  - preferred_term: filamentous hyphal growth
    term:
      id: GO:0030447
      label: filamentous growth
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:17050430
    reference_title: Interactions of Aspergillus fumigatus with vascular endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      During pulmonary aspergillosis, hyphae are initially outside of the
      pulmonary vasculature and they invade the endothelial cell lining of the
      blood vessels by passing from the abluminal to the luminal surface.
    explanation: >-
      Establishes that hyphae grow through lung tissue from outside the
      vasculature inwards, which is the tissue-invasive step this node models.
  downstream:
  - target: Angioinvasion and Thrombotic Tissue Infarction
    causal_link_type: DIRECT
    description: >-
      Hyphae reach and cross the vessel wall from the abluminal side.
  - target: Chronic Cavitary Lung Destruction and Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Where the host retains innate immunity but the lung is structurally
      abnormal, the same hyphal growth produces slow cavitary destruction rather
      than acute angioinvasion.
- name: Angioinvasion and Thrombotic Tissue Infarction
  biological_scale: TISSUE
  description: >-
    Hyphae penetrate the endothelial lining, damage endothelial cells and induce
    tissue factor expression, producing local thrombosis and the ischaemic
    infarction that gives invasive pulmonary aspergillosis its characteristic
    nodular and cavitary radiology and its haemoptysis.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:17050430
    reference_title: Interactions of Aspergillus fumigatus with vascular endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Luminal invasion by hyphae results in both endothelial cell damage and
      stimulation of tissue factor expression.
    explanation: >-
      Links hyphal contact with endothelium directly to endothelial damage and
      to tissue factor induction, the procoagulant step behind thrombotic
      infarction.
  downstream:
  - target: Haematogenous Dissemination to Extrapulmonary Sites
    causal_link_type: DIRECT
    description: >-
      Hyphal fragments shed into the bloodstream from an invaded vessel seed
      distant organs.
- name: Haematogenous Dissemination to Extrapulmonary Sites
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Blood-borne hyphal fragments adhere to and cross the luminal endothelial
    surface at distant sites, establishing cerebral, cutaneous, ocular, cardiac
    and visceral foci. This route is specific to the severely immunocompromised
    host.
  evidence:
  - reference: PMID:17050430
    reference_title: Interactions of Aspergillus fumigatus with vascular endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In severely immunocompromised hosts, these blood-borne hyphal fragments
      adhere to the luminal surface of the endothelial cells and they penetrate
      the endothelial cell lining of the vasculature by passing from the luminal
      to the abluminal surface.
    explanation: >-
      Describes the luminal-to-abluminal re-invasion step by which circulating
      fragments establish metastatic foci, and ties it to host immune status.
- name: Saprophytic Cavity Colonisation and Fungal Ball Formation
  biological_scale: TISSUE
  description: >-
    In a pre-existing pulmonary cavity — most often post-tuberculous — hyphae,
    mucus and cellular debris accumulate into a mobile fungal ball without
    invading the cavity wall. Symptoms are minor or absent until bleeding from
    the hypertrophied bronchial vessels around the cavity produces haemoptysis.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:31536274
    reference_title: Aspergilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Simple Aspergilloma A single pulmonary cavity containing a fungal ball,
      with serological or microbiological evidence of Aspergillus spp. in a
      non-immunocompromised patient.
    explanation: >-
      Gives the consensus definition of the fungal ball in a pre-existing cavity
      in a non-immunocompromised host, which is what this node models. Evidence
      source is OTHER because this is a review of consensus definitions.
  downstream:
  - target: Chronic Cavitary Lung Destruction and Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Saprophytic colonisation and chronic cavitary disease overlap clinically
      and a simple aspergilloma may be found within, or progress to, the broader
      chronic cavitary form.
- name: Chronic Cavitary Lung Destruction and Fibrosis
  biological_scale: TISSUE
  role: consequence
  description: >-
    Over months to years, one or more pulmonary cavities expand and coalesce with
    surrounding pleural thickening and a vigorous Aspergillus antibody response;
    untreated, this progresses to the fibrosing form with irreversible loss of
    lung volume. The host here is immunocompetent enough to contain the organism
    but not to clear it.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common form of CPA is chronic cavitary pulmonary aspergillosis
      (CCPA), which untreated may progress to chronic fibrosing pulmonary
      aspergillosis. Less common manifestations include: Aspergillus nodule and
      single aspergilloma. All these entities are found in non-immunocompromised
      patients with prior or current lung disease.
    explanation: >-
      Establishes both the cavitary-to-fibrosing trajectory and the
      non-immunocompromised, structurally-abnormal-lung host context that
      distinguishes this branch. Evidence source is OTHER because this is a
      guideline review.
- name: Th2 Sensitisation and IgE-Mediated Hypersensitivity to Aspergillus Antigens
  biological_scale: ORGANISM
  description: >-
    In a genetically predisposed atopic or cystic-fibrosis airway, germinating
    conidia release antigen that drives a Th2 CD4-positive T-cell response, IgE
    class switching and a large rise in total and Aspergillus-specific IgE. The
    organism is never cleared and never invades; the disease is the response to
    it. This is the mechanism that makes ABPA a member of the aspergillosis
    spectrum despite sharing none of the invasive branch's tissue pathology.
  cell_types:
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  biological_processes:
  - preferred_term: T-helper 2 cell differentiation
    modifier: INCREASED
    term:
      id: GO:0045064
      label: T-helper 2 cell differentiation
  - preferred_term: isotype switching to IgE isotypes
    modifier: INCREASED
    term:
      id: GO:0048289
      label: isotype switching to IgE isotypes
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a genetically predisposed individual, inhaled conidia of A. fumigatus
      germinate into hyphae with release of antigens that activate the innate and
      adaptive immune responses (Th2 CD4(+) T cell responses) of the lung.
    explanation: >-
      States the germination-antigen-Th2 sequence and the requirement for host
      genetic predisposition, which is exactly what this node asserts. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Eosinophilic Airway Inflammation and Mucus Plugging
    causal_link_type: DIRECT
    description: >-
      The Th2/IgE response recruits eosinophils and drives the mucus
      hypersecretion that produces the recurrent infiltrates of ABPA.
- name: Eosinophilic Airway Inflammation and Mucus Plugging
  biological_scale: TISSUE
  description: >-
    Eosinophil-rich inflammation with tenacious, hyphae-containing mucus plugs
    that occlude segmental bronchi, giving the fleeting pulmonary infiltrates and
    poorly controlled asthma of ABPA.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      manifesting with poorly controlled asthma, recurrent pulmonary infiltrates
      and bronchiectasis
    explanation: >-
      Names the recurrent infiltrates and poorly controlled asthma that this
      inflammatory node produces, and the bronchiectasis modelled downstream.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Bronchiectasis and Fixed Airway Damage
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Repeated plugging and inflammation destroy the bronchial wall, producing
      the central bronchiectasis that is the permanent structural sequela of
      ABPA.
- name: Bronchiectasis and Fixed Airway Damage
  biological_scale: TISSUE
  role: consequence
  description: >-
    Irreversible central bronchial dilatation, the endpoint that makes early
    recognition of ABPA worthwhile: it is the manifestation that antifungal and
    corticosteroid therapy aim to prevent rather than to reverse.
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The importance of recognizing ABPA relates to the improvement of patient
      symptoms, and delay in development or prevention of bronchiectasis, one
      manifestation of permanent lung damage in ABPA.
    explanation: >-
      Identifies bronchiectasis as permanent lung damage and the target of early
      recognition, which is the claim this consequence node makes. Evidence
      source is OTHER because this is a review.
- name: Fungal Ergosterol Biosynthesis via Cyp51 Sterol 14-alpha-Demethylase
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  description: >-
    Aspergillus membrane ergosterol is made by a pathway whose rate-limiting
    demethylation step is catalysed by the cytochrome P450 lanosterol
    14-alpha-demethylase encoded by cyp51A and cyp51B. Triazoles bind heme iron
    at this enzyme, so ergosterol is depleted and toxic 14-alpha-methylsterols
    accumulate. This node is intentionally target-only: it describes the normal
    fungal biosynthetic activity that azole therapy inhibits, not a step that
    causes disease.
  biological_processes:
  - preferred_term: ergosterol biosynthetic process
    term:
      id: GO:0006696
      label: ergosterol biosynthetic process
  molecular_functions:
  - preferred_term: sterol 14-alpha-demethylase activity
    term:
      id: GO:0008398
      label: sterol 14-demethylase activity
  evidence:
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism of action of triazoles (Figure 2D-H) is based on the
      inhibition of the microsomal cytochrome P450 (CYP450) monooxygenase
      dependent 14-α-demethylase (Figure 3).
    explanation: >-
      Identifies the enzyme this node models as the triazole target. Evidence
      source is OTHER because this is a review.
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The combination of the accumulation of toxic 14-α-methylsterols and
      depletion of ergosterol results in the fungistatic effect
    explanation: >-
      States the consequence of inhibiting this step, which is why the node is
      a therapeutic vulnerability. Evidence source is OTHER because this is a
      review.
- name: Environmental cyp51A-Mediated Azole Resistance
  biological_scale: MOLECULAR
  role: adaptive_escape
  description: >-
    Agricultural azole fungicides share the Cyp51 target with clinical
    triazoles, so field application selects pan-azole-resistant A. fumigatus in
    the environment rather than in the treated patient. The dominant genotype is
    TR34/L98H — a 34-bp tandem repeat in the cyp51A promoter driving
    overexpression, plus a leucine-to-histidine substitution at codon 98 — with
    TR46/Y121F/T289A the second common allele. Because selection happens outside
    the host, azole-naive patients can present with resistant disease, and the
    resistant genotypes have spread across Europe from a common ancestor.
  molecular_functions:
  - preferred_term: sterol 14-alpha-demethylase activity
    modifier: INCREASED
    term:
      id: GO:0008398
      label: sterol 14-demethylase activity
  evidence:
  - reference: PMID:33203147
    reference_title: "Antifungal Drug Repurposing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Such long-term application of azole fungicides to crop fields provides
      environmental selection pressure for the emergence of pan-azole-resistant
      fungal strains such as Aspergillus fumigatus having TR34/L98H mutations,
      specifically, a 34 bp insertion into the cytochrome P450 51A (CYP51A) gene
      promoter region and a leucine-to-histidine substitution at codon 98 of
      CYP51A.
    explanation: >-
      Gives both the agricultural selection mechanism and the exact molecular
      composition of the TR34/L98H allele this node names. Evidence source is
      OTHER because this is a review.
  - reference: PMID:22675126
    reference_title: Clonal expansion and emergence of environmental multiple-triazole-resistant Aspergillus fumigatus strains carrying the TR(34)/L98H mutations in the cyp51A gene region.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The dominant resistance mechanism appears to be of environmental origin
      and involves the TR(34)/L98H mutations in cyp51A. This resistance
      mechanism is now also increasingly being found in other countries.
    explanation: >-
      Establishes the environmental rather than patient origin of the dominant
      resistance mechanism and its international spread. Evidence source is
      OTHER because this is a molecular-epidemiology study of fungal isolates
      rather than of human, animal, or cell-culture subjects.
  - reference: PMID:31236587
    reference_title: Prevalence of voriconazole-resistant invasive aspergillosis and its impact on mortality in haematology patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All but one resistant case harboured environment-associated resistance
      mutations in the cyp51A gene: TR34/L98H (13 cases) and TR46/Y121F/T289A
      (12 cases).
    explanation: >-
      Confirms in a clinical haematology cohort that essentially all
      voriconazole-resistant invasive aspergillosis carried the
      environment-associated cyp51A alleles this node models.
  downstream:
  - target: Fungal Ergosterol Biosynthesis via Cyp51 Sterol 14-alpha-Demethylase
    causal_link_type: DIRECT
    description: >-
      Promoter-driven overexpression plus an active-site substitution keep
      ergosterol synthesis running at achievable azole concentrations, which is
      what makes triazole therapy fail.
- name: Aspergillus beta-1,3-Glucan Synthesis by Fks Glucan Synthase
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    fungal_cell_wall_glucan_synthesis_inhibition#beta-1,3-Glucan Synthesis at
    the Plasma Membrane by Fks Glucan Synthase
  description: >-
    The Aspergillus plasma-membrane glucan-synthase complex polymerises
    beta-1,3-glucan, an essential structural polymer of the fungal cell wall and
    the target of the echinocandins. In Aspergillus the echinocandins are
    fungistatic rather than fungicidal — they cause hyphal tip lysis but not
    death of the organism — which is why they are a salvage and combination
    option here and a first-line option in candidiasis. As in the module, this
    node is target-only and does not assert that normal wall synthesis causes
    the intervention-conditional wall failure that follows inhibition.
  biological_processes:
  - preferred_term: beta-1,3-Glucan Biosynthesis
    term:
      id: GO:0006075
      label: (1->3)-beta-D-glucan biosynthetic process
  molecular_functions:
  - preferred_term: 1,3-beta-D-Glucan Synthase Activity
    term:
      id: GO:0003843
      label: 1,3-beta-D-glucan synthase activity
  evidence:
  - reference: PMID:31138565
    reference_title: "Echinocandins for the Treatment of Invasive Aspergillosis: from Laboratory to Bedside."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echinocandins (caspofungin, micafungin, anidulafungin), targeting
      β-1,3-glucan synthesis of the cell wall, represent one of the three
      currently available antifungal drug classes for the treatment of invasive
      fungal infections.
    explanation: >-
      Names the echinocandin agents and identifies beta-1,3-glucan synthesis as
      their shared target, which is the activity this node models. Evidence
      source is OTHER because this is a review.
  - reference: PMID:31138565
    reference_title: "Echinocandins for the Treatment of Invasive Aspergillosis: from Laboratory to Bedside."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Despite their limited antifungal activity against Aspergillus spp.,
      echinocandins are considered an alternative option for the treatment of
      invasive aspergillosis (IA).
    explanation: >-
      Qualifies the vulnerability: the target exists in Aspergillus but the
      class is second-line here, which is the caveat this node states. Graded
      PARTIAL because it supports the target's relevance while limiting the
      strength of the therapeutic claim.
  downstream:
  - target: Aspergillus Cell-Wall Integrity and Viability
    causal_link_type: DIRECT
    description: >-
      Beta-1,3-glucan is an essential structural component of the Aspergillus
      cell wall and supports hyphal integrity.
- name: Aspergillus Cell-Wall Integrity and Viability
  biological_scale: CELLULAR
  role: effector
  conforms_to: fungal_cell_wall_glucan_synthesis_inhibition#Cell-Wall Assembly and Integrity
  description: >-
    The beta-1,3-glucan-rich wall cross-links chitin and mannoproteins into the
    load-bearing hyphal wall that lets Aspergillus extend through tissue. It is
    also the surface the host reads: the same beta-glucan is the ligand dectin-1
    recognises on swollen conidia and germlings, so the wall is simultaneously
    the drug target and the immune epitope.
  biological_processes:
  - preferred_term: fungal-type cell wall organization
    term:
      id: GO:0031505
      label: fungal-type cell wall organization
  evidence:
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echinocandins block the synthesis of β-d-glucans located in the fungal
      cell wall. Echinocandins are fungicidal and fungistatic against Candida
      and Aspergillus spp., respectively.
    explanation: >-
      Locates beta-glucan in the fungal cell wall and records that the
      consequence of blocking its synthesis is fungistatic rather than
      fungicidal in Aspergillus. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Conidial Germination and Hyphal Tissue Invasion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      An intact wall is required for the hyphal extension that invades tissue,
      although this entry does not claim wall integrity alone is sufficient for
      invasion.
- name: Aspergillus Intrinsic Fluconazole Resistance
  biological_scale: MOLECULAR
  role: intrinsic_resistance
  conforms_to: "antifungal_intrinsic_resistance_gating#Species-Level Intrinsic Antifungal Resistance"
  description: >-
    Aspergillus species are intrinsically resistant to fluconazole, so
    identifying the organism as Aspergillus excludes that agent before any
    susceptibility result and mandates a mould-active triazole (voriconazole,
    isavuconazole, posaconazole, itraconazole) or amphotericin B. This
    lineage-determined exclusion is deliberately kept separate from the acquired
    environmental cyp51A resistance modelled above: one is fixed by taxonomy and
    gates empiric therapy, the other is isolate-dependent and requires
    susceptibility testing to detect.
  evidence:
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Whereas some intrinsic resistance has been found naturally, e.g.,
      fluconazole-resistant ... and Aspergillus species
    explanation: >-
      Identifies naturally occurring fluconazole resistance in Aspergillus
      species, the species-level exclusion this gating node represents. Evidence
      source is OTHER because this is a review.
phenotypes:
- category: Respiratory
  name: Pneumonia
  subtype: Invasive
  description: >-
    Acute pneumonia with dense nodular or wedge-shaped consolidation reflecting
    hyphal invasion and ischaemic infarction of lung parenchyma. In the
    profoundly neutropenic host the inflammatory signs may be muted, which is
    part of why diagnosis is late.
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
    temporality: ACUTE
  evidence:
  - reference: PMID:30076119
    reference_title: Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza; a retrospective cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were older than 18 years, were admitted to the ICU for more than
      24 h with acute respiratory failure, had pulmonary infiltrates on imaging,
      and a confirmed influenza infection based on a positive airway PCR test
    explanation: >-
      The cohort in which 19% developed invasive pulmonary aspergillosis was
      defined by acute respiratory failure with pulmonary infiltrates, which is
      the pneumonic presentation this phenotype records.
- category: Respiratory
  name: Hemoptysis
  subtypes:
  - Aspergilloma
  - Chronic Pulmonary
  - Invasive
  description: >-
    Bleeding from the hypertrophied bronchial vasculature around a colonised or
    destroyed cavity, or from an infarcted angioinvasive lesion. It is the
    manifestation most likely to be immediately life-threatening in chronic
    disease and can also signal antifungal failure or resistance.
  phenotype_term:
    preferred_term: Hemoptysis
    term:
      id: HP:0002105
      label: Hemoptysis
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Haemoptysis may be controlled with tranexamic acid and bronchial artery
      embolisation, rarely surgical resection, and may be a sign of therapeutic
      failure and/or antifungal resistance.
    explanation: >-
      Records haemoptysis as a management problem in chronic pulmonary
      aspergillosis and as a marker of treatment failure. Evidence source is
      OTHER because this is a guideline review.
- category: Respiratory
  name: Pulmonary Cavity
  subtypes:
  - Chronic Pulmonary
  - Aspergilloma
  description: >-
    One or more thick- or thin-walled pulmonary cavities, with or without an
    intracavitary fungal ball, persisting for at least three months. The cavity
    is both the diagnostic hallmark of chronic pulmonary aspergillosis and the
    ecological niche that permits it.
  phenotype_term:
    preferred_term: Pulmonary cavity
    term:
      id: HP:0033655
      label: Pulmonary cavity
    temporality: CHRONIC
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of CPA requires a combination of characteristics: one or
      more cavities with or without a fungal ball present or nodules on thoracic
      imaging
    explanation: >-
      The cavity is the first required diagnostic characteristic in the
      guideline criteria. Evidence source is OTHER because this is a guideline
      review.
- category: Respiratory
  name: Pulmonary Infiltrates
  subtypes:
  - ABPA

  phenotype_term:
    preferred_term: Bronchiectasis
    term:
      id: HP:0002110
      label: Bronchiectasis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The importance of recognizing ABPA relates to the improvement of patient
      symptoms, and delay in development or prevention of bronchiectasis, one
      manifestation of permanent lung damage in ABPA.
    explanation: >-
      Identifies bronchiectasis as the permanent lung damage of ABPA. Evidence

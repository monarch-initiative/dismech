  - reference: PMID:31236587
    reference_title: Prevalence of voriconazole-resistant invasive aspergillosis and its impact on mortality in haematology patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality at 6 and 12 weeks was higher in voriconazole-resistant cases in
      all patients (42.3% versus 28.2%, P = 0.20; and 57.7% versus 36.9%, P =
      0.064) and in non-ICU patients (36.4% versus 21.6%, P = 0.16; and 54.4%
      versus 30.7%; P = 0.035), compared with susceptible ones.
    explanation: >-
      Quantifies the cost of losing the triazole option, which is what makes
      this narrowing node a consequence rather than a bookkeeping label.
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Currently, four antifungal drug classes are used by clinicians and
      veterinarians for systemic treatment
    explanation: >-
      Establishes how few systemic antifungal classes exist, which is why
      removing one materially narrows the options. Evidence source is OTHER
      because this is a review.
  downstream:
  - target: Conidial Germination and Hyphal Tissue Invasion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      With fewer active agents, hyphal growth is less likely to be
      pharmacologically controlled. The edge is typed as indirect with unknown
      intermediates because it runs through prescribing decisions and drug
      exposure rather than through a molecular step.
phenotypes:
- category: Respiratory
  name: Pneumonia
  subtype: Invasive
  description: >-
    Acute pneumonia with dense nodular or wedge-shaped consolidation reflecting
    hyphal invasion and ischaemic infarction of lung parenchyma. In the
    profoundly neutropenic host the inflammatory signs may be muted, which is
    part of why diagnosis is late.
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
    temporality: ACUTE
  evidence:
  - reference: PMID:16088462
    reference_title: Invasive pulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Invasive pulmonary aspergillosis (IPA) is the most common fungal pulmonary
      infection in severely immunocompromised patients. Aspergillus species are
      commonly isolated from the soil, plant debris, and the indoor environment,
      including the hospital.
    explanation: >-
      Establishes invasive pulmonary aspergillosis as the pneumonic
      manifestation in severely immunocompromised patients. Evidence source is
      OTHER because this is a review.
  - reference: PMID:16088462
    reference_title: Invasive pulmonary aspergillosis.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The diagnosis of IPA is based on clinical, radiological, and mycological
      data. Clinical signs have a low specificity.
    explanation: >-
      Supports the statement in the description that the clinical presentation is
      non-specific, which is why diagnosis depends on imaging and mycology.
      Graded PARTIAL because it addresses diagnostic specificity rather than the
      pneumonia itself. Evidence source is OTHER because this is a review.
- category: Respiratory
  name: Hemoptysis
  subtypes:
  - Aspergilloma
  - Chronic Pulmonary
  - Invasive
  description: >-
    Bleeding from the hypertrophied bronchial vasculature around a colonised or
    destroyed cavity, or from an infarcted angioinvasive lesion. It is the
    manifestation most likely to be immediately life-threatening in chronic
    disease and can also signal antifungal failure or resistance.
  phenotype_term:
    preferred_term: Hemoptysis
    term:
      id: HP:0002105
      label: Hemoptysis
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Haemoptysis may be controlled with tranexamic acid and bronchial artery
      embolisation, rarely surgical resection, and may be a sign of therapeutic
      failure and/or antifungal resistance.
    explanation: >-
      Records haemoptysis as a management problem in chronic pulmonary
      aspergillosis and as a marker of treatment failure. Evidence source is
      OTHER because this is a guideline review.
- category: Respiratory
  name: Pulmonary Cavity
  subtypes:
  - Chronic Pulmonary
  - Aspergilloma
  description: >-
    One or more thick- or thin-walled pulmonary cavities, with or without an
    intracavitary fungal ball, persisting for at least three months. The cavity
    is both the diagnostic hallmark of chronic pulmonary aspergillosis and the
    ecological niche that permits it.
  phenotype_term:
    preferred_term: Pulmonary cavity
    term:
      id: HP:0033655
      label: Pulmonary cavity
    temporality: CHRONIC
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of CPA requires a combination of characteristics: one or
      more cavities with or without a fungal ball present or nodules on thoracic
      imaging
    explanation: >-
      The cavity is the first required diagnostic characteristic in the
      guideline criteria. Evidence source is OTHER because this is a guideline
      review.
- category: Respiratory
  name: Pulmonary Infiltrates
  subtypes:
  - ABPA
  - Invasive
  description: >-
    Radiographic pulmonary infiltrates: fleeting and migratory in ABPA, where
    they reflect eosinophilic inflammation and mucus impaction rather than
    invasion, and fixed in invasive disease, where they reflect tissue necrosis.
  phenotype_term:
    preferred_term: Pulmonary infiltrates
    term:
      id: HP:0002113
      label: Pulmonary infiltrates
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      manifesting with poorly controlled asthma, recurrent pulmonary infiltrates
      and bronchiectasis
    explanation: >-
      Names recurrent pulmonary infiltrates as a defining ABPA manifestation.
      Evidence source is OTHER because this is a review.
- category: Respiratory
  name: Bronchiectasis
  subtype: ABPA
  description: >-
    Central (proximal) bronchiectasis from repeated mucus impaction and
    eosinophilic bronchial-wall inflammation. Irreversible, and the reason ABPA
    is worth diagnosing before it develops.
  phenotype_term:
    preferred_term: Bronchiectasis
    term:
      id: HP:0002110
      label: Bronchiectasis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The importance of recognizing ABPA relates to the improvement of patient
      symptoms, and delay in development or prevention of bronchiectasis, one
      manifestation of permanent lung damage in ABPA.
    explanation: >-
      Identifies bronchiectasis as the permanent lung damage of ABPA. Evidence
      source is OTHER because this is a review.
- category: Respiratory
  name: Poorly Controlled Asthma
  subtype: ABPA
  description: >-
    Asthma that deteriorates or becomes refractory to standard therapy is the
    usual presentation of ABPA, and the reason ABPA is characteristically
    diagnosed late — the symptoms are attributed to the underlying asthma.
  phenotype_term:
    preferred_term: Asthma
    term:
      id: HP:0002099
      label: Asthma
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Allergic bronchopulmonary aspergillosis (ABPA) is an immunological
      pulmonary disorder caused by hypersensitivity to Aspergillus fumigatus,
      manifesting with poorly controlled asthma
    explanation: >-
      Names poorly controlled asthma as the presenting manifestation of ABPA.
      Evidence source is OTHER because this is a review.
- category: Respiratory
  name: Chronic Cough
  subtypes:
  - Chronic Pulmonary
  - Aspergillus Bronchitis
  description: >-
    Persistent cough, often productive, is the commonest symptom of chronic
    pulmonary aspergillosis and of Aspergillus bronchitis, and is part of the
    chronic pulmonary symptom complex the diagnostic criteria require.
  phenotype_term:
    preferred_term: Cough
    term:
      id: HP:0012735
      label: Cough
    temporality: CHRONIC
  evidence:
  - reference: PMID:24299422
    reference_title: Chronic pulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic pulmonary aspergillosis (CPA) is a group of consuming diseases
      usually presenting with prolonged and relapsing cough, dyspnoea and weight
      loss.
    explanation: >-
      Names prolonged relapsing cough as the leading presenting symptom of
      chronic pulmonary aspergillosis. Evidence source is OTHER because this is
      a review.
- category: Constitutional
  name: Weight Loss
  subtype: Chronic Pulmonary
  description: >-
    Progressive weight loss is one of the three symptoms that define the usual
    presentation of chronic pulmonary aspergillosis, alongside prolonged
    relapsing cough and dyspnoea. It is why the chronic forms are described as
    consuming diseases.
  phenotype_term:
    preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:24299422
    reference_title: Chronic pulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic pulmonary aspergillosis (CPA) is a group of consuming diseases
      usually presenting with prolonged and relapsing cough, dyspnoea and weight
      loss.
    explanation: >-
      Names weight loss as one of the three defining presenting symptoms of
      chronic pulmonary aspergillosis. Evidence source is OTHER because this is
      a review.
- category: Laboratory
  name: Eosinophilia
  subtype: ABPA
  description: >-
    Peripheral blood eosinophilia reflects the Th2-driven eosinophilic airway
    inflammation modelled in the pathophysiology, but it is a poor diagnostic
    discriminator: in a 209-patient ABPA series the median count was 850
    cells/microlitre and 60% of patients fell below the traditional 1000
    cells/microlitre criterion. Where it does track disease is with structural
    damage — counts were higher in patients with bronchiectasis and with
    high-attenuation mucus, which is the link between this laboratory finding
    and the airway destruction downstream of it.
  phenotype_term:
    preferred_term: Increased total eosinophil count
    term:
      id: HP:0001880
      label: Increased total eosinophil count
  evidence:
  - reference: PMID:22118718
    reference_title: Clinical relevance of peripheral blood eosinophil count in allergic bronchopulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median (IQR) eosinophil count at diagnosis was 850 (510-1541)cells/μl,
      and 60% of the patients had an eosinophil count of <1000 cells/μl.
    explanation: >-
      Quantifies the eosinophil count actually observed at ABPA diagnosis and
      shows most patients fall below the traditional criterion.
  - reference: PMID:22118718
    reference_title: Clinical relevance of peripheral blood eosinophil count in allergic bronchopulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median eosinophil count was higher in patients with an high resolution
      computed tomography (HRCT) chest finding of bronchiectasis (986 vs. 620,
      p<0.001) vs. those without and in patients with high-attenuation mucus
      (1200 vs. 800, p<0.001) compared to those without high-attenuation mucus.
    explanation: >-
      Links the eosinophil count to the bronchiectasis and mucus-plugging
      phenotypes that this entry models downstream of eosinophilic airway
      inflammation.
imaging_findings:
- name: Nodules with halo sign or air crescent sign on chest CT
  modality: CT
  subtype: Invasive
  diagnostic: true
  description: >-
    The characteristic CT appearance of invasive pulmonary aspergillosis:
    pulmonary nodules, early on surrounded by a rim of ground-glass attenuation
    (the halo sign) and later cavitating with a crescent of air between the
    necrotic centre and the cavity wall (the air crescent sign). These are the
    macroscopic reading of the angioinvasive, infarcting lesion modelled in the
    pathophysiology, and they are what carries the diagnosis when clinical signs
    do not.
  located_in:
    preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:16088462
    reference_title: Invasive pulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most typical computed tomographic (CT) findings are nodules with or
      without the halo sign or the air crescent sign.
    explanation: >-
      Names the two signs and identifies them as the typical CT appearance of
      invasive pulmonary aspergillosis. Evidence source is OTHER because this is
      a review.
- name: Pulmonary cavity with intracavitary fungal ball on chest CT
  modality: CT
  subtype: Chronic Pulmonary
  diagnostic: true
  description: >-
    One or more pulmonary cavities, with or without a mobile intracavitary
    fungal ball, often with adjacent pleural thickening. Together with an
    Aspergillus antibody response and three months of persistence this is the
    diagnosis of chronic pulmonary aspergillosis.
  located_in:
    preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  phenotype_term:
    preferred_term: Pulmonary cavity
    term:
      id: HP:0033655
      label: Pulmonary cavity
  evidence:
  - reference: PMID:24299422
    reference_title: Chronic pulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnostics largely rely on serologic Aspergillus precipitins and findings
      on thoracic computed tomography. The latter are manifold comprising cavity
      formation, pleural involvement and sometimes aspergilloma.
    explanation: >-
      Names the CT features this finding records and their diagnostic weight in
      chronic pulmonary aspergillosis. Evidence source is OTHER because this is
      a review.
histopathology:
- name: Septate hyphae with acute-angle branching and angioinvasion
  subtype: Invasive
  diagnostic: true
  description: >-
    On GMS or PAS-stained tissue, Aspergillus appears as thin, narrow, septate
    hyphae branching at an acute angle, with vascular invasion and tissue
    necrosis. The morphology is the point of the finding: it is what separates
    Aspergillus from the Mucorales, whose hyphae are broad, aseptate and branch
    at right angles, and the two moulds need different drugs.
  evidence:
  - reference: PMID:36407132
    reference_title: "Preliminary Experience in Post-COVID-19 Mycoses: A Pathologist's Perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six of the 45 cases also reveal thin, narrow septate, acute angle
      branching hyphae, indicating co-existing Aspergillosis (6/45).
    explanation: >-
      Gives the histomorphology by which Aspergillus is identified in tissue,
      which is the finding this entry records.
differential_diagnoses:
- name: Mucormycosis
  description: >-
    The clinically decisive differential, because the treatment diverges: the
    Mucorales are intrinsically resistant to voriconazole and to the
    echinocandins, so an Aspergillus-directed regimen is inactive against them.
    The two are separated on tissue morphology.
  distinguishing_features:
  - Broad, aseptate, ribbon-like hyphae branching at right angles, versus the thin, narrow, septate, acute-angle-branching hyphae of Aspergillus
  - Serum and BAL galactomannan is negative in mucormycosis
  - Intrinsic resistance to voriconazole and the echinocandins, leaving amphotericin B or isavuconazole
  evidence:
  - reference: PMID:36407132
    reference_title: "Preliminary Experience in Post-COVID-19 Mycoses: A Pathologist's Perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the surgical debridement specimens from post-COVID cases had
      histomorphology of mucormycosis displaying broad, aseptate, ribbon-like
      fungal hyphae with right-angle branching (45/45).
    explanation: >-
      Gives the contrasting mucormycosis histomorphology against which
      Aspergillus is distinguished, in a series where six of the same 45 cases
      carried both.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Invasive aspergillosis carries a crude annual mortality of 85.2% against its
    global incidence, and 90-day mortality among ICU influenza patients who
    develop it is 51%. Chronic pulmonary aspergillosis is less lethal but
    consuming and lifelong, with 18.5% annual mortality against an incidence
    comparable to the invasive form. ABPA is rarely fatal but causes irreversible
    bronchiectasis in a young asthmatic population.
  evidence:
  - reference: PMID:38224705
    reference_title: Global incidence and mortality of severe fungal disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Annually, over 2 113 000 people develop invasive aspergillosis in the
      context of chronic obstructive pulmonary disease, intensive care, lung
      cancer, or haematological malignancy, with a crude annual mortality of
      1 801 000 (85·2%).
    explanation: >-
      Source of the invasive-aspergillosis mortality figure behind this burden
      assessment. Evidence source is OTHER because this is a modelling study.
  - reference: PMID:30076119
    reference_title: "Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 90-day mortality was 51% in patients in the influenza cohort with
      invasive pulmonary aspergillosis and 28% in the influenza cohort without
      invasive pulmonary aspergillosis (p=0·0001).
    explanation: >-
      Gives the measured mortality among a defined ICU cohort, complementing the
      modelled global figure.
biochemical:
- name: Serum galactomannan
  subtype: Invasive
  notes: >-
    Galactomannan is a polysaccharide of the Aspergillus cell wall released
    during hyphal growth; its detection in serum or bronchoalveolar lavage by
    sandwich ELISA is the standard non-invasive marker of invasive disease. The
    trade-off between cut-offs is the point: raising the optical density index
    from 0.5 to 1.5 moves specificity from 81% to 93% but drops sensitivity from
    82% to 61%, so the threshold has to be chosen against the pre-test
    probability of the population being tested.
  presence: increased
  specificity: >-
    Validated in patients with neutropenia or functionally compromised
    neutrophils; performance in other host groups is not established by this
    evidence.
  evidence:
  - reference: PMID:26716951
    reference_title: Galactomannan detection for invasive aspergillosis in immunocompromised patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When using an optical density index (ODI) of 0.5 as a cut-off value, the
      sensitivity of the test was 82% (73% to 90%) and the specificity was 81%
      (72% to 90%).
    explanation: >-
      Cochrane meta-analysis of 54 studies giving the diagnostic accuracy at the
      commonly used 0.5 cut-off.
  - reference: PMID:26716951
    reference_title: Galactomannan detection for invasive aspergillosis in immunocompromised patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At a cut-off value of 1.5 ODI, the sensitivity was 61% (47% to 75%) and
      the specificity was 93% (89% to 97%).
    explanation: >-
      Gives the higher-threshold operating point, establishing the
      sensitivity-specificity trade-off this entry describes.
- name: Aspergillus IgG precipitins
  subtype: Chronic Pulmonary
  notes: >-
    Serum Aspergillus-specific IgG antibody (precipitins) is the immunological
    limb of the chronic pulmonary aspergillosis diagnostic criteria and is
    elevated in over 90% of patients — the single most useful test in a host who,
    being immunocompetent, mounts a strong antibody response.
  presence: increased
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus antibody (precipitins) is elevated in over 90% of patients.
    explanation: >-
      Gives the sensitivity of Aspergillus antibody in chronic pulmonary
      aspergillosis. Evidence source is OTHER because this is a guideline
      review.
- name: Total and Aspergillus-specific serum IgE
  subtype: ABPA
  notes: >-
    Marked elevation of total serum IgE together with A. fumigatus-specific IgE
    is required for the diagnosis of ABPA, and a fall of at least 25% in total
    IgE is one of the components of the accepted treatment-response definition.
  presence: increased
  evidence:
  - reference: PMID:10717010
    reference_title: A randomized trial of itraconazole in allergic bronchopulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A response was defined as a reduction of at least 50 percent in the
      corticosteroid dose, a decrease of at least 25 percent in the serum IgE
      concentration
    explanation: >-
      Serum IgE concentration is used as a quantitative response endpoint in the
      pivotal ABPA trial, which establishes it as the tracked biomarker of this
      subtype.
genetic:
- name: CYBB
  relationship_type: SUSCEPTIBILITY
  notes: >-
    X-linked chronic granulomatous disease is caused by loss-of-function
    variants in CYBB (gp91-phox), the catalytic subunit of the phagocyte NADPH
    oxidase. Losing the oxidative burst removes the antibody-opsonisation- and
    NADPH oxidase-dependent extracellular route that kills Aspergillus hyphae,
    which is why Aspergillus is the leading cause of pneumonia in CGD and its
    commonest cause of death. This is a susceptibility relationship: the variant
    causes CGD, and CGD permits aspergillosis on exposure.
  gene_term:
    preferred_term: CYBB
    term:
      id: hgnc:2578
      label: CYBB
  evidence:
  - reference: PMID:10844935
    reference_title: Chronic granulomatous disease. Report on a national registry of 368 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common causes of death were pneumonia and/or sepsis due to
      Aspergillus (23 patients) or Burkholderia cepacia (12 patients).
    explanation: >-
      In the 368-patient CGD registry Aspergillus is the leading cause of death,
      which is the clinical measure of how much the NADPH oxidase route matters
      for this organism.
  - reference: PMID:26718340
    reference_title: "Human Neutrophils Use Different Mechanisms To Kill Aspergillus fumigatus Conidia and Hyphae: Evidence from Phagocyte Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the extracellular destruction of the Aspergillus hyphae needs opsonization
      by Abs and involves predominantly recognition via Fcγ receptors, signaling
      via Syk, PI3K, and protein kinase C to trigger the production of toxic
      reactive oxygen metabolites by the NADPH oxidase and myeloperoxidase
    explanation: >-
      The anti-hyphal killing mechanism requires the NADPH oxidase, the enzyme
      complex whose catalytic subunit CYBB encodes. This is the mechanistic link
      between a CYBB loss-of-function genotype and susceptibility to
      Aspergillus.
- name: TLR4
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Donor TLR4 haplotypes carrying the D299G and T399I substitutions increased
    the risk of invasive aspergillosis in recipients of unrelated-donor
    allogeneic haematopoietic-cell transplants, in a discovery cohort and a
    replication cohort. Note the direction of the effect: it is the donor's
    genotype, not the recipient's, because the relevant innate cells are
    donor-derived after engraftment.
  gene_term:
    preferred_term: TLR4
    term:
      id: hgnc:11850
      label: TLR4
  evidence:
  - reference: PMID:18946062
    reference_title: Toll-like receptor 4 polymorphisms and aspergillosis in stem-cell transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the discovery study, two donor TLR4 haplotypes (S3 and S4) increased
      the risk of invasive aspergillosis (adjusted hazard ratio for S3, 2.20;
      95% confidence interval [CI], 1.14 to 4.25; P=0.02; adjusted hazard ratio
      for S4, 6.16; 95% CI, 1.97 to 19.26; P=0.002).
    explanation: >-
      Quantifies the donor-genotype effect on invasive aspergillosis risk after
      allogeneic transplantation.
  - reference: PMID:18946062
    reference_title: Toll-like receptor 4 polymorphisms and aspergillosis in stem-cell transplantation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the association was present in unrelated recipients of hematopoietic-cell
      transplants (odds ratio, 5.00; 95% CI, 1.04 to 24.01; P=0.04) but not in
      related recipients (odds ratio, 2.29; 95% CI, 0.93 to 5.68; P=0.07)
    explanation: >-
      The replication limits the association to unrelated-donor transplants.
      Graded PARTIAL because it qualifies rather than uniformly supports the
      susceptibility claim.
- name: CARD9
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Autosomal recessive CARD9 deficiency causes invasive fungal disease in
    otherwise healthy children and adults. CARD9 sits downstream of the C-type
    lectin receptors — the dectin-1 arm this entry models as the first
    recognition step — and its loss impairs myeloid cytokine and chemokine
    output, neutrophil fungal killing in vitro, and neutrophil recruitment in
    vivo. Every causal fungus reported in these patients belongs to the
    Ascomycota, Aspergillus among them. Like CYBB, this is a susceptibility
    relationship rather than a cause of aspergillosis as such.
  gene_term:
    preferred_term: CARD9
    term:
      id: hgnc:16391
      label: CARD9
  evidence:
  - reference: PMID:30136218
    reference_title: "Inherited CARD9 Deficiency: Invasive Disease Caused by Ascomycete Fungi in Previously Healthy Children and Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strikingly, all the causal fungi belonged to the phylum Ascomycota:
      commensal Candida and saprophytic Trychophyton, Aspergillus, Phialophora,
      Exophiala, Corynesprora, Aureobasidium, and Ochroconis.
    explanation: >-
      Names Aspergillus among the fungi causing invasive disease in CARD9
      deficiency, which is the susceptibility this entry records.
  - reference: PMID:30136218
    reference_title: "Inherited CARD9 Deficiency: Invasive Disease Caused by Ascomycete Fungi in Previously Healthy Children and Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with CARD9 deficiency present impaired cytokine and chemokine
      production by macrophages, dendritic cells, and peripheral blood
      mononuclear cells and defective killing of some fungi by neutrophils in
      vitro. Neutrophil recruitment to sites of infection is impaired in vivo.
    explanation: >-
      Gives the mechanism: the same macrophage recognition-to-recruitment and
      neutrophil killing steps this entry models are the ones CARD9 deficiency
      degrades.
environmental:
- name: Inhalation of airborne Aspergillus conidia
  exposure_term:
    preferred_term: exposure to airborne Aspergillus conidia
    term:
      id: ECTO:3000000
      label: exposure to organism
  effect: Necessary exposure for every clinical form of aspergillosis
  description: >-
    Continuous, essentially unavoidable inhalational exposure to conidia
    dispersed from soil, decaying vegetation, compost, and construction or
    ventilation dust. The exposure is universal, which is why it explains the
    disease only in combination with a host factor. The bound term is the
    general ECTO organism-exposure class: ECTO has no term for exposure to
    Aspergillus, to fungi, or to airborne spores, so the most specific accurate
    binding available is used rather than a narrower approximate one.
  influences_mechanisms:
  - target: Inhalation and Alveolar Deposition of Airborne Aspergillus Conidia
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Airborne conidia reaching the alveolus are the initiating event of every
      form of the disease.
    evidence:
    - reference: PMID:33563417
      reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Aspergillus species are ubiquitous in the environment. Aspergillosis is
        acquired by inhalation of Aspergillus spores.
      explanation: >-
        States that the disease is acquired by inhaling environmental spores,
        the exposure-to-mechanism link this edge asserts. Evidence source is
        OTHER because this is a review.
  evidence:
  - reference: PMID:33563417
    reference_title: "Pulmonary Aspergillosis: Spectrum of Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aspergillus species are ubiquitous in the environment. Aspergillosis is
      acquired by inhalation of Aspergillus spores. In normal hosts, spore
      inhalation rarely causes lung disease.
    explanation: >-
      Establishes both the ubiquity of the exposure and that it is insufficient
      by itself, which is exactly the claim this entry makes. Evidence source is
      OTHER because this is a review.
- name: Systemic corticosteroid therapy
  exposure_term:
    preferred_term: exposure to corticosteroid
    term:
      id: ECTO:0000173
      label: exposure to corticosteroid
  effect: Predisposition to invasive aspergillosis
  description: >-
    Corticosteroids impair macrophage and neutrophil antifungal function while
    leaving cell counts intact, so they produce invasive disease by a different
    route from chemotherapy-induced neutropenia. Corticosteroid use was an
    independent risk factor for invasive pulmonary aspergillosis in the ICU
    influenza cohort alongside influenza itself.
  influences_mechanisms:
  - target: Failure of Phagocyte Clearance of Aspergillus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Corticosteroid exposure degrades phagocyte antifungal function, the
      permissive state this node models.
    evidence:
    - reference: PMID:30076119
      reference_title: "Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza: a retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In this study, influenza was found to be independently associated with
        invasive pulmonary aspergillosis (adjusted odds ratio 5·19; 95% CI
        2·63-10·26; p<0·0001), along with a higher APACHE II score, male sex,
        and use of corticosteroids.
      explanation: >-
        Corticosteroid use is one of the factors independently associated with
        invasive pulmonary aspergillosis in this multivariable analysis.
  evidence:
  - reference: PMID:30076119
    reference_title: "Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      along with a higher APACHE II score, male sex, and use of corticosteroids
    explanation: >-
      Names corticosteroid use among the independent risk factors identified by
      the study's logistic regression.
- name: Severe influenza or COVID-19 critical illness
  effect: Predisposition to invasive pulmonary aspergillosis in hosts with no classical host factor
  description: >-
    Severe respiratory viral infection is a distinct and comparatively recent
    route into invasive aspergillosis: it produces the phenotype in ICU patients
    who carry no EORTC/MSG host factor at all. In seven influenza seasons across
    seven Belgian and Dutch ICUs, 14% of non-immunocompromised influenza patients
    developed invasive pulmonary aspergillosis against 5% of influenza-negative
    severe community-acquired pneumonia controls. Ninety-day mortality was 51%
    among influenza patients who developed it versus 28% among those who did
    not. The same pattern was then reported for COVID-19-associated pulmonary
    aspergillosis. No exposure_term is bound: this is an acute infectious
    comorbidity rather than an environmental exposure, and ECTO has no term that
    describes it without overstating it as an environmental agent.
  influences_mechanisms:
  - target: Failure of Phagocyte Clearance of Aspergillus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe viral pneumonitis produces a functional antifungal defect
      sufficient to permit conidial germination in hosts with no classical
      immunocompromise. The intermediates are not established, so the edge is
      typed as indirect with unknown intermediates.
    evidence:
    - reference: PMID:30076119
      reference_title: "Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza: a retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        whereas in the non-immunocompromised influenza case group, incidence was
        14% (45 of 315 patients). Conversely, only 16 (5%) of 315 patients in
        the control group developed invasive pulmonary aspergillosis.
      explanation: >-
        The comparison in non-immunocompromised patients isolates influenza
        itself, rather than pre-existing immunocompromise, as the factor
        permitting invasive disease.
  evidence:
  - reference: PMID:30076119
    reference_title: "Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 90-day mortality was 51% in patients in the influenza cohort with
      invasive pulmonary aspergillosis and 28% in the influenza cohort without
      invasive pulmonary aspergillosis (p=0·0001).
    explanation: >-
      Quantifies the mortality cost of the association, establishing it as a
      clinically consequential predisposition rather than an incidental finding.
  - reference: PMID:32339350
    reference_title: COVID-19 associated pulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      COVID-19 associated invasive pulmonary aspergillosis was found in five of
      19 consecutive critically ill patients with moderate to severe ARDS.
    explanation: >-
      Extends the same viral-critical-illness association from influenza to
      COVID-19.
treatments:
- name: Voriconazole
  description: >-
    Mould-active triazole and the agent that established triazole primacy for
    invasive aspergillosis: in the pivotal randomised trial it beat amphotericin
    B deoxycholate on both response (52.8% vs 31.6%) and 12-week survival (70.8%
    vs 57.9%) with fewer severe drug-related adverse events. Transient visual
    disturbance is common and its narrow therapeutic index makes serum-level
    monitoring routine.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: voriconazole
      term:
        id: CHEBI:10023
        label: voriconazole
  target_mechanisms:
  - target: Fungal Ergosterol Biosynthesis via Cyp51 Sterol 14-alpha-Demethylase
    treatment_effect: INHIBITS
    description: >-
      Voriconazole binds heme iron at fungal lanosterol 14-alpha-demethylase,
      depleting ergosterol and accumulating toxic methylsterols.
  evidence:
  - reference: PMID:12167683
    reference_title: Voriconazole versus amphotericin B for primary therapy of invasive aspergillosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At week 12, there were successful outcomes in 52.8 percent of the patients
      in the voriconazole group (complete responses in 20.8 percent and partial
      responses in 31.9 percent) and 31.6 percent of those in the amphotericin B
      group
    explanation: >-
      The randomised comparison establishing voriconazole's superiority over
      amphotericin B for primary therapy of invasive aspergillosis.
  - reference: PMID:12167683
    reference_title: Voriconazole versus amphotericin B for primary therapy of invasive aspergillosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Voriconazole-treated patients had significantly fewer severe drug-related
      adverse events, but transient visual disturbances were common with
      voriconazole (occurring in 44.8 percent of patients).
    explanation: >-
      Records the tolerability advantage and the characteristic visual adverse
      effect that shape how the drug is used.
- name: Isavuconazole
  description: >-
    Mould-active triazole, non-inferior to voriconazole for all-cause 42-day
    mortality in invasive mould disease in the SECURE trial (19% vs 20%), with
    fewer hepatobiliary, eye and skin adverse events. Preferred where
    voriconazole toxicity, drug interactions or level variability are limiting.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: isavuconazole
      term:
        id: CHEBI:85979
        label: isavuconazole
  target_mechanisms:
  - target: Fungal Ergosterol Biosynthesis via Cyp51 Sterol 14-alpha-Demethylase
    treatment_effect: INHIBITS
    description: >-
      Isavuconazole inhibits the same fungal lanosterol 14-alpha-demethylase
      step as the other triazoles.
  evidence:
  - reference: PMID:26684607
    reference_title: "Isavuconazole versus voriconazole for primary treatment of invasive mould disease caused by Aspergillus and other filamentous fungi (SECURE): a phase 3, randomised-controlled, non-inferiority trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All-cause mortality from first dose of study drug to day 42 for the ITT
      population was 19% with isavuconazole (48 patients) and 20% with
      voriconazole (52 patients), with an adjusted treatment difference of -1·0%
      (95% CI -7·8 to 5·7).
    explanation: >-
      The primary efficacy result establishing non-inferiority to voriconazole.
  - reference: PMID:26684607
    reference_title: "Isavuconazole versus voriconazole for primary treatment of invasive mould disease caused by Aspergillus and other filamentous fungi (SECURE): a phase 3, randomised-controlled, non-inferiority trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, isavuconazole-treated patients had a lower frequency of
      hepatobiliary disorders (23 [9%] vs 42 [16%]; p=0·016), eye disorders (39
      [15%] vs 69 [27%]; p=0·002)
    explanation: >-
      Quantifies the tolerability advantage over voriconazole that drives agent
      choice when both are active.
- name: Itraconazole for chronic and allergic disease
  description: >-
    Oral triazole and the workhorse of the non-invasive forms. In ABPA that has
    become corticosteroid-dependent it doubles the response rate over placebo
    (46% vs 19%) as a
    steroid-sparing agent; in chronic cavitary pulmonary aspergillosis it beats
    supportive care alone (76.5% vs 35.7% overall response at six months).
    Therapy in chronic disease is prolonged, and azole levels, drug interactions
    and toxicity need monitoring throughout.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: itraconazole
      term:
        id: CHEBI:6076
        label: itraconazole
  target_mechanisms:
  - target: Fungal Ergosterol Biosynthesis via Cyp51 Sterol 14-alpha-Demethylase
    treatment_effect: INHIBITS
    description: >-
      Itraconazole inhibits fungal lanosterol 14-alpha-demethylase, reducing the
      antigenic fungal burden in ABPA and the organism load in chronic cavitary
      disease.
  evidence:
  - reference: PMID:10717010
    reference_title: A randomized trial of itraconazole in allergic bronchopulmonary aspergillosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were responses in 13 of 28 patients in the itraconazole group (46
      percent), as compared with 5 of 27 patients in the placebo group (19
      percent, P=0.04).
    explanation: >-
      The randomised placebo-controlled result establishing itraconazole as a
      steroid-sparing agent in ABPA.
  - reference: PMID:23496375
    reference_title: "Itraconazole in chronic cavitary pulmonary aspergillosis: a randomised controlled trial and systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The number of patients showing overall response was significantly higher
      in the itraconazole group (76.5%) vs. the control (35.7%) group (P = 0.02).
    explanation: >-
      The randomised result supporting itraconazole over supportive care alone
      in chronic cavitary pulmonary aspergillosis.
- name: Oral corticosteroid therapy for ABPA
  description: >-
    Systemic corticosteroids remain primary therapy for ABPA exacerbations,
    suppressing the Th2/IgE-driven eosinophilic inflammation rather than the
    fungus. The tension with the rest of this entry is real and worth naming:
    the same drug class that treats the allergic form is an independent risk
    factor for the invasive form, so the host phenotype has to be established
    before the agent is chosen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Eosinophilic Airway Inflammation and Mucus Plugging
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids suppress the eosinophilic airway inflammation and mucus
      impaction that produce the recurrent infiltrates of ABPA.
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Primary therapy consists of oral corticosteroids to control exacerbations,
      itraconazole as a steroid-sparing agent and optimized asthma therapy.
    explanation: >-
      The ISHAM working group names oral corticosteroids as primary therapy for
      ABPA exacerbations. Evidence source is OTHER because this is a review.
  - reference: PMID:30076119
    reference_title: "Invasive aspergillosis in patients admitted to the intensive care unit with severe influenza: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      along with a higher APACHE II score, male sex, and use of corticosteroids
    explanation: >-
      Supports the caution stated in the description: corticosteroid use is an
      independent risk factor for the invasive form of the same disease this
      treatment is used for in its allergic form.
- name: Anti-type-2 biologic therapy for ABPA
  description: >-
    For ABPA that stays dependent on oral corticosteroids, biologics directed at
    the type-2 pathway are used as steroid-sparing add-ons. A systematic review
    and meta-analysis of 86 studies covering 346 patients found that the anti-IgE
    antibody omalizumab reduced exacerbation rates, oral corticosteroid dose and
    total IgE while improving FEV1; dupilumab and mepolizumab showed the same direction on an
    individual-patient-data meta-analysis. This is adjunctive and the evidence is
    pooled case series rather than randomised trials, which is why it sits behind
    corticosteroids and itraconazole here.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omalizumab
      term:
        id: NCIT:C29299
        label: Omalizumab
  target_mechanisms:
  - target: Th2 Sensitisation and IgE-Mediated Hypersensitivity to Aspergillus Antigens
    treatment_effect: INHIBITS
    description: >-
      Omalizumab binds free IgE, and the anti-IL-4-receptor and anti-IL-5
      agents interrupt the type-2 cytokine signalling that drives IgE class
      switching and eosinophil recruitment.
  evidence:
  - reference: PMID:38898129
    reference_title: "Efficacy of Biologics in Patients with Allergic Bronchopulmonary Aspergillosis: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Omalizumab therapy significantly reduced exacerbation rates (- 2.29 [95%CI
      - 3.32, - 1.26]), OCS dosage (- 10.91 mg [95%CI - 18.98, - 2.85]), and
      total IgE levels (- 273.07 IU/mL [95%CI - 379.30, - 166.84]), meanwhile
      improving FEV1% predicted (10.09% [95%CI 6.62, 13.55]).
    explanation: >-
      Quantifies the omalizumab effect on exacerbations, steroid dose, IgE and
      lung function in pooled ABPA data.
  - reference: PMID:38898129
    reference_title: "Efficacy of Biologics in Patients with Allergic Bronchopulmonary Aspergillosis: A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further randomized, controlled studies with a larger sample size and longer
      follow-up are needed to confirm these findings.
    explanation: >-
      The authors' own limitation, quoted because it is the reason this entry
      places biologics behind corticosteroids and itraconazole. Graded PARTIAL
      because it qualifies rather than supports the efficacy claim.
- name: Echinocandin salvage therapy
  description: >-
    Caspofungin and the other echinocandins inhibit beta-1,3-glucan synthesis.
    Against Aspergillus they are fungistatic rather than fungicidal and their
    single-agent activity is limited, so they are an alternative or combination
    option rather than first-line — a genuinely different position from the one
    the same class holds in candidiasis. They are exceptionally well tolerated
    and have almost no drug-drug interactions, which is why they remain useful
    when triazoles cannot be given.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: caspofungin
      term:
        id: CHEBI:474180
        label: caspofungin
  target_mechanisms:
  - target: Aspergillus beta-1,3-Glucan Synthesis by Fks Glucan Synthase
    treatment_effect: INHIBITS
    description: >-
      Echinocandins are non-competitive inhibitors of the beta-1,3-glucan
      synthase complex, depleting the wall polymer.
  evidence:
  - reference: PMID:31138565
    reference_title: "Echinocandins for the Treatment of Invasive Aspergillosis: from Laboratory to Bedside."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite their limited antifungal activity against Aspergillus spp.,
      echinocandins are considered an alternative option for the treatment of
      invasive aspergillosis (IA).
    explanation: >-
      States both the limited activity and the alternative-option role that this
      treatment entry claims. Evidence source is OTHER because this is a review.
  - reference: PMID:31138565
    reference_title: "Echinocandins for the Treatment of Invasive Aspergillosis: from Laboratory to Bedside."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This drug class exhibits several advantages, such as excellent
      tolerability and its potential for synergistic interactions with some
      other antifungals.
    explanation: >-
      Supports the tolerability and combination rationale that keeps the class
      in use despite limited monotherapy activity. Evidence source is OTHER
      because this is a review.
- name: Amphotericin B
  description: >-
    Polyene that binds and sequesters membrane ergosterol, forming pores that
    release intracellular ions, and that additionally drives reactive oxygen
    species accumulation. Because it acts on ergosterol itself rather than on
    the biosynthetic enzyme the azoles inhibit, a cyp51A target-site
    substitution does not by itself confer polyene cross-resistance — which is
    the basis for its role in azole-resistant disease, alongside use where
    triazoles are contraindicated. This is not a claim of universal polyene
    activity against Aspergillus: A. terreus is characteristically amphotericin
    B resistant by an unrelated oxidative-stress-response mechanism.
    Nephrotoxicity limits the deoxycholate formulation; lipid formulations are
    used in practice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: amphotericin B
      term:
        id: CHEBI:2682
        label: amphotericin B
  target_mechanisms:
  - target: Ergosterol-Enriched Aspergillus Plasma Membrane
    treatment_effect: INHIBITS
    description: >-
      Amphotericin B binds membrane ergosterol directly, forming pores and
      permeabilising the fungal plasma membrane.
  evidence:
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      First, several molecules of AMB incorporate into the fungal lipid bilayer
      and bind to ergosterol. By ergosterol sequestration, pores are formed, and
      both the ions (K+, Mg2+, Ca2+, and Cl−) and electrolyte glucose are
      released.
    explanation: >-
      Gives the ergosterol-binding, pore-forming mechanism of action, which is
      the target the description says is distinct from the azoles' enzyme
      target. Evidence source is OTHER because this is a review.
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Second, AMB induces the accumulation of reactive oxygen species (ROS),
      resulting in DNA, protein, mitochondrial, and membrane damage
    explanation: >-
      Sources the second mechanism named in the description. Evidence source is
      OTHER because this is a review.
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the higher activity of catalase and superoxide dismutase and the more
      intense stress response through heat shock proteins 70 and 90 (Hsp70,
      Hsp90) contribute to the intrinsic resistance of A. terreus
    explanation: >-
      Sources the A. terreus caveat, and identifies its mechanism as an
      oxidative-stress response unrelated to azole target-site resistance.
      Evidence source is OTHER because this is a review.
  - reference: PMID:12167683
    reference_title: Voriconazole versus amphotericin B for primary therapy of invasive aspergillosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with invasive aspergillosis, initial therapy with voriconazole
      led to better responses and improved survival and resulted in fewer severe
      side effects than the standard approach of initial therapy with
      amphotericin B.
    explanation: >-
      Establishes that amphotericin B is no longer first-line for invasive
      aspergillosis. Graded PARTIAL because it supports the agent's demotion
      rather than its remaining indications.
- name: Posaconazole antifungal prophylaxis in prolonged neutropenia
  description: >-
    Primary prevention rather than treatment: in patients neutropenic from
    chemotherapy for acute myelogenous leukaemia or myelodysplastic syndrome,
    posaconazole prophylaxis cut invasive aspergillosis from 7% to 1% versus
    fluconazole or itraconazole and improved overall survival. Fluconazole is
    inactive against Aspergillus, so part of this effect is simply the switch to
    a mould-active agent — the intrinsic-resistance gate modelled in the
    pathophysiology, applied prospectively.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: posaconazole
      term:
        id: CHEBI:64355
        label: posaconazole
  target_mechanisms:
  - target: Fungal Ergosterol Biosynthesis via Cyp51 Sterol 14-alpha-Demethylase
    treatment_effect: INHIBITS
    description: >-
      Posaconazole inhibits fungal lanosterol 14-alpha-demethylase, suppressing
      fungal growth during the period of maximal host susceptibility.
  evidence:
  - reference: PMID:17251531
    reference_title: Posaconazole vs. fluconazole or itraconazole prophylaxis in patients with neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significantly fewer patients in the posaconazole group had invasive
      aspergillosis (2 [1%] vs. 20 [7%], P<0.001).
    explanation: >-
      The randomised result establishing prophylactic efficacy specifically
      against invasive aspergillosis.
  - reference: PMID:17251531
    reference_title: Posaconazole vs. fluconazole or itraconazole prophylaxis in patients with neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival was significantly longer among recipients of posaconazole than
      among recipients of fluconazole or itraconazole (P=0.04).
    explanation: >-
      Establishes that the prophylactic benefit extends to overall survival, not
      only to infection incidence.
- name: Surgical excision of simple aspergilloma
  description: >-
    For a single fungal ball in a resectable cavity, excision is the definitive
    treatment and is preferred over prolonged antifungal therapy, ideally by
    video-assisted thoracic surgery. This is the clearest point at which the
    subtype distinction changes management: the same organism in the same lung
    is treated by resection here and by months of oral azole in chronic cavitary
    disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Saprophytic Cavity Colonisation and Fungal Ball Formation
    treatment_effect: INHIBITS
    description: >-
      Resection removes the colonised cavity and the fungal ball within it,
      eliminating the lesion rather than suppressing the organism.
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surgical excision of simple aspergilloma is recommended, if technically
      possible, and preferably via video-assisted thoracic surgery technique.
    explanation: >-
      The guideline recommendation for surgical management of simple
      aspergilloma, including the preferred approach. Evidence source is OTHER
      because this is a guideline review.

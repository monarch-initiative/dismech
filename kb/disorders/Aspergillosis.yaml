notes: >-
  Concept decision (issue #9041): curated as a single root Disease with
  has_subtypes rather than as a kb/groupings/ Grouping. The forms share one
  conserved pathograph — inhalation of ubiquitous conidia, then a phagocyte
  gate whose state sets the branch — so they are specialisations of one
  mechanism rather than a union of mechanistically distinct diseases, which is
  the test a grouping would have to meet. The host-status axis is carried
  explicitly by the environmental block (corticosteroid exposure, severe viral
  critical illness) and the genetic block (CYBB, TLR4) rather than being
  implied by the subtype names.

  Related dismech entries: Cystic_Fibrosis and Hypersensitivity_Pneumonitis for
  the ABPA host context and the adjacent allergic lung disease;
  Chronic_Granulomatous_Disease for the phagocyte-defect host; Otomycosis for
  non-invasive Aspergillus disease outside the lung; and the
  fungal_cell_wall_glucan_synthesis_inhibition and
  antifungal_intrinsic_resistance_gating modules, both of which this entry
  conforms to.

  Deliberate omissions. NCIT has no clinical-action term for bronchial artery
  embolisation, so that intervention is curated within the tranexamic acid
  treatment entry rather than as a separately bound procedure. ECTO has no term
  for exposure to Aspergillus, fungi, or airborne spores, so the conidial
  exposure is bound to the general ECTO:3000000 organism-exposure class. No
  datasets block is included: no Aspergillus-specific accession was verified for
  this entry, and an unverified accession is worse than none.

- name: Aspergillus Intrinsic Fluconazole Resistance
  biological_scale: MOLECULAR
  role: intrinsic_resistance
  conforms_to: "antifungal_intrinsic_resistance_gating#Species-Level Intrinsic Antifungal Resistance"
  description: >-
    Aspergillus species are intrinsically resistant to fluconazole, so
    identifying the organism as Aspergillus excludes that agent before any
    susceptibility result and mandates a mould-active triazole (voriconazole,
    isavuconazole, posaconazole, itraconazole) or amphotericin B. This
    lineage-determined exclusion is deliberately kept separate from the acquired
    environmental cyp51A resistance modelled above: one is fixed by taxonomy and
    gates empiric therapy, the other is isolate-dependent and requires
    susceptibility testing to detect.
  evidence:
  - reference: PMID:32178468
    reference_title: Antifungal Drugs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Whereas some intrinsic resistance has been found naturally, e.g.,
      fluconazole-resistant ... and Aspergillus species
    explanation: >-
      Identifies naturally occurring fluconazole resistance in Aspergillus
      species, the species-level exclusion this gating node represents. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Resistance-Gated Narrowing of Antifungal Options
    causal_link_type: DIRECT
    description: >-
      Identifying the organism as Aspergillus removes fluconazole from the
      viable options before any susceptibility result, which is the empiric
      gating this node exists to record.
- name: Resistance-Gated Narrowing of Antifungal Options
  biological_scale: ORGANISM
  role: consequence
  conforms_to: >-
    antifungal_intrinsic_resistance_gating#Resistance-Gated Narrowing of
    Antifungal Options
  description: >-
    The shared consequence of the two resistance arms is a smaller set of viable
    agents. The fixed lineage-level exclusion constrains empiric therapy from the
    moment the organism is identified; the acquired environmental cyp51A alleles
    remove agents only once susceptibility testing detects them. Convergence here
    does not assert that either arm causes the other. The clinical cost is
    measurable: in a haematology cohort, 12-week mortality among non-ICU patients
    was 54.4% with voriconazole-resistant invasive aspergillosis against 30.7%
    with susceptible disease.

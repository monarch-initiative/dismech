- name: Fungal Ergosterol Biosynthesis via Cyp51 Sterol 14-alpha-Demethylase
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    fungal_ergosterol_synthesis_inhibition#Lanosterol 14-alpha-Demethylation by
    CYP51 (ERG11)
  description: >-
    Aspergillus membrane ergosterol is made by a pathway whose rate-limiting
    demethylation step is catalysed by the cytochrome P450 lanosterol
    14-alpha-demethylase encoded by cyp51A and cyp51B. Triazoles bind heme iron
    at this enzyme, so ergosterol is depleted and toxic 14-alpha-methylsterols
    accumulate. This node is intentionally target-only: it describes the normal
    fungal biosynthetic activity that azole therapy inhibits, not a step that
    causes disease.

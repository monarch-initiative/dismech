      part of the CCPA case definition. Graded PARTIAL because the quote names
      the chronic symptom complex rather than cough specifically.
- category: Constitutional
  name: Weight Loss
  subtypes:
  - Chronic Pulmonary
  - Disseminated
  description: >-
    Progressive weight loss with fatigue is characteristic of the chronic
    cavitary and fibrosing forms and contributes to the substantial long-term
    mortality of chronic pulmonary aspergillosis.
  phenotype_term:
    preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
  evidence:
  - reference: PMID:26699723
    reference_title: "Chronic pulmonary aspergillosis: rationale and clinical guidelines for diagnosis and management."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Long-term oral antifungal therapy is recommended for CCPA to improve
      overall health status and respiratory symptoms, arrest haemoptysis and
      prevent progression.
    explanation: >-
      The guideline treats deteriorating overall health status as a treatment
      target in CCPA. Graded PARTIAL because the quote names general health
      status rather than weight loss specifically. Evidence source is OTHER
      because this is a guideline review.
- category: Laboratory
  name: Eosinophilia
  subtype: ABPA
  description: >-
    Peripheral blood eosinophilia, conventionally above 500 cells/microlitre, is
    one of the supporting ISHAM criteria for ABPA and reflects the Th2-driven
    eosinophilic airway inflammation modelled in the pathophysiology.
  phenotype_term:
    preferred_term: Increased total eosinophil count
    term:
      id: HP:0001880
      label: Increased total eosinophil count
  evidence:
  - reference: PMID:23889240
    reference_title: "Allergic bronchopulmonary aspergillosis: review of literature and proposal of new diagnostic and classification criteria."
    supports: PARTIAL

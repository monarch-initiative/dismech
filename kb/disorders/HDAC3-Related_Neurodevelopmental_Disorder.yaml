name: HDAC3-Related Neurodevelopmental Disorder
creation_date: "2026-10-23T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: HDAC3-related neurodevelopmental disorder
  term:
    id: MONDO:0700370
    label: HDAC3-related neurodevelopmental disorder
synonyms:
- HDAC3-related intellectual disability
parents:
- Mendelian neurodevelopmental disorder
notes: >-
  Described in 2024 from a cohort of six individuals with heterozygous de novo
  missense variants in HDAC3 (PMID:39047730). No GeneReviews or StatPearls
  chapter covers this disease or HDAC3 (offline Bookshelf index snapshot
  2026-09-10 and an online PubMed title search both return none), consistent
  with a recently delineated entity.
references:
- reference: PMID:39047730
  title: >-
    De novo missense variants in HDAC3 leading to epigenetic machinery
    dysfunction are associated with a variable neurodevelopmental disorder.
- reference: PMID:40609820
  title: >-
    HDAC3 in neurodevelopmental disorders: Molecular mechanisms and targeted
    intervention.
inheritance:
- name: Autosomal dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    All reported affected individuals carry heterozygous de novo missense
    variants in HDAC3; inheritance is autosomal dominant arising de novo.
  evidence:
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all located in evolutionarily conserved sites and confirmed as de novo"
    explanation: >-
      All six cohort variants were confirmed de novo, establishing autosomal
      dominant de novo inheritance.
genetic:
- name: HDAC3
  gene_term:
    preferred_term: HDAC3
    term:
      id: hgnc:4854
      label: HDAC3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    HDAC3 encodes the class I histone deacetylase that is the catalytic subunit
    of the NCoR1/SMRT (and CoREST) transcriptional corepressor complexes.
    Reported disease variants are heterozygous de novo missense changes. The
    mechanism is argued to be multifaceted: gnomAD constraint favours
    haploinsufficiency, but the exclusively missense spectrum and clustering at
    protein interfaces also implicate a dominant-negative contribution, so
    functional_impact is left uncategorised rather than forced to a single
    value. Two additional likely-pathogenic missense variants (p.Tyr298Cys,
    p.Arg301Gln) are recorded in ClinVar with intellectual disability and
    epilepsy.
  evidence:
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we correlated heterozygous de novo variants in HDAC3 with a neurodevelopmental disorder having variable clinical presentations, frequently associated with intellectual disability, developmental delay, epilepsy, and musculoskeletal abnormalities"
    explanation: >-
      Establishes HDAC3 de novo variants as causative of the neurodevelopmental
      disorder curated here.
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "The probability of haploinsufficiency (pHaplo) and triplosensitivity (pTriplo) scores for HDAC3 are 0.62 and 1.00"
    explanation: >-
      Gene-dosage constraint scores support haploinsufficiency as a contributing
      mechanism.
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual disability and epilepsy were both observed with the p.Tyr298Cys and p.Arg301Gln variants"
    explanation: >-
      Two further likely-pathogenic ClinVar missense variants extend the allelic
      spectrum with the same core phenotype.
  variants:
  - name: p.Asp93Asn
    description: >-
      c.277G>A (NM_003883.4); near the catalytic pocket; defective HDAC activity.
    clinical_significance: LIKELY_PATHOGENIC
  - name: p.Ala110Thr
    description: >-
      c.328G>A; away from the catalytic pocket, retains HDAC activity but
      markedly disrupts NCoR-complex interaction and nuclear localisation.
    clinical_significance: LIKELY_PATHOGENIC
  - name: p.Pro201Ser
    description: >-
      c.601C>T; near the catalytic pocket; defective HDAC activity; mildest
      clinical presentation in the cohort.
    clinical_significance: LIKELY_PATHOGENIC
  - name: p.Leu266Ser
    description: >-
      c.797T>C; near the catalytic pocket; defective HDAC activity and impaired
      complex interaction and nuclear localisation.
    clinical_significance: LIKELY_PATHOGENIC
  - name: p.Gly267Ser
    description: >-
      c.799G>A; near the catalytic pocket; defective HDAC activity.
    clinical_significance: LIKELY_PATHOGENIC
  - name: p.Arg359Cys
    description: >-
      c.1075C>T; lies within the nuclear localisation signal; retains HDAC
      activity but impairs nuclear localisation.
    clinical_significance: LIKELY_PATHOGENIC
pathophysiology:
- name: HDAC3 De Novo Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo missense variants in HDAC3. Variant position
    determines which downstream functions are affected: residues near the
    catalytic pocket (Asp93, Pro201, Leu266, Gly267) impair deacetylase
    activity, whereas distal residues (Ala110, Arg359) chiefly disrupt
    corepressor-complex assembly and nuclear localisation.
  genetic_context:
    variant_origin: GERMLINE
  downstream:
  - target: HDAC3 Catalytic Deficiency
    causal_link_type: DIRECT
  - target: Disrupted CoREST and NCoR Corepressor Complex Integrity
    causal_link_type: DIRECT
  - target: HDAC3 Nuclear Mislocalization
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all located in evolutionarily conserved sites and confirmed as de novo"
    explanation: >-
      The initiating lesion: de novo missense variants at conserved residues.
- name: HDAC3 Catalytic Deficiency
  biological_scale: MOLECULAR
  description: >-
    Variants adjacent to the catalytic pocket reduce HDAC3 histone deacetylase
    activity, producing histone hyperacetylation (H3K9ac, H3K27ac, H3ac).
  molecular_functions:
  - preferred_term: histone deacetylase activity
    modifier: DECREASED
    term:
      id: GO:0004407
      label: histone deacetylase activity
  downstream:
  - target: Dysregulated Histone Acetylation and Transcriptional Derepression
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "variants near catalytic sites (p.Asp93Asn, p.Pro201Ser, p.Leu266Ser, and p.Gly267Ser) exhibited significantly dampened HDAC activity, while p.Ala110Thr and p.Arg359Cys variants did not"
    explanation: >-
      In vitro HDAC assays show catalytic-pocket variants reduce deacetylase
      activity.
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p.Gly267Ser and p.Leu266Ser variants show increased acetylation levels compared to the WT at H3K9, H3K27, and H3, indicating impaired histone deacetylation function"
    explanation: >-
      Cellular histone hyperacetylation is the direct readout of impaired HDAC3
      deacetylation.
- name: Disrupted CoREST and NCoR Corepressor Complex Integrity
  biological_scale: MOLECULAR
  description: >-
    Variants reduce HDAC3 interaction with the CoREST and NCoR corepressor
    complexes - universally with KDM1A (CoREST) and, for most variants, with
    NCoR1/2 - compromising the corepressor machinery independently of catalytic
    activity. HDAC3 acts through the NCoR/SMRT corepressors that drive
    transcriptional repression during brain development.
  downstream:
  - target: Dysregulated Histone Acetylation and Transcriptional Derepression
    causal_link_type: DIRECT
  - target: HDAC3 Nuclear Mislocalization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our experiments demonstrate that HDAC3 variants perturb interactions with the CoREST and NCoR complexes, particularly involving KDM1A and NCoR1/2, which we posit as a central pathogenic mechanism underlying the clinical findings observed in the affected individuals"
    explanation: >-
      Co-IP proteomics identifies corepressor-complex disruption as a central
      pathogenic mechanism.
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a universal disruption with KDM1A interaction was observed across all HDAC3 variants, implicating a critical role of the CoREST complex integrity in the disease mechanism"
    explanation: >-
      Loss of the KDM1A (CoREST) interaction is shared by all variants,
      including those retaining catalytic activity.
  - reference: PMID:40609820
    reference_title: "HDAC3 in neurodevelopmental disorders: Molecular mechanisms and targeted intervention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "HDAC3 interacts with nuclear receptor co-repressors such as NCoR and SMRT, which are important for transcriptional repression during brain development"
    explanation: >-
      Review synthesis situating HDAC3's corepressor role in brain development.
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "decreased interaction with AKAP8L may also contribute to microcephaly phenotypes in our subjects"
    explanation: >-
      The authors tie microcephaly to the variants' reduced complex/interactome
      binding (AKAP8L), consistent with microcephaly segregating with the
      complex-disruption variants (individuals 1 and 2) rather than the
      catalytic/migration group.
- name: HDAC3 Nuclear Mislocalization
  biological_scale: CELLULAR
  description: >-
    Impaired complex assembly and destabilisation reduce the
    nuclear-to-cytoplasmic ratio of HDAC3 for several variants, removing the
    deacetylase from its site of action in the nucleus.
  downstream:
  - target: Dysregulated Histone Acetylation and Transcriptional Derepression
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N/C ratios for p.Ala110Thr, p.Leu266Ser, and p.Arg359Cys variants are reduced in comparison to the WT, indicating a deficiency in nuclear localization"
    explanation: >-
      Immunofluorescence quantifies reduced nuclear localisation for these
      variants.
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "highlight protein mislocalization as a critical mechanism"
    explanation: >-
      The authors identify mislocalisation as a critical, catalysis-independent
      mechanism.
- name: Dysregulated Histone Acetylation and Transcriptional Derepression
  biological_scale: CELLULAR
  description: >-
    The three molecular lesions converge on loss of targeted histone
    deacetylation and derepression of HDAC3/corepressor-controlled genes.
    Disrupted complex interactions and mislocalisation may matter more than the
    catalytic defect itself.
  downstream:
  - target: Impaired Corticogenesis and Neuronal Migration
    causal_link_type: DIRECT
  - target: Abnormal Neurodevelopment
    causal_link_type: DIRECT
  - target: Hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal heart morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "disrupted interactions with multi-protein complexes and the mislocalization of the HDAC3 complex may play a more critical role than the defects in the catalytic function itself"
    explanation: >-
      Establishes that transcriptional dysregulation arises from complex
      disruption and mislocalisation, not catalysis alone.
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "knockdown of hdac3 in zebrafish showed reduced numbers of sensory hair cells and disrupted auditory organ development"
    explanation: >-
      Zebrafish hdac3 knockdown links HDAC3 loss to the hearing-impairment
      phenotype (background model evidence for this edge).
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "The essential role of HDAC3 in myocardial growth, as reported in a previous study, may explain the congenital heart disease observed in these two individuals"
    explanation: >-
      HDAC3's role in myocardial growth links its dysfunction to the congenital
      heart disease phenotype (background evidence for this edge).
- name: Impaired Corticogenesis and Neuronal Migration
  biological_scale: TISSUE
  description: >-
    HDAC3 is required for neuronal migration and cortical layering; its
    dysfunction disturbs corticogenesis, manifest in some individuals as gray
    matter heterotopia on brain MRI.
  downstream:
  - target: Gray matter heterotopia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39047730
    reference_title: "De novo missense variants in HDAC3 leading to epigenetic machinery dysfunction are associated with a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "This phenotypic association aligns with observations in Hdac3 conditional knockout mice, highlighting the role of HDAC3 in neuronal migration"
    explanation: >-
      Hdac3 conditional-knockout mice establish HDAC3's role in neuronal
      migration, paralleling the human heterotopia.
  - reference: PMID:40609820
    reference_title: "HDAC3 in neurodevelopmental disorders: Molecular mechanisms and targeted intervention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "HDAC3 dysfunction can lead to abnormalities in cortical layering and neuron subtype specification"
    explanation: >-
      Review synthesis linking HDAC3 dysfunction to cortical development defects.
- name: Abnormal Neurodevelopment
  biological_scale: ORGANISM
  description: >-
    Dysregulated neural transcriptional programs produce the core
    neurodevelopmental phenotype - intellectual disability, developmental delay,
    seizures and autistic behaviour.
  downstream:
  - target: Intellectual disability
    causal_link_type: DIRECT
  - target: Neurodevelopmental delay
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: DIRECT
  - target: Autistic behavior
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40609820
    reference_title: "HDAC3 in neurodevelopmental disorders: Molecular mechanisms and targeted intervention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "HDAC3 is also critical for neural differentiation and synaptic plasticity"
    explanation: >-
      Review synthesis of HDAC3's role in the neural processes whose disruption
      underlies the neurodevelopmental phenotype.

    reference_title: "Infections in patients with chronic adult T-cell leukemia/lymphoma: case report and review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adult T-cell leukemia/lymphoma (ATLL) is caused by the human T-cell
      lymphotropic virus type I (HTLV-I). ATLL is classified into the smoldering,
      chronic, lymphoma, and acute subtypes. We describe a North American woman

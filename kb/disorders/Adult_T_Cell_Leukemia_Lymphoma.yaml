name: Adult T-Cell Leukemia/Lymphoma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Adult T-cell leukemia/lymphoma (ATLL) is a mature peripheral T-cell neoplasm
  caused by persistent human T-lymphotropic virus type 1 (HTLV-1) infection.
  Only a minority of carriers develop ATL after a prolonged asymptomatic phase.
  Intermittent or early Tax signaling, persistent HBZ activity, and selected host
  somatic alterations cooperate in malignant CD4-positive T-cell expansion; Tax
  is therefore not modeled as the sole continuously expressed driver.
categories:
- Hematologic Malignancy
- T-Cell Lymphoma
- Virus-Associated Cancer
parents:
- T-cell leukemia
- T-cell lymphoma
has_subtypes:
- name: Acute ATLL
  description: >-
    The acute subtype had a median survival of 6.2 months in the original
    Shimoyama classification cohort.
  evidence:
  - reference: PMID:1751370
    reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MST was 6.2 months for acute type
    explanation: >-
      Shimoyama classification study confirms acute ATLL has median survival
      of 6.2 months, supporting the poor prognosis described.
- name: Lymphoma Type ATLL
  description: >-
    Lymphoma-type ATL is defined by histologically proven lymphadenopathy with
    no lymphocytosis and at most 1% abnormal circulating T lymphocytes.
  evidence:
  - reference: PMID:1751370
    reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphoma type, no lymphocytosis, 1% or less abnormal T-lymphocytes, and
      histologically-proven lymphadenopathy with or without extranodal lesions.
    explanation: >-
      Shimoyama classification defines lymphoma type by lymphadenopathy without
      significant blood involvement.
- name: Chronic ATLL
  description: >-
    The chronic subtype had a median survival of 24.3 months in the original
    Shimoyama classification cohort.
  evidence:
  - reference: PMID:1751370
    reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      24.3 months for chronic type
    explanation: >-
      Shimoyama study shows chronic type has median survival of 24.3 months,
      supporting the better prognosis described.
- name: Smoldering ATLL
  description: >-
    Smoldering ATL usually has at least 5% abnormal peripheral-blood T
    lymphocytes with a normal absolute lymphocyte level and no hypercalcemia.
    With fewer than 5% abnormal T lymphocytes, a histologically proven skin or
    pulmonary lesion is required.
  evidence:
  - reference: PMID:1751370
    reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Smouldering type, 5% or more abnormal lymphocytes of T-cell nature in PB,
      normal lymphocyte level (less than 4 x 10(9)/l), no hypercalcaemia
      (corrected calcium level less than 2.74 mmol/l), lactate dehydrogenase
      (LDH) value of up to 1.5 x the normal upper limit, no lymphadenopathy, no
      involvement of liver, spleen, central nervous system (CNS), bone and
      gastrointestinal tract, and neither ascites nor pleural effusion. Skin
      and pulmonary lesion(s) may be present. In case of less than 5% abnormal
      T-lymphocytes in PB, at least one of histologically-proven skin and
      pulmonary lesions should be present.
    explanation: >-
      Shimoyama classification defines the usual blood criteria and the
      histologically proven skin-or-lung exception when abnormal circulating T
      lymphocytes comprise less than 5%.
progression:
- phase: Persistent asymptomatic HTLV-1 carrier state
  notes: >-
    Most HTLV-1 carriers remain asymptomatic; a minority lose immune control and
    develop ATL after a prolonged carrier phase.
  evidence:
  - reference: DOI:10.3390/biom13101543
    reference_title: "Understanding the Immunopathology of HTLV-1-Associated Adult T-Cell Leukemia/Lymphoma: A Comprehensive Review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HTLV-1 carriers have a lifelong asymptomatic balance between infected
      cells and host antiviral immunity; however, 5–10% of carriers lose this
      balance and develop ATL.
    explanation: The review supports the prolonged carrier phase and minority progression to ATL.
- phase: Subtype-dependent clinical course
  notes: >-
    Clinical course differs substantially across acute, lymphoma, chronic, and
    smoldering ATL, with the original classification cohort showing shortest
    survival in acute disease and longer survival in chronic and smoldering disease.
  evidence:
  - reference: PMID:1751370
    reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MST was 6.2 months for acute type, 10.2 months for lymphoma type, 24.3
      months for chronic type, and not yet reached for smouldering type.
    explanation: The 818-patient classification cohort quantifies the subtype-dependent course.
infectious_agent:
- name: Human T-Lymphotropic Virus Type 1 (HTLV-1)
  infectious_agent_term:
    preferred_term: Human T-cell leukemia virus type I
    term:
      id: NCBITaxon:11908
      label: Human T-cell leukemia virus type I
  description: >-
    HTLV-1 is an oncoretrovirus transmitted vertically, horizontally, and through
    blood transfusion. It establishes persistent proviral infection of T cells;
    phase-specific Tax and persistent HBZ activity are represented separately in
    the causal graph.
  evidence:
  - reference: PMID:41553980
    reference_title: "CXCR3/CXCL10 Axis-Mediated T Cell Infiltration in the Lungs of Patients With HTLV-1-Associated Diseases: Implications for Subclinical Pulmonary Involvement."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "HTLV-1 is a retrovirus associated with adult T cell leukemia/lymphoma (ATL) and inflammatory diseases, including HTLV-1-associated myelopathy (HAM) and HTLV-1-associated bronchopneumonopathy (HAB)."
    explanation: This abstract explicitly links HTLV-1 to adult T-cell leukemia/lymphoma, supporting the infectious etiology.
  - reference: PMID:15129647
    reference_title: "HTLV-1 and associated adult T-cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This oncoretrovirus can be transmitted through 3 ways: horizontally,
      vertically (mother to child) and via blood transfusion.
    explanation: The review supports the stated transmission routes.
pathophysiology:
- name: Persistent HTLV-1 Proviral Infection
  conforms_to: "viral_oncogenesis#Persistent Oncogenic Virus Infection"
  description: >-
    Persistent HTLV-1 infection establishes clonally infected mature CD4-positive
    T cells. The provirus is integrated in ATL cells, while progression to
    malignancy occurs in only a minority of carriers.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: viral latency
    term:
      id: GO:0019042
      label: viral latency
    modifier: INCREASED
  downstream:
  - target: Phase-Specific Tax Signaling
    description: The integrated HTLV-1 pX region encodes the Tax regulatory protein.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15129647
      reference_title: "HTLV-1 and associated adult T-cell leukemia/lymphoma."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Tax is a 40-kDa phosphoprotein that is encoded by the pX region of the virus."
      explanation: This review identifies Tax as a protein encoded by integrated HTLV-1.
  - target: Persistent HBZ-Mediated Growth-Suppression Escape
    description: The proviral minus strand encodes HBZ, which remains expressed in ATL.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24359396
      reference_title: "HTLV-1 bZIP factor supports proliferation of adult T cell leukemia cells through suppression of C/EBPα signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The HTLV-1 bZIP factor (HBZ), which is encoded by minus strand of
        provirus, is expressed in all ATL cases and supports the proliferation
        of ATL cells.
      explanation: The study identifies provirus-encoded HBZ and its persistent expression in ATL.
  evidence:
  - reference: DOI:10.3389/fmicb.2020.01207
    reference_title: "Diagnostic Approaches and Established Treatments for Adult T Cell Leukemia Lymphoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HTLV-1 provirus is monoclonally integrated in ATL cells (Ohshima et al., 2017)."
    explanation: The clinical review supports clonal HTLV-1 proviral integration in ATL cells.
- name: Phase-Specific Tax Signaling
  conforms_to: "viral_oncogenesis#Viral Oncoprotein Expression and Genome Integration"
  description: >-
    Tax is an HTLV-1 regulatory protein whose expression is phase-specific and
    often not maintained uniformly in established ATL. In primary acute-type ATL
    cells cultured ex vivo, Tax expression tracks induction of NF-kappaB species.
  downstream:
  - target: Tax-Associated Canonical NF-kappaB Activation
    description: Tax induces nuclear NF-kappaB activity in acute-type primary ATL cells ex vivo.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10390192
      reference_title: "NF-kappaB involvement in the activation of primary adult T-cell leukemia cells and its clinical implications."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results suggest that Tax is capable of inducing nuclear expression
        of all four NF-kappaB species in primary ATL cells of acute type patients,
        with marked effects on p55, p75, and p85.
      explanation: Cultured primary ATL cells support Tax-dependent NF-kappaB induction in acute disease.
  evidence:
  - reference: PMID:10390192
    reference_title: "NF-kappaB involvement in the activation of primary adult T-cell leukemia cells and its clinical implications."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of c-rel and KBF1 mRNAs in acute type cells appeared to be
      related to Tax mRNA expression.
    explanation: Primary-cell culture data support phase-specific Tax signaling in acute ATL.
- name: Persistent HBZ-Mediated Growth-Suppression Escape
  conforms_to: "viral_oncogenesis#Viral Oncoprotein Expression and Genome Integration"
  description: >-
    HBZ is expressed from the HTLV-1 proviral minus strand and suppresses
    C/EBP-alpha-mediated growth restraint, supporting persistence and expansion
    of HTLV-1-infected cells even when Tax expression is not detectable.
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Malignant CD4-Positive T-Cell Clonal Expansion
    description: HBZ-mediated suppression of C/EBP-alpha growth restraint supports proliferation of infected cells.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - suppression of C/EBP-alpha-mediated cell-growth restraint
    evidence:
    - reference: PMID:24359396
      reference_title: "HTLV-1 bZIP factor supports proliferation of adult T cell leukemia cells through suppression of C/EBPα signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        HBZ, by suppressing C/EBPα signaling, supports the proliferation of
        HTLV-1 infected cells, which is thought to be critical for oncogenesis.
      explanation: Cell-based experiments identify C/EBP-alpha suppression as an intermediate growth mechanism.
  evidence:
  - reference: PMID:24359396
    reference_title: "HTLV-1 bZIP factor supports proliferation of adult T cell leukemia cells through suppression of C/EBPα signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, HBZ selectively modulated the expression of C/EBPα target genes,
      leading to the impairment of C/EBPα-mediated cell growth suppression.
    explanation: The experimental study directly supports the named HBZ growth-suppression mechanism.
- name: Tax-Associated Canonical NF-kappaB Activation
  conforms_to: "viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack"
  description: >-
    Tax can induce canonical NF-kappaB activity, especially in acute-type primary
    ATL cells cultured ex vivo. Activity differs by clinical subtype, so this is
    not modeled as a uniformly constitutive Tax signal in every established tumor.
  biological_processes:
  - preferred_term: positive regulation of NF-kappaB transcription factor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
  downstream:
  - target: Malignant CD4-Positive T-Cell Clonal Expansion
    description: NF-kappaB activity is associated with activation and proliferation of acute-type primary ATL cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:10390192
      reference_title: "NF-kappaB involvement in the activation of primary adult T-cell leukemia cells and its clinical implications."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Tax induction of NF-kappaB is presumed to be involved in proliferation
        and activation of primary leukemia cells in vivo.
      explanation: The source proposes this route, but the proliferative intermediates are not directly established.
  evidence:
  - reference: PMID:10390192
    reference_title: "NF-kappaB involvement in the activation of primary adult T-cell leukemia cells and its clinical implications."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Marked NF-kappaB activity was detected using an electrophoretic mobility
      shift assay (EMSA) in the primary cells of patients with acute disease, but
      little activity was noted in the cells of chronic patients.
    explanation: EMSA in primary ATL cells supports subtype-dependent NF-kappaB activation.
- name: TP53-Mutant Senescence Escape
  conforms_to: "viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack"
  description: >-
    Somatic TP53 sequence or copy-number alterations mark an adverse ATL subset.
    Under AZT exposure, functional and patient evidence shows that wild-type p53
    supports senescence and tumor-cell death, whereas mutated p53 is associated
    with treatment nonresponse and selection of an inactive-p53 clone at relapse.
    The modeled mechanism is explicitly bounded to this treatment context.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  biological_processes:
  - preferred_term: cellular senescence
    modifier: DECREASED
    term:
      id: GO:0090398
      label: cellular senescence
  downstream:
  - target: Malignant CD4-Positive T-Cell Clonal Expansion
    description: Failure of AZT-induced p53-dependent senescence permits persistence and selection of a mutant malignant clone.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failure of telomerase-inhibition-induced p53 reactivation, senescence, and tumor-cell death
    evidence:
    - reference: PMID:16569765
      reference_title: "Persistent inhibition of telomerase reprograms adult T-cell leukemia to p53-dependent senescence."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        While ATL patients carrying a wild-type p53 enter remission following
        treatment with AZT, those with a mutated p53 did not respond, and
        patients' disease relapse was associated with the selection of a tumor
        clone carrying mutated inactive p53.
      explanation: Patient response and relapse data support treatment-context persistence and selection of mutated-p53 ATL clones.
  evidence:
  - reference: PMID:16569765
    reference_title: "Persistent inhibition of telomerase reprograms adult T-cell leukemia to p53-dependent senescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report that enduring AZT treatment of T-cell leukemia virus
      I-infected cells, in vitro and in vivo in ATL patients, results in
      inhibition of telomerase activity, progressive telomere shortening, and
      increased p14(ARF) expression. In turn, this elicits stabilization and
      reactivation of the tumor suppressor p53-dependent transcription,
      increased expression of the cyclin-dependent kinase inhibitor p21(Waf1),
      and accumulation of p27(kip1), thereby inducing cellular senescence and
      tumor cell death.
    explanation: The functional study defines the AZT-to-p53-dependent-senescence mechanism in infected cells and patients.
  - reference: PMID:34405395
    reference_title: "Clinical significance of TP53 mutations in adult T-cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the entire cohort, median survival of patients with and without TP53
      mutations was 1·0 and 6·7 years respectively (P < 0·001).
    explanation: Human cohort data establish the adverse clinical association of TP53-altered ATL.
- name: Somatic CCR4 Gain-of-Function Signaling
  description: >-
    Recurrent truncating CCR4 variants impair receptor internalization and
    increase ligand-directed migration, PI3K-AKT signaling, and long-term growth
    in experimental ATL cells.
  genes:
  - preferred_term: CCR4
    term:
      id: hgnc:1605
      label: CCR4
  biological_processes:
  - preferred_term: cell migration
    term:
      id: GO:0016477
      label: cell migration
    modifier: INCREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Malignant CD4-Positive T-Cell Clonal Expansion
    description: CCR4 gain of function provides migration and growth advantages to the ATL clone.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired CCR4 internalization and enhanced CCL22-triggered PI3K-AKT signaling
    evidence:
    - reference: PMID:25488980
      reference_title: "Gain-of-function CCR4 mutations in adult T cell leukemia/lymphoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This mutant enhanced PI(3) kinase/AKT activation after receptor engagement
        by CCL22 in ATLL cells and conferred a growth advantage in long-term in
        vitro cultures.
      explanation: Functional experiments define the signaling and growth intermediates.
  evidence:
  - reference: PMID:25488980
    reference_title: "Gain-of-function CCR4 mutations in adult T cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CCR4 mutations were detected in 14/53 ATLL samples (26%) and consisted
      exclusively of nonsense or frameshift mutations that truncated the coding
      region at C329, Q330, or Y331 in the carboxy terminus.
    explanation: Patient-tumor sequencing establishes recurrent truncating somatic CCR4 mutations.
  - reference: PMID:25488980
    reference_title: "Gain-of-function CCR4 mutations in adult T cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functionally, the CCR4-Q330 nonsense isoform was gain-of-function because
      it increased cell migration toward the CCR4 ligands CCL17 and CCL22, in
      part by impairing receptor internalization.
    explanation: Functional assays establish gain of function and impaired internalization.
- name: Malignant CD4-Positive T-Cell Clonal Expansion
  conforms_to: "viral_oncogenesis#Malignant Transformation"
  description: >-
    Viral and host alterations converge on expansion of a mature activated
    CD4-positive malignant T-cell clone, producing leukemic, nodal, cutaneous,
    visceral, metabolic, and immunosuppressive manifestations that vary by
    clinical subtype.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Lymphocytosis
    description: Leukemic expansion produces peripheral-blood lymphocytosis in chronic ATL.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:1751370
      reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Chronic type, absolute lymphocytosis (4 x 10(9)/l or more) with T-lymphocytosis
        more than 3.5 x 10(9)/l
      explanation: The subtype criteria directly connect the leukemic presentation to lymphocytosis.
  - target: Lymphadenopathy
    description: Nodal malignant disease manifests as lymphadenopathy in lymphoma-type ATL.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:1751370
      reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lymphoma type, no lymphocytosis, 1% or less abnormal T-lymphocytes, and
        histologically-proven lymphadenopathy with or without extranodal lesions.
      explanation: The cohort establishes nodal disease occurrence but not every intervening tissue mechanism.
  - target: Skin Lesions
    description: ATL can involve skin and produce variable eruptions.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: ORPHA:86875
      reference_title: Adult T-cell leukemia/lymphoma
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Presentation is heterogeneous and is typically of aggressive leukemia or
        lymphoma, variable skin eruptions, and visceral organ involvement.
      explanation: Orphanet supports occurrence while the tissue route remains unresolved.
  - target: Hepatomegaly
    description: Visceral ATL can involve the liver and present with enlargement.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:1751370
      reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lymphadenopathy and involvement of liver, spleen, skin, and lung may be
        present
      explanation: The criteria support liver involvement but only indirectly support enlargement.
  - target: Splenomegaly
    description: Visceral ATL can involve the spleen and present with enlargement.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:1751370
      reference_title: "Diagnostic criteria and classification of clinical subtypes of adult T-cell leukaemia-lymphoma. A report from the Lymphoma Study Group (1984-87)."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lymphadenopathy and involvement of liver, spleen, skin, and lung may be
        present
      explanation: The criteria support spleen involvement but only indirectly support enlargement.
  - target: Hypercalcemia
    description: Aggressive ATL, especially acute disease, is associated with hypercalcemia.
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:24714244
      reference_title: "Hypercalcemic crisis due to adult T cell leukemia: a rare cause of paralytic ileus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hypercalcemia occurs in about 70% of patients with acute adult T cell leukemia."
      explanation: The clinical source supports the acute-subtype association; the causal route is not resolved.
  - target: Recurrent Opportunistic Infections
    description: Indolent ATL can be accompanied by multiple infections, although the intervening immune mechanism is unresolved.
    causal_link_type: UNKNOWN
    evidence:
    - reference: DOI:10.3389/fmicb.2020.01207
      reference_title: "Diagnostic Approaches and Established Treatments for Adult T Cell Leukemia Lymphoma"
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        These patients might experience multiple infections but can remain free
        of disease progression for many years
      explanation: The review supports multiple infections in indolent ATL but does not resolve the causal route from the malignant clone.
  evidence:
  - reference: DOI:10.1182/blood-2011-03-345702
    reference_title: "How I treat adult T-cell leukemia/lymphoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Adult T-cell leukemia/lymphoma (ATL) is an aggressive malignancy of mature
      activated T cells caused by human T-cell lymphotropic virus type I.
    explanation: The review supports the mature activated T-cell malignant endpoint.
histopathology:
- name: Flower-Cell Morphology of Malignant T Lymphocytes
  finding_term:
    preferred_term: Flower-cell morphology of malignant T lymphocytes
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  diagnostic: false
  description: >-
    Circulating malignant lymphoid cells can have markedly lobulated or indented
    nuclei, condensed chromatin, small or absent nucleoli, and agranular
    cytoplasm, producing the characteristic flower-cell appearance.
  evidence:
  - reference: DOI:10.3389/fmicb.2020.01207
    reference_title: "Diagnostic Approaches and Established Treatments for Adult T Cell Leukemia Lymphoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      exhibiting characteristic abnormal lymphoid cells with markedly lobulated,
      highly indented, or lobulated nuclei with condensed chromatin, small or
      absent nucleoli, and an agranular cytoplasm
    explanation: The diagnostic review defines the characteristic flower-cell morphology.


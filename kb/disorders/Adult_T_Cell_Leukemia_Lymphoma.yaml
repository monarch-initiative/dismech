- name: Soluble IL-2 Receptor (sIL-2R)
  presence: Elevated
  context: >-
    In a prospective cohort receiving mogamulizumab-containing treatment,
    higher baseline sIL-2R was an independent unfavorable prognostic factor for
    overall survival; this entry does not assert that sIL-2R directly measures
    tumor burden.
  evidence:
  - reference: DOI:10.1182/bloodadvances.2020003053
    reference_title: "Mogamulizumab for adult T-cell leukemia-lymphoma: a multicenter prospective observational study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariate analysis identified the clinical subtype (acute or lymphoma
      type), a higher sIL-2R level, and a lower percentage of CD2−CD19+ B cells
      in peripheral blood mononuclear cells as significant independent
      unfavorable prognostic factors for OS.
    explanation: The prospective treated cohort supports higher sIL-2R as an adverse prognostic biomarker.
genetic:
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: Recurrent somatic alteration linked to adverse prognosis and treatment-context clonal selection
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    TP53 sequence variants or copy-number alterations occurred in 67 of 177
    patients and were associated with substantially shorter median survival. A
    functional study linked mutated p53 to AZT nonresponse and selection of an
    inactive-p53 clone at relapse.
  evidence:
  - reference: PMID:34405395
    reference_title: "Clinical significance of TP53 mutations in adult T-cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, 67 of 177 patients harboured TP53 SNVs/indels or TP53 CNVs,
      and were categorized as having TP53 mutations.
    explanation: The cohort establishes recurrent tumor-associated TP53 alterations.
  - reference: PMID:34405395
    reference_title: "Clinical significance of TP53 mutations in adult T-cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the entire cohort, median survival of patients with and without TP53
      mutations was 1·0 and 6·7 years respectively (P < 0·001).
    explanation: The cohort supports the adverse association of TP53-altered ATL.
  - reference: PMID:16569765
    reference_title: "Persistent inhibition of telomerase reprograms adult T-cell leukemia to p53-dependent senescence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While ATL patients carrying a wild-type p53 enter remission following
      treatment with AZT, those with a mutated p53 did not respond, and
      patients' disease relapse was associated with the selection of a tumor
      clone carrying mutated inactive p53.
    explanation: Patient response and relapse data support mutated TP53 as a treatment-context selected somatic driver.
- name: CCR4
  gene_term:
    preferred_term: CCR4
    term:
      id: hgnc:1605
      label: CCR4
  association: Recurrent somatic gain-of-function mutation in a subset of ATL
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Truncating CCR4 variants occurred in 14 of 53 samples and experimentally
    increased ligand-directed migration and PI3K-AKT signaling. CCR4 expression,
    rather than mutation status, is the treatment-selection concept for
    mogamulizumab in the cited trial.
  evidence:
  - reference: PMID:25488980
    reference_title: "Gain-of-function CCR4 mutations in adult T cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CCR4 mutations were detected in 14/53 ATLL samples (26%) and consisted
      exclusively of nonsense or frameshift mutations that truncated the coding
      region at C329, Q330, or Y331 in the carboxy terminus.
    explanation: Patient-tumor sequencing establishes recurrent truncating CCR4 variants.
  - reference: PMID:25488980
    reference_title: "Gain-of-function CCR4 mutations in adult T cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functionally, the CCR4-Q330 nonsense isoform was gain-of-function because
      it increased cell migration toward the CCR4 ligands CCL17 and CCL22, in
      part by impairing receptor internalization.
    explanation: Functional assays establish gain of function for a recurrent truncating isoform.
  - reference: PMID:26437031
    reference_title: "Integrated molecular analysis of adult T cell leukemia/lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other notable features include a predominance of activating mutations (in
      PLCG1, PRKCB, CARD11, VAV1, IRF4, FYN, CCR4 and CCR7) and gene fusions
      (CTLA4-CD28 and ICOS-CD28).
    explanation: Integrated profiling of 426 ATL cases independently identifies CCR4 among recurrent activating alterations.

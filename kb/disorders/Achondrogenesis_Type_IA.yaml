  - Ribs are short but usually not fractured in type II.
  evidence:
  - reference: PMID:31523626
    reference_title: "Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Skull ossification is normal in ACG2, alongside decreased ossification in the

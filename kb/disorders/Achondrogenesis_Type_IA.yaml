      label: odontochondrodysplasia 1
  description: >-
    The non-lethal TRIP11 phenotype from a null allele in trans with a
    partially functional splice allele. Severe early cases resemble ACG1A on
    radiographs.
  distinguishing_features:
  - Residual GMAP protein, preserved Golgi organization and normal global secretion in patient cells.

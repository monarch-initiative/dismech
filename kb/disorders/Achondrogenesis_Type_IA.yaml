    explanation: Skull ossification separates type II from type IA.
- name: Greenberg dysplasia (LBR-related ACG1A phenocopy)
  disease_term:
    preferred_term: Greenberg dysplasia
    term:
      id: MONDO:0008974
      label: Greenberg dysplasia
  description: >-
    A homozygous LBR splice-site variant has produced the ACG1A phenotype, with the
    same Golgi disruption and secretory defect in patient cells. A fetus with the
    ACG1A phenotype and no TRIP11 variant should be tested for LBR.
  distinguishing_features:
  - Molecular testing (LBR rather than TRIP11).
  evidence:
  - reference: PMID:30518689
    reference_title: "A common pathomechanism in GMAP-210- and LBR-related diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now find that a homozygous splice-site mutation of the lamin B receptor
      (LBR) gene results in the same phenotype.
    explanation: Establishes LBR as a genetic phenocopy of ACG1A.
- name: Odontochondrodysplasia
  disease_term:
    preferred_term: odontochondrodysplasia 1
    term:
      id: MONDO:0100325
      label: odontochondrodysplasia 1
  description: >-
    An allelic TRIP11-related skeletal dysplasia associated with residual GMAP protein function
    and often postnatal survival with dental and skeletal abnormalities. The same hypomorphic
    variants can produce early lethal or milder phenotypes, so variant class alone does not
    reliably separate the disorders.
  distinguishing_features:
  - Residual GMAP protein and partially preserved Golgi function in studied patient cells.
  - Dentinogenesis imperfecta in surviving patients; survival and severity remain variable.
  evidence:
  - reference: PMID:30728324
    reference_title: "Hypomorphic mutations of TRIP11 cause odontochondrodysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that ODCD is caused by hypomorphic TRIP11 mutations, and we
      identify ODCD as the nonlethal counterpart to achondrogenesis 1A (ACG1A), the
      known null phenotype in humans.
    explanation: Places ODCD and ACG1A on one allelic series.
  - reference: PMID:30728324
    reference_title: "Hypomorphic mutations of TRIP11 cause odontochondrodysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In spite of reduced abundance, residual GMAP variants maintain partial Golgi
      integrity, normal global protein secretion, and subcellular distribution of
      IFT20 in ODCD. These functions are lost when GMAP-210 is completely
      abrogated in ACG1A.
    explanation: The cellular features that distinguish ODCD from ACG1A.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the very same hypomorphic mutations may lead to both early lethal disease and milder ODCD.
    explanation: >-
      Clinical variability limits a strict lethal-versus-nonlethal distinction.

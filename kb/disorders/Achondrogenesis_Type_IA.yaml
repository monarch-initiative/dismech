  biological_scale: CELLULAR
  description: >-
    In Trip11-null mice, chondrocytes retain perlecan but not type II collagen or aggrecan in
    vivo. In primary mouse chondrocyte pellet cultures, CHADL was the only extracellular matrix
    protein with increased intracellular abundance surviving multiple-testing correction.
    Perlecan, COL9A2, aggrecan, matrilin 4 and nidogen 2 increased in unadjusted comparisons,
    while nidogen 1 and decorin decreased; perlecan and COL9A2 retention was also confirmed by
    immunoblotting. These findings support cargo selectivity, with differing statistical
    strength across proteins.

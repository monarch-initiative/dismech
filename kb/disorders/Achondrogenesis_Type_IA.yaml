- discussion_id: acg1a_ciliary_involvement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of IFT20 Anchoring at the Golgi
  - pathophysiology#Variable Primary Cilium Abnormalities
  prompt: >-
    Does loss of GMAP-210 impair primary cilia in ACG1A, and does this contribute
    to the phenotype?
  rationale: >-
    Golgi IFT20 dispersal is established, but the 2019 patient-cell study found normal ciliary
    morphology, length and IFT20 targeting. It could not assess transport of relevant ciliary
    cargoes. The 2021 deep-intronic-variant study instead found reduced ciliogenesis and shorter
    cilia. Differences in alleles, cell lines or culture conditions remain possible explanations
    rather than demonstrated causes.
  evidence:
  - reference: PMID:34057271
    reference_title: "Biallelic deep intronic variant c.5457+81T>A in TRIP11 causes loss of function and results in achondrogenesis 1A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further, we observed a significant reduction in the frequency of ciliated cells and in the
      length of primary cilia in subject-derived cell lines
    explanation: >-
      Reduced ciliogenesis was reported in cells carrying the deep intronic allele.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      cilia in GMAP-210–deficient fibroblasts had normal length and exhibited no structural
      abnormalities. Furthermore, ciliary targeting of IFT20 itself was normal in ODCD and
      ACG1A, in spite of its partial, or complete, dispersal from the Golgi.
    explanation: >-
      Normal ciliary morphology and IFT20 localization in the earlier patient-cell study.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we were unable to assess a potential functional defect of primary cilia in TRIP11-mutant
      human cells
    explanation: >-
      Normal morphology did not establish normal ciliary cargo export.
notes: >-
  No GeneReviews chapter for achondrogenesis type IA was found: a PubMed search for
  (achondrogenesis[TI] OR TRIP11[TIAB]) AND (genereviews[book] OR
  statpearls[book]) returned a single record, the GeneReviews chapter
  Achondrogenesis Type 1B, which covers the SLC26A2 disease and is therefore not
  a baseline for this entry. The Orphanet record for this subtype
  is ORPHA:93299 (MONDO xref); ORPHA:932 is the achondrogenesis group. A
  clinically diagnosed family reported as a new subtype with non-recessive
  segregation (PMID:30951048) has no molecular confirmation.

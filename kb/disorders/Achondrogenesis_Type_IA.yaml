histopathology:
- name: Vacuolated Chondrocytes with Cytoplasmic Inclusion Bodies
  description: >-
    Cartilage shows a hypercellular resting zone, round, vacuolated, slightly
    enlarged chondrocytes with cytoplasmic inclusion bodies, and no column
    formation in proliferative cartilage. This pattern separates type IA from
    type IB, in which collagen rings surround the chondrocytes.
  diagnostic: true
  evidence:
  - reference: PMID:3275766
    reference_title: "Achondrogenesis type I: delineation of further heterogeneity and identification of two distinct subgroups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One group had round vacuolated chondrocytes with inclusion bodies; the other
      had collagenous rings around the chondrocytes.
    explanation: >-
      The histological criterion that, together with the radiographic grouping,
      defines type IA.
  - reference: PMID:29872333
    reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      demonstrated hypercellularity of bone and myxoid cartilage matrix;
      cytoplasmic inclusions were noted
    explanation: The same chondrocyte inclusions in a molecularly confirmed fetus.
progression:
- phase: Prenatal onset
  age_range: Prenatal; detected at 14 weeks in the reported case
  notes: >-
    In the molecularly confirmed Colombian fetus, short extremities and increased
    nuchal translucency were seen at 14 weeks and a narrow thorax with severe
    limb shortening at 20 weeks.
  evidence:
  - reference: PMID:29872333
    reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ultrasound examination results at a gestational age (GA) of 14 weeks
      revealed fetal nuchal translucency of 4.3 mm, a normal thorax, and short
      extremities
    explanation: Limb shortening and increased nuchal translucency were detected at 14 weeks in this fetus.
- phase: Perinatal lethality
  age_range: Fetal period to the first hours after birth
  notes: >-
    Affected fetuses die in utero or shortly after birth. Recorded here rather
    than as a phenotype because the HPO death terms (HP:0003826 Stillbirth,
    HP:0003811 Neonatal death) sit under HP:0040006 Mortality/Aging, outside the
    HP:0000118 root of the PhenotypeTerm enum (runoak -i sqlite:obo:hp ancestors
    HP:0003826 -p i).
  evidence:
  - reference: PMID:29872333
    reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Affected individuals die in utero or shortly after birth.
    explanation: States the perinatal lethal course.
  - reference: PMID:29872333
    reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following delivery, the fetus manifested shortness of breath and died after
      a few minutes.
    explanation: Death within minutes of birth in a molecularly confirmed case.
diagnosis:
- name: Prenatal Ultrasound
  description: >-
    Ultrasound detected short extremities and increased nuchal translucency at 14 weeks in the
    2018 fetus, followed by a narrow thorax and severe limb shortening at 20 weeks. These
    findings suggest a lethal skeletal dysplasia without determining its molecular subtype.
  diagnosis_term:
    preferred_term: fetal ultrasound imaging
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:29872333
    reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A diagnosis of lethal skeletal dysplasia was suggested.
    explanation: Ultrasound findings raised a lethal skeletal dysplasia before molecular testing.
- name: Exome Sequencing of Fetal DNA
  description: >-
    Exome sequencing of amniotic-fluid DNA identified two TRIP11 frameshift variants prenatally
    in the 2018 case. Deep intronic variants may be missed by exon-focused analysis; the
    c.5457+81T>A report demonstrates a splice-altering intronic allele, making assay coverage
    and RNA follow-up relevant when routine testing is unrevealing.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:29872333
    reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: WES of amniotic fluid revealed a diagnosis of ACG1A.
    explanation: Prenatal molecular diagnosis by exome sequencing.
  - reference: PMID:34057271
    reference_title: "Biallelic deep intronic variant c.5457+81T>A in TRIP11 causes loss of function and results in achondrogenesis 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings illustrate how pathogenic variants in intronic regions of TRIP11
      can impact transcript splicing, expression, and activity, resulting in ACG1A.
    explanation: Intronic alleles cause ACG1A, a limitation of exome-only testing.
- name: Postmortem Skeletal Radiography and Cartilage Histology
  description: >-
    Radiographs showing absent skull and vertebral ossification with fractured
    ribs, together with vacuolated chondrocytes with inclusion bodies, separate
    type IA from type IB and type II.
  diagnosis_term:
    preferred_term: histopathologic examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:3275766
    reference_title: "Achondrogenesis type I: delineation of further heterogeneity and identification of two distinct subgroups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two distinct chondroosseous morphologic patterns were observed that directly
      correlated with the radiographic grouping.
    explanation: Histology and radiology together define the subtype.
differential_diagnoses:
- name: Achondrogenesis type IB
  disease_term:

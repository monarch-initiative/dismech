    explanation: Radiographic distinction in skull ossification.
  - reference: PMID:3275766
    reference_title: "Achondrogenesis type I: delineation of further heterogeneity and identification of two distinct subgroups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One group had round vacuolated chondrocytes with inclusion bodies; the other
      had collagenous rings around the chondrocytes.
    explanation: Histological distinction.
- name: Achondrogenesis type II
  disease_term:
    preferred_term: achondrogenesis type II
    term:
      id: MONDO:0008702
      label: achondrogenesis type II
  description: COL2A1-related achondrogenesis.
  distinguishing_features:

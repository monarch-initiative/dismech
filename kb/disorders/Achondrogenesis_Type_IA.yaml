name: Achondrogenesis Type IA
creation_date: "2026-09-24T20:42:38Z"
category: Mendelian
description: >-
  Achondrogenesis type IA (ACG1A; Houston-Harris type; OMIM  # 200600) is an autosomal recessive,
  perinatally lethal chondrodysplasia caused by biallelic loss-of-function variants in TRIP11,
  which encodes the Golgi vesicle tether GMAP-210. Affected fetuses have severe limb shortening,
  a narrow thorax, short ribs prone to fracture, and deficient skull, vertebral and pelvic
  ossification. Patient-derived cells show near-complete GMAP-210 loss, disruption of Golgi
  architecture, reduced secretion, abnormal glycan processing and impaired terminal chondrocyte
  differentiation. ER stress and premature chondrocyte death are prominent in mouse models but
  were not reproduced in human fibroblast-derived chondrogenic cultures. ACG1A lies at the
  severe end of a TRIP11-related skeletal dysplasia spectrum that includes
  odontochondrodysplasia; residual protein function influences severity, but genotype alone does
  not reliably predict survival.
disease_term:
  preferred_term: Achondrogenesis Type IA
  term:
    id: MONDO:0008701
    label: achondrogenesis type IA
synonyms:
- ACG1A
- Achondrogenesis type 1A
- Achondrogenesis, Houston-Harris type
- Houston-Harris achondrogenesis
- TRIP11-related achondrogenesis
parents:
- Achondrogenesis
- Severe Spondylodysplastic Dysplasia
- TRIP11-Related Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: severe_spondylodysplastic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 14 "Severe spondylodysplastic dysplasias", which
      lists achondrogenesis type 1A (TRIP11) alongside Schneckenbecken dysplasia,
      SMD Sedaghatian type and opsismodysplasia. MONDO places MONDO:0008701 under
      MONDO:0800080 severe spondylodysplastic dysplasia. The allelic
      odontochondrodysplasia is classified separately in group 12.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or birth-prevalence estimate specific to
    type IA was found. The Orphanet birth-prevalence figure for achondrogenesis
    (ORPHA:932, 1-9 per 100,000 in France) covers all achondrogenesis types and
    is not assigned to this subtype. The molecular literature consists of case
    reports and small series; the gene-discovery study sequenced ten unrelated
    patients.
  evidence:
  - reference: PMID:29872333
    reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, few cases of this osteodysplasia have been described."
    explanation: >-
      A case report's own statement that the condition is known from few
      published cases, which is the basis for the qualitative ultra-rare tier.
  - reference: PMID:20089971
    reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis revealed loss-of-function mutations in the 10 unrelated
      patients with achondrogenesis type 1A whom we studied.
    explanation: >-
      The gene-discovery series comprised ten unrelated patients, an order of
      magnitude consistent with an ultra-rare disorder.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected fetuses are homozygous or compound heterozygous for TRIP11
    loss-of-function alleles, and parents are heterozygous carriers. One
    clinically and histologically diagnosed Mexican family without molecular
    testing was argued to be incompatible with recessive segregation; that
    report is recorded below as refuting evidence but does not establish another
    mode of inheritance for the TRIP11-defined disease.
  evidence:
  - reference: PMID:23956106
    reference_title: "The phenotype range of achondrogenesis 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Achondrogenesis 1A (ACG1A; OMIM 200600) is an autosomal recessive
      perinatally lethal skeletal dysplasia comprising intrauterine growth
      failure, micromelia, minor facial anomalies, deficient ossification of the
      skull, absent or extremely defective spinal ossification, short beaded ribs,
      and short deformed long bones with a stellate appearance.
    explanation: States autosomal recessive inheritance of ACG1A.
  - reference: PMID:23956106
    reference_title: "The phenotype range of achondrogenesis 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study we describe dizygotic twins with a clinical and radiological
      phenotype of ACG1A who were homozygous for a novel nonsense mutation in the
      TRIP11 gene.
    explanation: Homozygosity in affected twins is consistent with recessive inheritance.
  - reference: PMID:29872333
    reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      were inherited from the mother and father, respectively
    explanation: >-
      The fetus carried two different TRIP11 frameshift alleles, one inherited
      from each unaffected parent (compound heterozygosity).
  - reference: PMID:30951048
    reference_title: "New subtype of familial achondrogenesis type IA (Houston-Harris)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Statistical analysis in at least 4 families previously described, including
      this family case showed significant differences between expected and
      observed number of members, being incongruent with an autosomal recessive
      mode of inheritance previously reported.
    explanation: >-
      A segregation argument against recessive inheritance from a family with four
      affected pregnancies. The diagnosis was clinical, radiological and
      histological, with no TRIP11 testing reported in the abstract, so it does
      not bear directly on the molecularly defined disease.
genetic:
- name: TRIP11
  gene_term:
    preferred_term: TRIP11
    term:
      id: hgnc:12305
      label: TRIP11
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported ACG1A alleles include nonsense and frameshift variants, a deletion of the 3' end of
    TRIP11, and a deep intronic splice variant. Studied patient cells show marked reduction or
    near-complete loss of GMAP-210. Hypomorphic splice alleles can preserve low amounts of
    functional protein and cause odontochondrodysplasia, but the same hypomorphic variants have
    been associated with both early lethal and milder disease within families. A rigid
    null-versus-hypomorphic rule does not reliably predict clinical outcome.
  variants:
  - name: Nonsense and frameshift variants
    description: >-
      Truncating variants, homozygous or compound heterozygous, predicted to
      undergo nonsense-mediated decay.
    evidence:
    - reference: PMID:29872333
      reference_title: "Achondrogenesis type 1A: clinical, histologic, molecular, and prenatal ultrasound diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both variants created a reading frameshift leading to a premature stop
        codon and loss of protein function.
      explanation: Two frameshift alleles in a fetus with ACG1A.
  - name: Deletion of the 3' end of TRIP11
    description: >-
      Found in trans with a nonsense variant in a patient whose phenotype was
      milder than classic ACG1A.
    evidence:
    - reference: PMID:23956106
      reference_title: "The phenotype range of achondrogenesis 1A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, another patient with a milder manifestation, not readily
        distinguishable from those of other lethal skeletal dysplasias, was found
        to be a compound heterozygote for a nonsense mutation and a deletion of the
        3' end of the TRIP11 gene.
      explanation: Documents a partial gene deletion allele and the wider phenotypic range.
  - name: c.5457+81T>A deep intronic variant
    description: >-
      Homozygous in four fetuses from two families; creates aberrant splicing
      with retention of 77 bp of intron 18.
    evidence:
    - reference: PMID:34057271
      reference_title: "Biallelic deep intronic variant c.5457+81T>A in TRIP11 causes loss of function and results in achondrogenesis 1A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Affected fetuses in both families are homozygous for the deep intronic
        TRIP11 variant, c.5457+81T>A, which was found in a shared region of
        homozygosity.
      explanation: Establishes a noncoding ACG1A allele missed by exon-only analysis.
    - reference: PMID:34057271
      reference_title: "Biallelic deep intronic variant c.5457+81T>A in TRIP11 causes loss of function and results in achondrogenesis 1A."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This variant was found to cause aberrant transcript splicing and the
        retention of 77 base pairs of intron 18.
      explanation: RNA analysis shows the splicing consequence of the intronic variant.
  evidence:
  - reference: PMID:20089971
    reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis revealed loss-of-function mutations in the 10 unrelated
      patients with achondrogenesis type 1A whom we studied.
    explanation: Gene discovery for ACG1A in ten unrelated patients.
  - reference: PMID:31903676
    reference_title: "Pathogenic variants in the TRIP11 gene cause a skeletal dysplasia spectrum from odontochondrodysplasia to achondrogenesis 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It is known that null mutations in TRIP11 disrupt Golgi function and cause a
      lethal skeletal dysplasia known as achondrogenesis type 1A (ACG1A)
    explanation: States the null-allele basis of ACG1A within the TRIP11 spectrum.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the very same hypomorphic mutations may lead to both early lethal disease and milder ODCD.
    explanation: >-
      The allelic series is clinically variable; residual function does not guarantee postnatal survival.
pathophysiology:
- name: Biallelic TRIP11 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Two TRIP11 null alleles, most often truncating, cause loss of TRIP11 mRNA by
    nonsense-mediated decay or aberrant splicing.
  genes:
  - preferred_term: TRIP11
    term:
      id: hgnc:12305
      label: TRIP11
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:20089971
    reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis revealed loss-of-function mutations in the 10 unrelated
      patients with achondrogenesis type 1A whom we studied.
    explanation: Loss-of-function TRIP11 variants in every patient studied.
  downstream:
  - target: Loss of GMAP-210 Protein
    causal_link_type: DIRECT
    description: >-
      Truncating and splice alleles leave transcript and protein at or below the
      limit of detection in patient cells.
    evidence:
    - reference: PMID:34057271
      reference_title: "Biallelic deep intronic variant c.5457+81T>A in TRIP11 causes loss of function and results in achondrogenesis 1A."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The TRIP11 messenger RNA and protein levels were drastically reduced in
        fibroblast cells derived from one of the affected fetuses.
      explanation: Shows the allele-to-protein step in patient-derived fibroblasts.
- name: Loss of GMAP-210 Protein
  biological_scale: MOLECULAR
  description: >-
    GMAP-210 is markedly reduced or below immunodetection in studied ACG1A patient cells. This
    cis-Golgi golgin tethers transport vesicles and anchors the Golgi pool of IFT20.
    Near-complete protein loss disrupts Golgi organization and reduces secretory efficiency; it
    does not abolish every Golgi function or all protein secretion.
  genes:
  - preferred_term: TRIP11
    term:
      id: hgnc:12305
      label: TRIP11
  cellular_components:
  - preferred_term: cis-Golgi network
    term:
      id: GO:0005801
      label: cis-Golgi network
  evidence:
  - reference: PMID:34057271
    reference_title: "Biallelic deep intronic variant c.5457+81T>A in TRIP11 causes loss of function and results in achondrogenesis 1A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The TRIP11 messenger RNA and protein levels were drastically reduced in
      fibroblast cells derived from one of the affected fetuses.
    explanation: GMAP-210 protein is drastically reduced in ACG1A patient fibroblasts.
  - reference: PMID:20089971
    reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Affected mice had a nonsense mutation in the thyroid hormone receptor
      interactor 11 gene (Trip11), which encodes the Golgi microtubule-associated
      protein 210 (GMAP-210); the affected mice lacked this protein.
    explanation: The Trip11 nonsense mouse likewise lacks the protein.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GMAP-specific bands remained at or below the detection limit in ACG1A, indicating
      near-complete loss of the protein
    explanation: >-
      Patient-cell immunoblotting supports near-complete loss, rather than a claim of
      universally zero protein.
  downstream:
  - target: Loss of Golgi Cisternal Stack Architecture
    causal_link_type: DIRECT
    description: >-
      Without GMAP-210 the stacked cisternae of the Golgi are lost in patient
      fibroblasts, and Golgi architecture is disturbed across mouse tissues.
    evidence:
    - reference: PMID:30518689
      reference_title: "A common pathomechanism in GMAP-210- and LBR-related diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Golgi ultrastructure was severely disrupted in TRIP11-mutant cells and
        compartment-specific markers demonstrated that loss of GMAP-210 not only
        affected the cis-Golgi, but caused compaction of the whole organelle.
      explanation: Patient cells lacking GMAP-210 lose Golgi ultrastructure beyond the cis-Golgi.
  - target: Impaired Early Secretory Pathway Trafficking
    causal_link_type: DIRECT
    description: >-
      GMAP-210 acts at the ER-Golgi intermediate compartment and cis-Golgi in
      anterograde traffic and is needed for retrograde traffic to the ER.
    evidence:
    - reference: PMID:25717001
      reference_title: "The golgin GMAP-210 is required for efficient membrane trafficking in the early secretory pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        GMAP-210 acts at both the endoplasmic reticulum (ER)-to-Golgi intermediate
        compartment (ERGIC) and Golgi complex during anterograde trafficking, and is
        also required for retrograde trafficking to the ER.
      explanation: >-
        Depletion studies in cultured cells locate the trafficking steps that need
        GMAP-210.
  - target: Loss of IFT20 Anchoring at the Golgi
    causal_link_type: DIRECT
    description: >-
      Loss of GMAP-210 disperses IFT20 from the Golgi. This does not imply loss of IFT20
      targeting to the primary cilium.
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both exogenous full-length GMAP-210 and shorter GMAP variants lacking exons 4 or 9
        restored IFT20 Golgi anchoring when overexpressed in ACG1A patient–derived cells
      explanation: >-
        Rescue by GMAP constructs supports a direct role in Golgi anchoring of IFT20; this is a
        cell experiment, not a tested treatment.
  - target: Cranial Osteogenic Cell ER Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neural crest-specific Trip11 deletion produces this phenotype in mice; the intervening
      molecular steps are incompletely defined.
    evidence:
    - reference: PMID:35147267
      reference_title: Disruption of Trip11 in cranial neural crest cells is associated with increased ER and Golgi stress contributing to skull defects in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the expression levels of Atf4, Bip and Chop were significantly increased in Trip11 cKO
        skulls compared with controls
      explanation: >-
        ER stress-marker expression in neural crest-derived mouse skull tissue.
  - target: Cranial Osteogenic Cell Golgi Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neural crest-specific Trip11 deletion produces this phenotype in mice; the intervening
      molecular steps are incompletely defined.
    evidence:
    - reference: PMID:35147267
      reference_title: Disruption of Trip11 in cranial neural crest cells is associated with increased ER and Golgi stress contributing to skull defects in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the expression levels of Golga2, Golgb1, Acbd3, Arf4, Cth, Slc7a1 and Slc7a11 were
        significantly increased in Trip11 cKO skulls compared with controls
      explanation: >-
        Golgi-stress-associated gene expression in the neural crest-specific mouse knockout.
  - target: Reduced Cranial Osteoblast Collagen Secretion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neural crest-specific Trip11 deletion produces this phenotype in mice; the intervening
      molecular steps are incompletely defined.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC8276989/
      reference_title: The molecular complex of ciliary and golgin protein is crucial for skull development - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Western blot analysis confirmed that intracellular collagen ... cKO osteoblasts remained
        much longer than in controls
      explanation: >-
        Yamaguchi et al. (2021), PMID:34128978. Prolonged intracellular collagen retention in
        mouse osteoblast cultures.
- name: Loss of Golgi Cisternal Stack Architecture
  biological_scale: CELLULAR
  description: >-
    The cisternal stack is lost and the Golgi is compacted in ACG1A fibroblasts.
    A homozygous LBR splice variant that phenocopies ACG1A produces the same
    Golgi disruption, which supports the Golgi, not a GMAP-210-specific partner,
    as the point of convergence.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  biological_processes:
  - preferred_term: Golgi organization
    modifier: DECREASED
    term:
      id: GO:0007030
      label: Golgi organization
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:34057271
    reference_title: "Biallelic deep intronic variant c.5457+81T>A in TRIP11 causes loss of function and results in achondrogenesis 1A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using immunofluorescence we also detected highly compacted Golgi apparatus
      in affected fibroblasts.
    explanation: Golgi compaction in fibroblasts from a fetus with the deep intronic allele.
  - reference: PMID:20089971
    reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Golgi architecture was disturbed in multiple tissues, including cartilage.
    explanation: Golgi disruption in vivo in the Trip11 mutant mouse, including cartilage.
  - reference: PMID:30518689
    reference_title: "A common pathomechanism in GMAP-210- and LBR-related diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, we discovered a common disruption of Golgi apparatus architecture
      that was accompanied by decreased secretory trafficking in both cases.
    explanation: >-
      Patient cells from ACG1A and the LBR phenocopy share the Golgi lesion and the
      secretory defect.
  downstream:
  - target: Defective Golgi Glycan Processing
    causal_link_type: DIRECT
    description: >-
      Golgi-dependent glycosylation fails; the lysosomal membrane glycoproteins
      LAMP1 and LAMP2 are hypoglycosylated in ACG1A patient fibroblasts.
    evidence:
    - reference: PMID:30518689
      reference_title: "A common pathomechanism in GMAP-210- and LBR-related diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Glycosylation of LAMP1 and LAMP2 was assessed by Western blot, and
        demonstrated aberrant electrophoretic mobility patterns in all ACG1A cells
      explanation: Aberrant LAMP glycosylation in every ACG1A cell line tested.
    - reference: PMID:30518689
      reference_title: "A common pathomechanism in GMAP-210- and LBR-related diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Deficiency of Golgi-dependent glycan processing indicated a similar
        downstream effect of the disease-causing mutations upon Golgi function.
      explanation: Links the Golgi architectural lesion to deficient glycan processing.
- name: Impaired Early Secretory Pathway Trafficking
  biological_scale: CELLULAR
  description: >-
    Pulse-chase measurements in ACG1A patient fibroblasts found total secretory output reduced
    to approximately 50% of controls. Pro-COL1A1 secretion was also impaired. ODCD fibroblasts
    retained normal bulk secretion despite defects in specific cargoes. Mouse chondrocyte
    experiments similarly identify cargo-selective changes, so fibroblast bulk output should not
    be treated as a measurement of every cartilage protein. In HeLa-cell depletion experiments,
    GM130 partially compensated for anterograde ER-to-Golgi trafficking, but not retrograde
    Golgi-to-ER trafficking; this redundancy has not been demonstrated in patient chondrocytes.
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  - preferred_term: protein secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with WT controls, the secretory output of ACG1A fibroblasts was reduced to
      approximately 50% at all time points
    explanation: >-
      Primary human fibroblast pulse-chase assay measured reduced but substantial residual
      global secretion.
  - reference: PMID:25717001
    reference_title: "The golgin GMAP-210 is required for efficient membrane trafficking in the early secretory pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we re-investigated the trafficking role of GMAP-210, and found that it
      is indeed required for efficient trafficking in the secretory pathway.
    explanation: GMAP-210 depletion impairs secretory trafficking in cultured cells.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the levels of procollagen, type 1, α-1 (pro-COL1A1) secreted by patient-derived
      fibroblasts were reduced compared with controls but were still significantly higher than
      in ACG1A
    explanation: >-
      Both disorders show selective cargo impairment, with greater reduction in ACG1A.
  - reference: PMID:25717001
    reference_title: The golgin GMAP-210 is required for efficient membrane trafficking in the early secretory pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GMAP-210 and GM130 are partially redundant with regard to anterograde ER to Golgi
      transport, but not for retrograde trafficking, which is dependent upon GMAP-210 but not
      GM130.
    explanation: >-
      Double-depletion experiments show directional and cell-context limits of golgin
      redundancy; this is not an established clinical modifier.
  downstream:
  - target: Retention of Selected Cartilage Matrix Cargoes in Chondrocytes
    causal_link_type: DIRECT
    description: >-
      In chondrocytes, loss of GMAP-210 impairs transport of particular
      extracellular matrix proteins, perlecan among them, which accumulate inside
      the cell.
    evidence:
    - reference: PMID:29180569
      reference_title: "The skeletal phenotype of achondrogenesis type 1A is caused exclusively by cartilage defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        GMAP-210 deficiency affected trafficking of a subset of chondrocyte-expressed
        proteins rather than globally impairing membrane trafficking
      explanation: >-
        Trip11 inactivation in primary chondrocytes affects trafficking of a
        restricted cargo set.
- name: Defective Golgi Glycan Processing
  biological_scale: MOLECULAR
  description: >-
    Golgi-mediated glycosylation of glycoproteins and proteoglycans is abnormal in
    GMAP-210-deficient fibroblasts and chondrocytes. Aberrant glycan processing and
    impaired proteoglycan secretion are the Golgi functions that fail in both
    ACG1A and odontochondrodysplasia, and they are proposed as the cause of the
    shared chondrocyte maturation defect.
  biological_processes:
  - preferred_term: glycoprotein biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0009101
      label: glycoprotein biosynthetic process
  - preferred_term: proteoglycan biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
  evidence:
  - reference: PMID:20089971
    reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Golgi-mediated glycosylation events were altered in fibroblasts and
      chondrocytes lacking GMAP-210
    explanation: Glycosylation defect in GMAP-210-null mouse cells.
  - reference: PMID:30518689
    reference_title: "A common pathomechanism in GMAP-210- and LBR-related diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Deficiency of Golgi-dependent glycan processing indicated a similar
      downstream effect of the disease-causing mutations upon Golgi function.
    explanation: Glycan-processing deficiency in ACG1A patient cells.
  downstream:
  - target: Block in Hypertrophic Chondrocyte Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Aberrant glycan processing and proteoglycan secretion are proposed to
      produce the chondrocyte maturation block. Which modified cargo is
      responsible has not been identified.
    evidence:

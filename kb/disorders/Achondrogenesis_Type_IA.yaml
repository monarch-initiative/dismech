  description: >-
    Cartilage shows a hypercellular resting zone, round, vacuolated, slightly
    enlarged chondrocytes with cytoplasmic inclusion bodies, and no column
    formation in proliferative cartilage. This pattern separates type IA from
    type IB, in which collagen rings surround the chondrocytes.
  diagnostic: true
  evidence:

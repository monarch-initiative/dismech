    term:
      id: MONDO:0010966
      label: achondrogenesis type IB
  description: >-
    SLC26A2-related achondrogenesis with a closely similar fetal presentation.
  distinguishing_features:
  - Skull ossification is only mildly reduced in type IB and absent in type IA.
  - Collagen rings around chondrocytes in type IB, vacuolated chondrocytes with inclusions in type IA.
  evidence:
  - reference: PMID:31523626
    reference_title: "Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The skull is not ossified in ACG1A, whereas there are mildly low ossified

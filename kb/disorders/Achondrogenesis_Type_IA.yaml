- name: Loss of IFT20 Anchoring at the Golgi
  biological_scale: CELLULAR
  description: >-
    IFT20, an intraflagellar transport complex B protein, is anchored at the Golgi
    by GMAP-210 and is absent from the Golgi in ACG1A cells. Whether this causes a
    ciliary defect is disputed: fibroblasts homozygous for the deep intronic
    variant had fewer and shorter primary cilia, whereas an earlier functional
    study of TRIP11-mutant patient cells concluded in favour of a Golgi-based
    rather than a ciliary mechanism. No downstream consequence of IFT20
    mislocalization for chondrocytes has been demonstrated.

animal_models:
- name: Trip11 nonsense mouse
  species: Mouse
  genotype: Trip11 nonsense allele, homozygous (ENU mutagenesis)
  publication: PMID:20089971
  description: >-
    A recessive neonatal-lethal skeletal dysplasia found in an ENU screen; the
    mice lack GMAP-210 and their phenotype led to identification of TRIP11 as the
    ACG1A gene.
  modeled_mechanisms:
  - target: Chondrocyte ER Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Growth-plate chondrocytes show ER swelling and stress, abnormal
      differentiation and increased death.
    limitations: >-
      ER swelling and apoptosis were not reproduced in the 2019 human patient-derived cultures.
      Mouse developmental timing and cell context limit extrapolation to fetal human growth
      plates.
    evidence:
    - reference: PMID:20089971
      reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The similarities between the skeletal and cellular phenotypes in these mice
        and those in patients with achondrogenesis type 1A, a neonatal lethal form
        of skeletal dysplasia in humans, suggested that achondrogenesis type 1A may
        be caused by GMAP-210 deficiency.
      explanation: The authors judged the mouse phenotype similar to ACG1A.
  - target: Premature Chondrocyte Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Growth-plate chondrocytes show ER swelling and stress, abnormal
      differentiation and increased death.
    limitations: >-
      ER swelling and apoptosis were not reproduced in the 2019 human patient-derived cultures.
      Mouse developmental timing and cell context limit extrapolation to fetal human growth
      plates.
    evidence:
    - reference: PMID:20089971
      reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The similarities between the skeletal and cellular phenotypes in these mice
        and those in patients with achondrogenesis type 1A, a neonatal lethal form
        of skeletal dysplasia in humans, suggested that achondrogenesis type 1A may
        be caused by GMAP-210 deficiency.
      explanation: The authors judged the mouse phenotype similar to ACG1A.
- name: Chondrocyte-specific Trip11 knockout mouse
  species: Mouse
  genotype: Tg:Col2a1-Cre;Trip11cko/-
  publication: PMID:29180569
  description: >-
    Conditional deletion of Trip11 in chondrocytes reproduces the full ACG1A-like
    skeletal dysplasia and neonatal death, while deletion in osteoblasts,
    osteoclasts or pancreatic acinar cells causes no phenotype.
  modeled_mechanisms:
  - target: Failure of Endochondral Ossification
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Short limbs, small ribcage, and delayed mineralization of the vertebral
      bodies and skull, with absent hypertrophic zones.
    limitations: >-
      A mouse model; the conclusion that skull undermineralization is secondary
      to cartilage failure has been challenged by neural crest-specific deletion.
    evidence:
    - reference: PMID:29180569
      reference_title: "The skeletal phenotype of achondrogenesis type 1A is caused exclusively by cartilage defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Tg:Col2a1-Cre;Trip11cko/−;ROSA26mTmG/+ mice display a severe and lethal
        skeletal dysplasia, the features of which are identical to ACG1A.
      explanation: The authors report features identical to ACG1A.
  - target: Restrictive Thoracic Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Small ribcage with secondary impairment of alveolar development.
    limitations: >-
      Alveolar histology in mice may not match human fetal pulmonary hypoplasia
      at comparable gestation.
    evidence:
    - reference: PMID:29180569
      reference_title: "The skeletal phenotype of achondrogenesis type 1A is caused exclusively by cartilage defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, the alveolar phenotype appears secondary to the small ribcage, rather
        than a primary lung cell phenotype.
      explanation: Lung underdevelopment follows from the thoracic lesion.
- name: Neural crest-specific Trip11 knockout mouse
  species: Mouse
  genotype: Trip11flox/flox;Wnt1-Cre
  publication: PMID:35147267
  description: >-
    Trip11 deleted in cranial neural crest cells, with increased ER and Golgi
    stress and cell death in the developing frontal bone.
  modeled_mechanisms:
  - target: Cranial Osteogenic Cell ER Stress
    relationship: PERTURBS
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Neural crest-specific Trip11 deletion increases Atf4, Bip and Chop expression and enlarges
      ER cisternae in developing mouse skull tissues. These findings implicate an ER-stress
      response in this lineage. They have not been demonstrated in human calvarial tissue and do
      not establish an identical mechanism in all osteoblasts.
    limitations: Neural crest-specific mouse perturbation; direct confirmation in human calvarial tissue is lacking.
    evidence:
    - reference: PMID:35147267
      reference_title: Disruption of Trip11 in cranial neural crest cells is associated with increased ER and Golgi stress contributing to skull defects in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the expression levels of Atf4, Bip and Chop were significantly increased in Trip11 cKO
        skulls compared with controls
      explanation: >-
        ER stress-marker expression in neural crest-derived mouse skull tissue.
  - target: Cranial Osteogenic Cell Golgi Stress
    relationship: PERTURBS
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Neural crest-specific Trip11 deletion increases Golgi-stress-associated transcripts and
      GM130 abundance in mouse skull tissues, with smaller cis-Golgi profiles, attenuated stacks
      and swollen cisternae. The signaling pathway connecting this response to cell death
      remains unresolved.
    limitations: Neural crest-specific mouse perturbation; direct confirmation in human calvarial tissue is lacking.
    evidence:
    - reference: PMID:35147267
      reference_title: Disruption of Trip11 in cranial neural crest cells is associated with increased ER and Golgi stress contributing to skull defects in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the expression levels of Golga2, Golgb1, Acbd3, Arf4, Cth, Slc7a1 and Slc7a11 were
        significantly increased in Trip11 cKO skulls compared with controls
      explanation: >-
        Golgi-stress-associated gene expression in the neural crest-specific mouse knockout.
  - target: Premature Cranial Osteogenic Cell Death
    relationship: PERTURBS
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      TUNEL-positive cells increase in the non-osteogenic-front region of neural crest-derived
      frontal bone at E18.5 after Trip11 deletion; the assay showed no increase at E15.5. This
      late mouse phenotype is distinct from the collagen secretion defect and is not established
      in human skull tissue.
    limitations: Neural crest-specific mouse perturbation; direct confirmation in human calvarial tissue is lacking.
    evidence:
    - reference: PMID:35147267
      reference_title: Disruption of Trip11 in cranial neural crest cells is associated with increased ER and Golgi stress contributing to skull defects in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        While the number of apoptosis positive cells in CNC-derived bone and cartilage were
        comparable at E15.5 (Fig. 5A), it was increased in the area of CNC-derived frontal bone
        of Trip11 cKO mice at E18.5
      explanation: >-
        The cell-death phenotype depends on developmental stage.
  - target: Reduced Cranial Osteoblast Collagen Secretion
    relationship: PERTURBS
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      In neural crest-derived Trip11-null mouse osteoblasts, type I collagen remains
      intracellularly longer after ascorbate stimulation and extracellular collagen matrix is
      reduced. Proliferation and osteogenic differentiation markers remain preserved. VSVG entry
      into the Golgi was not impaired in this model, pointing to a defect in collagen handling
      through the Golgi and onward rather than a universal ER-export block.
    limitations: Neural crest-specific mouse perturbation; direct confirmation in human calvarial tissue is lacking.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC8276989/
      reference_title: The molecular complex of ciliary and golgin protein is crucial for skull development - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Western blot analysis confirmed that intracellular collagen ... cKO osteoblasts remained
        much longer than in controls
      explanation: >-
        Yamaguchi et al. (2021), PMID:34128978. Prolonged intracellular collagen retention in
        mouse osteoblast cultures.
experimental_models:
- name: ACG1A patient-derived fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary dermal fibroblasts from ACG1A fetuses, and chondrogenic cells derived
    from them, used to study GMAP-210 levels, Golgi structure, secretion,
    glycosylation and chondrocyte maturation.
  cell_source: Patient-derived (fetal skin)
  modeled_mechanisms:
  - target: Loss of Golgi Cisternal Stack Architecture
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Disrupted, compacted Golgi in patient cells.
    limitations: >-
      Fibroblasts are not the cell type in which the skeletal disease arises.
    evidence:
    - reference: PMID:30518689
      reference_title: "A common pathomechanism in GMAP-210- and LBR-related diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        As expected, mutations of TRIP11 in patient-derived primary cells caused a
        disruption of Golgi architecture, with compaction and breaking of the Golgi
        ribbon
      explanation: Golgi architecture in ACG1A patient primary cells.
  - target: Block in Hypertrophic Chondrocyte Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Fibroblast-derived chondrogenic cells fail to induce COL10A1 and pro-MMP13 despite
      preserved proliferation and viability.
    limitations: >-
      Chondrogenic cells derived from dermal fibroblasts are not growth-plate
      chondrocytes and lack growth-plate spatial organization.
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In both ACG1A- and ODCD-derived cells, the terminal hypertrophic differentiation state
        was never attained, as indicated by persistently low levels of COL10A1 mRNA and protein
      explanation: >-
        Direct differentiation measurements in patient fibroblast-derived chondrogenic cells.
discussions:
- discussion_id: acg1a_skull_ossification_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Decreased Skull Ossification
  - pathophysiology#Cranial Osteogenic Cell ER Stress
  - pathophysiology#Cranial Osteogenic Cell Golgi Stress
  - pathophysiology#Premature Cranial Osteogenic Cell Death
  - pathophysiology#Reduced Cranial Osteoblast Collagen Secretion
  prompt: >-
    Is the unossified skull vault of ACG1A secondary to cartilage failure, or does
    GMAP-210 act directly in skull-forming osteogenic cells?
  rationale: >-
    Chondrocyte-specific deletion reproduces skull undermineralization, while Bglap-Cre deletion
    leaves skeletal measurements normal. Wnt1-Cre deletion instead produces impaired collagen
    secretion and, later, ER/Golgi stress with increased cell death in neural crest-derived
    skull bone. These drivers act in different cellular and developmental contexts; the
    observations do not establish a single universal osteoblast mechanism. Human calvarial
    tissue confirmation is lacking.
  evidence:
  - reference: PMID:29180569
    reference_title: "The skeletal phenotype of achondrogenesis type 1A is caused exclusively by cartilage defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This includes the delay in mineralization of the vertebral column and the
      bones of the skull, thus showing that these features are a secondary
      consequence of the cartilage phenotype and not a cell-autonomous bone
      phenotype.
    explanation: The secondary-to-cartilage interpretation.
  - reference: PMID:35147267

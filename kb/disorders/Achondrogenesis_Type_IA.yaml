animal_models:
- name: Trip11 nonsense mouse
  species: Mouse
  genotype: Trip11 nonsense allele, homozygous (ENU mutagenesis)
  publication: PMID:20089971
  description: >-
    A recessive neonatal-lethal skeletal dysplasia found in an ENU screen; the
    mice lack GMAP-210 and their phenotype led to identification of TRIP11 as the
    ACG1A gene.
  modeled_mechanisms:
  - target: Chondrocyte ER Swelling, Stress and Premature Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Growth-plate chondrocytes show ER swelling and stress, abnormal
      differentiation and increased death.
    limitations: >-
      Mouse growth-plate development and timing of death differ from the human
      fetus; the human ER lesion is known only from older histology.
    evidence:
    - reference: PMID:20089971
      reference_title: "Lethal skeletal dysplasia in mice and humans lacking the golgin GMAP-210."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The similarities between the skeletal and cellular phenotypes in these mice
        and those in patients with achondrogenesis type 1A, a neonatal lethal form
        of skeletal dysplasia in humans, suggested that achondrogenesis type 1A may
        be caused by GMAP-210 deficiency.
      explanation: The authors judged the mouse phenotype similar to ACG1A.
- name: Chondrocyte-specific Trip11 knockout mouse
  species: Mouse
  genotype: Tg:Col2a1-Cre;Trip11cko/-
  publication: PMID:29180569
  description: >-
    Conditional deletion of Trip11 in chondrocytes reproduces the full ACG1A-like
    skeletal dysplasia and neonatal death, while deletion in osteoblasts,
    osteoclasts or pancreatic acinar cells causes no phenotype.
  modeled_mechanisms:
  - target: Failure of Endochondral Ossification
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Short limbs, small ribcage, and delayed mineralization of the vertebral
      bodies and skull, with absent hypertrophic zones.
    limitations: >-
      A mouse model; the conclusion that skull undermineralization is secondary
      to cartilage failure has been challenged by neural crest-specific deletion.
    evidence:
    - reference: PMID:29180569
      reference_title: "The skeletal phenotype of achondrogenesis type 1A is caused exclusively by cartilage defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Tg:Col2a1-Cre;Trip11cko/−;ROSA26mTmG/+ mice display a severe and lethal
        skeletal dysplasia, the features of which are identical to ACG1A.
      explanation: The authors report features identical to ACG1A.
  - target: Restrictive Thoracic Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Small ribcage with secondary impairment of alveolar development.
    limitations: >-
      Alveolar histology in mice may not match human fetal pulmonary hypoplasia
      at comparable gestation.
    evidence:
    - reference: PMID:29180569
      reference_title: "The skeletal phenotype of achondrogenesis type 1A is caused exclusively by cartilage defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, the alveolar phenotype appears secondary to the small ribcage, rather
        than a primary lung cell phenotype.
      explanation: Lung underdevelopment follows from the thoracic lesion.
- name: Neural crest-specific Trip11 knockout mouse
  species: Mouse
  genotype: Trip11flox/flox;Wnt1-Cre
  publication: PMID:35147267
  description: >-
    Trip11 deleted in cranial neural crest cells, with increased ER and Golgi
    stress and cell death in the developing frontal bone.
  modeled_mechanisms:
  - target: Cranial Osteogenic Cell ER and Golgi Stress
    relationship: PERTURBS
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Tests whether GMAP-210 acts directly in skull-forming osteogenic cells.
    limitations: >-
      Tissue-restricted deletion in mice; not compared with human calvarial
      tissue, and its result disagrees with the normal skull of the osteoblast
      (Bglap-Cre) knockout.
    evidence:
    - reference: PMID:35147267
      reference_title: "Disruption of Trip11 in cranial neural crest cells is associated with increased ER and Golgi stress contributing to skull defects in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In Trip11 mutant skulls, expression levels of ER stress markers were
        increased compared to controls.
      explanation: ER stress readout in the neural crest-derived skull.
experimental_models:
- name: ACG1A patient-derived fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary dermal fibroblasts from ACG1A fetuses, and chondrogenic cells derived
    from them, used to study GMAP-210 levels, Golgi structure, secretion,
    glycosylation and chondrocyte maturation.
  cell_source: Patient-derived (fetal skin)
  modeled_mechanisms:
  - target: Loss of Golgi Cisternal Stack Architecture
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Disrupted, compacted Golgi in patient cells.
    limitations: >-
      Fibroblasts are not the cell type in which the skeletal disease arises.
    evidence:
    - reference: PMID:30518689
      reference_title: "A common pathomechanism in GMAP-210- and LBR-related diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        As expected, mutations of TRIP11 in patient-derived primary cells caused a
        disruption of Golgi architecture, with compaction and breaking of the Golgi
        ribbon
      explanation: Golgi architecture in ACG1A patient primary cells.
  - target: Block in Hypertrophic Chondrocyte Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Patient-derived chondrogenic cells show a chondrocyte maturation defect.
    limitations: >-
      Chondrogenic cells derived from dermal fibroblasts are not growth-plate
      chondrocytes and lack growth-plate spatial organization.
    evidence:
    - reference: PMID:30728324
      reference_title: "Hypomorphic mutations of TRIP11 cause odontochondrodysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, a similar defect in chondrocyte maturation is observed in both
        disorders, which produces a cellular achondrogenesis phenotype of different
        severity
      explanation: Maturation defect in patient-derived chondrogenic cells.
discussions:
- discussion_id: acg1a_skull_ossification_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Decreased Skull Ossification
  - pathophysiology#Cranial Osteogenic Cell ER and Golgi Stress
  prompt: >-
    Is the unossified skull vault of ACG1A secondary to cartilage failure, or does
    GMAP-210 act directly in skull-forming osteogenic cells?
  rationale: >-
    The calvarial bones form by intramembranous ossification without a cartilage
    template, yet they are undermineralized in ACG1A. Chondrocyte-specific
    deletion reproduces the skull defect and osteocalcin-Cre deletion does not,
    which was read as the skull defect being secondary. Neural crest-specific
    deletion, however, produces ER and Golgi stress and cell death in frontal-bone
    osteogenic cells. The two mouse results use Cre drivers acting at different
    stages of the osteoblast lineage, and no human calvarial tissue has been
    examined.
  evidence:
  - reference: PMID:29180569
    reference_title: "The skeletal phenotype of achondrogenesis type 1A is caused exclusively by cartilage defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This includes the delay in mineralization of the vertebral column and the
      bones of the skull, thus showing that these features are a secondary
      consequence of the cartilage phenotype and not a cell-autonomous bone
      phenotype.
    explanation: The secondary-to-cartilage interpretation.
  - reference: PMID:35147267
    reference_title: "Disruption of Trip11 in cranial neural crest cells is associated with increased ER and Golgi stress contributing to skull defects in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, we also found that Golgi stress increased in Trip11 mutant
      skulls, suggesting that both ER and Golgi stress-induced cell death may lead
      to osteopenia-like phenotypes in Trip11 mutant skulls.
    explanation: The cell-autonomous interpretation.
- discussion_id: acg1a_ciliary_involvement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of IFT20 Anchoring at the Golgi
  prompt: >-
    Does loss of GMAP-210 impair primary cilia in ACG1A, and does this contribute
    to the phenotype?
  rationale: >-
    IFT20 loses its normal distribution in ACG1A cells. Ciliogenesis was reduced
    in fibroblasts homozygous for a deep intronic allele, whereas an earlier
    functional study of TRIP11-mutant patient cells favoured a Golgi-based over a
    ciliary mechanism. The discrepancy could reflect the alleles, the culture
    conditions or the cell lines, and chondrocyte cilia have not been examined.
  evidence:
  - reference: PMID:34057271
    reference_title: "Biallelic deep intronic variant c.5457+81T>A in TRIP11 causes loss of function and results in achondrogenesis 1A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further, we observed a significant reduction in the frequency of ciliated
      cells and in the length of primary cilia in subject-derived cell lines
    explanation: Reports reduced ciliogenesis.
  - reference: PMID:30728324
    reference_title: "Hypomorphic mutations of TRIP11 cause odontochondrodysplasia."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      This association and extraskeletal disease manifestations in ODCD point to a
      cilium-dependent pathogenesis. However, our functional studies in
      patient-derived primary cells clearly support a Golgi-based disease
      mechanism.
    explanation: >-
      Favours a Golgi-based over a ciliary mechanism in TRIP11-mutant patient
      cells; framed around ODCD, hence INDIRECT for ACG1A.
notes: >-
  No GeneReviews chapter for achondrogenesis type IA was found: a PubMed search for
  (achondrogenesis[TI] OR TRIP11[TIAB]) AND (genereviews[book] OR
  statpearls[book]) returned a single record, the GeneReviews chapter
  Achondrogenesis Type 1B, which covers the SLC26A2 disease and is therefore not
  a baseline for this entry. The Orphanet record for this subtype
  is ORPHA:93299 (MONDO xref); ORPHA:932 is the achondrogenesis group. A
  clinically diagnosed family reported as a new subtype with non-recessive
  segregation (PMID:30951048) has no molecular confirmation.

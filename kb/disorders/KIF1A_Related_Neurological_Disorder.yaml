        label: KIF1A
    allele_type: missense
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Mostly de novo heterozygous motor-domain missense variants; a minority of
      SPG30A families inherit them dominantly.

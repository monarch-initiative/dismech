    reference_title: KIF1A variants are a frequent cause of autosomal dominant hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these patients, spastic paraplegia was slowly progressive and mostly pure, but with a highly variable disease onset (0-57 years)."
    explanation: Characterizes the autosomal dominant spastic paraplegia subtype.
  - reference: PMID:31488895
    reference_title: KIF1A variants are a frequent cause of autosomal dominant hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analyses showed a de novo occurrence in seven cases, and a dominant inheritance pattern in 11 families."
    explanation: Establishes both de novo and inherited dominant transmission in this subtype.
  - reference: PMID:31488895
    reference_title: KIF1A variants are a frequent cause of autosomal dominant hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals from families P3 and P8 had learning difficulties, with an IQ varying from 68 to 80 points, where IQ below 70 is considered as borderline intellectual disability."
    explanation: Mild cognitive involvement in two dominant spastic paraplegia families (both with motor-domain missense variants, Table 1).
- name: SPG30B
  display_name: Spastic paraplegia 30B, autosomal recessive
  description: >-
    Autosomal recessive spastic paraplegia from biallelic KIF1A variants. The
    first family, an inbred Palestinian kindred, carried a homozygous
    p.Ala255Val motor-domain variant and had infantile-onset pure spastic gait;
    earlier-reported SPG30 patients had adolescent onset with distal wasting,
    sensory neuropathy and cerebellar ataxia.
  subtype_term:

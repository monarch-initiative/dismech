pathophysiology:
- name: KIF1A Motor Domain Missense Variants
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  subtypes:
  - MRD9
  - SPG30A
  description: >-
    Heterozygous missense variants cluster in the KIF1A motor domain, altering
    conserved residues needed for ATP hydrolysis and microtubule binding (P-loop,
    switch I, switch II). All modeled variants impair transport, falling into
    three classes of motility defect: reduced microtubule binding, reduced
    velocity and processivity, and increased non-motile (rigor) microtubule
    binding. Rigor variants (for example p.Gly251Arg, p.Glu253Lys) track with
    the most severe disease and reduced microtubule binding with milder disease.
  genes:
  - preferred_term: KIF1A
    term:
      id: hgnc:888
      label: KIF1A

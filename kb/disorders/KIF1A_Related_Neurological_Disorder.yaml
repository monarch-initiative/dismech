animal_models:
- name: C. elegans unc-104 KAND knock-in models
  species: Caenorhabditis elegans
  genotype: unc-104(R9Q), unc-104(R251Q), unc-104(P298L) heterozygous and homozygous (human KIF1A R11Q, R254Q, P305L)
  description: >-
    CRISPR-Cas9 knock-ins of KAND motor-domain variants into the KIF1A ortholog
    unc-104. Heterozygotes and homozygotes have reduced axonal transport of
    synaptic vesicles, and heterozygotes are more impaired than heterozygous
    null worms. A suppressor screen recovered UNC-104(D177N), which restores
    motor activity.
  publication: PMID:35917346
  modeled_mechanisms:
  - target: Dominant-Negative Inhibition of Wild-Type KIF1A
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Worms lack the corticospinal tract, optic nerve and cerebellum, so the
      degenerative human phenotypes cannot be assessed.
    evidence:
    - reference: PMID:35917346
      reference_title: De novo mutations in KIF1A-associated neuronal disorder (KAND) dominant-negatively inhibit motor activity and axonal transport of synaptic vesicle precursors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, the phenotypes of unc-104(R9Q)/+, unc-104(R251Q)/+, and unc-104(P298L)/+ were stronger than unc-104(null)/+, suggesting that the KAND mutations result in dominant-negative phenotypes for unc-104 transport in living animals."
      explanation: Heterozygous knock-ins show a dominant-negative effect in vivo.
  - target: Impaired Anterograde Axonal Transport of Synaptic Vesicle Precursors
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    evidence:
    - reference: PMID:35917346
      reference_title: De novo mutations in KIF1A-associated neuronal disorder (KAND) dominant-negatively inhibit motor activity and axonal transport of synaptic vesicle precursors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In our C. elegans models, both heterozygotes and homozygotes exhibited reduced axonal transport."
      explanation: Reduced axonal transport in KAND worms.
  evidence:
  - reference: PMID:35917346
    reference_title: De novo mutations in KIF1A-associated neuronal disorder (KAND) dominant-negatively inhibit motor activity and axonal transport of synaptic vesicle precursors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Suppressor screening using the disease model identified a mutation that recovers the motor activity of mutated human KIF1A."
    explanation: The worm model supports genetic suppressor screens.
- name: Kif1a knockout mouse
  species: Mus musculus
  genotype: Kif1a-/-
  description: >-
    Homozygous Kif1a disruption is mostly lethal within a day of birth, with
    motor and sensory disturbances, reduced synaptic vesicle precursor
    transport, reduced synaptic vesicle density and neuronal degeneration.

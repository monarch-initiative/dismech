name: KIF1A-Related Neurological Disorder
creation_date: "2026-10-01T15:00:00Z"
category: Mendelian
description: >-
  KIF1A-related neurological disorder (KAND; KIF1A-related neurodevelopmental
  disorder, KIF1A-NDD) is the spectrum of developmental and degenerative
  neurological disease caused by pathogenic variants in KIF1A, the
  neuron-specific kinesin-3 motor that carries synaptic vesicle precursors
  anterogradely along axons. Heterozygous, usually de novo, motor-domain
  missense variants cause the most common and most severe presentation
  (intellectual disability, autosomal dominant 9): global developmental delay,
  hypotonia followed by progressive lower-limb spasticity and weakness, optic
  nerve atrophy, cerebellar atrophy, seizures, peripheral neuropathy and
  neurobehavioral features. Inherited heterozygous missense or loss-of-function
  variants cause a slowly progressive, mostly pure autosomal dominant spastic
  paraplegia (SPG30A); biallelic variants cause autosomal recessive spastic
  paraplegia (SPG30B) or hereditary sensory and autonomic neuropathy type 2C.
synonyms:
- KAND
- KIF1A-associated neurological disorder
- KIF1A-related neurodevelopmental disorder
- KIF1A-NDD
parents:
- hereditary disease
- nervous system disorder

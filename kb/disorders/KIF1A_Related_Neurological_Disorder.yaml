discussions:
- discussion_id: kand_genotype_severity
  prompt: >-
    Does variant position or motility class predict severity in KAND, given
    that one cohort finds a strong association with P-loop and switch variants
    and another finds none?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#KIF1A Motor Domain Missense Variants
  rationale: >-
    Genotype-severity correlation matters for counseling and for selecting
    patients for allele-specific therapy. A 100-patient cohort links P-loop,
    switch I and switch II variants and rigor motility to severe disease, while
    a 28-patient Italian series found no correlation between mutation location
    and neurological or imaging presentation. Both are cross-sectional, and
    severity rises with age in a progressive disease.
  evidence:
  - reference: PMID:33880452
    reference_title: Genotype and defects in microtubule-based motility correlate with clinical severity in KIF1A-associated neurological disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found increased severity is strongly associated with variants occurring in protein regions involved with ATP and MT binding: the P loop, switch I, and switch II."
    explanation: Reports a genotype-severity association.
  - reference: PMID:34487232
    reference_title: "Monoallelic KIF1A-related disorders: a multicenter cross sectional study and systematic literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventeen mutations occurred in the motor domain of the Kinesin-1A protein, but location of mutation did not correlate with neurological and imaging presentations."
    explanation: Finds no location-phenotype correlation.
- discussion_id: kand_haploinsufficiency_tolerance
  prompt: >-
    Is a heterozygous KIF1A loss-of-function state benign enough that
    silencing the dominant-negative allele is a durable therapeutic goal?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#KIF1A Haploinsufficiency
  - treatments#Allele-Specific Antisense Oligonucleotide (n-of-1)
  rationale: >-
    Allele-specific knockdown converts a dominant-negative genotype into a
    haploinsufficient one. Loss-of-function carriers have a much milder, pure
    spastic paraplegia, but they do develop disease, sometimes from infancy, so
    the ceiling of benefit and the long-term outcome of knockdown are unknown.
  evidence:
  - reference: PMID:39122967
    reference_title: Antisense oligonucleotide therapy in an individual with KIF1A-associated neurological disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Heterozygous variants leading to KIF1A haploinsufficiency are associated only with adult onset hereditary spastic paraplegia without seizures or cognitive impairment, a phenotype significantly milder than that associated with missense variants9 suggesting that gapmer ASO mediated therapy might provide a bridging therapeutic approach for dominant negative missense variants in KIF1A until other treatment options are available."
    explanation: States the therapeutic rationale and its dependence on haploinsufficiency being mild.
  - reference: PMID:31488895
    reference_title: KIF1A variants are a frequent cause of autosomal dominant hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, unlike these allelic disorders, dominant spastic paraplegia was also caused by loss-of-function variants outside this domain in six families."
    explanation: Loss-of-function heterozygosity is itself pathogenic.
- discussion_id: kand_spg30b_direction_of_effect
  prompt: >-
    Do recessive SPG30 alleles such as p.Ala255Val reduce KIF1A motor function
    or hyperactivate it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic KIF1A Variants
  - pathophysiology#KIF1A Motor Domain Missense Variants
  rationale: >-
    The recessive SPG30B allele p.Ala255Val lies in the motor domain, yet worm
    studies have suggested that it and other familial alleles cause gain of
    function. The functional class of recessive alleles determines whether
    SPG30B shares the transport-loss mechanism of the dominant subtypes.
  evidence:
  - reference: PMID:35917346
    reference_title: De novo mutations in KIF1A-associated neuronal disorder (KAND) dominant-negatively inhibit motor activity and axonal transport of synaptic vesicle precursors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "On the other hand, we have suggested that KIF1A(V8M), KIF1A(A255V), and KIF1A(R350G) mutations (all of them are familial) result in a gain of function (25)."
    explanation: Prior model data suggest hyperactivation for A255V.
  - reference: PMID:31455732
    reference_title: Disease-associated mutations hyperactivate KIF1A motility and anterograde axonal transport of synaptic vesicle precursors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we established in vitro motility assays with purified full-length human KIF1A and found that KIF1A mutations associated with the hereditary SPG lead to hyperactivation of KIF1A motility."
    explanation: SPG-associated variants hyperactivate purified KIF1A.
  - reference: PMID:31455732
    reference_title: Disease-associated mutations hyperactivate KIF1A motility and anterograde axonal transport of synaptic vesicle precursors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Introduction of the corresponding mutations into the Caenorhabditis elegans KIF1A homolog unc-104 revealed abnormal accumulation of SVPs at the tips of axons and increased anterograde axonal transport of SVPs."
    explanation: Increased, not decreased, SVP transport in worm knock-ins.
- discussion_id: kand_mouse_model_genotype_mismatch
  prompt: >-
    Can the slowly progressive human degeneration be studied in a model that
    carries a heterozygous KAND allele, given that the only cited mouse is a
    neonatal-lethal null?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Neuronal Degeneration
  - animal_models#Kif1a knockout mouse
  rationale: >-
    Kif1a-null mice die within a day of birth, a genotype no patient has, while
    KAND knock-in worms reproduce the dominant-negative transport defect but
    lack the corticospinal, optic and cerebellar systems that degenerate in
    patients. Neither model can test which neurons degenerate first or whether
    reducing the mutant allele halts degeneration.
  evidence:
  - reference: PMID:9548721
    reference_title: Defect in synaptic vesicle precursor transport and neuronal cell death in KIF1A motor protein-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "KIF1A mutants died mostly within a day after birth showing motor and sensory disturbances."
    explanation: Null mice are neonatal lethal, unlike the heterozygous human disease.
notes: >-
  MONDO places hereditary spastic paraplegia 30 (MONDO:0012476) under both
  hereditary spastic paraplegia and this disorder; its two children, SPG30A
  (MONDO:0700307) and SPG30B (MONDO:0971149), are curated here as subtypes, as
  the Hereditary_Spastic_Paraplegia entry defers SPG30 to this record. HSAN2C
  (MONDO:0013634) is a pointer subtype curated on
  Hereditary_Sensory_and_Autonomic_Neuropathy_Type_2. Phenotype frequencies come
  mainly from KAND cohorts dominated by de novo motor-domain variants (MRD9), so
  features absent from loss-of-function SPG30A carriers (developmental delay,
  seizures, visual involvement) are scoped to MRD9. The 50% optic atrophy
  figure of PMID:33880452 is caregiver-reported, against 95% on prospective
  examination with OCT in PMID:39009236. ClinGen curates KIF1A against
  syndromic intellectual disability rather than against these MONDO subtypes,
  so no gene-disease validity tier is recorded.

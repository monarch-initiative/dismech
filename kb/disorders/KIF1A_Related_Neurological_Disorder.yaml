    reference_title: "De novo mutations in the motor domain of KIF1A cause cognitive impairment, spastic paraparesis, axonal neuropathy, and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All these de novo mutations are located in the motor domain (MD) of KIF1A."
    explanation: De novo KAND variants localize to the motor domain.
  - reference: PMID:21376300
    reference_title: Excess of de novo deleterious mutations in genes associated with glutamatergic systems in nonsyndromic intellectual disability.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Thr99 lies in the highly conserved p loop consensus ATP-binding site of the KIF1A motor domain"
    explanation: Places the founding MRD9 variant in the ATP-binding P-loop.

- name: Dominant-Negative Inhibition of Wild-Type KIF1A
  role: mechanism
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  subtypes:
  - MRD9
  - SPG30A
  description: >-
    Activated KIF1A moves as a dimer, so in a heterozygous neuron about half of
    the motors are wild-type/mutant heterodimers. Mutant subunits suppress the
    motility of these heterodimers, and KAND knock-in worms heterozygous for the
    variant are more impaired than heterozygous null worms. Missense disease is
    clinically far more severe than loss-of-function disease, consistent with a
    dominant-negative rather than haploinsufficient mechanism; rigor motors may
    additionally act as roadblocks to other microtubule traffic.
  evidence:
  - reference: PMID:35917346
    reference_title: De novo mutations in KIF1A-associated neuronal disorder (KAND) dominant-negatively inhibit motor activity and axonal transport of synaptic vesicle precursors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, the phenotypes of unc-104(R9Q)/+, unc-104(R251Q)/+, and unc-104(P298L)/+ were stronger than unc-104(null)/+, suggesting that the KAND mutations result in dominant-negative phenotypes for unc-104 transport in living animals."
    explanation: In vivo dominant-negative effect of KAND alleles in C. elegans.
  - reference: PMID:35917346
    reference_title: De novo mutations in KIF1A-associated neuronal disorder (KAND) dominant-negatively inhibit motor activity and axonal transport of synaptic vesicle precursors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that mutant KIF1A significantly impaired the motility of heterodimeric motors."
    explanation: Single-molecule assays of wild-type/mutant heterodimers.
  - reference: PMID:33880452
    reference_title: Genotype and defects in microtubule-based motility correlate with clinical severity in KIF1A-associated neurological disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The clinical disease severity associated with missense variants in our study was much worse than any of the loss-of-function alleles, suggesting a dominant negative disease mechanism."
    explanation: Clinical genotype comparison supports a dominant-negative mechanism by inference.
  downstream:
  - target: Impaired Anterograde Axonal Transport of Synaptic Vesicle Precursors
    causal_link_type: DIRECT
    description: >-
      Inhibited motors fail to deliver synaptic vesicle precursors along the
      axon.
    evidence:
    - reference: PMID:35917346
      reference_title: De novo mutations in KIF1A-associated neuronal disorder (KAND) dominant-negatively inhibit motor activity and axonal transport of synaptic vesicle precursors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In our C. elegans models, both heterozygotes and homozygotes exhibited reduced axonal transport."
      explanation: Heterozygous KAND worms have reduced axonal transport.
- name: KIF1A Haploinsufficiency
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  subtypes:
  - SPG30A
  description: >-
    Heterozygous loss-of-function variants outside the motor domain (nonsense,
    frameshift, deletion) cause autosomal dominant spastic paraplegia, most
    likely by halving KIF1A expression through nonsense-mediated decay or
    absent transcription rather than by producing a poisoning motor. Carriers
    reported in the literature have pure spastic paraplegia with normal
    cognition and no seizures or visual problems. The two SPG30A families in
    the same Dutch cohort that had learning difficulties or borderline
    intellectual disability carried motor-domain missense variants (p.Ser69Leu,
    p.Leu173Pro), not loss-of-function alleles.

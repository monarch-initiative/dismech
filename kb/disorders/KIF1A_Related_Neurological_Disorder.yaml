    reference_title: Genotype and defects in microtubule-based motility correlate with clinical severity in KIF1A-associated neurological disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find all modeled variants result in defects in protein transport, and we describe three classes of protein dysfunction: reduced MT binding, reduced velocity and processivity, and increased non-motile rigor MT binding."

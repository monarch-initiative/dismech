has_subtypes:
- name: MRD9
  display_name: Intellectual disability, autosomal dominant 9 (NESCAV syndrome)
  description: >-
    The classic and most frequent KAND presentation, caused by heterozygous,
    mostly de novo missense variants in the KIF1A motor domain. Features are
    developmental delay or intellectual disability with variable cerebellar
    atrophy, spastic paraparesis, optic nerve atrophy, peripheral neuropathy and
    epilepsy. p.Thr99Met, in the P-loop ATP-binding site, was the first de novo
    variant reported in nonsyndromic intellectual disability and is recurrent.
  subtype_term:
    preferred_term: intellectual disability, autosomal dominant 9
    term:
      id: MONDO:0013656
      label: intellectual disability, autosomal dominant 9
  genes:
  - preferred_term: KIF1A
    term:
      id: hgnc:888
      label: KIF1A
  evidence:
  - reference: PMID:21376300
    reference_title: Excess of de novo deleterious mutations in genes associated with glutamatergic systems in nonsyndromic intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo missense mutations were identified in KIF1A (c.296C>T/p.Thr99Met), GRIN1 (c.1984G>A/p.Glu662Lys), EPB41L1 (c.2560C>T/p.Pro854Ser), and CACNG2 (c.427G>C/p.Val143Leu) (Table 2)."
    explanation: Founding report of the de novo KIF1A p.Thr99Met variant in nonsyndromic intellectual disability.
  - reference: PMID:25265257
    reference_title: "De novo mutations in the motor domain of KIF1A cause cognitive impairment, spastic paraparesis, axonal neuropathy, and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with de novo mutations in KIF1A display a phenotype characterized by cognitive impairment and variable presence of cerebellar atrophy, spastic paraparesis, optic nerve atrophy, peripheral neuropathy, and epilepsy."
    explanation: Defines the clinical picture of the de novo motor-domain subtype.
- name: SPG30A
  display_name: Spastic paraplegia 30A, autosomal dominant
  description: >-
    Autosomal dominant (inherited or de novo) spastic paraplegia, slowly
    progressive and mostly pure, with onset from infancy to late adulthood. It is
    caused by motor-domain missense variants and, unlike the other KIF1A
    disorders, also by heterozygous loss-of-function variants outside the motor
    domain. KIF1A explained 6-7% of a Dutch clinical-exome cohort of mostly pure
    spastic paraplegia. Two families with motor-domain missense variants
    (p.Ser69Leu, p.Leu173Pro) also had learning difficulties, with borderline
    intellectual disability in one patient, placing SPG30A on a continuum with
    MRD9.
  subtype_term:
    preferred_term: spastic paraplegia 30A, autosomal dominant
    term:
      id: MONDO:0700307
      label: spastic paraplegia 30A, autosomal dominant
  genes:
  - preferred_term: KIF1A
    term:
      id: hgnc:888
      label: KIF1A
  evidence:

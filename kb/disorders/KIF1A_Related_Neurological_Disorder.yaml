    explanation: GeneReviews diagnostic criterion.
treatments:
- name: Allele-Specific Antisense Oligonucleotide (n-of-1)
  description: >-
    Experimental individualized therapy. A 9-year-old girl with severe KAND and
    a de novo p.Pro305Leu variant received intrathecal nL-KIF1-001, a 5-10-5
    2'-MOE gapmer with mixed phosphorothioate/phosphodiester backbone designed
    to recruit RNase H1 to the transcript of the pathogenic allele, selected
    using a SNP in cis. Dosing escalated from 20 mg in 20 mg steps to 80 mg.
    Over 9 months it was safe apart from an epidural CSF collection after the
    first injection; spells of behavioral arrest, falls and quality of life
    improved, 6-minute walk distance changed little, and cognition was stable.
    The rationale is to remove the dominant-negative allele, leaving a
    haploinsufficient state that loss-of-function carriers suggest is much
    milder.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: KIF1A
      term:
        id: hgnc:888
        label: KIF1A
    target_transcript: KIF1A mRNA from the p.Pro305Leu allele (allele-specific)
    oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
  delivery_system:
    delivery_platform: UNFORMULATED
    targeting_ligand: UNCONJUGATED
  treatment_term:
    preferred_term: allele-specific antisense oligonucleotide therapy
    term:
      id: NCIT:C16236
      label: Antisense Therapy
    therapeutic_agent:
    - preferred_term: nL-KIF1-001 (allele-specific antisense oligonucleotide)
      term:
        id: NCIT:C1291
        label: Antisense Oligonucleotides
  target_mechanisms:
  - target: Dominant-Negative Inhibition of Wild-Type KIF1A
    treatment_effect: INHIBITS
    description: Degrades the pathogenic-allele transcript to remove the dominant-negative subunit.
  evidence:
  - reference: PMID:39122967
    reference_title: Antisense oligonucleotide therapy in an individual with KIF1A-associated neurological disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the case of one patient with a severe form of KAND characterized by refractory spells of behavioral arrest and carrying a p.Pro305Leu variant in KIF1A, who was treated with intrathecal injections of an allele-specific antisense oligonucleotide specifically designed to degrade the mRNA from the pathogenic allele."
    explanation: Describes the n-of-1 allele-specific ASO treatment.
  - reference: PMID:39122967
    reference_title: Antisense oligonucleotide therapy in an individual with KIF1A-associated neurological disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Otherwise, the antisense oligonucleotide was safe and well tolerated over the 9-month treatment. Most outcome measures, including severity of the spells of behavioral arrest, number of falls and quality of life, improved."
    explanation: Safety and outcome in the single treated patient.
  - reference: PMID:39122967
    reference_title: Antisense oligonucleotide therapy in an individual with KIF1A-associated neurological disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "There was no significant reduction of the mRNA level from the wildtype allele at any concentration tested, highlighting the high selectivity of nL-KIF1-001 for the mRNA from the pathogenic allele over the wildtype allele (Figure 1B)"
    explanation: Allele selectivity in patient iPSC-derived neurons.
  - reference: PMID:39122967
    reference_title: Antisense oligonucleotide therapy in an individual with KIF1A-associated neurological disorder.

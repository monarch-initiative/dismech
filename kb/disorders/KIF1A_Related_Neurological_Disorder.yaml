    explanation: Genotype-severity association in the natural-history cohort.
  - reference: PMID:33880452
    reference_title: Genotype and defects in microtubule-based motility correlate with clinical severity in KIF1A-associated neurological disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The rigor phenotype is consistently associated with the most severe clinical phenotype, while reduced MT binding is associated with milder clinical phenotypes."
    explanation: Links motility class to clinical severity.

- phase: Long-term neurodevelopmental sequelae
  age_range: Follow-up spanning 1 to 50 years in the series the review draws on
  notes: >-
    Motor sequelae, including coordination deficits and impaired fine motor
    skills or tremor, are described in 20 to 60 per cent but usually do not
    severely affect everyday function. The cognitive and behavioural
    sequelae do. Against those historical figures sits the one prospectively
    treated cohort, in which cognitive and adaptive function was stable over
    ten years; 21 of its 25 children received immunoglobulin, there was no
    statistical comparison, and the authors say the small sample limits the
    finding.
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired fine motor skills or tremor have been described in 20%–60% in follow-up spanning 1–50 years4,12,31,56,57 but usually do not severely affect everyday function. In contrast, cognitive and behavioral deficits can severely affect function."
    explanation: >-
      Separates the two kinds of sequela by how much they matter
      functionally, which is the distinction that drives management toward
      the cognitive outcome.
  - reference: PMID:38689540

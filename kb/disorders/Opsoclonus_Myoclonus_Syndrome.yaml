- phase: Remission on therapy, then sustained remission off therapy
  notes: >-
    Remission is defined twice over, because the two are not the same
    question: remission while still on treatment, which has to be
    reassessed as treatment is weaned, and sustained remission after
    treatment has stopped. Tapering is guided by symptoms and is avoided
    while a child remains symptomatic, on the reasoning that persisting
    symptoms indicate continuing inflammation. Neither definition means
    permanent remission.
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT

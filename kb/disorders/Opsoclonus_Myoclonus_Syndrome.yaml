    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Remission can be separately defined as remission on therapy, which always needs to be continuously reevaluated as treatment is weaned, and sustained remission off therapy."
    explanation: >-
      The two-stage definition the consensus review uses, which is what makes
      this a distinct phase rather than an endpoint.

name: Opsoclonus-Myoclonus Syndrome
creation_date: '2026-10-30T18:00:00Z'
description: >-
  Opsoclonus-myoclonus syndrome, also called opsoclonus-myoclonus-ataxia
  syndrome, dancing eyes syndrome or Kinsbourne syndrome, is a rare
  immune-mediated disorder of childhood whose cardinal features are
  opsoclonus, myoclonus, ataxia and disturbance of behaviour and sleep. An
  expert panel allows the diagnosis when three of four features are present:
  opsoclonus, ataxia or myoclonus, behaviour change or sleep disturbance, and
  neuroblastoma.

  Opsoclonus is the defining sign and is specific in form rather than merely
  in appearance: spontaneous, arrhythmic, large-amplitude conjugate saccades
  in all directions of gaze with no intersaccadic interval, which is what
  separates it from nystagmus. As it settles it may become ocular flutter.
  It is attributed to instability in the balance between brainstem omnipause
  and burst neurons that normally generate saccades.

  About half of affected children have an underlying peripheral neuroblastic
  tumour, most often neuroblastoma, and in the other direction the syndrome
  occurs in 2 to 3 per cent of children with neuroblastoma. The tumours are
  never intracranial and are usually early stage. Resecting the tumour does
  not treat the neurological disease.

  The immune basis is better established than its target. Routine
  cerebrospinal fluid studies are usually normal and commercial autoantibody
  panels usually negative, while cerebrospinal fluid oligoclonal bands and an
  expanded B-cell population are present in most untreated patients and
  correlate with neurological severity. No reproducible antigen has been
  identified, which remains the central unknown and is recorded as a
  knowledge gap. Treatment is immunotherapy, and the only randomised trial in
  the disease showed that adding intravenous immunoglobulin to prednisone and
  risk-adapted chemotherapy raised the response rate from 41 to 81 per cent.
categories:
- Neurological Disorder
- Paraneoplastic Syndrome
- Autoimmune Disease
synonyms:
- OMS
- OMAS
- opsoclonus-myoclonus-ataxia syndrome
- dancing eyes syndrome
- Kinsbourne syndrome
notes: >-
  Scope. This entry curates the syndrome as a disease in its own right. Its
  neuroblastoma side is curated in Neuroblastoma, which records it as a
  paraneoplastic phenotype with its own immune chain, and the paraneoplastic
  side in Paraneoplastic_Neurological_Syndromes. Those two entries and this
  one describe the same association from three directions and should agree;
  where they quote the same sentence they are graded the same way.

  A pointer subtype in Paraneoplastic_Neurological_Syndromes would link that
  entry to this one, and is deliberately left for a follow-up rather than
  done here: that file is shared with another curation lane, and this entry
  does not need it to stand.

  The adult paraneoplastic form is not separately modelled. The sources
  cited here are paediatric, and the one adult-specific statement found,
  that Ri/ANNA2 antibodies occur in opsoclonus-myoclonus with breast cancer,
  is recorded in the knowledge-gap discussion rather than as a subtype,
  because nothing cited here characterises the adult form as a whole.
disease_term:
  preferred_term: opsoclonus-myoclonus syndrome
  term:
    id: MONDO:0015247
    label: opsoclonus-myoclonus syndrome
pathophysiology:
- name: Neuroblastic Tumour Trigger
  description: >-
    In about half of children a peripheral neuroblastic tumour is found,
    neuroblastoma in 73 per cent of those, ganglioneuroblastoma in 22 per
    cent and ganglioneuroma in 4 per cent. The tumours lie along the
    sympathetic chain or in the adrenals and are never intracranial, and 93
    per cent of the neuroblastomas are stage 1 or 2. In the other half no
    tumour is found; occult tumour with spontaneous regression has been
    proposed, and no clinical feature distinguishes the two groups. The
    parainfectious trigger below is the alternative route to the same immune
    node, and the two are not mutually exclusive.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroblastoma (73%) is the most common tumor type, followed by ganglioneuroblastoma (22%) and ganglioneuroma (4%). The tumors are never in the brain: all are located along the sympathetic chain or in the adrenals, including the neck, thoracic, abdominal, or pelvic cavities.9 Notably, 93% of neuroblastoma is early stage (stage 1 or 2) in this population.9"
    explanation: >-
      The tumour spectrum, its anatomical restriction and its stage
      distribution. A consensus review's synthesis citing an earlier series,
      not a cohort of its own.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral neuroblastic tumors are identified in 50% of children with OMAS,9 and some have suggested the presence of occult tumor in many more, with spontaneous regression in these cases.14 No clinical characteristics distinguish children with OMAS with and without occult tumor.8"
    explanation: >-
      The proportion with a tumour, the occult-tumour hypothesis for the rest,
      and the fact that the two groups cannot be told apart clinically. The
      occult-tumour explanation is reported as a suggestion, not established.
  downstream:
  - target: Neuroblastoma
    causal_link_type: DIRECT
    description: >-
      The tumour that triggers the syndrome is the same tumour that is its
      fourth diagnostic criterion, so this edge records how the mechanism
      becomes a recorded clinical feature rather than a causal step within
      the nervous system. It is the only route by which the Neuroblastoma
      phenotype enters the graph.
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The trigger is followed by a humoral immune response within the central
      nervous system. The antigen that connects them is not known, which is
      why the steps are unspecified.
- name: Parainfectious Immune Trigger
  description: >-
    In the children in whom no tumour is found, an infection often precedes
    onset. No single organism accounts for it: Mycoplasma, Streptococcus,
    Epstein-Barr virus, adenovirus, human immunodeficiency virus and dengue
    virus have all been reported. An infectious prodrome does not point away
    from a tumour, because it occurs in children who turn out to have one,
    which is why every child presenting with the syndrome is screened
    regardless.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "A variety of infections have been reported in association with OMAS, including Mycoplasma, Streptococcus, Epstein-Barr virus, adenovirus, HIV, and dengue virus, among others,16 suggesting that no single etiologic infectious agent exists."
    explanation: >-
      The range of reported organisms and the review's reading of it: the
      breadth is itself the argument that no one agent is responsible, so
      this node records a class of trigger rather than a named pathogen.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "as an infectious prodrome may occur even in children with underlying tumor,9 all children presenting with OMAS should be screened for peripheral neuroblastic tumor."
    explanation: >-
      Why this node does not substitute for the tumour node: a preceding
      infection is not evidence against a tumour, and the same sentence is
      the basis of the screening row in diagnosis.
  downstream:
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A preceding infection is followed by the same intrathecal humoral
      response seen in the tumour-associated form. The steps between are
      unknown, as they are for the tumour trigger, and no cited source shows
      the two routes converging by the same molecular path.
- name: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
  description: >-
    The immune abnormality is intrathecal and would be missed by routine
    tests. Cerebrospinal fluid leukocyte counts are normal or barely raised
    and commercial serum autoantibody panels are negative, while
    cerebrospinal fluid oligoclonal bands were present in 58 per cent and an
    expanded B-cell frequency in 93 per cent of untreated patients. The
    expansion is in cerebrospinal fluid and not blood, it correlates with
    neurological severity, and it persisted years after onset and
    conventional treatment. In children with neuroblastoma, resecting the
    tumour or giving chemotherapy did not alter the immunological
    abnormalities.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PMID:28959231
    reference_title: "Demographic, Clinical, and Immunologic Features of 389 Children with Opsoclonus-Myoclonus Syndrome: A Cross-sectional Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cerebrospinal fluid (CSF) leukocyte count was minimally elevated in 14% (<=11/mm3) with normal differential, and commercially screened serum autoantibodies were negative, but CSF oligoclonal bands (OCB) and B cells frequency were positive (58 and 93%)."
    explanation: >-
      The central laboratory finding and the reason routine tests mislead:
      normal cell counts and negative commercial antibody panels alongside
      oligoclonal bands and B-cell expansion in most patients.
  - reference: PMID:15136676
    reference_title: "B- and T-cell markers in opsoclonus-myoclonus syndrome: immunophenotyping of CSF lymphocytes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormalities correlated with neurologic severity, as scored blinded from videotapes using a 12-item motor scale, and disease duration. No significant differences were found between tumor and no-tumor groups. In children with neuroblastoma, tumor resection or cancer chemotherapy did not alter immunologic abnormalities."
    explanation: >-
      Three findings at once: the immune abnormality tracks neurological
      severity, it is the same whether or not a tumour is found, and treating
      the tumour does not change it. The severity scoring was blinded, which
      strengthens the correlation.
  - reference: PMID:15136676
    reference_title: "B- and T-cell markers in opsoclonus-myoclonus syndrome: immunophenotyping of CSF lymphocytes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although most children with OMS had normal CSF cell counts, they exhibited expansion of CD19+ B-cell (up to 29%) and gammadelta T-cell (up to 26%) subsets and a lower percentage of CD4+ T-cells and CD4/CD8 ratio, which persisted even years after disease onset and conventional treatments."
    explanation: >-
      Quantifies the lymphocyte subset changes and records that they persist
      for years. It also shows the abnormality is not purely B-cell, which is
      why the knowledge gap below keeps a T-cell-mediated explanation open.
  downstream:
  - target: Cerebellar and Brainstem Saccadic Instability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      An intrathecal humoral response is followed by cerebellar and brainstem
      dysfunction. No antigen or effector mechanism linking them is
      established.
- name: Cerebellar and Brainstem Saccadic Instability
  description: >-
    The clinical signs localise to the cerebellum and brainstem. Opsoclonus
    is attributed to instability in the balance between the brainstem
    omnipause and burst neurons that normally generate saccades; the ataxia
    and dysarthria are cerebellar. Cerebrospinal fluid neurofilament light
    chain was raised by 83 per cent in untreated patients and fell by 60 per
    cent to control levels on combination immunotherapy, which the authors
    read as neuronal or axonal injury that sufficient treatment reduces.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  evidence:
  - reference: PMID:35402641
    reference_title: "Eye Movement Disorders in Movement Disorders."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "thought that opsoclonus is attributed to instability in the fine balance between the omnipause and burst neurons in the brainstem that normally generate the saccadic eye movements"
    explanation: >-
      The localising hypothesis for opsoclonus. The review states it as what
      is thought, citing an earlier source, so it is a mechanistic
      attribution rather than a demonstrated lesion, and is graded INDIRECT.
      The quotation starts and ends inside the sentence because the cached
      text runs the reference markers into the adjacent words, with no space
      on either side.
  - reference: PMID:24342231
    reference_title: "CSF neurofilament light chain is elevated in OMS (decreasing with immunotherapy) and other pediatric neuroinflammatory disorders."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only CSF NFL was elevated in untreated OMS versus controls (+83%). It was 87% higher in OIND than in OMS. On combination treatment with front-loaded ACTH, IVIg, rituximab, median CSF NFL decreased by 60% to control levels."
    explanation: >-
      Biochemical evidence of neuronal or axonal injury and of its reduction
      on treatment. Note the comparison in the middle: the marker was higher
      still in other inflammatory neurological disease, so it is not specific
      to this syndrome.
  downstream:
  - target: Opsoclonus
    causal_link_type: DIRECT
    description: >-
      Loss of the omnipause and burst neuron balance produces back-to-back
      multidirectional saccades.
  - target: Myoclonus
    causal_link_type: DIRECT
    description: Arrhythmic action myoclonus of trunk and limbs.
  - target: Ataxia
    causal_link_type: DIRECT
    description: Cerebellar ataxia, typically truncal, with dysarthria.
  - target: Irritability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Behavioural change is part of the syndrome; its anatomical basis is not
      established in the sources cited here.
  - target: Sleep Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sleep disruption is part of the syndrome; as with the behavioural
      change, no mechanism is established here.
  - target: Dysarthria
    causal_link_type: DIRECT
    description: >-
      Dysarthria is the other cerebellar sign, listed with trunk ataxia in
      the syndrome description.
  - target: Cerebellar Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Atrophy of the vermis and hemispheres appears on imaging years after
      the acute phase, so it is a late structural consequence of the same
      injury the raised neurofilament light chain marks. No cited source
      follows an individual child from the biochemical marker to the
      structural change.
  - target: Cognitive Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The neurofilament light chain result is read by its authors as neuronal
      or axonal injury, which is the available link between the acute
      illness and the cognitive outcome. The link is inferential: no cited
      source relates the marker to later cognitive scores.
  - target: Delayed Speech and Language Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Speech problems accompany the cognitive sequelae in follow-up, and
      expressive language is among the specific deficits reported. As with
      the cognitive edge, the connection to the acute injury is inferred.
  - target: Developmental Regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of already-acquired motor and language skills during the illness,
      related to age at presentation. The age dependence suggests the injury
      acts on skills in the course of being consolidated, but no cited source
      establishes that mechanism.
phenotypes:
- category: Ophthalmologic
  name: Opsoclonus
  description: >-
    Spontaneous, arrhythmic, large-amplitude conjugate saccades in all
    directions of gaze with no intersaccadic interval. The absence of an
    intersaccadic interval is what distinguishes it from nystagmus, which is
    rhythmic. As it settles it may become ocular flutter, bursts of
    horizontal bidirectional back-to-back saccades, and the two can co-occur.
  phenotype_term:
    preferred_term: Opsoclonus
    term:
      id: HP:0010543
      label: Opsoclonus
  evidence:
  - reference: PMID:17480225
    reference_title: "Paraneoplastic neurological syndromes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Opsoclonus is defined by the presence of spontaneous, arrhythmic and large amplitude conjugate saccades"
    explanation: >-
      The formal definition of the sign, which matters because the diagnosis
      turns on recognising it rather than on a test. The quotation stops
      where the cached source wraps the next word across a hyphenated line
      break, so continuing it would not match the text.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "due to saccadic bursts, produces chaotic eye movements, without an intersaccadic interval, unlike nystagmus that is rhythmic and has fast or slow waves depending on the etiology."
    explanation: >-
      Carries the part of the definition that decides the diagnosis at the
      bedside: the absence of an intersaccadic interval, and the explicit
      contrast with nystagmus, which is rhythmic.
  - reference: PMID:35402641
    reference_title: "Eye Movement Disorders in Movement Disorders."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "As it settles, opsoclonus may metamorphose into ocular flutter (bursts of horizontal bidirectional back-to-back saccades without an intersaccadic interval), and opsoclonus and ocular flutter can co-occur in many instances."
    explanation: >-
      Records that the sign evolves, which bears on diagnosis in a child seen
      late or during recovery.
- category: Neurological
  name: Myoclonus
  description: >-
    Arrhythmic action myoclonus, predominantly of the trunk and limbs, and
    sometimes the head. It is one of the cardinal motor features and may
    appear separately from or together with the others.
  phenotype_term:
    preferred_term: Myoclonus
    term:
      id: HP:0001336
      label: Myoclonus
  evidence:
  - reference: PMID:34006622
    reference_title: "Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Opsoclonus-myoclonus syndrome (OMS) is characterized by involuntary, high-frequency, chaotic multidirectional saccadic movements without intersaccadic pauses, and nonrhythmic action myoclonus, often involving the trunk, limbs, and head."
    explanation: >-
      Describes the myoclonus and its distribution as part of the syndrome
      definition.
- category: Neurological
  name: Ataxia
  description: >-
    Cerebellar ataxia, characteristically truncal, often with dysarthria. The
    syndrome sits within the acquired cerebellar ataxias of childhood and is
    distinguished within them by opsoclonus and myoclonus and by the
    neuroblastoma association.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "OMAS falls along the spectrum of acquired cerebellar ataxias of childhood, which may include syndromes presenting purely with ataxia, but is distinct for its paraneoplastic association with neuroblastoma (26%-44%)6,7,10 and the presence of opsoclonus and myoclonus."
    explanation: >-
      Places the ataxia in its differential and names what separates this
      syndrome within it. Note the tumour frequency given here, 26 to 44 per
      cent, is lower than the 50 per cent quoted elsewhere in the same
      review, which is why this entry reports a range across sources rather
      than a single figure.
- category: Behavioral
  name: Irritability
  description: >-
    Behavioural abnormality is one of the four diagnostic features, grouped
    with sleep disturbance in the criteria. Named specifically, it is
    irritability, sleep disturbance and inconsolable crying, and the group is
    frequent, in over half of patients. It is a non-motor feature and may
    appear in the absence of the full motor triad. It also bears on
    treatment: the irritability is why many children do not tolerate
    rehabilitation therapy early in the course.
  phenotype_term:
    preferred_term: Irritability
    term:
      id: HP:0000737
      label: Irritability
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Behavioral abnormalities, including sleep disturbance, irritability, and inconsolable crying, are frequent (over half of patients)."
    explanation: >-
      Names irritability explicitly and gives a frequency, which the criteria
      sentence does not: the criteria say only "behavior change". Cited on
      the sleep phenotype as well, since the sentence covers both.
  - reference: PMID:38689540
    reference_title: "Late cognitive and adaptive outcomes of patients with neuroblastoma-associated opsoclonus-myoclonus-ataxia-syndrome: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can be made when 3 of the following 4 features are present: (1) opsoclonus, (2) ataxia or myoclonus, (3) behavior change or sleep disturbance, and (4) neuroblastoma.1"
    explanation: >-
      Why the feature is diagnostic and not merely common: behaviour change
      and sleep disturbance are the third criterion, as a single item. Quoted
      from this cohort study's introduction, where it restates the published
      criteria, so it is graded BACKGROUND.
- category: Neurological
  name: Sleep Disturbance
  description: >-
    Sleep disruption, often insomnia, is grouped with behaviour change as one
    of the four diagnostic features.
  phenotype_term:
    preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Behavioral abnormalities, including sleep disturbance, irritability, and inconsolable crying, are frequent (over half of patients)."
    explanation: >-
      Names sleep disturbance explicitly and gives the frequency for the
      group it belongs to, which is over half of patients. The figure is for
      the behavioural group as a whole, not for sleep disturbance alone.
  - reference: PMID:38689540
    reference_title: "Late cognitive and adaptive outcomes of patients with neuroblastoma-associated opsoclonus-myoclonus-ataxia-syndrome: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can be made when 3 of the following 4 features are present: (1) opsoclonus, (2) ataxia or myoclonus, (3) behavior change or sleep disturbance, and (4) neuroblastoma.1"
    explanation: >-
      The criteria sentence, cited here for the sleep half of the third
      criterion. The two are one criterion in the published definition.
      Graded BACKGROUND: it sits in this cohort study's introduction and
      restates criteria published elsewhere.
- category: Neoplastic
  name: Neuroblastoma
  description: >-
    An underlying neuroblastoma is the fourth diagnostic feature. It is found
    in about half of children, reported between 26 and 50 per cent across
    sources, and conversely the syndrome occurs in 2 to 3 per cent of
    children with neuroblastoma. Where a tumour is found it is almost always
    early stage.
  phenotype_term:
    preferred_term: Neuroblastoma
    term:
      id: HP:0003006
      label: Neuroblastoma
  evidence:
  - reference: PMID:35378965
    reference_title: "Long-term neurological outcomes of children with neuroblastoma with opsoclonus-myoclonus syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "In 50% of children with OMS, a neuroblastoma (NB) is detected (2); this condition is called NB with OMS (OMS-NB), and OMS occurs in 2-3% of children with NB (3)."
    explanation: >-
      Gives the association in both directions, which is the figure pair this
      entry and the Neuroblastoma entry have to agree on. Quoted from this
      retrospective cohort study's introduction, where both numbers are cited
      to earlier sources rather than measured, so it is graded BACKGROUND.
- category: Neurological
  name: Dysarthria
  description: >-
    Dysarthria accompanies the truncal ataxia as the other cerebellar sign,
    and is listed with it in the syndrome description of the paraneoplastic
    criteria. Loss of speech is also one of the signs parents are asked to
    rank when the order of onset is reconstructed.
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:34006622
    reference_title: "Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional features include cerebellar involvement (dysarthria and trunk ataxia) and encephalopathy (ranging from confusion to coma)."
    explanation: >-
      Names dysarthria as a cerebellar feature of the syndrome alongside
      trunk ataxia, which is why this entry wires it from the cerebellar and
      brainstem node rather than listing it as an independent finding.
- category: Neurological
  name: Cognitive Impairment
  description: >-
    The outcome that matters most, and the reason the consensus review argues
    for early aggressive immunotherapy. Long-term cognitive and speech
    sequelae are reported in up to 75 per cent, good cognitive outcome in
    only 10 to 50 per cent of older series, and the range includes
    intellectual disability, specific learning disability, and deficits in
    attention, expressive language and visuospatial function even at normal
    IQ. What those figures do not settle is the course under treatment; the
    long-term phase in progression carries the one prospectively treated
    cohort, in which function was stable rather than declining.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term sequelae including cognitive impairment and speech problems may be seen in up to 75% of patients but may potentially be mitigated by earlier and more aggressive immunotherapy."
    explanation: >-
      The frequency and the reason it drives management. The mitigation half
      of the sentence is stated as a possibility, not a result, which is why
      this entry does not present early treatment as established to prevent
      it.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The range of cognitive and behavioural sequelae in children with OMAS includes intellectual disability, specific learning disabilities such as dyslexia, as well deficits in attention, expressive language, visuospatial function, and behavioral dysregulation, even in children with normal IQ."
    explanation: >-
      What the impairment consists of, and the clinically important part: a
      normal IQ does not exclude it, so a single global score is not an
      adequate assessment.
- category: Neurological
  name: Delayed Speech and Language Development
  description: >-
    Speech problems travel with the cognitive sequelae in follow-up, and in
    the untreated cross-sectional cohort trouble with speech was recorded in
    over half of the children assessed. Expressive language is among the
    specific deficits reported at normal IQ.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term sequelae including cognitive impairment and speech problems may be seen in up to 75% of patients but may potentially be mitigated by earlier and more aggressive immunotherapy."
    explanation: >-
      The same sentence carries both halves of the sequela, so it is cited on
      the speech phenotype as well as the cognitive one. The 75 per cent is
      for the pair, not for speech alone.
  - reference: PMID:35378965
    reference_title: "Long-term neurological outcomes of children with neuroblastoma with opsoclonus-myoclonus syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "approximately 50–90% of children with OMS-NB have persistent neurological problems, such as late cognitive and neuropsychological sequelae, even after immunological and oncological treatment"
    explanation: >-
      A second, wider frequency range for persistent neurological problems,
      and the point that treatment does not reliably prevent them. Quoted
      from this cohort study's introduction, where it is cited to earlier
      work, so it is graded BACKGROUND.
- category: Neurological
  name: Developmental Regression
  description: >-
    Children lose motor and language skills they had already acquired, and
    how much they lose is related to how old they were at presentation. This
    is distinct from the failure to acquire skills on time, and it is what
    makes the acute illness a developmental event rather than only a
    neurological one.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Many children lose previously acquired motor and language skills, with this regression related to age at presentation."
    explanation: >-
      States the loss of already-acquired skills and its dependence on age at
      onset. The review gives no frequency for it, so this entry gives none.
- category: Neurological
  name: Cerebellar Atrophy
  description: >-
    A late imaging finding rather than an acute one. Brain imaging is
    typically normal during the acute illness; atrophy of the cerebellar
    vermis and hemispheres has been described years later, particularly after
    severe presentations, and atrophy correlates with a higher disease score.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebellar atrophy of the vermis and hemispheres has been described in patients who had follow-up imaging years after the acute phase, particularly in children who had severe presentations."
    explanation: >-
      Locates the atrophy and places it in time. It is follow-up imaging
      after the acute phase, so it belongs with the sequelae rather than with
      the diagnostic features.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging of the brain is typically normal in the acute phase of OMAS, although cerebellar atrophy and cortical volume loss are occasionally seen longitudinally, and atrophy correlates with a higher OMAS score."
    explanation: >-
      The diagnostically important half: normal acute imaging does not
      exclude the syndrome. It also records the correlation with severity and
      that the longitudinal finding is occasional rather than usual.
treatments:
- name: Intravenous Immunoglobulin
  description: >-
    The only randomised prospective therapeutic trial in this disease.
    Children with neuroblastoma-associated opsoclonus-myoclonus-ataxia were
    randomised to prednisone and risk-adapted chemotherapy with or without
    intravenous immunoglobulin. Response was 21 of 26 (80.8 per cent) with it
    against 11 of 27 (40.7 per cent) without. Before this trial, treatment
    rested on case reports. Typical dosing is 2 g/kg over 2 to 5 days then 1
    to 2 g/kg every 4 weeks for up to a year.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pooled human immunoglobulin G for intravenous use
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    description: >-
      Immunoglobulin therapy is directed at the humoral immune process. The
      link records the target; the trial measured a neurological response
      rate, not a change in the intrathecal findings.
  evidence:
  - reference: PMID:29376112
    reference_title: "Intravenous immunoglobulin with prednisone and risk-adapted chemotherapy for children with opsoclonus myoclonus ataxia syndrome associated with neuroblastoma (ANBL00P3): a randomised, open-label, phase 3 trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly higher rates of OMA response were observed in patients randomized to IVIG+ compared to NO-IVIG [21/26=80.8% for IVIG+; 11/27=40.7% for NO-IVIG (odds ratio=6.1; 95% CI: (1.5, 25.9), p=0.0029)]."
    explanation: >-
      The trial's primary result, with the confidence interval. Fifty-three
      patients in total, so the interval is wide, and the comparison is
      against a backbone of prednisone and chemotherapy rather than against
      no treatment.
  - reference: PMID:29376112
    reference_title: "Intravenous immunoglobulin with prednisone and risk-adapted chemotherapy for children with opsoclonus myoclonus ataxia syndrome associated with neuroblastoma (ANBL00P3): a randomised, open-label, phase 3 trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "No previous clinical trial has been conducted for patients with neuroblastoma associated opsoclonus myoclonus ataxia syndrome (OMA), and current treatment is based on case reports."
    explanation: >-
      Why this one trial carries so much weight: everything before it was
      case reports. It also bounds the trial's own scope, which was the
      neuroblastoma-associated form.
- name: Corticosteroids or ACTH
  description: >-
    Corticosteroids or adrenocorticotropic hormone are first-line
    immunotherapy. Two common corticosteroid regimens are pulsed intravenous
    methylprednisolone followed by oral prednisolone, or pulsed oral
    dexamethasone, with several alternatives in use. The claim that ACTH is
    superior to corticosteroids is not well supported, though the expert
    panel notes some refractory patients respond to it; corticosteroids are
    oral and cheaper.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: adrenocorticotropic hormone
      term:
        id: CHEBI:3892
        label: corticotropin
  notes: >-
    No therapeutic_modality is set, deliberately. The row is one clinical
    decision - first-line immunotherapy with a corticosteroid or with
    corticotropin - but the two agents are different therapeutic platforms, a
    small molecule and a peptide hormone, and the slot takes a single value,
    so no value is true of the row. Both agents are bound, so the row stays
    queryable by drug. As of November 2026 the rest of the KB does not agree
    on this pair either: Developmental_And_Epileptic_Encephalopathy_19
    records PEPTIDE for corticotropin with prednisolone, and
    Early-Infantile_Developmental_and_Epileptic_Encephalopathy records
    SMALL_MOLECULE for the same two agents. Splitting the row in two would
    resolve it at the cost of presenting one clinical choice as two.
  target_mechanisms:
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    description: >-
      Immunosuppression is directed at the same immune process. No cited
      source measures its effect on the intrathecal findings.
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Although some providers and studies have suggested that ACTH is superior to corticosteroids, little evidence supports this."
    explanation: >-
      The expert panel's assessment of a widely held view, and the reason
      this entry does not present ACTH as the better option.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment is largely predicated on immune suppression, but there is limited evidence to indicate an optimal regimen."
    explanation: >-
      The overall state of the evidence, which bounds every treatment row in
      this entry.
- name: Rituximab
  description: >-
    B-cell depletion, used in the aggressive multi-agent approach and as
    escalation in the stepwise one. The supporting evidence is indirect: an
    open-label study of 12 patients suggesting fewer relapses when combined
    with ACTH and immunoglobulin, higher IQ in a modern cohort where most
    received it against a historical cohort where none did, and shorter
    corticosteroid and immunoglobulin exposure in those given it. One study
    found better outcomes when it was given within 12 months of onset.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    description: >-
      B-cell depletion is the treatment most directly aimed at the mechanism
      this entry records, which is part of why the B-cell findings matter.
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The potential effectiveness of rituximab in OMAS is supported by (1) an open-label study of 12 patients suggesting a reduction in relapse rate when combined with ACTH and IVIg,50 (2) higher IQ in a modern cohort (in which 11/15 received rituximab) compared with a historical cohort (in which 0/23 received rituximab),4 and (3) reduction in the duration of corticosteroid and IVIg treatment in those given rituximab.48"
    explanation: >-
      The review's own enumeration of the evidence, and its weakness is on
      the face of it: an open-label study of twelve, a historical-cohort
      comparison, and a treatment-duration observation. Graded INDIRECT
      because none of the three measures the drug's effect directly.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "One study showed that 15 patients who received rituximab within 12 months of OMAS onset were more likely to achieve a good response (defined as modified Rankin score 0-2) compared with 16 patients who received it later.5"
    explanation: >-
      The timing observation. Thirty-one patients split by when they happened
      to receive the drug, so the comparison is not randomised and earlier
      treatment may mark milder or better-recognised disease.
- name: Tumour Resection
  description: >-
    Where a neuroblastic tumour is found it is resected, but resection does
    not treat the neurological disease. In one series resection was
    insufficient as treatment in 58 per cent, and in another neither
    resection nor chemotherapy altered the immunological abnormalities. This
    is the most important practical point in the entry: finding and removing
    the tumour does not resolve the syndrome.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:28959231
    reference_title: "Demographic, Clinical, and Immunologic Features of 389 Children with Opsoclonus-Myoclonus Syndrome: A Cross-sectional Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remote neuroblastic tumors were detected in 50%; resection was insufficient OMS treatment (58%)."
    explanation: >-
      Records both the tumour frequency and that resection alone was
      insufficient in the majority. The 58 per cent is of those with a
      resected tumour.
  - reference: PMID:15136676
    reference_title: "B- and T-cell markers in opsoclonus-myoclonus syndrome: immunophenotyping of CSF lymphocytes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In children with neuroblastoma, tumor resection or cancer chemotherapy did not alter immunologic abnormalities."
    explanation: >-
      The mechanistic counterpart: treating the tumour leaves the immune
      abnormality in place, which is consistent with resection not resolving
      the neurological disease.
- name: Physical, Occupational and Speech Therapy
  description: >-
    Recommended for every patient, not only those with established deficits,
    because the neurological illness arrives during the period in which motor
    and language skills are being acquired and children lose skills they had.
    Many will not tolerate therapy early in the course, on account of the
    irritability, so the recommendation is for ongoing rather than immediate
    therapy. Psychological support and behavioural therapy are often needed
    as well, and neurocognitive testing at school age is advised.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: ongoing physical, occupational and speech therapy
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Ongoing physical, occupational, and speech therapy should be recommended for all patients with OMAS, although many children will not tolerate therapies early in the course due to irritability."
    explanation: >-
      The recommendation and its practical limit in one sentence. The second
      half is why this row is not presented as an acute intervention.
diagnosis:
- name: Cerebrospinal Fluid Oligoclonal Bands and B-Cell Frequency
  description: >-
    The tests that detect the immune process are not the routine ones.
    Oligoclonal bands and cerebrospinal fluid B-cell frequency were positive
    in 58 and 93 per cent of untreated patients, while routine cerebrospinal
    fluid studies showed little or no pleocytosis and commercial antibody
    panels were negative. Other cerebrospinal fluid markers, neopterin and
    several cytokines and chemokines, correlate with disease activity but are
    not specific.
  diagnosis_term:
    preferred_term: cerebrospinal fluid analysis
  notes: >-
    No diagnosis_term is bound. A label search of NCIT through the OLS4 API
    on 30 Oct 2026 found no clinical action term under NCIT:C25218 for
    oligoclonal band testing or cerebrospinal fluid B-cell quantification,
    and binding a generic lumbar puncture or laboratory term would lose what
    this row is about, which is that the specific tests matter and the
    routine ones mislead.
  evidence:
  - reference: PMID:28959231
    reference_title: "Demographic, Clinical, and Immunologic Features of 389 Children with Opsoclonus-Myoclonus Syndrome: A Cross-sectional Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "OMS neuroinflammation is best diagnosed by CSF OCB and B cells, not by routine CSF or commercial antibody studies."
    explanation: >-
      The study's own conclusion about which tests to use, stated as a
      recommendation from its findings.
  - reference: PMID:28959231
    reference_title: "Demographic, Clinical, and Immunologic Features of 389 Children with Opsoclonus-Myoclonus Syndrome: A Cross-sectional Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "A critical observation was that routine CSF tests, which showed little or no pleocytosis, missed the presence of neuroinflammation and immune cell dysregulation in OMS."
    explanation: >-
      States the failure mode directly: a normal routine cerebrospinal fluid
      result does not exclude the neuroinflammation.
- name: Screening for a Peripheral Neuroblastic Tumour
  description: >-
    Every child presenting with the syndrome is screened for a peripheral
    neuroblastic tumour, whether or not an infection preceded onset. Whole
    body imaging from neck to pelvis, covering the sympathetic chain and the
    adrenals, is the gold standard; chest radiography and abdominal
    ultrasound alone are inadequate. Urine homovanillic and vanillylmandelic
    acid may be measured first but are very insensitive here, because the
    tumours associated with this syndrome are small and minimally secreting,
    with a yield as low as 24 per cent, so a negative urine result does not
    exclude a tumour. MIBG scintigraphy has a false-negative rate of about 8
    per cent, higher in the more differentiated tumours that are the ones
    this syndrome tends to accompany. A negative first screen is not final:
    repeat imaging at about 6 months is practical and should find most of the
    tumours missed first time.
  diagnosis_term:
    preferred_term: screening for an underlying neuroblastic tumour
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "all children presenting with OMAS should be screened for peripheral neuroblastic tumor."
    explanation: >-
      The recommendation itself, which is what makes this a diagnostic step
      rather than a finding. It applies to every child, which is the point:
      no clinical feature selects who to image.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "whole body imaging from the neck to pelvis, covering the wide range of possible tumor sites including the adrenals and the entire neural crest, has become the gold standard for detecting neuroblastic tumor in OMA."
    explanation: >-
      Which test, and why the field is that wide: the tumours follow the
      neural crest, so a scan of one body region can miss them.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Chest x ray and abdominal ultrasound alone are inadequate for detecting underlying neuroblastoma due to lower yields than other imaging modalities such as MRI, CT, and radioisotope imaging."
    explanation: >-
      States what is not sufficient, which is the commoner error than
      omitting screening altogether.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "urine VMA screening alone is inadequate to exclude neuroblastoma."
    explanation: >-
      The negative-result trap for the cheapest test. The review gives the
      reason in the preceding sentences: the tumours are small and minimally
      secreting, with a yield as low as 24 per cent.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "the false-negative rate of MIBG scintigraphy is around 8% and even higher in tumors with more differentiated pathology, and those are often associated with OMAS."
    explanation: >-
      The failure rate of the specific scan, and why it is worse in this
      syndrome than in neuroblastoma generally: the tumours here are the
      differentiated ones.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The optimal timing and duration of repeat imaging has not been established, but repeat imaging at 6 months is practical and should detect the majority of tumors that may have been missed at first screening."
    explanation: >-
      The repeat interval, quoted with the review's own caveat that it is
      practical rather than established, so this entry does not present 6
      months as a validated schedule.
discussions:
- discussion_id: oms_antigen_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the antigen of the intrathecal humoral response in
    opsoclonus-myoclonus syndrome, and is the driving process humoral at all
    rather than T-cell mediated?
  attaches_to:
  - pathophysiology#Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
  rationale: >-
    This is the gap that keeps the mechanism in this entry incomplete
    between its second and third nodes, and it is why both edges there are
    typed as indirect with unknown intermediates. The immune abnormality is
    well characterised and reproducible; its target is not. Commercial
    paraneoplastic antibody panels are negative, including the whole standard
    list, and no reproducible antigenic target has been established despite
    reports of patient immunoglobulin binding to Purkinje cells and
    cerebellar dendritic arborisations. The one exception is outside the
    paediatric disease: Ri/ANNA2 antibodies in opsoclonus-myoclonus with
    breast cancer. A pathogenic autoantibody would both explain the syndrome
    and give it a biomarker, and the alternative, that the driving process is
    T-cell mediated, is harder to pursue and is kept open here by the
    gammadelta T-cell expansion and altered CD4 to CD8 ratio reported
    alongside the B-cell findings. No current biomarker discriminates
    paraneoplastic from idiopathic cases.
  evidence:
  - reference: PMID:28959231
    reference_title: "Demographic, Clinical, and Immunologic Features of 389 Children with Opsoclonus-Myoclonus Syndrome: A Cross-sectional Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the following paraneoplastic antibodies were found: anti-neuronal nuclear (types-1, 2, 3), anti-glial nuclear (type 1), Purkinje cell cytoplasmic (types 1, 2, and Tr), amphiphysin, NMDAR, AMPAR, GABA-B, CRMP-5, or calcium channel (N1 or P/Q-type)."
    explanation: >-
      The negative result in full, which is what makes the gap a real one
      rather than an untested possibility: the standard paraneoplastic panel
      was comprehensively negative in this cohort.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "An alternate explanation is that the driving autoimmune process is T cell mediated, resulting in greater challenges from a discovery and biomarker perspective."
    explanation: >-
      The alternative hypothesis, stated by the consensus review, and the
      reason this entry does not commit to a humoral mechanism beyond the
      findings it records.
  - reference: PMID:26856612
    reference_title: "Clinical and Immunological Features of Opsoclonus-Myoclonus Syndrome in the Era of Neuronal Cell Surface Antibodies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, with the exception of Ri/ANNA2 antibodies in patients with OMS and breast cancer, the search for other antibodies specific for OMS has not revealed a common biomarker of the disease.8,9"
    explanation: >-
      Records the one antibody association that is established, in adult
      breast-cancer-associated disease, and that no common biomarker has been
      found otherwise. This is the sentence that keeps the adult form out of
      this entry's subtypes. Graded BACKGROUND: it is a framing statement in
      this cohort study's introduction, citing earlier work, not a result of
      the study itself.
progression:
- phase: Acute or subacute onset
  age_range: Mean 18 months and median 16.5 months in population studies; the
    great majority before age 5 years, and no case after age 10 in the largest
    published series
  notes: >-
    Onset is acute or subacute in over half of children. The first sign is
    often not the one the syndrome is named for: ataxia, seen as staggering
    and falling, may come first with opsoclonus appearing later, and
    opsoclonus can be transient and hard to catch on examination. That order
    is why the diagnosis is delayed and why smartphone video from the family
    is useful.

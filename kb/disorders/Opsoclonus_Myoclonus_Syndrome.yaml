name: Opsoclonus-Myoclonus Syndrome
creation_date: '2026-10-30T18:00:00Z'
description: >-
  Opsoclonus-myoclonus syndrome, also called opsoclonus-myoclonus-ataxia
  syndrome, dancing eyes syndrome or Kinsbourne syndrome, is a rare
  immune-mediated disorder of childhood whose cardinal features are
  opsoclonus, myoclonus, ataxia and disturbance of behaviour and sleep. An
  expert panel allows the diagnosis when three of four features are present:
  opsoclonus, ataxia or myoclonus, behaviour change or sleep disturbance, and
  neuroblastoma.

  Opsoclonus is the defining sign and is specific in form rather than merely
  in appearance: spontaneous, arrhythmic, large-amplitude conjugate saccades
  in all directions of gaze with no intersaccadic interval, which is what
  separates it from nystagmus. As it settles it may become ocular flutter.
  It is attributed to instability in the balance between brainstem omnipause
  and burst neurons that normally generate saccades.

  About half of affected children have an underlying peripheral neuroblastic
  tumour, most often neuroblastoma, and in the other direction the syndrome
  occurs in 2 to 3 per cent of children with neuroblastoma. The tumours are
  never intracranial and are usually early stage. Resecting the tumour does
  not treat the neurological disease.

  The immune basis is better established than its target. Routine
  cerebrospinal fluid studies are usually normal and commercial autoantibody
  panels usually negative, while cerebrospinal fluid oligoclonal bands and an
  expanded B-cell population are present in most untreated patients and
  correlate with neurological severity. No reproducible antigen has been
  identified, which remains the central unknown and is recorded as a
  knowledge gap. Treatment is immunotherapy, and the only randomised trial in
  the disease showed that adding intravenous immunoglobulin to prednisone and
  risk-adapted chemotherapy raised the response rate from 41 to 81 per cent.
categories:
- Neurological Disorder
- Paraneoplastic Syndrome
- Autoimmune Disease
synonyms:
- OMS
- OMAS
- opsoclonus-myoclonus-ataxia syndrome
- dancing eyes syndrome
- Kinsbourne syndrome
notes: >-
  Scope. This entry curates the syndrome as a disease in its own right. Its
  neuroblastoma side is curated in Neuroblastoma, which records it as a
  paraneoplastic phenotype with its own immune chain, and the paraneoplastic
  side in Paraneoplastic_Neurological_Syndromes. Those two entries and this
  one describe the same association from three directions and should agree;
  where they quote the same sentence they are graded the same way.

  A pointer subtype in Paraneoplastic_Neurological_Syndromes would link that
  entry to this one, and is deliberately left for a follow-up rather than
  done here: that file is shared with another curation lane, and this entry
  does not need it to stand.

  The adult paraneoplastic form is not separately modelled. The sources
  cited here are paediatric, and the one adult-specific statement found,
  that Ri/ANNA2 antibodies occur in opsoclonus-myoclonus with breast cancer,
  is recorded in the knowledge-gap discussion rather than as a subtype,
  because nothing cited here characterises the adult form as a whole.
disease_term:
  preferred_term: opsoclonus-myoclonus syndrome
  term:
    id: MONDO:0015247
    label: opsoclonus-myoclonus syndrome
pathophysiology:
- name: Neuroblastic Tumour or Other Immune Trigger
  description: >-
    In about half of children a peripheral neuroblastic tumour is found,
    neuroblastoma in 73 per cent of those, ganglioneuroblastoma in 22 per
    cent and ganglioneuroma in 4 per cent. The tumours lie along the
    sympathetic chain or in the adrenals and are never intracranial, and 93
    per cent of the neuroblastomas are stage 1 or 2. In the other half no
    tumour is found; occult tumour with spontaneous regression has been
    proposed, and no clinical feature distinguishes the two groups.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroblastoma (73%) is the most common tumor type, followed by ganglioneuroblastoma (22%) and ganglioneuroma (4%). The tumors are never in the brain: all are located along the sympathetic chain or in the adrenals, including the neck, thoracic, abdominal, or pelvic cavities.9 Notably, 93% of neuroblastoma is early stage (stage 1 or 2) in this population.9"
    explanation: >-
      The tumour spectrum, its anatomical restriction and its stage
      distribution. A consensus review's synthesis citing an earlier series,
      not a cohort of its own.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral neuroblastic tumors are identified in 50% of children with OMAS,9 and some have suggested the presence of occult tumor in many more, with spontaneous regression in these cases.14 No clinical characteristics distinguish children with OMAS with and without occult tumor.8"
    explanation: >-
      The proportion with a tumour, the occult-tumour hypothesis for the rest,
      and the fact that the two groups cannot be told apart clinically. The
      occult-tumour explanation is reported as a suggestion, not established.
  downstream:
  - target: Neuroblastoma
    causal_link_type: DIRECT
    description: >-
      Where the trigger is a neuroblastic tumour, the tumour is itself a
      clinical feature of the syndrome and the fourth of its four diagnostic
      criteria. The edge records that relation rather than a causal step
      within the nervous system.
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The trigger is followed by a humoral immune response within the central
      nervous system. The antigen that connects them is not known, which is
      why the steps are unspecified.
- name: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
  description: >-
    The immune abnormality is intrathecal and would be missed by routine
    tests. Cerebrospinal fluid leukocyte counts are normal or barely raised
    and commercial serum autoantibody panels are negative, while
    cerebrospinal fluid oligoclonal bands were present in 58 per cent and an
    expanded B-cell frequency in 93 per cent of untreated patients. The
    expansion is in cerebrospinal fluid and not blood, it correlates with
    neurological severity, and it persisted years after onset and
    conventional treatment. In children with neuroblastoma, resecting the
    tumour or giving chemotherapy did not alter the immunological
    abnormalities.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PMID:28959231
    reference_title: "Demographic, Clinical, and Immunologic Features of 389 Children with Opsoclonus-Myoclonus Syndrome: A Cross-sectional Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cerebrospinal fluid (CSF) leukocyte count was minimally elevated in 14% (<=11/mm3) with normal differential, and commercially screened serum autoantibodies were negative, but CSF oligoclonal bands (OCB) and B cells frequency were positive (58 and 93%)."
    explanation: >-
      The central laboratory finding and the reason routine tests mislead:
      normal cell counts and negative commercial antibody panels alongside
      oligoclonal bands and B-cell expansion in most patients.
  - reference: PMID:15136676
    reference_title: "B- and T-cell markers in opsoclonus-myoclonus syndrome: immunophenotyping of CSF lymphocytes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormalities correlated with neurologic severity, as scored blinded from videotapes using a 12-item motor scale, and disease duration. No significant differences were found between tumor and no-tumor groups. In children with neuroblastoma, tumor resection or cancer chemotherapy did not alter immunologic abnormalities."
    explanation: >-
      Three findings at once: the immune abnormality tracks neurological
      severity, it is the same whether or not a tumour is found, and treating
      the tumour does not change it. The severity scoring was blinded, which
      strengthens the correlation.
  - reference: PMID:15136676
    reference_title: "B- and T-cell markers in opsoclonus-myoclonus syndrome: immunophenotyping of CSF lymphocytes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although most children with OMS had normal CSF cell counts, they exhibited expansion of CD19+ B-cell (up to 29%) and gammadelta T-cell (up to 26%) subsets and a lower percentage of CD4+ T-cells and CD4/CD8 ratio, which persisted even years after disease onset and conventional treatments."
    explanation: >-
      Quantifies the lymphocyte subset changes and records that they persist
      for years. It also shows the abnormality is not purely B-cell, which is
      why the knowledge gap below keeps a T-cell-mediated explanation open.
  downstream:
  - target: Cerebellar and Brainstem Saccadic Instability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      An intrathecal humoral response is followed by cerebellar and brainstem
      dysfunction. No antigen or effector mechanism linking them is
      established.
- name: Cerebellar and Brainstem Saccadic Instability
  description: >-
    The clinical signs localise to the cerebellum and brainstem. Opsoclonus
    is attributed to instability in the balance between the brainstem
    omnipause and burst neurons that normally generate saccades; the ataxia
    and dysarthria are cerebellar. Cerebrospinal fluid neurofilament light
    chain was raised by 83 per cent in untreated patients and fell by 60 per
    cent to control levels on combination immunotherapy, which the authors
    read as neuronal or axonal injury that sufficient treatment reduces.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:35402641
    reference_title: "Eye Movement Disorders in Movement Disorders."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "It is thought that opsoclonus is attributed to instability in the fine balance between the omnipause and burst neurons in the brainstem that normally generate the saccadic eye movements.108"
    explanation: >-
      The localising hypothesis for opsoclonus. The review states it as what
      is thought, citing an earlier source, so it is a mechanistic
      attribution rather than a demonstrated lesion, and is graded INDIRECT.
  - reference: PMID:24342231
    reference_title: "CSF neurofilament light chain is elevated in OMS (decreasing with immunotherapy) and other pediatric neuroinflammatory disorders."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only CSF NFL was elevated in untreated OMS versus controls (+83%). It was 87% higher in OIND than in OMS. On combination treatment with front-loaded ACTH, IVIg, rituximab, median CSF NFL decreased by 60% to control levels."
    explanation: >-
      Biochemical evidence of neuronal or axonal injury and of its reduction
      on treatment. Note the comparison in the middle: the marker was higher
      still in other inflammatory neurological disease, so it is not specific
      to this syndrome.
  downstream:
  - target: Opsoclonus
    causal_link_type: DIRECT
    description: >-
      Loss of the omnipause and burst neuron balance produces back-to-back
      multidirectional saccades.
  - target: Myoclonus
    causal_link_type: DIRECT
    description: Arrhythmic action myoclonus of trunk and limbs.
  - target: Ataxia
    causal_link_type: DIRECT
    description: Cerebellar ataxia, typically truncal, with dysarthria.
  - target: Irritability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Behavioural change is part of the syndrome; its anatomical basis is not
      established in the sources cited here.
  - target: Sleep Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sleep disruption is part of the syndrome; as with the behavioural
      change, no mechanism is established here.
phenotypes:
- category: Ophthalmologic
  name: Opsoclonus
  description: >-
    Spontaneous, arrhythmic, large-amplitude conjugate saccades in all
    directions of gaze with no intersaccadic interval. The absence of an
    intersaccadic interval is what distinguishes it from nystagmus, which is
    rhythmic. As it settles it may become ocular flutter, bursts of
    horizontal bidirectional back-to-back saccades, and the two can co-occur.
  phenotype_term:
    preferred_term: Opsoclonus
    term:
      id: HP:0010543
      label: Opsoclonus
  evidence:
  - reference: PMID:17480225
    reference_title: "Paraneoplastic neurological syndromes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Opsoclonus is defined by the presence of spontaneous, arrhythmic and large amplitude conjugate saccades"
    explanation: >-
      The formal definition of the sign, which matters because the diagnosis
      turns on recognising it rather than on a test. The quotation stops
      where the cached source wraps the next word across a hyphenated line
      break, so continuing it would not match the text.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "due to saccadic bursts, produces chaotic eye movements, without an intersaccadic interval, unlike nystagmus that is rhythmic and has fast or slow waves depending on the etiology."
    explanation: >-
      Carries the part of the definition that decides the diagnosis at the
      bedside: the absence of an intersaccadic interval, and the explicit
      contrast with nystagmus, which is rhythmic.
  - reference: PMID:35402641
    reference_title: "Eye Movement Disorders in Movement Disorders."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "As it settles, opsoclonus may metamorphose into ocular flutter (bursts of horizontal bidirectional back-to-back saccades without an intersaccadic interval), and opsoclonus and ocular flutter can co-occur in many instances."
    explanation: >-
      Records that the sign evolves, which bears on diagnosis in a child seen
      late or during recovery.
- category: Neurological
  name: Myoclonus
  description: >-
    Arrhythmic action myoclonus, predominantly of the trunk and limbs, and
    sometimes the head. It is one of the cardinal motor features and may
    appear separately from or together with the others.
  phenotype_term:
    preferred_term: Myoclonus
    term:
      id: HP:0001336
      label: Myoclonus
  evidence:
  - reference: PMID:34006622
    reference_title: "Updated Diagnostic Criteria for Paraneoplastic Neurologic Syndromes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Opsoclonus-myoclonus syndrome (OMS) is characterized by involuntary, high-frequency, chaotic multidirectional saccadic movements without intersaccadic pauses, and nonrhythmic action myoclonus, often involving the trunk, limbs, and head."
    explanation: >-
      Describes the myoclonus and its distribution as part of the syndrome
      definition.
- category: Neurological
  name: Ataxia
  description: >-
    Cerebellar ataxia, characteristically truncal, often with dysarthria. The
    syndrome sits within the acquired cerebellar ataxias of childhood and is
    distinguished within them by opsoclonus and myoclonus and by the
    neuroblastoma association.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "OMAS falls along the spectrum of acquired cerebellar ataxias of childhood, which may include syndromes presenting purely with ataxia, but is distinct for its paraneoplastic association with neuroblastoma (26%-44%)6,7,10 and the presence of opsoclonus and myoclonus."
    explanation: >-
      Places the ataxia in its differential and names what separates this
      syndrome within it. Note the tumour frequency given here, 26 to 44 per
      cent, is lower than the 50 per cent quoted elsewhere in the same
      review, which is why this entry reports a range across sources rather
      than a single figure.
- category: Behavioral
  name: Irritability
  description: >-
    Behavioural change, characteristically irritability, is one of the four
    diagnostic features and is grouped with sleep disturbance in the
    criteria. It is a non-motor feature and may appear in the absence of the
    full motor triad.
  phenotype_term:
    preferred_term: Irritability
    term:
      id: HP:0000737
      label: Irritability
  evidence:
  - reference: PMID:38689540
    reference_title: "Late cognitive and adaptive outcomes of patients with neuroblastoma-associated opsoclonus-myoclonus-ataxia-syndrome: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can be made when 3 of the following 4 features are present: (1) opsoclonus, (2) ataxia or myoclonus, (3) behavior change or sleep disturbance, and (4) neuroblastoma.1"
    explanation: >-
      The diagnostic criteria, which is where behaviour change and sleep
      disturbance enter as a single criterion. Cited here for the behavioural
      half and on the sleep phenotype for the other.
- category: Neurological
  name: Sleep Disturbance
  description: >-
    Sleep disruption, often insomnia, is grouped with behaviour change as one
    of the four diagnostic features.
  phenotype_term:
    preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: PMID:38689540
    reference_title: "Late cognitive and adaptive outcomes of patients with neuroblastoma-associated opsoclonus-myoclonus-ataxia-syndrome: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can be made when 3 of the following 4 features are present: (1) opsoclonus, (2) ataxia or myoclonus, (3) behavior change or sleep disturbance, and (4) neuroblastoma.1"
    explanation: >-
      The same criteria sentence, cited here for the sleep half of the third
      criterion. The two are one criterion in the published definition, which
      is why neither phenotype carries a frequency of its own.
- category: Neoplastic
  name: Neuroblastoma
  description: >-
    An underlying neuroblastoma is the fourth diagnostic feature. It is found
    in about half of children, reported between 26 and 50 per cent across
    sources, and conversely the syndrome occurs in 2 to 3 per cent of
    children with neuroblastoma. Where a tumour is found it is almost always
    early stage.
  phenotype_term:
    preferred_term: Neuroblastoma
    term:
      id: HP:0003006
      label: Neuroblastoma
  evidence:
  - reference: PMID:35378965
    reference_title: "Long-term neurological outcomes of children with neuroblastoma with opsoclonus-myoclonus syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In 50% of children with OMS, a neuroblastoma (NB) is detected (2); this condition is called NB with OMS (OMS-NB), and OMS occurs in 2-3% of children with NB (3)."
    explanation: >-
      Gives the association in both directions, which is the figure pair this
      entry and the Neuroblastoma entry have to agree on. Both numbers are
      cited to earlier sources rather than measured here.
treatments:
- name: Intravenous Immunoglobulin
  description: >-
    The only randomised prospective therapeutic trial in this disease.
    Children with neuroblastoma-associated opsoclonus-myoclonus-ataxia were
    randomised to prednisone and risk-adapted chemotherapy with or without
    intravenous immunoglobulin. Response was 21 of 26 (80.8 per cent) with it
    against 11 of 27 (40.7 per cent) without. Before this trial, treatment
    rested on case reports. Typical dosing is 2 g/kg over 2 to 5 days then 1
    to 2 g/kg every 4 weeks for up to a year.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    description: >-
      Immunoglobulin therapy is directed at the humoral immune process. The
      link records the target; the trial measured a neurological response
      rate, not a change in the intrathecal findings.
  evidence:
  - reference: PMID:29376112
    reference_title: "Intravenous immunoglobulin with prednisone and risk-adapted chemotherapy for children with opsoclonus myoclonus ataxia syndrome associated with neuroblastoma (ANBL00P3): a randomised, open-label, phase 3 trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly higher rates of OMA response were observed in patients randomized to IVIG+ compared to NO-IVIG [21/26=80.8% for IVIG+; 11/27=40.7% for NO-IVIG (odds ratio=6.1; 95% CI: (1.5, 25.9), p=0.0029)]."
    explanation: >-
      The trial's primary result, with the confidence interval. Fifty-three
      patients in total, so the interval is wide, and the comparison is
      against a backbone of prednisone and chemotherapy rather than against
      no treatment.
  - reference: PMID:29376112
    reference_title: "Intravenous immunoglobulin with prednisone and risk-adapted chemotherapy for children with opsoclonus myoclonus ataxia syndrome associated with neuroblastoma (ANBL00P3): a randomised, open-label, phase 3 trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "No previous clinical trial has been conducted for patients with neuroblastoma associated opsoclonus myoclonus ataxia syndrome (OMA), and current treatment is based on case reports."
    explanation: >-
      Why this one trial carries so much weight: everything before it was
      case reports. It also bounds the trial's own scope, which was the
      neuroblastoma-associated form.
- name: Corticosteroids or ACTH
  description: >-
    Corticosteroids or adrenocorticotropic hormone are first-line
    immunotherapy. Two common corticosteroid regimens are pulsed intravenous
    methylprednisolone followed by oral prednisolone, or pulsed oral
    dexamethasone, with several alternatives in use. The claim that ACTH is
    superior to corticosteroids is not well supported, though the expert
    panel notes some refractory patients respond to it; corticosteroids are
    oral and cheaper.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    description: >-
      Immunosuppression is directed at the same immune process. No cited
      source measures its effect on the intrathecal findings.
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Although some providers and studies have suggested that ACTH is superior to corticosteroids, little evidence supports this."
    explanation: >-
      The expert panel's assessment of a widely held view, and the reason
      this entry does not present ACTH as the better option.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment is largely predicated on immune suppression, but there is limited evidence to indicate an optimal regimen."
    explanation: >-
      The overall state of the evidence, which bounds every treatment row in
      this entry.
- name: Rituximab
  description: >-
    B-cell depletion, used in the aggressive multi-agent approach and as
    escalation in the stepwise one. The supporting evidence is indirect: an
    open-label study of 12 patients suggesting fewer relapses when combined
    with ACTH and immunoglobulin, higher IQ in a modern cohort where most
    received it against a historical cohort where none did, and shorter
    corticosteroid and immunoglobulin exposure in those given it. One study
    found better outcomes when it was given within 12 months of onset.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
    description: >-
      B-cell depletion is the treatment most directly aimed at the mechanism
      this entry records, which is part of why the B-cell findings matter.
  evidence:
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The potential effectiveness of rituximab in OMAS is supported by (1) an open-label study of 12 patients suggesting a reduction in relapse rate when combined with ACTH and IVIg,50 (2) higher IQ in a modern cohort (in which 11/15 received rituximab) compared with a historical cohort (in which 0/23 received rituximab),4 and (3) reduction in the duration of corticosteroid and IVIg treatment in those given rituximab.48"
    explanation: >-
      The review's own enumeration of the evidence, and its weakness is on
      the face of it: an open-label study of twelve, a historical-cohort
      comparison, and a treatment-duration observation. Graded INDIRECT
      because none of the three measures the drug's effect directly.
  - reference: PMID:35260471
    reference_title: "Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International Perspective."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "One study showed that 15 patients who received rituximab within 12 months of OMAS onset were more likely to achieve a good response (defined as modified Rankin score 0-2) compared with 16 patients who received it later.5"
    explanation: >-
      The timing observation. Thirty-one patients split by when they happened
      to receive the drug, so the comparison is not randomised and earlier
      treatment may mark milder or better-recognised disease.
- name: Tumour Resection
  description: >-
    Where a neuroblastic tumour is found it is resected, but resection does
    not treat the neurological disease. In one series resection was
    insufficient as treatment in 58 per cent, and in another neither
    resection nor chemotherapy altered the immunological abnormalities. This
    is the most important practical point in the entry: finding and removing
    the tumour does not resolve the syndrome.
  action_category: THERAPEUTIC

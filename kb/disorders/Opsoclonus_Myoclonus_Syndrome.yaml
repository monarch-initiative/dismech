    evidence_source: HUMAN_CLINICAL
    snippet: "A decision to initiate tapering of treatment should be strongly guided by the symptoms of OMAS, and reduction of therapy avoided while a patient remains symptomatic."
    explanation: >-
      How the transition is managed, and the reason treatment runs long: the
      symptoms, not a fixed duration, set the taper.
- phase: Relapsing course
  notes: >-
    Relapses were reported in over half of cases in one series, and are
    typically triggered by infection, usually a common viral infection, or by
    a reduction in immunotherapy. They remain possible years later and have
    been reported decades later, with specific stresses such as pregnancy.
    This is the reason sustained remission is never taken to be permanent and
    the reason treatment is not stopped early.

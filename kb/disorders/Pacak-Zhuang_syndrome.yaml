      quote_role: BACKGROUND
      snippet: >-
        Pheochromocytomas (PHEOs) and paragangliomas (PGLs) are rare
        catecholamine-producing neuroendocrine tumors (NETs) arising in or outside
        the adrenal medulla, respectively (Lenders et al. 2005).
      explanation: Directly classifies the syndrome-defining pheochromocytoma/paraganglioma spectrum as neuroendocrine neoplasms.
notes: >-
  Obligate somatic mosaicism and allelic scope: Pacak-Zhuang syndrome
  (MONDO:0017926) arises from early postzygotic somatic mosaic gain-of-function
  variants clustering near the oxygen-sensing Pro531 hydroxylation motif of
  EPAS1 (HIF-2alpha), producing multi-lineage involvement across neural
  crest-derived chromaffin/paraganglionic tissues, duodenal D-cells, and
  erythropoietin-producing lineages. Germline gain-of-function EPAS1 variants
  cause familial erythrocytosis type 4 (ECYT4; OMIM 611783), typically
  presenting as isolated erythrocytosis (or less commonly with paraganglioma)
  rather than the full polycythemia-paraganglioma-duodenal somatostatinoma
  triad, and ClinGen carries no gene-disease validity curation specific to
  MONDO:0017926. No GeneReviews chapter exists for Pacak-Zhuang syndrome
  specifically (the Hereditary Paraganglioma-Pheochromocytoma Syndromes chapter
  covers germline SDHx/MAX/TMEM127 predisposition).
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0017926
      label: multiple paragangliomas associated with polycythemia
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0017926 lists Pacak-Zhuang syndrome, EPAS1 gain-of-function
      mutation syndrome and paraganglioma-somatostatinoma-polycythemia
      syndrome as synonyms, and defines the class as a syndrome caused by
      early postzygotic mosaic gain-of-function mutations in EPAS1, which is
      this entry's scope. MONDO:0035540
      pheochromocytoma-paraganglioma names only the syndrome's tumour
      component.
inheritance:
- name: Somatic Mosaicism
  inheritance_term:
    preferred_term: Somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    Pacak-Zhuang syndrome is caused by early postzygotic somatic gain-of-function
    mutations in EPAS1 rather than inherited germline variation. Mosaic
    distribution across tissues explains variable organ involvement and the
    non-Mendelian recurrence pattern.
  evidence:
  - reference: PMID:37450881
    reference_title: "Pacak-Zhuang syndrome: a model providing new insights into tumor syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we review our initial identification of a new syndrome of multiple
      paragangliomas, somatostatinomas, and polycythemia caused by early
      postzygotic mosaic mutations in EPAS1, encoding hypoxia-inducible factor 2
      alpha (HIF-2α)
    explanation: >-
      Review article explicitly defines the syndrome as an early postzygotic
      mosaic EPAS1 disorder.
  - reference: PMID:27679736
    reference_title: "Novel insights into the polycythemia-paraganglioma-somatostatinoma syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six females and one male presented at a median age of 28 years (range
      11-46). Two were found to have HIF2A somatic mosaicism. No relatives were
      affected.
    explanation: >-
      Clinical series supports somatic mosaic, non-familial disease causation.

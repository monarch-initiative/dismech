discussions:
- discussion_id: rabies_neuronal_dysfunction_basis
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Dysfunction Without Substantial Neuronal Death
  prompt: >-
    What is the molecular basis of the neuronal dysfunction that kills in rabies,
    given that infected neurons are structurally preserved and inflammation is
    minimal?
  rationale: >-
    This is the central unresolved question of the entry and the reason no
    post-symptomatic therapy has ever worked. Every candidate mechanism proposed
    so far - electrophysiological alterations, ion channel and neurotransmission
    effects, neurotoxicity, and more recently mitochondrial bioenergetic failure
    with mitophagy - remains a candidate rather than a demonstrated cause. Until
    the effector step is identified there is no rational target for therapy after
    symptom onset, which is precisely the window in which every attempted
    treatment, the Milwaukee protocol included, has failed.
  proposed_experiments:
  - experiment_id: rabies_neuron_electrophysiology
    name: Electrophysiological phenotyping of infected human-derived neurons
    description: >-
      Patch-clamp and multi-electrode-array characterisation of synaptic
      transmission, resting membrane potential, and ion channel behaviour in
      rabies-infected human iPSC-derived neurons, comparing street virus with
      laboratory-adapted strains, to establish whether a reproducible functional
      lesion precedes any structural change.
    would_support:
    - >-
      A consistent, strain-independent defect in synaptic transmission or
      excitability appearing before structural change would identify the
      effector step of neuronal dysfunction.
    would_refute:
    - >-
      Normal electrophysiology in productively infected neurons would argue the
      fatal lesion lies outside cell-autonomous neuronal function, redirecting
      attention to network or systemic mechanisms.
  - experiment_id: rabies_mitochondrial_rescue
    name: Mitochondrial rescue in an infected neuronal model
    description: >-
      Test whether restoring mitochondrial membrane potential or blocking
      mitophagy preserves neuronal function in infected neurons, directly probing
      the bioenergetic hypothesis proposed from naturally infected human and
      canine brain.
    would_support:
    - >-
      Functional rescue without reducing viral replication would establish
      mitochondrial failure as the causal effector rather than a bystander
      correlate.
    would_refute:
    - >-
      Preserved mitochondrial function with unchanged neuronal dysfunction would
      demote the bioenergetic account to an epiphenomenon.
  evidence:
  - reference: PMID:15804968
    reference_title: "Neuronal dysfunction and death in rabies virus infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The precise bases of this functional impairment are unknown, and current knowledge on electro-physiological alterations, effects on ion channels and neurotransmission, and neurotoxicity are reviewed."
    explanation: States directly that the basis of the functional impairment is unknown, which is the gap this discussion records.
notes: >-
  Two features make rabies unusual among the encephalitides and are worth holding
  onto when reading this entry. First, the long clinically silent incubation is
  not latency but travel time: the virus is physically crawling up an axon, and
  that slow transit is exactly the window post-exposure prophylaxis exploits.
  Second, the neuropathology is mild while the disease is uniformly fatal.
  Neurons are functionally deranged rather than destroyed, and no one has yet
  established why. That gap is the most important open mechanistic question in
  the entry, and it is the reason no post-symptomatic therapy has worked; it is
  recorded as a structured KNOWLEDGE_GAP discussion
  (rabies_neuronal_dysfunction_basis) attached to the Neuronal Dysfunction
  Without Substantial Neuronal Death node rather than left as prose here.

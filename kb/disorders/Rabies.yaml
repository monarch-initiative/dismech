    explanation: Qualifies effectiveness; breakthrough infections occur but are exceedingly rare and usually follow deviations from core practice.
- name: Rabies pre-exposure prophylaxis
  description: >-
    A vaccine series given before any exposure to people at elevated risk:
    veterinarians, laboratory workers, and long-term travellers to or residents
    of endemic areas. It does not remove the need for post-exposure prophylaxis
    but simplifies it, eliminating the immunoglobulin requirement and reducing
    the number of vaccine doses.

transmission:
- name: Animal bite transmission
  description: >-
    Rabies is transmitted mainly via the bite of an infected mammal, with
    virus-laden saliva deposited directly into the wound. Dogs are the dominant
    reservoir for human cases worldwide.
  evidence:
  - reference: PMID:12144896
    reference_title: "Rabies re-examined."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Viral transmission occurs mainly via animal bite, and once the virus is deposited in peripheral wounds"
    explanation: The abstract specifies bite transmission and peripheral wound deposition.
  - reference: PMID:29188797
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dogs are the most important reservoir for rabies viruses, and dog bites account for >99% of human cases."
    explanation: Quantifies the dominance of dog-mediated transmission in human rabies.
- name: Non-bite and iatrogenic transmission
  description: >-
    Less commonly, virus enters through contamination of open skin or mucous
    membranes, and rarely through organ or tissue transplantation from an
    undiagnosed donor. Bat-associated exposures are frequently unrecognised, so a
    bite history may be absent.
  evidence:
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The RABV is transmitted through the saliva of infected animals, contaminating bites, open skin, or mucous membrane, and, in rare cases, through organ transplantation."
    explanation: Enumerates the non-bite and transplant-associated routes of transmission.
  - reference: PMID:23723193
    reference_title: "Clinical features of dog- and bat-acquired rabies in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bat-acquired cases of rabies were more often misdiagnosed and lacked a bite history."
    explanation: Documents the frequently absent bite history in bat-acquired human rabies.
pathophysiology:
- name: Inoculation of Virus into Peripheral Tissue
  description: >-
    A bite from an infected animal deposits saliva-borne lyssavirus into
    peripheral wound tissue. Virus may replicate locally in muscle or persist at
    the inoculation site before entering the nervous system, which accounts for
    the characteristically long and variable incubation period.
  role: trigger
  biological_scale: TISSUE

- name: Selective Vulnerability of Dorsal Root Ganglion Neurons
  description: >-
    In experimentally infected mice, sensory ganglion neurons show inflammatory
    infiltrates and degenerative change while CNS neurons remain comparatively
    spared. This selective peripheral sensory vulnerability is a plausible
    correlate of the pain, itch, and paresthesias patients report at the healed
    bite. Clinical review independently attributes those local symptoms to
    infection of the local peripheral sensory ganglia, so the human correlate is
    asserted in the clinical literature even though the cellular vulnerability
    itself is characterised only in mice.
  role: modifier
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

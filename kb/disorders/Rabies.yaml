    explanation: Establishes deposition of virus in peripheral wound tissue as the initiating event.
  downstream:
  - target: Neuromuscular Junction Entry into Motor Neurons
    causal_link_type: DIRECT
    description: >-
      Virus deposited at the wound reaches motor nerve terminals at the
      neuromuscular junction, the principal portal of entry into the nervous
      system.
    evidence:
    - reference: PMID:10797395
      reference_title: "Rabies virus entry at the neuromuscular junction in nerve-muscle cocultures."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These findings show that in nerve-muscle cocultures, the neuromuscular junction is the major site of entry into neurons."
      explanation: Identifies the neuromuscular junction as the major neuronal entry site in a nerve-muscle coculture model.
  - target: Selective Vulnerability of Dorsal Root Ganglion Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Virus at the inoculation site also reaches the sensory ganglion serving
      that dermatome, a separate branch from the motor-neuron route and the
      likely basis of the local sensory symptoms patients report at the healed
      bite.
    evidence:

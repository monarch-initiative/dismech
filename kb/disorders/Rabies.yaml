name: Rabies
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
description: >-
  Rabies is an acute, progressive, almost invariably fatal viral
  encephalomyelitis caused by rabies virus and other lyssaviruses, transmitted
  in the saliva of an infected mammal (dog bites account for the great majority
  of human cases). Virus deposited in a peripheral wound enters motor neurons at
  the neuromuscular junction, travels centripetally by retrograde axonal
  transport to the central nervous system, and replicates in cytoplasmic viral
  factories (Negri bodies). Fatal neurological disease follows from neuronal
  dysfunction rather than from extensive neuronal death: neuropathological
  changes are strikingly mild relative to the clinical picture. Virus then
  spreads centrifugally along nerves to the salivary glands and other extraneural
  organs, completing the transmission cycle. Post-exposure prophylaxis given
  before symptom onset is highly effective; once symptoms begin, care is
  essentially palliative.

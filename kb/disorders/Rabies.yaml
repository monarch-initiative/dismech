clinical_burden:
  burden_level: HIGH
  rationale: >-
    Clinical rabies is nearly always fatal once symptoms begin, and it kills tens
    of thousands of people annually, disproportionately children in Africa and
    Asia. The entirely preventable nature of those deaths makes the burden a
    health-systems failure as much as a biological one.
  evidence:
  - reference: PMID:35511716
    reference_title: "Use of a Modified Preexposure Prophylaxis Vaccination Schedule to Prevent Human Rabies: Recommendations of the Advisory Committee on Immunization Practices - United States, 2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human rabies is an acute, progressive encephalomyelitis that is nearly always fatal once symptoms begin."
    explanation: ACIP states the near-universal fatality of symptomatic rabies.

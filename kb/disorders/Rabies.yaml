- name: Anti-rabies monoclonal antibody
  description: >-
    Monoclonal antibody preparations are replacing blood-derived rabies immune
    globulin for the passive-immunisation arm of post-exposure prophylaxis, which
    matters because RIG is chronically in short supply and carries the safety
    profile of a pooled human blood product. Because single antibodies select for
    escape at their own epitope, products are formulated as cocktails of
    non-competing antibodies binding separate epitopes on the viral glycoprotein.

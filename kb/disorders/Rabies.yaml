  description: >-
    Rabies presents as either encephalitic (furious) disease, with agitation,
    hydrophobia, aerophobia, and autonomic instability, or paralytic (dumb)
    disease, with ascending flaccid weakness and relatively preserved
    consciousness. In naturally infected dogs, furious disease carries higher
    brain viral load with only moderate inflammation, whereas paralytic disease
    shows delayed neuroinvasion with more intense inflammation, suggesting the
    host inflammatory response shapes which form develops.
  role: modifier
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:18444083
    reference_title: "Furious and paralytic rabies of canine origin: neuroimaging with virological and cytokine studies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Larger quantities of rabies viral RNA were found in the brains of furious than in paralytic dogs."
    explanation: Documents the higher brain viral burden of the furious form in the canine model.
  - reference: PMID:18444083
    reference_title: "Furious and paralytic rabies of canine origin: neuroimaging with virological and cytokine studies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Paralytic rabies is characterized by delayed viral neuroinvasion and a more intense inflammation than furious rabies."
    explanation: Contrasts the inflammatory and neuroinvasive profile of the paralytic form.
  - reference: PMID:23723193
    reference_title: "Clinical features of dog- and bat-acquired rabies in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with paralytic rabies had longer survival times than those with encephalitic rabies, and also had shorter incubation periods if they had received postexposure prophylaxis."
    explanation: Human case-series evidence that the two forms differ in survival time.
  notes: >-
    The viral-burden versus inflammation account comes from naturally infected
    dogs; the corresponding human mechanism has not been demonstrated as directly.
- name: Centrifugal Spread to Salivary Glands and Extraneural Organs
  description: >-
    After CNS infection is established, virus moves outward along peripheral
    nerves and autonomic plexuses to reach salivary glands, skin, cornea, heart,
    tongue, larynx, adrenal medulla, and the gastrointestinal tract. Salivary
    gland involvement loads the saliva with virus and closes the transmission
    cycle; skin and corneal involvement is what makes antemortem nuchal skin
    biopsy diagnostically useful.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:10462032
    reference_title: "Extraneural organ involvement in human rabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RVA was found in nerve plexuses in multiple organs, including the gastrointestinal tract."
    explanation: Postmortem human series demonstrating rabies antigen in extraneural nerve plexuses.
  - reference: PMID:10462032
    reference_title: "Extraneural organ involvement in human rabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Minor salivary glands of the tongue contained RVA and major salivary glands showed RVA in plexuses, but not in either acini or ducts."
    explanation: Localises rabies antigen within salivary tissue, the anatomical basis of saliva-borne transmission.
  - reference: PMID:10462032
    reference_title: "Extraneural organ involvement in human rabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RVA was observed in hair follicles of the skin and rarely in pancreatic islets."
    explanation: Cutaneous nerve involvement underpins antemortem nuchal skin biopsy diagnosis.
  - reference: PMID:10462032
    reference_title: "Extraneural organ involvement in human rabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that centrifugal spread of rabies virus to extraneural organs occurs frequently in human rabies."
    explanation: Establishes that centrifugal extraneural spread is a frequent, not exceptional, feature.
has_subtypes:
- name: Encephalitic
  display_name: Encephalitic (furious) rabies
  description: >-
    The classical form, accounting for the majority of human cases: fluctuating
    agitation and hyperexcitability, hydrophobia and aerophobia, hypersalivation,
    and autonomic instability, progressing to coma and death. Hydrophobia and
    aerophobia are more characteristic of dog-acquired disease.
  evidence:
  - reference: PMID:23723193
    reference_title: "Clinical features of dog- and bat-acquired rabies in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Encephalopathy, hydrophobia, and aerophobia were more common in dog-acquired rabies."
    explanation: Associates the encephalitic phenotype with dog-acquired rabies in a 122-case series.
- name: Paralytic
  display_name: Paralytic (dumb) rabies
  description: >-
    Ascending flaccid weakness with relatively preserved consciousness,
    frequently misdiagnosed as Guillain-Barre syndrome. Survival time is longer
    than in encephalitic rabies, but the outcome is the same.
  evidence:
  - reference: PMID:23723193
    reference_title: "Clinical features of dog- and bat-acquired rabies in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with paralytic rabies had longer survival times than those with encephalitic rabies, and also had shorter incubation periods if they had received postexposure prophylaxis."
    explanation: Distinguishes the paralytic form by its longer survival time.
phenotypes:
- name: Viral encephalitis
  category: Neurologic
  frequency: OBLIGATE
  description: >-
    Acute progressive viral encephalomyelitis is the defining manifestation of
    clinical rabies.
  phenotype_term:
    preferred_term: Viral encephalitis
    term:
      id: HP:0033993
      label: Viral encephalitis
    temporality: ACUTE
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:12144896
    reference_title: "Rabies re-examined."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rabies is an acute, progressive, incurable viral encephalitis."
    explanation: Rabies is defined as an acute progressive viral encephalitis.
- name: Fever
  category: Constitutional
  description: >-
    The prodrome is a vague febrile illness, easily mistaken for any number of
    common infections, which is why rabies is so often missed at first
    presentation.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Following an incubation period ranging from a few days to a few years, rabies presents with a vague, febrile illness, frequently with pain and paresthesias at the wound site."
    explanation: Describes the febrile prodrome of clinical rabies.
- name: Paresthesias at the wound site
  category: Neurologic
  description: >-
    Pain, itch, or paresthesia localised to the healed bite site is an early and
    relatively specific clue, and is thought to reflect infection of the sensory
    ganglion serving that dermatome.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Paresthesia
    term:
      id: HP:0003401
      label: Paresthesia
  evidence:
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About half of patients develop pain, paraesthesia (abnormal sensation of tingling or pricking), and/or pruritus (itching), which usually occur close to the site of the bite"
    explanation: About half of patients, supporting the FREQUENT band (30-79%).
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Following an incubation period ranging from a few days to a few years, rabies presents with a vague, febrile illness, frequently with pain and paresthesias at the wound site."
    explanation: Documents wound-site pain and paresthesias in the prodromal phase.
- name: Hydrophobia
  category: Neurologic
  subtype: Encephalitic
  diagnostic: true
  description: >-
    Involuntary pharyngeal and inspiratory spasm provoked by attempts to drink,
    ultimately by the sight or thought of water. With aerophobia (the same
    response to a draught of air), it is close to pathognomonic and is more
    characteristic of dog-acquired disease. HPO has no aerophobia term, so the
    aerophobic component is captured in this description rather than as a
    separate coded phenotype.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Hydrophobia
    term:
      id: HP:0032505
      label: Hydrophobia
  evidence:
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients with encephalitic rabies develop hydrophobia, which is a specific and characteristic feature of rabies."
    explanation: Supports the VERY_FREQUENT band within the encephalitic subtype and the near-pathognomonic character of the sign.
  - reference: PMID:23723193
    reference_title: "Clinical features of dog- and bat-acquired rabies in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Encephalopathy, hydrophobia, and aerophobia were more common in dog-acquired rabies."
    explanation: Documents hydrophobia and aerophobia and their association with dog-acquired rabies.
- name: Excessive salivation
  category: Autonomic
  subtype: Encephalitic
  description: >-
    Hypersalivation, combined with pharyngeal spasm that prevents swallowing,
    produces the frothing classically associated with rabies and also delivers
    virus-laden saliva to the next host.
  phenotype_term:
    preferred_term: Excessive salivation
    term:
      id: HP:0003781
      label: Excessive salivation
  evidence:
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autonomic dysfunction is common and includes hypersalivation, sweating, piloerection (goose bumps), and priapism (persistent and painful penile erection)."
    explanation: Human clinical review documenting hypersalivation as a common autonomic manifestation of rabies.
- name: Autonomic instability
  category: Autonomic
  description: >-
    Labile blood pressure and heart rate, hyperthermia, priapism, and cardiac
    arrhythmias accompany brainstem and hypothalamic involvement and contribute
    to death.
  phenotype_term:
    preferred_term: Autonomic instability
    term:
      id: HP:0012332
      label: Abnormal autonomic nervous system physiology
  evidence:
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autonomic dysfunction is common and includes hypersalivation, sweating, piloerection (goose bumps), and priapism (persistent and painful penile erection)."
    explanation: Human clinical review documenting autonomic dysfunction as a common feature and naming its manifestations.
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiopulmonary complications are very common and include sinus tachycardia (abnormally rapid heart rate originating in the sinus node), cardiac arrhythmias (abnormal heart rhythm), heart failure, hypotension (low blood pressure), hyperventilation, hypoxaemia"
    explanation: Documents the cardiovascular manifestations of autonomic involvement in human patients.
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This dysfunction may be caused by direct infection of autonomic nervous system centres or autonomic pathways involving the hypothalamus, spinal cord and/or autonomic ganglia."
    explanation: Attributes the autonomic dysfunction to infection of hypothalamic, spinal, and autonomic-ganglion pathways.
  - reference: PMID:18444083
    reference_title: "Furious and paralytic rabies of canine origin: neuroimaging with virological and cytokine studies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abnormal hypersignal T2 changes were found at hippocampus, hypothalamus, brainstem, and spinal cord of paralytic dogs."
    explanation: Corroborating canine imaging showing involvement of the hypothalamic and brainstem structures named above; supporting, not sole, evidence.
- name: Paralysis
  category: Neurologic
  subtype: Paralytic
  description: >-
    Ascending flaccid weakness with relatively preserved consciousness defines
    paralytic rabies and is a frequent source of misdiagnosis as Guillain-Barre
    syndrome.
  phenotype_term:
    preferred_term: Paralysis
    term:
      id: HP:0003470
      label: Paralysis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Within 2 weeks, the neurological phase typically progresses into encephalitic or paralytic rabies, followed by coma."
    explanation: Establishes paralytic rabies as one of the two neurological presentations.
- name: Myoclonus
  category: Neurologic
  description: >-
    Myoclonus and tremor, along with abnormal cranial nerve, motor, and sensory
    findings, are reported particularly in bat-acquired rabies.
  phenotype_term:
    preferred_term: Myoclonus
    term:
      id: HP:0001336
      label: Myoclonus
  evidence:
  - reference: PMID:23723193
    reference_title: "Clinical features of dog- and bat-acquired rabies in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "tremor, myoclonus, local sensory symptoms, symptoms at the exposure site, and local symptoms in the absence of a bite or scratch were more common in patients with bat-acquired rabies"
    explanation: Documents myoclonus and tremor as features, more common in bat-acquired cases.
- name: Coma
  category: Neurologic
  description: >-
    The neurological phase gives way to coma within about two weeks, and death
    follows within days of coma onset.
  phenotype_term:
    preferred_term: Coma
    term:
      id: HP:0001259
      label: Coma
  evidence:
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Death typically occurs within 2 to 3 days of coma onset."
    explanation: Documents coma as the terminal phase and its short interval to death.
- name: Headache
  category: Neurologic
  description: >-
    One of the nonspecific prodromal symptoms, alongside fever, chills, malaise,
    insomnia, anorexia, anxiety, and irritability. Individually unremarkable,
    which is precisely why the prodrome is so often attributed to something else.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These symptoms include fever, chills, malaise, fatigue, insomnia, anorexia, headache, anxiety and irritability"
    explanation: Lists headache among the prodromal symptoms of human rabies.
- name: Agitation
  category: Neurologic
  subtype: Encephalitic
  description: >-
    Encephalitic rabies produces episodic hyperexcitability and generalised
    arousal separated by lucid intervals, with spells of agitation, confusion,
    hallucinations, and aggressive behaviour lasting one to five minutes, either
    spontaneous or triggered by sensory stimuli. The preserved lucid intervals
    between spells are part of what makes the picture distinctive.
  phenotype_term:
    preferred_term: Agitation
    term:
      id: HP:0000713
      label: Agitation
    temporality: RECURRENT
  evidence:
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spells may occur with agitation, confusion, hallucinations and aggressive behaviour, typically lasting for periods of one to five minutes"
    explanation: Documents agitation, hallucinations, and aggressive behaviour as episodic features of encephalitic rabies.
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the encephalitic form, patients have episodes of hyperexcitability or generalised arousal that are separated by lucid periods"
    explanation: Establishes the episodic hyperexcitability with intervening lucid periods characteristic of the encephalitic form.
- name: Dysphagia
  category: Gastrointestinal
  subtype: Encephalitic
  description: >-
    Throat pain and difficulty swallowing precede frank hydrophobia and are
    mechanistically distinct from it: dysphagia is the impairment, hydrophobia
    is the violent involuntary inspiratory and pharyngeal spasm that swallowing
    attempts then provoke. Together with hypersalivation, dysphagia is why saliva
    pools rather than being swallowed.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients experience pain in the throat or difficulty swallowing"
    explanation: Documents throat pain and dysphagia as the initial swallowing disturbance preceding hydrophobia.
progression:
- phase: Incubation
  notes: >-
    Clinically silent while virus travels from the inoculation site toward the
    central nervous system. Typically one to three months, but reported from a
    few days to a few years; bites to the head, neck, and hands, which are richly
    innervated and close to the CNS, tend to shorten it.
  evidence:
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Following an incubation period ranging from a few days to a few years, rabies presents with a vague, febrile illness, frequently with pain and paresthesias at the wound site."
    explanation: Gives the reported range of the incubation period.
- phase: Prodrome
  notes: >-
    A nonspecific febrile illness, often with pain, itch, or paresthesias at the
    healed wound. This is the window in which rabies is most often missed.
  evidence:
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinicians often overlook the diagnosis of rabies at the initial presentation."
    explanation: Documents the diagnostic difficulty of the prodromal phase.
- phase: Acute neurological phase
  duration: About 2 weeks from prodrome to coma
  notes: >-
    Progression into either encephalitic (furious) or paralytic (dumb) rabies,
    typically within two weeks of the prodrome.
  evidence:
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Within 2 weeks, the neurological phase typically progresses into encephalitic or paralytic rabies, followed by coma."
    explanation: Gives the timing and the two possible clinical trajectories.
- phase: Coma and death
  duration: 2 to 3 days from coma onset
  notes: >-
    Death typically follows within two to three days of coma onset. Well
    documented survival is exceptional, roughly 34 cases at six months after
    onset, many with serious neurological sequelae.
  evidence:
  - reference: PMID:28846292
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Death typically occurs within 2 to 3 days of coma onset."
    explanation: Gives the interval from coma to death.
  - reference: PMID:40139921
    reference_title: "Demise of the Milwaukee Protocol for Rabies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human rabies has a very high fatality rate and there have only been about 34 well-documented survivors, defined as survival at 6 months after onset of clinical rabies."
    explanation: Quantifies documented survival as exceptional.
histopathology:
- name: Negri bodies
  description: >-
    Eosinophilic cytoplasmic inclusion bodies in infected neurons, classically in
    hippocampal pyramidal cells and cerebellar Purkinje cells. They are the
    histological hallmark of rabies and are now understood to be liquid-like
    viral factories where viral RNA synthesis takes place, not inert debris.
  diagnostic: true
  finding_term:
    preferred_term: Negri body
    term:
      id: NCIT:C120945
      label: Inclusion Body
  evidence:
  - reference: PMID:19494013
    reference_title: "Functional characterization of Negri bodies (NBs) in rabies virus-infected cells: Evidence that NBs are sites of viral transcription and replication."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rabies virus infection induces the formation of cytoplasmic inclusion bodies that resemble Negri bodies found in the cytoplasm of some infected nerve cells."
    explanation: Identifies Negri bodies as cytoplasmic inclusions in infected nerve cells.
  - reference: PMID:31317498
    reference_title: "Structure and Function of Negri Bodies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For rabies virus, those viral factories are called Negri bodies (NBs)."
    explanation: Establishes the modern interpretation of Negri bodies as viral factories.
- name: Minimal inflammation with preserved neuronal structure
  description: >-
    The neuropathology of rabies is famously underwhelming relative to the
    clinical devastation: little inflammatory infiltrate and largely preserved
    neuronal morphology, with mitochondrial disruption visible only on closer
    inspection.
  evidence:
  - reference: PMID:35229271
    reference_title: "Mitochondrial Dysfunction in Rabies Virus-Infected Human and Canine Brains."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morphological analysis showed minimal inflammation with preserved neuronal and disrupted mitochondrial structure in both human and canine brains."
    explanation: Documents the discordance between mild histopathology and fatal clinical disease.
diagnosis:
- name: Direct fluorescent antibody test on postmortem brain tissue
  description: >-
    Detection of rabies nucleoprotein antigen in brain touch impression smears
    using fluorescein-labelled antibody remains the reference standard for
    confirming rabies. The direct rapid immunohistochemical test is a light
    microscopy alternative for laboratories without fluorescence capability.
  evidence:
  - reference: PMID:38376376
    reference_title: "Recent updates on laboratory diagnosis of rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One of the earliest and most reliable techniques for post-mortem diagnosis of rabies is direct fluorescent antibody test (FAT). Even today, it remains the gold standard for confirming rabies in human and animal post-mortem samples"
    explanation: Establishes brain FAT as the gold-standard confirmatory test.
- name: Antemortem antigen detection on nuchal skin biopsy and corneal smear
  description: >-
    Because virus reaches cutaneous nerves around hair follicles by centrifugal
    spread, antigen can be sought in a nuchal skin biopsy during life. Sensitivity
    and specificity are modest, and corneal smears are discouraged because of the
    risk of corneal scarification.
  evidence:
  - reference: PMID:38376376
    reference_title: "Recent updates on laboratory diagnosis of rabies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "FAT can be employed for antigen detection in samples such as corneal smears and nuchal skin biopsies. However, the sensitivity and specificity of FAT are relatively low in these samples."
    explanation: Supports the antemortem application while recording its limited accuracy.
- name: Reverse transcription PCR for viral RNA
  description: >-
    Conventional or real-time RT-PCR targeting the nucleoprotein gene is the most
    widely used laboratory confirmation, applicable to both antemortem and
    postmortem samples, and it also types the reservoir variant. Sensitivity is
    higher in pooled saliva and nuchal skin than in cerebrospinal fluid or urine.
  evidence:
  - reference: PMID:38376376
    reference_title: "Recent updates on laboratory diagnosis of rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most popular method for confirming the diagnosis of rabies in a laboratory, in both ante-mortem and post-mortem samples is conventional or real-time RT-PCR."
    explanation: Establishes RT-PCR as the principal nucleic acid confirmation method.
  - reference: PMID:38376376
    reference_title: "Recent updates on laboratory diagnosis of rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PCR exhibits higher sensitivity in pooled saliva and nuchal skin samples but lower sensitivity in CSF, urine samples and extracted hair follicles"
    explanation: Records the sample-type dependence of PCR sensitivity.
- name: A negative antemortem test does not exclude rabies
  description: >-
    The single most important interpretive caveat. Antemortem assays are
    insensitive enough that clinical suspicion, not a negative result, should
    drive management; series from a WHO reference laboratory confirmed only about
    40 per cent of clinically suspected cases antemortem.
  evidence:
  - reference: PMID:38376376
    reference_title: "Recent updates on laboratory diagnosis of rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A major limitation of ante-mortem tests for rabies is that negative results do not exclude a diagnosis of the disease"
    explanation: States the interpretive caveat explicitly.
  - reference: PMID:38376376
    reference_title: "Recent updates on laboratory diagnosis of rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ante-mortem laboratory confirmation of rabies was achieved in 40.6 per cent (128 cases between 2012 and 2014) and 42.3 per cent (130 cases between 2015 and 2017) of clinically suspected rabies cases"
    explanation: Quantifies real-world antemortem confirmation rates at a reference laboratory.
- name: Underdiagnosis and the global burden estimate
  description: >-
    The reported burden of rabies is an undercount, and the lack of sensitive
    laboratory methods is a direct cause rather than an incidental limitation.
  evidence:
  - reference: PMID:24348170
    reference_title: "Laboratory diagnosis of human rabies: recent advances."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The true disease burden and public health impact due to rabies remain underestimated due to lack of sensitive laboratory diagnostic methods."
    explanation: Links diagnostic insensitivity to systematic underestimation of burden.
differential_diagnoses:
- name: Guillain-Barre syndrome
  description: >-
    Paralytic rabies presents with ascending flaccid weakness and relatively
    preserved consciousness, and is frequently mistaken for Guillain-Barre
    syndrome; an exposure history and a compatible neurological trajectory should
    prompt reconsideration.
  distinguishing_features:
  - A compatible animal exposure, which may be remote or unrecognised
  - Pain, itch, or paresthesia localised to the healed bite site
  - Inexorable progression to coma and death, without response to immunotherapy
  evidence:
  - reference: PMID:23723193
    reference_title: "Clinical features of dog- and bat-acquired rabies in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bat-acquired cases of rabies were more often misdiagnosed and lacked a bite history."
    explanation: Documents misdiagnosis as a recurring problem, especially where a bite history is absent.
  - reference: PMID:30747124
    reference_title: "Rabies: a medical perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Local symptoms at the site of the bite, piloerection, bladder dysfunction and fever are all features that favour a diagnosis of paralytic rabies."
    explanation: Names the specific clinical features that discriminate paralytic rabies from Guillain-Barre syndrome.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.74
  rate_low: 0.31
  rate_high: 1.99
  notes: >-
    Approximately 59,000 human deaths from dog-mediated rabies annually (95% CI
    25,000 to 159,000), normalised against a world population of about 8 billion.
    Because clinical rabies is essentially always fatal, annual deaths approximate
    the annual incidence of clinical disease. The overwhelming majority of these
    deaths occur in Africa and Asia, and the figure is an undercount because
    antemortem diagnosis is insensitive and surveillance is weak.
  evidence:

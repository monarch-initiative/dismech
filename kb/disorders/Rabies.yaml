    sensory symptoms to sensory ganglion infection but does not describe the
    cellular pathology.
- name: Neuronal Dysfunction Without Substantial Neuronal Death
  description: >-
    The defining paradox of rabies neuropathology: clinical disease is
    catastrophic while morphological changes in the brain are mild. Neurons are

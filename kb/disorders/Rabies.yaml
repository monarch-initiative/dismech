- name: Mitochondrial Dysfunction and Mitophagy in Infected Neurons
  description: >-
    In naturally infected human and canine brain, respiratory complex activities
    rise but ATP production does not, consistent with a fall in mitochondrial
    membrane potential. Disrupted cristae architecture and markers of mitophagy
    and autophagy accompany these changes, offering one candidate route from
    infection to neuronal dysfunction in the near absence of cell death.

treatments:
- name: Thorough wound cleansing
  description: >-
    Immediate and thorough washing of the wound is the first step of
    post-exposure prophylaxis and mechanically removes virus before it can reach
    nerve terminals. It is cheap, universally available, and frequently skipped.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: wound care management
    term:
      id: NCIT:C116681
      label: Wound Care Management
  target_mechanisms:
  - target: Inoculation of Virus into Peripheral Tissue
    treatment_effect: INHIBITS
    description: >-
      Removes or inactivates virus at the inoculation site before neuronal entry
      can occur.
  evidence:
  - reference: PMID:18496505
    reference_title: "Human rabies prevention--United States, 2008: recommendations of the Advisory Committee on Immunization Practices."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACIP recommends that prophylaxis for the prevention of rabies in humans exposed to rabies virus should include prompt and thorough wound cleansing followed by passive rabies immunization with human rabies immune globulin (HRIG) and vaccination with a cell culture rabies vaccine."
    explanation: ACIP places prompt thorough wound cleansing first in the prophylaxis sequence.
- name: Rabies immunoglobulin administration
  description: >-
    Human rabies immune globulin infiltrated into and around the wound provides
    immediate passive neutralising antibody, covering the interval before the
    vaccine-induced response develops. It is given once, only to previously
    unvaccinated people.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human rabies immune globulin
      term:
        id: NCIT:C80831
        label: Human Rabies Virus Immune Globulin
  target_mechanisms:
  - target: Neuromuscular Junction Entry into Motor Neurons
    treatment_effect: INHIBITS
    description: >-
      Neutralising antibody at the wound site blocks virions before they can
      engage receptors on the motor nerve terminal.
  evidence:
  - reference: PMID:12144896
    reference_title: "Rabies re-examined."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prophylaxis encompasses thorough wound treatment, vaccine administration, and inoculation of rabies immunoglobulin."
    explanation: The abstract includes rabies immunoglobulin as part of prophylaxis.
  - reference: PMID:18496505
    reference_title: "Human rabies prevention--United States, 2008: recommendations of the Advisory Committee on Immunization Practices."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HRIG is administered only once (i.e., at the beginning of antirabies prophylaxis) to previously unvaccinated persons to provide immediate, passive, rabies virus neutralizing antibody coverage until the patient responds to HDCV or PCECV by actively producing antibodies."
    explanation: Specifies the timing, single administration, and bridging rationale for HRIG.
  notes: >-
    HRIG is a polyclonal human immune globulin rather than a monoclonal antibody,
    so therapeutic_modality is OTHER; monoclonal antibody products are now
    entering use as replacements and would be tagged MONOCLONAL_ANTIBODY.
- name: Rabies post-exposure vaccination
  description: >-
    A series of cell culture-derived rabies vaccine doses given after exposure.
    Together with wound care and immunoglobulin, post-exposure prophylaxis is
    highly effective at preventing progression to clinical disease, but only if
    given promptly.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
    therapeutic_agent:
    - preferred_term: rabies vaccine
      term:
        id: NCIT:C198514
        label: Rabies Vaccine
  target_mechanisms:
  - target: Retrograde Axonal Transport to the Central Nervous System
    treatment_effect: INHIBITS
    description: >-
      Active immunisation raises neutralising antibody during the long incubation
      period, clearing virus before it completes the journey to the central
      nervous system.
  evidence:
  - reference: PMID:12144896
    reference_title: "Rabies re-examined."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prophylaxis encompasses thorough wound treatment, vaccine administration, and inoculation of rabies immunoglobulin."
    explanation: The abstract describes vaccine administration for prophylaxis.

- name: Negri Body Formation and Viral Replication
  description: >-
    Rabies virus nucleoprotein N and phosphoprotein P condense into spherical,
    liquid-like cytoplasmic inclusions, the Negri bodies, which act as viral
    factories. All viral RNA species (genome, antigenome, and mRNAs) are found
    inside them, and these are the sites where viral transcription and replication
    occur. Negri bodies are the classical histopathological hallmark of rabies.
  role: mediator
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

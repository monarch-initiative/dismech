    reference_title: "Human rabies despite post-exposure prophylaxis: a systematic review of fatal breakthrough infections after zoonotic exposures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-exposure prophylaxis (PEP) for rabies is widely administered and highly effective."

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Local neurological symptoms are likely to be due to RABV infection in local peripheral sensory ganglia"
      explanation: Attributes the human bite-site sensory symptoms to infection of the local peripheral sensory ganglia.
- name: Neuromuscular Junction Entry into Motor Neurons
  description: >-
    Virions concentrate at the neuromuscular junction, colocalising with
    nicotinic acetylcholine receptors, and are taken up into endosomal
    compartments of the motor nerve terminal. Rabies virus glycoprotein also
    binds the p75 neurotrophin receptor with high affinity, giving the virus more
    than one route into the neuron.
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: virion attachment to host cell
    term:
      id: GO:0019062
      label: virion attachment to host cell
  - preferred_term: receptor-mediated endocytosis
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  evidence:
  - reference: PMID:10797395
    reference_title: "Rabies virus entry at the neuromuscular junction in nerve-muscle cocultures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Texas Red-labeled alpha-bungarotoxin, which binds to nicotinic acetylcholine receptors, colocalized precisely with virus at the densities identifying these regions as neuromuscular junctions."
    explanation: Shows virus colocalising with nicotinic acetylcholine receptors at the neuromuscular junction.
  - reference: PMID:25165859
    reference_title: "Rabies Virus Hijacks and accelerates the p75NTR retrograde axonal transport machinery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p75 Nerve Growth Factor (NGF) receptor (p75NTR) binds RABV Glycoprotein (RABV-G) with high affinity."
    explanation: Documents the high-affinity glycoprotein-p75NTR interaction used for neuronal entry.
  - reference: PMID:29188797
    reference_title: "Rabies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The virus first infects peripheral motor neurons, and symptoms occur after the virus reaches the central nervous system."
    explanation: Confirms peripheral motor neurons as the first infected cell population in human disease.
  downstream:
  - target: Retrograde Axonal Transport to the Central Nervous System
    causal_link_type: DIRECT
    description: >-
      Endocytosed virions in acidified compartments of the nerve terminal are
      carried centripetally along the axon toward the neuronal cell body.
    evidence:
    - reference: PMID:10797395
      reference_title: "Rabies virus entry at the neuromuscular junction in nerve-muscle cocultures."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The progressive increase of virus and tracers in nerve fibers and nerve cell bodies over time is consistent with retrograde transport of endocytosed virus from the motor nerve terminal."
      explanation: Links endosomal uptake at the terminal to retrograde movement toward the cell body.
- name: Retrograde Axonal Transport to the Central Nervous System
  description: >-
    Rabies virus depends on long-distance retrograde axonal transport to reach
    the central nervous system. It travels within acidic compartments largely
    together with p75NTR, and moves faster and more directively than the
    receptor's endogenous cargo, indicating that the virus does not merely
    hitchhike on the transport machinery but manipulates it.
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED

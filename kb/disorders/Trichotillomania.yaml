name: Trichotillomania
creation_date: "2026-08-21T00:00:00Z"
category: Complex
disease_term:
  preferred_term: trichotillomania
  term:
    id: MONDO:0013189
    label: trichotillomania
description: >-
  Hair-pulling disorder: recurrent pulling out of one's own hair producing noticeable
  hair loss, with repeated unsuccessful attempts to stop. Classified in DSM-5 among the
  obsessive-compulsive and related disorders as a body-focused repetitive behaviour.

  It sits across two specialties, which is part of why it is under-modelled. Patients
  usually present to dermatology with alopecia rather than to psychiatry with a
  compulsion, and the visible lesion is a consequence of a behaviour rather than of a
  disease of the skin or follicle. No medication is FDA-approved for it.

  The mechanism is genuinely unsettled. This entry curates that state rather than
  assembling a chain the sources decline to assert: the cited narrative review says the
  pathophysiology "is poorly understood and likely multifactorial". What can be
  supported is a corticostriatal locus, converging from two independent directions -
  mouse models in which deleting a single postsynaptic gene produces compulsive grooming
  to the point of hair loss, and a glutamate-modulating drug that works in adults.

pathophysiology:
- name: Corticostriatal Synaptic Dysfunction
  biological_scale: CELLULAR
  description: >-
    Impaired excitatory neurotransmission at cortico-striatal synapses, the level at
    which both genetic mouse models of pathological grooming converge. Deleting either
    SAPAP3 (a postsynaptic scaffolding protein at excitatory synapses, highly expressed
    in striatum) or SLITRK5 produces defective corticostriatal transmission together
    with a grooming phenotype severe enough to remove hair.

    The direction of causation is established rather than inferred in the SAPAP3 case:
    restoring the protein selectively in the striatum rescues both the synaptic and the
    behavioural defect, so the striatal synapse is not merely correlated with the
    behaviour.
  cell_types:
  - preferred_term: medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DECREASED
  downstream:
  - target: Striatal Glutamate Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Curated as indirect. The mouse models show altered glutamate receptor composition
      at these synapses, and the human evidence for a glutamatergic abnormality is
      pharmacological rather than direct, so the step between the two is inferred.
  evidence:
  - reference: PMID:17713528
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice with genetic deletion of Sapap3 exhibit increased anxiety and compulsive
      grooming behaviour leading to facial hair loss and skin lesions"
    explanation: Establishes that loss of a single corticostriatal synaptic protein produces
      grooming to the point of hair loss.
  - reference: PMID:17713528
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "lentiviral-mediated selective expression of Sapap3 in the striatum rescues
      the synaptic and behavioural defects of Sapap3-mutant mice"
    explanation: A rescue experiment localising causation to the striatum rather than
      leaving the association correlational.
  - reference: PMID:20418887
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Slitrk5(-/-) mice show selective overactivation of the orbitofrontal cortex,
      abnormalities in striatal anatomy and cell morphology and alterations in glutamate
      receptor composition, which contribute to deficient corticostriatal neurotransmission"
    explanation: An independent gene converging on the same circuit, and the link to
      glutamate receptor composition.
- name: Striatal Glutamate Dysregulation
  biological_scale: MOLECULAR
  description: >-
    Altered extracellular glutamate homeostasis in the ventral striatum, curated here
    principally because a treatment that acts on it works. N-acetylcysteine restores
    extracellular glutamate concentration in the nucleus accumbens, and in a randomised
    adult trial it reduced hair-pulling substantially more than placebo.

    This is inference from therapeutic response, which is weaker than a measurement.
    The node is retained because the effect size was large and the mechanism of the drug
    is specific - but the direction of the underlying abnormality in patients has not
    been measured, and the paediatric trial of the same drug was negative.
  biological_processes:
  - preferred_term: regulation of glutamate secretion
    term:
      id: GO:0014048
      label: regulation of glutamate secretion
  downstream:
  - target: Failure of Behavioural Inhibition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19581567
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "N-acetylcysteine, an amino acid, seems to restore the extracellular glutamate
      concentration in the nucleus accumbens and, therefore, offers promise in the reduction
      of compulsive behavior"
    explanation: States the pharmacological rationale that this node rests on.
- name: Failure of Behavioural Inhibition
  biological_scale: ORGANISM
  description: >-
    The behavioural output: an urge to pull that is not successfully resisted, producing
    repeated pulling despite intact knowledge that it is damaging and repeated attempts
    to stop. Pulling has been described in two modes - automatic (outside awareness,
    often during sedentary activity) and focused (in response to an urge or an
    aversive state) - and treatment trials measure them separately.
  biological_processes:
  - preferred_term: regulation of behavior
    term:
      id: GO:0050795
      label: regulation of behavior
    modifier: DECREASED
  downstream:
  - target: Hair Loss and Cutaneous Injury
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40928501
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trichotillomania is an impulse control disorder in which individuals fail
      to resist urges to pull out their own hair and is associated with significant
      psychiatric comorbidity and functional impairment"
    explanation: Defines the disorder as a failure to resist the urge rather than as
      an absence of insight.
- name: Hair Loss and Cutaneous Injury
  biological_scale: TISSUE
  description: >-
    The dermatological consequence, and usually the presenting complaint. Because the
    alopecia is produced by traction rather than by follicular disease, it is
    mechanically patterned - irregular, incomplete, and distributed where the hands
    reach - which is what distinguishes it clinically from alopecia areata.
  evidence:
  - reference: PMID:38126097
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trichotillomania, defined as the compulsive pulling out of one's hair, is
      a psychocutaneous condition associated with functional impairment and decreased
      quality of life"
    explanation: Records the disorder's dual psychiatric-dermatological character.

phenotypes:
- category: Behavioral
  name: Recurrent Hair Pulling
  description: >-
    Recurrent pulling out of one's own hair, with repeated unsuccessful attempts to
    decrease or stop. Curated against the compulsive-behaviour term because HPO has no
    term for hair pulling itself; see notes.
  phenotype_term:
    preferred_term: Hair pulling
    term:
      id: HP:0000722
      label: Compulsive behaviors
  evidence:
  - reference: PMID:40928501
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals fail to resist urges to pull out their own hair"
    explanation: The core behavioural phenotype.
- category: Dermatological
  name: Alopecia from Traction
  description: >-
    Noticeable hair loss produced by the pulling itself, most often scalp but also
    eyebrows and eyelashes.
  phenotype_term:
    preferred_term: Alopecia
    term:
      id: HP:0001596
      label: Alopecia
  evidence:
  - reference: PMID:19581567
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trichotillomania is characterized by repetitive hair pulling that causes
      noticeable hair loss"
    explanation: Ties the hair loss to the pulling rather than to follicular pathology.
- category: Psychiatric
  name: Psychiatric Comorbidity and Functional Impairment
  description: >-
    Significant psychiatric comorbidity and impairment of function and quality of life,
    reported consistently across both cited reviews.
  phenotype_term:
    preferred_term: Psychiatric comorbidity
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:40928501
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "associated with significant psychiatric comorbidity and functional impairment
      in affected children, adolescents, and adults"
    explanation: Establishes comorbidity and impairment across the age range.

genetic:
- name: Heritable Liability
  association: >-
    A twin study found monozygotic and dizygotic concordance rates that differed
    significantly, with a heritability estimate of 76.2% for noticeable non-cosmetic
    hair pulling. That figure should be read with its sample in view: 34 twin pairs
    in total, 24 monozygotic and 10 dizygotic, with a dizygotic concordance of 0% under
    strict DSM-IV criteria - a denominator small enough that the point estimate is
    fragile even though the direction is clear.

    No specific gene is established. SLITRK1 variants were reported in trichotillomania,
    but that record caches without retrievable content, so it is named here rather than
    cited; SLITRK5 has human genetic study only in OCD, where the rare-variant
    prevalence did not differ from controls.
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:19199280
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respective concordance rates for MZ and DZ twin pairs were significantly
      different at 38.1% and 0% for DSM-IV TTM criteria"
    explanation: The concordance difference supporting a heritable contribution, quoted
      with the criteria it was measured under.

animal_models:
- name: Sapap3 knockout mouse
  species: Mouse
  genotype: Sapap3 (Dlgap3) homozygous null
  publication: PMID:17713528
  description: >-
    Genetic deletion of the postsynaptic scaffolding protein SAPAP3 produces compulsive
    grooming severe enough to cause facial hair loss and skin lesions, alleviated by an
    SSRI, with defects in cortico-striatal synapses and rescue by striatal re-expression.
  modeled_mechanisms:
  - target: Corticostriatal Synaptic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the corticostriatal synaptic lesion and a self-directed grooming
      behaviour that removes hair.
    limitations: >-
      The authors present this as a model of OCD, not of trichotillomania, and the
      relevance here rests on the grooming-with-hair-loss phenotype rather than on any
      validation against trichotillomania itself. Rodent overgrooming is a species-typical
      behaviour performed to excess; human hair pulling is not grooming carried too far
      and is frequently reported as automatic rather than urge-driven. No SAPAP3 variant
      is established in human trichotillomania.
    readouts:
    - name: Facial hair loss and skin lesions from compulsive grooming
      target: Corticostriatal Synaptic Dysfunction
      direction: INCREASED
      interpretation: Behavioural readout of the grooming phenotype.
      evidence:
      - reference: PMID:17713528
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "compulsive grooming behaviour leading to facial hair loss and skin lesions"
        explanation: The measured behavioural consequence.
    evidence:
    - reference: PMID:17713528
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings demonstrate a critical role for SAPAP3 at cortico-striatal
        synapses and emphasize the importance of cortico-striatal circuitry in OCD-like
        behaviours"
      explanation: Supports treating this model as informative for the corticostriatal node,
        in the authors' own OCD framing.
- name: Slitrk5 knockout mouse
  species: Mouse
  genotype: Slitrk5 homozygous null
  publication: PMID:20418887
  description: >-
    Loss of the neuron-specific transmembrane protein SLITRK5 produces excessive
    self-grooming and anxiety-like behaviour, alleviated by fluoxetine, with orbitofrontal
    overactivation and deficient corticostriatal neurotransmission.
  modeled_mechanisms:
  - target: Corticostriatal Synaptic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      An independent gene converging on the same circuit, and the source of the link
      between this circuit and glutamate receptor composition.
    limitations: >-
      Also framed by its authors as an OCD model. Human SLITRK5 re-sequencing was
      performed in OCD rather than trichotillomania and found no significant difference
      in rare non-synonymous variant prevalence versus controls, so the human genetic
      support for this gene is weak in OCD and absent in trichotillomania.
    evidence:
    - reference: PMID:20418887
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "loss of a neuron-specific transmembrane protein, SLIT and NTRK-like
        protein-5 (Slitrk5), leads to OCD-like behaviors in mice, which manifests as
        excessive self-grooming and increased anxiety-like behaviors"
      explanation: Establishes the model and its grooming phenotype.

treatments:
- name: Habit Reversal Training
  description: >-
    Cognitive-behavioural intervention, the best-supported treatment. Relapse in adults
    is described as somewhat common, so durability rather than initial response is the
    limiting problem.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Cognitive Behavior Therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  evidence:
  - reference: PMID:40928501
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Efficacious treatments have been developed and found efficacious, most
      notably cognitive-behavioral interventions known collectively as habit reversal
      training, although relapse in adults appears to be somewhat common"
    explanation: Supports habit reversal training as first-line and records the relapse
      caveat in the same sentence.
- name: N-Acetylcysteine
  description: >-
    Glutamate-modulating agent. In a twelve-week randomised placebo-controlled trial in
    adults, 56% were much or very much improved versus 16% on placebo, with improvement
    first apparent at nine weeks. A separate randomised trial in children and adolescents
    found no difference from placebo on any primary or secondary measure - so this is not
    a treatment that can be assumed to transfer across the age range, and both results
    are curated below.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: N-acetylcysteine
      term:
        id: CHEBI:22198
        label: acetylcysteine
  target_mechanisms:
  - target: Striatal Glutamate Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Acts by restoring extracellular glutamate concentration in the nucleus accumbens.
      The link is the drug's stated mechanism, not a measurement made in patients.
  evidence:
  - reference: PMID:19581567
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-six percent of patients \"much or very much improved\" with
      N-acetylcysteine use compared with 16% taking placebo (P = .003)"
    explanation: The adult efficacy result, with its comparator.
  - reference: PMID:23452680
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant difference between N-acetylcysteine and placebo was found
      on any of the primary or secondary outcome measures"
    explanation: The paediatric trial contradicts the adult result. Curated as REFUTE
      rather than omitted, because an age-restricted effect is information about the
      mechanism and not merely a caveat on the prescription.

clinical_trials:
- name: NCT00354770
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Twelve-week double-blind placebo-controlled trial of N-acetylcysteine in adults with
    trichotillomania, the source of the positive adult efficacy result.
  target_phenotypes:
  - preferred_term: Hair pulling
    term:
      id: HP:0000722
      label: Compulsive behaviors
  evidence:
  - reference: clinicaltrials:NCT00354770
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a 12-week, double-blind study of N-Acetyl Cysteine in the treatment
      of trichotillomania"
    explanation: Registration record establishing the design and duration of the adult
      N-acetylcysteine trial.

differential_diagnoses:
- name: Alopecia areata
  description: >-
    The principal dermatological differential. Distinguished by the pattern: traction
    alopecia from pulling is irregular and incomplete within affected patches and falls
    where the hands reach, whereas alopecia areata produces smooth, well-demarcated,
    complete patches from an autoimmune attack on the follicle.
- name: Excoriation (skin-picking) disorder
  description: >-
    The other body-focused repetitive behaviour, sharing the DSM-5 chapter, the
    corticostriatal candidate mechanism and the N-acetylcysteine evidence base. Kept as
    a differential rather than a subtype because the target tissue and the resulting
    lesion differ.
- name: Obsessive-compulsive disorder
  description: >-
    Shares the DSM-5 chapter and both animal models. Distinguished by the absence of
    obsessions: hair pulling is typically not performed to neutralise an intrusive
    thought, and a substantial proportion of pulling is automatic and outside awareness.

discussions:
- discussion_id: nac_age_dependent_response
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does N-acetylcysteine reduce hair pulling in adults but not in children and
    adolescents?
  attaches_to:
  - pathophysiology#Striatal Glutamate Dysregulation
  rationale: >-
    Two randomised placebo-controlled trials of the same drug in the same disorder
    disagree, and they differ in the age of the participants. If the glutamatergic
    abnormality this entry curates is the drug's target, then either it is not present
    in the same form in children, or it is present but the behaviour is not yet
    maintained by it - which would mean the paediatric and adult disorders are not
    mechanistically the same thing despite sharing a diagnosis. The alternative reading
    is methodological: the paediatric trial was an add-on design in 39 participants and
    may simply have been underpowered.

    Resolving this matters for the entry's structure, not just its treatment list,
    because one reading implies the disorder should eventually be split by age of onset.
  proposed_experiments:
  - experiment_id: age_stratified_striatal_mrs
    name: Age-stratified glutamatergic imaging in trichotillomania
    description: >-
      Magnetic resonance spectroscopy of striatal glutamate in children, adolescents and
      adults with trichotillomania against matched controls, to test whether the
      abnormality inferred from drug response is present, and whether it varies with age.
- discussion_id: rodent_overgrooming_construct_validity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is rodent compulsive overgrooming a model of trichotillomania, or only of a shared
    corticostriatal abnormality?
  attaches_to:
  - pathophysiology#Corticostriatal Synaptic Dysfunction
  rationale: >-
    Both mouse models are presented by their authors as models of OCD, and the entire
    claim to trichotillomania relevance is that the grooming removes hair. But grooming
    is a species-typical rodent behaviour performed to excess, whereas human hair pulling
    is not a normal behaviour intensified, and much of it is automatic rather than
    urge-driven. Neither gene is established in human trichotillomania.

    The gap is worth stating explicitly because the pathophysiology section leans on
    these models for its strongest evidence, including the striatal rescue experiment.
    If the models capture only a generic corticostriatal compulsivity, then they support
    the circuit but not the disorder.
  proposed_experiments:
  - experiment_id: automatic_vs_focused_grooming_dissociation
    name: Behavioural dissociation of automatic and focused pulling in model animals
    description: >-
      Test whether the grooming in Sapap3 and Slitrk5 nulls is sensitive to the
      manipulations that distinguish automatic from focused pulling in humans, rather
      than assuming the topography of the behaviour implies the same mechanism.

notes: >-
  No GeneReviews chapter exists for trichotillomania. Verified by search:
  "trichotillomania GeneReviews[All Fields]" returns zero results. This is expected -
  trichotillomania is a complex behavioural disorder with no established Mendelian form.

  HPO has no term for hair pulling. Verified by search: both "l~trichotillomania" and
  "l~hair pulling" return nothing in the HP build. The behavioural phenotype is therefore
  bound to HP:0000722 Compulsive behaviors with a more specific preferred_term, which is
  the documented pattern for an ontology term that is too broad rather than wrong. The
  resulting hair loss is bound separately to HP:0001596 Alopecia. Neither term is
  specific to this disorder and the pair should not be read as a composite definition of
  it.

  No frequency bands are assigned. The cited reviews describe the phenotype qualitatively,
  and the one quantitative source here is a treatment trial, whose response rates are not
  phenotype frequencies.

  Two references were fetched and deliberately not cited, because both cache with
  content_type "unavailable" and nothing in them can be quoted: PMID:17003809 (SLITRK1
  mutations in trichotillomania) and PMID:35964308 (N-acetylcysteine efficacy across
  body-focused repetitive behaviours). The SLITRK1 finding is named in the genetic
  section as unavailable rather than cited on the strength of its title.

  PMID:28085938 (rare SLITRK5 mutations in OCD) was fetched and read but is not cited.
  It is an OCD study, and its own result is mixed: rare non-synonymous variant prevalence
  did not differ significantly from controls, with only the in vitro synaptogenesis assay
  separating the groups. Citing it as human genetic support for trichotillomania would
  overstate it on both counts.

  Deep-research provenance: the claude_code report resolved 19/19 references with
  confabulation_rate 0.0 and no unresolved identifiers. 13 of 19 were weighed on topic
  and none was flagged off topic, though six were undecided - a record with no abstract
  cannot be assessed for relevance, so this is not a clean bill for all 19. The reference
  set curated here was assembled independently by direct PubMed search.


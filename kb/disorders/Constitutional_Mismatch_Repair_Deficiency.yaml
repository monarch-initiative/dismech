    snippet: During follow up endoscopies, duodenal adenomatous polyps were found and resected.
    explanation: Documents small-bowel (duodenal) neoplasia in a molecularly confirmed CMMRD patient.
- category: Neoplastic
  name: Colorectal Polyposis
  description: >-
    Multiple intestinal adenomas, frequently numerous enough to be described as polyposis
    and historically to prompt a Turcot syndrome label. Low-grade lesions transform to
    high-grade at a very high rate if not resected.
  phenotype_term:
    preferred_term: Colorectal polyposis

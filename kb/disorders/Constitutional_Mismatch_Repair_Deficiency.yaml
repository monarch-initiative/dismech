    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CNS tumours were the most frequent (173 [51%] cancers), followed by gastrointestinal (75 [22%]), haematological (61 [18%]), and other cancer types (30 [9%]).
    explanation: >-

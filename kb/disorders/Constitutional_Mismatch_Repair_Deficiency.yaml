    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MMRD and PPD cancers are commonly lethal due to the inherent resistance to chemo-irradiation.
    explanation: Establishes intrinsic chemo-radioresistance as a defining clinical property of replication-repair-deficient cancers.
- name: Impaired Immunoglobulin Class-Switch Recombination and Somatic Hypermutation
  biological_scale: CELLULAR
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    MMR heterodimers act as a backup pathway for repair of activation-induced cytidine
    deaminase-induced lesions during class-switch recombination and somatic hypermutation.
    In CMMRD this produces measurable B-cell abnormalities - reduced somatic hypermutation
    frequency, skewed IGH subclass usage, reduced class-switched memory B cells and
    plasmablasts. Crucially, these are biological rather than clinical findings: a
    systematic cohort study found no consistent laboratory pattern and no warning signs of
    primary immunodeficiency, so CMMRD should not be curated or managed as an
    immunodeficiency syndrome. The node is retained because the B-cell phenotype is real and
    mechanistically informative about MMR function in vivo.

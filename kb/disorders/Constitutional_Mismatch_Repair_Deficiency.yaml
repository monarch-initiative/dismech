    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Somatic exonuclease-domain variants in POLE or POLD1 acquired within the tumour, on
      the constitutional biallelic MMR background. These are tumour-restricted second
      events, not part of the inherited genotype.
  downstream:
  - target: Neoantigen Generation and T Cell Infiltration
    description: >-
      The extreme coding mutation burden yields a correspondingly extreme load of predicted
      neoepitopes.

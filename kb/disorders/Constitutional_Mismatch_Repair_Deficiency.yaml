- name: Constitutional Microsatellite Instability and Mutator Phenotype
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  mechanism_confidence: ESTABLISHED
  description: >-
    Uncorrected replication errors accumulate as base substitutions and insertion-deletion
    loops, most conspicuously at short tandem repeats. Unlike Lynch syndrome, where
    microsatellite instability appears only after somatic biallelic MMR inactivation in the
    tumour, in CMMRD the instability signature is present in normal blood, gastrointestinal
    and brain tissue, increases with age in the same individual, and its magnitude tracks
    with how early the first cancer appears. Constitutional MSI is therefore both the
    mechanistic core of the syndrome and its most discriminating diagnostic assay.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Median time between cancer diagnoses for patients with more than one cancer was 1·9 years (IQR 0·8-3·9).
    explanation: Establishes that a substantial subgroup develops more than one primary and
      quantifies the interval between them.

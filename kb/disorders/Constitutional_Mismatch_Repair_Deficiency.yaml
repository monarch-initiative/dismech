    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MLH1 or MSH2 variants caused earlier cancer onset than PMS2 or MSH6 variants, and inferior survival
    explanation: Establishes the direction of the gene-defined survival gradient.
  - reference: PMID:38552658

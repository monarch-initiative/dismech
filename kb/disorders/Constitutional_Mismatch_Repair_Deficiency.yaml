progression:
- phase: First cancer in childhood
  age_range: Median 8.9 years (IQR 5.9-12.6)
  notes: >-
    CMMRD is usually recognised when the first malignancy appears, at a median of 8.9
    years. Onset is earliest in the MLH1- and MSH2-related forms and latest in the
    PMS2-related form, so this median sits across a genotype-stratified distribution
    rather than describing a single natural history.
  evidence:
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Median age at diagnosis of CMMRD or a related cancer was 8·9 years (IQR 5·9-12·6), and median follow-up from diagnosis was 7·2 years (3·6-14·8).
    explanation: Gives the median age at first cancer or CMMRD diagnosis in the IRRDC cohort.
- phase: Near-complete cancer penetrance by adulthood
  age_range: By 18 years
  notes: >-
    Cumulative cancer incidence reaches 90% by age 18, which is what makes lifelong
    surveillance from molecular diagnosis rather than from first symptom the standard of
    care. This is a registry cohort ascertained largely through cancer, so the figure is
    an upper estimate for the penetrance of an unselected biallelic genotype.
  evidence:
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cumulative cancer incidence by age 18 years was 90% (95% CI 80-99).
    explanation: Quantifies cumulative cancer incidence by the end of childhood.
- phase: Metachronous second and subsequent cancers
  age_range: Median 1.9 years after the preceding cancer
  notes: >-
    Survivors of a first cancer face a short interval to the next one: the median time
    between successive cancer diagnoses is 1.9 years, and neoplasms arise across 15
    organs. Surveillance therefore does not stop after the first tumour is treated.
  evidence:
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Median time between cancer diagnoses for patients with more than one cancer was 1·9 years (IQR 0·8-3·9).
    explanation: Quantifies the interval between successive primary cancers.
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neoplasms developed in 15 organs and included early-onset adult cancers.
    explanation: Supports the multi-organ distribution of the successive primaries.
- phase: Ten-year survival stratified by tumour group
  age_range: 10 years from cancer diagnosis
  notes: >-
    Outcome is determined mainly by which tumour group presents. CNS tumours carry by far
    the worst prognosis, then haematological, then gastrointestinal, with other solid
    tumours near-uniformly survived. This ordering is the prognostic counterpart of the
    tumour-spectrum frequencies curated in the phenotypes block.
  evidence:
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with CNS tumours had the poorest overall survival rates (39% [95% CI 30-52] at 10 years from diagnosis; log-rank p<0·0001 across four cancer types)
    explanation: Gives 10-year overall survival for the worst-prognosis tumour group and
      establishes that the four groups differ significantly.
- phase: Survival stratified by causative gene
  age_range: 15 years of age
  notes: >-
    Overall survival at age 15 falls in the order PMS2 > MSH6 > MLH1 > MSH2, and within a
    gene, frameshift or truncating variants do worse than missense variants. This gene and
    variant-class gradient is what distinguishes the four subtype entries prognostically,
    and it persists even after surveillance and checkpoint-inhibitor interventions improve
    survival overall.
  evidence:

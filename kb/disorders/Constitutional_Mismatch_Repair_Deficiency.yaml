phenotypes:
- category: Neoplastic
  name: Multiple Metachronous Primary Neoplasms
  description: >-
    Successive independent primary cancers rather than recurrence of one tumour, arising
    across many organs. 339 cancers were recorded in 194 of 201 IRRDC patients, and for
    those with more than one cancer the median interval between diagnoses was 1.9 years.
    This is what makes surveillance lifelong rather than a period of follow-up after a
    single treated tumour, and it distinguishes CMMRD from cancer predispositions whose
    burden is concentrated in one organ system. No `frequency` band is asserted: the
    source reports cancer counts and the inter-cancer interval, not the proportion of
    patients who developed more than one primary.
  phenotype_term:

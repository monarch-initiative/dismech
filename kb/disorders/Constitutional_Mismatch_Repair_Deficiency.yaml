      explanation: Quantifies the neoantigen output of the ultra-hypermutant genome relative to known immunoresponsive tumours.
  - target: Accelerated Multi-Organ Tumorigenesis
    description: >-
      The mutation burst rapidly supplies the driver alterations needed for high-grade

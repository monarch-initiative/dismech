- name: Adaptive Immune Resistance in Hypermutant Tumours
  biological_scale: TISSUE
  role: consequence
  conforms_to: "immune_checkpoint_blockade#Adaptive Immune Resistance"
  mechanism_confidence: ESTABLISHED
  description: >-
    Despite an extreme neoantigen load, CMMRD tumours progress, because PD-1/PD-L1
    engagement suppresses the infiltrating effector T cells. This node is the therapeutic
    target: PD-1 blockade releases the pre-existing anti-tumour response and produces
    durable remissions in tumours - notably recurrent high-grade glioma - that do not
    respond to checkpoint inhibition in the unselected paediatric population. Responses are
    characteristically delayed, and pseudo-progression (flare) is common and should not be
    read as failure. Resistance after initial response is associated with rising CTLA-4
    expression, which is the rationale for CTLA-4-directed salvage.

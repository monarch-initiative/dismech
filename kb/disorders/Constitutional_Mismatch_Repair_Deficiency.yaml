name: Constitutional Mismatch Repair Deficiency
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Constitutional mismatch repair deficiency (CMMRD) is an autosomal recessive childhood
  cancer predisposition syndrome caused by biallelic - that is, two-defective-copy - germline
  pathogenic variants in one of
  the four DNA mismatch repair genes MLH1, MSH2, MSH6 or PMS2. Because both alleles are
  defective in the germ line, mismatch repair fails in every normal tissue rather than only
  in a tumour that has acquired a somatic second hit. That is the mechanistic boundary
  against Lynch syndrome (see `Lynch_Syndrome.yaml`, MONDO:0005835), which is the
  monoallelic disease caused by variants in the same four genes: Lynch carriers have intact
  repair until a somatic second hit occurs in a susceptible epithelium and present with
  adult-onset colorectal, endometrial and other gastrointestinal/genitourinary cancers,
  whereas CMMRD patients carry constitutional microsatellite instability from birth and
  present in the first two decades with CNS tumours, haematological malignancy and early
  gastrointestinal carcinoma, together with cafe-au-lait macules and other pigmentary
  findings that mimic neurofibromatosis type 1. The constitutional mutator state is
  frequently compounded in high-grade tumours by early somatic loss of POLE/POLD1
  proofreading, producing an ultra-hypermutant genome (over 100 mutations per megabase, and
  over 250 in high-grade brain tumours) that exceeds every other childhood cancer and most
  adult cancers, and is the basis for the syndrome's landmark sensitivity to PD-1 immune
  checkpoint blockade. The parents of a CMMRD patient are obligate heterozygous
  carriers and are themselves managed as Lynch syndrome; the two entries are therefore
  cross-referenced rather than merged.
categories:
- Hereditary Cancer Syndrome
- Childhood Cancer Predisposition Syndrome
- DNA Repair Disorder

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  penetrance_percentage: "90% cumulative cancer incidence by age 18 years"
  expressivity: VARIABLE
  description: >-
    CMMRD requires two defective alleles of a single mismatch repair gene (homozygous or
    compound heterozygous). Both parents are obligate heterozygous carriers and are managed
    as Lynch syndrome. Consanguinity and endogamy raise the local frequency substantially.
    Penetrance is very high but not formally complete: cumulative cancer incidence reaches
    90% by age 18 years, and 97% of patients in the largest cohort had developed cancer, so
    it is recorded as INCOMPLETE with a penetrance_percentage of 90 at age 18 rather than
    COMPLETE. Expressivity is highly variable by gene and by variant class - MLH1 and MSH2
    biallelic variants give the earliest onset and worst survival, PMS2 and MSH6 are later
    and milder, and hypomorphic alleles can delay first cancer into adulthood, producing a
    Lynch-like presentation.
  evidence:
  - reference: PMID:24737826
    reference_title: "Diagnostic criteria for constitutional mismatch repair deficiency syndrome: suggestions of the European consortium 'care for CMMRD' (C4CMMRD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Constitutional mismatch repair deficiency (CMMRD) syndrome is a distinct childhood cancer predisposition syndrome that results from biallelic germline mutations in one of the four MMR genes, MLH1, MSH2, MSH6 or PMS2.
    explanation: States the defining biallelic germline genotype across all four MMR genes.
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cumulative cancer incidence by age 18 years was 90% (95% CI 80-99).
    explanation: Quantifies the near-complete penetrance recorded in this Inheritance block.

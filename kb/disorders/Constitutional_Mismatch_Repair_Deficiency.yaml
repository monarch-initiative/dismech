- category: Dermatological
  name: Multiple Cafe-au-Lait Macules
  description: >-
    Present in essentially every CMMRD patient and the single most useful clinical clue.
    They differ from the neurofibromatosis type 1 pattern in being fewer and larger with
    irregular borders, but the overlap is close enough that CMMRD is regularly misdiagnosed
    as NF1 - which matters, because the two have entirely different surveillance
    requirements.
  frequency: VERY_FREQUENT
  diagnostic: true
  phenotype_term:

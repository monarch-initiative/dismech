- name: Somatic Polymerase Proofreading Loss and Ultra-Hypermutation
  biological_scale: MOLECULAR
  role: amplifier
  mechanism_confidence: ESTABLISHED
  description: >-
    An early somatic mutation in the exonuclease (proofreading) domain of POLE or POLD1 is
    frequently acquired and selected in CMMRD high-grade tumours - every ultra-hypermutated
    tumour in the index series carried one. Loss of proofreading on
    top of absent mismatch repair removes both layers of replication-error correction, and
    mutations then accumulate in a rapid burst rather than gradually. The resulting
    ultra-hypermutant genome (in excess of 100, and in brain tumours often over 250,
    mutations per megabase) is the highest burden recorded in human cancer and carries a
    strand-biased signature attributable to the mutant polymerase.
  molecular_functions:
  - preferred_term: 3'-5' exonuclease activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008408

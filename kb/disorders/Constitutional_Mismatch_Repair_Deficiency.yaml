    explanation: Establishes somatic POLE/POLD1 proofreading loss as a recurrent modifier in CMMRD tumours.
diagnosis:
- name: Germline Multigene Panel Testing of MLH1, MSH2, MSH6 and PMS2
  description: >-
    Sequencing plus deletion/duplication analysis of all four MMR genes, with confirmation
    that the two variants are in trans by parental testing. All four genes are tested, not
    only the one whose protein is absent by immunohistochemistry. PMS2 requires
    locus-specific methods because of its pseudogenes. Biallelic pathogenic/likely
    pathogenic variants remain the diagnostic standard.
  evidence:
  - reference: PMID:33622763
    reference_title: "Diagnostic criteria for constitutional mismatch repair deficiency (CMMRD): recommendations from the international consensus working group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The criteria incorporate germline mismatch repair results, ancillary tests and clinical manifestation to determine a diagnosis.
    explanation: States that germline MMR results are the backbone of the consensus diagnostic criteria.
- name: Mismatch Repair Immunohistochemistry in Tumour and Normal Tissue
  description: >-
    Loss of MLH1, MSH2, MSH6 or PMS2 protein staining. In CMMRD, and unlike Lynch syndrome,
    the loss is also present in adjacent NORMAL tissue, which is the single most accessible
    discriminator between the two syndromes. Missense variants that produce a stable but
    non-functional protein can retain staining, so normal immunohistochemistry does not
    exclude the diagnosis.
  evidence:
  - reference: PMID:24440087
    reference_title: "Genetic and clinical determinants of constitutional mismatch repair deficiency syndrome: report from the constitutional mismatch repair deficiency consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Furthermore, screening of normal tissue by immunohistochemistry correlated with genetic confirmation of CMMRD.
    explanation: Supports normal-tissue immunohistochemistry as a CMMRD-specific diagnostic step.
  - reference: PMID:24440087
    reference_title: "Genetic and clinical determinants of constitutional mismatch repair deficiency syndrome: report from the constitutional mismatch repair deficiency consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Tumour immunohistochemistry was 100% sensitive and specific in diagnosing mismatch repair (MMR) deficiency of the corresponding gene while microsatellite instability was neither sensitive nor specific as a diagnostic tool (p<0.0001).
    explanation: >-
      Establishes the performance of immunohistochemistry and, importantly, that conventional
      MSI panels are unreliable in this paediatric setting.
- name: Constitutional Microsatellite Instability Testing (LOGIC / low-pass genome sequencing)
  description: >-
    Quantitative genomic-instability scoring on blood or saliva DNA. Because CMMRD produces
    microsatellite instability in normal tissue, a functional constitutional assay can make
    the diagnosis without a tumour and can resolve cases where genotype is ambiguous
    (variants of uncertain significance, hypomorphic alleles). The LOGIC assay was 100%
    sensitive and specific in childhood cancers and clearly outperformed the conventional
    MSI panel, immunohistochemistry and tumour mutational burden. It remains a specialised
    rather than a universally available test.
  evidence:
  - reference: PMID:36240479
    reference_title: Genomic Microsatellite Signatures Identify Germline Mismatch Repair Deficiency and Risk of Cancer Onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall, LOGIC was 100% sensitive and specific in detecting MMRD in childhood cancers (N = 376).
    explanation: Quantifies the diagnostic performance of the constitutional-instability assay.
  - reference: PMID:36240479
    reference_title: Genomic Microsatellite Signatures Identify Germline Mismatch Repair Deficiency and Risk of Cancer Onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LOGIC was able to distinguish CMMRD from other cancer predisposition syndromes using blood and saliva DNA
    explanation: Supports the tumour-free, blood/saliva-based diagnostic route described here.
- name: C4CMMRD Clinical Scoring System
  description: >-
    A three-point scoring system that weights the patient's malignancy and additional
    features (pigmentary skin findings, brain malformations, pilomatricomas, a second
    childhood malignancy, a Lynch-spectrum tumour in a relative, parental consanguinity),
    with three points triggering diagnostic evaluation. It is a case-finding trigger, not a
    diagnosis: contemporary practice requires molecular or functional confirmation.
  evidence:
  - reference: PMID:24737826
    reference_title: "Diagnostic criteria for constitutional mismatch repair deficiency syndrome: suggestions of the European consortium 'care for CMMRD' (C4CMMRD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: According to the scoring system, CMMRD should be suspected in any cancer patient who reaches a minimum of three points by adding the points of the malignancy and the additional features.
    explanation: States the three-point threshold recorded in this description.
differential_diagnoses:
- name: Lynch Syndrome
  description: >-
    The monoallelic disease caused by variants in the same four genes. Distinguished by
    inheritance (dominant versus recessive), age (adult versus childhood), tumour spectrum
    (gastrointestinal/genitourinary versus CNS-predominant), and decisively by the absence
    of constitutional microsatellite instability and of normal-tissue MMR protein loss.
    A late-onset CMMRD patient with hypomorphic alleles can present exactly like Lynch
    syndrome, so constitutional MSI testing is what resolves the two.
  evidence:
  - reference: PMID:38789506
    reference_title: Constitutional mismatch repair deficiency mimicking Lynch syndrome is associated with hypomorphic mismatch repair gene variants
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lynch syndrome (LS) and constitutional mismatch repair deficiency (CMMRD) are distinct cancer syndromes caused, respectively, by mono- and bi-allelic germline mismatch repair (MMR) variants. LS predisposes to mainly gastrointestinal and genitourinary cancers in adulthood. CMMRD predisposes to brain, haematological, and LS-spectrum cancers from childhood."
    explanation: States the mono- versus biallelic and adult- versus childhood-onset distinction.
- name: Neurofibromatosis Type 1
  description: >-
    The most consequential misdiagnosis. CMMRD patients may fulfil formal NF1 diagnostic
    criteria on pigmentary findings alone, and NF1 shares several tumour types (high-grade
    glioma, acute myeloid leukaemia, rhabdomyosarcoma) with CMMRD. A child labelled NF1 who
    develops a CMMRD-spectrum tumour, or who has no explanatory NF1/SPRED1 variant, should
    be tested for CMMRD - the surveillance implications differ completely.
  evidence:
  - reference: PMID:27779754
    reference_title: Connections between constitutional mismatch repair deficiency syndrome and neurofibromatosis type 1
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This phenotypic overlap may lead to misdiagnosis of CMMRD patients as having NF1, which impedes adequate management of the patients and their families.
    explanation: States the misdiagnosis risk and its clinical cost.
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Frequent dermatological manifestations (117 [93%] of 126 patients with complete data) led to a clinical overlap with neurofibromatosis type 1 (35 [28%] of 126).
    explanation: Quantifies how often the NF1 overlap actually arises in a large CMMRD cohort.
- name: Legius Syndrome
  description: >-
    SPRED1-related. Shares cafe-au-lait macules and freckling with both NF1 and CMMRD but
    lacks the CMMRD tumour spectrum and constitutional microsatellite instability.
  evidence:
  - reference: PMID:41333974
    reference_title: "Genotype-phenotype correlations in PMS2-associated constitutional mismatch repair deficiency: a systematic literature review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As clinical phenotype in CMMRD overlaps with other rare genetic diseases, such as neurofibromatosis type 1 (NF1) and Legius syndrome
    explanation: Names Legius syndrome among the phenotypic mimics of CMMRD.
- name: Polymerase Proofreading-Associated Polyposis
  description: >-
    Germline heterozygous POLE or POLD1 exonuclease-domain variants causing multiple
    colorectal adenomas and early-onset colorectal cancer. The mechanistic mirror image of
    the somatic proofreading loss modelled here: in CMMRD the proofreading defect is
    acquired in the tumour on top of a constitutional mismatch repair defect, whereas in
    PPAP it is the constitutional lesion and mismatch repair is intact. That difference is
    what the laboratory sees - PPAP tumours are hypermutated but microsatellite stable and
    retain normal MMR protein staining, while CMMRD shows constitutional microsatellite
    instability and MMR protein loss in normal tissue. Inheritance is dominant rather than
    recessive.
  evidence:
  - reference: PMID:23263490
    reference_title: Germline mutations affecting the proofreading domains of POLE and POLD1 predispose to colorectal adenomas and carcinomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified specific heterozygous POLE or POLD1 germline variants in several multiple-adenoma and/or CRC cases but in no controls
    explanation: Establishes PPAP as a distinct germline proofreading-deficiency cancer
      predisposition, and its heterozygous (dominant) genetics.
  - reference: PMID:23263490
    reference_title: Germline mutations affecting the proofreading domains of POLE and POLD1 predispose to colorectal adenomas and carcinomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the tumors from mutation carriers were microsatellite stable but tended to acquire base substitution mutations
    explanation: Gives the discriminating laboratory finding - microsatellite stability -
      that separates PPAP from CMMRD.
treatments:
- name: PD-1 Immune Checkpoint Blockade
  description: >-
    Nivolumab or pembrolizumab. The landmark targeted therapy for CMMRD: the ultra-high
    mutation and neoantigen burden makes these tumours checkpoint-responsive even in
    settings - recurrent high-grade glioma, CNS disease - where unselected paediatric
    trials had failed. Responses are frequently delayed, so best overall response
    substantially exceeds initial objective response, and pseudo-progression (flare) must
    not be mistaken for failure. Registered as a phase 1/2 pilot trial (NCT02992964) in
    children with tumour mutational burden at or above 5 mutations/Mb and/or mismatch repair
    deficiency.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  target_mechanisms:
  - target: Adaptive Immune Resistance in Hypermutant Tumours
    treatment_effect: INHIBITS
    description: >-
      Anti-PD-1 antibodies block the PD-1/PD-L1 interaction that suppresses the
      neoantigen-driven T cell response already present in these tumours, releasing
      pre-existing anti-tumour immunity rather than creating it.
    evidence:
    - reference: PMID:37126021
      reference_title: Efficacy of Nivolumab in Pediatric Cancers with High Mutation Burden and Mismatch Repair Deficiency
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Delayed immune responses contributed to best overall response of 50%, improving on initial objective responses (20%) and leading to 2-year overall survival (OS) of 50%
      explanation: Quantifies the response and survival benefit of releasing this checkpoint node.
  evidence:
  - reference: PMID:37126021
    reference_title: Efficacy of Nivolumab in Pediatric Cancers with High Mutation Burden and Mismatch Repair Deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nivolumab resulted in durable responses and prolonged survival for the first time in a pediatric trial of refractory hypermutated cancers including malignant gliomas.
    explanation: Primary prospective trial conclusion supporting PD-1 blockade in this population.
  - reference: PMID:37126021
    reference_title: Efficacy of Nivolumab in Pediatric Cancers with High Mutation Burden and Mismatch Repair Deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four children, including three with refractory malignant gliomas are in complete remission at a median follow-up of 37 months
    explanation: Documents the durability of the responses recorded in the description.
  - reference: PMID:34992263
    reference_title: Genomic predictors of response to PD-1 inhibition in children with germline DNA replication repair deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Durable objective responses were observed in most patients, culminating in a 3 year survival of 41.4%.
    explanation: Independent international registry series supporting durable benefit from PD-1 inhibition.
  - reference: PMID:27001570
    reference_title: Immune Checkpoint Inhibition for Hypermutant Glioblastoma Multiforme Resulting From Germline Biallelic Mismatch Repair Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we treated two bMMRD siblings with recurrent multifocal GBM with the anti-programmed death-1 inhibitor nivolumab, which resulted in clinically significant responses and a profound radiologic response
    explanation: The index observation that established the checkpoint-blockade indication in CMMRD.
- name: CTLA-4 Blockade After Anti-PD-1 Failure
  description: >-
    Anti-CTLA-4 antibody added to checkpoint-inhibitor-based therapy continued beyond
    progression. Progression on anti-PD-1 monotherapy is not the end of the immune-directed
    option: CTLA-4 expression rises over time, and CTLA-4 inhibition produces response or
    stable disease in most such patients. Continuing checkpoint-inhibitor-based salvage
    after a second progression prolongs survival, most clearly in tumours with extreme
    mutation burden. Local and systemic immune adverse events are frequent, and are more
    frequent in biallelic mismatch repair deficiency than in Lynch syndrome. Reirradiation
    and RAS-MAPK-pathway inhibition are curated separately as the other two salvage arms
    reported in the same series.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-CTLA-4 monoclonal antibody
      term:
        id: NCIT:C128036
        label: Anti-CTLA-4 Monoclonal Antibody
  target_mechanisms:
  - target: Adaptive Immune Resistance in Hypermutant Tumours
    treatment_effect: INHIBITS
    description: >-
      CTLA-4 blockade targets the checkpoint axis that becomes dominant as PD-1-directed
      resistance evolves, re-engaging the same neoantigen-driven T cell response.
    evidence:
    - reference: PMID:37823831
      reference_title: "Combined Immunotherapy Improves Outcome for Replication-Repair-Deficient (RRD) High-Grade Glioma Failing Anti-PD-1 Monotherapy: A Report from the International RRD Consortium."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: CTLA4 expression increased over time, and subsequent CTLA4 inhibition resulted in response/stable disease in 75%.
      explanation: Directly supports CTLA-4 blockade acting on the evolved checkpoint-resistance node.
  evidence:
  - reference: PMID:37823831
    reference_title: "Combined Immunotherapy Improves Outcome for Replication-Repair-Deficient (RRD) High-Grade Glioma Failing Anti-PD-1 Monotherapy: A Report from the International RRD Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After second progression/recurrence (n = 55), continuing ICI-based salvage prolonged survival to 11.6 months (n = 38; P < 0.001), particularly for those with extreme mutation burden (P = 0.03).
    explanation: Quantifies the survival benefit of continuing immune-directed therapy past anti-PD-1 failure.
  - reference: PMID:37823831
    reference_title: "Combined Immunotherapy Improves Outcome for Replication-Repair-Deficient (RRD) High-Grade Glioma Failing Anti-PD-1 Monotherapy: A Report from the International RRD Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Local (flare) and systemic immune adverse events were frequent (biallelic mismatch-repair deficiency > Lynch syndrome)."
    explanation: Supports the toxicity statement and its CMMRD-versus-Lynch gradient.
- name: Reirradiation
  description: >-
    Repeat irradiation of a progressive replication-repair-deficient high-grade glioma,
    given as part of salvage therapy after failure of anti-PD-1 monotherapy. Response is
    reported to track with tumour genomics rather than radiation dose alone: tumours that
    respond lack the deleterious post-radiation indel signature (ID8) that marks
    radiation-refractory disease, which makes mutational-signature analysis a candidate
    selection tool rather than a post-hoc description. Curated here as a distinct modality
    from the CTLA-4 and RAS-MAPK salvage arms reported in the same series; no
    mechanism-level join point is asserted, because the cited evidence characterises which
    tumours respond rather than the node reirradiation acts on.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:37823831
    reference_title: "Combined Immunotherapy Improves Outcome for Replication-Repair-Deficient (RRD) High-Grade Glioma Failing Anti-PD-1 Monotherapy: A Report from the International RRD Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Response to reirradiation was explained by an absence of deleterious postradiation indel signatures (ID8).
    explanation: Supports reirradiation as an active salvage arm and identifies the genomic
      correlate of response.
- name: RAS-MAPK Pathway Inhibition as Immune-Directed Salvage
  description: >-
    Targeted inhibition of the RAS-MAPK pathway used alongside continued checkpoint
    inhibition after anti-PD-1 failure. Reported to reinvigorate both peripheral immune
    responses and radiologic responses, placing it with CTLA-4 blockade as an
    immune-directed rather than purely cytotoxic salvage arm. The evidence is a
    consortium case series, not a randomised comparison, and no specific agent is named in
    the source, so the agent is bound at drug-class level.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mitogen-activated protein kinase inhibitor
      term:
        id: NCIT:C2149
        label: Mitogen-Activated Protein Kinase Inhibitor
  target_mechanisms:
  - target: Adaptive Immune Resistance in Hypermutant Tumours
    treatment_effect: INHIBITS
    description: >-
      RAS-MAPK-pathway inhibition restores the peripheral immune response that adaptive
      resistance had suppressed, acting on the same node as the checkpoint antibodies
      rather than on tumour proliferation alone.
    evidence:
    - reference: PMID:37823831
      reference_title: "Combined Immunotherapy Improves Outcome for Replication-Repair-Deficient (RRD) High-Grade Glioma Failing Anti-PD-1 Monotherapy: A Report from the International RRD Consortium."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: RAS-MAPK-pathway inhibition led to the reinvigoration of peripheral immune and radiologic responses.
      explanation: Supports RAS-MAPK inhibition relieving adaptive immune resistance rather
        than acting only as a cytostatic agent.
- name: Structured Cancer Surveillance Protocol
  description: >-
    The consensus international surveillance protocol - annual brain MRI, regular upper and
    lower gastrointestinal endoscopy, whole-body MRI and clinical examination - beginning at
    molecular diagnosis. This is the single most effective intervention in CMMRD:
    five-year survival is 90% when the cancer is found asymptomatically against 50% when it
    presents symptomatically, and adherence to full
    surveillance is associated with four-year survival of 79% against 15% for those not
    under surveillance. Its effectiveness is unevenly distributed: nearly all
    gastrointestinal and other solid tumours and three-quarters of brain cancers are caught
    asymptomatically, but only a small minority of haematological malignancies are. These
    are non-randomised comparisons and are vulnerable to lead-time and ascertainment bias.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:33945292
    reference_title: Survival Benefit for Individuals With Constitutional Mismatch Repair Deficiency Undergoing Surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patient outcome measured by adherence to the surveillance protocol revealed 4-year OS of 79% (95% CI, 54.8 to 90.9) for patients undergoing full surveillance, 55% (95% CI, 28.5 to 74.5) for partial surveillance, and 15% (95% CI, 5.2 to 28.8) for those not under surveillance (P < .0001).
    explanation: Quantifies the dose-response relationship between surveillance adherence and survival.
  - reference: PMID:33945292
    reference_title: Survival Benefit for Individuals With Constitutional Mismatch Repair Deficiency Undergoing Surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For patients undergoing surveillance, all GI and other solid tumors, and 75% of brain cancers were detected asymptomatically.
    explanation: Supports the uneven yield of the protocol across tumour types described here.
  - reference: PMID:24440087
    reference_title: "Genetic and clinical determinants of constitutional mismatch repair deficiency syndrome: report from the constitutional mismatch repair deficiency consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The surveillance protocol detected 39 lesions which included asymptomatic malignant gliomas and gastrointestinal carcinomas.
    explanation: Early consortium evidence that the protocol detects lesions before they become symptomatic.
  - reference: PMID:33945292
    reference_title: Survival Benefit for Individuals With Constitutional Mismatch Repair Deficiency Undergoing Surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five-year overall survival (OS) was 90% (95% CI, 78.6 to 100) and 50% (95% CI, 39.2 to 63.7) when cancer was detected asymptomatically and symptomatically, respectively"
    explanation: Gives the asymptomatic-versus-symptomatic five-year survival figures quoted in this description.
  - reference: PMID:38789506
    reference_title: Constitutional mismatch repair deficiency mimicking Lynch syndrome is associated with hypomorphic mismatch repair gene variants
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: individuals with CMMRD are recommended annual gastrointestinal surveillance from as early as 6 years, annual brain magnetic resonance imaging (MRI) from initial diagnosis or at latest aged 2 years, and annual clinical examination, among other interventions
    explanation: >-
      Sets out the components and start ages of the recommended protocol, and contrasts them
      with the much later adult schedule offered to Lynch syndrome carriers.
- name: Endoscopic Surveillance and Polypectomy
  description: >-
    Regular upper and lower gastrointestinal endoscopy with resection of adenomas. Because
    low-grade gastrointestinal lesions in CMMRD transform at a very high rate within a few
    years, polypectomy is therapeutic rather than merely diagnostic.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: colonoscopy
    term:
      id: NCIT:C16450
      label: Colonoscopy
  evidence:
  - reference: PMID:33945292
    reference_title: Survival Benefit for Individuals With Constitutional Mismatch Repair Deficiency Undergoing Surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 64 low-grade tumors detected, the cumulative likelihood of transformation from low-to high-grade was 81% for GI cancers within 8 years and 100% for gliomas in 6 years.
    explanation: Supports resection rather than observation of low-grade gastrointestinal lesions.
- name: Surgical Resection
  description: >-
    Maximal safe resection of CNS tumours and segmental or more extensive bowel surgery
    according to polyp and tumour burden. Surveillance-detected lesions are typically
    resectable in full, which is a large part of why surveillance changes survival.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:24440087
    reference_title: "Genetic and clinical determinants of constitutional mismatch repair deficiency syndrome: report from the constitutional mismatch repair deficiency consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All tumours were amenable to complete resection and all patients undergoing surveillance are alive.
    explanation: Supports complete surgical resection of surveillance-detected lesions.
- name: Genetic Counselling and Cascade Family Testing
  description: >-
    Both parents of a CMMRD proband are obligate heterozygous MMR variant carriers and
    require Lynch syndrome counselling and adult surveillance, as do many other relatives.
    Siblings have a one-in-four risk of CMMRD. Family history is often uninformative -
    Lynch-spectrum adult cancers were documented in only a minority of CMMRD families - so
    an unremarkable pedigree must not be used to argue against the diagnosis.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24440087
    reference_title: "Genetic and clinical determinants of constitutional mismatch repair deficiency syndrome: report from the constitutional mismatch repair deficiency consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CMMRD is a highly penetrant syndrome where family history of cancer may not be contributory."
    explanation: Supports the warning that an unremarkable family history does not exclude CMMRD.
  - reference: PMID:24440087
    reference_title: "Genetic and clinical determinants of constitutional mismatch repair deficiency syndrome: report from the constitutional mismatch repair deficiency consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While childhood CMMRD related tumours were observed in all families, Lynch related tumours in adults were observed in only 2/14 families
    explanation: Quantifies how often the parental Lynch phenotype is actually visible in the pedigree.
animal_models:
- name: MMR knockout mouse panel (Msh2, Msh6, Mlh1, Pms2)
  species: Mouse
  genotype: Homozygous germline knockout of Msh2, Msh6, Mlh1 or Pms2
  publication: PMID:26708047
  description: >-
    Germline knockout lines for each of the four genes that cause CMMRD in humans. Because
    the knockouts are homozygous null they match the biallelic constitutional state, unlike
    the heterozygous lines used to model Lynch syndrome, and they establish that loss of
    each gene alone is sufficient for a systemic mutator phenotype and cancer
    predisposition. The same panel supplies the only in vivo evidence for the
    class-switch-recombination arm of the syndrome.
  evidence:
  - reference: PMID:26708047
    reference_title: Mouse models of DNA mismatch repair in cancer research.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the generation and analysis of mouse lines with knockout mutations in all of the known MMR genes has provided insight into how loss of individual MMR genes affects genome stability and contributes to cancer susceptibility
    explanation: Establishes the knockout panel as the standard in vivo system for MMR loss.
  modeled_mechanisms:
  - target: Constitutional Microsatellite Instability and Mutator Phenotype
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Null mice for each of the four genes develop a systemic mutator phenotype and are
      cancer-predisposed, which is the constitutional consequence this node asserts.
    limitations: >-
      The review is framed around modelling Lynch syndrome and sporadic MMR-deficient
      colorectal cancer rather than CMMRD, and reports the mutator and cancer-predisposition
      phenotypes without establishing the CNS-predominant tumour distribution that defines
      the human syndrome. Treat the model as informative for the mutator phenotype itself,
      not for the tissue-specific transformation risk that the tumour-spectrum knowledge gap
      asks about.
    readouts:
    - name: Mutator phenotype and cancer predisposition in MMR-null mice
      target: Constitutional Microsatellite Instability and Mutator Phenotype
      description: >-
        Mutation-rate and tumour-incidence phenotypes reported across the Msh2, Msh6, Mlh1
        and Pms2 null lines.
      direction: INCREASED
      interpretation: >-
        Each of the four genes that cause human CMMRD produces the mutator phenotype on its
        own when knocked out, matching the genetic architecture of the syndrome.
      evidence:
      - reference: PMID:26708047
        reference_title: Mouse models of DNA mismatch repair in cancer research.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: mouse lines with knockout mutations in Msh2, Msh6, Mlh1 and Pms2 that form the MutSα (Msh2-Msh6) and MutLα (Mlh1-Pms2) complexes and play major roles in the repair of RERs in eukaryotic cells and the MMR-dependent DDR, display strong mutator and cancer predisposition phenotypes
        explanation: Reports the mutator and cancer-predisposition phenotypes for exactly
          the four CMMRD genes.
    evidence:
    - reference: PMID:26708047
      reference_title: Mouse models of DNA mismatch repair in cancer research.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: mouse models with mutations in all known MSH and MLH genes have been generated to study their roles in genome maintenance and tumor suppression
      explanation: Supports treating the knockout panel as informative for the genome
        instability node.
  - target: Impaired Immunoglobulin Class-Switch Recombination and Somatic Hypermutation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The same knockout panel is where the requirement for MMR proteins in B cell maturation
      was established, which is the mechanistic basis for the immunoglobulin abnormalities
      seen in CMMRD patients.
    limitations: >-
      The abstract reports an essential function in B cell maturation without separating
      class-switch recombination from somatic hypermutation or quantifying the immunoglobulin
      deficit, and mouse B cell development is not a substitute for the human immunological
      phenotype, which in patients is a laboratory abnormality rather than overt clinical
      immunodeficiency.
    evidence:
    - reference: PMID:26708047
      reference_title: Mouse models of DNA mismatch repair in cancer research.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These studies also revealed essential functions for some of the MMR genes in B cell maturation and fertility.
      explanation: In vivo support for the B cell maturation arm of the syndrome.
- name: Germline MMR-deficient de novo mouse glioma model (Msh2 or Msh6 loss)
  species: Mouse
  genotype: De novo high-grade glioma with germline or somatic Msh2 or Msh6 loss
  publication: PMID:41433099
  description: >-
    De novo mouse models of germline and somatic MMR-deficient high-grade glioma, built to
    test which parts of the human MMR-deficient glioma phenotype follow from MMR loss alone.
    The answer was largely negative, which is what makes this model informative: germline MMR
    deficiency accelerated progression from low-grade to high-grade glioma and shortened
    survival, but did so through the tumour immune microenvironment rather than by producing
    the hypermutation and checkpoint sensitivity that define human CMMRD gliomas.
  evidence:
  - reference: PMID:41433099
    reference_title: Mismatch repair deficiency drives malignant progression and alters the tumor immune microenvironment in glioblastoma models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Here, we developed de novo mouse models of germline and somatic MMR-deficient (MMRd) HGGs.
    explanation: Establishes the model system and that it covers the germline (CMMRD-like)
      as well as the somatic case.
  modeled_mechanisms:
  - target: Somatic Polymerase Proofreading Loss and Ultra-Hypermutation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Loss of Msh2 or Msh6 in mouse glioma did not produce high tumour mutation burden or
      microsatellite instability, and did not confer response to PD-1 blockade. The
      hypermutation that makes human CMMRD gliomas checkpoint-responsive therefore does not
      follow from MMR loss alone in this system.
    limitations: >-
      The mouse models carry MMR loss without the somatic POLE or POLD1 exonuclease-domain
      lesion that this node asserts is the source of ultra-hypermutation in human CMMRD
      tumours, so the negative result is consistent with the two-step model curated here
      rather than a refutation of it - but it does mean the model cannot be used to study
      the hypermutant state or its checkpoint sensitivity. The same paper reports the
      corresponding discordance in human GBM, so this is not a purely murine artefact.
    readouts:
    - name: Tumour mutation burden and microsatellite instability in MMR-null mouse glioma
      target: Somatic Polymerase Proofreading Loss and Ultra-Hypermutation
      description: >-
        TMB and MSI measured in de novo mouse gliomas after Msh2 or Msh6 loss, with
        anti-PD-1 response as the functional readout.
      direction: UNCHANGED
      interpretation: >-
        A real negative: MMR loss alone leaves mutation burden and microsatellite status
        unchanged, so the ultra-hypermutant phenotype requires the additional somatic
        proofreading lesion.
      evidence:
      - reference: PMID:41433099
        reference_title: Mismatch repair deficiency drives malignant progression and alters the tumor immune microenvironment in glioblastoma models.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Surprisingly, loss of Msh2 or Msh6 did not lead to high TMB, MSI, nor did it confer a response to anti-programmed cell death 1 (anti-PD-1) in GBM.
        explanation: The negative result itself.
    evidence:
    - reference: PMID:41433099
      reference_title: Mismatch repair deficiency drives malignant progression and alters the tumor immune microenvironment in glioblastoma models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: human GBM showed discordance between MMR gene mutations and the TMB and MSI
      explanation: Shows the same discordance in human tumours, so the failure is not
        attributable to species alone.
  - target: Accelerated Multi-Organ Tumorigenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Germline MMR deficiency accelerated progression from low-grade to high-grade glioma and
      shortened survival, reproducing the accelerated-tumorigenesis consequence in the CNS
      compartment that dominates the human tumour spectrum.
    limitations: >-
      Only the CNS arm is modelled, so the multi-organ distribution the node asserts is not
      reproduced, and the effect was driven by the tumour immune microenvironment rather than
      being tumour-cell intrinsic. That is a mechanistically different route to accelerated
      progression from the cell-intrinsic mutation accumulation curated upstream of this node.
    readouts:
    - name: Progression from low-grade to high-grade glioma and survival
      target: Accelerated Multi-Organ Tumorigenesis
      description: >-
        Grade progression and overall survival in germline MMR-deficient versus
        MMR-proficient tumour-bearing mice.
      direction: INCREASED
      interpretation: >-
        Faster grade progression with shorter survival is the model's counterpart of
        accelerated tumorigenesis, restricted to the CNS.
      evidence:
      - reference: PMID:41433099
        reference_title: Mismatch repair deficiency drives malignant progression and alters the tumor immune microenvironment in glioblastoma models.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Germline MMRd promoted the progression from low-grade to HGG and reduced survival compared with MMR-proficient (MMRp) tumor-bearing mice.
        explanation: Reports the acceleration and the survival cost.
    evidence:
    - reference: PMID:41433099
      reference_title: Mismatch repair deficiency drives malignant progression and alters the tumor immune microenvironment in glioblastoma models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: This effect was not tumor cell intrinsic but was associated with MMRd in the tumor immune microenvironment, driving immunosuppressive myeloid programs, reduced lymphoid infiltration, and CD8+ T cell exhaustion.
      explanation: Identifies the route by which the model accelerates tumorigenesis, and so
        the respect in which it only partially matches the human node.
experimental_models:
- name: CMMRD patient-derived lymphoblastoid cell lines (MSI and methylation-tolerance assay)
  experimental_model_type: CELL_LINE
  cell_source: Patient-derived (EBV-immortalized peripheral blood lymphocytes)
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  description: >-
    Lymphoblastoid cells from CMMRD patients and MMR-proficient controls, assayed for
    microsatellite instability by PCR and for tolerance to methylating and thiopurine agents.
    This is the human ex vivo system in which the two defining constitutional consequences of
    biallelic MMR loss - instability in normal (non-tumour) cells, and loss of the
    MMR-dependent damage response - are measured directly, and it is also the basis of a
    diagnostic assay for the 30% of patients whose gene screening is uninformative.
  publication: PMID:26116798
  evidence:
  - reference: PMID:26116798
    reference_title: Diagnosis of Constitutional Mismatch Repair-Deficiency Syndrome Based on Microsatellite Instability and Lymphocyte Tolerance to Methylating Agents.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We examined MSI by PCR analysis and tolerance to methylating or thiopurine agents (functional characteristics of MMR-deficient tumor cells) in lymphoblastoid cells (LCs) from 3 patients with CMMRD and 5 individuals with MMR-proficient LCs (controls).
    explanation: Describes the model system and its two readouts against MMR-proficient
      controls.
  modeled_mechanisms:
  - target: Constitutional Microsatellite Instability and Mutator Phenotype
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Microsatellite instability is measured in normal patient-derived cells rather than in
      tumour, which is exactly the constitutional claim this node makes and the feature that
      separates CMMRD from Lynch syndrome.
    limitations: >-
      EBV-immortalized lymphoblastoid cells are a proliferating lymphoid compartment and
      cannot report the tissue gradient in constitutional instability that the tumour-spectrum
      knowledge gap concerns; instability measured in this compartment says nothing about
      brain or intestine.
    evidence:
    - reference: PMID:26116798
      reference_title: Diagnosis of Constitutional Mismatch Repair-Deficiency Syndrome Based on Microsatellite Instability and Lymphocyte Tolerance to Methylating Agents.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Using these assays, we defined experimental parameters that allowed discrimination of a series of 14 patients with CMMRD from 52 controls (training set).
      explanation: Supports treating this cell system as informative for the constitutional
        instability node, at a cohort size that establishes the parameters rather than
        illustrating them.
    readouts:
    - name: Microsatellite instability in lymphoblastoid cells
      target: Constitutional Microsatellite Instability and Mutator Phenotype
      description: PCR-based MSI analysis of patient versus control lymphoblastoid lines.
      direction: INCREASED
      interpretation: >-
        Instability present in non-neoplastic patient cells is the direct measurement of the
        constitutional mutator phenotype.
      evidence:
      - reference: PMID:26116798
        reference_title: Diagnosis of Constitutional Mismatch Repair-Deficiency Syndrome Based on Microsatellite Instability and Lymphocyte Tolerance to Methylating Agents.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: In the training set, we identified parameters, based on MSI and LC tolerance to methylation, that detected patients with CMMRD vs controls with 100% sensitivity and 100% specificity.
        explanation: The measurement separates patients from controls without error in the
          training set.
  - target: Loss of MMR-Dependent Damage Signalling and Alkylating Agent Tolerance
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Tolerance of patient lymphoblastoid cells to methylating and thiopurine agents is the
      functional assay for the loss of MMR-dependent damage signalling asserted by this node.
    limitations: >-
      The assay demonstrates tolerance in a lymphoid cell line; it does not establish the
      clinical consequence for alkylating-agent chemotherapy in CMMRD tumours, which is
      inferred rather than measured here.
    evidence:
    - reference: PMID:26116798
      reference_title: Diagnosis of Constitutional Mismatch Repair-Deficiency Syndrome Based on Microsatellite Instability and Lymphocyte Tolerance to Methylating Agents.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Among 23 patients suspected of having CMMRD, 6 had MSI and LC tolerance to methylation (CMMRD highly probable), 15 had neither MSI nor LC tolerance to methylation (unlikely to have CMMRD), and 2 were considered doubtful for CMMRD based on having only 1 of the 2 features.
      explanation: Methylation tolerance and instability can dissociate in individual
        patients, which is why this link is curated against the damage-signalling node
        separately from the instability node rather than folded into it.
    readouts:
    - name: Lymphoblastoid cell tolerance to methylating agents
      target: Loss of MMR-Dependent Damage Signalling and Alkylating Agent Tolerance
      description: >-
        Survival of patient versus control lymphoblastoid cells exposed to methylating or
        thiopurine agents.
      direction: INCREASED
      interpretation: >-
        Failure to die after methylation damage is the functional signature of an absent
        MMR-dependent damage response.
      evidence:
      - reference: PMID:26116798
        reference_title: Diagnosis of Constitutional Mismatch Repair-Deficiency Syndrome Based on Microsatellite Instability and Lymphocyte Tolerance to Methylating Agents.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The presence of MSI and tolerance to methylation in LCs identified patients with CMMRD with 100% sensitivity and specificity.
        explanation: Reports methylation tolerance as a measured, discriminating property of
          patient cells.
clinical_trials:
- name: NCT02992964
  phase: PHASE_I
  status: TERMINATED
  description: >-
    Pilot study of nivolumab in paediatric patients with recurrent or refractory hypermutant
    cancers, the first prospective paediatric trial restricted to tumours with mutational
    burden at or above 5 mutations/Mb and/or mismatch repair deficiency. Registered on
    ClinicalTrials.gov as phase 1/2 and terminated after limited enrolment, but it generated
    the published efficacy cohort that established checkpoint blockade in CMMRD. Recorded
    here as PHASE_I because the dismech phase enum has no combined phase 1/2 value.
  target_phenotypes:
  - preferred_term: Glioblastoma multiforme
    term:
      id: HP:0012174
      label: Glioblastoma multiforme
  - preferred_term: Brain neoplasm
    term:
      id: HP:0030692
      label: Brain neoplasm
  evidence:
  - reference: clinicaltrials:NCT02992964
    reference_title: Pilot Study of Nivolumab in Pediatric Patients With Hypermutant Cancers
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study is to assess clinical and radiological benefits of treatment with Nivolumab in children with hypermutated cancers, including those with bMMRD syndrome.
    explanation: The trial record states the CMMRD (bMMRD) population and the checkpoint-blockade intervention.
  - reference: PMID:37126021
    reference_title: Efficacy of Nivolumab in Pediatric Cancers with High Mutation Burden and Mismatch Repair Deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first prospective pediatric trial (NCT02992964) using nivolumab exclusively for refractory nonhematologic cancers harboring tumor mutation burden (TMB) ≥5 mutations/megabase (mut/Mb) and/or mismatch repair deficiency (MMRD)."
    explanation: Publication of the trial, giving its eligibility criteria and identifier.
- name: NCT05770102
  phase: PHASE_II
  status: RECRUITING
  description: >-
    DETERMINE treatment arm 02: atezolizumab (anti-PD-L1) in adult, paediatric and
    teenage/young adult patients whose cancers are TMB-high, MSI-high, or who have proven
    CMMRD. A UK national umbrella-basket platform trial testing whether an approved
    checkpoint inhibitor extends to rare molecularly defined indications; it is the
    currently open trial that admits CMMRD patients by predisposition rather than by tumour
    type. Registered as phase 2/3; recorded here as PHASE_II because the dismech phase enum
    has no combined value.
  target_phenotypes:
  - preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
  evidence:
  - reference: clinicaltrials:NCT05770102
    reference_title: "DETERMINE Treatment Arm 02: Atezolizumab in Adult, Paediatric and Teenage/Young Adult Patients With Cancers With High TMB or MSI-high or Proven CMMRD Disposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Atezolizumab works in patients with these types of cancers which have certain changes in the cancer cells called high tumour mutational burden (TMB) or high microsatellite instability (MSI) or proven (previously diagnosed) constitutional mismatch repair deficiency (CMMRD).
    explanation: The trial record states that proven CMMRD is an eligibility route into this
      checkpoint-inhibitor arm.
discussions:
- discussion_id: cmmrd_normal_tissue_mmr_kinetics
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do CNS, gastrointestinal and lymphoid compartments transform preferentially in
    CMMRD when mismatch repair is absent from every tissue?
  attaches_to:
  - "pathophysiology#Constitutional Microsatellite Instability and Mutator Phenotype"
  - "pathophysiology#Accelerated Multi-Organ Tumorigenesis"
  rationale: >-
    Constitutional instability is systemic, yet the tumour spectrum is not. Constitutional
    instability scores differ by tissue (gastrointestinal > blood > brain) and rise with age
    within an individual, so the tissue-specific transformation risk is not simply a
    function of measured instability. The determinants - proliferative index of the stem
    compartment, tissue-specific dependence on MMR versus backup pathways, immune
    surveillance, or the tissue-specific probability of acquiring the somatic POLE/POLD1
    hit - have not been disentangled. Getting this right would sharpen surveillance
    intervals, which are currently uniform rather than risk-weighted by tissue.
  proposed_experiments:
  - experiment_id: exp_cmmrd_tissue_resolved_mutation_burden
    name: Clone-resolved mutation burden across matched normal tissues in CMMRD
    description: >-
      Measure somatic mutation burden and microsatellite indel load at single-cell or
      clone-resolved depth in matched normal brain, intestinal crypt and haematopoietic
      compartments from the same CMMRD individual, and test whether the compartment with
      the highest measured instability is the compartment that transforms first.
    evidence:
    - reference: PMID:36240479
      reference_title: Genomic Microsatellite Signatures Identify Germline Mismatch Repair Deficiency and Risk of Cancer Onset.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In normal cells, MMRDness scores differed between tissues (GI > blood > brain)
      explanation: >-
        Design rationale - a tissue gradient in constitutional instability is already
        measurable, so a clone-resolved comparison across the same tissues is feasible.
  - experiment_id: exp_cmmrd_longitudinal_instability_vs_first_cancer
    name: Longitudinal constitutional-instability scoring against organ of first cancer
    description: >-
      Score constitutional genomic instability serially in blood and, where available,
      gastrointestinal tissue from a prospective CMMRD surveillance cohort, and test
      whether the instability trajectory predicts the organ and timing of the first
      cancer well enough to justify tissue-weighted rather than uniform surveillance
      intervals.
    evidence:
    - reference: PMID:36240479
      reference_title: Genomic Microsatellite Signatures Identify Germline Mismatch Repair Deficiency and Risk of Cancer Onset.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Importantly, increased MMRDness score was associated with younger age of first cancer presentation in individuals with CMMRD
      explanation: >-
        Design rationale - instability score already predicts age at first cancer, so the
        proposed extension to organ of first cancer is a tractable next step.
  evidence:
  - reference: PMID:36240479
    reference_title: Genomic Microsatellite Signatures Identify Germline Mismatch Repair Deficiency and Risk of Cancer Onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In normal cells, MMRDness scores differed between tissues (GI > blood > brain), increased over time in the same individual, and revealed genotype-phenotype associations within the mismatch repair genes.
    explanation: >-
      Documents the tissue-dependent and age-dependent instability that this gap asks to be
      reconciled with the observed tumour spectrum.
- discussion_id: cmmrd_hypomorphic_penetrance_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much residual mismatch repair activity is compatible with an adult-onset,
    Lynch-like phenotype, and where does the CMMRD/Lynch management boundary fall for
    biallelic carriers of hypomorphic variants?
  attaches_to:
  - "pathophysiology#Biallelic Germline Mismatch Repair Gene Inactivation"
  rationale: >-
    Late-onset CMMRD is currently recognised case by case, after constitutional MSI testing
    contradicts an assumed Lynch diagnosis. There is no calibrated relationship between
    residual repair activity and age at first cancer, so a biallelic carrier of two leaky
    variants cannot be assigned to a surveillance schedule on genotype. The two schedules
    differ substantially (annual brain MRI and gastrointestinal endoscopy from early
    childhood in CMMRD; adult gastrointestinal and gynaecological surveillance in Lynch), so
    the cost of guessing is high in both directions.
  proposed_experiments:
  - experiment_id: exp_cmmrd_hypomorphic_residual_activity_calibration
    name: Calibration of residual mismatch repair activity against age at first cancer
    description: >-
      Assay residual mismatch repair activity quantitatively across a series of candidate
      hypomorphic MMR variants (leaky splice and missense alleles) and correlate the
      measured activity with constitutional instability score and age at first cancer, to
      establish whether residual activity predicts the CMMRD-versus-Lynch management
      boundary.
    evidence:
    - reference: PMID:38789506
      reference_title: Constitutional mismatch repair deficiency mimicking Lynch syndrome is associated with hypomorphic mismatch repair gene variants
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: MLH1 c.306G>A was shown to cause leaky exon 3 skipping.
      explanation: >-
        Design rationale - a leaky, partially functional allele has already been
        demonstrated functionally, so a graded activity series is experimentally reachable.
  - experiment_id: exp_cmmrd_adult_vus_constitutional_msi_screen
    name: Constitutional MSI screening of adults with biallelic MMR variants of uncertain significance
    description: >-
      Systematically apply constitutional microsatellite instability testing to adult
      patients carrying biallelic or compound-heterozygous MMR variants of uncertain
      significance who are currently managed as Lynch syndrome, to estimate how often
      late-onset CMMRD is being missed.
    evidence:
    - reference: PMID:38789506
      reference_title: Constitutional mismatch repair deficiency mimicking Lynch syndrome is associated with hypomorphic mismatch repair gene variants
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: CMMRD testing in carriers of compound heterozygous or homozygous MMR VUS may find similar cases and novel hypomorphic variants.
      explanation: >-
        The authors propose exactly this screen; the citation records the precedent and the
        expected yield.
  evidence:
  - reference: PMID:38789506
    reference_title: Constitutional mismatch repair deficiency mimicking Lynch syndrome is associated with hypomorphic mismatch repair gene variants
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individualised management of mono- and bi-allelic carriers of hypomorphic MMR variants is needed until we better characterise the associated phenotypes.
    explanation: The authors state the gap directly - the phenotypes are not yet characterised well enough to set a management rule.
notes: >-
  Concept decision: curated as a single Disease entry with `has_subtypes` over the four
  gene-defined forms (CMMRD1-4 / MONDO:0010159, MONDO:0030840, MONDO:0030841,
  MONDO:0030843), matching the CURATE_ROOT_WITH_SUBTYPES designation on the priority
  dashboard. The four share one mechanism - biallelic loss of a single MMR heterodimer
  component producing constitutional microsatellite instability - and differ in severity and
  age of onset rather than in kind, which is the same lump/split logic applied in
  `Lynch_Syndrome.yaml` and `3-M_Syndrome.yaml`. MONDO:0031219 itself records no causal
  gene (`RO:0004003`), which is why the automated NEC preflight returns SKIP for this
  entry; the manual gene/OMIM/synonym check was run instead and passed (see review_notes).

  Scope boundary against Lynch syndrome is deliberate and load-bearing. The same four genes
  cause both diseases; what differs is allelic state (biallelic versus monoallelic) and
  therefore whether mismatch repair is absent constitutionally or only after a somatic
  second hit. Content is cross-referenced rather than duplicated: the shared MSI
  carcinogenesis chain is curated in `Lynch_Syndrome.yaml`, and this entry curates what is
  specific to the constitutional state - normal-tissue MMR loss, constitutional MSI as a
  diagnostic assay, somatic POLE/POLD1 ultra-hypermutation, the paediatric CNS-predominant
  spectrum, the NF1 phenotypic mimicry, and the checkpoint-blockade indication.

  Somatic POLE/POLD1 proofreading loss is curated as a tumour-restricted modifier
  (`genetic[].relationship_type: MODIFIER`, `variant_origin: SOMATIC`) and as its own
  pathophysiology node. It is not a cause of the syndrome and must not be read as one.

  No GeneReviews chapter exists for this disease. NCBI Bookshelf was searched for
  "constitutional mismatch repair deficiency", "mismatch repair cancer syndrome" and
  "CMMRD" under the GeneReviews filter and returned nothing; the nearest chapter is Lynch
  Syndrome (PMID:20301390), whose summary makes no CMMRD statement, so there is no
  GeneReviews baseline to tag. The consensus baseline used instead is the pair of
  diagnostic-criteria papers already cited - the European C4CMMRD consortium
  (PMID:24737826) and the international consensus working group (PMID:33622763). Recorded
  here so the search is not repeated.

  Deliberately not curated: the B-cell class-switch/somatic-hypermutation abnormality is
  recorded as a mechanism node but explicitly NOT as an immunodeficiency phenotype, because
  the systematic cohort found no clinical warning signs of primary immunodeficiency and no
  consistent laboratory pattern (PMID:30013564, carried as a REFUTE evidence item on that
  node). WRN-helicase synthetic lethality and ATR inhibition are preclinical only and are
  not curated as treatments.
review_notes: >-
  Deep-research provider: Falcon (Edison Scientific), report at
  `research/Constitutional_Mismatch_Repair_Deficiency-deep-research-falcon.md`. The report
  was used as a lead list only; every PMID was fetched with `just fetch-reference` and every
  snippet verified against the cached record.

  NEC preflight (CLAUDE.md section 2b): `just preflight-dr` returned SKIP because
  MONDO:0031219 records no `RO:0004003` causal gene. The manual fallback was run and passed
  on all three anchors. Gene check - the report's gene mentions are PMS2=14, MSH6=12,
  MLH1=11, MSH2=10, i.e. the four MMR genes in balance, with no rival gene, which is the
  expected profile for a four-gene root term rather than an NEC signal. OMIM check - the
  report cites OMIM 276300/619096/619097/619101, matching the MONDO OMIMPS:276300
  phenotypic series and the four children's OMIM xrefs. Synonym check - the MONDO exact
  synonym "constitutional mismatch repair deficiency syndrome" is the name the report was
  written against, and it is not a label or synonym of any other MONDO entity. Named Entity
  Confusion against Lynch syndrome (MONDO:0005835) was the specific risk here and was
  checked explicitly: the report's clinical content is childhood-onset and biallelic
  throughout.

  Two DR-report claims were dropped for want of a verifiable quotable source in the fetched
  abstracts: the "one in a million" figure was re-sourced to PMID:42348008 and PMID:38789506
  rather than to the report's own citation string, and the assertion that necessary
  radiotherapy is "not categorically contraindicated" was omitted entirely rather than
  curated on a review's unsourced statement.

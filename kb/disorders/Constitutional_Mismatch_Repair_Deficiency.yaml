  - reference: PMID:27779754
    reference_title: Connections between constitutional mismatch repair deficiency syndrome and neurofibromatosis type 1
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Evaluation of the clinical findings of genetically proven CMMRD patients shows that not only multiple café-au-lait macules but also any of the diagnostic features of NF1 may be present in a CMMRD patient.
    explanation: Supports the statement that NF1 diagnostic features, freckling included, may be present in CMMRD.

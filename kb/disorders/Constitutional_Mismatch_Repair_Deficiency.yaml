  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Frameshift or truncating variants within the same gene caused earlier cancers and inferior outcomes compared with missense variants (p<0·0001).
    explanation: Supports the within-gene variant-class gradient described here.
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT

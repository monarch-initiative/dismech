- name: Loss of MMR-Dependent Damage Signalling and Alkylating Agent Tolerance
  biological_scale: CELLULAR
  role: consequence
  conforms_to: "genome_instability_mutation#Failure of DNA Damage Surveillance and Repair"
  mechanism_confidence: ESTABLISHED
  description: >-
    Beyond error correction, MutSalpha/MutLalpha are required to convert persistent
    O6-methylguanine mispairs into a cytotoxic signal. Without them the lesion is tolerated
    rather than lethal, so MMR-deficient tumours are intrinsically resistant to methylating
    chemotherapy such as temozolomide, and continued exposure selects further mutation
    rather than killing the tumour. This is a therapeutically decisive consequence: standard
    glioma protocols cannot be applied reflexively in CMMRD.
  biological_processes:
  - preferred_term: DNA damage response
    modifier: ABNORMAL
    term:
      id: GO:0006974
      label: DNA damage response
  evidence:

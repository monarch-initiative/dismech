clinical_burden:
  burden_level: HIGH
  rationale: >-
    Near-complete cancer penetrance by age 18, a median of under two years between
    successive primary cancers, and 10-year survival of 39% for the commonest tumour
    group. Management is lifelong intensive multi-modality surveillance from molecular
    diagnosis onward rather than treatment of a single event.
  evidence:
  - reference: PMID:38552658
    reference_title: "Clinical and biological landscape of constitutional mismatch-repair deficiency syndrome: an International Replication Repair Deficiency Consortium cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cumulative cancer incidence by age 18 years was 90% (95% CI 80-99).
    explanation: Supports near-complete cancer penetrance by adulthood.
  - reference: PMID:33945292
    reference_title: Survival Benefit for Individuals With Constitutional Mismatch Repair Deficiency Undergoing Surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five-year overall survival (OS) was 90% (95% CI, 78.6 to 100) and 50% (95% CI, 39.2 to 63.7) when cancer was detected asymptomatically and symptomatically, respectively"
    explanation: Supports the mortality burden and the dependence of outcome on intensive
      surveillance.
mechanistic_hypotheses:
- hypothesis_group_id: constitutional_mutator_ultrahypermutation_model
  hypothesis_label: Constitutional Mutator plus Somatic Polymerase Proofreading Loss Model
  status: CANONICAL
  description: >-
    Biallelic germline MMR loss removes post-replicative mismatch correction from every
    cell of the body, so microsatellite instability and an elevated base-substitution rate
    are present constitutionally rather than only in tumour tissue. Proliferative
    compartments (neural/glial progenitors, intestinal crypt stem cells, lymphoid
    precursors) accumulate driver mutations first, which is why CNS, gastrointestinal and
    haematological tumours dominate the spectrum. In most high-grade tumours an early
    somatic mutation in the exonuclease (proofreading) domain of POLE or POLD1 is
    frequently selected, and the combined loss of proofreading and mismatch repair produces an
    ultra-hypermutant genome that accumulates mutations in a rapid burst. This two-step
    model explains both the distinctive pathognomonic mutational signature used
    diagnostically and the extreme neoantigen load that makes these tumours
    checkpoint-inhibitor responsive.
  evidence:
  - reference: PMID:25642631
    reference_title: Combined hereditary and somatic mutations of replication error repair genes result in rapid onset of ultra-hypermutated cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ensuing mutation signatures and numbers are unique and diagnostic of childhood germ-line bMMRD
    explanation: Supports the combined germline-MMR plus somatic-polymerase model as producing a distinctive, diagnostic mutational output.
- hypothesis_group_id: hypomorphic_allele_late_onset_model
  hypothesis_label: Hypomorphic Allele / Residual Repair Model of Late-Onset CMMRD
  status: EMERGING
  description: >-
    A subset of biallelic MMR carriers present in adulthood with a Lynch-like tumour
    spectrum rather than in childhood. The proposed explanation is that the variants are
    hypomorphic - a leaky splice variant or a missense change that retains partial repair
    capacity - so residual mismatch repair delays the accumulation of driver mutations
    without preventing it. If correct, constitutional microsatellite instability testing
    rather than genotype alone is what discriminates such patients from true Lynch
    syndrome, and it predicts that the phenotype should scale with residual repair
    activity. This is currently supported by case-level functional and constitutional-MSI
    data, not by a systematic genotype-function series.
  evidence:
  - reference: PMID:38789506
    reference_title: Constitutional mismatch repair deficiency mimicking Lynch syndrome is associated with hypomorphic mismatch repair gene variants
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A hypomorphic effect of these and other variants found in additional late onset CMMRD cases, identified by literature review, likely explains a LS-like phenotype.
    explanation: States the hypomorphic-residual-function hypothesis for late-onset, Lynch-mimicking CMMRD.
  - reference: PMID:38789506
    reference_title: Constitutional mismatch repair deficiency mimicking Lynch syndrome is associated with hypomorphic mismatch repair gene variants
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The apparent genotype-phenotype conflict was resolved by detection of constitutional microsatellite instability in both patients, a hallmark feature of CMMRD.
    explanation: Supports constitutional MSI, not genotype, as the discriminating test predicted by this model.
pathophysiology:
- name: Biallelic Germline Mismatch Repair Gene Inactivation
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "genome_instability_mutation#Genome-Maintenance Defect or Replication Stress"
  mechanism_confidence: ESTABLISHED
  description: >-
    Both alleles of MLH1, MSH2, MSH6 or PMS2 carry a pathogenic variant in the germ line
    (homozygous or compound heterozygous). The corresponding heterodimer - MutSalpha
    (MSH2/MSH6) for mismatch recognition or MutLalpha (MLH1/PMS2) for the downstream
    incision step - is absent or non-functional in every nucleated cell, so post-replicative
    correction of polymerase slippage and base-base mismatches fails constitutionally. This
    is the point at which CMMRD diverges from Lynch syndrome, where the second allele is
    intact until a somatic hit occurs in one tissue.
  locations:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  protein_complexes:
  - preferred_term: mismatch repair complex
    term:
      id: GO:0032300
      label: mismatch repair complex
  biological_processes:
  - preferred_term: mismatch repair
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0006298
      label: mismatch repair
  - preferred_term: DNA-templated DNA replication maintenance of fidelity
    modifier: DECREASED
    term:
      id: GO:0045005
      label: DNA-templated DNA replication maintenance of fidelity
  genetic_context:
    genes:
    - preferred_term: MLH1
      term:
        id: hgnc:7127
        label: MLH1
    - preferred_term: MSH2
      term:
        id: hgnc:7325
        label: MSH2
    - preferred_term: MSH6
      term:
        id: hgnc:7329
        label: MSH6
    - preferred_term: PMS2
      term:
        id: hgnc:9122
        label: PMS2
    allele_type: GERMLINE
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline loss-of-function variants in one MMR gene. Zygosity is recorded as
      HOMOZYGOUS because the schema enum has no BIALLELIC value; compound heterozygosity
      (two different pathogenic alleles in trans) is equally common and equally causal, and
      COMPOUND_HETEROZYGOUS is the correct value for those patients. What matters
      mechanistically is that neither allele is functional. Frameshift and truncating
      variants give earlier cancers and worse outcomes than missense variants within the
      same gene.
  downstream:
  - target: Constitutional Microsatellite Instability and Mutator Phenotype
    description: >-
      Loss of the MutSalpha/MutLalpha correction step leaves polymerase slippage errors
      uncorrected, so insertion-deletion loops accumulate at microsatellites in normal as
      well as neoplastic tissue.
    evidence:
    - reference: PMID:36240479
      reference_title: Genomic Microsatellite Signatures Identify Germline Mismatch Repair Deficiency and Risk of Cancer Onset.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In normal cells, MMRDness scores differed between tissues (GI > blood > brain), increased over time in the same individual, and revealed genotype-phenotype associations within the mismatch repair genes.
      explanation: >-
        Demonstrates that the mismatch-repair-deficiency signature is measurable in normal
        (non-tumour) tissue, which is what distinguishes the constitutional state from the
        tumour-restricted MMR loss of Lynch syndrome.
  - target: Impaired Immunoglobulin Class-Switch Recombination and Somatic Hypermutation
    description: >-
      The same MutSalpha/MutLalpha heterodimers act as a backup pathway for the processing
      of activation-induced cytidine deaminase-induced lesions during class-switch
      recombination and somatic hypermutation, so their constitutional loss also perturbs
      antibody maturation.
    evidence:
    - reference: PMID:30013564
      reference_title: No Overt Clinical Immunodeficiency Despite Immune Biological Abnormalities in Patients With Constitutional Mismatch Repair Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The mismatch repair (MMR) machinery, consisting of homologs of MutSα, MutLα, and MutSβ (MSH2/MSH6, MLH1/PMS2, and MSH2/MSH3, respectively) and other proteins, is involved in CSR
      explanation: States the mechanistic link from the same MMR heterodimers to class-switch recombination.
  evidence:
  - reference: PMID:24737826

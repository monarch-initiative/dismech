- name: Impaired Antibody Production
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Fewer mature B cells, so less antibody - but with a specific pattern rather
    than a uniform one. IgG and IgM are reduced; IgA is normal, which is unusual
    for CVID and is the finding that most cleanly separates BAFF-R deficiency
    from the class it is filed under. The murine explanation is direct: mucosal
    IgA-secreting plasma cells in the gut of BAFF-R-deficient mice develop
    normally and appear not to require BAFF-R signals.

    Functionally, the deficit that shows first is the T-independent one. Neither
    reported sibling mounted an antibody response to pneumococcal cell wall
    polysaccharide - consistent with the loss of the marginal-zone compartment,
    which is where T-independent responses are made.

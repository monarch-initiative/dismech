    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This elevated BAFF interacts with naive B cells, as they are the
      predominant subset in progressive CVID ILD, expressing BAFF receptor
      (BAFF-R) within pulmonary B cell follicles and blood to promote Bcl-2
      expression.
    explanation: >-
      The opposite-direction pathology on the same axis, in receptor-sufficient
      CVID patients. Supports the contrast this node exists to draw, not the CVID4
      mechanism.

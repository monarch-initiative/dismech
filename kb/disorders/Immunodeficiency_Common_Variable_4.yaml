prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Complete BAFF-R deficiency has been reported in one sibling pair, identified
    by screening BAFF-R expression and BAFF binding across a CVID cohort. No
    prevalence estimate exists and none should be inferred from CVID's own
    prevalence, because the screen that found these patients was a
    receptor-expression assay rather than sequencing and no comparable
    denominator is available.

    Counting is further complicated by the P21R missense variant, which appears
    in CVID case reports and in healthy controls. Reported "BAFF-R deficiency"
    is therefore not a single countable category, and the case counts in the
    literature mix null alleles with functional variants of debated
    pathogenicity.
  evidence:
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyzing BAFF-R expression and BAFF-binding to B cells in common variable
      immunodeficiency (CVID) patients, we identified two siblings carrying a
      homozygous deletion in the BAFF-R gene.
    explanation: >-
      Both the ascertainment method and the number of patients, which is what the
      rarity claim and its uncertainty rest on.
pathophysiology:
- name: Biallelic TNFRSF13C Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. TNFRSF13C at 22q13 has three exons and encodes BAFF-R,
    a 184-amino-acid type III transmembrane member of the TNF receptor
    superfamily expressed on all surface-immunoglobulin-positive B cells but not
    on plasma cells. The reported null allele is a homozygous deletion removing
    most of the transmembrane segment, which precludes surface expression
    altogether.

    BAFF is the receptor's only ligand, and it is secreted by monocytes,
    macrophages, neutrophils and activated B cells as well as by non-haematopoietic
    cells - so the defect is in reception, not in supply. That distinction
    matters therapeutically: adding BAFF cannot help.
  genes:
  - preferred_term: TNFRSF13C
    term:
      id: hgnc:17755
      label: TNFRSF13C
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: DELETION
    description: >-
      Loss of function established by the absence of surface BAFF-R rather than
      inferred from the deletion's coordinates. The deletion is in-frame but
      removes most of the transmembrane anchor, so the mechanism is failure of
      membrane insertion rather than nonsense-mediated decay.
  evidence:
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Removing most of the BAFF-R transmembrane part, the deletion precludes
      BAFF-R expression.
    explanation: >-
      The molecular consequence of the null allele, and the reason it behaves as
      complete loss of function.
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In humans, BAFF-R is encoded by three exons of theTNFRSF13Cgene located on
      chromosome 22q13. Its transcript is translated into a type III transmembrane
      protein of 184 aa residues expressed by all surface Ig+B cells but not by
      plasma cells
    explanation: >-

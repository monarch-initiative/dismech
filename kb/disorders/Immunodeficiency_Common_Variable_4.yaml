- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The two reported null-allele patients are siblings homozygous for an in-frame
    deletion removing most of the BAFF-R transmembrane segment. Heterozygotes are
    not reported to have the immunological phenotype.

    Penetrance is where this differs from most recessive immunodeficiencies, and
    it needs stating at two levels rather than one. The *immunological* phenotype
    was fully penetrant - both siblings had it. The *clinical* phenotype was not:
    only one developed recurrent infections.

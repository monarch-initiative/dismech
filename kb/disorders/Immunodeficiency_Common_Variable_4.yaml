- name: BAFF-Driven B Cell Hyperplasia
  biological_scale: TISSUE
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    Curated as a deliberate contrast rather than as part of the CVID4 chain, and
    included because the literature search for this gene returns it repeatedly.
    In CVID interstitial lung disease, elevated BAFF acts *through* BAFF-R on
    naive B cells in pulmonary follicles to promote Bcl-2 and resist apoptosis -
    the same axis, driven too hard, in patients who have the receptor.

    That pathology cannot occur in a BAFF-R-null patient. The node is retained
    because it makes the axis' direction explicit and guards against a specific
    misreading: a paper about BAFF and CVID lung disease is not evidence about
    CVID4, even though a keyword search returns both.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.025
  rate_low: 0.0167
  rate_high: 0.0333
  notes: >-
    Complete BAFF-R deficiency has been reported in one sibling pair, identified
    by screening BAFF-R expression and BAFF binding across a CVID cohort. The
    defining study derives 1 in 3,000,000 to 1 in 6,000,000 from that screening,
    whose denominator was 138 CVID patients screened for low peripheral B cells -
    and immediately qualifies it: because BAFF-R-deficient individuals can
    control common infections, the authors say the deficiency may be more common
    in the general population than their CVID-cohort screening would suggest.
    That caveat is the substance of the estimate, not a footnote to it: the
    denominator is a CVID cohort, so anyone who never came to immunological
    attention is invisible to it. The number is recorded rather than denied, and
    should not be treated as a population rate.

    Counting is further complicated by the P21R missense variant, which appears
    in CVID case reports and in healthy controls. Reported "BAFF-R deficiency"
    is therefore not a single countable category, and the case counts in the
    literature mix null alleles with functional variants of debated
    pathogenicity.
  evidence:
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyzing BAFF-R expression and BAFF-binding to B cells in common variable
      immunodeficiency (CVID) patients, we identified two siblings carrying a
      homozygous deletion in the BAFF-R gene.
    explanation: >-
      Both the ascertainment method and the number of patients, which is what the
      rarity claim and its uncertainty rest on.
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore it is possible that, within the general population, BAFF-R
      deficiency is more common than might be estimated from our screening of

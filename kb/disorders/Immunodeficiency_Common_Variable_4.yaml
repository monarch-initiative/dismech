genetic:
- name: TNFRSF13C
  gene_term:
    preferred_term: TNFRSF13C
    term:
      id: hgnc:17755
      label: TNFRSF13C
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The gene has two distinct classes of reported variant and the literature
    routinely conflates them.

    Null alleles cause the disease. The reported one is a homozygous in-frame
    deletion removing most of the transmembrane segment, so no receptor reaches
    the surface. This is the CVID4 genotype.

    Missense variants are modifiers, not causes. Six have been functionally
    characterised - P21R, A52T, G64V, DUP92-95, P146S, H159Y - and all six change
    BAFF-R function in some measurable way, but they do so through different
    mechanisms: ligand binding is affected by P21R and A52T, spontaneous
    oligomerisation by P21R, A52T, G64V and P146S, NF-kB2 activation by P21R and
    P146S, and ectodomain shedding by P21R alone. Of the six, only P21R
    correlated positively with CVID in the genetic association study, and P21R is
    also present in healthy individuals at lower frequency.

    The practical reading: a homozygous null is diagnostic; a heterozygous
    missense variant, P21R included, is a contributory finding that does not on
    its own explain a CVID phenotype. The report of the P21R patient says as much
    - the authors concluded the polymorphism alone cannot explain the clinical
    picture and hypothesised additional defects.
  evidence:
  - reference: PMID:36308663
    reference_title: "CVID-Associated B Cell Activating Factor Receptor Variants Change Receptor Oligomerization, Ligand Binding, and Signaling Responses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Null mutations in the BAFFR gene result in complete BAFFR deficiency and
      cause a block in B cell development at the transition from immature to
      mature B cells leading therefore to B lymphopenia and hypogammaglobulinemia.
    explanation: >-
      States the null-allele mechanism as distinct from the missense variants the
      same paper goes on to characterise.
  - reference: PMID:36308663
    reference_title: "CVID-Associated B Cell Activating Factor Receptor Variants Change Receptor Oligomerization, Ligand Binding, and Signaling Responses."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Although all variants change BAFFR function and have the potential to
      contribute as modifiers to the development of primary antibody
      deficiencies, autoimmunity, and lymphoma, P21R is the only variant that was
      found to correlate positively with CVID.
    explanation: >-
      The authors' own framing of the missense variants as modifiers. Graded
      PARTIAL because it qualifies rather than supports a causal claim for those
      alleles.
  - reference: PMID:26012370
    reference_title: "Association of B-cell activating factor receptor deficiency with the P21R polymorphism and common variable immunodeficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The P21R polymorphism can be present in healthy individuals, albeit at a
      lower frequency.
    explanation: >-
      The observation that stops P21R being read as a causal allele. Graded
      PARTIAL because it weakens rather than supports pathogenicity.
biochemical:
- name: Surface BAFF-R Expression on B Cells
  notes: >-
    Absent in null-allele patients and the assay by which they were found: the
    defining study screened BAFF-R expression and BAFF binding across a CVID
    cohort rather than sequencing candidate genes. In the P21R patient expression
    was reduced by 76 percent rather than absent, which is the quantitative
    difference between the causal and the modifier end of this gene's spectrum.
  evidence:
  - reference: PMID:26012370
    reference_title: "Association of B-cell activating factor receptor deficiency with the P21R polymorphism and common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Flow cytometric analysis revealed a 76% reduction in the expression of
      BAFF-R
    explanation: >-
      The quantified partial reduction associated with P21R, against the complete
      absence caused by the null allele.
diagnosis:
- name: Flow Cytometric BAFF-R Expression and BAFF Binding
  description: >-
    The assay that found this disease. Because complete deficiency removes the
    receptor from the surface, flow cytometry for BAFF-R and for BAFF binding
    identifies it directly, without sequencing - which is how the defining study
    picked two siblings out of a CVID cohort. It also grades partial reductions,
    which sequencing does not.
  evidence:
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyzing BAFF-R expression and BAFF-binding to B cells in common variable
      immunodeficiency (CVID) patients, we identified two siblings carrying a
      homozygous deletion in the BAFF-R gene.
    explanation: >-
      The screening assay and its yield.
- name: TNFRSF13C Sequencing
  description: >-
    Three exons, so the gene is cheap to sequence directly. Interpretation is the
    hard part rather than detection: a homozygous null is diagnostic, while a
    missense variant needs to be read against the functional data, and P21R in
    particular is present in healthy people.
  evidence:
  - reference: PMID:26012370
    reference_title: "Association of B-cell activating factor receptor deficiency with the P21R polymorphism and common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we sequenced all 3 exons of the BAFF-R (TNFRSF13C) gene, which revealed a
      previously identified P21R polymorphism
    explanation: >-
      The sequencing approach and the interpretive problem it runs into.
treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    The standard treatment for the antibody deficiency, and effective for it: the
    reported patient moved from twenty pneumonias and more than ten sinusitis
    episodes to a single course of antibiotics in the preceding year after
    starting intravenous and then subcutaneous immunoglobulin.

    It replaces the product, not the mechanism. The developmental block and the
    absent T-independent response are unchanged, and nothing in the reported
    literature addresses the receptor defect itself.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Impaired Antibody Production
    description: >-
      Substitutes pooled donor immunoglobulin for the antibody the patient cannot
      make. It does not act on the B-cell developmental block upstream.
  evidence:
  - reference: PMID:26012370
    reference_title: "Association of B-cell activating factor receptor deficiency with the P21R polymorphism and common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequently, he experienced a marked reduction in the frequency of
      infections. In the preceding year, he only received antibiotics on a single
      occasion for infectious diarrhea.
    explanation: >-
      The clinical response to replacement therapy in the reported patient.
discussions:
- discussion_id: cvid4_incomplete_clinical_penetrance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why did only one of two siblings with the same homozygous BAFF-R null allele
    develop recurrent infections?
  attaches_to:
  - "pathophysiology#Recurrent Sinopulmonary Infection"
  - "inheritance#Autosomal recessive inheritance"
  rationale: >-
    This is the most consequential open question about the disease and it is
    stated plainly in the defining paper's own conclusion: deletion of the BAFF-R
    gene causes a characteristic immunological phenotype but does not necessarily
    lead to a clinically manifest immunodeficiency. Both siblings had the full
    laboratory phenotype - the developmental block, low IgG and IgM, no
    T-independent response to pneumococcal polysaccharide - and only one got
    sick.

    Two siblings is not enough to distinguish the candidate explanations, and no
    subsequent series has enlarged the denominator. Candidates worth separating:
    residual T-dependent antibody responses in the roughly twenty percent of B
    cells that pass the block in the murine model; preserved mucosal IgA, which
    is intact in this genotype and covers the sinopulmonary surfaces where the
    infections occur; modifier alleles elsewhere; and simple exposure history.

    It matters for interpretation, not just for biology. A homozygous TNFRSF13C
    null found incidentally - on a panel, or in a relative of a proband - cannot
    currently be given a prognosis, and this entry should not imply otherwise.
  proposed_experiments:
  - experiment_id: cvid4_relative_screening_cohort
    name: Immunological and clinical phenotyping of relatives of BAFF-R-null probands
    description: >-
      Screen first-degree relatives of known null-allele probands by BAFF-R flow
      cytometry, then phenotype homozygotes for immunoglobulin levels,
      polysaccharide responses, mucosal IgA, and infection history, to establish
      how often the immunological phenotype occurs without clinical disease.
    would_support:
    - "pathophysiology#Recurrent Sinopulmonary Infection"
    supporting_outcome:
    - >-
      Most identified homozygotes have recurrent infections, indicating the
      unaffected sibling is the exception and clinical penetrance is high.
    refuting_outcome:
    - >-
      A substantial fraction of homozygotes are clinically well, establishing that
      complete BAFF-R deficiency is frequently a laboratory finding rather than a
      disease.
- discussion_id: cvid4_baffr_autoimmunity_mouse_only
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    BAFF-R-mutant mice develop a lupus-like syndrome. Why has systemic
    autoimmunity not been reported in BAFF-R-deficient humans?
  attaches_to:
  - "pathophysiology#Developmental Arrest at the Transitional B Cell Stage"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the mouse
    evidence is positive and specific. A/WySnJ mice carry the Bcmd-1 mutant Baffr
    allele, have ninety percent fewer splenic B cells than normal, and
    nonetheless develop an eighteen-fold increased frequency of splenocytes
    secreting anti-dsDNA IgM, rising circulating anti-dsDNA IgM and IgG by nine
    months, and lupus-like renal pathology in most animals by eleven months. The
    finding was genetically linked to Bcmd-1 by a congenic wild-type control, so
    it is not a background effect of that strain.

    Nothing comparable is reported in the two human homozygotes. The honest
    position is that this is not yet a demonstrated species difference: with two
    patients and no systematic autoimmune serology reported for them, absence of
    evidence is doing all the work. It is recorded as a mismatch rather than as
    settled because the mouse result was itself described as unexpected - the
    prior expectation was that *excessive* BAFF-R signalling drives lupus - and
    because BAFF-R missense variants in humans have been found in patients with
    autoimmunity as well as with CVID, which is a hint in the same direction.
  proposed_experiments:
  - experiment_id: cvid4_autoantibody_serology_in_nulls
    name: Autoantibody serology in BAFF-R-deficient patients
    description: >-
      Anti-dsDNA and extended autoantibody panels, plus renal function and
      urinalysis, in all identified BAFF-R-null individuals and age-matched CVID
      controls.
    would_support:
    - "pathophysiology#Developmental Arrest at the Transitional B Cell Stage"
    supporting_outcome:
    - >-
      BAFF-R-null humans show anti-dsDNA reactivity or renal involvement above the
      CVID background, indicating the murine autoimmune phenotype does translate.
    refuting_outcome:
    - >-
      Autoantibody frequencies are no higher than in genotype-matched CVID
      controls, establishing the lupus-like syndrome as murine-specific.
notes: >-
  Curated from a Perplexity deep-research report plus independent PubMed
  searching. The report was used for framing only. Its reference-validation
  section reported 7 of 7 citations resolving, but only 4 of 7 assessed as on
  topic; its term-validation section reported 8 of 35 checked labels mismatched,
  including MONDO:0011107 offered as "common variable immunodeficiency" when
  MONDO calls that identifier "congenital hypotrichosis with juvenile macular
  dystrophy". No CURIE was taken from the report; all bindings were resolved
  against the committed term caches and OLS.

  No GeneReviews chapter exists for TNFRSF13C or CVID4; a PubMed search for
  "TNFRSF13C GeneReviews" returned no results.

  One quoted snippet (in the TNFRSF13C loss-of-function node) contains words run
  together - "theTNFRSF13Cgene" - because the cached source has the gene symbol
  in italic markup that the cache strips. It is reproduced exactly as cached
  rather than tidied, since a snippet must be an exact substring of the cached
  reference.

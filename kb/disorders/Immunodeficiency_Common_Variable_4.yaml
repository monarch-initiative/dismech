name: Immunodeficiency Common Variable 4
creation_date: "2026-08-29T06:00:00Z"
category: Genetic
disease_term:
  preferred_term: BAFF-receptor deficiency
  term:
    id: MONDO:0013284
    label: immunodeficiency, common variable, 4
description: >-
  CVID4 is BAFF-receptor deficiency: biallelic loss of TNFRSF13C, the receptor
  through which the cytokine BAFF delivers the survival signal that B cells need
  in order to get past the transitional stage. Without it, B-cell development is
  arrested at that checkpoint and every subsequent stage is severely reduced,
  giving B lymphopenia with low IgG and IgM.

  Two features make this a distinct entity rather than a gene label on generic
  CVID. The first is where the block sits. Most CVID is a failure of the late
  steps - class-switch recombination and plasma-cell differentiation - whereas
  this is a survival failure at the transitional-to-mature transition, upstream
  of all of that. It shows in the immunoglobulin pattern: BAFF-R-deficient
  siblings had normal IgA, which most CVID patients do not, and which matches the
  mouse observation that mucosal IgA-secreting plasma cells develop without
  BAFF-R signals.

  The second is that a complete genetic deficiency here is not reliably a
  clinical disease. Of the two homozygous siblings in the defining study, both
  had the full immunological phenotype and failed to respond to pneumococcal
  polysaccharide, but only one had recurrent infections. That result - a
  characteristic immunological phenotype that does not necessarily lead to a
  clinically manifest immunodeficiency - is the most important thing this entry
  records, because it governs how a homozygous TNFRSF13C deletion found
  incidentally should be interpreted.

  A caution about the literature. Most papers citing TNFRSF13C in CVID concern
  the missense variant P21R, which is a polymorphism found in healthy people and
  which functional work classes as a modifier rather than a cause. The entry
  keeps that separate from the null alleles.

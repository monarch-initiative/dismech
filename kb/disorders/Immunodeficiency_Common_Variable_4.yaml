      The number is quoted exactly as cached, including the source's use of a
      full stop as the thousands separator.
pathophysiology:
- name: Biallelic TNFRSF13C Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. TNFRSF13C at 22q13 has three exons and encodes BAFF-R,
    a 184-amino-acid type III transmembrane member of the TNF receptor
    superfamily expressed on all surface-immunoglobulin-positive B cells but not
    on plasma cells. The reported null allele is a homozygous deletion removing
    most of the transmembrane segment, which precludes surface expression
    altogether.

    BAFF is the receptor's only ligand, and it is secreted by monocytes,
    macrophages, neutrophils and activated B cells as well as by non-haematopoietic
    cells - so the defect is in reception, not in supply. That distinction
    matters therapeutically: adding BAFF cannot help.
  genes:
  - preferred_term: TNFRSF13C
    term:
      id: hgnc:17755
      label: TNFRSF13C
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: DELETION
    description: >-
      Loss of function established by the absence of surface BAFF-R rather than
      inferred from the deletion's coordinates. The deletion is in-frame but
      removes most of the transmembrane anchor, so the mechanism is failure of
      membrane insertion rather than nonsense-mediated decay.
  evidence:
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Removing most of the BAFF-R transmembrane part, the deletion precludes
      BAFF-R expression.
    explanation: >-
      The molecular consequence of the null allele, and the reason it behaves as
      complete loss of function.
  - reference: PMID:19666484
    reference_title: "B-cell activating factor receptor deficiency is associated with an adult-onset antibody deficiency syndrome in humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In humans, BAFF-R is encoded by three exons of theTNFRSF13Cgene located on
      chromosome 22q13. Its transcript is translated into a type III transmembrane
      protein of 184 aa residues expressed by all surface Ig+B cells but not by
      plasma cells
    explanation: >-
      Gene structure, protein architecture and expression pattern. Graded OTHER
      because it is background from the paper's introduction. Note the quoted
      text runs words together where the source's markup was stripped; it is
      reproduced exactly as cached rather than tidied.
  downstream:
  - target: Loss of BAFF-Induced Non-Canonical NF-kB Signalling
    causal_link_type: DIRECT
- name: Loss of BAFF-Induced Non-Canonical NF-kB Signalling
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The signalling step the receptor exists to perform. BAFF binding to BAFF-R
    activates the alternative NF-kB pathway: NIK-dependent, IKK-alpha-driven
    processing of the NF-kB2 precursor p100, which proceeds without NEMO and
    therefore independently of the canonical cascade. This was the first
    physiological inducer identified for that pathway, and the paper that
    identified it showed the cascade is what maturing splenic B cells need in
    order to survive and progress.

    Placing the lesion here rather than at "B cell survival" is what makes the
    node informative: it names a specific, NEMO-independent branch, which is why
    BAFF-R deficiency does not produce the broad inflammatory phenotype of
    canonical NF-kB defects.
  biological_processes:
  - preferred_term: non-canonical NF-kappaB signal transduction
    term:
      id: GO:0038061
      label: non-canonical NF-kappaB signal transduction
    modifier: DECREASED
  cell_types:
  - preferred_term: transitional B cell
    term:
      id: CL:0000818
      label: transitional stage B cell
  evidence:
  - reference: PMID:12352969
    reference_title: "BAFF-induced NEMO-independent processing of NF-kappa B2 in maturing B cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show here that B cell-activating factor (BAFF) activates this second
      pathway and that this requires the BAFF receptor (BAFF-R), the NF-kappa
      B-inducing kinase (NIK) and protein synthesis, but not NEMO.
    explanation: >-
      Identifies the specific signalling branch BAFF-R uses and its
      NEMO-independence.
  - reference: PMID:12352969
    reference_title: "BAFF-induced NEMO-independent processing of NF-kappa B2 in maturing B cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This NEMO-independent cascade is physiologically relevant for the survival
      and, hence, progression of maturing splenic B cells.
    explanation: >-
      Ties the pathway to the survival of the exact cell stage that is blocked in
      patients. Graded MODEL_ORGANISM because the work is murine.
  - reference: PMID:36308663
    reference_title: "CVID-Associated B Cell Activating Factor Receptor Variants Change Receptor Oligomerization, Ligand Binding, and Signaling Responses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

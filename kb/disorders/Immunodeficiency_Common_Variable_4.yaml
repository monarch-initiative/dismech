  downstream:
  - target: Developmental Arrest at the Transitional B Cell Stage
    causal_link_type: DIRECT
- name: Developmental Arrest at the Transitional B Cell Stage
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The checkpoint failure that defines the disease. Development proceeds
    normally to the immature/transitional stage and stops there; every subsequent
    B-cell stage is severely reduced. In BAFF-R-deficient mice the same block
    reduces follicular and marginal-zone B cells by more than 95 percent while
    leaving transitional numbers intact - the compartment immediately upstream is
    spared, which is what identifies this as a survival checkpoint rather than a
    generative defect.

diagnosis:
- name: Ophthalmic and systemic phenotyping
  presence: Positive retinal findings with absent or limited systemic BBS features at ascertainment
  description: >-
    Document the rod-cone retinal phenotype and actively review obesity,
    polydactyly, renal disease, hypogonadism, hearing, neurodevelopment, and
    cognition. A patient initially labeled nonsyndromic may lie on a mild or
    age-dependent Bardet-Biedl spectrum.
  diagnosis_term:
    preferred_term: ophthalmologist evaluation
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:37031301
    reference_title: Phenotypic diversity observed in a Chinese patient cohort with biallelic variants in Bardet-Biedl syndrome genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients underwent ophthalmic and systematic evaluations, as well as
      comprehensive molecular genetic analyses.
    explanation: Supports combined ocular, systemic, and molecular assessment.
- name: Full-field electroretinography
  presence: Rod-cone dysfunction
  description: >-
    Full-field ERG establishes the physiologic rod-cone pattern, distinguishes
    cone-rod or macular-predominant presentations, and supports longitudinal
    functional staging.
  diagnosis_term:
    preferred_term: electroretinogram procedure
    term:
      id: NCIT:C101217
      label: Retinal Examination
  evidence:
  - reference: PMID:42022048
    reference_title: Genetic and Phenotypic Characterization of a Large Cohort of Patients with BBS1-Retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the patients who had electrophysiology available, 19 of 27 had
      rod-cone pattern dysfunction, (6/27) a similar degree of rod and cone
      dysfunction.
    explanation: Demonstrates the diagnostic electrophysiologic spectrum in BBS1 retinopathy.
- name: Optical coherence tomography
  presence: Outer-retinal and macular thinning, with or without cystoid edema
  description: >-
    OCT documents outer-segment and outer-nuclear-layer loss, measures central
    macular thickness, detects cystoid macular edema, and supplies longitudinal
    structural endpoints.
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  evidence:
  - reference: PMID:42022048
    reference_title: Genetic and Phenotypic Characterization of a Large Cohort of Patients with BBS1-Retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinal imaging and electrophysiology were analyzed cross-sectionally and
      longitudinally.
    explanation: Supports retinal imaging as a longitudinal assessment in molecularly confirmed BBS1 disease.
- name: Visual field testing
  presence: Peripheral field constriction
  description: >-
    Kinetic or static perimetry quantifies peripheral field loss and follows
    functional progression.
  diagnosis_term:
    preferred_term: vision assessment
    term:
      id: NCIT:C156778
      label: Vision Assessment
  evidence:
  - reference: ORPHA:791
    reference_title: Retinitis pigmentosa
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0007994 | Peripheral visual field loss | Frequent (79-30%)"
    explanation: Establishes the field deficit that perimetry measures.
- name: Molecular genetic testing with splice and noncoding coverage
  presence: Biallelic pathogenic or likely pathogenic variants in an included gene
  description: >-
    An inherited-retinal-disease panel, exome, or genome approach should assess
    ARL6, TTC8, BBS1, BBS2, BBS9, and other RP or ciliopathy genes. Analysis
    must not stop at coding exons: retina-specific exons, canonical and
    noncanonical splice sites, deep-intronic or branchpoint regions, and
    appropriate copy-number analysis may be needed. Molecular results should be
    interpreted alongside deliberate systemic re-phenotyping.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33910932
    reference_title: BBS1 branchpoint variant is associated with non-syndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this research highlights the importance of the analysis of non-coding
      regions in order to provide a conclusive molecular diagnosis.
    explanation: Directly supports noncoding-region analysis in unresolved BBS1-associated RP.
  - reference: PMID:20451172
    reference_title: A splice-site mutation in a retina-specific exon of BBS8 causes nonsyndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      subsequent systematic sequencing of candidate transcripts identified a
      homozygous splice-site mutation in a previously unknown BBS8 exon.
    explanation: Shows why retina-specific exon coverage matters for TTC8-RP51.
  - reference: PMID:20301590
    reference_title: Nonsyndromic Retinitis Pigmentosa Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide an evaluation strategy to identify the genetic cause of
      nonsyndromic retinitis pigmentosa in a proband
    explanation: Supports a genetics-directed diagnostic evaluation for nonsyndromic RP.
differential_diagnoses:
- name: Bardet-Biedl syndrome
  description: >-
    Full or mild BBS shares the same genes and retinal mechanism. Obesity,
    polydactyly, renal or genitourinary disease, neurodevelopmental findings, and
    other extra-ocular features favor syndromic classification; absence at one
    visit may reflect age or mild expressivity.
  distinguishing_features:
  - Multisystem involvement rather than retina-dominant disease
  - Systemic surveillance may reveal age-dependent features
  evidence:
  - reference: PMID:37031301
    reference_title: Phenotypic diversity observed in a Chinese patient cohort with biallelic variants in Bardet-Biedl syndrome genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients exhibited clinical heterogeneity, from patients with all six
      primary clinical components to patients suffering from non-syndromic RP.
    explanation: Directly establishes the syndromic-to-isolated spectrum.
- name: Nonsyndromic retinitis pigmentosa from non-BBSome genes
  description: >-
    Many phototransduction, outer-segment, retinoid-cycle, splicing, and other
    ciliary genes can produce an indistinguishable rod-cone dystrophy. Molecular
    diagnosis, rather than retinal appearance alone, identifies this BBSome
    class.
  distinguishing_features:
  - Pathogenic variants in another RP gene
  - No BBSome-gene allelic explanation
  evidence:
  - reference: PMID:33910932
    reference_title: BBS1 branchpoint variant is associated with non-syndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inherited retinal diseases (IRDs) can be caused by variants in >270 genes."
    explanation: Establishes the extensive genetic differential for inherited retinal disease.
- name: Other syndromic retinal ciliopathies
  description: >-
    Alström, Senior-Løken, Joubert, and other ciliary disorders may combine
    retinal degeneration with renal, neurologic, metabolic, hearing, or skeletal
    findings. Broader phenotype and non-BBSome molecular results distinguish
    them.
  distinguishing_features:
  - Syndrome-specific extra-ocular findings
  - Causal variants outside the five-gene BBSome-RP scope
  evidence:
  - reference: PMID:37293546
    reference_title: Comparative analysis of transcriptional changes in zebrafish cep290 and bbs2 mutants by RNA-seq reveals upregulation of inflammatory and stress-related pathways.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mutations in ciliopathy genes disrupt distinct components of the
      cilium, yet all cause retinal degeneration.
    explanation: Supports mechanistically distinct ciliopathies as retinal-degeneration differentials.

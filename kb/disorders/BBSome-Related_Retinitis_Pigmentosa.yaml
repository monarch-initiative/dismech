discussions:
- discussion_id: bbsome_rp_lump_split_boundary
  prompt: >-
    When should a retina-dominant BBS-gene presentation remain in an
    isolated-RP class rather than be classified as mild Bardet-Biedl syndrome?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - definitions#BBSome-related isolated-RP scope
  - differential_diagnoses#Bardet-Biedl syndrome
  rationale: >-
    Published cohorts span apparently nonsyndromic RP, very mild extra-ocular
    disease, and full BBS. Age at assessment and the intensity of systemic
    phenotyping can change the label. This entry therefore uses a
    mechanism-based lump while retaining the clinical boundary as uncertain.
  evidence:
  - reference: PMID:37031301
    reference_title: Phenotypic diversity observed in a Chinese patient cohort with biallelic variants in Bardet-Biedl syndrome genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients exhibited clinical heterogeneity, from patients with all six
      primary clinical components to patients suffering from non-syndromic RP.
    explanation: Demonstrates the continuum that makes the classification boundary unstable.
- discussion_id: hypomorphic_allele_model_limits
  prompt: >-
    How consistently does residual BBSome function predict retina-restricted
    disease across genes and allelic combinations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Partial or retina-selective BBSome dysfunction
  rationale: >-
    Tissue-specific TTC8 and ARL6 effects and partial BBS9 splicing support a
    residual-function model, but BBS1 expressivity also implicates cis- or
    trans-acting modifiers. The model should not be generalized to every
    missense allele without functional and longitudinal clinical data.
  evidence:
  - reference: PMID:23143442
    reference_title: BBS1 mutations in a wide spectrum of phenotypes ranging from nonsyndromic retinitis pigmentosa to Bardet-Biedl syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cis - or trans -acting modifiers may influence the disease phenotype.
    explanation: Directly identifies modifier effects as an alternative to a simple allele-severity rule.
- discussion_id: bbsome_rp_translation
  prompt: >-
    Will preclinical neuroprotection or BBS1 gene augmentation preserve useful
    vision in humans with BBSome-related retinal degeneration?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - clinical_trials#NCT07269665
  - animal_models#Bbs1 p.Met390Arg homozygous knock-in
  rationale: >-
    TUDCA rescue is limited to mouse experiments, and AXV-101 is an early
    first-in-human safety and dose study. Neither establishes clinical efficacy,
    and evidence from BBS1 cannot yet be transferred to all five genes.
  evidence:
  - reference: PMID:22110077
    reference_title: TUDCA slows retinal degeneration in two different mouse models of retinitis pigmentosa and prevents obesity in Bardet-Biedl syndrome type 1 mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The Rd1 and rd16 mice showed no improvement with TUDCA treatment
    explanation: Shows model-dependent response and cautions against class-wide translation.
  - reference: clinicaltrials:NCT07269665
    reference_title: A First-In-Human, Open Label, Dose Escalation Trial to Evaluate the Safety, Tolerability and Pharmacodynamics of a Single Dose of AXV-101 in Patients With Bardet-Biedl Syndrome 1 (BBS1) Bi-Allelic Mutations and Retinal Degeneration
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Is AXV-101 safe and tolerable to use in participants with BBS1?
    explanation: Confirms that the current human study is framed around safety and tolerability.

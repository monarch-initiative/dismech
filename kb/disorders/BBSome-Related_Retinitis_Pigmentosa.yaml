definitions:
- name: Broad retinitis pigmentosa definition
  definition_type: OTHER
  description: >-
    An inherited retinal dystrophy with progressive photoreceptor and retinal
    pigment epithelium loss, usually leading to severe visual impairment over
    decades.
  evidence:
  - reference: ORPHA:791
    reference_title: Retinitis pigmentosa
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Retinitis pigmentosa (RP) is an inherited retinal dystrophy leading to
      progressive loss of the photoreceptors and retinal pigment epithelium and
      resulting in blindness usually after several decades.
    explanation: Defines the broad RP phenotype represented by MONDO:0019200.
- name: BBSome-related isolated-RP scope
  definition_type: OTHER
  description: >-
    This entry includes only well-documented isolated or nearly isolated RP at
    ARL6, TTC8, BBS1, BBS2, and BBS9. Other BBS genes remain outside the lump
    until primary human evidence establishes a comparable presentation, and
    non-BBSome ciliary genes such as IFT172 and CFAP418 remain outside its
    mechanistic boundary.
  evidence:
  - reference: PMID:37031301
    reference_title: Phenotypic diversity observed in a Chinese patient cohort with biallelic variants in Bardet-Biedl syndrome genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of BBS and non-syndromic retinitis pigmentosa (RP) were
      established in 28 patients from 27 pedigrees and 6 patients, respectively.
    explanation: Confirms that nonsyndromic RP occurs within BBS-gene cohorts without making it universal.
notes: >-
  Evidence is intentionally partitioned. Each locus-to-isolated-RP association
  is supported by its own human report; the shared trafficking mechanism is
  supported by conformance to the bbsome_trafficking and
  photoreceptor_degeneration modules plus experimental studies. The five ClinGen
  assertions are for broader gene-specific ciliopathies and are not imported as
  isolated-RP validity grades. “Isolated” means no defining systemic BBS burden
  was recognized at the reported assessment; it does not guarantee lifelong
  absence. LZTFL1 and IFT27 are dedicated BBSome operators but lack adequate
  primary evidence for inclusion in this isolated-RP class. IFT172, CFAP418, and
  transition-zone or IFT-B disorders are mechanistically adjacent but out of
  scope.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The supported BBSome-related isolated-RP presentations result from biallelic
    pathogenic variants. Apparent modifier effects can alter expressivity, but
    the primary inheritance model remains autosomal recessive.
  evidence:
  - reference: PMID:23143442
    reference_title: BBS1 mutations in a wide spectrum of phenotypes ranging from nonsyndromic retinitis pigmentosa to Bardet-Biedl syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants in BBS1 are significantly associated with nonsyndromic autosomal
      recessive RP and relatively mild forms of BBS.
    explanation: Directly documents autosomal recessive BBS1-associated nonsyndromic RP.
  - reference: PMID:22353939
    reference_title: In search of triallelism in Bardet-Biedl syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our study argues in favor of straightforward autosomal recessive BBS in
      most cases.
    explanation: Supports a primary recessive rather than triallelic inheritance model.
progression:
- phase: Onset
  age_range: Childhood, adolescence, or adulthood
  notes: >-
    Onset varies between genes and alleles. The broad RP record spans childhood
    through adulthood; hypomorphic BBS1 p.Met390Arg is associated with later
    onset than other BBS1 genotypes.
  evidence:
  - reference: ORPHA:791
    reference_title: Retinitis pigmentosa
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Childhood"
    explanation: Orphanet includes childhood among the documented RP onset categories.
  - reference: PMID:42022048
    reference_title: Genetic and Phenotypic Characterization of a Large Cohort of Patients with BBS1-Retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      homozygous patients for the most common variant p.(Met390Arg) had an older
      age of onset and reached legal blindness at an older age compared with the
      other genotypes.
    explanation: Provides genotype-specific onset and severity information for BBS1 retinopathy.
- phase: Progressive rod-cone and macular degeneration
  age_range: Years to decades after onset
  notes: >-
    Night vision and peripheral field function decline as rod disease advances;
    cone and macular structural loss later reduce central acuity. Rates from the
    BBS1 cohort should not be assumed for every gene in this lump.
  evidence:
  - reference: PMID:42022048
    reference_title: Genetic and Phenotypic Characterization of a Large Cohort of Patients with BBS1-Retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median BCVA was 0.47 logarithm of minimum angle of resolution (LogMAR)
      (interquartile range 0.3-0.8) at baseline and 1.3 LogMAR (interquartile
      range 0.7-2.4) at follow-up, with an average decline of 0.05 LogMAR/year.
    explanation: Quantifies longitudinal visual-acuity decline in molecularly confirmed BBS1 retinopathy.
  - reference: PMID:42022048
    reference_title: Genetic and Phenotypic Characterization of a Large Cohort of Patients with BBS1-Retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rate of decline for CMT and ONLT was 4.2 μm and 1.7 μm per year,
      respectively.
    explanation: Quantifies progressive macular and outer-nuclear-layer thinning in the BBS1 cohort.
genetic:
- name: ARL6
  association: Pathogenic biallelic variants, including the retina-selective p.Ala89Val effect
  gene_term:
    preferred_term: ARL6
    term:
      id: hgnc:13210
      label: ARL6
  notes: >-
    ARL6/BBS3 is the small GTPase that recruits the BBSome to ciliary membranes.
    The p.Ala89Val report implicates a visual role of the BBS3L isoform while
    sparing a transport function tested in zebrafish; the isolated-RP
    association is based on limited-family evidence.
  evidence:
  - reference: PMID:21282186
    reference_title: Functional analysis of BBS3 A89V that results in non-syndromic retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      BBS3L A89V, however, was unable to rescue vision impairment, highlighting
      a role for a specific amino acid within BBS3 that is necessary for visual
      function, but dispensable in other cell types.
    explanation: Connects the ARL6/BBS3 allele to a retina-selective functional deficit.
- name: TTC8
  association: Pathogenic biallelic variants, including a retina-specific splice allele
  gene_term:
    preferred_term: TTC8
    term:
      id: hgnc:20087
      label: TTC8
  notes: >-
    TTC8/BBS8 is a core BBSome subunit. A splice-site variant in a
    retina-specific exon established RP51, and a second pedigree with a distinct
    TTC8 variant independently confirmed the gene-disease relationship.
  evidence:
  - reference: PMID:20451172
    reference_title: A splice-site mutation in a retina-specific exon of BBS8 causes nonsyndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an in-frame splice mutation in BBS8, one of the genes involved in
      pleiotropic Bardet-Biedl syndrome (BBS), is sufficient to cause
      nonsyndromic retinitis pigmentosa (RP)
    explanation: Establishes a retina-specific TTC8/BBS8 allele as the cause of RP51.
  - reference: PMID:26195043
    reference_title: Confirmation of TTC8 as a disease gene for nonsyndromic autosomal recessive retinitis pigmentosa (RP51).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation segregated completely with the disease in the family and was
      not observed in 100 ethnically matched controls from same population.
    explanation: Adds segregation evidence from an independent TTC8-RP51 family.
- name: BBS1
  association: Pathogenic biallelic variants at the mild end of the BBS1 allelic spectrum
  gene_term:
    preferred_term: BBS1
    term:
      id: hgnc:966
      label: BBS1
  notes: >-
    BBS1 is a core BBSome subunit. Recurrent p.Met390Arg can occur in isolated
    RP, mild BBS, or full BBS, and a noncoding branchpoint allele paired with
    p.Met390Arg demonstrates why coding-only testing may miss a causal allele.
  evidence:
  - reference: PMID:23143442
    reference_title: BBS1 mutations in a wide spectrum of phenotypes ranging from nonsyndromic retinitis pigmentosa to Bardet-Biedl syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 14 patients with 2 BBS1 variants showed the entire clinical spectrum,
      from nonsyndromic RP to full-blown BBS.
    explanation: Establishes isolated RP as one end of the BBS1 allelic spectrum.
  - reference: PMID:33910932
    reference_title: BBS1 branchpoint variant is associated with non-syndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A putative severe branchpoint variant in BBS1, together with a mild
      missense variant, underlies non-syndromic RP in four unrelated individuals.
    explanation: Replicates BBS1-associated isolated RP and adds a noncoding pathogenic mechanism.
- name: BBS2
  association: Pathogenic biallelic variants, especially reported missense combinations
  gene_term:
    preferred_term: BBS2
    term:
      id: hgnc:967
      label: BBS2
  notes: >-
    Multiple cosegregating BBS2 missense genotypes have been reported in
    nonsyndromic RP families. A later BBS-gene cohort also linked biallelic
    missense BBS2 variants with fewer systemic findings and milder visual
    impairment.
  evidence:
  - reference: PMID:25541840
    reference_title: Association between missense mutations in the BBS2 gene and nonsyndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, we identified 4 BBS2 missense mutations that cause
      nonsyndromic retinitis pigmentosa.
    explanation: Establishes multiple BBS2 missense alleles in nonsyndromic RP families.
  - reference: PMID:37031301
    reference_title: Phenotypic diversity observed in a Chinese patient cohort with biallelic variants in Bardet-Biedl syndrome genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with biallelic missense variants in BBS2 suffered fewer clinical
      symptoms and mild visual impairment.
    explanation: Supports reduced systemic burden with some biallelic BBS2 missense genotypes.
- name: BBS9
  association: Pathogenic biallelic variants, including a hypomorphic splice-affecting allele
  gene_term:
    preferred_term: BBS9
    term:
      id: hgnc:30000
      label: BBS9
  notes: >-
    A family with nonsyndromic RP and a novel BBS9 variant was reported in a
    BBS cohort. A subsequent patient with a splice-affecting allele had
    rod-cone dystrophy and only mild extra-ocular findings; this entry represents
    the phenotype as nearly isolated rather than asserting complete absence of
    systemic disease.
  evidence:
  - reference: PMID:22353939
    reference_title: In search of triallelism in Bardet-Biedl syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including the occurrence of nonsyndromic retinitis pigmentosa in a family
      with a novel BBS9 mutation
    explanation: Documents a BBS9-associated nonsyndromic-RP family.
  - reference: PMID:38534779
    reference_title: Autosomal Recessive Rod-Cone Dystrophy with Mild Extra-Ocular Manifestations Due to a Splice-Affecting Variant in BBS9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest that this variant is likely hypomorphic. This is in agreement
      with the relatively mild phenotype observed in the patient.
    explanation: Relates partial splice disruption to a mild, retina-dominant BBS9 phenotype.
pathophysiology:
- name: Partial or retina-selective BBSome dysfunction
  conforms_to: "bbsome_trafficking#BBSome-Dependent Ciliary Cargo Trafficking Failure"
  description: >-
    Biallelic mild, hypomorphic, or retina-selective alleles reduce BBSome
    function in photoreceptors. The precise allele mechanism differs by locus:
    retina-specific splicing is established for TTC8, a visual-function-selective
    effect for ARL6 p.Ala89Val, a noncoding splice defect for BBS1, missense
    associations for BBS2, and partial aberrant splicing for BBS9.
  genes:
  - preferred_term: ARL6
    term:
      id: hgnc:13210
      label: ARL6
  - preferred_term: TTC8
    term:
      id: hgnc:20087
      label: TTC8
  - preferred_term: BBS1
    term:
      id: hgnc:966
      label: BBS1
  - preferred_term: BBS2
    term:
      id: hgnc:967
      label: BBS2
  - preferred_term: BBS9
    term:
      id: hgnc:30000
      label: BBS9
  cellular_components:
  - preferred_term: cilium
    term:
      id: GO:0005929
      label: cilium
  biological_processes:
  - preferred_term: protein localization to cilium
    term:
      id: GO:0061512
      label: protein localization to cilium
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20451172
    reference_title: A splice-site mutation in a retina-specific exon of BBS8 causes nonsyndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent studies showed the exon to be expressed exclusively in the
      retina and enriched significantly in the photoreceptor layer.
    explanation: Establishes tissue-selective TTC8 transcript use in photoreceptors.
  - reference: PMID:21282186
    reference_title: Functional analysis of BBS3 A89V that results in non-syndromic retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      BBS3 A89V is sufficient to rescue the transport delays induced by the loss
      of bbs3, indicating that this mutation does not affect the function of
      BBS3 as it relates to syndromic disease.
    explanation: Shows allele-selective preservation of a general ARL6/BBS3 transport readout.
  - reference: PMID:33910932
    reference_title: BBS1 branchpoint variant is associated with non-syndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of the branchpoint variant revealed a complex
      splicing defect including exon 8 and exon 7/8 skipping, and partial
      in-frame deletion of exon 8.
    explanation: Demonstrates a noncoding BBS1 splice defect in isolated RP.
  - reference: PMID:38534779
    reference_title: Autosomal Recessive Rod-Cone Dystrophy with Mild Extra-Ocular Manifestations Due to a Splice-Affecting Variant in BBS9.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An in vitro minigene splice assay demonstrated that this variant leads to
      the partial aberrant splicing of Exon 3.
    explanation: Demonstrates partial splice disruption for a mild BBS9 retinal phenotype.
  downstream:
  - target: Photoreceptor outer-segment cargo and lipid dysregulation
    description: Reduced BBSome function disturbs the composition and homeostasis of the photoreceptor outer segment.
    evidence:
    - reference: PMID:35277505
      reference_title: Loss of the Bardet-Biedl protein Bbs1 alters photoreceptor outer segment protein and lipid composition.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Bbs1-loss leads to accumulation of membrane-associated proteins in OSs,
        with enrichment in proteins involved in lipid homeostasis.
      explanation: Directly links BBSome loss to outer-segment cargo and lipid disturbance.
- name: Photoreceptor outer-segment cargo and lipid dysregulation
  description: >-
    The photoreceptor outer segment is a specialized cilium with continuous
    membrane renewal. BBSome loss destabilizes the complex, permits accumulation
    of membrane-associated cargo, and disrupts lipid and cholesterol composition.
    Early visual dysfunction can precede overt outer-segment disorganization.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  locations:
  - preferred_term: retina

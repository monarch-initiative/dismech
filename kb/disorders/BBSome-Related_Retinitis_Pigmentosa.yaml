review_notes: >-
  Comprehensive re-review completed 2026-07-23. The entry retains a strict
  five-gene BBSome scope; corrects the BBS9 citation title; separates broader
  ClinGen ciliopathy assertions from isolated-RP evidence; adds gene-to-mechanism
  wiring, evidence on every causal edge, natural history, expanded phenotypes,
  diagnostic and differential guidance, supportive management, a current BBS1
  trial, animal and human cellular models, GEO datasets, and explicit
  interpretation gaps. No exact-class population prevalence is asserted because
  available percentages describe broad RP or gene-specific referral cohorts,
  not this five-gene mechanistic class.

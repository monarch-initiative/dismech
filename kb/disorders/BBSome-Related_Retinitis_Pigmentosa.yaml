    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis is therefore crucial for diagnosis, genetic counseling,
      and future gene therapy in these patients.
    explanation: Directly supports genetic counseling in BBS-gene retinal disease.
clinical_trials:
- name: NCT07269665
  phase: PHASE_I
  status: NOT_RECRUITING
  description: >-
    First-in-human, open-label, dose-escalation study of a single intraocular
    AXV-101 dose in participants aged 4-17 years with biallelic BBS1 variants
    and retinal degeneration. The study evaluates preliminary safety,
    tolerability, dose, pharmacodynamics, ocular structural and functional
    change, and systemic pharmacokinetics; it does not establish efficacy.
  target_phenotypes:
  - preferred_term: Rod-cone dystrophy
    term:
      id: HP:0000510
      label: Rod-cone dystrophy
  - preferred_term: Progressive visual loss
    term:
      id: HP:0000529
      label: Progressive visual loss
  evidence:
  - reference: clinicaltrials:NCT07269665
    reference_title: A First-In-Human, Open Label, Dose Escalation Trial to Evaluate the Safety, Tolerability and Pharmacodynamics of a Single Dose of AXV-101 in Patients With Bardet-Biedl Syndrome 1 (BBS1) Bi-Allelic Mutations and Retinal Degeneration
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goal of this first in human study is to evaluate the preliminary
      safety and tolerability of AXV-101 in participants with BBS1.
    explanation: Identifies the first-in-human BBS1 retinal gene-therapy safety study.
  notes: >-
    ClinicalTrials.gov listed the study as NOT_YET_RECRUITING on 2026-07-23;
    represented as NOT_RECRUITING because that is the closest available schema
    status. ClinicalTrials.gov describes it as Early Phase 1; represented as
    PHASE_I because the schema has no Early Phase 1 value.

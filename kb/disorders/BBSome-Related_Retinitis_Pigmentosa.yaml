- name: Genetic counseling
  description: >-
    Counseling addresses autosomal recessive recurrence, carrier testing,
    reproductive options, the gene-specific allelic spectrum, and uncertainty
    about later systemic BBS manifestations. Molecularly confirmed relatives
    should receive phenotype-appropriate evaluation.
  treatment_term:
    preferred_term: genetic counseling

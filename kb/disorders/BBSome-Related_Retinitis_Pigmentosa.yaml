name: BBSome-related retinitis pigmentosa
creation_date: "2026-06-14T00:00:00Z"
category: Mendelian
description: >-
  BBSome-related retinitis pigmentosa is a mechanism-anchored class of
  autosomal recessive, predominantly isolated rod-cone dystrophy caused by
  biallelic variants in genes encoding the BBSome or its membrane-recruiting
  GTPase. The supported loci in this entry are ARL6/BBS3 (RP55), TTC8/BBS8
  (RP51), BBS1, BBS2, and BBS9. Retina-restricted splice isoforms, hypomorphic
  alleles, and other mild allelic combinations can reduce BBSome function enough
  to disturb photoreceptor-cilium cargo and outer-segment homeostasis while
  producing few or no extra-ocular Bardet-Biedl manifestations at ascertainment.
  Rod dysfunction, nyctalopia, and peripheral field loss generally precede
  central visual decline. The boundary with Bardet-Biedl syndrome is
  age-dependent and allelic rather than absolute, so ongoing systemic review is
  appropriate. No exact MONDO term represents this five-gene mechanistic lump;
  MONDO:0019200 is used as the broad disease term and per-locus entities are
  retained as related mappings.
disease_term:
  preferred_term: BBSome-related retinitis pigmentosa
  term:
    id: MONDO:0019200
    label: retinitis pigmentosa
parents:

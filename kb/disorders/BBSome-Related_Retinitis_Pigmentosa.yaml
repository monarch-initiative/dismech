    snippet: >-
      BBS3L A89V, however, was unable to rescue vision impairment, highlighting
      a role for a specific amino acid within BBS3 that is necessary for visual
      function, but dispensable in other cell types.
    explanation: Demonstrates a retina-selective functional deficit in vivo.
- species: Danio rerio
  genotype: bbs1 null mutant
  description: >-
    Bbs1 loss destabilizes the BBSome in outer segments, changes protein and
    lipid composition, produces early functional deficits, and later causes
    outer-segment disorganization and retinal degeneration.
  associated_phenotypes:
  - Early visual dysfunction
  - Outer-segment protein accumulation
  - Increased outer-segment cholesterol
  - Progressive retinal degeneration
  evidence:
  - reference: PMID:35277505
    reference_title: Loss of the Bardet-Biedl protein Bbs1 alters photoreceptor outer segment protein and lipid composition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a bbs1 zebrafish mutant, we show that retinal development and
      photoreceptor differentiation are unaffected by Bbs1-loss, supported by
      an initially unaffected transcriptome.
    explanation: Identifies the Bbs1-null zebrafish model and its initially preserved retinal development.
- species: Mus musculus
  genotype: Bbs1 p.Met390Arg homozygous knock-in
  description: >-
    The recurrent human BBS1 allele produces retinal degeneration in mice.
    TUDCA preserved ERG and outer-nuclear-layer measures in this model, but the
    experiment is preclinical and does not establish a human treatment.
  associated_phenotypes:
  - Reduced electroretinogram response
  - Outer nuclear layer loss
  - Retinal thinning
  evidence:
  - reference: PMID:22110077
    reference_title: TUDCA slows retinal degeneration in two different mouse models of retinitis pigmentosa and prevents obesity in Bardet-Biedl syndrome type 1 mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TUDCA treatment preserved ERG b-waves and the outer nuclear layer in
      Bbs1(M390R/M390R) mice, and prevented obesity assessed at P120.
    explanation: Demonstrates structural and functional rescue in a BBS1 allele-specific mouse model.
- species: Mus musculus
  genotype: Bbs8 knockout
  description: >-
    Bbs8 loss alters retinal-pigment-epithelium transcript and protein
    expression before and during retinal degeneration, broadening the cellular
    context beyond photoreceptors.
  associated_phenotypes:
  - Retinal pigment epithelium gene-expression dysregulation
  - Retinal degeneration
  evidence:
  - reference: PMID:33681195
    reference_title: Loss of Ciliary Gene Bbs8 Results in Physiological Defects in the Retinal Pigment Epithelium.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate that upon loss of Bbs8, predominantly thought to be a
      ciliary gene, the RPE shows changes in gene and protein expression
      initially involved in signaling pathways and developmental processes
    explanation: Establishes molecular RPE changes after Bbs8 loss.
- species: Danio rerio
  genotype: bbs2 homozygous mutant
  description: >-
    Adult mutant retinas undergo progressive cone loss with inflammatory and
    stress-response activation and fail to mount an effective regenerative
    response.
  associated_phenotypes:
  - Progressive cone photoreceptor loss
  - Microglial activation
  - Retinal inflammatory signaling
  evidence:
  - reference: PMID:37293546
    reference_title: Comparative analysis of transcriptional changes in zebrafish cep290 and bbs2 mutants by RNA-seq reveals upregulation of inflammatory and stress-related pathways.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      zebrafish carrying mutations in cep290 or bbs2 undergo progressive loss
      of cone photoreceptors and exhibit signs of microglia activation and
      inflammation, but the mutants fail to stimulate a regeneration response.
    explanation: Defines the degenerative and inflammatory bbs2-mutant retinal phenotype.

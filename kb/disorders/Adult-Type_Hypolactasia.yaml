    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These SNPs originated on different haplotype backgrounds from the European C/T-13910 SNP and from each other.
    explanation: The study supports multiple regulatory backgrounds for persistence.
  - reference: PMID:17159977
    reference_title: Convergent adaptation of human lactase persistence in Africa and Europe.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT

biochemical:
- name: Breath hydrogen after lactose challenge
  presence: INCREASED
  context: An increase reflects microbial fermentation of unabsorbed substrate, with false-positive and false-negative causes. It is not a direct lactase measurement or a symptom-severity score. The study reporting an AUC of 1.00 enrolled 40 healthy women aged 18–30, enriched for self-reported milk symptoms (30/40), with 14 genotype-defined non-persistent participants and 26 persistent participants. Cutoffs were optimized in the same cohort without external validation; the standard 20-ppm cutoff after 50 g lactose had 100% sensitivity and 96.2% specificity. Both 750-mL milk arms contained 37.5 g lactose and involved these same participants. No superiority of one milk for clinical symptoms or universal test accuracy follows.
  readouts:
  - target: Increased Intestinal Gas Production
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Exhaled hydrogen is an indirect gas-production readout, affected by hydrogen-consuming organisms and transit.
    evidence:
    - reference: PMID:34431620
      reference_title: 'European guideline on indications, performance, and clinical impact of hydrogen and methane breath tests in adult and pediatric patients: European Association for Gastroenterology, Endoscopy and Nutrition, European Society of Neurogastroenterology and Motility, and European Society for Paediatric Gastroenterology Hepatology and Nutrition consensus.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: increased H2 production is readily detectable as an increase in H2 excretion in the breath.
      explanation: Breath hydrogen reflects intestinal microbial production.
  evidence:
  - reference: PMID:32600320
    reference_title: Evaluation of breath, plasma, and urinary markers of lactose malabsorption to diagnose lactase non-persistence following lactose or milk ingestion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Genetic testing identified 14 out of 40 subjects as having LNP (C/C13910 and G/G22018).
    explanation: The diagnostic marker study uses a small genotype-defined reference group.
- name: Intestinal regulatory-region DNA modification
  presence: INCREASED
  context: Research finding in defined intestinal tissues and genotypes, not a validated blood test or routine clinical diagnostic. The pediatric methylation classifier underwent internal leave-one-out validation, not independent external validation. Associations with lactase activity do not prove methylation causally mediates symptoms.
  evidence:
  - *id008
  - *id009

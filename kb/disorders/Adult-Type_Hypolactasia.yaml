genetic:
- name: MCM6 regulatory variant (lactase non-persistence allele)
  gene_term:
    preferred_term: MCM6
    term:
      id: hgnc:6949
      label: MCM6
  relationship_type: CAUSATIVE
  notes: >-
    The causal variants are cis-regulatory and sit in an MCM6 intron upstream of
    LCT, not in LCT itself. C/T-13910 is the European-defining variant, with
    G/A-22018 in strong linkage disequilibrium with it. Additional
    lactase-persistence alleles arose independently in African and Middle Eastern
    populations, so a European-genotype test can misclassify non-European
    individuals. MCM6 is annotated here as the gene harbouring the regulatory
    element; the gene whose expression is controlled is LCT.
  evidence:
  - reference: PMID:11788828
    reference_title: "Identification of a variant associated with adult-type hypolactasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second variant, G/A-22018, 8 kb telomeric to C/T-13910, is also associated with the trait in 229 of 236 cases."
    explanation: >-
      Documents the second associated regulatory variant and the strength of its
      association.
  - reference: PMID:11788828
    reference_title: "Identification of a variant associated with adult-type hypolactasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "That the variant (C/T-13910) occurs in distantly related populations indicates that it is very old."
    explanation: >-
      Supports the antiquity and cross-population distribution of the causal
      allele.
diagnosis:
- name: Hydrogen Breath Test
  description: >-
    Measures breath hydrogen after an oral lactose load; the hydrogen comes from
    colonic bacterial fermentation of malabsorbed lactose, so the test reads out
    the fermentation node of the mechanism directly.
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HBT is the most used method because it is non-invasive, inexpensive, and highly sensitive and specific, as well as easy to perform."
    explanation: >-
      Establishes the hydrogen breath test as the principal diagnostic method.
treatments:
- name: Lactose Restriction
  description: >-
    Reducing dietary lactose to below the threshold that residual lactase can
    handle. Because the enzyme deficit is partial, complete dairy exclusion is
    usually unnecessary, and lactose-free products with equivalent nutritional
    content are preferred over simply removing dairy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Unhydrolysed Lactose Retained in the Small-Bowel Lumen
    description: >-
      Lowering the ingested lactose load keeps it within the capacity of residual
      lactase, so little or none is retained in the lumen.
    evidence:
    - reference: PMID:33887513
      reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An appropriate intervention concerns the dietetic style, such as the consumption of lactose-free foods, but with nutritional characteristics comparable to dairy products."
      explanation: >-
        Identifies dietary lactose reduction, with nutritional equivalence, as
        the primary intervention.
  target_phenotypes:
  - preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
  - preferred_term: Flatulence
    term:
      id: HP:0033589
      label: Flatulence
- name: Exogenous Lactase Supplementation
  description: >-
    Oral lactase enzyme taken with a lactose-containing meal, replacing the
    missing hydrolytic step so lactose is digested normally and never reaches the
    colon as fermentable substrate.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Declining Intestinal Lactase Activity
    description: >-
      Exogenous enzyme substitutes for the deficient endogenous
      lactase-phlorizin hydrolase at the point of the deficit.
    evidence:
    - reference: PMID:33887513
      reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Other valid choices are represented by the use of exogenous enzymes, probiotics, prebiotics"
      explanation: >-
        Establishes exogenous enzyme replacement as an accepted therapeutic
        option for this condition.
  target_phenotypes:
  - preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea

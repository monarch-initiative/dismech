    reference_title: A comparison of symptoms after the consumption of milk or lactose-hydrolyzed milk by people with self-reported severe lactose intolerance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: When the periods were compared, there were no statistically significant differences in the severity of these four gastrointestinal symptoms.
    explanation: In 30 self-described severely intolerant adults, including 21 malabsorbers, a one-week 240-mL milk crossover produced minimal symptom severity. A small excess flatus count remained among malabsorbers; this is not a universal tolerance threshold.
differential_diagnoses:
- name: Irritable bowel syndrome
  disease_term:
    preferred_term: irritable bowel syndrome
    term:
      id: MONDO:0005052
      label: irritable bowel syndrome
  description: IBS and lactose intolerance may coexist. A positive lactose breath test does not establish that a prior IBS diagnosis was wrong, and lactose-related symptoms can be amplified by visceral sensitivity.
  distinguishing_features:
  - Assess reproducible lactose-related symptoms as well as the independent clinical criteria for IBS.
  - Persistent symptoms despite appropriate lactose management require evaluation for coexisting disease.
  evidence:
  - reference: PMID:32623873
    reference_title: 'Irritable bowel syndrome and lactose intolerance: the importance of differential diagnosis. A monocentric study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: At the HBT, 79.9% (N.=207) of patients with IBS were positive, while in the control group were positive 25.0% (N.=27) of subjects (P<0.001).
    explanation: This selected monocentric cohort documents breath-test overlap, not the fraction of all IBS diagnoses that are erroneous.
  - *id010
- name: Secondary lactase deficiency
  description: Acquired small-intestinal mucosal injury can lower lactase at any age. Celiac disease, infection including giardiasis and rotavirus, Crohn disease and malnutrition are possible causes; activity may improve when the underlying process resolves.
  distinguishing_features:
  - Look for underlying intestinal disease, alarm signs, acquired timing or other evidence of malabsorption.
  - Lactase-persistence genotype does not rule out secondary deficiency.
  evidence:
  - reference: PMID:34431620
    reference_title: 'European guideline on indications, performance, and clinical impact of hydrogen and methane breath tests in adult and pediatric patients: European Association for Gastroenterology, Endoscopy and Nutrition, European Society of Neurogastroenterology and Motility, and European Society for Paediatric Gastroenterology Hepatology and Nutrition consensus.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Secondary lactase deficiency, due to damage to the small intestinal mucosa, may occur at any age and may be caused by infectious enteritis (i.e., Rotavirus, particularly in infancy), enteropathy (i.e., celiac disease, Giardiasis, and Crohn's disease), or severe malnutrition and may, thus, be transient and related to the underlying condition.
    explanation: The guideline distinguishes secondary mucosal deficiency from primary non-persistence.
- name: Congenital lactase deficiency
  description: Rare congenital lactase deficiency causes severe neonatal milk-related diarrhea rather than the age-dependent primary decline addressed here.
  distinguishing_features:
  - Onset in the first days of life with severe watery diarrhea and nutritional consequences.
  - Congenital LCT deficiency requires a different diagnostic and dietary approach.
  evidence:
  - reference: PMID:34431620
    reference_title: 'European guideline on indications, performance, and clinical impact of hydrogen and methane breath tests in adult and pediatric patients: European Association for Gastroenterology, Endoscopy and Nutrition, European Society of Neurogastroenterology and Motility, and European Society for Paediatric Gastroenterology Hepatology and Nutrition consensus.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: manifests with severe symptoms (intractable watery osmotic diarrhea associated with metabolic acidosis, dehydration and weight loss) in the first days of life
    explanation: The guideline describes the neonatal congenital presentation.
- name: Milk protein allergy
  description: Immune-mediated reactions to milk proteins differ from lactose maldigestion. Lactose-free dairy still contains milk protein and does not by itself address milk allergy.
  distinguishing_features:
  - Assess an allergic phenotype and refer for allergy evaluation when indicated.
  - A response to avoiding whole dairy does not identify which component caused symptoms.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK532285/
    reference_title: Lactose Intolerance - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Referral to an allergist is important if a milk allergy&#x02014;an immune-mediated reaction to milk proteins&#x02014;is suspected, as this condition is often confused with lactose intolerance.
    explanation: The clinical chapter separates milk-protein allergy from lactose intolerance.
treatments:

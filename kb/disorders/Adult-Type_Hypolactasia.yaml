discussions:
- discussion_id: malabsorption_versus_intolerance
  kind: KNOWLEDGE_GAP
  prompt: Which microbial, sensory and dietary factors determine symptoms at a given lactose load?
  attaches_to:
  - pathophysiology#Colonic Microbial Fermentation of Lactose
  - phenotypes#Abdominal Pain
  rationale: Malabsorption and symptoms are not equivalent. Selected trials and guidelines show dose, meal context, visceral sensitivity and expectation effects. A single small milk trial cannot define a universal tolerated dose; absence of significant severity differences also does not erase its observed excess flatus count. No current source establishes one microbial mechanism for every symptomatic person.
  evidence:
  - reference: PMID:34431620
    reference_title: 'European guideline on indications, performance, and clinical impact of hydrogen and methane breath tests in adult and pediatric patients: European Association for Gastroenterology, Endoscopy and Nutrition, European Society of Neurogastroenterology and Motility, and European Society for Paediatric Gastroenterology Hepatology and Nutrition consensus.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: only a proportion of carbohydrate malabsorbers develop symptoms
    explanation: The guideline distinguishes malabsorption from symptoms.
  - reference: PMID:7776987
    reference_title: A comparison of symptoms after the consumption of milk or lactose-hydrolyzed milk by people with self-reported severe lactose intolerance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: When the periods were compared, there were no statistically significant differences in the severity of these four gastrointestinal symptoms.
    explanation: The crossover trial supports discordance between self-report and symptoms at a modest milk dose, within its small selected cohort.
- discussion_id: epigenetic_mediation
  kind: KNOWLEDGE_GAP
  prompt: Does changing regulatory DNA modification alter age-dependent LCT expression independently of genotype?
  attaches_to:
  - pathophysiology#Genotype-Associated Regulatory DNA Modification
  - pathophysiology#Reduced Enterocyte LCT Transcription
  rationale: Adult and pediatric intestinal associations support a regulatory epigenetic model, but adult age trends are cross-sectional and pediatric enzyme-defined groups are not symptom cohorts. Deletion and RNAi experiments perturb DNA or RNA rather than methylation. Targeted epigenetic editing and appropriately sampled longitudinal studies are needed to resolve mediation.
  evidence:
  - reference: PMID:27159559
    reference_title: Lactase nonpersistence is directed by DNA-variation-dependent epigenetic aging.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: Future studies examining chromatin configuration35 at the LCT–MCM6 locus in aging individuals and targeted epigenetic editing with the CRISPR-Cas9 system41 will be necessary to fully understand genetic-epigenetic contributions to lactase persistence and non-persistence.
    explanation: The authors explicitly identify epigenetic editing as future work.
clinical_trials:
- name: clinicaltrials:NCT03659747
  status: COMPLETED
  phase: NOT_APPLICABLE
  description: Booster Alpha randomized 34 adults aged 25–60 with a positive screening lactose breath test in a blinded three-period crossover. Each 25-g lactose challenge used fat-free milk and Bi-07, 4662 FCC units lactase or placebo. The primary six-hour breath-H2 iAUC was lower with Bi-07 than placebo, but higher than with lactase; noninferiority to lactase was not established. No Bi-07 symptom advantage over placebo was demonstrated. The primary per-protocol population was 33 after one smoking exclusion.
  notes: Registry status, phase and actual enrollment checked against the live ClinicalTrials.gov API on 2026-09-21. One-week washouts, significant carryover and sequence effects, an unvalidated symptom questionnaire and industry involvement limit inference. These were acute challenges, not chronic symptom-control trials.
  evidence:
  - reference: PMID:36149331
    reference_title: Bifidobacterium animalis subsp. lactis Bi-07 supports lactose digestion in vitro and in randomized, placebo- and lactase-controlled clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The noninferiority of Bi-07 compared with lactase was not shown
    explanation: The milk trial failed its lactase noninferiority hypothesis.
  - reference: PMID:36149331
    reference_title: Bifidobacterium animalis subsp. lactis Bi-07 supports lactose digestion in vitro and in randomized, placebo- and lactase-controlled clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In Booster Alpha, there were no significant differences in any GI symptom between Bi-07 and placebo.
    explanation: The symptom endpoint does not establish clinical superiority despite improved breath hydrogen.
- name: clinicaltrials:NCT03814668
  status: COMPLETED
  phase: NOT_APPLICABLE
  description: Booster Omega randomized 34 adults in the analogous three-period crossover protocol using 25 g aqueous lactose. Bi-07 lowered breath-H2 iAUC relative to placebo and met the prespecified noninferiority margin against lactase for that gas endpoint. Lactase did not significantly outperform placebo on the primary iAUC measure. No broad symptom advantage was shown; Bi-07 increased nausea. All 34 were in the per-protocol population, but two Bi-07 visits with vomiting were excluded from that outcome analysis (32 Bi-07 versus 34 comparator observations).
  notes: Registry status, phase and actual enrollment checked against the live ClinicalTrials.gov API on 2026-09-21. Sequence effects, possible taste-related unblinding, an unvalidated symptom questionnaire and industry involvement limit translation. The gas noninferiority result does not show symptomatic equivalence or long-term efficacy.
  evidence:
  - reference: PMID:36149331
    reference_title: Bifidobacterium animalis subsp. lactis Bi-07 supports lactose digestion in vitro and in randomized, placebo- and lactase-controlled clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Bi-07 was superior to placebo and noninferior to lactase, based on BHC iAUC values.
    explanation: Noninferiority applies specifically to this gas endpoint and aqueous challenge.
  - reference: PMID:36149331
    reference_title: Bifidobacterium animalis subsp. lactis Bi-07 supports lactose digestion in vitro and in randomized, placebo- and lactase-controlled clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: With regard to nausea, participants experienced symptoms with greater frequency and severity during Bi-07 treatment than for placebo and lactase.
    explanation: The clinical adverse symptom qualifies the favorable gas result.

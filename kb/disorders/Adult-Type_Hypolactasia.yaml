- name: Unhydrolysed Lactose Retained in the Small-Bowel Lumen
  biological_scale: TISSUE
  conforms_to: "diet_induced_osmotic_diarrhea#Unabsorbed Dietary Solute Retention in the Intestinal Lumen"
  description: >-
    Lactose that is not hydrolysed cannot be absorbed, so it stays in the lumen
    as an osmotically active disaccharide. This is the rate-limiting,
    substrate-specific node shared with the other diet-induced osmotic
    diarrhoeas, and it is where dose-dependence enters: a small lactose load may
    be fully handled by residual enzyme, while a larger one saturates it.
  biological_processes:

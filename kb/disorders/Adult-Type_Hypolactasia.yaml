- name: Hydrogen breath test with concurrent symptom assessment
  diagnosis_term:
    preferred_term: lactose hydrogen breath test
    term:
      id: NCIT:C116515
      label: Breath Test
  description: The 2022 European guideline recommends 25–50 g lactose for adult malabsorption testing and 25 g when assessing intolerance, with an H2 rise of at least 20 ppm above baseline. Record symptoms concurrently and report malabsorption and intolerance separately. Preparation, low hydrogen excretion, methane production, SIBO, rapid transit and slow substrate arrival can alter results. The 2026 Israeli consensus recommends simultaneous H2/CH4 measurements; the European guideline is more cautious about the added clinical utility of methane. Neither gas response establishes congenital versus primary versus secondary deficiency.
  evidence:
  - reference: PMID:34431620

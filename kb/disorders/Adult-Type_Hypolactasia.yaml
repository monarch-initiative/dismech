  - target: Genotype-Associated Regulatory DNA Modification
    description: Genotype is associated with modification of regulatory DNA in intestinal tissue; causation and developmental timing are incompletely resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27159559
      reference_title: Lactase nonpersistence is directed by DNA-variation-dependent epigenetic aging.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: In lactase non-persistent individuals (CC), DNA modifications consistently increased with age across LCT and MCM6 (Fig. 4).
      explanation: Cross-sectional adult jejunal enterocyte observations support genotype-associated epigenetic aging; no longitudinal childhood trajectory was measured.
    - reference: PMID:29618745
      reference_title: Differences in DNA Methylation and Functional Expression in Lactase Persistent and Non-persistent Individuals.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: These results suggest that most of the DNA methylation variation at the LCT enhancer is explained by the genotype at rs4988235 alone.
      explanation: In the selected pediatric biopsy cohort, genotype accounted for most enhancer methylation variation; this does not establish methylation as an independent cause of symptoms.
  gene:
    preferred_term: MCM6
    term:
      id: hgnc:6949
      label: MCM6
- name: Genotype-Associated Regulatory DNA Modification
  biological_scale: MOLECULAR
  description: Adult surgical jejunal enterocytes show genotype-associated DNA modification and age associations at LCT-MCM6 regions. The assays measure modified cytosines without uniquely resolving 5mC from 5hmC. The 115 adults were sampled cross-sectionally at ages 21–72; proposed earlier-life trajectories are postdictions. A separate selected pediatric duodenal-biopsy study supports genotype-associated methylation and enzyme-activity correlations. Neither study proves a universal methylation-mediated route to symptoms. Regulatory DNA deletions establish element function, not the causal effect of changing its methylation.
  evidence:
  - &id008
    reference: PMID:27159559
    reference_title: Lactase nonpersistence is directed by DNA-variation-dependent epigenetic aging.
    supports: SUPPORT

pathophysiology:
- name: Failure to Sustain LCT Transcription After Weaning
  biological_scale: MOLECULAR
  conforms_to: "diet_induced_osmotic_diarrhea#Loss of a Substrate-Specific Brush-Border Digestive or Absorptive Step"
  description: >-
    The causal variant is regulatory, not structural. Sequencing of the LCT
    coding and promoter regions found no variation tracking with the phenotype;
    instead a cis-acting element roughly 14 kb upstream, within an MCM6 intron,
    governs whether LCT transcription is maintained into adulthood. The
    ancestral C allele at C/T-13910 drives the enhancer weakly relative to the
    derived T allele, and reporter assays in intestinal cells show the two
    alleles differ in the transcriptional activation they confer and in the
    nuclear proteins they bind. Because this is a quantitative transcriptional
    effect rather than an inactivating lesion, residual lactase persists — which
    is why tolerance is dose-dependent rather than absolute.
  gene:
    preferred_term: MCM6
    term:
      id: hgnc:6949
      label: MCM6
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: regulation of LCT transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:11788828
    reference_title: "Identification of a variant associated with adult-type hypolactasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analyses of the coding and promoter regions of LCT, the gene encoding LPH, has revealed no DNA variations correlating with lactase non-persistence."
    explanation: >-
      Excludes a coding or promoter lesion in LCT, which is what forces the
      mechanism to be a distal regulatory element.
  - reference: PMID:11788828
    reference_title: "Identification of a variant associated with adult-type hypolactasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a DNA variant, C/T-13910, roughly 14 kb upstream from the LCT locus, completely associates with biochemically verified lactase non-persistence in Finnish families"
    explanation: >-
      Identifies the upstream regulatory variant and its complete association
      with biochemically confirmed non-persistence.
  - reference: PMID:12915462
    reference_title: "Lactase persistence DNA variant enhances lactase promoter activity in vitro: functional role as a cis regulatory element."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The DNA region of the C/T_(13910) lactase persistence/non-persistence variant functions in vitro as a cis element capable of enhancing differential transcriptional activation of the lactase promoter."
    explanation: >-
      Functional demonstration that the variant acts as a cis-regulatory element
      controlling lactase transcription, establishing the molecular mechanism.
  - reference: PMID:12915462
    reference_title: "Lactase persistence DNA variant enhances lactase promoter activity in vitro: functional role as a cis regulatory element."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The DNA sequence of the C/T_(13910) variants differentially interacts with intestinal cell nuclear proteins on EMSAs."
    explanation: >-
      Shows the two alleles differ in nuclear protein binding, the biochemical
      basis of their differing transcriptional output.
  downstream:
  - target: Declining Intestinal Lactase Activity
    causal_link_type: DIRECT
- name: Declining Intestinal Lactase Activity
  biological_scale: TISSUE
  description: >-
    Lactase-phlorizin hydrolase at the enterocyte brush border, which hydrolyses
    lactose into glucose and galactose, falls in activity through childhood in
    non-persistent individuals. This is a physiological, developmentally timed
    decline rather than a disease process in the usual sense, and it is the
    default outcome for most of humanity. Reduced, not absent, activity is the
    key quantitative feature separating this from congenital lactase deficiency.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte

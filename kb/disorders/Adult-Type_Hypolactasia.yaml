- name: Exogenous lactase supplementation
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  description: Oral lactase tablets or drops can improve luminal lactose digestion without changing endogenous LCT expression. Timing and formulation matter, and gas and symptom responses vary. In an uncontrolled paired study of 96 symptomatic C/C-13910 malabsorbers, enzyme given one hour before a 25-g aqueous challenge made 21 breath tests negative, reduced 17 and left 58 similar; this is not a placebo-controlled efficacy estimate or a universal failure rate.
  target_mechanisms:
  - target: Declining Intestinal Lactase Activity
    treatment_effect: BYPASSES
    description: Supplies luminal hydrolytic activity to compensate for low endogenous enzyme.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK532285/
      reference_title: Lactose Intolerance - StatPearls - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: Lactase enzyme supplements extracted from yeasts and molds are available as tablets or drops.
      explanation: The chapter describes exogenous digestive enzyme preparations.
  evidence:
  - reference: PMID:24967391
    reference_title: Effects of exogenous lactase administration on hydrogen breath excretion and intestinal symptoms in patients presenting lactose malabsorption and intolerance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The response to oral administration of Beta-Galactosidase in patients with symptoms of lactose malabsorption presents a significant variability.
    explanation: The paired study reports heterogeneous breath and symptom responses; symptom benefit was not shown to track hydrogen reduction.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK532285/
    reference_title: Lactose Intolerance - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In most cases, these supplements should be taken just before eating a high-lactose product or with the first bite.
    explanation: General clinical administration advice differs from the one-hour prechallenge research protocol.
  - reference: PMID:36149331
    reference_title: Bifidobacterium animalis subsp. lactis Bi-07 supports lactose digestion in vitro and in randomized, placebo- and lactase-controlled clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The likelihood of experiencing higher-severity abdominal pain (based on the participant-wise maximum severity that was experienced during each challenge) with lactase treatment was 0.32 times that with Bi-07 (P = 0.033) and placebo (P = 0.036)
    explanation: Lactase improved selected symptoms in the randomized milk challenge; the result is not generalized to every formulation or substrate.
- name: Dietetic and nutritional support
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  description: Provide individualized dietary counseling and maintain adequate calcium, vitamin D, protein and energy intake when dairy is reduced. Assess nutritional adequacy and supplement where appropriate. Restriction-related deficiency is a care concern, not an inevitable intrinsic phenotype of lactase non-persistence.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK532285/
    reference_title: Lactose Intolerance - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Dietitians play a central role in formulating personalized, well-balanced low-lactose or lactose-free diets while ensuring adequate intake of calcium, vitamin D, and other key nutrients.
    explanation: The chapter recommends dietetic support to prevent nutritional consequences of restriction.
- name: Investigational strain-specific probiotic supplementation
  therapeutic_modality: OTHER
  description: Bi-07 was tested as a high-dose, acute co-ingested preparation in two small randomized crossover trials. Breath-hydrogen exposure decreased relative to placebo, but a consistent symptom benefit was not demonstrated; nausea increased in the aqueous-lactose trial. These findings do not establish routine probiotic therapy, long-term benefit, a class effect or equivalence to lactase across food matrices.
  target_mechanisms:
  - target: Unhydrolysed Lactose Retained in the Intestinal Lumen
    treatment_effect: INHIBITS
    description: The preparation hydrolyzes lactose in milk in vitro; the clinical breath-gas outcome is consistent with improved digestion but does not directly measure the anatomical site of hydrolysis.
    evidence:
    - reference: PMID:36149331
      reference_title: Bifidobacterium animalis subsp. lactis Bi-07 supports lactose digestion in vitro and in randomized, placebo- and lactase-controlled clinical trials.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Bi-07 effected a decrease in the amount of lactose comparable with those of the commercial lactase and laboratory-grade β-galactosidase
      explanation: Direct in-vitro milk measurements support lactose hydrolysis by this specific preparation.
  evidence:
  - reference: PMID:36149331
    reference_title: Bifidobacterium animalis subsp. lactis Bi-07 supports lactose digestion in vitro and in randomized, placebo- and lactase-controlled clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In Booster Alpha, there were no significant differences in any GI symptom between Bi-07 and placebo.
    explanation: A reduction in the primary gas outcome did not establish symptom benefit in the milk trial.
  - reference: PMID:36149331
    reference_title: Bifidobacterium animalis subsp. lactis Bi-07 supports lactose digestion in vitro and in randomized, placebo- and lactase-controlled clinical trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In Booster Omega, except for symptoms of nausea, there were no differences between the 3 treatments.
    explanation: The aqueous-lactose trial showed no broad symptom advantage and more nausea with Bi-07.
animal_models:
- name: Mouse lactase regulatory-element deletions
  species: Mouse
  genotype: Separate CRISPR deletions of Lct intron 1, Lct intron 2 or Mcm6 intron 13
  background: C57BL/6N
  publication: PMID:27159559
  description: Infant day-6 and adult day-60 intestinal segments were examined after intronic deletions. Lct intron-1/2 deletions reduced mRNA broadly by 3–8-fold; Mcm6 intron-13 effects were smaller and segment-specific. Lct intron-2 dependence was greater in adults. Deletions avoided exons and splice sites; these are sequence perturbations, not epigenetic editing or human persistence-allele models.
  modeled_mechanisms:
  - target: Reduced Enterocyte LCT Transcription
    relationship: MEASURES
    fidelity: MODERATE
    description: Regulatory deletions reduce intestinal Lct transcript abundance.
    limitations: Does not establish methylation causality, human symptom thresholds or diarrhea frequency.
    evidence:
    - &id011
      reference: PMID:27159559
      reference_title: Lactase nonpersistence is directed by DNA-variation-dependent epigenetic aging.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: In adult and infant mice, deletion in Lct intron 1 as well as in Lct intron 2 caused widespread downregulation of Lct throughout the duodenum and jejunum
      explanation: Mouse regulatory deletions reduce Lct mRNA; clinical intolerance was not the measured endpoint.

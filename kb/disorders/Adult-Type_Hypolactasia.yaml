name: Adult-Type Hypolactasia
creation_date: "2026-09-04T02:40:00Z"
category: Metabolic Disorder
description: >-
  Adult-type hypolactasia, also called lactase non-persistence, is the ancestral
  human state in which intestinal lactase-phlorizin hydrolase activity declines
  after weaning. It is not caused by a coding lesion in LCT: the causal variants
  lie in an enhancer within an intron of the neighbouring MCM6 gene, roughly
  14 kb upstream of LCT, where the C allele at C/T-13910 (and independently
  derived alleles elsewhere, notably in Africa) fails to sustain LCT
  transcription into adulthood. Lactase activity falls rather than disappears,
  so the phenotype is dose-dependent: ingested lactose that escapes hydrolysis
  is retained in the small-bowel lumen as an osmotically active solute, draws in
  water, and is then fermented by colonic bacteria to short-chain fatty acids and
  gas, producing bloating, flatulence, abdominal pain and diarrhoea. Lactase
  non-persistence is the majority state worldwide, reported at 57-65% of adults,
  so this is the global norm and lactase persistence is the derived, selected
  trait. Malabsorption is necessary but not sufficient for symptoms: in a
  randomised double-blind trial, adults who described themselves as severely
  intolerant had negligible symptoms on 240 mL of milk daily. Management is
  therefore dose reduction or enzyme replacement rather than complete dairy
  avoidance.
disease_term:
  preferred_term: lactose intolerance adult type
  term:
    id: MONDO:0006065
    label: lactose intolerance adult type
synonyms:
- lactase persistence/nonpersistence
- lactase non-persistence
- adult lactase deficiency
- hypolactasia, adult type
- disaccharide intolerance 3
- lactose intolerance, ADULT type
parents:
- Lactose Intolerance
notes: >-
  Deliberately distinct from Congenital_Lactase_Deficiency (CLD), which is
  already curated and whose description explicitly contrasts itself with this
  entity. CLD is a rare LCT coding-region loss-of-function abolishing enzyme
  activity from birth, presenting neonatally with life-threatening watery
  diarrhoea. This entry is a common regulatory-variant condition that lowers but
  does not abolish lactase, only after weaning, and is a dietary-tolerance
  problem rather than a neonatal emergency. Evidence for one must not be reused
  for the other; that is a Named Entity Confusion risk, since much of the
  literature says only "lactase deficiency".

  Note also the inheritance inversion that makes this entry easy to mis-state:
  hypolactasia (the ancestral state) is recessive, while lactase *persistence*
  is the dominant, derived trait. The cited sources describe the same biology
  from both directions.

  Prevalence caveat, recorded so it is not rediscovered: the figure most often
  quoted for this condition — global lactose malabsorption of 68% (95% CI 64-72)
  — comes from Storhaug et al. 2017 (PMID:28690131), which PubMed flags as a
  Retracted Publication. It is deliberately not cited here, and the prevalence
  records below are sourced elsewhere. Note also that PMID:33887513's 57-65%
  range is labelled "lactose intolerance" in the source; at that magnitude it is
  the malabsorption trait rather than the symptomatic syndrome, and the two are
  routinely conflated in this literature. Each prevalence record says which one
  it means.

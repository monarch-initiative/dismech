prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: COMMON
  rate_per_100000: 61000.0
  rate_low: 57000.0
  rate_high: 65000.0
  notes: >-
    The source labels this range "lactose intolerance", but a figure of this
    magnitude is the malabsorption trait rather than the symptomatic syndrome;
    the two are routinely conflated in this literature and this record means the
    trait. Symptomatic intolerance is substantially less common, because
    malabsorption is necessary but not sufficient for symptoms. The more widely
    quoted 68% global estimate is deliberately not used here: it comes from a
    meta-analysis PubMed flags as retracted (PMID:28690131). prevalence_class is
    the qualitative COMMON rather than a numeric Orphanet band because the
    numeric bands terminate at ABOVE_1_IN_1000: that value is true of a 61%
    trait but conveys nothing, since it is the band designed for the common end
    of rare disease. The rate slots carry the number.
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lactose intolerance has a high prevalence worldwide, ranging between 57% and 65%."
    explanation: >-
      Gives an unretracted worldwide prevalence range for the condition, used
      here for the malabsorption trait per the caveat in this record's notes.
- population: Populations outside Europe, the Middle East, and parts of Africa and South Asia
  measure_type: POINT_PREVALENCE
  prevalence_class: COMMON
  notes: >-
    Recorded qualitatively rather than numerically, because the source states
    the geographic distribution of the reciprocal trait (lactase persistence)
    rather than a rate for non-persistence. Where persistence is rare or absent,
    adult-type hypolactasia is close to universal; where persistence is common,
    it is not. No rate is asserted, since inverting a prose statement into a
    number would manufacture precision the source does not carry.
  evidence:
  - reference: PMID:20144208
    reference_title: "A worldwide correlation of lactase persistence phenotype and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lactase persistence is common in people of European ancestry as well as some African, Middle Eastern and Southern Asian groups, but is rare or absent elsewhere in the world."
    explanation: >-
      Describes the global distribution of lactase persistence; non-persistence
      is its complement, so this bounds where hypolactasia is the near-universal
      adult state.
    directness: INDIRECT
genetic:
- name: MCM6 regulatory variant (lactase non-persistence allele)
  gene_term:
    preferred_term: MCM6
    term:
      id: hgnc:6949
      label: MCM6
  relationship_type: CAUSATIVE
  notes: >-
    The causal variants are cis-regulatory and sit in an MCM6 intron upstream of
    LCT, not in LCT itself. C/T-13910 is the European-defining variant, with
    G/A-22018 in strong linkage disequilibrium with it. Additional
    lactase-persistence alleles arose independently in African and Middle Eastern
    populations, so a European-genotype test can misclassify non-European
    individuals. MCM6 is annotated here as the gene harbouring the regulatory
    element; the gene whose expression is controlled is LCT.
  evidence:
  - reference: PMID:11788828
    reference_title: "Identification of a variant associated with adult-type hypolactasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second variant, G/A-22018, 8 kb telomeric to C/T-13910, is also associated with the trait in 229 of 236 cases."
    explanation: >-
      Documents the second associated regulatory variant and the strength of its
      association.
  - reference: PMID:11788828
    reference_title: "Identification of a variant associated with adult-type hypolactasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "That the variant (C/T-13910) occurs in distantly related populations indicates that it is very old."
    explanation: >-
      Supports the antiquity and cross-population distribution of the causal
      allele.
- name: African and Middle Eastern lactase-persistence alleles
  gene_term:
    preferred_term: MCM6
    term:
      id: hgnc:6949
      label: MCM6
  relationship_type: PROTECTIVE
  notes: >-
    Lactase persistence arose independently more than once. Three further
    regulatory variants in the same MCM6 enhancer region — G/C-14010, T/G-13915
    and C/G-13907 — segregate with persistence in East African and Middle
    Eastern populations, on haplotype backgrounds distinct from the European
    C/T-13910 and from each other. This is why a genetic test built only on
    C/T-13910 misclassifies non-European individuals as non-persistent: it
    genotypes the wrong site. The clinical consequence belongs to the diagnostic
    section, but the cause is here.

    relationship_type is PROTECTIVE, not CAUSATIVE: these derived alleles confer
    lactase persistence, which is the absence of this disease. The
    non-persistence allele in the entry above is the causative one. This is the
    same inversion the entry-level notes warn about, one level down.
  evidence:
  - reference: PMID:17159977
    reference_title: "Convergent adaptation of human lactase persistence in Africa and Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we conducted a genotype-phenotype association study in 470 Tanzanians, Kenyans and Sudanese and identified three SNPs (G/C-14010, T/G-13915 and C/G-13907) that are associated with lactase persistence"
    explanation: >-
      Identifies the three African-associated persistence variants distinct from
      the European C/T-13910.
  - reference: PMID:17159977
    reference_title: "Convergent adaptation of human lactase persistence in Africa and Europe."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "have derived alleles that significantly enhance transcription from the LCT promoter in vitro"
    explanation: >-
      Functional confirmation that these independent alleles act on LCT
      transcription, the same mechanism as the European variant.
  - reference: PMID:17159977
    reference_title: "Convergent adaptation of human lactase persistence in Africa and Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These SNPs originated on different haplotype backgrounds from the European C/T-13910 SNP and from each other."
    explanation: >-
      Establishes independent origin, which is what makes a single-variant
      European test invalid outside its source population.
- name: LCT (the regulated gene)
  gene_term:
    preferred_term: LCT
    term:
      id: hgnc:6530
      label: LCT
  notes: >-
    Listed explicitly because the entry's most surprising claim is that the
    causal variants are not in this gene. LCT encodes lactase-phlorizin
    hydrolase and is the gene whose transcription the MCM6 enhancer controls,
    but it carries no coding or promoter variation tracking with the phenotype.
    Coding-region loss of function in LCT causes a different disease
    (Congenital_Lactase_Deficiency), which is the Named Entity Confusion this
    entry guards against.

    relationship_type is deliberately absent. CAUSATIVE would contradict this
    entry's own REFUTE evidence below, and no available value means "the gene
    whose expression is regulated, harbouring no causal variation of its own".
    The slot is optional, so omission is the honest encoding.
  evidence:
  - reference: PMID:11788828
    reference_title: "Identification of a variant associated with adult-type hypolactasia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analyses of the coding and promoter regions of LCT, the gene encoding LPH, has revealed no DNA variations correlating with lactase non-persistence."
    explanation: >-
      Refutes an LCT coding or promoter lesion as the cause, which is the reason
      this gene is recorded as the regulated target rather than the mutated one.
diagnosis:
- name: Hydrogen Breath Test
  description: >-
    Measures breath hydrogen after an oral lactose load; the hydrogen comes from
    colonic bacterial fermentation of malabsorbed lactose, so the test reads out
    the fermentation node of the mechanism directly rather than the enzymatic
    lesion. Against genotype as the reference standard it discriminated
    persistence from non-persistence perfectly after a 50 g lactose challenge,
    and remained fully specific when milk was substituted, though the optimal
    threshold shifted with the substrate.
  diagnosis_term:
    preferred_term: lactose hydrogen breath test
    term:
      id: NCIT:C116515
      label: Breath Test
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HBT is the most used method because it is non-invasive, inexpensive, and highly sensitive and specific, as well as easy to perform."
    explanation: >-
      Establishes the hydrogen breath test as the principal diagnostic method.
  - reference: PMID:32600320
    reference_title: "Evaluation of breath, plasma, and urinary markers of lactose malabsorption to diagnose lactase non-persistence following lactose or milk ingestion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three LM markers (breath H2, plasma glucose and urinary galactose/creatinine) discriminated between lactase persistence (LP) and LNP following lactose challenge with an area under the receiver operating characteristic (ROC) curve (AUC) of 1.00, 0.75 and 0.73, respectively."
    explanation: >-
      Quantifies breath hydrogen as the only one of the three markers that
      separated the genotypes perfectly after a lactose challenge.
  - reference: PMID:32600320
    reference_title: "Evaluation of breath, plasma, and urinary markers of lactose malabsorption to diagnose lactase non-persistence following lactose or milk ingestion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The breath H2 optimal cut-off value was lower with a2 Milk™ (13 ppm) than conventional milk (21 ppm)."
    explanation: >-
      Records that the diagnostic threshold is substrate-dependent, so a cut-off
      validated for a lactose load does not transfer unchanged to milk.
- name: Genetic Testing for the Lactase-Persistence Genotype
  description: >-
    Genotyping the MCM6 regulatory variants. This is the only method that reads
    the causal lesion rather than a downstream consequence, and it was used as
    the diagnostic reference standard in the marker-comparison study above. Its
    critical limitation is population scope: a test built on the European
    C/T-13910 variant alone will call African and Middle Eastern persistent
    individuals non-persistent, because their persistence is conferred by
    different variants at different sites.
  diagnosis_term:
    preferred_term: lactase-persistence genotyping
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include genetic test, hydrogen breath test (HBT), quick lactase test, and lactose tolerance test."
    explanation: >-
      Lists genetic testing among the accepted diagnostic methods for this
      condition.
  - reference: PMID:32600320
    reference_title: "Evaluation of breath, plasma, and urinary markers of lactose malabsorption to diagnose lactase non-persistence following lactose or milk ingestion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of C/T13910 and G/A22018 polymorphisms, determined by restriction fragment length polymorphism, was used as the diagnostic reference for LNP."
    explanation: >-
      Documents genotyping of the two European regulatory variants serving as
      the reference standard for lactase non-persistence.
  - reference: PMID:17159977
    reference_title: "Convergent adaptation of human lactase persistence in Africa and Europe."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These SNPs originated on different haplotype backgrounds from the European C/T-13910 SNP and from each other."
    explanation: >-
      Supports genotyping as the diagnostic method while establishing which
      sites it must interrogate: persistence outside Europe is conferred by
      different variants, so a C/T-13910-only panel is inadequate there. Graded
      SUPPORT rather than REFUTE because it bears on one implementation of the
      method, not on the method itself; the population-scope limitation is
      stated in this entry's description.
- name: Lactose Tolerance Test
  description: >-
    Measures the rise in blood glucose after an oral lactose load; a blunted rise
    indicates that lactose was not hydrolysed into absorbable monosaccharides. It
    reads out the absorptive step more proximally than the breath test, but
    performed markedly worse than breath hydrogen against genotype and became
    unreliable altogether when milk rather than pure lactose was the challenge.
  diagnosis_term:
    preferred_term: lactose tolerance test (post-load blood glucose)
  notes: >-
    Deliberately left unbound. NCIT has no clinical-action term for the lactose
    tolerance test that is reachable from NCIT:C25218, and the obvious near
    matches are wrong in kind: this is a blood-glucose measurement after an oral
    load, so binding it to Breath Test would assert the wrong specimen and the
    wrong analyte. Per the ontology term contract a free-text preferred_term is
    correct here, and no term beats a bad one.
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include genetic test, hydrogen breath test (HBT), quick lactase test, and lactose tolerance test."
    explanation: >-
      Lists the lactose tolerance test among the accepted diagnostic methods.
  - reference: PMID:32600320
    reference_title: "Evaluation of breath, plasma, and urinary markers of lactose malabsorption to diagnose lactase non-persistence following lactose or milk ingestion."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma glucose and urinary galactose/creatinine were unreliable (AUC < 0.70) after milk ingestion."
    explanation: >-
      Refutes the blood-glucose-based tolerance test as a dependable diagnostic
      when the challenge substrate is milk.
- name: Quick Lactase Test on Duodenal Biopsy
  description: >-
    A rapid colorimetric assay of lactase activity performed on an endoscopic
    duodenal biopsy. It is the only listed method that measures the enzyme itself,
    so it is the direct readout of the lesion, at the cost of requiring
    endoscopy; in practice it is used to supplement the breath test rather than
    replace it.
  diagnosis_term:
    preferred_term: duodenal biopsy for rapid lactase assay
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include genetic test, hydrogen breath test (HBT), quick lactase test, and lactose tolerance test."
    explanation: >-
      Lists the quick lactase test among the accepted diagnostic methods.
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In clinical practice, the other methods are mainly used as HBT integration tests."
    explanation: >-
      Places the non-breath-test methods, including this one, as adjuncts to the
      hydrogen breath test.
biochemical:
- name: Breath hydrogen excretion after an oral lactose load
  presence: INCREASED
  context: >-
    Hydrogen in expired breath after an oral lactose challenge is produced by
    colonic bacterial fermentation of the malabsorbed sugar, so it is a readout
    of the fermentation node rather than of lactase activity. The conventional
    positive threshold is a rise of 20 ppm over baseline, but the optimal cut-off
    is substrate-dependent, and a minority of individuals are non-producers of
    hydrogen in whom the test can be falsely negative.
  readouts:
  - target: Colonic Microbial Fermentation of Lactose
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A rise in breath hydrogen after lactose reports that unhydrolysed lactose
      reached the colonic microbiota, which is the mechanism this node describes.
    evidence:
    - reference: PMID:24967391
      reference_title: "Effects of exogenous lactase administration on hydrogen breath excretion and intestinal symptoms in patients presenting lactose malabsorption and intolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the time to reach the cut-off value of 20 ppm"
      explanation: >-
        Records the conventional 20 ppm positivity threshold used for the lactose
        hydrogen breath test.
  - target: Declining Intestinal Lactase Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Breath hydrogen reports the enzymatic deficit only indirectly, through the
      fermentation it permits; it discriminated the causal genotype perfectly
      after a pure lactose challenge but is not a measurement of lactase.
    evidence:
    - reference: PMID:32600320
      reference_title: "Evaluation of breath, plasma, and urinary markers of lactose malabsorption to diagnose lactase non-persistence following lactose or milk ingestion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The specificity of breath H2 remained high (100%) when milk was used, but sensitivity was reduced with conventional (92.9%) and a2 Milk™ (78.6%) compared to lactose (sensitivities adjusted for lactose content)."
      explanation: >-
        Quantifies breath hydrogen's performance against genotype, and the
        sensitivity cost of using milk instead of pure lactose.
  evidence:
  - reference: PMID:32600320
    reference_title: "Evaluation of breath, plasma, and urinary markers of lactose malabsorption to diagnose lactase non-persistence following lactose or milk ingestion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing identified 14 out of 40 subjects as having LNP (C/C13910 and G/G22018)."
    explanation: >-
      Establishes the genotyped cohort against which the breath-hydrogen readout
      was calibrated.
environmental:
- name: Dietary lactose ingestion
  exposure_term:
    preferred_term: Dietary lactose ingestion
    term:
      id: ECTO:9000240
      label: exposure to disaccharide
  description: >-
    Dietary lactose is an obligate exposure: the enzymatic lesion is present
    lifelong and silent, and every symptom in this entry is produced only when
    lactose is ingested. The relationship is dose-graded rather than
    all-or-nothing, because residual lactase handles small loads. This is the
    exposure that separates the trait from the syndrome, and it is why the
    principal treatment is a change in exposure rather than a drug.
  chemicals:
  - lactose
  influences_mechanisms:
  - target: Unhydrolysed Lactose Retained in the Small-Bowel Lumen
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingested lactose supplies the substrate that remains unhydrolysed once the
      load exceeds residual lactase capacity; with no ingestion there is no
      luminal solute and no downstream mechanism.
    evidence:
    - reference: PMID:7776987
      reference_title: "A comparison of symptoms after the consumption of milk or lactose-hydrolyzed milk by people with self-reported severe lactose intolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ingestion of a large dose of the milk sugar lactose--for example, the 50-g load in 1 liter of milk--causes symptoms such as abdominal pain, diarrhea, bloating, and flatulence in the majority of people with lactose malabsorption."
      explanation: >-
        Establishes ingested lactose as the trigger and shows the effect is
        indexed to the ingested dose.
  evidence:
  - reference: PMID:7776987
    reference_title: "A comparison of symptoms after the consumption of milk or lactose-hydrolyzed milk by people with self-reported severe lactose intolerance."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "When lactose intake is limited to the equivalent of 240 ml of milk or less a day, symptoms are likely to be negligible and the use of lactose-digestive aids unnecessary."
    explanation: >-
      Refutes the view that any lactose exposure is symptomatic in a malabsorber,
      which is the basis for treating this as a dose-threshold exposure rather
      than a substance to eliminate.
differential_diagnoses:
- name: Irritable bowel syndrome
  disease_term:
    preferred_term: irritable bowel syndrome
    term:
      id: MONDO:0005052
      label: irritable bowel syndrome
  description: >-
    IBS and lactose intolerance share bloating, abdominal pain, flatulence and
    altered stool, and the overlap runs in both directions: a large share of
    patients carrying an IBS diagnosis test positive for lactose malabsorption,
    and conversely a malabsorber whose symptoms persist on a low-lactose diet
    likely has something else. This is the single most consequential differential
    here because the treatments differ and the lactose diagnosis is cheap to make.
  distinguishing_features:
  - Symptoms are time-locked to lactose ingestion and dose-graded, rather than continuous or stress-patterned
  - Positive lactose hydrogen breath test
  - Symptom resolution on lactose restriction or with exogenous lactase
  - IBS is a positive clinical diagnosis by symptom criteria, not a malabsorption state
  evidence:
  - reference: PMID:32623873
    reference_title: "Irritable bowel syndrome and lactose intolerance: the importance of differential diagnosis. A monocentric study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the HBT, 79.9% (N.=207) of patients with IBS were positive, while in the control group were positive 25.0% (N.=27) of subjects (P<0.001)."
    explanation: >-
      Quantifies how often a standing IBS diagnosis conceals lactose
      malabsorption in this referral cohort.
  - reference: PMID:32623873
    reference_title: "Irritable bowel syndrome and lactose intolerance: the importance of differential diagnosis. A monocentric study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore it is important to include LI in the pathologies with which IBS enters into differential diagnosis."
    explanation: >-
      States the differential-diagnostic relationship directly.
treatments:
- name: Lactose Restriction
  description: >-
    Reducing dietary lactose to below the threshold that residual lactase can
    handle. Because the enzyme deficit is partial, complete dairy exclusion is
    usually unnecessary, and lactose-free products with equivalent nutritional
    content are preferred over simply removing dairy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Unhydrolysed Lactose Retained in the Small-Bowel Lumen
    description: >-
      Lowering the ingested lactose load keeps it within the capacity of residual
      lactase, so little or none is retained in the lumen.
    evidence:
    - reference: PMID:33887513
      reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An appropriate intervention concerns the dietetic style, such as the consumption of lactose-free foods, but with nutritional characteristics comparable to dairy products."
      explanation: >-
        Identifies dietary lactose reduction, with nutritional equivalence, as
        the primary intervention.
  target_phenotypes:
  - preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
  - preferred_term: Flatulence
    term:
      id: HP:0033589
      label: Flatulence
- name: Exogenous Lactase Supplementation
  description: >-
    Oral lactase enzyme taken with a lactose-containing meal, replacing the
    missing hydrolytic step so lactose is digested normally and never reaches the
    colon as fermentable substrate. Response is markedly variable rather than
    uniform: in 96 breath-test-positive, uniformly C/C-13910 patients given a
    standard oral beta-galactosidase dose, only about a fifth converted to a
    negative breath test and roughly 60% were essentially unchanged. The entry
    records that variability rather than presenting supplementation as reliably
    corrective.

    therapeutic_agent is deliberately absent despite treatment_term being
    NCIT:C15986. The agent is the enzyme itself, and no candidate term is a
    member of the ChemicalEntityTerm enum, which is reachable only from
    CHEBI:24431 and NCIT:C1909 (Pharmacologic Substance): NCIT:C29147 Lactase
    sits under Dietary Supplement, NCIT:C107438 Beta-Galactosidase under
    Protein, and CHEBI has no term for the enzyme. Both CURIEs resolve, so this
    is an enum-membership gap rather than a missing term - do not re-add one
    without checking membership.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Declining Intestinal Lactase Activity
    description: >-
      Exogenous enzyme substitutes for the deficient endogenous
      lactase-phlorizin hydrolase at the point of the deficit.
    evidence:
    - reference: PMID:33887513
      reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Other valid choices are represented by the use of exogenous enzymes, probiotics, prebiotics"
      explanation: >-
        Establishes exogenous enzyme replacement as an accepted therapeutic
        option for this condition.
    - reference: PMID:24967391
      reference_title: "Effects of exogenous lactase administration on hydrogen breath excretion and intestinal symptoms in patients presenting lactose malabsorption and intolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Following the oral administration of Beta-Galactosidase, in 21.88% of the cases, H2 Lactose Breath Test became negative (Group A)"
      explanation: >-
        Shows that supplementation can abolish the malabsorption readout
        entirely, confirming the enzyme acts at the deficient step.
    - reference: PMID:24967391
      reference_title: "Effects of exogenous lactase administration on hydrogen breath excretion and intestinal symptoms in patients presenting lactose malabsorption and intolerance."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "The response to oral administration of Beta-Galactosidase in patients with symptoms of lactose malabsorption presents a significant variability."
      explanation: >-
        Refutes a uniform corrective effect, which is why this treatment is
        recorded as variably rather than reliably effective.
  target_phenotypes:
  - preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
discussions:
- discussion_id: malabsorption_versus_intolerance
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines which lactose malabsorbers become symptomatic, given that
    malabsorption is near-universal in most of the world's populations and only a
    minority of malabsorbers report intolerance at everyday doses?
  attaches_to:
  - pathophysiology#Colonic Microbial Fermentation of Lactose
  - phenotypes#Abdominal Pain
  rationale: >-
    This is the gap that governs how the whole entry should be read. The
    pathograph runs cleanly from genotype to symptom, but the last step is not
    deterministic: in a randomised double-blind trial, adults who described
    themselves as severely intolerant and symptomatic on under 240 mL of milk had
    negligible symptoms on that dose, and no significant difference from
    lactose-hydrolysed milk. Colonic microbial composition, adaptation to
    continued intake, visceral sensitivity and expectancy have all been proposed,
    and the entry does not model any of them because none is established. Until
    it is, the causal edges into the phenotype nodes should be read as
    dose-conditional and population-averaged rather than obligate — which is also
    why the prevalence records here are explicit about measuring the trait rather
    than the syndrome.
  evidence:
  - reference: PMID:7776987
    reference_title: "A comparison of symptoms after the consumption of milk or lactose-hydrolyzed milk by people with self-reported severe lactose intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "People who identify themselves as severely lactose-intolerant may mistakenly attribute a variety of abdominal symptoms to lactose intolerance."
    explanation: >-
      States the mismatch between self-identified intolerance and measured
      response that defines this gap.
  - reference: PMID:7776987
    reference_title: "A comparison of symptoms after the consumption of milk or lactose-hydrolyzed milk by people with self-reported severe lactose intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the periods were compared, there were no statistically significant differences in the severity of these four gastrointestinal symptoms."
    explanation: >-
      The randomised crossover result itself: at this dose, symptom severity did
      not differ between milk and lactose-hydrolysed milk.

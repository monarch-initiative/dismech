  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  description: For documented symptomatic intolerance, reduce lactose to an individually tolerated amount, use lactose-free equivalents and consider smaller portions with meals. Complete dairy avoidance is usually unnecessary. Do not prescribe restriction solely for a non-persistence genotype or asymptomatic malabsorption.
  target_mechanisms:
  - target: Unhydrolysed Lactose Retained in the Intestinal Lumen
    treatment_effect: INHIBITS
    description: Reduces delivery of undigested lactose without restoring endogenous enzyme expression.
    evidence:
    - reference: PMID:33887513
      reference_title: 'Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: An appropriate intervention concerns the dietetic style, such as the consumption of lactose-free foods, but with nutritional characteristics comparable to dairy products.
      explanation: The review recommends nutritionally comparable low-lactose alternatives.

diagnosis:
- name: Clinical assessment and lactose withdrawal-rechallenge
  description: Establish a reproducible relationship between lactose intake and symptoms. Improvement on a supervised reduction and recurrence with reintroduction supports intolerance; asymptomatic non-persistence needs no symptom-directed treatment. Evaluate alarm signs and alternative diagnoses before attributing symptoms to lactose.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK532285/

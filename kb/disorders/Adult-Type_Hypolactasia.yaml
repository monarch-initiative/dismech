  - reference: PMID:11788828
    reference_title: "Identification of a variant associated with adult-type hypolactasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resulting from the physiological decline in activity of the lactase-phlorizin hydrolase (LPH) in intestinal cells after weaning"
    explanation: >-
      States the post-weaning decline in brush-border lactase activity that
      defines the phenotype.
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by a reduction or loss of the activity of the intestinal enzyme lactase-phlorizin hydrolase, responsible for the digestion of lactose."
    explanation: >-
      Confirms reduced lactase activity as the proximate cause of the clinical
      syndrome.
  downstream:
  - target: Unhydrolysed Lactose Retained in the Small-Bowel Lumen
    causal_link_type: DIRECT
- name: Unhydrolysed Lactose Retained in the Small-Bowel Lumen
  biological_scale: TISSUE
  conforms_to: "diet_induced_osmotic_diarrhea#Unabsorbed Dietary Solute Retention in the Intestinal Lumen"
  description: >-
    Lactose that is not hydrolysed cannot be absorbed, so it stays in the lumen
    as an osmotically active disaccharide. This is the rate-limiting,
    substrate-specific node shared with the other diet-induced osmotic
    diarrhoeas, and it is where dose-dependence enters: a small lactose load may
    be fully handled by residual enzyme, while a larger one saturates it.
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This alteration determines an increased osmotic load in the small intestine and the fermentation of lactose by the bacterial flora"
    explanation: >-
      Establishes luminal retention of lactose as an osmotic load and the
      substrate for colonic fermentation.
  downstream:
  - target: Osmotic Water Influx and Colonic Fermentation
    causal_link_type: DIRECT
- name: Osmotic Water Influx and Colonic Fermentation
  biological_scale: ORGANISM
  description: >-
    Retained lactose draws water into the small-bowel lumen, and what reaches the
    colon is fermented by the resident microbiota into short-chain fatty acids
    and gas (hydrogen, carbon dioxide, methane). The gas production is what makes
    the hydrogen breath test diagnostic. The two arms — osmotic water and
    fermentative gas — together generate the whole symptom complex, which is why
    symptoms are distension and flatulence as much as diarrhoea.
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which leads to a high production of short-chain fatty acids and gas. This is followed by the onset of abdominal pain, diarrhea, and flatulence."
    explanation: >-
      Directly links colonic fermentation of lactose to gas and short-chain
      fatty acid production and to the resulting symptoms.
  downstream:
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Flatulence
    causal_link_type: DIRECT
  - target: Abdominal Pain
    causal_link_type: DIRECT
  - target: Abdominal Distension
    causal_link_type: DIRECT

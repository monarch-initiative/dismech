      label: MCM6
  relationship_type: CAUSATIVE
  notes: The term locates cis-regulatory DNA affecting LCT, not a defect in MCM6 protein. C-13910-containing ancestral haplotypes are associated with non-persistence in studied populations; derived T-13910 supports persistence. The original linkage study used nine extended Finnish families and examined additional populations. The linked G/A-22018 marker is associated but is not automatically an independent functional variant. Rare congenital LCT coding variants cause a different condition.

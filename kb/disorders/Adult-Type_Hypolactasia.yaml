    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In lactase non-persistent individuals (CC), DNA modifications consistently increased with age across LCT and MCM6 (Fig. 4).
    explanation: Cross-sectional adult jejunal enterocyte observations support genotype-associated epigenetic aging; no longitudinal childhood trajectory was measured.
  - &id009

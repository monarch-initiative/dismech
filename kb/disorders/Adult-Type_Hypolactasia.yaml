  description: Genotyping provides evidence of inherited persistence/non-persistence predisposition in the relevant population. A C/T-13910-only test misses other persistence-associated alleles and does not diagnose current symptom intolerance or secondary mucosal deficiency. Quantitative enzyme activity can vary among heterozygotes and occasional genotype-phenotype discordance occurs.

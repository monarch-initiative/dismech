name: Adult-Type Hypolactasia
creation_date: '2026-09-04T02:40:00Z'
category: Metabolic Disorder
disease_term:
  preferred_term: lactose intolerance adult type
  term:
    id: MONDO:0006065
    label: lactose intolerance adult type
parents:
- Lactose Intolerance
description: 'Adult-type hypolactasia, or lactase non-persistence, is the common ancestral pattern of declining intestinal lactase activity after early childhood. Regulatory variation at the LCT-MCM6 locus contributes to whether lactase expression persists into adulthood, with different persistence-associated alleles in different populations. It is distinct from congenital LCT coding-variant deficiency and acquired mucosal injury. Reduced enzyme activity can allow ingested lactose to reach the colon, where osmotic effects and microbial fermentation may cause diarrhea, flatulence, bloating and pain. Lactase deficiency, lactose malabsorption and symptomatic lactose intolerance are related but distinct: many non-persistent individuals tolerate ordinary dietary amounts. Care is guided by symptoms, dietary tolerance and nutritional adequacy.'
synonyms:
- lactase non-persistence
- adult lactase deficiency
- hypolactasia, adult type
- disaccharide intolerance 3
- lactose intolerance, adult type
notes: This entry covers primary lactase non-persistence and its possible dietary intolerance, not congenital alactasia or secondary lactase deficiency. The MCM6 intronic annotations locate cis-regulatory DNA; they do not imply loss of MCM6 protein function. The familial recessive non-persistence versus dominant persistence shorthand does not make symptom expression a fully penetrant Mendelian trait. No worldwide percentage or disease-level symptom frequency is inferred from heterogeneous studies that conflate deficiency, malabsorption and intolerance. The retracted global meta-analysis PMID:28690131 is not used. The 2021 review's loosely labelled 57–65% intolerance range is neither relabelled as malabsorption nor converted to an invented midpoint. The broader Lactose Intolerance StatPearls chapter was reviewed despite the exact-disease lookup returning NO_CHAPTER; its imprecise prevalence and genotype generalizations are not imported. No matching deep-research report was found.
inheritance:
- name: Autosomal recessive lactase non-persistence
  description: Classical family studies describe recessive non-persistence, with dominant persistence. Enzyme activity is quantitative and symptoms additionally depend on diet and gastrointestinal physiology.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:11788828
    reference_title: Identification of a variant associated with adult-type hypolactasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Adult-type hypolactasia, also known as lactase non-persistence (lactose intolerance), is a common autosomal recessive condition
    explanation: Describes the classical inheritance of the enzyme phenotype, rather than fully penetrant symptomatic intolerance.
pathophysiology:
- name: LCT-MCM6 Regulatory Haplotypes
  biological_scale: MOLECULAR
  description: The ancestral C-13910 haplotype is associated with lactase non-persistence in the populations studied; derived T-13910 and other regionally distributed alleles favor persistence. The relevant MCM6 intronic sequence regulates LCT rather than disrupting MCM6 protein. In one Caco-2 assay both C and T sequences enhanced a rat lactase promoter, with a stronger effect for T. Association, reporter and regulatory-deletion data support this locus, but do not imply that a single SNP explains all populations.
  evidence:
  - &id006
    reference: PMID:11788828
    reference_title: Identification of a variant associated with adult-type hypolactasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: a DNA variant, C/T-13910, roughly 14 kb upstream from the LCT locus, completely associates with biochemically verified lactase non-persistence in Finnish families
    explanation: The original family study identifies an associated regulatory region; this is not a worldwide single-variant diagnostic rule.
  - &id012
    reference: PMID:12915462
    reference_title: 'Lactase persistence DNA variant enhances lactase promoter activity in vitro: functional role as a cis regulatory element.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The DNA region of the C/T_(13910) lactase persistence/non-persistence variant functions in vitro as a cis element capable of enhancing differential transcriptional activation of the lactase promoter.
    explanation: Caco-2 reporter constructs with a rat lactase promoter support differential cis-regulation, not a completely inactive ancestral enhancer.
  downstream:
  - target: Reduced Enterocyte LCT Transcription
    description: Regulatory haplotypes influence LCT transcription; reporter assays and human association support the bridge, while the complete developmental mechanism remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

prevalence:
- population: Worldwide, with substantial population variation
  prevalence_class: COMMON
  notes: Lactase non-persistence is common, but available genotype and enzyme-phenotype surveys are heterogeneous and do not estimate the prevalence of symptomatic intolerance. Geographic interpolation and reciprocal persistence frequencies are not converted into a global rate.
  evidence:
  - reference: PMID:12915462

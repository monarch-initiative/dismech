    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: The majority of the world's human population experiences a decline in production of the digestive enzyme lactase-phlorizin hydrolase during maturation.
    explanation: This background statement supports common non-persistence, without giving a symptom-prevalence estimate.
  - reference: PMID:20144208

    explanation: Mouse regulatory deletions demonstrate contributions from intragenic elements, distinct from human congenital coding deficiency.
progression:
- phase: Age-dependent enzyme decline
  notes: Primary non-persistence develops after early childhood with population and individual variation. It is not a lifelong enzyme absence from birth. Adult cross-sectional associations suggest that regulatory changes may continue after childhood, without establishing an individual longitudinal rate.
  evidence:
  - *id007

- name: Osmotic Water Influx and Luminal Distension
  biological_scale: TISSUE
  conforms_to: "diet_induced_osmotic_diarrhea#Osmotic Water Influx and Luminal Distension"
  description: >-
    Lactose retained in the small-bowel lumen is osmotically active, so water
    moves into the lumen down the osmotic gradient and the resulting volume
    distends the bowel. This is the arm that produces watery stool, and it is
    separated from the fermentative arm because the two have different
    consequences and respond differently to intervention: removing lactose
    removes both, but the gas-dominant complaints track fermentation
    specifically.
  biological_processes:
  - preferred_term: water transport into the intestinal lumen
    term:
      id: GO:0006833
      label: water transport
    modifier: INCREASED
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This alteration determines an increased osmotic load in the small intestine"
    explanation: >-
      Attributes an increased small-intestinal osmotic load to the unhydrolysed
      lactose, which is the driver of water influx.
  downstream:
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Abdominal Distension
    causal_link_type: DIRECT
- name: Colonic Microbial Fermentation of Lactose
  biological_scale: TISSUE
  conforms_to: "diet_induced_osmotic_diarrhea#Colonic Microbial Fermentation of the Malabsorbed Substrate"
  description: >-
    Lactose that reaches the colon is fermented by the resident microbiota into
    short-chain fatty acids and gas (hydrogen, carbon dioxide, methane). This is
    the arm that produces flatulence and much of the pain and distension, and
    the hydrogen it generates is what the breath test measures — so the principal
    diagnostic reads out this node rather than the enzymatic lesion itself.
  biological_processes:
  - preferred_term: lactose catabolic process by colonic microbiota
    term:
      id: GO:0005990
      label: lactose catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:33887513
    reference_title: "Lactose intolerance: An update on its pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the fermentation of lactose by the bacterial flora, which leads to a high production of short-chain fatty acids and gas. This is followed by the onset of abdominal pain, diarrhea, and flatulence."
    explanation: >-
      Directly links colonic bacterial fermentation of lactose to short-chain
      fatty acid and gas production and to the resulting symptoms.
  downstream:
  - target: Flatulence
    causal_link_type: DIRECT
  - target: Abdominal Pain
    causal_link_type: DIRECT
  - target: Abdominal Distension
    causal_link_type: DIRECT

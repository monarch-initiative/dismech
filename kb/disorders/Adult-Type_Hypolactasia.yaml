    explanation: The full results qualify the abstract association claim for these two candidate variants.
- name: LCT, the regulated lactase gene
  gene_term:
    preferred_term: LCT
    term:
      id: hgnc:6530
      label: LCT
  notes: LCT encodes the intestinal enzyme whose expression declines. Both intragenic and upstream regulatory elements contribute to expression. The early study's absence of coding/promoter association does not refute every possible LCT regulatory contribution or imply that LCT is mechanistically irrelevant.
  evidence:
  - reference: PMID:27159559

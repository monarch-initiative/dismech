    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These results suggest that most of the DNA methylation variation at the LCT enhancer is explained by the genotype at rs4988235 alone.
    explanation: In the selected pediatric biopsy cohort, genotype accounted for most enhancer methylation variation; this does not establish methylation as an independent cause of symptoms.
  downstream:
  - target: Reduced Enterocyte LCT Transcription
    description: Epigenetic repression is a proposed mediator of reduced LCT transcription, supported by intestinal associations but not targeted epigenetic editing.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27159559
      reference_title: Lactase nonpersistence is directed by DNA-variation-dependent epigenetic aging.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: Overall, our findings suggest that lactase non-persistence may be mediated by an age-related increase in DNA modifications at regulatory elements in MCM6 and LCT, while such elements are protected from epigenetic inactivation in lactase persistent individuals.
      explanation: The authors propose mediation; their human observations and DNA deletions do not directly test methylation causality.
- name: Reduced Enterocyte LCT Transcription
  biological_scale: MOLECULAR
  description: LCT transcript abundance is lower with non-persistence-associated regulation. Cross-sectional adult CC carriers show decreasing LCT mRNA with age. Differentiated Caco-2 deletion models and mouse intronic deletions independently demonstrate the importance of regulatory elements, with species, intestinal-segment and differentiation-stage limits.
  evidence:
  - reference: PMID:27159559
    reference_title: Lactase nonpersistence is directed by DNA-variation-dependent epigenetic aging.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In our cohort of 21–72-year-old individuals, we detected that LCT mRNA was significantly decreasing with age in the lactase non-persistent (CC) individuals
    explanation: The age association is cross-sectional within adults, not a longitudinal measurement from weaning.

  category: Neurologic
  diagnostic: true
  description: >-
    Myelin deposited in insufficient amount rather than laid down and then lost.
    This is the specific claim the entry's whole argument rests on, and it is
    bound separately from the general leukodystrophy term because the
    hypomyelinating-versus-demyelinating distinction is what places this
    disorder with the POLR3-related and PLP1 diseases rather than with
    metachromatic leukodystrophy or Krabbe disease.
  phenotype_term:

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two brothers born to consanguineous parents, we identified an unusual neurological disease that manifested with ataxia, psychomotor retardation, cerebellar and cerebral atrophy, and leukodystrophy.
    explanation: >-
      The founding clinical description, naming leukodystrophy alongside the
      atrophy and the motor and cognitive features.
  - reference: PMID:42271096
    reference_title: "A novel homozygous variant in the POLR1A gene: a complicated hereditary spastic paraplegia (c-HSP) or a hypomyelinating leukodystrophy type-27 (HLD27) phenotype?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings further expand the genetic and clinical spectrum of POLR1A-related disorders by identifying a novel variant and a distinct clinical manifestation characterized by a c-HSP-like phenotype, without apparent hypomyelination.

  description: >-
    Every confirmed patient is homozygous, and every family is consanguineous or
    shares ancestry. Heterozygous carriers, including the parents, are
    unaffected - which matters, because heterozygous POLR1A variants of a
    different class cause a dominant craniofacial disorder.

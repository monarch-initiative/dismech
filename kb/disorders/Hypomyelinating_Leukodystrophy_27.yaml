name: Hypomyelinating Leukodystrophy 27
creation_date: "2026-09-11T11:40:00Z"
category: Mendelian
synonyms:
- HLD27
- POLR1A-related leukodystrophy
- POLR1A-related hypomyelinating leukodystrophy
description: >-
  Hypomyelinating leukodystrophy 27 is an ultra-rare autosomal recessive
  childhood leukodystrophy caused by biallelic hypomorphic missense variants in
  POLR1A, which encodes RPA194, the catalytic subunit of RNA polymerase I. Pol I
  transcribes ribosomal DNA into the 47S pre-rRNA, the rate-limiting first step
  of ribosome biogenesis, so HLD27 is a ribosomopathy that happens to present as
  a white-matter disease.

  Reported patients show ataxia, psychomotor regression, and MRI hypomyelination
  with cerebellar and often cerebral atrophy, progressing to severe disability;
  one died at 16.5 years. The disease is defined by three homozygous alleles
  across a handful of consanguineous families, and the whole literature is
  three primary clinical reports.

  Two points of nosology are worth stating up front, because both are easy to
  get wrong.

  First, HLD27 is not a POLR3-related leukodystrophy. dismech's existing
  POLR-Related_Leukodystrophy entry covers RNA polymerase III (POLR3A, POLR3B),
  which transcribes tRNAs and 5S rRNA. This is polymerase I, which transcribes
  the rDNA repeat. MONDO's "POLR-related leukodystrophy" parent groups them by
  name; the enzymes and their substrates are different, so the mechanism
  upstream of the shared hypomyelination is not shared. Only the downstream
  oligodendrocyte and myelin nodes are, which is why the conformance here is to
  the cns_myelin_failure module rather than to the POLR3 entry.

  Second, POLR1A is also the gene for acrofacial dysostosis, Cincinnati type, a
  dominant craniofacial disorder with no leukodystrophy, which dismech already
  carries. Same gene, opposite inheritance, non-overlapping phenotype. The
  founding HLD27 report notes explicitly that the mandibulofacial syndrome was
  absent in their family. Treat the two as an allelic series, not as a spectrum.

  The mechanism below is honestly uneven, and the entry marks where. Reduced
  rRNA transcription with aberrant rRNA processing, abnormal protein homeostasis
  and ER stress are demonstrated in patient fibroblasts. The nucleolar
  phase-separation collapse and the p53 step are inferred from Pol I model
  systems and general ribosomopathy biology, and neither has been shown in HLD27
  CNS tissue. So is the selective vulnerability of oligodendrocytes, which is
  the step that actually explains why a defect in a housekeeping enzyme produces
  a white-matter disease.

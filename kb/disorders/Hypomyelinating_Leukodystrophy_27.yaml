    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings provide the first report showing a complex leukodystrophy associated with POLR1A.
    explanation: >-
      Establishes POLR1A as the causal gene for this leukodystrophy.
  - reference: PMID:36917474
    reference_title: A homozygous POLR1A variant causes leukodystrophy and affects protein homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this
      report, we describe another missense variant POLR1A NM_015425.3:c.1925C>A;
      p.(Thr642Asn) in homozygosity in two unrelated patients.
    explanation: >-
      The second allele, in two unrelated patients, which is what made the
      gene-disease relationship more than a single-family observation.
  - reference: PMID:42271096
    reference_title: "A novel homozygous variant in the POLR1A gene: a complicated hereditary spastic paraplegia (c-HSP) or a hypomyelinating leukodystrophy type-27 (HLD27) phenotype?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing (WES) identified a novel homozygous variant in the proband, NM_015425.6:c.2357C > T POLR1A:p.(Thr786Ile). This variant co-segregated with the disease status within the family.
    explanation: >-
      The third allele with family segregation.
  - reference: PMID:37639467
    reference_title: rRNA transcription is integral to phase separation and maintenance of nucleolar structure.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that homozygous null mutations in Pol I subunits required for rRNA transcription and ribosome biogenesis lead to preimplantation lethality.
    explanation: >-
      Supports reading the human alleles as hypomorphic rather than null.
      Indirect: the inference is that a viable patient cannot carry complete
      loss of function, which follows from the mouse result rather than being
      measured in patients.
- name: Reduced rDNA Transcription and Aberrant rRNA Processing
  biological_scale: MOLECULAR
  description: >-
    Less 47S pre-rRNA is made, and what is made is processed and degraded
    abnormally. This is the step with direct patient-derived evidence, from
    fibroblasts of the patient who died at 16.5 years.

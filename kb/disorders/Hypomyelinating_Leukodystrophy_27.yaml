pathophysiology:
- name: Biallelic Hypomorphic POLR1A Missense Variants
  biological_scale: MOLECULAR
  conforms_to: "cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult"
  description: >-
    Three homozygous missense alleles are known - p.(Ser934Leu), p.(Thr642Asn)
    and p.(Thr786Ile) - and all three sit in the catalytic core of RPA194,
    between the RRN3-binding region and the bridging helix. The alleles are
    hypomorphic rather than null, and that is not a curatorial hedge: complete
    Pol I loss is preimplantation-lethal in mouse, so a surviving patient
    necessarily retains partial activity.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION

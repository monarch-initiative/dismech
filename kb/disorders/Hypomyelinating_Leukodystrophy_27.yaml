  downstream:
  - target: Nucleolar Stress and Disturbed Nucleolar Structure
    causal_link_type: DIRECT
  - target: Reduced Ribosome Biogenesis and Translational Capacity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36917474
    reference_title: A homozygous POLR1A variant causes leukodystrophy and affects protein homeostasis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Extensive in vitro
      experiments in fibroblasts from Patient 1 documented that the mutated POLR1A led
      to aberrant rRNA processing and degradation, and abnormal nucleolar homeostasis.
    explanation: >-
      The patient-derived demonstration of the rRNA defect and of disturbed
      nucleolar homeostasis.
- name: Nucleolar Stress and Disturbed Nucleolar Structure
  biological_scale: CELLULAR
  description: >-
    Loss of rRNA transcription removes what holds the nucleolus together as a
    phase-separated compartment. Ribosomal proteins no longer consumed in
    assembly become free to bind MDM2, which stops MDM2 degrading p53, so p53
    accumulates. This is the classic nucleolar-stress checkpoint.

    It is also the weakest-evidenced step in this entry. Abnormal nucleolar
    homeostasis is documented in patient fibroblasts; the phase-separation and
    p53 mechanism is transferred from Pol I knockouts, from POLR1A silencing in
    cancer cell lines, and from the craniofacial ribosomopathy literature. No
    p53 measurement has been reported in an HLD27 patient sample.
  downstream:
  - target: p53 Stabilization
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21399665
    reference_title: The balance between rRNA and ribosomal protein synthesis up- and downregulates the tumour suppressor p53 in mammalian cells.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We found that a downregulation of rRNA synthesis, induced by silencing the POLR1A gene coding for the RNA polymerase I catalytic subunit, stabilised p53 without altering the nucleolar integrity in human cancer cells.
    explanation: >-
      The most on-target experiment available for this step: POLR1A itself is
      the gene silenced. Indirect because the system is a human cancer cell
      line rather than a patient cell or neural tissue - and note the result
      complicates the story, since p53 stabilised without nucleolar disruption,
      so the two halves of this node are separable.
  - reference: PMID:21399665
    reference_title: The balance between rRNA and ribosomal protein synthesis up- and downregulates the tumour suppressor p53 in mammalian cells.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      p53 stabilisation was due to the inactivation of the MDM2-mediated p53 degradation by the binding of ribosomal proteins no longer used for ribosome building.
    explanation: >-
      Names the MDM2 mechanism. Indirect for the same reason.
  - reference: PMID:37639467
    reference_title: rRNA transcription is integral to phase separation and maintenance of nucleolar structure.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We find that when Pol I function and rRNA transcription is inhibited, the viscosity of the granular compartment of the nucleolus increases, which disrupts its phase separation properties, leading to a single condensed nucleolus.
    explanation: >-
      The structural half of the node. Indirect: mouse embryos and hiPSCs
      carrying Pol I subunit nulls, not HLD27 alleles.
- name: p53 Stabilization
  biological_scale: MOLECULAR
  description: >-
    Ribosomal proteins no longer consumed in assembly bind MDM2, which stops
    MDM2 ubiquitinating p53, so p53 accumulates. Split from the apoptosis node
    below because the two sit at different scales and, more importantly, because
    the most on-target experiment available shows them to be separable: silencing
    POLR1A stabilised p53 without altering nucleolar integrity.
  biological_processes:
  - preferred_term: protein stabilization
    modifier: INCREASED
    term:
      id: GO:0050821
      label: protein stabilization
  downstream:
  - target: Apoptosis of Translation-Dependent Progenitors
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21399665
    reference_title: The balance between rRNA and ribosomal protein synthesis up- and downregulates the tumour suppressor p53 in mammalian cells.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      p53 stabilisation was due to the inactivation of the MDM2-mediated p53 degradation by the binding of ribosomal proteins no longer used for ribosome building.
    explanation: >-
      The MDM2 mechanism, in the one experiment where POLR1A itself is the gene
      silenced. Indirect: a human cancer cell line, not patient or neural tissue.
- name: Apoptosis of Translation-Dependent Progenitors
  biological_scale: CELLULAR
  description: >-
    Stabilised p53 drives cell-cycle arrest and apoptosis, and the cells that
    pay are those with the highest demand for new ribosomes. In the zebrafish
    polr1a null this is neuroepithelium and neural crest; the transfer to human
    oligodendrocyte lineage is an inference, and the entry records it as one.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  cell_types:
  - preferred_term: oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
  downstream:
  - target: Deficient CNS Myelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from progenitor apoptosis to hypomyelination has not been shown
      in HLD27 tissue; the intermediates are unknown.
  evidence:
  - reference: PMID:29750247
    reference_title: tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In a zebrafish model of Acrofacial Dysostosis-Cincinnati type, we demonstrate that polr1a-/- mutants exhibit deficient 47S rRNA transcription, reduced monosomes and polysomes and, consequently, defects in protein translation. This results in Tp53-dependent neuroepithelial apoptosis, diminished neural crest cell proliferation and cranioskeletal anomalies.
    explanation: >-
      The clearest demonstration that polr1a loss causes Tp53-dependent
      apoptosis. Indirect twice over: it is a zebrafish null, and it models the
      dominant craniofacial disorder rather than the recessive leukodystrophy.
  - reference: PMID:29750247
    reference_title: tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tp53 inhibition suppresses neuroepithelial apoptosis and partially ameliorates the polr1a mutant phenotype. However, complete rescue of cartilage development is not observed due to the failure to improve rDNA transcription and neural crest cell proliferation.
    explanation: >-
      Tests the p53 step by removing it, and finds it accounts for only part of
      the phenotype - which is why this node is not drawn as the sole route to
      the clinical picture.
- name: Reduced Ribosome Biogenesis and Translational Capacity
  biological_scale: CELLULAR
  description: >-
    Fewer ribosomes means less translational capacity, and in patient
    fibroblasts this shows up as abnormal protein homeostasis with an ER stress
    response. This branch runs in parallel with the p53 branch rather than
    through it.
  biological_processes:
  - preferred_term: ribosome biogenesis
    modifier: DECREASED
    term:
      id: GO:0042254
      label: ribosome biogenesis
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  downstream:
  - target: Deficient CNS Myelination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Myelinating oligodendrocytes have an exceptional demand for new protein,
      so reduced translational capacity is the plausible route to
      hypomyelination. The intermediate steps in oligodendrocyte biology are
      known in outline but have not been shown for this disease.
  evidence:
  - reference: PMID:36917474
    reference_title: A homozygous POLR1A variant causes leukodystrophy and affects protein homeostasis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Proteomics data analyses and further in vitro experiments documented abnormal
      protein homeostasis, and endoplasmic reticulum stress responses.
    explanation: >-
      The proteostasis and ER-stress findings in patient fibroblasts, which is
      what this node asserts.
  - reference: PMID:29750247
    reference_title: tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      polr1a-/- mutants exhibit deficient 47S rRNA transcription, reduced monosomes and polysomes and, consequently, defects in protein translation
    explanation: >-
      Connects reduced Pol I activity to a measured translational deficit.
      Indirect: zebrafish null.
- name: Deficient CNS Myelination
  biological_scale: TISSUE
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"
  description: >-
    Myelin is laid down in insufficient amount rather than formed and then
    destroyed, which is what makes this a hypomyelinating rather than a
    demyelinating leukodystrophy. It is the shared endpoint with the other
    hypomyelinating leukodystrophies and the reason this entry conforms to the
    cns_myelin_failure module - the convergence is real even though the upstream
    lesion is not shared with POLR3-related disease.
  cell_types:

diagnosis:
- name: Whole-exome sequencing
  description: >-
    All five families were solved by exome sequencing, in two cases after the
    clinical picture had pointed somewhere else entirely. Given that one proband
    was worked up as complicated hereditary spastic paraplegia, a targeted
    leukodystrophy panel would not reliably find this gene.
  results: >-
    A homozygous POLR1A missense variant in the catalytic core of RPA194,
    segregating with disease.
  evidence:
  - reference: PMID:42271096
    reference_title: "A novel homozygous variant in the POLR1A gene: a complicated hereditary spastic paraplegia (c-HSP) or a hypomyelinating leukodystrophy type-27 (HLD27) phenotype?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings underscore the critical importance of WES in the diagnosis of complicated disorders, particularly in patients with atypical or difficult-to-interpret clinical presentations.
    explanation: >-
      The authors' own conclusion about the diagnostic route, drawn from a case
      that presented atypically.
- name: Brain MRI
  description: >-
    The imaging signature is diffuse hypomyelination with cerebellar and often
    cerebral atrophy. A normal-appearing white matter does not exclude the
    diagnosis: the fifth proband had no apparent hypomyelination at
    presentation.
  results: >-
    Hypomyelinating leukodystrophy with cerebellar atrophy; in one patient also
    globus pallidus hypointensity with small basal ganglia.
  evidence:
  - reference: PMID:36917474
    reference_title: A homozygous POLR1A variant causes leukodystrophy and affects protein homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients manifested
      neurological deficits, with brain MRIs showing hypomyelinating leukodystrophy
      and cerebellar atrophy
    explanation: >-
      The MRI findings this recommendation is based on.
- name: Patient fibroblast studies of rRNA and nucleolar function
  description: >-
    Not a routine diagnostic test, but the assay that established the mechanism
    and that would be needed to call a novel POLR1A missense variant
    functionally hypomorphic. Reduced nucleolar RPA194 by immunostaining
    distinguished affected brothers from an unaffected homozygous sibling in the
    founding family.
  results: >-
    Decreased nucleolar RPA194; aberrant rRNA processing and degradation;
    abnormal nucleolar homeostasis; abnormal protein homeostasis with ER stress.
  evidence:
  - reference: PMID:28051070
    reference_title: Severe neurodegenerative disease in brothers with homozygous mutation in POLR1A.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Decreased nucleolar RPA194 was observed in the skin fibroblasts of only the affected brothers
    explanation: >-
      The functional readout, and the "only the affected brothers" contrast that
      makes it informative rather than merely descriptive.
differential_diagnoses:
- name: POLR-related leukodystrophy (POLR3-associated)
  description: >-
    The disorder HLD27 is most likely to be filed under by mistake, because
    MONDO groups both beneath a "POLR-related leukodystrophy" parent and the
    names are nearly identical. The enzymes are not. POLR3A and POLR3B are
    subunits of RNA polymerase III, which transcribes tRNAs and 5S rRNA; POLR1A
    is polymerase I, which transcribes the rDNA repeat into 47S pre-rRNA. The
    founding HLD27 report places the two side by side and notes the POLR3
    disorders begin later. Note that dismech's entry under this MONDO term is
    the POLR3 one (POLR3A, POLR3B); the term itself is a parent that
    nominally spans both polymerases, which is the source of the confusion
    this differential exists to head off.
  disease_term:
    preferred_term: POLR-related leukodystrophy
    term:
      id: MONDO:0100605
      label: POLR-related leukodystrophy
  distinguishing_features:
  - RNA polymerase III rather than polymerase I
  - Later onset than the POLR1A disease
  - Hypodontia and hypogonadotropic hypogonadism in the classic 4H phenotype
  evidence:
  - reference: PMID:28051070
    reference_title: Severe neurodegenerative disease in brothers with homozygous mutation in POLR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants in three other RNA polymerase subunits, POLR1C, POLR3A and POLR3B, are known to cause recessive leukodystrophy similar to the disease afflicting the present family but with a later onset.
    explanation: >-
      Names the polymerase III disorders as the clinical neighbours and gives
      the onset difference that separates them.
- name: Acrofacial dysostosis, Cincinnati type
  description: >-
    Not a clinical differential - nobody would confuse a craniofacial dysostosis
    with a leukodystrophy - but a genetic one, and the more dangerous for it. It
    is the same gene, and it dominates the POLR1A entries in variant databases.
    A heterozygous POLR1A missense finding is far more likely to be about this
    disorder than about HLD27.
  disease_term:
    preferred_term: acrofacial dysostosis Cincinnati type
    term:
      id: MONDO:0014651
      label: acrofacial dysostosis Cincinnati type
  distinguishing_features:
  - Heterozygous dominant rather than biallelic recessive
  - Mandibulofacial dysostosis with limb anomalies
  - No leukodystrophy
  evidence:
  - reference: PMID:28051070
    reference_title: Severe neurodegenerative disease in brothers with homozygous mutation in POLR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of those, POLR1C is also implicated in a mandibulofacial dysostosis syndrome without leukodystrophy as POLR1A is. This syndrome is absent in the family we present.
    explanation: >-
      States that the allelic craniofacial syndrome was absent in the
      leukodystrophy family.
- name: Complicated hereditary spastic paraplegia
  description: >-
    Included because a reported patient was investigated as c-HSP before exome
    sequencing found POLR1A. This is a differential in the practical direction
    that matters: not "could this leukodystrophy be HSP" but "could this HSP be
    POLR1A".
  disease_term:
    preferred_term: hereditary spastic paraplegia
    term:
      id: MONDO:0019064
      label: hereditary spastic paraplegia
  distinguishing_features:
  - Hypomyelination on MRI, which may be absent early in POLR1A disease
  - Cerebellar atrophy
  - Biallelic POLR1A variants on exome sequencing
  evidence:
  - reference: PMID:42271096
    reference_title: "A novel homozygous variant in the POLR1A gene: a complicated hereditary spastic paraplegia (c-HSP) or a hypomyelinating leukodystrophy type-27 (HLD27) phenotype?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, our findings raise the possibility that POLR1A variants may be related to HSP-like phenotypes.
    explanation: >-
      The authors' proposal that POLR1A belongs on the HSP differential, which
      is the direction this entry records.
animal_models:
- name: polr1a null zebrafish
  species: Zebrafish
  genotype: polr1a homozygous null
  publication: PMID:29750247
  description: >-
    The only in vivo model with mechanistic depth for this gene, and it was made
    for the other POLR1A disorder. It supplies the p53 step and the translational
    deficit; it cannot supply the leukodystrophy, which it does not have.
  modeled_mechanisms:
  - target: Apoptosis of Translation-Dependent Progenitors
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Deficient 47S rRNA transcription leads to Tp53-dependent neuroepithelial
      apoptosis, and genetic tp53 inhibition partially reverses the phenotype.
    limitations: >-
      A homozygous null modelling a dominant craniofacial disorder, used here to
      support a step in a recessive hypomorphic leukodystrophy. The cells that
      die are neuroepithelium and neural crest, not oligodendrocyte lineage, and
      the animal has no white-matter phenotype. The rescue is also only partial,
      so p53 is not the whole mechanism even in the model.
    readouts:
    - name: Neuroepithelial apoptosis
      target: Apoptosis of Translation-Dependent Progenitors
      direction: INCREASED
      interpretation: >-
        Apoptosis of translation-dependent progenitors as the cellular readout
        of nucleolar stress.
      evidence:
      - reference: PMID:29750247
        reference_title: tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          This results in Tp53-dependent neuroepithelial apoptosis, diminished neural crest cell proliferation and cranioskeletal anomalies.
        explanation: >-
          The apoptosis measurement behind this readout.
    - name: Apoptosis after genetic tp53 inhibition
      target: Apoptosis of Translation-Dependent Progenitors
      direction: RESTORED
      interpretation: >-
        The rescue arm. Removing tp53 suppresses the apoptosis, which is what
        makes the p53 step causal in this model rather than correlated.
      evidence:
      - reference: PMID:29750247
        reference_title: tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Tp53 inhibition suppresses neuroepithelial apoptosis and partially ameliorates the polr1a mutant phenotype.
        explanation: >-
          The rescue result, including the word "partially", which is the part
          that limits the claim.
    evidence:
    - reference: PMID:29750247
      reference_title: tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This indicates that POLR1A is critical for rRNA transcription, which is considered a rate limiting step in ribosome biogenesis, underpinning its requirement for neuroepithelial cell and neural crest cell proliferation and survival.
      explanation: >-
        The authors' summary of what the model establishes about POLR1A, which
        is why it is treated as informative for this node.
  - target: Deficient CNS Myelination
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The zebrafish polr1a null produces cranioskeletal anomalies, not a
      leukodystrophy. Recorded explicitly because the absence is informative: no
      available model reproduces the defining feature of this disease.
    limitations: >-
      The published phenotype is craniofacial and neuroepithelial. No myelin or
      white-matter phenotype is reported, and a homozygous null is in any case
      the wrong lesion for a hypomorphic recessive disorder - Pol I nulls are
      preimplantation-lethal in mouse, so the surviving human patients cannot be
      modelled by one.
    evidence:
    - reference: PMID:29750247
      reference_title: tp53-dependent and independent signaling underlies the pathogenesis and possible prevention of Acrofacial Dysostosis-Cincinnati type.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This results in Tp53-dependent neuroepithelial apoptosis, diminished neural crest cell proliferation and cranioskeletal anomalies.
      explanation: >-
        The reported phenotype is cranioskeletal. Cited here as the record of
        what the model does produce, against which the absence of a myelin
        phenotype is the negative claim.
    - reference: PMID:37639467
      reference_title: rRNA transcription is integral to phase separation and maintenance of nucleolar structure.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we show that homozygous null mutations in Pol I subunits required for rRNA transcription and ribosome biogenesis lead to preimplantation lethality.
      explanation: >-
        Explains why no mammalian null model of this disease exists, and so why
        the modelling gap is structural rather than an oversight.
discussions:
- discussion_id: gap_hld27_oligodendrocyte_selective_vulnerability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a partial defect in a universally required housekeeping enzyme
    produce a disease of myelin, and what makes the oligodendrocyte lineage the
    cell that fails first?
  attaches_to:
  - pathophysiology#Reduced Ribosome Biogenesis and Translational Capacity
  - pathophysiology#Deficient CNS Myelination
  - pathophysiology#Apoptosis of Translation-Dependent Progenitors
  rationale: >-
    Every cell needs ribosomes, yet HLD27 presents as a leukodystrophy. The
    standing explanation is translational demand: a myelinating oligodendrocyte
    synthesises an enormous amount of membrane and protein in a short window, so
    it is the first to feel a ceiling on ribosome supply. That is plausible and
    it is the same argument used across the ribosomopathies, but for this
    disease it is entirely untested. Every mechanistic experiment reported has
    been in fibroblasts, cancer cell lines, or zebrafish neuroepithelium and
    neural crest - never in oligodendrocyte lineage. The argument is also
    weakened by the comparison the field itself invites: the same gene, in the
    dominant state, produces a craniofacial disorder in which the vulnerable
    cell is neural crest and there is no white-matter disease at all. Something
    other than raw translational demand is selecting the affected tissue, and
    what that is has not been addressed. Patient-derived iPSC oligodendrocyte
    differentiation carrying the reported alleles is the obvious first
    experiment and has not been reported.
- discussion_id: mismatch_hld27_no_model_of_the_defining_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the zebrafish polr1a null tell us anything about HLD27, given that it
    is a null modelling a dominant craniofacial disorder and has no
    leukodystrophy?
  attaches_to:
  - animal_models#polr1a null zebrafish
  - pathophysiology#Apoptosis of Translation-Dependent Progenitors
  - pathophysiology#Deficient CNS Myelination
  rationale: >-
    This is a mismatch rather than a gap because good model evidence exists and
    is being asked to carry a claim it was not built for. The zebrafish is a
    homozygous null; HLD27 alleles are hypomorphic missense, and they must be,
    because Pol I nulls die before implantation in mouse. The model was made for
    acrofacial dysostosis, Cincinnati type, and its phenotype is cranioskeletal.
    So the p53 and translation steps in this entry are supported by an
    experiment in the wrong lesion, in the wrong tissue, for the wrong
    POLR1A disorder - and the step those steps are supposed to explain, the
    hypomyelination, is the one the model does not show. That failure is recorded
    as a FAILS_TO_RECAPITULATE link rather than left out. A knock-in of
    p.(Ser934Leu) or p.(Thr642Asn) in homozygosity, in an animal with myelin,
    is what the mechanism needs.
  proposed_experiments:
  - experiment_id: exp_hld27_hypomorphic_knockin_myelin_phenotype
    name: Homozygous hypomorphic Polr1a knock-in mouse
    description: >-
      Knock in one of the reported human missense alleles at the orthologous
      murine residue, breed to homozygosity, and phenotype white matter, myelin
      protein content and oligodendrocyte lineage progression through
      development - rather than using a null, which is preimplantation-lethal.
    would_support:
    - pathophysiology#Deficient CNS Myelination
    - pathophysiology#Reduced Ribosome Biogenesis and Translational Capacity
    supporting_outcome:
    - >-
      Homozygous knock-in animals survive and develop reduced myelin with an
      arrest or loss in the oligodendrocyte lineage, reproducing the human
      hypomyelinating phenotype that no current model shows.
    refuting_outcome:
    - >-
      Homozygous knock-in animals have normal myelination despite reduced rRNA
      transcription, which would move the explanation for the white-matter
      phenotype away from translational capacity and toward something specific
      to human oligodendrocyte biology or to a modifier.
  - experiment_id: exp_hld27_patient_ipsc_oligodendrocyte_differentiation
    name: Patient-derived iPSC oligodendrocyte differentiation
    description: >-
      Differentiate iPSCs from reported patients, and isogenic corrected
      controls, along the oligodendrocyte lineage, measuring rRNA transcription,
      translational output, p53 stabilisation and myelin protein synthesis at
      each stage against a parallel neuronal differentiation.
    would_support:
    - pathophysiology#Reduced Ribosome Biogenesis and Translational Capacity
    would_refute:
    - pathophysiology#Apoptosis of Translation-Dependent Progenitors
    supporting_outcome:
    - >-
      Oligodendrocyte-lineage cells show a larger translational deficit and
      greater loss than neurons from the same donor, supporting differential
      translational demand as the reason the white matter fails first.
    refuting_outcome:
    - >-
      Oligodendrocyte and neuronal lineages are affected equally, or p53 is not
      stabilised in either, which would place the selective vulnerability
      outside the p53 nucleolar-stress route this entry currently draws.
- discussion_id: gap_hld27_p53_inhibition_therapeutic_lead
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Genetic tp53 inhibition partially rescues the zebrafish polr1a phenotype.
    Is dampening the nucleolar-stress response a plausible therapeutic direction
    in HLD27, or does the partial nature of that rescue rule it out?
  attaches_to:
  - pathophysiology#p53 Stabilization
  - pathophysiology#Apoptosis of Translation-Dependent Progenitors
  - treatments#
  rationale: >-
    This is the only intervention lead the POLR1A literature offers, and it is
    worth recording precisely because it is weaker than it first looks. In the
    zebrafish, removing tp53 suppresses the neuroepithelial apoptosis and
    partially ameliorates the phenotype - but the rescue is explicitly partial,
    and the authors attribute the shortfall to a failure to improve rDNA
    transcription and progenitor proliferation, which p53 inhibition cannot
    touch. So even in the model, p53 accounts for only part of the disease.

    Three further things would have to be true before this is a direction rather
    than an observation. The rescue would have to hold for a myelin phenotype,
    which the zebrafish does not have. It would have to hold for a hypomorphic
    genotype rather than a null. And transient p53 dampening during a
    developmental window would have to be separable from the oncogenic risk of
    suppressing a tumour suppressor in a child. None of the three has been
    addressed. The entry records the lead here rather than as a treatment,
    because there is no treatment.
notes: >-
  Three things about this entry.

  The evidence is deliberately uneven and marked as such. The upstream steps -
  reduced rRNA transcription, aberrant rRNA processing, abnormal protein
  homeostasis and ER stress - are demonstrated in patient fibroblasts and carry
  IN_VITRO evidence with no directness qualifier. The nucleolar phase-separation
  and p53 steps carry directness: INDIRECT throughout, because every experiment
  supporting them was done in a Pol I null, a cancer cell line, or zebrafish
  neural crest. The gap between those two tiers is the substance of the
  knowledge-gap discussion, and flattening it would misrepresent what is known
  about this disease.

  The conformance target is cns_myelin_failure, not the POLR3 entry. Sharing an
  endpoint is not sharing a mechanism, and RNA polymerase I and RNA polymerase
  III transcribe different things. Only the oligodendrocyte and myelin-sheath
  nodes are genuinely common, and those are exactly the two nodes the module
  supplies.

  On the term bindings: several HPO CURIEs suggested by the deep-research report
  named the wrong concept. HP:0002500 was offered as "Leukodystrophy" but is
  Abnormal cerebral white matter morphology; HP:0002451 was offered as "Basal
  ganglia abnormality" but is Limb dystonia. Every term in this entry was read
  out of cache/hp/terms.csv or resolved with runoak rather than taken from a
  suggestion. That applies to review suggestions too: HP:0007266, proposed in
  review as "CNS hypomyelination", resolves to Cerebral dysmyelination, which
  is a different concept - dysmyelination is abnormal myelin composition,
  hypomyelination is insufficient deposition, and the distinction is the
  entry's central claim. The term bound here is HP:0003429.

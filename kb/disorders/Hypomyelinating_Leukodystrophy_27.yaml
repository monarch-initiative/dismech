genetic:
- name: POLR1A
  association: Causal biallelic variant
  gene_term:
    preferred_term: POLR1A
    term:
      id: hgnc:17264
      label: POLR1A
  frequency: The only gene associated with HLD27.
  notes: >-
    Three homozygous missense alleles are reported: p.(Ser934Leu),
    p.(Thr642Asn) and p.(Thr786Ile). All lie in the catalytic core of RPA194.

    The allelic relationship with acrofacial dysostosis, Cincinnati type is the
    thing to understand about this gene. That disorder is dominant,
    craniofacial, and carries no leukodystrophy; this one is recessive,
    neurological, and carries no mandibulofacial dysostosis. The founding HLD27
    report states outright that the mandibulofacial syndrome was absent in their
    family. A POLR1A variant therefore cannot be interpreted without its
    zygosity and its position, and a laboratory reporting "POLR1A pathogenic"
    against a ClinVar record dominated by the dominant phenotype is not
    answering the question a leukodystrophy referral asks.
  evidence:
  - reference: PMID:28051070
    reference_title: Severe neurodegenerative disease in brothers with homozygous mutation in POLR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although in silico analysis, histopathologic evidence and functional verification indicated that both variants were deleterious, segregation with the patient phenotype established that the POLR1A defect underlies the disease, as a clinically unaffected sister also was homozygous for the OSBPL11 variant.
    explanation: >-
      Worth quoting in full because it is how the gene was assigned: the family
      carried a second homozygous candidate in OSBPL11, and it was an unaffected
      homozygous sister who excluded it. The gene-disease relationship rests on
      that segregation, not on the variant's predicted deleteriousness.
  - reference: PMID:28051070
    reference_title: Severe neurodegenerative disease in brothers with homozygous mutation in POLR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of those, POLR1C is also implicated in a mandibulofacial dysostosis syndrome without leukodystrophy as POLR1A is. This syndrome is absent in the family we present.
    explanation: >-
      The authors' own statement that the craniofacial allelic disorder was not
      present in their leukodystrophy family - the basis for treating the two as
      separate entities rather than a spectrum.
  - reference: PMID:42271096
    reference_title: "A novel homozygous variant in the POLR1A gene: a complicated hereditary spastic paraplegia (c-HSP) or a hypomyelinating leukodystrophy type-27 (HLD27) phenotype?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The systematic review identified a total of 27 variants in the POLR1A gene, three of which were linked to HLD27.
    explanation: >-
      Puts the HLD27 allelic spectrum in proportion against POLR1A variation as
      a whole - 3 of 27 reported variants.

pathophysiology:
- name: ALG3 Alpha-1,3-Mannosyltransferase Deficiency
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect"
  description: >-
    ALG3 is the endoplasmic reticulum alpha-1,3-mannosyltransferase (historically
    mannosyltransferase VI) that transfers the sixth mannose residue onto the
    growing lipid-linked oligosaccharide on the luminal face of the ER. Biallelic
    loss of function stalls assembly at that exact step, which is the
    organ-specific substitution this entry makes against the conserved CDG
    module: the module's generic assembly defect is here a single, positionally
    defined missing sugar.
  genes:
  - preferred_term: ALG3
    term:
      id: hgnc:23056
      label: ALG3
  molecular_functions:
  - preferred_term: alpha-1,3-mannosyltransferase activity
    term:
      id: GO:0000033
      label: alpha-1,3-mannosyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:23791010
    reference_title: "ALG3-CDG (CDG-Id): clinical, biochemical and molecular findings in two siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALG3-CDG (CDG-Id), due to a defect in endoplasmic reticulum (ER) mannosyltransferase VI, is one of the less common types of CDG-I."
    explanation: >-
      Identifies the specific ER mannosyltransferase step and places the disorder
      within the CDG type I group.
  downstream:
  - target: Truncated Man5GlcNAc2 Lipid-Linked Precursor
    description: >-
      Blocking the sixth mannose transfer leaves the precursor arrested at
      Man5GlcNAc2.
- name: Truncated Man5GlcNAc2 Lipid-Linked Precursor
  biological_scale: MOLECULAR
  description: >-
    The lipid-linked oligosaccharide cannot be extended beyond Man5GlcNAc2. What
    is transferred onto nascent proteins is therefore a short, wrong-shaped
    glycan rather than no glycan at all. The downstream N-glycan profile shows
    combined deficiency of hybrid glycans and of extension beyond Man5GlcNAc2,
    and that specific combination is reported to be unique to ALG3-CDG, making
    the biochemistry diagnostic rather than merely confirmatory.
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:33583022
    reference_title: "Expanding the phenotype, genotype and biochemical knowledge of ALG3-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "N-glycan analyses of these individuals showed combined deficiencies of hybrid glycans and glycan extension beyond Man5 GlcNAc2 consistent with their truncated lipid-linked precursor oligosaccharides."
    explanation: >-
      Directly links the enzymatic block to the truncated precursor and the
      resulting N-glycan profile in patients.
  - reference: PMID:33583022
    reference_title: "Expanding the phenotype, genotype and biochemical knowledge of ALG3-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This spectrum of N-glycan changes is unique to ALG3-CDG."
    explanation: >-
      Establishes the diagnostic specificity of the glycan signature, which
      distinguishes ALG3-CDG from other CDG within the same module.
  downstream:
  - target: Protein Hypoglycosylation
    description: >-
      Transfer of a truncated glycan onto nascent glycoproteins yields
      abnormally glycosylated mature protein.
- name: Protein Hypoglycosylation
  biological_scale: CELLULAR
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  - preferred_term: protein O-linked glycosylation
    term:
      id: GO:0006493
      label: protein O-linked glycosylation
    modifier: DECREASED
  description: >-
    Nascent glycoproteins receive abnormal or absent N-glycans, detectable
    clinically as a type 1 transferrin isoelectric focusing pattern. From this
    node ALG3-CDG rejoins the conserved CDG pathway without substitution: the
    consequences are those of any hypoglycosylation state.
  evidence:
  - reference: PMID:34090370
    reference_title: "ALG3-CDG: a patient with novel variants and review of the genetic and ophthalmic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transferrin isoelectric focusing revealed a type 1 pattern."
    explanation: >-
      Documents the type 1 transferrin pattern that reports protein
      hypoglycosylation in an ALG3-CDG patient.
  downstream:
  - target: Multisystem Glycoprotein Dysfunction
    description: >-
      Widespread glycoprotein dysfunction produces the multisystem clinical
      phenotype.
- name: Multisystem Glycoprotein Dysfunction
  biological_scale: ORGANISM
  conforms_to: "congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction"
  biological_processes:

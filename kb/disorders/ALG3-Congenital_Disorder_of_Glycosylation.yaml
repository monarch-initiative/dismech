  description: >-
    Endocrine involvement was previously unreported in ALG3-CDG and was present
    in more than half the cohort, including central hypothyroidism, central
    adrenal insufficiency and growth hormone deficiency with consequent
    hypoglycaemia. This is the finding that drives the baseline endocrine
    evaluation recommendation.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Central hypothyroidism
    term:
      id: HP:0011787
      label: Central hypothyroidism
  evidence:
  - reference: PMID:33583022
    reference_title: "Expanding the phenotype, genotype and biochemical knowledge of ALG3-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of our subjects had central hypothyroidism with three requiring hormone replacement."
    explanation: >-
      Quantifies central hypothyroidism in four members of the ten-person
      cohort, supporting a FREQUENT band.
- name: Adrenal insufficiency
  category: Endocrine
  description: >-

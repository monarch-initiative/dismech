  - reference: PMID:41089746
    reference_title: "Insights into ALG3-CDG: A case study combining glycan profiling and genetic analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This presented case highlights the importance of glycan profiling and genetic analysis in diagnosing congenital disorders of glycosylation, facilitating early intervention and management."
    explanation: >-
      A 2025 case supports combined glycan profiling and genetic analysis in the
      contemporary diagnostic workflow.

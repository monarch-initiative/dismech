discussions:
- discussion_id: gap_alg3_truncated_versus_absent_glycan
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the severity of ALG3-CDG driven by the absence of mature glycan, or by the
    active transfer of a truncated Man5GlcNAc2 glycan that misfolds or mistargets
    its carrier proteins?
  attaches_to:
  - pathophysiology#Truncated Man5GlcNAc2 Lipid-Linked Precursor
  - pathophysiology#Protein Hypoglycosylation
  rationale: >-
    ALG3-CDG does not simply fail to glycosylate: it transfers a short,
    wrong-shaped glycan, and the resulting N-glycan spectrum is reported to be
    unique among the CDGs. That raises the possibility that the truncated glycan
    is actively harmful rather than merely insufficient, which would explain why
    a block partway along the assembly line is so severe. Distinguishing loss of
    function from gain of a bad glycan matters therapeutically, because the two
    imply opposite strategies: supplying the missing sugar versus preventing
    transfer of the truncated precursor.
  proposed_experiments:
  - experiment_id: exp_alg3_truncated_glycan_toxicity
    name: Comparing truncated-glycan transfer against no-transfer in ALG3-deficient cells
    description: >-
      In ALG3-deficient patient fibroblasts, compare glycoprotein folding,
      trafficking and ER stress between the native truncated-transfer state and a
      state where oligosaccharyltransferase-mediated transfer of the truncated
      precursor is blocked, to determine whether removing the abnormal glycan
      improves or worsens client protein handling.
    decision_criterion: >-
      Improved client folding and reduced ER stress when truncated transfer is
      blocked would show the short glycan is actively harmful.
    would_support:
    - The truncated glycan is actively deleterious, favouring strategies that prevent its transfer
    would_refute:
    - Blocking transfer worsens outcomes, confirming that any glycan is better than none and favouring substrate supplementation
- discussion_id: gap_alg3_glycan_signature_as_biomarker
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can the ALG3-specific N-glycan signature serve as a quantitative severity or
    treatment-response biomarker rather than only a diagnostic fingerprint?
  attaches_to:
  - pathophysiology#Truncated Man5GlcNAc2 Lipid-Linked Precursor
  - pathophysiology#Multisystem Glycoprotein Dysfunction
  rationale: >-
    The combined deficiency of hybrid glycans and of extension beyond Man5GlcNAc2
    is described as unique to ALG3-CDG, which establishes it as a diagnostic
    fingerprint. What is not established is whether the magnitude of that
    deviation tracks clinical severity across the roughly 40 reported
    individuals, or whether it would move under any intervention. Without that,
    any future trial in this ultra-rare disorder has no surrogate endpoint and
    would have to rely on clinical outcomes in a population where about half die
    neonatally.
  proposed_experiments:
  - experiment_id: exp_alg3_glycan_severity_correlation
    name: Correlating quantitative N-glycan deviation with clinical severity across the reported ALG3-CDG cohort
    description: >-
      Assemble quantitative N-glycan profiles alongside standardized severity
      scoring and residual enzyme activity across available ALG3-CDG individuals
      and, where possible, serial samples, to test whether glycan deviation
      predicts severity and whether it varies within an individual over time.
    decision_criterion: >-
      A monotonic relationship between glycan deviation and severity score, stable
      within individuals, would qualify it as a candidate surrogate endpoint.
    would_support:
    - Glycan deviation tracks severity and is a viable surrogate endpoint for trials
    would_refute:
    - Glycan profile is invariant across severities, confining it to a purely diagnostic role

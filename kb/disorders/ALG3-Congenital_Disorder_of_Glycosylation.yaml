    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transferrin isoelectric focusing revealed a type 1 pattern."
    explanation: >-
      Documents the first-line biochemical screening result in ALG3-CDG.
- name: N-glycan profiling
  description: >-
    N-glycan analysis shows combined deficiency of hybrid glycans and of
    extension beyond Man5GlcNAc2, a pattern reported to be unique to ALG3-CDG.

  description: >-
    A type 1 transferrin isoelectric focusing pattern indicates a defect in the
    assembly or transfer of the lipid-linked oligosaccharide, placing the
    disorder in CDG type I and prompting targeted molecular or glycan analysis.
  diagnosis_term:
    preferred_term: transferrin isoelectric focusing
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:

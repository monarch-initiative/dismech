- name: IGF-1 Axis Hypoglycosylation and Reduced Availability
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In fibroblasts from two individuals with ALG3-CDG, proIGF-1 was
    hypoglycosylated, IGF-1 secretion and IGF-1 receptor abundance were reduced,
    and circulating IGF-1 was low. These observations identify an ALG3-relevant
    growth-factor axis, but the study explicitly leaves its contribution to
    growth failure and endocrine phenotypes unresolved.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:35211808
    reference_title: Defective IGF-1 prohormone N-glycosylation and reduced IGF-1 receptor signaling activation in congenital disorders of glycosylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ALG3-CDG, ALG8-CDG, GMPPB-CDG and some PMM2-CDG fibroblasts showed hypoglycosylation of the proIGF-1Ea and lower IGF-1 secretion when compared with control (CTR)."
    explanation: >-
      Supports proIGF-1 hypoglycosylation and reduced secretion in ALG3-CDG
      patient fibroblasts.
  - reference: PMID:35211808
    reference_title: Defective IGF-1 prohormone N-glycosylation and reduced IGF-1 receptor signaling activation in congenital disorders of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lower IGF-1 serum concentration was observed in ALG3-CDG, ALG8-CDG and in some patients with PMM2-CDG, supporting our in vitro data."
    explanation: >-
      Human serum measurements corroborate reduced IGF-1 availability, while
      not establishing its clinical consequences.
  downstream:
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced IGF-1 availability could contribute to impaired growth, but the
      study explicitly leaves this clinical consequence unresolved.

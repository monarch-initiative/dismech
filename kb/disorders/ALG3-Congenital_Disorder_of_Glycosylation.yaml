    snippet: "Transferrin isoelectric focusing revealed a type 1 pattern."
    explanation: >-
      Documents the first-line biochemical screening result in ALG3-CDG.
- name: N-glycan profiling
  description: >-
    N-glycan analysis shows combined deficiency of hybrid glycans and of
    extension beyond Man5GlcNAc2, a pattern reported to be unique to ALG3-CDG.
    This makes glycan profiling potentially diagnostic rather than merely
    supportive within the CDG group. However, a 2024 study predicts that one
    processed ALG3-CDG glycan has the same molecular weight as a truncated
    MGAT2-CDG glycan, so mass alone may not distinguish every species.
  diagnosis_term:
    preferred_term: N-glycan profiling
    term:
      id: NCIT:C18020

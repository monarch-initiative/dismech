- name: Recurrent infections
  category: Immunologic
  description: >-
    Recurrent infection, predominantly upper and lower respiratory, affects three
    quarters of the cohort, and is one of the reasons baseline immunological
    evaluation is now recommended at diagnosis. Only one evaluated individual
    had a specific antibody deficiency; another similarly affected individual
    had recurrent infections despite a normal immunological workup. The
    computable phenotype is therefore recurrent infection rather than a
    generalized immunodeficiency assertion.

    evidence_source: IN_VITRO
    snippet: "In this study, we provide evidence that the unfolded protein response (UPR) and ER-associated degradation activities are increased in ALG3-CDG patient-derived cultured skin fibroblasts and there is constitutive activation of UPR mediated by the IRE1-α pathway."
    explanation: >-
      Directly demonstrates increased UPR, ERAD and constitutive IRE1-alpha

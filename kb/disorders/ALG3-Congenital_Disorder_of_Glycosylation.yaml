biochemical:
- name: Antithrombin III
  presence: DECREASED
  notes: >-
    Low antithrombin III is the most common haematologic defect, alongside
    decreased factor XI and a prolonged activated partial thromboplastin time.
    Coagulopathy is a classic congenital-disorder-of-glycosylation readout,
    since several coagulation factors are themselves N-glycoproteins.
    Reported at 43-59% of normal against a reference range of 86-145%.
    A structured reference_ranges block with a LOINC binding is a natural
    follow-up; the LOINC codes were not verified during this curation, so the
    interval is recorded here as source-quoted text rather than as a
    machine-readable range.
  evidence:
  - reference: PMID:33583022
    reference_title: "Expanding the phenotype, genotype and biochemical knowledge of ALG3-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low antithrombin III (43-59; RR: 86%-145%), decreased factor XI (44%-46%; RR 63%-142%), and prolonged APTT (37.2-58; RR 22-36 seconds) were the most common hematologic defects."
    explanation: >-
      Gives the observed values and reference ranges for the coagulation
      abnormalities of ALG3-CDG.

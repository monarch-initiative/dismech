    reference_title: "ALG3-CDG: a patient with novel variants and review of the genetic and ophthalmic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Literature review shows that visual impairment in ALG3-CDG is most commonly linked to optic nerve hypoplasia."
    explanation: >-
      The disease-focused ophthalmic review identifies optic nerve hypoplasia as
      the most common reported substrate of visual impairment.

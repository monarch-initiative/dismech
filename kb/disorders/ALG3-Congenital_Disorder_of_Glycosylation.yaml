    reference_title: "ALG3-CDG (CDG-Id): clinical, biochemical and molecular findings in two siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They share similar clinical features with previously reported patients including facial dysmorphism, severe psychomotor retardation, microcephaly, seizures, and gastrointestinal symptoms."
    explanation: >-
      Confirms severe psychomotor retardation as a shared feature across reported
      patients.
  - reference: PMID:33583022
    reference_title: "Expanding the phenotype, genotype and biochemical knowledge of ALG3-CDG."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of intellectual disability varied significantly within the cohort, with some individuals exhibiting profound developmental delays in all domains, while others achieved, as adults, neurocognitive abilities equivalent to an average age of 7 to 9 years."
    explanation: >-
      Qualifies the severity: the cohort spans profound delay to a substantially
      milder neurocognitive outcome, so "severe" is not universal.

treatments:
- name: Antiseizure management
  description: >-
    Seizures are typically intractable and non-febrile with variable semiology,
    and are managed with multiple antiepileptic drugs. A ketogenic diet has been
    used and suggested as an option for intractable epilepsy, and one individual
    received a vagus nerve stimulator. No pattern of drug efficacy could be
    discerned across the reported cases, so the choice remains empiric.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

progression:
- phase: Neonatal and early mortality
  notes: >-
    Almost half of reported individuals die before or during the neonatal
    period. The picture is not uniform, however: seven of the ten individuals in
    the 2021 cohort were alive at reporting, and the neonatal-death cluster is
    associated with the p.Arg171Gln variant, so mortality appears
    genotype-influenced rather than uniform across the disorder.

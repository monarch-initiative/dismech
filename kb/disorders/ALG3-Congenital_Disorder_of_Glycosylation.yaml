    description: >-
      Optic nerve hypoplasia is co-located with the disease-specific ocular
      evidence, without asserting that retinal ganglion-cell loss causes the
      developmental anomaly.
phenotypes:
- name: Global developmental delay
  category: Neurologic
  description: >-
    Developmental delay dominates the clinical picture, but its degree varies
    widely: some individuals have profound delay across all domains, while
    others reach adult neurocognitive abilities equivalent to an average age of
    seven to nine years. No frequency band is assigned because the cited cohort
    describes severity variation without a disorder-wide denominator for
    developmental delay.
  phenotype_term:

      caused by ALG3 variants.
pathophysiology:
- name: ALG3 Alpha-1,3-Mannosyltransferase Deficiency
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect"
  description: >-
    ALG3 is the endoplasmic reticulum alpha-1,3-mannosyltransferase (historically
    mannosyltransferase VI) that transfers the sixth mannose residue onto the
    growing lipid-linked oligosaccharide on the luminal face of the ER. Biallelic
    loss of function stalls assembly at that exact step, which is the
    organ-specific substitution this entry makes against the conserved CDG
    module: the module's generic assembly defect is here a single, positionally
    defined missing sugar.
  genes:
  - preferred_term: ALG3
    term:
      id: hgnc:23056
      label: ALG3
  molecular_functions:
  - preferred_term: alpha-1,3-mannosyltransferase activity
    term:
      id: GO:0000033
      label: alpha-1,3-mannosyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:10581255
    reference_title: "Carbohydrate deficient glycoprotein syndrome type IV: deficiency of dolichyl-P-Man:Man(5)GlcNAc(2)-PP-dolichyl mannosyltransferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that the molecular defect in the index patient is a missense mutation in the gene encoding the mannosyltransferase that transfers mannose from dolichyl-phosphate mannose on to the lipid-linked oligosaccharide (LLO) intermediate Man(5)GlcNAc(2)-PP-dolichol."
    explanation: >-
      The foundational human molecular study identifies ALG3 as the
      mannosyltransferase acting on the Man5GlcNAc2 lipid-linked intermediate.
  downstream:
  - target: Truncated Man5GlcNAc2 Lipid-Linked Precursor
    description: >-
      Blocking the sixth mannose transfer leaves the precursor arrested at
      Man5GlcNAc2.
- name: Truncated Man5GlcNAc2 Lipid-Linked Precursor
  biological_scale: MOLECULAR
  description: >-
    ALG3 deficiency causes Man5GlcNAc2-PP-dolichol to accumulate, while the
    leaky enzymatic defect permits some full-length precursor formation.
    Truncated oligosaccharides are transferred alongside full-length species,
    and later Golgi processing generates characteristic Man3-4 structures. The
    combined deficiency of hybrid glycans and extension beyond Man5GlcNAc2 is a
    disease-characteristic biochemical fingerprint.
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:10581255
    reference_title: "Carbohydrate deficient glycoprotein syndrome type IV: deficiency of dolichyl-P-Man:Man(5)GlcNAc(2)-PP-dolichyl mannosyltransferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defect results in the accumulation of the LLO intermediate and, due to its leaky nature, a residual formation of full-length LLOs."
    explanation: >-
      Establishes both Man5-linked precursor accumulation and residual
      full-length precursor formation, avoiding an absolute assembly-block claim.
  - reference: PMID:33583022
    reference_title: "Expanding the phenotype, genotype and biochemical knowledge of ALG3-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "N-glycan analyses of these individuals showed combined deficiencies of hybrid glycans and glycan extension beyond Man5 GlcNAc2 consistent with their truncated lipid-linked precursor oligosaccharides."
    explanation: >-
      Directly links the enzymatic block to the truncated precursor and the
      resulting N-glycan profile in patients.
  - reference: PMID:33583022
    reference_title: "Expanding the phenotype, genotype and biochemical knowledge of ALG3-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This spectrum of N-glycan changes is unique to ALG3-CDG."
    explanation: >-
      Establishes the diagnostic specificity of the glycan signature, which
      distinguishes ALG3-CDG from other CDG within the same module.
  - reference: PMID:41089746
    reference_title: "Insights into ALG3-CDG: A case study combining glycan profiling and genetic analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results revealed an abnormal N-glycan profile, characterized by an increased relative abundance of truncated mannosylated structures (Hex3HexNAc2 and Hex4HexNAc2) and a decreased presence of higher-order mannose structures (Hex6-8HexNAc2)."
    explanation: >-
      A 2025 case independently confirms increased truncated Man3-4 structures
      and depletion of higher-mannose glycans.
  downstream:
  - target: Protein Hypoglycosylation
    description: >-
      Transfer of a truncated glycan onto nascent glycoproteins yields
      abnormally glycosylated mature protein.
- name: Protein Hypoglycosylation
  biological_scale: CELLULAR
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  description: >-
    Nascent glycoproteins receive abnormal or absent N-glycans, detectable
    clinically as a type 1 transferrin isoelectric focusing pattern. From this
    node ALG3-CDG rejoins the conserved CDG pathway without substitution: the
    consequences are those of any hypoglycosylation state.
  evidence:
  - reference: PMID:34090370
    reference_title: "ALG3-CDG: a patient with novel variants and review of the genetic and ophthalmic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transferrin isoelectric focusing revealed a type 1 pattern."
    explanation: >-
      Documents the type 1 transferrin pattern that reports protein
      hypoglycosylation in an ALG3-CDG patient.
  downstream:
  - target: Constitutive IRE1-Mediated Unfolded Protein Response and ERAD
    causal_link_type: DIRECT
    description: >-
      Defective N-glycan extension chronically activates ER protein-quality
      control in patient-derived fibroblasts.
  - target: IGF-1 Axis Hypoglycosylation and Reduced Availability
    causal_link_type: DIRECT
    description: >-
      Hypoglycosylation affects proIGF-1 processing and IGF-1 receptor abundance
      in patient-derived fibroblasts.
  - target: Multisystem Glycoprotein Dysfunction
    description: >-
      Widespread glycoprotein dysfunction produces the multisystem clinical
      phenotype.
- name: Constitutive IRE1-Mediated Unfolded Protein Response and ERAD
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    ALG3-CDG patient-derived skin fibroblasts have constitutively increased
    unfolded-protein-response and ER-associated-degradation activity, with the
    UPR mediated through the IRE1-alpha branch. This supplies a demonstrated
    cellular stress mechanism between abnormal N-glycans and tissue dysfunction.
  cell_types:
  - preferred_term: skin fibroblast

name: ALG3-congenital disorder of glycosylation
creation_date: "2026-08-01T05:14:29Z"
description: >-
  ALG3-CDG (formerly CDG-Id) is a severe autosomal recessive congenital disorder
  of glycosylation caused by deficiency of the endoplasmic reticulum
  alpha-1,3-mannosyltransferase ALG3. The enzyme adds the sixth mannose to the
  growing lipid-linked oligosaccharide, so its loss truncates the precursor
  glycan at Man5GlcNAc2 and produces a distinctive N-glycan signature found in no
  other CDG. Affected individuals have severe neurological involvement with
  epilepsy, microcephaly and hypotonia, together with ocular, skeletal,
  gastrointestinal, endocrine and renal involvement. Mortality is substantial
  and is recorded with its source under progression.
category: Mendelian
parents:
- congenital disorder of glycosylation
- autosomal recessive disease
synonyms:
- ALG3-CDG
- CDG-Id
- CDG Id
- congenital disorder of glycosylation type Id

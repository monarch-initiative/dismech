      label: Autosomal recessive inheritance
  description: >-
    Biallelic TUBGCP2 variants have been reported in homozygous and compound
    configurations, including two paternal missense variants opposite a
    maternal multi-exon deletion. Recurrence counseling depends on confirming
    the familial variants and parental phase rather than assuming a single
    configuration for every family.
  evidence:
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrate that pathogenic variants in TUBGCP2 cause an autosomal
      recessive neurodevelopmental trait consisting of a neuronal migration
      disorder
    explanation: >-
      The delineating study's own statement of the mode of inheritance and the
      disease class.
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By querying clinical exome sequencing cases and through
      GeneMatcher-facilitated collaborations, we found three additional families
      with bi-allelic variation and similarly affected phenotypes
    explanation: >-
      Documents both homozygous and compound heterozygous configurations across
      independent families.
pathophysiology:
- name: Biallelic TUBGCP2 Variation
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    The disease is associated with biallelic germline TUBGCP2 variants. Reported
    configurations include homozygous missense and frameshift variants,
    compound-heterozygous missense and splice-altering variants, and two
    paternal missense variants opposite a maternal deletion of exons 2-14. The
    functional class is left UNKNOWN because no study has compared the full
    allele series in a common functional assay.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: GERMLINE
    allele_type: missense, splice-altering, frameshift, multi-exon deletion
    description: >-
      Disease-wide context spanning homozygous, compound-heterozygous, and
      hemizygous-by-deletion configurations; zygosity is intentionally omitted
      because the schema has no generic biallelic value. Truncating and deletion
      alleles are not assigned loss of function without a direct assay, and no
      dominant-negative mechanism has been demonstrated.
  genes:
  - preferred_term: TUBGCP2
    term:
      id: hgnc:18599
      label: TUBGCP2
  evidence:
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

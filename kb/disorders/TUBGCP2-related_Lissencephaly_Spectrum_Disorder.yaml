discussions:
- discussion_id: gap_tubgcp2_functional_impact_class
  status: OPEN
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do TUBGCP2 disease alleles act by loss of function, or by interfering with
    gamma-TuRC assembly while the subunit remains present?
  rationale: >-
    The mixed allele series includes missense, splice-altering, frameshift, and
    multi-exon deletion variants, but no common assay establishes their effects.
    For p.Glu311Lys, GCP2 abundance is preserved while gamma-tubulin, HAUS6, and
    NEDD1 localization changes. That allele-specific result does not classify the
    truncating, splice, or deletion alleles and does not demonstrate a
    dominant-negative mechanism. Functional impact therefore remains UNKNOWN.
  attaches_to:
  - pathophysiology#Biallelic TUBGCP2 Variation
  proposed_experiments:
  - experiment_id: exp_tubgcp2_allele_series_rescue
    name: Allele-series rescue in TUBGCP2-null cells
    description: >-
      Re-express each reported allele in a TUBGCP2 knockout background and score
      gamma-TuRC assembly, nucleation rate, and HAUS6/NEDD1 localization. A
      matched allele series would distinguish preserved, partial, and absent
      function without inferring an effect from variant class alone.
- discussion_id: gap_tubgcp2_human_neural_validation
  status: OPEN
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do patient neural progenitors show altered gamma-TuRC localization,
    microtubule nucleation, mitotic dynamics, or neuronal migration?
  rationale: >-
    Current functional evidence comes from p.Glu311Lys skin fibroblasts and
    low-fidelity depletion/null animal models. The human cortical imaging
    suggests a migration disorder, but no patient-derived neural system measures
    migration, mitosis, or nucleation. This missing bridge prevents a causal
    assignment from the fibroblast localization phenotype to cortical
    malformation.
  attaches_to:
  - pathophysiology#Variant-Dependent Gamma-TuRC Localization and Cytoskeletal Dysregulation
  - pathophysiology#Altered Developing-Brain Mitotic State
  - pathophysiology#Neuronal Migration Failure
  evidence:
  - reference: PMID:40017707
    reference_title: "TUBGCP2 variants cause lissencephaly spectrum disorders: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, functional and proteomic studies on TUBGCP2 gene variants in
      human neurons are lacking.
    explanation: The review explicitly identifies the human-neural evidence gap.
  proposed_experiments:
  - experiment_id: exp_tubgcp2_patient_neural_models
    name: Isogenic patient iPSC neural-progenitor and migration assays
    description: >-
      Generate patient and corrected iPSC-derived neural progenitors and cortical
      organoids; quantify gamma-TuRC localization, microtubule nucleation,
      live-cell mitotic timing, progenitor survival, and radial migration.
- discussion_id: gap_tubgcp2_corpus_callosum_direction
  status: OPEN
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does TUBGCP2 disease produce a thin corpus callosum in most patients but
    a thick one in at least one, and does the direction track the allele?
  rationale: >-
    Thin corpus callosum occurred in 6/8 people in the 2025 review, while a later
    patient with homozygous c.2647dupC/p.Gln883Profs*62 had a thick corpus
    callosum. With one thick-callosum report, it is unknown whether direction
    tracks genotype, age, a modifier, or measurement differences.
  attaches_to:
  - phenotypes#Thin Corpus Callosum
  - phenotypes#Thick Corpus Callosum
  evidence:
  - reference: PMID:40448381
    reference_title: "Thick Corpus Callosum: An Unusual Finding of TUBGCP2-Related Tubulinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI revealed cortical malformations consistent with the
      pachygyria-polymicrogyria complex, as well as a thickened corpus callosum.
    explanation: Direct evidence for the later opposite-direction callosal finding.
  proposed_experiments:
  - experiment_id: exp_tubgcp2_callosal_morphometry
    name: Genotype-stratified callosal morphometry across reported cases
    description: >-
      Pool published TUBGCP2 MRIs, measure callosal cross-sectional area against
      age norms, and test whether truncating alleles separate from missense
      alleles on that measure.
- discussion_id: gap_tubgcp2_l_serine_translation
  status: OPEN
  kind: OPEN_QUESTION
  prompt: >-
    Does L-serine alter a disease-relevant phenotype in TUBGCP2 neural models?
  rationale: >-
    A patient-fibroblast experiment found an 8% proliferation increase in both
    patient and control cells and a larger numerical reduction in cytotoxicity in
    patient cells, but neither result reached statistical significance. There is
    no animal or human treatment evidence, so L-serine remains a model-only
    observation rather than a treatment.
  attaches_to:
  - pathophysiology#Variant-Dependent Gamma-TuRC Localization and Cytoskeletal Dysregulation
  evidence:
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      L-serine treatment in cultured skin fibroblasts revealed an 8% increased
      proliferation in both TUBGCP2-patient and control, while a 26% reduction of
      cytotoxicity was detected in patient-derived cells compared to 14% in
      controls. These changes did not reach statistical significance.
    explanation: The exact nonsignificant in-vitro result that motivates, but does not answer, the question.
notes: >-
  Reviewed against six disease-focused PubMed records (PMID:31630790,
  PMID:33458610, PMID:36078134, PMID:40017707, PMID:40448381, and
  PMID:42472988). Frequency bands are scoped to the eight-person cumulative
  review in PMID:40017707; later cases extend the spectrum but are not silently
  added to that denominator.

  OLS4/MONDO was checked live on 2026-08-25 against the MONDO 2026-08-04 release.
  MONDO:0032893 was active and non-obsolete with the exact label "pachygyria,
  microcephaly, developmental delay, and dysmorphic facies, with or without
  seizures". This supersedes the entry's prior ontology-gap note.

  The literature sometimes calls TUBGCP2 disease a tubulinopathy. GCP2 is a
  gamma-tubulin-complex component rather than a tubulin isotype, so grouping
  membership remains a separate curation-boundary decision. Mechanistically,
  the entry retains only the migration-module nodes that are supported or
  explicitly hypothetical; it does not claim measured nucleation failure.

  GeneReviews NBK350554 does not mention TUBGCP2. Its seizure and rehabilitation
  guidance is included only as PARTIAL, OTHER-source phenotype-based
  extrapolation. L-serine has only a nonsignificant patient-fibroblast result and
  is not curated as treatment.

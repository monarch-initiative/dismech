    compared with control fibroblasts by immunofluorescence, immunoblotting,
    proteomics, proliferation, and cytotoxicity assays. This is an allele-specific
    peripheral-cell model rather than a neural model.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Primary skin fibroblasts from a p.Glu311Lys patient and controls
  culture_system: Fibroblast monolayer culture
  conditions:

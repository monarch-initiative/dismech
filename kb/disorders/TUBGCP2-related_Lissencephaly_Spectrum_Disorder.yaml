genetic:
- name: TUBGCP2
  association: Causative
  gene_term:
    preferred_term: TUBGCP2 (gamma-tubulin complex component 2)
    term:
      id: hgnc:18599
      label: TUBGCP2
  notes: >-
    TUBGCP2 encodes GCP2, a core gamma-tubulin ring-complex component. The
    founding families carried homozygous p.Arg333Cys or p.Ala615Pro, or
    compound-heterozygous p.Arg297Cys and c.2025-2A>G alleles. Subsequent reports
    added homozygous p.Glu311Lys; a Chinese configuration with paternal c.178C>T
    and c.538T>C/p.Trp180Arg variants opposite a maternal exons 2-14 deletion;
    and homozygous c.2647dupC/p.Gln883Profs*62. Functional consequences cannot
    be generalized across this mixed allele series.
  evidence:
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrate that pathogenic variants in TUBGCP2 cause an autosomal
      recessive neurodevelopmental trait consisting of a neuronal migration
      disorder
    explanation: >-
      The founding gene-disease observation.
  - reference: PMID:40017707
    reference_title: "TUBGCP2 variants cause lissencephaly spectrum disorders: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we reported a 6-year-old patient with LIS caused by a
      hemizygous variant in TUBGCP2 (two paternal missense variants: c.178 C>T,
      c.538T>C and one maternal exon variant: 2–14 deletion).
    explanation: Documents the later mixed missense/deletion configuration.
  - reference: PMID:40448381
    reference_title: "Thick Corpus Callosum: An Unusual Finding of TUBGCP2-Related Tubulinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified a homozygous NM_006659.4:c.2647dupC
      p.(Gln883Profs*62) variant in the TUBGCP2 gene, which was confirmed by
      Sanger sequencing.
    explanation: Documents the later homozygous frameshift allele.

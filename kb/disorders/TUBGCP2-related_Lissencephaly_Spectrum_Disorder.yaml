name: TUBGCP2-related Lissencephaly Spectrum Disorder
creation_date: "2026-08-22T10:00:00Z"
category: Mendelian
description: >-
  TUBGCP2-related lissencephaly spectrum disorder is an autosomal recessive
  neurodevelopmental disease caused by biallelic variants in TUBGCP2, which
  encodes gamma-tubulin complex protein 2 (GCP2). It is the gamma-tubulin ring
  complex disorder that behaves like a tubulinopathy: unlike its TUBGCP4 and
  TUBGCP6 siblings, whose phenotype is microcephaly with chorioretinopathy and
  no cortical malformation, TUBGCP2 produces frank neuronal migration failure -
  pachygyria, agyria and subcortical band heterotopia - on top of microcephaly.

  The mechanism sits one step further from the microtubule than the classical
  tubulinopathies. GCP2 does not polymerize into the microtubule lattice; with
  GCP3 and two molecules of gamma-tubulin it forms the gamma-tubulin small
  complex, the repeating unit of the gamma-tubulin ring complex that nucleates
  microtubules. GCP2:GCP3 contacts make up nearly half of the ring. The
  best-characterized allele, p.Glu311Lys, is predicted to disrupt the
  electrostatic complementarity of that interface, and patient fibroblasts show
  faint delocalization of gamma-tubulin in mitosis and altered localization of
  the gamma-TuRC-associated proteins HAUS6 and NEDD1 - with normal GCP2 protein
  levels, so the lesion is assembly/positioning rather than absence of the
  subunit.

  Reported alleles are missense (p.Arg333Cys, p.Ala615Pro, p.Arg297Cys,
  p.Glu311Lys), a splice variant, a multi-exon deletion, and a frameshift, in
  homozygous, compound heterozygous and hemizygous-by-deletion configurations,
  in both consanguineous and non-consanguineous families. Beyond the cortical
  malformation the syndrome is recognizable by a facial gestalt - narrow
  forehead, thick eyebrows, bulbous nose, smooth philtrum, prominent ears,
  widely spaced teeth - developmental delay in all reported individuals, and
  seizures in most. Corpus callosum morphology is the phenotypic axis still in
  motion: a thin corpus callosum was reported in most early cases, but a 2025
  case with a homozygous frameshift had a THICK corpus callosum, which is
  otherwise distinctly unusual across tubulinopathies.
parents:
- congenital nervous system disorder
- hereditary neurological disease

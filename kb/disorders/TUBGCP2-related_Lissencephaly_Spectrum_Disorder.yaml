name: TUBGCP2-related Lissencephaly Spectrum Disorder
creation_date: "2026-08-22T10:00:00Z"
category: Mendelian
disease_term:
  preferred_term: pachygyria, microcephaly, developmental delay, and dysmorphic facies, with or without seizures
  term:
    id: MONDO:0032893
    label: pachygyria, microcephaly, developmental delay, and dysmorphic facies, with or without seizures
description: >-
  TUBGCP2-related lissencephaly spectrum disorder is an autosomal recessive
  neurodevelopmental disease caused by biallelic TUBGCP2 variants. The 2025
  eight-person literature review found pachygyria, microcephaly, and
  developmental delay in all eight individuals, seizures and dysmorphic facial
  features in seven, and a variable set of callosal, cerebellar, brainstem, and
  white-matter abnormalities. Later reports added a
  pachygyria-polymicrogyria complex with a thick corpus callosum and cystic
  leukomalacia to the radiological spectrum.

  Mechanistic evidence is narrower than the clinical association. For the
  p.Glu311Lys allele, structural analysis predicts disruption of the GCP2-GCP3
  electrostatic interface, while patient fibroblasts show faint delocalization
  of gamma-tubulin, HAUS6, and NEDD1 but normal GCP2 abundance. Neither
  microtubule nucleation nor neuronal migration has been measured in patient
  neural cells. Depletion models in zebrafish and Drosophila reproduce reduced
  brain size; zebrafish pH3 staining establishes an altered developing-brain
  mitotic state but cannot distinguish mitotic arrest from over-proliferation.
parents:
- congenital nervous system disorder
- hereditary neurological disease

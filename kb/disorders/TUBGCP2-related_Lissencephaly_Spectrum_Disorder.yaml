pathophysiology:
- name: Disrupted GCP2-GCP3 Interface in the Gamma-Tubulin Ring Complex
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Biallelic TUBGCP2 variants perturb the assembly of the gamma-tubulin ring
    complex rather than depleting GCP2. GCP2:GCP3 intermolecular contacts make up
    nearly half of the ring; the recurrent p.Glu311Lys substitution sits at that
    interface, where an acidic glutamate is complemented by basic arginines of
    GCP2 and GCP3, and the charge reversal is predicted to convert an attractive
    patch into a repulsive one. Patient fibroblasts confirm the lesion is not
    loss of the protein: GCP2 levels are unchanged across the cell cycle.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: missense, splice-altering, frameshift, multi-exon deletion
    description: >-
      Deliberately left UNKNOWN rather than assigned. The allele spectrum is
      mixed and the two classes point different ways: a multi-exon deletion and a
      frameshift are unambiguously loss-of-function, while the best-studied
      missense allele (p.Glu311Lys) leaves GCP2 protein levels normal and acts on
      an assembly interface - which is compatible with loss of function, but also
      with a dominant-negative-style interference that the recessive inheritance
      makes hard to test. No study has directly discriminated these, so the class
      is recorded as an open question in the discussions rather than guessed.
  genes:
  - preferred_term: TUBGCP2
    term:
      id: hgnc:18599
      label: TUBGCP2
  cellular_components:
  - preferred_term: gamma-tubulin ring complex
    term:
      id: GO:0000930
      label: gamma-tubulin complex
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two siblings from a consanguineous Turkish family with
      dysmorphic features, developmental delay, brain malformation, and epilepsy
      carrying a homozygous mutation (p.Glu311Lys) in TUBGCP2 encoding the
      γ-tubulin complex 2 (GCP2) protein. This variant is predicted to disrupt
      the electrostatic interaction of GCP2 with GCP3.
    explanation: >-
      Names the interface lesion this node models and the allele that
      demonstrates it.
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In primary fibroblasts carrying the variant, we observed a faint
      delocalization of γ-tubulin during the cell cycle but normal GCP2 protein
      levels.
    explanation: >-
      Establishes that GCP2 abundance is preserved, which is why this node is
      curated as an assembly defect rather than as subunit depletion, and why
      functional_impact_category is left UNKNOWN.
  downstream:
  - target: Impaired Microtubule Nucleation and Cytoskeletal Organization
    causal_link_type: DIRECT
    description: >-
      A mispaired GCP2:GCP3 interface degrades the nucleating ring the complex
      exists to build.
- name: Impaired Microtubule Nucleation and Cytoskeletal Organization
  role: PATHWAY
  biological_scale: CELLULAR
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
  description: >-
    The gamma-TuRC is the cell's microtubule nucleator and minus-end cap. With
    its core GCP2:GCP3 unit disturbed, nucleation and downstream cytoskeletal
    organization are degraded. Patient fibroblasts show mislocalization in
    mitosis of two gamma-TuRC-associated proteins, HAUS6 (which couples the
    complex to the augmin branching pathway) and NEDD1 (which targets it to the
    centrosome), while pericentrin - a pericentriolar-material component not part
    of the complex - is unaffected, localizing the defect to the nucleating
    machinery itself. Unbiased proteomics on the same cells found dysregulation
    of proteins governing cytoskeletal assembly and organization.

    This is the same module node that TUBG1 disease conforms to, reached from one
    step further out: TUBG1 perturbs gamma-tubulin itself, TUBGCP2 perturbs the
    scaffold that positions it.
  biological_processes:
  - preferred_term: microtubule nucleation
    term:
      id: GO:0007020
      label: microtubule nucleation
    modifier: DECREASED
  - preferred_term: microtubule cytoskeleton organization
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
    modifier: DYSREGULATED
  cellular_components:
  - preferred_term: centrosome
    term:
      id: GO:0005813
      label: centrosome
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, in mitosis, patient fibroblasts presented a faint delocalization
      of two components associated with the γ-TuRC complex, HAUS6 and NEDD1.
    explanation: >-
      The measured cellular consequence: the complex's targeting and branching
      partners are mispositioned.
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Through mass spectrometry, we observed dysregulation of multiple proteins
      involved in the assembly and organization of the cytoskeleton and the
      extracellular matrix, controlling cellular adhesion and of proteins crucial
      for neuronal homeostasis including axon guidance.
    explanation: >-
      Unbiased proteomic support for cytoskeletal disorganization as the cellular
      output, and the reason axon guidance is named alongside migration.
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GCP2 forms the multiprotein γ-tubulin ring complex (γ-TuRC) together with
      γ-tubulin and other GCPs to regulate the assembly of microtubules.
    explanation: >-
      Establishes the gene product's role in microtubule assembly, the function
      this node reports as impaired.
  downstream:
  - target: Neuronal Migration Failure
    causal_link_type: DIRECT
    description: >-
      Migrating neurons depend on a correctly nucleated microtubule array to
      couple the centrosome to the nucleus and translocate the soma.
- name: Neuronal Migration Failure
  role: PATHWAY
  biological_scale: CELLULAR
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule-Based Neuronal Motility Failure
  description: >-
    Neurons that cannot build a correct microtubule array fail to complete radial
    migration to their destination layer. The delineating study drew this
    inference directly from the imaging: the pachygyria and subcortical band
    heterotopia seen in all five originally reported individuals are the
    radiological signature of arrested migration, and the authors framed GCP2 as
    a core gamma-TuRC component acting in migrating neurons specifically.
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DECREASED
  evidence:
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain imaging from all five affected individuals revealed varying degrees
      of cortical malformations including pachygyria and subcortical band
      heterotopia, presumably caused by disruption of neuronal migration.
    explanation: >-
      The imaging-to-mechanism inference, stated with the authors' own hedge
      ("presumably") - migration was inferred from cortical architecture, not
      measured.
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our data implicate GCP2 as a core component of γ-TuRC in neuronal migrating
      cells
    explanation: >-
      Assigns the gene product a role specifically in migrating neurons.
  downstream:
  - target: Lissencephaly Spectrum Cortical Malformation
    causal_link_type: DIRECT
    description: >-
      Neurons stalled in the intermediate zone or arriving in the wrong layer
      produce a thickened, under-gyrated cortex and heterotopic bands.
- name: Lissencephaly Spectrum Cortical Malformation
  role: CONSEQUENCE
  biological_scale: TISSUE
  conforms_to: microtubule_dependent_neuronal_migration_failure#Cortical Dyslamination and Neuronal Ectopia
  description: >-
    The cortical endpoint spans the lissencephaly spectrum - pachygyria, agyria,
    and subcortical band heterotopia - and was present in every reported
    individual. Pachygyria is the constant: a 2025 review of eight cumulative
    cases found it in 8/8, with thin corpus callosum in 6/8 and cerebellar volume
    loss in 3/8. A 2026 multicentre Turkish tubulinopathy cohort extended the
    radiological spectrum further by reporting a TUBGCP2 case with cystic
    leukomalacia.
  evidence:
  - reference: PMID:40017707
    reference_title: "TUBGCP2 variants cause lissencephaly spectrum disorders: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the TUBGCP2 variants were found to cause lissencephaly spectrum diseases,
      with the main clinical manifestations being microcephaly, lissencephaly
      (including agyria, pachygyria, or subcortical band heterotopia)
    explanation: >-
      Defines the cortical endpoint across the cumulative reported series.
  - reference: PMID:42472988
    reference_title: "Genotypic and phenotypic heterogeneity in tubulinopathies: insights from a Turkish multicenter cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a rare case of TUBGCP2-related tubulinopathy presenting with
      cystic leukomalacia, expanding the known radiological spectrum
    explanation: >-
      The most recent extension of the imaging phenotype, and the reason this
      node is described as still-widening.

  - L-serine treatment arm
  publication: PMID:33458610
  modeled_mechanisms:
  - target: Variant-Dependent Gamma-TuRC Localization and Cytoskeletal Dysregulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Measures gamma-tubulin, HAUS6, and NEDD1 localization and GCP2 abundance
      for p.Glu311Lys in primary patient cells.
    limitations: >-
      The model is limited to one missense allele and a peripheral cell type;
      neuronal migration, developing-brain mitosis, and microtubule nucleation
      were not measured.
    readouts:
    - name: Gamma-tubulin, HAUS6, and NEDD1 localization
      target: Variant-Dependent Gamma-TuRC Localization and Cytoskeletal Dysregulation
      direction: ALTERED
      interpretation: Faint delocalization in patient fibroblasts supports an allele-specific localization defect.
      evidence:
      - reference: PMID:33458610
        reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          However, in mitosis, patient fibroblasts presented a faint delocalization
          of two components associated with the γ-TuRC complex, HAUS6 and NEDD1
          (Figure 3A, lower panel, and 3C).
        explanation: Direct localization measurement in patient fibroblasts.
    - name: GCP2 protein abundance
      target: Variant-Dependent Gamma-TuRC Localization and Cytoskeletal Dysregulation
      direction: UNCHANGED
      interpretation: Preserved abundance bounds the p.Glu311Lys cellular defect but does not classify other alleles.
      evidence:
      - reference: PMID:33458610
        reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In primary fibroblasts carrying the variant, we observed a faint
          delocalization of γ-tubulin during the cell cycle but normal GCP2
          protein levels.
        explanation: Directly reports unchanged GCP2 abundance in the model.
    evidence:
    - reference: PMID:33458610
      reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Fibroblasts may not be the best cell type representing neuronal cells.
      explanation: The authors' own limitation supports the LOW fidelity assignment.
  findings:
  - statement: >-
      L-serine increased measured proliferation by 8% in both patient and control
      fibroblasts and reduced cytotoxicity by 26% versus 14%, but neither change
      was statistically significant; this is not clinical treatment evidence.
    supporting_text: >-
      L-serine treatment in cultured skin fibroblasts revealed an 8% increased
      proliferation in both TUBGCP2-patient and control, while a 26% reduction of
      cytotoxicity was detected in patient-derived cells compared to 14% in
      controls. These changes did not reach statistical significance.
    evidence:
    - reference: PMID:33458610
      reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
      supports: SUPPORT

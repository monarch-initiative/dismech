genetic:
- name: TUBGCP2
  association: Causative
  gene_term:
    preferred_term: TUBGCP2 (gamma-tubulin complex component 2)
    term:
      id: hgnc:18599
      label: TUBGCP2
  notes: >-
    Encodes GCP2. One GCP2 with one GCP3 and two gamma-tubulins forms the
    gamma-tubulin small complex, the repeating unit of the gamma-TuRC. Reported
    disease alleles cluster in the conserved Grip1 and Grip2 domains
    (p.Arg297Cys and p.Arg333Cys in the extended Grip1 domain, p.Ala615Pro in
    Grip2, p.Glu311Lys at the GCP2:GCP3 interface).
  evidence:
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using exome sequencing and family based rare variant analyses, we
      identified a homozygous variant
    explanation: >-
      The founding gene-disease observation.
diagnosis:
- name: Brain MRI
  description: >-
    The diagnostic pivot. Pachygyria has been present in every reported case;
    subcortical band heterotopia, thin corpus callosum, cerebellar volume loss
    and white-matter cystic change are variably added. MRI is what separates
    TUBGCP2 from its gamma-TuRC siblings TUBGCP4 and TUBGCP6, in which the cortex
    is structurally normal.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:40017707
    reference_title: "TUBGCP2 variants cause lissencephaly spectrum disorders: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All eight patients had abnormal brain MRI findings, including pachygyria in
      eight (100%)
    explanation: >-
      100% abnormal MRI with universal pachygyria is what makes imaging the
      diagnostic anchor.
- name: Molecular genetic testing
  description: >-
    Biallelic TUBGCP2 variants on exome or panel sequencing. Copy-number analysis
    matters here: one reported patient carried two paternal missense variants in
    trans with a maternal deletion of exons 2-14, which sequence-only calling
    would miss, leaving an apparently monoallelic and therefore unexplained
    result.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:40017707
    reference_title: "TUBGCP2 variants cause lissencephaly spectrum disorders: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene testing identified hemizygous variation in TUBGCP2 (missense variants:
      c.178 C>T, c.538T>C, and maternal exon variant: 2-14 deletion).
    explanation: >-
      The case that motivates pairing sequence analysis with copy-number
      detection.
treatments:

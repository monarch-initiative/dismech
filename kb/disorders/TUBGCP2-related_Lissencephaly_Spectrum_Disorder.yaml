    explanation: Defines the human cortical-malformation spectrum.
  - reference: PMID:40448381
    reference_title: "Thick Corpus Callosum: An Unusual Finding of TUBGCP2-Related Tubulinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI revealed cortical malformations consistent with the
      pachygyria-polymicrogyria complex, as well as a thickened corpus callosum.
    explanation: Extends the directly observed cortical phenotype to a pachygyria-polymicrogyria complex.
  downstream:
  - target: Pachygyria
    causal_link_type: DIRECT
    description: Pachygyria is the constant cortical imaging manifestation in the review set.
  - target: Subcortical Band Heterotopia
    causal_link_type: DIRECT
    description: Subcortical band heterotopia is a less frequent cortical manifestation.
  - target: Polymicrogyria
    causal_link_type: DIRECT
    description: Polymicrogyria was reported as part of a pachygyria-polymicrogyria complex.
- name: Associated Non-Cortical Structural Brain Abnormalities
  role: CONSEQUENCE
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Callosal, cerebellar, brainstem, white-matter, cystic, and visual-system
    abnormalities expand the structural spectrum beyond the cortex. Their
    developmental links to TUBGCP2 and to each other are not established.
  evidence:
  - reference: PMID:40017707
    reference_title: "TUBGCP2 variants cause lissencephaly spectrum disorders: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All eight patients had abnormal brain MRI findings, including pachygyria in

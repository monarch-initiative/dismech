inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic in every reported family - homozygous in consanguineous
    pedigrees, compound heterozygous in others, and in one case a paternal
    missense pair in trans with a maternal multi-exon deletion. This is the
    opposite of the dominant de novo mechanism of the alpha- and beta-tubulin
    isotype disorders, and puts sibling recurrence risk at 25%.

      GeneMatcher-facilitated collaborations, we found three additional families
      with bi-allelic variation and similarly affected phenotypes
    explanation: >-
      Establishes the replicated biallelic gene-disease association without
      assigning a uniform molecular effect to the different alleles.
  downstream:
  - target: Variant-Dependent Gamma-TuRC Localization and Cytoskeletal Dysregulation
    causal_link_type: UNKNOWN
    description: >-
      The p.Glu311Lys allele has computational and patient-fibroblast evidence;
      whether the same proximal effect applies to every reported allele is not
      established.
  - target: Dysmorphic Facial Features
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The developmental route from TUBGCP2 variation to facial dysmorphism is unknown.
- name: Variant-Dependent Gamma-TuRC Localization and Cytoskeletal Dysregulation
  role: PATHWAY
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Evidence for this proximal cellular state is allele-specific. Structural
    analysis predicts that p.Glu311Lys disrupts electrostatic interaction at the
    GCP2-GCP3 interface. Primary fibroblasts carrying that allele have normal
    GCP2 abundance but faint delocalization of gamma-tubulin, HAUS6, and NEDD1,
    plus broader cytoskeletal proteomic changes. The study did not measure
    microtubule-nucleation rate, and fibroblasts are not a neural model.
  biological_processes:
  - preferred_term: microtubule cytoskeleton organization
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
    modifier: DYSREGULATED
  cellular_components:
  - preferred_term: gamma-tubulin ring complex
    term:
      id: GO:0000930
      label: gamma-tubulin complex
    modifier: DYSREGULATED
  - preferred_term: centrosome
    term:
      id: GO:0005813
      label: centrosome
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: This variant is predicted to disrupt the electrostatic interaction of GCP2 with GCP3.
    explanation: >-
      Computational support limited to the p.Glu311Lys interface prediction; it
      is not a cellular measurement and is not generalized to other alleles.
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In primary fibroblasts carrying the variant, we observed a faint
      delocalization of γ-tubulin during the cell cycle but normal GCP2 protein
      levels.
    explanation: >-
      Directly measures altered gamma-tubulin localization and preserved GCP2
      abundance in p.Glu311Lys patient fibroblasts.
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, in mitosis, patient fibroblasts presented a faint delocalization
      of two components associated with the γ-TuRC complex, HAUS6 and NEDD1
      (Figure 3A, lower panel, and 3C).
    explanation: >-
      Exact patient-fibroblast evidence for altered localization of two
      gamma-TuRC-associated proteins; it does not establish reduced nucleation.
  - reference: PMID:33458610
    reference_title: Autosomal recessive variants in TUBGCP2 alter the γ-tubulin ring complex leading to neurodevelopmental disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Through mass spectrometry, we observed dysregulation of multiple proteins
      involved in the assembly and organization of the cytoskeleton and the
      extracellular matrix, controlling cellular adhesion and of proteins crucial
      for neuronal homeostasis including axon guidance.
    explanation: Proteomic support for broad cytoskeletal dysregulation in the same fibroblasts.
  downstream:
  - target: Altered Developing-Brain Mitotic State
    causal_link_type: UNKNOWN
    description: >-
      A mitotic-state abnormality is seen in a depletion model, but its route
      from the human variant-dependent fibroblast state is not established.
  - target: Neuronal Migration Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

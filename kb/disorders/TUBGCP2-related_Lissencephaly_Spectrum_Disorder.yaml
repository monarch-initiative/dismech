discussions:
- discussion_id: gap_tubgcp2_functional_impact_class
  status: OPEN
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do TUBGCP2 disease alleles act by loss of function, or by interfering with
    gamma-TuRC assembly while the subunit remains present?
  rationale: >-
    The allele spectrum contains both a multi-exon deletion and a frameshift -
    unambiguously loss-of-function - and missense variants at protein-interaction
    surfaces. For the best-studied missense allele the answer is explicitly NOT
    depletion: GCP2 protein levels are normal across the cell cycle, and what
    changes is the localization of gamma-tubulin and of the associated proteins
    HAUS6 and NEDD1. That is compatible with a hypomorphic loss of assembly
    competence, but also with an incorporated-but-defective subunit that
    interferes with ring closure. Recessive inheritance does not settle it, since
    a mildly interfering subunit could still be tolerated in heterozygotes. The
    distinction is not academic: it determines whether an allele-agnostic
    dosage-restoration strategy could work, or whether the mutant product must be
    removed. This is why functional_impact_category is left UNKNOWN on the trigger
    node rather than defaulted to LOSS_OF_FUNCTION.
  attaches_to:
  - pathophysiology#Disrupted GCP2-GCP3 Interface in the Gamma-Tubulin Ring Complex
  proposed_experiments:
  - experiment_id: exp_tubgcp2_allele_series_rescue
    name: Allele-series rescue in TUBGCP2-null cells
    description: >-
      Re-express each reported allele in a TUBGCP2 knockout background and score
      gamma-TuRC assembly, nucleation rate, and HAUS6/NEDD1 localization. A
      hypomorph rescues partially in a null background; an interfering allele
      does not, and worsens the wild-type background when co-expressed.
- discussion_id: gap_tubgcp2_corpus_callosum_direction
  status: OPEN
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does TUBGCP2 disease produce a thin corpus callosum in most patients but
    a thick one in at least one, and does the direction track the allele?
  rationale: >-
    Tubulinopathies are characteristically associated with a thin or normal
    corpus callosum, and thin callosum was reported in 6 of 8 cumulative TUBGCP2
    cases. In 2025 a patient with a homozygous frameshift variant
    (c.2647dupC, p.Gln883Profs*62) was reported with a THICK corpus callosum -
    the first such report for this gene and a rare finding across tubulinopathies
    generally. Callosal thickness is a readout of commissural axon number and
    myelination, so a bidirectional effect would suggest the lesion perturbs axon
    guidance and pruning rather than simply reducing axon output. With a single
    case there is no way to tell whether this tracks the frameshift allele class,
    a modifier, or chance. Recording it now prevents "thin corpus callosum" from
    hardening into a diagnostic criterion that would argue against the diagnosis
    in the next such patient.
  attaches_to:
  - phenotypes#Thin Corpus Callosum
  proposed_experiments:
  - experiment_id: exp_tubgcp2_callosal_morphometry
    name: Genotype-stratified callosal morphometry across reported cases
    description: >-
      Pool published TUBGCP2 MRIs, measure callosal cross-sectional area against
      age norms, and test whether truncating alleles separate from missense
      alleles on that measure.
notes: >-
  Created 2026-08-22 during a QA pass over the tubulin-family curation tranche
  (docs/reports/tubulinopathies-grouping-review-2026-08-20.md). It is the last
  tubulin-family gene with a published, replicated gene-disease relationship that
  had no DisMech entry.

  No disease_term. MONDO has no disease concept for TUBGCP2 as of the 2026-08
  release - only the gene (HGNC:18599). This is a genuine ontology gap rather
  than a curation shortcut: the gene-disease relationship was established in AJHG
  in 2019, replicated by an independent group with functional work in 2021, and
  has a 2025 literature review and a 2026 multicentre cohort. It is the same
  situation as the TUBA8 entry, but for the opposite reason - TUBA8 has no MONDO
  term because its gene-disease claim was refuted, whereas TUBGCP2's is solid.

  Naming tension worth preserving. The literature calls this a "tubulinopathy" -
  PMID:40448381 does so in its title, and the 2026 Turkish cohort (PMID:42472988)
  counts TUBGCP2 among the seven tubulinopathy genes it reports. This entry
  nonetheless is NOT a member of the DisMech Tubulinopathies grouping, whose
  scope is diseases of the tubulin-encoding genes; GCP2 is a gamma-tubulin
  complex protein, not a tubulin. The disagreement is a lumping choice, not an
  error on either side, and the boundary is recorded in the grouping's notes so
  it can be revisited deliberately. Note the consequence: this entry DOES conform
  to all three nodes of the migration module, so it satisfies the grouping's
  NECESSARY criterion while being excluded on gene identity - which is exactly
  why that criterion is NECESSARY (audit-only) rather than SUFFICIENT.

  Relationship to the sibling gamma-TuRC entries. TUBGCP4 and TUBGCP6 disease is
  microcephaly with chorioretinopathy and a structurally normal cortex; TUBGCP2
  is microcephaly with frank cortical malformation and no reported
  chorioretinopathy. Same complex, different phenotypic centre of gravity, and
  the reason all three are separate entries.

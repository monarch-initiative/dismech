  - target: Associated Non-Cortical Structural Brain Abnormalities
    causal_link_type: UNKNOWN
    description: The developmental route to the non-cortical MRI findings is unresolved.
- name: Altered Developing-Brain Mitotic State
  role: PATHWAY
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Zebrafish tubgcp2 morphants have increased phospho-histone H3-positive cells
    in the developing brain. This is direction-neutral mechanistic evidence:
    the experiment establishes altered mitotic cell abundance but explicitly
    cannot distinguish mitotic arrest from over-proliferation. No comparable
    measurement has been made in patient neural cells.
  evidence:
  - reference: PMID:36078134
    reference_title: A Zebrafish/Drosophila Dual System Model for Investigating Human Microcephaly.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Compared to the control group (Figure 3a), we find significant and similar
      accumulation of mitotic brain cells in the morphant small-brain groups for
      both splicing and translation disruption (Figure 3b–d). However, these data
      do not distinguish over-proliferation from mitotic arrest.
    explanation: >-
      Supports a direction-neutral mitotic/proliferative disturbance in a
      low-fidelity depletion model, not decreased proliferation or migration.
  downstream:
  - target: Reduced Brain Growth and Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The model links altered mitotic-cell abundance with reduced brain size,
      but the intervening cell-fate and population dynamics remain unresolved.
- name: Reduced Brain Growth and Microcephaly
  role: CONSEQUENCE
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Microcephaly was present in all eight individuals summarized in the 2025
    review. Independent zebrafish and fly depletion/null models show reduced
    brain size, but those low-fidelity models do not establish the human cellular
    route or reproduce the cortical-folding phenotype.
  evidence:
  - reference: PMID:40017707
    reference_title: "TUBGCP2 variants cause lissencephaly spectrum disorders: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All eight patients (three females and five males, ages ranging from 1 to 10
      years) presented with LIS and microcephaly.
    explanation: Direct human support for universal microcephaly in the eight-person review set.
  - reference: PMID:36078134
    reference_title: A Zebrafish/Drosophila Dual System Model for Investigating Human Microcephaly.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In larvae injected with splice- or translation-blocking MOs, an experimental
      average of 88% develop the microcephaly phenotype (defined as a reduction of
      head width by more than two standard deviations compared to controls)
      (Figure 2a).
    explanation: >-
      Supports reduced brain size in a zebrafish depletion model, with no claim
      that it reproduces the human cortical or allelic mechanism.
  downstream:
  - target: Microcephaly
    causal_link_type: DIRECT
    description: The tissue-level reduced-brain-growth state is expressed clinically as microcephaly.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The neurodevelopmental intermediates producing global delay are unresolved.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The epileptogenic circuit intermediates are unresolved.
  - target: Developmental Regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The mechanism of regression in the severely affected patient is unresolved.
  - target: Generalized Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The neural and motor-system intermediates producing hypotonia are unresolved.
  - target: Spasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The corticospinal intermediates producing spasticity are unresolved.
- name: Neuronal Migration Failure
  role: PATHWAY
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule-Based Neuronal Motility Failure
  description: >-
    The founding study interpreted pachygyria and subcortical band heterotopia as
    presumably caused by disrupted neuronal migration. Migration has not been
    directly measured in patient-derived neural cells, zebrafish, or fly, so this
    node remains a partially supported imaging-based hypothesis.
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:31630790
    reference_title: Bi-allelic Pathogenic Variants in TUBGCP2 Cause Microcephaly and Lissencephaly Spectrum Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain imaging from all five affected individuals revealed varying degrees
      of cortical malformations including pachygyria and subcortical band
      heterotopia, presumably caused by disruption of neuronal migration.
    explanation: >-
      The authors explicitly hedge the imaging-to-mechanism inference;
      migration itself was not assayed.
  downstream:
  - target: Lissencephaly Spectrum Cortical Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A migration defect is a plausible route to the cortical phenotype, but
      direct cellular validation and relevant intermediates are lacking.
- name: Lissencephaly Spectrum Cortical Malformation
  role: CONSEQUENCE
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  conforms_to: microtubule_dependent_neuronal_migration_failure#Cortical Dyslamination and Neuronal Ectopia
  description: >-
    The cortical phenotype spans pachygyria, agyria, subcortical band
    heterotopia, and a reported pachygyria-polymicrogyria complex. Pachygyria
    was present in all eight people summarized in the 2025 review. Cystic
    leukomalacia is kept separate as a non-cortical radiological extension.
  evidence:
  - reference: PMID:40017707
    reference_title: "TUBGCP2 variants cause lissencephaly spectrum disorders: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the TUBGCP2 variants were found to cause lissencephaly spectrum diseases,
      with the main clinical manifestations being microcephaly, lissencephaly

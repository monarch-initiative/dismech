pathophysiology:
- name: DVL3 Last-Exon -1 Frameshift
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DVL3
    term:
      id: hgnc:3087
      label: DVL3
  genetic_context:
    gene:
      preferred_term: DVL3
      term:
        id: hgnc:3087
        label: DVL3
    allele_type: splice-acceptor variant or single-base deletion producing a -1 frameshift of the last exon
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
  description: >-
    Three different mutational mechanisms — two splice-acceptor changes and
    three single-base deletions — converge on one outcome: a -1 frameshift of
    the last exon, replacing the wild-type C-terminus of Dishevelled 3 with a
    novel peptide. That convergence is the signature of the allele class, and it
    mirrors exactly what the DVL1 alleles do. As with DVL1, the premature
    termination codon lies in the last exon, so the transcript is not expected to
    be degraded and the altered protein is made alongside the wild-type one.
  evidence:
  - reference: PMID:26924530
    reference_title: "DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all variants in DVL3 result in a -1 frameshift, indicating that these
      highly specific alterations might be a common cause of dominant Robinow
      syndrome
    explanation: >-
      Establishes that mechanistically distinct variants converge on a single
      reading-frame outcome, which is the defining feature of this allele class.
  downstream:
  - target: Altered Dishevelled-Mediated WNT Signal Transduction
    causal_link_type: DIRECT
    description: >-
      The altered protein occupies the transducer position of the pathway.
- name: Altered Dishevelled-Mediated WNT Signal Transduction
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Dishevelled transduces the signal from the WNT5A/ROR2/FZD2 receptor complex
    into the beta-catenin-independent planar cell polarity branch. A Dishevelled
    protein carrying a novel C-terminus is an altered transducer rather than an
    absent one.

    How much of the effect is lost signalling and how much is gained activity
    has been measured for DVL1 and not for DVL3. This entry therefore asserts
    only that transduction is altered, which is what the DVL3 evidence supports,
    and keeps the direction question in a discussion.
  biological_processes:
  - preferred_term: Wnt signaling pathway
    modifier: DYSREGULATED
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  - preferred_term: Wnt signaling pathway, planar cell polarity pathway
    modifier: DYSREGULATED
    term:
      id: GO:0060071
      label: Wnt signaling pathway, planar cell polarity pathway
  evidence:
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Robinow syndrome (RS) is a genetically heterogeneous disorder with six
      genes that converge on the WNT/planar cell polarity (PCP) signaling
      pathway implicated (DVL1, DVL3, FZD2, NXN, ROR2, and WNT5A).
    explanation: >-
      Places DVL3 in the same final common pathway as the other Robinow genes.
  downstream:
  - target: Disrupted Planar Cell Polarity in Developing Skeleton and Face
    causal_link_type: DIRECT
    description: >-
      Altered transduction reaches the developmental programs PCP signalling
      governs.
- name: Disrupted Planar Cell Polarity in Developing Skeleton and Face
  role: central_effector
  biological_scale: TISSUE
  description: >-
    The shared endpoint across Robinow genotypes: loss of the polarized,
    directional cell behaviour that PCP signalling governs, in the growth plate,
    the frontonasal midline and the genital tubercle. The developmental
    decomposition comes from the Ror2-null mouse and is inherited here by
    pathway membership rather than demonstrated for DVL3.
  biological_processes:
  - preferred_term: Wnt signaling pathway, planar cell polarity pathway
    modifier: DECREASED
    term:
      id: GO:0060071
      label: Wnt signaling pathway, planar cell polarity pathway
  - preferred_term: chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  evidence:
  - reference: PMID:29276006
    reference_title: "WNT Signaling Perturbations Underlie the Genetic Heterogeneity of Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data support an initial hypothesis that Robinow syndrome results
      from perturbation of the Wnt/PCP pathway
    explanation: >-
      States the pathway-level model this node represents, from the study that
      confirmed DVL1 and DVL3 as the main dominant contributors.
  downstream:
  - target: Mesomelic Limb Shortening
    causal_link_type: DIRECT
    description: >-
      Disordered growth plate chondrocyte behaviour shortens the middle limb

- name: Skeletal morphogenetic disruption
  description: >-
    DVL3 disease affects limb development, causing variable shortening and digital anomalies. The reported
    patient series do not directly measure growth-plate polarity or chondrocyte differentiation; Ror2-null
    and DVL1 overexpression findings cannot establish a DVL3-specific cellular lesion. Pectus excavatum is
    also reported in a molecularly characterized DVL3 patient. Radial head dislocation, hemivertebrae and scoliosis
    are retained from the cross-genotype GeneReviews baseline; unlike the primary DVL3 digit and pectus findings
    cited here, these sources do not establish a DVL3-specific developmental association, so this node does
    not assign them a causal edge.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:29575616
    reference_title: Autosomal dominant Robinow syndrome associated with a novel DVL3 splice mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The phenotype of the Robinow syndrome-affected female reported here is typical as she shows mesomelia
      and mild hand anomalies as well as characteristic facial anomalies.
    explanation: >-
      Clinical genotype-phenotype observation; downstream tissue mechanisms remain incompletely established.
  mechanism_confidence: PROVISIONAL

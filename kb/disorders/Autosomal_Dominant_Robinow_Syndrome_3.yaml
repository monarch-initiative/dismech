discussions:
- discussion_id: dvl3_frameshift_mode_of_action
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the DVL3 last-exon frameshift act the way the DVL1 one does — reduced
    signalling from loss of the wild-type C-terminus plus a gained nuclear
    activity from the novel peptide — or does the paralog differ?
  attaches_to:
  - pathophysiology#Altered Dishevelled-Mediated WNT Signal Transduction
  rationale: >-
    The DVL1 allele has been dissected against a stop codon at the same position
    (PMID:42424595), separating a shared loss-of-signalling component from a
    nuclear mislocalization unique to the frameshift. No equivalent experiment
    exists for DVL3. The analogy is strong — the same reading-frame outcome in a
    redundant paralog — but it remains an analogy, and this entry deliberately
    claims only that transduction is altered. The question matters because DVL1
    and DVL3 disease are clinically separable (osteosclerosis in DVL1), so the
    paralogs may not be doing the same thing after all.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous pathogenic DVL3 variants cause autosomal dominant disease. De novo variants are confirmed
    in individual reports, but their overall fraction is unknown. Two founding probands had clinically affected
    parents who had not undergone molecular testing, so those family histories do not establish variant segregation.
    An affected heterozygote has a 50% transmission probability with variable expression; parental assessment
    and testing refine recurrence counseling.
  evidence:
  - reference: PMID:29575616
    reference_title: Autosomal dominant Robinow syndrome associated with a novel DVL3 splice mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified the novel de novo splice acceptor mutation c.1715-2A > C in DVL3 in a 15-year-old female
      patient with typical features of Robinow syndrome.
    explanation: >-
      A molecularly reported de novo case, not a population de novo rate.
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Each child of an individual with ADRS has a 50% chance of inheriting the pathogenic variant; however,
      the severity of the clinical manifestations cannot be predicted from the results of molecular genetic
      testing.
    explanation: >-
      Transmission probability applies to a heterozygous affected parent, with variable clinical expression.
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-

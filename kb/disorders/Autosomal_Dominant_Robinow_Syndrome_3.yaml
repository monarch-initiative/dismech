genetic:
- name: DVL3
  gene_term:
    preferred_term: DVL3
    term:
      id: hgnc:3087
      label: DVL3
  relationship_type: CAUSATIVE
  notes: >-
    DVL3 encodes a Dishevelled paralog. Disease-associated variants include selected one-base and four-base
    coding deletions in the final exons and splice-acceptor substitutions/deletions that converge on the terminal
    minus-one frame. Patient RNA confirmed a four-nucleotide exon-15 deletion for c.1715-2A>C, whereas other
    splice effects remain predicted. De novo cases and familial clinical observations occur; the population
    de novo fraction and penetrance are not established. A variant requires appropriate classification and
    sequence-context interpretation rather than gene membership alone.
  evidence:
  - reference: PMID:26924530
    reference_title: DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      including two splice acceptor mutations and three 1 bp deletions.
    explanation: >-
      The founding series contained two molecular variant classes, not three distinct mutational mechanisms.
  - reference: PMID:29575616
    reference_title: Autosomal dominant Robinow syndrome associated with a novel DVL3 splice mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mutant DVL3 mRNAs were found to harbor a deletion of four nucleotides at the beginning of exon 15 and
      encode a protein product with a distinct -1 reading-frame C-terminus.
    explanation: >-
      Direct RNA result for c.1715-2A>C in one patient.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Clinical recognition should be followed by molecular testing for a heterozygous pathogenic or likely pathogenic
    DVL3 variant with an appropriate terminal-sequence consequence. A VUS neither establishes nor excludes
    disease. A Robinow/skeletal-dysplasia panel or exome/genome analysis should assess overlapping dominant
    and recessive genes and adequately cover DVL3 exons 14 and 15 and splice regions, including small indels.
    High GC content prevented an exome call in one discovery case; assess coverage before interpreting a negative
    result. The original targeted research protocol does not establish a universal first-line clinical test.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of autosomal dominant Robinow syndrome is established in a proband with typical suggestive
      findings and/or by the identification of a heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through
      molecular genetic testing.
    explanation: The GeneReviews Diagnosis/Testing criterion in full.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification of a heterozygous DVL1, DVL3, or WNT5A variant of uncertain significance does not establish
      or rule out the diagnosis.
    explanation: Variant uncertainty must remain distinct from molecular confirmation.
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      heteroge- neous coverage, presumably due to poor capture resulting from high GC content of the region,
      prevented identiﬁca- tion of this variant allele in our analytical informatics pipe- line.
    explanation: >-
      One coding-deletion case was missed by the initial exome pipeline; this supports checking coverage, not
      a general exome sensitivity estimate.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Baseline organ and skeletal evaluation
  description: >-
    Characterize limb, chest, vertebral and skull findings with appropriate radiographs. Obtain baseline echocardiography,
    hearing assessment and renal ultrasound; cardiac evaluation is particularly relevant given the observed
    DVL3 lesion burden. Assess oral clefts, dentition, development, abdominal wall and genital findings, with
    urologic/endocrine assessment and female pelvic ultrasound as indicated. These are cross-genotype baseline
    recommendations supplemented by DVL3 case observations.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Renal ultrasound To assess for renal anomalies & hydronephrosis
    explanation: >-
      GeneReviews recommends baseline assessment for renal anomalies and hydronephrosis across dominant Robinow
      genotypes.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Cardiovascular Echocardiogram To evaluate for congenital heart defect
    explanation: >-
      Baseline echocardiography differs from subsequent specialist monitoring only when abnormalities are found.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Radiographs of limbs, chest, vertebrae, & skull To establish the extent of skeletal involvement
    explanation: >-
      Baseline skeletal characterization can detect vertebral complications without asserting they arise directly
      from a growth-plate lesion.
differential_diagnoses:
- name: WNT5A-related Robinow syndrome
  description: >-
    Heterozygous WNT5A disease shares limb, facial and genital findings. Variant-specific ligand biology does
    not establish a universal hypomorphic mechanism or a strict height/head-size distinction. Molecular testing
    separates this disorder from DVL3 disease.
  disease_term:
    preferred_term: autosomal dominant Robinow syndrome 1
    term:
      id: MONDO:0024455
      label: autosomal dominant Robinow syndrome 1
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of autosomal dominant Robinow syndrome is established in a proband with typical suggestive
      findings and/or by the identification of a heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through
      molecular genetic testing.
    explanation: The GeneReviews Diagnosis/Testing criterion in full.
    quote_role: REVIEW_SYNTHESIS
- name: DVL1-related Robinow syndrome
  description: >-
    DVL1-related disease shares the selected terminal-frame architecture and many clinical findings. Macrocephaly
    and osteosclerosis are prominent in its reported cohorts, but height can be normal or short. Macrocephaly
    also occurs with DVL3, and the early absence of reported DVL3 osteosclerosis was not based on systematic
    exclusion. Molecular testing provides the distinction.
  disease_term:
    preferred_term: autosomal dominant Robinow syndrome 2
    term:
      id: MONDO:0014591
      label: autosomal dominant Robinow syndrome 2
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      None of the individuals with DVL3 variants have been reported to have osteosclerosis, but no speciﬁc
      investigation was conducted to exclude it.
    explanation: >-
      The founding paper explicitly limits the proposed skeletal discriminator.
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      only 38% (N = 8 out of 21) of DVL1 individuals have short stature
    explanation: >-
      Selected DVL1 cohort establishes variable height, not a categorical distinction from DVL3.
- name: NXN-related recessive Robinow syndrome
  description: >-
    Biallelic NXN variants produce a clinically overlapping recessive syndrome. Inheritance and molecular testing
    distinguish it; phenotype severity alone is unreliable.
  evidence:
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      AR-RS is associated with biallelic loss-of-function (LoF) variants in the orphan tyrosine kinase receptor,
      ROR2 ... and in the oxidative stress response protein, NXN
    explanation: >-
      Literature synthesis in the cohort introduction establishes the recessive gene differential.
  disease_term:
    preferred_term: robinow syndrome, autosomal recessive 2
    term:
      id: MONDO:0032800
      label: robinow syndrome, autosomal recessive 2
- name: Aarskog-Scott syndrome
  description: >-
    FGD1-related Aarskog-Scott syndrome can resemble Robinow syndrome in facial, limb and genital findings.
    Its X-linked inheritance and molecular cause distinguish it; it is a relevant alternative after negative
    Robinow-gene testing.

genetic:
- name: DVL3
  gene_term:
    preferred_term: DVL3
    term:
      id: hgnc:3087
      label: DVL3
  relationship_type: CAUSATIVE
  notes: >-
    Dishevelled 3, paralog of DVL1. The pathogenic alleles are those producing a
    -1 frameshift of the last exon; a splice-acceptor variant and a single-base
    deletion both qualify, so allele class here is defined by reading-frame
    consequence rather than by variant type. A truncating variant elsewhere in
    DVL3 should not be called causal on the strength of the gene alone.
  evidence:
  - reference: PMID:26924530
    reference_title: "DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      targeted sequencing identified five unrelated individuals harboring
      heterozygous, de novo frameshift variants in DVL3, including two splice
      acceptor mutations and three 1 bp deletions
    explanation: >-
      Establishes DVL3 as causative with de novo alleles in five unrelated
      individuals.
diagnosis:
- name: Targeted Penultimate-Exon Sequencing of the DVL Paralogs
  description: >-
    In a clinically typical dominant case negative for WNT5A, DVL1 and ROR2,
    direct sequencing of the penultimate exon of the DVL paralogs is the
    high-yield next step — that is how this entity was found. Broad panel or
    exome testing is appropriate otherwise, provided the analysis is not
    filtered in a way that discards last-exon frameshifts as presumed benign
    NMD-escapers.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26924530
    reference_title: "DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we elected to pursue direct Sanger sequencing of the penultimate exon of
      DVL1 and its paralogs DVL2 and DVL3 to search for potential
      disease-associated variants
    explanation: >-
      Describes the targeted strategy that identified this entity.
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of autosomal dominant Robinow syndrome is established in a
      proband with typical suggestive findings and/or by the identification of a
      heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through molecular
      genetic testing.
    explanation: >-
      States the molecular confirmation criteria for the dominant forms.
differential_diagnoses:
- name: Autosomal Dominant Robinow Syndrome 2
  description: >-
    The DVL1 form, mechanistically the closest relative — the same -1 frameshift
    architecture in the paralog. Distinguished by gene, and clinically by the
    osteosclerotic variant (normal stature, persistent macrocephaly, increased
    bone mineral density, hearing loss) that is attributed to DVL1 and not to
    DVL3.
- name: Autosomal Dominant Robinow Syndrome 1
  description: >-
    The WNT5A form: hypomorphic missense alleles in the ligand rather than an
    altered intracellular transducer.
- name: Autosomal Recessive Robinow Syndrome
  description: >-
    The ROR2 form. More severe skeletal involvement with vertebral segmentation
    defects and rib fusions, which the dominant forms do not produce.

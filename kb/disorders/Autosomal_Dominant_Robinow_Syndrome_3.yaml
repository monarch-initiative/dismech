    explanation: >-
      Supplemental 015902 family report; an affected-parent history is not molecularly proven transmission.
pathophysiology:
- name: Selected DVL3 terminal-region alteration
  description: >-
    Selected heterozygous coding deletions in the final two exons and splice-acceptor variants alter the terminal
    reading frame. Both single-base and four-base coding deletions are reported. The disease association depends
    on sequence consequence rather than any arbitrary DVL3 truncation.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:26924530
    reference_title: DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      including two splice acceptor mutations and three 1 bp deletions.
    explanation: >-
      The founding series contained two molecular variant classes, not three distinct mutational mechanisms.
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two individuals (2 out of 22, 9%) were found to have novel variants in DVL3.
    explanation: >-
      Table 1 reports a de novo c.1751_1754delATCG coding deletion and c.1715-2delA with unknown inheritance;
      the selected fraction is not prevalence.

- name: Genetic and reproductive counseling
  description: >-
    Each child of an affected heterozygote has a 50% chance of inheriting the variant; severity cannot be predicted
    reliably. Offer family-specific counseling, parental assessment/testing and prenatal or preimplantation
    testing once the familial pathogenic variant is identified. The overall de novo fraction is unknown. If
    the variant is absent from both parents' blood, sibling recurrence remains low but nonzero because germline
    mosaicism cannot be excluded; GeneReviews quotes less than 1% for this circumstance across ADRS.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once the DVL1, DVL3, or WNT5A pathogenic variant has been identified in an affected family member, prenatal
      and preimplantation genetic testing are possible.
    explanation: >-
      Family-specific reproductive testing and counseling, not prevention of the developmental mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the risk to sibs is presumed to be slightly greater than that of the general population (though still
      <1%) because of the theoretic possibility of parental germline mosaicism.
    explanation: >-
      Applies after a proband variant is undetectable in both parents' leukocyte DNA; not a measured DVL3-specific
      recurrence rate.
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Each child of an individual with ADRS has a 50% chance of inheriting the pathogenic variant; however,
      the severity of the clinical manifestations cannot be predicted from the results of molecular genetic
      testing.
    explanation: >-
      Transmission probability applies to a heterozygous affected parent; variable expression limits prediction
      of severity.
  action_category: COUNSELING_INFORMATIONAL
discussions:
- discussion_id: dvl3_frameshift_mode_of_action
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which effects of the altered DVL3 C terminus account for developmental abnormalities, especially the cardiac
    phenotype?
  attaches_to:
  - pathophysiology#Abnormal Dishevelled-mediated WNT transduction
  - pathophysiology#Cardiac morphogenetic disruption
  rationale: >-
    Terminal phosphorylation, polymerization and receptor interactions are plausible mechanisms, but the cited
    DVL3 patient studies measure RNA and clinical findings rather than these functional outcomes. DVL1 canonical
    reporter direction depends on cell system and expression context, and its nuclear enrichment is observed
    in HEK cells but not fly follicle cells. No equivalent DVL3 variant-versus-stop experiment in the reviewed
    sources resolves a universal gain or loss. Dvl3-null mouse heart defects support a developmental role without
    proving the effect of human terminal alleles. The comparison uses the DVL1 studies PMID:36916233 and PMID:42424595;
    their constructs and model-specific outcomes are not DVL3 functional measurements.
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      Further work is necessary to elucidate the mechanism by which these speciﬁc mutations in DVL1 and DVL3
      result in DRS and their interactions within the global Wnt signalosome.
    explanation: >-
      The discovery authors explicitly identify an unresolved mechanism, supporting this knowledge gap rather
      than serving as the positive evidence for WNT involvement.

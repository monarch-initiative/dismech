    explanation: >-
      Independent patient RNA observation for a splice-acceptor variant.
  downstream:
  - target: Altered DVL3 C-terminal sequence
    causal_link_type: DIRECT
    description: >-
      Persistent RNA permits translation of a predicted altered protein; physiological protein abundance is
      unmeasured.
- name: Altered DVL3 C-terminal sequence
  description: >-
    The altered frame replaces the native DVL3 C terminus with a distinctive peptide, while preserving upstream
    functional domains. The 2018 sequence analysis identifies 83 shared novel residues before the stop codon.
    Sequence inference and RNA detection do not establish mutant protein stability, localization or signaling
    direction in patient tissues.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:29575616
    reference_title: Autosomal dominant Robinow syndrome associated with a novel DVL3 splice mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      mutant DVL3 proteins associated with Robinow syndrome show truncation of the C-terminus and share 83
      novel amino acid residues before the stop codon
    explanation: >-
      C-terminal consequence inferred from the confirmed RNA sequence; no direct patient-protein assay is claimed.
  downstream:
  - target: Abnormal Dishevelled-mediated WNT transduction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered terminal sequence plausibly changes Dishevelled interactions, but DVL3-variant-specific functional
      intermediates remain incompletely defined.
- name: Abnormal Dishevelled-mediated WNT transduction
  description: >-
    DVL proteins route canonical and noncanonical WNT signals. DVL3 terminal variants are proposed to perturb
    phosphorylation, localization, multimerization or receptor interactions, but their physiological signaling
    effect has not been established by the cited patient studies. Context-dependent DVL1 reporter and localization
    results do not determine the DVL3 mechanism.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Robinow syndrome (RS) is a genetically heterogeneous disorder with six genes that converge on the WNT/planar
      cell polarity (PCP) signaling pathway implicated (DVL1, DVL3, FZD2, NXN, ROR2, and WNT5A).
    explanation: >-
      The study summarizes pathway convergence including DVL3. This supports the pathway-level placement, not
      a measured direction or exact cellular effect of the disease-associated terminal alleles.

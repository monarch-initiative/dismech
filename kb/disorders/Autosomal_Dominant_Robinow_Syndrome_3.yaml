name: Autosomal Dominant Robinow Syndrome 3
synonyms:
- DRS3
- DVL3-related Robinow syndrome
- Robinow syndrome, autosomal dominant 3
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant Robinow syndrome 3
  term:
    id: MONDO:0014819
    label: autosomal dominant Robinow syndrome 3
description: >-
  DVL3-related dominant Robinow syndrome is a developmental disorder with variable limb shortening, craniofacial
  and oral findings, genital abnormalities and a substantial reported burden of congenital heart defects. Cleft
  lip or palate and abdominal wall defects occur in selected series. Short stature is common but not obligatory.

  Selected coding deletions and splice-site variants alter the terminal reading frame of DVL3, producing a
  distinctive C-terminal sequence. Patient RNA studies support persistence of tested mutant transcripts, including
  a directly confirmed splice consequence. The precise effect on Dishevelled signaling remains unresolved;
  DVL1 overexpression findings are mechanistic comparisons rather than measurements of DVL3 disease.

  Diagnosis depends on clinical assessment and appropriate molecular interpretation. Care addresses the individual
  skeletal, craniofacial, cardiac, genital and other findings, with family-specific counseling.
parents:
- Robinow Syndrome
- Skeletal Dysplasia
notes: >-
  This entry covers DVL3-related disease, with other Robinow genes treated as molecular differentials. GeneReviews
  supplies a cross-genotype clinical baseline, not DVL3-specific population frequencies. The 2016 clinical
  table covers four probands, and the 2022 compilation combines selected new and published cases with missing
  phenotype data and overlapping cohorts. Variant-specific RNA observations are distinguished from predicted
  splicing, protein-sequence inference and untested cellular mechanisms. The proportion of de novo cases and
  population penetrance remain unknown. Short stature and macrocephaly vary between patients. Rare renal, nail
  and neurodevelopmental findings inform baseline assessment and surveillance without unsupported DVL3-specific
  frequencies. Clinical findings without a supported mechanistic route remain associations rather than forced
  causal edges. Cataracts, tracheomalacia and congenital short gut are retained as reported single-patient
  observations, without inferring DVL3-specific mechanisms. Other adult medical events in the supplement, including
  ovarian cysts and premature menopause, are not established syndrome-defining findings; broad reproductive
  surveillance or endocrine causation is not inferred from that case. Omphalocele remains a DVL3-associated
  abdominal-wall finding without an invented upstream abdominal-wall mechanism; neither the skeletal nor the
  cardiac node establishes its pathogenesis.

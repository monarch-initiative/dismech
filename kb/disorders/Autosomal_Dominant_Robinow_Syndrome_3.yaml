name: Autosomal Dominant Robinow Syndrome 3
synonyms:
- DRS3
- DVL3-related Robinow syndrome
- Robinow syndrome, autosomal dominant 3
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant Robinow syndrome 3
  term:
    id: MONDO:0014819
    label: autosomal dominant Robinow syndrome 3
description: >-
  The DVL3 form of dominant Robinow syndrome — mesomelic limb shortening,
  genital hypoplasia and the fetal-facies gestalt, from heterozygous de novo
  variants in the Dishevelled paralog DVL3.

  The gene was found by hypothesis rather than by an unbiased search, and that
  is the most instructive thing about this entity. Once the DVL1 alleles were
  known to be frameshifts confined to one exon, and given that DVL1, DVL2 and
  DVL3 are functionally redundant paralogs, the penultimate exon of all three
  was sequenced directly in Robinow patients who had tested negative for DVL1,
  WNT5A and ROR2. Five unrelated individuals turned out to carry heterozygous de
  novo DVL3 variants — two splice-acceptor changes and three single-base
  deletions — and although those are three different mutational events, every
  one produces the same -1 frameshift of the last exon. The allele architecture,
  not the gene, is what the disease is about.
parents:
- Robinow Syndrome
- Skeletal Dysplasia
notes: >-
  Scope. This entry covers the DVL3 form only (MONDO:0014819, DRS3). The WNT5A
  form is ``Autosomal_Dominant_Robinow_Syndrome_1`` and the DVL1 form is
  ``Autosomal_Dominant_Robinow_Syndrome_2``; the union is
  ``kb/groupings/Robinow_Syndrome.yaml``.

  GeneReviews (PMID:25577943) describes the dominant syndrome across WNT5A,
  DVL1 and DVL3 together, so quoted clinical descriptions apply to the syndrome
  rather than exclusively to DVL3 patients, and the evidence explanations say so.
  The osteosclerotic variant described in that chapter is explicitly attributed
  to DVL1 and is NOT curated here.

  The functional dissection of the DVL1 frameshift (PMID:42424595) — reduced
  canonical and JNK-PCP signalling shared with a plain truncation, plus a
  nuclear mislocalization unique to the frameshift — has not been repeated for
  DVL3. It is cited in this entry's discussion as the leading hypothesis for
  DVL3 by analogy, not as evidence about DVL3.

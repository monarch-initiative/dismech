phenotypes:
- category: Skeletal
  name: Mesomelic Limb Shortening
  description: >-
    Shortening of the middle limb segments - forearm and lower leg - with upper-limb predominance. The mesomelic
    pattern is the skeletal signature of this condition and what distinguishes it from proportionate short
    stature.
  phenotype_term:
    preferred_term: Mesomelia
    term:
      id: HP:0003027
      label: Mesomelia
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: mesomelic limb shortening predominantly of the upper limbs
    explanation: >-
      States both the mesomelic pattern and its upper-limb predominance. This chapter covers dominant Robinow
      syndrome across genes; it is not a DVL3-specific frequency estimate.
    quote_role: REVIEW_SYNTHESIS
- category: Growth
  name: Short Stature
  description: >-
    Short stature occurred in all four clinically characterized founding probands, but is not obligatory: the
    2018 splice-variant patient had normal stature at age 15. Clinical expression varies and the selected early
    series is not population penetrance.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It is noteworthy that all indi- viduals with DVL3 mutations have short stature,
    explanation: >-
      Observation restricted to the four clinically described founding probands, superseded as a universal
      claim by a later normal-height case.
  - reference: PMID:29575616
    reference_title: Autosomal dominant Robinow syndrome associated with a novel DVL3 splice mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In contrast to the clinical data of four previously reported individuals with DVL3-related Robinow syndrome,
      short stature was not present in this individual at the age of 15 years.
    explanation: >-
      Primary counterexample to obligatory short stature; normal height does not exclude DVL3 disease.
- category: Craniofacial
  name: Hypertelorism
  description: >-
    Increased spacing between the eyes is one component of the characteristic facial phenotype. Prominence
    of the eyes is recorded separately.
  phenotype_term:
    preferred_term: Hypertelorism
    term:
      id: HP:0000316
      label: Hypertelorism

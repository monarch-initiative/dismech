      retrusion)
    explanation: >-
      Describes the widely spaced prominent eyes this record captures. This chapter covers dominant Robinow
      syndrome across genes; it is not a DVL3-specific frequency estimate.
    quote_role: REVIEW_SYNTHESIS
- category: Genitourinary
  name: Micropenis
  description: >-
    Reduced penile length can occur, but an apparently small penis may instead be normally sized and webbed
    or embedded; clinical assessment determines the appropriate hormonal or surgical approach. The founding
    DVL3 boy had a buried penis of normal size, so that case does not establish true micropenis.
  phenotype_term:
    preferred_term: Micropenis
    term:
      id: HP:0000054
      label: Micropenis
  evidence:

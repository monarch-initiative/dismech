  - target: Short Stature
    causal_link_type: DIRECT
    description: >-
      The same growth plate lesion summed over the long bones.
  - target: Fetal Facies
    causal_link_type: DIRECT
    description: >-
      Midline outgrowth failure of the frontonasal region.
  - target: Genital Hypoplasia
    causal_link_type: DIRECT
    description: >-
      Reduced genital tubercle outgrowth.
  - target: Dental Crowding and Malocclusion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Small, retruded jaws leave insufficient arch length for the dentition.

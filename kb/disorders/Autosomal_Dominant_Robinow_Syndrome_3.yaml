    causal_link_type: DIRECT
    description: >-
      Coding indels directly change frame, while selected splice variants do so through altered exon processing.
- name: Altered terminal DVL3 reading frame
  description: >-
    Selected coding and splice variants generate the characteristic minus-one frame. In the 2018 c.1715-2A>C
    case, patient RNA showed deletion of four nucleotides at the start of exon 15. The two 2016 splice substitutions
    were instead predicted to use a cryptic acceptor two bases downstream; that computational result must not
    be confused with the later observed four-base deletion.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:29575616
    reference_title: Autosomal dominant Robinow syndrome associated with a novel DVL3 splice mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mutant DVL3 mRNAs were found to harbor a deletion of four nucleotides at the beginning of exon 15 and
      encode a protein product with a distinct -1 reading-frame C-terminus.
    explanation: >-
      Direct RNA result for c.1715-2A>C in one patient.
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In silico prediction of the splice-altering SNVs by the Human Splicing Finder ... web tool predicts the
      activation of a ... cryptic splice acceptor site 2 bp down- stream of the canonical splice acceptor site
      in both mutant tran- scripts.
    explanation: >-
      Human Splicing Finder prediction for c.1715-1G>A and c.1715-2A>G; patient RNA was not reported for these
      two alleles.
  downstream:
  - target: Persistence of mutant DVL3 transcript
    causal_link_type: DIRECT
    description: >-
      The terminal premature stop architecture predicts escape from nonsense-mediated decay; selected patient
      transcripts were measured.
- name: Persistence of mutant DVL3 transcript
  description: >-
    Both normal and altered transcripts are detectable in tested patient-derived samples. The 2016 coding-deletion
    case showed no reduction in overall DVL3 RNA expression, and the 2018 splice case also expressed both alleles.
    These observations support escape from nonsense-mediated decay for the assayed variants, without measuring
    protein abundance in developing organs.
  biological_scale: MOLECULAR
  evidence:
  - reference: url:https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    reference_title: https://ars.els-cdn.com/content/image/1-s2.0-S0002929716000094-mmc2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      both mutant and wild-type transcripts of DVL3 were expressed
    explanation: >-
      The 2016 lymphoblastoid cell study examined the c.1716delC carrier BAB4569.
  - reference: PMID:29575616
    reference_title: Autosomal dominant Robinow syndrome associated with a novel DVL3 splice mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-

biochemical:
- name: Suppressed Serum Hepcidin
  presence: DECREASED
  context: >-
    Serum hepcidin is about threefold lower in homozygotes than controls after
    adjustment for erythropoietin and ferritin, and no independent relationship
    of erythropoietin, hemoglobin, or red cell count with hepcidin was found. That
    adjustment is the point: hepcidin suppression here is a direct consequence of
    the raised hypoxic response rather than a downstream effect of accelerated
    erythropoiesis, which is a genuinely informative dissociation for iron
    biology generally.
  evidence:
  - reference: PMID:21876117
    reference_title: Chuvash polycythemia VHLR200W mutation is associated with down-regulation of hepcidin expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, a significant independent relationship of serum erythropoietin, hemoglobin, or RBC count with hepcidin was not observed."
    explanation: >-
      Establishes that the hepcidin suppression is independent of erythropoietin
      and red cell mass.
- name: Elevated Serum Transferrin
  presence: INCREASED
  context: >-
    Transferrin is elevated as a HIF target and further raised by iron deficiency.
    The clinically surprising part is its direction of association: transferrin
    elevation was associated with reduced rather than increased thrombosis risk,
    and the A allele of the intronic TF variant rs3811647 associated with higher
    transferrin and protection from thrombosis. The investigators say plainly that
    they did not expect this.
  evidence:
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unexpectedly, transferrin elevation associated with reduced rather than increased thrombosis risk."
    explanation: >-
      The protective direction of the transferrin association, stated by the
      authors as unexpected.
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A allele of the promoter EPO single nucleotide polymorphisms (SNP), rs1617640, associated with elevated erythropoietin and increased thrombosis risk, whereas the A allele of the intronic TF SNP, rs3811647, associated with higher transferrin and protection from thrombosis in patients."
    explanation: >-
      Provides the genetic modifier evidence supporting both the risk and
      protective directions.
genetic:
- name: VHL c.598C>T (p.Arg200Trp) Homozygosity
  gene_term:
    preferred_term: VHL
    term:
      id: hgnc:12687
      label: VHL
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Homozygosity for the germline VHL missense allele c.598C>T, p.Arg200Trp
    (rs28940298), at chromosome 3p25. The functional consequence is partial loss
    of function: the substitution weakens rather than abolishes pVHL binding to
    hydroxylated HIF-alpha. That hypomorphic character is why this is a
    hypoxia-sensing disorder and not a tumor syndrome. Congenital erythrocytosis
    also arises from compound heterozygosity of R200W with a second VHL allele and
    from other homozygous VHL alleles such as the Croatian H191D, which is
    phenotypically distinct. Coding-exon-only assays can miss splice-altering
    variants including a cryptic intron-1 exon, so a negative coding panel does
    not exclude VHL-related erythrocytosis.
  frequency: OBLIGATE
  evidence:
  - reference: PMID:12415268
    reference_title: Disruption of oxygen homeostasis underlies congenital Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene associated with von Hippel-Lindau syndrome, VHL, maps to this region, and homozygosity with respect to a C-->T missense mutation in VHL, causing an arginine-to-tryptophan change at amino-acid residue 200 (Arg200Trp), was identified in all individuals affected with Chuvash polycythemia."
    explanation: >-
      Establishes homozygosity for VHL R200W in all affected individuals.
  - reference: PMID:16768548
    reference_title: Mutation of von Hippel-Lindau tumour suppressor and human cardiopulmonary physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chuvash polycythaemia has recently been defined as a new form of VHL-associated disease, distinct from the classical VHL-associated inherited cancer syndrome, in which germline homozygosity for a hypomorphic VHL allele causes a generalised abnormality in VHL-HIF signalling."
    explanation: >-
      States explicitly that the causative allele is hypomorphic, which is the
      basis for separating this disease from the VHL cancer syndrome.
- name: EPO Promoter Variant rs1617640
  gene_term:
    preferred_term: EPO
    term:
      id: hgnc:3415
      label: EPO
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  features: >-
    The A allele of the erythropoietin promoter variant rs1617640 associates with
    elevated erythropoietin and increased thrombosis risk among VHL R200W
    homozygotes. This is the genetic mechanism sitting directly behind the
    entry's headline finding that erythropoietin, rather than hematocrit, is what
    predicts thrombosis.
  evidence:
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A allele of the promoter EPO single nucleotide polymorphisms (SNP), rs1617640, associated with elevated erythropoietin and increased thrombosis risk, whereas the A allele of the intronic TF SNP, rs3811647, associated with higher transferrin and protection from thrombosis in patients."
    explanation: >-
      Establishes the risk-increasing direction of the EPO promoter variant in
      patients.
- name: TF Intronic Variant rs3811647
  gene_term:
    preferred_term: TF
    term:
      id: hgnc:11740
      label: TF
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  features: >-
    The A allele of the transferrin intronic variant rs3811647 associates with
    higher transferrin and protection from thrombosis in patients. Together with
    the EPO promoter variant it forms the only well-documented pair of genetic
    modifiers in this disease, and the protective direction was explicitly
    unexpected to the investigators.
  evidence:
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A allele of the promoter EPO single nucleotide polymorphisms (SNP), rs1617640, associated with elevated erythropoietin and increased thrombosis risk, whereas the A allele of the intronic TF SNP, rs3811647, associated with higher transferrin and protection from thrombosis in patients."
    explanation: >-
      Establishes the protective direction of the transferrin variant in patients.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive. Heterozygotes are clinically unaffected but not
    biologically silent: they have increased HIF-1-alpha activity and appear to be
    protected from anemia, with the odds of anemia reduced about 5.6-fold compared
    with non-carriers. That heterozygote advantage is the leading explanation for
    why an allele that shortens homozygote life expectancy has persisted at 5.7%
    in Chuvashia and 7.0% on Ischia. The allele descends largely from a single
    ancient founder event, but not exclusively so, since at least one Turkish
    homozygote carries a distinct haplotype.
  evidence:
  - reference: PMID:21606165
    reference_title: The heterozygote advantage of the Chuvash polycythemia VHLR200W mutation may be protection against anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By multivariate logistic regression, the odds of anemia were reduced an estimated 5.6-fold in the VHL(R200W) heterozygotes compared to controls (95% confidence interval 1.4-22.7; P=0.017)."
    explanation: >-
      Quantifies the proposed heterozygote advantage that would maintain the allele
      in the population.
  - reference: PMID:14726398
    reference_title: "Congenital disorder of oxygen sensing: association of the homozygous Chuvash polycythemia VHL mutation with thrombosis and vascular abnormalities but not tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although endemic to the Chuvash population of Russia, this mutation occurs worldwide and originates from a single ancient event."
    explanation: >-
      Establishes the founder origin of the allele and its worldwide occurrence.

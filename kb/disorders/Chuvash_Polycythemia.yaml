    term:
      id: UBERON:0002371
      label: bone marrow
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Increased Circulating Hemoglobin Concentration
    description: Erythroid expansion raises hemoglobin from early life.
  - target: Increased Hematocrit
    description: Erythroid expansion raises hematocrit from early life.
  - target: Elevated Circulating Erythropoietin Concentration
    description: >-
      Erythropoietin is inappropriately high or high-normal for the hemoglobin.
  - target: Headache
    description: >-
      Hyperviscosity from the expanded red cell mass contributes to chronic
      headache.
  - target: Fatigue
    description: Chronic symptom burden includes fatigue.
  evidence:
  - reference: PMID:14726398
    reference_title: "Congenital disorder of oxygen sensing: association of the homozygous Chuvash polycythemia VHL mutation with thrombosis and vascular abnormalities but not tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although hemoglobin-adjusted serum erythropoietin concentrations were approximately 10-fold higher in VHL 598C>T homozygotes than in controls, erythropoietin response to hypoxia was identical."
    explanation: >-
      Quantifies the erythropoietin elevation and shows the hypoxic response is
      preserved, so the axis is reset rather than broken.
  - reference: PMID:9058738
    reference_title: Congenital polycythemia in Chuvashia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while platelet and white blood cell counts were normal"
    explanation: >-
      Normal platelet and white cell counts alongside the marked erythrocytosis
      are the bedside discriminator from the trilineage expansion of polycythemia
      vera. The hemoglobin figure of 22.6 g/dL sits in the same sentence of the
      abstract but is followed by a square-bracketed abbreviation that the snippet
      validator strips, so the quote stops before it.
  - reference: PMID:23403324
    reference_title: "The phenotype of polycythemia due to Croatian homozygous VHL (571C>G:H191D) mutation is different from that of Chuvash polycythemia (VHL 598C>T:R200W)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that erythropoietin levels in homozygous VHL H191D individuals are higher than in VHL R200W patients of similar ages, and their native erythroid progenitors, unlike Chuvash R200W, are not hypersensitive to erythropoietin."
    explanation: >-
      Establishes erythropoietin hypersensitivity of R200W erythroid progenitors
      by contrast with the H191D genotype.
- name: Prothrombotic State
  biological_scale: ORGANISM
  description: >-
    Thrombosis is the leading cause of morbidity and mortality, and this node is
    where the disease defies the obvious intuition. The reflex reading is high
    hematocrit, viscous blood, clots. In Chuvash erythrocytosis that is wrong. In
    155 patients followed prospectively against 154 matched controls for eleven
    years, thrombotic risk rose 8.9-fold, and erythropoietin elevation, not
    hematocrit and not ferritin, is what correlated with it. Elevated transferrin
    was, unexpectedly, protective. Contributory mediators include raised
    plasminogen activator inhibitor-1, vascular endothelial growth factor, and
    endothelin-1, with a broadly prothrombotic transcriptional milieu. Model the
    causal edge as HIF and erythropoietin signaling to the prothrombotic state,
    with erythrocytosis as a parallel consequence rather than the intermediate.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  downstream:
  - target: Arterial Thrombosis
    description: The prothrombotic state manifests as arterial thrombotic events.
  - target: Venous Thrombosis
    description: The prothrombotic state manifests as venous thrombotic events.
  - target: Stroke
    description: >-
      Cerebral vascular events are the leading contributor to premature
      mortality.
  evidence:
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During 11 years of follow-up, risk of thrombosis increased 8.9-fold in patients versus controls. Erythropoietin elevation, but not hematocrit or ferritin, correlated with thrombosis risk."
    explanation: >-
      The central prospective finding: an 8.9-fold thrombotic risk that tracks
      erythropoietin and not hematocrit.
  - reference: PMID:30872370
    reference_title: Re-evaluation of hematocrit as a determinant of thrombotic risk in erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We review studies indicating that the occurrence of thrombosis in Chuvash erythrocytosis is independent of hematocrit, that the thrombotic risk is paradoxically increased by phlebotomy in Chuvash erythrocytosis, and that, when compared to chemotherapy, phlebotomy is associated with increased thrombotic risk in polycythemia vera."
    explanation: >-
      States both halves of the finding: thrombosis independent of hematocrit, and
      paradoxically increased by phlebotomy.
  - reference: PMID:16673284
    reference_title: Vascular complications in Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Matched-cohort and case-control analyses have shown that VHL 598C> T homozygosity is associated with lower peripheral blood pressures, varicose veins, vertebral hemangiomas, lower white blood cell and platelet counts, and elevated serum concentrations of vascular endothelial growth factor and plasminogen activator inhibitor-1."
    explanation: >-
      Documents the elevated plasminogen activator inhibitor-1 and vascular
      endothelial growth factor that contribute to the prothrombotic milieu.
- name: Pulmonary Vascular Tone and Remodeling
  biological_scale: TISSUE
  conforms_to: "pulmonary_vascular_remodeling#Pulmonary Artery Smooth Muscle Cell Proliferation and Vasoconstriction"
  description: >-
    Basal pulmonary vascular tone is elevated and the hypoxic pulmonary
    vasoconstrictive response is greatly exaggerated, alongside raised basal
    ventilation, a physiological picture indistinguishable from acclimatization to
    high altitude. Roughly a third of patients have mild pulmonary hypertension by
    echocardiography, and tricuspid regurgitation velocity remains elevated after
    adjusting for blood-volume surrogates, so this is not simply a volume effect.
    The mouse model settles the causal question: pulmonary hypertension develops
    independently of the polycythemia, with vascular remodeling, hemorrhage,
    edema, and macrophage infiltration, all suppressed by Hif2a heterozygosity.
    Endothelin-1 is elevated in patients and is a HIF target.
  cell_types:
  - preferred_term: pulmonary artery smooth muscle cell
    term:
      id: CL:0002591
      label: smooth muscle cell of the pulmonary artery
  biological_processes:
  - preferred_term: pulmonary vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  downstream:
  - target: Pulmonary Arterial Hypertension
    description: >-
      Elevated tone and vascular remodeling raise pulmonary artery pressure.
  - target: Exercise Intolerance
    description: >-
      Elevated pulmonary vascular tone contributes to reduced exercise capacity.
  evidence:
  - reference: PMID:16768548
    reference_title: Mutation of von Hippel-Lindau tumour suppressor and human cardiopulmonary physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Basal ventilation and pulmonary vascular tone were elevated, and ventilatory, pulmonary vasoconstrictive, and heart rate responses to acute hypoxia were greatly increased."
    explanation: >-
      Direct physiological measurement of elevated basal pulmonary vascular tone
      and exaggerated hypoxic vasoconstriction in patients.
  - reference: PMID:16769575
    reference_title: "Endothelin-1, vascular endothelial growth factor and systolic pulmonary artery pressure in patients with Chuvash polycythemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma endothelin-1 (p=0.010), VEGF (p=0.022) and erythropoietin (p<0.0005) concentrations and Doppler-estimated systolic pulmonary artery pressures (p<0.0005) were higher in the patients while systolic systemic blood pressures were lower (p=0.001)."
    explanation: >-
      Links elevated endothelin-1, a HIF target, to raised pulmonary artery
      pressure in patients.
  - reference: PMID:20197624
    reference_title: The von Hippel-Lindau Chuvash mutation promotes pulmonary hypertension and fibrosis in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mice developed pulmonary hypertension independently of polycythemia and enhanced normoxic respiration similar to Chuvash patients, further validating VhlR/R mice as a model for Chuvash disease."
    explanation: >-
      Establishes that the pulmonary phenotype is not secondary to the
      polycythemia, which is what justifies modeling it as a parallel branch.
  - reference: PMID:20197624
    reference_title: The von Hippel-Lindau Chuvash mutation promotes pulmonary hypertension and fibrosis in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lungs from VhlR/R mice exhibited pulmonary vascular remodeling, hemorrhage, edema, and macrophage infiltration, and lungs from older mice also exhibited fibrosis."
    explanation: >-
      Documents the vascular remodeling that grounds conformance to the pulmonary
      vascular remodeling module.
- name: Hepcidin Suppression and Iron Mobilization
  biological_scale: ORGANISM
  description: >-
    Hepcidin, the master regulator of iron export, is suppressed roughly
    threefold in homozygotes, and the suppression survives adjustment for both
    erythropoietin and ferritin, so it is a direct consequence of the raised
    hypoxic response rather than a downstream effect of accelerated
    erythropoiesis. Transferrin and transferrin receptor are induced as HIF
    targets. The clinically important interaction is iatrogenic: therapeutic
    phlebotomy drives iron deficiency on top of this program, and lower ferritin
    independently predicts higher pulmonary artery pressure.
  downstream:
  - target: Decreased Circulating Ferritin Concentration
    description: >-
      HIF-driven iron mobilization compounded by therapeutic phlebotomy lowers
      ferritin.
  - target: Pulmonary Vascular Tone and Remodeling
    description: >-
      Lower ferritin independently predicts higher tricuspid regurgitation
      velocity, so iron depletion feeds back onto the pulmonary vascular node.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21876117
    reference_title: Chuvash polycythemia VHLR200W mutation is associated with down-regulation of hepcidin expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After adjustment for serum erythropoietin and ferritin concentrations by multiple linear regression, the geometric mean (95% confidence interval of mean) hepcidin concentration was 8.1 (6.3-10.5) ng/mL in VHL(R200W) homozygotes versus 26.9 (18.6-38.0) ng/mL in controls (P < .001)."
    explanation: >-
      Quantifies hepcidin suppression after adjustment for erythropoietin and
      ferritin, establishing it as a direct consequence of the hypoxic response.
  - reference: PMID:21993671
    reference_title: Pulmonary artery pressure and iron deficiency in patients with upregulation of hypoxia sensing due to homozygous VHL(R200W) mutation (Chuvash polycythemia).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among VHL(R200W) homozygotes, phlebotomy therapy was associated with lower serum ferritin concentration, and low ferritin independently predicted higher tricuspid regurgitation velocity (standardized beta=0.29; P=0.009)."
    explanation: >-
      Establishes the iron-to-pulmonary-pressure link and its iatrogenic driver.
- name: Metabolic Reprogramming Toward Glycolysis
  biological_scale: CELLULAR
  description: >-
    Raised HIF activity induces glycolytic enzymes and pyruvate dehydrogenase
    kinase, shifting substrate use away from oxidative phosphorylation. During
    exercise this shows up as early phosphocreatine depletion and acidosis in
    skeletal muscle, greater blood lactate accumulation, and reduced maximum
    exercise capacity, with elevated muscle transcripts for pyruvate
    dehydrogenase kinase, phosphofructokinase, and muscle pyruvate kinase. This is
    the physiological substrate of the fatigue and exercise limitation patients
    report, and it is a rare opportunity to observe HIF-driven metabolic
    regulation at whole-organism level in humans.
  biological_processes:
  - preferred_term: glycolytic process
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: INCREASED
  downstream:
  - target: Exercise Intolerance
    description: >-
      Early muscle acidosis and phosphocreatine depletion reduce maximum exercise
      capacity.
  - target: Fatigue
    description: >-
      The metabolic shift contributes to the chronic fatigue reported by patients.
  evidence:
  - reference: PMID:20616028
    reference_title: Regulation of human metabolism by hypoxia-inducible factor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During exercise, CP patients had early and marked phosphocreatine depletion and acidosis in skeletal muscle, greater accumulation of lactate in blood, and reduced maximum exercise capacities."
    explanation: >-
      Documents the metabolic phenotype during exercise in patients.
  - reference: PMID:20616028
    reference_title: Regulation of human metabolism by hypoxia-inducible factor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy specimens from CP patients showed elevated levels of transcript for pyruvate dehydrogenase kinase, phosphofructokinase, and muscle pyruvate kinase."
    explanation: >-
      Provides the transcriptional basis for the glycolytic shift in patient
      muscle.
- name: Increased Solid Organ Size
  biological_scale: TISSUE
  description: >-
    Liver, spleen, and kidney volumes relative to body mass are larger in
    homozygotes than in matched Chuvash controls. The proposed mechanism runs
    through the opposing effects of the two HIF isoforms on proliferation:
    HIF-1-alpha induces the cyclin-dependent kinase inhibitor p21, while
    HIF-2-alpha promotes MYC activity and proliferation, and mouse data implicate
    raised hepatic HIF-2-alpha with reduced p21.
  locations:
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  downstream:
  - target: Splenomegaly
    description: Splenic volume is increased relative to body mass.
  evidence:
  - reference: PMID:20140661
    reference_title: Increased size of solid organs in patients with Chuvash polycythemia and in mice with altered expression of HIF-1alpha and HIF-2alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report that the volumes of liver, spleen, and kidneys relative to body mass were larger in 30 individuals with Chuvash polycythemia than in 30 matched Chuvash controls."
    explanation: >-
      Documents the organ enlargement in a matched human cohort.
  - reference: PMID:20140661
    reference_title: Increased size of solid organs in patients with Chuvash polycythemia and in mice with altered expression of HIF-1alpha and HIF-2alpha.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "At least in the liver, this phenotype may result from increased HIF-2alpha and decreased p21(Cip1) levels leading to increased hepatocyte proliferation."
    explanation: >-
      Offers the proposed HIF-2-alpha and p21 mechanism. PARTIAL because the
      authors themselves frame it as a hypothesis supported by mouse data.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_hif_stabilization
  hypothesis_label: Impaired pVHL-HIF Degradation with Normoxic HIF Stabilization
  status: CANONICAL
  description: >-
    The established account. R200W weakens pVHL binding to hydroxylated HIF-alpha,
    HIF-1-alpha and HIF-2-alpha escape proteasomal degradation at normal oxygen
    tension, and the hypoxia-response transcriptional program runs constitutively,
    producing erythropoietin excess, pulmonary vascular changes, altered iron
    handling, and metabolic reprogramming. Mouse epistasis assigns the erythroid
    and pulmonary arms specifically to HIF-2-alpha.
  evidence:
  - reference: PMID:12415268
    reference_title: Disruption of oxygen homeostasis underlies congenital Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The protein VHL modulates the ubiquitination and subsequent destruction of hypoxia-inducible factor 1, subunit alpha (HIF1alpha)."
    explanation: >-
      States the normal pVHL function whose impairment is the basis of this model.
- hypothesis_group_id: vhl_socs1_jak2_dysregulation
  hypothesis_label: Loss of VHL-SOCS1-Mediated Degradation of Phospho-JAK2
  status: ALTERNATIVE
  description: >-
    A competing account of why erythroid progenitors are hypersensitive to
    erythropoietin. pVHL is proposed to heterodimerize with SOCS1 to form an E3
    ligase that degrades phosphorylated JAK2, and Chuvash-associated VHL mutants
    are proposed to have altered SOCS1 affinity and to fail to degrade
    phospho-JAK2, so erythropoietin signaling runs hot independently of HIF. A
    selective JAK2 inhibitor reversed the phenotype in the knock-in mouse. Human
    data cut against it: the Croatian H191D genotype, which the model treats the
    same way, has erythroid progenitors that are explicitly not hypersensitive to
    erythropoietin. Recorded as an alternative rather than dismissed, because the
    mouse rescue is real and the isolated human report of clinical improvement on
    a JAK2 inhibitor is consistent with it, though JAK2 inhibition would blunt
    erythropoietin signaling regardless of why that signaling is high.
  evidence:
  - reference: PMID:21685897
    reference_title: Loss of JAK2 regulation via a heterodimeric VHL-SOCS1 E3 ubiquitin ligase underlies Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that VHL directly binds suppressor of cytokine signaling 1 (SOCS1) to form a heterodimeric E3 ligase that targets phosphorylated JAK2 (pJAK2) for ubiquitin-mediated destruction."
    explanation: >-
      States the proposed alternative E3 ligase mechanism.
  - reference: PMID:21685897
    reference_title: Loss of JAK2 regulation via a heterodimeric VHL-SOCS1 E3 ubiquitin ligase underlies Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Systemic administration of a highly selective JAK2 inhibitor, TG101209, reversed the disease phenotype in Vhl(R200W/R200W) knock-in mice, an experimental model that recapitulates human Chuvash polycythemia."
    explanation: >-
      The mouse rescue that is the strongest support for this alternative model.
  - reference: PMID:23403324
    reference_title: "The phenotype of polycythemia due to Croatian homozygous VHL (571C>G:H191D) mutation is different from that of Chuvash polycythemia (VHL 598C>T:R200W)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This observation contrasts with a report suggesting that polycythemia in VHL R200W and H191D homozygotes is due to the loss of JAK2 regulation from VHL R200W and H191D binding to SOCS1."
    explanation: >-
      Human progenitor data contradicting the model's prediction for H191D, which
      is why it is curated as ALTERNATIVE rather than canonical.

progression:
- phase: Congenital and childhood
  notes: >-
    Erythrocytosis is present from birth or infancy and is often documented in
    childhood; the six index subjects in the original Chuvash series were all
    under 20 years old. Onset is insidious rather than acute, and there is no
    presenting event.
  evidence:
  - reference: PMID:9058738
    reference_title: Congenital polycythemia in Chuvashia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied six polycythemic Chuvash patients <20 years of age from unrelated families and 12 first-degree family members."
    explanation: >-
      Establishes that the phenotype is present and detectable in childhood and
      adolescence.
- phase: Adult event-driven course
  notes: >-
    Hematologically the disease is stable or slowly progressive; clinically it is
    event-driven, punctuated by discrete thrombotic and cerebrovascular events
    that accumulate with age and produce premature mortality. Pulmonary artery
    pressure is a progressive variable that is modifiable by iron status.
  evidence:
  - reference: PMID:14726398
    reference_title: "Congenital disorder of oxygen sensing: association of the homozygous Chuvash polycythemia VHL mutation with thrombosis and vascular abnormalities but not tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this matched cohort study, VHL 598C>T homozygosity was associated with vertebral hemangiomas, varicose veins, lower blood pressures, and elevated serum vascular endothelial growth factor (VEGF) concentrations (P <.0005), as well as premature mortality related to cerebral vascular events and peripheral thrombosis."
    explanation: >-
      Establishes the event-driven vascular course and its contribution to
      premature mortality.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Thrombosis and cerebrovascular events drive premature mortality, with an
    8.9-fold increase in thrombotic risk over eleven years of prospective
    follow-up against matched controls. Chronic headache, fatigue, and reduced
    exercise capacity persist between events, and about a third of patients carry
    mild pulmonary hypertension. Notably absent is any excess cancer risk, despite
    the causative gene being a tumor suppressor. There is no therapy of
    demonstrated benefit, and the standard of care, phlebotomy, is itself
    associated with increased thrombotic risk and with higher pulmonary artery
    pressure through iron depletion.
  evidence:
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the major cause of morbidity and mortality in Chuvash erythrocytosis is thrombosis."
    explanation: >-
      Identifies thrombosis as the dominant source of morbidity and mortality.
  - reference: PMID:16673284
    reference_title: Vascular complications in Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinocerebellar hemangioblastomas, renal carcinomas, and pheochromocytomas typical of classical VHL tumor predisposition syndrome have not been found, and no increased risk of cancer has been demonstrated."
    explanation: >-
      Establishes the absence of demonstrated excess cancer risk, which materially
      changes the burden profile relative to classical VHL syndrome.
diagnosis:
- name: Diagnostic Workup for Congenital Erythrocytosis
  description: >-
    Confirm persistent erythrocytosis, then exclude polycythemia vera (JAK2
    unmutated; and note that white cell and platelet counts are normal or low here
    rather than expanded), exclude acquired secondary causes such as
    cardiopulmonary disease, high-altitude residence, sleep apnea, renal artery
    stenosis, and erythropoiesis-stimulating agents, then measure erythropoietin
    (high or inappropriately normal, and a normal value does not exclude the
    diagnosis) and p50 (normal here, left-shifted in high-affinity
    hemoglobinopathies), then confirm genetically.
  evidence:
  - reference: PMID:34021251
    reference_title: "JAK2 unmutated erythrocytosis: current diagnostic approach and therapeutic views."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Workup for hereditary/congenital erythrocytosis requires documentation of family history and laboratory screening for high-oxygen affinity hemoglobin variants, 2, 3 biphosphoglycerate deficiency, and germline mutations that are known to alter cellular oxygen sensing (e.g., PHD2, HIF2A, VHL) or EPO signaling (e.g., EPOR mutations); the latter is uniquely associated with subnormal EPO."
    explanation: >-
      Sets out the diagnostic algorithm for congenital erythrocytosis including
      the VHL oxygen-sensing route.
  - reference: PMID:9058738
    reference_title: Congenital polycythemia in Chuvashia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial and congenital polycythemia, not due to high oxygen affinity hemoglobin or reduced 2,3-diphosphoglycerate in erythrocytes, is common in the Chuvash population of the Russian Federation."
    explanation: >-
      Establishes normal oxygen affinity and normal 2,3-diphosphoglycerate as part
      of the diagnostic signature.
- name: VHL Genetic Testing
  description: >-
    Targeted single-variant testing for VHL c.598C>T is efficient where the allele
    is common; otherwise a congenital erythrocytosis gene panel covering VHL,
    EPAS1, EGLN1, EPOR, the globin genes, and BPGM, escalating to exome or genome
    sequencing. A coding-exon-only assay can miss splice-altering variants
    including those in a cryptic intron-1 exon, so a clean coding VHL result in a
    high-suspicion case is a reason to look further rather than to stop.
  evidence:
  - reference: PMID:37362405
    reference_title: "A Screening Approach for Inherited Erythrocytosis due to the VHL:c.598C > T Mutation (Chuvash Polycythemia)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite a lower frequency (8%) compared to literature, our results suggest that the relatively simpler PCR-RFLP for VHL:c.598C > T mutation may be considered for the initial genetic screening of unexplained, suspected congenital erythrocytosis in regions where Chuvash polycythemia comprises a large proportion of inherited erythrocytosis, after polycythemia vera and common acquired secondary causes are excluded."
    explanation: >-
      Supports targeted single-variant PCR-RFLP as a first-line genetic screen
      where the allele is common, and states the prerequisite exclusions.
  - reference: PMID:29891534
    reference_title: Identification of a new VHL exon and complex splicing alterations in familial erythrocytosis or von Hippel-Lindau disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identify a new VHL cryptic exon (termed E1') deep in intron 1 that is naturally expressed in many tissues."
    explanation: >-
      Identifies the intron-1 cryptic exon that a coding-exon-only assay cannot
      see.
  - reference: PMID:29891534
    reference_title: Identification of a new VHL exon and complex splicing alterations in familial erythrocytosis or von Hippel-Lindau disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we demonstrate a pathogenic role for synonymous mutations in VHL exon 2 that altered splicing through E2-skipping in 5 families with erythrocytosis or VHL disease."
    explanation: >-
      Establishes that synonymous coding variants can be pathogenic through
      splicing, so a clean coding readout does not exclude the diagnosis.
  - reference: PMID:34021251
    reference_title: "JAK2 unmutated erythrocytosis: current diagnostic approach and therapeutic views."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Workup for hereditary/congenital erythrocytosis requires documentation of family history and laboratory screening for high-oxygen affinity hemoglobin variants, 2, 3 biphosphoglycerate deficiency, and germline mutations that are known to alter cellular oxygen sensing (e.g., PHD2, HIF2A, VHL) or EPO signaling (e.g., EPOR mutations); the latter is uniquely associated with subnormal EPO."
    explanation: >-
      Supports the panel composition for congenital erythrocytosis genetic
      testing.
- name: Echocardiographic Screening for Pulmonary Hypertension
  description: >-
    Doppler echocardiography with tricuspid regurgitation velocity, interpreted
    with the caveat that this measure is influenced by blood volume and iron
    status. In the largest cohort the elevation persisted after adjustment for
    left ventricular diastolic and left atrial diameters, so it is not merely a
    volume artifact.
  evidence:
  - reference: PMID:21993671
    reference_title: Pulmonary artery pressure and iron deficiency in patients with upregulation of hypoxia sensing due to homozygous VHL(R200W) mutation (Chuvash polycythemia).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age-adjusted left ventricular diastolic diameter (4.8±0.05 vs. 4.5±0.09 cm, P=0.005) and left atrial diameter (3.4±0.04 vs. 3.2±0.08 cm, P=0.011) were also greater in the VHL(R200W) homozygotes, consistent with increased blood volume, but the elevation in tricuspid regurgitation velocity persisted after adjustment for these variables."
    explanation: >-
      Documents both the confound and the adjustment that survives it.
treatments:
- name: Therapeutic Phlebotomy
  description: >-
    The contested standard of care. Phlebotomy reliably reduces hematocrit and
    relieves hyperviscosity symptoms, and that is the whole of its demonstrated
    benefit. Against it: it causes iron deficiency, low ferritin independently
    predicts higher pulmonary artery pressure, and thrombotic risk is
    paradoxically increased by phlebotomy in this disease. Current expert opinion
    is that cytoreductive therapy should be avoided and phlebotomy is seldom
    warranted, with frequency set by symptom control rather than a hematocrit
    threshold. This is the rare treatment whose target node and harm node are
    different nodes, and the entry models it that way.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: phlebotomy
    term:
      id: NCIT:C28221
      label: Phlebotomy
  target_mechanisms:
  - target: Erythropoietin Excess and Erythroid Expansion
    treatment_effect: INHIBITS
    description: >-
      Phlebotomy removes red cell mass, lowering hematocrit and relieving
      hyperviscosity symptoms. It acts on the erythroid output, not on the
      prothrombotic node that determines outcome.
  evidence:
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phlebotomies reduce hematocrit and hyperviscosity symptoms."
    explanation: >-
      States the demonstrated benefit of phlebotomy, which is symptomatic.
  - reference: PMID:30872370
    reference_title: Re-evaluation of hematocrit as a determinant of thrombotic risk in erythrocytosis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We review studies indicating that the occurrence of thrombosis in Chuvash erythrocytosis is independent of hematocrit, that the thrombotic risk is paradoxically increased by phlebotomy in Chuvash erythrocytosis, and that, when compared to chemotherapy, phlebotomy is associated with increased thrombotic risk in polycythemia vera."
    explanation: >-
      Refutes the thrombosis-prevention rationale for phlebotomy and reports the
      opposite association.
  - reference: PMID:21993671
    reference_title: Pulmonary artery pressure and iron deficiency in patients with upregulation of hypoxia sensing due to homozygous VHL(R200W) mutation (Chuvash polycythemia).
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Among VHL(R200W) homozygotes, phlebotomy therapy was associated with lower serum ferritin concentration, and low ferritin independently predicted higher tricuspid regurgitation velocity (standardized beta=0.29; P=0.009)."
    explanation: >-
      Documents the second harm route, phlebotomy-induced iron deficiency raising
      estimated pulmonary artery pressure.
  - reference: PMID:34021251
    reference_title: "JAK2 unmutated erythrocytosis: current diagnostic approach and therapeutic views."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In general, cytoreductive therapy should be avoided and phlebotomy is seldom warranted where frequency is determined by symptom control rather than Hct threshold."
    explanation: >-
      Current expert position on how, and how little, to use phlebotomy here.
- name: Low-Dose Aspirin
  description: >-
    Widely advised on general cardiovascular grounds, and not demonstrated to
    benefit this disease specifically. Retrospective analyses have not shown
    benefit for either phlebotomy or aspirin, and the authors of those analyses
    call for prospective study.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetylsalicylic acid
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  evidence:
  - reference: PMID:16673284
    reference_title: Vascular complications in Chuvash polycythemia.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Retrospective analyses among patients with Chuvash polycythemia have not shown benefit for therapy with phlebotomy or aspirin, but these and other modes of therapy should be studied prospectively."
    explanation: >-
      Reports the absence of demonstrated benefit for aspirin in retrospective
      analysis, without establishing harm.
  - reference: PMID:34021251
    reference_title: "JAK2 unmutated erythrocytosis: current diagnostic approach and therapeutic views."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although not supported by hard evidence, cardiovascular risk optimization and low-dose aspirin use are often advised."
    explanation: >-
      Records that aspirin is commonly advised while stating that hard evidence is
      lacking, which is exactly the epistemic status this entry assigns it.
- name: Anticoagulation for Documented Thrombosis
  description: >-
    Anticoagulation is used for treatment and secondary prevention of documented
    thrombotic events, following general thrombosis practice rather than any
    disease-specific evidence. There is no controlled evidence on primary
    thromboprophylaxis in this disease, which is a conspicuous gap given that
    thrombosis is what kills people.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  evidence:
  - reference: PMID:16673284
    reference_title: Vascular complications in Chuvash polycythemia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These studies have also shown associations with arterial and venous thrombosis, major bleeding episodes, cerebral vascular events, and premature mortality."
    explanation: >-
      Establishes the thrombotic burden that motivates anticoagulation. PARTIAL
      because it also documents major bleeding episodes, so the risk-benefit
      balance is not settled, and no anticoagulation trial exists in this disease.
- name: HIF-2-alpha Inhibition
  description: >-
    The mechanism-matched therapy, and the most interesting open question in the
    disease. The second-generation allosteric HIF-2-alpha inhibitor belzutifan
    decreased erythropoietin production and reversed polycythemia in three
    relevant mouse models, and also lowered right ventricular pressure and
    mitigated pulmonary hypertension to near wild-type levels. The evidence is
    preclinical. There is a published human case of response in congenital
    polycythemia, but it is a single compound heterozygote rather than an R200W
    homozygote, and the cached record for that report carries no abstract text, so
    it is recorded in notes rather than cited as evidence here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: belzutifan
      term:
        id: NCIT:C135627
        label: Belzutifan
  target_mechanisms:
  - target: Normoxic HIF-alpha Stabilization
    treatment_effect: INHIBITS
    description: >-
      Allosteric inhibition of HIF-2-alpha blocks the dominant effector isoform at
      the node where the disease originates, rather than downstream of it.
  evidence:
  - reference: PMID:33512384
    reference_title: Therapeutic inhibition of HIF-2α reverses polycythemia and pulmonary hypertension in murine models of human diseases.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MK-6482 treatment decreased EPO production and reversed polycythemia in all 3 mouse models."
    explanation: >-
      Establishes reversal of the erythroid phenotype by HIF-2-alpha inhibition in
      the knock-in mouse and two related models.
  - reference: PMID:33512384
    reference_title: Therapeutic inhibition of HIF-2α reverses polycythemia and pulmonary hypertension in murine models of human diseases.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Drug treatment also decreased right ventricular pressure and mitigated pulmonary hypertension in VhlR200W, Irp1-KO, and VhlR200W;Irp1-KO mice to near normal wild-type levels and normalized the movement of the cardiac interventricular septum in VhlR200Wmice."
    explanation: >-
      Extends the preclinical benefit to the pulmonary vascular arm.
- name: Tempol (IRP1-Mediated HIF-2-alpha Repression)
  description: >-
    A mouse-only strategy that works by a different route to the same target.
    Dietary Tempol increases the iron-responsive-element binding activity of Irp1,
    which translationally represses Hif2a. In VhlR200W mice it decreased
    erythropoietin production, corrected splenomegaly, normalized hematocrit, and
    increased lifespan, and the effect was abolished when Irp1 was genetically
    ablated, which is a clean demonstration that the mechanism is the one
    proposed. No human data exist.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Normoxic HIF-alpha Stabilization
    treatment_effect: INHIBITS
    description: >-
      Tempol represses HIF-2-alpha translationally through Irp1, lowering the
      stabilized HIF-2-alpha pool. Demonstrated only in mice.
  evidence:
  - reference: PMID:29480820
    reference_title: Translational repression of HIF2α expression in mice with Chuvash polycythemia reverses polycythemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we fed VhlR200W mice supplemented with Tempol, a small, stable nitroxide molecule and observed that Tempol decreased erythropoietin production, corrected splenomegaly, normalized hematocrit levels, and increased the lifespans of these mice."
    explanation: >-
      Documents the preclinical benefit including a survival effect.
  - reference: PMID:29480820
    reference_title: Translational repression of HIF2α expression in mice with Chuvash polycythemia reverses polycythemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We attribute the reversal of erythrocytosis/polycythemia to translational repression of Hif2α expression by Tempol-mediated increases in the IRE-binding activity of Irp1, as reversal of polycythemia was abrogated in VhlR200W mice in which Irp1 was genetically ablated."
    explanation: >-
      The Irp1-knockout abrogation establishes that the benefit runs through the
      proposed mechanism.
animal_models:
- name: VhlR200W knock-in mouse
  species: Mouse
  genotype: Vhl R200W homozygous knock-in
  description: >-
    A knock-in mouse homozygous for the same R200W substitution, and the workhorse
    of the field. It recapitulates the polycythemia, the enhanced normoxic
    respiration, and the pulmonary hypertension, and it has been the system in
    which the isoform question, the therapeutic questions, and the
    pulmonary-versus-erythroid independence question were all settled.
  publication: PMID:20197624
  modeled_mechanisms:
  - target: Pulmonary Vascular Tone and Remodeling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse develops pulmonary hypertension independently of the polycythemia,
      with vascular remodeling, hemorrhage, edema, and macrophage infiltration, and
      Hif2a heterozygosity suppresses it. This is what establishes the pulmonary
      arm as a parallel branch rather than a consequence of the raised hematocrit.
    limitations: >-
      Older mice additionally develop pulmonary fibrosis, which is not a
      documented feature of the human disease, so the model overshoots on that
      axis. Mouse pulmonary vascular physiology differs from human, and the
      inflammatory component was not suppressed by Hif2a heterozygosity even
      though the vascular changes were.
    evidence:
    - reference: PMID:20197624
      reference_title: The von Hippel-Lindau Chuvash mutation promotes pulmonary hypertension and fibrosis in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice developed pulmonary hypertension independently of polycythemia and enhanced normoxic respiration similar to Chuvash patients, further validating VhlR/R mice as a model for Chuvash disease."
      explanation: >-
        The authors' own validation statement for the model against the human
        phenotype.
  - target: Normoxic HIF-alpha Stabilization
    relationship: PERTURBS
    fidelity: HIGH
    description: >-
      Genetic reduction of Hif2a, but not Hif1a, in this background suppresses both
      the polycythemia and the pulmonary hypertension, which is the experiment that
      assigns isoform responsibility.
    limitations: >-
      Epistasis in the mouse assigns the dominant effector isoform but does not
      exclude a HIF-1-alpha contribution to other arms of the human phenotype,
      notably the metabolic one, and human patients have both isoforms elevated.
    evidence:
    - reference: PMID:20197624
      reference_title: The von Hippel-Lindau Chuvash mutation promotes pulmonary hypertension and fibrosis in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "HIF-2alpha activity was increased in lungs from VhlR/R mice, and heterozygosity for Hif2a, but not Hif1a, genetically suppressed both the polycythemia and pulmonary hypertension in the VhlR/R mice."
      explanation: >-
        The genetic epistasis result establishing HIF-2-alpha as the dominant
        effector.
discussions:
- discussion_id: chuvash_absent_tumor_phenotype
  kind: OPEN_QUESTION
  prompt: >-
    Why does a homozygous germline VHL mutation not cause the tumors that define
    von Hippel-Lindau syndrome?
  attaches_to:
  - pathophysiology#Impaired pVHL Binding to Hydroxylated HIF-alpha
  rationale: >-
    This is an absence with a mechanism, and worth curating as one. Three
    explanations converge. First, dose: R200W is a hypomorph retaining substantial
    pVHL function, whereas classical VHL tumors require much deeper biallelic
    inactivation. Second, sufficiency: the matched cohort found no
    hemangioblastomas, renal carcinomas, or pheochromocytomas despite raised
    HIF-1-alpha and vascular endothelial growth factor, so HIF overexpression is
    not sufficient for tumorigenesis. Third, a preserved HIF-independent function:
    pVHL stabilizes hydroxylated TFAM to sustain mitochondrial biogenesis,
    tumorigenic VHL variants fail to bind hydroxylated TFAM, and the R200W protein
    still binds it. That last result is a clean molecular dissociation between the
    erythrocytosis arm and the oncogenic arm.
  evidence:
  - reference: PMID:14726398
    reference_title: "Congenital disorder of oxygen sensing: association of the homozygous Chuvash polycythemia VHL mutation with thrombosis and vascular abnormalities but not tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinocerebellar hemangioblastomas, renal carcinomas, and pheochromocytomas typical of classical VHL syndrome were not found, suggesting that overexpression of HIF-1alpha and VEGF is not sufficient for tumorigenesis."
    explanation: >-
      The sufficiency argument, stated by the authors from matched-cohort data.
  - reference: PMID:35760869
    reference_title: Impaired oxygen-sensitive regulation of mitochondrial biogenesis within the von Hippel-Lindau syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, cells harbouring the Chuvash polycythaemia VHLR200W mutation, involved in hypoxia-sensing disorders without tumour development, are capable of binding hydroxylated TFAM."
    explanation: >-
      The preserved-function argument: R200W retains the HIF-independent TFAM
      interaction that tumorigenic variants lose.
- discussion_id: chuvash_hif2a_inhibition_outcome_endpoint
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does HIF-2-alpha inhibition reduce thrombosis and mortality in VHL R200W
    homozygotes, or does it only normalize the hematocrit, which is not what kills
    people?
  attaches_to:
  - pathophysiology#Prothrombotic State
  rationale: >-
    Belzutifan reverses polycythemia and pulmonary hypertension in the mouse, and
    a human case of response exists in a compound heterozygote. But the disease's
    own literature has established that hematocrit is not the determinant of
    thrombotic risk, so a therapy validated on hematocrit is being validated on
    the wrong endpoint. The trial that matters would have to be powered on
    thrombotic events, in R200W homozygotes, with erythropoietin rather than
    hematocrit as the intermediate marker. Belzutifan also carries a known anemia
    and hypoxia toxicity profile, and HIF-2-alpha inhibition overshoots easily.
  proposed_experiments:
  - experiment_id: chuvash_hif2a_thrombosis_endpoint_trial
    name: HIF-2-alpha inhibition with a thrombotic-event endpoint
    description: >-
      A controlled trial of HIF-2-alpha inhibition in VHL R200W homozygotes
      powered on incident thrombotic events rather than hematocrit, with serum
      erythropoietin as the mechanistic intermediate and haemoglobin monitored for
      the known overshoot into anemia.
  evidence:
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythropoietin elevation, but not hematocrit or ferritin, correlated with thrombosis risk."
    explanation: >-
      Establishes why a hematocrit endpoint would not answer the question that
      matters.
- discussion_id: chuvash_iron_repletion_question
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should iron be repleted in Chuvash erythrocytosis, given that iron deficiency
    raises pulmonary artery pressure but iron repletion has never been studied in a
    patient with suppressed hepcidin and HIF-driven iron avidity?
  attaches_to:
  - pathophysiology#Hepcidin Suppression and Iron Mobilization
  rationale: >-
    Low ferritin independently predicts higher tricuspid regurgitation velocity,
    and the commonest cause of low ferritin in these patients is the phlebotomy
    their doctors prescribe. The obvious corrective, iron repletion, has not been
    tested in a physiology where hepcidin is suppressed threefold and transferrin
    and transferrin receptor are transcriptionally induced. There is also a signal
    that iron status determines which HIF isoform dominates, so repletion could
    shift the phenotype in a direction that is not simply the reverse of the
    depletion.
  evidence:
  - reference: PMID:21993671
    reference_title: Pulmonary artery pressure and iron deficiency in patients with upregulation of hypoxia sensing due to homozygous VHL(R200W) mutation (Chuvash polycythemia).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lower ferritin concentration, which is associated with phlebotomy, independently predicts higher tricuspid regurgitation velocity (www.clinicaltrials.gov identifier NCT00495638)."
    explanation: >-
      Establishes the harm of the iron-depleted state and its iatrogenic origin,
      which is what makes repletion an urgent open question.
- discussion_id: chuvash_no_controlled_trials
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does any current management of Chuvash erythrocytosis change outcome?
  attaches_to:
  - treatments#Therapeutic Phlebotomy
  rationale: >-
    There are no randomized trials in this disease. Everything in the treatments
    section is cohort inference, expert opinion, mouse data, or single cases. The
    two most-used interventions, phlebotomy and aspirin, have both failed to show
    benefit in retrospective analysis, and phlebotomy is additionally associated
    with harm on two separate axes. The authors of the definitive cohort work
    called for prospective study two decades ago and it has not happened.
  evidence:
  - reference: PMID:16673284
    reference_title: Vascular complications in Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retrospective analyses among patients with Chuvash polycythemia have not shown benefit for therapy with phlebotomy or aspirin, but these and other modes of therapy should be studied prospectively."
    explanation: >-
      States both the absence of demonstrated benefit and the outstanding call for
      prospective evaluation.
differential_diagnoses:
- name: Polycythemia Vera
  description: >-
    The principal differential and the one whose management rules must not be
    carried over. Polycythemia vera is an acquired JAK2-mutated myeloproliferative
    neoplasm with trilineage expansion and low erythropoietin. Chuvash
    erythrocytosis is congenital, JAK2-unmutated, has high or
    inappropriately-normal erythropoietin, and has normal or low white cell and
    platelet counts. Applying the polycythemia vera hematocrit target here is the
    specific error the recent literature warns against.
  distinguishing_features:
  - JAK2 V617F or exon 12 mutation present in polycythemia vera, absent here
  - Erythropoietin low in polycythemia vera, high or inappropriately normal here
  - Leukocytosis and thrombocytosis in polycythemia vera; normal or low counts here
  - Acquired adult onset versus congenital lifelong erythrocytosis
  evidence:
  - reference: PMID:9058738
    reference_title: Congenital polycythemia in Chuvashia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while platelet and white blood cell counts were normal"
    explanation: >-
      The normal platelet and white cell counts are the bedside discriminator from
      the trilineage expansion of polycythemia vera.
- name: Classical von Hippel-Lindau Syndrome
  description: >-
    Same gene, opposite disease. Classical VHL syndrome is autosomal dominant,
    tumor-predominant (hemangioblastoma, clear cell renal cell carcinoma,
    pheochromocytoma), and erythrocytosis is uncommon. Chuvash erythrocytosis is
    recessive, hypomorphic, and has no demonstrated excess cancer risk. Routine
    lifelong VHL tumor surveillance is not standard for R200W homozygotes.
  distinguishing_features:
  - Autosomal dominant heterozygous VHL loss versus homozygous hypomorphic R200W
  - Tumor predisposition versus no demonstrated excess cancer risk
  - Erythrocytosis uncommon versus obligate
  evidence:
  - reference: PMID:16673284
    reference_title: Vascular complications in Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinocerebellar hemangioblastomas, renal carcinomas, and pheochromocytomas typical of classical VHL tumor predisposition syndrome have not been found, and no increased risk of cancer has been demonstrated."
    explanation: >-
      Establishes the absence of the classical VHL tumor spectrum in this disease.
- name: Croatian VHL H191D Homozygous Erythrocytosis
  description: >-
    The other known inherited homozygous VHL erythrocytosis, and phenotypically
    distinct rather than a variant of the same thing. H191D homozygotes have
    higher erythropoietin for age, and their erythroid progenitors are not
    hypersensitive to erythropoietin, unlike R200W. Curating them together would
    obscure exactly the asymmetry that constrains mechanistic models.
  distinguishing_features:
  - VHL c.571C>G p.His191Asp rather than c.598C>T p.Arg200Trp
  - Higher erythropoietin levels for age than R200W patients
  - Erythroid progenitors not hypersensitive to erythropoietin
  evidence:
  - reference: PMID:23403324
    reference_title: "The phenotype of polycythemia due to Croatian homozygous VHL (571C>G:H191D) mutation is different from that of Chuvash polycythemia (VHL 598C>T:R200W)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that erythropoietin levels in homozygous VHL H191D individuals are higher than in VHL R200W patients of similar ages, and their native erythroid progenitors, unlike Chuvash R200W, are not hypersensitive to erythropoietin."
    explanation: >-
      Documents the two phenotypic discriminators between the genotypes.
- name: EPOR-Related and High-Oxygen-Affinity Erythrocytosis
  description: >-
    The other congenital erythrocytoses, separated by two cheap tests.
    EPOR-truncation erythrocytosis is autosomal dominant with uniquely subnormal
    erythropoietin. High-oxygen-affinity hemoglobin variants and 2,3-BPG
    deficiency give a left-shifted p50, which is normal in Chuvash erythrocytosis.
  distinguishing_features:
  - Subnormal erythropoietin in EPOR-related erythrocytosis
  - Left-shifted p50 in high-affinity hemoglobinopathy and BPGM deficiency
  - Autosomal dominant transmission in EPOR and most high-affinity variants
  evidence:
  - reference: PMID:34021251
    reference_title: "JAK2 unmutated erythrocytosis: current diagnostic approach and therapeutic views."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Workup for hereditary/congenital erythrocytosis requires documentation of family history and laboratory screening for high-oxygen affinity hemoglobin variants, 2, 3 biphosphoglycerate deficiency, and germline mutations that are known to alter cellular oxygen sensing (e.g., PHD2, HIF2A, VHL) or EPO signaling (e.g., EPOR mutations); the latter is uniquely associated with subnormal EPO."
    explanation: >-
      Sets out the discriminating tests and the uniquely subnormal erythropoietin
      of EPOR-related disease.
notes: >-
  The hematocrit point is the load-bearing one. The intuitive causal chain, high
  hematocrit to viscous blood to clots, is wrong in this disease, and the
  pathograph is built to say so: the edge to the prothrombotic state runs from HIF
  target gene activation directly, in parallel with the erythroid arm rather than
  through it. Erythropoietin elevation, not hematocrit and not ferritin, is what
  correlated with thrombosis over eleven years of prospective follow-up.

  Belzutifan. There is a published human case of response to belzutifan in
  VHL-related congenital polycythemia (PMID:39113647), but two things keep it out
  of the evidence blocks. The patient was a compound heterozygote (R200W plus
  c.562C>G), not a Chuvash R200W homozygote, and the cached record for that report
  has no retrievable abstract text, so there is nothing quotable. The treatment
  entry therefore carries only the mouse evidence and says so.

  Two further sources could not be quoted for the same reason. PMID:31289208, the
  letter whose title states outright that thrombotic risk is not associated with
  elevated hematocrit, caches with no content, so that claim is carried by
  PMID:30872370 and PMID:37435906 instead, which state it in their abstracts.

  Module conformance. The pulmonary node declares conformance to
  pulmonary_vascular_remodeling. Conformance to thrombogenesis was considered and
  deliberately not declared: the evidence here is for elevated plasminogen
  activator inhibitor-1, vascular endothelial growth factor, and endothelin-1 with
  a prothrombotic transcriptional milieu, which is not the same claim as the
  module's coagulation-cascade and thrombin-driven fibrin node, and asserting it
  would overstate what the cited abstracts establish.

  Prevalence. Orphanet records worldwide prevalence as unknown and not yet
  validated. The endemic allele frequencies (0.070 Ischia, 0.057 Chuvashia) are
  recorded as a carrier-frequency measure rather than converted to a homozygote
  prevalence, because that conversion would be Hardy-Weinberg arithmetic rather
  than a published figure.

  Deep research. Curated from a claude_code deep-research report
  (research/Chuvash_Polycythemia-deep-research-claude_code.md), whose own
  reference validation reported 52/52 references verified, 15/15 quotes valid, and
  a confabulation rate of 0.0. Every snippet used here was independently
  re-verified against the cached PubMed record.

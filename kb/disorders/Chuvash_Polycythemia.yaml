name: Chuvash Polycythemia
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
parents:
- Congenital Secondary Erythrocytosis
- Disorder of Oxygen Sensing
disease_term:
  preferred_term: Chuvash Polycythemia
  term:
    id: MONDO:0009892
    label: Chuvash polycythemia
synonyms:
- Chuvash erythrocytosis
- VHL-related polycythemia
- von Hippel-Lindau-dependent polycythemia
- erythrocytosis, familial, 2
- ECYT2
description: >-
  Chuvash polycythemia is the first recognized congenital disorder of oxygen
  sensing. Homozygosity for a single VHL missense allele, c.598C>T
  (p.Arg200Trp), weakens the grip of the von Hippel-Lindau protein on the
  hypoxia-inducible transcription factors it normally tags for destruction. The
  cell's oxygen thermostat never fully stands down: HIF-1-alpha and HIF-2-alpha
  accumulate at ordinary room air, erythropoietin runs about tenfold high for the
  hemoglobin, red cell mass climbs, pulmonary vascular tone stays elevated, and
  basal ventilation runs fast, all as though the patient lived permanently at
  altitude. Two things make this disease unusual. First, it is a VHL disease that
  does not cause the tumors VHL disease is famous for, because R200W is a
  hypomorph that retains substantial pVHL function including the HIF-independent
  mitochondrial arm. Second, and clinically decisive, the thrombosis that
  dominates morbidity and mortality is not driven by the high hematocrit:
  prospective cohort data show erythropoietin elevation, but not hematocrit,
  correlates with thrombotic risk, and phlebotomy is associated with increased
  rather than decreased risk. Hemoglobin-oxygen affinity is normal, and white
  cell and platelet counts are normal or low, which is what separates this from
  polycythemia vera at the bedside.
pathophysiology:
- name: Impaired pVHL Binding to Hydroxylated HIF-alpha
  biological_scale: MOLECULAR
  description: >-
    pVHL is the substrate-recognition subunit of a Cullin-2 RING E3 ubiquitin
    ligase. Under normal oxygen tension, prolyl hydroxylases hydroxylate
    conserved prolines in HIF-1-alpha and HIF-2-alpha, pVHL binds the
    hydroxyproline, and the HIF-alpha subunit is polyubiquitinated and destroyed
    by the proteasome. The Arg200Trp substitution weakens that interaction. It
    does not abolish it, and that distinction carries the whole disease: a
    hypomorph produces a chronically mis-set oxygen thermostat, where a null
    would produce the tumor syndrome.
  genes:
  - preferred_term: VHL
    term:
      id: hgnc:12687
      label: VHL
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: proteasome-mediated degradation of HIF-alpha
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  - preferred_term: HIF-alpha ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  downstream:
  - target: Normoxic HIF-alpha Stabilization
    description: >-
      Reduced pVHL binding slows HIF-alpha degradation, so HIF-alpha accumulates
      despite normal oxygen tension.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_hif_stabilization
  evidence:
  - reference: PMID:12415268
    reference_title: Disruption of oxygen homeostasis underlies congenital Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data indicate that the Arg200Trp substitution impairs the interaction of VHL with HIF1alpha, reducing the rate of degradation of HIF1alpha and resulting in increased expression of downstream target genes including EPO (encoding erythropoietin), SLC2A1 (also known as GLUT1, encoding solute carrier family 2 (facilitated glucose transporter), member 1), TF (encoding transferrin), TFRC (encoding transferrin receptor (p90, CD71)) and VEGF (encoding vascular endothelial growth factor)."
    explanation: >-
      The discovery paper establishing that R200W impairs pVHL-HIF binding and
      slows HIF-alpha degradation.
  - reference: PMID:37435906
    reference_title: Increased transferrin protects from thrombosis in Chuvash erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation impairs binding of VHL to HIF-α subunits and therefore decreases ubiquitin-mediated degradation."
    explanation: >-
      Restates the molecular lesion as impaired binding with consequent reduced
      ubiquitin-mediated degradation.
- name: Normoxic HIF-alpha Stabilization
  biological_scale: MOLECULAR
  description: >-
    HIF-1-alpha and HIF-2-alpha accumulate and dimerize with HIF-1-beta at normal
    oxygen tension. The cell believes it is short of oxygen while sitting in
    ordinary room air, which is why the whole phenotype reads as permanent
    altitude acclimatization. Both isoforms are elevated in patients, but they are
    not interchangeable: mouse genetics show heterozygosity for Hif2a, and not
    Hif1a, suppresses both the polycythemia and the pulmonary hypertension, so
    HIF-2-alpha is the dominant effector for the erythroid and pulmonary-vascular
    arms.
  biological_processes:
  - preferred_term: normoxic hypoxia response
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: HIF Target Gene Program Activation
    description: >-
      Stabilized HIF-alpha dimers drive transcription of the hypoxia-response
      program despite normoxia.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_hif_stabilization
  - target: Pulmonary Vascular Tone and Remodeling
    description: >-
      HIF-2-alpha activity drives the pulmonary vascular phenotype, which mouse
      genetics show develops independently of the polycythemia.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_hif_stabilization
  evidence:
  - reference: PMID:21876117
    reference_title: Chuvash polycythemia VHLR200W mutation is associated with down-regulation of hepcidin expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VHL(R200W) homozygotes have elevated hypoxia-inducible factor 1α (HIF-1α) and HIF-2α levels, increased red cell mass, propensity to thrombosis, and early mortality."
    explanation: >-
      Confirms that both HIF-alpha isoforms are elevated in patients, not just
      HIF-1-alpha as the original discovery paper framed it.
  - reference: PMID:20197624
    reference_title: The von Hippel-Lindau Chuvash mutation promotes pulmonary hypertension and fibrosis in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HIF-2alpha activity was increased in lungs from VhlR/R mice, and heterozygosity for Hif2a, but not Hif1a, genetically suppressed both the polycythemia and pulmonary hypertension in the VhlR/R mice."
    explanation: >-
      Genetic epistasis in the knock-in mouse establishing HIF-2-alpha rather than
      HIF-1-alpha as the dominant effector isoform.
- name: HIF Target Gene Program Activation
  biological_scale: MOLECULAR
  description: >-
    The stabilized HIF dimers transcribe the full hypoxia-response program at
    normal oxygen: erythropoietin, the glucose transporter SLC2A1, transferrin and
    its receptor, vascular endothelial growth factor, and endothelin-1. This is
    the fan-out point of the disease, and it is why a single amino-acid change
    produces phenotypes in blood, lung, vasculature, iron handling, and muscle
    metabolism at once. Note that hypoxic regulation itself remains intact and
    correctly shaped; only the setpoint has moved.
  biological_processes:
  - preferred_term: cellular response to hypoxia
    term:
      id: GO:0071456
      label: cellular response to hypoxia
    modifier: INCREASED
  downstream:
  - target: Erythropoietin Excess and Erythroid Expansion
    description: >-
      Transcriptional induction of EPO raises circulating erythropoietin about
      tenfold for the prevailing hemoglobin.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_hif_stabilization
  - target: Prothrombotic State
    description: >-
      HIF-driven signaling, indexed clinically by the erythropoietin elevation,
      is what tracks thrombotic risk. This edge runs in parallel with the
      erythroid arm rather than through it.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_hif_stabilization
  - target: Hepcidin Suppression and Iron Mobilization
    description: >-
      Transferrin and transferrin receptor induction together with hepcidin
      suppression reconfigure systemic iron handling.
    causal_link_type: DIRECT
  - target: Metabolic Reprogramming Toward Glycolysis
    description: >-
      Induction of glycolytic enzymes and pyruvate dehydrogenase kinase shifts
      substrate use toward glycolysis.
    causal_link_type: DIRECT
  - target: Increased Solid Organ Size
    description: >-
      HIF-2-alpha-driven proliferation with reduced p21 enlarges liver, spleen,
      and kidney relative to body mass.
  evidence:
  - reference: PMID:12415268
    reference_title: Disruption of oxygen homeostasis underlies congenital Chuvash polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data indicate that the Arg200Trp substitution impairs the interaction of VHL with HIF1alpha, reducing the rate of degradation of HIF1alpha and resulting in increased expression of downstream target genes including EPO (encoding erythropoietin), SLC2A1 (also known as GLUT1, encoding solute carrier family 2 (facilitated glucose transporter), member 1), TF (encoding transferrin), TFRC (encoding transferrin receptor (p90, CD71)) and VEGF (encoding vascular endothelial growth factor)."
    explanation: >-
      Enumerates the induced target genes that constitute this node.
  - reference: PMID:14726398
    reference_title: "Congenital disorder of oxygen sensing: association of the homozygous Chuvash polycythemia VHL mutation with thrombosis and vascular abnormalities but not tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, Chuvash polycythemia is a distinct VHL syndrome manifested by thrombosis, vascular abnormalities, and intact hypoxic regulation despite increased basal expression of hypoxia-regulated genes."
    explanation: >-
      Establishes that basal hypoxia-gene expression is raised while hypoxic
      regulation itself remains intact, which is the defining shape of this node.
- name: Erythropoietin Excess and Erythroid Expansion
  biological_scale: TISSUE
  description: >-
    Circulating erythropoietin is roughly tenfold higher than in matched controls
    after adjusting for hemoglobin, yet the response to acute hypoxia is
    identical to normal, so the axis is intact and merely reset. Erythroid
    progenitors expand in marrow and, at least in the mouse model, in spleen.
    Erythroid progenitors from R200W homozygotes are additionally hypersensitive
    to erythropoietin, an asymmetry that is not shared by the Croatian H191D
    genotype. Note the discriminator from polycythemia vera: white cell and
    platelet counts are normal, indeed often lower than controls, rather than
    expanded.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  - preferred_term: kidney interstitial fibroblast
    term:
      id: CL:1000692
      label: kidney interstitial fibroblast
  biological_processes:
  - preferred_term: erythrocyte differentiation
    term:
      id: GO:0030218
      label: erythrocyte differentiation
    modifier: INCREASED
  locations:

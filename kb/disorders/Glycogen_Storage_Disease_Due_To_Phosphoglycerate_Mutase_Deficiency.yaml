name: Glycogen Storage Disease Due To Phosphoglycerate Mutase Deficiency
creation_date: "2026-09-28T20:00:00Z"
description: >-
  Glycogen storage disease type X (GSD X, muscle phosphoglycerate mutase
  deficiency) is a rare autosomal recessive metabolic myopathy caused by biallelic
  PGAM2 variants. PGAM2 encodes the muscle (M) subunit of phosphoglycerate mutase,
  the glycolytic enzyme that converts 3-phosphoglycerate to 2-phosphoglycerate;
  adult skeletal muscle relies almost exclusively on the MM homodimer, so loss of
  the M subunit leaves only a small residual activity carried by the brain (BB)
  isoenzyme and partially blocks terminal glycolysis in muscle. Patients are
  typically asymptomatic at rest and during sustained moderate exercise, but brief
  strenuous efforts trigger exercise intolerance, myalgia, cramps or contractures,
  and episodes of rhabdomyolysis with myoglobinuria. Serum creatine kinase is often
  raised between episodes, and muscle biopsy frequently shows tubular aggregates,
  a feature that distinguishes GSD X from the other glycogenoses. Most reported
  patients are African American and carry the recurrent p.Trp78Ter allele, but the
  disorder has since been described in several other populations, and some
  heterozygous carriers are symptomatic.

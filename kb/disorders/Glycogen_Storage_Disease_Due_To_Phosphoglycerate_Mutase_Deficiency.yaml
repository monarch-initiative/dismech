  - reference: PMID:19273759
    reference_title: Muscle phosphoglycerate mutase deficiency revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathological studies of muscle showed mild glycogen accumulation but
      prominent tubular aggregates in both patients.
    explanation: Tubular aggregates in two patients of non-African ancestry.
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most striking peculiarity of GSD X is its common association with tubular

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intermediate PGAM activities (39 and 50% of normal) were found in muscle
      biopsies from the patient's asymptomatic parents.
    explanation: >-
      Half-normal enzyme activity in both asymptomatic parents of an affected
      proband is the carrier pattern expected of recessive transmission.
  - reference: PMID:6308514

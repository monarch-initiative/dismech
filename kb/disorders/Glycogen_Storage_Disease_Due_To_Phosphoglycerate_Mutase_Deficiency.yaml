  downstream:
  - target: Exertional Muscle Energy Failure
    description: >-
      The partial block limits glycolytic ATP supply when demand is highest, during
      brief intense (glycolytic) exercise; oxidative metabolism and sustained
      moderate exercise are comparatively preserved.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8006681
      reference_title: "Muscle phosphoglycerate mutase (PGAM) deficiency in the first Caucasian patient: biochemistry, muscle culture and 31P-MR spectroscopy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Muscle 31P-MR spectroscopy showed accumulation of phosphomonoesters only on
        fast "glycolytic" exercise.
      explanation: >-
        The metabolic consequence of the block is exposed only by glycolytic
        exercise, which is when the energy shortfall arises.
  - target: Increased muscle glycogen content
    description: >-
      Impaired glycolytic disposal of glycogen-derived carbon leads to mild glycogen
      storage in muscle.
    causal_link_type: DIRECT
  - target: Blunted lactate response to forearm exercise
    description: >-
      Reduced flux through the lower glycolytic pathway lowers lactate output from
      exercising muscle in most patients.
    causal_link_type: DIRECT
- name: Exertional Muscle Energy Failure
  biological_scale: CELLULAR
  description: >-
    An ATP shortfall in glycolytic (type 2) muscle fibres during brief, strenuous
    effort. Patients are typically asymptomatic otherwise; cycle exercise and
    oxidative capacity are virtually normal, and unlike McArdle disease there is no
    second-wind phenomenon. This is the metabolic event that produces exercise
    intolerance and myalgia, and in more severe episodes proceeds to contracture
    and fibre necrosis.
  cell_types:
  - preferred_term: fast muscle cell
    term:
      id: CL:0000190
      label: fast muscle cell
  biological_processes:
  - preferred_term: glycolytic ATP biosynthesis
    modifier: DECREASED
    term:
      id: GO:0006754
      label: ATP biosynthetic process
  evidence:
  - reference: PMID:23169535
    reference_title: Phosphoglycerate mutase deficiency with tubular aggregates in a patient from Panama.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, patients with PGAM deficiency are asymptomatic, except when they
      engage in brief, strenuous efforts, which may trigger myalgias, cramps, muscle
      necrosis, and myoglobinuria.
    explanation: >-
      States that symptoms arise specifically from brief strenuous effort, the
      condition under which the energy shortfall occurs.
  - reference: PMID:16157752
    reference_title: Effect of fuels on exercise capacity in muscle phosphoglycerate mutase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in patients with PGAMD, cycle exercise and oxidative capacity are virtually
      normal, a second wind does not occur, and lipid and lactate supplements do
      not improve exercise capacity.
    explanation: >-
      Controlled exercise physiology in two patients showing that the energy
      failure is confined to high-intensity effort and is not a general oxidative
      deficit.
  - reference: PMID:2987758
    reference_title: "Physiologic assessment of phosphoglycerate mutase deficiency: incremental exercise test."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the patients with phosphorylase deficiency, the PGAM-deficient
      patient achieved near-normal levels of maximal exercise and produced a normal
      peak lactate after exercise.
    explanation: >-
      An independent patient with near-normal incremental exercise capacity,
      consistent with an energy deficit restricted to brief intense effort.
  downstream:
  - target: Exercise intolerance
    description: Glycolytic ATP shortfall limits brief strenuous effort.
    causal_link_type: DIRECT
  - target: Exercise-induced myalgia
    description: Exertional energy failure produces muscle pain during and after effort.
    causal_link_type: DIRECT
  - target: Sarcoplasmic Reticulum Calcium Handling Imbalance
    description: >-
      Inferred step, proposed from a single patient's findings and not demonstrated
      directly: an exertional energy deficit is taken to impair ATP-dependent
      calcium re-uptake by the sarcoplasmic reticulum relative to calcium release.
    causal_link_type: UNKNOWN
  - target: Myofiber Necrosis and Rhabdomyolysis
    description: >-
      When the energy shortfall is severe enough, the muscle fibre breaks down.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23169535
      reference_title: Phosphoglycerate mutase deficiency with tubular aggregates in a patient from Panama.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinically, patients with PGAM deficiency are asymptomatic, except when they
        engage in brief, strenuous efforts, which may trigger myalgias, cramps,
        muscle necrosis, and myoglobinuria.
      explanation: >-
        Names muscle necrosis as a consequence of the same brief strenuous efforts
        that expose the energy deficit.
- name: Sarcoplasmic Reticulum Calcium Handling Imbalance
  biological_scale: CELLULAR
  description: >-
    Proposed mechanism for the cramps and contractures of GSD X, and possibly for
    its characteristic tubular aggregates, which are stacks of tubules derived
    from the sarcoplasmic reticulum. In one patient, muscle calcium content and
    Ca2+-ATPase activity were increased, and dantrolene, which inhibits calcium
    release from the sarcoplasmic reticulum, abolished exertional contractures.
    The authors inferred that cramps result from calcium release that outstrips
    re-uptake capacity. The trigger for tubular aggregate formation in GSD X is
    unknown.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    term:

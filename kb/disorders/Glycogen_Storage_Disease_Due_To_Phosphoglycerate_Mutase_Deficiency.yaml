prevalence:
- population: Global published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A time-bounded count of reported patients (14 by 2011-2013), not a population
    prevalence estimate. Further patients have been reported since through exome
    and gene-panel sequencing of rhabdomyolysis and tubular-aggregate myopathy
    cohorts, and one report argues the disorder may be underdiagnosed.
  evidence:
  - reference: PMID:23169535
    reference_title: Phosphoglycerate mutase deficiency with tubular aggregates in a patient from Panama.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PGAM deficiency has been reported in 14 patients, 9 of whom were of
      African-American ethnicity, and in 5 (36%) tubular aggregates were seen on
      muscle biopsy.
    explanation: >-
      Direct published patient count as of 2013.
  - reference: PMID:19783439
    reference_title: Unusual presentation of phosphoglycerate mutase deficiency due to two different mutations in PGAM-M gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggests that the frequency of this metabolic myopathy may be underestimated
    explanation: >-
      Supports the note that the literature count is likely an underestimate.
pathophysiology:
- name: Muscle Phosphoglycerate Mutase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic PGAM2 variants (nonsense, frameshift and missense) abolish or severely
    reduce the M subunit of phosphoglycerate mutase. Because normal adult muscle
    derives about 95% of its PGAM activity from the MM homodimer, residual activity
    in patient muscle is typically 3-10% of normal and is carried by the BB
    isoenzyme. Tissues that rely on the BB isoenzyme, including cultured aneural
    muscle cells, are spared, which explains why the disease is confined to
    skeletal muscle.
  genes:
  - preferred_term: PGAM2
    term:
      id: hgnc:8889
      label: PGAM2
  molecular_functions:
  - preferred_term: phosphoglycerate mutase activity
    modifier: DECREASED
    term:
      id: GO:0004619
      label: phosphoglycerate mutase activity
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:8447317
    reference_title: The molecular genetic basis of muscle phosphoglycerate mutase (PGAM) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The glycolytic enzyme phosphoglycerate mutase (PGAM) is a dimer, and mature
      human skeletal muscle contains almost exclusively the MM form of the enzyme,
      PGAM-M.
    explanation: >-
      Establishes that muscle depends on the M-subunit homodimer, so a PGAM2 defect
      is not buffered in muscle by another isoform.
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Normal adult human muscle contains predominantly the MM homodimer, which
      accounts for about 95% of the total activity.
    explanation: >-
      Review statement quantifying the M-subunit contribution to muscle PGAM
      activity.
  - reference: PMID:6262916
    reference_title: "Human muscle phosphoglycerate mutase deficiency: newly discovered metabolic myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophoretic, heat lability, and mercury inhibition studies showed that the
      small residual activity in the patient's muscle was represented by the brain
      (BB) isoenzyme of phosphoglycerate mutase, suggesting a genetic defect of the M
      subunit which predominates in normal muscle.
    explanation: >-
      Index-case demonstration that the residual activity is BB isoenzyme, locating
      the defect in the M subunit.
  - reference: PMID:16881065
    reference_title: "Exercise-induced cramp, myoglobinuria, and tubular aggregates in phosphoglycerate mutase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle PGAM activities were markedly decreased (3% of the normal mean) and
      molecular genetic studies showed that both patients were homozygous for a
      described missense mutation (W78X).
    explanation: >-
      Links the recurrent PGAM2 allele to a severe loss of muscle enzyme activity.
      W78X is a nonsense (stop-gain) allele although the abstract calls it
      missense.
  - reference: PMID:8006681
    reference_title: "Muscle phosphoglycerate mutase (PGAM) deficiency in the first Caucasian patient: biochemistry, muscle culture and 31P-MR spectroscopy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to the marked decrease of PGAM activity observed in muscle biopsy,
      total enzyme activity in the patient's aneural muscle culture was normal, being
      represented exclusively by BB isoenzyme.
    explanation: >-
      Patient-derived cultured muscle, which expresses the BB isoenzyme, has normal
      total activity, showing why the defect is expressed only in mature muscle.
  downstream:
  - target: Partial Terminal Glycolytic Block
    description: >-
      Loss of PGAM activity interrupts glycolysis at the 3-phosphoglycerate to
      2-phosphoglycerate step. The block is partial because of the residual BB
      isoenzyme activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:6308514
      reference_title: "Muscle phosphoglycerate mutase (PGAM) deficiency: a second case."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Studies of anaerobic glycolysis in vitro showed decreased lactate production
        with glycogen, and with all hexose phosphate glycolytic intermediates, which
        was corrected by addition of purified PGAM to the reaction mixtures.
      explanation: >-
        Adding back purified PGAM restores glycolytic lactate output in patient
        muscle extract, showing that the enzyme deficit is what limits glycolytic
        flux.
- name: Partial Terminal Glycolytic Block
  biological_scale: CELLULAR
  description: >-
    Reduced glycolytic flux distal to phosphofructokinase in skeletal muscle, with
    accumulation of upstream sugar phosphates during glycolytic exercise and mild
    storage of glycogen. Because the residual BB isoenzyme activity is not
    negligible, the block is partial: sugar phosphates are cleared faster than in
    complete glycolytic blocks, and exercise lactate production is blunted in most
    but not all patients.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: glycolytic process
    modifier: DECREASED
    term:
      id: GO:0006096
      label: glycolytic process
  evidence:

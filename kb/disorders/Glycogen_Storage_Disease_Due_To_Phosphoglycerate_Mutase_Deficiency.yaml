  rationale: >-
    The genetically modified phosphoglycerate mutase mice reported are a Pgam1
    knockout, which is embryonic lethal when homozygous, and a Pgam2
    overexpressing transgenic; neither models loss of the muscle isoform. Without a
    Pgam2 loss-of-function model, the exertional energy deficit, the calcium
    imbalance and tubular aggregate formation cannot be studied experimentally.

    explanation: A missense genotype (R90W) in the first Caucasian patient.
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

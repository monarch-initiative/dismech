- name: Elevated circulating creatine kinase activity
  description: >-
    Serum CK rises steeply during rhabdomyolysis and is often mildly raised between
    episodes. Persistent hyperCKemia can be the presenting finding in otherwise
    asymptomatic individuals.
  phenotype_term:
    preferred_term: Elevated circulating creatine kinase activity
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase activity
  evidence:
  - reference: PMID:16881065
    reference_title: "Exercise-induced cramp, myoglobinuria, and tubular aggregates in phosphoglycerate mutase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum creatine kinase (CK) levels were elevated between attacks of
      myoglobinuria.
    explanation: Interictal CK elevation in two patients.
  - reference: PMID:23169535
    reference_title: Phosphoglycerate mutase deficiency with tubular aggregates in a patient from Panama.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an African-American patient from Panama with partial deficiency of
      PGAM who presented with asymptomatic elevation of creatine kinase levels and
      tubular aggregates on muscle biopsy.
    explanation: >-
      HyperCKemia as the presenting finding in an initially asymptomatic patient,
      who was heterozygous for the codon 78 variant.
  - reference: PMID:30397902
    reference_title: Myopathies Related to Glycogen Metabolism Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The serum creatine kinase (CK) is often elevated in the myopathic forms and in
      PYGM deficiency, but can be normal and increase only with rhabdomyolysis
      (PGAM2, PFK, ENO3).
    explanation: >-
      Class-level review noting that in PGAM2 deficiency CK can also be normal
      between episodes, which is why this phenotype carries no frequency.
- name: Muscle fiber tubular aggregates
  description: >-
    Subsarcolemmal tubular aggregates in type 2 fibres, seen in about a third of
    reported biopsies. They have not been reported in the other glycogenoses, so
    the combination of exercise-induced cramps, recurrent myoglobinuria and tubular
    aggregates is highly suggestive of PGAM deficiency.
  phenotype_term:
    preferred_term: Muscle fiber tubular aggregates
    term:
      id: HP:0100301
      label: Muscle fiber tubular inclusions
  frequency: FREQUENT
  evidence:
  - reference: PMID:23169535
    reference_title: Phosphoglycerate mutase deficiency with tubular aggregates in a patient from Panama.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PGAM deficiency has been reported in 14 patients, 9 of whom were of
      African-American ethnicity, and in 5 (36%) tubular aggregates were seen on
      muscle biopsy.
    explanation: >-
      5 of 14 reported patients (36%) had tubular aggregates, which places the
      feature in the FREQUENT (30-79%) band.
  - reference: PMID:16881065
    reference_title: "Exercise-induced cramp, myoglobinuria, and tubular aggregates in phosphoglycerate mutase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle biopsies showed subsarcolemmal tubular aggregates in type 2 fibers.

      whereas they have never been reported in other glycogenoses.
    explanation: >-
      Review establishing tubular aggregates as the distinguishing pathological
      feature of GSD X among the glycogenoses.
- name: Increased muscle glycogen content
  description: >-
    Mild increase in muscle glycogen on biopsy, up to about twice normal. It is not

  description: >-
    Affected individuals are homozygous or compound heterozygous for PGAM2 variants,
    and obligate carrier parents show intermediate muscle enzyme activity. Some
    heterozygous carriers are nonetheless symptomatic (manifesting heterozygotes),
    with exercise intolerance and cramps but a milder course.

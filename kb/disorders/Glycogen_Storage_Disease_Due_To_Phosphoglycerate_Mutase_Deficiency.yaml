genetic:
- name: PGAM2 pathogenic variants
  gene_term:
    preferred_term: PGAM2
    term:
      id: hgnc:8889
      label: PGAM2
  association: Causative
  notes: >-
    Reported variants include the recurrent nonsense allele p.Trp78Ter (c.233G>A),
    found at least heterozygously in the African American patients studied
    (suggesting a founder effect), and p.Glu89Ala, p.Arg90Trp, p.Gly97Asp, c.278G>A,
    p.Tyr142Ter, p.Gly178Alafs*31, p.Met230Hisfs*6, p.Gly213Arg and p.Arg10Gln, among
    others. Most patients are homozygous or compound heterozygous; heterozygous
    carriers of p.Gly97Asp and of the codon 78 variant have been symptomatic or had
    partial enzyme deficiency.
  evidence:
  - reference: PMID:8447317
    reference_title: The molecular genetic basis of muscle phosphoglycerate mutase (PGAM) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients were homozygous for an identical G-to-A transition converting
      an encoded Trp to an in-frame stop codon (codon 78).
    explanation: The recurrent W78X allele, homozygous in three patients.
  - reference: PMID:8447317
    reference_title: The molecular genetic basis of muscle phosphoglycerate mutase (PGAM) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

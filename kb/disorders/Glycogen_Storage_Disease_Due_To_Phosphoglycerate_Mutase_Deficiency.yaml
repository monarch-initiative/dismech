notes: >-
  Scope. This entry covers muscle phosphoglycerate mutase (PGAM2) deficiency. It is
  distinct from the other distal glycolytic myopathies with a similar clinical
  picture, namely phosphoglycerate kinase (PGK1), beta-enolase (ENO3) and aldolase
  A deficiencies, and from McArdle disease (PYGM), from which it differs by the
  lack of a second-wind phenomenon and by near-normal cycle exercise capacity.

  Claims not asserted here. Non-spherocytic hemolytic anemia appears in some
  database summaries of this disease, but no PGAM2-deficient patient in the
  literature cited here has it, and its absence fits the sparing of tissues that
  use the BB isoenzyme; it is omitted. Hyperuricemia, gout, coronary
  arteriosclerosis and renal failure are listed in some secondary summaries, but
  no primary report cited here documents them in a PGAM2-deficient patient, so
  they are omitted rather than asserted. One patient had interventricular septal
  hypertrophy (PMID:8006681); cardiac involvement has not been established and is
  not curated as a phenotype.

  No GeneReviews chapter covers this disorder.

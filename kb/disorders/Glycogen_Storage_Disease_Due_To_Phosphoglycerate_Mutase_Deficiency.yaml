discussions:
- discussion_id: gap_gsd10_tubular_aggregate_trigger
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does PGAM deficiency, alone among the glycogenoses, produce tubular
    aggregates, and does the sarcoplasmic reticulum calcium imbalance reported in
    one patient explain both the aggregates and the contractures?
  attaches_to:
  - "pathophysiology#Sarcoplasmic Reticulum Calcium Handling Imbalance"
  rationale: >-
    Tubular aggregates are seen in about a third of GSD X biopsies and have not
    been reported in other glycogenoses, yet the trigger is unknown. The only
    mechanistic data come from one patient with increased muscle calcium and
    Ca2+-ATPase activity whose contractures resolved on dantrolene. The edge from
    exertional energy failure to calcium imbalance in this entry is therefore
    inferred rather than demonstrated.
  proposed_experiments:
  - experiment_id: exp_gsd10_sr_calcium_multi_patient
    name: Sarcoplasmic reticulum calcium handling in a series of PGAM2-deficient muscle biopsies
    description: >-
      Measure SR calcium uptake and release, Ca2+-ATPase activity and total calcium
      in biopsies from several genetically confirmed patients with and without
      tubular aggregates, to test whether the single-patient finding generalises
      and tracks with aggregate formation.
  evidence:
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

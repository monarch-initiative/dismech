diagnosis:
- name: Muscle biopsy with phosphoglycerate mutase enzymology
  description: >-
    Muscle biopsy shows reduced PGAM activity with normal activities of the other
    glycolytic enzymes, and often tubular aggregates in type 2 fibres. Light
    microscopy can be nearly normal. The clinical triad of exercise-induced cramps,
    recurrent myoglobinuria and tubular aggregates on biopsy is highly suggestive
    of the diagnosis.
  evidence:
  - reference: PMID:16881065
    reference_title: "Exercise-induced cramp, myoglobinuria, and tubular aggregates in phosphoglycerate mutase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this clinicopathological triad is highly suggestive of PGAM deficiency
    explanation: >-
      Based on 15 literature cases and 15 tubular-aggregate biopsies from the
      authors' laboratory.
  - reference: PMID:19783439
    reference_title: Unusual presentation of phosphoglycerate mutase deficiency due to two different mutations in PGAM-M gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle biopsy showed only mild abnormalities, but biochemical study revealed a
      defect of PGAM and genetic analysis showed two different mutations in the
      PGAM-M gene.
    explanation: >-
      Shows that a near-normal biopsy does not exclude the diagnosis and that
      enzymology is needed.
- name: Molecular genetic testing of PGAM2
  description: >-
    Sequencing of PGAM2, increasingly through neuromuscular or rhabdomyolysis gene
    panels and exome sequencing, confirms the diagnosis and can replace muscle
    biopsy when clinical suspicion is high.
  evidence:
  - reference: PMID:39463617
    reference_title: "Recurrent Myalgia, Dark Urine, and Exercise Intolerance: Glycogen Storage Disease Type X Diagnosed Through Gene Sequencing Panel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA sequencing-based gene panel testing can serve as a non-invasive
      alternative to muscle biopsy for diagnosing metabolic myopathies when
      suspicion is high.
    explanation: >-
      A single pediatric case report in which the diagnosis was made by panel
      sequencing without biopsy. The genotype in that case was one pathogenic
      allele plus two variants of uncertain significance of unconfirmed phase.
  - reference: PMID:28779239
    reference_title: Exome sequencing in Jewish and Arab patients with rhabdomyolysis reveals single-gene etiology in 43% of cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In PGAM2 (Phosphoglycerate mutase 2 (Muscle)) we identified a highly
      conserved, novel homozygous missense mutation
    explanation: >-
      A PGAM2 diagnosis reached by exome sequencing of a rhabdomyolysis cohort.
- name: Muscle 31P magnetic resonance spectroscopy
  description: >-
    In vivo phosphorus MR spectroscopy detects accumulation of sugar phosphates
    (phosphomonoesters) during glycolytic exercise, documenting a partial
    glycolytic block non-invasively. It is a research tool rather than a routine
    diagnostic test.
  evidence:
  - reference: PMID:3034220

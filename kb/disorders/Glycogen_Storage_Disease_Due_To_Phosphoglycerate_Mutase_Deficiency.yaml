    explanation: >-
      Places sarcoplasmic reticulum proliferation as a recurrent feature of the
      disorder.
  downstream:
  - target: Exercise-induced muscle cramps
    description: >-
      Calcium release exceeding re-uptake is proposed to produce the exertional
      cramps and contractures.
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:10443898
      reference_title: "Muscle phosphoglycerate mutase deficiency with tubular aggregates: effect of dantrolene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        On dantrolene treatment, the patient became asymptomatic, and the ischemic

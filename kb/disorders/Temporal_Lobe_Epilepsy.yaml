    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with temporal lobe epilepsy, poorer performance on all measures of executive function was associated with DTI indices reflective of damaged/less developed pathways."
    explanation: Supports executive function impairment associated with thalamocortical tract changes in TLE.

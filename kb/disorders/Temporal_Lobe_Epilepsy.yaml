name: Temporal Lobe Epilepsy
creation_date: '2026-04-05T18:58:47Z'
description: >-
  Temporal lobe epilepsy is a focal epilepsy in which seizures arise from
  temporal lobe networks, often involving mesial temporal structures and
  commonly associated with memory and other cognitive deficits.
category: Complex
parents:
- Epilepsy
synonyms:
- TLE
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
disease_term:
  preferred_term: temporal lobe epilepsy
  term:
    id: MONDO:0005115
    label: temporal lobe epilepsy
prevalence:
- population: Adults with Epilepsy
  measure_type: UNKNOWN
  notes: >-
    Temporal lobe epilepsy is the most common focal epilepsy syndrome in adults
    and is associated with high rates of pharmacoresistance and neuropsychiatric
    comorbidities.
  evidence:
  - reference: PMID:40693462
    reference_title: "N6-methyladenosine (m6A) dysregulation contributes to network excitability in temporal lobe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Temporal lobe epilepsy (TLE) is the most common epilepsy syndrome in adults."
    explanation: Establishes temporal lobe epilepsy as the most common adult epilepsy syndrome.
progression:
- phase: Post-Insult Latent Epileptogenesis and Chronic Epilepsy
  notes: >-
    Often triggered by an initial brain insult (such as traumatic brain injury,
    stroke, central nervous system infection, or status epilepticus), followed
    by persistent transcriptional and network remodeling that establishes a
    chronic hyperexcitable seizure network.
  evidence:
  - reference: PMID:40693462
    reference_title: "N6-methyladenosine (m6A) dysregulation contributes to network excitability in temporal lobe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Often caused by direct brain insults such as traumatic brain injury (TBI) (1), stroke (2–4), central nervous system (CNS) infections, and status epilepticus (SE) (5), it is associated with high rates of drug refractoriness and comorbid symptoms such as persistent learning and memory impairment, depression, and anxiety (6)."
    explanation: Documents precipitating brain insults and progression to chronic drug-refractory TLE with cognitive and psychiatric comorbidities.
- phase: Drug-Refractory Progression
  notes: >-
    Roughly half of patients do not achieve seizure control with antiseizure
    medications and progress to pharmacoresistant temporal lobe epilepsy
    requiring surgical evaluation.
  evidence:
  - reference: PMID:9046965
    reference_title: "Treatment of temporal lobe epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Initial management of patients with temporal lobe epilepsy is with antiepileptic drugs, but these control seizures in only half the patients. Patients refractory to drugs should be evaluated for resective surgery."
    explanation: Supports progression to drug-refractory disease in approximately half of patients with TLE.

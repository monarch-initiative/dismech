- name: ETL5
  display_name: "Familial temporal lobe epilepsy 5 (CPA6)"
  description: >-
    The CPA6 form, and the one form of familial temporal lobe epilepsy reported
    with recessive inheritance: a homozygous missense variant segregated with
    febrile seizures and temporal lobe epilepsy in four of seven siblings of
    consanguineous parents. A separate heterozygous variant was found in three
    unrelated patients with sporadic temporal lobe epilepsy, so the allelic
    picture is not purely recessive.

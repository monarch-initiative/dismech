- name: Impaired Galanin Neuropeptide Signaling
  description: >-
    Galanin is an inhibitory neuropeptide released in the hippocampus, and
    galanin receptor agonists suppress seizures in animal models. In a family
    with monozygotic twins affected by temporal lobe epilepsy, a de novo GAL
    variant (p.A39E) produced a peptide that antagonized galanin receptor 1
    signaling and bound galanin receptor 2 with reduced affinity and reduced
    agonist activity, so galanin-mediated restraint of hippocampal
    glutamatergic transmission is lost. GAL variants are a rare cause: no
    further pathogenic variant was found in a cohort of 582 cases.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GAL
    term:
      id: hgnc:4114
      label: GAL
  molecular_functions:
  - preferred_term: galanin neuropeptide hormone activity
    modifier: DECREASED
    term:
      id: GO:0005184
      label: neuropeptide hormone activity
  biological_processes:
  - preferred_term: galanin receptor signaling
    modifier: DECREASED
    term:
      id: GO:0090663
      label: galanin-activated signaling pathway
  locations:
  - preferred_term: hippocampal formation
    term:
      id: UBERON:0002421
      label: hippocampal formation
  downstream:
  - target: Excitation-Inhibition Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of galanin signaling at GalR1 and GalR2 is proposed to release
      hippocampal glutamatergic transmission from inhibitory restraint. The
      step from the receptor assays to the human network state is an inference
      drawn by the authors, not a measurement they made in patients.
    evidence:
    - reference: PMID:25691535
      reference_title: Galanin pathogenic mutations in temporal lobe epilepsy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: These findings suggest that the p.A39E mutant could impair galanin signaling in the hippocampus, leading to increased glutamatergic excitation and ultimately to TLE.
      explanation: >-
        The authors' own reading of their receptor assays as an excitatory
        shift in hippocampal transmission; stated as a suggestion, and not
        measured in patient tissue.
  evidence:
  - reference: PMID:25691535
    reference_title: Galanin pathogenic mutations in temporal lobe epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Functional analysis revealed that the p.A39E mutant showed antagonistic activity against galanin receptor 1 (GalR1)-mediated response, and decreased binding affinity and reduced agonist properties for GalR2.
    explanation: >-
      Receptor-level measurements establishing that the patient variant
      impairs signaling at both galanin receptors.
  - reference: PMID:25691535
    reference_title: Galanin pathogenic mutations in temporal lobe epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: A role for the galanin neuropeptide in the regulation of epileptic seizures has been established in animal models more than two decades ago.
    explanation: >-
      Records that the seizure-regulating role of galanin comes from animal
      models, which is the basis on which the gene was treated as a candidate.
- name: Reduced Extracellular Carboxypeptidase A6 Activity
  description: >-
    Carboxypeptidase A6 is secreted and binds the extracellular matrix, where
    it processes neuropeptides. Epilepsy-associated CPA6 variants cluster near
    the active site and act in two ways: some reduce catalytic activity, while
    others are retained inside the cell so that little or no enzyme reaches the
    matrix. Which neuropeptide substrates matter for seizure threshold in
    humans is not established, so the route from this node to seizures is not
    resolved.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CPA6
    term:
      id: hgnc:17245
      label: CPA6
  molecular_functions:
  - preferred_term: carboxypeptidase A6 activity
    modifier: DECREASED
    term:
      id: GO:0004181
      label: metallocarboxypeptidase activity
  downstream:
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The link rests on human genetics rather than on a traced mechanism: a
      homozygous CPA6 variant segregated with febrile seizures and temporal
      lobe epilepsy in a consanguineous family, and inactivating variants were
      found more often in epilepsy patients than in controls.
    evidence:
    - reference: PMID:21922598
      reference_title: Carboxypeptidase A6 gene (CPA6) mutations in a recessive familial form of febrile seizures and temporal lobe epilepsy and in sporadic temporal lobe epilepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: This study suggests that CPA6 is genetically linked to an AR familial form of FS and TLE, and is associated with sporadic TLE cases.
      explanation: >-
        Genetic linkage and an association in sporadic cases; the intervening
        steps between enzyme loss and seizures are not identified.
    - reference: PMID:23105115
      reference_title: "Naturally occurring carboxypeptidase A6 mutations: effect on enzyme function and association with epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Some inactivated CPA6 and were more frequently found in epilepsy patients than controls.
      explanation: >-
        Ties the inactivating variants specifically, rather than CPA6 variants
        in general, to the epilepsy phenotype.
  evidence:
  - reference: PMID:21922598
    reference_title: Carboxypeptidase A6 gene (CPA6) mutations in a recessive familial form of febrile seizures and temporal lobe epilepsy and in sporadic temporal lobe epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Ala270Val CPA6 was secreted at about 40% of the level of the wild-type CPA6 and was fully active, while Gly267Arg CPA6 was not detected in the medium or extracellular matrix.
    explanation: >-

    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Several mutations resulted in reduced enzyme activity or CPA6 protein levels in the extracellular matrix.
    explanation: >-
      Confirms the same two-mode effect across a wider allelic series, with
      folding largely preserved.
phenotypes:
- name: Seizures
  category: Neurological
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Recurrent focal seizures originating from temporal lobe networks, often
    with impaired awareness and temporal-lobe semiology.
  phenotype_term:
    preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:9046965
    reference_title: "Treatment of temporal lobe epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Initial management of patients with temporal lobe epilepsy is with antiepileptic drugs, but these control seizures in only half the patients."
    explanation: Supports recurrent seizures as the defining clinical feature of temporal lobe epilepsy.
  - reference: PMID:11484687
    reference_title: "A randomized, controlled trial of surgery for temporal-lobe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At one year, the cumulative proportion of patients who were free of seizures impairing awareness was 58 percent in the surgical group and 8 percent in the medical group (P<0.001)."
    explanation: Documents focal seizures impairing awareness as the primary seizure type in temporal lobe epilepsy.
- name: Memory Impairment
  category: Cognitive
  frequency: FREQUENT
  description: >-
    Verbal short-term memory can be impaired and correlates with altered
    excitation/inhibition balance in entorhinal and frontal cortical regions.
  phenotype_term:
    preferred_term: Memory impairment
    term:

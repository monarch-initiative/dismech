- name: Epitranscriptomic m6A RNA Methylation Dysregulation
  description: >-
    Dysregulation of N6-methyladenosine (m6A) RNA methylation in temporal lobe
    epilepsy involves upregulation of m6A writers and erasers with predominant
    transcript hypermethylation in hippocampal tissue, where m6A levels
    inversely correlate with protein pathway activation across metabolic and
    autophagic pathways; recreating this post-status epilepticus
    hypermethylation state via pharmacological FTO inhibition (FB23-2) in naive
    mice challenged with pentylenetetrazol (PTZ) decreases acute seizure
    susceptibility and severity.
  biological_processes:
  - preferred_term: RNA methylation
    modifier: ABNORMAL
    term:
      id: GO:0001510
      label: RNA methylation
  locations:
  - preferred_term: Ammon's horn
    term:
      id: UBERON:0001954
      label: Ammon's horn
  downstream:
  - target: Excitation-Inhibition Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Epitranscriptomic m6A dysregulation in TLE hippocampal tissue—marked by
      upregulated writer/eraser machinery and predominant transcript
      hypermethylation that inversely correlates with protein pathway
      activation—modulates cellular and temporal network excitability, and
      pharmacologically elevating m6A via FTO inhibition decreases PTZ-induced
      seizure susceptibility in mice.
    evidence:
    - reference: PMID:40693462
      reference_title: "N6-methyladenosine (m6A) dysregulation contributes to network excitability in temporal lobe epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Specifically, our results suggest that m6A levels inversely correlate with protein pathway activation."
      explanation: Demonstrates that m6A levels inversely correlate with protein pathway activation in TLE hippocampal tissue.
    - reference: PMID:40693462
      reference_title: "N6-methyladenosine (m6A) dysregulation contributes to network excitability in temporal lobe epilepsy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Finally, we show that elevated levels of m6A decrease seizure susceptibility and severity in mice."
      explanation: Experimental elevation of m6A via FTO inhibition in mice alters network excitability and reduces PTZ-induced seizure susceptibility.
  - target: Seizures

- name: CPA6
  gene_term:
    preferred_term: CPA6
    term:
      id: hgnc:17245
      label: CPA6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: ETL5
  frequency: rare
  notes: >-
    Reported in both zygosity states for different phenotypes: homozygous
    p.Ala270Val in the recessive familial febrile-seizure and temporal lobe
    epilepsy pedigree, and heterozygous p.Gly267Arg in three of 195 unrelated
    patients with partial epilepsy. No external body has classified the
    gene-disease pair, so no gene_disease_validity tier is recorded. The
    sporadic-case association is a candidate-gene screen in a selected cohort,
    not a population genetic study. CAUSATIVE records CPA6 as the gene that
    defines the ETL5 subtype; one pedigree and one candidate-gene
    screen fall short of the Definitive or Strong level that the schema
    attaches to CAUSATIVE, so read the relationship type as uncalibrated.
  variants:
  - name: p.Ala270Val
    description: >-
      Homozygous missense variant (c.809C>T) identified in the consanguineous
      pedigree. The protein is fully active but is secreted at about 40% of
      wild-type levels.
    evidence:
    - reference: PMID:21922598
      reference_title: Carboxypeptidase A6 gene (CPA6) mutations in a recessive familial form of febrile seizures and temporal lobe epilepsy and in sporadic temporal lobe epilepsy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Ala270Val CPA6 was secreted at about 40% of the level of the wild-type CPA6 and was fully active, while Gly267Arg CPA6 was not detected in the medium or extracellular matrix.
      explanation: Gives the secretion and activity result for this allele.
  - name: p.Gly267Arg
    description: >-
      Heterozygous missense variant (c.799G>A) found in three unrelated
      patients with temporal lobe epilepsy. The protein does not reach the
      medium or the extracellular matrix.
    evidence:
    - reference: PMID:21922598
      reference_title: Carboxypeptidase A6 gene (CPA6) mutations in a recessive familial form of febrile seizures and temporal lobe epilepsy and in sporadic temporal lobe epilepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Screening all exons of CPA6 in unrelated patients with partial epilepsy (n = 195) and FS (n = 145) revealed a new heterozygous missense mutation c.799G>A (p.Gly267Arg) in three TLE patients.
      explanation: Reports the allele and the cohort it was found in.
  evidence:
  - reference: PMID:21922598
    reference_title: Carboxypeptidase A6 gene (CPA6) mutations in a recessive familial form of febrile seizures and temporal lobe epilepsy and in sporadic temporal lobe epilepsy.

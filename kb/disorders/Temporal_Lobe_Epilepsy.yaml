  evidence:
  - reference: PMID:25691535
    reference_title: Galanin pathogenic mutations in temporal lobe epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The identification of a novel de novo mutation in a biologically-relevant candidate gene, coupled with functional evidence that the mutant protein disrupts galanin signaling, strongly supports GAL as the causal gene for the TLE in this family.
    explanation: >-
      The authors' gene-disease claim, scoped explicitly to this one family.
  - reference: PMID:25691535
    reference_title: Galanin pathogenic mutations in temporal lobe epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: In a cohort of 582 cases, we did not observe any pathogenic mutations indicating that mutations in GAL are a rare cause of TLE.

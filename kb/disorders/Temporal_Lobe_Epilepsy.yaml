diagnosis:
- name: Electroencephalography (EEG)
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  description: >-
    Surface and, when needed, intracranial electroencephalography are used to
    localize the temporal lobe seizure onset focus and guide surgical or
    medical management.
  evidence:
  - reference: PMID:9046965
    reference_title: "Treatment of temporal lobe epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "That evaluation requires identification of a focus of onset of seizures, as well as establishing that the focus is in an area of the brain that can be removed with a low risk of new neurologic deficits. Techniques used in that evaluation, including electroencephalography, imaging, recording form intracranial electrodes, use of the intracarotid amobarbitol perfusion test, and the role of specialized studies such as positron emission tomography, are reviewed"
    explanation: Supports scalp and intracranial EEG as primary diagnostic modalities for localizing seizure onset in TLE.
- name: Brain Neuroimaging (MRI and PET)
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Structural brain MRI (to identify hippocampal T2 hyperintensity, hippocampal
    sclerosis, or other epileptogenic lesions) and functional imaging such as
    positron emission tomography (PET) support localization of the epileptogenic
    temporal lobe focus.
  evidence:
  - reference: DOI:10.1111/epi.17979
    reference_title: "Hippocampal sclerosis and temporal lobe epilepsy following febrile status epilepticus: The <scp>FEBSTAT</scp> study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hippocampal T2 hyperintensity following febrile status epilepticus predicted hippocampal sclerosis and significant likelihood of mesial temporal lobe epilepsy."
    explanation: Supports brain MRI detection of hippocampal T2 hyperintensity and hippocampal sclerosis in temporal lobe epilepsy.
  - reference: PMID:9046965
    reference_title: "Treatment of temporal lobe epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Techniques used in that evaluation, including electroencephalography, imaging, recording form intracranial electrodes, use of the intracarotid amobarbitol perfusion test, and the role of specialized studies such as positron emission tomography, are reviewed"
    explanation: Supports neuroimaging and PET as core components of the diagnostic and presurgical evaluation of TLE.
differential_diagnoses:
- name: Frontal Lobe Epilepsy
  description: >-
    Another common focal epilepsy syndrome that can share aura, automatisms,
    and executive dysfunction with temporal lobe epilepsy, distinguished by
    seizure semiology, EEG localization, and distinct thalamocortical network
    involvement.
  distinguishing_features:
  - Frontal lobe seizure onset on EEG
  - Distinct executive function and thalamocortical tract profiles
  evidence:
  - reference: PMID:29880477
    reference_title: "Thalamocortical Connections and Executive Function in Pediatric Temporal and Frontal Lobe Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results give insight into vulnerable neural networks in pediatric focal epilepsy and suggest thalamocortical pathway damage as a potential mechanism of executive function impairment in temporal lobe epilepsy but not frontal lobe epilepsy."
    explanation: Contrasts temporal lobe epilepsy with frontal lobe epilepsy across cognitive and thalamocortical network features.
treatments:
- name: Antiseizure Medication Therapy
  description: >-
    Initial management of temporal lobe epilepsy is pharmacotherapy using
    antiseizure medications used across focal epilepsies, although many
    patients do not achieve durable seizure freedom and later meet criteria for
    drug-resistant disease.
  treatment_term:
    preferred_term: antiepileptic drug therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  evidence:
  - reference: PMID:9046965
    reference_title: "Treatment of temporal lobe epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Initial management of patients with temporal lobe epilepsy is with
      antiepileptic drugs, but these control seizures in only half the
      patients.
    explanation: >-
      Supports antiseizure medication therapy as first-line management in TLE,
      while also showing that medication failure is common.
  - reference: PMID:38888005
    reference_title: "Efficacy and safety of add-on antiseizure medications for focal epilepsy: A network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All approved ASMs were effective as add-on treatment for focal epilepsy.
    explanation: >-
      Supports ongoing pharmacotherapy in TLE because TLE is a focal epilepsy
      syndrome, although the evidence is not specific to TLE alone.
- name: Epilepsy Surgery for Drug-Resistant Disease
  description: >-
    In carefully selected patients with drug-resistant temporal lobe epilepsy,
    surgical treatment offers substantially higher rates of seizure freedom
    than continued medical therapy and remains a key escalation path once
    pharmacoresistance is established.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:11484687
    reference_title: "A randomized, controlled trial of surgery for temporal-lobe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At one year, the cumulative proportion of patients who were free of
      seizures impairing awareness was 58 percent in the surgical group and 8
      percent in the medical group (P<0.001).
    explanation: >-
      Supports surgical treatment as an effective option for carefully selected
      patients with drug-resistant temporal lobe epilepsy.
review_notes: >-
  The Mendelian familial temporal lobe epilepsy classes are recorded as
  has_subtypes rows only where MONDO's class is defined by a gene (ETL1 LGI1,
  ETL5 CPA6, ETL7 RELN, ETL8 GAL). The remaining numbered classes are linkage
  intervals with no gene named - ETL2 (MONDO:0011965, 12q22-q23.3), ETL3
  (MONDO:0012705), ETL4 (MONDO:0012706, 9q21-q22) and ETL6 (MONDO:0014308,
  3q25-q26) - so no gene-level or mechanistic claim can be written for them and
  they are deliberately left out rather than added as empty rows. MONDO also
  carries familial mesial temporal lobe epilepsy (MONDO:0800493), which is not
  bound here: it is an ILAE syndrome with complex inheritance and normal MRI,
  and it is not the same concept as this entry's mesial-temporal-lobe-epilepsy
  with hippocampal sclerosis subtype, which is curated separately.
datasets:
- accession: geo:GSE297566
  title: Hippocampal epitranscriptomic (m6A) in human model of Temporal Lobe Epilepsy
  description: Analogous to DNA methylation and protein phosphorylation it is now well understood that RNA is also subject to extensive processing and modification. N6-methyladenosine (m6A) is the most abundant internal RNA modification and regulates RNA fate in several ways including stability and translational efficiency. The role of m6A in both experimental and human epilepsy remains unknown. Here we use transcriptome-wide m6A arrays to obtain a detailed analysis of the hippocampal m6A-ome from human temporal lobe epilepsy samples. We show that epileptic tissue displays disrupted metabolic and autophagic pathways which may be directly linked to m6A-processing.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: METHYLATION
  sample_count: 48
  publication: PMID:40693462
  notes: Identified by GEO DataSets index search for Temporal Lobe Epilepsy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE272142
  title: Genome‑wideBrain DNAMethylationandGeneExpression Patterns Unravel Epigenetic Reprogramming in Mesial Temporal Lobe Epilepsy
  description: Mesial temporal lobe epilepsy (MTLE) is the most common drug-resistant epilepsy in adults, characterized by hippocampus sclerosis. To date, the etiology of MTLE epileptogenesis and the molecular mechanisms underlying hippocampus sclerosis remain largely unclear. Altered genome-wide DNA methylation patterns and differential gene expression have been reported to be involved in the pathophysiological mechanism of epileptogenesis. To discover epigenetic reprogramming patterns associated with MTLE, we used a higher-throughput microarray, Illumina Infinium 850 K BeadChip, and RNA sequence to analyze epigenome-wide DNA methylation and related gene expressions.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 12
  notes: Identified by GEO DataSets index search for Temporal Lobe Epilepsy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001003922
  title: Meisal temporal lobe epilepsy sequencing study
  description: Our understanding of mesial temporal lobe epilepsy (MTLE) is one of the most common forms of drug-resistant epilepsy in humans. Using RNA- and small RNA-sequencing in parallel, we explored differentially expressed genes in the hippocampus and cortex of MTLE patients who had undergone surgical resection and non-epileptic controls. We found significant enrichment for astrocytic and microglial genes amongst up-regulated genes and down-regulation of neuron-specific genes in the hippocampus of MTLE patients. The transcriptome profile of the small RNAs reflected disease state more robustly than mRNAs, even across brain regions which show very little pathology.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Temporal Lobe Epilepsy"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: massive:MSV000094401
  title: Proteomic profile of hippocampus regions from the pilocarpine medial temporal lobe epilepsy model
  description: Label-free Proteomic profile of the dentate gyrus (dorsal and ventral) and CA3 (dorsal and ventral) microdissected from the hippocampus of the pilocarpine model of Mesial Temporal Lobe Epilepsy.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Temporal Lobe Epilepsy"). Retrieved 2026-08-02.

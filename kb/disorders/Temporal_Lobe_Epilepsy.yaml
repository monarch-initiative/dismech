pathophysiology:
- name: Hippocampal Sclerosis and Neuronal Loss
  description: >-
    In mesial temporal lobe epilepsy, hippocampal sclerosis is characterized by
    selective loss of pyramidal neurons and reactive gliosis predominantly in
    the CA1 and CA4/CA3 subfields with relative sparing of CA2 and the
    subiculum, remodeling mesial temporal circuitry and promoting seizure
    generation.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  - preferred_term: glial cell
    term:
      id: CL:0000125
      label: glial cell
  locations:
  - preferred_term: Ammon's horn
    term:
      id: UBERON:0001954
      label: Ammon's horn
  downstream:
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hippocampal sclerosis is the primary histopathological lesion in
      drug-resistant temporal lobe epilepsy and is associated with recurrent
      mesial temporal lobe seizures.

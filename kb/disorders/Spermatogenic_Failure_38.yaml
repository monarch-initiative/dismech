    reference_title: "A novel stop-gain mutation in ARMC2 is associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Can whole-exome sequencing (WES) reveal novel genetic causes contributing to MMAF in a consanguineous Pakistani family, comprising three infertile brothers?"
    explanation: Recessive disease in three affected brothers of a consanguineous family.
  - reference: PMID:40158138

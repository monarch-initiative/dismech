    explanation: Both homozygous and compound heterozygous biallelic genotypes cause the disease.
pathophysiology:
- name: Loss of ARMC2 Radial Spoke Cargo Adapter
  description: >-
    Nonsense, frameshift and splice alleles are predicted to abolish ARMC2; a
    splice-donor allele was shown to skip exon 8 and introduce a premature
    stop codon. Patient sperm show reduced ARMC2 protein. In Chlamydomonas,
    ARMC2/PF27 co-migrates with the radial spoke protein RSP3 on anterograde
    IFT trains and is required for IFT of radial spokes, so its adapter
    function in human spermatids is inferred from the ortholog. Two
    homozygous missense alleles slightly increased protein expression in
    HEK293T cells and still caused MMAF, so how missense alleles act is
    unresolved.
  biological_scale: MOLECULAR
  genes:

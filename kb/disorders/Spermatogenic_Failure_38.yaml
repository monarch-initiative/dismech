    causal_link_type: DIRECT
    description: Shown in Chlamydomonas armc2/pf27 mutants; inferred for human sperm.
    evidence:
    - reference: PMID:34982025
      reference_title: "Chlamydomonas ARMC2/PF27 is an obligate cargo adapter for intraflagellar transport of radial spokes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In armc2/pf27 mutants, IFT of radial spokes was abolished and the presence of radial spokes was limited to the proximal region of flagella."
      explanation: Loss of the ortholog abolishes IFT of radial spokes in the alga.
  evidence:
  - reference: CGGV:assertion_aef0ad23-4568-4ef7-94e9-557981bfbe6c-2023-05-10T160000.000Z
    reference_title: "ARMC2 / spermatogenic failure 38 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is also a splice site variant included in this curation, which the authors confirmed to skip exon 8 and result in an early termination codon in exon 9 (18 exons total) at the RNA level (PMID:30686508)."
    explanation: ClinGen's summary of the founding paper's RNA analysis of the splice allele.
  - reference: PMID:40158138
    reference_title: "Broadening the ARMC2 mutational phenotype: linking multiple morphological abnormalities of the Flagella to Pulmonary Manifestations in Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoblotting and immunofluorescence assays revealed the reduced expression of ARMC2 and the abnormality of various axonal structural proteins."
    explanation: Patient sperm carry reduced ARMC2 protein.
  - reference: PMID:34982025
    reference_title: "Chlamydomonas ARMC2/PF27 is an obligate cargo adapter for intraflagellar transport of radial spokes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We conclude that ARMC2 is a cargo adapter required for IFT of radial spokes to ensure their assembly along flagella."
    explanation: The cargo-adapter function of human ARMC2 is inferred from the Chlamydomonas ortholog.
  - reference: PMID:38492154
    reference_title: "Identification of novel homozygous asthenoteratospermia-causing ARMC2 mutations associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro experiments indicated that both ARMC2 variants caused a slightly increased protein expression."
    explanation: Two missense alleles did not reduce protein abundance in cells, so they are not simple null alleles.

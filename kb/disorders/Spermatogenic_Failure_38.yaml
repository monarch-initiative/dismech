  status: EMERGING
  description: >-
    Knockout mice show airway, ependymal, oviduct and nodal cilia defects.
    One patient, homozygous for p.Arg422Ter, had recurrent airway infections,
    bronchitis and rhinosinusitis; other patients, including a man with the
    same homozygous allele, have not been reported with airway disease, and
    ClinGen found no PCD patients before that report.
  evidence:
  - reference: PMID:40158138
    reference_title: "Broadening the ARMC2 mutational phenotype: linking multiple morphological abnormalities of the Flagella to Pulmonary Manifestations in Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, in addition to MMAF, individual P2 exhibited classic symptoms of PCD in the lungs, including recurrent airway infections, bronchitis, and rhinosinusitis."
    explanation: A single patient with MMAF and PCD-like airway disease.
  - reference: PMID:42272638
    reference_title: "ARMC2 loss impairs cilia structure and leads to primary ciliary dyskinesia symptoms in mouse organs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Altogether, these findings suggest that mutations of ARMC2 might be also a molecular cause of human PCD."
    explanation: Mouse motile-cilia phenotypes motivate the hypothesis.

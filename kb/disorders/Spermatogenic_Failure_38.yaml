    evidence:
    - reference: CGGV:assertion_aef0ad23-4568-4ef7-94e9-557981bfbe6c-2023-05-10T160000.000Z
      reference_title: "ARMC2 / spermatogenic failure 38 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ARMC2 | HGNC:23045 | spermatogenic failure 38 | MONDO:0032748 | AR | Definitive"
      explanation: ClinGen Definitive classification.
  case_fractions:
  - population: Exome-sequenced men with typical MMAF (Coutton et al. 2019 cohort)
    case_fraction_percent: 3.0
    cohort_size: 168
    notes: 5 of 168 men carried homozygous deleterious ARMC2 variants.
    evidence:
    - reference: PMID:30686508
      reference_title: "Bi-allelic Mutations in ARMC2 Lead to Severe Astheno-Teratozoospermia Due to Sperm Flagellum Malformations in Humans and Mice."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, whole-exome sequencing (WES) was performed on 168 infertile men who had a typical MMAF phenotype. Five unrelated affected individuals carried a homozygous deleterious mutation in ARMC2, a gene not previously linked to the MMAF phenotype."
      explanation: Five of 168 MMAF probands carried biallelic ARMC2 variants.
  notes: >-
    Reported alleles include nonsense (p.Ser61Ter, p.Arg422Ter), frameshift
    (p.Thr344fs), splice-site and missense (p.Pro105Leu, p.Arg444His,
    p.Asn743Asp, and p.Ile760Asn from the founding cohort) variants. ClinGen's
    2023 curation counted 7 variants in 7 probands. Missense alleles have not
    been shown to reduce protein abundance.
  evidence:
  - reference: PMID:30686508
    reference_title: "Bi-allelic Mutations in ARMC2 Lead to Severe Astheno-Teratozoospermia Due to Sperm Flagellum Malformations in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five unrelated affected individuals carried a homozygous deleterious mutation in ARMC2, a gene not previously linked to the MMAF phenotype."
    explanation: Founding report of biallelic ARMC2 variants in MMAF.
  - reference: PMID:34493464
    reference_title: "A novel stop-gain mutation in ARMC2 is associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES and Sanger sequencing identified a novel homozygous stop-gain mutation (ENST00000392644.4, c.182C>G, p.S61X) in ARMC2, which is expected to lead to loss of protein functions."
    explanation: Replication in a consanguineous Pakistani family.
  - reference: PMID:38492154
    reference_title: "Identification of novel homozygous asthenoteratospermia-causing ARMC2 mutations associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two novel homozygous missense ARMC2 variants: c.314C > T: p.P105L and c.2227A > G: p.N743D."
    explanation: Homozygous missense alleles in two Han Chinese families.
animal_models:
- name: Armc2 mutant mouse
  species: Mouse
  genotype: Armc2 homozygous mutant (CRISPR/Cas9)
  publication: PMID:30686508
  description: >-
    Homozygous mutant males are infertile with MMAF sperm lacking the central
    pair proteins SPAG6 and SPEF2. Later work on Armc2-deficient mice found
    shortened tracheal and oviduct cilia, impaired ciliary beating, tracheal
    mucus, enlarged brain ventricles or hydrocephalus and situs ambiguus, and
    the line was used to test testicular mRNA rescue.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Mutant mice reproduce human MMAF and male infertility.
    evidence:
    - reference: PMID:30686508
      reference_title: "Bi-allelic Mutations in ARMC2 Lead to Severe Astheno-Teratozoospermia Due to Sperm Flagellum Malformations in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using the CRISPR-Cas9 technique, we generated homozygous Armc2 mutant mice, which also presented an MMAF phenotype, thus confirming the involvement of ARMC2 in human MMAF."
      explanation: The mutant reproduces MMAF.
  - target: Loss of the Sperm Axonemal Central Pair Complex
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      SPAG6 and SPEF2 are lost from mutant sperm as in patients; the founding
      paper reports the immunostaining for patients and mice in one sentence,
      cited on the central-pair node.
  - target: Airway Motile Cilia Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Mutant mice have airway, brain-ventricle and laterality phenotypes.
    limitations: >-
      Airway, hydrocephalus and laterality phenotypes are present in mice,
      while only one patient has airway disease and none has reported
      hydrocephalus or laterality defects.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        Patients could show airway, laterality and ventricular phenotypes but
        almost none is reported to, so the mouse overstates motile-cilia
        involvement relative to the reported human disease; whether patients
        were examined for these features is mostly not stated.
    evidence:
    - reference: PMID:42272638
      reference_title: "ARMC2 loss impairs cilia structure and leads to primary ciliary dyskinesia symptoms in mouse organs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In Armc2-deficient mice, the length of cilia was reduced in trachea and oviduct."
      explanation: Motile cilia outside the testis are affected in mutant mice.
- name: Chlamydomonas reinhardtii pf27 (armc2) mutant
  species: Chlamydomonas reinhardtii
  genotype: pf27 / armc2 loss-of-function mutant
  publication: PMID:34982025
  description: >-
    The paralyzed-flagella pf27 mutant lacks the ARMC2 ortholog; radial spokes
    are not transported by IFT and are confined to the proximal flagellum.
  modeled_mechanisms:
  - target: Defective Intraflagellar Transport of Radial Spokes
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Directly shows the transport defect inferred for human spermatids.
    limitations: >-
      Chlamydomonas flagella lack the outer dense fibres, fibrous sheath and
      mitochondrial sheath of sperm, so the alga cannot show how the defect
      leads to the peri-axonemal disorganization seen in patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The algal flagellum has no peri-axonemal sperm structures, so the
        model covers radial spoke transport but not the downstream sperm
        tail morphology.
    evidence:
    - reference: PMID:34982025
      reference_title: "Chlamydomonas ARMC2/PF27 is an obligate cargo adapter for intraflagellar transport of radial spokes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In armc2/pf27 mutants, IFT of radial spokes was abolished and the presence of radial spokes was limited to the proximal region of flagella."
      explanation: The transport defect in the ortholog mutant.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect; live births are reported, including
    twins. In mutant mice, Armc2-deficient sperm support embryo development
    less well than wild-type sperm after ICSI, though better than sperm from
    some other MMAF knockouts; whether this applies to patients is unknown.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar form and motility irrelevant to fertilization.
    evidence:
    - reference: PMID:35543806
      reference_title: "Patient with multiple morphological abnormalities of sperm flagella caused by a novel ARMC2 mutation has a favorable pregnancy outcome from intracytoplasmic sperm injection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The ICSI therapy was successful, and boy-girl twins were given birth."
      explanation: Live birth after ICSI despite MMAF.
  evidence:
  - reference: PMID:35543806
    reference_title: "Patient with multiple morphological abnormalities of sperm flagella caused by a novel ARMC2 mutation has a favorable pregnancy outcome from intracytoplasmic sperm injection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of ICSI outcome of patient harboring ARMC2 mutation."
    explanation: First reported ICSI outcome for this disorder.
  - reference: PMID:40158138
    reference_title: "Broadening the ARMC2 mutational phenotype: linking multiple morphological abnormalities of the Flagella to Pulmonary Manifestations in Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further assisted reproduction outcomes showed that one of the individuals conceived successfully after Intracytoplasmic Sperm Injection (ICSI)."
    explanation: A second successful ICSI conception.
  - reference: PMID:40070084
    reference_title: "A comprehensive study of the sperm head defects in MMAF condition and their impact on embryo development in mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Sperm from all KO lines exhibited a marked decrease in supporting embryo development compared to the wild-type, with developmental failure rates ranked as follows: Ccdc146 > Cfap43 > Armc2 > Cfap44-deficient sperm."
    explanation: >-
      In mice, ICSI with Armc2-deficient sperm gives poorer embryo
      development than wild-type sperm, a possible limit not yet seen in
      patients.
- name: Testicular Armc2 mRNA Electroporation
  description: >-
    Preclinical only. In Armc2-deficient mice, testicular injection and
    electroporation of capped, polyadenylated Armc2 mRNA restored
    morphologically normal motile sperm that produced embryos by IVF and
    ICSI. Not tested in patients.
  therapeutic_modality: MRNA_THERAPY
  target_mechanisms:
  - target: Loss of ARMC2 Radial Spoke Cargo Adapter
    description: Restores ARMC2 in germ cells.
    evidence:
    - reference: PMID:41773826
      reference_title: "Sperm motility in mice with oligo-astheno-teratozoospermia restored by in vivo injection and electroporation of naked mRNA."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Delivery of Armc2 mRNA restored morphologically normal and motile sperm in deficient males, capable of producing embryos via in vitro fertilization and ICSI."
      explanation: mRNA delivery rescues sperm in mutant mice.
  evidence:
  - reference: PMID:41773826
    reference_title: "Sperm motility in mice with oligo-astheno-teratozoospermia restored by in vivo injection and electroporation of naked mRNA."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings provide proof-of-concept that mRNA electroporation can restore sperm motility and fertilizing potential, offering a novel strategy to correct monogenic male infertility."
    explanation: Proof of concept in mice only.
- name: Genetic Counseling
  description: >-
    Counselling for autosomal recessive recurrence and carrier testing of
    relatives once the familial ARMC2 alleles are known; children conceived
    by ICSI will be obligate carriers.
  therapeutic_modality: BEHAVIORAL

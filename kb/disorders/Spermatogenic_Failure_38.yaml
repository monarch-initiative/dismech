notes: >-
  MONDO cross-references the phenotype as OMIM 618433. ClinGen classifies
  ARMC2 in SPGF38 as Definitive (2023); its summary records that a literature
  search found no patients with primary ciliary dyskinesia, so ARMC2 was
  curated only for SPGF38. The one patient with PCD-like airway disease was
  published afterwards (PMID:40158138). No GeneReviews chapter covers the
  disorder; the phenotype baseline comes from the founding Coutton et al.
  cohort (PMID:30686508) and later case reports.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic ARMC2 variants. Most reported probands are
    homozygous, several from consanguineous families, including three
    infertile Pakistani brothers; one Chinese proband is compound
    heterozygous.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

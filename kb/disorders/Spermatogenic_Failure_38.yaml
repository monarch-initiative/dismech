name: Spermatogenic Failure 38
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- SPGF38
- spermatogenic failure 38
- ARMC2-related multiple morphological abnormalities of the sperm flagella
- ARMC2-related MMAF
description: >-
  Spermatogenic failure 38 (SPGF38) is autosomal recessive male infertility
  caused by biallelic variants in ARMC2, which encodes an armadillo-repeat
  protein expressed mainly in the testis. In the green alga Chlamydomonas the
  ARMC2 ortholog (PF27) is a cargo adapter that carries radial spokes into the
  growing flagellum on intraflagellar transport (IFT) trains; without it,
  radial spokes are confined to the proximal flagellum.

  Affected men have severe asthenoteratozoospermia with multiple morphological
  abnormalities of the sperm flagella (MMAF): absent, short, coiled, bent and
  irregular-caliber flagella, with essentially no progressive motility and, in
  some reports, reduced sperm concentration. Electron microscopy shows loss of
  the axonemal central pair complex and wider axonemal and peri-axonemal
  disorganization, and the central-pair proteins SPAG6 and SPEF2 are missing
  from patient and Armc2-mutant sperm. Reported alleles are mostly nonsense,
  frameshift and splice variants, with a few missense variants, almost all
  homozygous. One Chinese patient also had recurrent airway infections,
  bronchitis and rhinosinusitis, and Armc2-deficient mice have shortened,
  poorly beating tracheal and oviduct cilia, hydrocephalus and laterality
  defects, so a primary ciliary dyskinesia component is possible but is
  documented in a single patient. Intracytoplasmic sperm injection (ICSI) has
  produced live births.

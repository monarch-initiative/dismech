    snippet: "decreased product levels (3-hydroxy-6-N-trimethyllysine and γ-butyrobetaine) in plasma and urine"
    explanation: Documents reduction of the direct enzymatic product in patient plasma and urine.
  - reference: PMID:12028997
    reference_title: "Analysis of carnitine biosynthesis metabolites in urine by HPLC-electrospray tandem mass spectrometry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean (SD) excretions of N(6)-trimethyllysine and 3-hydroxy-N(6)-trimethyllysine were 2.8 (0.8) and 0.45 (0.15) mmol/mol creatinine, respectively."
    explanation: Provides the control urinary excretion values against which patient results are interpreted, from the reference method for these analytes.
- name: Normal or low-normal plasma free and total carnitine
  presence: NORMAL
  context: >-
    The negative finding that most changes clinical practice. Plasma carnitine
    is a poor test for this disorder. A 46-year-old hemizygous male with a
    premature stop codon and a severely abnormal metabolite ratio had a normal
    free carnitine of 40.8 micromol/L against a reference interval of 20 to 55,
    and a normal total carnitine of 46.8 micromol/L against 25 to 65. Carnitine
    was described as only slightly decreased in the patients screened by Nava
    and colleagues. Frank carnitine deficiency has been documented in a TMLHE
    case, in the 4-year-old boy with recurrent regression, but it is not the
    rule. Ordering a carnitine level to exclude TMLHE deficiency will therefore
    miss most cases; the trimethyllysine and gamma-butyrobetaine pair, and their
    ratio, is the correct test.
  biomarker_term:
    preferred_term: L-carnitine
    term:
      id: CHEBI:16347
      label: (R)-carnitine
  readouts:
  - target: Loss of the Endogenous Arm of Carnitine Homeostasis
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: A normal carnitine level in an enzyme-deficient male is evidence of successful buffering by the dietary and renal arms, not of an absent block.
  evidence:
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we evaluated the carnitine status and measured a normal free carnitine concentration"
    explanation: Documents a normal free carnitine level in a molecularly and biochemically confirmed TMLHE-deficient adult male.
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with a concomitant two-to-threefold increase in the carnitine precursor TML and a small decrease in carnitine in plasma"
    explanation: Confirms that the carnitine decrement in previously reported TMLHE patients was small, in contrast with the large substrate elevation.
phenotypes:
- name: Asymptomatic enzyme deficiency
  category: Metabolic
  description: >-
    The most common outcome, and it is listed first deliberately. Most males
    with complete TMLHE enzyme deficiency have no recognised disease. The
    deficiency was found in 24 of 8,787 control males who had been recruited as
    unaffected comparison subjects, and the authors of the discovery study
    estimated penetrance for a clinical phenotype at 2-4%. Any clinical or
    counselling use of this entry has to start from that base rate.
  notes: >-
    No HPO term is bound because "no phenotype" is not a phenotype. The entry is
    retained as a named clinical outcome because omitting it would leave a
    phenotype list that implies a penetrant disease.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TMLHE deficiency is common in control males (24 in 8,787 or 1 in 366)"
    explanation: Direct evidence that enzymatic deficiency is common among males ascertained as unaffected controls.
- name: Autism
  category: Neurologic
  frequency: VERY_RARE
  description: >-
    Nondysmorphic autism is the phenotype for which this locus was first
    proposed, and the association is disputed. Reported affected individuals are
    described as nondysmorphic, without the malformations or facial features
    that accompany most syndromic causes of autism. The association is supported
    by co-segregation in male-male multiplex families and by individual case
    reports, and is undercut by the high frequency of the deficiency in control
    males, the null result in simplex families, and the behaviourally normal
    knockout mouse.
  phenotype_term:
    preferred_term: Autism
    term:
      id: HP:0000717
      label: Autism
  notes: >-
    The frequency band VERY_RARE is bound to the authors' own penetrance
    estimate of 2-4% for a clinical phenotype among deficient males, which falls
    inside the HPO VERY_RARE interval of 1-4%. It is emphatically NOT a statement
    that autism is rare, nor that TMLHE deficiency is rare - the deficiency is
    common. It states that among males with the deficiency, few are affected.
    HP:0000717 (Autism) was chosen over its parent HP:0000729 (Autistic
    behavior) because the sources describe diagnosed autism, and over
    HP:0000753 (Autism with high cognitive abilities) because intellectual
    disability co-occurs in several of the reported individuals.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, six of seven autistic male siblings of probands in male-male multiplex families had the deletion, suggesting that TMLHE deficiency is a risk factor for autism (metaanalysis Z-score = 2.90 and P = 0.0037), although with low penetrance (2-4%)."
    explanation: Contains both the positive co-segregation evidence and the low-penetrance qualifier, which is why the item is PARTIAL rather than SUPPORT.
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moderate intellectual disability along with obsessive and aggressive behaviour in the context of autism spectrum disorders was established as well as symptoms from the catatonic spectrum."
    explanation: A single adult case with a molecularly and biochemically confirmed TMLHE null allele and a diagnosed autism spectrum disorder.
- name: Intellectual disability
  category: Neurologic
  description: >-
    Reported in the minority of TMLHE-deficient males who come to clinical
    attention, not in the deficiency generally. Two brothers with a nonsense
    allele had autism with intellectual disability, and the adult case had
    moderate intellectual disability with an IQ at or below 55 on formal
    testing. No frequency band is asserted: the denominator for any such
    estimate would be the ascertained clinical cases, which is exactly the
    biased denominator that the control-male frequency shows to be misleading.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  notes: >-
    Severity in the single adult case was moderate, which would map to
    HP:0002342 (Moderate intellectual disability). The generic HP:0001249 is
    bound instead because the two brothers reported by Nava and colleagues are
    described only as having intellectual disability with no severity given, and
    binding a severity-specific child term on the basis of one case would
    over-specify the disorder.
  evidence:
  - reference: PMID:23092983
    reference_title: "Analysis of the chromosome X exome in patients with autism spectrum disorders identified novel candidate genes, including TMLHE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was identified in two brothers with autism and ID"
    explanation: Documents intellectual disability co-occurring with autism in two brothers carrying a TMLHE nonsense allele.
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At neuropsychological examination, moderate intellectual disability was found (IQ =< 55; SON-R) was found."
    explanation: Formal neuropsychological quantification of intellectual disability in the adult case; the duplicated "was found" is in the published text.
- name: Developmental regression
  category: Neurologic
  description: >-
    The single most therapeutically interesting phenotype, reported in one
    child. A 4-year-old boy with autism, a maternally inherited TMLHE frameshift
    variant and concurrent carnitine deficiency had two episodes of
    neurodevelopmental regression; after carnitine supplementation the
    regression ended and he began gaining milestones again. A single
    uncontrolled observation cannot establish causality, but the temporal
    relationship and the biochemical rationale make this the observation on
    which any future trial would be designed.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  notes: >-
    This report carries a published corrigendum, PMID:26355286, which was
    identified during curation but not fetched or quoted; the substance of the
    correction is therefore unknown to this entry and no claim from the original
    paper is treated as more secure than the abstract statement quoted. Note
    also that this child, unlike the adult case, did have documented carnitine
    deficiency, so he is not representative of the usual biochemical picture.
  evidence:
  - reference: PMID:25943046
    reference_title: "Improvement of regressive autism symptoms in a child with TMLHE deficiency following carnitine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 4-year-old male with autism and two episodes of neurodevelopmental regression was identified to have a mutation in the TMLHE gene, which encodes the first enzyme in the carnitine biosynthesis pathway, and concurrent carnitine deficiency."
    explanation: Documents recurrent developmental regression in a child with a confirmed TMLHE variant and carnitine deficiency.
- name: Decreased circulating carnitine concentration
  category: Metabolic
  frequency: OCCASIONAL
  description: >-
    Carnitine deficiency is possible in this disorder but is not its usual
    biochemical presentation, and this phenotype is included chiefly so that its
    inconstancy is on the record. It was present in the 4-year-old with
    regression. It was absent in the 46-year-old adult, whose free and total
    carnitine were both squarely within reference intervals. The patients
    screened by Nava and colleagues showed only a small decrease. What
    determines which deficient male becomes carnitine-deficient is unknown, and
    diet is the obvious untested candidate.
  phenotype_term:
    preferred_term: Decreased circulating carnitine concentration
    term:
      id: HP:0003234
      label: Decreased circulating carnitine concentration
  notes: >-
    The OCCASIONAL band (HPO 5-29%) is a qualitative mapping from the pattern in
    the case literature - present in one detailed case, absent in another,
    small decreases in a screened series - not from any published count. No
    study has reported the proportion of TMLHE-deficient males with subnormal
    carnitine, which is recorded as a knowledge gap. HP:0003234 was chosen over
    the more specific HP:0008315 (Decreased plasma free carnitine) because both
    free and total carnitine are discussed across the sources.
  evidence:
  - reference: PMID:25943046
    reference_title: "Improvement of regressive autism symptoms in a child with TMLHE deficiency following carnitine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and concurrent carnitine deficiency"
    explanation: Documents carnitine deficiency in a TMLHE-deficient child.
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we evaluated the carnitine status and measured a normal free carnitine concentration"
    explanation: Refutes carnitine deficiency as a constant feature - an enzyme-deficient adult male had a normal free carnitine level.
diagnosis:
- name: Targeted measurement of carnitine biosynthesis intermediates with the gamma-butyrobetaine to trimethyllysine ratio
  description: >-
    The biochemical test of choice. Trimethyllysine, 3-hydroxy-trimethyllysine,
    gamma-butyrobetaine and carnitine can be measured together in urine or
    plasma by HPLC with electrospray tandem mass spectrometry, or picked up by
    untargeted next-generation metabolic screening. The diagnostic pattern is
    the pair moving in opposite directions, and it is the ratio of
    gamma-butyrobetaine to trimethyllysine, rather than either analyte alone,
    that has been used to confirm the pathogenicity of a novel variant. The
    critical negative instruction is not to substitute a plasma carnitine level:
    carnitine is frequently normal in enzymatically deficient males.
  evidence:
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased concentration of trimethyllysine and decreased concentration of γ-butyrobetaine were found resulting in a significantly decreased BB/TML ratio, confirming the pathogenicity of this variant"
    explanation: Demonstrates the ratio being used as the confirmatory functional test for a variant of previously unknown significance.
  - reference: PMID:12028997
    reference_title: "Analysis of carnitine biosynthesis metabolites in urine by HPLC-electrospray tandem mass spectrometry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HPLC in combination with electrospray ionization tandem mass spectrometry allows rapid determination of urinary carnitine biosynthesis metabolites."
    explanation: Establishes the analytical method and its performance for the pathway intermediates used in diagnosis.
- name: Exome or genome sequencing with attention to TMLHE copy number
  description: >-
    Molecular confirmation, with one technical caveat that is specific to this
    gene. The most common pathogenic allele is a single-exon deletion, which
    standard exome sequencing analysed for single-nucleotide variants alone will
    miss; the founding case was detected by exon-targeted array comparative
    genomic hybridisation. Copy-number analysis of exome or genome data, or an
    explicit deletion assay, is therefore required, and a negative sequencing
    result that did not include copy-number calling does not exclude the
    diagnosis. Point alleles, including nonsense, frameshift and
    loss-of-function missense substitutions, also occur and are reported against
    NM_018196.4.
  evidence:
  - reference: PMID:21865298
    reference_title: "Use of array CGH to detect exonic copy number variants throughout the genome in autism families detects a novel deletion in TMLHE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed array comparative genomic hybridization using a custom Agilent 1 M oligonucleotide array intended to cover 197 332 unique exons in RefSeq genes"
    explanation: The detection method that found the founding allele was exon-resolution copy-number analysis, which is why copy-number calling is required for this gene.
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole Exome Sequencing analysis as described by Neveling and coworkers showed a hemizygotic, likely pathogenic variant (class 5) in the Epsilon-Trimethyllysine"
    explanation: Shows exome sequencing detecting a point allele, the complementary case to copy-number detection.
- name: Interpretive caution before reporting a TMLHE result as a cause of disease
  description: >-
    A diagnostic recommendation that follows from the epidemiology rather than
    from any assay. Because enzymatic TMLHE deficiency occurs in roughly 1 in
    366 control males and penetrance for a clinical phenotype was estimated at
    2-4%, finding a TMLHE loss-of-function allele in a boy with autism does not
    establish that it explains his autism; the prior probability of an
    incidental finding is substantial. A report should state the biochemical
    consequence, which is certain, separately from the clinical attribution,
    which is not. Diagnostic evaluation should continue rather than stop at a
    TMLHE result.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TMLHE deficiency is common in control males (24 in 8,787 or 1 in 366) and was not significantly increased in frequency in probands from simplex autism families (9 in 2,904 or 1 in 323)."
    explanation: The base rate in unaffected males and the null simplex result are the quantitative basis for this interpretive caution.
differential_diagnoses:
- name: Systemic primary carnitine deficiency
  disease_term:
    preferred_term: systemic primary carnitine deficiency disease
    term:
      id: MONDO:0008919
      label: systemic primary carnitine deficiency disease
  description: >-
    The disorder that TMLHE deficiency is most often assumed to resemble, and
    does not. Systemic primary carnitine deficiency is caused by biallelic
    SLC22A5 variants affecting the OCTN2 carnitine transporter, so it disables
    both cellular uptake and renal reabsorption and produces profound systemic
    carnitine depletion with cardiomyopathy, hypotonia, hypoketotic hypoglycaemia
    and failure to thrive. TMLHE deficiency disables only endogenous synthesis
    and leaves uptake and reabsorption intact. The two are therefore not
    severity variants of one another but lesions in different arms of carnitine
    homeostasis, and the authors of the mouse study make exactly this point:
    inactivating the biosynthetic enzyme does not reproduce primary carnitine
    deficiency.
  distinguishing_features:
  - Systemic primary carnitine deficiency is autosomal recessive and affects both sexes; TMLHE deficiency is X-linked and reported only in hemizygous males.
  - Plasma free carnitine is profoundly low in systemic primary carnitine deficiency and is frequently normal in TMLHE deficiency.
  - Carnitine biosynthesis intermediates are normal in SLC22A5 disease; the trimethyllysine rise with gamma-butyrobetaine fall is specific to a biosynthetic block.
  - Cardiomyopathy, hypoketotic hypoglycaemia and failure to thrive define the SLC22A5 phenotype and have not been reported in TMLHE deficiency.
  - Systemic primary carnitine deficiency responds dramatically and necessarily to carnitine supplementation; in TMLHE deficiency supplementation has been reported once, in an uncontrolled single case.
  notes: >-
    MONDO:0008919 was verified with OAK (`runoak -i sqlite:obo:mondo search
    "l~carnitine deficiency"` returns MONDO:0008919 systemic primary carnitine
    deficiency disease and MONDO:0008920 carnitine deficiency, myopathic;
    `info` on MONDO:0008919 gives xrefs OMIM:212140 and Orphanet:158). The gene
    symbol SLC22A5 was verified as hgnc:10969 with `runoak -i sqlite:obo:hgnc
    search "l^SLC22A5"` rather than typed from memory. The clinical description
    of SLC22A5 disease is drawn from the MONDO definition text, which is sourced
    to Orphanet:158.
  evidence:
  - reference: PMID:37553674
    reference_title: "Knockout of Tmlhe in mice is not associated with autism spectrum disorder phenotypes or motor dysfunction despite low carnitine levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "inactivation of TMLD does not induce a phenotype similar to previously described primary carnitine deficiency"
    explanation: States directly that loss of the biosynthetic enzyme does not phenocopy primary carnitine deficiency, which is the core of this differential.
- name: Autism spectrum disorder of other or unknown cause
  disease_term:
    preferred_term: autism spectrum disorder
    term:
      id: MONDO:0005258
      label: autism spectrum disorder
  description: >-
    Not a mimic but a competing explanation, and for this locus the usual one.
    Given a control male frequency near 1 in 366 and penetrance of 2-4%, a boy
    with autism who is found to carry a TMLHE loss-of-function allele will more
    often than not have autism of another cause with the TMLHE finding
    incidental. The practical implication is that identifying TMLHE deficiency
    should not terminate the diagnostic pathway; chromosomal microarray, exome
    or genome analysis for other established causes, and clinical assessment for
    syndromic features should proceed as they otherwise would.
  distinguishing_features:
  - TMLHE deficiency produces an abnormal gamma-butyrobetaine to trimethyllysine ratio; autism of other causes does not.
  - Reported TMLHE-associated cases are nondysmorphic, so the presence of malformations or a distinctive facial gestalt points to another diagnosis.
  - The male-only pattern of TMLHE deficiency cannot explain autism in a female proband.
  - A TMLHE finding in a simplex family carries less weight than in a male-male multiplex family, since the enrichment was seen only in the latter.
  notes: >-
    MONDO:0005258 (autism spectrum disorder) was verified with OAK, as was
    MONDO:0005260 (autism), which is the term MONDO:0020836 predisposes towards.
    MONDO:0020836, the direct parent of this entry, is deliberately not listed as
    a differential - it is a susceptibility grouping, not a disease that could be
    confused with this one.
- name: Secondary carnitine deficiency
  description: >-
    Acquired carnitine depletion is far more common than any genetic cause and
    is the main alternative explanation when a low carnitine level is the
    presenting abnormality. Recognised routes include renal loss and dialysis,
    valproate therapy, pivalate-conjugated antibiotics, prematurity, and
    strictly carnitine-poor diets. These are distinguished from TMLHE deficiency
    biochemically rather than clinically: none of them raises trimethyllysine,
    because none of them blocks the first biosynthetic step. This differential is
    listed without a disease_term because it is a mechanism-defined category
    rather than a single MONDO entity, and no MONDO term was verified for it.
  distinguishing_features:
  - Secondary carnitine deficiency leaves the carnitine biosynthesis intermediates normal, with no trimethyllysine elevation and no depressed gamma-butyrobetaine to trimethyllysine ratio.
  - An identifiable exposure or renal cause is usually present.
  - It is not sex-limited.
mechanistic_hypotheses:
- hypothesis_group_id: brain_carnitine_and_substrate_neurodevelopment
  hypothesis_label: >-
    Carnitine deficiency in the developing brain, or accumulated
    trimethyllysine, causes the neurodevelopmental phenotype attributed to
    TMLHE deficiency
  status: EMERGING
  description: >-
    Every causal edge in this entry that terminates on "Disputed
    Neurodevelopmental Susceptibility" belongs to this group and is typed
    HYPOTHESIZED. The hypothesis has three non-exclusive limbs. The bioenergetic
    limb holds that reduced long-chain fatty acid oxidation in neural stem cells
    depletes the cortical progenitor pool by shifting division mode, which is
    the limb with direct experimental support, in mouse embryonic brain. The
    brain-supply limb, proposed by Beaudet, holds that the brain is less well
    buffered than plasma because carnitine transport across the blood-brain
    barrier is limiting, with an X-linked transporter gene, SLC6A14, escaping
    X inactivation and so supplying boys less well than girls - which would
    additionally explain the male bias of autism. The substrate-toxicity limb
    holds that accumulated trimethyllysine is itself injurious to the developing
    nervous system.

    The status is EMERGING rather than ALTERNATIVE or CANONICAL because the
    hypothesis is not merely unproven but has accumulated specific
    counter-evidence: the population frequency of the deficiency in unaffected
    males, the null simplex result, and a constitutive knockout mouse with more
    than 90% carnitine depletion and no behavioural phenotype. It is retained
    because the human co-segregation signal in multiplex families, the single
    treatment-responsive regression case, and the neural stem cell data are real
    observations that a purely biochemical model does not explain.
  evidence:
  - reference: PMID:28703319
    reference_title: "Brain carnitine deficiency causes nonsyndromic autism with an extreme male bias: A hypothesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "That brain carnitine deficiency might cause autism is suggested by reports of severe carnitine deficiency in autism and by evidence that TMLHE deficiency - a defect in carnitine biosynthesis - is a risk factor for autism."
    explanation: The primary published statement of the hypothesis. Marked OTHER because the source is an explicitly labelled hypothesis paper, not a study reporting data.
  - reference: PMID:28703319
    reference_title: "Brain carnitine deficiency causes nonsyndromic autism with an extreme male bias: A hypothesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A gene on the X chromosome (SLC6A14) likely escapes random X-inactivation (a mixed epigenetic and genetic regulation) and could limit carnitine transport across the blood-brain barrier in boys compared to girls."
    explanation: States the brain-supply limb of the hypothesis, including the mechanism proposed for the male bias.
  - reference: PMID:26832401
    reference_title: "Inborn Errors of Long-Chain Fatty Acid beta-Oxidation Link Neural Stem Cell Self-Renewal to Autism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The collective data reveal a key role for FAO in controlling NSC-to-IPC transition in the mammalian embryonic brain and suggest NSC self renewal as a cellular mechanism underlying the association between IEMs and autism."
    explanation: The experimental support for the bioenergetic limb, and the authors' own framing of it as a candidate mechanism rather than a demonstrated one.
  - reference: PMID:37553674
    reference_title: "Knockout of Tmlhe in mice is not associated with autism spectrum disorder phenotypes or motor dysfunction despite low carnitine levels."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "knockout of Tmlh in mice does not induce an ASD phenotype or motor dysfunction despite extremely low carnitine and gamma-butyrobetaine concentrations"
    explanation: The strongest single piece of counter-evidence to the carnitine-deficiency limb, attached to the hypothesis so that it is visible wherever the hypothesis is read.
  notes: >-
    SLC6A14 was verified as hgnc:11047 with OAK before being named here; it is
    named only as a component of the cited hypothesis and is not curated as a
    modifier gene of this disorder, because no genetic evidence links SLC6A14
    genotype to outcome in TMLHE-deficient males.
treatments:
- name: L-Carnitine Supplementation
  description: >-
    Oral levocarnitine is the obvious candidate therapy, because it bypasses the
    enzymatic block entirely by supplying the pathway end product. The evidence
    that it helps anyone with this disorder is, however, a single uncontrolled
    case: a 4-year-old boy with a TMLHE frameshift variant, documented carnitine
    deficiency and two episodes of neurodevelopmental regression stopped
    regressing and resumed gaining milestones after supplementation. No
    controlled trial has ever been conducted in genetically defined TMLHE
    deficiency.

    Two considerations bound its use. First, most enzymatically deficient males
    have normal carnitine levels, so there is no deficit to correct in them and
    no rationale for treating a biochemical diagnosis alone. Second, the case
    for treating a documented carnitine deficiency in a TMLHE-deficient child is
    much stronger than the case for treating autism in a child who happens to
    carry a TMLHE allele; those are different indications and the evidence
    supports only the former, and even then weakly.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: levocarnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
  target_mechanisms:
  - target: Loss of the Endogenous Arm of Carnitine Homeostasis
    treatment_effect: BYPASSES
    description: >-
      Exogenous carnitine substitutes for the missing biosynthetic arm, restoring
      supply without restoring enzyme activity; the upstream metabolite
      abnormalities are unchanged by it.
  evidence:
  - reference: PMID:25943046
    reference_title: "Improvement of regressive autism symptoms in a child with TMLHE deficiency following carnitine supplementation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Following carnitine supplementation, the patient's regression ended, and the boy started gaining developmental milestones."
    explanation: The only report of clinical benefit in genetically confirmed TMLHE deficiency. Recorded as PARTIAL because it is a single uncontrolled observation in a child who also had documented carnitine deficiency.
  - reference: PMID:21629200
    reference_title: "A prospective double-blind, randomized clinical trial of levocarnitine to treat autism spectrum disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty subjects diagnosed with an ASD were randomly assigned to receive a standardized regimen (50 mg L-carnitine/kg bodyweight/day) of liquid L-carnitine (n=19) or placebo (n=11) for 3-months."
    explanation: Cited to delimit the evidence rather than to support the treatment. This 30-participant trial enrolled unselected autism spectrum disorder without TMLHE genotyping or carnitine biosynthesis testing, so whatever it shows about autism generally, it is not evidence about TMLHE deficiency, and it is the closest thing to a trial that exists.
- name: Genetic Counselling for an X-Linked Low-Penetrance Susceptibility Allele
  description: >-
    Counselling here is genuinely different from counselling a Mendelian
    disorder, and doing it as though it were Mendelian would be harmful. The
    facts to convey are that the allele is X-linked, that mothers of affected
    boys are typically carriers and brothers are at 50% risk of inheriting it,
    but that inheriting it confers an abnormal metabolite profile with high
    probability and a clinical phenotype with low probability, estimated at 2-4%.
    Roughly 1 in 366 unaffected control males already carries the deficiency.
    Predictive testing of an unaffected male relative will therefore usually
    yield a positive result of little predictive value, and this should be
    discussed before testing rather than after.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TMLHE deficiency is common in control males (24 in 8,787 or 1 in 366)"
    explanation: The population frequency in unaffected males is what makes a positive predictive test result uninformative, which is the substance of the counselling.
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although with low penetrance (2-4%)"
    explanation: The penetrance figure that must be quoted to a family being counselled.
animal_models:
- species: Mus musculus
  genotype: Tmlhe knockout, CRISPR/Cas9 constitutive inactivation, C57BL/6N background
  category: Knockout
  description: >-
    The single most informative experiment about this disorder, and it is a
    negative one. A constitutive Tmlhe knockout reduced carnitine by more than
    90% relative to wild type, and gamma-butyrobetaine was extremely low as
    well, so the metabolic lesion in the mouse is at least as severe as in
    humans and arguably more so. Despite that, the animals showed no significant
    social, cognitive or repetitive-behaviour changes of the kind used to model
    autism spectrum disorder, no deficit in muscle strength or coordination, and
    normal life expectancy. The authors also state explicitly that the model does
    not phenocopy primary carnitine deficiency.

    Interpreting this requires care in both directions. It is strong evidence
    against a simple, high-penetrance route from carnitine depletion to
    autism-like behaviour. It is weaker evidence against the human association
    than it first appears, because rodent behavioural assays are imperfect
    proxies for human social communication, because laboratory chow carnitine
    content is not reported here, and because the human phenotype is itself
    estimated at 2-4% penetrance and so would not be expected to appear in every
    animal of a small cohort. The cohort was 10 male and 11 female knockouts
    against 9 male and 14 female wild types.
  associated_phenotypes:
  - Carnitine reduced by more than 90% versus wild type
  - Extremely low gamma-butyrobetaine
  - No autism-related social, cognitive or repetitive-behaviour phenotype
  - Normal muscle strength and coordination
  - Normal life expectancy
  evidence:
  - reference: PMID:37553674
    reference_title: "Knockout of Tmlhe in mice is not associated with autism spectrum disorder phenotypes or motor dysfunction despite low carnitine levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We developed a mouse knockout model with constitutive TMLD enzyme inactivation that exhibited a significant decrease in the carnitine by more than 90% compared to wild-type (WT) mice."
    explanation: Establishes that the model reproduces, and exceeds, the human metabolic lesion, which is what gives the negative behavioural result its force.
  - reference: PMID:37553674
    reference_title: "Knockout of Tmlhe in mice is not associated with autism spectrum disorder phenotypes or motor dysfunction despite low carnitine levels."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "However, we did not observe any significant social, cognitive, or repetitive-behavior changes associated with ASD in the knockout mice; muscle strength and coordination were also not affected."
    explanation: The negative behavioural result, which is the principal counter-evidence to the autism hypothesis.
  - reference: PMID:37553674
    reference_title: "Knockout of Tmlhe in mice is not associated with autism spectrum disorder phenotypes or motor dysfunction despite low carnitine levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult 11 weeks old C57BL/6 N mice (WT: 9 males and 14 females; Tmlhe-KO: 10 males and 11 females) were housed under standard conditions"
    explanation: Documents the cohort size and background strain, which bound how much a null behavioural result can exclude.
- species: Mus musculus
  genotype: TMLHE knockout, male, cardiac ischaemia-reperfusion phenotyping
  category: Knockout
  description: >-
    The same loss of function studied for its cardiac and mitochondrial
    consequences rather than its behaviour, and the source of the only
    quantitative in vivo measurements of the metabolic deficit. Blood and cardiac
    acylcarnitines fell by up to 85% and fatty acid oxidation by 30%, with no
    effect on muscle or heart function at baseline. On ischaemia and reperfusion
    the knockouts were protected: OXPHOS-dependent respiration and coupling
    efficiency were fully preserved in the risk area, reperfusion-induced
    mitochondrial ROS production was prevented, and infarct size was 39%
    smaller. The lipidome shifted from saturated toward unsaturated species.

    This model is included not because cardiac ischaemia is a feature of the
    human disorder - it is not - but because it is the best evidence available
    on what a lifelong carnitine biosynthesis block actually does to an intact
    mammal, and it shows the answer is not uniformly deleterious.
  associated_phenotypes:
  - Blood and cardiac acylcarnitines reduced by up to 85%
  - Fatty acid oxidation reduced by 30%
  - Normal baseline muscle and heart function
  - 39% smaller infarct after ischaemia and reperfusion
  - Preserved mitochondrial OXPHOS coupling in the ischaemic risk area
  evidence:
  - reference: PMID:34728372
    reference_title: "Low cardiac content of long-chain acylcarnitines in TMLHE knockout mice prevents ischaemia-reperfusion-induced mitochondrial and cardiac damage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TMLHE gene deletion in male mice lowered acylcarnitine concentrations in blood and cardiac tissues by up to 85% and decreased fatty acid oxidation by 30% but did not affect muscle and heart function in mice."
    explanation: The quantitative metabolic phenotype of the knockout, together with the absence of a baseline functional deficit.
  - reference: PMID:34728372
    reference_title: "Low cardiac content of long-chain acylcarnitines in TMLHE knockout mice prevents ischaemia-reperfusion-induced mitochondrial and cardiac damage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the risk area of ischemic hearts in TMLHE KO mouse, the OXPHOS-dependent respiration rate and OXPHOS coupling efficiency were fully preserved."
    explanation: Documents preserved mitochondrial function under stress, arguing against a general bioenergetic failure phenotype.
- species: Mus musculus
  genotype: TMLHE activity knockdown in neural stem cells of the embryonic neocortex
  category: Conditional or targeted knockdown model
  description: >-
    A compartment-specific manipulation rather than a whole-animal model, and
    the experimental basis of the bioenergetic limb of the neurodevelopmental
    hypothesis. Reducing TMLHE activity cell-autonomously in embryonic
    neocortical neural stem cells reduced the neural stem cell pool, matching
    the effect of reducing CPT1A or of blocking fatty acid mobilisation from
    lipid droplets; lineage tracing showed a shift from self-renewing to
    symmetric differentiating divisions. The model's limitation is intrinsic to
    its design: it demonstrates a consequence of acutely reducing fatty acid
    oxidation flux in a progenitor compartment, whereas humans with TMLHE
    deficiency and the constitutive knockout mouse have the lesion from
    conception, with whatever compensation that permits.
  associated_phenotypes:
  - Reduced neural stem cell pool in embryonic neocortex
  - Shift from self-renewing to symmetric differentiating divisions
  evidence:
  - reference: PMID:26832401
    reference_title: "Inborn Errors of Long-Chain Fatty Acid beta-Oxidation Link Neural Stem Cell Self-Renewal to Autism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "insufficiencies in the activity of TMLHE (an autism risk factor that supports long-chain FAO by catalyzing carnitine biosynthesis), of CPT1A (an enzyme required for long-chain FAO transport into mitochondria), or of fatty acid mobilization from lipid droplets reduced NSC pools in the mouse embryonic neocortex"
    explanation: Establishes the neural stem cell phenotype produced by reduced TMLHE activity in the developing brain.
discussions:
- discussion_id: tmlhe-autism-association-disputed
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is TMLHE deficiency a genuine autism susceptibility factor, or is the
    association an artefact of a common variant meeting a common phenotype?
  rationale: >-
    This is the defining unresolved question for the entity and the reason MONDO
    files it under autism susceptibility while this entry declines to curate
    autism as an established consequence.

    For the association: within male-male multiplex families, six of seven
    autistic male siblings of probands carried the deletion; the deficiency was
    2.82-fold enriched in probands from such families at P = 0.023; a
    meta-analysis Z score of 2.90 with P = 0.0037 was reported; a nonsense
    allele segregated with autism and intellectual disability in two brothers;
    and individual cases with confirmed enzyme deficiency and autism continue to
    be reported.

    Against it: the deficiency is present in about 1 in 366 unselected control
    males, so it cannot be a strong determinant of anything; it was not enriched
    at all in probands from simplex autism families, which was the larger arm of
    the same study; the enrichment reached significance only in a subgroup, with
    an unadjusted p-value; the authors themselves estimate penetrance at 2-4%;
    and a constitutive knockout mouse with carnitine reduced by more than 90%
    shows no autism-related behavioural phenotype at all.

    The two positions are not fully reconcilable on present data. If the
    association is real it must be a weak, conditional susceptibility requiring
    unidentified additional factors, which is precisely the kind of effect that
    subgroup analyses of modest cohorts are known to overestimate. Resolution
    requires a study design nobody has run: ascertainment on genotype rather
    than on phenotype.
  attaches_to:
  - "pathophysiology#Disputed Neurodevelopmental Susceptibility"
  - "phenotypes#Autism"
  proposed_experiments:
  - experiment_id: tmlhe-biobank-genotype-first
    name: Genotype-first phenotyping of TMLHE-deficient males in population biobanks
    description: >-
      Identify TMLHE loss-of-function males in large unselected biobanks with
      linked health records and compare rates of autism, intellectual
      disability and developmental disorder diagnoses against matched
      non-carriers. Because the allele frequency is high, such a study is
      powered in a way that family-based ascertainment can never be, and it
      inverts the ascertainment bias that generated the original signal.
  - experiment_id: tmlhe-multiplex-replication
    name: Independent replication of the male-male multiplex enrichment
    description: >-
      Test the exon 2 deletion frequency in an independent collection of
      male-male multiplex autism families and matched controls, with the
      analysis pre-specified, since the original enrichment was a subgroup
      finding with an unadjusted p-value.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that dysregulation of carnitine metabolism may be important in nondysmorphic autism; that abnormalities of carnitine intake, loss, transport, or synthesis may be important in a larger fraction of nondysmorphic autism cases; and that the carnitine pathway may provide a novel target for therapy or prevention of autism."
    explanation: The discovery study's own conclusion, stated in hedged terms throughout, which is the position under dispute.
  - reference: PMID:37553674
    reference_title: "Knockout of Tmlhe in mice is not associated with autism spectrum disorder phenotypes or motor dysfunction despite low carnitine levels."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Researchers have suggested that carnitine depletion could be important for the development of ASD and cognitive, locomotor and social dysfunctions, but previous findings have been inconclusive regarding the specific role of endogenous carnitine."
    explanation: The opposing published position, which characterises the prior evidence as inconclusive before reporting the negative knockout result.
- discussion_id: tmlhe-what-determines-penetrance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What distinguishes the 2-4% of TMLHE-deficient males who are affected from
    the great majority who are not?
  rationale: >-
    Nothing is known about this, and it is the question on which the clinical
    utility of the whole entity depends. Several candidate determinants follow
    directly from the mechanism and none has been tested. Dietary carnitine
    intake is the most obvious: because the disorder removes only the synthetic
    arm of a three-arm homeostatic system, a carnitine-poor vegetarian or vegan
    diet, or the period of infancy before dietary intake is established, should
    in principle unmask it, and no study has stratified TMLHE-deficient males by
    diet. Renal carnitine handling is a second arm that could fail
    independently. Genetic modifiers affecting carnitine transport are a third,
    with SLC6A14 proposed on theoretical grounds only. Timing is a fourth: if
    the critical window is embryonic neurogenesis, as the neural stem cell work
    suggests, then maternal carnitine supply rather than the child's own may be
    the operative variable, which no study has examined.

    Until one of these is established, a TMLHE-deficient male cannot be given a
    risk figure more specific than the population penetrance estimate, and no
    preventive intervention can be justified.
  attaches_to:
  - "pathophysiology#Loss of the Endogenous Arm of Carnitine Homeostasis"
  - "phenotypes#Decreased circulating carnitine concentration"
  proposed_experiments:
  - experiment_id: tmlhe-diet-stratified-metabolite-study
    name: Diet-stratified carnitine status in TMLHE-deficient males
    description: >-
      Measure free and total carnitine, trimethyllysine and gamma-butyrobetaine
      in TMLHE-deficient males stratified by dietary carnitine intake, including
      vegetarians and vegans, to test whether the buffering by diet that this
      entry infers is real and where it fails.
  - experiment_id: tmlhe-carnitine-deficiency-proportion
    name: Proportion of TMLHE-deficient males with subnormal carnitine
    description: >-
      Establish the simple denominator that is currently missing: among
      unselected TMLHE-deficient males, what fraction have free or total
      carnitine below the reference interval. This determines whether the
      OCCASIONAL frequency band assigned in this entry is right.
- discussion_id: tmlhe-mouse-model-fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the behaviourally normal Tmlhe knockout mouse refute the human autism
    association, or does it merely show that mouse behavioural assays cannot
    detect a 2-4% penetrant human neurodevelopmental effect?
  rationale: >-
    This is a model-fidelity question, not an absence of evidence, which is why
    it is recorded as HUMAN_MODEL_MISMATCH. Informative in vivo evidence exists
    and points the opposite way from the human genetic claim, and the two cannot
    both be taken at face value.

    The model's strengths are real: constitutive inactivation, carnitine reduced
    by more than 90%, an assay battery covering social, cognitive, repetitive
    and motor domains, and normal life expectancy. Its limits are equally real.
    Mouse social and communicative behaviour is at best a coarse proxy for the
    human phenotype. A phenotype with 2-4% penetrance in humans would not be
    expected to appear reliably in cohorts of ten to eleven knockouts per sex.
    Rodent chow is carnitine-containing and its content is not stated, so the
    dietary arm that this entry identifies as the principal buffer is
    uncontrolled in the very experiment used to test the hypothesis. And the
    developmental window implicated by the neural stem cell work is embryonic,
    while the behavioural battery was applied to adults.

    Notably, a second manipulation in a second laboratory - knockdown of TMLHE
    activity in embryonic neocortical neural stem cells - does produce a
    developmental phenotype. The two mouse results are not necessarily in
    conflict; they may simply be measuring different things at different times.
  attaches_to:
  - "pathophysiology#Disputed Neurodevelopmental Susceptibility"
  - "pathophysiology#Neural Stem Cell Fatty Acid Oxidation Insufficiency"
  proposed_experiments:
  - experiment_id: tmlhe-ko-carnitine-free-diet
    name: Tmlhe knockout mice on a defined carnitine-free diet
    description: >-
      Repeat the behavioural and developmental phenotyping in knockouts
      maintained on a chemically defined carnitine-free diet from before
      conception, removing the dietary arm that may be masking the phenotype.
      This directly tests the buffering model that the human data imply.
  - experiment_id: tmlhe-ko-embryonic-cortical-phenotyping
    name: Embryonic cortical phenotyping of the constitutive knockout
    description: >-
      Apply the neural stem cell pool and division-mode measurements that were
      made after acute knockdown to the constitutive knockout embryo, to
      determine whether the developmental phenotype survives lifelong
      compensation.
  - experiment_id: tmlhe-patient-ipsc-neurogenesis
    name: Neurogenesis in patient-derived iPSC cortical organoids
    description: >-
      Derive cortical organoids from TMLHE-deficient males, both affected and
      unaffected, and measure progenitor pool dynamics and fatty acid oxidation
      flux in human tissue, which is the species the question is actually about.
- discussion_id: tmlhe-no-trial-of-carnitine
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does carnitine supplementation benefit anyone with TMLHE deficiency, and if
    so, which individuals and at what age?
  rationale: >-
    The entire clinical evidence for treatment is one uncontrolled paediatric
    case in which regression stopped after supplementation. No randomised or
    even prospective study has ever enrolled genetically defined TMLHE
    deficiency. The one randomised trial of levocarnitine in autism spectrum
    disorder enrolled 30 unselected participants over three months with no
    TMLHE genotyping and no carnitine biosynthesis measurements, so it is
    uninformative about this disorder whichever way its results are read.

    The gap has an unusual shape because of the epidemiology. A trial that
    enrolled TMLHE-deficient males unselected for phenotype would be treating a
    population in which 96-98% are expected to be unaffected, and would need an
    endpoint other than autism symptoms. A trial that enrolled only affected
    boys would face the objection that their autism may not be attributable to
    the TMLHE allele at all. The design question is genuinely hard, and the most
    tractable version - a trial in TMLHE-deficient individuals with documented
    low carnitine, powered on the biochemical endpoint with neurodevelopmental
    outcomes as secondary - has not been attempted.

    A distinct and unaddressed question is timing. If the operative window is
    embryonic neurogenesis, then postnatal supplementation of an affected child
    cannot reverse what has already happened, and the hypothesis paper's own
    proposal was prevention in infant siblings rather than treatment.
  attaches_to:
  - "treatments#L-Carnitine Supplementation"
  proposed_experiments:
  - experiment_id: tmlhe-carnitine-rct-biochemical-endpoint
    name: Randomised trial of levocarnitine in TMLHE-deficient individuals with low carnitine
    description: >-
      Enrol molecularly confirmed TMLHE-deficient individuals with free
      carnitine below the reference interval, randomise to levocarnitine or
      placebo, and power on normalisation of carnitine status with
      neurodevelopmental and behavioural measures as prespecified secondary
      endpoints.
  - experiment_id: tmlhe-infant-sibling-prevention
    name: Prospective observation of TMLHE-deficient infant siblings
    description: >-
      Follow TMLHE-deficient infant male siblings of probands prospectively with
      serial carnitine and metabolite measurement and standardised
      developmental assessment. This is the design the hypothesis paper itself
      proposed and would establish the natural history that is currently
      entirely unknown.
- discussion_id: tmlhe-untested-conditional-vulnerability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are TMLHE-deficient males vulnerable to carnitine depletion under conditions
    that compromise the dietary or renal arms of carnitine homeostasis?
  rationale: >-
    This is a prediction of the mechanism curated here that nobody appears to
    have tested, and it is the most clinically actionable open question in the
    entry. If carnitine homeostasis rests on synthesis, diet and renal
    reabsorption, and TMLHE deficiency removes the first, then losing a second
    arm should produce frank deficiency where an unaffected person would merely
    be depleted. Candidate second hits are well defined and common: strict
    vegetarian or vegan diet, prolonged parenteral nutrition without carnitine,
    haemodialysis, renal Fanconi syndrome, valproate therapy,
    pivalate-conjugated antibiotics, prematurity, and prolonged fasting or
    catabolic illness.

    No cited study reports carnitine status in a TMLHE-deficient individual
    under any of these conditions. If the prediction holds, it would convert an
    incidental molecular finding into a specific, cheap piece of clinical
    advice - check carnitine before starting valproate, or before a vegan diet
    in a deficient child. If it fails, the buffering is more robust than the
    three-arm model suggests and the finding is safely ignorable. Either result
    would be useful, which is unusual for a knowledge gap this cheap to close.
  attaches_to:
  - "pathophysiology#Loss of the Endogenous Arm of Carnitine Homeostasis"
  - "biochemical#Normal or low-normal plasma free and total carnitine"
  proposed_experiments:
  - experiment_id: tmlhe-second-hit-challenge-cohort
    name: Carnitine status in TMLHE-deficient individuals exposed to a second carnitine stressor
    description: >-
      Identify TMLHE-deficient individuals on valproate, on dialysis, or on
      strictly vegetarian diets through biobank or laboratory records and
      compare their carnitine status with TMLHE-deficient individuals without
      such exposure and with exposed non-carriers.
  - experiment_id: tmlhe-ko-mouse-dietary-challenge
    name: Dietary and pharmacological challenge of Tmlhe knockout mice
    description: >-
      Challenge knockout mice with a carnitine-free diet, with pivalate, and
      with fasting, measuring tissue carnitine, acylcarnitine profiles and
      metabolic tolerance, to establish whether a second hit produces the
      decompensation that the unchallenged animals never show.

  - reference: PMID:30898847
    reference_title: "Investigating the active site of human trimethyllysine hydroxylase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The first step in carnitine biosynthesis is catalyzed by trimethyllysine hydroxylase (TMLH), a non-heme Fe(II) and 2-oxoglutarate (2OG)-dependent oxygenase, which catalyzes the stereospecific hydroxylation of (2S)-Nε-trimethyllysine to (2S,3S)-3-hydroxy-Nε-trimethyllysine."
    explanation: Defines the human enzyme's cofactor requirements, chemistry and stereochemical outcome, which is the molecular function lost in this disorder.
  - reference: PMID:30898847
    reference_title: "Investigating the active site of human trimethyllysine hydroxylase."
    supports: SUPPORT
    evidence_source: IN_VITRO

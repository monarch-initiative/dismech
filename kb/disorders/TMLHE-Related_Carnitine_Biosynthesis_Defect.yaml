- name: Disputed Neurodevelopmental Susceptibility
  biological_scale: ORGANISM
  description: >-
    The terminal node of the hypothesised arm, and the one whose status this
    entry is most concerned to state accurately. Individual case reports and one
    family-based series associate TMLHE deficiency with nondysmorphic autism,
    intellectual disability, and in one child recurrent developmental regression
    that remitted on carnitine. Against that stand four hard observations. The
    enzyme deficiency is present in roughly 1 in 366 unselected control males.
    It was not enriched in probands from simplex autism families, the larger and
    less selected arm of the discovery study. The positive signal came only from
    male-male multiplex families and the authors' own penetrance estimate was
    2-4%. And a constitutive mouse knockout with carnitine reduced by more than
    90% shows no social, cognitive, repetitive-behaviour or motor phenotype.

    The honest reading is that TMLHE deficiency is at most a low-penetrance
    susceptibility factor requiring unidentified additional contributors, and
    that a majority of deficient males will never come to attention. This node
    is deliberately reached only by HYPOTHESIZED edges, all of which belong to
    the `brain_carnitine_and_substrate_neurodevelopment` hypothesis group, so no
    part of the pathograph asserts a direct causal path from the enzyme block to
    autism.

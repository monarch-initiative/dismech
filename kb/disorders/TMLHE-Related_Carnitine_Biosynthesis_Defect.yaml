name: TMLHE-Related Carnitine Biosynthesis Defect
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: epsilon-trimethyllysine hydroxylase deficiency
  term:
    id: MONDO:0010469
    label: epsilon-trimethyllysine hydroxylase deficiency
description: >-
  Epsilon-trimethyllysine hydroxylase deficiency is an X-linked inborn error of
  the first, committed step of endogenous carnitine biosynthesis. TMLHE at Xq28
  encodes trimethyllysine dioxygenase (TMLD, also written TMLH), a mitochondrial
  non-heme Fe(II) and 2-oxoglutarate-dependent oxygenase that hydroxylates
  N6-trimethyl-L-lysine to 3-hydroxy-N6-trimethyl-L-lysine. Hemizygous
  loss-of-function alleles in males abolish that activity, and the resulting
  biochemical signature is unambiguous and reproducible across every reported
  case: substrate (trimethyllysine) rises, and the two downstream intermediates
  that can only be made through this step, 3-hydroxy-trimethyllysine and
  gamma-butyrobetaine, fall, so the gamma-butyrobetaine to trimethyllysine ratio
  collapses.

  What makes this entity unusual, and what governs how it is curated here, is
  that the metabolic block is real while its clinical consequence is not
  established. Carnitine homeostasis in humans is maintained by three parallel
  arms - endogenous synthesis, dietary absorption, and efficient renal tubular
  reabsorption - and blocking only the synthetic arm is largely buffered by the
  other two on an ordinary omnivorous diet. Plasma free and total carnitine are
  therefore often normal in enzymatically deficient males. Consistent with that
  buffering, TMLHE deficiency is common in the general male population: the
  deletion of TMLHE exon 2 was found in 24 of 8,787 control males, about 1 in
  366, and most such males are not known to be affected by anything.

  The disorder is indexed in MONDO under autism susceptibility and carries the
  synonym "autism, susceptibility to, X-linked 6". That association is treated
  here as disputed rather than established. In the same study that measured the
  control frequency, TMLHE deficiency was NOT significantly enriched in probands
  from simplex autism families (9 in 2,904); the positive signal came only from
  male-male multiplex families (7 in 909, 2.82-fold, P = 0.023) and the authors
  themselves put penetrance at 2-4%. A constitutive Tmlhe knockout mouse with
  carnitine reduced by more than 90% showed no autism-related social, cognitive,
  or repetitive-behavior phenotype and no motor deficit. This entry therefore
  curates the carnitine-biosynthesis biochemistry as the established mechanism
  and models the neurodevelopmental arm explicitly as an emerging, low-penetrance
  hypothesis with its counter-evidence attached, not as a causal chain.
parents:
- Inborn Error of Metabolism
- Disorder of Carnitine Metabolism
synonyms:
- TMLHE deficiency
- TMLHED
- trimethyllysine dioxygenase deficiency
- N6-trimethyllysine dioxygenase deficiency
- epsilon-trimethyllysine hydroxylase deficiency
- autism, susceptibility to, X-linked 6
- AUTSX6
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      The only established, reproducible abnormality in this disorder is a
      defined enzymatic block in an intermediary metabolic pathway, detected and
      confirmed biochemically (elevated trimethyllysine, depressed
      gamma-butyrobetaine, collapsed ratio). It is an inborn error of metabolism
      first and foremost. A NEUROLOGIC chapter assignment was considered and
      deliberately NOT made: the neurodevelopmental features reported in a
      handful of individuals are the disputed part of this entity, most
      enzymatically deficient males are neurologically unremarkable, and
      assigning a neurology chapter would encode the contested claim as the
      disorder's defining domain. The disputed association is modelled instead
      under mechanistic_hypotheses and discussions.
    evidence:
    - reference: PMID:22566635
      reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Deletion of exon 2 of TMLHE causes enzyme deficiency, resulting in increased substrate concentration (6-N-trimethyllysine) and decreased product levels (3-hydroxy-6-N-trimethyllysine and γ-butyrobetaine) in plasma and urine."
      explanation: The defining, reproducible abnormality is a metabolic one, which is the basis for the metabolism chapter assignment.
notes: >-
  Entity verification, done before any content was written. `runoak -i
  sqlite:obo:mondo info MONDO:0010469 -O obo` returns name
  "epsilon-trimethyllysine hydroxylase deficiency", xrefs OMIM:300872,
  MEDGEN:763789 and UMLS:C3550875, subsets `predisposition` and
  `omim_susceptibility`, synonyms "autism, susceptibility to, X-linked 6,
  X-linked recessive", AUTSX6 and TMLHED, `is_a MONDO:0020836` (autism,
  susceptiblity to), and `relationship: RO:0004003 HGNC:18308 ! TMLHE`. The
  gene-disease edge was re-confirmed independently with `runoak -i
  sqlite:obo:mondo relationships -p RO:0004003 MONDO:0010469`. The gene symbol
  was verified with `runoak -i sqlite:obo:hgnc info hgnc:18308`, which returns
  TMLHE. Note that the uppercase form `HGNC:18308` returns a null label from the
  local adapter while the lowercase `hgnc:18308` resolves; the repo convention
  of lowercase `hgnc:` is used throughout.

  Scoping decision, and it is the main curatorial judgement in this entry.
  MONDO files this term under autism susceptibility and both of its OMIM-facing
  synonyms are autism labels. Curating it as "X-linked autism 6" would have been
  the path of least resistance and would have been wrong. The autism association
  is explicitly low-penetrance and was not reproduced in the simplex arm of the
  study that discovered it; the enzyme deficiency is common in unaffected
  control males; and the constitutive mouse knockout has no autism-like
  phenotype. The established fact is the carnitine-biosynthesis block, so that
  is what the pathograph asserts. The neurodevelopmental arm is present, because
  omitting it would misrepresent the literature, but it is fenced: it lives
  behind an EMERGING `mechanistic_hypotheses` group, its causal edges carry
  `hypothesis_groups`, its phenotypes carry the population-frequency
  counter-evidence in their own notes, and there is a CONTROVERSY discussion
  whose evidence block includes both the risk claim and its refutations.

  NEC preflight on the source literature. Every reference used here was checked
  for the dominant gene before it was quoted. PMID:22566635, PMID:21865298,
  PMID:23092983, PMID:25943046, PMID:39845198, PMID:37553674, PMID:34728372 and
  PMID:28703319 all name TMLHE (or its rodent ortholog Tmlhe / the enzyme TMLD,
  TMLH) as their primary subject. Four references are pathway biochemistry
  rather than disease reports and were included on that basis, with the
  distinction made explicit in each explanation: PMID:11431483 characterises the
  rat and human enzyme, PMID:30898847 the active site of the human enzyme,
  PMID:11802770 and PMID:20306513 the carnitine-biosynthesis pathway as a whole.
  Two references are deliberately used only for narrowly scoped, non-TMLHE
  claims and are flagged as such in their explanations: PMID:28492696 is a
  haemophilia A paper, cited only for the Xq28 int22h genomic architecture in
  which TMLHE sits, and PMID:21629200 is a levocarnitine trial in unselected
  autism spectrum disorder with no TMLHE genotyping at all, cited only to
  establish that such a trial is not evidence about this disorder.

  Two adjacent bodies of literature were examined and discarded rather than
  cherry-picked. A PubMed search for TMLHE returns a substantial cluster of
  haemophilia A / F8 papers (PMID:28492696, PMID:40866891, PMID:21070487,
  PMID:25779970) in which TMLHE appears only because it is the gene next door
  to F8 in the int22h repeat region of Xq28; none of them reports carnitine
  biochemistry or a TMLHE phenotype. A second cluster (PMID:26089202,
  PMID:31275178) concerns SPRY3 and the PAR2 autism-susceptibility region and
  again does not bear on TMLHE function. Neither cluster contributed any claim
  to this entry.

  Nomenclature warnings that a reader of the primary literature will hit. (1)
  The enzyme is written at least five ways across the cited papers:
  epsilon-N-trimethyllysine hydroxylase, N6-trimethyllysine dioxygenase, TMLD,
  TMLH and 6-N-trimethyllysine dioxygenase. All denote the TMLHE gene product.
  (2) PMID:39845198 misspells the gene as "TMHLE" throughout its Results and
  Discussion, including in the sentence quoted as evidence here; the spelling in
  the quotation is the paper's, not an error introduced in curation. (3) The
  same paper's title reads "X-Linked Autism Type 9" while its abstract and body
  both say "X-linked recessive autism, type 6 (OMIM#300872)". OMIM:300872 is the
  MONDO xref for this term and the MONDO synonym is "autism, susceptibility to,
  X-linked 6", so the body is right and the title is a publication error. It is
  recorded here because a curator matching on the title alone would mis-file
  that case report.

  Structured-source evidence was unavailable. There is no ORPHA cache file for
  trimethyllysine hydroxylase deficiency (`grep -il trimethyllysine
  references_cache/ORPHA_*.md` returns nothing) and no ClinGen gene-disease
  validity or dosage record mentioning TMLHE in `references_cache/CGGV_*.md` or
  `references_cache/CGDS_*.md`. No Orphanet prevalence class and no ClinGen
  validity classification could therefore be cited. This is recorded as an
  absence of accessible source, not as an assertion that none exists upstream.

  Deliberately not asserted. Tissue-level expression of TMLHE in human kidney,
  liver, heart, muscle and brain is widely stated but is not in any cached
  abstract available here, so no tissue distribution is claimed anywhere in this
  entry. The molecular identity of the second pathway enzyme
  (3-hydroxy-trimethyllysine aldolase) is contested in the literature and is
  named nowhere in this entry; GO carries an activity term (GO:0120567) but no
  gene assignment is made here. gnomAD constraint metrics, ClinVar counts and
  carrier-female phenotype data were not reachable from a citable cached source
  and are absent rather than estimated. No prenatal, newborn-screening or
  population-screening recommendation is made: this disorder is not on any
  newborn screening panel known to this curation, and given a control male
  frequency near 1 in 366 with penetrance estimated at 2-4%, screening would
  overwhelmingly detect unaffected people.
inheritance:
- name: X-linked recessive inheritance
  description: >-
    TMLHE is on the X chromosome, and every reported enzymatically deficient
    individual is a hemizygous male. The founding deletion was found in a male
    proband, the nonsense allele reported by Nava and colleagues segregated to
    two affected brothers, and the frameshift and stop alleles in the two
    detailed case reports were maternally inherited or hemizygous in males.
    Heterozygous females are not described as enzymatically or clinically
    affected in any cited source, and no female case is curated here.

    Penetrance for any clinical phenotype is recorded as INCOMPLETE, and for this
    disorder that is not a hedge but the central quantitative finding. The
    enzyme deficiency itself is fully penetrant at the biochemical level - the
    metabolite ratio is abnormal in every tested deficient male - while the
    neurodevelopmental phenotype was estimated by the discovery group at 2-4%.
    The great majority of males with the deletion are, so far as is known,
    unaffected. Genetic counselling for this locus is consequently unusual: a
    positive molecular result in a healthy male relative predicts an abnormal
    metabolite profile and very little else.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TMLHE maps to the X chromosome and encodes the first enzyme in carnitine biosynthesis, 6-N-trimethyllysine dioxygenase."
    explanation: Establishes the X-chromosomal location of the causal gene, which is the basis for the X-linked recessive mode in hemizygous males.
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that TMLHE deficiency is a risk factor for autism (metaanalysis Z-score = 2.90 and P = 0.0037), although with low penetrance (2-4%)"
    explanation: The discovery study's own penetrance estimate of 2-4% is the direct source for recording penetrance as incomplete.
  - reference: PMID:23092983
    reference_title: "Analysis of the chromosome X exome in patients with autism spectrum disorders identified novel candidate genes, including TMLHE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A nonsense mutation in TMLHE, which encodes the ɛ-N-trimethyllysine hydroxylase catalyzing the first step of carnitine biosynthesis, was identified in two brothers with autism and ID."
    explanation: Segregation of a nonsense allele to two affected brothers on the X chromosome is the classic X-linked recessive pattern.
prevalence:
- population: Control males, combined North American and European control cohorts
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 273.0
  notes: >-
    24 of 8,787 control males, or about 1 in 366, carried the TMLHE exon 2
    deletion, which the same study shows causes enzyme deficiency. Normalised as
    100000/366 = 273 per 100,000 males. This figure is the single most important
    epidemiological fact about the disorder and is what places it in the
    ABOVE_1_IN_1000 band rather than in a rare-disease band: enzymatic TMLHE
    deficiency is a common variant state in males, not a rare disease, and the
    great majority of the individuals counted here were ascertained as controls
    precisely because they were unaffected. The denominator is a research
    control series, not a population register, so the estimate carries the
    ascertainment limits of that design. No sex-combined or female frequency is
    given because the measurement is of hemizygous males.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TMLHE deficiency is common in control males (24 in 8,787 or 1 in 366) and was not significantly increased in frequency in probands from simplex autism families (9 in 2,904 or 1 in 323)."
    explanation: Direct source for both the control male frequency and, in the same sentence, the null result in simplex autism probands.
- population: Male probands from male-male multiplex autism families
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 770.0
  notes: >-
    7 of 909 probands from male-male multiplex autism families, or about 1 in
    130, normalised as 100000/130 = 769 per 100,000 and rounded to 770. This is
    the only enriched stratum reported. It is recorded as a separate prevalence
    record rather than folded into the control figure because the contrast
    between the two rows is the entire empirical basis of the disputed autism
    association, and collapsing them would hide it. The comparison is 2.82-fold
    at P = 0.023, an unadjusted p-value from a subgroup analysis in which the
    larger simplex arm was null.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, it was 2.82-fold more frequent in probands from male-male multiplex autism families compared with controls (7 in 909 or 1 in 130; P = 0.023)."
    explanation: Direct source for the enriched stratum, its denominator, its effect size and its p-value.
genetic:
- name: TMLHE
  association: >-
    Hemizygous loss-of-function variants in males cause complete enzymatic
    deficiency; the recurrent allele is a deletion of exon 2, and nonsense,
    frameshift and missense loss-of-function alleles are also reported
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TMLHE
    term:
      id: hgnc:18308
      label: TMLHE
  notes: >-
    Gene identity, verified rather than recalled. `runoak -i sqlite:obo:hgnc
    info hgnc:18308` returns TMLHE; the MONDO term carries `RO:0004003
    HGNC:18308`. The gene lies at Xq28. The reference transcript used in the
    most recent case report is NM_018196.4.

    Allelic spectrum, from the cited primary reports only. (1) Deletion of exon
    2, the recurrent and by far the most frequent allele; it abolishes enzyme
    activity and produces the full metabolite signature. (2) A nonsense
    substitution segregating in two brothers, plus two additional missense
    substitutions found by screening 501 male ASD patients and absent from
    controls and databases, all shown by functional analysis to be
    loss-of-function. (3) A maternally inherited frameshift variant in a
    4-year-old boy. (4) A hemizygous three-nucleotide duplication,
    NM_018196.4:c.14_16dup p.(Leu6*), creating a premature stop in exon 1, novel
    and absent from gnomAD v4.1.9, in a 46-year-old man. The consistency of the
    picture matters mechanistically: alleles of four different molecular classes,
    scattered across the gene, all converge on the same loss of a single
    enzymatic activity, so this is a simple loss-of-function locus with no
    evidence of dominant-negative or gain-of-function mechanisms.

    Genomic architecture, and why it probably explains the high allele
    frequency. TMLHE sits in Xq28 immediately adjacent to F8, inside the int22h
    low-copy-repeat region that also drives the intron 22 inversion responsible
    for about half of severe haemophilia A. Recombination between int22h copies
    demonstrably reaches into TMLHE. The obvious inference - that the recurrent
    exon 2 deletion arises by non-allelic homologous recombination between
    int22h copies - is plausible and is NOT asserted here as fact, because no
    cached source states it; only the adjacency and the demonstrated involvement
    of TMLHE in an int22h-mediated rearrangement are evidenced.

    Not asserted. No genotype-phenotype correlation is claimed: there is no
    evidence that any particular allele class is more likely than another to be
    associated with a neurodevelopmental phenotype, and with 2-4% penetrance
    such a correlation could not currently be detected. No modifier locus,
    no founder effect, and no digenic or oligogenic contribution is asserted.
  evidence:
  - reference: PMID:21865298
    reference_title: "Use of array CGH to detect exonic copy number variants throughout the genome in autism families detects a novel deletion in TMLHE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a male proband, an exonic deletion of the TMLHE (trimethyllysine hydroxylase epsilon) that encodes the first enzyme in the biosynthesis of carnitine"
    explanation: The founding observation, an exonic TMLHE deletion in a hemizygous male, identifying the gene and its pathway position.
  - reference: PMID:23092983
    reference_title: "Analysis of the chromosome X exome in patients with autism spectrum disorders identified novel candidate genes, including TMLHE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By screening the TMLHE coding sequence in 501 male patients with ASD, we identified two additional missense substitutions not found in controls and not reported in databases."
    explanation: Extends the allelic spectrum beyond copy-number loss to point substitutions and establishes their absence from controls.
  - reference: PMID:23092983
    reference_title: "Analysis of the chromosome X exome in patients with autism spectrum disorders identified novel candidate genes, including TMLHE."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analyses confirmed that the mutations were associated with a loss-of-function and led to an increase in trimethyllysine, the precursor of carnitine biosynthesis, in the plasma of patients."
    explanation: Establishes the molecular mechanism as loss of function rather than dominant-negative, and ties it to the substrate elevation measured in the same patients.
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present variant, a duplication of three nucleotides, causes a premature stop codon in the first exon of the"
    explanation: Documents a novel premature-termination allele in exon 1, showing that the allelic spectrum is not restricted to the recurrent exon 2 deletion.
  - reference: PMID:28492696
    reference_title: "Complex recombination with deletion in the F8 and duplication in the TMLHE mediated by int22h copies during early embryogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 113.3 kb duplication of part of int22h-2 through the intron 1 of TMLHE inserted in the religated region of the F8"
    explanation: Cited only for genomic architecture. This paper is a haemophilia A report and says nothing about carnitine or about a TMLHE phenotype; it is used solely to evidence that TMLHE lies within the Xq28 int22h low-copy-repeat region and can be swept into rearrangements between int22h copies.
pathophysiology:
- name: Hemizygous Loss-of-Function TMLHE Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is a hemizygous loss-of-function allele of TMLHE at Xq28
    in a male. The recurrent allele is a deletion of exon 2, which is common
    enough in the general male population to be found in 24 of 8,787 controls;
    nonsense, frameshift and loss-of-function missense alleles have also been
    reported. Because males carry a single X, one allele is sufficient to remove
    the activity entirely, and there is no second copy to buffer it.
  genes:
  - preferred_term: TMLHE
    term:
      id: hgnc:18308
      label: TMLHE
  evidence:
  - reference: PMID:21865298
    reference_title: "Use of array CGH to detect exonic copy number variants throughout the genome in autism families detects a novel deletion in TMLHE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a male proband, an exonic deletion of the TMLHE (trimethyllysine hydroxylase epsilon) that encodes the first enzyme in the biosynthesis of carnitine"
    explanation: The index lesion, a hemizygous exonic deletion in a male.
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletion of exon 2 of TMLHE causes enzyme deficiency"
    explanation: States the direct causal link from the recurrent structural allele to loss of enzyme activity.
  downstream:
  - target: Loss of Trimethyllysine Dioxygenase Activity
    causal_link_type: DIRECT
    description: >-
      Loss of coding sequence removes the enzyme. Alleles of four molecular
      classes converge on this single consequence.
- name: Loss of Trimethyllysine Dioxygenase Activity
  biological_scale: MOLECULAR
  description: >-
    TMLHE encodes trimethyllysine dioxygenase, a mitochondrial non-heme Fe(II)
    and 2-oxoglutarate-dependent oxygenase. It performs the stereospecific
    hydroxylation of (2S)-N6-trimethyl-L-lysine at C3 to give
    (2S,3S)-3-hydroxy-N6-trimethyl-L-lysine, consuming 2-oxoglutarate and
    molecular oxygen and requiring a ferrous iron centre. Site-directed
    mutagenesis of the human enzyme maps the catalytic architecture precisely: an
    Fe(II)-binding His-Asp-His facial triad at H242, D244 and H389, an
    arginine pair R391 and R398 that binds 2-oxoglutarate, and an aromatic cage
    of W221, Y217 and Y234 with D231 and N334 that reads the trimethylammonium
    head group of the substrate. That aromatic cage is what makes the enzyme
    specific for the trimethylated lysine rather than lysine itself.

    Two structural facts matter for how loss-of-function alleles behave. The
    enzyme is a homodimer of roughly 87 kDa in the rat, and it is imported into
    mitochondria, where it is processed from a 47.5 kDa precursor to a 43 kDa
    mature protein and is found exclusively in the mitochondrial compartment.
    A premature stop in exon 1, or loss of exon 2, therefore removes the protein
    before it can be targeted or assembled, rather than producing a partially
    active enzyme.

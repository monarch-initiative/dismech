- name: Loss of the Endogenous Arm of Carnitine Homeostasis
  biological_scale: ORGANISM
  description: >-
    This is the node that explains why a complete enzymatic block is usually
    clinically silent, and it is the pivot of the whole entry. Human carnitine
    homeostasis rests on three arms: endogenous biosynthesis, absorption of
    dietary carnitine, and highly efficient tubular reabsorption in the kidney.
    TMLHE deficiency removes exactly one of those three. On an ordinary
    omnivorous diet, where meat and dairy supply most of the body's carnitine,
    the remaining two arms are usually sufficient, and free and total plasma
    carnitine can be entirely normal in a man with a null allele and a grossly
    abnormal metabolite ratio. That dissociation between a fully penetrant
    biochemical block and a normal carnitine level is the reason the disorder is
    common, is usually asymptomatic, and cannot be found by measuring carnitine.

    The corollary is a predicted, and untested, conditional vulnerability:
    individuals who lose one of the two remaining arms as well - through a
    carnitine-poor vegetarian or vegan diet, prematurity or infancy before
    dietary intake is established, renal tubular loss, dialysis, or drugs that
    increase carnitine excretion such as pivalate-conjugated antibiotics or
    valproate - would have no reserve. No study has tested this, and it is
    recorded as a knowledge gap rather than as a mechanism.

- name: Neural Stem Cell Fatty Acid Oxidation Insufficiency
  biological_scale: CELLULAR
  description: >-
    The most concrete mechanistic proposal linking this enzymatic block to
    neurodevelopment, and the reason the autism association is treated as
    unresolved rather than dismissed. In mouse embryonic neocortex, reducing
    TMLHE activity cell-autonomously in neural stem cells reduced the neural
    stem cell pool, as did reducing CPT1A or blocking fatty acid mobilisation
    from lipid droplets. Lineage tracing showed the mechanism: reduced flux
    through fatty acid oxidation shifts neural stem cells from self-renewing
    divisions toward symmetric differentiating divisions, so the progenitor pool
    is consumed early.

    Three caveats are load-bearing. The work is in mouse embryonic brain, not
    human. It is a knockdown of activity in a specific compartment, not a whole
    animal null - and the whole animal null, tested separately, has no
    behavioural phenotype. And it establishes a developmental consequence of
    reduced fatty acid oxidation in general, with TMLHE as one of three ways of
    producing that state, rather than anything specific to this disorder.

- name: Reduced Carnitine-Dependent Long-Chain Fatty Acid Oxidation Capacity
  biological_scale: CELLULAR
  description: >-
    Carnitine's essential function is to carry activated long-chain fatty acyl
    groups across the inner mitochondrial membrane for beta-oxidation. Where
    carnitine biosynthesis is the limiting supply, the carnitine shuttle and
    long-chain fatty acid oxidation are constrained downstream of it.

    The quantitative demonstration is in the knockout mouse rather than in
    humans, and the numbers are large: deleting Tmlhe lowered acylcarnitine
    concentrations in blood and cardiac tissue by up to 85% and reduced fatty
    acid oxidation by 30%. What is notable is what did not follow. Muscle and
    heart function were unaffected, life expectancy was normal, and the animals
    did not develop the phenotype of primary carnitine deficiency. The
    fatty-acid-oxidation deficit in this disorder is therefore real but
    subclinical at rest, which is consistent with the human observation that
    deficient males are usually well.

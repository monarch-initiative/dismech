- name: Trimethyllysine Accumulation
  biological_scale: ORGANISM
  description: >-
    The substrate side of the block is not merely a diagnostic curiosity. In the
    patients reported by Nava and colleagues, plasma trimethyllysine rose two to
    threefold, and those authors proposed that elevated trimethyllysine might
    itself be toxic to the developing central nervous system rather than the
    disorder acting purely through carnitine deficiency. This is a substrate
    toxicity hypothesis in the classic mould of the intoxication-type inborn
    errors, and it is important because it is the one mechanism that could
    explain a neurodevelopmental phenotype in a male whose plasma carnitine is
    normal. It is unproven: no cited study demonstrates neurotoxicity of
    trimethyllysine at the concentrations observed, and the constitutive mouse
    knockout, which also accumulates substrate, is behaviourally normal.

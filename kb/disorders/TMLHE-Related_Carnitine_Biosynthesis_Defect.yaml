- name: Block at the First Step of Carnitine Biosynthesis
  biological_scale: MOLECULAR
  description: >-
    Carnitine biosynthesis in humans proceeds through four enzymatic steps, and
    TMLD catalyses the first. Its substrate, N6-trimethyl-L-lysine, is not
    synthesised de novo as a free amino acid but is liberated from proteins that
    carry trimethylated lysine residues; downstream of TMLD the pathway proceeds
    through 3-hydroxy-N6-trimethyl-L-lysine, then
    4-N-trimethylaminobutyraldehyde, then gamma-butyrobetaine, which the final
    hydroxylase converts to carnitine.

    Blocking step one produces a signature with a characteristic shape: the
    substrate accumulates and every downstream intermediate falls together.
    Trimethyllysine rises in plasma and urine while 3-hydroxy-trimethyllysine
    and gamma-butyrobetaine fall. Because both arms move in opposite directions,
    the ratio of gamma-butyrobetaine to trimethyllysine is a far more sensitive
    readout than either metabolite alone, and it is the ratio that has been used
    to confirm pathogenicity of novel alleles.

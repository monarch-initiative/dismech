    explanation: Maps the catalytic and substrate-recognition residues of the human enzyme, from a 19-variant site-directed mutagenesis series.
  - reference: PMID:11431483
    reference_title: "Molecular and Biochemical Characterization of Rat epsilon -N-Trimethyllysine Hydroxylase, the First Enzyme of Carnitine Biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO

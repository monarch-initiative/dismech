- name: Depleted Long-Chain Acylcarnitine Pool
  biological_scale: MOLECULAR
  description: >-
    A consequence of the block that runs counter to the intuition that less
    carnitine must be worse. Long-chain acylcarnitines are themselves
    proinflammatory and pro-oxidant species whose accumulation drives
    mitochondrial injury during ischaemia and reperfusion. In TMLHE knockout
    mice the depleted acylcarnitine pool was protective: OXPHOS-dependent
    respiration and coupling efficiency were fully preserved in the risk area of
    ischaemic hearts, reperfusion-induced ROS production in cardiac mitochondria
    was prevented, and infarct size was 39% smaller. The metabolome also shifted
    globally from saturated toward unsaturated lipids.

    This node is included because it disciplines the rest of the entry. A
    curation that treated this disorder purely as "carnitine deficiency, hence
    harm" would be contradicted by its own best-quantified in vivo data. It also
    supplies the pharmacological context: inhibition of the fourth enzyme of the
    same pathway is an established cardioprotective strategy, so partial
    blockade of carnitine biosynthesis is a drug mechanism, not only a disease
    mechanism.

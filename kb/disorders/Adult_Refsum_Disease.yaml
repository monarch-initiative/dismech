      Structural enzymology supports PAHX/PHYH mutations as disrupting the
      peroxisomal enzyme that catalyzes the initial alpha-oxidation step.
    supporting_text: >-
      mutations in phytanoyl-CoA 2-hydroxylase (PAHX), an Fe(II) and
      2-oxoglutarate (2OG)-dependent oxygenase that catalyzes the initial
      alpha-oxidation step
- reference: PMID:4164676
  title: Studies on the metabolic error in Refsum's disease.
  found_in:
  - Adult_Refsum_Disease-deep-research-fallback.md
  findings:
  - statement: >-
      Classic metabolic tracer work supports exogenous phytanic acid origin and
      a block in phytanic acid degradation.
    supporting_text: >-
      patients with Refsum's disease have a relative block in the degradation
      of phytanic acid
- reference: PMID:2475586
  title: The significance of plasma phytanic acid levels in adults.
  found_in:
  - Adult_Refsum_Disease-deep-research-fallback.md
  findings:
  - statement: >-
      Plasma phytanic acid measurement distinguishes classic Refsum disease
      from normal controls and many retinitis pigmentosa cases.
    supporting_text: >-
      Fourteen patients with heredopathia atactica polyneuritiformis had a
      plasma phytanic acid level before treatment of 992-6400 mumol/l.
- reference: PMID:6170281
  title: "Heredopathia atactica polyneuritiformis phytanic-acid storage disease, Refsum's disease:\" a biochemically well-defined disease with a specific dietary treatment."
  found_in:
  - Adult_Refsum_Disease-deep-research-fallback.md
  findings:
  - statement: >-
      Dietary elimination of phytanic-acid-rich foods is a disease-specific
      treatment that can improve or stabilize manifestations.
    supporting_text: >-
      can be either kept from worsening or reversed by elimination of foods rich
      in phytanic acid from patients' diets.
- reference: PMID:1716665
  title: "Plasma exchange in the treatment of Refsum's disease (heredopathia atactica polyneuritiformis)."
  found_in:
  - Adult_Refsum_Disease-deep-research-fallback.md
  findings:
  - statement: >-
      Plasma exchange can rapidly lower phytanic acid and improve acute or
      severe worsening disease.
    supporting_text: >-
      Lowering the plasma phytanic acid by plasma exchange produced a rapid
      clinical improvement.
- reference: PMID:10150979
  title: Plasma exchange for Refsum's disease.
  found_in:
  - Adult_Refsum_Disease-deep-research-fallback.md
  findings:
  - statement: >-
      Additional plasma-exchange clinical evidence supports use during worsening
      disease or failure of dietary control.
    supporting_text: >-
      Plasma exchange is indicated in Refsum's disease when there is a worsening
      clinical condition.
- reference: PMID:11589979
  title: The site of the hearing loss in Refsum's disease.
  found_in:
  - Adult_Refsum_Disease-deep-research-fallback.md
  findings:
  - statement: >-
      Case evidence supports hearing loss as part of the Refsum phenotype and
      suggests auditory neuropathy in some cases.
    supporting_text: >-
      Refsum's disease is a disorder of lipid metabolism with pigmentary
      retinopathy, demyelinating neuropathy, ataxia, and hearing loss.
- reference: PMID:11948235
  title: "Refsum's disease: a peroxisomal disorder affecting phytanic acid alpha-oxidation."
  findings:
  - statement: >-
      Low-phytanic-acid atypical cases may instead reflect
      alpha-methylacyl-CoA racemase deficiency, an important biochemical and
      molecular differential diagnosis.
    supporting_text: >-
      Other atypical cases with low-plasma phytanic acid may be caused by
      alpha-methylacyl-CoA racemase deficiency.
- reference: PMID:17325280
  title: Phenotype of adult Refsum disease due to a defect in peroxin 7.
  findings:
  - statement: >-
      Adult Refsum disease can be divided into PHYH-related type 1 and
      PEX7-related type 2, whose reported clinical phenotype can be
      indistinguishable from classic disease.
    supporting_text: >-
      Hence, we propose the subdivision of ARD into type 1 and type 2,
      depending on which gene is defective.
- reference: PMID:38411969
  title: PHYH c.678+5G>T Leads to In-Frame Exon Skipping and Is Associated With Attenuated Refsum Disease.
  findings:
  - statement: >-
      The PHYH c.678+5G>T splice variant can produce an attenuated presentation
      with isolated retinitis pigmentosa or mild extraocular findings and
      normal-to-markedly-elevated plasma phytanic acid.
    supporting_text: >-
      One patient had isolated retinitis pigmentosa and three had mild
      extraocular findings. Blood phytanic acid levels were normal in two
      patients, mildly elevated in one, and markedly high in the fourth.
- reference: PMID:41290216
  title: Identification of novel pathogenic variants in the PHYH gene and extending the phenotypic range in Refsum disease.
  findings:
  - statement: >-
      Two recent retinal-clinic cases identified novel biallelic PHYH variants and
      extended the reported ocular spectrum to macular dystrophy.
    supporting_text: >-
      We document for the first time an association between macular dystrophy
      and Refsum disease.
- reference: PMID:36812958
  title: "Disruption of mitochondrial bioenergetics and calcium homeostasis by phytanic acid in the heart: Potential relevance for the cardiomyopathy in Refsum disease."
  findings:
  - statement: >-
      In vitro cardiac experiments support phytanic-acid-induced disruption of
      mitochondrial respiration, ATP synthesis, membrane potential, calcium
      retention, and cardiomyocyte viability as a provisional cardiac mechanism.
    supporting_text: >-
      The present data indicate that Phyt, at concentrations found in the plasma
      of patients with Refsum disease, disrupts by multiple mechanisms
      mitochondrial bioenergetics and Ca2+ homeostasis
- reference: PMID:32904930
  title: Improved electroretinographic responses following dietary intervention in a patient with Refsum disease.
  findings:
  - statement: >-
      A molecularly and biochemically confirmed case showed improved
      electroretinographic responses after starting a phytanic-acid-restricted diet.
    supporting_text: >-
      His post-intervention 30 Hz flicker electroretinogram demonstrated
      significantly improved waveform amplitudes and implicit times, suggesting
      improved retinal function.
- reference: PMID:26799636
  title: "Safety of long-term restrictive diets for peroxisomal disorders: vitamin and trace element status of patients treated for Adult Refsum Disease."
  findings:
  - statement: >-
      Long-term low-phytanic-acid diets can be managed without routine
      supplementation, but periodic nutritional screening is warranted.
    supporting_text: >-
      Periodic nutritional screening may be necessary for fat-soluble vitamins,
      vitamin B12 , copper or selenium.
- reference: PMID:42145913
  title: "Adult Refsum Disease: Case Series of Reducing Circulating Phytanic Acid Levels With Dietary Interventions."
  findings:
  - statement: >-
      Recent case-series evidence shows that phytanic-acid restriction must be
      paired with adequate energy and carbohydrate intake and weight stability.
    supporting_text: >-
      These cases demonstrate that PA restriction, and weight and carbohydrate
      management have integral roles in ensuring metabolic stability in ARD.
- reference: PMID:42161578
  title: "Diagnosis and Metabolic Management of Adult Refsum Disease: Guidance From the Medical and Scientific Committee of Global DARE (Defeat Adult Refsum Everywhere)."
  findings:
  - statement: >-
      The 2026 GRADE-aligned expert guidance identifies lifelong dietary therapy
      as the mainstay and reserves therapeutic plasma exchange or lipoprotein
      apheresis for acute decompensation.
    supporting_text: >-
      Life-long dietary therapy, along with therapeutic plasma
      exchange/lipoprotein apheresis during acute decompensations, remains the
      mainstay of management.

name: Adult Refsum Disease
creation_date: "2026-05-07T03:23:42Z"
category: Genetic
parents:
- Peroxisomal Disease
- Hereditary Neuropathy
synonyms:
- Classic Refsum disease
- HMSN 4
- Hereditary motor and sensory neuropathy type 4
- Heredopathia atactica polyneuritiformis
- Phytanic-CoA hydroxylase deficiency
description: >-
  Adult Refsum disease is an autosomal recessive peroxisomal metabolic disorder
  caused by biallelic pathogenic variants in PHYH (type 1) or, less commonly,
  PEX7 (type 2).
  Impaired peroxisomal phytanic acid alpha-oxidation causes phytanic acid
  accumulation in plasma and tissues, leading to retinitis pigmentosa,
  anosmia, peripheral neuropathy, ataxia, hearing impairment, ichthyosis,
  skeletal findings, and potentially severe cardiomyopathy or arrhythmia.
disease_term:
  preferred_term: adult Refsum disease
  term:
    id: MONDO:0009958
    label: adult Refsum disease
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0009958
      label: adult Refsum disease
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      Recorded as narrowMatch, not exactMatch: the MONDO term is labelled and
      defined clinically ("anosmia, early-onset retinitis pigmentosa...") but is
      axiomatized as `is_a MONDO:0100258` phytanoyl-CoA hydroxylase deficiency,
      which restricts it to PHYH-caused disease. This entry covers both PHYH
      (type 1, >90%) and PEX7 (type 2, <10%) disease per PMID:20301527, so it is
      broader than the MONDO class as currently axiomatized. MONDO's own
      MONDO:0100307 "adult Refsum disease due to PEX7 defect" is defined as "an
      adult Refsum disease", which cannot hold alongside that is_a edge; MONDO
      avoids the contradiction only by not asserting it. Retained as the entry's
      disease_term because it is the closest available grounding.
    tracked_issues:
    - url: https://github.com/monarch-initiative/mondo/issues/10377
      title: Request for new term [Adult Refsum Disease] PARENT CONCEPT
      tracked_issue_role: ontology_term_request
      tracked_issue_status: OPEN
      notes: >-
        Requests exactly this fix - rename MONDO:0009958 to a PHYH-specific
        label and create a new parent term for adult Refsum disease over the
        PHYH and PEX7 subtypes, citing the same GeneReviews source this entry
        cites. If it lands, reground this entry to the new parent term and
        reground the "Type 1" subtype from MONDO:0100258 to the renamed
        MONDO:0009958.

datasets:
- accession: geo:GSE138379
  title: Fibroblast-specific genome-scale modelling predicts an imbalance in amino acid metabolism in Refsum disease
  description: In this study, we reconstructed a fibroblast-specific genome-scale model based on the recently published, FAD-curated model, based on Recon3D reconstruction. To constrain the model we used transcriptomics, and proteomics data, which we obtained from healthy controls and Refsum disease patient fibroblasts incubated with phytol, a precursor of phytanic acid. Using this model, we investigated the metabolic phenotype of Refsum disease at the genome-scale, and we studied the effect of phytanic acid on cell metabolism. We identified 20 metabolites that were predicted to discriminate between Healthy and Refsum disease patients, several of which with a link to amino acid metabolism.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 96
  publication: PMID:32160399
  notes: Identified by GEO DataSets index search for Adult Refsum Disease (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

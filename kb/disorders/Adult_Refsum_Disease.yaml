biochemical:
- name: Elevated plasma and tissue phytanic acid
  presence: Elevated
  notes: >-
    Elevated phytanic acid in plasma and tissues is the defining biochemical
    abnormality and is used diagnostically and for treatment monitoring.
  evidence:
  - reference: ORPHA:773
    reference_title: Adult Refsum disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is characterized biochemically by accumulation of phytanic acid in plasma and tissues."
    explanation: Orphanet identifies phytanic acid accumulation as the biochemical hallmark.
  - reference: PMID:2475586
    reference_title: The significance of plasma phytanic acid levels in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen patients with heredopathia atactica polyneuritiformis had a plasma phytanic acid level before treatment of 992-6400 mumol/l."
    explanation: Human clinical study quantifies marked pretreatment plasma phytanic acid elevation.
- name: Exogenous phytanic acid retention
  presence: Positive
  notes: >-
    Dietary phytol and phytanic acid are normally cleared, but persist in plasma
    in Adult Refsum disease because degradation is blocked.
  evidence:
  - reference: PMID:4164676
    reference_title: Studies on the metabolic error in Refsum's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "establishing phytol in the diet as a potential precursor of phytanic acid."
    explanation: Tracer study supports dietary phytol as a phytanic acid precursor.
  - reference: PMID:4164676
    reference_title: Studies on the metabolic error in Refsum's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas it persisted at high concentrations in the plasma of the two patients for many days."
    explanation: Tracer study supports delayed clearance in patients.
diagnosis:
- name: Plasma phytanic acid testing
  description: >-
    Plasma phytanic acid measurement is the core biochemical diagnostic test and
    helps distinguish classic Adult Refsum disease from isolated retinitis
    pigmentosa and other disorders. Some attenuated PHYH genotypes can have a
    normal result, so molecular testing remains important when suspicion persists.
  results: >-
    Marked elevation strongly supports diagnosis; a normal concentration does
    not fully exclude attenuated retinal-predominant PHYH disease.
  evidence:
  - reference: PMID:2475586
    reference_title: The significance of plasma phytanic acid levels in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of phytanic acid in tissues and plasma has been considered diagnostic of heredopathia atactica polyneuritiformis (Refsum's disease)"
    explanation: Human clinical study supports plasma/tissue phytanic acid as diagnostic.
  - reference: PMID:20301527
    reference_title: Adult Refsum Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adult Refsum disease (ARD) is associated with elevated plasma phytanic acid levels"
    explanation: GeneReviews supports elevated plasma phytanic acid testing.
  - reference: PMID:38411969
    reference_title: PHYH c.678+5G>T Leads to In-Frame Exon Skipping and Is Associated With Attenuated Refsum Disease.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blood phytanic acid levels were normal in two patients, mildly elevated
      in one, and markedly high in the fourth.
    explanation: Four genetically confirmed attenuated cases demonstrate that plasma phytanic acid is not uniformly elevated.
- name: PHYH and PEX7 molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Molecular testing confirms biallelic pathogenic variants in PHYH or PEX7
    and distinguishes PHYH-related disease from PEX7-related disease and other
    peroxisomal disorders.
  results: Biallelic pathogenic variants in PHYH or PEX7 establish the molecular diagnosis.
  evidence:
  - reference: PMID:20301527
    reference_title: Adult Refsum Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ARD is established in a proband with suggestive clinical and biochemical findings by identification of biallelic pathogenic variants in either PHYH or PEX7 on molecular genetic testing."
    explanation: GeneReviews states the diagnostic role of PHYH/PEX7 molecular testing.
  - reference: PMID:38411969
    reference_title: PHYH c.678+5G>T Leads to In-Frame Exon Skipping and Is Associated With Attenuated Refsum Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had isolated retinitis pigmentosa and three had mild
      extraocular findings. Blood phytanic acid levels were normal in two
      patients, mildly elevated in one, and markedly high in the fourth.
    explanation: The attenuated series supports molecular testing when retinal disease is suggestive despite a normal biochemical result.
treatments:
- name: Phytanic-acid-restricted diet and fasting avoidance
  description: >-
    Long-term management restricts phytanic-acid-rich foods, avoids fasting and
    sudden weight loss, and maintains adequate calories to reduce mobilization
    of stored phytanic acid.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Plasma and Tissue Phytanic Acid Accumulation
    treatment_effect: INHIBITS
    description: Dietary restriction lowers exogenous phytanic acid input and limits mobilization from adipose stores.
    evidence:
    - reference: PMID:20301527
      reference_title: Adult Refsum Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dietary restriction of phytanic acid intake helps resolve ichthyosis, sensory neuropathy, and ataxia."
      explanation: GeneReviews supports diet as a phytanic-acid-lowering disease management strategy.
  evidence:
  - reference: PMID:6170281
    reference_title: "Heredopathia atactica polyneuritiformis phytanic-acid storage disease, Refsum's disease:\" a biochemically well-defined disease with a specific dietary treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can be either kept from worsening or reversed by elimination of foods rich in phytanic acid from patients' diets."
    explanation: Long-term clinical experience supports a specific phytanic-acid-restricted diet.
  - reference: PMID:20301527
    reference_title: Adult Refsum Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A high-calorie diet and avoidance of fasting prevent mobilization of phytanic acid stored in adipose tissue into the plasma."
    explanation: GeneReviews supports fasting avoidance and adequate calories.
  - reference: PMID:42145913
    reference_title: 'Adult Refsum Disease: Case Series of Reducing Circulating Phytanic Acid Levels With Dietary Interventions.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Implementing dietary interventions to ensure adequate energy,
      carbohydrates and weight stabilisation resulted in a decrease in
      circulating PA levels by 47%-84% in the outpatient setting.
    explanation: The six-patient case series quantifies the benefit of adequate energy, carbohydrate, and weight stabilization.
  - reference: PMID:42161578
    reference_title: 'Diagnosis and Metabolic Management of Adult Refsum Disease: Guidance From the Medical and Scientific Committee of Global DARE (Defeat Adult Refsum Everywhere).'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Life-long dietary therapy, along with therapeutic plasma
      exchange/lipoprotein apheresis during acute decompensations, remains the
      mainstay of management.
    explanation: The 2026 GRADE-aligned expert guidance confirms lifelong dietary therapy as the mainstay.
- name: Plasmapheresis or lipid apheresis for severe acute worsening
  description: >-
    Plasma exchange or lipid apheresis is reserved for acute arrhythmias,
    extreme weakness, severe rapidly worsening disease, or failure of dietary
    control to lower very high phytanic acid levels.
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Plasma and Tissue Phytanic Acid Accumulation
    treatment_effect: INHIBITS
    description: Plasma exchange lowers circulating phytanic acid.
    evidence:
    - reference: PMID:1716665
      reference_title: Plasma exchange in the treatment of Refsum's disease (heredopathia atactica polyneuritiformis).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lowering the plasma phytanic acid by plasma exchange produced a rapid clinical improvement."
      explanation: Case series supports rapid clinical improvement after lowering phytanic acid by plasma exchange.
  evidence:
  - reference: PMID:20301527
    reference_title: Adult Refsum Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasmapheresis or lipid apheresis to decrease phytanic acid levels is used only for acute arrhythmias or extreme weakness."
    explanation: GeneReviews supports restricted use of plasmapheresis/lipid apheresis for severe manifestations.
  - reference: PMID:10150979
    reference_title: Plasma exchange for Refsum's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma exchange is indicated in Refsum's disease when there is a worsening clinical condition."
    explanation: Clinical review supports plasma exchange for worsening disease.
  - reference: PMID:42161578
    reference_title: 'Diagnosis and Metabolic Management of Adult Refsum Disease: Guidance From the Medical and Scientific Committee of Global DARE (Defeat Adult Refsum Everywhere).'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Life-long dietary therapy, along with therapeutic plasma
      exchange/lipoprotein apheresis during acute decompensations, remains the
      mainstay of management.
    explanation: The 2026 expert guidance supports apheresis during acute decompensation.
- name: Nutritional monitoring during long-term dietary therapy
  description: >-
    Periodically assess fat-soluble vitamins, vitamin B12, copper, selenium,
    and sodium intake during a long-term low-phytanic-acid diet.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26799636
    reference_title: 'Safety of long-term restrictive diets for peroxisomal disorders: vitamin and trace element status of patients treated for Adult Refsum Disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Periodic nutritional screening may be necessary for fat-soluble vitamins,
      vitamin B12 , copper or selenium.
    explanation: The nutritional cohort identifies specific monitoring needs during dietary treatment.
- name: Medication and catabolic-trigger avoidance
  description: >-
    Avoid phytanic-acid-rich foods, fasting, sudden weight loss, ibuprofen, and
    amiodarone; provide high-calorie support during severe illness or surgery.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301527
    reference_title: Adult Refsum Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Food products containing phytanic acid, mostly from ruminants (cow,
      sheep, goat), some fish and walnuts; fasting and/or sudden weight loss;
      use of either ibuprofen or amiodarone.
    explanation: GeneReviews explicitly lists disease-specific agents and circumstances to avoid.
  - reference: PMID:20301527
    reference_title: Adult Refsum Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypercaloric parenteral infusions are required during periods of severe
      illness or postoperatively.
    explanation: GeneReviews supports catabolic prevention during severe illness and surgery.
differential_diagnoses:
- name: Alpha-methylacyl-CoA racemase deficiency
  description: >-
    AMACR deficiency can resemble an atypical Refsum phenotype with retinal and
    neurologic disease but may have low plasma phytanic acid; biochemical
    profiling and molecular testing distinguish it from PHYH- or PEX7-related disease.
  evidence:
  - reference: PMID:11948235
    reference_title: "Refsum's disease: a peroxisomal disorder affecting phytanic acid alpha-oxidation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other atypical cases with low-plasma phytanic acid may be caused by
      alpha-methylacyl-CoA racemase deficiency.
    explanation: The review directly identifies AMACR deficiency as a differential in low-phytanic-acid atypical cases.

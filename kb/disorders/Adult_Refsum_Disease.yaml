  gene_term:
    preferred_term: PHYH
    term:
      id: hgnc:8940
      label: PHYH
  notes: >-
    PHYH encodes phytanoyl-CoA 2-hydroxylase, the peroxisomal enzyme that
    initiates alpha-oxidation of phytanic acid. Pathogenic alleles include
    nonsense, frameshift, missense, and splice-altering variants; residual
    in-frame transcript can produce an attenuated retinal-predominant phenotype.
  variants:
  - name: PHYH c.678+5G>T
    type: splice-region variant
    clinical_significance: PATHOGENIC
    description: >-
      This allele causes substantial in-frame skipping of exons 5 and 6 and is
      associated with isolated retinitis pigmentosa or mild extraocular disease;
      plasma phytanic acid may be normal, mildly elevated, or markedly elevated.
    evidence:
    - reference: PMID:38411969
      reference_title: PHYH c.678+5G>T Leads to In-Frame Exon Skipping and Is Associated With Attenuated Refsum Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In all patients, we observed in-frame skipping of exons 5 and 6 in 31.1%
        to 88.4% of the amplicons and a smaller proportion (0% to 11.3% of
        amplicons) skipping exon 6 only.
      explanation: Patient-derived blood RNA sequencing directly demonstrates the splice effect.
    - reference: PMID:38411969
      reference_title: PHYH c.678+5G>T Leads to In-Frame Exon Skipping and Is Associated With Attenuated Refsum Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One patient had isolated retinitis pigmentosa and three had mild
        extraocular findings. Blood phytanic acid levels were normal in two
        patients, mildly elevated in one, and markedly high in the fourth.
      explanation: The four-patient series defines the attenuated phenotype and biochemical variability.
  - name: PHYH p.(Val93*) and p.(Asn71Ilefs*23)
    type: nonsense and frameshift variants
    clinical_significance: PATHOGENIC
    description: >-
      One recently reported patient had the novel biallelic nonsense and
      frameshift alleles p.(Val93*) and p.(Asn71Ilefs*23).
    evidence:
    - reference: PMID:41290216
      reference_title: Identification of novel pathogenic variants in the PHYH gene and extending the phenotypic range in Refsum disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Molecular genetic testing in P1 revealed two novel pathogenic variants
        in PHYH (NM_006214.4): p.(Val93*) and p.(Asn71Ilefs*23).
      explanation: The case report documents representative nonsense and frameshift PHYH alleles.

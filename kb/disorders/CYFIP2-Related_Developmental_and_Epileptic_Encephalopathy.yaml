    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed trio-based whole-exome sequencing (WES) in 210 families and case-only WES in 489 individuals
      with epileptic encephalopathies
    explanation: >-
      Describes the sequencing strategy through which the gene-disease relationship was established.

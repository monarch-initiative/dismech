- category: Neurodevelopmental
  name: Impaired Social Communication
  description: >-
    Autistic features and impaired social communication are documented in affected
    individuals and reproduced in the mouse as impaired ultrasonic vocalization and social
    interaction deficits.
  phenotype_term:
    preferred_term: Impaired social communication
  evidence:
  - reference: PMID:36251395
    reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "including spasmlike movements, microcephaly, and impaired social
      communication"
    explanation: >-
      Lists impaired social communication among the patient phenotypes reproduced in the
      model.
  notes: >-
    Deliberately left unbound - needs term / NTR. HP:0000735 "Impaired social
    interactions" is obsolete, and the available alternatives do not fit: HP:0008763 "No
    social interaction" is absolute where the source says impaired, and HP:5200026
    "Impaired social imitation" is narrower than the claim. Binding HP:0000729 "Autistic
    behavior" would be an interpretive leap beyond what the quoted source states. A
    precise unbound descriptor is preferred here over a term that would misstate the
    finding.

- category: Neuroimaging
  name: Normal or Nonspecific Brain MRI
  description: >-
    Brain MRI is frequently unremarkable despite a severe clinical and electrical picture.
    This is a positive curatorial point rather than an absence of information: a normal
    MRI in a child with refractory infantile spasms is itself a discriminating feature,
    and it is what makes this a functional rather than a malformation disorder.
  evidence:
  - reference: PMID:36968925
    reference_title: "Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical Case Description."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed no pathological changes"
    explanation: >-
      Records a normal MRI in a genotype-confirmed infant with severe early infantile
      epileptic encephalopathy.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    42 individuals with pathogenic or likely pathogenic CYFIP2 variants had been reported
    at the time of the most recent literature review. No population prevalence estimate
    exists; all knowledge derives from clinical sequencing referral cohorts rather than
    population-based ascertainment, so the true frequency is unknown and probably
    underestimated.
  evidence:
  - reference: DOI:10.1002/cns3.70036
    reference_title: "Expanding the Phenotype of CYFIP2‐ Related Developmental Epileptic Encephalopathy: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 41 additional patients with pathogenic or likely pathogenic"
    explanation: >-
      The literature review that establishes the cumulative case count, 41 additional
      patients alongside the index case reported in the same paper.
  - reference: PMID:33149277
    reference_title: "New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental disorder and impairment of the WRC-mediated actin dynamics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a total of only 18 individuals with CYFIP2 variants have been described to
      date"
    explanation: >-
      The earlier cumulative count, retained to show the trajectory of ascertainment - the
      reported cohort more than doubled between these two reviews.

genetic:
- name: CYFIP2
  gene_term:
    preferred_term: CYFIP2
    term:
      id: hgnc:13760
      label: CYFIP2
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous de novo missense variants in CYFIP2 cause DEE65. Variants cluster at two
    hotspots, p.Arg87 and p.Asp724, and the hotspot identity predicts severity: Arg87
    substitutions give a consistently severe phenotype while Asp724 and other
    substitutions give a more variable one.
  evidence:
  - reference: PMID:33149277
    reference_title: "New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental disorder and impairment of the WRC-mediated actin dynamics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation confirms a consistently severe phenotype in
      p.Arg87 patients but a more variable phenotype in p.Asp724 and other substitutions"
    explanation: >-
      States the hotspot-dependent severity difference that makes the genotype
      prognostically informative: Arg87 consistently severe, Asp724 variable.
  - reference: PMID:30664714
    reference_title: "Spatially clustering de novo variants in CYFIP2, encoding the cytoplasmic FMRP interacting protein 2, cause intellectual disability and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report 12 independent patients harboring a variety of de novo
      variants in CYFIP2 broadening the molecular and clinical spectrum of a novel
      CYFIP2-related neurodevelopmental disorder"
    explanation: >-
      Establishes the breadth of the variant spectrum beyond the original hotspot.
  - reference: PMID:33149277
    reference_title: "New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental disorder and impairment of the WRC-mediated actin dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By structural modeling and investigation of WAVE-regulatory complex
      (WRC)-mediated actin polymerization in six patient fibroblast lines we assessed the
      impact of CYFIP2 variants on the WRC"
    explanation: >-
      Records that the functional assessment was done in six primary patient fibroblast
      lines, which is what moves the actin finding out of heterologous overexpression.
  - reference: DOI:10.1002/cns3.70036
    reference_title: "Expanding the Phenotype of CYFIP2‐ Related Developmental Epileptic Encephalopathy: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Arg87Cys variant was present in 12/42 (29%) patients"
    explanation: >-
      Quantifies the share of cases attributable to the single most common variant, which
      is what makes Arg87 a hotspot rather than merely a recurrent observation.
  notes: >-
    An in-frame deletion that removes codon 87 entirely, c.258_266del p.(Trp86_Ser88del),
    has been reported and produces the severe Arg87-hotspot phenotype - consistent with
    the interface account, since deleting the residue and substituting it have the same
    structural consequence. Rare truncating variants are reported with a milder phenotype
    and are of less certain significance; whether they act by haploinsufficiency is not
    settled, and this entry does not model them as a separate mechanism.
    The paralog CYFIP1 sits at the same cytogenetic band and lies within the 15q11.2
    microdeletion region, but causes a different disorder and is not to be conflated with
    CYFIP2.

diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    The disorder is defined genotypically. Because MRI is often normal and the clinical
    and EEG picture is shared with many other genetic developmental and epileptic
    encephalopathies, trio-based broad sequencing is what makes the diagnosis, and the
    trio design is what establishes de novo status.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:29534297
    reference_title: "De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed trio-based whole-exome sequencing (WES) in 210 families and
      case-only WES in 489 individuals with epileptic encephalopathies"
    explanation: >-
      Describes the sequencing strategy through which the gene-disease relationship was
      established.

- name: Electroencephalography
  description: >-
    EEG is central to recognising the syndrome even though MRI is often normal. The
    interictal patterns reported span burst-suppression and hypsarrhythmia, mapping onto
    Ohtahara and West syndrome respectively - so a single genotype can present under more
    than one electroclinical syndrome label.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:36968925
    reference_title: "Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical Case Description."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial interictal electroencephalograms showed a burst-suppression pattern
      and/or hypsarrhythmia, which were compatible with Ohtahara syndrome and West
      syndrome, respectively"
    explanation: >-
      Documents both EEG patterns and the two electroclinical syndromes they correspond
      to, in a genotype-confirmed patient.

treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are characteristically drug-resistant and typically require multiple agents.
    No agent is established as preferred in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:36968925
    reference_title: "Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical Case Description."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "When he started having infantile spasms, and there was evidence of small
      fragments of disorganized activity on EEG, vigabatrin was also started with
      transitory clinical improvement"
    explanation: >-
      Records vigabatrin producing only transitory improvement. Marked PARTIAL because it
      documents an attempted treatment and its limited effect, not an effective one.
  notes: >-
    No antiseizure agent has disease-specific efficacy evidence in CYFIP2-related DEE. The
    evidence item above is curated as a record of what was tried and how it failed, rather
    than as support for a recommendation. Vigabatrin, phenobarbital, valproic acid and a
    ketogenic diet were all used in the cited patient without achieving control.

animal_models:
- name: Cyfip2 p.Arg87Cys knock-in mouse
  species: Mouse
  genotype: Cyfip2+/R87C
  publication: PMID:36251395
  description: >-
    A genotype-matched knock-in carrying the human hotspot variant. It is unusually
    faithful for an epilepsy model, reproducing not just seizures but the specific
    spasm-like semiology, and it is the source of the protein-destabilization evidence.
  modeled_mechanisms:
  - target: Enhanced CYFIP2 Ubiquitination and Proteasomal Degradation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model in which the degradation mechanism was demonstrated, in brain tissue.
    readouts:
    - name: Brain CYFIP2 protein abundance
      target: Enhanced CYFIP2 Ubiquitination and Proteasomal Degradation
      direction: DECREASED
      interpretation: >-
        Steady-state CYFIP2 is reduced in the brains of knock-in mice.
      evidence:
      - reference: PMID:36251395
        reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Beyond identifying a decrease in CYFIP2 protein levels in the
          Cyfip2+/R87C brains"
        explanation: >-
          The abundance measurement behind this readout.
    evidence:
    - reference: PMID:36251395
      reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we demonstrated that the p.Arg87Cys variant enhances ubiquitination and
        proteasomal degradation of CYFIP2"
      explanation: >-
        Supports the model as the system in which this mechanism was established.
  - target: Drug-Resistant Epilepsy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mouse reproduces the neonatal spasm phase, but then passes through a seizure-free
      interval before developing spontaneous recurrent seizures in adulthood. Human
      DEE65 is not described as having such a latent phase, so the model's temporal
      structure does not match the human course even though both endpoints are seizures.
    description: >-
      Reproduces spasm-like movements and, later, spontaneous seizures.
    readouts:
    - name: Seizure phenotype across the lifespan
      target: Drug-Resistant Epilepsy
      direction: ALTERED
      interpretation: >-
        Three distinct phases - neonatal spasms, a seizure-free interval, then adult
        spontaneous recurrent seizures ending in premature death.
      evidence:
      - reference: PMID:41066510
        reference_title: "Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse remodeling, gliosis and alterations in lipid metabolism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our findings reveal that Cyfip2+/R87C mice, following a seizure-free
          period after neonatal spasms, develop spontaneous recurrent seizures in
          adulthood, ultimately leading to premature death"
        explanation: >-
          The longitudinal seizure phenotyping behind this readout.
    evidence:
    - reference: PMID:36251395
      reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Cyfip2+/R87C mice recapitulated many neurological and neurobehavioral
        phenotypes of the patients, including spasmlike movements, microcephaly, and
        impaired social communication"
      explanation: >-
        Supports treating the model as informative for the clinical phenotype, including
        the specific spasm semiology.
- name: Xenopus laevis cyfip2 gain-of-function tadpole
  species: Xenopus laevis
  genotype: transient ectopic expression of Arg87Cys or Tyr108Cys cyfip2 mRNA
  publication: DOI:10.1101/2022.12.07.519540
  description: >-
    A transient overexpression model rather than a knock-in, chosen because gain-of-function
    variants cannot be modelled by the knockdown and knockout techniques used for loss of
    function. It is the only in vivo demonstration that a pathogenic CYFIP2 variant alone
    is sufficient to produce epileptic brain activity, which is why it matters to the
    canonical hypothesis.
  modeled_mechanisms:
  - target: Neuronal Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Transient ectopic mRNA overexpression rather than expression from the endogenous
      locus, so protein level is not physiological and the model cannot speak to the
      competing protein-destabilization account, which is a claim about steady-state
      abundance. Published as a preprint and not peer-reviewed at time of curation.
    description: >-
      Expression of either pathogenic variant produced spontaneous epileptic activity in
      the brain.
    readouts:
    - name: Spontaneous epileptic brain activity
      target: Neuronal Network Hyperexcitability
      direction: INCREASED
      interpretation: >-
        Both variants produced spontaneous epileptic activity, and it was reduced by
        valproate - a pharmacological control that argues the activity is genuinely
        seizure-like rather than an artefact of overexpression.
      evidence:
      - reference: DOI:10.1101/2022.12.07.519540
        reference_title: "Expression of mRNA encoding two gain-of-function cyfip2 variants associated with DEE65 results in spontaneous seizures in Xenopus laevis tadpoles"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Expression of either pathogenic variant resulted in spontaneous epileptic
          activity in the brain"
        explanation: >-
          The electrophysiological measurement behind this readout.
      - reference: DOI:10.1101/2022.12.07.519540
        reference_title: "Expression of mRNA encoding two gain-of-function cyfip2 variants associated with DEE65 results in spontaneous seizures in Xenopus laevis tadpoles"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "For both variants, neuronal hyperactivity was reduced by treating the
          tadpole with 5 mM of the anti-seizure drug valproate (VPA)"
        explanation: >-
          Pharmacological rescue supporting the interpretation of the activity as
          seizure-like.
    evidence:
    - reference: DOI:10.1101/2022.12.07.519540
      reference_title: "Expression of mRNA encoding two gain-of-function cyfip2 variants associated with DEE65 results in spontaneous seizures in Xenopus laevis tadpoles"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transient ectopic expression of the Arg87Cys pathogenic variant of"
      explanation: >-
        Establishes that the model expresses the human hotspot variant, which is what makes
        it informative for this disorder rather than for CYFIP2 biology generally.
  - target: Drug-Resistant Epilepsy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Only one of the two variants tested produced the behavioural phenotype. Arg87Cys
      caused seizure-related darting and circling; Tyr108Cys did not alter behaviour at
      all, despite producing the same epileptic brain activity. So the model reproduces
      behavioural seizures for some pathogenic variants and not others, and a behavioural
      readout alone would have scored Tyr108Cys as unaffected.
      A second divergence matters specifically for anyone using this model as the
      pre-clinical drug-testing platform its authors propose: the tadpole hyperactivity was
      reduced by valproate, whereas the human phenotype curated in this entry is
      drug-resistant epilepsy in a patient who remained refractory despite valproic acid
      among four treatments. The model is valproate-responsive against a
      valproate-refractory human disorder, so a compound that suppresses activity here has
      not thereby been shown to work in patients.
    description: >-
      Seizure-related behaviour, variant-dependent.
    readouts:
    - name: Seizure-related swimming behaviour
      target: Drug-Resistant Epilepsy
      direction: INCREASED
      interpretation: >-
        Increased for Arg87Cys; explicitly unchanged for Tyr108Cys.
      evidence:
      - reference: DOI:10.1101/2022.12.07.519540
        reference_title: "Expression of mRNA encoding two gain-of-function cyfip2 variants associated with DEE65 results in spontaneous seizures in Xenopus laevis tadpoles"
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast, expression of a second pathological variant, Tyr108Cys, did
          not alter tadpole behaviour"
        explanation: >-
          Curated as PARTIAL because it is a negative behavioural result for one variant
          alongside a positive one for the other. The dissociation is the informative part:
          brain activity and behaviour come apart within the same model.
    evidence:
    - reference: DOI:10.1101/2022.12.07.519540
      reference_title: "Expression of mRNA encoding two gain-of-function cyfip2 variants associated with DEE65 results in spontaneous seizures in Xenopus laevis tadpoles"
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "resulted in increased seizure-related behaviours such as rapid darting and
        swimming in circles"
      explanation: >-
        Supports the behavioural phenotype for the Arg87Cys variant specifically.

discussions:

- discussion_id: controversy_gain_of_function_versus_protein_destabilization
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant WAVE Regulatory Complex Activation
  - pathophysiology#Enhanced CYFIP2 Ubiquitination and Proteasomal Degradation
  prompt: >-
    Does p.Arg87Cys act by switching the WAVE regulatory complex on, or by removing CYFIP2
    protein from it?
  rationale: >-
    These are not two descriptions of one finding. The gain-of-function account says the
    complex is inappropriately active because the mutant subunit sequesters VCA more
    weakly; the destabilization account says there is measurably less CYFIP2 in the brain
    because the variant protein is ubiquitinated and degraded. A complex missing a
    required subunit and a complex that is constitutively switched on are different
    molecular states with opposite implications for therapy - one argues for inhibiting
    WAVE signalling, the other for restoring CYFIP2 abundance. Both rest on direct
    measurement: weaker VCA binding and increased actin accumulation in one case, reduced
    brain protein levels and demonstrated ubiquitination in the other, the latter in a
    genotype-matched knock-in rather than an overexpression system. A published exchange
    on exactly this point exists in the literature. The entry therefore draws both edges
    from the variant node in parallel, tagged to competing hypothesis groups, rather than
    placing either upstream of the other. Note also that the two accounts are not strictly
    exclusive - a destabilized interface could plausibly both loosen VCA binding and
    expose the protein to degradation - but no source demonstrates that reconciliation,
    and asserting it here would invent a synthesis rather than curate one.
  proposed_experiments:
  - experiment_id: exp_separate_abundance_from_activity
    name: Separate CYFIP2 abundance from complex activity
    description: >-
      Restore CYFIP2 abundance in Cyfip2+/R87C neurons by proteasome-independent means
      while leaving the variant sequence intact, and ask whether actin dysregulation and
      network hyperexcitability normalize. If they do, reduced abundance is the operative
      mechanism; if actin dysregulation persists at normal protein levels, the interface
      gain-of-function account is doing the work.

- discussion_id: mismatch_mouse_has_a_latent_phase_the_human_disease_does_not
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Network Hyperexcitability
  prompt: >-
    Does the seizure-free interval in the knock-in mouse correspond to anything in the
    human disease, or is it a species artefact?
  rationale: >-
    The Cyfip2+/R87C mouse passes through three phases: neonatal spasms, then a
    seizure-free period, then spontaneous recurrent seizures in adulthood ending in
    premature death. Human DEE65 is described as having intractable seizures from onset,
    with no reported latent phase. Two readings are possible and they have opposite
    consequences. If the interval is a species artefact, then the model's adult seizures
    are not the same illness as the human one and the intervening period should not be
    used to time interventions. If instead the human trajectory has an under-recognized
    quiescent phase - plausible, since these children are heavily medicated and profoundly
    impaired, which makes a partial seizure remission easy to miss - then the model is
    revealing something about the human course rather than diverging from it. This is a
    tractable question because it can be settled from existing patient records rather than
    new experiments.
  proposed_experiments:
  - experiment_id: exp_longitudinal_seizure_burden_in_patients
    name: Longitudinal seizure burden in genotyped patients
    description: >-
      Assemble longitudinal seizure-frequency and EEG data across the lifespan for
      genotyped DEE65 individuals, specifically looking for a period of reduced seizure
      burden after the infantile spasm phase, and stratify by hotspot. A demonstrated
      quiescent interval would reclassify the mouse's latent phase from artefact to
      finding.

- discussion_id: gap_how_actin_dysregulation_becomes_hyperexcitability
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Synaptic and Dendritic Spine Remodeling
  - pathophysiology#Neuronal Network Hyperexcitability
  prompt: >-
    By what route does dysregulated actin polymerization produce a hyperexcitable network?
  rationale: >-
    The molecular and cellular end of this disorder is well characterised, and the clinical
    end is unambiguous, but the step between them is the weakest link in the chain. Actin
    dysregulation is measured in fibroblasts and transfected cells; seizures are measured
    in patients and mice; what is not established is the mechanism that converts abnormal
    spine actin dynamics into synchronous network discharge. The entry marks both edges
    across this gap as indirect with unknown intermediates rather than asserting a
    pathway. This matters practically, because it is the step at which any therapy aimed
    at the actin machinery would have to act on the seizures.
  proposed_experiments:
  - experiment_id: exp_spine_dynamics_to_excitability_in_same_preparation
    name: Spine dynamics and excitability in the same preparation
    description: >-
      In Cyfip2+/R87C cortical or hippocampal slices, measure dendritic spine density and
      actin turnover alongside excitatory and inhibitory synaptic currents and network
      activity in the same neurons, at each of the three phases of the model's course.
      Establishing whether the excitatory-inhibitory balance shifts in step with the spine
      changes would convert the current inference into a measured link.

notes: >-
  Two items raised in review are deliberately not curated, with the checks recorded so a
  later curator does not repeat them. First, hyperkinetic or dyskinetic movements at 17%:
  this figure comes from the deep-research report citing Squire et al. 2025, but the
  retrievable abstract of that paper contains no mention of hyperkinetic, dyskinetic or
  choreiform movements at all, so the percentage cannot be quoted from its stated source.
  The paper is cited here for the frequency data it does contain. The second declined item has been reversed: the Xenopus
  tadpole gain-of-function model is now curated. An earlier revision of this entry
  declined it on the stated ground that it had no identifier resolving through the
  reference cache. That was wrong and was asserted without testing -
  DOI:10.1101/2022.12.07.519540 resolves and caches normally, as bioRxiv DOIs cited
  elsewhere in this knowledge base already do. The correct caveat is preprint status, which
  is recorded on the model's limitations rather than used as a reason to omit it.
  Note also that evidence items citing a DOI rather than a PMID are not snippet-checked by
  the validators, since DOI sits in skip_prefixes; the five DOI-sourced snippets in this
  entry were verified by hand against the cached record.
  Scope: this entry curates DEE65 only. CYFIP2 has a paralog, CYFIP1, at the same
  cytogenetic band; CYFIP1 lies within the 15q11.2 microdeletion region and is associated
  with a different neurodevelopmental phenotype. The NEC preflight for the deep-research
  report used to build this entry recorded CYFIP1 at 3 mentions against CYFIP2 at 75, so
  the report is about the intended entity, but the two should not be conflated in any
  future extension of this entry.

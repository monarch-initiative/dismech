  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  evidence:
  - reference: PMID:33149277
    reference_title: >-
      New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
      disorder and impairment of the WRC-mediated actin dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly with a HC below 2 standard deviations was diagnosed in 5/16 individuals of the current

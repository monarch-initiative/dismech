- name: Trio Exome or Genome Sequencing
  description: >-
    Exome or genome sequencing, or an epilepsy gene panel, can establish a molecular diagnosis in the
    appropriate phenotype. Parental testing helps interpret de novo status. Reanalysis may be useful when
    initial testing is unrevealing; a normal MRI does not exclude the disorder.

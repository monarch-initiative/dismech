    term:
      id: GO:0019904
      label: protein domain specific binding
    modifier: DECREASED
- name: Enhanced CYFIP2 Ubiquitination
  biological_scale: MOLECULAR
  description: >-
    The p.Arg87Cys variant has increased ubiquitination in the reported mechanistic experiments. This
    event is distinct from the reduced steady-state protein abundance measured in mouse brain.
  evidence:
  - reference: PMID:36251395
    reference_title: CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we demonstrated that the p.Arg87Cys variant enhances ubiquitination and proteasomal degradation
      of CYFIP2.
    explanation: >-
      The study reports enhanced ubiquitination and proteasomal turnover; the abstract combines cellular
      mechanistic assays with mouse phenotyping.
  downstream:
  - target: Enhanced CYFIP2 Proteasomal Degradation
    causal_link_type: DIRECT
    description: The study links enhanced ubiquitination with proteasomal turnover.
- name: Enhanced CYFIP2 Proteasomal Degradation
  biological_scale: MOLECULAR
  description: >-
    Accelerated proteasomal turnover is reported for p.Arg87Cys. Reduced abundance and altered activity
    of the residual mutant-containing complex need not be mutually exclusive.
  evidence:
  - reference: PMID:36251395
    reference_title: CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we demonstrated that the p.Arg87Cys variant enhances ubiquitination and proteasomal degradation
      of CYFIP2.
    explanation: >-
      The study reports enhanced ubiquitination and proteasomal turnover; the abstract combines cellular
      mechanistic assays with mouse phenotyping.
  biological_processes:
  - preferred_term: proteasomal protein catabolic process
    term:
      id: GO:0010498
      label: proteasomal protein catabolic process
    modifier: INCREASED
  downstream:
  - target: Reduced CYFIP2 Protein Abundance
    causal_link_type: DIRECT
    description: >-
      Enhanced turnover provides a mechanism for reduced protein abundance; patient-derived progenitors
      also show transcript changes.
- name: Reduced CYFIP2 Protein Abundance
  biological_scale: MOLECULAR
  description: >-
    CYFIP2 protein is reduced in heterozygous knock-in mouse brain and human R87C neural models. Patient-derived
    heterozygous progenitors also have reduced CYFIP2 transcript abundance. These findings do not establish
    simple haploinsufficiency as the complete disease mechanism.
  evidence:
  - reference: PMID:36251395
    reference_title: CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Beyond identifying a decrease in CYFIP2 protein levels in the Cyfip2+/R87C brains
    explanation: Reduced brain protein abundance was measured in heterozygous knock-in mice.
  - reference: PMID:41851324
    reference_title: Impact of the CYFIP2 R87C variant in a human neuronal model in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of CYFIP2 and CYFIP1 expression revealed reduced mRNA and protein levels in R87C/WT NPCs
    explanation: >-
      Patient-derived heterozygous progenitors show both transcript and protein changes, so protein reduction
      alone does not establish accelerated degradation in this system.
- name: Impaired WRC Incorporation by a C-terminal Truncation
  biological_scale: MOLECULAR
  description: >-
    A CYFIP1 E1150Dfs*3 construct modeling CYFIP2 Glu1174Aspfs*3 failed WRC incorporation and lamellipodia
    rescue in CYFIP1/2-null B16-F1 cells. This loss-of-function result contrasts with activating missense
    substitutions, but does not establish pathogenicity of every early truncating CYFIP2 allele.
  evidence:
  - reference: PMID:32486060
    reference_title: Molecular Dissection of Neurodevelopmental Disorder-Causing Mutations in CYFIP2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the E1150Dfs*3 mutant was unable to incorporate into endogenous WRC
    explanation: >-
      The homologous CYFIP1 construct modeling the CYFIP2 C-terminal truncation failed complex incorporation;
      this is a surrogate cellular assay.
  downstream:
  - target: Dysregulated Actin Cytoskeleton Dynamics
    causal_link_type: DIRECT
    description: Failure to assemble functional WRC prevents lamellipodia rescue in the surrogate assay.
- name: Aberrant WAVE Regulatory Complex Activation
  biological_scale: MOLECULAR
  description: >-
    Many tested missense substitutions increase WRC activation. Most act at the WAVE-sequestering interface,
    whereas Tyr108His requires a functional Rac-binding A site. The experiments do not support a uniform,
    fully RAC1-independent mechanism across variants.
  evidence:
  - reference: PMID:32486060
    reference_title: Molecular Dissection of Neurodevelopmental Disorder-Causing Mutations in CYFIP2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Almost all CYFIP2-derived mutations (7 out of 8) promoted WRC activation, but to variable extent
      and with at least two independent mechanisms.
    explanation: >-
      Cellular reconstitution demonstrated variant-dependent activation; most substitutions were tested
      in homologous CYFIP1, with R87C also tested directly in CYFIP2.
  cellular_components:
  - preferred_term: SCAR complex
    term:
      id: GO:0031209
      label: SCAR complex
  biological_processes:
  - preferred_term: Arp2/3 complex-mediated actin nucleation
    term:
      id: GO:0034314
      label: Arp2/3 complex-mediated actin nucleation
    modifier: INCREASED
  downstream:
  - target: Dysregulated Actin Cytoskeleton Dynamics
    causal_link_type: DIRECT
    description: WRC dysregulation alters actin-dependent protrusions in cellular assays.
- name: Dysregulated Actin Cytoskeleton Dynamics
  biological_scale: CELLULAR
  description: >-
    Readouts vary by cell type and allele. Arg87-transfected cells show ectopic actin accumulation; patient
    fibroblasts have reduced circular dorsal ruffles without apparent lamellipodia differences. Patient-derived
    R87C neural progenitors have altered lamellipodia. These are distinct readouts of dysregulation, not
    equivalent measurements of globally increased actin.
  evidence:
  - reference: PMID:29534297
    reference_title: De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescence revealed that ectopic speckled accumulation of actin and CYFIP2 was significantly
      increased in cells transfected with mutant CYFIP2
    explanation: The original actin readout in a heterologous transfection system.
  - reference: PMID:33149277
    reference_title: >-
      New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
      disorder and impairment of the WRC-mediated actin dynamics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      a significantly reduced number of circular dorsal ruffles (CDRs) was observed in all patient fibroblast
      lines compared with fibroblasts of three controls
    explanation: >-
      Six patient lines showed impaired growth-factor-induced actin remodeling, not a uniform increase
      in actin accumulation.
  - reference: PMID:41851324
    reference_title: Impact of the CYFIP2 R87C variant in a human neuronal model in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      hiPSC-derived R87C/WT NPCs also exhibited altered cell morphology and lamellipodia formation as
      analyzed by electron microscopy
    explanation: >-
      Patient-derived heterozygous neural progenitors differed from the corrected isogenic control.
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: DYSREGULATED
- name: Reduced Neural Progenitor Motility
  biological_scale: CELLULAR
  description: >-
    Engineered homozygous R87C/R87C human neural progenitors show reduced speed and displacement. This
    motility result should not be generalized to every patient fibroblast line or treated as demonstrated
    cortical migration failure in patients.
  evidence:
  - reference: PMID:41851324
    reference_title: Impact of the CYFIP2 R87C variant in a human neuronal model in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: NPC motility, including speed and displacement, was decreased in the R87C variant cells
    explanation: Cell tracking measured motility in the homozygous engineered progenitor model.
- name: Loss of SOX2-positive Progenitor Staining in R87C Organoids
  biological_scale: CELLULAR
  description: >-
    Homozygous R87C/R87C cortical organoids lack SOX2-positive progenitor staining at day 30 and are enlarged
    at days 30 and 60. Premature progenitor depletion is proposed; these findings neither demonstrate
    cell death nor recapitulate patient microcephaly.
  evidence:
  - reference: PMID:41851324
    reference_title: Impact of the CYFIP2 R87C variant in a human neuronal model in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunostaining revealed SOX2 + neural progenitors within rosettes in WT organoids, whereas R87C/R87C
      organoids lacked SOX2 + cells
    explanation: >-
      Loss of progenitor-marker staining was observed in homozygous engineered organoids; depletion is
      an interpretation rather than directly established cell death.
- name: Disrupted Synaptic and Dendritic Spine Remodeling
  biological_scale: CELLULAR
  description: >-
    Adult heterozygous R87C knock-in hippocampal CA1 has fewer excitatory synapses, reduced dendritic
    spines and excitatory contacts shifted onto dendritic shafts. Synaptic remodeling accompanies seizures;
    direction of causation remains unresolved.
  evidence:
  - reference: PMID:41066510
    reference_title: >-
      Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
      remodeling, gliosis and alterations in lipid metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the number of excitatory (asymmetric) synapses decreased, while the number of inhibitory (symmetric)
      synapses remained normal in Cyfip2+/R87C mice at PWK 28
    explanation: >-
      Ultrastructure shows selective reduction of excitatory synapses in adult knock-in hippocampal CA1.
  - reference: PMID:41066510
    reference_title: >-
      Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
      remodeling, gliosis and alterations in lipid metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      excitatory synapses were predominantly located on dendritic shafts, with multiple presynaptic terminals
      clustering nearby
    explanation: >-
      Adult knock-in neurons have fewer spines and altered excitatory-contact geometry; its effect on
      excitability remains proposed.
  cellular_components:
  - preferred_term: dendritic spine
    term:
      id: GO:0043197
      label: dendritic spine
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
- name: Reactive Gliosis
  biological_scale: TISSUE
  description: >-
    Knock-in mouse brain shows age-dependent oligodendroglial, microglial and astrocytic marker changes,
    with altered microglial and astrocytic morphology. Their contributions to seizure progression and
    exact temporal ordering require further testing.
  evidence:
  - reference: PMID:41066510
    reference_title: >-
      Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
      remodeling, gliosis and alterations in lipid metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      glial markers in the hippocampal CA1 region of Cyfip2+/R87C mice exhibited an age-related increase
      compared to WT mice, with oligodendrocyte, microglia, and astrocytes in that order
    explanation: >-
      Marker changes suggest an ordered glial response, but broad sampling intervals do not resolve exact
      timing or causality.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
- name: Astrocytic Lysosomal Lipid Accumulation
  biological_scale: CELLULAR
  description: >-
    Adult R87C knock-in hippocampal astrocytes accumulate lipid droplets in lysosomes. Associated crystals
    have not been chemically identified. Lipid accumulation is a late accompaniment of disease in this
    model, with no demonstrated corresponding human lesion.
  evidence:
  - reference: PMID:41066510
    reference_title: >-
      Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
      remodeling, gliosis and alterations in lipid metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      both the number and volume of LDs within astrocytic lysosomes were significantly increased in the
      hippocampus of Cyfip2+/R87C mice compared to WT mice at PWK 28, but not at PWK 14
    explanation: >-
      Lipid accumulation is a late model finding; it is not established as the initiating seizure mechanism
      or a human biomarker.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
- name: Neuronal Network Hyperexcitability
  biological_scale: CELLULAR
  description: >-
    Heterozygous R87C knock-in mice develop adult electroclinical seizures after neonatal spasms and a
    quiescent interval. The steps connecting CYFIP2-dependent cellular abnormalities to seizures remain
    incompletely established.
  evidence:
  - reference: PMID:41066510
    reference_title: >-
      Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
      remodeling, gliosis and alterations in lipid metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we observed tonic-clonic seizures and myoclonic jerks that correlated with behavioral seizures,
      events that were never observed in WT mice
    explanation: >-
      Video-EEG in three surviving knock-in mice at postnatal week 20 established electroclinical seizures;
      age progression was assessed behaviorally.
  conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
  downstream:
  - target: Seizures
    causal_link_type: DIRECT
    description: >-
      Seizures are the clinical manifestation of abnormal network activity; drug resistance is a separate
      treatment-response property.
phenotypes:
- category: Neurological
  name: Seizures
  description: >-
    Seizures vary in onset and type and are not universal across the broader CYFIP2 neurodevelopmental
    spectrum. The 2025 published-case review reported epilepsy in 32/42 individuals and first-year onset
    in 25/42; its case set includes variants whose significance was uncertain in their original reports.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:42563853
    reference_title: >-
      Expanding the Phenotype of CYFIP2-Related Developmental Epileptic Encephalopathy: Case Report and
      Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      32/42 (76%) developed epilepsy, and 25/42 (60%) experienced seizure onset in the first year of life.
    explanation: Published-case review denominators; these are not population penetrance estimates.
- category: Neurological
  name: Epileptic Spasms
  description: >-
    Epileptic spasms are reported particularly with Arg87 variants and may follow other seizure types.
    The 2025 review reported spasms in 16/32 individuals with epilepsy (16/42 overall).
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Epileptic spasm
    term:
      id: HP:0011097
      label: Epileptic spasm
  evidence:
  - reference: PMID:42563853
    reference_title: >-
      Expanding the Phenotype of CYFIP2-Related Developmental Epileptic Encephalopathy: Case Report and
      Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of those with seizures, 16/32 (50%) had epileptic spasms
    explanation: >-
      The denominator is individuals with seizures; 16/42 overall also falls within the FREQUENT band.
- category: Neurological
  name: Drug-Resistant Epilepsy
  description: >-
    Drug-resistant epilepsy occurs, including the Trp86_Ser88del case, but other patients achieve seizure
    control. Refractoriness is neither universal nor necessarily present from the first seizure.
  phenotype_term:
    preferred_term: Refractory drug response
    term:
      id: HP:0020174
      label: Refractory drug response
  evidence:
  - reference: PMID:36968925
    reference_title: >-
      Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical
      Case Description.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seizures were of different types, frequent and refractory to treatment, including different
      anticonvulsant drugs
    explanation: >-
      Documents refractoriness across multiple anticonvulsant classes in a genotype-confirmed patient.
  - reference: PMID:36968925
    reference_title: >-
      Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical
      Case Description.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He maintained refractory epilepsy despite being medicated with vigabatrin, phenobarbital, valproic
      acid, and a ketogenic diet
    explanation: >-
      Names the specific agents that failed, which is stronger than a general statement of drug resistance.
- category: Neurological
  name: Global Developmental Delay
  description: >-
    Global delay was reported in 14/16 new likely disease-associated missense cases in the 2021 cohort;
    two had language delay with normal motor development. Global delay should not be equated with formally
    assessed intellectual disability.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:33149277
    reference_title: >-
      New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
      disorder and impairment of the WRC-mediated actin dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 14/16 with global DD and 2/16 with normal motor but delayed language development
    explanation: The primary cohort distinguishes global from language-only delay.
  frequency: VERY_FREQUENT
- category: Neurological
  name: Intellectual Disability
  description: >-
    Intellectual disability ranges from mild to profound. Arg87 substitutions tend to be severe; other
    variants have broader severity. Children too young for formal evaluation are not counted as having
    assessed intellectual disability.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:33149277
    reference_title: >-
      New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
      disorder and impairment of the WRC-mediated actin dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intellectual disability was classified as severe or profound in 9 of 14 evaluated individuals, as
      moderate in 4/14, and as mild in 1/14 cases
    explanation: >-
      Formal assessment demonstrates variable severity, not uniformly severe or profound impairment.
- category: Neurological
  name: Muscular Hypotonia
  description: >-
    Generalized or truncal hypotonia was reported in 10/16 new missense cases, with additional limb hypertonia
    in two.
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:33149277
    reference_title: >-
      New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
      disorder and impairment of the WRC-mediated actin dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten of 16 individuals showed generalized or truncal muscular hypotonia, combined with limb hypertonicity
      in two cases.
    explanation: Primary cohort supports hypotonia and the frequency denominator.
  frequency: FREQUENT
- category: Neurological
  name: Microcephaly
  description: >-
    Absolute microcephaly was diagnosed in 5/16 new missense cases. The larger pooled count also included

discussions:
- discussion_id: gap_variant_activity_and_abundance
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant WAVE Regulatory Complex Activation
  - pathophysiology#Reduced CYFIP2 Protein Abundance
  prompt: >-
    How do altered activity and reduced abundance jointly contribute to the effects of individual CYFIP2
    variants?
  rationale: >-
    Cellular activating missense effects, reduced R87C protein abundance and loss of WRC incorporation
    by a late truncation are distinct observations. Severe adult phenotypes in R87C knock-in but not heterozygous-null
    mice argue against simple dosage loss as a complete account. Human heterozygous progenitors also have
    transcript changes. Variant-specific rescue experiments are needed before selecting a strategy to
    increase or suppress CYFIP2.
  evidence:
  - reference: PMID:41066510
    reference_title: >-
      Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
      remodeling, gliosis and alterations in lipid metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The absence of this phenotype in Cyfip2+/− mice further supports the notion that the hotspot p.Arg87
      variant likely confers a toxic gain-of-function, rather than simply destabilizing CYFIP2 proteins
    explanation: The knockout comparison limits a pure haploinsufficiency interpretation.
- discussion_id: gap_human_longitudinal_course
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Seizures
  prompt: >-
    Which human seizure trajectories correspond to the quiescent interval and later seizures in the R87C
    mouse?
  rationale: >-
    The 2025 human Arg87Cys case had EEG and developmental normalization before later spasms, so a quiescent
    human interval cannot be excluded. Larger genotype-stratified longitudinal cohorts are needed to relate
    this trajectory to the mouse course; mouse lethality must not be used as a human prognosis.
  evidence:
  - reference: PMID:42563853
    reference_title: >-
      Expanding the Phenotype of CYFIP2-Related Developmental Epileptic Encephalopathy: Case Report and
      Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient demonstrated a transient period of seizure resolution and EEG normalization after seizure
      onset and before the onset of epileptic spasms
    explanation: Human longitudinal observations replace the assertion that such intervals never occur.
- discussion_id: gap_how_actin_dysregulation_becomes_hyperexcitability
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated Actin Cytoskeleton Dynamics
  - pathophysiology#Neuronal Network Hyperexcitability
  - pathophysiology#Reactive Gliosis
  - pathophysiology#Astrocytic Lysosomal Lipid Accumulation
  prompt: >-
    Which cellular changes cause seizures, and which are consequences of ongoing seizure activity?
  rationale: >-
    Mouse synaptic, glial and lipid changes accompany seizure evolution without establishing a complete
    causal sequence. Increased microglial engulfment of synapses did not reach statistical significance.
    Human homozygous monolayer neurons had no detected electrophysiological difference, despite progenitor
    and organoid abnormalities. Perturbation experiments and more complete human neural models are needed
    to test causality.
notes: >-
  This entry includes the broader CYFIP2 neurodevelopmental spectrum described alongside DEE65, including
  individuals without epilepsy. Variant-specific clinical and experimental findings should not be generalized
  to every allele. The 2025 literature review contains language-only developmental delay and variants
  previously considered uncertain in its case table; its pooled observations therefore do not establish
  obligate global delay, formal intellectual disability, or population penetrance.

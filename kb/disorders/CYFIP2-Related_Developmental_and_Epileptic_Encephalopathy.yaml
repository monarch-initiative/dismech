name: CYFIP2-Related Developmental and Epileptic Encephalopathy
creation_date: '2026-08-20T00:20:00Z'
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 65
- DEE65
- EIEE65
- CYFIP2-related neurodevelopmental disorder
description: >-
  CYFIP2-related developmental and epileptic encephalopathy (DEE65) lies within an autosomal dominant
  neurodevelopmental spectrum associated mainly with heterozygous de novo CYFIP2 variants. CYFIP2 regulates
  the WAVE regulatory complex (WRC) and actin remodeling. Arg87 variants are associated with severe developmental
  impairment and early epilepsy, whereas other variants can cause milder intellectual or language impairment
  without seizures. Missense, splice-altering, in-frame deletion and frameshift variants have been reported;
  their functional consequences differ. Hypotonia, feeding and visual difficulties, microcephaly, sleep
  disturbance and movement abnormalities accompany the developmental phenotype. Seizures may be drug-resistant,
  but seizure control and temporary developmental or EEG improvement occur. Brain imaging ranges from
  normal findings to atrophy and cortical malformation.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 65
  term:
    id: MONDO:0033374
    label: developmental and epileptic encephalopathy, 65
parents:

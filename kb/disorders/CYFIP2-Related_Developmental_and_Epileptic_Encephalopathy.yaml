  - name: CYFIP2 p.Trp86_Ser88del
    gene:
      preferred_term: CYFIP2
      term:
        id: hgnc:13760
        label: CYFIP2
    description: >-
      De novo in-frame deletion removing codon87, reclassified as likely pathogenic in the reported infant.
      Phenotypic similarity does not demonstrate the same molecular consequence as an Arg87 substitution.
    evidence:
    - reference: PMID:36968925
      reference_title: >-
        Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical

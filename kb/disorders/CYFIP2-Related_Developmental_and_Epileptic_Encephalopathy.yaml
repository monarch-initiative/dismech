animal_models:
- name: Cyfip2 p.Arg87Cys knock-in mouse
  species: Mouse
  genotype: Cyfip2+/R87C
  publication: PMID:36251395
  description: >-
    Heterozygous Arg87Cys knock-in mice reproduce neonatal spasmlike movements and later develop spontaneous
    recurrent seizures after a quiescent interval. Adult hippocampal abnormalities include synaptic remodeling,
    glial changes and astrocytic lipid accumulation. Heterozygous null mice do not share the severe adult
    phenotype.
  modeled_mechanisms:
  - target: Reduced CYFIP2 Protein Abundance
    relationship: MEASURES
    fidelity: UNKNOWN
    description: Brain protein abundance is reduced.
    limitations: Protein abundance is distinct from direct measurement of degradation in brain.
    evidence:
    - reference: PMID:36251395
      reference_title: CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Beyond identifying a decrease in CYFIP2 protein levels in the Cyfip2+/R87C brains
      explanation: Reduced brain protein abundance was measured in heterozygous knock-in mice.
  - target: Neuronal Network Hyperexcitability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    description: The model has adult electroclinical seizures.
    limitations: >-
      Adult video-EEG was obtained in three mice at week20; worsening at weeks14/28 was assessed behaviorally.
      Mouse lethality does not establish human mortality risk.
    evidence:
    - reference: PMID:41066510
      reference_title: >-
        Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
        remodeling, gliosis and alterations in lipid metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we observed tonic-clonic seizures and myoclonic jerks that correlated with behavioral seizures,
        events that were never observed in WT mice
      explanation: >-
        Video-EEG in three surviving knock-in mice at postnatal week 20 established electroclinical seizures;
        age progression was assessed behaviorally.
  - target: Disrupted Synaptic and Dendritic Spine Remodeling
    relationship: MEASURES
    fidelity: UNKNOWN
    description: Electron microscopy measures altered excitatory contacts.
    limitations: Causation of seizures and corresponding human synaptic pathology remain unestablished.
    evidence:
    - reference: PMID:41066510
      reference_title: >-
        Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
        remodeling, gliosis and alterations in lipid metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the number of excitatory (asymmetric) synapses decreased, while the number of inhibitory (symmetric)
        synapses remained normal in Cyfip2+/R87C mice at PWK 28
      explanation: >-
        Ultrastructure shows selective reduction of excitatory synapses in adult knock-in hippocampal
        CA1.
    - reference: PMID:41066510
      reference_title: >-
        Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
        remodeling, gliosis and alterations in lipid metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        excitatory synapses were predominantly located on dendritic shafts, with multiple presynaptic
        terminals clustering nearby
      explanation: >-
        Adult knock-in neurons have fewer spines and altered excitatory-contact geometry; its effect on
        excitability remains proposed.
  - target: Reactive Gliosis
    relationship: MEASURES
    fidelity: UNKNOWN
    description: Age-dependent glial marker changes accompany the model phenotype.
    limitations: Sampling intervals do not establish the precise activation order or causal contributions.
    evidence:
    - reference: PMID:41066510
      reference_title: >-
        Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
        remodeling, gliosis and alterations in lipid metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        glial markers in the hippocampal CA1 region of Cyfip2+/R87C mice exhibited an age-related increase
        compared to WT mice, with oligodendrocyte, microglia, and astrocytes in that order
      explanation: >-
        Marker changes suggest an ordered glial response, but broad sampling intervals do not resolve
        exact timing or causality.
  - target: Astrocytic Lysosomal Lipid Accumulation
    relationship: MEASURES
    fidelity: UNKNOWN
    description: Adult astrocytes accumulate lysosomal lipid droplets.
    limitations: No equivalent lesion or diagnostic lipid biomarker is established in human CYFIP2 disease.
    evidence:
    - reference: PMID:41066510
      reference_title: >-
        Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse
        remodeling, gliosis and alterations in lipid metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        both the number and volume of LDs within astrocytic lysosomes were significantly increased in

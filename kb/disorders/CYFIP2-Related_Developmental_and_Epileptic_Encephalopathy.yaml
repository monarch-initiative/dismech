  - name: CYFIP2 c.3669+1G>T / p.Glu1174Aspfs*3
    gene:
      preferred_term: CYFIP2
      term:
        id: hgnc:13760
        label: CYFIP2
    description: >-
      Late splice-altering variant with exon skipping and predicted C-terminal truncation escaping nonsense-mediated
      decay; associated with profound ID and epilepsy. Functional work used a homologous CYFIP1 truncation.
    evidence:
    - reference: PMID:30664714
      reference_title: >-
        Spatially clustering de novo variants in CYFIP2, encoding the cytoplasmic FMRP interacting protein
        2, cause intellectual disability and seizures.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        RT-PCR performed using RNA from peripheral blood leukocytes of P2 confirmed skipping of exon 31

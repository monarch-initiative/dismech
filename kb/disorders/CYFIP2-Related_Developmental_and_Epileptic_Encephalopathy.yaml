inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant disease associated predominantly with heterozygous de novo variants. Parental testing
    establishes de novo status when both parents are available; absence in one parent alone is insufficient.
    Counseling should account for possible germline mosaicism.
  evidence:
  - reference: PMID:30664714
    reference_title: >-
      Spatially clustering de novo variants in CYFIP2, encoding the cytoplasmic FMRP interacting protein
      2, cause intellectual disability and seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified 12 independent patients carrying a total of eight distinct de novo variants in CYFIP2
      with a shared phenotype of intellectual disability, seizures, and muscular hypotonia
    explanation: >-
      Establishes the de novo heterozygous architecture across twelve independent patients, together with
      the core phenotype triad.
pathophysiology:
- name: Heterozygous CYFIP2 Variation
  biological_scale: MOLECULAR
  description: >-
    Disease-associated variants include recurrent Arg87 and Asp724 substitutions, other missense changes,
    and selected splice-altering or deletion variants. Molecular effects must be assigned to the tested
    variant rather than extrapolated to every CYFIP2 allele.
  evidence:
  - reference: PMID:29534297
    reference_title: De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified three de novo CYFIP2 variants at the Arg87 residue in 4 unrelated individuals with
      early-onset epileptic encephalopathy.
    explanation: The original clinical series establishes the Arg87-associated disease relationship.
  - reference: PMID:33149277
    reference_title: >-
      New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
      disorder and impairment of the WRC-mediated actin dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, de novo missense variants affecting a small number of amino acids and one late-truncating
      variant in CYFIP2 have been associated with intellectual disability (ID), seizures, and muscular
      hypotonia
    explanation: The spectrum includes a disease-associated late truncation.
    quote_role: BACKGROUND
  downstream:
  - target: Weakened CYFIP2-WAVE1 Interface Binding
    causal_link_type: DIRECT
    description: Demonstrated for tested Arg87 substitutions.
  - target: Enhanced CYFIP2 Ubiquitination
    causal_link_type: DIRECT
    description: Reported for p.Arg87Cys.
  - target: Impaired WRC Incorporation by a C-terminal Truncation
    causal_link_type: DIRECT
    description: Supported by a homologous CYFIP1 cellular proxy for the late CYFIP2 truncation.
  - target: Dysregulated Actin Cytoskeleton Dynamics
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Patient fibroblasts and neural progenitors show variant-dependent abnormalities; intervening molecular
      events differ.
- name: Weakened CYFIP2-WAVE1 Interface Binding
  biological_scale: MOLECULAR
  description: >-
    Arg87 substitutions weaken interaction with the WAVE VCA domain. This concerns regulatory sequestration
    of WAVE, not direct binding of CYFIP2 to actin. Activation can occur while the remaining WRC stays
    assembled.
  evidence:
  - reference: PMID:29534297
    reference_title: De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All mutant CYFIP2 showed comparatively weaker interactions to the VCA domain than wild-type CYFIP2.
    explanation: The tested Arg87 substitutions weakened VCA binding in transfection experiments.
  - reference: PMID:32486060
    reference_title: Molecular Dissection of Neurodevelopmental Disorder-Causing Mutations in CYFIP2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found the activating mutation R87C to normally interact with WRC components, including WAVE
    explanation: >-
      R87C retained WRC association in the homologous CYFIP1 assay; weakened VCA binding does not require
      whole-complex dissociation.
  cellular_components:
  - preferred_term: SCAR complex
    term:
      id: GO:0031209
      label: SCAR complex
  downstream:
  - target: Aberrant WAVE Regulatory Complex Activation
    causal_link_type: DIRECT
    description: Reduced VCA sequestration relieves WAVE autoinhibition.
  genes:
  - preferred_term: CYFIP2
    term:
      id: hgnc:13760
      label: CYFIP2
  molecular_functions:

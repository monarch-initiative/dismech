treatments:
- name: Antiseizure Medication
  description: >-
    Individualized antiseizure treatment is guided by seizure type and an epilepsy specialist. Published
    patients show both drug resistance and seizure freedom. Observed responses do not establish a preferred
    CYFIP2-specific agent.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:33149277
    reference_title: >-
      New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
      disorder and impairment of the WRC-mediated actin dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two individuals were seizure-free on antiepileptic polytherapy, while six remained refractory to
      treatment.
    explanation: Response varied among the eight new patients with epilepsy.
- name: Lacosamide
  description: >-
    In the 2025 Arg87Cys case, seizures were well controlled on lacosamide monotherapy before later onset
    of spasms; subsequent seizure freedom occurred on combination therapy. This is a case observation,
    not controlled evidence or a genotype-specific recommendation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lacosamide
      term:
        id: CHEBI:135939
        label: lacosamide
  evidence:
  - reference: PMID:42563853
    reference_title: >-
      Expanding the Phenotype of CYFIP2-Related Developmental Epileptic Encephalopathy: Case Report and
      Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures were initially managed with phenobarbital, levetiracetam, and lacosamide and remained well‐controlled
      on lacosamide monotherapy, with only one seizure over a 3‐month span.
    explanation: The index case had temporary control before spasms developed.
- name: ACTH and Vigabatrin for Epileptic Spasms
  description: >-
    The 2025 index case had spasm resolution following ACTH, with vigabatrin added during taper. Other
    published patients remained refractory despite hormonal treatment. In the Trp86_Ser88del case, levetiracetam
    and zonisamide lacked benefit, phenobarbital had mild benefit, and vigabatrin gave transient improvement.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:42563853
    reference_title: >-
      Expanding the Phenotype of CYFIP2-Related Developmental Epileptic Encephalopathy: Case Report and
      Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His spasms resolved following adrenocorticotropic hormone (ACTH) therapy. Vigabatrin was initiated
      during the ACTH taper
    explanation: Reports the treatment sequence and observed spasm resolution.
  - reference: PMID:36968925
    reference_title: >-
      Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical
      Case Description.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenobarbital was later associated with mild benefits. When he started having infantile spasms,
      and there was evidence of small fragments of disorganized activity on EEG, vigabatrin was also started
      with transitory clinical improvement.
    explanation: A separate patient had limited medication responses.
- name: Ketogenic Diet
  description: >-
    The Trp86_Ser88del infant had partial clinical seizure control for several months after diet initiation,
    followed by recurrent refractory epilepsy despite continued diet and medications.
  treatment_term:
    preferred_term: Ketogenic Diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  evidence:
  - reference: PMID:36968925
    reference_title: >-
      Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical
      Case Description.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a ketogenic diet was implemented, and there was partial clinical control of seizures for several
      months
    explanation: Diet produced a time-limited partial response in one case.
- name: Clonazepam for Movement and Sleep Symptoms
  description: >-
    Nightly clonazepam improved hyperkinetic movements and sleep disturbance in the 2025 Arg87Cys index
    case. General efficacy has not been established.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

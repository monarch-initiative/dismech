  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:30664714
    reference_title: >-
      Spatially clustering de novo variants in CYFIP2, encoding the cytoplasmic FMRP interacting protein
      2, cause intellectual disability and seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dysphagia with dependency on gastric tube feeding was present in five of 12 patients.
    explanation: The primary cohort documents severe feeding impairment.

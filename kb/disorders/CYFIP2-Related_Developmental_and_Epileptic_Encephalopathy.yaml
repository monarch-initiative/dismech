name: CYFIP2-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-20T00:20:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 65
- DEE65
- EIEE65
- CYFIP2-related neurodevelopmental disorder
description: >-
  CYFIP2-related developmental and epileptic encephalopathy (DEE65) is an autosomal
  dominant disorder caused by heterozygous, almost always de novo, missense variants in
  CYFIP2. CYFIP2 is a structural subunit of the WAVE regulatory complex, which holds the
  actin-nucleating VCA domain of WAVE in an autoinhibited state until RAC1 signalling
  releases it to drive Arp2/3-mediated actin polymerization. Pathogenic variants cluster
  at two hotspots - p.Arg87, which sits buried at the CYFIP2-WAVE1 interface and produces
  a consistently severe phenotype, and p.Asp724, which produces a more variable one.
  Affected children have early-onset drug-resistant seizures, frequently epileptic spasms
  in a West syndrome pattern, with severe developmental impairment and hypotonia. Brain
  MRI is often unremarkable despite the severity of the clinical and electrical picture.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 65
  term:
    id: MONDO:0033374
    label: developmental and epileptic encephalopathy, 65
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous and overwhelmingly de novo. No confirmed transmission from an affected
    parent has been reported, consistent with the severity of the phenotype.
  evidence:
  - reference: PMID:30664714
    reference_title: "Spatially clustering de novo variants in CYFIP2, encoding the cytoplasmic FMRP interacting protein 2, cause intellectual disability and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 12 independent patients carrying a total of eight distinct de
      novo variants in CYFIP2 with a shared phenotype of intellectual disability,
      seizures, and muscular hypotonia"
    explanation: >-
      Establishes the de novo heterozygous architecture across twelve independent
      patients, together with the core phenotype triad.

pathophysiology:

- name: De Novo CYFIP2 Missense Variant at a Structural Hotspot
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Variants cluster at two hotspots, p.Arg87 and p.Asp724. Arg87
    is buried at the interface between CYFIP2 and WAVE1 inside the assembled complex,
    which is why substituting it destabilises the interface rather than simply removing a
    surface contact. Variants scattered elsewhere in the primary sequence converge on the
    same interface in three dimensions.
  evidence:
  - reference: PMID:29534297
    reference_title: "De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Structural analysis indicated that the Arg87 residue is buried at an
      interface between CYFIP2 and WAVE1, and the Arg87 variant may disrupt hydrogen
      bonding, leading to structural instability and aberrant activation of the WAVE
      regulatory complex"
    explanation: >-
      Locates the hotspot residue structurally and states the predicted consequence for
      the complex.
  - reference: PMID:33149277
    reference_title: "New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental disorder and impairment of the WRC-mediated actin dynamics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asp724 as second mutational hotspot (4/19 cases)"
    explanation: >-
      Establishes the second hotspot and its frequency in the expanded cohort.
  downstream:
  - target: Weakened CYFIP2-WAVE1 Interface Binding
    causal_link_type: DIRECT
    description: >-
      The structural lesion acts first on the interface it sits in.
  - target: Enhanced CYFIP2 Ubiquitination and Proteasomal Degradation
    causal_link_type: DIRECT
    description: >-
      A second, mechanistically separate consequence demonstrated for p.Arg87Cys. Drawn
      as a parallel edge from the variant rather than downstream of the interface defect,
      because the two are competing accounts of the same variant rather than sequential
      steps - see the controversy discussion.
    hypothesis_groups:
    - protein_destabilization_model

- name: Weakened CYFIP2-WAVE1 Interface Binding
  biological_scale: MOLECULAR
  description: >-
    Mutant CYFIP2 binds the VCA domain more weakly than wild type. Because the complex
    works by sequestering VCA, weaker binding means less effective autoinhibition. This
    node is the measured binding change, kept separate from the downstream actin readout.
  molecular_functions:
  - preferred_term: actin binding
    term:
      id: GO:0003779
      label: actin binding
  cellular_components:
  - preferred_term: WAVE regulatory complex
    term:
      id: GO:0031209
      label: SCAR complex
  evidence:
  - reference: PMID:29534297
    reference_title: "De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All mutant CYFIP2 showed comparatively weaker interactions to the VCA domain
      than wild-type CYFIP2"
    explanation: >-
      The direct binding measurement, reported for every mutant tested.
  downstream:
  - target: Aberrant WAVE Regulatory Complex Activation
    causal_link_type: DIRECT
    description: >-
      Loss of VCA sequestration is what releases the complex.
    hypothesis_groups:
    - wrc_gain_of_function_model

- name: Enhanced CYFIP2 Ubiquitination and Proteasomal Degradation
  biological_scale: MOLECULAR
  description: >-
    A second consequence of p.Arg87Cys: the variant protein is ubiquitinated and degraded
    more readily, lowering steady-state CYFIP2 abundance in the brain. This is the
    observation that sits in tension with a pure gain-of-function reading, and it is
    curated as its own node rather than folded into the interface account.
  biological_processes:
  - preferred_term: proteasomal protein catabolic process
    modifier: INCREASED
    term:
      id: GO:0010498
      label: proteasomal protein catabolic process
  evidence:
  - reference: PMID:36251395
    reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we demonstrated that the p.Arg87Cys variant enhances ubiquitination and
      proteasomal degradation of CYFIP2"
    explanation: >-
      Direct demonstration of the degradation mechanism in the knock-in mouse and cellular
      models.
  - reference: PMID:36251395
    reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Beyond identifying a decrease in CYFIP2 protein levels in the Cyfip2+/R87C
      brains"
    explanation: >-
      Records the reduced steady-state protein abundance that the degradation mechanism
      produces, in brain tissue.
  downstream:
  - target: Dysregulated Actin Cytoskeleton Dynamics
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced CYFIP2 abundance is proposed to reach the same actin readout by a different
      route than interface destabilization.
    hypothesis_groups:
    - protein_destabilization_model

- name: Aberrant WAVE Regulatory Complex Activation
  biological_scale: MOLECULAR
  description: >-
    Release of the WAVE VCA domain from autoinhibition, activating the complex outside
    normal RAC1 control. This is the node the gain-of-function account turns on.
  cellular_components:
  - preferred_term: WAVE regulatory complex
    term:
      id: GO:0031209
      label: SCAR complex
  biological_processes:
  - preferred_term: Arp2/3 complex-mediated actin nucleation
    modifier: INCREASED
    term:
      id: GO:0034314
      label: Arp2/3 complex-mediated actin nucleation
  evidence:
  - reference: PMID:29534297
    reference_title: "De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that de novo Arg87 variants in CYFIP2 have
      gain-of-function effects on the WAVE signaling pathway and are associated with
      severe neurological disorders"
    explanation: >-
      States the gain-of-function interpretation of the WAVE pathway effect.
  downstream:
  - target: Dysregulated Actin Cytoskeleton Dynamics
    causal_link_type: DIRECT
    description: >-
      An activated complex nucleates actin.
    hypothesis_groups:
    - wrc_gain_of_function_model

- name: Dysregulated Actin Cytoskeleton Dynamics
  biological_scale: CELLULAR
  description: >-
    The cellular convergence point of both proposed molecular routes. Abnormal actin
    accumulation was shown first in transfected cells and subsequently substantiated in
    patient-derived fibroblasts, which matters because it moves the finding out of an
    overexpression system into primary patient cells.
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    modifier: DYSREGULATED
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:29534297
    reference_title: "De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunofluorescence revealed that ectopic speckled accumulation of actin and
      CYFIP2 was significantly increased in cells transfected with mutant CYFIP2"
    explanation: >-
      The original actin readout in a heterologous transfection system.
  - reference: PMID:33149277
    reference_title: "New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental disorder and impairment of the WRC-mediated actin dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with its role in WRC-mediated actin polymerization we substantiate
      aberrant regulation of the actin cytoskeleton in patient fibroblasts"
    explanation: >-
      Confirms the same cellular abnormality in primary cells from affected individuals
      rather than in an overexpression model.
  downstream:
  - target: Disrupted Synaptic and Dendritic Spine Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Actin dynamics are the substrate for spine and synapse remodeling in neurons.

- name: Disrupted Synaptic and Dendritic Spine Remodeling
  biological_scale: CELLULAR
  description: >-
    In neurons the WAVE complex drives actin remodeling at dendritic spines and growth
    cones, so dysregulated actin dynamics translate into abnormal synaptic architecture.
    The knock-in mouse shows age-progressive cytoarchitectural disorganization and gliosis
    in the hippocampus, and longitudinal work shows the synaptic remodeling is itself
    time-dependent rather than a fixed lesion.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cellular_components:
  - preferred_term: dendritic spine
    term:
      id: GO:0043197
      label: dendritic spine
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:36251395
    reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Age-progressive cytoarchitectural disorganization and gliosis were also
      identified in the hippocampus of Cyfip2+/R87C mice"
    explanation: >-
      Structural correlate in the hippocampus of the genotype-matched mouse, and records
      that it worsens with age.
  - reference: PMID:41066510
    reference_title: "Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse remodeling, gliosis and alterations in lipid metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This progression was associated with synaptic remodeling, sequential
      activation of different glial cell types, lipid droplet accumulation in astrocytes,
      and significant proteomic and lipidomic changes in the brain"
    explanation: >-
      Establishes synaptic remodeling and staged glial involvement as accompaniments of
      seizure evolution rather than a static finding.
  downstream:
  - target: Reactive Gliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Glial activation accompanies the evolving synaptic pathology in the model.
  - target: Neuronal Network Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal synaptic architecture is the proposed substrate for network
      hyperexcitability.

- name: Reactive Gliosis
  biological_scale: TISSUE
  description: >-
    Sequential activation of different glial populations over the disease course in the
    mouse model, accompanied by lipid droplet accumulation in astrocytes. Curated as its
    own node because it is a distinct tissue-level process with its own time course, not
    a restatement of the synaptic finding.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  evidence:
  - reference: PMID:41066510
    reference_title: "Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse remodeling, gliosis and alterations in lipid metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "sequential activation of different glial cell types, lipid droplet
      accumulation in astrocytes"
    explanation: >-
      Records the staged glial response and the astrocytic lipid phenotype.

- name: Neuronal Network Hyperexcitability
  biological_scale: CELLULAR
  description: >-
    The circuit-level state that produces seizures. In the mouse model this is not a fixed
    property but evolves through distinct stages, which is what makes the model's temporal
    structure informative rather than incidental.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  evidence:
  - reference: PMID:41066510
    reference_title: "Seizure evolution in a mouse model of West syndrome involves complex and time-dependent synapse remodeling, gliosis and alterations in lipid metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "after an initial period of neonatal spasms, Cyfip2+/R87C mice entered a
      seizure-free phase, followed by spontaneous recurrent seizures in adulthood"
    explanation: >-
      Establishes that network excitability in this model changes over time in three
      distinct phases.
  downstream:
  - target: Drug-Resistant Epilepsy
    causal_link_type: DIRECT
    description: >-
      Network hyperexcitability manifests clinically as the seizure disorder.

- name: Drug-Resistant Epilepsy
  biological_scale: ORGANISM
  description: >-
    Early-onset seizures that characteristically resist antiseizure medication, frequently
    presenting as epileptic spasms in a West syndrome pattern.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  evidence:
  - reference: PMID:29534297
    reference_title: "De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three de novo CYFIP2 variants at the Arg87 residue in 4
      unrelated individuals with early-onset epileptic encephalopathy"
    explanation: >-
      Establishes the early-onset epileptic encephalopathy phenotype in the founding
      cohort.

mechanistic_hypotheses:
- hypothesis_group_id: wrc_gain_of_function_model
  status: CANONICAL
  description: >-
    Hotspot variants destabilize the CYFIP2-WAVE1 interface, weakening sequestration of
    the VCA domain and releasing the complex to nucleate actin outside normal RAC1
    control. On this account the disorder is a toxic gain of function at the level of
    actin regulation, which distinguishes it from the many developmental and epileptic
    encephalopathies that act by haploinsufficiency.
  evidence:
  - reference: PMID:29534297
    reference_title: "De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that de novo Arg87 variants in CYFIP2 have
      gain-of-function effects on the WAVE signaling pathway"
    explanation: >-
      The originating statement of the gain-of-function model.

- hypothesis_group_id: protein_destabilization_model
  status: ALTERNATIVE
  description: >-
    p.Arg87Cys enhances ubiquitination and proteasomal degradation of CYFIP2, lowering
    steady-state protein levels in the brain. On this account the primary consequence is
    less CYFIP2, not a constitutively active complex. The two accounts are not trivially
    compatible: one says the complex is inappropriately switched on, the other that there
    is less of a required subunit.
  evidence:
  - reference: PMID:36251395
    reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Beyond identifying a decrease in CYFIP2 protein levels in the Cyfip2+/R87C
      brains, we demonstrated that the p.Arg87Cys variant enhances ubiquitination and
      proteasomal degradation of CYFIP2"
    explanation: >-
      The originating statement of the destabilization model, measured in brain tissue of
      the genotype-matched mouse.

phenotypes:

- category: Neurological
  name: Seizures
  description: >-
    Early-onset seizures are the presenting feature in most affected children, but they are
    not universal: the largest pooled review puts epilepsy at 32 of 42 patients. A child
    with a pathogenic CYFIP2 variant and no seizures is therefore an expected part of the
    spectrum rather than an anomaly.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:30664714
    reference_title: "Spatially clustering de novo variants in CYFIP2, encoding the cytoplasmic FMRP interacting protein 2, cause intellectual disability and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a shared phenotype of intellectual disability, seizures, and muscular
      hypotonia"
    explanation: >-
      Names seizures as one of three shared features across the twelve-patient cohort.
  - reference: DOI:10.1002/cns3.70036
    reference_title: "Expanding the Phenotype of CYFIP2‐ Related Developmental Epileptic Encephalopathy: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals had global developmental delay, 32/42 (76%) developed
      epilepsy, and 25/42 (60%) experienced seizure onset in the first year of life"
    explanation: >-
      Quantifies epilepsy at 76% across a 42-patient literature review, which places it in
      the 30-79% FREQUENT band and supplies the denominator the frequency claim needs.
      Notably epilepsy is not universal in this disorder, which the earlier small series
      could not have shown.

- category: Neurological
  name: Epileptic Spasms
  description: >-
    Epileptic spasms in a West syndrome pattern are the characteristic seizure type,
    particularly in Arg87 carriers. The knock-in mouse reproduces spasm-like movements,
    which is unusual - most epilepsy models do not reproduce the specific seizure
    semiology of the disorder they model.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Epileptic spasm
    term:
      id: HP:0011097
      label: Epileptic spasm
  evidence:
  - reference: DOI:10.1002/cns3.70036
    reference_title: "Expanding the Phenotype of CYFIP2‐ Related Developmental Epileptic Encephalopathy: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of those with seizures, 16/32 (50%) had epileptic spasms"
    explanation: >-
      Quantifies epileptic spasms at 50% of patients with seizures, in the 30-79%
      FREQUENT band. The denominator is patients with seizures, not all patients.
  - reference: PMID:36251395
    reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the hotspot p.Arg87Cys variant of the cytoplasmic FMR1-interacting protein 2
      (CYFIP2) gene, which was recently identified in individuals diagnosed with West
      syndrome, a developmental and epileptic encephalopathy"
    explanation: >-
      Ties the hotspot variant to a West syndrome diagnosis in affected individuals.

- category: Neurological
  name: Drug-Resistant Epilepsy
  description: >-
    Seizures characteristically resist antiseizure medication from onset.
  phenotype_term:
    preferred_term: Refractory drug response
    term:
      id: HP:0020174
      label: Refractory drug response
  evidence:
  - reference: PMID:36968925
    reference_title: "Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical Case Description."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The seizures were of different types, frequent and refractory to treatment,
      including different anticonvulsant drugs"
    explanation: >-
      Documents refractoriness across multiple anticonvulsant classes in a
      genotype-confirmed patient.
  - reference: PMID:36968925
    reference_title: "Clinical Role of Codon 87 of the CYFIP2 Gene in Early Infantile Epileptic Encephalopathy: A Clinical Case Description."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He maintained refractory epilepsy despite being medicated with vigabatrin,
      phenobarbital, valproic acid, and a ketogenic diet"
    explanation: >-
      Names the specific agents that failed, which is stronger than a general statement of
      drug resistance.

- category: Neurological
  name: Intellectual Disability
  description: >-
    Severe to profound intellectual impairment, present in essentially all reported
    individuals. Severity tracks genotype - consistently severe in Arg87 carriers, more
    variable otherwise.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:30664714
    reference_title: "Spatially clustering de novo variants in CYFIP2, encoding the cytoplasmic FMRP interacting protein 2, cause intellectual disability and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a shared phenotype of intellectual disability, seizures, and muscular
      hypotonia"
    explanation: >-
      Names intellectual disability as a shared feature of the cohort.
  - reference: DOI:10.1002/cns3.70036
    reference_title: "Expanding the Phenotype of CYFIP2‐ Related Developmental Epileptic Encephalopathy: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals had global developmental delay"
    explanation: >-
      Developmental impairment was present in every one of the 42 patients reviewed,
      supporting the OBLIGATE band. This is the one feature of the disorder that is
      genuinely universal, in contrast to epilepsy at 76%. Note the counted phenotype is
      global developmental delay rather than intellectual disability as such; in a cohort
      of this severity the two are taken as equivalent, but the band rests on the delay
      count, not on formal cognitive testing.

- category: Neurological
  name: Muscular Hypotonia
  description: >-
    Generalized or truncal hypotonia, present from infancy.
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:30664714
    reference_title: "Spatially clustering de novo variants in CYFIP2, encoding the cytoplasmic FMRP interacting protein 2, cause intellectual disability and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a shared phenotype of intellectual disability, seizures, and muscular
      hypotonia"
    explanation: >-
      Names muscular hypotonia as the third shared feature of the cohort.

- category: Neurological
  name: Microcephaly
  description: >-
    Microcephaly is common and is reproduced in the knock-in mouse.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  evidence:
  - reference: PMID:36251395
    reference_title: "CYFIP2 p.Arg87Cys Causes Neurological Defects and Degradation of CYFIP2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Cyfip2+/R87C mice recapitulated many neurological and neurobehavioral

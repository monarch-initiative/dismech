genetic:
- name: CYFIP2
  gene_term:
    preferred_term: CYFIP2
    term:
      id: hgnc:13760
      label: CYFIP2
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous CYFIP2 variants cause a neurodevelopmental spectrum, often through de novo missense changes.
    Arg87 substitutions tend toward severe DEE, while Asp724 and other substitutions are more variable.
    Specific late splice-altering, in-frame deletion and frameshift alleles are also reported.
  evidence:
  - reference: PMID:33149277
    reference_title: >-
      New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
      disorder and impairment of the WRC-mediated actin dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotype-phenotype correlation confirms a consistently severe phenotype in p.Arg87 patients but
      a more variable phenotype in p.Asp724 and other substitutions
    explanation: >-
      States the hotspot-dependent severity difference that makes the genotype prognostically informative:
      Arg87 consistently severe, Asp724 variable.
  - reference: PMID:40425513
    reference_title: >-
      Novel CYFIP2 Frameshift Variant Linked to Dyskinetic Crises: Functional Studies Show Impaired Cell
      Motility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a novel CYFIP2 frameshift variant (c.281_282insA/p.(Gln95ProfsTer15)) causing dyskinetic
      crises
    explanation: >-
      A specific frameshift case has severe DEE and movement abnormalities; the abstract does not establish
      a universal haploinsufficiency mechanism.
  notes: >-
    Early truncating variants in the 2021 cohort remained of uncertain significance and had milder phenotypes
    with confounding family histories. They should not be conflated with the late splice variant escaping
    nonsense-mediated decay or the later Gln95ProfsTer15 case. CYFIP1 is a separate paralog; its 15q11.2
    deletion phenotype is outside this entry.
  variants:
  - name: CYFIP2 p.Arg87 substitutions
    gene:
      preferred_term: CYFIP2
      term:
        id: hgnc:13760
        label: CYFIP2
    description: >-
      Recurrent de novo missense hotspot, including Arg87Cys, Arg87Leu and Arg87Pro in the founding cohort.
      Arg87Cys has the most extensively studied cellular and animal models.
    evidence:
    - reference: PMID:29534297
      reference_title: De novo hotspot variants in CYFIP2 cause early-onset epileptic encephalopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified three de novo CYFIP2 variants at the Arg87 residue in 4 unrelated individuals with
        early-onset epileptic encephalopathy.
      explanation: The original clinical series establishes the Arg87-associated disease relationship.
  - name: CYFIP2 p.Asp724 substitutions
    gene:
      preferred_term: CYFIP2
      term:
        id: hgnc:13760
        label: CYFIP2
    description: A second recurrent site with variable severity, including individuals without epilepsy.
    evidence:
    - reference: PMID:33149277
      reference_title: >-
        New insights into the clinical and molecular spectrum of the novel CYFIP2-related neurodevelopmental
        disorder and impairment of the WRC-mediated actin dynamics.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

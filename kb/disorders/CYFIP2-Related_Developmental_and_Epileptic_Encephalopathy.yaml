- name: CYFIP1/2-null B16-F1 reconstitution assays
  experimental_model_type: CELL_LINE
  cell_source: Mouse melanoma cells lacking CYFIP1 and CYFIP2, reconstituted with engineered constructs
  publication: PMID:32486060
  description: >-
    Most disease-associated substitutions were transferred to homologous CYFIP1 positions; Arg87Cys was
    additionally tested directly in CYFIP2. Assays distinguish activating missense effects from a C-terminal
    truncation unable to assemble WRC.
  modeled_mechanisms:
  - target: Aberrant WAVE Regulatory Complex Activation
    relationship: MEASURES
    fidelity: UNKNOWN
    description: Lamellipodia rescue under restricted Rac signaling measures activation.
    limitations: >-
      Most constructs are CYFIP1 proxies in non-neural cells; effects cannot be treated as direct patient-neuron
      measurements.
    evidence:
    - reference: PMID:32486060
      reference_title: Molecular Dissection of Neurodevelopmental Disorder-Causing Mutations in CYFIP2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Almost all CYFIP2-derived mutations (7 out of 8) promoted WRC activation, but to variable extent
        and with at least two independent mechanisms.
      explanation: >-
        Cellular reconstitution demonstrated variant-dependent activation; most substitutions were tested
        in homologous CYFIP1, with R87C also tested directly in CYFIP2.
  - target: Impaired WRC Incorporation by a C-terminal Truncation
    relationship: MEASURES
    fidelity: UNKNOWN
    description: The truncating proxy fails WRC incorporation.
    limitations: >-
      CYFIP1 E1150Dfs*3 models CYFIP2 Glu1174Aspfs*3; general CYFIP2 haploinsufficiency is not established.
    evidence:
    - reference: PMID:32486060
      reference_title: Molecular Dissection of Neurodevelopmental Disorder-Causing Mutations in CYFIP2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the E1150Dfs*3 mutant was unable to incorporate into endogenous WRC
      explanation: >-
        The homologous CYFIP1 construct modeling the CYFIP2 C-terminal truncation failed complex incorporation;
        this is a surrogate cellular assay.
- name: CYFIP2 Arg87Cys ligand thermal-shift screen
  experimental_model_type: CELL_LINE
  cell_source: SH-SY5Y cells expressing tagged wild-type or Arg87Cys CYFIP2
  publication: PMID:38540093
  description: >-
    Docking nominated compounds for a modified cellular thermal-shift assay. Minocycline, tipifarnib,
    torcetrapib and pomalidomide produced candidate stabilization signals under selected conditions. The
    small screen used a nominal p<0.1 threshold and did not test functional rescue or seizure efficacy.
  modeled_mechanisms:
  - target: Reduced CYFIP2 Protein Abundance
    relationship: MEASURES
    fidelity: UNKNOWN
    description: The assay measures soluble protein after heating as a candidate stabilization readout.
    limitations: Thermal solubility is not a measurement of brain abundance or clinical benefit.
    evidence:
    - reference: PMID:38540093
      reference_title: Identification of CYFIP2 Arg87Cys Ligands via In Silico and In Vitro Approaches.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        in the CYFIP2 Arg87Cys group, protein abundance increased in the presence of all ligands at both
        temperatures
      explanation: >-
        Soluble protein increased in the screen; this does not establish correction of WRC signaling.

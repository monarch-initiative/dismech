- name: Human respirovirus 1 (HPIV-1)
  infectious_agent_term:
    preferred_term: Human parainfluenza virus 1
    term:
      id: NCBITaxon:12730
      label: Human respirovirus 1
  description: >-
    HPIV-1, the leading viral cause of croup (laryngotracheobronchitis) in young
    children.
  evidence:
  - reference: PMID:38900074
    reference_title: "Clinical Characteristics of Pediatric Parainfluenza Virus Infections: A Comparative Analysis of Parainfluenza Virus Serotypes 1-4 From April 2021 to October 2023 in Hokkaido, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parainfluenza virus (PIV) is widely known as a causative virus of acute
      respiratory tract infections in children, and 4 serotypes (PIV-1-PIV-4) have
      been identified.
    explanation: >-
      Establishes the four parainfluenza serotypes as causative agents of acute
      respiratory infection, of which this entry is HPIV-1.
  - reference: PMID:38900074
    reference_title: "Clinical Characteristics of Pediatric Parainfluenza Virus Infections: A Comparative Analysis of Parainfluenza Virus Serotypes 1-4 From April 2021 to October 2023 in Hokkaido, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with the other serotypes, croup was significantly more common in
      PIV-1 and lower respiratory tract infection was significantly more common in
      PIV-4.
    explanation: >-
      A 1490-case pediatric series showing the distinct clinical signature of
      HPIV-1, supporting it as a separately identified agent.
- name: Human orthorubulavirus 2 (HPIV-2)
  infectious_agent_term:
    preferred_term: Human parainfluenza virus 2
    term:
      id: NCBITaxon:2560525
      label: Human orthorubulavirus 2
  description: >-
    HPIV-2, a less frequently detected serotype that also causes croup and upper
    respiratory illness, occurring at an older median age than the other types.
  evidence:
  - reference: PMID:38900074
    reference_title: "Clinical Characteristics of Pediatric Parainfluenza Virus Infections: A Comparative Analysis of Parainfluenza Virus Serotypes 1-4 From April 2021 to October 2023 in Hokkaido, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 1490 cases, 608 were positive for a single PIV serotype: 91 (13.5%)
      for PIV-1, 54 (4.8%) for PIV-2, 361 (62.1%) for PIV-3 and 102 (19.6%) for
      PIV-4.
    explanation: >-
      Documents HPIV-2 as one of the four serotypes recovered from children with
      respiratory illness, and its relative frequency.

name: Parainfluenza Virus Infection
creation_date: "2026-06-28T00:00:00Z"
description: >
  Parainfluenza virus infection is an acute respiratory infection caused by the
  human parainfluenza viruses (HPIV; enveloped, negative-sense single-stranded
  RNA viruses of the family Paramyxoviridae), divided antigenically and
  genetically into types 1 to 4. HPIV-1 to HPIV-3 are major causes of upper and
  lower respiratory tract infection in infants, young children, the
  immunocompromised, the chronically ill, and the elderly. Each type tends to
  cause somewhat distinct illness: HPIV-1 (and HPIV-2) are the leading viral
  causes of croup (laryngotracheobronchitis), while HPIV-3 is an important cause
  of bronchiolitis and pneumonia in infancy, second only to respiratory syncytial
  virus. The virus infects the ciliated respiratory epithelium and elicits an
  innate antiviral/interferon and inflammatory response that drives much of the
  symptomatic illness.
category: Infectious Disease
parents:
- Viral Respiratory Infection
synonyms:
- HPIV infectious disorder
- parainfluenza infectious disorder
- Human parainfluenza virus infection
- HPIV infection
- Parainfluenza
disease_term:
  preferred_term: parainfluenza infection
  term:
    id: MONDO:0100197
    label: parainfluenza infectious disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    notes: >-
      Human parainfluenza viruses (Paramyxoviridae) are community-acquired and
      nosocomial viral pathogens causing epidemic acute respiratory infection.
    evidence:
    - reference: PMID:27486735
      reference_title: Parainfluenza Virus Infection.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Human parainfluenza viruses (HPIVs) are single-stranded, enveloped RNA viruses of the Paramyoviridaie family. There are four serotypes which cause respiratory illnesses in children and adults."
      explanation: Establishes the four human parainfluenza virus serotypes as viral infectious agents causing acute illness in children and adults.
  - classification_value: RESPIRATORY
    notes: >-
      HPIVs replicate in ciliated upper and lower respiratory tract epithelium,
      producing croup, tracheobronchitis, bronchiolitis, and pneumonia.
    evidence:
    - reference: PMID:27486735
      reference_title: Parainfluenza Virus Infection.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Seasonal HPIV epidemics result in a significant burden of disease in children and account for 40% of pediatric hospitalizations for lower respiratory tract illnesses (LRTIs) and 75% of croup cases."
      explanation: Documents HPIV as a leading cause of lower respiratory tract illness hospitalizations and croup.
review_notes: >-
  Deliberately lumped. Human parainfluenza virus serotypes 1 through 4 share
  glycoprotein-mediated ciliated respiratory epithelial entry, large-droplet
  and contact transmission, multiplex PCR diagnosis, and supportive or
  croup-directed corticosteroid management without serotype-specific antiviral
  therapy or distinct MONDO serotype disease concepts; differences are limited
  mainly to seasonality and relative predominance of croup versus bronchiolitis,
  below the two-axis threshold for splitting.

    explanation: Supports corticosteroid therapy specifically for HPIV-associated croup.
- name: Nebulized Epinephrine for Moderate-to-Severe Croup
  description: >-
    Nebulized epinephrine (racemic or L-epinephrine) provides rapid temporary
    reduction of subglottic mucosal edema and upper-airway obstruction in
    moderate-to-severe croup while glucocorticoid anti-inflammatory action takes
    effect.
  therapeutic_modality: SMALL_MOLECULE

      label: Physical Examination
  evidence:
  - reference: PMID:18295000
    reference_title: Croup.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A careful history and physical examination is the best method to confirm the diagnosis and to rule out potentially serious alternative disorders such as bacterial tracheitis and other rare causes of upper-airway obstruction."
    explanation: Confirms history and physical examination as the primary diagnostic evaluation for clinical croup.
treatments:
- name: Supportive Care
  description: >
    Management of parainfluenza infection is largely supportive (hydration,
    antipyretics, and supplemental oxygen or ventilatory support as needed); no
    specific antiviral therapy is approved.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:27486735
    reference_title: Parainfluenza Virus Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Though sensitive molecular diagnostics are available to rapidly diagnose HPIV infection, effective antiviral therapies are not available. Currently, treatment for HPIV infection is supportive with the exception of croup where the use of corticosteroids has been found to be beneficial."
    explanation: Confirms supportive care as standard management in the absence of approved HPIV-specific antivirals.
- name: Corticosteroid Therapy for Croup
  description: >
    Croup is treated with systemic or nebulized glucocorticoids (most commonly
    dexamethasone) to reduce subglottic airway inflammation across mild,
    moderate, and severe presentations.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

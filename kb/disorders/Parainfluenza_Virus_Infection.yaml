    snippet: "If available, molecular assays such as polymerase chain reaction (PCR) assays are the diagnostic test of choice for HPIV infection on the basis of optimal sensitivity, specificity, and rapidity of diagnosis."
    explanation: Establishes PCR-based molecular testing as the diagnostic test of choice for HPIV infection.
- name: Clinical evaluation of croup
  description: >-
    In children presenting with acute barking cough and stridor, clinical
    history and physical examination establish the syndromic diagnosis of croup
    and exclude alternative causes of acute upper-airway obstruction.
  presence: Positive
  diagnosis_term:
    preferred_term: Physical Examination

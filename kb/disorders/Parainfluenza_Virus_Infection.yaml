transmission:
- name: Large respiratory droplet transmission
  description: >-
    Human parainfluenza viruses are acquired by inhalation of large respiratory
    droplets produced by an infected person, the route shared by the major
    paramyxovirus and orthomyxovirus respiratory pathogens.
  evidence:
  - reference: PMID:17600390
    reference_title: "Viral respiratory tract infections in transplant patients: epidemiology, recognition and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The infections are generally acquired by transmission of large respiratory
      droplets and can be nosocomial in origin with many documented outbreaks on
      specialised transplant units.
    explanation: >-
      States large respiratory droplets as the usual route for the viral
      respiratory infections this review covers.
  - reference: PMID:17600390
    reference_title: "Viral respiratory tract infections in transplant patients: epidemiology, recognition and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common RTI pathogens are influenza viruses, parainfluenza viruses
      and respiratory syncytial viruses.
    explanation: >-
      Confirms that parainfluenza viruses are among the pathogens to which the
      droplet-transmission statement in this review applies.
- name: Nosocomial person-to-person transmission
  description: >-
    HPIV-3 spreads between hospitalised patients and staff, causing ward outbreaks
    that are severe in haematology and transplant populations.
  evidence:
  - reference: PMID:21466639
    reference_title: Nosocomial transmission of parainfluenza 3 virus in hematological patients characterized by molecular epidemiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epidemiological analysis of the outbreak supported the molecular data with
      nosocomial transmission of the same genetic strain as the cause of the
      outbreak.
    explanation: >-
      Sequence-confirmed spread of a single HPIV-3 strain across 17 patients and a
      healthcare worker demonstrates person-to-person transmission.
progression:
- phase: Upper respiratory tract phase
  notes: >-
    Symptomatic infection typically begins in the nasopharyngeal and upper
    airway epithelium with rhinorrhea, cough, sore throat, and fever, which may
    remain self-limited in immunocompetent older children and adults.
  evidence:
  - reference: PMID:27486735
    reference_title: Parainfluenza Virus Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HPIV infections in healthy adults are generally mild, self-limited URTIs with typical cold symptoms (rhinorrhea, cough, and sore throat) with or without fever."
    explanation: Describes self-limited upper respiratory tract presentation with rhinorrhea, cough, and sore throat with or without fever in HPIV infection.
  - reference: PMID:27486735
    reference_title: Parainfluenza Virus Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Infection begins in the nose and oropharynx and then spreads to the lower airways with peak replication 2 to 5 days after initial infection."
    explanation: Establishes initial nasopharyngeal and oropharyngeal infection prior to contiguous lower-airway spread.
- phase: Laryngotracheal and lower respiratory tract progression
  duration: Progression to croup within 12 to 48 hours in young children
  notes: >-
    Contiguous spread of viral replication to the subglottic larynx and trachea
    produces croup within 12 to 48 hours in young children, whereas extension to
    small airways and alveoli in infants or immunocompromised hosts produces
    bronchiolitis or severe pneumonia.
  evidence:
  - reference: PMID:27486735
    reference_title: Parainfluenza Virus Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Children with croup typically present initially with fever, hoarseness, and rhinorrhea with or without pharyngitis which progresses in 12 to 48 hours to the characteristic hoarse “barking” cough."
    explanation: Documents the 12 to 48 hour progression from initial upper-respiratory symptoms to barking cough in pediatric croup.
  - reference: PMID:27486735
    reference_title: Parainfluenza Virus Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HPIVs bind and replicate in the ciliated epithelial cells of the upper and lower respiratory tract and the extent of the infection correlates with the location involved."
    explanation: Links anatomic progression of epithelial replication from upper to lower airways with clinical syndrome severity.
pathophysiology:
- name: Glycoprotein-Mediated Respiratory Epithelial Attachment and Membrane Fusion
  biological_scale: MOLECULAR
  description: >-
    Human parainfluenza virions attach to sialic acid-containing receptors on
    ciliated respiratory epithelial cells via the hemagglutinin-neuraminidase
    (HN) glycoprotein, which triggers the viral fusion (F) protein to fuse the
    viral envelope directly with the host plasma membrane and deliver the
    ribonucleoprotein replication complex into the cytoplasm.
  cell_types:
  - preferred_term: ciliated epithelial cell
    term:
      id: CL:0000067
      label: ciliated epithelial cell
  locations:
  - preferred_term: respiratory tract epithelium
    term:
      id: UBERON:0004802
      label: respiratory tract epithelium
  biological_processes:
  - preferred_term: fusion of virus membrane with host plasma membrane
    term:
      id: GO:0019064
      label: fusion of virus membrane with host plasma membrane
    modifier: INCREASED
  evidence:
  - reference: PMID:16007245
    reference_title: Entry of parainfluenza virus into cells as a target for interrupting childhood respiratory disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Parainfluenza viruses initiate infection by binding to cell surface receptors and then, via coordinated action of the 2 viral surface glycoproteins, fuse directly with the cell membrane to release the viral replication machinery into the host cell's cytoplasm."
    explanation: Establishes receptor attachment and coordinated viral glycoprotein-mediated plasma membrane fusion as the molecular entry mechanism.
  downstream:
  - target: Respiratory Epithelial Infection and Innate Immune Response
    description: >-
      Cytoplasmic entry of the viral replication complex initiates productive
      replication in ciliated airway epithelial cells and innate immune sensing.
    causal_link_type: DIRECT
- name: Respiratory Epithelial Infection and Innate Immune Response
  biological_scale: CELLULAR
  conforms_to: "innate_antiviral_interferon_response#Interferon-Stimulated Gene Antiviral State"
  description: >
    HPIV infects the ciliated epithelium of the upper and lower respiratory tract,
    where viral replication is sensed by the host innate immune system and triggers
    a type I/III interferon and inflammatory cytokine response. Much of the
    symptomatic illness reflects this host antiviral and inflammatory response
    together with epithelial injury. HPIV-1 to HPIV-3 are leading causes of lower
    respiratory tract infection in young children and other vulnerable hosts.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  - preferred_term: ciliated airway epithelial cell
    term:
      id: CL:0000064
      label: ciliated cell
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: respiratory system
    term:
      id: UBERON:0001004
      label: respiratory system
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:27486735
    reference_title: Parainfluenza Virus Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HPIVs bind and replicate in the ciliated epithelial cells of the upper and lower respiratory tract and the extent of the infection correlates with the location involved."
    explanation: Demonstrates HPIV tropism and replication in ciliated epithelial cells across upper and lower airways.
  - reference: PMID:12692097
    reference_title: "Parainfluenza viruses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HPIV-1 to HPIV-3 are major causes of lower respiratory infections in
      infants, young children, the immunocompromised, the chronically ill, and the
      elderly.
    explanation: >-
      Establishes HPIV-1 to HPIV-3 as major causes of lower respiratory tract
      infection in vulnerable hosts.
  downstream:
  - target: Laryngotracheal Inflammation and Subglottic Narrowing
    description: >-
      In the larynx and subglottic airway, HPIV (especially type 1) infection and
      inflammation narrow the airway, producing croup.
    causal_link_type: DIRECT
  - target: Small-Airway Epithelial Injury and Bronchiolar Inflammation
    description: >-
      Extension of HPIV replication (especially HPIV-3 and HPIV-4) into distal
      bronchiolar epithelium triggers small-airway inflammation and obstruction.
    causal_link_type: DIRECT
  - target: Rhinorrhea
    description: >-
      Upper respiratory epithelial infection and local mucosal inflammation
      increase nasal mucus secretion, causing rhinorrhea.
    causal_link_type: DIRECT
  - target: Cough
    description: >-
      Airway epithelial injury and inflammatory mediator release stimulate
      cough-reflex afferents in the conducting airways.
    causal_link_type: DIRECT
  - target: Fever
    description: >-
      Innate antiviral cytokine signaling during acute respiratory epithelial
      infection induces systemic pyrogenic responses.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Laryngotracheal Inflammation and Subglottic Narrowing
  biological_scale: TISSUE
  description: >
    HPIV infection of the larynx, trachea, and subglottic airway produces
    inflammatory edema that narrows the relatively small pediatric subglottis,
    causing the inspiratory stridor and barking cough of croup
    (laryngotracheobronchitis). HPIV-1 is the most frequent viral cause of croup;
    HPIV-2 also causes croup, while HPIV-4 is comparatively more associated with
    lower respiratory tract involvement.
  cell_types:
  - preferred_term: ciliated epithelial cell
    term:
      id: CL:0000067
      label: ciliated epithelial cell
  locations:
  - preferred_term: larynx
    term:
      id: UBERON:0001737
      label: larynx
  - preferred_term: trachea
    term:
      id: UBERON:0003126
      label: trachea
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:27486735
    reference_title: Parainfluenza Virus Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The classic signs of croup include hoarseness, cough, and stridor which are due to obstruction from inflammation of the subglottic region of the trachea"
    explanation: Directly links inflammation of the subglottic trachea to upper-airway obstruction, cough, and stridor in HPIV croup.
  - reference: PMID:38900074
    reference_title: "Clinical Characteristics of Pediatric Parainfluenza Virus Infections: A Comparative Analysis of Parainfluenza Virus Serotypes 1-4 From April 2021 to October 2023 in Hokkaido, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with the other serotypes, croup was significantly more common in
      PIV-1 and lower respiratory tract infection was significantly more common in
      PIV-4.
    explanation: >-
      Pediatric cohort data showing croup is significantly more common with HPIV-1
      and lower respiratory tract infection with HPIV-4.
  downstream:
  - target: Croup
    description: >-
      Inflammatory edema of the larynx and subglottic trachea produces clinical
      croup with barking cough.
    causal_link_type: DIRECT
  - target: Stridor
    description: >-
      Turbulent inspiratory airflow across the edematous, narrowed pediatric
      subglottic airway generates stridor.
    causal_link_type: DIRECT
- name: Small-Airway Epithelial Injury and Bronchiolar Inflammation
  biological_scale: TISSUE
  description: >-
    Distal spread of HPIV replication (particularly HPIV-3 in infants and
    HPIV-4) into bronchiolar epithelium causes epithelial sloughing, mucus
    plugging, and peribronchiolar inflammation, manifesting clinically as
    bronchiolitis.
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  locations:
  - preferred_term: bronchiole
    term:
      id: UBERON:0002186
      label: bronchiole
  biological_processes:
  - preferred_term: acute inflammatory response
    term:
      id: GO:0002526
      label: acute inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:27486735
    reference_title: Parainfluenza Virus Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Human parainfluenza viruses (HPIVs) are an important cause of respiratory illness in children and adults with a wide range of clinical manifestations including colds, croup, bronchiolitis, and pneumonia."
    explanation: Confirms bronchiolitis and lower respiratory involvement within the clinical-pathological spectrum of HPIV infection.
  - reference: PMID:38900074
    reference_title: "Clinical Characteristics of Pediatric Parainfluenza Virus Infections: A Comparative Analysis of Parainfluenza Virus Serotypes 1-4 From April 2021 to October 2023 in Hokkaido, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with the other serotypes, croup was significantly more common in
      PIV-1 and lower respiratory tract infection was significantly more common in
      PIV-4.
    explanation: Demonstrates lower respiratory tract involvement in pediatric parainfluenza infection, especially HPIV-4 alongside HPIV-3.
  downstream:
  - target: Bronchiolitis
    description: >-
      Small-airway epithelial injury and peribronchiolar edema produce clinical
      bronchiolitis.
    causal_link_type: DIRECT

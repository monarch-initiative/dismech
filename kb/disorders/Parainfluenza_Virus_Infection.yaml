notes: >-
  Human parainfluenza virus types 1 and 3 belong to genus Respirovirus whereas
  types 2 and 4 belong to genus Orthorubulavirus within family Paramyxoviridae;
  all four serotypes are modeled together in this entry with serotype-specific
  clinical predominance (HPIV-1/2 in croup, HPIV-3/4 in bronchiolitis and
  pneumonia) captured across infectious_agent and pathophysiology.

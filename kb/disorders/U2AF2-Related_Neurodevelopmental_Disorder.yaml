genetic:
- name: U2AF2
  gene_term:
    preferred_term: U2AF2
    term:
      id: hgnc:23156
      label: U2AF2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    U2 small nuclear RNA auxiliary factor 2, the 65 kDa U2AF subunit. Variants
    are heterozygous and nearly all de novo. Missense variants cluster in the
    RRM1 and RRM2 RNA recognition motifs; seven recurrent variants account for
    about two thirds of individuals in the largest cohort, with Arg149Trp and
    Arg150Cys/His as hotspots. Fly rescue experiments classify the recurrent
    missense variants as partial loss of function. A presumed missense variant
    (c.603G>T) instead causes exon 6 skipping and an in-frame deletion, and a
    2.2 Mb de novo deletion spanning U2AF2 has been reported with an
    overlapping phenotype, suggesting haploinsufficiency may also cause
    disease. No ClinGen gene-disease validity record for U2AF2 is present in
    the local structured-source cache.
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We implicated pathogenic variants in U2AF2 and PRPF19, encoding spliceosome subunits in neurodevelopmental disorders (NDDs), by identifying 46 unrelated individuals with 23 de novo U2AF2 missense variants (including 7 recurrent variants in 30 individuals)"
    explanation: Largest cohort establishing the gene-disease association.
  - reference: PMID:34112922
    reference_title: "Global developmental delay, systemic dysmorphism and epilepsy in a patient with a de novo U2AF2 variant."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report an individual with a de novo U2AF2 variant (c.445C>T, p.(Arg149Trp)) using trio-based whole-exome sequencing."
    explanation: First clinically detailed de novo case.
  - reference: PMID:37092751
    reference_title: "U2AF2 variant in a patient with developmental delay, dysmorphic features, and epilepsy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a patient with a de novo missense variant in U2AF2, the second case report of the same variant, and third case report overall."
    explanation: Independent recurrence of the same variant.
  variants:
  - name: p.(Arg149Trp)
    description: >-
      c.445C>T, the commonest recurrent missense variant, in RRM1. Reduces

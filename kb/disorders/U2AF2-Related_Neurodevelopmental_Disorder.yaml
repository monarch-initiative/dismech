      evidence_source: MODEL_ORGANISM
      snippet: "At 6 minutes, 60% of U2af50-knockdown flies were immobile, whereas only 20% of the WT flies showed the heat-induced paralysis"
      explanation: >-
        Motor-neuron knockdown of the fly ortholog produces heat-induced
        seizure-like paralysis, which the authors relate to the frequent
        (often febrile) seizures in patients.
  - target: Autistic Behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Similarly, knockdown of U2af50 in the MB resulted in increased social aggregation in adult female flies."
      explanation: >-

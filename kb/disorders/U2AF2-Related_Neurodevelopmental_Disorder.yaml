pathophysiology:
- name: Germline U2AF2 RNA Recognition Motif Variant
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  description: >-
    A heterozygous de novo U2AF2 variant, usually a missense change in RNA
    recognition motif 1 or 2, alters the U2AF65 subunit that binds the
    polypyrimidine tract of 3' splice sites. The recurrent Arg149Trp,
    Arg150His and Arg150Cys substitutions lower the affinity of U2AF2 for a
    consensus polypyrimidine-tract RNA by roughly three- to five-fold by
    disrupting Arg146 contacts with the terminal nucleotide, without changing
    U2AF2 protein abundance or nuclear localization.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: U2AF2
    term:
      id: hgnc:23156
      label: U2AF2
  molecular_functions:
  - preferred_term: polypyrimidine tract RNA binding at the 3' splice site
    term:
      id: GO:0030628
      label: pre-mRNA 3'-splice site binding
    modifier: DECREASED
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together, we identified 23 U2AF2 variants associated with an NDD, including 21 de novo and 7 recurrent variants, in the RRMs required for RNA recognition."
    explanation: >-
      Places the disease-associated variants, mostly de novo, in the RNA
      recognition motifs of U2AF2.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The U2AF2 RRMs serve the major function of recognizing polypyrimidine (Py) tract signals marking 3′ splice sites"
    explanation: >-
      States the molecular function the variant-bearing domains carry, which is
      the function bound on this node.
  - reference: PMID:39388459
    reference_title: "Recurrent Neurodevelopmentally Associated Variants of the Pre-mRNA Splicing Factor U2AF2 Alter RNA Binding Affinities and Interactions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Here, we demonstrated by fluorescence anisotropy RNA binding assays that recurrent missense mutants (Arg149Trp, Arg150His, or Arg150Cys) decreased the binding affinity of U2AF2 for a consensus splice site RNA."
    explanation: >-
      Direct biochemical measurement of reduced polypyrimidine-tract binding by
      the three recurrent variants.
  - reference: PMID:39388459
    reference_title: "Recurrent Neurodevelopmentally Associated Variants of the Pre-mRNA Splicing Factor U2AF2 Alter RNA Binding Affinities and Interactions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Crystal structures at 1.4 Å resolutions showed that Arg149Trp or Arg150His disrupted hydrogen bonds between U2AF2 and the terminal nucleotides of the RNA site."
    explanation: Structural basis of the weakened RNA binding.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The abundance of all mutant U2AF2 proteins was comparable to WT"
    explanation: >-
      The missense variants alter function rather than protein level, which is
      why the lesion is recorded as a change in RNA binding.
  downstream:
  - target: Altered Splicing of Neurodevelopmental RNA-Binding Protein Transcripts
    description: >-
      Weakened polypyrimidine-tract recognition reduces splicing at
      U2AF2-sensitive 3' splice sites and shifts exon usage in a subset of
      transcripts.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Eight U2AF2 variants dysregulated splicing of a model substrate."
      explanation: >-
        Patient variants reduce splicing of a polypyrimidine-tract minigene
        reporter in HEK293T cells.
- name: Altered Splicing of Neurodevelopmental RNA-Binding Protein Transcripts
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  description: >-
    Reduced U2AF2 function changes exon usage in a subset of transcripts rather
    than abolishing splicing. In U2af50-deficient fly brain and in U2AF2-depleted
    human cell lines the affected set is enriched for transcripts encoding
    RNA-binding proteins, including Rbfox1 and other neurodevelopmental
    splicing regulators, and restoring Iswi, Rbfox1 or RpS19a partially rescues
    the fly brain phenotype. Which human neural transcripts carry the disease is
    not yet established.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Indeed, we observed that coexpression of 8 of 18 mutant constructs and the pyPY minigene in HEK293T cells significantly reduced py splicing"
    explanation: >-
      Patient variants reduce splicing at the weaker, uridine-poor
      polypyrimidine tract of the reporter.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of U2af50 RNAi RNA-Seq data with moderate knockdown efficiency (49%) revealed 234 diffUEs in 185 unique genes"
    explanation: >-
      Partial knockdown of the fly ortholog changes exon usage in a limited set
      of genes, consistent with a sensitive subset rather than global failure.
  - reference: PMID:39388459
    reference_title: "Recurrent Neurodevelopmentally Associated Variants of the Pre-mRNA Splicing Factor U2AF2 Alter RNA Binding Affinities and Interactions."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Reanalysis of publicly available RNaseq data confirmed that U2AF2 depletion altered splicing of transcripts encoding RNA binding proteins (RBPs)."
    explanation: >-
      Reanalysis of ENCODE knockdown data in human cell lines identifies
      U2AF2-sensitive splicing of RNA-binding-protein transcripts.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Remarkably, 3 genes tested, Iswi, Rbfox1, and RpS19a, could rescue the MB defects observed in flies expressing U2af50 RNAi to a different extent."
    explanation: >-
      Identifies downstream effectors whose restoration rescues the fly
      mushroom body defect, placing them functionally downstream of U2AF2.
  downstream:
  - target: Impaired Neurogenesis and Neurite Outgrowth
    description: >-
      Altered splicing of neural splicing regulators and other substrates
      impairs neural progenitor proliferation and neurite growth.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Transcriptome profiling revealed splicing substrates or effectors (including Rbfox1, a third splicing factor), which rescued MB defects in U2af50-deficient flies."
      explanation: >-
        Links the splicing effectors to the neural structural defect through
        rescue in the fly.
- name: Impaired Neurogenesis and Neurite Outgrowth
  description: >-
    Neurons differentiated from human pluripotent stem cells carrying the
    hyper-recurrent Arg149Trp or Arg150Cys variant have shorter neurites, and
    neural knockdown of the fly ortholog U2af50 reduces neural progenitor
    proliferation, shrinks the mushroom body, and produces heat-induced
    seizure-like paralysis and social deficits, none of which the patient
    variants fully rescue.
  role: downstream_consequence
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron projection development
    term:
      id: GO:0031175
      label: neuron projection development
    modifier: DECREASED
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Neuritogenesis was reduced in human neurons differentiated from human pluripotent stem cells carrying two U2AF2 hyper-recurrent variants."
    explanation: Isogenic human neuron model of the two commonest variants.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These results strongly suggest that, while WT U2AF2 could largely replace U2af50 in flies, the 2 variants were partial LoF alleles."
    explanation: >-
      Rescue experiments in neural U2af50-knockdown flies classify the
      recurrent variants as partial loss of function.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

name: U2AF2-related neurodevelopmental disorder
creation_date: "2026-10-28T12:00:00Z"
category: Mendelian
description: >-
  U2AF2-related neurodevelopmental disorder is a spliceosomopathy caused by
  heterozygous, almost always de novo, variants in U2AF2, which encodes the
  large subunit of the U2 auxiliary factor (U2AF65) that recognizes the
  polypyrimidine tract at major-class 3' splice sites during the earliest step
  of spliceosome assembly. Disease-associated missense variants cluster in the
  two RNA recognition motifs, with recurrent hotspots at Arg149 and Arg150.
  The core phenotype is global developmental, speech and motor delay with
  mild-to-severe intellectual disability, hypotonia, seizures (often febrile),
  brain anomalies of which a thin or hypoplastic corpus callosum is the most
  frequent, autistic features and behavioural problems, and a shared facial
  gestalt. Functional studies show the recurrent variants weaken binding to
  polypyrimidine-tract RNA, reduce splicing of a reporter, behave as partial
  loss-of-function alleles in Drosophila, and shorten neurites in human
  stem-cell-derived neurons.
disease_term:
  preferred_term: developmental delay, dysmorphic facies, and brain anomalies
  term:
    id: MONDO:0957810
    label: developmental delay, dysmorphic facies, and brain anomalies
synonyms:
- developmental delay, dysmorphic facies, and brain anomalies
- U2AF2-related neurodevelopmental disorder
- DEDDFAB

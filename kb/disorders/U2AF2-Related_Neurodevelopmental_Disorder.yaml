animal_models:
- name: Drosophila neural U2af50 knockdown
  species: Fruit fly
  genotype: elav-Gal4 driven U2af50 RNAi, with or without UAS-U2AF2 WT, Arg149Trp or Arg150Cys
  publication: PMID:37962958
  description: >-
    Pan-neural, mushroom-body and motor-neuron knockdown of the fly U2AF2
    ortholog, with rescue by wild-type or patient-variant human U2AF2.
  modeled_mechanisms:
  - target: Impaired Neurogenesis and Neurite Outgrowth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Knockdown reduces brain progenitor proliferation and mushroom body size
      and produces seizure-like paralysis; patient variants rescue these only
      partly.
    limitations: >-
      RNAi knockdown (about 49% reduction) models reduced dosage rather than
      the heterozygous missense lesion directly; the mushroom body has no
      direct human counterpart, and behaviour and seizure readouts are
      analogies to the human phenotypes.
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neural loss of function (LoF) of the Drosophila orthologs U2af50 and Prp19 led to lethality, abnormal mushroom body (MB) patterning, and social deficits, which were differentially rescued by wild-type and mutant U2AF2 or PRPF19."
      explanation: Summary of the fly model results.
discussions:
- discussion_id: u2af2_dosage_versus_altered_function
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Germline U2AF2 RNA Recognition Motif Variant
  - pathophysiology#Altered Splicing of Neurodevelopmental RNA-Binding Protein Transcripts
  prompt: >-
    Do the recurrent RRM missense variants act purely as partial loss of
    function equivalent to reduced U2AF2 dosage, and which human neural
    transcripts mis-spliced by them account for the brain phenotype?
  rationale: >-
    Fly rescue experiments classify the recurrent variants as partial loss of
    function, and a whole-gene deletion produces an overlapping phenotype, but
    the missense proteins are expressed at normal levels and missense variants
    cluster at RNA-contacting residues, which leaves open a dominant or
    substrate-specific component. The splicing targets identified so far come
    from fly brain knockdown and from non-neural human cell lines; no
    transcriptome of patient-derived neurons carrying the variants has
    identified the disease-relevant human splicing events. The facial,
    growth and cardiac features have no mechanistic node in this entry for the
    same reason.
  evidence:
  - reference: PMID:42135263
    reference_title: "De Novo 2.2 Mb 19q13.42-q13.43 Microdeletion Encompassing U2AF2: Support for a Haploinsufficiency Model."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's clinical features overlap substantially with those reported in individuals harboring heterozygous U2AF2 variants, supporting haploinsufficiency as a plausible disease mechanism."
    explanation: >-
      Supports a dosage model, while the deletion's other genes make this
      indirect.

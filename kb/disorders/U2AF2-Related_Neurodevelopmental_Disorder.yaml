      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Together, these data suggest that U2AF2 has an important role in neurogenesis and neuritogenesis and a partial LoF effect for both variants, which would ultimately alter neuronal connectivity and network activity."
      explanation: >-
        The authors connect the neuritogenesis defect to altered neuronal
        connectivity; the step to the clinical delay is inferential.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of U2af50 or Prp19 may lead to compromised MB function in neural processing and in the regulation of higher-order social behavior, mimicking the patients with impaired intellectual functions."
      explanation: >-
        Fly learning-centre defects are offered as the counterpart of the
        intellectual impairment; stated by the authors as a possibility.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

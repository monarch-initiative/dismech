histopathology:
- name: Invasive ductal carcinoma of no special type
  finding_term:
    preferred_term: Invasive Breast Carcinoma of No Special Type
    term:
      id: NCIT:C4194
      label: Invasive Breast Carcinoma of No Special Type
  description: In a selected series of 35 women with 44 invasive breast cancers, 38/44 tumors were IDC-NST. Lobular, mixed ductal/lobular and papillary cancers also occurred. Histology does not diagnose germline CHEK2 predisposition.
  diagnostic: false
  evidence:
  - reference: PMID:38091153
    reference_title: Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: BCs were predominantly invasive ductal carcinomas of no special type (IDC-NST) (86%, 38/44).
    explanation: Tumor denominator in a selected pathology series; not carrier penetrance.
- name: Estrogen receptor positivity
  finding_term:
    preferred_term: Estrogen Receptor Positive by Immunohistochemistry
    term:
      id: NCIT:C141465
      label: Estrogen Receptor Positive by Immunohistochemistry
  description: ER positivity was present in 41/43 evaluable tumors in the same series; 34/43 were ER-positive/HER2-negative and 7/43 ER-positive/HER2-positive. The selected series included no triple-negative tumors, which does not establish their impossibility in carriers.
  diagnostic: false
  evidence:
  - reference: PMID:38091153
    reference_title: Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Nearly all BCs were ER + (95%, 41/43)
    explanation: The primary pathology result documents receptor positivity.
- name: Luminal B immunohistochemical surrogate phenotype
  finding_term:
    preferred_term: Luminal B Breast Carcinoma
    term:
      id: NCIT:C53555
      label: Luminal B Breast Carcinoma
  description: Using immunohistochemical surrogates and a Ki67 cutpoint of 14%, 25/36 tumors were classified as luminal B. These are surrogate classifications from one selected series, not a universal molecular subtype for CHEK2-associated breast cancer.
  diagnostic: false
  evidence:
  - reference: PMID:38091153
    reference_title: Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Using immunohistochemical surrogates for molecular subtyping, most (69%, 25/36) BCs were classified as luminal B
    explanation: The assay and denominator qualify the subtype claim.
- name: Sparse tumor-infiltrating lymphocytes
  description: Tumor-infiltrating lymphocytes occupied less than 10% in 34/38 evaluated tumors. The observation does not prove immune suppression as the cause of CHEK2-associated cancer or predict immunotherapy response.
  diagnostic: false
  evidence:
  - reference: PMID:38091153
    reference_title: Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: TILs were sparse (< 10%) in most (89%, 34/38) cases
    explanation: The primary series records a microscopic observation.
differential_diagnoses:
- name: Other hereditary breast cancer predispositions
  description: BRCA1/2, PALB2, ATM and syndromic predispositions including TP53, PTEN, CDH1 and STK11 can overlap clinically.
  distinguishing_features:
  - The combination of tumor types and ages does not reliably distinguish CHEK2 from other inherited cancer predispositions.
  - Molecular testing and syndrome-specific features determine the appropriate diagnosis and surveillance.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK615090/
    reference_title: CHEK2-Related Cancer Predisposition - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: It is not possible to distinguish ... related cancer predisposition from these other cancer susceptibility syndromes based solely on the constellation of tumors and ages of cancer onset present in the family.
    explanation: GeneReviews supports molecular differentiation when clinical cancer patterns overlap.

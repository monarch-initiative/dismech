    label: CHEK2-related cancer predisposition
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most affected individuals are heterozygous for a germline pathogenic variant;
    biallelic carriers are rare. Penetrance is markedly reduced and modifier
    dependent, so a pathogenic variant is frequently inherited from a parent with no
    cancer diagnosis.
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals with CHEK2-related cancer predisposition have a heterozygous pathogenic variant. Rarely, affected individuals have biallelic pathogenic variants."
    explanation: GeneReviews statement of the inheritance pattern and the rarity of biallelic disease.
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vast majority of individuals with a heterozygous germline CHEK2 pathogenic variant inherited the pathogenic variant from a parent who may or may not have had a cancer diagnosis."
    explanation: Documents the reduced penetrance that makes an unaffected transmitting parent the usual case.
pathophysiology:
- name: Germline CHEK2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline truncating variants such as c.1100del, and hypomorphic missense variants
    such as p.Ile157Thr, reduce CHK2 kinase function. Allele class matters: both
    damage the protein, but they confer materially different risk.
  genetic_context:
    gene:
      preferred_term: CHEK2
      term:
        id: hgnc:16627
        label: CHEK2
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:37490054
    reference_title: "Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first described variants in the CHEK2 gene were the loss-of-function variant: c.1100del and the missense variant NM_007194.4:c.470T>C p.(Ile157Thr)"
    explanation: Identifies the two principal allele classes underlying this predisposition.
  - reference: PMID:37490054
    reference_title: "Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is evidence that the common variant p.(Ile157Thr) adversely affects protein function and is therefore “deleterious;” yet, its penetrance is low and in isolation not at a level of clinical actionability"
    explanation: Establishes that the missense allele impairs protein function while carrying low penetrance, which is why allele class is modelled separately from the loss-of-function claim.
  downstream:
  - target: Attenuated ATM-CHK2 Damage Response Signaling
    causal_link_type: DIRECT
- name: Attenuated ATM-CHK2 Damage Response Signaling
  biological_scale: MOLECULAR
  description: >-
    CHK2 is activated by ATM after a double-strand break and phosphorylates BRCA1,
    BRCA2, p53 and CDC25 to initiate repair, apoptosis and cell-cycle arrest. Reduced
    CHK2 function attenuates that signal. The extent to which this translates into a
    failed p53 checkpoint is disputed - CHK2's contribution to activating
    p53-dependent arrest has been described as dispensable - so the node is curated
    as an attenuated signal rather than as checkpoint abolition.
  biological_processes:
  - preferred_term: DNA damage checkpoint signaling
    term:
      id: GO:0000077
      label: DNA damage checkpoint signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHK2 is activated by the ATM kinase and in turn, interacts with BRCA1, BRCA2, p53, CDC25, and other effectors to initiate DNA repair, apoptosis, and cell cycle arrest"
    explanation: States the signalling relationships that this node attenuates.
  - reference: PMID:33322746
    reference_title: "CHEK2 Germline Variants in Cancer Predisposition: Stalemate Rather than Checkmate."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "although CHK2 kinase coded by the CHEK2 gene expedites the DDR signal, its function in activation of p53-dependent cell cycle arrest is dispensable"
    explanation: Supports curating this node as attenuated signalling rather than as loss of the p53 checkpoint, and is the reason the stronger claim is not made.
  downstream:
  - target: Biallelic Inactivation and Genomic Instability
    causal_link_type: DIRECT
- name: Biallelic Inactivation and Genomic Instability
  biological_scale: CELLULAR
  description: >-
    In most CHEK2-associated breast cancers the second allele is lost, so the germline
    variant acts as a first hit and the tumour is CHEK2-null. Unlike BRCA1- and
    BRCA2-driven tumours, these cancers do not show a homologous recombination
    deficiency signature, which is one reason the downstream oncogenic mechanism is
    still unsettled.
  evidence:
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic CHEK2 alteration with loss of heterozygosity was identified in most BCs (57%, 13/23) by NGS."
    explanation: Documents somatic loss of the second allele in the majority of sequenced tumours.
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in contrast to BRCA1/2-related cancers, CHEK2-associated BCs appear to lack the genetic characteristics of homologous recombination DNA repair deficiency"
    explanation: Distinguishes this mechanism from the homologous-recombination-deficient BRCA1/2 route.
  downstream:
  - target: Breast carcinoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Prostate cancer
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Testicular neoplasm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
discussions:
- discussion_id: chek2_oncogenic_route_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Biallelic Inactivation and Genomic Instability
  prompt: >-
    By what route does CHEK2 loss actually drive breast carcinogenesis, given that the
    tumours lack a homologous recombination deficiency signature and CHK2's role in
    p53-dependent arrest is dispensable?
  rationale: >-
    The pathway from CHEK2 loss to tumour is asserted far more confidently in reviews
    than the primary data support. The largest histopathologic series states the
    relationship is uncertain, and the two obvious mechanistic candidates - a failed
    p53 checkpoint and homologous recombination deficiency - are each contradicted by
    published observations. The intervening edges in this entry are curated as having
    unknown intermediates for that reason.
  evidence:
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The precise mechanistic relationship between CHEK2 and BC development currently remains uncertain."
    explanation: The primary source states the gap directly.
- discussion_id: chek2_not_li_fraumeni
  kind: CONTROVERSY
  attaches_to:
  - disease#
  prompt: >-
    Is CHEK2 a Li-Fraumeni syndrome gene?
  rationale: >-
    No. An early case series proposed the association in individuals meeting
    Li-Fraumeni clinical criteria without a germline TP53 variant, and it has since
    been refuted, including by restudy of the original families. The claim persists in
    older literature and in clinical folklore, so the refutation is recorded here as
    evidence rather than left as an unstated absence. Getting this wrong would place
    the entry in the wrong nosological family and imply Li-Fraumeni surveillance for
    CHEK2 heterozygotes.
  status: RESOLVED
  evidence:
  - reference: PMID:37490054
    reference_title: "Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "a large body of evidence has conclusively shown that variants in CHEK2 are not associated with Li-Fraumeni syndrome"
    explanation: Refutes the historical claim that CHEK2 is a Li-Fraumeni syndrome gene.
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "although the association with Li-Fraumeni syndrome has since been negated"
    explanation: Independent confirmation that the Li-Fraumeni association was negated.
- discussion_id: chek2_risk_is_a_distribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: >-
    What lifetime cancer risk should be quoted to a CHEK2 heterozygote?
  rationale: >-
    There is no single correct figure. Risk for a CHEK2 heterozygote runs on a
    continuum from population level to high risk depending on the specific variant,
    family history and other modifiers, which is why the management sources direct
    clinicians to a personalised estimate rather than a genotype-based number.
  evidence:
  - reference: PMID:37490054
    reference_title: "Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although CHEK2 is considered a moderate penetrance gene, cancer risks may be considered as a continuous variable, which are influenced by family history and other modifiers."
    explanation: Supports curating risk as a modifier-dependent distribution rather than a fixed penetrance figure.

phenotypes:
- category: Neoplastic
  name: Breast carcinoma
  description: >-
    Female breast cancer is the predominant tumour. Reported lifetime risk ranges
    from 20% to 44% depending on family history. Tumours are typically oestrogen
    receptor positive invasive ductal carcinoma of no special type, luminal B, and
    arise in younger women with higher rates of multifocal and bilateral disease.
  phenotype_term:
    preferred_term: Breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHEK2-related cancer predisposition is predominantly characterized by an increased risk of female breast cancer."
    explanation: GeneReviews establishes female breast cancer as the dominant phenotype.
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline CHEK2 PVs confer a lifetime BC risk ranging from 20 to 44%, depending on family history of BC"
    explanation: Quantifies the lifetime breast cancer risk and its dependence on family history.
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHEK2-associated BCs occurred in younger women (median age 45 years, range 25-75) and were often multifocal (20%) or bilateral (11%)."
    explanation: Characterises age at onset and the multifocal/bilateral pattern.
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all CHEK2-associated BCs were ER + IDC-NST, with most classified as luminal B with or without HER2 overexpression."
    explanation: Establishes the receptor and molecular subtype profile of these tumours.
- category: Neoplastic
  name: Contralateral breast carcinoma
  description: >-
    After a first breast cancer, CHEK2 carriers are at significantly elevated risk of
    a contralateral primary. Ten-year cumulative incidence is 13% in premenopausal and
    4% in postmenopausal carriers.
  phenotype_term:
    preferred_term: Breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:
  - reference: PMID:36623243
    reference_title: "Contralateral Breast Cancer Risk Among Carriers of Germline Pathogenic Variants in ATM, BRCA1, BRCA2, CHEK2, and PALB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline BRCA1, BRCA2, and CHEK2 PV carriers with breast cancer were at significantly elevated risk (hazard ratio > 1.9) of CBC"
    explanation: Establishes elevated contralateral breast cancer risk in CHEK2 carriers from a prospective cohort of 15,104 women.
  - reference: PMID:36623243
    reference_title: "Contralateral Breast Cancer Risk Among Carriers of Germline Pathogenic Variants in ATM, BRCA1, BRCA2, CHEK2, and PALB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 10-year cumulative incidence of CBC among postmenopausal PV carriers was 12% for BRCA1, 9% for BRCA2, and 4% for CHEK2."
    explanation: Quantifies the postmenopausal contralateral risk, which is the figure that drives surgical decision-making.
- category: Neoplastic
  name: Prostate cancer
  description: >-
    Prostate cancer is associated with CHEK2 variants, but to a lesser degree than
    breast cancer.
  phenotype_term:
    preferred_term: Prostate cancer
    term:
      id: HP:0012125
      label: Prostate cancer
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To a lesser extent there is an association with increased risk of prostate cancer."
    explanation: GeneReviews states the prostate cancer association and grades it below breast cancer.
- category: Neoplastic
  name: Testicular neoplasm
  description: >-
    CHEK2 has been reported as a moderate-penetrance testicular germ cell tumour
    susceptibility gene, with loss-of-function carriers presenting about six years
    earlier than non-carriers.
  phenotype_term:
    preferred_term: Testicular neoplasm
    term:
      id: HP:0010788
      label: Testicular neoplasm
  evidence:
  - reference: PMID:30676620
    reference_title: "Association of Inherited Pathogenic Variants in Checkpoint Kinase 2 (CHEK2) With Susceptibility to Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unselected men with TGCTs were approximately 4 times more likely to carry germline loss-of-function CHEK2 variants compared with cancer-free individuals from the Exome Aggregation Consortium cohort"
    explanation: Quantifies the enrichment of loss-of-function CHEK2 variants in testicular germ cell tumour cases.
  - reference: PMID:30676620
    reference_title: "Association of Inherited Pathogenic Variants in Checkpoint Kinase 2 (CHEK2) With Susceptibility to Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with the pathogenic CHEK2 loss-of-function variants developed TGCTs 6 years earlier than individuals with CHEK2 wild-type alleles"
    explanation: Documents the earlier age at onset in carriers.
- category: Neoplastic
  name: Other cancer associations
  description: >-
    Associations with colorectal, thyroid, kidney and other cancers have been
    proposed. GeneReviews grades them as less well established or conflicting, so they
    are recorded here as an unresolved association rather than as established
    phenotypes.
  phenotype_term:
    preferred_term: Colon cancer
    term:
      id: HP:0003003
      label: Colon cancer
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Associations for other cancers are less well established or conflicting."
    explanation: The authoritative clinical resource declines to establish the wider tumour spectrum, which is why these are not curated as separate confirmed phenotypes.
  - reference: PMID:37490054
    reference_title: "Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Colorectal and prostate cancer surveillance should be considered based on assessment of family history."
    explanation: Shows that colorectal risk is managed on family history rather than on carrier status alone.
genetic:
- name: CHEK2
  notes: >-
    CHEK2 at 22q12.1 encodes the checkpoint kinase CHK2. Pathogenic variants are among
    the most frequently returned results on hereditary cancer panels, and roughly 1%
    of the population carries a germline CHEK2 variant.
  gene_term:
    preferred_term: CHEK2
    term:
      id: hgnc:16627
      label: CHEK2
  evidence:
  - reference: PMID:33322746
    reference_title: "CHEK2 Germline Variants in Cancer Predisposition: Stalemate Rather than Checkmate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHEK2 mutations rank among the most frequent germline alterations revealed by germline genetic testing for various hereditary cancer predispositions, but their interpretation is not trivial."
    explanation: Establishes how commonly this gene is implicated and flags the interpretive difficulty.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis rests on identifying a heterozygous germline pathogenic variant in
    CHEK2, usually on a multigene panel.
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CHEK2-related cancer predisposition is established in a proband with a heterozygous germline pathogenic variant in CHEK2 identified by molecular genetic testing."
    explanation: States the diagnostic criterion.
treatments:
- name: Breast cancer surveillance
  description: >-
    Annual mammography from age 40, with breast MRI recommendations varying by
    jurisdiction. Whether a carrier is offered population-level or high-risk
    surveillance should follow a personalised risk estimate rather than carrier status
    alone.
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Breast cancer surveillance in females typically includes breast self-exam training and symptom awareness; mammogram every 12 months beginning at age 40 years; breast MRI recommendations vary by location."
    explanation: Specifies the surveillance protocol.
  - reference: PMID:37490054
    reference_title: "Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early cancer detection and prevention for CHEK2 heterozygotes should be guided by personalized risk estimates"
    explanation: Establishes that surveillance intensity is set by personalised risk rather than by carrier status.
  target_mechanisms:
  - target: Breast carcinoma
    description: >-
      Surveillance does not modify the mechanism; it detects the tumour phenotype
      earlier.
- name: Prostate cancer surveillance
  description: >-
    Annual serum PSA may be considered from age 40, particularly with a strong family
    history of prostate cancer.
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prostate cancer surveillance in males includes serum PSA to be considered annually beginning at age 40 years especially in those with a strong family history of prostate cancer."
    explanation: Specifies the prostate surveillance recommendation.
- name: Risk-reducing mastectomy
  description: >-
    Not recommended routinely. Contralateral risk-reducing mastectomy is generally not
    advised but may be considered in selected situations, guided by a personalised
    risk estimate and shared decision-making.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Prophylactic Mastectomy
    term:
      id: NCIT:C94445
      label: Prophylactic Mastectomy
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Breast cancer risk-reducing contralateral mastectomy is generally not recommended but may be considered in some situations."
    explanation: States that this intervention is not routine, which is the clinically important negative.
  - reference: PMID:37490054
    reference_title: "Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk-reducing mastectomy should be guided by personalized risk estimates and shared decision making."

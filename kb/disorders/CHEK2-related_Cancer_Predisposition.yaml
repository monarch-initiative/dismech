pathophysiology:
- name: Germline CHEK2 Loss of Function
  description: Truncating, splice-disrupting and deletion alleles can reduce functional CHK2 dosage or kinase activity. The c.1100del founder frameshift is a well-studied loss-of-function allele. Missense effects range from severe loss to partial, assay-dependent dysfunction; biochemical impairment does not by itself establish clinically actionable penetrance.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:33322746
    reference_title: 'CHEK2 Germline Variants in Cancer Predisposition: Stalemate Rather than Checkmate.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The first functional analysis revealed that c.1100delC completely abrogates CHK2 kinase activity
    explanation: Review synthesis of functional work on the truncating founder allele.
  - reference: PMID:37490054
    reference_title: 'Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: there is evidence that the common variant p.(Ile157Thr) adversely affects protein function and is therefore “deleterious;” yet, its penetrance is low and in isolation not at a level of clinical actionability
    explanation: Separates functional impairment from cancer penetrance and clinical actionability.
  gene:
    preferred_term: CHEK2
    term:
      id: hgnc:16627
      label: CHEK2
  molecular_functions:

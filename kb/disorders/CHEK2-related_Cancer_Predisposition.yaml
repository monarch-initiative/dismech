name: CHEK2-related Cancer Predisposition
creation_date: "2026-09-02T00:00:00Z"
description: >-
  CHEK2-related cancer predisposition is an autosomal dominant susceptibility associated with germline pathogenic variants in the checkpoint kinase gene CHEK2. Female breast cancer is the best-established manifestation, with increased contralateral breast and prostate cancer risks and a smaller absolute male breast cancer risk. Penetrance varies with the allele, age, sex, family history and other modifiers. Common lower-risk missense variants, including p.Ile157Thr, require different risk interpretation from truncating variants. CHK2 participates in DNA-damage signaling, but checkpoint defects are context dependent and CHEK2-associated tumors generally lack the BRCA-like homologous-recombination-deficiency profile. Somatic second hits occur in a subset of tumors; neither their presence nor their absence defines every carrier-associated cancer. Clinical management uses individualized surveillance and cancer-specific treatment. CHEK2 does not cause Li-Fraumeni syndrome.
category: Mendelian
synonyms:
- CHEK2-associated cancer predisposition
- CHEK2 cancer susceptibility
- CHK2 checkpoint kinase deficiency

- name: Cancer-directed treatment
  description: >-
    Standard cancer treatment applies. No CHEK2-specific targeted therapy is
    recommended, and response to neoadjuvant chemotherapy in CHEK2-associated breast
    cancer has been variable and mostly incomplete.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:37490054
    reference_title: "Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For CHEK2 heterozygotes who develop cancer, no specific targeted medical treatment is recommended at this time."
    explanation: Records the absence of a genotype-directed therapy.
  - reference: PMID:38091153
    reference_title: "Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Responses to neoadjuvant chemotherapy were variable but mostly incomplete."
    explanation: Reports the observed neoadjuvant chemotherapy response in this population.
- name: Genetic counseling and cascade testing
  description: >-
    Offspring of a heterozygote have a 50% chance of inheriting the variant. Testing
    at-risk adult relatives identifies those who may benefit from increased
    surveillance.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40440438
    reference_title: "CHEK2-Related Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetic testing of at-risk female and male adult relatives can identify those family members who also have the familial pathogenic variant and thus may benefit from increased cancer surveillance."
    explanation: States the cascade testing rationale.


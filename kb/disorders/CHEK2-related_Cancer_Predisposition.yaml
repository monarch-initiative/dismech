animal_models:
- name: Chk2 1100delC knock-in mouse
  species: Mus musculus
  genotype: Chek2*1100delC heterozygotes and homozygotes; backcrossed at least five generations to FVB
  publication: PMID:19805189
  description: Spontaneous tumors were followed for up to 24 months. Homozygotes showed a significant overall increase; the heterozygote comparison was not significant in the pooled-sex analysis. Female-biased effects and varied tumor types limit direct transfer to human breast risk. In a separate DMBA challenge, mammary tumor latency decreased in homozygotes but not heterozygotes; all exposed genotype groups had shortened survival.
  evidence:
  - reference: PMID:19805189
    reference_title: Mice with the CHEK2*1100delC SNP are predisposed to cancer with a strong gender bias.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The difference between heterozygous and wild-type mice is not statistically significant (P = 0.127) but shows a developing trend by 24 months.
    explanation: The full-text result qualifies the abstract-level statement of cancer predisposition.
  modeled_mechanisms:
  - target: Germline CHEK2 Loss of Function
    description: Introduces the founder-equivalent truncating allele.
    evidence:
    - reference: PMID:19805189
      reference_title: Mice with the CHEK2*1100delC SNP are predisposed to cancer with a strong gender bias.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: mice heterozygous and homozygous for Chk2*1100delC and their wild-type counterparts were maintained for up to 2 years
      explanation: The germline knock-in comparison tests allele dosage.
    relationship: PERTURBS
    model_scale: MOLECULAR
    limitations: Species, genetic background, sex and genotype alter tumor outcomes; pooled heterozygote tumor incidence was not significantly elevated.
    fidelity: MODERATE
- name: Chk2-null and Mre11-complex compound-mutant mice
  species: Mus musculus
  genotype: Chk2−/− alone or with Nbs1ΔB/ΔB or Mre11ATLD1/ATLD1
  publication: PMID:18614044
  description: Single-mutant mice were not predisposed to malignancy in this experiment, whereas roughly 40% of the compound-mutant cohorts developed malignancy within two years. Distinct effects of null and knock-in alleles caution against treating all model genotypes as interchangeable.
  evidence:
  - reference: PMID:18614044
    reference_title: Chk2 suppresses the oncogenic potential of DNA replication-associated DNA damage.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: roughly 40% of each cohort succumbing to malignancy within 2 years
    explanation: The tumor result concerns compound mutants, not isolated Chk2 loss.
  modeled_mechanisms:
  - target: Germline CHEK2 Loss of Function
    description: Deletes Chk2 with or without an additional damage-response defect.
    evidence:
    - reference: PMID:18614044
      reference_title: Chk2 suppresses the oncogenic potential of DNA replication-associated DNA damage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: we generated Nbs1ΔB/ΔB Chk2−/− and Mre11ATLD1/ATLD1 Chk2−/− mice.
      explanation: The experimental design separates single and compound genotypes.
    relationship: PERTURBS
    model_scale: MOLECULAR
    limitations: Tumor predisposition in compound mutants cannot be attributed to heterozygous CHEK2 loss alone.
    fidelity: MODERATE
experimental_models:
- name: Chk2 1100delC mouse embryonic fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:19805189
  description: Fibroblasts from wild-type, heterozygous and homozygous knock-in mice provide protein and cell-cycle readouts. The original 2007 report supplies the instability assays; the 2009 follow-up supplies CDC25A measurements.
  modeled_mechanisms:
  - target: Increased CDC25A Abundance
    description: Measures increased Cdc25A protein.
    evidence:
    - reference: PMID:19805189
      reference_title: Mice with the CHEK2*1100delC SNP are predisposed to cancer with a strong gender bias.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: the levels of Cdc25A protein in the heterozygous cells are elevated compared with those in the wild-type cells and are even higher in the homozygous mutant cells.
      explanation: Western blotting of mouse embryonic fibroblasts directly supports genotype-associated abundance changes.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: MOLECULAR
    limitations: Protein abundance is not a rescue test of causal mediation in cancer.
    fidelity: MODERATE
  - target: Model-Specific Genomic Instability
    description: Measures persistent damage and altered cell-cycle distribution.
    evidence:
    - reference: PMID:17174984
      reference_title: The breast cancer susceptibility allele CHEK2*1100delC promotes genomic instability in a knock-in mouse model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The mutant cells show signs of spontaneous genomic instability as indicated by polyploidy and an increase in DNA double strand breaks.
      explanation: The original knock-in study directly measures instability in derived fibroblasts.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Model-specific cellular findings do not establish BRCA-like HRD in human tumors.
    fidelity: MODERATE
- name: Chk2-null mouse fibroblast and thymocyte assays
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:18614044
  description: Irradiated fibroblasts and thymocytes distinguish checkpoint preservation from reduced apoptotic signaling and test interaction with Mre11-complex hypomorphism.
  modeled_mechanisms:
  - target: Attenuated CHK2 Damage Response Signaling
    description: Tests the remaining G2/M checkpoint response after Chk2 deletion.
    evidence:
    - reference: PMID:18614044
      reference_title: Chk2 suppresses the oncogenic potential of DNA replication-associated DNA damage.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Inhibition of the G2/M transition following DNA damage (the G2/M checkpoint), which is defective in Nbs1ΔB/ΔB and Mre11ATLD1/ATLD1 cultures, occurred normally in Chk2−/− MEFs 1 hour after IR treatment
      explanation: Primary knockout fibroblast assays demonstrate preservation of this checkpoint under the tested conditions.
    relationship: MEASURES
    model_scale: CELLULAR
    limitations: G2/M arrest remained intact under these conditions despite other CHK2-dependent defects.
    fidelity: MODERATE
  - target: Reduced Damage-Induced Apoptosis
    description: Measures proapoptotic target induction after irradiation.
    evidence:
    - reference: PMID:18614044
      reference_title: Chk2 suppresses the oncogenic potential of DNA replication-associated DNA damage.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Whereas their induction was 30–50% of WT in Chk2−/−, Mre11ATLD1/ATLD1, and Atm−/− single mutants, Bbc3/Puma and Bax induction was similar to p53−/− in Mre11ATLD1/ATLD1 Chk2−/− double mutants
      explanation: Quantitative PCR after irradiation distinguishes single-mutant residual responses from the severe double-mutant defect.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: The strongest defect occurs in compound-mutant thymocytes, not a human heterozygote.
    fidelity: MODERATE
- name: Recombinant CHK2 p.Ile157Thr biochemical assay
  experimental_model_type: OTHER
  publication: PMID:38367672
  description: Purified truncated recombinant CHK2 proteins were tested with a CDC25-derived peptide and varying ATP concentrations. Ile157Thr retained partial activity and had altered conformational stability. Heat-induced amyloid-like aggregation in vitro was not detected as amyloid deposition in the examined thyroid tissues.
  modeled_mechanisms:
  - target: Germline CHEK2 Loss of Function
    description: Measures partial missense dysfunction in a defined biochemical system.
    evidence:
    - reference: PMID:38367672
      reference_title: CHEK2 germline variants identified in familial nonmedullary thyroid cancer lead to impaired protein structure and function.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: At saturating ATP, the CHK2 p.I157T and p.E321A variants presented 40 to 50% of the WT CHK2 enzymatic activity
      explanation: Direct enzyme assay of residual activity.
    relationship: MEASURES
    model_scale: MOLECULAR
    limitations: A purified, truncated-protein assay cannot quantify cellular function, thyroid-cancer penetrance or clinical actionability.
    fidelity: MODERATE
  evidence:
  - reference: PMID:38367672
    reference_title: CHEK2 germline variants identified in familial nonmedullary thyroid cancer lead to impaired protein structure and function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: amyloid deposition was undetected in both normal and tumor tissues
    explanation: The tissue analysis limits translation of the in-vitro aggregation observation.

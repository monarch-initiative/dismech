- name: Cancer-directed treatment
  description: >-
    Treat established cancer according to site, stage, histology and validated tumor biomarkers. CHEK2 carrier status alone does not establish a broadly effective targeted treatment. In a selected breast pathology series, all evaluable neoadjuvant cases showed tumor-size and Ki67 reductions, but only 3 of 14 treated patients achieved pathologic complete response; two complete responders had HER2-positive tumors. This uncontrolled, largely ER-positive series cannot establish universal chemoresistance.

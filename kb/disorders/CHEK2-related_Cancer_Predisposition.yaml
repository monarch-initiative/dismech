name: CHEK2-related Cancer Predisposition
creation_date: "2026-09-02T00:00:00Z"
description: >-
  CHEK2-related cancer predisposition is the moderate-penetrance autosomal dominant
  cancer susceptibility caused by germline variants in CHEK2, which encodes the
  checkpoint kinase CHK2. CHK2 sits in the ATM-CHK2-p53 arm of the response to DNA
  double-strand breaks: ATM activates CHK2, and CHK2 in turn engages TP53, BRCA1,
  BRCA2 and the CDC25 phosphatases to trigger cell-cycle arrest, repair and
  apoptosis.

  Two features make this entry different from a classic high-penetrance syndrome, and
  both are curated explicitly here rather than smoothed over.

  First, the mechanism is not as clean as the pathway diagram suggests. CHK2 speeds
  the damage signal along, but its role in activating p53-dependent arrest is
  dispensable, so a simple "no CHK2, no p53 checkpoint" account overstates what is
  known. In tumours, most CHEK2-associated breast cancers show biallelic
  inactivation with loss of heterozygosity, so the germline variant behaves as a
  first hit rather than acting through haploinsufficiency alone. The authors of the
  largest histopathologic series say plainly that the precise mechanistic
  relationship between CHEK2 and breast cancer remains uncertain.

  Second, risk is a distribution rather than a number. Cancer risk for a CHEK2
  heterozygote is continuous, running from population level to high risk depending on
  the specific variant, family history and other modifiers, so the same genotype can
  warrant population screening in one family and high-risk surveillance in another.
  The two commonest alleles behave differently: the truncating c.1100del confers the
  higher risk, whereas the p.Ile157Thr missense allele damages protein function yet
  carries a penetrance too low to be clinically actionable on its own.

  Female breast cancer is the dominant tumour type. Prostate cancer is associated to a
  lesser extent, and CHEK2 has been reported as a moderate-penetrance testicular germ
  cell tumour susceptibility gene. Associations with other cancers are less well
  established or conflicting.

  CHEK2 is not a Li-Fraumeni syndrome gene. Early case series suggested it might be,
  and that claim has since been refuted; the entry records the refutation as evidence
  rather than leaving it as an absence.
category: Mendelian
synonyms:
- CHEK2-associated cancer predisposition
- CHEK2 cancer susceptibility
- CHK2 checkpoint kinase deficiency
disease_term:
  preferred_term: CHEK2-related cancer predisposition
  term:

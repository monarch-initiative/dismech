  description: >-
    Bilateral or contralateral risk-reducing mastectomy is not routine solely for CHEK2 heterozygosity. Consider personal and family history, age, estimated lifetime or contralateral risk, competing risks and patient preferences. Surveillance remains an option; a moderate relative risk alone does not establish survival benefit from surgery.

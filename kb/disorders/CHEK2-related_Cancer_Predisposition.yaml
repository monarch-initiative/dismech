    description: Reduced functional CHK2 impairs its contribution to DNA-damage signaling.
    causal_link_type: DIRECT
- name: Somatic CHEK2 Second-Hit Alteration
  description: Somatic loss of the remaining CHEK2 allele is observed in some carrier-associated breast tumors. A selected pathology series found biallelic alteration with loss of heterozygosity in 13 of 23 sequenced cancers. This is a tumor observation, not evidence that all carrier tumors are CHEK2-null or that reduced checkpoint signaling directly causes allele loss.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:38091153
    reference_title: Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Biallelic CHEK2 alteration with loss of heterozygosity was identified in most BCs (57%, 13/23) by NGS.
    explanation: The selected tumor series directly documents second-hit events; germline and somatic findings must be distinguished.
  genetic_context:
    gene:
      preferred_term: CHEK2
      term:
        id: hgnc:16627
        label: CHEK2
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
    description: Acquired loss of the remaining allele in a subset of germline-variant-associated breast cancers.
  downstream:
  - target: Attenuated CHK2 Damage Response Signaling
    description: A second hit can further reduce CHK2 signaling in the affected tumor; the degree of functional loss depends on the alleles.
    causal_link_type: DIRECT
- name: Attenuated CHK2 Damage Response Signaling
  description: Activated ATM can phosphorylate CHK2, which regulates multiple downstream effectors of arrest and apoptosis. CHEK2 deficiency reduces this signaling contribution without necessarily abolishing p53 activation, S-phase arrest or G2/M arrest. Model, allele, cell type and DNA-damage stimulus determine the observed defect.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33322746
    reference_title: 'CHEK2 Germline Variants in Cancer Predisposition: Stalemate Rather than Checkmate.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: ATM phosphorylates CHK2 and other proteins orchestrating DDSB repair and DDR. CHK2 overlaps some ATM targets, amplifies an ATM-triggered signal, and increases the DDR regulation fidelity.
    explanation: The review places CHK2 within a partially redundant damage-response network.
  - reference: PMID:18614044
    reference_title: Chk2 suppresses the oncogenic potential of DNA replication-associated DNA damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Inhibition of the G2/M transition following DNA damage (the G2/M checkpoint), which is defective in Nbs1ΔB/ΔB and Mre11ATLD1/ATLD1 cultures, occurred normally in Chk2−/− MEFs 1 hour after IR treatment
    explanation: Primary knockout fibroblast assays demonstrate preservation of this checkpoint under the tested conditions.
  biological_processes:
  - preferred_term: DNA damage checkpoint signaling
    term:
      id: GO:0000077
      label: DNA damage checkpoint signaling
    modifier: DECREASED
  downstream:
  - target: Increased CDC25A Abundance
    description: Reduced CHK2-dependent regulation of CDC25A turnover is a candidate route to higher protein abundance in the 1100delC model.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced phosphorylation-dependent CDC25A degradation
  - target: Reduced Damage-Induced Apoptosis
    description: Loss of CHK2 reduces selected p53-dependent proapoptotic responses; parallel ATM/MRE11 activity modifies severity.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced induction of proapoptotic p53 targets
- name: Increased CDC25A Abundance
  description: Cdc25A protein abundance is elevated in heterozygous and more strongly in homozygous Chk2*1100delC mouse embryonic fibroblasts; increased staining is also observed in mammary tumors. The proposed mechanism involves impaired phosphorylation-dependent degradation. This experiment measured abundance, not CDC25A rescue of cancer susceptibility.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:19805189
    reference_title: Mice with the CHEK2*1100delC SNP are predisposed to cancer with a strong gender bias.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the levels of Cdc25A protein in the heterozygous cells are elevated compared with those in the wild-type cells and are even higher in the homozygous mutant cells.
    explanation: Western blotting of mouse embryonic fibroblasts directly supports genotype-associated abundance changes.
  downstream:
  - target: Model-Specific Genomic Instability
    description: Increased CDC25A is proposed to contribute to cell-cycle dysregulation and instability in this knock-in model; causal mediation was not isolated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Damage-Induced Apoptosis
  description: Irradiated Chk2-null thymocytes show reduced induction of proapoptotic p53 targets. Additional Mre11 hypomorphism markedly worsens apoptotic defects and produces tumor susceptibility. This supplies a context-dependent tumor-suppression mechanism rather than evidence for universal loss of p53 checkpoints in human CHEK2 carriers.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:18614044
    reference_title: Chk2 suppresses the oncogenic potential of DNA replication-associated DNA damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Whereas their induction was 30–50% of WT in Chk2−/−, Mre11ATLD1/ATLD1, and Atm−/− single mutants, Bbc3/Puma and Bax induction was similar to p53−/− in Mre11ATLD1/ATLD1 Chk2−/− double mutants
    explanation: Quantitative PCR after irradiation distinguishes single-mutant residual responses from the severe double-mutant defect.
  - reference: PMID:18614044
    reference_title: Chk2 suppresses the oncogenic potential of DNA replication-associated DNA damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The apoptotic defect in Mre11ATLD1/ATLD1 was markedly enhanced by Chk2 deficiency, as thymocytes from Mre11ATLD1/ATLD1 Chk2−/− were as defective as p53−/− thymocytes for IR-induced apoptosis
    explanation: The primary thymocyte assay measures the apoptotic endpoint directly in the compound-mutant context.
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: DECREASED
  downstream:
  - target: Breast carcinoma
    description: Reduced elimination of damaged cells is a candidate contributor to tumor susceptibility; the tissue-specific intervening steps in human breast cancer remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Model-Specific Genomic Instability
  description: 'Chk2*1100delC knock-in fibroblasts accumulate in S/G2 and show persistent DNA-damage markers. Such allele-specific findings must be separated from homologous-recombination-deficiency signatures in human tumors: CHEK2-deficient human cancers generally lack those signatures, and Chk2-null splenocytes did not show excess chromosomal lesions in another study.'
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:17174984
    reference_title: The breast cancer susceptibility allele CHEK2*1100delC promotes genomic instability in a knock-in mouse model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The mutant cells show signs of spontaneous genomic instability as indicated by polyploidy and an increase in DNA double strand breaks.
    explanation: The original knock-in study directly measures instability in derived fibroblasts.
  - reference: PMID:18614044
    reference_title: Chk2 suppresses the oncogenic potential of DNA replication-associated DNA damage.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Chk2−/− splenocytes did not show increased spontaneous or IR induced chromosomal lesions
    explanation: This negative result limits generalization from knock-in fibroblasts to every CHEK2-deficient cell.
  downstream:
  - target: Breast carcinoma
    description: Damage persistence may contribute to tumor initiation, but this cellular assay does not establish a universal human breast-cancer route.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
discussions:
- discussion_id: chek2_oncogenic_route_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Attenuated CHK2 Damage Response Signaling
  - pathophysiology#Somatic CHEK2 Second-Hit Alteration
  prompt: Which CHK2-dependent processes mediate human tumor susceptibility?
  rationale: Checkpoint and apoptotic effects differ across models. Second hits are not universal, and genomic analyses distinguish CHEK2 deficiency from BRCA1/2 deficiency. In 16 breast and non-breast tumors from nine c.1100del homozygotes, no sample reached the study LST threshold for homologous-recombination deficiency; SBS3 contributed to two tumors but was not the dominant pattern. These data constrain a BRCA-like mechanism without excluding all DNA-repair functions.
  evidence:
  - reference: PMID:38848470
    reference_title: The genomic landscape of breast and non-breast cancers from individuals with germline CHEK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: None of the analyzed cancers presented with an LST count of 15 or more, which is considered the cutoff value for HRD.
    explanation: Direct genomic analysis of 16 tumors from nine germline c.1100del homozygotes.
  - reference: PMID:38848470
    reference_title: The genomic landscape of breast and non-breast cancers from individuals with germline CHEK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: SBS3, the HRD-related mutational signature (17), was observed to some level in 13% (2/16) of CHEK2-deficient cancers
    explanation: The minority SBS3 signal prevents an absolute claim that this signature never occurs.
- discussion_id: chek2_not_li_fraumeni
  kind: CONTROVERSY
  status: RESOLVED
  attaches_to:
  - disease#
  prompt: Is CHEK2 a Li-Fraumeni syndrome gene?
  rationale: The historical association has been refuted. CHEK2 predisposition should not be assigned TP53-related Li-Fraumeni surveillance solely on that historical claim.
  evidence:
  - reference: PMID:37490054
    reference_title: 'Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG).'
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: a large body of evidence has conclusively shown that variants in CHEK2 are not associated with Li-Fraumeni syndrome
    explanation: The ACMG review refutes the historical gene-disease claim.
- discussion_id: chek2_risk_is_a_distribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: How should variant-specific risk and other modifiers be combined?
  rationale: Absolute risk depends on genotype, age, sex, family history and other genetic and non-genetic factors. Population biobanks and cancer clinics sample different risk distributions. Polygenic risk estimates have predominantly European-ancestry validation, limiting transfer to other populations.
  evidence:
  - reference: PMID:37490054
    reference_title: 'Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Although CHEK2 is considered a moderate penetrance gene, cancer risks may be considered as a continuous variable, which are influenced by family history and other modifiers.
    explanation: Clinical guidance supports individualized rather than uniform lifetime risk.
  - reference: PMID:41396600
    reference_title: Genomic Ascertainment of CHEK2-Related Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Participants in MyCode and UKBB are predominantly of European ancestry. Copy-number variants in CHEK2 were not evaluated due to limited data availability in UKBB.
    explanation: Population and assay limitations constrain the new genome-first cohort results.
  - reference: PMID:37490054
    reference_title: 'Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: the genome-wide association studies used to identify PRS lacked diversity and are predominantly based on individuals of European ancestry.
    explanation: Ancestry-specific validation limits transferability of polygenic risk models.
- discussion_id: chek2_wider_tumour_spectrum
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: Which additional tumor associations warrant clinical action?
  rationale: A 2025 genome-first study replicated kidney, bladder and lymphoid leukemia associations in MyCode and UK Biobank. Thyroid association appeared only in MyCode; colorectal findings remain discordant across studies. Bonferroni correction was applied to organ-system groups, not individual cancer types, and absolute risks were not estimated. Association evidence therefore does not establish benefit from enhanced organ-specific screening. Testicular germ-cell tumor evidence is separately represented with its limits.
  evidence:
  - reference: PMID:41396600
    reference_title: Genomic Ascertainment of CHEK2-Related Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: This work provides substantial evidence from both cohorts of significantly increased risk for kidney cancer, bladder cancer, and chronic lymphocytic leukemia (CLL).
    explanation: The primary two-biobank analysis adds replicated associations to the older clinical-review evidence.
  - reference: PMID:41396600
    reference_title: Genomic Ascertainment of CHEK2-Related Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: A significant excess of malignant neoplasm of thyroid and other endocrine tumors (C73-C75) was observed in MyCode but not UKBB
    explanation: The thyroid association did not replicate across these cohorts.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK615090/
    reference_title: CHEK2-Related Cancer Predisposition - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: To date, there are no recommendations for enhanced surveillance for other cancers.
    explanation: The March 2026 clinical chapter distinguishes reported associations from actionable surveillance.
- discussion_id: chek2_biallelic_risk
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: What are the penetrance and optimal surveillance of biallelic genotypes?
  rationale: The 2024 series included 294 individuals, 159 homozygous for p.Ile157Thr. Overall 157 had at least one malignancy or premalignancy, and 55 of those 157 had multiple such tumors. Among affected women, biallelic loss-of-function variants were associated with earlier onset and more multiple tumors than homozygous p.Ile157Thr. Ascertainment and missing follow-up prevent lifetime penetrance estimates. These genotype strata do not establish a uniform recessive developmental syndrome.
  evidence:
  - reference: PMID:38362852
    reference_title: The heterogeneous cancer phenotype of individuals with biallelic germline pathogenic variants in CHEK2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In total, 157 individuals (53.4%; 157/294 individuals) developed ≥1 (pre)malignancy.
    explanation: The denominator includes affected and unaffected individuals and must not be described as 294 null genotypes.
  - reference: url:https://pure.rug.nl/ws/portalfiles/portal/1081701784/PIIS1098360024000340.pdf
    reference_title: https://pure.rug.nl/ws/portalfiles/portal/1081701784/PIIS1098360024000340.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 55 in- dividuals (35%) developed multiple (pre)malignancies
    explanation: This institutional PDF is the full text of PMID:38362852, not a separate study. Its primary results report 55 of 157 affected individuals with multiple tumors; the later discussion overstates this as more than half of all participants.
- discussion_id: chek2_prognosis_by_context
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: Does CHEK2 genotype independently worsen cancer outcome?
  rationale: Earlier c.1100del breast-cancer cohorts reported heterogeneous survival results. A 2025 genome-first analysis found no significant all-cause survival difference between carriers with cancer and controls with cancer, while overall mortality differed only in UK Biobank, mainly after age 75. These endpoints and ascertainment schemes do not directly resolve variant-specific breast-cancer mortality. Prognosis should be interpreted by cancer type, stage, treatment and competing risks.
  evidence:
  - reference: PMID:41396600
    reference_title: Genomic Ascertainment of CHEK2-Related Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: There was no statistical difference in all-cause mortality among individuals with cancer between case participants in the all-variant group and control participants in both MyCode
    explanation: The primary analysis concerns all-cause mortality among people with cancer, not a breast-cancer-specific survival endpoint.
  - reference: PMID:37490054
    reference_title: 'Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: There was no significant effect on long-term outcome, compared with more than 3000 wild-type controls.
    explanation: The practice review describes one negative survival study alongside reports of poorer c.1100del-associated outcomes.
  - reference: PMID:37490054
    reference_title: 'Management of individuals with germline pathogenic/likely pathogenic variants in CHEK2: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Nearly all previous studies had found significantly adverse outcomes (measured variously as overall survival, BC-specific survival and incidence of CBC) for CHEK2 c.1100del heterozygotes, with or without the administration of adjuvant chemotherapy and/or hormone therapy.
    explanation: The ACMG synthesis records adverse findings alongside null studies; the endpoints include survival and contralateral cancer and are not interchangeable.
phenotypes:
- category: Neoplastic
  name: Breast carcinoma
  description: >-
    Female breast cancer is the principal manifestation. Typical lifetime risk estimates are approximately 20–30%, with substantial variation by allele and modifying factors. Many tumors are estrogen-receptor positive, but this is not a defining histology. A selected series of 35 women reported median diagnosis at 45 years (range 25–75), multifocal tumors in 7/35 and synchronous bilateral tumors in 4/35; those figures are not population penetrance estimates.
  phenotype_term:
    preferred_term: Breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:
  - reference: PMID:40440438
    reference_title: CHEK2-Related Cancer Predisposition.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: CHEK2-related cancer predisposition is predominantly characterized by an increased risk of female breast cancer.
    explanation: GeneReviews identifies the main clinical manifestation.
  - reference: PMID:38091153
    reference_title: Clinicopathologic and genetic analysis of invasive breast carcinomas in women with germline CHEK2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Four patients had synchronous bilateral BCs (11%, 4/35) and seven had multifocal BC (20%, 7/35).
    explanation: The primary clinical series retains distinct patient and tumor denominators.
  phenotype_contexts:
  - sex: FEMALE
    population: Heterozygotes assessed in clinical risk guidance; allele and family history modify risk
    notes: GeneReviews gives an average lifetime breast cancer risk of approximately 20–30%, commonly varying within 15–40%; no single frequency band is assigned across all alleles.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK615090/
      reference_title: CHEK2-Related Cancer Predisposition - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: the average lifetime breast cancer risk for a ... heterozygote ... is approximately 20%-30%
      explanation: The March 2026 chapter summarizes approximate lifetime risk, not the frequency within a case series.
- category: Neoplastic
  name: Contralateral breast carcinoma
  description: >-
    After a first breast cancer, carriers of CHEK2 truncating pathogenic variants have an elevated risk of a metachronous contralateral primary. CARRIERS estimated ten-year cumulative incidence of 13% in premenopausal and 4% in postmenopausal carriers. The primary analysis excluded missense and low-penetrance variants; p.Ile157Thr alone was not significantly associated with contralateral risk. The cohort excluded synchronous bilateral disease and adjusted for endocrine therapy and other covariates.
  phenotype_term:
    preferred_term: Contralateral breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
    laterality: BILATERAL
    description: Metachronous cancers in the two breasts; this is a second primary rather than metastasis.
  evidence:
  - reference: PMID:36623243
    reference_title: Contralateral Breast Cancer Risk Among Carriers of Germline Pathogenic Variants in ATM, BRCA1, BRCA2, CHEK2, and PALB2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Germline CHEK2 PV carriers had a 1.9-fold elevated risk of CBC overall (HR, 1.9; 95% CI, 1.1 to 3.3; P = .03)
    explanation: The full-text adjusted analysis supplies the CHEK2-specific estimate.
  - reference: PMID:36623243
    reference_title: Contralateral Breast Cancer Risk Among Carriers of Germline Pathogenic Variants in ATM, BRCA1, BRCA2, CHEK2, and PALB2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the CHEK2 p.Ile157Thr (c.470T>C) variant was not significantly associated with CBC risk
    explanation: The primary study does not support extrapolating the truncating-variant estimate to Ile157Thr.
  phenotype_contexts:
  - sex: FEMALE
    population: Premenopausal women with prior breast cancer and truncating CHEK2 pathogenic variants in CARRIERS
    notes: Estimated 13% ten-year cumulative incidence; subset uncertainty and treatment exposure matter.
    evidence:
    - reference: PMID:36623243
      reference_title: Contralateral Breast Cancer Risk Among Carriers of Germline Pathogenic Variants in ATM, BRCA1, BRCA2, CHEK2, and PALB2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

    Annual mammography typically begins at age 40. The March 2026 GeneReviews chapter summarizes US guidance to consider annual MRI at age 30–35 in those with additional risk factors and according to preferences; UK recommendations use individualized CanRisk thresholds. Lower-risk missense variants require a family-history-based assessment. Predicted mortality benefit from MRI comes from modeling, not a randomized CHEK2 screening trial. The models assumed complete screening participation and guideline-concordant cancer therapy and projected false-positive examinations and benign biopsies as well as benefit.
  treatment_term:
    preferred_term: cancer screening

  relationship_type: CAUSATIVE
  notes: The gene-level association establishes an inherited predisposition, not uniform penetrance for every variant. Truncating alleles and some missense alleles confer moderate risk; p.Ile157Thr, p.Ser428Phe and p.Thr476Met have lower or uncertain actionable risk in isolation. Allele frequencies vary by ancestry and founder population. In a 2025 genome-first analysis, 3,153 of 167,050 MyCode adults and 3,232 of 469,765 UK Biobank participants met the study pathogenic/likely pathogenic variant definition, which included common lower-risk missense variants and excluded copy-number variants; these are cohort-specific carrier proportions, not disease prevalence.

- name: Genetic counseling and cascade testing
  description: >-
    Offer targeted familial-variant testing to at-risk adult relatives with counseling about variant-specific, incomplete penetrance. Each child of a heterozygote has a 50% transmission risk. A relative who tests negative may retain risk from other family-history factors. Routine predictive testing in childhood is generally not offered because the established management is directed at adult risk.

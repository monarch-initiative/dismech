    explanation: A VUS is not a diagnostic or predictive family-test result.
- name: Sequencing and deletion/duplication assessment
  description: Testing should cover small sequence variants and validated copy-number analysis; sequencing alone may miss exon or whole-gene deletions. CHEK2 pseudogene homology can complicate assay design. Exome or genome data do not automatically guarantee equivalent deletion/duplication sensitivity.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK615090/
    reference_title: CHEK2-Related Cancer Predisposition - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: multiexon, or whole-gene deletions/duplications may not be detected.
    explanation: GeneReviews notes the limitation of some sequencing methods.
  - reference: PMID:33322746
    reference_title: 'CHEK2 Germline Variants in Cancer Predisposition: Stalemate Rather than Checkmate.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The 3′ portion of the CHEK2 gene comprising exons 10–14 is duplicated with >90% homology in the human genome
    explanation: The review identifies a locus-specific technical testing issue.
- name: Constitutional versus acquired variant assessment
  description: A CHEK2 alteration found in tumor or blood is not automatically inherited. Clonal hematopoiesis can produce acquired blood variants, sometimes at apparently heterozygous allele fractions. When the clinical context raises doubt, testing appropriate non-hematopoietic tissue helps distinguish a constitutional variant from an acquired hematopoietic clone.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK615090/

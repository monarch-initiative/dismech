diagnosis:
- name: Germline molecular diagnosis
  description: Identify a pathogenic or likely pathogenic germline CHEK2 variant with a validated assay, usually a hereditary cancer multigene panel. A variant of uncertain significance is nondiagnostic. Some historically pathogenic common missense variants have lower penetrance and require variant-specific interpretation.
  evidence:
  - reference: PMID:40440438
    reference_title: CHEK2-Related Cancer Predisposition.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

- name: Secondary and Acquired Causes of Paroxysmal Dyskinesia
  description: >-
    Paroxysmal dyskinesia is not always genetic. Acquired causes act by imposing a focal
    or diffuse insult on the same motor circuits: demyelinating lesions in multiple
    sclerosis (classically producing paroxysmal tonic spasms that are the acquired
    mimic of PKD, likewise carbamazepine-responsive), hypoparathyroidism and other
    metabolic derangements (often with basal-ganglia calcification), perinatal
    hypoxic-ischaemic injury, transient cerebral ischaemia, stroke, trauma, encephalitis
    and autoimmune disease, structural basal-ganglia lesions, and drugs or toxins.
    Adult onset, inconsistent triggers, evolving phenomenology, or any abnormality on
    interictal examination should prompt a search for a secondary cause.
  biological_scale: ORGANISM
  role: trigger
  locations:

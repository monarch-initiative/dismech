epidemiology:
- name: Male predominance and childhood onset
  description: >-
    PKD shows a consistent male excess of roughly 2-4:1 and typically begins in childhood
    or early adolescence, with attack frequency declining in adulthood. The reason for
    the sex bias is unresolved. In a systematic review of 605 paediatric patients the
    mean age at onset was 5.99 years and PKD was the commonest subtype.
  evidence:
  - reference: PMID:38091244
    reference_title: "Paroxysmal Kinesigenic Dyskinesia: Genetics and Pathophysiological Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Male patients are far more numerous than female patients, with a ratio of 2-4:1
    explanation: >-
      Source for the male predominance of PKD.
  - reference: PMID:40943684
    reference_title: "Paroxysmal Dyskinesias in Paediatric Age: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We included 112 studies encompassing 605 paediatric patients. The most common
      subtype was Paroxistic Kinesigenic Dyskinesia (PKD). Male sex was more frequently
      reported. The mean onset age was 5.99 years.
    explanation: >-
      Independent systematic review confirming PKD predominance, male excess and
      early-childhood onset. Note these are literature-level, referral-biased figures,
      not population statistics.
environmental:
- name: Sudden Voluntary Movement or Startle
  influences_mechanisms:
  - target: Trigger-Dependent Breach of the Motor Network Attack Threshold
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      This node is the attack itself, described in the entry as the
      convergence point where a trigger breaches the motor network threshold,
      so a precipitant that provokes an attack within seconds acts on it
      directly. Recorded as triggering rather than exacerbating, which differs
      from the free-text effect field on this exposure: at the level of the
      disease these are aggravating factors, but the link points at the
      attack, which they initiate. The trigger is specific enough to be a
      formal diagnostic criterion.
    evidence:
    - reference: PMID:15623687
      reference_title: "Clinical evaluation of idiopathic paroxysmal kinesigenic dyskinesia: new diagnostic criteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The authors propose the following diagnostic criteria for idiopathic PKD based on this phenotype: identified trigger for the attacks (sudden movements), short duration of attacks (<1 minute), lack of loss of consciousness or pain during attacks, antiepileptic drug responsiveness, exclusion of other organic diseases"
      explanation: >-
        Proposes the identified trigger of sudden movements as one of the
        diagnostic criteria, which ties the exposure to the attack this node
        holds rather than to the disease at large.
  description: >-
    The defining precipitant of PKD: rising from a chair, initiating gait, being startled
    or making any abrupt voluntary movement provokes an attack within seconds. The
    trigger is so specific that its presence is one of the formal diagnostic criteria.
  effect: >-
    EXACERBATES at the disease level (an aggravating factor overall); the
    influences_mechanisms link above records the finer-grained TRIGGERS
    relationship at the level of the individual attack.
  evidence:
  - reference: PMID:15623687
    reference_title: "Clinical evaluation of idiopathic paroxysmal kinesigenic dyskinesia: new diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors propose the following diagnostic criteria for idiopathic PKD based on
      this phenotype: identified trigger for the attacks (sudden movements), short
      duration of attacks (<1 minute), lack of loss of consciousness or pain during
      attacks, antiepileptic drug responsiveness, exclusion of other organic diseases
    explanation: >-
      Formalises the kinesigenic trigger as a diagnostic criterion for PKD.
- name: Caffeine and Alcohol
  influences_mechanisms:
  - target: PNKD (MR-1) Dysfunction and Impaired Methylglyoxal Detoxification
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      An unusually exact match between an exposure and a molecular node: the
      cited study identifies the causal gene product as an enzyme in the
      methylglyoxal detoxification pathway and names coffee and alcoholic
      beverages as the dietary sources of that compound. The exposure and the
      node meet in the same sentence, in the same chemistry.
    evidence:
    - reference: PMID:15496428
      reference_title: "The gene for paroxysmal non-kinesigenic dyskinesia encodes an enzyme in a stress response pathway."
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: "Bioinformatic analysis reveals that the MR-1 gene is homologous to the hydroxyacylglutathione hydrolase (HAGH) gene. HAGH functions in a pathway to detoxify methylglyoxal, a compound present in coffee and alcoholic beverages and produced as a by-product of oxidative stress. Our results suggest a mechanism whereby alcohol, coffee and stress may act as precipitants of attacks in PNKD."
      explanation: >-
        Names methylglyoxal as present in coffee and alcoholic beverages and
        places its detoxification in the pathway this node describes. Quoted
        from the homology sentence onward, so that the bioinformatic basis of
        the claim travels with it: the enzyme identity rests on sequence
        homology rather than a measured assay, which is why this is recorded
        as computational and partial, matching how this entry already grades
        the same sentence on this node.
  - target: Trigger-Dependent Breach of the Motor Network Attack Threshold
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The second half of the same sentence, pointed at the attack node rather
      than the enzyme node: having established the chemistry, the study
      proposes coffee and alcohol as precipitants of attacks. Both edges are
      drawn because the exposure genuinely acts at two levels here, and
      collapsing them would lose either the chemistry or the attack.
    evidence:
    - reference: PMID:15496428
      reference_title: "The gene for paroxysmal non-kinesigenic dyskinesia encodes an enzyme in a stress response pathway."
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: "Bioinformatic analysis reveals that the MR-1 gene is homologous to the hydroxyacylglutathione hydrolase (HAGH) gene. HAGH functions in a pathway to detoxify methylglyoxal, a compound present in coffee and alcoholic beverages and produced as a by-product of oxidative stress. Our results suggest a mechanism whereby alcohol, coffee and stress may act as precipitants of attacks in PNKD."
      explanation: >-
        Suggests a mechanism whereby alcohol, coffee, and stress act as
        precipitants of attacks, which is this node's own event. Partial
        because the authors write suggest and may act rather than reporting a
        measured effect, and computational because the mechanism they suggest
        rests on the homology argument in the same passage.
  description: >-
    Coffee, tea and alcohol are the reproducible precipitants of PNKD attacks and are
    also the exposures whose shared chemistry (methylglyoxal content) motivated the
    stress-response-pathway hypothesis of MR-1 function. Avoiding them is the principal
    intervention in PNKD.
  effect: >-
    EXACERBATES at the disease level (an aggravating factor overall); the
    influences_mechanisms links above record the finer-grained TRIGGERS
    relationship at the level of the MR-1 enzyme node and the individual attack.
  chemicals:
  - caffeine
  - ethanol
  evidence:
  - reference: PMID:15496428
    reference_title: "The gene for paroxysmal non-kinesigenic dyskinesia encodes an enzyme in a stress response pathway."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      HAGH functions in a pathway to detoxify methylglyoxal, a compound present in coffee
      and alcoholic beverages and produced as a by-product of oxidative stress. Our
      results suggest a mechanism whereby alcohol, coffee and stress may act as
      precipitants of attacks in PNKD.
    explanation: >-
      Documents caffeine and alcohol as precipitants and supplies the chemical rationale
      linking them to the causal gene. Regraded to match how this entry grades the same
      sentence on the MR-1 node: the enzyme identity rests on sequence homology rather
      than a measured assay, and the authors frame the precipitant mechanism as a
      suggestion.
- name: Prolonged Exertion and Fasting
  influences_mechanisms:
  - target: Exertion- and Fasting-Unmasked Corticostriatal Energy Failure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The node names exertion and fasting in its own title, and the cited
      series reports attacks triggered by exactly those two and relieved by
      carbohydrate intake or rest. Relief on restoring substrate is the part
      that makes this an energy-supply claim rather than a bare temporal
      association, which is why the link is direct.
    evidence:
    - reference: PMID:27351150
      reference_title: "Paroxysmal Exercise-induced Dyskinesias Caused by GLUT1 Deficiency Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "They were triggered by prolonged exercise or fasting, and could be relieved by carbohydrate intake or rest."
      explanation: >-
        Reports attacks triggered by prolonged exercise or fasting and
        relieved by carbohydrate intake or rest, which is the
        substrate-limitation mechanism this node describes.
  - target: Trigger-Dependent Breach of the Motor Network Attack Threshold
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same exposure pointed at the attack node, one step further on than
      its edge into the energy-failure node. Recorded with known intermediates
      rather than as direct, in contrast to the caffeine and startle links
      into this same node, because the energy-failure node sits between the
      exposure and the attack and is drawn explicitly in this graph.
    evidence:
    - reference: PMID:27351150
      reference_title: "Paroxysmal Exercise-induced Dyskinesias Caused by GLUT1 Deficiency Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "They were triggered by prolonged exercise or fasting, and could be relieved by carbohydrate intake or rest."
      explanation: >-
        The same sentence, read as far as the attack rather than as far as the
        energy deficit that produces it.
  description: >-
    Sustained exercise and, less commonly, fasting precipitate PED attacks by pushing
    cerebral glucose demand beyond the reduced GLUT1 transport reserve. Rest and
    carbohydrate intake terminate attacks, which is itself a useful diagnostic manoeuvre.
  effect: >-
    EXACERBATES at the disease level (an aggravating factor overall); the
    influences_mechanisms links above record the finer-grained TRIGGERS
    relationship at the level of the energy-failure node and the individual attack.
  evidence:
  - reference: PMID:27351150
    reference_title: "Paroxysmal Exercise-induced Dyskinesias Caused by GLUT1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They were triggered by prolonged exercise or fasting, and could be relieved by
      carbohydrate intake or rest.
    explanation: >-
      Documents exertion and fasting as the triggers and carbohydrate/rest as the relief,
      consistent with the energy-supply mechanism.
treatments:
- name: Low-Dose Carbamazepine
  description: >-
    First-line and often dramatically effective treatment for PKD, frequently at doses
    well below those used for epilepsy. Response is so characteristic that antiepileptic
    drug responsiveness is one of the formal PKD diagnostic criteria, and a PRRT2
    mutation predicts near-complete abolition of attacks. Monitor for rash, hyponatraemia,
    sedation, hepatic and haematological toxicity and drug interactions; HLA-B*15:02
    screening is indicated in at-risk ancestries because carbamazepine can precipitate
    Stevens-Johnson syndrome and toxic epidermal necrolysis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  target_mechanisms:
  - target: Presynaptic Release Failure and Neuronal Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      Use-dependent sodium-channel blockade counteracts the lowered action-potential
      threshold and increased sodium-current density produced by PRRT2 loss, restoring
      the margin between baseline and attack.
  target_phenotypes:
  - preferred_term: Paroxysmal dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  evidence:
  - reference: PMID:24661410
    reference_title: "Genotype-phenotype correlation in a cohort of paroxysmal kinesigenic dyskinesia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, the presence of PRRT2 mutations also predicted a good response to
      carbamazepine therapy, especially at low dose.
    explanation: >-
      Establishes both the efficacy and the low-dose requirement, and links response to
      PRRT2 genotype.
  - reference: PMID:24661410
    reference_title: "Genotype-phenotype correlation in a cohort of paroxysmal kinesigenic dyskinesia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the follow-up study revealed that p.R217Pfs 8-positive patients showed dramatic
      improvement with complete abolition of dyskinetic episodes with carbamazepine
      treatment, while only 7 of the 18 patients without PRRT2 mutations showed a response
      to the antiepileptic drug.
    explanation: >-
      Quantifies the genotype-stratified response: complete abolition in PRRT2 carriers
      versus 7 of 18 in non-carriers.
  - reference: PMID:10323309
    reference_title: "The paroxysmal dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antiepileptic drugs particularly carbamazepine are very helpful in a large
      proportion of cases.
    explanation: >-
      Independent confirmation of carbamazepine efficacy in PKD across a review of the
      clinical literature.
- name: Oxcarbazepine
  description: >-
    Structural analogue of carbamazepine used as an equally effective alternative in PKD,
    particularly where carbamazepine is not tolerated. It has been used successfully after
    carbamazepine-induced Stevens-Johnson syndrome, although cross-reactivity is possible
    and reintroduction requires caution.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: oxcarbazepine
      term:
        id: CHEBI:7824
        label: oxcarbazepine
  target_mechanisms:
  - target: Presynaptic Release Failure and Neuronal Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      Sodium-channel blockade, as for carbamazepine.
  evidence:
  - reference: PMID:40943684
    reference_title: "Paroxysmal Dyskinesias in Paediatric Age: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antiseizure drugs-particularly sodium channel blockers such as carbamazepine and
      oxcarbazepine-were the most frequently reported treatment, with complete efficacy
      documented in 59.7% of the studies describing their use.
    explanation: >-
      Systematic review evidence that sodium-channel blockers including oxcarbazepine are
      the mainstay and frequently produce complete efficacy.
- name: Ketogenic Diet
  description: >-
    Disease-directed therapy for SLC2A1/GLUT1-related PED, and the reason GLUT1 deficiency
    must not be missed. Ketone bodies enter the brain via monocarboxylate transporters,
    bypassing the defective GLUT1 route entirely and restoring cerebral fuel supply, so
    the diet treats the mechanism rather than the symptom. Modified Atkins and other
    ketogenic formulations are used where the classic diet is not tolerated; management
    requires a specialist ketogenic team.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Ketogenic Diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  target_mechanisms:
  - target: Exertion- and Fasting-Unmasked Corticostriatal Energy Failure
    treatment_effect: INHIBITS
    description: >-
      Supplies ketone bodies as a GLUT1-independent cerebral fuel, replenishing the energy
      reserve that exertion and fasting deplete.
  target_phenotypes:
  - preferred_term: Paroxysmal dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  evidence:
  - reference: PMID:18577546
    reference_title: "Paroxysmal exercise-induced dyskinesia and epilepsy is due to mutations in SLC2A1, encoding the glucose transporter GLUT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients were successfully treated with a ketogenic diet.
    explanation: >-
      Direct clinical evidence of ketogenic-diet response in genetically confirmed
      SLC2A1-related PED.
  - reference: PMID:27351150
    reference_title: "Paroxysmal Exercise-induced Dyskinesias Caused by GLUT1 Deficiency Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proper identification of the paroxysmal events and early diagnosis is important
      since the disease is potentially treatable.
    explanation: >-
      Supports the clinical imperative of early recognition because the GLUT1 form is
      treatable. Marked PARTIAL because this source does not itself mention the ketogenic
      diet; it establishes treatability, not the specific therapy.
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted therapy: Age-specific KDTs primarily provide a supplemental fuel, namely,
      ketone bodies, for brain energy metabolism.
    explanation: >-
      GeneReviews states the targeted mechanism of ketogenic dietary therapy curated in
      this treatment node.
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typically, the earlier the treatment the better the long-term clinical outcome.
    explanation: >-
      GeneReviews basis for the entry's emphasis that GLUT1 deficiency is the treatable
      cause that must not be missed and that delay costs outcome.
- name: Trigger Avoidance and Lifestyle Modification
  description: >-
    The mainstay in PNKD, where drug response is unreliable: systematic avoidance of
    coffee, tea, alcohol, sleep deprivation and, so far as possible, emotional stress.
    In PED, pacing of exertion and avoidance of fasting reduce attack burden alongside
    the ketogenic diet. Structured counselling about identified personal triggers,
    together with fall precautions and school or workplace accommodation, addresses much
    of the disability even when no drug is effective.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Lifestyle Therapy
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  notes: >-
    Term-binding note: MAXO:0000053 (therapeutic avoidance of environmental exposure) is
    the semantically exact term, but the TreatmentActionTerm dynamic enum is rooted at
    NCIT:C25218 and rejects MAXO identifiers (dismech issue #7524), so the NCIT
    Lifestyle Therapy term is used instead. Its NCIT definition explicitly covers
    "behavioral and dietary modifications, exercise, stress management, and addiction
    control", which matches the intervention curated here.
  evidence:
  - reference: PMID:15496428
    reference_title: "The gene for paroxysmal non-kinesigenic dyskinesia encodes an enzyme in a stress response pathway."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paroxysmal non-kinesigenic dyskinesia (PNKD) is characterized by spontaneous
      hyperkinetic attacks that are precipitated by alcohol, coffee, stress and fatigue.
    explanation: >-
      Identifies the modifiable precipitants that trigger avoidance targets. Marked
      PARTIAL because this establishes the triggers rather than trialling the avoidance
      strategy.
  - reference: PMID:20301400
    reference_title: "Familial Paroxysmal Nonkinesigenic Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Avoid triggers (e.g., caffeine, alcohol, excitement,
      stress, fatigue). Response to pharmacologic treatment is poor; clonazepam or
      diazepam can be effective in some individuals.
    explanation: >-
      GeneReviews management recommendation stating both that trigger avoidance is the
      first-line intervention and that pharmacological response in PNKD is poor, which is
      the entry's rationale for making avoidance the mainstay of this subtype.
- name: Genetic Counselling and Cascade Testing
  description: >-
    Molecular diagnosis changes management (sodium-channel blocker for PRRT2/TMEM151A,
    ketogenic diet for SLC2A1) and changes counselling. Because penetrance is incomplete
    and phenotype-dependent, an unaffected carrier does not refute pathogenicity, and
    families must be counselled that the same allele may present as infantile seizures in
    one member and kinesigenic dyskinesia in another. Cascade testing is appropriate once
    a familial variant is identified.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22875091
    reference_title: "PRRT2 phenotypes and penetrance of paroxysmal kinesigenic dyskinesia and infantile convulsions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of PRRT2 as a major gene for the PKD-ICCA-BFIC spectrum allows
      better disease classification, molecular confirmation of the clinical diagnosis,
      and genetic testing and counseling.
    explanation: >-
      States the counselling and diagnostic-confirmation value of molecular diagnosis in
      this spectrum.
  - reference: PMID:20301400
    reference_title: "Familial Paroxysmal Nonkinesigenic Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Offspring of an affected individual have a 50% chance of inheriting the PNKD
      pathogenic variant. Once the PNKD pathogenic variant has been identified in an
      affected family member, prenatal and preimplantation genetic testing are possible.
    explanation: >-
      GeneReviews genetic-counselling content: the autosomal dominant 50% transmission
      risk and the reproductive options that cascade testing enables.
- name: Deep Brain Stimulation
  description: >-
    Reserved for severe, medication-refractory hyperkinetic disease, principally in the
    pleiotropic genotypes (ADCY5, GNAO1) rather than in classic PKD, PNKD or PED. Globus
    pallidus internus is the usual target. Evidence is limited to case reports and small
    series, so this is recorded as a practice-level option rather than an established
    standard.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Deep Brain Stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  notes: >-
    Deliberately curated without an efficacy evidence item because no controlled or
    cohort evidence for deep brain stimulation in paroxysmal dyskinesia was identified
    during curation; the supporting citation below only establishes the clinical severity
    that motivates considering it. Term-binding caveat: NCIT:C21024 is the only Deep
    Brain Stimulation term in NCIT and is reachable from NCIT:C25218, but its NCIT
    definition frames DBS as electroanalgesia for chronic pain. The intervention curated
    here is pallidal DBS for refractory hyperkinesia; the identifier is used for its
    label, not its definition.
  evidence:
  - reference: PMID:26537056
    reference_title: "ADCY5-related dyskinesia: Broader spectrum and genotype-phenotype correlations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one family, a p.M1029K mutation in the C2 domain causes severe dystonia,
      hypotonia, and chorea.
    explanation: >-
      Documents the severe refractory ADCY5 phenotype in which deep brain stimulation is
      considered. Marked PARTIAL: this supports the clinical context, not efficacy.
diagnosis:
- name: Attack history with video documentation
  description: >-
    Diagnosis is fundamentally historical. Document attack phenomenology, preservation of
    awareness, the trigger, duration, frequency, body distribution, presence of a sensory
    aura, family history, the interictal examination, and treatment response. Because
    attacks are brief and almost never occur in clinic, smartphone video recorded by the
    family is the highest-yield single investigation and is what most often converts a
    suspected functional disorder into a recognised paroxysmal dyskinesia.
  presence: PRESENT
  evidence:
  - reference: PMID:15623687
    reference_title: "Clinical evaluation of idiopathic paroxysmal kinesigenic dyskinesia: new diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of idiopathic paroxysmal kinesigenic dyskinesia (PKD) can be made
      based on historical features.
    explanation: >-
      Establishes that the diagnosis rests on history rather than on an investigation.
- name: Interictal EEG and brain MRI
  description: >-
    Interictal EEG and brain MRI are typically normal in primary paroxysmal dyskinesia and
    are performed to exclude alternatives rather than to confirm the diagnosis. Video-EEG
    is specifically indicated where awareness is impaired, where attacks are sleep-related
    (to separate paroxysmal dyskinesia from sleep-related hypermotor epilepsy), or where
    the semiology is atypical. MRI is mandatory for adult onset, focal deficit,
    progressive course or any interictal abnormality.
  presence: ABSENT
  evidence:
  - reference: PMID:29276650
    reference_title: "Paroxysmal Kinesigenic Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy was suspected first; however, repeat investigations with
      electroencephalography and neuroimaging were normal.
    explanation: >-
      Illustrates the normal EEG and imaging that characterise primary paroxysmal
      dyskinesia and the epilepsy misdiagnosis that precedes recognition.
- name: Paired fasting CSF and blood glucose
  description: >-
    In any patient with exercise- or fasting-triggered attacks, or with paroxysmal
    dyskinesia plus epilepsy, measure CSF glucose with a simultaneous blood glucose after
    a fast and calculate the CSF:blood ratio. A ratio below about 0.60 in a normoglycaemic
    patient indicates GLUT1 deficiency and should be followed by SLC2A1 sequencing plus
    deletion/duplication analysis. This is the highest-value targeted test in the whole
    group because it identifies the ketogenic-diet-responsive cause.
  presence: PRESENT
  evidence:
  - reference: PMID:18577546
    reference_title: "Paroxysmal exercise-induced dyskinesia and epilepsy is due to mutations in SLC2A1, encoding the glucose transporter GLUT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A median CSF/blood glucose ratio of 0.52 (normal >0.60) in the patients
    explanation: >-
      Provides the diagnostic threshold and the observed patient values.
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Glut1DS is established in a proband with suggestive clinical
      findings, hypoglycorrhachia documented by lumbar puncture, and a (usually)
      heterozygous pathogenic variant in SLC2A1 identified by molecular genetic testing.
    explanation: >-
      GeneReviews diagnostic algorithm: hypoglycorrhachia on lumbar puncture followed by
      SLC2A1 molecular testing, which is the pathway curated here.
- name: Multigene panel or exome sequencing
  description: >-
    Because treatment is genotype-directed rather than phenomenology-directed, molecular
    testing is not merely confirmatory. A paroxysmal movement disorder panel should
    include at minimum PRRT2, TMEM151A, PNKD, SLC2A1, KCNMA1, ADCY5, GNAO1, SCN8A, KCNA1,
    CACNA1A and ATP1A3, with deletion/duplication analysis covering 16p11.2 and SLC2A1.
    Trio exome or genome sequencing is appropriate for panel-negative or developmentally
    complex cases. Reported diagnostic yields vary widely with ascertainment.
  presence: PRESENT
  evidence:
  - reference: PMID:26598494
    reference_title: "The clinical and genetic heterogeneity of paroxysmal dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with paroxysmal movement disorders 68 families had mutations (47%) out
      of 145 patients.
    explanation: >-
      Quantifies the diagnostic yield of screening the three principal genes across a
      large paroxysmal dyskinesia cohort.
definitions:
- name: Bruno diagnostic criteria for idiopathic paroxysmal kinesigenic dyskinesia
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The consensus clinical criteria for idiopathic PKD, derived from review of 121
    affected individuals: an identified kinesigenic trigger (sudden movements); short
    attack duration, under one minute; no loss of consciousness and no pain during
    attacks; responsiveness to antiepileptic drugs; exclusion of other organic disease,
    with a normal neurological examination; and age at onset between 1 and 20 years where
    there is no family history (applied less stringently in familial cases).
  scope: >-
    Clinical recognition of idiopathic PKD; the criteria were designed to homogenise
    cohorts for gene discovery and remain the reference case definition.
  inclusion_criteria:
  - preferred_term: Identified kinesigenic trigger (sudden voluntary movement)
    term:
      id: HP:0025228
      label: Triggered by sudden movement
  - preferred_term: Attack duration under one minute
  - preferred_term: Preserved consciousness and absence of pain during attacks
  - preferred_term: Responsiveness to antiepileptic drugs
  - preferred_term: Age at onset between 1 and 20 years when there is no family history
  exclusion_criteria:
  - preferred_term: Other organic disease accounting for the attacks
  notes: >-
    The authors themselves note that these criteria are not universally satisfied: a clear
    kinesigenic trigger was not elicited in every case, antiepileptic response was not
    universal, and some infants had attacks during sleep. A separate infantile-onset group
    with different characteristics was identified.
  evidence:
  - reference: PMID:15623687
    reference_title: "Clinical evaluation of idiopathic paroxysmal kinesigenic dyskinesia: new diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors propose the following diagnostic criteria for idiopathic PKD based on
      this phenotype: identified trigger for the attacks (sudden movements), short
      duration of attacks (<1 minute), lack of loss of consciousness or pain during
      attacks, antiepileptic drug responsiveness, exclusion of other organic diseases, and
      age at onset between 1 and 20 years if there is no family history
    explanation: >-
      Verbatim statement of the criteria set curated here.
  - reference: PMID:15623687
    reference_title: "Clinical evaluation of idiopathic paroxysmal kinesigenic dyskinesia: new diagnostic criteria."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A clear kinesigenic trigger was not elicited in all cases, antiepileptic response
      was not universal, and some infants had attacks while asleep.
    explanation: >-
      Records the authors' own caveats limiting the sensitivity of the criteria.
differential_diagnoses:
- name: Focal epilepsy, including sleep-related hypermotor epilepsy
  disease_term:
    preferred_term: sleep-related hypermotor epilepsy
    term:
      id: MONDO:0100631
      label: sleep-related hypermotor epilepsy
  description: >-
    The single most important and most frequent misdiagnosis in both directions. PKD is
    often misdiagnosed clinically as epilepsy, while most historically diagnosed
    paroxysmal hypnogenic dyskinesia is in fact sleep-related hypermotor epilepsy (SHE),
    formerly nocturnal frontal lobe epilepsy. Curated as an entry-level differential
    precisely because the boundary defines the scope of this entry.
  distinguishing_features:
  - "Paroxysmal dyskinesia: consciousness is fully preserved with no postictal confusion"
  - "Paroxysmal dyskinesia: stereotyped external trigger (sudden movement, caffeine, exertion) with normal ictal and interictal EEG"
  - "Paroxysmal dyskinesia: dystonic or choreic semiology rather than tonic-hypermotor"
  - "SHE: attacks arise out of sleep in clusters, are hypermotor or asymmetric-tonic, may show ictal fear or vocalisation, and may secondarily generalise"
  - "SHE: video-EEG documentation is the definitive discriminator"
  - "Caveat: some short-attack hypnogenic cases do carry PRRT2 variants, so the boundary is probabilistic"
  evidence:
  - reference: PMID:22101681
    reference_title: "Exome sequencing identifies truncating mutations in PRRT2 that cause paroxysmal kinesigenic dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paroxysmal kinesigenic dyskinesia is the most common type of paroxysmal movement
      disorder and is often misdiagnosed clinically as epilepsy.
    explanation: >-
      Documents epilepsy as the commonest misdiagnosis of PKD.
  - reference: PMID:27164717
    reference_title: "Definition and diagnostic criteria of sleep-related hypermotor epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic criteria were developed with 3 levels of certainty: witnessed (possible)
      SHE, video-documented (clinical) SHE, and video-EEG-documented (confirmed) SHE.
    explanation: >-
      Provides the graded video-EEG-anchored criteria that separate SHE from a nocturnal
      dyskinesia.
- name: Episodic ataxia type 1
  disease_term:
    preferred_term: episodic ataxia type 1
    term:
      id: MONDO:0008047
      label: episodic ataxia type 1
  description: >-
    KCNA1 (Kv1.1) channelopathy producing brief attacks that, like PKD, are triggered by
    startle or sudden movement and last seconds to minutes; both are treated with
    antiepileptic drugs. Curated in dismech as Episodic_Ataxia.
  distinguishing_features:
  - EA1 attacks are cerebellar (ataxia, dysarthria, tremor) rather than dyskinetic
  - "Interictal examination in EA1 is NOT normal: continuous myokymia (fine muscle rippling, often periorbital or in the hands) is present between attacks"
  - KCNA1 variants have been reported occasionally in PKD cohorts, so genetic overlap exists
  evidence:
  - reference: PMID:26598494
    reference_title: "The clinical and genetic heterogeneity of paroxysmal dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analysed all three genes (the whole coding regions of SLC2A1 and PRRT2 and exons
      one and two of PNKD) in a series of 145 families with paroxysmal dyskinesias as well
      as in a series of 53 patients with familial episodic ataxia and hemiplegic migraine
    explanation: >-
      Shows that episodic ataxia is routinely screened alongside paroxysmal dyskinesia
      because the two groups are clinically and genetically adjacent.
- name: Episodic ataxia type 2
  disease_term:
    preferred_term: episodic ataxia type 2
    term:
      id: MONDO:0007163
      label: episodic ataxia type 2
  description: >-
    CACNA1A (Cav2.1) channelopathy with attacks of ataxia and vertigo triggered by stress
    or exertion — the same trigger profile as PNKD and PED respectively.
  distinguishing_features:
  - EA2 attacks last hours and are cerebellar rather than hyperkinetic
  - Interictal nystagmus is usually present in EA2
  - EA2 attacks respond to acetazolamide rather than to carbamazepine or the ketogenic diet
  - Progressive interictal cerebellar signs develop in many EA2 patients, which does not occur in primary paroxysmal dyskinesia
  evidence:
  - reference: PMID:32443735
    reference_title: "Clinical and Genetic Overview of Paroxysmal Movement Disorders and Episodic Ataxias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two main categories of PMDs are recognized based on the phenomenology: Paroxysmal
      dyskinesias (PxDs) are characterized by transient episodes hyperkinetic movement
      disorders, while attacks of cerebellar dysfunction are the hallmark of episodic
      ataxias (EAs).
    explanation: >-
      States the phenomenological criterion (hyperkinetic versus cerebellar) that
      separates the two groups.
- name: Functional (psychogenic) movement disorder
  disease_term:
    preferred_term: conversion disorder
    term:
      id: MONDO:0002104
      label: conversion disorder
  description: >-
    Historically the default label for paroxysmal dyskinesia, and still a frequent
    misdiagnosis, because attacks are unwitnessed, bizarre-looking, emotionally
    precipitated, and accompanied by entirely normal examination and investigations.
    Getting this wrong denies patients a treatment that often abolishes the disorder
    outright.
  distinguishing_features:
  - "Favours paroxysmal dyskinesia: a highly consistent and specific trigger and a stereotyped sensory aura in the limb about to be involved"
  - "Favours paroxysmal dyskinesia: stereotyped short attack duration, positive family history, and dramatic response to low-dose carbamazepine"
  - "Favours a functional disorder: variable and distractible phenomenology, entrainment, incongruent triggers, and absence of a consistent aura"
  - "Trap: normal EEG and MRI do NOT favour a functional diagnosis, since they are also normal in primary paroxysmal dyskinesia"
  evidence:
  - reference: PMID:29276650
    reference_title: "Paroxysmal Kinesigenic Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient's presentation was previously misinterpreted as Tourette's syndrome
      despite the absence of vocal tics.
    explanation: >-
      A worked example of the diagnostic-delay problem: a PKD patient carried an incorrect
      hyperkinetic-disorder label for years before the correct diagnosis and an effective
      treatment.
- name: Primary (non-paroxysmal) dystonia
  disease_term:
    preferred_term: dystonic disorder
    term:
      id: MONDO:0003441
      label: dystonic disorder
  description: >-
    Isolated genetic and idiopathic dystonias (including dopa-responsive dystonia and
    myoclonus-dystonia, both curated in dismech) share the dystonic phenomenology but not
    the episodic architecture.
  distinguishing_features:
  - Primary dystonia is continuous or task-specific and persists between episodes, whereas paroxysmal dyskinesia has a completely normal interictal examination
  - Dopa-responsive dystonia shows marked diurnal fluctuation that can be mistaken for paroxysmality, but responds to levodopa
  - Dopa-responsive dystonia worsens through the day rather than being movement-triggered, and does not remit completely between episodes
  evidence:
  - reference: PMID:30242089
    reference_title: "Unravelling of the paroxysmal dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we review the increasing spectrum of genetic conditions, as well as of other
      non-genetic disorders, that might present with PxD, provide criteria for case
      definition and propose a diagnostic workup to reach a definitive diagnosis, on which
      treatment is heavily dependent.
    explanation: >-
      Supports the need for explicit case definition to separate paroxysmal from
      continuous movement disorders, and the treatment consequences of getting it right.
- name: Hypoparathyroidism with basal ganglia calcification
  disease_term:
    preferred_term: hypoparathyroidism
    term:
      id: MONDO:0001220
      label: hypoparathyroidism
  description: >-
    A classic secondary cause: hypocalcaemia with basal-ganglia calcification can produce
    paroxysmal kinesigenic or exertion-induced dyskinesia that is phenotypically
    indistinguishable from the primary forms and remits on correction of calcium.
  distinguishing_features:
  - Later or adult onset with absent family history
  - Associated tetany, paraesthesia, cataract or seizures
  - Low serum calcium with raised phosphate, and bilateral basal-ganglia calcification on CT
  - Treatment is calcium and vitamin D replacement rather than a sodium-channel blocker, so serum calcium should be checked in any atypical case
  evidence:
  - reference: PMID:32443735
    reference_title: "Clinical and Genetic Overview of Paroxysmal Movement Disorders and Episodic Ataxias."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From an etiological point of view, both primary (genetic) and secondary (acquired)
      causes of PMDs are known.
    explanation: >-
      Supports the existence of acquired and metabolic causes requiring exclusion. Marked
      PARTIAL because this citation establishes the category rather than the specific
      hypoparathyroidism association.
- name: Multiple sclerosis with paroxysmal tonic spasms
  disease_term:
    preferred_term: multiple sclerosis
    term:
      id: MONDO:0005301
      label: multiple sclerosis
  description: >-
    Demyelinating lesions, characteristically in the posterior limb of the internal
    capsule or brainstem, produce brief stereotyped painful tonic spasms often triggered
    by movement — the closest acquired mimic of PKD, and likewise
    carbamazepine-responsive.
  distinguishing_features:
  - Attacks are typically painful, and pain is an exclusion criterion for idiopathic PKD
  - Onset is in adulthood with no family history
  - Other neurological signs or a prior demyelinating episode are usually present
  - MRI shows demyelinating lesions rather than being normal
  evidence:
  - reference: PMID:10323309
    reference_title: "The paroxysmal dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tonic spasms in multiple sclerosis and Sandiffers syndrome producing intermittent
      torticollis in infants and children are other paroxysmal movement disorders.
    explanation: >-
      Places multiple sclerosis tonic spasms within the paroxysmal movement disorder
      differential.
clinical_trials:

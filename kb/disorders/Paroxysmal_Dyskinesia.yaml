    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Developmental change in the regional expression of, and functional dependence on, PRRT2 between infancy and later childhood
  evidence:
  - reference: PMID:22101681
    reference_title: "Exome sequencing identifies truncating mutations in PRRT2 that cause paroxysmal kinesigenic dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing followed by Sanger sequencing, we identified three
      truncating mutations within PRRT2 (NM_145239.2) in eight Han Chinese families with
      histories of paroxysmal kinesigenic dyskinesia
    explanation: >-
      Original identification of truncating PRRT2 variants co-segregating with PKD.
  - reference: PMID:26598493
    reference_title: "The evolving spectrum of PRRT2-associated paroxysmal diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The vast majority of mutations lead to a truncated protein or no protein at all and
      thus to a haploinsufficient state.
    explanation: >-
      Establishes haploinsufficiency, rather than a dominant-negative or gain-of-function
      effect, as the operative molecular mechanism.
  - reference: PMID:38091244
    reference_title: "Paroxysmal Kinesigenic Dyskinesia: Genetics and Pathophysiological Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PKD is mainly caused by mutations in the PRRT2 or TMEM151A gene.
    explanation: >-
      Supports treating PRRT2 and TMEM151A as the two loss-of-function loci of the same
      kinesigenic mechanism node.
- name: Presynaptic Release Failure and Neuronal Hyperexcitability
  description: >-
    PRRT2 is enriched at presynaptic terminals, where it interacts with the SNARE
    proteins SNAP-25 and syntaxin-1A, with synaptotagmin 1/2 calcium sensors, and with
    Nav1.2/Nav1.6 sodium channels and the Na+/K+ ATPase. Loss of PRRT2 desynchronises
    calcium-triggered vesicle fusion (reduced release probability and calcium
    sensitivity, increased asynchronous release, more docked vesicles at rest) while
    simultaneously increasing sodium-current density and lowering the action-potential
    threshold. PKD is therefore simultaneously a synaptopathy and a channelopathy: the
    lesion does not produce continuous dysfunction but a network that is stable at
    baseline and unstable when abruptly perturbed.
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540

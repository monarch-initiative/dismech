biochemical:
- name: Hypoglycorrhachia
  subtype: PED
  notes: >-
    Low cerebrospinal fluid glucose with a reduced CSF:blood glucose ratio measured after
    a fast, in the presence of normal blood glucose, is the biochemical fingerprint of
    GLUT1 deficiency and therefore the single most important bedside test for the
    treatable cause of paroxysmal dyskinesia. In PED cohorts the median CSF/blood glucose
    ratio is around 0.52 against a normal lower limit above 0.60; note that the reduction
    can be subtle in mild GLUT1 phenotypes (ratios of 0.54 have been reported in
    genetically confirmed cases), so a borderline ratio does not exclude the diagnosis
    and SLC2A1 sequencing should follow clinical suspicion.
  presence: PRESENT
  biomarker_term:
    preferred_term: Hypoglycorrhachia
    term:
      id: HP:0011972
      label: Hypoglycorrhachia
  specificity: >-
    Highly specific for GLUT1 deficiency among the paroxysmal dyskinesias; not a feature
    of PRRT2, PNKD, KCNMA1 or ADCY5 disease. Must be interpreted against a simultaneous
    normal blood glucose to exclude systemic hypoglycaemia and against CSF pleocytosis
    to exclude meningitis.
  evidence:
  - reference: PMID:18577546
    reference_title: "Paroxysmal exercise-induced dyskinesia and epilepsy is due to mutations in SLC2A1, encoding the glucose transporter GLUT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A median CSF/blood glucose ratio of 0.52 (normal >0.60) in the patients and a
      reduced glucose uptake by mutated transporters compared with the wild-type as
      determined in Xenopus oocytes confirmed a pathogenic role of these mutations.
    explanation: >-
      Provides the quantitative CSF:blood glucose ratio in a genetically confirmed PED
      cohort together with the normal reference threshold.
  - reference: PMID:27351150
    reference_title: "Paroxysmal Exercise-induced Dyskinesias Caused by GLUT1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cerebrospinal fluid to blood glucose ratio, obtained after 10 hours of fasting,
      was slightly decreased (0.54, Normal>0.59).
    explanation: >-
      Shows that the ratio may be only marginally reduced in mild GLUT1 phenotypes, which
      is why a borderline value must not be used to exclude the diagnosis.

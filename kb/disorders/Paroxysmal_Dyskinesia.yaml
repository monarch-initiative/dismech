    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered presynaptic transmission at corticostriatal synapses onto indirect-pathway neurons
    - Unresolved biochemical steps linking MR-1 dysfunction to the endocannabinoid abnormality
  evidence:
  - reference: PMID:15496428
    reference_title: "The gene for paroxysmal non-kinesigenic dyskinesia encodes an enzyme in a stress response pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report mutations in the myofibrillogenesis regulator 1 (MR-1) gene causing PNKD
      in 50 individuals from eight families.
    explanation: >-
      Human genetic evidence establishing MR-1 as the PNKD locus.

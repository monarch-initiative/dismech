- name: Age-Dependent PRRT2 Phenotype Shift from Infantile Seizures to Kinesigenic Dyskinesia
  description: >-
    The single most instructive feature of PRRT2 biology: one haploinsufficient allele
    produces benign familial infantile epilepsy in the first year of life, kinesigenic
    dyskinesia from later childhood, or both sequentially in the same person (the ICCA
    syndrome), with hemiplegic migraine and episodic ataxia at the phenotypic margins.
    Across 1444 published carriers, benign familial infantile epilepsy (41.7%), PKD
    (38.7%) and ICCA (14.3%) account for almost the entire spectrum. Penetrance depends
    on which phenotype is counted: about 61% for PKD alone, but nearly complete once
    infantile convulsions are included. Curatorially this means seizures and dyskinesia
    must be modelled as age-dependent expressions of one lesion, not as comorbidity.

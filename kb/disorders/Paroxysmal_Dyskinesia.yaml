- name: Trigger-Dependent Breach of the Motor Network Attack Threshold
  description: >-
    The convergence node of the entry. Whatever the upstream lesion — presynaptic release
    failure, striatal indirect-pathway hypoactivity, corticostriatal energy failure, BK
    or cAMP dysregulation, or an acquired structural insult — the result is the same: a
    basal-ganglia-thalamo-cortical and cerebello-thalamic motor network that behaves
    normally at baseline but has a reduced margin before a discrete, self-limited
    episode of aberrant motor output. The trigger (sudden movement, stimulant, stress,
    exertion, sleep state) supplies the perturbation that breaches the margin. This
    trigger-threshold architecture is what explains the two defining features of the
    group: attacks are stereotyped and provoked, and the examination between them is
    normal.

name: Paroxysmal Dyskinesia
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >-
  Paroxysmal dyskinesias (PxD) are a clinically and genetically heterogeneous group of
  episodic movement disorders defined by recurrent, abrupt attacks of involuntary
  hyperkinetic movement — dystonia, chorea, athetosis, ballism, or a combination —
  occurring without loss of consciousness and, in the classic primary forms, against a
  completely normal interictal neurological examination. Because attacks are brief,
  stereotyped, and almost never witnessed in clinic, the disorders were historically
  dismissed as psychogenic or misdiagnosed as epilepsy; they are now understood as
  disorders of neuronal membrane excitability, synaptic-vesicle trafficking, and cerebral
  energy supply.

  The organising axis of the group is trigger to gene to treatment, and getting that
  mapping right is what makes the diagnosis actionable. Paroxysmal kinesigenic
  dyskinesia (PKD) is triggered by sudden voluntary movement, is caused mainly by
  loss-of-function variants in PRRT2 (with TMEM151A as a second locus), produces brief
  (under one minute) but often many-times-daily attacks, and is exquisitely responsive to
  low-dose carbamazepine or oxcarbazepine. Paroxysmal non-kinesigenic dyskinesia (PNKD)
  is triggered by alcohol, caffeine, emotional stress and fatigue, is caused by
  N-terminal variants in PNKD (MR-1), produces longer (minutes to hours) but far less
  frequent attacks, and responds poorly to drugs so that trigger avoidance is the
  mainstay. Paroxysmal exercise-induced dyskinesia (PED) is triggered by sustained
  exertion (and sometimes fasting), is most importantly caused by SLC2A1/GLUT1
  deficiency, and is ketogenic-diet-responsive — this is the treatable cause that must
  not be missed, and it is flagged biochemically by hypoglycorrhachia with a low
  CSF:blood glucose ratio. ADCY5 (characteristically with nocturnal exacerbation and
  perioral/facial involvement) and KCNMA1 (BK-channel gain of function, with absence
  epilepsy) broaden the genetic spectrum, and secondary/acquired paroxysmal dyskinesia
  follows multiple sclerosis, hypoparathyroidism, perinatal injury, transient ischaemia
  and other structural or metabolic insults.

  The historical fourth category, paroxysmal hypnogenic dyskinesia (PHD), is largely
  reclassified: most sleep-related dyskinetic attacks are now recognised as
  sleep-related hypermotor epilepsy (SHE, formerly nocturnal frontal lobe epilepsy),
  a focal epilepsy syndrome with genetic and structural causes. This entry models that
  reclassification explicitly rather than curating PHD as a dyskinesia (see the
  discussions block).
synonyms:
- Paroxysmal dyskinesias
- PxD
- Paroxysmal movement disorder
- Paroxysmal choreoathetosis
- Paroxysmal dystonic choreoathetosis
- Episodic dyskinesia

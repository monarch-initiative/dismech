pathophysiology:
- name: PRRT2 and TMEM151A Loss of Function
  description: >-
    Heterozygous truncating variants in PRRT2 (the recurrent c.649dupC frameshift
    accounts for the majority of carriers) yield no stable protein, producing a
    haploinsufficient state at the presynaptic terminal. TMEM151A truncating and
    missense variants behave similarly, with patient transcript evidence supporting
    loss of function; TMEM151A accounts for a share of PRRT2-negative PKD. This is the
    molecular initiating lesion of the kinesigenic subtype.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: PRRT2
    term:
      id: hgnc:30500
      label: PRRT2
  - preferred_term: TMEM151A
    term:
      id: hgnc:28497
      label: TMEM151A

  evidence:
  - reference: PMID:38091244
    reference_title: "Paroxysmal Kinesigenic Dyskinesia: Genetics and Pathophysiological Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, the cerebellum is regarded as the key pathogenic area. Spreading
      depolarization in the cerebellum is tightly associated with dyskinetic episodes.
    explanation: >-
      Identifies cerebellar spreading depolarization as the proximate circuit event
      linking the PRRT2 synaptic/channel lesion to a discrete attack.
- name: PNKD (MR-1) Dysfunction and Impaired Methylglyoxal Detoxification
  description: >-
    The recurrent p.Ala7Val and p.Ala9Val variants alter the N-terminal alpha helix of
    the brain-specific long isoform of PNKD (myofibrillogenesis regulator 1, MR-1),
    which is membrane-localised and homologous to hydroxyacylglutathione hydrolase. The
    homologous enzyme detoxifies methylglyoxal, a reactive dicarbonyl present in coffee
    and alcoholic drinks and generated as a by-product of oxidative stress — which
    supplies a direct chemical rationale for why exactly those exposures, plus stress
    and fatigue, precipitate PNKD attacks. Note this remains an inference from sequence
    homology plus trigger pharmacology; direct enzymatic proof in human neurons is not
    established.
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: PROVISIONAL
  genes:
  - preferred_term: PNKD
    term:
      id: hgnc:9153
      label: PNKD
  biological_processes:

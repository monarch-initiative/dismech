- name: ADCY5 Striatal cAMP Signalling Gain of Function
  description: >-
    Gain-of-function variants in ADCY5, the adenylate cyclase isoform enriched in
    striatal medium spiny neurons, raise cAMP production downstream of dopamine and
    adenosine receptors and produce a mixed hyperkinetic disorder — dystonia, chorea and
    myoclonus with characteristic facial/perioral involvement — that fluctuates and
    worsens paroxysmally, notably at night. Recurrent variants at residues 418 and 726
    dominate, and somatic mosaicism attenuates severity. Because ADCY5 attacks may be
    kinesigenic, exercise-induced, non-kinesigenic or nocturnal within one gene, ADCY5 is
    the clearest single-gene demonstration that trigger-based classification does not map
    one-to-one onto genotype.

  status: UNKNOWN
  description: >-
    Korean prospective observational registry following adults with paroxysmal kinesigenic
    choreoathetosis to establish long-term prognosis (remission, degree of improvement,
    worsening, and medication requirement). Relevant because the natural history of PKD
    into adulthood — the reported decline in attack frequency in the third decade — rests
    almost entirely on retrospective series.
  target_phenotypes:
  - preferred_term: Paroxysmal dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  evidence:
  - reference: clinicaltrials:NCT04023656
    reference_title: "Prognosis of Paroxysmal Kinesigenic Choreoathetosis in Korea: a Prospective, Observational Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this study is to assess the prognosis of paroxysmal kinesigenic
      choreoathetosis (PKC) in Korean.
    explanation: >-
      Confirms the registry's prognostic objective in PKD.
- name: NCT06701851
  status: RECRUITING
  description: >-
    French mechanistic imaging study (ancillary to AMEDYST) using real-time functional
    imaging in PRRT2 patients who can voluntarily provoke and control their attacks, to
    test the striatum-cerebellum reciprocal-influence model of the attack. Directly
    interrogates the cerebellar-origin hypothesis recorded in this entry's
    mechanistic_hypotheses block. It is mechanistic, not therapeutic.
  target_phenotypes:
  - preferred_term: Paroxysmal dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  evidence:
  - reference: clinicaltrials:NCT06701851
    reference_title: "Corrélats Neuronaux Des Accès de Mouvements Anormaux Paroxystiques Liées Aux Dyskinésies Paroxystiques kinésigéniques Secondaires à Une Mutation du Gene PRRT2 - Recherche Ancillaire de L'étude AMEDYST \" Dont Vous êtes l'Investigateur Principal"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the pathological role of the reciprocal influence between the striatum and the
      cerebellum in paroxysmal dyskinesia episodes
    explanation: >-
      States the striatum-cerebellum question that this trial is designed to resolve,
      which is the open question recorded in mechanistic_hypotheses.
mechanistic_hypotheses:
- hypothesis_group_id: cerebellar_origin_of_pkd
  hypothesis_label: Cerebellar rather than basal-ganglia origin of the PKD attack
  status: EMERGING
  description: >-
    The traditional assumption that paroxysmal dyskinesia is a basal-ganglia disorder is
    under revision for PKD specifically. Work in PRRT2-deficient models points to the
    cerebellum as the pivotal generator, with dyskinetic episodes tightly coupled to
    spreading depolarization in cerebellar cortex, while the contribution of cortex,
    thalamus and striatum is comparatively unresolved. The competing and complementary
    view remains that the basal-ganglia-thalamo-cortical loop generates the motor output.
    This matters practically because it predicts different neuromodulation targets.
  applies_to_subtypes:
  - PKD
  evidence:
  - reference: PMID:38091244
    reference_title: "Paroxysmal Kinesigenic Dyskinesia: Genetics and Pathophysiological Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Whereas, in PKD, other than the cerebellum, the role of the cerebrum including the
      cortex and thalamus needs to be further investigated.
    explanation: >-
      States both the cerebellar-primacy position and the explicit acknowledgement that
      the cerebral contribution is unresolved.
discussions:
- discussion_id: phd_nosology
  kind: CONTROVERSY
  prompt: >-
    Is paroxysmal hypnogenic dyskinesia (PHD) a genuine fourth subtype of paroxysmal
    dyskinesia, or is it entirely subsumed by sleep-related hypermotor epilepsy?
  status: OPEN
  attaches_to:
  - "pathophysiology#Trigger-Dependent Breach of the Motor Network Attack Threshold"
  rationale: >-
    The dominant position, formalised by the 2016 consensus that renamed nocturnal frontal
    lobe epilepsy as sleep-related hypermotor epilepsy, is that sleep-related dyskinetic
    attacks are epileptic seizures with hypermotor semiology. This entry follows that
    position and does not curate PHD as a mechanistically distinct dyskinesia. However, a
    2016 screening study of 11 PHD patients found PRRT2 variants in 2 patients with
    typical (short-attack) PHD and no variants in any of the epilepsy genes screened, and
    its authors concluded the opposite — that PHD is a subtype of paroxysmal dyskinesia
    rather than NFLE. The honest reading is that the PHD label historically pooled two
    populations: a majority with genetic focal epilepsy and a minority with short-attack
    PRRT2-related dyskinesia occurring in sleep. Video-EEG is the discriminator, and the
    label itself should be retired in favour of the specific diagnosis.
  proposed_experiments:
  - experiment_id: phd_video_eeg_genotype_cohort
    name: Prospective video-EEG plus broad panel sequencing in sleep-related paroxysmal motor attacks
    description: >-
      Recruit an unselected cohort of patients with sleep-related paroxysmal motor
      attacks, obtain video-EEG on all, and sequence PRRT2, TMEM151A, CHRNA4, CHRNB2,
      CHRNA2, KCNT1 and DEPDC5. Report the proportion with an ictal epileptiform
      correlate, stratified by genotype and by attack duration.
    decision_criterion: >-
      If PRRT2-positive sleep-related cases consistently lack an ictal epileptiform
      correlate, a residual non-epileptic PHD population is supported; if they show one,
      PHD is fully subsumed by SHE.
  - experiment_id: phd_prrt2_treatment_profile
    name: Treatment-response and semiology profiling of PRRT2-positive sleep-related attacks
    description: >-
      Determine whether PRRT2-positive sleep-related cases show the
      carbamazepine-responsive, aura-preceded, short-attack profile of waking PKD or the
      clustered hypermotor profile of SHE.
  evidence:
  - reference: PMID:27123484
    reference_title: "Paroxysmal hypnogenic dyskinesia is associated with mutations in the PRRT2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study identified PRRT2 mutations in PHD, extending the phenotypic
      spectrum of PRRT2 and supporting the classification of PHD as a subtype of paroxysmal
      dyskinesia but not NFLE.
    explanation: >-
      The minority position, with direct genetic evidence, that must be represented rather
      than suppressed.
  - reference: PMID:27164717
    reference_title: "Definition and diagnostic criteria of sleep-related hypermotor epilepsy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was recommended that the name be changed to sleep-related hypermotor epilepsy
      (SHE), reflecting evidence that the attacks are associated with sleep rather than
      time of day, the seizures may arise from extrafrontal sites, and the motor aspects of
      the seizures are characteristic.
    explanation: >-
      The consensus position that sleep-related hypermotor attacks are epileptic; recorded
      as REFUTE with respect to the proposition that PHD is a distinct dyskinesia.
- discussion_id: pnkd_imsn_human_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the striatal indirect-pathway (iMSN) hypoactivity that causes dyskinetic attacks
    in PNKD mice actually occur in human PNKD?
  status: OPEN
  attaches_to:
  - "pathophysiology#Striatal Indirect-Pathway Medium Spiny Neuron Hypoactivity"
  rationale: >-
    The iMSN mechanism is unusually strong causal evidence — optically identified
    single-unit recordings during spontaneous attacks, chemogenetic sufficiency, and an
    identified endocannabinoid synaptic substrate — but all of it is mouse. It also runs
    against the classical model in which dyskinesia arises from direct-pathway
    hyperactivity, so it is not simply a confirmation of expectation. There is no human
    biomarker, imaging correlate or post-mortem finding that indexes iMSN firing in PNKD
    patients, and no human tissue or iPSC-derived striatal system has tested it. Until
    that gap is closed the node should be read as a well-supported model-organism
    mechanism whose translational validity is untested, not as established human
    pathophysiology.
  proposed_experiments:
  - experiment_id: pnkd_cb1_pharmacology_trial
    name: Endocannabinoid-system pharmacology in human PNKD
    description: >-
      Test whether CB1-directed pharmacology modifies attack frequency in patients with
      genetically confirmed PNKD, as the mouse endocannabinoid mechanism predicts.
    decision_criterion: >-
      A reduction in attack frequency with CB1 antagonism would be the first human
      evidence that the mouse endocannabinoid-iMSN mechanism operates in patients.
  - experiment_id: pnkd_ipsc_striatal_model
    name: Patient-derived iPSC striatal system carrying PNKD p.Ala7Val or p.Ala9Val
    description: >-
      Build iPSC-derived striatal organoid or corticostriatal co-culture systems from
      PNKD patients and assay endocannabinoid-dependent suppression of glutamatergic
      input onto D2 or indirect-pathway neurons.
  - experiment_id: pnkd_attack_locked_imaging
    name: Attack-locked functional imaging in PNKD patients
    description: >-
      Use task-based or attack-locked functional imaging in PNKD patients to seek an
      indirect-pathway signature during provoked attacks.
  evidence:
  - reference: PMID:35165171
    reference_title: "Striatal Indirect Pathway Dysfunction Underlies Motor Deficits in a Mouse Model of Paroxysmal Dyskinesia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data show that striatal iMSN dysfunction contributes to the etiology of
      dyskinesia in PNKD, and suggest that indirect pathway hypoactivity may be a key
      mechanism for the generation of involuntary movements in other disorders.
    explanation: >-
      The mouse claim whose human validity is the open question. The authors themselves
      frame the generalisation as a suggestion.
- discussion_id: trigger_genotype_mapping_breakdown
  kind: OPEN_QUESTION
  prompt: >-
    How far can the trigger-based classification (PKD, PNKD, PED) still be trusted as a
    guide to genotype and therefore to treatment?
  status: OPEN
  attaches_to:
  - "pathophysiology#Trigger-Dependent Breach of the Motor Network Attack Threshold"
  rationale: >-
    The trigger-to-gene-to-treatment mapping is the practical value of this entry, and it
    is under strain. SLC2A1 variants have been found in patients phenotyped as PKD and as
    PNKD, not only PED; PRRT2 variants appear in hemiplegic migraine and episodic ataxia;
    ADCY5 alone can produce kinesigenic, exertional, non-kinesigenic and nocturnal attacks.
    Whether the correct response is to keep trigger-based syndromes as a first-pass
    heuristic that gates a broad panel, or to move to genotype-first testing in all cases,
    is unresolved and has direct cost-effectiveness consequences.
  evidence:
  - reference: PMID:26598494
    reference_title: "The clinical and genetic heterogeneity of paroxysmal dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC2A1 mutations were associated with variable phenotypes including paroxysmal
      kinesigenic dyskinesia, paroxysmal non-kinesigenic dyskinesia, episodic ataxia and
      myotonia
    explanation: >-
      Direct demonstration that one gene crosses all three trigger-defined syndromes,
      undermining a strict one-syndrome-one-gene mapping.
  - reference: PMID:30242089
    reference_title: "Unravelling of the paroxysmal dyskinesias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classically, PxD have been categorised according to their triggers and duration of
      the attacks, but increasing evidence suggests that there is a certain degree of
      clinical and genetic overlap and challenges the concept that one phenotype is
      attributable to one single aetiology.
    explanation: >-
      States the challenge to trigger-based nosology explicitly.
- discussion_id: diagnostic_delay
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the actual magnitude of diagnostic delay in paroxysmal dyskinesia, and how much
    of it is attributable to misdiagnosis as epilepsy, tics, or a functional disorder?
  status: OPEN
  attaches_to:
  - "pathophysiology#Trigger-Dependent Breach of the Motor Network Attack Threshold"
  rationale: >-
    Diagnostic delay in this group is repeatedly described qualitatively — PKD is often
    misdiagnosed clinically as epilepsy, individual patients carry Tourette or functional
    labels for years, and GLUT1 deficiency may be missed entirely despite being
    diet-responsive — but no cohort study quantifies the interval from first attack to
    correct diagnosis, its distribution across PKD, PNKD and PED, or the proportion of
    that interval attributable to each incorrect label. The gap matters because the delay
    is the principal preventable harm in an otherwise treatable and non-progressive group
    of disorders, and because a quantified delay is what would justify including
    paroxysmal dyskinesia in movement-disorder and epilepsy diagnostic pathways.
  proposed_experiments:
  - experiment_id: pxd_diagnostic_delay_cohort
    name: Multi-centre retrospective diagnostic-delay cohort
    description: >-
      Measure time from first attack to molecular or clinical diagnosis, stratified by
      subtype and by whether the patient first presented to epilepsy, movement-disorder,
      paediatric or psychiatric services, and record every incorrect label applied in the
      interval.
  - experiment_id: glut1_delayed_keto_outcome
    name: Outcome consequences of delayed ketogenic therapy in GLUT1-related PED
    description: >-
      Quantify the subset of GLUT1-related PED in which ketogenic therapy was started more
      than five years after symptom onset, and test whether delay correlates with residual
      cognitive or motor outcome.
  evidence:
  - reference: PMID:22101681
    reference_title: "Exome sequencing identifies truncating mutations in PRRT2 that cause paroxysmal kinesigenic dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paroxysmal kinesigenic dyskinesia is the most common type of paroxysmal movement
      disorder and is often misdiagnosed clinically as epilepsy.
    explanation: >-
      Establishes that misdiagnosis is common, which is precisely the qualitative statement
      that has never been quantified.
animal_models:
- species: Mus musculus
  genotype: PNKD transgenic (mutant PNKD/MR-1)
  description: >-
    Transgenic mouse expressing the mutant PNKD/MR-1 protein. Attacks resembling human
    PNKD are provoked by caffeine and alcohol — the same triggers as in patients — which
    makes it an unusually faithful trigger-level model and the system in which the
    indirect-pathway mechanism was established.
  genes:
  - preferred_term: PNKD
    term:
      id: hgnc:9153
      label: PNKD
  evidence:
  - reference: PMID:35165171
    reference_title: "Striatal Indirect Pathway Dysfunction Underlies Motor Deficits in a Mouse Model of Paroxysmal Dyskinesia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this model, as in the human disorder PNKD, animals experience dyskinetic attacks
      in response to caffeine or alcohol.
    explanation: >-
      Documents trigger-level face validity of the PNKD mouse.
- species: Mus musculus
  genotype: Kcnma1 D434G knock-in (BK-D434G)
  description: >-
    Knock-in mouse carrying the human KCNMA1 p.Asp434Gly gain-of-function allele. It
    reproduces both arms of the human PNKD3 phenotype (absence epilepsy and dyskinesia),
    shows cortical pyramidal and Purkinje cell hyperexcitability, and responds to the BK
    blocker paxilline, providing pharmacological confirmation of the direction of effect.
  genes:
  - preferred_term: KCNMA1
    term:
      id: hgnc:6284
      label: KCNMA1
  evidence:
  - reference: PMID:35286197
    reference_title: "Neuronal mechanism of a BK channelopathy in absence epilepsy and dyskinesia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The BK-D434G mice manifest the clinical features of absence epilepsy and exhibit
      severe motor deficits and dyskinesia-like behaviors.
    explanation: >-
      Establishes construct and face validity of the KCNMA1 gain-of-function model.

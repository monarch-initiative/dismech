inheritance:
- name: Autosomal dominant with incomplete, phenotype-dependent penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  penetrance_percentage: "61"
  expressivity: VARIABLE
  description: >-
    The primary paroxysmal dyskinesias are predominantly autosomal dominant (PRRT2,
    TMEM151A, PNKD, SLC2A1, KCNMA1, ADCY5). Reported penetrance depends critically on
    which phenotype is counted: for PRRT2 it is about 61% when only PKD is scored but
    nearly complete when infantile convulsions are also counted. Expressivity is highly
    variable within a single kindred — the same PRRT2 allele may produce isolated
    infantile seizures, isolated kinesigenic dyskinesia, both sequentially (ICCA),
    hemiplegic migraine, episodic ataxia, or nothing at all. Autosomal recessive and de
    novo mechanisms occur, particularly for SLC2A1 (frequently de novo), biallelic
    PRRT2, and the metabolic PED mimics.
  evidence:
  - reference: PMID:22875091
    reference_title: "PRRT2 phenotypes and penetrance of paroxysmal kinesigenic dyskinesia and infantile convulsions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The estimated penetrance of PRRT2 mutations was 61%, if only the PKD phenotype was
      considered; however, if infantile convulsions were also taken into account, the
      penetrance was nearly complete.
    explanation: >-
      Direct source for the penetrance figure and for the observation that it is
      phenotype-definition dependent.

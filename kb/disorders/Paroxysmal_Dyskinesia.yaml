  - target: Trigger-Dependent Breach of the Motor Network Attack Threshold
    causal_link_type: DIRECT
  - target: Migraine
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Shared cortical and brainstem hyperexcitability with increased susceptibility to cortical spreading depolarization
  evidence:
  - reference: PMID:27052163
    reference_title: "PRRT2 Is a Key Component of the Ca(2+)-Dependent Neurotransmitter Release Machinery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PRRT2-silenced neurons exhibit a severe impairment of synchronous release,
      attributable to a sharp decrease in release probability and Ca(2+) sensitivity and
      associated with a marked increase of the asynchronous/synchronous release ratio.
      PRRT2 interacts with the synaptic proteins SNAP-25 and synaptotagmin 1/2.
    explanation: >-
      Directly demonstrates the presynaptic release defect and the SNARE/synaptotagmin
      interaction that make PKD a synaptopathy.
  - reference: PMID:38091244
    reference_title: "Paroxysmal Kinesigenic Dyskinesia: Genetics and Pathophysiological Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Based on abnormal ion channels and disturbed synaptic transmission in the absence
      of PRRT2, PKD may be channelopathy or synaptopathy, or both.
    explanation: >-
      Supports the dual channelopathy/synaptopathy framing of this node and justifies its
      conformance to the epilepsy excitation-inhibition module's ion-channel-and-synaptic
      dysfunction trigger.
  notes: >-
    Conformance rationale: this node declares
    epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
    because the PRRT2 lesion is literally an ion-channel-plus-synaptic-protein
    abnormality and because the very same PRRT2 alleles cause benign familial infantile
    epilepsy, so the excitation/inhibition-imbalance chain is not a metaphor here. The
    SLC2A1/GLUT1 arm of this entry deliberately does NOT declare module conformance: its
    lesion is a metabolic substrate-supply failure, not a primary channel or synaptic
    defect, even though epilepsy is a downstream consequence.
- name: Cerebellar Spreading Depolarization and Circuit Instability
  description: >-
    In PRRT2-deficient models the cerebellum, rather than the basal ganglia, emerges as
    the pivotal generator: granule-cell to Purkinje-cell circuits are hyperexcitable and
    dyskinetic episodes are tightly coupled to episodes of spreading depolarization in
    cerebellar cortex, which transiently disrupts cerebellar output to the deep nuclei
    and thalamus. The role of cortex and thalamus in PKD remains less well defined.
  biological_scale: TISSUE
  role: amplifier

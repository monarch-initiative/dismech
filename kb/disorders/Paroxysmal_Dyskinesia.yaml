has_subtypes:
- name: PKD
  display_name: Paroxysmal kinesigenic dyskinesia (PRRT2, TMEM151A)
  subtype_term:
    preferred_term: episodic kinesigenic dyskinesia
    term:
      id: MONDO:0044202
      label: episodic kinesigenic dyskinesia
  description: >-
    The commonest paroxysmal dyskinesia. Attacks of dystonia and/or choreoathetosis are
    triggered by sudden voluntary movement (rising from a chair, starting to walk,
    startle), typically last under one minute, and may occur many times a day, often
    preceded by a sensory aura in the affected limb. Onset is in childhood or early
    adolescence with a 2-4:1 male excess, and attacks usually decline in the third
    decade. Most cases carry heterozygous loss-of-function PRRT2 variants (recurrent
    c.649dupC); TMEM151A is a second locus in PRRT2-negative cases. Low-dose
    carbamazepine or oxcarbazepine is dramatically effective.
  genes:
  - preferred_term: PRRT2
    term:
      id: hgnc:30500
      label: PRRT2
  - preferred_term: TMEM151A
    term:
      id: hgnc:28497
      label: TMEM151A
  evidence:
  - reference: PMID:38091244
    reference_title: "Paroxysmal Kinesigenic Dyskinesia: Genetics and Pathophysiological Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Paroxysmal kinesigenic dyskinesia (PKD), the most common type of paroxysmal
      movement disorder, is characterized by sudden and brief attacks of choreoathetosis
      or dystonia triggered by sudden voluntary movements. PKD is mainly caused by
      mutations in the PRRT2 or TMEM151A gene.
    explanation: >-
      Defines the PKD subtype by its kinesigenic trigger and brief attack duration and
      names PRRT2 and TMEM151A as the two causative loci.
- name: PNKD
  display_name: Paroxysmal non-kinesigenic dyskinesia (PNKD/MR-1)
  subtype_term:
    preferred_term: paroxysmal nonkinesigenic dyskinesia
    term:
      id: MONDO:0700088
      label: paroxysmal nonkinesigenic dyskinesia
  description: >-
    Attacks of dystonia and choreoathetosis that arise spontaneously at rest or are
    precipitated by alcohol, coffee or tea, emotional stress, excitement and fatigue,
    but never by sudden movement. Attacks are much longer than in PKD (typically tens
    of minutes to hours) and correspondingly less frequent, sometimes only a few per
    year. Classic autosomal dominant PNKD is caused by the recurrent N-terminal
    p.Ala7Val and p.Ala9Val variants in PNKD (myofibrillogenesis regulator 1, MR-1).
    Pharmacological response is unreliable, so trigger avoidance is the mainstay.
  genes:
  - preferred_term: PNKD
    term:
      id: hgnc:9153
      label: PNKD
  evidence:
  - reference: PMID:15496428
    reference_title: "The gene for paroxysmal non-kinesigenic dyskinesia encodes an enzyme in a stress response pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paroxysmal non-kinesigenic dyskinesia (PNKD) is characterized by spontaneous
      hyperkinetic attacks that are precipitated by alcohol, coffee, stress and fatigue.
    explanation: >-
      Establishes the defining non-kinesigenic trigger profile that separates PNKD from
      PKD.
- name: PED
  display_name: Paroxysmal exercise-induced dyskinesia (SLC2A1/GLUT1 deficiency)
  subtype_term:
    preferred_term: childhood onset GLUT1 deficiency syndrome 2
    term:
      id: MONDO:0012805
      label: childhood onset GLUT1 deficiency syndrome 2
  description: >-
    Attacks of leg-predominant dystonia and choreoathetosis provoked by prolonged
    exertion (and sometimes by fasting), relieved by rest or carbohydrate. The critical
    genotype is heterozygous SLC2A1 loss of function causing GLUT1 deficiency, which
    frequently co-segregates with generalised epilepsy. This is the treatable cause of
    paroxysmal dyskinesia: the ketogenic diet supplies ketone bodies that bypass the
    defective blood-brain-barrier glucose transporter. The biochemical clue is
    hypoglycorrhachia with a reduced CSF:blood glucose ratio in a normoglycaemic
    patient. The broader SLC2A1 phenotype is curated in GLUT1_Deficiency_Syndrome;
    only the paroxysmal-dyskinesia presentation is modelled here.
  genes:
  - preferred_term: SLC2A1
    term:
      id: hgnc:11005
      label: SLC2A1
  evidence:
  - reference: PMID:18577546
    reference_title: "Paroxysmal exercise-induced dyskinesia and epilepsy is due to mutations in SLC2A1, encoding the glucose transporter GLUT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, co-occurring PED and epilepsy can be due to autosomal dominant
      heterozygous SLC2A1 mutations, expanding the phenotypic spectrum associated with
      GLUT1 deficiency and providing a potential new treatment option for this clinical
      syndrome.
    explanation: >-
      Establishes SLC2A1/GLUT1 deficiency as the molecular cause of the PED subtype and
      flags its treatability.
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When first diagnosed in later childhood to adulthood (occasionally in a parent
      following the diagnosis of an affected child), the predominant clinical findings of
      Glut1DS are usually complex paroxysmal movement disorders, spasticity, ataxia,
      dystonia, speech difficulty, and intellectual disability.
    explanation: >-
      GeneReviews confirms that later-presenting GLUT1 deficiency is dominated by
      paroxysmal movement disorder, which is the presentation modelled in this entry.
- name: PNKD3
  display_name: Generalized epilepsy with paroxysmal dyskinesia (KCNMA1, PNKD3)

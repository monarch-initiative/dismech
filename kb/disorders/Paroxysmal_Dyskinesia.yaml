  description: >-
    Autosomal dominant co-occurrence of paroxysmal dyskinesia and generalised (usually
    absence) epilepsy in the same individual or family, caused by gain-of-function
    variants in KCNMA1 encoding the BK calcium-activated potassium channel alpha
    subunit (p.Asp434Gly is the index allele). This subtype makes the movement-disorder
    and epilepsy continuum explicit at the level of a single channel.

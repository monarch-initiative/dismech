- name: Exertion- and Fasting-Unmasked Corticostriatal Energy Failure
  description: >-
    A partially reduced glucose-transport reserve is sufficient at rest but becomes
    limiting when cerebral demand rises with sustained exertion or when substrate supply
    falls with fasting. Functional imaging in SLC2A1-related PED implicates altered
    glucose metabolism specifically in the corticostriate pathways (and in frontal
    cortex for the accompanying seizures), giving an energetic rather than a
    channel-based explanation for why the trigger is prolonged exercise and why rest or
    carbohydrate terminates the attack. This is the node the ketogenic diet targets, by
    supplying ketone bodies as a GLUT1-independent fuel.

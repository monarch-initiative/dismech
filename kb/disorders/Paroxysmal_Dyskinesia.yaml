notes: >-
  Related dismech entries that this entry deliberately cross-references rather than
  duplicates: GLUT1_Deficiency_Syndrome (the full SLC2A1 phenotype including the
  classic infantile encephalopathy; PED/GLUT1DS2 is modelled here only as the
  paroxysmal-dyskinesia presentation), Benign_Familial_Infantile_Epilepsy (the
  PRRT2 seizure arm of the same allelic spectrum),
  Familial_Sleep_Related_Hypermotor_Epilepsy and DEPDC5-Related_Epilepsy (the
  entities that absorbed most of historical paroxysmal hypnogenic dyskinesia),
  Episodic_Ataxia (the cerebellar paroxysmal channelopathies that are the closest
  differential), and Dopa_Responsive_Dystonia / Myoclonus_Dystonia_Syndrome
  (non-paroxysmal genetic dystonias in the differential).

  Two deliberate modelling decisions. (1) Paroxysmal hypnogenic dyskinesia (PHD) is NOT
  listed as a subtype: this entry's position is that PHD is largely subsumed by
  sleep-related hypermotor epilepsy, so listing it under has_subtypes would assert the
  membership the entry argues against. It is instead handled as a differential diagnosis
  plus an explicit CONTROVERSY discussion that records the dissenting PRRT2-PHD evidence.
  (2) The ICCA subtype here overlaps deliberately with the ICCA subtype of
  Benign_Familial_Infantile_Epilepsy (same MONDO:0011178). ICCA is by definition the
  bridge between the two phenotypes of one PRRT2 allele, so it is visible from both
  sides; the epilepsy entry models the seizure arm, this entry models the dyskinesia arm
  and the age-dependent shift between them. Neither entry owns it exclusively.

  Scope caveat on classifications: the neurological-channelopathy classification is
  accurate for the PRRT2 and KCNMA1 arms but not for the PNKD (stress-response enzyme),
  SLC2A1 (transportopathy) or ADCY5 (cAMP signalling) arms. It is recorded because the
  channelopathy framing dominates the umbrella literature, not because it covers every
  member.

  Trigger-direction caveat: caffeine is a PNKD precipitant but has been reported to
  paradoxically REDUCE dyskinesia in ADCY5-related disease (a proposed adenosine A2A
  effect). The environmental EXACERBATES entry below therefore applies to PNKD, not
  universally across the group.

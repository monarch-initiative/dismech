- name: KCNMA1 BK-Channel Gain of Function
  description: >-
    Gain-of-function variants in KCNMA1 (p.Asp434Gly, p.Asn999Ser) increase
    calcium-activated BK potassium current, accelerating action-potential repolarisation
    and thereby permitting faster repetitive firing. In the D434G knock-in mouse this
    produces hyperexcitability of cortical pyramidal neurons and cerebellar Purkinje
    cells, and the animals recapitulate the human combination of absence epilepsy with
    dyskinesia; BK blockade with paxilline reverses both. Variant direction of effect,
    not merely the gene name, determines the mechanism: in heterologous cells p.Asn999Ser
    and p.Asp434Gly are gain-of-function while p.His444Gln is loss-of-function.

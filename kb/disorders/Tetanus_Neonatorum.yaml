name: Tetanus neonatorum
creation_date: "2026-09-30T04:09:01Z"
description: >-
  Tetanus neonatorum is neonatal tetanus caused by Clostridium tetani spore
  contamination of the umbilical stump during delivery or cord care, followed by
  germination in devitalized umbilical tissue, local tetanus-neurotoxin
  secretion, peripheral motor-neuron uptake, retrograde trafficking into the
  spinal cord and brainstem, SNARE disruption in inhibitory interneurons, and
  neonatal spastic paralysis.
category: Infectious Disease
disease_term:
  preferred_term: tetanus neonatorum
  term:
    id: MONDO:0001737
    label: tetanus neonatorum
parents:
- Tetanus
synonyms:
- neonatal tetanus
- newborn tetanus
notes: >-
  The Falcon deep-research request fell back to OpenScientist and then hung
  without creating an artifact; this entry was curated from the general tetanus
  parent plus neonatal tetanus and umbilical-cord-care references. The canonical
  tetanospasmin transport and SNARE-cleavage mechanisms are shared with tetanus,
  while this child is scoped to the neonatal umbilical-stump acquisition route
  and to prevention by maternal antitoxin transfer and safe cord care.
infectious_agent:
- name: Clostridium tetani
  infectious_agent_term:
    preferred_term: Clostridium tetani
    term:
      id: NCBITaxon:1513
      label: Clostridium tetani
  description: >-
    Clostridium tetani is the anaerobic, spore-forming bacterium that can
    contaminate neonatal umbilical tissue and produce tetanus neurotoxin.
  evidence:
  - reference: PMID:9822366
    reference_title: Neonatal tetanus--Montana, 1998.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonatal tetanus (NT) is a severe, often fatal disease caused by a toxin
      of Clostridium tetani, a ubiquitous spore-forming bacterium found in high
      concentrations in soil and animal excrements.
    explanation: >-
      Identifies the causative organism and spore-forming environmental source
      for neonatal tetanus.
agent_life_cycle:
  description: >-
    C. tetani persists in soil, animal feces, and contaminated material as
    dormant spores; neonatal disease occurs when spores are introduced onto the
    devitalized umbilical stump and encounter a damaged niche permissive for
    germination and toxin production.
  hosts:
  - preferred_term: Homo sapiens
    role: neonatal clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:9822366
    reference_title: Neonatal tetanus--Montana, 1998.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonatal tetanus (NT) is a severe, often fatal disease caused by a toxin
      of Clostridium tetani, a ubiquitous spore-forming bacterium found in high
      concentrations in soil and animal excrements.
    explanation: >-
      Supports C. tetani spores from soil or animal excrement as the
      environmental inoculum that can contaminate the neonatal cord.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Contaminated neonatal umbilical stump
  description: >-
    Neonates acquire tetanus when C. tetani spores contaminate the cut umbilical
    cord or umbilical stump during nonsterile delivery or cord-care practices,
    especially when transplacentally acquired maternal antitoxin is absent.
  evidence:
  - reference: PMID:9822366
    reference_title: Neonatal tetanus--Montana, 1998.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NT is associated with nonsterile delivery and umbilical cord-care
      practices for newborns of mothers with antitoxin levels insufficient to
      protect the newborn by transplacental transfer of maternal antibody.
    explanation: >-
      Directly links neonatal tetanus to nonsterile cord exposures plus lack of
      passive maternal antitoxin protection.
  - reference: PMID:9822366
    reference_title: Neonatal tetanus--Montana, 1998.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings indicated that tetanus in a newborn of an unvaccinated mother
      occurred after application of nonsterile clay to the umbilical cord.
    explanation: >-
      A US case investigation traced neonatal tetanus to contaminated material
      applied directly to the umbilical cord of an unprotected newborn.
pathophysiology:
- name: Umbilical Clostridium tetani Spore Contamination
  role: trigger
  description: >-
    Spores from nonsterile delivery or cord-care materials are introduced onto
    neonatal umbilical tissue after the cord is cut.
  biological_scale: ORGANISM
  downstream:
  - target: Devitalized Cord Germination
    causal_link_type: DIRECT
    description: >-
      Spores lodged in the damaged umbilical remnant encounter a nutrient-rich,
      devitalized bacterial growth niche.
  evidence:
  - reference: PMID:9822366
    reference_title: Neonatal tetanus--Montana, 1998.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NT is associated with nonsterile delivery and umbilical cord-care
      practices for newborns of mothers with antitoxin levels insufficient to
      protect the newborn by transplacental transfer of maternal antibody.
    explanation: >-
      Supports cord contamination during delivery or care as the neonatal entry
      event.
- name: Devitalized Cord Germination
  description: >-
    The cut umbilical cord is devitalized tissue that supports bacterial
    colonization; in this niche, contaminating C. tetani spores can germinate
    into vegetative bacilli.
  biological_scale: ORGANISM
  downstream:
  - target: Umbilical Tetanus-Neurotoxin Secretion
    causal_link_type: DIRECT
    description: >-
      Vegetative C. tetani secretes tetanus neurotoxin from the contaminated
      umbilical site.
  evidence:
  - reference: PMID:27573092
    reference_title: Umbilical Cord Care in the Newborn Infant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      After birth, the devitalized umbilical cord often proves to be an ideal
      substrate for bacterial growth and also provides direct access to the
      bloodstream of the neonate.
    explanation: >-
      Establishes the damaged cord as a bacterial growth substrate in newborns.
- name: Umbilical Tetanus-Neurotoxin Secretion
  description: >-
    Germinated C. tetani remains localized in the umbilical wound and secretes
    tetanus neurotoxin.
  biological_scale: ORGANISM
  downstream:
  - target: Neonatal Motor-Axon Toxin Uptake
    causal_link_type: DIRECT
    description: >-
      Secreted toxin reaches peripheral cholinergic terminals and binds neonatal
      motor axons.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once introduced, spores germinate, and bacilli secrete two key toxins:
      tetanolysin and TeNT.
    explanation: >-
      Places tetanus-neurotoxin secretion downstream of C. tetani spore
      germination.
- name: Neonatal Motor-Axon Toxin Uptake
  description: >-
    Tetanus neurotoxin binds peripheral motor neurons at the neuromuscular
    junction and enters retrograde endosomal carriers.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: Tetanospasmin Retrograde CNS Trafficking
    causal_link_type: DIRECT
    description: >-
      Internalized toxin traffics retrogradely from the umbilical infection site
      toward central motor circuits.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TeNT binds to peripheral motor neurons at the neuromuscular junction and
      undergoes retrograde axonal transport to the spinal cord and brainstem,
      similar to the rabies virus.
    explanation: >-
      Supports uptake into peripheral motor neurons and retrograde transport as
      the route toward the neonatal CNS.
- name: Tetanospasmin Retrograde CNS Trafficking
  description: >-
    Retrograde axonal transport delivers active tetanus toxin to the spinal cord
    and brainstem, where it can move trans-synaptically into inhibitory
    interneurons.
  biological_scale: CELLULAR
  downstream:
  - target: Inhibitory Interneuron SNARE Cleavage
    causal_link_type: DIRECT
    description: >-
      Tetanus toxin leaves motor neurons in the CNS and targets presynaptic
      GABAergic and glycinergic interneurons.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Within the CNS, TeNT targets presynaptic glycine- and GABA-ergic
      interneurons, cleaving its substrate, synaptobrevin-2
    explanation: >-
      Identifies the central inhibitory interneurons that are reached after
      retrograde transport.
- name: Inhibitory Interneuron SNARE Cleavage
  description: >-
    The tetanus light chain cleaves synaptobrevin-2, disrupts SNARE-dependent
    vesicle fusion, and prevents inhibitory GABA and glycine release onto motor
    neurons.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: interneuron
    term:
      id: CL:0000099
      label: interneuron
  biological_processes:
  - preferred_term: synaptic transmission, GABAergic
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
    modifier: DECREASED
  - preferred_term: synaptic transmission, glycinergic
    term:
      id: GO:0060012
      label: synaptic transmission, glycinergic
    modifier: DECREASED
  downstream:
  - target: Neonatal Spastic Paralysis
    causal_link_type: DIRECT
    description: >-
      Loss of inhibitory neurotransmission disinhibits neonatal motor neurons.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      disrupting the SNARE complex essential for neurotransmitter release.
    explanation: >-
      Supports SNARE disruption by tetanus toxin in its central target neurons.
- name: Neonatal Spastic Paralysis
  description: >-
    Disinhibited motor firing produces impaired suckling, trismus, rigidity,
    painful spasms, apnea, and generalized neonatal tetanus.
  biological_scale: ORGANISM
  downstream:
  - target: Poor suck
    causal_link_type: DIRECT
    description: >-
      Spastic neonatal oromotor dysfunction prevents effective breast feeding.
  - target: Trismus
    causal_link_type: DIRECT
    description: >-
      Masseter and jaw-muscle overactivity produces neonatal lock jaw.
  - target: Generalized Rigidity
    causal_link_type: DIRECT
    description: >-
      Unchecked motor firing produces diffuse sustained rigidity.
  - target: Reflex Muscle Spasms
    causal_link_type: DIRECT
    description: >-
      Loss of inhibitory motor control produces painful generalized spasms.
  - target: Apnea
    causal_link_type: DIRECT
    description: >-
      Brainstem and respiratory-muscle involvement can produce apneic episodes.
  - target: Respiratory Failure
    causal_link_type: DIRECT
    description: >-
      Laryngeal and respiratory-muscle spasms can obstruct the airway or arrest
      breathing.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The resultant failure of inhibitory neurotransmission leads to unchecked
      downstream motor activity, manifesting as muscle rigidity, spasms, and
      hyperreflexia.
    explanation: >-
      Links SNARE-mediated inhibitory failure to the spastic motor syndrome that
      defines neonatal tetanus.
progression:
- phase: First-month neonatal onset
  age_range: First 28 days of life
  notes: >-
    Tetanus neonatorum presents during the neonatal period after failures in
    maternal immunization, antenatal care, delivery hygiene, or cord care permit
    umbilical C. tetani inoculation and toxin-mediated neurologic disease.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neonatal tetanus arises in the first 28 days of life; it carries a poor
      prognosis, and each case reflects an avoidable cascade of failed care,
      encompassing incomplete maternal vaccination, weak antenatal health
      systems, and unclean perinatal practices.
    explanation: >-
      Supports neonatal timing and links first-month disease to failures in
      maternal vaccination and clean perinatal practice.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Neonatal tetanus is a frequently fatal newborn emergency driven by
    preventable umbilical inoculation in settings with inadequate maternal
    tetanus immunity and unsafe cord care; hospital series report nearly half or
    more than half of admitted newborns dying, and global elimination programs
    still estimated thousands of neonatal tetanus deaths in 2021.
  evidence:
  - reference: PMID:9783042
    reference_title: A review of 207 newborn with tetanus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ninety-seven (46.8%) of the 207 patients died.
    explanation: >-
      A 207-newborn hospital series documents high acute case fatality in
      neonatal tetanus.
  - reference: PMID:21240163
    reference_title: Risk factors, morbidity and mortality of neonatal tetanus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall mortality was found 52.9%.
    explanation: >-
      A Bangladesh hospital series independently documents very high neonatal
      tetanus mortality.
  - reference: PMID:39024183
    reference_title: >-
      Progress Toward Achieving and Sustaining Maternal and Neonatal Tetanus
      Elimination - Worldwide, 2000-2022.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Estimated neonatal tetanus deaths decreased 84%, from 46,898 in 2000 to
      7,719 in 2021, accounting for 2% and 0.3% of all-cause neonatal mortality,
      respectively (Figure 1).
    explanation: >-
      The MMWR MNTE update gives contemporary global mortality estimates and
      shows that neonatal tetanus deaths persist despite major elimination
      progress.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    Reported neonatal tetanus surveillance counts, not modeled incidence, fell
    from 17,935 cases in 2000 to 1,995 cases in 2021; underreporting is expected
    because most neonatal deaths occur in remote areas, so a denominator-based
    annual-incidence rate is not asserted here.
  evidence:
  - reference: PMID:39024183
    reference_title: >-
      Progress Toward Achieving and Sustaining Maternal and Neonatal Tetanus
      Elimination - Worldwide, 2000-2022.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Worldwide, reported neonatal tetanus cases decreased by 89%, from 17,935
      in 2000 to 1,995 in 2021.
    explanation: >-
      Supports the global annual reported-case count used as surveillance
      incidence rather than a point prevalence.
environmental:
- name: Nonsterile umbilical cord applications
  description: >-
    Application of clay, animal dung, ash, or other nonsterile traditional
    substances to the cut umbilical cord can inoculate the neonatal stump with
    C. tetani spores.
  disease_effect: TRIGGERS
  causal_role: RISK_FACTOR
  influences_mechanisms:
  - target: Umbilical Clostridium tetani Spore Contamination
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Nonsterile material applied directly to the umbilical cord can deliver
      environmental C. tetani spores into the devitalized stump.
  evidence:
  - reference: PMID:9822366
    reference_title: Neonatal tetanus--Montana, 1998.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings indicated that tetanus in a newborn of an unvaccinated mother
      occurred after application of nonsterile clay to the umbilical cord.
    explanation: >-
      A neonatal tetanus investigation traced the initiating exposure to clay
      applied directly to the umbilical cord.
phenotypes:
- name: Poor suck
  description: >-
    Neonatal tetanus commonly presents with inability to suck effectively after
    the toxin-mediated spastic syndrome begins.
  phenotype_term:
    preferred_term: Poor suck
    term:
      id: HP:0002033
      label: Poor suck
  evidence:
  - reference: PMID:9783042
    reference_title: A review of 207 newborn with tetanus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Failure to suck and twitching were the most frequent symptoms.
    explanation: >-
      A 207-newborn series identifies failure to suck as one of the most frequent
      neonatal tetanus symptoms.
- name: Trismus
  description: >-
    Jaw-muscle spasm produces lock jaw in neonatal tetanus.
  phenotype_term:
    preferred_term: Trismus
    term:
      id: HP:0000211
      label: Trismus
  evidence:
  - reference: PMID:21240163
    reference_title: Risk factors, morbidity and mortality of neonatal tetanus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The retrospective study identified that mortality due to neonatal tetanus
      was very high and the common morbidities were lock jaw, inability to suck,
      abdominal rigidity, convulsion, fever, irritability etc.
    explanation: >-
      The Bangladesh series lists lock jaw among common neonatal tetanus
      morbidities.
- name: Generalized Rigidity
  description: >-
    Diffuse sustained muscle contraction produces whole-body neonatal rigidity.
  phenotype_term:
    preferred_term: Rigidity
    term:
      id: HP:0002063
      label: Rigidity
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      C tetani releases a potent neurotoxin, causing muscle spasms, rigidity,
      and dysautonomia.
    explanation: >-
      Supports rigidity as a toxin-mediated manifestation shared by neonatal and
      later-onset tetanus.
- name: Reflex Muscle Spasms
  description: >-
    Toxin-mediated loss of inhibitory neurotransmission produces painful
    generalized spasms and twitching in neonatal tetanus.
  phenotype_term:
    preferred_term: Muscle spasm
    term:
      id: HP:0003394
      label: Muscle spasm
  evidence:
  - reference: PMID:9783042
    reference_title: A review of 207 newborn with tetanus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Failure to suck and twitching were the most frequent symptoms.
    explanation: >-
      The 207-newborn series records twitching as one of the most frequent
      neonatal tetanus symptoms.
- name: Apnea
  description: >-
    Severe neonatal tetanus can interrupt breathing through brainstem and
    respiratory-muscle spasm.
  phenotype_term:
    preferred_term: Apnea
    term:
      id: HP:0002104
      label: Apnea
  evidence:
  - reference: PMID:9783042
    reference_title: A review of 207 newborn with tetanus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent cause of death was apnea in the first week and sepsis in
      the later period.
    explanation: >-
      The 207-newborn series identifies apnea as the most frequent early fatal
      complication of neonatal tetanus.
- name: Respiratory Failure
  description: >-
    Airway obstruction, respiratory arrest, or recurrent apnea can lead to
    life-threatening respiratory failure.
  phenotype_term:
    preferred_term: Respiratory failure
    term:
      id: HP:0002878
      label: Respiratory failure
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Important complications include laryngeal spasm and resultant airway
      obstruction and respiratory arrest
    explanation: >-
      Links the tetanus spastic syndrome to airway obstruction and respiratory
      arrest, which in neonates can follow umbilical toxin exposure.
diagnosis:
- name: Clinical first-month neonatal tetanus diagnosis
  description: >-
    Tetanus neonatorum is diagnosed clinically when a newborn in the first 28
    days develops a compatible toxin-mediated syndrome after umbilical exposure;
    culture, toxigenic C. tetani PCR, or serology can support but do not exclude
    the diagnosis when negative.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Compatible neonatal rigidity, trismus, spasms, and respiratory compromise
    support the diagnosis in the setting of umbilical contamination.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neonatal tetanus arises in the first 28 days of life; it carries a poor
      prognosis, and each case reflects an avoidable cascade of failed care,
      encompassing incomplete maternal vaccination, weak antenatal health
      systems, and unclean perinatal practices.
    explanation: >-
      Defines the neonatal time window and the cord/maternal-care context used
      to distinguish tetanus neonatorum from later-onset tetanus.
treatments:
- name: Umbilical source control
  description: >-
    Careful debridement or cleaning of infected umbilical tissue removes the
    devitalized anaerobic niche that supports additional C. tetani toxin
    secretion.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Umbilical Tetanus-Neurotoxin Secretion
    treatment_effect: INHIBITS
    description: >-
      Source control removes devitalized umbilical tissue that can harbor
      vegetative C. tetani and sustain toxin production.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: >-
      Surgical debridement is required to eradicate necrotic tissue that may
      harbour C. tetani, even for wounds that appear innocuous.
    explanation: >-
      Supports source control of contaminated tissue in tetanus management,
      extrapolated to careful care of an infected umbilical stump.
- name: Metronidazole anaerobic therapy
  description: >-
    Metronidazole or another anaerobic antibiotic suppresses vegetative C. tetani
    in the umbilical focus and prevents additional local tetanus-toxin
    secretion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  target_mechanisms:
  - target: Umbilical Tetanus-Neurotoxin Secretion
    treatment_effect: INHIBITS
    description: >-
      Anaerobic antibiotic therapy kills vegetative C. tetani before it can
      secrete more toxin from the umbilical infection site.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Enteral or intravenous (IV) antibiotics should be administered for 7-10
      days.
    explanation: >-
      Supports antimicrobial therapy to suppress further C. tetani growth.
- name: Tetanus antitoxin neutralization
  description: >-
    Tetanus immune globulin neutralizes unbound toxin before it binds and enters
    neonatal motor axon terminals.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tetanus immune globulin
      term:
        id: CHEBI:749548
        label: tetanus immune globulin
  target_mechanisms:
  - target: Neonatal Motor-Axon Toxin Uptake
    treatment_effect: INHIBITS
    description: >-
      Circulating antitoxin neutralizes tetanus neurotoxin that has not yet bound
      neonatal motor neurons.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Administration of antitoxin via an intramuscular (IM) or IV route improves
      mortality in tetanus.
    explanation: >-
      Supports antitoxin as toxin-neutralizing therapy for established tetanus.
- name: Maternal tetanus toxoid immunization
  description: >-
    Tetanus toxoid vaccination before or during pregnancy induces maternal IgG
    that crosses the placenta and passively protects the newborn against
    umbilical tetanus.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Neonatal Motor-Axon Toxin Uptake
    treatment_effect: INHIBITS
    description: >-
      Transplacentally acquired anti-tetanus antibodies neutralize
      umbilically produced toxin before it binds neonatal motor terminals.
  evidence:
  - reference: PMID:40543524
    reference_title: "Tetanus: recognition and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      antibodies are transmitted transplacentally and vaccinating girls
      therefore prevents neonatal tetanus.
    explanation: >-
      Supports maternal or pre-maternal immunization as passive neonatal
      protection against tetanus toxin.
- name: Clean antimicrobial umbilical cord care
  description: >-
    Hygienic delivery and cord care, with topical antimicrobials where neonatal
    tetanus risk is high, prevent hazardous spore introduction and early
    umbilical bacterial expansion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: chlorhexidine
      term:
        id: CHEBI:3614
        label: chlorhexidine
  target_mechanisms:
  - target: Umbilical Clostridium tetani Spore Contamination
    treatment_effect: INHIBITS
    description: >-
      Antimicrobial cord care lowers the chance that spores contaminating the
      cord survive long enough to initiate umbilical infection.
  evidence:
  - reference: PMID:9279625
    reference_title: Protective effects of topical antimicrobials against neonatal tetanus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Continuous use of antimicrobial agents (antibiotics and antiseptics) at
      delivery and during the first few days after delivery was highly
      protective in univariate testing (matched odds ratio 0.2 [95% confidence
      interval: 0.11-0.64], P = 0.003), and remained significantly protective
      when other delivery and cord care practices were controlled.
    explanation: >-
      A population-based matched case-control study supports topical
      antimicrobial cord care as protection against neonatal tetanus.
  - reference: PMID:22322126
    reference_title: >-
      Topical application of chlorhexidine to neonatal umbilical cords for
      prevention of omphalitis and neonatal mortality in a rural district of
      Pakistan: a community-based, cluster-randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Application of 4% CHX to the umbilical cord was effective in reducing the
      risk of omphalitis and neonatal mortality in rural Pakistan.
    explanation: >-
      A cluster-randomized trial directly supports chlorhexidine umbilical-cord
      application in a high-mortality rural setting.

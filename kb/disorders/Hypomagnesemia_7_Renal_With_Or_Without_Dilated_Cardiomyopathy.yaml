genetic:
- name: RRAGD
  gene_term:
    preferred_term: RRAGD
    term:
      id: hgnc:19903
      label: RRAGD
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    All reported disease alleles are heterozygous missense variants; the three
    added in 2025 were absent from gnomAD, and no truncating or copy-number
    alleles have been described. Across 37 patients in 18 families, p.Ser76Leu
    (c.227C>T) accounts for 9 patients in 7 families, often de novo;
    p.Thr97Pro (one family of 8) has not been linked to cardiac disease;
    p.Pro88Leu (one family of 8) causes adult-onset DCM. Other alleles are
    p.Ser76Trp, p.Ser77Phe, p.Thr91Ile, p.Ile100Arg, p.Pro119Leu, p.Pro119Arg
    and p.Ile221Lys. No ClinGen gene-disease validity record for this pair was
    found in the local cache.
  evidence:
  - reference: PMID:34607910
    reference_title: "mTOR-Activating Mutations in RRAGD Are Causative for Kidney Tubulopathy and Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is caused by variants in the RRAGD gene, which encodes Rag GTPase D; these variants lead to an activation of mTOR signaling"
    explanation: Discovery study establishing RRAGD as the causal gene.
  - reference: PMID:41141537
    reference_title: "Novel RRAGD Variants in Autosomal Dominant Kidney Hypomagnesemia and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present case series, 13 new patients and 3 novel RRAGD variants, that is, p.(Ser77Phe), p.(Thr91Ile), and p.(Ile100Arg), are described."
    explanation: Independent replication in eight further families.
  variants:
  - name: p.(Ser76Leu) (c.227C>T)
    description: >-
      Most frequently reported allele, recurrent and often de novo; carriers
      include children with DCM requiring transplantation.
    type: missense_variant
    evidence:
    - reference: PMID:41141537
      reference_title: "Novel RRAGD Variants in Autosomal Dominant Kidney Hypomagnesemia and Therapeutic Perspectives."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients (no. of families) | 9 (7) | 1 (1) | 1 (1) | 8 (1) | 4 (2) | 8 (1) | 2 (1) | 1 (1) | 2 (2) | 1 (1) | 37 (18)"
      explanation: Summary table row; the first column is p.(Ser76Leu), with 9 patients in 7 families.
  - name: p.(Thr97Pro)
    description: Kidney-only phenotype in one large family; no cardiac involvement reported.
    type: missense_variant
    evidence:
    - reference: PMID:38901414
      reference_title: "RRAGD-Associated Autosomal Dominant Kidney Hypomagnesemia with Cardiomyopathy: A Review on the Clinical Manifestations and Therapeutic Options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "To date, the T97P variant has not been linked to cardiac involvement."
      explanation: Variant-specific absence of cardiac disease.
  - name: p.(Pro88Leu)
    description: One large family with hypomagnesemia, medullary nephrocalcinosis and adult-onset heart disease.
    type: missense_variant
    evidence:
    - reference: PMID:38901414
      reference_title: "RRAGD-Associated Autosomal Dominant Kidney Hypomagnesemia with Cardiomyopathy: A Review on the Clinical Manifestations and Therapeutic Options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In contrast, the P88L variant is associated to dilated cardiomyopathy manifesting in adulthood."
      explanation: Adult-onset DCM with this allele.
animal_models:
- name: Zebrafish embryos overexpressing mutant human RRAGD
  species: Zebrafish
  genotype: Injection of human RRAGD p.S76L or p.P119R cRNA
  publication: PMID:39331021
  modeled_mechanisms:
  - target: Cardiomyocyte Dedifferentiation and Impaired Calcium Clearance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Mutant RRAGD reduces ventricular fractional shortening and ejection fraction; rapamycin reverses the effect.
    limitations: >-
      Transient overexpression of human cRNA in embryos rather than a
      heterozygous knock-in; no electrolyte or kidney phenotype was observed,
      so the model covers only the cardiac arm.
    evidence:
    - reference: PMID:39331021
      reference_title: "RRAGD variants cause cardiac dysfunction in a zebrafish model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings reveal that overexpression of RRAGD mutants resulted in decreased ventricular fractional shortening, ejection fraction, and pericardial swelling."
      explanation: In vivo cardiac dysfunction from mutant RRAGD.
  - target: Distal Nephron Magnesium and Calcium Reabsorption Defect
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Embryonic zebrafish showed no electrolyte change, so the model does not
      reproduce the tubulopathy.
    evidence:
    - reference: PMID:39331021
      reference_title: "RRAGD variants cause cardiac dysfunction in a zebrafish model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, no effects on electrolyte homeostasis were observed."
      explanation: Negative result for the kidney arm.

      explanation: Phosphorylation by mutant-RagD-driven mTORC1 blocks nuclear entry of the MiT/TFE factors.
- name: TFEB and TFE3 Cytoplasmic Retention
  biological_scale: CELLULAR
  description: >-
    Mutant RagD causes TFEB and TFE3 to stay cytoplasmic and lowers their
    transcriptional activity in HeLa and HK-2 kidney cells, hiPSC-derived
    cardiomyocytes and P88L patient fibroblasts. The authors propose MiT/TFE
    inhibition, rather than canonical mTORC1 hyperactivity, as the main driver
    of the kidney and heart phenotype; how this produces tubular ion-transport
    and myocardial defects has not been shown.

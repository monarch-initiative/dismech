diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis rests on a heterozygous RRAGD missense variant in a patient with
    renal magnesium wasting, hypokalemia and nephrocalcinosis, with or without
    cardiomyopathy. Because the gene was described in 2021, older tubulopathy
    panels may omit it and reanalysis of existing exome data can make the
    diagnosis.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34607910
    reference_title: "mTOR-Activating Mutations in RRAGD Are Causative for Kidney Tubulopathy and Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome and -genome sequencing of a patient cohort with a novel, inherited, salt-losing tubulopathy; hypomagnesemia; and dilated cardiomyopathy."
    explanation: The disorder was identified by exome and genome sequencing.
  - reference: PMID:38790019
    reference_title: "Diagnostic yield of exome and genome sequencing after non-diagnostic multi-gene panels in patients with single-system diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a reanalysis of the ES data in January 2022 identified a VUS in RRAGD (Ras-related GTP binding D, HGNC:19903), a gene newly associated in November 2021 with hypomagnesemia, tubulopathy, and dilated cardiomyopathy."
    explanation: Exome reanalysis found an RRAGD variant missed by a panel.

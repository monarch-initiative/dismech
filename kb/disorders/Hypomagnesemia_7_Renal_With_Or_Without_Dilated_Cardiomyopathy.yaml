- name: Impaired MiT/TFE Response to Lysosomal and Mitochondrial Injury
  biological_scale: CELLULAR
  description: >-
    In HK-2 kidney cells treated with mitochondrial poisons, mutant RagD keeps
    TFEB cytoplasmic and reduces Parkin recruitment to mitochondria, lowering
    mitophagy. TFEB-driven mitophagy supports stress resistance in kidney and
    mitochondrial quality control in cardiomyocytes, so this defect is a
    candidate contributor to both organ phenotypes.
  biological_processes:
  - preferred_term: mitophagy
    term:
      id: GO:0000423
      label: mitophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:37188688
    reference_title: "RagD auto-activating mutations impair MiT/TFE activity in kidney tubulopathy and cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, we observed a reduction of mitophagy activation, as demonstrated by decreased Parkin mitochondrial translocation"
    explanation: Reduced mitophagy in kidney cells expressing mutant RagD.
  downstream:
  - target: Cardiomyocyte Dedifferentiation and Impaired Calcium Clearance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypothesized; mitochondrial quality control in stressed cardiomyocytes depends on TFEB.
    evidence:

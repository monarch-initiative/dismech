notes: >-
  A 2005 report of a father and daughter with a Bartter-like tubulopathy,
  hypermagnesuric hypomagnesemia, hypercalciuria and cardiomyopathy
  (PMID:15769815) describes the same phenotype but has no PubMed abstract, so
  it is not cited as evidence. The 2024 letter describing a Spanish family with
  DCM and salt-losing tubulopathy (PMID:38372174) likewise has no abstract;
  that family is included in the 37-patient summary of PMID:41141537. Seizures appear in database phenotype lists for this disorder,
  but no quotable source was found, so they are not recorded. The
  mtorc1_hyperactivation module was not used because its scope is loss of an
  upstream mTORC1 brake, whereas here an activating Rag variant acts mainly on
  the non-canonical TFEB arm.

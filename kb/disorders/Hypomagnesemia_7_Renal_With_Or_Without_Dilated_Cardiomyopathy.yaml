      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: "Activation of TFEB during mitophagy through a PINK1- and Parkin-dependent mechanism34 is pivotal for kidney resistance to stress stimuli35, as well as for mitochondrial quality control in cardiomyocytes under stress36."
      explanation: Background rationale cited by the authors; not shown in RRAGD-mutant cardiomyocytes.
- name: Distal Nephron Magnesium and Calcium Reabsorption Defect
  biological_scale: TISSUE
  description: >-
    RagD is expressed in the thick ascending limb and distal convoluted tubule,
    and the phenotype resembles Bartter-type and FHHNC-type tubulopathies (thick
    ascending limb) or, for p.Thr97Pro without hypercalciuria, Gitelman syndrome
    (distal convoluted tubule). Patients with p.Thr97Pro responded normally to
    furosemide and hydrochlorothiazide, so NKCC2 and NCC function appear intact
    and the defect is thought to act on magnesium and calcium transport itself.
    The specific transporter affected is unknown; downregulation of TRPM6 has
    been suggested but not demonstrated.
  cell_types:

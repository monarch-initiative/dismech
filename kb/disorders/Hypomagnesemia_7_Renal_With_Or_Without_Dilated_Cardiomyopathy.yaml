inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous RRAGD variants arise de novo in many sporadic children and
    segregate dominantly in multigeneration families, including an eight-member
    family in the original report. Expressivity is variable: kidney tubulopathy
    is nearly universal, whereas almost half of reported carriers have no
    cardiac involvement at last follow-up.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:34607910
    reference_title: "mTOR-Activating Mutations in RRAGD Are Causative for Kidney Tubulopathy and Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a heterozygous variant in RRAGD that segregated with the phenotype in eight members of a large family with similar kidney manifestations."
    explanation: Dominant segregation of a heterozygous RRAGD variant in a large family.
  - reference: PMID:41141537
    reference_title: "Novel RRAGD Variants in Autosomal Dominant Kidney Hypomagnesemia and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In families 3 and 4, dominant inheritance was confirmed."
    explanation: Independent families with confirmed dominant transmission.
  - reference: PMID:41141537
    reference_title: "Novel RRAGD Variants in Autosomal Dominant Kidney Hypomagnesemia and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, almost half of all patients (17/37) presented with isolated kidney tubulopathies (age range: 8–48 years), suggesting that renal and cardiac phenotypes can occur independently."
    explanation: Variable expressivity of the cardiac phenotype among carriers.
pathophysiology:
- name: RRAGD Auto-Activating Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous germline missense variants alter conserved residues in or next
    to the G1 and G2 nucleotide-binding boxes of RagD (for example p.Ser76Leu,
    p.Ser77Phe, p.Pro88Leu, p.Thr91Ile, p.Thr97Pro, p.Ile100Arg, p.Pro119Leu,
    p.Pro119Arg, p.Ile221Lys). The mutant RagD is auto-activating: it adopts the
    active state even in the absence of folliculin, the GAP that normally
    activates RagC/D.
  genes:
  - preferred_term: RRAGD
    term:
      id: hgnc:19903
      label: RRAGD
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: RagD GTPase activity (auto-activated, folliculin-independent)
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34607910
    reference_title: "mTOR-Activating Mutations in RRAGD Are Causative for Kidney Tubulopathy and Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In eight children from unrelated families with a tubulopathy characterized by hypomagnesemia, hypokalemia, salt wasting, and nephrocalcinosis, we identified heterozygous missense variants in RRAGD that mostly occurred de novo."
    explanation: Discovery cohort establishing heterozygous, mostly de novo RRAGD missense variants as the cause.
  - reference: PMID:37188688
    reference_title: "RagD auto-activating mutations impair MiT/TFE activity in kidney tubulopathy and cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that RagD mutations causing kidney tubulopathy and cardiomyopathy are \"auto- activating\", even in the absence of Folliculin, the GAP responsible for RagC/D activation"
    explanation: Cell-based demonstration that disease variants activate RagD independently of its GAP.
  downstream:
  - target: Nutrient-Insensitive mTORC1 Signaling
    causal_link_type: DIRECT
    description: Constitutively active RagD keeps mTORC1 signalling on when amino acids are withdrawn.
    evidence:
    - reference: PMID:34607910
      reference_title: "mTOR-Activating Mutations in RRAGD Are Causative for Kidney Tubulopathy and Cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The identified RRAGD variants were shown to induce a constitutive activation of mTOR signaling in vitro."
      explanation: Functional assays of the patient variants.
- name: Nutrient-Insensitive mTORC1 Signaling
  biological_scale: MOLECULAR
  description: >-
    In cells expressing mutant RagD, mTORC1 continues to phosphorylate its
    targets during amino acid starvation. The effect is consistent on the
    non-canonical substrate TFEB; effects on the canonical substrates S6K and
    4E-BP1 differ between studies and variants (increased in the discovery
    study and for p.Ser76Leu in T-REx HeLa cells, unchanged in the MiT/TFE study
    and for p.Ser77Phe and p.Ile100Arg). p.Thr91Ile, which causes the full kidney
    phenotype, did not change mTORC1 readouts in HeLa cells, so the degree of
    in vitro activation does not track clinical severity.
  genes:
  - preferred_term: RRAGD
    term:
      id: hgnc:19903
      label: RRAGD

name: Hypomagnesemia 7 Renal With Or Without Dilated Cardiomyopathy
creation_date: "2026-10-15T12:30:00Z"
category: Mendelian
synonyms:
- HOMG7
- renal hypomagnesemia 7 with or without dilated cardiomyopathy
- autosomal dominant kidney hypomagnesemia (ADKH-RRAGD)
- RRAGD-associated autosomal dominant kidney hypomagnesemia with cardiomyopathy
- kidney tubulopathy and cardiomyopathy syndrome
description: >-
  Autosomal dominant kidney-heart disorder caused by heterozygous germline
  missense variants in RRAGD, which encodes the small Rag GTPase RagD. Variants
  are often de novo and cluster in the nucleotide-binding G domains; they
  auto-activate RagD independently of its GTPase-activating protein folliculin,
  so mTORC1 keeps phosphorylating TFEB and TFE3 during amino acid starvation and
  the MiT/TFE factors are retained in the cytoplasm. The kidney phenotype is an
  electrolyte-losing tubulopathy of the thick ascending limb and distal
  convoluted tubule, with renal magnesium wasting and hypomagnesemia,
  hypokalemia, salt wasting, hypercalciuria, metabolic alkalosis, polyuria and
  nephrocalcinosis, and usually preserved glomerular function. About half of
  reported carriers also have cardiomyopathy, mostly dilated cardiomyopathy
  presenting in childhood and progressing to heart transplantation in several
  cases, with ventricular arrhythmia, excessive trabeculation and myocardial
  fibrosis also described. Kidney and heart involvement occur independently,
  and expression of the cardiac phenotype varies by variant. Management is
  symptomatic (magnesium and potassium supplementation, standard heart failure
  therapy, transplantation); SGLT2 inhibition and mTOR inhibition are under
  investigation.

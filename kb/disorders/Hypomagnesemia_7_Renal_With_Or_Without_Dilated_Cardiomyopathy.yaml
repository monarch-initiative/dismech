    reference_title: "RRAGD p.(Ser76Leu) Variant Causes Dysregulated Expression of Muscle Development and Cytoskeleton Genes in Cardiomyocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data indicate that the RRAGD p.(Ser76Leu) variant maintains the phosphorylation of mTORC1 targets (i.e., S6K, 4E-BP1, and TFEB) during amino acid starvation, in contrast to RRAGD WT in T-REx HeLa cells."
    explanation: The recurrent p.Ser76Leu variant makes mTORC1 insensitive to amino acid withdrawal.
  - reference: PMID:37188688
    reference_title: "RagD auto-activating mutations impair MiT/TFE activity in kidney tubulopathy and cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cause constitutive phosphorylation of TFEB and TFE3 by mTORC1, without affecting the phosphorylation of \"canonical\" mTORC1 substrates, such as S6K"
    explanation: The hyperactivity is selective for the non-canonical TFEB/TFE3 arm in this study.
  - reference: PMID:41141537
    reference_title: "Novel RRAGD Variants in Autosomal Dominant Kidney Hypomagnesemia and Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro assays demonstrated constitutive activation of noncanonical mTORC1 signaling caused by the p.(Ser77Phe) and p.(Ile100Arg) variants."
    explanation: Two further variants show the same non-canonical activation.
  - reference: PMID:41141537

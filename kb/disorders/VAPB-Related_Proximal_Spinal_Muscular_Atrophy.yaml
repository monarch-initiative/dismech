genetic:
- name: VAPB
  gene_term:
    preferred_term: VAPB
    term:
      id: hgnc:12649
      label: VAPB
  frequency: "essentially the sole known causal gene, nearly all cases attributable to a single Brazilian founder mutation"
  evidence:
  - reference: PMID:16187141
    reference_title: "A common founder for amyotrophic lateral sclerosis type 8 (ALS8) in the Brazilian population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analysis shows a common founder for all families regardless
      of ancestry, with a founding event 23 generations ago (95% CI 13-39),
      consistent with the Portuguese colonization of Brazil.
    explanation: Establishes the single-founder origin of the P56S mutation across all known kindreds.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant with variable expressivity and incomplete penetrance —
    the identical P56S allele produces phenotypes ranging from pure
    lower-motor-neuron proximal SMA to rapidly progressive classic ALS within
    the same family.
prevalence:
- population: Brazil (founder kindreds)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight known large Brazilian kindreds (>1,500 individuals, ~200 affected)
    carry the founder P56S mutation; isolated non-Brazilian cases have also
    been reported. No general-population prevalence estimate exists.
  evidence:
  - reference: PMID:16187141
    reference_title: "A common founder for amyotrophic lateral sclerosis type 8 (ALS8) in the Brazilian population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight families, comprising more than 1,500 individuals of whom about
      200 are affected, are now known to carry this mutation.
    explanation: Quantifies the known affected population across founder kindreds.
progression:
- phase: Established disease with functional decline
  notes: >-
    Slowly progressive relative to sporadic ALS. Quantitative natural-history
    figures are deliberately not curated here. The largest cohort
    (DOI:10.1080/21678421.2026.2674020, 78 patients) reports survival and
    functional-milestone timings, but that record caches with
    content_type: unavailable — the publisher returned HTTP 403 for the PDF on
    two fetches (plain and --force) and no abstract was retrieved, so no
    sentence in it can be quoted as an evidence snippet. The paper is listed
    under references as a lead for a curator with full-text access; its
    survival, wheelchair and non-invasive-ventilation medians should be added
    with an exact snippet once the text is retrievable.
diagnosis:
- name: VAPB single-gene sequencing
  description: >-
    Targeted sequencing of VAPB (or inclusion in ALS/motor-neuron-disease gene
    panels) is the recommended diagnostic approach given the near-exclusive
    recurrence of a single founder variant, particularly in patients of
    Brazilian ancestry or with a compatible family history.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    Identification of the VAPB c.166T>C (p.Pro56Ser) variant, or more rarely
    other VAPB missense variants, confirms the diagnosis.
- name: Electromyography and nerve conduction studies
  description: >-
    EMG/NCS shows a pattern of chronic lower motor neuron/denervation disease
    (fibrillations, fasciculation potentials, chronic neurogenic changes),
    supporting the clinical impression prior to genetic confirmation.
  diagnosis_term:
    preferred_term: electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
treatments:
- name: Multidisciplinary Supportive Care
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    No disease-modifying therapy specific to VAPB-related disease exists;
    management follows the standard multidisciplinary ALS-clinic model:
    respiratory support (including planned non-invasive ventilation),
    nutritional intervention (including gastrostomy feeding when needed),
    physical and occupational therapy, and assistive mobility devices.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    General ALS-spectrum pharmacotherapy such as riluzole is used in clinical
    practice for this disease, but no VAPB-specific efficacy data have been
    published; current literature explicitly characterizes available
    treatment as palliative rather than disease-modifying.
- name: Genetic Counseling
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  description: >-
    Central to management given autosomal dominant inheritance with variable
    expressivity and incomplete penetrance; cascade testing and counseling of
    at-risk relatives is particularly relevant within known Brazilian founder
    kindreds.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

references:
- reference: DOI:10.1080/21678421.2026.2674020

notes: >-
  Not cited as evidence, and why. DOI:10.1080/21678421.2026.2674020 is the
  largest natural-history cohort (78 patients, 57 families) and the only source
  for this disease's survival and functional-milestone figures, but its record
  caches with content_type: unavailable — Taylor & Francis returned HTTP 403 for
  the PDF on both a plain fetch and a --force retry, and no abstract was
  retrieved, so no sentence in it can serve as an evidence snippet. It is listed
  under references as a lead for a curator with full-text access; its survival,
  wheelchair and non-invasive-ventilation medians, and the 94%
  lumbar-predominant-onset and 68% upper-motor-neuron-sign figures, are
  deliberately left uncurated rather than carried as unverifiable prose.
  GeneReviews baseline: just check-genereviews reports NO_CHAPTER against the
  2026-09-10 Bookshelf snapshot (958 GeneReviews chapters indexed), so there is
  no chapter to mine and no baseline gap; StatPearls is likewise NO_CHAPTER and
  would not be a baseline in any case.

name: VAPB-Related Proximal Spinal Muscular Atrophy
creation_date: "2026-07-28T16:33:56Z"
description: >-
  VAPB-related proximal spinal muscular atrophy (Finkel-type late-onset SMA,
  SMAFK; OMIM #182980) is an autosomal dominant motor neuron disease caused by
  a heterozygous, dominantly acting missense mutation in VAPB (VAMP-associated
  protein B and C), almost exclusively c.166T>C (p.Pro56Ser). The same P56S
  allele can also produce a classic, more rapidly progressive ALS phenotype
  (amyotrophic lateral sclerosis type 8, ALS8; OMIM #608627) even within the
  same kindred, so proximal SMA and ALS8 sit on a single clinical continuum
  defined by one genotype. VAPB normally anchors at the endoplasmic reticulum
  membrane, where its MSP domain binds FFAT-motif partner proteins to mediate
  ER-mitochondria tethering, lipid transfer, calcium signaling, and the
  unfolded protein response. P56S destabilizes this domain, causing the mutant
  protein to misfold, aggregate, and recruit wild-type VAPB into cytoplasmic
  inclusions. This disrupts ER-mitochondria coupling, activates the integrated
  stress response, blocks autophagosome-lysosome fusion, and mislocalizes
  RNA-binding proteins (TDP-43, FUS, Matrin 3) into stress granules, converging
  on slow, progressive anterior horn motor neuron degeneration. Nearly all
  known cases trace to a single founder mutation from Portuguese colonization
  of Brazil roughly 23 generations ago.
category: Genetic
parents:
- Motor Neuron Disease
- Neuromuscular Disease

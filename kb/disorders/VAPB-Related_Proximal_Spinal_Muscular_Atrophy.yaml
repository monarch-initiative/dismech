pathophysiology:
- name: VAPB P56S Misfolding and Aggregation
  biological_scale: MOLECULAR
  description: >
    The dominant P56S substitution destabilizes the N-terminal MSP domain of
    VAPB, an ER membrane protein whose MSP domain normally binds FFAT-motif
    partner proteins. Misfolded P56S-VAPB forms detergent-insoluble
    cytoplasmic aggregates that recruit and sequester wild-type VAPB, a
    dominant-negative mechanism layered on top of a toxic gain of function.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:15372378
    reference_title: "A mutation in the vesicle-trafficking protein VAPB causes late-onset spinal muscular atrophy and amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the finding of a novel missense mutation in the
      vesicle-associated membrane protein/synaptobrevin-associated membrane
      protein B (VAPB) gene in patients from this family.
    explanation: Original description of the VAPB missense mutation causing this spectrum of motor neuron disease.
  - reference: PMID:18523548
    reference_title: "A Drosophila model of ALS: human ALS-associated mutation in VAP33A suggests a dominant negative mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This is brought about by aggregation of VAP(P58S) and recruitment of
      wild type VAP into these aggregates.
    explanation: A Drosophila model demonstrates the aggregation-mediated dominant-negative mechanism by which mutant VAP sequesters wild-type protein.
  downstream:
  - target: Disrupted ER-Mitochondria Coupling and Integrated Stress Response
- name: Disrupted ER-Mitochondria Coupling and Integrated Stress Response
  biological_scale: CELLULAR
  description: >
    Loss of normal VAPB-mediated ER-mitochondria tethering (via the
    VAPB-PTPIP51 interaction) impairs calcium transfer and mitochondrial
    membrane potential, activating the integrated stress response (ISR) via
    ATF4 upregulation and reduced global protein synthesis in motor neurons.
  evidence:
  - reference: PMID:40764463
    reference_title: "Convergent activation of the integrated stress response and ER-mitochondria uncoupling in VAPB-associated ALS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      VAPB P56S MNs show increased susceptibility to ER stress, elevated
      expression of the Integrated Stress Response (ISR) regulator ATF4 under
      stress, and reduced global protein synthesis.
    explanation: iPSC-derived motor neurons expressing P56S VAPB show direct evidence of ISR activation coupled to ER-mitochondria dysfunction.
  downstream:
  - target: Autophagy Blockade and RNA-Binding Protein Mislocalization
- name: Autophagy Blockade and RNA-Binding Protein Mislocalization
  biological_scale: CELLULAR
  description: >
    P56S-VAPB aggregates sequester the early autophagy proteins ULK1 and the
    ATG5-ATG12 conjugate and the late-autophagy fusion SNARE STX17, blocking
    both initiation and autophagosome-lysosome fusion. The resulting
    proteotoxic stress mislocalizes the RNA-binding proteins TDP-43, FUS, and
    Matrin 3 from the nucleus into cytoplasmic, VAPB-aggregate-associated
    stress granules, linking ALS8 mechanistically to the broader
    TDP-43/FUS proteinopathy seen in other ALS genotypes.
  evidence:
  - reference: PMID:33972508
    reference_title: "Pathomechanisms of ALS8: altered autophagy and defective RNA binding protein (RBP) homeostasis due to the VAPB P56S mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      P56S-VAPB aggregates alter early autophagy proteins ULK1, ATG5-ATG12;
      late autophagy protein STX17 and leads to the defects in both early and
      late steps of autophagy.
    explanation: Direct evidence that P56S-VAPB aggregates disrupt specific early and late autophagy machinery components.
  - reference: PMID:33972508
    reference_title: "Pathomechanisms of ALS8: altered autophagy and defective RNA binding protein (RBP) homeostasis due to the VAPB P56S mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cytoplasmic mis-localisation of several RBPs including pTDP-43, FUS,
      Matrin 3 which often sequestered with P56S-VAPB aggregates both in cell
      culture and in the muscle biopsy of the ALS8 patient
    explanation: Patient muscle biopsy confirms RNA-binding protein mislocalization and co-sequestration with VAPB aggregates in vivo.
  downstream:
  - target: Anterior Horn Motor Neuron Degeneration
- name: Anterior Horn Motor Neuron Degeneration
  biological_scale: TISSUE
  description: >
    Chronic ER stress, ISR activation, autophagy failure, and RNA-binding
    protein proteostasis collapse converge on slow, progressive degeneration
    of anterior horn motor neurons in the spinal cord, with variable
    corticospinal (upper motor neuron) involvement producing the
    proximal-SMA/ALS8 phenotypic spectrum. Notably, VAPB aggregation alone is
    not sufficient to cause motor neuron degeneration in mouse models,
    indicating that the additional cell-autonomous stress pathways above are
    required.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  evidence:
  - reference: PMID:26362257
    reference_title: "Vapb/Amyotrophic lateral sclerosis 8 knock-in mice display slowly progressive motor behavior defects accompanying ER stress and autophagic response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutant mice demonstrate induction of ER stress and autophagic
      response in motor neurons before obvious onset of behavioral defects,
      suggesting that these cellular biological defects might contribute to
      the initiation of the disease.
    explanation: Physiological-expression knock-in mice show ER stress and autophagic dysfunction in motor neurons preceding overt behavioral decline, supporting a causal role.
  - reference: PMID:23281774
    reference_title: "Widespread aggregation of mutant VAPB associated with ALS does not cause motor neuron degeneration or modulate mutant SOD1 aggregation and toxicity in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overexpression of VAPBP56S mutant to approximately two-fold of the
      endogenous VAPB in mouse spinal cord produced abundant VAPB aggregates
      but was not sufficient to cause motor dysfunction or motor neuron
      degeneration.
    explanation: A separate overexpression mouse model shows VAPB aggregation alone is insufficient for motor neuron degeneration, indicating additional cell-autonomous stress mechanisms (ISR, autophagy, RBP dysfunction) are required rather than aggregate burden per se.
  - reference: PMID:21685205
    reference_title: "Downregulation of VAPB expression in motor neurons derived from induced pluripotent stem cells of ALS8 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show for the first time that VAPB protein levels are reduced in
      ALS8-derived motor neurons but, in contrast to over-expression systems,
      cytoplasmic aggregates could not be identified.
    explanation: Patient-derived iPSC motor neurons show VAPB downregulation as an additional, aggregation-independent contributor to motor neuron vulnerability.
discussions:
- discussion_id: openq_vapb_aggregation_vs_stress
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Anterior Horn Motor Neuron Degeneration
  prompt: >-
    If VAPB aggregate burden alone does not cause motor neuron degeneration in
    mouse overexpression models, what combination of ISR activation, autophagy
    blockade, and RNA-binding protein mislocalization is necessary and
    sufficient to trigger degeneration, and can this be resolved in a single
    model system carrying physiological P56S expression?
  rationale: >-
    Knock-in mice (physiological expression) show ER stress/autophagy defects
    preceding degeneration, while overexpression mice with abundant aggregates
    show no degeneration at all, suggesting aggregate load and functional
    cell-autonomous stress are dissociable and only the latter may be
    causal.
  proposed_experiments:
  - experiment_id: exp_vapb_isrib_knockin
    name: ISR inhibition in P56S knock-in mice
    description: >-
      Cross P56S knock-in mice with ISR-inhibitor (ISRIB) treatment or genetic
      ATF4 knockdown to test whether blocking ISR activation prevents motor
      neuron degeneration despite persistent VAPB aggregation.

genetic:
- name: DNAH1
  association: Causal
  gene_term:
    preferred_term: DNAH1
    term:
      id: hgnc:2940
      label: DNAH1
  notes: >-
    The defining variant is DNAH1 c.3460A>C, p.Lys1154Gln (NM_015512.4),
    homozygous in two sisters. It was the only candidate in the proband's
    exome and was absent from 600 ethnically matched chromosomes. Further
    DNAH1 variants appear in Chinese Kartagener and PCD cohorts
    (PMID:31507630, PMID:33577779) and in Turkish PCD cohorts
    (PMID:31765523, PMID:34349594), usually without segregation or
    functional data. One Kartagener series found compound heterozygous DNAH1
    variants and proposed DNAH1 as a high-risk gene in Chinese patients. The
    evidence for PCD remains weaker than for MMAF.
  evidence:
  - reference: PMID:25927852
    reference_title: "Variation in DNAH1 may contribute to primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In exome-wide analysis on the proband the p.Lys1154Gln in DNAH1 was detected as the only possibly causative variant"
    explanation: The index variant was the only candidate in the exome.
  - reference: PMID:31507630
    reference_title: "Identification of Pathogenic Mutations and Investigation of the NOTCH Pathway Activation in Kartagener Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six mutations in DNAH1 were identified in all individuals, indicating that DNAH1 might be a high-risk causative gene in Chinese patients with KTS."
    explanation: Further DNAH1 variants in a Kartagener cohort, without functional testing.
  - reference: CGGV:assertion_a07c8b6e-a558-498b-975c-b12e96878a44-2025-10-16T160000.000Z
    reference_title: "DNAH1 / primary ciliary dyskinesia (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DNAH1 | HGNC:2940 | primary ciliary dyskinesia | MONDO:0016575 | AR | Limited"
    explanation: >-
      ClinGen rates DNAH1 as Limited for primary ciliary dyskinesia in
      general. The assertion is for MONDO:0016575, not this numbered entity,
      so it is quoted here rather than recorded as gene_disease_validity.
diagnosis:
- name: Exome Sequencing After Negative PCD Gene Testing
  description: >-
    DNAH1 was found only after a PCD gene panel was negative, by
    homozygosity mapping and exome sequencing. The authors suggest testing
    DNAH1 when known PCD genes are excluded. Because inner-arm defects can
    leave the axoneme looking normal, electron microscopy may not point to
    the gene.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:25927852
    reference_title: "Variation in DNAH1 may contribute to primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular variation in DNAH1 may play a role in PCD and its potential contribution should be considered in patients where all known genes are excluded."
    explanation: Recommendation to test DNAH1 after negative PCD gene testing.
differential_diagnoses:
- name: Spermatogenic failure 18 (DNAH1-related MMAF)
  disease_term:
    preferred_term: spermatogenic failure 18
    term:
      id: MONDO:0054615
      label: spermatogenic failure 18
  description: >-
    Same gene, different presentation. Men with biallelic DNAH1 variants have
    MMAF and infertility without reported respiratory disease.
  distinguishing_features:
  - >-
    Chronic airway disease, bronchiectasis and situs inversus are present in
    CILD37 and absent in the reported SPGF18 men. A DNAH1 genotype does not
    by itself say which presentation to expect.
  evidence:
  - reference: PMID:24360805
    reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although DNAH1 is also expressed in other ciliated cells, infertility was the only symptom of primary ciliary dyskinesia observed in affected subjects"
    explanation: SPGF18 men lack the respiratory features of CILD37.
animal_models:
- name: Mdhc7 (Dnah1) knockout mouse
  species: Mouse
  genotype: MDHC7-/- (Dnah1 knockout), homozygous
  publication: PMID:11371505
  description: >-
    Mice lacking the Dnah1 ortholog are viable and well formed. Males are
    infertile because sperm swim poorly, and tracheal cilia beat at about
    half the normal frequency, with no gross axonemal defect.
  modeled_mechanisms:
  - target: Inner Dynein Arm Dysfunction in Motile Cilia
    relationship: PARTIALLY_RECAPITULATES

inheritance:
- name: Autosomal recessive
  description: >-
    Both affected sisters were homozygous for the DNAH1 variant, which
    segregated with the phenotype across twelve genotyped family members
    from a consanguineous union.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25927852
    reference_title: "Variation in DNAH1 may contribute to primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous missense aberration (p.Lys1154Gln) was identified in both sisters in the DNAH1 gene that segregated completely with the disease phenotype."
    explanation: Homozygous variant segregating with disease in a consanguineous family fits recessive inheritance.
pathophysiology:
- name: Loss of DNAH1 Inner-Arm Dynein Heavy Chain Function
  description: >-
    The index variant replaces a conserved lysine in the N-terminal stem of
    DNAH1, the part of the heavy chain that contacts other heavy chains and
    arm subunits. Its effect on the protein has not been tested; loss of
    function is inferred from conservation and prediction tools.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNAH1
    term:
      id: hgnc:2940
      label: DNAH1
  molecular_functions:
  - preferred_term: minus-end-directed microtubule motor activity
    modifier: DECREASED
    term:
      id: GO:0008569
      label: minus-end-directed microtubule motor activity
  cellular_components:
  - preferred_term: Inner dynein arm
    term:
      id: GO:0036156
      label: inner dynein arm
  downstream:
  - target: Inner Dynein Arm Dysfunction in Motile Cilia
    causal_link_type: DIRECT
    description: >-
      DNAH1 is the heavy chain of inner arm IDAd in human respiratory cilia,
      so its loss is expected to remove or disable that arm. In the CILD37
      family this step is inferred; no ciliary sample was examined.
    evidence:
    - reference: PMID:39056782
      reference_title: "Primary Ciliary Dyskinesia Associated Disease-Causing Variants in CCDC39 and CCDC40 Cause Axonemal Absence of Inner Dynein Arm Heavy Chains DNAH1, DNAH6, and DNAH7."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "we demonstrated that CCDC39/40 deficiency not only results in abnormalities of DNALI1 but also affects the encoded heavy chains DNAH1 and DNAH7 of IDAd and IDAb/e, respectively"
      explanation: Places DNAH1 in the inner arms of human respiratory cilia. The work concerns CCDC39/40 patients, not DNAH1 patients.
  - target: Inner Dynein Arm Dysfunction in the Sperm Flagellum
    causal_link_type: DIRECT
    description: >-
      Shown in men with biallelic DNAH1 variants (SPGF18) and in knockout
      mice, not in the CILD37 family, whose two affected members are women.
  evidence:
  - reference: PMID:25927852
    reference_title: "Variation in DNAH1 may contribute to primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lysine residue altered in these patients is located in the highly conserved N-terminal stem of the DNAH1 protein."
    explanation: Locates the index variant in a conserved functional region of the heavy chain.
  - reference: PMID:25927852
    reference_title: "Variation in DNAH1 may contribute to primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "p.Lys1154Gln is predicted to be probably damaging with a score of 0.998 on Polyphen"
    explanation: In silico prediction is the only functional evidence for the variant.
- name: Inner Dynein Arm Dysfunction in Motile Cilia
  description: >-
    Loss of an inner-arm heavy chain weakens and distorts the ciliary beat.
    In Dnah1 knockout mice the tracheal ciliary beat frequency falls by about
    half without any gross change in axonemal structure, which is why such a
    defect can be missed by electron microscopy. Respiratory cilia of CILD37
    patients have not been examined, so this node rests on mouse data and on
    the location of DNAH1 in human respiratory cilia.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Respiratory tract multiciliated cell
    term:
      id: CL:4030034
      label: respiratory tract multiciliated cell
  cellular_components:
  - preferred_term: Inner dynein arm
    term:
      id: GO:0036156
      label: inner dynein arm
  biological_processes:
  - preferred_term: Cilium movement
    modifier: DECREASED
    term:
      id: GO:0003341
      label: cilium movement
  downstream:
  - target: Impaired Mucociliary Clearance
    causal_link_type: DIRECT
  - target: Defective Left-Right Axis Determination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Nodal cilia share the axonemal dyneins of respiratory cilia. Whether
      DNAH1 is needed at the embryonic node has not been tested; the link
      rests on the situs inversus seen in the index family.
  - target: Female infertility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Oviduct cilia move the egg towards the uterus, and impaired oviduct
      cilia are the usual explanation for subfertility in women with PCD. The
      proband's oviduct cilia were not studied.
  evidence:
  - reference: PMID:11371505
    reference_title: "Disruption of an inner arm dynein heavy chain gene results in asthenozoospermia and reduced ciliary beat frequency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we measured the beat frequency of tracheal cilia and observed a decrease in the beat frequency of approximately 50% in MDHC7(-/-) mice"
    explanation: Mouse Dnah1 (MDHC7) loss halves tracheal ciliary beat frequency.
  - reference: PMID:11371505
    reference_title: "Disruption of an inner arm dynein heavy chain gene results in asthenozoospermia and reduced ciliary beat frequency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The reduction in both ciliary and flagellar motility is not correlated with any gross defects in the axonemal structure."
    explanation: The motility defect occurs without visible axonemal change.
- name: Impaired Mucociliary Clearance
  description: >-
    Weak ciliary beating fails to move mucus out of the nose, sinuses,
    middle ear and bronchi. Retained secretions lead to chronic rhinitis,
    cough and bronchitis, and repeated infection damages the bronchial wall
    into bronchiectasis. This is the general PCD mechanism; it has not been
    measured in CILD37 patients.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: Mucociliary clearance
    modifier: DECREASED
    term:
      id: GO:0120197
      label: mucociliary clearance
  downstream:
  - target: Chronic rhinitis
    causal_link_type: DIRECT
  - target: Cough
    causal_link_type: DIRECT
  - target: Wheezing
    causal_link_type: DIRECT
  - target: Bronchitis
    causal_link_type: DIRECT
  - target: Bronchiectasis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Repeated airway infection and inflammation damage the bronchial wall.
  - target: Conductive hearing impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Middle-ear effusion from failed clearance of the middle ear is the usual cause of conductive hearing loss in PCD.
  evidence:
  - reference: PMID:25927852
    reference_title: "Variation in DNAH1 may contribute to primary ciliary dyskinesia."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "such biological defects are demonstrated clinically by recurrent or chronic sinusitis and bronchiectasis caused by immotile cilia in the upper and lower airways"
    explanation: The index paper's own statement of the general PCD mechanism linking cilia to airway disease.
- name: Defective Left-Right Axis Determination
  description: >-
    Situs inversus with dextrocardia in the proband implies that left-right
    patterning failed, which in PCD follows loss of nodal ciliary flow. The
    step is inferred from the phenotype.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Nodal cilium movement in left-right asymmetry
    modifier: DECREASED
    term:
      id: GO:0060287
      label: epithelial cilium movement involved in determination of left/right asymmetry
  downstream:
  - target: Situs inversus totalis
    causal_link_type: DIRECT
  - target: Dextrocardia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25927852
    reference_title: "Variation in DNAH1 may contribute to primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a chest X-ray and CT scan showed the other two classic KS symptoms in combination with infertility; situs inversus (Figure 1A) and bronchiectasis (Figure 1B)"
    explanation: Laterality defect in the proband.
- name: Inner Dynein Arm Dysfunction in the Sperm Flagellum
  description: >-
    In men with biallelic DNAH1 variants, sperm lack DNAH1 and the inner
    dynein arms, and the axoneme is disorganized, giving multiple
    morphological abnormalities of the flagella. Dnah1 knockout mouse sperm
    swim poorly but look normal. No man with CILD37 has been reported, so
    this branch comes from the allelic disorder SPGF18 and from mice.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Sperm
    term:
      id: CL:0000019
      label: sperm
  cellular_components:
  - preferred_term: Sperm flagellum
    term:
      id: GO:0036126
      label: sperm flagellum
  biological_processes:
  - preferred_term: Flagellated sperm motility
    modifier: DECREASED
    term:
      id: GO:0030317
      label: flagellated sperm motility
  downstream:
  - target: Reduced sperm motility
    causal_link_type: DIRECT
  - target: Male infertility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24360805
    reference_title: "Mutations in DNAH1, which encodes an inner arm heavy chain dynein, lead to male infertility from multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A general axonemal disorganization including mislocalization of the microtubule doublets and loss of the inner dynein arms was observed."
    explanation: Sperm ultrastructure in a man with biallelic DNAH1 variants (SPGF18), not a CILD37 patient.
  - reference: PMID:11371505
    reference_title: "Disruption of an inner arm dynein heavy chain gene results in asthenozoospermia and reduced ciliary beat frequency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the spermatozoa of MDHC7(-/-) mice revealed a dramatic reduced straight line velocity and progressive movement, resulting in the inability of MDHC7-deficient sperm to move from the uterus into the oviduct"
    explanation: Mouse knockout sperm motility defect.

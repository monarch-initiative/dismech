name: Primary Ciliary Dyskinesia 37
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
synonyms:
- CILD37
- ciliary dyskinesia, primary, 37
- DNAH1-related primary ciliary dyskinesia
description: >-
  Primary ciliary dyskinesia 37 (CILD37) is the autosomal recessive form of
  primary ciliary dyskinesia attributed to biallelic variants in DNAH1. DNAH1
  encodes an axonemal dynein heavy chain of the inner dynein arms, the motors
  that shape the ciliary and flagellar waveform. In human respiratory cilia
  DNAH1 is the heavy chain of the single-headed inner arm called IDAd.

  The entity rests on one family. Two sisters born to a consanguineous Saudi
  Arabian union had clinically diagnosed PCD with the Kartagener triad. The
  proband had chronic rhinitis, cough, wheezing and bronchitis from
  adolescence, then bronchiectasis, situs inversus with dextrocardia, mild
  conductive hearing loss and five years of infertility. All known PCD genes
  had been excluded. Homozygosity mapping and exome sequencing found a single
  candidate, the homozygous missense variant DNAH1 c.3460A>C (p.Lys1154Gln),
  which segregated with disease. The authors titled their report as DNAH1
  variation that "may contribute" to PCD. No ciliary ultrastructure, beat
  analysis or nasal nitric oxide was reported for the family, and the
  variant has no functional study. ClinGen rates DNAH1 as Limited for primary
  ciliary dyskinesia in general.

  Biallelic DNAH1 variants are much better established as a cause of male
  infertility with multiple morphological abnormalities of the sperm flagella
  (MMAF), curated separately as Spermatogenic Failure 18 (SPGF18). In those
  men, infertility was the only PCD-type feature. How one gene gives an
  isolated sperm defect in some families and full Kartagener syndrome in
  another is not resolved. Allele severity, a modifier, or a second
  unidentified cause in the index family are all possible. Further DNAH1
  variants turn up in PCD and Kartagener cohorts, mostly as compound
  heterozygous missense changes, but those reports do not test
  pathogenicity. Dnah1 knockout mice support a respiratory role: tracheal
  cilia beat at about half the normal frequency and males are infertile.
disease_term:
  preferred_term: 'ciliary dyskinesia, primary, 37'
  term:
    id: MONDO:0033204
    label: 'ciliary dyskinesia, primary, 37'
parents:
- Primary Ciliary Dyskinesia
- Ciliopathy
notes: >-
  Kept as a separate entry, like the other gene-numbered PCD entries
  (Primary_Ciliary_Dyskinesia_30 and others), because MONDO and OMIM (617577)
  define it as its own disease, separate from spermatogenic failure 18
  (MONDO:0054615), which is the same gene with a sperm-only
  presentation. The umbrella Primary_Ciliary_Dyskinesia entry lists DNAH1 as
  a Limited-evidence gene and carries CILD37 as a pointer subtype row.
  ClinGen classified DNAH1 against primary ciliary dyskinesia
  (MONDO:0016575), not against this numbered entity, so no
  gene_disease_validity assertion is recorded on the genetic row; the
  ClinGen row is quoted as evidence instead. A single case report describes
  glomerulocystic kidney disease in a woman homozygous for another DNAH1
  missense variant (PMID:40896606); its authors call the association
  unproven, so kidney disease is not recorded as a phenotype here. No
  GeneReviews chapter covers CILD37 specifically (just check-genereviews);
  the general Primary Ciliary Dyskinesia chapter (PMID:20301301) is the
  clinical baseline and is tagged in references. It is not cited as
  evidence because its cached PubMed record is only the chapter's purpose
  statement, with no clinical content and no mention of DNAH1.

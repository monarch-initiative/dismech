name: Acute Macular Neuroretinopathy
creation_date: "2026-07-16T00:00:00Z"
description: >-
  Acute macular neuroretinopathy (AMN) is a rare acute retinal disorder,
  classically affecting young women, characterized by sudden paracentral
  scotomas corresponding to reddish-brown, wedge-shaped parafoveal lesions
  pointing toward the fovea. Modern multimodal imaging (OCT, near-infrared
  reflectance, OCT angiography) has established a microvascular etiology:
  ischemia of the deep capillary plexus of the retina infarcts the outer
  plexiform and outer nuclear layers, producing acute OCT hyperreflectivity
  that evolves into persistent outer nuclear layer thinning and long-term
  paracentral visual field deficits. AMN has been associated with febrile/viral
  illness (including dengue, influenza, and COVID-19), oral contraceptive use,
  and other vasoconstrictive or hypercoagulable states, though no proven
  treatment exists.
category: Acquired
disease_term:
  preferred_term: acute macular neuroretinopathy
  term:
    id: MONDO:0044627
    label: acute macular neuroretinopathy
synonyms:
- AMN
- AMNR
parents:
- Retinal disorder
pathophysiology:
- name: Retinal Deep Capillary Plexus Ischemia
  description: >-
    In predisposed individuals, transient microvascular occlusion/ischemia
    develops in the deep capillary plexus (DCP) of the retina, the vascular
    bed supplying the outer plexiform and outer nuclear layers. OCT
    angiography directly demonstrates a flow void in the DCP co-localized
    with the acute lesion, with partial recovery of flow signal on
    follow-up in most cases.
  role: trigger
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  cell_types:
  - preferred_term: Retinal Blood Vessel Endothelial Cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: Cellular Response to Hypoxia
    term:
      id: GO:0071456
      label: cellular response to hypoxia
    modifier: INCREASED
  evidence:
  - reference: PMID:29561336
    reference_title: "OPTICAL COHERENCE TOMOGRAPHY ANGIOGRAPHY OF ACUTE MACULAR NEURORETINOPATHY REVEALS DEEP CAPILLARY ISCHEMIA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Optical coherence tomography angiography illustrated a flow void in
      the deep retinal capillary plexus associated with the AMN lesion.
    explanation: >-
      Directly demonstrates deep capillary plexus flow deficit at the site
      of the AMN lesion via OCT angiography.
  - reference: PMID:30025133
    reference_title: Projection-Resolved OCT Angiography of Microvascular Changes in Paracentral Acute Middle Maculopathy and Acute Macular Neuroretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All five eyes had reduced DCP flow signal, along with normal SCP,
      MCP, and choriocapillaris flow signal in the area of the lesion
    explanation: >-
      Projection-resolved OCTA localizes the AMN flow deficit specifically
      to the deep capillary plexus, distinguishing it from the more
      superficial plexus involvement seen in paracentral acute middle
      maculopathy (PAMM).
  downstream:
  - target: Outer Retinal Photoreceptor Layer Infarction

- name: Outer Retinal Photoreceptor Layer Infarction
  description: >-
    Deep capillary plexus ischemia infarcts the outer plexiform layer (OPL)
    and outer nuclear layer (ONL), producing acute hyperreflectivity at the
    OPL/ONL junction on OCT that enlarges over the first week, with
    disruption of the ellipsoid zone and outer segment/RPE junction. The
    lesion is best visualized as a dark area on near-infrared reflectance
    imaging.
  role: central_effector
  locations:
  - preferred_term: outer plexiform layer of retina
    term:
      id: UBERON:0001790
      label: outer plexiform layer of retina
  - preferred_term: outer nuclear layer of retina
    term:
      id: UBERON:0001789
      label: outer nuclear layer of retina
  cell_types:
  - preferred_term: Photoreceptor Cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  evidence:
  - reference: PMID:22846801
    reference_title: "Acute macular neuroretinopathy: long-term insights revealed by multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients were seen within the first 1 to 2 days of symptoms, and
      both showed outer nuclear and outer plexiform layer hyperreflectivity.
    explanation: >-
      Establishes acute OPL/ONL hyperreflectivity as the earliest OCT
      finding, with lesion enlargement over the following week.
  - reference: PMID:38200478
    reference_title: The characteristics of acute macular neuroretinopathy following COVID-19 infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hyperreflective lesions at the level of the outer plexiform layer
      (OPL) and outer nuclear layer (ONL) and disruption of the ellipsoid
      zone (EZ) on spectral domain optical coherence tomography (SD-OCT)
      B-scans
    explanation: >-
      Confirms the OPL/ONL hyperreflectivity and ellipsoid zone disruption
      pattern as the characteristic acute OCT signature of AMN.
  downstream:
  - target: Persistent Outer Nuclear Layer Thinning and Visual Field Defect

- name: Persistent Outer Nuclear Layer Thinning and Visual Field Defect
  description: >-
    Lesions wider than 100 micrometers develop persistent thinning of the
    outer nuclear layer that correlates with long-term visual field
    deficits (paracentral scotomas). Visual acuity often recovers within
    weeks, but scotomas frequently persist for months or longer.
  role: outcome
  locations:
  - preferred_term: outer nuclear layer of retina
    term:
      id: UBERON:0001789
      label: outer nuclear layer of retina
  evidence:
  - reference: PMID:22846801
    reference_title: "Acute macular neuroretinopathy: long-term insights revealed by multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thinning of the outer nuclear layer persisted in all patients with
      lesions >100 μm width, and in one patient this thinning worsened
      over the course of follow-up
    explanation: >-
      Demonstrates the size-dependent persistence of ONL thinning and its
      correlation with long-term functional (visual field) deficits.
  - reference: PMID:38200478
    reference_title: The characteristics of acute macular neuroretinopathy following COVID-19 infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all patients achieved a BCVA of 20/40 or better, but 9 patients
      (81.8%) continued to experience persistent scotomas
    explanation: >-
      Shows that visual acuity typically recovers while paracentral
      scotomas frequently persist, consistent with the structural ONL
      thinning outcome.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_deep_capillary_plexus_ischemia_model
  hypothesis_label: Canonical Deep Capillary Plexus Ischemia Model
  status: CANONICAL
  description: >-
    Ischemia/microvascular occlusion of the retinal deep capillary plexus
    infarcts the outer plexiform and outer nuclear layers, producing the
    characteristic acute OCT hyperreflectivity and long-term photoreceptor
    layer thinning. This is the predominant model in the current literature,
    supported by OCT angiography studies directly localizing the flow
    deficit to the deep capillary plexus.
  evidence:
  - reference: PMID:29561336
    reference_title: "OPTICAL COHERENCE TOMOGRAPHY ANGIOGRAPHY OF ACUTE MACULAR NEURORETINOPATHY REVEALS DEEP CAPILLARY ISCHEMIA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Optical coherence tomography angiography illustrated a flow void in
      the deep retinal capillary plexus associated with the AMN lesion.
    explanation: Direct OCTA evidence for the deep capillary plexus ischemia model.
- hypothesis_group_id: emerging_choriocapillaris_perfusion_deficit_model
  hypothesis_label: Emerging Choriocapillaris Perfusion Deficit Model
  status: EMERGING
  description: >-
    An alternative hypothesis proposes that the primary perfusion deficit in
    AMN lies in the choriocapillaris and choroid rather than the deep
    capillary plexus, based on quantitative OCTA vessel-area-density analysis
    finding no retinal-layer flow differences but significantly reduced
    choriocapillaris and choroidal density in COVID-19-associated AMN cases.
  notes: >-
    Based on a single small retrospective series (n=6) of SARS-CoV-2-related
    AMN; the authors themselves note this contradicts "the predominant
    hypothesis in current literature." Retained as EMERGING pending
    independent replication and confirmation in non-COVID AMN cohorts.
  evidence:
  - reference: PMID:38512510
    reference_title: "Optical coherence tomography angiography suggests choriocapillaris perfusion deficit as etiology of acute macular neuroretinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggests that a perfusion deficit in the choroidal layers is
      responsible for AMN rather than in the DCP, which is the predominant
      hypothesis in current literature.
    explanation: >-
      Primary evidence for the emerging choriocapillaris/choroidal
      perfusion-deficit alternative to the canonical DCP-ischemia model.

phenotypes:
- category: Ophthalmologic
  name: Paracentral scotoma
  description: >-
    Acute onset of one or more paracentral scotomas is the characteristic
    presenting symptom, corresponding spatially to the fundus lesion.
  phenotype_term:
    preferred_term: Paracentral scotoma
    term:
      id: HP:0030528
      label: Paracentral scotoma
  evidence:
  - reference: PMID:26973287
    reference_title: "Acute macular neuroretinopathy: A comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute onset of paracentral scotomas corresponding to the clinically
      evident lesions is both common and characteristic.
    explanation: Establishes paracentral scotoma as the characteristic presenting symptom.
- category: Ophthalmologic
  name: Acute photoreceptor layer disruption
  description: >-
    Acute hyperreflectivity and disruption of the photoreceptor layer at
    the outer plexiform/outer nuclear layer junction is seen on macular OCT
    at presentation.
  phenotype_term:
    preferred_term: Photoreceptor layer loss on macular OCT
    term:
      id: HP:0030609
      label: Photoreceptor layer loss on macular OCT
    temporality: ACUTE
  evidence:
  - reference: PMID:38200478
    reference_title: The characteristics of acute macular neuroretinopathy following COVID-19 infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hyperreflective lesions at the level of the outer plexiform layer
      (OPL) and outer nuclear layer (ONL) and disruption of the ellipsoid
      zone (EZ) on spectral domain optical coherence tomography (SD-OCT)
      B-scans
    explanation: Documents the acute OCT photoreceptor-layer disruption finding.
- category: Ophthalmologic
  name: Persistent outer nuclear layer thinning
  description: >-
    Chronic thinning of the outer nuclear layer develops at the site of
    larger lesions and persists on long-term follow-up.
  phenotype_term:
    preferred_term: Central thinning of the outer nuclear layer of the retina
    term:
      id: HP:6000367
      label: Central thinning of the outer nuclear layer of the retina
    temporality: CHRONIC
  evidence:
  - reference: PMID:22846801
    reference_title: "Acute macular neuroretinopathy: long-term insights revealed by multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thinning of the outer nuclear layer persisted in all patients with
      lesions >100 μm width
    explanation: Documents persistent ONL thinning as a long-term structural sequela.

prevalence:
- population: Cases in the English and non-English language literature, 1975-2014
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    AMN is a rare condition with no population-based prevalence studies; the
    2016 comprehensive literature review identified 101 reported cases across
    nearly 40 years.
  evidence:
  - reference: PMID:26973287
    reference_title: "Acute macular neuroretinopathy: A comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We review 101 reported cases in the English and non-English language
      literature identified from 1975, when acute macular neuroretinopathy
      was first described, to December, 2014.
    explanation: Documents the rarity of AMN via the total literature case count.

environmental:
- name: Oral Contraceptive Use
  presence: Positive
  description: >-
    AMN was originally described in young women using oral contraceptives,
    and oral contraceptive use remains a recognized association, consistent
    with a role for hormonally-mediated hypercoagulability/vasoconstriction
    in the microvascular ischemic mechanism.
  exposure_term:
    preferred_term: Oral contraceptive exposure
    term:
      id: ECTO:0000509
      label: exposure to drug
  evidence:
  - reference: PMID:1180301
    reference_title: Acute macular neuroretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An unrecognized acute macular affection occurred in four women, 24 to
      35 years old, using oral contraceptives who complained of a sudden
      decrease of visual acuity or paracentral scotomas.
    explanation: >-
      The original 1975 case series defining AMN identified oral
      contraceptive use as a shared exposure among all four affected women.
- name: Preceding Febrile/Viral Illness or Vaccination
  presence: Positive
  description: >-
    AMN has been repeatedly reported to follow a preceding systemic febrile
    or viral illness (influenza, dengue, SARS-CoV-2) or vaccination by days,
    consistent with a trigger-driven microvascular ischemic event.
  exposure_term:
    preferred_term: Infectious agent exposure
    term:
      id: ECTO:3000000
      label: exposure to organism
  evidence:
  - reference: PMID:38200478
    reference_title: The characteristics of acute macular neuroretinopathy following COVID-19 infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AMN is a rare retinal disease that has been reported to occur
      following dengue fever, influenza virus infection, and influenza
      vaccination, but the exact mechanisms underlying this association
      remain unknown.
    explanation: >-
      Documents the recurring association between AMN onset and a
      preceding febrile/viral illness or vaccination across multiple
      pathogens.

diagnosis:
- name: Near-infrared reflectance and OCT imaging
  description: >-
    Near-infrared reflectance imaging best visualizes the dark parafoveal
    lesion, while spectral-domain OCT shows the characteristic acute
    OPL/ONL hyperreflectivity evolving to outer nuclear layer thinning and
    ellipsoid zone disruption.
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  results: "Dark wedge-shaped parafoveal lesion on near-infrared reflectance; OPL/ONL hyperreflectivity evolving to ONL thinning and ellipsoid zone disruption on OCT."
  evidence:
  - reference: PMID:22846801
    reference_title: "Acute macular neuroretinopathy: long-term insights revealed by multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infrared reflectance highlights the lesion best, and abnormalities on
      near IR autofluorescence may be present.
    explanation: Establishes near-infrared reflectance as the most sensitive imaging modality for AMN lesion detection.
- name: OCT angiography of the deep capillary plexus
  description: >-
    OCT angiography localizes reduced flow signal to the deep capillary
    plexus at the site of the lesion, distinguishing AMN from the more
    superficial vascular involvement of paracentral acute middle
    maculopathy.
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  results: "Reduced/absent flow signal in the deep capillary plexus co-localized with the OCT/near-infrared lesion, with partial recovery on follow-up."
  evidence:
  - reference: PMID:30025133
    reference_title: Projection-Resolved OCT Angiography of Microvascular Changes in Paracentral Acute Middle Maculopathy and Acute Macular Neuroretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three eyes with AMN and follow-up had recovery of DCP flow.
    explanation: Documents OCTA-detectable deep capillary plexus flow deficit and its partial recovery.

treatments:
- name: Observation and supportive management
  description: >-
    No pharmacologic or interventional treatment has proven effective for
    AMN; management consists of observation and monitoring, since surgery
    and pharmacotherapy have no established role in this ischemic outer
    retinal condition.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26973287
    reference_title: "Acute macular neuroretinopathy: A comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the pathogenesis of acute macular neuroretinopathy is
      complex, recent research suggests a microvascular etiology.
    explanation: >-
      Underscores that despite advances in understanding AMN's microvascular
      etiology, no proven pharmacologic treatment has emerged; management
      remains observational.

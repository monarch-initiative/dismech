    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired T-cell immune surveillance is the conventional explanation for
      lymphoma in a combined immunodeficiency, and several of the reported
      lymphomas were EBV-associated. It is not established mechanistically in
      these cohorts, and one reported lymphoma was EBV-negative.
- name: Impaired Humoral Immunity
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    B-cell lymphopenia and hypogammaglobulinemia, the entry's two most prevalent
    immunological findings after the T-cell defect. Nine of ten patients in the
    second cohort were hypogammaglobulinemic, and B-cell lymphopenia is variable
    but reaches near-absence in the most severely affected.

    Graded HYPOTHETICAL because the mechanism is inferred, not measured. Loss of
    CD4 help is the conventional explanation and is why this node hangs off
    T-Cell Lymphopenia, but no source in these cohorts tests whether the B-cell
    deficit is T-cell-dependent or B-cell-intrinsic - and FCHO1 is expressed in
    B cells too, so a cell-intrinsic contribution is not excluded. The edge is
    curated so the humoral findings are reachable from the pathograph; its
    confidence grading is what says the route is assumed.

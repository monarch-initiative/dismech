name: Immunodeficiency 76
creation_date: '2026-09-10T18:00:00Z'
category: Mendelian
description: >-
  An autosomal recessive combined immunodeficiency caused by biallelic
  loss-of-function variants in FCHO1. FCHO1 is one of the earliest proteins
  recruited to a nascent clathrin-coated pit: its F-BAR domain binds PI(4,5)P2
  and bends the membrane, its mu-homology domain binds EPS15 and cargo, and its
  linker allosterically activates the AP-2 adaptor complex that recruits
  clathrin. Losing it therefore does not disable one receptor but the initiation
  step of clathrin-mediated endocytosis itself. FCHO1 is expressed predominantly
  in lymphoid cells, which is why a defect in a general membrane-trafficking
  pathway presents as an immunological disease rather than a multisystem one -
  the paralogue FCHO2 covers other tissues. The clinical picture is severe
  infection from infancy with CD4+ T-cell lymphopenia, and a striking excess of
  B-cell lymphoma. The mechanistic interest of the entry is that the T-cell
  lymphopenia is not a thymic output failure: patient T cells are made with a
  normal repertoire, but proliferate poorly and die on activation.
categories:
- Inborn Error of Immunity
- Combined Immunodeficiency
- Membrane Trafficking Disorder
parents:
- combined immunodeficiency
synonyms:
- IMD76
- FCHO1 deficiency
- combined immunodeficiency due to FCHO1 deficiency
disease_term:
  preferred_term: immunodeficiency 76
  term:
    id: MONDO:0030898
    label: immunodeficiency 76
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients are homozygous for FCHO1 loss-of-function alleles, and
    most come from consanguineous kindreds.
  evidence:
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identify ten unrelated patients with variable T and B cell lymphopenia, who are
      homozygous for six distinct mutations in FCHO1.'
    explanation: Ten patients across unrelated families, all homozygous, which is the segregation
      pattern that establishes recessive inheritance.
epidemiology:
- name: Reported case count
  description: >-
    Ultra-rare. The disease was defined in 2019-2020 by two independent cohorts
    totalling fifteen patients, and the literature has grown only slowly since.
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Here we report five patients (P1-P5) from unrelated families of Italian (P1), Turkish
      (P2, P3, and P5) and Algerian (P4) origin'
    explanation: The first of the two founding cohorts, giving five patients and their origins.
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We collected seven pedigrees with ten patients presenting with features of T-cell
      immunodeficiency'
    explanation: The second founding cohort, ten patients in seven pedigrees, published within a
      year of the first.
genetic:
- name: FCHO1
  gene_term:
    preferred_term: FCHO1
    term:
      id: hgnc:29002
      label: FCHO1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants. Reported alleles span frameshift and
    nonsense truncations, canonical splice-site changes, and missense
    substitutions in either of the two functional domains - p.A34P in the F-BAR
    domain and p.R679P in the mu-homology domain. That both domains yield the
    same disease is what shows the requirement is for the intact initiation
    function rather than for one binding partner.
  evidence:
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'We demonstrate that these mutations either lead to mislocalisation of the protein or
      prevent its interaction with binding partners.'
    explanation: Establishes the two molecular consequences of the reported alleles, which is the
      functional evidence that they are loss of function rather than benign variation.
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Western-blotting analysis of HA- or FLAG-tagged FCHO1 constructs showed expression of
      truncated products corresponding to P2 and P3, whereas no protein was detected for P4'
    explanation: Shows the truncating alleles produce either a shortened protein or none at all,
      confirming loss of the full-length product.
- name: FCHO2
  gene_term:
    preferred_term: FCHO2
    term:
      id: hgnc:25180
      label: FCHO2
  relationship_type: MODIFIER
  notes: >-
    Not a disease gene here, but the reason the disease is immunological. FCHO2
    is the paralogue that performs the same initiation step, and the two are
    expressed in different tissues. Where FCHO2 is abundant, loss of FCHO1 is
    buffered.
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'FCHO1 was predominantly expressed in lymphoid cells, whereas FCHO2 was more
      abundantly expressed in fibroblasts and K562 cells'
    explanation: The expression measurement that explains tissue restriction - a general
      trafficking defect confined to the compartment where the paralogue is not available.
pathophysiology:
- name: FCHO1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Biallelic FCHO1 variants either abolish the protein,
    mislocalise it, or leave it unable to bind its partners. FCHO1 acts at the
    very start of clathrin-coated pit formation - binding PI(4,5)P2 through the
    F-BAR domain, EPS15 and cargo through the mu-homology domain, and
    allosterically activating AP-2 through its linker.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: FCHO1
    term:
      id: hgnc:29002
      label: FCHO1
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Through the N-terminal F-BAR domain, they bind to phosphatidylinositol
      4,5-biphosphate (PI(4,5)P2) on the inner side of the cell membrane, inducing and stabilizing
      membrane curvature.'
    explanation: States the molecular function of the domain lost in the p.A34P and exon-6-skipping
      alleles, which is what makes this the initiating step rather than a downstream one.
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Moreover, the linker region of FCHO1 acts as an allosteric activator of the adaptor
      protein 2 (AP-2) complex, enabling recruitment of clathrin to the assembling coat.'
    explanation: Names the third function - AP-2 activation - so the node covers every arm a
      loss-of-function allele can remove.
  downstream:
  - target: Impaired Clathrin-Coated Pit Formation
    causal_link_type: DIRECT
    description: Without functional FCHO1 the nascent coat does not assemble normally.
    evidence:
    - reference: PMID:32098969
      reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
        and function of T cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Live-cell imaging of cells expressing mutant variants of FCHO1 provide evidence of
        impaired formation of clathrin coated pits (CCP).'
      explanation: Direct imaging of the next step in cells carrying the patient alleles, which is
        what makes this a measured edge rather than an inferred one.
- name: Impaired Clathrin-Coated Pit Formation
  biological_scale: MOLECULAR
  description: >-
    Nascent clathrin-coated pits fail to assemble properly. This is the step
    FCHO1 exists to perform, and it is measured directly by live-cell imaging in
    cells expressing the patient variants.
  biological_processes:
  - preferred_term: clathrin coat assembly
    modifier: DECREASED
    term:
      id: GO:0048268
      label: clathrin coat assembly
  evidence:
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Clathrin-dependent endocytosis (CME) is initiated at the plasma membrane by the
      recruitment of adaptors'
    explanation: Places coat initiation, rather than a later step, as the point in the pathway
      where FCHO1 acts.
  downstream:
  - target: Defective Clathrin-Mediated Endocytosis
    causal_link_type: DIRECT
    description: Fewer and less competent coated pits mean less cargo internalised.
    evidence:
    - reference: PMID:32098969
      reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
        and function of T cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Our experiments demonstrate that the absence of functional FCHO1 results in
        perturbed clathrin-mediated endocytosis in several tissues, as well as dysfunctional
        internalisation of the TCR.'
      explanation: States the causal step from loss of the protein to a perturbed pathway, and
        names the cargo that matters for the immunological phenotype.
- name: Defective Clathrin-Mediated Endocytosis
  biological_scale: CELLULAR
  description: >-
    Cargo that depends on clathrin is internalised poorly. The defect is partial
    rather than absolute, and it is selective for the clathrin route - in the
    same patient cells a clathrin-independent internalisation pathway is
    preserved, which is the internal control that makes the attribution specific.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: clathrin-dependent endocytosis
    modifier: DECREASED
    term:
      id: GO:0072583
      label: clathrin-dependent endocytosis
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Although transferrin internalization was readily observed in control T cells, it was
      minimally detectable in P2'
    explanation: Measures the pathway directly in patient T cells using transferrin, the standard
      clathrin-dependent cargo.
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In contrast, TCR/CD3 internalization, which is clathrin-independent,9 was preserved
      in activated T cells from P2'
    explanation: The negative control in the same cells. A clathrin-independent route still works,
      so the deficit is specific to clathrin rather than a general sick-cell effect.
  downstream:
  - target: Defective T-Cell Receptor Signalling and Proliferation
    causal_link_type: DIRECT
    description: >-
      TCR internalisation depends on the clathrin route in the FCHO1-deficient
      setting, and its failure leaves T cells unresponsive to receptor triggering.
    evidence:
    - reference: PMID:32098969
      reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
        and function of T cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Internalisation of the TCR receptor is severely perturbed in FCHO1-deficient Jurkat
        T cells but can be rescued by expression of wild-type FCHO1.'
      explanation: A rescue experiment, which is the strongest form of this edge - restoring the
        gene restores the trafficking step.
  - target: Increased Activation-Induced T-Cell Death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Activated patient cells die rather than divide. Clathrin has an established
      role in mitosis, which the authors propose as the link, but the intermediate
      steps are not established here.
    evidence:
    - reference: PMID:30822429
      reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
        deficiency in human subjects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'We found that after activation through CD3/CD28, PBMCs from P2 showed a high
        percentage of hypodiploid cells, a marker of apoptosis, and reduced percentages of cells in
        the S and G2/M phases of the cell cycle'
      explanation: Measures both the death and the cell-cycle arrest that accompanies it. Graded as
        an indirect edge because the mitotic link is proposed rather than demonstrated.
- name: Defective T-Cell Receptor Signalling and Proliferation
  biological_scale: CELLULAR
  description: >-
    Patient T cells activate but do not expand. Early and late activation markers
    come up normally, so the block is downstream of receptor engagement, in the
    proliferative response itself - two to four rounds of division against five to
    seven in controls.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'T cells from P2 displayed normal expression of early and late T-cell activation
      markers (CD69, CD25, and CD71), but reduced proliferation on activation through CD3/CD28'
    explanation: Localises the defect precisely - activation is intact, proliferation is not - which
      is why this node is about proliferation rather than about activation.
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In particular, T cells from P2 entered only 2 to 4 rounds of cell division, whereas T
      cells from controls entered 5 to 7 rounds of proliferation.'
    explanation: Quantifies the proliferation deficit against controls, which matters because each
      missed division costs an exponential amount of final T-cell number.
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Patient T cells are unresponsive to T cell receptor (TCR) triggering.'
    explanation: The independent cohort's version of the same finding, stated at the level of
      receptor responsiveness.
  downstream:
  - target: T-Cell Lymphopenia
    causal_link_type: DIRECT
    description: Failure to expand, compounded by death on activation, depletes the peripheral pool.
    evidence:
    - reference: PMID:30822429
      reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
        deficiency in human subjects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Overall, these results strongly suggest that defective T-cell proliferation and
        increased activation-induced cell death, rather than impaired thymic output, are major
        contributors to the T-cell lymphopenia observed in patients with FCHO1 deficiency.'
      explanation: The authors' own causal statement, and importantly it excludes the competing
        explanation - this is peripheral loss, not a thymic output failure.
- name: Increased Activation-Induced T-Cell Death
  biological_scale: CELLULAR
  description: >-
    Rather than dividing, activated patient T cells accumulate hypodiploid DNA
    content and drop out of S and G2/M. This is a second, additive route to the
    lymphopenia alongside the proliferation block.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: activation-induced cell death of T cells
    modifier: INCREASED
    term:
      id: GO:0006924
      label: activation-induced cell death of T cells
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: 'Prior studies have demonstrated that clathrin is important for mitosis.'
    explanation: The mechanistic rationale the authors offer for why a trafficking protein should
      affect cell division. Marked INDIRECT because it is background about clathrin generally, not
      a measurement in this disease; the measurement itself sits on the edge into this node.
  downstream:
  - target: T-Cell Lymphopenia
    causal_link_type: DIRECT
    description: Cells lost at each activation event fail to accumulate as a peripheral pool.
- name: T-Cell Lymphopenia
  biological_scale: ORGANISM
  description: >-
    The immunological centrepiece. CD4+ T-cell deficiency is the one finding
    shared by every reported patient, with severity ranging from a moderate CD4
    reduction to a near-absent T- and B-cell compartment. T-cell repertoire
    diversity and clonal abundance are preserved, consistent with normal
    generation followed by peripheral loss.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell homeostasis
    modifier: DECREASED
    term:
      id: GO:0043029
      label: T cell homeostasis
  evidence:
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Thus, the common immunophenotypic denominator for all these patients was CD4+ T-cell
      deficiency.'
    explanation: Identifies the single finding common to the whole cohort, which is what makes this
      the central node rather than one of several.
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Immunological parameters were ranging from a moderate decrease in peripheral CD4+ T
      cells (F2 and G1) to severe combined immunodeficiency with virtually absent B- and T-cells
      (A1, B1, E1).'
    explanation: Gives the range of severity across the cohort, which is why the entry does not
      describe a single stereotyped immunophenotype.
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Notably, no abnormalities of T-cell repertoire diversity, composition and clonal
      abundance were observed in circulating T cells from P2'
    explanation: The negative finding that distinguishes peripheral loss from a developmental block
      - the cells present are a normal repertoire, just too few.
  downstream:
  - target: Susceptibility to Severe and Opportunistic Infection
    causal_link_type: DIRECT
    description: Loss of the CD4 compartment removes helper function for cellular and humoral
      responses alike.
  - target: B-Cell Lymphomagenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired T-cell immune surveillance is the conventional explanation for
      lymphoma in a combined immunodeficiency, and several of the reported
      lymphomas were EBV-associated. It is not established mechanistically in
      these cohorts, and one reported lymphoma was EBV-negative.
- name: Susceptibility to Severe and Opportunistic Infection
  biological_scale: ORGANISM
  description: >-
    Recurrent and severe infection from early childhood, spanning bacterial,
    mycobacterial, viral and fungal organisms, including opportunists such as
    Pneumocystis jirovecii, disseminated Mycobacterium genavense and
    Cryptosporidium.
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'manifesting as recurrent and severe infections of bacterial, mycobacterial, viral and
      fungal origin, and profound T cell lymphopenia'
    explanation: Names the breadth of organisms, which is what marks this as a combined rather than
      a narrowly antibody-mediated defect.
- name: B-Cell Lymphomagenesis
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    An unusually high lymphoma burden for a cohort this size - four of the fifteen
    founding patients. Both diffuse large B-cell lymphoma and Hodgkin lymphoma
    have been reported, and both EBV-positive and EBV-negative cases occur. Graded
    HYPOTHETICAL because no source in this entry demonstrates the mechanism;
    failed T-cell surveillance is the plausible explanation, not a measured one,
    and the EBV-negative case argues against a purely viral route.
  evidence:
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Three patients (B1, C1, D1) developed B-cell lymphoma prior to allogeneic
      hematopoietic stem cell transplantation'
    explanation: Three lymphomas in a ten-patient cohort, which is the observation this node rests
      on.
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'P3 had EBV-negative diffuse large B cell lymphoma.'
    explanation: The EBV-negative case. It is the reason this node is not modelled as EBV-driven
      lymphoproliferation.
phenotypes:

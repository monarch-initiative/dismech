- name: T-Cell Lymphopenia
  biological_scale: ORGANISM
  description: >-
    The immunological centrepiece. CD4+ T-cell deficiency is the one finding
    shared by every reported patient, with severity ranging from a moderate CD4
    reduction to a near-absent T- and B-cell compartment.

    How the pool is lost is contested between the two founding cohorts, and the
    entry records that rather than picking a side. Calzoni et al. argue for
    peripheral loss - defective proliferation and activation-induced death rather
    than impaired thymic output - and support it with preserved T-cell repertoire
    diversity, composition and clonal abundance in a patient. Lyszkiewicz et al.
    argue for a developmental contribution, supported by pharmacological CME
    inhibition delaying differentiation at the DN3 to double-positive transition.
    Both upstream nodes are curated and both feed this one; the peripheral arm
    carries direct patient measurements, the developmental arm carries an in
    vitro pharmacological model, and that asymmetry is reflected in their
    mechanism_confidence gradings rather than in the prose.

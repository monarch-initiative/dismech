  downstream:
  - target: Impaired Humoral Immunity
    causal_link_type: DIRECT
    description: >-
      Loss of the CD4 compartment removes the T-cell help that B cells need for
      class switching and antibody production.
  - target: Susceptibility to Severe and Opportunistic Infection
    causal_link_type: DIRECT
    description: Loss of the CD4 compartment removes helper function for cellular and humoral

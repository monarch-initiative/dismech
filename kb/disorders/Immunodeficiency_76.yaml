discussions:
- discussion_id: fcho1_lymphoma_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#B-Cell Lymphomagenesis
  prompt: >-
    Why do four of the fifteen founding FCHO1-deficient patients develop B-cell
    lymphoma, and is the mechanism failed T-cell immune surveillance or a
    B-cell-intrinsic consequence of defective clathrin-mediated endocytosis?
  rationale: >-
    The lymphoma burden is high for a cohort of this size and is a leading cause
    of death, so the answer bears on surveillance recommendations. Failed T-cell
    surveillance is assumed but not demonstrated in either founding cohort, and
    the reported cases include both EBV-positive and EBV-negative lymphomas, which
    a purely viral-reactivation account does not explain. FCHO1 is expressed in B
    cells as well as T cells, and no study has yet asked whether B-cell antigen
    receptor trafficking is affected.
notes: >-
  Curated from the two founding cohorts (PMID:30822429, PMID:32098969), which
  together describe fifteen patients and supply both the clinical spectrum and the
  functional work. Both are open access, so several snippets are quoted from the
  full text rather than the abstract; the cohort tables are quoted as table-row
  fragments, which are exact substrings of the cached record.

  The two cohorts disagree on two substantive points, and the entry curates both
  disagreements as opposing evidence items rather than resolving them in prose.

  First, on transferrin. Calzoni et al. report transferrin internalisation as
  minimally detectable in patient T cells and use it as the primary demonstration
  of a clathrin-endocytosis defect; Lyszkiewicz et al. report transferrin receptor
  endocytosis - and VSV-G-mediated virus entry, also strictly clathrin-dependent -
  as apparently unaffected, and conclude that FCHO1 deficiency does not generally
  impair clathrin-dependent processes. Same cargo, same cell type, opposite
  results, and neither paper addresses the other. The Defective
  Clathrin-Mediated Endocytosis node carries the Calzoni result as SUPPORT and the
  Lyszkiewicz conclusion as REFUTE.

  Second, on where the T cells are lost. Calzoni et al. argue for peripheral loss
  and explicitly exclude impaired thymic output; Lyszkiewicz et al. title their
  paper for a developmental role and support it with pharmacological CME
  inhibition blocking the DN3 to double-positive transition, with B-cell and
  granulocyte development from the same progenitors unaffected as a specificity
  control. Both arms are curated as upstream nodes of T-Cell Lymphopenia. The
  developmental node is graded HYPOTHETICAL because its evidence is
  pharmacological inhibition in vitro rather than an FCHO1-deficient thymus, and
  it carries the Calzoni exclusion as a REFUTE item.

  Impaired Humoral Immunity is likewise graded HYPOTHETICAL. The B-cell
  lymphopenia and hypogammaglobulinemia are well documented, but no source tests
  whether they are T-cell-dependent or B-cell-intrinsic, and FCHO1 is expressed in
  B cells. The node exists so the humoral findings are reachable from the
  pathograph; its grading is what records that the route through CD4 help is
  assumed rather than measured.

  Frequency bands are taken from patient counts in the two cohort tables rather
  than from any pooled published figure, since no review reports frequencies for
  this disease. With fifteen patients in total these bands are coarse, and they
  are recorded at the level the sources support rather than at a precision the
  literature does not have.

  No GeneReviews chapter exists for immunodeficiency 76 as of this curation; a
  PubMed search for a GeneReviews article on FCHO1 deficiency returned nothing.

  Two patients in the second cohort had neurological findings - Moyamoya syndrome
  with microcephaly in one, mild brain atrophy in another. These are deliberately
  not curated as phenotypes: they are single occurrences in a fifteen-patient
  literature, the cohort paper does not attribute them to FCHO1, and no mechanism
  has been proposed. They are recorded here so a later curator does not have to
  rediscover them.

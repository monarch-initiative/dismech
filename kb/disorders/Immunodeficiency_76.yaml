    snippet: 'Whole exome sequencing (P1, P2, P4, and P5) and targeted sequencing of a large panel
      of primary immune deficiency-related genes (P3) identified bi-allelic private FCHO1
      mutations, which were subsequently confirmed by means of Sanger sequencing'
    explanation: Describes both diagnostic routes actually used, and the confirmatory step.

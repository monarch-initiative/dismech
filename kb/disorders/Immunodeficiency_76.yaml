treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only definitive treatment. Reported outcomes include long-term survival
    with full donor chimerism, cleared pre-transplant infections and normal immune
    function off immunoglobulin replacement. It does not reliably correct growth
    failure, and post-transplant lymphoproliferative disease has occurred.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: T-Cell Lymphopenia
    description: Replaces the FCHO1-deficient haematopoietic compartment with donor cells carrying
      functional FCHO1, restoring the T-cell pool at its source.
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Three patients (P3-P5) died in childhood, whereas P1 and P2 are alive with full donor
      chimerism after allogeneic hematopoietic stem cell transplantation (HSCT) and have cleared
      pre-transplantation infections.'
    explanation: Contrasts transplanted with untransplanted patients in the same cohort, which is
      the clearest available statement of benefit for a disease this rare. Note this is an
      uncontrolled comparison within five patients, not a trial result.
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'complete donor chimerism, normal immune function, off IVIG, 10 yrs follow up'
    explanation: A ten-year follow-up with normal immune function and withdrawal of immunoglobulin
      replacement, which is the outcome measure that matters clinically.
- name: Immunoglobulin Replacement Therapy
  description: >-
    Intravenous immunoglobulin, used to cover the hypogammaglobulinemia while
    patients await transplantation and discontinued after successful engraftment.
    It addresses the antibody deficit only, not the T-cell defect.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Susceptibility to Severe and Opportunistic Infection
    description: Supplies the antibody the patient cannot make, reducing infection burden without
      correcting the underlying trafficking defect.
  evidence:
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'IVIG replacement and antibiotics; awaiting allo-HSCT'
    explanation: Describes the holding regimen used in this cohort, which is the role
      immunoglobulin replacement plays in this disease.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Whole exome sequencing, or a targeted primary-immunodeficiency gene panel,
    with Sanger confirmation. FCHO1 is absent from older panels, so exome
    sequencing has been the usual route to diagnosis.
  evidence:
  - reference: PMID:30822429
    reference_title: F-BAR domain only protein 1 (FCHO1) deficiency is a novel cause of combined immune
      deficiency in human subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Whole exome sequencing (P1, P2, P4, and P5) and targeted sequencing of a large panel
      of primary immune deficiency-related genes (P3) identified bi-allelic private FCHO1
      mutations, which were subsequently confirmed by means of Sanger sequencing'
    explanation: Describes both diagnostic routes actually used, and the confirmatory step.
- name: Lymphocyte subset enumeration
  description: >-
    Flow cytometric enumeration of T-, B- and NK-cell subsets. CD4+ T-cell
    deficiency is the common denominator and is what should prompt the genetic
    workup.
  evidence:
  - reference: PMID:32098969
    reference_title: Human FCHO1 deficiency reveals role for clathrin-mediated endocytosis in development
      and function of T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Thus, the common immunophenotypic denominator for all these patients was CD4+ T-cell
      deficiency.'
    explanation: Names the specific subset abnormality this test is looking for.
discussions:
- discussion_id: fcho1_lymphoma_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#B-Cell Lymphomagenesis
  prompt: >-
    Why do four of the fifteen founding FCHO1-deficient patients develop B-cell
    lymphoma, and is the mechanism failed T-cell immune surveillance or a
    B-cell-intrinsic consequence of defective clathrin-mediated endocytosis?
  rationale: >-
    The lymphoma burden is high for a cohort of this size and is a leading cause
    of death, so the answer bears on surveillance recommendations. Failed T-cell
    surveillance is assumed but not demonstrated in either founding cohort, and
    the reported cases include both EBV-positive and EBV-negative lymphomas, which
    a purely viral-reactivation account does not explain. FCHO1 is expressed in B
    cells as well as T cells, and no study has yet asked whether B-cell antigen
    receptor trafficking is affected.
notes: >-
  Curated from the two founding cohorts (PMID:30822429, PMID:32098969), which
  together describe fifteen patients and supply both the clinical spectrum and the
  functional work. Both are open access, so several snippets are quoted from the
  full text rather than the abstract; the cohort tables are quoted as table-row
  fragments, which are exact substrings of the cached record.

  Frequency bands are taken from patient counts in the two cohort tables rather
  than from any pooled published figure, since no review reports frequencies for
  this disease. With fifteen patients in total these bands are coarse, and they
  are recorded at the level the sources support rather than at a precision the
  literature does not have.

  No GeneReviews chapter exists for immunodeficiency 76 as of this curation; a
  PubMed search for a GeneReviews article on FCHO1 deficiency returned nothing.

  Two patients in the second cohort had neurological findings - Moyamoya syndrome
  with microcephaly in one, mild brain atrophy in another. These are deliberately
  not curated as phenotypes: they are single occurrences in a fifteen-patient
  literature, the cohort paper does not attribute them to FCHO1, and no mechanism
  has been proposed. They are recorded here so a later curator does not have to
  rediscover them.

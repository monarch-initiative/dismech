      achlorhydria (hypergastrinemia, iron-deficiency anemia) as frequent
      features, providing indirect (partial) human corroboration; it does
      not directly measure gastric acid secretion in JLNS patients.

genetic:
- name: KCNQ1
  gene_term:
    preferred_term: KCNQ1
    term:
      id: hgnc:6294
      label: KCNQ1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: >-
    the major molecular subtype of JLNS, accounting for the large majority
    of cases
  case_fractions:
  - population: JLNS cases (mixed-cohort/case-based literature)
    case_fraction_percent: 90.0
    notes: >-
      Approximately 90% of JLNS cases are attributable to biallelic KCNQ1
      variants; the remainder are attributable to KCNE1 (JLNS2).
    evidence:
    - reference: PMID:32508908
      reference_title: "Jervell and Lange-Nielsen Syndrome due to a Novel Compound Heterozygous KCNQ1 Mutation in a Chinese Family."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Approximately 90% of JLNS cases are caused by KCNQ1 gene mutations."
      explanation: Quantifies the KCNQ1 (JLNS1) share of all JLNS cases.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most mutations (90.5%) are on the KCNQ1 gene; mutations on the KCNE1 gene are associated with a more benign course."
    explanation: Independent cohort confirms the ~90% KCNQ1 share and the more severe course relative to KCNE1-related JLNS2.
  - reference: PMID:37872640
    reference_title: "Beyond gene-disease validity: capturing structured data on inheritance, allelic requirement, disease-relevant variant classes, and disease mechanism for inherited cardiac conditions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      both PTCs and missense variants leading to LoF of KCNQ1 are associated
      with LQTS and Jervell Lange-Nielsen syndrome
    explanation: >-
      Structured ClinGen-aligned gene-disease curation confirms KCNQ1
      loss-of-function (protein-truncating and missense) as the JLNS1
      mechanism, classified with biallelic autosomal requirement.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  description: >-
    JLNS1 requires biallelic (homozygous or compound heterozygous)
    loss-of-function KCNQ1 variants. Heterozygous carrier parents are usually
    unaffected or, less often, manifest dominant Romano-Ward LQT1; each
    sibling of an affected individual has a 25% chance of being affected, a
    50% chance of being a carrier, and a 25% chance of being unaffected and
    not a carrier. Penetrance of the classic cardioauditory phenotype is high
    but not complete: some biallelic genotypes with residual channel
    function instead cause recessive LQT1 without deafness.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      JLNS is inherited in an autosomal recessive manner. Parents of a child
      with JLNS are usually heterozygotes
    explanation: GeneReviews describes the autosomal recessive inheritance pattern and typical carrier-parent status.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      each sib of an affected individual usually has a 25% chance of being
      affected with JLNS, a 50% chance of being a carrier of a
      JLNS-causing pathogenic variant and potentially at risk for LQTS, and
      a 25% chance of being unaffected and not a carrier
    explanation: GeneReviews quantifies the recurrence risk to full siblings under autosomal recessive transmission.


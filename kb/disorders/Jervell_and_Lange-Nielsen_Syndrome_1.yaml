    screening congenitally deaf children for a long QT interval
    concentrates JLNS by roughly three orders of magnitude relative to
    the worldwide estimate above. That is the entire argument for ECG
    screening of congenitally deaf children, and it is why this record
    is curated separately rather than folded into the worldwide one. The
    rate is this single center's own yield, four cases among 503

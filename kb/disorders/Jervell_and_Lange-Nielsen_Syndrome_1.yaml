- name: Loss of Stria Vascularis Endolymphatic K+ Secretion
  biological_scale: CELLULAR
  role: amplifier
  conforms_to: sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative Stress
  description: >-
    KCNQ1 co-assembles with KCNE1 at the apical membrane of stria vascularis
    marginal cells, where the resulting K+-diffusion current is one of two
    mechanisms (alongside the Kir4.1-dependent intrastrial potential)
    generating the highly positive endocochlear potential and secreting K+
    into endolymph. Biallelic KCNQ1 loss abolishes this apical current,
    collapsing K+ secretion and the endocochlear potential.
  cell_types:
  - preferred_term: strial marginal cell
    term:
      id: CL:0002492
      label: strial marginal cell
  biological_processes:
  - preferred_term: potassium ion homeostasis
    term:
      id: GO:0055075
      label: potassium ion homeostasis
    modifier: DYSREGULATED
  locations:
  - preferred_term: stria vascularis of cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  evidence:
  - reference: PMID:20012478
    reference_title: "How is the highly positive endocochlear potential formed? The specific architecture of the stria vascularis and the roles of the ion-transport apparatus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An additional K+-diffusion potential formed by KCNQ1/KCNE1-K(+)
      channels at the apical membranes of marginal cells also contributes to
      the EP.
    explanation: >-
      Mechanistic review establishing the KCNQ1/KCNE1 apical channel as one
      of the two K+-diffusion potentials that form the endocochlear
      potential in stria vascularis marginal cells.
  - reference: PMID:9020846
    reference_title: "A novel mutation in the potassium channel gene KVLQT1 causes the Jervell and Lange-Nielsen cardioauditory syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that KVLQT1 is expressed in the stria vascularis of mouse
      inner ear by in situ hybridization.
    explanation: >-
      Localizes KCNQ1 (KVLQT1) expression to the stria vascularis, the site
      of endolymphatic K+ secretion.
  downstream:
  - target: Organ of Corti Hair Cell Degeneration
    description: >-
      Collapse of endolymph volume and the endocochlear potential
      precipitates structural collapse and secondary hair-cell injury.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15891643
      reference_title: "Inner ear abnormalities in a Kcnq1 (Kvlqt1) knockout mouse: a model of Jervell and Lange-Nielsen syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        contraction of the endolymphatic compartments, and collapse and
        adhesion of surrounding membranes. There was a complete degeneration
        of the organ of Corti
      explanation: >-
        Reports endolymphatic collapse and organ of Corti degeneration in
        the same Kcnq1-null cochleae, which is the
        strial-secretion-to-hair-cell-loss step.
    - reference: PMID:26084842
      reference_title: "Virally mediated Kcnq1 gene replacement therapy in the immature scala media restores hearing in a mouse model of human Jervell and Lange-Nielsen deafness syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Examination of cochlear morphology showed that the collapse of the
        Reissner's membrane and degeneration of hair cells (HCs) and cells
        in the spiral ganglia were corrected in Kcnq1(-/-) mice.
      explanation: >-
        Rescue arm of the same edge: virally restoring Kcnq1 in the
        neonatal scala media prevents the hair-cell degeneration, so the
        degeneration is downstream of the strial defect rather than a
        parallel lesion. The construct reached most cochlear marginal
        cells, where native Kcnq1 is expressed, but the paper also
        reports extensive ectopic expression, so the rescue is not
        strictly marginal-cell-specific.

- name: Organ of Corti Hair Cell Degeneration
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death
  description: >-
    Loss of endolymph volume and the endocochlear potential causes collapse
    of Reissner's membrane and the endolymphatic compartments, with
    consequent degeneration of the organ of Corti hair cells, which do not
    regenerate in mammals.
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:0000855
      label: sensory hair cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  evidence:
  - reference: PMID:15891643
    reference_title: "Inner ear abnormalities in a Kcnq1 (Kvlqt1) knockout mouse: a model of Jervell and Lange-Nielsen syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Kcnq1 knockout mice were deaf and demonstrated circling behavior. They
      exhibited a marked atrophy of the stria vascularis, contraction of the
      endolymphatic compartments, and collapse and adhesion of surrounding
      membranes. There was a complete degeneration of the organ of Corti and
      an associated degeneration of the spiral ganglion.
    explanation: >-
      Direct histopathologic evidence that loss of functional Kcnq1
      produces stria vascularis atrophy, endolymphatic compartment collapse,
      and organ of Corti hair-cell degeneration.
  downstream:
  - target: Spiral Ganglion Neuron Degeneration and Loss of Cochlear Amplification
    description: >-
      Hair-cell loss removes cochlear amplification and deafferents the
      auditory nerve, driving spiral ganglion neuron degeneration.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15891643
      reference_title: "Inner ear abnormalities in a Kcnq1 (Kvlqt1) knockout mouse: a model of Jervell and Lange-Nielsen syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        There was a complete degeneration of the organ of Corti and an
        associated degeneration of the spiral ganglion.
      explanation: >-
        Reports the two degenerations together in Kcnq1-null cochleae. The
        abstract says "associated" and no more: in a global knockout both
        structures are exposed to the same endolymphatic collapse, so
        co-occurrence is equally consistent with ganglion loss being
        secondary to hair-cell loss and with it being parallel to it. The
        edge is drawn on the conventional deafferentation account, which
        this quote is consistent with rather than establishing.


- name: AAV1-Kcnq1 gene-replacement-treated Kcnq1-/- mouse
  species: Mouse
  genotype: Kcnq1 targeted disruption, homozygous null, treated with AAV1-Kcnq1 endolymphatic gene replacement
  publication: PMID:26084842
  evidence:
  - reference: PMID:26084842
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    reference_title: Virally mediated Kcnq1 gene replacement therapy in the immature scala media restores hearing in a mouse model of human Jervell and Lange-Nielsen deafness syndrome.
    snippet: >-
      Our results demonstrate the first successful gene therapy treatment for
      gene defects specifically affecting the function of the stria
      vascularis, which is a major site affected by genetic mutations in
      inherited hearing loss.
    explanation: >-
      Establishes this treated Kcnq1-/- line as informative for evaluating
      gene-replacement rescue of the stria-vascularis-dependent hearing-loss
      mechanism in JLNS.
  modeled_mechanisms:
  - target: Congenital Profound Bilateral Sensorineural Hearing Loss
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Postnatal endolymphatic injection of an AAV1-Kcnq1 construct into
      Kcnq1-/- mice restored Kcnq1 expression in stria vascularis marginal
      cells, corrected the collapse of Reissner's membrane and hair-cell
      degeneration, restored normal endocochlear potential, and produced
      significant hearing preservation.
    limitations: >-
      Treatment was delivered postnatally (P0-P2) in the immature mouse
      cochlea; efficacy and safety of comparable timing/delivery in the
      more mature human cochlea at diagnosis is unestablished, and this is
      a preclinical proof-of-concept rather than a validated human therapy.
    readouts:
    - name: Auditory brainstem response threshold
      target: Congenital Profound Bilateral Sensorineural Hearing Loss
      direction: RESTORED
      interpretation: >-
        Hearing preservation in treated ears ranged from 20 dB improvement
        to complete correction of the deafness phenotype.
      evidence:
      - reference: PMID:26084842
        reference_title: "Virally mediated Kcnq1 gene replacement therapy in the immature scala media restores hearing in a mouse model of human Jervell and Lange-Nielsen deafness syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          auditory brainstem responses showed significant hearing
          preservation in the injected ears, ranging from 20 dB improvement
          to complete correction of the deafness phenotype
        explanation: Direct functional-hearing readout of gene-therapy rescue.
    evidence:
    - reference: PMID:26084842
      reference_title: "Virally mediated Kcnq1 gene replacement therapy in the immature scala media restores hearing in a mouse model of human Jervell and Lange-Nielsen deafness syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Examination of cochlear morphology showed that the collapse of the
        Reissner's membrane and degeneration of hair cells (HCs) and cells
        in the spiral ganglia were corrected in Kcnq1(-/-) mice.
      explanation: >-
        Demonstrates structural rescue of the cochlear degeneration
        phenotype by Kcnq1 gene replacement, supporting the therapeutic
        relevance of this node for future gene-therapy approaches.

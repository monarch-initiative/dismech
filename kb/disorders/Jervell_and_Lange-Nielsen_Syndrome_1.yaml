  role: amplifier
  conforms_to: cardiac_ion_channel_repolarization#Arrhythmogenic Substrate and Triggered Activity
  description: >-
    Loss of repolarization reserve produces markedly prolonged QTc (mean
    557+/-65 ms in a 187-patient cohort, most >500 ms) with early
    afterdepolarizations and regional dispersion of repolarization,
    generating the arrhythmogenic substrate for torsades de pointes. JLNS is
    typically more severely affected than heterozygous (Romano-Ward) LQT1
    and than the allelic KCNE1-caused JLNS2.
  cell_types:
  - preferred_term: cardiomyocyte

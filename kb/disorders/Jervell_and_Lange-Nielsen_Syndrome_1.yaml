clinical_burden:
  burden_level: HIGH
  rationale: >-
    Two independently disabling burdens fall on the same child. The cardiac one
    is lethal: untreated, more than half die before age 15, and the largest
    series describes JLNS as a most severe variant of long QT syndrome, with
    events in 86% of patients and onset by age three in half of them. It is
    also only partly tractable - on beta-blockade, half the cohort still had
    events and 27% still had cardiac arrest or sudden death - so the burden
    persists under best available medical therapy rather than resolving with
    diagnosis. The auditory one is permanent and present from birth, and
    because the mammalian cochlea does not regenerate it is managed by
    prosthetic substitution rather than repair. The two also interact: cochlear
    implantation, the standard treatment for the deafness, is general
    anesthesia in a child with a markedly prolonged QT interval, and a
    published case records life-threatening arrhythmia triggered by anesthesia
    at the end of exactly that surgery.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      J-LN syndrome is a most severe variant of LQTS, with a very early onset
      and major QTc prolongation, and in which beta-blockers have limited
      efficacy.
    explanation: >-
      The cohort's own summary judgement on severity and on the limits of
      first-line therapy.
  - reference: PMID:32508908
    reference_title: "Jervell and Lange-Nielsen Syndrome due to a Novel Compound Heterozygous KCNQ1 Mutation in a Chinese Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hearing of this patient improved significantly with the help of
      cochlear implantation (CI). But life-threatening arrhythmias occurred
      with a trigger of anesthesia after the end of the CI surgery.
    explanation: >-
      Documents the interaction between the two burdens: treating the deafness
      required an anesthetic that precipitated a life-threatening arrhythmia.
progression:
- phase: Congenital onset with early-childhood cardiac events
  age_range: Birth to 3 years
  notes: >-
    The hearing loss is present from birth, but the cardiac phenotype declares
    itself later: half the reported patients were already symptomatic by age
    three. A deaf infant with no cardiac history is therefore not yet
    reassuring, and this window is why newborn hearing screening is treated
    here as a case-finding route into cardiac evaluation rather than only an
    audiological result.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients (86%) had cardiac events, and 50% were already symptomatic
      by age 3.
    explanation: >-
      Gives both the lifetime event rate and the age by which half the cohort
      had declared, which defines this phase.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fifty percent of individuals with JLNS had cardiac events before age
      three years.
    explanation: >-
      Independent statement of the same early-childhood onset window in the
      GeneReviews chapter.
- phase: Adrenergically triggered episodes
  notes: >-
    Events are overwhelmingly provoked rather than spontaneous, which is what
    makes trigger avoidance and beta-blockade rational therapy and what places
    this syndrome with LQT1 rather than with the pause-dependent LQT3
    phenotype.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the arrhythmic events (95%) were triggered by emotions or
      exercise.
    explanation: >-
      Quantifies the adrenergic trigger dependence that characterizes the
      symptomatic phase.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The classic presentation of JLNS is a deaf child who experiences
      syncopal episodes during periods of stress, exercise, or fright.
    explanation: >-
      Describes the same trigger-provoked presentation in clinical terms.
- phase: Untreated childhood mortality
  age_range: Before 15 years, untreated
  notes: >-
    This figure describes the natural history without therapy and is the
    baseline against which the treatment section should be read. It is not the
    contemporary outcome: on beta-blockade the 186-patient series still
    recorded events in 51% and cardiac arrest or sudden death in 27%, which is
    partial protection rather than none and is why implantable defibrillators
    and left cardiac sympathetic denervation are curated as treatments here.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than half of untreated children with JLNS die before age 15 years."
    explanation: >-
      GeneReviews natural-history statement giving the untreated mortality of
      the syndrome in childhood.
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      beta-Blockers have only partial efficacy; 51% of the patients had
      events despite therapy and 27% had CA/SD.
    explanation: >-
      Gives the treated residual risk, which is what makes the untreated
      figure a natural-history baseline rather than a current prognosis.
treatments:
- name: Beta-Blocker Therapy
  description: >-
    First-line anti-adrenergic pharmacotherapy; nonselective agents (nadolol
    or propranolol) are generally preferred over metoprolol for congenital
    LQTS. Efficacy is only partial in JLNS: about half of treated patients
    still had breakthrough events in the largest cohort.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: beta-blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Torsades de Pointes and Ventricular Fibrillation
    treatment_effect: INHIBITS
    description: >-
      Beta-blockade reduces adrenergically triggered arrhythmic events but
      has only partial efficacy in JLNS.
    evidence:
    - reference: PMID:16461811
      reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        beta-Blockers have only partial efficacy; 51% of the patients had
        events despite therapy and 27% had CA/SD.
      explanation: >-
        Quantifies the partial efficacy of beta-blocker therapy in the
        largest JLNS cohort.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      beta-adrenergic blockers for long QT interval (Note: Beta-blocker
      treatment is only partially effective.)
    explanation: GeneReviews management recommendation and efficacy caveat.

- name: Implantable Cardioverter-Defibrillator Placement
  description: >-
    Device therapy recommended for patients with a history of cardiac
    arrest, ventricular fibrillation, or failure to respond to beta-blocker
    therapy, given the malignant natural history of JLNS.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  notes: >-
    Risk within JLNS is not uniform, and two variables measurable early plus
    sex separate higher- from lower-risk patients: a QTc above 550 ms and
    syncope in the first year of life are independent predictors of
    subsequent cardiac arrest or sudden death, and females are at lower risk
    (hazard ratio 0.54, 95% CI 0.34 to 0.88). That stratification is what the
    186-patient cohort proposes as the basis for implanting a defibrillator
    early rather than after a first arrest, which is why it is recorded on
    this treatment rather than as a stage of the disease course.
  target_mechanisms:
  - target: Syncope, Cardiac Arrest, and Sudden Cardiac Death
    treatment_effect: INHIBITS
    description: >-
      ICD therapy terminates sustained ventricular tachyarrhythmia before it
      progresses to sudden cardiac death.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        implantable cardioverter defibrillators (ICDs) for those with a
        history of cardiac arrest and/or failure to respond to other
        treatments
      explanation: GeneReviews management recommendation for ICD placement.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early therapy with implanted cardioverter/defibrillators must be considered."
    explanation: Cohort-based recommendation for early ICD consideration given the malignant course of JLNS.
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A QTc >550 ms and history of syncope during the first year of life are
      independent predictors of subsequent CA/SD.
    explanation: >-
      The two early predictors that identify which JLNS patients warrant a
      defibrillator rather than beta-blockade alone.
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Females are at lower risk for cardiac arrest and sudden death (CA/SD)
      (hazard ratio, 0.54; 95% CI, 0.34 to 0.88; P=0.01).
    explanation: >-
      The sex effect on arrhythmic risk, with its effect size and confidence
      interval, which enters the same stratification.
- name: Left Cardiac Sympathetic Denervation
  description: >-
    Surgical anti-adrenergic escalation considered for recurrent syncope or
    breakthrough ventricular arrhythmia despite full-dose beta-blockade, or
    when ICD implantation is declined or contraindicated.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: left cardiac sympathetic denervation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Torsades de Pointes and Ventricular Fibrillation
    treatment_effect: INHIBITS
    description: >-
      Left cardiac sympathetic denervation reduces arrhythmia-provoking
      sympathetic input when pharmacologic anti-adrenergic therapy is
      insufficient.
    evidence:
    - reference: PMID:18606002
      reference_title: Congenital long QT syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        If the patient has one more syncope despite a full dose
        beta-blockade, left cardiac sympathetic denervation (LCSD) should be
        performed without hesitation
      explanation: >-
        General congenital-LQTS review recommendation for LCSD escalation,
        applicable to JLNS's high breakthrough-event rate on beta-blockers.
    - reference: PMID:35331422
      reference_title: "Left Cardiac Sympathetic Denervation for Long QT Syndrome: 50 Years' Experience Provides Guidance for Management."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        with an overall 86% decrease in the mean yearly cardiac event rate (P
        < 0.0001)
      explanation: >-
        Quantifies the effect of the denervation on the arrhythmic event
        rate this edge claims it inhibits, in a 125-patient LQTS series
        with a mean 12.9-year follow-up. Indirect because the series is
        LQTS-wide and reports no JLNS subgroup, so the reduction is not
        measured in this disease.
  evidence:
  - reference: PMID:18606002
    reference_title: Congenital long QT syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the patient has one more syncope despite a full dose beta-blockade,
      left cardiac sympathetic denervation (LCSD) should be performed
      without hesitation
    explanation: Review recommendation for LCSD after recurrent syncope on full-dose beta-blockade.
  - reference: PMID:35331422
    reference_title: "Left Cardiac Sympathetic Denervation for Long QT Syndrome: 50 Years' Experience Provides Guidance for Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After LCSD, 17% in the very high risk group remained asymptomatic,
      compared with 52%, 47%, and 97% in the other 3 groups (P < 0.0001)
    explanation: >-
      The relevant caveat for JLNS. The inference step, and the reason
      this is graded INDIRECT, is that the cohort is LQTS-wide and
      reports no JLNS subgroup: placing JLNS patients in the
      very-high-risk stratum follows from that stratum's definition
      (symptomatic in the first year of life, or highly malignant
      genetics), which JLNS patients typically meet, rather than from
      the paper assigning them there. On that reading only 17% of the
      stratum became asymptomatic, so denervation substantially reduces
      events without removing residual risk. The same paper reports that
      LCSD results are not affected by common genotypes.
  notes: >-
    Among the 45 patients whose only pre-procedure events were syncope
    or ICD shocks, a 6-month post-procedure QTc below 500 ms predicted
    excellent outcome. That makes QTc shortening a usable response
    biomarker after denervation rather than only a diagnostic
    measurement, but it was established in that subgroup and not across
    the whole series. Note also that the cohort is LQTS overall, not
    JLNS specifically; the JLNS-relevant reading is the very-high-risk
    subgroup result rather than the headline 86% reduction.

- name: Atrial Pacing with Beta-Blockade
  description: >-
    Permanent atrial pacing added to beta-blocker therapy in young high-risk
    JLNS patients, as an alternative to defibrillator implantation in
    children too small for a transvenous ICD. In the Norwegian national
    series of nine genetically confirmed JLNS patients, six received atrial
    leads and all six survived without events over a mean 6.9 years, while
    the single patient given a ventricular lead died during follow-up. The
    lead position is therefore not incidental to the result.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: atrial pacemaker implantation
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: atrial-lead cardiac pacemaker
        term:
          id: NCIT:C94198
          label: Cardiac Pacemaker
  target_mechanisms:
  - target: Torsades de Pointes and Ventricular Fibrillation
    treatment_effect: INHIBITS
    description: >-
      Atrial pacing prevents the bradycardia and pauses that shorten
      diastolic intervals irregularly and provoke pause-dependent triggered
      activity on a markedly prolonged action potential, and it permits
      beta-blocker uptitration that bradycardia would otherwise limit.
    evidence:
    - reference: PMID:27451284
      reference_title: "The Jervell and Lange-Nielsen syndrome; atrial pacing combined with ß-blocker therapy, a favorable approach in young high-risk patients with long QT syndrome?"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The 6 patients with atrial leads survived without events at a mean
        follow-up of 6.9 years after pacemaker implantation.
      explanation: >-
        Event-free survival on atrial pacing plus beta-blockade in the
        JLNS-specific series. Indirect for the mechanism claim: the study
        reports clinical outcome, not the suppression of triggered activity
        the edge asserts, and with six patients and no control arm it cannot
        separate the pacing effect from the beta-blockade it accompanies.
  evidence:
  - reference: PMID:27451284
    reference_title: "The Jervell and Lange-Nielsen syndrome; atrial pacing combined with ß-blocker therapy, a favorable approach in young high-risk patients with long QT syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients also received a pacemaker; 1 had a ventricular lead and
      6 had atrial leads. The patient with the ventricular lead died during
      follow-up.
    explanation: >-
      The whole device experience in the series, including the ventricular-lead
      death, which is what makes this an argument for atrial pacing
      specifically rather than for pacing in general.
  notes: >-
    Nine patients in one national cohort, uncontrolled, with the comparison
    between lead positions resting on a single ventricular-lead patient. The
    paper's own title ends in a question mark. Curated as a reported option
    in young children for whom ICD implantation is difficult, not as
    established therapy, and it does not displace the defibrillator and
    denervation entries above.
- name: KCNQ1 Suppression-and-Replacement Gene Therapy
  description: >-
    Investigational dual-component gene therapy that suppresses both
    endogenous KCNQ1 alleles with a short hairpin RNA while supplying an
    shRNA-immune wild-type KCNQ1 cDNA from the same construct. Because
    suppression is mutation-independent, one vector in principle covers any
    KCNQ1 genotype rather than requiring an allele-specific product, which is
    the property that makes it relevant to a disease defined by two different
    loss-of-function alleles per patient. In LQT1 patient iPSC-derived
    cardiomyocytes it shortened the prolonged action potential to isogenic
    control values.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Near-Complete Loss of Cardiac I_Ks Repolarizing Current
    treatment_effect: RESTORES
    description: >-
      Supplying wild-type KCNQ1 coding sequence restores the pore-forming
      subunit whose absence is this node, rather than compensating downstream
      of it.
    evidence:
    - reference: PMID:33504163
      reference_title: Suppression-Replacement KCNQ1 Gene Therapy for Type 1 Long QT Syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        In LQT1 iPSC-CMs, KCNQ1-SupRep gene therapy shortened the APD,
        thereby eliminating the pathognomonic feature of LQT1.
      explanation: >-
        Demonstrates functional restoration of repolarization in human
        cardiomyocytes. Indirect for JLNS: every cell line tested carried a
        heterozygous LQT1 genotype, so restoration was shown against one
        residual wild-type allele and not against the biallelic null state
        this node describes.
  evidence:
  - reference: PMID:33504163
    reference_title: Suppression-Replacement KCNQ1 Gene Therapy for Type 1 Long QT Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      KCNQ1-SupRep achieved mutation-independent suppression of wild-type
      KCNQ1 and 3 LQT1-causative variants
    explanation: >-
      Mutation independence is the property that would let one construct
      serve JLNS patients regardless of which two KCNQ1 alleles they carry.
      Indirect because the demonstration is in LQT1 constructs and cells.
  notes: >-
    Not a therapy. This is a cell-culture proof of principle in heterozygous
    LQT1 with no in vivo data and no JLNS genotype tested, curated so that the
    cardiac arm has the counterpart to the AAV1-Kcnq1 cochlear rescue already
    recorded under animal_models, and so the gap is visible rather than
    absent. Two things would have to be shown before it means anything for
    JLNS: efficacy against a biallelic null background, where there is no
    residual wild-type channel to build on, and delivery to ventricular
    myocardium in vivo.
- name: Cochlear Implantation
  description: >-
    Standard hearing rehabilitation for profound congenital sensorineural
    hearing loss when hearing aids are inadequate; can substantially improve
    auditory function, but surgery requires cardiology and anesthesia
    planning because peri-anesthetic sympathetic and electrolyte shifts can
    trigger life-threatening arrhythmia in JLNS.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  notes: >-
    The treatment term is the generic surgical action, which is what implantation is.
    NCIT:C157820 `Cochlear Implant` exists but denotes the device, not a clinical
    action, and is not reachable from NCIT:C25218, so it cannot be the `term:` of a
    TreatmentTerm (same gap documented in AFG2A-Related_Encephalopathy.yaml). The
    specificity is carried by `preferred_term`, and the device is attached as a
    qualifier so it stays queryable. An earlier version bound NCIT:C15315
    Rehabilitation.
  target_mechanisms:
  - target: Congenital Profound Bilateral Sensorineural Hearing Loss
    treatment_effect: RESTORES
    description: >-
      Cochlear implantation bypasses the degenerated cochlear sensory
      apparatus to restore auditory input.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Cochlear implantation to treat hearing loss"
      explanation: GeneReviews management recommendation for cochlear implantation.
  evidence:
  - reference: PMID:32508908
    reference_title: "Jervell and Lange-Nielsen Syndrome due to a Novel Compound Heterozygous KCNQ1 Mutation in a Chinese Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hearing of this patient improved significantly with the help of
      cochlear implantation (CI). But life-threatening arrhythmias occurred
      with a trigger of anesthesia after the end of the CI surgery.
    explanation: >-
      Case report demonstrating both the auditory benefit and the
      peri-anesthetic arrhythmia risk of cochlear implantation in a
      KCNQ1-JLNS1 patient.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Special precautions during anesthesia are necessary because of the
      increased risk for cardiac arrhythmia.
    explanation: GeneReviews explicitly flags anesthesia precautions relevant to cochlear implant surgery.
  - reference: PMID:26205899
    reference_title: "Jervell and Lange-Nielsen syndrome in cochlear implanted patients: our experience and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering all precautions their cochlear implant surgeries were done
      uneventfully.
    explanation: >-
      Counterweight to the single adverse case above: with the precautions in
      place, implantation was uneventful in this center's four JLNS patients.
      The peri-anesthetic risk is real and manageable, not prohibitive.
  - reference: PMID:26205899
    reference_title: "Jervell and Lange-Nielsen syndrome in cochlear implanted patients: our experience and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine available reports about the outcome of cochlear implantation in
      these patients indicated good auditory outcome.
    explanation: >-
      Auditory benefit across the nine published reports that recorded
      an outcome, rather than a single case. Those nine are a subset of
      the sixteen reports covering 38 implanted JLNS children; outcome
      was not reported for all 38.

- name: QT-Prolonging Drug and Trigger Avoidance
  description: >-
    Avoidance of drugs that further prolong the QT interval, and of
    activities known to precipitate syncopal events, is a core management
    measure because repolarization reserve is already severely reduced.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: risk-factor and trigger-avoidance counseling
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Drugs that cause further prolongation of the QT interval; activities
      known to precipitate syncopal events in persons with long QT syndrome.
    explanation: GeneReviews lists agents and circumstances to avoid for JLNS.
  - reference: PMID:26205899
    reference_title: "Jervell and Lange-Nielsen syndrome in cochlear implanted patients: our experience and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As auditory stimuli is reported to be a specific trigger, it is prudent
      to activate the processor with continuous heart monitoring
    explanation: >-
      Names a trigger specific to this disease and to its own treatment:
      sound itself. Switching on a cochlear implant processor is therefore an
      arrhythmia risk in its own right, separate from the anesthetic risk of
      the implantation surgery, and is recommended to be done under cardiac
      monitoring.

- name: Genetic Counseling
  description: >-
    Genetic counseling for families, including carrier testing for at-risk
    relatives and prenatal or preimplantation testing when familial KCNQ1
    variants are known, given the 25% recurrence risk for full siblings.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Carrier testing for at-risk relatives and prenatal testing for
      pregnancies at increased risk are possible if the pathogenic variants
      in the family are known.
    explanation: GeneReviews genetic counseling recommendation.

diagnosis:
- name: Integrated Clinical and Molecular Diagnostic Criteria
  description: >-
    The diagnosis is established clinically by the combination of congenital
    sensorineural deafness and a long QT interval, and confirmed molecularly
    by identification of biallelic pathogenic variants in KCNQ1 (this
    subtype, JLNS1) or KCNE1 (JLNS2).
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Congenital sensorineural deafness plus a long QT interval, with biallelic
    pathogenic KCNQ1 or KCNE1 variants on molecular testing, establishes the
    diagnosis.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of JLNS is established in a child with congenital
      sensorineural deafness, long QT interval, and presence of biallelic
      pathogenic variants in either KCNQ1 or KCNE1.
    explanation: GeneReviews DIAGNOSIS/TESTING section states the integrated clinical and molecular diagnostic criteria.

- name: Resting 12-Lead Electrocardiography with QTc Measurement
  description: >-
    A resting 12-lead ECG with manual QTc measurement is the core diagnostic
    procedure for identifying the markedly prolonged QTc characteristic of
    JLNS; secondary (acquired) causes of QTc prolongation, including
    electrolyte imbalance, must be excluded before a congenital diagnosis is
    made.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Markedly prolonged QTc, mean 557+/-65 ms in the largest published cohort,
    commonly >500 ms.
  notes: >-
    NCIT does not provide an ECG-specific diagnostic term here, so the
    preferred term is narrowed in the name and description, following the
    same pattern used in Familial Long QT Syndrome.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their QTc was markedly prolonged (557+/-65 ms)."
    explanation: Quantifies the QTc finding on ECG that anchors the diagnosis in the largest published JLNS cohort.
  - reference: PMID:38790576
    reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Before diagnosing LQTS on the basis of prolonged QTc, secondary causes
      of QTc prolongation must be excluded (e.g., drugs, acquired cardiac
      conditions, electrolyte imbalance).
    explanation: >-
      General congenital-LQTS pediatric overview documents the requirement to
      exclude secondary/acquired causes, including electrolyte imbalance,
      before a congenital diagnosis is confirmed; applicable to JLNS's
      ECG-based diagnostic workup.

- name: Ambulatory Holter Monitoring
  description: >-
    Ambulatory ECG (Holter) monitoring may be used alongside resting ECG to
    assess cardiac rhythm and identify arrhythmic events supporting the
    diagnosis.
  diagnosis_term:
    preferred_term: Holter monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  evidence:
  - reference: PMID:39027806
    reference_title: "Management of Long QT Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additional investigations, including exercise stress tests and Holter
      monitoring, may be warranted to assess cardiac function and identify
      arrhythmic events
    explanation: >-
      Systematic review of LQTS management documents Holter monitoring as an
      additional diagnostic investigation alongside ECG, applicable to JLNS's
      cardiac diagnostic workup.

- name: Exercise Cardiac Stress Testing
  description: >-
    Exercise stress testing may be used to assess cardiac function and
    provoke arrhythmic events as part of the diagnostic workup.
  diagnosis_term:
    preferred_term: Exercise cardiac stress test
    term:
      id: NCIT:C168192
      label: Exercise Cardiac Stress Test
  evidence:
  - reference: PMID:39027806
    reference_title: "Management of Long QT Syndrome: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additional investigations, including exercise stress tests and Holter
      monitoring, may be warranted to assess cardiac function and identify
      arrhythmic events
    explanation: >-
      Systematic review of LQTS management documents exercise stress testing
      as an additional diagnostic investigation, applicable to JLNS's cardiac
      diagnostic workup.

- name: Audiological Screening and Molecular Testing of At-Risk Relatives
  description: >-
    At-risk siblings should receive standard newborn hearing screening and
    ECG, with molecular genetic testing to confirm or exclude the diagnosis
    when the familial KCNQ1 variants are known.
  diagnosis_term:
    preferred_term: audiological and molecular genetic screening
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hearing evaluation by standard newborn hearing screening programs and
      electrocardiograms for at-risk sibs; molecular genetic testing to
      confirm the diagnosis if the pathogenic variants in an affected family
      member are known.
    explanation: >-
      GeneReviews describes the audiological, electrocardiographic, and
      molecular-genetic evaluation protocol for at-risk relatives.
  - reference: PMID:26205899
    reference_title: "Jervell and Lange-Nielsen syndrome in cochlear implanted patients: our experience and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is recommended that all congenitally deaf patients have an ECG taken
      as a part of the evaluation.
    explanation: >-
      Extends screening beyond at-risk relatives of a known case to every
      congenitally deaf child, which is what the 0.79% yield among 503
      implant candidates recorded under prevalence actually argues for.

- name: Targeted Arrhythmia and Deafness Gene Panel Sequencing
  description: >-
    Molecular confirmation is obtained by next-generation sequencing of

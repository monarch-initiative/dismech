    modifier: INCREASED
  evidence:
  - reference: PMID:15891643
    reference_title: "Inner ear abnormalities in a Kcnq1 (Kvlqt1) knockout mouse: a model of Jervell and Lange-Nielsen syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      There was a complete degeneration of the organ of Corti and an
      associated degeneration of the spiral ganglion.
    explanation: >-
      Documents spiral ganglion degeneration coupled to hair-cell loss in
      the Kcnq1 knockout mouse model.
  downstream:
  - target: Congenital Profound Bilateral Sensorineural Hearing Loss
    description: >-
      Combined irreversible loss of hair cells, cochlear amplification, and

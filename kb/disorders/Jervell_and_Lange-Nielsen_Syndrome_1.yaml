biochemical:
- name: Serum Gastrin
  presence: Elevated
  context: >-
    Elevated in seven of nine tested patients in the complete Swedish
    double-KCNQ1-mutation cohort. Compensatory hypergastrinemia follows loss
    of acid-mediated negative feedback on antral G cells when parietal-cell
    acid secretion fails, so this is the biochemical readout of the gastric
    arm of the pathophysiology rather than an independent finding. Frequency
    is carried on the Hypergastrinemia phenotype.
  biomarker_term:
    preferred_term: Gastrin Measurement
    term:
      id: NCIT:C74858
      label: Gastrin Measurement
  evidence:
  - reference: PMID:22805636
    reference_title: "Iron-deficiency anaemia, gastric hyperplasia, and elevated gastrin levels due to potassium channel dysfunction in the Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated levels of gastrin in seven of nine cases, pepsinogen in six of
      seven cases, and faecal calprotectin in nine of nine cases were present.
    explanation: >-
      Measured serum gastrin in the Swedish JLNS cohort.
  notes: >-
    The same cohort found a significant correlation between elevated gastrin
    and concurrent iron deficiency or anaemia (p = 0.039), and its authors
    raise sustained hypergastrinaemia as a potential risk factor for later
    gastrointestinal malignancy. No such malignancy has been reported in a
    JLNS patient.
- name: Serum Pepsinogen
  presence: Elevated
  context: >-
    Elevated in six of seven tested patients in the same cohort. Pepsinogen
    is secreted by gastric chief cells and rises with the trophic drive of
    hypergastrinemia, so it corroborates the secretory disturbance
    independently of the gastrin assay itself.
  biomarker_term:
    preferred_term: Pepsinogen Measurement
    term:
      id: NCIT:C100122
      label: Pepsinogen Measurement
  evidence:
  - reference: PMID:22805636
    reference_title: "Iron-deficiency anaemia, gastric hyperplasia, and elevated gastrin levels due to potassium channel dysfunction in the Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pepsinogen in six of seven cases
    explanation: >-
      Measured pepsinogen elevation in the Swedish JLNS cohort.
- name: Faecal Calprotectin
  presence: Elevated
  context: >-
    Elevated in nine of nine tested patients, the only analyte in the cohort
    abnormal in every patient measured. Calprotectin is a neutrophil-derived
    marker of intestinal inflammation and is not explained by the
    parietal-cell mechanism curated here, so it records an unexplained
    gastrointestinal finding rather than a predicted one. The denominator is
    nine patients from a single national series.
  biomarker_term:
    preferred_term: Calprotectin Measurement
    term:
      id: NCIT:C82005
      label: Calprotectin Measurement
  evidence:
  - reference: PMID:22805636
    reference_title: "Iron-deficiency anaemia, gastric hyperplasia, and elevated gastrin levels due to potassium channel dysfunction in the Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      faecal calprotectin in nine of nine cases were present
    explanation: >-
      Measured faecal calprotectin elevation in every tested patient in the
      Swedish JLNS cohort.
  notes: >-
    Coeliac disease and inflammatory bowel disease were excluded by endoscopy
    in the five patients scoped, so the raised calprotectin is not accounted
    for by either. The cohort reports it without a mechanism, and none is
    asserted here.

genetic:
- name: KCNQ1
  gene_term:
    preferred_term: KCNQ1
    term:

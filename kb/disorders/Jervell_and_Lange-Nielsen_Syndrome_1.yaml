      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        Prolongation of the QTc interval is associated with
        tachyarrhythmias, including ventricular tachycardia, episodes of
        torsade de pointes ventricular tachycardia, and ventricular
        fibrillation
      explanation: >-
        GeneReviews states the QTc-prolongation-to-tachyarrhythmia step for

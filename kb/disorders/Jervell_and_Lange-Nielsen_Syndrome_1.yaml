        reference_title: "Inner ear abnormalities in a Kcnq1 (Kvlqt1) knockout mouse: a model of Jervell and Lange-Nielsen syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Kcnq1 knockout mice exhibit histopathologic findings that are
          comparable to those reported in human temporal bone cases of

pathophysiology:
- name: Biallelic KCNQ1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
  description: >-
    Homozygous or compound heterozygous germline loss-of-function variants
    (missense, nonsense, frameshift, or splice-site) in KCNQ1 disrupt voltage
    sensing, pore conductance, tetramer assembly, KCNE1 co-assembly, or
    plasma-membrane trafficking of the Kv7.1 channel subunit. Because the
    heart tolerates I_Ks loss far less well than the inner ear, JLNS
    (cardioauditory disease) requires near-complete loss of KCNQ1 function
    (reported as <10% of normal channel protein level in one mechanistic
    study), whereas milder residual-function biallelic genotypes instead
    produce recessive LQT1 without deafness.
  genes:
  - preferred_term: KCNQ1
    term:
      id: hgnc:6294
      label: KCNQ1
  molecular_functions:
  - preferred_term: delayed rectifier potassium channel activity
    term:
      id: GO:0005251
      label: delayed rectifier potassium channel activity
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    gene:
      preferred_term: KCNQ1
      term:
        id: hgnc:6294
        label: KCNQ1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: >-
      missense, nonsense, frameshift, or splice-site; biallelic
      (homozygous or compound heterozygous)
    description: >-
      Reported JLNS1 genotypes include homozygous c.728G>A (p.Arg243His),
      compound heterozygous c.477+1G>A / c.520C>T (p.Arg174Cys), homozygous
      c.1097G>A (p.Arg366Gln), and compound heterozygous c.1741A>T
      (p.Lys581Ter) / c.477+5G>A.
  evidence:
  - reference: PMID:9020846
    reference_title: "A novel mutation in the potassium channel gene KVLQT1 causes the Jervell and Lange-Nielsen cardioauditory syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An homozygous deletion-insertion event (1244, -7 +8) in the C-terminal
      domain of this gene was detected in three affected children of two
      families.
    explanation: >-
      Original report identifying a homozygous KVLQT1 (KCNQ1) mutation as the
      cause of Jervell and Lange-Nielsen syndrome, establishing the
      biallelic loss-of-function trigger.
  - reference: PMID:41147441
    reference_title: "Molecular mechanisms of function deficiencies in KCNQ1 variants associated with Jervell and Lange-Nielsen syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results demonstrated that all the variants resulted in functional
      deficiencies, with impaired localization in the plasma membrane being
      the most common cause.
    explanation: >-
      Systematic electrophysiological and trafficking characterization of 18
      JLNS-associated KCNQ1 variants shows loss-of-function through impaired
      membrane trafficking or disrupted KCNQ1-KCNE1/calmodulin interaction.
  - reference: PMID:33498651
    reference_title: "Molecular Mechanism of Autosomal Recessive Long QT-Syndrome 1 without Deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it was shown that only KCNQ1 protein levels lower than 10% of the
      normal level lead to JLNS
    explanation: >-
      Establishes the gene-dosage threshold distinguishing the severe
      cardioauditory JLNS phenotype from milder residual-function biallelic
      KCNQ1 genotypes (recessive LQT1 without deafness).
  downstream:
  - target: Near-Complete Loss of Cardiac I_Ks Repolarizing Current
    description: >-
      Loss-of-function KCNQ1 alleles abolish the KCNQ1-KCNE1 I_Ks current in
      ventricular cardiomyocytes.
  - target: Loss of Stria Vascularis Endolymphatic K+ Secretion
    description: >-
      The same loss-of-function alleles abolish the KCNQ1-KCNE1 apical
      potassium-secretion current in stria vascularis marginal cells.
  - target: Impaired Gastric Parietal Cell Luminal K+ Recycling
    description: >-
      KCNQ1 also provides the apical luminal K+-recycling current required
      for H+/K+-ATPase-driven gastric acid secretion in parietal cells.

- name: Near-Complete Loss of Cardiac I_Ks Repolarizing Current
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling
  description: >-
    With both KCNQ1 alleles nonfunctional, the KCNQ1-KCNE1 slow delayed
    rectifier current (I_Ks) that normally mediates phase-3 repolarization
    and heart-rate-dependent shortening of the action potential is nearly
    abolished, sharply reducing repolarization reserve in ventricular
    cardiomyocytes.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  - preferred_term: membrane repolarization during cardiac muscle cell action potential
    term:
      id: GO:0086013
      label: membrane repolarization during cardiac muscle cell action potential
    modifier: DYSREGULATED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:33498651
    reference_title: "Molecular Mechanism of Autosomal Recessive Long QT-Syndrome 1 without Deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Together with its ß-subunit KCNE1, also denoted as minK, this channel
      generates the slowly activating cardiac delayed rectifier current IKs,
      which is a key regulator of the heart rate dependent adaptation of the
      cardiac action potential duration (APD).
    explanation: >-
      Establishes the KCNQ1-KCNE1 I_Ks current as the cardiac repolarizing
      current lost when KCNQ1 is biallelically nonfunctional.
  - reference: PMID:11226272
    reference_title: "Targeted disruption of the Kcnq1 gene produces a mouse model of Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ECGs recorded from Kcnq1(-/-) mice demonstrated abnormal T- and P-wave
      morphologies and prolongation of the QT and JT intervals when measured
      in vivo, but not in isolated hearts.
    explanation: >-
      Direct electrophysiological evidence that complete loss of Kcnq1
      prolongs cardiac repolarization intervals in vivo.
  downstream:
  - target: Markedly Prolonged QTc and Arrhythmogenic Substrate
    description: >-
      Loss of I_Ks-mediated repolarization prolongs ventricular action
      potential duration, especially at higher heart rates, and creates
      dispersion of repolarization.

- name: Markedly Prolonged QTc and Arrhythmogenic Substrate
  biological_scale: TISSUE
  role: amplifier
  conforms_to: cardiac_ion_channel_repolarization#Arrhythmogenic Substrate and Triggered Activity
  description: >-
    Loss of repolarization reserve produces markedly prolonged QTc (mean
    557+/-65 ms in a 187-patient cohort, most >500 ms) with early
    afterdepolarizations and regional dispersion of repolarization,
    generating the arrhythmogenic substrate for torsades de pointes. JLNS is
    typically more severely affected than heterozygous (Romano-Ward) LQT1
    and than the allelic KCNE1-caused JLNS2.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle cell action potential
    term:
      id: GO:0086001
      label: cardiac muscle cell action potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their QTc was markedly prolonged (557+/-65 ms).
    explanation: >-
      Quantifies the markedly prolonged QTc across a 187-patient J-LN cohort,
      the tissue-level arrhythmogenic substrate.
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most mutations (90.5%) are on the KCNQ1 gene; mutations on the KCNE1
      gene are associated with a more benign course.
    explanation: >-
      Establishes that KCNQ1-related JLNS1 carries a more severe course than
      the allelic KCNE1-related JLNS2, supporting the disease-level severity
      note.
  downstream:
  - target: Torsades de Pointes and Ventricular Fibrillation
    description: >-
      The arrhythmogenic substrate supports triggered and reentrant
      malignant ventricular tachyarrhythmia.

- name: Torsades de Pointes and Ventricular Fibrillation
  biological_scale: ORGANISM
  role: effector
  conforms_to: cardiac_ion_channel_repolarization#Ventricular Tachyarrhythmia
  description: >-
    Triggered activity on the dispersed-repolarization substrate produces
    torsades de pointes, which may degenerate into ventricular fibrillation.
    Nearly all arrhythmic events (95%) are precipitated by adrenergic
    triggers (emotion, exercise, sudden auditory stimuli, fever, or
    anesthesia), reflecting the severely reduced repolarization reserve.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the arrhythmic events (95%) were triggered by emotions or
      exercise.
    explanation: >-
      Documents the adrenergic/physiologic trigger pattern for malignant
      ventricular tachyarrhythmia in JLNS.
  - reference: PMID:32508908
    reference_title: "Jervell and Lange-Nielsen Syndrome due to a Novel Compound Heterozygous KCNQ1 Mutation in a Chinese Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      life-threatening arrhythmias occurred with a trigger of anesthesia
      after the end of the CI surgery
    explanation: >-
      Case report documenting anesthesia-triggered life-threatening
      ventricular arrhythmia in a KCNQ1-JLNS1 patient, illustrating the
      trigger-susceptibility mechanism.
  downstream:
  - target: Syncope, Cardiac Arrest, and Sudden Cardiac Death
    description: >-
      Sustained ventricular tachyarrhythmia abolishes effective cardiac
      output, causing syncope and, if unresolved, sudden cardiac death.

- name: Syncope, Cardiac Arrest, and Sudden Cardiac Death
  biological_scale: ORGANISM
  role: outcome
  conforms_to: cardiac_ion_channel_repolarization#Syncope and Sudden Cardiac Death
  description: >-
    Loss of effective cardiac output during ventricular tachyarrhythmia
    causes syncope, sometimes misdiagnosed as a seizure, and, if the rhythm
    does not terminate, cardiac arrest or sudden death. JLNS has an early
    onset and a malignant course: 86% of patients had cardiac events, half
    were already symptomatic by age three, and more than half of untreated
    children died before age 15.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients (86%) had cardiac events, and 50% were already
      symptomatic by age 3.
    explanation: >-
      Quantifies the early, malignant clinical course of JLNS from the
      largest published cohort.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More than half of untreated children with JLNS die before age 15
      years.
    explanation: >-
      GeneReviews summary of the natural history mortality burden without
      treatment, the terminal outcome of this node.

- name: Loss of Stria Vascularis Endolymphatic K+ Secretion
  biological_scale: CELLULAR
  role: amplifier
  conforms_to: sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative Stress
  description: >-
    KCNQ1 co-assembles with KCNE1 at the apical membrane of stria vascularis
    marginal cells, where the resulting K+-diffusion current is one of two
    mechanisms (alongside the Kir4.1-dependent intrastrial potential)
    generating the highly positive endocochlear potential and secreting K+
    into endolymph. Biallelic KCNQ1 loss abolishes this apical current,
    collapsing K+ secretion and the endocochlear potential.
  cell_types:
  - preferred_term: strial marginal cell
    term:
      id: CL:0002492
      label: strial marginal cell
  biological_processes:
  - preferred_term: potassium ion homeostasis
    term:
      id: GO:0055075
      label: potassium ion homeostasis
    modifier: DYSREGULATED
  locations:
  - preferred_term: stria vascularis of cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  evidence:
  - reference: PMID:20012478
    reference_title: "How is the highly positive endocochlear potential formed? The specific architecture of the stria vascularis and the roles of the ion-transport apparatus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An additional K+-diffusion potential formed by KCNQ1/KCNE1-K(+)
      channels at the apical membranes of marginal cells also contributes to
      the EP.
    explanation: >-
      Mechanistic review establishing the KCNQ1/KCNE1 apical channel as one
      of the two K+-diffusion potentials that form the endocochlear
      potential in stria vascularis marginal cells.
  - reference: PMID:9020846
    reference_title: "A novel mutation in the potassium channel gene KVLQT1 causes the Jervell and Lange-Nielsen cardioauditory syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that KVLQT1 is expressed in the stria vascularis of mouse
      inner ear by in situ hybridization.
    explanation: >-
      Localizes KCNQ1 (KVLQT1) expression to the stria vascularis, the site
      of endolymphatic K+ secretion.
  downstream:
  - target: Organ of Corti Hair Cell Degeneration
    description: >-
      Collapse of endolymph volume and the endocochlear potential
      precipitates structural collapse and secondary hair-cell injury.

- name: Organ of Corti Hair Cell Degeneration
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death
  description: >-
    Loss of endolymph volume and the endocochlear potential causes collapse
    of Reissner's membrane and the endolymphatic compartments, with
    consequent degeneration of the organ of Corti hair cells, which do not
    regenerate in mammals.
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:0000855
      label: sensory hair cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  evidence:
  - reference: PMID:15891643
    reference_title: "Inner ear abnormalities in a Kcnq1 (Kvlqt1) knockout mouse: a model of Jervell and Lange-Nielsen syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Kcnq1 knockout mice were deaf and demonstrated circling behavior. They
      exhibited a marked atrophy of the stria vascularis, contraction of the
      endolymphatic compartments, and collapse and adhesion of surrounding
      membranes. There was a complete degeneration of the organ of Corti and
      an associated degeneration of the spiral ganglion.
    explanation: >-
      Direct histopathologic evidence that loss of functional Kcnq1
      produces stria vascularis atrophy, endolymphatic compartment collapse,
      and organ of Corti hair-cell degeneration.
  downstream:
  - target: Spiral Ganglion Neuron Degeneration and Loss of Cochlear Amplification
    description: >-
      Hair-cell loss removes cochlear amplification and deafferents the
      auditory nerve, driving spiral ganglion neuron degeneration.

- name: Spiral Ganglion Neuron Degeneration and Loss of Cochlear Amplification
  biological_scale: CELLULAR
  role: effector
  conforms_to: sensorineural_hair_cell_loss#Cochlear Amplification Loss and Spiral Ganglion Neuron Degeneration
  description: >-
    Deafferentation following hair-cell loss, combined with the reduced
    endocochlear potential, abolishes active cochlear amplification and
    drives degeneration of the afferent spiral ganglion neurons that form
    the auditory nerve.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402

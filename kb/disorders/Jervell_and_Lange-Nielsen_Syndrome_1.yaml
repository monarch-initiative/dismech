name: Jervell and Lange-Nielsen Syndrome 1
creation_date: "2026-08-17T00:00:00Z"
category: Mendelian
description: >-
  Jervell and Lange-Nielsen syndrome 1 (JLNS1) is a rare, severe autosomal
  recessive cardioauditory channelopathy caused by biallelic (homozygous or
  compound heterozygous) loss-of-function variants in KCNQ1, the gene
  encoding the pore-forming alpha subunit (Kv7.1/KvLQT1) of the slow
  delayed-rectifier potassium channel (I_Ks). It is the allelic, biallelic
  counterpart of autosomal dominant LQT1 (heterozygous KCNQ1 variants,
  curated in Familial Long QT Syndrome): near-complete loss of KCNQ1-KCNE1
  channel function abolishes both cardiac I_Ks-mediated repolarization and
  the stria vascularis marginal-cell K+-secretion current that maintains the
  endocochlear potential, producing the syndrome's defining combination of
  congenital profound bilateral sensorineural hearing loss and markedly
  prolonged QTc with high risk of torsades de pointes, syncope, and sudden
  cardiac death from early childhood. This entry is the KCNQ1-caused subtype
  (JLNS1, ~90% of JLNS cases); the allelic KCNE1-caused subtype (JLNS2,
  MONDO:0012871) is curated separately.
disease_term:
  preferred_term: Jervell and Lange-Nielsen syndrome 1
  term:
    id: MONDO:0024540
    label: Jervell and Lange-Nielsen syndrome 1
synonyms:
- Jervell and Lange-Nielsen syndrome
- JLNS1
- KCNQ1 Jervell and Lange-Nielsen syndrome
- Jervell and Lange-Nielsen syndrome caused by mutation in KCNQ1
- cardioauditory syndrome of Jervell and Lange-Nielsen, KCNQ1-related
- surdocardiac syndrome
parents:
- Cardiac Arrhythmia
- Channelopathy
- Sensorineural Hearing Loss
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      Primary clinical home: the life-limiting manifestation is a cardiac
      ion-channel arrhythmia syndrome managed by cardiology.
    evidence:
    - reference: PMID:16461811
      reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        J-LN syndrome is a most severe variant of LQTS, with a very early
        onset and major QTc prolongation
      explanation: >-
        The 186-patient cohort frames JLNS as a variant of the long-QT
        syndromes, which Harrison's covers in the cardiovascular Part.
  - classification_value: DISORDER_OF_EAR
    notes: >-
      Congenital profound bilateral sensorineural hearing loss is a defining
      feature, not a complication, and is what distinguishes JLNS from the
      allelic dominant Romano-Ward/LQT1 phenotype.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Jervell and Lange-Nielsen syndrome (JLNS) is characterized by
        congenital profound bilateral sensorineural hearing loss and long
        QTc, usually >500 msec.
      explanation: >-
        GeneReviews gives sensorineural hearing loss equal definitional
        weight with the cardiac phenotype, supporting a second Part
        assignment rather than a cardiovascular-only placement.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian autosomal recessive disorder diagnosed by biallelic
      pathogenic variants in a single gene.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The diagnosis of JLNS is established in a child with congenital
        sensorineural deafness, long QT interval, and presence of biallelic
        pathogenic variants in either KCNQ1 or KCNE1.
      explanation: >-
        Diagnosis rests on a biallelic single-gene genotype, which is the
        Mendelian-genetics axis Harrison's covers separately.
  channelopathy_category:
    classification_value: cardiac channelopathy
    notes: >-
      The slot is single-valued and records the organ system by which
      the channelopathy is classified clinically. JLNS1 is not confined
      to the heart: the same KCNQ1-KCNE1 channel also carries the strial
      K+-secretion current of the inner ear and the luminal K+-recycling
      current of the gastric parietal cell, both curated as
      pathophysiology nodes here, and both are epithelial transport
      defects. ChannelopathyOrganSystemEnum does offer `epithelial
      channelopathy` for exactly that, so the choice here is a real one
      rather than an absence of alternatives: cardiac was taken because
      the slot is single-valued, because the arrhythmia is what defines
      the syndrome clinically and drives its management and mortality,
      and because JLNS is universally classified with the long QT
      syndromes. No value covers a combined epithelial-and-cardiac
      channelopathy, so this assignment records the clinical
      classification rather than the full extent of the channel defect.
    evidence:
    - reference: PMID:33498651
      reference_title: "Molecular Mechanism of Autosomal Recessive Long QT-Syndrome 1 without Deafness."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Congenital long QT syndrome (LQTS) is an inherited channelopathy
        characterized by a prolonged QT-interval and arrhythmias caused by
        delayed repolarization
      explanation: >-
        Classifies congenital LQTS, of which JLNS is the recessive
        cardioauditory form, as an inherited cardiac channelopathy.
notes: >-
  Curated as the KCNQ1-caused subtype of Jervell and Lange-Nielsen syndrome
  per the MONDO gene-specific disease-series pattern. Distinct from the
  allelic dominant Romano-Ward/LQT1 entry (Familial Long QT Syndrome,
  MONDO:0019171), which is heterozygous and not associated with congenital
  deafness, and from JLNS2 (MONDO:0012871, KCNE1), curated separately.
  Deep-research preflight (`just preflight-dr`) returned WARN on the falcon
  report because KCNE1 (JLNS2's gene) is discussed alongside KCNQ1 throughout
  the source literature (both genes cause the same clinical syndrome and are
  reviewed together, e.g. GeneReviews and the Schwartz 2006 187-patient
  cohort) rather than because of entity confusion; the report itself
  explicitly separates JLNS1/KCNQ1 from JLNS2/KCNE1 in a scope statement, and
  only KCNQ1-attributed genetic and mechanistic claims were curated into this
  entry.
  A second deep-research pass (openscientist, 2026-09-06) was run for the
  augmentation round. Two concurrent invocations of that run raced, and the
  later one (start_time 14:45:40Z) overwrote the earlier one at the same
  path; only the later report is committed, and its validation sections were
  regenerated against its own body. Three of the references curated in this
  round (PMID:25453094, PMID:35331422, PMID:26205899) were surfaced by the
  earlier, overwritten run and do not appear in the committed report;
  PMID:22805636 appears in both. Each of the four was independently fetched
  from PubMed, cached, and snippet-verified here, so the evidence stands on
  its own record rather than on the report, but the committed report is not
  a complete provenance trail for this round.

  The committed report's preflight returns the same WARN as the falcon one
  and for the same reason (KCNE1 discussed alongside KCNQ1); its OMIM
  citation matches MONDO:0024540's 220400. Its reference validation resolves
  25 of 25 citations with 20 of 20 quoted claims found in source and none
  judged off topic, though only 16 of the 25 were affirmatively scored on
  topic, so that is not a clean bill of health for the other nine. Its term
  validation is the part to distrust. The report's own table counts seven
  CURIEs named as a different term, but one of those seven is
  MONDO:0024540, where the mismatch is an artifact of the report echoing the
  template placeholder "if available" as the label; that CURIE is correct and
  is this entry's own disease_term. The other six name genuinely different
  concepts and none was used here: UBERON:0002215 was offered for stria
  vascularis (it is synchondrosis), UBERON:0002228 for spiral ganglion (it
  is rib), CL:0000710 for marginal cell of stria vascularis (it is
  neurecto-epithelial cell), UBERON:0007499 for endolymph (it is epithelial
  sac), HP:0011473 for achlorhydria (it is Villous atrophy; this entry uses
  HP:0032448), and HP:0003637 for hypergastrinemia (this entry uses
  HP:0500167). The overwritten run separately offered NCIT:C2438 for
  beta-blockers (RAS Peptide Cancer Vaccine) and NCIT:C50072 for an
  implantable cardioverter-defibrillator (Modem Device). Every ontology
  binding in this entry was resolved independently and passes
  `just validate-terms`.

  No datasets: block is curated because no relevant dataset exists. GEO was
  searched by disease name (the string "Jervell" returns nothing in gds) and
  through `just discover-datasets`, which surfaced only GENE_ONLY KCNQ1 hits
  about unrelated biology: GSE168245 (KCNQ1 in human beta-cell development),
  GSE161051 (Kcnq1 imprinting cluster in hybrid mouse placenta), and
  GSE121578 (a heterozygous LQTS/Beckwith-Wiedemann imprinting case, n=2).
  All three resolve and none is about JLNS, which is the Named Entity
  Confusion pattern reached through gene-based dataset search; none was
  curated.

  Nineteen of the twenty-nine reference caches added in this round are not
  cited by the entry. They were fetched because the deep-research report's
  own reference validation resolves every citation it makes, so the whole
  set lands in the cache whether or not the curation uses it. They are kept
  rather than pruned, because pruning against a cited-PMID list is how a
  cache the entry does cite gets deleted. Why each was not used, by group.
  Cochlear-implant series (PMID:18805595, PMID:31846911, PMID:39210075) and
  deafness-screening yields (PMID:29889784, PMID:34308870, PMID:41563185)
  duplicate what PMID:26205899 already supports here; one series was
  preferred over five overlapping ones rather than stacking citations on the
  same claim. Potassium-cycling reviews (PMID:12031509, PMID:12097719,
  PMID:11223304, PMID:32581825, PMID:35138621) are background physiology
  already carried by PMID:20012478 and PMID:19491250, and PMID:11223304 is
  additionally a Kcne1 study, which is JLNS2 territory. PMID:17646758 is the
  non-English record of the same cohort as PMID:16461811, which is cited
  instead. Single-family case reports (PMID:23668803, PMID:29372044) add
  genotypes without adding a mechanism the entry does not already state. The
  remaining LQT1 iPSC and electrophysiology papers (PMID:20660394,
  PMID:31245483, PMID:40794559) are heterozygous-LQT1 rather than JLNS;
  PMID:40794559 is a live lead for a future round, since it reports
  deleterious negative inotropic effects of I_Ks activation and so bears on
  whether channel activators could help a biallelic-null patient at all.
  PMID:24268954 and PMID:42466893 are LQTS-wide denervation and registry
  series whose JLNS-relevant content is already covered by PMID:35331422.


      congenital profound bilateral sensorineural hearing loss and long QTc
    explanation: >-
      GeneReviews defines the syndrome's cochlear consequence as congenital
      profound bilateral sensorineural hearing loss.
  - reference: PMID:11226272
    reference_title: "Targeted disruption of the Kcnq1 gene produces a mouse model of Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Behavioral analysis revealed that the Kcnq1(-/-) mice are deaf and
      exhibit a shaker/waltzer phenotype.
    explanation: >-
      Confirms complete deafness (plus vestibular shaker/waltzer behavior)
      in the Kcnq1 knockout mouse, recapitulating the human hearing-loss
      consequence.

- name: Impaired Gastric Parietal Cell Luminal K+ Recycling
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    KCNQ1 (paired with KCNE2, not KCNE1, in the stomach) provides the apical
    luminal K+-recycling current required to sustain H+/K+-ATPase-driven
    gastric acid secretion in parietal cells; no other gastric K+ channel
    substitutes for this function.
  cell_types:
  - preferred_term: gastric parietal cell
    term:
      id: CL:0000162
      label: parietal cell
  biological_processes:
  - preferred_term: gastric acid secretion
    term:
      id: GO:0001696
      label: gastric acid secretion
    modifier: DECREASED
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  evidence:
  - reference: PMID:19491250
    reference_title: "KCNQ1 is the luminal K+ recycling channel during stimulation of gastric acid secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The study demonstrates that the KCNQ1 channel provides K(+) to the
      extracellular K(+) binding site of the H(+)/K(+)-ATPase during acid
      secretion, and no other gastric K(+) channel can substitute for this
      function.
    explanation: >-
      Kcnq1-knockout mouse gastric mucosa study establishing KCNQ1 as the
      obligate luminal K+-recycling channel for parietal-cell acid
      secretion.
  - reference: PMID:19491250
    reference_title: "KCNQ1 is the luminal K+ recycling channel during stimulation of gastric acid secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      basal acid secretion was absent and forskolin-stimulated acid output
      reduced by approximately 90% in KCNQ1(-/-) gastric mucosa
    explanation: >-
      Quantifies the near-abolition of stimulated gastric acid secretion in
      Kcnq1-null mucosa, the cellular basis of the achlorhydria/hypergastrinemia
      branch.
  downstream:
  - target: Achlorhydria, Hypergastrinemia, and Iron Deficiency Anemia
    description: >-
      Reduced gastric acid secretion causes compensatory hypergastrinemia
      and impairs the acid-dependent conversion of dietary iron needed for
      absorption.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19491250
      reference_title: "KCNQ1 is the luminal K+ recycling channel during stimulation of gastric acid secretion."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Microvillar secretory membranes were intact, but basal acid
        secretion was absent and forskolin-stimulated acid output reduced by
        approximately 90% in KCNQ1(-/-) gastric mucosa.
      explanation: >-
        Loss of the KCNQ1 luminal recycling current abolishes basal acid
        secretion with parietal-cell structure intact, which is the
        K+-recycling-to-achlorhydria step.
    - reference: PMID:22805636
      reference_title: "Iron-deficiency anaemia, gastric hyperplasia, and elevated gastrin levels due to potassium channel dysfunction in the Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We propose that the Jervell and Lange-Nielsen Syndrome phenotypically
        includes gastrointestinal symptoms/signs and secondary iron-deficiency
        anaemia owing to hypochlorhydria on the basis of KCNQ1 mutations.
      explanation: >-
        States this edge in humans and in the correct direction: the iron
        deficiency is secondary to hypochlorhydria, which is itself
        consequent on the KCNQ1 defect. The mouse acid-secretion study gives
        the mechanism; this gives the same causal claim in JLNS patients.
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Iron-deficient anemia and elevated levels of gastrin are also
        frequent features of JLNS.
      explanation: >-
        Confirms in patients that the gastric consequences predicted by the
        mouse acid-secretion defect (hypergastrinemia, iron-deficiency
        anemia) are actually seen in JLNS.

- name: Achlorhydria, Hypergastrinemia, and Iron Deficiency Anemia
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Loss of KCNQ1-dependent gastric acid secretion produces achlorhydria,
    with compensatory elevation of serum gastrin (loss of acid-mediated
    negative feedback on G cells) and iron-deficiency anemia from impaired
    acid-dependent dietary iron absorption. GeneReviews lists both as
    frequent, non-cardioauditory features of JLNS.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Iron-deficient anemia and elevated levels of gastrin are also frequent
      features of JLNS.
    explanation: >-
      GeneReviews documents iron-deficiency anemia and hypergastrinemia as
      frequent extracardiac, extra-auditory features of JLNS, consistent
      with the gastric parietal-cell mechanism.
  - reference: PMID:22805636
    reference_title: "Iron-deficiency anaemia, gastric hyperplasia, and elevated gastrin levels due to potassium channel dysfunction in the Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A history of iron-deficiency anaemia in 12 of 14 patients and
      subjective gastrointestinal symptoms in 13 of 14 patients was revealed.
    explanation: >-
      The dedicated extracardiac study of the complete Swedish
      double-KCNQ1-mutation cohort, which is the primary source behind the
      GeneReviews summary and quantifies the gastric phenotype rather than
      only naming it as frequent.
  - reference: PMID:22805636
    reference_title: "Iron-deficiency anaemia, gastric hyperplasia, and elevated gastrin levels due to potassium channel dysfunction in the Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated levels of gastrin in seven of nine cases, pepsinogen in six of
      seven cases, and faecal calprotectin in nine of nine cases were present.
    explanation: >-
      Measured biochemistry behind the hypergastrinemia half of this node.
  - reference: PMID:22805636
    reference_title: "Iron-deficiency anaemia, gastric hyperplasia, and elevated gastrin levels due to potassium channel dysfunction in the Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous endoscopy in five cases had revealed no case of coeliac or
      inflammatory bowel disease but three cases of mucosal
      hyperplasia/dysplasia.
    explanation: >-
      Structural gastric change accompanying the secretory defect, and the
      finding the paper's own title leads with. Three of five endoscoped
      patients had mucosal hyperplasia or dysplasia, with the common
      alternative explanations (coeliac disease, inflammatory bowel disease)
      excluded in all five.
  notes: >-
    The same cohort reports a significant correlation between elevated
    gastrin and concurrent iron deficiency or anaemia (p = 0.039), which is
    what ties the two halves of this node into one gastric mechanism rather
    than two coincident findings. Its authors also flag the sustained
    hypergastrinaemia as a potential risk factor for later gastrointestinal
    malignancy and recommend monitoring for anaemia and hypergastrinaemia in
    JLNS; no such malignancy has been reported in a JLNS patient, so that is
    curated here as the cohort's recommendation and not as a phenotype of
    the disease.

phenotypes:
- name: Congenital Profound Bilateral Sensorineural Hearing Loss
  category: Congenital
  phenotype_term:
    preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
    onset:
      onset_category: CONGENITAL
  frequency: OBLIGATE
  notes: >-
    Definitional: GeneReviews requires congenital sensorineural deafness
    for the diagnosis of JLNS, so within this entry the phenotype is
    obligate by construction. Biallelic KCNQ1 genotypes with enough
    residual channel function to spare hearing are classified as recessive
    LQT1, not JLNS.
  description: >-
    Bilateral, profound sensorineural deafness present from birth or
    recognized in early infancy; the cardinal auditory feature of JLNS.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Jervell and Lange-Nielsen syndrome (JLNS) is characterized by
      congenital profound bilateral sensorineural hearing loss and long QTc,
      usually >500 msec.
    explanation: GeneReviews defines profound congenital bilateral sensorineural hearing loss as a cardinal feature.

- name: Prolonged QTc Interval
  phenotype_term:
    preferred_term: Prolonged QTc interval
    term:
      id: HP:0005184
      label: Prolonged QTc interval
  frequency: OBLIGATE
  notes: >-
    Definitional: GeneReviews requires a long QT interval, alongside
    congenital sensorineural deafness and biallelic KCNQ1 or KCNE1
    variants, to establish the diagnosis, so the phenotype is obligate
    within this entry by construction. The 186-patient cohort mean QTc
    of 557 +/- 65 ms describes how severe the prolongation is, not how
    penetrant it is, and is not the basis for the band; GeneReviews
    itself writes "usually >500 msec".
  description: >-
    Markedly prolonged corrected QT interval on ECG, mean 557+/-65 ms in the
    largest published cohort, commonly used as a diagnostic threshold (>500
    ms) for JLNS.
  evidence:
  - reference: PMID:16461811
    reference_title: "The Jervell and Lange-Nielsen syndrome: natural history, molecular basis, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their QTc was markedly prolonged (557+/-65 ms)."
    explanation: Quantifies the markedly prolonged QTc across a 187-patient J-LN cohort.

- name: Torsade de Pointes
  phenotype_term:
    preferred_term: Torsade de pointes
    term:

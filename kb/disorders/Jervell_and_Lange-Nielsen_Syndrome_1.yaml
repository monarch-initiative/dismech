discussions:
- discussion_id: jlns1_murine_qt_extracardiac
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the QT prolongation of the Kcnq1-null mouse a valid model of the human
    JLNS cardiac phenotype, given that it appears in vivo but not in isolated
    hearts and its authors attribute it to extracardiac signals?
  attaches_to:
  - pathophysiology#Near-Complete Loss of Cardiac I_Ks Repolarizing Current
  - pathophysiology#Markedly Prolonged QTc and Arrhythmogenic Substrate
  - animal_models#Mouse
  rationale: >-
    The human mechanism curated here is cell-autonomous: biallelic KCNQ1 loss
    removes I_Ks from the ventricular cardiomyocyte, the action potential
    fails to repolarize on time, and the QT interval lengthens. The mouse
    that carries the same genotype does prolong its QT and JT intervals, but
    only in the intact animal. The effect disappeared in isolated hearts, and
    the authors concluded the repolarization defect is induced by
    extracardiac signals rather than being intrinsic to the myocardium. That
    is a different mechanism reaching a similar readout.

    Two things make this more than a technical caveat. Murine ventricular
    repolarization does not depend on I_Ks the way human repolarization does,
    so the mouse is a poor cardiac model of this disease on prior grounds,
    and the finding is what that prior would predict. And the mouse is the
    entry's main in vivo system: it carries the cochlear arm, where it
    recapitulates the human lesion well. So the same animal is strong
    evidence for one arm of the disease and weak evidence for the other, and
    nothing in the entry's structure signals that asymmetry except the
    fidelity grading on each link.

    The human cell evidence does not close the gap. The hiPSC-cardiomyocyte
    panel shows I_Ks loss and action-potential prolongation in dissociated
    cells, which is the cell-autonomous claim, but those cells cannot report
    a QT interval and are electrophysiologically immature. So the
    cell-autonomous step is shown at cellular scale in human cells, and the
    organ-scale phenotype is shown in an animal where it appears not to be
    cell-autonomous. No system currently shows both.
  proposed_experiments:
  - experiment_id: jlns1_exp_isolated_heart_ap
    name: Optical mapping of repolarization in isolated hearts across species
    description: >-
      Map action-potential duration and its transmural dispersion in
      Langendorff-perfused hearts from Kcnq1-null mice and from a large-animal
      or human-relevant preparation with the same genotype, under matched
      pacing and under beta-adrenergic stimulation. The mouse result predicts
      no intrinsic prolongation without extracardiac input; a species whose
      repolarization depends on I_Ks should prolong in the denervated,
      isolated organ.
    would_support:
    - pathophysiology#Markedly Prolonged QTc and Arrhythmogenic Substrate
    supporting_outcome:
    - >-
        Action-potential duration is prolonged and transmural dispersion
        increased in the isolated null heart, without any extracardiac
        input, establishing the organ-scale phenotype as intrinsic to
        the myocardium.
    refuting_outcome:
    - >-
        Repolarization is normal in every isolated null heart regardless
        of species, which would place the human QT prolongation
        downstream of autonomic or humoral input rather than of
        cardiomyocyte I_Ks loss and would require rewriting this edge.
  - experiment_id: jlns1_exp_engineered_tissue
    name: Engineered human cardiac tissue from JLNS hiPSC lines
    description: >-
      Build three-dimensional engineered heart tissue or cardiac slices from
      the existing JLNS hiPSC-cardiomyocyte lines and their isogenic
      controls, and measure conduction, repolarization dispersion, and
      arrhythmia inducibility under adrenergic challenge. This addresses the
      scale gap the entry records as a SCALE_EXTRAPOLATION divergence on the
      hiPSC model without introducing a species gap.
    would_support:
    - pathophysiology#Markedly Prolonged QTc and Arrhythmogenic Substrate
    supporting_outcome:
    - >-
        Human JLNS tissue shows increased repolarization dispersion and
        inducible reentrant arrhythmia relative to isogenic controls,
        supplying the tissue-scale evidence that neither current model
        provides.
    refuting_outcome:
    - >-
        Dispersion and inducibility are unchanged from isogenic
        controls, which would suggest the arrhythmogenic substrate needs
        tissue architecture or autonomic input the preparation lacks.
    evidence:
    - reference: PMID:29925535
      reference_title: "Human Induced Pluripotent Stem Cell-Derived Engineered Heart Tissue as a Sensitive Test System for QT Prolongation and Arrhythmic Triggers."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we compared head-to-head the contribution of IKs (long QT1) and IKr
        (long QT2) on action potentials (APs) in human left ventricular (LV)
        tissue and hiPSC-CM-derived engineered heart tissue (EHT)
      explanation: >-
        Establishes that the proposed preparation exists and has been
        benchmarked against human ventricular tissue for exactly the current
        this disease loses, so the experiment uses an established system
        rather than proposing a new method.
  evidence:
  - reference: PMID:11226272
    reference_title: "Targeted disruption of the Kcnq1 gene produces a mouse model of Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These changes are indicative of cardiac repolarization defects that
      appear to be induced by extracardiac signals.
    explanation: >-
      The authors' own conclusion, and the basis of this mismatch: the murine
      QT phenotype is attributed to signals outside the heart rather than to
      cardiomyocyte I_Ks loss.
  - reference: PMID:29925535
    reference_title: "Human Induced Pluripotent Stem Cell-Derived Engineered Heart Tissue as a Sensitive Test System for QT Prolongation and Arrhythmic Triggers."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Human induced pluripotent stem cell-derived cardiomyocytes (hiPSC-CMs)
      should help to overcome the limitations of animal models based on
      species differences in repolarization reserve.
    explanation: >-
      States the general form of this mismatch: repolarization reserve
      differs between species, which is why an animal model of an
      I_Ks-dependent disease may not report the human mechanism. Indirect
      because it argues the principle rather than testing the Kcnq1-null
      mouse.
  notes: >-
    The caveat is already carried structurally on the animal model link
    (PARTIALLY_RECAPITULATES, with limitations naming the isolated-heart
    result) and on the edge evidence, which is graded INDIRECT for this
    reason. This discussion promotes it from a caveat attached to one link
    into the open question it actually is.
- discussion_id: jlns1_gastric_arm_single_cohort
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How frequent is the gastric phenotype of JLNS across the allelic and
    population spectrum, given that it has been systematically looked for in
    only one national cohort?
  attaches_to:
  - pathophysiology#Impaired Gastric Parietal Cell Luminal K+ Recycling
  - pathophysiology#Achlorhydria, Hypergastrinemia, and Iron Deficiency Anemia
  - biochemical#Faecal Calprotectin
  rationale: >-
    Every quantitative statement about the gastric arm in this entry traces
    to one study of fourteen Swedish patients, and denominators within it fall
    to nine and to seven for individual analytes. That cohort is drawn from
    the national JLNS population in which p.Arg518Ter is the majority allele,
    so the figures may describe one founder genotype rather than JLNS
    generally. The mechanism is not in doubt: KCNQ1 is the non-redundant
    luminal K+ channel of the parietal cell in mouse, and the human cohort
    attributes the anemia to hypochlorhydria. What is unknown is prevalence,
    severity distribution, and whether the phenotype tracks residual channel
    function the way the cardiac and cochlear arms do.

    The raised faecal calprotectin is the sharper gap. It was abnormal in
    nine of nine patients tested, coeliac disease and inflammatory bowel
    disease were excluded by endoscopy in those scoped, and neutrophilic
    intestinal inflammation is not predicted by a parietal-cell secretory
    defect. No mechanism has been offered. KCNQ1 is expressed in intestinal
    epithelium as well as gastric, so an intestinal transport phenotype is
    plausible and unexamined.
  evidence:
  - reference: PMID:22805636
    reference_title: "Iron-deficiency anaemia, gastric hyperplasia, and elevated gastrin levels due to potassium channel dysfunction in the Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All Swedish Jervell and Lange-Nielsen cases with double KCNQ1 mutations
      (14 cases) were investigated by medical record review, an interview,
      and were offered laboratory testing for iron-deficiency anaemia and
      gastrointestinal markers.
    explanation: >-
      Gives the study's own denominator and design, which is the extent of the
      evidence base for the gastric arm and therefore the gap itself.
  notes: >-
    Recorded rather than resolved. This is why iron-deficiency anemia is
    curated at FREQUENT and not raised to VERY_FREQUENT on the cohort's
    12 of 14, and why the calprotectin finding is recorded in the biochemical
    section as unexplained rather than attached to a mechanism node.

experimental_models:
- name: JLNS patient-derived and gene-edited hiPSC cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human induced pluripotent stem cell lines carrying JLNS-causing KCNQ1
    genotypes, generated both by reprogramming patient cells and by genetic
    engineering, differentiated to cardiomyocytes and studied by patch clamp
    and multielectrode array. The panel covers the two major classes of
    JLNS-causing KCNQ1 defect (a splice-site allele, c.478-2A>T, and a
    missense allele, c.1781G>A) in homozygous, heterozygous, and wild-type
    form, so the recessive genotype-phenotype relationship is read off an
    allelic series in one human genetic background rather than inferred
    across patients. It is the human-cell counterpart to the Kcnq1-null mouse
    curated under animal_models: the mouse carries the cochlear phenotype
    that human cardiomyocytes cannot report, and this model carries the human
    cardiac electrophysiology that the mouse reports poorly because murine
    ventricular repolarization does not depend on I_Ks the way human
    repolarization does.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: hiPSC-derived cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  culture_system: Directed cardiomyocyte differentiation of hiPSC lines; patch-clamp and multielectrode array electrophysiology
  cell_source: JLNS patient somatic cells reprogrammed to hiPSC, plus isogenic genetically engineered lines
  publication: PMID:25453094
  modeled_mechanisms:
  - target: Biallelic KCNQ1 Loss-of-Function Variants
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The model resolves the trigger node into two mechanistically
      distinct allele classes: an amorphic splice-site allele that is
      strictly recessive, and a missense allele that reduces membrane
      channel density in a gene-dosage-dependent way. That distinction
      is what the entry's genetic_context describes as "missense,
      nonsense, frameshift, or splice-site". Whether it also accounts
      for why some heterozygous carriers of JLNS alleles show a
      Romano-Ward phenotype and others do not is a plausible extension
      of the result, not something this paper tests.
    evidence:
    - reference: PMID:25453094
      reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the previously unidentified c.478-2A>T mutation was amorphic and gave
        rise to a strictly recessive phenotype in JLNS-CMs, whereas the
        missense c.1781G>A lesion caused a gene dosage-dependent channel
        reduction at the cell membrane
      explanation: >-
        Establishes that this model reports the functional class of the
        causative allele, which is the claim the link makes about this node.
    readouts:
    - name: Allele-class assignment (amorphic versus hypomorphic) by isogenic comparison
      target: Biallelic KCNQ1 Loss-of-Function Variants
      direction: ALTERED
      interpretation: >-
        Comparing homozygous, heterozygous, and wild-type lines of the same
        genetic background separates a null allele from a dosage-sensitive one.
      evidence:
      - reference: PMID:25453094
        reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We used complementary approaches, reprogramming patient cells and
          genetic engineering, to generate human induced pluripotent stem cell
          (hiPSC) models of JLNS
        explanation: >-
          Describes the isogenic allelic series that makes the allele-class
          readout interpretable.
  - target: Near-Complete Loss of Cardiac I_Ks Repolarizing Current
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Human JLNS cardiomyocytes show severe reduction or outright absence of
      I_Ks, measured directly in the cell type the node is about. This is the
      one place in the entry where the central cardiac lesion is observed in
      human cells rather than inferred from mouse or from heterologous
      expression.
    evidence:
    - reference: PMID:25453094
      reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        recapitulated the typical and severe features of JLNS, including
        pronounced action and field potential prolongation and severe
        reduction or absence of IKs
      explanation: >-
        Directly reports loss of the current this node names, in human
        cardiomyocytes carrying the disease genotype.
    readouts:
    - name: Slow delayed-rectifier potassium current (I_Ks) amplitude
      target: Near-Complete Loss of Cardiac I_Ks Repolarizing Current
      direction: ABOLISHED
      interpretation: >-
        Severe reduction or absence of I_Ks is the direct electrophysiological
        measurement of the node.
      evidence:
      - reference: PMID:25453094
        reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          recapitulated the typical and severe features of JLNS, including
          pronounced action and field potential prolongation and severe
          reduction or absence of IKs
        explanation: >-
          The reported measurement of I_Ks amplitude in JLNS versus wild-type
          cardiomyocytes.
  - target: Markedly Prolonged QTc and Arrhythmogenic Substrate
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Action-potential and field-potential prolongation are the single-cell
      and monolayer correlates of the prolonged QT interval, and the model
      also reproduces the two clinical features that make the substrate
      dangerous: adrenergic provocation lengthens the action potential
      specifically in JLNS cells, matching the emotion- and exercise-triggered
      events that account for 95% of arrhythmias in patients, and sensitivity
      to QT-prolonging drugs is markedly increased, which is the in-vitro
      counterpart of the drug-avoidance advice curated under treatments.
    limitations: >-
      The QTc is a whole-heart measurement and this model observes only
      cardiomyocyte-level repolarization. Dispersion of repolarization across
      the ventricular wall, reentry, and the conducted arrhythmia itself are
      tissue-level properties that dissociated or monolayer cardiomyocytes
      cannot report, so calling field-potential prolongation an
      arrhythmogenic substrate is an inference. hiPSC-derived cardiomyocytes
      are also electrophysiologically immature relative to adult ventricular
      myocardium, with a depolarized resting potential and a mixed
      atrial/ventricular/nodal population.
    divergences:
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The model measures action and field potential duration in
        cardiomyocytes; the node is a tissue-level arrhythmogenic substrate on
        the surface ECG. The intervening step, transmural dispersion of
        repolarization organizing into reentry, is not observed here.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Autonomic innervation is outside the culture, so the adrenergic
        provocation is applied pharmacologically rather than arising from the
        sympathetic surge that triggers events in patients. The clinical
        relevance of left cardiac sympathetic denervation, curated under
        treatments, turns on exactly the structure this model omits.
    evidence:
    - reference: PMID:25453094
      reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Moreover, adrenergic stimulation caused action potential prolongation
        specifically in JLNS-CMs.
      explanation: >-
        Reproduces the adrenergic trigger dependence of the clinical
        arrhythmic substrate in the human cell model.
    readouts:
    - name: Action potential and field potential duration
      target: Markedly Prolonged QTc and Arrhythmogenic Substrate
      direction: INCREASED
      interpretation: >-
        Prolonged repolarization at the cellular and monolayer level is the
        in-vitro correlate of the prolonged QTc, one scale below it.
      evidence:
      - reference: PMID:25453094
        reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          pronounced action and field potential prolongation
        explanation: >-
          The measured prolongation of repolarization in JLNS cardiomyocytes.
    - name: Susceptibility to proarrhythmic drug challenge
      target: Markedly Prolonged QTc and Arrhythmogenic Substrate
      direction: INCREASED
      interpretation: >-
        Increased sensitivity to QT-prolonging drugs in JLNS cardiomyocytes is
        the in-vitro counterpart of the clinical instruction to avoid
        QT-prolonging agents, and it was pharmacologically correctable in this
        system.
      evidence:
      - reference: PMID:25453094
        reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          sensitivity to proarrhythmic drugs was strongly enhanced in JLNS-CMs
          but could be pharmacologically corrected
        explanation: >-
          Reports both the increased drug susceptibility and its
          pharmacological correction in the model.
  evidence:
  - reference: PMID:25453094
    reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Electrophysiological comparison of hiPSC-derived cardiomyocytes (CMs)
      from homozygous JLNS, heterozygous, and wild-type lines recapitulated
      the typical and severe features of JLNS
    explanation: >-
      Establishes the model as informative for the JLNS cardiac phenotype:
      the disease genotype reproduces the disease electrophysiology in human
      cardiomyocytes.

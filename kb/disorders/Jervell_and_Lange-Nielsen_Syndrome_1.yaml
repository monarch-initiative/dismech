- name: NOS1AP
  gene_term:
    preferred_term: NOS1AP
    term:
      id: hgnc:16859
      label: NOS1AP
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >-
    Recorded as the one arrhythmia-severity modifier with a worked mechanism,
    and hedged accordingly. The evidence is from LQT1, not JLNS: the hiPSC
    cardiomyocytes compared symptomatic and asymptomatic carriers of the
    heterozygous KCNQ1 A341V variant, and the complementary work used a
    guinea-pig cardiomyocyte model in which LQT1 was mimicked
    pharmacologically. Nobody has shown a NOS1AP effect in JLNS patients. It
    is curated here because the proposed mechanism is convergence on
    prolonged action-potential duration, which JLNS has in the extreme, so
    the modifier is mechanistically plausible for this disease rather than
    demonstrated in it. Treat it as a lead for the variable arrhythmic
    expressivity JLNS shows at fixed genotype, not as an established
    genotype-phenotype determinant.

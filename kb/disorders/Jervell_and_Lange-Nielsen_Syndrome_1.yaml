- name: Congenital Profound Bilateral Sensorineural Hearing Loss
  biological_scale: ORGANISM
  role: consequence
  conforms_to: sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss
  description: >-
    The combined cochlear injury produces profound bilateral sensorineural
    hearing loss present from birth or recognized in early infancy. Unlike
    the noise/age/ototoxic triggers of the generic module, the JLNS1 deficit
    is congenital and essentially maximal at onset rather than progressive,
    but it shares the module's irreversibility because the mammalian cochlea
    does not regenerate.
  evidence:

    explanation: Independent cohort confirms the ~90% KCNQ1 share and the more severe course relative to KCNE1-related JLNS2.
  - reference: PMID:37872640
    reference_title: "Beyond gene-disease validity: capturing structured data on inheritance, allelic requirement, disease-relevant variant classes, and disease mechanism for inherited cardiac conditions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      both PTCs and missense variants leading to LoF of KCNQ1 are associated
      with LQTS and Jervell Lange-Nielsen syndrome
    explanation: >-
      Structured ClinGen-aligned gene-disease curation confirms KCNQ1
      loss-of-function (protein-truncating and missense) as the JLNS1
      mechanism, classified with biallelic autosomal requirement.
  - reference: PMID:24552659
    reference_title: "Phenotype, origin and estimated prevalence of a common long QT syndrome mutation: a clinical, genealogical and molecular genetics study including Swedish R518X/KCNQ1 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical phenotype ranged from expectedly severe in JLNS to
      surprisingly benign in LQTS (QTc 576 ± 61 ms vs. 462 ± 34 ms,
      cumulative incidence of (aborted) cardiac arrest 47% vs. 1%
    explanation: >-
      The gene-dosage contrast within a single founder allele: the same
      KCNQ1 variant gives markedly longer QTc and a 47-fold higher cardiac
      arrest incidence when biallelic than when heterozygous.
  - reference: PMID:38825991
    reference_title: Genetic characterization of KCNQ1 variants improves risk stratification in type 1 long QT syndrome patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with heterozygous JLNS mutations (HTZ-JLNS) represented 22% of
      heterozygous KCNQ1 variant carriers and had a lower risk of cardiac
      events than heterozygous non-JLNS variant carriers (HTZ-Non-JLNS)
      [hazard ratio (HR) = 0.34 (0.22-0.54); P < 0.01]
    explanation: >-
      The counterintuitive half of the dosage relationship, from a
      789-carrier series: alleles severe enough to cause JLNS when biallelic
      are milder than other LQT1 alleles when heterozygous, which is what
      recessiveness predicts and is the basis for counselling a proband's
      carrier parents.
  notes: >-
    Gene dosage, not merely gene identity, sets the phenotype. Biallelic
    KCNQ1 loss causes JLNS; a single copy of the same allele causes
    Romano-Ward LQT1 or nothing at all, and the gap between the two states is
    large and quantified. In the Swedish p.R518X founder families the
    contrast within one allele is QTc 576 +/- 61 ms in JLNS homozygotes
    against 462 +/- 34 ms in heterozygotes, with cumulative (aborted) cardiac
    arrest of 47% against 1%. The less obvious half of the dosage story is
    that heterozygous carriers of JLNS-causing alleles are milder than
    typical LQT1 heterozygotes, not more severe: in a 789-carrier series they
    had a lower risk of cardiac events than carriers of non-JLNS KCNQ1
    variants (hazard ratio 0.34). That is what recessiveness means at the
    channel level, and it is why a JLNS proband's heterozygous parents are
    often asymptomatic, as this entry's inheritance section records.

    One consequence for reading the rest of this entry: the Swedish cohort in
    which the extracardiac gastric phenotype was characterized
    (PMID:22805636, cited on the gastric pathophysiology node and in the
    biochemical section) is drawn from the same national JLNS population as
    the p.Arg518Ter founder families below. Neither paper states the overlap,
    so it is not asserted here, but it is a reason to read the gastric
    findings as characterized in a largely single-allele population rather
    than across the JLNS allelic spectrum.
  variants:
  - name: KCNQ1 p.Arg518Ter
    description: >-
      c.1552C>T, p.Arg518*, a protein-truncating KCNQ1 allele and a worldwide
      cause of both recessive JLNS and dominant LQT1. In Sweden it is a
      founder mutation accounting for the majority of JLNS cases and the
      second most common cause of LQTS, with a shared haplotype across 17 of
      19 index families, an estimated mutation age of 28 generations, and
      geographical clustering in the Pite River valley. Estimated
      heterozygote prevalence there is roughly 1 in 2,000 to 4,000, which
      makes it the best-characterized single JLNS allele anywhere and the
      reason Swedish series recur throughout the JLNS literature.
    gene:
      preferred_term: KCNQ1
      term:
        id: hgnc:6294
        label: KCNQ1
    type: nonsense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24552659
      reference_title: "Phenotype, origin and estimated prevalence of a common long QT syndrome mutation: a clinical, genealogical and molecular genetics study including Swedish R518X/KCNQ1 families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The R518X/KCNQ1 mutation is a common cause of autosomal recessive
        (Jervell and Lange Nielsen Syndrome- JLNS) and autosomal dominant
        long QT syndrome (LQTS) worldwide.
      explanation: >-
        Establishes this single allele as a cause of both the recessive and
        the dominant disease depending on dosage.
    - reference: PMID:24552659
      reference_title: "Phenotype, origin and estimated prevalence of a common long QT syndrome mutation: a clinical, genealogical and molecular genetics study including Swedish R518X/KCNQ1 families."
      supports: SUPPORT

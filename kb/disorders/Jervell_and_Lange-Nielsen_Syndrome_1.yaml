inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  description: >-
    JLNS1 requires biallelic (homozygous or compound heterozygous)
    loss-of-function KCNQ1 variants. Heterozygous carrier parents are usually
    unaffected or, less often, manifest dominant Romano-Ward LQT1; each
    sibling of an affected individual has a 25% chance of being affected, a
    50% chance of being a carrier, and a 25% chance of being unaffected and
    not a carrier. Penetrance of the classic cardioauditory phenotype is high
    but not complete: some biallelic genotypes with residual channel
    function instead cause recessive LQT1 without deafness.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      JLNS is inherited in an autosomal recessive manner. Parents of a child
      with JLNS are usually heterozygotes
    explanation: GeneReviews describes the autosomal recessive inheritance pattern and typical carrier-parent status.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      each sib of an affected individual usually has a 25% chance of being

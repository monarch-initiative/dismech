- name: Late-Stage Schwann-Lineage SMARCB1 and NF2 Co-Inactivation
  biological_scale: CELLULAR
  description: >-
    When SMARCB1 loss occurs at a later developmental stage within the Schwann
    cell lineage (especially with hypomorphic 5-prime or 3-prime germline
    SMARCB1 alleles) accompanied by somatic biallelic NF2 inactivation, cells
    form adult-onset benign non-vestibular schwannomas rather than infantile
    malignant rhabdoid tumors.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:28824165
    reference_title: "Timing of Smarcb1 and Nf2 inactivation determines schwannoma versus rhabdoid tumor development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By inducing Smarcb1 loss at later developmental stage in the Schwann cell
      lineage, in addition to biallelic Nf2 gene inactivation, we generated the
      first mouse model developing schwannomas with the same underlying gene
      mutations found in schwannomatosis patients.
    explanation: >-
      Demonstrates that later developmental timing in the Schwann cell lineage
      plus biallelic Nf2 loss shifts the tumor outcome from malignant rhabdoid
      tumor to schwannoma.
  downstream:
  - target: Schwannomatosis
    causal_link_type: DIRECT
    description: Late-stage Schwann-lineage SMARCB1 and NF2 co-inactivation produces multiple peripheral and cranial-nerve schwannomas

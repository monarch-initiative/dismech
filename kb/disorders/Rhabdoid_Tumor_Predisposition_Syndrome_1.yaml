name: Rhabdoid Tumor Predisposition Syndrome 1
creation_date: "2026-08-31T00:00:00Z"
description: >-
  Rhabdoid tumor predisposition syndrome 1 (RTPS1) is an autosomal dominant
  cancer predisposition caused by heterozygous germline loss-of-function
  variants in SMARCB1, which encodes a core subunit of the SWI/SNF (BAF)
  ATP-dependent chromatin remodelling complex. Carriers develop malignant
  rhabdoid tumours in infancy and early childhood at central nervous system,
  renal and extrarenal soft tissue sites, frequently synchronously at more
  than one site. Roughly a third of children with a rhabdoid tumour carry a
  germline SMARCB1 variant; germline cases present at a younger age and have
  a worse outcome than sporadic cases. Tumours arise by classical two-hit
  inactivation, and are otherwise notable for a near-silent somatic mutational
  landscape, so that SMARCB1 loss is close to the entire oncogenic mechanism.
category: Mendelian
parents:
- hereditary disease
synonyms:
- RTPS1
- SMARCB1 familial rhabdoid tumor
- familial rhabdoid tumor caused by mutation in SMARCB1
- rhabdoid predisposition syndrome type 1
disease_term:
  preferred_term: rhabdoid tumor predisposition syndrome 1
  term:
    id: MONDO:0012252
    label: rhabdoid tumor predisposition syndrome 1
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    RTPS1 is transmitted as an autosomal dominant trait with high but
    incomplete penetrance. A large proportion of probands carry a de novo
    variant, and germline mosaicism accounts for recurrence in siblings of
    apparently unaffected parents. Penetrance is high.
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The vast majority of individuals with SMARCB1-related RTPS have a de novo
      disease-causing SMARCB1 germline variant.
    explanation: >-
      GeneReviews confirms that most RTPS1 probands carry a de novo variant.
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The penetrance of SMARCB1-related RTPS may be extremely high in individuals
      who inherit a SMARCB1 disease-causing variant.
    explanation: >-
      States the high penetrance of the SMARCB1 form, the contrast with RTPS2.
  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Families may demonstrate incomplete penetrance and gonadal mosaicism, which
      must be considered when counseling families of patients with rhabdoid tumor.
    explanation: >-
      Establishes incomplete penetrance and gonadal mosaicism as counselling
      considerations in RTPS1 families.
  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were nine cases that demonstrated parent to child transmission of a
      mutated copy of SMARCB1.
    explanation: >-
      Documents vertical transmission consistent with autosomal dominant
      inheritance.
pathophysiology:
- name: Germline SMARCB1 Loss-of-Function
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline deletion, nonsense or frameshift SMARCB1 allele
    provides the constitutional first hit in every cell of the developing
    child.
  genes:
  - preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  evidence:
  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germline mutations and deletions of SMARCB1/INI1 in chromosome band 22q11.2
      predispose patients to rhabdoid tumor and schwannomatosis.
    explanation: >-
      Names the germline lesion and the two tumour phenotypes it predisposes to.
  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately one-third of newly diagnosed patients with rhabdoid tumor have
      an underlying genetic predisposition to tumors due to a germline SMARCB1
      alteration.
    explanation: >-
      Quantifies how often a rhabdoid tumour is germline-driven, the figure behind
      testing every child at diagnosis.
  downstream:
  - target: Somatic Inactivation of the Second SMARCB1 Allele
    description: >-
      The constitutional allele is present in every cell, so a single stochastic
      somatic event in any susceptible progenitor is sufficient to complete
      biallelic inactivation.
- name: Somatic Inactivation of the Second SMARCB1 Allele
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  biological_scale: MOLECULAR
  description: >-
    Loss of the remaining wild-type allele in a susceptible progenitor,
    typically by deletion or copy-neutral loss of heterozygosity, completes
    biallelic inactivation and initiates the tumour.
  genes:
  - preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  evidence:
  - reference: PMID:24853101
    reference_title: "Mechanisms by which SMARCB1 loss drives rhabdoid tumor growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mouse models validated Smarcb1 as a bona fide tumor suppressor, as Smarcb1
      inactivation in mice results in 100% of the animals rapidly developing
      cancer.
    explanation: >-
      Establishes SMARCB1 as a true tumour suppressor whose inactivation is
      sufficient to drive tumorigenesis.
  downstream:
  - target: SWI/SNF Chromatin Remodelling Complex Dysfunction
    description: >-
      Complete loss of the SMARCB1 core subunit destabilises the residual BAF
      complex and impairs nucleosome repositioning.
- name: SWI/SNF Chromatin Remodelling Complex Dysfunction
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  biological_scale: MOLECULAR
  description: >-
    Loss of the SMARCB1 core subunit does not dismantle the BAF complex, which
    still assembles without it. What it destabilises is the complex's chromatin
    occupancy: targeting to promoters and typical enhancers is impaired and the
    complex is redistributed away from the sites it normally maintains. The
    distinction matters, because it makes rhabdoid tumorigenesis an epigenetic
    mislocalisation defect rather than a loss of remodelling capacity.
  evidence:
  - reference: PMID:24853101
    reference_title: "Mechanisms by which SMARCB1 loss drives rhabdoid tumor growth."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SMARCB1 (INI1/SNF5/BAF47), a core subunit of the SWI/SNF (BAF)
      chromatin-remodeling complex, is inactivated in the large majority of
      rhabdoid tumors, and germline heterozygous SMARCB1 mutations form the basis
      for rhabdoid predisposition syndrome.
    explanation: >-
      Identifies SMARCB1 as a core BAF subunit and links its loss to both sporadic
      and germline rhabdoid disease.
  - reference: PMID:24853101
    reference_title: "Mechanisms by which SMARCB1 loss drives rhabdoid tumor growth."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It has been reported dispensable for formation of the SWI/SNF complex (42)
      but implicated in contributing to the targeting of the SWI/SNF complex to
      promoters (43).
    explanation: >-
      Supports the corrected claim: SMARCB1 is not required to assemble the
      complex, but is required to target it, so its loss is an occupancy defect
      rather than a structural one.
  - reference: PMID:24853101
    reference_title: "Mechanisms by which SMARCB1 loss drives rhabdoid tumor growth."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Given the absence of genomic instability despite the rapidity by which
      SMARCB1 deficient cancers arise both in humans and mice, these findings
      collectively suggest that the initiation and progression of aggressive
      cancers caused by SMARCB1 loss may not arise due to effects upon genome
      integrity, but rather epigenetically via perturbation of transcriptional
      regulation.
    explanation: >-
      Establishes the epigenetic rather than genomic-instability basis of rhabdoid
      tumorigenesis, the reason this entry models a chromatin-occupancy chain.
  downstream:
  - target: Failure of Enhancer-Mediated Differentiation
    description: >-
      Without functional BAF activity at typical enhancers, lineage
      differentiation programmes are never activated and PRC2-mediated
      repression goes unopposed.
- name: Failure of Enhancer-Mediated Differentiation
  biological_scale: CELLULAR
  description: >-
    Without functional BAF activity at typical enhancers, lineage
    differentiation programmes are not activated and progenitors remain in a
    proliferative, undifferentiated state. Loss of BAF-mediated opposition to
    PRC2 leaves EZH2-dependent repression unchecked at these loci.
  evidence:
  - reference: PMID:24853101
    reference_title: "Mechanisms by which SMARCB1 loss drives rhabdoid tumor growth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      deletion of SMARCB1 led to elevated expression and recruitment of EZH2 to
      Polycomb targets that became broadly H3K27-trimethylated and repressed in
      SMARCB1-deficient fibroblasts and cancers
    explanation: >-
      Directly supports the unchecked EZH2-dependent PRC2 repression this node
      asserts, replacing a generic relevance statement that supported nothing
      about enhancers, differentiation or PRC2.
  downstream:
  - target: Rhabdoid Tumorigenesis
    description: >-
      Progenitors held in an undifferentiated, proliferative state give rise to
      malignant rhabdoid tumours.
- name: Rhabdoid Tumorigenesis
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  biological_scale: TISSUE
  description: >-
    The arrested progenitor gives rise to a malignant rhabdoid tumour, which
    may arise in the central nervous system as atypical teratoid/rhabdoid
    tumour, in the kidney, or in extrarenal soft tissue, and in RTPS1
    frequently at more than one site synchronously.
animal_models:
- name: Conditional Smarcb1 and Nf2 knockout mouse
  species: Mouse
  genotype: Tissue- and developmental-stage-specific conditional Smarcb1 and/or Nf2 deletion
  publication: PMID:28824165
  description: >-
    A conditional knockout series that varies the developmental timing of
    Smarcb1 loss, showing that the same gene produces rhabdoid tumours or
    schwannomas depending on when in development the allele is lost.
  modeled_mechanisms:
  - target: Rhabdoid Tumorigenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Smarcb1 loss in early neural crest generates cranial nerve and meningeal
      tumours with the histology and molecular profile of human rhabdoid tumours.
    limitations: >-
      The tumours arise in cranial nerves and meninges rather than the
      infratentorial sites typical of human ATRT, and the model uses conditional
      somatic deletion rather than a constitutional heterozygous allele with a
      stochastic second hit.
    evidence:
    - reference: PMID:28824165
      reference_title: "Timing of Smarcb1 and Nf2 inactivation determines schwannoma versus rhabdoid tumor development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Smarcb1 loss in early neural crest was necessary to initiate tumorigenesis
        in the cranial nerves and meninges with typical histological features and
        molecular profiles of human rhabdoid tumors.
      explanation: >-
        Establishes that early developmental Smarcb1 loss is what initiates
        rhabdoid tumorigenesis in this model.
  evidence:
  - reference: PMID:28824165
    reference_title: "Timing of Smarcb1 and Nf2 inactivation determines schwannoma versus rhabdoid tumor development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Germline mutations of the SMARCB1 gene predispose to two distinct tumor
      syndromes: rhabdoid tumor predisposition syndrome, with malignant pediatric
      tumors mostly developing in brain and kidney, and familial schwannomatosis,
      with adulthood benign tumors involving cranial and peripheral nerves.
    explanation: >-
      Frames the question this model answers, namely why one germline gene yields
      two clinically distinct syndromes.
phenotypes:
- category: Neoplastic
  name: Atypical Teratoid Rhabdoid Tumor
  description: >-
    Malignant rhabdoid tumour of the central nervous system, typically
    infratentorial and presenting in the first two years of life. It is the
    commonest tumour in RTPS1 and carries the worst prognosis.
  phenotype_term:
    preferred_term: Atypical teratoid/rhabdoid tumor
    term:
      id: HP:0034401
      label: Atypical teratoid/rhabdoid tumor
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They often occur in the central nervous system (i.e., atypical
      teratoid/rhabdoid tumor]); more than 50% occur in the cerebellum.
    explanation: >-
      Gives the site distribution within the CNS, which the general germline
      proportion quote could not supply for this specific phenotype.
- category: Neoplastic
  name: Rhabdoid Tumor of the Kidney
  description: >-
    Malignant rhabdoid tumour of the kidney, historically described as a
    rhabdoid variant of Wilms tumour before it was recognised as a distinct
    SMARCB1-driven entity.
  phenotype_term:
    preferred_term: Rhabdoid tumor of the kidney
    term:
      id: HP:0034402
      label: Rhabdoid tumor of the kidney
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other common locations include extracranial malignant rhabdoid tumors (e.g.,
      rhabdoid tumors of the head and neck, paravertebral muscles, liver, bladder,
      mediastinum, retroperitoneum, pelvis, and heart), rhabdoid tumor of the
      kidney, and possibly small-cell carcinoma of the ovary, hypercalcemic type
      (SCCOHT).
    explanation: >-
      Names rhabdoid tumour of the kidney specifically, which the general germline
      proportion quote could not.
- category: Neoplastic
  name: Extrarenal Extracranial Rhabdoid Tumor
  description: >-
    Malignant rhabdoid tumour arising in soft tissue, liver or other
    extrarenal extracranial sites.
  phenotype_term:
    preferred_term: Rhabdoid tumor
    term:
      id: HP:0034557
      label: Rhabdoid tumor
- category: Neoplastic
  name: Synchronous Multifocal Rhabdoid Tumors
  description: >-
    Presentation with tumours at more than one anatomical site simultaneously
    is characteristic of germline rather than sporadic disease and should
    prompt germline SMARCB1 testing.
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More than 70% of individuals with RTPS present before age 12 months with
      synchronous tumors that exhibit aggressive clinical behavior.
    explanation: >-
      Quantifies both the infantile onset and the synchronous multifocal
      presentation that marks germline disease.
  - reference: PMID:37548271
    reference_title: "Constitutional balanced translocations involving SMARCB1: A rare cause of rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RTPS1 should be evaluated in all individuals with rhabdoid tumor and is more
      likely in those with a young age at presentation (occasionally congenital
      presentation), multiple primary tumors, or a family history of rhabdoid
      tumor or RTPS1.
    explanation: >-
      Names multiple primary tumours as a feature pointing to germline disease.
  phenotype_term:
    preferred_term: Rhabdoid tumor
    term:
      id: HP:0034557
      label: Rhabdoid tumor
- category: Neoplastic
  name: Schwannomatosis
  description: >-
    A distinct allelic presentation in which germline SMARCB1 variants,
    typically hypomorphic, cause multiple non-vestibular schwannomas in
    adults rather than infantile rhabdoid tumours.
  phenotype_term:
    preferred_term: Schwannoma
    term:
      id: HP:0100008
      label: Schwannoma
  evidence:
  - reference: PMID:24933152
    reference_title: "SMARCB1 mutations in schwannomatosis and genotype correlations with rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMARCB1 mutations have been found in 45% of familial probands and 9% of
      sporadic patients.
    explanation: >-
      Quantifies the SMARCB1 contribution to schwannomatosis in familial versus
      sporadic cases.
  - reference: PMID:24933152
    reference_title: "SMARCB1 mutations in schwannomatosis and genotype correlations with rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a clear genotype-phenotype correlation, with germline rhabdoid
      mutations being significantly more likely to be centrally placed, involve
      multiple exon deletions, and be truncating mutations.
    explanation: >-
      Explains why the same gene yields infantile rhabdoid tumours or adult
      schwannomatosis: truncating central alleles drive the rhabdoid phenotype
      while terminal non-truncating alleles drive schwannomatosis.
  - reference: PMID:28824165
    reference_title: "Timing of Smarcb1 and Nf2 inactivation determines schwannoma versus rhabdoid tumor development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By inducing Smarcb1 loss at later developmental stage in the Schwann cell
      lineage, in addition to biallelic Nf2 gene inactivation, we generated the
      first mouse model developing schwannomas with the same underlying gene
      mutations found in schwannomatosis patients.
    explanation: >-
      Shows the schwannoma phenotype requires later-stage Smarcb1 loss plus NF2
      inactivation, a developmental-timing mechanism complementing the
      allele-position correlation.
- category: Neoplastic
  name: Choroid Plexus Carcinoma
  description: >-
    Choroid plexus carcinoma occurs in a minority of carriers and enters the
    differential with the TP53-driven form seen in Li-Fraumeni syndrome.
  phenotype_term:
    preferred_term: Choroid plexus carcinoma
    term:
      id: HP:0030392
      label: Choroid plexus carcinoma
genetic:
- name: SMARCB1
  notes: >-
    Germline SMARCB1 alleles causing RTPS1 are predominantly truncating point
    and frameshift variants, intragenic deletions and duplications, and larger
    22q11.2 deletions. Constitutional balanced translocations disrupting
    SMARCB1 are a rare cause that standard copy-number and sequencing panels
    miss, so structural variant analysis is warranted when those are negative.
    Allele position and type separate the rhabdoid and schwannomatosis
    phenotypes.
  gene_term:
    preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These abnormalities included point and frameshift mutations, intragenic
      deletions and duplications, and larger deletions including regions both
      proximal and distal to SMARCB1.
    explanation: Enumerates the germline SMARCB1 variant classes found in the cohort.
  - reference: PMID:37548271
    reference_title: "Constitutional balanced translocations involving SMARCB1: A rare cause of rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most known RTPS1-related SMARCB1 gene mutations are copy number variants
      (CNVs) or single nucleotide variants/indels, but structural variant analysis
      (SVA) is not usually included in the molecular evaluation.
    explanation: >-
      Identifies the diagnostic gap that constitutional balanced translocations
      fall through.
  - reference: PMID:24933152
    reference_title: "SMARCB1 mutations in schwannomatosis and genotype correlations with rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparison with germline SMARCB1 mutations in patients with rhabdoid tumors
      showed that the schwannomatosis mutations were significantly more likely to
      occur at either end of the gene and be nontruncating mutations (P < 0.0001).
    explanation: >-
      Statistical basis for the allele-position genotype-phenotype correlation.
treatments:
- name: Multimodal Therapy for Atypical Teratoid Rhabdoid Tumor
  description: >-
    Intensive multimodal therapy combining induction chemotherapy, high-dose
    chemotherapy with stem cell rescue, and conformal radiation. The Children's
    Oncology Group ACNS0333 trial established that this approach substantially
    improves survival over historical controls in a disease that was previously
    close to uniformly fatal.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:32105509
    reference_title: "Efficacy of High-Dose Chemotherapy and Three-Dimensional Conformal Radiation for Atypical Teratoid/Rhabdoid Tumor: A Report From the Children's Oncology Group Trial ACNS0333."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ACNS0333 therapy significantly reduced the risk of EFS events in patients <
      36 months of age compared with the historical cohort (P < .0005; hazard
      rate, 0.43; 95% CI, 0.28 to 0.66).
    explanation: >-
      Primary endpoint result showing the regimen more than halved event-free
      survival events in infants versus historical controls.
  - reference: PMID:32105509
    reference_title: "Efficacy of High-Dose Chemotherapy and Three-Dimensional Conformal Radiation for Atypical Teratoid/Rhabdoid Tumor: A Report From the Children's Oncology Group Trial ACNS0333."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four-year EFS and overall survival for the entire cohort were 37% (95% CI,
      25% to 49%) and 43% (95% CI, 31% to 55%), respectively.
    explanation: >-
      Absolute survival figures, which remain poor despite the improvement.
- name: Age-Stratified Tumor Surveillance
  description: >-
    Carriers are followed with whole-body MRI from diagnosis and an
    age-stratified schedule of clinical examination, abdominal and neck
    ultrasound, and brain and spine MRI, intensive in the first years of life
    and relaxing after age five.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Rhabdoid Tumorigenesis
    description: >-
      Surveillance aims to detect tumours at the earliest possible stage rather
      than to prevent the underlying biallelic inactivation.
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Age 19 months to five years. Every three months, thorough clinical
      examination including neurologic examination, ultrasound of the abdomen
      and neck, and brain and spine MRI.
    explanation: >-
      The age-stratified surveillance schedule GeneReviews recommends for
      carriers.
- name: Germline SMARCB1 Testing and Family Surveillance
  description: >-
    Because roughly a third of rhabdoid tumours are germline-driven, germline
    SMARCB1 testing is indicated in every child presenting with a rhabdoid
    tumour, with cascade testing and surveillance for at-risk relatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37548271
    reference_title: "Constitutional balanced translocations involving SMARCB1: A rare cause of rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RTPS1 should be evaluated in all individuals with rhabdoid tumor and is more
      likely in those with a young age at presentation (occasionally congenital
      presentation), multiple primary tumors, or a family history of rhabdoid
      tumor or RTPS1.
    explanation: Supports universal germline evaluation at rhabdoid tumour diagnosis.
diagnosis:
- name: Germline SMARCB1 molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Germline testing is indicated in every child with a rhabdoid tumour, and
    especially with young age at presentation, multiple primary tumours, or a
    family history. Structural variant analysis should be added when sequencing
    and copy-number testing are negative, since constitutional balanced
    translocations disrupting SMARCB1 are missed by standard panels.
  results: >-
    A heterozygous germline pathogenic SMARCB1 variant establishes the diagnosis.
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of RTPS is established in a proband with a rhabdoid tumor
      and/or a family history of rhabdoid tumor and/or multiple SMARCB1- or
      SMARCA4-deficient tumors (synchronous or metachronous), and a heterozygous
      disease-causing germline variant in SMARCB1 (RTPS1) or SMARCA4 (RTPS2)
      identified by molecular genetic testing.
    explanation: >-
      The molecular diagnostic criterion for both RTPS types.
references:
- reference: PMID:29215836
  title: "Rhabdoid Tumor Predisposition Syndrome."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      GeneReviews provides the clinical baseline for both RTPS types, covering
      tumour site distribution and age at presentation, the molecular diagnostic
      criterion, the age-stratified whole-body MRI surveillance protocol, the
      risk-reducing salpingo-oophorectomy discussion specific to SMARCA4, and the
      penetrance contrast between the SMARCB1 and SMARCA4 forms.

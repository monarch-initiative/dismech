      reference_title: "Rhabdoid Tumor Predisposition Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Rhabdoid tumor predisposition syndrome (RTPS) is characterized by a
        markedly increased risk for the development of rhabdoid tumors – rare
        and highly aggressive malignant tumors occurring predominantly in
        infants and children younger than age three years.
      explanation: >-
        Establishes RTPS1 as an inherited pediatric malignant tumor
        predisposition syndrome.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:21108436
      reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Germline mutations and deletions of SMARCB1/INI1 in chromosome band
        22q11.2 predispose patients to rhabdoid tumor and schwannomatosis.
      explanation: >-
        Establishes constitutional germline SMARCB1 defects as the genetic
        cause of RTPS1.
  icdo_morphology:
    classification_value: Embryonal Neoplasm
    evidence:
    - reference: PMID:21108436
      reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Rhabdoid tumors are particularly aggressive pediatric malignancies that
        primarily develop in infancy and early childhood. They are referred to
        as atypical teratoid/ rhabdoid tumor (AT/RT) when they arise in the
        central nervous system and malignant rhabdoid tumor (MRT) when they are
        found in renal or extra-renal sites.
      explanation: >-
        Places the signature CNS and extrarenal rhabdoid tumors of RTPS1 among
        infantile embryonal-spectrum malignancies, matching RTPS2.

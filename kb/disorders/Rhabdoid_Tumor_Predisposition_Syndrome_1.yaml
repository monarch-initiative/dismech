  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately one-third of newly diagnosed patients with rhabdoid tumor have
      an underlying genetic predisposition to tumors due to a germline SMARCB1
      alteration.
    explanation: >-
      Quantifies how often a rhabdoid tumour is germline-driven, the figure behind
      testing every child at diagnosis.
  downstream:
  - target: Somatic Inactivation of the Second SMARCB1 Allele
    description: >-
      The constitutional allele is present in every cell, so a single stochastic
      somatic event in any susceptible progenitor is sufficient to complete
      biallelic inactivation.
  - target: Late-Stage Schwann-Lineage SMARCB1 and NF2 Co-Inactivation
    description: >-
      In Schwann-lineage cells during later developmental windows, germline
      SMARCB1 predisposition combined with somatic second-hit SMARCB1 and
      biallelic NF2 loss initiates schwannomatosis rather than rhabdoid tumor.
- name: Somatic Inactivation of the Second SMARCB1 Allele
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    allelic_hit_role: SECOND_HIT
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Loss of the remaining wild-type SMARCB1 allele in an early neural crest or
    neural progenitor cell—typically by deletion, copy-neutral loss of
    heterozygosity, or frameshift mutation—completes biallelic inactivation,
    eliminates nuclear SMARCB1 (INI1) protein expression, and initiates the
    tumor.

  - target: Synchronous Multifocal Rhabdoid Tumors
    causal_link_type: DIRECT
    description: Independent somatic second hits across multiple susceptible progenitors produce synchronous primary rhabdoid tumors
  - target: Choroid Plexus Carcinoma

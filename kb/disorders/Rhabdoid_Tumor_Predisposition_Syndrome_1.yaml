- category: Neoplastic
  name: Synchronous Multifocal Rhabdoid Tumors
  diagnostic: true
  frequency: FREQUENT
  description: >-
    Presentation with tumours at more than one anatomical site simultaneously
    is characteristic of germline rather than sporadic disease and should
    prompt germline SMARCB1 testing.
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More than 70% of individuals with RTPS present before age 12 months with
      synchronous tumors that exhibit aggressive clinical behavior.
    explanation: >-
      Quantifies both the infantile onset and the synchronous multifocal
      presentation that marks germline disease.
  - reference: PMID:37548271
    reference_title: "Constitutional balanced translocations involving SMARCB1: A rare cause of rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RTPS1 should be evaluated in all individuals with rhabdoid tumor and is more
      likely in those with a young age at presentation (occasionally congenital
      presentation), multiple primary tumors, or a family history of rhabdoid
      tumor or RTPS1.
    explanation: >-
      Names multiple primary tumours as a feature pointing to germline disease.
  phenotype_term:
    preferred_term: Rhabdoid tumor
    term:
      id: HP:0034557
      label: Rhabdoid tumor
- category: Neoplastic
  name: Schwannomatosis
  description: >-
    A distinct allelic presentation in which germline SMARCB1 variants,
    typically hypomorphic, cause multiple non-vestibular schwannomas in
    adults rather than infantile rhabdoid tumours.
  phenotype_term:
    preferred_term: Schwannoma
    term:
      id: HP:0100008
      label: Schwannoma
  evidence:
  - reference: PMID:24933152
    reference_title: "SMARCB1 mutations in schwannomatosis and genotype correlations with rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMARCB1 mutations have been found in 45% of familial probands and 9% of
      sporadic patients.
    explanation: >-
      Quantifies the SMARCB1 contribution to schwannomatosis in familial versus
      sporadic cases.
  - reference: PMID:24933152
    reference_title: "SMARCB1 mutations in schwannomatosis and genotype correlations with rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a clear genotype-phenotype correlation, with germline rhabdoid
      mutations being significantly more likely to be centrally placed, involve
      multiple exon deletions, and be truncating mutations.
    explanation: >-
      Explains why the same gene yields infantile rhabdoid tumours or adult
      schwannomatosis: truncating central alleles drive the rhabdoid phenotype
      while terminal non-truncating alleles drive schwannomatosis.
  - reference: PMID:28824165
    reference_title: "Timing of Smarcb1 and Nf2 inactivation determines schwannoma versus rhabdoid tumor development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By inducing Smarcb1 loss at later developmental stage in the Schwann cell
      lineage, in addition to biallelic Nf2 gene inactivation, we generated the
      first mouse model developing schwannomas with the same underlying gene
      mutations found in schwannomatosis patients.
    explanation: >-
      Shows the schwannoma phenotype requires later-stage Smarcb1 loss plus NF2
      inactivation, a developmental-timing mechanism complementing the
      allele-position correlation.
- category: Neoplastic
  name: Choroid Plexus Carcinoma
  frequency: OCCASIONAL
  description: >-
    Choroid plexus carcinoma with loss of nuclear SMARCB1 expression occurs in a
    minority of carriers and enters the differential diagnosis with the
    TP53-driven form seen in Li-Fraumeni syndrome.
  phenotype_term:
    preferred_term: Choroid plexus carcinoma
    term:
      id: HP:0030392
      label: Choroid plexus carcinoma
  evidence:
  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cases of choroid plexus carcinoma, epithelioid sarcoma, peripheral
      primitive neuroectodermal tumor, undiffererentiated sarcoma and
      epithelioid malignant peripheral nerve sheath tumor have all been reported
      to demonstrate loss of expression of SMARCB1, although the number of cases
      with inactivating gene deletions or mutations in SMARCB1 is limited
    explanation: >-
      Documents choroid plexus carcinoma among tumors demonstrating loss of
      SMARCB1 expression within the SMARCB1-deficient tumor spectrum.
genetic:
- name: SMARCB1
  notes: >-
    Germline SMARCB1 alleles causing RTPS1 are predominantly truncating point
    and frameshift variants, intragenic deletions and duplications, and larger
    22q11.2 deletions; germline SMARCB1 alterations are identified in 35% of
    patients presenting with rhabdoid tumors overall, while SMARCB1 is the sole
    causal gene for RTPS1 (MONDO:0012252) by definition. Constitutional balanced
    translocations disrupting SMARCB1 are a rare cause that standard copy-number
    and sequencing panels miss, so structural variant analysis is warranted when
    those are negative. Allele position and type separate the rhabdoid and
    schwannomatosis phenotypes.
  gene_term:
    preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_8d7390e7-0bb1-4ba1-b97e-7f666b52c86b-2018-10-12T205953.762Z
    evidence:
    - reference: CGGV:assertion_8d7390e7-0bb1-4ba1-b97e-7f666b52c86b-2018-10-12T205953.762Z
      reference_title: "SMARCB1 / rhabdoid tumor predisposition syndrome 1 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SMARCB1 | HGNC:11103 | rhabdoid tumor predisposition syndrome 1 | MONDO:0012252 | AD | Definitive | SOP6 | Hereditary Cancer Gene Curation Expert Panel | 2018-10-12T20:59:53.762Z"
      explanation: >-
        ClinGen's Hereditary Cancer Gene Curation Expert Panel classifies the
        autosomal dominant SMARCB1-rhabdoid tumor predisposition syndrome 1
        gene-disease relationship as Definitive.
  evidence:
  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These abnormalities included point and frameshift mutations, intragenic
      deletions and duplications, and larger deletions including regions both
      proximal and distal to SMARCB1.
    explanation: Enumerates the germline SMARCB1 variant classes found in the cohort.
  - reference: PMID:37548271
    reference_title: "Constitutional balanced translocations involving SMARCB1: A rare cause of rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most known RTPS1-related SMARCB1 gene mutations are copy number variants
      (CNVs) or single nucleotide variants/indels, but structural variant analysis
      (SVA) is not usually included in the molecular evaluation.
    explanation: >-
      Identifies the diagnostic gap that constitutional balanced translocations
      fall through.
  - reference: PMID:24933152
    reference_title: "SMARCB1 mutations in schwannomatosis and genotype correlations with rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparison with germline SMARCB1 mutations in patients with rhabdoid tumors
      showed that the schwannomatosis mutations were significantly more likely to
      occur at either end of the gene and be nontruncating mutations (P < 0.0001).
    explanation: >-
      Statistical basis for the allele-position genotype-phenotype correlation.
treatments:
- name: Multimodal Therapy for Atypical Teratoid Rhabdoid Tumor
  description: >-
    Intensive multimodal therapy combining maximal safe surgery, induction
    chemotherapy, high-dose chemotherapy with stem cell rescue, and conformal
    radiation. The Children's Oncology Group ACNS0333 trial established that
    this approach substantially improves survival over historical controls in a
    disease that was previously close to uniformly fatal.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Rhabdoid Tumorigenesis
    description: >-
      Intensive postoperative multi-agent and high-dose chemotherapy plus focal
      radiation eliminate proliferating SMARCB1-deficient rhabdoid tumor cells.
  evidence:
  - reference: PMID:32105509
    reference_title: "Efficacy of High-Dose Chemotherapy and Three-Dimensional Conformal Radiation for Atypical Teratoid/Rhabdoid Tumor: A Report From the Children's Oncology Group Trial ACNS0333."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ACNS0333 therapy significantly reduced the risk of EFS events in patients <
      36 months of age compared with the historical cohort (P < .0005; hazard
      rate, 0.43; 95% CI, 0.28 to 0.66).
    explanation: >-
      Primary endpoint result showing the regimen more than halved event-free
      survival events in infants versus historical controls.
  - reference: PMID:32105509
    reference_title: "Efficacy of High-Dose Chemotherapy and Three-Dimensional Conformal Radiation for Atypical Teratoid/Rhabdoid Tumor: A Report From the Children's Oncology Group Trial ACNS0333."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four-year EFS and overall survival for the entire cohort were 37% (95% CI,
      25% to 49%) and 43% (95% CI, 31% to 55%), respectively.
    explanation: >-
      Absolute survival figures, which remain poor despite the improvement.
- name: Age-Stratified Tumor Surveillance
  description: >-
    Carriers are followed with whole-body MRI from diagnosis and an
    age-stratified schedule of clinical examination, abdominal and neck
    ultrasound, and brain and spine MRI, intensive in the first years of life
    and relaxing after age five.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Rhabdoid Tumorigenesis
    description: >-
      Surveillance aims to detect tumours at the earliest possible stage rather
      than to prevent the underlying biallelic inactivation.
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Age 19 months to five years. Every three months, thorough clinical
      examination including neurologic examination, ultrasound of the abdomen
      and neck, and brain and spine MRI.
    explanation: >-
      The age-stratified surveillance schedule GeneReviews recommends for
      carriers.
- name: Germline SMARCB1 Testing and Family Surveillance
  description: >-
    Because roughly a third of rhabdoid tumours are germline-driven, germline
    SMARCB1 testing is indicated in every child presenting with a rhabdoid
    tumour, with genetic counseling, cascade testing, and surveillance for
    at-risk relatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37548271
    reference_title: "Constitutional balanced translocations involving SMARCB1: A rare cause of rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RTPS1 should be evaluated in all individuals with rhabdoid tumor and is more
      likely in those with a young age at presentation (occasionally congenital
      presentation), multiple primary tumors, or a family history of rhabdoid
      tumor or RTPS1.
    explanation: Supports universal germline evaluation at rhabdoid tumour diagnosis.
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is appropriate to evaluate apparently asymptomatic older and younger
      at-risk relatives of an affected individual to identify as early as
      possible those who would benefit from prompt initiation of tumor
      surveillance.
    explanation: >-
      Supports cascade genetic evaluation and surveillance counseling for
      asymptomatic at-risk family members.
diagnosis:
- name: Germline SMARCB1 molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Germline testing by sequencing and deletion/duplication analysis is
    indicated in every child with a rhabdoid tumour, and especially with young
    age at presentation, multiple primary tumours, or a family history.
    Structural variant analysis should be added when sequencing and copy-number
    testing are negative, since constitutional balanced translocations
    disrupting SMARCB1 are missed by standard panels.
  results: >-
    A heterozygous germline pathogenic SMARCB1 variant, deletion, or balanced
    translocation establishes the diagnosis of RTPS1.
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of RTPS is established in a proband with a rhabdoid tumor
      and/or a family history of rhabdoid tumor and/or multiple SMARCB1- or
      SMARCA4-deficient tumors (synchronous or metachronous), and a heterozygous
      disease-causing germline variant in SMARCB1 (RTPS1) or SMARCA4 (RTPS2)
      identified by molecular genetic testing.
    explanation: >-
      The molecular diagnostic criterion for both RTPS types.
  - reference: PMID:37548271
    reference_title: "Constitutional balanced translocations involving SMARCB1: A rare cause of rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most known RTPS1-related SMARCB1 gene mutations are copy number variants
      (CNVs) or single nucleotide variants/indels, but structural variant analysis
      (SVA) is not usually included in the molecular evaluation.
    explanation: >-
      Supports adding structural variant analysis when standard sequencing and
      CNV assays are negative in suspected RTPS1.
- name: Tumor SMARCB1 (INI1) Immunohistochemistry
  diagnosis_term:
    preferred_term: Immunohistochemistry Staining Method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  description: >-
    Immunohistochemical staining of tumor tissue for SMARCB1 (INI1) identifies
    biallelic SMARCB1 inactivation in malignant rhabdoid tumors and prompts
    constitutional germline SMARCB1 evaluation.
  results: >-
    Complete loss of nuclear SMARCB1 (INI1) immunostaining in neoplastic cells
    with retained staining in non-neoplastic endothelial and inflammatory cells.
  evidence:
  - reference: PMID:21108436
    reference_title: "Spectrum of SMARCB1/INI1 mutations in familial and sporadic rhabdoid tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In fact, 98% of rhabdoid tumors demonstrate SMARCB1 loss and concomitant
      deletions or mutations of the SMARCB1 gene
    explanation: >-
      Establishes loss of SMARCB1 protein expression by immunohistochemistry as
      the pathologic hallmark of SMARCB1-deficient rhabdoid tumors.
  - reference: CGGV:assertion_8d7390e7-0bb1-4ba1-b97e-7f666b52c86b-2018-10-12T205953.762Z
    reference_title: "SMARCB1 / rhabdoid tumor predisposition syndrome 1 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SMARCB1 was absent from neoplastic cells of all tested AT/RTs of RTPS
      patients in immunohistochemical analysis.
    explanation: >-
      Confirms universal loss of SMARCB1 immunostaining across tested AT/RT
      tumors in RTPS1 patients.
- name: Baseline Whole-Body and Neuroaxis Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Baseline whole-body and dedicated brain/spine magnetic resonance imaging at
    identification of a germline SMARCB1 pathogenic variant detects synchronous
    or occult primary rhabdoid tumors across central nervous system, renal, and
    extrarenal soft-tissue sites.
  results: >-
    Detection and anatomic staging of intracranial, spinal, renal, or
    extrarenal soft-tissue rhabdoid tumors.
  evidence:
  - reference: PMID:29215836
    reference_title: "Rhabdoid Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For all individuals with a disease-causing germline variant in SMARCB1 or
      SMARCA4 (regardless of age), whole-body MRI should be offered at
      diagnosis
    explanation: >-
      Supports baseline whole-body MRI upon molecular diagnosis of RTPS1.
references:
- reference: CGGV:assertion_8d7390e7-0bb1-4ba1-b97e-7f666b52c86b-2018-10-12T205953.762Z
  title: "SMARCB1 / rhabdoid tumor predisposition syndrome 1 (Definitive)"
- reference: PMID:29215836
  title: "Rhabdoid Tumor Predisposition Syndrome."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      GeneReviews provides the clinical baseline for both RTPS types, covering
      tumour site distribution and age at presentation, the molecular diagnostic
      criterion, the age-stratified whole-body MRI surveillance protocol, the
      risk-reducing salpingo-oophorectomy discussion specific to SMARCA4, and the
      penetrance contrast between the SMARCB1 and SMARCA4 forms.
notes: >-
  GeneReviews NBK469816 (PMID:29215836) is the primary clinical baseline for
  rhabdoid tumor predisposition syndrome; the separate gene-scoped GeneReviews
  chapter on LZTR1- and SMARCB1-Related Schwannomatosis covers the distinct
  adult-onset allelic schwannomatosis disorder rather than RTPS1.

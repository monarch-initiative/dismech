differential_diagnoses:
- name: Spondylometaphyseal Dysplasia, Kozlowski Type
  description: Allelic autosomal dominant TRPV4 skeletal dysplasia sharing platyspondyly, short stature, and progressive kyphoscoliosis; mild metatropic dysplasia closely resembles SMDK, whereas classic metatropic dysplasia exhibits dumbbell-shaped long bones, halberd-shaped pelvis, and marked widening and irregularity of the femoral neck.
  disease_term:
    preferred_term: spondylometaphyseal dysplasia, Kozlowski type
    term:
      id: MONDO:0008477
      label: spondylometaphyseal dysplasia, Kozlowski type
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At the mildest end of the clinical spectrum, metatropic dysplasia cases resemble SMDK.
    explanation: Documents phenotypic overlap between mild metatropic dysplasia and spondylometaphyseal dysplasia, Kozlowski type.
  - reference: PMID:39825918
    reference_title: Comparison of the natural course of clinical and radiologic features in 13 patients with TRPV4-related skeletal dysplasias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patients with spondylometaphyseal dysplasia Kozlowski type exhibited irregular proximal femora leading to destruction of the femoral head towards the end of puberty, whereas metatropic dysplasia showed marked irregularity and widening of the femoral neck.
    explanation: Establishes the radiographic features of the proximal femur that differentiate metatropic dysplasia from SMDK.
- name: Autosomal Dominant Brachyolmia
  description: Represents the mildest end of the allelic TRPV4 skeletal dysplasia continuum, characterized predominantly by short-trunk short stature, platyspondyly, and scoliosis without the severe metaphyseal dumbbell deformity or halberd-shaped pelvis of metatropic dysplasia.
  disease_term:
    preferred_term: Autosomal dominant brachyolmia
    term:
      id: MONDO:0007232
      label: autosomal dominant brachyolmia
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dominant mutations in the gene encoding TRPV4, a calcium permeable ion channel, have recently been identified in a spectrum of skeletal dysplasias that includes autosomal-dominant brachyolmia, spondylometaphyseal dysplasia Kozlowski type (SMDK) and nonlethal metatropic dysplasia
    explanation: Places autosomal dominant brachyolmia within the allelic TRPV4 skeletal dysplasia differential continuum.
- name: Spondyloepimetaphyseal Dysplasia, Maroteaux Type
  description: Allelic autosomal dominant TRPV4 skeletal dysplasia within the TRPV4-pathy skeletal continuum.
  disease_term:
    preferred_term: spondyloepimetaphyseal dysplasia, Maroteaux type
    term:
      id: MONDO:0008473
      label: spondyloepimetaphyseal dysplasia, Maroteaux type
  evidence:
  - reference: PMID:33774370
    reference_title: 'Natural history of TRPV4-Related disorders: From skeletal dysplasia to neuromuscular phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The skeletal dysplasia group includes metatropic dysplasia, parastremmatic dysplasia, spondyloepiphyseal dysplasia Maroteaux type, spondylometaphyseal dysplasia Kozlowski type, autosomal dominant brachyolmia, and familial digital arthropathy-brachydactyly
    explanation: Includes Maroteaux-type dysplasia within the allelic TRPV4 skeletal dysplasia differential spectrum.
  notes: The PMID:33774370 snippet uses the synonym 'spondyloepiphyseal dysplasia Maroteaux type' for the same allelic TRPV4 disorder (OMIM 184095) labeled 'spondyloepimetaphyseal dysplasia, Maroteaux type' in MONDO (MONDO:0008473).
treatments:
- name: Cervical Spine and Odontoid Surveillance
  description: Evaluate for odontoid hypoplasia and atlantoaxial instability with cervical spine imaging before school age and before procedures requiring general anesthesia, and avoid extreme neck flexion or extension when odontoid hypoplasia is present.
  treatment_term:
    preferred_term: cervical spine imaging
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For skeletal dysplasias, annual evaluation for joint pain and scoliosis; assessment for odontoid hypoplasia before a child reaches school age and before surgical procedures involving general anesthesia; annual hearing assessment; and assessment of weight, height, and weight-for-height at each visit.
    explanation: GeneReviews specifically recommends odontoid assessment before school age and before anesthesia.
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For skeletal dysplasias, avoid extreme neck flexion and extension (in those with odontoid hypoplasia); activities that place undue stress on the spine and weight-bearing joints.
    explanation: This supports neck-position precautions for patients with odontoid hypoplasia and broader spine/joint stress precautions.
- name: Kyphoscoliosis Orthopedic and Surgical Management
  description: Progressive kyphoscoliosis requires longitudinal orthopedic care, with surgical intervention considered when deformity compromises pulmonary function, causes pain, or coexists with upper cervical instability or cervical myelopathy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For skeletal dysplasias, additional treatment includes physical therapy/exercise and heel cord stretching to maintain function; surgical intervention when kyphoscoliosis compromises pulmonary function and/or causes pain and/or when upper cervical spine instability and/or cervical myelopathy are present.
    explanation: GeneReviews names kyphoscoliosis-related pulmonary compromise, pain, cervical instability, and cervical myelopathy as indications for surgical intervention.
- name: Physical Therapy and Mobility Preservation
  description: Physical therapy, exercise as tolerated, and stretching are used to maintain function and mobility in the setting of short stature, contractures, and progressive spinal deformity.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For skeletal dysplasias, additional treatment includes physical therapy/exercise and heel cord stretching to maintain function; surgical intervention when kyphoscoliosis compromises pulmonary function and/or causes pain and/or when upper cervical spine instability and/or cervical myelopathy are present.
    explanation: GeneReviews explicitly includes physical therapy/exercise and heel cord stretching for TRPV4 skeletal dysplasias.
- name: Respiratory Support for Thoracic Restriction
  description: Severe metatropic dysplasia may need respiratory monitoring and ventilatory support because thoracic restriction, neonatal respiratory compromise, and progressive kyphoscoliosis can compromise pulmonary function.
  treatment_term:
    preferred_term: respiratory support
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Complications can include a small chest with some degree of respiratory compromise beginning in the neonatal period, and unrelenting kyphoscoliosis.
    explanation: This supports respiratory monitoring and support for thoracic restriction and kyphoscoliosis-associated pulmonary compromise.
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For skeletal dysplasias, additional treatment includes physical therapy/exercise and heel cord stretching to maintain function; surgical intervention when kyphoscoliosis compromises pulmonary function and/or causes pain and/or when upper cervical spine instability and/or cervical myelopathy are present.
    explanation: GeneReviews identifies pulmonary compromise from kyphoscoliosis as a key management threshold in TRPV4 skeletal dysplasias.
- name: Anesthesia and Airway Precautions
  description: Procedures should be planned with difficult-airway expertise and attention to cervical fusion or instability and spinal canal stenosis; neuraxial anesthesia may be avoided when spinal narrowing is present.
  treatment_term:
    preferred_term: anesthesia procedure
    term:
      id: NCIT:C15181
      label: Anesthesia Procedure
  evidence:
  - reference: PMID:28321993
    reference_title: Metatropic dysplasia-a skeletal dysplasia with challenging airway and other anesthetic concerns.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fourteen of 23 (60.8%) progressively became difficult to intubate over the course of their care, with 12 out of 14 having undergone cervical spine fusion.
    explanation: This cohort supports progressive airway difficulty, especially after cervical spine fusion.
  - reference: PMID:28321993
    reference_title: Metatropic dysplasia-a skeletal dysplasia with challenging airway and other anesthetic concerns.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition to the airway difficulties, spinal canal narrowing or stenosis was widely prevalent, and no neuraxial anesthetic was performed in any of our patients.
    explanation: This supports anesthesia planning around spinal stenosis and avoidance of neuraxial anesthesia in the reported cohort.
  - reference: PMID:28321993
    reference_title: Metatropic dysplasia-a skeletal dysplasia with challenging airway and other anesthetic concerns.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Difficult airway is the most common co-morbid condition present in patients with metatropic dysplasia, especially if their cervical spine has been fused.
    explanation: This directly supports explicit difficult-airway precautions.
- name: Audiologic Surveillance
  description: Annual hearing assessment is recommended because sensorineural hearing loss is a recognized manifestation of autosomal dominant TRPV4-related disorders.
  treatment_term:
    preferred_term: hearing examination
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For skeletal dysplasias, annual evaluation for joint pain and scoliosis; assessment for odontoid hypoplasia before a child reaches school age and before surgical procedures involving general anesthesia; annual hearing assessment; and assessment of weight, height, and weight-for-height at each visit.
    explanation: GeneReviews explicitly recommends annual hearing assessment in TRPV4 skeletal dysplasias.
notes: 'Metatropic dysplasia lies on a TRPV4-associated continuum that includes both nonlethal and perinatal lethal presentations. Its name reflects a changing body-proportion pattern: short-limb disproportion at birth can evolve into short-trunk disproportion as platyspondyly and progressive kyphoscoliosis worsen during childhood.'
references:
- reference: PMID:24830047
  title: Autosomal Dominant TRPV4-Related Disorders.
  tags:
  - GeneReviews
  findings:
  - statement: Autosomal dominant TRPV4-related skeletal dysplasias require surveillance for odontoid hypoplasia and atlantoaxial instability, avoidance of extreme neck flexion/extension, physical therapy, and orthopedic surgical management when kyphoscoliosis compromises pulmonary function or causes myelopathy.
    supporting_text: For skeletal dysplasias, additional treatment includes physical therapy/exercise and heel cord stretching to maintain function; surgical intervention when kyphoscoliosis compromises pulmonary function and/or causes pain and/or when upper cervical spine instability and/or cervical myelopathy are present.
- reference: PMID:19232556
  title: Mutations in the gene encoding the calcium-permeable ion channel TRPV4 produce spondylometaphyseal dysplasia, Kozlowski type and metatropic dysplasia.
  findings:
  - statement: Heterozygous gain-of-function mutations in TRPV4 increase basal and agonist-stimulated calcium channel activity in chondrocytes, causing both spondylometaphyseal dysplasia Kozlowski type and metatropic dysplasia.
    supporting_text: Electrophysiological studies demonstrated that the mutations activated the channel results in increased basal intracellular calcium concentration and an exaggerated response to the specific agonist 4alpha-phorbol 12,13-didecanoate (4alphaPDD) and to hypotonic cell swelling.
- reference: PMID:20425821
  title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
  findings:
  - statement: Dominant activating TRPV4 mutations underlie the full severity spectrum of metatropic dysplasia from mild SMDK-like forms to perinatal lethal cases with severe endochondral ossification arrest and cardiopulmonary compromise.
    supporting_text: Dominant mutations in the gene encoding TRPV4, a calcium permeable ion channel, were identified all 10 of a series of metatropic dysplasia cases, ranging in severity from mild to perinatal lethal.
- reference: PMID:21658220
  title: 'TRPV4 related skeletal dysplasias: a phenotypic spectrum highlighted byclinical, radiographic, and molecular studies in 21 new families.'
  findings:
  - statement: Clinical, radiographic, and molecular analysis of 26 individuals across 21 families demonstrates that autosomal dominant brachyolmia, spondylometaphyseal dysplasia Kozlowski type, and metatropic dysplasia form an overlapping TRPV4 skeletal dysplasia continuum.
    supporting_text: Our data suggest the TRPV4 skeletal dysplasias represent a continuum of severity with areas of phenotypic overlap, even within the same family.
- reference: PMID:39825918
  title: Comparison of the natural course of clinical and radiologic features in 13 patients with TRPV4-related skeletal dysplasias.
  findings:
  - statement: Longitudinal follow-up of patients with TRPV4 skeletal dysplasias delineates age-progressive short stature, bone pain from age 5 years, persistent severe platyspondyly into puberty/adulthood, and characteristic femoral neck widening in metatropic dysplasia.
    supporting_text: Short stature and bone pain when running, walking, and climbing stairs occurred in patients with spondylometaphyseal dysplasia Kozlowski type and metatropic dysplasia from the age of 5 years and worsened with increasing age.

diagnosis:
- name: Clinical, Radiographic, and Molecular Diagnosis
  description: Diagnosis is established by characteristic clinical-radiographic features and confirmation of a heterozygous TRPV4 pathogenic variant. Hallmarks include the evolving metatropic body-proportion pattern, short extremities, progressive kyphoscoliosis, dumbbell-shaped long bones with widened metaphyses, very flat dense vertebral bodies/platyspondyly, a halberd-shaped pelvis, brachydactyly, and delayed carpal ossification. Molecular testing helps distinguish metatropic dysplasia from the overlapping TRPV4 skeletal dysplasia continuum that includes brachyolmia, SMDK, and SEMD-Maroteaux.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of metatropic dysplasia was made based on clinical and radiographic information (see text).
    explanation: This supports core clinical-radiographic diagnostic criteria.
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Radiographic findings show dumbbell-shaped long bones with widened metaphyses, very flat and dense vertebral bodies, a halberd-shaped pelvis, and brachydactyly with markedly delayed carpal ossification.
    explanation: This identifies the classic radiographic hallmarks that should be named in the diagnostic section.
  - reference: PMID:21658220
    reference_title: 'TRPV4 related skeletal dysplasias: a phenotypic spectrum highlighted byclinical, radiographic, and molecular studies in 21 new families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We sequenced TRPV4 and identified 9 different mutations in 22 patients, 4 previously described, and 5 novel.
    explanation: This supports molecular confirmation through TRPV4 variant identification.
  - reference: PMID:21658220
    reference_title: 'TRPV4 related skeletal dysplasias: a phenotypic spectrum highlighted byclinical, radiographic, and molecular studies in 21 new families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our data suggest the TRPV4 skeletal dysplasias represent a continuum of severity with areas of phenotypic overlap, even within the same family.

name: Metatropic Dysplasia
synonyms:
- Metatropic dysplasia, TRPV4-related
creation_date: '2026-03-04T18:40:20Z'
category: Mendelian
description: Metatropic dysplasia is a TRPV4-associated autosomal dominant skeletal dysplasia with short-limbed disproportionate stature, progressive spinal deformity, and severe metaphyseal and vertebral abnormalities that can range from nonlethal to perinatal lethal forms.
disease_term:
  preferred_term: metatropic dysplasia
  term:
    id: MONDO:0007986
    label: metatropic dysplasia
parents:
- Skeletal Dysplasia
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: Common in sporadic cases
  description: Metatropic dysplasia is dominantly inherited and often occurs sporadically via de novo heterozygous TRPV4 missense variants.
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These data demonstrate that the lethal form of the disorder is dominantly inherited and suggest locus homogeneity in the disease.
    explanation: This directly supports dominant inheritance, including severe lethal forms.
  - reference: PMID:19232556
    reference_title: Mutations in the gene encoding the calcium-permeable ion channel TRPV4 produce spondylometaphyseal dysplasia, Kozlowski type and metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In two sporadic cases, heterozygosity for de novo missense mutations in TRPV4 was found.
    explanation: This supports frequent de novo dominant presentation in sporadic cases.
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  isds_skeletal_category:
  - classification_value: trpv4
    notes: ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019 revision (Mortier et al., PMID:31633310), Table 1 group 8 "TRPV4 group"; listed as "Metatropic dysplasia".
prevalence:
- population: Global reported populations and tertiary-center cohorts
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: No population-based prevalence estimate was identified. The PubMed literature characterizes metatropic dysplasia as rare, and even the largest reported single-center cohorts remain small.
  evidence:
  - reference: PMID:28321993
    reference_title: Metatropic dysplasia-a skeletal dysplasia with challenging airway and other anesthetic concerns.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'BACKGROUND: Metatropic dysplasia is a rare form of skeletal dysplasia requiring multiple anesthetics for surgical and imaging procedures, most of which are orthopedic procedures.'
    explanation: This abstract explicitly describes metatropic dysplasia as rare.
  - reference: PMID:28321993
    reference_title: Metatropic dysplasia-a skeletal dysplasia with challenging airway and other anesthetic concerns.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we were able to collect the largest number of metatropic dysplasia patients reported to date.
    explanation: The need to emphasize the largest reported cohort reflects the sparse literature base and absence of population prevalence studies.
  - reference: PMID:21658220
    reference_title: 'TRPV4 related skeletal dysplasias: a phenotypic spectrum highlighted byclinical, radiographic, and molecular studies in 21 new families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We critically analysed the clinical and radiographic data on 26 subjects from 21 families, all of whom had a clinical diagnosis of one of the conditions described above: 15 with MD; 9 with SMDK; and 2 with brachyolmia.'
    explanation: A major TRPV4 skeletal dysplasia series included only 15 metatropic dysplasia patients, again supporting unknown but very low prevalence.
progression:
- phase: Perinatal
  age_range: Prenatal to neonatal/infantile
  notes: Presents prenatally or at birth with short-limb disproportionate stature and narrow thorax; the most severe allelic forms result in perinatal or infantile death from cardiopulmonary compromise.
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The lethal form of metatropic dysplasia defines the most severe end of the spectrum, in which perinatal death results from cardiopulmonary compromise.
    explanation: Establishes perinatal onset and perinatal lethality from cardiopulmonary compromise at the severe end of the metatropic dysplasia spectrum.
- phase: Childhood
  age_range: Childhood through adolescence and adulthood
  notes: In surviving individuals, kyphoscoliosis, short-trunk dwarfism, and bone pain during ambulation worsen progressively from early childhood, reversing body proportions from short-limbed at birth to short-trunked in childhood, with severe platyspondyly persisting into puberty and adulthood.
  evidence:
  - reference: PMID:39825918
    reference_title: Comparison of the natural course of clinical and radiologic features in 13 patients with TRPV4-related skeletal dysplasias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Short stature and bone pain when running, walking, and climbing stairs occurred in patients with spondylometaphyseal dysplasia Kozlowski type and metatropic dysplasia from the age of 5 years and worsened with increasing age.
    explanation: Documents childhood onset (from age 5 years) and age-progressive worsening of short stature and ambulation-associated bone pain.
  - reference: PMID:39825918
    reference_title: Comparison of the natural course of clinical and radiologic features in 13 patients with TRPV4-related skeletal dysplasias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the radiographs of patients with spondylometaphyseal dysplasia Kozlowski type and metatropic dysplasia, severe platyspondyly persisted into adulthood or puberty.
    explanation: Demonstrates persistence of severe platyspondyly through puberty and adulthood.
pathophysiology:
- name: TRPV4 Channel Hyperactivity in Growth Plate Chondrocytes
  conforms_to: "growth_plate_chondrocyte_failure#Cartilage Matrix, Signalling or Chondrocyte Biosynthetic Lesion"
  description: Activating TRPV4 mutations increase basal calcium channel activity and likely raise intracellular calcium in chondrocytes, perturbing cartilage growth plate biology.
  genes:
  - preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  molecular_functions:
  - preferred_term: calcium channel activity
    term:
      id: GO:0005262
      label: calcium channel activity
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
  - preferred_term: Cartilage Development
    term:
      id: GO:0051216
      label: cartilage development
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electrophysiological studies demonstrated that the mutations activate the channel, indicating that the mechanism of disease may result from increased calcium in chondrocytes.
    explanation: This directly links activating TRPV4 mutations to altered calcium handling in chondrocytes.
  - reference: PMID:19232556
    reference_title: Mutations in the gene encoding the calcium-permeable ion channel TRPV4 produce spondylometaphyseal dysplasia, Kozlowski type and metatropic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Similar to autosomal-dominant brachyolmia, the mutations altered basal calcium channel activity in vitro.
    explanation: This provides in vitro functional evidence for TRPV4 channel hyperactivity.
  downstream:
  - target: SOX9-Mediated Blocked Terminal Chondrocyte Differentiation
    description: TRPV4 channel activation raises chondrocyte calcium signaling and is linked to increased SOX9/SOX5/SOX6 activity, which can block orderly terminal growth-plate chondrocyte maturation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: SOX9-Mediated Blocked Terminal Chondrocyte Differentiation
  conforms_to: "growth_plate_chondrocyte_failure#Loss of Growth Plate Zonal Organisation"
  description: TRPV4 activation in chondrocytes is linked to increased SOX9/SOX5/SOX6 activity, which can restrain terminal growth-plate chondrocyte differentiation. The resulting loss of orderly prehypertrophic and hypertrophic chondrocyte columns bridges calcium-channel gain of function to disrupted ossification.
  genes:
  - preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  cell_types:
  - preferred_term: Growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  - preferred_term: Hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: Chondrocyte differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: DECREASED
  - preferred_term: Endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: DECREASED
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Activation of normal Trpv4 in the ATDC5 chondrocyte cell model was shown to increase the steady-state levels of Sox9 mRNA and protein and derepression of Sox6
    explanation: This supports a link between TRPV4 activation and increased SOX9/SOX6 signaling in a chondrocyte model.
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is possible that the activation of the TRPV4 channel in metatropic dysplasia leads to increased SOX9 and subsequently SOX5 and SOX6 activity, negatively regulating the terminal differentiation of growth plate chondrocytes.
    explanation: The authors connect activated TRPV4 to increased SOX-family activity and blocked terminal growth-plate chondrocyte differentiation.
  downstream:
  - target: Disrupted Endochondral Ossification and Chondrocyte Differentiation
    description: Blocked terminal chondrocyte maturation produces reduced hypertrophic chondrocyte organization and impaired endochondral replacement of cartilage by bone.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Disrupted Endochondral Ossification and Chondrocyte Differentiation
  description: TRPV4 activation disturbs growth plate chondrocyte differentiation and endochondral ossification, producing severe vertebral and metaphyseal skeletal dysplasia.
  cell_types:
  - preferred_term: Chondrocyte
    term:

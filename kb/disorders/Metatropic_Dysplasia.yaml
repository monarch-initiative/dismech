    snippet: Histological studies in two cases of lethal metatropic dysplasia revealed markedly disrupted endochondral ossification, with reduced numbers of hypertrophic chondrocytes and presence of islands of cartilage within the zone of primary mineralization.
    explanation: This directly supports disrupted growth plate maturation and endochondral ossification.
  - reference: PMID:20425821

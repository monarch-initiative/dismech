genetic:
- name: TRPV4
  association: Causative
  gene_term:
    preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  notes: Heterozygous activating TRPV4 missense variants are causative across nonlethal and lethal metatropic dysplasia.
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dominant mutations in the gene encoding TRPV4, a calcium permeable ion channel, were identified all 10 of a series of metatropic dysplasia cases, ranging in severity from mild to perinatal lethal.
    explanation: This provides direct evidence for TRPV4 as the causative gene across the severity spectrum.
  - reference: PMID:19232556
    reference_title: Mutations in the gene encoding the calcium-permeable ion channel TRPV4 produce spondylometaphyseal dysplasia, Kozlowski type and metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The findings demonstrate that mutations in TRPV4 produce a phenotypic spectrum of skeletal dysplasias from the mild autosomal-dominant brachyolmia to SMDK to autosomal-dominant metatropic dysplasia, suggesting that these disorders should be grouped into a new bone dysplasia family.
    explanation: This places metatropic dysplasia within a TRPV4 skeletal dysplasia spectrum and supports causality.
phenotypes:
- name: Disproportionate Short-Limb Short Stature
  description: Metatropic dysplasia causes disproportionate short stature with marked limb shortening; progressive spinal deformity later accentuates the altered body proportions.
  phenotype_term:
    preferred_term: Disproportionate short-limb short stature
    term:
      id: HP:0008873
      label: Disproportionate short-limb short stature
  evidence:
  - reference: PMID:20425821
    reference_title: Dominant TRPV4 mutations in nonlethal and lethal metatropic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Metatropic dysplasia is a clinical heterogeneous skeletal dysplasia characterized by short extremities, a short trunk with progressive kyphoscoliosis, and craniofacial abnormalities that include a prominent forehead, midface hypoplasia, and a squared-off jaw.
    explanation: This directly supports disproportion driven by short extremities in metatropic dysplasia.
  - reference: PMID:21658220
    reference_title: 'TRPV4 related skeletal dysplasias: a phenotypic spectrum highlighted byclinical, radiographic, and molecular studies in 21 new families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autosomal dominant brachyolmia, spondylometaphyseal dysplasia Kozlowski type (SMDK) and metatropic dysplasia (MD) are currently considered three distinct skeletal dysplasias with some shared clinical features, including short stature, platyspondyly, and progressive scoliosis.
    explanation: This supports short stature as a recurrent metatropic dysplasia feature.

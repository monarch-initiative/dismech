    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These data suggest that altered chondrocyte differentiation in the growth plate leads to the clinical findings in metatropic dysplasia.
    explanation: This links altered chondrocyte differentiation to the clinical skeletal phenotype.

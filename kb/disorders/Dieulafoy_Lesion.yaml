    reference_title: "Gastrointestinal Bleeding from Dieulafoy's Lesion in the Cecum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemostasis was achieved through local epinephrine injection and hemostatic clipping."
    explanation: Demonstrates clinical arrest of active arterial spurting using local epinephrine injection combined with hemostatic clips.
- name: Angiographic Embolization
  description: >-
    Transcatheter selective arterial embolization used as a minimally invasive salvage
    therapy when endoscopic hemostasis fails or the bleeding site is inaccessible to
    endoscopy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: embolization therapy
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  target_mechanisms:
  - target: Exposed Aberrant Vessel with Intermittent Arterial Spurting
    treatment_effect: INHIBITS

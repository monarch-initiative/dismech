name: Dieulafoy Lesion
creation_date: '2026-01-14T23:44:30Z'
category: Acquired
description: >-
  Dieulafoy lesion is an uncommon vascular anomaly characterized by an abnormally large,
  caliber-persistent submucosal artery (typically 1 to 3 mm in diameter) that fails to
  taper as it approaches the gastrointestinal mucosa and erodes through a pinpoint
  mucosal defect in the absence of primary ulceration or aneurysm; whether the underlying
  caliber-persistent vessel is congenital or acquired remains uncertain. Most lesions
  arise in the proximal stomach along the lesser curvature within 6 cm of the
  gastroesophageal junction, though duodenal, jejunoileal, colonic, rectal, and
  esophageal lesions also occur, causing sudden, severe, intermittent arterial
  gastrointestinal hemorrhage and hemodynamic instability.
synonyms:
- Dieulafoy lesion (hemorrhagic) of stomach and duodenum
- Dieulafoy's lesion
- Dieulafoy disease
- exulceratio simplex
- caliber-persistent artery
disease_term:
  preferred_term: Dieulafoy lesion
  term:
    id: MONDO:0001427
    label: Dieulafoy lesion
parents:
- Gastrointestinal Disease
classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
    evidence:
    - reference: PMID:25901208
      reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although relatively uncommon, Dieulafoy's lesion is an important cause of acute gastrointestinal bleeding due to the frequent difficulty in its diagnosis; its tendency to cause severe, life-threatening, recurrent gastrointestinal bleeding; and its amenability to life-saving endoscopic therapy."
      explanation: Review defines Dieulafoy lesion as an acute vascular cause of gastrointestinal hemorrhage managed within gastroenterology.
epidemiology:
- name: Proportion of Acute Gastrointestinal Bleeding
  description: >-
    Dieulafoy lesion accounts for approximately 1.5% of acute upper gastrointestinal
    bleeding episodes and approximately 3.5% of jejunoileal bleeding episodes; these
    proportions describe share of acute bleeding presentations rather than general
    population prevalence.
  evidence:
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dieulafoy’s lesion is responsible for approximately 1.5% of acute upper GI bleeding ... and is responsible for approximately 3.5% of jejunoileal GI bleeding"
    explanation: Quantifies the proportion of acute upper gastrointestinal and jejunoileal bleeding attributable to Dieulafoy lesion.
- name: Sex Ratio and Age Distribution
  description: >-
    Reported cases show an approximately 2:1 male-to-female predominance and can occur
    at any age, with older series showing peak presentation in the sixth and seventh
    decades of life alongside cardiovascular, renal, or metabolic comorbidities.
  evidence:
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lesion is reportedly more common in males than females, with a sex ratio of 2:1[8,20,34]."
    explanation: Establishes the 2:1 male-to-female predominance in reported Dieulafoy lesion cohorts.
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It can occur at any age ... although older series reported a predisposition towards advanced age, with most cases presenting in the sixth or seventh decades"
    explanation: Documents occurrence across all ages with predominance in the sixth and seventh decades.
- name: Mortality Decline with Endoscopic Therapy
  description: >-
    Case fatality has declined from approximately 30% in the 1970s to 9% to 13% in
    contemporary practice following widespread adoption of aggressive endoscopic
    hemostasis.
  evidence:
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mortality has declined from about 30% during the 1970's to 9%-13% currently with the advent of aggressive endoscopic therapy."
    explanation: Documents historical and modern case-fatality rates before and after aggressive endoscopic therapy.
progression:
- phase: Early Recurrent Hemorrhage
  duration: Within 72 hours of initial presentation if untreated
  notes: >-
    Untreated Dieulafoy lesions frequently rebleed severely within 72 hours of initial
    presentation, underscoring the clinical urgency of endoscopic localization and
    hemostasis at index evaluation.
  evidence:
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The bleeding is frequently recurrent, with recurrence < 72 h after initial presentation if it is left untreated at the initial endoscopy[7]."
    explanation: Establishes the characteristic < 72 hour early rebleeding window when lesions remain untreated at initial endoscopy.
environmental:
- name: Non-Steroidal Anti-Inflammatory Drug Exposure
  description: >-
    Non-steroidal anti-inflammatory drugs are frequently used by patients presenting
    with bleeding Dieulafoy lesions; although no causal link exists between NSAID use
    and formation of the caliber-persistent vessel itself, NSAIDs promote bleeding from
    underlying lesions and precipitate clinical detection.
  exposure_term:
    preferred_term: exposure to non-steroidal anti-inflammatory drug
    term:
      id: ECTO:9001720
      label: exposure to non-steroidal anti-inflammatory drug
  influences_mechanisms:
  - target: Exposed Aberrant Vessel with Intermittent Arterial Spurting
    environmental_effect: EXACERBATES
    description: NSAID exposure promotes active bleeding from an underlying Dieulafoy vessel, precipitating overt hemorrhage without causing the vascular anomaly itself.
    evidence:
    - reference: PMID:25901208
      reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Also, affected patients are often administered non-steroidal anti-inflammatory drugs (NSAIDs) or anticoagulants most likely because these drugs promote bleeding from underlying Dieulafoy’s lesions which results in clinical detection[10,36]."
      explanation: Supports NSAID exposure as a bleeding-promoting factor that unmasks pre-existing Dieulafoy lesions.
  evidence:
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Also, affected patients are often administered non-steroidal anti-inflammatory drugs (NSAIDs) or anticoagulants most likely because these drugs promote bleeding from underlying Dieulafoy’s lesions which results in clinical detection[10,36]."
    explanation: Documents frequent NSAID administration among clinically detected bleeding Dieulafoy lesion cases due to promotion of hemorrhage.
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No causal link has, however, been found between Dieulafoy’s lesions and use of NSAIDs, alcohol or tobacco; or the presence of peptic ulcer disease or Helicobacter pylori infection[10,15,36-38]."
    explanation: Clarifies that NSAIDs promote bleeding from an existing Dieulafoy vessel rather than causing formation of the lesion itself.
- name: Anticoagulant Exposure

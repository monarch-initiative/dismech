      snippet: "Recurrent bleeding after attempted endoscopic hemostasis can be treated by repeat endoscopic hemostasis, angiographic embolization, or surgical wedge resection."
      explanation: Supports selective angiographic embolization to control recurrent bleeding after failed endoscopic therapy.

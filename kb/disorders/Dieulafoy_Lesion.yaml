diagnosis:
- name: Esophagogastroduodenoscopy
  description: >-
    First-line diagnostic modality for upper gastrointestinal Dieulafoy lesions,
    identifying micro-pulsatile arterial streaming, a protruding vessel stump, or a
    fresh densely adherent clot attached to a minute mucosal defect without surrounding
    ulceration; repeat endoscopy may be needed because bleeding is intermittent.
  diagnosis_term:
    preferred_term: esophagogastroduodenoscopy
    term:
      id: NCIT:C78144
      label: Esophagogastroduodenoscopy
  evidence:
  - reference: PMID:37425531
    reference_title: "Dieulafoy's Lesion of the Duodenum: A Rare and Fatal Cause of Gastrointestinal Bleed."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is established by esophagogastroduodenoscopy (EGD), which includes the presence of micro pulsatile streaming from a mucosal defect, the appearance of a fresh, densely adherent clot with a narrow point of attachment to a minute mucosal defect, and the visualization of a protruding vessel with or without bleeding."
    explanation: Defines the endoscopic diagnostic criteria for Dieulafoy lesion on esophagogastroduodenoscopy.
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endoscopy is the first diagnostic test, but has only a 70% diagnostic yield because the lesions are frequently small and inconspicuous."
    explanation: Quantifies initial diagnostic yield of endoscopy and explains why repeat evaluation is often required.
- name: Colonoscopy
  description: >-
    Diagnostic endoscopic examination used to localize colonic and rectal Dieulafoy
    lesions presenting with acute lower gastrointestinal bleeding, frequently requiring
    more than one examination when intraluminal blood obscures visualization.
  diagnosis_term:
    preferred_term: colonoscopy
    term:
      id: NCIT:C16450
      label: Colonoscopy
  evidence:
  - reference: PMID:35243119
    reference_title: "Rectal Dieulafoy's lesion: a comprehensive review of patient characteristics, presentation patterns, diagnosis, management, and clinical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average number of colonoscopies required for the diagnosis of rectal Dieulafoy's lesion was 1.5±0.7."
    explanation: Systematic review demonstrates colonoscopy as the primary diagnostic test for colorectal Dieulafoy lesions.
- name: Mesenteric Angiography
  description: >-
    Selective catheter vascular imaging performed when endoscopic evaluation fails to
    localize an actively bleeding Dieulafoy lesion, demonstrating contrast extravasation
    or a non-tapering, tortuous submucosal artery.
  diagnosis_term:
    preferred_term: angiography
    term:
      id: NCIT:C190556
      label: Angiography
  evidence:
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If endoscopy is nondiagnostic, angiography may help establish the diagnosis in the setting of acute bleeding, especially for lower GI Dieulafoy’s lesions, because detailed colonoscopic examination of mucosa may be difficult to achieve due to overlying blood or the performance of colonoscopy on an unprepared colon because of severe, acute bleeding (Table 2)[10,35,37]."
    explanation: Supports angiography as the principal second-line diagnostic modality when endoscopy is nondiagnostic during active bleeding.
treatments:
- name: Endoscopic Mechanical and Thermal Hemostasis
  description: >-
    First-line endoscopic hemostasis using through-the-scope or over-the-scope
    hemoclips, endoscopic band ligation, argon plasma coagulation, or thermal
    electrocoagulation applied directly to the exposed submucosal artery, achieving
    primary hemostasis in nearly 90% of cases; endoscopic band ligation carries a small
    risk of transmural gastrointestinal perforation if deep mural tissue is banded.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: therapeutic endoscopic procedure
    term:
      id: NCIT:C64958
      label: Therapeutic Endoscopic Procedure
  target_mechanisms:
  - target: Exposed Aberrant Vessel with Intermittent Arterial Spurting
    treatment_effect: INHIBITS
    description: Mechanical clipping, banding, or thermal coagulation directly occludes the ruptured submucosal arterial stump to arrest hemorrhage.
    evidence:
    - reference: PMID:25901208
      reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Endoscopic therapy, including clips, sclerotherapy, argon plasma coagulation, thermocoagulation, or electrocoagulation, is the recommended initial therapy, with primary hemostasis achieved in nearly 90% of cases."
      explanation: Demonstrates direct endoscopic occlusion of the bleeding arterial lesion with high primary hemostasis rates.
  evidence:
  - reference: PMID:35243119
    reference_title: "Rectal Dieulafoy's lesion: a comprehensive review of patient characteristics, presentation patterns, diagnosis, management, and clinical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In regard to treatment, endoscopic therapy was applied in 80%, direct surgical suturing in 12%, angiographic embolization in 4%, and endoscopic therapy followed by surgical ligation was performed in 4% of patients. The endoscopic treatment was a feasible choice for rectal disease, with a primary hemostasis rate of 88%."
    explanation: Systematic review shows endoscopic mechanical methods are effective first-line therapy with high primary hemostasis rates.
  - reference: PMID:37425531
    reference_title: "Dieulafoy's Lesion of the Duodenum: A Rare and Fatal Cause of Gastrointestinal Bleed."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treatment of duodenal DL includes thermal electrocoagulation, local epinephrine injection, sclerotherapy, banding, and hemoclipping"
    explanation: Duodenal Dieulafoy case review lists thermal electrocoagulation, banding, and hemoclipping among standard endoscopic hemostasis options.
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although banding is reportedly highly successful, it entails a small risk of gastrointestinal perforation from banding deep mural tissue."
    explanation: Documents the procedure-specific safety risk of mural perforation with endoscopic band ligation.
- name: Endoscopic Epinephrine Injection Combination Therapy
  description: >-
    Submucosal injection of dilute epinephrine around the bleeding Dieulafoy vessel to
    induce local vasoconstriction and tamponade, combined with definitive mechanical
    clipping or thermal ablation to prevent rebleeding.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: epinephrine
      term:
        id: CHEBI:28918
        label: (R)-adrenaline
  target_mechanisms:
  - target: Exposed Aberrant Vessel with Intermittent Arterial Spurting
    treatment_effect: INHIBITS
    description: Local epinephrine vasoconstriction slows arterial spurting to facilitate mechanical or thermal vessel obliteration.
    evidence:
    - reference: PMID:25901208
      reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dual endoscopic therapy of epinephrine injection followed by ablative or mechanical therapy appears to be effective."
      explanation: Supports dual endoscopic hemostasis combining local epinephrine injection with mechanical or ablative vessel closure.
  evidence:

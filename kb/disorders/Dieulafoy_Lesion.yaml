pathophysiology:
- name: Caliber-Persistent Submucosal Artery
  biological_scale: TISSUE
  description: >-
    Unlike normal gastrointestinal arteries that progressively narrow into capillary
    ramifications, an aberrant submucosal artery maintains a persistent large caliber of
    approximately 1 to 3 mm within the submucosa, most commonly along the proximal
    gastric lesser curvature supplied directly by left gastric arterial branches.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  locations:
  - preferred_term: submucosa of stomach
    term:
      id: UBERON:0001200
      label: submucosa of stomach
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  evidence:
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the normal arterial tree, which like branches of a tree, progressively narrows when approaching distal branches, Dieulafoy’s lesion maintains constant arterial caliber, of approximately 1-3 mm, despite its very distal, submucosal location within the GI wall[7]."
    explanation: Establishes the defining anatomical abnormality of a non-tapering 1 to 3 mm submucosal artery in the gastrointestinal wall.
  - reference: PMID:35243119
    reference_title: "Rectal Dieulafoy's lesion: a comprehensive review of patient characteristics, presentation patterns, diagnosis, management, and clinical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dieulafoy's lesion is an abnormally large, tortuous, submucosal vessel that erodes the overlying mucosa, without primary ulceration or erosion."
    explanation: Confirms the tortuous, enlarged submucosal vascular anatomy across gastrointestinal sites including the rectum.
  downstream:
  - target: Pulsatile Mucosal Pressure Erosion Without Primary Ulceration
    description: Persistent arterial caliber in the superficial submucosa transmits pulsatile mechanical pressure and focal perfusion changes to the thin overlying mucosa.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25901208
      reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Each arterial pulsation transmits mechanical pressure that may traumatize the fragile, thin layer of mucosa overlying the vessel."
      explanation: Explains how pulsatile pressure from the enlarged submucosal artery erodes the overlying mucosal layer.
- name: Pulsatile Mucosal Pressure Erosion Without Primary Ulceration
  biological_scale: TISSUE
  description: >-
    Mechanical pressure transmitted by arterial pulsations, localized mucosal ischemia,
    and minor luminal trauma erode the thin mucosa overlying the aberrant vessel,
    producing a pinpoint (1 to 5 mm) mucosal defect with an exposed vessel stump but no
    surrounding peptic ulceration.
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  - preferred_term: intestinal mucosa
    term:
      id: UBERON:0001242
      label: intestinal mucosa
  evidence:
  - reference: PMID:25901208
    reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The aberrant artery can protrude through a small mucosal defect, become susceptible to even minor mechanical trauma (e.g., passage of food bolus in stomach or solid stool in colon), and eventually erode into the lumen to cause severe acute GI bleeding."
    explanation: Details focal protrusion of the artery through a small mucosal defect and susceptibility to luminal mechanical trauma without primary ulceration.
  downstream:
  - target: Exposed Aberrant Vessel with Intermittent Arterial Spurting
    description: Focal mucosal breach exposes the superficial arterial wall to luminal trauma and rupture.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25901208
      reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lesions typically appear at endoscopy as pigmented protuberances from exposed vessel stumps, with minimal surrounding erosion and no ulceration (visible vessel sans ulcer)."
      explanation: Demonstrates direct progression from focal mucosal erosion to an exposed, protruding arterial stump.
- name: Exposed Aberrant Vessel with Intermittent Arterial Spurting
  biological_scale: TISSUE
  description: >-
    Rupture of the exposed large-caliber arterial stump produces brisk, micro-pulsatile
    spurting or oozing hemorrhage into the gastrointestinal lumen, alternating with
    transient thrombus formation over the pinpoint defect.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  evidence:
  - reference: PMID:37065413
    reference_title: "Dieulafoy Lesion: Scope it Until You Find it."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A Dieulafoy lesion is an aberrant vessel that does not reduce in caliber when it extends from the submucosa to the mucosa. Damage to this artery can result in severe, intermittent arterial bleeding from tiny, difficult-to-visualize vessel stumps."
    explanation: Highlights brisk, intermittent arterial bleeding from tiny exposed vessel stumps.
  - reference: PMID:37425531
    reference_title: "Dieulafoy's Lesion of the Duodenum: A Rare and Fatal Cause of Gastrointestinal Bleed."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A duodenal Dieulafoy lesion is characterized by the presence of a larger-caliber artery that protrudes through the GI mucosa and can lead to massive hemorrhage."
    explanation: Confirms massive luminal hemorrhage from the protruding large-caliber mucosal artery.
  - reference: PMID:37425531
    reference_title: "Dieulafoy's Lesion of the Duodenum: A Rare and Fatal Cause of Gastrointestinal Bleed."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is established by esophagogastroduodenoscopy (EGD), which includes the presence of micro pulsatile streaming from a mucosal defect, the appearance of a fresh, densely adherent clot with a narrow point of attachment to a minute mucosal defect, and the visualization of a protruding vessel with or without bleeding."
    explanation: Directly documents formation of a fresh, densely adherent thrombus attached to the pinpoint mucosal defect alternating with micro-pulsatile arterial streaming.
  downstream:
  - target: Gastrointestinal Hemorrhage
    description: Arterial rupture directly causes acute overt gastrointestinal hemorrhage.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25901208
      reference_title: "Gastrointestinal bleeding from Dieulafoy's lesion: Clinical presentation, endoscopic findings, and endoscopic therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dieulafoy's lesions typically present with severe, active, gastrointestinal bleeding, without prior symptoms; often cause hemodynamic instability and often require transfusion of multiple units of packed erythrocytes."
      explanation: Links rupture of the Dieulafoy vessel directly to severe, active gastrointestinal bleeding.
  - target: Hematemesis

name: KRT74-Related Pure Hair-Nail Ectodermal Dysplasia
creation_date: "2026-08-17T00:00:00Z"
description: >-
  Ectodermal dysplasia 7, hair/nail type (ECTD7) is an exceptionally rare
  autosomal recessive pure hair and nail ectodermal dysplasia caused by
  biallelic variants in KRT74, a type II keratin of the hair follicle inner root
  sheath that is also expressed in the nail matrix, nail bed, and hyponychium.
  Affected individuals have congenital hypotrichosis with sparse brittle hair
  together with dystrophic, spoon-shaped, small nails and distal onycholysis,
  while skin, dentition, and sweating are normal. ECTD7 is the recessive member
  of an allelic pair: heterozygous KRT74 variants cause autosomal dominant
  woolly hair / hypotrichosis simplex, a hair-predominant disease without the
  nail involvement that defines ECTD7. The entire disease-specific evidence base
  is a single 2014 report of one consanguineous Pakistani family with four
  affected siblings homozygous for p.Phe274Ser.
category: Genetic
parents:
- Ectodermal Dysplasia
disease_term:
  preferred_term: ectodermal dysplasia 7, hair/nail type
  term:
    id: MONDO:0013975
    label: ectodermal dysplasia 7, hair/nail type
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The single reported ECTD7 family segregates a homozygous KRT74 missense
    variant across four affected siblings; unaffected relatives are heterozygous
    or wild type. Heterozygosity for this allele produced no hair or nail
    phenotype in that family, which is the observation that separates ECTD7 from
    the dominant KRT74 woolly-hair phenotype caused by other alleles.
  evidence:
  - reference: PMID:24714551
    reference_title: "Autosomal recessive transmission of a rare KRT74 variant causes hair and nail ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing of affected individuals revealed homozygosity for a
      rare c.821T>C variant (p.Phe274Ser) in the KRT74 gene that segregates AR
      PHNED in the family.
    explanation: >-
      Documents homozygous segregation of the causal allele with autosomal
      recessive PHNED in the reported family.
genetic:
- name: KRT74 Biallelic Loss-of-Function Variant
  gene_term:
    preferred_term: KRT74
    term:
      id: hgnc:28929
      label: KRT74
  relationship_type: CAUSATIVE
  variants:
  - name: c.821T>C (p.Phe274Ser) coil 1B missense
    description: >-
      Homozygous missense variant (dbSNP rs147962513, transcript NM_175053)
      replacing a phenylalanine conserved across species and in 25 of 26 human
      type II keratins. Phe274 lies in the coil 1B rod domain required for
      long-range keratin dimerization, and patient hair follicles and epidermis
      showed no detectable keratin-74, indicating loss of function rather than a
      dominant-negative effect. This is the only ECTD7 allele reported to date.
    type: MISSENSE
    evidence:
    - reference: PMID:24714551
      reference_title: "Autosomal recessive transmission of a rare KRT74 variant causes hair and nail ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The transition alters the highly conserved Phe274 residue in the coil 1B
        domain required for long-range dimerization of keratins, suggesting that
        the mutation compromises the stability of intermediate filaments.
      explanation: >-
        Localizes the variant to the coil 1B dimerization domain and states the
        predicted structural consequence.
    - reference: PMID:24714551
      reference_title: "Autosomal recessive transmission of a rare KRT74 variant causes hair and nail ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        hair follicles and epidermis of an affected family member stained
        negative for Keratin-74 suggesting a loss of function mechanism mediated
        by the Phe274Ser substitution
      explanation: >-
        Patient-tissue immunohistochemistry establishing absent keratin-74
        protein, the functional evidence for loss of function.
  evidence:
  - reference: PMID:24714551
    reference_title: "Autosomal recessive transmission of a rare KRT74 variant causes hair and nail ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated a consanguineous Pakistani family with AR PHNED linked to
      the keratin gene cluster on 12p11.1 but without detectable mutations in
      KRT85 and HOXC13.
    explanation: >-
      Establishes KRT74 as a third PHNED gene, identified specifically by
      excluding the two previously known causes in a linked family.
  notes: >-
    No contemporary ClinVar assertion or formal ACMG/AMP classification for
    p.Phe274Ser was established by the Edison deep-research review; a diagnostic
    laboratory should classify the variant independently against current
    population and functional data. The reported allele frequency (~0.0002) came
    from the historical Exome Variant Server and should be rechecked against
    current gnomAD before clinical reporting.

    Locus discrepancy, deliberately preserved: the quoted Raykova 2014 sentence
    above says the family was "linked to the keratin gene cluster on 12p11.1",
    whereas KRT74 and the type II keratin cluster are on 12q, and the rest of
    this entry and the PHNED grouping use 12q12-q14.1. The snippet is a verbatim
    quote that validates against the cached abstract, so the discrepancy is
    almost certainly a paper-side error. Do not "correct" the snippet to match
    the surrounding prose - that would make it a misquote.
pathophysiology:
- name: Keratin-74 Intermediate Filament Instability
  biological_scale: MOLECULAR
  description: >-
    KRT74 encodes a type II keratin that heterodimerizes with a type I partner
    to build intermediate filaments in the hair follicle inner root sheath and
    in nail-forming epithelium. The p.Phe274Ser substitution alters a conserved
    residue in the coil 1B rod domain required for long-range keratin
    dimerization, destabilizing filament assembly. In patient tissue the protein
    is undetectable, so the operative lesion is absence of keratin-74 rather
    than incorporation of a poison subunit - the mechanistic difference from the
    dominant KRT74 woolly-hair alleles, which act dominant-negatively.
  molecular_functions:
  - preferred_term: structural constituent of cytoskeleton
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: DECREASED
  evidence:
  - reference: PMID:24714551
    reference_title: "Autosomal recessive transmission of a rare KRT74 variant causes hair and nail ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The transition alters the highly conserved Phe274 residue in the coil 1B
      domain required for long-range dimerization of keratins, suggesting that
      the mutation compromises the stability of intermediate filaments.
    explanation: >-
      States the proposed molecular defect: impaired keratin dimerization and
      intermediate filament instability.
  - reference: PMID:24714551
    reference_title: "Autosomal recessive transmission of a rare KRT74 variant causes hair and nail ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hair follicles and epidermis of an affected family member stained
      negative for Keratin-74 suggesting a loss of function mechanism mediated
      by the Phe274Ser substitution
    explanation: >-
      Establishes protein loss in patient tissue, distinguishing this recessive
      mechanism from the dominant-negative woolly-hair alleles.
  notes: >-
    The structural claim rests on domain position and residue conservation plus
    loss of immunostaining. No direct biochemical filament-assembly assay was
    performed for p.Phe274Ser, so the precise step at which assembly fails
    remains inferred rather than measured.
  downstream:
  - target: Inner Root Sheath and Nail Epithelium Keratin Deficiency
    causal_link_type: DIRECT
- name: Inner Root Sheath and Nail Epithelium Keratin Deficiency
  biological_scale: CELLULAR
  description: >-
    Keratin-74 is normally expressed in the hair follicle inner root sheath and,
    in the nail unit, in the nail matrix, nail bed, and hyponychium. Its absence
    deprives exactly those compartments of mechanical support during the
    keratinization that shapes the emerging hair shaft and nail plate. This
    expression map is why the phenotype is restricted to hair and nails: the
    protein is simply not required in the ectodermal derivatives that PHNED
    spares.
  cell_types:
  - preferred_term: Hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  - preferred_term: Nail matrix keratinocyte
    term:
      id: CL:4052064
      label: nail matrix keratinocyte
  biological_processes:
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: DECREASED
  evidence:
  - reference: PMID:24714551
    reference_title: "Autosomal recessive transmission of a rare KRT74 variant causes hair and nail ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical (IHC) analyses confirmed a strong keratin-74
      expression in the nail matrix, the nail bed and the hyponychium of mouse
      distal digits, as well as in normal human hair follicles.
    explanation: >-
      Establishes the anatomical expression domain of keratin-74, which
      determines which appendages fail when it is lost. The nail localization is
      from mouse distal digit tissue; the hair follicle localization is human.
  downstream:
  - target: Hypotrichosis with Brittle Hair
    causal_link_type: DIRECT
  - target: Nail Dystrophy
    causal_link_type: DIRECT

diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis starts from congenital hypotrichosis plus nail dystrophy, with
    deliberate examination of the appendages that should be normal - skin,
    teeth, and sweating - and a three-generation pedigree. Confirmation is
    molecular: a hereditary hypotrichosis / ectodermal-dysplasia panel
    containing KRT74, KRT85, and HOXC13, or exome sequencing when the phenotype
    is nonspecific. Because ECTD7 is recessive, the diagnosis requires two
    pathogenic or likely pathogenic KRT74 alleles in trans, so parental
    segregation or phasing is part of the confirmation rather than an optional
    extra. Single-gene KRT74 sequencing is efficient when the phenotype and
    family structure are strongly suggestive; genome sequencing is reasonable
    after a negative panel or exome, though its incremental yield here is
    unknown.
  evidence:
  - reference: PMID:24714551
    reference_title: "Autosomal recessive transmission of a rare KRT74 variant causes hair and nail ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing of affected individuals revealed homozygosity for a
      rare c.821T>C variant (p.Phe274Ser) in the KRT74 gene that segregates AR
      PHNED in the family.
    explanation: >-
      The discovery family was resolved by exome sequencing plus segregation
      testing, the route this diagnostic strategy generalizes.
  notes: >-
    Chromosomal microarray, karyotyping, FISH, mitochondrial sequencing,
    repeat-expansion testing, and metabolomic or proteomic testing are not
    first-line absent a separate indication. Trichoscopy and light microscopy
    may document shaft fragility but no KRT74-specific pattern is validated.
    Keratin-74 immunohistochemistry on a hair or skin biopsy showed loss of
    staining in the reported family and is mechanistically informative, but it
    is research-supportive rather than a standardized clinical assay.
differential_diagnoses:
- name: KRT85- and HOXC13-related PHNED
  description: >-
    The two sibling PHNED forms are clinically indistinguishable from ECTD7 and
    are separated only by the causal gene, which is why a panel covering all
    three is the recommended first test rather than single-gene KRT74
    sequencing.
- name: Autosomal dominant KRT74 woolly hair / hypotrichosis simplex
  description: >-
    The allelic trap. Heterozygous KRT74 variants cause a dominantly inherited,
    hair-predominant phenotype without the nail involvement that defines ECTD7,
    and it shows vertical transmission rather than the consanguineous recessive
    pattern. Curated separately as `Isolated_Woolly_Hair`. Distinguishing the
    two is a matter of zygosity and nail status, not of the gene.
- name: Hypohidrotic and syndromic ectodermal dysplasias
  description: >-
    Normal teeth and sweating are what exclude the hypohidrotic forms
    (EDA/EDAR/EDARADD) and the syndromic ectodermal dysplasias. This is the
    positive diagnostic use of the two EXCLUDED phenotypes curated above.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Four affected individuals in one consanguineous Pakistani family constitute
    the entire reported ECTD7 literature. The discovery paper's approximate "one
    per million" figure is a Hardy-Weinberg extrapolation from a historical
    Exome Variant Server allele frequency, not a measured prevalence, and
    assumes random mating, equilibrium, full penetrance, and that p.Phe274Ser
    alone accounts for disease burden. It is particularly unreliable in
    consanguineous populations and is therefore not recorded as a rate here.
treatments:
- name: Symptomatic and Supportive Management
  description: >-
    No disease-modifying therapy exists. Management is supportive: gentle hair
    care avoiding traction, harsh chemicals, and excessive heat; conservative
    nail care with protection from trauma and prolonged moisture; and treatment
    of proven bacterial or fungal superinfection by standard dermatologic
    practice. Minoxidil is not a mechanism-directed option, since the lesion is
    a structural keratin defect rather than a follicular growth-cycle
    abnormality.
  treatment_term:
    preferred_term: Symptomatic Therapy
    term:
      id: NCIT:C170740
      label: Symptomatic Therapy
  therapeutic_modality: OTHER
- name: Genetic Counseling
  description: >-
    Counseling for autosomal recessive inheritance with a 25% sibling recurrence
    risk, cascade carrier testing once the familial variant is known, and
    prenatal or preimplantation genetic testing where desired. Counseling must
    distinguish the recessive ECTD7 phenotype from the dominant KRT74
    woolly-hair phenotype, because the two carry entirely different recurrence
    risks for the same gene.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
notes: >-
  Allelism, and the trap it sets: heterozygous KRT74 variants cause autosomal
  dominant woolly hair / hypotrichosis simplex, curated separately in dismech as
  the "ADWH" subtype of `Isolated_Woolly_Hair` (MONDO:0020717), where the
  causative allele is the heterozygous helix-initiation-motif variant
  p.Asn148Lys acting in a dominant-negative manner (PMID:20346438). ECTD7 is a
  different disease with a different zygosity, a different molecular mechanism
  (absent protein rather than a poison subunit), and nail involvement that the
  dominant phenotype lacks. Do not merge the two entries or transfer evidence
  between them.

  Entry scope: this file covers only the KRT74 (ECTD7, MONDO:0013975) form of
  pure hair and nail ectodermal dysplasia. The KRT85 (ECTD4, MONDO:0011177) and
  HOXC13 (ECTD9, MONDO:0013976) forms are separate Disease entries. The
  MONDO:0019071 umbrella is modeled as the
  `Pure_Hair_and_Nail_Ectodermal_Dysplasias` Grouping.

  Named Entity Confusion risk: the Edison report backing this entry passed
  `just preflight-dr` against MONDO:0013975 (KRT74 mentioned 41 times against
  KRT85 3 and HOXC13 3), and its single extracted reference resolved.

      snippet: "In GPP, innate immune responses are driven by abnormal activation of the interleukin (IL)-36-chemokine-neutrophil axis and excessive neutrophil infiltration."
      explanation: The IL-36-chemokine-neutrophil axis and excessive neutrophil infiltration drive generalized pustular psoriasis, supporting the edge from IL-36 keratinocyte activation to pustule formation.
  evidence:

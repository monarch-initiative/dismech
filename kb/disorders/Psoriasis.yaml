experimental_models:
- name: Outer Biosciences long-term ex vivo human skin platform
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  cell_types:
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: Dermal Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cell_source: >-
    Primary full-thickness human skin explants (8 mm biopsies) from surgical
    excision of healthy donors
  culture_system: >-
    Air-liquid interface culture of native full-thickness skin on a 3D-printed
    high-porosity gyroid insert in an SBS 24-well format, maintained up to four
    weeks
  conditions:
  - Recombinant IL-17A (50 ng/mL) plus IL-22 (10 ng/mL) cytokine stimulation for 3 weeks
  - Tofacitinib citrate (5 uM, JAK inhibitor) co-treatment
  publication: DOI:10.64898/2026.04.30.721933
  notes: >-
    Source is a bioRxiv preprint (DOI:10.64898/2026.04.30.721933), not yet
    peer-reviewed. Evidence snippets quote the cached abstract; figure-level
    detail is summarized in prose.
  description: >-
    A long-term ex vivo human skin platform in which native full-thickness
    biopsies are maintained at an air-liquid interface for up to four weeks with
    preserved epidermal, stromal, and tissue-resident immune programs. Sustained
    basal-media IL-17A/IL-22 stimulation drives a psoriasiform inflammatory
    program (induction of IL36A, DEFB4A/B, S100A12, CXCL1/CXCL8, IL6, and MMP1
    with suppression of epidermal barrier and differentiation genes such as FLG,
    FLG2, LORICRIN, and DSC1) that is broadly reversed by the JAK inhibitor
    tofacitinib, providing a human-tissue model of the IL-17/IL-22 effector arm
    of psoriasis and its pharmacologic modulation.
  modeled_mechanisms:
  - target: IL-23/IL-17 Axis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Exogenous IL-17A/IL-22 reproduces the downstream IL-17/IL-22 effector
      output of the axis, namely keratinocyte-driven inflammatory mediator
      secretion and a psoriasis-like hallmark transcriptional signature
      (TNF-alpha/NF-kB, IL6/JAK/STAT3), together with its JAK-dependent
      pharmacologic reversibility.
    limitations: >-
      Cytokines are applied exogenously to healthy-donor skin, so the model does
      not reproduce IL-23-driven Th17 differentiation, dendritic-cell or T-cell
      activation, or a psoriatic genetic background; only tissue-resident immune
      cells are present, with no recruitment of circulating immune cells.
    readouts:
    - name: Secreted inflammatory mediators (IL-8, MCP-1, S100A8/9, MMP1)
      target: IL-23/IL-17 Axis
      direction: INCREASED
      interpretation: >-
        The preprint reports sustained secretion of IL-8, MCP-1, S100A8/9, and MMP1
        under IL-17A/IL-22 (ELISA of the basal effluent); these specific analytes
        are shown in the preprint figures, not the cached abstract.
    evidence:
    - reference: DOI:10.64898/2026.04.30.721933
      reference_title: "Long-Term Human Skin Platform for Modeling Chronic Inflammation, Environmental Stress, and Therapeutic Intervention"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "sustained cytokine-driven inflammation was modeled, demonstrating chronic inflammatory transcriptional programs, progressive histopathological changes, and persistent inflammatory mediator secretion"
      explanation: >-
        Establishes the platform as an informative human-tissue model of
        sustained IL-17/IL-22-driven inflammatory activation.
  - target: Keratinocyte Hyperproliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      IL-17A/IL-22 stimulation reproduces the psoriasiform keratinocyte-remodeling
      program of this node: suppression of terminal barrier and differentiation
      genes (FLG, FLG2, LORICRIN, DSC1) with psoriasiform histopathology
      (dyskeratosis, parakeratosis, subcorneal separation) over three weeks. In
      psoriatic epidermis the hyperproliferative and impaired-differentiation arms
      are coupled faces of this regenerative program.
    limitations: >-
      The dataset evidences the impaired-differentiation and psoriasiform
      histopathology arm; the keratinocyte proliferation rate itself was not
      separately quantified, and the tissue lacks a psoriatic genetic background.
    readouts:
    - name: Epidermal barrier and differentiation gene expression
      target: Keratinocyte Hyperproliferation
      direction: DECREASED
      interpretation: >-
        The preprint reports suppression of FLG, FLG2, LORICRIN, KRT77, and DSC1
        under IL-17A/IL-22, consistent with IL-22-associated impairment of
        keratinocyte differentiation; these genes are shown in the preprint figures.
    evidence:
    - reference: DOI:10.64898/2026.04.30.721933
      reference_title: "Long-Term Human Skin Platform for Modeling Chronic Inflammation, Environmental Stress, and Therapeutic Intervention"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "sustained cytokine-driven inflammation was modeled, demonstrating chronic inflammatory transcriptional programs, progressive histopathological changes"
      explanation: >-
        The platform develops progressive psoriasiform histopathology under
        sustained cytokine stimulation.
  - target: IL-23/IL-17 Axis
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Concurrent tofacitinib (JAK inhibitor) reverses the IL-17/IL-22-induced
      inflammatory transcriptional program, mediator secretion, and barrier-gene
      repression, and attenuates the psoriasiform histopathology, demonstrating
      that the induced state is pharmacologically reversible and that immune
      signaling remains responsive over weeks of culture.
    limitations: >-
      Attenuation of secreted IL-8 was more modest than of MCP-1, S100A8/9, and
      MMP1, consistent with partial persistence of JAK-independent inflammatory
      signaling.
    readouts:
    - name: Tofacitinib attenuation of secreted inflammatory mediators
      target: IL-23/IL-17 Axis
      direction: RESTORED
      interpretation: >-
        The preprint reports that tofacitinib reduces MCP-1, S100A8/9, and MMP1
        (and, more modestly, IL-8) toward vehicle levels across time points; these
        per-analyte values are from the preprint figures, not the cached abstract.
    evidence:
    - reference: DOI:10.64898/2026.04.30.721933
      reference_title: "Long-Term Human Skin Platform for Modeling Chronic Inflammation, Environmental Stress, and Therapeutic Intervention"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "persistent inflammatory mediator secretion that were broadly suppressed by the JAK inhibitor tofacitinib"
      explanation: >-
        The JAK inhibitor tofacitinib reverses the induced inflammatory program,
        supporting a RESCUES link at the IL-17/IL-22 effector node.

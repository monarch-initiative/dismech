  frequency: FREQUENT
  diagnostic: true
  notes: New psoriatic lesions develop at sites of skin trauma (cuts, scratches, sunburn). Well-established diagnostic sign.
  phenotype_term:
    preferred_term: Koebner Phenomenon
    term:
      id: HP:6000933

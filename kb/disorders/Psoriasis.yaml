environmental:
- name: Streptococcal Infection
  exposure_term:
    preferred_term: Infectious agent exposure
    term:
      id: ECTO:3000000
      label: exposure to organism
  notes: Triggers guttate psoriasis
  evidence:
  - reference: PMID:9466065
    reference_title: "Streptococcal tonsillitis and its association with psoriasis: a review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: they frequently herald a first attack of guttate psoriasis or a reactivation
      of chronic plaque psoriasis is well recognized
    explanation: Group A streptococcal upper respiratory infection precedes first-attack
      guttate psoriasis and reactivation of plaque disease.
- name: Stress
  exposure_term:
    preferred_term: psychological stress
    term:
      id: XCO:0001265
      label: stress
  notes: Common trigger for flares
  evidence:
  - reference: PMID:29516474
    reference_title: "The associations between psychological stress and psoriasis: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: demonstrates a probable temporal association between different measures
      of psychological stress and onset, recurrence, and severity of psoriasis
    explanation: Systematic review of the temporal ordering, which is what makes stress
      a plausible trigger rather than a consequence of visible disease.
- name: Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  notes: Risk factor and worsens disease
  evidence:
  - reference: PMID:26553732
    reference_title: "Psoriasis and Smoking: A Systematic Literature Review and Meta-Analysis With Qualitative Analysis of Effect of Smoking on Psoriasis Severity"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eight articles of 11 with data on smoking and psoriasis severity suggested
      that severity increases with smoking status
    explanation: Covers the second half of the annotation (worsens disease); the same
      meta-analysis pooled a relative risk of 1.88 for smoking in psoriasis patients
      versus controls.
- name: Obesity
  notes: Higher BMI is a causal risk factor for psoriasis
  evidence:
  - reference: PMID:30703100
    reference_title: "Evidence of a causal relationship between body mass index and psoriasis: A mendelian randomization study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MR analyses provided evidence that higher BMI causally increases the
      odds of psoriasis
    explanation: Mendelian randomization over ~750,000 individuals, which addresses
      the confounding that leaves observational obesity-psoriasis associations ambiguous
      in direction.
- name: Medications
  exposure_term:
    preferred_term: medication exposure
    term:
      id: ECTO:0000509
      label: exposure to drug
  notes: Beta blockers, lithium, antimalarials can trigger
  evidence:
  - reference: PMID:19661544
    reference_title: Psoriasis induced or aggravated by drugs
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: drugs with strong evidence for a causal relationship to psoriasis including
      lithium, beta blockers, and synthetic antimalarial drugs
    explanation: Names exactly the three drug classes recorded in this annotation
      as the group with the strongest causal evidence.
- name: Skin Trauma
  notes: Koebner phenomenon
  evidence:
  - reference: PMID:36394984
    reference_title: Characteristics and pathogenesis of Koebner phenomenon
    supports: SUPPORT
    evidence_source: OTHER
    snippet: triggers may drive skin inflammation to induce a psoriatic phenotype
      through multiple signalling pathways and thereby cause Koebner phenomenon in
      susceptible individuals
    explanation: Gives the mechanism by which trauma produces new psoriatic lesions
      in uninvolved skin, and notes psoriasis is one of the true Koebner diseases.

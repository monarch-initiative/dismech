inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic (homozygous or compound heterozygous) pathogenic DYSF variants;
    heterozygous parents are asymptomatic carriers. Founder alleles cluster in
    several populations, including a homozygous c.2779delG frameshift among
    Jews of the Caucasus region with a 4% carrier frequency.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysferlinopathy is inherited in an autosomal recessive manner. If both parents are known to be heterozygous for a DYSF pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews statement of autosomal recessive inheritance with asymptomatic heterozygous carriers.
  - reference: PMID:9731527
    reference_title: "A gene related to Caenorhabditis elegans spermatogenesis factor fer-1 is mutated in limb-girdle muscular dystrophy type 2B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified two homozygous frameshift mutations in this gene, resulting in muscular dystrophy of either proximal or distal onset in nine families."
    explanation: Homozygous DYSF frameshift alleles in the families used to clone the gene.
  - reference: PMID:17825554
    reference_title: "Dysferlinopathy in the Jews of the Caucasus: a frequent mutation in the dysferlin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed a homozygous frameshift mutation of G deletion at codon 927 (2779delG) predicting a truncated protein and a complete loss of functional protein. The possible existence of a founder effect is strengthened by our finding of a 4% carrier frequency in this community."
    explanation: Homozygous founder allele with a measured community carrier frequency.
has_subtypes:
- name: LGMD R2
  display_name: Limb-girdle muscular dystrophy R2 (LGMD2B)
  classification: clinical_phenotype
  description: >-
    Proximal presentation with early weakness and atrophy of the pelvic and
    shoulder girdle muscles in adolescence or young adulthood and slow
    progression. In a 168-patient natural history cohort it did not differ in
    a clinically relevant way from Miyoshi myopathy, and the two labels track
    geography (LGMD R2 in Europe and the USA) more than biology.
  subtype_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2B
    term:
      id: MONDO:0009676
      label: autosomal recessive limb-girdle muscular dystrophy type 2B
  subtype_frequency: 35% of a 20-patient Tunisian cohort
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LGMD2B is characterized by early weakness and atrophy of the pelvic and shoulder girdle muscles in adolescence or young adulthood, with slow progression."
    explanation: GeneReviews definition of the proximal presentation.
  - reference: PMID:37716854
    reference_title: "Dysferlinopathy in Tunisia: clinical spectrum, genetic background and prognostic profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five major phenotypes were identified: Limb-girdle muscular dystrophy (LGMDR2) (35%), a proximodistal phenotype (35%), Miyoshi myopathy (10%),  Distal myopathy with anterior tibial onset (DMAT) (10%), and asymptomatic HyperCKemia (10%)."
    explanation: Relative frequency of the presentations in one cohort.
  - reference: PMID:33610434
    reference_title: "Miyoshi myopathy and limb girdle muscular dystrophy R2 are the same disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There appeared to be geographical preference for a particular diagnosis, with MMD1 being more common in Japan and LGMDR2 in Europe and the USA."
    explanation: The LGMD R2 versus Miyoshi label tracks geography.
- name: Miyoshi myopathy
  display_name: Miyoshi muscular dystrophy 1
  classification: clinical_phenotype
  description: >-
    Distal presentation with weakness and atrophy of the gastrocnemius and
    soleus, spreading over years to the thighs and gluteal muscles, with mild
    forearm involvement and sparing of the small hand muscles. GeneReviews
    gives a median onset age of 19 years. More often diagnosed in Japan.
  subtype_term:
    preferred_term: Miyoshi muscular dystrophy 1
    term:
      id: MONDO:0024545
      label: Miyoshi muscular dystrophy 1
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MMD (median age of onset 19 years) is characterized by muscle weakness and atrophy, most marked in the distal parts of the legs, especially the gastrocnemius and soleus muscles. Over a period of years, the weakness and atrophy spread to the thighs and gluteal muscles."
    explanation: GeneReviews definition of the Miyoshi presentation.
  - reference: PMID:9731526
    reference_title: "Dysferlin, a novel skeletal muscle gene, is mutated in Miyoshi myopathy and limb girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identical mutations in the dysferlin gene can produce more than one myopathy phenotype (MM, limb girdle dystrophy, distal myopathy with anterior tibial onset)."
    explanation: Miyoshi myopathy and LGMD2B arise from the same DYSF alleles.
- name: DMAT
  display_name: Distal myopathy with anterior tibial onset
  classification: clinical_phenotype
  description: >-
    Early and predominant weakness of the anterior compartment of the legs,
    reported as rapidly progressive to severe proximal weakness in the index
    family, with a dystrophic biopsy without vacuoles and absent dysferlin.
  subtype_term:
    preferred_term: distal myopathy with anterior tibial onset
    term:
      id: MONDO:0011721
      label: distal myopathy with anterior tibial onset
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DMAT is characterized by early and predominant distal muscle weakness, particularly of the muscles of the anterior compartment of the legs."
    explanation: GeneReviews definition of DMAT.
  - reference: PMID:11198284
    reference_title: "Distal anterior compartment myopathy: a dysferlin mutation causing a new muscular dystrophy phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset of the illness is distal, in the muscles of the anterior compartment group. The disease is rapidly progressive, leading to severe proximal weakness. Muscle biopsy showed moderate dystrophic changes with no vacuoles. Dysferlin immunostaining was negative."
    explanation: Index family for the anterior tibial presentation.
- name: Proximodistal
  display_name: Proximodistal dysferlinopathy
  classification: clinical_phenotype
  description: >-
    Combined proximal and distal onset. In a French series it was the most
    common atypical presentation and was associated with inflammation and
    greater severity.
  subtype_frequency: 35% of a 40-patient French series
  evidence:
  - reference: PMID:17698709
    reference_title: "Phenotypic study in 40 patients with dysferlin gene mutations: high frequency of atypical phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unusual phenotypes included a mixed phenotype, referred to as \"proximodistal,\" combining distal and proximal onset in 14 (35%) patients"
    explanation: Defines the proximodistal presentation and its frequency in one series.
  - reference: PMID:17698709
    reference_title: "Phenotypic study in 40 patients with dysferlin gene mutations: high frequency of atypical phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest a relationship between proximodistal phenotype, inflammation, and severity."
    explanation: Association with inflammation and severity, stated as a suggestion.
- name: HyperCKemia
  display_name: Asymptomatic hyperCKemia
  classification: clinical_phenotype
  description: >-
    Marked serum creatine kinase elevation without weakness, often the
    presymptomatic stage of a later myopathy rather than a stable phenotype.
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asymptomatic hyperCKemia is characterized by marked elevation of serum CK concentration only."
    explanation: GeneReviews definition.
  - reference: PMID:17698709
    reference_title: "Phenotypic study in 40 patients with dysferlin gene mutations: high frequency of atypical phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "asymptomatic hyperCKemia (an increased serum creatine kinase level) in 2 (5%)"
    explanation: Frequency of the asymptomatic presentation in one series.
- name: Congenital
  display_name: Congenital myopathy, Paradas type
  classification: clinical_phenotype
  description: >-
    Rare congenital-onset form: weakness of the proximal lower limbs and neck
    flexors at birth, with normal creatine kinase in the first years, reported
    in two siblings homozygous for p.Ala927LeufsX21.
  subtype_term:
    preferred_term: congenital myopathy, Paradas type
    term:
      id: MONDO:0016049
      label: congenital myopathy, Paradas type
  evidence:
  - reference: PMID:19084402
    reference_title: "A new phenotype of dysferlinopathy with congenital onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients showed weakness in proximal lower limbs and neck flexor muscles at birth. The presence of normal CK levels during the first years should be noted."
    explanation: Defining report of congenital-onset dysferlinopathy.
pathophysiology:
- name: Biallelic DYSF Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Truncating, splice, missense and copy-number DYSF variants on both alleles
    leave dysferlin absent or markedly reduced in muscle (and in blood
    monocytes). Neither variant class nor residual protein level explains the
    clinical variability in the natural history cohort.
  genes:
  - preferred_term: DYSF
    term:
      id: hgnc:3097
      label: DYSF
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: calcium-dependent phospholipid binding
    term:
      id: GO:0005544
      label: calcium-dependent phospholipid binding
    modifier: DECREASED
  evidence:
  - reference: PMID:11959863
    reference_title: "Calcium-sensitive phospholipid binding properties of normal and mutant ferlin C2 domains."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that C2A, the first C2 domain of dysferlin and myoferlin, bound 50% phosphatidylserine and that phospholipid binding was regulated by calcium concentration. A dysferlin point mutation responsible for muscular dystrophy was engineered into the dysferlin C2A domain and demonstrated reduced calcium-sensitive phospholipid binding."
    explanation: >-
      The dysferlin C2A domain binds phosphatidylserine in a calcium-regulated
      way, and a disease missense allele reduces this activity; null alleles
      remove the protein and so the activity entirely.
  - reference: PMID:9731526
    reference_title: "Dysferlin, a novel skeletal muscle gene, is mutated in Miyoshi myopathy and limb girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe nine mutations in the dysferlin gene in nine families; five are predicted to prevent dysferlin expression."
    explanation: Most founding alleles are predicted null.
  - reference: PMID:23254335
    reference_title: "DYSF mutation analysis in a group of Chinese patients with dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight patients showed an absence or drastic decrease of dysferlin expression in biopsied muscle."
    explanation: Absent or markedly reduced dysferlin protein in patient muscle.
  - reference: PMID:27602406
    reference_title: "The Clinical Outcome Study for dysferlinopathy: An international multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a high degree of variability in disease onset, pattern of weakness, and rate of progression. No factor, such as mutation class, protein expression, or age at onset, accounted for this variability."
    explanation: Variant class and residual protein do not predict the course.
  downstream:
  - target: Defective Calcium-Dependent Sarcolemmal Resealing
    causal_link_type: DIRECT
    description: Without dysferlin the calcium-triggered membrane-repair response fails.
    evidence:
    - reference: PMID:12736685
      reference_title: "Defective membrane repair in dysferlin-deficient muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings show that disruption of the muscle membrane repair machinery is responsible for dysferlin-deficient muscle degeneration"
      explanation: Dysferlin-null mouse study attributing the dystrophy to the repair defect.
  - target: T-Tubule Instability and Calcium Signaling Disruption
    causal_link_type: DIRECT
    description: Dysferlin is enriched in the transverse tubules; its loss destabilizes them under membrane stress.
    evidence:
    - reference: PMID:24302765
      reference_title: "Dysferlin stabilizes stress-induced Ca2+ signaling in the transverse tubule membrane."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Following experimental membrane stress in vitro, dysferlin-deficient muscle fibers undergo extensive functional and structural disruption of the t-tubules"
      explanation: Isolated dysferlin-deficient fibers show t-tubule disruption after stress.
  - target: Attenuated Muscle Regeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19286669
      reference_title: "Attenuated muscle regeneration is a key factor in dysferlin-deficient muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using notexin-induced muscle damage, we have shown that regeneration is attenuated in a mouse model of dysferlinopathy, with delayed removal of necrotic fibres, an extended inflammatory phase and delayed functional recovery."
      explanation: Dysferlin deficiency impairs the regenerative response in mice.
  - target: Intramyofiber Lipid Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24685690
      reference_title: "Lipid accumulation in dysferlin-deficient muscles."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Increased expression of mRNA for a gene involved in early lipogenesis, CCAAT/enhancer binding protein-δ, in 3-month-old A/J(dys-/-) quadriceps (before marked histopathology is evident), indicates early induction of lipogenesis/adipogenesis within dysferlin-deficient muscles."
      explanation: Lipogenic induction precedes overt histopathology, so it is not only a late consequence of degeneration.
- name: Defective Calcium-Dependent Sarcolemmal Resealing
  biological_scale: CELLULAR
  conforms_to: "sarcolemmal_fragility_myofiber_necrosis#Sarcolemmal Membrane Repair Failure"
  description: >-
    In normal muscle, dysferlin-enriched membrane patches form at sarcolemmal
    injuries and fibers reseal in the presence of calcium; dysferlin is
    trafficked to the injury site with MG53 (TRIM72) and caveolin-3. In
    dysferlin-null fibers, vesicles accumulate beneath the sarcolemma and the
    calcium-dependent resealing fails, while the dystrophin-glycoprotein
    complex remains intact.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: plasma membrane repair
    term:
      id: GO:0001778
      label: plasma membrane repair
    modifier: DECREASED
  cellular_components:
  - preferred_term: sarcolemma
    term:
      id: GO:0042383
      label: sarcolemma
  evidence:
  - reference: PMID:12736685
    reference_title: "Defective membrane repair in dysferlin-deficient muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, dysferlin-deficient muscle fibres are defective in Ca2+-dependent sarcolemma resealing."
    explanation: Two-photon membrane-wounding assays in dysferlin-null mouse muscle fibers.
  - reference: PMID:12736685
    reference_title: "Defective membrane repair in dysferlin-deficient muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that dysferlin-null mice maintain a functional dystrophin-glycoprotein complex but nevertheless develop a progressive muscular dystrophy."
    explanation: The repair defect operates independently of the mechanical dystrophin-glycoprotein complex link.
  - reference: PMID:19380584
    reference_title: "Membrane repair defects in muscular dystrophy are linked to altered interaction between MG53, caveolin-3, and dysferlin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MG53 mediates active trafficking of intracellular vesicles to the sarcolemma and is required for movement of dysferlin to sites of cell injury during repair patch formation."
    explanation: Places dysferlin in the MG53-dependent repair-patch machinery.
  downstream:
  - target: Persistent Sarcolemmal Lesions
    causal_link_type: DIRECT
    description: Lesions that should reseal stay open.
    evidence:
    - reference: PMID:15254015
      reference_title: "Disruption of muscle membrane and phenotype divergence in two novel mouse models of dysferlin deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings indicate that muscle membrane disruption and myofiber degeneration in dysferlinopathy were directly mediated by the loss of dysferlin via a new pathogenic mechanism in muscular dystrophies."
      explanation: Two independent dysferlin-deficient mouse lines link dysferlin loss to membrane disruption.
- name: Persistent Sarcolemmal Lesions
  biological_scale: CELLULAR
  description: >-
    Dysferlin-deficient fibers lose sarcolemmal integrity, shown by Evans blue
    dye uptake, despite a normal dystrophin-glycoprotein complex and
    caveolin-3. Leaky fibers release creatine kinase into the circulation.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  cellular_components:
  - preferred_term: sarcolemma
    term:
      id: GO:0042383
      label: sarcolemma
  evidence:
  - reference: PMID:15254015
    reference_title: "Disruption of muscle membrane and phenotype divergence in two novel mouse models of dysferlin deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Vital staining with Evans blue dye revealed loss of sarcolemmal integrity in both lines of mice, similar to that seen in mdx and caveolin-3 deficient mice."
    explanation: Membrane permeability in targeted and A/J dysferlin-deficient mice.
  downstream:
  - target: Myofiber Necrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Unrepaired lesions lead to fiber degeneration; the module routes this
      through cytosolic calcium overload, which the cited dysferlinopathy
      studies do not measure directly.
    evidence:
    - reference: PMID:15254015
      reference_title: "Disruption of muscle membrane and phenotype divergence in two novel mouse models of dysferlin deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings indicate that muscle membrane disruption and myofiber degeneration in dysferlinopathy were directly mediated by the loss of dysferlin via a new pathogenic mechanism in muscular dystrophies."
      explanation: Membrane disruption and myofiber degeneration are reported together in the same mice.
  - target: Elevated serum creatine kinase
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Creatine kinase leaks from damaged fibers into serum.
- name: T-Tubule Instability and Calcium Signaling Disruption
  biological_scale: CELLULAR
  description: >-
    Dysferlin is enriched in the transverse-tubule membrane and can tubulate
    membranes. Under membrane stress, dysferlin-deficient fibers show
    structural and functional t-tubule disruption that is reduced by lowering
    external calcium or blocking L-type calcium channels with diltiazem, and
    diltiazem reduced eccentric contraction-induced damage, inflammation and
    necrosis in dysferlin-deficient mice.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: T-tubule organization
    term:
      id: GO:0033292
      label: T-tubule organization
    modifier: ABNORMAL
  - preferred_term: regulation of cytosolic calcium ion concentration
    term:
      id: GO:0051480
      label: regulation of cytosolic calcium ion concentration
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: T-tubule
    term:
      id: GO:0030315
      label: T-tubule
  evidence:
  - reference: PMID:24302765
    reference_title: "Dysferlin stabilizes stress-induced Ca2+ signaling in the transverse tubule membrane."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "dysferlin-deficient muscle fibers undergo extensive functional and structural disruption of the t-tubules that is ameliorated by reducing external ... or blocking L-type Ca(2+) channels with diltiazem."
    explanation: >-
      T-tubule disruption in isolated dysferlin-deficient fibers is reduced by
      lowering external calcium (the bracketed [Ca(2+)] in the source, bridged
      here because the validator strips bracketed spans) or by L-type channel
      blockade.
  - reference: PMID:28104817
    reference_title: "Dysferlin mediates membrane tubulation and links T-tubule biogenesis to muscular dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Dysferlin tubulates liposomes, generates a T-tubule-like membrane system in non-muscle cells, and links the recruitment of phosphatidylinositol 4,5-bisphosphate to the biogenesis of the T-tubule system. Pathogenic mutant forms interfere with all of these functions"
    explanation: Pathogenic dysferlin mutants fail to support t-tubule membrane formation in cell systems.
  downstream:
  - target: Myofiber Necrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24302765
      reference_title: "Dysferlin stabilizes stress-induced Ca2+ signaling in the transverse tubule membrane."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "we demonstrate that diltiazem treatment of dysferlin-deficient mice significantly reduces eccentric contraction-induced t-tubule damage, inflammation, and necrosis"
      explanation: Blocking the calcium entry that drives t-tubule damage reduces necrosis, implying the t-tubule lesion contributes to fiber death.

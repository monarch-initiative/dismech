    copy-number changes. Founder alleles are described in Libyan Jewish,
    Italian, Spanish and Caucasus Jewish (c.2779delG) populations. In an
    Italian series truncating alleles were associated with earlier onset than
    missense alleles, whereas the international natural history cohort found
    no genotype or protein-level predictor of course. The cached ClinGen DYSF
    validity assertion is for autosomal recessive limb-girdle muscular
    dystrophy (MONDO:0015152), a different MONDO disease from this entry's
    term, so it is not recorded as gene_disease_validity here.
  evidence:
  - reference: PMID:9731526
    reference_title: "Dysferlin, a novel skeletal muscle gene, is mutated in Miyoshi myopathy and limb girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe nine mutations in the dysferlin gene in nine families; five are predicted to prevent dysferlin expression. Identical mutations in the dysferlin gene can produce more than one myopathy phenotype (MM, limb girdle dystrophy, distal myopathy with anterior tibial onset)."
    explanation: Gene discovery for Miyoshi myopathy and LGMD2B.
  - reference: PMID:9731527
    reference_title: "A gene related to Caenorhabditis elegans spermatogenesis factor fer-1 is mutated in limb-girdle muscular dystrophy type 2B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a positional cloning approach, we have identified the gene for a form of limb-girdle muscular dystrophy that we previously mapped to chromosome 2p13 (LGMD2B)."
    explanation: Independent cloning of DYSF as the LGMD2B gene.
  - reference: PMID:17825554
    reference_title: "Dysferlinopathy in the Jews of the Caucasus: a frequent mutation in the dysferlin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three ethnic clusters have previously been described in Dysferlinopathy: the Libyan Jewish population originating in the area of Tripoli, Italian and Spanish populations."
    explanation: Previously described founder clusters.
  - reference: PMID:17994539
    reference_title: "Clinical, molecular, and protein correlations in a large sample of genetically diagnosed Italian limb girdle muscular dystrophy patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating mutations determined earlier onset than missense substitutions (20+/-5.1 years vs. 36.7+/-11.1 years; P=0.0037)."
    explanation: Allele class and onset age in an Italian LGMD series.
environmental:
- name: Strenuous physical exercise
  description: >-
    Many patients were athletic before onset (53% very active and sporty in a
    UK cohort), and in an observational series patients with over 1000 hours
    of sport reached a more severe disability grade two years sooner, so
    strenuous activity is discouraged in patients with high CK.
  exposure_term:
    preferred_term: exposure to strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  evidence:
  - reference: PMID:19528035
    reference_title: "New aspects on patients affected by dysferlin deficient muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-three per cent of the patients were very active and sporty before the onset of symptoms"
    explanation: Premorbid athletic activity is common.
  - reference: PMID:22106716
    reference_title: "Dysferlinopathy course and sportive activity: clues for possible treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preventing a strenuous physical activity should be recommended in patients with high CK and diagnosed or suspected to have dysferlin deficiency."
    explanation: Authors' recommendation from their observational series.
  influences_mechanisms:
  - target: Progressive Muscle Degeneration and Weakness
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Prolonged sport is associated with faster progression to disability.
    evidence:
    - reference: PMID:22106716
      reference_title: "Dysferlinopathy course and sportive activity: clues for possible treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On the basis of Gardner-Medwin and Walton scale, grade 4 is reached two years faster in patients who performed sports (over 1000 hours)."
      explanation: Association between sport exposure and rate of progression in 18 patients.
treatments:
- name: Physical Therapy and Mechanical Aids
  description: >-
    Individualized physiotherapy, mobility and mechanical aids, orthopedic
    surgery for complications, and respiratory aids. Strenuous exercise is
    discouraged (see environmental).
  therapeutic_modality: BEHAVIORAL
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Pelvic girdle muscle weakness
    term:
      id: HP:0003749
      label: Pelvic girdle muscle weakness
  - preferred_term: Distal lower limb muscle weakness
    term:
      id: HP:0009053
      label: Distal lower limb muscle weakness
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individualized management may include physical therapy, use of mechanical aids, surgical intervention for orthopedic complications, respiratory aids, and social and emotional support."
    explanation: GeneReviews management recommendations.
- name: Supportive Care and Weight Control
  description: >-
    There is no approved therapy; treatment is symptomatic. GeneReviews lists
    weight control to avoid obesity under agents and circumstances to avoid.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no approved therapy for dysferlinopathy. Treatment is symptomatic only."
    explanation: No disease-modifying therapy is approved.
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Weight control to avoid obesity."
    explanation: GeneReviews circumstance to avoid.
- name: Non-Invasive Ventilation
  description: Needed by a minority with respiratory decline.
  therapeutic_modality: DEVICE
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: non-invasive mechanical ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Reduced forced vital capacity
    term:
      id: HP:0032341
      label: Reduced forced vital capacity
  evidence:
  - reference: PMID:26088049
    reference_title: "Respiratory and cardiac function in japanese patients with dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 47 patients, 10 had reduced percent forced vital capacity (%FVC), and 4 required non-invasive positive pressure ventilation."
    explanation: Four of 47 patients needed non-invasive ventilation.
- name: Corticosteroid Therapy (not effective)
  description: >-
    Deflazacort did not improve strength in a double-blind, placebo-controlled
    crossover trial in 25 patients, showed a trend toward worsening that
    recovered after stopping, and caused steroid side effects. Steroids are not
    recommended, which matters because the inflammatory biopsy leads to
    misdiagnosis as polymyositis.
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deflazacort
      term:
        id: CHEBI:135720
        label: deflazacort
  evidence:
  - reference: PMID:23406536
    reference_title: "Treatment of dysferlinopathy with deflazacort: a double-blind, placebo-controlled clinical trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Deflazacort did not improve muscle strength. In contrast, there is a trend of worsening muscle strength under deflazacort treatment, which recovers after discontinuation of the study drug."
    explanation: Randomized controlled evidence against efficacy.
  - reference: PMID:23406536
    reference_title: "Treatment of dysferlinopathy with deflazacort: a double-blind, placebo-controlled clinical trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Deflazacort is not an effective therapy for dysferlinopathies, and off-label use is not warranted. This is an important finding, since steroid treatment should not be administered in patients with dysferlinopathy, who may be often misdiagnosed as polymyositis."
    explanation: Trial conclusion that steroids should not be used.
- name: AAV Dysferlin Gene Replacement (investigational)
  description: >-
    Because the DYSF coding sequence exceeds single AAV capacity, two
    overlapping AAVrh74 vectors sharing a region of homology reconstitute the
    full-length cDNA. In dysferlin-deficient mice this restored dysferlin
    expression and membrane repair, and it was well tolerated in non-human
    primates. A phase I intramuscular trial (NCT02710500) has completed; no
    efficacy result is cited here.
  therapeutic_modality: GENE_THERAPY
  action_category: THERAPEUTIC
  delivery_system:
    delivery_platform: VIRAL_VECTOR
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic DYSF Loss of Function
    description: Restores full-length dysferlin.
    evidence:
    - reference: PMID:25815352
      reference_title: "AAV.Dysferlin Overlap Vectors Restore Function in Dysferlinopathy Animal Models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "High levels of dysferlin overexpression was shown for all muscle groups treated as well as restoration of functional outcome measures (membrane repair ability and diaphragm specific force) to wild-type levels."
      explanation: Restored dysferlin and membrane repair in treated mice.
  evidence:
  - reference: PMID:25815352
    reference_title: "AAV.Dysferlin Overlap Vectors Restore Function in Dysferlinopathy Animal Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The two vector system (AAV.DYSF.DV) packages the dysferlin cDNA utilizing AAV serotype rh.74 through the use of two discrete vectors defined by a 1 kb region of homology."
    explanation: Describes the dual-vector strategy.
  - reference: PMID:28707952
    reference_title: "Systemic Delivery of Dysferlin Overlap Vectors Provides Long-Term Gene Expression and Functional Improvement for Dysferlinopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treated muscles showed a significant decrease in central nucleation, collagen deposition, and improvement of membrane repair to wild-type levels."
    explanation: Systemic delivery improves histopathology and membrane repair in mice.
  - reference: clinicaltrials:NCT02710500
    reference_title: "Phase I Intramuscular Gene Transfer Clinical Trial for Dysferlin Deficiency Delivering the Dysferlin Gene by AAVrh74"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The proposed clinical trial is a double-blind, randomized controlled study with direct intramuscular injection of rAAVrh.74.MHCK7.DYSF.DV gene vector to the extensor digitorum brevis muscle (EDB)."
    explanation: Registration of the first-in-human trial; not an efficacy result.
clinical_trials:
- name: NCT00527228
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Double-blind, placebo-controlled crossover trial of deflazacort after a
    one-year natural history run-in, with a negative result. ClinicalTrials.gov
    lists it as phase 2/phase 3; the enum has no combined value.
  evidence:
  - reference: clinicaltrials:NCT00527228
    reference_title: "Deflazacort in Dysferlinopathies (LGMD2B/MM) - a Double Blind, Placebo-controlled Clinical Study"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The present study is designed to assess the natural history in a one year pre-phase of the trial and evaluate therapeutic efficacy and side effects of deflazacort in LGMD2B/MM patients in a placebo-controlled trial."
    explanation: Trial registration record.
- name: NCT02710500
  phase: PHASE_I
  status: COMPLETED
  description: First-in-human intramuscular dual-vector AAVrh74 dysferlin gene transfer into the extensor digitorum brevis.
  evidence:
  - reference: clinicaltrials:NCT02710500
    reference_title: "Phase I Intramuscular Gene Transfer Clinical Trial for Dysferlin Deficiency Delivering the Dysferlin Gene by AAVrh74"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Two cohorts of subjects with dysferlin deficiency, each with proven mutations will undergo gene transfer."
    explanation: Trial registration record.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is established by biallelic pathogenic DYSF variants. Where only
    one variant is found, reduced dysferlin protein or mRNA supports the
    diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of dysferlinopathy is established in a proband with suggestive findings and biallelic pathogenic variants in DYSF identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:21658164
    reference_title: "Abnormal expression of dysferlin in skeletal muscle and monocytes supports primary dysferlinopathy in patients with one mutated allele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysferlin and/or dysferlin mRNA abnormalities are diagnostic for dysferlinopathy when mutational analysis detects a mutation in one allele only."
    explanation: Protein or mRNA studies resolve cases with one detected variant.
- name: Serum creatine kinase
  description: Markedly elevated, often before symptoms.
  diagnosis_term:
    preferred_term: creatine kinase measurement
    term:
      id: NCIT:C64489
      label: Creatine Kinase Measurement
  evidence:
  - reference: PMID:20301480
    reference_title: "Dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asymptomatic hyperCKemia is characterized by marked elevation of serum CK concentration only."
    explanation: CK elevation can be the only finding.
- name: Muscle biopsy with dysferlin immunoanalysis
  description: >-
    Dystrophic changes, often with inflammation, and absent or drastically
    reduced dysferlin. Immunohistochemistry alone can mislead because
    dysferlin is secondarily reduced in other myopathies.
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:23254335
    reference_title: "DYSF mutation analysis in a group of Chinese patients with dysferlinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight patients showed an absence or drastic decrease of dysferlin expression in biopsied muscle."
    explanation: Protein loss on biopsy.
  - reference: PMID:22194990
    reference_title: "Comparison of dysferlin expression in human skeletal muscle with that in monocytes for the diagnosis of dysferlin myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, IH results were misleading because abnormal expression of dysferlin was also observed in 13/21 pathological controls."
    explanation: Immunohistochemistry is not specific on its own.
- name: Monocyte dysferlin Western blot
  description: >-
    Dysferlin in peripheral blood monocytes correlates with muscle levels by
    Western blot, useful when biopsy is unavailable or end-stage.
  diagnosis_term:
    preferred_term: Western blotting
    term:
      id: NCIT:C16357
      label: Western Blotting
  evidence:
  - reference: PMID:22194990
    reference_title: "Comparison of dysferlin expression in human skeletal muscle with that in monocytes for the diagnosis of dysferlin myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a good correlation between skeletal muscle and monocytes using WB."
    explanation: Monocyte and muscle dysferlin levels agree by Western blot.
- name: Muscle MRI
  description: >-
    A characteristic pattern of fatty replacement supports the diagnosis, but
    FKRP, ANO5 and CAPN3 myopathies look similar and 63% of patients miss at
    least one published imaging criterion.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:38007344
    reference_title: "Magnetic resonance imaging-based criteria to differentiate dysferlinopathy from other genetic muscle diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We built a model using the five criteria more frequently met by DYSF patients that obtained a S 95.9%, Sp 46.1%, Ac 66.8%, PPV 56% and NPV 94% to distinguish dysferlinopathies from other diseases."
    explanation: High sensitivity but low specificity of MRI criteria.
  - reference: PMID:36972667
    reference_title: "Expanding the muscle imaging spectrum in dysferlinopathy: description of an outlier population from the classical MRI pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 116 of the 184 patients (63%) who did not meet at least one of the established imaging criteria."
    explanation: The imaging pattern is not universal.
- name: Respiratory function monitoring
  description: FVC measurement at annual or biannual follow-up, with enquiry about arrhythmia symptoms.
  diagnosis_term:
    preferred_term: pulmonary function test
    term:
      id: NCIT:C38081
      label: Pulmonary Function Test
  evidence:
  - reference: PMID:35179231
    reference_title: "Cardiac and pulmonary findings in dysferlinopathy: A 3-year, longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recommend that annual or biannual follow-up should include FVC measurement, enquiry about arrhythmia symptoms and peripheral pulse palpation to assess cardiac rhythm"
    explanation: Surveillance recommendation from the natural history cohort.
differential_diagnoses:
- name: Polymyositis
  description: >-
    Inflammatory infiltrates and MHC class I upregulation on biopsy lead to
    misdiagnosis as polymyositis and to ineffective steroid treatment.
  distinguishing_features:
  - Macrophages outnumber T cells and cytotoxic T-cell invasion of fibers is absent
  - Markedly reduced or absent dysferlin in muscle or monocytes
  - Biallelic DYSF variants
  - No response to corticosteroids
  evidence:
  - reference: PMID:14512171
    reference_title: "Muscle inflammation and MHC class I up-regulation in muscular dystrophy with lack of dysferlin: an immunopathological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "macrophages were more common than T cells, T cytotoxicity was absent, and MHC class I was overexpressed on muscle fibers. These findings differ from polymyositis (PM)"
    explanation: Immunopathological features separating the two.
  - reference: PMID:17698709
    reference_title: "Phenotypic study in 40 patients with dysferlin gene mutations: high frequency of atypical phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease may worsen rapidly, and 10 (25%) patients were initially misdiagnosed as having polymyositis."
    explanation: Frequency of misdiagnosis as polymyositis.
- name: Autosomal Recessive Limb-Girdle Muscular Dystrophy
  description: >-
    Other recessive LGMDs, especially calpainopathy (LGMD R1), FKRP-related
    LGMD R9 and ANO5-related LGMD R12, share proximal weakness, high CK and a
    similar MRI fat-replacement pattern.
  distinguishing_features:
  - Normal dysferlin on Western blot
  - Pathogenic variants in CAPN3, FKRP, ANO5 or another LGMD gene rather than DYSF
  evidence:
  - reference: PMID:38007344
    reference_title: "Magnetic resonance imaging-based criteria to differentiate dysferlinopathy from other genetic muscle diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patterns observed in patients with FKRP, ANO5 and CAPN3 myopathies were similar to the DYSF pattern, whereas patterns observed in patients with OPMD, laminopathy and dystrophinopathy were clearly different."
    explanation: MRI does not separate these LGMDs from dysferlinopathy.
- name: GNE Myopathy
  description: >-
    Another adult-onset recessive distal myopathy with anterior tibial onset,
    but with rimmed vacuoles on biopsy, which the dysferlin anterior tibial
    presentation lacks.
  distinguishing_features:
  - Rimmed vacuoles on biopsy
  - Biallelic GNE rather than DYSF variants
  evidence:
  - reference: PMID:11198284
    reference_title: "Distal anterior compartment myopathy: a dysferlin mutation causing a new muscular dystrophy phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy showed moderate dystrophic changes with no vacuoles."
    explanation: The dysferlin anterior tibial presentation lacks vacuoles.
animal_models:
- name: Dysf-null mouse (targeted knockout)
  species: Mus musculus
  genotype: Dysf-/-
  publication: PMID:12736685
  modeled_mechanisms:
  - target: Defective Calcium-Dependent Sarcolemmal Resealing
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Laser-wounded dysferlin-null fibers fail to reseal in the presence of calcium.
    evidence:
    - reference: PMID:12736685
      reference_title: "Defective membrane repair in dysferlin-deficient muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interestingly, dysferlin-deficient muscle fibres are defective in Ca2+-dependent sarcolemma resealing."
      explanation: Repair assay in the knockout.
- name: A/J mouse (Dysf retrotransposon insertion)
  species: Mus musculus
  background: A/J
  genotype: Dysf retrotransposon insertion, homozygous
  publication: PMID:15254015
  modeled_mechanisms:
  - target: Persistent Sarcolemmal Lesions
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Evans blue uptake shows loss of sarcolemmal integrity with an intact dystrophin-glycoprotein complex.
    evidence:
    - reference: PMID:15254015
      reference_title: "Disruption of muscle membrane and phenotype divergence in two novel mouse models of dysferlin deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Vital staining with Evans blue dye revealed loss of sarcolemmal integrity in both lines of mice, similar to that seen in mdx and caveolin-3 deficient mice."
      explanation: Membrane permeability in A/J and knockout mice.
  - target: Intramyofiber Lipid Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Lipid droplets within psoas and quadriceps myofibers at 8 and 12 months.
    evidence:
    - reference: PMID:24685690
      reference_title: "Lipid accumulation in dysferlin-deficient muscles."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Oil Red O staining showed many lipid droplets within the psoas and quadriceps muscles of dysferlin-deficient A/J(dys-/-) mice aged 8 and 12 months"
      explanation: Lipid accumulation in A/J muscle.
  notes: >-
    The insertion arose in A/J breeding stocks between the late 1970s and
    early 1980s, so A/J-derived strains carry dysferlin deficiency.
- name: SJL/J mouse (Dysf splice-site mutation)
  species: Mus musculus
  background: SJL/J
  genotype: Dysf splice-site mutation causing a 171 bp RNA deletion
  publication: PMID:11234777
  modeled_mechanisms:
  - target: Inflammation with Complement Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Spontaneous myopathy with MHC class I upregulation and Mac-1-positive cell invasion, as in patient biopsies.
    limitations: >-
      SJL/J mice are a background strain for autoimmune and lymphoma models,
      which complicates attributing immune findings to dysferlin loss alone.
    evidence:
    - reference: PMID:14512171
      reference_title: "Muscle inflammation and MHC class I up-regulation in muscular dystrophy with lack of dysferlin: an immunopathological study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings differ from polymyositis (PM) but are closely similar to those in SJL/J mice (which lack dysferlin)"
      explanation: Patient immunopathology resembles the SJL/J mouse.
    - reference: PMID:11891182
      reference_title: "Up-regulation of MHC class I expression accompanies but is not required for spontaneous myopathy in dysferlin-deficient SJL/J mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, MHC class I was markedly up-regulated in SJL/J muscles, but this high level of MHC class I was not necessary for the appearance of myopathy."
      explanation: MHC class I upregulation accompanies but does not cause the SJL/J myopathy.
  evidence:
  - reference: PMID:11234777
    reference_title: "Cloning of the mouse dysferlin gene and genomic characterization of the SJL-Dysf mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Genomic analysis of the SJL mutation confirms that the 171 bp RNA deletion has arisen by exon skipping resulting from a splice site mutation."
    explanation: Molecular basis of the SJL/J dysferlin deficiency.
- name: Dysferlin-deficient C3-null mouse
  species: Mus musculus
  genotype: Dysf-deficient, C3-/-
  publication: PMID:21060153
  modeled_mechanisms:
  - target: Inflammation with Complement Activation
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: Removing C3 ameliorates pathology in dysferlin-deficient but not mdx mice.
    evidence:
    - reference: PMID:21060153
      reference_title: "Genetic ablation of complement C3 attenuates muscle pathology in dysferlin-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "genetic disruption of the central component (C3) of the complement system ameliorated muscle pathology in dysferlin-deficient mice but had no significant beneficial effect in a genetically distinct model of muscular dystrophy, mdx mice."
      explanation: Genetic perturbation of the complement node.
- name: Dysferlin-deficient AnxA2-null mouse
  species: Mus musculus
  genotype: Dysf-deficient, Anxa2-/-
  publication: PMID:31160583
  modeled_mechanisms:
  - target: Fibro-Adipogenic Replacement of Muscle
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: Loss of annexin A2 prevents FAP adipogenesis and adipogenic muscle loss.
    evidence:
    - reference: PMID:31160583
      reference_title: "Fibroadipogenic progenitors are responsible for muscle loss in limb girdle muscular dystrophy 2B."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lack of AnxA2 prevents FAP adipogenesis, protecting against adipogenic loss of dysferlinopathic muscle while exogenous AnxA2 enhances muscle loss."
      explanation: Genetic perturbation of the adipogenic node.
notes: >-
  Entry scope. MONDO:0016145 groups the dysferlin presentations, and this
  entry curates them as one disease with clinical-presentation subtypes rather
  than as separate entries, because the same DYSF variant produces different
  presentations and the natural history cohort found no clinically relevant
  proximal-versus-distal split between Miyoshi myopathy and LGMD R2
  (PMID:33610434). Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy carries
  an LGMDR2 subtype row for the proximal presentation. No population
  prevalence estimate is recorded because none was found in a cited abstract.
  Cardiac involvement carries both supporting and refuting evidence on the
  cardiomyopathy phenotype because the cohorts disagree.
  GeneReviews also lists scapuloperoneal syndrome among the presentations;
  it has no subtype row because no primary report of it was curated here.

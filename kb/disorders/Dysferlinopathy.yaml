name: Dysferlinopathy
creation_date: "2026-10-23T17:31:43Z"
category: Mendelian
synonyms:
- qualitative or quantitative defects of dysferlin
- DYSF-related muscular dystrophy
- limb-girdle muscular dystrophy R2 dysferlin-related
- Miyoshi myopathy
- dysferlin deficiency
description: >-
  Autosomal recessive muscular dystrophy caused by biallelic loss-of-function
  variants in DYSF, which encodes dysferlin, a calcium-sensing multi-C2-domain
  membrane protein of the sarcolemma and transverse tubules that is required
  for calcium-dependent resealing of the injured muscle membrane. One gene and
  often one variant produce a continuum of presentations: limb-girdle muscular
  dystrophy R2 (LGMD2B, proximal pelvic and shoulder-girdle onset), Miyoshi
  myopathy (distal posterior calf onset with inability to stand on tiptoe),
  distal myopathy with anterior tibial onset, a proximodistal form,
  asymptomatic hyperCKemia, and rare congenital onset. Onset is usually in the
  late teens or twenties, often in people who were athletic before symptoms.
  Serum creatine kinase is markedly elevated, frequently before weakness, and
  muscle biopsy shows necrosis with a macrophage-predominant inflammatory
  infiltrate, MHC class I upregulation and complement deposition, which leads
  to misdiagnosis as polymyositis. Progressive fibro-fatty replacement of
  muscle causes slowly progressive weakness, with loss of ambulation typically
  in the fourth decade; respiratory impairment and cardiac abnormalities occur
  in a minority. No disease-modifying therapy is approved, corticosteroids did
  not help in a controlled trial, and dual-vector AAV dysferlin gene
  replacement is in early clinical development.

diagnosis:
- name: Biochemical and Molecular Diagnosis of DHFR Deficiency
  description: >-
    The combination that should trigger testing is a megaloblastic anaemia or
    pancytopenia together with a neurological syndrome, particularly atypical
    absence epilepsy. The decisive biochemical test is cerebrospinal-fluid
    5-methyltetrahydrofolate, which is low; plasma and red-cell folate can be
    normal or near normal, so a peripheral folate assay does not exclude the
    diagnosis. Confirmation is biallelic DHFR variants on sequencing. Where
    available, DHFR enzyme activity and fluorescein-labelled methotrexate binding
    in lymphoblastoid cells are confirmatory and distinguish homozygotes from
    carriers.
  notes: >-
    Differential diagnosis: the other inborn errors of folate transport and
    metabolism - hereditary folate malabsorption (SLC46A1), FOLR1-related cerebral
    folate deficiency, MTHFR deficiency, glutamate formiminotransferase deficiency
    (FTCD), functional methionine synthase deficiency (MTR/cblG, MTRR/cblE), and
    MTHFD1 deficiency. MTHFD1 is the closest haematological mimic, sharing
    megaloblastic anaemia, but adds atypical haemolytic uraemic syndrome and severe
    combined immunodeficiency, which DHFR deficiency does not. Cerebral
    tetrahydrobiopterin deficiency is the feature that points specifically at DHFR.
  evidence:
  - reference: PMID:22108709
    reference_title: "Update and new concepts in vitamin responsive disorders of folate transport and metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Deficiency in the trifunctional enzyme containing methylenetetrahydrofolate
      dehydrogenase, methenyltetrahydrofolate cyclohydrolase and
      formyltetrahydrofolate synthetase activities, has been identified in a single
      patient with megaloblastic anemia, atypical hemolytic uremic syndrome and
      severe combined immune deficiency.
    explanation: >-
      Supports the specific MTHFD1 discriminator stated in the differential: the
      same anaemia, plus aHUS and SCID.
treatments:
- name: Folinic Acid (Calcium Leucovorin)
  description: >-
    The definitive treatment, and a clean example of metabolic bypass. Folinic
    acid is 5-formyltetrahydrofolate, a folate already reduced past the step DHFR
    performs, so it restores the tetrahydrofolate pool without needing the missing
    enzyme. It resolves the haematological abnormalities, normalizes CSF folate
    and improves neurological symptoms. Folic acid is not a substitute: it is
    fully oxidized and requires DHFR to be activated, which is precisely what is
    unavailable.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  target_mechanisms:
  - target: Collapse of the Reduced Folate Pool
    description: >-
      Supplies reduced folate downstream of the enzymatic block, restoring the pool
      without restoring the enzyme.
  target_phenotypes:
  - preferred_term: Megaloblastic anemia
    term:
      id: HP:0001889
      label: Megaloblastic anemia
  evidence:
  - reference: PMID:21310277
    reference_title: "Dihydrofolate reductase deficiency due to a homozygous DHFR mutation causes megaloblastic anemia and cerebral folate deficiency leading to severe neurologic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with folinic acid resulted in the resolution of hematological
      abnormalities, normalization of CSF folate levels, and improvement of
      neurological symptoms.
    explanation: >-
      Reports all three treatment outcomes: haematological resolution, CSF folate
      normalization, and neurological improvement.
  - reference: PMID:21310276
    reference_title: "Identification and characterization of an inborn error of metabolism caused by dihydrofolate reductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that cerebral folate levels, anemia, and pancytopenia of DHFR
      deficiency can be corrected by treatment with folinic acid.
    explanation: >-
      Independent confirmation of correction in the second defining cohort,
      including pancytopenia.
  notes: >-
    The degree to which neurological outcome depends on age at starting treatment
    is not established in the published cases, and no dosing regimen is curated
    here because none is reported consistently enough to state.
discussions:
- discussion_id: bh4_arm_not_separately_treated
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Failure of Tetrahydrobiopterin Salvage
  - treatments#Folinic Acid (Calcium Leucovorin)
  prompt: >-
    Does folinic acid correct the cerebral tetrahydrobiopterin arm of DHFR
    deficiency, or only the folate arm, and should BH4 or neurotransmitter-precursor
    supplementation be added?
  rationale: >-
    Folinic acid bypasses DHFR for folate, because it is a pre-reduced folate. It
    has no equivalent action on biopterin: dihydrobiopterin still needs DHFR to be
    reduced, and folinic acid does not supply tetrahydrobiopterin. The published
    reports document normalization of CSF folate and improvement of neurological
    symptoms, but do not report post-treatment CSF biopterin or monoamine
    metabolites, so whether the residual neurological deficit reflects an untreated
    BH4 arm is unknown. This matters directly: if it does, sapropterin or
    levodopa/5-hydroxytryptophan supplementation would be rational adjuncts, and
    the treatment section of this entry is incomplete rather than merely brief.
- discussion_id: erythroid_step_is_inferred
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Thymidylate and Purine Synthesis
  prompt: >-
    Has the thymidylate/purine-synthesis block been measured in DHFR-deficient
    erythroid precursors, or is it inferred from folate biochemistry?
  rationale: >-
    This node is the weakest link in the entry's haematological arm and is marked as
    such in its own description. The enzymatic deficiency is measured, the folate
    pool is measured, and the megaloblastic anaemia is observed; the step joining
    them is supplied by textbook folate biochemistry, quoted from a review's
    introduction rather than from any result in a DHFR-deficient patient. Nothing
    about it is controversial, but the entry should not imply a measurement that was
    not made, and a deoxyuridine suppression test or dNTP pool measurement in
    patient erythroid cells would close it.
notes: >-
  Scope: this entry covers DHFR deficiency as a single disease. No subtypes are
  curated because the published cases are too few to support any split, and the
  variation reported is in severity of the neurological findings rather than in
  kind.

  Sources: the OpenScientist deep-research report for this disease suggested
  CHEBI:20506 as "7,8-dihydrofolate". The report's own term-validation section
  flagged that name as worth a second look, and the term is in fact
  5,6,7,8-tetrahydrofolic acid. It is bound here as tetrahydrofolate, which is the
  concept the node needs; no term is bound for dihydrofolate, because the CHEBI
  identifier for it was not sourced. That is the reason the substrate side of the
  reaction is described in prose rather than bound.

  Not curated: the structural-biology detail from the report (active-site residues,
  crystal structures, the Val115-versus-Ile basis of antifolate selectivity). It is
  real and well cited, but it describes the normal enzyme and antifolate
  pharmacology rather than this disease's mechanism, and the papers behind it are
  not about DHFR deficiency.

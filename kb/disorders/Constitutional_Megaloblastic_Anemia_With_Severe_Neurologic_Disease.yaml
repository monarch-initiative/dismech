name: Constitutional Megaloblastic Anemia With Severe Neurologic Disease
creation_date: "2026-09-16T21:35:00Z"
description: >
  Dihydrofolate reductase (DHFR) deficiency is an autosomal recessive inborn error
  of folate metabolism caused by biallelic destabilizing missense variants in
  DHFR. DHFR performs two reductions: it converts dietary folic acid to
  dihydrofolate and then to tetrahydrofolate, and it regenerates tetrahydrofolate
  from the dihydrofolate produced each time thymidylate synthase runs. With the
  enzyme lost, the reduced-folate pool collapses even though plasma folate and
  dietary intake are normal, and the disease is therefore a regeneration failure
  rather than a deficiency state.
  The consequences split into two arms that are usually treated as one disease but
  are mechanistically distinct. Loss of thymidylate and purine synthesis in
  erythroid precursors gives megaloblastic anaemia and pancytopenia. Separately,
  cerebrospinal-fluid 5-methyltetrahydrofolate falls, producing cerebral folate
  deficiency with developmental delay and seizures, characteristically atypical
  childhood absence epilepsy. A third consequence is specific to this enzyme: DHFR
  also salvages tetrahydrobiopterin from dihydrobiopterin, so its loss produces
  cerebral tetrahydrobiopterin deficiency and with it reduced synthesis of
  dopamine, serotonin and noradrenaline. That link is what distinguishes DHFR
  deficiency from the other cerebral folate deficiencies.
  The disorder is treatable. Folinic acid is a folate already reduced past the
  DHFR block, so it bypasses the lesion; it resolves the haematological
  abnormalities, normalizes CSF folate, and improves neurological symptoms. Folic
  acid does not work, because activating it is the step that is missing.

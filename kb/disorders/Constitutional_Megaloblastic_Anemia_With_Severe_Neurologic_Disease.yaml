  description: >-
    Biallelic DHFR missense variants. Heterozygous carriers are clinically
    unaffected but are not biochemically silent: their cells show intermediate
    DHFR activity and intermediate methotrexate binding, which is a clean
    demonstration of gene dosage in this enzyme.
  evidence:
  - reference: PMID:21310277
    reference_title: "Dihydrofolate reductase deficiency due to a homozygous DHFR mutation causes megaloblastic anemia and cerebral folate deficiency leading to severe neurologic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHFR sequencing revealed a homozygous DHFR mutation, c.458A>T (p.Asp153Val),
      in all siblings.
    explanation: >-
      Documents homozygosity in all three affected siblings of healthy parents.
  - reference: PMID:21310277
    reference_title: "Dihydrofolate reductase deficiency due to a homozygous DHFR mutation causes megaloblastic anemia and cerebral folate deficiency leading to severe neurologic disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Heterozygous cells displayed intermediate DHFR activity and FMTX binding.
    explanation: >-
      Supports the specific gene-dosage claim about carriers made in the
      description.
pathophysiology:
- name: DHFR Enzyme Destabilization
  biological_scale: MOLECULAR
  description: >-
    The disease-causing variants are missense changes that destabilize the protein
    rather than simply abolishing the catalytic site. The evidence for that
    distinction is direct: DHFR mRNA is indistinguishable from wild type while
    protein expression is reduced, so the lesion acts after transcription. DHFR is
    a small NADPH-dependent oxidoreductase, and substitutions in its compact fold
    lower both abundance and specific activity.
  genetic_context:
    gene:
      preferred_term: DHFR
      term:
        id: hgnc:2861
        label: DHFR
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: dihydrofolate reductase activity
    modifier: DECREASED
    term:
      id: GO:0004146
      label: dihydrofolate reductase activity
  downstream:
  - target: Collapse of the Reduced Folate Pool
    causal_link_type: DIRECT
  - target: Failure of Tetrahydrobiopterin Salvage
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21310277
    reference_title: "Dihydrofolate reductase deficiency due to a homozygous DHFR mutation causes megaloblastic anemia and cerebral folate deficiency leading to severe neurologic disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DHFR activity and fluorescein-labeled methotrexate (FMTX) binding were
      severely reduced in EBV-immortalized lymphoblastoid cells of all patients.
    explanation: >-
      Measures the enzymatic deficiency directly in patient cells, by two
      independent assays.
  - reference: PMID:21310277
    reference_title: "Dihydrofolate reductase deficiency due to a homozygous DHFR mutation causes megaloblastic anemia and cerebral folate deficiency leading to severe neurologic disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RT-PCR of DHFR mRNA revealed no differences between wild-type and DHFR
      mutation-carrying cells, whereas protein expression was reduced in cells with
      the DHFR mutation.
    explanation: >-
      The normal-mRNA / low-protein result is what establishes destabilization
      rather than a transcriptional or purely catalytic-site lesion.
- name: Collapse of the Reduced Folate Pool
  biological_scale: MOLECULAR
  description: >-
    Tetrahydrofolate can no longer be regenerated from dihydrofolate, nor produced
    from dietary folic acid. The distinctive feature is that this happens with a
    normal folate supply: plasma folate is adequate, and the deficit is in the
    reduced forms that the cell can actually use. Patient folate profiling by
    liquid chromatography tandem mass spectrometry in red cells, plasma and
    cerebrospinal fluid is what demonstrated the pattern.
  biological_processes:
  - preferred_term: tetrahydrofolate biosynthetic process
    modifier: DECREASED

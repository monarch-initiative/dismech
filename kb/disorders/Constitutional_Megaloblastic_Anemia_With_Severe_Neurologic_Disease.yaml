    reference_title: "Identification and characterization of an inborn error of metabolism caused by dihydrofolate reductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by megaloblastic anemia and/or pancytopenia, severe cerebral
      folate deficiency, and cerebral tetrahydrobiopterin deficiency due to a
      germline missense mutation in DHFR, resulting in profound enzyme deficiency
    explanation: >-
      Names severe cerebral folate deficiency as a defining component of the
      disorder, alongside the two other arms.
- name: Failure of Tetrahydrobiopterin Salvage
  biological_scale: TISSUE
  description: >-
    DHFR has a second substrate. It reduces dihydrobiopterin back to
    tetrahydrobiopterin, the salvage arm of BH4 metabolism, and this is the arm
    the brain relies on. Loss of it produces cerebral tetrahydrobiopterin
    deficiency. BH4 is the obligatory cofactor of phenylalanine, tyrosine and
    tryptophan hydroxylase, so the consequence is reduced synthesis of dopamine,
    serotonin and noradrenaline. This arm is what separates DHFR deficiency from
    the other cerebral folate deficiencies, and the 2011 characterization of the
    disorder is what established the link in humans.
  biological_processes:
  - preferred_term: tetrahydrobiopterin regeneration
    modifier: DECREASED
    term:
      id: GO:0006729
      label: tetrahydrobiopterin biosynthetic process
  chemical_entities:
  - preferred_term: tetrahydrobiopterin
    modifier: DECREASED
    term:
      id: CHEBI:15372
      label: 5,6,7,8-tetrahydrobiopterin
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:21310276
    reference_title: "Identification and characterization of an inborn error of metabolism caused by dihydrofolate reductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The characterization of this disorder provides evidence for the link between
      DHFR and metabolism of cerebral tetrahydrobiopterin, which is required for
      the formation of dopamine, serotonin, and norepinephrine and for the
      hydroxylation of aromatic amino acids.
    explanation: >-
      Establishes both the DHFR-to-BH4 link and the monoamine consequence this node
      asserts, in the paper that first characterized it.

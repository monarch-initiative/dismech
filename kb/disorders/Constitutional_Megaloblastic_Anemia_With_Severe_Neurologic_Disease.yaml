  - target: Cerebral Folate Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21310277
    reference_title: "Dihydrofolate reductase deficiency due to a homozygous DHFR mutation causes megaloblastic anemia and cerebral folate deficiency leading to severe neurologic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients' folate profile in red blood cells (RBC), plasma, and
      cerebrospinal fluid (CSF), analyzed by liquid chromatography tandem mass
      spectrometry, was compatible with DHFR deficiency.
    explanation: >-
      The direct measurement of the folate pool across the three compartments this
      node describes.
  - reference: PMID:21310277
    reference_title: "Dihydrofolate reductase deficiency due to a homozygous DHFR mutation causes megaloblastic anemia and cerebral folate deficiency leading to severe neurologic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHFR is necessary for maintaining sufficient CSF and RBC folate levels, even
      in the presence of adequate nutritional folate supply and normal plasma
      folate.
    explanation: >-
      Supports the specific claim that the deficit occurs despite adequate intake
      and normal plasma folate, which is what makes this a regeneration failure.
- name: Impaired Thymidylate and Purine Synthesis
  biological_scale: CELLULAR
  description: >-
    Tetrahydrofolate is the one-carbon carrier for thymidylate synthase and for de
    novo purine synthesis. Without it, dividing cells cannot make dTMP or purines
    at the rate DNA replication demands. Erythroid precursors are the most
    affected because they divide fastest, and the resulting nuclear-cytoplasmic
    asynchrony is what megaloblastic morphology is. This step is inferred from
    established folate biochemistry rather than measured in these patients; what
    was measured is the haematological outcome.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: dTMP biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006231
      label: dTMP biosynthetic process
  - preferred_term: purine nucleotide biosynthetic process
    modifier: DECREASED
    term:

    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22108709
    reference_title: "Update and new concepts in vitamin responsive disorders of folate transport and metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Derivatives of folic acid are involved in transfer of one-carbon units in
      cellular metabolism, playing a role in synthesis of purines and thymidylate
      and in the remethylation of homocysteine to form methionine.
    explanation: >-
      States the biochemical role this node depends on. Quoted from the review's
      opening framing rather than from a result, which is why quote_role is
      BACKGROUND; the claim is textbook folate biochemistry, not a finding of this
      paper.
- name: Cerebral Folate Deficiency
  biological_scale: TISSUE
  description: >-
    Cerebrospinal-fluid 5-methyltetrahydrofolate falls, which is the definition of
    cerebral folate deficiency. The central nervous system is disproportionately
    affected because it depends on active transport of reduced folate across the
    choroid plexus and has little reserve; peripheral folate status can look
    adequate while the CSF compartment is depleted.
  locations:

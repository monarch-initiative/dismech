name: Neurodevelopmental Disorder with Microcephaly, Movement Abnormalities, and Seizures
creation_date: '2026-08-18T00:00:00Z'
category: Mendelian
synonyms:
- NEDMIMS
- CHKA-related neurodevelopmental disorder
- choline kinase alpha deficiency
- neurodevelopmental disorder with epilepsy and microcephaly
description: >-
  Neurodevelopmental disorder with microcephaly, movement abnormalities, and
  seizures (NEDMIMS; OMIM 620023) is an ultra-rare autosomal recessive disorder
  caused by biallelic hypomorphic variants in CHKA, which encodes choline kinase
  alpha, the enzyme catalysing the first and committed step of the CDP-choline
  (Kennedy) pathway for de novo synthesis of phosphatidylcholine — the most
  abundant phospholipid of eukaryotic membranes. The entity was delineated in
  2022 from six individuals in five families, four of them consanguineous, who
  presented with severe global developmental delay, epilepsy, movement disorders
  and microcephaly; no further clinical cohort has been published since, so the
  entire clinical description of the disorder rests on that single series.
  CHKA joins CHKB, PCYT1A, PCYT2 and SELENOI as Kennedy-pathway genes whose
  biallelic loss causes recessive disease, and the contrast with CHKB —
  megaconial congenital muscular dystrophy, a muscle-predominant phenotype from
  loss of the paralogous enzyme catalysing the same reaction — is the central
  unexplained observation of the field. All disease alleles are hypomorphic
  rather than null: complete loss of Chka is embryonic lethal in mouse, and the
  reported human missense variants retain roughly 17-25% of wild-type enzymatic
  activity in a yeast complementation assay. Patient-derived fibroblasts show
  the predicted biochemical block (phosphocholine reduced to 17-28% of control,
  phosphatidylcholine reduced by 75%) together with a compensatory translocation
  of CCTalpha to the inner nuclear membrane, fragmented mitochondria with
  reduced respiratory efficiency per organelle, elevated reactive oxygen species
  and increased lipid peroxidation — coupling a primary lipid-synthesis defect
  to secondary oxidative membrane damage. In a Chka knockout mouse, cortical
  neurons show reduced dendritic branching and impaired synaptic vesicle
  maturation. No disease-modifying therapy exists; management is molecular
  diagnosis followed by symptomatic antiseizure treatment, rehabilitation,
  feeding and orthopaedic support, and genetic counselling. The only published
  therapeutic lead specific to CHKA — the mitochondrial uncoupler FCCP
  normalising ROS and lipid peroxidation in patient fibroblasts — is a
  cell-culture observation that addresses the oxidative consequence rather than
  the synthetic block, with no in vivo or clinical translation. Two further
  routes are inferred from the paralogous CHKB literature and have never been
  tested in CHKA disease: AAV gene replacement, which rescued the Chkb-deficient
  mouse after disease onset, and CDP-choline (citicoline) supplementation, which
  enters the pathway downstream of the choline kinase step.

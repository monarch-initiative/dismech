  - reference: PMID:18029352
    reference_title: Early embryonic lethality caused by disruption of the gene for
      choline kinase alpha, the first enzyme in phosphatidylcholine biosynthesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Embryos homozygous for the mutant Chka allele were recovered at the blastocyst

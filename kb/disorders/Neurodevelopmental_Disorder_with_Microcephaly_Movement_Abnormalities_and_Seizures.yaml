      than a study result.
- name: Compensatory CCTalpha Activation at the Inner Nuclear Membrane
  description: >-
    Falling phosphatidylcholine is sensed by CCTalpha (PCYT1A), the
    rate-limiting cytidylyltransferase of the next pathway step, which is held
    inactive and soluble in the nucleoplasm and is activated by translocating to
    the inner nuclear membrane. Patient fibroblasts show increased CCTalpha
    immunostaining at the nuclear envelope and a raised nuclear-envelope
    enrichment index, i.e. the cell attempts to compensate downstream of the
    block. This is an adaptive branch of the mechanism, not a pathogenic one,
    and it is by construction incapable of restoring flux, because the substrate
    CCTalpha needs is the very metabolite CHKA fails to make.
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase

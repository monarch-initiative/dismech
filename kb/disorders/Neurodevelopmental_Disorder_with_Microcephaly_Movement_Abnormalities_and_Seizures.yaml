    evidence_source: HUMAN_CLINICAL
    snippet: We identified six individuals from five families with bi-allelic variants
      in CHKA presenting with severe global developmental delay, epilepsy, movement
      disorders and microcephaly.
    explanation: >-
      The total published case count at the time of delineation, and still the
      only clinical cohort.

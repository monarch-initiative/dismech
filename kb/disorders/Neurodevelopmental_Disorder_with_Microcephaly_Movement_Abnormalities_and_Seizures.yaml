- name: Phosphatidylcholine Depletion and Membrane Lipid Remodelling
  description: >-
    The block propagates to the membrane lipidome. Patient fibroblasts show
    phosphatidylcholine reduced by 75% relative to controls, including the
    ether-linked alkyl-acyl and alkenyl-acyl species, with
    phosphatidylethanolamine, phosphatidylinositol, phosphatidylglycerol and
    triacylglycerol each reduced by 30-70%. Glycerophosphocholine, the catabolic product of
    phosphatidylcholine, falls to 30% of control, indicating reduced
    phosphatidylcholine turnover as well as reduced synthesis. Because
    phosphatidylcholine is the dominant structural phospholipid of eukaryotic
    membranes, this is a general membrane-biogenesis defect rather than the loss
    of one signalling species.
  role: effector
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: phospholipid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0008654
      label: phospholipid biosynthetic process
  downstream:
  - target: Compensatory CCTalpha Activation at the Inner Nuclear Membrane
    causal_link_type: DIRECT
    description: >-
      Falling phosphatidylcholine relieves the membrane-lipid feedback that
      keeps CCTalpha soluble and inactive in the nucleoplasm.
    evidence:
    - reference: PMID:41308990
      reference_title: Neurodevelopmental disease-causing variants in choline kinase
        CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
        disease etiology.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Previous studies have shown that reduced PC levels activate PCYT1A
        (CCTα), the major and ubiquitous CTP:phosphocholine cytidylyltransferase isoform
        that catalyzes the rate-limiting step for PC synthesis, by promoting its translocation
        from the nucleoplasm to the inner nuclear membrane
      explanation: >-
        States the mechanism by which falling phosphatidylcholine activates
        CCTalpha, which is the edge asserted here.
  - target: Mitochondrial Fragmentation and Impaired Respiratory Efficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Membrane phospholipid depletion is followed by altered mitochondrial
      morphology and bioenergetics; the steps connecting them have not been
      resolved.
    evidence:
    - reference: PMID:41308990
      reference_title: Neurodevelopmental disease-causing variants in choline kinase
        CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
        disease etiology.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: CHKA variant fibroblasts exhibited impaired phospholipid and triacylglycerol
        synthesis, altered mitochondrial morphology and function, elevated reactive
        oxygen species (ROS) levels, and increased lipid peroxidation, suggesting a
        mechanism by which defective CHKA activity leads to lipid damage.
      explanation: >-
        Both defects are demonstrated in the same cells and the authors propose the
        connection; support is PARTIAL because no experiment establishes that the
        lipid deficit causes the mitochondrial change, which is why the edge is
        typed INDIRECT_UNKNOWN_INTERMEDIATES.
  - target: Impaired Neuronal Dendritic and Synaptic Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neurons under construction have an exceptional demand for membrane
      phospholipid; how the deficit translates into the specific dendritic and
      presynaptic defects observed is not established.
    evidence:
    - reference: PMID:42034046
      reference_title: CHKA knockout impairs dendritic development and Wnt pathway
        regulation in neurodevelopment.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: CHKA deficiency impaired cortical dendritic development and synaptic
        vesicle maturation in mice.
      explanation: >-
        Establishes that loss of CHKA produces the neuronal phenotype in mouse;
        support is PARTIAL because the intervening step from phospholipid depletion
        to dendritic failure was not measured.
  evidence:
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and

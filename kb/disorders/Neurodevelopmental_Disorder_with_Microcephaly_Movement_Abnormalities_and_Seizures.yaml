- name: Reduced Choline Kinase Activity and Kennedy Pathway Block
  description: >-
    Choline kinase alpha phosphorylates choline to phosphocholine, the first and
    committed step of the CDP-choline branch of the Kennedy pathway. Reduced
    CHKA activity produces a proportionate metabolic block: in patient-derived
    fibroblasts phosphocholine falls to 28% of control in p.(Arg141Trp) cells
    and 17% in p.(Pro194Ser) cells, mirroring the residual enzyme activity of
    each allele, while the upstream substrate choline accumulates in the more
    severely affected line.
  role: central_effector

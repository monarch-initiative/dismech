      envelope in CHKA variant fibroblasts compared to controls
    explanation: Direct demonstration of the compensatory translocation in patient cells.
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The inactive, soluble form of PCYT1A (CCTα) is localized to the nucleoplasm
      but becomes activated upon translocation to the inner nuclear membrane, where
      conformational changes increase its enzymatic activity
    explanation: >-
      Establishes that nuclear-envelope translocation is the activation mechanism
      being read out.
- name: Mitochondrial Fragmentation and Impaired Respiratory Efficiency
  description: >-
    Patient fibroblasts show a shift toward a fragmented mitochondrial network,
    quantified as reduced aspect ratio and form factor. Bioenergetically the
    picture is only apparent as a defect once normalised: basal respiration is
    elevated per cell but reduced when normalised to mitochondrial content, and
    maximal respiration and spare respiratory capacity are both reduced —
    compromised efficiency per organelle rather than mitochondrial loss. The
    causal direction between membrane phospholipid depletion and this
    mitochondrial phenotype has not been established experimentally.
  role: effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: mitochondrion organization
    modifier: ABNORMAL
    term:
      id: GO:0007005
      label: mitochondrion organization
  downstream:
  - target: Oxidative Stress and Lipid Peroxidation
    causal_link_type: DIRECT
    description: >-
      Inefficient respiration is the proposed source of the excess mitochondrial

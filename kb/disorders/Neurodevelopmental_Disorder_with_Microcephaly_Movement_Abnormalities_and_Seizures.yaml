genetic:
- name: CHKA
  gene_term:
    preferred_term: CHKA
    term:
      id: hgnc:1937
      label: CHKA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic pathogenic variants
  notes: >-
    CHKA lies at 11q13.2 and encodes choline kinase alpha (UniProt P35790,
    EC 2.7.1.32), one of the two mammalian choline kinases. The reported
    pathogenic allelic spectrum is small and entirely hypomorphic: homozygous
    missense variants p.(Arg141Trp) (Iranian and Indian families) and
    p.(Pro194Ser) (Egyptian family), a homozygous start-loss variant
    p.(Met1?) (Bangladeshi family), and a compound-heterozygous genotype
    combining a frameshift allele with the missense allele p.(Phe341Leu)
    (German family). Structural modelling places Arg141 and Pro194 near the
    ADP-binding site and Phe341 in the hydrophobic cluster forming the
    choline-binding pocket. Because Chka-null mouse embryos die before
    embryonic day 7.5, a biallelic complete-null human genotype is not expected
    to be viable, and no such genotype has been reported.
    Residual-activity figures differ slightly between the two sources and the
    discrepancy is deliberately preserved rather than reconciled: the founding
    report gives approximately 20% for p.(Arg141Trp) and 15% for p.(Pro194Ser),
    while the later mechanistic paper restates them as 25% and 17%. The quoted
    evidence in this entry uses the latter, which is the version available as a
    verifiable snippet; on either set both alleles are clearly hypomorphic and
    their rank order is the same.
    Human population data agree with the recessive model: gnomAD constraint for
    CHKA shows heterozygous loss of function is tolerated (pLI approximately
    4.3e-6; observed/expected LoF 0.57, 90% CI 0.43-0.75, LOEUF 0.75; LoF Z
    2.86), so carriers are not depleted in the general population. This is
    recorded as prose rather than as an evidence item because gnomAD is a
    database release, not a citable publication with a quotable abstract, and
    dismech has no reference prefix for it; it complements, and is more direct
    than, the mouse heterozygote data cited under `inheritance`.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:35202461
      reference_title: Bi-allelic variants in CHKA cause a neurodevelopmental disorder
        with epilepsy and microcephaly.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In summary, we present CHKA as a novel autosomal recessive gene for
        a neurodevelopmental disorder with epilepsy and microcephaly.
      explanation: States the recessive mode of inheritance for CHKA-related disease.
  evidence:
  - reference: PMID:35202461
    reference_title: Bi-allelic variants in CHKA cause a neurodevelopmental disorder
      with epilepsy and microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In summary, we present CHKA as a novel autosomal recessive gene for a
      neurodevelopmental disorder with epilepsy and microcephaly.
    explanation: Establishes CHKA as the causative gene and the mode of inheritance.
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Amongst these patients, we identified three missense variants, one start-loss
      variant, and one truncating variant
    explanation: Summarises the reported allelic spectrum.
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Missense variants substantially reduced enzyme activity, while start-loss
      and truncations are predicted to eliminate activity.
    explanation: >-
      Distinguishes partially active missense alleles from predicted-null alleles,
      which is what makes every reported genotype hypomorphic overall.
biochemical:
- name: Fibroblast phosphocholine
  notes: >-
    Phosphocholine, the direct product of choline kinase, measured by targeted
    metabolomic mass spectrometry in patient-derived skin fibroblasts. It tracks
    residual enzyme activity closely (28% of control for p.(Arg141Trp), 17% for
    p.(Pro194Ser)) and is therefore the most direct available biochemical
    readout of the lesion. It is a research assay: no validated clinical
    biochemical test for this disorder exists, and no biomarker has been
    demonstrated in an accessible patient sample such as blood, urine or CSF.
  evidence:
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the mass of phosphocholine (p-choline), the product of choline kinase,
      was decreased to 28% of control values in p.Arg141Trp fibroblasts and to 17%
      in p.Pro194Ser fibroblasts
    explanation: The measurement and its allele dependence.
- name: Fibroblast phosphatidylcholine
  notes: >-
    Total phosphatidylcholine measured by lipidomic profiling of patient-derived
    fibroblasts, reduced by 75% relative to control, with parallel reductions of
    30-70% in phosphatidylethanolamine, phosphatidylinositol,
    phosphatidylglycerol and triacylglycerol. Also a research assay.
  evidence:
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PC was reduced by 75% compared to controls including decreased alkyl-acyl
      and alkenyl-acyl linked PC.
    explanation: The lipidomic measurement.
diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Diagnosis is molecular. The clinical picture — severe developmental delay
    with microcephaly, epilepsy and a movement disorder — is shared with dozens
    of other autosomal recessive neurodevelopmental syndromes and has no
    specific biomarker or imaging signature, so unbiased broad sequencing is the
    practical route. CHKA was only associated with disease in 2022 and is
    therefore not present on all older microcephaly/epilepsy gene panels; trio
    exome or genome sequencing avoids that gap. The founding cohort was
    assembled by sequencing followed by functional testing of the candidate
    variants in a yeast complementation assay, which remains a research rather
    than clinical test.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Biallelic pathogenic CHKA variants.
  presence: Diagnostic when biallelic pathogenic CHKA variants are identified
  evidence:
  - reference: PMID:35202461
    reference_title: Bi-allelic variants in CHKA cause a neurodevelopmental disorder
      with epilepsy and microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using structural molecular modelling and functional testing of the variants
      in a cell-based Saccharomyces cerevisiae model, we determined that these variants
      reduce the enzymatic activity of CHKA
    explanation: >-
      Documents the sequencing-plus-functional-confirmation route by which the
      diagnosis was originally established.
- name: Brain MRI
  description: >-
    Brain MRI is the modality by which the structural CNS findings of this
    disorder were ascertained: reduced cerebral myelination in a subset and a
    thin corpus callosum in one individual, alongside the progressive
    microcephaly. It is supportive rather than diagnostic — some individuals had
    normal or only subtly abnormal imaging, and none of the findings is specific
    to CHKA. It is nonetheless part of the standard workup, because it is what
    separates this presentation from the structural malformation syndromes in
    the differential and it establishes the baseline against which head growth
    deceleration is interpreted.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Normal to non-specifically abnormal. Reported findings are CNS
    hypomyelination and a thin corpus callosum in a minority.
  presence: Supportive, not diagnostic
  notes: >-
    No evidence block: the imaging findings are reported only in the full text
    and tables of PMID:35202461, which caches as abstract only, so no quotable
    snippet exists. See the corresponding `phenotypes` entries for the same
    provenance caveat.
- name: Electroencephalography
  description: >-
    EEG characterises the epilepsy, which is present in every reported
    individual and is frequently refractory. It guides antiseizure drug choice
    by seizure semiology rather than establishing the diagnosis; no
    CHKA-specific EEG signature has been described.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  results: Epileptiform abnormalities; no disorder-specific pattern reported.
  presence: Supportive, not diagnostic
  notes: >-
    No evidence block: per-individual EEG findings are full-text-only in
    PMID:35202461 and therefore not quotable against the reference cache.
treatments:
- name: Antiseizure pharmacotherapy
  description: >-
    Symptomatic treatment of the epilepsy, following general practice for
    genetic developmental and epileptic encephalopathies. There is no
    CHKA-specific antiseizure regimen, no published treatment protocol for this
    disorder, and no evidence that any particular agent is preferentially
    effective; the founding report does not describe treatment outcomes in its
    abstract. This entry records the standard of care, not a disease-specific
    recommendation.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  notes: >-
    Deliberately carries no evidence block: no publication reports antiseizure
    treatment outcomes in CHKA-related disease, and citing a general epilepsy
    reference here would overstate what is known about this disorder.
- name: Tone- and movement-directed symptomatic pharmacotherapy
  description: >-
    Symptomatic management of the movement axis. Every reported individual has a
    tone abnormality, but the direction is split — hypertonia in three, hypotonia
    in three — with dyskinesia, rigidity or choreoathetosis in a subset, so the
    agents below apply to the hypertonic and hyperkinetic individuals rather than
    to the cohort as a whole. Standard practice for severe early-onset mixed movement disorders
    uses oral antispastic agents (baclofen), anticholinergics for the
    hyperkinetic and dystonic component (trihexyphenidyl), and focal botulinum
    toxin for targeted tone reduction. Botulinum toxin is named in the
    description rather than bound as a `therapeutic_agent`, because NCIT:C163032
    is not reachable from the ChemicalEntityTerm enum root and no suitable bound
    term exists. As with the antiseizure entry, this
    records the standard of care for the phenotype, not a CHKA-specific
    recommendation: no publication reports movement-directed treatment or its
    outcome in this disorder.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: muscle relaxant
      term:
        id: NCIT:C29696
        label: Muscle Relaxant
    - preferred_term: baclofen
      term:
        id: CHEBI:2972
        label: baclofen
  target_phenotypes:
  - preferred_term: Hypertonia
    term:
      id: HP:0001276
      label: Hypertonia
  - preferred_term: Abnormality of movement
    term:
      id: HP:0100022
      label: Abnormality of movement
  notes: >-
    Deliberately carries no evidence block, on the same footing as the
    antiseizure entry: no publication reports movement-directed treatment
    outcomes in CHKA-related disease, and citing a general spasticity or
    dystonia reference here would imply disorder-specific evidence that does not
    exist. Added for symmetry with the seizure axis, which is equally cardinal
    and no better evidenced.
- name: Multidisciplinary supportive and rehabilitative care
  description: >-
    Physical, occupational and speech-language therapy, feeding and nutritional
    support, and orthopaedic management of tone abnormalities, as for any severe
    early-onset neurodevelopmental disability. Symptom-directed and
    individualised; no disorder-specific protocol exists.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Extrapolated from general management of severe developmental and epileptic
    encephalopathies; no CHKA-specific outcome data exist, so no evidence block
    is attached.
- name: Genetic counselling
  description: >-
    Counselling for an autosomal recessive disorder with a 25% recurrence risk
    per pregnancy for carrier couples. Particularly relevant here because four
    of the five reported families were consanguineous. Once the familial
    variants are known, carrier testing of relatives, prenatal diagnosis and
    preimplantation genetic testing are all technically available, though no
    CHKA-specific prenatal case has been published.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35202461
    reference_title: Bi-allelic variants in CHKA cause a neurodevelopmental disorder
      with epilepsy and microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In summary, we present CHKA as a novel autosomal recessive gene for a
      neurodevelopmental disorder with epilepsy and microcephaly.
    explanation: >-
      The autosomal recessive mode of inheritance is what determines the
      recurrence risk that counselling conveys.
animal_models:
- name: Chka knockout mouse (cortical neuron phenotype)
  species: Mouse
  genotype: CRISPR-Cas9-generated Chka knockout
  publication: PMID:42034046
  description: >-
    A CRISPR-Cas9 Chka knockout mouse used to examine cortical neuronal
    architecture and presynaptic ultrastructure. The publication does not state
    in its abstract whether the animals studied were homozygous, heterozygous or
    conditional; that matters, because an earlier insertional Chka null is
    embryonic lethal before embryonic day 7.5, so viable postnatal cortex cannot
    come from a constitutive homozygous null. The genotype is recorded here as
    the authors describe it and the discrepancy is flagged under `discussions`.
  modeled_mechanisms:
  - target: Impaired Neuronal Dendritic and Synaptic Development
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: >-
      Provides the cellular neurodevelopmental phenotype — reduced dendritic
      branching, decreased synaptic density, impaired presynaptic vesicle
      docking — that the human disorder's biochemical lesion is presumed to
      cause.
    limitations: >-
      Fidelity is UNKNOWN rather than assigned: the abstract does not specify
      the zygosity or conditionality of the knockout, and a constitutive
      homozygous Chka null is embryonic lethal in mouse, so it cannot be
      determined whether this model reproduces the hypomorphic state that causes
      human disease. No behavioural, seizure or head-size phenotyping is
      reported, so the model is not shown to recapitulate the clinical
      phenotype.
    readouts:
    - name: Cortical dendritic branching complexity (Golgi staining)
      target: Impaired Neuronal Dendritic and Synaptic Development
      direction: DECREASED
      interpretation: >-
        Structural correlate of impaired dendritic development in the knockout
        cortex.
      evidence:
      - reference: PMID:42034046
        reference_title: CHKA knockout impairs dendritic development and Wnt pathway
          regulation in neurodevelopment.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Golgi staining demonstrated that CHKA deficiency was associated with
          reduced dendritic branching complexity and decreased synaptic connection
          density in cortical neurons.
        explanation: Reports the measurement and its direction.
    - name: Presynaptic vesicles in the fusion-docked state (electron microscopy)
      target: Impaired Neuronal Dendritic and Synaptic Development
      direction: DECREASED
      interpretation: >-
        Indicates a defect in synaptic vesicle maturation and docking rather
        than in vesicle supply, since total vesicle number rises.
      evidence:
      - reference: PMID:42034046
        reference_title: CHKA knockout impairs dendritic development and Wnt pathway
          regulation in neurodevelopment.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Electron microscopy revealed a significant increase in total vesicle
          number within presynaptic terminals in knockout mice, accompanied by a marked
          reduction in vesicles at fusion docking states.
        explanation: Reports both the increase in total vesicles and the docking deficit.
    evidence:
    - reference: PMID:42034046
      reference_title: CHKA knockout impairs dendritic development and Wnt pathway
        regulation in neurodevelopment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: CHKA deficiency impaired cortical dendritic development and synaptic
        vesicle maturation in mice.
      explanation: >-
        Supports treating this model as informative for the neuronal development
        node.
- name: Chka null mouse (constitutive insertional knockout)
  species: Mouse
  genotype: Chka(-/-) insertional null
  publication: PMID:18029352
  description: >-
    The original constitutive Chka knockout. Homozygous embryos are recovered at
    the blastocyst stage but not at embryonic day 7.5. This is a negative result
    that constrains the human disease model rather than reproducing it: it
    establishes that complete choline kinase alpha loss is incompatible with
    mammalian development, and therefore that all human disease-causing
    genotypes must retain residual activity.
  evidence:
  - reference: PMID:18029352
    reference_title: Early embryonic lethality caused by disruption of the gene for
      choline kinase alpha, the first enzyme in phosphatidylcholine biosynthesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We created mice lacking CK-alpha with an embryonic stem cell line containing
      an insertional mutation in the gene for CK-alpha (Chka).
    explanation: Establishes how the constitutive null allele was made.
  modeled_mechanisms:
  - target: Biallelic Hypomorphic CHKA Variants
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      A complete null does not model the human condition; it dies in early
      embryogenesis rather than producing a neurodevelopmental phenotype. Its
      value is in bounding the allelic spectrum compatible with survival.
    limitations: >-
      Constitutive homozygous nulls die before embryonic day 7.5, so the model
      yields no postnatal, neurological or head-size phenotype to compare with
      human disease. Heterozygotes, with roughly 30% reduced choline kinase
      activity, are grossly normal with unaffected phosphatidylcholine levels
      and so do not model the biallelic human state either. No hypomorphic
      knock-in of a human missense allele, and no brain-restricted conditional
      allele, has been reported.
    evidence:
    - reference: PMID:18029352
      reference_title: Early embryonic lethality caused by disruption of the gene for
        choline kinase alpha, the first enzyme in phosphatidylcholine biosynthesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Embryos homozygous for the mutant Chka allele were recovered at the
        blastocyst stage, but not at embryonic day 7.5, indicating that CK-alpha is
        crucial for the early development of mouse embryos.
      explanation: >-
        Establishes the embryonic lethality that makes the null a
        FAILS_TO_RECAPITULATE model of the human hypomorphic disorder.
    - reference: PMID:18029352
      reference_title: Early embryonic lethality caused by disruption of the gene for
        choline kinase alpha, the first enzyme in phosphatidylcholine biosynthesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Although choline kinase activity was decreased by approximately 30%,
        the amount of phosphatidylcholine in cells and the levels of other enzymes
        involved in phosphatidylcholine biosynthesis were unaffected.
      explanation: >-
        Shows that the surviving heterozygote does not reproduce the biochemical
        lesion either, so neither available genotype models the human disease.
experimental_models:
- name: CHKA patient-derived dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from individuals homozygous for p.(Arg141Trp) or
    p.(Pro194Ser), compared with fibroblasts from three healthy individuals.
    This is the only human cellular model of the disorder published to date and
    is the source of essentially all mechanistic data below the level of enzyme
    activity: targeted metabolomics, lipidomics, CCTalpha localisation,
    mitochondrial morphometry and respirometry, ROS and lipid peroxidation.
  modeled_mechanisms:
  - target: Oxidative Stress and Lipid Peroxidation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the full biochemical chain from reduced phosphocholine through
      phosphatidylcholine depletion to mitochondrial dysfunction and oxidative
      lipid damage in cells carrying the actual human disease genotypes.
    limitations: >-
      Fibroblasts are not a disease-relevant tissue. The clinical phenotype is
      CNS-restricted, and dermal fibroblasts cannot model cortical growth,
      dendritic arborisation, myelination or epileptogenesis. Fidelity is
      MODERATE rather than HIGH on that basis: the genotype and the biochemistry
      are authentic, the cell type is a surrogate. No iPSC-derived neuronal or
      brain-organoid model has been reported.
    readouts:
    - name: Mitochondrial reactive oxygen species (MitoSOX)
      target: Oxidative Stress and Lipid Peroxidation
      direction: INCREASED
      interpretation: >-
        Excess mitochondrial superoxide in cells carrying the human disease
        genotypes.
      evidence:
      - reference: PMID:41308990
        reference_title: Neurodevelopmental disease-causing variants in choline kinase
          CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage
          and disease etiology.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: CHKA variant fibroblasts exhibited impaired phospholipid and triacylglycerol
          synthesis, altered mitochondrial morphology and function, elevated reactive
          oxygen species (ROS) levels, and increased lipid peroxidation, suggesting
          a mechanism by which defective CHKA activity leads to lipid damage.
        explanation: Reports the elevated ROS measurement in the patient fibroblasts.
    - name: Lipid peroxidation (C11-BODIPY oxidised/reduced ratio)
      target: Oxidative Stress and Lipid Peroxidation
      direction: INCREASED
      interpretation: Membrane lipids are themselves oxidatively damaged.
      evidence:
      - reference: PMID:41308990
        reference_title: Neurodevelopmental disease-causing variants in choline kinase
          CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage
          and disease etiology.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Indeed, C11-BODIPY staining shifted from red to green signifying higher
          lipid peroxidation in the fibroblasts from patients with the biallelic CHKA
          variants.
        explanation: Reports the peroxidation readout and its direction.
    - name: Lipid peroxidation after FCCP treatment
      target: Oxidative Stress and Lipid Peroxidation
      direction: RESTORED
      interpretation: >-
        The mitochondrial uncoupler FCCP returns lipid peroxidation toward
        control levels, identifying the oxidative arm as pharmacologically
        addressable without correcting the synthetic block itself.
      evidence:
      - reference: PMID:41308990
        reference_title: Neurodevelopmental disease-causing variants in choline kinase
          CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage
          and disease etiology.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Treatment with FCCP, a mitochondrial uncoupler, reduced ROS levels
          and attenuated lipid peroxidation in CHKA patient fibroblasts, suggesting
          a potential approach to therapeutic intervention.
        explanation: Reports the rescue and the direction of the effect.
    evidence:
    - reference: PMID:41308990
      reference_title: Neurodevelopmental disease-causing variants in choline kinase
        CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
        disease etiology.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In this study, we investigated patient-derived fibroblasts with CHKA
        missense variants to elucidate the molecular and biochemical mechanisms underlying
        the associated pathologies.
      explanation: >-
        Establishes patient fibroblasts as the model system used to derive the
        mechanism.
- name: Saccharomyces cerevisiae cki1-delta complementation assay
  experimental_model_type: OTHER
  description: >-
    A choline-kinase-deficient yeast strain complemented with wild-type or
    variant human CHKA, used to measure the residual enzymatic activity of each
    candidate disease allele. This is a variant-classification assay rather than
    a disease model — it says nothing about neurodevelopment — but it is what
    established that the human alleles are hypomorphic and it supplied the
    residual-activity figures that anchor the genotype-phenotype discussion.
  modeled_mechanisms:
  - target: Reduced Choline Kinase Activity and Kennedy Pathway Block
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Quantifies the catalytic consequence of each human allele in a system
      where choline kinase is the only variable.
    limitations: >-
      A heterologous single-enzyme complementation system. It measures catalytic
      competence out of human cellular context and cannot address tissue
      selectivity, the CHKA/CHKB paralogue question, or any downstream
      consequence of the block.
    evidence:
    - reference: PMID:35202461
      reference_title: Bi-allelic variants in CHKA cause a neurodevelopmental disorder
        with epilepsy and microcephaly.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: functional testing of the variants in a cell-based Saccharomyces cerevisiae
        model, we determined that these variants reduce the enzymatic activity of CHKA
      explanation: Establishes the assay and what it measured.
differential_diagnoses:
- name: Megaconial congenital muscular dystrophy (CHKB-related)
  distinguishing_features:
  - >-
      Caused by biallelic variants in CHKB, the paralogue of CHKA that catalyses
      the same reaction in the same pathway, yet producing a muscle-predominant
      phenotype — muscular dystrophy with cardiomyopathy and intellectual
      disability — rather than the CNS-predominant picture of NEDMIMS. In mouse
      the division of labour runs the same way: Chkb loss causes hindlimb muscular
      dystrophy and forelimb bone deformity, while Chka loss is embryonic lethal.
      Distinguishing the two is straightforward on genotype and on the presence or
      absence of myopathy with megamitochondria on muscle biopsy; the mechanistic
      reason the same enzymatic defect produces different diseases is unresolved.
  evidence:
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In contrast to CHKA disease-causing variants, autosomal recessive variants
      in CHKB cause a neuromuscular disorder characterized by muscular dystrophy with
      intellectual disability and cardiomyopathy
    explanation: States the contrasting phenotype of the paralogous gene defect.
  - reference: PMID:20026284
    reference_title: Differential expression of choline kinase isoforms in skeletal
      muscle explains the phenotypic variability in the rostrocaudal muscular dystrophy
      mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Disruption of murine Chka leads to embryonic lethality, whereas a spontaneous
      genomic deletion in murine Chkb results in neonatal forelimb bone deformity and
      hindlimb muscular dystrophy.
    explanation: >-
      Shows the same isoform-specific division of phenotype in mouse, supporting
      differential tissue dependence rather than shared disease.
  - reference: PMID:23945283
    reference_title: Megaconial congenital muscular dystrophy due to loss-of-function
      mutations in choline kinase β.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recessive mutations in CHKB cause a megaconial congenital muscular dystrophy
      whose most characteristic feature is mitochondrial enlargement at the periphery
      of muscle fibers and loss of mitochondria in the center of muscle fibers.
    explanation: >-
      Gives the distinguishing histological feature — the megaconial mitochondrial
      distribution on muscle biopsy — that separates the CHKB disorder from
      NEDMIMS at the tissue level, not merely by genotype.
- name: Other Kennedy-pathway recessive disorders (PCYT1A, PCYT2, SELENOI)
  distinguishing_features:
  - >-
      Four of the ten Kennedy-pathway genes cause recessive disease, and each
      produces a distinct phenotype: PCYT1A bone abnormalities with cone-rod
      dystrophy, PCYT2 and SELENOI spastic paraplegia. None presents with the
      NEDMIMS combination of severe developmental delay, microcephaly, epilepsy
      and movement disorder, and all are separable by genotype.
  evidence:
  - reference: PMID:35202461
    reference_title: Bi-allelic variants in CHKA cause a neurodevelopmental disorder
      with epilepsy and microcephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: four of ten genes involved have been associated with a range of autosomal
      recessive rare diseases such as a neurodevelopmental disorder with muscular dystrophy
      (CHKB), bone abnormalities and cone-rod dystrophy (PCYT1A) and spastic paraplegia
      (PCYT2, SELENOI)
    explanation: Enumerates the sibling Kennedy-pathway disorders and their phenotypes.
- name: Other autosomal recessive microcephaly-epilepsy-developmental delay syndromes
  distinguishing_features:
  - >-
      Dozens of Mendelian disorders share the combination of severe developmental
      delay, microcephaly and early-onset epilepsy — including the neighbouring
      OMIM entities NEDMAS (SARS1), NEDHYMS (ADARB1) and MCSZ (PNKP) — and NEDMIMS
      has no imaging signature, biomarker or examination finding that separates it
      clinically. Discrimination is by sequencing, which is why unbiased exome or
      genome sequencing rather than targeted testing is the diagnostic route.
  notes: >-
    Recorded without an evidence block: the members of this differential are
    identified by their own OMIM entries rather than by any published
    comparative study of NEDMIMS, and no cited paper makes the comparison.
discussions:
- discussion_id: gap_chka_chkb_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    CHKA and CHKB encode the two mammalian choline kinases and catalyse the same
    reaction in the same pathway, yet biallelic loss of one causes a
    CNS-predominant neurodevelopmental disorder and biallelic loss of the other
    a muscle-predominant dystrophy. What determines the tissue selectivity —
    differential expression, differential substrate affinity, or differential
    capacity of each isoform to compensate for loss of the other?
  attaches_to:
  - pathophysiology#Reduced Choline Kinase Activity and Kennedy Pathway Block
  rationale: >-
    This is the central unexplained observation of the disorder and it is not a
    detail: without an answer, there is no mechanistic account of why a general
    membrane-lipid synthesis defect produces a specifically neurological
    phenotype, and no basis for predicting which tissues a future therapy would
    need to reach. It also bears directly on substrate-augmentation strategies,
    since a compensating isoform would change what supplementation could achieve.
  proposed_experiments:
  - experiment_id: exp_chka_chkb_isoform_expression_flux
    name: Isoform-resolved expression and flux mapping across human and mouse tissues
    description: >-
      Quantify CHKA and CHKB protein abundance and choline kinase flux in
      developing brain versus skeletal muscle, and test whether overexpression of
      each isoform rescues loss of the other in the corresponding tissue.
  evidence:
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: How variants in two genes that catalyze the same biochemical reaction
      for the synthesis of PC cause inherited diseases with different phenotypes is
      unclear
    explanation: The authors state the gap explicitly.
  - reference: PMID:27769579
    reference_title: Molecular structure and differential function of choline kinases
      CHKα and CHKβ in musculoskeletal system and cancer.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Both isoforms have similar structures and enzyme activity, but display
      some distinct molecular structural domains and differential tissue expression
      patterns.
    explanation: >-
      Names differential tissue expression as the leading candidate explanation;
      support is PARTIAL because the review states the difference exists without
      demonstrating that it accounts for the phenotypic divergence.
- discussion_id: mismatch_chka_no_hypomorphic_cns_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Human disease is caused by partial loss of choline kinase alpha in a
    developing brain. The available models do not reproduce that combination:
    the constitutive mouse null dies before embryonic day 7.5, the heterozygote
    has grossly normal phosphatidylcholine, patient fibroblasts carry the right
    genotype but the wrong cell type, and the yeast assay measures catalysis
    outside any organismal context. Does a hypomorphic, brain-directed model
    reproduce microcephaly, epilepsy and movement abnormality?
  attaches_to:
  - pathophysiology#Severe Neurodevelopmental Disability with Microcephaly, Epilepsy
    and Movement Abnormalities
  rationale: >-
    Every claim linking the biochemical lesion to the clinical phenotype is
    currently inferential, and the one published therapeutic lead — FCCP
    normalising oxidative damage — has been tested only in fibroblasts, where it
    cannot be shown to affect any neurodevelopmental endpoint. Without a
    hypomorphic CNS model there is no system in which to test a candidate
    therapy against the phenotypes that actually define the disease.
  proposed_experiments:
  - experiment_id: exp_chka_hypomorphic_knockin_or_conditional_mouse
    name: Knock-in of a human hypomorphic CHKA allele, or a brain-restricted conditional
      Chka allele
    description: >-
      Generate mice carrying the p.(Arg141Trp) or p.(Pro194Ser) equivalent, or a
      Nestin-Cre/Emx1-Cre conditional Chka deletion, and phenotype for head
      circumference, cortical dendritic architecture, seizure susceptibility and
      motor behaviour.
  - experiment_id: exp_chka_ipsc_cortical_neurons_organoids
    name: Patient iPSC-derived cortical neurons and brain organoids
    description: >-
      Differentiate iPSC lines from the reported individuals into cortical
      neurons and organoids, and test whether the fibroblast phenotype
      (phosphatidylcholine depletion, mitochondrial fragmentation, lipid
      peroxidation) is accompanied by reduced organoid growth or altered
      dendritic and synaptic development, and whether FCCP or choline
      supplementation modifies it.
  evidence:
  - reference: PMID:18029352
    reference_title: Early embryonic lethality caused by disruption of the gene for
      choline kinase alpha, the first enzyme in phosphatidylcholine biosynthesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Thus, Chka is an essential gene for early embryonic development, but adult
      mice do not require full expression of the gene for normal levels of phosphatidylcholine.
    explanation: >-
      Captures the mismatch from both sides: the null is lethal and the
      heterozygote is biochemically normal, so neither models the human state.
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: How a deficiency in CHKA activity manifests these neurological symptoms
      is poorly understood.
    explanation: Confirms that the biochemistry-to-phenotype link remains untested.
- discussion_id: q_chka_knockout_mouse_zygosity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    PMID:42034046 reports a CRISPR-Cas9 Chka knockout mouse with reduced
    cortical dendritic branching and impaired presynaptic vesicle docking, but
    its abstract does not state whether the animals were homozygous,
    heterozygous or conditional. A constitutive homozygous Chka null is
    embryonic lethal before embryonic day 7.5, so viable postnatal cortex cannot
    come from that genotype. Which allele was actually studied?
  attaches_to:
  - pathophysiology#Impaired Neuronal Dendritic and Synaptic Development
  rationale: >-
    The answer decides how much weight the only neuron-specific evidence in this
    entry can carry. If the animals were heterozygous, the phenotype arises from
    roughly 30% reduced activity, which is milder than the human biallelic state
    and makes the finding a lower bound; if conditional, it models CNS-restricted
    complete loss, which is more severe than any human genotype. Either reading
    changes the interpretation, which is why the model's `fidelity` is recorded
    as UNKNOWN rather than estimated.
  evidence:
  - reference: PMID:18029352
    reference_title: Early embryonic lethality caused by disruption of the gene for
      choline kinase alpha, the first enzyme in phosphatidylcholine biosynthesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Embryos homozygous for the mutant Chka allele were recovered at the blastocyst
      stage, but not at embryonic day 7.5, indicating that CK-alpha is crucial for
      the early development of mouse embryos.
    explanation: >-
      Establishes the embryonic lethality that makes the unspecified zygosity
      material.
- discussion_id: q_chka_kennedy_pathway_therapeutic_tractability
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the Kennedy-pathway block in CHKA disease therapeutically addressable, and
    if so at which step? Two routes are suggested by the paralogous CHKB
    literature but neither has been tested in CHKA disease: gene replacement, and
    substrate bypass with CDP-choline (citicoline), which enters the pathway
    downstream of the choline kinase step and so should in principle not require
    residual CHKA activity.
  attaches_to:
  - pathophysiology#Reduced Choline Kinase Activity and Kennedy Pathway Block
  rationale: >-
    In the rmd (Chkb-deleted) mouse, a muscle-specific Chkb transgene fully
    rescued motor and behavioural function, intramuscular AAV6-Chkb rescued the
    dystrophy after disease onset, and AAV6-driven upregulation of the paralogue
    Chka also improved the phenotype. That establishes Kennedy-pathway deficiency
    as a tractable target class in at least one tissue. Whether any of it
    transfers to CHKA disease is entirely open, and the obstacles are specific
    rather than generic: the target organ is the developing brain rather than
    skeletal muscle, the therapeutic window may close before diagnosis is made,
    and the only published CHKA therapeutic lead (FCCP normalising oxidative
    damage in fibroblasts) addresses a downstream consequence without restoring
    phosphatidylcholine synthesis. The citicoline route is a mechanistic
    inference from where the molecule enters the pathway, not a finding; it has
    been proposed for CHKB deficiency and never tested in CHKA disease.
  proposed_experiments:
  - experiment_id: exp_chka_cdp_choline_bypass_in_patient_cells
    name: CDP-choline (citicoline) bypass in CHKA patient-derived cells
    description: >-
      Treat CHKA patient fibroblasts, and ideally patient iPSC-derived cortical
      neurons, with CDP-choline and measure whether phosphatidylcholine,
      glycerophosphocholine, mitochondrial morphology, ROS and lipid peroxidation
      normalise — that is, whether entering the pathway downstream of the block
      corrects the defect rather than only its oxidative sequelae.
  - experiment_id: exp_chka_cns_gene_replacement_proof_of_concept
    name: CNS-directed CHKA gene replacement in a hypomorphic model
    description: >-
      Once a hypomorphic or brain-conditional Chka model exists, test
      AAV-mediated CHKA replacement for rescue of head growth, cortical dendritic
      architecture and seizure susceptibility, and determine the latest age at
      which rescue is still achievable.
  evidence:
  - reference: PMID:31216357
    reference_title: Functional rescue in a mouse model of congenital muscular dystrophy
      with megaconial myopathy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Intramuscular gene therapy post-disease onset using an adeno-associated
      viral 6 (AAV6) vector carrying a functional copy of Chkb is also capable of rescuing
      the dystrophy phenotype.
    explanation: >-
      Proof of concept that a Kennedy-pathway choline kinase deficiency can be
      rescued by gene therapy after disease onset; support is PARTIAL because the
      gene, the disease and the target tissue are all the paralogous ones, not
      CHKA in brain.
  - reference: PMID:31216357
    reference_title: Functional rescue in a mouse model of congenital muscular dystrophy
      with megaconial myopathy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: we examined the ability of choline kinase alpha (Chka), a gene paralog
      of Chkb, to improve dystrophic phenotypes when upregulated in skeletal muscles
      of rmd mutant mice using a similar AAV6 vector
    explanation: >-
      Shows CHKA itself is deliverable and functional as an AAV cargo in vivo,
      which is the relevant technical precedent; PARTIAL because it was tested in
      the muscle of a Chkb-deficient animal, not in a CHKA-deficient brain.
  - reference: PMID:27769579
    reference_title: Molecular structure and differential function of choline kinases
      CHKα and CHKβ in musculoskeletal system and cancer.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: restoration of CHKβ deficiency through CDP-choline supplements like citicoline
      may be beneficial for the treatment of muscular dystrophy, bone metabolic diseases,
      and cognitive conditions
    explanation: >-
      Records the CDP-choline supplementation proposal; support is PARTIAL and the
      proposal is for CHKB, not CHKA — it is cited here as the origin of the
      hypothesis, not as evidence for its use in this disorder.
datasets: []
notes: >-
  Deep research: the falcon (Edison) provider was attempted first, as the
  default, and returned HTTP 402 Payment Required from the Edison API, so no
  falcon report exists for this entry. Two reports were produced and both were
  used: claude_code (fast, web-grounded) and openscientist (which completed
  after the first draft and supplied the CHKB gene-therapy and CDP-choline
  leads now recorded under `discussions`). The claude_code report's own
  reference-validation block reports 6/6 identifiers resolved
  (confabulation_rate 0.0) but needs_review true, because both quoted claims it
  checked — attributed to PMID:41308990 — failed to match the cached source.
  Neither of those two quotes is used in this entry. The openscientist report
  resolved 9/9 identifiers with confabulation_rate 0.0. Every snippet here was
  re-derived directly from the cached reference text and checked with
  `just count-verified-snippets`; no snippet was copied from either report.
  Named-entity-confusion preflight: `just preflight-dr` against MONDO:0859282
  returned PASS on the claude_code report, with CHKA mentioned 48 times against
  5 mentions of the nearest rival gene (CHKB, which is cited deliberately as
  the differential diagnosis), and the report's OMIM set containing the MONDO
  xref OMIM:620023. The same check on the openscientist report returned WARN,
  on a false positive: the flagged "rival gene PC" is the report's abbreviation
  for phosphatidylcholine, not the pyruvate carboxylase gene. CHKA still
  dominates that report (45 mentions), its OMIM set is exactly {620023,
  118491} (the phenotype and the gene), and its narrative is entirely about
  CHKA, so the WARN was resolved as a lexicon artefact rather than a
  wrong-entity report.
  GeneReviews baseline: a PubMed search for a GeneReviews chapter on CHKA or
  NEDMIMS returned no results, so no GeneReviews phenotype baseline was
  available. Phenotype coverage was instead taken from the single published
  clinical cohort (PMID:35202461).
  Evidence-scope caveat, which shapes this entry throughout: the full text of
  the founding report is not retrievable through the reference cache (the
  publisher PDF returns HTTP 403), so only its abstract is quotable. Clinical
  detail that exists only in that full text — family ancestry and consanguinity,
  per-individual seizure onset ages, head-circumference SD scores (-3.3 to -7),
  nystagmus, retinal findings, developmental regression, the specific movement
  phenomenology, and the exact cDNA and protein changes of each variant — was
  read from the open-access PMC copy (PMC9630884) and cross-checked against the
  claude_code deep-research report, which agrees on every point. It is carried
  here in prose (`description`, `genetic.notes`) and, where it is a distinct
  clinical feature, as a `phenotypes` entry with an ontology term but
  deliberately NO evidence block, each carrying a `notes` line saying why. Five
  phenotypes (severe global developmental delay, intellectual disability,
  microcephaly, epilepsy, movement abnormalities) rest on quotable abstract text
  and carry evidence; four (extrapyramidal movement abnormalities, nystagmus,
  abnormal retinal pigmentation, developmental regression) do not. A curator
  with full-text access should attach evidence to the latter rather than
  re-derive them.
  Movement-phenotype granularity: the parent terms `HP:0100022` (Abnormality of
  movement), `HP:0002071` (Abnormality of extrapyramidal motor function) and
  `HP:0003808` (Abnormal muscle tone) are retained alongside the specific
  `HP:0001276` (Hypertonia) and `HP:0001252` (Hypotonia), and this is deliberate
  rather than redundant. `HP:0003808` in particular is the only term on which
  the fully penetrant tone claim is true: Table 1 of PMID:35202461 splits the
  cohort three hypertonic (1.1, 1.2, 4) and three hypotonic (2, 3, 5), so every
  individual has abnormal tone while neither direction exceeds half. Curating
  hypertonia alone — as an earlier revision of this entry did, at 6 of 6 — states
  the opposite of what the source shows. `HP:0100022` is the only movement phenotype
  with quotable evidence — the founding abstract says "movement disorders" and
  nothing more specific — so removing it would delete the entry's sole evidenced
  movement claim. `HP:0002071` covers the hyperkinetic subset (dyskinesia,
  rigidity, choreoathetosis in individuals 4 and 5), which is not subsumed by
  hypertonia; the cohort's movement disorder is mixed, and collapsing the two
  would misrepresent it as purely spastic.
  Cached-but-unconsumed references: five fetched references are not cited by this
  entry. PMID:31745227 (CHKA-c-Src scaffolding) and PMID:27206796, PMID:27705917
  and PMID:34416377 (CHKA in cancer) describe roles of the same protein that have
  no demonstrated bearing on NEDMIMS pathogenesis, and are deliberately excluded
  rather than overlooked — importing an oncology-derived signalling role into a
  neurodevelopmental entry would assert a mechanism nobody has shown here. They
  are cached because the deep-research reference validator fetched every citation
  in the two reports.

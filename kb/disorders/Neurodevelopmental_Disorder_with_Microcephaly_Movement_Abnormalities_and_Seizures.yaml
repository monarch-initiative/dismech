- name: Oxidative Stress and Lipid Peroxidation
  description: >-
    Mitochondrial superoxide (MitoSOX) and total reactive oxygen species are
    elevated in patient fibroblasts, and the lipid peroxidation sensor
    C11-BODIPY shifts from red to green, indicating oxidative damage to the
    membrane lipids themselves. This closes a self-reinforcing loop specific to
    this disorder: a cell that cannot make enough membrane phospholipid also
    destroys the phospholipid it has. It is also the node with a therapeutic
    handle — the mitochondrial uncoupler FCCP returns both ROS and lipid
    peroxidation toward control levels without correcting the underlying
    synthetic block.
  role: amplifier
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
  evidence:
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CHKA variant fibroblasts exhibited impaired phospholipid and triacylglycerol
      synthesis, altered mitochondrial morphology and function, elevated reactive oxygen
      species (ROS) levels, and increased lipid peroxidation, suggesting a mechanism
      by which defective CHKA activity leads to lipid damage.
    explanation: >-
      States the full chain from the synthetic defect to oxidative lipid damage.
  - reference: PMID:41308990
    reference_title: Neurodevelopmental disease-causing variants in choline kinase
      CHKA gene couple phosphatidylcholine synthesis to oxidative stress damage and
      disease etiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Indeed, C11-BODIPY staining shifted from red to green signifying higher
      lipid peroxidation in the fibroblasts from patients with the biallelic CHKA variants.
    explanation: The specific readout demonstrating peroxidation of membrane lipids.
- name: Impaired Neuronal Dendritic and Synaptic Development
  description: >-
    In a CRISPR-Cas9 Chka knockout mouse, cortical neurons show reduced
    dendritic branching complexity and decreased synaptic connection density on
    Golgi staining, and presynaptic terminals accumulate vesicles while showing
    markedly fewer vesicles in the fusion-docked state — a maturation rather
    than a supply defect. Transcriptomic and proteomic profiling implicated
    neurodevelopmental pathways with a Wnt signalling contribution. This is the
    only experimental link so far between the biochemical lesion and a
    neuron-specific phenotype, and it comes from mouse rather than human tissue.

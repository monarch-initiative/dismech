  description: >-
    The clinical endpoint: severe global developmental delay, epilepsy, movement
    disorders and microcephaly in all reported individuals. Which of the
    upstream cellular defects — membrane biogenesis failure during cortical
    growth, oxidative lipid damage, or impaired dendritic and synaptic
    maturation — is rate-limiting for each clinical feature is unresolved, and
    no human brain tissue or human neuronal model has been studied.

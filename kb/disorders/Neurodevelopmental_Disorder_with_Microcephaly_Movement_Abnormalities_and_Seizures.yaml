inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic CHKA variants are required. Four of the five families in the
    founding cohort were consanguineous with homozygous variants; the fifth was
    a non-consanguineous German family with a compound-heterozygous genotype.
    Heterozygous carriers are clinically unaffected, consistent with mouse
    Chka(+/-) animals being normal despite an approximately 30% reduction in
    choline kinase activity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35202461
    reference_title: Bi-allelic variants in CHKA cause a neurodevelopmental disorder
      with epilepsy and microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In summary, we present CHKA as a novel autosomal recessive gene for a
      neurodevelopmental disorder with epilepsy and microcephaly.
    explanation: States the autosomal recessive mode of inheritance directly.
  - reference: PMID:18029352
    reference_title: Early embryonic lethality caused by disruption of the gene for
      choline kinase alpha, the first enzyme in phosphatidylcholine biosynthesis.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Heterozygous mutant mice (Chka(+/-)) appeared entirely normal in their
      embryonic development and gross anatomy, and they were fertile.
    explanation: >-
      Model-organism support for carrier tolerance of a single functional allele;
      PARTIAL because it is a mouse observation, not human carrier data.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence estimate exists, and there is no
    Orphanet epidemiology record for this entity. The published clinical
    literature consists of a single 2022 series of six individuals from five
    families (Iranian, Indian, Egyptian, German and Bangladeshi backgrounds); a
    subsequent mechanistic study used fibroblasts from two of those individuals
    and reported no new patients. The disorder is therefore recorded as
    ULTRA_RARE / CASES_IN_LITERATURE rather than assigned a numeric rate.
  evidence:
  - reference: PMID:35202461
    reference_title: Bi-allelic variants in CHKA cause a neurodevelopmental disorder
      with epilepsy and microcephaly.

pathophysiology:
- name: Biallelic Hypomorphic CHKA Variants
  description: >-
    Biallelic pathogenic variants in CHKA (11q13.2) reduce, but do not abolish,
    choline kinase alpha. The reported allelic spectrum comprises three missense
    variants, one start-loss variant and one truncating (frameshift) variant.
    Every genotype retains residual enzyme function: the two recurrent
    homozygous missense alleles p.(Arg141Trp) and p.(Pro194Ser) retain
    approximately 25% and 17% of wild-type activity respectively, and the single
    compound-heterozygous individual carries a null frameshift allele in trans
    with a partially active missense allele. This hypomorphic requirement is not
    incidental: complete loss of Chka is lethal in early mouse embryogenesis, so
    a true human null genotype is not expected to be viable.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

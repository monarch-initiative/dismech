biochemical:
- name: Elevated 11-deoxycorticosterone and corticosterone
  notes: >-
    The two mineralocorticoid branch steroids that accumulate behind the
    17-alpha-hydroxylase block. Their elevation alongside suppressed renin and
    aldosterone is the pattern that identifies mineralocorticoid excess of
    adrenal precursor origin rather than primary aldosteronism.
  evidence:
  - reference: PMID:24498484
    reference_title: "Congenital Adrenal Hyperplasia due to 17-alpha-hydoxylase/17,20-lyase Deficiency Presenting with Hypertension and Pseudohermaphroditism: First Case Report from Oman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      high levels of mineralocorticoids precursors (11-deoxycorticosterone and
      corticosterone) with high levels of ACTH, FSH and LH
    explanation: >-
      Measured elevation of both steroids with the expected high ACTH and
      gonadotropins.
- name: Low cortisol with elevated ACTH
  notes: >-
    Morning cortisol is the measurement that grades severity. In partial
    disease cortisol may respond normally or partially to ACTH stimulation,
    which is what distinguishes the partial from the complete form.
  evidence:
  - reference: PMID:42427966
    reference_title: "Be alert to hypertension caused by 17α-hydroxylase deficiency: two case reports in young patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory investigations showed markedly elevated adrenocorticotropic
      hormone (ACTH) levels, significantly decreased cortisol levels and a
      disrupted circadian rhythm.
    explanation: Documents the low cortisol with high ACTH signature.
  - reference: DOI:10.20944/preprints202610.2735.v1
    reference_title: "Structural, Enzymatic and Population-Genetic Profiling of CYP17A1 Variants Defines the Molecular Basis of Partial 17α-Hydroxylase/17,20-Lyase Deficiency"
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum progesterone was raised in all 10 probands but did not distinguish
      partial from complete deficiency, whereas morning cortisol did
    explanation: >-
      Establishes morning cortisol as the severity marker, against progesterone
      as a screening marker. Preprint, not peer reviewed.
- name: Elevated serum progesterone
  notes: >-
    Progesterone accumulates immediately upstream of the block and is raised
    across the whole severity range, which makes it a sensitive screening
    marker but not a measure of severity. Note that 17-hydroxyprogesterone, the
    newborn screening analyte for 21-hydroxylase deficiency, is LOW here
    because its synthesis requires the enzyme that is missing. A normal or low
    17-hydroxyprogesterone therefore does not exclude congenital adrenal
    hyperplasia.
  evidence:
  - reference: PMID:29144824
    reference_title: "17α-HYDROXYLASE DEFICIENCY IS AN UNDERDIAGNOSED DISEASE: HIGH FREQUENCY OF MISDIAGNOSES IN A LARGE COHORT OF BRAZILIAN PATIENTS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reduced sex steroids, and elevated gonadotropins and progesterone levels,
      in addition to mineralocorticoid hypertension, are pathognomonic of
      P450c17D
    explanation: >-
      Names elevated progesterone with reduced sex steroids and
      mineralocorticoid hypertension as the diagnostic biochemical pattern.
genetic:
- name: CYP17A1 pathogenic variants
  gene_term:
    preferred_term: CYP17A1
    term:
      id: hgnc:2593
      label: CYP17A1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic loss of function variants in CYP17A1 cause combined
    17-alpha-hydroxylase/17,20-lyase deficiency. Founder alleles raise the
    frequency in specific populations: p.W406R and p.R362C together account for
    most mutant alleles in Brazilian families, of Spanish and Portuguese origin
    respectively.
  notes: >-
    Residual enzyme activity, not variant class alone, predicts severity, and
    the two catalytic activities are lost to different degrees by the same
    substitution. Current missense predictors are not calibrated for the
    partial loss alleles that dominate the clinically ambiguous end of the
    spectrum, so a benign prediction does not exclude a pathogenic allele in a
    patient with a compatible biochemical phenotype.
  evidence:
  - reference: PMID:21340157
    reference_title: "Six new cases confirm the clinical molecular profile of complete combined 17α-hydroxylase/ 17,20-lyase deficiency in Brazil."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      p.W406R and p.R362C corresponded to 50% and 32% of CYP17A1 mutant alleles
    explanation: >-
      Founder allele frequencies in Brazilian families. Quoted from this
      paper's own background restatement of an earlier cohort, hence BACKGROUND.
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      residual CYP17A1 17α-hydroxylase activity is associated with the severity
      of this condition
    explanation: >-
      Supports residual activity rather than variant class as the determinant
      of severity.
diagnosis:
- name: Urinary steroid profiling by mass spectrometry
  description: >-
    Mass spectrometry based urinary steroid profiling establishes the diagnosis
    and distinguishes it from other causes of primary adrenal insufficiency.
    The ratio of corticosterone to cortisol metabolites reflects in vivo
    17-alpha-hydroxylase activity and tracks severity.
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinary steroid profiling by mass spectrometry represents a powerful
      diagnostic tool not only in establishing the diagnosis but also in
      predicting the severity of the phenotype
    explanation: >-
      States the diagnostic and prognostic role of urinary steroid profiling in
      this disorder.
- name: CYP17A1 genetic testing
  description: >-
    Sequencing of CYP17A1 provides the definitive diagnosis after the
    biochemical pattern raises the suspicion.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29144824
    reference_title: "17α-HYDROXYLASE DEFICIENCY IS AN UNDERDIAGNOSED DISEASE: HIGH FREQUENCY OF MISDIAGNOSES IN A LARGE COHORT OF BRAZILIAN PATIENTS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CYP17A1 gene mutations provide a definitive diagnosis"
    explanation: States the confirmatory role of CYP17A1 sequencing.
treatments:
- name: Glucocorticoid replacement
  description: >-
    Glucocorticoid replacement corrects the cortisol deficit and, by
    suppressing ACTH, removes the drive that produces the mineralocorticoid
    precursor excess. It therefore treats the hypertension and hypokalemia at
    their cause, and adequate replacement can allow antihypertensive therapy to
    be stopped.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: NCIT:C422
        label: Dexamethasone
    - preferred_term: hydrocortisone
      term:
        id: CHEBI:17650
        label: cortisol
  target_mechanisms:
  - target: HPA Axis Activation and ACTH Excess
    treatment_effect: INHIBITS
    description: >-
      Restoring glucocorticoid negative feedback suppresses the ACTH drive that
      diverts precursor flux into the mineralocorticoid branch.
  - target: Cortisol Synthesis Failure
    treatment_effect: RESTORES
    description: Replaces the glucocorticoid the blocked pathway cannot make.
  target_phenotypes:
  - preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  - preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:42427966
    reference_title: "Be alert to hypertension caused by 17α-hydroxylase deficiency: two case reports in young patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the 6-month follow-up after initiation of dexamethasone
      replacement therapy, the patients' blood pressure and serum potassium
      levels were well controlled.
    explanation: >-
      Blood pressure and potassium both normalized on glucocorticoid
      replacement alone, supporting ACTH suppression as the treatment of the
      mineralocorticoid excess.
  - reference: PMID:24498484
    reference_title: "Congenital Adrenal Hyperplasia due to 17-alpha-hydoxylase/17,20-lyase Deficiency Presenting with Hypertension and Pseudohermaphroditism: First Case Report from Oman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was treated with dexamethasone and ethinyl estradiol with
      cessation of anti-hypertensive therapy
    explanation: >-
      Antihypertensive therapy was stopped once glucocorticoid and sex steroid
      replacement were established.
  - reference: PMID:42427966
    reference_title: "Be alert to hypertension caused by 17α-hydroxylase deficiency: two case reports in young patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hydrocortisone is closer to physiological cortisol and is usually
      preferred in children, but its short half-life can make blood pressure
      control less stable and adherence more difficult.
    explanation: >-
      Hydrocortisone is the usual agent in children; its short half-life is the
      trade-off against the stronger ACTH suppression of dexamethasone.
  - reference: PMID:40725971
    reference_title: "Three misdiagnoses before a final diagnosis of 17α-hydroxylase/17,20-lyase deficiency: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When adult 17OHD patients cannot tolerate long-acting glucocorticoids,
      they can be replaced with hydrocortisone therapy.
    explanation: >-
      Hydrocortisone is also the substitute agent in adults who do not tolerate
      dexamethasone.
- name: Sex steroid replacement
  description: >-
    Estrogen replacement in 46,XX and 46,XY individuals raised as female
    induces secondary sexual characteristics and uterine development where a
    uterus is present; testosterone is used in 46,XY individuals raised as
    male. Replacement does not correct the underlying enzyme defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
  target_mechanisms:
  - target: Sex Steroid Synthesis Failure
    treatment_effect: RESTORES
    description: >-
      Exogenous sex steroid substitutes for the hormones the blocked pathway
      cannot produce.
  target_phenotypes:
  - preferred_term: Absence of pubertal development
    term:
      id: HP:0008197
      label: Absence of pubertal development
  evidence:
  - reference: PMID:36800681
    reference_title: "Clinical and Genetic Analyses of Two Unrelated 46,XX Girls with Combined 17α-hydroxylase/17,20-lyase Deficiency from China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both received estrogen and glucocorticoid replacement therapy, leading to
      gradual development of the uterus and breasts, and the onset of first
      menstruation
    explanation: >-
      Estrogen replacement produced uterine and breast development and
      menarche in two 46,XX patients.
- name: GnRH agonist for ovarian cysts
  description: >-
    A long-acting GnRH agonist suppresses the gonadotropin drive behind
    recurrent ovarian cysts in 46,XX patients. The evidence is a single case in
    which triptorelin was started together with oestradiol, so the effect of
    the agonist alone is not separated from that of estrogen feedback.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: triptorelin
      term:
        id: CHEBI:63633
        label: triptorelin
  target_mechanisms:
  - target: Hypergonadotropic Gonadotropin Drive
    treatment_effect: INHIBITS
    description: >-
      Continuous GnRH agonist exposure desensitizes the pituitary and lowers
      the LH and FSH that stimulate the cysts.
  target_phenotypes:
  - preferred_term: Ovarian cyst
    term:
      id: HP:0000138
      label: Ovarian cyst
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional treatment of oestradiol (1 mg/day) in combination with GnRH
      super agonist (triptorelin embonate, 3.75 mg/month) was initiated. Five
      days later, abdominal pain resolved, and after the second dose of
      Diphereline, both ovarian cysts regressed completely.
    explanation: >-
      Both ovarian cysts regressed after triptorelin was added. Oestradiol was
      started at the same time, so this single case supports the combination
      rather than the agonist alone.
  - reference: PMID:40725971
    reference_title: "Three misdiagnoses before a final diagnosis of 17α-hydroxylase/17,20-lyase deficiency: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Studies show that residual ovarian follicles in some 17OHD patients can
      cause elevated follicle-stimulating hormone and luteinizing hormone,
      leading to recurrent ovarian cysts.
    explanation: >-
      States the gonadotropin-driven cyst mechanism that the agonist is used to
      suppress; the paper reports it from earlier studies.
notes: >-
  Promoted out of the Congenital_Adrenal_Hyperplasia entry, where this disease
  had been a has_subtypes row. That entry keeps a pointer subtype carrying
  curated_in, so the two do not model the same concept twice.


  There is no GeneReviews chapter for this disorder. The committed Bookshelf
  index (cache/bookshelf/genereviews.csv) returns no match for
  17-alpha-hydroxylase, 17,20-lyase or CYP17A1. The chapter that surfaces
  nearest in searches is the one titled Cytochrome P450 Oxidoreductase
  Deficiency, which is a different disorder; its identifier is deliberately not
  written here, because naming it would read as a citation of a chapter this
  entry does not rest on.


  No incidence or prevalence rate for this disorder in cases per 100,000 was
  found. The Orphanet European point prevalence class is recorded above; the
  other figure available is that it accounts for about 1% of congenital
  adrenal hyperplasia, which is a share of a disease family rather than a rate
  and so is not recorded as a Prevalence record.


  Mineralocorticoid receptor antagonists are not listed as a treatment.
  Searches for their use in this disorder returned PMID:22932914, a review of
  endocrine hypertension that assigns spironolactone and eplerenone to
  apparent mineralocorticoid excess rather than to congenital adrenal
  hyperplasia. The 17-OHD reports read here treat the hypertension by
  suppressing ACTH with glucocorticoid, and two of them record
  antihypertensives being stopped once replacement was adequate. One patient
  is an exception: in Case 4 of PMID:34524979, after hydrocortisone was
  started, "She remained on levothyroxine, spironolactone and oestradiol
  patches for pubertal induction." The report does not say why spironolactone
  was continued or what it was for, so a single case with no stated
  indication is not recorded as a treatment.


  Bone mineral density in untreated hypogonadism is an expected concern but is
  not recorded, because no study of it in this disorder was found. A PubMed
  search for "17-hydroxylase deficiency" with bone mineral density returns one
  record, PMID:33509658, which concerns abiraterone induced 17-hydroxylase
  blockade in prostate cancer, a pharmacological phenocopy and not this
  disease.
references:
- reference: PMID:34524979
  title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
  tags: []
  findings:
  - statement: >-
      Case series of eight patients spanning both extremes of the spectrum,
      with in vitro residual activity for each variant, establishing that
      residual 17-alpha-hydroxylase activity tracks clinical severity.
- reference: PMID:29144824
  title: "17α-HYDROXYLASE DEFICIENCY IS AN UNDERDIAGNOSED DISEASE: HIGH FREQUENCY OF MISDIAGNOSES IN A LARGE COHORT OF BRAZILIAN PATIENTS."
  tags: []
  findings:
  - statement: >-
      Cohort of 40 Brazilian patients giving the frequency of hypertension and
      hypokalemia, the diagnostic biochemical criteria, and the burden of
      misdiagnosis before the correct diagnosis is reached.
- reference: PMID:21340157
  title: "Six new cases confirm the clinical molecular profile of complete combined 17α-hydroxylase/ 17,20-lyase deficiency in Brazil."
  tags: []
  findings:
  - statement: >-
      Confirms the uniform hypergonadotropic hypogonadism of the complete form
      and restates the W406R and R362C founder allele frequencies in Brazilian
      families.
- reference: PMID:24498484
  title: "Congenital Adrenal Hyperplasia due to 17-alpha-hydoxylase/17,20-lyase Deficiency Presenting with Hypertension and Pseudohermaphroditism: First Case Report from Oman."
  tags: []
  findings:
  - statement: >-
      Full steroid profile in a single patient, and cessation of
      antihypertensive therapy once glucocorticoid and estrogen replacement
      were established.
- reference: PMID:42427966
  title: "Be alert to hypertension caused by 17α-hydroxylase deficiency: two case reports in young patients."
  tags: []
  findings:
  - statement: >-
      Two young patients presenting with hypertension, with blood pressure and
      potassium controlled by dexamethasone replacement alone.
- reference: PMID:36800681
  title: "Clinical and Genetic Analyses of Two Unrelated 46,XX Girls with Combined 17α-hydroxylase/17,20-lyase Deficiency from China."
  tags: []
  findings:
  - statement: >-
      Estrogen plus glucocorticoid replacement produced uterine and breast
      development and menarche in two 46,XX patients.
- reference: PMID:38933733
  title: "Successful Pregnancy in Isolated 17,20-lyase Deficiency Without Glucocorticoid Use or Assisted Reproduction Techniques."
  tags: []
  findings:
  - statement: >-
      A partial form with cortisol responding partially to ACTH stimulation,
      managed with sex steroid replacement and stress dose glucocorticoid only.
- reference: PMID:40725971
  title: "Three misdiagnoses before a final diagnosis of 17α-hydroxylase/17,20-lyase deficiency: A case report."
  tags: []
  findings:
  - statement: >-
      Records the share of congenital adrenal hyperplasia attributable to this
      disorder, and nodular adrenal hyperplasia on imaging after prolonged
      ACTH drive.
- reference: ORPHA:90793
  title: "Congenital adrenal hyperplasia due to 17-alpha-hydroxylase deficiency"
  tags: []
  findings:
  - statement: >-
      Orphanet record supplying the European point prevalence class, the
      causal gene relationship and the HPO phenotype annotations with
      frequency bands.
- reference: DOI:10.20944/preprints202610.2735.v1
  title: "Structural, Enzymatic and Population-Genetic Profiling of CYP17A1 Variants Defines the Molecular Basis of Partial 17α-Hydroxylase/17,20-Lyase Deficiency"
  tags: []
  findings:
  - statement: >-
      Preprint, not peer reviewed. Separate assay of both CYP17A1 reactions
      across seven missense variants, the predicted carrier burden from gnomAD,
      and progesterone against morning cortisol as screening versus severity
      markers.

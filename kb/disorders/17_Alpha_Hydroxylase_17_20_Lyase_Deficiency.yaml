has_subtypes:
- name: Complete
  display_name: Complete 17-alpha-hydroxylase/17,20-lyase deficiency
  description: >-
    Severely inactivating variants on both alleles. Presents with absent
    pubertal development and low renin hypertension; 46,XY individuals are
    phenotypically female. Cortisol does not respond adequately to ACTH
    stimulation.
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients with combined 17α-hydroxylase/17,20-lyase
      deficiency due to severely inactivating CYP17A1 mutations first present
      with a lack of pubertal development and low renin hypertension
    explanation: >-
      Defines the presentation of the severe end of the spectrum, which this
      subtype covers.
- name: Partial
  display_name: Partial 17-alpha-hydroxylase/17,20-lyase deficiency
  description: >-
    At least one allele retaining measurable activity. Compatible with
    spontaneous puberty, menstruation and, in reported cases, fertility, and
    may be normotensive. Frequently mistaken for polycystic ovary syndrome or
    primary ovarian insufficiency, so diagnosis is often delayed. Cortisol may
    respond normally or partially to ACTH stimulation. Isolated 17,20-lyase
    deficiency caused by CYP17A1 variants sits at this end of the allelic
    spectrum and is covered by this subtype; isolated 17,20-lyase deficiency
    caused by variants in other genes, such as CYB5A or POR, is outside this
    entry.
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with milder mutations who are 46,XX may present with less overt
      pubertal delay and be normotensive, as in case 6
    explanation: >-
      Describes the clinical presentation of the milder end that this subtype
      covers: preserved pubertal development and normal blood pressure.
  - reference: PMID:38933733
    reference_title: "Successful Pregnancy in Isolated 17,20-lyase Deficiency Without Glucocorticoid Use or Assisted Reproduction Techniques."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosterone was increased, and cortisol responded partially to the
      ACTH-stimulation test
    explanation: >-
      A partial form in which cortisol reserve is preserved enough to respond
      to ACTH, unlike the complete form.
  - reference: PMID:38933733
    reference_title: "Successful Pregnancy in Isolated 17,20-lyase Deficiency Without Glucocorticoid Use or Assisted Reproduction Techniques."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Isolated 17,20-lyase deficiency (ILD) is a partial form of
      17α-hydroxylase/17,20-lyase deficiency
    explanation: >-
      Places CYP17A1-related isolated 17,20-lyase deficiency within this
      disorder as a partial form, which is why the paper's homozygous
      CYP17A1 p.R347H patient is cited under this subtype.

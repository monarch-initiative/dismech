pathophysiology:
- name: CYP17A1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic CYP17A1 variants reduce or abolish the activity of P450c17 in the
    adrenal cortex and gonads. The variants assayed to date leave immunoreactive
    protein largely intact, so the lesion is catalytic rather than a loss of
    steady state enzyme, and the two reactions of the single polypeptide are
    lost to different degrees.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: CYP17A1
    term:
      id: hgnc:2593
      label: CYP17A1
  cell_types:
  - preferred_term: adrenal cortical cell
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  molecular_functions:
  - preferred_term: steroid 17-alpha-monooxygenase activity
    term:
      id: GO:0004508
      label: steroid 17-alpha-monooxygenase activity
    modifier: DECREASED
  - preferred_term: steroid 17,20-lyase activity
    description: >-
      Oxidative cleavage of the C17 to C20 bond of 17-alpha-hydroxysteroids to
      C19 androgen precursors, the second reaction of the same CYP17A1
      polypeptide. Deliberately unbound: GO:0004508 is defined only as
      17-alpha-hydroxylation (RHEA:65760) and GO has no term for the lyase
      reaction, so no identifier is asserted rather than reusing the
      hydroxylase term.
    modifier: DECREASED
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      17,20-lyase activity was greatly reduced or abolished for all mutant
      CYP17A1 proteins studied
    explanation: >-
      Direct measurement of residual activity in patient variants expressed in
      HEK293 cells, establishing loss of the lyase reaction.
  - reference: DOI:10.20944/preprints202610.2735.v1
    reference_title: "Structural, Enzymatic and Population-Genetic Profiling of CYP17A1 Variants Defines the Molecular Basis of Partial 17α-Hydroxylase/17,20-Lyase Deficiency"
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      The pathogenicity of these CYP17A1 variants reflects specific catalytic
      and regulatory defects in a largely intact protein rather than loss of
      steady-state enzyme
    explanation: >-
      Supports the lesion being catalytic rather than a loss of enzyme.
      Preprint, not peer reviewed.
  downstream:
  - target: Cortisol Synthesis Failure
    description: >-
      Loss of 17-alpha-hydroxylase activity blocks conversion of pregnenolone
      and progesterone to their 17-alpha-hydroxy derivatives, the obligatory
      precursors of cortisol.
  - target: Sex Steroid Synthesis Failure
    description: >-
      Loss of 17,20-lyase activity blocks the C17 to C20 cleavage that produces
      C19 androgen precursors in both adrenal and gonad.
- name: Cortisol Synthesis Failure
  biological_scale: CELLULAR
  description: >-
    The glucocorticoid branch is interrupted upstream of 11-deoxycortisol, so
    cortisol output falls. Corticosterone, an intermediate of the unblocked
    mineralocorticoid branch, acts as a partial alternative glucocorticoid,
    which is why overt adrenal crisis is uncommon outside infancy.
  biological_processes:
  - preferred_term: cortisol biosynthetic process
    term:
      id: GO:0034651
      label: cortisol biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cortisol deficiency in 17OHD is appropriately compensated by activation of
      the HPA axis to maintain the required level of alternative glucocorticoid,
      primarily corticosterone, an intermediate in the mineralocorticoid pathway
    explanation: >-
      States both the cortisol deficit and the corticosterone compensation that
      distinguishes this block from other causes of adrenal insufficiency.
  downstream:
  - target: HPA Axis Activation and ACTH Excess
    description: >-
      Reduced cortisol negative feedback releases hypothalamic and pituitary
      drive.
  - target: Decreased circulating cortisol level
    description: Direct biochemical consequence of the blocked glucocorticoid branch.
  - target: Failure to thrive
    description: >-
      Early onset glucocorticoid deficiency can present in infancy before the
      corticosterone compensation is adequate.
- name: HPA Axis Activation and ACTH Excess
  biological_scale: ORGANISM
  description: >-
    Loss of cortisol feedback drives sustained ACTH secretion, which both
    enlarges the adrenal cortex and pushes precursor flux down the one branch
    CYP17A1 does not gate.
  evidence:
  - reference: PMID:42427966
    reference_title: "Be alert to hypertension caused by 17α-hydroxylase deficiency: two case reports in young patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory investigations showed markedly elevated adrenocorticotropic
      hormone (ACTH) levels, significantly decreased cortisol levels and a
      disrupted circadian rhythm.
    explanation: >-
      Documents the high ACTH with low cortisol pattern this node asserts.
  downstream:
  - target: Adrenal Cortical Hyperplasia
    description: Chronic ACTH stimulation drives cortical growth.
  - target: Deoxycorticosterone and Corticosterone Accumulation
    description: >-
      ACTH drive is applied to the mineralocorticoid branch, which CYP17A1 loss
      leaves open.
- name: Adrenal Cortical Hyperplasia
  biological_scale: TISSUE
  description: >-
    Sustained ACTH stimulation enlarges the adrenal cortex and, over years, can
    produce nodules and adenomas.
  locations:
  - preferred_term: adrenal cortex
    term:
      id: UBERON:0001235
      label: adrenal cortex
  evidence:
  - reference: PMID:40725971
    reference_title: "Three misdiagnoses before a final diagnosis of 17α-hydroxylase/17,20-lyase deficiency: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Enhanced adrenal computed tomography showed right adrenal hyperplasia with
      multiple nodules, likely adenoma.
    explanation: >-
      Imaging evidence of the nodular adrenal hyperplasia that follows chronic
      ACTH drive in this disorder.
  downstream:
  - target: Congenital adrenal hyperplasia
    description: The adrenal enlargement that names this disease family.
- name: Deoxycorticosterone and Corticosterone Accumulation
  biological_scale: ORGANISM
  description: >-
    With the 17-alpha-hydroxylase step blocked, ACTH driven precursor flux is
    diverted into the mineralocorticoid branch, raising 11-deoxycorticosterone
    and corticosterone. Both have mineralocorticoid activity, as do their
    18-hydroxylated products.
  biological_processes:
  - preferred_term: mineralocorticoid biosynthetic process
    term:
      id: GO:0006705
      label: mineralocorticoid biosynthetic process
    modifier: INCREASED
  chemical_entities:
  - preferred_term: 11-deoxycorticosterone
    term:
      id: CHEBI:16973
      label: 11-deoxycorticosterone
    modifier: INCREASED
  - preferred_term: corticosterone
    term:
      id: CHEBI:16827
      label: corticosterone
    modifier: INCREASED
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activation of the HPA axis also drives increased production of the
      corticosterone precursor, 11-deoxycorticosterone (DOC), a weak
      mineralocorticoid
    explanation: >-
      Names the two accumulating steroids and the ACTH drive that produces them.
  - reference: PMID:24498484
    reference_title: "Congenital Adrenal Hyperplasia due to 17-alpha-hydoxylase/17,20-lyase Deficiency Presenting with Hypertension and Pseudohermaphroditism: First Case Report from Oman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      high levels of mineralocorticoids precursors (11-deoxycorticosterone and
      corticosterone) with high levels of ACTH, FSH and LH
    explanation: >-
      Measured elevation of both steroids in a patient, alongside the high ACTH
      that drives them.
  downstream:
  - target: Mineralocorticoid Receptor Overactivation
    description: >-
      Accumulated weak mineralocorticoids reach concentrations sufficient to
      occupy the receptor.
- name: Mineralocorticoid Receptor Overactivation
  biological_scale: ORGANISM
  description: >-
    Excess 11-deoxycorticosterone and corticosterone drive renal sodium
    retention and potassium wasting, raising blood pressure and lowering serum
    potassium. About one in ten patients with severe disease nonetheless remain
    normotensive and normokalemic, so compensation is variable.
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      about 10% of patients with severe 17OHD are normokalaemic and normotensive
    explanation: >-
      Records the incomplete penetrance of the mineralocorticoid consequences,
      which this node's description qualifies.
  - reference: PMID:29144824
    reference_title: "17α-HYDROXYLASE DEFICIENCY IS AN UNDERDIAGNOSED DISEASE: HIGH FREQUENCY OF MISDIAGNOSES IN A LARGE COHORT OF BRAZILIAN PATIENTS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially, 38 (95%) patients had hypertension, and 75% had hypokalemia"
    explanation: >-
      Quantifies how often the two mineralocorticoid consequences are present,
      in a cohort of 40 patients.
  downstream:
  - target: Hypertension
    description: Sodium retention and volume expansion raise blood pressure.
  - target: Hypokalemia
    description: Mineralocorticoid driven renal potassium wasting.
  - target: Renin and Aldosterone Suppression
    description: >-
      The volume expansion suppresses the renin angiotensin aldosterone system.
- name: Renin and Aldosterone Suppression
  biological_scale: ORGANISM
  description: >-
    Volume expansion from the accumulated weak mineralocorticoids suppresses
    renin release and, downstream of it, aldosterone. Low renin with
    hypertension is the pattern that distinguishes this disorder from most
    other causes of hypertension in a young patient.
  evidence:
  - reference: PMID:34524979
    reference_title: "The broad phenotypic spectrum of 17α-hydroxylase/17,20-lyase (CYP17A1) deficiency: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This tends to suppress the renin-angiotensin-aldosterone system via blood
      pressure increase and hypokalaemia
    explanation: >-
      States the suppression of renin and aldosterone by the accumulated
      mineralocorticoids.
  downstream:
  - target: Decreased circulating renin concentration
    description: Direct consequence of volume driven suppression.
  - target: Decreased circulating aldosterone concentration
    description: Aldosterone falls with renin, despite the mineralocorticoid excess.
- name: Sex Steroid Synthesis Failure
  biological_scale: CELLULAR
  description: >-
    Loss of 17,20-lyase activity blocks C19 steroid production in the adrenal
    and the gonad, so neither androgens nor the estrogens made from them can be
    synthesized. In 46,XY fetuses the testis cannot make testosterone during
    the window when external genitalia masculinize.
  biological_processes:
  - preferred_term: androgen biosynthetic process
    term:
      id: GO:0006702
      label: androgen biosynthetic process
    modifier: DECREASED
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  evidence:
  - reference: PMID:24498484
    reference_title: "Congenital Adrenal Hyperplasia due to 17-alpha-hydoxylase/17,20-lyase Deficiency Presenting with Hypertension and Pseudohermaphroditism: First Case Report from Oman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive laboratory workup revealed low levels of serum cortisol (and its
      precursors 17α-hydroxyprogesterone and 11-deoxycortisol), adrenal
      androgens (dehydroepiandrosterone sulfate and androstenedione), and
      estrogen (estradiol)
    explanation: >-
      Measured deficiency of adrenal androgens and estradiol alongside the
      cortisol deficit.
  downstream:
  - target: Hypergonadotropic Gonadotropin Drive
    description: >-
      Absent sex steroid negative feedback releases pituitary LH and FSH
      secretion.
  - target: Decreased serum testosterone concentration
    description: Direct consequence of the blocked C19 steroid pathway.
  - target: Female external genitalia in individual with 46,XY karyotype
    description: >-
      Absent fetal testicular testosterone during the masculinization window.
  - target: Absence of pubertal development
    description: >-
      Neither adrenal nor gonadal sex steroids are available to drive puberty.
  - target: Delayed skeletal maturation
    description: Sex steroids are required for normal skeletal maturation.
- name: Hypergonadotropic Gonadotropin Drive
  biological_scale: ORGANISM
  description: >-
    Loss of sex steroid feedback raises LH and FSH. Sustained gonadotropin
    stimulation of ovaries that cannot complete steroidogenesis produces
    recurrent ovarian cysts in 46,XX individuals.
  evidence:
  - reference: PMID:21340157
    reference_title: "Six new cases confirm the clinical molecular profile of complete combined 17α-hydroxylase/ 17,20-lyase deficiency in Brazil."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients presented hypergonadotrophic hypogonadism, with high levels
      of ACTH
    explanation: >-
      Documents hypergonadotropic hypogonadism as a uniform feature of the
      complete form.
  downstream:
  - target: Increased circulating gonadotropin level
    description: Direct consequence of absent sex steroid feedback.
  - target: Ovarian cyst
    description: >-
      Chronic luteinizing hormone stimulation of ovaries that cannot complete
      steroidogenesis.
  - target: Primary amenorrhea
    description: >-
      Absent estrogen means the endometrium is never driven to proliferate and
      shed.

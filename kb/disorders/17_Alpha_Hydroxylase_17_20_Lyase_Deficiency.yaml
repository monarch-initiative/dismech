name: 17-Alpha-Hydroxylase/17,20-Lyase Deficiency
creation_date: "2026-11-07T06:10:00Z"
category: Mendelian
description: >-
  17-alpha-hydroxylase/17,20-lyase deficiency (17-OHD) is a rare autosomal
  recessive form of congenital adrenal hyperplasia caused by biallelic
  loss of function variants in CYP17A1. The single CYP17A1 polypeptide carries
  two activities, and losing both blocks cortisol synthesis and sex steroid
  synthesis at once while leaving the mineralocorticoid branch intact. ACTH
  rises in response to the cortisol deficit and drives the unblocked branch,
  so 11-deoxycorticosterone and corticosterone accumulate and act on the
  mineralocorticoid receptor. The result is the characteristic triad of
  hypokalemic hypertension with suppressed renin and aldosterone, absent or
  incomplete pubertal development, and adrenal hyperplasia. In 46,XY
  individuals the fetal testis cannot make testosterone, so external genitalia
  are female or undervirilized; in 46,XX individuals puberty typically fails.
  Severity tracks residual enzyme activity rather than genotype class alone,
  and partial alleles produce a mild end of the spectrum compatible with
  spontaneous menstruation and, rarely, fertility.
disease_term:
  preferred_term: congenital adrenal hyperplasia due to 17-alpha-hydroxylase deficiency
  term:

genetic:
- name: CRB1
  features: >-
    CRB1 encodes Crumbs homolog 1, a transmembrane protein with 19 EGF-like
    domains, 3 laminin A globular-like domains, and a cytoplasmic domain with FERM
    and PDZ binding motifs. Over 150 pathogenic variants have been reported, with
    missense mutations constituting 66% and exons 7 and 9 being most frequently
    mutated. The p.Cys948Tyr variant in exon 9 is the most common (24% of known
    CRB1 mutations). Null variants are enriched in EOSRD/LCA, but genotype-phenotype
    correlation is limited by modifier effects. Exon position matters because it
    determines which retinal isoforms a variant disrupts: exon 6, 7 and 9 variants
    affect both CRB1-A and CRB1-B and track with LCA/EOSRD and RP, whereas exon 2
    variants - notably the in-frame deletion c.498_506del p.(Ile167_Gly169del) -
    affect CRB1-A only and track with macular dystrophy. The exon-7 missense
    c.2506C>A p.(Pro836Thr) is the common variant of Black African ancestry, at
    0.329% allele frequency in African populations in gnomAD v4.1.0.
  gene_term:
    preferred_term: CRB1
    term:
      id: hgnc:2343
      label: CRB1
  association: Causative
  evidence:
  - reference: PMID:22065545
    reference_title: "CRB1 mutations in inherited retinal dystrophies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the CRB1 gene are associated with variable phenotypes of severe retinal dystrophies, ranging from leber congenital amaurosis (LCA) to rod-cone dystrophy, also called retinitis pigmentosa (RP)."
    explanation: Comprehensive review establishing CRB1 as the causal gene for the spectrum of retinal dystrophies.
  - reference: PMID:22065545
    reference_title: "CRB1 mutations in inherited retinal dystrophies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This meta-analysis suggests that the differential phenotype of patients with CRB1 mutations is due to additional modifying factors rather than particular mutant allele combination."
    explanation: Confirms CRB1 causality while noting phenotypic variability is driven by modifiers beyond allele type.
  - reference: PMID:12915475
    reference_title: "CRB1 is essential for external limiting membrane integrity and photoreceptor morphogenesis in the mammalian retina."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Photoreceptor dysplasia and degeneration in Crb1 mutants strongly vary with genetic background, suggesting that the variability in phenotypes of human patients that carry mutations in CRB1 may be due to interactions with background modifiers in addition to allelic variations."
    explanation: Mouse model confirms CRB1 as causal and supports the role of background modifiers in phenotypic variability.
  - reference: PMID:22065545
    reference_title: "CRB1 mutations in inherited retinal dystrophies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently occurring of the known mutations is the p.Cys948Tyr in exon 9 (96 alleles reported, 24% of known CRB1 mutations)"
    explanation: Directly supports p.Cys948Tyr in exon 9 as the single most common CRB1 variant, accounting for 24% of known mutations.
  - reference: PMID:22065545
    reference_title: "CRB1 mutations in inherited retinal dystrophies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense mutations constitute 66% of all known mutations, the remaining being frameshift, truncation and splice site mutations."
    explanation: Supports the mutation-class distribution stated in the features summary, with missense variants constituting 66% of known CRB1 mutations.
  - reference: PMID:41626423
    reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in exons 6, 7, and 9 were associated to LCA/EOSRD and RP phenotypes, whereas exon 2 variants were linked to MD."
    explanation: >-
      Supports the exon-position-to-phenotype correlation stated in the features
      summary, from 389 patients across 50 cohorts.
  - reference: PMID:40590804
    reference_title: "A Phenotypic Study of CRB1 Retinopathy Secondary to the Variant p.(Pro836Thr) Prevalent in Those of Black African Ancestry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In African populations, this variant has an allele frequency of 0.329% (gnomAD v4.1.0)."
    explanation: >-
      Directly supports the stated African-population allele frequency for
      p.(Pro836Thr).
discussions:
- discussion_id: crb1_isoform_b_severity_conflict
  prompt: >-
    Does preserved photoreceptor CRB1-B actually attenuate CRB1 retinopathy, or
    is the association with macular-limited disease carried entirely by which
    CRB1-A variants happen to spare it?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#crb1b_sparing_attenuates
  - pathophysiology#Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
  rationale: >-
    Three cohorts have scored the same variable and disagree. Two recent series
    (n=75 and n=389) find wild-type CRB1-B enriched in macular-limited disease
    and CRB1-A-only variants associated with macular dystrophy. An earlier series
    (n=50) scored predicted isoform dosage patient by patient and found the
    opposite: it reports patients with fully preserved isoform B who nonetheless
    had early-onset retinal dystrophy, and patients with the macular c.498_506del
    variant who developed macular dystrophy irrespective of isoform-B status.
    The disagreement is not merely one of cohort size, because the alternative
    reading is confounding rather than noise: the exon-2 variants that spare
    CRB1-B are also the mildest CRB1-A lesions, so isoform-B preservation may be
    a marker of a mild CRB1-A allele rather than a protective factor in its own
    right. All three cohorts report predicted, not measured, isoform dosage.
  evidence:
  - reference: PMID:34884448
    reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, all patients with the specific c.498_506del macular variant developed a macular dystrophy regardless of the impact on isoform B."
    explanation: >-
      The observation on which the dissenting cohort rests: within carriers of
      the macular variant, isoform-B status made no difference.
  - reference: PMID:41358656
    reference_title: "Detailed Comparison Between Two Main Phenotypes of CRB1-Related Retinal Dystrophy, Pan-retinopathy and Maculopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with biallelic loss-of-function variants were significantly more prevalent in the pan-retinopathy group (40.3%) than in the maculopathy group (7.1%) (P = 0.03)."
    explanation: >-
      Shows that allele severity itself also separates the two groups, which is
      the confound the isoform claim has to be disentangled from.
  proposed_experiments:
  - experiment_id: crb1_isoform_dosage_organoid_series
    name: Measured isoform dosage in patient iPSC-derived retinal organoids stratified by phenotype
    description: >-
      Derive retinal organoids from patients matched for predicted CRB1-A lesion
      severity but differing in whether CRB1-B is spared, and quantify CRB1-A and
      CRB1-B transcript and protein directly instead of predicting them from exon
      position. Score outer limiting membrane integrity and photoreceptor
      lamination.
    would_support:
    - pathophysiology#Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
    supporting_outcome:
    - >-
      Among patients matched on CRB1-A lesion severity, those retaining measured
      CRB1-B protein show better preserved outer limiting membrane and lamination
      than those who do not.
    refuting_outcome:
    - >-
      Organoid phenotype tracks with measured CRB1-A dosage alone, with no
      residual effect of CRB1-B once CRB1-A severity is matched.
- discussion_id: crb1_isoform_hierarchy_mouse_versus_human
  prompt: >-
    Mouse work makes Crb1-B the essential isoform while human cohorts make CRB1-A
    the essential one - is that a real species difference, or an artefact of what
    human sequencing panels can see?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
  - mechanistic_hypotheses#crb1a_muller_glial_primacy
  rationale: >-
    Isoform-selective mouse alleles put Crb1-B in the primary role: retinal
    anomalies develop in the mouse even when Crb1-A is normal. Human cohorts
    invert this, reporting that CRB1-A is universally affected and appears to
    drive severity. The mismatch cannot currently be resolved on the human side,
    because diagnostic sequencing panels do not cover the promoter and terminal
    exons unique to the CRB1-B transcript, so a human counterpart of the
    isoform-B-selective mouse genotype would not be detected even if it existed.
    The human evidence for CRB1-A primacy is therefore ascertainment-limited, and
    the apparent species difference should not be treated as established until
    panels are redesigned. This directly conditions how mouse rescue data should
    be read when selecting an isoform for gene-supplementation therapy.
  evidence:
  - reference: PMID:34884448
    reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Based on the characterization of the previously known and novel models, Ray et al. stated that, in mice, Crb1-B is essential and predominant, as retinal anomalies can develop even when Crb1-A is strictly normal."
    explanation: >-
      States the mouse hierarchy that the human data invert.
  - reference: PMID:34884448
    reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A human phenotype equivalent to the Crb1delB/null or Crb1delB/delB mouse models has never been reported"
    explanation: >-
      The specific human observation that is missing, and which the panel gap
      explains.
  - reference: PMID:41626423
    reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had variants affecting CRB1-A, with none exclusively affecting CRB1-B."
    explanation: >-
      The human observation whose interpretation is at stake: universal CRB1-A
      involvement is consistent both with CRB1-A necessity and with CRB1-B-only
      genotypes being invisible to the assay.
  proposed_experiments:
  - experiment_id: crb1b_specific_region_resequencing
    name: Resequence CRB1-B-specific promoter and terminal exons in unsolved and monoallelic CRB1 cases
    description: >-
      Extend retinal gene panels to the CRB1-B-specific promoter and 5-prime and
      3-prime exons, then re-screen patients carrying a single CRB1 variant and
      patients with unsolved inherited retinal dystrophy.
    would_refute:
    - mechanistic_hypotheses#crb1a_muller_glial_primacy
    supporting_outcome:
    - >-
      Patients with biallelic variants confined to CRB1-B-specific regions are
      identified, showing the human hierarchy was an ascertainment artefact.
    refuting_outcome:
    - >-
      No biallelic CRB1-B-exclusive genotypes are found after adequate coverage,
      strengthening CRB1-A involvement as a genuine necessary condition.
- discussion_id: crb1_macular_dystrophy_mechanism_unmodelled
  prompt: >-
    By what mechanism do CRB1-A-specific variants such as c.498_506del produce
    macular-restricted rather than generalised retinal disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Macular dystrophy
  - pathophysiology#Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
  rationale: >-
    The genotype-phenotype association is now replicated and strong, but no
    mechanism connects it to a macular topography. The gap is a model gap rather
    than a data gap: there is no mouse carrying the equivalent in-frame deletion
    and, at the time of the largest series, no macular-dystrophy CRB1 induced
    pluripotent stem cell line was available. Structural prediction suggests the
    deletion destabilises two adjacent EGF-like modules, but that does not
    explain why the consequence is confined to the macula.
  evidence:
  - reference: PMID:41626423
    reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the precise mechanism by which these variants lead to MD remains unclear, largely because of the absence of corresponding mouse models or MD-CRB1 induced pluripotent stem cell lines for further investigation."
    explanation: >-
      States the gap and its cause - the absent model systems - in the authors'
      own words.
  - reference: PMID:34884448
    reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the lack of a corresponding mouse model, the mechanism of this variant is not clearly known."
    explanation: >-
      The same gap identified independently four years earlier for the
      c.498_506del variant specifically.
- discussion_id: crb1_subtype_axis_under_review
  prompt: >-
    Should this entry keep the flat LCA8 / RP12 / macular dystrophy split, or
    move to the pan-retinopathy versus maculopathy axis used by the newer
    literature?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - has_subtypes#
  rationale: >-
    The three subtypes here follow the phenotypic diagnoses assigned in a single
    104-patient cohort, and all three subtype frequencies come from one sentence
    in it. Two later series reorganise the same disease along a different axis:
    a 75-patient cohort treats pan-retinopathy and maculopathy as the two primary
    phenotypes and calls them distinct entities, which collapses LCA8 and RP12
    into severity poles of one branch while setting maculopathy apart on genetic
    grounds; a 389-patient reclassification under standardised criteria adds
    cone-rod dystrophy as a fourth phenotype. A counterweight is that in one
    p.(Pro836Thr) series, imaging that looked macula-confined sat on top of
    generalised photoreceptor dysfunction on electrophysiology, so a
    structurally-defined maculopathy category may not be as clean as it appears.
    Restructuring has_subtypes would also strand the LCA8 and RP12 MONDO
    groundings, which are the two mappings in this entry that are unambiguously
    correct. The decision, together with the entry-level disease_term question,
    is reserved for the maintainer in issue 8997 and is deliberately not taken
    here; this discussion records the evidence so the choice is not re-derived
    from scratch.
  evidence:
  - reference: PMID:41358656
    reference_title: "Detailed Comparison Between Two Main Phenotypes of CRB1-Related Retinal Dystrophy, Pan-retinopathy and Maculopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study establishes CRB1-associated pan-retinopathy and maculopathy as clinically and genetically distinct entities."
    explanation: >-
      The competing two-way nosology, asserted on combined clinical and genetic
      grounds.
  - reference: PMID:40590804
    reference_title: "A Phenotypic Study of CRB1 Retinopathy Secondary to the Variant p.(Pro836Thr) Prevalent in Those of Black African Ancestry."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although retinal imaging may show alterations confined to the macular region, electrophysiology in this series indicates generalized cone and rod photoreceptor dysfunction."
    explanation: >-
      Cautions against reifying a maculopathy category from imaging, since
      function was generalised in the same patients.
review_notes: >-
  Modeled as a shared-mechanism umbrella because CRB1 loss-of-function produces a
  continuum of retinal dystrophy severity unified by outer limiting membrane
  disruption and abnormal retinal lamination. No broader CRB1-specific MONDO class
  exists, so MONDO:0013453 (Leber congenital amaurosis 8) is used as the root
  disease_term with preferred_term matching the MONDO label; the umbrella concept
  name lives in the entry name field. RP12 (MONDO:0010818) and hereditary macular
  dystrophy (MONDO:0020242) are subtypes. Pigmented paravenous atrophy association
  with CRB1 has limited evidence and questionable pathogenicity and is noted but
  not elevated to a subtype.

  Two mapping decisions recorded here are contested in issue 8997 and are left
  untouched pending a maintainer ruling, not endorsed by this pass. First, the
  entry-level disease_term is MONDO:0013453, which is also the LCA8 subtype term,
  so the spectrum is grounded to one branch of itself; the three subtype terms
  sit under three different MONDO parents, so no subtype term can serve as the
  spectrum root, and MONDO has no CRB1-spectrum class. Second, the macular
  dystrophy subtype is grounded to the generic, non-gene-restricted
  MONDO:0020242. Regrounding, unsetting disease_term, or restructuring
  has_subtypes along the pan-retinopathy versus maculopathy axis are all
  deferred; see the crb1_subtype_axis_under_review discussion for the evidence
  bearing on the third.

  The isoform layer added in 2026 is deliberately modelled as one upstream
  pathophysiology node plus two mechanistic_hypotheses rather than folded into
  the existing outer-limiting-membrane node, because the two claims have very
  different support: CRB1-A involvement being necessary is unanimous across
  cohorts, whereas CRB1-B sparing being protective is contradicted by one of the
  three cohorts that measured it.

mechanistic_hypotheses:
- hypothesis_group_id: crb1a_muller_glial_primacy
  hypothesis_label: Muller-glial CRB1-A loss is the necessary lesion in human disease
  status: CANONICAL
  description: >-
    Human disease requires the Muller-glial isoform to be hit. No patient has yet
    been reported whose variants affect CRB1-B alone, and a cohort reappraisal
    that scored predicted isoform dosage per patient concluded that severity
    tracks with the CRB1-A lesion. On this model the outer limiting membrane
    fails from the glial side, and the photoreceptor isoform modifies the
    picture rather than initiating it.
  evidence:
  - reference: PMID:41626423
    reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Crumbs homolog 1-A must be affected for disease manifestation, while sparing of CRB1-B leads to milder phenotypes."
    explanation: >-
      States the necessity claim directly, from the largest CRB1 genotype series
      to date.
  - reference: PMID:34884448
    reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, the retinal degeneration appears early, and the phenotype is mainly driven by the Müller cell isoform A impairment."
    explanation: >-
      Independent cohort assigning the severity-determining role to the
      Muller-cell isoform in humans.
- hypothesis_group_id: crb1b_sparing_attenuates
  hypothesis_label: Preserved photoreceptor CRB1-B attenuates disease to macular-limited dystrophy
  status: EMERGING
  description: >-
    A second, contested claim: beyond requiring CRB1-A to be hit, the phenotype
    is graded by whether CRB1-B survives. Two recent cohorts find preserved
    wild-type CRB1-B enriched in macular-limited disease and CRB1-A-only variants
    associated with macular dystrophy. An earlier cohort that scored the same
    variable reached the opposite conclusion, so this is curated as emerging
    rather than settled - see the crb1_isoform_b_severity_conflict discussion.
  evidence:
  - reference: PMID:41358656
    reference_title: "Detailed Comparison Between Two Main Phenotypes of CRB1-Related Retinal Dystrophy, Pan-retinopathy and Maculopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of patients harboring biallelic variants expressing wild-type CRB1-B was significantly higher in the maculopathy group (30.8%) than in the pan-retinopathy group (8.1%)."
    explanation: >-
      Direct cohort support for CRB1-B preservation grading the phenotype toward
      macular-limited disease.
  - reference: PMID:41626423
    reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations specific to CRB1-A, sparing CRB1-B were associated with MD."
    explanation: >-
      Replicates the association between CRB1-B sparing and macular dystrophy at
      n=389 across 50 cohorts.
  - reference: PMID:34884448
    reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The CRB1 isoform B has no impact on the severity of the phenotype as EORD, RP and macular dystrophy can occur regardless of the level of isoform B"
    explanation: >-
      A 50-patient cohort that scored predicted isoform-B dosage per patient
      found no severity effect, directly contradicting this hypothesis.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    CRB1-associated retinal dystrophies follow autosomal recessive inheritance.
    Biallelic pathogenic variants (two mutant alleles in trans) are required for
    disease manifestation. Over 150 CRB1 sequence variants have been reported in
    more than 240 patients.
  evidence:
  - reference: PMID:22065545
    reference_title: "CRB1 mutations in inherited retinal dystrophies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the CRB1 gene are associated with variable phenotypes of severe retinal dystrophies, ranging from leber congenital amaurosis (LCA) to rod-cone dystrophy, also called retinitis pigmentosa (RP)."
    explanation: This meta-analysis of CRB1 mutations confirms the autosomal recessive inheritance pattern across the retinal dystrophy spectrum.
pathophysiology:
- name: Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
  biological_scale: MOLECULAR
  description: >-
    CRB1 is transcribed in the retina as two major isoforms occupying different
    cells. The canonical 12-exon CRB1-A is expressed in Muller glia and is the
    predominant isoform during retinal development; the shorter CRB1-B is
    expressed in photoreceptors and is the more abundant isoform in the adult
    retina. Both reach the outer limiting membrane from opposite sides of the
    same junction. Because a variant's exon position determines which transcripts
    it disrupts, one gene produces cell-type-partitioned lesions rather than a
    single uniform loss: exon 6, 7 and 9 variants hit both isoforms, whereas exon
    2 variants such as c.498_506del p.(Ile167_Gly169del) affect CRB1-A only and
    leave CRB1-B intact. In the largest genotype series assembled to date every
    patient carried a variant affecting CRB1-A and none was CRB1-B-exclusive, so
    CRB1-A involvement appears necessary for disease.
  gene:
    preferred_term: CRB1
    modifier: DECREASED
    term:
      id: hgnc:2343
      label: CRB1
  cell_types:
  - preferred_term: Mueller cell
    term:
      id: CL:0000636
      label: Mueller cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  notes: >-
    No biological-process term is bound here on purpose. The two isoforms arise
    from distinct promoters rather than from regulated alternative splicing, so
    the GO splicing-regulation terms would misdescribe the mechanism, and GO has
    no term for isoform-partitioned expression across two cell types.
  downstream:
  - target: Loss of CRB1 at the outer limiting membrane
    causal_link_type: DIRECT
    hypothesis_groups:
    - crb1a_muller_glial_primacy
    description: >-
      Whichever isoform is disrupted, the lesion is delivered to the same
      structure: CRB1-A and CRB1-B are both present at the outer limiting
      membrane, on the Muller-cell and photoreceptor sides of the adherens
      junctions respectively.
    evidence:
    - reference: PMID:34884448
      reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These cell-surface proteins are both present at the level of the outer limiting membrane (OLM), which is formed by the adherens junctions between the adjacent Müller cells and photoreceptors, creating a distinct barrier between the neural retina and the inner/outer segments."
      explanation: >-
        Places both isoform products at the outer limiting membrane, which is why
        the isoform-partitioned lesion converges on a single structural node.
    - reference: PMID:34884448
      reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All these models indicate that the lack of one or both isoforms induces OLM changes with loss of photoreceptor-Müller cell contacts combined with structural changes in both cell types."
      explanation: >-
        Isoform-selective mouse models show that losing either isoform alone is
        sufficient to produce outer limiting membrane changes.
  - target: Macular dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - crb1b_sparing_attenuates
    description: >-
      Proposed route to the macular-limited end of the spectrum: when the variant
      combination leaves photoreceptor CRB1-B intact, the retained adult-retina
      isoform is held to limit the lesion to the macula. The intermediate steps
      between preserved CRB1-B and macular-restricted degeneration are not known,
      and this edge belongs to an emerging hypothesis that one cohort contradicts.
    evidence:
    - reference: PMID:41358656
      reference_title: "Detailed Comparison Between Two Main Phenotypes of CRB1-Related Retinal Dystrophy, Pan-retinopathy and Maculopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The proportion of patients harboring biallelic variants expressing wild-type CRB1-B was significantly higher in the maculopathy group (30.8%) than in the pan-retinopathy group (8.1%)."
      explanation: >-
        Quantifies the enrichment of preserved CRB1-B in the macular-limited
        group relative to pan-retinopathy in a 75-patient cohort.
    - reference: PMID:41626423
      reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations specific to CRB1-A, sparing CRB1-B were associated with MD."
      explanation: >-
        Independently associates CRB1-A-only variants with the macular dystrophy
        phenotype in a 389-patient multi-cohort series.
  evidence:
  - reference: PMID:41626423
    reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Crumbs homolog 1-A is primarily expressed in Müller cells and plays a vital role in retinal development, whereas CRB1-B, expressed in photoreceptors, helps maintain long-term retinal integrity in adult retinas."
    explanation: >-
      Establishes the cell-type assignment of the two isoforms and their
      differing developmental versus maintenance roles.
  - reference: PMID:34884448
    reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CRB1-A is localized to the apical tips of Müller cells and CRB1-B in the inner and outer segments with a gradient"
    explanation: >-
      Gives the subcellular localisation of each isoform, on either side of the
      outer limiting membrane.
  - reference: PMID:34884448
    reference_title: "CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CRB1-A is the predominant isoform during developmental stages. By contrast, CRB1-B is by far the most abundant isoform in the adult human, as well as murine retina."
    explanation: >-
      Supports the developmental versus adult division of labour between the two
      isoforms.
  - reference: PMID:41626423
    reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had variants affecting CRB1-A, with none exclusively affecting CRB1-B."
    explanation: >-
      Across 389 patients from 50 cohorts, CRB1-A involvement was universal,
      supporting it as a necessary condition for disease.
  - reference: PMID:41626423
    reference_title: "Novel Genotype-Phenotype Correlations in CRB1-Retinopathies: Insights from Isoforms and Protein Domains Linked to Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in exons 6, 7, and 9 were associated to LCA/EOSRD and RP phenotypes, whereas exon 2 variants were linked to MD."
    explanation: >-
      Shows that exon position, which determines isoform involvement, tracks with
      the clinical phenotype.
- name: Loss of CRB1 at the outer limiting membrane
  description: >-
    CRB1 localizes to the apical membrane of photoreceptors and Muller glial cells
    at the outer limiting membrane (OLM), where it maintains adherens junction
    integrity and cell polarity. Biallelic loss-of-function variants disrupt this
    structural scaffold, creating the shared proximal defect across the CRB1
    disease family.

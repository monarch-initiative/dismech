inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All three reported patients are homozygous for a DAND5 frameshift variant
    and were born to consanguineous parents. In the one family with full
    segregation, both parents and three further relatives were heterozygous and
    unaffected, and an unaffected sibling was homozygous wild-type.
  evidence:
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This work strengthens the genetic and functional evidence for biallelic
      LoF variants in DAND5 causing an autosomal recessive heterotaxy syndrome.
    explanation: >-
      A second unrelated homozygous patient, with functional data, supports
      recessive inheritance.
  - reference: PMID:42650045
    reference_title: >-
      Further Support for Association of DAND5 with Autosomal Recessive
      Laterality Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Family 2, segregation analysis demonstrated heterozygosity in both
      parents, aunt, uncle and cousin, whereas the sibling was homozygous
      wild-type.
    explanation: >-
      Segregation in a consanguineous family is consistent with autosomal
      recessive inheritance, with unaffected heterozygous relatives.
genetic:
- name: DAND5
  gene_term:
    preferred_term: DAND5
    term:
      id: hgnc:26780
      label: DAND5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    DAND5 (19p13.13) has two coding exons and encodes a secreted protein whose
    C-terminal cysteine-knot DAN domain binds Nodal. The two disease alleles
    reported to date are homozygous frameshifts: c.197del (p.Leu66ArgfsTer22)
    in exon 1, upstream of the DAN domain and predicted to undergo
    nonsense-mediated decay, and c.396_397dup (p.Tyr133SerfsTer11) in exon 2,
    predicted to escape decay and yield a protein lacking the DAN domain. The
    gene is not constrained against loss-of-function or missense variation in
    the general population, which is consistent with recessive rather than
    dominant disease.
  notes: >-
    No ClinGen gene-disease validity assertion for DAND5 and this disease was
    found in the committed ClinGen cache, so gene_disease_validity is left
    unset. The evidence base is three patients; the 2026 report describes its
    own findings as preliminary.
  evidence:
  - reference: PMID:34215651
    reference_title: >-
      Whole-exome sequencing reveals a monogenic cause in 56% of individuals
      with laterality disorders and associated congenital heart defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, we detected a homozygous disease causing mutation in DAND5,
      as a novel recessive monogenic cause for heterotaxy in humans.
    explanation: >-
      First report of a homozygous truncating DAND5 variant in a patient with
      heterotaxy, from an exome study of a consanguineous laterality cohort.
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a second unrelated individual with heterotaxy syndrome
      and a homozygous frameshift variant in DAND5
      (NM_152654.2:c.197del [p.Leu66ArgfsTer22]).
    explanation: >-
      Independent replication in an unrelated family with a different
      frameshift allele.
  - reference: PMID:42650045
    reference_title: >-
      Further Support for Association of DAND5 with Autosomal Recessive
      Laterality Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings support an association between biallelic loss-of-function
      DAND5 variants and laterality-related CHD in two unrelated families,
      bringing the total number of patients reported in the medical literature
      thus far to three.
    explanation: >-
      A second family homozygous for the first-reported allele; the report
      counts three patients in total, because its first proband is the patient
      already described in the 2022 exome cohort.
variants:
- name: DAND5 c.197del (p.Leu66ArgfsTer22)
  description: >-
    Homozygous frameshift in exon 1 found in a girl of Gambian descent born to
    first-cousin parents. It truncates DAND5 before the DAN domain and, in a
    Nodal-dependent reporter assay, the variant construct failed to inhibit
    Nodal signaling.
  gene:
    preferred_term: DAND5
    term:
      id: hgnc:26780
      label: DAND5
  identifiers:
  - "NM_152654.2:c.197del"
  evidence:
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpression of the c.197del variant was unable to inhibit nodal and
      resulted in a complete loss of function when compared with the wild-type
      protein
    explanation: >-
      Cell-based reporter assay showing the patient allele has lost Nodal
      inhibitory activity.
- name: DAND5 c.396_397dup (p.Tyr133SerfsTer11)
  description: >-
    Homozygous frameshift in exon 2 found in two unrelated children of
    Arab-Muslim descent from consanguineous families. It is predicted to escape
    nonsense-mediated decay and produce a protein lacking the DAN domain; this
    has not been tested experimentally. It was reclassified as likely
    pathogenic after the second family was found.
  gene:

  - reference: PMID:19906859
    reference_title: >-
      Reversal of left-right asymmetry induced by aberrant Nodal signaling in
      the node of mouse embryos.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In inv/inv embryos, however, a localized reduction in the level of Cerl2
      expression results in upregulation of the Nodal signal and a consequent
      induction of Lefty expression in the node.
    explanation: >-
      Reducing Cerl2 at the node raises Nodal signaling there.
    directness: INDIRECT
  - reference: PMID:34903892
    reference_title: >-
      Discovery of a genetic module essential for assigning left-right
      asymmetry in humans and ancestral vertebrates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In zebrafish and Xenopus, CIROP is required solely on the left side,
      downstream of the leftward flow, but upstream of DAND5, the first
      asymmetrically expressed gene.
    explanation: >-
      Places DAND5 as the first asymmetrically expressed gene, downstream of

name: Visceral Heterotaxy 13
creation_date: "2026-10-20T19:17:31Z"
category: Mendelian
disease_term:
  preferred_term: heterotaxy, visceral, 13, autosomal
  term:
    id: MONDO:0976134
    label: heterotaxy, visceral, 13, autosomal
synonyms:
- HTX13
- DAND5-related heterotaxy
- DAND5-related laterality disorder
- autosomal recessive DAND5-related heterotaxy
description: >-
  Visceral heterotaxy 13 (HTX13) is an ultra-rare autosomal recessive laterality
  disorder caused by biallelic loss-of-function variants in DAND5 (also known as
  CERL2, and as Coco in Xenopus and Charon in zebrafish), which encodes a
  secreted Cerberus/DAN-family antagonist that binds and sequesters Nodal. At
  the embryonic left-right organizer DAND5 is expressed more strongly on the
  right; cilia-driven leftward flow degrades Dand5 mRNA on the left, which
  releases Nodal there and biases the Nodal cascade to the left lateral plate
  mesoderm. Without DAND5 the organizer loses this bias, Nodal signaling in the
  lateral plate is randomized, and visceral and cardiac situs become
  unpredictable. Three affected children from three consanguineous families have
  been reported, all homozygous for frameshift alleles that remove or disrupt
  the DAN domain, all with heterotaxy and complex congenital heart disease
  (atrioventricular canal defect, pulmonary atresia or stenosis, anomalous
  pulmonary venous return, tetralogy of Fallot) together with variable splenic,
  hepatic, gastric and intestinal laterality anomalies. Developmental delay was
  reported in the two surviving children. The ciliary axoneme is intact, so
  airway and sperm motility disease are not expected. Earlier reports of a
  heterozygous missense variant (p.Arg152His) in patients with congenital heart
  disease are not part of this recessive disease: that allele is common in some
  populations, with healthy homozygotes, and its role is unresolved.
parents:
- Visceral heterotaxy
- Congenital Disorder

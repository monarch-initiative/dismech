animal_models:
- name: Cerl2 (Dand5) knockout mouse
  species: Mouse
  genotype: Cerl2-/- (targeted null)
  publication: PMID:15466485
  description: >-
    Homozygous Cerl2-null mice show randomized left-right axis, heterotaxy and
    congenital heart defects, with substantial mortality on the first day after
    birth, and a separate left ventricular hyperplasia that is present even in
    mutants with normal laterality.
  evidence:
  - reference: PMID:15466485
    reference_title: >-
      The activity of the Nodal antagonist Cerl-2 in the mouse node is required
      for correct L/R body axis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cerl-2 knockout mice display multiple laterality defects including
      randomization of the L/R axis.
    explanation: >-
      The knockout reproduces the laterality disorder.
  - reference: PMID:25033293
    reference_title: >-
      Targeted inactivation of Cerberus like-2 leads to left ventricular cardiac
      hyperplasia and systolic dysfunction in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Previous analysis of the Cerberus like 2 knockout (Cerl2-/-) mouse
      revealed a significant mortality during the first day after birth, mostly
      due to cardiac defects apparently associated with randomization of the
      left-right axis.
    explanation: >-
      Neonatal lethality from cardiac defects in the knockout.
  modeled_mechanisms:
  - target: Lateral Plate Mesoderm Laterality Signaling Disruption
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The null allele matches the human loss-of-function alleles and reproduces
      randomized laterality and heterotaxy with heart defects.
    limitations: >-
      Nodal-dosage rescue and the laterality-independent ventricular phenotype
      have not been examined in patients.
    evidence:
    - reference: PMID:15466485
      reference_title: >-
        The activity of the Nodal antagonist Cerl-2 in the mouse node is
        required for correct L/R body axis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cerl-2 knockout mice display multiple laterality defects including
        randomization of the L/R axis.
      explanation: >-
        Shows the model informs the lateral plate laterality node.
  - target: Excess Nodal Signaling in Developing Ventricular Myocardium
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    description: >-
      Mutants without laterality defects show left ventricular hyperplasia with
      prolonged pSmad2 signaling and systolic dysfunction.
    limitations: >-
      No human counterpart has been established, so fidelity to patients
      cannot be judged.
    evidence:
    - reference: PMID:25033293
      reference_title: >-
        Targeted inactivation of Cerberus like-2 leads to left ventricular
        cardiac hyperplasia and systolic dysfunction in the mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Echocardiography analysis in Cerl2-/- neonates showed a left ventricular
        systolic dysfunction that is incompatible with a long lifespan.
      explanation: >-
        The knockout is the source of the myocardial node.

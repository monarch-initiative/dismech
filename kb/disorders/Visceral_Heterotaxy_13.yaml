- name: DAND5 Nodal Antagonist Loss of Function
  description: >-
    Biallelic frameshift variants remove or disrupt the DAN domain through
    which DAND5 binds and sequesters Nodal. One patient allele, tested in a
    Nodal-dependent reporter assay, completely lost the ability of DAND5 to
    inhibit Nodal signaling.

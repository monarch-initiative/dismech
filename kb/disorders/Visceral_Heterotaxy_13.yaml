- name: Lateral Plate Mesoderm Laterality Signaling Disruption
  description: >-
    The left-sided expression of Nodal and its targets (Lefty, Pitx2) in the
    lateral plate mesoderm becomes left-sided, right-sided, bilateral or absent
    in different embryos, so the identity cue that patterns the heart and
    viscera is randomized. In Cerl2-null mice the outcome varies along the
    anterior-posterior axis, so heart, lungs and gut can be lateralized
    independently, and removing one Nodal allele partly rescues the defects,
    showing that excess Nodal drives them.

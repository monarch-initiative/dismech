  - reference: PMID:42650045
    reference_title: >-
      Further Support for Association of DAND5 with Autosomal Recessive
      Laterality Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This frameshift variant introduces a premature stop codon within the final
      exon, which is predicted to escape nonsense-mediated decay (NMD),

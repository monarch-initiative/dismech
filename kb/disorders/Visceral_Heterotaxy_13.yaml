    reference_title: >-
      Targeted inactivation of Cerberus like-2 leads to left ventricular cardiac
      hyperplasia and systolic dysfunction in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We uncovered that the increased ventricular muscle observed in Cerl2-/-
      mice is caused by a high cardiomyocyte mitotic index in the compact
      myocardium which is mainly associated with increased Ccnd1 expression
      levels in the left ventricle at embryonic day (E) 13.
    explanation: >-
      Cardiomyocyte hyperproliferation in the Cerl2-null left ventricle.
  - reference: PMID:25033293
    reference_title: >-
      Targeted inactivation of Cerberus like-2 leads to left ventricular cardiac
      hyperplasia and systolic dysfunction in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

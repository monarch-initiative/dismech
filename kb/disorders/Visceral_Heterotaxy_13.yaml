  downstream:
  - target: Bilateral Nodal Activity at the Left-Right Organizer
    description: >-
      Without DAND5 there is no right-sided antagonist at the organizer, so the
      flow-dependent left-sided release of Nodal no longer creates a left-right
      difference in active Nodal.
    evidence:
    - reference: PMID:15466485
      reference_title: >-
        The activity of the Nodal antagonist Cerl-2 in the mouse node is
        required for correct L/R body axis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results demonstrate that Cerl-2 plays a key role in restricting the
        Nodal signaling pathway toward the left side of the mouse embryo by
        preventing its activity in the right side.
      explanation: >-
        Knockout mouse study establishing that Cerl2 restricts Nodal activity to
        the left by blocking it on the right.
    - reference: PMID:21419113
      reference_title: >-
        Left-right asymmetry in the level of active Nodal protein produced in
        the node is translated into left-right asymmetry in the lateral plate
        of mouse embryos.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This asymmetry in pSmad2 distribution was found to be generated not by
        unidirectional transport of Nodal but rather as a result of L<R
        asymmetric expression of the Nodal antagonist Cerl2.
      explanation: >-
        The left-biased distribution of active Nodal signaling around the node
        is produced by right-biased Cerl2.
  - target: Excess Nodal Signaling in Developing Ventricular Myocardium
    hypothesis_groups:
    - dand5_myocardial_proliferation
    description: >-
      Proposed second route, separate from laterality. Cerl2 is expressed in
      the embryonic mouse ventricles, more in the left than the right, and
      Cerl2-null hearts show prolonged TGF-beta/Nodal pathway activation, so
      losing the antagonist in the myocardium itself is read as releasing Nodal
      signaling there. Whether this happens in patients is untested.
    evidence:
    - reference: PMID:25033293
      reference_title: >-
        Targeted inactivation of Cerberus like-2 leads to left ventricular

- name: Excess Nodal Signaling in Developing Ventricular Myocardium
  description: >-
    In Cerl2-null mice Cerl2 is expressed in the embryonic left ventricle, and
    mutants without laterality defects still have prolonged TGF-beta/Nodal
    (pSmad2) signaling, a high cardiomyocyte mitotic index and a massively
    thickened left ventricular compact myocardium with systolic dysfunction.
    DAND5-null human iPSC-derived cardiomyocytes are likewise more
    proliferative. Whether this laterality-independent role contributes to
    disease in patients is not known.

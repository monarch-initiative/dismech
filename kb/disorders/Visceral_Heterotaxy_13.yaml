    explanation: >-
      States the predicted molecular consequence of the allele.
- name: DAND5 c.455G>A (p.Arg152His)
  description: >-
    Heterozygous missense variant in the DAN domain reported in two patients
    with congenital heart disease, one with left isomerism, before the recessive
    disease was recognized. It reduced activity in a Nodal-dependent reporter
    assay, but it is common in some populations (allele frequency 2.74% in
    European Finnish individuals in gnomAD v2, with healthy homozygotes) and is
    scored as benign by missense predictors. It is recorded here to separate it
    from the recessive disease, not as a cause of HTX13; the later reports call
    it likely benign and leave the contribution of single DAND5 variants
    unresolved.

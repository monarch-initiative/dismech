      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results indicate that independently of its well-known role in
        left-right axis establishment Cerl2 plays an important role during
        heart development in the mouse, mediating Baf60c levels by exerting an
        important control of the TGFβs/Nodal-signaling pathway.
      explanation: >-
        The authors' own conclusion that Cerl2 controls Nodal-pathway activity
        in the developing heart separately from its left-right role.
    - reference: PMID:25033293
      reference_title: >-
        Targeted inactivation of Cerberus like-2 leads to left ventricular
        cardiac hyperplasia and systolic dysfunction in the mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We then microdissected the LV and RV at E13 in order to assess the
        levels of Cerl2 expression in each ventricle, and we have found more
        expression in the LV than in the RV
      explanation: >-
        Places the antagonist in the ventricular myocardium this edge lands on,
        with the left-sided bias that matches where the hyperplasia occurs.
- name: Bilateral Nodal Activity at the Left-Right Organizer
  description: >-
    At the left-right organizer (the mouse node, Xenopus gastrocoel roof plate
    and zebrafish Kupffer's vesicle) DAND5 and Nodal are co-expressed in the
    marginal crown cells. Leftward flow, sensed through the PKD2 channel,
    triggers Bicc1- and Ccr4-Not-dependent decay of Dand5 mRNA on the left, so
    Nodal is released on the left only. DAND5 is the first gene to be
    asymmetrically expressed and the main target of flow. When it is absent,
    Nodal at the organizer is active on both sides and the flow signal has
    nothing to act on, so the left-right cue passed to the lateral plate is
    lost or randomized. The ciliary machinery that produces the flow is not
    affected.

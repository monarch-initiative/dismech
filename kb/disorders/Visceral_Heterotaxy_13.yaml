discussions:
- discussion_id: dand5_monoallelic_contribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#DAND5
  prompt: >-
    Do heterozygous DAND5 variants contribute to laterality defects or
    congenital heart disease, or is DAND5 disease strictly recessive?
  rationale: >-
    The first DAND5 reports were heterozygous p.Arg152His carriers with heart
    disease, and the variant reduced activity in a reporter assay. But the
    allele is common, with healthy homozygotes, DAND5 is tolerant of
    loss-of-function variation, and those patients were not screened for a
    cause in another heterotaxy gene. Heterozygous parents and relatives of the
    recessive patients were unaffected, though they were not imaged for subtle
    situs defects. Whether DAND5 acts as a low-penetrance modifier is
    therefore open.
  status: OPEN
  evidence:
  - reference: PMID:42650045
    reference_title: >-
      Further Support for Association of DAND5 with Autosomal Recessive
      Laterality Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, this gene does not exhibit missense constraint (z score =
      −0.36) and is tolerant to loss-of-function variants (pLI = 0), leaving
      the contribution of monoallelic DAND5 variants to human disease
      unresolved.
    explanation: >-
      The latest report states that the role of single DAND5 variants is
      unresolved.
- discussion_id: dand5_myocardial_role_in_patients
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Excess Nodal Signaling in Developing Ventricular Myocardium
  - phenotypes#Biventricular hypertrophy
  prompt: >-
    Does DAND5 loss cause ventricular myocardial overgrowth in patients, as it
    does in Cerl2-null mice and DAND5-null iPSC-derived cardiomyocytes?
  rationale: >-
    The mouse and human cell data point to a laterality-independent effect on
    cardiomyocyte proliferation and left ventricular function. One of three
    patients had biventricular hypertrophy with reduced systolic function, but
    with obstructive and shunt lesions that can explain it, and the other two
    were not described in those terms. Serial imaging of ventricular wall
    thickness and function in further biallelic patients would show whether
    the model phenotype translates.
  status: OPEN
  evidence:
  - reference: PMID:36316122
    reference_title: >-
      A novel biallelic loss-of-function variant in DAND5 causes heterotaxy
      syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      The majority of Cerl2 (DAND5 ortholog) knockout mice were found to have
      heterotaxy and left ventricular cardiac hyperplasia
    explanation: >-
      The patient report itself notes the mouse ventricular phenotype without
      assessing it in the patient.
notes: >-
  Curated as a standalone entry rather than a subtype of Visceral_Heterotaxy,
  following the precedent of Visceral_Heterotaxy_7 and Visceral_Heterotaxy_9:
  HTX13 has its own MONDO term and OMIM number (621079), a single causal gene
  and a mechanism distinct from the motile ciliopathies. The patient described
  in the 2022 exome cohort (PMID:34215651) is the same individual as proband 1
  of the 2026 report (PMID:42650045) and is counted once. No module conformance
  is declared: kb/modules has no left-right patterning module, and the
  ciliopathy_dysfunction module does not apply because ciliary structure and
  motility are intact.

- accession: massive:MSV000085234
  title: Proteomics of plasma exosomes in human cystic echinococcosis
  description: Exosomes represent an important way of cell-cell communication. Their release into the bloodstream is similar to sending bottle messages that can safely reach (distant) target tissues and cells. In disease contexts, these vesicles provide a suitable source of markers of pathogenesis or carcinogenesis, as well as of the immune response and the host-pathogens interplay. In cystic echinococcosis (CE), the availability of a marker-based blood test would represent an extraordinary advantage for disease diagnosis, staging and follow-up.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Cystic echinococcosis"). Retrieved 2026-08-02.

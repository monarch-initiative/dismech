datasets:
- accession: geo:GSE232100
  title: Circulating small RNA profiling of patients with alveolar and cystic echinococcosis
  description: Alveolar (AE) and cystic (CE) echinococcosis are two parasitic diseases caused by the tapeworms Echinococcus multilocularis and E. granulosus sensu lato (s. l.), respectively. Currently, AE and CE are mainly diagnosed by means of imaging techniques, supported by serology and clinical and epidemiological data. However, no viability markers that indicate parasite state during infection are available. Extracellular small RNAs (sRNAs) are short non-coding RNAs that can be secreted by cells through association with extracellular vesicles, proteins, or lipoproteins.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 27
  publication: PMID:37237528
  notes: Identified by GEO DataSets index search for Cystic echinococcosis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE318183
  title: Small RNA Sequencing of Exosomal MicroRNAs in Sera from Patients with Echinococcus granulosus Infection
  description: This project aimed to explore the potential roles of exosomal microRNAs (miRNAs) in cystic echinococcosis by extracting and analyzing exosomes and their cargo miRNAs from the sera of patients with Echinococcus granulosus infection. First, serum exosomes were isolated and purified via size-exclusion chromatography with strict quality control, followed by morphological identification of exosomes using negative-staining transmission electron microscopy. Subsequently, exosomal RNA was extracted, and small RNA libraries were constructed with the Illumina TruSeq Small RNA Kit for single-end 50 bp sequencing on the Illumina Hiseq 2000/2500 platform.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606

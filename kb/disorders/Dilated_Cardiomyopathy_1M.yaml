- name: Multigene Cardiomyopathy Panel Testing
  description: >-
    CSRP3 appears on many dilated-cardiomyopathy panels. At a Limited classification, a CSRP3
    variant found in a dilated-cardiomyopathy proband should not be reported as a molecular
    diagnosis on its own. W4R in particular is too common to be interpreted as causal. Testing
    is most useful for finding a variant in a high-evidence gene.
  evidence:
  - reference: PMID:33947203
    reference_title: "Evidence-Based Assessment of Genes in Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: >-
      We recommend that high-evidence DCM genes be used for clinical practice and that caution
      be exercised in the interpretation of variants in variable-evidence DCM genes.
    explanation: >-
      The expert recommendation that applies to a Limited gene such as CSRP3. INDIRECT because
      the abstract does not name CSRP3.
  - reference: PMID:27532257
    reference_title: "Reassessment of Mendelian gene pathogenicity using 7,855 cardiomyopathy cases and 60,706 reference samples."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We found that in some genes previously reported as important causes of a given
      cardiomyopathy, rare variation is not clinically informative because there is an
      unacceptably high likelihood of false-positive interpretation.
    explanation: >-
      The study that found no CSRP3 enrichment in dilated cardiomyopathy concludes that rare
      variants in genes like this one are prone to false-positive interpretation.
differential_diagnoses:
- name: Hypertrophic Cardiomyopathy 12
  disease_term:
    preferred_term: hypertrophic cardiomyopathy 12
    term:
      id: MONDO:0012804
      label: hypertrophic cardiomyopathy 12
  description: >-
    The allelic CSRP3 disorder (CMH12), and the better-established one. CSRP3 missense variants
    segregate with hypertrophic cardiomyopathy in several families, and ClinGen rates CSRP3 for
    hypertrophic cardiomyopathy as Definitive with semi-dominant inheritance. Biallelic CSRP3
    truncating variants have been reported in adult hypertrophic cardiomyopathy. A CSRP3
    carrier with a dilated ventricle needs hypertrophic cardiomyopathy with later dilation
    considered. dismech curates CSRP3 hypertrophic disease on the Hypertrophic_Cardiomyopathy
    entry. CMH12 itself is still a stub.
  distinguishing_features:
  - >-
    Unexplained left ventricular hypertrophy rather than primary dilation. In the HCM carriers
    of the 2008 study there was also evidence of mild skeletal muscle disease.
  evidence:
  - reference: PMID:18505755

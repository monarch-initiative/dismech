- name: Impaired Z-Disc Calcineurin-NFAT Stress Signalling
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    MLP anchors calcineurin at the Z-disc. When MLP is reduced, calcineurin is displaced and
    stress-induced calcineurin-NFAT activation is blunted. Calcineurin is protective in this
    setting: deleting calcineurin A-beta in MLP-null mice worsens the cardiomyopathy, and
    activated calcineurin improves it. All evidence for this node is from mice and cultured
    cardiomyocytes.
  biological_processes:

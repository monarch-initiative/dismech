    explanation: >-
      Segregation in four more HCM families, in contrast with no segregating CMD1M family.
  - reference: PMID:18505755
    reference_title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

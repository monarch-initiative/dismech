- name: Dilated Cardiomyopathy 1AA
  disease_term:
    preferred_term: dilated cardiomyopathy 1AA
    term:
      id: MONDO:0012808
      label: dilated cardiomyopathy 1AA
  description: >-
    ACTN2-related dilated cardiomyopathy. Alpha-actinin-2 is the Z-disc partner whose binding
    K69R abolishes, and a dilated-cardiomyopathy ACTN2 variant (Q9R) reported in the same 2003
    screen disrupts MLP binding from the other side. The two cannot be told apart clinically;
    only sequencing separates them.
  distinguishing_features:
  - >-
    The variant is in ACTN2 (alpha-actinin-2) rather than CSRP3.
  evidence:
  - reference: PMID:14567970
    reference_title: "Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In another patient with DCM, a Q9R mutation was identified in alpha-actinin-2.
    explanation: >-
      An ACTN2 variant in dilated cardiomyopathy, found in the same screen as K69R.
- name: Dilated Cardiomyopathy
  disease_term:
    preferred_term: dilated cardiomyopathy
    term:
      id: MONDO:0005021
      label: dilated cardiomyopathy
  description: >-
    Dilated cardiomyopathy from other genes or acquired causes. Because CSRP3 is a Limited gene
    and the founding allele is common, most CSRP3 carriers with dilated cardiomyopathy are
    better explained by a variant in a high-evidence gene or by an acquired cause. Ischaemic,
    toxic, inflammatory and peripartum dilated cardiomyopathy should be excluded clinically.
  distinguishing_features:
  - >-
    A pathogenic variant in a Definitive or Strong dilated-cardiomyopathy gene, or an identified
    acquired cause.
  evidence:
  - reference: PMID:19412328
    reference_title: "Coding sequence mutations identified in MYH7, TNNT2, SCN5A, CSRP3, LBD3, and TCAP from 313 patients with familial or idiopathic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mutations of these six genes each account for a small fraction of the genetic cause of
      FDC/IDC.
    explanation: >-
      CSRP3 is one of several genes that each explain only a small fraction of dilated
      cardiomyopathy.

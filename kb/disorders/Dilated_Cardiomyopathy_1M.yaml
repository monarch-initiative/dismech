    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Antithetically, mild overexpression of activated calcineurin in the mouse heart improved
      function and adverse remodeling in MLP knock-out mice.
    explanation: >-
      Restoring calcineurin activity improves MLP-null cardiomyopathy, so loss of calcineurin

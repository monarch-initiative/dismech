genetic:
- name: CSRP3
  gene_term:
    preferred_term: CSRP3
    term:
      id: hgnc:2472
      label: CSRP3
  variant_origin: GERMLINE
  association: >-
    Heterozygous CSRP3 missense variants reported in dilated cardiomyopathy (W4R, K69R and
    single variants from cohort screens). The relationship is classified Limited by ClinGen.
    relationship_type is left unset because CAUSATIVE is reserved for Definitive or Strong
    relationships.
  gene_disease_validity:
  - validity_classification: LIMITED
    classified_by: CLINGEN
    external_id: CGGV:assertion_beaafc90-20ef-4c81-ad8f-cfcf69d269ca-2026-03-04T170000.000Z
    evidence:
    - reference: CGGV:assertion_beaafc90-20ef-4c81-ad8f-cfcf69d269ca-2026-03-04T170000.000Z
      reference_title: "CSRP3 / dilated cardiomyopathy 1M (Limited)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CSRP3 | HGNC:2472 | dilated cardiomyopathy 1M | MONDO:0011840 | AD | Limited"
      explanation: >-
        ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel classifies CSRP3 for this
        exact MONDO term as Limited, autosomal dominant (SOP10, 2026-03-04).
  variants:
  - name: CSRP3 p.Trp4Arg (W4R)
    description: >-
      The founding allele, c.10T>C in exon 2 according to the 2010 knock-in paper. It weakens
      telethonin binding and lowers MLP levels in knock-in mice. It is carried by up to 1% of
      people of European ancestry and did not segregate with dilated cardiomyopathy in the one
      family where segregation was tested. On current evidence it is best read as a common
      low-penetrance or benign variant, not a monogenic cause of this disease.
  - name: CSRP3 p.Lys69Arg (K69R)
    description: >-
      Reported in one patient with dilated cardiomyopathy and endocardial fibroelastosis. It sits
      in a conserved region next to the first LIM domain and abolishes alpha-actinin-2 binding in
      cell culture. Segregation is not reported in the abstract.
  - name: CSRP3 p.Gly72Arg (G72R)
    description: >-
      The single CSRP3 variant among 313 dilated-cardiomyopathy probands in Hershberger 2008.
      It replaces a conserved residue and was judged possibly disease-causing.
  - name: CSRP3 p.Glu191Lys (E191K)
    description: >-
      NM_003476.5:c.571G>A, heterozygous, in one of 31 dilated-cardiomyopathy subjects in a Thai
      clinical series (Trachoo 2022), classified as a variant of uncertain significance.
  evidence:
  - reference: CGGV:assertion_beaafc90-20ef-4c81-ad8f-cfcf69d269ca-2026-03-04T170000.000Z
    reference_title: "CSRP3 / dilated cardiomyopathy 1M (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CSRP3 | HGNC:2472 | dilated cardiomyopathy 1M | MONDO:0011840 | AD | Limited"
    explanation: >-
      The current expert-panel classification for this gene and this disease.
  - reference: PMID:20044516
    reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Given the well-known high frequency of this mutation in Caucasians of up to 1%, our data
      suggest that (W4R-MLP) might contribute significantly to human cardiovascular disease.
    explanation: >-
      States the population frequency of W4R. The authors read it as a common contributor to
      cardiovascular disease. That frequency also makes W4R implausible as a penetrant monogenic
      cause of a rare cardiomyopathy.
  - reference: PMID:18505755
    reference_title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Previous studies have shown an association between CSRP3 missense mutations and either
      dilated cardiomyopathy (DCM) or HCM, but all these studies were unable to provide
      comprehensive genetic evidence for a causative role of CSRP3 mutations.
    explanation: >-
      The 2008 linkage study that confirmed CSRP3 as an HCM gene judged the earlier dilated-
      cardiomyopathy reports to lack comprehensive genetic evidence for causation. The parent
      Dilated_Cardiomyopathy entry cites the same sentence.
  - reference: PMID:27532257
    reference_title: "Reassessment of Mendelian gene pathogenicity using 7,855 cardiomyopathy cases and 60,706 reference samples."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      CSRP3 945 60647 0.00029 1.10 (0.35–3.45) 0.09 (0.00–0.71) 0.00070 2.92 (0.39–21.6)
      0.66 (0.00–0.95)
    explanation: >-
      No detectable excess of rare CSRP3 variants in 945 dilated-cardiomyopathy cases compared
      with ExAC (non-truncating OR 1.10, 95% CI 0.35-3.45); a modest effect is not excluded.
  notes: >-
    Gene-disease validity. The ClinGen record
    CGGV:assertion_beaafc90-20ef-4c81-ad8f-cfcf69d269ca-2026-03-04T170000.000Z classifies CSRP3
    for dilated cardiomyopathy 1M (MONDO:0011840, this entry's disease_term) as Limited,
    autosomal dominant, SOP10, dated 2026-03-04. The same assertion is the CSRP3 dilated-
    cardiomyopathy row in the committed ClinGen ingest table
    (kb/genes/ingest/clingen_gene_validity.tsv); the only other CSRP3 row there is the
    hypertrophic-cardiomyopathy assertion. The committed cache/clingen/gene_validity.csv
    holds an earlier record of the same assertion (2025-05-30) for the umbrella term dilated
    cardiomyopathy (MONDO:0005021), classified No Known Disease Relationship; the 2026-03-04
    record for MONDO:0011840 is the current one. The deep-research report cites a GenCC summary giving
    "no known disease relationship" for CSRP3 and dilated cardiomyopathy, which conflicts with
    the current ClinGen tier; this entry follows ClinGen. Because CSRP3 has a ClinGen rating
    below Strong for this disease, relationship_type is left unset, as in the sibling CMD1
    entries.

    The CSRP3 hypertrophic-cardiomyopathy assertion (Definitive, semi-dominant,
    MONDO:0005045) is a different disease and is not copied here. It is curated on the
    Hypertrophic_Cardiomyopathy entry.

    The cached ClinGen record is the CSV row only. The report-page narrative, which scores the
    individual dilated-cardiomyopathy variants, was not cached, so no ClinGen variant scores are
    quoted here.

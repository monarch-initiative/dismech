  - reference: PMID:12507422
    reference_title: "The cardiac mechanical stretch sensor machinery involves a Z disc complex that is defective in a subset of human dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Further, a human MLP mutation (W4R) associated with dilated cardiomyopathy (DCM) results
      in a marked defect in T-cap interaction/localization.
    explanation: >-
      The founding report of a CSRP3 variant in human dilated cardiomyopathy. Graded
      HUMAN_CLINICAL for the patient association it reports. The interaction defect in the same
      sentence is cited separately as in vitro evidence on the downstream node.
  - reference: PMID:14567970
    reference_title: "Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified a patient with DCM and EFE, having a mutation in MLP with the residue
      lysine 69 substituted by arginine (K69R).
    explanation: >-
      The second reported dilated-cardiomyopathy allele, in a single patient.
  - reference: PMID:14567970
    reference_title: "Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In another individual with DCM, a W4R mutation was identified. However, this mutation did
      not segregate with disease in this family.
    directness: INDIRECT
    explanation: >-
      Applies to the W4R allele only, not to the node as a whole: non-segregation of the
      founding W4R allele weakens the claim that W4R alone initiates dilated cardiomyopathy.
      K69R and G72R are untested for segregation.
  downstream:
  - target: Loss of MLP Binding to Telethonin and Alpha-Actinin-2
    causal_link_type: DIRECT
    description: >-
      Each reported dilated-cardiomyopathy allele weakens or abolishes binding of MLP to a
      Z-disc partner when tested experimentally.
    evidence:
    - reference: PMID:14567970
      reference_title: "Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Analysis in cell culture systems demonstrated that the mutation abolishes the
        interaction between MLP and alpha-actinin-2 and the cellular localization of MLP was
        altered.
      explanation: >-
        K69R abolishes alpha-actinin-2 binding in cell culture, which is the variant-to-binding
        step for this allele.
    - reference: PMID:20044516
      reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        We also detected a weaker in vitro interaction of telethonin with W4R-MLP than with
        wild-type MLP.
      explanation: >-
        W4R weakens telethonin binding in vitro, which is the variant-to-binding step for the
        founding allele.
  - target: Reduced Myocardial MLP Abundance
    causal_link_type: DIRECT
    description: >-
      The W4R allele lowers MLP mRNA and protein in knock-in mouse hearts. In human HCM hearts,
      at least one CSRP3 missense protein appears destabilised. No measurement exists in human
      CMD1M myocardium.
    evidence:
    - reference: PMID:20044516
      reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Importantly, we found significantly reduced MLP mRNA and MLP protein expression levels
        in hearts of heterozygous and homozygous W4R-MLP knock-in animals.
      explanation: >-
        W4R lowers MLP levels in heterozygous knock-in mouse hearts. This is a mouse finding.
    - reference: PMID:18505755
      reference_title: "Beyond the sarcomere: CSRP3 mutations cause hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: >-
        Our functional data from both in vitro and in vivo analyses suggest that at least one of
        MLP's mutated forms seems to be destabilized in the heart of HCM patients harbouring a
        CSRP3 missense mutation.
      explanation: >-
        Human myocardial evidence that a CSRP3 missense protein can be destabilised. INDIRECT
        because the patients had hypertrophic cardiomyopathy, not CMD1M.
- name: Loss of MLP Binding to Telethonin and Alpha-Actinin-2
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    MLP binds telethonin (T-cap), which in turn binds the N-terminus of titin, and
    alpha-actinin-2, the main Z-disc actin cross-linker. W4R weakens the telethonin interaction
    and K69R abolishes the alpha-actinin-2 interaction. In the founding study, telethonin was
    lost from the Z-disc in a subset of MLP-null mouse cardiomyocytes and in myocardial
    biopsies from W4R carriers. A dilated-cardiomyopathy variant in the partner, ACTN2 Q9R, also
    disrupts MLP binding, which supports the view that this complex is the relevant one.

notes: >-
  Scope. This entry covers only the dilated designation CMD1M (MONDO:0011840, OMIM 607482,
  provisional). The allelic hypertrophic disorder CMH12 (MONDO:0012804) is better established
  and is handled as a differential. CSRP3 hypertrophic disease is curated on the
  Hypertrophic_Cardiomyopathy entry, which cites the Definitive ClinGen assertion this entry
  quotes only for contrast.

  Consistency with the parent entry. The Dilated_Cardiomyopathy entry leaves CSRP3 off its gene
  panel. ClinGen's Limited assertion is for the numbered term MONDO:0011840, not the umbrella
  term, and is cached with this entry; the earlier umbrella-term record was No Known Disease
  Relationship (see the genetic notes). It does not change the parent entry's judgement, which
  this entry shares: CSRP3's high-evidence relationship is with hypertrophic cardiomyopathy.

  Evidence base. The human dilated-cardiomyopathy counts here come from PMID:12507422,
  PMID:14567970, PMID:19412328 and PMID:36166435 (the last two cached as full text) and the
  Walsh 2017 table (PMID:27532257). Hershberger 2008 names its one CSRP3 allele as G72R.
  Trachoo 2022 prints the gene as "DRSP3" in its abstract; its Table 1 has one CSRP3 dilated-
  cardiomyopathy subject, heterozygous for E191K and classified VUS. ClinGen's own scoring of
  individual variants (for example A50T and T179A) is in its report narrative, which is not
  cached, and is not asserted. Zimmerman 2010 (PMID:20474083), which the deep-research report links to two of
  those variants, does not name CSRP3 in its cached abstract and is not cited.

  Mechanism. The chain runs: variant, then loss of partner binding and reduced MLP dose, then
  defective stretch sensing, impaired calcineurin signalling, disrupted cytoarchitecture and a
  contested SR calcium-cycling defect, then left ventricular dilation and heart failure. Almost
  every step downstream of the variant rests on mouse or cell data. The two human data points
  are telethonin loss in W4R-carrier biopsies and CSRP3 protein destabilisation in hypertrophic
  (not dilated) patient hearts. Endocardial fibroelastosis, seen in one patient, is left
  unconnected because no source gives a mechanism. No CMD1M-specific arrhythmia, conduction
  or skeletal-muscle findings appear in the cited sources, which is why only three phenotypes
  are recorded.

  GeneReviews. There is no CMD1M-specific chapter. The disease-level "Dilated Cardiomyopathy
  Overview" (PMID:20301486) is tagged. Its cached record holds only the purpose statement, so
  no phenotype baseline could be mined from it. `just check-genereviews --online` (Bookshelf
  index snapshot 2026-09-10, run 2026-10-08) reports GeneReviews TAGGED (PMID:20301486, NBK1309,
  matched by identity) and StatPearls NO_CHAPTER.

  Deep research was run with the claude_code provider after the falcon provider was unavailable
  (falcon fallback).

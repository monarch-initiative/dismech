    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      Furthermore, restoration of Ca2+ homeostasis by verapamil prevented the development of
      HCM and HF phenotypes, suggesting that elevated intracellular Ca2+ concentration is a
      central mechanism for pathogenesis of MLP deficiency.
    explanation: >-
      Human-cell evidence that MLP loss disturbs calcium homeostasis. INDIRECT because the
      phenotype is HCM-like rather than dilated, and the cells are a full knockout rather than a
      patient allele.
  downstream:

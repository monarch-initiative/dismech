- name: Sarcoplasmic Reticulum Calcium Cycling Defect
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Chronic inhibition of SERCA2a by phospholamban has been proposed as the calcium-cycling
    defect that drives chamber dilation in the MLP-null mouse, because ablating phospholamban
    rescues the phenotype. MLP-null hearts, however, are reported to have normal or enhanced
    SERCA function. The rescue may therefore work by bypassing the MLP lesion rather than by
    correcting it. MLP-null human stem-cell cardiomyocytes also show abnormal calcium handling,
    but they model hypertrophic rather than dilated disease. The node is HYPOTHETICAL for
    CMD1M.

      excluded), which is consistent with CMD1M being rare and with no rate having been
      measured.
pathophysiology:
- name: Heterozygous CSRP3 Missense Variant
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  mechanism_confidence: PROVISIONAL
  description: >-
    The proposed initiating lesion is a heterozygous germline missense variant in CSRP3. The
    reported dilated-cardiomyopathy alleles are W4R in the N-terminus and K69R, which lies in a
    conserved region next to the first LIM domain that is involved in alpha-actinin binding.
    W4R is a common European allele that did not segregate with disease in the one family where
    segregation was tested. Whether either allele causes dilated cardiomyopathy on its own is
    unresolved (see the discussions).

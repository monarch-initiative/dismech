    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The ablation of a muscle-specific sarcoplasmic reticulum Ca2+ ATPase (SERCA2a) inhibitor,
      phospholamban, rescued the spectrum of phenotypes that resemble human heart failure.
    explanation: >-
      Phospholamban ablation rescues the mouse dilated-cardiomyopathy model. A review confirms
      that the model was the MLP-null mouse (see the incoming edge).
  - reference: PMID:31406109
    reference_title: "MLP-deficient human pluripotent stem cell derived cardiomyocytes develop hypertrophic cardiomyopathy and heart failure phenotypes due to abnormal calcium handling."

    label: dilated cardiomyopathy 1M
synonyms:
- CMD1M
- cardiomyopathy, dilated, 1M
- dilated cardiomyopathy type 1M
- CSRP3-related dilated cardiomyopathy
- muscle LIM protein-related dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1M (CMD1M) is the numbered dilated-cardiomyopathy locus assigned to
  CSRP3, which encodes muscle LIM protein (MLP), a striated-muscle LIM-only protein found at the
  sarcomeric Z-disc, the costamere and the nucleus. MLP binds telethonin (T-cap) and
  alpha-actinin-2 at the Z-disc and has been proposed as part of the cardiomyocyte mechanical
  stretch sensor.

  The locus rests on a small human evidence base. The founding report (2002) described the
  N-terminal variant p.Trp4Arg (W4R) in dilated cardiomyopathy and showed that it weakens the
  MLP-telethonin interaction. A 2003 screen added p.Lys69Arg (K69R) in one patient with dilated
  cardiomyopathy and endocardial fibroelastosis; in the same screen W4R did not segregate with
  disease in a second family. W4R was later shown to be carried by up to 1% of people of European
  ancestry, and a 945-case comparison against population reference data found no detectable
  excess of rare CSRP3 variants in dilated cardiomyopathy (odds ratio 1.10; a modest effect is
  not excluded). ClinGen's Dilated Cardiomyopathy Gene Curation Expert
  Panel classifies CSRP3 for this disease as Limited (autosomal dominant).

  Most mechanistic knowledge comes from the Csrp3 (Mlp) knockout mouse, a classic model that
  develops postnatal dilated cardiomyopathy and heart failure after cytoarchitectural disruption
  of cardiomyocytes. In humans, by contrast, CSRP3 is a Definitive hypertrophic-cardiomyopathy
  gene (allelic disorder CMH12), and both the W4R knock-in mouse and MLP-null human stem-cell
  cardiomyocytes develop hypertrophic rather than dilated phenotypes. This entry records that
  mismatch rather than resolving it.

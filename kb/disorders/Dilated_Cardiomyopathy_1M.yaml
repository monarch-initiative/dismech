    reference_title: "The cardiac mechanical stretch sensor machinery involves a Z disc complex that is defective in a subset of human dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      MLP interacts with and colocalizes with telethonin (T-cap), a titin interacting protein.
    explanation: >-
      Establishes the MLP-telethonin interaction that the W4R allele disrupts.
  - reference: PMID:14567970
    reference_title: "Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Analysis in cell culture systems demonstrated that the mutation abolishes the
      interaction between MLP and alpha-actinin-2 and the cellular localization of MLP was
      altered.
    explanation: >-
      K69R abolishes alpha-actinin-2 binding and changes where MLP sits in the cell.
  - reference: PMID:21484537
    reference_title: "MLP (muscle LIM protein) as a stress sensor in the heart."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In this regard, we observed loss of telethonin at the Z-disc in a subset of MLP−/−
      cardiomyocytes as well as in myocardial biopsies from patients carrying the W4R-MLP
      mutation, which is supported by our finding that W4R-MLP binds with less affinity to
      telethonin [26, 27].
    explanation: >-
      The review's summary of the founding group's own work, including the only human
      myocardial observation of the binding defect: telethonin lost from the Z-disc in biopsies
      from W4R carriers. Graded HUMAN_CLINICAL for that biopsy finding. The MLP-null part of the
      sentence is mouse data.
  - reference: PMID:14567970
    reference_title: "Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      This mutation also disrupted the interaction with MLP and appeared to inhibit
      alpha-actinin function in cultured cells, in respect to the nuclear localization of
      actinin and the initiation of cellular differentiation.
    explanation: >-
      The subject is the ACTN2 Q9R variant found in a dilated-cardiomyopathy patient. The same
      interaction is disrupted from the partner side. INDIRECT because the variant is in ACTN2,
      not CSRP3.
  downstream:
  - target: Defective Cardiomyocyte Stretch Sensing
    causal_link_type: DIRECT
    description: >-
      Loss of the Z-disc MLP/telethonin complex is proposed to disable stretch sensing in the
      cardiomyocyte.
    evidence:
    - reference: PMID:12507422
      reference_title: "The cardiac mechanical stretch sensor machinery involves a Z disc complex that is defective in a subset of human dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        We propose that a Z disc MLP/T-cap complex is a key component of the in vivo
        cardiomyocyte stretch sensor machinery, and that defects in the complex can lead to
        human DCM and associated heart failure.
      explanation: >-
        The authors' conclusion, drawn from MLP-deficient mouse heart and cell studies, that the
        MLP/telethonin complex is part of the stretch sensor. The extension to human disease is
        stated as a proposal.
- name: Reduced Myocardial MLP Abundance
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A lower dose of functional MLP in the myocardium. W4R knock-in mice have reduced MLP mRNA
    and protein, and heterozygous MLP+/- mice show that halving MLP is enough to worsen
    remodeling under stress. Whether human CMD1M variants reduce myocardial MLP has not been
    measured. The node is HYPOTHETICAL for that reason.

animal_models:
- name: Csrp3 (Mlp) knockout mouse
  species: Mouse
  genotype: Csrp3-/- (MLP-/-), homozygous null
  publication: PMID:9039266
  description: >-
    The classic MLP-deficient mouse, the first genetically engineered mouse model of dilated
    cardiomyopathy. Hearts are abnormally soft at birth, with disrupted cardiomyocyte
    cytoarchitecture. After birth the mice develop dilated cardiomyopathy with hypertrophy and
    heart failure.
  modeled_mechanisms:
  - target: Disrupted Cardiomyocyte Cytoarchitecture
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The structural lesion that the cytoarchitecture node is built on.
    limitations: >-
      Complete loss of MLP, whereas human CMD1M carriers are heterozygous for missense alleles
      whose effect on MLP dose has not been measured in human myocardium.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        A homozygous null does not represent a heterozygous missense variant. In humans,
        biallelic CSRP3 truncation gives hypertrophic rather than dilated cardiomyopathy.
    evidence:
    - reference: PMID:9039266
      reference_title: "MLP-deficient mice exhibit a disruption of cardiac cytoarchitectural organization, dilated cardiomyopathy, and heart failure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Ultrastructural analysis revealed dramatic disruption of cardiomyocyte cytoarchitecture.
      explanation: >-
        The cytoarchitectural lesion in the model.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Produces dilated cardiomyopathy and heart failure that resemble the human clinical
      picture.
    limitations: >-
      The dilation comes with hypertrophy, and the genotype is a complete null. The model shows
      that loss of MLP can cause dilated cardiomyopathy in mice. It does not show that
      heterozygous human CSRP3 variants do.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        In humans, complete or near-complete loss of MLP is associated with hypertrophic, not
        dilated, cardiomyopathy. The direction of remodeling therefore differs between mouse
        and human.
    evidence:
    - reference: PMID:9039266
      reference_title: "MLP-deficient mice exhibit a disruption of cardiac cytoarchitectural organization, dilated cardiomyopathy, and heart failure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        MLP (-/-) mice developed dilated cardiomyopathy with hypertrophy and heart failure after
        birth.
      explanation: >-
        Dilated cardiomyopathy and heart failure in the model, with hypertrophy.
  evidence:
  - reference: PMID:9039266
    reference_title: "MLP-deficient mice exhibit a disruption of cardiac cytoarchitectural organization, dilated cardiomyopathy, and heart failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      In vivo analysis revealed that MLP-deficient mice reproduce the morphological and clinical
      picture of dilated cardiomyopathy and heart failure in humans, providing the first model
      for this condition in a genetically manipulatable organism.
    explanation: >-
      The authors' statement of the model's fidelity to human dilated cardiomyopathy.
- name: Heterozygous Csrp3 (MLP+/-) mouse after myocardial infarction
  species: Mouse
  genotype: Csrp3+/- (MLP+/-), heterozygous null, with experimental myocardial infarction
  publication: PMID:15665106
  description: >-
    Mice with half the normal MLP dose. Their hearts are normal at baseline but dilate more,
    and fail more, after myocardial infarction. Calcineurin is displaced from the Z-disc. This
    is the closest mouse analogue to a heterozygous human state.
  modeled_mechanisms:
  - target: Impaired Z-Disc Calcineurin-NFAT Stress Signalling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows calcineurin displacement and blunted NFAT activation with a reduced MLP dose.
    limitations: >-
      The phenotype appears only after an infarction. Heterozygous null is not the same as a
      human missense allele.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Myocardial infarction is the stressor here. No comparable stressor is documented in
        human CMD1M.
    evidence:
    - reference: PMID:15665106
      reference_title: "Attenuation of cardiac remodeling after myocardial infarction by muscle LIM protein-calcineurin signaling at the sarcomeric Z-disc."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Calcineurin was colocalized with MLP at the Z-disk in WT mice but was displaced from the
        Z-disk in MLP+/- mice, indicating that MLP is essential for calcineurin anchorage to the
        Z-disk.
      explanation: >-
        The signalling readout in the heterozygous model.
  evidence:
  - reference: PMID:15665106
    reference_title: "Attenuation of cardiac remodeling after myocardial infarction by muscle LIM protein-calcineurin signaling at the sarcomeric Z-disc."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      LV dimensions and function were similar in sham-operated WT and MLP+/- mice.
    explanation: >-
      Heterozygous mice have no baseline phenotype. This is the main limitation of the model as
      a stand-alone CMD1M model.
- name: MLP-null and phospholamban-null double knockout mouse
  species: Mouse
  genotype: Csrp3-/- Pln-/- (MLP-/- PLN-/-)
  publication: PMID:10555147
  description: >-
    The MLP-null mouse crossed onto a phospholamban-null background. Removing phospholamban
    rescues the dilated-cardiomyopathy and heart-failure phenotype.
  modeled_mechanisms:
  - target: Sarcoplasmic Reticulum Calcium Cycling Defect
    relationship: RESCUES
    fidelity: LOW
    description: >-
      Relieving SERCA2a inhibition by removing phospholamban rescues the MLP-null
      cardiomyopathy.
    limitations: >-
      A rescue does not show that the defect it corrects is the primary lesion. MLP-null hearts
      are reported to have normal or enhanced SERCA function, so the rescue may act around the
      MLP defect rather than reversing it.
    divergences:
    - divergence_type: CONTESTED_ASSUMPTION
      materiality: QUALIFYING
      description: >-
        The model assumes that the rescued calcium-cycling defect causes the MLP phenotype. Later
        work on SERCA function in MLP-null hearts disputes this.
    evidence:
    - reference: PMID:10555147
      reference_title: "Chronic phospholamban-sarcoplasmic reticulum calcium ATPase interaction is the critical calcium cycling defect in dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        The ablation of a muscle-specific sarcoplasmic reticulum Ca2+ ATPase (SERCA2a)
        inhibitor, phospholamban, rescued the spectrum of phenotypes that resemble human heart
        failure.
      explanation: >-
        The rescue result.
    - reference: PMID:21484537
      reference_title: "MLP (muscle LIM protein) as a stress sensor in the heart."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The stunning improvement of function in these double transgenic mouse models is not
        solely due to improved calcium metabolism because MLP-deficient animals exhibit normal
        or enhanced sacroplasmic reticulum calcium ATPase (SERCA) function [50]
      explanation: >-
        Argues against reading the rescue as proof of a primary SERCA defect.
  evidence:
  - reference: PMID:21484537
    reference_title: "MLP (muscle LIM protein) as a stress sensor in the heart."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      phospholamban (PLN) was ablated in MLP−/− animals and, similar to the previous study, a
      complete rescue effect was observed
    explanation: >-
      Confirms that the MLP-null mouse was the background for the phospholamban rescue.
- name: Mlp W4R knock-in mouse
  species: Mouse
  genotype: Mlp(W4R/+) and Mlp(W4R/W4R) knock-in
  publication: PMID:20044516
  description: >-
    Knock-in of the founding CMD1M allele. Heterozygous and homozygous mice develop age- and
    dose-dependent hypertrophic cardiomyopathy and heart failure, lose almost all contractile
    reserve under catecholamine stress, and have reduced MLP and weaker telethonin binding. Some
    skeletal muscle pathology is also present.
  modeled_mechanisms:
  - target: Reduced Myocardial MLP Abundance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Carries the human allele and lowers MLP in the heart.
    limitations: >-
      This is a mouse measurement. MLP levels have not been measured in human W4R myocardium.
    evidence:
    - reference: PMID:20044516
      reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Importantly, we found significantly reduced MLP mRNA and MLP protein expression levels
        in hearts of heterozygous and homozygous W4R-MLP knock-in animals.
      explanation: >-
        Reduced MLP in knock-in hearts.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The founding dilated-cardiomyopathy allele produces hypertrophic, not dilated,
      cardiomyopathy in the mouse.
    limitations: >-
      The opposite remodeling direction from the human entity this allele defined.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        As a model of dilated remodeling it fails, because the knock-in develops a hypertrophic
        phenotype.
    evidence:
    - reference: PMID:20044516
      reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        We now report the generation and detailed analysis of the corresponding Mlp(W4R/+) and
        Mlp(W4R/W4R) knock-in animals, which develop an age- and gene dosage-dependent
        hypertrophic cardiomyopathy and heart failure phenotype, characterized by almost
        complete loss of contractile reserve under catecholamine induced stress.
      explanation: >-
        The knock-in phenotype is hypertrophic cardiomyopathy.
  evidence:
  - reference: PMID:20044516
    reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      These alterations may contribute to an increased nuclear localization of W4R-MLP, which
      was observed by immunohistochemistry.
    explanation: >-
      A further cellular phenotype of the knock-in: more of the mutant protein is found in the
      nucleus.
discussions:
- discussion_id: cmd1m_entity_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is CMD1M a real Mendelian dilated cardiomyopathy, or a locus built on a common variant and
    a few unsegregated probands?
  attaches_to:
  - genetic#CSRP3
  - disease#Dilated Cardiomyopathy 1M
  rationale: >-
    The human case rests on W4R (common, and non-segregating in one family), K69R (one patient)
    and single probands from cohort screens. No segregating dilated-cardiomyopathy pedigree is
    described in the cached sources, and a 945-case burden comparison found no excess of rare
    CSRP3 variants. ClinGen's Limited rating means the relationship has not been ruled out, and
    MLP biology makes dilated cardiomyopathy plausible. The gap would close with segregation of
    a rare CSRP3 variant in a dilated-cardiomyopathy family, or a burden signal in a large
    cohort.
  evidence:
  - reference: PMID:14567970
    reference_title: "Mutations in the muscle LIM protein and alpha-actinin-2 genes in dilated cardiomyopathy and endocardial fibroelastosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In another individual with DCM, a W4R mutation was identified. However, this mutation did
      not segregate with disease in this family.
    explanation: >-
      The founding allele failed to segregate.
  - reference: PMID:27532257
    reference_title: "Reassessment of Mendelian gene pathogenicity using 7,855 cardiomyopathy cases and 60,706 reference samples."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      CSRP3 945 60647 0.00029 1.10 (0.35–3.45) 0.09 (0.00–0.71) 0.00070 2.92 (0.39–21.6)
      0.66 (0.00–0.95)
    explanation: >-
      No case excess for CSRP3 in dilated cardiomyopathy.
  - reference: CGGV:assertion_beaafc90-20ef-4c81-ad8f-cfcf69d269ca-2026-03-04T170000.000Z
    reference_title: "CSRP3 / dilated cardiomyopathy 1M (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CSRP3 | HGNC:2472 | dilated cardiomyopathy 1M | MONDO:0011840 | AD | Limited"
    explanation: >-
      The expert panel still rates the relationship Limited, not Disputed.
- discussion_id: cmd1m_mouse_dilated_human_hypertrophic
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does loss of MLP give dilated cardiomyopathy in the knockout mouse but mainly
    hypertrophic cardiomyopathy in humans, in the W4R knock-in mouse and in human stem-cell
    cardiomyocytes?
  attaches_to:
  - animal_models#Csrp3 (Mlp) knockout mouse
  - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
  rationale: >-
    Most of the mechanistic chain in this entry comes from the MLP-null mouse. In humans, CSRP3
    is a Definitive hypertrophic-cardiomyopathy gene, and biallelic truncating variants give
    adult hypertrophic cardiomyopathy. Knock-in of the founding dilated allele gives hypertrophic
    cardiomyopathy in mice, and MLP-null human ESC-derived cardiomyocytes develop hypertrophic
    features. The MLP-null mouse itself has hypertrophy along with dilation. So the dilated
    outcome may reflect mouse strain, complete null dose, or a late dilated phase of a
    hypertrophic process, rather than a distinct dilated mechanism.
  evidence:
  - reference: PMID:20044516
    reference_title: "A common MLP (muscle LIM protein) variant is associated with cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      We now report the generation and detailed analysis of the corresponding Mlp(W4R/+) and
      Mlp(W4R/W4R) knock-in animals, which develop an age- and gene dosage-dependent
      hypertrophic cardiomyopathy and heart failure phenotype, characterized by almost
      complete loss of contractile reserve under catecholamine induced stress.
    explanation: >-
      The founding dilated allele gives hypertrophic cardiomyopathy in mice.
  - reference: PMID:31406109
    reference_title: "MLP-deficient human pluripotent stem cell derived cardiomyocytes develop hypertrophic cardiomyopathy and heart failure phenotypes due to abnormal calcium handling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      MLP-deficient hESC-CMs were found to develop phenotypic features of HCM early after
      differentiation, such as enlarged cell size, multinucleation, and disorganized sarcomeric
      ultrastructure.
    explanation: >-
      Human MLP-null cardiomyocytes take on hypertrophic features.
  - reference: PMID:38666070
    reference_title: "Exploring the complex spectrum of dominance and recessiveness in genetic cardiomyopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Conversely, biallelic PTVs in CSRP3 are seemingly associated with HCM in adults (based on
      six reported cases)
    explanation: >-
      Near-complete human loss of CSRP3 gives hypertrophic cardiomyopathy, unlike the knockout
      mouse.
  - reference: PMID:9039266
    reference_title: "MLP-deficient mice exhibit a disruption of cardiac cytoarchitectural organization, dilated cardiomyopathy, and heart failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      MLP (-/-) mice developed dilated cardiomyopathy with hypertrophy and heart failure after
      birth.
    explanation: >-
      Even the knockout mouse shows hypertrophy alongside dilation.
  - reference: PMID:21484537
    reference_title: "MLP (muscle LIM protein) as a stress sensor in the heart."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      MLP deficiency leads to myocardial hypertrophy followed by a dilated cardiomyopathy and
      heart failure phenotype
    explanation: >-
      The review describes the knockout course as hypertrophy first and dilation later, which
      fits the reading that the dilated outcome is a late phase of a hypertrophic process.
- discussion_id: cmd1m_calcium_vs_mechanosensing
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is the phospholamban-SERCA2a calcium-cycling defect a primary driver of MLP-deficient
    cardiomyopathy, or does phospholamban ablation rescue it by acting around a primary
    mechanosensing defect?
  attaches_to:
  - pathophysiology#Sarcoplasmic Reticulum Calcium Cycling Defect
  - pathophysiology#Defective Cardiomyocyte Stretch Sensing
  rationale: >-
    The 1999 rescue paper concluded that progressive dilation depends on an SR calcium-cycling
    defect. The MLP group's later review notes that MLP-null hearts have normal or enhanced SERCA
    function. It proposes that the rescue works through mechanosensation, calcium sensitivity or
    passive stiffness instead. Human stem-cell data again point to calcium, but in a hypertrophic
    context. This entry keeps both branches, with the calcium node marked HYPOTHETICAL.

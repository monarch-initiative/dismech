- discussion_id: cardiac_skeletal_overlap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do CMD1C patients have subclinical skeletal myopathy, and how many zaspopathy
    patients develop cardiomyopathy?
  attaches_to:
  - genetic#LDB3
  - differential_diagnoses#Myofibrillar myopathy 4
  rationale: >-
    LDB3 causes both this cardiomyopathy and a dominant myofibrillar myopathy,
    curated separately in Myofibrillar_Myopathy. Cardiac involvement was found
    in 3 of 11 myopathy patients. The founding cardiac cohort measured muscle
    creatine kinase, but the cached abstract does not report the result. No
    cited study examined skeletal muscle systematically in cardiac probands.
    The two entries therefore overlap at the gene level without a measured
    shared-phenotype rate.
  evidence:
  - reference: PMID:15668942
    reference_title: Mutations in ZASP define a novel form of muscular dystrophy in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore searched for mutations in ZASP in 54 MFM patients and detected
      3 heterozygous missense mutations in 11.
    explanation: Denominator for the myopathy cohort (11 carriers, 3 with cardiac involvement).
  - reference: PMID:14662268

      is an inference about the heterozygous heart, not a direct observation in
      patient myocardium.
  - reference: PMID:11696561
    reference_title: "Ablation of Cypher, a PDZ-LIM domain Z-line protein, causes a severe form of congenital myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Examination of striated muscle from the mutants revealed that Cypher is not
      required for sarcomerogenesis or Z-line assembly, but rather is required
      for maintenance of the Z-line during muscle function.
    explanation: >-
      Knockout mice define the normal Z-line maintenance role. They are a null
      model, closer to recessive LDB3 disease than to CMD1C.
  downstream:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In mice, cardiac loss of Cypher disrupts cardiomyocyte ultrastructure and
      produces dilated cardiomyopathy. The link from Z-disc failure to chamber
      dilation is shown only in loss-of-function models.
    evidence:
    - reference: PMID:19028670
      reference_title: Cardiac-specific ablation of Cypher leads to a severe form of dilated cardiomyopathy with premature death.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Cardiac-specific Cypher knockout (CKO) mice developed a severe form of DCM
        with disrupted cardiomyocyte ultrastructure and decreased cardiac
        function, which eventually led to death before 23 weeks of age.
      explanation: >-
        In mice, cardiomyocyte ultrastructural disruption comes with dilated
        cardiomyopathy. INDIRECT because the model deletes the gene rather than
        carrying a dominant missense allele.
    - reference: PMID:11696561
      reference_title: "Ablation of Cypher, a PDZ-LIM domain Z-line protein, causes a severe form of congenital myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-

  evidence:
  - reference: PMID:14662268
    reference_title: Mutations in Cypher/ZASP in patients with dilated cardiomyopathy and left ventricular non-compaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that mutated Cypher/ZASP can cause DCM and INLVM and
      identify a mechanistic basis.
    explanation: The founding report's conclusion that LDB3 variants cause the disease.
  - reference: PMID:19377068
    reference_title: Impaired binding of ZASP/Cypher with phosphoglucomutase 1 is associated with dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Most of the mutations were found in exons 4 and 10 of ZASP/Cypher gene LDB3
      and both exons were expressed preferentially in the heart.
    explanation: >-
      Places the reported dilated cardiomyopathy alleles in cardiac-preferred
      exons. This is the paper's framing of earlier human reports.
  - reference: PMID:11696561
    reference_title: "Ablation of Cypher, a PDZ-LIM domain Z-line protein, causes a severe form of congenital myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies demonstrated that individual domains within Cypher localize
      independently to the Z-line via interactions with alpha-actinin or other
      Z-line components.
    explanation: Grounds the alpha-actinin binding function of the normal protein at the Z-line.
  - reference: PMID:36253531
    reference_title: Biallelic loss of LDB3 leads to a lethal pediatric dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting that heterozygous missense variants in the LDB3 gene may be more
      deleterious than heterozygous loss-of-function variants in this gene.
    explanation: >-
      Heterozygous loss-of-function carriers in the recessive families were
      asymptomatic (one set of parents declined examination). The authors infer
      that dominant disease is not simple haploinsufficiency.
  downstream:
  - target: Altered ZASP Signalling-Partner Binding
    causal_link_type: DIRECT
    description: >-
      Disease alleles change ZASP binding to protein kinase C (D626N, increased)
      and to phosphoglucomutase 1 (exon 4 and 10 alleles, reduced).
    evidence:
    - reference: PMID:14660611
      reference_title: A Cypher/ZASP mutation associated with dilated cardiomyopathy alters the binding affinity to protein kinase C.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        It was demonstrated by both assays that the D626N mutation of Cypher/ZASP
        increased the affinity of the LIM domain for protein kinase C
      explanation: Yeast two-hybrid and pull-down assays show the allele changes PKC binding directly.
    - reference: PMID:19377068
      reference_title: Impaired binding of ZASP/Cypher with phosphoglucomutase 1 is associated with dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Two LDB3 mutations in exon 4 (Ser189Leu and Thr206Ile) and another
        mutation in exon 10 (Ile345Met) reduced the binding to PGM1.
      explanation: Binding assays show three dilated cardiomyopathy alleles reduce PGM1 binding.
  - target: Z-Disc Cytoskeletal Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cells transfected with mutant ZASP show cytoskeletal disarray. The steps
      between the variant and the disarray are not defined.
    evidence:
    - reference: PMID:14662268
      reference_title: Mutations in Cypher/ZASP in patients with dilated cardiomyopathy and left ventricular non-compaction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        In vitro studies showed cytoskeleton disarray in cells transfected with
        mutated Cypher/ZASP.
      explanation: >-
        Transfection overexpresses the mutant protein in cultured cells, so this
        is an inference about the heterozygous heart, not a direct observation in
        patient myocardium.
  - target: Disturbed Cardiomyocyte Ion Currents
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In a transgenic mouse, cardiac expression of S196L ZASP altered L-type
      calcium and sodium currents. ZASP complexes with both channels.
    evidence:
    - reference: PMID:20852297
      reference_title: "A ZASP missense mutation, S196L, leads to cytoskeletal and electrical abnormalities in a mouse model of cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Electrophysiological analysis on isolated S196L cardiomyocytes
        demonstrated that the L-type Ca(2+) currents and Na(+) currents were
        altered.
      explanation: >-
        Cardiomyocytes from transgenic S196L mice show altered currents. The
        mutant is expressed on a wild-type background, so this does not
        reproduce the human heterozygous dosage.
  - target: Left ventricular noncompaction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Heterozygous LDB3 variants are associated with noncompaction, but no study
      describes how they disturb ventricular compaction.
    evidence:
    - reference: PMID:16427346
      reference_title: Genetic analysis in patients with left ventricular noncompaction and evidence for genetic heterogeneity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A 1876G>A substitution changing an aspartic acid to asparagine (D626N) was
        identified in LDB3 in four members of two families with LVNC.
      explanation: Genotype-phenotype association in two families; no mechanism is tested.
  - target: Hypertrophic cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Rare LDB3 variants are reported in hypertrophic cardiomyopathy probands. How
      a Z-disc variant would produce hypertrophy is not described. Whether LDB3
      causes hypertrophic cardiomyopathy at all is disputed (see the CMH24
      subtype and discussions).
    evidence:
    - reference: PMID:17097056
      reference_title: Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thirteen of the 239 patients (5.4%) had one of 13 distinct HCM-associated
        Z-disc mutations involving residues highly conserved across species and
        absent in 600 reference alleles: LDB3 (6), ACTN2 (3), TCAP (1), CSRP3 (1),
        and VCL (2).
      explanation: Case-only association in six LDB3 probands; no mechanism is tested.
- name: Altered ZASP Signalling-Partner Binding
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Disease alleles change which partners ZASP holds at the Z-disc. D626N in
    the third LIM domain increases binding to protein kinase C. The exon 4
    alleles S189L and T206I, and I345M in exon 10, reduce binding to
    phosphoglucomutase 1 (PGM1). Under stress, ZASP normally anchors PGM1 at
    the Z-disc. All of this comes from binding assays and cultured
    cardiomyocytes, not from patient tissue.

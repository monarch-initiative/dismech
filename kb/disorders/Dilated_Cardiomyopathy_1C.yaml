    evidence_source: IN_VITRO
    snippet: >-
      It was demonstrated by both assays that the D626N mutation of Cypher/ZASP
      increased the affinity of the LIM domain for protein kinase C
    explanation: Yeast two-hybrid and pull-down assays show the allele changes PKC binding directly.
  - reference: PMID:19377068
    reference_title: Impaired binding of ZASP/Cypher with phosphoglucomutase 1 is associated with dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two LDB3 mutations in exon 4 (Ser189Leu and Thr206Ile) and another
      mutation in exon 10 (Ile345Met) reduced the binding to PGM1.
    explanation: Binding assays show three dilated cardiomyopathy alleles reduce PGM1 binding.
  downstream:
  - target: Maladaptive Cardiomyocyte Stress Signalling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link: changed PKC binding by the LIM domains could disturb PKC
      signalling. The only in vivo support is that mice lacking the
      LIM-containing long isoforms show PKC pathway changes. That is a deletion
      model, not a missense allele.
    evidence:
    - reference: PMID:21303826
      reference_title: Selective deletion of long but not short Cypher isoforms leads to late-onset dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        At a young age, preceding development of cardiomyopathy, hearts from these
        mutants exhibited defects in both Z-line ultrastructure and specific
        aberrations in calcineurin-NFAT and protein kinase C pathways.
      explanation: >-
        Loss of the LIM-domain isoforms disturbs PKC signalling in mouse heart
        before cardiomyopathy appears. Extending this to the human D626N
        gain-of-affinity allele is an inference.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Both binding studies propose that the binding change contributes to
      dilated cardiomyopathy. Neither tests it in the heart.
    evidence:
    - reference: PMID:14660611
      reference_title: A Cypher/ZASP mutation associated with dilated cardiomyopathy alters the binding affinity to protein kinase C.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        suggesting a novel biochemical mechanism of the pathogenesis of dilated
        cardiomyopathy
      explanation: >-
        The PKC-binding study proposes, without testing in heart tissue, that the
        affinity change underlies dilated cardiomyopathy.
    - reference: PMID:19377068
      reference_title: Impaired binding of ZASP/Cypher with phosphoglucomutase 1 is associated with dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        ZASP/Cypher anchors PGM1 to Z-disc under conditions of stress. The
        impaired binding of PGM1 to ZASP/Cypher might be involved in the
        pathogenesis of DCM.
      explanation: The authors frame the link to dilated cardiomyopathy as a possibility.
- name: Z-Disc Cytoskeletal Disorganization
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    ZASP is not needed to build the Z-disc but keeps it intact during
    contraction, acting as a linker-strut. Mutant ZASP disarranges the
    cytoskeleton of transfected cells. Loss of Cypher in mice fragments and
    disorganizes Z-lines in heart and skeletal muscle. No patient myocardium
    with a dominant CMD1C allele has been examined at this level in the cited
    sources.

- name: Disturbed Cardiomyocyte Ion Currents
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    ZASP sits in a complex with the L-type calcium channel Cav1.2 and the sodium
    channel Nav1.5. In transgenic mice with cardiac expression of S196L,
    isolated cardiomyocytes have altered L-type calcium and sodium currents,
    and the mice develop conduction defects and atrioventricular block by 3
    months. Human electrophysiological data for this mechanism are lacking.
  cell_types:
  - preferred_term: Cardiomyocyte

has_subtypes:
- name: CMD1C
  display_name: Dilated cardiomyopathy 1C, with or without left ventricular noncompaction
  description: >-
    The dilated presentation: left ventricular dilation with systolic
    dysfunction, with or without noncompaction. It carries the founding Vatta
    alleles and the late-onset Japanese D626N family. It has no separate term
    because it is the primary sense of MONDO:0011094, the entry's own disease
    term.
  genes:
  - preferred_term: LDB3
    term:
      id: hgnc:15710
      label: LDB3
  evidence:
  - reference: PMID:14662268
    reference_title: Mutations in Cypher/ZASP in patients with dilated cardiomyopathy and left ventricular non-compaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five mutations in six probands (6% of cases) were identified in patients
      with familial or sporadic DCM or INLVM.
    explanation: >-
      The founding screen identified LDB3 variants in probands with dilated
      cardiomyopathy or noncompaction. The cached abstract does not split the six
      probands between the two presentations.
  - reference: PMID:14660611
    reference_title: A Cypher/ZASP mutation associated with dilated cardiomyopathy alters the binding affinity to protein kinase C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A D626N mutation located within the third LIM domain was identified in a
      familial case but not found in the unrelated controls.
    explanation: >-
      A second, independent dilated cardiomyopathy family carrying a
      heterozygous LDB3 LIM-domain variant.
- name: LVNC3
  display_name: Left ventricular noncompaction 3
  description: >-
    The noncompaction presentation. The founding screen included probands with
    isolated noncompaction, and the D626N allele seen in a Japanese dilated
    cardiomyopathy family was also found in two Japanese noncompaction
    families. No separate MONDO term exists for this presentation.
  genes:
  - preferred_term: LDB3
    term:
      id: hgnc:15710
      label: LDB3
  evidence:
  - reference: PMID:16427346
    reference_title: Genetic analysis in patients with left ventricular noncompaction and evidence for genetic heterogeneity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 1876G>A substitution changing an aspartic acid to asparagine (D626N) was
      identified in LDB3 in four members of two families with LVNC.
    explanation: >-
      Documents the same LDB3 allele in families with noncompaction, showing that
      one allele can produce both the dilated and the noncompaction presentation.
  - reference: PMID:14662268
    reference_title: Mutations in Cypher/ZASP in patients with dilated cardiomyopathy and left ventricular non-compaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that mutated Cypher/ZASP can cause DCM and INLVM and
      identify a mechanistic basis.
    explanation: The founding report includes isolated noncompaction in the LDB3 spectrum.
- name: CMH24
  display_name: Cardiomyopathy, familial hypertrophic, 24
  description: >-
    The hypertrophic presentation. It has no separate disease term because
    "cardiomyopathy, hypertrophic, 24" is an exact MONDO synonym of
    MONDO:0011094 itself. It rests on rare LDB3 variants in myofilament-negative hypertrophic
    cardiomyopathy probands. ClinGen rates LDB3 as Disputed for hypertrophic
    cardiomyopathy (see discussions).
  genes:
  - preferred_term: LDB3
    term:
      id: hgnc:15710
      label: LDB3
  evidence:
  - reference: PMID:17097056
    reference_title: Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen of the 239 patients (5.4%) had one of 13 distinct HCM-associated
      Z-disc mutations involving residues highly conserved across species and
      absent in 600 reference alleles: LDB3 (6), ACTN2 (3), TCAP (1), CSRP3 (1),
      and VCL (2).
    explanation: >-
      Six of 239 myofilament-negative hypertrophic cardiomyopathy probands carried
      rare LDB3 variants. Segregation was not reported in the abstract.
  - reference: CGGV:assertion_1089e729-07ab-4d5b-8fed-1a2ad3f37fd2-2026-01-27T170000.000Z
    reference_title: LDB3 / hypertrophic cardiomyopathy (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: "LDB3 | HGNC:15710 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Disputed"
    explanation: >-
      ClinGen's hereditary cardiovascular disease panel classifies LDB3 for
      hypertrophic cardiomyopathy (MONDO:0005045) as Disputed, which cuts
      against LDB3 as a cause of this presentation. It is a different MONDO
      term from this entry, so it is not recorded as gene-disease validity.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous missense alleles are reported in familial and sporadic cases.
    Segregation evidence is thin. In the D626N dilated cardiomyopathy family all
    affected siblings tested carried the variant. The D117N allele failed to
    segregate in two Bedouin families. One healthy heterozygous carrier is
    reported: the father of a Barth syndrome proband who also carried a TAZ
    variant transmitted the LDB3 T350I allele and is healthy, although he shows
    prominent left ventricular trabeculation. No study counts unaffected and
    affected carriers of a disease-associated allele, so penetrance is recorded
    as UNKNOWN.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: UNKNOWN
  evidence:
  - reference: PMID:14660611
    reference_title: A Cypher/ZASP mutation associated with dilated cardiomyopathy alters the binding affinity to protein kinase C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A family study of the patient showed that all affected siblings tested had
      the same mutation.
    explanation: >-
      Co-occurrence of the heterozygous allele with disease in affected sibs is
      the strongest segregation datum in the cached record.
  - reference: PMID:17394203
    reference_title: Barth syndrome associated with compound hemizygosity and heterozygosity of the TAZ and LDB3 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: and one of paternal origin in the LDB3 gene
    explanation: >-
      The proband's LDB3 variant (T350I) was inherited from his father. The
      allele name in square brackets is left out because the validator treats
      square brackets as an editorial insertion.
  - reference: PMID:17394203
    reference_title: Barth syndrome associated with compound hemizygosity and heterozygosity of the TAZ and LDB3 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mother, brother and father are healthy; although the latter two show
      prominent left ventricle trabeculation without dysfunction.
    explanation: >-
      The LDB3-carrying father is healthy, apart from trabeculation without
      dysfunction, so at least one heterozygous carrier is unaffected. This
      supports incomplete or age-dependent penetrance, but one carrier does not
      give a rate.
  - reference: CGGV:assertion_7756e3c0-5a16-49b8-ac0f-220e79a4fa99-2026-03-04T170000.000Z
    reference_title: LDB3 / dilated cardiomyopathy 1C (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LDB3 | HGNC:15710 | dilated cardiomyopathy 1C | MONDO:0011094 | AD | Limited"
    explanation: >-
      ClinGen curated the relationship with an autosomal dominant mode of
      inheritance.
prevalence:
- population: Published LDB3 cardiomyopathy reports
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The cited primary reports describe about 16 heterozygous index cases. These
    are 6 probands from the founding 100-proband screen, 1 Japanese dilated
    cardiomyopathy family (D626N, from 96 patients), 2 Japanese noncompaction
    families (D626N, found in four members of two families with LVNC), 6
    hypertrophic cardiomyopathy probands from 239 screened, and 1 oligogenic
    case that also carried MYH6 and SYNE1 variants. Two further LDB3 carriers
    are reported outside these counts: a Barth syndrome proband with a TAZ
    variant plus paternal LDB3 T350I, and one ARVC family (c.1051A>G), a
    disease ClinGen disputes for LDB3. The D117N allele was later shown not to
    segregate. It was first reported in two sporadic cases. The cached
    abstracts do not say whether those were among the founding six probands,
    so up to 2 of the ~16 index cases may rest on a refuted allele. Whether
    the two D626N noncompaction families are related to the D626N dilated
    family is not stated. GeneReviews attributes under 1% of dilated
    cardiomyopathy to LDB3. No population prevalence has been measured.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "LDB3 AD <1% Limited HCM; myofibrillar myopathy"
    explanation: >-
      The GeneReviews gene table row for LDB3: autosomal dominant, under 1% of
      dilated cardiomyopathy, ClinGen Limited, allelic with hypertrophic
      cardiomyopathy and myofibrillar myopathy.
  - reference: PMID:14662268
    reference_title: Mutations in Cypher/ZASP in patients with dilated cardiomyopathy and left ventricular non-compaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five mutations in six probands (6% of cases) were identified in patients
      with familial or sporadic DCM or INLVM.
    explanation: The largest single set of index cases in the literature.
pathophysiology:
- name: LDB3 Heterozygous Missense Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: PROVISIONAL
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    A heterozygous germline missense variant in LDB3 alters ZASP/Cypher, a Z-disc
    scaffold that binds alpha-actinin through its PDZ domain and protein kinase C
    through its C-terminal LIM domains. Reported alleles cluster in the
    cardiac-preferred exons 4 and 10 (S196L/S189L, T213I/T206I, I352M/I345M) or
    in the third LIM domain (D626N). Whether these act by gain of function,
    dominant interference or partial loss is unresolved, so the functional
    impact is recorded as UNKNOWN. Heterozygous loss-of-function carriers in
    the recessive families were reported as asymptomatic, which argues against
    simple haploinsufficiency.

  prompt: How do heterozygous LDB3 variants produce noncompaction rather than, or as well as, dilation?
  attaches_to:
  - phenotypes#Left ventricular noncompaction
  rationale: >-
    The same D626N allele was reported with late-onset dilated cardiomyopathy in
    one family and with noncompaction in two others. No study explains how the
    variant affects trabecular compaction, so the edge to noncompaction is
    recorded with unknown intermediates.
  evidence:

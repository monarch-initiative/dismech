notes: >-
  Scope. MONDO:0011094 (OMIM 601493) covers three allelic presentations of
  heterozygous LDB3 disease: dilated cardiomyopathy with or without
  noncompaction, noncompaction (LVNC3), and hypertrophic cardiomyopathy (CMH24).
  They are recorded as has_subtypes rows without separate disease terms, because
  MONDO has none. Recessive LDB3 disease (dilated cardiomyopathy 2L,
  MONDO:0979236) is excluded and appears only as a differential. LDB3
  myofibrillar myopathy (zaspopathy, MFM4) is curated in Myofibrillar_Myopathy
  and is cross-referenced here, not duplicated. The Hypertrophic_Cardiomyopathy_15,
  Hypertrophic_Cardiomyopathy_25 and Left_Ventricular_Noncompaction entries cite
  the same Z-disc cohort (PMID:17097056) but do not claim this concept. Their
  six-LDB3-carrier count matches the count used here. GeneReviews: `just
  check-genereviews --online` reports the Dilated Cardiomyopathy Overview
  (PMID:20301486, NBK1309) as TAGGED, matched by identity, and StatPearls as
  NO_CHAPTER. No LDB3-specific chapter exists. The cited
  url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
  is the full text of that same chapter, whose PubMed record is abstract-only.
  It supplies the LDB3 gene-table row, the DCM definition and the general
  family-screening guidance quoted here. The deep-research report
  said one mechanism study (PMID:39113806) used human stem-cell
  cardiomyocytes. The cached text describes Cypher-depleted mice, and it is
  curated that way here.

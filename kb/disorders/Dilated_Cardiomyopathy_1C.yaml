animal_models:
- name: Global Cypher knockout mouse
  species: Mouse
  genotype: Ldb3 (Cypher) null, homozygous
  publication: PMID:11696561
  description: >-
    Homozygous loss of both Cypher isoforms causes a severe congenital myopathy
    with fragmented, disorganized Z-lines in skeletal and cardiac muscle, and
    death soon after birth.
  modeled_mechanisms:
  - target: Z-Disc Cytoskeletal Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Z-line maintenance fails without Cypher.
    limitations: >-
      A homozygous null allele models recessive LDB3 disease, not a dominant
      missense allele, and the lethal skeletal myopathy dominates.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The human cause is one heterozygous missense allele. The model removes
        both copies, so it cannot show any gain-of-function or dominant effect
        of the variant protein.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Neonatal mouse striated muscle shows the defect. Adult human myocardium
        with a dominant allele has not been studied at the same level.
    evidence:
    - reference: PMID:11696561
      reference_title: "Ablation of Cypher, a PDZ-LIM domain Z-line protein, causes a severe form of congenital myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cypher knockout mice display a severe form of congenital myopathy and die
        postnatally from functional failure in multiple striated muscles.
      explanation: Shows the severity and skeletal predominance of the null phenotype.
- name: Cardiac-specific Cypher knockout mouse
  species: Mouse
  genotype: Cardiomyocyte-restricted and adult-inducible Ldb3 deletion
  publication: PMID:19028670
  description: >-
    Cardiac deletion, in development or in adult myocardium, causes severe
    dilated cardiomyopathy with ultrastructural disruption and death before 23
    weeks. ERK and Stat3 activity is increased.
  modeled_mechanisms:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Cardiac loss of Cypher is enough to cause dilated cardiomyopathy.
    limitations: >-
      Loss of function on both alleles. It is much more severe and earlier than
      the late-onset dominant human disease.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The deletion removes the protein, but CMD1C alleles are missense
        variants that keep the protein and change its binding.
    evidence:
    - reference: PMID:19028670
      reference_title: Cardiac-specific ablation of Cypher leads to a severe form of dilated cardiomyopathy with premature death.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A similar phenotype was observed in inducible cardiac-specific CKO mice in
        which Cypher was specifically ablated in adult myocardium.
      explanation: Adult deletion also causes the dilated phenotype, so it is not only developmental.
  - target: Maladaptive Cardiomyocyte Stress Signalling
    relationship: MEASURES
    fidelity: LOW
    model_scale: CELLULAR
    description: ERK and Stat3 signalling increase.
    limitations: Signalling was measured in deletion hearts, not in hearts with a missense allele.
    evidence:
    - reference: PMID:19028670
      reference_title: Cardiac-specific ablation of Cypher leads to a severe form of dilated cardiomyopathy with premature death.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In both cardiac-specific CKO models, ERK and Stat3 signaling pathways were
        augmented.
      explanation: Signalling readout in the model.
- name: Cypher long-isoform knockout mouse
  species: Mouse
  genotype: Selective deletion of LIM-domain-containing Cypher long isoforms
  publication: PMID:21303826
  description: >-
    Losing only the long isoforms causes late-onset dilated cardiomyopathy with
    fibrosis and calcification. It is preceded by Z-line defects and changed
    calcineurin-NFAT and PKC signalling. Losing only the short isoforms has no
    effect.
  modeled_mechanisms:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Late-onset course resembles the dominant human disease better than full deletion.
    limitations: Isoform deletion, not a missense allele; the mice also have growth retardation and partial neonatal lethality.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The model removes the LIM-domain isoforms. The human D626N allele keeps
        them and increases their PKC affinity.
    evidence:
    - reference: PMID:21303826
      reference_title: Selective deletion of long but not short Cypher isoforms leads to late-onset dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Surviving mutants exhibited growth retardation and late-onset dilated
        cardiomyopathy, which was associated with cardiac fibrosis and
        calcification, leading to premature adult mortality.
      explanation: Late-onset dilated phenotype in the isoform model.
  - target: Maladaptive Cardiomyocyte Stress Signalling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Calcineurin-NFAT and PKC pathway changes come before cardiomyopathy.
    limitations: Shows the pathway changes come with isoform loss, not with dominant missense alleles.
    evidence:
    - reference: PMID:21303826
      reference_title: Selective deletion of long but not short Cypher isoforms leads to late-onset dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At a young age, preceding development of cardiomyopathy, hearts from these
        mutants exhibited defects in both Z-line ultrastructure and specific
        aberrations in calcineurin-NFAT and protein kinase C pathways.
      explanation: Signalling changes come before cardiomyopathy.
- name: S196L transgenic mouse
  species: Mouse
  genotype: Cardiac-restricted transgenic expression of ZASP S196L on a wild-type background
  publication: PMID:20852297
  description: >-
    The only model carrying a CMD1C allele. Mice develop conduction defects and
    atrioventricular block by 3 months and hemodynamic dysfunction consistent
    with dilated cardiomyopathy by 10 months. Isolated cardiomyocytes show
    altered L-type calcium and sodium currents.
  modeled_mechanisms:
  - target: Disturbed Cardiomyocyte Ion Currents
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Altered calcium and sodium currents in mutant cardiomyocytes.
    limitations: >-
      Transgenic overexpression alongside two endogenous wild-type alleles, not
      a heterozygous knock-in. Human current measurements are not available for
      comparison.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        Transgene dosage stands in for the 1:1 mutant to wild-type ratio of a
        heterozygous patient. Expression level was not matched to human
        myocardium.
    evidence:
    - reference: PMID:20852297
      reference_title: "A ZASP missense mutation, S196L, leads to cytoskeletal and electrical abnormalities in a mouse model of cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Electrophysiological analysis on isolated S196L cardiomyocytes
        demonstrated that the L-type Ca(2+) currents and Na(+) currents were
        altered.
      explanation: Current changes in the model.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Later onset of ventricular dysfunction after the conduction defect.
    limitations: Dosage differs from heterozygous patients; only one allele was modelled.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        Transgene dosage stands in for the 1:1 mutant to wild-type ratio of a
        heterozygous patient.
    evidence:
    - reference: PMID:20852297
      reference_title: "A ZASP missense mutation, S196L, leads to cytoskeletal and electrical abnormalities in a mouse model of cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ten month-old S196L mice developed hemodynamic dysfunction consistent with
        DCM, whereas 3-month-old S196L mice presented with cardiac conduction
        defects and atrioventricular block.
      explanation: Time course of the model phenotype.
discussions:
- discussion_id: dominant_mechanism_unresolved
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do dominant LDB3 missense alleles act through the same pathways that
    knockout mice reveal?
  attaches_to:
  - pathophysiology#Maladaptive Cardiomyocyte Stress Signalling
  - pathophysiology#Z-Disc Cytoskeletal Disorganization
  - animal_models#Global Cypher knockout mouse
  - animal_models#Cardiac-specific Cypher knockout mouse
  rationale: >-
    Nearly all mechanistic mouse work deletes Cypher or its isoforms. That
    matches recessive LDB3 disease. Heterozygous loss-of-function carriers in
    the recessive families were reported as asymptomatic. The one human allele
    tested biochemically for PKC binding (D626N) increases binding rather than
    removing it. The only allele-specific mouse is a transgenic overexpressor.
    So the signalling and Z-disc nodes are carried over from loss-of-function
    models, and no heterozygous knock-in or patient iPSC model tests them.
  evidence:
  - reference: PMID:36253531
    reference_title: Biallelic loss of LDB3 leads to a lethal pediatric dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting that heterozygous missense variants in the LDB3 gene may be more
      deleterious than heterozygous loss-of-function variants in this gene.
    explanation: >-
      Heterozygous loss-of-function carriers in the recessive families were
      asymptomatic (one set of parents declined examination). The authors infer
      that dominant disease is not simple haploinsufficiency.
  - reference: PMID:14660611
    reference_title: A Cypher/ZASP mutation associated with dilated cardiomyopathy alters the binding affinity to protein kinase C.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It was demonstrated by both assays that the D626N mutation of Cypher/ZASP
      increased the affinity of the LIM domain for protein kinase C
    explanation: Yeast two-hybrid and pull-down assays show the allele changes PKC binding directly.
- discussion_id: hcm_presentation_disputed
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Should the CMH24 hypertrophic presentation remain inside this concept when
    ClinGen disputes LDB3 for hypertrophic cardiomyopathy?
  attaches_to:
  - has_subtypes#CMH24
  - phenotypes#Hypertrophic cardiomyopathy
  rationale: >-
    MONDO lists cardiomyopathy, hypertrophic, 24 as an exact synonym of
    MONDO:0011094, so the entry keeps it. The supporting data are case-only:
    six LDB3 carriers among 239 myofilament-negative probands, with no
    segregation in the abstract. ClinGen's hereditary cardiovascular panel
    classified LDB3 for hypertrophic cardiomyopathy as Disputed in January 2026.
  evidence:
  - reference: CGGV:assertion_1089e729-07ab-4d5b-8fed-1a2ad3f37fd2-2026-01-27T170000.000Z
    reference_title: LDB3 / hypertrophic cardiomyopathy (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LDB3 | HGNC:15710 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Disputed"
    explanation: The current ClinGen tier for LDB3 in hypertrophic cardiomyopathy.
  - reference: PMID:17097056
    reference_title: Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen of the 239 patients (5.4%) had one of 13 distinct HCM-associated
      Z-disc mutations involving residues highly conserved across species and
      absent in 600 reference alleles: LDB3 (6), ACTN2 (3), TCAP (1), CSRP3 (1),
      and VCL (2).
    explanation: The case-only evidence behind CMH24.
- discussion_id: variant_level_doubt
  kind: CONTROVERSY
  status: OPEN
  prompt: Which reported dominant LDB3 alleles are truly pathogenic?
  attaches_to:
  - genetic#LDB3
  rationale: >-
    The D117N allele was first reported in two sporadic cases. It did not
    segregate in two Bedouin families. It was found on 11 of 210 Bedouin
    chromosomes (5.2%, an allele frequency, all heterozygous).
    The M456R case also carried MYH6 and SYNE1 variants. Most LDB3 missense
    variants on clinical panels are of uncertain significance, which fits the
    Limited classification.
  evidence:
  - reference: PMID:26419279
    reference_title: D117N in Cypher/ZASP may not be a causative mutation for dilated cardiomyopathy and ventricular arrhythmias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, p.(D117N) did not segregate as the causative mutation in these
      families, i.e. it was not present in some patients and was found in
      several individuals who had no clinical manifestations.
    explanation: Direct segregation evidence against one allele.
  - reference: PMID:26419279
    reference_title: D117N in Cypher/ZASP may not be a causative mutation for dilated cardiomyopathy and ventricular arrhythmias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

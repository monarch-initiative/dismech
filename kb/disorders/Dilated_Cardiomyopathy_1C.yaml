    preferred_term: myofibrillar myopathy 4
    term:
      id: MONDO:0012277
      label: myofibrillar myopathy 4
  description: >-
    Dominant LDB3 zaspopathy is a late-onset skeletal myofibrillar myopathy,
    curated under Myofibrillar_Myopathy. Cardiac involvement occurs in a
    minority, so a patient with cardiomyopathy and distal weakness may belong to
    this allelic disorder.
  distinguishing_features:
  - Skeletal myopathy with distal-predominant weakness and myofibrillar pathology on biopsy
  - Alleles mostly in exon 6 (A147T, A165V) rather than the cardiac-preferred exons
  evidence:
  - reference: PMID:15668942
    reference_title: Mutations in ZASP define a novel form of muscular dystrophy in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dominant inheritance was apparent in seven patients, cardiac involvement in
      three, and signs of peripheral neuropathy in five.
    explanation: Cardiac involvement in 3 of 11 LDB3 myofibrillar myopathy patients.
- name: Barth syndrome
  disease_term:
    preferred_term: Barth syndrome
    term:
      id: MONDO:0010543
      label: Barth syndrome
  description: >-
    X-linked TAZ disease presenting with dilated cardiomyopathy and
    noncompaction in boys. One reported proband carried a TAZ variant together
    with an inherited LDB3 variant.
  distinguishing_features:
  - X-linked inheritance with neutropenia, skeletal myopathy and 3-methylglutaconic aciduria
  evidence:
  - reference: PMID:17394203
    reference_title: Barth syndrome associated with compound hemizygosity and heterozygosity of the TAZ and LDB3 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Barth syndrome is an X-linked recessive disorder caused by the tafazzin
      (TAZ) gene mutations and includes dilated cardiomyopathy (DCM) with left
      ventricular non-compaction, neutropenia, skeletal myopathy, abnormal
      mitochondria and 3-methylglutaconic aciduria.
    explanation: Overlapping cardiac phenotype with distinguishing systemic features.
- name: Arrhythmogenic right ventricular cardiomyopathy
  disease_term:
    preferred_term: arrhythmogenic right ventricular cardiomyopathy
    term:
      id: MONDO:0016587
      label: arrhythmogenic right ventricular cardiomyopathy
  description: >-
    Left-dominant arrhythmogenic cardiomyopathy can present as dilated
    cardiomyopathy. An LDB3 variant was also reported in one ARVC family. ClinGen
    classifies LDB3 for ARVC as Disputed.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Arrhythmogenic right ventricular cardiomyopathy (ARVC) with predominant
      left ventricular involvement may present as DCM
    explanation: GeneReviews names ARVC as a dilated cardiomyopathy mimic.
  - reference: CGGV:assertion_8ebdc3e8-2e0a-4a5e-8906-8e616d14008b-2019-09-12T160000.000Z
    reference_title: LDB3 / arrhythmogenic right ventricular cardiomyopathy (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LDB3 | HGNC:15710 | arrhythmogenic right ventricular cardiomyopathy | MONDO:0016587 | AD | Disputed"
    explanation: ClinGen's ARVC panel disputes LDB3 as an ARVC gene.
  - reference: PMID:25041374
    reference_title: A mutation in the Z-line Cypher/ZASP protein is associated with arrhythmogenic right ventricular cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous missense mutation in LDB3 c.1051A>G was identified.
    explanation: The single ARVC family report involving LDB3.

name: Dilated Cardiomyopathy 1C
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
synonyms:
- CMD1C
- dilated cardiomyopathy type 1C
- cardiomyopathy, dilated, 1C, with or without LVNC
- cardiomyopathy, dilated, 1C, with or without left ventricular noncompaction
- cardiomyopathy, hypertrophic, 24
- CMH24
- HCM24
- left ventricular noncompaction 3
- LVNC3
- LDB3-related cardiomyopathy
- ZASP-related cardiomyopathy
description: >-
  Dilated cardiomyopathy 1C (CMD1C) is the autosomal dominant cardiomyopathy
  attributed to heterozygous missense variants in LDB3, which encodes ZASP
  (Cypher), a PDZ-LIM scaffold protein of the sarcomeric Z-disc in cardiac and
  skeletal muscle. The MONDO concept (MONDO:0011094; OMIM 601493) spans three
  allelic presentations: dilated cardiomyopathy with or without left
  ventricular noncompaction (CMD1C), left ventricular noncompaction (LVNC3),
  and hypertrophic cardiomyopathy (CMH24). The founding screen found five LDB3
  missense variants in six of 100 probands with left ventricular dysfunction.
  Later reports added a late-onset familial D626N allele and Z-disc variants in
  hypertrophic cardiomyopathy probands. Cell and biochemical studies show that
  disease alleles disarrange the cytoskeleton and change ZASP binding to protein
  kinase C and phosphoglucomutase 1. A transgenic mouse expressing the S196L
  allele develops conduction defects and later ventricular dysfunction. The
  evidence base is small: ClinGen classifies the autosomal dominant LDB3-CMD1C
  relationship as Limited, rates LDB3 as Disputed for hypertrophic
  cardiomyopathy, and one reported allele (D117N) failed to segregate with
  disease. Biallelic loss-of-function LDB3 disease (dilated cardiomyopathy 2L)
  and LDB3 myofibrillar myopathy (zaspopathy) are separate entities.

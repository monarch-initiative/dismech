inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Germline PHOX2B variants are heterozygous and act dominantly. They arise
    de novo in most congenital central hypoventilation syndrome, but familial
    transmission is documented, and the first report of germline PHOX2B
    predisposition to neuroblastoma was in a familial case.
  evidence:
  - reference: PMID:15024693
    reference_title: "Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on germline mutations of PHOX2B in both a familial case of NB and a patient with the HSCR-NB association."
    explanation: >-
      The report that established germline PHOX2B predisposition, in a
      familial neuroblastoma case and in a patient with the Hirschsprung
      disease and neuroblastoma association. The familial case is what
      supports dominant transmission; the paper reports two index
      observations rather than a pedigree series.
has_subtypes:
- name: NPARM
  display_name: Non-polyalanine repeat mutation carriers
  description: >-
    Missense, frameshift or truncating PHOX2B variants. This is the
    high-risk class, with a neural crest tumour risk of about 45 per cent,
    and it is the class that predisposes to malignant rather than merely
    differentiated tumours.
  evidence:
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense, frameshift, or truncating mutations in PHOX2B (nonpolyalanine repeat mutations, or NPARM) predispose a small subset of these patients to develop NB or related tumors"
    explanation: >-
      Defines the variant class and its tumour predisposition. A workshop
      review summarising the cited literature rather than reporting a cohort
      of its own.
- name: PARM
  display_name: Polyalanine repeat mutation carriers
  description: >-
    In-frame expansions of the 20-alanine repeat tract, which account for
    most congenital central hypoventilation syndrome. Tumour risk is about 1
    to 2 per cent and rises with the length of the expansion; essentially all
    reported tumours were in carriers of the largest expansions, 30 to 33
    repeats, and the tumours were typically maturing ganglioneuroblastomas
    and ganglioneuromas rather than neuroblastoma.
  evidence:
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of PHOX2B mutations in CCHS insert 5 to 13 alanines in the 20 polyalanine repeat domain, and larger polyalanine expansions are associated with worse hypoventilation and with NB or related tumors, including maturing ganglioneuroblastomas (GNB) and GNs."
    explanation: >-
      Defines the class, its usual expansion size, and the gradient of risk
      with expansion length, together with the tumour types it is associated
      with. A review's synthesis.
pathophysiology:
- name: Germline PHOX2B Variant
  description: >-
    A heterozygous germline variant in PHOX2B, the paired-like homeobox gene
    that is the master regulator of autonomic nervous system development.
    Two variant classes behave differently: polyalanine repeat expansions,
    and non-polyalanine repeat missense, frameshift or truncating variants.
    The difference in tumour risk between them is roughly thirty-fold, which
    is the central fact of this predisposition.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PHOX2B
    term:
      id: hgnc:9143
      label: PHOX2B
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: ABNORMAL
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  notes: >-
    The molecular function is marked ABNORMAL rather than LOSS_OF_FUNCTION
    because the two variant classes do not have the same effect, and the
    sources cited here characterise them by tumour risk and phenotype rather
    than by a measured change in transcriptional activity. Asserting loss of
    function for both would go beyond what is quoted.
  evidence:
  - reference: PMID:15024693
    reference_title: "Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHOX2B, therefore, stands as the first gene for which germline mutations predispose to NB."
    explanation: >-
      The paper's own statement of what it established, and the origin of
      this disease concept.
  downstream:
  - target: Disrupted Autonomic Neuroblast Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      PHOX2B governs autonomic neuronal development, and the tumours that
      arise are of that lineage. The intervening steps are not established in
      the sources cited here.
- name: Disrupted Autonomic Neuroblast Differentiation
  description: >-
    The tumours arising in PHOX2B carriers are of the sympathetic nervous
    system lineage, and are predominantly differentiated: ganglioneuroma and
    ganglioneuroblastoma more often than neuroblastoma. That skew towards
    maturation is the clearest clue that what the variant disturbs is the
    differentiation programme of autonomic neuroblasts rather than
    proliferation alone. The entry does not claim more than that, because no
    cited source establishes the mechanism.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: migratory neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: noradrenergic neuron differentiation
    modifier: ABNORMAL
    term:
      id: GO:0003357
      label: noradrenergic neuron differentiation
  notes: >-
    The process term is noradrenergic neuron differentiation rather than a
    fate-commitment term, because what the tumour spectrum suggests is
    disturbed differentiation and maturation rather than a fate decision, and
    PHOX2B governs the noradrenergic programme specifically. The cell type is
    bound at migratory neural crest cell, which is upstream of the
    sympathoadrenal progenitor these tumours arise from, because CL has no
    sympathoadrenal or sympathetic neuroblast term: searches of CL through
    the OLS4 API on 30 October 2026 for sympathoadrenal and for sympathetic
    neuroblast returned nothing, and CL:3000002 sympathetic noradrenergic
    neuron is a mature neuron rather than a progenitor. The functional work
    on PHOX2B mutants that would let this node rest on experimental evidence
    rather than on inference from tumour histology is the entry's main
    outstanding gap.
  evidence:
  - reference: PMID:26375764
    reference_title: "Oncologic Phenotype of Peripheral Neuroblastic Tumors Associated With PHOX2B Non-Polyalanine Repeat Expansion Mutations."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four tumours were \"poorly differentiated,\" and nine were differentiated, including five ganglioneuromas, three ganglioneuroblastomas, and one differentiating neuroblastoma, hence illustrating that PHOX2B NPARM are predominantly associated with differentiating tumors."
    explanation: >-
      The tumour-type distribution in thirteen tumours from non-polyalanine
      repeat mutation carriers, and the authors' reading of it. Thirteen
      tumours, so the skew is a pattern in a small series.
  downstream:
  - target: Neuroblastic Tumor
    causal_link_type: DIRECT
    description: >-
      The disturbed lineage gives rise to tumours across the neuroblastic
      spectrum.
phenotypes:
- category: Neoplastic
  name: Neuroblastic Tumor
  description: >-
    Neuroblastoma, ganglioneuroblastoma or ganglioneuroma. The risk depends
    strongly on variant class: about 45 per cent for non-polyalanine repeat
    mutations against about 1 to 2 per cent for polyalanine expansions. In
    the original series the counts were 6 of 13 patients with a missense or
    frameshift variant against 2 of 161 with an in-frame expansion. Against a
    general-population neuroblastoma incidence of about 1 in 10,000, even the
    low-risk class is raised.
  phenotype_term:
    preferred_term: Neuroblastic tumor
    term:
      id: HP:0004376
      label: Neuroblastic tumor
  evidence:
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk for a neural crest tumor for individuals with NPARMs is about 45%, whereas the risk for individuals with PARMs is about 1% to 2%, and essentially all of those with tumors had large PARMs (30-33 repeats; ref. 84)."
    explanation: >-
      The risk figures by variant class, and the observation that tumours in
      the low-risk class occurred almost entirely in carriers of the largest
      expansions. A workshop review's synthesis; see the entry notes on where
      these round figures come from.
  - reference: PMID:15657873
    reference_title: "PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, an invasive tumor (neuroblastoma) was diagnosed in 6 (46%) of 13 patients harboring either a missense or a frameshift mutation, whereas a differentiated tumor (ganglioneuroma) was diagnosed in only 2 (1.24%) of 161 patients harboring an in-frame duplication leading to an expansion of +9 alanines in one and +13 in the other."
    explanation: >-
      The underlying counts behind the round figures, and a detail the
      summaries lose: the tumours in the two classes were of different kinds,
      invasive neuroblastoma in the missense and frameshift group against
      differentiated ganglioneuroma in the expansion group.
  - reference: PMID:15024693
    reference_title: "Germline mutations of the paired-like homeobox 2B (PHOX2B) gene in neuroblastoma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with CCHS have a high predisposing risk of developing a tumor of the sympathetic nervous system (i.e., 5%-10% occurrence of NB, ganglioneuroblastoma, and ganglioneuroma-versus 1/10,000 in the general population) (Rohrer et al. 2002)."
    explanation: >-
      The general-population comparator that makes the carrier risks
      meaningful. The sentence is in the paper's introduction and cites an
      earlier source, and its 5 to 10 per cent figure is for congenital
      central hypoventilation syndrome as a whole rather than by variant
      class, which is why it is graded BACKGROUND and INDIRECT.
  - reference: PMID:26375764
    reference_title: "Oncologic Phenotype of Peripheral Neuroblastic Tumors Associated With PHOX2B Non-Polyalanine Repeat Expansion Mutations."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, three patients had stage 4 and one patient had stage 3 disease. Segmental chromosomal alterations, correlating with poor prognosis, were found in all the six tumors analyzed by array-comparative genomic hybridization."
    explanation: >-
      The counterweight to the differentiation skew above, from the same
      series: advanced stage in four patients and adverse genomic profiles in
      every tumour tested. Six tumours were tested, so the genomic finding
      rests on a small subset.
  - reference: PMID:26375764
    reference_title: "Oncologic Phenotype of Peripheral Neuroblastic Tumors Associated With PHOX2B Non-Polyalanine Repeat Expansion Mutations."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, this tumor predisposition syndrome may also be associated with poorly differentiated tumors with unfavorable genomic profiles and clinically aggressive behaviors. The intrafamilial variability and the unpredictable tumor prognosis should be considered in genetic counseling."
    explanation: >-
      The authors' own conclusion, including the counselling implication that
      prognosis in a carrier is unpredictable. This is why the entry does not
      present the predisposition as one to benign tumours.
genetic:
- name: PHOX2B
  association: Germline PHOX2B variant, neuroblastic tumour predisposition
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PHOX2B
    term:
      id: hgnc:9143
      label: PHOX2B
  notes: >-
    Risk depends on variant class, not merely on carrier status, which is
    unusual enough to be the main curation point of this entry. See the two
    subtypes. No ClinGen gene-disease validity assertion is recorded here:
    ClinGen's PHOX2B curations are against Haddad syndrome and congenital
    central hypoventilation syndrome, not against this term, and a tier
    assigned for one disease may not be copied onto another.
  case_fractions:
  - population: Heritable neuroblastoma
    case_fraction_percent: 10.0
    notes: >-
      The share of heritable neuroblastoma attributable to PHOX2B, from a
      review citing an earlier study. It is a share of familial disease, not
      of neuroblastoma overall, and familial disease is itself only 1 to 2
      per cent of cases, so this amounts to roughly one in a thousand
      neuroblastomas. The figure is approximate and the review attributes it
      to a source this entry does not cite directly.
    evidence:
    - reference: PMID:29589100
      reference_title: "Genetic susceptibility to neuroblastoma: current knowledge and future directions."
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "mutations in the PHOX2B gene have since been found to account for approximately 10% of heritable disease"
      explanation: >-
        The quantified contribution of PHOX2B to heritable neuroblastoma. The
        review states it as approximate and attributes it to an earlier
        study, so it is a synthesis rather than a measurement made here.
  evidence:
  - reference: PMID:15657873
    reference_title: "PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although modifier genes in both LO-CHS and Haddad syndrome are likely, PHOX2B is the major disease-causing gene in CCHS and is a predisposing gene to neuroblastoma whenever the mutation does not result in a polyalanine expansion."
    explanation: >-
      States the gene-disease relationship and, in the same sentence, the
      qualification that the predisposition attaches to the non-expansion
      variant class. The authors also note that modifier genes are likely.
  - reference: PMID:29589100
    reference_title: "Genetic susceptibility to neuroblastoma: current knowledge and future directions."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "PHOX2B-driven disease displays a robust genotype-phenotype association: while 45% of individuals with non-polyalanine repeat mutations (primarily missense mutations) develop neural crest tumors, only 1-2% of those with PHOX2B polyalanine expansions will develop neuroblastoma"
    explanation: >-
      An independent review stating the same genotype-phenotype split, which
      is why the entry treats it as the field's settled view rather than one
      group's finding. It cites the same two underlying sources as the
      workshop review.
treatments:
- name: Neuroblastoma Surveillance
  description: >-
    Surveillance is recommended for carriers from birth or from the diagnosis
    of predisposition. The 2017 AACR Childhood Cancer Predisposition Workshop
    schedule is abdominal ultrasound, quantitative normalised urinary
    catecholamine metabolites by gas chromatography and mass spectrometry,
    and a chest radiograph, every three months to age six, then every six
    months to age ten, then stopping. A random urine normalised to creatinine
    is sufficient. The chest radiograph is included because about a fifth of
    primary neuroblastomas arise in the chest. The schedule is the same as
    for germline ALK, and the review groups the two genes together as
    carrying a significant risk.
  action_category: SCREENING
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_phenotypes:
  - preferred_term: Neuroblastic tumor
    term:
      id: HP:0004376
      label: Neuroblastic tumor
  evidence:
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "This should begin at birth or at diagnosis of NB predisposition and be continued every 3 months until 6 years of age, and then continued every 6 months until 10 years of age (and then stop; Table 3)."
    explanation: >-
      The surveillance schedule. It is the workshop's recommendation, not a
      trial result, and the review does not report outcomes from following
      it.
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with highly penetrant, heritable ALK or PHOX2B (NPARM) mutations have a significant risk (45%-50%) to develop one or more tumors, especially in infancy and childhood."
    explanation: >-
      The risk statement the recommendation rests on, and the reason this
      entry and the ALK entry carry the same schedule. Note it is scoped to
      the non-polyalanine class.
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "However, about 20% of primary NBs arise in the chest, so a simple screening test of the chest is warranted."
    explanation: >-
      Why a chest radiograph is in the schedule and not only abdominal
      imaging. The 20 per cent figure is for primary neuroblastoma generally
      rather than for carriers specifically.
differential_diagnoses:
- name: ALK-Related Neuroblastic Tumor Susceptibility
  disease_term:
    preferred_term: neuroblastoma, susceptibility to, 3
    term:
      id: MONDO:0013083
      label: neuroblastoma, susceptibility to, 3
  description: >-
    The other single-gene neuroblastoma predisposition, curated separately.
    The two carry a comparable tumour risk and the same surveillance
    schedule, and the 2017 workshop review treats them together, but they are
    different genes with different syndromic associations: PHOX2B carriers
    usually have congenital central hypoventilation syndrome or Hirschsprung
    disease, ALK carriers do not. Genetic testing for both is recommended in
    a child with a suggestive family history.
  distinguishing_features:
  - A germline PHOX2B variant rather than a germline ALK variant
  - Congenital central hypoventilation syndrome or Hirschsprung disease in most carriers
  - Tumours skewed towards ganglioneuroma and ganglioneuroblastoma rather than neuroblastoma, in the polyalanine class particularly
  evidence:
  - reference: PMID:29589100
    reference_title: "Genetic susceptibility to neuroblastoma: current knowledge and future directions."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing for germline mutations in ALK and PHOX2B is now recommended for such patients."
    explanation: >-
      The recommendation to test both genes, which is why the two
      predispositions are considered together clinically even though they are
      separate entries here.
- name: Sporadic Neuroblastoma
  disease_term:
    preferred_term: neuroblastoma
    term:
      id: MONDO:0005072
      label: neuroblastoma
  description: >-
    Most neuroblastoma is sporadic. Only 1 to 2 per cent of patients have a
    family history, and 3 to 4 per cent present with bilateral or multifocal
    primary tumours, so a germline predisposition is the exception. What
    should prompt testing is that family history, bilateral or multifocal
    disease, or the presence of an associated neurocristopathy.
  distinguishing_features:
  - A germline PHOX2B variant, absent in sporadic disease
  - Congenital central hypoventilation syndrome or Hirschsprung disease in most carriers
  - Family history, or bilateral or multifocal primary tumours
  evidence:
  - reference: PMID:38860978
    reference_title: "Neuroblastoma Predisposition and Surveillance-An Update from the 2023 AACR Childhood Cancer Predisposition Workshop."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 1% to 2% of patients have a family history of NB, 3% to 4% of cases present with bilateral or multifocal primary tumors, and occasional patients have syndromes that are associated with increased NB risk."
    explanation: >-
      The base rates that make germline predisposition a small fraction of
      neuroblastoma, and the three features that should prompt looking for
      one.

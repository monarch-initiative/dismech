name: PHOX2B-Related Neuroblastic Tumor Susceptibility
creation_date: '2026-10-30T17:30:00Z'
description: >-
  Germline variants in PHOX2B predispose to tumours of the sympathetic nervous
  system: neuroblastoma, ganglioneuroblastoma and ganglioneuroma. PHOX2B was
  the first gene in which germline mutations were shown to predispose to
  neuroblastoma, reported in 2004 in a familial case and in a patient with
  the Hirschsprung disease and neuroblastoma association.

  What makes this predisposition unusual is how sharply the risk tracks the
  kind of variant. PHOX2B variants fall into two classes. Polyalanine repeat
  mutations, which expand a 20-alanine tract and account for most congenital
  central hypoventilation syndrome, carry a tumour risk of about 1 to 2 per
  cent. Non-polyalanine repeat mutations, which are missense, frameshift or
  truncating, carry a risk of about 45 per cent. The original series put it
  at 6 of 13 patients with a missense or frameshift variant against 2 of 161
  with a polyalanine expansion. Within the polyalanine class, risk rises with
  the length of the expansion, and essentially all reported tumours occurred
  in carriers of the largest expansions.

  The tumours that result are predominantly differentiated: in a series of
  thirteen, nine were differentiated, including five ganglioneuromas, three
  ganglioneuroblastomas and one differentiating neuroblastoma. That is not
  the whole picture, and the entry does not present it as such. Four were
  poorly differentiated, three patients had stage 4 and one stage 3 disease,
  and segmental chromosomal alterations were found in all six tumours tested
  by array comparative genomic hybridisation.

  PHOX2B predisposition almost always comes with other neurocristopathies,
  most often congenital central hypoventilation syndrome and Hirschsprung
  disease, which are curated separately. Surveillance is recommended for
  carriers, on the same schedule as for germline ALK.
categories:
- Cancer Predisposition Syndrome
- Pediatric Cancer
synonyms:
- NBLST2
- neuroblastoma, susceptibility to, 2
- PHOX2B-related neuroblastoma predisposition
notes: >-
  Scope. This entry covers the tumour predisposition. The syndromes that
  usually accompany it are curated separately: congenital central
  hypoventilation syndrome as Congenital_Central_Hypoventilation_Syndrome,
  which also carries the Haddad syndrome subtype for its association with
  Hirschsprung disease. The sibling predisposition entry is
  ALK-Related_Neuroblastic_Tumor_Susceptibility, a different gene, a
  different syndrome and the same surveillance schedule.

  A note on the 45 per cent figure, because its provenance matters. Two
  reviews state it, and both cite a chain back to Berry-Kravis and colleagues
  2006. The cached abstract of that paper carries no numeric tumour-risk
  figure; its comparative statement is qualitative, that increased prevalence
  of neural crest tumours was seen in the non-polyalanine group. The numbers
  this entry quotes are therefore taken from the sources that state them: the
  2017 AACR workshop review for the 45 per cent against 1 to 2 per cent
  framing, and Trochet and colleagues 2005 for the underlying counts of 6 of
  13 against 2 of 161. Treat the round figures as the field's summary rather
  than as a measured rate.

  The genotype-phenotype split is strong but not absolute. A child with a
  polyalanine repeat expansion, genotype 20/33, developed high-risk
  neuroblastoma, reported as the first such case. The low risk attached to
  the polyalanine class is a low risk, not an exemption, which is why
  surveillance is recommended for carriers of longer expansions as well.

  No ClinGen gene-disease validity assertion is recorded. ClinGen has not
  curated PHOX2B against this serial-numbered MONDO term; its PHOX2B
  assertions are against Haddad syndrome and congenital central
  hypoventilation syndrome. Copying a tier across would attribute to this
  disease a classification made for another, which the gene-disease validity
  rules forbid.

notes: 'Source scope: MONDO:0008960 / ORPHA:90103 / OMIM:214370 is HMSN-ADM, not AIFM1-related Cowchock syndrome. Forced source refreshes on 2026-11-02 retrieved only abstracts for PMID:1506851, PMID:9475604, and PMID:11442171. PMID:9591228 returned no quotable abstract or full text and is retained solely as a bibliographic lead; its title is not evidence for geographic or founder claims. Orphanet annotations are curated disease-specific summaries, not patient-level denominators. Its definition says no sensory impairment, but its phenotype table includes distal sensory deficits; therefore neither absence nor a uniform sensory-deficit pattern is asserted here. The full cached GeneReviews chapter was used for general management context only. No disease-specific trial or treatment response was established by the sources reviewed.'

    explanation: Supports autosomal recessive inheritance for the entity.

diagnosis:
- name: Electrophysiology and Sural Nerve Biopsy
  description: >
    Nerve conduction studies show marked reduction of motor and sensory
    conduction velocity with absent sensory nerve action potentials; sural
    nerve biopsy shows the characteristic absence of large myelinated fibers
    with preserved small fibers, which is the diagnostic hallmark.
  evidence:
  - reference: PMID:9475604
    reference_title: "Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological studies showed marked reduction of motor and sensory conduction velocity and absence of sensory action potentials."
    explanation: Describes the electrophysiological findings that, with the biopsy, support the diagnosis.

treatments:
- name: Physical Therapy and Rehabilitation
  description: >
    Supportive physiotherapy and rehabilitation to maintain strength, mobility,
    and function; no disease-modifying therapy exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy

- name: Hearing Rehabilitation
  description: >
    Management of sensorineural deafness with hearing aids or cochlear
    implantation and early auditory-verbal support to aid communication.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Genetic Counseling
  description: >
    Genetic counseling for autosomal recessive recurrence risk; the causal gene
    is not yet identified, so molecular carrier testing is not currently
    available.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling


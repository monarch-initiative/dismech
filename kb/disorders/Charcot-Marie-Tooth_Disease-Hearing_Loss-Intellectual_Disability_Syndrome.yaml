treatments:
- name: Physical Therapy and Rehabilitation
  description: >-
    Individualized physical and occupational therapy and exercise within capability are supportive approaches
    extrapolated from broader CMT management. Disease-specific functional benefit has not been established
    in the retrieved HMSN-ADM reports.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy

  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Exercise is encouraged within the individual's capability
    explanation: General CMT guidance supports considering rehabilitation; no HMSN-ADM-specific efficacy is claimed.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Hearing Rehabilitation
  description: >-
    Audiologic assessment can guide individualized hearing rehabilitation. Cochlear implantation has been
    studied in other CMT forms, but candidacy and benefit cannot be assumed for HMSN-ADM without localization
    of the auditory deficit and specialist assessment.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: cochlear implants were safe and reliable and improved both hearing and speech.
    explanation: The full chapter discusses cochlear implantation in other CMT cases, including four relatives with a PMP22 variant. This is background for assessment, not direct treatment evidence for HMSN-ADM.
    quote_role: BACKGROUND
    directness: INDIRECT
- name: Genetic Counseling
  description: >-
    Counseling should explain the presumed recessive inheritance, the uncertainty of the molecular diagnosis,
    and the limits of recurrence-risk and carrier-test inference. Broader CMT guidance recommends basing
    family risk on accurate diagnosis, pedigree, and molecular results.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Genetic counseling regarding risk to family members depends on accurate diagnosis, determination of the mode of inheritance in each family, and results of molecular genetic testing.
    explanation: General CMT counseling principles apply as background; recessive inheritance remains presumptive in HMSN-ADM.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT

name: Charcot-Marie-Tooth Disease-Hearing Loss-Intellectual Disability Syndrome
creation_date: '2026-07-31T00:00:00Z'
category: Genetic
description: >-
  Charcot-Marie-Tooth disease-hearing loss-intellectual disability syndrome (HMSN-ADM) is a rare, presumed
  autosomal recessive sensorimotor neuropathy associated with sensorineural hearing impairment and intellectual
  disability. Early distal weakness and atrophy accompany selective absence of large myelinated fibers
  on sural nerve biopsy, with relative preservation of small myelinated fibers. One autopsied child also
  lacked large neurons in dorsal root ganglia and spinal anterior horns and nearly all dentate nucleus
  neurons. These observations support a neuronopathy; faulty neuronal growth followed by axonal atrophy
  remains a hypothesis rather than a proven developmental mechanism. Demyelination was variable in the
  reported brothers. Epilepsy occurred in the autopsied child, but its population frequency is unknown.
  The reviewed sources do not establish a causal gene. This clinicopathological entity is distinct from
  AIFM1-related Cowchock syndrome (CMTX4).
disease_term:
  preferred_term: Charcot-Marie-Tooth disease-hearing loss-intellectual disability syndrome
  term:

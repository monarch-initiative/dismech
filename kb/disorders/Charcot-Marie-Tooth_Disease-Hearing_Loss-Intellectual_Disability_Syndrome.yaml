  - classification_value: NEUROLOGIC
    notes: >-
      Hereditary motor and sensory neuropathy (with sensorineural deafness and
      intellectual disability) — a neurologic / neuromuscular disorder.
pathophysiology:
- name: Loss of Large-Caliber Neurons in Dorsal Root Ganglia and Anterior Horns
  biological_scale: CELLULAR
  description: >-
    In one autopsied child, large neurons were absent from dorsal root ganglia and spinal anterior horns,
    corresponding to the absence of large myelinated peripheral motor and sensory fibers. This supports
    a neuronopathic component but does not establish whether the neurons failed to develop or were lost
    subsequently. Faulty growth followed by axonal atrophy was proposed from serial nerve biopsies in
    the original sibship.
  cell_types:
  - preferred_term: Anterior horn motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Dorsal root ganglion sensory neuron
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  downstream:
  - target: Absence of Large Myelinated Nerve Fibers
    description: >-
      The autopsy linked absence of large parent neurons to absence of their peripheral myelinated fibers;
      the proposed developmental sequence remains unproven.
    hypothesis_groups:
    - developmental_faulty_growth_model
  evidence:
  - reference: PMID:11442171
    reference_title: Hereditary motor and sensory neuropathy with absence of large myelinated fibers due to absence of large neurons in dorsal root ganglia and anterior horns, clinically associated with deafness, mental retardation, and epilepsy (HMSN-ADM).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The autopsy showed complete absence of large myelinated fibers in peripheral motor and sensory nerves corresponding to a lack of large neurons in dorsal root ganglia and anterior horns of the spinal cord, moderate neurogenic muscle atrophy, and nearly complete absence of neurons in the dentate nucleus of the cerebellum.
    explanation: Single-case autopsy supports the anatomical correspondence between large-neuron and large-fiber deficits, together with a separate dentate nucleus lesion; it does not establish temporal spread or a universal lesion across patients.
  - reference: PMID:1506851
    reference_title: Hereditary motor and sensory neuropathy with deafness, mental retardation and absence of large myelinated fibers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We infer from our findings that a developmental abnormality with faulty growth and subsequent axonal atrophy may be responsible.
    explanation: Original description proposes a developmental abnormality with faulty neuronal growth and subsequent axonal atrophy as the mechanism.

- name: Absence of Large Myelinated Nerve Fibers
  biological_scale: TISSUE
  description: >-
    Serial sural biopsies in the original family and biopsies in two subsequently reported brothers showed
    selective absence of large myelinated fibers with a preserved small-fiber complement. The latter brothers
    had no axonal degeneration in the sampled nerves; demyelination was seen only in the younger brother.
    This is a characteristic pathological finding, not evidence that every patient has been biopsied or
    that all neuropathy is uniformly demyelinating.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Decreased Number of Large Peripheral Myelinated Nerve Fibers
    description: >
      The tissue-level deficit is observed directly as the pathognomonic sural
      nerve biopsy finding.
  - target: Distal Muscle Weakness
  - target: Peripheral Neuropathy
  evidence:
  - reference: PMID:9475604
    reference_title: 'Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sural nerve biopsy, performed in both patients, showed absence of large myelinated fibers with normal density of small myelinated fibers without axonal degeneration.
    explanation: Sural nerve biopsy in two affected brothers shows the selective absence of large myelinated fibers with preserved small fibers and no axonal degeneration.
  - reference: PMID:9475604
    reference_title: 'Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Signs of demyelination were found only in the younger patient.
    explanation: Demyelinating change is variable across affected individuals, supporting a primary large-fiber neuronopathy rather than a uniform demyelinating process.
  notes: >-
    Orphanet describes a demyelinating neuropathy, while the primary biopsy and autopsy reports also support
    a large-fiber neuronopathy. Retain both observations without generalizing a single autopsy to every
    patient. The developmental hypothesis does not establish a molecular pathway or the direction of change
    in neuron development.

- name: Cerebellar Dentate Nucleus Neuron Loss
  biological_scale: CELLULAR
  description: >-
    Nearly complete absence of cerebellar dentate nucleus neurons was documented in the single autopsied
    child. This co-occurring central lesion has no established causal direction relative to the peripheral
    neuronopathy, and no demonstrated link to intellectual disability, deafness, seizures, or gait ataxia
    in this syndrome.
  cell_types:
  - preferred_term: Cerebellar dentate nucleus neuron
    term:
      id: CL:1001611
      label: cerebellar neuron
  evidence:
  - reference: PMID:11442171
    reference_title: Hereditary motor and sensory neuropathy with absence of large myelinated fibers due to absence of large neurons in dorsal root ganglia and anterior horns, clinically associated with deafness, mental retardation, and epilepsy (HMSN-ADM).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: nearly complete absence of neurons in the dentate nucleus of the cerebellum.
    explanation: Documents a dentate nucleus lesion in one autopsy; developmental failure versus degeneration and clinical consequences were not established by this abstract.


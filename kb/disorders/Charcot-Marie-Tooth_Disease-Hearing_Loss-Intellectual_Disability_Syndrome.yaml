discussions:
- discussion_id: gap_unknown_causal_gene
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the causal gene of the Charcot-Marie-Tooth
    disease-hearing-loss-intellectual-disability syndrome (HMSN-ADM)? The entity was delineated
    clinically and pathologically from a small number of families but remains
    genetically unsolved.
  attaches_to:
  - pathophysiology#Loss of Large-Caliber Neurons in Dorsal Root Ganglia and Anterior Horns
  rationale: >-
    The primary reports establish a clinicopathological syndrome with presumed recessive inheritance,
    without a molecular diagnosis. In the autopsied child, the reported assays detected no alterations
    in the survival motor neuron gene or PMP22; this is a case-specific negative result, not comprehensive
    exclusion of these genes in every family. Modern reanalysis could determine whether the historical
    families share a cause or represent more than one molecular disorder.
  proposed_experiments:
  - experiment_id: exp_wgs_hmsn_adm_pedigrees
    name: Exome/genome sequencing of HMSN-ADM pedigrees
    description: >-
      Sequence affected relatives and parents from well-phenotyped pedigrees, test segregation and alternative
      inheritance models, and compare across families before assuming a single recessive cause.
  evidence:
  - reference: PMID:11442171
    reference_title: Hereditary motor and sensory neuropathy with absence of large myelinated fibers due to absence of large neurons in dorsal root ganglia and anterior horns, clinically associated with deafness, mental retardation, and epilepsy (HMSN-ADM).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Molecular genetic analyses in our case revealed neither genetic alterations in the survival motor neuron gene nor in the PMP-22 gene.
    explanation: Reports negative testing of two candidate genes in one child; does not establish the sensitivity of those assays or exclude those genes throughout the syndrome.

- discussion_id: gap_deafness_id_pathomechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What links the underlying neuropathology to hearing impairment, intellectual disability, other developmental
    manifestations, and epilepsy, and what explains the variable gait and respiratory findings?
  attaches_to:
  - pathophysiology#Loss of Large-Caliber Neurons in Dorsal Root Ganglia and Anterior Horns
  - pathophysiology#Cerebellar Dentate Nucleus Neuron Loss
  rationale: >-
    The retrieved literature does not localize the hearing lesion or establish the substrate of intellectual
    disability, seizures, speech/developmental impairment, gait ataxia, or respiratory insufficiency.
    Deafness is not necessarily a CNS lesion. The dentate finding is from one autopsy and cannot be made
    the cause of these features from co-occurrence alone. The additional Orphanet phenotypes are associations
    with no disease-specific causal chain established in the sources reviewed.
  proposed_experiments:
  - experiment_id: exp_audiologic_neuroimaging_characterisation
    name: Audiologic and neuroimaging characterisation of HMSN-ADM
    description: >-
      Perform auditory brainstem response / otoacoustic emission testing to
      localise the deafness (cochlear vs auditory-neuropathy) and structural/
      functional brain imaging to characterise the substrate of the intellectual
      disability in affected individuals.

mechanistic_hypotheses:
- hypothesis_group_id: developmental_faulty_growth_model
  hypothesis_label: Developmental faulty-growth with subsequent axonal atrophy
  status: EMERGING
  description: >-
    The original description proposed that the selective absence of large
    myelinated fibers arises from a developmental abnormality with faulty
    neuronal growth followed by axonal atrophy, rather than a classic
    degenerative or demyelinating process. This remains a hypothesis: it is
    inferred from consecutive sural-nerve biopsies in the index sibship and is
    not molecularly established.
  evidence:
  - reference: PMID:1506851
    reference_title: Hereditary motor and sensory neuropathy with deafness, mental retardation and absence of large myelinated fibers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We infer from our findings that a developmental abnormality with faulty growth and subsequent axonal atrophy may be responsible.
    explanation: The original authors explicitly frame the developmental faulty-growth/axonal-atrophy model as an inference, i.e. a hypothesis.


diagnosis:
- name: Electrophysiology and Sural Nerve Biopsy
  description: >-
    Reported nerve conduction studies showed marked motor and sensory slowing and absent sensory action
    potentials. Historical sural biopsies demonstrated the selective large-fiber deficit. These observations
    characterize the syndrome; they are not a claim that invasive biopsy is required for every contemporary
    evaluation.
  evidence:
  - reference: PMID:9475604
    reference_title: 'Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity.'

  category: Neurological
  frequency: VERY_FREQUENT
  description: >
    Sensorineural deafness is a constant component of the syndrome and is
    reported as congenital in the Orphanet definition of the entity.
  phenotype_term:
    preferred_term: Sensorineural deafness
    term:

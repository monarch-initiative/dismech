name: Charcot-Marie-Tooth Disease-Hearing Loss-Intellectual Disability Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Genetic
description: >
  Charcot-Marie-Tooth disease-hearing loss-intellectual disability syndrome,
  also described in the neurological literature as hereditary motor and sensory
  neuropathy with deafness, mental retardation, and absence of (sensory) large
  myelinated fibers (HMSN-ADM), is a rare, presumably autosomal recessive
  hereditary motor and sensory neuropathy. It is defined by early-onset,
  slowly progressive distal muscle weakness and atrophy, sensorineural
  deafness, and mild intellectual disability, with the pathognomonic finding
  of absence of large myelinated fibers (with a preserved complement of small
  myelinated fibers) on sural nerve biopsy. Autopsy evidence indicates the
  peripheral fiber loss reflects a primary lack of large-caliber neurons in the
  dorsal root ganglia and spinal anterior horns — a neuronopathy — together
  with cerebellar dentate neuron loss; variable demyelinating features and,
  rarely, epilepsy have been reported. The disorder was delineated from a small
  number of families (notably from a single geographic area of southern Italy);
  its causal gene remains unidentified, with the SMN1 and PMP22 genes
  explicitly excluded in the autopsied case.
disease_term:
  preferred_term: Charcot-Marie-Tooth disease-hearing loss-intellectual disability syndrome
  term:
    id: MONDO:0008960
    label: Charcot-Marie-Tooth disease-hearing loss-intellectual disability syndrome
parents:
- Charcot-Marie-Tooth Disease
synonyms:
- HMSN-ADM
- Hereditary motor and sensory neuropathy with deafness, intellectual disability and absent sensory large myelinated fibers
- Charcot-Marie-Tooth disease-deafness-intellectual disability syndrome

pathophysiology:
- name: Loss of Large-Caliber Neurons in Dorsal Root Ganglia and Anterior Horns
  biological_scale: CELLULAR
  description: >
    The primary lesion is a lack of large-caliber neurons in the dorsal root
    ganglia (large sensory neurons) and the spinal anterior horns (large motor
    neurons), demonstrated at autopsy. A developmental abnormality with faulty
    neuronal growth, followed by axonal atrophy, is thought to underlie the
    selective loss of the large-fiber population; cerebellar dentate nucleus
    neurons are also depleted.
  cell_types:
  - preferred_term: Anterior horn motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Dorsal root ganglion sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: Neuron development
    term:
      id: GO:0048666
      label: neuron development
    modifier: ABNORMAL
  downstream:
  - target: Absence of Large Myelinated Nerve Fibers
    description: >
      Loss of the large-caliber parent neurons removes the large myelinated
      axons they project into peripheral motor and sensory nerves.
  evidence:
  - reference: PMID:11442171
    reference_title: "Hereditary motor and sensory neuropathy with absence of large myelinated fibers due to absence of large neurons in dorsal root ganglia and anterior horns, clinically associated with deafness, mental retardation, and epilepsy (HMSN-ADM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autopsy showed complete absence of large myelinated fibers in peripheral motor and sensory nerves corresponding to a lack of large neurons in dorsal root ganglia and anterior horns of the spinal cord, moderate neurogenic muscle atrophy, and nearly complete absence of neurons in the dentate nucleus of the cerebellum."
    explanation: Autopsy evidence that absence of large myelinated peripheral fibers reflects a primary lack of large neurons in the dorsal root ganglia and anterior horns (a neuronopathy), with additional cerebellar dentate neuron loss.
  - reference: PMID:1506851
    reference_title: "Hereditary motor and sensory neuropathy with deafness, mental retardation and absence of large myelinated fibers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We infer from our findings that a developmental abnormality with faulty growth and subsequent axonal atrophy may be responsible."
    explanation: Original description proposes a developmental abnormality with faulty neuronal growth and subsequent axonal atrophy as the mechanism.

- name: Absence of Large Myelinated Nerve Fibers
  biological_scale: TISSUE
  description: >
    Sural nerve biopsy shows a selective absence of large myelinated fibers
    with a normal density/complement of small myelinated fibers and, in most
    cases, no primary axonal degeneration; overt demyelinating change is
    variable and has been seen only in some (younger) patients. This selective
    large-fiber deficit is the diagnostic pathological hallmark of the entity.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Distal Muscle Weakness
  - target: Peripheral Neuropathy
  evidence:
  - reference: PMID:9475604
    reference_title: "Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sural nerve biopsy, performed in both patients, showed absence of large myelinated fibers with normal density of small myelinated fibers without axonal degeneration."
    explanation: Sural nerve biopsy in two affected brothers shows the selective absence of large myelinated fibers with preserved small fibers and no axonal degeneration.
  - reference: PMID:9475604
    reference_title: "Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Signs of demyelination were found only in the younger patient."
    explanation: Demyelinating change is variable across affected individuals, supporting a primary large-fiber neuronopathy rather than a uniform demyelinating process.

phenotypes:
- name: Peripheral Neuropathy
  category: Neurological
  frequency: OBLIGATE
  description: >
    An early-onset, slowly progressive hereditary motor and sensory
    (poly)neuropathy is the defining clinical feature, with marked slowing of
    motor and sensory conduction and absent sensory action potentials on
    electrophysiology.
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830
      label: Peripheral neuropathy
  evidence:
  - reference: PMID:9475604
    reference_title: "Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two brothers, 11 and 13 years old, respectively, with an early-onset hereditary motor and sensory neuropathy, deafness, and mental retardation."
    explanation: Establishes the early-onset hereditary motor and sensory neuropathy as the core clinical feature.

- name: Decreased Number of Large Peripheral Myelinated Nerve Fibers
  category: Neurological
  frequency: OBLIGATE
  description: >
    The pathognomonic sural nerve biopsy finding: selective absence/marked
    reduction of large myelinated nerve fibers with preserved small fibers.
  phenotype_term:
    preferred_term: Decreased number of large peripheral myelinated nerve fibers
    term:
      id: HP:0003387
      label: Decreased number of large peripheral myelinated nerve fibers
  evidence:
  - reference: PMID:9475604
    reference_title: "Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sural nerve biopsy, performed in both patients, showed absence of large myelinated fibers with normal density of small myelinated fibers without axonal degeneration."
    explanation: Documents the selective large-myelinated-fiber deficit that defines the entity.

- name: Distal Muscle Weakness
  category: Musculoskeletal
  frequency: FREQUENT
  description: >
    Early-onset, slowly progressive distal limb weakness and wasting from the
    motor component of the neuropathy / anterior horn large-neuron loss.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:11442171
    reference_title: "Hereditary motor and sensory neuropathy with absence of large myelinated fibers due to absence of large neurons in dorsal root ganglia and anterior horns, clinically associated with deafness, mental retardation, and epilepsy (HMSN-ADM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate neurogenic muscle atrophy"
    explanation: Autopsy documents neurogenic muscle atrophy, the substrate of the distal motor weakness/wasting.


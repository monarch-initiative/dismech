    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sural nerve biopsy, performed in both patients, showed absence of large myelinated fibers with normal density of small myelinated fibers without axonal degeneration."
    explanation: Documents the selective large-myelinated-fiber deficit that defines the entity.

- name: Distal Muscle Weakness
  category: Musculoskeletal
  frequency: VERY_FREQUENT
  description: >
    Early-onset, slowly progressive distal limb weakness and wasting from the
    motor component of the neuropathy / anterior horn large-neuron loss. Distal
    muscular weakness and atrophy is the leading defining feature of the entity
    and is present across the reported patients.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
    clinical_course: PROGRESSIVE
    onset:
      onset_category: CHILDHOOD
      notes: Early-onset; affected brothers reported at ages 11 and 13.
  evidence:
  - reference: PMID:1506851
    reference_title: "Hereditary motor and sensory neuropathy with deafness, mental retardation and absence of large myelinated fibers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two brothers with a presumably hereditary motor and sensory polyneuropathy"
    explanation: The motor-sensory polyneuropathy (with its distal motor component) is the defining, consistently present feature of the entity across reported siblings.
  - reference: PMID:11442171
    reference_title: "Hereditary motor and sensory neuropathy with absence of large myelinated fibers due to absence of large neurons in dorsal root ganglia and anterior horns, clinically associated with deafness, mental retardation, and epilepsy (HMSN-ADM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate neurogenic muscle atrophy"
    explanation: Autopsy documents neurogenic muscle atrophy, the substrate of the distal motor weakness/wasting.


      label: Autosomal recessive inheritance
  description: >
    The syndrome is transmitted as a presumed autosomal recessive trait,
    typically affecting siblings of unaffected parents.
  evidence:
  - reference: PMID:9475604
    reference_title: "Hereditary motor and sensory neuropathy with deafness, mental retardation, and absence of sensory large myelinated fibers: confirmation of a new entity."
    supports: SUPPORT

name: Splenic Marginal Zone Lymphoma
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Splenic marginal zone lymphoma (SMZL) is a rare, indolent mature B-cell
  non-Hodgkin lymphoma arising from the marginal zone of the splenic white pulp.
  It presents with splenomegaly, peripheral blood involvement by circulating
  villous lymphocytes, and cytopenias, with characteristic intrasinusoidal bone
  marrow infiltration and little or no peripheral lymphadenopathy. Like its
  extranodal sibling MALT lymphoma, SMZL appears to begin as an antigen-driven
  process: biased immunoglobulin heavy-chain gene usage (notably IGHV1-2) and an
  association with chronic hepatitis C virus infection both point to sustained
  antigenic selection of marginal zone B cells. Where MALT lymphoma escapes
  antigen dependence through translocations that fuse or deregulate the
  BCL10-MALT1 axis, SMZL instead acquires point mutations and deletions in the
  genes that specify and restrain marginal zone B-cell identity, namely NOTCH2,
  KLF2, and the long arm of chromosome 7, together with NF-kB-activating lesions
  such as TNFAIP3. The two lymphomas therefore converge on constitutive NF-kB
  signaling by mechanistically distinct routes. Splenic infiltration and
  hypersplenism drive the cytopenias, which are frequently compounded by
  autoimmune hemolytic anemia and immune thrombocytopenia. Antiviral therapy can
  induce lymphoma regression in hepatitis C virus-associated disease, mirroring
  Helicobacter pylori eradication in gastric MALT lymphoma; splenectomy was the
  historical first-line treatment and has largely been superseded by rituximab.
categories:
- Hematologic Malignancy
- B-cell Neoplasm
- Non-Hodgkin Lymphoma

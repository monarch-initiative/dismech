genetic:
- name: NOTCH2 Mutation
  gene_term:
    preferred_term: NOTCH2
    term:
      id: hgnc:7882
      label: NOTCH2
  association: Recurrent Somatic Driver
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Truncating mutations cluster in the C-terminal PEST degron and eliminate the
    proteasomal degradation signal, stabilizing activated NOTCH2. Because NOTCH2
    is required for marginal zone B-cell development, this is a lesion in the
    lineage-identity program itself. NOTCH2 mutation is restricted to SMZL among
    indolent B-cell lymphoproliferative disorders, giving it diagnostic value.
  evidence:
  - reference: PMID:22891273
    reference_title: "The coding genome of splenic marginal zone lymphoma: activation of NOTCH2 and other pathways regulating marginal zone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in NOTCH2, a gene required for marginal-zone (MZ) B cell development, represent the most frequent lesion in SMZL"
    explanation: Establishes NOTCH2 as the most frequent genetic lesion in SMZL and links it to marginal zone B-cell development.
  - reference: PMID:22891273
    reference_title: "The coding genome of splenic marginal zone lymphoma: activation of NOTCH2 and other pathways regulating marginal zone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All NOTCH2 mutations are predicted to cause impaired degradation of the NOTCH2 protein by eliminating the C-terminal PEST domain, which is required for proteasomal recruitment."
    explanation: Specifies the molecular consequence of the PEST-domain mutations as impaired proteasomal degradation of NOTCH2.
  - reference: PMID:22891276
    reference_title: "Whole-genome sequencing identifies recurrent somatic NOTCH2 mutations in splenic marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations clustered near the C-terminal proline/glutamate/serine/threonine (PEST)-rich domain, resulting in protein truncation"
    explanation: Independently confirms the PEST-domain clustering and truncating nature of the NOTCH2 mutations.
- name: KLF2 Mutation
  gene_term:
    preferred_term: KLF2
    term:
      id: hgnc:6347
      label: KLF2
  association: Recurrent Somatic Driver
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    KLF2 is a transcription factor that restrains NF-kB and NOTCH signaling in
    mature B cells; inactivation removes this brake and promotes nuclear NF-kB
    accumulation.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified recurring mutations in KLF2, NOTCH2, and TP53, as well as genes clustering within vital B-cell differentiation pathways"
    explanation: Establishes KLF2 as one of the recurrently mutated genes defining the SMZL mutational landscape.
- name: TNFAIP3 Mutation
  gene_term:
    preferred_term: TNFAIP3
    term:
      id: hgnc:11896
      label: TNFAIP3
  association: Recurrent Somatic Driver
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    TNFAIP3 encodes A20, a negative regulator of NF-kB. Loss-of-function
    mutations contribute to the constitutive NF-kB activity shared across
    marginal zone lymphomas, and in relapsed or refractory disease TNFAIP3
    mutation correlated with improved progression-free survival on zanubrutinib.
  evidence:
  - reference: PMID:36947202
    reference_title: "Molecular associations of response to the new-generation BTK inhibitor zanubrutinib in marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88, TNFAIP3, and KMT2D mutations correlate with PFS in patients with relapsed/refractory MZL treated with zanubrutinib."
    explanation: Establishes TNFAIP3 mutation as a recurrent and prognostically relevant lesion in marginal zone lymphoma treated with BTK inhibition.
- name: TP53 Disruption
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: Adverse Prognostic Lesion
  relationship_type: MODIFIER
  variant_origin: SOMATIC
  notes: >-
    TP53 is among the recurrently mutated genes in SMZL and is associated with
    inferior outcome and with histological transformation to large cell

- name: Splenic White Pulp Infiltration and Hypersplenism
  description: >-
    The lymphoma clone expands the splenic white pulp in a characteristic
    micronodular pattern, effacing normal follicular architecture and spilling
    into the red pulp. The enlarging spleen sequesters and destroys circulating
    blood cells, producing cytopenias out of proportion to marrow reserve.
    Marrow involvement is reported in nodular, interstitial, and intrasinusoidal
    patterns, and the tumor cells circulate as villous lymphocytes, the feature
    that gave the disease its older name of splenic lymphoma with villous
    lymphocytes. Because a substantial share of the
    cytopenia is mechanical, removing the spleen historically corrected the
    blood counts without eradicating the lymphoma.
  evidence:
  - reference: PMID:23712547
    reference_title: "Significant efficacy of 2-chlorodeoxyadenosine{+/-} rituximab in the treatment of splenic marginal zone lymphoma (SMZL): extended follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It presents with marked splenomegaly."
    explanation: Confirms marked splenomegaly as the characteristic presentation produced by splenic infiltration.
  - reference: PMID:22891276
    reference_title: "Whole-genome sequencing identifies recurrent somatic NOTCH2 mutations in splenic marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splenic marginal zone lymphoma (SMZL), the most common primary lymphoma of spleen, is poorly understood at the genetic level."
    explanation: Confirms the spleen as the defining primary site of disease involvement.
  - reference: PMID:8652403
    reference_title: "Splenic lymphoma with villous lymphocytes: clinical presentation, biology and prognostic factors in a series of 100 patients. Groupe Francais d'Hématologie Cellulaire (GFHC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLVL is a chronic B-cell lymphoproliferative disorder characterized by splenomegaly and the presence, in peripheral blood, of lymphocytes with \"villous' projections."
    explanation: A 100-patient clinical series defines the disease by the pairing of splenomegaly with circulating villous lymphocytes, the two consequences of splenic infiltration and spillover.

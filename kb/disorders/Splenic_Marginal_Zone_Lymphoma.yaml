- name: Cytopenias and Autoimmune Complications
  description: >-
    Anemia and thrombocytopenia in SMZL arise from two superimposed mechanisms:
    mechanical sequestration by the enlarged spleen, and true autoimmune
    destruction. The lymphoma clone and the dysregulated B-cell compartment
    around it generate autoantibodies, so autoimmune hemolytic anemia and immune
    thrombocytopenia are recognized paraneoplastic complications rather than
    incidental findings. This dual mechanism matters clinically because it
    separates patients whose counts respond to splenectomy or to
    lymphoma-directed therapy from those who require immunosuppression.
  evidence:
  - reference: PMID:25201005
    reference_title: "Lupus anticoagulant and thrombosis in splenic marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immune mediated paraneoplastic phenomena such as autoimmune hemolytic anemia (AIHA), autoimmune thrombocytopenia (ITP) and C1 esterase inhibitor deficiency are relatively common"
    explanation: Establishes autoimmune hemolytic anemia and immune thrombocytopenia as common immune-mediated paraneoplastic phenomena in SMZL.

  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified recurring mutations in KLF2, NOTCH2, and TP53, as well as genes clustering within vital B-cell differentiation pathways"
    explanation: Establishes TP53 as one of the three recurrently mutated genes in the SMZL landscape.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    SMZL accounts for fewer than 2% of lymphoid neoplasms. This is a case-mix
    fraction among lymphoid malignancies rather than a population rate, so no
    normalized rate per 100,000 is recorded.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splenic marginal zone lymphoma (SMZL) is a rare, predominantly indolent B-cell lymphoma constituting fewer than 2% of lymphoid neoplasms."
    explanation: Provides the share of lymphoid neoplasms accounted for by SMZL and characterizes the disease as rare.
progression:
- phase: Indolent phase
  notes: >-
    Most patients follow a prolonged indolent course. A substantial minority,
    however, have materially shorter survival despite available treatment,
    which is why risk stratification rather than uniform therapy governs
    management.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "around 30% of patients have a shorter survival despite currently available treatments"
    explanation: Quantifies the minority of SMZL patients whose disease does not follow the expected indolent course.
  - reference: PMID:8652403
    reference_title: "Splenic lymphoma with villous lymphocytes: clinical presentation, biology and prognostic factors in a series of 100 patients. Groupe Francais d'Hématologie Cellulaire (GFHC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLVL is a disease of the elderly with a relatively benign clinical course."
    explanation: Characterizes the typical course as indolent and establishes the older adult age distribution.
  - reference: PMID:8652403
    reference_title: "Splenic lymphoma with villous lymphocytes: clinical presentation, biology and prognostic factors in a series of 100 patients. Groupe Francais d'Hématologie Cellulaire (GFHC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present series the 5-year overall survival was 78%."
    explanation: Quantifies survival in a 100-patient series, giving a concrete measure of the indolent course.
- phase: Histological transformation to large cell lymphoma
  notes: >-
    A minority of cases undergo histological transformation to a large cell
    lymphoma, which carries a markedly worse prognosis and represents the main
    lethal endpoint of the disease.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the prognosis is especially poor for the 5-15% of cases that transform to a large cell lymphoma"
    explanation: Quantifies the transformation rate and its prognostic impact.
treatments:
- name: Observation
  description: >-
    Asymptomatic patients with low-risk disease can be managed expectantly. A
    prospective study of a risk-adapted strategy found observation to be the
    best approach for the lowest-risk group, making watchful waiting an
    evidence-based option rather than merely a default.
  evidence:
  - reference: PMID:37386877
    reference_title: "Low-risk HPLLs/ABC score patients with splenic marginal zone lymphoma can be safely managed without treatment: Results from a prospective Spanish study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "observation as the best approach for patients in group A and rituximab as the best treatment for group B"
    explanation: Prospective multicenter study supports observation for the lowest-risk SMZL group.
  - reference: PMID:8652403
    reference_title: "Splenic lymphoma with villous lymphocytes: clinical presentation, biology and prognostic factors in a series of 100 patients. Groupe Francais d'Hématologie Cellulaire (GFHC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment abstention should be considered in patients with favourable prognostic factors"
    explanation: An earlier 100-patient series independently reached the same conclusion that untreated observation is appropriate for favourable-risk patients.
- name: Rituximab
  description: >-
    Anti-CD20 monoclonal antibody, now the preferred first-line therapy for
    symptomatic SMZL. In a prospective multicenter series, rituximab-containing
    arms achieved a higher overall response rate than splenectomy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  evidence:
  - reference: PMID:37386877
    reference_title: "Low-risk HPLLs/ABC score patients with splenic marginal zone lymphoma can be safely managed without treatment: Results from a prospective Spanish study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall response rate was higher in the rituximab chemotherapy and in the rituximab arms compared with the splenectomy arm"
    explanation: Prospective multicenter data show rituximab-containing therapy outperforms splenectomy on overall response rate.
  - reference: PMID:37386877
    reference_title: "Low-risk HPLLs/ABC score patients with splenic marginal zone lymphoma can be safely managed without treatment: Results from a prospective Spanish study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "observation as the best approach for patients in group A and rituximab as the best treatment for group B"
    explanation: Identifies rituximab as the preferred treatment for the risk group requiring therapy.
- name: Splenectomy
  description: >-
    Surgical removal of the spleen, the historical first-line treatment and
    still an option in patients fit for surgery. It corrects the mechanical
    cytopenias and relieves mass effect but does not eradicate the lymphoma, and
    has been largely superseded by rituximab on response-rate grounds.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  evidence:
  - reference: PMID:23712547
    reference_title: "Significant efficacy of 2-chlorodeoxyadenosine{+/-} rituximab in the treatment of splenic marginal zone lymphoma (SMZL): extended follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splenectomy remains one of the first-line options in patients fit for surgery."
    explanation: Confirms splenectomy as an established first-line option for surgically fit SMZL patients.
  - reference: PMID:37386877
    reference_title: "Low-risk HPLLs/ABC score patients with splenic marginal zone lymphoma can be safely managed without treatment: Results from a prospective Spanish study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall response rate was higher in the rituximab chemotherapy and in the rituximab arms compared with the splenectomy arm"
    explanation: Supports the displacement of splenectomy by rituximab on response rate, though lymphoma-specific survival did not differ by treatment received.
  target_mechanisms:
  - target: Splenic White Pulp Infiltration and Hypersplenism
    description: >-
      Splenectomy removes the sequestering organ, correcting the mechanical
      component of the cytopenias.
- name: Hepatitis C Antiviral Therapy
  description: >-
    In hepatitis C virus-associated SMZL, therapy directed at the virus rather
    than at the lymphoma can induce hematologic response. This is the splenic
    counterpart of Helicobacter pylori eradication in gastric MALT lymphoma and
    is the strongest therapeutic evidence for the antigen-driven model of
    marginal zone lymphomagenesis.
  treatment_term:
    preferred_term: Antiviral Therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
  evidence:
  - reference: PMID:25273531
    reference_title: "Non-Hodgkin lymphoma and hepatitis C: where we are and what next?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interferon and ribavirin based treatment proved to be successful in small case series of hepatitis C virus associated splenic lymphoma with villous lymphocytes, therefore, it is suggested that antiviral treatment could be an alternative to chemo-immunotherapy."
    explanation: Documents lymphoma response to antiviral therapy in hepatitis C virus-associated splenic lymphoma with villous lymphocytes.
  - reference: PMID:25273531
    reference_title: "Non-Hodgkin lymphoma and hepatitis C: where we are and what next?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association between hepatitis C virus and certain B-cell non-Hodgkin lymphomas, such as marginal zone lymphomas, is supported by epidemiological studies."
    explanation: Establishes the epidemiological basis for the hepatitis C virus association that makes antiviral therapy rational.
  target_mechanisms:
  - target: Chronic Antigenic Stimulation of Splenic Marginal Zone B Cells
    description: >-
      Clearing the virus removes the chronic antigenic drive sustaining the
      clone, the same logic as Helicobacter pylori eradication in gastric MALT
      lymphoma.
- name: Bruton Tyrosine Kinase Inhibition
  description: >-
    BTK inhibitors block B-cell receptor signal transmission upstream of NF-kB.
    Zanubrutinib is used for relapsed or refractory marginal zone lymphoma after
    anti-CD20 therapy, and mutations in NF-kB pathway genes are associated with
    the response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zanubrutinib
      term:
        id: NCIT:C141428
        label: Zanubrutinib
  evidence:
  - reference: PMID:36947202
    reference_title: "Molecular associations of response to the new-generation BTK inhibitor zanubrutinib in marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88, TNFAIP3, and KMT2D mutations correlate with PFS in patients with relapsed/refractory MZL treated with zanubrutinib."
    explanation: Establishes zanubrutinib use in relapsed or refractory marginal zone lymphoma and links NF-kB pathway genotype to progression-free survival.
  - reference: PMID:36947202
    reference_title: "Molecular associations of response to the new-generation BTK inhibitor zanubrutinib in marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NF-κB, NOTCH, or B-cell receptor (BCR) pathway genes were implicated in samples from 16 of 18 patients (89%)."
    explanation: Provides the mechanistic rationale for BTK inhibition by showing B-cell receptor and NF-kB pathway involvement in the large majority of cases.
  target_mechanisms:
  - target: Constitutive NF-kB Pathway Activation
    description: >-
      BTK inhibition interrupts B-cell receptor signal transmission into the
      NF-kB pathway.

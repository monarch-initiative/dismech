pathophysiology:
- name: Chronic Antigenic Stimulation of Splenic Marginal Zone B Cells
  conforms_to: "tumor_promoting_inflammation#Chronic Inflammatory Stimulus"
  description: >-
    Sustained antigenic drive selects and expands marginal zone B cells of the
    splenic white pulp. Two independent lines of evidence point to a specific,
    non-random antigen rather than a random founding event: strongly biased
    immunoglobulin heavy-chain variable gene usage, with a large fraction of
    cases using IGHV1-2, and an epidemiological and therapeutic association with
    chronic hepatitis C virus infection. A stereotyped receptor repertoire
    implies that the founding clone is chosen by its antigen-binding
    specificity, placing SMZL alongside MALT lymphoma in the family of
    inflammation-associated, antigen-driven B-cell neoplasms.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunogenetic investigations have revealed biases in the immunoglobulin gene repertoire, indicating a role of antigen selection."
    explanation: Establishes that the biased immunoglobulin repertoire in SMZL implies antigen-driven selection of the founding clone.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "representing 30% of all cases and 90% of IGHV1-2 users"
    explanation: Quantifies IGHV1-2*04 usage at 30% of all SMZL cases, the concrete immunogenetic signature of antigen selection.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IGHV1-2*04 and/or del(7q) are very strong pointers for the diagnosis of SMZL"
    explanation: Establishes the stereotyped receptor usage as diagnostically specific to SMZL rather than a generic B-cell finding.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is significantly associated with del(7q), KLF2, and NOTCH2 mutations"
    explanation: Links the antigen-selection signature to the downstream genetic lesions, tying this node to the next one in the chain.
  - reference: PMID:34384734
    reference_title: "Repertoire of Rearranged Immunoglobulin Heavy Chain Genes in Russian Patients With B-Cell Lymphoproliferative Diseases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In the half of SMZL patients was identified gene IGHV1-2."
    explanation: Independent cohort corroborating the IGHV1-2 bias; retained only as secondary support since it is a small mixed B-LPD series reporting IGHV1-2 rather than the *04 allele specifically.
  - reference: PMID:25273531
    reference_title: "Non-Hodgkin lymphoma and hepatitis C: where we are and what next?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both chronic antigenic stimulation and viral lymphotropism may contribute to the evolution of the malignant clone"
    explanation: Identifies chronic antigenic stimulation as a proposed mechanism linking hepatitis C virus to marginal zone lymphomagenesis.

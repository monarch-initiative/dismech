- name: Disruption of Marginal Zone B-cell Identity and Quiescence
  description: >-
    SMZL is genetically defined by lesions in the very program that specifies
    marginal zone B cells and holds them quiescent. NOTCH2 signaling is required
    for marginal zone B-cell development, and recurrent truncating mutations
    clustered in the C-terminal PEST degron eliminate the degradation signal,
    stabilizing the activated protein and producing a sustained differentiation
    cue. KLF2, a transcription factor that restrains NF-kB and NOTCH output in
    mature B cells, is recurrently inactivated, removing that brake. Deletion of
    the long arm of chromosome 7 is the most frequent cytogenetic abnormality in
    the disease. Mutations in additional NOTCH-pathway members and in other
    pathways governing marginal zone development affect a majority of cases.
    This constellation is the mechanistic signature separating SMZL from MALT
    lymphoma, which reaches a comparable endpoint through BCL10-MALT1
    translocations instead.
  evidence:
  - reference: PMID:22891276
    reference_title: "Whole-genome sequencing identifies recurrent somatic NOTCH2 mutations in splenic marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified recurrent somatic gain-of-function mutations in NOTCH2, a gene encoding a protein required for marginal zone B cell development"
    explanation: Whole-genome sequencing establishes that SMZL recurrently mutates NOTCH2, the gene required for marginal zone B-cell development itself.
  - reference: PMID:22891273
    reference_title: "The coding genome of splenic marginal zone lymphoma: activation of NOTCH2 and other pathways regulating marginal zone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that deregulation of MZ B cell development pathways plays a role in the pathogenesis"
    explanation: Whole-exome analysis attributes SMZL pathogenesis to deregulation of the marginal zone B-cell developmental program.
  - reference: PMID:22891273
    reference_title: "The coding genome of splenic marginal zone lymphoma: activation of NOTCH2 and other pathways regulating marginal zone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these include NOTCH1, SPEN, and DTX1"
    explanation: Shows that additional NOTCH-pathway modulators beyond NOTCH2 are recurrently mutated, indicating pathway-level rather than single-gene deregulation.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cytogenetic studies have identified recurrent chromosomal abnormalities such as deletion of the long arm of chromosome 7"
    explanation: Establishes deletion of chromosome 7q as the recurrent cytogenetic lesion of SMZL.

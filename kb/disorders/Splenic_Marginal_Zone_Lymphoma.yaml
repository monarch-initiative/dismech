- accession: ega:EGAS00001006389
  title: Unraveling the genetics of transformed splenic marginal zone lymphoma
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Splenic Marginal Zone Lymphoma"); description-level mentions were not accepted. EGA study_type: Cancer Genomics. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: dbgap:phs000502
  title: Genome-Wide Analysis of Splenic Marginal Zone Lymphoma
  description: ' Splenic Marginal Zone Lymphoma (SMZL) is a B-cell malignancy of unknown pathogenesis and thus orphan of targeted therapies. By integrating whole-exome sequencing and copy-number analysis of 8 paired tumor-normal DNAs from patients with SMZL, we show that the typical SMZL exome carries ~30 genetic alterations. Targeted resequencing of selected candidates in an extended panel of 40-117 samples revealed activating mutations of NOTCH2, a gene required for marginal-zone (MZ) development, as the most frequent and SMZL-specific lesion, accounting for approximately 20% of cases.'
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Splenic Marginal Zone Lymphoma"). Retrieved 2026-08-02.

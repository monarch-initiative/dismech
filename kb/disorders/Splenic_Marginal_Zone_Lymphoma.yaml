genetic:
- name: NOTCH2 Mutation
  gene_term:
    preferred_term: NOTCH2
    term:
      id: hgnc:7882
      label: NOTCH2
  association: Recurrent Somatic Driver
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Truncating mutations cluster in the C-terminal PEST degron and eliminate the
    proteasomal degradation signal, stabilizing activated NOTCH2. Because NOTCH2
    is required for marginal zone B-cell development, this is a lesion in the
    lineage-identity program itself. NOTCH2 mutation is restricted to SMZL among
    indolent B-cell lymphoproliferative disorders, giving it diagnostic value.
  case_fractions:
  - population: SMZL cohorts pooled in a 2024 molecular-landscape review
    case_fraction_low: 10
    case_fraction_high: 25
    notes: >-
      Reported as 10-25% of SMZL cases across pooled cohorts.
    evidence:
    - reference: PMID:39280243
      reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "KLF2 (12–42%), NOTCH2 (10–25%), and TP53 (15%) are among the most frequently mutated genes"
      explanation: Gives the NOTCH2 share of SMZL cases alongside the other recurrently mutated genes.
  evidence:
  - reference: PMID:22891273
    reference_title: "The coding genome of splenic marginal zone lymphoma: activation of NOTCH2 and other pathways regulating marginal zone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in NOTCH2, a gene required for marginal-zone (MZ) B cell development, represent the most frequent lesion in SMZL"
    explanation: Establishes NOTCH2 as the most frequent genetic lesion in SMZL and links it to marginal zone B-cell development.
  - reference: PMID:22891273
    reference_title: "The coding genome of splenic marginal zone lymphoma: activation of NOTCH2 and other pathways regulating marginal zone development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All NOTCH2 mutations are predicted to cause impaired degradation of the NOTCH2 protein by eliminating the C-terminal PEST domain, which is required for proteasomal recruitment."
    explanation: Specifies the molecular consequence of the PEST-domain mutations as impaired proteasomal degradation of NOTCH2.
  - reference: PMID:22891276
    reference_title: "Whole-genome sequencing identifies recurrent somatic NOTCH2 mutations in splenic marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations clustered near the C-terminal proline/glutamate/serine/threonine (PEST)-rich domain, resulting in protein truncation"
    explanation: Independently confirms the PEST-domain clustering and truncating nature of the NOTCH2 mutations.
- name: KLF2 Mutation
  gene_term:
    preferred_term: KLF2
    term:
      id: hgnc:6347
      label: KLF2
  association: Recurrent Somatic Driver
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    KLF2 is the most frequently mutated gene in SMZL. It is a transcription
    factor that restrains NF-kB and NOTCH signaling in mature B cells;
    inactivation removes this brake and promotes nuclear NF-kB accumulation.
    Note that the mechanistic characterisation rests on murine knockout B cells,
    so the human mechanism is inferred from a model system even though the
    mutation frequency itself is human.
  case_fractions:
  - population: SMZL cohorts pooled in a 2024 molecular-landscape review
    case_fraction_low: 12
    case_fraction_high: 42
    notes: >-
      Reported as 12-42% of SMZL cases; the wide band reflects heterogeneity between cohorts.
    evidence:
    - reference: PMID:39280243
      reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "KLF2 12–42% Most frequent mutation in SMZL"
      explanation: Gives the KLF2 share of SMZL cases and identifies it as the most frequent mutation in the disease.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified recurring mutations in KLF2, NOTCH2, and TP53, as well as genes clustering within vital B-cell differentiation pathways"
    explanation: Establishes KLF2 as one of the recurrently mutated genes defining the SMZL mutational landscape.
- name: TNFAIP3 Mutation
  gene_term:
    preferred_term: TNFAIP3
    term:
      id: hgnc:11896
      label: TNFAIP3
  association: Recurrent Somatic Mutation
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  notes: >-
    TNFAIP3 encodes A20, a negative regulator of NF-kB, and is mutated in
    7-15% of SMZL. Specificity caveat: the mutation frequency is
    SMZL-specific, but the mechanistic claim that loss of A20 releases the
    NF-kB cascade is extrapolated. The source review states the functional
    consequence was shown "in other NHLs", and the supporting BTK-inhibitor
    cohort spans marginal zone lymphoma subtypes rather than SMZL alone. The
    driver role in SMZL specifically should be treated as probable rather than
    demonstrated.
  case_fractions:
  - population: SMZL cohorts pooled in a 2024 molecular-landscape review
    case_fraction_low: 7.0
    case_fraction_high: 15.0
    notes: >-
      Reported as 7-15% of SMZL cases in the review's recurrent-mutation table.
    evidence:
    - reference: PMID:39280243
      reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TNFAIP3 7–15% Mutations resulted in a loss of NF-κB cascade inhibition in other NHLs."
      explanation: Gives the SMZL-specific TNFAIP3 mutation frequency and, in the same row, attributes the NF-kB mechanism to other NHLs rather than to SMZL.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "TNFAIP3 7–15% Mutations resulted in a loss of NF-κB cascade inhibition in other NHLs."
    explanation: Supports recurrent TNFAIP3 mutation in SMZL; marked PARTIAL because the same sentence attributes the NF-kB functional consequence to other non-Hodgkin lymphomas, not to SMZL.
  - reference: PMID:36947202
    reference_title: "Molecular associations of response to the new-generation BTK inhibitor zanubrutinib in marginal zone lymphoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88, TNFAIP3, and KMT2D mutations correlate with PFS in patients with relapsed/refractory MZL treated with zanubrutinib."
    explanation: Shows TNFAIP3 is prognostically relevant under BTK inhibition; marked PARTIAL because the cohort spans marginal zone lymphoma subtypes rather than SMZL specifically.
- name: Deletion of Chromosome 7q
  association: Most Frequent Cytogenetic Lesion
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Deletion of the long arm of chromosome 7, most often 7q31-32, is the single
    most frequent recurrent lesion in SMZL, more common than any individual
    point-mutated gene. No gene_term is bound because the lesion is a
    multi-gene chromosomal region rather than a single gene; the minimally
    deleted region removes both coding genes and microRNAs, and no single
    driver within it has been established. Together with IGHV1-2*04 usage it is
    one of the two strongest diagnostic pointers for SMZL.
  case_fractions:
  - population: SMZL cohorts pooled in a 2024 molecular-landscape review
    case_fraction_percent: 40.0
    notes: >-
      Reported as approximately 40% of SMZL cases.
    evidence:
    - reference: PMID:39280243
      reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "del(7q) (approximately 40% cases)"
      explanation: Gives the del(7q) share of SMZL cases.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cytogenetic studies have identified recurrent chromosomal abnormalities such as deletion of the long arm of chromosome 7"
    explanation: Establishes deletion of chromosome 7q as the recurrent cytogenetic abnormality of SMZL.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IGHV1-2*04 and/or del(7q) are very strong pointers for the diagnosis of SMZL"
    explanation: Establishes del(7q) as one of the two strongest diagnostic pointers for SMZL.
- name: TP53 Disruption
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: Adverse Prognostic Lesion
  relationship_type: MODIFIER
  variant_origin: SOMATIC
  notes: >-
    TP53 is among the recurrently mutated genes in SMZL and is associated with
    inferior outcome and with histological transformation to large cell
    lymphoma.
  case_fractions:
  - population: SMZL cohorts pooled in a 2024 molecular-landscape review
    case_fraction_percent: 15.0
    notes: >-
      Reported as 15% of SMZL cases; a flowchart caption in the same review gives 10-15%.
    evidence:
    - reference: PMID:39280243
      reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "KLF2 (12–42%), NOTCH2 (10–25%), and TP53 (15%) are among the most frequently mutated genes"
      explanation: Gives the TP53 share of SMZL cases.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified recurring mutations in KLF2, NOTCH2, and TP53, as well as genes clustering within vital B-cell differentiation pathways"
    explanation: Establishes TP53 as one of the three recurrently mutated genes in the SMZL landscape.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.13
  notes: >-
    Reported annual incidence of 0.13 per 100,000 individuals, i.e. 1.3 per
    million, placing SMZL in the 1-9 per million band.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with an incidence rate of 0.13 per 100,000 individuals per year"
    explanation: Gives the annual incidence of SMZL as a population rate.
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    SMZL accounts for fewer than 2% of lymphoid neoplasms. This is a case-mix
    fraction among lymphoid malignancies rather than a population rate, so no
    normalized rate per 100,000 is recorded.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splenic marginal zone lymphoma (SMZL) is a rare, predominantly indolent B-cell lymphoma constituting fewer than 2% of lymphoid neoplasms."
    explanation: Provides the share of lymphoid neoplasms accounted for by SMZL and characterizes the disease as rare.
progression:
- phase: Indolent phase
  notes: >-
    Most patients follow a prolonged indolent course. A substantial minority,
    however, have materially shorter survival despite available treatment,
    which is why risk stratification rather than uniform therapy governs
    management.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "around 30% of patients have a shorter survival despite currently available treatments"
    explanation: Quantifies the minority of SMZL patients whose disease does not follow the expected indolent course.
  - reference: PMID:8652403
    reference_title: "Splenic lymphoma with villous lymphocytes: clinical presentation, biology and prognostic factors in a series of 100 patients. Groupe Francais d'Hématologie Cellulaire (GFHC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLVL is a disease of the elderly with a relatively benign clinical course."
    explanation: Characterizes the typical course as indolent and establishes the older adult age distribution.
  - reference: PMID:8652403
    reference_title: "Splenic lymphoma with villous lymphocytes: clinical presentation, biology and prognostic factors in a series of 100 patients. Groupe Francais d'Hématologie Cellulaire (GFHC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present series the 5-year overall survival was 78%."
    explanation: Quantifies survival in a 100-patient series, giving a concrete measure of the indolent course.
- phase: Histological transformation to large cell lymphoma
  notes: >-
    A minority of cases undergo histological transformation to a large cell
    lymphoma, which carries a markedly worse prognosis and represents the main
    lethal endpoint of the disease. The source review is internally
    inconsistent on the rate: its abstract and body give 5-15%, while Table 1
    gives 10-20% into DLBCL. Both figures are recorded rather than silently
    reconciled, the same treatment applied to the KLF2 case-fraction
    discrepancy.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the prognosis is especially poor for the 5-15% of cases that transform to a large cell lymphoma"
    explanation: Quantifies the transformation rate and its prognostic impact, per the review's abstract and body text.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Transformation 10–20% into DLBCL"
    explanation: Table 1 of the same review gives a higher transformation rate than its body text; recorded as PARTIAL to make the intra-paper discrepancy explicit rather than picking one figure.
treatments:
- name: Observation
  description: >-
    Asymptomatic patients with low-risk disease can be managed expectantly. A
    prospective study of a risk-adapted strategy found observation to be the
    best approach for the lowest-risk group, making watchful waiting an
    evidence-based option rather than merely a default.
  evidence:
  - reference: PMID:37386877
    reference_title: "Low-risk HPLLs/ABC score patients with splenic marginal zone lymphoma can be safely managed without treatment: Results from a prospective Spanish study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "observation as the best approach for patients in group A and rituximab as the best treatment for group B"
    explanation: Prospective multicenter study supports observation for the lowest-risk SMZL group.
  - reference: PMID:8652403
    reference_title: "Splenic lymphoma with villous lymphocytes: clinical presentation, biology and prognostic factors in a series of 100 patients. Groupe Francais d'Hématologie Cellulaire (GFHC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment abstention should be considered in patients with favourable prognostic factors"
    explanation: An earlier 100-patient series independently reached the same conclusion that untreated observation is appropriate for favourable-risk patients.
- name: Rituximab
  description: >-
    Anti-CD20 monoclonal antibody, now the preferred first-line therapy for
    symptomatic SMZL. In a prospective multicenter series, rituximab-containing
    arms achieved a higher overall response rate than splenectomy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  evidence:
  - reference: PMID:37386877
    reference_title: "Low-risk HPLLs/ABC score patients with splenic marginal zone lymphoma can be safely managed without treatment: Results from a prospective Spanish study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall response rate was higher in the rituximab chemotherapy and in the rituximab arms compared with the splenectomy arm"
    explanation: Prospective multicenter data show rituximab-containing therapy outperforms splenectomy on overall response rate.
  - reference: PMID:37386877
    reference_title: "Low-risk HPLLs/ABC score patients with splenic marginal zone lymphoma can be safely managed without treatment: Results from a prospective Spanish study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "observation as the best approach for patients in group A and rituximab as the best treatment for group B"
    explanation: Identifies rituximab as the preferred treatment for the risk group requiring therapy.
- name: Splenectomy
  description: >-
    Surgical removal of the spleen, the historical first-line treatment and
    still an option in patients fit for surgery. It corrects the mechanical
    cytopenias and relieves mass effect but does not eradicate the lymphoma, and
    has been largely superseded by rituximab on response-rate grounds.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  evidence:
  - reference: PMID:23712547
    reference_title: "Significant efficacy of 2-chlorodeoxyadenosine{+/-} rituximab in the treatment of splenic marginal zone lymphoma (SMZL): extended follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splenectomy remains one of the first-line options in patients fit for surgery."
    explanation: Confirms splenectomy as an established first-line option for surgically fit SMZL patients.
  - reference: PMID:37386877
    reference_title: "Low-risk HPLLs/ABC score patients with splenic marginal zone lymphoma can be safely managed without treatment: Results from a prospective Spanish study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall response rate was higher in the rituximab chemotherapy and in the rituximab arms compared with the splenectomy arm"
    explanation: Supports the displacement of splenectomy by rituximab on response rate, though lymphoma-specific survival did not differ by treatment received.
  target_mechanisms:
  - target: Splenic White Pulp Infiltration and Hypersplenism
    description: >-
      Splenectomy removes the sequestering organ, correcting the mechanical
      component of the cytopenias.
- name: Hepatitis C Antiviral Therapy
  description: >-
    In hepatitis C virus-associated SMZL, therapy directed at the virus rather
    than at the lymphoma can induce hematologic response. This is the splenic
    counterpart of Helicobacter pylori eradication in gastric MALT lymphoma and
    is the strongest therapeutic evidence for the antigen-driven model of
    marginal zone lymphomagenesis.
  treatment_term:
    preferred_term: Antiviral Therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
  evidence:
  - reference: PMID:25273531
    reference_title: "Non-Hodgkin lymphoma and hepatitis C: where we are and what next?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interferon and ribavirin based treatment proved to be successful in small case series of hepatitis C virus associated splenic lymphoma with villous lymphocytes, therefore, it is suggested that antiviral treatment could be an alternative to chemo-immunotherapy."
    explanation: Documents lymphoma response to antiviral therapy in hepatitis C virus-associated splenic lymphoma with villous lymphocytes.
  - reference: PMID:25273531
    reference_title: "Non-Hodgkin lymphoma and hepatitis C: where we are and what next?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association between hepatitis C virus and certain B-cell non-Hodgkin lymphomas, such as marginal zone lymphomas, is supported by epidemiological studies."
    explanation: Establishes the epidemiological basis for the hepatitis C virus association that makes antiviral therapy rational.
  target_mechanisms:
  - target: Chronic Antigenic Stimulation of Splenic Marginal Zone B Cells
    description: >-
      Clearing the virus removes the chronic antigenic drive sustaining the
      clone, the same logic as Helicobacter pylori eradication in gastric MALT
      lymphoma.
- name: Bruton Tyrosine Kinase Inhibition
  description: >-
    BTK inhibitors block B-cell receptor signal transmission upstream of NF-kB.
    Zanubrutinib is used for relapsed or refractory marginal zone lymphoma after
    anti-CD20 therapy, and mutations in NF-kB pathway genes are associated with
    the response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zanubrutinib
      term:
        id: NCIT:C141428
        label: Zanubrutinib
  evidence:
  - reference: PMID:36947202
    reference_title: "Molecular associations of response to the new-generation BTK inhibitor zanubrutinib in marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88, TNFAIP3, and KMT2D mutations correlate with PFS in patients with relapsed/refractory MZL treated with zanubrutinib."
    explanation: Establishes zanubrutinib use in relapsed or refractory marginal zone lymphoma and links NF-kB pathway genotype to progression-free survival.
  - reference: PMID:36947202
    reference_title: "Molecular associations of response to the new-generation BTK inhibitor zanubrutinib in marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NF-κB, NOTCH, or B-cell receptor (BCR) pathway genes were implicated in samples from 16 of 18 patients (89%)."
    explanation: Provides the mechanistic rationale for BTK inhibition by showing B-cell receptor and NF-kB pathway involvement in the large majority of cases.
  target_mechanisms:
  - target: Constitutive NF-kB Pathway Activation
    description: >-
      BTK inhibition interrupts B-cell receptor signal transmission into the
      NF-kB pathway.
- name: Cladribine with or without Rituximab
  description: >-
    Cladribine (2-chlorodeoxyadenosine), a purine analog, given alone or with an
    anti-CD20 antibody, is an effective pharmacological option for patients who
    are poor surgical candidates. An extended-follow-up series of 50 SMZL
    patients reported an 87% overall response rate and 80% five-year
    progression-free survival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cladribine
      term:
        id: CHEBI:567361
        label: cladribine
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  evidence:
  - reference: PMID:23712547
    reference_title: "Significant efficacy of 2-chlorodeoxyadenosine{+/-} rituximab in the treatment of splenic marginal zone lymphoma (SMZL): extended follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty SMZL patients were treated with Cladribine"
    explanation: Establishes the treated SMZL cohort for this regimen.
  - reference: PMID:23712547
    reference_title: "Significant efficacy of 2-chlorodeoxyadenosine{+/-} rituximab in the treatment of splenic marginal zone lymphoma (SMZL): extended follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ORR was 87%"
    explanation: Quantifies the overall response rate of cladribine-based therapy in SMZL.
  - reference: PMID:23712547
    reference_title: "Significant efficacy of 2-chlorodeoxyadenosine{+/-} rituximab in the treatment of splenic marginal zone lymphoma (SMZL): extended follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After a median follow-up of 48 months, 7 of 41 responsive cases relapsed and the 5-year PFS was 80%."
    explanation: Quantifies durability of response with 5-year progression-free survival.
diagnosis:
- name: Immunophenotyping
  description: >-
    Diagnosis is made by combining clinical findings, lymphocyte morphology,
    bone marrow histology, and immunophenotype, because splenectomy is now
    rarely performed for diagnostic purposes. The characteristic profile is a
    CD20-positive clonal B-cell population lacking the markers that define the
    principal mimics, so the diagnosis is substantially one of exclusion by
    marker panel.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diagnosis is usually based on a combination of clinical findings, lymphocyte morphology, bone marrow histology, immunohistochemical and immunophenotypic features"
    explanation: States the composite basis on which SMZL is diagnosed in the absence of splenic histology.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The typical immunophenotype includes surface expression of IgM, CD20, CD27, CD49d, and variable expression of IgD, CD5, CD11c, and CD25"
    explanation: Gives the positive arm of the diagnostic immunophenotype.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lack of expression of CD103, CD123, annexin A1, and cyclin D1 serve to distinguish SMZL from other splenic lymphomas"
    explanation: Gives the exclusionary arm of the panel, the markers whose absence separates SMZL from hairy cell leukemia and mantle cell lymphoma.
  - reference: PMID:8652403
    reference_title: "Splenic lymphoma with villous lymphocytes: clinical presentation, biology and prognostic factors in a series of 100 patients. Groupe Francais d'Hématologie Cellulaire (GFHC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "B-cells expressed CD19+, CD20+, CD22+, CD24+ and DBA44+, whereas the expression of CD5, CD10 and CD25 was usually negative."
    explanation: Independent 100-patient series giving the concordant B-cell marker profile.
differential_diagnoses:
- name: Hairy cell leukemia
  description: >-
    The classic mimic: also presents with splenomegaly and cytopenias, and its
    cells also have cytoplasmic projections. Distinguished by annexin A1, CD103
    and CD123 expression (absent in SMZL) and by BRAF mutation.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88 for WM, BRAF for HCL, NOTCH1 and SF3B1 for CLL, PTPRD for NMZL, and MAP2K1 for HCL-V"
    explanation: Gives BRAF as the molecular discriminator separating hairy cell leukemia from SMZL.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lack of expression of CD103, CD123, annexin A1, and cyclin D1 serve to distinguish SMZL from other splenic lymphomas"
    explanation: Gives the immunophenotypic discriminators; annexin A1, CD103 and CD123 are hairy cell leukemia markers absent in SMZL.
- name: Hairy cell leukemia variant
  description: >-
    A separate entity from classic hairy cell leukemia, distinguished from SMZL
    by MAP2K1 mutation.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88 for WM, BRAF for HCL, NOTCH1 and SF3B1 for CLL, PTPRD for NMZL, and MAP2K1 for HCL-V"
    explanation: Gives MAP2K1 as the molecular discriminator for hairy cell leukemia variant.
- name: Waldenstrom macroglobulinemia
  description: >-
    Overlaps with SMZL in its IgM paraproteinemia and marrow involvement;
    distinguished by MYD88 mutation.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88 for WM, BRAF for HCL, NOTCH1 and SF3B1 for CLL, PTPRD for NMZL, and MAP2K1 for HCL-V"
    explanation: Gives MYD88 as the molecular discriminator for Waldenstrom macroglobulinemia.
- name: Chronic lymphocytic leukemia
  description: >-
    Shares the indolent clonal B-cell lymphocytosis; distinguished by CD5
    expression and by NOTCH1 and SF3B1 mutation.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88 for WM, BRAF for HCL, NOTCH1 and SF3B1 for CLL, PTPRD for NMZL, and MAP2K1 for HCL-V"
    explanation: Gives NOTCH1 and SF3B1 as the molecular discriminators for chronic lymphocytic leukemia.
- name: Nodal marginal zone lymphoma
  description: >-
    The nodal sibling within the marginal zone family; distinguished from SMZL
    by PTPRD mutation and by its nodal rather than splenic distribution.
  evidence:
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYD88 for WM, BRAF for HCL, NOTCH1 and SF3B1 for CLL, PTPRD for NMZL, and MAP2K1 for HCL-V"
    explanation: Gives PTPRD as the molecular discriminator for nodal marginal zone lymphoma.
- name: Splenic diffuse red pulp small B-cell lymphoma
  description: >-
    A rare splenic B-cell lymphoma that infiltrates red pulp diffusely rather
    than forming the micronodular white pulp lesions of SMZL. The CD200/CD180
    fluorescence ratio assists separation.
  evidence:
  - reference: PMID:19575895
    reference_title: "[Clinicopathologic study of splenic marginal zone B-cell lymphoma]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The differential diagnosis includes other small B-cell lymphomas and lymphoid hyperplasia of spleen."
    explanation: Establishes that other small B-cell lymphomas of the spleen are the differential; PARTIAL because this source does not name this entity individually.
  - reference: PMID:39280243
    reference_title: "The genomic and molecular landscape of splenic marginal zone lymphoma, biological and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the CD200/CD180 median fluorescence (MFI) ratio may help to distinguish SDRPL diagnosis over HCL, SMZL, and SBLPN, where a ratio of 0.5 or less is in favour of SDRPL"
    explanation: Gives the specific flow-cytometric discriminator separating SDRPL from SMZL, with its decision threshold.
histopathology:
- name: Micronodular white pulp expansion
  diagnostic: true
  description: >-
    The lymphoma expands the splenic white pulp as micronodular lesions, the
    architectural hallmark of the disease on splenic histology.
  evidence:
  - reference: PMID:19575895
    reference_title: "[Clinicopathologic study of splenic marginal zone B-cell lymphoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all of the 8 cases showed micronodular white pulp lesions"
    explanation: All cases in an 8-patient clinicopathologic series showed the micronodular white pulp pattern.
- name: Biphasic nodule architecture
  description: >-
    Nodules classically show a biphasic structure: a central aggregate of small
    B cells surrounded by a peripheral rim of atypical monocytoid B cells. A
    minority of cases are monomorphous instead.
  evidence:
  - reference: PMID:19575895
    reference_title: "[Clinicopathologic study of splenic marginal zone B-cell lymphoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six of them exhibited the classic biphasic appearance with central aggregates of small B cells rimmed by a peripheral zone of atypical monocytoid B cells."
    explanation: Six of eight cases showed the classic biphasic nodule architecture.
- name: Red pulp infiltration
  description: >-
    Beyond the white pulp nodules, tumor cells infiltrate the red pulp in
    sheets.
  evidence:
  - reference: PMID:19575895
    reference_title: "[Clinicopathologic study of splenic marginal zone B-cell lymphoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was infiltration of tumor cells in the red pulp, sheets in appearance in all 8 cases."
    explanation: All eight cases showed sheet-like red pulp infiltration in addition to the white pulp lesions.
- name: Low proliferation index
  description: >-
    Ki-67 immunostaining shows a low proliferation index, consistent with the
    indolent clinical behavior of the disease.
  evidence:
  - reference: PMID:19575895
    reference_title: "[Clinicopathologic study of splenic marginal zone B-cell lymphoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proliferation index, as highlighted by Ki-67 immunostaining, was low"
    explanation: Documents the low Ki-67 proliferation index that matches the indolent course.
- name: Intrasinusoidal bone marrow infiltration
  description: >-
    Marrow involvement is described in nodular, interstitial, and
    intrasinusoidal patterns. The intrasinusoidal component is often cited as
    characteristic of SMZL, but the supporting evidence available here is a
    single case report, so the finding is recorded without a frequency and
    without a diagnostic flag.
  evidence:
  - reference: PMID:28892912
    reference_title: "Important Diagnostic Clues for Diagnosing Splenic Marginal Zone Lymphoma in Absence of Splenic Histology."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "tumour cells in nodular, interstitial and intrasinusoidal pattern of infiltration"
    explanation: Documents the intrasinusoidal marrow pattern; marked PARTIAL because this is a single case report and cannot establish how characteristic the pattern is.

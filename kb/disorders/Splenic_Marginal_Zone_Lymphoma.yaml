  - target: Constitutive NF-kB Pathway Activation
    description: >-
      Loss of KLF2-mediated restraint and gain of stabilized NOTCH2 signaling
      both feed forward into constitutive NF-kB activity.
- name: Constitutive NF-kB Pathway Activation
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  description: >-
    Recurrent mutations in regulators of the NF-kB pathway, most notably TNFAIP3
    which encodes the negative regulator A20, converge with KLF2 loss and
    stabilized NOTCH2 to drive constitutive nuclear NF-kB activity. This is the
    shared effector node across marginal zone lymphomas: MALT lymphoma reaches
    it through the BCL10-MALT1 translocations, SMZL through mutation of the same
    pathway's regulators. Sequencing of marginal zone lymphoma treated with a
    BTK inhibitor found NF-kB, NOTCH, or B-cell receptor pathway genes involved
    in the large majority of cases, confirming that these three inputs form one
    convergent signaling module. Constitutive NF-kB output sustains
    proliferation and suppresses apoptosis without continued antigenic
    stimulation, which is why advanced disease no longer regresses when the
    antigenic driver is removed.
  evidence:
  - reference: PMID:36947202
    reference_title: "Molecular associations of response to the new-generation BTK inhibitor zanubrutinib in marginal zone lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NF-κB, NOTCH, or B-cell receptor (BCR) pathway genes were implicated in samples from 16 of 18 patients (89%)."
    explanation: Whole-exome sequencing of marginal zone lymphoma shows the NF-kB, NOTCH, and B-cell receptor pathways are involved in the large majority of cases.
  - reference: PMID:22891273
    reference_title: "The coding genome of splenic marginal zone lymphoma: activation of NOTCH2 and other pathways regulating marginal zone development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "given the availability of drugs that can target NOTCH, NF-κB, and other pathways deregulated in this disease"
    explanation: Identifies NF-kB as one of the pathways deregulated in SMZL and therapeutically targetable; indirect support since the paper's primary finding concerns NOTCH2.

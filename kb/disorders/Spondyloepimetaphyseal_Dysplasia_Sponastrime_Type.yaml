  evidence:
  - reference: PMID:27149441
    reference_title: "Arnold Chiari Malformation With Sponastrime (Spondylar and Nasal Changes, With Striations of the Metaphyses) Dysplasia: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The malformation was successfully treated by decompression of the foramen magnum and elevation of the cerebellum, with complete resolution of pain."
    explanation: "The reported procedure and its outcome in the single published case."
  notes: >-

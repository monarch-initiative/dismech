- reference: PMID:42525765
  title: "Pathogenic variants in the human TONSL protein associated with SPONASTRIME dysplasia impair protein dimerization and DNA repair."
notes: >-
  No GeneReviews chapter exists for this disease. PubMed searches for
  "SPONASTRIME GeneReviews", "TONSL GeneReviews" and "spondyloepimetaphyseal
  dysplasia GeneReviews[TI]" all return zero results, checked 2026-09-10. The
  phenotype baseline for this entry is therefore the two 2019 gene-discovery
  cohorts and the subsequent case reports, not an expert-curated chapter, which
  is worth knowing when judging how settled the clinical description is.

name: Spondyloepimetaphyseal Dysplasia Sponastrime Type
creation_date: "2026-09-09T20:00:00Z"
category: Mendelian
synonyms:
- SPONASTRIME dysplasia
- Sponastrime dysplasia
- spondylar and nasal alterations with striated metaphyses
- short-limb dwarfism with saddle nose, spinal alterations, and metaphyseal striation
description: >-
  SPONASTRIME dysplasia is an ultra-rare autosomal recessive spondyloepimetaphyseal
  dysplasia. The name is an acronym for its radiographic triad: SPOndylar
  abnormalities, NAsal changes, and STRIations of the MEtaphyses. It was delineated
  as a radiological entity in 1983 and stayed purely descriptive for 36 years, until
  two independent 2019 exome studies identified biallelic hypomorphic variants in
  TONSL as the cause.

  TONSL is the H4K20me0-reading subunit of the TONSL-MMS22L complex. Newly deposited
  histone H4 is unmethylated at K20, so H4K20me0 marks chromatin as post-replicative,
  and TONSL reading that mark is what recruits the complex to replicated chromatin to
  promote homologous-recombination repair of stalled and collapsed replication forks.
  Hypomorphic TONSL variants therefore produce a genome-instability disease:
  patient-derived fibroblasts show spontaneous chromosome breakage, fewer
  damage-induced RAD51 foci, impaired proliferation and increased apoptosis.

  Two things about this entry are worth stating up front, because they set how far
  the mechanism can be pushed. First, the variants must be hypomorphic and not null:
  a Tonsl knockout mouse is embryonic-lethal, so viable disease requires residual
  function. Second, and this is the substantive gap, the step from a general
  replication-repair defect to a skeleton-dominated phenotype is not established.
  Loss of proliferating growth-plate chondrocytes is the standard explanation and it
  is plausible, but it is an inference; the tissue restriction of a ubiquitously
  required DNA-repair factor has not been demonstrated. The pathophysiology below
  marks that boundary rather than smoothing over it.

  No pathophysiology node declares conforms_to. kb/modules/ does hold
  replication-stress and genome-instability modules, but every one is scoped to
  neoplasia: genome_instability_mutation is explicitly the Hanahan and Weinberg
  enabling characteristic and frames its chain as fuelling clonal evolution, and
  dna_repair_synthetic_lethality is about therapeutic exploitation of
  homologous-recombination deficiency. Neither describes what a replication-repair
  defect does to a developing organism that never becomes a tumour. A
  non-oncological genome-instability module would have conformers already in the
  KB, and this entry would be one of them, but creating it is separate work.

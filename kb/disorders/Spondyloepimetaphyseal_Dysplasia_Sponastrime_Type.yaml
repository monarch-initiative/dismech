    reference_title: "A case report of SPONASTRIME dysplasia with novel TONSL mutation: genetic analysis, clinical manifestations, and the effect of growth hormone treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six-month growth hormone therapy was administered to the patient after confirmed diagnosis, with limited improvement."
    explanation: >-
      The only reported growth hormone course in a molecularly confirmed patient,
      and its stated outcome. Cited as evidence that the treatment is used and that
      the response was limited, not that it works.
  notes: >-
    n=1, six months, one genotype. This establishes that growth hormone has been
    tried and what happened, and nothing about expected benefit in general.
- name: Foramen Magnum Decompression
  description: >
    Surgical decompression where a Chiari malformation is present. Reported once
    in this disease, with resolution of pain. It treats a structural complication
    and has no bearing on the underlying replication-repair defect.
  therapeutic_modality: SURGERY
  treatment_term:

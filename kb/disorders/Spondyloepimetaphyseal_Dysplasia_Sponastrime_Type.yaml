animal_models:
- name: tonsl-null zebrafish
  species: Zebrafish
  genotype: tonsl-/- null
  publication: PMID:30773277
  description: >-
    Null zebrafish showing reduced length, spinal abnormalities, reduced neutrophil
    numbers and early lethality. It reproduces the direction of both the skeletal and
    the haematologic branches of the human phenotype.
  modeled_mechanisms:
  - target: Replication Stress with Chromosome Breakage and Loss of Dividing Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Organism-level consequences consistent with loss of dividing cells: reduced
      length, spinal abnormality, neutropenia.
    limitations: >-
      This is a complete null and the human disease is caused by hypomorphs, so the
      model sits at a different point on the allelic series from the disease. It is
      early-lethal, which is precisely the phenotype the human alleles avoid. It is
      also cited here for organism-level outcomes while the node it attaches to is a
      cellular claim, so the correspondence is inferential in both directions.
    evidence:
    - reference: PMID:30773277
      reference_title: "Bi-allelic Variants in TONSL Cause SPONASTRIME Dysplasia and a Spectrum of Skeletal Dysplasia Phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the discovery of reduced length, spinal abnormalities, reduced numbers of neutrophils, and early lethality in a tonsl-/- zebrafish model"
      explanation: "The model's reported phenotype."
- name: Tonsl knock-in mouse
  species: Mouse
  genotype: Tonsl knock-in
  publication: PMID:30773278
  description: >-
    Embryonic-lethal knock-in. Its value to this entry is as a negative result: it
    shows what happens when residual TONSL function is not preserved, and so bounds
    which human alleles can cause disease rather than death.
  modeled_mechanisms:
  - target: Hypomorphic Loss of TONSL Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model does not reproduce SPONASTRIME dysplasia; it dies in utero. That
      failure is the informative result, because it establishes the hypomorphic
      requirement the node's name asserts.
    limitations: >-
      Embryonic lethality means no skeletal, haematologic or cellular phenotype can be
      assessed in this model, so it contributes nothing to any downstream node. It
      should not be cited as support for any mechanism beyond the requirement for
      residual function.
    evidence:
    - reference: PMID:30773278
      reference_title: "Hypomorphic Mutations in TONSL Cause SPONASTRIME Dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a knock-in (KI) Tonsl mouse model leads to embryonic lethality, implying the physiological importance of TONSL"
      explanation: "The lethality result, reported by the authors as evidence of TONSL's physiological requirement."
definitions:
- name: Molecular confirmation of biallelic TONSL variants
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Confirmation is by exome or genome sequencing, or a targeted skeletal-dysplasia
    panel including TONSL. Both 2019 gene-discovery cohorts reached the gene by
    whole-exome sequencing of radiologically diagnosed patients, which is still the
    route: radiology raises the question and sequencing answers it.
  evidence:
  - reference: PMID:30773278
    reference_title: "Hypomorphic Mutations in TONSL Cause SPONASTRIME Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing (WES), we identified bi-allelic TONSL mutations in 10 of 13 individuals with SPONASTRIME dysplasia."
    explanation: >-
      The confirmatory modality, and a yield figure: 10 of 13 radiologically
      diagnosed individuals had biallelic TONSL variants, so a negative result does
      not exclude the clinical diagnosis.
  notes: >-
    Three of the thirteen individuals in that cohort had no biallelic TONSL variant
    identified. Whether those are locus heterogeneity, missed structural variants,
    or misdiagnosis is not resolved in the source.
- name: Radiological diagnostic criteria for sponastrime dysplasia
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Diagnosis rested on radiological criteria for the 36 years before the gene was
    known, and those criteria remain the entry point: the radiological features are
    more specific than the clinical ones. Molecular confirmation is by exome or genome
    sequencing, or a targeted skeletal-dysplasia panel including TONSL.
  evidence:
  - reference: PMID:9133352
    reference_title: "Sponastrime dysplasia: diagnostic criteria based on five new and six previously published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The radiological features are more specific than the clinical ones."
    explanation: >-
      The stated basis for anchoring the diagnostic criteria on radiology, from the
      paper that defined them.
differential_diagnoses:
- name: Other spondyloepimetaphyseal dysplasias
  description: >
    SPONASTRIME dysplasia sits within a large group of spondyloepimetaphyseal
    dysplasias that share short stature with vertebral and metaphyseal changes.
    What distinguishes it radiographically is the combination of metaphyseal
    striations with the nasal and midface changes, which is what the acronym
    encodes and what the 1997 criteria were built to capture.
  distinguishing_features:
  - >-
    Metaphyseal striations at the distal femur and proximal tibia, together with
    midface hypoplasia and a depressed nasal bridge. Striations may be absent
    early, so their absence at first presentation does not exclude the diagnosis.
  evidence:
  - reference: PMID:9133352
    reference_title: "Sponastrime dysplasia: diagnostic criteria based on five new and six previously published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sponastrime dysplasia is a dwarfing autosomal recessive bone dysplasia, the diagnosis of which is based on a combination of clinical and radiological features."
    explanation: >-
      States that the diagnosis rests on a combination of features rather than any
      single one, which is the basis for distinguishing it within the group.
- name: TONSL-related skeletal dysplasia without metaphyseal striations
  description: >
    The same gene produces a milder spectrum: short stature of varied severity
    with spondylometaphyseal dysplasia, with or without immunologic and
    hematologic abnormalities, and no definitive metaphyseal striations at
    diagnosis. This is not a separate disease so much as the reason a
    striation-negative radiograph does not rule TONSL out.
  distinguishing_features:
  - >-
    Absence of definitive metaphyseal striations at diagnosis, with the spondylar
    and growth features present. Distinguished molecularly rather than
    radiographically.
  evidence:
  - reference: PMID:30773277
    reference_title: "Bi-allelic Variants in TONSL Cause SPONASTRIME Dysplasia and a Spectrum of Skeletal Dysplasia Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four subjects (from three families) with short stature of varied severity and spondylometaphyseal dysplasia with or without immunologic and hematologic abnormalities, but no definitive metaphyseal striations at diagnosis"
    explanation: "Describes the striation-negative end of the TONSL spectrum."
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than about 40 cases have been reported since the 1983 delineation. The two
    2019 gene-discovery cohorts together account for a large share of them. No
    incidence or prevalence estimate exists and none is attempted here.
  evidence:
  - reference: PMID:32959051
    reference_title: "Novel TONSL variants cause SPONASTRIME dysplasia and associate with spontaneous chromosome breaks, defective cell proliferation and apoptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPONASTRIME dysplasia is an ultrarare spondyloepimetaphyseal dysplasia"
    explanation: >-
      Supports the ULTRA_RARE band only. The under-40 case count in the notes is a
      summary across the literature and is not attributed to any single source.
mechanistic_hypotheses:
- hypothesis_group_id: proliferative_tissue_depletion_model
  hypothesis_label: Depletion of proliferating tissues explains the skeletal, lens and dental phenotypes
  status: EMERGING
  description: >-
    The standard explanation for why a defect in a ubiquitously required
    replication-repair factor produces a skeleton-dominated disease: growth-plate
    chondrocytes in the proliferative zone divide rapidly, so they should bear the
    brunt of a replication-stress burden, and their loss would impair endochondral
    ossification. The same argument is applied to two further tissues: lens
    epithelium for the cataract, and odontoblasts for the shortened dental roots.
    Every published source states all three as a model rather than as a result. The
    edges from the cellular defect to those phenotypes opt into this group so a
    reader can see which part of the chain is proposed rather than demonstrated.
  notes: >-
    Marked EMERGING rather than CANONICAL because, although it is the only
    explanation currently offered, it rests on no direct observation of skeletal
    tissue in this disease. It is not marked ALTERNATIVE because there is no
    competing model in the literature to be an alternative to.
discussions:
- discussion_id: chondrocyte_step_unobserved
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a defect in a ubiquitously required replication-repair factor produce a
    phenotype dominated by the skeleton?
  attaches_to:
  - pathophysiology#Loss of Proliferating Growth-Plate Chondrocytes
  rationale: >-
    Everything upstream of this node is measured, and everything downstream is
    observed in patients, but the node itself is not. No study has examined growth-plate
    chondrocytes, or any skeletal tissue, in a person or animal with hypomorphic TONSL.
    The chondrocyte explanation is an inference from which cells divide fastest, and it
    does not by itself explain why other rapidly dividing tissues, notably the gut
    epithelium and the bone marrow as a whole, are comparatively spared. The two edges
    into and out of this node are marked HYPOTHESIZED so the pathograph shows where the
    evidence stops.
  proposed_experiments:
  - experiment_id: growth_plate_hypomorph_animal
    name: Growth-plate analysis in a hypomorphic Tonsl animal
    description: >-
      A knock-in animal carrying a patient allele, such as R934W, rather than a null,
      would survive to skeletal development and allow direct measurement of proliferative-zone
      chondrocyte number, proliferation index and apoptosis against littermate controls.
      The existing knock-in mouse is embryonic-lethal, so this requires a new allele
      rather than reanalysis of an existing model.
    would_support:
    - pathophysiology#Loss of Proliferating Growth-Plate Chondrocytes
    supporting_outcome:
    - >-
      Reduced proliferative-zone chondrocyte number with increased apoptosis and
      disorganised columnar architecture in the growth plate, alongside a skeletal
      phenotype.
    would_refute:
    - pathophysiology#Loss of Proliferating Growth-Plate Chondrocytes
    refuting_outcome:
    - >-
      A skeletal phenotype with normal chondrocyte number, proliferation and apoptosis
      in the growth plate, which would point to a non-proliferative mechanism such as a
      matrix or signalling role for TONSL.
references:
- reference: PMID:30773277
  title: "Bi-allelic Variants in TONSL Cause SPONASTRIME Dysplasia and a Spectrum of Skeletal Dysplasia Phenotypes."
- reference: PMID:30773278

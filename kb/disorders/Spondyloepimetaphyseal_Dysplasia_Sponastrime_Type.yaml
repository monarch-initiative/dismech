variants:
- name: TONSL p.Arg934Trp
  description: >
    Recurrent missense variant in the ubiquitin-like domain. It abolishes TONSL
    homodimerization by removing critical hydrogen bonds and introducing steric
    clashes, forcing the monomeric conformation. Biochemically the wild-type UBL
    is a dimer while the R934W UBL stays monomeric.
  gene:
    preferred_term: TONSL
    term:
      id: hgnc:7801
      label: TONSL
  clinical_significance: PATHOGENIC
  type: missense
  evidence:
  - reference: PMID:42525765
    reference_title: "Pathogenic variants in the human TONSL protein associated with SPONASTRIME dysplasia impair protein dimerization and DNA repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The R934W variant eliminates critical hydrogen bonds and introduces steric clashes, forcing monomeric conformation."
    explanation: "The structural mechanism, from 1.9 angstrom crystal structures."
  - reference: PMID:42525765
    reference_title: "Pathogenic variants in the human TONSL protein associated with SPONASTRIME dysplasia impair protein dimerization and DNA repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemically, UBLWT exists as dimers while UBLR934W remains monomeric."
    explanation: "The biochemical confirmation that the structural prediction holds in solution."
- name: TONSL p.Gly973Arg
  description: >
    The second recurrent ubiquitin-like-domain variant. It destabilizes an
    evolutionarily conserved residue within a conformationally restricted
    beta-turn, and like R934W it abolishes dimerization.
  gene:
    preferred_term: TONSL
    term:
      id: hgnc:7801
      label: TONSL
  clinical_significance: PATHOGENIC
  type: missense
  evidence:
  - reference: PMID:42525765
    reference_title: "Pathogenic variants in the human TONSL protein associated with SPONASTRIME dysplasia impair protein dimerization and DNA repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "G973R destabilizes an evolutionarily conserved residue within a conformationally restricted beta-turn."
    explanation: "The structural basis for this recurrent allele."

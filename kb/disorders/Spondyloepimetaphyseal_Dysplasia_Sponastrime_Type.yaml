      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30773278
    reference_title: "Hypomorphic Mutations in TONSL Cause SPONASTRIME Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing (WES), we identified bi-allelic TONSL mutations in 10 of 13 individuals with SPONASTRIME dysplasia."
    explanation: "Establishes biallelic TONSL variants as the cause in the majority of a 13-person cohort."
pathophysiology:
- name: Hypomorphic Loss of TONSL Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic TONSL variants reduce, without abolishing, the function of the
    Tonsoku-like DNA repair protein. Two structural routes are documented. Ankyrin
    repeat domain variants impair the H4K20me0 histone-reading function; ubiquitin-like
    domain variants, including the recurrent R934W and G973R, abolish TONSL
    homodimerization. R934W removes hydrogen bonds and introduces steric clashes that
    force a monomeric conformation, and G973R destabilizes a conserved residue in a
    constrained beta-turn.
  molecular_functions:
  - preferred_term: TONSL histone H4K20me0 reading and dimerization
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0042393
      label: histone binding
  evidence:
  - reference: PMID:42525765
    reference_title: "Pathogenic variants in the human TONSL protein associated with SPONASTRIME dysplasia impair protein dimerization and DNA repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We reveal that TONSL homo-dimerizes via its ubiquitin-like domain (UBL), and two recurrent SPONASTRIME dysplasia causative variants (R934W and G973R) abolish this dimerization."
    explanation: "Identifies the dimerization-loss mechanism for the two recurrent variants."
  - reference: PMID:42525765
    reference_title: "Pathogenic variants in the human TONSL protein associated with SPONASTRIME dysplasia impair protein dimerization and DNA repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The R934W variant eliminates critical hydrogen bonds and introduces steric clashes, forcing monomeric conformation. G973R destabilizes an evolutionarily conserved residue within a conformationally restricted beta-turn."
    explanation: "The structural detail behind each recurrent variant, from 1.9 angstrom crystal structures."
  - reference: PMID:30773278
    reference_title: "Hypomorphic Mutations in TONSL Cause SPONASTRIME Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show here that cellular defects in dermal fibroblasts from affected individuals are complemented by the expression of wild-type TONSL."
    explanation: >-
      Rescue by wild-type TONSL, which is what establishes that the cellular phenotype
      is caused by the TONSL variants rather than merely correlated with them.
  downstream:
  - target: Failure to Recruit TONSL-MMS22L to Post-Replicative Chromatin
    causal_link_type: DIRECT
- name: Failure to Recruit TONSL-MMS22L to Post-Replicative Chromatin
  biological_scale: MOLECULAR
  description: >-
    Histone H4 deposited during replication is unmethylated at K20, so H4K20me0
    marks chromatin as newly replicated until late G2/M. The TONSL ankyrin repeat
    domain reads that mark, and that reading is what puts the TONSL-MMS22L complex
    on replicated chromatin and at challenged forks. Losing the reader, or losing
    the dimer, removes the complex from the place it is needed.
  biological_processes:
  - preferred_term: replication fork processing
    modifier: DECREASED
    term:
      id: GO:0031297
      label: replication fork processing
  evidence:
  - reference: PMID:27338793
    reference_title: "H4K20me0 marks post-replicative chromatin and recruits the TONSL-MMS22L DNA repair complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identify the TONSL ankyrin repeat domain (ARD) as a reader of histone H4 tails unmethylated at K20 (H4K20me0), which are specific to new histones incorporated during DNA replication and mark post-replicative chromatin until the G2/M phase of the cell cycle."
    explanation: "Establishes the histone mark and the domain that reads it."
  - reference: PMID:27338793
    reference_title: "H4K20me0 marks post-replicative chromatin and recruits the TONSL-MMS22L DNA repair complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "H4K20me0 recognition is required for TONSL-MMS22L binding to chromatin and accumulation at challenged replication forks and DNA lesions."
    explanation: >-
      The necessity claim this node depends on: without the reading step there is no
      recruitment. Note this is shown with engineered ARD mutants, not with the
      patient alleles.
  downstream:
  - target: Impaired Homologous-Recombination Repair at Stalled Forks
    causal_link_type: DIRECT
- name: Impaired Homologous-Recombination Repair at Stalled Forks
  biological_scale: CELLULAR
  description: >-
    The TONSL-MMS22L complex promotes RAD51 loading and homologous-recombination
    restart of stalled and collapsed replication forks. With the complex mislocalised
    or monomeric, RAD51 focus formation after genotoxic stress is reduced and
    replication-associated double-strand breaks go unrepaired.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: DECREASED
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:30773277
    reference_title: "Bi-allelic Variants in TONSL Cause SPONASTRIME Dysplasia and a Spectrum of Skeletal Dysplasia Phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "functional studies revealed increased amounts of spontaneous replication fork stalling and chromosomal aberrations, as well as fewer camptothecin (CPT)-induced RAD51 foci in subject-derived cell lines"
    explanation: >-
      Measures the repair defect directly in patient cells: more stalling, more
      aberrations, less RAD51 loading.
  - reference: PMID:42525765
    reference_title: "Pathogenic variants in the human TONSL protein associated with SPONASTRIME dysplasia impair protein dimerization and DNA repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "dimerization-deficient variants fail to suppress replication stress-induced DNA damage, show impaired RAD51 foci formation, and exhibit severely compromised survival following genotoxic stress"
    explanation: "Connects the dimerization defect specifically to the repair failure and to reduced survival."
  downstream:
  - target: Replication Stress with Chromosome Breakage and Loss of Dividing Cells
    causal_link_type: DIRECT
- name: Replication Stress with Chromosome Breakage and Loss of Dividing Cells
  biological_scale: CELLULAR
  description: >-
    The cellular endpoint measured in patients: spontaneous chromosomal breaks on
    cytogenetic analysis of patient fibroblasts, with flow cytometry showing defective
    proliferation and enhanced apoptosis. This is a burden that falls on dividing
    cells, so it predicts a phenotype concentrated in proliferative tissue.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  - preferred_term: cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:32959051
    reference_title: "Novel TONSL variants cause SPONASTRIME dysplasia and associate with spontaneous chromosome breaks, defective cell proliferation and apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cytogenetic analysis and microscopy assays showed that patient-derived fibroblasts exhibited spontaneous chromosomal breaks and flow cytometry demonstrated defects in cell proliferation and enhanced apoptosis"
    explanation: >-
      The three cellular readouts, all in patient-derived cells rather than in an
      engineered model.
  downstream:
  - target: Loss of Proliferating Growth-Plate Chondrocytes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - proliferative_tissue_depletion_model
  - target: Developmental cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lens epithelium is a proliferative tissue, so the same replication-stress
      burden is the proposed route to cataract. Same standing as the chondrocyte
      branch: proposed, not demonstrated.
    hypothesis_groups:
    - proliferative_tissue_depletion_model
  - target: Short dental root
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Odontoblasts are likewise proliferative, and root formation is the part of
      tooth development that depends on sustained division. Proposed on the same
      basis and with the same lack of direct evidence.
    hypothesis_groups:
    - proliferative_tissue_depletion_model
  - target: Decreased total neutrophil count
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Decreased circulating immunoglobulin concentration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Loss of Proliferating Growth-Plate Chondrocytes
  biological_scale: TISSUE
  description: >-
    The proposed skeletal step: chondrocytes in the proliferative zone of the growth
    plate divide rapidly, so a replication-repair defect should deplete them, impairing
    endochondral ossification and producing the short stature, metaphyseal striations
    and age-dependent vertebral changes.

    This node is explicitly a hypothesis and is marked as such on its incoming edge.
    No published study has examined growth-plate chondrocytes in this disease. What is
    established is the cellular defect in fibroblasts and the skeletal phenotype in
    patients; the chondrocyte step in between is an inference from what kind of cell
    would be most affected. It is a reasonable inference, and it is also the only
    place in this chain where a common alternative, that the skeletal phenotype
    reflects a non-repair function of TONSL, has not been excluded.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  - preferred_term: chondrocyte proliferation
    modifier: DECREASED
    term:
      id: GO:0035988
      label: chondrocyte proliferation
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    Deliberately carries no evidence item. Every source that states this step states
    it as a model rather than as a result, and quoting a source's own speculation as
    if it were a finding is exactly what the evidence policy forbids. The knowledge
    gap is recorded in discussions instead.
  downstream:
  - target: Disproportionate short-limb short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - proliferative_tissue_depletion_model
  - target: Metaphyseal striations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - proliferative_tissue_depletion_model
  - target: Platyspondyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - proliferative_tissue_depletion_model

clinical_burden:
  burden_level: HIGH
  rationale: >-
    CCHF is the most important tick-borne viral disease of humans and carries
    case-fatality rates reported above 30% in some regions, with no licensed
    vaccine or specific antiviral and a propensity for high-mortality
    nosocomial outbreaks.
  evidence:
  - reference: PMID:23906741
    reference_title: "Crimean-Congo hemorrhagic fever: history, epidemiology, pathogenesis, clinical syndrome and genetic diversity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      is the most important tick-borne viral disease of humans, causing sporadic cases or outbreaks of severe illness across a huge geographic area
    explanation: Establishes CCHF as the leading tick-borne viral disease of humans with a wide range.
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Case fatality rates vary but can be higher than 30% in some regions.
    explanation: Quantifies the high case-fatality rate underlying the burden level.
infectious_agent:
- name: Crimean-Congo hemorrhagic fever orthonairovirus (CCHFV)
  description: >-
    The etiological agent is Crimean-Congo hemorrhagic fever orthonairovirus
    (CCHFV), an enveloped, tri-segmented, negative-sense RNA virus of the genus
    Orthonairovirus, family Nairoviridae, order Bunyavirales. Its surface
    glycoproteins Gn and Gc mediate receptor binding and entry, and the OTU
    domain of its L protein antagonises the host type I interferon response.
  infectious_agent_term:
    preferred_term: Crimean-Congo hemorrhagic fever orthonairovirus
    term:
      id: NCBITaxon:3052518
      label: Orthonairovirus haemorrhagiae
  evidence:
  - reference: PMID:39558265
    reference_title: "Crimean-Congo haemorrhagic fever among healthcare workers in Iran 2000-2023, a report of National Reference Laboratory."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      a tick-borne RNA virus belonging to the genus Orthonairovirus, family Nairoviridae, in the Bunyavirales order
    explanation: Places CCHFV taxonomically in the genus Orthonairovirus, family Nairoviridae, order Bunyavirales.
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CCHFV is an enveloped negative-sense RNA virus belonging to the Orthonairovirus genus in the Nairoviridae family of the Bunyavirales order
    explanation: Confirms the virus genome type and taxonomic classification.
transmission:
- name: Tick bite by Hyalomma ticks
  description: >-
    The commonest route of human infection is the bite of an infected Hyalomma
    tick, with agricultural and outdoor workers at highest risk. Hyalomma ticks
    are the principal source of human infection.
  evidence:
  - reference: PMID:23906741
    reference_title: "Crimean-Congo hemorrhagic fever: history, epidemiology, pathogenesis, clinical syndrome and genetic diversity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hyalomma ticks are the principal source of human infection
    explanation: Identifies the tick bite by Hyalomma as the principal route of human infection.
  - reference: PMID:23906741
    reference_title: "Crimean-Congo hemorrhagic fever: history, epidemiology, pathogenesis, clinical syndrome and genetic diversity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CCHF occurs most frequently among agricultural workers following the bite of an infected tick
    explanation: Ties tick-bite transmission to the agricultural occupational setting where it occurs most often.
- name: Contact with blood and tissues of viraemic livestock
  description: >-
    Humans are also infected by direct contact with the blood and tissues of
    infected livestock, chiefly during slaughter and butchering; livestock are
    viraemic but show no apparent illness. Slaughterhouse workers, shepherds,
    butchers and veterinarians are at risk.
  evidence:
  - reference: PMID:23906741
    reference_title: "Crimean-Congo hemorrhagic fever: history, epidemiology, pathogenesis, clinical syndrome and genetic diversity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      slaughterhouse workers exposed to the blood and tissues of infected livestock
    explanation: Documents contact with viraemic livestock blood and tissue as a route of infection.
- name: Nosocomial and person-to-person blood and body-fluid exposure
  description: >-
    CCHFV spreads to medical personnel and family caregivers through contact
    with the blood and body fluids of infected patients. In a national series
    of confirmed healthcare-worker infections the predominant nosocomial routes
    were percutaneous needle-stick, mucosal blood splash, and skin contact with
    blood.
  evidence:
  - reference: PMID:23906741
    reference_title: "Crimean-Congo hemorrhagic fever: history, epidemiology, pathogenesis, clinical syndrome and genetic diversity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      medical personnel through contact with the body fluids of infected patients
    explanation: Establishes person-to-person transmission to medical personnel via body fluids.
  - reference: PMID:39558265
    reference_title: "Crimean-Congo haemorrhagic fever among healthcare workers in Iran 2000-2023, a report of National Reference Laboratory."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Percutaneous exposure (needle stick) (three cases), mucosal exposure (blood splash in to face) (three cases) and skin contact with blood (three cases) constituted the most prevalent routes of transmission.
    explanation: Reconstructs the occupational blood-exposure routes from the national healthcare-worker series.
agent_life_cycle:
  description: >-
    CCHFV is maintained in an enzootic cycle between Hyalomma ticks, the
    principal vector and reservoir, and a range of wild and domestic
    vertebrates that develop viraemia without apparent illness and serve as
    amplifying hosts (livestock such as cattle, sheep and goats, and wild hosts
    including hares, small rodents and ostriches). The virus is passed in both
    vertical and horizontal transmission cycles within the tick population, and
    amplifying hosts spread virus from infected to uninfected ticks by
    co-feeding or by supporting a viraemic blood meal. Humans are incidental,
    dead-end hosts that do not maintain the cycle.
  hosts:
  - preferred_term: Hyalomma tick (principal vector and reservoir)
    role: vector and reservoir host
    term:
      id: NCBITaxon:34625
      label: Hyalomma
  - preferred_term: Human (incidental dead-end host)
    role: incidental (dead-end) host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  vectors:
  - Hyalomma spp. ticks (principal vector and reservoir)
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Studies have identified ticks of the Hyalomma genus to be the principal vector and reservoir of CCHFV
    explanation: Identifies Hyalomma ticks as the principal vector and reservoir of the virus.
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These animal species serve as important amplifying hosts for CCHFV, enabling CCHFV to spread from infected ticks to uninfected ticks through either co-feeding or feeding on a viraemic animal
    explanation: Establishes vertebrate amplifying hosts and the tick-to-tick spread they enable.
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Given that humans are incidental hosts for CCHFV
    explanation: Supports humans as incidental, dead-end hosts.
  - reference: PMID:23906741
    reference_title: "Crimean-Congo hemorrhagic fever: history, epidemiology, pathogenesis, clinical syndrome and genetic diversity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CCHFV is maintained in vertical and horizontal transmission cycles involving ixodid ticks and a variety of wild and domestic vertebrates, which do not show signs of illness.
    explanation: Supports the vertical and horizontal tick maintenance cycle and the asymptomatic vertebrate hosts.
environmental:
- name: Tick bite or contact with viraemic livestock blood
  description: >-
    The environmental exposure that initiates infection: the bite of an
    infected Hyalomma tick, or direct contact with the blood and tissues of a
    viraemic animal at slaughter. It is bound to the broad ECTO class
    "exposure to virus" because ECTO has no CCHFV- or tick-bite-specific
    exposure term.
  exposure_term:
    preferred_term: Tick bite or contact with viraemic livestock blood
    term:
      id: ECTO:3000001
      label: exposure to virus
  influences_mechanisms:
  - target: CCHFV inoculation and LDLR-mediated entry into monocytes, macrophages and endothelium
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Tick bite or contact with viraemic livestock blood is the route by which
      CCHFV is inoculated into the host and the infection begins.
    evidence:
    - reference: PMID:23906741
      reference_title: "Crimean-Congo hemorrhagic fever: history, epidemiology, pathogenesis, clinical syndrome and genetic diversity."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        CCHF occurs most frequently among agricultural workers following the bite of an infected tick
      explanation: Establishes the tick bite as the route by which the inoculating exposure occurs.
  notes: >-
    ECTO was searched for a CCHFV- or tick-bite-specific exposure term: "l~tick"
    returns only ECTO:3000183 exposure to Tick-borne encephalitis virus, and
    "l~bite" returns no arthropod-bite exposure class. The broad class
    ECTO:3000001 "exposure to virus" is the bound term (the same class
    Ebola_Virus_Disease_EVD binds for its animal-reservoir exposure); the
    specific route is carried in preferred_term.
  evidence:
  - reference: PMID:23906741
    reference_title: "Crimean-Congo hemorrhagic fever: history, epidemiology, pathogenesis, clinical syndrome and genetic diversity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hyalomma ticks are the principal source of human infection
    explanation: Supports tick exposure as the principal source of human infection.
pathophysiology:
- name: CCHFV inoculation and LDLR-mediated entry into monocytes, macrophages and endothelium
  biological_scale: MOLECULAR
  description: >-
    Inoculated CCHFV uses its surface glycoproteins Gn and Gc for receptor
    binding, with the low-density lipoprotein receptor (LDLR) acting as a
    critical entry receptor, and enters the mononuclear phagocytes, dendritic
    cells, endothelial cells and hepatocytes that are the main cellular targets
    of infection.
  downstream:
  - target: OTU-mediated interferon antagonism and high viremia
    description: Productive infection of the first target cells seeds systemic viral replication.
    causal_link_type: DIRECT
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: viral entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:38548922
    reference_title: Crimean-Congo haemorrhagic fever virus uses LDLR to bind and enter host cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the Low Density Lipoprotein Receptor (LDLR) is a critical receptor for CCHFV cell entry, playing a vital role in CCHFV infection in cell culture and blood vessel organoids
    explanation: Identifies LDLR as a critical entry receptor in cell culture and blood-vessel organoids.
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The viral glycoproteins Gn and Gc are found on the virion surface and are responsible for receptor binding and viral entry
    explanation: Supports Gn/Gc as the glycoproteins mediating receptor binding and entry.
  - reference: PMID:27110812
    reference_title: Molecular Insights into Crimean-Congo Hemorrhagic Fever Virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main cellular targets of infection are mononuclear phagocytes, endothelial cells, and hepatocytes
    explanation: Establishes the mononuclear phagocyte, endothelial and hepatocyte targets of infection.
- name: OTU-mediated interferon antagonism and high viremia
  conforms_to: "viral_hemorrhagic_fever_syndrome#High Viremia and Vascular Target Infection"
  biological_scale: ORGANISM
  description: >-
    The OTU (ovarian tumour-like protease) domain of the CCHFV L protein blocks
    RIG-I-dependent initiation of the type I interferon response through its
    deubiquitylating activity. Early failure of antiviral immunity permits
    high-titre viraemia, and the severity of CCHF correlates with the magnitude
    of viral load and dissemination. This is the CCHF-specific substitution at
    the module's shared high-viremia node.
  downstream:
  - target: Dysregulated proinflammatory cytokine response
    description: High viral burden presented to myeloid cells drives an inflammatory cytokine response.
    causal_link_type: DIRECT
  - target: Hepatocyte infection and hepatocellular necrosis
    description: Disseminated high-titre virus reaches and injures the liver, a major target organ.
    causal_link_type: DIRECT
  - target: Endothelial activation and vascular damage
    description: High-titre virus is presented to the vascular endothelium, the vascular arm of the syndrome.
    causal_link_type: DIRECT
  - target: Leukopenia
    description: High viraemia is accompanied by an early fall in the circulating leukocyte count.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Splenomegaly
    description: Infection of the reticuloendothelial system during high viraemia produces splenic enlargement.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  biological_processes:
  - preferred_term: negative regulation of type I interferon production
    modifier: INCREASED
    term:
      id: GO:0032480
      label: negative regulation of type I interferon production
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  cell_types:
  - preferred_term: mononuclear phagocyte
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The OTU domain of the CCHFV L protein blocks RIG-I-dependent initiation of the type I interferon response via its deubiquitylating function.
    explanation: Supports the OTU-mediated antagonism of type I interferon signalling.
  - reference: PMID:27110812
    reference_title: Molecular Insights into Crimean-Congo Hemorrhagic Fever Virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Severity of CCHF correlates with increased viral load and dissemination, low anti-CCHFV antibody titers, severity of thrombocytopenia, increased clotting times, hemorrhage
    explanation: Links high viral load and dissemination to disease severity.
- name: Dysregulated proinflammatory cytokine response
  biological_scale: CELLULAR
  description: >-
    Infected myeloid cells release a dysregulated proinflammatory cytokine
    response. In fatal CCHF, serum interleukin-6 and tumour necrosis factor
    alpha are significantly higher than in nonfatal disease and correlate
    positively with disseminated intravascular coagulation scores, implicating
    the cytokine response in the constitutional illness and in the hemostatic
    failure of severe disease.
  downstream:
  - target: Endothelial activation and vascular damage
    description: Circulating proinflammatory cytokines act on the vascular endothelium.
    causal_link_type: DIRECT
  - target: Consumptive coagulopathy and disseminated intravascular coagulation
    description: The proinflammatory cytokine response tracks with the consumptive coagulopathy of fatal disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Fever
    description: The systemic inflammatory response produces fever at the onset of illness.
    causal_link_type: DIRECT
  - target: Headache
    description: Constitutional symptom of the systemic inflammatory response.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myalgia
    description: Constitutional symptom of the systemic inflammatory response.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nausea
    description: Constitutional symptom of the pre-haemorrhagic illness.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Vomiting
    description: Constitutional gastrointestinal symptom of the pre-haemorrhagic illness.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abdominal pain
    description: Constitutional gastrointestinal symptom of the pre-haemorrhagic illness.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Diarrhea
    description: Constitutional gastrointestinal symptom of the pre-haemorrhagic illness.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:16518755
    reference_title: "Evaluation of serum levels of interleukin (IL)-6, IL-10, and tumor necrosis factor-alpha in patients with Crimean-Congo hemorrhagic fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      were significantly higher in patients with fatal CCHF than in patients with nonfatal CCHF
    explanation: Shows IL-6 and TNF-alpha are elevated in fatal relative to nonfatal CCHF.
  - reference: PMID:16518755
    reference_title: "Evaluation of serum levels of interleukin (IL)-6, IL-10, and tumor necrosis factor-alpha in patients with Crimean-Congo hemorrhagic fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Levels of IL-6 and TNF-alpha were positively correlated with DIC scores
    explanation: Links the proinflammatory cytokine response to the consumptive coagulopathy of severe disease.
- name: Hepatocyte infection and hepatocellular necrosis
  biological_scale: CELLULAR
  description: >-
    The liver is a major target organ. In mouse models hepatocytes are targets
    of CCHFV infection, and liver pathology is associated with activation of the
    tumour necrosis factor superfamily and apoptosis in infected and bystander
    cells. Hepatocellular injury is reflected clinically in markedly elevated
    serum transaminases and other markers of cell damage, and contributes to
    the loss of hepatic synthetic function.
  downstream:
  - target: Decreased hepatic coagulation factor production
    description: Hepatocellular injury reduces synthesis of coagulation factors made in the liver.
    causal_link_type: DIRECT
  - target: Elevated hepatic transaminases
    description: Hepatocellular damage releases aspartate and alanine aminotransferases into the serum.
    causal_link_type: DIRECT
  - target: Increased lactate dehydrogenase
    description: Tissue and hepatocellular injury raises serum lactate dehydrogenase.
    causal_link_type: DIRECT
  - target: Elevated creatine kinase
    description: Tissue injury raises serum creatine kinase in fatal disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hyperbilirubinemia
    description: Hepatocellular injury raises serum bilirubin.
    causal_link_type: DIRECT
  - target: Hepatic failure
    description: Severe hepatocellular necrosis can progress to liver failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Hepatomegaly
    description: Hepatic infection and injury produce liver enlargement.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: hepatocyte apoptotic process
    modifier: INCREASED
    term:
      id: GO:0097284
      label: hepatocyte apoptotic process
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In mice, hepatocytes and endothelial cells are targets of CCHFV infection
    explanation: Supports hepatocytes as direct targets of CCHFV infection in a model organism.
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      activation of the tumour necrosis factor (TNF) superfamily and extensive apoptosis in infected livers suggest that liver pathology may occur through induction of apoptosis in infected and uninfected bystander cells
    explanation: Supports TNF-superfamily-driven apoptosis as a mechanism of the hepatocellular injury.
  - reference: PMID:2749111
    reference_title: The clinical pathology of Crimean-Congo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with fatal infections had thrombocytopenia and markedly elevated levels of serum aspartate and alanine aminotransaminases, gamma-glutamyltransferase, lactic dehydrogenase, creatine kinase, bilirubin, creatinine, and urea.
    explanation: Documents the serum markers of hepatocellular and tissue injury in fatal human cases.
- name: Endothelial activation and vascular damage
  conforms_to: "viral_hemorrhagic_fever_syndrome#Endothelial Activation and Damage"
  biological_scale: CELLULAR
  description: >-
    CCHFV reaches and acts on the vascular endothelium, both by direct infection
    (endothelial cells are targets of infection in mouse models) and through the
    circulating proinflammatory cytokines. The activated and damaged endothelium
    stops behaving as an intact barrier, which is the vascular arm of the
    hemorrhagic fever syndrome.
  downstream:
  - target: Increased vascular permeability
    description: Endothelial activation and damage disrupt barrier integrity and raise vascular permeability.
    causal_link_type: DIRECT
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: endothelial cell activation
    modifier: INCREASED
    term:
      id: GO:0042118
      label: endothelial cell activation
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In mice, hepatocytes and endothelial cells are targets of CCHFV infection
    explanation: Supports endothelial cells as direct targets of CCHFV infection in a model organism.
  - reference: PMID:27110812
    reference_title: Molecular Insights into Crimean-Congo Hemorrhagic Fever Virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main cellular targets of infection are mononuclear phagocytes, endothelial cells, and hepatocytes
    explanation: Confirms the endothelium as a target compartment of CCHFV infection.
- name: Increased vascular permeability
  conforms_to: "viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability"
  biological_scale: TISSUE
  description: >-
    The damaged microvascular endothelium no longer restrains plasma and solute
    movement, producing increased vascular permeability. This is the
    rate-limiting vascular lesion of the hemorrhagic fever syndrome; in severe
    CCHF plasma loss and circulatory failure contribute to shock and
    multi-organ injury.
  downstream:
  - target: Shock
    description: Severe plasma leakage and circulatory failure contribute to shock in fatal disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - intravascular volume depletion and hypotension
  - target: Acute kidney injury
    description: Microvascular leak and hypoperfusion contribute to acute kidney injury in severe disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      with rapid progression to disseminated intravascular coagulation, overt bleeding, kidney, liver or pulmonary failure, and shock
    explanation: Places shock and kidney failure among the severe outcomes of the vascular and hemostatic lesion.
  - reference: PMID:27110812
    reference_title: Molecular Insights into Crimean-Congo Hemorrhagic Fever Virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fatal outcome is typically the result of disseminated intravascular coagulopathy, shock, and/or multi-organ failure
    explanation: Supports shock and multi-organ failure as the mode of fatal outcome.
- name: Consumptive coagulopathy and disseminated intravascular coagulation
  conforms_to: "viral_hemorrhagic_fever_syndrome#Consumptive Coagulopathy"
  biological_scale: ORGANISM
  description: >-
    Widespread activation of coagulation consumes clotting factors and
    platelets, producing disseminated intravascular coagulation. In fatal CCHF
    the prothrombin ratio, activated partial thromboplastin time, thrombin time
    and fibrin degradation products are grossly elevated, the laboratory

- name: Decreased hepatic coagulation factor production
  conforms_to: "viral_hemorrhagic_fever_syndrome#Decreased Coagulation Factor Production"
  biological_scale: ORGANISM
  description: >-
    Hepatocellular injury reduces the liver's synthesis of coagulation factors,
    a second route to bleeding separable from consumption. In fatal CCHF serum
    fibrinogen, total protein and albumin are depressed, consistent with
    impaired hepatic synthetic function.
  downstream:
  - target: Hypofibrinogenemia
    description: Reduced hepatic synthesis lowers circulating fibrinogen.
    causal_link_type: DIRECT
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:2749111
    reference_title: The clinical pathology of Crimean-Congo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Total protein, albumin, fibrinogen, and hemoglobin levels were depressed.
    explanation: Documents depressed fibrinogen and other hepatically synthesised proteins in fatal disease.
- name: Platelet consumption and reduced platelet number
  conforms_to: "viral_hemorrhagic_fever_syndrome#Reduced Platelet Number"
  biological_scale: CELLULAR
  description: >-
    Platelets are consumed and lost, producing the thrombocytopenia that is a
    hallmark of severe CCHF and a marker of fatal outcome. Loss of platelets,
    with the coagulopathy, converts vascular fragility into overt bleeding such
    as petechiae and ecchymoses.
  downstream:
  - target: Thrombocytopenia
    description: Platelet consumption and loss are detected clinically as thrombocytopenia.
    causal_link_type: DIRECT
  - target: Petechiae
    description: Thrombocytopenia with vascular fragility produces a petechial rash.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Ecchymosis
    description: Thrombocytopenia with vascular fragility produces extended ecchymoses.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

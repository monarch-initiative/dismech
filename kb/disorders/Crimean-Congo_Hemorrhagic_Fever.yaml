diagnosis:
- name: Molecular detection of CCHFV RNA
  description: >-
    Quantitative reverse transcription PCR is the method of choice for rapid
    detection of CCHFV during the acute, viraemic phase. Antigen detection and
    virus isolation are alternatives, the latter requiring high-containment
    (BSL-4) facilities.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  measurements:
  - preferred_term: Crimean-Congo hemorrhagic fever virus RNA
    term:
      id: LOINC:88192-0
      label: Crimean-Congo hemorrhagic fever virus RNA [Presence] in Serum by NAA with probe detection
  notes: >-
    The Monarch KG has no method-less CCHFV RNA-presence code (searches
    "Crimean-Congo hemorrhagic fever virus RNA", "Crimean-Congo hemorrhagic
    fever virus RNA Presence Specimen"; both return only NAA-with-probe- or
    NAA-with-non-probe-qualified codes, in Serum or in Blood). The bound code
    (NAA with probe detection, Serum) is the identity level available there.
    Antigen detection and virus isolation, also named here as alternatives,
    are not themselves coded.
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The method of choice for rapid CCHFV detection is quantitative reverse transcription PCR
    explanation: Establishes qRT-PCR as the first-line acute-phase diagnostic.
- name: Serological detection of anti-CCHFV antibody
  description: >-
    IgM-capture and IgG enzyme-linked immunosorbent assays detect the antibody
    response and are used for diagnosis, particularly later in illness when
    viraemia is falling; an IgM-capture ELISA was one of the two assays used to
    confirm cases in a national reference laboratory.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  measurements:
  - preferred_term: Crimean-Congo hemorrhagic fever virus IgM antibody
    term:
      id: LOINC:88190-4
      label: Crimean-Congo hemorrhagic fever virus IgM Ab [Presence] in Serum by Immunoassay
  - preferred_term: Crimean-Congo hemorrhagic fever virus IgG antibody
    term:
      id: LOINC:88191-2
      label: Crimean-Congo hemorrhagic fever virus IgG Ab [Presence] in Serum by Immunoassay
  notes: >-
    Both codes are bound because the row names both assays jointly
    (IgM-capture and IgG ELISA). The Monarch KG has no combined CCHFV
    IgM+IgG panel code and no method-less variant of either individual code
    (searches "Crimean-Congo hemorrhagic fever virus IgG and IgM panel",
    "Crimean-Congo hemorrhagic fever virus IgM Ab Presence Serum" without an
    Immunoassay qualifier; both return only the Immunoassay-qualified Serum
    codes bound here), so those are the identity level available there.
  evidence:
  - reference: PMID:39558265
    reference_title: "Crimean-Congo haemorrhagic fever among healthcare workers in Iran 2000-2023, a report of National Reference Laboratory."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      tested for CCHF virus infection by the use of RT-PCR and IgM Capture Enzyme-Linked Immunosorbent Assay (MAC-ELISA)
    explanation: Documents IgM-capture ELISA serology as a confirmatory diagnostic assay alongside RT-PCR.
progression:
- phase: Incubation
  notes: >-
    The incubation period is short and depends on the route of exposure: about
    1-3 days after a tick bite and 5-6 days after exposure to blood, tissue and
    secretions, up to about 9 days overall.
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The incubation period is usually less than a week (range 1-9 days) and depends on the route of exposure and virus dose. It seems shortest following a tick bite (usually 1-3 days) and slightly longer following exposure to blood, tissue and secretions of infected livestock and humans (5-6 days).
    explanation: Supports the short incubation that is shortest after tick bite and longer after blood or tissue exposure.
  - reference: PMID:2749111
    reference_title: The clinical pathology of Crimean-Congo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following an incubation period of 2-9 days after exposure to infection
    explanation: Gives the observed incubation range in a human clinical series.
- phase: Pre-hemorrhagic
  notes: >-
    An abrupt febrile illness lasting about 2-4 days with nonspecific fever,
    headache, myalgia and gastrointestinal symptoms before any bleeding.
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pre-haemorrhagic stage lasts about 2-4 days on average (range 1-7 days) and begins abruptly with rather nonspecific symptoms
    explanation: Establishes the duration and abrupt nonspecific onset of the pre-haemorrhagic stage.
- phase: Hemorrhagic
  notes: >-
    A usually short (about 2-3 days) but sometimes prolonged stage of bleeding,
    liver injury, coagulopathy and, in severe cases, disseminated intravascular
    coagulation, shock and multi-organ failure; death, when it occurs, is
    usually in the second week.
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The haemorrhagic stage is usually short (approximately 2-3 days) but can be prolonged up to 2 weeks
    explanation: Establishes the duration of the haemorrhagic stage.
  - reference: PMID:2749111
    reference_title: The clinical pathology of Crimean-Congo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deaths occurred on days 5-14 of illness.
    explanation: Gives the observed timing of death in a human clinical series.
- phase: Convalescence
  notes: >-
    In survivors, recovery begins around 9-10 days after onset (range about
    9-20 days) with a return of laboratory parameters toward normal and the
    development of anti-CCHFV immunity.
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In survivors, convalescence generally begins around 9-10 days post-onset of illness (range 9-20 days) and is associated with a return to normal for laboratory parameters
    explanation: Establishes the convalescent phase and its timing in survivors.
treatments:
- name: Supportive care
  description: >-
    Supportive care is the mainstay of management - fluid and electrolyte
    management, blood-product replacement for bleeding and DIC, and organ
    support - because there is no licensed vaccine or proven specific antiviral
    for CCHF.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There are currently no approved vaccines or therapeutics for CCHF.
    explanation: Supports supportive care as the mainstay in the absence of approved specific therapy.
- name: Ribavirin
  description: >-
    Ribavirin, an antiviral nucleoside analogue, is widely used for CCHF, but
    its efficacy is unproven: a systematic review and meta-analysis found no
    survival benefit and concluded that the available data are inadequate to
    support a claim of efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ribavirin
      term:
        id: CHEBI:63580
        label: ribavirin
  evidence:
  - reference: PMID:21482564
    reference_title: "Ribavirin for patients with Crimean-Congo haemorrhagic fever: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the available data in the literature are inadequate to support a claim of efficacy of ribavirin in CCHF
    explanation: Supports the statement that ribavirin efficacy in CCHF is unproven.
- name: Favipiravir
  description: >-
    Favipiravir, a nucleoside-analogue antiviral, is an experimental candidate:
    it protected immunocompetent mice from lethal CCHFV infection even when
    treatment was delayed, but it is not an approved CCHF therapy and has not
    been shown effective in humans.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: favipiravir
      term:
        id: CHEBI:134722
        label: favipiravir
  evidence:
  - reference: PMID:37611878
    reference_title: Favipiravir and Ribavirin protect immunocompetent mice from lethal CCHFV infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      favipiravir and ribavirin protected animals from clinical disease and death even when treatment was delayed
    explanation: Demonstrates favipiravir protection in an immunocompetent mouse model of lethal CCHFV infection.
animal_models:
- name: Type I interferon-deficient mouse
  species: Mouse
  genotype: Type I interferon receptor (Ifnar) or STAT1 deficient
  publication: PMID:36918725
  description: >-
    Wild-type adult mice are resistant to lethal CCHFV infection; mice deficient
    in the type I interferon receptor or in STAT1 develop lethal disease with
    uncontrolled viral replication, inflammatory immune responses and liver
    pathology, recapitulating correlates of fatal human disease.
  modeled_mechanisms:
  - target: OTU-mediated interferon antagonism and high viremia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Lethal infection in interferon-deficient mice reproduces the uncontrolled
      high-titre replication that type I interferon normally restricts.
    limitations: >-
      Disease requires genetic or antibody-mediated ablation of type I
      interferon signalling; immunocompetent wild-type mice resist lethal
      infection, so the model cannot address how intact innate immunity controls
      CCHFV and biases toward immune-evasion questions.
    evidence:
    - reference: PMID:36918725
      reference_title: Crimean-Congo haemorrhagic fever virus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        disease is typically associated with uncontrolled viral replication, inflammatory immune responses, liver pathology and eventually death
      explanation: Describes the lethal phenotype of interferon-deficient mice infected with CCHFV.
  - target: Hepatocyte infection and hepatocellular necrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Infected interferon-deficient mice develop the liver pathology seen in
      fatal human disease, with hepatocytes as targets of infection.
    limitations: >-
      Liver pathology occurs on an interferon-ablated background rather than in
      an immunocompetent host, so its relationship to the human lesion is by
      correlation of outcome rather than by matched immune context.
    evidence:
    - reference: PMID:36918725
      reference_title: Crimean-Congo haemorrhagic fever virus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In mice, hepatocytes and endothelial cells are targets of CCHFV infection
      explanation: Supports hepatocyte infection and liver injury in the mouse model.
- name: Cynomolgus macaque
  species: Cynomolgus macaque
  publication: PMID:36918725
  description: >-
    Cynomolgus macaques infected with CCHFV recapitulate many aspects of human
    disease, including a varied outcome; severe disease shows liver pathology,
    inflammatory cytokines, high viral loads and coagulation disorders, but many
    animals develop only mild-to-moderate disease.
  modeled_mechanisms:
  - target: OTU-mediated interferon antagonism and high viremia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Macaques develop CCHFV viraemia and, in severe cases, the hallmarks of
      human disease, in an immunocompetent primate host.
    limitations: >-
      Disease outcome is variable and often only mild-to-moderate, with many
      animals not reaching severe disease, so the model reproduces the human
      severe course inconsistently.
    evidence:
    - reference: PMID:36918725
      reference_title: Crimean-Congo haemorrhagic fever virus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Cynomolgus macaques infected with CCHFV recapitulate many aspects of human CCHFV, including varied disease outcome.
      explanation: Supports the macaque model and its variable disease outcome.
    - reference: PMID:36918725
      reference_title: Crimean-Congo haemorrhagic fever virus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Severe disease was associated with liver pathology, inflammatory cytokines, high viral loads and coagulation disorders, similar hallmarks to severe human disease
      explanation: Documents the severe-disease hallmarks shared with human CCHF.
discussions:
- discussion_id: cchf_ribavirin_efficacy_uncertain
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does ribavirin reduce mortality in Crimean-Congo hemorrhagic fever, and if
    so in which patients and at what time from onset?
  attaches_to:
  - treatments#Ribavirin
  rationale: >-
    Ribavirin is widely used and widely assumed to help, but the pooled
    evidence does not show a survival benefit and is dominated by observational
    studies with biased control selection. An adequately powered randomised
    placebo-controlled trial has not been done.
  evidence:
  - reference: PMID:21482564
    reference_title: "Ribavirin for patients with Crimean-Congo haemorrhagic fever: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ribavirin did not improve survival in CCHF (relative risk 1.06, 95% confidence interval 0.97-1.16)
    explanation: The meta-analysis found no survival benefit, which is the open question this gap records.
- discussion_id: cchf_interferon_deficient_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How faithfully do type I interferon-deficient mouse models, in which innate
    immunity must be ablated to produce lethal disease, represent CCHF
    pathogenesis in immunocompetent humans?
  attaches_to:
  - pathophysiology#OTU-mediated interferon antagonism and high viremia
  rationale: >-
    Wild-type mice resist lethal CCHFV infection, so the standard small-animal
    models require genetic or antibody-mediated ablation of type I interferon
    signalling. This confounds study of how intact innate immunity controls the
    virus and of how the virus antagonises it, which is the human-relevant
    question, and biases the models toward immune-evasion mechanisms.
  evidence:
  - reference: PMID:36918725
    reference_title: Crimean-Congo haemorrhagic fever virus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      disease is typically associated with uncontrolled viral replication, inflammatory immune responses, liver pathology and eventually death
    explanation: Describes the interferon-deficient lethal mouse model whose translational fidelity is the open question.
review_notes: >-
  Deliberately lumped. CCHFV strains segregate into geographical clades
  (variously labelled Africa, Europe and Asia lineages), but no has_subtypes
  rows are created: the literature searched here (Bente 2013 PMID:23906741,
  Hawman and Feldmann 2023 PMID:36918725, Zivcec 2016 PMID:27110812) describes
  the clades as a genetic-diversity and phylogeographic phenomenon and does not
  document a clade that differs from its siblings in presentation, diagnosis,
  first-line therapy, prognosis, transmission or geography in a way that would
  change clinical management. The entry is therefore curated at the single
  named clinical-entity level with the organism lumped, pending a source that
  reports a clade-specific clinical difference.
notes: >-
  Crimean-Congo hemorrhagic fever conforms to the viral hemorrhagic fever
  syndrome module at its vascular and hemostatic nodes (increased vascular
  permeability, endothelial activation, consumptive coagulopathy, decreased
  coagulation factor production, reduced platelet number) and is a member of
  the Viral_Hemorrhagic_Fevers grouping. The cytokine node is curated on this
  entry rather than conformed, because the module deliberately carries no
  cytokine node. There are no causal human genes: CCHF is an acquired viral
  zoonosis, so inheritance and genetic sections do not apply.

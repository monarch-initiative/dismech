name: Crimean-Congo Hemorrhagic Fever
creation_date: "2026-10-12T04:05:10Z"
category: Infectious
description: >-
  Crimean-Congo hemorrhagic fever (CCHF) is the most widely distributed
  tick-borne viral hemorrhagic fever of humans, caused by the Crimean-Congo
  hemorrhagic fever orthonairovirus (CCHFV), a tri-segmented negative-sense RNA
  virus of the family Nairoviridae, order Bunyavirales. It is endemic across
  Africa, the Balkans, the Middle East and much of Asia, following the range of
  its Hyalomma tick vector and reservoir. Humans acquire it by tick bite, by
  contact with the blood and tissues of viraemic livestock at slaughter, and
  nosocomially through blood and body-fluid exposure - the combination of all
  three routes being distinctive among the viral hemorrhagic fevers. After a
  short incubation the illness runs through pre-haemorrhagic, haemorrhagic and
  convalescent phases; severe disease converges on the shared vascular and
  hemostatic lesion of the viral hemorrhagic fevers - endothelial activation,
  increased vascular permeability, consumptive coagulopathy, hepatocellular
  injury and thrombocytopenia - producing disseminated intravascular
  coagulation, bleeding, shock and multi-organ failure, with case-fatality
  rates reported above 30%.

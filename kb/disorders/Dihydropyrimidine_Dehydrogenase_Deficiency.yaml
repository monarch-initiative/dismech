environmental:
- name: Fluoropyrimidine chemotherapy administration
  description: >-
    Administration of 5-fluorouracil, capecitabine, or tegafur. This is the
    trigger that converts a latent metabolic difference into a
    life-threatening illness, and it is the only reason most people with reduced
    DPD activity ever come to medical attention. It is modelled as an
    environmental exposure rather than as part of the constitutive chain because
    the entire toxicity arm is inert without it.
  evidence:
  - reference: PMID:26573078
    reference_title: "Upfront Genotyping of DPYD*2A to Individualize Fluoropyrimidine Therapy: A Safety and Cost Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A polymorphism in the fluoropyrimidine metabolizing enzyme dihydropyrimidine dehydrogenase (DPD; ie, DPYD*2A) is strongly associated with fluoropyrimidine-induced severe and life-threatening toxicity."
    explanation: >-
      Evidence for the exposure itself being harmful in this population, as
      distinct from the evidence on the mechanism link below. The exposure entry
      makes its own causation claim and needs its own citation: administering a
      fluoropyrimidine to someone with reduced DPD activity is what produces
      severe and life-threatening toxicity.
  - reference: PMID:27622829
    reference_title: "Emergency use of uridine triacetate for the prevention and treatment of life-threatening 5-fluorouracil and capecitabine toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the historical cohort, 21 of 25 patients (84%) died."
    explanation: >-
      The magnitude of harm this exposure can do when it is not counteracted, which
      is what makes it worth modelling as a trigger rather than as background
      context. Stated precisely: that historical cohort is fluoropyrimidine
      OVERDOSE without antidote, not DPD-deficient patients given a standard dose,
      so it bounds the severity of unopposed fluoropyrimidine exposure rather than
      quantifying mortality in this disease.
  influences_mechanisms:
  - target: Impaired Fluoropyrimidine Clearance
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Supplies the substrate that the deficient enzyme cannot clear. Without
      administration there is nothing to clear and no toxicity, however low the
      enzyme activity.
    evidence:
    - reference: PMID:26573078
      reference_title: "Upfront Genotyping of DPYD*2A to Individualize Fluoropyrimidine Therapy: A Safety and Cost Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A polymorphism in the fluoropyrimidine metabolizing enzyme dihydropyrimidine dehydrogenase (DPD; ie, DPYD*2A) is strongly associated with fluoropyrimidine-induced severe and life-threatening toxicity."
      explanation: >-
        Establishes that the toxicity is fluoropyrimidine-induced in carriers,
        which is the exposure-dependence this link asserts.
genetic:
- name: DPYD
  gene_term:
    preferred_term: DPYD
    term:
      id: hgnc:3012
      label: DPYD
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Encodes dihydropyrimidine dehydrogenase. Inheritance is autosomal recessive
    for the constitutive inborn error, but the pharmacogenomic arm is dose
    dependent rather than recessive: a single deleterious allele reduces activity
    enough to cause severe or fatal fluoropyrimidine toxicity, which is why
    heterozygotes who are otherwise entirely healthy are the population that
    pre-treatment genotyping is designed to protect. The clinically actionable
    variants include DPYD*2A (c.1905+1G>A), c.1679T>G, c.1236G>A/HapB3, and
    c.2846A>T. No genotype-phenotype correlation has been established for the
    neurological arm.

    One correction worth stating explicitly, because getting it wrong is a common
    error in entries for this disease: c.1236G>A is a linkage tag rather than the
    causal allele. It is assayed because it is easy to genotype and marks the HapB3
    haplotype, but the functional lesion on that haplotype is a deep intronic
    variant, c.1129-5923C>G, which creates a cryptic splice donor site and inserts a
    44 base-pair pseudo-exon into the transcript. A panel that reports c.1236G>A is
    reporting the flag, not the mechanism, and any mechanistic statement should
    attach to the intronic variant.

    Allele frequencies are strongly ancestry-dependent, which makes panel design an
    equity question rather than a technical one. DPYD*2A, c.2846A>T, and c.1679T>G
    are essentially absent in East Asian populations, while c.557A>G is markedly
    enriched in people of African ancestry and is not on every panel. A panel
    assembled from variants discovered in European cohorts will therefore
    under-detect risk in exactly the populations it was not built from, and a
    negative result carries different meaning depending on the patient's
    ancestry.
  evidence:
  - reference: PMID:10071185
    reference_title: Genotype and phenotype in patients with dihydropyrimidine dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clear correlation between the genotype and phenotype has not been established."
    explanation: >-
      The explicit statement that genotype does not predict the neurological
      phenotype, which is why no such correlation is asserted anywhere in this
      entry.
  - reference: PMID:20803296
    reference_title: "Intragenic deletions and a deep intronic mutation affecting pre-mRNA splicing in the dihydropyrimidine dehydrogenase gene as novel mechanisms causing 5-fluorouracil toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In five patients a deep intronic mutation c.1129-5923C>G was identified creating a cryptic splice donor site."
    explanation: >-
      Identifies the deep intronic variant that is the functional lesion on the
      haplotype tagged by c.1236G>A, which is the basis for the correction recorded
      in the notes above.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The constitutive metabolic disease requires biallelic variants. Fluoropyrimidine
    toxicity risk does not: it follows residual enzyme activity, so heterozygous
    carriers are at substantially increased risk despite being unaffected in
    every other respect.
treatments:
- name: Pre-Treatment DPYD Genotyping and Genotype-Guided Dosing
  description: >-
    The intervention that defines modern management, and it is preventive rather
    than therapeutic. Testing DPYD before the first fluoropyrimidine dose and
    reducing or avoiding the drug according to residual activity converts a
    lethal idiosyncratic reaction into a manageable one. The evidence is
    quantitative and among the strongest in pharmacogenomics: upfront genotyping
    with dose individualisation cut severe toxicity dramatically and abolished
    drug-induced death in the study population.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic testing to guide fluoropyrimidine dosing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  target_mechanisms:
  - target: Impaired Fluoropyrimidine Clearance
    treatment_effect: MODULATES
    description: >-
      Acts by matching the administered dose to the patient's residual clearance
      capacity, rather than by altering the enzyme deficiency itself.
    evidence:
    - reference: PMID:26573078
      reference_title: "Upfront Genotyping of DPYD*2A to Individualize Fluoropyrimidine Therapy: A Safety and Cost Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "drug-induced death was reduced from 10% to 0%"
      explanation: >-
        The outcome that makes this the single most important intervention in the
        entry.
  evidence:
  - reference: PMID:26573078
    reference_title: "Upfront Genotyping of DPYD*2A to Individualize Fluoropyrimidine Therapy: A Safety and Cost Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of grade ≥ 3 toxicity was thereby significantly reduced from 73% (95% CI, 58% to 85%) in historical controls (n = 48) to 28% (95% CI, 10% to 53%) by genotype-guided dosing"
    explanation: >-
      Quantifies the reduction in severe toxicity achieved by upfront genotyping
      with dose individualisation.
  - reference: PMID:30348537
    reference_title: "DPYD genotype-guided dose individualisation of fluoropyrimidine therapy in patients with cancer: a prospective safety analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "For DPYD*2A and c.1679T>G carriers, a 50% initial dose reduction was adequate."
    explanation: >-
      PARTIAL because the same sentence pair reports that the reduction used for
      two other variants was NOT adequate, so this supports the strategy while
      qualifying the per-variant dose. Cited for the empirical basis rather than
      as a current dosing recommendation.
  notes: >-
    The prospective study found that a 50 per cent reduction sufficed for DPYD*2A
    and c.1679T>G but that the 25 per cent reduction it used for c.1236G>A and
    c.2846A>T required further investigation. Current guidance uses a uniform 50
    per cent reduction for intermediate metabolisers. Any curated dosing algorithm
    should cite the current guideline for the recommendation itself and this study
    only for the empirical basis.
- name: Lifelong Fluoropyrimidine Avoidance
  description: >-
    For individuals with complete or near-complete deficiency, avoidance of
    5-fluorouracil, capecitabine, and tegafur for life. This applies equally to
    those who are entirely asymptomatic, which is the point: the biochemical
    diagnosis carries a permanent prescribing implication even in someone who will
    never have a neurological symptom.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Fluoropyrimidine Clearance
    treatment_effect: MODULATES
    description: >-
      Prevents the exposure that activates the entire toxicity arm, rather than
      treating its consequences.
    evidence:
    - reference: PMID:26573078
      reference_title: "Upfront Genotyping of DPYD*2A to Individualize Fluoropyrimidine Therapy: A Safety and Cost Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A polymorphism in the fluoropyrimidine metabolizing enzyme dihydropyrimidine dehydrogenase (DPD; ie, DPYD*2A) is strongly associated with fluoropyrimidine-induced severe and life-threatening toxicity."
      explanation: >-
        Establishes the hazard that avoidance is intended to prevent.
- name: Uridine Triacetate
  description: >-
    Emergency antidote for fluoropyrimidine overexposure or early-onset severe
    toxicity, including toxicity arising from DPD deficiency. It delivers high
    concentrations of uridine, which competes with cytotoxic 5-fluorouracil
    metabolites for incorporation into RNA. Timing is the whole game: it must be
    given early, and most treated patients received it within 96 hours of
    exposure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: uridine triacetate
      term:
        id: CHEBI:90914
        label: uridine triacetate
  target_mechanisms:
  - target: Fluoropyrimidine Cytotoxicity in Proliferating Tissues
    treatment_effect: INHIBITS
    description: >-
      Competes with the toxic metabolites at the point of incorporation, blocking
      the injury rather than accelerating clearance of the parent drug.
    evidence:
    - reference: PMID:27622829
      reference_title: Emergency use of uridine triacetate for the prevention and treatment of life-threatening 5-fluorouracil and capecitabine toxicity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "uridine triacetate was a safe and effective lifesaving antidote"
      explanation: >-
        Establishes efficacy as an antidote in the setting this node describes.
  evidence:
  - reference: PMID:27622829
    reference_title: Emergency use of uridine triacetate for the prevention and treatment of life-threatening 5-fluorouracil and capecitabine toxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 137 of 142 overdose patients (96%) treated with uridine triacetate survived and had a rapid reversal of severe acute cardiotoxicity and neurotoxicity; in addition, mucositis and leukopenia were prevented, or the patients recovered from them."
    explanation: >-
      The actual survival figure and the specific toxicities reversed, rather than
      the generic characterisation. Ninety-six per cent survival is the number that
      makes this an antidote rather than a supportive measure.
  - reference: PMID:27622829
    reference_title: "Emergency use of uridine triacetate for the prevention and treatment of life-threatening 5-fluorouracil and capecitabine toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the historical cohort, 21 of 25 patients (84%) died."
    explanation: >-
      The untreated comparator, and the reason the survival figure above means
      something. Eighty-four per cent mortality without the antidote against four
      per cent with it is the whole case for early administration.
- name: Anticonvulsant Therapy
  description: >-
    Symptomatic seizure control for the constitutive neurological arm. No
    DPD-specific agent or regimen is established, and seizures are often
    difficult to control.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Genetic Counselling
  description: >-
    Autosomal recessive recurrence risk for the metabolic disease, cascade
    testing, and critically, communication of the prescribing implication to
    relatives. A healthy heterozygous sibling has no metabolic disease and a real
    chemotherapy hazard.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
clinical_trials:
- name: NCT02324452
  phase: PHASE_IV
  status: COMPLETED
  description: >-
    Prospective multicentre safety analysis of DPYD genotype-guided dose
    individualisation of fluoropyrimidine therapy, the study underlying the
    per-variant dose-reduction evidence curated above.
  target_phenotypes:
  - preferred_term: Decreased total neutrophil count
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  evidence:
  - reference: PMID:30348537
    reference_title: "DPYD genotype-guided dose individualisation of fluoropyrimidine therapy in patients with cancer: a prospective safety analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For DPYD*2A and c.1679T>G carriers, a 50% initial dose reduction was adequate."
    explanation: >-
      The trial's per-variant finding on the adequacy of dose reduction.
biochemical:
- name: Plasma uracil concentration
  notes: >-
    Endogenous plasma uracil is the phenotyping approach to identifying DPD
    deficiency before treatment, and is one of the two methods the European
    Medicines Agency recommends. It measures what actually matters, namely residual
    enzyme activity, rather than inferring it from a handful of known variants.
    Interpretation is banded rather than binary, with partial deficiency between 16
    and 150 nanograms per millilitre and complete deficiency above 150 under French
    recommendations. High pre-treatment uracil predicts severe toxicity.
  presence: INCREASED
  evidence:
  - reference: PMID:38896022
    reference_title: "Can we identify patients carrying targeted deleterious DPYD variants with plasma uracil and dihydrouracil? A GPCO-RNPGx retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to French recommendations, 7.3 % of patients were partially deficient (U 16-150 ng/mL) and 0.02 % completely deficient"
    explanation: >-
      Gives the partial-deficiency band in nanograms per millilitre with the
      proportion in it, and the complete-deficiency proportion in the same sentence.
      The two-hundred-fold gap between them is the whole argument for phenotyping
      everyone rather than only those with a suggestive history.
diagnosis:
- name: DPYD genotyping
  description: >-
    Targeted genotyping for the recognised risk alleles before the first
    fluoropyrimidine dose. It is fast, widely available, and one of the two methods
    endorsed by the European Medicines Agency, but it is limited by construction: it
    can only find variants that are on the panel, which is why it misses patients
    that phenotyping catches.
  evidence:
  - reference: PMID:36989883
    reference_title: "Implementation of dihydropyrimidine dehydrogenase deficiency testing in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2020, the European Medicines Agency (EMA) recommended two methods for pre-treatment DPD deficiency testing in clinical practice: phenotyping using endogenous uracil concentration or genotyping for DPYD risk variant alleles."
    explanation: >-
      Names both endorsed methods, which is the framing for why this entry curates
      them as complementary rather than ranked.
- name: Uracil phenotyping
  description: >-
    Measurement of endogenous plasma uracil as a direct read on residual enzyme
    activity. The other EMA-endorsed method, and the one that does not depend on
    knowing which variant a patient carries.
  evidence:
  - reference: PMID:36989883
    reference_title: "Implementation of dihydropyrimidine dehydrogenase deficiency testing in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2020, the European Medicines Agency (EMA) recommended two methods for pre-treatment DPD deficiency testing in clinical practice: phenotyping using endogenous uracil concentration or genotyping for DPYD risk variant alleles."
    explanation: >-
      The same recommendation, cited on the phenotyping arm.
- name: Genotype-phenotype discordance in pre-treatment testing
  description: >-
    The single most consequential fact about testing in this disease, and the reason
    both methods are curated rather than one. Genotyping and phenotyping identify
    overlapping but different patients, and targeted genotyping is not reliable
    enough on its own to find everyone with complete deficiency. A negative genotype
    is therefore not a clearance, which matters because the consequence of missing a
    complete deficiency is a potentially fatal first cycle.
  evidence:
  - reference: PMID:38896022
    reference_title: "Can we identify patients carrying targeted deleterious DPYD variants with plasma uracil and dihydrouracil? A GPCO-RNPGx retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results reaffirm the poor concordance between DPD phenotyping and genotyping, suggesting that both approaches may be complementary and that targeted DPYD genotyping is not sufficiently reliable to identify all patients with complete deficiency."
    explanation: >-
      States the discordance, the complementarity, and the specific limitation of
      targeted genotyping, all in the authors' own words.
animal_models:
- name: Dpyd knockout mouse
  species: Mouse
  genotype: Dpyd homozygous knockout
  publication: PMID:34653361
  description: >-
    Germline Dpyd knockout, generated to study heritable variation in sleep rather
    than to model this disease. It is included because the entry's central
    hypothesis depends on beta-alanine acting as an inhibitory neurotransmitter, and
    this is the animal in which that was shown. Its value here is as much in what it
    fails to reproduce as in what it does.
  modeled_mechanisms:
  - target: Pyrimidine Substrate Accumulation and Beta-Alanine Depletion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the metabolic consequence of losing the enzyme and demonstrates a
      central nervous system phenotype attributable to it, establishing that
      beta-alanine loss has real consequences for the brain. The phenotype is
      reduced sleep, not the neurological disease seen in patients.
    limitations: >-
      The demonstrated phenotype is a sleep deficit, whereas the human phenotype of
      interest is seizures, developmental delay, and white-matter injury. A shared
      molecule and a shared direction of change do not establish a shared
      consequence, so this model supports the mechanism's plausibility without
      supporting the specific human chain.
    readouts:
    - name: Sleep duration during the lights-off period
      target: Pyrimidine Substrate Accumulation and Beta-Alanine Depletion
      direction: DECREASED
      interpretation: >-
        Reduced sleep in the knockout is the measured central nervous system
        consequence of losing the enzyme.
      evidence:
      - reference: PMID:34653361
        reference_title: "The dihydropyrimidine dehydrogenase gene contributes to heritable differences in sleep in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice lacking Dpyd had 78.4 min less sleep during the lights-off period than wild-type mice"
        explanation: >-
          The quantitative measurement behind this readout.
    evidence:
    - reference: PMID:34653361
      reference_title: "The dihydropyrimidine dehydrogenase gene contributes to heritable differences in sleep in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Dpyd encodes the rate-limiting enzyme in the metabolic pathway that catabolizes uracil and thymidine to β-alanine, an inhibitory neurotransmitter."
      explanation: >-
        Connects the gene to beta-alanine and to inhibitory neurotransmission, which
        is why this model is informative for the metabolite node at all.
  - target: Impaired Inhibitory Neurotransmission and Neurodevelopmental Injury
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The knockout does not reproduce the neurological phenotype that defines the
      human constitutive disease. Behavioural testing found no difference in
      cognitive, social, or affective domains, and no seizure phenotype is reported.
      This is a substantive negative result and is the reason the human neurological
      chain remains an EMERGING hypothesis rather than being supported by animal
      data.
    limitations: >-
      Absence of a reported seizure phenotype is not the same as a demonstrated
      absence of seizure susceptibility, because the study was designed around sleep
      and did not perform seizure-threshold testing or EEG. The failure to
      recapitulate is therefore established for the behavioural domains actually
      assayed, and merely unexamined for seizures themselves.
    evidence:
    - reference: PMID:34653361
      reference_title: "The dihydropyrimidine dehydrogenase gene contributes to heritable differences in sleep in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "There was no difference in other measured behaviors in knockout mice, including assays evaluating cognitive-, social-, and affective-disorder-related behaviors."
      explanation: >-
        The explicit negative result across the non-sleep behavioural domains
        tested, which is what this failure-to-recapitulate claim rests on.
discussions:
- discussion_id: dpd_neuro_penetrance
  prompt: >-
    Why do some individuals with complete DPD deficiency have severe epileptic
    encephalopathy while others with the same biochemical deficiency are entirely
    asymptomatic?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pyrimidine Substrate Accumulation and Beta-Alanine Depletion
  rationale: >-
    This is the central unresolved problem of the constitutive arm and it is not
    a matter of incomplete ascertainment. The originating genotype-phenotype study
    states plainly that no clear correlation has been established, and a wide
    range of severity including complete absence of signs is recognised. The
    metabolite disturbance is therefore necessary but demonstrably not sufficient
    for the neurological phenotype, which means something else, whether modifier
    genes, timing of exposure during development, or an environmental
    contribution, determines whether the brain is affected. Until that is
    identified, the metabolite-to-brain chain cannot be asserted, which is why it
    is curated as an EMERGING hypothesis and its edges are placed in a hypothesis
    group rather than stated outright.
  proposed_experiments:
  - experiment_id: dpd_discordant_sibling_sequencing
    name: Modifier discovery in phenotype-discordant DPD-deficient relatives
    description: >-
      Recruit families containing biochemically deficient individuals discordant
      for the neurological phenotype, and perform whole-genome sequencing and
      cerebrospinal-fluid metabolite profiling on affected and unaffected members
      to identify modifiers segregating with the phenotype rather than with the
      DPYD genotype. Discordant relatives are the only design that controls for
      the primary defect while varying the outcome.
  - experiment_id: dpd_csf_metabolite_correlation
    name: CSF pyrimidine and beta-alanine levels against neurological outcome
    description: >-
      Measure cerebrospinal-fluid uracil, thymine, beta-alanine, and
      beta-aminoisobutyrate in a cohort of biochemically deficient individuals
      stratified by neurological status. If the hypothesis holds, central
      metabolite levels rather than urinary ones should separate affected from
      unaffected; if they do not, the hypothesis is in serious trouble.
- discussion_id: dpd_beta_alanine_model_mismatch
  prompt: >-
    Does the murine demonstration that beta-alanine acts as a sleep-promoting
    inhibitory neurotransmitter translate to a role in human DPD-deficiency
    seizures?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Pyrimidine Substrate Accumulation and Beta-Alanine Depletion
  rationale: >-
    Evidence exists in the model and is good: mouse work links Dpyd to
    beta-alanine and establishes beta-alanine as an inhibitory neurotransmitter
    that promotes sleep. What is open is whether that function is the one that
    matters in human disease. The murine phenotype is altered sleep; the human
    phenotype under investigation is seizures, developmental delay, and
    white-matter injury. A shared molecule and a shared direction of change do not
    establish a shared consequence, and treating the mouse result as human
    evidence would overstate the case for the whole neurological chain.
  proposed_experiments:
  - experiment_id: dpd_mouse_seizure_phenotyping
    name: Seizure susceptibility phenotyping in Dpyd-deficient mice
    description: >-
      Characterise seizure threshold, EEG, and white-matter integrity in
      Dpyd-deficient mice, rather than sleep alone, and test whether beta-alanine
      supplementation modifies those endpoints. This would establish whether the
      murine model speaks to the human phenotype at all, or only to sleep.
differential_diagnoses:
- name: Dihydropyrimidinase deficiency
  description: >-
    Deficiency of the next enzyme in the same pathway, DPYS. It produces an
    overlapping biochemical picture with accumulation of pyrimidine intermediates
    and a similarly variable neurological phenotype, and it shares the
    fluoropyrimidine-toxicity implication. Distinguished by the specific
    metabolites that accumulate, since the block sits one step further down.
- name: Beta-ureidopropionase deficiency
  description: >-
    Deficiency of UPB1, the third and final enzyme of pyrimidine catabolism.
    Completes the set of three pathway disorders that share variable neurological
    presentation and abnormal urinary pyrimidines, and is distinguished on the
    same basis.
- name: Fluoropyrimidine toxicity without DPD deficiency
  description: >-
    Severe fluoropyrimidine toxicity, including acute leukoencephalopathy, occurs
    in patients with entirely normal DPD activity. The important curation
    consequence is that severe toxicity is not by itself evidence of DPD
    deficiency, and attributing every case to this disease would over-claim.
prevalence:
- population: Worldwide, complete deficiency
  measure_type: POINT_PREVALENCE
  prevalence_class: ULTRA_RARE
  notes: >-
    Complete DPD deficiency presenting as the constitutive inborn error is very
    rare and no reliable population rate was identified. Partial deficiency is
    orders of magnitude more common, which is what makes pre-treatment genotyping
    worthwhile at population scale; the two must not be quoted as one number.
    Recorded as a qualitative class rather than a fabricated rate.
- population: Patients with GI and hepatopancreaticobiliary cancers receiving fluoropyrimidines, single Indian centre
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 7500.0
  notes: >-
    A prospective observational study at a tertiary Indian oncology centre
    assessed the rate of DPD deficiency among patients receiving fluoropyrimidines
    for gastrointestinal and hepatopancreaticobiliary cancers. Recorded as a
    separate population because the relevant denominator for the pharmacogenomic
    arm is people being prescribed the drug rather than the general population,
    and kept narrow because this is a single centre and a specific tumour group,
    not a national or all-comers figure.
  evidence:
  - reference: PMID:41259730
    reference_title: "Clinical Implications of Dihydropyrimidine Dehydrogenase Deficiency in GI and Hepatopancreaticobiliary Cancers Treated With Fluoropyrimidines: A Prospective Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 146 study participants, 11 (7.5%) had a DPYD mutation."
    explanation: >-
      The measured rate in this cohort, 11 of 146, which is the quantitative basis
      for the band and the normalised rate recorded above. The record previously
      cited the study's aim sentence, which framed the denominator but stated no

name: Dihydropyrimidine Dehydrogenase Deficiency
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Dihydropyrimidine dehydrogenase (DPD) deficiency is an autosomal recessive
  disorder of pyrimidine catabolism caused by variants in DPYD. DPD catalyses the
  first and rate-limiting step of pyrimidine degradation, so losing it blocks the
  whole pathway at once, producing both an accumulation of uracil and thymine and
  a depletion of the downstream product beta-alanine.

  The unusual feature of this entry is that one enzyme deficiency produces two
  almost unrelated diseases, and which one a person gets depends on whether
  anybody ever gives them a fluoropyrimidine. Left alone, biallelic deficiency is
  a rare inborn error whose neurological consequences range from an epileptic
  encephalopathy to nothing at all. Exposed to 5-fluorouracil or capecitabine,
  the same enzyme deficit becomes a pharmacogenomic emergency, because DPD
  normally clears the great majority of an administered dose and a patient who
  cannot clear it receives, in effect, a massive overdose. Carriers who are
  entirely well their whole lives can be killed by a standard first cycle of
  chemotherapy.

  The two arms are modelled separately here. The constitutive arm runs from
  enzyme loss to metabolite imbalance and is deliberately not asserted as a
  settled cause of the neurological phenotype, because the literature does not
  support that: the originating study reports wide phenotypic variability and
  states plainly that no genotype-phenotype correlation has been established, and
  the mechanism linking metabolites to brain injury is offered by its own authors
  as something that "might underlie" the clinical picture. The toxicity arm is
  gated on drug exposure, modelled as an environmental trigger acting on the
  residual-activity node, and is where the evidence is strong, quantitative, and
  actionable.
category: Mendelian
disease_term:
  preferred_term: Dihydropyrimidine Dehydrogenase Deficiency
  term:
    id: MONDO:0010130
    label: dihydropyrimidine dehydrogenase deficiency
synonyms:
- DPD deficiency
- DPYD deficiency
- Familial pyrimidinemia
- Hereditary thymine-uraciluria
notes: >-
  Scope and framing. This entry covers both the constitutive inborn error
  (biallelic, unexposed) and the fluoropyrimidine-toxicity arm (mono- or
  biallelic, drug-exposed), because they are the same enzyme deficiency and
  separating them into two entries would hide the fact that the second is
  reached from the first only by an exposure. The toxicity phenotypes are
  therefore placed downstream of an exposure-gated node rather than in the
  constitutive phenotype list.

  Module conformance was considered carefully and only one was taken. The marrow
  limb of the toxicity arm conforms to `myelosuppression`, where the disorder
  specific substitution is excess systemic 5-fluorouracil arising from failed
  catabolic clearance rather than an administered cytotoxic dose.
  `epilepsy_excitation_inhibition_imbalance` was NOT declared, because conforming
  would require asserting the beta-alanine inhibitory-neurotransmission
  mechanism, which the literature explicitly hedges; that mechanism is recorded
  as an EMERGING hypothesis instead. `metabolic_intoxication_decompensation` was
  also declined: DPD deficiency does not classically produce catabolic-stress
  triggered crises with acidosis, hyperammonaemia, or hypoglycaemia, and the one
  acute presentation in the literature is a single case report.

  There is no dismech module for pharmacogenomic clearance failure, the pattern
  in which impaired drug catabolism produces supratherapeutic exposure and
  dose-dependent toxicity. It recurs across DPYD with fluoropyrimidines, TPMT and
  NUDT15 with thiopurines, UGT1A1 with irinotecan, and CYP2D6 with codeine. This
  entry would be a natural flagship conformer if such a module is ever written;
  no existing module was stretched to cover it.

  Deliberately not curated. The source deep-research report attributed the DPWG
  genotype-guided dosing recommendation to PMID:31745289 and its central
  illustration of a biochemically deficient but symptom-free sibling to
  PMID:9323575. Neither identifier resolves to a record, and both were flagged as
  probable confabulations by the report's own reference validation. The dosing
  content is therefore sourced here from the prospective studies that generated
  the evidence instead, and the unexposed-sibling observation is not curated at
  all. Beta-alanine supplementation is mechanistically attractive and has no
  clinical evidence; it is not curated as a treatment. Deliberate DPD inhibition
  to potentiate 5-fluorouracil is a real oncology strategy but is not a treatment
  for this disease and appears only here in notes.
pathophysiology:
- name: Biallelic DPYD Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Deleterious variants in DPYD, which encodes dihydropyrimidine dehydrogenase.
    The enzyme is a large homodimeric redox protein carrying two FAD, two FMN,
    and eight iron-sulfur clusters arranged as electron-transfer chains, which is
    why loss of function is reachable by many mechanistically distinct routes:
    disruption of the substrate site, of cofactor binding, of the electron wire,
    or of dimer assembly and folding. Complete deficiency requires two alleles;
    a single deleterious allele reduces activity enough to matter only when a
    fluoropyrimidine is administered.
  molecular_functions:
  - preferred_term: dihydropyrimidine dehydrogenase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0017113
      label: dihydropyrimidine dehydrogenase (NADP+) activity
  evidence:
  - reference: PMID:11179210
    reference_title: "Crystal structure of dihydropyrimidine dehydrogenase, a major determinant of the pharmacokinetics of the anti-cancer drug 5-fluorouracil."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "arranged in two electron transfer chains that pass the dimer interface twice"
    explanation: >-
      Describes the electron-transfer architecture that makes this enzyme
      vulnerable to loss of function at many independent positions. The full
      sentence also enumerates the two FAD, two FMN, and eight iron-sulfur
      clusters; the quote stops short of them because the bracketed cluster
      notation is removed by snippet normalisation and cannot be matched.
  downstream:
  - target: Reduced DPD Catalytic Activity
    causal_link_type: DIRECT
    description: >-
      Loss-of-function alleles reduce or abolish enzyme activity in proportion to
      how many alleles are affected and how severely.
- name: Reduced DPD Catalytic Activity
  biological_scale: MOLECULAR
  description: >-
    Diminished or absent dihydropyrimidine dehydrogenase activity. This node is
    the hinge of the entry: everything constitutive runs downstream of it through
    the blocked catabolic pathway, and everything pharmacogenomic runs downstream
    of it only once a fluoropyrimidine arrives. Residual activity is continuous
    rather than binary, which is why the same node supports both a severe
    infantile presentation and a lifelong asymptomatic state.
  biological_processes:
  - preferred_term: pyrimidine nucleobase catabolic process
    modifier: DECREASED
    term:
      id: GO:0006208
      label: pyrimidine nucleobase catabolic process
  evidence:
  - reference: PMID:11179210
    reference_title: "Crystal structure of dihydropyrimidine dehydrogenase, a major determinant of the pharmacokinetics of the anti-cancer drug 5-fluorouracil."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the enzyme is also responsible for the rapid breakdown of the chemotherapeutic drug 5-fluorouracil"
    explanation: >-
      Establishes that the same enzyme governs fluoropyrimidine clearance, which
      is what makes one deficiency produce two diseases.
  downstream:
  - target: Block of Pyrimidine Nucleobase Catabolism
    causal_link_type: DIRECT
    description: >-
      The constitutive consequence, present from birth regardless of any drug
      exposure.
  - target: Impaired Fluoropyrimidine Clearance
    causal_link_type: DIRECT
    description: >-
      The pharmacogenomic consequence, which is latent until a fluoropyrimidine
      is administered and is therefore gated by exposure rather than by genotype
      alone.
- name: Block of Pyrimidine Nucleobase Catabolism
  biological_scale: MOLECULAR
  description: >-
    Because DPD catalyses the committed first step, its loss blocks the entire
    three-step catabolic pathway. The consequence is two-sided and both sides may
    matter: substrates accumulate, and the eventual product beta-alanine is not
    made. Uraciluria is the resulting biochemical signature and is present in
    essentially all homozygotes, whether or not they have any symptoms.
  biological_processes:
  - preferred_term: pyrimidine nucleobase catabolic process
    modifier: DECREASED
    term:
      id: GO:0006208
      label: pyrimidine nucleobase catabolic process
  evidence:
  - reference: PMID:10071185
    reference_title: Genotype and phenotype in patients with dihydropyrimidine dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An altered beta-alanine, uracil and thymine homeostasis might underlie the various clinical abnormalities encountered in patients with DPD deficiency."
    explanation: >-
      States both sides of the block, accumulation and depletion, in the authors'
      own deliberately hedged language. The hedge is preserved rather than
      flattened; see the mechanistic hypothesis of the same name.
  downstream:
  - target: Pyrimidine Substrate Accumulation and Beta-Alanine Depletion
    causal_link_type: DIRECT
    description: >-
      The metabolite imbalance that follows directly from blocking the pathway.
- name: Pyrimidine Substrate Accumulation and Beta-Alanine Depletion
  biological_scale: ORGANISM
  description: >-
    Uracil, thymine, and 5-hydroxymethyluracil accumulate in urine, plasma, and
    cerebrospinal fluid, while beta-alanine and beta-aminoisobutyrate are
    depleted. Beta-alanine is a structural analogue of GABA and glycine and has
    inhibitory neurotransmitter activity, which is the basis of the proposed but
    unproven link to the neurological phenotype. This node is where the entry
    stops asserting and starts hypothesising: the metabolite disturbance is
    measured and certain, its consequences for the brain are not.
  biological_processes:
  - preferred_term: beta-alanine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0019483
      label: beta-alanine biosynthetic process
  evidence:
  - reference: PMID:34653361
    reference_title: The dihydropyrimidine dehydrogenase gene contributes to heritable differences in sleep in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both β-alanine and β-AIB are structural analogs of γ-aminobutyric acid (GABA) and glycine, two important inhibitory neurotransmitters in the central nervous system."
    explanation: >-
      Establishes the structural basis for beta-alanine acting on inhibitory
      neurotransmission. Tagged MODEL_ORGANISM because the publication is a mouse
      sleep-genetics study; the structural-analogy statement is general, but the
      functional demonstration in that paper is murine.
  downstream:
  - target: Uraciluria
    causal_link_type: DIRECT
    description: >-
      The diagnostic biochemical signature of the blocked pathway.
  - target: Impaired Inhibitory Neurotransmission and Neurodevelopmental Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - altered_pyrimidine_homeostasis_neurotoxicity
    description: >-
      Proposed route from metabolite imbalance to neurological disease. The
      intermediates are genuinely unknown, and the edge belongs to a hypothesis
      group rather than being asserted, because the same biochemical deficiency
      is compatible with no neurological phenotype at all.
- name: Impaired Inhibitory Neurotransmission and Neurodevelopmental Injury
  biological_scale: CELLULAR
  description: >-
    The hypothesised neurological consequence of the metabolite imbalance:
    beta-alanine and beta-aminoisobutyrate are structural analogues of GABA and
    glycine, so their depletion is proposed to shift inhibitory neurotransmission
    in the developing central nervous system, with accumulated pyrimidines
    contributing independently. This node exists as a node rather than as a bare
    edge to the phenotypes because it is the thing the animal evidence speaks to,
    positively and negatively, and a hypothesis with no node has nowhere to attach
    a negative result. Its edges belong to the neurotoxicity hypothesis group and
    are not asserted: the same biochemical state is compatible with no
    neurological phenotype at all.
  biological_processes:
  - preferred_term: beta-alanine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0019483
      label: beta-alanine biosynthetic process
  evidence:
  - reference: PMID:34653361
    reference_title: "The dihydropyrimidine dehydrogenase gene contributes to heritable differences in sleep in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Both β-alanine and β-AIB are structural analogs of γ-aminobutyric acid (GABA) and glycine, two important inhibitory neurotransmitters in the central nervous system."
    explanation: >-
      The structural basis for the proposed effect on inhibitory
      neurotransmission. PARTIAL because analogy to inhibitory neurotransmitters
      establishes a plausible route rather than a demonstrated one in human
      disease.
  - reference: PMID:15303009
    reference_title: Head imaging abnormalities in dihydropyrimidine dehydrogenase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of the white-matter abnormalities is unknown, although environmental factors and altered energy metabolism may be involved."
    explanation: >-
      Included as a limit on this node rather than as support for it. The authors
      who described the imaging phenotype state that its mechanism is unknown and
      name alternatives, which is why the downstream edges sit in a hypothesis
      group.
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - altered_pyrimidine_homeostasis_neurotoxicity
    description: >-
      Proposed route to seizures through altered inhibitory neurotransmission. Not
      asserted; the intermediates are unknown and penetrance is incomplete.
  - target: Leukoencephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - altered_pyrimidine_homeostasis_neurotoxicity
    description: >-
      Proposed route to the white-matter and brainstem changes, whose pathogenesis
      the describing authors state is unknown.
- name: Impaired Fluoropyrimidine Clearance
  biological_scale: ORGANISM
  description: >-
    Exposure-gated node, and the reason this disease matters far beyond the
    handful of children with the inborn error. Dihydropyrimidine dehydrogenase
    performs the great majority of fluoropyrimidine catabolism, so a patient with
    reduced activity who receives a standard dose of 5-fluorouracil or
    capecitabine cannot clear it. Systemic exposure and half-life rise, and the
    patient effectively receives an overdose while being given a normal
    prescription. Nothing about this node is active until the drug is
    administered.
  biological_processes:
  - preferred_term: pyrimidine nucleobase catabolic process
    modifier: DECREASED
    term:
      id: GO:0006208
      label: pyrimidine nucleobase catabolic process
  evidence:
  - reference: PMID:26573078
    reference_title: "Upfront Genotyping of DPYD*2A to Individualize Fluoropyrimidine Therapy: A Safety and Cost Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A polymorphism in the fluoropyrimidine metabolizing enzyme dihydropyrimidine dehydrogenase (DPD; ie, DPYD*2A) is strongly associated with fluoropyrimidine-induced severe and life-threatening toxicity."
    explanation: >-
      Links reduced DPD activity to severe and life-threatening drug toxicity,
      which is the claim this node carries.
  downstream:
  - target: Fluoropyrimidine Cytotoxicity in Proliferating Tissues
    causal_link_type: DIRECT
    description: >-
      Excess systemic drug exposure delivers a cytotoxic insult to the tissues
      that turn over fastest.
- name: Fluoropyrimidine Cytotoxicity in Proliferating Tissues
  biological_scale: TISSUE
  description: >-
    Supratherapeutic 5-fluorouracil exposure damages rapidly proliferating
    tissues by two routes: the metabolite FdUMP inhibits thymidylate synthase,
    producing thymineless stress and DNA damage, and FUTP is misincorporated into
    RNA. Bone marrow and gastrointestinal mucosa bear the brunt, with skin,
    myocardium, and central nervous system also affected. This node is the
    disease-specific substitution for the cytotoxic driver in the myelosuppression
    module: the insult is not an administered cytotoxic dose but an ordinary dose
    that the patient cannot clear.
  conforms_to: "myelosuppression#Cytotoxic Insult to Proliferating Hematopoietic Progenitors"
  evidence:
  - reference: PMID:27622829
    reference_title: Emergency use of uridine triacetate for the prevention and treatment of life-threatening 5-fluorouracil and capecitabine toxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "uridine triacetate was a safe and effective lifesaving antidote"
    explanation: >-
      The antidote works by supplying uridine to compete with toxic 5-FU
      metabolites, so its efficacy is functional evidence that the injury is
      driven by those metabolites reaching proliferating tissue.
  downstream:
  - target: Multilineage Cytopenias
    causal_link_type: DIRECT
    description: >-
      The marrow limb, which is the conforming arm of the myelosuppression
      module.
  - target: Diarrhea
    causal_link_type: DIRECT
    description: >-
      The gastrointestinal mucosal limb.
- name: Multilineage Cytopenias
  biological_scale: ORGANISM
  description: >-
    Neutropenia, thrombocytopenia, and in severe or complete deficiency
    pancytopenia, arising from marrow suppression by unclearable fluoropyrimidine
    rather than from an intrinsic haematological disorder. Severe toxicity of
    this kind is frequently dose-limiting and can be fatal.
  conforms_to: "myelosuppression#Multilineage Peripheral Cytopenias"
  evidence:
  - reference: PMID:26573078
    reference_title: "Upfront Genotyping of DPYD*2A to Individualize Fluoropyrimidine Therapy: A Safety and Cost Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of grade ≥ 3 toxicity was thereby significantly reduced from 73% (95% CI, 58% to 85%) in historical controls (n = 48) to 28% (95% CI, 10% to 53%) by genotype-guided dosing"
    explanation: >-
      Quantifies severe toxicity in unscreened carriers and its reduction by
      genotype-guided dosing, which is the strongest evidence that this arm is
      driven by drug exposure and is preventable.
  downstream:
  - target: Decreased total neutrophil count
    causal_link_type: DIRECT
    description: >-
      The lineage most often reported and the one that drives febrile
      neutropenia risk.
mechanistic_hypotheses:
- hypothesis_group_id: altered_pyrimidine_homeostasis_neurotoxicity
  hypothesis_label: Altered pyrimidine and beta-alanine homeostasis causes the neurological phenotype
  status: EMERGING
  description: >-
    Holds that accumulated uracil and thymine, together with depleted beta-alanine
    and beta-aminoisobutyrate, disturb the developing central nervous system, and
    that this accounts for the seizures, developmental delay, and white-matter
    abnormalities seen in some patients. The pathway logic is coherent, since
    beta-alanine is a structural analogue of the two principal inhibitory
    neurotransmitters, and the metabolite disturbance itself is beyond doubt. What
    is unproven is the link from that disturbance to brain injury.
  evidence:
  - reference: PMID:10071185
    reference_title: Genotype and phenotype in patients with dihydropyrimidine dehydrogenase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "An altered beta-alanine, uracil and thymine homeostasis might underlie the various clinical abnormalities encountered in patients with DPD deficiency."
    explanation: >-
      The originating statement of the hypothesis, graded PARTIAL because the
      authors write "might underlie" rather than "underlies" and offer it as a
      proposal.
  - reference: PMID:34653361
    reference_title: The dihydropyrimidine dehydrogenase gene contributes to heritable differences in sleep in mice.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Dpyd encodes the rate-limiting enzyme in the metabolic pathway that catabolizes uracil and thymidine to β-alanine, an inhibitory neurotransmitter."
    explanation: >-
      The best available functional support that beta-alanine loss has a real
      central nervous system consequence. PARTIAL and MODEL_ORGANISM because the
      demonstrated phenotype is murine sleep, not human seizures.
  - reference: PMID:15303009
    reference_title: Head imaging abnormalities in dihydropyrimidine dehydrogenase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of the white-matter abnormalities is unknown, although environmental factors and altered energy metabolism may be involved."
    explanation: >-
      The authors who described the imaging phenotype state that its mechanism is
      unknown and raise alternatives, which is why this remains a hypothesis
      rather than the entry's asserted chain.
  notes: >-
    Deliberately EMERGING rather than CANONICAL. The decisive problem is not weak
    evidence for the mechanism but the existence of biochemically deficient
    individuals with no neurological phenotype whatsoever, which means the
    metabolite disturbance cannot be sufficient. Any complete account has to
    explain the unaffected as well as the affected, and none currently does.

  - reference: PMID:28649519
    reference_title: 'ALG11-CDG: Three novel mutations and further characterization of the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      EEG showed a burst suppression pattern, which persisted despite treatment with phenobarbitone, valproic

      Blood coagulation factor XI (27%; normal range for age: 38–164%), and protein C (25%; normal range
      for age: 37–81%) were decreased.
    explanation: Direct laboratory measurements in one patient.
genetic:
- name: ALG11
  gene_term:
    preferred_term: ALG11
    term:
      id: hgnc:32456
      label: ALG11
  association: Biallelic loss-of-function variants
  features: >-
    Reported ALG11 alleles include missense, frameshift and splice-site variants and a whole-gene deletion.
    The index variant was homozygous c.257T>C (p.Leu86Ser). The 2019 deletion/p.Leu46Pro genotype illustrates
    how a deletion can make a sequence variant appear homozygous. Homozygous c.953A>C (p.Gln318Pro) recurred
    in three unrelated Turkish families reported in 2025; recurrence alone does not establish a founder
    effect. No robust genotype–phenotype prediction follows from the small series.
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:20080937
    reference_title: >-
      A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11
      leads to congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Verification of the mutation as a primary cause for the genetic defect was proved by retroviral
      expression of human wild-type and mutated ALG11 cDNA in patient-derived fibroblasts as well as using
      a yeast alg11 deletion strain as a heterologous expression system for hALG11 variants.
    explanation: >-
      Functional rescue and heterologous complementation establish the ALG11 variant as causal rather
      than merely associated.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22213132
    reference_title: >-
      Improved diagnostics lead to identification of three new patients with congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although all CDG-Ip patients carry different mutations in the ALG11 gene, they share a variety of
      clinical syndromes
    explanation: >-
      Establishes allelic heterogeneity with a convergent clinical phenotype across independently ascertained
      patients.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Though the mother was found to be heterozygous for the same mutation, the father did not have this
      mutation. Subsequent ALG11 gene deletion/duplication analysis found a paternally inherited whole
      gene deletion of ALG11 in the patient.
    explanation: Explains the apparently homozygous sequence result.
  - reference: PMID:40423864
    reference_title: >-
      A recurrent c.953A>C (p. Gln318Pro) variant in ALG11 causing congenital disorder of glycosylation
      in Turkish population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      WES analysis revealed a homozygous NM_001004127.3: c.953A > C (p. Gln318Pro) missense variant in
      the ALG11 gene in all three patients.
    explanation: Documents recurrence in three unrelated Turkish families; no founder haplotype is demonstrated.
  - reference: PMID:39260222
    reference_title: Identification of two novel variants in ALG11 causing congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Trio WES unveiled novel compound heterozygous variants: c.1307G>T (p.G436V) and c.1403G>A (p.R468H)
      within exon 4 of the ALG11 gene, inherited from the father and mother, respectively.
    explanation: Documents the reported segregating pair; functional interpretation remains assay-specific.
progression:
- phase: Prenatal or infantile presentation
  notes: >-
    Presentation varies from fetal brain growth arrest to an apparently unremarkable pregnancy followed
    by infantile developmental impairment or seizures.
  evidence:
  - reference: PMID:30770273
    reference_title: Arrest of Fetal Brain Development in ALG11-Congenital Disorder of Glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We report an example of fetal microcephaly diagnosed at 36 weeks' gestation with a history of normal
      fetal biometry at 20 weeks' gestation.
    explanation: Documents prenatal onset in one child.
  - reference: PMID:22213132
    reference_title: >-
      Improved diagnostics lead to identification of three new patients with congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      they share a variety of clinical syndromes like an unremarkable prenatal period followed by developmental
      delay, psychomotor, and mental retardation, strabismus convergens and seizures occurring in the
      first year of life
    explanation: >-
      Describes the earlier small series; the later fetal case expands the spectrum rather than refuting
      these observations.
- phase: Variable childhood and adolescent course
  notes: >-
    Some severe cases develop progressive cerebral atrophy and die in childhood; other individuals survive
    into adolescence. The 2025 seven-year follow-up concerns the same prenatal-onset child reported in
    2019. Normal structural imaging and sustained seizure control were reported in a different adolescent,
    so rapid degeneration is not obligatory.
  evidence:
  - reference: PMID:39809108
    reference_title: Progressive loss of cerebral structures in ALG11-related congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The objective of this report is to provide an update on the phenotype and brain magnetic resonance
      imaging (MRI) at age seven years for a patient initially described in early infancy with fetal brain
      disruption sequence.
    explanation: Identifies the longitudinal follow-up, avoiding counting it as an independent case.
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our 14-year-old patient (patient 2) is the oldest reported patient to date, with all others ranging
      between 2 months to 8 years.
    explanation: Documents adolescent survival at publication, without asserting a current oldest age.
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: With current medication he has been seizure free for 7 years.
    explanation: Demonstrates variability in seizure trajectory.
  - reference: PMID:28649519
    reference_title: 'ALG11-CDG: Three novel mutations and further characterization of the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: He died at 4 months due to respiratory insufficiency secondary to epilepsy.
    explanation: Documents a severe early outcome; this is not a survival probability.

- name: Prenatal Arrest of Cerebral Growth
  biological_scale: TISSUE
  description: >-
    In one molecularly and biochemically characterized child, fetal brain growth arrested after normal
    mid-gestation biometry. The fetal-to-neonatal MRI interval showed absent growth rather than measured
    tissue loss. The cellular mechanism connecting ALG11 dysfunction to this developmental phenotype is
    unknown.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:30770273
    reference_title: Arrest of Fetal Brain Development in ALG11-Congenital Disorder of Glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      During the 3.5 week interval from the fetal MRI to the postnatal brain MRI, the brain did not increase
      in size indicating an arrested growth pattern. This should be differentiated from a decrease in
      size, or atrophy, which did not occur during that same time period.
    explanation: Explicitly distinguishes developmental growth arrest from atrophy in this child.
  downstream:
  - target: Progressive Microcephaly
    description: >-
      Arrested prenatal brain growth accompanied declining relative head size in the serially imaged child.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30770273
      reference_title: Arrest of Fetal Brain Development in ALG11-Congenital Disorder of Glycosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        This report shows the development of microcephaly in ALG11-CDG during the late second and third
        trimester
      explanation: Links prenatal growth arrest to the observed microcephaly.
- name: Progressive Loss of Brain Structures
  biological_scale: TISSUE
  description: >-
    Serial MRI has documented progressive cerebral tissue loss in several severe cases. The child with
    prenatal growth arrest later had near-complete cerebral hemispheric loss and severe cerebellar and
    brainstem volume loss at age seven. That sequence is an individual longitudinal observation, not an
    obligatory course for all ALG11-CDG; another reported adolescent had normal MRI and CT.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:39809108
    reference_title: Progressive loss of cerebral structures in ALG11-related congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was near complete loss of cerebral hemispheres, severe cerebellar atrophy, and decreased volume
      of the brainstem.
    explanation: Documents the extent of structural loss at age seven in a serially imaged patient.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36843332
    reference_title: 'ALG11-CDG: novel variant and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive cerebral atrophy, hypomyelination and corpus callosum hypoplasia were striking features
      in brain MRI images taken during our follow-up.
    explanation: Independently reports the same progressive atrophy with hypomyelination in a different patient.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Both MRI and CT scan of the brain were within normal limits, but the EEG was abnormal.
    explanation: >-
      Qualifies the spectrum: the 14-year-old patient did not have the same structural imaging phenotype.
  downstream:
  - target: Cerebral Atrophy
    description: Progressive loss of cerebral tissue is the structural basis of the observed cerebral atrophy.
    causal_link_type: DIRECT
    evidence:

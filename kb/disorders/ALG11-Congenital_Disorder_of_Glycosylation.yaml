phenotypes:
- name: Seizures
  category: Neurological
  description: >-
    Epilepsy was recorded in all 12 patients summarized in the 2019 phenotype review, commonly beginning
    in infancy. Drug resistance and status epilepticus occur, but the adolescent in that report had been
    seizure-free for seven years on medication. These selected reports do not define lifetime penetrance;
    the young fetal-onset case initially had no confirmed epilepsy.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intellectual disability and epilepsy are universally present, and all had visual problems, except
      our patient 1
    explanation: >-
      Describes the 12 reported patients summarized in that review; it is not a population penetrance
      estimate.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: With current medication he has been seizure free for 7 years.
    explanation: >-
      Documents sustained seizure control in one adolescent; the regimen is not named in this statement.

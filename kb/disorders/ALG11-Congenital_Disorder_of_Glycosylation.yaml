      estimate comparative assay sensitivity.
    quote_role: PRIMARY_RESULT
- name: Serum Transferrin Isoform Profile
  notes: >-
    Isoelectric focusing, capillary zone electrophoresis or mass spectrometry of serum transferrin typically
    shows the type I CDG pattern of partially lost N-glycan side chains. It is the standard first-line
    screen and can be normal in a confirmed patient, so a negative result does not exclude the diagnosis.
  evidence:
  - reference: PMID:20080937
    reference_title: >-
      A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11
      leads to congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The isoelectric focusing pattern of the patient's serum transferrin showed the partial loss of complete
      N-glycan side chains, which is a characteristic sign for CDG-I.
    explanation: Supports the described variability of serum transferrin results in affected patients.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, one patient presented with normal transferrin glycosylation profile, a feature that
      has not been reported previously in patients with ALG11-CDG.
    explanation: Supports the described variability of serum transferrin results in affected patients.
    quote_role: PRIMARY_RESULT
- name: Coagulation Factor XI and Protein C Activity
  notes: >-
    One child had reduced factor XI (27%, age reference 38–164%) and protein C (25%, reference 37–81%).
    These are individual findings; another reported child had normal factor XI, protein C and antithrombin.
  evidence:
  - reference: PMID:28649519

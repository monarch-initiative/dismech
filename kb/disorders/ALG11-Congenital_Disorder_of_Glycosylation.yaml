differential_diagnoses:
- name: RFT1-congenital disorder of glycosylation
  description: >-
    RFT1-CDG can overlap with ALG11-CDG in severe developmental impairment and sensorineural hearing loss.
    Gene-specific molecular testing and cellular glycosylation studies distinguish the disorders; hearing
    loss alone does not identify either gene.
  evidence:
  - reference: PMID:28649519
    reference_title: 'ALG11-CDG: Three novel mutations and further characterization of the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Sensorineural deafness is highly unusual in other types of CDG, except RFT1-CDG
    explanation: Supports the overlapping hearing phenotype.
- name: Mitochondrial disorders
  description: >-
    Progressive cerebral atrophy and epilepsy can resemble mitochondrial disease. This is a broad diagnostic
    category rather than a specific molecular alternative; biochemical findings and genomic evaluation
    must be interpreted together.
  evidence:
  - reference: PMID:28649519
    reference_title: 'ALG11-CDG: Three novel mutations and further characterization of the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Comparable progressive atrophy has been reported in mitochondrial disorders
    explanation: Documents the radiological differential.

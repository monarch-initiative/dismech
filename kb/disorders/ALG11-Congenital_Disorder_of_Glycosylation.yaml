  chemical_entities:
  - preferred_term: dolichol-linked oligosaccharide
    term:
      id: CHEBI:61286
      label: dolichol-linked oligosaccharide
  evidence:
  - reference: PMID:20080937
    reference_title: >-
      A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11
      leads to congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of dolichol-linked oligosaccharides in patient-derived fibroblasts revealed an accumulation
      of Man3GlcNAc2-PP-dolichol and Man4GlcNAc2-PP-dolichol.
    explanation: Identifies the two LLO species that accumulate, fixing the exact step of the assembly block.

experimental_models:
- name: Patient-derived skin fibroblast lipid-linked oligosaccharide analysis
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured skin fibroblasts from affected individuals were used to characterize dolichol-linked oligosaccharides
    and early mannosyltransferase activity. Comparative wild-type and mutant ALG11 expression in patient
    fibroblasts supported causality of the index allele; the available abstract does not quantify the
    extent of rescue.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  publication: PMID:20080937
  modeled_mechanisms:
  - target: Lipid-Linked Oligosaccharide Assembly Arrest
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Directly measures the accumulating LLO species and the deficient elongation step in cells carrying
      the patient genotype.
    limitations: >-
      Fibroblasts reproduce the biochemical phenotype but do not establish the mechanism of selective
      brain, hearing or visual involvement.
    readouts:
    - name: Dolichol-linked oligosaccharide species
      target: Lipid-Linked Oligosaccharide Assembly Arrest
      direction: ALTERED
      interpretation: >-
        Accumulation of Man3GlcNAc2-PP-dolichol and Man4GlcNAc2-PP-dolichol marks the exact step at which
        assembly stalls.
      evidence:
      - reference: PMID:20080937
        reference_title: >-
          A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase
          hALG11 leads to congenital disorder of glycosylation-Ip.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Analysis of dolichol-linked oligosaccharides in patient-derived fibroblasts revealed an accumulation
          of Man3GlcNAc2-PP-dolichol and Man4GlcNAc2-PP-dolichol.
        explanation: The measurement itself.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:20080937
      reference_title: >-
        A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase
        hALG11 leads to congenital disorder of glycosylation-Ip.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Determination of mannosyltransferase activities of early steps of lipid-linked oligosaccharide
        biosynthesis in fibroblasts indicated that the patient was deficient in elongating Man3GlcNAc2-PP-dolichol.
      explanation: Supports treating patient fibroblasts as informative for this node.
      quote_role: PRIMARY_RESULT
  - target: Protein Hypoglycosylation
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      GP130 immunoblotting detects abnormal glycoforms in affected fibroblasts, including those with normal
      serum screening.
    limitations: >-
      This measures glycosylation, not cytokine signaling, and does not establish clinical diagnostic
      sensitivity.
    evidence:
    - reference: PMID:30676690
      reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Fibroblasts from the skin punch biopsy also yielded abnormally truncated GP130 isoforms on western
        blot
      explanation: Measures the cellular biochemical consequence.
- name: Yeast alg11 deletion strain complementation assay
  experimental_model_type: OTHER
  description: >-
    A Saccharomyces cerevisiae alg11 deletion strain provided a heterologous system for comparative human
    wild-type and mutant allele complementation. Together with the patient-fibroblast experiments, this
    supported functional causality for the index allele.
  organism:
    preferred_term: baker's yeast
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:20080937
  modeled_mechanisms:
  - target: ALG11 Mannosyltransferase Deficiency
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Human allele complementation in an alg11-deficient yeast background assesses recovery of conserved
      glycosylation function. It supports functional impairment of the tested allele rather than providing
      purified-enzyme kinetics.
    limitations: >-
      Heterologous complementation does not model human brain development or determine tissue-specific
      residual activity requirements.

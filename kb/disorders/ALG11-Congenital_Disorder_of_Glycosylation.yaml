    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous mutations of the ALG11 gene were found by whole exome sequencing (WES) analysis.
    explanation: Documents WES as the diagnostic route in a reported patient.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Subsequent ALG11 gene deletion/duplication analysis found a paternally inherited whole gene deletion

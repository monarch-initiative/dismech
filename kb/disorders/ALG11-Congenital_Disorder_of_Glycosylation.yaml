- name: EEG and Brain MRI
  description: >-
    EEG characterizes seizure type and background abnormalities. MRI assesses cortical development, myelination
    and tissue volume; repeat studies can distinguish delayed growth from progressive loss. Neither burst
    suppression nor atrophy is required for ALG11-CDG.

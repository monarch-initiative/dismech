      an obligatory sequence for every molecular diagnosis.
    quote_role: REVIEW_SYNTHESIS
- name: Fibroblast Lipid-Linked Oligosaccharide Analysis
  description: >-
    Lipid-linked oligosaccharide analysis in cultured fibroblasts can demonstrate the shortened precursors
    expected for ALG11 dysfunction and assist variant assessment. An improved labeling method detected
    three cases missed by prior routine diagnostics; this is not a formal sensitivity comparison against
    every modern serum or genomic test.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:22213132

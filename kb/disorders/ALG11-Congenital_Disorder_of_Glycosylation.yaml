- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic (homozygous or compound heterozygous) pathogenic
    ALG11 variants. Heterozygous carriers, including the parents of affected
    children, are asymptomatic.
  evidence:
  - reference: PMID:36843332
    reference_title: "ALG11-CDG: novel variant and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asparagine-dependent glycosylation 11-congenital disorders of glycosylation
      (ALG11-CDG) is a rare autosomal recessive N-glycosylation defect with
      multisystem involvement particularly neurological symptoms such as epilepsy
      and neuromotor developmental delay.
    explanation: States the autosomal recessive mode of inheritance for ALG11-CDG.
notes: >-
  Two points a curator should not smooth over. First, transferrin screening can
  be normal in a genuinely affected individual: PMID:30676690 reports a patient
  with two rounds of normal carbohydrate-deficient transferrin who nonetheless
  had truncated fibroblast LLO and GP130 hypoglycosylation. The `Type I
  transferrin isoform profile` phenotype is therefore curated without a frequency
  band, and the diagnostic entry records that a normal CDT does not exclude the
  diagnosis. Second, the prenatal course is genuinely contested in the
  literature rather than merely unreported: PMID:22213132 describes "an
  unremarkable prenatal period" across its four cases, whereas PMID:30770273
  documents arrest of fetal brain growth between 20 and 36 weeks' gestation in a
  patient with biallelic ALG11 variants. Both are curated, and the tension is
  recorded as an open discussion rather than resolved by preferring the newer
  report.

  The mechanism chain is curated from the enzymology in PMID:20080937, which is
  a single-patient study whose causal attribution rests on rescue by retroviral
  expression of wild-type ALG11 in patient fibroblasts and on a yeast alg11
  deletion complementation assay, not on cohort genetics. That is the strongest
  evidence available for this disorder and it is stated rather than implied.

  Research input: a Perplexity `sonar-deep-research` report was generated for
  this entry (`research/ALG11-Congenital_Disorder_of_Glycosylation-deep-research-perplexity.md`)
  and cleared the NEC preflight against MONDO:0013349 (PASS; ALG11 mentioned 130
  times, no rival gene). It was used only as a lead-generation aid: it returned
  no PMIDs in its body, so every reference below was independently located in
  PubMed and fetched with `just fetch-reference`, and every snippet is an exact
  quote checked against the cached record.
pathophysiology:
- name: ALG11 Mannosyltransferase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic ALG11 variants abolish or severely reduce the activity
    of the ER GDP-mannose:Man3GlcNAc2-PP-dolichol alpha-1,2-mannosyltransferase,
    the enzyme that sequentially adds the fourth and fifth of the nine mannose
    residues of the lipid-linked oligosaccharide precursor. The originally
    described p.Leu86Ser allele does not mislocalize or destabilize the protein,
    so the lesion is catalytic rather than a loss of the enzyme from the ER.
  genes:
  - preferred_term: ALG11
    term:
      id: hgnc:32456
      label: ALG11
  molecular_functions:
  - preferred_term: GDP-Man:Man(3)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity
    term:
      id: GO:0004377
      label: GDP-Man:Man(3)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:20080937
    reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A new type of congenital disorders of glycosylation, designated CDG-Ip, is
      caused by the deficiency of
      GDP-Man:Man3GlcNAc2-PP-dolichol-alpha1,2-mannosyltransferase, encoded by
      the human ortholog of ALG11 from yeast.
    explanation: >-
      Identifies the deficient enzyme activity and the gene encoding it as the
      cause of the disorder.
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      encodes the mannosyltransferase that uses GDP-mannose to sequentially add
      the fourth and the fifth of the nine mannoses to the LLO on the outer
      leaflet of the endoplasmic reticulum
    explanation: >-
      Specifies which two mannose-transfer steps ALG11 catalyses, fixing the
      position of the block in LLO assembly.
  - reference: PMID:20080937
    reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescence examinations combined with western blotting showed no
      differences of intracellular localization or expression of ALG11 between
      control and patient fibroblasts, respectively, indicating no mislocalization
      or degradation of the mutated transferase.
    explanation: >-
      Supports curating the lesion as loss of catalytic activity rather than loss
      or mislocalization of the protein, at least for the p.Leu86Ser allele.
  downstream:
  - target: Lipid-Linked Oligosaccharide Assembly Arrest
    description: >-
      Without the alpha-1,2-mannosyltransferase step, elongation of
      Man3GlcNAc2-PP-dolichol cannot proceed and the immature LLO species
      accumulate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20080937
      reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Determination of mannosyltransferase activities of early steps of
        lipid-linked oligosaccharide biosynthesis in fibroblasts indicated that
        the patient was deficient in elongating Man3GlcNAc2-PP-dolichol.
      explanation: >-
        Directly links the enzyme deficiency to failure of LLO elongation in
        patient cells.
- name: Lipid-Linked Oligosaccharide Assembly Arrest
  conforms_to: "congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect"
  biological_scale: MOLECULAR
  description: >-
    LLO biosynthesis stalls at the cytosolic face of the ER membrane, and
    Man3GlcNAc2-PP-dolichol and Man4GlcNAc2-PP-dolichol accumulate in patient
    fibroblasts instead of being elongated towards the mature
    Glc3Man9GlcNAc2-PP-dolichol donor.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: dolichol-linked oligosaccharide
    term:
      id: CHEBI:61286
      label: dolichol-linked oligosaccharide
  evidence:
  - reference: PMID:20080937
    reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of dolichol-linked oligosaccharides in patient-derived fibroblasts
      revealed an accumulation of Man3GlcNAc2-PP-dolichol and
      Man4GlcNAc2-PP-dolichol.
    explanation: >-
      Identifies the two LLO species that accumulate, fixing the exact step of
      the assembly block.
  - reference: PMID:22213132
    reference_title: "Improved diagnostics lead to identification of three new patients with congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      who presented an accumulation of shortened dolichol-linked oligosaccharides
      leading to CDG-Ip (ALG11-CDG)
    explanation: >-
      Independently confirms shortened LLO accumulation as the biochemical
      signature of the disorder.
  downstream:
  - target: Protein Hypoglycosylation
    description: >-
      The oligosaccharyltransferase transfers the available truncated glycan, or
      fails to transfer at all, so nascent glycoproteins carry incomplete or
      missing N-glycan chains.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30676690
      reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Their fibroblasts synthesized truncated precursor glycan structures,
        consistent with ALG11-CDG, while also showing hypoglycosylation of a novel
        biomarker, GP130.
      explanation: >-
        Shows truncated precursor synthesis and glycoprotein hypoglycosylation in
        the same patient cells.
- name: Protein Hypoglycosylation
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  biological_scale: CELLULAR
  description: >-
    Serum and cellular glycoproteins carry incomplete N-glycan chains. In serum
    this appears as the type I transferrin isoform profile of a CDG-I disorder;
    in fibroblasts the membrane glycoprotein GP130 runs as abnormally truncated
    isoforms. Because transferrin glycosylation can be normal despite proven
    disease, cellular readouts are the more reliable demonstration of the defect.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  evidence:
  - reference: PMID:20080937
    reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The isoelectric focusing pattern of the patient's serum transferrin showed
      the partial loss of complete N-glycan side chains, which is a characteristic
      sign for CDG-I.
    explanation: >-
      Demonstrates hypoglycosylation of a serum glycoprotein in the index patient.
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, one patient presented with normal transferrin glycosylation
      profile, a feature that has not been reported previously in patients with
      ALG11-CDG.
    explanation: >-
      Qualifies the node: hypoglycosylation is not uniformly detectable on serum
      transferrin, so this evidence is PARTIAL for the general claim and is the
      basis for the diagnostic caveat.
  downstream:
  - target: Multisystem Glycoprotein Dysfunction
    description: >-
      Incomplete N-glycosylation of many unrelated glycoproteins degrades their
      folding, stability, trafficking and function across organ systems.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36843332
      reference_title: "ALG11-CDG: novel variant and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        is a rare autosomal recessive N-glycosylation defect with multisystem
        involvement particularly neurological symptoms such as epilepsy and
        neuromotor developmental delay
      explanation: >-
        Links the N-glycosylation defect to multisystem, neurologically dominated
        disease.
- name: Multisystem Glycoprotein Dysfunction
  conforms_to: "congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction"
  biological_scale: ORGANISM
  description: >-
    Widespread glycoprotein dysfunction produces the multisystem phenotype:
    a severe infantile epileptic encephalopathy with developmental disability,
    together with growth failure, feeding difficulty, sensorineural hearing loss
    and ophthalmological involvement. Intellectual disability and epilepsy are
    the two features present in essentially every reported patient.
  evidence:
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intellectual disability and epilepsy are universally present, and all had
      visual problems, except our patient 1
    explanation: >-
      Establishes the two invariant features across the reported case series.
  - reference: PMID:22213132
    reference_title: "Improved diagnostics lead to identification of three new patients with congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      they share a variety of clinical syndromes like an unremarkable prenatal
      period followed by developmental delay, psychomotor, and mental
      retardation, strabismus convergens and seizures occurring in the first year
      of life
    explanation: >-
      Describes the shared clinical syndrome across four independently identified
      patients.
  downstream:
  - target: Progressive Loss of Brain Structures
    description: >-
      Beyond the static encephalopathy, affected brains lose volume over time
      rather than merely developing abnormally.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39809108
      reference_title: "Progressive loss of cerebral structures in ALG11-related congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ALG11-CDG is associated with atrophy and eventual vanishing of
        supratentorial brain structures, and infratentorial brain structures later
        in the disease process.
      explanation: >-
        States the progressive, sequential structural loss that distinguishes this
        node from the static developmental picture.
- name: Progressive Loss of Brain Structures
  biological_scale: TISSUE
  description: >-
    Serial imaging shows a progressive, regionally ordered neurodegenerative
    course: severe supratentorial volume loss first, with the cerebellum and
    brainstem relatively preserved in the neonatal period, followed years later
    by near-complete loss of the cerebral hemispheres with severe cerebellar
    atrophy and brainstem volume reduction. Cerebral hypomyelination and corpus
    callosum hypoplasia accompany the atrophy.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:39809108
    reference_title: "Progressive loss of cerebral structures in ALG11-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was near complete loss of cerebral hemispheres, severe cerebellar
      atrophy, and decreased volume of the brainstem.
    explanation: >-
      Documents the extent of structural loss at age seven in a serially imaged
      patient.
  - reference: PMID:36843332
    reference_title: "ALG11-CDG: novel variant and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive cerebral atrophy, hypomyelination and corpus callosum hypoplasia
      were striking features in brain MRI images taken during our follow-up.
    explanation: >-
      Independently reports the same progressive atrophy with hypomyelination in a
      different patient.
  - reference: PMID:30770273
    reference_title: "Arrest of Fetal Brain Development in ALG11-Congenital Disorder of Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postnatal brain magnetic resonance imaging found no brain growth during the
      interval from the fetal to postnatal study.
    explanation: >-
      Places the onset of the growth failure before birth, which is what makes
      this a developmental arrest as well as a postnatal degeneration.
  - reference: PMID:30770273
    reference_title: "Arrest of Fetal Brain Development in ALG11-Congenital Disorder of Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arrest of fetal brain development, with image findings consistent with fetal
      brain disruption sequence, is a previously unreported phenotype of
      congenital microcephaly in ALG11-congenital disorder of glycosylation.
    explanation: >-
      The paper's own statement of the phenotype it adds to the disorder.

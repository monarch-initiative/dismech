- name: Lipid-Linked Oligosaccharide Assembly Arrest
  conforms_to: congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect
  biological_scale: MOLECULAR
  description: >-
    Shortened Man3GlcNAc2-PP-dolichol and Man4GlcNAc2-PP-dolichol accumulate in affected fibroblasts.
    This is impaired precursor assembly rather than proof that every LLO molecule is arrested or that
    those truncated species are transferred unchanged to proteins.

biochemical:
- name: GP130 Glycosylation Status
  notes: >-
    Affected fibroblasts can show lower-molecular-weight GP130 glycoforms, including in individuals with
    normal serum transferrin. This is a research-laboratory cellular readout, not an established replacement
    screening test or proof of impaired GP130 cytokine signaling.
  evidence:
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts from the skin punch biopsy also yielded abnormally truncated GP130 isoforms on western
      blot
    explanation: Documents the abnormal GP130 isoform pattern in patient-derived fibroblasts.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: IN_VITRO

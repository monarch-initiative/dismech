biochemical:
- name: GP130 Glycosylation Status
  notes: >-
    The membrane glycoprotein GP130 runs as abnormally truncated isoforms on
    western blot in patient fibroblasts. It matters clinically because it is
    positive in a patient whose serum transferrin screening was repeatedly
    normal, so it detects the glycosylation defect where the first-line serum
    test does not.
  evidence:
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts from the skin punch biopsy also yielded abnormally truncated
      GP130 isoforms on western blot
    explanation: >-
      Documents the abnormal GP130 isoform pattern in patient-derived fibroblasts.
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      hypoglycosylation of a novel biomarker, GP130. Surprisingly, one patient
      presented with normal transferrin glycosylation profile
    explanation: >-
      The two findings in one sentence: GP130 is hypoglycosylated in the same
      patient whose transferrin profile was normal, which is what makes it the
      more reliable readout.
- name: Serum Transferrin Isoform Profile
  notes: >-
    Isoelectric focusing, capillary zone electrophoresis or mass spectrometry of
    serum transferrin typically shows the type I CDG pattern of partially lost
    N-glycan side chains. It is the standard first-line screen and can be
    normal in a confirmed patient, so a negative result does not exclude the
    diagnosis.
  evidence:
  - reference: PMID:20080937
    reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The isoelectric focusing pattern of the patient's serum transferrin showed
      the partial loss of complete N-glycan side chains, which is a characteristic
      sign for CDG-I.
    explanation: Documents the transferrin abnormality in the index patient.
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, one patient presented with normal transferrin glycosylation
      profile, a feature that has not been reported previously in patients with
      ALG11-CDG.
    explanation: >-
      Refutes treating a normal transferrin profile as excluding the diagnosis.
genetic:
- name: ALG11
  gene_term:
    preferred_term: ALG11
    term:
      id: hgnc:32456
      label: ALG11
  association: Biallelic loss-of-function variants
  features: >-
    ALG11 on chromosome 13q14 encodes the ER alpha-1,2-mannosyltransferase that
    adds the fourth and fifth mannose residues to the lipid-linked
    oligosaccharide. Reported pathogenic alleles include missense, nonsense,
    frameshift and splice-site changes as well as whole-gene deletion; disease
    requires two such alleles.
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:20080937
    reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Verification of the mutation as a primary cause for the genetic defect was
      proved by retroviral expression of human wild-type and mutated ALG11 cDNA in
      patient-derived fibroblasts as well as using a yeast alg11 deletion strain
      as a heterologous expression system for hALG11 variants.
    explanation: >-
      Functional rescue and heterologous complementation establish the ALG11
      variant as causal rather than merely associated.
  - reference: PMID:22213132
    reference_title: "Improved diagnostics lead to identification of three new patients with congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although all CDG-Ip patients carry different mutations in the ALG11 gene,
      they share a variety of clinical syndromes
    explanation: >-
      Establishes allelic heterogeneity with a convergent clinical phenotype
      across independently ascertained patients.
progression:
- phase: Infantile onset
  notes: >-
    Hypotonia, feeding difficulty and developmental delay appear in the first
    months, with seizures typically beginning within the first year of life.
  evidence:
  - reference: PMID:22213132
    reference_title: "Improved diagnostics lead to identification of three new patients with congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      followed by developmental delay, psychomotor, and mental retardation,
      strabismus convergens and seizures occurring in the first year of life
    explanation: Establishes the first-year onset of the neurological features.
- phase: Progressive neurodegeneration
  notes: >-
    Serial imaging shows supratentorial volume loss progressing to near-complete
    loss of the cerebral hemispheres, with cerebellar and brainstem involvement
    appearing later.
  evidence:
  - reference: PMID:39809108
    reference_title: "Progressive loss of cerebral structures in ALG11-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI at age seven years showed significant disease progression compared
      to the neonatal brain MRI.
    explanation: Documents radiological progression between neonatal and later imaging.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Curated as a case count, not a rate. Ten patients were described as of the
    2019 phenotype-expansion review, with further individuals reported since. No
    source cited here gives a population denominator, so no `rate_per_100000` is
    asserted; converting a case count into a rate would invent one.
  evidence:
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only ten patients have been described with ALG11-CDG
    explanation: >-
      Establishes the reported case count at the time of that review, which is the
      only occurrence figure any cited source provides.
diagnosis:
- name: Serum Transferrin Isoform Analysis
  description: >-
    Isoelectric focusing, capillary zone electrophoresis or mass spectrometry of
    serum transferrin is the standard first-line CDG screen and typically shows a
    type I pattern. A normal result does not exclude ALG11-CDG, so a negative
    screen in a suggestive clinical context should be followed by cellular
    studies or sequencing rather than ending the workup.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:36843332
    reference_title: "ALG11-CDG: novel variant and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with a possible congenital defect of glycosylation, a screening
      test such as CDT analysis is suggested.
    explanation: Supports transferrin analysis as the recommended screening test.
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      because any potential mutation in ALG11 could show an inconsistent
      transferrin glycosylation pattern, analysis of fibroblast LLO and/or a
      cellular glycoprotein is important to confirm pathogenicity
    explanation: >-
      States that transferrin analysis can be inconsistent and that cellular
      studies are needed to confirm pathogenicity.
- name: Fibroblast Lipid-Linked Oligosaccharide Analysis
  description: >-
    Metabolic labelling and size analysis of dolichol-linked oligosaccharides in
    cultured skin fibroblasts demonstrates the truncated LLO characteristic of the
    ALG11 block. An improved labelling method identified three cases that routine
    diagnostics had missed, so this assay has sensitivity that the standard screen
    lacks.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:22213132
    reference_title: "Improved diagnostics lead to identification of three new patients with congenital disorder of glycosylation-Ip."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we describe an improved metabolic labeling method that allowed the
      identification of three new CDG-Ip cases that were missed so far in routine
      diagnostics.
    explanation: >-
      Demonstrates that fibroblast LLO analysis detects cases missed by routine
      screening.
- name: Exome Sequencing
  description: >-
    Whole exome sequencing identifies the biallelic ALG11 variants and has been
    the route to diagnosis in most recent reports, including a post-mortem
    diagnosis. Deletion/duplication analysis is needed in addition, because a
    whole-gene deletion in trans with a missense variant can otherwise be
    misread as homozygosity.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:36843332
    reference_title: "ALG11-CDG: novel variant and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous mutations of the ALG11 gene were found by whole exome
      sequencing (WES) analysis.
    explanation: Documents WES as the diagnostic route in a reported patient.
treatments:
- name: Anti-Seizure Pharmacotherapy
  description: >-
    Seizure control is a central management goal, but epilepsy in ALG11-CDG is
    frequently drug-resistant. No anti-seizure regimen is established as superior
    for this disorder, and the treatment is symptomatic rather than
    disease-modifying.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Multisystem Glycoprotein Dysfunction
    treatment_effect: MODULATES
    description: >-
      Symptomatic control of the epileptic manifestation of the multisystem
      disorder. It does not act on the glycosylation defect, and MODULATES is
      used because no controlled data establish an effect size for any agent in
      this disorder.
  evidence:
  - reference: PMID:36843332
    reference_title: "ALG11-CDG: novel variant and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 31-month-old male patient admitted to our center with complaints of axial
      hypotonia, drug-resistant myoclonic seizures, microcephaly and deafness.
    explanation: >-
      Establishes that seizures are treated but frequently resistant; PARTIAL
      because the report documents the resistance rather than the efficacy of any
      particular agent.
- name: Palliative and Supportive Care
  description: >-
    Given the progressive neurodegenerative course and absence of
    disease-modifying therapy, symptom management, feeding support and
    involvement of a paediatric palliative care service are the mainstay of
    management.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no target_mechanisms link. Palliative care addresses
    symptom burden and family support; it does not act on any pathophysiology
    node, and none of the available treatment_effect values would describe it
    honestly.
  evidence:
  - reference: PMID:39809108
    reference_title: "Progressive loss of cerebral structures in ALG11-related congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The involvement of a pediatric palliative care service is a valuable adjunct
      to assist with symptom management and family support for these complex
      progressive conditions.
    explanation: Directly recommends palliative care involvement for this disorder.
experimental_models:
- name: Patient-derived skin fibroblast lipid-linked oligosaccharide analysis
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured skin fibroblasts from affected individuals, used to size the
    dolichol-linked oligosaccharide pool and to assay the mannosyltransferase
    activities of early LLO biosynthesis. This is the system in which the
    position of the ALG11 block was established, and in which retroviral
    expression of wild-type ALG11 rescued the defect.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  publication: PMID:20080937
  modeled_mechanisms:
  - target: Lipid-Linked Oligosaccharide Assembly Arrest
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Directly measures the accumulating LLO species and the deficient elongation
      step in cells carrying the patient genotype.
    limitations: >-
      Fibroblasts are not an affected tissue in this disorder, which is
      neurological; the assay reports the biochemical lesion faithfully but says
      nothing about why the brain bears the disease.
    readouts:
    - name: Dolichol-linked oligosaccharide species
      target: Lipid-Linked Oligosaccharide Assembly Arrest
      direction: ALTERED
      interpretation: >-
        Accumulation of Man3GlcNAc2-PP-dolichol and Man4GlcNAc2-PP-dolichol marks
        the exact step at which assembly stalls.
      evidence:
      - reference: PMID:20080937
        reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Analysis of dolichol-linked oligosaccharides in patient-derived
          fibroblasts revealed an accumulation of Man3GlcNAc2-PP-dolichol and
          Man4GlcNAc2-PP-dolichol.
        explanation: The measurement itself.
    evidence:
    - reference: PMID:20080937
      reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Determination of mannosyltransferase activities of early steps of
        lipid-linked oligosaccharide biosynthesis in fibroblasts indicated that the
        patient was deficient in elongating Man3GlcNAc2-PP-dolichol.
      explanation: >-
        Supports treating patient fibroblasts as informative for this node.
- name: Yeast alg11 deletion strain complementation assay
  experimental_model_type: OTHER
  description: >-
    A Saccharomyces cerevisiae alg11 deletion strain used as a heterologous
    expression system for human ALG11 variants. Together with retroviral rescue
    in patient fibroblasts, it is what established the ALG11 variant as causal
    rather than merely co-segregating.
  organism:
    preferred_term: baker's yeast
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:20080937
  modeled_mechanisms:
  - target: ALG11 Mannosyltransferase Deficiency
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Reports whether a given human ALG11 allele can restore function in a cell
      lacking the orthologous gene, which is a direct read on the allele's
      catalytic competence.
    limitations: >-
      A yeast cell is not a human one: the assay can show that an allele is
      hypofunctional, but not how much residual activity a human tissue needs, and
      the ALG11 substrate context differs between the two organisms.
    evidence:
    - reference: PMID:20080937
      reference_title: "A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11 leads to congenital disorder of glycosylation-Ip."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        using a yeast alg11 deletion strain as a heterologous expression system for
        hALG11 variants
      explanation: >-
        Establishes the complementation system used to verify causality.
discussions:
- discussion_id: gap_prenatal_onset_of_brain_involvement
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Progressive Loss of Brain Structures
  prompt: >-
    Does brain injury in ALG11-CDG begin prenatally, and if so how often? The
    literature contains a direct disagreement rather than a silence.
  rationale: >-
    PMID:22213132 characterises the shared clinical course across four patients
    as an unremarkable prenatal period followed by postnatal decline, whereas
    PMID:30770273 documents normal fetal biometry at 20 weeks and severe
    microcephaly with agenesis of the corpus callosum by 36 weeks in a patient
    with biallelic ALG11 variants, and no interval brain growth between the fetal
    and postnatal scan. Whether that patient is an outlier, whether milder
    prenatal arrest is routinely missed because fetal imaging is not performed,
    and whether the timing tracks residual enzyme activity are all unresolved.
    The answer matters for counselling and for whether any future therapy would
    have to act before birth.
  proposed_experiments:
  - experiment_id: exp_alg11_prenatal_imaging_review
    name: Systematic review of prenatal imaging and biometry in genetically confirmed ALG11-CDG
    description: >-
      Collect fetal ultrasound and MRI data, including third-trimester head
      circumference trajectories, from all reported and unreported genetically
      confirmed patients, to establish how often head growth arrest is detectable
      before birth.
  - experiment_id: exp_alg11_genotype_stratified_onset
    name: Genotype-stratified onset analysis
    description: >-
      Compare age at first detectable brain abnormality between patients carrying
      two severe (null or whole-gene-deletion) alleles and those with at least one
      hypomorphic missense allele.
- discussion_id: gap_mechanism_of_sensorineural_deafness
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Sensorineural Hearing Impairment
  prompt: >-
    Why is sensorineural deafness frequent in ALG11-CDG and RFT1-CDG but unusual
    in the other congenital disorders of glycosylation?
  rationale: >-
    The observation is clinically useful as a differentiating clue, and it is
    striking that the two CDGs sharing it act at adjacent points in
    lipid-linked-oligosaccharide handling. The proposed explanation — that
    cytoplasmic accumulation of a shared substrate is otoneurotoxic — is offered
    in PMID:30676690 as a speculation and is curated here as such: it is not
    supported by any cochlear measurement, any animal model, or any demonstration
    that the accumulating species reaches the inner ear. It is recorded because a
    testable hypothesis attached to a real phenotype is more useful than silence,
    not because it is established.
  proposed_experiments:
  - experiment_id: exp_alg11_cochlear_phenotyping_mouse
    name: Cochlear phenotyping of an Alg11 hypomorphic mouse
    description: >-
      Measure auditory brainstem response thresholds and hair-cell survival in a
      hypomorphic Alg11 model, and test whether hearing loss tracks the
      accumulation of Man3/Man4GlcNAc2-PP-dolichol in cochlear tissue.
  - experiment_id: exp_alg11_cross_cdg_audiology
    name: Cross-CDG audiological comparison against LLO intermediate species
    description: >-
      Compare the prevalence and severity of sensorineural hearing loss across CDG
      types with the identity of the accumulating LLO intermediate, testing whether
      deafness segregates with the ALG11/RFT1 substrate rather than with
      hypoglycosylation severity generally.

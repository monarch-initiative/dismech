name: ALG11-congenital disorder of glycosylation
creation_date: '2026-08-24T21:40:00Z'
category: Mendelian
description: >-
  ALG11-CDG is an autosomal recessive disorder of protein N-glycosylation caused by biallelic ALG11 variants.
  ALG11 catalyzes addition of the fourth and fifth mannose residues to the lipid-linked oligosaccharide
  precursor on the cytosolic face of the endoplasmic reticulum. Affected fibroblasts accumulate shortened
  precursors and show glycoprotein hypoglycosylation; serum transferrin screening can nevertheless be
  normal. Reported manifestations include infantile epilepsy, developmental disability, abnormal muscle
  tone, microcephaly, hearing and visual impairment, and feeding difficulties. Prenatal brain growth arrest
  and progressive cerebral atrophy occur in severe cases, but imaging and seizure outcomes vary. Care
  is individualized and supportive.
disease_term:
  preferred_term: ALG11-congenital disorder of glycosylation
  term:
    id: MONDO:0013349
    label: ALG11-congenital disorder of glycosylation
parents:
- congenital disorder of glycosylation type I
- disorder of protein N-glycosylation
synonyms:
- ALG11-CDG
- congenital disorder of glycosylation type Ip
- CDG-Ip
- CDG1P
- carbohydrate deficient glycoprotein syndrome type Ip
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic (homozygous or compound heterozygous) pathogenic ALG11 variants. Heterozygous
    carriers, including the parents of affected children, are asymptomatic.
  evidence:
  - reference: PMID:36843332
    reference_title: 'ALG11-CDG: novel variant and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asparagine-dependent glycosylation 11-congenital disorders of glycosylation (ALG11-CDG) is a rare
      autosomal recessive N-glycosylation defect with multisystem involvement particularly neurological
      symptoms such as epilepsy and neuromotor developmental delay.
    explanation: States the autosomal recessive mode of inheritance for ALG11-CDG.
    quote_role: BACKGROUND
  - reference: PMID:28649519
    reference_title: 'ALG11-CDG: Three novel mutations and further characterization of the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The parents are carriers of these variants.
    explanation: Parental segregation in the two reported families supports recessive transmission.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1332/
    reference_title: >-
      Congenital Disorders of N-Linked Glycosylation and Multiple Pathway Overview – RETIRED CHAPTER,
      FOR HISTORICAL REFERENCE ONLY - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Heterozygotes (carriers) are asymptomatic and are not at risk of developing the disorder.
    explanation: >-
      Historical GeneReviews counseling for autosomal recessive CDG; this is not a measurement of ALG11
      carrier enzyme activity.
notes: >-
  Published evidence consists mainly of small case series and individual reports. Frequencies below refer
  to the specified reported-patient samples, with missing observations retained in their denominators.
  Fetal growth arrest and later atrophy are distinct findings; the 2025 imaging report follows the same
  child described prenatally in 2019. Normal transferrin glycosylation has been reported in several affected
  individuals. The GeneReviews overview was retired in June 2026 and last substantively updated in 2017;
  it is used explicitly as historical general-CDG context alongside newer ALG11-specific primary reports.
  Most clinical manifestations have no causal edge from protein hypoglycosylation because the cited fibroblast
  and clinical observations do not establish the intervening tissue-specific mechanism. Dysphagia, reflux,
  aspiration, visual deficits, hernias and dysmorphic findings are retained as observations without assuming
  an untested common causal route. The existing tissue-level edges represent observed structural consequences,
  not a complete explanation of neurological disease. The historical GeneReviews clinical summary additionally
  describes unusual fat distribution and gastric bleeding in the index child; the available summary does
  not resolve their mechanism or population frequency.
pathophysiology:
- name: Biallelic ALG11 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous ALG11 variants impair gene function. Missense alleles, frameshift
    and splice-site variants, and a whole-gene deletion in trans with a missense allele have been reported.
    Functional effects differ by allele.
  genes:
  - preferred_term: ALG11
    term:
      id: hgnc:32456
      label: ALG11
  evidence:
  - reference: PMID:20080937
    reference_title: >-
      A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11
      leads to congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These findings gave rise to genetic analysis of the hALG11 cDNA, in which homozygosity for mutation
      c.T257C (p.L86S) was identified.
    explanation: Identifies the homozygous index allele.
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Subsequent ALG11 gene deletion/duplication analysis found a paternally inherited whole gene deletion
      of ALG11 in the patient.
    explanation: Documents a structural allele paired with the maternal p.Leu46Pro variant.
  downstream:
  - target: ALG11 Mannosyltransferase Deficiency
    causal_link_type: DIRECT
    description: >-
      The index allele impairs ALG11-dependent elongation; wild-type versus mutant complementation supports
      its causal effect.
    evidence:
    - reference: PMID:20080937
      reference_title: >-
        A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase
        hALG11 leads to congenital disorder of glycosylation-Ip.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Verification of the mutation as a primary cause for the genetic defect was proved by retroviral
        expression of human wild-type and mutated ALG11 cDNA in patient-derived fibroblasts as well as
        using a yeast alg11 deletion strain as a heterologous expression system for hALG11 variants.
      explanation: Functional complementation supports causality for the tested allele.
  - target: Reduced ALG11 Protein Abundance
    causal_link_type: DIRECT
    description: >-
      Loss of one gene copy can reduce abundance in the reported deletion/missense genotype; this is not
      a uniform effect of missense alleles.
    evidence:
    - reference: PMID:30676690
      reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        As expected, patient 2 had slightly less ALG11 protein due to the paternally inherited whole gene
        deletion (Figure 2).
      explanation: Directly reports lower protein abundance in this genotype.
- name: ALG11 Mannosyltransferase Deficiency
  biological_scale: MOLECULAR
  description: >-
    ALG11 activity is deficient at the fourth and fifth mannose-transfer steps of lipid-linked oligosaccharide
    assembly. The p.Leu86Ser index fibroblasts had impaired elongation despite unchanged measured protein
    abundance and localization. This catalytic phenotype should not be generalized to the abundance of
    every ALG11 variant.
  genes:
  - preferred_term: ALG11
    term:
      id: hgnc:32456
      label: ALG11
  molecular_functions:
  - preferred_term: GDP-Man:Man(3)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity
    term:
      id: GO:0004377
      label: GDP-Man:Man(3)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:20080937
    reference_title: >-
      A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11
      leads to congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Determination of mannosyltransferase activities of early steps of lipid-linked oligosaccharide biosynthesis
      in fibroblasts indicated that the patient was deficient in elongating Man3GlcNAc2-PP-dolichol.
    explanation: Direct assay of the elongation defect in index patient fibroblasts.
  - reference: PMID:20080937
    reference_title: >-
      A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11
      leads to congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Immunofluorescence examinations combined with western blotting showed no differences of intracellular
      localization or expression of ALG11 between control and patient fibroblasts, respectively, indicating
      no mislocalization or degradation of the mutated transferase.
    explanation: >-
      Preserved measured abundance and localization apply to the index allele, not all disease-associated
      alleles.
  downstream:
  - target: Lipid-Linked Oligosaccharide Assembly Arrest
    description: >-
      Reduced ALG11-dependent mannose transfer impairs precursor elongation and permits accumulation of
      shortened species; residual synthesis is not excluded.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20080937
      reference_title: >-
        A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase
        hALG11 leads to congenital disorder of glycosylation-Ip.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Determination of mannosyltransferase activities of early steps of lipid-linked oligosaccharide
        biosynthesis in fibroblasts indicated that the patient was deficient in elongating Man3GlcNAc2-PP-dolichol.
      explanation: Directly links the enzyme deficiency to failure of LLO elongation in patient cells.
      quote_role: PRIMARY_RESULT

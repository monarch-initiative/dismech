name: ALG11-congenital disorder of glycosylation
creation_date: "2026-08-24T21:40:00Z"
category: Mendelian
description: >-
  ALG11-CDG (formerly CDG-Ip) is a rare autosomal recessive congenital disorder
  of glycosylation caused by biallelic deficiency of the endoplasmic-reticulum
  enzyme ALG11, the GDP-mannose:Man3GlcNAc2-PP-dolichol alpha-1,2-mannosyltransferase
  that adds the fourth and fifth mannose residues to the lipid-linked
  oligosaccharide (LLO) precursor on the cytosolic face of the ER membrane. Loss
  of the enzyme arrests LLO assembly at Man3GlcNAc2-PP-dolichol and
  Man4GlcNAc2-PP-dolichol, so a truncated glycan reaches the
  oligosaccharyltransferase and serum and cellular glycoproteins are
  hypoglycosylated. The clinical picture is dominated by a severe infantile
  epileptic encephalopathy — axial hypotonia, drug-resistant seizures often with
  a burst-suppression EEG, profound developmental disability — together with
  progressive microcephaly, sensorineural hearing loss, strabismus, dysmorphism
  and failure to thrive. Neuroimaging shows progressive cerebral atrophy,
  hypomyelination and corpus callosum hypoplasia, with loss of supratentorial and
  later infratentorial structures. Fewer than thirty individuals have been
  reported. Management is supportive; no disease-modifying therapy exists.

  biological_scale: MOLECULAR
  description: >-
    Reduced steady-state ALG11 protein is an allele-dependent observation. It was reported in fibroblasts
    with a whole-gene deletion in trans with p.Leu46Pro. Other tested missense genotypes had normal measured
    abundance. Reduced abundance alone does not establish an altered protein-degradation rate.
  genes:
  - preferred_term: ALG11
    term:
      id: hgnc:32456

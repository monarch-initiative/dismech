      CDG type 1 pattern was detected with the examination of carbohydrate-deficient
      transferrin (CDT) by capillary zone electrophoresis.
    explanation: Documents the type I CDG transferrin pattern in an affected patient.
  - reference: PMID:30676690
    reference_title: "ALG11-CDG syndrome: Expanding the phenotype."
    supports: REFUTE

  downstream:
  - target: Protein Hypoglycosylation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Lipid-linked glycan donor maturation and oligosaccharyltransferase-mediated N-glycan attachment
    description: >-
      Defective precursor assembly limits protein N-glycosylation. The cited fibroblast study demonstrates
      shortened precursors and hypoglycosylated GP130 together; it does not directly measure transfer
      of a particular truncated glycan to GP130.
    evidence:
    - reference: PMID:30676690
      reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Their fibroblasts synthesized truncated precursor glycan structures, consistent with ALG11-CDG,
        while also showing hypoglycosylation of a novel biomarker, GP130.
      explanation: >-
        Supports the biochemical relationship, without resolving each omitted donor-processing and transfer
        step.
      directness: INDIRECT
- name: Protein Hypoglycosylation
  conforms_to: congenital_disorder_of_glycosylation#Protein Hypoglycosylation
  biological_scale: CELLULAR
  description: >-
    Protein N-glycosylation is reduced. The index serum transferrin pattern reflected loss of complete
    N-glycan side chains, and affected fibroblasts show lower-molecular-weight GP130 glycoforms. These
    are protein- and sample-specific readouts: normal serum transferrin does not exclude a cellular defect.
    Comparative diagnostic sensitivity of GP130 versus transferrin has not been established.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  evidence:
  - reference: PMID:20080937
    reference_title: >-
      A severe human metabolic disease caused by deficiency of the endoplasmatic mannosyltransferase hALG11
      leads to congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The isoelectric focusing pattern of the patient's serum transferrin showed the partial loss of complete
      N-glycan side chains, which is a characteristic sign for CDG-I.
    explanation: Demonstrates hypoglycosylation of a serum glycoprotein in the index patient.
    quote_role: PRIMARY_RESULT
  - reference: PMID:30676690
    reference_title: 'ALG11-CDG syndrome: Expanding the phenotype.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fibroblasts from the skin punch biopsy also yielded abnormally truncated GP130 isoforms on western
      blot
    explanation: Documents the cellular glycoprotein readout.
  - reference: PMID:30770273
    reference_title: Arrest of Fetal Brain Development in ALG11-Congenital Disorder of Glycosylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Interestingly, serum N-glycan analysis and carbohydrate deficient transferrin were normal, but the
      novel GP130 biomarker revealed cellular hypoglycosylation, while LLO analysis was consistent with
      ALG11-CDG.
    explanation: Supports coexistence of normal serum screening and abnormal cellular glycosylation.
  downstream:

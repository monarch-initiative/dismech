  findings:
  - statement: >-
      A 2024 compound-heterozygous p.Gly436Val/p.Arg468His report found lower ALG11 expression and GP130
      hypoglycosylation in transfected HCT116 cells. Protein stability is an interpretation supported
      by structural predictions; no direct turnover assay is described. The abstract is cached, and publisher
      main-text passages were inspected separately; the publisher prevented canonical full-text download.

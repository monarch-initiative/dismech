discussions:
- discussion_id: gap_prenatal_onset_of_brain_involvement
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Prenatal Arrest of Cerebral Growth
  - pathophysiology#Progressive Loss of Brain Structures
  prompt: >-
    How often does cerebral growth arrest begin prenatally, and which factors determine subsequent tissue
    loss?
  rationale: >-
    Unremarkable pregnancies in earlier patients and fetal brain growth arrest in a later child represent
    clinical variability rather than conflicting observations. In that child, fetal-to-neonatal MRI showed
    absent growth, whereas later follow-up documented marked tissue loss. The prevalence of prenatal onset,
    genotype associations and cellular basis remain unresolved.
  proposed_experiments:
  - experiment_id: exp_alg11_prenatal_imaging_review
    name: Systematic review of prenatal imaging and biometry in genetically confirmed ALG11-CDG
    description: >-
      Collect fetal ultrasound and MRI data, including third-trimester head circumference trajectories,
      from all reported and unreported genetically confirmed patients, to establish how often head growth
      arrest is detectable before birth.
  - experiment_id: exp_alg11_genotype_stratified_onset
    name: Genotype-stratified onset analysis
    description: >-
      Compare age at first detectable brain abnormality between patients carrying two severe (null or
      whole-gene-deletion) alleles and those with at least one hypomorphic missense allele.
- discussion_id: gap_mechanism_of_sensorineural_deafness
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Sensorineural Hearing Impairment
  prompt: >-
    Why is sensorineural deafness frequent in ALG11-CDG and RFT1-CDG but unusual in the other congenital
    disorders of glycosylation?
  rationale: >-
    The proposed otoneurotoxicity of cytosolic LLO intermediates is a hypothesis from the clinical literature.
    Neither the cited patient studies nor their fibroblast assays establish accumulation in the inner
    ear or a causal cochlear injury pathway. Similar hearing impairment in RFT1-CDG motivates comparison
    but does not prove a shared toxic substrate.
  proposed_experiments:
  - experiment_id: exp_alg11_cochlear_phenotyping_mouse
    name: Cochlear phenotyping of an Alg11 hypomorphic mouse
    description: >-
      Measure auditory brainstem response thresholds and hair-cell survival in a hypomorphic Alg11 model,
      and test whether hearing loss tracks the accumulation of Man3/Man4GlcNAc2-PP-dolichol in cochlear
      tissue.
  - experiment_id: exp_alg11_cross_cdg_audiology
    name: Cross-CDG audiological comparison against LLO intermediate species
    description: >-
      Compare the prevalence and severity of sensorineural hearing loss across CDG types with the identity
      of the accumulating LLO intermediate, testing whether deafness segregates with the ALG11/RFT1 substrate
      rather than with hypoglycosylation severity generally.
- discussion_id: gap_neural_consequences_of_hypoglycosylation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Protein Hypoglycosylation
  prompt: >-
    Which glycoprotein-dependent cellular processes connect ALG11 dysfunction to cerebral growth arrest,
    tissue loss and epilepsy?
  rationale: >-
    Truncated LLO and GP130 hypoglycosylation are reproducible fibroblast observations. They do not directly
    demonstrate GP130 signaling failure, ER stress, apoptosis, defective neuronal migration or oligodendrocyte
    maturation in affected human brain. Those candidate processes require separate evidence before entering
    a causal chain.

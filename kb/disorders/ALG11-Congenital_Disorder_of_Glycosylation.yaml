      Improved diagnostics lead to identification of three new patients with congenital disorder of glycosylation-Ip.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we describe an improved metabolic labeling method that allowed the identification of three
      new CDG-Ip cases that were missed so far in routine diagnostics.
    explanation: >-
      Documents improved detection in the reported workflow, without an estimated clinical sensitivity.
    quote_role: PRIMARY_RESULT
- name: Molecular Genetic Testing
  description: >-
    A molecular diagnosis relies on biallelic pathogenic or likely pathogenic ALG11 variants in an appropriate
    clinical context. Exome sequencing or a suitable panel can identify sequence variants; deletion analysis
    and segregation testing resolve missing alleles or apparent homozygosity. Uncertain variants may require
    functional studies and should not alone establish the diagnosis.

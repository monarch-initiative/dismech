name: Pediatric Autoimmune Neuropsychiatric Disorders Associated with Streptococcal Infections
creation_date: "2026-07-25T00:00:00Z"
category: Autoimmune
description: >-
  Pediatric autoimmune neuropsychiatric disorders associated with streptococcal
  infections (PANDAS) is the streptococcus-triggered subset of pediatric
  acute-onset neuropsychiatric syndrome (PANS). It is defined by the abrupt,
  dramatic onset or episodic relapsing-remitting exacerbation of
  obsessive-compulsive disorder and/or a tic disorder in prepubertal children,
  temporally
  associated with group A beta-hemolytic streptococcal (GAS) infection and
  accompanied by additional neuropsychiatric signs such as anxiety, emotional
  lability, behavioral regression, and choreiform movements. The proposed
  mechanism is post-streptococcal molecular mimicry, in which antibodies raised
  against streptococcal antigens cross-react with neuronal targets in the basal
  ganglia (including dopamine receptors and lysoganglioside), activating
  calcium/calmodulin-dependent protein kinase II signaling and disrupting
  cortico-striato-thalamo-cortical circuits. PANDAS overlaps clinically and
  mechanistically with Sydenham chorea. Both the diagnostic construct and the
  strength of the streptococcal-autoimmune link remain debated, and there is no
  validated confirmatory biomarker.
disease_term:
  preferred_term: pediatric autoimmune neuropsychiatric disorders associated with streptococcal infections
  term:
    id: MONDO:0019020
    label: PANDAS
parents:
- Pediatric Acute-onset Neuropsychiatric Syndrome
- Autoimmune Disease
- Mental Health Disorder
pathophysiology:
- name: Post-streptococcal molecular mimicry
  biological_scale: MOLECULAR
  description: >-
    In a subset of children, group A streptococcal infection elicits antibodies
    that cross-react with neuronal antigens, proposed to reflect molecular
    mimicry between streptococcal epitopes and host brain proteins. This is the
    defining etiologic feature distinguishing PANDAS from the broader,
    trigger-agnostic PANS construct.
  downstream:
  - target: Anti-neuronal antibody targeting of the basal ganglia
    description: >-
      Cross-reactive antibodies are modeled upstream of basal ganglia dysfunction
      and the acute-onset neuropsychiatric phenotype.
  evidence:
  - reference: PMID:39325550
    reference_title: "Dopamine receptor autoantibody signaling in infectious sequelae differentiates movement versus neuropsychiatric disorders"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, the molecular mimicry hypothesis whereby microbes share antigens with host tissues such as the brain and lead to autoimmune sequelae is supported by our data in that microbial antigens were sufficient to remove AAb reactivity with D1R and D2R
    explanation: >-
      States the molecular mimicry hypothesis and the experimental result that
      supports it - microbial antigens competed away autoantibody reactivity
      with the dopamine receptors. This is the claim the node makes; the
      previous snippet on this node described only sudden-onset OCD and tics and
      never mentioned mimicry, antibodies, or cross-reactivity.
  - reference: PMID:26657857
    reference_title: "Group A Streptococcus intranasal infection promotes CNS infiltration by streptococcal-specific Th17 cells"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Group A streptococcal (GAS) infection induces the production of Abs that cross-react with host neuronal proteins, and these anti-GAS mimetic Abs are associated with autoimmune diseases of the CNS.
    explanation: >-
      States the cross-reactivity between streptococcal-induced antibodies and
      host neuronal proteins that the mimicry node asserts.
  - reference: PMID:34778136
    reference_title: "Diagnostic Approach to Pediatric Autoimmune Neuropsychiatric Disorders Associated With Streptococcal Infections (PANDAS): A Narrative Review of Literature Data"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pediatric autoimmune neuropsychiatric disorders associated with streptococcal infections (PANDAS) are clinical conditions characterized by the sudden onset of obsessive-compulsive disorder and/or tics, often accompanied by other behavioral symptoms in a group of children with streptococcal infection.
    explanation: >-
      The full definitional sentence, naming PANDAS as its subject and the
      streptococcal association. The earlier quote began mid-clause and dropped
      both.
- name: Anti-neuronal antibody targeting of the basal ganglia
  biological_scale: MOLECULAR
  description: >-
    Cross-reactive antibodies are proposed to bind neuronal targets in the basal
    ganglia (including dopamine D1/D2 receptors and lysoganglioside GM1) and
    activate calcium/calmodulin-dependent protein kinase II (CaMKII) signaling,
    disrupting cortico-striato-thalamo-cortical circuits and producing
    obsessive-compulsive symptoms, tics, and choreiform movements. This
    mechanism is shared with Sydenham chorea.
  downstream:
  - target: Acute-onset obsessive-compulsive behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Basal ganglia autoantibody activity is modeled upstream of the abrupt
      obsessive-compulsive phenotype.
  - target: Tics
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The tic phenotype, which the diagnostic criteria treat as the alternative
      cardinal presentation to OCD.
  - target: Anxiety
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      One of the associated neuropsychiatric symptoms accompanying flares.
  - target: Emotional lability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A second associated neuropsychiatric symptom from the same process.
  evidence:
  - reference: PMID:39325550
    reference_title: "Dopamine receptor autoantibody signaling in infectious sequelae differentiates movement versus neuropsychiatric disorders"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GAS-induced cross-reactive AAbs promote autoimmune encephalitis of the
      basal ganglia, a region of high dopamine receptor density
    explanation: >-
      Supports GAS-induced cross-reactive autoantibodies targeting dopamine
      receptors in the basal ganglia as a mechanism of post-streptococcal
      neuropsychiatric sequelae.
  - reference: PMID:39325550
    reference_title: "Dopamine receptor autoantibody signaling in infectious sequelae differentiates movement versus neuropsychiatric disorders"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group A streptococcal (GAS) infections can cause autoimmune sequelae
      characterized by movement disorders, such as Sydenham chorea, and
      neuropsychiatric disorders
    explanation: >-
      Establishes the shared post-streptococcal autoimmune basis of Sydenham
      chorea and related neuropsychiatric disorders.
- name: Th17-mediated CNS entry and blood-brain barrier breakdown
  biological_scale: CELLULAR
  description: >-
    A second, cellular arm of the post-streptococcal mechanism, separate from
    the humoral one. Repeated intranasal group A streptococcal challenge in mice
    drives streptococcus-specific Th17 cells from nasal-associated lymphoid
    tissue into the brain, with blood-brain barrier breakdown, serum IgG
    deposition, microglial activation and loss of excitatory synaptic proteins -
    and with no viable bacteria recoverable from CNS tissue. The affected
    regions are the olfactory bulb and its direct projection targets. This
    offers a route by which the cross-reactive antibodies of the mimicry node
    could reach their neuronal targets at all.
  downstream:
  - target: Anti-neuronal antibody targeting of the basal ganglia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Barrier breakdown and IgG deposition are modeled upstream of antibody
      engagement with neuronal targets, since intact barrier function would
      otherwise limit access. The intermediates are unstated because the mouse
      work does not trace the route to the basal ganglia specifically.
  evidence:
  - reference: PMID:26657857
    reference_title: "Group A Streptococcus intranasal infection promotes CNS infiltration by streptococcal-specific Th17 cells"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intranasal challenge of repeatedly GAS-inoculated mice promoted migration of GAS-specific Th17 cells from NALT into the brain, BBB breakdown, serum IgG deposition, microglial activation, and loss of excitatory synaptic proteins under conditions in which no viable bacteria were detected in CNS tissue.
    explanation: >-
      The experimental result this node describes, in mice.
  notes: >-
    Entirely mouse-derived. No cited source demonstrates Th17 CNS infiltration
    or barrier breakdown in a child with PANDAS, so this node states a proposed
    route rather than an observed one, and its downstream edge is marked
    indirect with unknown intermediates for that reason. It is included because
    the humoral arm on its own does not explain how antibodies reach neurons.

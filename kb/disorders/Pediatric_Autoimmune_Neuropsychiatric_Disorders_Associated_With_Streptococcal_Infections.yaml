name: Pediatric Autoimmune Neuropsychiatric Disorders Associated with Streptococcal Infections
creation_date: "2026-07-25T00:00:00Z"
category: Autoimmune
description: >-
  Pediatric autoimmune neuropsychiatric disorders associated with streptococcal
  infections (PANDAS) is the streptococcus-triggered subset of pediatric
  acute-onset neuropsychiatric syndrome (PANS). It is defined by the abrupt,
  dramatic onset or episodic relapsing-remitting exacerbation of obsessive-
  compulsive disorder and/or a tic disorder in prepubertal children, temporally
  associated with group A beta-hemolytic streptococcal (GAS) infection and
  accompanied by additional neuropsychiatric signs such as anxiety, emotional
  lability, behavioral regression, and choreiform movements. The proposed
  mechanism is post-streptococcal molecular mimicry, in which antibodies raised
  against streptococcal antigens cross-react with neuronal targets in the basal
  ganglia (including dopamine receptors and lysoganglioside), activating
  calcium/calmodulin-dependent protein kinase II signaling and disrupting
  cortico-striato-thalamo-cortical circuits. PANDAS overlaps clinically and
  mechanistically with Sydenham chorea. Both the diagnostic construct and the
  strength of the streptococcal-autoimmune link remain debated, and there is no
  validated confirmatory biomarker.

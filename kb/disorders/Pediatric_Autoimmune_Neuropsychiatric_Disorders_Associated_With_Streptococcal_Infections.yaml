pathophysiology:
- name: Post-streptococcal molecular mimicry
  description: >-
    In a subset of children, group A streptococcal infection elicits antibodies
    that cross-react with neuronal antigens, proposed to reflect molecular
    mimicry between streptococcal epitopes and host brain proteins. This is the
    defining etiologic feature distinguishing PANDAS from the broader,
    trigger-agnostic PANS construct.
  downstream:
  - target: Anti-neuronal antibody targeting of the basal ganglia
    description: >-
      Cross-reactive antibodies are modeled upstream of basal ganglia dysfunction
      and the acute-onset neuropsychiatric phenotype.
  evidence:
  - reference: PMID:34778136
    reference_title: "Diagnostic Approach to Pediatric Autoimmune Neuropsychiatric Disorders Associated With Streptococcal Infections (PANDAS): A Narrative Review of Literature Data"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are clinical conditions characterized by the sudden onset of
      obsessive-compulsive disorder and/or tics
    explanation: >-
      The narrative review describes PANDAS as sudden-onset OCD and/or tics
      following group A streptococcal infection, consistent with a
      post-streptococcal immune trigger.
- name: Anti-neuronal antibody targeting of the basal ganglia
  description: >-
    Cross-reactive antibodies are proposed to bind neuronal targets in the basal
    ganglia (including dopamine D1/D2 receptors and lysoganglioside GM1) and
    activate calcium/calmodulin-dependent protein kinase II (CaMKII) signaling,
    disrupting cortico-striato-thalamo-cortical circuits and producing
    obsessive-compulsive symptoms, tics, and choreiform movements. This
    mechanism is shared with Sydenham chorea.
  downstream:
  - target: Acute-onset OCD and tics
    description: >-
      Basal ganglia autoantibody activity is modeled upstream of the abrupt
      obsessive-compulsive and tic phenotype.
  evidence:
  - reference: PMID:39325550
    reference_title: "Dopamine receptor autoantibody signaling in infectious sequelae differentiates movement versus neuropsychiatric disorders"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GAS-induced cross-reactive AAbs promote autoimmune encephalitis of the
      basal ganglia, a region of high dopamine receptor density
    explanation: >-
      Supports GAS-induced cross-reactive autoantibodies targeting dopamine
      receptors in the basal ganglia as a mechanism of post-streptococcal
      neuropsychiatric sequelae.
  - reference: PMID:39325550
    reference_title: "Dopamine receptor autoantibody signaling in infectious sequelae differentiates movement versus neuropsychiatric disorders"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group A streptococcal (GAS) infections can cause autoimmune sequelae
      characterized by movement disorders, such as Sydenham chorea, and
      neuropsychiatric disorders
    explanation: >-
      Establishes the shared post-streptococcal autoimmune basis of Sydenham
      chorea and related neuropsychiatric disorders.
phenotypes:
- name: Acute-onset obsessive-compulsive behavior
  description: >-
    Abrupt onset or episodic relapsing exacerbation of obsessions and
    compulsions is a cardinal feature.
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      sudden-onset neuropsychiatric symptoms in children, which can include
      obsessive-compulsive disorder (OCD), tics, anxiety, emotional instability,
      and cognitive difficulties
    explanation: >-
      The 2024 Delphi consensus characterizes PANDAS/PANS by sudden-onset OCD,
      tics, and associated neuropsychiatric symptoms.
  phenotype_term:
    preferred_term: Compulsive behaviors
    term:
      id: HP:0000722
      label: Compulsive behaviors
- name: Tics
  description: >-
    Motor and/or vocal tics, of abrupt or episodic onset, are a cardinal
    feature and may co-occur with OCD.
  phenotype_term:
    preferred_term: Tics
    term:
      id: HP:0100033
      label: Tics
- name: Anxiety
  description: >-
    Acute anxiety, frequently including separation anxiety, is a common
    associated neuropsychiatric symptom.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
- name: Emotional lability
  description: >-
    Emotional lability and mood swings frequently accompany symptom flares.
  phenotype_term:
    preferred_term: Emotional lability
    term:
      id: HP:0000712
      label: Emotional lability
- name: Enuresis
  description: >-
    New-onset urinary frequency or enuresis is a recognized associated somatic
    sign.
  phenotype_term:
    preferred_term: Enuresis
    term:
      id: HP:0000805
      label: Enuresis
diagnosis:
- name: Clinical diagnostic criteria
  presence: >-
    Diagnosis is clinical, requiring presence of OCD and/or a tic disorder with
    prepubertal onset, an abrupt onset or episodic relapsing-remitting course,
    temporal association with group A streptococcal infection, and associated
    neurological abnormalities such as choreiform movements.
  diagnosis_term:
    preferred_term: clinical diagnosis
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment
  evidence:
  - reference: PMID:25325534
    reference_title: "Clinical evaluation of youth with pediatric acute-onset neuropsychiatric syndrome (PANS): recommendations from the 2013 PANS Consensus Conference."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the larger category of pediatric acute-onset neuropsychiatric syndrome
      (PANS)
    explanation: >-
      The PANS Consensus Conference frames PANDAS as a streptococcus-associated
      subset within the larger PANS category, informing the clinical diagnostic
      approach.

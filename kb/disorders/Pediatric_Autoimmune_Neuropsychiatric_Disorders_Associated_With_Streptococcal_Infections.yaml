diagnosis:
- name: Clinical diagnostic criteria
  presence: >-
    Diagnosis is clinical, requiring presence of OCD and/or a tic disorder with
    prepubertal onset, an abrupt onset or episodic relapsing-remitting course,
    temporal association with group A streptococcal infection, and associated
    neurological abnormalities such as choreiform movements.
  diagnosis_term:
    preferred_term: clinical diagnosis
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:25325534
    reference_title: "Clinical evaluation of youth with pediatric acute-onset neuropsychiatric syndrome (PANS): recommendations from the 2013 PANS Consensus Conference."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the larger category of pediatric acute-onset neuropsychiatric syndrome
      (PANS)
    explanation: >-
      The PANS Consensus Conference frames PANDAS as a streptococcus-associated
      subset within the larger PANS category, informing the clinical diagnostic
      approach.
animal_models:
- name: GAS-antigen-exposed Lewis rat model of streptococcal neuropsychiatric disease
  species: Rat
  genotype: wild-type
  background: Male Lewis rat
  publication: PMID:22534626
  description: >-
    Male Lewis rats immunised with group A streptococcal antigen develop
    compulsive-like grooming and motor abnormalities, striatal, thalamic and
    frontal-cortical IgG deposition, and altered dopamine and glutamate levels.
    Serum IgG reacts with tubulin and raises CaMKII signalling in neuronal
    cells, and the behavioural abnormalities respond to a D2 blocker and to an
    SSRI. It was built as a model of Sydenham chorea and related
    streptococcus-associated neuropsychiatric disorders.
  modeled_mechanisms:
  - target: Anti-neuronal antibody targeting of the basal ganglia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the core claim of this node in an animal: streptococcal
      exposure alone produces antibody deposition in basal ganglia and related
      structures, with the CaMKII signalling and D1/D2 receptor autoantibodies
      the node describes, and with behavioural consequences.
    limitations: >-
      Immunisation with streptococcal antigen plus adjuvant is not natural
      infection, and a rat's induced grooming is a behavioural analogue of
      compulsion rather than obsessive-compulsive disorder. The model was
      developed for Sydenham chorea, which shares the mechanism but not the
      PANDAS diagnostic criteria, and it says nothing about the prepubertal
      onset or streptococcal temporal association those criteria require.
    evidence:
    - reference: PMID:22534626
      reference_title: "Behavioral, Pharmacological, and Immunological Abnormalities after Streptococcal Exposure: A Novel Rat Model of Sydenham Chorea and Related Neuropsychiatric Disorders"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Streptococcal exposure resulted in antibody deposition in the striatum, thalamus, and frontal cortex, and concomitant alterations in dopamine and glutamate levels in cortex and basal ganglia, consistent with the known pathophysiology of SC and related neuropsychiatric disorders.
      explanation: >-
        The antibody deposition and neurotransmitter changes that make this
        model informative for the antibody node.
    - reference: PMID:22534626
      reference_title: "Behavioral, Pharmacological, and Immunological Abnormalities after Streptococcal Exposure: A Novel Rat Model of Sydenham Chorea and Related Neuropsychiatric Disorders"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Male Lewis rats exposed to GAS antigen exhibited motor symptoms (impaired food manipulation and beam walking) and compulsive behavior (increased induced-grooming).
      explanation: >-
        The behavioural readout produced by streptococcal antigen exposure.
    - reference: PMID:22534626
      reference_title: "Behavioral, Pharmacological, and Immunological Abnormalities after Streptococcal Exposure: A Novel Rat Model of Sydenham Chorea and Related Neuropsychiatric Disorders"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These symptoms were alleviated by the D2 blocker haloperidol and the selective serotonin reuptake inhibitor paroxetine, respectively, drugs that are used to treat motor symptoms and compulsions in streptococcal-related neuropsychiatric disorders.
      explanation: >-
        Pharmacological rescue with agents used clinically in this disease
        family, which is what raises the model above a phenotypic resemblance.
treatments:
- name: Anti-streptococcal Antibiotic Therapy
  description: >-
    Eradicating the group A streptococcal infection is the first therapeutic
    priority, with an initial 6-10 day course of amoxicillin, penicillin, or a
    cephalosporin where allergy is documented.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
  target_mechanisms:
  - target: Post-streptococcal molecular mimicry
    description: >-
      Removing the antigenic stimulus is the point at which antibiotic treatment
      acts on this entry's mechanism.
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Concerning GAS infections, an initial course with an effective treatment on GAS (amoxicillin, penicillin, cephalosporin in case of documented allergic reactions) for 6-10 days is recommended
    explanation: >-
      The consensus regimen for the streptococcal trigger.
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neuropsychiatric symptoms (especially the obsessive-compulsive ones) improve rapidly with an effective antibiotic treatment in eradicating the infection.
    explanation: >-
      States the claimed neuropsychiatric effect of eradicating the infection.
- name: Antibiotic Prophylaxis
  description: >-
    Long-term antibiotic prophylaxis is considered for severe PANDAS or repeated
    streptococcus-associated exacerbations, but the consensus is explicit that
    its effectiveness is not established and that no dosing schedule has been
    validated.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Antibiotic therapies in children with PANDAS are effective in eradicating the causative pathogen during the active phase of the infection, but further evidence is needed to determine its effectiveness in terms of prophylaxis.
    explanation: >-
      Records both the acute-phase effectiveness and the explicit uncertainty
      about prophylaxis, which is why this is a separate record from the acute
      antibiotic one.
- name: Cognitive Behavioral Therapy and SSRI
  description: >-
    Psychotherapeutic management, principally cognitive-behavioral therapy with
    low-dose SSRIs for the obsessive-compulsive symptoms.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Cognitive Behavior Therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CBT and other forms of psychotherapy have an important role especially in reducing the obsessive-compulsive neuro-psychiatric symptoms in patients with PANS or PANDAS.
    explanation: >-
      States the role of CBT in reducing the obsessive-compulsive symptoms.
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the psychiatric symptoms in these patients are usually treated with CBT and that the OCD generally respond well to SSRI at small doses
    explanation: >-
      Names low-dose SSRIs for the obsessive-compulsive symptoms.
differential_diagnoses:
- name: Sydenham chorea
  description: >-
    The other post-streptococcal neuropsychiatric disorder, sharing the
    anti-basal-ganglia antibody mechanism modeled in this entry.
  distinguishing_features:
  - >-
    Sydenham chorea presents with chorea and is a major criterion of acute
    rheumatic fever; PANDAS is defined by obsessive-compulsive symptoms and/or
    tics without requiring chorea or rheumatic fever. The dopamine-receptor
    autoantibody study cited here separates the two by D1R versus D2R
    reactivity rather than by mechanism class.
- name: Tourette Syndrome
  description: >-
    A primary chronic tic disorder of childhood.
  distinguishing_features:
  - >-
    Gradual onset and a chronic waxing-and-waning course without a temporal
    streptococcal association, where PANDAS requires abrupt or episodic onset
    linked in time to group A streptococcal infection.
- name: Pediatric Acute-onset Neuropsychiatric Syndrome
  description: >-
    The trigger-agnostic parent construct, of which this entry is the
    streptococcus-defined subset.
  distinguishing_features:
  - >-
    PANS requires neither a demonstrated streptococcal trigger nor prepubertal
    onset, and admits restricted eating as a cardinal presentation; PANDAS
    requires the streptococcal temporal association and prepubertal onset, and
    is defined on obsessive-compulsive symptoms and/or tics.
discussions:
- discussion_id: pandas_construct_contested
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Post-streptococcal molecular mimicry
  prompt: >-
    Is the streptococcal-autoimmune link specific enough to define a disease
    entity, or does PANDAS describe a temporal coincidence?
  rationale: >-
    The mechanism curated here rests on cross-reactive autoantibodies, and the
    supporting work is strongest in Sydenham chorea and in animal and in vitro
    systems. No cited source provides a confirmatory biomarker that separates a
    child with PANDAS from one with a primary tic or obsessive-compulsive
    disorder who happened to have a recent streptococcal infection. The
    narrative review cited here records that the diagnosis has been
    controversial since it was first defined in 1998. This is recorded as a
    structured controversy rather than left in prose because it bounds every
    causal claim in the entry.
notes: >-
  Three things about this entry are deliberate.

  First, **the mimicry node's evidence was replaced rather than supplemented.**
  It previously rested on a sentence describing sudden-onset OCD and tics, which
  says nothing about mimicry, antibodies, or cross-reactivity. The node now
  cites the experiment that supports the hypothesis directly - microbial
  antigens competing away autoantibody reactivity with D1R and D2R - plus the
  cross-reactivity statement from the Th17 paper.

  Second, **the Th17 node is entirely mouse-derived and says so.** It is
  included because the humoral arm alone does not explain how cross-reactive
  antibodies reach neurons, and the barrier-breakdown result is the only cited
  account of that step. Its own `notes` records that no human demonstration
  exists.

  Third, **`Enuresis` is deliberately unwired**, as in the PANS entry.

  Fourth, **choreiform movements are named in three places but deliberately not
  bound as a phenotype.** `HP:0002072` Chorea is frank chorea, and this entry
  distinguishes the two explicitly: the choreiform movements of PANDAS are
  low-amplitude piano-playing movements elicited on examination, which is what
  the diagnostic criteria mean, not the involuntary chorea of Sydenham chorea
  that the differential turns on. Binding `HP:0002072` would collapse the
  distinction the entry exists to draw. `runoak -i ols:hp search "choreiform"`
  returns exactly two terms, `HP:0007166` Paroxysmal dyskinesia and
  `HP:0002072` Chorea, neither of which is the elicited sign; `"piano playing
  movements"` returns nothing. So the sign is left unbound rather than
  approximated to a term that would assert frank chorea.

  Two references were repaired in the review round rather than dropped. This
  entry originally cited `DOI:10.1038/npp.2012.56` and `DOI:10.1172/JCI80792`,
  both of which cache with `content_type: unavailable` and an empty body, so
  nothing could ever have been quoted from either - which is why the review
  found them listed but unused. Both resolve to PubMed records with full text
  (`PMID:22534626` and `PMID:26657857`) and are now cited in that form, one as
  the `animal_models` entry and one as the Th17 node.

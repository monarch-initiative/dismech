notes: >-
  Not every family with the clinical picture carries LRP4 variants: LRP4 variants were found in 12 of 14 families in the
  study that identified the gene, and a consanguineous Saudi family with typical features and scoliosis was explained by
  a homozygous APC splice variant instead (PMID:25676610). Genomic rearrangements of the GREM1-FMN1 locus produce
  Cenani-Lenz-like oligosyndactyly, dominant with a 1.7 Mb duplication and recessive with an FMN1 deletion
  (PMID:20610440). These are treated here as differential diagnoses rather than as causes of this LRP4-defined entry.
  Other LRP4 phenotypes are allelic but mechanistically distinct: sclerosteosis 2 (impaired sclerostin facilitation, see
  Sclerosteosis), congenital myasthenic syndrome from third beta-propeller variants, and isolated 3/4 finger syndactyly
  from compound heterozygous fourth beta-propeller variants (PMID:29524275). Recurrent ketotic hypoglycaemia in two
  brothers homozygous for p.Cys1637Tyr (PMID:31895055) has not been reported in other patients and is not listed as a
  phenotype. A Notch-pathway contribution has been proposed from lrp4 knockdown zebrafish and cell assays
  (PMID:30327840) but has not been shown in the mammalian limb or kidney. No population prevalence figure from a primary
  source was used; reported families come mainly from consanguineous pedigrees.
pathophysiology:
- name: Biallelic LRP4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous germline LRP4 variants: mostly missense variants in the extracellular
    beta-propeller and LDL-receptor class B domains, plus splice, nonsense and frameshift alleles. Truncating alleles
    with no residual function give the most severe, sometimes prenatally lethal, presentations. The extracellular domain
    binds Wnt ligands; a beta1-propeller patient variant reduced Wnt11 binding.

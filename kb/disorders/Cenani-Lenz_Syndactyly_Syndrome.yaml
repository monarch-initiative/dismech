- name: Delayed Ureteric Bud Formation
  biological_scale: TISSUE
  description: >-
    In Lrp4 null mice the ureteric bud forms late, fails to bifurcate or upregulate c-Ret at its tip and does not invade
    the metanephric mesenchyme in time; Gdnf expression is then lost from the mesenchyme. Pax2 and baseline Ret and Gdnf
    expression are normal, placing the defect at the timing of budding.

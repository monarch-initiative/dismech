    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severity of the phenotype in a patient with absent residual LRP4 function may point to a genotype-phenotype
      correlation.
    explanation: A homozygous nonsense allele with no residual function produced a severe phenotype.
  - reference: PMID:28559208
    reference_title: Novel splice mutation in LRP4 causes severe type of Cenani-Lenz syndactyly syndrome with oro-facial and skeletal symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings not only further expand the phenotypic variability of CLSS but also indicate that early truncated
      and loss-of-function mutations in LRP4 lead to a more severe CLSS phenotype.
    explanation: Early-truncating splice allele in a five-generation family with severe disease.
  - reference: PMID:37640745
    reference_title: New mutation in the β1 propeller domain of LRP4 responsible for congenital myasthenic syndrome associated with Cenani-Lenz syndrome.
    supports: SUPPORT

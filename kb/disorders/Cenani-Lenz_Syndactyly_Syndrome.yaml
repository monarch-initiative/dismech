name: Cenani-Lenz Syndactyly Syndrome
description: >-
  Autosomal recessive congenital malformation syndrome of the distal limbs caused by biallelic germline loss-of-function
  variants in LRP4, a low-density lipoprotein receptor-related protein that antagonizes LRP5/LRP6-mediated canonical Wnt
  signaling. Complex, usually bilateral syndactyly and oligodactyly of the hands with carpal, metacarpal and phalangeal
  synostosis and disorganization are the defining features; radioulnar synostosis, mesomelic shortening and toe
  syndactyly are common, and the feet are less affected than the hands. Renal agenesis or hypoplasia is frequent, and a
  facial gestalt with prominent forehead, hypertelorism, downslanting palpebral fissures and micrognathia occurs in many
  patients. Expressivity ranges from isolated hand oligosyndactyly to a prenatally lethal form with limb reduction and
  bilateral renal agenesis, the severe end being associated with truncating alleles. In mice, loss of Lrp4 disrupts the
  apical ectodermal ridge of the limb bud and delays ureteric budding, which accounts for the limb and kidney
  malformations.
category: Mendelian

- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20381006
    reference_title: LRP4 mutations alter Wnt/beta-catenin signaling and cause limb and kidney malformations in Cenani-Lenz syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cenani-Lenz syndrome (CLS) is an autosomal-recessive congenital disorder affecting distal limb development.
    explanation: Recessive inheritance in the gene-identification families.
  - reference: PMID:31750994
    reference_title: Novel missense alteration in LRP4 gene underlies Cenani-Lenz syndactyly syndrome in a consanguineous family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger validation confirmed that all affected individuals were homozygous and the obligate carriers were
      heterozygous for this variant.
    explanation: Unaffected heterozygous obligate carriers and homozygous affected members.
diagnosis:
- name: Hand and Limb Radiography
  description: >-
    The diagnosis is clinical and radiographic. Radiographs of the hands and forearms define the synostoses, the number
    of metacarpals and digital rays and the disorganization of carpal and phalangeal elements; three-dimensional CT has
    been used to show the limb anomalies in detail. No formal diagnostic criteria have been published.
  diagnosis_term:
    preferred_term: hand and forearm radiography
    term:
      id: NCIT:C137876
      label: Bone Radiography
  evidence:
  - reference: PMID:38013226
    reference_title: A novel homozygous missense variant in LRP4 causing Cenani-Lenz syndactyly syndrome and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Standard X-ray showed that the both hands have only four metacarpal bones.
    explanation: Plain radiographs established the metacarpal reduction in a molecularly confirmed patient.
  - reference: PMID:31895055
    reference_title: Cenani-Lenz syndactyly in siblings with a novel homozygous LRP4 mutation and recurrent hypoglycaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We present 3D computed tomographic imaging illustrating the limb abnormalities in detail.
    explanation: CT used to characterize the limb malformations in two siblings.
- name: Prenatal Ultrasound
  description: >-
    Severe and lethal presentations with limb reduction (tetraphocomelia) and bilateral renal agenesis can be
    recognized antenatally.
  diagnosis_term:
    preferred_term: fetal ultrasound
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:33179409
    reference_title: "Lethal Cenani Lenz syndrome in two consecutive pregnancies: Further extension of phenotype from Maldives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in a fetus with lethal Cenani Lenz syndrome with antenatal presentation of tetraphocomelia and symmetrical
      involvement of hands and feet.
    explanation: Antenatal detection of the lethal form in an LRP4 frameshift homozygote.
- name: LRP4 Molecular Genetic Testing
  description: >-
    Confirmation by identifying biallelic LRP4 variants, either by targeted LRP4 sequencing when the phenotype is
    typical or by exome sequencing, which the literature recommends as a first-line test for syndactyly phenotypes and
    for prenatal diagnosis. Segregation testing of parents confirms recessive phase. A negative LRP4 result does not
    exclude the clinical diagnosis, since APC and GREM1-FMN1 alterations give similar phenotypes.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42153583
    reference_title: Targeted Genetic Testing Uncovers a Novel LRP4 Variant in Cenani-Lenz Syndactyly Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Based on the clinical suspicion of CLSS, targeted next-generation sequencing of the LRP4 gene was performed.
    explanation: Targeted LRP4 testing driven by the clinical picture.
  - reference: PMID:31750994
    reference_title: Novel missense alteration in LRP4 gene underlies Cenani-Lenz syndactyly syndrome in a consanguineous family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger validation confirmed that all affected individuals were homozygous and the obligate carriers were
      heterozygous for this variant.
    explanation: Family segregation testing confirms the recessive genotype.
- name: Exome Sequencing
  description: >-
    Exome sequencing has identified LRP4 variants in families where the phenotype overlaps other syndactyly syndromes and
    in a prenatally diagnosed case, and is proposed as the preferred first-line test for syndactyly phenotypes.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38013226
    reference_title: A novel homozygous missense variant in LRP4 causing Cenani-Lenz syndactyly syndrome and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      exome sequencing technology is a powerful tool for genetic analysis in prenatal diagnosis and medical research, as
      a preferred method for the diagnosis of syndactyly and related phenotypes.
    explanation: Authors' recommendation of exome sequencing for syndactyly diagnosis.
  - reference: PMID:31750994
    reference_title: Novel missense alteration in LRP4 gene underlies Cenani-Lenz syndactyly syndrome in a consanguineous family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES is a powerful tool for genetic analysis in research and can be readily used as a first-line diagnostic test in
      syndactyly and related phenotypes.
    explanation: Authors' recommendation of exome sequencing as a first-line test.
treatments:
- name: Digital Ray Individualization and Hand Reconstruction
  description: >-
    Surgical separation of digital rays with tendon transfers to create a functional grip. Evidence is a single surgical
    case report; outcomes are limited by the extent of bony fusion and disorganization.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: digital ray individualization surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Complex Finger Syndactyly
  evidence:
  - reference: PMID:15710123
    reference_title: "A variant of Cenani-Lenz syndactyly (CLS): review of the literature and attempt of classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our case, successful bilateral digital ray individualisation and tendon transfers were performed to construct a
      grip function of the grossly deformed hands.
    explanation: Single case of successful bilateral reconstruction.
- name: Acetylcholinesterase Inhibitor Therapy
  description: >-
    Tried for the myasthenic weakness in the single patient with combined CLS and congenital myasthenic syndrome
    (p.Tyr607Cys) without significant improvement.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Impaired Agrin-LRP4-MuSK Signaling at the Neuromuscular Junction
  evidence:
  - reference: PMID:37640745
    reference_title: New mutation in the β1 propeller domain of LRP4 responsible for congenital myasthenic syndrome associated with Cenani-Lenz syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient had clinically and electroneuromyographically demonstrated muscle weakness and fatigability associated with
      congenital malformations of the hands and feet and a horseshoe kidney, with no significant improvement of CMS
      symptoms with anticholinesterase treatments.
    explanation: No meaningful response in the one treated patient.
animal_models:
- name: Lrp4 (Megf7) null mouse
  species: Mouse
  genotype: Megf7/Lrp4 targeted null allele, homozygous
  publication: PMID:16207730
  description: >-
    Growth-retarded mice with fully penetrant fore- and hindlimb polysyndactyly, partially penetrant tooth abnormalities
    and an abnormal apical ectodermal ridge from embryonic day 9.5.
  modeled_mechanisms:
  - target: Abnormal Apical Ectodermal Ridge Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Mice develop polysyndactyly with digit duplication, whereas human patients mostly show oligosyndactyly; the ridge
      defect itself cannot be observed in human embryos.
    evidence:
    - reference: PMID:16207730
      reference_title: Abnormal development of the apical ectodermal ridge and polysyndactyly in Megf7-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous Megf7-deficient mice are growth-retarded, with fully penetrant polysyndactyly in their fore and hind
        limbs, and partially penetrant abnormalities of tooth development.
      explanation: Limb phenotype of the knockout.
- name: Lrp4 null mouse (kidney)
  species: Mouse
  genotype: Lrp4(-/-)
  publication: PMID:20454682
  description: >-
    Lrp4 null line in which 51% of postnatal animals had bilateral and 22% unilateral kidney agenesis, with delayed
    ureteric budding.
  modeled_mechanisms:
  - target: Delayed Ureteric Bud Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Complete null allele; most human alleles are missense with residual function, and human kidney involvement ranges
      from agenesis to hypoplasia and ectopia.
    evidence:
    - reference: PMID:20454682
      reference_title: Lrp4 regulates initiation of ureteric budding and is crucial for kidney formation--a mouse model for Cenani-Lenz syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Lrp4(-/-) mice show a delay in ureteric bud formation that results in unilateral or bilateral kidney agenesis.
      explanation: Reproduces the human kidney malformation and shows its developmental basis.
- name: Lrp4 dan and mdig mutant mice
  species: Mouse
  genotype: Spontaneous recessive Lrp4 alleles dan and mdig, homozygous
  publication: PMID:16517118
  description: Two spontaneous recessive mouse mutations causing polysyndactyly, positionally cloned to Lrp4.
  modeled_mechanisms:
  - target: Defective Digit Separation and Autopod Skeletal Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: Polysyndactyly rather than the oligosyndactyly typical of patients.
    evidence:
    - reference: PMID:16517118
      reference_title: Mutations in the gene encoding the low-density lipoprotein receptor LRP4 cause abnormal limb development in the mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Positional cloning of two recessive mutations of the mouse that cause polysyndactyly (dan and mdig-Chr 2)
        confirmed that the gene encoding MEGF7/LRP4, a member of the low-density lipoprotein receptor family, plays an
        essential role in the process of digit differentiation.
      explanation: Independent spontaneous alleles give digit fusion.
- name: Bovine mulefoot (syndactyly)
  species: Cattle
  genotype: LRP4 intron 37 splice donor G>A, homozygous
  publication: PMID:16963222
  description: >-
    Naturally occurring autosomal recessive syndactyly (fused digits) of cattle caused by an LRP4 splice variant that
    predicts a receptor lacking its cytoplasmic domain.
  modeled_mechanisms:
  - target: Defective Digit Separation and Autopod Skeletal Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Artiodactyl distal limb with two main digits; renal and craniofacial involvement are not described in the source.
    evidence:
    - reference: PMID:16963222
      reference_title: Defective splicing of Megf7/Lrp4, a regulator of distal limb development, in autosomal recessive mulefoot disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings confirm that autosomal recessive loss-of-function mutations in Megf7/Lrp4 result in phenotypically
        similar forms of syndactyly in different mammalian species and that such mutations are the cause of MFD in
        bovines.
      explanation: Cross-species conservation of LRP4 loss-of-function syndactyly.
experimental_models:
- name: Patient-derived myotubes (LRP4 p.Tyr607Cys)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary myoblasts from the muscle biopsy of the patient with combined CLS and congenital myasthenic syndrome,
    differentiated into myotubes and treated with neural agrin or Wnt11.
  publication: PMID:37640745
  modeled_mechanisms:
  - target: Impaired Agrin-LRP4-MuSK Signaling at the Neuromuscular Junction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      One patient and one allele; cultured myotubes lack the nerve terminal, so the synapse itself is not modeled.
    evidence:
    - reference: PMID:37640745
      reference_title: New mutation in the β1 propeller domain of LRP4 responsible for congenital myasthenic syndrome associated with Cenani-Lenz syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        A decrease of 85% with agrin and 55% with Wnt11 of aggregates was observed in patient-derived myotubes compared
        with control
      explanation: Reduced acetylcholine receptor aggregation in patient cells.
- name: LRP6-dependent Wnt luciferase reporter assay
  experimental_model_type: CELL_LINE
  description: Cultured cells co-transfected with LRP6 and wild-type or patient-variant LRP4 and a canonical Wnt reporter.
  publication: PMID:34857885
  modeled_mechanisms:
  - target: Loss of LRP4 Antagonism of Canonical Wnt Signaling
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: Overexpression in a heterologous cell system; not limb-bud ectoderm or ureteric bud.
    evidence:
    - reference: PMID:34857885
      reference_title: Novel variants in the LRP4 underlying Cenani-Lenz Syndactyly syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Wild type LRP4 was able to inhibit LRP6-dependent WNT signaling robustly. The two mutants p.(Asp99His) and
        p.(Arg545Trp) inhibited WNT signaling less effectively, suggesting they reduced LRP4 function.
      explanation: Quantifies loss of Wnt antagonism by patient alleles.

- name: Abnormal Apical Ectodermal Ridge Signaling
  biological_scale: TISSUE
  description: >-
    The apical ectodermal ridge at the distal edge of the limb bud is the main site of Lrp4 expression. In Lrp4-deficient
    mice it forms abnormally from embryonic day 9.5, with ectopic expression and aberrant signaling of Fgf8, Shh, Bmp2,
    Bmp4 and Wnt7a and of the Wnt- and Bmp-responsive factors Lmx1b and Msx1, reduced apoptosis, and dorsal and ventral
    expansion of the ridge.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cenani-Lenz syndrome (CLS) is an autosomal-recessive congenital disorder affecting distal limb development. It is
      characterized mainly by syndactyly and/or oligodactyly
    explanation: Syndactyly is a principal feature in the gene-identification series.
  - reference: PMID:28559208
    reference_title: Novel splice mutation in LRP4 causes severe type of Cenani-Lenz syndactyly syndrome with oro-facial and skeletal symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe a consanguineous Pakistani kindred with a severe form of CLSS characterized by complete syndactyly
      and disorganization of fingers, oligo-syndactyly of toes, shortening of limbs, frontal bossing, and
      hypoplasia/agenesis of left kidney.
    explanation: Complete finger syndactyly in an LRP4 splice-variant family.

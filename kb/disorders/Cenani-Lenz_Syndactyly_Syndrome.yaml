- name: Loss of LRP4 Antagonism of Canonical Wnt Signaling
  biological_scale: MOLECULAR
  description: >-
    LRP4 normally restrains LRP5/LRP6-dependent activation of canonical Wnt/beta-catenin signaling. Patient missense
    proteins lose this activity in reporter assays, and several fail to reach the plasma membrane normally, consistent
    with misfolding of the extracellular domain. The result is excess canonical Wnt signaling in tissues where LRP4 acts,
    including the limb-bud ectoderm and the ureteric bud.

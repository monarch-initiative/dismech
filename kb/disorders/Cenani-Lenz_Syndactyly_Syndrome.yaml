genetic:
- name: LRP4
  gene_term:
    preferred_term: LRP4
    term:
      id: hgnc:6696
      label: LRP4
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic germline variants, homozygous in most reported families (largely consanguineous) and compound heterozygous
    in some. LRP4 variants were found in 12 of 14 families in the gene-identification study. Missense variants in the
    extracellular domain predominate; nonsense, frameshift and early-truncating splice alleles are associated with the
    severe and prenatally lethal end of the spectrum.
  evidence:
  - reference: PMID:20381006
    reference_title: LRP4 mutations alter Wnt/beta-catenin signaling and cause limb and kidney malformations in Cenani-Lenz syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used a homozygosity-mapping approach to map the CLS1 locus to chromosome 11p11.2-q13.1. By sequencing candidate
      genes, we identified recessive LRP4 mutations in 12 families with CLS.
    explanation: Identification of LRP4 as the disease gene.
  - reference: PMID:25676610
    reference_title: A novel APC mutation defines a second locus for Cenani-Lenz syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      LRP4 mutations were identified in most, but not all patients with this syndrome, suggesting the presence of at
      least one additional locus.
    explanation: LRP4 explains most but not all clinically diagnosed families.
  variants:
  - name: c.2858T>C p.Leu953Pro
    description: >-
      Homozygous in a consanguineous Pakistani pedigree with nine affected members whose disease was restricted to the
      limbs and kidneys.
    evidence:
    - reference: PMID:23664847
      reference_title: Cenani-Lenz syndrome restricted to limb and kidney anomalies associated with a novel LRP4 missense mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic analysis using autozygosity mapping and sequencing revealed homozygosity for a novel missense mutation
        c.2858T > C (p.L953P) in the LRP4 gene.
      explanation: Segregating homozygous missense variant.
  - name: c.316+1G>A
    description: >-
      Homozygous canonical splice-donor variant predicted to truncate the protein early; severe CLSS with short stature,
      cleft lip and kidney hypoplasia or agenesis in a five-generation family.
    evidence:
    - reference: PMID:28559208
      reference_title: Novel splice mutation in LRP4 causes severe type of Cenani-Lenz syndactyly syndrome with oro-facial and skeletal symptoms.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A novel splice variant in LRP4 (c.316+1G > A) segregated with the phenotype in a five generations family.
      explanation: Segregation of the splice variant.
  - name: c.295G>C p.Asp99His and c.1633C>T p.Arg545Trp
    description: >-
      Two homozygous missense variants in Pakistani families; both reduce LRP4 inhibition of LRP6-dependent Wnt
      signaling in a reporter assay.
    evidence:
    - reference: PMID:34857885
      reference_title: Novel variants in the LRP4 underlying Cenani-Lenz Syndactyly syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The two mutants p.(Asp99His) and p.(Arg545Trp) inhibited WNT signaling less effectively, suggesting they reduced
        LRP4 function.
      explanation: Functional evidence for the two alleles.
  - name: c.1820A>G p.Tyr607Cys
    description: >-
      Homozygous beta1-propeller variant in a patient with CLS limb and kidney malformations plus congenital myasthenic
      syndrome; reduces agrin and Wnt11 binding.
    evidence:
    - reference: PMID:37640745
      reference_title: New mutation in the β1 propeller domain of LRP4 responsible for congenital myasthenic syndrome associated with Cenani-Lenz syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In this study, we demonstrated that p.Tyr607Cys mutation in the β1 propeller domain of LRP4 affected its capacity
        to bind agrin and Wnt11 in vitro.
      explanation: Ligand-binding effect of the allele.

- name: Impaired Agrin-LRP4-MuSK Signaling at the Neuromuscular Junction
  biological_scale: CELLULAR
  description: >-
    LRP4 is the muscle receptor for neural agrin and activates MuSK to cluster acetylcholine receptors. The
    beta1-propeller p.Tyr607Cys protein reaches the plasma membrane and binds MuSK normally, but binds agrin and Wnt11
    less, and agrin-induced MuSK phosphorylation is reduced. Patient myotubes formed fewer and smaller agrin- and
    Wnt11-induced acetylcholine receptor clusters. Most CLSS alleles have not been tested for this function and most
    patients have no neuromuscular symptoms.
  cell_types:
  - preferred_term: myotube
    term:
      id: CL:0002372
      label: myotube
  biological_processes:
  - preferred_term: skeletal muscle acetylcholine-gated channel clustering
    modifier: DECREASED
    term:
      id: GO:0071340
      label: skeletal muscle acetylcholine-gated channel clustering
  evidence:
  - reference: PMID:37640745
    reference_title: New mutation in the β1 propeller domain of LRP4 responsible for congenital myasthenic syndrome associated with Cenani-Lenz syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistic expression studies show a significant decrease of AChR aggregation in cultured patient myotubes, as
      well as altered in vitro binding of agrin and Wnt11 ligands to the mutated β1 propeller domain of LRP4 explaining
      the dual phenotype characterized clinically and electoneuromyographically in the patient.
    explanation: Patient myotube clustering assay and ligand-binding assays.
  downstream:
  - target: Fatigable Weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37640745
      reference_title: New mutation in the β1 propeller domain of LRP4 responsible for congenital myasthenic syndrome associated with Cenani-Lenz syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our study highlights that a mutation in the β1 propeller domain of LRP4 alters its binding to agrin leading to
        neurotransmission defects whereas mutations described so far in this domain are exclusively reported to be
        responsible for CLS with limb and kidney malformations without neuromuscular defects
      explanation: Links the binding defect to the patient's neuromuscular transmission defect.
phenotypes:
- category: Musculoskeletal
  name: Complex Finger Syndactyly
  description: >-
    Usually bilateral complete osseous and cutaneous fusion of the fingers, classically a spoon- or mitten-shaped hand,
    the defining feature of the syndrome. Hands are more severely affected than feet.
  phenotype_term:
    preferred_term: Complex finger syndactyly

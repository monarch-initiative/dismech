  - reference: PMID:29201043
    reference_title: Clinical and Genetic Review of Hereditary Acral Reticulate Pigmentary Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: examination of the hyperpigmented areas under electron microscopy shows a significant number
      of melanocytes in the basal layer and melanosomes in the keratinocyte cytoplasm
    explanation: Ultrastructure of patient lesions shows increased basal melanocytes and keratinocyte

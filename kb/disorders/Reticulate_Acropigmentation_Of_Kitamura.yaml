  downstream:
  - target: Reticular hyperpigmentation
    description: Local melanocyte expansion and increased basal melanin produce the reticulate acral macules.
    evidence:
    - reference: PMID:29201043
      reference_title: Clinical and Genetic Review of Hereditary Acral Reticulate Pigmentary Disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: On light microscopy, hyperpigmented lesions show thinning and elongation of the rete ridges

  - reference: PMID:3994414
    reference_title: Behavior of melanocytes in reticulate acropigmentation of Kitamura.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is concluded that the hyperpigmentation of RAPK is due to increased number of active melanocytes

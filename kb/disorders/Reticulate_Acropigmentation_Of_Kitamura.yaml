      An update.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: We speculate that the pathogenesis of RAK and Dowling-Degos disease (DDD, a pigmentary disease
      similar to RAK) is associated with the Notch signaling pathway.
    explanation: The authors who identified the gene propose Notch signaling as the link, explicitly as
      speculation.
  - reference: PMID:21205794
    reference_title: The disintegrin/metalloproteinase Adam10 is essential for epidermal integrity and
      Notch-mediated signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: Notch processing is indeed strongly reduced resulting in decreased levels of Notch intracellular
      domain fragment and functional Notch signaling.
    explanation: Measured in epidermis of K14-Cre Adam10-deleted mice, a homozygous deletion that is far
      more severe than the human heterozygous state.
  downstream:
  - target: Epidermal Melanocyte Expansion
    description: Disturbed Notch signaling is proposed to alter the maintenance of epidermal melanocytes.
      The direct step from Notch processing to melanocyte number has not been shown in this disorder.

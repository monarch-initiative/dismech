treatments:
- name: Q-switched laser therapy
  description: Q-switched lasers (532-nm Nd:YAG, 755-nm alexandrite) have lightened the hyperpigmented
    macules in single case reports. No treatment is established, and laser therapy removes pigment without
    acting on the underlying ADAM10 defect.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Q-switched laser therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  evidence:
  - reference: PMID:25473245

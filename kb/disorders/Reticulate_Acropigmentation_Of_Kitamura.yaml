  - reference: PMID:22834956
    reference_title: Adam10 haploinsufficiency causes freckle-like macules in Hairless mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The Pied macules require Hairless(Hr) homozygosity to form and are composed of localized clusters

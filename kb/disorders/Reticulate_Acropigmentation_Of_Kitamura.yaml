histopathology:
- name: Thinned elongated rete ridges with basal hypermelanosis
  description: Thinning and elongation of rete ridges, hyperkeratosis without parakeratosis, and increased
    basal melanin without pigment incontinence. The absence of pigment incontinence distinguishes it from
    the other acral reticulate pigmentary disorders.
  evidence:
  - reference: PMID:29201043
    reference_title: Clinical and Genetic Review of Hereditary Acral Reticulate Pigmentary Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: On light microscopy, hyperpigmented lesions show thinning and elongation of the rete ridges
      along with hyperkeratosis without parakeratosis and increased melanin pigment in the basal layer
      of the epidermis without pigment incontinence
    explanation: Summarizes the lesional light-microscopic findings.
treatments:
- name: Q-switched laser therapy
  description: Q-switched lasers (532-nm Nd:YAG, 755-nm alexandrite) have lightened the hyperpigmented
    macules in single case reports. No treatment is established, and laser therapy removes pigment without
    acting on the underlying ADAM10 defect.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Q-switched laser therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  evidence:
  - reference: PMID:25473245
    reference_title: 'A Case of Reticulate Acropigmentation of Kitamura Treated with 532-nm Q-Switched
      Nd:YAG Laser: 10 Years of Follow-Up Observation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In our case, the successful depigmentation with 532-nm QSND was made without a significant
      adverse reaction.
    explanation: Single case with lasting depigmentation after 532-nm Q-switched Nd:YAG laser.
  - reference: PMID:29201043
    reference_title: Clinical and Genetic Review of Hereditary Acral Reticulate Pigmentary Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The literature does not provide a consensus regarding the best therapeutic approach for RAPK.
    explanation: No treatment is established; laser reports are isolated cases.
differential_diagnoses:
- name: Dowling-Degos disease
  description: Reticulate pigmentary genodermatosis with flexural rather than acral predominance, caused
    by KRT5, POFUT1, POGLUT1 or PSENEN variants. Overlap cases with features of both disorders are reported,
    and the two were once considered one disease, but ADAM10-positive patients lack KRT5 variants.
  disease_term:
    preferred_term: Dowling-Degos disease
    term:
      id: MONDO:0008371
      label: Dowling-Degos disease
  distinguishing_features:
  - Acral (dorsal hands and feet) rather than flexural distribution.
  - Palmoplantar pits and breaks in dermatoglyphics.
  - Different causal genes (ADAM10 versus KRT5 or Notch-glycosylation genes).
  evidence:
  - reference: PMID:26955585
    reference_title: 'Dowling-Degos disease with reticulate acropigmentation of Kitamura: Extended spectrum
      of a single entity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Rebora and Crovato in 1983 first suspected that DDD and RAK were different phenotypic expressions
      of the same disease on the basis of their striking clinical and histopathological similarities.
    explanation: Documents the long-standing clinical overlap between the two disorders.
  - reference: PMID:23666529
    reference_title: Whole-exome sequencing identifies ADAM10 mutations as a cause of reticulate acropigmentation
      of Kitamura, a clinical entity distinct from Dowling-Degos disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We searched for mutations in the KRT5 gene, a causative gene for the similar pigmentation
      disorder Dowling-Degos disease (DDD), in all the patients and found no KRT5 mutation.
    explanation: The patients with ADAM10 variants carried no KRT5 variants, separating the two genetically.

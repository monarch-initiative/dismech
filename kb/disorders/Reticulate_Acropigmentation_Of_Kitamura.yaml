    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: A dominant Adam10 loss-of-function allele produces freckle-like macules made of clusters
      of epidermal melanocytes.
    limitations: >-
      The macules form only on a Hairless (Hr/Hr) homozygous background, which itself causes epidermal
      pigmentation in aging mice, and the model was not reported to show acral distribution or palmoplantar
      pits.
    model_scale: TISSUE
    evidence:
    - reference: PMID:22834956
      reference_title: Adam10 haploinsufficiency causes freckle-like macules in Hairless mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The Pied macules require Hairless(Hr) homozygosity to form and are composed of localized
        clusters of epidermal melanocytes.
      explanation: Shows that the model's lesions are melanocyte clusters and that they depend on the Hairless
        background.
- name: Epidermal Adam10 knockout mouse (K14-Cre)
  species: Mouse
  genotype: Adam10 homozygous conditional deletion in epidermis (K14-Cre)
  publication: PMID:21205794
  modeled_mechanisms:
  - target: Impaired Notch Receptor Processing in Epidermis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Complete epidermal loss of Adam10 strongly reduces Notch processing and Notch signaling.
    limitations: >-
      The deletion is homozygous, whereas patients carry one defective ADAM10 copy, and the mice die
      perinatally with barrier failure and absent sebaceous glands. No pigmentary phenotype resembling the
      human acral reticulate hyperpigmentation was reported.
    model_scale: TISSUE
    evidence:
    - reference: PMID:21205794
      reference_title: The disintegrin/metalloproteinase Adam10 is essential for epidermal integrity and
        Notch-mediated signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Notch processing is indeed strongly reduced resulting in decreased levels of Notch intracellular
        domain fragment and functional Notch signaling.
      explanation: Shows that the model measures the Notch-processing defect proposed for the human disorder.

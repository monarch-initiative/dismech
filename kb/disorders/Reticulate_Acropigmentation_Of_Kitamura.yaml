diagnosis:
- name: Molecular Genetic Testing
  description: Clinical features overlap with other hereditary reticulate pigmentary disorders, so the
    diagnosis is confirmed by identifying a heterozygous pathogenic ADAM10 variant. Testing also separates
    the disorder from Dowling-Degos disease (KRT5, POFUT1, POGLUT1, PSENEN) and dyschromatosis symmetrica
    hereditaria (ADAR1).
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Heterozygous truncating, splice-site or missense variant in ADAM10.
  evidence:
  - reference: PMID:29201043
    reference_title: Clinical and Genetic Review of Hereditary Acral Reticulate Pigmentary Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: However, each of these hereditary conditions possesses a unique genetic mutation, and genetic
      analysis is thus more useful in the diagnosis of these conditions.
    explanation: Genetic analysis distinguishes the hereditary acral reticulate pigmentary disorders, which
      overlap clinically.
  - reference: PMID:23666529
    reference_title: Whole-exome sequencing identifies ADAM10 mutations as a cause of reticulate acropigmentation
      of Kitamura, a clinical entity distinct from Dowling-Degos disease.

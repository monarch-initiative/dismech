name: Reticulate Acropigmentation Of Kitamura
creation_date: '2026-10-27T00:00:00Z'
description: Reticulate acropigmentation of Kitamura is a rare autosomal dominant pigmentary genodermatosis
  with high penetrance. Slightly depressed, angulated, freckle-like hyperpigmented macules in a reticulate
  pattern appear on the dorsa of the hands and feet before puberty, then spread to the proximal limbs
  and trunk and darken with time and sun exposure. Palmoplantar pits and breaks in the dermatoglyphic
  pattern are characteristic, and hypopigmented macules are absent. It is caused by heterozygous truncating,
  splice-site or missense variants in ADAM10, which encodes the zinc metalloprotease responsible for ectodomain
  shedding of membrane substrates in the skin, including Notch receptors. Lesional skin shows thinned,
  elongated rete ridges and increased basal melanin, with more basal melanocytes than perilesional skin.
  A dominant Adam10 loss-of-function mouse allele produces freckle-like clusters of epidermal melanocytes,
  supporting a role for ADAM10 in restraining melanocyte expansion. The disorder overlaps clinically with
  Dowling-Degos disease, but the two are genetically distinct.

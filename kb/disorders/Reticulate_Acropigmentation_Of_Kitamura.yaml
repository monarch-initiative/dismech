      An update.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: We speculate that the pathogenesis of RAK and Dowling-Degos disease (DDD, a pigmentary disease
      similar to RAK) is associated with the Notch signaling pathway.
    explanation: The authors who identified the gene propose Notch signaling as the link, explicitly as
      speculation.
  downstream:
  - target: Epidermal Melanocyte Expansion
    description: Disturbed Notch signaling is proposed to alter the maintenance of epidermal melanocytes.
      The direct step from Notch processing to melanocyte number has not been shown in this disorder.
    evidence:
    - reference: PMID:30692041
      reference_title: 'Dyschromatosis symmetrica hereditaria and reticulate acropigmentation of Kitamura:

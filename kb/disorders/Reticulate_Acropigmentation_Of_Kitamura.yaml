genetic:
- name: ADAM10
  gene_term:
    preferred_term: ADAM10
    term:
      id: hgnc:188
      label: ADAM10
  association: Causative
  relationship_type: CAUSATIVE
  notes: Heterozygous truncating (nonsense and frameshift), splice-site and missense variants in ADAM10
    cause the disorder; the spectrum, dominated by truncating alleles, points to loss of function. No
    ClinGen gene-disease validity tier is recorded here, so gene_disease_validity is left absent.
  evidence:
  - reference: PMID:23666529
    reference_title: Whole-exome sequencing identifies ADAM10 mutations as a cause of reticulate acropigmentation
      of Kitamura, a clinical entity distinct from Dowling-Degos disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a total of three truncating mutations, a splice site mutation and a missense
      mutation in ADAM10.
    explanation: Exome sequencing of one pedigree plus Sanger sequencing of four unrelated patients identified
      five ADAM10 variants, mostly truncating.
  - reference: PMID:23666529
    reference_title: Whole-exome sequencing identifies ADAM10 mutations as a cause of reticulate acropigmentation
      of Kitamura, a clinical entity distinct from Dowling-Degos disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results reveal that mutations in ADAM10 are a cause of RAK and that RAK is an independent
      clinical entity distinct from DDD.
    explanation: Establishes ADAM10 as the causal gene.
pathophysiology:
- name: ADAM10 Loss of Function
  description: Heterozygous truncating, splice-site and missense ADAM10 variants reduce ADAM10 metalloprotease
    activity in the skin. ADAM10 carries out the ectodomain shedding of many membrane proteins in the
    epidermis.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ADAM10
    term:
      id: hgnc:188
      label: ADAM10
  biological_processes:
  - preferred_term: membrane protein ectodomain proteolysis
    term:
      id: GO:0006509
      label: membrane protein ectodomain proteolysis
    modifier: DECREASED
  evidence:
  - reference: PMID:23666529
    reference_title: Whole-exome sequencing identifies ADAM10 mutations as a cause of reticulate acropigmentation
      of Kitamura, a clinical entity distinct from Dowling-Degos disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ADAM10 is known to be involved in the ectodomain shedding of various substrates in the skin.
    explanation: Identifies the cutaneous function of the protein encoded by the causal gene.
    directness: INDIRECT
  - reference: PMID:22834956
    reference_title: Adam10 haploinsufficiency causes freckle-like macules in Hairless mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Through linkage analysis, we find that the Pied mutation is a 1914 base pair loss-of-function
      deletion in the Adam10 zinc metalloprotease gene.
    explanation: A heterozygous loss-of-function Adam10 allele in mice is sufficient for a dominant pigmentary
      phenotype, consistent with haploinsufficiency.
  downstream:
  - target: Impaired Notch Receptor Processing in Epidermis
    description: Notch receptors are among the ADAM10 substrates in the skin, so reduced ADAM10 activity
      is proposed to reduce Notch ectodomain cleavage.
    evidence:
    - reference: PMID:30692041
      reference_title: 'Dyschromatosis symmetrica hereditaria and reticulate acropigmentation of Kitamura:
        An update.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: ADAM10 is known to be involved in the ectodomain shedding of Notch proteins as substrates
        in the skin.
      explanation: The review identifies Notch receptors as cutaneous ADAM10 substrates.
  - target: Epidermal Melanocyte Expansion
    description: Loss of ADAM10 removes a restraint on melanocyte expansion in adult skin.
    evidence:
    - reference: PMID:22834956
      reference_title: Adam10 haploinsufficiency causes freckle-like macules in Hairless mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We have identified Adam10 as an inhibitor of melanocyte expansion in adult skin.
      explanation: In the mouse model, Adam10 loss leads to melanocyte expansion.
- name: Impaired Notch Receptor Processing in Epidermis
  description: Reduced ADAM10-mediated cleavage of Notch receptors is the proposed link between ADAM10
    variants and the pigmentary phenotype. This is a hypothesis rather than a measured defect in patient
    skin. It would connect this disorder to Dowling-Degos disease, whose POFUT1, POGLUT1 and PSENEN forms
    also act on Notch processing.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Notch receptor processing
    term:
      id: GO:0007220
      label: Notch receptor processing
    modifier: DECREASED
  cell_types:

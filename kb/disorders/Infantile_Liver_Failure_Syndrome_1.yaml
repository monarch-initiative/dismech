treatments:
- name: Maintain Protein and Glucose Intake During Illness
  description: >-
    The counter-intuitive management point, and the one most likely to be got
    wrong. In metabolic hepatopathies the reflex is to reduce or stop protein
    intake; the ILFS1 clinical series argues this is inappropriate here and
    recommends ensuring sufficient natural protein intake when unwell. The
    mechanistic rationale is that the lesion is a failure to CHARGE and USE amino
    acids, not a failure to clear them, so substrate restriction removes supply
    without relieving the block. The MRI study independently recommends sufficient
    glucose and protein alongside proactive fever management.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Febrile Decompensation of Residual Charging Capacity
    description: >-
      Maintaining substrate supply and limiting fever address the two components
      proposed to precipitate decompensation.
  evidence:
  - reference: PMID:25917789
    reference_title: "Clinical and genetic characterisation of infantile liver failure syndrome type 1, due to recessive mutations in LARS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we suggest that the traditional management of reducing/stopping protein intake in patients with metabolic hepatopathies may not be appropriate for ILFS1. We currently recommend ensuring sufficient natural protein intake when unwell."
    explanation: The explicit clinical recommendation against protein restriction, from the cohort that defined the phenotype.
  - reference: PMID:38951950
    reference_title: "MRI in LARS1 deficiency-Spectrum, patterns, and correlation with acute neurological deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "thus, sufficient glucose and protein intake along with pro-active fever management is suggested"
    explanation: Independent recommendation of substrate maintenance plus fever control from the imaging cohort.
- name: Seasonal Influenza Vaccination
  description: >-
    Because decompensation is infection-triggered and severe episodes were
    specifically observed during influenza infections, the imaging cohort makes a
    strong recommendation for seasonal vaccination. This is a rare case of a
    mechanism-derived preventive intervention in an ARS deficiency: it does not
    touch the enzyme, it removes the trigger.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Febrile Decompensation of Residual Charging Capacity
    description: >-
      Preventing a febrile illness prevents the trigger that precipitates hepatic
      and encephalopathic crises.
  evidence:
  - reference: PMID:38951950
    reference_title: "MRI in LARS1 deficiency-Spectrum, patterns, and correlation with acute neurological deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As severe episodes were observed during influenza infections, we strongly recommend seasonal vaccination."
    explanation: The observation and the recommendation, stated together by the authors.
- name: Liver Transplantation
  description: >-
    The definitive intervention for irreversible hepatic failure, and part of the
    hard outcome measure in this disease - 12 of 36 reported patients died or
    underwent liver transplantation.
    It carries a mechanistic caveat this entry treats as important rather than
    incidental: LARS1 deficiency is systemic, so replacing the liver does not
    correct the enzyme defect elsewhere. Encephalopathy occurred in one individual
    AFTER transplantation. Transplantation should therefore be understood as
    treating the organ that fails first, not the disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Recurrent Hepatocellular Injury and Acute Liver Failure
    description: >-
      Replaces the organ whose protein-synthetic failure produces the
      life-threatening episodes, without addressing the charging defect in other
      tissues.
  evidence:
  - reference: PMID:38844943
    reference_title: Early onset and liver failure indicating poor prognosis of infant liver failure syndrome type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 36 known patients, 12 died or underwent liver transplantation."
    explanation: >-
      Establishes that transplantation is part of the real course of this disease,
      against an explicit denominator. Note the composite endpoint does not
      separate deaths from transplants, so it does not report a transplant
      outcome.
  - reference: PMID:38951950
    reference_title: "MRI in LARS1 deficiency-Spectrum, patterns, and correlation with acute neurological deterioration."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Encephalopathy without hepatic dysfunction occurred in one individual after liver transplantation."
    explanation: >-
      Cited as the caveat rather than the support - a transplanted patient still
      had encephalopathy, which is the evidence that transplantation does not
      treat the systemic disease.
- name: Leucine Supplementation
  description: >-
    The evidence here changed, and both results are recorded because the
    disagreement is informative rather than a contradiction to be resolved by
    picking the newer paper.
    The 2015 ILFS1 clinical series reported that leucine supplementation had no
    appreciable impact on patient well-being. A 2021 study that approached the
    problem mechanistically rather than empirically reached the opposite
    conclusion: having first shown in patient fibroblasts that aminoacylation is
    both reduced at baseline and further reduced at febrile temperature, and that
    growth is severely impaired when the cognate amino acid is scarce, the authors
    supplemented patients with their cognate amino acid and INTENSIFIED dosing
    during infections, reporting benefit in growth, head circumference,
    development, coping with infections and oxygen dependency over up to two and
    two-thirds years.
    The two are reconcilable, and the reconciliation is the point: the failed
    attempt supplied leucine at steady state, while the successful protocol raised
    supply precisely when the temperature-sensitive enzyme's capacity falls. If
    that reading is right, timing rather than substrate is what the earlier trial
    got wrong. It is not established - the 2021 series pooled four different ARS
    deficiencies and was uncontrolled - so this entry presents it as the better
    supported of two open positions, not as settled.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Reduced Leucyl-tRNA Aminoacylation Capacity
    description: >-
      Raising cognate amino acid concentration is intended to drive the partially
      active enzyme, which is substrate-sensitive in patient cells.
  evidence:
  - reference: PMID:25917789
    reference_title: "Clinical and genetic characterisation of infantile liver failure syndrome type 1, due to recessive mutations in LARS."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Leucine supplementation had no appreciable impact on patient well-being."
    explanation: >-
      Graded REFUTE against benefit from leucine supplementation as given in this
      cohort. Uncontrolled clinical experience in a small series, and it does not
      state the dose or whether dosing was intensified during illness - which the
      later study identifies as the decisive variable.
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To prevent local and/or temporal deficiencies, we treated patients with corresponding amino acids (follow-up: 1/2-2 2/3rd years), and intensified treatment during infections. All patients showed beneficial treatment effects, most strikingly in growth (without tube feeding), head circumference, development, coping with infections, and oxygen dependency."
    explanation: >-
      Reports benefit from cognate amino acid supplementation intensified during
      infection. Graded SUPPORT, but note the cohort spans four ARS deficiencies
      (IARS, LARS, FARSB, SARS) rather than being an ILFS1 series, and there is no
      control arm - so it supports the strategy without isolating the effect in
      LARS1 deficiency.
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "With lower cognate amino acid concentrations, patient fibroblast growth was severely affected."
    explanation: The in vitro substrate-sensitivity result providing the rationale for supplementation, measured in patient cells.
animal_models:
- name: larsb-knockout zebrafish
  species: Zebrafish
  genotype: larsb-/- (CRISPR/Cas9 frameshift in exon 3, editing domain)
  publication: PMID:33863987
  description: >-
    CRISPR/Cas9 knockout of larsb, the zebrafish paralogue with higher homology to
    human LARS1, targeted to the editing domain where most human variants fall.
  modeled_mechanisms:
  - target: Recurrent Hepatocellular Injury and Acute Liver Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces progressive liver failure and anemia, the two
      cardinal systemic features.
    limitations: >-
      The fish phenotype is PROGRESSIVE and lethal within 12 days, whereas human
      ILFS1 is EPISODIC, febrile-triggered, and compatible with survival past 28
      years. So the model reproduces the organ that fails without reproducing the
      conditional, temperature-triggered character that defines the human disease.
      The knockout is also a null, while human alleles are partial loss-of-function.
    readouts:
    - name: Liver size
      target: Recurrent Hepatocellular Injury and Acute Liver Failure
      direction: RESTORED
      interpretation: >-
        Liver size and survival improved on autophagy suppression, indicating
        autophagy contributes causally to the hepatic phenotype in this model.
      evidence:
      - reference: PMID:33863987
        reference_title: Leucyl-tRNA synthetase deficiency systemically induces excessive autophagy in zebrafish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The atg5-morpholino knockdown and bafilomycin treatment partially improved the size of the liver and survival rate in larsb-/- zebrafish."
        explanation: Reports the measured rescue of liver size and survival.
    evidence:
    - reference: PMID:33863987
      reference_title: Leucyl-tRNA synthetase deficiency systemically induces excessive autophagy in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we generated Lars deficient (larsb-/-) zebrafish that showed progressive liver failure and anaemia, resulting in early lethality within 12 days post fertilization."
      explanation: Establishes that the model reproduces the liver and haematological phenotypes, which is what makes it informative for this node.
  - target: Dysregulated mTORC1 Signalling and Excessive Autophagy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model is the primary and essentially only evidence for the autophagy arm
      of the mechanism.
    limitations: >-
      No human ILFS1 tissue has been examined for excessive autophagy, so the
      entire branch rests on the fish.
    evidence:
    - reference: PMID:33863987
      reference_title: Leucyl-tRNA synthetase deficiency systemically induces excessive autophagy in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Indeed, excessive autophagy activation was observed in larsb-/- zebrafish."
      explanation: The direct observation of excessive autophagy in the model.
discussions:
- discussion_id: ilfs1_autophagy_arm_human_validity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Dysregulated mTORC1 Signalling and Excessive Autophagy
  prompt: >-
    Does excessive autophagy contribute to human ILFS1 liver injury, or is it a
    property of the zebrafish null that does not transfer to partial
    loss-of-function human alleles?
  rationale: >-
    The autophagy branch is supported entirely by larsb-knockout zebrafish, where
    suppressing autophagy genuinely rescued liver size and survival. Two features
    of that model argue for caution before carrying it into human biology. It is a
    NULL, whereas human ILFS1 alleles retain temperature-sensitive residual
    activity; and its phenotype is progressive and lethal within 12 days, whereas
    the human disease is episodic and survivable into adulthood. The mismatch
    matters practically because the fish result points at autophagy or mTORC1
    inhibitors as candidate therapies, and that inference is only as good as the
    model's fidelity to a partial loss-of-function human disease.
  proposed_experiments:
  - experiment_id: ilfs1_autophagic_flux_at_febrile_temperature
    name: Autophagic flux in ILFS1 patient hepatocyte-like cells at febrile temperature
    description: >-
      Measure autophagic flux (LC3-II turnover with and without lysosomal block)
      in patient-derived hepatocyte-like cells at 37 C and at 40 C, against
      controls, to test whether excessive autophagy is present in human cells
      carrying partial loss-of-function alleles and whether it is temperature-dependent
      in the way aminoacylation activity is.
    would_support:
    - pathophysiology#Dysregulated mTORC1 Signalling and Excessive Autophagy
    supporting_outcome:
    - >-
      Increased autophagic flux in patient cells relative to controls, amplified at
      the higher temperature.
    would_refute:
    - pathophysiology#Dysregulated mTORC1 Signalling and Excessive Autophagy
    refuting_outcome:
    - >-
      Autophagic flux indistinguishable from controls at both temperatures,
      indicating the fish finding reflects the null genotype rather than the human
      disease mechanism.
- discussion_id: ilfs1_microcytosis_unexplained
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Microcytic Anemia
  prompt: >-
    Why does a cytoplasmic leucine-charging defect produce a MICROCYTIC anemia
    specifically?
  rationale: >-
    Anemia is early and near-universal and is reproduced in the zebrafish model,
    so it is a direct consequence of LeuRS deficiency rather than a secondary
    effect of liver disease. But microcytosis normally points at haem or globin
    synthesis, and no published work connects leucyl-tRNA charging to either. The
    causal edge into this node is annotated INDIRECT_UNKNOWN_INTERMEDIATES for
    exactly this reason.
- discussion_id: ilfs1_translation_step_unmeasured
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Cytoplasmic Protein Synthesis in High-Demand Tissues
  prompt: >-
    Has reduced protein synthesis actually been measured in ILFS1 patient tissue,
    or is the translational step inferred from the enzyme assay and the clinical
    phenotype either side of it?
  rationale: >-
    The entry's central causal chain runs enzyme activity to translation to organ
    failure, but only the two ends are measured. No published study reports global
    or tissue-specific translation rates in ILFS1 material. The step is retained
    because no alternative route from a charging defect to hypoalbuminemia has been
    proposed, but it is graded PROVISIONAL and flagged here rather than presented
    as established.
- discussion_id: ilfs1_encephalopathy_independent_of_liver
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#Encephalopathic Episodes with Deep Grey Matter and Brainstem Injury
  prompt: >-
    What is the direct mechanism of brain injury in ILFS1, given that encephalopathy
    can occur without hepatic dysfunction?
  rationale: >-
    Encephalopathy after liver transplantation, and encephalopathic episodes
    occurring independently of liver crises in a separate cohort, together rule out
    a purely hepatic-encephalopathy explanation. The MRI pattern is also reported as
    distinct from hepatic encephalopathy and from metabolic stroke in organic
    acidurias and mitochondrial disease. What remains is a neuronal
    protein-synthesis deficit acting directly, which is plausible and untested. The
    imaging authors state the pathomechanism remains unclear.

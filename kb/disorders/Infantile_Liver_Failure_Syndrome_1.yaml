- name: Encephalopathic Episodes with Deep Grey Matter and Brainstem Injury
  biological_scale: ORGANISM
  description: >-
    Acute encephalopathy with seizures and reduced consciousness, precipitated by
    infection. On MRI, most individuals imaged during an acute episode showed deep
    grey matter and brainstem changes, a pattern the authors report as apparently
    characteristic of LARS1 deficiency and as differing from hepatic encephalopathy
    or from the metabolic stroke of organic acidurias and mitochondrial disease.
    The critical mechanistic point is dissociation from the liver: encephalopathy
    occurred in one individual AFTER liver transplantation, so the brain injury
    cannot be simply a consequence of hepatic failure. Most episodes were survived.

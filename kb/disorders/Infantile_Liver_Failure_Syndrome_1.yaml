name: Infantile Liver Failure Syndrome 1
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: LARS1 deficiency (infantile liver failure syndrome type 1)
  term:
    id: MONDO:0024568
    label: infantile liver failure syndrome 1
description: >-
  Infantile liver failure syndrome 1 (ILFS1) is a recessive multisystem disorder
  caused by biallelic variants in LARS1, the gene for the CYTOPLASMIC leucyl-tRNA
  synthetase (LeuRS). LeuRS charges leucine onto tRNA-Leu, the first committed
  step in incorporating leucine into every cytoplasmic protein, so the disease
  belongs to the recessive aminoacyl-tRNA-synthetase (ARS) deficiency family
  alongside SARS1, MARS1 and others.
  What makes ILFS1 mechanistically legible is that its residual enzyme is
  temperature-sensitive. Aminoacylation activity in patient fibroblasts is not
  merely low at baseline; it falls significantly further when the cells are
  warmed. That single in vitro observation explains the clinical rhythm of the
  disease, which is otherwise puzzling: patients are relatively well between
  episodes and decompensate during febrile illness. Fever both raises the
  temperature at which the crippled enzyme must work and raises the demand for
  protein synthesis, and the liver - the body's highest-throughput secretory
  protein factory - fails first.
  The phenotype accordingly pairs a hepatic axis (recurrent transaminase
  elevation up to frank acute liver failure, hypoalbuminemia) with a
  haematological axis (microcytic anemia), a growth axis (low birth weight,
  early failure to thrive) and a neurological axis (developmental delay,
  seizures, and encephalopathic episodes whose MRI signature - deep grey matter
  and brainstem change - is reported as distinct from hepatic encephalopathy or
  from the metabolic stroke of organic acidurias).
  Two clinical inversions are worth stating plainly because they run against
  reflex management. First, the standard metabolic-hepatopathy move of restricting
  protein appears inappropriate here, since the lesion is a failure to USE amino
  acids rather than a failure to clear them. Second, encephalopathy is not simply
  downstream of the liver: it has occurred in one individual after liver
  transplantation, and episodes can occur independently of hepatic dysfunction.
  Prognosis is not uniformly poor - episodes become less severe with age and two
  patients in the founding cohort were well beyond 28 years.
parents:
- hereditary disease
- Inborn Error of Metabolism
- Aminoacyl-tRNA Synthetase Deficiency
synonyms:
- ILFS1
- LARS1 deficiency
- LARS deficiency
- infantile liver failure syndrome type 1
- cytoplasmic leucyl-tRNA synthetase deficiency
- acute infantile liver failure - multisystemic involvement syndrome
notes: >-
  Gene nomenclature. The founding papers call the gene LARS; it is now LARS1, to
  distinguish it from LARS2, the MITOCHONDRIAL leucyl-tRNA synthetase, which
  causes a different disease (Perrault syndrome / HLASA). Quoted snippets in this
  entry preserve whichever spelling the cited paper used; the entry's own prose
  uses LARS1. This is not pedantry - the founding family was investigated for
  years as a suspected mitochondrial disorder precisely because the multisystem
  presentation looked mitochondrial, and the discovery paper's own conclusion was
  that it is not.

  Scope boundary. ILFS1 is the LARS1 entity only. Its MONDO parent, `infantile
  liver failure`, is a grouping that also covers ILFS2 (NBAS) and ILFS3 (RINT1);
  those are separate diseases with different mechanisms and are not curated here.

  Excluded reference. PMID:33314043 (Clin Genet 2021, functional characterisation
  of a novel LARS1 variant) is topically relevant but its cached record has an
  empty body, so no snippet can be verified against it and it is not cited. It is
  recorded here so a later curator does not spend the search again.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic LARS1 variants. The founding kindred was a consanguineous Irish
    Traveller family segregating a homozygous missense allele; subsequent cohorts
    include compound heterozygotes and at least one Ashkenazi family, so the
    disease is not confined to a single founder population.
  evidence:
  - reference: PMID:22607940
    reference_title: Identification of a mutation in LARS as a novel cause of infantile hepatopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified 1 novel homozygous missense mutation within the 5q31.3-q33.1 candidate region that segregated with the hepatopathy."
    explanation: Establishes homozygous, recessive segregation of the causal allele in the founding consanguineous family.

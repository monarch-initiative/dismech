  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ILFS1 is characterized by recurrent elevation of liver transaminases up to liver failure in conjunction with abnormalities of growth, blood, nervous system, and musculature."
    explanation: The cohort-level statement of the hepatic phenotype and its multisystem context.
  - reference: PMID:25917789
    reference_title: "Clinical and genetic characterisation of infantile liver failure syndrome type 1, due to recessive mutations in LARS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Episodic hepatic dysfunction is typically triggered by febrile illness, and becomes less severe with increasing age."
    explanation: Documents both the episodic character and the age-related attenuation described in this node.
- name: Hypoalbuminemia
  biological_scale: ORGANISM
  description: >-
    Present in all patients in the founding clinical series and among the earliest

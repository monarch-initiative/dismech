    modifier: DECREASED
    term:
      id: GO:0004823
      label: leucine-tRNA ligase activity
  biological_processes:
  - preferred_term: leucyl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0006429
      label: leucyl-tRNA aminoacylation
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Aminoacylation activity is significantly decreased in all patient cells studied upon temperature elevation in vitro."
    explanation: The direct enzymatic measurement in patient-derived cells, and the temperature dependence that the rest of the entry turns on.
  downstream:
  - target: Febrile Decompensation of Residual Charging Capacity
    causal_link_type: DIRECT
    description: >-
      Because the residual activity is temperature-sensitive, a rise in body
      temperature further reduces it.
  - target: Impaired Cytoplasmic Protein Synthesis in High-Demand Tissues
    causal_link_type: DIRECT
    description: >-
      Reduced charging capacity limits translational throughput wherever demand is
      highest, which at baseline is the liver.
- name: Febrile Decompensation of Residual Charging Capacity
  biological_scale: ORGANISM
  description: >-
    The trigger node. Intercurrent febrile illness is the near-universal
    precipitant of both hepatic and encephalopathic crises across every published
    cohort - it was reported as the trigger for encephalopathic episodes in 80% of
    the ten-patient clinical series, and as the trigger of both crisis types in the
    twenty-five-patient series. The proposed explanation combines two effects that
    act in the same direction: fever lowers the temperature-sensitive enzyme's
    residual activity, while infection raises catabolic and acute-phase protein
    demand. That combination is a proposal that fits the in vitro temperature data
    rather than a directly demonstrated in vivo chain, and the MRI study is
    explicit that the pathomechanism remains unclear.
  biological_processes:
  - preferred_term: cellular response to heat
    modifier: ABNORMAL
    term:
      id: GO:0034605
      label: cellular response to heat
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prominent clinical findings are recurrent elevation of liver transaminases up to liver failure and encephalopathic episodes, both triggered by febrile illness."
    explanation: Establishes febrile illness as the trigger for both crisis types in the largest cohort.
  - reference: PMID:25917789
    reference_title: "Clinical and genetic characterisation of infantile liver failure syndrome type 1, due to recessive mutations in LARS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Encephalopathic episodes triggered by febrile illness have occurred in 80 % and were fatal in two children."
    explanation: Quantifies the frequency and the lethality of febrile-triggered encephalopathy in the ten-patient clinical series.
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Aminoacylation activity was reduced in all patients, and further diminished at 38.5/40 °C (PLARS and PFARSB), consistent with infectious deteriorations."
    explanation: >-
      Independent confirmation of the temperature effect at febrile temperatures
      specifically, in the LARS patient among others, and the authors' own link
      from it to infectious deterioration.
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed a common disease mechanism of episodic insufficient aminoacylation to meet translational demands"
    explanation: States the episodic-insufficiency model across four ARS deficiencies, which is the framing this node uses.
  - reference: PMID:38951950
    reference_title: "MRI in LARS1 deficiency-Spectrum, patterns, and correlation with acute neurological deterioration."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "While the pathomechanism remains unclear, fever and energy deficit during infections might be causative"
    explanation: >-
      Deliberately cited as PARTIAL and as an explicit hedge - the authors propose
      fever and energy deficit as causative but state the pathomechanism is
      unclear, and the entry does not claim more than they do.
  downstream:
  - target: Impaired Cytoplasmic Protein Synthesis in High-Demand Tissues
    causal_link_type: DIRECT
    description: >-
      The febrile drop in charging capacity is what converts a tolerable chronic
      deficit into an acute translational failure.
  - target: Encephalopathic Episodes with Deep Grey Matter and Brainstem Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Encephalopathic episodes are infection-triggered in every cohort that
      reports them, so the trigger node feeds the neurological arm as well as the
      hepatic one. The edge is INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT
      because nothing establishes what happens between the febrile drop in
      charging capacity and the deep grey matter and brainstem injury - the
      imaging authors state the pathomechanism remains unclear. Drawing this edge
      does NOT route the encephalopathy through the liver: it runs from the shared
      trigger, which is what lets the arm stay independent of hepatic failure.
- name: Impaired Cytoplasmic Protein Synthesis in High-Demand Tissues
  biological_scale: CELLULAR
  description: >-
    With leucine charging limiting, cytoplasmic translation cannot keep pace with
    demand. The tissue distribution of the disease follows protein-synthetic
    throughput rather than LARS1 expression: hepatocytes, which manufacture and
    secrete albumin and the acute-phase proteins, are affected first and hardest.
    This is the proposed unifying premise of the recessive ARS deficiencies
    generally - residual aminoacylation suffices at baseline but not under load.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: cytoplasmic translation
    modifier: DECREASED
    term:
      id: GO:0002181
      label: cytoplasmic translation
  mechanism_confidence: PROVISIONAL
  notes: >-
    This node is an inference, not a measurement. No published study has measured
    global or hepatocyte-specific translation rates in ILFS1 patient tissue. What
    is measured is the enzyme activity upstream and the clinical protein-synthetic
    failure downstream (hypoalbuminemia, coagulopathic liver failure); the
    translational step between them is bridged by the ARS-deficiency model rather
    than by direct evidence, and is graded PROVISIONAL for that reason.
  evidence:
  - reference: PMID:22607940
    reference_title: Identification of a mutation in LARS as a novel cause of infantile hepatopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "responsible for exclusively attaching leucine to its cognate tRNA during protein translation"
    explanation: >-
      Supports the enzyme's role in translation, which is the premise of this
      node. Graded PARTIAL because it evidences the normal function rather than
      measuring impaired translation in patients.
  downstream:
  - target: Recurrent Hepatocellular Injury and Acute Liver Failure
    causal_link_type: DIRECT
    description: >-
      Hepatocytes are the highest-throughput protein-synthetic cells and fail
      first.
  - target: Hypoalbuminemia
    causal_link_type: DIRECT
    description: >-
      Albumin is the single largest hepatic secretory product, so its plasma level
      is a direct readout of hepatic synthetic capacity.
  - target: Microcytic Anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Anemia is present from early infancy in essentially all patients, but the
      route from a leucine-charging defect to a MICROCYTIC red-cell phenotype
      specifically has not been established.
- name: Dysregulated mTORC1 Signalling and Excessive Autophagy
  biological_scale: CELLULAR
  description: >-
    A second, non-canonical arm. Beyond charging tRNA, LeuRS acts as the
    intracellular leucine sensor that permits amino-acid-induced mTORC1
    activation. In larsb-knockout zebrafish, which reproduce progressive liver
    failure and anemia, autophagy is excessively activated, and both morpholino
    knockdown of atg5 and bafilomycin treatment partially rescue liver size and
    survival. That is a genuine causal test - suppressing autophagy improves the
    phenotype - but it is a test in fish, and it has not been repeated in human
    ILFS1 tissue. It is modelled as a separate branch rather than folded into the
    translational arm because the two make different predictions about therapy.
  genes:
  - preferred_term: LARS1
    term:
      id: hgnc:6512
      label: LARS1
  biological_processes:
  - preferred_term: TORC1 signaling
    modifier: DYSREGULATED
    term:
      id: GO:0038202
      label: TORC1 signaling
  - preferred_term: macroautophagy
    modifier: INCREASED
    term:
      id: GO:0016236
      label: macroautophagy
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33863987
    reference_title: Leucyl-tRNA synthetase deficiency systemically induces excessive autophagy in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The atg5-morpholino knockdown and bafilomycin treatment partially improved the size of the liver and survival rate in larsb-/- zebrafish."
    explanation: The rescue experiment establishing autophagy as causally contributing to the liver phenotype in the fish model.
  - reference: PMID:33863987
    reference_title: Leucyl-tRNA synthetase deficiency systemically induces excessive autophagy in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "LARS is also essential to sensitize the intracellular leucine concentration to the mammalian target of rapamycin complex 1 (mTORC1) activation."
    explanation: States the non-canonical leucine-sensing role of LeuRS that this branch depends on.
  - reference: PMID:22424946
    reference_title: Leucyl-tRNA synthetase is an intracellular leucine sensor for the mTORC1-signaling pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that LRS directly binds to Rag GTPase, the mediator of amino acid signaling to mTORC1, in an amino acid-dependent manner and functions as a GTPase-activating protein (GAP) for Rag GTPase to activate mTORC1."
    explanation: >-
      The primary source for the leucine-sensing mechanism, and it specifies the
      molecular route - LeuRS acting as a GAP for Rag GTPase - rather than leaving
      the non-canonical role as an unexplained assertion.
  downstream:
  - target: Recurrent Hepatocellular Injury and Acute Liver Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Excessive autophagic degradation contributes to the hepatic phenotype
      independently of the charging deficit, at least in the zebrafish model.
- name: Recurrent Hepatocellular Injury and Acute Liver Failure
  biological_scale: TISSUE
  description: >-
    The defining clinical event. Transaminases rise recurrently, in the severe
    case to frank acute liver failure, characteristically during febrile illness.
    The pattern is episodic rather than steadily progressive, and episodes become
    less severe with increasing age - a natural history that fits a conditional
    enzyme deficit better than it fits cumulative structural damage.
  cell_types:

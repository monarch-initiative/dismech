      id: CL:0000540
      label: neuron
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:38951950
    reference_title: "MRI in LARS1 deficiency-Spectrum, patterns, and correlation with acute neurological deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On MRI, 5/7 individuals with MRI during acute encephalopathy had deep gray matter and brainstem changes."
    explanation: The imaging finding that defines the anatomical signature of the encephalopathic episodes.
  - reference: PMID:38951950
    reference_title: "MRI in LARS1 deficiency-Spectrum, patterns, and correlation with acute neurological deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Encephalopathy without hepatic dysfunction occurred in one individual after liver transplantation."
    explanation: The observation dissociating the neurological arm from hepatic failure, which is why this node is not modelled downstream of the liver.
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Encephalopathic episodes with seizures can occur independently from liver crises and may present with metabolic stroke."
    explanation: Independent confirmation in a separate cohort that the encephalopathy is not simply downstream of liver failure.
diagnosis:
- name: Temperature-dependent aminoacylation assay in patient fibroblasts
  description: >-
    The functional confirmatory test, and unusually it is also the disease's
    central mechanism made visible. Leucyl-tRNA aminoacylation is measured in
    patient-derived fibroblasts at baseline and at elevated temperature.
    Reduced baseline activity confirms the enzyme defect; the further fall at
    38.5 and 40 degrees is what distinguishes this from a fixed enzymopathy and
    predicts the febrile decompensation that defines the clinical course. A
    baseline-only assay would miss the finding that matters most for management.
    The same study showed patient fibroblast growth is severely impaired at low
    cognate amino acid concentration, which is the assay underpinning the
    supplementation strategy.
  evidence:
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Aminoacylation activity is significantly decreased in all patient cells studied upon temperature elevation in vitro."
    explanation: Establishes the assay and its temperature dependence across every patient tested in the largest cohort.
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In fibroblasts from patients with isoleucyl-RS (IARS), leucyl-RS (LARS), phenylalanyl-RS-beta-subunit (FARSB), and seryl-RS (SARS) deficiencies, we investigated aminoacylation activity, thermostability, and sensitivity to ARS-specific amino acid concentrations, and developed personalized treatments."
    explanation: >-
      Describes the assay panel - activity, thermostability and amino acid
      sensitivity - and makes explicit that it was used to derive personalised
      treatment, so the diagnostic test and the therapeutic decision are the same
      measurement.
- name: Exome or genome sequencing with LARS1 variant interpretation
  description: >-
    Molecular diagnosis rests on identifying biallelic LARS1 variants. Two
    interpretation points. First, confirm the gene is LARS1 and not LARS2 - the
    mitochondrial leucyl-tRNA synthetase, which causes a different disease - since
    the founding literature uses the bare symbol LARS. Second, do not expect the
    variant to be a null: reported alleles are partial loss-of-function, most fall
    in the editing domain, and the diagnosis should not be discarded because
    residual activity is present. The founding kindred was solved by homozygosity
    mapping plus exome sequencing in a consanguineous family; later patients
    include compound heterozygotes.
  evidence:
  - reference: PMID:22607940
    reference_title: Identification of a mutation in LARS as a novel cause of infantile hepatopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We aimed to identify the underlying risk gene using homozygosity mapping and whole exome sequencing."
    explanation: The sequencing approach that established the diagnosis in the founding family.
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five individuals from 15 families were ascertained including 12 novel patients with eight previously unreported variants."
    explanation: Documents the breadth of the allelic series a diagnostic laboratory should expect to interpret against.
  notes: >-
    No GeneReviews chapter exists for LARS1 or ILFS1. Re-confirmed by esearch
    against PubMed on 2026-08-28: `LARS1 GeneReviews[All Fields]`,
    `infantile liver failure syndrome GeneReviews[Title]` and
    `leucyl-tRNA synthetase GeneReviews[All Fields]` all return zero results. The
    NBAS/ILFS2 chapter covers a different gene and a different disease.
genetic:
- name: LARS1
  gene_term:
    preferred_term: LARS1
    term:
      id: hgnc:6512
      label: LARS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    LARS1 at 5q32 encodes cytoplasmic leucyl-tRNA synthetase. Inheritance is
    autosomal recessive; the founding kindred was a consanguineous Irish Traveller
    family with a homozygous missense allele, and eight further previously
    unreported variants were added by the 2020 international series. Most reported
    human variants fall in the enzyme's editing (proofreading) domain. The
    functional consequence measured in patient fibroblasts is reduced
    aminoacylation activity that worsens with temperature - a partial,
    conditional loss of function rather than a null.
  evidence:
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five individuals from 15 families were ascertained including 12 novel patients with eight previously unreported variants."
    explanation: Documents the breadth of the allelic series recorded in this genetic block.
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Aminoacylation activity is significantly decreased in all patient cells studied upon temperature elevation in vitro."
    explanation: The functional assay characterising these variants as conditional loss-of-function.

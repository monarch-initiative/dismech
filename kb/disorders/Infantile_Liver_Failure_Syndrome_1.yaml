    explanation: The largest published cohort, giving the order of magnitude of the reported case count.
- population: Worldwide, cumulative published series
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2024 review assembled 36 patients in total - three new plus 33 previously
    reported - which is the largest cumulative denominator available and the basis
    for the phenotype frequencies recorded in this entry.
  evidence:
  - reference: PMID:38844943
    reference_title: Early onset and liver failure indicating poor prognosis of infant liver failure syndrome type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease characteristics were summarized together with those of 33 reported cases."
    explanation: Establishes the cumulative case series that underpins the frequency denominators used below.
progression:
- phase: Prognostic determinants
  notes: >-
    Twelve of 36 reported patients died or underwent liver transplantation. Two
    factors independently conferred poor prognosis on Kaplan-Meier analysis: age of
    onset under three months (hazard ratio 12.29) and the occurrence of liver
    failure (hazard ratio 6.57). No genotype-phenotype correlation was found - the
    allele does not predict whether liver failure occurs or how severe the disease
    is - which is consistent with the disease being driven by conditional
    decompensation under environmental stress rather than by a fixed allele-determined
    severity. This coexists with, rather than contradicts, the earlier observation
    that episodes attenuate with age and that two patients were well beyond 28
    years: early onset predicts badly, and surviving childhood predicts well.
  evidence:
  - reference: PMID:38844943
    reference_title: Early onset and liver failure indicating poor prognosis of infant liver failure syndrome type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kaplan-Meier analysis indicated that age of onset < 3mo (p = 0.0015, hazard ratio = 12.29, 95% confidence interval [CI] = 3.74-40.3), like liver failure (p = 0.0343, hazard ratio = 6.57, 95% CI = 1.96-22.0), conferred poor prognosis."
    explanation: The survival analysis giving both prognostic factors with effect sizes and confidence intervals.
  - reference: PMID:38844943
    reference_title: Early onset and liver failure indicating poor prognosis of infant liver failure syndrome type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 36 known patients, 12 died or underwent liver transplantation."
    explanation: Gives the hard outcome rate against an explicit denominator.
  - reference: PMID:38844943
    reference_title: Early onset and liver failure indicating poor prognosis of infant liver failure syndrome type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant correlations were observed between genotype and either presence of liver failure or clinical severity of disease."
    explanation: The negative genotype-phenotype result recorded in this block.
pathophysiology:
- name: Biallelic LARS1 Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is biallelic damage to LARS1 at 5q32, encoding cytoplasmic
    leucyl-tRNA synthetase. The founding allele was a homozygous missense variant
    mapped by homozygosity mapping to 5q31.3-q33.1; the allelic series has since
    broadened substantially, with eight previously unreported variants added in a
    single 2020 series. A structural observation from the zebrafish work is that
    most reported human LARS1 variants fall in the editing domain - the
    proofreading module that hydrolyses mischarged tRNA - rather than in the
    aminoacylation active site itself.
  genes:
  - preferred_term: LARS1
    term:
      id: hgnc:6512
      label: LARS1
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:22607940
    reference_title: Identification of a mutation in LARS as a novel cause of infantile hepatopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The candidate mutation is located in the LARS gene which encodes a cytoplasmic leucyl-tRNA synthetase enzyme responsible for exclusively attaching leucine to its cognate tRNA during protein translation."
    explanation: The discovery report identifying LARS1 and stating the enzyme's function, which is the premise of the whole mechanism.
  - reference: PMID:32699352
    reference_title: Genotypic diversity and phenotypic spectrum of infantile liver failure syndrome type 1 due to variants in LARS1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in LARS1, coding for the cytosolic leucyl-tRNA synthetase, cause infantile liver failure syndrome 1 (ILFS1)."
    explanation: Confirms the biallelic LARS1 genotype-disease relationship in the largest systematic cohort.
  - reference: PMID:33863987
    reference_title: Leucyl-tRNA synthetase deficiency systemically induces excessive autophagy in zebrafish.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, most LARS gene mutations in humans occur in the editing domain"
    explanation: >-
      Records the editing-domain clustering of human alleles. Graded PARTIAL
      because the statement appears as background framing in a zebrafish paper
      rather than as that paper's own systematic allele survey.
  downstream:
  - target: Reduced Leucyl-tRNA Aminoacylation Capacity
    causal_link_type: DIRECT
    description: >-
      Damaged LeuRS charges less leucine onto tRNA-Leu, reducing total cellular
      charging capacity.
- name: Reduced Leucyl-tRNA Aminoacylation Capacity
  biological_scale: MOLECULAR
  description: >-
    The core enzymatic deficit, and the one measured directly in patient material.
    Aminoacylation activity is reduced in fibroblasts from every patient tested.
    Crucially the reduction is not fixed: it is significantly worse at elevated
    temperature, which makes the residual enzyme conditionally rather than
    constitutively insufficient. This is the mechanistic hinge of the entry -
    it converts a static enzyme deficiency into an episodic disease.
  genes:
  - preferred_term: LARS1
    term:
      id: hgnc:6512
      label: LARS1
  molecular_functions:

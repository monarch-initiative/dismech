    - sub-threshold TBX6 transcriptional output in the presomitic mesoderm
- name: Disrupted Paraxial Mesoderm Somite Formation
  conforms_to: axial_segmentation_serial_homology#Disrupted Somite Boundary Formation
  description: Sub-threshold TBX6 activity corrupts the formation and boundary positioning of somites in the presomitic mesoderm, mis-specifying the metameric template from which the vertebrae derive.
  role: central_effector
  cell_types:

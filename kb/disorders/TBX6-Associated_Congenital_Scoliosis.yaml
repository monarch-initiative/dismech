name: TBX6-Associated Congenital Scoliosis
creation_date: '2026-06-29T00:00:00Z'
category: Mendelian
description: 'TBX6-associated congenital scoliosis (TACS) is a congenital axial-skeleton malformation in which vertebral mis-segmentation — characteristically hemivertebrae — produces congenital scoliosis. It is the most common defined genetic cause of congenital scoliosis and follows a distinctive compound inheritance model: a rare loss-of-function (null) TBX6 allele — frequently a recurrent 16p11.2 deletion encompassing TBX6 — in trans with a common hypomorphic TBX6 risk haplotype, so that TBX6 dosage falls below the threshold required for normal somite formation while a heterozygous null alone is insufficient. TBX6 is a T-box transcription factor of the paraxial mesoderm / determination wavefront that is required to form somites, the serially repeated precursors of the vertebrae. TACS is filed in OMIM/MONDO under spondylocostal dysostosis 5 (OMIM:122600) but is clinically a milder, often more localized congenital scoliosis than classic recessive spondylocostal dysostosis. It conforms to the axial-skeleton serial-homology module across its wavefront, somite-formation, and vertebral-malsegmentation nodes.'

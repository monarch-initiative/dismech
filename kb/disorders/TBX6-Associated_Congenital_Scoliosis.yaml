    explanation: Confirms the common risk haplotype is hypomorphic, the second hit lowering TBX6 dosage. Evidence source is IN_VITRO (functional assays).
  downstream:
  - target: Disrupted Paraxial Mesoderm Somite Formation
    description: Reduced TBX6 dosage impairs somite formation in the paraxial mesoderm.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

inheritance:
- name: Compound Inheritance (Null Allele plus Hypomorphic Haplotype)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: A rare TBX6 null allele (often a 16p11.2 deletion) in trans with a common hypomorphic TBX6 risk haplotype; a heterozygous null alone is insufficient, so the phenotype reflects biallelic compound TBX6 dosage insufficiency. Autosomal dominant inheritance of TBX6-related spondylocostal dysostosis has also been reported in a three-generation family, so autosomal recessive compound inheritance is not the sole mode reported under MONDO:0007389.
  evidence:
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The compound inheritance ofTBX6 in congenital scoliosis, like that of RBM8A in TAR and analogous to a recessive trait, requires two mutant alleles at a genetic locus for trait manife ation.
    explanation: Explicitly characterizes compound inheritance of TBX6 in congenital scoliosis as analogous to an autosomal recessive trait requiring two mutant alleles at the locus.
  - reference: PMID:20301771
    reference_title: Spondylocostal Dysostosis, Autosomal Recessive.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SCDO caused by biallelic pathogenic variants in DLL3, HES7, LFNG, MESP2, RIPPLY2, or TBX6 is inherited in an autosomal recessive manner. (Autosomal dominant inheritance of TBX6-related SCDO has been reported in a three-generation family.)
    explanation: Confirms autosomal recessive inheritance for biallelic TBX6 variants while noting the reported three-generation autosomal dominant TBX6 family.

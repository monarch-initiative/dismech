genetic:
- name: TBX6 Null Allele and Hypomorphic Risk Haplotype
  association: Causative
  gene_term:
    preferred_term: TBX6
    term:
      id: hgnc:11605
      label: TBX6
  features: Compound inheritance of a rare TBX6 null variant (16p11.2 deletion, nonsense, or frameshift) in trans with a common hypomorphic TBX6 allele defined by risk SNPs (rs2289292, rs3809624, rs3809627).
  case_fractions:
  - population: Han Chinese sporadic congenital scoliosis discovery cohort (series 1)
    case_fraction_percent: 11.0
    cohort_size: 161
    evidence:
    - reference: PMID:25564734
      reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified a total of 17 heterozygous TBX6 null mutations in the 161 persons with sporadic congenital scoliosis (11%); we did not observe any null mutations in TBX6 in 166 controls (P<3.8×10(-6)).
      explanation: Documents 17/161 (11%) of sporadic congenital scoliosis cases in series 1 explained by TBX6 null variants in trans with the hypomorphic haplotype.
  - population: Han Chinese congenital scoliosis replication cohort (series 2)
    case_fraction_percent: 8.0
    cohort_size: 76
    evidence:
    - reference: PMID:25564734
      reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The TBX6 compound inheritance model accounts for 6 of 76 cases of congenital scoliosis (8%) in series 2 (Table 2).
      explanation: Documents 6/76 (8%) of congenital scoliosis cases in the replication cohort explained by TBX6 compound inheritance.
  evidence:
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a total of 17 heterozygous TBX6 null mutations in the 161 persons with sporadic congenital scoliosis (11%); we did not observe any null mutations in TBX6 in 166 controls (P<3.8×10(-6)). These null alleles include copy-number variants (12 instances of a 16p11.2 deletion affecting TBX6) and single-nucleotide variants (1 nonsense and 4 frame-shift mutations).
    explanation: Documents the spectrum of TBX6 null variants (recurrent 16p11.2 deletions and truncating SNVs) in congenital scoliosis.
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compound inheritance of a rare null mutation and a hypomorphic allele of TBX6 accounted for up to 11% of congenital scoliosis cases in the
    explanation: Establishes compound inheritance of a rare TBX6 null allele and a common hypomorphic allele as causative in up to 11% of congenital scoliosis cases.

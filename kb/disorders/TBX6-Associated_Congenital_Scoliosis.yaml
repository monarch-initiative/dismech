    reference_title: FGF signaling acts upstream of the NOTCH and WNT signaling pathways to control segmentation clock oscillations in mouse somitogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The FGF pathway establishes a posterior-to-anterior signaling gradient in the presomitic mesoderm (PSM), which controls cell maturation and is involved in the positioning of segmental boundaries.
    explanation: Describes the PSM determination wavefront positioning segmental boundaries, the somite-formation step disrupted by reduced TBX6 dosage. Evidence source is MODEL_ORGANISM (mouse).
  downstream:
  - target: Hemivertebrae and Congenital Scoliosis
    description: Mis-formed somites yield hemivertebrae and a curved spine.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - asymmetric/incomplete vertebral body formation from mis-specified somites
- name: Hemivertebrae and Congenital Scoliosis
  conforms_to: axial_segmentation_serial_homology#Vertebral and Costal Malsegmentation
  description: The somite-formation defect manifests as vertebral malsegmentation — characteristically hemivertebrae — that produces a congenital lateral curvature of the spine. Because the vertebrae are serially homologous somite derivatives, one or more segments are malformed.

differential_diagnoses:
- name: Spondylocostal Dysostosis
  disease_term:
    preferred_term: spondylocostal dysostosis
    term:
      id: MONDO:0000359
      label: spondylocostal dysostosis
  description: >-
    Generalized axial segmentation disorder caused by biallelic variants in
    Notch/segmentation-clock genes (DLL3, MESP2, LFNG, HES7) or biallelic high-impact
    TBX6 variants, typically presenting with widespread rib fusions and generalized
    vertebral segmentation defects rather than focal hemivertebrae.
  distinguishing_features:
  - Generalized rib and vertebral segmentation defects across the entire spine
  - Classic biallelic mutations in DLL3, MESP2, LFNG, or HES7 without the common TBX6 hypomorphic haplotype architecture
  evidence:
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hemivertebrae are characteristic of TBX6-associated congenital scoliosis.
    explanation: >-
      Distinguishes the characteristic hemivertebra presentation of TACS from
      more generalized spondylocostal dysostosis phenotypes.
treatments:
- name: Scoliosis Surgical Management
  description: >-
    Management of congenital scoliosis ranges from observation and bracing to
    growth-friendly instrumentation or corrective/fusion surgery for progressive
    curves; hemivertebra resection may be indicated for focal deformity.
  therapeutic_modality: SURGERY
  treatment_term:

progression:
- phase: Onset
  age_range: Congenital
  notes: Vertebral segmentation defects arise during embryonic somitogenesis and are present at birth as congenital hemivertebrae and spinal curvature.
  evidence:
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is manifested as a lateral curvature of the spine exceeding 10 degrees and results from defects in vertebra formation during embryogenesis.
    explanation: Confirms that the vertebral malformation arises from defective vertebra formation during embryogenesis and presents congenitally.
pathophysiology:
- name: TBX6 Dosage Insufficiency at the Determination Wavefront
  conforms_to: axial_segmentation_serial_homology#Segmentation Clock and Wavefront Dysfunction
  description: TBX6 is a T-box transcription factor of the paraxial mesoderm and determination wavefront required for somite formation. Compound inheritance of a rare null allele and a common hypomorphic haplotype lowers functional TBX6 below the threshold needed to drive normal segmentation; a heterozygous null allele alone is insufficient, indicating a dosage-dependent wavefront defect.

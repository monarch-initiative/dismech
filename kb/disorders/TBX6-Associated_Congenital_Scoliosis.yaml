differential_diagnoses:
- name: Classic autosomal recessive spondylocostal dysostosis (DLL3/MESP2/LFNG/HES7/RIPPLY2)
  disease_term:
    preferred_term: spondylocostal dysostosis
    term:
      id: MONDO:0000359
      label: spondylocostal dysostosis
  notes: MONDO:0000359 is the parent grouping term for spondylocostal dysostosis (which also subsumes SCDO5/MONDO:0007389); it is used here specifically to represent classic non-TBX6 autosomal recessive spondylocostal dysostosis caused by DLL3, MESP2, LFNG, HES7, or RIPPLY2 variants.
  description: Generalized axial segmentation disorder caused by biallelic variants in Notch/segmentation-clock genes (DLL3, MESP2, LFNG, HES7, RIPPLY2), typically presenting with multiple vertebral segmentation defects in combination with rib abnormalities and a short trunk rather than localized lower-spine hemivertebrae.
  distinguishing_features:
  - Multiple vertebral segmentation defects combined with rib abnormalities and short trunk
  - Biallelic pathogenic variants in DLL3, HES7, LFNG, MESP2, or RIPPLY2 rather than compound TBX6 null plus hypomorphic haplotype inheritance
  evidence:
  - reference: PMID:20301771
    reference_title: Spondylocostal Dysostosis, Autosomal Recessive.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Spondylocostal dysostosis (SCDO), defined radiographically as multiple segmentation defects of the vertebrae in combination with abnormalities of the ribs, is characterized clinically by a short trunk in proportion to height; short neck; and non-progressive mild scoliosis in most affected individuals – rarely, more significant scoliosis occurs.
    explanation: Defines classic spondylocostal dysostosis by multiple vertebral segmentation defects combined with rib abnormalities and disproportionate short trunk.
treatments:
- name: Scoliosis Surgical Management
  description: Management of congenital scoliosis ranges from observation and bracing to growth-friendly instrumentation or corrective/fusion surgery for progressive curves; hemivertebra resection may be indicated for focal deformity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Hemivertebrae
    term:
      id: HP:0002937
      label: Hemivertebrae
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:20301771
    reference_title: Spondylocostal Dysostosis, Autosomal Recessive.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Treatment of manifestations: Surgical intervention may be necessary when scoliosis is significant; external bracing (e.g., by use of a vertical expandable prosthetic titanium rib) may be considered, as well as growing rods and other devices as appropriate.'
    explanation: Supports orthopedic surgical intervention and growth-friendly instrumentation for significant congenital scoliosis.

  distinguishing_features:
  - Oral leukoplakia, bone marrow dysfunction and cancer predisposition point to dyskeratosis congenita.
  evidence:
  - reference: PMID:23440032
    reference_title: "Dermatopathia pigmentosa reticularis: A rare reticulate pigmentary disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Reticulate hyperpigmentation, mucosal leukoplakia, bone marrow dysfunction, cytogenetic instability, and a predisposition to malignancy are characteristic of DKC."
    explanation: Features that distinguish dyskeratosis congenita.

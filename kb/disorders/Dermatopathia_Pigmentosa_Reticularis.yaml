differential_diagnoses:
- name: Naegeli-Franceschetti-Jadassohn syndrome
  disease_term:
    preferred_term: Naegeli-Franceschetti-Jadassohn syndrome
    term:
      id: MONDO:0008059
      label: Naegeli-Franceschetti-Jadassohn syndrome
  description: >-
    Allelic KRT14 head-domain disorder sharing adermatoglyphia, reticulate pigmentation, keratoderma and abnormal
    sweating; overlapping presentations occur within one family.
  distinguishing_features:
  - Pigmentation in NFJS classically fades after puberty, whereas in DPR it persists for life.
  - Diffuse nonscarring alopecia favors DPR; dental enamel defects favor NFJS.
  evidence:
  - reference: PMID:31008174
    reference_title: "Dermatopathia pigmentosa reticularis: A report of a case with delayed onset alopecia and onychodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The clinical features of NFJS include dental abnormalities and, in many cases, the hyperpigmentation fades or disappears after puberty or in adulthood; in addition, nonscarring alopecia is not a feature of NFJS."
    explanation: Clinical features used to separate NFJS from DPR.
  - reference: PMID:42541155
    reference_title: Dermatopathia pigmentosa reticularis and overlap syndrome in siblings-A rare case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a rare case involving 2 siblings: case 1, a 24-year-old male with a diagnosis of DPR, and case 2, his 28-year-old sister demonstrating features of an overlap ectodermal dysplasia syndrome."
    explanation: Overlap within one sibship shows the boundary is not absolute.

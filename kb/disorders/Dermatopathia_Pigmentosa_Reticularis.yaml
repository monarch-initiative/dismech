name: Dermatopathia Pigmentosa Reticularis
creation_date: "2026-10-09T12:00:00Z"
description: >-
  Dermatopathia pigmentosa reticularis (DPR) is a very rare autosomal dominant ectodermal dysplasia defined by
  the triad of generalized reticulate hyperpigmentation that begins at birth or in early childhood and persists
  for life, diffuse noncicatricial alopecia, and onychodystrophy. Adermatoglyphia, palmoplantar hyperkeratosis,
  hypohidrosis or hyperhidrosis, heat intolerance, acral nonscarring blisters and mucosal pigmentation are
  variable associated features. DPR is allelic with Naegeli-Franceschetti-Jadassohn syndrome (NFJS): both are
  caused by heterozygous nonsense or frameshift variants in the region of KRT14 encoding the nonhelical head
  (E1/V1) domain, in contrast to the rod-domain KRT14 variants that cause epidermolysis bullosa simplex.
  Ultrastructural study of affected skin shows increased apoptosis in the KRT14-expressing basal layer, and work
  on NFJS alleles shows keratin 14 haploinsufficiency with increased keratinocyte susceptibility to TNF-alpha
  induced apoptosis. The steps from basal-cell apoptosis to the reticulate pigment pattern, hair loss and nail
  dystrophy are inferred rather than demonstrated.
category: Mendelian
disease_term:
  preferred_term: Dermatopathia Pigmentosa Reticularis
  term:
    id: MONDO:0007445
    label: dermatopathia pigmentosa reticularis
synonyms:
- DPR
notes: >-
  No disease-specific GeneReviews chapter exists for DPR; the epidermolysis bullosa simplex chapter covers
  rod-domain KRT14 disease and is not a baseline for this entry. DPR is curated separately from
  Naegeli-Franceschetti-Jadassohn syndrome (MONDO:0008059) because MONDO, OMIM and the clinical literature keep
  them as distinct diagnoses that differ in pigment persistence, alopecia and dental involvement, although
  a single family can carry both labels with the same KRT14 frameshift variant and the two may share one
  pathograph. Molecular confirmation in DPR rests on few families, and most mechanistic evidence comes from
  NFJS alleles; nodes that rely on NFJS data say so. Not cited as evidence, because no quotable text was
  retrieved on the fetches made for this entry: PMID:30968399 (intrafamilial NFJS/DPR overlap with the same
  KRT14 frameshift), PMID:39106435 (molecularly confirmed DPR family initially suspected to be dyskeratosis
  congenita), PMID:20180888 (a KRT14 missense variant with a DPR/NFJS phenotype) and PMID:7591467 (etretinate
  for DPR-associated palmoplantar keratoderma).
prevalence:
- population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based rate exists. Case reports count fewer than about twenty to twenty-one published
    patients; these are counts of reports, not of affected people.
  evidence:
  - reference: PMID:27512211
    reference_title: "Dermatopathia Pigmentosa Reticularis: Report of a New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Reviewing the literature revealed that <20 cases of true DPR have been reported in the literature."
    explanation: Literature count of published DPR cases, the only occurrence measure available.
  - reference: PMID:32995033
    reference_title: "Dermatopathia pigmentosa reticularis with beard alopecia: first report from Syria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "DPR has been acknowledged as a very rare disorder with approximately 21 reported cases among the regions of America, Europe and Asia"
    explanation: A later count of published cases, consistent with an ultra-rare disorder.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Transmitted as an autosomal dominant trait; a family pedigree established dominant transmission, and
    heterozygous KRT14 variants segregate with the disease. Associated features vary between patients.
  evidence:
  - reference: PMID:1303619
    reference_title: "Dermatopathia pigmentosa reticularis: a report of a family demonstrating autosomal dominant inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A family pedigree demonstrates the autosomal dominant inheritance of dermatopathia pigmentosa reticularis."
    explanation: Pedigree evidence for dominant transmission of DPR.
  - reference: PMID:16960809
    reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Naegeli-Franceschetti-Jadassohn syndrome (NFJS) and dermatopathia pigmentosa reticularis (DPR) are two closely related autosomal dominant ectodermal dysplasia syndromes"
    explanation: States the dominant inheritance of DPR in the gene-identification study.
pathophysiology:
- name: KRT14 Head Domain Truncating Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is a germline heterozygous nonsense or frameshift variant in the part of KRT14 that
    encodes the nonhelical head (E1/V1) domain, predicted to terminate translation very early. One DPR family
    and four NFJS families were studied in the gene-identification work, so the DPR-specific evidence rests on a
    single family. Rod-domain KRT14 variants instead cause epidermolysis bullosa simplex.
  genes:
  - preferred_term: KRT14
    term:
      id: hgnc:6416
      label: KRT14
  genetic_context:
    genes:
    - preferred_term: KRT14
      term:
        id: hgnc:6416
        label: KRT14
    allele_type: nonsense or frameshift
    genomic_contexts:
    - coding sequence
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    notes: >-
      Loss of function is assigned from the haploinsufficiency shown for NFJS head-domain alleles; it has not
      been tested separately for the DPR allele.
  evidence:
  - reference: PMID:16960809
    reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous nonsense or frameshift mutations in KRT14 were found to segregate with the disease trait in all five families."
    explanation: Segregation of heterozygous truncating KRT14 variants in the DPR family and four NFJS families.
  - reference: PMID:16960809
    reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NFJS/DPR-associated mutations were found in a region of the gene encoding the nonhelical head (E1/V1) domain and are predicted to result in very early termination of translation."
    explanation: Places the DPR/NFJS variants in the head domain and distinguishes them from rod-domain EBS variants.
  downstream:
  - target: Keratin 14 Haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      Shown for NFJS head-domain alleles; the DPR allele is assumed to act the same way because it lies in the
      same region and has the same predicted consequence.
    evidence:
    - reference: PMID:18049449
      reference_title: KRT14 haploinsufficiency results in increased susceptibility of keratinocytes to TNF-alpha-induced apoptosis and causes Naegeli-Franceschetti-Jadassohn syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "we further expand the spectrum of NFJS-causing mutations and demonstrate that these mutations result in haploinsufficiency for keratin 14 (K14)."
      explanation: Haploinsufficiency was demonstrated for NFJS alleles of the same class; applying it to DPR is an inference across allelic diagnoses.
  - target: Defective Dermatoglyphic and Sweat Gland Ontogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed from the absence of dermatoglyphics and abnormal sweating in carriers; the developmental steps
      have not been studied.
    evidence:
    - reference: PMID:16960809
      reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "These data suggest that KRT14 plays an important role during ontogenesis of dermatoglyphics and sweat glands."
      explanation: The authors' inference from the genotype-phenotype data, not a developmental study.
  - target: Diffuse nonscarring alopecia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hair loss is a defining DPR feature in the carriers studied, but no study links KRT14 head-domain loss to
      a hair-follicle mechanism.
    evidence:
    - reference: PMID:31008174
      reference_title: "Dermatopathia pigmentosa reticularis: A report of a case with delayed onset alopecia and onychodystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: "Dermatopathia pigmentosa reticularis (DPR) is an extremely rare autosomal dominant ectodermal dysplasia that occurs because of mutations in KRT14."
      explanation: Places the hair phenotype of DPR downstream of KRT14 mutation without naming the intermediate steps.
- name: Keratin 14 Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Head-domain truncating alleles reduce the amount of keratin 14 available to the basal keratinocyte keratin
    filament network. Demonstrated for NFJS alleles; whether every DPR allele acts purely by haploinsufficiency,
    rather than through a truncated product, has not been tested.
  genes:
  - preferred_term: KRT14
    term:
      id: hgnc:6416
      label: KRT14
  cellular_components:
  - preferred_term: keratin filament
    term:
      id: GO:0045095
      label: keratin filament
  cell_types:
  - preferred_term: basal cell of epidermis
    term:
      id: CL:0002187
      label: basal cell of epidermis
  evidence:
  - reference: PMID:18049449
    reference_title: KRT14 haploinsufficiency results in increased susceptibility of keratinocytes to TNF-alpha-induced apoptosis and causes Naegeli-Franceschetti-Jadassohn syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Collectively, our results indicate that NFJS results from haploinsufficiency for K14"
    explanation: Haploinsufficiency is established for NFJS, the allelic disorder; extension to DPR is by inference.
  downstream:
  - target: Increased Basal Keratinocyte Apoptosis
    causal_link_type: DIRECT
    description: >-
      Reduced KRT14 expression increased TNF-alpha induced apoptosis in a keratinocyte cell line, a response
      blocked by doxycycline.
    evidence:
    - reference: PMID:18049449
      reference_title: KRT14 haploinsufficiency results in increased susceptibility of keratinocytes to TNF-alpha-induced apoptosis and causes Naegeli-Franceschetti-Jadassohn syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using a HaCaT cell-based assay, we found that decreased KRT14 expression is associated with increased susceptibility to TNF-alpha-induced apoptosis."
      explanation: Knock-down of KRT14 in HaCaT keratinocytes increases TNF-alpha induced apoptosis.
- name: Increased Basal Keratinocyte Apoptosis
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Electron microscopy of NFJS/DPR patient skin shows increased apoptotic activity in the basal cell layer
    where KRT14 is expressed. The N-terminal keratin domain is proposed to protect keratinocytes from
    pro-apoptotic signals such as TNF-alpha; that protective function is supported in cultured keratinocytes,
    not shown in patient tissue.
  cell_types:
  - preferred_term: basal cell of epidermis
    term:
      id: CL:0002187
      label: basal cell of epidermis
  biological_processes:
  - preferred_term: keratinocyte apoptotic process
    modifier: INCREASED
    term:
      id: GO:0097283
      label: keratinocyte apoptotic process
  - preferred_term: cellular response to tumor necrosis factor
    term:
      id: GO:0071356
      label: cellular response to tumor necrosis factor
  evidence:
  - reference: PMID:16960809
    reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural examination of patient skin biopsy specimens provided evidence for increased apoptotic activity in the basal cell layer where KRT14 is expressed"
    explanation: Patient skin shows increased basal-layer apoptosis.
  - reference: PMID:18049449
    reference_title: KRT14 haploinsufficiency results in increased susceptibility of keratinocytes to TNF-alpha-induced apoptosis and causes Naegeli-Franceschetti-Jadassohn syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This phenomenon was not observed when cells were cultured in the presence of doxycycline, a known negative regulator of TNF-alpha-dependant pro-apoptotic signaling."
    explanation: Ties the increased apoptosis to TNF-alpha dependent signaling in the cell model.
  downstream:
  - target: Basal Layer Degeneration and Pigment Incontinence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Basal cell damage would be expected to release melanin into the dermis; DPR biopsies show basal layer
      degeneration with dermal melanophages, but the link to apoptosis is inferred, not shown in the same tissue.
    evidence:
    - reference: PMID:37372478
      reference_title: Inherited Reticulate Pigmentary Disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "This suggests that apoptosis plays a significant role in the development of DPR, providing evidence for its pathogenesis"
      explanation: A review's interpretation of the basal-layer apoptosis finding as the pathogenic step in DPR.
  - target: Onychodystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed in case discussion; nail-matrix apoptosis has not been examined.
    evidence:
    - reference: PMID:42541155
      reference_title: Dermatopathia pigmentosa reticularis and overlap syndrome in siblings-A rare case report.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: "A deficit in keratin 14 elevates the probability of epidermal cells going through apoptosis, resulting in the skin and nail anomalies characteristic of NFJS/DPR."
      explanation: Authors' synthesis linking keratin 14-related apoptosis to the nail anomalies; not a nail-specific experiment.
  - target: Palmoplantar hyperkeratosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed in case discussion; the keratoderma mechanism has not been examined.
    evidence:
    - reference: PMID:42541155
      reference_title: Dermatopathia pigmentosa reticularis and overlap syndrome in siblings-A rare case report.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: "A deficit in keratin 14 elevates the probability of epidermal cells going through apoptosis, resulting in the skin and nail anomalies characteristic of NFJS/DPR."
      explanation: Authors' synthesis attributing the skin anomalies, including keratoderma, to keratinocyte apoptosis.
- name: Basal Layer Degeneration and Pigment Incontinence
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Biopsies of reticulate pigmented skin show liquefaction or vacuolar degeneration of the basal layer,
    increased basal pigmentation and melanin dropped into the papillary dermis within melanophages. The
    findings are consistent across case reports but are not specific to DPR.
  cell_types:
  - preferred_term: basal cell of epidermis
    term:
      id: CL:0002187
      label: basal cell of epidermis
  - preferred_term: melanophage
    term:
      id: CL:0002060
      label: melanophage
  evidence:
  - reference: PMID:31008174
    reference_title: "Dermatopathia pigmentosa reticularis: A report of a case with delayed onset alopecia and onychodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A biopsy specimen from the reticulate hyperpigmentation on the trunk revealed epidermal atrophy, increased basal layer pigmentation, basal layer degeneration, and the presence of melanophages in dermis."
    explanation: Primary biopsy of a DPR pigmented lesion.
  - reference: PMID:23440032
    reference_title: "Dermatopathia pigmentosa reticularis: A rare reticulate pigmentary disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The typical histopathologic picture of DPR shows liquefaction degeneration of the basal layer and dermal pigmentary incontinence."
    explanation: Summarizes the recurrent histopathology of DPR pigmented skin.
  downstream:
  - target: Reticulate hyperpigmentation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dermal melanin is the histological substrate of the pigmented lesions; why it forms a reticulate pattern
      and why it persists for life in DPR, unlike in NFJS, is unexplained.
    evidence:
    - reference: PMID:27512211
      reference_title: "Dermatopathia Pigmentosa Reticularis: Report of a New Cases and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Histopathology showed hyperkeratosis, basal layer hyperpigmentation with cytoplasmic vacuolization, interface dermatitis, and scattered melanophages within the reticular dermis"
      explanation: Biopsies of the pigmented lesions in two siblings show basal vacuolization with dermal melanophages, the tissue correlate of the pigmentation.
- name: Defective Dermatoglyphic and Sweat Gland Ontogenesis
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Absent dermatoglyphics and abnormal sweating suggest that keratin 14 is needed for epidermal ridge and sweat
    gland development. Dermal ridges and eccrine sweat pores develop together, which would explain why the two
    features co-occur. No developmental study in DPR or NFJS tissue exists.
  biological_processes:
  - preferred_term: sweat gland development
    modifier: ABNORMAL
    term:
      id: GO:0060792
      label: sweat gland development
  evidence:
  - reference: PMID:16960809
    reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "These data suggest that KRT14 plays an important role during ontogenesis of dermatoglyphics and sweat glands."
    explanation: Proposed role inferred from the phenotype of carriers.
  - reference: PMID:23440032
    reference_title: "Dermatopathia pigmentosa reticularis: A rare reticulate pigmentary disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Embryologic development of dermal ridges occurs in conjunction with the eccrine glands and sweat pores are found on the ridges."
    explanation: Developmental background linking ridge and sweat gland formation.
  downstream:
  - target: Adermatoglyphia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Inferred from the co-occurrence of absent dermatoglyphics with KRT14 variants.
    evidence:
    - reference: PMID:16960809
      reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "These data suggest that KRT14 plays an important role during ontogenesis of dermatoglyphics and sweat glands."
      explanation: Links the dermatoglyphic defect to a developmental role of KRT14.
  - target: Hypohidrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Inferred; sweat gland structure and function have not been measured in DPR carriers.
    evidence:
    - reference: PMID:16960809
      reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "These data suggest that KRT14 plays an important role during ontogenesis of dermatoglyphics and sweat glands."
      explanation: Links abnormal sweating to a proposed developmental role of KRT14 in sweat glands.
phenotypes:
- name: Reticulate hyperpigmentation
  category: Dermatologic
  diagnostic: true
  description: >-
    Generalized reticulate brown pigmentation, often predominantly truncal, beginning at birth or in early
    childhood and persisting for life. Lifelong persistence is the main clinical feature separating DPR from
    NFJS, where pigmentation classically fades after puberty.
  phenotype_term:
    preferred_term: Generalized reticulate hyperpigmentation
    term:
      id: HP:0007588
      label: Reticular hyperpigmentation
  evidence:
  - reference: PMID:17958818
    reference_title: Dermatopathia pigmentosa reticularis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reticulate pigmentation occurs at birth or during early childhood."
    explanation: Onset of the defining pigmentation.
  - reference: PMID:31008174
    reference_title: "Dermatopathia pigmentosa reticularis: A report of a case with delayed onset alopecia and onychodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 24-year-old Iraqi man with diffuse reticulate hyperpigmentation that presented at birth and continues throughout adulthood"
    explanation: Congenital pigmentation persisting into adulthood in one patient.
  - reference: PMID:27512211
    reference_title: "Dermatopathia Pigmentosa Reticularis: Report of a New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "DPR has been distinguished from NFJS by the lifelong persistence of the skin hyperpigmentation, partial alopecia, and absence of dental anomalies."
    explanation: Lifelong persistence of pigmentation distinguishes DPR from NFJS.

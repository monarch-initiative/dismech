histopathology:
- name: Basal layer degeneration with dermal melanophages
  description: >-
    Reticulate pigmented skin shows basal layer liquefaction or vacuolar degeneration, increased basal
    pigmentation, pigment incontinence with dermal melanophages and sometimes interface dermatitis. The pattern
    supports but does not establish the diagnosis.
  notes: >-
    No finding term is bound: HP:0034572 Pigment incontinence sits under abnormal skin pigmentation rather than
    the abnormal cell morphology or NCIT histopathology branches this slot admits.
  evidence:
  - reference: PMID:36225994
    reference_title: "Dermatopathia Pigmentosa Reticularis with Addisonian Pigmentation: Atypical Presentation of a Rare Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The histopathology of the reticulate pigmentation of DPR is not diagnostic, and the reported histopathological features include mild orthokeratosis, papillomatosis, heavily pigmented epidermis, liquefaction degeneration of the basal layer, dermal pigmentary incontinence, melanophages, interface dermatitis, and sparse, superficial perivascular inflammations."
    explanation: Summary of reported DPR histopathology and its nondiagnostic nature.
genetic:
- name: KRT14
  gene_term:
    preferred_term: KRT14
    term:
      id: hgnc:6416
      label: KRT14
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    DPR/NFJS alleles are heterozygous nonsense or frameshift variants in the head (E1/V1) domain-encoding region,
    acting by haploinsufficiency as shown for NFJS. They differ from the dominant-negative rod-domain missense
    variants that cause epidermolysis bullosa simplex (kb/disorders/Epidermolysis_Bullosa_Simplex.yaml). The
    recurrent rod-domain variant p.R125C has also been reported in a patient diagnosed with DPR, so the
    head-domain rule describes the molecularly characterized families rather than every published case. No
    ClinGen gene-disease validity classification is recorded here.
  variants:
  - name: p.Arg125Cys (R125C)
    description: >-
      Recurrent KRT14 rod-domain missense variant, best known as a cause of epidermolysis bullosa simplex,
      reported in a Malay patient with a DPR diagnosis who had acral blisters but no alopecia. This allele does
      not fit the head-domain truncation mechanism and the case may represent phenotypic overlap with EBS.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:19040520
      reference_title: A case of dermatopathia pigmentosa reticularis with wiry scalp hair and digital fibromatosis resulting from a recurrent KRT14 mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a patient of Malay ancestry with dermatopathia pigmentosa reticularis (DPR) resulting from a recurrent KRT14 p.R125C mutation."
      explanation: Single-patient report of a rod-domain missense variant with a DPR diagnosis.
  evidence:
  - reference: PMID:16960809
    reference_title: "Naegeli-Franceschetti-Jadassohn syndrome and dermatopathia pigmentosa reticularis: two allelic ectodermal dysplasias caused by dominant mutations in KRT14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous nonsense or frameshift mutations in KRT14 were found to segregate with the disease trait in all five families."
    explanation: Segregation of KRT14 variants in DPR and NFJS families.
  - reference: PMID:27512211
    reference_title: "Dermatopathia Pigmentosa Reticularis: Report of a New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "DPR results from mutations in the KRT14 gene located on chromosome 17."
    explanation: Review confirming KRT14 as the DPR gene.

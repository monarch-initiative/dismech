    refractory segmental or generalized dystonia. Published experience is
    limited to small series and case reports, which report improvement.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_mechanisms:
  - target: Generalized dystonia
    description: >-
      Modulates basal ganglia output; acts at the circuit level and does not
      address the ANO3 defect.
  evidence:
  - reference: PMID:33388357
    reference_title: "The expanding clinical and genetic spectrum of ANO3 dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Half of patients with generalized dystonia experienced deep brain stimulation (DBS). And all of them showed improvement of dystonia by DBS."
    explanation: Pooled literature review of ANO3 cases reporting improvement in all DBS-treated generalized patients.
  - reference: PMID:30712998
    reference_title: "Role of ANO3 mutations in dystonia: A large-scale mutational screening study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, she benefitted from deep brain stimulation."
    explanation: Benefit in a patient with early-onset generalized dystonia and a de novo variant.
  - reference: PMID:31871801
    reference_title: "Successful Pallidal Deep Brain Stimulation Treatment in a Case of Generalized Dystonia due to a Novel ANO3 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ongoing adjustment of stimulation settings and medications led to good and sustained dystonia control; however the patient did suffer short term relapses, manifested as dystonic crisis, which necessitated inpatient admission."
    explanation: Long-term pallidal stimulation outcome in a generalized ANO3 case, including relapses.
  - reference: PMID:42353862
    reference_title: "Clinical and Genetic Spectrum of ANO3-Related Dystonia with Treatment Responses in a Chinese Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral medication and botulinum toxin showed variable benefit, whereas deep brain stimulation was associated with marked improvement in selected medically refractory patients."
    explanation: Marked improvement after DBS in selected refractory patients of an ANO3 cohort.
  - reference: PMID:42353862
    reference_title: "Clinical and Genetic Spectrum of ANO3-Related Dystonia with Treatment Responses in a Chinese Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the patients who received DBS exhibited significant clinical improvement during the follow-up period."
    explanation: Four DBS-treated patients (three subthalamic, one pallidal) all improved.
differential_diagnoses:
- name: Essential tremor
  disease_term:
    preferred_term: essential tremor
    term:
      id: MONDO:0003233
      label: essential tremor
  description: >-
    Tremor can be the sole initial manifestation of ANO3-related dystonia, and
    affected family members have been diagnosed with essential tremor.
  distinguishing_features:
  - Head or voice tremor preceding or exceeding hand tremor.
  - Subtle dystonic posturing, such as mild finger posturing, on careful examination.
  evidence:
  - reference: PMID:24442708
    reference_title: "The phenotypic spectrum of DYT24 due to ANO3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tremor was the sole initial manifestation in some individuals with ANO3 mutations, leading to misdiagnosis as essential tremor."
    explanation: Direct statement of the diagnostic confusion.
- name: Torsion dystonia 6 (DYT-THAP1)
  disease_term:
    preferred_term: torsion dystonia 6
    term:
      id: MONDO:0011264
      label: torsion dystonia 6
  description: >-
    The other dominant isolated dystonia with craniocervical predominance;
    curated as Torsion_Dystonia_6. Tremor as a constant feature favours ANO3.
  distinguishing_features:
  - Tremor in every affected individual favours ANO3.
  - Spread to generalized or multifocal dystonia is more common in DYT6.
  evidence:
  - reference: PMID:24442708
    reference_title: "The phenotypic spectrum of DYT24 due to ANO3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic feature in all affected individuals was the presence of tremor, which contrasts DYT24 from the typical DYT6 phenotype."
    explanation: Names tremor as the feature separating DYT24 from DYT6.
- name: Myoclonus-dystonia syndrome
  disease_term:
    preferred_term: myoclonus-dystonia syndrome
    term:
      id: MONDO:0000903
      label: myoclonus-dystonia syndrome
  description: >-
    ANO3 carriers with superimposed myoclonic jerks can resemble SGCE
    myoclonus-dystonia; curated as Myoclonus_Dystonia_Syndrome.
  distinguishing_features:
  - Familial cervical dystonia with myoclonus, or prominent tremor with mild dystonia, should prompt ANO3 testing.
  evidence:
  - reference: PMID:24442708
    reference_title: "The phenotypic spectrum of DYT24 due to ANO3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with familial cervical dystonia who also have myoclonus-dystonia as well as patients with prominent tremor and mild dystonia should be tested for ANO3 mutations."
    explanation: Recommends ANO3 testing in the myoclonus-dystonia presentation.
- name: Sporadic cervical dystonia
  disease_term:
    preferred_term: cervical dystonia
    term:
      id: MONDO:0000481
      label: cervical dystonia
  description: >-
    Common adult-onset focal cervical dystonia, curated as Cervical_Dystonia, in
    which ANO3 is recorded as a susceptibility gene explaining a small minority
    of cases. A family history, prominent tremor or early onset point towards
    the Mendelian entity.
  distinguishing_features:
  - Familial occurrence with dominant transmission, or a de novo ANO3 variant.
  - Tremulous craniocervical dystonia with laryngeal involvement.
  evidence:
  - reference: PMID:33388357
    reference_title: "The expanding clinical and genetic spectrum of ANO3 dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms a relatively high frequency of rare ANO3 variants in Chinese patients with dystonia and indicates that the late adulthood-onset, cranio-cervical dystonia seems to be an important feature of the ANO3 phenotype."
    explanation: Shows the overlap with late-onset craniocervical dystonia that makes the distinction necessary.
  - reference: PMID:24978640
    reference_title: "Dystonia: an update on phenomenology, classification, pathogenesis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The recently discovered genes ANO3, GNAL and CIZ1 appear not to be a common cause of adult-onset cervical dystonia."
    explanation: >-
      Review summarizing screening studies: ANO3 explains few cases of common
      adult-onset cervical dystonia, which is why the two entities are kept
      separate.
discussions:
- discussion_id: ano3_variant_effect_direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do dystonia-causing ANO3 variants reduce ANO3 function, and does ANO3 act as
    an ion channel at all, or only as a scramblase?
  attaches_to:
  - pathophysiology#Heterozygous ANO3 Variants
  - pathophysiology#Altered ANO3 Calcium-Activated Scramblase Function
  rationale: >-
    The cited functional work measured downstream calcium and potassium
    signalling in fibroblasts and HEK293 cells expressing variants, not the
    scrambling or channel activity of each variant directly, and one variant
    tested deviated only slightly from wild type. The two groups that
    characterized ANO3 itself disagree on whether it conducts ions. The rat
    knockout links complete loss of ANO3 to neuronal hyperexcitability, but
    through sodium-activated potassium channels that the variant study found
    unaffected. Whether heterozygous missense variants act by loss of function,
    dominant-negative interference or altered function is therefore open, and
    the entry leaves functional_impact_category unset for that reason.
  proposed_experiments:
  - experiment_id: ano3_variant_panel_scrambling_and_currents
    name: Direct scramblase and current measurement across a panel of ANO3 variants
    description: >-
      Express wild-type ANO3 and a panel of familial and de novo variants, alone
      and co-expressed with wild type, and measure calcium-activated
      phosphatidylserine exposure, whole-cell currents and surface expression.
    would_support:
    - pathophysiology#Altered ANO3 Calcium-Activated Scramblase Function
    supporting_outcome:
    - >-
      Variants consistently reduce or alter scrambling, and co-expression shows
      whether the effect is dominant over wild type.
    refuting_outcome:
    - >-
      Variants leave scrambling and currents unchanged, which would place the
      lesion elsewhere, for example in protein interactions or trafficking.
  evidence:
  - reference: PMID:36295764
    reference_title: "Investigation of Phosphatidylserine-Transporting Activity of Human TMEM16C Isoforms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to other TMEM16 proteins, flux assays and electrophysiology recording showed TMEM16C does not possess ion-transporting activity."
    explanation: One side of the disagreement on ion conduction.
  - reference: PMID:23532839
    reference_title: "Calcium-dependent phospholipid scramblase activity of TMEM16 protein family members."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "On the other hand, a patch clamp analysis in 293T cells indicated that TMEM16A and 16B, but not other family members, acted as Ca(2+)-dependent Cl(-) channels."
    explanation: Earlier patch-clamp evidence that TMEM16C does not form a calcium-activated chloride channel.
  - reference: PMID:38079528
    reference_title: "Broadening the clinical spectrum: molecular mechanisms and new phenotypes of ANO3-dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified ANO3 as a Ca2+-activated phospholipid scramblase that also conducts ions."
    explanation: The other side of the disagreement.
  - reference: PMID:42353862
    reference_title: "Clinical and Genetic Spectrum of ANO3-Related Dystonia with Treatment Responses in a Chinese Cohort."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Three variants, p.R287Q, p.N648S, and p.S652C, were predicted to align more closely with a gain-of-function (GOF) effect, while p.Y376C, p.I809T, and p.P443L were suggested to correspond to a loss-of-function (LOF) effect."
    explanation: >-
      In silico predictions assign different variants to gain and loss of
      function; the authors state these are not functional validation.
  - reference: PMID:39773217
    reference_title: "Dystonia caused by ANO3 variants is due to attenuated Ca(2+) influx by ORAI1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Remarkably, functional in vitro analysis of ANO3-S116L showed only minor deviations from the normal wild-type ANO3 function, supporting the role of mutated ANO3 for the clinical phenotype."
    explanation: >-
      A disease-associated variant with near-normal function in vitro, which is
      part of why the direction of variant effect is open.
  - reference: PMID:23872594
    reference_title: "TMEM16C facilitates Na(+)-activated K+ currents in rat sensory neurons and regulates pain processing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "DRG from TMEM16C knockout rats had diminished Slack expression, broadened action potentials and increased excitability."
    explanation: Loss-of-function evidence from a knockout, in a different neuron type and through a different potassium channel.
- discussion_id: ano3_no_dystonia_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does a heterozygous patient ANO3 variant make striatal neurons hyperexcitable
    and produce dystonia in a model system?
  attaches_to:
  - pathophysiology#Striatal Neuronal Hyperexcitability
  rationale: >-
    Every measured step of the mechanism is in non-neuronal cells. The step into
    striatal neurons and the step from there to dystonic movement rest on ANO3
    expression in the striatum and on the authors' proposal. No ANO3 animal model
    of dystonia was found; the rodent knockouts in the literature were studied
    for pain and febrile seizures.
  proposed_experiments:
  - experiment_id: ano3_knockin_striatal_physiology
    name: Patient-variant knock-in or iPSC-derived striatal neurons
    description: >-
      Record intrinsic excitability, calcium-activated potassium currents and
      store-operated calcium entry in striatal medium spiny neurons carrying a
      heterozygous patient variant, and assess motor phenotype in a knock-in
      animal.
    would_support:
    - pathophysiology#Striatal Neuronal Hyperexcitability
    supporting_outcome:
    - >-
      Variant-carrying medium spiny neurons show reduced calcium-activated
      potassium current and increased firing, and the animal develops abnormal
      postures or tremor.
    refuting_outcome:
    - >-
      Striatal neurons show normal excitability despite the calcium defect,
      which would point to another cell type or mechanism.
notes: >-
  No GeneReviews chapter is dedicated to this disorder. The GeneReviews
  Monogenic Isolated Dystonia Overview is listed in references; its cached
  abstract does not name ANO3, so it is not used as evidence.

  OMIM 615034 and Orphanet 420485 are the MONDO cross-references for this
  entity. The MONDO term carries an editor note that DOID classifies the disease
  as purely focal; the cited literature describes segmental, multifocal and
  generalized presentations as well.
references:
- reference: PMID:20301334
  title: "Monogenic Isolated Dystonia Overview."
  tags:

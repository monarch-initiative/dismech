      id: HP:0000473
      label: Torticollis
  evidence:
  - reference: PMID:24442708
    reference_title: "The phenotypic spectrum of DYT24 due to ANO3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cervical dystonia was the most common site of onset followed by laryngeal dystonia."
    explanation: Site of onset in the ten patients of the three original families.
  - reference: PMID:42353862
    reference_title: "Clinical and Genetic Spectrum of ANO3-Related Dystonia with Treatment Responses in a Chinese Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ANO3-related dystonia exhibited broad clinical heterogeneity, with frequent cervical involvement (62.5%) and tremulous features (75%), and occasionally extended beyond classical isolated dystonia."
    explanation: >-
      Cervical involvement in 62.5 percent of the variant-carrying dystonia
      patients of a Chinese cohort, the source for the FREQUENT band.
  - reference: PMID:33502045
    reference_title: "Genotype-Phenotype Relations for Isolated Dystonia Genes: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For ANO3, a segmental/multifocal distribution was typical, whereas TOR1A, PRKRA, KMT2B, and HPCA mutation carriers commonly developed generalized dystonia."
    explanation: >-
      Systematic review establishing the typical segmental or multifocal
      distribution.

genetic:
- name: ANO3
  gene_term:
    preferred_term: ANO3
    term:
      id: hgnc:14004
      label: ANO3
  relationship_type: CAUSATIVE
  notes: >-
    ANO3 is hgnc:14004 (previous symbols TMEM16C and C11orf25). The disease is
    defined by this gene in MONDO and OMIM (615034), so the record is typed
    CAUSATIVE for the entity. That typing is not a ClinGen tier: the ClinGen
    Gene-Disease Validity download of 2026-10-08 contains no ANO3 curation, so
    no gene_disease_validity assertion is recorded.

    Validity is genuinely debated. Rare protein-changing ANO3 variants occur in
    population controls and in Parkinson disease patients at rates close to
    those in dystonia cohorts, so a rare variant in a dystonia patient is not by
    itself evidence of pathogenicity; segregation, de novo occurrence or
    functional data are needed. A later Chinese cohort found rare variants
    enriched in dystonia over non-dystonic movement disorder controls, which is
    the stronger case-control signal. Cervical_Dystonia records ANO3 separately
    as SUSCEPTIBILITY for common sporadic cervical dystonia, and that record is
    a different claim from this one.
  evidence:
  - reference: PMID:23200863
    reference_title: "Mutations in ANO3 cause dominant craniocervical dystonia: ion channel implicated in pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that mutations in ANO3 are a cause of autosomal-dominant craniocervical dystonia."
    explanation: Gene identification by linkage, exome sequencing and segregation.
  - reference: PMID:27666935
    reference_title: "Clinical exome sequencing in early-onset generalized dystonia and large-scale resequencing follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reflecting locus heterogeneity, identified unique variants were distributed over 5 genes (GCH1, THAP1, TOR1A, ANO3, ADCY5), of which only 1 (ANO3) was mutated recurrently."
    explanation: Independent exome study finding ANO3 variants recurrently in early-onset generalized dystonia.
  - reference: PMID:42353862
    reference_title: "Clinical and Genetic Spectrum of ANO3-Related Dystonia with Treatment Responses in a Chinese Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rare ANO3 variants were significantly enriched in the dystonia cohort compared with the controls."
    explanation: Case-control enrichment of rare ANO3 variants in dystonia over non-dystonic movement disorder controls.
  - reference: PMID:30712998
    reference_title: "Role of ANO3 mutations in dystonia: A large-scale mutational screening study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms the relatively high frequency of rare, protein-changing ANO3 variants in both dystonia and non-dystonia patients indicating that not all variants contribute to the disease."
    explanation: >-
      Bears against reading any rare ANO3 variant as causal: rare variants were
      found at similar rates in Parkinson disease and dystonia patients.
  - reference: PMID:24151159
    reference_title: "Rare sequence variants in ANO3 and GNAL in a primary torsion dystonia series and controls."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Low frequency missense variants in ANO3 occur in both cases and controls, warranting further assessment of this gene in PTD pathogenesis."
    explanation: >-
      Rare ANO3 missense variants were found in population controls as well as
      in dystonia cases.
treatments:
- name: Botulinum toxin chemodenervation
  description: >-
    Intramuscular botulinum toxin for focal and segmental dystonia and tremor.
    Benefit in ANO3-related dystonia is variable.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: botulinum toxin chemodenervation
    term:
      id: NCIT:C157775
      label: Botulinum Toxin Therapy
  target_mechanisms:
  - target: Cervical dystonia
    description: >-
      Weakens the dystonic muscles at the neuromuscular junction; symptomatic,
      and downstream of every mechanism node in the entry.
  evidence:
  - reference: PMID:42353862
    reference_title: "Clinical and Genetic Spectrum of ANO3-Related Dystonia with Treatment Responses in a Chinese Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral medication and botulinum toxin showed variable benefit, whereas deep brain stimulation was associated with marked improvement in selected medically refractory patients."
    explanation: Retrospective treatment review in an ANO3 cohort reporting variable benefit from botulinum toxin.
  - reference: PMID:42353862
    reference_title: "Clinical and Genetic Spectrum of ANO3-Related Dystonia with Treatment Responses in a Chinese Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, botulinum toxin appeared to be more advantageous for patients suffering from focal dystonia, particularly those with cervical or craniofacial involvement (see Figure 4C,D)."
    explanation: Benefit concentrated in focal cervical and craniofacial dystonia in five treated patients.
  notes: >-
    therapeutic_modality is OTHER because botulinum neurotoxin is a large
    bacterial protein, so neither SMALL_MOLECULE nor PEPTIDE fits.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous ANO3 variants segregate dominantly in the families in which the
    gene was identified. A substantial share of later cases, particularly
    childhood-onset generalized presentations, carry de novo variants.
  evidence:
  - reference: PMID:23200863
    reference_title: "Mutations in ANO3 cause dominant craniocervical dystonia: ion channel implicated in pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that mutations in ANO3 are a cause of autosomal-dominant craniocervical dystonia."
    explanation: >-
      The gene-identification study, based on linkage and segregation in an
      autosomal dominant kindred, states the mode of inheritance.
  - reference: PMID:24442708
    reference_title: "The phenotypic spectrum of DYT24 due to ANO3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, pathogenic mutations in the anoctamin 3 gene (ANO3) have been identified to cause autosomal dominant craniocervical dystonia and have been assigned to the dystonia locus dystonia-24 (DYT24)."
    explanation: >-
      Follow-up clinical study of the three original families restating the
      dominant transmission and the DYT24 locus assignment.
  - reference: PMID:30712998
    reference_title: "Role of ANO3 mutations in dystonia: A large-scale mutational screening study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further, we identified a patient with early-onset, generalized dystonia with a de-novo variant in ANO3 (p.Val561Glu)."
    explanation: >-
      Documents a de novo heterozygous variant, consistent with dominant action
      of a single altered allele in sporadic early-onset cases.
- name: Incomplete penetrance
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  description: >-
    Unaffected carriers and apparently skipped generations are reported, so a
    negative family history does not exclude the diagnosis. No numeric
    penetrance estimate exists, and some asymptomatic carriers in cohort
    screens may carry variants that are not pathogenic.
  evidence:
  - reference: PMID:42353862
    reference_title: "Clinical and Genetic Spectrum of ANO3-Related Dystonia with Treatment Responses in a Chinese Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the remaining eight families, the carriers demonstrated asymptomatic presentation, regardless of paternal or maternal lineage."
    explanation: >-
      Asymptomatic parental carriers in eight trio families. Read with care:
      most of these variants were of uncertain significance, so this bears on
      penetrance only for those that are pathogenic.
  - reference: PMID:23200863
    reference_title: "Mutations in ANO3 cause dominant craniocervical dystonia: ion channel implicated in pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although both individuals are now deceased and could not be examined, this suggests the possibility that penetrance might not be complete."
    explanation: >-
      A reportedly affected great-grandmother with an apparently unaffected
      grandmother in the second original family.
pathophysiology:
- name: Heterozygous ANO3 Variants
  biological_scale: MOLECULAR
  description: >-
    Heterozygous ANO3 variants, almost all missense, spread across the protein
    rather than clustered in one domain. The two original familial variants lie
    in exon 15; many later childhood-onset variants are de novo, and one review
    proposes that variants near the scrambling domain track the more severe
    early-onset phenotype. The functional impact category is left unset on
    purpose: whether pathogenic variants reduce or alter ANO3 function is
    disputed (see the knowledge-gap discussion).
  genetic_context:
    variant_origin: GERMLINE
  molecular_functions:
  - preferred_term: ANO3 calcium-activated phospholipid scramblase activity
    modifier: ABNORMAL
    term:
      id: GO:0017128
      label: phospholipid scramblase activity
  genes:
  - preferred_term: ANO3
    term:
      id: hgnc:14004
      label: ANO3
  downstream:
  - target: Altered ANO3 Calcium-Activated Scramblase Function
    description: >-
      Disease variants change the behaviour of a calcium-activated scramblase
      expressed in the endoplasmic reticulum and plasma membrane.
  evidence:
  - reference: PMID:23200863
    reference_title: "Mutations in ANO3 cause dominant craniocervical dystonia: ion channel implicated in pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent screening of these candidate causal variants in a large number of familial and sporadic cases of cervical dystonia led to the identification of a total of six putatively pathogenic mutations in ANO3, a gene encoding a predicted Ca(2+)-gated chloride channel that we show to be highly expressed in the striatum."
    explanation: >-
      Original report of heterozygous ANO3 variants in familial and sporadic
      cervical dystonia.
  - reference: PMID:33388357
    reference_title: "The expanding clinical and genetic spectrum of ANO3 dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined with our work and literature review, a total of 35 different rare variants distributed in ANO3 were identified in 62 dystonia patients."
    explanation: >-
      Quantifies the variant spectrum across the published cases and shows the
      variants are distributed along the gene.
  - reference: PMID:38284143
    reference_title: "The Clinical Spectrum of ANO3-Report of a New Family and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stratification by age at onset divided ANO3 cases into two major groups, where younger patients displayed a more severe phenotype, probably due to variants near the scrambling domain."
    explanation: >-
      Literature review proposing that variant position, near the scrambling
      domain, tracks the more severe early-onset phenotype. Stated by the
      authors as probable, not established.
- name: Altered ANO3 Calcium-Activated Scramblase Function
  biological_scale: MOLECULAR
  description: >-
    ANO3 is a calcium-activated phospholipid scramblase of the TMEM16 family,
    present largely in intracellular membranes. One group reports that it also
    conducts ions; another, studying human TMEM16C isoforms, found scrambling but
    no ion transport. How disease variants change scrambling itself has not been
    measured directly in the cited studies; what has been measured is their
    effect on cellular calcium signalling, recorded in the next node.
  molecular_functions:
  - preferred_term: calcium-activated phospholipid scramblase activity
    modifier: ABNORMAL
    term:
      id: GO:0017128
      label: phospholipid scramblase activity
  downstream:
  - target: Impaired Endoplasmic Reticulum Calcium Release and Store-Operated Calcium Entry
    description: >-
      Cells expressing disease variants show reduced store release and strongly
      reduced store-operated calcium entry, attributed to reduced plasma membrane
      expression of the ORAI1 channel.
    evidence:
    - reference: PMID:39773217
      reference_title: "Dystonia caused by ANO3 variants is due to attenuated Ca(2+) influx by ORAI1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The data provide evidence for a strongly impaired expression of store-operated ORAI1 Ca2+ influx channels in the plasma membrane of cells expressing ANO3 variants."
      explanation: >-
        Links the variant protein to the calcium-entry defect through reduced
        surface ORAI1, which is the proposed mechanism of this edge.
  evidence:
  - reference: PMID:38079528
    reference_title: "Broadening the clinical spectrum: molecular mechanisms and new phenotypes of ANO3-dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified ANO3 as a Ca2+-activated phospholipid scramblase that also conducts ions."
    explanation: >-
      Cell-based characterization of ANO3 function used as the baseline against
      which disease variants were compared.
  - reference: PMID:36295764
    reference_title: "Investigation of Phosphatidylserine-Transporting Activity of Human TMEM16C Isoforms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unlike previous results, our data showed that human TMEM16C isoform 1 and isoform 3 exposed PS to the cell surface."
    explanation: >-
      Independent confirmation in 293T cells that human TMEM16C isoforms scramble
      phosphatidylserine to the cell surface. The same study did not detect ion
      transport, which is recorded in the knowledge-gap discussion.
  - reference: PMID:23532839
    reference_title: "Calcium-dependent phospholipid scramblase activity of TMEM16 protein family members."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We expressed other TMEM16 proteins in the TMEM16F(-/-) cells and found that not only TMEM16F, but also 16C, 16D, 16G, and 16J work as lipid scramblases with different preference to lipid substrates."
    explanation: >-
      First demonstration that TMEM16C (ANO3) is a calcium-dependent lipid
      scramblase, in a scramblase-null mouse lymphocyte line.
  - reference: PMID:38657371
    reference_title: "VSI: The anoctamins: Structure and function: \"Intracellular\" anoctamins."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Probably all intracellular anoctamins except of ANO8 operate as intracellular phospholipid (PL) scramblases, allowing for Ca2+-activated, passive transport of phospholipids like phosphatidylserine between both membrane leaflets."
    explanation: >-
      Review placing ANO3 among the intracellular anoctamins that act as
      calcium-activated scramblases.
- name: Impaired Endoplasmic Reticulum Calcium Release and Store-Operated Calcium Entry
  biological_scale: CELLULAR
  description: >-
    The most reproducible cellular finding. Calcium imaging of patient
    fibroblasts in the gene-identification study showed abnormal endoplasmic
    reticulum dependent calcium signalling, and a later study of four further
    variants found that store release and, above all, store-operated calcium
    entry through ORAI1 were strongly inhibited in cells expressing the
    variants. Measured in fibroblasts and HEK293 cells, not in neurons.
  biological_processes:
  - preferred_term: store-operated calcium entry
    modifier: DECREASED
    term:
      id: GO:0002115
      label: store-operated calcium entry
  - preferred_term: endoplasmic reticulum calcium ion homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
  cell_types:
  - preferred_term: patient-derived fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Impaired Activation of Calcium-Dependent Potassium Channels
    description: >-
      The reduced calcium signal fails to activate KCa3.1 channels, while
      sodium-activated potassium channels are spared.
    evidence:
    - reference: PMID:39773217
      reference_title: "Dystonia caused by ANO3 variants is due to attenuated Ca(2+) influx by ORAI1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Upon expression, emptying of the endoplasmic reticulum Ca2+ store (store release) and particularly store-operated Ca2+ entry (SOCE) were strongly inhibited, leading to impaired activation of KCa3.1 (KCNN) K+ channels, but not of Na+-activated K+ channels (KNa; SLO2)."
      explanation: >-
        States the causal step from the store-release and entry defect to the
        potassium channel defect, and its selectivity for KCa3.1.
  evidence:
  - reference: PMID:23200863
    reference_title: "Mutations in ANO3 cause dominant craniocervical dystonia: ion channel implicated in pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies using Ca(2+) imaging in case and control fibroblasts demonstrated clear abnormalities in endoplasmic-reticulum-dependent Ca(2+) signaling."
    explanation: >-
      First functional observation, in fibroblasts from a variant carrier.
      Graded IN_VITRO because this sentence reports a cultured-cell assay; the
      genetic findings of the same paper are graded HUMAN_CLINICAL elsewhere in
      this entry.
  - reference: PMID:39773217
    reference_title: "Dystonia caused by ANO3 variants is due to attenuated Ca(2+) influx by ORAI1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon expression, emptying of the endoplasmic reticulum Ca2+ store (store release) and particularly store-operated Ca2+ entry (SOCE) were strongly inhibited, leading to impaired activation of KCa3.1 (KCNN) K+ channels, but not of Na+-activated K+ channels (KNa; SLO2)."
    explanation: >-
      Measures inhibited store release and store-operated calcium entry in
      cells expressing four disease variants.
- name: Impaired Activation of Calcium-Dependent Potassium Channels
  biological_scale: CELLULAR
  description: >-
    Cells expressing ANO3 variants show compromised activation of the
    calcium-dependent potassium channel KCa3.1. In rat sensory neurons ANO3
    instead supports the sodium-activated potassium channel Slack (KCNT1), and
    its loss there raises excitability; in the dystonia-variant study the
    sodium-activated channels were not affected, so which potassium current
    matters in the striatum is not established.
  molecular_functions:
  - preferred_term: activation of calcium-activated potassium channel (KCa3.1)
    modifier: DECREASED
    term:
      id: GO:0015269
      label: calcium-activated potassium channel activity
  downstream:
  - target: Striatal Neuronal Hyperexcitability
    description: >-
      Proposed rather than measured: loss of a calcium-activated potassium
      conductance would depolarize the membrane and raise excitability of
      striatal neurons, where ANO3 expression is highest.
    evidence:
    - reference: PMID:38079528
      reference_title: "Broadening the clinical spectrum: molecular mechanisms and new phenotypes of ANO3-dystonia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "In the brain striatal cells of affected patients, impaired activation of KCa3.1 channels due to compromised Ca2+ signals may lead to depolarized membrane voltage and neuronal hyperexcitability and may also lead to reduced cellular viability, as shown in the present study."
      explanation: >-
        The authors' proposal for this edge. Marked INDIRECT because the
        measurements were made in fibroblasts and HEK293 cells, not in striatal
        neurons.
  evidence:
  - reference: PMID:38079528
    reference_title: "Broadening the clinical spectrum: molecular mechanisms and new phenotypes of ANO3-dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Impaired Ca2+ signalling and compromised activation of Ca2+-dependent K+ channels were detected in cells expressing ANO3 variants."
    explanation: >-
      Direct measurement of the potassium channel defect in variant-expressing
      cells.
- name: Striatal Neuronal Hyperexcitability
  biological_scale: CELLULAR
  description: >-
    The inferred cellular substrate of the movement disorder. ANO3 is expressed
    most highly in the striatum, and loss of ANO3 raises excitability in rat
    sensory neurons, but hyperexcitability of striatal neurons carrying a
    disease variant has not been demonstrated. A PubMed search for ANO3 with
    mouse, mice or knockout returned no animal model of dystonia. The step from
    this node to dystonic movement is likewise inferred, and the edges to the
    movement phenotypes below are uncited for that reason.
  cell_types:
  - preferred_term: striatal medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  downstream:
  - target: Cervical dystonia
  - target: Laryngeal dystonia
  - target: Tremor
  - target: Head tremor
  - target: Postural tremor
  - target: Craniofacial dystonia
  - target: Oromandibular dystonia
  - target: Writer's cramp
  - target: Blepharospasm
  - target: Upper limb dystonia
  - target: Leg dystonia
  - target: Axial dystonia
  - target: Myoclonus
  - target: Generalized dystonia
  - target: Paroxysmal dystonia
  - target: Chorea
  evidence:
  - reference: PMID:41400152
    reference_title: "Developmental, Neuroanatomical and Cellular Expression of Genes Causing Dystonia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Individual genes exhibiting differences in expression across adult brain regions include SQSTM1, SGCE, KMT2B, PRKRA, YY1, DNAJC12, KCNA1, CACNA1A (highest expression in cerebellum), ADCY5, GNAL, ANO3 (highest expression in striatum), RHOBTB2, FOXG1 (highest expression in cerebral cortex)."
    explanation: >-
      Places ANO3 expression highest in the striatum in a reanalysis of human
      brain transcriptomic datasets, which is the basis for locating this node
      there. INDIRECT because expression does not show dysfunction.
  - reference: PMID:23872594
    reference_title: "TMEM16C facilitates Na(+)-activated K+ currents in rat sensory neurons and regulates pain processing."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "DRG from TMEM16C knockout rats had diminished Slack expression, broadened action potentials and increased excitability."
    explanation: >-
      Loss of ANO3 raises neuronal excitability in the knockout rat. INDIRECT
      because these are dorsal root ganglion neurons, the potassium channel
      involved (Slack) differs from the one implicated by the dystonia-variant
      study, and complete knockout may not model a heterozygous missense
      variant.
  - reference: PMID:39773217
    reference_title: "Dystonia caused by ANO3 variants is due to attenuated Ca(2+) influx by ORAI1."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Dysregulated Ca2+ signaling by ANO3 variants may impair the activation of K+ channels in striatal neurons of the brain, thereby causing dystonia."
    explanation: >-
      The authors' conclusion connecting the cell-line findings to striatal
      neurons and to dystonia, stated as a possibility.
phenotypes:
- category: Neurologic
  name: Cervical dystonia
  description: >-
    The most common site of onset and the core of the original phenotype,
    often tremulous. Dystonia usually spreads slowly to a segmental or
    multifocal distribution rather than generalizing.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Cervical dystonia

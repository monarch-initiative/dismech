name: Dystonia 24
creation_date: "2026-10-08T13:31:10Z"
category: Mendelian
synonyms:
- DYT24
- DYT-ANO3
- ANO3 dystonic disorder
- ANO3-related dystonia
- dystonia type 24
- dystonic disorder caused by mutation in ANO3
description: >-
  An autosomal dominant dystonia caused by heterozygous variants in ANO3, which
  encodes anoctamin 3 (TMEM16C), a calcium-activated member of the TMEM16
  family of phospholipid scramblases and ion channels that is most highly
  expressed in the striatum. The originally described phenotype, in a British
  kindred and two further families, is craniocervical dystonia with prominent
  tremor: cervical dystonia, laryngeal dystonia and upper-limb dystonic tremor,
  sometimes with blepharospasm, oromandibular involvement and superimposed
  myoclonic jerks. Onset ranges from early childhood to late adulthood, spread
  is usually to a segmental or multifocal distribution, and tremor can precede
  any visible dystonia, which leads to misdiagnosis as essential tremor.

  Later reports, many of them de novo missense variants in children, broadened
  the phenotype to early-onset generalized dystonia, paroxysmal dystonia,
  myoclonic dystonia, truncal dystonia, chorea, parkinsonism, hypotonia,
  developmental delay and mild intellectual disability.
  Whether all of these belong to one disease is not settled; they are recorded
  here as phenotypes of the gene-defined entity with their sources, without
  frequency where no cohort figure exists. Brain MRI is normal in the
  reported families.

  The mechanism is the least settled part of the entry. The best-supported chain
  runs from altered ANO3 function through impaired endoplasmic reticulum calcium
  release and store-operated calcium entry to failed activation of
  calcium-dependent potassium channels, and from there, by inference, to
  hyperexcitability of striatal neurons. Every step up to the potassium channel
  has been measured in patient fibroblasts or transfected cell lines; the step
  into striatal neurons and the step from there to dystonia have not been
  demonstrated in neurons, tissue or an animal model. Whether ANO3 itself
  conducts ions, and whether disease variants act by loss of function, are
  disputed, and both questions are recorded as knowledge gaps rather than
  resolved here.

  Gene-disease validity is also contested. Rare protein-changing ANO3 variants
  are found in controls and in other movement disorders at an appreciable rate,
  so not every rare variant reported in a dystonia patient is pathogenic.

  Relationship to Cervical_Dystonia: that entry covers common sporadic adult
  focal cervical dystonia and types ANO3 as a SUSCEPTIBILITY gene explaining a
  small minority of unselected cases. This entry is the Mendelian entity
  itself. The two share a phenotypic region and are not merged.

  No pathophysiology node declares conforms_to: kb/modules/ has no module for
  dystonia, basal ganglia motor network dysfunction or anoctamin scramblase
  biology.

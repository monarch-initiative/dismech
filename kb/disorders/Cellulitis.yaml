name: Cellulitis
creation_date: "2026-09-29T18:04:43Z"
description: >-
  Cellulitis is an acute bacterial infection of the deep dermis and
  subcutaneous tissue, most often a nonpurulent beta-hemolytic streptococcal
  infection that follows a skin barrier breach and is promoted by chronic edema
  or lymphatic and venous drainage impairment.
category: Infectious Disease
disease_term:
  preferred_term: cellulitis
  term:
    id: MONDO:0005230
    label: cellulitis
parents:
- Bacterial infection
synonyms:
- Bacterial cellulitis
- Nonpurulent cellulitis
notes: >-
  This entry is scoped to nonpurulent cellulitis as a deep dermal and
  subcutaneous infection, distinct from the more superficial Erysipelas entry.
  Site-specific named variants (periorbital/preseptal, orbital, and
  diabetic-foot cellulitis) are treated as separate named entities and are out
  of scope here. Cellulitis is an acquired infection with no RO:0004003 causal
  gene on MONDO:0005230, so there are no human disease genes to model.
infectious_agent:
- name: Streptococcus pyogenes
  infectious_agent_term:
    preferred_term: Streptococcus pyogenes
    term:
      id: NCBITaxon:1314
      label: Streptococcus pyogenes
  description: >-
    Streptococcus pyogenes is the dominant group A representative of the
    beta-hemolytic streptococci that cause nonpurulent cellulitis.
  evidence:
  - reference: PMID:42727947
    reference_title: Advances in the diagnosis and management of skin and soft tissue infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Non-purulent SSTI is most commonly associated with beta-haemolytic
      streptococci, while purulent SSTI is typically associated with
      Staphylococcus aureus Cellulitis most commonly presents with acute warmth,
      pain, tenderness to palpation, erythema, and oedema.
    explanation: >-
      This review identifies beta-hemolytic streptococci as the usual microbial
      group for nonpurulent cellulitis.
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus, including methicillin-resistant strains, is most
    relevant when a cellulitis presentation is purulent or accompanied by an
    abscess.
  evidence:
  - reference: PMID:42727947
    reference_title: Advances in the diagnosis and management of skin and soft tissue infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Non-purulent SSTI is most commonly associated with beta-haemolytic
      streptococci, while purulent SSTI is typically associated with
      Staphylococcus aureus Cellulitis most commonly presents with acute warmth,
      pain, tenderness to palpation, erythema, and oedema.
    explanation: >-
      This review places S. aureus on the purulent end of the cellulitis and
      skin-abscess spectrum.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:27864837
      reference_title: "Risk factors for nonpurulent leg cellulitis: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Nonpurulent cellulitis is an acute bacterial infection of the dermal and
        subdermal tissues that is not associated with purulent drainage,
        discharge or abscess.
      explanation: >-
        The systematic review frames cellulitis as an acute bacterial skin and
        subcutaneous-tissue infection, supporting Harrison's Infectious Diseases
        classification.
transmission:
- name: Entry Through Skin Barrier Breaches
  description: >-
    Cellulitis is usually seeded when beta-hemolytic streptococci or
    Staphylococcus aureus on the skin surface reach normally sterile dermis or
    subcutis through a wound, ulcer, excoriating dermatosis, toe-web fissure, or
    other epithelial break.
  evidence:
  - reference: PMID:27864837
    reference_title: "Risk factors for nonpurulent leg cellulitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinicians should consider the treatment of modifiable risk factors
      including leg oedema, wounds, ulcers, areas of skin breakdown and toe-web
      intertrigo while administering antibiotic treatment for NPLC.
    explanation: >-
      Identifies wounds, ulcers, skin breakdown, and toe-web intertrigo as
      modifiable portal-of-entry lesions for nonpurulent leg cellulitis.
pathophysiology:
- name: Skin Barrier Portal of Entry
  role: trigger
  description: >-
    Wounds, ulcers, tinea pedis, toe-web maceration, excoriating dermatoses, or
    other breaks in the epidermal barrier create portals through which skin
    bacteria can reach the deep dermis and subcutis.
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Bacterial Proliferation in Deep Dermis and Subcutis
    description: >-
      Loss of epithelial integrity lets beta-hemolytic streptococci or
      S. aureus seed normally sterile deeper skin and subcutaneous tissue.
  evidence:
  - reference: PMID:27864837
    reference_title: "Risk factors for nonpurulent leg cellulitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinicians should consider the treatment of modifiable risk factors
      including leg oedema, wounds, ulcers, areas of skin breakdown and toe-web
      intertrigo while administering antibiotic treatment for NPLC.
    explanation: >-
      This meta-analysis ties multiple portal-of-entry lesions, including
      wounds, leg ulcers, excoriating dermatoses, and tinea pedis, to increased
      odds of nonpurulent leg cellulitis.
- name: Impaired Lymphatic and Venous Drainage
  role: trigger
  description: >-
    Chronic leg edema, lymphedema, venous insufficiency, obesity, or saphenous
    vein harvest impair local fluid clearance and immune surveillance, lowering
    the threshold for deep dermal and subcutaneous infection after bacterial
    entry.
  locations:
  - preferred_term: lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  - preferred_term: hypodermis
    term:
      id: UBERON:0002072
      label: hypodermis
  cell_types:
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  downstream:
  - target: Bacterial Proliferation in Deep Dermis and Subcutis
    description: >-
      Local stasis creates a permissive tissue context for bacteria introduced
      through the skin barrier.
  - target: Recurrent Cellulitis Loop
    description: >-
      Persistent drainage impairment remains after an acute episode and
      predisposes the same limb to later cellulitis recurrence.
  evidence:
  - reference: PMID:27864837
    reference_title: "Risk factors for nonpurulent leg cellulitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinicians should consider the treatment of modifiable risk factors
      including leg oedema, wounds, ulcers, areas of skin breakdown and toe-web
      intertrigo while administering antibiotic treatment for NPLC.
    explanation: >-
      The review identifies leg edema as a modifiable cellulitis risk factor
      alongside barrier-disrupting lesions.
  - reference: PMID:29427797
    reference_title: "Severe lower limb cellulitis: defining the epidemiology and risk factors for primary episodes in a population-based case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      several conditions with lower limb pathology were independently associated
      with LLC, including varicose veins (AOR 2.95, 95% CI 2.50-3.48, p <
      0.001), lymphoedema (AOR 2.65, 95% CI 1.71-4.10, p < 0.001), tinea pedis
      (AOR 3.05, 95% CI 1.45-6.42, p 0.003), and saphenous vein harvest during
      coronary artery bypass grafting (AOR 1.74, 95% CI 1.32-2.30, p < 0.001).
    explanation: >-
      A large population-based study links first lower-limb cellulitis episodes
      to venous, lymphatic, and surgical drainage-impairment risk factors.
- name: Bacterial Proliferation in Deep Dermis and Subcutis
  role: cause
  description: >-
    Beta-hemolytic streptococci, and S. aureus in purulent presentations,
    proliferate in the deep dermis and subcutaneous tissue and expose the host
    to Gram-positive pathogen-associated molecular patterns and secreted
    virulence factors.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: hypodermis
    term:
      id: UBERON:0002072
      label: hypodermis
  biological_processes:
  - preferred_term: defense response to Gram-positive bacterium
    modifier: INCREASED
    term:
      id: GO:0050830
      label: defense response to Gram-positive bacterium
  downstream:
  - target: Innate Inflammatory Edema and Cellulitis Plaque
    description: >-
      Local bacterial growth and recognition of Gram-positive microbial products
      recruit neutrophils and inflammatory cytokine signaling.
  evidence:
  - reference: PMID:42727947
    reference_title: Advances in the diagnosis and management of skin and soft tissue infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Skin and soft tissues infections (SSTIs) are common conditions, affecting
      millions worldwide. SSTIs range from uncomplicated cellulitis to
      necrotizing fasciitis and can be divided into non-purulent and purulent
      forms.
    explanation: >-
      This review places uncomplicated cellulitis in the skin and soft-tissue
      infection spectrum.
- name: Streptolysin S-Amplified Streptococcal Cytotoxicity
  role: modifier
  description: >-
    In hypervirulent group A Streptococcus, covR mutant derepression of the
    cytolytic peptide streptolysin S increases keratinocyte and macrophage death
    and augments interleukin-1 beta release, enlarging local soft-tissue
    lesions in a mouse subcutaneous infection model.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  downstream:
  - target: Innate Inflammatory Edema and Cellulitis Plaque
    description: >-
      Toxin-amplified host-cell death intensifies local tissue injury and
      cytokine-driven innate inflammation.
  evidence:
  - reference: PMID:41175456
    reference_title: Differential expression profile of streptolysin S in the covR and covS mutants of group A Streptococcus is a mediator of keratinocyte death and aggressive local infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, SLS in the ∆covR mutant contributed to increased macrophage cell
      death and elevated IL-1β levels.
    explanation: >-
      The model directly links streptolysin S to macrophage death and IL-1 beta
      induction in a group A streptococcal subcutaneous-infection context.
  - reference: PMID:41175456
    reference_title: Differential expression profile of streptolysin S in the covR and covS mutants of group A Streptococcus is a mediator of keratinocyte death and aggressive local infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In a mouse subcutaneous infection model, the SLS-deficient ∆covR
      mutant exhibited reduced lesion size and mortality compared to the
      ∆covR mutant
    explanation: >-
      Loss of SLS reduced lesion size and mortality relative to covR mutant GAS,
      supporting a causal role for SLS in aggressive local soft-tissue injury.
- name: Innate Inflammatory Edema and Cellulitis Plaque
  role: outcome
  description: >-
    Acute innate inflammation in infected deep dermis and subcutis increases
    vascular permeability, edema, and local nociceptor activation, creating the
    poorly demarcated unilateral erythema, warmth, swelling, pain, and
    tenderness that define cellulitis clinically.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: hypodermis
    term:
      id: UBERON:0002072
      label: hypodermis
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Poorly demarcated erythema
    description: >-
      Increased dermal vascular permeability and inflammatory hyperemia produce
      the cardinal acute erythema of the cellulitis plaque.
  - target: Localized edema
    description: >-
      Increased vascular permeability drives fluid extravasation into the
      involved skin and subcutis, producing the swollen plaque.
  - target: Localized pain and tenderness
    description: >-
      Local nociceptor activation by inflammatory mediators produces the pain
      and tenderness to palpation of the affected area.
  evidence:
  - reference: PMID:42727947
    reference_title: Advances in the diagnosis and management of skin and soft tissue infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cellulitis most commonly presents with acute warmth, pain, tenderness to
      palpation, erythema, and oedema.
    explanation: >-
      The review lists the acute inflammatory signs that constitute the
      cellulitis presentation.
- name: Recurrent Cellulitis Loop
  role: outcome
  description: >-
    After an initial lower-extremity cellulitis episode, residual lymphatic or
    edema-promoting tissue damage keeps the affected limb in a high-risk state,
    making recurrence the strongest predictor of later recurrence.
  locations:
  - preferred_term: lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  downstream: []
  evidence:
  - reference: PMID:27864837
    reference_title: "Risk factors for nonpurulent leg cellulitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An increased risk of developing NPLC was associated with previous
      cellulitis [odds ratio (OR) 40.3, 95% confidence interval (CI)
      22.6-72.0]
    explanation: >-
      The meta-analysis quantifies previous cellulitis as by far the strongest
      risk factor for a further episode, supporting a self-reinforcing
      recurrence loop in the affected limb.

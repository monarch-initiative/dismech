diagnosis:
- name: Clinical Diagnosis with Abscess and Mimic Exclusion
  description: >-
    Cellulitis is diagnosed clinically from unilateral erythema, warmth, edema,
    and tenderness, with bedside imaging or consultation used selectively to
    exclude abscess, deep infection, or common noninfectious mimics.
  evidence:
  - reference: PMID:42727947
    reference_title: Advances in the diagnosis and management of skin and soft tissue infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Laboratory testing is of limited use in most patients. Point-of-care
      ultrasound is useful for distinguishing cellulitis from abscess if the
      diagnosis is unclear.
    explanation: >-
      The review supports a primarily clinical diagnosis while identifying
      ultrasound as a selective discriminator from abscess.
  - reference: PMID:27806170
    reference_title: Costs and Consequences Associated With Misdiagnosed Lower Extremity Cellulitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inflammatory dermatoses of the lower extremity are often misdiagnosed as
      cellulitis (aka "pseudocellulitis") and treated with antibiotics and/or
      hospitalization.
    explanation: >-
      Misdiagnosis of lower-extremity inflammatory dermatoses supports explicit
      exclusion of noninfectious cellulitis mimics.
  - reference: PMID:30914341
    reference_title: The ALT-70 cellulitis model maintains predictive value at 24 and 48 hours after presentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ALT-70 predictive model offers an objective tool to help differentiate
      between cellulitis and other clinically similar conditions at the time of
      initial emergency department (ED) presentation.
    explanation: >-
      The ALT-70 model is a validated bedside score for distinguishing true
      lower-extremity cellulitis from its mimics at presentation.
treatments:
- name: Acute Antibiotic Therapy for Nonpurulent Cellulitis
  description: >-
    Empiric oral beta-lactam therapy such as cephalexin targets the
    beta-hemolytic streptococci presumed to cause uncomplicated nonpurulent
    cellulitis, with MRSA-active coverage reserved for selected purulent or
    risk-enriched presentations.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Bacterial Proliferation in Deep Dermis and Subcutis
    treatment_effect: INHIBITS
    description: >-
      Antibiotics reduce the local bacterial burden driving acute dermal and
      subcutaneous inflammation.
  evidence:
  - reference: PMID:28535235
    reference_title: "Effect of Cephalexin Plus Trimethoprim-Sulfamethoxazole vs Cephalexin Alone on Clinical Cure of Uncomplicated Cellulitis: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients with uncomplicated cellulitis, the use of cephalexin plus
      trimethoprim-sulfamethoxazole compared to cephalexin alone did not result
      in higher rates of clinical resolution of cellulitis in the per-protocol
      analysis.
    explanation: >-
      This randomized trial supports streptococcal-targeted beta-lactam therapy
      as sufficient for many uncomplicated cellulitis cases without abscess.
- name: Penicillin V Recurrence Prophylaxis
  description: >-
    Low-dose phenoxymethylpenicillin suppresses recurrent leg cellulitis while
    the patient remains on prophylaxis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: phenoxymethylpenicillin
      term:
        id: CHEBI:27446
        label: phenoxymethylpenicillin
  target_mechanisms:
  - target: Bacterial Proliferation in Deep Dermis and Subcutis
    treatment_effect: INHIBITS
    description: >-
      Penicillin prophylaxis suppresses recurrent beta-hemolytic streptococcal
      infection of vulnerable lower-extremity tissue.
  evidence:
  - reference: PMID:23635049
    reference_title: Penicillin to prevent recurrent leg cellulitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with recurrent cellulitis of the leg, penicillin was effective
      in preventing subsequent attacks during prophylaxis, but the protective
      effect diminished progressively once drug therapy was stopped.
    explanation: >-
      PATCH I directly supports prophylactic penicillin for recurrent leg
      cellulitis and records that its protective effect wanes after withdrawal.
- name: Compression Therapy for Chronic Leg Edema
  description: >-
    Compression garments address chronic leg edema, a modifiable substrate for
    recurrent cellulitis, and lower recurrence in patients with chronic edema
    and prior leg cellulitis.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Compression Therapy
    term:
      id: NCIT:C157735
      label: Compression Therapy
  target_mechanisms:
  - target: Impaired Lymphatic and Venous Drainage
    treatment_effect: MODULATES
    description: >-
      Compression reduces chronic edema and thereby treats one of the local
      susceptibility states upstream of recurrent infection.
  evidence:
  - reference: PMID:32786188
    reference_title: Compression Therapy to Prevent Recurrent Cellulitis of the Leg.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this small, single-center, nonblinded trial involving patients with
      chronic edema of the leg and cellulitis, compression therapy resulted in a
      lower incidence of recurrence of cellulitis than conservative treatment.
    explanation: >-
      This randomized trial supports compression therapy for reducing recurrent
      cellulitis in chronic leg edema.
animal_models:
- name: GAS covR mutant mouse subcutaneous infection
  species: Mouse
  genotype: Group A Streptococcus covR/covS mutant derivatives (wild type, ∆covR, ∆covS, SLS-deficient ∆covR)
  publication: PMID:41175456
  description: >-
    Mouse subcutaneous infection with covR/covS regulatory mutants of group A
    Streptococcus, used to dissect how streptolysin S expression drives local
    soft-tissue lesion size and host-cell death.
  modeled_mechanisms:
  - target: Streptolysin S-Amplified Streptococcal Cytotoxicity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      SLS-deficient ∆covR bacteria produce smaller lesions and lower mortality
      than SLS-competent ∆covR bacteria, isolating streptolysin S as a driver of
      keratinocyte and macrophage death and IL-1 beta release.
    limitations: >-
      This is a pathogen-virulence model of a hypervirulent covR mutant lineage
      and does not capture the two dominant human drivers of cellulitis,
      impaired lymphatic or venous drainage and episode recurrence; most human
      nonpurulent cellulitis is not caused by covR mutant strains.
    evidence:
    - reference: PMID:41175456
      reference_title: Differential expression profile of streptolysin S in the covR and covS mutants of group A Streptococcus is a mediator of keratinocyte death and aggressive local infection.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In a mouse subcutaneous infection model, the SLS-deficient ∆covR
        mutant exhibited reduced lesion size and mortality compared to the
        ∆covR mutant
      explanation: >-
        The model ties streptolysin S to larger local lesions and higher
        mortality in a group A streptococcal subcutaneous infection, grounding
        the streptolysin S cytotoxicity node.

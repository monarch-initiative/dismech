  - target: Tetralogy of Fallot
    description: Disrupted cardiac developmental programs contribute to congenital heart defects, predominantly tetralogy of Fallot.
  - target: Limb anomalies
    description: Disrupted limb developmental programs contribute to anomalies of the extremities.

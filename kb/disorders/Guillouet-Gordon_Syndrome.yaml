    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:40081376
    reference_title: "Bi-allelic MED16 variants cause a MEDopathy with intellectual disability, motor delay, and craniofacial, cardiac, and limb malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunofluorescence assays demonstrated protein mislocalization from the nucleus to the cytoplasm for 16 of the 17 variants studied."
    explanation: Establishes nuclear-to-cytoplasmic mislocalization as the disease mechanism for most MED16 variants.
  downstream:
  - target: Multisystem developmental dysregulation
    description: >-
      MED16 mislocalization disrupts Mediator-dependent transcription across neurodevelopmental,
      craniofacial, cardiac, and limb developmental programs.
- name: Multisystem developmental dysregulation
  description: >
    Downstream of MED16 mislocalization, developmental gene-expression programs are dysregulated
    across multiple systems, producing intellectual disability, speech and motor delay,
    craniofacial defects (micro/retrognathia, cleft palate, preauricular tags), extremity
    anomalies, congenital heart defects (predominantly tetralogy of Fallot), visual impairment,
    and deafness.

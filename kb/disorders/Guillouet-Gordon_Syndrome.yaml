name: Guillouet-Gordon Syndrome
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- GGNS
- MED16-related MEDopathy
- MED16-related multiple congenital anomalies-intellectual disability syndrome
description: >
  Guillouet-Gordon syndrome (GGNS) is a rare autosomal recessive multiple congenital
  anomalies-intellectual disability syndrome caused by biallelic variants in MED16, a subunit
  of the tail module of the Mediator transcriptional coactivator complex. First described in
  2025, it is the most recently delineated MEDopathy. Intellectual disability, speech delay,
  and/or motor delay of variable severity are constant, associated with variable combinations
  of craniofacial defects (micro/retrognathia, cleft palate, preauricular tags), anomalies of
  the extremities, and heart defects (predominantly tetralogy of Fallot); visual impairment,
  deafness, and MRI abnormalities are also frequent. Most disease-causing variants cause
  nuclear-to-cytoplasmic mislocalization of MED16, and med16 zebrafish and Med16 knockout mice
  confirm a conserved developmental requirement.

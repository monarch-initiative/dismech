pathophysiology:
- name: MED16 Mediator mislocalization
  description: >
    MED16 is a subunit of the tail module of the Mediator complex. Most disease-causing
    variants cause mislocalization of MED16 from the nucleus to the cytoplasm, and 3D modeling
    indicates a destabilizing effect on protein structural elements, disrupting
    Mediator-dependent transcription of developmental gene-expression programs. Homozygous
    med16 zebrafish and Med16 knockout mice confirm a conserved developmental requirement.
    MED16 belongs to the group of Mediator complex-associated disease genes.

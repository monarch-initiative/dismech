    reference_title: Bi-allelic MED16 variants cause a MEDopathy with intellectual disability, motor delay,
      and craniofacial, cardiac, and limb malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 26 variants identified were comprised of eight predicted protein-truncating (three intragenic
      deletions, two frameshifts, and one nonsense and two essential splice site variants) and 18 missense
      or in-frame duplication variants affecting conserved residues
    explanation: Establishes molecular genetic sequencing as the primary diagnostic method for identifying
      biallelic protein-truncating and missense MED16 variants.

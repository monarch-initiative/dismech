- name: Absent Surface CD25 and Loss of the High-Affinity IL-2 Receptor
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    CD25 transduces no signal itself. Together with CD122 and the common gamma
    chain it confers high-affinity IL-2 binding, so without it only the
    intermediate-affinity beta/gamma receptor remains and IL-2 capture at low
    cytokine concentrations fails. Signaling through the shared beta and gamma
    chains by other cytokines, notably IL-15, is preserved.
  molecular_functions:

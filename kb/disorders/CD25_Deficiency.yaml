- name: Loss of Peripheral Immune Tolerance
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    With Treg suppression compromised and autoreactive clones spared from
    deletion, peripheral tolerance fails and activated cytotoxic T cells attack
    self tissue. In the best-characterised patient, activated CD8+STAT5+ cells
    with lytic potential infiltrated the skin while FOXP3+ Tregs were still
    present, which is the clearest single demonstration that the Treg compartment
    in this disease is inadequate rather than absent.
  cell_types:
  - preferred_term: effector T cell
    term:
      id: CL:0000911
      label: effector T cell
  biological_processes:
  - preferred_term: peripheral tolerance induction
    term:
      id: GO:0002465
      label: peripheral tolerance induction
    modifier: DECREASED
  evidence:
  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activated CD8(+)STAT5(+) T cells with lytic potential infiltrated the skin, even though FOXP3(+) Tregs were present and maintained a higher capacity to respond to IL-2 compared to other T-cell subsets."
    explanation: >-
      Shows tolerance failing in tissue despite the presence of FOXP3+ Tregs,
      the substance of this node.
  downstream:

- name: IL2RA sequencing
  description: >-
    Sequence analysis should cover coding exons and splice junctions and include validated copy-number analysis for exon-level or whole-gene deletions. Targeted panels, exome sequencing and NGS read-depth analysis have identified disease alleles. Family segregation and functional studies help interpret variant-specific consequences.
  diagnosis_term:
    preferred_term: IL2RA sequencing
  results: Biallelic loss-of-function IL2RA variants
  evidence:
  - reference: PMID:41659858
    reference_title: "Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis using the next-generation sequencing primary immunodeficiency panel revealed a novel homozygous frameshift mutation in IL2RA (c.166delC; p.R56fs), which was confirmed by Sanger sequencing."
    explanation: Documents the panel-based route to molecular diagnosis.
  - reference: PMID:41694357
    reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For Case 2, NGS read-depth analysis identified a homozygous multi-exon deletion in IL2RA, corresponding at the cDNA level to c.557_795-1625del."
    explanation: >-
      The case for including copy-number analysis: this allele was found by read
      depth, not by variant calling on sequence alone.
- name: Screen IL2RA when IPEX is suspected but FOXP3 is normal
  description: >-
    Because the clinical picture is IPEX-like, the practical diagnostic rule is
    that a patient with IPEX features and a normal FOXP3 gene should be screened
    for IL2RA variants.
  diagnosis_term:
    preferred_term: IL2RA screening in FOXP3-normal IPEX-like disease
  evidence:
  - reference: PMID:17196245
    reference_title: "CD25 deficiency causes an immune dysregulation, polyendocrinopathy, enteropathy, X-linked-like syndrome, and defective IL-10 expression from CD4 lymphocytes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Any patient with features of IPEX but with a normal Foxp3 gene should be screened for mutations in the IL-2 receptor subunit CD25."
    explanation: The source's own clinical implication, stated as a screening rule.
    quote_role: BACKGROUND
- name: Genetic testing for neonatal or syndromic autoimmune diabetes
  description: Include IL2RA in monogenic neonatal-diabetes panels and consider it in childhood diabetes accompanied by enteropathy, endocrinopathy or immune dysregulation. GAD positivity does not exclude a monogenic immune cause.
  diagnosis_term:
    preferred_term: IL2RA analysis in neonatal or syndromic autoimmune diabetes
  evidence:
  - reference: PMID:41758964
    reference_title: Biallelic Pathogenic Variants in IL2RA Cause Neonatal-Onset Monogenic Autoimmune Diabetes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: IL2RA should be included in gene panels for neonatal diabetes, and testing should be considered in children with diabetes and immunodysregulatory features.
    explanation: Clinical implication of the disease-specific diabetes series.
- name: Functional immune characterization
  description: Evaluate IL-2 dose-dependent STAT5 phosphorylation, antigen and mitogen proliferation, lymphocyte subsets, immunoglobulins and specific antibody responses. Compare with appropriate controls and use CD25-independent markers when enumerating Tregs. Normal total counts, high IgG or preserved PHA responses do not exclude disease.
  diagnosis_term:
    preferred_term: Functional immune characterization in suspected CD25 deficiency
  evidence:
  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT

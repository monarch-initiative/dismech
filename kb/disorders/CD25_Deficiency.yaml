      explanation: >-
        Directly measures the loss of IL-2-induced STAT5 phosphorylation in the
        CD25-null patient's CD4+ T cells.
- name: Raised IL-2 Signaling Threshold with Deficient STAT5 Activation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In patient T cells the IL-2 concentration required to phosphorylate STAT5 is
    raised across every subset. The hierarchy is preserved rather than abolished:
    CD4+FOXP3+ cells still respond first, but only at medium and high IL-2, and
    never to the level of healthy controls. Because Tregs normally depend on
    continuous low-concentration IL-2, they bear the brunt of the shift.
  cell_types:

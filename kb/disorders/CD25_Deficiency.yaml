      explanation: >-
        Measures the antigen-specific response failure in cells carrying the
        signaling defect of this node.
  - target: Impaired NK Cell Maturation
    causal_link_type: DIRECT
    description: >-
      CD56bright NK cells constitutively express CD25, so the loss of

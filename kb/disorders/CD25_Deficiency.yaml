treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic HSCT can provide durable clinical and immune correction. The 2026 Saudi sibling study reports transplantation at 12 and 21 years, with sustained recovery at six and five years respectively. Treg enumeration was not performed, so restoration of that compartment is a mechanistic rationale rather than a directly measured result in those siblings. Reported risks include graft failure or rejection, viral reactivation and acute or chronic graft-versus-host disease; the diabetes series includes a death after transplantation.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Impaired Regulatory T Cell Suppression
    treatment_effect: RESTORES
    description: >-
      Donor-derived immune cells can restore functional CD25-dependent regulation; the precise contribution of Treg reconstitution was not quantified in the Saudi sibling study.
    evidence:
    - reference: PMID:41659858
      reference_title: "Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hematopoietic stem cell transplantation (HSCT) remains the only curative treatment that aims to restore normal immune function by reconstituting a healthy Treg compartment."
      explanation: >-
        States the mechanism of benefit as reconstitution of the Treg compartment,
        which is what this link asserts.
      quote_role: BACKGROUND
  evidence:
  - reference: PMID:41659858
    reference_title: "Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The younger sibling received marrow from a matched unrelated donor and achieved full donor chimerism with complete clinical and immunological recovery, remaining well 6 years after HSCT."
    explanation: Reports a long-term clinical and immunological recovery after transplant.
  - reference: PMID:30742970
    reference_title: "CD25 deficiency: A new conformational mutation prevents the receptor expression on cell surface."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The early clinical and molecular diagnosis of CD25 deficiency in this patient promptly led to hematopoietic stem cell transplantation (HSCT), allowing complete resolution of the symptoms and definitive cure of the disease."
    explanation: >-
      An independent report of cure after transplant, and the argument for early
      diagnosis.
  - reference: PMID:41376159
    reference_title: Gene-corrected regulatory T cell therapy for IL2RA deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Definitive treatment is currently limited to allogeneic hematopoietic stem cell transplantation, which carries significant morbidity and mortality risks."
    explanation: >-
      Confirms transplantation as the only definitive treatment while stating its
      risk, the reason alternatives are being developed.
    quote_role: BACKGROUND
  - reference: PMID:41659858
    reference_title: 'Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review.'
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: regulatory T-cell (Treg) enumeration was not performed for both patients
    explanation: Explicit limitation on claims about measured Treg reconstitution.
- name: Sirolimus
  description: >-
    Sirolimus has been used as part of combination immunosuppression. In the S166N patient, skin lesions improved when rapamycin was added to mycophenolate; increased FOXP3-positive proportions were an associated observation. The Y41S patient improved on a regimen combining corticosteroids, rapamycin, IVIG and antibiotic prophylaxis. These uncontrolled combinations do not establish a sirolimus-specific effect or correction of the IL2RA defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

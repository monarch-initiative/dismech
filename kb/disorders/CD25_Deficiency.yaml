    explanation: The Y41S case limits a requirement for abnormal mitogen proliferation.
- name: Glucose Surveillance
  description: ClinGen recommends glucose monitoring in individuals with biallelic pathogenic or likely pathogenic IL2RA variants who have not developed diabetes. Those first diagnosed through diabetes warrant assessment for immune, lymphoproliferative and other autoimmune manifestations.

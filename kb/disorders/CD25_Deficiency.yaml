animal_models:
- name: Il2ra knockout mouse
  species: Mouse
  genotype: Il2ra-null (IL-2R alpha-deficient)
  publication: PMID:7584142
  description: >-
    Mice lacking IL-2R alpha develop normal T and B cells when young, then as
    adults show massive peripheral lymphoid enlargement with polyclonal T and B
    expansion correlated with impaired activation-induced cell death, and later
    autoimmune disease including hemolytic anemia and inflammatory bowel disease.
    The model is the source of the interpretation that the chain regulates the size
    and content of the lymphoid compartment by setting the balance between clonal
    expansion and death after activation.
  modeled_mechanisms:
  - target: Defective Activation-Induced and Thymic T Cell Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the failure of activation-induced T cell death, with
      the polyclonal lymphoid expansion it predicts.
    limitations: >-
      The mouse phenotype is adult-onset and dominated by lymphoproliferation with
      colitis and hemolytic anemia, where the human disease presents in infancy and
      is dominated by enteropathy, eczema, endocrine autoimmunity and infections
      the mouse is not reported to acquire. The cited work measures
      activation-induced death in the periphery, while the human thymic bcl-2 and
      apoptosis defect is documented separately in patient thymus, so the two lines
      of evidence are concordant rather than identical.
    evidence:
    - reference: PMID:7584142
      reference_title: Interleukin-2 receptor alpha chain regulates the size and content of the peripheral lymphoid compartment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, as adults, these mice develop massive enlargement of peripheral lymphoid organs associated with polyclonal T and B cell expansion, which, for T cells, is correlated with impaired activation-induced cell death in vivo."
      explanation: >-
        Reports the apoptosis defect and the lymphoid expansion in the knockout,
        which is what makes it informative for this node.
  evidence:
  - reference: PMID:7584142
    reference_title: Interleukin-2 receptor alpha chain regulates the size and content of the peripheral lymphoid compartment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Older IL-2R alpha-deficient mice also develop autoimmune disorders, including hemolytic anemia and inflammatory bowel disease."
    explanation: >-
      Establishes that the knockout develops autoimmunity, so it is informative for
      the disease as well as for the apoptosis lesion, while naming organ targets
      that only partly match the human ones.
discussions:
- discussion_id: tregs_present_but_inadequate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is the regulatory T cell compartment in CD25 deficiency inadequate to
    prevent autoimmunity when FOXP3+ Tregs are present, are bona fide by FOXP3
    locus demethylation and surface phenotype, and remain the T cell subset most
    responsive to IL-2?
  attaches_to:
  - pathophysiology#Regulatory T Cell Deficiency and Dysfunction
  - pathophysiology#Loss of Peripheral Immune Tolerance
  rationale: >-
    In the most fully studied patient, FOXP3+ Tregs were present with a normal
    surface phenotype, retained the highest IL-2 responsiveness of any subset, and
    were still unable to prevent activated cytotoxic cells from infiltrating skin.
    Two candidate explanations are on the table and are not resolved: the Treg
    fraction is reduced relative to the whole lymphocyte compartment, so the
    suppressive capacity may simply be outnumbered by an expanded effector pool;
    or the residual intermediate-affinity signaling is qualitatively insufficient
    for Treg stability and function even where cell numbers look adequate. Reported
    Treg counts vary widely between patients, from extremely low to preserved,
    which is itself unexplained and blocks a simple numerical account.
  evidence:
  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activated CD8(+)STAT5(+) T cells with lytic potential infiltrated the skin, even though FOXP3(+) Tregs were present and maintained a higher capacity to respond to IL-2 compared to other T-cell subsets."
    explanation: >-
      States the paradox this gap is about: tolerance failed in tissue while Tregs
      were present and comparatively IL-2 responsive.
  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall these results indicated that peripheral Tregs were present in the patient despite the absence of a functional CD25, albeit at an overall reduced level in total lymphocytes."
    explanation: >-
      Supplies the numerical half of the candidate explanation, the reduced Treg
      share of total lymphocytes.
- discussion_id: mouse_lymphoproliferation_vs_human_infection
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the Il2ra knockout mouse present as adult-onset lymphoproliferation
    with colitis and hemolytic anemia, while human CD25 deficiency presents in
    infancy with enteropathy, endocrine autoimmunity and infections the mouse is
    not reported to acquire?
  attaches_to:
  - pathophysiology#Defective Activation-Induced and Thymic T Cell Apoptosis
  - pathophysiology#Recurrent and Persistent Viral, Bacterial and Fungal Infection
  rationale: >-
    The knockout is genuinely informative for the apoptosis lesion, and the
    autoimmune and lymphoproliferative arms are concordant in kind. What the mouse
    does not reproduce is the timing or the infectious arm: the human disease
    declares itself in the first months of life and its most consistently reported
    complication is persistent cytomegalovirus infection, which has no counterpart
    in the published description of the knockout. Without a model of the infectious
    susceptibility, the relative contributions of failed antigen-specific expansion
    and of impaired NK cell maturation to it cannot be separated experimentally.
  evidence:
  - reference: PMID:7584142
    reference_title: Interleukin-2 receptor alpha chain regulates the size and content of the peripheral lymphoid compartment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Young mice that lack IL-2R alpha have phenotypically normal development of T and B cells."
    explanation: >-
      Establishes the timing mismatch: the mouse is phenotypically normal young,
      where the human disease presents in infancy.
  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the main clinical manifestations of the patient, other than autoimmunity, was chronic viral infections especially CMV."
    explanation: >-
      Establishes the human arm with no reported murine counterpart, chronic
      cytomegalovirus infection.
notes: >-
  Scope and named-entity discipline. This entry is the Mendelian recessive
  disease caused by biallelic IL2RA loss of function (MONDO:0011664,
  immunodeficiency 41, OMIM 606367). It is not the far larger literature on
  common non-coding IL2RA polymorphisms as susceptibility alleles for type 1
  diabetes, multiple sclerosis, Graves disease and alopecia areata, which is a
  separate polygenic relationship and is deliberately excluded: no
  susceptibility-association paper is cited anywhere in this entry. The
  neighbouring monogenic entities IL2RB (CD122) deficiency and STAT5B deficiency
  were likewise kept out of the evidence base except where a source studies CD25
  deficiency itself alongside them, which is the case for PMID:29988287, where
  the CD25-deficient and STAT5B-deficient patients are reported separately and
  only the CD25 findings are used here.

  Treg numbers. Reported Treg counts differ between patients, from an extremely
  low count in the Argentine patient to preserved frequencies within purified
  CD4+ cells in the Italian patient. The entry records the reduced proportion as
  a laboratory phenotype and states the variability rather than picking one
  figure, and the unresolved question is filed as a knowledge gap.

  Evidence base and gaps. The entry rests on the founding report (Sharfe 1997,
  PMID:9096364, with the thymic apoptosis mechanism stated in PMID:10879793),
  the case that named the IPEX-like syndrome (Caudy 2007, PMID:17196245), the
  deepest immunological characterisation (Goudy 2013, PMID:23416241), the
  follicular bronchiolitis case (PMID:24116927), the conformational-mutation
  case with cure after transplant (Vignoli 2019, PMID:30742970), the two 2026
  case series with long-term transplant follow-up and a literature review
  (PMID:41659858, PMID:41694357), the systematic description of the diabetes
  phenotype (PMID:41758964), the NK maturation study (PMID:29988287), the
  gene-corrected Treg manufacturing work (PMID:41376159), the Il2ra knockout
  mouse (PMID:7584142) and one review for the receptor architecture
  (PMID:19348914).

  Not cited, and why. PMID:31605764, "Effective and safe treatment of a novel
  IL2RA deficiency with rapamycin", is the one paper whose title states exactly
  what a curator would want for the sirolimus entry. Two fetches, including one
  with the full-text route attempted, returned a record with no quotable text
  (content_type: unavailable), so nothing in it can be a snippet and it is left
  as a lead for a curator with full-text access; the sirolimus claims here are
  quoted from PMID:23416241 instead. PMID:36195682 and PMID:29252577 report
  further patients, a splice-donor variant with a metabolic presentation and
  severe dry eye respectively, and are not cited because no claim in this entry
  needed them; they are also leads.

  No GeneReviews chapter exists for CD25 or IL2RA deficiency. A PubMed
  genereviews[book] title search for CD25, IL2RA, interleukin-2 receptor and
  IPEX returns exactly one chapter, the one for IPEX syndrome, which is the FOXP3
  disease and not this one. That chapter is therefore not the phenotype baseline
  here and is not cited.

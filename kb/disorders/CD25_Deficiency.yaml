name: CD25 Deficiency
creation_date: "2026-09-24T19:23:48Z"
category: Mendelian
disease_term:
  preferred_term: CD25 deficiency
  term:
    id: MONDO:0011664
    label: immunodeficiency due to CD25 deficiency
synonyms:
- immunodeficiency due to CD25 deficiency
- IL2RA deficiency
- interleukin-2 receptor alpha chain deficiency
- immunodeficiency 41 with lymphoproliferation and autoimmunity
- IMD41
description: >-
  CD25 deficiency is an autosomal recessive inborn error of immunity caused by biallelic loss-of-function IL2RA variants. Reduced or absent surface CD25 impairs high-affinity IL-2 capture, while signaling through the CD122/CD132 receptor remains possible at higher IL-2 concentrations. Impaired regulatory T-cell function coexists with deficient antigen-specific immunity and, in some patients, cytokine-associated CD8 T-cell expansion and tissue infiltration. FOXP3-positive regulatory T cells can persist; defective thymic selection and activation-induced apoptosis are not established universal mechanisms. Clinical expression varies from early enteropathy and eczema to neonatal autoimmune diabetes, other endocrinopathies, cytopenias and recurrent infections. Lymphadenopathy, hepatosplenomegaly and inflammatory lung disease may accompany the immune dysregulation. Flow cytometry, functional testing and comprehensive IL2RA analysis establish the diagnosis. Immunosuppression and supportive care can control manifestations; allogeneic hematopoietic stem cell transplantation can provide durable immune correction. Gene-corrected autologous regulatory T cells remain investigational.
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:41659858
      reference_title: "Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "IL2RA (CD25) deficiency is a rare autosomal recessive inborn error of immunity."
      explanation: >-
        An inborn error of immunity with autoimmunity is clinically an
        immune-mediated disorder, the home of Harrison's immune/rheumatologic
        part.
      quote_role: REVIEW_SYNTHESIS
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      The disease is a monogenic autosomal recessive Mendelian disorder, so the
      genetics part of Harrison's also applies.
  iuis_category:
    classification_value: immune dysregulation
    notes: >-
      In the IUIS inborn-errors-of-immunity classification CD25 deficiency sits
      among the diseases of immune dysregulation (Tregopathies) beside FOXP3,
      STAT5B, CTLA4 and LRBA defects, rather than among the combined
      immunodeficiencies.
    evidence:
    - reference: PMID:41659858
      reference_title: "Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This disorder is characterized by defective Treg cell homeostasis and function, which leads to profound immune dysregulation."
      explanation: >-
        Names defective regulatory T cell homeostasis and function as the
        defining lesion, which is the IUIS immune-dysregulation category.
      quote_role: REVIEW_SYNTHESIS
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic disease-causing IL2RA variants can be homozygous or compound heterozygous. Consanguinity is frequent in reported families but is not required. Genetically confirmed heterozygous parents in the diabetes series were clinically unaffected; intermediate CD25 expression alone suggests but does not prove carrier status. If both parents carry a pathogenic allele, each pregnancy has a 25% probability of inheriting both alleles. Penetrance has not been quantified in an unselected population.
  evidence:
  - reference: PMID:41659858
    reference_title: "Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interleukin-2 receptor alpha chain (IL2RA, CD25) deficiency is a rare autosomal recessive inborn error of immunity characterized by profound immune dysregulation, susceptibility to infections, and autoimmunity."
    explanation: States the autosomal recessive inheritance of the disease.
    quote_role: BACKGROUND
  - reference: PMID:41694357
    reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "flow cytometry showed a complete absence of CD25 expression on CD4+ T cells in both children, whereas relatives displayed intermediate levels compatible with carrier status"
    explanation: >-
      Intermediate expression in relatives is compatible with carrier status; the Moroccan study did not genotype all relatives.
  - reference: PMID:41758964
    reference_title: Biallelic Pathogenic Variants in IL2RA Cause Neonatal-Onset Monogenic Autoimmune Diabetes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: This is supported by all the parents who are carriers of an IL2RA recessive variant being clinically unaffected.
    explanation: Clinically unaffected confirmed carriers support recessive inheritance.
genetic:
- name: IL2RA
  gene_term:
    preferred_term: IL2RA
    term:
      id: hgnc:6008
      label: IL2RA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    IL2RA loss of function is definitively associated with autosomal recessive CD25 deficiency. Coding missense and nonsense variants, frameshift indels, splice-altering variants and exon-level or whole-gene deletions are reported. Protein abundance, surface localization and residual receptor function vary by allele; a final-exon frameshift can retain low surface expression. Common regulatory IL2RA susceptibility alleles represent a separate complex-trait association. A UK Biobank rare-variant burden analysis found no significant association between heterozygous truncating or predicted damaging missense variants and tested IMD41 features after multiple-testing correction; this does not establish complete absence of heterozygous effects in every setting.
  variants:
  - name: Biallelic loss-of-function IL2RA variants
    description: >-
      Disease-associated alleles carried in trans impair CD25 expression or function. Individual variants require separate classification; not every IL2RA loss-of-function annotation establishes pathogenicity.
    evidence:
    - reference: PMID:41376159
      reference_title: Gene-corrected regulatory T cell therapy for IL2RA deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Bi-allelic germline deficiency of IL2RA causes a rare autoimmune disease with impaired regulatory T cell (Treg) function and interleukin-2 (IL-2) signaling."
      explanation: >-
        States the biallelic germline loss-of-function mechanism and its
        functional consequence for Treg biology.
      quote_role: BACKGROUND
  - name: c.166delC (p.R56fs)
    description: >-
      Novel homozygous frameshift allele in two siblings from one family, both
      of whom were transplanted. Nomenclature follows the source.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:41659858
      reference_title: "Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis revealed a novel homozygous frameshift variant in IL2RA (c.166delC; p.R56fs)."
      explanation: Reports the frameshift allele in the sibling pair.
  - name: c.65-2A>G
    description: >-
      Homozygous canonical splice-acceptor substitution in one Moroccan family, reported as likely pathogenic. RNA splicing was predicted but not directly assayed; no exact exon consequence is inferred here.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:41694357
      reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Targeted next-generation sequencing identified two novel IL2RA variants: a splice-site mutation (c.65-2A>G) and a multi-exon deletion (c.557_795-1625del), both leading to loss of functional CD25."
      explanation: >-
        Reports the splice-site allele and, in the same sentence, the structural
        null allele curated below.
  - name: c.557_795-1625del
    description: >-
      Homozygous multi-exon deletion in a second, unrelated Moroccan family, detected by NGS read depth and reported as pathogenic. The source describes partial exon 4 and exons 5–7 involvement; its HGVS notation is retained as reported, without claiming independently resolved breakpoints or measured nonsense-mediated decay.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:41694357
      reference_title: 'Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: For Case 2, NGS read-depth analysis identified a homozygous multi-exon deletion in IL2RA, corresponding at the cDNA level to c.557_795-1625del.
      explanation: Read-depth evidence for a multi-exon deletion; no priority claim over other structural alleles.
  - name: c.497G>A (p.Ser166Asn)
    description: Homozygous missense allele with absent surface CD25 but preserved intracellular protein and transcript in activated patient T cells.
    evidence:
    - reference: PMID:23416241
      reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The patient was homozygous for a c.497G>A transition in exon 4, leading to an amino acid substitution at codon 166 (S166N) of the protein.
      explanation: Homozygous missense allele with absent surface CD25 but preserved intracellular protein and transcript in activated patient T cells.
  - name: c.504C>A (p.Cys168Ter)
    description: Homozygous nonsense allele reported as likely pathogenic in a child with granulomatous hepatitis. Protein truncation and degradation were predicted; surface expression was not directly assayed in that report.
    evidence:
    - reference: PMID:35968218
      reference_title: 'Granulomatous hepatitis in a Saudi child with IL2RA defect: a case report and literature review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: we observed a novel, homozygous, and likely pathogenic c.504 C>A variant located in the exon 4 region of the IL2RA gene
      explanation: Homozygous nonsense allele reported as likely pathogenic in a child with granulomatous hepatitis. Protein truncation and degradation were predicted; surface expression was not directly assayed in that report.
    clinical_significance: LIKELY_PATHOGENIC
  - name: c.64+1G>A
    description: Homozygous canonical splice-donor variant in the Pakistani patient with enteropathy and metabolic decompensation; classified as likely pathogenic by the authors.
    evidence:
    - reference: PMID:36195682
      reference_title: Whole exome sequencing identified a novel splice donor site variant in interleukin 2 receptor alpha chain.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Clinical whole exome sequencing revealed a novel splice donor site variant (NM_001378789.1 (NP_001365718); c.64 + 1G > A) in the IL-2Rα gene.
      explanation: Homozygous canonical splice-donor variant in the Pakistani patient with enteropathy and metabolic decompensation; classified as likely pathogenic by the authors.
    clinical_significance: LIKELY_PATHOGENIC
  - name: p.Trp177Ter and c.800delA in trans
    description: Compound heterozygous alleles in three siblings used for gene-correction studies. The figure legend and ClinGen identify c.530G>A for p.Trp177Ter; some main-text passages reverse this substitution. The final-exon deletion causes a frameshift with an extended C terminus and residual surface expression.
    evidence:
    - reference: PMID:29995861
      reference_title: Reprogramming human T cell function and specificity with non-viral genome targeting.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The mother possessed a single heterozygous mutation (c.530G>A) in exon 4 of IL2RA, resulting in a premature stop codon.
      explanation: Compound heterozygous alleles in three siblings used for gene-correction studies. The figure legend and ClinGen identify c.530G>A for p.Trp177Ter; some main-text passages reverse this substitution. The final-exon deletion causes a frameshift with an extended C terminus and residual surface expression.
  - name: Whole-gene deletion
    description: A homozygous whole-gene deletion was among the five newly identified individuals in the diabetes series; this expands the structural-variant class beyond the Moroccan multi-exon allele.
    evidence:
    - reference: PMID:41758964
      reference_title: Biallelic Pathogenic Variants in IL2RA Cause Neonatal-Onset Monogenic Autoimmune Diabetes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Four were homozygous (two protein-truncating, one whole-gene deletion, one missense), and one was compound heterozygous for a protein-truncating and a missense variant.
      explanation: A homozygous whole-gene deletion was among the five newly identified individuals in the diabetes series; this expands the structural-variant class beyond the Moroccan multi-exon allele.
  evidence:
  - reference: PMID:9096364
    reference_title: Human immune disorder arising from mutation of the alpha chain of the interleukin-2 receptor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here a novel human immune aberration arising from a truncation mutation of the interleukin-2 receptor alpha chain (CD25), a subunit of the tripartite high-affinity receptor for interleukin 2."
    explanation: >-
      The founding report establishing that a mutation of the IL-2 receptor alpha
      chain causes a human immune disorder.
  - reference: PMID:41758964
    reference_title: Biallelic Pathogenic Variants in IL2RA Cause Neonatal-Onset Monogenic Autoimmune Diabetes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We found no evidence that heterozygous IL2RA protein-truncating variants or putatively damaging missense variants are at increased risk of features of IMD41, including diabetes
    explanation: Rare-variant burden tests in 401,535 European-ancestry UK Biobank participants were negative after correction; distinct from common susceptibility alleles.

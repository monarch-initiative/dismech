diagnosis:
- name: Flow cytometry for surface CD25 on T cells
  description: >-
    Flow cytometry should assess CD25 on resting and stimulated T cells. Absent or markedly reduced expression supports IL2RA deficiency, but residual expression occurs and does not exclude it. Intermediate expression in relatives suggests carrier status and requires molecular confirmation. FOXP3-positive Tregs may persist; gates requiring CD25 cannot quantify the CD25-negative regulatory lineage.
  diagnosis_term:
    preferred_term: flow cytometric assessment of surface CD25 expression
  markers: Surface CD25 (IL-2R alpha) on CD4+ and activated T cells
  results: Absent or markedly reduced surface CD25; residual expression does not exclude disease
  evidence:
  - reference: PMID:41694357
    reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Simple flow cytometric assessment of CD25 on T cells is a valuable screening tool, and early genetic confirmation is crucial to guide timely hematopoietic stem cell transplantation and genetic counselling."

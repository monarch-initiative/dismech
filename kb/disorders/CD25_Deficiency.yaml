  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the highest percentage of CD4+FOXP3+ T cells (14.4%) was detected within three weeks of rapamycin treatment."
    explanation: >-

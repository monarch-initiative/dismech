animal_models:
- name: Il2ra knockout mouse
  species: Mouse
  genotype: Il2ra-null (IL-2R alpha-deficient)
  publication: PMID:7584142
  description: >-
    Mice lacking IL-2R alpha develop normal T and B cells when young, then as
    adults show massive peripheral lymphoid enlargement with polyclonal T and B
    expansion correlated with impaired activation-induced cell death, and later
    autoimmune disease including hemolytic anemia and inflammatory bowel disease.
    The model is the source of the interpretation that the chain regulates the size
    and content of the lymphoid compartment by setting the balance between clonal
    expansion and death after activation.
  modeled_mechanisms:
  - target: Impaired Peripheral Activation-Induced T Cell Death
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the failure of activation-induced T cell death, with
      the polyclonal lymphoid expansion it predicts.
    limitations: >-
      The finding is peripheral activation-induced death in a whole-gene-null mouse. Human thymic BCL2 findings are a different process, and the S166N patient did not show a general peripheral apoptotic defect. Infection susceptibility and clinical onset differ from the reported human spectrum.
    evidence:
    - reference: PMID:7584142
      reference_title: Interleukin-2 receptor alpha chain regulates the size and content of the peripheral lymphoid compartment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, as adults, these mice develop massive enlargement of peripheral lymphoid organs associated with polyclonal T and B cell expansion, which, for T cells, is correlated with impaired activation-induced cell death in vivo."
      explanation: >-
        Reports the apoptosis defect and the lymphoid expansion in the knockout,
        which is what makes it informative for this node.
  - target: Loss of Peripheral Immune Tolerance
    description: The null animal develops autoimmune hemolytic anemia and intestinal inflammation.
    evidence:
    - reference: PMID:7584142
      reference_title: Interleukin-2 receptor alpha chain regulates the size and content of the peripheral lymphoid compartment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Older IL-2R alpha-deficient mice also develop autoimmune disorders, including hemolytic anemia and inflammatory bowel disease."
      explanation: >-
        Establishes that the knockout develops autoimmunity, so it is informative for
        the disease as well as for the apoptosis lesion, while naming organ targets
        that only partly match the human ones.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: ORGANISM
    limitations: Overlapping immune pathology does not reproduce the entire human infection and endocrine spectrum.
    fidelity: MODERATE
  evidence:
  - reference: PMID:7584142
    reference_title: Interleukin-2 receptor alpha chain regulates the size and content of the peripheral lymphoid compartment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Older IL-2R alpha-deficient mice also develop autoimmune disorders, including hemolytic anemia and inflammatory bowel disease."
    explanation: >-
      Establishes that the knockout develops autoimmunity, so it is informative for
      the disease as well as for the apoptosis lesion, while naming organ targets
      that only partly match the human ones.
- name: Il2-null mice across genetic backgrounds
  species: Mouse
  genotype: Il2 knockout on mixed 129/Ola × C57BL/6 or BALB/c backgrounds
  publication: PMID:9065030
  description: An indirect ligand-deficiency model of impaired IL-2-dependent tolerance. Mixed-background animals predominantly develop colitis, whereas BALB/c animals develop generalized autoimmunity, hemolytic anemia and early mortality. This is not IL2RA gene deficiency or evidence for a specific human modifier gene.
  modeled_mechanisms:
  - target: Loss of Peripheral Immune Tolerance
    description: Loss of the ligand perturbs the same tolerance pathway.
    evidence:
    - reference: PMID:9065030
      reference_title: '[Generalized autoimmune diseases in BALB/c mice with a genetically dependent interleukin-2 deficiency].'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Il-2-/-mice backcrossed to BALB/c genetic background develop a generalized autoimmune disease
      explanation: Background-dependent mouse phenotype.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: ORGANISM
    limitations: Il2 deletion differs from receptor-alpha loss; background effects and immune-cell distributions cannot be directly transferred to human CD25 deficiency.
    fidelity: MODERATE
  evidence:
  - reference: PMID:9065030
    reference_title: '[Generalized autoimmune diseases in BALB/c mice with a genetically dependent interleukin-2 deficiency].'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Treatment of Il-2-/-Balb/c mice with anti-gp39 (CD40L) antibody inhibited activation of B cells and CD8+ T cells, however, it did not affect the activation of CD4+ T cells.
    explanation: Partial experimental intervention; not a clinical CD25 treatment.
- name: Treg-specific Foxp1/Foxp4 double-knockout mice
  species: Mouse
  genotype: Foxp1fl/fl Foxp4fl/fl Foxp3YFP-Cre
  publication: PMID:40794436
  description: An indirect upstream transcriptional-perturbation model with reduced Il2ra transcription and CD25 expression, preserved or increased Treg numbers, systemic inflammation and autoimmunity. Suppression was impaired in the lymphopenia-driven expansion assay but preserved in the in-vitro assay; transfer-colitis histology was not significantly different at ten weeks. Neither factor is established as a modifier of human IL2RA deficiency.
  modeled_mechanisms:
  - target: Reduced Surface CD25 Availability
    description: Deleting both transcription factors lowers CD25 expression in Tregs.
    evidence:
    - reference: PMID:40794436
      reference_title: Normal Treg homeostasis and suppressive function require both FOXP1 and FOXP4.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: both cTreg and eTreg subsets in cDKO have decreased level of CD25 expression
      explanation: In vivo conditional-knockout readout.
    relationship: PERTURBS
    model_scale: ORGANISM
    limitations: The manipulation changes many genes and does not isolate CD25 as the cause of the entire phenotype; no CD25-specific rescue was demonstrated.
    fidelity: LOW

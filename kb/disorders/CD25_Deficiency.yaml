treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic HSCT replaces the patient's hematopoietic system with donor cells
    able to express CD25, reconstituting a competent regulatory T cell
    compartment, and is the only established curative treatment. Reported
    outcomes include full donor chimerism with resolution of diarrhea, eczema and
    infection, sustained at five and six years in a transplanted sibling pair,
    and definitive cure after early transplantation in an Italian patient.
  therapeutic_modality: CELL_THERAPY

name: CD25 Deficiency
creation_date: "2026-09-24T19:23:48Z"
category: Mendelian
disease_term:
  preferred_term: CD25 deficiency
  term:
    id: MONDO:0011664
    label: immunodeficiency due to CD25 deficiency
synonyms:
- immunodeficiency due to CD25 deficiency
- IL2RA deficiency
- interleukin-2 receptor alpha chain deficiency
- immunodeficiency 41 with lymphoproliferation and autoimmunity
- IMD41
description: >-
  CD25 deficiency (IL2RA deficiency, immunodeficiency 41) is an ultra-rare
  autosomal recessive inborn error of immunity caused by biallelic
  loss-of-function variants in IL2RA, the gene encoding CD25, the alpha chain
  of the high-affinity interleukin-2 (IL-2) receptor. CD25 does not transduce
  signal on its own; with the beta chain (CD122) and the common gamma chain it
  confers high-affinity IL-2 binding, so cells that express it at high levels,
  above all FOXP3+ regulatory T cells (Tregs), respond first to low
  concentrations of IL-2. Without surface CD25 the IL-2 concentration needed
  to signal is raised in every T cell subset. FOXP3+ Tregs are typically still
  detectable but reduced as a fraction of lymphocytes and functionally
  impaired, and thymic and activation-induced apoptosis is defective, so
  activated and autoreactive T cells accumulate.

  The consequence is the combination of immunodeficiency and immune
  dysregulation named in the OMIM title. Onset is in infancy or early
  childhood with an IPEX-like picture: autoimmune enteropathy with chronic
  diarrhea and failure to thrive, eczema, early-onset autoimmune diabetes,
  thyroiditis, autoimmune hepatitis and cytopenias, alongside
  lymphoproliferation (lymphadenopathy, hepatosplenomegaly, lymphocytic
  infiltration of lung, liver, gut and skin, largely by CD8+ T cells) and
  recurrent or persistent viral, bacterial and fungal infection, with
  cytomegalovirus infection prominent. Diagnosis rests on absent surface CD25
  by flow cytometry followed by IL2RA sequencing, and the entity must be
  distinguished genetically from IPEX itself, in which FOXP3 is mutated.
  Immunosuppression, including sirolimus, controls autoimmunity, and
  allogeneic hematopoietic stem cell transplantation is the only established
  curative treatment.

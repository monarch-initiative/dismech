  evidence:
  - reference: PMID:19348914
    reference_title: IL-2- and CD25-dependent immunoregulatory mechanisms in the homeostasis of T-cell subsets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Of crucial importance for the delivery of IL-2 signals to Treg cells is the expression of CD25, which, along with CD122 and gammac, confers high affinity binding to IL-2."
    explanation: >-
      States the receptor architecture whose loss defines this node: CD25 is what
      makes IL-2 binding high-affinity.
  - reference: PMID:41694357
    reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the absence of CD25, IL-2 signaling through the IL-2R is virtually absent in patient T cells, especially affecting regulatory T cells that require IL-2 for survival and function."
    explanation: >-
      States the functional consequence of absent surface CD25 for IL-2 signaling
      in patient cells.
  downstream:
  - target: Raised IL-2 Signaling Threshold with Deficient STAT5 Activation
    causal_link_type: DIRECT
    description: >-
      Without the high-affinity receptor, more IL-2 is needed before STAT5 is
      phosphorylated in any T cell subset.
    evidence:
    - reference: PMID:23416241

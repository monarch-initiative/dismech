diagnosis:
- name: Flow cytometry for surface CD25 on T cells
  description: >-
    The rapid screening test is flow cytometry for CD25 on CD4+ or activated T
    cells: affected children show complete absence, and heterozygous relatives
    intermediate expression. FOXP3+ cells may still be detectable, so their
    presence does not argue against the diagnosis.
  diagnosis_term:
    preferred_term: flow cytometric assessment of surface CD25 expression
  markers: Surface CD25 (IL-2R alpha) on CD4+ and activated T cells
  results: Complete absence of CD25 on patient T cells; intermediate in carriers
  evidence:
  - reference: PMID:41694357
    reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Simple flow cytometric assessment of CD25 on T cells is a valuable screening tool, and early genetic confirmation is crucial to guide timely hematopoietic stem cell transplantation and genetic counselling."
    explanation: >-
      States the role of the flow cytometric test as the screening step preceding
      genetic confirmation.
  - reference: PMID:30742970
    reference_title: "CD25 deficiency: A new conformational mutation prevents the receptor expression on cell surface."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cytofluorimetric analysis revealed the total absence of CD25 cell surface expression and addressed IL2Rα molecular investigation."
    explanation: >-
      Shows the sequence used in practice: absent surface expression by flow
      cytometry directs the molecular study.
- name: IL2RA sequencing
  description: >-
    Molecular confirmation is by sequencing IL2RA, in practice through an
    immunodeficiency gene panel or exome sequencing, looking for biallelic
    loss-of-function alleles including copy-number analysis, since one reported
    allele is a multi-exon deletion that a sequence-only assay would miss.
  diagnosis_term:
    preferred_term: IL2RA sequencing
  results: Biallelic loss-of-function IL2RA variants
  evidence:
  - reference: PMID:41659858
    reference_title: "Expanding the clinical spectrum of interleukin-2 receptor alpha chain deficiency: two novel cases with long-term hematopoietic stem cell transplantation outcome and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis using the next-generation sequencing primary immunodeficiency panel revealed a novel homozygous frameshift mutation in IL2RA (c.166delC; p.R56fs), which was confirmed by Sanger sequencing."
    explanation: Documents the panel-based route to molecular diagnosis.
  - reference: PMID:41694357
    reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For Case 2, NGS read-depth analysis identified a homozygous multi-exon deletion in IL2RA, corresponding at the cDNA level to c.557_795-1625del."
    explanation: >-
      The case for including copy-number analysis: this allele was found by read
      depth, not by variant calling on sequence alone.
- name: Screen IL2RA when IPEX is suspected but FOXP3 is normal
  description: >-
    Because the clinical picture is IPEX-like, the practical diagnostic rule is
    that a patient with IPEX features and a normal FOXP3 gene should be screened
    for IL2RA variants.
  diagnosis_term:
    preferred_term: IL2RA screening in FOXP3-normal IPEX-like disease
  evidence:
  - reference: PMID:17196245
    reference_title: "CD25 deficiency causes an immune dysregulation, polyendocrinopathy, enteropathy, X-linked-like syndrome, and defective IL-10 expression from CD4 lymphocytes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Any patient with features of IPEX but with a normal Foxp3 gene should be screened for mutations in the IL-2 receptor subunit CD25."
    explanation: The source's own clinical implication, stated as a screening rule.
differential_diagnoses:
- name: IPEX syndrome (FOXP3)
  description: >-
    IPEX is the phenotypic twin and the main differential. It is X-linked and
    caused by FOXP3 mutation, so Tregs are lineage-defective; in CD25 deficiency
    FOXP3 is intact and the lesion is in IL-2 signaling that sustains FOXP3
    expression. IL-10 production by CD4 lymphocytes separates them in the
    laboratory, being defective in CD25 deficiency and normal in the
    FOXP3-deficient patient studied alongside.
  disease_term:
    preferred_term: IPEX syndrome
    term:
      id: MONDO:0010580
      label: immune dysregulation-polyendocrinopathy-enteropathy-X-linked syndrome
  distinguishing_features:
  - X-linked inheritance and a FOXP3 variant in IPEX
  - autosomal recessive inheritance, absent surface CD25 and an IL2RA variant in CD25 deficiency
  evidence:
  - reference: PMID:41694357
    reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike FOXP3 deficiency, IL2RA deficiency does not involve mutations in FOXP3 but results from impaired IL-2 signaling required to sustain FOXP3 expression in Tregs"
    explanation: States the mechanistic distinction between the two entities.
  - reference: PMID:17196245
    reference_title: "CD25 deficiency causes an immune dysregulation, polyendocrinopathy, enteropathy, X-linked-like syndrome, and defective IL-10 expression from CD4 lymphocytes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with clinical manifestations of IPEX that had a normal Foxp3 gene, but who had CD25 deficiency due to autosomal recessive mutations in this gene."
    explanation: >-
      The case that separated the two diseases clinically, an IPEX phenotype with a
      normal FOXP3 gene.
- name: STAT5B deficiency
  description: >-
    STAT5B deficiency lies immediately downstream of the same receptor and shares
    the Treg and NK cell consequences, but adds growth hormone insensitivity with
    severe postnatal growth failure, which CD25 deficiency does not cause. The two
    were studied side by side in the work that established the IL-2/CD25/STAT5B
    requirement for NK cell maturation.
  disease_term:
    preferred_term: STAT5B deficiency
    term:
      id: MONDO:0100211
      label: growth hormone insensitivity with immune dysregulation 1, autosomal recessive
  distinguishing_features:
  - growth hormone insensitivity with very low IGF-1 and severe short stature in STAT5B deficiency
  - absent surface CD25 with normal STAT5B in CD25 deficiency
  evidence:
  - reference: PMID:29988287
    reference_title: Primary Immunodeficiencies Unravel the Role of IL-2/CD25/STAT5b in Human Natural Killer Cell Maturation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using NK cells from two patients, one with a primary immunodeficiency characterized by a homozygous mutation in CD25 (born in year 2007 and studied since she was 3 years old) and one with a homozygous mutation in STAT5b (born in year 1992 and studied since she was 10 years old)"
    explanation: >-
      Confirms the two as distinct entities studied in parallel, which is why
      STAT5B deficiency belongs in this differential.
- name: Severe combined immunodeficiency
  description: >-
    The infectious susceptibility and impaired T cell proliferation can suggest
    SCID, and the founding patient was compared with SCID for that reason. What
    separates CD25 deficiency is the coexistence of lymphoproliferation and
    autoimmunity with preserved B cell development.
  distinguishing_features:
  - lymphoproliferation and organ-directed autoimmunity
  - normal or high immunoglobulins with normal B cell development
  evidence:
  - reference: PMID:24116927
    reference_title: Follicular bronchiolitis as phenotype associated with CD25 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, unlike children with severe combined immunodeficiency (SCID), besides not having circulating T cells, the patient also developed peripheral lymphocytic proliferation and autoimmune primary biliary cirrhosis."
    explanation: >-
      The source's own contrast with SCID, resting on lymphoproliferation and
      autoimmunity.
  - reference: PMID:9096364
    reference_title: Human immune disorder arising from mutation of the alpha chain of the interleukin-2 receptor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This immunodeficiency is characterized by decreased numbers of peripheral T cells displaying abnormal proliferation but normal B cell development."
    explanation: >-
      Establishes preserved B cell development, a feature that argues against SCID
      of the T-B-negative kind.

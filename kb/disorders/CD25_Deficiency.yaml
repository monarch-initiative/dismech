  - target: Defective Activation-Induced and Thymic T Cell Apoptosis
    causal_link_type: DIRECT
    description: >-
      IL-2 receptor signaling normally drives activation-induced death of
      activated T cells and thymocyte apoptosis, so its loss spares cells that

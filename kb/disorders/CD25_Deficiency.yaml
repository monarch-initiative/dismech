      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: Loss of Peripheral Immune Tolerance
    treatment_effect: INHIBITS
    description: >-
      Sirolimus suppresses the proliferation of activated autoreactive T cells,
      partially restraining the loss of tolerance.
  evidence:

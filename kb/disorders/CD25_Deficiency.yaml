clinical_burden:
  burden_level: HIGH
  rationale: >-
    CD25 deficiency can require prolonged immunosuppression, antimicrobial treatment, nutritional support and insulin or thyroid hormone replacement, with organ damage and deaths from sepsis or transplantation complications. Severity varies, and some patients survive into adulthood. HSCT can provide sustained recovery, but graft failure, infection and graft-versus-host disease remain material risks.

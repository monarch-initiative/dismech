- name: Regulatory T Cell Deficiency and Dysfunction
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    FOXP3+ Tregs are usually still detectable in patients, and by surface
    phenotype and FOXP3 locus demethylation they are bona fide Tregs, but they
    are reduced as a proportion of the whole lymphocyte compartment and cannot
    respond normally to low-concentration IL-2. The deficit is therefore
    predominantly functional rather than a simple absence of the lineage, which
    is the main immunological difference from IPEX, where FOXP3 itself is
    mutated. Reported Treg numbers vary between patients, from preserved
    frequencies to extremely low counts.

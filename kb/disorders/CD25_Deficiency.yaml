    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "improvement of the lesions was only seen when combined with rapamycin"
    explanation: >-

    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This data indicates that in the absence of CD25 surface expression 1) the threshold required for IL-2 signaling in all T cell subsets is raised, 2) CD4+FOXP3+ are the first to respond to IL-2 despite the absence of CD25, and 3) unlike in healthy donors, CD8+ T cells from CD25 null patients preferentially respond to IL-2 compared to CD4+FOXP3−."
    explanation: >-
      The authors' summary of the signaling defect, including the reordering that
      favours CD8+ cells over conventional CD4+ cells.
  downstream:
  - target: Regulatory T Cell Deficiency and Dysfunction
    causal_link_type: DIRECT
    description: >-
      Tregs depend on high-affinity IL-2 capture for their development, stability

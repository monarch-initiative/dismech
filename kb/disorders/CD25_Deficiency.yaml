clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untreated the disease combines organ-damaging autoimmunity with infections the
    patient cannot clear, needing continuous immunosuppression, antimicrobial
    prophylaxis and often parenteral nutrition through early childhood, and deaths
    in early childhood are reported. The only curative option itself carries
    significant morbidity and mortality, although transplanted patients in the
    most recent series recovered fully and remained well at five and six years.
  evidence:
  - reference: PMID:41758964
    reference_title: Biallelic Pathogenic Variants in IL2RA Cause Neonatal-Onset Monogenic Autoimmune Diabetes.
    supports: SUPPORT

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: these data indicate a defect in in vivo but not in vitro function of Tregs deficient in both FOXP1 and FOXP4.
    explanation: Assay-dependent functional outcome.
discussions:
- discussion_id: tregs_present_but_inadequate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much do impaired Treg suppression, altered IL-2 consumption and the relative size of the effector pool each contribute to immune dysregulation when FOXP3-positive Tregs remain present?
  attaches_to:
  - pathophysiology#Impaired Regulatory T Cell Suppression
  - pathophysiology#Loss of Peripheral Immune Tolerance
  rationale: >-
    The S166N patient retained phenotypically and epigenetically recognizable Tregs, while expanded cytotoxic cells infiltrated skin. Subsequent compound-heterozygous patient-cell assays directly demonstrated defective suppression and gene-correction rescue. The residual gap concerns the relative contributions of functional insufficiency, cytokine consumption and effector-cell excess across genotypes. Treg denominators and CD25-dependent gating can also account for apparent differences in cell abundance.
  evidence:
  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activated CD8(+)STAT5(+) T cells with lytic potential infiltrated the skin, even though FOXP3(+) Tregs were present and maintained a higher capacity to respond to IL-2 compared to other T-cell subsets."
    explanation: >-
      States the paradox this gap is about: tolerance failed in tissue while Tregs
      were present and comparatively IL-2 responsive.
  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall these results indicated that peripheral Tregs were present in the patient despite the absence of a functional CD25, albeit at an overall reduced level in total lymphocytes."
    explanation: >-
      Supplies the numerical half of the candidate explanation, the reduced Treg
      share of total lymphocytes.
- discussion_id: mouse_lymphoproliferation_vs_human_infection
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the Il2ra knockout mouse present as adult-onset lymphoproliferation
    with colitis and hemolytic anemia, while human CD25 deficiency presents in
    infancy with enteropathy, endocrine autoimmunity and infections the mouse is
    not reported to acquire?
  attaches_to:
  - pathophysiology#Impaired Peripheral Activation-Induced T Cell Death
  - pathophysiology#Recurrent and Persistent Viral, Bacterial and Fungal Infection
  rationale: >-
    The founding Il2ra-null mouse study emphasizes adult lymphoproliferation and autoimmunity with impaired activation-induced death. Human disease includes early infections, variable onset and organ manifestations, and the S166N patient did not show a general peripheral apoptotic defect. Different tissue compartments, alleles, microbial exposures and genetic backgrounds may contribute; the published mouse description does not test human-like opportunistic infection susceptibility.
  evidence:
  - reference: PMID:7584142
    reference_title: Interleukin-2 receptor alpha chain regulates the size and content of the peripheral lymphoid compartment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Young mice that lack IL-2R alpha have phenotypically normal development of T and B cells."
    explanation: >-
      Establishes the timing mismatch: the mouse is phenotypically normal young,
      where the human disease presents in infancy.
  - reference: PMID:23416241
    reference_title: Human IL2RA null mutation mediates immunodeficiency with lymphoproliferation and autoimmunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the main clinical manifestations of the patient, other than autoimmunity, was chronic viral infections especially CMV."
    explanation: >-
      Establishes the human arm with no reported murine counterpart, chronic
      cytomegalovirus infection.
notes: >-
  Clinical expression and laboratory findings vary substantially. Published patients overlap between case reports, mechanistic follow-up studies and later reviews, so their denominators must not be added without deduplication. Diabetes-ascertained series and literature tables do not establish population penetrance or prevalence.

  The Mendelian recessive IL2RA disorder is distinct from common IL2RA susceptibility polymorphisms and from IL2RB or STAT5B deficiency. Residual CD25 expression and preserved responses through the intermediate-affinity receptor are compatible with the diagnosis. FOXP3-positive cells may persist, and CD25-based Treg gates can confound receptor loss with lineage loss.

  Not every clinical finding has a resolved causal path. Atopic manifestations, humoral defects, renal stones, ocular disease and acute metabolic abnormalities are retained with their case-specific evidence without assigning unsupported molecular routes. Histologic granulomatous hepatitis is not equated with serologically established autoimmune hepatitis.

  The proposed IL-2-consumption and thymic-selection mechanisms remain less directly established in patients than impaired high-affinity responsiveness and the gene-correction rescue experiments. Peripheral activation-induced apoptosis defects in mice should not be generalized to every human allele.

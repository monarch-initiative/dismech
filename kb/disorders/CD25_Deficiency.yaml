  - reference: PMID:41694357
    reference_title: "Case Report: IL2RA (CD25) deficiency: first reported cases in Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of therapies like rapamycin (sirolimus) that expand regulatory T cells by exploiting IL-2 signaling could be considered, although paradoxically in CD25 deficiency the Tregs cannot respond normally to IL-2 (27)."
    explanation: >-
      States the caveat curated in the description: the usual Treg-expanding
      rationale is undermined by the defect itself.
- name: Corticosteroid and Calcineurin Inhibitor Immunosuppression
  description: >-
    Corticosteroids with a calcineurin inhibitor, most often tacrolimus, are the
    conventional immunosuppressive backbone used to control enteropathy and other

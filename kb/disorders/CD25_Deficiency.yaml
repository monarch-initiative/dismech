  mechanism_confidence: ESTABLISHED
  description: >-
    Germline biallelic loss-of-function IL2RA variants eliminate functional CD25.
    Frameshift, splice-acceptor, multi-exon deletion and conformation-disrupting
    missense alleles all converge on the same molecular outcome, absence of the
    chain from the cell surface.
  genetic_context:
    genes:
    - preferred_term: IL2RA

    developmental step is curated as HYPOTHETICAL rather than established: no
    Jagged1-specific study of anterior-segment morphogenesis was identified, so
    the tissue-level mechanism is inferred from the neural-crest origin of the
    affected structures and from the human phenotype association rather than
    demonstrated.

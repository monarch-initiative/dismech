      label: middle ear
  evidence:
  - reference: PMID:28566723
    reference_title: >-
      Requirement for Jagged1-Notch2 signaling in patterning the bones of the
      mouse and human middle ear.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We find that Jagged1-Notch2 signaling functions early to pattern the stapes
      cartilage template, with stapes malformations correlating with hearing loss
      across all frequencies.
    explanation: >-
      Establishes the ossicular patterning mechanism and its audiological
      consequence.
  - reference: PMID:28566723
    reference_title: >-
      Requirement for Jagged1-Notch2 signaling in patterning the bones of the
      mouse and human middle ear.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observe similar stapes defects and hearing loss in one patient with
      heterozygous JAGGED1 loss, and a diversity of conductive and sensorineural

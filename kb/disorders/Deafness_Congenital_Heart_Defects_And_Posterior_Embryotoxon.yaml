inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The p.Cys234Tyr allele segregated as an autosomal dominant trait through a
    large multigenerational kindred, with high penetrance of the triad but
    variable expressivity of its individual components (the specific cardiac
    lesion in particular differed between affected relatives). This mirrors the
    intra-familial variability characteristic of JAG1 disorders generally.
  evidence:
  - reference: PMID:12022040

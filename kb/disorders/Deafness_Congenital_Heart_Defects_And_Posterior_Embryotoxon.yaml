- name: Disrupted Anterior Segment Development in Periocular Neural Crest
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The trabecular meshwork, corneal endothelium and Schwalbe line derive from
    neural-crest-derived periocular mesenchyme. Posterior embryotoxon - an
    anteriorly displaced, prominent Schwalbe line visible at the slit lamp - is a
    recognised consequence of reduced JAG1/NOTCH2 signalling in humans and is one

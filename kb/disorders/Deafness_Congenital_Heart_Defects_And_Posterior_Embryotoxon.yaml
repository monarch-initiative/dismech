- name: Impaired Jagged1-Notch2 Patterning of the Middle Ear Ossicles
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The stapes and incus derive from the first two pharyngeal arches and are
    patterned by Jagged1-Notch2 signalling in arch neural crest cells. Reduced
    Jagged1 dose malforms the stapes cartilage template early in development, and
    the resulting ossicular malformation impairs sound conduction across all
    frequencies. This is the arm of the mechanism that accounts for the
    conductive component of the combined (mixed) hearing loss recorded in this
    kindred, and it is why the hearing phenotype here is mixed rather than purely
    sensorineural.
  cell_types:
  - preferred_term: pharyngeal arch neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development in the pharyngeal arches
    term:
      id: GO:0014032
      label: neural crest cell development
    modifier: ABNORMAL

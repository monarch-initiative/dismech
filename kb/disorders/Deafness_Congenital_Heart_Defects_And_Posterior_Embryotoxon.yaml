- name: Impaired Notch-Dependent Inner Ear Sensory Patterning
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Jagged1 marks the prosensory patches of the developing inner ear well before
    hair-cell versus supporting-cell fate is settled, and continues to be
    expressed by supporting cells into adulthood. Reduced Jagged1 therefore has
    two separable auditory consequences in model systems: an early patterning
    failure (loss of sensory cristae and their housing ampullae, and altered
    inner/outer hair-cell specification) that maps onto the vestibular and
    sensorineural components of the phenotype, and a later maturation failure of
    inner-hair-cell stereocilia that produces an auditory-neuropathy-like
    deafness with preserved hair-cell number. Both routes yield a sensorineural
    deficit without requiring hair-cell death.

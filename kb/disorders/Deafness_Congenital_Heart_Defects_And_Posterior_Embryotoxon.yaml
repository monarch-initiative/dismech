      ventricular septal defect, or isolated peripheral pulmonic stenosis.
    explanation: >-
      Names isolated peripheral pulmonic stenosis among the cardiac lesions in
      this kindred.
  - reference: PMID:39069193
    reference_title: >-
      Decreased smooth muscle cells and fibrous thickening of the tunica media in
      peripheral pulmonary artery stenosis in Alagille syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alagille syndrome is caused by mutations in genes involved in NOTCH
      signaling, specifically JAG1 and NOTCH2, and is associated with a high rate
      of peripheral pulmonary artery stenosis.
    explanation: >-
      Supports peripheral pulmonary artery stenosis as a characteristic
      consequence of JAG1-pathway disruption. PARTIAL because the cohort is
      Alagille syndrome rather than this entity.

- name: Posterior embryotoxon
  category: Ophthalmic
  diagnostic: true
  frequency: VERY_FREQUENT
  description: >-
    Posterior embryotoxon - an anteriorly displaced and prominent Schwalbe line,
    seen at the slit lamp - is the third element of the defining triad and the
    other feature this entity shares with Alagille syndrome. It is usually
    visually asymptomatic in itself; its value is diagnostic.
  phenotype_term:
    preferred_term: Posterior embryotoxon
    term:
      id: HP:0000627
      label: Posterior embryotoxon
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings revealed a unique phenotype with highly penetrant deafness,
      posterior embryotoxon, and congenital heart defects but with variable
      expressivity in a large kindred
    explanation: >-
      The index report describes posterior embryotoxon as highly penetrant in
      this kindred. Per docs/frequency-evidence-guidelines.md that qualitative
      wording maps to the VERY_FREQUENT band (80-100%); no numerator and
      denominator were published for this feature, so the band rests on the
      authors' penetrance wording rather than on a count.

genetic:
- name: JAG1
  gene_term:
    preferred_term: JAG1
    term:
      id: hgnc:6188
      label: JAG1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Causal heterozygous missense variant p.Cys234Tyr in the first EGF-like repeat
  frequency: OBLIGATE
  notes: >-
    JAG1 is the sole reported causal gene for this entity. The single reported
    allele, p.Cys234Tyr, removes a structurally required cysteine from the first
    EGF-like repeat. JAG1 is also the principal Alagille syndrome gene, so the
    gene identity alone does not discriminate between the two disorders; the
    phenotype does. Most pathogenic JAG1 alleles are loss-of-function
    (truncating, splice-disrupting, or whole-gene deletion), and missense alleles
    such as this one are the less well understood minority, for which dedicated
    classification guidance has had to be developed.
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A candidate-gene approach was undertaken and culminated in the
      identification of a novel Jagged 1 (JAG1) missense mutation (C234Y) in the
      first cysteine of the first epidermal-growth-factor-like repeat domain of
      the protein.
    explanation: >-
      Establishes JAG1 p.Cys234Tyr as the causal allele in the index kindred.
  - reference: PMID:31343788
    reference_title: >-
      Alagille syndrome mutation update: Comprehensive overview of JAG1 and
      NOTCH2 mutation frequencies and insight into missense variant
      classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of JAG1 variants result in loss of function, however disease
      has also been attributed to lesser understood missense variants.
    explanation: >-
      Places this missense allele in its variant-class context and flags the
      interpretive difficulty that attends JAG1 missense variants.
  - reference: PMID:31343788
    reference_title: >-
      Alagille syndrome mutation update: Comprehensive overview of JAG1 and
      NOTCH2 mutation frequencies and insight into missense variant
      classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using this data set, we developed new guidance to help with the
      classification of JAG1 missense variants.
    explanation: >-
      Supports the statement that dedicated classification guidance was needed
      for JAG1 missense variants.

diagnosis:
- name: Formal audiometry with tympanometry
  description: >-
    The audiological assessment is the diagnostically decisive test in this
    entity, and a screen is not sufficient for two independent reasons. First,
    the loss is mid-frequency predominant, so a protocol weighted toward the high
    frequencies where most acquired and hereditary sensorineural loss appears can
    return a reassuring result. Second, the loss is mixed, so tympanometry and
    air-bone gap measurement are required to demonstrate the conductive component
    that reflects the underlying ossicular malformation. Auditory brainstem
    response and otoacoustic emissions extend the same assessment to infants and
    to the auditory-neuropathy pattern that Jag1 loss produces in the mouse
    cochlea.
  diagnosis_term:
    preferred_term: audiometric assessment with tympanometry
    term:
      id: NCIT:C38036
      label: Audiometric Test
  markers: Air and bone conduction thresholds, air-bone gap, tympanogram
  results: >-
    Mild-to-severe mixed hearing loss with a mid-frequency predominant
    configuration; the air-bone gap identifies the conductive component
    attributable to ossicular malformation.
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six of seven available affected patients manifested mild-to-severe combined
      hearing loss, predominantly affecting middle frequencies.
    explanation: >-
      Establishes both features that dictate the protocol: the loss is combined
      (so the conductive component must be measured) and mid-frequency
      predominant (so the configuration must be characterised across frequency).
  - reference: PMID:28566723
    reference_title: >-
      Requirement for Jagged1-Notch2 signaling in patterning the bones of the
      mouse and human middle ear.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observe similar stapes defects and hearing loss in one patient with
      heterozygous JAGGED1 loss, and a diversity of conductive and sensorineural
      hearing loss in nearly half of AGS patients, many of which carry JAGGED1
      mutations.
    explanation: >-
      Supports expecting a conductive component of ossicular origin alongside the
      sensorineural one, which is what tympanometry is there to detect.

- name: Auditory brainstem response testing
  description: >-
    Extends audiological assessment to infants, to individuals who cannot give
    reliable behavioural thresholds, and to the auditory-neuropathy pattern.
    Relevant here because Jag1 loss during cochlear maturation produces, in the
    mouse, a deafness clinically similar to auditory neuropathy, in which
    otoacoustic emissions can be preserved while the brainstem response is not.
  diagnosis_term:
    preferred_term: auditory brainstem response
    term:
      id: NCIT:C184949
      label: Auditory Brainstem Response
  evidence:
  - reference: PMID:36400760
    reference_title: >-
      Deletion of the Notch ligand Jagged1 during cochlear maturation leads to
      inner hair cell defects and hearing loss.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we show that deletion of JAG1 during cochlear maturation disrupts the inner
      hair cell pathway and leads to a type of deafness clinically similar to
      auditory neuropathy
    explanation: >-
      Motivates brainstem-response testing rather than emissions alone. PARTIAL:
      this is a mouse result, and the auditory-neuropathy pattern has not been
      documented in a DCHE carrier.

- name: Echocardiography
  description: >-
    Every affected member of the index kindred had a congenital heart defect, so
    cardiac imaging is indicated in any individual with a molecular diagnosis and
    in at-risk relatives during cascade evaluation. The lesion set is right
    sided, spanning tetralogy of Fallot, ventricular septal defect and isolated
    peripheral pulmonic stenosis, and it differs between relatives carrying the
    same allele, so a normal study in a parent does not predict the child.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  markers: Outflow tract and branch pulmonary artery anatomy, ventricular septum
  results: >-
    Right-sided lesions: tetralogy of Fallot, ventricular septal defect, or
    isolated peripheral pulmonic stenosis.
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had congenital heart defects, including tetralogy of Fallot,
      ventricular septal defect, or isolated peripheral pulmonic stenosis.
    explanation: >-
      Universal cardiac involvement, across a lesion range wide enough to require
      imaging rather than auscultation, is what makes echocardiography a required
      element of the workup.

- name: Slit-lamp examination for posterior embryotoxon
  description: >-
    Posterior embryotoxon is an anteriorly displaced, prominent Schwalbe line and
    is visible only on slit-lamp examination, not on routine visual assessment.
    It is usually visually silent in itself, so its value here is almost entirely
    diagnostic, and it is the element of the triad most likely to be missed
    because nothing prompts the patient to report it. Intraocular pressure
    measurement belongs in the same visit: it is the associated anterior-segment
    dysgenesis and glaucoma, rather than the embryotoxon, that threatens vision.
  diagnosis_term:
    preferred_term: ophthalmic examination with slit-lamp biomicroscopy
    term:
      id: NCIT:C20989
      label: Physical Examination
  markers: Schwalbe line position, iridocorneal angle, intraocular pressure
  results: >-
    Posterior embryotoxon, seen as an anteriorly displaced and prominent Schwalbe
    line.
  evidence:
  - reference: PMID:37895297
    reference_title: Alternative Genetic Diagnoses in Axenfeld-Rieger Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a specific type of anterior segment disorder characterized by the triad of
      posterior embryotoxon
    explanation: >-
      Places posterior embryotoxon among the anterior-segment findings assessed
      at the slit lamp, which is the examination this entry recommends.
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings revealed a unique phenotype with highly penetrant deafness,
      posterior embryotoxon, and congenital heart defects
    explanation: >-
      Establishes posterior embryotoxon as a highly penetrant feature, so its
      detection materially changes the diagnostic probability.

- name: JAG1 sequencing
  description: >-
    Molecular confirmation is by sequencing of the JAG1 coding exons. Because
    this entity is defined by a missense substitution, exon sequencing rather
    than deletion analysis is the first-line test that finds it. In Alagille
    syndrome, the disorder for which JAG1 testing strategy has actually been
    quantified, sequencing all JAG1 exons identifies approximately 85% of
    pathogenic variants.
  diagnosis_term:
    preferred_term: JAG1 gene sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31343788
    reference_title: >-
      Alagille syndrome mutation update: Comprehensive overview of JAG1 and
      NOTCH2 mutation frequencies and insight into missense variant
      classification.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current standard is to sequence all exons in JAG1, which should
      identify approximately 85% of ALGS pathogenic variants.
    explanation: >-
      Supplies the first-tier yield figure. PARTIAL because the denominator is an
      Alagille syndrome cohort; no equivalent figure exists for this entity, and
      the number must not be read as a DCHE detection rate.
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A candidate-gene approach was undertaken and culminated in the
      identification of a novel Jagged 1 (JAG1) missense mutation (C234Y) in the
      first cysteine of the first epidermal-growth-factor-like repeat domain of
      the protein.
    explanation: >-
      The causal variant is an intragenic missense change, which is what makes
      exon sequencing rather than dosage analysis the test that detects it.

- name: JAG1 copy number analysis
  description: >-
    Second-tier testing when sequencing is negative but the phenotype still
    suggests a JAG1 disorder. Large JAG1 deletions are a recognised cause of
    JAG1-related disease and are invisible to exon sequencing, so a negative
    sequencing result does not close the question. Note this test would not have
    found the variant in the index kindred, which is a point substitution; it is
    included because a clinician working from the phenotype, not the known
    genotype, cannot assume that in advance.
  diagnosis_term:
    preferred_term: copy number variant analysis
    term:
      id: NCIT:C18084
      label: Comparative Genomic Hybridization
  evidence:
  - reference: PMID:31343788
    reference_title: >-
      Alagille syndrome mutation update: Comprehensive overview of JAG1 and
      NOTCH2 mutation frequencies and insight into missense variant
      classification.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      second tier diagnostics involves large deletion/duplication analysis
      through either multiplex ligation-dependent probe amplification (MLPA),
      chromosomal microarray (CMA), or fluorescence in situ hybridization (FISH),
      which should identify an additional 9% of pathogenic variants
    explanation: >-
      Supplies the second-tier method and its incremental yield. PARTIAL for the
      same reason as the sequencing figure: the denominator is an Alagille
      syndrome cohort.

- name: Interpretation of a JAG1 missense variant
  description: >-
    A caveat rather than a test. The causal allele here is missense, and JAG1
    missense variants are the class that resists confident classification, which
    is why dedicated interpretation guidance had to be developed for them. A
    missense variant of uncertain significance in JAG1 should therefore not be
    dismissed on in-silico grounds alone in an individual with this phenotype;
    segregation and, where available, functional data carry the weight.
  diagnosis_term:
    preferred_term: variant classification
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment
  evidence:
  - reference: PMID:31343788
    reference_title: >-
      Alagille syndrome mutation update: Comprehensive overview of JAG1 and
      NOTCH2 mutation frequencies and insight into missense variant
      classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of JAG1 variants result in loss of function, however disease
      has also been attributed to lesser understood missense variants.
    explanation: >-
      States that JAG1 missense variants are the poorly understood minority,
      which is the interpretive difficulty this entry flags.
  - reference: PMID:31343788
    reference_title: >-
      Alagille syndrome mutation update: Comprehensive overview of JAG1 and
      NOTCH2 mutation frequencies and insight into missense variant
      classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using this data set, we developed new guidance to help with the
      classification of JAG1 missense variants.
    explanation: >-
      Confirms that dedicated classification guidance was required, supporting
      the caution recorded here.

differential_diagnoses:
- name: Alagille syndrome
  disease_term:
    preferred_term: Alagille syndrome
    term:
      id: MONDO:0007318
      label: Alagille syndrome
  description: >-
    The single most important differential, and an allelic disorder: Alagille
    syndrome is caused by heterozygous variants in the same gene (JAG1, and less
    often NOTCH2), and shares two of this entity's three cardinal features
    (congenital heart defects with pulmonary-artery predilection, and posterior
    embryotoxon). This entity is curated separately from
    kb/disorders/Alagille_syndrome.yaml, and the two must not be merged on the
    strength of shared gene identity alone.
  distinguishing_features:
  - >-
    Present in Alagille syndrome and absent in the index kindred of this entity:
    cholestasis with paucity of interlobular bile ducts on liver biopsy (the
    defining Alagille criterion), butterfly vertebrae, and the characteristic
    facies.
  - >-
    Present here and NOT an Alagille diagnostic criterion: highly penetrant mixed
    hearing loss with a mid-frequency configuration. Hearing loss does occur in
    Alagille syndrome, but as an associated finding rather than a cardinal
    criterion.
  - >-
    Decisive statement from the index report: no individual in this kindred met
    diagnostic criteria for any previously described clinical syndrome.
  - >-
    The dissociation is NOT explained by a milder molecular lesion. JAG1
    p.Cys234Tyr is completely haploinsufficient, being EndoH sensitive, absent
    from the cell surface, and unable to activate Notch, so the difference from
    Alagille syndrome is neither gene, nor pathway, nor allele severity. The
    organ selectivity is attributed to unidentified modifying factors and is
    recorded here as an open knowledge gap. The superficially attractive
    graded-dose account, in which the developing heart tolerates reduced JAG1
    dose less well than the developing liver does, derives from the DIFFERENT and
    genuinely leaky p.Gly274Asp allele, and was specifically tested and ruled out
    for this one.
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No individual in this family met diagnostic criteria for any previously
      described clinical syndrome.
    explanation: >-
      The index report's own explicit statement that this kindred is not Alagille
      syndrome (or any other described syndrome) - the primary basis for curating
      a separate entry.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.C234Y variant is a familial mutation segregating with cardiac
      defects, deafness, and posterior embryotoxon, yet all carriers have normal
      liver function
    explanation: >-
      Independent confirmation, by a different group, of the liver sparing that
      separates this entity from Alagille syndrome - stated for this exact allele
      and kindred.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      although the lack of any liver dysfunction in the nine family members
      studied by Le Caignec et al. is unusual
    explanation: >-
      Records both the size of the assessed group (nine family members) and that
      experts in Alagille syndrome regard the complete absence of liver
      dysfunction as atypical for a JAG1 disorder.
  - reference: PMID:27418850
    reference_title: "Alagille syndrome: clinical perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alagille syndrome is an autosomal dominant, complex multisystem disorder
      characterized by the presence of three out of five major clinical criteria:
      cholestasis with bile duct paucity on liver biopsy, congenital cardiac
      defects (with particular involvement of the pulmonary arteries), posterior
      embryotoxon in the eye, characteristic facial features, and butterfly
      vertebrae.
    explanation: >-
      States the five Alagille criteria, three of which are absent here - which
      is what the differential turns on.
  - reference: PMID:12649809
    reference_title: >-
      Conditional JAG1 mutation shows the developing heart is more sensitive than
      developing liver to JAG1 dosage.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The cardiac-specific phenotype associated with this mutation suggests that
      the developing heart is more sensitive than the developing liver to
      decreased dosage of JAG1.
    explanation: >-
      Cited as the CONTRASTING model, matching how this reference is framed
      everywhere else in this entry. It establishes that a JAG1 allele can spare
      the liver while affecting the heart, which is the dissociation the
      differential turns on, but it attributes that to graded dose from the leaky
      p.Gly274Asp allele. p.Cys234Tyr was subsequently shown to be functionally
      null and still liver sparing, so this reference supports the existence of
      the dissociation without supplying its mechanism here.

- name: Non-syndromic JAG1-related right-sided congenital heart disease
  description: >-
    JAG1 variants are recovered from individuals with tetralogy of Fallot or
    pulmonic/peripheral pulmonary stenosis who carry no other Alagille feature.
    Such individuals overlap this entity in gene and in cardiac lesion, and are
    separated from it by the absence of the auditory and ocular components -
    which is precisely why an audiological and slit-lamp assessment belongs in
    the work-up of any JAG1-positive congenital heart disease.
  distinguishing_features:
  - >-
      Cardiac lesion only, with normal hearing and a normal anterior segment. This
      entity requires the full triad.
  evidence:
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with right-sided cardiac defects should be carefully screened for
      features of AGS or a family history of cardiac defects that might suggest
      the presence of a JAG1 mutation.
    explanation: >-
      Documents the cardiac-only JAG1 presentation and the recommendation to
      screen such patients for additional JAG1-pathway features.

- name: Axenfeld-Rieger anomaly and syndrome spectrum
  description: >-
    Posterior embryotoxon is also the leading element of the Axenfeld-Rieger
    anomaly triad, so an individual with this entity who comes to attention
    through an ophthalmologist can be labelled Axenfeld-Rieger rather than
    referred for JAG1 testing. This is not hypothetical: a 2023 cohort of
    Axenfeld-Rieger cases left unsolved after PITX2 and FOXC1 testing found JAG1
    variants in three separate families, one of whom - referred with
    Axenfeld-Rieger anomaly, bilateral sensorineural hearing loss and dysmorphism - is
    phenotypically close to this entity. The practical consequence is that JAG1
    belongs on the differential of anterior-segment dysgenesis with syndromic
    features, particularly when hearing loss or a congenital heart defect
    accompanies it.
  distinguishing_features:
  - >-
    Axenfeld-Rieger anomaly requires iridocorneal adhesions and iris anomalies
    (hypoplasia, corectopia, polycoria) in addition to posterior embryotoxon;
    the index kindred of this entity was reported with posterior embryotoxon
    alone, without the rest of the triad.
  - >-
    Classic Axenfeld-Rieger syndrome is caused by PITX2 (type 1, with dental and
    umbilical features) or FOXC1 (type 3), which together explain roughly 70% of
    cases; this entity is caused by JAG1. Note that FOXC1-associated disease can
    itself include hearing loss and congenital heart defects, so the clinical
    overlap with this entity is genuine and gene testing, not phenotype, settles
    it.
  - >-
    Glaucoma is a major concern in Axenfeld-Rieger anomaly and was not reported
    in the index kindred here; conversely the mid-frequency mixed hearing loss
    characteristic of this entity is not an Axenfeld-Rieger feature.
  evidence:
  - reference: PMID:37895297
    reference_title: Alternative Genetic Diagnoses in Axenfeld-Rieger Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of JAG1 variants, linked with Alagille syndrome, in
      three separate families with a clinical diagnosis of ARA/ARS highlights the
      overlapping features and high variability of these two phenotypes.
    explanation: >-
      Directly documents JAG1 presenting under an Axenfeld-Rieger clinical label,
      which is what makes this a real rather than theoretical differential.
  - reference: PMID:37895297
    reference_title: Alternative Genetic Diagnoses in Axenfeld-Rieger Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a specific type of anterior segment disorder characterized by the triad of
      posterior embryotoxon
    explanation: >-
      Establishes posterior embryotoxon as an Axenfeld-Rieger triad element,
      which is the shared feature that creates the diagnostic confusion.
  - reference: PMID:37895297
    reference_title: Alternative Genetic Diagnoses in Axenfeld-Rieger Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      referred with diagnosis of ARS based on ARA, bilateral sensorineural
      hearing loss, midface hypoplasia, hypertelorism, and dental crowding
    explanation: >-
      A JAG1-positive individual carrying anterior-segment disease together with
      sensorineural hearing loss - the feature combination that defines this
      entity - reached the clinic under an Axenfeld-Rieger label.
  - reference: PMID:37895297
    reference_title: Alternative Genetic Diagnoses in Axenfeld-Rieger Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PITX2 and FOXC1 variants explain the majority of individuals with
      Axenfeld-Rieger syndrome (ARS) but leave ~30% unsolved.
    explanation: >-
      Supports the statement that the classic Axenfeld-Rieger genes account for
      about 70% of cases, leaving room for JAG1 and others.

- name: Atypical or oligosymptomatic Alagille syndrome
  description: >-
    Individuals carrying a JAG1 variant who manifest only one or two of the
    Alagille organ systems. This entity may ultimately prove to be a member of
    that continuum rather than a discrete disorder - see the open discussion on
    entity status recorded below.
  distinguishing_features:
  - >-
      Distinguished by the presence here of a highly penetrant, mid-frequency mixed
      hearing loss segregating with the cardiac and ocular features in a single
      large pedigree, and by the explicit statement in the index report that no
      affected individual met criteria for a previously described syndrome.
  evidence:
  - reference: PMID:21752016
    reference_title: >-
      JAG1 mutations are found in approximately one third of patients presenting
      with only one or two clinical features of Alagille syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The highest mutation detection rates were observed in patients with the
      most frequent presenting features of Alagille syndrome; ranging from 20%
      (one system) to 86% (five systems).
    explanation: >-
      Quantifies the oligosymptomatic JAG1 presentation that forms the boundary
      of this entity.

animal_models:
- name: headturner (Htu) Jag1 missense mouse
  species: Mouse
  genotype: Jag1 Htu/+ (dominant missense allele)
  publication: PMID:11259677
  description: >-
    A dominant, ENU-derived Jag1 missense allele - the same lesion class as the
    human p.Cys234Tyr - assessed in the heterozygous state, matching the dominant
    human inheritance. Its value here is that it links a heterozygous Jag1
    missense change to both vestibular and cochlear sensory deficits.
  modeled_mechanisms:
  - target: Impaired Notch-Dependent Inner Ear Sensory Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the inner-ear sensory arm of the mechanism - loss of vestibular
      ampullae and reduced outer hair cells - from a heterozygous Jag1 missense
      allele.
    limitations: >-
      The Htu allele is not p.Cys234Tyr and lies in a different part of the
      protein; the mouse was not reported to model the cardiac or ocular arms of
      the human phenotype, and gross ampullar agenesis is more severe than
      anything documented in the human kindred.
    evidence:
    - reference: PMID:11259677
      reference_title: The Notch ligand Jagged1 is required for inner ear sensory development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a dominant mouse mutant headturner (Htu) contains a missense mutation in
        the Jag1 gene and displays missing posterior and sometimes anterior
        ampullae, structures that house the sensory cristae
      explanation: >-
        Supports treating this model as informative for Jagged1-dependent inner
        ear sensory patterning.
  evidence:
  - reference: PMID:11259677
    reference_title: The Notch ligand Jagged1 is required for inner ear sensory development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Htu/+ mutants also demonstrate a significant reduction in the numbers of
      outer hair cells in the organ of Corti.
    explanation: >-
      Establishes the model as informative for this disorder: a heterozygous Jag1
      missense allele - the lesion class of the human p.Cys234Tyr variant -
      produces a cochlear sensory deficit.

- name: Jag1 Nodder (Jag1 Ndr/Ndr) mouse
  species: Mouse
  genotype: Jag1 Ndr/Ndr (hypomorphic Alagille syndrome model)
  publication: PMID:39373109
  description: >-
    A hypomorphic Jag1 mouse used as an Alagille syndrome model, with cochlear
    morphology plus single-cell RNA sequencing of the organ of Corti. It
    establishes that the cochlear phenotype is Jag1 dose dependent, which is what
    makes a heterozygous human loss-of-function allele a sufficient explanation
    for hearing loss. This speaks to the ear arm only: it is not support for a
    graded-dose account of the organ selectivity, which was tested and ruled out
    for p.Cys234Tyr.
  modeled_mechanisms:
  - target: Impaired Notch-Dependent Inner Ear Sensory Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces dose-dependent cochlear mis-patterning with combined auditory
      and vestibular deficits.
    limitations: >-
      A homozygous hypomorph rather than a heterozygous missense carrier, and not
      the p.Cys234Tyr allele; the cardiac and ocular arms of the human phenotype
      are not addressed by this study.
    evidence:
    - reference: PMID:39373109
      reference_title: >-
        Jag1 represses Notch activation in lateral supporting cells and inhibits
        an outer hair cell fate in the medial cochlea.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Jag1Ndr/Ndr mice exhibited expected vestibular and auditory deficits, a
        dose-dependent increase in ectopic inner hair cells, and a reduction in
        outer hair cells.
      explanation: >-
        Supports treating this model as informative for dose-dependent cochlear
        patterning failure.
  evidence:
  - reference: PMID:39373109
    reference_title: >-
      Jag1 represses Notch activation in lateral supporting cells and inhibits an
      outer hair cell fate in the medial cochlea.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notch signaling patterns the cochlear organ of Corti, and individuals with
      the JAG1/NOTCH2-related genetic disorder Alagille syndrome can thus
      experience hearing loss.
    explanation: >-
      Establishes the model as informative for the human JAG1 hearing phenotype
      that this entity shares with the wider JAG1 disease spectrum.

- name: Heterozygous Jagged1 knockout mouse (middle ear)
  species: Mouse
  genotype: Jag1 +/- heterozygous null
  publication: PMID:28566723
  description: >-
    The heterozygous Jag1 null mouse, used as an Alagille syndrome model, carries
    the conductive arm of the mechanism: it malforms the stapes and incus, and
    the stapes malformation tracks with hearing loss across all frequencies.
  modeled_mechanisms:
  - target: Impaired Jagged1-Notch2 Patterning of the Middle Ear Ossicles
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces ossicular malformation from a heterozygous reduction in Jagged1
      dose, matching the dominant human inheritance.
    limitations: >-
      A null allele rather than the human missense allele, so the ligand
      reduction is a clean 50%. That is now known to be the right dose for
      p.Cys234Tyr, which is functionally null, so the mismatch here is one of
      allele mechanism and species rather than of dose; the audiological
      correlate is still inferred from mouse thresholds rather than measured in
      a DCHE carrier.
    evidence:
    - reference: PMID:28566723
      reference_title: >-
        Requirement for Jagged1-Notch2 signaling in patterning the bones of the
        mouse and human middle ear.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous Jagged1 knockout mice, a model for Alagille Syndrome (AGS),
        also display stapes and incus defects.
      explanation: >-
        Supports treating this model as informative for Jagged1-dependent
        ossicular patterning.
  evidence:
  - reference: PMID:28566723
    reference_title: >-
      Requirement for Jagged1-Notch2 signaling in patterning the bones of the
      mouse and human middle ear.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observe similar stapes defects and hearing loss in one patient with
      heterozygous JAGGED1 loss, and a diversity of conductive and sensorineural
      hearing loss in nearly half of AGS patients, many of which carry JAGGED1
      mutations.
    explanation: >-
      Establishes the model as informative for humans: the mouse ossicular defect
      is mirrored in a person with heterozygous JAG1 loss, and the resulting
      mixed conductive-sensorineural pattern matches this entity's phenotype.

treatments:
- name: Genetic counselling
  description: >-
    Autosomal dominant transmission with high penetrance of the triad but marked
    variability in which lesion an individual carrier expresses. Counselling must
    convey a 50% transmission risk together with the point that the cardiac
    lesion in an affected child cannot be predicted from the parent's lesion, and
    should include cascade evaluation of at-risk relatives with audiometry and
    slit-lamp examination as well as echocardiography.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study, we report a kindred with hearing loss, congenital
      heart defects, and posterior embryotoxon, segregating as autosomal dominant
      traits.
    explanation: >-
      Establishes the autosomal dominant transmission pattern that determines the
      recurrence risk conveyed in counselling.
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings revealed a unique phenotype with highly penetrant deafness,
      posterior embryotoxon, and congenital heart defects but with variable
      expressivity in a large kindred
    explanation: >-
      Supports the counselling message that penetrance is high but expressivity
      varies between carriers of the same allele.

- name: Surgical repair of the congenital heart defect
  description: >-
    Management of the cardiac component follows standard congenital-cardiac
    practice for the specific lesion; there is no DCHE-specific cardiac protocol.
    Tetralogy of Fallot requires operative repair, whereas isolated peripheral
    pulmonic stenosis may need only surveillance - so the same allele in two
    relatives can imply completely different cardiac management, which is the
    practical consequence of the variable expressivity recorded here.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac Surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_phenotypes:
  - preferred_term: Tetralogy of Fallot
    term:
      id: HP:0001636
      label: Tetralogy of Fallot
  - preferred_term: Ventricular septal defect
    term:
      id: HP:0001629
      label: Ventricular septal defect
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had congenital heart defects, including tetralogy of Fallot,
      ventricular septal defect, or isolated peripheral pulmonic stenosis.
    explanation: >-
      Establishes the surgically relevant lesion set. PARTIAL - it documents the
      lesions requiring management, not an outcome of surgery in this disorder,
      for which no evidence exists.

- name: Audiological assessment and hearing rehabilitation
  description: >-
    Because the hearing loss is mixed and mid-frequency-predominant, it is not
    reliably caught by a screen tuned to high-frequency sensorineural loss, and
    full audiometry (with tympanometry to characterise the conductive component)
    is warranted in any carrier or at-risk relative. Amplification and
    language-development support follow standard paediatric audiology practice;
    no DCHE-specific rehabilitation evidence exists.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: audiological support and hearing amplification
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Combined (mixed) hearing loss
    term:
      id: HP:0000410
      label: Mixed hearing impairment
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six of seven available affected patients manifested mild-to-severe combined
      hearing loss, predominantly affecting middle frequencies.
    explanation: >-
      Establishes the mixed, mid-frequency character of the loss that dictates
      the audiological assessment described here. PARTIAL - it documents the
      deficit, not the effect of any intervention.

- name: Ophthalmic surveillance
  description: >-
    Posterior embryotoxon is itself usually visually silent and needs no
    treatment; what warrants follow-up is what may accompany it. Anterior-segment
    dysgenesis and glaucoma are the findings that determine visual outcome, and
    the overlap between JAG1 disease and the Axenfeld-Rieger spectrum, in which
    glaucoma is a principal concern, is close enough that periodic slit-lamp
    examination with intraocular pressure measurement is prudent in a carrier.
    Note the evidence base here is the wider JAG1 and anterior-segment
    literature: no glaucoma was reported in the index kindred, and no
    surveillance interval has been studied in this entity.
  action_category: MONITORING
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: ophthalmic surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no target_phenotypes. Surveillance detects a phenotype
    rather than acting on one, and test_non_therapeutic_actions_do_not_use_
    treatment_targets forbids treatment-style target slots on a MONITORING
    action. The phenotype linkage lives where it belongs, on the slit-lamp entry
    in the diagnosis section.
  evidence:
  - reference: PMID:37895297
    reference_title: Alternative Genetic Diagnoses in Axenfeld-Rieger Syndrome Spectrum.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of JAG1 variants, linked with Alagille syndrome, in
      three separate families with a clinical diagnosis of ARA/ARS highlights the
      overlapping features and high variability of these two phenotypes.
    explanation: >-
      Establishes the overlap with a spectrum in which glaucoma is a recognised
      threat to vision, which is the rationale for surveillance. PARTIAL: it
      documents the phenotypic overlap, not the value of any surveillance
      interval, which has not been studied in this entity.
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings revealed a unique phenotype with highly penetrant deafness,
      posterior embryotoxon, and congenital heart defects
    explanation: >-
      Establishes the near-universal ocular involvement that puts every carrier
      in scope for ophthalmic follow-up. PARTIAL: it documents the finding, not
      an outcome of surveillance.

discussions:
- discussion_id: dche_entity_status
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is DCHE a discrete disorder, or the liver-sparing tail of the JAG1
    (Alagille) phenotypic continuum?
  attaches_to:
  - pathophysiology#Modifier-Dependent Organ Selectivity of JAG1
      Haploinsufficiency
  rationale: >-
    Three facts pull in different directions and none of them settles the
    question. In favour of a discrete entity: OMIM and MONDO both catalogue it
    separately; the index report states explicitly that no affected individual
    met criteria for any previously described syndrome; and highly penetrant,
    mid-frequency mixed hearing loss is not a cardinal Alagille criterion. In
    favour of a continuum: the gene, the pathway, and two of the three cardinal
    features are shared with Alagille syndrome; JAG1 variants are routinely
    recovered from individuals expressing only one or two Alagille organ systems;
    and the mechanistic account offered here, complete haploinsufficiency whose
    organ selectivity is set by unidentified modifiers, is a continuum mechanism
    rather than a separate-disorder mechanism, since the very same class of null
    lesion underlies classic Alagille syndrome. The evidence base is also thin enough that the
    question may not be answerable: one kindred, one allele. dismech curates it
    as a separate entry because MONDO does and because the hearing phenotype is
    distinctive, while recording the continuum reading here rather than
    suppressing it.
  proposed_experiments:
  - experiment_id: dche_jag1_cohort_audiology_slitlamp
    name: >-
      Audiological and slit-lamp phenotyping of a JAG1 cohort
    description: >-
      Systematic audiological and slit-lamp phenotyping of a molecularly defined
      JAG1 cohort, to establish whether mid-frequency mixed hearing loss
      segregates with a particular allele class or is a general,
      under-ascertained feature of JAG1 disease.
  - experiment_id: dche_additional_c234y_kindreds
    name: >-
      Ascertainment of additional EGF-repeat cysteine kindreds
    description: >-
      Identification of additional unrelated p.Cys234Tyr (or other EGF-repeat-1
      cysteine) kindreds, to test whether the liver-sparing triad is
      allele-specific or family-specific.
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No individual in this family met diagnostic criteria for any previously
      described clinical syndrome.
    explanation: >-
      The strongest single statement for discrete-entity status.
  - reference: PMID:21752016
    reference_title: >-
      JAG1 mutations are found in approximately one third of patients presenting
      with only one or two clinical features of Alagille syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a JAG1 gene mutation is particularly useful for those
      patients with atypical or mild Alagille syndrome who do not meet classic
      diagnostic criteria as it provides a definite molecular diagnosis
    explanation: >-
      Supports the competing continuum reading, in which this kindred is an
      atypical JAG1 presentation rather than a separate disorder.

- discussion_id: dche_organ_selectivity_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    If JAG1 p.Cys234Tyr is completely haploinsufficient, what determines that the
    heart, ears and anterior segment are affected while the liver is spared?
  attaches_to:
  - pathophysiology#Modifier-Dependent Organ Selectivity of JAG1
      Haploinsufficiency
  rationale: >-
    This is the central unsolved question of the entry, and it became sharper
    rather than softer once p.Cys234Tyr was assayed. The intuitive answer -
    that a partially functional allele leaves enough ligand for the tissues with
    the lowest requirement - was proposed on the strength of the hypomorphic
    p.Gly274Asp allele, and then specifically defeated: p.Cys234Tyr is
    EndoH-sensitive, absent from the cell surface, and unable to activate Notch,
    yet its carriers still have normal liver function. A functionally null allele
    and a leaky allele therefore produce the same liver-sparing pattern, which
    means residual ligand dose cannot be what distinguishes the spared organ from
    the affected ones. The assaying authors attribute the pattern to
    unidentified modifying factors. Nothing currently narrows what those are:
    candidate classes include trans-acting variation at other Notch-pathway loci,
    tissue-specific differences in the compensating ligand repertoire (JAG2,
    DLL1/4) or in receptor availability (NOTCH1 vs NOTCH2), and differences in
    how much developmental time each organ has to recover from a signalling
    deficit. Until that is resolved, the organ-selectivity node is curated
    HYPOTHETICAL and this entry does not claim a dose-threshold mechanism.
  proposed_experiments:
  - experiment_id: dche_modifier_genome_analysis
    name: >-
      Genome-wide modifier search in discordant JAG1 carriers
    description: >-
      Whole-genome sequencing of JAG1 carriers concordant for genotype but
      discordant for hepatic involvement, within and across families, testing
      for trans-acting modifier variation at Notch-pathway and other loci. This
      is the study design the assaying authors themselves proposed.
  - experiment_id: dche_tissue_ligand_receptor_repertoire
    name: >-
      Comparative ligand and receptor repertoire across affected and spared organs
    description: >-
      Single-cell profiling of Notch ligand and receptor expression in
      developing bile duct, cardiac outflow tract, cochlea and periocular
      mesenchyme, to test whether the spared tissue is the one with the greatest
      redundancy from other ligands.
  - experiment_id: dche_allelic_series_organ_thresholds
    name: >-
      Allelic series comparison of organ-level thresholds
    description: >-
      Direct comparison of null, hypomorphic and knock-in p.Cys234Tyr alleles
      for bile-duct number, outflow-tract anatomy and auditory thresholds, to
      establish whether any organ phenotype tracks residual ligand dose at all.
  evidence:
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      What remains unknown is why these cases present with only a cardiac
      phenotype and not the full clinical features of AGS, particularly hepatic
      disease.
    explanation: >-
      The assaying authors state this question as unresolved, which is what makes
      it a knowledge gap rather than a curation shortfall.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the p.C234Y and p.P810L mutations appear to be completely
      haploinsufficient
    explanation: >-
      The assay half of the finding: cell-based characterisation establishes that
      the allele retains no function.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      yet the patients with these mutations do not have the full spectrum of AGS,
      consistent with the presence of additional modifying factors
    explanation: >-
      The clinical half of the same finding, split out per the CLAUDE.md rule
      that a mixed-source sentence should not share one evidence_source: the
      patients' restricted phenotype is a human observation, and it is what
      forces the modifier interpretation.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an era of increasing whole genome analysis, future studies may elucidate
      what these modifying factors are and allow for better predictive diagnosis
      in humans with JAG1 mutations.
    explanation: >-
      Supports the genome-wide modifier search recorded as the first proposed
      experiment.

- discussion_id: anterior_segment_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what developmental route does reduced Jagged1 dose produce posterior
    embryotoxon?
  attaches_to:
  - pathophysiology#Disrupted Anterior Segment Development in Periocular Neural
      Crest
  rationale: >-
    The auditory and cardiac arms of this entity each rest on a dedicated
    Jagged1-specific developmental study. The ocular arm does not: no study of
    Jagged1 in anterior-segment or periocular-mesenchyme morphogenesis was
    identified during curation. What supports the node is the human phenotype
    association plus the neural-crest origin of the Schwalbe line, corneal
    endothelium and trabecular meshwork - which is inference from anatomy, not a
    demonstrated mechanism. The node is therefore marked HYPOTHETICAL and its
    incoming edge INDIRECT_UNKNOWN_INTERMEDIATES.
  proposed_experiments:
  - experiment_id: jag1_periocular_crest_conditional_deletion
    name: >-
      Conditional Jag1 deletion in periocular neural crest
    description: >-
      Conditional Jag1 deletion in neural-crest-derived periocular mesenchyme,
      with anterior-segment morphometry and Schwalbe-line position as readouts.
  - experiment_id: anterior_chamber_notch_reporter_mapping
    name: >-
      Notch-reporter mapping of the developing anterior chamber angle
    description: >-
      Notch-reporter mapping of the developing anterior chamber angle to
      establish where and when Jagged1-Notch signalling is active in that
      territory.
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings revealed a unique phenotype with highly penetrant deafness,
      posterior embryotoxon, and congenital heart defects
    explanation: >-
      Establishes the phenotype whose developmental mechanism is the subject of
      this gap.

- discussion_id: dche_model_organism_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the available Jag1 mouse models, none of which carries p.Cys234Tyr,
    faithfully represent the human DCHE mechanism?
  attaches_to:
  - pathophysiology#Impaired Notch-Dependent Inner Ear Sensory Patterning
  - pathophysiology#Impaired Jagged1-Notch2 Patterning of the Middle Ear Ossicles
  rationale: >-
    All three mouse models curated here are informative for Jagged1-dependent ear
    development, and none of them models this disorder. Htu is a different
    missense allele; Jag1 Ndr/Ndr is a homozygous hypomorph; the middle-ear work
    uses a heterozygous null. The heterozygous null is in fact the closest match
    on dose, since p.Cys234Tyr was subsequently shown to be functionally null
    rather than leaky; Htu is a different missense allele of unknown residual
    activity, and the homozygous hypomorph sits at a lower dose than any human
    carrier. Additionally, no mouse model reproduces the human triad: the ear
    models do not address the cardiac or ocular arms, and the cardiac model does
    not address hearing. Most importantly, no mouse model addresses the feature
    that actually defines this disorder against Alagille syndrome - whether
    bile-duct development is spared - so the models can corroborate the ear and
    heart arms while being silent on the entity's defining negative.
  proposed_experiments:
  - experiment_id: c234y_knockin_mouse_full_triad_phenotyping
    name: >-
      Jag1 p.Cys234Tyr knock-in mouse with full triad phenotyping
    description: >-
      A Jag1 p.Cys234Tyr knock-in mouse, phenotyped for auditory thresholds and
      configuration, vestibular function, outflow-tract anatomy,
      anterior-segment morphology, and bile-duct number - the last being the specific
      test of the liver-sparing claim.
  - experiment_id: jag1_allelic_series_organ_dose_thresholds
    name: >-
      Allelic series comparison of ear, heart and liver phenotypes
    description: >-
      Allelic series comparison (null, hypomorphic missense, p.Cys234Tyr
      knock-in) of ear, heart and liver phenotypes, to establish whether any
      organ phenotype tracks residual ligand dose at all.
  evidence:
  - reference: PMID:11259677
    reference_title: The Notch ligand Jagged1 is required for inner ear sensory development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a dominant mouse mutant headturner (Htu) contains a missense mutation in
      the Jag1 gene and displays missing posterior and sometimes anterior
      ampullae, structures that house the sensory cristae
    explanation: >-
      A different Jag1 missense allele producing gross ampullar agenesis, more
      severe than anything reported in the human kindred - the mismatch this
      discussion records.
  - reference: PMID:39373109
    reference_title: >-
      Jag1 represses Notch activation in lateral supporting cells and inhibits an
      outer hair cell fate in the medial cochlea.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Jag1Ndr/Ndr mice exhibited expected vestibular and auditory deficits, a
      dose-dependent increase in ectopic inner hair cells, and a reduction in
      outer hair cells.
    explanation: >-
      A homozygous hypomorph, i.e. a different point on the dose-response curve
      from a heterozygous human missense carrier.


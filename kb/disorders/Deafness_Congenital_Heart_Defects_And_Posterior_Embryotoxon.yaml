- name: Disrupted Second Heart Field and Cardiac Neural Crest Outflow Tract
    Development
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Jagged1-Notch signalling in second heart field progenitors sustains Fgf8 and
    Bmp4 expression, and through them coordinates two neighbouring tissues:
    migrating cardiac neural crest and the endothelial-to-mesenchymal transition
    that populates the outflow-tract endocardial cushions. Loss of that signal
    produces aortic arch artery and outflow-tract anomalies of exactly the
    right-sided class seen in this kindred - tetralogy of Fallot, ventricular
    septal defect, and peripheral pulmonic stenosis. In the peripheral pulmonary
    arteries the corresponding structural lesion in JAG1 disease is a tunica
    media depleted of smooth muscle cells and thickened by collagen and elastic
    fibres.

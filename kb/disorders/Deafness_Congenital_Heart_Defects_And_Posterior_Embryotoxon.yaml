notes: >-
  NEC (Named Entity Confusion) preflight, recorded because this entity is a
  high-risk case: "posterior embryotoxon plus congenital heart defects" is a
  cardinal Alagille syndrome pairing, kb/disorders/Alagille_syndrome.yaml already
  exists, and the two disorders share a causal gene, so a gene-frequency check
  cannot discriminate between them.

  `just preflight-dr <report> MONDO:0060713` returned SKIP - MONDO records no
  RO:0004003 causal gene for this term - and additionally reported an OMIM
  mismatch (report 118450 versus MONDO xref 617992). The manual OMIM/synonym
  preflight was therefore run, and the mismatch was resolved as a false positive:
  OMIM 118450 appears in the report only inside a correctly labelled contrastive
  paragraph about classic Alagille syndrome, while the report's target entity is
  named as MONDO:0060713 throughout. Identity anchors all agree - MONDO:0060713
  xrefs OMIM:617992 with the related synonym DCHE; the index publication
  PMID:12022040 (fetched directly from PubMed before the deep-research report was
  read) names JAG1 p.Cys234Tyr in the triad kindred; and JAG1 dominates the
  report's gene mentions (61, versus NOTCH2 6). Manual verdict: PASS.

  Independence note: the phenotype and genetic content of this entry was
  anchored on primary literature retrieved directly from PubMed before the falcon
  report was opened.

  Evidence-source note: PMID:20437614 (Bauer 2010) is cached as full text, not
  abstract only, and the allele-level functional evidence for p.Cys234Tyr -
  EndoH sensitivity, absence from the cell surface by trypsin shaving and by
  immunofluorescence, failure to activate a CBF-dependent Notch reporter, and the
  authors' conclusion of complete haploinsufficiency - is quoted from that cached
  body. An earlier draft of this entry wrongly treated that evidence as
  unavailable and built the mechanism on a graded "leaky allele" dose model
  extrapolated from the p.Gly274Asp allele of PMID:12649809. Bauer 2010
  explicitly tested and rejected that model for this allele, so the mechanism
  chain here is haploinsufficiency plus unidentified modifiers, and PMID:12649809
  is retained only as the labelled contrasting hypothesis.

  GeneReviews: no GeneReviews chapter exists for this entity. The Alagille
  syndrome chapter (PMID:20301450) is tagged in `references:` and used only for
  the allelic-disorder differential, not as a phenotype baseline for this entry.

  Datasets: `just discover-datasets` was run and returned no relevant accession.
  Every candidate was a GENE_ONLY match reached through JAG1 - breast cancer
  lymph-node metastasis, glioma, pancreatic islet, embryonic haematopoietic stem
  cell - i.e. whatever JAG1 is famous for, which is exactly the Named Entity
  Confusion pattern the dataset-curation SOP warns about. No cochlear,
  anterior-segment or outflow-tract dataset was found for this gene, and none
  exists for this entity. `datasets:` is therefore deliberately empty rather than
  populated with a resolvable but irrelevant accession.

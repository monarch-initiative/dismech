      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings revealed a unique phenotype with highly penetrant deafness,
        posterior embryotoxon, and congenital heart defects but with variable
        expressivity in a large kindred, which demonstrates that mutation in JAG1
        can cause hearing loss.
      explanation: >-
        Establishes deafness as a highly penetrant, defining feature of this
        entity, which is what places it in the ear-disorder chapter.
  - classification_value: CARDIOVASCULAR
    notes: >-
      Congenital heart disease was present in every affected member of the index

      heart defects, and posterior embryotoxon, segregating as autosomal dominant
      traits.
    explanation: >-
      Directly establishes autosomal dominant segregation in the index pedigree.
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like

pathophysiology:
- name: JAG1 First EGF-Like Repeat Cysteine Substitution
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The disease-initiating lesion is a heterozygous germline JAG1 missense
    variant, p.Cys234Tyr, that replaces the first cysteine of the first
    epidermal-growth-factor(EGF)-like repeat of Jagged1. EGF-like repeats are
    small, disulfide-stapled modules whose fold depends on a fixed pattern of
    six cysteines; losing one of them leaves an unpaired partner and destabilises
    the module. Missense variants in JAG1 are non-randomly distributed and
    cluster in exactly these regions - the amino-terminal region, the DSL domain,
    and two clusters within the EGF repeats - which is the structural context in
    which this substitution should be read.
  genetic_context:
    gene:
      preferred_term: JAG1
      term:
        id: hgnc:6188
        label: JAG1
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline JAG1 p.Cys234Tyr (C234Y). Classified LOSS_OF_FUNCTION
      on direct functional assay of this allele: the mutant protein is
      EndoH-sensitive, absent from the cell surface, and unable to activate Notch
      signalling, i.e. complete haploinsufficiency. No dominant-negative activity
      has been demonstrated for the JAG1 missense proteins assayed to date.
  genes:
  - preferred_term: JAG1
    term:
      id: hgnc:6188
      label: JAG1
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A candidate-gene approach was undertaken and culminated in the
      identification of a novel Jagged 1 (JAG1) missense mutation (C234Y) in the
      first cysteine of the first epidermal-growth-factor-like repeat domain of
      the protein.
    explanation: >-
      Directly identifies the causal allele and its position in the first
      EGF-like repeat.
  - reference: PMID:11157803
    reference_title: >-
      Defective intracellular transport and processing of JAG1 missense mutations
      in Alagille syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Missense mutations are non-randomly distributed across the protein with
      clusters at the 5' end of the protein, in the conserved DSL domain, and two
      clusters within the EGF repeats.
    explanation: >-
      Establishes that pathogenic JAG1 missense variants cluster in the EGF
      repeats, the structural context of the C234Y substitution.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Residue 234 (p.C234Y) is located in the first EGF repeat, while 664
      (p.C664S) is in the eleventh, and 810 (p.P810L) is in the fifteenth
    explanation: >-
      Independently confirms the position of the substituted residue in the first
      EGF-like repeat.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cysteine residues are required for proper folding of EGF repeats due to
      their role in the formation of disulfide bridges.
    explanation: >-
      Supplies the structural reason a cysteine substitution in an EGF repeat is
      destabilising, which is the first step of the mechanism chain.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Residue 234 lies in the first EGF repeat within this critical region,
      suggesting that loss of this cysteine residue would have deleterious
      effects on Notch signaling.
    explanation: >-
      Places residue 234 inside the crystallographically defined
      receptor-ligand-interaction region, explaining why its loss is pathogenic.
  downstream:
  - target: Misfolding and Endoplasmic-Reticulum Retention of Mutant Jagged1
    causal_link_type: DIRECT
    description: >-
      Loss of a structurally required cysteine prevents correct disulfide-bonded
      folding of the EGF module, which is what commits the nascent protein to the
      ER quality-control fate rather than the secretory route.
    evidence:
    - reference: PMID:20437614
      reference_title: >-
        Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
        stenosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        JAG1 variants p.C234Y and p.P810L are sensitive to EndoH, suggesting they
        are improperly modified
      explanation: >-
        Direct assay of the C234Y protein: EndoH sensitivity is the signature of
        a glycoprotein that never left the endoplasmic reticulum for Golgi
        processing.
    - reference: PMID:22487239
      reference_title: >-
        Functional analysis of the Notch ligand Jagged1 missense mutant proteins
        underlying Alagille syndrome.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        These mutant proteins localized mainly to the endoplasmic reticulum (ER),
        suggesting that the mutations induced improper protein folding.
      explanation: >-
        Generalises misfolding-driven ER localisation across the JAG1 missense
        class. PARTIAL because the assayed alleles were P163L, R184H, G386R and
        C714Y, not C234Y itself.

- name: Misfolding and Endoplasmic-Reticulum Retention of Mutant Jagged1
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Improperly folded Jagged1 is recognised by the ER quality-control machinery,
    is abnormally glycosylated, and accumulates intracellularly instead of
    transiting to the plasma membrane. For p.Cys234Tyr specifically this has been
    demonstrated directly and by two independent methods: the protein remains
    endoglycosidase-H sensitive, meaning its N-glycans were never processed in
    the Golgi, and immunofluorescence shows no cell-surface staining at all.
    Across the wider JAG1 missense class, ER-retained mutants bind the lectin
    chaperones calnexin and calreticulin more avidly than wild-type Jagged1 does,
    which is the quality-control step that holds them there. Importantly, no
    dominant-negative activity has been detected for the JAG1 missense proteins
    assayed to date, so the mutant allele subtracts function rather than
    poisoning the wild-type product.
  biological_processes:
  - preferred_term: protein folding in the endoplasmic reticulum
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
    modifier: ABNORMAL
  - preferred_term: delivery of Jagged1 to the plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The p.C234Y variant displayed no cell surface staining, consistent with its
      being retained intracellularly, similar to previously reported AGS missense
      mutants
    explanation: >-
      Direct immunofluorescence evidence that the C234Y protein is retained
      intracellularly rather than reaching the plasma membrane.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      JAG1 variants p.C234Y and p.P810L are sensitive to EndoH, suggesting they
      are improperly modified as previously reported for JAG1 mutations
      associated with AGS
    explanation: >-
      Independent biochemical confirmation, by glycan processing rather than
      imaging, that the C234Y protein does not transit the secretory pathway
      normally.
  - reference: PMID:11157803
    reference_title: >-
      Defective intracellular transport and processing of JAG1 missense mutations
      in Alagille syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Neither R184H or L37S is present on the cell surface and both are
      abnormally glycosylated. Furthermore, these mutations lead to abnormal
      accumulation of the protein, possibly in the endoplasmic reticulum.
    explanation: >-
      Generalises the abnormal-glycosylation plus ER-accumulation phenotype
      across pathogenic JAG1 missense alleles. PARTIAL because C234Y itself was
      not among the alleles assayed in this earlier study.
  - reference: PMID:22487239
    reference_title: >-
      Functional analysis of the Notch ligand Jagged1 missense mutant proteins
      underlying Alagille syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These results indicate that accumulation in the ER and binding to the
      chaperones correlate with the impaired signal-transduction activities of
      the missense mutant proteins, which may contribute to the pathogenic
      mechanism of ALGS.
    explanation: >-
      Links ER accumulation and chaperone binding causally to impaired
      signalling. PARTIAL: of the four alleles assayed, this held for P163L and
      R184H, whereas G386R behaved like wild type and C714Y was less severe -
      so the correlation is a class-level statement, not a per-allele one.
  - reference: PMID:22487239
    reference_title: >-
      Functional analysis of the Notch ligand Jagged1 missense mutant proteins
      underlying Alagille syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Dominant-negative effects were not detected for any mutant protein.
    explanation: >-
      Supports subtractive loss of function rather than a dominant-negative
      mechanism, which is why the downstream node is framed as loss of ligand
      rather than interference with the wild-type product. Scope: four alleles
      were assayed (P163L, R184H, G386R, C714Y), so this is "not detected in the
      proteins assayed to date", not a universal negative.
  downstream:
  - target: Loss of Cell-Surface Jagged1 and Failure of Notch Trans-Activation
    causal_link_type: DIRECT
    description: >-
      Ligand retained in the ER cannot engage Notch receptors on neighbouring
      cells. For p.Cys234Tyr the retention is complete rather than partial, so
      the functional consequence is the absence of mutant ligand from the surface
      pool, not merely its reduction.
    evidence:
    - reference: PMID:20437614
      reference_title: >-
        Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
        stenosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The p.C234Y and p.P810L JAG1 proteins did not demonstrate any changes in
        size with increasing exposure, suggesting they are not accessible to
        trypsin degradation and therefore not present on the cell surface.
      explanation: >-
        Trypsin-shaving evidence that the retained C234Y protein is entirely
        absent from the cell surface, which is what makes the retention
        functionally complete.

- name: Loss of Cell-Surface Jagged1 and Failure of Notch Trans-Activation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Jagged1 is a membrane-tethered ligand that must be displayed on the surface
    of the signal-sending cell to activate Notch receptors on the adjacent
    signal-receiving cell. Because the p.Cys234Tyr product never reaches the
    surface, it contributes nothing to trans-activation: in a CBF-dependent
    luciferase reporter it behaves like the known null allele p.Leu37Ser and
    cannot initiate Notch signalling at all. The carrier is therefore left with
    only the wild-type allele's ligand on the cell surface - complete
    haploinsufficiency, not a graded hypomorphic reduction. This distinction is
    load-bearing for this entry, because a hypomorphic "leaky allele" model was
    the leading explanation for liver-sparing JAG1 phenotypes until this allele
    was assayed and found to be null.
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:12022040
    reference_title: >-
      Familial deafness, congenital heart defects, and posterior embryotoxon
      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JAG1 is a cell-surface ligand in the Notch signaling pathway.
    explanation: >-
      Establishes the cell-surface-ligand role that makes surface delivery the
      rate-limiting step for signalling.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Conversely, p.C234Y and p.P810L were unable to activate Notch signaling,
      similar to the AGS missense mutation p.L37S.
    explanation: >-
      Reporter-assay evidence that the C234Y protein has no residual
      trans-activating capacity, benchmarked against a known null allele.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The p.C234Y and p.P810L mutations were not present at the cell surface,
      were not properly post-translationally modified, and could not initiate
      Notch signaling. We would therefore predict that these mutations lead to
      JAG1 haploinsufficiency, with only the wild-type allele in carriers of this
      dominant mutation appearing on the cell surface.
    explanation: >-
      The assaying authors' own summary: all three assays agree, and the
      consequence is haploinsufficiency with only wild-type ligand at the
      surface.
  - reference: PMID:12649809
    reference_title: >-
      Conditional JAG1 mutation shows the developing heart is more sensitive than
      developing liver to JAG1 dosage.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Carriers of this mutation therefore have >50% but <100% of the normal
      concentration of JAG1 molecules on the cell surface.
    explanation: >-
      Cited here as the CONTRASTING leaky-allele model, not as a description of
      this disorder. It quantifies the graded reduction produced by the
      hypomorphic p.Gly274Asp allele; p.Cys234Tyr was subsequently shown NOT to
      behave this way, which is why this entry does not use a graded-dose
      mechanism.
  - reference: PMID:38194749
    reference_title: >-
      Jagged-mediated development and disease: Mechanistic insights and
      therapeutic implications for Alagille syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alagille syndrome is usually caused by a single mutation in the jagged
      canonical Notch ligand 1 (JAG1), and manifests with liver disease and
      cardiovascular symptoms that are a direct consequence of JAG1
      haploinsufficiency.
    explanation: >-
      Establishes reduced JAG1 dose (haploinsufficiency) as the accepted
      mechanism class for JAG1 disorders generally.
  downstream:
  - target: Modifier-Dependent Organ Selectivity of JAG1 Haploinsufficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Half-dose Jagged1 is uniform across every tissue in the carrier, yet only
      some organs malform. The step from the uniform molecular deficit to a
      selective set of malformations is therefore not itself explained by the
      deficit, and is marked INDIRECT_UNKNOWN_INTERMEDIATES because the factors
      that make one tissue decompensate and another not are unidentified.
    evidence:
    - reference: PMID:20437614
      reference_title: >-
        Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
        stenosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, the p.C234Y and p.P810L mutations appear to be completely
        haploinsufficient, yet the patients with these mutations do not have the
        full spectrum of AGS, consistent with the presence of additional
        modifying factors.
      explanation: >-
        States exactly this step: complete haploinsufficiency does not by itself
        determine which organs are affected, so modifiers must intervene.

- name: Modifier-Dependent Organ Selectivity of JAG1 Haploinsufficiency
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    This node is the mechanistic hinge that separates this entity from Alagille
    syndrome, and it is deliberately curated as an unsolved step rather than an
    explanation. Every cell in a p.Cys234Tyr carrier has the same half-dose of
    functional Jagged1, yet the heart, inner ear, middle ear and anterior ocular
    segment malform while the intrahepatic biliary tree does not. The obvious
    candidate explanation - that the allele is hypomorphic and leaves enough
    ligand for the less demanding tissues - was proposed for the leaky
    p.Gly274Asp allele and then specifically ruled out for p.Cys234Tyr, which is
    functionally null and still spares the liver. What remains is that
    unidentified modifying factors, not residual ligand, determine the organ set.
    The clinical corollary is unchanged and important: the absence of cholestasis
    does not exclude a JAG1 disorder, and JAG1 variants are recovered from
    individuals presenting with only one or two of the Alagille organ systems.
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The missense mutants displayed heterogeneous behavior in these assays, some
      with complete haploinsufficiency, suggesting that there are additional
      modifiers leading to organ specific features.
    explanation: >-
      Directly states the organ-specificity-plus-modifiers interpretation that
      this node encodes.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      What remains unknown is why these cases present with only a cardiac
      phenotype and not the full clinical features of AGS, particularly hepatic
      disease.
    explanation: >-
      The assaying authors' explicit statement that this step is unexplained,
      which is why the node carries mechanism_confidence HYPOTHETICAL.
  - reference: PMID:20437614
    reference_title: >-
      Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic
      stenosis.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      We hypothesized at the time that the peculiar nature of these mutations
      could result in hypomorphic activity and not true haploinsufficiency, and
      that this increased level of functionality was sufficient to prevent the
      typical liver manifestations seen in AGS, but the developing heart was too
      sensitive to slightly decreased Notch signaling and was still affected.
      However, the p.C234Y and p.P810L mutations appear to be completely
      haploinsufficient
    explanation: >-
      REFUTE against the graded-dose / leaky-allele explanation of liver sparing.
      The authors state the hypothesis and then report the result that defeats it
      for this allele. This is the finding that required the mechanism curated
      here to be reframed from dose thresholds to modifiers.

    snippet: >-
      a dominant mouse mutant headturner (Htu) contains a missense mutation in
      the Jag1 gene and displays missing posterior and sometimes anterior
      ampullae, structures that house the sensory cristae
    explanation: >-
      A dominant Jag1 missense allele - the same lesion class as C234Y - disrupts

      caused by cysteine substitution in the first epidermal-growth-factor-like
      domain of jagged 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six of seven available affected patients manifested mild-to-severe combined
      hearing loss, predominantly affecting middle frequencies.
    explanation: >-

name: Deafness, Congenital Heart Defects, and Posterior Embryotoxon
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: deafness, congenital heart defects, and posterior embryotoxon
  term:
    id: MONDO:0060713
    label: deafness, congenital heart defects, and posterior embryotoxon
synonyms:
- DCHE
- JAG1-related deafness-congenital heart defects-posterior embryotoxon syndrome
description: >-
  Deafness, congenital heart defects, and posterior embryotoxon (DCHE, OMIM
  617992) is an ultra-rare autosomal dominant Notch-ligand disorder delineated in
  a single large French kindred carrying the heterozygous JAG1 missense variant
  p.Cys234Tyr (C234Y), which substitutes the first cysteine of the first
  epidermal-growth-factor-like repeat of Jagged1. Affected individuals show a
  highly penetrant triad of mild-to-severe combined (mixed) hearing loss with a
  mid-frequency emphasis, congenital heart defects drawn from the right-sided
  outflow-tract spectrum (tetralogy of Fallot, ventricular septal defect,
  isolated peripheral pulmonic stenosis), and posterior embryotoxon, with
  vestibular involvement in a subset.

  DCHE is allelic to Alagille syndrome - the same gene, the same signalling
  pathway, two of the same cardinal features - but is a clinically separable
  presentation: no individual in the index kindred met diagnostic criteria for
  Alagille syndrome or any other described syndrome, all carriers had normal
  liver function, and the defining hepatic feature of Alagille syndrome
  (cholestasis with paucity of interlobular bile ducts) is absent, as are
  butterfly vertebrae and the characteristic facies.

  The mechanism of that dissociation is NOT a milder molecular lesion. p.Cys234Tyr
  has been assayed directly: the mutant protein is EndoH-sensitive (improperly
  post-translationally modified), is absent from the cell surface by both trypsin
  shaving and immunofluorescence, and cannot activate Notch signalling - it is,
  in the assaying authors' words, completely haploinsufficient. That result
  specifically defeats the attractive "leaky allele" explanation: the same group
  had proposed, on the strength of the hypomorphic JAG1 p.Gly274Asp allele, that
  residual ligand dose was what spared the liver in cardiac-only JAG1 families,
  and then found that a completely null allele produces the same liver sparing.
  The organ selectivity of this disorder is therefore attributed to additional
  modifying factors, still unidentified, rather than to residual Jagged1
  activity. This entry deliberately does NOT import Alagille syndrome cohort
  frequencies, and curates hearing loss - which is not a cardinal Alagille
  criterion - as the feature that names this entity.
parents:
- hereditary disease
- Syndromic hearing loss
- Congenital heart defect

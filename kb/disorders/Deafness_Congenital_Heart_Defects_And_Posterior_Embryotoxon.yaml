phenotypes:
- name: Mixed hearing impairment
  category: Auditory
  diagnostic: true
  frequency: VERY_FREQUENT
  description: >-
    Mild-to-severe combined (mixed) hearing loss - that is, with both conductive
    and sensorineural components - affected six of the seven available affected
    members of the index kindred. This is the feature that names the entity and
    that distinguishes it from Alagille syndrome, in which hearing loss is not a
    cardinal diagnostic criterion. Mechanistically the two components have
    separate substrates: middle-ear ossicular malformation for the conductive
    part and cochlear sensory mis-patterning for the sensorineural part.

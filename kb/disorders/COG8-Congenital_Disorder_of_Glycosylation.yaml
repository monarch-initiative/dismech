- name: COG8-knockout HEK293T proteoglycan model
  experimental_model_type: CELL_LINE
  description: CRISPR/Cas9 COG8-knockout HEK293T cells have reduced sulfate incorporation into proteoglycans, preserved chain lengths on secreted proteoglycans, longer cell-associated GAG chains and preserved surface 10E4 antibody recognition. These findings do not establish a patient-tissue proteoglycan defect or clinical severity mechanism.
  modeled_mechanisms:
  - target: Biallelic COG8 dysfunction
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: Complete engineered knockout differs from individual patient alleles; no clinical skeletal phenotype is reproduced.
    evidence:
    - reference: PMID:34053170
      reference_title: Proteoglycan synthesis in conserved oligomeric Golgi subunit deficient HEK293T cells is affected differently, depending on the lacking subunit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We here show that glycosaminoglycan (GAG) modification of PGs is significantly reduced, regardless which COG subunit that is missing in HEK293T cells.
      explanation: KO model readout, not a measured patient phenotype.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: Cultured cells do not include the neural, hepatic and systemic interactions needed to explain the clinical phenotype.
  findings:
  - statement: Secreted proteoglycan GAG chain lengths were preserved in COG8-knockout cells.
    evidence:
    - reference: PMID:34053170
      reference_title: Proteoglycan synthesis in conserved oligomeric Golgi subunit deficient HEK293T cells is affected differently, depending on the lacking subunit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: COG1 and COG8 (figure 4, panels C and J) deficient cells displayed GAG chains of similar length to the wild type cells
      explanation: Secreted-chain finding distinguishes COG8 from several other COG subunit knockouts.
  - statement: Surface heparan sulfate 10E4 recognition was preserved despite reduced overall proteoglycan synthesis.
    evidence:
    - reference: PMID:34053170
      reference_title: Proteoglycan synthesis in conserved oligomeric Golgi subunit deficient HEK293T cells is affected differently, depending on the lacking subunit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: A surprising finding was that, both COG1 and COG8 deficient cells were recognized to the same extent as wild type cells
      explanation: The 10E4 flow-cytometry result does not measure all heparan sulfate functions.

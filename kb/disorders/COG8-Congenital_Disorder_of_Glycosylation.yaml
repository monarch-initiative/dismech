  downstream:
  - target: Mislocalization of Golgi Glycosylation Machinery
    description: >-
      Failure to recycle Golgi residents retrogradely strands
      glycosyltransferases in the wrong compartment.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21421995
      reference_title: Conserved oligomeric Golgi complex specifically regulates the maintenance of Golgi glycosylation machinery.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The lobe B COG subcomplex subunits COG6 and COG8 were localized on trafficking intermediates that carry Golgi glycosyltransferases, indicating that the COG complex is directly involved in trafficking and maintenance of Golgi glycosylation machinery."
      explanation: >-
        Places COG8 itself on the trafficking intermediates that carry Golgi
        glycosyltransferases, linking the tethering defect to enzyme
        mislocalisation.

- name: Mislocalization of Golgi Glycosylation Machinery
  biological_scale: CELLULAR
  description: >-
    Golgi glycosyltransferases and glycosidases depend on continuous retrograde
    recycling to maintain their non-uniform distribution across the Golgi
    stack. When COG function fails, medial- and trans-Golgi enzymes are
    mislocalised; in the COG8 patient, beta1,4-galactosyltransferase levels
    were significantly reduced.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: Golgi vesicle transport
    modifier: ABNORMAL
    term:

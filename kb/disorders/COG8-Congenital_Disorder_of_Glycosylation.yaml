genetic:
- name: COG8 pathogenic variants
  association: Causal
  relationship_type: CAUSATIVE
  presence: Pathogenic
  gene_term:
    preferred_term: COG8
    term:
      id: hgnc:18623
      label: COG8
  notes: 'Published genotypes include early and late frameshifts, a nonsense allele and splice-altering variants. The 2019 exon 5 hotspot suggestion does not imply that every causal allele lies there: an intron 3 splice donor allele is explicitly documented in the 2007 report.'
  evidence:
  - reference: PMID:17331980
    reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe a new Type II congenital disorder of glycosylation (CDG-II) caused by mutations in the conserved oligomeric Golgi (COG) complex gene, COG8.
    explanation: Establishes COG8 as the causal gene.
  - reference: PMID:28619360
    reference_title: 'Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Targeted exome sequencing was performed to screen all CDG type II-related genes, and two novel frameshift mutations were found: c.171dupG (p.Leu58Alafs*29) and c.1656dupC (p.Ala553Argfs*15) in COG8.'
    explanation: Reports two further truncating COG8 alleles in a third patient.
  - reference: PMID:17331980
    reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The first, IVS3 + 1G > A, altered the conserved splicing site of intron 3, and the second deleted two nucleotides (1687-1688 del TT) in exon 5, truncating the last 47 amino acids.
    explanation: Direct counterexample to a universal exon 5 location claim.
  variants:
  - name: c.1611C>G (p.Tyr537Ter)
    description: A homozygous nonsense change introducing a premature stop codon, leaving a Cog8 subunit that lacks its 76 C-terminal amino acids and so cannot bind Cog1.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:17220172
      reference_title: A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This leads to a premature stop codon resulting in a truncated Cog8 subunit lacking the 76 C-terminal amino acids.
      explanation: Defines the allele and the precise extent of the C-terminal truncation.
    - reference: url:https://oup.silverchair-cdn.com/article-minimal/654283
      reference_title: https://oup.silverchair-cdn.com/article-minimal/654283
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We found a nonsense mutation (C to G) at position c.1611 in the ... COG8 ... cDNA, and this was confirmed by the genomic DNA sequence.
      explanation: Original sequence nomenclature in the clinical report.
    variant_type: single nucleotide variant
    genomic_contexts:
    - coding sequence
  - name: Homozygous exon 5 variant creating a new splice site
    description: The 2019 report describes a homozygous exon 5 splice-creating variant with a truncating consequence. The retrieved abstract does not establish the RNA assay or quantify residual protein.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30690882
      reference_title: The first case of antenatal presentation in COG8-congenital disorder of glycosylation with a novel splice site mutation and an extended phenotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Trio whole exome sequencing revealed a novel homozygous variant in COG8, which creates a new splice site in exon 5 and protein truncation after 12 amino acids downstream to the newly generated splice site.
      explanation: Defines the antenatally ascertained patient's allele.
  - name: IVS3+1G>A
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
    description: Splice-donor allele reported in trans to a two-nucleotide deletion. The original report uses IVS3+1G>A nomenclature; this location is intron 3, not exon 5.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:17331980
      reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The first, IVS3 + 1G > A, altered the conserved splicing site of intron 3, and the second deleted two nucleotides (1687-1688 del TT) in exon 5, truncating the last 47 amino acids.
      explanation: Direct counterexample to a universal exon 5 location claim.
  - name: c.171dupG and c.1656dupC compound-heterozygous genotype
    description: The 2017 patient carried p.Leu58Alafs*29 and p.Ala553Argfs*15, inherited from the respective heterozygous parents. These predicted truncations do not prove complete absence of COG8 protein in this patient.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28619360
      reference_title: 'Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Targeted exome sequencing was performed to screen all CDG type II-related genes, and two novel frameshift mutations were found: c.171dupG (p.Leu58Alafs*29) and c.1656dupC (p.Ala553Argfs*15) in COG8.'
      explanation: Reports two further truncating COG8 alleles in a third patient.

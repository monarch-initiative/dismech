- name: Reduced Proteoglycan Glycosaminoglycan Modification
  biological_scale: MOLECULAR
  description: >-
    Beyond N- and O-glycosylation, glycosaminoglycan modification of
    proteoglycans is reduced when any COG subunit is missing. COG8 is one of
    the two lobe-bridging subunits for which the reduction is least marked, and
    COG8-deficient cells retain normal glycosaminoglycan chain lengths on
    secreted proteoglycans, unlike cells lacking COG2-COG7. This is a
    knock-out cell-line result; proteoglycan synthesis has not been reported in
    COG8-CDG patient material.
  biological_processes:
  - preferred_term: protein O-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006493
      label: protein O-linked glycosylation
  evidence:
  - reference: PMID:34053170
    reference_title: "Proteoglycan synthesis in conserved oligomeric Golgi subunit deficient HEK293T cells is affected differently, depending on the lacking subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We here show that glycosaminoglycan (GAG) modification of PGs is significantly reduced, regardless which COG subunit that is missing in HEK293T cells."
    explanation: >-
      Establishes reduced glycosaminoglycan modification as a consequence of
      COG-subunit loss, including COG8.
  - reference: PMID:34053170
    reference_title: "Proteoglycan synthesis in conserved oligomeric Golgi subunit deficient HEK293T cells is affected differently, depending on the lacking subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Least reduction was observed for cells lacking COG1 and COG8 subunits, that bridge the A and B lobes of the complex."
    explanation: >-
      Qualifies the magnitude of the proteoglycan defect specifically for COG8

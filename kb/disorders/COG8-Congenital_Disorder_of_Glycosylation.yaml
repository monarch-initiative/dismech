notes: COG8-CDG, CDG-IIh and CDG-II/COG8 name the same recessive disorder. The available case reports define a variable spectrum, not population phenotype frequencies. General care and reproductive guidance cited from the retired GeneReviews overview is historical and group-level; cellular rescue experiments are not clinical gene-therapy evidence.

discussions:
- discussion_id: cog8_proteoglycan_gag_in_patient_tissue
  kind: KNOWLEDGE_GAP
  prompt: Does the reduced glycosaminoglycan modification of proteoglycans seen in COG-subunit knock-out cell lines occur in COG8-CDG patient tissue, and does it contribute to the skeletal and connective-tissue features?
  attaches_to:
  - experimental_models#COG8-knockout HEK293T proteoglycan model
  rationale: Engineered COG8-knockout HEK293T cells have altered proteoglycan synthesis readouts, but their contribution to human COG8-CDG manifestations remains untested in the cited studies. Altered turnover was proposed rather than kinetically measured.
  evidence:
  - reference: PMID:34053170
    reference_title: Proteoglycan synthesis in conserved oligomeric Golgi subunit deficient HEK293T cells is affected differently, depending on the lacking subunit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In light of the important roles PGs play in animal development, the effects KO of individual COG subunits have on GAG synthesis could explain the variable severity of COG associated CDGs.
    explanation: The authors state the hypothesis this gap would test, and frame it as a possible rather than established explanation.
- discussion_id: cog8_severity_range_with_clustered_truncating_alleles
  kind: KNOWLEDGE_GAP
  prompt: What determines the clinical severity range in COG8-CDG, and how do residual protein, complex assembly and tissue context contribute?
  attaches_to:
  - pathophysiology#Abnormal N-glycan sialylation
  - genetic#COG8 pathogenic variants
  rationale: Residual truncated protein and biochemical sialylation defects differ between patient lines. A biochemically mild sialylation defect can accompany substantial neurological disease. The small case series cannot establish a genotype-severity model; the reported exon 5 clustering is not universal.
  evidence:
  - reference: PMID:28619360
    reference_title: 'Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compared with the previous two reported cases, our patient showed relatively mild psychomotor retardation without a seizure history.
    explanation: Documents the severity difference between reported patients that this gap concerns.
  - reference: PMID:17220172
    reference_title: A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Mass spectrometric analysis of the N- and O-glycan structures identified a mild sialylation deficiency.
    explanation: Biochemically mild result does not imply absence of major neurological disability.
- discussion_id: cog8_glycan_to_organ_mechanisms
  kind: KNOWLEDGE_GAP
  prompt: Which COG8-dependent trafficking and glycosylation defects cause the specific neurological, hepatic and coagulation manifestations?
  attaches_to:
  - pathophysiology#Abnormal N-glycan sialylation
  - pathophysiology#Abnormal O-glycan sialylation
  rationale: Cellular complementation establishes COG8 dependence for trafficking and glycan readouts, but specific substrate-to-organ causal chains have not been established in these studies. Clinical edges therefore retain unknown intermediates.
  evidence:
  - reference: PMID:23865579
    reference_title: Deficiency of the Cog8 subunit in normal and CDG-derived cells impairs the assembly of the COG and Golgi SNARE complexes.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Yet, the connection between COG function, its complex integrity and CDG pathology remains largely unknown.
    explanation: The mechanistic study states the unresolved connection to clinical pathology.

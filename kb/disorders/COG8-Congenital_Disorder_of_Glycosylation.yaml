    reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts completely lacked COG8 protein and had reduced levels and/or mislocalization of several other COG proteins."
    explanation: >-
      Directly demonstrates that COG8 loss destabilises the wider COG complex
      in patient-derived cells.
  - reference: PMID:17220172
    reference_title: A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As a result, Cog1 deficiency accompanies the Cog8 deficiency, preventing assembly of the intact, stable complex and resulting in the appearance of smaller subcomplexes."
    explanation: >-
      States the specific consequence modelled by this node - secondary Cog1
      deficiency and failure of intact complex assembly.
  - reference: PMID:23865579
    reference_title: Deficiency of the Cog8 subunit in normal and CDG-derived cells impairs the assembly of the COG and Golgi SNARE complexes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knock down of Cog8 expression in HeLa cells significantly reduced (by ~80%) the level of Cog1 and also decreased the steady-state level of the Cog6 subunit (by ~30%) (Figure 2A)."
    explanation: >-
      An independent acute-depletion model reproduces the secondary loss of
      Cog1 seen in patient cells.
  downstream:
  - target: Impaired Golgi Vesicle Tethering and SNARE Assembly
    description: >-
      Without an intact complex, COG cannot perform its tethering function or
      promote assembly of the Golgi SNARE complexes that execute vesicle fusion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23865579
      reference_title: Deficiency of the Cog8 subunit in normal and CDG-derived cells impairs the assembly of the COG and Golgi SNARE complexes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "By detailed analysis of Cog8 deficiency in either HeLa cells or CDG-derived fibroblasts, we show that Cog8 is required for the assembly of both the COG complex and the Golgi Stx5-GS28-Ykt6-GS15 and Stx6-Stx16-Vti1a-VAMP4 SNARE complexes."
      explanation: >-
        Establishes the causal step from COG8 deficiency to failed Golgi SNARE
        complex assembly, in both patient fibroblasts and a knockdown model.

- name: Impaired Golgi Vesicle Tethering and SNARE Assembly
  biological_scale: CELLULAR
  conforms_to: "congenital_disorder_of_glycosylation#Golgi N-Glycan Processing and Trafficking Defect"
  description: >-
    The residual subcomplexes cannot tether retrograde intra-Golgi and
    endosome-to-Golgi vesicles, and cannot support assembly of the Stx5 and
    Stx6 Golgi SNARE complexes. COG8-deficient cells accumulate untethered
    vesicles beside dilated Golgi cisternae, and patient fibroblasts show
    slowed brefeldin A-induced Golgi-matrix redistribution, the standard
    functional readout of a retrograde trafficking block.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast

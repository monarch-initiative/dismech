diagnosis:
- name: Serum transferrin isoelectric focusing
  description: >-
    The first-line CDG screen. In COG8-CDG it shows a type II pattern with
    increased disialo- and trisialotransferrin, which directs testing toward
    the type II genes rather than the ER precursor-assembly genes.
  evidence:
  - reference: PMID:28619360
    reference_title: "Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The transferrin isoelectric focusing profiles in the patient showed a CDG type II pattern with increased disialo- and trisialo-transferrin."
    explanation: Reports the diagnostic transferrin pattern.
- name: Targeted or trio exome sequencing of CDG type II genes
  description: >-
    Because the transferrin pattern cannot distinguish the individual type II
    genes, molecular confirmation requires sequencing. Both of the two most
    recent patients were diagnosed this way.
  evidence:
  - reference: PMID:28619360
    reference_title: "Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted exome sequencing was performed to screen all CDG type II-related genes, and two novel frameshift mutations were found: c.171dupG (p.Leu58Alafs*29) and c.1656dupC (p.Ala553Argfs*15) in COG8."
    explanation: Targeted exome sequencing established the diagnosis.
  - reference: PMID:30690882
    reference_title: The first case of antenatal presentation in COG8-congenital disorder of glycosylation with a novel splice site mutation and an extended phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole exome sequencing revealed a novel homozygous variant in COG8, which creates a new splice site in exon 5 and protein truncation after 12 amino acids downstream to the newly generated splice site."
    explanation: Trio exome sequencing established the antenatal diagnosis.

treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    No disease-modifying therapy exists for COG8-CDG. Management is supportive
    and follows the organ involvement of the individual patient - developmental
    and feeding support, seizure management where seizures occur, orthopaedic
    care for talipes, and monitoring of liver enzymes.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Recorded from the clinical descriptions in the published case reports; no
    trial or treatment study of COG8-CDG exists.
- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance with a 25% recurrence risk for siblings;
    both parents of the compound heterozygous patient were carriers. Antenatal
    ultrasound findings including increased nuchal translucency have prompted
    prenatal diagnosis in one family.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:28619360
    reference_title: "Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents were heterozygous carriers of each variant."
    explanation: >-
      Carrier status of both parents is the basis for recurrence-risk
      counseling.

discussions:
- discussion_id: cog8_proteoglycan_gag_in_patient_tissue
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the reduced glycosaminoglycan modification of proteoglycans seen in
    COG-subunit knock-out cell lines occur in COG8-CDG patient tissue, and does
    it contribute to the skeletal and connective-tissue features?
  attaches_to:
  - pathophysiology#Reduced Proteoglycan Glycosaminoglycan Modification
  rationale: >-
    Proteoglycan synthesis has been characterised only in COG-knock-out HEK293T
    cells, where COG8 loss reduced glycosaminoglycan modification least among
    the subunits and preserved chain length on secreted proteoglycans. The
    authors propose this differential as an explanation for the variable
    severity of COG-associated CDG, which would make it directly relevant to
    the mild end of the COG8-CDG spectrum - but no patient-derived proteoglycan
    data exist to test it.
  evidence:
  - reference: PMID:34053170
    reference_title: "Proteoglycan synthesis in conserved oligomeric Golgi subunit deficient HEK293T cells is affected differently, depending on the lacking subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In light of the important roles PGs play in animal development, the effects KO of individual COG subunits have on GAG synthesis could explain the variable severity of COG associated CDGs."
    explanation: >-
      The authors state the hypothesis this gap would test, and frame it as a
      possible rather than established explanation.
- discussion_id: cog8_severity_range_with_clustered_truncating_alleles
  kind: KNOWLEDGE_GAP
  prompt: >-
    What explains the wide severity range across COG8-CDG patients, given that
    all reported alleles are truncating and cluster in exon 5?
  attaches_to:
  - pathophysiology#Combined N- and O-Glycan Hyposialylation
  - genetic#COG8 pathogenic variants
  rationale: >-
    The index patient had severe psychomotor retardation and seizures, while
    another patient had only a mild sialylation deficiency and a third had
    relatively mild psychomotor retardation without seizures. Because the
    alleles are all truncating and clustered, a simple allelic-severity model
    does not obviously account for the range, and no genotype-phenotype
    analysis has been possible at this sample size.
  evidence:
  - reference: PMID:28619360
    reference_title: "Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with the previous two reported cases, our patient showed relatively mild psychomotor retardation without a seizure history."
    explanation: >-
      Documents the severity difference between reported patients that this gap
      concerns.
  - reference: PMID:30690882
    reference_title: The first case of antenatal presentation in COG8-congenital disorder of glycosylation with a novel splice site mutation and an extended phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the mutations of the previous three patients were also identified in exon 5, it is likely to be a potential mutational hotspot in COG8."
    explanation: >-
      Establishes that the reported alleles cluster, which is what makes the
      severity range hard to explain allelically.

experimental_models:
- name: COG8-deficient CDG patient fibroblasts with lentiviral complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from the index patient lack COG8 protein, mislocalise other COG
    subunits, are deficient in N- and O-glycan sialylation and show a slowed
    brefeldin A response. Re-expression of normal COG8 corrects all three,
    which is the rescue experiment that establishes COG8 loss as sufficient to
    cause the cellular phenotype.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: COG Complex Destabilization and Cog1 Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Patient-derived cells carrying the causal genotype; the defect is the
      human lesion itself rather than an engineered surrogate.
    limitations: >-
      Fibroblasts are not an affected tissue in the neurological phenotype, and
      a single patient's cells cannot represent the allelic spectrum.
    readouts:
    - name: Restoration of COG subunit localisation and sialylation by COG8 re-expression
      target: COG Complex Destabilization and Cog1 Loss
      direction: RESTORED
      interpretation: >-
        Complementation rescues the trafficking and glycosylation phenotype,
        establishing COG8 loss as the sufficient cause in these cells.
      evidence:
      - reference: PMID:17331980
        reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Lentiviral-mediated complementation with normal COG8 corrected mislocalization of other COG proteins, normalized sialylation and restored normal BFA-induced Golgi disruption."
        explanation: Reports the rescue of all three cellular readouts.
    evidence:
    - reference: PMID:17331980
      reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patient fibroblasts completely lacked COG8 protein and had reduced levels and/or mislocalization of several other COG proteins."
      explanation: >-
        Establishes the patient fibroblast line as an informative model of the
        COG-complex destabilisation node.
- name: COG8 shRNA knockdown HeLa cells
  experimental_model_type: CELL_LINE
  description: >-
    Acute shRNA depletion of COG8 in HeLa cells, used alongside patient
    fibroblasts to separate acute from chronic consequences of COG8 loss.
    Golgi organisation is disrupted, cisternae dilate, untethered vesicles
    accumulate, and Cog1 falls by roughly 80%.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Impaired Golgi Vesicle Tethering and SNARE Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the tethering and SNARE-assembly defect and permits the
      ultrastructural readout that patient cells were not used for.
    limitations: >-
      Acute knockdown in a transformed cell line, not the patient genotype;
      the authors note that chronic COG8 deficiency in patient cells
      destabilises additional subunits that acute knockdown does not.
    readouts:
    - name: Golgi cisternal dilation and perigolgi vesicle accumulation
      target: Impaired Golgi Vesicle Tethering and SNARE Assembly
      direction: INCREASED
      interpretation: >-
        Accumulated unfused vesicles are the structural signature of failed
        tethering.
      evidence:
      - reference: PMID:23865579
        reference_title: Deficiency of the Cog8 subunit in normal and CDG-derived cells impairs the assembly of the COG and Golgi SNARE complexes.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Electron microscopy analysis further exposed a dilation of Golgi cisternae and accumulation of vesicles in the vicinity of the Golgi (Figure 1B), which possibly represent vesicles that failed to fuse with the Golgi membranes."
        explanation: The electron microscopy readout behind this model link.
    evidence:
    - reference: PMID:23865579
      reference_title: Deficiency of the Cog8 subunit in normal and CDG-derived cells impairs the assembly of the COG and Golgi SNARE complexes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "By detailed analysis of Cog8 deficiency in either HeLa cells or CDG-derived fibroblasts, we show that Cog8 is required for the assembly of both the COG complex and the Golgi Stx5-GS28-Ykt6-GS15 and Stx6-Stx16-Vti1a-VAMP4 SNARE complexes."
      explanation: >-
        Establishes the knockdown line as informative for the tethering and
        SNARE-assembly node.

notes: >-
  Nosology: CDG-IIh and CDG-II/COG8 were proposed independently by the two 2007
  reports; both name the same disorder, now written COG8-CDG under the current
  CDG nomenclature. The entry is a sibling of
  kb/disorders/COG7-Congenital_Disorder_of_Glycosylation.yaml and conforms to
  the type II arm of kb/modules/congenital_disorder_of_glycosylation.yaml.

  Frequency bands are deliberately absent from the phenotype records. Four
  patients had been published as of the most recent case report, so the
  denominator for any band would be a case series rather than the disease;
  per-patient counts are recorded in each phenotype's notes instead.

  Not yet curated for want of a citable source: growth parameters,
  coagulation-factor glycoprotein levels, and long-term outcome. Reported
  patients are described cross-sectionally.


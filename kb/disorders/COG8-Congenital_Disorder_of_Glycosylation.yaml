    reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of serum transferrin and total serum N-glycans showed normal addition of one sialic acid, but severe deficiency in subsequent sialylation of mostly normal N-glycans."
    explanation: >-
      Defines the terminal-sialylation character of the defect in patient
      serum.
  - reference: PMID:17220172
    reference_title: A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mass spectrometric analysis of the N- and O-glycan structures identified a mild sialylation deficiency."
    explanation: >-
      Confirms combined N- and O-glycan hyposialylation in a second, more

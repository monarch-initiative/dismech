- name: Combined N- and O-Glycan Hyposialylation
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  description: >-
    COG8-CDG produces a type II CDG biochemical pattern. The defect is
    specifically terminal: the first sialic acid is added normally to
    otherwise largely normal N-glycans, but subsequent sialylation fails, and
    both N- and O-glycans are affected. Severity of the sialylation deficiency
    differs between reported patients.
  biological_processes:

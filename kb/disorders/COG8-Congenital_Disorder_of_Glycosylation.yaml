inheritance:
- name: Autosomal recessive
  description: >-
    All reported patients carry biallelic COG8 variants - a homozygous nonsense
    variant, a homozygous splice-creating variant, or compound heterozygous
    truncating variants with each parent shown to be a heterozygous carrier.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28619360
    reference_title: "Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents were heterozygous carriers of each variant."
    explanation: >-
      Segregation of the two truncating COG8 variants to unaffected
      heterozygous parents establishes autosomal recessive inheritance.
  - reference: PMID:17220172
    reference_title: A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a patient with a mild form of a congenital disorder of glycosylation type II (CDG-II), which is caused by a homozygous nonsense mutation in the hCOG8 gene."
    explanation: >-
      A homozygous nonsense COG8 variant in an affected patient supports a
      biallelic, recessive disease mechanism.

pathophysiology:
- name: Biallelic COG8 Truncating Variants
  biological_scale: MOLECULAR
  description: >-
    Disease-causing COG8 alleles are truncating: a splice-site change in intron
    3 plus a two-nucleotide deletion removing the last 47 residues, a homozygous
    nonsense variant removing the 76 C-terminal residues, two frameshift
    variants, and a homozygous variant creating a new splice site in exon 5.
    Every reported lesion removes part of the COG8 C-terminus.
  genes:
  - preferred_term: COG8
    term:
      id: hgnc:18623
      label: COG8
  locations:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:17331980
    reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had two COG8 mutations which severely truncated the protein and destabilized the COG complex."
    explanation: >-
      The index report establishes truncating COG8 variants as the causal
      lesion and links them to destabilisation of the COG complex.
  - reference: PMID:30690882
    reference_title: The first case of antenatal presentation in COG8-congenital disorder of glycosylation with a novel splice site mutation and an extended phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the mutations of the previous three patients were also identified in exon 5, it is likely to be a potential mutational hotspot in COG8."
    explanation: >-
      Clustering of the reported alleles in exon 5 supports a shared truncating
      mechanism affecting the COG8 C-terminus.
  downstream:
  - target: COG Complex Destabilization and Cog1 Loss
    description: >-
      C-terminal truncation of COG8 removes the surface that binds Cog1, so the
      intact hetero-octamer cannot assemble.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17220172
      reference_title: A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We showed that the molecular basis of this defect in N- and O-glycosylation is caused by the disruption of the Cog1-Cog8 interaction due to truncation."
      explanation: >-
        Patient-fibroblast biochemistry ties the truncating COG8 allele
        directly to loss of the Cog1-Cog8 interaction.

- name: COG Complex Destabilization and Cog1 Loss
  biological_scale: MOLECULAR
  description: >-
    Loss of the Cog1-Cog8 bridge between lobe A and lobe B leaves only smaller
    COG subcomplexes. Patient fibroblasts lack COG8 protein entirely and show
    reduced levels or mislocalisation of several other COG subunits, with Cog1
    absent from the Golgi; acute COG8 knockdown in HeLa cells reproduces the
    loss of Cog1.

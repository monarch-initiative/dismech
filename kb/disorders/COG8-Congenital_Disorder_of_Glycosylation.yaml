  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:21421995
    reference_title: Conserved oligomeric Golgi complex specifically regulates the maintenance of Golgi glycosylation machinery.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In response to siRNA-induced depletion of COG complex subunits, several key components of Golgi glycosylation machinery, including MAN2A1, MGAT1, B4GALT1 and ST6GAL1, were severely mislocalized."
    explanation: >-
      Names the specific glycosylation enzymes that are mislocalised when COG
      function is lost.
  - reference: PMID:17220172
    reference_title: A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, levels of beta1,4-galactosytransferase were significantly reduced."
    explanation: >-
      Demonstrates depletion of a specific Golgi glycosyltransferase in
      COG8-deficient patient cells.
  - reference: PMID:17904886
    reference_title: Deficiencies in subunits of the Conserved Oligomeric Golgi (COG) complex define a novel group of Congenital Disorders of Glycosylation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If the balance is disturbed, the glycosylation machinery is mislocalized, which can cause Congenital Disorders of Glycosylation type II (CDG-II), as illustrated by the identification of congenital defects in the Conserved Oligomeric Golgi (COG) complex in humans."
    explanation: >-
      The COG-CDG review states the general trafficking-balance to
      enzyme-mislocalisation step this node represents.
  downstream:
  - target: Combined N- and O-Glycan Hyposialylation
    description: >-
      Mislocalised sialyltransferases and galactosyltransferases cannot

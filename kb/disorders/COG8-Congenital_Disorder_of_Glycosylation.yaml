    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts were deficient in sialylation of both N- and O-glycans, and also showed slower brefeldin A (BFA)-induced disruption of the Golgi matrix, reminiscent of COG7-deficient cells."

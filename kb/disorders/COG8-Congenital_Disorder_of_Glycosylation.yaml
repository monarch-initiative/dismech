- name: COG8 shRNA knockdown HeLa cells
  experimental_model_type: CELL_LINE
  description: COG8 shRNA depletion in HeLa cells was studied using both transient and stable lines. The cells showed altered Golgi organization, impaired SNARE assembly and endosome-to-TGN transport; the system differs from the patient genotypes and cellular context.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Impaired Golgi SNARE complex assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reduced SNARE complex assembly is also observed in the tested patient fibroblasts.
    limitations: 'HeLa depletion does not reproduce all patient-cell effects: GS15 abundance increased in depleted HeLa cells but decreased in patient fibroblasts; VAMP4 abundance was unchanged in HeLa cells but reduced in patient cells.'
    evidence:
    - reference: PMID:23865579
      reference_title: Deficiency of the Cog8 subunit in normal and CDG-derived cells impairs the assembly of the COG and Golgi SNARE complexes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: By detailed analysis of Cog8 deficiency in either HeLa cells or CDG-derived fibroblasts, we show that Cog8 is required for the assembly of both the COG complex and the Golgi Stx5-GS28-Ykt6-GS15 and Stx6-Stx16-Vti1a-VAMP4 SNARE complexes.
      explanation: Establishes the knockdown line as informative for the tethering and SNARE-assembly node.
    model_scale: CELLULAR
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: Cultured cells do not include the neural, hepatic and systemic interactions needed to explain the clinical phenotype.
  findings:
  - statement: Dilated Golgi cisternae and accumulated perigolgi vesicles were observed by electron microscopy; failed tethering or fusion was an interpretation, not a directly measured event.
    evidence:
    - reference: PMID:23865579
      reference_title: Deficiency of the Cog8 subunit in normal and CDG-derived cells impairs the assembly of the COG and Golgi SNARE complexes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Electron microscopy analysis further exposed a dilation of Golgi cisternae and accumulation of vesicles in the vicinity of the Golgi (Figure 1B), which possibly represent vesicles that failed to fuse with the Golgi membranes.
      explanation: Morphology supports a trafficking defect without identifying the precise failed step.
- name: COG8 siRNA-depleted HeLa cells
  experimental_model_type: CELL_LINE
  description: HeLa COG8 knockdown models showed altered Golgi enzyme localization and lectin readouts, but total cellular N-glycan mass spectrometry did not reproduce patient serum hyposialylation.
  modeled_mechanisms:
  - target: Abnormal N-glycan sialylation
    relationship: FAILS_TO_RECAPITULATE
    model_scale: CELLULAR
    limitations: Acute knockdown in transformed cells and total-cell glycans differ from patient genotypes and serum proteins.
    evidence:
    - reference: PMID:21421995
      reference_title: Conserved oligomeric Golgi complex specifically regulates the maintenance of Golgi glycosylation machinery.
      supports: REFUTE
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Surprisingly, the data also show a minor increase in sialylation in the N-glycans of COG6- and COG8-deficient cells.
      explanation: Total-cell HeLa N-glycans differ from patient serum findings; the model does not reproduce this readout.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: Cultured cells do not include the neural, hepatic and systemic interactions needed to explain the clinical phenotype.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: The mass-spectrometry measurement is total cellular N-glycans, whereas the clinical comparison is serum glycoprotein N-glycans. Their measured sialylation changes have opposite directions.
  evidence:
  - reference: PMID:21421995
    reference_title: Conserved oligomeric Golgi complex specifically regulates the maintenance of Golgi glycosylation machinery.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In all analyzed COG KD cells, MGAT1, MAN2A1 and ST6GAL1 proteins were found in multiple vesicle-like structures, as well as in large fragmented Golgi mini-stacks that were positive for the Golgi matrix protein GM130.

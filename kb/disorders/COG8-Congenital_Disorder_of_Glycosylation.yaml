inheritance:
- name: Autosomal recessive
  description: Biallelic COG8 variants underlie the disorder. Homozygous and compound-heterozygous genotypes are reported; the parents in the 2017 compound-heterozygous family carried the respective variants. When both parents are carriers, each pregnancy has a 25% affected, 50% carrier and 25% noncarrier probability.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28619360
    reference_title: 'Further delineation of COG8-CDG: A case with novel compound heterozygous mutations diagnosed by targeted exome sequencing.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The parents were heterozygous carriers of each variant.
    explanation: Segregation of the two truncating COG8 variants to unaffected heterozygous parents establishes autosomal recessive inheritance.
  - reference: PMID:17220172
    reference_title: A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we describe a patient with a mild form of a congenital disorder of glycosylation type II (CDG-II), which is caused by a homozygous nonsense mutation in the hCOG8 gene.
    explanation: A homozygous nonsense COG8 variant in an affected patient supports a biallelic, recessive disease mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1332/
    reference_title: Congenital Disorders of N-Linked Glycosylation and Multiple Pathway Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic ... carrier ... and a 25% chance of being unaffected and not a carrier.
    explanation: Historical group-level autosomal-recessive counseling applies when both parents carry a disease-causing COG8 allele.
pathophysiology:
- name: Biallelic COG8 dysfunction
  biological_scale: MOLECULAR
  description: 'Biallelic COG8 variants impair function of a lobe B component of the conserved oligomeric Golgi complex. Published genotypes include nonsense, frameshift and splice-altering alleles. Their cellular effects vary: absence of detectable COG8 and residual truncated protein have both been reported.'
  evidence:
  - reference: PMID:17331980
    reference_title: COG8 deficiency causes new congenital disorder of glycosylation type IIh.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe a new Type II congenital disorder of glycosylation (CDG-II) caused by mutations in the conserved oligomeric Golgi (COG) complex gene, COG8.
    explanation: Establishes COG8 as the causal gene.

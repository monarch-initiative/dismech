- name: Impaired Factor VIII Secretion
  biological_scale: CELLULAR
  description: >-
    Some STT3A-dependent N-glycans on coagulation factor VIII are needed for
    its efficient secretion. Cells lacking STT3A make normal intracellular
    amounts of factor VIII but release less than a tenth of the expected
    amount. In the reported patient the low plasma level was attributed to
    this secretion defect together with low von Willebrand factor.
  biological_processes:
  - preferred_term: Protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:30701557
    reference_title: "Factor VIII and vWF deficiency in STT3A-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies with STT3A-/- HEK293 cells showed severely reduced
      FVIII antigen and activity levels in conditioned media <10% expected, but normal
      intracellular levels."
    explanation: Localizes the factor VIII defect to secretion in STT3A-null cells.
  downstream:
  - target: Reduced factor VIII activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30701557
      reference_title: "Factor VIII and vWF deficiency in STT3A-CDG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results suggest that certain STT3A-dependent N-glycans are required
        for efficient FVIII secretion, and the decreased FVIII level in our patient
        is a combined effect of both severely impaired FVIII secretion and lower plasma
        VWF level."
      explanation: Attributes the patient's low factor VIII to impaired secretion.
- name: Impaired Growth Factor Receptor Processing
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In STT3A-null cells the insulin receptor and IGF-1 receptor reach the cell
    surface in reduced amounts, because their own N-glycan site occupancy is
    lower and because the proprotein convertase PCSK5a that cleaves them is
    itself underglycosylated. This is an established cell-line finding. Its
    relevance to patients is unshown: no study has measured these receptors in
    STT3A-CDG patient cells, and any contribution to the short stature of the
    dominant form is an inference (see discussions).
  biological_processes:
  - preferred_term: Protein processing
    term:
      id: GO:0016485
      label: protein processing
    modifier: DECREASED
  evidence:
  - reference: PMID:31101650
    reference_title: "Selective inhibition of N-linked glycosylation impairs receptor
      tyrosine kinase processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show reduced abundance of two canonical tyrosine receptor kinases
      - the insulin receptor and insulin-like growth factor 1 receptor (IGF-1R) -
      at the cell surface in STT3A-null cells, due to decreased N-linked glycan site
      occupancy and proteolytic processing in combination with increased endoplasmic
      reticulum localization."
    explanation: Shows that STT3A loss impairs processing and surface delivery of
      two growth-factor receptors.
- name: Endoplasmic Reticulum Stress
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    STT3A-knockout cells activate the unfolded protein response, with raised
    ATF6 and PERK, and the ER chaperone GRP94 becomes hyperglycosylated on
    normally silent sites, a change that ER-stress inducers reproduce in
    wild-type cells. This has been shown only in engineered cell lines; whether
    ER stress contributes to the patients' tissue phenotypes is untested.
  biological_processes:
  - preferred_term: Unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  evidence:
  - reference: PMID:36139350
    reference_title: "Proteome and Glycoproteome Analyses Reveal the Protein N-Linked
      Glycosylation Specificity of STT3A and STT3B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, the increased expression of the ATF6 and PERK indicated
      that the unfolded protein response also happened in STT3A-KO cells."
    explanation: Direct evidence of unfolded protein response activation after STT3A
      deletion.
  - reference: PMID:31296534
    reference_title: "Quantitative glycoproteomics reveals new classes of STT3A- and
      STT3B-dependent N-glycosylation sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Remarkably, the lumenal ER chaperone GRP94 was hyperglycosylated in STT3A-deficient
      cells, bearing glycans on five silent sites in addition to the normal glycosylation
      site."
    explanation: A marker change that the same study reproduces with ER-stress inducers.
- name: Abnormal Skeletal Development
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  subtypes:

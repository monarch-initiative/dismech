      snippet: "The STT3A OST isoform is primarily responsible for cotranslational
        glycosylation of the nascent polypeptide as it enters the lumen of the endoplasmic
        reticulum."
      explanation: Isoform-specific knockdown shows that loss of STT3A activity is
        what removes cotranslational glycosylation.
- name: Impaired Cotranslational N-Glycosylation
  biological_scale: CELLULAR
  description: >-
    With OST-A impaired, acceptor sites are skipped as the nascent chain
    passes the translocon. STT3A-dependent sites include those with
    suboptimal flanking sequences and those inside cysteine-rich domains. OST-B
    can glycosylate some skipped sites afterwards, but the two complexes have
    complementary rather than redundant roles, so a subset of sites stays
    unoccupied. Patient fibroblasts show reduced glycosylation of
    STT3A-dependent acceptors.
  biological_processes:
  - preferred_term: cotranslational N-glycosylation
    term:
      id: GO:0180058
      label: protein co-translational transfer of dolichol-linked oligosaccharide
    modifier: DECREASED
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:31831667
    reference_title: "Cryo-electron microscopy structures of human oligosaccharyltransferase
      complexes OST-A and OST-B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mammals express two distinct OST complexes that act in a cotranslational
      (OST-A) or posttranslocational (OST-B) manner."
    explanation: Defines OST-A as the cotranslational complex.
  - reference: PMID:31296534
    reference_title: "Quantitative glycoproteomics reveals new classes of STT3A- and
      STT3B-dependent N-glycosylation sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of site occupancy data disclosed several new classes of STT3A-dependent
      acceptor sites including those with suboptimal flanking sequences and sites located
      within cysteine-rich protein domains."
    explanation: Identifies which acceptor sites depend on STT3A and so are lost when
      it fails.
  - reference: PMID:25460543
    reference_title: "Cotranslational and posttranslocational N-glycosylation of proteins
      in the endoplasmic reticulum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the role of the STT3B complex in mediating cotranslational or posttranslocational
      glycosylation of acceptor sites that have been skipped by the STT3A complex"
    explanation: Review describing OST-B as the complex that picks up sites skipped
      by OST-A; evidence source is OTHER because this is a review.
  - reference: PMID:19167329
    reference_title: "Cotranslational and posttranslational N-glycosylation of polypeptides
      by distinct mammalian OST isoforms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These distinct and complementary roles for the OST isoforms allow sequential
      scanning of polypeptides for acceptor sites to insure the maximal efficiency
      of N-glycosylation."
    explanation: Explains why OST-B only partly compensates for OST-A loss.
  - reference: PMID:30701557
    reference_title: "Factor VIII and vWF deficiency in STT3A-CDG."

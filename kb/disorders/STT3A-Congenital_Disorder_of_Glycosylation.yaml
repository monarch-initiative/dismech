- name: Multisystem Glycoprotein Dysfunction
  conforms_to: "congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction"
  biological_scale: ORGANISM
  description: >-
    Underglycosylation of many client glycoproteins at once produces the
    neurodevelopmental, neuromuscular and systemic features. The recessive
    form is dominated by encephalopathy (developmental delay, intellectual
    disability, absent speech, seizures, hypotonia) and the dominant form by
    musculoskeletal and milder neurodevelopmental features. The dysmorphic,
    adipose, behavioral, hematologic and congenital-anomaly features of the
    dominant form are routed through this node as well, because the pooled
    cohort establishes them as features of the disease without naming a
    client glycoprotein for any of them. Which clients are rate-limiting for
    each feature has not been worked out, except for the coagulation factors.

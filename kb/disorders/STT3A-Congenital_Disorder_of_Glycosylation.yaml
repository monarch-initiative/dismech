biochemical:
- name: Serum Transferrin Glycoform Profile
  subtypes:
  - AR-STT3A-CDG
  - AD-STT3A-CDG
  notes: >-
    Serum transferrin isoelectric focusing or mass spectrometry shows
    transferrin molecules missing whole N-glycans (type I pattern). The change
    is marked in the recessive form. In the dominant form it is present in
    nearly all individuals but can be subtle, so a normal or near-normal
    screen does not exclude the dominant form.
  evidence:
  - reference: PMID:23842455
    reference_title: "Mutations in STT3A and STT3B cause two congenital disorders of
      glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The STT3A mutation significantly impairs glycosylation of the biomarker
      transferrin, but the STT3B mutation only slightly affects its glycosylation."
    explanation: Establishes transferrin as an informative biomarker for STT3A deficiency.
  - reference: PMID:41897354
    reference_title: "Expanded Clinical Spectrum of Autosomal-Dominant STT3A-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Across 21 individuals, abnormal transferrin glycosylation was present
      in nearly all individuals (20/21), and subtle facial dysmorphism was common
      (18/21)."
    explanation: Gives the sensitivity of transferrin testing in the dominant form.

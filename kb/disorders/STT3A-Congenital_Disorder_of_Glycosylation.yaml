  description: >-
    Skeletal involvement is the distinguishing feature of the dominant form.
    Heterozygous stt3a knockdown in zebrafish reduces the number of mineralized
    bones and alters craniofacial cartilage geometry, supporting a direct
    effect of reduced STT3A on skeletal development. Which STT3A-dependent
    glycoproteins mediate this is not known.

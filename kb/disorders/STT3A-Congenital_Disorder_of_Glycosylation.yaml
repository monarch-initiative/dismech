animal_models:
- name: Heterozygous stt3a knockdown zebrafish
  species: Danio rerio
  genotype: CRISPR-Cas9 heterozygous stt3a knockdown
  publication: PMID:39891251
  description: >-
    Zebrafish with heterozygous loss of stt3a, generated to test whether
    reduced STT3A dosage produces the dominant phenotype. The larvae show
    craniofacial cartilage changes, fewer mineralized bones, reduced
    adaptability in light-dark behaviour tests and electrophysiological
    abnormalities.
  genes:
  - preferred_term: STT3A
    term:
      id: hgnc:6172
      label: STT3A
  modeled_mechanisms:
  - target: Abnormal Skeletal Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced stt3a dosage produces craniofacial and skeletal mineralization
      defects comparable to the patients' skeletal anomalies and dysmorphism.
    limitations: >-
      A heterozygous knockdown lowers the amount of STT3A; it does not
      reproduce a catalytic-site missense variant, so it tests
      haploinsufficiency rather than the dominant-negative mechanism proposed
      for most dominant alleles. Phenotypes were scored in larvae, so the adult
      features (osteoarthritis, muscle cramps) and the transferrin phenotype are
      not assessed.
    evidence:
    - reference: PMID:39891251
      reference_title: "Heterozygous pathogenic STT3A variation leads to dominant congenital
        glycosylation disorders and functional validation in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous knockdown zebrafish exhibit phenotypes similar to those
        of patients, including craniofacial dysmorphology (increased eye distance,
        increased Basihyal's length, increased Ceratohyal's angle), skeletal abnormalities
        (reduced number of mineralized bones)"
      explanation: The skeletal and craniofacial readouts behind this link.
  evidence:
  - reference: PMID:39891251
    reference_title: "Heterozygous pathogenic STT3A variation leads to dominant congenital
      glycosylation disorders and functional validation in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We performed CRISPR-Cas9 to establish heterozygous knockdown zebrafish
      to validate the functional implications of autosomal dominant inheritance of
      STT3A in pathogenesis."
    explanation: Describes how the model was made.
experimental_models:
- name: STT3A-knockout HEK293 cells
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Immortalized human embryonic kidney cell line with STT3A deleted
  publication: PMID:30701557
  description: >-
    Human cells lacking STT3A, used to measure the consequence of losing OST-A
    for secretion of coagulation factor VIII and for the cellular stress
    response.
  modeled_mechanisms:
  - target: Impaired Factor VIII Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      STT3A-null cells secrete less than a tenth of the expected factor VIII
      while intracellular levels are normal.
    limitations: >-
      A complete null in a kidney-derived line, whereas patients carry
      missense alleles and factor VIII is made physiologically by liver
      endothelial cells. The model shows that STT3A is needed for secretion,
      not how much secretion a patient allele retains.
    evidence:
    - reference: PMID:30701557
      reference_title: "Factor VIII and vWF deficiency in STT3A-CDG."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional studies with STT3A-/- HEK293 cells showed severely reduced
        FVIII antigen and activity levels in conditioned media <10% expected, but normal
        intracellular levels."
      explanation: The secretion readout behind this link.
  - target: Endoplasmic Reticulum Stress
    relationship: MEASURES
    fidelity: LOW
    description: >-
      STT3A-knockout cells show raised ATF6 and PERK, indicating an unfolded
      protein response.
    limitations: >-
      Measured in a complete knockout cell line; no patient cells or tissues
      have been examined for ER stress.
    evidence:
    - reference: PMID:36139350
      reference_title: "Proteome and Glycoproteome Analyses Reveal the Protein N-Linked
        Glycosylation Specificity of STT3A and STT3B."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, the increased expression of the ATF6 and PERK indicated
        that the unfolded protein response also happened in STT3A-KO cells."
      explanation: The stress-response readout behind this link.
discussions:
- discussion_id: stt3a_dominant_mechanism
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do all dominant STT3A alleles act by a dominant-negative mechanism, or do
    some act by haploinsufficiency?
  attaches_to:
  - pathophysiology#Heterozygous STT3A Catalytic-Site Missense Variants
  rationale: >-
    The founding dominant cohort had normal STT3A protein in fibroblasts, all
    variants in the catalytic site, and dominant glycosylation defects from the
    homologous yeast mutants, which together point to a poisoned complex. But
    p.Asp167Tyr lowered STT3A protein when expressed in cells, and a
    heterozygous stt3a knockdown in zebrafish, which only reduces dosage,
    reproduced craniofacial and skeletal features. Carriers of the recessive
    alleles are not reported as affected, so halving STT3A activity is not
    sufficient in general, but whether some dominant alleles act through a
    dosage effect rather than a dominant-negative one is unresolved.
  evidence:
  - reference: PMID:34653363
    reference_title: "Active site variants in STT3A cause a dominant type I congenital
      disorder of glycosylation with neuromusculoskeletal findings."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Indeed, expression of STT3A at mRNA and steady-state protein level in
      fibroblasts was normal, while glycosylation was abnormal."
    explanation: Supports a dominant-negative mechanism for the catalytic-site alleles.
  - reference: PMID:39891251
    reference_title: "Heterozygous pathogenic STT3A variation leads to dominant congenital
      glycosylation disorders and functional validation in zebrafish."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the Western blot results revealed a significant decrease in protein
      levels"
    explanation: A dominant allele that reduces protein amount, consistent with a
      dosage mechanism.
- discussion_id: stt3a_growth_receptor_link
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Does impaired processing of the insulin and IGF-1 receptors contribute to
    the short stature and skeletal phenotype of dominant STT3A-CDG?
  attaches_to:
  - pathophysiology#Impaired Growth Factor Receptor Processing
  - phenotypes#Short stature
  rationale: >-
    STT3A-null cells deliver less insulin receptor and IGF-1 receptor to the
    surface, and IGF-1 signalling is a major driver of linear growth. No study
    has measured these receptors in STT3A-CDG patient cells or tested the
    growth pathway in an animal model, so the node is not connected to the
    skeletal phenotypes in this entry.

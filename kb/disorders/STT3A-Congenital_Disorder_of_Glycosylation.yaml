  variant_origin: GERMLINE
  association: >-
    STT3A encodes the catalytic subunit of the OST-A oligosaccharyltransferase
    complex. Biallelic missense variants cause the recessive subtype and
    heterozygous catalytic-site missense variants cause the dominant subtype.
    No null allele has been reported in either form. The paralogue STT3B
    (catalytic subunit of OST-B) causes a separate recessive CDG, STT3B-CDG,
    which is not part of this entry.
  evidence:
  - reference: PMID:23842455
    reference_title: "Mutations in STT3A and STT3B cause two congenital disorders of
      glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two unreported types of congenital disorders of glycosylation
      (CDG) which are caused by mutations in different isoforms of the catalytic subunit
      of the oligosaccharyltransferase (OST)."
    explanation: Establishes STT3A, one of the two OST catalytic isoforms, as a CDG
      gene.
  - reference: PMID:34653363
    reference_title: "Active site variants in STT3A cause a dominant type I congenital
      disorder of glycosylation with neuromusculoskeletal findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recessive mutations in STT3A have previously been described to lead to
      a CDG."
    explanation: Confirms that the same gene causes both the recessive and the dominant
      form.
  variants:
  - name: "STT3A p.Val626Ala"
    description: >-
      The recurrent recessive allele, homozygous in the index patient and in
      the second consanguineous family. The expressed allele fails to restore
      glycosylation in STT3A-deficient cells. The two reports give the cDNA
      change as c.1877T>C and c.1877C>T respectively; the amino-acid change is
      the same in both.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23842455
      reference_title: "Mutations in STT3A and STT3B cause two congenital disorders
        of glycosylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Glycosylation of STT3A- and STT3B-specific acceptors is decreased in
        fibroblasts carrying the corresponding mutated gene and expression of the STT3A
        (p.Val626Ala) allele in STT3A-deficient HeLa cells does not rescue glycosylation."
      explanation: Functional evidence that the variant is a loss-of-function allele.
  - name: "STT3A p.Tyr360Ser"
    description: >-
      A second recessive missense allele, homozygous in a patient with factor
      VIII and von Willebrand factor deficiency.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:30701557
      reference_title: "Factor VIII and vWF deficiency in STT3A-CDG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe a patient with a novel homozygous likely pathogenic missense
        variant c.1079A>C (p.Tyr360Ser) who presents with chronically low Factor VIII
        (FVIII) and von Willebrand Factor (vWF) levels and activities in addition to
        the previously reported symptoms of developmental delay and seizures."
      explanation: Reports the variant and its classification.
  - name: "STT3A p.Asn544Ser"
    description: >-
      A de novo heterozygous dominant allele found by genome sequencing after a
      negative trio exome. It removes an N-glycosylation site on STT3A itself
      and was predicted to be destabilizing.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:39435313
      reference_title: "Review and metabolomic profiling of unsolved case reveals newly
        reported autosomal dominant congenital disorder of glycosylation, type Iw formerly
        thought to only be an autosomal recessive condition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "His UDN genome sequencing (GS) identified a previously unreported de
        novo STT3A variant (c.1631A > G: p.Asn544Ser)."
      explanation: Reports the de novo dominant variant.
  - name: "STT3A p.Asp167Tyr"
    description: >-
      A heterozygous dominant missense allele that lowered STT3A protein level
      when expressed in HEK293T cells, a different molecular behaviour from the
      catalytic-site variants, whose protein level is normal in patient
      fibroblasts.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:39891251
      reference_title: "Heterozygous pathogenic STT3A variation leads to dominant congenital
        glycosylation disorders and functional validation in zebrafish."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the Western blot results revealed a significant decrease in protein
        levels"
      explanation: Reports reduced protein from the variant construct in cultured cells.

has_subtypes:
- name: AR-STT3A-CDG
  display_name: Autosomal recessive STT3A-CDG (OMIM 615596)
  subtype_term:
    preferred_term: congenital disorder of glycosylation, type Iw, autosomal recessive
    term:
      id: MONDO:0014270
      label: STT3A-congenital disorder of glycosylation
  genes:
  - preferred_term: STT3A
    term:
      id: hgnc:6172
      label: STT3A
  description: >-
    The originally described form, caused by biallelic STT3A variants. All
    families reported so far were consanguineous and homozygous for a missense
    variant, most carrying p.Val626Ala and one p.Tyr360Ser. The phenotype is a
    neurodevelopmental encephalopathy with developmental delay, intellectual
    disability, absent speech, seizures, hypotonia, failure to thrive and
    feeding problems, with a type I serum transferrin pattern. Episodic
    hypothermia with altered consciousness and a combined factor VIII and von
    Willebrand factor deficiency have each been reported in a minority.
  evidence:
  - reference: PMID:30701557
    reference_title: "Factor VIII and vWF deficiency in STT3A-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STT3A-CDG (OMIM# 615596) is an autosomal recessive N-linked glycosylation
      disorder characterized by seizures, developmental delay, intellectual disability,
      and a type I carbohydrate deficient transferrin pattern."
    explanation: Defines the recessive subtype and its core clinical and biochemical
      features.
  - reference: PMID:28424003
    reference_title: "Phenotypic Heterogeneity in a Congenital Disorder of Glycosylation
      Caused by Mutations in STT3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common phenotypic features in all symptomatic individuals include developmental
      delay, intellectual disability, with absent speech and seizures."
    explanation: An independent consanguineous family confirming the recessive neurodevelopmental
      phenotype.
- name: AD-STT3A-CDG
  display_name: Autosomal dominant STT3A-CDG (OMIM 619714)
  subtype_term:
    preferred_term: congenital disorder of glycosylation, type Iw, autosomal dominant
    term:
      id: MONDO:0859223
      label: congenital disorder of glycosylation, type Iw, autosomal dominant
  genes:
  - preferred_term: STT3A
    term:
      id: hgnc:6172
      label: STT3A
  description: >-
    Caused by heterozygous STT3A missense variants, de novo, inherited, or
    mosaic, that cluster in conserved catalytic regions with a recurrent
    p.Arg405 hotspot. Across 21 published individuals the phenotype is
    neuromusculoskeletal: subtle facial dysmorphism, motor and speech delay,
    learning difficulties, intellectual disability in about half, skeletal
    anomalies, short stature, macrocephaly, increased muscle tone, muscle
    cramps and early-onset osteoarthritis in adults, with congenital heart
    defects and coagulation factor deficiency in a minority. Transferrin
    glycosylation is abnormal in nearly all, but ranges from a classic type I
    pattern to subtle changes.
  evidence:
  - reference: PMID:34653363
    reference_title: "Active site variants in STT3A cause a dominant type I congenital
      disorder of glycosylation with neuromusculoskeletal findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report the identification of 16 individuals from nine families
      who have either inherited or de novo heterozygous missense variants in STT3A,
      leading to an autosomal-dominant CDG."
    explanation: The founding description of the dominant subtype.
  - reference: PMID:41897354
    reference_title: "Expanded Clinical Spectrum of Autosomal-Dominant STT3A-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants clustered in conserved catalytic regions, with recurrent p.Arg405
      across de novo, inherited, and mosaic cases supporting a mutational hotspot
      and likely dominant-negative mechanism."
    explanation: Summarizes the allelic architecture of the dominant subtype across
      the published cohort.

      label: Autosomal dominant inheritance
  description: >-
    AD-STT3A-CDG. Heterozygous variants arise de novo or are transmitted
    within families, and mosaic cases carrying the recurrent p.Arg405 variants
    have been reported. Expressivity is variable.
  evidence:
  - reference: PMID:34653363
    reference_title: "Active site variants in STT3A cause a dominant type I congenital
      disorder of glycosylation with neuromusculoskeletal findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report the identification of 16 individuals from nine families
      who have either inherited or de novo heterozygous missense variants in STT3A,
      leading to an autosomal-dominant CDG."
    explanation: Establishes dominant transmission, both inherited and de novo.
  - reference: PMID:39435313
    reference_title: "Review and metabolomic profiling of unsolved case reveals newly
      reported autosomal dominant congenital disorder of glycosylation, type Iw formerly
      thought to only be an autosomal recessive condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant congenital disorder of glycosylation (CDG) type Iw
      (OMIM# 619714) is caused by a heterozygous mutation in the STT3A gene."
    explanation: States the dominant mode for OMIM 619714.
prevalence:
- population: Worldwide
  subtype: AR-STT3A-CDG
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven individuals had been reported with the recessive form by 2019: the
    index patient, five related individuals from a second consanguineous
    family, and one further patient homozygous for p.Tyr360Ser. No population
    prevalence estimate has been published.
  evidence:
  - reference: PMID:30701557
    reference_title: "Factor VIII and vWF deficiency in STT3A-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All previously reported cases (n = 6) have been attributed to a homozygous
      pathogenic missense variant c.1877C>T (p.Val626Ala) in STT3A."
    explanation: Gives the case count before this report added a seventh patient.
- population: Worldwide
  subtype: AD-STT3A-CDG
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2026 review pooling all published cases with three new individuals from
    the CDG natural history study counted 21 individuals with the dominant
    form. No population prevalence estimate has been published.
  evidence:
  - reference: PMID:41897354
    reference_title: "Expanded Clinical Spectrum of Autosomal-Dominant STT3A-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To define the distinct autosomal-dominant disorder, we reviewed all
      published cases and integrated three previously unpublished individuals from
      the CDG natural history study."
    explanation: Establishes that the pooled count covers all published dominant
      cases.
  - reference: PMID:41897354
    reference_title: "Expanded Clinical Spectrum of Autosomal-Dominant STT3A-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Across 21 individuals, abnormal transferrin glycosylation was present
      in nearly all individuals (20/21), and subtle facial dysmorphism was common
      (18/21)."
    explanation: Gives the pooled case count of 21.

    modifier: DECREASED
  description: >-
    Heterozygous missense variants cluster in the catalytic site of STT3A,
    including residues such as Arg405 that stabilize the dolichol-pyrophosphate
    donor during transfer. STT3A mRNA and protein levels are normal in patient
    fibroblasts, yet glycosylation is abnormal, and homologous yeast STT3
    mutants impair glycosylation even in the presence of wild-type STT3. The
    mutant subunit is therefore thought to poison the complex rather than
    simply halve its amount. That inference rests on the founding cohort and
    on the yeast experiments; no allele-specific dominant-negative assay has
    been reported for p.Asn544Ser or p.Asp167Tyr, and p.Asp167Tyr lowered
    STT3A protein when expressed in cells, so the mechanism is established
    for the variant class rather than demonstrated for every allele.

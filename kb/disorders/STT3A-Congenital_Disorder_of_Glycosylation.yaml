name: STT3A-Congenital Disorder of Glycosylation
creation_date: "2026-09-29T21:00:00Z"
category: Mendelian
description: >-
  STT3A-congenital disorder of glycosylation (STT3A-CDG, CDG-Iw) is a type I
  congenital disorder of N-linked glycosylation caused by pathogenic variants in
  STT3A, which encodes the catalytic subunit of the STT3A-containing
  oligosaccharyltransferase complex (OST-A). OST-A is docked to the
  ribosome-Sec61 translocon and transfers the preassembled dolichol-linked
  oligosaccharide en bloc onto asparagine acceptor sites of nascent
  polypeptides as they enter the endoplasmic reticulum lumen. Its paralogous
  complex OST-B (catalytic subunit STT3B) glycosylates sites that OST-A skips,
  largely after translocation, so the two complexes overlap only partially and
  loss of OST-A leaves a characteristic subset of acceptor sites unoccupied.
  Unlike the lipid-linked oligosaccharide assembly CDGs, the glycan donor is
  built normally here; the lesion is at the transfer step itself.

  STT3A causes disease by two inheritance modes with distinct mechanisms and
  clinical pictures. Biallelic (so far homozygous missense) variants cause a
  recessive neurodevelopmental disorder with developmental delay, intellectual
  disability, absent speech, seizures, hypotonia, failure to thrive and feeding
  difficulties, reported in seven individuals from three consanguineous
  families, one of whom also had factor VIII and von Willebrand factor
  deficiency. Heterozygous
  missense variants clustered in the catalytic site cause a milder dominant
  disorder dominated by neuromusculoskeletal features: variable skeletal
  anomalies, short stature, macrocephaly, facial dysmorphism, increased muscle
  tone, muscle cramps and early-onset osteoarthritis, with intellectual
  disability in about half. The dominant variants impair glycosylation in a
  dominant manner in patient fibroblasts and in yeast, and the dominant form is
  unusual among dominant type I CDGs in producing an abnormal serum transferrin
  glycoform profile, although that profile can be subtle. Both forms are
  modelled here as subtypes of one entry because they share the gene, the
  enzyme and the hypoglycosylation lesion. No disease-specific therapy has been
  reported.

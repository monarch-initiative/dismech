- reference: PMID:41897354
  title: Expanded Clinical Spectrum of Autosomal-Dominant STT3A-CDG.
notes: >-
  Lump/split. MONDO has two terms for STT3A disease: MONDO:0014270
  (STT3A-congenital disorder of glycosylation), which carries the synonym
  "congenital disorder of glycosylation, type Iw, autosomal recessive" and the
  OMIM:615596 cross-reference, and MONDO:0859223 (congenital disorder of
  glycosylation, type Iw, autosomal dominant; OMIM:619714), which MONDO places
  directly under congenital disorder of glycosylation rather than under
  MONDO:0014270. There is no MONDO class spanning both forms. This entry is
  anchored on MONDO:0014270 because its label names the gene, and the two
  inheritance forms are modelled as has_subtypes, each bound to its own MONDO
  term, because they share the gene, the enzyme and the transfer defect and
  differ in allele mechanism and clinical emphasis. The recessive subtype
  therefore reuses the entry-level MONDO term. STT3B-CDG, caused by the
  paralogous OST-B catalytic subunit, is a separate disease and is not
  covered here. No GeneReviews chapter covers STT3A-CDG; a PubMed search of
  the GeneReviews collection for STT3A or oligosaccharyltransferase returns
  only the retired, multi-disorder overview of congenital disorders of
  N-linked glycosylation. No
  disease-specific treatment or treatment trial has been reported for either
  subtype, so the entry carries no treatments section.

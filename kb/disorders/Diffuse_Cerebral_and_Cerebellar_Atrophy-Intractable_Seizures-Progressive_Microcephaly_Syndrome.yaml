name: Diffuse Cerebral and Cerebellar Atrophy-Intractable Seizures-Progressive Microcephaly Syndrome
creation_date: "2026-11-05T00:48:16Z"
category: Mendelian
disease_term:
  preferred_term: diffuse cerebral and cerebellar atrophy - intractable seizures - progressive microcephaly syndrome
  term:
    id: MONDO:0014335
    label: diffuse cerebral and cerebellar atrophy - intractable seizures - progressive microcephaly syndrome
description: >-
  Diffuse cerebral and cerebellar atrophy - intractable seizures - progressive
  microcephaly syndrome (MSCCA, OMIM 615760) is the autosomal recessive disorder
  caused by biallelic loss-of-function variants in QARS1, the gene encoding the
  cytosolic glutaminyl-tRNA synthetase (GlnRS). GlnRS is the only enzyme that
  charges glutamine onto cytosolic tRNA-Gln, so it is required for incorporation of
  glutamine into every protein translated in the cytosol. The founding report
  described two unrelated families with progressive postnatal microcephaly, severe
  infantile-onset seizures, and atrophy of the cerebral cortex and cerebellar vermis
  with milder cerebellar hemispheric atrophy. Pathogenic alleles act through two
  routes that converge on reduced aminoacylation: N-terminal-domain missense
  variants that lower catalytic efficiency and destabilise the enzyme, and
  catalytic-core missense or truncating variants that cause misfolding, aggregation
  and loss of activity. Later reports widened the phenotype considerably. At the
  severe end are neonatal-onset epileptic encephalopathies with diffuse cerebral
  atrophy and deficient myelination, sometimes without cerebellar involvement; at
  the mild end are homozygous missense genotypes with microcephaly and severe
  intellectual disability but no epilepsy, severe postnatal growth failure with
  only minor imaging changes, and childhood-onset focal epilepsy that responds to
  monotherapy. Management is symptomatic; no disease-modifying treatment exists.
parents:
- Neurodevelopmental Disorder
- Inborn Error of Metabolism
synonyms:
- MSCCA
- microcephaly, progressive, seizures, and cerebral and cerebellar atrophy
- microcephaly, progressive, with seizures and cerebral and cerebellar atrophy
- diffuse cerebral and cerebellar atrophy - intractable seizures - progressive microcephaly syndrome
- QARS deficiency
- glutaminyl-tRNA synthetase deficiency
notes: >-
  Name. The entry keeps the MONDO label, which is also the ClinGen-preferred label
  for this disease. No gene-related name is established for it: MONDO records no
  QARS1 synonym, no GeneReviews chapter covers the gene or the disease (just
  check-genereviews, offline index), and a PubMed search on 2026-11-05 found
  "QARS1-related" in one record (PMID:39715963), "QARS1 deficiency" in one
  (PMID:33256324) and "QARS deficiency" in five, so the literature has no settled
  dyadic name. "QARS deficiency" and "glutaminyl-tRNA synthetase deficiency" are
  kept as synonyms because they recur in report titles (PMID:25432320,
  PMID:28620870). The gene was named QARS before the 2019 HGNC symbol change, and
  every report before then uses that symbol.

  Scope. The label names three features, and none of them is obligate across the
  reported patients: a consanguineous Pakistani family homozygous for p.Arg378His
  had no epilepsy and normal MRI (PMID:40448856), the Ashkenazi p.Val476Ile
  homozygotes had no epilepsy and minor MRI findings (PMID:28620870), and an index
  patient with p.Arg463* / p.Gln742His had diffuse cerebral atrophy with an
  unaffected cerebellum (PMID:25432320). The entry covers the whole QARS1
  biallelic phenotype bound to MONDO:0014335, and the phenotype nodes for seizures
  and atrophy are curated as frequent rather than defining features.

  Case counting. The 2025 literature review in PMID:40448856 tabulates 26
  previously reported patients plus the new family; no prevalence estimate has
  been published, so no prevalence record is given.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Every reported family carries biallelic QARS1 variants, compound heterozygous in
    the non-consanguineous families of the founding report and in most later cases,
    and homozygous in consanguineous families. Several authors note that homozygous
    missense genotypes tend toward the milder end of the spectrum.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing of individuals from each family independently identified compound-heterozygous mutations in QARS as the only candidate causative variants."
    explanation: Compound-heterozygous (biallelic) genotypes in two unrelated families establish recessive inheritance.
  - reference: PMID:40448856
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a rare QARS1 variant NM_005051.3:c.1133G > A, p.(Arg378His) in homozygous state in the family."
    explanation: A homozygous genotype in a consanguineous family is consistent with autosomal recessive inheritance.
pathophysiology:
- name: Biallelic QARS1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is damage to both QARS1 alleles. The published allelic
    series is mostly missense, distributed across the N-terminal domain (p.Gly45Val,
    p.Tyr57His), the catalytic core (p.Arg403Trp, p.Arg515Trp, p.Val476Ile,
    p.Arg378His) and the anticodon-binding domain (p.Gln742His), together with
    truncating alleles (p.Lys496*, p.Arg463*). In the founding families each patient
    combined one N-terminal-domain allele with one catalytic-core allele.
  genes:
  - preferred_term: QARS1
    term:
      id: hgnc:9751
      label: QARS1
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The four QARS mutations altered highly conserved amino acids, and the aminoacylation activity of QARS was significantly impaired in mutant cell lines."
    explanation: Establishes the biallelic QARS1 variants as loss-of-function lesions of conserved residues.
  - reference: PMID:25471517
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified compound heterozygous mutations ... in QARS, which encodes glutaminyl-tRNA synthetase, in two siblings with early-onset epileptic encephalopathy (EOEE)."
    explanation: An independent family with biallelic (compound heterozygous) QARS1 variants; the alleles are p.Tyr57His and the truncating p.Lys496* (see the variants list).
  downstream:
  - target: Reduced GlnRS Catalytic Efficiency
    description: N-terminal-domain missense alleles lower the turnover of an otherwise folded enzyme.
  - target: GlnRS Misfolding and Aggregation
    description: Catalytic-core missense and truncating alleles produce misfolded, aggregation-prone or absent enzyme.
- name: Reduced GlnRS Catalytic Efficiency
  biological_scale: MOLECULAR
  description: >-
    The N-terminal-domain variants p.Gly45Val and p.Tyr57His reduce aminoacylation
    activity more than 10-fold in recombinant enzyme. Crystal structures of the
    intact human enzyme show that these substitutions alter the conformation of the
    N-terminal domain and its orientation relative to the catalytic domain and
    change the enzyme's thermal unfolding profile; kinetic analysis places the
    defect in kcat rather than in tRNA-Gln binding.
  genes:
  - preferred_term: QARS1
    term:
      id: hgnc:9751
      label: QARS1
  molecular_functions:
  - preferred_term: glutamine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004819
      label: glutamine-tRNA ligase activity
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "recombinant QARS proteins bearing either substitution showed an over 10-fold reduction in aminoacylation activity"
    explanation: Measures the catalytic deficit of the two N-terminal-domain alleles in recombinant enzyme.
  - reference: PMID:26869582
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pathological mutations mapping in the NTD alter the domain structure, and decrease catalytic activity and stability of GlnRS"
    explanation: Structural and biochemical evidence that N-terminal-domain variants reduce both activity and stability.
  downstream:
  - target: Deficient Glutaminyl-tRNA Aminoacylation
    description: Lower turnover per enzyme molecule reduces the supply of charged tRNA-Gln.
- name: GlnRS Misfolding and Aggregation
  biological_scale: MOLECULAR
  description: >-
    The catalytic-core variants p.Arg403Trp and p.Arg515Trp abolish aminoacylation
    activity in vitro and render the enzyme poorly soluble; recombinant mutant
    protein co-purifies with the bacterial chaperonin GroEL and degrades when
    separated from it. p.Arg403Trp also disrupts the interaction of QARS1 with
    RARS1 in the multisynthetase complex. The truncating allele p.Lys496* gives
    diminished, aggregated protein when expressed in neuroblastoma cells. Milder
    alleles (p.Arg378Cys, p.Arg525Gln) reduce solubility with little loss of
    catalytic efficiency, which places the severity of a genotype on the residual
    soluble, active enzyme it leaves.
  genes:
  - preferred_term: QARS1
    term:
      id: hgnc:9751
      label: QARS1
  biological_processes:
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "p.Arg403Trp and p.Arg515Trp rendered QARS less soluble, and p.Arg403Trp disrupted QARS-RARS (arginyl-tRNA synthetase 1) interaction"
    explanation: Shows the catalytic-core alleles reduce solubility and disrupt a multisynthetase-complex interaction.
  - reference: PMID:26869582
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "whereas missense mutations in the catalytic domain induce misfolding of the enzyme"
    explanation: Structural study showing catalytic-domain missense variants cause misfolding.
  - reference: PMID:25471517
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transient expression of the p.Lys496* mutant in neuroblastoma 2A cells revealed diminished and aberrantly aggregated expression, indicating the loss-of-function nature of this mutant."
    explanation: The truncating allele yields diminished, aggregated protein.
  - reference: PMID:34774383
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional testing showed reduced solubility of the corresponding QARS1 mutants in vitro, but only mild two-fold loss in catalytic efficiency with the c.1132C > T variant and no noted change in tRNAGln aminoacylation with the c.1574G > A variant."
    explanation: Milder alleles act mainly through reduced solubility rather than loss of catalysis.
  downstream:
  - target: Deficient Glutaminyl-tRNA Aminoacylation
    description: Misfolded, aggregated or degraded enzyme contributes no aminoacylation activity.
    evidence:
    - reference: PMID:24656866
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "were located in the catalytic core and completely disrupted QARS aminoacylation activity in vitro"
      explanation: The catalytic-core alleles abolish aminoacylation.
- name: Deficient Glutaminyl-tRNA Aminoacylation
  biological_scale: MOLECULAR
  description: >-
    Both allele classes converge on a reduced capacity to charge tRNA-Gln with
    glutamine. Because GlnRS is the only cytosolic enzyme for this step, the deficit
    limits glutamine incorporation into all cytosolically translated proteins.
    Reduced aminoacylation has been measured in patient cell lines and in patient
    fibroblasts, including in the milder growth-failure phenotype. QARS1 is highly
    expressed in the developing fetal cerebral cortex. Why a ubiquitous housekeeping
    defect falls hardest on the developing brain is not established; the high
    translational demand of brain growth is the usual explanation, but no QARS1
    study measures translation directly.
  genes:
  - preferred_term: QARS1
    term:
      id: hgnc:9751
      label: QARS1
  biological_processes:
  - preferred_term: glutaminyl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0006425
      label: glutaminyl-tRNA aminoacylation
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:28620870
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient's fibroblasts demonstrated markedly reduced QARS amino acylation activity in vitro."
    explanation: Reduced aminoacylation measured in patient-derived cells.
  - reference: PMID:26869582
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that the reduced catalytic efficiency and a propensity of GlnRS mutants to misfold trigger the disease development."
    explanation: Places the two allele mechanisms upstream of a shared loss of enzyme function.
  downstream:
  - target: Neural Cell Death in the Developing Brain
    description: >-
      Insufficient GlnRS activity during brain development is followed by cell death
      and reduced brain size in the zebrafish loss-of-function model; the
      intervening translational step is inferred rather than measured.
    evidence:
    - reference: PMID:24656866
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In zebrafish, homozygous qars loss of function caused decreased brain and eye size and extensive cell death in the brain."
      explanation: Loss of qars function in vivo produces brain cell death and reduced brain size.
  - target: Seizure
    description: >-
      Impaired QARS1 activity is associated with unusually severe epilepsy. The
      cellular route from the aminoacylation defect to network hyperexcitability is
      not established.
    evidence:
    - reference: PMID:24656866
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "epilepsy due to impairment of QARS activity is unusually severe in comparison to other aminoacyl-tRNA synthetase disorders"
      explanation: The authors attribute the severe epilepsy to impaired QARS activity.
  - target: Epileptic Encephalopathy
    evidence:
    - reference: PMID:25471517
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "our data suggest that abnormal aminoacylation is one of the underlying pathologies of EOEE"
      explanation: Links the aminoacylation defect to early-onset epileptic encephalopathy.
  - target: Severe Postnatal Growth Retardation
    description: >-
      Reported with the homozygous catalytic-domain allele p.Val476Ile, where reduced
      aminoacylation was measured in patient fibroblasts. Whether growth failure
      follows from the aminoacylation defect generally, or is particular to this
      allele, is not known.
- name: Neural Cell Death in the Developing Brain
  biological_scale: CELLULAR
  description: >-
    Loss of qars function in zebrafish causes extensive cell death in the brain with
    reduced brain and eye size. In patients the corresponding observation is
    progressive loss of cerebral and cerebellar volume after birth; neuronal loss
    has not been shown histologically in a patient.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cell death
    modifier: INCREASED
    term:
      id: GO:0008219
      label: cell death
  mechanism_confidence: PROVISIONAL
  notes: >-
    The neuron binding is the cell type the human imaging phenotype implies; the
    zebrafish report describes cell death in the brain without naming the cell type.
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In zebrafish, homozygous qars loss of function caused decreased brain and eye size and extensive cell death in the brain."
    explanation: In vivo model evidence for brain cell death following loss of QARS function.
  downstream:
  - target: Progressive Loss of Cerebral and Cerebellar Volume
- name: Progressive Loss of Cerebral and Cerebellar Volume
  biological_scale: TISSUE
  description: >-
    Postnatal loss of brain tissue that drives the progressive microcephaly and the
    cerebral cortical and cerebellar atrophy seen on serial MRI. The cerebellar
    component is vermis-predominant and is absent in some patients, whose atrophy is
    confined to supratentorial structures.
  biological_processes:
  - preferred_term: brain development
    modifier: DECREASED
    term:
      id: GO:0007420
      label: brain development
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected by progressive microcephaly, severe seizures in infancy, atrophy of the cerebral cortex and cerebellar vermis, and mild atrophy of the cerebellar hemispheres"
    explanation: The founding families show progressive microcephaly with cerebral and cerebellar atrophy.
  - reference: PMID:25432320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, in contrast to the two hitherto published families, the cerebellum and its myelination are not affected."
    explanation: Shows the cerebellar component of the tissue loss is not obligate.
  downstream:
  - target: Progressive Microcephaly
  - target: Cerebral Cortical Atrophy
  - target: Cerebellar Vermis Atrophy
  - target: Cerebellar Atrophy
genetic:
- name: QARS1
  association: >-
    Biallelic missense and truncating variants cause autosomal recessive MSCCA; no
    monoallelic QARS1 disease phenotype is reported in this disease's literature.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: QARS1
    term:
      id: hgnc:9751
      label: QARS1
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_6b0cbc0e-c97c-4f6d-a351-0ac23a4ba8a5-2020-05-26T150033.131Z
    evidence:
    - reference: CGGV:assertion_6b0cbc0e-c97c-4f6d-a351-0ac23a4ba8a5-2020-05-26T150033.131Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "QARS1 | HGNC:9751 | diffuse cerebral and cerebellar atrophy - intractable seizures - progressive microcephaly syndrome | MONDO:0014335 | AR | Definitive"
      explanation: ClinGen (Brain Malformations GCEP) classifies the QARS1-MSCCA relationship as Definitive for autosomal recessive inheritance.
  notes: >-
    HGNC symbol QARS1 (hgnc:9751), "glutaminyl-tRNA synthetase 1"; former symbol QARS.
    The protein is GlnRS. Reference transcript in the reports is NM_005051.
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the identification of mutations in QARS (encoding glutaminyl-tRNA synthetase [QARS]) as the causative variants in two unrelated families"
    explanation: The founding report identifying QARS1 as the causal gene.
  variants:
  - name: p.Gly45Val
    description: N-terminal-domain missense allele from the founding report; reduces aminoacylation activity more than 10-fold.
    evidence:
    - reference: PMID:24656866
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Variants p.Gly45Val and p.Tyr57His were located in the N-terminal domain required for QARS interaction with proteins in the multisynthetase complex and potentially with glutamine tRNA"
      explanation: Locates the variant in the N-terminal domain.
  - name: p.Tyr57His (c.169T>C)
    description: >-
      N-terminal-domain missense allele, recurrent across the founding report and the
      Japanese early-onset epileptic encephalopathy family.
    evidence:
    - reference: PMID:25471517
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recessive mutations in QARS, including the loss-of-function missense mutation p.Tyr57His, have been reported to cause intractable seizures with progressive microcephaly."
      explanation: Records p.Tyr57His as a recurrent loss-of-function allele.
  - name: p.Arg403Trp
    description: Catalytic-core missense allele; abolishes aminoacylation, reduces solubility and disrupts QARS1-RARS1 interaction.
    evidence:
    - reference: PMID:24656866
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "p.Arg403Trp and p.Arg515Trp rendered QARS less soluble, and p.Arg403Trp disrupted QARS-RARS (arginyl-tRNA synthetase 1) interaction"
      explanation: Functional characterisation of the allele.
  - name: p.Arg515Trp
    description: Catalytic-core missense allele; abolishes aminoacylation and reduces solubility.
    evidence:
    - reference: PMID:24656866
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "were located in the catalytic core and completely disrupted QARS aminoacylation activity in vitro"
      explanation: Functional characterisation of the catalytic-core alleles.
  - name: p.Lys496* (c.1485dup)
    description: Truncating allele removing part of the catalytic domain and the whole anticodon-binding domain.
    evidence:
    - reference: PMID:25471517
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The p.Lys496* mutation is novel and causes truncation of the QARS protein, leading to a deletion of part of the catalytic domain and the entire anticodon-binding domain."
      explanation: Describes the truncating allele.
  - name: p.Arg463* / p.Gln742His
    description: Compound heterozygous genotype in a family with supratentorial atrophy and deficient myelination but a spared cerebellum.
    evidence:
    - reference: PMID:25432320
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "including c.1387G > A (p.R463*) in the catalytic core domain and c.2226C > G (p.Q742H) in the anticodon domain, both previously unreported and predicted damaging"
      explanation: Reports the genotype.
  - name: p.Val476Ile (homozygous)
    description: Catalytic-domain missense allele in Ashkenazi Jewish patients with severe growth failure, microcephaly and intellectual disability without epilepsy.
    evidence:
    - reference: PMID:28620870
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Homozygosity mapping and whole exome sequencing revealed a homozygous missense (V476I) mutation in the QARS gene, located in the catalytic domain."
      explanation: Reports the homozygous allele.
  - name: p.Arg378His (homozygous, c.1133G>A)
    description: Catalytic-domain missense allele associated with a non-epileptic phenotype in Turkish and Pakistani families.
    evidence:
    - reference: PMID:40448856
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant was recently cited in a patient of Turkish ethnicity, the only MSCCA patient reported with nonepileptic phenotype."
      explanation: Records the recurrence of the allele with a non-epileptic phenotype.
  - name: p.Arg378Cys / p.Arg525Gln
    description: Compound heterozygous genotype with reduced solubility but largely preserved catalysis, and a mild phenotype.
    evidence:
    - reference: PMID:34774383
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe two QARS1 variants associated with overall conserved tRNA aminoacylation activity but characterized by significantly reduced QARS protein solubility, resulting in a milder clinical phenotype."
      explanation: Links a solubility-predominant genotype to a milder phenotype.
  - name: p.Tyr435Cys / p.Arg267Trp
    description: Compound heterozygous genotype in a child with childhood-onset focal epilepsy, developmental delay, short stature and a para-infectious encephalopathy episode.
    evidence:
    - reference: PMID:39715963
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "unraveling two compound heterozygous QARS1 variants: the likely pathogenic c.1304A>G (p.Y435C) and the c.799C>T (p.R267W)"
      explanation: Reports the genotype.
phenotypes:
- name: Progressive Microcephaly
  category: Neurologic
  diagnostic: true
  description: >-
    Head growth decelerates after birth. Microcephaly is the most consistent feature
    of the disorder and is present in the non-epileptic families as well.
  phenotype_term:
    preferred_term: Progressive microcephaly
    term:
      id: HP:0000253
      label: Progressive microcephaly
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected by progressive microcephaly, severe seizures in infancy, atrophy of the cerebral cortex and cerebellar vermis, and mild atrophy of the cerebellar hemispheres"
    explanation: Progressive microcephaly in the founding families.
  - reference: PMID:25432320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as a novel genetic cause of progressive microcephaly with diffuse cerebral atrophy, severely deficient myelination, intractable seizures, and developmental arrest"
    explanation: Progressive microcephaly in an independent family.
- name: Seizure
  category: Neurologic
  frequency: VERY_FREQUENT
  description: >-
    Seizures usually begin in the neonatal period or early infancy and are
    frequently drug-resistant. Later onset (focal seizures at 7 months, or at 3.5
    years) occurs with milder genotypes, and some homozygous missense genotypes
    cause no epilepsy.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:34774383
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "86% of previous patients reported with QARS1 had epilepsy and 79% were pharmaco-resistant."
    explanation: Literature-pooled frequency of epilepsy and drug resistance, supporting VERY_FREQUENT.
  - reference: PMID:39715963
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "cause a rare encephalopathy classically characterized by severe developmental delay, drug-resistant neonatal-onset epilepsy, microcephaly, and brain atrophy"
    explanation: Drug-resistant neonatal-onset epilepsy as the classic presentation.
- name: Epileptic Encephalopathy
  category: Neurologic
  description: Early-onset epileptic encephalopathy at the severe end of the spectrum.
  phenotype_term:
    preferred_term: Epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  evidence:
  - reference: PMID:25471517
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in two siblings with early-onset epileptic encephalopathy (EOEE)"
    explanation: Two siblings with biallelic QARS1 variants presenting with early-onset epileptic encephalopathy.
- name: Focal-onset Seizures
  category: Neurologic
  description: >-
    Focal seizures are the reported seizure type in the milder, later-onset cases,
    with shifting focality or occipital spikes on EEG.
  phenotype_term:
    preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:34774383
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She developed focal seizures at 7 months of age. Serial electroencephalograms showed shifting focality."
    explanation: Focal seizures in a patient with a milder genotype.
  - reference: PMID:39715963
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy onset occurred at 3.5 years with a sleep-related focal autonomic seizure, accompanied by interictal occipital spikes at EEG."
    explanation: Childhood-onset focal seizures in another mild case.

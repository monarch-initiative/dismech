- name: Acute Para-infectious Encephalopathy
  category: Neurologic
  description: >-
    An episode of acute psychomotor slowing during intercurrent illness with EEG
    slowing and new bilateral subcortical white-matter T2 hyperintensities with
    diffusion restriction, responsive to intravenous methylprednisolone. Reported
    in two patients carrying p.Tyr435Cys; the authors suggest milder cases may be
    more susceptible to illness-triggered encephalopathy.
  phenotype_term:
    preferred_term: Acute para-infectious encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
    temporality: ACUTE
  evidence:
  - reference: PMID:39715963
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 5 years, the patient had a para-infectious encephalopathy with acute psychomotor slowing, delta-theta activity at EEG, new-onset bilateral subcortical white matter T2-hyperintensities with diffusion restriction at brain MRI, and optimal response to intravenous methylprednisolone administration."
    explanation: Describes the acute illness-triggered encephalopathy episode.
treatments:
- name: Antiseizure Pharmacotherapy
  description: >-
    Symptomatic treatment of epilepsy. Seizures are drug-resistant in most reported
    patients, but carbamazepine controlled focal seizures in one milder case and
    levetiracetam monotherapy gave a year of seizure freedom in another. No
    QARS1-specific antiseizure regimen exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_mechanisms:
  - target: Seizure
    treatment_effect: INHIBITS
    description: Acts on seizures, not on the upstream aminoacylation defect.
  evidence:
  - reference: PMID:34774383
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her seizures were controlled after introduction of carbamazepine."
    explanation: Seizure control with carbamazepine in a milder case.
  - reference: PMID:39715963
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 12-month follow-up, the patient had been seizure-free for a year with levetiracetam monotherapy."
    explanation: Seizure freedom on levetiracetam in another mild case.
  - reference: PMID:34774383
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "86% of previous patients reported with QARS1 had epilepsy and 79% were pharmaco-resistant."
    explanation: Most patients are pharmacoresistant, so the responses above are the exception.
- name: Intravenous Methylprednisolone for Para-infectious Encephalopathy
  description: >-
    Intravenous methylprednisolone was followed by an optimal response in a
    para-infectious encephalopathy episode. This is a single case report, not a
    tested protocol.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylprednisolone
      term:
        id: CHEBI:6888
        label: 6alpha-methylprednisolone
  target_mechanisms:
  - target: Acute Para-infectious Encephalopathy
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:39715963
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 5 years, the patient had a para-infectious encephalopathy with acute psychomotor slowing, delta-theta activity at EEG, new-onset bilateral subcortical white matter T2-hyperintensities with diffusion restriction at brain MRI, and optimal response to intravenous methylprednisolone administration."
    explanation: Reports the steroid response.
diagnosis:
- name: Exome Sequencing
  description: >-
    Diagnosis is molecular. Every reported family was diagnosed by exome sequencing,
    with homozygosity mapping in consanguineous families. There is no specific
    biochemical marker.
  evidence:
  - reference: PMID:24656866
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing of individuals from each family independently identified compound-heterozygous mutations in QARS as the only candidate causative variants."
    explanation: Exome sequencing identified the causal variants in the founding families.
  - reference: PMID:39715963
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to developmental delay and short stature, trio-based whole-exome sequencing was performed"
    explanation: Trio exome sequencing made the diagnosis in a mild case.
- name: Functional Assay of QARS1 Variants
  description: >-
    Not a routine clinical test. Aminoacylation and solubility assays of recombinant
    mutant enzyme have been used to reclassify variants of uncertain significance.
  evidence:
  - reference: PMID:34774383
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "originally classified as \"variants of uncertain significance\" and later upgraded to \"likely pathogenic\" based on functional testing and updated variant database review"
    explanation: Functional testing supported variant reclassification.
animal_models:
- name: qars loss-of-function zebrafish
  species: Danio rerio
  genotype: homozygous qars loss of function
  description: >-
    Homozygous qars loss-of-function zebrafish show decreased brain and eye size and
    extensive cell death in the brain. It is a complete loss of function, whereas
    patients retain residual activity.
  genes:
  - preferred_term: QARS1
    term:
      id: hgnc:9751
      label: QARS1
  associated_phenotypes:
  - Decreased brain size
  - Decreased eye size
  - Brain cell death
  modeled_mechanisms:
  - target: Neural Cell Death in the Developing Brain
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      A complete loss-of-function model, unlike the hypomorphic human genotypes;
      seizures were not reported in the model, and the abstract does not name the
      cell types that die.
    evidence:
    - reference: PMID:24656866
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In zebrafish, homozygous qars loss of function caused decreased brain and eye size and extensive cell death in the brain."
      explanation: The model shows brain cell death and reduced brain size.

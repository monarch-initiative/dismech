name: Neonatal Lupus Erythematosus
creation_date: "2026-08-27T23:30:00Z"
category: Autoimmune
description: >-
  Neonatal lupus erythematosus is a passively acquired autoimmune disease of the
  fetus and newborn caused by transplacental transfer of maternal IgG
  autoantibodies against the Ro/SSA and La/SSB ribonucleoproteins, and in a
  distinct subset against U1-RNP. Despite the name it is not systemic lupus
  erythematosus occurring in an infant: the affected child has no autoimmune
  disease of its own, produces no autoantibody, and recovers as maternal IgG is
  catabolised. Roughly half of the mothers are asymptomatic at delivery and are
  identified only by the birth of an affected child, so maternal lupus is not a
  prerequisite. The disease separates cleanly into two mechanistic halves that
  share one trigger. The transient half, comprising annular photosensitive skin
  lesions, cholestatic hepatitis and cytopenias, resolves over 6-12 months as
  antibody clears. The permanent half is cardiac: between 18 and 26 weeks of
  gestation, physiological remodelling of the developing atrioventricular
  conduction system exposes normally intracellular Ro and La antigens on the
  surface of apoptotic cardiocytes, maternal antibody binding diverts their
  clearance from neighbouring cardiocytes to professional phagocytes, and the
  resulting macrophage-myofibroblast crosstalk and TGF-beta-driven fibrosis
  replace conduction tissue irreversibly. This is why anti-inflammatory therapy
  can sometimes reverse incomplete block but never reverses established
  third-degree block, and it is what makes the disease a widely used model for
  studying how an autoantibody alone causes end-organ injury.
parents:
  - Autoimmune Disease
  - Cardiac Conduction Disorder
synonyms:
  - neonatal lupus syndrome
  - NLE
  - NLS
  - congenital heart block associated with maternal anti-Ro/SSA antibodies
disease_term:
  preferred_term: neonatal lupus erythematosus
  term:
    id: MONDO:0018360
    label: neonatal lupus erythematosus
notes: >-
  Relationship to the Systemic Lupus Erythematosus entry. kb/disorders/Systemic_Lupus_Erythematosus.yaml
  carries a has_subtypes entry named "Neonatal Lupus" with a one-line description and
  no MONDO binding. That entry is retained as a pointer; this file is the curated
  disease. The two are deliberately not modelled as parent and subtype, because
  neonatal lupus is not a form of SLE: the pathogenic agent is maternal IgG acting
  on fetal tissue, the affected individual has no autoimmunity, and roughly half of
  the mothers have no lupus at all. MONDO models MONDO:0018360 as its own disease
  term rather than as a child of MONDO:0007915 (systemic lupus erythematosus).
inheritance:
  - name: Not inherited (passively acquired)
    description: >-
      Neonatal lupus is not transmitted as a Mendelian trait. The determinant of
      risk is the mother's antibody status, which is why recurrence in a
      subsequent pregnancy is high (of the order of 15-20% after an affected
      child) while the general population risk is negligible. That recurrence
      figure is often misread as a segregation ratio; it is not one, and no
      inheritance_term is bound here because the HPO mode-of-inheritance subtree
      has no value that correctly describes maternal-antibody transmission.
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHB occurs in approximately 1-5% of pregnancies in mothers with
          anti-Ro/La antibodies, independent of the mother's disease status, and
          in approximately 15-20% of pregnancies following the birth of a child
          with NLS.
        explanation: >-
          States both the baseline per-pregnancy risk in antibody-positive
          mothers and the recurrence risk after an affected child, and makes
          explicit that risk tracks antibody status rather than maternal disease.
prevalence:
  - population: Pregnancies of anti-Ro/SSA-positive women with known connective tissue disease
    measure_type: POINT_PREVALENCE
    prevalence_class: ABOVE_1_IN_1000
    rate_per_100000: 2000.0
    notes: >-
      Prevalence of complete congenital heart block specifically, not of all
      neonatal lupus manifestations. Recorded as 2% of at-risk pregnancies.
    evidence:
      - reference: PMID:12402413
        reference_title: "Neonatal lupus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The prevalence of complete CHB in newborns of anti-Ro/SSA positive
          women and with known connective-tissue disease was 2%.
        explanation: >-
          The cited figure is explicitly a prevalence of complete block within
          the at-risk antibody-positive population, which is the denominator
          recorded in this record.
mechanistic_hypotheses:
  - hypothesis_group_id: apoptosis_efferocytosis_fibrosis
    hypothesis_label: Diverted efferocytosis driving inflammatory fibrosis of the AV node
    status: CANONICAL
    description: >-
      The mechanism this entry models in full. Maternal antibody bound to
      surface-exposed Ro/La on apoptotic cardiocytes blocks their silent
      clearance by neighbouring cardiocytes, diverting uptake to
      Fc-gamma-receptor-bearing macrophages, whose pro-inflammatory and
      pro-fibrotic secretion drives TGF-beta-mediated fibrosis and permanent
      replacement of conduction tissue. It is treated as canonical because it is
      the account with direct human tissue support: fibrosis, TGF-beta
      expression and macrophage-myofibroblast crosstalk have been observed in
      fetuses dying with congenital heart block.
    evidence:
      - reference: PMID:18250129
        reference_title: >-
          Dying right to live longer: positing apoptosis as a link between
          maternal autoantibodies and congenital heart block.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The identification of exaggerated apoptosis, macrophage/myfibroblast
          crosstalk, TGF beta expression, and extensive fibrosis in the
          conducting system and in some cases surrounding myocardium in fetuses
          dying with CHB, provide in vivo support for several parallel lines of
          in vitro investigation.
        explanation: >-
          The human tissue evidence that makes this the canonical account rather
          than one of two equals.
  - hypothesis_group_id: direct_calcium_channel_blockade
    hypothesis_label: Direct antibody interference with cardiac calcium channels
    status: ALTERNATIVE
    description: >-
      A complementary account in which anti-Ro/La antibodies cross-react
      directly with cardiac L-type and T-type calcium channels, disturbing
      transmembrane calcium signalling in conduction tissue and impairing
      conduction without requiring inflammation. This is not a rival that would
      make the fibrosis account wrong: the two operate on different timescales,
      and a direct channel effect is the more natural explanation for the
      conduction abnormalities that are reversible, while fibrosis explains the
      ones that are not. It is recorded as ALTERNATIVE rather than modelled as
      its own node chain because no node in this entry currently rests on it,
      and inventing one would assert more than the cited sources do.
    evidence:
      - reference: PMID:22832822
        reference_title: >-
          Neonatal lupus: advances in understanding pathogenesis and identifying
          treatments of cardiac disease.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Evidence from animal models suggests that reactivity to the p200
          region of the Ro52 protein, as well as antibody targeting of L-type
          calcium channels may be important in the development of cardiac
          neonatal lupus.
        explanation: >-
          Names antibody targeting of L-type calcium channels as a candidate
          mechanism. Graded MODEL_ORGANISM because the review attributes it to
          animal models, which is also why it is ALTERNATIVE rather than
          CANONICAL - the fibrosis account has human tissue support and this one
          does not yet.
      - reference: PMID:12402413
        reference_title: "Neonatal lupus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          These antibodies may induce a myocarditis, or interact directly with
          calcium channel proteins with disturbance of transmembrane signaling
          at the level of the conduction tissue, or interfere with apoptosis.
        explanation: >-
          States all three candidate routes side by side, including the direct
          calcium-channel interaction this hypothesis group names. The source's
          own "may" is why the group is ALTERNATIVE.
pathophysiology:
  - name: Maternal Anti-Ro/La IgG Transfer Across the Placenta
    biological_scale: ORGANISM
    description: >-
      Maternal IgG autoantibodies against the Ro/SSA (Ro52/TRIM21 and Ro60) and
      La/SSB ribonucleoproteins, or against U1-RNP, cross the placenta and enter
      the fetal circulation. Because placental IgG transport rises through the
      second and third trimesters, fetal antibody concentration climbs across
      exactly the gestational window in which the conduction system is
      vulnerable. This node is the disease's sole initiating event; everything
      downstream is a consequence of antibody presence in fetal tissue.
    downstream:
      - target: Surface Exposure of Ro/La Antigens on Apoptotic Fetal Cardiocytes
      - target: Antibody-Mediated Injury of Skin, Liver and Blood Cells
    evidence:
      - reference: PMID:33470961
        reference_title: "Neonatal lupus erythematosus - practical guidelines."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Neonatal lupus erythematosus is an autoimmune disease acquired during
          fetal life as a result of transplacental passage of maternal
          anti-Sjögren's-syndrome-related antigen A (anti-SSA/Ro),
          anti-Sjögren's-syndrome-related antigen B (anti-SSB/La) or anti-U1
          ribonucleoprotein (anti-U1-RNP) antinuclear autoantibodies.
        explanation: >-
          Names the three autoantibody specificities and states that
          transplacental passage is the acquisition mechanism, which is exactly
          what this node models.
  - name: Surface Exposure of Ro/La Antigens on Apoptotic Fetal Cardiocytes
    biological_scale: CELLULAR
    description: >-
      Ro and La are normally intracellular ribonucleoproteins and are therefore
      invisible to circulating antibody. During the physiological apoptosis that
      accompanies remodelling of the developing atrioventricular conduction
      system, these antigens translocate to the surface of apoptotic
      cardiocytes, where the maternal antibodies can reach them. This
      developmentally timed unmasking is what confines cardiac injury to a
      narrow gestational window rather than occurring whenever antibody is
      present.
    cell_types:
      - preferred_term: apoptotic fetal cardiocyte
        term:
          id: CL:0000746
          label: cardiac muscle cell
    biological_processes:
      - preferred_term: apoptotic process
        term:
          id: GO:0006915
          label: apoptotic process
    locations:
      - preferred_term: atrioventricular node
        term:
          id: UBERON:0002352
          label: atrioventricular node
    downstream:
      - target: Diverted Clearance of Opsonised Apoptotic Cardiocytes to Macrophages
        hypothesis_groups:
          - apoptosis_efferocytosis_fibrosis
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Recent studies demonstrate that Ro/La ribonucleoproteins appear on the
          surface of apoptotic fetal cardiocytes and are recognized by their
          cognate antibodies, promoting an inflammatory response.
        explanation: >-
          States the surface translocation of Ro/La on apoptotic fetal
          cardiocytes and their recognition by the cognate antibodies, which is
          the claim this node makes. Graded IN_VITRO because the sentence
          summarises cell-based studies of apoptotic cardiocytes.
  - name: Diverted Clearance of Opsonised Apoptotic Cardiocytes to Macrophages
    biological_scale: CELLULAR
    description: >-
      Healthy cardiocytes normally phagocytose their apoptotic neighbours
      silently, a form of efferocytosis that produces no inflammation. Bound
      anti-Ro/La antibody blocks that uptake, so clearance is diverted to
      professional Fc-gamma-receptor-bearing phagocytes. The same apoptotic cell
      is then removed through an inflammatory route instead of a silent one.
      This diversion, rather than the antibody binding itself, is the step that
      converts a normal developmental process into tissue injury.
    cell_types:
      - preferred_term: macrophage
        term:
          id: CL:0000235
          label: macrophage
    biological_processes:
      - preferred_term: apoptotic cell clearance
        term:
          id: GO:0043277
          label: apoptotic cell clearance
        modifier: DECREASED
      - preferred_term: inflammatory response
        term:
          id: GO:0006954
          label: inflammatory response
        modifier: INCREASED
    downstream:
      - target: TGF-beta-Driven Fibrosis and Calcification of the Conduction System
        hypothesis_groups:
          - apoptosis_efferocytosis_fibrosis
    evidence:
      - reference: PMID:18250129
        reference_title: >-
          Dying right to live longer: positing apoptosis as a link between
          maternal autoantibodies and congenital heart block.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          cardiocytes are capable of phagocytosing autologous apoptotic
          cardiocytes and anti-Ro/La antibodies inhibit this function
        explanation: >-
          The direct statement of this node's mechanism: cardiocyte-mediated
          clearance of apoptotic cardiocytes exists, and anti-Ro/La antibody
          inhibits it. Graded IN_VITRO because the phagocytosis assay is a
          cell-based experiment.
      - reference: PMID:18250129
        reference_title: >-
          Dying right to live longer: positing apoptosis as a link between
          maternal autoantibodies and congenital heart block.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Recognizing that this perturbation of physiologic efferocytosis might
          divert uptake to professional Fc gamma R-bearing phagocytes fits well
          with experiments demonstrating macrophage secretion of
          pro-inflammatory and fibrosing cytokines when coincubated with
          apoptotic cardiocytes bound by Ro/La antibodies.
        explanation: >-
          Supports the diversion of clearance to professional phagocytes and the
          resulting secretion of pro-inflammatory and pro-fibrotic cytokines,
          the link from this node to the fibrosis node downstream.
  - name: TGF-beta-Driven Fibrosis and Calcification of the Conduction System
    biological_scale: TISSUE
    description: >-
      Macrophages taking up antibody-bound apoptotic cardiocytes secrete
      pro-inflammatory and pro-fibrosing cytokines, and crosstalk with
      myofibroblasts drives TGF-beta expression, extensive fibrosis and
      dystrophic calcification within the atrioventricular node. Conduction
      tissue is replaced by scar. The claim that this is structural rather than
      inflammatory carries the entry's main clinical implication: once
      replacement is complete the lesion cannot be reversed by suppressing
      inflammation.
    cell_types:
      - preferred_term: myofibroblast
        term:
          id: CL:0000186
          label: myofibroblast cell
    biological_processes:
      - preferred_term: transforming growth factor beta receptor signaling pathway
        term:
          id: GO:0007179
          label: transforming growth factor beta receptor signaling pathway
        modifier: INCREASED
    locations:
      - preferred_term: atrioventricular node
        term:
          id: UBERON:0002352
          label: atrioventricular node
    downstream:
      - target: Irreversible Complete Atrioventricular Block
    evidence:
      - reference: PMID:18250129
        reference_title: >-
          Dying right to live longer: positing apoptosis as a link between
          maternal autoantibodies and congenital heart block.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The identification of exaggerated apoptosis, macrophage/myfibroblast
          crosstalk, TGF beta expression, and extensive fibrosis in the
          conducting system and in some cases surrounding myocardium in fetuses
          dying with CHB, provide in vivo support for several parallel lines of
          in vitro investigation.
        explanation: >-
          Reports the macrophage-myofibroblast crosstalk, TGF-beta expression
          and conduction-system fibrosis this node models, observed in human
          fetal tissue rather than in a model system. Graded HUMAN_CLINICAL
          because the finding is from fetuses dying with congenital heart block.
  - name: Irreversible Complete Atrioventricular Block
    biological_scale: ORGANISM
    description: >-
      Fibrous replacement of the atrioventricular node produces third-degree
      block: atrial and ventricular activity become fully dissociated and
      ventricular rate falls to a junctional or ventricular escape rhythm. Most
      survivors require permanent pacing. Injury may extend beyond the node to
      the myocardium and endocardium, which is the origin of the late dilated
      cardiomyopathy and endocardial fibroelastosis seen in some survivors whose
      in-utero ventricular function was normal.
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Established third-degree block appears to be irreversible.
        explanation: >-
          The irreversibility claim that distinguishes this node from the
          transient manifestations, stated directly.
      - reference: PMID:18250129
        reference_title: >-
          Dying right to live longer: positing apoptosis as a link between
          maternal autoantibodies and congenital heart block.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The spectrum of conduction abnormalities includes second and
          third-degree block, but injury can extend to the myocardium and
          endocardium, in rare cases without AV nodal dysfunction.
        explanation: >-
          Supports both the conduction-block spectrum and the extension of
          injury beyond the node into myocardium and endocardium, which is what
          links this node to the cardiomyopathy phenotype.
  - name: Antibody-Mediated Injury of Skin, Liver and Blood Cells
    biological_scale: ORGANISM
    description: >-
      In parallel with the cardiac lesion and by a separate, reversible route,
      maternal antibody produces annular photosensitive skin lesions, cholestatic
      or transaminitic liver involvement, and peripheral cytopenias. These
      manifestations share the cardiac trigger but not its outcome: no fibrotic
      replacement occurs, so all resolve as maternal IgG is catabolised over the
      first 6-12 months of life. Modelling them as a distinct node rather than as
      downstream of the cardiac chain is deliberate, since they occur in infants
      with entirely normal conduction.
    cell_types:
      - preferred_term: keratinocyte
        term:
          id: CL:0000312
          label: keratinocyte
    evidence:
      - reference: PMID:33470961
        reference_title: "Neonatal lupus erythematosus - practical guidelines."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Clinical manifestations include skin lesions, congenital heart block,
          hepatobiliary involvement and cytopenias. Most of the disorders
          disappear spontaneously after clearance of maternal antibodies.
          Cardiac symptoms, however, are not self-resolving and often pacemaker
          implantation is required.
        explanation: >-
          Establishes both halves of the split this node encodes: the
          non-cardiac manifestations resolve on antibody clearance while the
          cardiac lesion does not.
phenotypes:
  - name: Complete Congenital Heart Block
    category: Cardiovascular
    description: >-
      Third-degree atrioventricular block, the defining and only permanent
      manifestation. Most commonly detected between 18 and 26 weeks of
      gestation, on surveillance echocardiography or after fetal bradycardia is
      noticed.
    phenotype_term:
      preferred_term: Third degree atrioventricular block
      term:
        id: HP:0001709
        label: Third degree atrioventricular block
      clinical_course: PROGRESSIVE
    frequency: FREQUENT
    evidence:
      - reference: PMID:31905489
        reference_title: >-
          Geoepidemiology and clinical characteristics of neonatal lupus
          erythematosus: a systematic literature review of individual patients'
          data.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The most frequently reported clinical manifestations of NLE were
          congenital heart block (CHB, 65.2%), cutaneous lupus (33.1%), and
          cytopenias (15.5%).
        explanation: >-
          Gives the frequency of congenital heart block across 755 individually
          reported cases. Note this is ascertainment-weighted rather than a true
          incidence: cardiac cases are far more likely to be published as case
          reports than skin-limited ones, which is why the entry records
          FREQUENT rather than treating 65.2% as the population figure.
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHB is most commonly diagnosed between 18 and 24 wk of gestation, and
          may be first, second or third degree (complete). Mortality approaches
          approximately 20%, and most surviving children require pacemakers.
        explanation: >-
          Establishes the gestational detection window, the graded severity of
          the block, and the pacemaker requirement in survivors.
  - name: Annular Photosensitive Cutaneous Lesions
    category: Dermatologic
    description: >-
      Erythematous annular or polycyclic plaques, classically periorbital and on
      the scalp and face, often photo-distributed and appearing or worsening
      after light exposure. Present at birth or emerging over the first weeks.
      Resolves without scarring in most infants, occasionally leaving
      telangiectasia or dyspigmentation.
    phenotype_term:
      preferred_term: Annular photosensitive erythematous plaques
      term:
        id: HP:0025528
        label: Annular cutaneous lesion
      temporality: TRANSIENT
    frequency: FREQUENT
    evidence:
      - reference: PMID:31905489
        reference_title: >-
          Geoepidemiology and clinical characteristics of neonatal lupus
          erythematosus: a systematic literature review of individual patients'
          data.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          reports originating from Asia reported a higher prevalence of skin
          involvement (45.2%)
        explanation: >-
          Quantifies cutaneous involvement in the Asian-origin reports, the
          subgroup in which skin disease rather than heart block predominates.
  - name: Cutaneous Photosensitivity
    category: Dermatologic
    description: >-
      The cutaneous lesions are characteristically provoked or aggravated by
      ultraviolet exposure, which is why sun avoidance is the principal
      management measure for skin-limited disease.
    phenotype_term:
      preferred_term: Cutaneous photosensitivity
      term:
        id: HP:0000992
        label: Cutaneous photosensitivity
      temporality: TRANSIENT
    evidence:
      - reference: PMID:15234013
        reference_title: "Neonatal lupus erythematosus."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          It has cutaneous manifestations similar to subacute cutaneous lupus
          erythematosus (SCLE).
        explanation: >-
          Graded PARTIAL deliberately, and the reason is worth stating. The
          quoted sentence establishes that the neonatal lupus rash resembles
          subacute cutaneous lupus erythematosus, which is the archetypal
          photosensitive lupus dermatosis; the photosensitivity of the neonatal
          lesions is an inference from that resemblance, not a claim this
          abstract makes directly. No abstract-level source stating it outright
          was found, so the inference is recorded openly rather than dressed up
          as a SUPPORT citation.
  - name: Thrombocytopenia
    category: Hematologic
    description: >-
      Antibody-mediated peripheral destruction of fetal platelets. Transient,
      resolving with maternal antibody clearance. No thrombocytopenia-specific
      frequency is recorded: the 15.5% figure available from the systematic
      review is for cytopenias as a group, and is carried on the grouped
      Cytopenias phenotype rather than attached to this narrower term.
    phenotype_term:
      preferred_term: Thrombocytopenia
      term:
        id: HP:0001873
        label: Thrombocytopenia
      temporality: TRANSIENT
    evidence:
      - reference: PMID:12402413
        reference_title: "Neonatal lupus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Skin lesions, haematological disorders, and hepatic cholestasis are
          other transient clinical features of the syndrome.
        explanation: >-
          Supports the haematological manifestations being present and
          transient. Deliberately not the 15.5% source: that figure is for
          cytopenias as a group and belongs on the grouped node.
  - name: Cytopenias
    category: Hematologic
    description: >-
      The grouped haematological phenotype - thrombocytopenia, decreased
      neutrophil count and anaemia together - attributed to antibody-mediated
      peripheral destruction of fetal blood cells. This node exists to carry the
      group-level frequency, which is the only frequency the literature reports;
      the individual cytopenias are modelled separately and deliberately carry
      no frequency of their own.
    phenotype_term:
      preferred_term: Cytopenias
      term:
        id: HP:0001871
        label: Abnormality of blood and blood-forming tissues
      temporality: TRANSIENT
    frequency: OCCASIONAL
    evidence:
      - reference: PMID:31905489
        reference_title: >-
          Geoepidemiology and clinical characteristics of neonatal lupus
          erythematosus: a systematic literature review of individual patients'
          data.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The most frequently reported clinical manifestations of NLE were
          congenital heart block (CHB, 65.2%), cutaneous lupus (33.1%), and
          cytopenias (15.5%).
        explanation: >-
          Records cytopenias in 15.5% of the 755 individually reported cases.
  - name: Decreased Neutrophil Count
    category: Hematologic
    description: >-
      Neutropenia is the most commonly reported of the neonatal lupus
      cytopenias. Usually asymptomatic and self-limited.
    phenotype_term:
      preferred_term: Neutropenia
      term:
        id: HP:0001875
        label: Decreased total neutrophil count
      temporality: TRANSIENT
    evidence:
      - reference: PMID:12402413
        reference_title: "Neonatal lupus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Skin lesions, haematological disorders, and hepatic cholestasis are
          other transient clinical features of the syndrome.
        explanation: >-
          Groups the haematological manifestations with the other transient
          features, supporting both the occurrence and the transience.
  - name: Anemia
    category: Hematologic
    description: >-
      Haemolytic or non-haemolytic anaemia from antibody-mediated destruction of
      fetal red cells. Named in the disease description and in the grouped
      Cytopenias node; modelled here so it is not the one cytopenia present only
      in prose. No individual frequency is available.
    phenotype_term:
      preferred_term: Anemia
      term:
        id: HP:0001903
        label: Anemia
      temporality: TRANSIENT
    evidence:
      - reference: PMID:12402413
        reference_title: "Neonatal lupus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Skin lesions, haematological disorders, and hepatic cholestasis are
          other transient clinical features of the syndrome.
        explanation: >-
          Supports the haematological manifestations as a transient feature.
          The abstract names haematological disorders collectively rather than
          anaemia specifically, which is why no frequency is attached here.
  - name: Endocardial Fibroelastosis
    category: Cardiovascular
    description: >-
      Endocardial and myocardial injury extending beyond the conduction system.
      Described in the pathophysiology as the origin of late cardiomyopathy in
      survivors; modelled here so it is a phenotype rather than only prose.
    phenotype_term:
      preferred_term: Endocardial fibroelastosis
      term:
        id: HP:0001706
        label: Endocardial fibroelastosis
    evidence:
      - reference: PMID:22832822
        reference_title: >-
          Neonatal lupus: advances in understanding pathogenesis and identifying
          treatments of cardiac disease.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Cardiac manifestations of neonatal lupus include anti-SSA/Ro-SSB/La-mediated
          conduction system disease and endocardial/myocardial damage resulting in
          cardiomyopathy.
        explanation: >-
          Names endocardial and myocardial damage as a cardiac manifestation
          distinct from conduction system disease.
  - name: Cholestatic Liver Involvement
    category: Hepatic
    description: >-
      Cholestasis, transaminase elevation and hepatomegaly, present at birth or
      developing over the first weeks. Almost always transient; rare severe
      cases with liver failure have been reported.
    phenotype_term:
      preferred_term: Cholestasis
      term:
        id: HP:0001396
        label: Cholestasis
      temporality: TRANSIENT
    frequency: OCCASIONAL
    evidence:
      - reference: PMID:12402413
        reference_title: "Neonatal lupus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Skin lesions, haematological disorders, and hepatic cholestasis are
          other transient clinical features of the syndrome.
        explanation: >-
          Names hepatic cholestasis directly as a transient feature of the
          syndrome.
  - name: Dilated Cardiomyopathy
    category: Cardiovascular
    description: >-
      A minority of infants with cardiac neonatal lupus develop cardiomyopathy,
      sometimes after normal in-utero ventricular function, reflecting antibody
      injury extending beyond the conduction system into myocardium and
      endocardium.
    phenotype_term:
      preferred_term: Dilated cardiomyopathy
      term:
        id: HP:0001644
        label: Dilated cardiomyopathy
      clinical_course: PROGRESSIVE
    evidence:
      - reference: PMID:22832822
        reference_title: >-
          Neonatal lupus: advances in understanding pathogenesis and identifying
          treatments of cardiac disease.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Cardiac manifestations of neonatal lupus include anti-SSA/Ro-SSB/La-mediated
          conduction system disease and endocardial/myocardial damage resulting in
          cardiomyopathy.
        explanation: >-
          States that cardiac neonatal lupus comprises both conduction disease
          and endocardial or myocardial damage producing cardiomyopathy.
  - name: Fetal Bradycardia
    category: Cardiovascular
    description: >-
      The usual presenting sign. A fetal heart rate in the 50-80 bpm range on
      routine obstetric auscultation or ultrasound is what prompts the
      echocardiogram that establishes the diagnosis.
    phenotype_term:
      preferred_term: Bradycardia
      term:
        id: HP:0001662
        label: Bradycardia
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          If fetal bradycardia is identified, a 2-dimensional and M-mode fetal
          echocardiographic and Doppler ultrasound should be obtained to
          determine whether there is an atrial arrhythmia or atrioventricular
          (AV) block
        explanation: >-
          Establishes fetal bradycardia as the presenting finding that triggers
          the diagnostic echocardiogram.
genetic:
  - name: TRIM21
    notes: >-
      TRIM21 encodes the Ro52 autoantigen. It is listed here as the maternal
      antibody's molecular target, not as a disease gene: neither mother nor
      infant carries a pathogenic TRIM21 variant, and the entry asserts no
      germline cause. Reactivity to the p200 region of Ro52 has been implicated
      in cardiac disease specifically.
    relationship_type: UNKNOWN
    gene_term:
      preferred_term: TRIM21
      term:
        id: hgnc:11312
        label: TRIM21
    evidence:
      - reference: PMID:22832822
        reference_title: >-
          Neonatal lupus: advances in understanding pathogenesis and identifying
          treatments of cardiac disease.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Evidence from animal models suggests that reactivity to the p200
          region of the Ro52 protein, as well as antibody targeting of L-type
          calcium channels may be important in the development of cardiac
          neonatal lupus.
        explanation: >-
          Identifies the Ro52 p200 region as the epitope implicated in cardiac
          disease. Graded MODEL_ORGANISM because the review attributes the
          finding to animal models.
  - name: RO60
    notes: >-
      RO60 (formerly TROVE2) encodes the Ro60 autoantigen. It is listed for the
      same reason as TRIM21 and SSB - it is a maternal antibody target, not a
      disease gene - and it is the antigen most directly implicated in the
      cardiac lesion, since anti-Ro60 binding is the step reported to activate
      the uPA/plasmin route to TGF-beta. Its earlier absence from this section
      was an internal inconsistency with the entry description, which names
      Ro60 among the Ro/SSA components.
    relationship_type: UNKNOWN
    gene_term:
      preferred_term: RO60
      term:
        id: hgnc:11313
        label: RO60
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Recent studies demonstrate that Ro/La ribonucleoproteins appear on the
          surface of apoptotic fetal cardiocytes and are recognized by their
          cognate antibodies, promoting an inflammatory response.
        explanation: >-
          Establishes the Ro ribonucleoproteins as the surface-exposed antigens
          recognised by maternal antibody. Note the source says Ro/La as a pair
          and does not resolve Ro60 from Ro52, so this supports Ro60 being an
          antigen rather than singling it out.
  - name: SSB
    notes: >-
      SSB encodes the La/SSB autoantigen, the second major maternal antibody
      target. As with TRIM21 this is an antigen, not a disease gene.
    relationship_type: UNKNOWN
    gene_term:
      preferred_term: SSB
      term:
        id: hgnc:11316
        label: SSB
    evidence:
      - reference: PMID:33470961
        reference_title: "Neonatal lupus erythematosus - practical guidelines."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          transplacental passage of maternal anti-Sjögren's-syndrome-related
          antigen A (anti-SSA/Ro), anti-Sjögren's-syndrome-related antigen B
          (anti-SSB/La) or anti-U1 ribonucleoprotein (anti-U1-RNP) antinuclear
          autoantibodies
        explanation: >-
          Names anti-SSB/La among the three pathogenic antibody specificities.
treatments:
  - name: Maternal Fluorinated Corticosteroid Therapy
    description: >-
      Fluorinated corticosteroids, principally dexamethasone, given to the
      mother so that active drug reaches the fetus. This is the therapy behind
      the entry's central asymmetry: it targets the inflammatory clearance step
      upstream of fibrosis, so it can act on block that is still evolving and
      cannot act on block that has already been replaced by scar. Modelled here
      because the entry states that conclusion in two places and previously
      never named the intervention it is a conclusion about. Note the evidence
      is weak by design of the field rather than by omission - the source below
      describes only anecdotal and retrospective evidence with a trial then
      underway.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: dexamethasone
          term:
            id: CHEBI:41879
            label: dexamethasone
    target_mechanisms:
      - target: Diverted Clearance of Opsonised Apoptotic Cardiocytes to Macrophages
        description: >-
          Acts on the inflammatory clearance route, upstream of fibrotic
          replacement. This placement is what encodes why the therapy can help
          before the node fibroses and not after.
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          To date, only anecdotal and retrospective evidence guides in utero
          therapy of CHB. A prospective trial is currently underway to evaluate
          the efficacy of maternal oral dexamethasone in treating newly
          identified first, second or third degree block.
        explanation: >-
          Graded PARTIAL, and the grading is the point. The quoted sentence
          establishes that maternal dexamethasone is the therapy being
          evaluated, and in the same breath that the evidence for it was
          anecdotal and retrospective. Recording it as SUPPORT would overstate
          a treatment the source itself describes as unproven.
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Established third-degree block appears to be irreversible.
        explanation: >-
          The boundary on what this therapy can achieve, and the reason it is
          attached to the clearance node rather than to the block itself.
  - name: Sympathomimetic Therapy for Fetal Hydrops
    description: >-
      Sympathomimetic agents, used with dexamethasone, for the fetus that
      develops hydrops from the bradycardia. This treats the haemodynamic
      consequence of the block, not the immune lesion, which is why it carries
      no target_mechanisms link to the pathophysiology chain.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Dexamethasone and sympathomimetics may be of some benefit in treating
          hydrops fetalis.
        explanation: >-
          Graded PARTIAL because the source says "may be of some benefit",
          which is a hedge the entry should carry rather than flatten.
  - name: Permanent Cardiac Pacing
    description: >-
      Pacemaker implantation is the definitive treatment for established
      complete block and is required by most survivors. It manages the
      consequence rather than the cause; no therapy restores conduction once the
      node is fibrosed.
    therapeutic_modality: DEVICE
    treatment_term:
      preferred_term: pacemaker placement
      term:
        id: NCIT:C80434
        label: Pacemaker Placement
    target_mechanisms:
      - target: Irreversible Complete Atrioventricular Block
        description: >-
          Restores an adequate ventricular rate downstream of the block. It does
          not act on the fibrotic lesion.
    evidence:
      - reference: PMID:33470961
        reference_title: "Neonatal lupus erythematosus - practical guidelines."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Cardiac symptoms, however, are not self-resolving and often pacemaker
          implantation is required.
        explanation: >-
          States both the non-resolution of cardiac disease and the pacemaker
          requirement that follows from it.
  - name: Maternal Hydroxychloroquine Prophylaxis
    description: >-
      Hydroxychloroquine given to an antibody-positive mother, ideally from
      early pregnancy, is the principal preventive strategy in mothers with a
      previously affected child. It is prophylaxis against the fibrotic lesion
      forming, not a treatment for established block.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: hydroxychloroquine
          term:
            id: CHEBI:5801
            label: hydroxychloroquine
    target_mechanisms:
      - target: Diverted Clearance of Opsonised Apoptotic Cardiocytes to Macrophages
        description: >-
          Acts upstream of fibrosis, on the inflammatory clearance route, which
          is consistent with its being effective only as prevention.
    evidence:
      - reference: PMID:33470961
        reference_title: "Neonatal lupus erythematosus - practical guidelines."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Testing for antinuclear antibodies should be considered in every
          pregnant woman since early treatment with hydroxychloroquine or
          intravenous immunoglobulin (IVIG) has proven to be effective in
          preventing congenital heart block.
        explanation: >-
          States the preventive efficacy of early hydroxychloroquine against
          congenital heart block, and the word "preventing" is what licenses
          modelling this as prophylaxis rather than treatment.
  - name: Intravenous Immunoglobulin
    description: >-
      IVIG has been used both preventively in at-risk pregnancies and as an
      adjunct in established disease. The evidence base is weaker than for
      hydroxychloroquine and dedicated trials have been largely negative for
      prevention of recurrence at the doses studied.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: intravenous immunoglobulin therapy
      term:
        id: NCIT:C121331
        label: Intravenous Immunoglobulin Therapy
    evidence:
      - reference: PMID:33470961
        reference_title: "Neonatal lupus erythematosus - practical guidelines."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          early treatment with hydroxychloroquine or intravenous immunoglobulin
          (IVIG) has proven to be effective in preventing congenital heart block
        explanation: >-
          Graded PARTIAL rather than SUPPORT. The guideline groups IVIG with
          hydroxychloroquine, but the trial evidence for the two is not
          equivalent, so quoting this sentence as unqualified support for IVIG
          would overstate what is established.
  - name: Sun Avoidance for Cutaneous Disease
    description: >-
      Because the rash is photo-provoked and self-limited, management of
      skin-limited neonatal lupus is protective rather than pharmacological.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: supportive care
      term:
        id: NCIT:C15747
        label: Supportive Care
    target_mechanisms:
      - target: Antibody-Mediated Injury of Skin, Liver and Blood Cells
        description: >-
          Removes the ultraviolet co-factor while maternal antibody clears.
    evidence:
      - reference: PMID:15234013
        reference_title: "Neonatal lupus erythematosus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The cutaneous, hematologic, and hepatic abnormalities are transient,
          clearing by 6 months of age.
        explanation: >-
          Establishes that the non-cardiac manifestations are self-limited,
          which is the rationale for managing them supportively rather than with
          immunosuppression.
environmental:
  - name: Ultraviolet light exposure
    description: >-
      Ultraviolet exposure is the recognised exacerbating factor for the
      cutaneous arm. It is not a cause of the disease - the maternal antibody
      is - but it is what makes the rash photo-distributed and what sun
      avoidance is avoiding, so it is modelled as a first-class exposure rather
      than left implicit in a treatment rationale.
    exposure_term:
      preferred_term: exposure to ultraviolet radiation
      term:
        id: ECTO:0000006
        label: exposure to ultraviolet radiation
    evidence:
      - reference: PMID:15234013
        reference_title: "Neonatal lupus erythematosus."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          It has cutaneous manifestations similar to subacute cutaneous lupus
          erythematosus (SCLE).
        explanation: >-
          Entry-level evidence for treating ultraviolet light as a relevant
          exposure in this disease. Graded PARTIAL deliberately: the abstract
          establishes the resemblance to SCLE, the archetypal photosensitive
          lupus dermatosis, and the ultraviolet role is inferred from that
          rather than stated. No abstract-level source asserting it outright was
          found, and this entry would rather show the inference than dress it up.
    influences_mechanisms:
      - target: Antibody-Mediated Injury of Skin, Liver and Blood Cells
        environmental_effect: EXACERBATES
        causal_link_type: DIRECT
        description: >-
          Ultraviolet exposure aggravates the antibody-mediated cutaneous
          injury. Attached to the transient arm only: there is no evidence that
          light exposure influences the cardiac lesion, which forms in utero.
        evidence:
          - reference: PMID:15234013
            reference_title: "Neonatal lupus erythematosus."
            supports: PARTIAL
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              It has cutaneous manifestations similar to subacute cutaneous
              lupus erythematosus (SCLE).
            explanation: >-
              Graded PARTIAL for the same reason as the photosensitivity
              phenotype: the resemblance to SCLE, the archetypal photosensitive
              lupus dermatosis, is what the abstract states, and the
              UV-exacerbation link is an inference from it rather than a claim
              this source makes directly. Recorded openly rather than
              over-graded.
diagnosis:
  - name: Maternal Anti-Ro/SSA and Anti-La/SSB Serology
    description: >-
      Detection of maternal anti-Ro/SSA and anti-La/SSB antibodies is the test
      that establishes the diagnosis, in the infant's mother rather than in the
      infant. Because about half of mothers are asymptomatic, a negative
      maternal history does not exclude it.
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The mother's serum should be tested by ELISA for anti-Ro and/or
          anti-La antibodies.
        explanation: >-
          States the confirmatory serological test and that the specimen is
          maternal.
  - name: Serial Fetal Echocardiography with Mechanical PR Interval
    description: >-
      Serial fetal echocardiography from around 16 weeks, measuring the
      Doppler-derived mechanical PR interval, is the surveillance strategy for
      antibody-positive pregnancies. Its purpose is to catch first-degree block
      while it may still be reversible, since complete block is not.
    evidence:
      - reference: PMID:12139139
        reference_title: "Congenital heart block in neonatal lupus: the pediatric cardiologist's perspective."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Serial echocardiographic monitoring of high-risk pregnancies, using
          the mechanical PR interval to identify first degree block, may afford
          the earliest opportunities for therapeutic intervention.
        explanation: >-
          Describes the surveillance modality and the interval measured, and
          states the rationale of catching block early enough to intervene.
      - reference: PMID:12402413
        reference_title: "Neonatal lupus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Serial echocardiograms and obstetric sonograms, performed at least
          every 2 wk starting from the 16 wk gestation, are recommended in
          anti-Ro/SSA positive pregnant women.
        explanation: >-
          Gives the surveillance interval and starting gestational age.
progression:
  - phase: Transient manifestations resolving with maternal antibody clearance
    notes: >-
      The cutaneous, hepatic and haematological manifestations clear by about 6
      months of age, tracking the catabolism of maternal IgG. This is the
      diagnostic signature of a passively acquired disease and the reason these
      features need no immunosuppression.
    evidence:
      - reference: PMID:15234013
        reference_title: "Neonatal lupus erythematosus."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The cutaneous, hematologic, and hepatic abnormalities are transient,
          clearing by 6 months of age. However, CHB is permanent and requires a
          pacemaker in many cases.
        explanation: >-
          States the resolution timeline for the transient manifestations and
          contrasts it with the permanence of heart block, which is the whole
          two-halves structure of this entry.

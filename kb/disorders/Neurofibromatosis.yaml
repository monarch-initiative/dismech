pathophysiology:
- name: Germline Tumor Suppressor Inactivation (First Hit)
  description: >-
    Each neurofibromatosis entity begins with a germline heterozygous
    loss-of-function variant in a Schwann-cell-relevant tumor suppressor — NF1
    (neurofibromin) in NF1, NF2 (merlin) in NF2-related schwannomatosis, and
    SMARCB1 or LZTR1 in schwannomatosis. This germline first hit predisposes the
    Schwann-cell lineage to a somatic second hit that completes biallelic
    inactivation in tumor tissue (two-hit tumor-suppressor mechanism).

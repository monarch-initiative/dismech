    label: neurofibromatosis
description: >-
  Neurofibromatosis is the umbrella grouping of dominantly inherited
  tumor-predisposition syndromes that share a predisposition to nerve-sheath
  tumors and other neurocutaneous features but arise from distinct
  tumor-suppressor loci. Three clinically and genetically distinct entities are
  recognised: neurofibromatosis type 1 (NF1; germline NF1 loss of the RAS-GTPase
  activating protein neurofibromin, producing cafe-au-lait macules,
  neurofibromas, Lisch nodules and optic pathway gliomas); NF2-related
  schwannomatosis (germline NF2 loss of the tumor suppressor merlin, producing
  bilateral vestibular schwannomas, meningiomas and ependymomas); and
  schwannomatosis (germline SMARCB1 or LZTR1 loss, producing multiple
  non-vestibular schwannomas with prominent chronic pain). The unifying
  mechanism is loss of tumor-suppressor function in the Schwann-cell lineage: a
  germline first hit followed by a somatic second hit (two-hit inactivation)
  removes restraint on proliferative signalling — RAS-MAPK downstream of
  neurofibromin in NF1, and Hippo/YAP-TAZ and mitogenic receptor signalling
  downstream of merlin in the schwannoma-predisposing syndromes — driving
  peripheral nerve-sheath tumorigenesis. The three entities were reaffirmed as
  the constituents of the neurofibromatosis/schwannomatosis spectrum by the
  international consensus that revised their diagnostic criteria. This root entry
  organises the umbrella and cross-references the dedicated dismech entries for
  the individual entities (Neurofibromatosis_Type_1, Schwannomatosis) and for the
  constituent tumor types (Neurofibroma, Schwannoma, Acoustic_Neuroma,
  Meningioma); the per-entity entries carry the full pathophysiology, phenotype
  and treatment detail.

  description: >-
    All three constituent entities are inherited in an autosomal dominant manner,
    consistent with heterozygous germline pathogenic variants in a tumor-suppressor
    gene (NF1, NF2, SMARCB1 or LZTR1) followed by a somatic second hit in tumor
    tissue.

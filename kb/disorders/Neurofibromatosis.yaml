      label: protein ubiquitination
  evidence:
  - reference: PMID:18072270
    reference_title: "Evidence of a four-hit mechanism involving SMARCB1 and NF2 in schwannomatosis-associated schwannomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a four-hit mechanism involving the SMARCB1 and NF2 genes may be implicated in schwannomatosis-related tumorigenesis"
    explanation: Establishes the composite four-hit SMARCB1/NF2 mechanism of schwannomatosis tumorigenesis.
  - reference: PMID:24362817
    reference_title: "Germline loss-of-function mutations in LZTR1 predispose to an inherited disorder of multiple schwannomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "schwannomas involved somatic loss of one copy of 22q, encompassing SMARCB1 and NF2, with a different somatic mutation of the other NF2 allele in every schwannoma"
    explanation: Documents the 22q loss co-removing the predisposition gene and one NF2 allele plus a second somatic NF2 mutation.
  downstream:
  - target: Peripheral Nerve Sheath Tumorigenesis
    description: Convergent NF2/merlin loss drives multiple non-vestibular schwannomas.
    causal_link_type: DIRECT
- name: Peripheral Nerve Sheath Tumorigenesis
  description: >-
    All three arms converge on neoplastic proliferation of the Schwann-cell
    lineage within peripheral, spinal and cranial nerves, producing the benign
    nerve-sheath tumors (neurofibromas in NF1; schwannomas in NF2-related disease
    and schwannomatosis) that define the neurofibromatosis spectrum, together with
    associated CNS tumors (meningiomas, ependymomas, optic pathway gliomas).
  cell_types:

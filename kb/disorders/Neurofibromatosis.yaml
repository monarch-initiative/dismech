    explanation: GeneReviews defines schwannomatosis by multiple non-intradermal schwannomas.
- category: Neurologic
  name: Chronic Pain
  subtype: Schwannomatosis
  description: >-
    Chronic, often debilitating pain is the most prominent and most frequently
    presenting feature of schwannomatosis, distinguishing it clinically from
    NF2-related disease.
  phenotype_term:

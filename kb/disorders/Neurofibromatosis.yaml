      label: Ras protein signal transduction
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: regulation of Ras protein signal transduction
    modifier: DECREASED
    term:

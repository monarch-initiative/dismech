  - reference: PMID:29517885
    reference_title: "LZTR1- and SMARCB1-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common presenting feature is localized or diffuse pain or asymptomatic mass."
    explanation: GeneReviews identifies pain as the most common presenting feature of schwannomatosis.
genetic:
- name: NF1 germline pathogenic variant
  subtype: NF1
  gene_term:
    preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  association: >-
    Germline heterozygous loss-of-function variants in NF1 (neurofibromin, a
    RAS-GAP) cause neurofibromatosis type 1.
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant
  evidence:
  - reference: PMID:25877329
    reference_title: "A RASopathy gene commonly mutated in cancer: the neurofibromatosis type 1 tumour suppressor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The NF1 gene encodes a RAS GTPase-activating protein called neurofibromin
      and is one of several genes that (when mutant) affect RAS-MAPK signalling,
      causing related diseases collectively known as RASopathies.
    explanation: Establishes NF1/neurofibromin as the causative gene of NF1.
- name: NF2 germline pathogenic variant
  subtype: NF2
  gene_term:
    preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  association: >-
    Germline loss-of-function variants in NF2 (merlin/schwannomin) cause
    NF2-related schwannomatosis.
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant
  evidence:
  - reference: PMID:40295009
    reference_title: "Pathogenic Variants and Allele Loss of the NF2 and LZTR1 Gene in Sporadic Vestibular Schwannoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants and allele-loss of the NF2 gene with Merlin loss as consequence is the driving genetic event for vestibular schwannoma development."
    explanation: Identifies NF2/merlin loss as the driving genetic event of NF2-related vestibular schwannoma.
  - reference: PMID:20301380
    reference_title: "NF2-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As many as 25% to 50% of individuals with a de novo NF2 pathogenic variant have somatic mosaicism for the variant."
    explanation: >-
      GeneReviews quantifies the high somatic-mosaicism rate among de novo NF2
      variants, which is load-bearing for NF2 genetic counseling and recurrence-risk
      assessment (a mosaic parent's offspring carry a lower-than-50% inheritance risk).
- name: SMARCB1 germline pathogenic variant
  subtype: Schwannomatosis
  gene_term:
    preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  association: >-
    Germline loss-of-function variants in SMARCB1 (a SWI/SNF core subunit) cause
    SMARCB1-related schwannomatosis, with elevated malignancy and meningioma risk.
  relationship_type: CAUSATIVE
  inheritance:

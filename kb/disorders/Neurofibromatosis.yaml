    reference_title: "A RASopathy gene commonly mutated in cancer: the neurofibromatosis type 1 tumour suppressor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The NF1 gene encodes a RAS GTPase-activating protein called neurofibromin
      and is one of several genes that (when mutant) affect RAS-MAPK signalling,
      causing related diseases collectively known as RASopathies.
    explanation: Establishes RAS-MAPK hyperactivation as the central consequence of neurofibromin loss in NF1.
  downstream:
  - target: Peripheral Nerve Sheath Tumorigenesis
    description: RAS-MAPK hyperactivation drives Schwann-cell neurofibroma initiation.
    causal_link_type: DIRECT
- name: Merlin Loss and Hippo Dysregulation
  description: >-
    In NF2-related schwannomatosis, biallelic NF2 inactivation eliminates
    merlin/schwannomin. Merlin normally enforces contact-dependent growth
    inhibition by limiting delivery of growth-factor receptors to the Schwann-cell
    surface and by restraining Hippo/YAP-TAZ-TEAD transcriptional output; its loss
    de-represses mitogenic receptor signalling and YAP/TAZ-driven proliferation.
    The same merlin-loss lesion is the convergent driver of sporadic and
    schwannomatosis-associated schwannomas.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  genes:
  - preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  biological_processes:
  - preferred_term: contact inhibition
    modifier: DECREASED
    term:
      id: GO:0060242
      label: contact inhibition
  evidence:
  - reference: PMID:39941762
    reference_title: "Genetic Alterations in Patients with NF2-Related Schwannomatosis and Sporadic Vestibular Schwannomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic NF2 inactivation primarily drives vestibular schwannoma tumorigenesis."
    explanation: Supports biallelic NF2/merlin loss as the driver of the NF2-related schwannoma.
  - reference: PMID:19029950
    reference_title: "Merlin regulates transmembrane receptor accumulation and signaling at the plasma membrane in primary mouse Schwann cells and in human schwannomas."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "merlin regulates contact inhibition of proliferation by limiting the delivery of several growth factor receptors at the plasma membrane of primary SCs."
    explanation: Defines merlin's contact-dependent receptor-control function whose loss drives schwannoma.
  - reference: PMID:36148553
    reference_title: "Inhibition of YAP/TAZ-driven TEAD activity prevents growth of NF2-null schwannoma and meningioma."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "driven by the TAZ protein in human and mouse NF2-null schwannoma cells"
    explanation: Supports YAP/TAZ-TEAD dependence of NF2-null schwannoma cells downstream of merlin loss.
  downstream:
  - target: Peripheral Nerve Sheath Tumorigenesis
    description: Merlin loss removes contact-dependent restraint, driving neoplastic Schwann-cell proliferation.
    causal_link_type: DIRECT
- name: Composite 22q SMARCB1/LZTR1 and NF2 Inactivation
  description: >-
    Schwannomatosis schwannomas arise through a composite four-hit / three-event
    mechanism: the germline first hit in SMARCB1 or LZTR1, somatic loss of the
    remaining wild-type SMARCB1/LZTR1 allele, and somatic biallelic inactivation
    of NF2. Because SMARCB1, LZTR1 and NF2 all reside on chromosome 22q, a single
    somatic 22q loss can co-remove the predisposition-gene allele and one NF2
    allele, leaving a second somatic NF2 mutation to eliminate merlin — so this
    arm converges on the same merlin-loss effector as NF2-related disease.
  cell_types:

  evidence:
  - reference: PMID:24362817
    reference_title: "Germline loss-of-function mutations in LZTR1 predispose to an inherited disorder of multiple schwannomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Constitutional SMARCB1 mutations at 22q11.23 have been found in ∼50% of familial and <10% of sporadic schwannomatosis cases."
    explanation: Quantifies the germline SMARCB1 contribution to schwannomatosis.
- name: LZTR1 germline pathogenic variant
  subtype: Schwannomatosis
  gene_term:
    preferred_term: LZTR1
    term:
      id: hgnc:6742
      label: LZTR1
  association: >-
    Germline loss-of-function variants in LZTR1 (a CUL3 ubiquitin-ligase substrate
    adaptor) cause LZTR1-related schwannomatosis.
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant
    penetrance: INCOMPLETE
  evidence:
  - reference: PMID:24362817
    reference_title: "Germline loss-of-function mutations in LZTR1 predispose to an inherited disorder of multiple schwannomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings identify LZTR1 as a gene predisposing to an autosomal dominant inherited disorder of multiple schwannomas in ∼80% of 22q-related schwannomatosis cases lacking mutation in SMARCB1."
    explanation: Identifies germline LZTR1 loss of function as the predisposing event in most SMARCB1-negative schwannomatosis.
prevalence:
- subtype: NF1
  population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 31.6
  rate_low: 21.2
  rate_high: 46.9
  notes: >-
    Pooled NF1 point prevalence 1 in 3,164 (3.16 per 10,000) from a 2023
    systematic review and meta-analysis; higher in screening studies (1 in
    2,020) than in medical-record studies (1 in 4,329), consistent with clinical
    under-recognition. NF1 is one of the most common autosomal dominant
    disorders.
  evidence:
  - reference: PMID:37710322
    reference_title: "Incidence and prevalence of neurofibromatosis type 1 and 2: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "prevalence was 1 in 3,164 (95%CI: 1 in 2,132-1 in 4,712)"
    explanation: Pooled worldwide NF1 point-prevalence estimate from the 2023 meta-analysis.
- subtype: NF1
  population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 37.6
  rate_low: 27.8
  rate_high: 50.8
  notes: Pooled NF1 birth incidence 1 in 2,662 (3.76 per 10,000 live births).
  evidence:
  - reference: PMID:37710322
    reference_title: "Incidence and prevalence of neurofibromatosis type 1 and 2: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NF1 pooled birth incidence was 1 in 2,662"
    explanation: Pooled NF1 birth-incidence estimate from the 2023 meta-analysis.
- subtype: NF2
  population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.16
  notes: >-
    NF2-related schwannomatosis is much rarer than NF1; pooled birth incidence
    1.08 per 50,000 births (about 1 in 46,000). Prevalence data remain sparse
    (only two studies), so pooled prevalence was not reported.
  evidence:
  - reference: PMID:37710322
    reference_title: "Incidence and prevalence of neurofibromatosis type 1 and 2: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pooled NF2 birth incidence was 1.08 per 50,000 births"
    explanation: Pooled NF2 birth-incidence estimate from the 2023 meta-analysis.
treatments:
- name: Microsurgical Resection
  description: >-
    Surgical removal of symptomatic or growing nerve-sheath tumors (neurofibromas,
    schwannomas, vestibular schwannomas) is a mainstay across the neurofibromatosis
    spectrum.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:29517885
    reference_title: "LZTR1- and SMARCB1-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "surgery for schwannomas associated with uncontrolled localized pain or a neurologic deficit"
    explanation: GeneReviews supports surgical resection for symptomatic schwannomas.
- name: MEK Inhibitor Therapy (Selumetinib)
  description: >-
    Oral MEK1/2 inhibitor selumetinib suppresses the RAS-RAF-MEK-ERK signalling
    driven by neurofibromin loss and is approved for symptomatic, inoperable
    NF1-associated plexiform neurofibromas.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: selumetinib
      term:
        id: CHEBI:90227
        label: selumetinib
  target_mechanisms:
  - target: Neurofibromin Loss and RAS-MAPK Hyperactivation
    treatment_effect: INHIBITS
    description: Selumetinib inhibits MEK1/2, blocking the constitutively active MAPK cascade downstream of NF1 loss.
  target_phenotypes:
  - preferred_term: Plexiform neurofibroma
    term:
      id: HP:0009732
      label: Plexiform neurofibroma
  evidence:
  - reference: PMID:33395032
    reference_title: "MEK inhibitors in RASopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phase 2 trial (SPRINT) of selumetinib in pNF resulted in at least 20%
      reduction in the size of pNF from baseline in 71% of patients and was
      associated with clinically meaningful improvements.
    explanation: Documents MEK-inhibitor (selumetinib) efficacy against NF1 plexiform neurofibromas.
- name: MRI Surveillance
  description: >-
    Periodic neurologic examination and brain/spine or whole-body MRI surveillance
    are recommended to monitor tumor burden across the neurofibromatosis spectrum.
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:29517885
    reference_title: "LZTR1- and SMARCB1-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual neurologic examination and pain assessment; brain and spine MRI or whole-body MRI every two to three years beginning at age 12 years"
    explanation: GeneReviews supports surveillance imaging and neurologic monitoring for schwannomatosis.
  - reference: PMID:20301380
    reference_title: "NF2-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "annual brain MRI beginning at approximately age ten to 12 years and continuing until at least the fourth decade of life"
    explanation: NF2 GeneReviews recommends annual brain MRI surveillance for NF2-related schwannomatosis.
  - reference: PMID:20301380
    reference_title: "NF2-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "annual hearing evaluation, including BAER testing"
    explanation: NF2 GeneReviews recommends annual hearing evaluation with BAER testing.
- name: Multimodal Pain Management
  description: >-
    Because chronic pain dominates schwannomatosis, a comprehensive multimodal
    approach to pain management guided by a pain specialist or neurologist is
    recommended.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_phenotypes:
  - preferred_term: Chronic pain
    term:
      id: HP:0012532
      label: Chronic pain
  evidence:
  - reference: PMID:29517885
    reference_title: "LZTR1- and SMARCB1-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive, multimodal approach to pain management, guided by a pain management specialist or neurologist"
    explanation: GeneReviews supports multimodal pain management for schwannomatosis.
- name: Bevacizumab (Anti-VEGF Therapy)
  description: >-
    The anti-VEGF monoclonal antibody bevacizumab is a targeted therapy for
    rapidly growing NF2-related vestibular schwannomas, and has shown clinical
    benefit in some individuals with NF2-associated ependymoma.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bevacizumab
      term:
        id: NCIT:C2039
        label: Bevacizumab
  target_phenotypes:
  - preferred_term: Vestibular schwannoma
    term:
      id: HP:0009588
      label: Vestibular schwannoma
  evidence:
  - reference: PMID:20301380
    reference_title: "NF2-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The VEGF antibody bevacizumab for rapidly growing vestibular schwannomas; bevacizumab has also shown some clinical benefit in some individuals with ependymoma."
    explanation: NF2 GeneReviews lists bevacizumab as targeted therapy for rapidly growing vestibular schwannomas and NF2-associated ependymoma.
- name: Stereotactic Radiosurgery
  description: >-
    Stereotactic radiosurgery, most commonly gamma knife, is an alternative to
    microsurgery for NF2-related vestibular schwannomas. Conventional radiation
    therapy of NF2-associated tumors is otherwise avoided, especially in
    childhood, because of the substantially higher malignancy risk in NF2.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Stereotactic Radiosurgery
    term:
      id: NCIT:C15358
      label: Stereotactic Radiosurgery
  target_phenotypes:
  - preferred_term: Vestibular schwannoma
    term:
      id: HP:0009588
      label: Vestibular schwannoma
  evidence:
  - reference: PMID:20301380
    reference_title: "NF2-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "stereotactic radiosurgery, most commonly with the gamma knife, may be an alternative to surgery"
    explanation: NF2 GeneReviews supports stereotactic radiosurgery (gamma knife) as an alternative to surgery for vestibular schwannoma.
  - reference: PMID:20301380
    reference_title: "NF2-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiation therapy of NF2-associated tumors, especially in childhood, when malignancy risks are likely to be substantially higher."
    explanation: NF2 GeneReviews advises avoiding radiation therapy of NF2-associated tumors, especially in childhood, due to higher malignancy risk.
diagnosis:
- name: NF1 clinical and molecular diagnostic criteria
  description: >-
    NF1 is diagnosed by consensus clinical criteria (two or more characteristic
    features) or by one characteristic feature plus a heterozygous NF1 pathogenic
    variant. The diagnostic criteria for NF1 were revised by international
    consensus to incorporate genetic testing and to differentiate NF1 from Legius
    syndrome.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301288
    reference_title: "Neurofibromatosis 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of NF1 is established in a proband with two or more of the characteristic clinical features or one characteristic clinical feature and a heterozygous NF1 pathogenic variant."
    explanation: NF1 GeneReviews states the clinical-plus-molecular diagnostic criteria for NF1.
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reached consensus on the minimal clinical and genetic criteria for diagnosing and differentiating NF1 and LGSS"
    explanation: The international consensus revised the minimal clinical and genetic diagnostic criteria for NF1 (and Legius syndrome).
- name: NF2 diagnostic criteria
  description: >-
    NF2-related schwannomatosis is diagnosed by bilateral vestibular schwannomas,
    by an identical NF2 pathogenic variant in two or more anatomically distinct
    NF2-related tumors, or by a combination of clinical and molecular criteria
    meeting the consensus diagnostic criteria.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301380
    reference_title: "NF2-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of NF2 is established in a proband with bilateral vestibular schwannomas, an identical NF2 pathogenic variant identified in two or more anatomically distinct NF2-related tumors, or a combination of clinical and molecular criteria that fulfill the consensus diagnostic criteria."
    explanation: NF2 GeneReviews states the clinical-plus-molecular diagnostic criteria for NF2-related schwannomatosis.
- name: Schwannomatosis diagnostic criteria
  description: >-
    LZTR1- or SMARCB1-related schwannomatosis is diagnosed by characteristic
    clinical findings together with a heterozygous germline pathogenic variant in
    LZTR1 or SMARCB1 identified by molecular genetic testing.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29517885
    reference_title: "LZTR1- and SMARCB1-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of LZTR1- or SMARCB1-related schwannomatosis is established in a proband with characteristic clinical findings and a heterozygous germline pathogenic variant in LZTR1 or SMARCB1 identified by molecular genetic testing."
    explanation: Schwannomatosis GeneReviews states the clinical-plus-molecular diagnostic criteria for SMARCB1/LZTR1-related schwannomatosis.

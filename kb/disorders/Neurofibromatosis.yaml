    explanation: NF1 GeneReviews establishes the heterozygous germline (autosomal dominant) first hit in the NF1 tumor suppressor.
  - reference: PMID:18072270
    reference_title: "Evidence of a four-hit mechanism involving SMARCB1 and NF2 in schwannomatosis-associated schwannomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel germline SMARCB1 mutation was found in one patient; inactivating somatic mutations of NF2, associated with loss of heterozygosity (LOH) of 22q, were found in two schwannomas of this patient."
    explanation: Documents the germline first hit followed by a somatic second hit completing biallelic tumor-suppressor inactivation in tumor tissue.
  downstream:
  - target: Neurofibromin Loss and RAS-MAPK Hyperactivation
    description: NF1 loss removes RAS-GAP restraint, hyperactivating RAS-MAPK signalling.
    causal_link_type: DIRECT
  - target: Merlin Loss and Hippo Dysregulation
    description: NF2 loss eliminates merlin, de-repressing mitogenic and Hippo/YAP-TAZ signalling.
    causal_link_type: DIRECT
  - target: Composite 22q SMARCB1/LZTR1 and NF2 Inactivation
    description: Germline SMARCB1/LZTR1 loss cooperates with somatic 22q loss and NF2 inactivation in schwannomatosis.
    causal_link_type: DIRECT
- name: Neurofibromin Loss and RAS-MAPK Hyperactivation
  description: >-
    In NF1, loss of neurofibromin removes its RAS-GTPase-activating function, so
    RAS-GTP accumulates and constitutively activates the RAS-RAF-MEK-ERK cascade.
    This is the central biochemical driver of the NF1 arm, initiating
    Schwann-cell neurofibroma formation and the other NF1 tissue phenotypes, and
    is the molecular target of MEK1/2 inhibitors such as selumetinib.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell

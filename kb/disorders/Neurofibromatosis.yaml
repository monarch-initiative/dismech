  phenotype_term:
    preferred_term: Meningioma
    term:
      id: HP:0002858
      label: Meningioma
  evidence:
  - reference: PMID:20301380
    reference_title: "NF2-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "schwannomas of other cranial and peripheral nerves, meningiomas, ependymomas"
    explanation: >-
      GeneReviews lists meningiomas among the characteristic CNS tumors that
      affected individuals with NF2-related schwannomatosis may develop.
  - reference: PMID:29517885
    reference_title: "LZTR1- and SMARCB1-Related Schwannomatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meningiomas have only been reported in individuals with SMARCB1-related schwannomatosis."
    explanation: >-
      GeneReviews supports meningioma occurrence being restricted to
      SMARCB1-related schwannomatosis among the schwannomatoses.
- category: Neoplastic
  name: Multiple Non-Vestibular Schwannomas
  subtype: Schwannomatosis
  description: >-
    Multiple benign non-intradermal schwannomas of peripheral, spinal and cranial
    nerves, characteristically sparing the vestibular nerves; the defining feature
    of SMARCB1/LZTR1-related schwannomatosis.
  phenotype_term:
    preferred_term: Schwannoma
    term:

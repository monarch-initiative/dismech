  description: >-
    Neurofibromatosis type 1, caused by germline heterozygous loss-of-function
    variants in the NF1 tumor suppressor encoding neurofibromin, a RAS-GTPase
    activating protein. Characterised by multiple cafe-au-lait macules, skinfold
    freckling, cutaneous and plexiform neurofibromas, iris Lisch nodules, optic
    pathway gliomas and an elevated risk of malignant peripheral nerve sheath
    tumor. See the dedicated Neurofibromatosis_Type_1 dismech entry for full
    detail.

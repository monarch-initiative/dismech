- name: Randomised Left-Right Body Asymmetry
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Immotile monocilia at the embryonic left-right organiser cannot generate the
    directional flow that breaks symmetry, so laterality is left to chance:
    roughly half of PCD patients have situs inversus, and the rest situs solitus,
    with a minority having heterotaxy and its associated cardiac malformations.
    This branch of the pathograph is developmental and complete before birth - it
    is the one part of PCD that no postnatal treatment can address.
  biological_processes:

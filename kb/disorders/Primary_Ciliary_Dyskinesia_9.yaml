  downstream:
  - target: Motile Ciliary Beat Failure
    causal_link_type: DIRECT
- name: Motile Ciliary Beat Failure
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Cilia that are built but cannot beat. The outer arms generate the bulk of the
    interdoublet sliding force, so their absence is sufficient to explain the
    motility failure without a second lesion. The same axonemal machinery drives
    three anatomically separate systems - airway cilia, the motile monocilia of
    the embryonic left-right organiser, and the sperm flagellum - which is why one
    molecular defect produces a phenotype spread across the lung, body situs and
    fertility.

genetic:
- name: DNAI2
  gene_term:
    preferred_term: DNAI2
    term:
      id: hgnc:18744
      label: DNAI2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The only gene implicated in CILD9. It encodes an outer dynein arm
    intermediate chain, the human relative of Chlamydomonas IC69, and was
    identified as a PCD candidate on that comparative basis. Four alleles are
    reported: a canonical splice-donor variant IVS11+1G>A, a nonsense variant
    c.787C>T, a splice-acceptor variant IVS3-3T>G producing out-of-frame
    transcripts, and a 6.9 kb intragenic microdeletion.

    All four are loss of function and none is missense, which is a real
    limitation for variant interpretation: a laboratory encountering a novel
    DNAI2 missense change has no comparable reported allele to reason from.
  evidence:
  - reference: PMID:18950741
    reference_title: "DNAI2 mutations cause primary ciliary dyskinesia with defects in the outer dynein arm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Applying a positional and functional candidate-gene approach, we identified
      homozygous loss-of-function DNAI2 mutations
    explanation: >-
      The gene-disease association and how it was established.
  - reference: PMID:18950741
    reference_title: "DNAI2 mutations cause primary ciliary dyskinesia with defects in the outer dynein arm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of protein expression of the ODA intermediate chain DNAI2 showed
      sublocalization throughout respiratory cilia.
    explanation: >-
      Where the protein sits in a normal cilium - along its whole length, which
      is why its loss affects proximal and distal outer arms alike.
diagnosis:
- name: Transmission Electron Microscopy of Respiratory Cilia
  description: >-
    Ultrastructural assessment assigns the patient to a defect class. In DNAI2
    disease it shows outer dynein arm defects, which narrows the genetic
    differential to the outer-arm and outer-arm-docking genes and also carries
    prognostic information, since the ODA class has milder airway disease than the
    inner-arm and microtubular-disorganisation classes.

    What it cannot do is name DNAI2: every gene in the outer-arm group produces
    the same picture, so the diagnosis is completed by sequencing.
  evidence:
  - reference: PMID:33167880
    reference_title: "A novel genetic variant in DNAI2 detected by custom gene panel in a newborn with Primary Ciliary Dyskinesia: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transmission Electron Microscopy (TEM) and molecular tests, such as a Next
      generation Sequencing panel and a custom array CGH, were performed for
      diagnosis of PCD.
    explanation: >-
      The two-stage diagnostic pathway as applied in a reported DNAI2 patient.
- name: Nasal Nitric Oxide Measurement and High-Speed Videomicroscopy
  description: >-
    The two tests that come before the electron microscope. Nasal nitric oxide is
    the screening measurement and high-speed videomicroscopy assesses beat
    pattern and frequency directly; neither identifies a gene, and neither is a
    gold standard on its own - PCD diagnosis rests on a combination of tests.
  evidence:
  - reference: PMID:38891105
    reference_title: "Primary Ciliary Dyskinesia: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis relies on a combination of tests for confirmation, including
      nasal nitric oxide (nNO) measurements, high-speed videomicroscopy analysis
      (HSVMA), immunofluorescent staining, axonemal ultrastructure analysis via
      transmission electron microscopy (TEM), and genetic testing. Notably, there
      is no single gold standard confirmatory or exclusionary test.
    explanation: >-
      The diagnostic panel and the explicit statement that no single test is
      definitive. Graded OTHER because it is a review's summary of practice.
- name: Immunofluorescence Staining of Respiratory Cilia
  description: >-
    The test that comes closest to naming this genotype before sequencing, and
    the reason it is curated separately from electron microscopy. In DNAI2
    disease immunofluorescence shows DNAI2 absent from the axoneme together with
    both outer-arm heavy chains, DNAH5 and DNAH9 - a whole-length outer-arm
    picture. DNAI1 disease loses DNAI2 only distally, and DNAH11 disease has
    normal ultrastructure with a partial outer-arm reduction confined to the
    proximal region that conventional electron microscopy misses entirely.

    So immunofluorescence resolves distinctions the ultrastructure alone does
    not. It still does not complete the diagnosis: sequencing does.
  evidence:
  - reference: PMID:18950741
    reference_title: "DNAI2 mutations cause primary ciliary dyskinesia with defects in the outer dynein arm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we demonstrated complete or distal absence of DNAI2 from
      ciliary axonemes in respiratory cells of patients with mutations in genes
      encoding the ODA chains DNAH5 and DNAI1, respectively.
    explanation: >-
      The immunofluorescence patterns that separate DNAI2, DNAH5 and DNAI1
      disease from one another.
  - reference: PMID:26909801
    reference_title: "DNAH11 Localization in the Proximal Region of Respiratory Cilia Defines Distinct Outer Dynein Arm Complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNAH11 mutations result in a subtle ODA defect in only the proximal region
      of respiratory cilia, which is detectable by IFM and TEM tomography.
    explanation: >-
      Why immunofluorescence is not redundant with electron microscopy: it
      detects an outer-arm defect that conventional TEM reports as normal.
- name: Targeted Sequencing and Copy-Number Analysis
  description: >-
    Panel sequencing is what identifies the gene. Copy-number analysis is worth
    naming separately here rather than assumed: one of the four reported DNAI2
    alleles is a 6.9 kb intragenic deletion, found by array CGH, which
    short-read panel sequencing alone can miss. A negative panel in a patient
    with outer dynein arm defects is therefore not a negative DNAI2 result.
  evidence:
  - reference: PMID:33167880
    reference_title: "A novel genetic variant in DNAI2 detected by custom gene panel in a newborn with Primary Ciliary Dyskinesia: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      molecular analyses detected a novel 6,9 kb microdeletion in DNAI2 gene
    explanation: >-
      The structural allele, and the reason copy-number analysis is called out
      separately from sequencing.
animal_models:
- name: medaka jaodori (joi) dnai2 mutant
  species: Japanese medaka
  genotype: dnai2 disrupted by Tol1 transposon insertion (jaodori allele)
  publication: PMID:20709053
  description: >-
    A forward-genetic medaka mutant in which a Tol1 transposon insertion disrupts
    dnai2. Kupffer's vesicle - the fish equivalent of the mouse node for
    left-right specification - generates cilia normally but they do not beat, and
    ultrastructure shows severe reduction of the outer dynein arms. That is the
    same lesion as the human disease, in the same order: arms lost, motility
    lost, laterality randomised.

    One finding limits how far the model transfers, and it is the model's own:
    medaka has a second dnai2 gene, and the two act redundantly in some ciliated
    tissues and distinctly in others. Humans have one. A tissue-by-tissue
    comparison of which cilia are affected therefore cannot be carried across,
    even though the core mechanism can.
  modeled_mechanisms:
  - target: Absence of Outer Dynein Arms from the Axoneme
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Severe outer dynein arm reduction in Kupffer's vesicle cilia, from
      disruption of the orthologous gene.
    limitations: >-
      Measured in Kupffer's vesicle rather than respiratory epithelium, and the
      medaka genome carries a second dnai2 whose redundancy has no human
      counterpart.
    readouts:
    - name: Outer dynein arm content of Kupffer's vesicle cilia
      target: Absence of Outer Dynein Arms from the Axoneme
      direction: DECREASED
      interpretation: >-
        The ultrastructural correlate of the human outer-arm loss, in the organ
        where this model's laterality phenotype arises.
      evidence:
      - reference: PMID:20709053
        reference_title: "Characterization of the medaka (Oryzias latipes) primary ciliary dyskinesia mutant, jaodori: Redundant and distinct roles of dynein axonemal intermediate chain 2 (dnai2) in motile cilia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ultrastructural analysis revealed severe reduction in the outer dynein
          arms in KV cilia of joi mutants.
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:20709053
      reference_title: "Characterization of the medaka (Oryzias latipes) primary ciliary dyskinesia mutant, jaodori: Redundant and distinct roles of dynein axonemal intermediate chain 2 (dnai2) in motile cilia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Positional cloning showed that axonemal dynein intermediate chain 2
        (dnai2) is responsible for joi.
      explanation: >-
        Establishes that the model's lesion is in the orthologue of the human
        disease gene, which is what makes it informative for this node.
  - target: Randomised Left-Right Body Asymmetry
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cilia in Kupffer's vesicle are generated but immotile, and laterality is
      disrupted - the same causal order as the human node.
    limitations: >-
      Kupffer's vesicle is functionally equivalent to the mouse node for
      left-right specification but is not the same structure, and the second
      medaka dnai2 gene has no human counterpart.
    readouts:
    - name: Left-right axis specification
      target: Randomised Left-Right Body Asymmetry
      direction: ALTERED
      interpretation: >-
        Laterality defect arising from immotile nodal-equivalent cilia.
      evidence:
      - reference: PMID:20709053
        reference_title: "Characterization of the medaka (Oryzias latipes) primary ciliary dyskinesia mutant, jaodori: Redundant and distinct roles of dynein axonemal intermediate chain 2 (dnai2) in motile cilia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          cilia in Kupffer's vesicle (KV), an organ functionally equivalent to
          the mouse node in terms of left-right (LR) specification, are generated
          but their motility is disrupted, resulting in a LR defect
        explanation: >-
          The full observation: cilia present, motility absent, laterality
          disrupted.
  evidence:
  - reference: PMID:20709053
    reference_title: "Characterization of the medaka (Oryzias latipes) primary ciliary dyskinesia mutant, jaodori: Redundant and distinct roles of dynein axonemal intermediate chain 2 (dnai2) in motile cilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also found the other dnai2 gene in the medaka genome. These two dnai2
      genes function either redundantly or distinctly in tissues possessing
      motile cilia.
    explanation: >-
      The gene-dosage difference between medaka and humans. Graded PARTIAL
      because it qualifies the model's informativeness rather than supporting it.
treatments:
- name: Airway Clearance and Chronic Infection Management
  description: >-
    There is no treatment for the ciliary defect. Management is the supportive
    airway care used across primary ciliary dyskinesia - physiotherapy and
    airway clearance, antibiotics for exacerbations and chronic infection,
    surveillance of lung function and structure - and nothing in it is
    DNAI2-specific.

    Curated as a single scoping entry rather than an itemised regimen, and the
    reason is recorded rather than left implicit: no trial has enrolled by
    genotype, and the umbrella entry Primary_Ciliary_Dyskinesia holds the
    detailed management block. Duplicating it here would create two places to
    maintain the same evidence and imply a genotype-specific practice that does
    not exist. What is DNAI2-specific is prognostic rather than therapeutic -
    outer dynein arm defects carry milder airway disease than the inner-arm and
    microtubular-disorganisation classes - and that is curated on the airway
    damage node.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Mucociliary Clearance Failure
    description: >-
      Airway clearance techniques substitute mechanically for the mucociliary
      transport the cilia cannot provide. They do not restore ciliary function.
  - target: Chronic Airway Infection and Progressive Airway Damage
    description: >-
      Antibiotics suppress the chronic infection that drives the structural
      damage.
  evidence:
  - reference: PMID:38891105
    reference_title: "Primary Ciliary Dyskinesia: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Primary ciliary dyskinesia (PCD) is a rare, genetically heterogeneous,
      motile ciliopathy, characterized by neonatal respiratory distress,
      recurrent upper and lower respiratory tract infections, subfertility, and
      laterality defects.
    explanation: >-
      The clinical problem management addresses. Graded OTHER because this review
      states the disease definition rather than reporting treatment outcomes -
      which is itself the point: no genotype-stratified treatment evidence exists
      to cite here.
differential_diagnoses:
- name: Other outer dynein arm and ODA-docking deficiencies
  description: >-
    DNAI1, DNAH5, DNAH9, and the outer dynein arm docking complex genes ODAD1 to
    ODAD4 all produce outer dynein arm defects on electron microscopy, so
    ultrastructure alone cannot separate them from DNAI2 disease.
    Immunofluorescence narrows it further - DNAI2 loss removes DNAI2 plus both
    outer-arm heavy chains along the whole axoneme, DNAI1 loss removes DNAI2 only
    distally - but sequencing is what completes the diagnosis.
  evidence:
  - reference: PMID:18950741
    reference_title: "DNAI2 mutations cause primary ciliary dyskinesia with defects in the outer dynein arm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, DNAI2 and DNAH5 mutations affect assembly of proximal and distal ODA
      complexes, whereas DNAI1 mutations mainly disrupt assembly of proximal ODA
      complexes.
    explanation: >-
      The distinction available between these genotypes, and its limit.
- name: DNAH11 disease and other normal-ultrastructure PCD
  description: >-
    Roughly 30 per cent of PCD has normal ciliary ultrastructure, so a normal
    electron microscopy result does not exclude PCD and does not point away from
    an outer-arm gene. DNAH11 is the common cause: it encodes an outer-arm
    protein and produces a partial outer-arm reduction confined to the proximal
    cilium, detectable by immunofluorescence and TEM tomography but not by
    conventional TEM.
  evidence:
  - reference: PMID:26909801
    reference_title: "DNAH11 Localization in the Proximal Region of Respiratory Cilia Defines Distinct Outer Dynein Arm Complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conventional transmission electron microscopy (TEM) is a diagnostic
      standard to identify ultrastructural defects in respiratory cilia but is
      not useful in approximately 30% of PCD cases, which have normal ciliary
      ultrastructure.
    explanation: >-
      The size of the normal-ultrastructure group, which is what makes this a
      differential rather than a footnote.
discussions:
- discussion_id: cild9_no_genotype_specific_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does DNAI2 disease follow the same course as the outer dynein arm class as a
    whole, or does it differ within that class?
  attaches_to:
  - "pathophysiology#Chronic Airway Infection and Progressive Airway Damage"
  - "prevalence#Unrelated PCD families screened for DNAI2"
  rationale: >-
    Every prognostic statement in this entry is borrowed. The two multicentre
    paediatric cohorts that establish the milder airway phenotype of outer dynein
    arm defects report results by ultrastructural class and by the commoner
    genotypes; neither breaks out DNAI2, and with two families found in 105
    screened there would not be enough patients to. The neonatal
    respiratory-distress analysis does resolve genotypes within the ODA class -
    it separates DNAH5 by variant type and DNAH11 from the rest - which shows
    the question is answerable in principle and simply has not been asked of
    DNAI2.

    This matters more here than it would for a commoner gene, because DNAI2 is
    the intermediate chain whose loss removes both proximal and distal outer
    arms, where DNAI1 loss mainly removes the proximal ones. If the extent of
    outer-arm loss along the cilium affects clearance quantitatively, DNAI2 and
    DNAI1 patients should not have identical airway courses - and nobody has
    looked.
  proposed_experiments:
  - experiment_id: cild9_registry_ODA_subgenotype_comparison
    name: Registry comparison of airway outcomes across outer-arm genotypes
    description: >-
      Pool DNAI2, DNAI1, DNAH5 and DNAH9 patients from international PCD
      registries and compare FEV1 trajectory and CT disease scores, stratified by
      whether the genotype removes outer arms along the whole axoneme or
      proximally only.
    would_support:
    - "pathophysiology#Outer Dynein Arm Assembly Failure"
    supporting_outcome:
    - >-
      Genotypes removing outer arms along the whole cilium (DNAI2, DNAH5) show
      worse lung-function trajectories than those removing proximal complexes
      only (DNAI1).
    refuting_outcome:
    - >-
      Airway outcomes are indistinguishable across outer-arm genotypes,
      indicating that any residual outer-arm complement is functionally
      irrelevant once beat is lost.
- discussion_id: cild9_dnai2_hydrocephalus_single_case
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is DNAI2 variation a genuine risk factor for hydrocephalus, or is the single
    reported co-occurrence chance?
  attaches_to:
  - "phenotypes#Hydrocephalus"
  rationale: >-
    The case report proposing DNAI2 as a new genetic risk factor for
    normal-pressure hydrocephalus is a single patient. The mechanism is plausible
    - ependymal motile cilia use the same outer dynein arms, and hydrocephalus is
    a documented if uncommon complication of PCD generally, and a recurrent
    phenotype of mouse motile-ciliopathy nulls. But a single co-occurrence in a
    disease with fewer than a dozen reported patients cannot distinguish a
    genotype-specific risk from the background rate in PCD.

    Recorded here rather than promoted into the pathophysiology chain, and the
    phenotype is graded VERY_RARE with the reasoning attached, so that a future
    reader does not mistake one case report for an established genotype-phenotype
    correlation.
  proposed_experiments:
  - experiment_id: cild9_neuroimaging_survey
    name: Systematic neuroimaging in reported DNAI2 patients
    description: >-
      Review or obtain cranial imaging in all reported DNAI2 patients and compare
      ventricular size against a matched PCD cohort of other genotypes.
    would_support:
    - "phenotypes#Hydrocephalus"
    supporting_outcome:
    - >-
      Ventriculomegaly is more frequent in DNAI2 patients than in genotype-matched
      PCD controls.
    refuting_outcome:
    - >-
      Ventricular size in DNAI2 patients is indistinguishable from other PCD
      genotypes, making the reported case a coincidence.
notes: >-
  Curated from a Perplexity deep-research report plus independent PubMed
  searching. The report supplied narrative framing only: it carried three
  citations in total, and its term-validation section reported 20 of 49 checked
  labels mismatched - including HP:0005938 offered as "primary ciliary
  dyskinesia" when HPO calls it "Abnormal respiratory motile cilium morphology",
  and HP:0011107 offered as "chronic cough" when HPO calls it "Recurrent
  aphthous stomatitis". No CURIE was taken from it. Every binding here was
  resolved against the committed term caches, several by reuse from the sibling
  entry Primary_Ciliary_Dyskinesia_30.

  Orphanet's record for primary ciliary dyskinesia (ORPHA:244) is used as the
  frequency backbone for the otologic phenotypes, as the sibling entry
  Primary_Ciliary_Dyskinesia_30 does. One disagreement is reconciled explicitly
  rather than silently: Orphanet grades Bronchiectasis Occasional (29-5%) while
  this entry curates it FREQUENT on the strength of the prospective paediatric
  CT cohort, and both records are carried on that phenotype.

  The GeneReviews PCD chapter (PMID:20301301) is cited in `references` as the
  expert baseline for the disease class. Its PubMed record is a scope statement
  rather than a clinical abstract, so it carries no quotable phenotype text and
  is not used as an evidence source for individual phenotypes here; the
  phenotype frequencies come from the prospective multicentre cohorts instead.

- name: Chronic Airway Infection and Progressive Airway Damage
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Retained secretions, recurrent infection, neutrophilic inflammation and
    progressive structural destruction - bronchial wall thickening, mucus
    plugging, then bronchiectasis. In the multicentre paediatric cohorts the
    severity of this endpoint tracks the ultrastructural class rather than being
    uniform across PCD: children with outer dynein arm defects have better
    spirometry, fewer bronchiectatic lobes and less disease on CT than children
    with inner-arm and microtubular-disorganisation defects.

    Those cohorts classify by ultrastructure and genotype together and are not
    broken down to DNAI2. So the favourable comparison applies to this entity by
    class membership, which is a weaker claim than a DNAI2-specific one and is
    curated as such.

- name: Impaired Sperm Flagellar Propulsion
  biological_scale: CELLULAR
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The sperm flagellum is an axoneme of the same construction, and DNAI2 is
    highly expressed in testis. Reduced male fertility follows from the same
    outer-arm loss. Note the asymmetry with the female side, where subfertility in
    PCD arises from oviductal ciliary transport rather than from a gamete defect -
    that mechanism is not curated here because no DNAI2 data address it.
  biological_processes:

    reference_title: "Clinical features of childhood primary ciliary dyskinesia by genotype and ultrastructural phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median FEV1 was worse in the IDA/CA/MTD group (72% predicted) versus the
      combined ODA groups (92% predicted; P = 0.003).
    explanation: >-
      The lung-function difference by ultrastructural class, in 118 children.
  - reference: PMID:36442147
    reference_title: "Airway Disease in Children with Primary Ciliary Dyskinesia: Impact of Ciliary Ultrastructure Defect and Genotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with IDA/MTD defects had significantly greater airway disease on
      CT, primarily mucus plugging, compared with children with ODA defects.
    explanation: >-

- name: Mucociliary Clearance Failure
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Without a co-ordinated beat the airway surface cannot move its mucus layer,
    so inhaled particles and bacteria are retained. This is the step that converts
    a molecular motor defect into a chronic infective disease, and it is shared
    with every other PCD genotype.

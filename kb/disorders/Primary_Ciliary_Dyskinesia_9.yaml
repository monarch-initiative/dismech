    PCD and is the feature that most reliably prompts early testing. It is
    reported in about two-thirds of PCD patients overall. In the genotype
    breakdown the outer dynein arm group was the reference category and had a
    higher rate than DNAH11, so this phenotype is expected rather than incidental
    in a DNAI2 patient - though no DNAI2-specific rate has been published.

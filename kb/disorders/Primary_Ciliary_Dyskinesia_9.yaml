    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The complex PCD phenotype results from dysfunction of cilia of the airways
      and the embryonic node and the structurally related motile sperm flagella.
    explanation: >-
      The three axonemal systems one defect reaches. Graded OTHER because it is
      the paper's framing of PCD as a class rather than a DNAI2-specific finding.
  downstream:

name: Primary Ciliary Dyskinesia 9
creation_date: "2026-08-29T06:00:00Z"
category: Genetic
disease_term:
  preferred_term: Primary ciliary dyskinesia 9
  term:
    id: MONDO:0012906
    label: primary ciliary dyskinesia 9
description: >-
  Primary ciliary dyskinesia 9 (CILD9) is the form of PCD caused by biallelic
  loss-of-function variants in DNAI2, which encodes an intermediate chain of the
  axonemal outer dynein arm - the human counterpart of Chlamydomonas IC69. The
  outer dynein arms generate most of the sliding force between axonemal
  doublets, so losing an intermediate chain that the complex needs in order to
  assemble leaves a structurally complete cilium with no motor on it.

  Two things about this gene distinguish it from its neighbours in the same
  pathway, and both come from the study that identified it. First, DNAI2 loss
  removes the outer-arm heavy chains DNAH5 *and* DNAH9 from the axoneme, so the
  defect covers the whole length of the cilium: outer dynein arms exist as
  proximal and distal complexes with different heavy-chain composition, and
  DNAI2 - like DNAH5, and unlike DNAI1 - is required for both. Second, DNAI2 is
  itself lost or mislocalised in patients with DNAH5 and DNAI1 mutations, which
  is what places it inside the assembly hierarchy rather than beside it.

  Clinically this is ordinary PCD: neonatal respiratory distress, lifelong wet
  cough and nasal congestion, recurrent otitis and sinusitis, bronchiectasis,
  laterality defects in about half, and reduced male fertility. DNAI2 is a rare
  cause - the defining screen found mutations in only two of 105 further
  unrelated PCD families - and the entity has no published natural-history
  series of its own, so the prognostic statements here are borrowed from the
  outer-dynein-arm defect class and are labelled as such.

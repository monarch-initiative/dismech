    explanation: >-
      The allele classes on which the loss-of-function call rests.
  - reference: PMID:11153919
    reference_title: "The human dynein intermediate chain 2 gene (DNAI2): cloning, mapping, expression pattern, and evaluation as a candidate for primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNAI2, which is composed of 14 exons located at 17q25, is highly expressed
      in trachea and testis.
    explanation: >-
      Gene structure, locus and the expression pattern that predicts which
      tissues the disease affects.
  - reference: PMID:11153919
    reference_title: "The human dynein intermediate chain 2 gene (DNAI2): cloning, mapping, expression pattern, and evaluation as a candidate for primary ciliary dyskinesia."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No mutation was found in the DNAI2 coding sequence of the twelve patients
      investigated.
    explanation: >-
      The negative first screen. Graded NO_EVIDENCE because it neither supports
      nor refutes DNAI2 causation - it establishes the genotype's rarity, which
      is why eight years passed before patients were found.
  downstream:
  - target: Outer Dynein Arm Assembly Failure
    causal_link_type: DIRECT
- name: Outer Dynein Arm Assembly Failure
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The step that defines the disease. DNAI2 protein is absent from mutant
    respiratory cells, and with it the outer-arm heavy chains DNAH5 and DNAH9 -
    both of them, from all mutant axonemes. That double loss is the specific
    claim, because outer dynein arms are not uniform along the cilium: proximal
    and distal complexes differ in heavy-chain composition, and the three
    intermediate- and heavy-chain genes are not interchangeable in what they
    take down with them. DNAI2 and DNAH5 loss disrupts assembly of both proximal
    and distal complexes; DNAI1 loss mainly disrupts the proximal ones.

    The assembly hierarchy runs the other way too. In patients with DNAH5
    mutations DNAI2 is completely absent from the axoneme, and in patients with
    DNAI1 mutations it is absent distally - so DNAI2 is a dependent of those
    genes as well as a requirement for them, which is what makes the outer arm a
    co-assembling complex rather than a chain of separable steps.
  biological_processes:
  - preferred_term: axonemal dynein complex assembly
    term:
      id: GO:0070286
      label: axonemal dynein complex assembly
    modifier: DECREASED
  cell_types:
  - preferred_term: multiciliated respiratory epithelial cell
    term:
      id: CL:0005012
      label: multiciliated epithelial cell
  evidence:
  - reference: PMID:18950741
    reference_title: "DNAI2 mutations cause primary ciliary dyskinesia with defects in the outer dynein arm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-resolution immunofluorescence imaging demonstrated absence of the ODA
      heavy chains DNAH5 and DNAH9 from all DNAI2 mutant ciliary axonemes.
    explanation: >-
      Both heavy chains lost from every mutant axoneme - the observation that
      makes this a whole-length outer-arm defect.
  - reference: PMID:18950741
    reference_title: "DNAI2 mutations cause primary ciliary dyskinesia with defects in the outer dynein arm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, DNAI2 and DNAH5 mutations affect assembly of proximal and distal ODA
      complexes, whereas DNAI1 mutations mainly disrupt assembly of proximal ODA
      complexes.
    explanation: >-
      The proximal/distal distinction that separates this genotype from DNAI1
      disease at the ultrastructural level.
  - reference: PMID:26909801
    reference_title: "DNAH11 Localization in the Proximal Region of Respiratory Cilia Defines Distinct Outer Dynein Arm Complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IFM analysis demonstrated native DNAH11 localization in only the proximal
      region of wild-type human respiratory cilia
    explanation: >-
      The primary evidence that outer dynein arms are compositionally different
      along the cilium, which is what makes "proximal and distal complexes" a
      real distinction rather than a figure of speech. Curated here because the
      whole argument for giving DNAI2 its own entry rests on DNAI2 loss
      affecting both.
  - reference: PMID:11713099
    reference_title: "Germline mutations in an intermediate chain dynein cause primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in DNAI1 are causative for PCD with ODA defects, and are likely
      the genetic origin of clinical disease in some PCD patients with
      ultrastructural defects in the ODA.
    explanation: >-
      The DNAI1 anchor for the contrast this node draws. DNAI1 and DNAI2 both
      cause outer dynein arm PCD; they differ in how far along the cilium the
      defect reaches.
  downstream:
  - target: Absence of Outer Dynein Arms from the Axoneme
    causal_link_type: DIRECT
- name: Absence of Outer Dynein Arms from the Axoneme
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-

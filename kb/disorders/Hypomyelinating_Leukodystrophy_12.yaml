diagnosis:
- name: Molecular genetic testing for biallelic VPS11 variants
  description: >-
    Diagnosis is confirmed by identifying biallelic pathogenic VPS11 variants,
    usually by exome or gene-panel sequencing. In individuals of Ashkenazi Jewish
    ancestry the recurrent founder allele c.2536T>G (p.Cys846Gly) is the expected
    variant and is a target of AJ carrier screening.
  evidence:
  - reference: PMID:27120463
    reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole exome sequencing (WES), we identified homozygosity for a missense variant, VPS11: c.2536T>G (p.C846G), as the genetic cause"
    explanation: Establishes exome sequencing detection of the biallelic VPS11 founder variant as the diagnostic route.
- name: Brain MRI hypomyelination pattern
  description: >-
    Brain MRI shows diffuse hypomyelination with a short, posteriorly thinned
    corpus callosum and a VPS11-specific cerebellar signature (focal absence of the
    middle-anterior cerebellar cortex) that helps distinguish HLD12 from other
    hypomyelinating leukodystrophies and can prompt targeted VPS11 testing.
  evidence:
  - reference: PMID:42697725
    reference_title: "MRI Pattern with a Distinctive Cerebellar Signature in VPS11-Related Hypomyelinating Leukodystrophy: A Comparative Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identify reproducible imaging features that may aid in distinguishing it from other hypomyelinating leukodystrophies"
    explanation: Supports the MRI pattern (including the cerebellar signature) as a diagnostic discriminator for VPS11-HLD.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    There is no disease-modifying therapy. Management is supportive and
    multidisciplinary, addressing spasticity, seizures, feeding and aspiration
    risk, visual and hearing impairment, and developmental needs.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Antiseizure pharmacotherapy
  description: >-
    Seizures (tonic-clonic, febrile, myoclonic) are managed with antiseizure
    medication as part of supportive care.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Genetic counseling and carrier screening
  description: >-
    Because VPS11 p.Cys846Gly is a common Ashkenazi Jewish founder allele
    (carrier frequency ~1:250), the authors recommend adding it to the AJ carrier
    screening panel; genetic counseling is offered to affected families.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26307567
    reference_title: "Hypomyelination and developmental delay associated with VPS11 mutation in Ashkenazi-Jewish patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The VPS11 p.Cys846Gly mutation should be added to the AJ carrier screening panel."
    explanation: Supports carrier screening / genetic counseling as a management recommendation.

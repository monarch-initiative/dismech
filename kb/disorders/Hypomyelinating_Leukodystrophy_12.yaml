genetic:
- name: VPS11
  gene_term:
    preferred_term: VPS11
    term:
      id: hgnc:14583
      label: VPS11
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    VPS11 encodes vacuolar protein sorting-associated protein 11, a core subunit
    shared by the HOPS and CORVET Class C Vps tethering complexes. The recurrent
    Ashkenazi Jewish founder allele is c.2536T>G (p.Cys846Gly), in the C-terminal
    RING-H2 domain; the in-frame deletion p.Leu387_Gly395del and compound
    heterozygous missense variants (e.g. p.Leu724Arg / p.Arg729Leu) are also
    reported.
  evidence:
  - reference: PMID:26307567
    reference_title: "Hypomyelination and developmental delay associated with VPS11 mutation in Ashkenazi-Jewish patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity for a missense mutation, p.Cys846Gly, in one of the endosomal biogenesis core proteins, VPS11, was identified in all the patients. This was shown to be a founder mutation with a carrier frequency of 0.6% in the AJ population."
    explanation: Identifies VPS11 p.Cys846Gly as the causal founder allele and gives its AJ carrier frequency.
  - reference: PMID:27473128
    reference_title: "The second report of a new hypomyelinating disease due to a defect in the VPS11 gene discloses a massive lysosomal involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed the homozygous variant p.Leu387_ Gly395del in the VPS11 gene in two siblings."
    explanation: Documents a second, non-founder VPS11 allele causing the same disease, establishing allelic heterogeneity.
pathophysiology:
- name: Biallelic VPS11 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic VPS11 variants reduce the amount or functional competence of
    vacuolar protein sorting-associated protein 11. The Ashkenazi founder allele
    p.Cys846Gly lies in the C-terminal cysteine-rich RING-H2 domain; circular
    dichroism shows it does not misfold the domain, but the mutant protein is
    aberrantly ubiquitinated and turned over roughly five times faster than
    wild-type, lowering steady-state VPS11 and weakening its assembly with VPS18
    into the shared Class C Vps core. The in-frame deletion p.Leu387_Gly395del
    reduces protein by a distinct route. Because VPS11 is a common subunit of both
    HOPS and CORVET, the net effect is a loss of function of both tethering
    complexes.
  genetic_context:
    gene:
      preferred_term: VPS11
      term:
        id: hgnc:14583
        label: VPS11
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:27120463
    reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data shows that the C846G mutation causes aberrant ubiquitination and accelerated turnover of VPS11 protein as well as compromised VPS11-VPS18 complex assembly, suggesting a loss of function in the mutant protein."
    explanation: Direct in-vitro demonstration that the founder allele is a loss-of-function variant acting through instability and impaired core assembly.
  - reference: PMID:27120463
    reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The half-life of the WT protein was five-fold higher than that of the C846G mutant"
    explanation: Quantifies the accelerated turnover underlying reduced VPS11 abundance.
  downstream:
  - target: Impaired HOPS/CORVET-Mediated Endolysosomal Tethering and Fusion
    causal_link_type: DIRECT
    description: >-
      Reduced VPS11 and impaired VPS11-VPS18 core assembly disable the Class C Vps
      tethering complexes that VPS11 anchors.
    evidence:
    - reference: PMID:27120463
      reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "VPS11 protein is a core component of HOPS (homotypic fusion and protein sorting) and CORVET (class C core vacuole/endosome tethering) protein complexes involved in membrane trafficking and fusion of the lysosomes and endosomes."
      explanation: Establishes that VPS11 loss acts on the HOPS/CORVET tethering machinery this edge points to.
- name: Impaired HOPS/CORVET-Mediated Endolysosomal Tethering and Fusion
  biological_scale: CELLULAR
  description: >-
    HOPS and CORVET tether and fuse vesicles within the endolysosomal and
    autophagy pathways - CORVET at early endosomes, HOPS at the fusion of late
    endosomes and autophagosomes with lysosomes. With VPS11 reduced, this tethering
    and fusion step is impaired. The homologous yeast VPS11 mutant shows moderate
    impairment of fusion of the late endosome to the vacuole, and the trafficking
    defect is conserved from yeast to human.
  biological_processes:
  - preferred_term: late endosome to lysosome transport
    modifier: DECREASED
    term:
      id: GO:1902774
      label: late endosome to lysosome transport
  - preferred_term: organelle membrane fusion
    modifier: DECREASED
    term:
      id: GO:0090174
      label: organelle membrane fusion
  evidence:
  - reference: PMID:26307567
    reference_title: "Hypomyelination and developmental delay associated with VPS11 mutation in Ashkenazi-Jewish patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The homologous yeast mutant had moderate impairment of fusion of the late endosome to the vacuole in Mup1-GFP transport assay."
    explanation: Functional assay showing the p.Cys846Gly-homologous mutation impairs late endosome-to-vacuole (lysosome) fusion.
  downstream:
  - target: Impaired Autophagic Flux
    causal_link_type: DIRECT
    description: >-
      Blocked fusion of autophagosomes with lysosomes stalls autophagic
      degradation.
    evidence:
    - reference: PMID:27120463
      reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Reduced VPS11 expression leads to an impaired autophagic activity in human cells."
      explanation: Directly links reduced VPS11 to the downstream autophagy defect.
  - target: Lysosomal Storage
    causal_link_type: DIRECT
    description: >-
      Impaired endosome-lysosome fusion produces intracellular storage material.
    evidence:
    - reference: PMID:27473128
      reference_title: "The second report of a new hypomyelinating disease due to a defect in the VPS11 gene discloses a massive lysosomal involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Electron microscopy of a skin biopsy revealed clusters of membranous cytoplasmic bodies in dermal unmyelinated nerve axons, and numbers of vacuoles in eccrine sweat glands, similar to what is seen in a classic lysosomal storage disease (LSD)."
      explanation: Ultrastructural storage material in patient tissue evidences the lysosomal consequence of the trafficking block.
- name: Impaired Autophagic Flux
  biological_scale: CELLULAR
  description: >-
    Loss of VPS11-dependent autophagosome-lysosome fusion reduces autophagic flux.
    In VPS11-depleted human cells the autophagy substrates p62 and LC3 accumulate,
    immature autophagosomes build up and autolysosome formation falls; inducing
    autophagy no longer clears the markers, indicating a block at the fusion/flux
    step rather than at autophagosome biosynthesis.
  biological_processes:
  - preferred_term: autophagosome-lysosome fusion
    modifier: DECREASED
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
  - preferred_term: macroautophagy
    modifier: DECREASED
    term:
      id: GO:0016236
      label: macroautophagy
  evidence:
  - reference: PMID:27120463
    reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "knockdown of VPS11 caused accumulation of the autophagy markers, p62"
    explanation: Accumulation of the autophagy substrates p62 and LC3 on VPS11 knockdown demonstrates the reduced autophagic flux this node encodes.
  downstream:
  - target: Oligodendroglial Differentiation Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Autophagy-lysosome dysfunction is proposed to underlie the myelination
      defect, though whether it acts through oligodendrocytes or neurons is not
      fully resolved.
    evidence:
    - reference: PMID:27120463
      reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "our study reveals a defect in VPS11 as the underlying etiology for an autosomal recessive leukoencephalopathy disorder associated with a dysfunctional autophagy-lysosome trafficking pathway"
      explanation: The authors attribute the leukoencephalopathy to the autophagy-lysosome trafficking defect; the link to differentiation is inferential, hence indirect with unknown intermediates.
- name: Lysosomal Storage
  biological_scale: CELLULAR
  description: >-
    VPS11 deficiency produces morphological and biochemical features of lysosomal
    storage: membranous cytoplasmic bodies in unmyelinated dermal axons, vacuolated
    eccrine sweat glands, bone-marrow storage macrophages with micro-vacuolated
    cytoplasm, and urinary glycosphingolipid changes reminiscent of prosaposin
    deficiency. This places VPS11 disease within the broader lysosomal-storage
    field and distinguishes it from primary hypomyelinating leukodystrophies with
    no storage.
  biological_processes:
  - preferred_term: lysosomal transport
    modifier: DECREASED
    term:
      id: GO:0007041
      label: lysosomal transport
  evidence:
  - reference: PMID:27473128
    reference_title: "The second report of a new hypomyelinating disease due to a defect in the VPS11 gene discloses a massive lysosomal involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow cytology showed a high number of storage macrophages with a micro-vacuolated cytoplasm."
    explanation: Independent tissue evidence of lysosomal storage in VPS11 deficiency.
- name: Oligodendroglial Differentiation Failure
  biological_scale: CELLULAR
  description: >-
    Myelin is made by oligodendrocytes only after they undergo morphological
    differentiation into large web-like membrane structures. In an oligodendroglial
    cell-line model, the C846G mutant VPS11 forms aggregates and downregulates
    signalling through p70S6K (a kinase that, via mTOR, promotes oligodendroglial
    differentiation and myelination), and the mutant cells fail to adopt the
    differentiated web-like phenotype. Blocked oligodendroglial differentiation is
    a proximate cause of the hypomyelination.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: oligodendrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0048709
      label: oligodendrocyte differentiation
  evidence:
  - reference: PMID:32316234
    reference_title: "PP1C and PP2A are p70S6K Phosphatases Whose Inhibition Ameliorates HLD12-Associated Inhibition of Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells harboring the C846G mutant constructs decrease differentiated phenotypes with web-like structures following differentiation, whereas parental cells exhibit them suitably."
    explanation: Shows the disease allele blocks oligodendroglial morphological differentiation in a cell model.
  - reference: PMID:32316234
    reference_title: "PP1C and PP2A are p70S6K Phosphatases Whose Inhibition Ameliorates HLD12-Associated Inhibition of Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the HLD12-associated Cys846-to-Gly (C846G) mutation of VPS11 leads to its aggregate formation with downregulated signaling through 70 kDa S6 protein kinase (p70S6K) in the oligodendroglial cell line FBD-102b as the model"
    explanation: Identifies aggregate formation and p70S6K downregulation as the molecular basis of the differentiation block.
  downstream:
  - target: CNS Hypomyelination
    causal_link_type: DIRECT
    description: >-
      Oligodendrocytes that cannot differentiate cannot elaborate myelin,
      producing hypomyelination.
    evidence:
    - reference: PMID:32316234
      reference_title: "PP1C and PP2A are p70S6K Phosphatases Whose Inhibition Ameliorates HLD12-Associated Inhibition of Oligodendroglial Cell Morphological Differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The primary reason for myelination defects is incomplete or negligible oligodendroglial differentiation"
      explanation: States the differentiation-to-hypomyelination link this edge encodes.
- name: CNS Neuronal Death
  biological_scale: CELLULAR
  description: >-
    In the zebrafish vps11(plt) mutant, TUNEL labelling shows significant apoptotic
    neuronal death in the midbrain (and milder death in the hindbrain), and this
    neuronal death at 3-5 days post-fertilization precedes the reduction in
    myelination seen at 7 dpf. This ordering argues that a primary neuronal defect
    contributes to the disease, with myelination failure at least partly secondary
    - consistent with the microcephaly, seizures and severe cognitive impairment
    seen in patients.
  biological_processes:
  - preferred_term: neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  evidence:
  - reference: PMID:27120463
    reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the neuronal death was observed at 3 and 5 dpf, which preceded the significant reduction in myelination observed at 7 dpf"
    explanation: Zebrafish evidence that neuronal death precedes and may drive the myelination defect.
  downstream:
  - target: CNS Hypomyelination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Neuronal activity is required for normal myelination, so primary neuronal
      dysfunction/death can produce secondary hypomyelination.
    evidence:
    - reference: PMID:27120463
      reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "a significant reduction in CNS myelination following extensive neuronal death in the hindbrain and midbrain"
      explanation: In the zebrafish model the myelination reduction follows neuronal death, supporting a neuron-first mechanism in which hypomyelination is at least partly secondary; the extrapolation to human disease is inferential.
  - target: Progressive microcephaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Progressive neuronal loss and brain atrophy underlie the acquired postnatal
      microcephaly.
  - target: Developmental regression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Ongoing neuronal loss underlies the loss of previously acquired
      developmental skills after early stagnation.
  - target: Seizures
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cortical neuronal dysfunction and injury lower the seizure threshold.
- name: CNS Hypomyelination
  biological_scale: TISSUE
  description: >-
    The convergent endpoint of the oligodendroglial and neuronal arms is a diffuse
    deficit of central myelin. Zebrafish vps11 mutants show a significant reduction
    in myelin basic protein immunolocalisation, and patient MRI shows diffuse
    hypomyelination with a short, posteriorly thinned corpus callosum, reduced
    white-matter volume and a VPS11-specific cerebellar signature. This tissue-level
    hypomyelination is what produces the progressive neurological phenotype.
  biological_processes:
  - preferred_term: myelination
    modifier: DECREASED
    term:
      id: GO:0042552
      label: myelination
  evidence:
  - reference: PMID:27120463
    reference_title: "A Founder Mutation in VPS11 Causes an Autosomal Recessive Leukoencephalopathy Linked to Autophagic Defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "zebrafish harboring a vps11 mutation with truncated RING-H2 domain demonstrated a significant reduction in CNS myelination following extensive neuronal death in the hindbrain and midbrain"
    explanation: Model-organism evidence for reduced CNS myelination downstream of VPS11 loss.
  - reference: PMID:42697725
    reference_title: "MRI Pattern with a Distinctive Cerebellar Signature in VPS11-Related Hypomyelinating Leukodystrophy: A Comparative Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrated the following findings in all patients: 1) a distinct cerebellar signature characterized by focal absence of the cerebellar cortex in the middle-anterior hemispheric portions; 2) diffuse hypomyelination"
    explanation: Diffuse hypomyelination is a core, all-patient MRI finding in the human cohort.
  downstream:
  - target: Global developmental delay and regression
    causal_link_type: DIRECT
  - target: Spastic tetraplegia
    causal_link_type: DIRECT
  - target: Axial hypotonia
    causal_link_type: DIRECT
  - target: Cerebral visual impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cortical visual impairment reflects hypomyelination and neuronal injury in
      the visual pathway and cortex; the precise route is not resolved.
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hearing loss is reported in a subset of patients; whether it is central
      (auditory-pathway hypomyelination) or peripheral is not established.
phenotypes:
- name: Global developmental delay and regression
  category: Neurologic
  description: >-
    Onset is in the first months of life with developmental stagnation followed by
    regression; patients become severely developmentally delayed, typically
    non-verbal and non-ambulatory.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:26307567
    reference_title: "Hypomyelination and developmental delay associated with VPS11 mutation in Ashkenazi-Jewish patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a neurological disease, which consists of global developmental stagnation at 3-8 months, increasing appendicular spasticity, truncal hypotonia and acquired microcephaly"
    explanation: Documents global developmental stagnation with early infantile onset in the founding cohort.
  notes: Reported in all 8 patients in PMID:26307567 and all 5 in PMID:27120463.
- name: Developmental regression
  category: Neurologic
  description: >-
    After early stagnation, affected children lose previously acquired
    developmental skills.
  phenotype_term:

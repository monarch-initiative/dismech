name: Hypomyelinating Leukodystrophy 12
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
description: >-
  Hypomyelinating leukodystrophy 12 (HLD12, MIM 616683) is an ultra-rare
  autosomal recessive infantile-onset hypomyelinating leukodystrophy caused by
  biallelic variants in VPS11, which encodes a core subunit shared by the two
  Class C Vps tethering complexes of the endolysosomal system - HOPS (homotypic
  fusion and protein sorting), which tethers late endosomes and autophagosomes to
  lysosomes, and CORVET (class C core vacuole/endosome tethering), which acts at
  early endosomes. Affected children present in the first months of life with
  developmental stagnation and then regression, acquired progressive microcephaly,
  truncal (axial) hypotonia evolving to appendicular spasticity and spastic
  tetraplegia, variable seizures, cortical visual impairment or optic atrophy, and
  sensorineural hearing loss. Brain MRI shows diffuse CNS hypomyelination, a short
  and posteriorly thinned corpus callosum, reduced white-matter volume, and - in a
  recent two-centre cohort - a VPS11-specific cerebellar signature (focal absence
  of the middle-anterior cerebellar cortex) not seen in other hypomyelinating
  leukodystrophies. Most reported patients are of Ashkenazi Jewish ancestry and
  homozygous for the founder allele VPS11 c.2536T>G (p.Cys846Gly), which has a
  carrier frequency of roughly 1:250 (0.6%) in that population.

  The mechanism is a loss of VPS11 function in endolysosomal membrane trafficking.
  The p.Cys846Gly substitution sits in the C-terminal cysteine-rich RING-H2 domain;
  it does not misfold the domain but is aberrantly ubiquitinated and rapidly
  degraded, lowering steady-state VPS11 and weakening VPS11-VPS18 core assembly, so
  both HOPS and CORVET are compromised. Other alleles (the in-frame deletion
  p.Leu387_Gly395del; compound-heterozygous missense variants) reduce protein by
  different routes. The downstream consequences are impaired fusion of late
  endosomes and autophagosomes with lysosomes, reduced autophagic flux, and
  lysosomal storage (membranous cytoplasmic bodies, storage macrophages and
  abnormal urinary glycosphingolipids resembling a classic lysosomal storage
  disease). In oligodendroglial cell models the mutant protein aggregates and
  downregulates p70S6K signalling, blocking the morphological differentiation
  required to make myelin; in zebrafish vps11 mutants CNS neuronal death precedes
  and accompanies a reduction in myelination. Both a primary oligodendroglial
  differentiation failure and primary neuronal death therefore contribute to the
  hypomyelination.

  The allelic and phenotypic spectrum is broadening. Two independent reports now
  describe a later-onset complex dystonic / spastic-paraplegia syndrome from
  biallelic VPS11 missense variants with little or no white-matter change, so the
  VPS11 clinical spectrum is now taken to span both a white-matter disease and a
  movement-disorder presentation. There is no disease-modifying therapy;
  management is supportive and multidisciplinary. A candidate molecular
  intervention point (restoring p70S6K phosphorylation by inhibiting the
  phosphatases PP1C/PP2A) has been demonstrated only in an oligodendroglial cell
  line.
notes: >-
  Named-entity-confusion guardrail. This entry is anchored strictly on
  MONDO:0014732 / OMIM:616683 / VPS11 (hgnc:14583). "Hypomyelinating
  leukodystrophy N" is a numbered series whose members share only the numeral, so
  the anchor was fixed before curation with
  `uv run runoak -i sqlite:obo:mondo info MONDO:0014732 -O obo`, which returns
  `intersection_of: RO:0004003 HGNC:14583 ! VPS11` and `xref: OMIM:616683`,
  independently confirming both gene and OMIM number. VPS11 (hgnc:14583) was
  confirmed with `uv run runoak -i sqlite:obo:hgnc info hgnc:14583`.

  Gene-family confusables. VPS11 is one of six Class C Vps subunits; VPS16, VPS18,
  VPS33A and VPS33B all cause distinct disorders, and none of their literature is
  cited here as evidence for VPS11 disease. VPS11 also has a large,
  disease-unrelated cell-biology and cancer literature (autophagy machinery,
  ferroptosis), which is likewise excluded.

  No GeneReviews chapter exists for VPS11 or HLD12. Searched on 2026-09-05 with
  `VPS11 GeneReviews[All Fields]` and `hypomyelinating leukodystrophy
  GeneReviews[TI]`; both returned zero records. The phenotype baseline is
  therefore taken from the primary cohort literature: PMID:26307567 (8 patients,
  4 AJ families; the founding report), PMID:27120463 (5 patients, 3 AJ families;
  founder-allele + autophagy mechanism), PMID:27473128 (2 siblings; the
  lysosomal-storage second report) and PMID:42697725 (6 patients; the systematic
  MRI cohort).

  Frequency discipline. FrequencyEnum bands are asserted only where a cohort gives
  an explicit numerator or an unambiguous "in all patients" statement, and the
  source figure is recorded in each phenotype's notes. Where a feature is reported
  in "some" or "several" patients, frequency is omitted rather than guessed. The
  whole published denominator is only a few dozen patients drawn largely from one
  founder population, so no feature is banded OBLIGATE.

  No `datasets:` block is curated. HLD12 has a few dozen published patients and no
  omics resource of its own, while a gene-keyed accession search on VPS11 returns
  cancer and generic-autophagy datasets that would resolve perfectly and be about
  the wrong biology - the Named Entity Confusion the dataset-curation SOP warns
  about - so an empty block is the honest result.

  A Claude Code literature-sweep deep-research report is committed at
  research/Hypomyelinating_Leukodystrophy_12-deep-research-claude-2026-09-05.md.
  Its citations were treated as leads and each snippet used here was verified
  against the primary source fetched into references_cache/.

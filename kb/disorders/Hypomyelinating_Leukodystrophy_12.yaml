    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All five patients exhibited highly concordant disease progression characterized by infantile onset leukoencephalopathy with brain white matter abnormalities, severe motor impairment, cortical blindness, intellectual disability, and seizures."
    explanation: Describes the concordant infantile-onset progressive (regressive) course.
- name: Progressive microcephaly
  category: Neurologic
  description: >-
    Head growth is normal or near-normal at birth and then falls off, producing

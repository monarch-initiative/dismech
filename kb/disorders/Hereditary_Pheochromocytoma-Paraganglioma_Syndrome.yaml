  description: >-
    Beyond paraganglioma and pheochromocytoma, SDHx carriers develop
    gastrointestinal stromal tumors, pulmonary chondromas and clear cell renal
    cell carcinoma. The GIST/chondroma combination is the overlap with
    Carney-Stratakis syndrome and the Carney triad, which is why unexplained
    anaemia or gastrointestinal symptoms in a carrier prompt endoscopy.

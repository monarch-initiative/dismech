discussions:
- discussion_id: gap_sdhd_parent_of_origin_mechanism
  prompt: >-
    What mechanism produces the paternal-transmission requirement in
    SDHD-related paraganglioma, given that the gene itself showed no evidence of
    imprinting?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Germline SDHx First-Hit Inactivation
  rationale: >-
    The clinical inheritance pattern of SDHD-related paraganglioma is one of the
    most striking parent-of-origin effects in cancer genetics, and it directly
    governs who is offered surveillance in a family. The obvious explanation,
    genomic imprinting of SDHD, was tested in the original report and not
    supported. The leading alternative invokes the somatic second hit rather
    than the germline allele: tumorigenesis requires loss of the entire maternal
    chromosome 11, so the event is available only when the retained maternal
    copy is the wild-type one — that is, when the constitutional variant came
    from the father. The companion `Pheochromocytoma_Paraganglioma` entry
    (MONDO:0035540) curates that explanation directly, in its "Somatic Loss of
    Maternal Chromosome 11" node, which now conforms to the second-hit node of
    the germline two-hit module. This entry keeps the question open rather than
    restating it as settled, because the evidence quoted here goes only as far
    as showing that the lost chromosome IS maternal (PMID:11605159) — consistent
    with the model, but not by itself an account of why the reciprocal event
    cannot occur. Curators wanting the mechanistic account should follow the
    cross-reference; curators wanting the clinical rule need only the
    parent-of-origin observation, which GeneReviews states plainly.
  proposed_experiments:
  - experiment_id: parental_allele_resolved_loh_in_sdhd_tumors
    name: Parent-of-origin-resolved allelic analysis of SDHD tumors
    description: >-
      Determine, in SDHD paragangliomas from carriers of known transmission
      parent, which parental chromosome 11 region is lost somatically and
      whether the pattern differs between paternally and maternally transmitted
      variants, testing whether the parent-of-origin effect resides in the
      second hit rather than in germline imprinting.
treatments:
- name: Alpha-Adrenergic Blockade Before Resection of a Secretory Tumor
  description: >-
    The sequencing here is the safety-critical part of managing a secretory
    lesion: alpha-adrenergic receptor blockade precedes surgery, because
    operating on an unblocked catecholamine-secreting tumor risks
    intraoperative hypertensive crisis. GeneReviews also requires that every
    head and neck paraganglioma be assessed for catecholamine excess before
    resection even though ~95% are nonsecretory — a positive result signals a
    second, secretory primary elsewhere.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Paraganglioma and Pheochromocytoma Development
    treatment_effect: INHIBITS
    description: >-
      Alpha blockade does not act on the tumor; it blocks the receptor
      through which secreted catecholamines produce their systemic effects,
      making resection of the consequence node survivable.
  evidence:
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For secretory PGL/PCCs, alpha-adrenergic receptor blockade followed by
      surgical resection.
    explanation: >-
      GeneReviews Management section, stating both the agent class and the
      order of operations.
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All individuals with HNPGLs should be evaluated for catecholamine excess
      before surgical resection, which, if present, can suggest an additional
      primary PGL/PCC.
    explanation: >-
      GeneReviews Management section. Biochemical screening before head and
      neck surgery serves a diagnostic purpose beyond safety — it can reveal a
      second tumor, which is the multifocality this syndrome's mechanism
      predicts.
- name: Genotype-Directed Surgical Management
  description: >-
    Management is stratified by gene rather than uniform. SDHB-related tumors
    go to resection because of their metastatic risk, while most head and neck
    paragangliomas — typically nonsecretory and indolent — may reasonably be
    observed or irradiated instead. This is the clinical expression of the
    genotype-severity gradient this entry curates on the epigenetic branch.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Paraganglioma and Pheochromocytoma Development
    treatment_effect: INHIBITS
    description: >-
      Resection removes the established tumor; it does not alter the germline
      lesion, so surveillance for further independent tumors continues.
  evidence:
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SDHB-related PGL/PCCs are typically treated with surgical resection
      because of the higher risk for metastatic disease.
    explanation: >-
      GeneReviews Management section, tying the surgical decision directly to
      the SDHB genotype and its metastatic risk.
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In general, most HNPGLs (carotid body, glomus jugulotympanicum, vagal,
      and jugular paragangliomas) are nonsecretory and may be treated with
      active observation, surgical resection, or radiation therapy.
    explanation: >-
      GeneReviews Management section, giving the contrasting, less aggressive
      options for head and neck disease.
- name: Lifelong Biochemical and Imaging Surveillance
  notes: >-
    Curated under `treatments:` as a management intervention, not as a claim
    that imaging or biochemistry is itself therapeutic. In a two-hit
    predisposition syndrome the second hit cannot be prevented, so the only
    available lever is stage at detection: surveillance is the intervention
    that converts an unavoidable tumor into a resectable one. Where a
    `target_mechanisms` link is present it points at the clinical-outcome node
    for that reason, and never at an upstream mechanistic node.
  description: >-
    Because independent second hits keep occurring across paraganglial tissue,
    surveillance is lifelong and combines biochemistry with whole-body imaging.
    The starting age is gene-dependent, which is why cascade testing precedes
    surveillance planning.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  target_mechanisms:
  - target: Paraganglioma and Pheochromocytoma Development
    treatment_effect: INHIBITS
    description: >-
      Surveillance shifts detection earlier in the natural history of tumors
      that second hits initiate; it does not prevent their initiation.
  evidence:
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals at risk for hereditary PGL/PCC syndromes should have annual
      clinical assessment for manifestations of PGL/PCCs and GISTs, plasma-free
      fractionated metanephrines or 24-hour urine fractionated metanephrines
      every two years in childhood and then annually in adults, and whole-body
      MRI every two to three years.
    explanation: >-
      GeneReviews Management section, giving the full surveillance protocol —
      modality, analyte and interval, with the interval changing between
      childhood and adulthood.
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Age of initiation for screening varies by gene.
    explanation: >-
      GeneReviews Management section. The gene-dependence of the start age is
      why this entry curates the genotype distinctions in `genetic:` rather
      than treating SDHx as one undifferentiated cause.
- name: Avoidance of Hypoxic Exposures
  description: >-
    An agents-and-circumstances-to-avoid recommendation with a mechanistic
    rationale specific to this syndrome: the tumors arise through a
    pseudohypoxic lesion, so genuine hypoxia is a plausible accelerant.
    GeneReviews is explicit that the supporting data are extremely limited, and
    this entry does not curate it as established.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Behavioral Counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hypoxic conditions (e.g., cyanotic heart disease, cigarette smoking) may
      increase tumor incidence and promote tumor growth, although data are
      extremely limited.
    explanation: >-
      GeneReviews Agents/Circumstances to Avoid. Quoted with its own caveat
      intact: the mechanistic rationale is attractive given the pseudohypoxia
      branch curated upstream, but the evidence is explicitly weak.
diagnosis:
- name: Clinical Features Prompting Hereditary PGL/PCC Evaluation
  description: >-
    The features that raise suspicion are precisely those the two-hit mechanism
    predicts — multiplicity, multifocality, recurrence and early onset — plus
    family history. A single late-onset sporadic-looking tumor is the situation
    in which the syndrome is missed.
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Multiple, multifocal, recurrent or early-onset disease, or a positive family
    history, should trigger germline testing.
  evidence:
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A diagnosis of a hereditary PGL/PCC syndrome is strongly suspected in an
      individual with multiple, multifocal, recurrent, or early-onset
      paraganglioma or pheochromocytoma and/or a family history of paraganglioma
      or pheochromocytoma.
    explanation: >-
      GeneReviews Diagnosis/Testing section, giving the clinical selection
      criteria — which are the clinical signature of the germline two-hit
      mechanism this entry conforms to.
- name: Germline Molecular Genetic Testing of the PGL/PCC Gene Panel
  description: >-
    The diagnosis is established by a germline heterozygous pathogenic variant
    in one of seven genes. Panel rather than single-gene testing is the norm
    because the genes are clinically overlapping but differ in metastatic risk,
    surveillance start age and parent-of-origin behaviour.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A germline heterozygous pathogenic variant in MAX, SDHA, SDHAF2, SDHB,
    SDHC, SDHD or TMEM127 establishes the diagnosis and sets the
    gene-specific surveillance plan.
  evidence:
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis is established in a proband with a personal or family
      history of paraganglioma or pheochromocytoma and a germline heterozygous
      pathogenic variant in MAX, SDHA, SDHAF2, SDHB, SDHC, SDHD, or TMEM127
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews Diagnosis/Testing section, naming the confirmatory test and
      the full gene set that establishes the diagnosis.
- name: Predictive Testing of First-Degree Relatives
  description: >-
    Cascade testing both identifies relatives who need lifelong surveillance and
    releases those who do not from it — a meaningful de-escalation given that
    surveillance here means biennial whole-body MRI for life.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Clarifies which first-degree relatives require gene-specific surveillance.
  evidence:
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      First-degree relatives of an individual with a hereditary PGL/PCC syndrome
      and a known MAX, SDHA, SDHAF2, SDHB, SDHC, SDHD, or TMEM127 pathogenic
      variant should be offered molecular genetic testing to clarify their
      genetic status to improve diagnostic certainty and reduce the need for
      costly screening procedures in those who have not inherited the pathogenic
      variant.
    explanation: >-
      GeneReviews Evaluation of Relatives at Risk, giving both purposes of
      cascade testing.
- name: SDHB Immunohistochemistry as a Triage Test for Germline SDHx Testing
  description: >-
    SDHB protein is destabilized when any complex II subunit is lost, so loss of
    SDHB staining reports the whole SDHx arm rather than SDHB alone. Because the
    second hit removes the wild-type allele in tumor tissue, the tumor itself
    reports the germline state, and a negative or weak-diffuse stain triages
    which patients need panel sequencing. It does not replace germline testing.
  diagnosis_term:
    preferred_term: Immunohistochemistry Staining Method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  results: >-
    Absent or weak-diffuse cytoplasmic SDHB staining, read against an internal
    positive control, selects tumors for germline SDHx sequencing; granular
    cytoplasmic positivity argues against an SDHx cause.
  evidence:
  - reference: PMID:20236688
    reference_title: Immunohistochemistry for SDHB triages genetic testing of SDHB, SDHC, and SDHD in paraganglioma-pheochromocytoma syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 12 SDH mutated tumors (6 SDHB, 5 SDHD, and 1 SDHC) showed weak diffuse
      or negative staining.
    explanation: >-
      Establishes that loss of SDHB staining detects germline variants in SDHB,
      SDHC and SDHD alike, which is what makes one stain a triage test for the
      whole arm rather than a test for one gene.
  - reference: PMID:20236688
    reference_title: Immunohistochemistry for SDHB triages genetic testing of SDHB, SDHC, and SDHD in paraganglioma-pheochromocytoma syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As SDH mutations are virtually always germline, we conclude that
      approximately 15% of all pheochromocytomas or paragangliomas are
      associated with germline SDH mutation and that immunohistochemistry can be
      used to triage genetic testing.
    explanation: >-
      States the triage conclusion and its premise — that an SDHx lesion found
      in tumor tissue is effectively always constitutional, which is the
      first-hit architecture this entry curates.
  - reference: PMID:20236688
    reference_title: Immunohistochemistry for SDHB triages genetic testing of SDHB, SDHC, and SDHD in paraganglioma-pheochromocytoma syndromes.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Completely absent staining is more commonly found with SDHB mutation,
      whereas weak diffuse staining often occurs with SDHD mutation.
    explanation: >-
      A genotype-staining tendency, not a rule: it is curated as PARTIAL because
      the study reports it as a trend across 12 mutated tumors and it cannot be
      used to assign a gene without sequencing.
mechanistic_hypotheses:
- hypothesis_group_id: hif_pseudohypoxia_driver
  hypothesis_label: Pseudohypoxic HIF Activation Drives SDHx-Deficient Tumorigenesis
  status: CANONICAL
  description: >-
    The original reading: succinate inhibits the HIF prolyl hydroxylases, HIF is
    stabilized in normoxia, and the resulting hypoxia programme both transforms
    the chromaffin or paraganglionic cell and accounts for the striking
    vascularity of these tumors in the absence of any VHL mutation.
  evidence:
  - reference: PMID:15652751
    reference_title: Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-alpha prolyl hydroxylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest a mechanistic link between SDH mutations and
      HIF-1alpha induction, providing an explanation for the highly vascular
      tumors that develop in the absence of VHL mutations.
    explanation: >-
      The observation on which the pseudohypoxia-driver reading of SDHx
      tumorigenesis rests.
- hypothesis_group_id: epigenetic_hypermethylation_driver
  hypothesis_label: Hypermethylator Phenotype and Differentiation Block Drives SDHx-Deficient Tumorigenesis
  status: ALTERNATIVE
  description: >-
    The competing reading: the transforming event is inhibition of the TET and
    Jumonji demethylases, producing a hypermethylator phenotype that silences
    neuroendocrine differentiation genes. Its strongest support is that the
    severity of silencing, not the degree of HIF activation, tracks the clinical
    severity gradient across SDHx genotypes — epigenetic silencing is most severe
    in SDHB-mutated tumors, which are also the most likely to metastasize.
  evidence:
  - reference: PMID:23707781
    reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epigenetic silencing was particularly severe in SDHB-mutated tumors,
      potentially explaining their malignancy.
    explanation: >-
      Ties the epigenetic branch rather than the HIF branch to the clinical
      severity gradient across genotypes. The source hedges ("potentially
      explaining"), and this hypothesis is curated as ALTERNATIVE rather than
      settled.

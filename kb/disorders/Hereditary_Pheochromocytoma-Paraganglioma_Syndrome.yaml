disease_term:
  preferred_term: hereditary pheochromocytoma-paraganglioma
  term:
    id: MONDO:0017366
    label: hereditary pheochromocytoma-paraganglioma
synonyms:
- hereditary paraganglioma-pheochromocytoma syndrome
- SDHx-related paraganglioma-pheochromocytoma
- familial paraganglioma
description: >-
  Hereditary pheochromocytoma-paraganglioma syndrome is a group of autosomal
  dominant cancer predisposition syndromes caused by germline loss-of-function
  variants in the succinate dehydrogenase complex — SDHD (PGL1), SDHAF2 (PGL2),
  SDHC (PGL3), SDHB (PGL4) and SDHA (PGL5) — that predispose to
  catecholamine-secreting adrenal pheochromocytoma and to parasympathetic
  paragangliomas of the head and neck, most characteristically of the carotid
  body. The recognition that a mitochondrial respiratory-chain and TCA-cycle
  enzyme could act as a tumor suppressor was unexpected and reframed the
  relationship between metabolism and cancer. Succinate dehydrogenase sits at the
  junction of the TCA cycle and complex II; when it is lost, succinate
  accumulates and escapes the mitochondrion to act as a signalling molecule in
  the cytosol and nucleus, competitively inhibiting 2-oxoglutarate-dependent
  dioxygenases. Two evidenced consequences follow: inhibition of the HIF prolyl
  hydroxylases stabilizes hypoxia-inducible factor in normoxia, explaining why
  these tumors are strikingly vascular in the absence of any VHL mutation; and
  inhibition of the TET and Jumonji demethylases produces a hypermethylator
  phenotype that silences neuroendocrine differentiation genes. The severity of
  that epigenetic silencing tracks genotype and clinical behaviour — it is most
  marked in SDHB-mutated tumors, which are also the most likely to metastasize,
  and SDHB status is accordingly the single most important determinant of
  surveillance intensity. Genotype also determines anatomical distribution and
  transmission pattern: SDHD disease is dominated by head-and-neck paraganglioma
  and manifests almost exclusively on paternal transmission, while SDHB disease
  carries the highest risk of extra-adrenal abdominal and metastatic tumors.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Transmission is autosomal dominant with incomplete, age-dependent penetrance
    that differs markedly by gene. SDHD-related disease shows a parent-of-origin
    effect: affected individuals almost always inherit the variant from their
    father. The mechanism of that effect is not settled — the original SDHD
    report noted explicitly that the gene showed no evidence of imprinting
    despite the inheritance pattern predicting it — and is curated here as an
    open question rather than asserted.
  evidence:
  - reference: PMID:10657297
    reference_title: "Mutations in SDHD, a mitochondrial complex II gene, in hereditary paraganglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to expectations based on the inheritance pattern of PGL, the
      SDHD gene showed no evidence of imprinting.
    explanation: >-
      Establishes both that the inheritance pattern of PGL implies a
      parent-of-origin effect and that the simplest explanation for it was not
      supported at the gene, which is exactly the caveat this entry records.
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with a hereditary PGL/PCC syndrome-causing
      pathogenic variant has a 50% chance of inheriting the pathogenic variant.
    explanation: >-
      GeneReviews Genetic Counseling section: the transmission risk to
      offspring. Evidence source is OTHER because GeneReviews is an
      expert-authored review rather than a primary study.
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenic variants in SDHD, SDHAF2, and possibly MAX demonstrate
      parent-of-origin effects and cause disease almost exclusively when they
      are paternally inherited
    explanation: >-
      GeneReviews Genetic Counseling section, stating the parent-of-origin
      effect as a clinical fact and extending it beyond SDHD to SDHAF2 and
      possibly MAX. This is the observation whose mechanism remains open in this
      entry's KNOWLEDGE_GAP discussion — the effect is established, the
      explanation is not.
  - reference: PMID:20301715
    reference_title: "Hereditary Paraganglioma-Pheochromocytoma Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      an individual who inherits an SDHD or SDHAF2 pathogenic variant from the
      individual's mother is usually not at risk of developing disease –
      however, exceptions occur
    explanation: >-
      GeneReviews Genetic Counseling section. The exception clause matters
      clinically: maternal inheritance lowers risk but does not abolish it, so
      this entry does not curate maternal transmission as protective.
pathophysiology:
- name: Germline SDHx First-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous loss-of-function variant in a succinate dehydrogenase subunit
    gene is present constitutionally. SDHC and SDHD encode the membrane anchors
    that hold the SDHA/SDHB catalytic core in the inner mitochondrial membrane,
    so loss of any of the four subunits compromises the same enzyme. The
    identification of these genes extended tumor predisposition beyond the
    previously known VHL, NF1 and RET loci to the mitochondrion itself.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: SDHB
    modifier: DECREASED
    term:
      id: hgnc:10681
      label: SDHB
  genetic_context:
    gene:
      preferred_term: SDHB
      term:
        id: hgnc:10681
        label: SDHB
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - PATHOGENIC_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous inactivating variant in a succinate
      dehydrogenase subunit gene; SDHB is given as the exemplar because it
      carries the highest metastatic risk, but SDHA, SDHC, SDHD and SDHAF2
      variants act through the same enzyme.
  molecular_functions:
  - preferred_term: succinate dehydrogenase (quinone) activity
    term:
      id: GO:0008177
      label: succinate dehydrogenase (quinone) activity
    modifier: DECREASED
  evidence:
  - reference: PMID:10657297
    reference_title: "Mutations in SDHD, a mitochondrial complex II gene, in hereditary paraganglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of families carrying the PGL1 gene, described here, revealed germ
      line mutations in the SDHD gene on chromosome 11q23.
    explanation: >-
      Identifies the first germline succinate dehydrogenase lesion in hereditary
      paraganglioma families.
  - reference: PMID:11404820
    reference_title: Gene mutations in the succinate dehydrogenase subunit SDHB cause susceptibility to familial pheochromocytoma and to familial paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inactivating SDHB mutations were detected in two of the five kindreds with
      familial pheochromocytoma, two of the three kindreds with pheochromocytoma
      and paraganglioma susceptibility, and 1 of the 24 cases of sporadic
      pheochromocytoma.
    explanation: >-
      Extends the germline first hit to SDHB and to the pheochromocytoma
      phenotype, establishing the gene family basis of this entry.
  - reference: PMID:11404820
    reference_title: Gene mutations in the succinate dehydrogenase subunit SDHB cause susceptibility to familial pheochromocytoma and to familial paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene products of two components of succinate dehydrogenase, SDHC and
      SDHD, anchor the gene products of two other components, SDHA and SDHB,
      which form the catalytic core, to the inner-mitochondrial membrane.
    explanation: >-
      Supports the statement that loss of any subunit compromises one shared
      enzyme, which is why the several PGL loci produce one mechanistic entity.
  downstream:
  - target: Biallelic SDHx Loss and Succinate Dehydrogenase Deficiency
    description: >-
      A somatic second hit removing the wild-type allele is required before
      enzyme activity falls far enough for succinate to accumulate.

- name: Biallelic SDHx Loss and Succinate Dehydrogenase Deficiency
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    In a chromaffin or paraganglionic cell that has inactivated the retained
    wild-type allele, succinate dehydrogenase activity is lost. This is the
    handover point from the inherited-predisposition mechanism to the
    oncometabolite mechanism: the heterozygous carrier cell is not
    succinate-loaded, and only the biallelic cell reaches the concentrations at
    which succinate acts as a signalling molecule.
  role: central_effector
  biological_scale: CELLULAR
  genetic_context:
    gene:
      preferred_term: SDHB
      term:
        id: hgnc:10681
        label: SDHB
    variant_origin: GERMLINE_AND_SOMATIC
    allelic_hit_role: BIALLELIC_INACTIVATION
    allelic_events:
    - LOSS_OF_HETEROZYGOSITY
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Combined inherited and acquired inactivation leaving the tumor cell without
      functional succinate dehydrogenase.
  molecular_functions:
  - preferred_term: succinate dehydrogenase (quinone) activity
    term:
      id: GO:0008177
      label: succinate dehydrogenase (quinone) activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:11605159
    reference_title: The R22X mutation of the SDHD gene in hereditary paraganglioma abolishes the enzymatic activity of complex II in the mitochondrial respiratory chain and activates the hypoxia pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss of heterozygosity was observed for the maternal chromosome 11q21-q25
      within the tumor but not in peripheral leukocytes.
    explanation: >-
      Demonstrates the somatic second hit directly, by contrasting tumor with
      constitutional genotype in an SDHD carrier — and identifies the lost
      chromosome as the maternal one, which is the observation the
      parent-of-origin knowledge gap in this entry turns on.
  - reference: PMID:11605159
    reference_title: The R22X mutation of the SDHD gene in hereditary paraganglioma abolishes the enzymatic activity of complex II in the mitochondrial respiratory chain and activates the hypoxia pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assessment of the activity of respiratory-chain enzymes showed a complete
      and selective loss of complex II enzymatic activity in the inherited
      pheochromocytoma, that was not detected in six sporadic pheochromocytomas.
    explanation: >-
      Confirms at the enzyme level that the tumor cell has lost succinate
      dehydrogenase function completely, which is the biallelic state this node
      asserts, and shows the loss is specific to the inherited tumor.
  - reference: PMID:11404820
    reference_title: Gene mutations in the succinate dehydrogenase subunit SDHB cause susceptibility to familial pheochromocytoma and to familial paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings extend the link between mitochondrial dysfunction and
      tumorigenesis and suggest that germline SDHB mutations are an important
      cause of pheochromocytoma susceptibility.
    explanation: >-
      Supports the broader link between loss of this mitochondrial enzyme and
      tumorigenesis in the lineage. Note this sentence establishes
      susceptibility, not the biallelic state; the two preceding items carry
      that claim.
  downstream:
  - target: Succinate Accumulation
    description: >-
      With the enzyme absent, its substrate accumulates and escapes to the
      cytosol.

- name: Succinate Accumulation
  conforms_to: "oncometabolite_dioxygenase_inhibition#Oncometabolite Accumulation"
  description: >-
    Succinate builds up as a direct result of succinate dehydrogenase inhibition
    and moves from the mitochondrion to the cytosol, where it is available to act
    on 2-oxoglutarate-dependent enzymes. This mitochondrion-to-cytosol step is
    what converts a metabolic lesion into a signalling lesion.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:15652751
    reference_title: Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-alpha prolyl hydroxylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we describe a mitochondrion-to-cytosol signaling pathway that links
      mitochondrial dysfunction to oncogenic events: succinate, which
      accumulates as a result of SDH inhibition, inhibits HIF-alpha prolyl
      hydroxylases in the cytosol, leading to stabilization and activation of
      HIF-1alpha.
    explanation: >-
      Establishes succinate accumulation as the consequence of SDH inhibition
      and its translocation to the cytosol as the signalling step.
  downstream:
  - target: Succinate-Mediated Dioxygenase Inhibition
    description: >-
      Cytosolic and nuclear succinate competes with 2-oxoglutarate at the shared
      dioxygenase active site.

- name: Succinate-Mediated Dioxygenase Inhibition
  conforms_to: "oncometabolite_dioxygenase_inhibition#Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases"
  description: >-
    Accumulated succinate inhibits 2-oxoglutarate-dependent dioxygenases,
    including the HIF prolyl hydroxylases and the histone and DNA demethylases.
    Because inhibition is at the shared cofactor site it is not selective for one
    target, which is why a single enzyme deficiency produces simultaneous
    pseudohypoxic and epigenetic phenotypes in these tumors.
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: 2-oxoglutarate-dependent dioxygenase activity
    term:
      id: GO:0016706
      label: 2-oxoglutarate-dependent dioxygenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:23707781
    reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Succinate accumulation in SDH-deficient mouse chromaffin cells led to DNA
      hypermethylation by inhibition of 2-OG-dependent histone and DNA
      demethylases and established a migratory phenotype reversed by decitabine
      treatment.
    explanation: >-
      Demonstrates dioxygenase inhibition by succinate in the relevant cell
      lineage, together with its epigenetic and phenotypic consequences.
      Evidence source is IN_VITRO (cultured mouse chromaffin cells).
  downstream:
  - target: Pseudohypoxic HIF Stabilization in SDH-Deficient Cells
    description: >-
      Loss of prolyl hydroxylase activity leaves HIF-alpha unhydroxylated and
      stable in normoxia.
    hypothesis_groups:
    - hif_pseudohypoxia_driver
  - target: Hypermethylator Phenotype and Neuroendocrine Differentiation Block
    description: >-
      Loss of TET and Jumonji demethylase activity allows DNA and histone methyl
      marks to accumulate genome-wide.
    hypothesis_groups:
    - epigenetic_hypermethylation_driver

- name: Pseudohypoxic HIF Stabilization in SDH-Deficient Cells
  conforms_to: "oncometabolite_dioxygenase_inhibition#Pseudohypoxic HIF Stabilization"
  description: >-
    HIF-alpha escapes VHL-dependent degradation and drives the hypoxia
    transcriptional programme despite adequate oxygen. This is the mechanistic
    explanation for the striking vascularity of paraganglioma and
    pheochromocytoma arising without any VHL mutation, and the point at which
    SDHx disease converges phenotypically on von Hippel-Lindau disease from the
    opposite direction.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cellular response to decreased oxygen levels
    term:
      id: GO:0036294
      label: cellular response to decreased oxygen levels
    modifier: INCREASED
  evidence:
  - reference: PMID:15652751
    reference_title: Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-alpha prolyl hydroxylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest a mechanistic link between SDH mutations and
      HIF-1alpha induction, providing an explanation for the highly vascular
      tumors that develop in the absence of VHL mutations.
    explanation: >-
      Directly supports both the HIF stabilization and its proposed explanation
      of the vascular phenotype in SDH-mutant tumors.
  downstream:
  - target: Paraganglioma and Pheochromocytoma Development
    description: >-
      Constitutive hypoxia-response transcription supports the vascular,
      metabolically reprogrammed tumor phenotype.

- name: Hypermethylator Phenotype and Neuroendocrine Differentiation Block
  conforms_to: "oncometabolite_dioxygenase_inhibition#Impaired Demethylation and Genome-Wide Hypermethylation"
  description: >-
    Methylome analysis of a large paraganglioma cohort resolves three stable
    clusters, and SDHx-mutated tumors form a distinct hypermethylator group in
    which the genes specifying neuroendocrine differentiation are downregulated.
    The severity of silencing is genotype-dependent and clinically consequential:
    it is most marked in SDHB-mutated tumors, which are also the most malignant,
    which is the strongest available argument that the epigenetic branch — not
    the pseudohypoxic one — is what determines behaviour.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: chromosomal 5-methylcytosine DNA demethylation pathway
    term:
      id: GO:0141166
      label: chromosomal 5-methylcytosine DNA demethylation pathway
    modifier: DECREASED
  - preferred_term: demethylation
    term:
      id: GO:0070988
      label: demethylation
    modifier: DECREASED
  evidence:
  - reference: PMID:23707781
    reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SDHx-related tumors displayed a hypermethylator phenotype, associated with
      downregulation of key genes involved in neuroendocrine differentiation.
    explanation: >-
      Establishes the hypermethylator phenotype and its differentiation
      consequence in human SDHx paraganglioma.
  - reference: PMID:23707781
    reference_title: SDH mutations establish a hypermethylator phenotype in paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epigenetic silencing was particularly severe in SDHB-mutated tumors,
      potentially explaining their malignancy.
    explanation: >-
      Ties the severity of the epigenetic branch to the SDHB genotype and to
      malignant behaviour, which is the genotype-phenotype claim made here. Note
      the source hedges ("potentially explaining"), and this entry does not
      assert the link as established.
  downstream:
  - target: Paraganglioma and Pheochromocytoma Development
    description: >-
      Silencing of differentiation programmes locks cells in a progenitor-like,
      migration-competent state.

- name: Paraganglioma and Pheochromocytoma Development
  conforms_to: "germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor Spectrum"
  description: >-
    The clinical output: parasympathetic paragangliomas of the head and neck —
    most characteristically of the carotid body, an oxygen-sensing chemoreceptive
    organ whose normal physiology also depends on the affected complex — and
    sympathetic paraganglioma and adrenal pheochromocytoma with catecholamine
    excess. Tumors are frequently multiple and may be bilateral, and present
    earlier than their sporadic counterparts. Anatomical distribution and
    metastatic risk are genotype-dependent, with SDHB carrying the highest risk
    of malignant behaviour.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:10657297
    reference_title: "Mutations in SDHD, a mitochondrial complex II gene, in hereditary paraganglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary paraganglioma (PGL) is characterized by the development of
      benign, vascularized tumors in the head and neck. The most common tumor
      site is the carotid body (CB), a chemoreceptive organ that senses oxygen
      levels in the blood.
    explanation: >-
      Defines the characteristic tumor type and site, and names the oxygen-sensing
      physiology of the carotid body that makes this lineage's vulnerability to a
      pseudohypoxic lesion notable.
  - reference: PMID:10657297
    reference_title: "Mutations in SDHD, a mitochondrial complex II gene, in hereditary paraganglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that mitochondria play an important role in the
      pathogenesis of certain tumors and that cybS plays a role in normal CB
      physiology.
    explanation: >-
      Supports both the tumorigenic role of the mitochondrial lesion and the
      normal carotid-body function of the affected subunit.
phenotypes:
- category: Endocrine
  name: Pheochromocytoma
  description: >-
    Catecholamine-secreting tumor of adrenal medullary chromaffin cells; may be
    bilateral, and is a recognized cause of secondary hypertension.
  phenotype_term:
    preferred_term: Pheochromocytoma
    term:
      id: HP:0002666
      label: Pheochromocytoma
  evidence:
  - reference: PMID:11404820
    reference_title: Gene mutations in the succinate dehydrogenase subunit SDHB cause susceptibility to familial pheochromocytoma and to familial paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inactivating SDHB mutations were detected in two of the five kindreds with
      familial pheochromocytoma, two of the three kindreds with pheochromocytoma
      and paraganglioma susceptibility, and 1 of the 24 cases of sporadic
      pheochromocytoma.
    explanation: >-
      Directly ties pheochromocytoma to germline SDHB variants in affected

mechanistic_hypotheses:
- hypothesis_group_id: aberrant_host_response_model
  hypothesis_label: CRPS as an aberrant host response to tissue injury rather than a disease of the injury
  status: CANONICAL
  description: >-
    The organizing framework. The inciting trauma is often trivial and is
    always common; CRPS is rare. What distinguishes patients is therefore the
    response, not the injury — an exaggerated and self-sustaining
    inflammatory, vasomotor, and neuroplastic reaction whose three pathways
    are activated to different degrees in different people. This is what the
    entry's branching pathograph encodes, and it is also why the clinical
    picture is so heterogeneous that a four-domain criteria set was needed to
    capture it.
  evidence:
  - reference: PMID:21683929
    reference_title: Clinical features and pathophysiology of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, the evidence points to CRPS being a multifactorial disorder
      that is associated with an aberrant host response to tissue injury.
    explanation: >-
      States the framing this hypothesis group is named for.
  - reference: PMID:21683929
    reference_title: Clinical features and pathophysiology of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variation in susceptibility to perturbed regulation of any of the underlying
      biological pathways probably accounts for the clinical heterogeneity of
      CRPS.
    explanation: >-
      Supplies the corollary the pathograph is built on — parallel pathways with
      variable activation, rather than one obligatory chain.
- hypothesis_group_id: autoimmune_model
  hypothesis_label: Autoantibodies against autonomic receptors as a pathogenic, IL-1-dependent maintaining loop
  status: CANONICAL
  description: >-
    The strongest mechanistic result in the modern CRPS literature, and the
    reason this is not merely an inflammation story. Functionally active IgG
    against the beta-2 adrenergic and muscarinic-2 receptors is present in a
    subset of patients; transferring patient IgG into mice with a plantar
    incision produces prolonged swelling and stable hyperalgesia together with
    sustained microglial and astrocyte activation. Crucially the experiment
    includes its own mechanistic rescue: IL-1 knockout or IL-1 receptor
    blockade prevents the transferred phenotype, and blockade started eight
    days after incision reverses it. Curated as CANONICAL for that causal
    structure, with the caveat that the autoantibodies define a subset rather
    than all patients.
  evidence:
  - reference: PMID:21816540
    reference_title: Autoimmunity against the β2 adrenergic receptor and muscarinic-2 receptor in complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we demonstrate the presence of autoantibodies in a subset of CRPS
      patients with agonistic-like properties on the β(2) adrenergic receptor
      and/or the muscarinic-2 receptor.
    explanation: >-
      Establishes the autoantibodies and their targets in patients, with the
      "subset" qualifier this entry preserves.
  - reference: PMID:31182576
    reference_title: Transfer of complex regional pain syndrome to mice via human autoantibodies is mediated by interleukin-1-induced mechanisms.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CRPS IgG significantly increased and prolonged swelling and induced stable
      hyperalgesia of the incised paw compared with IgG from healthy controls.
    explanation: >-
      The transfer result that converts the autoantibody finding from an
      association into a causal claim.
  - reference: PMID:31182576
    reference_title: Transfer of complex regional pain syndrome to mice via human autoantibodies is mediated by interleukin-1-induced mechanisms.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic deletion of interleukin-1 (IL-1) using IL-1αβ knockout (KO) mice and
      perioperative IL-1 receptor type 1 (IL-1R1) blockade with the drug anakinra,
      but not treatment with the glucocorticoid prednisolone, prevented these
      changes.
    explanation: >-
      The mechanistic rescue that identifies IL-1 as the mediator, with a
      negative control arm (prednisolone) that rules out generic
      anti-inflammatory action.
- hypothesis_group_id: maladaptive_neuroplasticity_model
  hypothesis_label: Maladaptive cortical reorganization coupled to symptom severity
  status: CANONICAL
  description: >-
    Above the spinal cord, the somatosensory representation of the affected
    hand shrinks and shifts toward the lip representation. What makes this more
    than an epiphenomenon is that the magnitude of reorganization correlates
    with CRPS pain and, most strongly, with mechanical hyperalgesia — and that
    the rehabilitative treatments aimed at this level (graded motor imagery,
    mirror therapy) have a real effect on pain. The direction of causation
    between reorganization and symptom is not settled by the correlational
    imaging alone, which is why the treatment evidence is curated alongside it.
  evidence:
  - reference: PMID:14694034
    reference_title: Patterns of cortical reorganization in complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors found a significant shrinkage of the extension of the cortical
      hand representation for the CRPS affected side.
    explanation: >-
      The primary magnetoencephalography finding this hypothesis rests on.
  - reference: PMID:14694034
    reference_title: Patterns of cortical reorganization in complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cortical reorganization correlated with the amount of CRPS pain (r =
      0.792), as measured by the McGill questionnaire, and the extent of
      mechanical hyperalgesia (r = 0.860).
    explanation: >-
      Quantifies the coupling to symptom severity that distinguishes this from an
      incidental imaging difference.
  - reference: PMID:31980452
    reference_title: CRPS Is Not Associated with Altered Sensorimotor Cortex GABA or Glutamate.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite this acuity deficit, CRPS was not associated with altered GABA or
      glutamate concentrations within the sensorimotor cortex on either the side
      that represents the affected or unaffected hand.
    explanation: >-
      Refutes the specific disinhibition account of cortical reorganization —
      reduced total cortical GABA — while leaving the reorganization finding
      itself standing. The model is retained as CANONICAL for the map change and
      explicitly not for a GABA mechanism.
  - reference: PMID:31980452
    reference_title: CRPS Is Not Associated with Altered Sensorimotor Cortex GABA or Glutamate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that individuals with upper limb CRPS displayed reduced tactile
      acuity in the painful hand, compared with the nonpainful hand and pain-free
      control subjects.
    explanation: >-
      Independently replicates the sensory-cortical deficit this hypothesis
      predicts, in the same study that refutes the GABA explanation for it.
pathophysiology:
- name: Peripheral Tissue Trauma
  biological_scale: TISSUE
  description: >-
    The initiating event, and almost always a common one — distal limb
    fracture above all, with sprain, crush, surgery, and immobilization also
    recognized. In the Olmsted County population study every identified case
    reported an antecedent event and fracture was the trigger in 46%. Because
    the trigger is ubiquitous and the syndrome is rare, this node is necessary
    but far from sufficient, which is the premise of the whole entry.
  locations:
  - preferred_term: manus
    term:
      id: UBERON:0002398
      label: manus
  evidence:
  - reference: PMID:12749974
    reference_title: 'Complex regional pain syndrome type I: incidence and prevalence in Olmsted county, a population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases reported an antecedent event and fracture was the most common
      trigger (46%).
    explanation: >-
      Population-based evidence that an antecedent injury is universal and that
      fracture dominates it.
  downstream:
  - target: Neurogenic Inflammation
    causal_link_type: DIRECT
    hypothesis_groups:
    - aberrant_host_response_model
    description: >-
      Mechanical and chemical activation of nociceptor terminals in the injured
      tissue releases the neuropeptides that produce the local inflammatory
      response.
- name: Neurogenic Inflammation
  biological_scale: TISSUE
  description: >-
    Activated C-fibre nociceptors release substance P and CGRP into the injured
    limb, producing vasodilation, plasma extravasation, oedema, erythema, and
    increased sweating, and recruiting local immune cells. This node is the
    direct substrate of three of the four Budapest domains — vasomotor,
    sudomotor/oedema, and part of the trophic — and it is what makes early
    CRPS a warm, swollen limb rather than a purely sensory complaint.
  cell_types:
  - preferred_term: sensory neuron of dorsal root ganglion
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  biological_processes:
  - preferred_term: neuropeptide signaling pathway
    term:
      id: GO:0007218
      label: neuropeptide signaling pathway
    modifier: INCREASED
  - preferred_term: positive regulation of vascular permeability
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
    modifier: INCREASED
  evidence:
  - reference: PMID:21683929
    reference_title: Clinical features and pathophysiology of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compelling evidence implicates biological pathways that underlie aberrant
      inflammation, vasomotor dysfunction, and maladaptive neuroplasticity in the
      clinical features of CRPS.
    explanation: >-
      Names aberrant inflammation and vasomotor dysfunction as evidenced pathways
      underlying the clinical features this node produces.
  downstream:
  - target: Autoantibody Production Against Autonomic Receptors
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - autoimmune_model
    description: >-
      How local neuro-immune activation breaks tolerance to autonomic receptor
      epitopes is not established; the edge is recorded at that strength.
  - target: Spinal Glial Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - aberrant_host_response_model
    description: >-
      Sustained nociceptive input from the inflamed limb drives the spinal
      changes curated downstream.
  - target: Sympathetic Vasomotor Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - aberrant_host_response_model
    description: >-
      The transition from the early vasodilated limb to the later cold,
      cyanotic one accompanies the inflammatory response, but the mechanism of
      the switch is not resolved.
  - target: Regional Bone Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - aberrant_host_response_model
    description: >-
      Local inflammatory cytokines are the proposed route to the periarticular
      bone loss that three-phase scintigraphy detects.
- name: Autoantibody Production Against Autonomic Receptors
  biological_scale: MOLECULAR
  description: >-
    Functionally active IgG directed at the second extracellular loop of the
    beta-2 adrenergic and muscarinic-2 receptors, with agonist-like properties
    in a cardiomyocyte bioassay. These are not bystander antibodies: they act
    on the receptors, they are found in a defined subset of patients, and their
    transfer into injured mice reproduces the syndrome. The node is the hinge
    of the entry — it converts a post-traumatic inflammatory response into a
    self-sustaining one.
  cell_types:
  - preferred_term: sympathetic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  evidence:
  - reference: PMID:21816540
    reference_title: Autoimmunity against the β2 adrenergic receptor and muscarinic-2 receptor in complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified these autoantibodies as immunoglobulin G directed against
      peptide sequences from the second extracellular loop of these receptors.
    explanation: >-
      Identifies the molecular target epitopes that define this node.
  - reference: PMID:21816540
    reference_title: Autoimmunity against the β2 adrenergic receptor and muscarinic-2 receptor in complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of functionally active autoantibodies in serum samples
      from CRPS patients supports an autoimmune pathogenesis of CRPS.
    explanation: >-
      States the functional activity, which is what separates these from
      incidental autoreactivity.
  - reference: PMID:25741131
    reference_title: The prevalence of autoantibodies in complex regional pain syndrome type I.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty seven (33%) of the 82 CRPS patients of whom serum was available
      showed a positive ANA test. This prevalence is significantly higher than in
      the general population.
    explanation: >-
      Quantifies the autoreactive subset this node applies to, using a general
      autoimmunity screen rather than the receptor-specific assay — which is why
      it is PARTIAL: it bounds the size of the subset without confirming the
      specific antibodies.
  downstream:
  - target: Spinal Glial Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - autoimmune_model
    description: >-
      Patient IgG transferred to incised mice produces sustained microglial and
      astrocyte activation in the dorsal horn and pain-related brain regions,
      with microglia-derived IL-1beta as a demonstrated intermediate.
  - target: Sympathetic Vasomotor Dysregulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - autoimmune_model
    description: >-
      The antibodies are agonist-like at receptors on autonomic neurons, so
      their action on vasomotor control is direct rather than mediated.
- name: Spinal Glial Activation
  biological_scale: CELLULAR
  description: >-
    Microglia and astrocytes in the dorsal horn and in pain-related brain
    regions become and remain activated. The passive transfer experiment shows
    this state persisting long after the peripheral inflammatory response has
    resolved, and identifies microglia-derived IL-1beta as the mediator — with
    IL-1 receptor blockade both preventing it and reversing an already
    established phenotype. It is curated separately from the sensitization it
    produces because the two have different drug targets: IL-1 blockade acts
    here, NMDA antagonism acts downstream.
  locations:
  - preferred_term: dorsal horn of spinal cord
    term:
      id: UBERON:0002256
      label: dorsal horn of spinal cord
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: cellular response to interleukin-1
    term:
      id: GO:0071347
      label: cellular response to interleukin-1
    modifier: INCREASED
  evidence:
  - reference: PMID:31182576
    reference_title: Transfer of complex regional pain syndrome to mice via human autoantibodies is mediated by interleukin-1-induced mechanisms.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After a short-lasting paw inflammatory response in all groups, CRPS
      IgG-injected mice displayed sustained, profound microglia and astrocyte
      activation in the dorsal horn of the spinal cord and pain-related brain
      regions, indicating central sensitization.
    explanation: >-
      Reports exactly the cellular state and location this node describes, and
      its persistence beyond the peripheral response.
  - reference: PMID:31182576
    reference_title: Transfer of complex regional pain syndrome to mice via human autoantibodies is mediated by interleukin-1-induced mechanisms.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, with the generation of an IL-1β floxed(fl/fl) mouse line, we
      demonstrated that CRPS IgG-induced changes are in part mediated by
      microglia-derived IL-1β, suggesting that both peripheral and central
      inflammatory mechanisms contribute to the transferred disease phenotype.
    explanation: >-
      Identifies the cellular source of the mediating cytokine, which is what
      makes this a mechanism rather than a description.
  downstream:
  - target: Central Sensitization
    causal_link_type: DIRECT
    hypothesis_groups:
    - autoimmune_model
    - aberrant_host_response_model
    description: >-
      Activated glia release IL-1beta and other mediators into the dorsal horn,
      lowering the threshold for nociceptive transmission — the step the IL-1
      rescue experiment isolates.
- name: Central Sensitization
  biological_scale: ORGANISM
  description: >-
    An NMDA-receptor-dependent lowering of the threshold for nociceptive
    transmission, so that innocuous input is experienced as painful and painful
    input as more so, over a territory well beyond the original injury. It is
    the state that allodynia and hyperalgesia report, and the node ketamine
    targets: the NMDA receptor is the reason a dissociative anaesthetic has an
    analgesic role in this disease at all.
  locations:
  - preferred_term: dorsal horn of spinal cord
    term:
      id: UBERON:0002256
      label: dorsal horn of spinal cord
  evidence:
  - reference: PMID:38828388
    reference_title: Mechanisms of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key mechanisms underlying clinical manifestations include peripheral and
      central sensitization, sympathetic dysregulation, and alterations in
      somatosensory processing.
    explanation: >-
      Names central sensitization among the key mechanisms underlying the
      clinical picture.
  - reference: PMID:19783371
    reference_title: 'Outpatient intravenous ketamine for the treatment of complex regional pain syndrome: a double-blind placebo controlled study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathophysiology of CRPS is not known but both clinical and experimental
      evidence demonstrate the important of the NMDA receptor and glial activation
      in its induction and maintenance.
    explanation: >-
      States the NMDA-receptor dependence that defines this node and motivates the
      ketamine trial curated under treatments.
  downstream:
  - target: Cortical Somatosensory Reorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - maladaptive_neuroplasticity_model
    description: >-
      Persistent altered afferent input is the presumed driver of the cortical
      map change; the intermediates are not established, and the direction of
      causation between the two is itself an open question.
- name: Sympathetic Vasomotor Dysregulation
  biological_scale: ORGANISM
  description: >-
    Disturbed sympathetic vasomotor control of the affected limb, producing the
    temperature and colour asymmetry of the vasomotor Budapest domain: an early
    warm, vasodilated phase and a later cold, cyanotic one. Importantly, not
    all CRPS pain is sympathetically maintained — a subset is sympathetically
    independent — which is the clearest explanation for why sympathetic
    blockade helps some patients and not others, and why this entry does not
    curate sympathetic block as a general treatment.
  cell_types:
  - preferred_term: sympathetic neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  evidence:
  - reference: PMID:38828388
    reference_title: Mechanisms of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key mechanisms underlying clinical manifestations include peripheral and
      central sensitization, sympathetic dysregulation, and alterations in
      somatosensory processing.
    explanation: >-
      Names sympathetic dysregulation among the key mechanisms underlying the
      clinical manifestations, which is what this node records.
- name: Cortical Somatosensory Reorganization
  biological_scale: TISSUE
  description: >-
    The cortical representation of the affected hand in primary somatosensory
    cortex shrinks and its centre shifts toward the lip representation, while
    tactile-evoked S1 responses on the affected side are increased. The extent
    of reorganization correlates with pain and, more strongly, with mechanical
    hyperalgesia, and mechanical hyperalgesia is its best single predictor.
    This node is the target of the rehabilitative treatments — graded motor
    imagery and mirror therapy — that work by restoring coherent
    sensorimotor representation rather than by any pharmacological action.
  locations:
  - preferred_term: primary somatosensory cortex
    term:
      id: UBERON:0008933
      label: primary somatosensory cortex
  evidence:
  - reference: PMID:14694034
    reference_title: Patterns of cortical reorganization in complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The center of the hand was shifted toward the cortical representation of the
      lip.
    explanation: >-
      The spatial distortion component of the reorganization this node describes.
  - reference: PMID:14694034
    reference_title: Patterns of cortical reorganization in complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using multiple regression analysis, the best predictor for the plastic
      changes was found to be mechanical hyperalgesia.
    explanation: >-
      Identifies which clinical feature the cortical change tracks most closely.
- name: Regional Bone Loss
  biological_scale: TISSUE
  description: >-
    Patchy periarticular demineralization of the affected region — the finding
    Sudeck originally described as acute inflammatory bone atrophy, and the
    structural correlate of the intense periarticular uptake on the delayed
    phase of three-phase bone scintigraphy. It is curated as a distinct node
    because it is the target of the treatment with the strongest randomized
    evidence in this disease: intravenous bisphosphonate.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: positive regulation of osteoclast differentiation
    term:
      id: GO:0045672
      label: positive regulation of osteoclast differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:38828388
    reference_title: Mechanisms of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary pathology of both types of CRPS (Type I, also known as reflex
      sympathetic dystrophy, RSD; Type II, also known as causalgia) is featured by
      allodynia, edema, changes in skin color and temperature, and dystrophy,
      predominantly affecting extremities.
    explanation: >-
      Places dystrophic change of the extremity among the primary pathology, the
      regional expression of which this node records.
  notes: >-
    The osteoclast/GO annotation states the cell type and process through which
    regional bone loss occurs. The specific cytokine-RANKL cascade proposed for
    CRPS in the deep-research report was extrapolated from the general
    inflammatory bone-loss literature rather than from CRPS-specific primary
    data, and is deliberately not asserted here.
phenotypes:
- category: Neurologic
  name: Continuing pain disproportionate to the inciting event
  description: >-
    The entry criterion of the Budapest definition and the feature present in
    essentially every patient: regional pain that outgrows and outlasts the
    injury that started it.
  phenotype_term:
    preferred_term: Chronic pain
    term:
      id: HP:0012532
      label: Chronic pain
    temporality: CHRONIC
  evidence:
  - reference: PMID:38828388
    reference_title: Mechanisms of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complex Regional Pain Syndrome (CRPS) is a chronic pain disorder
      characterized by a diverse array of symptoms, including pain that is
      disproportionate to the initial triggering event, accompanied by autonomic,
      sensory, motor, and sudomotor disturbances.
    explanation: >-
      Definitional statement of the cardinal phenotype.
- category: Neurologic
  name: Allodynia
  description: >-
    Pain evoked by stimuli that are not normally painful — light touch,
    clothing, moving air — extending beyond the territory of the original
    injury. It is the clinical readout of the central sensitization node.
  phenotype_term:
    preferred_term: Allodynia
    term:
      id: HP:0012533
      label: Allodynia
  evidence:
  - reference: PMID:38828388
    reference_title: Mechanisms of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary pathology of both types of CRPS (Type I, also known as reflex
      sympathetic dystrophy, RSD; Type II, also known as causalgia) is featured by
      allodynia, edema, changes in skin color and temperature, and dystrophy,
      predominantly affecting extremities.
    explanation: >-
      Names allodynia as a primary pathological feature of the syndrome.
- category: Vascular
  name: Vasomotor asymmetry
  description: >-
    Temperature and skin-colour asymmetry between the affected and unaffected
    limb — warm and red early, cold and cyanotic later. Vasomotor features were
    the most commonly present signs in the Olmsted County population series.
  phenotype_term:
    preferred_term: Abnormality of temperature regulation
    term:
      id: HP:0004370
      label: Abnormality of temperature regulation
  notes: >-
    HP:0004370 is broader than the claim — it also covers fever and hypothermia —
    but HPO has no term for limb temperature or colour asymmetry, and no term
    beats a bad one. The `preferred_term` and description carry the specificity.
  evidence:
  - reference: PMID:12749974
    reference_title: 'Complex regional pain syndrome type I: incidence and prevalence in Olmsted county, a population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Excellent concordance was found between symptoms and signs and vasomotor
      symptoms were the most commonly present.
    explanation: >-
      Population-based ascertainment of vasomotor features as the most frequently
      present domain.
- category: Vascular
  name: Limb oedema
  description: >-
    Swelling of the affected limb, part of the sudomotor/oedema Budapest domain
    and a direct consequence of the plasma extravasation produced by neurogenic
    inflammation. In the mouse transfer model, CRPS IgG both increased and
    prolonged exactly this feature.
  phenotype_term:
    preferred_term: Edema
    term:
      id: HP:0000969
      label: Edema
  evidence:
  - reference: PMID:38828388
    reference_title: Mechanisms of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary pathology of both types of CRPS (Type I, also known as reflex
      sympathetic dystrophy, RSD; Type II, also known as causalgia) is featured by
      allodynia, edema, changes in skin color and temperature, and dystrophy,
      predominantly affecting extremities.
    explanation: >-
      Names oedema among the primary pathological features.
- category: Integumentary
  name: Sudomotor abnormality
  description: >-
    Asymmetric sweating — usually hyperhidrosis of the affected limb — forming
    the other half of the sudomotor/oedema domain, and objectively measurable
    by quantitative sudomotor axon reflex testing.
  phenotype_term:
    preferred_term: Hyperhidrosis
    term:
      id: HP:0000975
      label: Hyperhidrosis
  evidence:
  - reference: PMID:38828388
    reference_title: Mechanisms of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characterized by disproportionate pain relative to the initial injury or
      trauma, along with a myriad of autonomic, sensory, motor, and sudomotor
      disturbances, CRPS presents significant challenges in diagnosis and
      management.
    explanation: >-
      Names sudomotor disturbance as a defining domain of the syndrome.
- category: Musculoskeletal
  name: Reduced range of motion
  description: >-
    Restricted active and passive movement of the affected limb, part of the
    motor/trophic domain, and both a consequence of pain-related disuse and a
    driver of the maladaptive plasticity that sustains it.
  phenotype_term:
    preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: PMID:21683929
    reference_title: Clinical features and pathophysiology of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complex regional pain syndrome (CRPS) is characterized by pain, in
      combination with sensory, autonomic, trophic and motor abnormalities.
    explanation: >-
      Establishes motor abnormality as a defining component of the syndrome.
- category: Neurologic
  name: Dystonia of the affected limb
  description: >-
    Fixed dystonic posturing, most often of the hand or foot. It is a minority
    feature, occurs disproportionately in familial and multi-limb cases, and is
    the presentation for which HLA-DQ8 association has been reported.
  phenotype_term:
    preferred_term: Dystonia
    term:
      id: HP:0001332
      label: Dystonia
  evidence:
  - reference: PMID:21683929
    reference_title: Clinical features and pathophysiology of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complex regional pain syndrome (CRPS) is characterized by pain, in
      combination with sensory, autonomic, trophic and motor abnormalities.
    explanation: >-
      Covers the motor abnormality class to which the dystonic presentation
      belongs; the frequency and familial association are recorded in the
      description rather than asserted as evidenced here.
- category: Musculoskeletal
  name: Regional osteoporosis
  description: >-
    Patchy periarticular bone loss in the affected region — Sudeck's original
    observation — detected as intense periarticular uptake on the delayed phase
    of three-phase bone scintigraphy.
  phenotype_term:
    preferred_term: Localized osteoporosis
    term:
      id: HP:0040161
      label: Localized osteoporosis
  evidence:
  - reference: PMID:12749974
    reference_title: 'Complex regional pain syndrome type I: incidence and prevalence in Olmsted county, a population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three phase bone scan and autonomic testing diagnosed the condition in >80%
      of cases.
    explanation: >-
      Supports the diagnostic yield of the bone scan whose delayed-phase
      periarticular uptake is the imaging correlate of this phenotype.
genetic:
- name: HLA-DQB1
  gene_term:
    preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  relationship_type: SUSCEPTIBILITY
  notes: >-
    HLA-DQ8, encoded at HLA-DQB1, is the most consistently reported MHC
    association with CRPS, particularly with the dystonic presentation, and
    several other class II alleles have been reported less consistently. The
    gene is recorded here as a susceptibility locus without an evidence item:
    the deep-research report cited the association only to a journal URL, and no
    citable primary source with a verifiable quote was established during
    curation. Treat as a curation lead — see the corresponding `discussions`
    entry. CRPS is not Mendelian and no causal gene exists.
environmental:
- name: Distal limb fracture
  description: >-
    The commonest inciting event. Fracture accounted for 46% of triggers in the
    Olmsted County series, and distal radius fracture is the classic setting —
    which is also why the disease has a genuine primary-prevention option, since
    that population is identifiable at the moment of injury.
  effect: Precipitates complex regional pain syndrome type 1 in a susceptible host
  influences_mechanisms:
  - target: Peripheral Tissue Trauma
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The fracture is the tissue trauma node; the link makes the disease-level
      exposure explicit in the pathograph rather than leaving it implied.
    evidence:
    - reference: PMID:12749974
      reference_title: 'Complex regional pain syndrome type I: incidence and prevalence in Olmsted county, a population-based study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All cases reported an antecedent event and fracture was the most common
        trigger (46%).
      explanation: >-
        Establishes fracture as the dominant trigger in a population-based
        ascertainment.
  evidence:
  - reference: PMID:12749974
    reference_title: 'Complex regional pain syndrome type I: incidence and prevalence in Olmsted county, a population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

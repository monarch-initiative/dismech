name: Complex Regional Pain Syndrome Type 1
creation_date: '2026-08-25T00:00:00Z'
category: Neurologic
synonyms:
- CRPS type I
- CRPS-I
- reflex sympathetic dystrophy
- RSD
- Sudeck atrophy
- algodystrophy
- shoulder-hand syndrome
description: >-
  Complex regional pain syndrome type 1 (CRPS-I) is a regional pain disorder in
  which continuing pain disproportionate to an inciting event is accompanied by
  sensory, vasomotor, sudomotor/oedema, and motor/trophic abnormalities in the
  affected limb, without a demonstrable major nerve lesion. That last clause is
  the whole of the distinction from CRPS type 2, and it is a clinical rather
  than a mechanistic boundary: skin biopsies and amputation specimens from
  chronic CRPS-I limbs show small-fibre degeneration, so the "no nerve lesion"
  criterion means no identifiable *major* lesion rather than an intact
  peripheral nervous system.

  The mechanism is a chain with an autoimmune amplifying loop. Tissue trauma —
  most often a distal fracture — activates nociceptors, which release substance
  P and CGRP and drive neurogenic inflammation: the warm, swollen, erythematous
  limb of early disease. In a susceptible host the response does not terminate.
  A majority of patients carry functionally active IgG autoantibodies against
  the beta-2 adrenergic and muscarinic-2 receptors on autonomic neurons, and
  passive transfer of patient IgG into incised mice reproduces the phenotype
  with sustained microglial and astrocyte activation — an effect that is
  IL-1-dependent and is both prevented and reversed by IL-1 receptor blockade.
  Central sensitization follows, and above it the somatosensory cortical
  representation of the affected limb shrinks and distorts in proportion to
  pain and mechanical hyperalgesia.

  Three things distinguish this entry from a generic chronic-pain entry. The
  autoantibody arm has causal rather than merely correlative evidence, from a
  transfer experiment with a mechanistic rescue. The cortical reorganization is
  quantitatively coupled to symptom severity. And the disorder is genuinely
  preventable in its commonest setting: vitamin C after wrist fracture reduces
  incidence, which is a rare thing to be able to say about a chronic pain
  syndrome.

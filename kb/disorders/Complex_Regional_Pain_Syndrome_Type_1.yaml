progression:
- phase: Resolution
  notes: >-
    Seventy-four percent of the population-based Olmsted County cohort
    underwent resolution, often spontaneously — a substantially more favourable
    course than tertiary referral series suggest, and the basis of the authors'
    caution against invasive treatment in most cases.
  evidence:
  - reference: PMID:12749974
    reference_title: 'Complex regional pain syndrome type I: incidence and prevalence in Olmsted county, a population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy-four percent of patients underwent resolution, often spontaneously.
    explanation: >-
      The population-based resolution rate recorded in this phase.
- phase: Paediatric course
  notes: >-
    CRPS in children and adolescents — more common in adolescent girls — carries
    a favourable prognosis with multidisciplinary care centred on intensive
    physiotherapy, which is a materially different outlook from the adult
    tertiary-referral picture.
  evidence:
  - reference: PMID:27130211
    reference_title: 'Pediatric complex regional pain syndrome: a review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prognosis in pediatric CRPS is favorable.
    explanation: >-
      States the paediatric prognosis this phase records.
  - reference: PMID:27130211
    reference_title: 'Pediatric complex regional pain syndrome: a review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard care consists of a multidisciplinary approach with the
      implementation of intensive physical therapy in conjunction with
      psychological counseling.
    explanation: >-
      Names the management that the favourable paediatric outcome is attributed
      to.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The burden is genuinely bimodal and the entry records that rather than
    averaging it. In a population-based cohort three of four patients resolved,
    often without intervention; but the patients who do not resolve develop
    chronic, disabling limb pain with functional loss and psychological
    comorbidity persisting for years. Ascertainment explains much of the
    apparent disagreement between community and referral series.
  evidence:
  - reference: PMID:12749974
    reference_title: 'Complex regional pain syndrome type I: incidence and prevalence in Olmsted county, a population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CRPS I is of low prevalence, more commonly affects women than men, the upper
      more than the lower extremity, and three out of four cases undergo
      resolution.
    explanation: >-
      The favourable end of the range, from an unselected population.
  - reference: PMID:21683929
    reference_title: Clinical features and pathophysiology of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A complex regional pain syndrome (CRPS)--multiple system dysfunction, severe
      and often chronic pain, and disability--can be triggered by a minor injury,
      a fact that has fascinated scientists and perplexed clinicians for decades.
    explanation: >-
      The severe end of the range, and the disproportion between trigger and
      outcome that defines the disorder.
  - reference: PMID:39315115
    reference_title: 'Complex Regional Pain Syndrome: a cross-sectional study of physical symptoms, disability, and psychological health in long term.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 9% of individuals with CRPS reported no residual pain or discomfort.
      Approximately 60% had problems in daily activities, 49% had sleeping
      problems, and 90% experienced moderate-extreme pain with 23% still on sick
      leave.
    explanation: >-
      Quantifies the residual burden a median of five years after diagnosis in
      those who remain in follow-up, which is the severe end this VARIABLE
      assessment spans.
diagnosis:
- name: Budapest criteria
  description: >-
    The IASP-adopted clinical criteria: continuing disproportionate pain, at
    least one reported symptom in three of the four domains (sensory,
    vasomotor, sudomotor/oedema, motor/trophic), at least one observed sign in
    two domains, and no better explanation. Their point is specificity: the
    earlier IASP criteria had sensitivity 1.00 with specificity 0.41, meaning
    they diagnosed CRPS in most patients who did not have it, and the four-domain
    structure is what recovered specificity without losing sensitivity.
  evidence:
  - reference: PMID:20493633
    reference_title: 'Validation of proposed diagnostic criteria (the "Budapest Criteria") for Complex Regional Pain Syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In comparison, the Budapest clinical criteria retained the exceptional
      sensitivity of the IASP criteria (0.99), but greatly improved upon the
      specificity (0.68).
    explanation: >-
      The validation result that establishes the criteria's operating
      characteristics.
  - reference: PMID:20493633
    reference_title: 'Validation of proposed diagnostic criteria (the "Budapest Criteria") for Complex Regional Pain Syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyses indicated that inclusion of four distinct CRPS components in the
      Budapest Criteria contributed to enhanced specificity.
    explanation: >-
      Attributes the improvement to the four-domain structure, which is the
      feature the entry's phenotype categories mirror.
- name: Three-phase bone scintigraphy
  description: >-
    Increased flow and blood-pool activity with intense periarticular uptake on
    the delayed phase in the affected region. Together with autonomic testing it
    identified over 80% of cases in the population-based series, making it the
    most useful objective adjunct — though it is supportive, not definitional,
    since the diagnosis remains clinical.
  evidence:
  - reference: PMID:12749974
    reference_title: 'Complex regional pain syndrome type I: incidence and prevalence in Olmsted county, a population-based study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three phase bone scan and autonomic testing diagnosed the condition in >80%
      of cases.
    explanation: >-
      Quantifies the diagnostic yield of the combination in an unselected
      population.
  - reference: PMID:24900016
    reference_title: Diagnostic performance of three-phase bone scan for complex regional pain syndrome type 1 with optimally modified image criteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the modified image criteria, the sensitivity and specificity of TPBS
      for diagnosing CRPS-1 were 80% and 72%, respectively.
    explanation: >-
      Gives the diagnostic accuracy of scintigraphy alone against Budapest-criteria
      diagnosis, which is the figure the Olmsted combined-yield line does not
      supply.
  - reference: PMID:24900016
    reference_title: Diagnostic performance of three-phase bone scan for complex regional pain syndrome type 1 with optimally modified image criteria.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both increased and decreased periarticular DU were significant image
      findings for CRPS-1 (CRPS-1 positive-rate = 73% in the increased DU group,
      75% in the decreased DU group).
    explanation: >-
      Qualifies the classical teaching: decreased periarticular delayed uptake is
      as informative as increased uptake, so the "intense uptake" pattern is not
      the only positive finding.
treatments:
- name: Intravenous neridronate
  description: >-
    An amino-bisphosphonate, and the intervention with the strongest randomized
    evidence in CRPS-I. In a multicentre double-blind placebo-controlled trial
    of 82 patients, four 100 mg infusions over ten days produced a substantially
    greater fall in visual analogue pain score than placebo, with the effect
    sustained, replicated in the open-label crossover of the former placebo
    group, and with no patient reporting CRPS-related symptoms a year later.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: neridronate
      term:
        id: NCIT:C66230
        label: Neridronic Acid
  target_mechanisms:
  - target: Regional Bone Loss
    treatment_effect: INHIBITS
    description: >-
      Bisphosphonates act on osteoclast-mediated bone resorption, which is the
      process this node describes; whether the analgesic benefit is entirely
      explained by that action or also involves an anti-inflammatory effect is
      not established by the trial.
    evidence:
    - reference: PMID:23204550
      reference_title: 'Treatment of complex regional pain syndrome type I with neridronate: a randomized, double-blind, placebo-controlled study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These results provide conclusive evidence that the use of bisphosphonates,
        at appropriate doses, is the treatment of choice for CRPS-I.
      explanation: >-
        The trial's own conclusion, linking the bisphosphonate drug class this
        node's biology predicts to clinical benefit.
  evidence:
  - reference: PMID:23204550
    reference_title: 'Treatment of complex regional pain syndrome type I with neridronate: a randomized, double-blind, placebo-controlled study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with acute CRPS-I, four i.v. infusions of neridronate 100 mg are
      associated with clinically relevant and persistent benefits.
    explanation: >-
      The randomized efficacy result underpinning this treatment entry.
  - reference: PMID:23204550
    reference_title: 'Treatment of complex regional pain syndrome type I with neridronate: a randomized, double-blind, placebo-controlled study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the open-extension phase in the formerly placebo group the results of
      treatment were superimposable on those seen during the blind phase in the
      active group.
    explanation: >-
      The internal replication that strengthens the result beyond a single
      between-group comparison.
- name: Intravenous ketamine
  description: >-
    An NMDA-receptor antagonist, and the treatment that targets the central
    sensitization node directly. In a randomized double-blind
    placebo-controlled trial, four-hour daily outpatient infusions for ten days
    produced statistically significant reductions in many pain parameters, with
    the placebo group showing no treatment effect in any parameter. The trial
    is small and its authors call explicitly for a larger one with higher doses
    and longer follow-up, and a 2025 systematic review characterizes the
    analgesia as strong but short-term with no long-term data — so this is
    curated as an evidenced treatment with an explicitly bounded claim.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ketamine
      term:
        id: CHEBI:6121
        label: ketamine
  target_mechanisms:
  - target: Central Sensitization
    treatment_effect: INHIBITS
    description: >-
      Ketamine antagonizes the NMDA receptor on which this node's sensitization
      depends. Unusually for this disease, the drug's molecular target and the
      node's defining mechanism are the same object.
    evidence:
    - reference: PMID:19783371
      reference_title: 'Outpatient intravenous ketamine for the treatment of complex regional pain syndrome: a double-blind placebo controlled study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ketamine is the most potent clinically available safe NMDA antagonist that
        has a well established role in the treatment of acute and chronic pain.
      explanation: >-
        Identifies the drug's molecular target as the receptor this node's
        mechanism turns on.
  evidence:
  - reference: PMID:19783371
    reference_title: 'Outpatient intravenous ketamine for the treatment of complex regional pain syndrome: a double-blind placebo controlled study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study showed that intravenous ketamine administered in an outpatient
      setting resulted in statistically significant (p<0.05) reductions in many
      pain parameters. It also showed that subjects in our placebo group
      demonstrated no treatment effect in any parameter.
    explanation: >-
      The randomized result with its negative-control arm, which is what makes
      this more than an open-label impression.
  - reference: PMID:40917914
    reference_title: 'The Analgesic Efficacy of Therapies Used for Complex Regional Pain Syndrome: A Systematic Review.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intravenous ketamine demonstrated strong short-term analgesia, though
      findings were limited by small samples, variable protocols, and lack of
      long-term data.
    explanation: >-
      Bounds the claim across the whole RCT literature rather than resting on the
      single trial above.
- name: Graded motor imagery and mirror therapy
  description: >-
    A sequenced rehabilitative program — limb laterality recognition, then
    explicit motor imagery, then mirror therapy — aimed at the cortical
    representation rather than at any peripheral target. It is curated with its
    evidence caveat: a systematic review supports an effect on pain and
    function, but the trial base is small and heterogeneous.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Cortical Somatosensory Reorganization
    treatment_effect: RESTORES
    description: >-
      The intervention is designed to re-establish a coherent sensorimotor
      representation of the affected limb, which is the node it targets; the
      inference that clinical benefit occurs through reversing reorganization is
      mechanistically motivated rather than directly demonstrated by the review.
    evidence:
    - reference: PMID:27858687
      reference_title: 'Update on the effects of graded motor imagery and mirror therapy on complex regional pain syndrome type 1: A systematic review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        GMI and MT can improve pain in patients with CRPS type 1; however, there is
        not sufficient evidence to recommend these therapies over other treatments
        given the small size and heterogeneity of the studied population.
      explanation: >-
        Supports the effect on pain while stating the evidential limitation this
        entry preserves rather than overselling.
  evidence:
  - reference: PMID:27858687
    reference_title: 'Update on the effects of graded motor imagery and mirror therapy on complex regional pain syndrome type 1: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GMI and MT can improve pain in patients with CRPS type 1; however, there is
      not sufficient evidence to recommend these therapies over other treatments
      given the small size and heterogeneity of the studied population.
    explanation: >-
      The systematic-review conclusion, quoted with its own qualifier.
- name: Vitamin C prophylaxis after wrist fracture
  description: >-
    The prevention arm, and the reason CRPS is unusual among chronic pain
    syndromes: a cheap supplement given after the commonest inciting injury
    lowers incidence. In a randomized multicentre dose-response trial of 416
    patients with 427 wrist fractures, vitamin C reduced CRPS-I compared
    with placebo (2.4% vs 10.1%), with no further benefit at 1500 mg.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vitamin C
      term:
        id: CHEBI:29073
        label: L-ascorbic acid
  target_mechanisms:
  - target: Neurogenic Inflammation
    treatment_effect: INHIBITS
    description: >-
      The proposed mechanism is antioxidant limitation of the exaggerated
      inflammatory response to the fracture. The trial establishes the clinical
      effect; the mechanistic attribution to this node is inference and is
      recorded as such rather than as a demonstrated action.
    evidence:
    - reference: PMID:17606778
      reference_title: 'Can vitamin C prevent complex regional pain syndrome in patients with wrist fractures? A randomized, controlled, multicenter dose-response study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Vitamin C reduces the prevalence of complex regional pain syndrome after
        wrist fractures.
      explanation: >-
        The clinical prevention effect; the mechanism attributed to this node is
        stated as inference in the link description.
  evidence:
  - reference: PMID:17606778
    reference_title: 'Can vitamin C prevent complex regional pain syndrome in patients with wrist fractures? A randomized, controlled, multicenter dose-response study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of complex regional pain syndrome was 2.4% (eight of 328) in
      the vitamin C group and 10.1% (ten of ninety-nine) in the placebo group
      (p=0.002); all of the affected patients were elderly women.
    explanation: >-
      The randomized effect size on CRPS prevalence that this prevention entry
      rests on.
animal_models:
- name: CRPS IgG passive transfer into incised mice
  species: Mouse
  genotype: Female C57BL/6 with plantar skin-muscle incision, treated with purified IgG from patients with longstanding CRPS
  publication: PMID:31182576
  description: >-
    The model that makes the autoimmune arm causal. Purified IgG from patients
    with longstanding CRPS, given daily to mice with a small plantar incision,
    produces prolonged swelling and stable hyperalgesia and sustained central
    glial activation relative to healthy-control IgG. The design is what earns
    the weight: a human-derived agent, a healthy-donor control arm, a
    mechanistic knockout, a pharmacological block, and a treatment arm started
    after the phenotype was established.
  evidence:
  - reference: PMID:31182576
    reference_title: Transfer of complex regional pain syndrome to mice via human autoantibodies is mediated by interleukin-1-induced mechanisms.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that persistent CRPS is often contributed to by
      autoantibodies and highlight a potential therapeutic use for clinically
      licensed antagonists, such as anakinra, to prevent or treat CRPS via
      blocking IL-1 actions.
    explanation: >-
      The authors' summary of what the model establishes about human disease,
      which is what makes it informative for this entry.
  modeled_mechanisms:
  - target: Spinal Glial Activation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the sustained microglial and astrocyte activation in the dorsal
      horn and pain-related brain regions that defines this node, driven by the
      human patient-derived agent rather than by a synthetic surrogate.
    limitations: >-
      The donor IgG comes from patients with longstanding CRPS, so the model
      speaks to maintenance rather than initiation; the recipients are female
      C57BL/6 mice with a surgical incision rather than a fracture; and the
      hyperalgesia readout does not capture the vasomotor, sudomotor, and
      trophic domains that make up three quarters of the human criteria set.
    readouts:
    - name: Dorsal horn and brain microglial and astrocyte activation
      target: Spinal Glial Activation
      direction: INCREASED
      interpretation: >-
        Sustained glial activation after the peripheral inflammatory response has
        subsided is the model's evidence for a central, antibody-driven
        maintaining mechanism.
      evidence:
      - reference: PMID:31182576
        reference_title: Transfer of complex regional pain syndrome to mice via human autoantibodies is mediated by interleukin-1-induced mechanisms.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          After a short-lasting paw inflammatory response in all groups, CRPS
          IgG-injected mice displayed sustained, profound microglia and astrocyte
          activation in the dorsal horn of the spinal cord and pain-related brain
          regions, indicating central sensitization.
        explanation: >-
          Reports the measurement, its direction, and its persistence relative to
          the peripheral response.
  - target: Autoantibody Production Against Autonomic Receptors
    relationship: PERTURBS
    fidelity: HIGH
    description: >-
      The model does not reproduce autoantibody production — it supplies the
      antibodies directly, which is precisely what isolates their contribution
      from everything else in the patient.
    limitations: >-
      Because the antibodies are administered rather than generated, the model is
      silent on how tolerance is broken in patients, which remains unexplained.
    readouts:
    - name: Paw swelling and mechanical hyperalgesia after patient IgG transfer
      target: Autoantibody Production Against Autonomic Receptors
      direction: INCREASED
      interpretation: >-
        A CRPS-like phenotype produced by patient antibodies alone, against a
        healthy-donor IgG control, is the causal evidence for this node.
      evidence:
      - reference: PMID:31182576
        reference_title: Transfer of complex regional pain syndrome to mice via human autoantibodies is mediated by interleukin-1-induced mechanisms.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          CRPS IgG significantly increased and prolonged swelling and induced
          stable hyperalgesia of the incised paw compared with IgG from healthy
          controls.
        explanation: >-
          The controlled comparison establishing that the effect is specific to
          patient-derived antibody.
- name: Rodent tibia fracture and cast immobilization model
  species: Rat
  genotype: Wild-type, closed distal tibia fracture with hindlimb casting
  publication: PMID:29684510
  description: >-
    The model built to match the commonest human trigger. Closed tibial
    fracture with casting reproduces the early syndrome broadly — spontaneous
    and evoked pain behaviour, warmth and oedema, skin thickening and
    osteoporosis — and has been the vehicle for much of the mechanistic work on
    neuropeptides, keratinocyte-derived cytokines and nerve growth factor,
    spinal glial activation, and the B-cell/IgM contribution. Its limitation is
    temporal and is the reason it is curated as partial: most post-fracture
    changes resolve within about five months, so the model may not contain
    whatever perpetuates chronic human CRPS.
  evidence:
  - reference: PMID:29684510
    reference_title: 'The Rodent Tibia Fracture Model: A Critical Review and Comparison With the Complex Regional Pain Syndrome Literature.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Distal limb fracture is the most common cause of complex regional pain
      syndrome (CRPS), thus the rodent tibia fracture model (TFM) was developed to
      study CRPS pathogenesis.
    explanation: >-
      States the model's construct validity — it starts from the same inciting
      event as most human cases.
  modeled_mechanisms:
  - target: Neurogenic Inflammation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the inflammatory and trophic features of early CRPS —
      oedema, warmth, skin thickening, osteoporosis — together with the
      neuropeptide and cytokine changes that this node's mechanism predicts.
    limitations: >-
      The recapitulation is of early CRPS only. Most post-fracture changes
      resolve within roughly five months, so the model does not capture whatever
      converts an acute post-traumatic response into the chronic syndrome, and
      the review that summarizes it notes significant differences from the human
      literature alongside the correspondences.
    readouts:
    - name: Inflammatory and trophic signs in the injured limb
      target: Neurogenic Inflammation
      direction: INCREASED
      interpretation: >-
        Oedema, warmth, skin thickening and osteoporosis appearing after an
        isolated fracture is the model's evidence that the inflammatory arm is
        driven by the injury response rather than by nerve section.
      evidence:
      - reference: PMID:29684510
        reference_title: 'The Rodent Tibia Fracture Model: A Critical Review and Comparison With the Complex Regional Pain Syndrome Literature.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The TFM generated spontaneous and evoked pain behaviors, inflammatory
          symptoms (edema, warmth), and trophic changes (skin thickening,
          osteoporosis) resembling symptoms in early CRPS.
        explanation: >-
          Reports the measured signs and their correspondence to early human
          disease.
  - target: Spinal Glial Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Tibia fracture alone activates spinal glia and upregulates spinal
      neuropeptide, cytokine and NGF expression — the same central response the
      IgG transfer model produces, reached from the peripheral injury instead.
    limitations: >-
      The review reports the central changes qualitatively in aggregate across
      studies rather than as one controlled measurement, and the same five-month
      resolution caveat applies.
    readouts:
    - name: Spinal glial activation and neuropeptide/cytokine/NGF upregulation
      target: Spinal Glial Activation
      direction: INCREASED
      interpretation: >-
        A peripheral fracture producing spinal glial activation is what links the
        entry's peripheral and central arms without invoking antibodies.
      evidence:
      - reference: PMID:29684510
        reference_title: 'The Rodent Tibia Fracture Model: A Critical Review and Comparison With the Complex Regional Pain Syndrome Literature.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Tibia fracture also activated spinal glia and upregulated spinal
          neuropeptide, cytokine, and NGF expression, and in the brain it changed
          dendritic architecture.
        explanation: >-
          Reports the central readouts and their direction.
differential_diagnoses:
- name: Complex regional pain syndrome type 2
  description: >-
    The same clinical syndrome following a confirmed peripheral nerve lesion.
    The distinction is by definition rather than by mechanism, and is not
    without critics, since fracture and surgery damage small nerve fibres yet
    the resulting CRPS is almost always classified as type 1.
  distinguishing_features:
  - >-
    A demonstrable major nerve lesion, established by history, examination, and
    electrodiagnostic study, reclassifies the case as type 2. Nerve conduction
    studies and EMG are used principally to make this exclusion.
  - >-
    Type 2 is roughly an order of magnitude less common: the same population
    study reported 5.46 per 100,000 person-years for type 1 against 0.82 for
    type 2.
  evidence:
  - reference: PMID:21683929
    reference_title: Clinical features and pathophysiology of complex regional pain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A distinction is made between CRPS-1, in which a nerve lesion can not be
      identified, and CRPS-2, in which it can.
    explanation: >-
      States the defining distinction between the two types.
  - reference: PMID:21683929
    reference_title: Clinical features and pathophysiology of complex regional pain syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This distinction is not without criticism however, because bone fracture or
      surgery will damage peripheral nerve fibres yet post-fracture and
      post-surgical CRPS are almost always called CRPS-1.
    explanation: >-
      Qualifies the distinction as a clinical convention rather than a
      mechanistic boundary, which is how this entry treats it.
discussions:
- discussion_id: crps1_vs_crps2_small_fibre_degeneration
  kind: CONTROVERSY
  prompt: >-
    If chronic CRPS-I limbs show small-fibre degeneration, is the type 1 /
    type 2 distinction mechanistically meaningful or only operational?
  attaches_to:
  - differential_diagnoses#Complex regional pain syndrome type 2
  rationale: >-
    Pathological studies of amputated chronic CRPS-I limbs and skin biopsies
    show degeneration of small C and A-delta fibres, so the "no nerve lesion"
    criterion cannot mean an intact peripheral nervous system. Whether that
    degeneration is causal or consequent is undetermined, and loss of C-fibre
    terminals is not specific to CRPS since it accompanies other neuropathic
    pain states. The entry keeps the operational distinction because the
    criteria and the epidemiology use it, while recording that it does not
    cleanly separate mechanisms.
- discussion_id: crps_autoantibody_subset_boundary
  kind: OPEN_QUESTION
  prompt: >-
    Which patients does the autoimmune mechanism actually explain, and is
    autoantibody status a treatable trait rather than a marker?
  attaches_to:
  - pathophysiology#Autoantibody Production Against Autonomic Receptors
  rationale: >-
    The autoantibodies are described in a subset of patients, and the transfer
    experiments used IgG from patients with longstanding severe disease. Whether
    seronegative patients have a different mechanism, a lower antibody titre, or
    antibodies against untested targets is unresolved — and it matters
    therapeutically, because IL-1 blockade prevented and reversed the transferred
    phenotype in mice and would be expected to help only the antibody-driven
    group. No CRPS trial of IL-1 blockade stratified by antibody status was
    identified during curation.
- discussion_id: crps_rodent_models_resolve_too_fast
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the rodent models contain the mechanism that makes human CRPS chronic, or
    only the one that makes it start?
  attaches_to:
  - animal_models#Rat
  rationale: >-
    The tibia fracture model reproduces early CRPS well — pain behaviour,
    oedema, warmth, trophic change, spinal glial activation — which is why it
    carries this entry's links. But most post-fracture changes resolve within
    about five months, whereas the human disease that matters clinically is the
    one that does not resolve. Evidence therefore exists in the model for the
    initiating and early-maintenance mechanisms and is absent for the
    chronicity mechanism, which is a translational-validity limit rather than a
    knowledge gap. The IgG transfer model partly fills it — its donors are
    patients with longstanding disease — but it supplies the antibodies rather
    than generating them, so neither model contains the whole chronic disease.
- discussion_id: crps_hla_association_citation_todo
  kind: CURATION_TODO
  prompt: >-
    Establish a citable primary source with a verifiable quote for the HLA-DQ8
    association (and the ANO10/P2RX7/PRKAG1/SLC12A9 candidate SNPs) before
    treating the genetic susceptibility claims as evidenced.
  attaches_to:
  - genetic#HLA-DQB1
  rationale: >-
    The deep-research report cited the HLA association only to a journal article
    URL and the candidate SNPs to a review, without an identifier whose abstract
    contains a quotable statement of the association. The HLA-DQB1 entry is
    therefore curated with `relationship_type: SUSCEPTIBILITY`, an explanatory
    note, and no evidence item; the SNP candidates are not curated at all.
notes: >-
  Ontology-binding correction worth recording. The deep-research report
  proposed several ontology IDs that resolve to unrelated terms in the current
  releases — UBERON:0006459 for primary somatosensory cortex (it is a thoracic
  spinal cord segment), CL:0000636 for sympathetic neuron (Mueller cell), and
  CL:0000850 for C-fibre neuron (serotonergic neuron). Every binding in this
  entry was resolved with OAK against the local release instead, and the report's
  suggested IDs were not used. This is exactly the failure mode the term
  validator exists to catch.

  Deliberate omissions, corrected. An earlier revision of this entry said that
  several claims were uncurated because their deep-research sources resolved
  only to journal or PMC URLs. That was wrong: the deep-research run's own
  reference validation had already cached citable records for most of them, and
  they are now curated — the negative MR spectroscopy result (PMID:31980452),
  the tibia fracture rodent model (PMID:29684510), the paediatric prognosis
  (PMID:27130211), the RCT systematic review covering sympathetic blocks and
  neuromodulation (PMID:40917914), the autoantibody prevalence (PMID:25741131),
  the scintigraphy accuracy study (PMID:24900016), and the long-term disability
  survey (PMID:39315115). Check `references_cache/` before concluding a
  deep-research citation is unresolvable.

  What remains genuinely uncurated: the HLA-DQ8 and candidate-SNP genetic
  associations, for which no cached record states the association in quotable
  form (see the CURATION_TODO discussion); the sex-ratio and age-distribution
  figures; the S1 functional-connectivity and motor-cortex disinhibition
  findings; and the CPIP ischaemia-reperfusion model, whose sources were
  protocol videos and preprints rather than citable papers.

- name: Chronically Increased Intra-Abdominal Load
  biological_scale: ORGANISM
  description: >
    Sustained or repeated rises in intra-abdominal pressure from obesity, chronic
    straining at stool, chronic cough or heavy lifting, transmitted onto an already
    weakened pelvic floor. Rising body-mass index is one of the three most consistent risk
    factors and is the one most obviously modifiable, but the occupational and exercise
    literature does not support a general "strain causes prolapse" story: women recruited
    from the community with prolapse on examination report the same lifetime strenuous
    activity as women without it, and the association with heavy work appears mainly in
    surgical series, where referral is itself selected on symptoms. This node is therefore
    curated as a genuine load with a deliberately weak causal edge.
  biological_processes:
  - preferred_term: response to mechanical stimulus
    term:
      id: GO:0009612
      label: response to mechanical stimulus
    modifier: INCREASED
  evidence:
  - reference: PMID:18799443
    reference_title: "Prevalence of symptomatic pelvic floor disorders in US women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overweight and obese women were more likely to report at least 1 pelvic floor disorder than normal weight women"
    explanation: >
      Population-level gradient with body-mass index, the best-supported component of this
      node.
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "considerations include weight loss, reduction of heavy lifting, treatment of constipation, modification or reduction of obstetric risk factors, and pelvic-floor physical therapy"
    explanation: >
      Enumerates the components of abdominal load that are considered modifiable, quoted
      from a sentence whose opening clause states that no prevention strategy has actually
      been shown effective.
  - reference: PMID:26348380
    reference_title: "Physical activity and the pelvic floor."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Women undergoing surgery for pelvic organ prolapse are more likely to report a history of heavy work than controls; however, women recruited from the community with pelvic organ prolapse on examination report similar lifetime levels of strenuous activity as women without this examination finding."
    explanation: >
      The reason the downstream edge is UNKNOWN. The association reverses depending on how
      cases are ascertained, which is the signature of ascertainment bias rather than of a
      dose-response exposure.
  - reference: PMID:26348380
    reference_title: "Physical activity and the pelvic floor."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Scant data suggest that in middle-aged women, lifetime physical activity increases the odds of stress urinary incontinence slightly and does not increase the odds of pelvic organ prolapse."
    explanation: >
      A second, independent statement of the negative, and one that separates prolapse
      from stress incontinence rather than treating pelvic floor disorders as one outcome.
  downstream:
  - target: Urogenital Hiatus Enlargement and Loss of Levator Closure
    causal_link_type: UNKNOWN
    description: >
      Repeated pressure loading is the presumed route by which abdominal load widens the
      hiatus, but the exposure evidence is inconsistent between surgical and community
      ascertainment and no measurement of hiatal change against cumulative load exists in
      the sources used here.
    evidence:
    - reference: PMID:17382829
      reference_title: "Pelvic organ prolapse."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Vaginal delivery, hysterectomy, chronic straining, normal ageing, and abnormalities of connective tissue or connective-tissue repair predispose some women to disruption, stretching, or dysfunction of the levator ani complex, connective-tissue attachments of the vagina, or both, resulting in prolapse."
      explanation: >
        Names chronic straining as predisposing to levator dysfunction, at the level of a
        review assertion, which is all the support this edge has.

- name: Failure of Apical and Lateral Connective Tissue Attachment
  biological_scale: TISSUE
  description: >
    Loss of effective suspension of the uterus and upper vagina from the pelvic sidewall
    by the cardinal, uterosacral and paravaginal attachments. Measured in living women
    under maximal Valsalva, these three are strongly related to prolapse and are strongly
    correlated with one another, which is the evidence that they fail as one system rather
    than as separable "defects". The character of the failure is informative: what differs
    between women with and without prolapse is ligament length, not ligament stiffness -
    the tissue has lengthened rather than become intrinsically floppier, which fits
    accumulated mechanical failure better than it fits a pure material defect.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  locations:
  - preferred_term: rectouterine fold (containing the uterosacral ligaments)
    term:
      id: UBERON:0007136
      label: rectouterine fold
  - preferred_term: uterus
    term:
      id: UBERON:0000995
      label: uterus
  evidence:
  - reference: PMID:27517338
    reference_title: "What's new in the functional anatomy of pelvic organ prolapse?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Failure of the lateral connective tissue attachments between the uterus and vagina to the pelvic wall (cardinal, uterosacral, and paravaginal) are strongly related with prolapse"
    explanation: >
      Identifies the three attachments this node covers and states their relation to
      prolapse.
  - reference: PMID:27517338
    reference_title: "What's new in the functional anatomy of pelvic organ prolapse?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary difference in ligament properties between women with and without prolapse is found in ligament length. Only minor differences in ligament stiffness are seen."
    explanation: >
      Characterises the failure as geometric rather than material, which is the discriminating
      observation between this entry's two mechanistic hypotheses.
  downstream:
  - target: Descent of the Pelvic Organs Beyond the Hymen
    causal_link_type: DIRECT
    description: >
      Once the suspensory attachments have lengthened or given way, the uterus and vaginal
      apex are no longer held above the levator plate and descend.
    evidence:
    - reference: PMID:27517338
      reference_title: "What's new in the functional anatomy of pelvic organ prolapse?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pelvic organ prolapse occurs because of injury to the levator ani muscles and failure of the lateral connections between the pelvic organs to the pelvic sidewall."
      explanation: >
        Names attachment failure as one of the two proximate causes of prolapse, which is
        this edge.
  - target: Cystocele
    causal_link_type: DIRECT
    description: >
      Apical support is not merely correlated with anterior wall support, it accounts for
      about half its variance in living women imaged under Valsalva - so a substantial
      part of what presents as a "bladder" prolapse is an apical lesion expressed in the
      anterior compartment. This is the mechanistic reason apical suspension is part of
      an anterior repair.
    evidence:
    - reference: PMID:16579933
      reference_title: "The relationship between anterior and apical compartment support."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Half of the observed variation in anterior compartment support may be explained by apical support."
      explanation: >
        The authors' conclusion, and the quantitative basis for treating anterior descent
        as partly a consequence of apical attachment failure rather than an independent
        anterior defect.
    - reference: PMID:16579933
      reference_title: "The relationship between anterior and apical compartment support."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The Pearson correlation coefficient of the relationship between the bladder base and uterine distances was r = 0.73 (r2 = 0.53)."
      explanation: >
        The measurement behind the conclusion; note it is a cross-sectional correlation in
        153 women, so the edge rests on covariation plus anatomy, not on an intervention.
  - target: Uterine Prolapse
    causal_link_type: DIRECT
    description: >
      The cardinal and uterosacral complex is what suspends the uterus, so its failure is
      uterine descent rather than a cause of something that later becomes uterine descent.
    evidence:
    - reference: PMID:27517338
      reference_title: "What's new in the functional anatomy of pelvic organ prolapse?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Failure of the lateral connective tissue attachments between the uterus and vagina to the pelvic wall (cardinal, uterosacral, and paravaginal) are strongly related with prolapse"
      explanation: >
        Names the uterus explicitly among the organs these attachments suspend, which is
        what makes this edge apical rather than generic.

- name: Descent of the Pelvic Organs Beyond the Hymen
  biological_scale: ORGANISM
  description: >
    The disease-defining lesion: bladder, uterus, post-hysterectomy vaginal cuff or bowel
    descending so that the vaginal walls or uterus protrude toward and past the hymen.
    Everything clinically recognisable follows from here, and so does the entry's central
    epidemiological oddity - descent on examination is far commoner than the complaint,
    the two correlate poorly, and of the many symptoms attributed to prolapse only the
    sensation of a vaginal bulge is actually specific to it.
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  - preferred_term: uterus
    term:
      id: UBERON:0000995
      label: uterus
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  evidence:
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pelvic organ prolapse is downward descent of female pelvic organs, including the bladder, uterus or post-hysterectomy vaginal cuff, and the small or large bowel, resulting in protrusion of the vagina, uterus, or both."
    explanation: >
      The definitional statement, including the four organs that may descend.
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients generally present with several complaints, including bladder, bowel, and pelvic symptoms; however, with the exception of vaginal bulging, none is specific to prolapse."
    explanation: >
      Supports the symptom-specificity claim in this node's description and, downstream,
      the decision not to over-attribute the urinary and bowel phenotypes to this node
      alone.
  - reference: PMID:31851453
    reference_title: "Narrative review of the epidemiology, diagnosis and pathophysiology of pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The anatomical changes do not always consist with the severity or the symptoms associated with prolapse."
    explanation: >
      States the anatomy-symptom discordance directly; it is the basis of the knowledge
      gap attached to this node.

- name: Recurrence After Reconstructive Surgery
  biological_scale: ORGANISM
  description: >
    Anatomic or symptomatic failure of a prolapse repair. It is curated as a node rather
    than as a treatment outcome because it is mechanistically informative: reconstructive
    surgery restores the suspensory attachments and does not restore the levator, so a
    wide genital hiatus persists across the operation, and it is that persisting hiatus
    that predicts failure. Recurrence is thus the clinical readout of the part of the
    mechanism that current surgery leaves untouched, and it explains why apical
    suspensions differ in durability while none abolishes recurrence.
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  evidence:
  - reference: PMID:34270804
    reference_title: "Enlargement of the genital hiatus is associated with prolapse recurrence in patients undergoing sacrospinous ligament fixation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both preoperative and postoperative widened GH correlated with having more surgical failures following SSLF."
    explanation: >
      The primary result linking hiatal width to surgical failure, both before and after
      operation.
  - reference: PMID:34270804
    reference_title: "Enlargement of the genital hiatus is associated with prolapse recurrence in patients undergoing sacrospinous ligament fixation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A posterior colporrhaphy did not improve success."
    explanation: >
      A negative surgical result that fits the node's framing: adding a vaginal wall repair
      does not compensate for the unaddressed hiatus.
  - reference: PMID:23633316
    reference_title: "Surgical management of pelvic organ prolapse in women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For upper vaginal prolapse (uterine or vault) abdominal sacral colpopexy was associated with a lower rate of recurrent vault prolapse on examination and painful intercourse than with vaginal sacrospinous colpopexy."
    explanation: >
      Establishes that recurrence rates differ by procedure, which is what makes this a
      node with a variable rate rather than a fixed property of the disease.

phenotypes:
- category: Anatomic
  name: Pelvic Organ Prolapse
  description: >
    Descent of one or more vaginal walls or the uterus to or beyond the hymen on maximal
    Valsalva. The defining finding; graded in practice by the POP-Q system.
  phenotype_term:
    preferred_term: Pelvic organ prolapse
    term:
      id: HP:0031607
      label: Pelvic organ prolapse
  evidence:
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pelvic organ prolapse is downward descent of female pelvic organs, including the bladder, uterus or post-hysterectomy vaginal cuff, and the small or large bowel, resulting in protrusion of the vagina, uterus, or both."
    explanation: >
      The definitional description of the finding.
- category: Anatomic
  name: Cystocele
  description: >
    Anterior compartment prolapse, with the bladder bulging into the anterior vaginal
    wall. The most frequently affected compartment in imaged cohorts.
  phenotype_term:
    preferred_term: Cystocele
    term:
      id: HP:0100645
      label: Cystocele
  evidence:
  - reference: PMID:36343586
    reference_title: "Levator ani muscle avulsion in patients with pelvic floor dysfunction - Does it help in understanding pelvic organ prolapse?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The anterior compartment was the most frequently affected"
    explanation: >
      Identifies the anterior compartment as the most commonly involved in a cohort of 848
      women assessed by transperineal ultrasound.
- category: Anatomic
  name: Uterine Prolapse
  description: >
    Apical descent of the uterus. Where the uterus has been removed, the equivalent lesion
    is descent of the vaginal vault, which is the apical compartment addressed by
    sacrocolpopexy and sacrospinous fixation.
  phenotype_term:
    preferred_term: Uterine prolapse
    term:
      id: HP:0000139
      label: Uterine prolapse
  evidence:
  - reference: PMID:23633316
    reference_title: "Surgical management of pelvic organ prolapse in women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For upper vaginal prolapse (uterine or vault) abdominal sacral colpopexy was associated with a lower rate of recurrent vault prolapse on examination and painful intercourse than with vaginal sacrospinous colpopexy."
    explanation: >
      Treats uterine and vault prolapse as the apical compartment, which is how this
      phenotype is scoped.
- category: Anatomic
  name: Rectocele
  description: >
    Posterior compartment prolapse, with the rectum bulging into the posterior vaginal
    wall; the lesion addressed by posterior vaginal repair.
  phenotype_term:
    preferred_term: Rectocele
    term:
      id: HP:0100822
      label: Rectocele
  notes: >
    Deliberately left without an incoming pathograph edge, unlike Cystocele and Uterine
    Prolapse. The compartment-specific risk carried by levator avulsion is concentrated in
    the anterior and apical compartments, and the study that quantified it attributes the
    overall association to those two; no comparable quantified route from either the
    muscular or the connective-tissue arm to the posterior compartment was found. Wiring
    rectocele off the levator node anyway would assert an attribution the source
    specifically does not make. The mechanism of posterior compartment descent is a real
    gap in this entry rather than an omission.
  evidence:
  - reference: PMID:23633316
    reference_title: "Surgical management of pelvic organ prolapse in women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data from three trials compared posterior vaginal repair and transanal repair for the treatment of posterior compartment prolapse (rectocele)."
    explanation: >
      Identifies rectocele as the posterior compartment lesion, in the context of the
      trials that treat it.
  - reference: PMID:18503571
    reference_title: "Levator trauma is associated with pelvic organ prolapse."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This effect is mainly due to an increased risk of cystocele and uterine prolapse."
    explanation: >
      Supports rectocele being part of the disease while withholding support for a levator
      route to it - the same sentence that grounds the two compartment edges elsewhere in
      this entry is the reason this phenotype has none.
- category: Urinary
  name: Stress Urinary Incontinence
  description: >
    Leakage on exertion, cough or sneeze. Curated as a co-occurring pelvic floor disorder
    rather than as a consequence of descent: it shares the birth-injury exposure, it is
    frequently unmasked rather than caused by prolapse repair, and continence surgery is
    often performed concomitantly for exactly that reason.
  phenotype_term:
    preferred_term: Stress urinary incontinence
    term:
      id: HP:0010992
      label: Stress urinary incontinence
  evidence:
  - reference: PMID:23633316
    reference_title: "Surgical management of pelvic organ prolapse in women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women undergoing prolapse surgery may have benefited from having continence surgery performed concomitantly, especially if they had stress urinary incontinence"
    explanation: >
      Establishes the clinical co-occurrence and the concomitant-surgery practice that
      motivates curating it as a linked but distinct disorder.
  - reference: PMID:38168908
    reference_title: "Pelvic floor injury during vaginal birth is life-altering and preventable: what can we do about it?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vaginal birth is the largest modifiable risk factor for prolapse, the pelvic floor disorder most strongly associated with birth, and is an important contributor to stress incontinence."
    explanation: >
      States the shared obstetric exposure while distinguishing the strength of its
      association with each of the two disorders.
- category: Urinary
  name: Voiding Dysfunction
  description: >
    Incomplete bladder emptying, often from kinking of the urethra by a descending
    anterior wall. Notably it also arises de novo after prolapse surgery, in about one in
    eleven women.
  phenotype_term:
    preferred_term: Urinary retention
    term:
      id: HP:0000016
      label: Urinary retention
  evidence:
  - reference: PMID:23633316
    reference_title: "Surgical management of pelvic organ prolapse in women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following prolapse surgery, 12% of women developed de novo symptoms of bladder overactivity and 9% de novo voiding dysfunction."
    explanation: >
      Quantifies de novo voiding dysfunction after repair. Note this evidences the
      postoperative form specifically; the preoperative obstructive mechanism is described
      but not separately quantified here.
- category: Gastrointestinal
  name: Obstructed Defecation and Constipation
  description: >
    Difficulty evacuating, sometimes requiring digital support of the posterior vaginal
    wall. Bidirectional with the disease: chronic straining is also curated here as a
    contributor to intra-abdominal load.
  phenotype_term:
    preferred_term: Constipation
    term:
      id: HP:0002019
      label: Constipation
  evidence:
  - reference: PMID:33207004
    reference_title: "Pessaries (mechanical devices) for managing pelvic organ prolapse in women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women experience a variety of troublesome symptoms as a consequence of prolapse, including a feeling of 'something coming down' into the vagina, pain, urinary symptoms, bowel symptoms and sexual difficulties."
    explanation: >
      Names bowel symptoms among the consequences of prolapse. The snippet supports the
      symptom domain rather than obstructed defecation specifically, which is why no
      frequency band is asserted.
- category: Sexual
  name: Dyspareunia
  description: >
    Pain with intercourse. Both a symptom of prolapse and an outcome measure of its
    surgical treatment, where it differs between operations.
  phenotype_term:
    preferred_term: Dyspareunia
    term:
      id: HP:0030016
      label: Dyspareunia
  evidence:
  - reference: PMID:23633316
    reference_title: "Surgical management of pelvic organ prolapse in women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abdominal sacral colpopexy was associated with a lower rate of recurrent vault prolapse on examination and painful intercourse than with vaginal sacrospinous colpopexy"
    explanation: >
      Painful intercourse is reported as a comparative outcome between apical procedures,
      establishing it as a clinically tracked feature of the disease and its treatment.
  - reference: PMID:23240798
    reference_title: "Prolapse and sexual function in women with benign joint hypermobility syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly more women with BJHS felt that POP interfered with sex and defecation compared with the control group."
    explanation: >
      Independent evidence that prolapse interferes with sexual function, measured by a
      validated instrument in a matched case-control design.
- category: Pain
  name: Pelvic Pain and Pressure
  description: >
    A dragging or bearing-down sensation in the pelvis. Non-specific: it is reported by
    women with prolapse but is not diagnostic of it.
  phenotype_term:
    preferred_term: Pelvic pain
    term:
      id: HP:0034267
      label: Pelvic pain
  evidence:
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients generally present with several complaints, including bladder, bowel, and pelvic symptoms; however, with the exception of vaginal bulging, none is specific to prolapse."
    explanation: >
      PARTIAL by design: the source names pelvic symptoms as part of the presentation
      while explicitly denying them specificity, which is exactly the claim this phenotype
      makes.

genetic:
- name: WNT4
  gene_term:
    preferred_term: WNT4
    term:
      id: hgnc:12783
      label: WNT4
  relationship_type: SUSCEPTIBILITY
  notes: >
    rs3820282, proposed to alter oestrogen-based regulation of WNT4, associates with
    prolapse and also with uterine leiomyoma, gestational duration and endometriosis, a
    cross-phenotype pattern consistent with a shared reproductive-tract connective tissue
    or hormonal axis rather than a prolapse-specific effect.
  evidence:
  - reference: PMID:32184442
    reference_title: "Genome-wide association identifies seven loci for pelvic organ prolapse in Iceland and the UK Biobank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, rs3820282, which may alter the estrogen-based regulation of WNT4, also associates with leiomyoma of uterus, gestational duration and endometriosis."
    explanation: >
      Names the variant, the proposed regulatory mechanism (with the authors' own hedge)
      and the cross-phenotype associations.
- name: EFEMP1
  gene_term:
    preferred_term: EFEMP1
    term:
      id: hgnc:3218
      label: EFEMP1
  relationship_type: SUSCEPTIBILITY
  notes: >
    rs3791675 at EFEMP1 (fibulin-3), a connective tissue homeostasis gene whose prolapse
    association is shared with hernia and carpal tunnel syndrome. EFEMP1 is a fibulin, the
    same protein family as FBLN5, whose deletion causes prolapse in mice.
  evidence:
  - reference: PMID:32184442
    reference_title: "Genome-wide association identifies seven loci for pelvic organ prolapse in Iceland and the UK Biobank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rs3791675 at EFEMP1, a gene involved in connective tissue homeostasis, also associates with hernias and carpal tunnel syndrome."
    explanation: >
      Names the variant, the gene's function, and the shared connective tissue phenotypes.
- name: WT1
  gene_term:
    preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  relationship_type: SUSCEPTIBILITY
  notes: >
    rs10742277 at the WT1 locus reached genome-wide significance in the Japanese
    population (OR 1.48). WT1 is a urogenital developmental transcription factor, so this
    is the one associated locus that points at development of the support structures
    rather than at their maintenance.
  evidence:
  - reference: PMID:39349682
    reference_title: "Genome-wide association studies for pelvic organ prolapse in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a significant association of WT1 locus with POP in the Japanese population"
    explanation: >
      States the association and the population in which it was found.
- name: FGFR2
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  relationship_type: SUSCEPTIBILITY
  notes: >
    rs7072877 at FGFR2, identified only in cross-ancestry meta-analysis of 28,857 cases
    and 622,916 controls, with a small effect (OR 1.06), a reminder of the effect sizes
    the common-variant architecture of this disease actually carries.
  evidence:
  - reference: PMID:39349682
    reference_title: "Genome-wide association studies for pelvic organ prolapse in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified FGFR2 locus as a novel susceptibility locus to POP"
    explanation: >
      States the locus and that it emerged from the cross-ancestry meta-analysis rather
      than from either population alone.
- name: LOXL1
  gene_term:
    preferred_term: LOXL1
    term:
      id: hgnc:6665
      label: LOXL1
  relationship_type: MODIFIER
  notes: >
    Lysyl oxidase-like 1, the elastin cross-linking enzyme whose deletion in mice causes
    postpartum prolapse. Typed MODIFIER rather than CAUSATIVE because the evidence is
    entirely murine: no human LOXL1 loss-of-function prolapse syndrome has been
    established, and LOXL1 is not among the loci returned by the human association studies
    curated here.
  evidence:
  - reference: PMID:14745449
    reference_title: "Elastic fiber homeostasis requires lysyl oxidase-like 1 protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice lacking the protein lysyl oxidase-like 1 (LOXL1) do not deposit normal elastic fibers in the uterine tract post partum and develop pelvic organ prolapse"
    explanation: >
      The murine loss-of-function result, quoted so that the species restriction is
      visible in the snippet itself.
- name: FBLN5
  gene_term:
    preferred_term: FBLN5
    term:
      id: hgnc:3602
      label: FBLN5
  relationship_type: MODIFIER
  notes: >
    Fibulin-5, the LOXL1-interacting scaffold protein of elastogenesis. As with LOXL1 the
    prolapse evidence is murine; unlike LOXL1, the Fbln5-null phenotype develops with
    ageing rather than as a failure of postpartum repair, which is why the two models sit
    on different inputs to the same node in this entry.
  evidence:
  - reference: PMID:35088092
    reference_title: "Mouse Knockout Models for Pelvic Organ Prolapse: a Systematic Review."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loxl1 KO mice develop POP primarily from failure to heal after giving birth, whereas Fbln5 KO mice develop POP with aging."
    explanation: >
      Distinguishes the two models' routes to the same phenotype, which is the basis for
      curating them separately.

animal_models:
- species: Mouse
  genotype: Loxl1 null (Loxl1-/-)
  publication: PMID:14745449
  description: >
    Germline deletion of lysyl oxidase-like 1. The animals fail to deposit normal elastic
    fibers in the uterine tract after parturition and develop pelvic organ prolapse,
    together with an elastinopathy elsewhere (enlarged pulmonary airspaces, loose skin,
    vascular abnormality) and tropoelastin accumulation. The systemic phenotype is part of
    the interpretation, not noise: it is the reason the prolapse is attributed to
    elastogenesis failure rather than to something pelvis-specific.
  modeled_mechanisms:
  - target: Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      The model reproduces the node directly and, unusually, is the source of it: the
      requirement for postpartum elastogenesis in pelvic support was established here
      rather than confirmed here.
    limitations: >
      A germline null of a gene not implicated by human association studies of prolapse,
      in a quadrupedal animal whose pelvic floor bears load quite differently from a
      biped's. It demonstrates sufficiency of an elastogenesis lesion, not that this is
      the human lesion.
    readouts:
    - name: Elastic fiber deposition in the postpartum uterine tract
      target: Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
      direction: DECREASED
      interpretation: >
        Structural readout of the node: normal elastic fibers are not laid down after
        parturition.
      evidence:
      - reference: PMID:14745449
        reference_title: "Elastic fiber homeostasis requires lysyl oxidase-like 1 protein."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mice lacking the protein lysyl oxidase-like 1 (LOXL1) do not deposit normal elastic fibers in the uterine tract post partum and develop pelvic organ prolapse"
        explanation: >
          Reports the deposition failure and the prolapse in the same sentence.
    evidence:
    - reference: PMID:35088092
      reference_title: "Mouse Knockout Models for Pelvic Organ Prolapse: a Systematic Review."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loxl1 and Fbln5 KO models have provided the most reliable and predictable POP phenotype."
      explanation: >
        Independent systematic assessment that this model is informative rather than
        anecdotal, which is what the link-level evidence is for.
- species: Mouse
  genotype: Fbln5 null (Fbln5-/-)
  publication: PMID:17255326
  description: >
    Germline deletion of fibulin-5, the LOXL1-interacting elastogenesis scaffold. These
    animals prolapse with ageing rather than acutely after delivery, and the study that
    characterised them also mapped the normal postpartum time course of LOX, LOXL1,
    fibulin-5 and tropoelastin in the mouse vagina - which is what identified the
    postpartum elastogenic burst as a discrete, and therefore failable, event.
  modeled_mechanisms:
  - target: Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Reproduces the node through the ageing route rather than the postpartum-repair
      route, which is why it and the Loxl1 model are curated as two models of one node
      rather than duplicates.
    limitations: >
      As for Loxl1: germline null, quadruped, and a gene not returned by human prolapse
      GWAS. The authors' comparison is to prolapse in primates, not in women.
    readouts:
    - name: Pelvic organ support with ageing
      target: Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
      direction: DECREASED
      interpretation: >
        Whole-animal anatomic readout; the phenotype is reported as resembling primate
        prolapse.
      evidence:
      - reference: PMID:17255326
        reference_title: "Pelvic organ prolapse in fibulin-5 knockout mice: pregnancy-induced changes in elastic fiber homeostasis in mouse vagina."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Pelvic organ prolapse in Fbln5-/- mice was remarkably similar to that in primates."
        explanation: >
          The anatomic comparison on which the model's face validity rests.
    evidence:
    - reference: PMID:35088092
      reference_title: "Mouse Knockout Models for Pelvic Organ Prolapse: a Systematic Review."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loxl1 KO mice develop POP primarily from failure to heal after giving birth, whereas Fbln5 KO mice develop POP with aging."
      explanation: >
        States the distinct route by which this model reaches the shared node.

diagnosis:
- name: POP-Q Staged Pelvic Examination
  description: >
    Diagnosis is clinical, and the measurement standard is the Pelvic Organ Prolapse
    Quantification (POP-Q) system agreed in 1996 by the International Continence Society,
    the American Urogynecologic Society and the Society of Gynecologic Surgeons. It
    records the position of defined vaginal points relative to the hymen under maximal
    Valsalva and stages the result, which is what makes prolapse severity comparable
    between examiners and between studies - almost every cohort cited in this entry is
    staged this way, including the avulsion series behind the compartment edges. Two
    entries in the pathophysiology above are POP-Q measurements rather than research
    constructs: the genital hiatus (gh) that the recurrence node is built on, and the
    hymen that defines the descent node. Because the system quantifies anatomy and the
    disease's central oddity is that anatomy and symptoms correlate poorly, a POP-Q stage
    is not on its own an indication to treat.
  diagnosis_term:
    preferred_term: POP-Q staged pelvic examination
    term:
      id: NCIT:C214455
      label: Pelvic Organ Prolapse Exam
  evidence:
  - reference: PMID:8694033
    reference_title: "The standardization of terminology of female pelvic organ prolapse and pelvic floor dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An objective site-specific system for describing, quantitating, and staging pelvic support in women is included."
    explanation: >
      The originating consensus statement, and the basis for describing POP-Q as an
      objective site-specific staging system rather than a severity impression.
  - reference: PMID:8694033
    reference_title: "The standardization of terminology of female pelvic organ prolapse and pelvic floor dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article presents a standard system of terminology recently approved by the International Continence Society, the American Urogynecologic Society, and the Society of Gynecologic Surgeons"
    explanation: >
      Names the three societies that approved it, which is what makes this the field
      standard rather than one group's proposal.
  - reference: PMID:21505577
    reference_title: "Pelvic Organ Prolapse Quantification System (POP-Q) - a new era in pelvic prolapse staging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although is not very simple as a concept, it helps defining the features of a prolapse at a level of completeness not reached by any other system to date"
    explanation: >
      A later appraisal placing POP-Q above the earlier staging systems, supporting its
      description here as the standard rather than one option among several.
  - reference: PMID:31851453
    reference_title: "Narrative review of the epidemiology, diagnosis and pathophysiology of pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The anatomical changes do not always consist with the severity or the symptoms associated with prolapse."
    explanation: >
      The reason a POP-Q stage does not by itself indicate treatment; this is the same
      discordance curated as a knowledge gap on the descent node.
- name: Pelvic Floor Transperineal Ultrasound
  description: >
    Three- or four-dimensional transperineal (translabial) ultrasound is how the levator
    lesion at the head of this entry's canonical arm is actually seen in a living woman:
    it identifies levator ani avulsion and measures hiatal dimensions. It is what makes
    the muscular arm clinically observable rather than inferred, and every avulsion
    cohort cited here rests on it. It is not a routine diagnostic requirement - prolapse
    is diagnosed on examination - so it is curated as the mechanism-resolving
    investigation rather than as a diagnostic standard.
  diagnosis_term:
    preferred_term: pelvic floor transperineal ultrasound
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:36343586
    reference_title: "Levator ani muscle avulsion in patients with pelvic floor dysfunction - Does it help in understanding pelvic organ prolapse?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of LAM avulsion was diagnosed by 3D/4D pelvic floor transperineal ultrasound."
    explanation: >
      States the modality and that avulsion is the finding it establishes, which is this
      entry's use of it.
  - reference: PMID:18503571
    reference_title: "Levator trauma is associated with pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "imaging of the levator ani muscle by four-dimensional translabial ultrasound"
    explanation: >
      Independent confirmation of the modality, in the cohort that supplies the
      compartment-specific risk ratios used above.
  notes: >
    Dynamic pelvic MRI and defecography are also used, principally for multi-compartment
    and posterior-compartment assessment, but no cached reference in this entry
    substantiates a specific claim about them, so they are not curated as separate
    diagnosis entries.

treatments:
- name: Pelvic Floor Muscle Training
  description: >
    An individualised, supervised programme of pelvic floor muscle exercise. In the POPPY
    trial, 447 women with symptomatic stage I-III prolapse were randomised to one-to-one
    training or a lifestyle advice leaflet, and the trained group reported a significantly
    greater reduction in prolapse symptom score at 12 months. What the trial establishes
    and what it does not is worth stating plainly: the endpoint was self-reported symptoms,
    not anatomic stage, and training cannot reattach an avulsed levator.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: pelvic floor physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Urogenital Hiatus Enlargement and Loss of Levator Closure
    treatment_effect: INHIBITS
    description: >
      Training targets the residual levator, the muscle whose failure opens the hiatus.
      The edge is placed here rather than on the descent node because the intervention
      acts on muscle function; note that the trial's own endpoint was symptomatic, so this
      mechanistic placement is inference from the target tissue, not a measured hiatal
      change.
    evidence:
    - reference: PMID:24290404
      reference_title: "Individualised pelvic floor muscle training in women with pelvic organ prolapse (POPPY): a multicentre randomised controlled trial."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "One-to-one pelvic floor muscle training for prolapse is effective for improvement of prolapse symptoms."
      explanation: >
        PARTIAL because it demonstrates symptomatic benefit without demonstrating the
        mechanism this edge asserts.
  evidence:
  - reference: PMID:24290404
    reference_title: "Individualised pelvic floor muscle training in women with pelvic organ prolapse (POPPY): a multicentre randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Female outpatients with newly-diagnosed, symptomatic stage I, II, or III prolapse were randomly assigned"
    explanation: >
      Defines the population in which the benefit was shown, which bounds the
      recommendation to symptomatic early-to-moderate prolapse.
- name: Vaginal Pessary
  description: >
    A passive intravaginal device that mechanically supports the vaginal walls and holds
    the descended organs in position. It treats the mechanics without altering any of the
    upstream biology, which makes it the cleanest illustration in this entry of how far
    the disease is a structural problem. The Cochrane evidence is thinner than its
    ubiquity suggests: pessary versus no treatment and pessary versus training are both
    uncertain, and only pessary added to training reaches moderate certainty.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: vaginal pessary placement
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Descent of the Pelvic Organs Beyond the Hymen
    treatment_effect: INHIBITS
    description: >
      The device physically opposes descent. This is the one treatment edge in the entry
      whose mechanism is not in doubt, because the mechanism is the device's stated design.
    evidence:
    - reference: PMID:33207004
      reference_title: "Pessaries (mechanical devices) for managing pelvic organ prolapse in women."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Vaginal pessaries are passive mechanical devices designed to support the vagina and hold the prolapsed organs back in the anatomically correct position."
      explanation: >
        States the mechanism of action directly.
  evidence:
  - reference: PMID:33207004
    reference_title: "Pessaries (mechanical devices) for managing pelvic organ prolapse in women."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We are uncertain if pessaries improve pelvic organ prolapse symptoms for women compared with no treatment or PFMT but pessaries in addition to PFMT probably improve women's pelvic organ prolapse symptoms and prolapse-specific quality of life."
    explanation: >
      The review's bottom line, retained as PARTIAL because two of its three comparisons
      are uncertain. Curating this as SUPPORT would overstate a widely used treatment.
  - reference: PMID:33207004
    reference_title: "Pessaries (mechanical devices) for managing pelvic organ prolapse in women."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Pessaries may result in a large increase in risk of adverse events compared with PFMT"
    explanation: >
      The harm side, retained so the comparison against training is not presented as
      cost-free.
- name: Reconstructive Prolapse Surgery
  description: >
    Restoration of the vaginal axis by resuspending the apex and repairing the compartment
    defects. For the apical compartment, abdominal sacral colpopexy outperforms the vaginal
    alternatives anatomically, at the cost of longer operating time, slower recovery and
    greater expense. Transvaginal polypropylene mesh reduced recurrence on examination but
    at a mesh erosion rate above one in ten and a higher reoperation rate, and it has since
    been withdrawn in many jurisdictions - a case where an anatomic endpoint and a
    patient-centred one pointed in opposite directions.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: reconstructive pelvic floor surgery
    term:
      id: NCIT:C15332
      label: Gynecological Surgical Procedure
  target_mechanisms:
  - target: Failure of Apical and Lateral Connective Tissue Attachment
    treatment_effect: BYPASSES
    description: >
      Typed BYPASSES rather than RESTORES on purpose. Apical suspension substitutes a
      surgical attachment (to the sacrum or the sacrospinous ligament) for the failed
      native one; it does not repair the cardinal-uterosacral complex, and it leaves the
      levator lesion entirely untouched, which is why a wide hiatus continues to predict
      failure afterwards.
    evidence:
    - reference: PMID:23633316
      reference_title: "Surgical management of pelvic organ prolapse in women."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sacral colpopexy has superior outcomes to a variety of vaginal procedures including sacrospinous colpopexy, uterosacral colpopexy and transvaginal mesh."
      explanation: >
        Establishes that apical suspension works and that the route matters, which is the
        content of this edge.
  evidence:
  - reference: PMID:23633316
    reference_title: "Surgical management of pelvic organ prolapse in women."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mesh erosions were reported in 11.4% (64/563), with surgical interventions being performed in 6.8% (32/470)."
    explanation: >
      The harm that drove transvaginal mesh off the market, retained as a limit on the
      graft-augmented variants of this treatment.
  - reference: PMID:23633316
    reference_title: "Surgical management of pelvic organ prolapse in women."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Following the withdrawal of some commercial transvaginal mesh kits from the market, the generalisability of the findings, especially relating to anterior compartment transvaginal mesh, should be interpreted with caution."
    explanation: >
      The reviewers' own currency caveat, which is why the mesh comparisons above are not
      curated as live treatment recommendations.
- name: Weight Loss and Reduction of Abdominal Straining
  description: >
    Weight reduction, treatment of constipation and avoidance of heavy lifting. Included
    because rising body-mass index is one of the three most consistent risk factors, and
    excluded from any efficacy claim because the same review that lists these measures
    states in the same sentence that no prevention strategy has been shown to work. No
    target_mechanisms edge is asserted: an unevidenced INHIBITS edge here would put a
    false arrow into the pathograph.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: lifestyle and dietary modification
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although no effective prevention strategy for prolapse has been identified, considerations include weight loss, reduction of heavy lifting, treatment of constipation, modification or reduction of obstetric risk factors, and pelvic-floor physical therapy."
    explanation: >
      Quoted in full, including the concessive opening clause, so that the absence of
      demonstrated efficacy travels with the list of measures.
- name: Vaginal Oestrogen
  description: >
    Local oestrogen, widely prescribed alongside pessary use and before surgery for
    atrophic vaginal tissue. Curated here with a negative: in a study of 1443
    postmenopausal women, current vaginal oestrogen was not associated with pelvic organ
    support, and current systemic hormone therapy was associated with slightly worse
    support on two measures. It may still be justified for vaginal atrophy or pessary
    tolerance; it is not a treatment for the prolapse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: local oestrogen therapy
    term:
      id: NCIT:C15483
      label: Estrogen Therapy
  evidence:
  - reference: PMID:28538602
    reference_title: "Pelvic organ prolapse: does hormone therapy use matter?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Past HT use, duration of HT use, or current vaginal estrogen use was not associated with pelvic organ support."
    explanation: >
      Directly refutes an effect on pelvic organ support, which is why this treatment
      carries no target_mechanisms edge.
  - reference: PMID:28538602
    reference_title: "Pelvic organ prolapse: does hormone therapy use matter?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "HT may have a minor negative effect on pelvic organ support; however, the effect is likely too small to be clinically relevant."
    explanation: >
      The authors' conclusion, retained with their own de-escalation of it, so the entry
      neither claims benefit nor manufactures a harm signal.

discussions:
- discussion_id: gap_matrix_cause_or_consequence
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Collagen and MMP-TIMP Remodelling Imbalance
  prompt: >
    Is the collagen and MMP/TIMP signature of prolapsed tissue a cause of the mechanical
    failure or a response to it?
  rationale: >
    Every human study behind this node is cross-sectional and takes tissue from women who
    already have prolapse, usually at the time of surgery for it. That design cannot order
    cause and effect, and one observation actively points the wrong way: the study that
    sampled both compartments found the changes larger in vaginal tissue, the tissue being
    stretched, than in the uterosacral ligament, where the differences were not significant
    at all. The distinction is not academic. If the matrix lesion is causal, it is a target
    and a screening opportunity; if it is reactive, then a large fraction of the prolapse
    literature is measuring a consequence and calling it a mechanism, and interventions
    aimed at collagen turnover are aimed at the wrong thing. The edge from this node is
    typed INDIRECT_UNKNOWN_INTERMEDIATES for exactly this reason.
  proposed_experiments:
  - experiment_id: prospective_matrix_profiling_nulliparous_cohort
    name: Prospective matrix profiling in a nulliparous cohort followed through first delivery
    description: >
      Sample accessible connective tissue and measure collagen I/III ratio and MMP/TIMP
      profile before first pregnancy in a cohort followed with serial pelvic floor imaging.
      A pre-existing matrix signature in women who later prolapse would establish
      antecedence; a signature that appears only after descent would settle the question
      the other way.
  - experiment_id: site_paired_loaded_unloaded_sampling
    name: Site-paired sampling of loaded and unloaded tissue within the same woman
    description: >
      Within individual prolapse cases, compare matrix markers between mechanically loaded
      vaginal wall and an unloaded connective tissue site from the same patient. A
      difference confined to the loaded site argues for a mechanoresponsive, and therefore
      reactive, change.
  evidence:
  - reference: PMID:16398770
    reference_title: "Collagen metabolism in the uterosacral ligaments and vaginal skin of women with uterine prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The changes which are more pronounced in vaginal tissue may be as a result of prolapse rather than cause."
    explanation: >
      The authors of a matrix study stating the reverse-causation possibility themselves,
      which is what makes this a gap rather than a curator's doubt.
- discussion_id: gap_anatomy_symptom_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Descent of the Pelvic Organs Beyond the Hymen
  prompt: >
    Why does anatomic descent correspond so poorly to symptoms, and what determines which
    women with the same POP-Q stage are bothered?
  rationale: >
    Prolapse is one of the few conditions where the defining anatomic lesion and the
    clinical complaint are close to uncoupled. Symptomatic prolapse affects about 3% of US
    women, while descent on examination is far commoner; of the symptoms attributed to
    prolapse only vaginal bulging is specific. This has practical consequences throughout
    the entry: prevalence figures are not comparable unless the ascertainment is stated,
    the mechanistic chain ends at an anatomic node rather than at a symptom, and surgical
    trials that report anatomic success are not reporting what patients came for. Nothing
    in the sources used here explains the discordance.
  evidence:
  - reference: PMID:31851453
    reference_title: "Narrative review of the epidemiology, diagnosis and pathophysiology of pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The anatomical changes do not always consist with the severity or the symptoms associated with prolapse."
    explanation: >
      States the discordance as a standing problem for the field's epidemiology.
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many women with pelvic organ prolapse are asymptomatic and do not need treatment."
    explanation: >
      The clinical corollary, and the reason observation is a legitimate management option.
- discussion_id: mismatch_elastogenesis_knockout_mice
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
  prompt: >
    Does the elastogenesis-failure mechanism established in Loxl1- and Fbln5-null mice
    operate in human pelvic organ prolapse?
  rationale: >
    The entire mechanistic case that a matrix lesion is sufficient to cause prolapse rests
    on two mouse knockouts, and the translational distance is larger than it first appears.
    Neither gene is returned by the human association studies curated here, which instead
    implicate WNT4, EFEMP1, WT1 and FGFR2; both are germline nulls rather than the common
    regulatory variants human genetics finds; and a quadruped loads its pelvic floor
    differently from a biped, so the same molecular lesion need not produce the same
    mechanical failure. The Fbln5 paper's own comparison is to prolapse in primates rather
    than in women. This is a mismatch and not merely a gap because the evidence exists and
    is strong; it is its applicability to human disease that is unresolved.
  proposed_experiments:
  - experiment_id: human_postpartum_elastogenesis_profiling
    name: Elastic fiber and elastogenic enzyme profiling in human postpartum vaginal tissue
    description: >
      Measure desmosine content, tropoelastin, LOXL1 and fibulin-5 in human vaginal tissue
      across the postpartum period, to test whether the elastogenic burst the mouse studies
      identified exists in women at all, and whether it is attenuated in those with levator
      injury or later prolapse.
  - experiment_id: elastogenesis_rare_variant_burden
    name: Rare-variant burden testing of elastogenesis genes in prolapse cases
    description: >
      Sequence LOXL1, FBLN5 and related elastogenesis genes in a large prolapse cohort and
      test for rare loss-of-function burden. A positive result would connect the murine
      mechanism to human disease; a clean negative would confine these models to
      demonstrating sufficiency in principle.
  evidence:
  - reference: PMID:17255326
    reference_title: "Pelvic organ prolapse in fibulin-5 knockout mice: pregnancy-induced changes in elastic fiber homeostasis in mouse vagina."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "disordered elastic fiber homeostasis is a primary event in the pathogenesis of pelvic organ prolapse in mice"
    explanation: >
      The claim at issue, quoted with the species restriction that the authors themselves
      attached to it.
  - reference: PMID:32184442
    reference_title: "Genome-wide association identifies seven loci for pelvic organ prolapse in Iceland and the UK Biobank."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "found eight sequence variants at seven loci associating with POP"
    explanation: >
      The human genetic result whose gene list does not include the two genes the mouse
      models are built on, which is the substance of the mismatch.
- discussion_id: interpretation_no_emphysema_module_conformance
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Collagen and MMP-TIMP Remodelling Imbalance
  prompt: >
    Should the matrix node conform to
    emphysema_protease_antiprotease_imbalance#Protease-Antiprotease Imbalance?
  rationale: >
    The temptation is real and is worth recording rather than leaving as a silent omission.
    Prolapse shows raised MMP-1/-2/-9 with reduced TIMP-1, and the Loxl1 mouse develops
    enlarged pulmonary airspaces alongside its prolapse from the same elastogenesis defect,
    so the two diseases genuinely share an elastin-loss biology. Conformance was
    nonetheless withheld on three grounds. First, the module is scoped to the alveolus
    throughout: its trigger node is inhaled oxidants and particulates and every downstream
    node is alveolar, so a conforming pelvic node would inherit claims about airway
    inflammation that are false here. Second, the module's imbalance is driven by proteases
    released from recruited neutrophils and macrophages, and no such phagocyte infiltrate
    is evidenced in prolapsed pelvic tissue in any source used here; the cellular source of
    the MMPs is presumed to be the resident fibroblast. Third, and decisively, the module
    asserts its imbalance node as causal, whereas the causal direction of the same
    signature in prolapse is an open gap in this very entry. Declaring conformance would
    launder an unresolved question into an asserted mechanism. A genuinely disease-agnostic
    module for load-bearing soft tissue matrix failure, which would also serve hernia,
    where the human genetics here overlaps, may be worth proposing separately.
  evidence:
  - reference: PMID:14745449
    reference_title: "Elastic fiber homeostasis requires lysyl oxidase-like 1 protein."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Failure to maintain elastic fibers is explained by a theory of antielastase-elastase imbalance, but little is known about the role of renewal."
    explanation: >
      Names the protease-antiprotease framing and, in the same sentence, sets renewal
      against it as the mechanism this paper actually demonstrates, which is why the
      prolapse node is curated as a renewal failure rather than as a protease imbalance.

notes: >
  Curation notes and deliberate omissions.

  Scope. This entry covers pelvic organ prolapse in women. Rectal prolapse and prolapse of
  the male pelvic organs are different diseases and are out of scope.

  Two things a reader might expect and will not find. There is no conforms_to on any node:
  the candidate module, emphysema_protease_antiprotease_imbalance, was examined and
  declined on the record in the interpretation discussion above rather than omitted
  silently. And no phenotype carries a frequency band. Frequency in prolapse is
  ascertainment-dependent to an unusual degree, since the same population yields roughly 3%
  symptomatic prolapse and a far higher rate of descent on examination, so a band lifted
  from any one source would have been quoting a measure whose denominator does not match
  this entry. The discordance itself is curated as a knowledge gap instead.

  Hysterectomy is named as a risk factor by two of the cited reviews and is not curated as
  a pathophysiology node. Post-hysterectomy vault prolapse is real and is covered by the
  apical phenotype and by the surgical treatments, but no source used here supplies a
  mechanism for it beyond the assertion that the operation predisposes, and a node with no
  mechanism would be a restatement of the risk factor. It is a reasonable target for a
  later pass.

  POP-Q is now curated in the diagnosis section as the staged clinical examination it is.
  It is still not curated as a definitions entry with definition_type PHENOTYPE_ALGORITHM,
  and neither is POP-SS (the symptom score that was the POPPY trial's primary endpoint),
  because the instrument-validation studies behind either have not been read. The
  posterior compartment is the other acknowledged gap: rectocele is curated as a phenotype
  but deliberately carries no incoming pathograph edge, for the reason recorded in its own
  notes.

  Provenance. The entry was written first from direct PubMed search, with every reference
  fetched by just fetch-reference; no citation was taken from a synthesised summary, so
  sections 2a and 2b of the evidence SOP do not apply to any evidence item here. A
  Claude Code deep-research report was generated afterwards as a coverage cross-check
  (research/Pelvic_Organ_Prolapse-deep-research-claude_code.md, 34 references, all
  verified, confabulation rate 0.0). It cited no primary source this entry had missed,
  independently reached the same levator-primary canonical arm and the same five
  susceptibility genes, and its one substantive coverage finding - that POP-Q is the
  diagnostic standard and was absent - is what prompted the diagnosis section. preflight-dr
  returns SKIP because MONDO records no RO:0004003 causal gene for MONDO:0000082, which is
  expected for a complex non-Mendelian disease and means the automated gene-identity check
  cannot discriminate; the manual check is the gene-list concordance just described.

name: Pelvic Organ Prolapse
creation_date: "2026-08-24T21:30:00Z"
category: Complex
disease_term:
  preferred_term: pelvic organ prolapse
  term:
    id: MONDO:0000082
    label: pelvic organ prolapse
synonyms:
- POP
- genital prolapse
- urogenital prolapse
- vaginal prolapse
parents:
- reproductive system disorder
- female reproductive system disease
description: >
  Pelvic organ prolapse is the downward descent of the bladder, uterus,
  post-hysterectomy vaginal cuff, or bowel, producing protrusion of the vaginal
  walls or uterus toward and beyond the hymen. It is a mechanical failure of a
  composite support system rather than a disease of one tissue: the levator ani
  muscles hold the pelvic floor closed, and the cardinal, uterosacral and
  paravaginal connective tissue attachments suspend the uterus and vagina from
  the pelvic sidewall. The two elements are load-sharing, so failure of either
  transfers load to the other, and the modern anatomic evidence places the
  primary lesion in the muscle: birth-induced injury to the pubococcygeal
  portion of the levator ani is present in 55% of women with prolapse against
  16% of women with normal support, and enlarges the urogenital hiatus so that
  vaginal wall descending below the hymen is exposed to a pressure differential
  that then loads the connective tissue attachments abnormally.

  A parallel connective tissue arm supplies susceptibility rather than the
  initiating injury. Recovery of pelvic organ support after vaginal delivery
  requires a postpartum burst of elastic fiber assembly; mice null for LOXL1 or
  FBLN5 cannot make it and prolapse, and human GWAS repeatedly returns
  connective tissue and estrogen-pathway loci (WNT4, EFEMP1, WT1, FGFR2). At
  the protein level, prolapsed tissue shows less type I collagen and TIMP-1 and
  more type III collagen and MMP-1/-2/-9, with oxidative injury markers raised
  in the uterosacral ligament and the vaginal wall muscularis depleted of
  smooth muscle. Whether that matrix signature is cause or consequence is
  genuinely unsettled and is curated here as an open gap rather than assumed.

  Prolapse is extremely common as an anatomic finding and much less common as a
  complaint - anatomy and symptoms track each other poorly, and only vaginal
  bulging is specific to it. Management is graded from observation through
  pelvic floor muscle training and vaginal pessary to reconstructive surgery,
  none of which repairs the levator injury itself; a widened genital hiatus
  predicts surgical failure, which is the clinical signature of an unaddressed
  muscular lesion.

references:
- reference: PMID:17382829
  title: "Pelvic organ prolapse."
  findings:
  - statement: >
      Reference clinical review: prolapse is multifactorial, with vaginal childbirth,
      advancing age and rising body-mass index as the most consistent risk factors, and
      only vaginal bulging is specific among the presenting symptoms.
- reference: PMID:27517338
  title: "What's new in the functional anatomy of pelvic organ prolapse?"
  findings:
  - statement: >
      The load-bearing anatomic synthesis: support depends on the interaction of the
      levator ani muscle and the lateral connective tissue attachments, with muscle
      failure exposing the vaginal wall to a pressure differential that abnormally loads
      those attachments.
- reference: PMID:38168908
  title: "Pelvic floor injury during vaginal birth is life-altering and preventable: what can we do about it?"
  findings:
  - statement: >
      Quantifies the birth injury: levator and birth canal tissues stretch to more than
      three times their original length, the resulting tear is present in 55% of women
      with later prolapse (odds ratio 7.3), and it is overstretching rather than
      compression or neuropathy that produces it.
- reference: PMID:36343586
  title: "Levator ani muscle avulsion in patients with pelvic floor dysfunction - Does it help in understanding pelvic organ prolapse?"
  findings:
  - statement: >
      Retrospective cohort of 848 women imaged by transperineal ultrasound relating
      complete levator avulsion to prolapse stage and number of compartments involved.
- reference: PMID:32184442
  title: "Genome-wide association identifies seven loci for pelvic organ prolapse in Iceland and the UK Biobank."
  findings:
  - statement: >
      Eight variants at seven loci in 15,010 cases; the associated genes implicate
      connective tissue metabolism (EFEMP1) and estrogen-dependent regulation (WNT4).
- reference: PMID:39349682
  title: "Genome-wide association studies for pelvic organ prolapse in the Japanese population."
  findings:
  - statement: >
      Japanese GWAS identifying WT1, and a cross-ancestry meta-analysis identifying
      FGFR2, with directional consistency for 21 of 24 European loci.
- reference: PMID:14745449
  title: "Elastic fiber homeostasis requires lysyl oxidase-like 1 protein."
  findings:
  - statement: >
      Loxl1-null mice fail to deposit normal elastic fibers in the uterine tract post
      partum and develop pelvic organ prolapse together with other elastinopathies.
- reference: PMID:17255326
  title: "Pelvic organ prolapse in fibulin-5 knockout mice: pregnancy-induced changes in elastic fiber homeostasis in mouse vagina."
  findings:
  - statement: >
      Fbln5-null mice prolapse, and a postpartum burst of elastic fiber assembly and
      cross-linking in the vaginal wall is what normal recovery of support depends on.
- reference: PMID:35088092
  title: "Mouse Knockout Models for Pelvic Organ Prolapse: a Systematic Review."
  findings:
  - statement: >
      Systematic review of the five available knockout models; Loxl1 and Fbln5 give the
      most reliable phenotype, and they fail by different routes (failure to heal after
      birth versus prolapse with ageing).
- reference: PMID:38291948
  title: "The difference in extracellular matrix metabolism in women with and without pelvic organ prolapse: A systematic review and meta-analysis."
  findings:
  - statement: >
      Meta-analysis of 30 studies (840 cases, 755 controls): type I collagen and TIMP-1
      lower, type III collagen and MMP-1/-2/-9 higher in prolapse, with site-specific
      exceptions that remain controversial.
- reference: PMID:26936098
  title: "Collagen metabolic disorder induced by oxidative stress in human uterosacral ligament-derived fibroblasts: A possible pathophysiological mechanism in pelvic organ prolapse."
  findings:
  - statement: >
      Oxidative injury markers are raised in prolapsed uterosacral ligament, and H2O2
      exposure of uterosacral ligament fibroblasts shifts collagen metabolism toward
      catabolism in a concentration-dependent way.
- reference: PMID:16398770
  title: "Collagen metabolism in the uterosacral ligaments and vaginal skin of women with uterine prolapse."
  findings:
  - statement: >
      The source of the reverse-causation caveat: matrix changes were more pronounced in
      vaginal tissue than in the uterosacral ligament, which the authors read as a
      consequence of prolapse rather than its cause.
- reference: PMID:12114889
  title: "Morphometric analysis of smooth muscle in the anterior vaginal wall of women with pelvic organ prolapse."
  findings:
  - statement: >
      The fractional area of nonvascular smooth muscle in the anterior vaginal wall
      muscularis is reduced in prolapse, independent of age and prolapse stage.
- reference: PMID:18799443
  title: "Prevalence of symptomatic pelvic floor disorders in US women."
  findings:
  - statement: >
      NHANES 2005-2006 national estimate of symptomatic prolapse (seeing or feeling a
      vaginal bulge) and its gradients with age, parity and body-mass index.
- reference: PMID:24807341
  title: "Lifetime risk of stress urinary incontinence or pelvic organ prolapse surgery."
  findings:
  - statement: >
      US claims-based cumulative incidence: 12.6% lifetime risk of prolapse surgery by
      age 80, with annual risk rising progressively to a peak in the early seventies.
- reference: PMID:24290404
  title: "Individualised pelvic floor muscle training in women with pelvic organ prolapse (POPPY): a multicentre randomised controlled trial."
  findings:
  - statement: >
      The definitive randomised trial of one-to-one pelvic floor muscle training in
      symptomatic stage I-III prolapse; the symptom score improved, and anatomy was not
      the endpoint.
- reference: PMID:33207004
  title: "Pessaries (mechanical devices) for managing pelvic organ prolapse in women."
  findings:
  - statement: >
      Cochrane review of four trials: pessary added to pelvic floor muscle training
      probably improves symptoms and prolapse-specific quality of life, while pessary
      versus no treatment or versus training alone remains uncertain.
- reference: PMID:23633316
  title: "Surgical management of pelvic organ prolapse in women."
  findings:
  - statement: >
      Cochrane review of 56 trials in 5954 women establishing sacral colpopexy as
      anatomically superior to vaginal apical procedures, and quantifying transvaginal
      mesh erosion.
- reference: PMID:28538602
  title: "Pelvic organ prolapse: does hormone therapy use matter?"
  findings:
  - statement: >
      Negative result on the hormonal arm: in 1443 postmenopausal women, past hormone
      therapy, duration of use and current vaginal estrogen were not associated with
      pelvic organ support.
- reference: PMID:26348380
  title: "Physical activity and the pelvic floor."
  findings:
  - statement: >
      The counterweight to the mechanical-load risk factor: community-recruited women
      with prolapse on examination report similar lifetime strenuous activity to women
      without it, and lifetime physical activity does not increase the odds of prolapse.
- reference: PMID:23240798
  title: "Prolapse and sexual function in women with benign joint hypermobility syndrome."
  findings:
  - statement: >
      Age-, parity- and ethnicity-matched case-control study showing objectively more
      severe prolapse by POP-Q in benign joint hypermobility syndrome.
- reference: PMID:39033997
  title: "Lower urinary tract involvement in Ehlers-Danlos and Joint Hypermobility syndromes: Review of the literature."
  findings:
  - statement: >
      Literature review giving the prolapse burden in heritable connective tissue
      disorders and an odds ratio for hypermobility.
- reference: PMID:34270804
  title: "Enlargement of the genital hiatus is associated with prolapse recurrence in patients undergoing sacrospinous ligament fixation."
  findings:
  - statement: >
      Postoperative genital hiatus width is associated with recurrence after sacrospinous
      ligament fixation, and a posterior colporrhaphy did not improve success.
- reference: PMID:31851453
  title: "Narrative review of the epidemiology, diagnosis and pathophysiology of pelvic organ prolapse."
  findings:
  - statement: >
      States the anatomy-symptom discordance directly and enumerates the risk factor set
      including previous hysterectomy and menopausal state.
- reference: PMID:18503571
  title: "Levator trauma is associated with pelvic organ prolapse."
  findings:
  - statement: >
      781 women staged by POP-Q and imaged for levator avulsion: avulsion roughly doubles
      the overall risk of stage II or higher prolapse, and the authors attribute the
      effect mainly to cystocele (RR 2.3) and uterine prolapse (RR 4.0) rather than to the
      posterior compartment.
- reference: PMID:16579933
  title: "The relationship between anterior and apical compartment support."
  findings:
  - statement: >
      Dynamic MRI under Valsalva in 153 women: bladder-base and uterine descent correlate
      at r = 0.73, so about half the variation in anterior compartment support is
      attributable to apical support.
- reference: PMID:8694033
  title: "The standardization of terminology of female pelvic organ prolapse and pelvic floor dysfunction."
  findings:
  - statement: >
      The originating POP-Q consensus statement, approved by the International Continence
      Society, the American Urogynecologic Society and the Society of Gynecologic
      Surgeons.
- reference: PMID:21505577
  title: "Pelvic Organ Prolapse Quantification System (POP-Q) - a new era in pelvic prolapse staging."
  findings:
  - statement: >
      Appraisal of POP-Q against the earlier staging systems, concluding it describes a
      prolapse more completely than any predecessor.

prevalence:
- population: United States, non-pregnant women aged 20 years and over
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2900.0
  rate_low: 2100.0
  rate_high: 3700.0
  notes: >
    NHANES 2005-2006. This is prevalence of the symptom (seeing or feeling a bulge in
    or outside the vagina), not of anatomic descent on examination, which is far more
    common. The two are not interchangeable and the discordance between them is itself
    curated as a knowledge gap in this entry.
  evidence:
  - reference: PMID:18799443
    reference_title: "Prevalence of symptomatic pelvic floor disorders in US women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2.9% of women (95% CI, 2.1%-3.7%) experiencing pelvic organ prolapse"
    explanation: >
      Gives the weighted national point estimate and interval used for this record.
- population: Women, lifetime, high-income countries
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 40000.0
  notes: >
    The commonly cited lifetime figure, stated in the background of the Cochrane pessary
    review. It refers to experiencing prolapse rather than to a specific measure of
    anatomic stage, and should not be read as comparable with the NHANES symptom-based
    point prevalence above.
  evidence:
  - reference: PMID:33207004
    reference_title: "Pessaries (mechanical devices) for managing pelvic organ prolapse in women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 40% of women will experience prolapse in their lifetime, with the proportion expected to rise in line with an ageing population."
    explanation: >
      Source of the lifetime figure and of the ageing-population trend statement.
- population: United States, women followed to age 80 (surgery for prolapse)
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 12600.0
  notes: >
    Cumulative incidence of a first prolapse operation, from a 2007-2011 claims database
    covering 10,177,480 women. A surgical-utilisation measure, so it is a lower bound on
    disease and is sensitive to access and practice patterns as well as to biology.
  evidence:
  - reference: PMID:24807341
    reference_title: "Lifetime risk of stress urinary incontinence or pelvic organ prolapse surgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "that for POP surgery was 12.6%"
    explanation: >
      States the cumulative lifetime risk of prolapse surgery by age 80.

mechanistic_hypotheses:
- hypothesis_group_id: levator_muscle_failure_primary
  hypothesis_label: Birth injury to the levator ani is the primary lesion, with connective tissue failure secondary to the resulting pressure differential
  status: CANONICAL
  description: >
    The dominant contemporary model, built on imaging of living women rather than on
    cadaveric or operative inference. Normal support is a load-sharing system: the
    levator ani holds the hiatus closed so that pressures above and below the vaginal
    wall balance and cancel. Birth overstretch tears the pubococcygeal origin; the
    hiatus opens; vaginal wall descending below the hymen now sits between abdominal and
    atmospheric pressure, and the resulting differential loads the cardinal, uterosacral
    and paravaginal attachments abnormally until they too fail. On this model the
    connective tissue lesion is real and measurable but downstream, and the vaginal wall
    fascia contributes least of all.
  evidence:
  - reference: PMID:27517338
    reference_title: "What's new in the functional anatomy of pelvic organ prolapse?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pelvic organ prolapse occurs because of injury to the levator ani muscles and failure of the lateral connections between the pelvic organs to the pelvic sidewall. Abnormalities of the vaginal wall fascial tissues may play a minor role."
    explanation: >
      The review's own summary statement, which both asserts the muscular primacy and
      explicitly demotes the vaginal wall fascial arm.
  - reference: PMID:27517338
    reference_title: "What's new in the functional anatomy of pelvic organ prolapse?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle failure exposes the vaginal wall to a pressure differential producing abnormal tension on the attachments of the pelvic organs to the pelvic sidewall."
    explanation: >
      States the mechanical route by which a muscular lesion produces a connective tissue
      lesion, which is what makes the ordering of this hypothesis testable.
  - reference: PMID:38168908
    reference_title: "Pelvic floor injury during vaginal birth is life-altering and preventable: what can we do about it?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The injury is present in 55% of women with prolapse later in life, with an odds ratio of 7.3, compared with women with normal support."
    explanation: >
      The effect size for the muscular lesion, larger than that reported for any single
      matrix marker.
- hypothesis_group_id: connective_tissue_matrix_primary
  hypothesis_label: A constitutional extracellular matrix defect is the primary lesion, with childbirth acting as the unmasking load
  status: ALTERNATIVE
  description: >
    The older and still-live account, in which the initiating abnormality is in the
    connective tissue itself: reduced load-bearing type I collagen, a shift toward type
    III, excess matrix metalloproteinase activity with insufficient inhibition, and
    impaired elastic fiber renewal. Its strongest support is not the human tissue
    comparisons, which are cross-sectional and cannot order cause and effect, but the
    mouse knockouts, where deleting a single elastogenesis gene produces prolapse with no
    obstetric injury required, and the human genetic signal at connective tissue loci.
    Its weakness is that the human tissue changes may be reactive: the one study that
    compared uterosacral ligament with vaginal tissue found the changes larger in the
    vagina, the tissue actually being stretched.
  evidence:
  - reference: PMID:38291948
    reference_title: "The difference in extracellular matrix metabolism in women with and without pelvic organ prolapse: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with POP have lower expression of COLI and TIMP-1 and higher expression of COLIII and MMPs compared with non-POP cases, but further studies are required to investigate in specified anatomical sites."
    explanation: >
      Pooled quantification of the matrix signature this hypothesis rests on, with the
      authors' own caveat about anatomical site attached.
  - reference: PMID:35088092
    reference_title: "Mouse Knockout Models for Pelvic Organ Prolapse: a Systematic Review."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mouse knockout (KO) models of pelvic organ prolapse (POP) have contributed mechanistic evidence for the role of connective tissue defects, specifically impaired elastic matrix remodeling."
    explanation: >
      The animal evidence that a matrix lesion alone is sufficient, which is what this
      hypothesis needs and what the cross-sectional human data cannot supply.
  - reference: PMID:16398770
    reference_title: "Collagen metabolism in the uterosacral ligaments and vaginal skin of women with uterine prolapse."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The changes which are more pronounced in vaginal tissue may be as a result of prolapse rather than cause."
    explanation: >
      Retained as PARTIAL rather than dropped: it is the authors of a matrix study
      declining to draw the causal conclusion this hypothesis requires.

pathophysiology:
- name: Vaginal Childbirth Mechanical Overload
  biological_scale: TISSUE
  description: >
    Passage of the fetal head requires the levator ani and the soft tissues of the birth
    canal to stretch to more than three times their resting length. This is the single
    largest modifiable risk factor for prolapse, and the mechanism of damage is
    specifically overstretch rather than compression ischaemia or pudendal neuropathy -
    a distinction that matters because it identifies the tissue at risk (the vulnerable
    muscle origin) and the obstetric variables that load it. It is a normal physiological
    event that most women recover from; the disease begins where recovery fails.
  biological_processes:
  - preferred_term: response to mechanical stimulus
    term:
      id: GO:0009612
      label: response to mechanical stimulus
    modifier: INCREASED
  locations:
  - preferred_term: levator ani muscle
    term:
      id: UBERON:0001326
      label: levator ani muscle
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  evidence:
  - reference: PMID:38168908
    reference_title: "Pelvic floor injury during vaginal birth is life-altering and preventable: what can we do about it?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During birth, the levator muscle and birth canal tissues must stretch to more than 3 times their original length; it is this overstretching that is responsible for the muscle tear visible on imaging rather than compression or neuropathy."
    explanation: >
      Quantifies the strain and, importantly for node typing, excludes the two
      alternative injury mechanisms.
  - reference: PMID:38168908
    reference_title: "Pelvic floor injury during vaginal birth is life-altering and preventable: what can we do about it?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk factors for levator injury are multifactorial and include forceps delivery, occiput posterior birth, older maternal age, long second stage of labor, and birthweight of >4000 g."
    explanation: >
      Names the obstetric variables that modulate the load, which is what makes this node
      a modifiable one.
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolapse development is multifactorial, with vaginal child birth, advancing age, and increasing body-mass index as the most consistent risk factors."
    explanation: >
      Independent confirmation that vaginal childbirth is among the most consistent risk
      factors, alongside the two other triggers curated in this entry.
  downstream:
  - target: Levator Ani Muscle Injury and Avulsion
    causal_link_type: DIRECT
    description: >
      Overstretch tears the muscle, most often detaching the pubovisceral/pubococcygeal
      portion from its pubic origin.
    evidence:
    - reference: PMID:38168908
      reference_title: "Pelvic floor injury during vaginal birth is life-altering and preventable: what can we do about it?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Imaging shows that injuries of the levator ani muscle, perineal body, and membrane occur in up to 19% of primiparous women."
      explanation: >
        Establishes that the injury actually occurs at birth, with a frequency, in
        first-time mothers.
  - target: Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
    causal_link_type: DIRECT
    description: >
      Delivery imposes the demand for a postpartum burst of elastic fiber synthesis and
      cross-linking in the vaginal wall; this edge is the demand, and the downstream node
      is the failure to meet it.
    evidence:
    - reference: PMID:17255326
      reference_title: "Pelvic organ prolapse in fibulin-5 knockout mice: pregnancy-induced changes in elastic fiber homeostasis in mouse vagina."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the results suggest that synthesis and assembly of elastic fibers are crucial for recovery of pelvic organ support after vaginal delivery"
      explanation: >
        States the coupling between delivery and the elastogenic requirement that defines
        this edge.

- name: Levator Ani Muscle Injury and Avulsion
  biological_scale: TISSUE
  description: >
    Detachment or tearing of the levator ani, typically of its pubococcygeal portion, and
    typically unrecognised at the time it happens. It is the strongest single anatomic
    correlate of later prolapse and it does not heal: the muscle is not reconstituted,
    which is why the lesion is a permanent change in the mechanics of the pelvic floor
    rather than a recoverable injury. Bilateral and complete avulsions are associated with
    more advanced stage and with involvement of more compartments than unilateral or
    partial ones.
  cell_types:
  - preferred_term: levator ani skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: levator ani muscle
    term:
      id: UBERON:0001326
      label: levator ani muscle
  - preferred_term: pubococcygeus muscle
    term:
      id: UBERON:0011528
      label: pubococcygeus muscle
  evidence:
  - reference: PMID:27517338
    reference_title: "What's new in the functional anatomy of pelvic organ prolapse?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Birth-induced injury to the pubococcygeal portion of the levator ani muscle is seen in 55% of women with prolapse and 16% of women with normal support."
    explanation: >
      The case-control contrast that localises the lesion to the pubococcygeal portion
      and quantifies its excess in prolapse.
  - reference: PMID:36343586
    reference_title: "Levator ani muscle avulsion in patients with pelvic floor dysfunction - Does it help in understanding pelvic organ prolapse?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with complete LAM avulsion are at greater risk of developing POP and have a more advanced stage of prolapse and involvement of multiple compartments."
    explanation: >
      Independent cohort relating avulsion completeness to prolapse severity and extent,
      supporting a dose-like relationship rather than a threshold one.
  downstream:
  - target: Urogenital Hiatus Enlargement and Loss of Levator Closure
    causal_link_type: DIRECT
    description: >
      A torn levator can no longer hold the hiatus closed, so it widens. This is the
      mechanical consequence that carries the rest of the chain.
    evidence:
    - reference: PMID:38168908
      reference_title: "Pelvic floor injury during vaginal birth is life-altering and preventable: what can we do about it?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These injuries are associated with an enlarged urogenital hiatus, now known as antedate prolapse, and with prolapse surgery failure."
      explanation: >
        Links the muscle lesion directly to hiatal enlargement, and names the two things
        that follow from it.
  - target: Cystocele
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Avulsion raises the risk of anterior compartment descent specifically. The
      intermediates - hiatal enlargement and descent beyond the hymen - are both curated
      as their own nodes; what is not known is the step that makes the anterior
      compartment the preferential one, which is why this edge is typed as indirect
      rather than direct.
    evidence:
    - reference: PMID:18503571
      reference_title: "Levator trauma is associated with pelvic organ prolapse."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The association was strongest for cystocele (RR 2.3, 95% CI 2.0-2.7) and uterine prolapse (RR 4.0, 95% CI 2.5-6.5)."
      explanation: >
        Quantifies the compartment-specific risk carried by avulsion in 781 women, which
        is what this edge asserts.
  - target: Uterine Prolapse
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      The same avulsion lesion carries the largest compartment-specific risk for apical
      (uterine) descent, roughly twice the anterior-compartment risk ratio. Typed as
      indirect for the same reason as the cystocele edge.
    evidence:
    - reference: PMID:18503571
      reference_title: "Levator trauma is associated with pelvic organ prolapse."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This effect is mainly due to an increased risk of cystocele and uterine prolapse."
      explanation: >
        The authors' own attribution of the overall avulsion-prolapse association to these
        two compartments, which is what makes the edge compartment-specific rather than a
        restatement of the general association.

- name: Urogenital Hiatus Enlargement and Loss of Levator Closure
  biological_scale: TISSUE
  description: >
    Widening of the levator hiatus, so that the pelvic floor no longer closes. This is the
    hinge of the whole entry. With the hiatus closed, pressures above and below the
    vaginal wall are equal and cancel; once it is open and vaginal wall descends below the
    hymen, that wall lies between abdominal and atmospheric pressure and a net downward
    force appears where none existed. The node therefore has two distinct outputs: it
    permits descent directly, and it converts intra-abdominal pressure into abnormal
    tension on the suspensory attachments. It is also the lesion that prolapse surgery
    does not address, which is why it reappears below as a predictor of recurrence.
  biological_processes:
  - preferred_term: response to mechanical stimulus
    term:
      id: GO:0009612
      label: response to mechanical stimulus
    modifier: ABNORMAL
  locations:
  - preferred_term: levator ani muscle
    term:
      id: UBERON:0001326
      label: levator ani muscle

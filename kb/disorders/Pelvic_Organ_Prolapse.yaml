- name: Collagen and MMP-TIMP Remodelling Imbalance
  biological_scale: MOLECULAR
  description: >
    A shift in the composition and turnover of the pelvic connective tissue matrix:
    less type I collagen (the load-bearing form) and less TIMP-1, more type III collagen
    (thinner, more extensible) and more MMP-1, MMP-2 and MMP-9. Pooled across thirty
    studies the direction is consistent, but the meta-analysis is explicit that the
    picture is site-dependent and that some comparisons remain contradictory - in the
    anterior vaginal wall, type I collagen and MMP-1 showed no difference at all. The
    node is curated with those exceptions attached rather than smoothed away, and its
    causal position is the subject of an open knowledge gap in this entry.
  biological_processes:
  - preferred_term: collagen catabolic process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: INCREASED
  - preferred_term: extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  cell_types:
  - preferred_term: pelvic connective tissue fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:

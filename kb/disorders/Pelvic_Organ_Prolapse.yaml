  downstream:
  - target: Failure of Apical and Lateral Connective Tissue Attachment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      A matrix shifted away from type I collagen and toward unopposed proteolysis is
      expected to elongate and weaken the suspensory attachments. The edge is typed
      INDIRECT_UNKNOWN_INTERMEDIATES because the human data are cross-sectional
      measurements in already-prolapsed tissue and cannot establish that the matrix change
      preceded the mechanical failure.
    evidence:

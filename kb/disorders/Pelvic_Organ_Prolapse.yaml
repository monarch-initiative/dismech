  downstream:
  - target: Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT on purpose. The human
      association signal is at non-coding common variants near connective tissue genes;
      no human variant has been shown to impair elastogenesis in pelvic tissue, and the
      mechanistic step is supplied entirely by mouse knockouts of different genes.
    evidence:
    - reference: PMID:32184442
      reference_title: "Genome-wide association identifies seven loci for pelvic organ prolapse in Iceland and the UK Biobank."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Some of the variants associating with POP also associated with traits of similar pathophysiology."
      explanation: >
        PARTIAL because it establishes shared connective tissue pathophysiology without
        identifying the molecular step, which is exactly the gap this edge type records.
  - target: Collagen and MMP-TIMP Remodelling Imbalance
    causal_link_type: UNKNOWN
    description: >
      Whether constitutional variation is what produces the observed collagen and
      protease-inhibitor imbalance in prolapsed tissue is not established; the edge is
      typed UNKNOWN rather than omitted because the genetic and the biochemical
      observations are usually invoked together.
    evidence:
    - reference: PMID:31851453
      reference_title: "Narrative review of the epidemiology, diagnosis and pathophysiology of pelvic organ prolapse."
      supports: PARTIAL

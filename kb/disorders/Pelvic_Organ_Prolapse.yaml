- name: Constitutional Connective Tissue Susceptibility
  biological_scale: MOLECULAR
  description: >
    Inherited variation in the composition and turnover of pelvic connective tissue,
    which sets how much obstetric and gravitational load a woman's support system
    tolerates before it fails. The evidence is of two kinds and they agree. Common-variant
    association studies return loci whose nearest genes are connective tissue and
    oestrogen-pathway genes rather than muscle genes, and they replicate across ancestries.
    At the other end of the allelic spectrum, monogenic heritable connective tissue
    disorders carry a strikingly high prolapse burden at low parity. Neither is a
    deterministic cause; both make this a susceptibility node feeding the matrix and
    elastogenesis arms rather than a trigger in its own right.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32184442
    reference_title: "Genome-wide association identifies seven loci for pelvic organ prolapse in Iceland and the UK Biobank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results highlight the role of connective tissue metabolism and estrogen exposure in the etiology of POP."
    explanation: >
      The authors' own summary of what the associated loci implicate, which is the two
      arms this node feeds.
  - reference: PMID:32184442
    reference_title: "Genome-wide association identifies seven loci for pelvic organ prolapse in Iceland and the UK Biobank."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rs3791675 at EFEMP1, a gene involved in connective tissue homeostasis, also associates with hernias and carpal tunnel syndrome."
    explanation: >
      A specific locus, and the cross-phenotype pattern (hernia, carpal tunnel) that
      argues the susceptibility is generic connective tissue rather than pelvis-specific.
  - reference: PMID:39349682
    reference_title: "Genome-wide association studies for pelvic organ prolapse in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also observed consistent directions of the effects for 21 out of 24 European GWAS derived loci"
    explanation: >
      Cross-ancestry directional consistency, which is the evidence that the genetic
      architecture is shared rather than population-specific.
  - reference: PMID:23240798
    reference_title: "Prolapse and sexual function in women with benign joint hypermobility syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a statistically significant difference between points Aa, Ba, Ap, Bp and C in study and control groups showing that prolapse is objectively more severe in those with BJHS."
    explanation: >
      Matched case-control evidence from the monogenic-adjacent end of the spectrum,
      measured objectively by POP-Q rather than by symptom report.
  - reference: PMID:39033997
    reference_title: "Lower urinary tract involvement in Ehlers-Danlos and Joint Hypermobility syndromes: Review of the literature."
    supports: SUPPORT

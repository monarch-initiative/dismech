      explanation: >
        States the assumed convergence of risk factors including genetic background onto
        connective tissue weakening, at the level of assertion rather than demonstration.

- name: Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
  biological_scale: MOLECULAR
  description: >
    Failure of the LOXL1- and fibulin-5-dependent programme that deposits and cross-links
    new elastic fibers in the vaginal wall after delivery. Elastic fibers were long
    assumed to be laid down once and left alone; the reproductive tract is the exception,
    and pelvic support turns out to depend on that exception. In mice, deleting either
    LOXL1 or fibulin-5 produces prolapse, and the two do so by different routes -
    Loxl1-null animals fail to repair after birth, Fbln5-null animals prolapse with age -
    which is why this node has both an obstetric and an ageing input.
  molecular_functions:
  - preferred_term: protein-lysine 6-oxidase activity
    term:
      id: GO:0004720
      label: protein-lysine 6-oxidase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: elastic fiber assembly
    term:
      id: GO:0048251
      label: elastic fiber assembly
    modifier: DECREASED
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  evidence:
  - reference: PMID:14745449
    reference_title: "Elastic fiber homeostasis requires lysyl oxidase-like 1 protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that mice lacking the protein lysyl oxidase-like 1 (LOXL1) do not deposit normal elastic fibers in the uterine tract post partum and develop pelvic organ prolapse, enlarged airspaces of the lung, loose skin and vascular abnormalities with concomitant tropoelastin accumulation."
    explanation: >
      The founding result: a single elastogenesis gene deletion is sufficient for
      prolapse, and the defect is specifically postpartum deposition.
  - reference: PMID:14745449
    reference_title: "Elastic fiber homeostasis requires lysyl oxidase-like 1 protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Distinct from the prototypic lysyl oxidase (LOX), LOXL1 localizes specifically to sites of elastogenesis and interacts with fibulin-5."
    explanation: >
      Establishes the molecular partnership that makes LOXL1 and fibulin-5 one node rather
      than two.
  - reference: PMID:17255326
    reference_title: "Pelvic organ prolapse in fibulin-5 knockout mice: pregnancy-induced changes in elastic fiber homeostasis in mouse vagina."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pelvic organ prolapse in Fbln5-/- mice was remarkably similar to that in primates."
    explanation: >
      The phenotypic comparison that motivates treating the mouse lesion as informative
      about human anatomy, and the claim examined in this entry's model-mismatch discussion.
  downstream:
  - target: Failure of Apical and Lateral Connective Tissue Attachment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Elastic fiber failure is expected to reduce the recoil and load tolerance of the
      suspensory tissues, but the step from disordered elastogenesis to measured
      attachment failure has been demonstrated in mice and not in women, so the
      intermediates in the human tissue are not identified.
    evidence:

      DIRECT-with-in-vitro-evidence.
  downstream:
  - target: Collagen and MMP-TIMP Remodelling Imbalance
    causal_link_type: DIRECT
    description: >
      Peroxide exposure of uterosacral ligament fibroblasts changes COL1A1, MMP-2, TIMP-2

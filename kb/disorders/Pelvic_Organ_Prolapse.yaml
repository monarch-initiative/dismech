        The observation that suggests the edge, stated as a within-cases gradient rather
        than as a demonstrated hormonal mechanism.
  - target: Oxidative Stress in Pelvic Floor Connective Tissue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Cumulative oxidative damage is a general feature of connective tissue ageing and is
      the proposed route from ageing to the matrix lesion here, but no study in this entry
      measures oxidative markers against age or menopausal status in pelvic tissue.
    evidence:
    - reference: PMID:26936098
      reference_title: "Collagen metabolic disorder induced by oxidative stress in human uterosacral ligament-derived fibroblasts: A possible pathophysiological mechanism in pelvic organ prolapse."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Oxidative stress (OS) is a well‑recognized mechanism involved in fiber metabolic disorders."
      explanation: >
        Supplies only the general premise linking oxidative stress to fibre metabolism,

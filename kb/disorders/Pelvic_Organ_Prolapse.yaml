      concentration promoting catabolism.
    evidence:
    - reference: PMID:26936098
      reference_title: "Collagen metabolic disorder induced by oxidative stress in human uterosacral ligament-derived fibroblasts: A possible pathophysiological mechanism in pelvic organ prolapse."
      supports: SUPPORT

    reference_title: "Collagen metabolic disorder induced by oxidative stress in human uterosacral ligament-derived fibroblasts: A possible pathophysiological mechanism in pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the immunoreactivity of 8-OHdG in the POP group was significantly higher, compared with that in the control group"
    explanation: >
      Immunohistochemical demonstration of oxidative injury in prolapsed uterosacral
      ligament rather than in cell culture, which is what makes this node about patients.
  - reference: PMID:26936098
    reference_title: "Collagen metabolic disorder induced by oxidative stress in human uterosacral ligament-derived fibroblasts: A possible pathophysiological mechanism in pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggested that OS may be involved in the pathophysiology of POP by contributing to collagen metabolic disorder in a severity‑dependent manner in hUSLFs"
    explanation: >
      The authors' conclusion, quoted through the severity-dependence claim and its
      cell-type restriction to uterosacral ligament fibroblasts; note their own hedging

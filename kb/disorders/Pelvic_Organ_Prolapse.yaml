    reference_title: "The difference in extracellular matrix metabolism in women with and without pelvic organ prolapse: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall results showed that the expression of type III collagen (COLIII) and several matrix metalloproteinases (MMP-1, -2 and -9) were increased, whereas those of type I collagen (COLI), and tissue inhibitor of matrix metalloproteinase-1 (TIMP-1) were decreased in patients with POP."
    explanation: >
      The pooled directional result across 840 cases and 755 controls that defines this
      node.
  - reference: PMID:38291948
    reference_title: "The difference in extracellular matrix metabolism in women with and without pelvic organ prolapse: A systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the expression of COLI and MMP-1 in the AVW showed no difference and the expression of COLI and MMP-1 in the USL is still controversial based on current studies."
    explanation: >
      Retained deliberately as a limit on the node: two of the four markers do not
      separate cases from controls at the site where prolapse is most often measured.
  - reference: PMID:16398770
    reference_title: "Collagen metabolism in the uterosacral ligaments and vaginal skin of women with uterine prolapse."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "For uterosacral ligaments, the differences were not statistically significant."
    explanation: >
      A negative result in the ligament that actually suspends the uterus, retained

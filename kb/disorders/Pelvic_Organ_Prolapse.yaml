      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The primary difference in ligament properties between women with and without prolapse is found in ligament length. Only minor differences in ligament stiffness are seen."
      explanation: >
        Constrains the edge sharply: the measurable ligament abnormality is length, not
        material stiffness, which is what a pure matrix-composition lesion would predict.

- name: Vaginal Wall Smooth Muscle Depletion
  biological_scale: CELLULAR
  description: >
    Reduction in the fractional area of nonvascular smooth muscle in the muscularis of the
    anterior vaginal wall. The vaginal wall is not a passive membrane; its muscularis
    contributes actively to wall mechanics, and losing it reduces the wall's own
    contribution to support. The finding is independent of age and of prolapse stage,
    which argues against it being a simple function of severity, and it is present in
    premenopausal women too - but it is most marked in postmenopausal women not taking
    oestrogen, which is the observation linking this node to the hormonal arm.
  cell_types:
  - preferred_term: vaginal wall smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  evidence:
  - reference: PMID:12114889
    reference_title: "Morphometric analysis of smooth muscle in the anterior vaginal wall of women with pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fractional area of nonvascular vaginal smooth muscle in the muscularis of women with prolapse was significantly decreased compared with that of control subjects."
    explanation: >
      The morphometric measurement that defines this node.
  - reference: PMID:12114889
    reference_title: "Morphometric analysis of smooth muscle in the anterior vaginal wall of women with pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fractional area of muscularis smooth muscle was also decreased significantly in premenopausal women with prolapse."
    explanation: >
      Shows the depletion is not merely a menopausal phenomenon, which is why the hormonal
      edge into this node is typed UNKNOWN rather than DIRECT.
  downstream:
  - target: Failure of Apical and Lateral Connective Tissue Attachment
    causal_link_type: UNKNOWN
    description: >
      Typed UNKNOWN. The measurement is a cross-sectional case-control difference in
      tissue removed at surgery, with no temporal or interventional evidence that smooth
      muscle loss precedes or produces attachment failure; it may equally be a consequence
      of chronic stretch.
    evidence:
    - reference: PMID:12114889
      reference_title: "Morphometric analysis of smooth muscle in the anterior vaginal wall of women with pelvic organ prolapse."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "This decreased fraction of smooth muscle in the anterior vaginal wall was not related to age, race, or stage of prolapse."
      explanation: >
        The absence of a stage relationship is the strongest available argument against
        pure reverse causation, but it is an argument, not a demonstration - hence UNKNOWN.

- name: Oestrogen Withdrawal and Ageing of the Pelvic Support Tissues
  biological_scale: ORGANISM
  description: >
    Advancing age and the menopausal fall in oestrogen, consistently among the strongest
    epidemiological risk factors for prolapse. The mechanistic reading of this node has to
    be handled carefully, because the obvious therapeutic inference from it is wrong.
    Oestrogen-pathway loci come out of GWAS, vaginal smooth muscle is most depleted in
    postmenopausal women not taking oestrogen, and the Fbln5-null mouse prolapses with
    ageing - yet in 1443 postmenopausal women, past hormone therapy, its duration, and
    current vaginal oestrogen were all unassociated with pelvic organ support, and current
    systemic therapy was if anything associated with slightly worse support. Both edges out
    of this node are therefore typed conservatively.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  evidence:
  - reference: PMID:17382829
    reference_title: "Pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vaginal delivery, hysterectomy, chronic straining, normal ageing, and abnormalities of connective tissue or connective-tissue repair predispose some women to disruption, stretching, or dysfunction of the levator ani complex, connective-tissue attachments of the vagina, or both, resulting in prolapse."
    explanation: >
      Places normal ageing among the predisposing exposures and, usefully for this entry,
      names both of the target compartments it acts on.
  - reference: PMID:31851453
    reference_title: "Narrative review of the epidemiology, diagnosis and pathophysiology of pelvic organ prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the risk factors are genetic background, childbirth and mode of delivery, previous hysterectomy, menopausal state and the ratio between Estrogen receptors."
    explanation: >
      Names menopausal state and oestrogen receptor ratio explicitly among the risk
      factors, which is the epidemiological basis for this node.
  - reference: PMID:28538602
    reference_title: "Pelvic organ prolapse: does hormone therapy use matter?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Past HT use, duration of HT use, or current vaginal estrogen use was not associated with pelvic organ support."
    explanation: >
      Retained as REFUTE against the simple reading of this node - that restoring
      oestrogen restores support. It does not refute ageing as a risk factor; it refutes
      the therapeutic corollary, and that distinction is why the node survives with its
      edges downgraded rather than being deleted.
  downstream:
  - target: Vaginal Wall Smooth Muscle Depletion
    causal_link_type: UNKNOWN
    description: >
      Smooth muscle content is lowest in postmenopausal women without oestrogen
      replacement, but it is also significantly reduced in premenopausal women with
      prolapse, and hormone therapy does not measurably improve support. The edge is
      typed UNKNOWN because those three observations cannot all be accommodated by a
      simple oestrogen-dependence model.
    evidence:
    - reference: PMID:12114889
      reference_title: "Morphometric analysis of smooth muscle in the anterior vaginal wall of women with pelvic organ prolapse."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In women with prolapse, vaginal smooth muscle content was most diminished in specimens from postmenopausal women with no estrogen replacement."

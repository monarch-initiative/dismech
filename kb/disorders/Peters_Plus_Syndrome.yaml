- name: B3GLCT Molecular Genetic Testing
  description: >-
    The diagnosis is established molecularly in a proband with suggestive
    clinical findings by identifying biallelic pathogenic B3GLCT variants, or
    one pathogenic variant in trans with a 13q12.3 contiguous gene deletion
    encompassing B3GLCT. Sequencing alone can miss the deletion allele, so
    copy-number analysis of 13q12.3 should accompany sequencing.

    term:
      id: HP:0007957
      label: Corneal opacity
  - preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  notes: >-
    Reported surgical experience is drawn largely from the broader Peters
    anomaly spectrum rather than from molecularly confirmed PTRPLS cohorts; no
    PTRPLS-specific comparative surgical trial exists.
  evidence:
  - reference: PMID:20301637
    reference_title: "Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multidisciplinary care by specialists in relevant fields including

genetic:
- name: B3GLCT
  notes: >-
    B3GLCT (13q12.3, formerly B3GALTL) encodes beta-1,3-glucosyltransferase.
    Biallelic loss-of-function variants, or one loss-of-function variant in
    trans with a contiguous 13q12.3 deletion including B3GLCT, cause PTRPLS. The
    recurrent splice-donor variant c.660+1G>A is by far the most common
    pathogenic allele; frameshift, nonsense, other splice, and rare
    activity-abolishing missense alleles account for the remainder. Because a
    contiguous-deletion allele is part of the mutational spectrum, copy-number
    analysis should accompany sequencing. B3GLCT variants are characteristically
    absent in isolated Peters anomaly and in partial "Peters-plus-like"
    phenotypes.
  gene_term:
    preferred_term: B3GLCT
    term:
      id: hgnc:20207
      label: B3GLCT
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:16909395
    reference_title: "Peters Plus syndrome is caused by mutations in B3GALTL, a putative glycosyltransferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified biallelic truncating mutations in the beta
      1,3-galactosyltransferase-like gene (B3GALTL) in all 20 tested patients
    explanation: >-
      Establishes B3GLCT (B3GALTL) as the single causal gene.
  - reference: PMID:23889335
    reference_title: "Novel B3GALTL mutations in classic Peters plus syndrome and lack of mutations in a large cohort of patients with similar phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with previous reports, the c.660+1G>A mutation was the most
      common mutation identified, seen in eight of the nine patients and
      accounting for 55% of pathogenic alleles in this study and 69% of all
      reported pathogenic alleles
    explanation: >-
      Quantifies the dominance of the recurrent c.660+1G>A splice allele in the
      mutation spectrum.
  - reference: PMID:18798333
    reference_title: "Mutation analysis of B3GALTL in Peters Plus syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in B3GALTL were identified in all four patients with typical
      Peters Plus syndrome, while no mutations were found in the remaining four
      patients that demonstrated some but not all characteristic features of the
      syndrome.
    explanation: >-
      Shows that B3GLCT variants segregate with the complete syndrome and not
      with partial phenotypes.
  - reference: PMID:20301637
    reference_title: "Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      either biallelic pathogenic variants in B3GLCT or compound heterozygosity
      for one pathogenic variant in B3GLCT and a contiguous gene deletion of
      13q12.3 that includes B3GLCT
    explanation: >-
      GeneReviews defines the two molecular genotype configurations that
      establish the diagnosis, including the contiguous-deletion allele.
  - reference: PMID:35170016
    reference_title: "First evidence of SOX2 mutations in Peters' anomaly: Lessons from molecular screening of 95 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unsurprisingly, B3GLCT and PAX6 were the most frequently implicated genes,
      respectively in syndromic and isolated PA.
    explanation: >-
      In the largest Peters anomaly cohort reported, B3GLCT is the leading gene
      for the syndromic form specifically, while PAX6 leads for isolated Peters
      anomaly.

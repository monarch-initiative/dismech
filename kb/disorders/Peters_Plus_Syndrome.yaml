animal_models:
- name: B3glct knockout mouse
  species: Mouse
  genotype: B3glct knockout
  description: >-
    Two independent B3glct knockout alleles reproduce craniofacial and skeletal
    abnormalities comparable to human PTRPLS, together with highly penetrant
    hydrocephalus, white coat spotting, and soft-tissue syndactyly. Genetic and
    biochemical dissection attributes the hydrocephalus and white spotting to
    loss of ADAMTS20, the eye abnormalities to partial reduction of ADAMTS9, and
    the cleft palate to both. This is the most informative whole-animal model of
    the syndrome.
  genes:
  - preferred_term: B3GLCT
    term:
      id: hgnc:20207
      label: B3GLCT
  evidence:
  - reference: PMID:31600785
    reference_title: "ADAMTS9 and ADAMTS20 are differentially affected by loss of B3GLCT in mouse model of Peters plus syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we developed and characterized two mouse B3glct knockout alleles
    explanation: >-
      Establishes the mouse knockout as the principal in vivo model.
  - reference: PMID:31600785
    reference_title: "ADAMTS9 and ADAMTS20 are differentially affected by loss of B3GLCT in mouse model of Peters plus syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, we observed highly penetrant hydrocephalus, white spotting
      and soft tissue syndactyly.
    explanation: >-
      Notes mouse-specific findings that extend beyond the recognized human
      phenotype and limit one-to-one phenotype transfer.
- name: b3glcta/b3glctb double-knockout zebrafish
  species: Zebrafish
  genotype: b3glcta/b3glctb double knockout
  description: >-
    TALEN-generated single and double knockouts of the two zebrafish B3GLCT
    orthologs abolish in vitro b3glct activity, yet double-homozygous fish
    develop normally. Transcriptome analysis identified 483 differentially
    regulated transcripts that may reflect compensation. The model therefore
    does not recapitulate the human disease and is of limited value for
    phenotype studies despite conserved enzyme function.
  genes:
  - preferred_term: B3GLCT
    term:
      id: hgnc:20207
      label: B3GLCT
  evidence:
  - reference: PMID:28926587
    reference_title: "Functional characterization of zebrafish orthologs of the human Beta 3-Glucosyltransferase B3GLCT gene mutated in Peters Plus Syndrome."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, b3glct-/- homozygous fish developed normally.
    explanation: >-
      The zebrafish null does not reproduce the human phenotype, refuting its
      utility as a disease model.
  - reference: PMID:28926587
    reference_title: "Functional characterization of zebrafish orthologs of the human Beta 3-Glucosyltransferase B3GLCT gene mutated in Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Extracts from double homozygous b3glct-/- embryos demonstrated complete
      loss of in vitro b3glct activity.
    explanation: >-
      Confirms the knockout is a true enzymatic null, so the absent phenotype is
      not a technical failure of gene targeting.
progression:
- phase: Prenatal
  notes: >-
    The molecular defect acts during embryogenesis, so the malformations are
    congenital rather than acquired. Affected pregnancies carry an increased
    risk of miscarriage and of second- and third-trimester fetal loss, so the
    observed proportion of affected liveborn siblings is below the theoretical
    25% recurrence risk.
  evidence:
  - reference: PMID:20301637
    reference_title: "Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, at birth the risk to sibs of a proband of being affected is less
      than 25% because there is an increased chance for miscarriages and second-
      and third-trimester loss of affected fetuses.
    explanation: >-
      GeneReviews documents excess prenatal lethality as a feature of the
      natural history.
- phase: Infancy and childhood
  notes: >-
    Structural lesions are congenital and largely non-progressive, but their
    consequences evolve. Early infancy is the critical window for visual-axis
    clearing and amblyopia prevention; glaucoma may emerge at any point and
    requires the GeneReviews surveillance schedule; feeding, speech, dental, and
    hearing consequences of clefting change with age; and short stature and
    developmental limitations become more apparent as developmental demands
    increase.
  evidence:
  - reference: PMID:20301637
    reference_title: "Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      monitor emergence of new ophthalmologic manifestations including glaucoma
      in early infancy, then at age three months and age six months, and a
      minimum of every six months thereafter
    explanation: >-
      The surveillance schedule reflects the expectation that new ophthalmologic
      manifestations emerge over the course of infancy and childhood.
discussions:
- discussion_id: ptrpls_zebrafish_null_no_phenotype
  prompt: >-
    Why does complete loss of b3glct in zebrafish produce no phenotype when the
    orthologous human loss of function causes a severe multisystem malformation
    syndrome, and what compensates?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired ER Quality Control and Secretion of TSR-Containing Proteins
  rationale: >-
    Zebrafish b3glcta/b3glctb double nulls have no detectable enzyme activity
    yet develop normally, while B3glct knockout mice reproduce much of the human
    syndrome and human biallelic loss is severe. The mismatch is not a failure
    of gene conservation - the zebrafish enzymes are catalytically equivalent to
    human B3GLCT - so it points to a species-specific compensatory route for TSR
    folding, or to a difference in the dosage sensitivity of the ADAMTS targets.
    Identifying that compensation would name a candidate therapeutic bypass of
    the human defect, so this is a mechanistically loaded rather than incidental
    discrepancy. It also means negative zebrafish results must not be treated as
    evidence against a proposed PTRPLS mechanism.
  proposed_experiments:
  - experiment_id: ptrpls_zebrafish_compensation_transcriptome
    name: Characterize the zebrafish compensatory transcriptome
    description: >-
      Follow up the 483 differentially regulated transcripts identified in
      b3glct-null embryos to test whether any encode an alternative
      glucosyltransferase or TSR chaperone that can substitute for b3glct, then
      test whether forced expression of the human ortholog of that factor
      rescues TSR secretion in B3GLCT-null human cells.
    supporting_outcome:
    - Identification of an upregulated factor whose human ortholog restores TSR secretion in B3GLCT-null human cells would support species-specific enzymatic or chaperone compensation.
    refuting_outcome:
    - Failure of any candidate to rescue human TSR secretion would argue that the difference lies in substrate dosage sensitivity rather than in a compensating factor.
  - experiment_id: ptrpls_cross_species_adamts_secretion
    name: Cross-species ADAMTS secretion comparison
    description: >-
      Quantify secretion of orthologous ADAMTS9 and ADAMTS20 proteins from
      B3GLCT-null human, mouse, and zebrafish cells to determine whether the
      species difference lies in the folding requirement of the substrate rather
      than in a compensating enzyme.
    supporting_outcome:
    - Preserved ADAMTS secretion from zebrafish nulls alongside impaired secretion from human and mouse nulls would localize the difference to the substrate rather than the pathway.
    refuting_outcome:
    - Equally impaired ADAMTS secretion across all three species would place the divergence downstream of secretion, in tissue-level tolerance of reduced ADAMTS activity.
  evidence:
  - reference: PMID:28926587
    reference_title: "Functional characterization of zebrafish orthologs of the human Beta 3-Glucosyltransferase B3GLCT gene mutated in Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The presented data show that both sequence and function of B3GLCT/b3glct
      genes is conserved in vertebrates. At the same time, complete b3glct
      deficiency in zebrafish appears to be inconsequential and possibly
      compensated for by a yet unknown mechanism.
    explanation: >-
      States the mismatch and the compensation hypothesis explicitly.
  - reference: PMID:31600785
    reference_title: "ADAMTS9 and ADAMTS20 are differentially affected by loss of B3GLCT in mouse model of Peters plus syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mouse B3glct mutants developed craniofacial and skeletal
      abnormalities comparable to PTRPLS.
    explanation: >-
      Contrasting mouse result that makes the zebrafish outcome a genuine
      cross-species discrepancy rather than a general model limitation.
- discussion_id: ptrpls_target_selectivity_gap
  prompt: >-
    Which of the 49 POFUT2/B3GLCT target proteins actually mediate each human
    PTRPLS manifestation, and why are only a subset dosage-sensitive to loss of
    the terminal glucose?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced ADAMTS9 and ADAMTS20 Function in the Extracellular Matrix
  rationale: >-
    Mouse genetics implicates ADAMTS20 and ADAMTS9 for hydrocephalus, white
    spotting, cleft palate, and eye defects, but the human phenotype includes
    features not explained by these two targets (rhizomelic short stature,
    brachydactyly, the characteristic facies, congenital heart and renal
    defects). The correspondence is not uniform in the other direction either:
    hydrocephalus, initially conspicuous as a mouse finding, is in fact
    documented in human PTRPLS fetuses at postmortem, so it appears to be a
    genuinely shared severe/prenatal feature that liveborn clinical series
    under-report - whereas white coat spotting has no human counterpart at all.
    Systematic mapping of which targets are under-secreted in patient cells and
    which tissues depend on each would turn the pathway model into a
    per-phenotype mechanism, and would clarify which apparent species
    differences are real versus ascertainment artifacts.
  evidence:
  - reference: PMID:31600785
    reference_title: "ADAMTS9 and ADAMTS20 are differentially affected by loss of B3GLCT in mouse model of Peters plus syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Previous studies suggested that O-linked fucose is essential for folding
      and secretion of POFUT2-modified proteins and that B3GLCT-mediated
      extension to the disaccharide is essential for only a subset of targets.
    explanation: >-
      States the selective-dependency problem that this gap addresses.
  - reference: PMID:25544610
    reference_title: "Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although 49 putative targets are known, the function of the disaccharide
      and its role in PPS remain unexplored.
    explanation: >-
      Frames the size of the target repertoire against which per-phenotype
      attribution is still missing.
- discussion_id: ptrpls_no_clinical_glycosylation_biomarker
  prompt: >-
    Can the loss of glucose on properdin thrombospondin type-1 repeats be
    developed into a deployable clinical biomarker for Peters plus syndrome and
    for measuring response to any future therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Absent Glucose-beta-1,3-Fucose Disaccharide on Thrombospondin Type-1 Repeats
  rationale: >-
    Unlike the N-glycosylation CDGs, PTRPLS has no routine screening assay -
    serum transferrin isoelectric focusing is normal - so diagnosis is entirely
    genotype-driven. The properdin glycoform assay is a validated research-grade
    biochemical readout of functional null status in patient material, but it
    has not been converted into an available clinical test. Without one there is
    no way to assay the functional consequence of a B3GLCT variant of uncertain
    significance, and no pharmacodynamic endpoint for a future therapy.
  evidence:
  - reference: PMID:18199743
    reference_title: "Peters Plus syndrome is a new congenital disorder of glycosylation and involves defective O-glycosylation of thrombospondin type 1 repeats."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have established a sensitive immunopurification-mass spectrometry
      method, using multiple reaction monitoring, to analyze Omicron-fucosyl
      glycans.
    explanation: >-
      Describes the research assay that would need to be translated into a
      clinical test.
notes: >-
  Scope note. This entry covers Peters plus syndrome, the B3GLCT-related
  syndromic entity (MONDO:0009856, OMIM 261540). It deliberately does NOT cover
  isolated Peters anomaly, which is a genetically distinct anterior-segment
  dysgenesis associated with PAX6, PITX2, PITX3, FOXE3, FOXC1, CYP1B1, and SOX2
  and in which B3GLCT variants are consistently absent; that distinction is
  captured under differential_diagnoses. Related dismech entries covering the
  isolated anterior-segment side of the spectrum are
  FOXE3_Anterior_Segment_Dysgenesis and Axenfeld-Rieger_syndrome.

  Correction to the source issue. GitHub issue 7706 described this disorder as
  "B4GALT1-related". That is incorrect: B4GALT1 causes CDG type IId, a distinct
  disorder. The causal gene here is B3GLCT (hgnc:20207, formerly B3GALTL), as
  confirmed by the MONDO:0009856 record (relationship RO:0004003 HGNC:20207),
  the OMIM 261540 xref, and GeneReviews. The NEC preflight was run against
  MONDO:0009856 before any deep-research content was used.

  Frequencies deliberately omitted. Apart from the three OCCASIONAL bands
  supported directly by the GeneReviews word "occasionally", no phenotype
  frequency is asserted. Two numbers that circulate in the literature were
  specifically rejected: the 30-70% glaucoma frequency and the 2.2-3.1 per
  100,000 birth prevalence both describe the broader Peters anomaly spectrum,
  not molecularly confirmed Peters plus syndrome, and a roughly 33%
  cardiac-malformation figure derives from a very small, ascertainment-biased
  case literature.

  Prevalence. Orphanet (ORPHA:709) is the natural structured source, but the
  pinned Orphadata bulk XML in this repository no longer matches its manifest
  checksum, so no ORPHA_709 cache record could be generated. Only the
  qualitative rarity band is therefore recorded.

  Deep research. Edison/falcon was run for this entry
  (research/Peters_Plus_Syndrome-deep-research-falcon.md, 730 s, 19 citations).
  Its NEC identity anchors matched (B3GLCT, MONDO:0009856, OMIM 261540, explicit
  separation from isolated Peters anomaly). The report contributed the Vasudevan
  2015 noncanonical-ER-quality-control mechanism (PMID:25544610), the Chesneau
  2022 Peters anomaly cohort (PMID:35170016), the Delas 2025 Peters-plus-like
  CNV case (PMID:40650233), and the c.755delC variant report (PMID:31795264).
  Its claim that no validated B3glct-null mouse exists was contradicted by
  independent PubMed searching and is not reflected in this entry; PMID:31600785
  describes exactly such a model.

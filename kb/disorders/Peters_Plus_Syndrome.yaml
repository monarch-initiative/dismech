- name: Ophthalmologic Surveillance for Glaucoma
  description: >-
    Because glaucoma can develop at any age and threatens residual vision,
    GeneReviews recommends intraocular-pressure and ophthalmologic surveillance
    in early infancy, again at three and six months of age, and at least every
    six months thereafter. Early infancy is also the critical window for
    detecting and treating deprivation amblyopia.
  action_category: MONITORING
  treatment_term:
    preferred_term: ophthalmologic surveillance
    term:
      id: NCIT:C38060
      label: Eye Examination
  notes: >-
    Modeled as a MONITORING action rather than a therapy, so it deliberately
    carries no target_phenotypes / target_mechanisms link: surveillance detects
    glaucoma, it does not act on the glaucoma mechanism. The phenotype it
    watches for is named in the description and is curated separately under
    phenotypes.
  evidence:
  - reference: PMID:20301637
    reference_title: "Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      monitor emergence of new ophthalmologic manifestations including glaucoma
      in early infancy, then at age three months and age six months, and a
      minimum of every six months thereafter
    explanation: >-
      GeneReviews surveillance schedule for glaucoma.
- name: Physical and Occupational Therapy
  description: >-
    Physical and occupational therapy, coordinated with orthopedics, to address

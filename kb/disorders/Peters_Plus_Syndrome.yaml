  - preferred_term: B3GLCT
    term:
      id: hgnc:20207
      label: B3GLCT
  molecular_functions:
  - preferred_term: beta-1,3-glucosyltransferase activity
    term:
      id: GO:0046527
      label: glucosyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:16909395
    reference_title: "Peters Plus syndrome is caused by mutations in B3GALTL, a putative glycosyltransferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

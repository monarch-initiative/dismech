name: Peters plus syndrome
creation_date: "2026-08-01T00:00:00Z"
description: >-
  Peters plus syndrome (PTRPLS, Krause-Kivlin syndrome) is a rare autosomal
  recessive congenital disorder of glycosylation caused by biallelic
  loss-of-function variants in B3GLCT (formerly B3GALTL), which encodes
  beta-1,3-glucosyltransferase. B3GLCT performs the second step of a
  noncanonical endoplasmic-reticulum quality-control pathway: protein
  O-fucosyltransferase 2 (POFUT2) recognizes correctly folded thrombospondin
  type-1 repeats (TSRs) and attaches O-fucose, and B3GLCT then elongates it to
  the glucose-beta-1,3-fucose disaccharide. Unlike classical ER quality control,
  which tags unfolded protein, this pathway marks and stabilizes the folded
  state. Losing the terminal glucose destabilizes TSRs and impairs ER exit and
  secretion of a subset of the 49 predicted TSR-containing targets, most of
  which belong to the ADAMTS/ADAMTSL and thrombospondin families. Clinically the
  syndrome combines Peters anomaly and other anterior-segment eye anomalies with
  disproportionate rhizomelic short stature, brachydactyly with broad hands and
  feet, distinctive facies (exaggerated cupid's-bow upper lip, prominent
  forehead, hypertelorism), variable developmental delay or intellectual
  disability, and occasional cleft lip/palate and congenital heart defects. It
  is distinct from isolated Peters anomaly and from "Peters-plus-like"
  phenotypes, in neither of which biallelic loss-of-function B3GLCT variants are
  found.
category: Mendelian
parents:
- syndromic disease
- autosomal recessive disease
- congenital disorder of glycosylation
synonyms:
- PTRPLS
- Krause-Kivlin syndrome
- Krause-van Schooneveld-Kivlin syndrome
- Peters anomaly with short limb dwarfism
- B3GALTL deficiency
- B3GLCT-related Peters plus syndrome

    reference_title: "Contribution of a Novel B3GLCT Variant to Peters Plus Syndrome Discovered by a Combination of Next-Generation Sequencing and Automated Text Mining."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPS, a very rare subtype of ASD, is a glycosylation disorder
    explanation: >-
      Supports only the qualitative rarity band; no quantitative rate is
      asserted anywhere in the reviewed literature.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    PTRPLS is autosomal recessive. Affected individuals carry biallelic
    pathogenic B3GLCT variants, or one pathogenic B3GLCT variant in trans with a
    contiguous 13q12.3 deletion that includes B3GLCT. The observed sibling
    recurrence risk at birth is lower than the theoretical 25% because of
    increased miscarriage and second- and third-trimester loss of affected
    fetuses.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301637
    reference_title: "Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PTRPLS is inherited in an autosomal recessive manner. If both parents are
      known to be heterozygous for a pathogenic variant involving B3GLCT, each
      sib of an affected individual has at conception a 25% chance of being
      affected
    explanation: >-
      GeneReviews establishes the autosomal recessive mode of inheritance and
      the recurrence risk.
  - reference: PMID:16909395
    reference_title: "Peters Plus syndrome is caused by mutations in B3GALTL, a putative glycosyltransferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified biallelic truncating mutations in the beta
      1,3-galactosyltransferase-like gene (B3GALTL) in all 20 tested patients,
      showing that Peters Plus is a monogenic, primarily single-mutation
      syndrome
    explanation: >-
      The gene-discovery study documents biallelic (recessive) truncating
      variants in every tested proband.
pathophysiology:
- name: B3GLCT Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in B3GLCT abolish or severely reduce
    beta-1,3-glucosyltransferase activity. The recurrent intronic splice-donor
    allele c.660+1G>A accounts for the majority of reported pathogenic alleles;
    frameshift, nonsense, other splice, and rare missense alleles complete the
    spectrum. In vitro assays show that PTRPLS-associated substitutions cause
    loss of catalytic activity and/or destabilize the protein, whereas
    substitutions found only in milder "Peters-plus-like" patients retain
    activity - evidence that it is specifically the loss of glucose transfer,
    not any B3GLCT sequence change, that produces the syndrome.

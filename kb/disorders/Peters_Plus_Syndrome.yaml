      GeneReviews diagnostic criterion.
  - reference: PMID:35170016
    reference_title: "First evidence of SOX2 mutations in Peters' anomaly: Lessons from molecular screening of 95 patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Causative genetic defects involving 12 genes and CNVs were identified for
      1/3 of patients.
    explanation: >-
      Reports diagnostic yield across the Peters anomaly spectrum using combined
      array, exome, genome, and panel testing. This is spectrum-wide yield, not
      PTRPLS test sensitivity, so it is recorded as partial support.
- name: Prenatal Ultrasound Recognition
  description: >-
    The syndrome can be suspected prenatally on the combination of
    microphthalmia with an echogenic anterior eye defect, short limbs with broad
    extremities, micrognathia and long philtrum, and renal anomalies. Corneal
    and anterior-segment findings are nonetheless hard to detect prenatally, so
    a normal scan does not exclude the diagnosis.
  evidence:
  - reference: PMID:15912477
    reference_title: "Prenatal sonographic findings in Peters-plus syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrasound examination revealed microphthalmia and hyperechogenicity of
      the anterior part of the eye with a central defect, micrognathia and long
      philtrum, short limbs with broad extremities and unilateral multicystic
      kidney.
    explanation: >-
      Documents the prenatal sonographic constellation in an autopsy-confirmed
      case.
differential_diagnoses:
- name: Isolated Peters anomaly
  description: >-
    Peters anomaly occurring without the systemic features of PTRPLS. This is
    the single most important distinction for this entry: isolated Peters
    anomaly is a genetically distinct anterior-segment dysgenesis, and B3GLCT
    variants are consistently absent in it. Screening of 55 individuals with
    PTRPLS-like phenotypes or isolated Peters anomaly identified no B3GLCT
    variants, and in the largest Peters anomaly cohort reported the leading gene
    for isolated disease is PAX6 rather than B3GLCT.
  distinguishing_features:
  - Absence of disproportionate rhizomelic short stature, brachydactyly, and broad hands and feet
  - Absence of the characteristic facies (exaggerated cupid's-bow upper lip, prominent forehead, hypertelorism)
  - Absence of cleft lip and/or palate and of developmental delay
  - Absence of biallelic loss-of-function B3GLCT variants
  - Often unilateral and milder ocular disease, whereas PTRPLS ocular involvement is typically bilateral
  - Associated instead with PAX6, PITX2, PITX3, FOXE3, FOXC1, CYP1B1, and SOX2 variants
  evidence:
  - reference: PMID:23889335
    reference_title: "Novel B3GALTL mutations in classic Peters plus syndrome and lack of mutations in a large cohort of patients with similar phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also report the absence of B3GALTL mutations in 55 cases of PPS-like
      phenotypes or isolated Peters anomaly, further establishing the strong
      association of B3GALTL mutations with classic PPS only.
    explanation: >-
      Direct cohort evidence that B3GLCT is not implicated in isolated Peters
      anomaly, separating it from PTRPLS.
  - reference: PMID:35170016
    reference_title: "First evidence of SOX2 mutations in Peters' anomaly: Lessons from molecular screening of 95 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several genes are involved in syndromic or isolated PA (B3GLCT, PAX6,
      PITX3, FOXE3, CYP1B1).
    explanation: >-
      Enumerates the genetically distinct causes of Peters anomaly outside the
      B3GLCT syndromic entity.
  - reference: PMID:35170016
    reference_title: "First evidence of SOX2 mutations in Peters' anomaly: Lessons from molecular screening of 95 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unsurprisingly, B3GLCT and PAX6 were the most frequently implicated genes,
      respectively in syndromic and isolated PA.
    explanation: >-
      Assigns B3GLCT to syndromic and PAX6 to isolated Peters anomaly, the
      cleanest statement of the split.
- name: Peters-plus-like syndrome
  description: >-
    Individuals who display a PTRPLS-like clinical pattern but lack diagnostic
    biallelic B3GLCT variants. Some carry B3GLCT missense changes, but
    functional testing shows these retain enzymatic activity, so the underlying
    cause is not loss of the Glc-beta1,3-Fuc disaccharide. Copy-number variants
    involving other loci can produce the pattern: a de novo 1.6 Mb deletion
    spanning PEX2 and ZFHX4 was reported in a patient with a Peters-plus-like
    phenotype.
  distinguishing_features:
  - Incomplete or atypical clinical constellation relative to classic PTRPLS
  - No biallelic loss-of-function B3GLCT genotype
  - B3GLCT alleles, when present, retain catalytic activity in vitro
  - May be explained by copy-number variants at other loci, such as a PEX2-ZFHX4 deletion
  evidence:
  - reference: PMID:34058199
    reference_title: "Peters plus syndrome mutations affect the function and stability of human beta1,3-glucosyltransferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, B3GLCT with PTRPLS-like mutations retained enzymatic
      activity, although some showed a minor destabilizing effect.
    explanation: >-
      Functional data distinguishing true PTRPLS alleles from those seen in
      partial phenotypes.
  - reference: PMID:40650233
    reference_title: "Novel Genetic Variants and Clinical Profiles in Peters Anomaly Spectrum Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first patient, a heterozygous ~1.6 Mb deletion was detected,
      spanning the genes PEX2 and ZFHX4
    explanation: >-
      Documents a non-B3GLCT copy-number cause of a Peters-plus-like
      presentation.
  - reference: PMID:40650233
    reference_title: "Novel Genetic Variants and Clinical Profiles in Peters Anomaly Spectrum Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with the first patient displaying both ocular and systemic anomalies as in
      a Peters plus-like syndrome phenotype, while the second patient had
      isolated ocular manifestations as in a PA type 1 phenotype
    explanation: >-
      Illustrates the clinical separation of Peters-plus-like from isolated
      Peters anomaly within the same cohort.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying therapy - no B3GLCT replacement, substrate,
    chaperone, gene, or RNA therapy exists. Management is supportive and
    multidisciplinary, coordinating ophthalmology, orthopedics, rehabilitation
    therapies, educational support, a cleft lip/palate team, and social services
    including planning the transition from pediatric to adult care.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301637
    reference_title: "Peters Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multidisciplinary care by specialists in relevant fields including
      ophthalmology to manage eye anomalies; low vision services as needed;
      orthopedics, physical therapy, and occupational therapy to determine need
      for adaptive devices to address mobility and fine motor needs; educational
      support for developmental delay and/or intellectual disability; cleft
      lip/palate team; social services to develop a plan for transition from
      pediatric care to adult care.
    explanation: >-
      GeneReviews management recommendation defining the supportive-care model.
- name: Ophthalmologic Surgical Management
  description: >-
    Surgical management of the anterior-segment anomaly, which may include
    penetrating keratoplasty or keratoprosthesis for visually significant
    opacity, lensectomy, and glaucoma procedures. Decisions are individualized:
    severe bilateral dysgenesis, glaucoma, graft failure, and retinal
    complications can limit the benefit, and surgery is sometimes deliberately
    deferred.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: ophthalmologic surgical procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No robust PTRPLS-specific prevalence or incidence estimate exists; the
    literature consistently describes it only qualitatively as a very rare
    subtype of anterior segment dysgenesis. The population figure of 2.2-3.1 per
    100,000 births that appears in recent literature applies to the broader
    Peters anomaly spectrum and must NOT be relabelled as a Peters plus syndrome
    rate. Orphanet (ORPHA:709) would be the natural structured source but no
    ORPHA cache record could be generated in this repository.
  evidence:

- name: Anterior Segment Dysgenesis
  conforms_to: "anterior_segment_dysgenesis#Failed Differentiation and Separation of Anterior Segment Tissues"
  biological_scale: TISSUE
  description: >-
    Defective remodelling of the developing anterior eye segment produces Peters
    anomaly: failure to separate the lens vesicle and/or iris from the surface
    ectoderm-derived cornea, leaving posterior corneal (Descemet membrane and
    endothelium) defects with iridocorneal and sometimes keratolenticular
    adhesions. Deep ocular phenotyping in PTRPLS most often shows an avascular
    paracentral ring opacity caused by iridocorneal adhesion, with relative
    central clearing over an area of posterior stromal thinning; a large
    vascularized central opacity is the less common alternative pattern.
    Periocular neural-crest-derived mesenchyme populates these structures, and
    abnormal neural crest development was the leading pre-molecular hypothesis
    for the syndrome.

  - reference: PMID:25544610
    reference_title: "Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      O-fucose is added to cysteine-rich domains called thrombospondin type 1
      repeats (TSRs) by protein O-fucosyltransferase 2 (POFUT2) and is elongated
      with glucose by β3-glucosyltransferase (B3GLCT).
    explanation: >-
      States the two-enzyme sequential reaction that B3GLCT loss interrupts.
  downstream:
  - target: Impaired ER Quality Control and Secretion of TSR-Containing Proteins
    causal_link_type: DIRECT
    description: >-
      Fucose and glucose stabilize the folded TSR additively; without the
      glucose, folded TSRs are less stable and ER exit is less efficient.
    evidence:
    - reference: PMID:25544610
      reference_title: "Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro unfolding assays demonstrate that fucose and glucose stabilize
        folded TSRs in an additive manner.
      explanation: >-
        Direct biophysical evidence that the terminal glucose contributes to TSR
        stability, which is the immediate consequence of B3GLCT loss.
- name: Impaired ER Quality Control and Secretion of TSR-Containing Proteins
  conforms_to: "tsr_o_glycosylation_quality_control#Impaired ER Quality Control and Secretion of TSR-Containing Proteins"
  biological_scale: CELLULAR
  description: >-
    POFUT2 and B3GLCT together constitute a noncanonical endoplasmic-reticulum
    quality-control mechanism. Where classical ER quality control identifies and
    tags unfolded protein, this pathway recognizes the FOLDED TSR
    cotranslationally and stabilizes it by glycosylation, marking it for ER
    exit. Loss of the terminal glucose therefore reduces the secretion
    efficiency of a subset of the 49 predicted TSR-modified proteins - a subset,
    not all of them, which is why PTRPLS is survivable while Pofut2-null mice
    are embryonic lethal. Nearly half of the targets are members of the ADAMTS
    superfamily, which act in the extracellular matrix.
  biological_processes:
  - preferred_term: protein folding in endoplasmic reticulum
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
    modifier: ABNORMAL
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED

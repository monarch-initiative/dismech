- name: Genetic Counseling
  description: >-
    Counseling on autosomal recessive recurrence risk. Once the familial B3GLCT
    variants are known, carrier testing for at-risk relatives and prenatal or
    preimplantation genetic testing are available. Counseling should note that
    the observed sibling risk at birth is below the theoretical 25% because of
    increased fetal loss.

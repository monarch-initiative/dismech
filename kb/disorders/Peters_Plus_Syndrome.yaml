  evidence:
  - reference: PMID:25544610
    reference_title: "Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While known ER quality-control machinery rely on identifying and tagging
      unfolded proteins, we find that POFUT2 and B3GLCT mediate a noncanonical
      ER quality-control mechanism that recognizes folded TSRs and stabilizes
      them by glycosylation.
    explanation: >-
      Defines the noncanonical, folded-state-recognizing quality-control
      mechanism that B3GLCT loss disrupts.
  - reference: PMID:25544610
    reference_title: "Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that while POFUT2 is required for secretion of all targets
      tested, B3GLCT only affects the secretion of a subset, consistent with the
      observation that B3GLCT mutant phenotypes in PPS patients are less severe
      than embryonic lethal phenotypes of Pofut2-null mice.
    explanation: >-
      Explains the selective, sub-lethal character of the human phenotype: only
      some TSR targets depend on the B3GLCT step.
  - reference: PMID:31600785
    reference_title: "ADAMTS9 and ADAMTS20 are differentially affected by loss of B3GLCT in mouse model of Peters plus syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Forty-nine proteins are predicted to be modified by POFUT2, and nearly
      half are members of the ADAMTS superfamily.
    explanation: >-
      Quantifies the target repertoire and identifies ADAMTS proteins as the
      dominant substrate class.
  downstream:

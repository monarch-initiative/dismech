      1,3-galactosyltransferase-like gene (B3GALTL) in all 20 tested patients
    explanation: >-
      Establishes biallelic truncating B3GLCT (B3GALTL) variants as the cause of
      Peters plus syndrome.
  - reference: PMID:34058199
    reference_title: "Peters plus syndrome mutations affect the function and stability of human beta1,3-glucosyltransferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results demonstrated that PTRPLS mutations caused loss of B3GLCT
      enzymatic activity and/or significantly reduced protein stability.
    explanation: >-
      Functional assays confirm that PTRPLS alleles are loss-of-function at the
      level of enzyme activity or protein stability.
  - reference: PMID:34058199
    reference_title: "Peters plus syndrome mutations affect the function and stability of human beta1,3-glucosyltransferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overall, our data supports the hypothesis that loss of glucose from B3GLCT
      substrate proteins is responsible for the defects observed in PTRPLS
      patients, but not for those observed in PTRPLS-like patients.
    explanation: >-
      Ties the disease specifically to loss of the glucose transfer reaction and
      separates it from PTRPLS-like phenotypes.
  downstream:
  - target: Absent Glucose-beta-1,3-Fucose Disaccharide on Thrombospondin Type-1 Repeats
    causal_link_type: DIRECT
    description: >-
      Without B3GLCT activity the O-fucose added to TSRs by POFUT2 cannot be
      elongated to the Glc-beta1,3-Fuc disaccharide.
    evidence:
    - reference: PMID:18199743
      reference_title: "Peters Plus syndrome is a new congenital disorder of glycosylation and involves defective O-glycosylation of thrombospondin type 1 repeats."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In properdin from patients, we could not detect the
        Glc-beta1,3-Fuc-Omicron-disaccharide, and we only found
        Fuc-Omicron-at all four Omicron-fucosylation sites.
      explanation: >-
        Direct demonstration in patient material that the disaccharide is absent
        and only the O-fucose monosaccharide remains.
- name: Absent Glucose-beta-1,3-Fucose Disaccharide on Thrombospondin Type-1 Repeats
  conforms_to: "tsr_o_glycosylation_quality_control#Absent Glucose-beta-1,3-Fucose Disaccharide on Thrombospondin Type-1 Repeats"
  biological_scale: MOLECULAR
  description: >-
    POFUT2 and B3GLCT act sequentially to add an O-linked
    glucose-beta-1,3-fucose disaccharide to properly folded thrombospondin
    type-1 repeats. In PTRPLS the pathway stalls after the first step, so TSRs
    on target glycoproteins carry only O-fucose. This was shown directly in
    patient-derived properdin, the reporter protein used to establish PTRPLS as
    a congenital disorder of glycosylation; loss of the disaccharide on
    properdin remains the only human biochemical readout of functional null
    status.

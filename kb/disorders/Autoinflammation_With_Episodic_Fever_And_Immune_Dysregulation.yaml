    causal_link_type: DIRECT
  - target: Colitis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, these data indicate that LUBAC-deficient patients are predominantly sensitized to apoptosis, with limited propensity to necroptosis in response to TNF."
    explanation: Establishes apoptosis as the predominant TNF-induced death mode in patient cells.
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed a significant increase of cleaved gasdermin (GSDM)-D positive cells in the intestinal epithelium and the lamina propria of LUBAC-deficient patients compared to a control donor, indicating that pyroptosis is activated in the gut of these patients"
    explanation: Documents pyroptosis (cleaved GSDMD) in the gut of LUBAC-deficient patients, the cell-death route feeding the colitis branch.
  - reference: PMID:34887354
    reference_title: "Immune dysregulation in SHARPIN-deficient mice is dependent on CYLD-mediated cell death."

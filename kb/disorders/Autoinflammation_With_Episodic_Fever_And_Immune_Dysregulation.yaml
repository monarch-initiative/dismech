name: Autoinflammation With Episodic Fever and Immune Dysregulation
creation_date: "2026-10-23T00:00:00Z"
category: Mendelian
categories:
- Autoinflammatory Disease
- Inborn Error of Immunity
parents:
- hereditary disease
disease_term:
  preferred_term: autoinflammation with episodic fever and immune dysregulation
  term:
    id: MONDO:0968982
    label: autoinflammation with episodic fever and immune dysregulation
synonyms:
- SHARPIN deficiency
- sharpenia
description: >-
  Autoinflammation with episodic fever and immune dysregulation (OMIM:620795), also termed
  SHARPIN deficiency or "sharpenia", is a rare autosomal recessive disorder caused by
  biallelic loss-of-function variants in SHARPIN. SHARPIN is one of the three components of
  the linear ubiquitin chain assembly complex (LUBAC), together with the catalytic subunit
  HOIP (RNF31) and HOIL-1 (RBCK1); LUBAC conjugates linear (M1-linked) polyubiquitin chains
  onto targets in the TNF-receptor and NF-kappaB signalling machinery. SHARPIN is a
  scaffold subunit that stabilizes HOIP, so its loss destabilizes the whole complex,
  attenuating canonical NF-kappaB responses and sensitizing cells to death mediated by TNF
  superfamily members (predominantly apoptosis). Clinically the two reported individuals
  had recurrent fevers and autoinflammation (parotitis, arthritis, colitis, lymphadenopathy)
  together with an immunodeficiency marked by reduced germinal-center B cell development,
  and, as in the other LUBAC-component deficiencies, hepatic glycogen deposition. Notably,
  and in contrast to the long-studied Sharpin-deficient chronic proliferative dermatitis
  (cpdm) mouse, the human patients had no dermatological disease. Anti-TNF therapy produced
  complete clinical and transcriptomic resolution of the autoinflammation in one patient.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous) loss-of-function variants in SHARPIN, identified in two
    unrelated pedigrees, one consanguineous; consistent with the recessive inheritance of
    the other LUBAC-component deficiencies (RBCK1, RNF31).
  evidence:
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio exome sequencing in the two pedigrees identified homozygous frameshift variants in the SHARPIN gene"
    explanation: Establishes the biallelic (homozygous) loss-of-function basis, hence autosomal recessive inheritance.
pathophysiology:
- name: Biallelic SHARPIN Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic frameshift loss-of-function variants in SHARPIN abolish SHARPIN protein. The
    reported alleles lack the UBL domain required for interaction with the catalytic LUBAC
    subunit HOIP.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline homozygous frameshift SHARPIN variants (c.220dupC, p.Leu74ProfsX86; and
      c.613_614delCT, p.Leu205GlufsX21) with no detectable SHARPIN protein.
  genes:
  - preferred_term: SHARPIN
    term:
      id: hgnc:25321
      label: SHARPIN
  molecular_functions:
  - preferred_term: ubiquitin protein ligase binding
    term:
      id: GO:0031625
      label: ubiquitin protein ligase binding
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Destabilization of the LUBAC Complex

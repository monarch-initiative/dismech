  evidence:
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no full-length or truncated SHARPIN protein was detected"
    explanation: Confirms complete loss of SHARPIN protein in patient cells.
  - reference: PMID:21455181
    reference_title: "SHARPIN forms a linear ubiquitin ligase complex regulating NF-κB activity and apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon binding to the LUBAC subunit HOIP (also known as RNF31), SHARPIN stimulates the formation of linear ubiquitin chains in vitro and in vivo."
    explanation: Establishes SHARPIN's molecular function, binding the HOIP ubiquitin ligase and stimulating linear ubiquitination, which is lost when SHARPIN is absent.
- name: Destabilization of the LUBAC Complex
  biological_scale: MOLECULAR
  description: >-
    SHARPIN is a scaffold subunit that stabilizes the catalytic LUBAC subunit HOIP; losing
    SHARPIN reduces HOIP and impairs the complex's assembly of linear (M1-linked)
    polyubiquitin chains, chiefly within the TNF receptor signalling complex. Re-expression
    of wild-type SHARPIN restores HOIP.
  biological_processes:
  - preferred_term: protein linear polyubiquitination
    term:
      id: GO:0097039
      label: protein linear polyubiquitination
    modifier: DECREASED
  downstream:
  - target: Attenuated Canonical NF-kappaB Signalling
    causal_link_type: DIRECT
  - target: Sensitization to TNF-Induced Cell Death
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HOIP is the main catalytic subunit of LUBAC with an E3 ligase activity for linear ubiquitylation. HOIL-1 and SHARPIN function as scaffold proteins"
    explanation: Establishes SHARPIN as a LUBAC scaffold whose loss compromises the catalytic complex.
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "re-expression of wild type SHARPIN restored HOIP expression"
    explanation: Rescue of HOIP by wild-type SHARPIN shows the HOIP loss is a direct consequence of SHARPIN loss.
- name: Attenuated Canonical NF-kappaB Signalling
  biological_scale: MOLECULAR
  description: >-
    Linear ubiquitin chains assembled by LUBAC are required for full canonical NF-kappaB
    activation downstream of TNF; patient fibroblasts and B cells show attenuated canonical
    NF-kappaB responses.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:

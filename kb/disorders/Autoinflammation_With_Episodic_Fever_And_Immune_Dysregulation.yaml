    evidence_source: MODEL_ORGANISM
    snippet: "We observed enhanced association of RIPK1 with the death-signaling Complex II following TNF stimulation in Sharpincpdm/cpdm cells"
    explanation: Model-organism support for TNF-induced death-complex assembly on loss of Sharpin.
  - reference: PMID:25443632
    reference_title: "TNFR1-dependent cell death drives inflammation in Sharpin-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The inactivating mouse Sharpin cpdm mutation causes TNF-dependent multi-organ inflammation, characterized by dermatitis, liver inflammation, splenomegaly, and loss of Peyer's patches."
    explanation: Establishes that the TNF-driven cell death downstream of Sharpin loss is what drives the multi-organ inflammation.

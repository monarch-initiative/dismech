animal_models:
- name: Sharpin-deficient (cpdm) mouse
  species: Mouse
  genotype: Sharpin cpdm/cpdm (spontaneous loss-of-function)
  publication: PMID:34887354
  description: >-
    The chronic proliferative dermatitis (cpdm) mouse carries a spontaneous Sharpin
    loss-of-function mutation and develops TNF-dependent multi-organ inflammation and
    immunodeficiency through excess RIPK1-dependent cell death. It is the long-studied model
    of SHARPIN loss, but it diverges from the human disease in a clinically important way.
  modeled_mechanisms:
  - target: Sensitization to TNF-Induced Cell Death
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      cpdm cells are hypersensitive to TNF-induced death and the mouse's inflammation is
      TNF-driven, recapitulating the central mechanism of the human disease.
    limitations: >-
      The cpdm mouse develops severe chronic proliferative dermatitis, whereas the human
      SHARPIN-deficient patients had no dermatological disease at all, so the skin phenotype
      does not translate and the model over-represents the cutaneous arm.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The defining mouse phenotype (chronic proliferative dermatitis, driven by
        keratinocyte death) is absent in the human disease, so the model adds a skin
        phenotype the human patients do not have; mouse and human also differ in the
        dominant death mode (the human disease is apoptosis-predominant with limited
        necroptosis).
    readouts:
    - name: TNF-induced cell death sensitivity in MEFs
      target: Sensitization to TNF-Induced Cell Death
      direction: INCREASED
      interpretation: Hypersensitivity to TNF killing is the measured correlate of lost LUBAC survival signalling.
      evidence:
      - reference: PMID:34887354
        reference_title: "Immune dysregulation in SHARPIN-deficient mice is dependent on CYLD-mediated cell death."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Comparison of the Sharpincpdm/cpdm MEF complemented with Sharpin versus the control gene showed SHARPIN-deficient cells to be more sensitive to TNF-induced necroptosis in a dose- and time-dependent manner"
        explanation: Measures heightened TNF-induced death in Sharpin-deficient cells.
  evidence:
  - reference: PMID:34887354
    reference_title: "Immune dysregulation in SHARPIN-deficient mice is dependent on CYLD-mediated cell death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, a loss-of-function mutation in Sharpin has been found in the chronic proliferative dermatitis (cpdm) mice, which spontaneously develops dermatitis, multiorgan inflammation, and displays immunodeficiency"
    explanation: Establishes the cpdm mouse as the Sharpin-deficiency model, with the multi-organ inflammation and immunodeficiency it shares with the human disease.
treatments:
- name: Anti-TNF Therapy
  description: >-
    Because the mechanism converges on TNF-driven inflammation and cell death, TNF inhibition
    is directly disease-modifying. In P1, etanercept improved the arthritis but colitis
    persisted; after a switch to adalimumab the colitis markedly diminished and inflammatory
    biomarkers normalized, giving complete clinical and transcriptomic resolution. In P2,
    etanercept reduced fever episodes.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_mechanisms:
  - target: Sensitization to TNF-Induced Cell Death
  evidence:
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of one SHARPIN-deficient individual with anti-TNF therapies led to complete clinical and transcriptomic resolution of autoinflammation."
    explanation: Documents the clinical and transcriptomic response to anti-TNF therapy.
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After the switch to adalimumab his colitis also markedly diminished, and the inflammatory biomarkers were also completely normalized"
    explanation: Attributes the colitis resolution and biomarker normalization specifically to adalimumab after etanercept.
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was started on the TNF inhibitor etanercept which reduced fever episodes."
    explanation: Documents etanercept reducing fever episodes in patient P2.
discussions:
- discussion_id: sharpin_mouse_human_skin_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the Sharpin-deficient cpdm mouse develop severe chronic proliferative
    dermatitis while human SHARPIN-deficient patients have no dermatological disease?
  attaches_to:
  - animal_models#Sharpin-deficient (cpdm) mouse
  - pathophysiology#Sensitization to TNF-Induced Cell Death
  rationale: >-
    The cpdm mouse is defined by its skin phenotype, driven by TNF-dependent keratinocyte
    death, and decades of LUBAC cell-death biology rest on it. The two reported human
    SHARPIN-deficient patients, by contrast, had autoinflammation and immunodeficiency with
    no skin involvement, and the patient skin biopsy showed no inflammation. The TNF-driven
    cell-death mechanism appears conserved, so the mismatch is in which tissues manifest it,
    which bears on how far the mouse skin literature can be read onto the human disease.
  evidence:
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In mice, the loss of Sharpin leads to severe dermatitis due to excessive keratinocyte cell death. Here, we report two individuals with SHARPIN deficiency who manifest autoinflammatory symptoms but unexpectedly no dermatological problems."
    explanation: States the mouse-human mismatch directly, which this discussion records.

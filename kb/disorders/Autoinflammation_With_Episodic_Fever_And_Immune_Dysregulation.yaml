  evidence:
  - reference: PMID:38609546
    reference_title: "Biallelic human SHARPIN loss of function induces autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts and B cells from these individuals showed attenuated canonical NF-κB responses and a propensity for cell death mediated by TNF superfamily members."
    explanation: Reports the attenuated canonical NF-kappaB response in patient cells.
- name: Sensitization to TNF-Induced Cell Death
  biological_scale: CELLULAR
  description: >-
    LUBAC normally restrains assembly of the death-inducing complex downstream of the TNF
    receptor and promotes NF-kappaB pro-survival signalling. With LUBAC impaired, cells
    become hypersensitive to TNF-induced death, predominantly apoptosis, with only a limited
    necroptotic contribution in the human disease. The resulting cell death drives tissue
    inflammation.
  biological_processes:
  - preferred_term: tumor necrosis factor-mediated signaling pathway
    term:
      id: GO:0033209
      label: tumor necrosis factor-mediated signaling pathway
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: pyroptotic cell death
    term:
      id: GO:0141201
      label: pyroptotic cell death
    modifier: INCREASED

differential_diagnoses:
- name: Pelger-Huet anomaly
  description: >-
    Autosomal dominant or recessive laminopathy caused by pathogenic variants
    in LBR (which TMEM147 anchors at the inner nuclear membrane). Classic
    heterozygous Pelger-Huët anomaly is a benign hematological trait in which
    the vast majority of mature granulocytes have bilobed or hypolobulated
    nuclei without intellectual disability, whereas TMEM147 deficiency causes
    pseudo-Pelger-Huët anomaly affecting only ~15%–25% of neutrophils alongside
    severe syndromic neurodevelopmental impairment.
  disease_term:
    preferred_term: Pelger-Huet anomaly
    term:
      id: MONDO:0008214
      label: Pelger-Huet anomaly
  distinguishing_features:
  - Classic Pelger-Huët anomaly involves the majority of mature granulocytes and is caused by LBR variants, whereas TMEM147 deficiency affects 15%–25% of neutrophils (pseudo-Pelger-Huët anomaly) and consistently presents with severe to profound intellectual disability and coarse facial dysmorphism.
  evidence:
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Formally, these hematological features could not be classified as a typical Pelger-Huët anomaly, but rather pseudo-Pelger-Huët anomaly because the majority of mature granulocytes were not bilobed, although they clearly belonged to the same phenotypic spectrum."
    explanation: Distinguishes the pseudo-Pelger-Huët anomaly of TMEM147 deficiency from classic LBR-related Pelger-Huët anomaly.
- name: Cornelia de Lange syndrome
  description: >-
    Chromatinopathy clinically suspected in affected individuals due to
    overlapping coarse facial dysmorphism, intrauterine growth restriction, and
    severe developmental delay; excluded by absence of pathogenic cohesin
    complex variants and by a negative genome-wide DNA methylation
    episignature (EpiSign MVP <= 0.02).
  disease_term:
    preferred_term: Cornelia de Lange syndrome
    term:
      id: MONDO:0016033
      label: Cornelia de Lange syndrome
  distinguishing_features:
  - Negative chromatinopathy DNA methylation episignature on EpiSign testing (MVP <= 0.02), presence of pseudo-Pelger-Huët anomaly on blood smear, and biallelic TMEM147 variants.
  evidence:
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, Episign analysis revealed a genome-wide DNA methylation profile incompatible with all 59 episignatures assessed, including chomatinopathy conditions such as Cornelia de Lange, Rubinstein-Taybi, Coffin-Siris, and Wiedemann-Steiner syndromes."

  evidence:
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Regarding the splice-site variants c.344+5G>A and c.345−1G>T, in silico analysis predicted them to suppress the activity of the donor splice-site of exon 4 (137 nt) and the acceptor splice-site of exon 5 (85 nt), respectively (Figures S2A–S2D). Both were predicted to alter the reading frame of the transcript (Figures S2A and S2C),38 eventually resulting in nonsense-mediated mRNA decay. A minigene approach was established in order to measure the functional readout of the c.344+5G>A variant, confirming exon 4 skipping (Figure S2E)."
    explanation: Demonstrates that splice-site variants in TMEM147 cause exon skipping and reading-frame disruption leading to nonsense-mediated mRNA decay.
  downstream:
  - target: Endoplasmic Reticulum Translocon Accessory Complex Disruption
    description: Loss of TMEM147 depletes the nicalin-TMEM147-NOMO accessory module within the ribosome-associated ER translocon complex.
  - target: Lamin B Receptor Mislocalization at the Inner Nuclear Membrane
    description: Loss of TMEM147 at the nuclear envelope abolishes C-terminal anchoring of LBR at the inner nuclear membrane.
- name: Autophagy-Lysosomal Degradation of Destabilized TMEM147 Missense Variants
  description: >-
    Pathogenic missense variants in TMEM147 (p.Gly7Arg in transmembrane domain
    1, p.Ile133Asn at the alpha-helix 5 loop facing nicalin, and p.Arg166Trp at
    alpha-helix 6) properly target to the endoplasmic reticulum but introduce
    steric clashes with TMCO1, nicalin, or adjacent TMEM147 helices. As shown
    in transfected COS-1 cells, these substitutions severely reduce TMEM147
    protein stability and trigger accelerated protein clearance through the
    autophagy-lysosomal pathway, which is rescued by bafilomycin treatment.
  genes:
  - preferred_term: TMEM147

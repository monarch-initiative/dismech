  description: >-
    Caused by homozygous or compound heterozygous loss-of-function variants in
    TMEM147; heterozygous carrier parents are clinically unaffected, and most
    reported probands originate from consanguineous unions.
  evidence:
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through international data sharing, we identified 23 individuals from 15 unrelated families with bi-allelic TMEM147 loss-of-function variants, including splice-site, nonsense, frameshift, and missense variants."
    explanation: Establishes autosomal recessive inheritance due to biallelic TMEM147 variants across 15 unrelated families.
  - reference: PMID:36044892

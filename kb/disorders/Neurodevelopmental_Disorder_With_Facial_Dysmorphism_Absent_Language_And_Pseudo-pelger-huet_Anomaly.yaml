  notes: >-
    Ultra-rare disorder with 25 genetically confirmed individuals across 16
    unrelated families reported in the literature: 23 affected individuals from
    15 unrelated families were described in the 2022 founding international
    cohort, and 2 additional affected siblings from a consanguineous family
    were reported in 2023. No population-based prevalence or incidence rate has
    been established.

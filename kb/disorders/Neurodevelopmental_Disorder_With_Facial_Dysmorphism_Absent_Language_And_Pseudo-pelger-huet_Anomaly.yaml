- name: Granulocyte Nuclear Lobulation Defect (Pseudo-Pelger-Huët Anomaly)
  description: >-
    Because LBR anchoring at the inner nuclear membrane is required for normal
    nuclear lobulation and heterochromatin condensation during granulocyte
    maturation, biallelic TMEM147 loss of function produces lobulation defects
    in approximately 15%–25% of peripheral blood polymorphonuclear neutrophils
    (and sparse eosinophils). Affected neutrophils exhibit hyposegmented or
    bilobed sack-like nuclei connected by a thin chromatin thread, chromatin
    clumping, and nuclear appendices (caryoschizes or drumsticks). Because the
    majority of mature granulocytes are not bilobed, this hematological finding
    is classified as pseudo-Pelger-Huët anomaly rather than classic
    Pelger-Huët anomaly.

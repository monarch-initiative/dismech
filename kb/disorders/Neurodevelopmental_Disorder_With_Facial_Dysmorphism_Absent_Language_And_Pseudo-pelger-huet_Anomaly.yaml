    snippet: "Cytological examination of the blood smear frequently revealed lobulation defects of the neutrophils (Figures 5D and S3A), with forms of hyposegmentation similar to the Pelger-Huët anomaly, although with a lower proportion, bilobed aspects in the shape of a sack with two round or oval lobes connected by a thread of chromatin, rare chromatin clumping, and frequent nuclear appendices (caryoschizes or drumsticks), isolated or associated with the preceding abnormalities. These cytological abnormalities concerned about 15%–25% of neutrophils and were also identified in sparse eosinophils, indicating that the anomaly affects all granulocytes but is most evident in polymorphonuclear neutrophils (Figure S3B)."
    explanation: Characterizes the neutrophil and eosinophil nuclear hyposegmentation, chromatin clumping, and caryoschizes/drumsticks in ~15%–25% of neutrophils as pseudo-Pelger-Huët anomaly.
  downstream:
  - target: Hyposegmentation of neutrophil nuclei
    description: Impaired granulocyte nuclear lobulation manifests clinically on peripheral blood smear as hyposegmentation of neutrophil nuclei (pseudo-Pelger-Huët anomaly).
- name: Impaired Brain Development and Encephalopathy
  description: >-
    TMEM147 is widely expressed in the developing human brain and shows strong
    brain-specific co-expression with established neurodevelopmental and
    encephalopathy genes (including CDKL5, CLTC, KMT2E, NRXN1, SCN1A, SCN2A,
    TCF4, UNC80, and WDR45). Combined ER translocon impairment, RTN4/CKAP4
    dysregulation, potential perturbation of nicalin-NOMO-modulated Nodal
    neuroectodermal patterning, and nuclear envelope dysfunction disrupt
    central nervous system development, manifesting as a primary developmental
    encephalopathy with thin corpus callosum, ventriculomegaly, delayed
    posterior white matter myelination, and mild cerebellar atrophy.

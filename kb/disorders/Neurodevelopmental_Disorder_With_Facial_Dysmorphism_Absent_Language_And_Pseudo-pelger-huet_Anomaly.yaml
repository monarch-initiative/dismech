progression:
- phase: Onset
  age_range: Neonatal to infantile (congenital facial dysmorphism and developmental delay evident in infancy)
  notes: >-
    Some affected individuals exhibit prenatal or neonatal manifestations
    (intrauterine growth restriction, neonatal feeding/respiratory distress, or
    congenital facial dysmorphism), while global developmental and motor delays
    become universally apparent during infancy. Walking is typically acquired
    between 1.5 and 5 years of age with unsteady gait, whereas language
    remains absent or severely restricted into childhood and adolescence.
  evidence:
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gross and fine motor skills were impaired for all individuals, although less severe than language delay, as most children were ambulatory by 5 years of age."
    explanation: Documents early developmental motor impairment with delayed ambulation by age 5 years and persistent severe language impairment.
pathophysiology:
- name: TMEM147 Loss of Function
  description: >-
    Biallelic truncating nonsense, frameshift, and canonical or near-canonical
    splice-site variants in TMEM147 (such as c.344+5G>A, which causes exon 4
    skipping, and c.345-1G>T) alter the reading frame and trigger
    nonsense-mediated mRNA decay (except for late C-terminal frameshifts such
    as p.Val182Leufs*66 that replace the 6th and 7th transmembrane helices).
    Together with destabilizing missense variants that undergo accelerated
    degradation, these alleles abolish functional TMEM147 protein interactions
    at both the endoplasmic reticulum membrane and the inner nuclear membrane.

- name: CKAP4 and RTN4 Upregulation with Endoplasmic Reticulum Rearrangement
  description: >-
    In cultured primary fibroblasts from individuals lacking functional
    TMEM147, the ER-shaping proteins CKAP4 (CLIMP-63, which links sheet ER
    membranes to microtubules) and RTN4 (NOGO, which regulates tubular ER
    architecture and restricts ER luminal transport, calcium release, and
    cortical neuron axonal extension) are significantly upregulated, resulting
    in a parallel morphological rearrangement and reorientation of the
    endoplasmic reticulum.

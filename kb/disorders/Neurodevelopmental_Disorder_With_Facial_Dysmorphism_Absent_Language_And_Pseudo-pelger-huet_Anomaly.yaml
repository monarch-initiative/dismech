discussions:
- discussion_id: lbr_protein_stability_fibroblast_vs_hela_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does TMEM147 loss cause diffuse intranuclear LBR mislocalization
    without decreased LBR protein levels in patient-derived primary
    fibroblasts, whereas acute TMEM147 RNAi knockdown in HeLa cells causes a
    sharp decline in LBR protein levels and ER mistargeting?
  attaches_to:
  - pathophysiology#Lamin B Receptor Mislocalization at the Inner Nuclear Membrane
  rationale: >-
    In HeLa cells, Christodoulou et al. (2020) reported that RNAi-mediated
    silencing of TMEM147 drastically reduced LBR protein levels at the inner
    nuclear membrane, decreased LBR and DHCR7 transcription, and caused
    mistargeting of LBR to the endoplasmic reticulum. By contrast, when Thomas
    et al. (2022) examined primary dermal fibroblasts from affected individuals
    harboring biallelic truncating (p.Tyr162* / p.Lys34Serfs*33) or homozygous
    missense (p.Arg166Trp) variants in TMEM147, LBR was redistributed evenly
    throughout the nucleoplasm rather than remaining anchored at the nuclear
    envelope, and this altered diffusional mobility was not accompanied by
    decreased total LBR protein levels. Furthermore, despite the
    chromatinopathy-like craniofacial appearance and LBR-mediated
    heterochromatin tethering role, peripheral blood DNA from affected
    individuals did not display a chromatinopathy episignature on EpiSign
    methylation profiling. Whether neurodevelopmental impairment in humans is
    driven primarily by defective ER multi-pass translocon biogenesis (via the
    Sec61-TMCO1-CCDC47-nicalin-TMEM147-NOMO complex and RTN4/CKAP4
    upregulation), by nuclear envelope instability, or by impaired
    nicalin-NOMO modulation of Nodal signaling during early neural patterning
    remains an open mechanistic question.
  evidence:
  - reference: PMID:32694168
    reference_title: "TMEM147 interacts with lamin B receptor, regulates its localization and levels, and affects cholesterol homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Silencing of TMEM147 drastically reduces the level of lamin B receptor (LBR) at the inner nuclear membrane and results in mistargeting of LBR to the ER."
    explanation: Documents decreased LBR levels and ER mistargeting upon acute TMEM147 silencing in HeLa cells.
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, our experiments demonstrate that the diffusional mobility of LBR is not accompanied by decreased protein levels in primary fibroblast cells from affected individuals."
    explanation: Documents that cultured patient-derived primary fibroblasts exhibit intranuclear LBR mislocalization without decreased total LBR protein levels.
notes: >-
  Disease nomenclature corresponds to OMIM #620075 (Neurodevelopmental disorder
  with facial dysmorphism, absent language, and pseudo-Pelger-Huët anomaly;
  NEDFLPA) and MONDO:0859298. Two fellow subunits of the ER multi-pass
  translocon accessory complex cause clinically overlapping autosomal recessive
  syndromic intellectual disability disorders with facial dysmorphism: TMCO1
  (cerebrofaciothoracic dysplasia, MIM 213980) and CCDC47
  (trichohepatoneurodevelopmental syndrome, MIM 618268). No disease-specific
  clinical management guidelines exist in the literature; treatment is
  supportive and multidisciplinary.

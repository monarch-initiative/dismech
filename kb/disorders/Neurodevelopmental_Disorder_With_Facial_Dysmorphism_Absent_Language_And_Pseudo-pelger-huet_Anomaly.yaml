name: neurodevelopmental disorder with facial dysmorphism, absent language, and pseudo-pelger-huet anomaly
creation_date: '2026-10-14T00:00:00Z'
description: >-
  Neurodevelopmental disorder with facial dysmorphism, absent language, and
  pseudo-Pelger-Huët anomaly (NEDFLPA, OMIM 620075) is a rare autosomal
  recessive syndromic neurodevelopmental disorder caused by biallelic
  loss-of-function variants in TMEM147 on chromosome 19q13.12. TMEM147 encodes
  a seven-transmembrane protein with a dual subcellular role: at the
  endoplasmic reticulum (ER) membrane it forms part of the nicalin-TMEM147-NOMO
  module within the ribosome-associated Sec61-TMCO1-CCDC47 translocon complex
  that mediates biogenesis of multi-pass membrane proteins, and at the nuclear
  envelope it binds the C-terminal domain of lamin B receptor (LBR) to anchor
  it at the inner nuclear membrane. Loss of TMEM147 function—via nonsense,
  frameshift, or splice-site variants undergoing nonsense-mediated decay or
  destabilizing missense variants degraded through the autophagy-lysosomal
  pathway—leads to upregulation of the ER-shaping proteins CKAP4 (CLIMP-63)
  and RTN4 (NOGO) with concomitant ER rearrangement, as well as diffuse
  intranuclear mislocalization of LBR, nuclear segmentation defects, and
  hypolobulated neutrophil nuclei with chromatin clumping (pseudo-Pelger-Huët
  anomaly in ~15%–25% of granulocytes). Clinically, affected individuals
  present in infancy with universal global developmental and motor delay,
  moderate to profound intellectual disability, absent or severely limited
  speech, behavioral abnormalities (particularly self-injurious behavior,
  hyperactivity, aggression, and anger outbursts), and recognizable coarse
  facial dysmorphism (prominent forehead, depressed nasal bridge, long smooth
  philtrum, tented upper lip vermilion, and low-set ears) alongside frequent
  brain MRI abnormalities (thin corpus callosum, ventriculomegaly, and delayed
  myelination) and variable hypotonia, spasticity, seizures, growth
  retardation, and congenital septal heart defects.

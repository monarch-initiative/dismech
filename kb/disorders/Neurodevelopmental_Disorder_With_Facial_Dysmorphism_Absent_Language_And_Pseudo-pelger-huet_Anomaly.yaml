      label: endoplasmic reticulum membrane
  evidence:
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment with bafilomycin, a late-stage inhibitor of autophagy and lysosomal protein degradation, rescued the reduced levels of all mutants (Figure 4A), indicating that accelerated degradation of TMEM147 mutant proteins occurs via the autophagy-lysosomal pathway."
    explanation: Demonstrates in COS-1 cells that pathogenic TMEM147 missense proteins are rapidly degraded via the autophagy-lysosomal pathway.
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Considering the p.Gly7Arg substitution, the arginine extension was predicted to push into the TMCO1-facing amino terminal region, creating a steric conflict with the Phe96 (Figure 3, insert 2, asterisks). Similarly, p.Ile133Asn generated tensions with the adjacent amino acids in TMEM147 (data not shown) and its extension towards nicalin, would cause potential clashes with three amino acids in nicalin: Phe524, Leu527, and Leu528 (Figure 3, insert 1, asterisks)."
    explanation: Structural modeling on the cryo-EM ER translocon structure shows how missense substitutions create steric clashes with TMCO1 and nicalin.
  downstream:
  - target: TMEM147 Loss of Function
    description: Accelerated autophagy-lysosomal clearance of destabilized missense TMEM147 proteins results in functional loss of TMEM147 equivalent to truncating alleles.
- name: Endoplasmic Reticulum Translocon Accessory Complex Disruption
  description: >-
    At the endoplasmic reticulum membrane, TMEM147 is the core
    seven-transmembrane subunit of the nicalin-TMEM147-NOMO accessory complex,
    which assembles with the Sec61 protein-conducting channel, the Oxa1-family
    membrane insertase TMCO1, and CCDC47 at the ribosome exit tunnel to form a
    ~360 kDa translocon required for co-translational biogenesis of multi-pass
    membrane proteins. Depletion or steric destabilization of TMEM147 is
    predicted to perturb assembly and function of this multi-pass ER translocon
    accessory module.

- name: Lamin B Receptor Mislocalization at the Inner Nuclear Membrane
  description: >-
    At the nuclear envelope, TMEM147 physically interacts with the C-terminal
    domain of lamin B receptor (LBR) to anchor LBR at the inner nuclear
    membrane. As demonstrated in cultured primary fibroblasts from individuals
    with biallelic TMEM147 variants, loss of TMEM147 abolishes this nuclear
    envelope restriction and causes LBR to become evenly redistributed
    throughout the nucleoplasm without a reduction in total LBR protein levels.

treatments:
- name: Supportive Care
  description: >-
    No disease-modifying therapy currently exists for TMEM147 deficiency.
    Management is multidisciplinary and supportive, encompassing developmental
    rehabilitation (speech and language therapy including augmentative and
    alternative communication for absent speech, physical and occupational
    therapy for motor delay and spasticity), behavioral interventions for
    self-injurious and aggressive behaviors, echocardiographic screening for
    congenital septal defects, and genetic counseling for autosomal recessive
    recurrence risk (25% per pregnancy in carrier couples).
  notes: >-
    No disease-specific management guidelines have been published in the
    literature; supportive care follows standard practice for syndromic
    neurodevelopmental disorders.

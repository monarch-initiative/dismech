genetic:
- name: TMEM147
  association: Causal Biallelic Loss-of-Function Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TMEM147
    term:
      id: hgnc:30414
      label: TMEM147
  features: >-
    Thirteen distinct pathogenic variants have been reported across 16
    families, including nonsense (3), frameshift (5, including
    c.100_118del/p.Lys34Serfs*33, c.540_543dup/p.Val182Leufs*66, and
    NM_001242597.2:c.193_197del), splice-site (2: c.344+5G>A causing exon 4
    skipping and c.345-1G>T), and destabilizing missense variants (3:
    c.19G>C/p.Gly7Arg recurrent in 2 families, c.398T>A/p.Ile133Asn recurrent
    in 5 North African/Egyptian families, and c.496C>T/p.Arg166Trp). No
    genotype-phenotype differences were observed between truncating and
    missense alleles because missense proteins undergo rapid
    autophagy-lysosomal degradation.
  evidence:
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twelve different variants were identified and included stop-gain (3/12), frameshift (4/12), missense (3/12), and splice-site variants (2/12) (Table S1, Figure 1)."
    explanation: Details the mutational spectrum of stop-gain, frameshift, missense, and splice-site variants in TMEM147.
  - reference: PMID:36044892
    reference_title: "Bi-allelic loss-of-function variants in TMEM147 cause moderate to profound intellectual disability with facial dysmorphism and pseudo-Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No phenotypic differences between affected individuals with predicted loss-of-function versus missense variants were noted."
    explanation: Confirms lack of genotype-phenotype divergence between truncating and missense variants.

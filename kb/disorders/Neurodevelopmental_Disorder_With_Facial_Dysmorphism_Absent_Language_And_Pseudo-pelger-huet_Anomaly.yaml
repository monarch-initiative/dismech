    snippet: "ER markers CKAP4 (CLIMP-63) and RTN4 were significantly upregulated in TMEM147 individuals as compared to healthy volunteers (Figures 4C–4E). This upregulation was accompanied by a concomitant parallel rearrangement of ER, indicating that in absence of TMEM147, morphological and physiological changes take place (Figure 4D and 4E)."

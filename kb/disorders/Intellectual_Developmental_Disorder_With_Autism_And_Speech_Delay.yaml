- name: Dysregulated TBR1 Target Gene Network
  description: >-
    TBR1 binds near and regulates many genes implicated in autism, including
    Auts2, Wnt7b, the NMDA receptor subunit gene GRIN2B (with its partner
    CASK) and axon-guidance and adhesion genes such as Ntng1, Cntn2 and Cdh8.
    Reduced TBR1 dosage misexpresses these targets in deep cortical layers and
    amygdala.

name: TBR1-Related Neurodevelopmental Disorder
creation_date: "2026-10-31T00:00:00Z"
description: >-
  TBR1-related neurodevelopmental disorder (intellectual developmental disorder
  with autism and speech delay, IDDAUS; OMIM 606053) is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous, usually de novo,
  loss-of-function variants or deletions of TBR1, which encodes T-box brain
  transcription factor 1. TBR1 is expressed in postmitotic glutamatergic
  neurons of the cerebral cortex, especially early-born deep-layer (layer 6)
  corticothalamic neurons, and in the amygdala, where it specifies neuronal
  identity and regulates a network of autism-associated target genes and
  axonal connectivity. Affected individuals have intellectual disability of
  variable severity, autistic traits or autism spectrum disorder, and delayed
  speech and language development, usually with motor delay; EEG anomalies,
  seizures and hypotonia occur in a minority. No recognizable facial gestalt
  has been identified. Brain MRI frequently shows a thin or absent anterior
  commissure, and some individuals have dysplastic hippocampi, subtle
  neocortical dysgenesis or frontal pachygyria. Management is supportive.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Autism Spectrum Disorder
- Intellectual Disability

  description: >-
    Heterozygous disruption of one TBR1 allele is sufficient to cause the
    disorder. Most reported variants arose de novo in the proband.
  evidence:
  - reference: CGGV:assertion_853c90ef-34a8-4d7d-931d-5fb4add3e4d0-2020-03-25T160000.000Z
    reference_title: TBR1 / complex neurodevelopmental disorder (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, TBR1 is definitively associated with autosomal dominant complex neurodevelopmental disorder."
    explanation: >-
      ClinGen classifies TBR1 as definitively associated with an autosomal
      dominant neurodevelopmental disorder; ClinGen lumps IDDAUS into its
      broader complex neurodevelopmental disorder entity.
  - reference: PMID:25232744
    reference_title: De novo TBR1 mutations in sporadic autism disrupt protein functions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "have been observed to harbour de novo mutations in multiple unrelated probands, strongly suggesting that heterozygous disruption of any one of these genes is sufficient to cause ASD"
    explanation: >-
      Recurrent de novo heterozygous TBR1 mutations in unrelated probands
      support dominant, typically de novo, inheritance.
pathophysiology:
- name: TBR1 Heterozygous Loss of Function
  description: >-
    Truncating variants, T-box missense variants and whole-gene deletions
    reduce the amount of functional TBR1, a neuron-specific T-box
    transcription factor. Pathogenic variants disrupt nuclear localization,
    homodimerization and interactions with co-regulators, and abolish
    transcriptional repression; missense variants inherited from unaffected
    parents do not. The disease mechanism is loss of function.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "projection_neuron_subtype_specification#Projection Neuron Subtype Identity Program Disruption"
  genes:
  - preferred_term: TBR1
    term:
      id: hgnc:11590
      label: TBR1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
  evidence:
  - reference: PMID:25232744
    reference_title: De novo TBR1 mutations in sporadic autism disrupt protein functions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "De novo truncating and missense mutations disrupt multiple aspects of TBR1 function, including subcellular localization, interactions with co-regulators and transcriptional repression."
    explanation: >-
      Functional assays of patient de novo variants show loss of the
      transcription-factor functions of TBR1.
  - reference: PMID:25232744
    reference_title: De novo TBR1 mutations in sporadic autism disrupt protein functions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Missense mutations inherited from unaffected parents did not disturb function in our assays."
    explanation: >-
      Inherited variants from unaffected parents retain function, separating
      pathogenic de novo variants from tolerated ones.
  - reference: CGGV:assertion_853c90ef-34a8-4d7d-931d-5fb4add3e4d0-2020-03-25T160000.000Z
    reference_title: TBR1 / complex neurodevelopmental disorder (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be LOF."
    explanation: ClinGen's expert panel records loss of function as the disease mechanism.
  - reference: PMID:24458984
    reference_title: TBR1 is the candidate gene for intellectual disability in patients with a 2q24.2 interstitial deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single nucleotide polymorphisms (SNP) array analysis showed a de novo interstitial deletion of 0.122 Mb at 2q24.2 region harboring only TBR1"
    explanation: >-
      A de novo deletion removing only TBR1 in a patient with intellectual
      disability supports haploinsufficiency as sufficient for disease.
  - reference: PMID:30250039
    reference_title: Functional characterization of TBR1 variants in neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Only two of the three tested variants severely disrupted TBR1 protein function, despite in silico predictions that all would be deleterious."
    explanation: >-
      Functional testing of further de novo T-box missense variants found
      that most, but not all, disrupt TBR1 function, so missense variants
      need functional or segregation evidence.
  downstream:
  - target: Dysregulated TBR1 Target Gene Network
    causal_link_type: DIRECT
    description: Loss of TBR1 transcription-factor activity changes the expression of its direct target genes.
    evidence:

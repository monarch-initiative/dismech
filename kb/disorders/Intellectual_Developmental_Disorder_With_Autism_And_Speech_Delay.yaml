genetic:
- name: TBR1
  association: Causal heterozygous loss-of-function variant or deletion
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: TBR1
    term:
      id: hgnc:11590
      label: TBR1
  notes: >-
    Reported variants include frameshift, nonsense, T-box missense and
    in-frame changes, and whole-gene deletions; no significant difference in
    type or severity of findings by variant location along the gene has been
    found. ClinGen classifies TBR1 as Definitive for complex
    neurodevelopmental disorder (MONDO:0100038), a broader entity into which
    its expert panel lumped this disorder, so that classification is not
    recorded here as a gene-disease validity assertion for MONDO:0011627.
  evidence:
  - reference: CGGV:assertion_853c90ef-34a8-4d7d-931d-5fb4add3e4d0-2020-03-25T160000.000Z
    reference_title: TBR1 / complex neurodevelopmental disorder (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TBR1 has also been associated with intellectual developmental disorder with autism and speech delay (OMIM #606053)"
    explanation: ClinGen's summary links TBR1 to this OMIM disorder.
  - reference: PMID:28057268
    reference_title: Control of Neuronal Development by T-Box Genes in the Brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In humans, de novo mutations in TBR1 are important causes of sporadic autism and intellectual disability."
    explanation: Review statement that de novo TBR1 mutations cause autism and intellectual disability.
  - reference: PMID:25232744
    reference_title: De novo TBR1 mutations in sporadic autism disrupt protein functions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "De novo truncating and missense mutations disrupt multiple aspects of TBR1 function, including subcellular localization, interactions with co-regulators and transcriptional repression."
    explanation: Functional evidence that patient de novo variants are damaging.
  - reference: PMID:40004448
    reference_title: "Novel TBR1 c.1303C>T Variant Led to Diagnosis of Intellectual Developmental Disorder with Autism and Speech Delay: Application of Comprehensive Family-Based Whole-Genome Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant differences were observed in the type or severity of the clinical findings based on the variant’s location along the gene"
    explanation: Supports the note that variant position does not predict severity.
  variants:
  - name: A136PfsX80
    description: >-
      De novo frameshift found in sporadic autism; yields a truncated product
      lacking the T-box that mislocalizes to the cytoplasm. Modeled as a
      patient-specific mouse allele that reduces TBR1 protein like a null.
    evidence:
    - reference: PMID:25232744
      reference_title: De novo TBR1 mutations in sporadic autism disrupt protein functions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The A136PfsX80 variant exhibited a diffuse distribution in the cytoplasm and occasionally also in the nucleus."
      explanation: Shows mislocalization of the truncated A136PfsX80 protein.
  - name: K228E
    variant_type: single nucleotide variant
    description: >-
      De novo T-box missense variant found in sporadic autism; the protein
      enters the nucleus but partly aggregates. A patient-specific mouse allele
      raises TBR1 protein levels and produces layering defects distinct from
      the null.
    evidence:
    - reference: PMID:25232744
      reference_title: De novo TBR1 mutations in sporadic autism disrupt protein functions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The K228E and N374H variants retained import into the nucleus but a fraction formed abnormal aggregates."
      explanation: Characterizes the cellular behavior of the K228E protein.
    - reference: PMID:35944998
      reference_title: Shared and Distinct Functional Effects of Patient-Specific Tbr1 Mutations on Cortical Development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The frameshift patient mutation A136PfsX80 (A136fs) caused reduced TBR1 protein in cortex similar to Tbr1 KO, while the missense patient mutation K228E caused significant TBR1 upregulation."
      explanation: Knock-in mice show divergent effects of the frameshift and missense alleles on TBR1 protein.
  - name: c.1588_1594dup p.(Thr532Argfs*144)
    variant_type: duplication
    description: >-
      Recurrent de novo frameshift reported in two unrelated individuals with

    reference_title: TBR1 regulates autism risk genes in the developing neocortex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Of the nine ASD genes examined, seven were misexpressed in the cortices of Tbr1 knockout mice, including six with increased expression in the deep cortical layers."
    explanation: Autism-associated TBR1 targets are misexpressed in the deep layers of Tbr1 knockout cortex.
  - reference: PMID:20615956
    reference_title: Tbr1 regulates regional and laminar identity of postmitotic neurons in developing neocortex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tbr1 implements frontal identity in part by direct promoter binding and activation of Auts2, a frontal cortex gene implicated in autism."
    explanation: Identifies AUTS2 as a direct TBR1 target gene.
  - reference: PMID:20067577
    reference_title: CASK phosphorylation by PKA regulates the protein-protein interactions of CASK and expression of the NMDAR2b gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Deletion of the Tbr-1-binding sites greatly reduces the 3'-5'-cyclic AMP responsiveness of the NMDAR2b promoter"
    explanation: In cultured cortical neurons, regulated NMDAR2b (GRIN2B) promoter activity depends on its TBR1-binding sites.
  downstream:
  - target: Amygdalar Glutamatergic Synaptic Hypofunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced TBR1 drive on GRIN2B is one proposed route to NMDA receptor hypofunction.
    evidence:
    - reference: PMID:20067577
      reference_title: CASK phosphorylation by PKA regulates the protein-protein interactions of CASK and expression of the NMDAR2b gene.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "NMDAR2b, a downstream target of the CASK-Tbr-1 complex, was then used to explore the significance of CASK phosphorylation by PKA."
      explanation: Places GRIN2B downstream of the CASK-TBR1 complex; the step to amygdalar hypofunction in patients is an inference.
  - target: Impaired Dendritic Spine Maturation and Synaptogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30318412
      reference_title: Neonatal Tbr1 Dosage Controls Cortical Layer 6 Connectivity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Restoring expression of Wnt7b largely rescues the synaptic deficit in Tbr1layer6 mutant neurons."
      explanation: Rescue by a TBR1 target gene shows that target misexpression drives the synaptic deficit.
  - target: Reduced Amygdalar Axonal Connectivity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24441682
      reference_title: Tbr1 haploinsufficiency impairs amygdalar axonal projections and results in cognitive abnormality.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of a copy of the Tbr1 gene altered the expression of Ntng1, Cntn2 and Cdh8 and reduced both inter- and intra-amygdalar connections."
      explanation: In heterozygous mice, misexpression of axon-guidance and adhesion targets accompanies loss of amygdalar connections.
- name: Altered Layer 6 Corticothalamic Neuron Identity
  description: >-
    TBR1 holds early-born layer 6 neurons in a corticothalamic identity by
    repressing Fezf2 and CTIP2. Without it, layer 6 markers are reduced, layer
    5 subcerebral markers expand, and early-born neurons send axons to
    subcerebral targets. Neonatal TBR1 dosage in layer 6 is also required for
    dendritic patterning and synaptogenesis.
  biological_scale: CELLULAR
  conforms_to: "projection_neuron_subtype_specification#Altered Laminar and Projection-Subtype Identity"

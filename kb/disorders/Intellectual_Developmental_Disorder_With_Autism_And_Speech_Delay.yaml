    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Tbr1(-/-) mice, the number of cells expressing layer 6 markers was reduced, and the number of cells expressing layer 5 markers was increased."
    explanation: Shows loss of layer 6 identity and expansion of layer 5 identity in Tbr1 null cortex.
  - reference: PMID:20615956
    reference_title: Tbr1 regulates regional and laminar identity of postmitotic neurons in developing neocortex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tbr1 null mice exhibited profound defects of frontal cortex and layer 6 differentiation"
    explanation: Independent evidence that TBR1 is required for layer 6 differentiation.
  downstream:
  - target: Impaired Dendritic Spine Maturation and Synaptogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30318412
      reference_title: Neonatal Tbr1 Dosage Controls Cortical Layer 6 Connectivity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Conditional Tbr1 deletion during late mouse gestation in cortical layer 6 neurons (Tbr1layer6 mutants) provides novel insights into its function, including dendritic patterning, synaptogenesis, and cell-intrinsic physiology."
      explanation: Layer 6-restricted Tbr1 deletion produces dendritic and synaptic defects in those neurons.
- name: Defective Differentiation of Early-Born Cortical Neurons
  description: >-
    In Tbr1-deficient mice, early-born preplate and layer 6 neurons are
    abnormal: Cajal-Retzius cells make less Reelin, producing a reeler-like
    neuronal migration disorder, subplate differentiation is impaired, and
    thalamocortical, corticothalamic and callosal projections are misrouted.
    This is the proposed basis for the cortical malformations seen in some
    patients, although that link has not been tested directly.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Cajal-Retzius cell
    term:
      id: CL:0000695
      label: Cajal-Retzius cell
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: ABNORMAL
  evidence:
  - reference: PMID:11239428
    reference_title: Tbr1 regulates differentiation of the preplate and layer 6.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cajal-Retzius cells expressed decreased levels of Reelin, resulting in a reeler-like cortical migration disorder."
    explanation: Tbr1-deficient mice show a Reelin-dependent cortical migration defect.
  downstream:
  - target: Frontal pachygyria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link between defective early-born neuron differentiation and
      the pachygyria reported in a minority of patients; the mouse migration
      defect is in null mutants and the human link has not been tested.
    evidence:
    - reference: PMID:30268909
      reference_title: Mutations in TBR1 gene leads to cortical malformations and intellectual disability.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "These individuals presented with a developmental encephalopathy characterized by frontal pachygyria and severe intellectual disability."
      explanation: >-
        Documents pachygyria in individuals with a TBR1 frameshift; the
        mechanistic attribution to defective neuronal migration is an
        inference from the mouse phenotype.
- name: Disrupted TBR1 Protein Interactions
  description: >-
    TBR1 homodimerizes and binds co-regulators including FOXP2, FOXP1,
    BCL11A and CASK, all products of other neurodevelopmental disorder genes.
    Pathogenic TBR1 variants disrupt these interactions, which may connect
    TBR1 haploinsufficiency to the language deficits shared with FOXP1- and
    FOXP2-related disorders.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FOXP2
    term:
      id: hgnc:13875
      label: FOXP2
  - preferred_term: CASK
    term:
      id: hgnc:1497
      label: CASK
  evidence:
  - reference: PMID:25232744
    reference_title: De novo TBR1 mutations in sporadic autism disrupt protein functions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that TBR1 homodimerizes, that it interacts with FOXP2, a transcription factor implicated in speech/language disorders, and that this interaction is disrupted by pathogenic mutations affecting either protein."
    explanation: Shows disruption of the TBR1-FOXP2 interaction by pathogenic TBR1 variants.
  - reference: PMID:36579832
    reference_title: "Characterization of the TBR1 interactome: variants associated with neurodevelopmental disorders disrupt novel protein interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The assays uncovered disturbed interactions for NDD-associated variants and identified two distinct protein-binding domains of TBR1 that have essential roles in protein-protein interaction."
    explanation: Interactome study extends the finding to further TBR1 partners.
  downstream:
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypothesised link from loss of TBR1-FOXP interactions to the language
      phenotype; see the discussion on this point.
    evidence:
    - reference: PMID:25232744

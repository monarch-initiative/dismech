animal_models:
- name: Tbr1 heterozygous knockout mouse
  species: Mouse
  genotype: Tbr1+/-
  publication: PMID:24441682
  description: >-
    Constitutive heterozygous knockout matching the patient genotype; shows
    reduced amygdalar connections and deficits in social interaction,
    vocalization, associative memory and cognitive flexibility, rescued by
    local D-cycloserine.
  modeled_mechanisms:
  - target: Reduced Amygdalar Axonal Connectivity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Heterozygous mice lose inter- and intra-amygdalar connections, the counterpart of the human anterior commissure reduction.
    limitations: >-
      Human amygdalar connectivity has not been measured directly; the human
      correspondence rests on anterior commissure reduction seen on MRI.
    evidence:
    - reference: PMID:24441682
      reference_title: Tbr1 haploinsufficiency impairs amygdalar axonal projections and results in cognitive abnormality.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of a copy of the Tbr1 gene altered the expression of Ntng1, Cntn2 and Cdh8 and reduced both inter- and intra-amygdalar connections."
      explanation: Shows the connectivity defect in the heterozygous model.
  - target: Amygdalar Glutamatergic Synaptic Hypofunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Amygdalar neurons fail to activate on behavioral stimulation, and behavior is rescued by restoring amygdalar activity.
    limitations: >-
      Rescue was by local intra-amygdalar infusion in mice; no human
      treatment data exist.
    evidence:
    - reference: PMID:24441682
      reference_title: Tbr1 haploinsufficiency impairs amygdalar axonal projections and results in cognitive abnormality.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also show that upregulation of amygdalar neuronal activity by local infusion of a partial NMDA receptor agonist, d-cycloserine, ameliorates the behavioral defects of Tbr1(+/-) mice."
      explanation: Rescue of behavior by restoring amygdalar activity.
- name: Tbr1 layer 6 conditional knockout mouse
  species: Mouse
  genotype: Tbr1 conditional deletion in layer 6 neurons (Tbr1layer6), heterozygous and homozygous
  publication: PMID:30318412
  description: >-
    Late-gestation deletion of Tbr1 in cortical layer 6 neurons produces
    dendritic, synaptic and physiological defects in heterozygotes; the
    synaptic deficit is largely rescued by restoring Wnt7b.
  modeled_mechanisms:
  - target: Impaired Dendritic Spine Maturation and Synaptogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Heterozygous layer 6 deletion reduces synapse formation in layer 6 neurons.
    limitations: >-
      Deletion is restricted to layer 6 and timed late in gestation, unlike
      the constitutive heterozygosity of patients; spine and synapse density
      have not been measured in human tissue.
    evidence:
    - reference: PMID:30318412
      reference_title: Neonatal Tbr1 Dosage Controls Cortical Layer 6 Connectivity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These phenotypes occur in heterozygotes, providing insights into mechanisms that may underlie ASD pathophysiology."
      explanation: Shows the synaptic phenotype at the patient-relevant dosage.
- name: Patient-specific Tbr1 knock-in mice
  species: Mouse
  genotype: Tbr1 A136PfsX80 and Tbr1 K228E knock-in
  publication: PMID:35944998
  description: >-
    Mice carrying two patient alleles; heterozygotes share reduced amygdalar
    connections and anterior commissure reduction, while homozygous cortical
    phenotypes diverge by allele.
  modeled_mechanisms:
  - target: Reduced Amygdalar Axonal Connectivity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Both patient alleles reduce amygdalar connections in heterozygotes.
    limitations: Only two of the many reported patient alleles have been modeled.
    evidence:
    - reference: PMID:35944998
      reference_title: Shared and Distinct Functional Effects of Patient-Specific Tbr1 Mutations on Cortical Development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice with one mutant Tbr1 copy show reduced amygdalar connections regardless of mutation type, suggesting a core biomarker for TBR1-related disorders."
      explanation: Patient alleles reproduce the connectivity defect.
discussions:
- discussion_id: tbr1_language_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of the TBR1-FOXP2 and TBR1-FOXP1 protein interactions explain
    the near-universal speech and language delay, or does the language
    phenotype follow from cortical and amygdalar circuit defects alone?
  attaches_to:
  - pathophysiology#Disrupted TBR1 Protein Interactions
  - phenotypes#Delayed speech and language development
  rationale: >-
    Pathogenic TBR1 variants disrupt binding to FOXP2 and FOXP1 in cell
    assays, and the authors propose this as a bridge between disorders with
    language deficits. No study has tested whether the interaction defect
    alters FOXP2 target genes or language-relevant circuits in vivo, and
    heterozygous mice show reduced ultrasonic vocalization without separating
    the two routes.
  evidence:
  - reference: PMID:25232744
    reference_title: De novo TBR1 mutations in sporadic autism disrupt protein functions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, they uncover neurogenetic mechanisms that bridge different neurodevelopmental disorders involving language deficits."
    explanation: States the hypothesis whose in vivo test is missing.
- discussion_id: tbr1_preclinical_rescue_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the synaptic and behavioral rescues achieved in Tbr1 mutant mice with
    D-cycloserine, dietary zinc and lithium chloride have any counterpart in
    people with TBR1-related disorder?
  attaches_to:
  - pathophysiology#Amygdalar Glutamatergic Synaptic Hypofunction
  - pathophysiology#Impaired Dendritic Spine Maturation and Synaptogenesis
  rationale: >-
    Several interventions reverse synaptic or behavioral phenotypes in mice,
    including in adult animals, but there are no human trials, and the mouse
    behavioral readouts (fear memory, social interaction, vocalization) are
    indirect proxies for intellectual disability, autism and language delay.
  evidence:
  - reference: PMID:35303947
    reference_title: Dietary zinc supplementation rescues fear-based learning and synaptic function in the Tbr1(+/-) mouse model of autism spectrum disorders.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data show that dietary zinc supplementation prevents impairments in auditory fear memory and social interaction, but not social novelty, in the Tbr1+/- mice."
    explanation: Partial behavioral rescue by zinc in heterozygous mice.
  - reference: PMID:25981743
    reference_title: Trans-synaptic zinc mobilization improves social interaction in two mouse models of autism through NMDAR activation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Clioquinol also improves social interaction in mice haploinsufficient for the transcription factor Tbr1, which accompanies NMDAR activation in the amygdala."
    explanation: A zinc ionophore restores amygdalar NMDA receptor activation and social behavior in heterozygous mice.
  - reference: PMID:35123407
    reference_title: LiCl treatment leads to long-term restoration of spine maturation and synaptogenesis in adult Tbr1 mutants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "LiCl, a WNT signaling agonist, robustly rescues the dendritic spine maturation, synaptic defects, and excitatory and inhibitory synaptic transmission deficits."
    explanation: Synaptic rescue by lithium chloride in adult conditional mutants.
notes: >-
  Naming. MONDO labels this term intellectual developmental disorder with
  autism and speech delay, after the OMIM title. The entry is named
  TBR1-Related Neurodevelopmental Disorder because the term is defined by
  TBR1 (MONDO's definition is a neurodevelopmental disorder caused by
  mutation in TBR1), and the MONDO label would also describe patients with
  other genes. TBR1-related disorder is used in primary literature
  (PMID:30268909, PMID:35944998). The MONDO and OMIM names are kept as
  synonyms.

  Susceptibility history. MONDO files this term under autism susceptibility
  and carries AUTS5 and autism, susceptibility to, 5 as synonyms, reflecting
  the term's origin as an autism susceptibility designation. The term now
  denotes a monogenic disorder with a definitive gene, and the entry is
  curated as such.

  No GeneReviews chapter covers TBR1. Facial features are not distinctive:
  no recognizable facial phenotype was identified in the 25-person Nambot
  series (PMID:32005960). Larger 2q24 deletions spanning TBR1 are handled as
  a differential rather than as a subtype because their extra features are
  attributed to other deleted genes.

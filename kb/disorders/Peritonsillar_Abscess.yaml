      The unified model directly connects mucosal infection to peritonsillar
      abscess formation through salivary-duct spread.
- name: Peritonsillar Pus Collection
  biological_scale: TISSUE
  description: >-
    Bacterial proliferation around the palatine tonsil elicits neutrophil-rich
    pyogenic inflammation and creates a drainable pus collection.
  cell_types:
  - preferred_term: neutrophil
    term:

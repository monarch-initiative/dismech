    description: >-
      Swelling and distortion around the soft palate reduce normal voice
      resonance and produce a muffled hot-potato quality.
  - target: Uvular Deviation
    causal_link_type: DIRECT
    description: >-
      Asymmetric peritonsillar edema and pus shift the uvula away from the
      midline.
  evidence:
  - reference: PMID:39857112
    reference_title: Diagnosis of Peritonsillar Abscess-A Prospective Study Comparing Clinical with CT Findings in 133 Consecutive Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Uvula deviation was defined as the shift of the uvula from the midline.
      Hot potato voice (or muffled voice) was defined by the lack of resonance
      of the voice while speaking.
    explanation: >-
      The prospective clinical-versus-CT study defines the uvular deviation and
      hot-potato voice signs assessed in patients with suspected PTA.
- name: Pterygoid Region Irritation
  biological_scale: TISSUE
  description: >-
    Pus and adjacent inflammation mechanically restrict the pterygoid muscle
    area, producing trismus and complicating oral examination and drainage.
  downstream:
  - target: Trismus
    causal_link_type: DIRECT
    description: >-
      Inflammation near the masticator muscles prevents normal mouth opening.
  evidence:
  - reference: PMID:39857112
    reference_title: Diagnosis of Peritonsillar Abscess-A Prospective Study Comparing Clinical with CT Findings in 133 Consecutive Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We applied conservative criteria to define true trismus, which arises from
      mechanical impairment of the pterygoid muscle area due to the presence of
      pus and inflammation rather than solely from pain.
    explanation: >-
      This clinical study distinguishes PTA-associated trismus from pain-limited
      mouth opening and attributes true trismus to pterygoid-area mechanical
      impairment by pus and inflammation.
- name: Contiguous Deep Neck and Mediastinal Extension
  biological_scale: ORGANISM
  description: >-
    A minority of complicated cases spread laterally or posteriorly beyond the
    tonsillar region through cervical tissues, producing parapharyngeal or
    retropharyngeal abscesses, descending mediastinitis, or cervical
    necrotizing fasciitis.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Deep Neck and Mediastinal Extension
    causal_link_type: DIRECT
    description: >-
      Infection that crosses local fascial planes can seed deeper neck spaces,
      the mediastinum, and cervical fascia.
  evidence:
  - reference: PMID:32731900
    reference_title: Complications of peritonsillar abscess.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Seventeen different complications of PTA were reported. The most
      frequently described complications were descending mediastinitis (n = 113),
      para- and retropharyngeal abscess (n = 96), necrotizing fasciitis
      (n = 38), and Lemierre´s syndrome (n = 35).
    explanation: >-
      A literature review of PTA complications identifies deep-neck extension,
      mediastinitis, and necrotizing fasciitis among the most reported
      contiguous-spread complications.
- name: Internal Jugular Septic Thrombophlebitis
  biological_scale: TISSUE
  description: >-
    PTA-associated lateral pharyngeal infection can reach the internal jugular

synonyms:
- Quinsy
- Peritonsillar abscess
- PTA
prevalence:
- population: Denmark
  measure_type: ANNUAL_INCIDENCE
  rate_per_100000: 41
  notes: >-
    This retrospective Danish catchment-area study reported a mean annual rate
    rather than a point prevalence; it is recorded as annual incidence.
  evidence:
  - reference: PMID:19842975
    reference_title: "Fusobacterium necrophorum: most prevalent pathogen in peritonsillar abscess in Denmark."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The mean annual incidence of PTA was 41 cases/100,000 population."
    explanation: >-
      A catchment-area study of 847 peritonsillar abscess patients reports a
      mean annual rate of 41 cases per 100,000 population.
infectious_agent:
- name: Fusobacterium necrophorum
  description: >-
    Fusobacterium necrophorum is an anaerobic oropharyngeal pathogen that is
    frequently recovered from peritonsillar abscess pus and was the most common
    organism in Danish and Swedish microbiology cohorts, especially among
    adolescents and young adults.
  infectious_agent_term:
    preferred_term: Fusobacterium necrophorum
    term:
      id: NCBITaxon:859
      label: Fusobacterium necrophorum
  evidence:
  - reference: PMID:19842975
    reference_title: "Fusobacterium necrophorum: most prevalent pathogen in peritonsillar abscess in Denmark."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "FN was the most frequently detected bacteria (in 23% of cultures), followed by group A streptococci (in 17%) and groups C and G streptococci (counted together, in 5%)."
    explanation: >-
      This Danish culture series identified F. necrophorum more often than group
      A streptococci or group C/G streptococci in peritonsillar abscess pus.
  - reference: PMID:40366504
    reference_title: Association between clinical outcome and microbiological findings in peritonsillar abscess - an observational study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In a total of 637 patients, F. necrophorum was identified in 210 (33%),
      GAS in 159 (28%) and GCS/GGS in 40 (6%) patients.
    explanation: >-
      A Swedish observational cohort again found F. necrophorum to be the most
      commonly identified organism, ahead of group A streptococci.
- name: Streptococcus pyogenes
  description: >-
    Streptococcus pyogenes, the group A streptococcus, is a common aerobic
    isolate in peritonsillar abscess pus and links the disorder to antecedent
    streptococcal pharyngotonsillitis.
  infectious_agent_term:
    preferred_term: Streptococcus pyogenes
    term:
      id: NCBITaxon:1314
      label: Streptococcus pyogenes
  evidence:
  - reference: PMID:19842975
    reference_title: "Fusobacterium necrophorum: most prevalent pathogen in peritonsillar abscess in Denmark."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "FN was the most frequently detected bacteria (in 23% of cultures), followed by group A streptococci (in 17%) and groups C and G streptococci (counted together, in 5%)."
    explanation: >-
      Group A streptococci were the second most frequent isolate in the Danish
      peritonsillar abscess series.
  - reference: PMID:40366504
    reference_title: Association between clinical outcome and microbiological findings in peritonsillar abscess - an observational study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In a total of 637 patients, F. necrophorum was identified in 210 (33%),
      GAS in 159 (28%) and GCS/GGS in 40 (6%) patients.
    explanation: >-
      The Swedish cohort recovered group A Streptococcus in 28% of patients,
      supporting S. pyogenes as a frequent PTA pathogen.
transmission:
- name: Endogenous spread through the tonsillar-salivary duct system
  description: >-
    Peritonsillar abscess is a contiguous infection of resident oropharyngeal
    flora rather than a separate person-to-person transmission syndrome.
    Bacteria infect the tonsillar mucosa, tonsillar crypts, or Weber minor
    salivary glands and spread through salivary ducts into the potential space
    around the palatine tonsil.
  evidence:
  - reference: PMID:27026737
    reference_title: "Peritonsillar Abscess: Complication of Acute Tonsillitis or Weber's Glands Infection?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We propose a unified hypothesis whereby bacteria initially infect the
      tonsillar mucosa and spread via the salivary duct system to the
      peritonsillar space, where an abscess is formed.
    explanation: >-
      This pathogenesis review frames PTA as tonsillar infection that spreads
      locally through the salivary duct system into the peritonsillar space.
environmental:
- name: Smoking
  exposure_term:

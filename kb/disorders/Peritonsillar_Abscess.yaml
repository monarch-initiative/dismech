name: Peritonsillar Abscess
creation_date: "2026-09-30T10:00:51Z"
description: >-
  Peritonsillar abscess is a localized pyogenic infection around the palatine
  tonsil in which oropharyngeal bacteria, most prominently Fusobacterium
  necrophorum and group A Streptococcus, spread from tonsillar mucosa or Weber
  minor salivary glands through the salivary duct system into the peritonsillar
  space and form a pus collection. Abscess expansion displaces the soft palate
  and uvula, irritates the pterygoid muscle region, and produces severe sore
  throat, odynophagia, dysphagia, trismus, referred ear pain, and a muffled
  "hot potato" voice; untreated or complicated infections can extend into deep
  neck spaces, the airway, the mediastinum, or the internal jugular venous
  system.
category: Infectious Disease
disease_term:
  preferred_term: peritonsillar abscess
  term:

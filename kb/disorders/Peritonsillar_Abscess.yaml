    reference_title: Complications of peritonsillar abscess.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Peritonsillar abscess (PTA) refers to pus collection between the tonsillar
      capsule and the pharyngeal constrictor muscle.
    explanation: >-
      A complications review likewise localizes PTA to the peritonsillar
      tonsillar-capsule-to-pharyngeal-constrictor space.
- name: Soft Palate and Uvula Edema
  biological_scale: TISSUE
  description: >-
    The enlarging collection thickens and displaces the peritonsillar mucosa,
    soft palate, and uvula, producing uvular deviation and contributing to
    muffled speech resonance.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED

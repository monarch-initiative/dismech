  downstream:
  - target: Lemierre Syndrome
    causal_link_type: DIRECT
    description: Internal jugular septic thrombophlebitis defines Lemierre syndrome.
  evidence:
  - reference: PMID:32731900
    reference_title: Complications of peritonsillar abscess.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Seventeen different complications of PTA were reported. The most
      frequently described complications were descending mediastinitis (n = 113),
      para- and retropharyngeal abscess (n = 96), necrotizing fasciitis
      (n = 38), and Lemierre´s syndrome (n = 35).
    explanation: >-
      The PTA complication review identifies Lemierre syndrome as a distinct
      complication rather than a contiguous deep-neck abscess or mediastinal
      extension.
  - reference: PMID:39840169
    reference_title: Early Radiographic Warning Signs of Impending Lemierre's Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The diagnosis of Lemierre's syndrome is typically confirmed through the
      identification of thrombophlebitis of the internal jugular vein on
      radiographic imaging and the isolation of anaerobic bacteria in blood
      cultures.
    explanation: >-
      This clinical review defines internal jugular thrombophlebitis as the
      vascular lesion of Lemierre syndrome.

    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  disease_effect: PREDISPOSES
  causal_role: ASSOCIATED_ONLY
  description: >-
    Tobacco-smoking exposure is overrepresented in adult PTA cohorts and is
    recorded as a modifiable lifestyle risk factor for PTA.
  influences_mechanisms:
  - target: Polymicrobial Tonsillar and Weber Gland Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smoking is associated with PTA occurrence; the cited cohorts support the
      epidemiologic risk association but do not resolve the intermediate
      oropharyngeal mechanisms.
  evidence:
  - reference: PMID:41113746
    reference_title: Comorbidities and Complications in Adult Peritonsillar Abscess Tonsillectomy Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      PTA patients had significantly higher rates of smoking (27.0% versus
      12.3%), diabetes (6.6% versus 2.5%), hypertension (11.5% versus 5.8%),
      and preoperative sepsis (14.5% versus 0.3%; p < .001 for all).
    explanation: >-
      This NSQIP comparison found smoking to be more frequent among adults
      undergoing quinsy tonsillectomy for PTA than among recurrent-tonsillitis
      controls.
  - reference: PMID:25794541
    reference_title: "Peritonsillar abscess: remember to always think twice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Smoking habits were reported by almost every second patient.
    explanation: >-
      This 775-patient retrospective PTA treatment series likewise reports high
      smoking prevalence and notes that smoking habits are overrepresented in
      PTA patients.

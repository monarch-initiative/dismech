treatments:
- name: Drainage
  description: >-
    Drainage evacuates the peritonsillar pus collection; needle aspiration,
    incision and drainage, and abscess tonsillectomy are procedural options,
    with incision and drainage reducing the need for repeated procedures
    compared with needle aspiration in one retrospective comparison.
  treatment_term:
    preferred_term: Incision and Drainage
    term:
      id: NCIT:C38067
      label: Incision and Drainage
  target_mechanisms:
  - target: Peritonsillar Pus Collection
    treatment_effect: INHIBITS
    description: Drainage removes the pus collection and decompresses the abscess.
  evidence:
  - reference: PMID:34111309
    reference_title: "The Surgical Treatment of Peritonsillar Abscess: A Retrospective Analysis in 584 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are three surgical treatment options for patients with peritonsillar
      abscess (PTA): needle aspiration, incision and drainage (ID), and abscess
      tonsillectomy (ATE).
    explanation: >-
      A 584-patient surgical series names the major procedural source-control
      options for PTA.
  - reference: PMID:31300842
    reference_title: Comparison of needle aspiration versus incision and drainage under local anaesthesia for the initial treatment of peritonsillar abscess.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A repetition of the needle aspiration was made for 46.3% of patients
      versus 10% of repetition of the procedure in the incision group
      (p = 0.0001).
    explanation: >-
      This comparison supports incision and drainage as a drainage strategy with
      fewer repeat bedside procedures than needle aspiration in the studied
      cohort.
- name: Antibiotic therapy
  description: >-
    Empiric antibiotics active against group A Streptococcus and oral anaerobes
    treat the polymicrobial bacterial infection after drainage or, in selected
    uncomplicated inferior-pole abscesses, during observation.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Polymicrobial Tonsillar and Weber Gland Infection
    treatment_effect: INHIBITS
    description: >-
      Antibiotics kill or inhibit the group A streptococci and oral anaerobes
      that seed the peritonsillar space.
  - target: Salivary Duct Spread to the Peritonsillar Space
    treatment_effect: INHIBITS
    description: >-
      Early antimicrobial activity limits local bacterial spread through
      tonsillar and salivary-duct tissues.
  evidence:
  - reference: PMID:28409615
    reference_title: Peritonsillar Abscess.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Peritonsillar abscesses are polymicrobial infections, and antibiotics
      effective against group A streptococcus and oral anaerobes should be
      first-line therapy.
    explanation: >-
      A clinical review specifies first-line antimicrobial coverage for PTA.
- name: Adjunct systemic corticosteroid therapy
  description: >-
    Systemic corticosteroids are an adjunct after drainage that may reduce fever
    and accelerate symptom recovery but have heterogeneous trial evidence for
    pain, mouth opening, oral intake, and hospitalization endpoints.
  treatment_term:
    preferred_term: Systemic Corticosteroid Therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  target_phenotypes:
  - preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  - preferred_term: Trismus
    term:
      id: HP:0000211
      label: Trismus
  - preferred_term: Odynophagia
    term:
      id: HP:0032043
      label: Odynophagia
  evidence:
  - reference: PMID:28561258
    reference_title: "Adjunct steroids in the treatment of peritonsillar abscess: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All three RCTs reported statistically significant improvement in body
      temperature from adjuvant steroid administration compared to placebo.
    explanation: >-
      This systematic review of randomized trials found the most consistent
      adjunct-steroid signal for body temperature improvement.
- name: Abscess tonsillectomy for selected or recurrent disease
  description: >-
    Abscess tonsillectomy is one of the surgical source-control options and may
    be selected for airway compromise, sleep apnea, or recurrent disease,
    particularly when anaerobic growth suggests higher recurrence risk.
  treatment_term:
    preferred_term: Tonsillectomy
    term:
      id: NCIT:C51679
      label: Tonsillectomy
  target_mechanisms:
  - target: Peritonsillar Pus Collection
    treatment_effect: INHIBITS
    description: Tonsillectomy removes the tonsil together with the adjacent abscess.
  evidence:
  - reference: PMID:18204368
    reference_title: Microbiology of peritonsillar abscess as an indication for tonsillectomy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Anaerobic bacterial growth correlates with a higher rate of recurrence,
      and may serve as an additional relative indicator for tonsillectomy.
    explanation: >-
      A 469-patient recurrence study links anaerobic growth to recurrence and
      to tonsillectomy selection.
diagnosis:
- name: Clinical examination with pus confirmation
  description: >-
    Clinicians suspect PTA from the sore-throat syndrome with trismus, edema,
    uvular deviation, and hot-potato voice, but abscess is definitively
    established when needle aspiration or drainage exteriorizes pus rather than
    cellulitis.
  diagnosis_term:
    preferred_term: Fine-Needle Aspiration
    term:
      id: NCIT:C15361
      label: Fine-Needle Aspiration
  results: >-
    Recovery or direct visualization of pus from the peritonsillar space
    confirms a drainable abscess and distinguishes it from peritonsillar
    cellulitis.
  evidence:
  - reference: PMID:39857112
    reference_title: Diagnosis of Peritonsillar Abscess-A Prospective Study Comparing Clinical with CT Findings in 133 Consecutive Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultimately, only the direct visualization of pus during surgical
      exteriorization allows for a definitive diagnosis.
    explanation: >-
      The prospective diagnostic study used surgically proven pus as the main
      reference standard for confirming PTA.
  - reference: PMID:10435129
    reference_title: "Diagnosis of peritonsillar infections: a prospective study of ultrasound, computerized tomography and clinical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Clinical diagnosis is often supplemented by diagnostic drainage
      (aspiration or incision) in an effort to distinguish abscess from
      cellulitis.
    explanation: >-
      The prospective ultrasound and CT study supports using aspiration or
      incision as both drainage and diagnostic confirmation.
- name: Contrast-enhanced computed tomography
  description: >-
    Contrast CT can identify a peritonsillar fluid collection with rim
    enhancement and is useful when clinical examination is ambiguous, trismus
    limits examination, disease may be bilateral, or extension into other neck
    spaces must be assessed.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: >-
    A low-attenuation collection with an enhancing irregular rim in the tonsil
    or peritonsillar space supports PTA.
  evidence:
  - reference: PMID:39857112
    reference_title: Diagnosis of Peritonsillar Abscess-A Prospective Study Comparing Clinical with CT Findings in 133 Consecutive Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      None of the evaluated clinical signs were associated with PTA
      (OR = 1.26-5.43, p > 0.05), whereas the CT finding "abscess" was
      significantly associated with PTA (OR = 67.2, p < 0.0001).
    explanation: >-
      In 133 adults with suspected PTA, contrast CT performed better than the
      individual clinical signs and was strongly associated with the surgically
      confirmed diagnosis.
  - reference: PMID:10435129
    reference_title: "Diagnosis of peritonsillar infections: a prospective study of ultrasound, computerized tomography and clinical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Computerized tomography (CT) (sensitivity 100 per cent, specificity 75 per
      cent) and intraoral ultrasound (sensitivity 89 per cent, specificity 100
      per cent) are much more reliable.
    explanation: >-
      This small prospective study found CT and intraoral ultrasound more
      reliable than clinical impression alone for distinguishing abscess from
      cellulitis.
- name: Intraoral ultrasound
  description: >-
    Intraoral ultrasound can image a peritonsillar abscess at the bedside and
    help distinguish abscess from cellulitis when the oral probe can be placed.
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  results: >-
    Demonstration of a drainable peritonsillar collection supports PTA and can
    guide aspiration.
  evidence:
  - reference: PMID:10435129
    reference_title: "Diagnosis of peritonsillar infections: a prospective study of ultrasound, computerized tomography and clinical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We propose that intraoral ultrasound could play a useful role in the
      clinical assessment of peritonsillar infections helping to improve
      accuracy in distinguishing abscesses from cellulitis.
    explanation: >-
      The prospective comparison supports intraoral ultrasound as an adjunctive
      test that can separate abscess from peritonsillar cellulitis.

    reference_title: Complications of peritonsillar abscess.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most frequently described complications were descending mediastinitis
      (n = 113), para- and retropharyngeal abscess (n = 96), necrotizing
      fasciitis (n = 38), and Lemierre´s syndrome (n = 35).
    explanation: >-
      The literature review enumerates the major complicated PTA phenotypes that
      arise when infection spreads through deep neck and mediastinal tissues.
- category: Cardiovascular

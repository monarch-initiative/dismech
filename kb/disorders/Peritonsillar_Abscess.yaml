    snippet: >-
      The symptomatology of PTA is evident, almost always characterized by
      severe lateralized odynophagia, with or without limited mouth opening
      (trismus), altered voice and speech, cervical lymphadenitis, restricted
      head movement, and a decline in general condition.
    explanation: >-
      This diagnostic study background names cervical lymphadenitis as part of
      the usual PTA symptom complex.
- category: Head and neck
  name: Deep Neck and Mediastinal Extension
  description: >-
    Complicated PTA can spread beyond the peritonsillar space to para- or
    retropharyngeal abscesses, descending mediastinitis, or necrotizing
    fasciitis.
  notes: >-

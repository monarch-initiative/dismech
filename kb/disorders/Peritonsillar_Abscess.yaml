      pharyngeal focus to the internal jugular vein and cause Lemierre syndrome.
  evidence:
  - reference: PMID:39857112
    reference_title: Diagnosis of Peritonsillar Abscess-A Prospective Study Comparing Clinical with CT Findings in 133 Consecutive Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It is a collection of pus within the palatine tonsil or the peritonsillar
      space, a virtual anatomical space between the tonsillar capsule and the
      superior pharyngeal constrictor muscle.
    explanation: >-
      This diagnostic study background defines PTA anatomically as a pus
      collection in or around the palatine tonsil.

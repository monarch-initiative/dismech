    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in COPG1 have been reported as a cause of combined immunodeficiency"
    explanation: >-
      Independent restatement that COPG1 causes combined immunodeficiency.
      Quoted from the introduction of a COPB1 report rather than from its own
      results.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Five affected siblings from one consanguineous Omani kindred are the only
    reported patients found during curation. No prevalence, incidence or
    carrier-frequency estimate exists, and Orphanet records no epidemiology for
    ORPHA:718017, so no rate is given here.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five siblings with persistent bacterial and viral infections"
    explanation: The reported case count on which this record rests.

diagnosis:
- name: Molecular genetic testing for biallelic COPG1 variants
  description: >-
    There is no functional screening assay in clinical use. The diagnosis is
    made by finding a biallelic COPG1 variant in a child with combined
    immunodeficiency, CD4+ lymphopenia and poor specific antibody responses.
    Because the disorder is known from a single kindred, a novel COPG1 variant
    found in another family will need functional support, for which the
    published assay is loss of coatomer binding to the KDEL receptor with
    failure of chaperone retrieval.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation disrupts COPI binding to the KDEL receptor and impairs the retrieval of KDEL-bearing chaperones from the Golgi to the ER."
    explanation: >-
      Supports the functional-confirmation part of this diagnostic approach
      only: it names the assays that established pathogenicity of the reported
      allele, and says nothing about the sequencing step that finds a variant.

differential_diagnoses:
- name: COPA syndrome
  description: >-
    The other coatopathy of retrograde Golgi-to-ER transport, and the one a
    COPG1 patient is most likely to be tested for. COPA syndrome is
    autosomal dominant and is an interferonopathy driven by cGAS/STING
    activation, presenting with lung haemorrhage and arthritis rather than with
    a combined immunodeficiency.
  distinguishing_features:
  - COPA syndrome is dominantly inherited; IMD128 is recessive.
  - COPA syndrome presents as autoinflammation and interstitial lung disease rather than as infection susceptibility.
  evidence:
  - reference: PMID:35484149
    reference_title: Deficiency in coatomer complex I causes aberrant activation of STING signalling.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is caused by autosomal dominant mutations in the COPA gene"
    explanation: >-
      Sources the inheritance half of the distinction. Quoted from the
      introduction, where it restates the established mode of inheritance of
      COPA syndrome.
  - reference: PMID:35484149
    reference_title: Deficiency in coatomer complex I causes aberrant activation of STING signalling.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "including interstitial lung disease with or without pulmonary haemorrhage, inflammatory arthritis, immune-mediated kidney disease and autoantibodies"
    explanation: >-
      Sources the presentation half of the distinction: COPA syndrome presents
      with inflammatory organ disease rather than with infection
      susceptibility. Quoted from the introduction.
  - reference: PMID:35484149
    reference_title: Deficiency in coatomer complex I causes aberrant activation of STING signalling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genetic deletion of COPI subunits COPG1 or COPD similarly induces type I IFN activation in vitro, which suggests that inflammatory diseases associated with mutations in other COPI subunit genes may exist."
    explanation: >-
      Establishes that the two disorders share a retrograde-transport lesion
      and that the interferon arm is not unique to COPA, which is why the
      differential turns on inheritance and presentation rather than on
      pathway.

- name: COPB1 deficiency
  description: >-
    The beta subunit counterpart. COPB1 deficiency also produces a combined
    immunodeficiency through the same coatomer, alongside neurological
    features, so it is a genotype-level rather than a phenotype-level
    distinction.
  distinguishing_features:
  - COPB1 deficiency carries neurological manifestations not reported in the COPG1 kindred.
  evidence:
  - reference: PMID:41676145
    reference_title: Expanding the clinical and immunological phenotypes of COPB1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report documents a rare combined immunodeficiency disorder with neurological manifestations"
    explanation: Establishes COPB1 deficiency as a combined immunodeficiency with neurological features.

animal_models:
- name: Copg1 K652E knock-in mouse
  species: Mouse
  genotype: Copg1 K652E homozygous knock-in
  description: >-
    A mouse carrying the patients' substitution. Under specific-pathogen-free
    conditions it shows the cellular lesion (ER stress in activated
    lymphocytes, poor antibody responses, activation-induced T cell apoptosis)
    but normal T cell numbers and proliferation; the patients' proliferation
    defect and lymphopenia appear only after the animals are exposed to the
    microbial burden of pet store mice.
  publication: PMID:33529166
  genes:
  - preferred_term: COPG1
    term:
      id: hgnc:2236
      label: COPG1
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Stress in Activated Lymphocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The knock-in carries the patients' exact substitution and reproduces the
      ER stress in activated T and B cells.
    readouts:
    - name: ER stress in activated T and B cells
      target: Endoplasmic Reticulum Stress in Activated Lymphocytes
      direction: INCREASED
      interpretation: The cellular lesion the human allele is proposed to cause.
      evidence:
      - reference: PMID:33529166
        reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Homozygous Copg1K652E mice had increased ER stress in activated T and B cells"
        explanation: Reports the measured increase in ER stress in activated lymphocytes.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous Copg1K652E mice had increased ER stress in activated T and B cells"
      explanation: Supports treating this knock-in as informative for the ER stress node.
  - target: Increased Apoptosis of Activated T Cells
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      T cells are present in normal numbers and proliferate normally but die on
      activation.
    readouts:
    - name: Apoptosis of T cells upon activation
      target: Increased Apoptosis of Activated T Cells
      direction: INCREASED
      interpretation: Establishes that the defect is conditional on activation rather than developmental.
      evidence:
      - reference: PMID:33529166
        reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "normal numbers of T cells that proliferated normally, but underwent increased apoptosis upon activation"
        explanation: Reports the activation-induced apoptosis measurement.
  - target: Defective Humoral and Cellular Immunity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The organism-level phenotype appears only under microbial exposure: after
      cohousing with pet store mice the mutants lost weight and developed
      lymphopenia and defective T cell proliferation resembling the patients.
    limitations: >-
      Under specific-pathogen-free housing the mutant mice have normal T cell
      numbers and normal proliferation, so the model reproduces the patients'
      systemic immune failure only when the environmental antigen burden is
      raised. The patients' persistent CMV and EBV viremia has no counterpart
      in the model at all, since neither virus infects mice.
    readouts:
    - name: Weight, lymphocyte count and T cell proliferation after pet store mouse exposure
      target: Defective Humoral and Cellular Immunity
      direction: DECREASED
      interpretation: The systemic phenotype that the authors state recapitulates the patients' findings.
      evidence:
      - reference: PMID:33529166
        reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Exposure of the mutants to pet store mice caused weight loss, lymphopenia, and defective T cell proliferation that recapitulated the findings in the patients."
        explanation: Reports the measured systemic phenotype and its dependence on microbial exposure.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous Copg1K652E mice had increased ER stress in activated T and B cells"
    explanation: Identifies the genotype of the knock-in model and the lesion it carries.

experimental_models:
- name: CRISPR/Cas9 COPG1-deficient HeLa and THP-1 cell lines
  description: >-
    Complete deletion of COPG1 in human cell lines, used to ask whether the
    retrograde-transport lesion of COPA syndrome generalises across COPI
    subunits. It does: COPG1-null cells show the same shift of KDEL-tagged
    chaperones towards the Golgi, and they activate cGAS/STING and type I
    interferon signalling spontaneously.
  experimental_model_type: CELL_LINE
  publication: PMID:35484149
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Impaired Retrieval of KDEL-Bearing Chaperones to the ER
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Deleting COPG1 reproduces the retrograde-trafficking defect, measured as
      KDEL signal redistributing onto the cis-Golgi.
    limitations: >-
      This is a complete null, not the patients' missense allele, and it is a
      HeLa or THP-1 cell rather than a lymphocyte. The patients' substitution
      leaves the subunit expressed and incorporated into the coat and disables
      one interaction, so a deletion may overstate the functional loss and may
      engage consequences the missense allele does not.
    evidence:
    - reference: PMID:35484149
      reference_title: Deficiency in coatomer complex I causes aberrant activation of STING signalling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results indicate that genetic deletion of COPA, COPG1 or COPD results in impaired retrograde trafficking"
      explanation: Reports the retrograde-trafficking defect measured in COPG1-deleted cells.
  evidence:
  - reference: PMID:35484149
    reference_title: Deficiency in coatomer complex I causes aberrant activation of STING signalling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "only deletion of COPG1 resulted in spontaneous phosphorylation of STAT1 and inflammatory gene transcription"
    explanation: >-
      Reports that COPG1 loss, unlike COPG2 loss, drives spontaneous
      inflammatory signalling, which is the finding that makes this model
      relevant beyond the trafficking defect.

treatments:
- name: Tauroursodeoxycholic acid (preclinical only)
  description: >-
    The ER stress-relieving bile acid corrected the immune defects of the
    knock-in mice and reversed the phenotype the mutants acquired after pet
    store mouse exposure. This is a mouse result. No patient has been reported
    to receive it for this disorder, no dose or schedule is established, and it
    is recorded here because it identifies the mechanistic node that is
    druggable, not because it is a recommended therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tauroursodeoxycholic acid
      term:
        id: CHEBI:80774
        label: tauroursodeoxycholic acid
  target_mechanisms:
  - target: Endoplasmic Reticulum Stress in Activated Lymphocytes
    description: >-
      The agent acts on the ER stress node rather than on the trafficking
      defect upstream of it, which is why correction is possible without
      restoring chaperone retrieval.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ER stress-relieving agent tauroursodeoxycholic acid corrected the immune defects of the mutants"
      explanation: Reports correction of the immune defect by an agent acting on ER stress.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "tauroursodeoxycholic acid corrected the immune defects of the mutants and reversed the phenotype they acquired following exposure to pet store mice"
    explanation: The only therapeutic result reported for this disorder, and it is in the mouse.

discussions:
- discussion_id: copg1_human_treatment_absent
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the standard of care for a child with COPG1 deficiency, and does
    immunoglobulin replacement, antimicrobial prophylaxis or haematopoietic
    stem cell transplantation change outcome?
  attaches_to:
  - treatments#
  rationale: >-
    No management recommendation could be sourced for this disorder during
    curation. The only reported therapeutic result is correction of the mouse
    phenotype by tauroursodeoxycholic acid. Because the mechanism is a
    cell-intrinsic trafficking defect present in every cell, whether a
    haematopoietic graft would be curative is not obvious and has not been
    reported.

- discussion_id: copg1_type_i_interferon_in_patients
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the cGAS/STING-driven type I interferon activation seen in
    COPG1-deleted cell lines occur in patients carrying the p.K652E missense
    allele, and if so does it contribute to their disease?
  attaches_to:
  - pathophysiology#Impaired Retrieval of KDEL-Bearing Chaperones to the ER
  rationale: >-
    Complete deletion of COPG1 in HeLa and THP-1 cells activates STING and type
    I interferon signalling, and the authors explicitly raise the possibility of
    inflammatory disease from other COPI subunit genes. The reported COPG1
    patients are described as infection-prone rather than autoinflammatory, and
    a missense allele that leaves the subunit in the coat is not the same lesion
    as a null. No interferon signature has been reported in these patients.

- discussion_id: copg1_mouse_needs_microbial_exposure
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does the Copg1 K652E mouse reproduce the patients' lymphopenia and T
    cell proliferation defect only after exposure to pet store mice, and what
    does that imply for the human disease?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Defective Humoral and Cellular Immunity
  rationale: >-
    Under specific-pathogen-free housing the knock-in mouse has normal T cell
    numbers and normal proliferation, and only acquires the patients' systemic
    findings once cohoused with pet store mice. The cellular lesion is
    therefore faithful while the organism-level phenotype is conditional on
    antigenic burden. If that dependence holds in humans, it would predict that
    severity tracks cumulative infection exposure rather than genotype alone,
    which bears directly on whether early prophylaxis is worthwhile. It is
    untested.

references:
- reference: PMID:33529166
  title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
- reference: PMID:41676145
  title: Expanding the clinical and immunological phenotypes of COPB1 deficiency.
- reference: PMID:35484149
  title: Deficiency in coatomer complex I causes aberrant activation of STING signalling.
- reference: ORPHA:718017
  title: Combined immunodeficiency due to COPG1 deficiency

notes: >-
  Identity. The stub for MONDO:0975834 carried no gene, so the identity was
  established from the term's own cross-references rather than from memory.
  MONDO:0975834 is an exact match to OMIM:620983 (IMMUNODEFICIENCY 128), and
  Orphanet's record for the same OMIM entry, ORPHA:718017, names it "Combined
  immunodeficiency due to COPG1 deficiency". The gene assignment therefore
  rests on the MONDO-OMIM-Orphanet chain plus the primary report, PMID:33529166,
  which describes the five-sibling Omani kindred homozygous for COPG1 p.K652E.
  No second family and no second allele were found in a PubMed search of COPG1
  in title and abstract.

  MONDO status. MONDO has scheduled MONDO:0975834 for obsoletion and merger
  into MONDO:0800136, on the stated grounds that the two terms denote the same
  concept. The term was still live and not flagged obsolete when this entry was
  written, so it remains the primary disease_term and the successor is recorded
  as an exact match in mappings. The stub did not carry the obsoletion-candidate
  flag, which is worth knowing when reading the stub queue for other terms.

  Lump or split. This is curated as its own Disease entry rather than as a
  has_subtypes entry on a neighbour. The knowledge base holds no COPG1 entry and
  no coatopathy entry of any kind, so there is no parent disease for it to sit
  under, and the numbered immunodeficiencies in kb/disorders are each their own
  entry. The pathograph is a single conserved chain from one allele to one
  clinical picture, which is what a Disease entry asks for. It is a candidate
  member of the Combined_Immunodeficiencies_IEIs grouping; that grouping was not
  edited here.

  Gaps, and why they are gaps rather than omissions. There is no prevalence,
  incidence or carrier-frequency figure anywhere, and Orphanet records no
  epidemiology for ORPHA:718017. There is no GeneReviews chapter. There is no
  clinical trial and no reported human treatment: the only therapeutic result is
  in the knock-in mouse. The primary report is not available as full text
  through the reference cache used here, only as its abstract, so several
  clinical details that the paper does report - the specific organisms cultured,
  bronchiectasis in three of the siblings, the death of one sibling at 3.5
  years, immunoglobulin replacement - are deliberately absent from this entry
  rather than asserted from a source that cannot be quoted. The patient-level
  clinical and immunological features that are present here are quoted from the
  introduction of PMID:41676145, a report on the related COPB1 disorder that
  restates the published COPG1 findings; those items carry quote_role BACKGROUND
  for that reason. An entry built from the full text of PMID:33529166 would be
  substantially richer and remains the obvious next pass.

  Variant grading. genetic_context on the COPG1 node records zygosity, origin
  and allele type but not functional_impact_category. The quotable source says
  the substitution disrupts COPI binding to the KDEL receptor; whether that is
  best graded a partial or an interaction-selective loss of function depends on
  what the mutant coat still does, which is reported in the paper's full text
  rather than its abstract. The field is left empty rather than graded from an
  inference.

  Ontology bindings. HP:0002783 Recurrent lower respiratory tract infections is
  used where the source says "recurrent pulmonary infections": pulmonary names
  the lung, which is the lower respiratory tract, so the term asserts no more
  than the source does. HP:0031379
  Abnormal T cell proliferation is used rather than one of the stimulus-specific
  children (HP:0031381 mitogen-induced, HP:0031382 anti-CD3/28-induced) because
  the quotable source says only "impaired T-cell proliferation". Orphanet's
  record maps ORPHA:718017 to ICD-10 D81.8 as a narrower-than relation; no
  icd10cm mapping is recorded here because that binding could not be resolved
  against an ontology source during curation.

name: Immunodeficiency 128
creation_date: "2026-09-24T00:00:00Z"
category: Mendelian
description: >-
  Immunodeficiency-128 (IMD128) is an autosomal recessive combined
  immunodeficiency caused by biallelic variants in COPG1, which encodes the
  gamma-1 subunit of the coat protein I (COPI) coatomer. It is known from a
  single consanguineous Omani kindred of five affected siblings homozygous for
  the missense allele p.K652E. The mechanism is a trafficking defect rather
  than a defect in an immune effector: the substitution disrupts binding of the
  COPI coat to the KDEL receptor, so KDEL-bearing endoplasmic reticulum
  chaperones are not retrieved from the Golgi back to the ER. The consequence
  falls on cells that depend on a large secretory load. In the knock-in mouse,
  activated T and B cells accumulate ER stress, antibody responses are poor,
  and activated T cells undergo increased apoptosis despite normal resting T
  cell numbers and proliferation. Clinically the siblings had persistent
  bacterial and viral infections with defective humoral and cellular immunity,
  presenting in infancy with recurrent pulmonary infections, failure to thrive,
  and persistent EBV and CMV viremia. The entry is deliberately thin: the
  disease rests on one published family, there is no prevalence estimate, no
  clinical trial, and no GeneReviews chapter.
parents:
- hereditary disease
- inborn error of immunity
- primary immunodeficiency disease
- combined immunodeficiency

classifications:
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      Defective humoral and cellular immunity together place this with the
      IUIS immunodeficiencies affecting cellular and humoral immunity rather
      than with a predominantly antibody deficiency. The assignment is made
      from the reported phenotype; COPG1 was not listed in the IUIS tables
      consulted during curation, so this is a curator classification and not a
      quoted IUIS entry.


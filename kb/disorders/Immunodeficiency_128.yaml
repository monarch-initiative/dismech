      id: MONDO:0800136
      label: non-severe combined immunodeficiency due to COPG1 deficiency
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO has scheduled MONDO:0975834 for merger into MONDO:0800136 on the
      grounds that the two terms denote the same concept, so the successor term
      is recorded here as an exact match. MONDO:0975834 was still live and not
      obsolete at the time of curation, and it is the identifier the entry is
      keyed on; if the merge completes, the primary disease_term should be
      repointed to MONDO:0800136.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All five affected siblings in the single reported kindred were homozygous
    for the same COPG1 missense allele, and their parents were consanguineous.
    The entry does not state a recurrence risk figure because the source
    reports the genotypes rather than a counselling estimate.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five siblings with persistent bacterial and viral infections and defective humoral and cellular immunity had a homozygous p.K652E mutation"
    explanation: Homozygosity in five affected siblings of one sibship establishes recessive inheritance of the COPG1 allele.

pathophysiology:
- name: Homozygous COPG1 p.K652E Substitution
  description: >-
    The five affected siblings carry a homozygous p.K652E missense substitution
    in COPG1, which encodes the gamma-1 subunit of the COPI coatomer. This is
    the only COPG1 genotype reported in an immunodeficient patient.
  biological_scale: MOLECULAR
  genetic_context:
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    allele_type: missense substitution
    description: >-
      Homozygous p.K652E in COPG1, shared by all five affected siblings of a
      consanguineous sibship.
  genes:
  - preferred_term: COPG1
    term:
      id: hgnc:2236
      label: COPG1
  downstream:
  - target: Disrupted COPI Binding to the KDEL Receptor
    causal_link_type: DIRECT
    description: >-
      The substitution itself is what abolishes the coat-receptor interaction;
      no intermediate step is reported between genotype and binding defect.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutation disrupts COPI binding to the KDEL receptor"
      explanation: States that the p.K652E allele is the cause of the lost COPI-KDEL receptor interaction.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous p.K652E mutation in the γ1 subunit of COPI (γ1-COP)"
    explanation: Identifies the causal genotype as homozygous p.K652E in the gamma-1 COPI subunit.

- name: Disrupted COPI Binding to the KDEL Receptor
  description: >-
    The mutant coatomer no longer binds the KDEL receptor, the cargo receptor
    that captures ER-resident chaperones escaped to the Golgi. COPI itself is
    the complex that mediates retrograde traffic from Golgi to endoplasmic
    reticulum, so losing the receptor interaction removes the link between coat
    and cargo rather than abolishing the coat.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Retrieval of KDEL-Bearing Chaperones to the ER
    causal_link_type: DIRECT
    description: >-
      Loss of coat-receptor binding is reported in the same sentence as, and as
      the cause of, the failure of chaperone retrieval.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "disrupts COPI binding to the KDEL receptor and impairs the retrieval of KDEL-bearing chaperones from the Golgi to the ER"
      explanation: Directly couples the binding defect to failed chaperone retrieval.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "The coat protein I (COPI) complex mediates retrograde trafficking from the Golgi to the endoplasmic reticulum (ER)."
    explanation: >-
      Establishes what the complex carrying the mutant subunit does. Quoted
      from the paper's framing sentence rather than from its own results, and
      graded OTHER because the sentence states established cell-biological
      background rather than any study's evidence.

- name: Impaired Retrieval of KDEL-Bearing Chaperones to the ER
  description: >-
    KDEL-bearing ER chaperones that have escaped to the Golgi are not returned,
    depleting the ER of the folding capacity it needs when secretory demand
    rises.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    term:
      id: GO:0006890
      label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    modifier: DECREASED
  downstream:
  - target: Endoplasmic Reticulum Stress in Activated Lymphocytes
    causal_link_type: DIRECT
    description: >-
      The knock-in mouse shows that the retrieval defect is expressed as ER
      stress specifically in lymphocytes that have been activated, that is, in
      cells whose secretory load has just increased.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous Copg1K652E mice had increased ER stress in activated T and B cells"
      explanation: Reports increased ER stress in activated lymphocytes of mice carrying the patients' allele.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "impairs the retrieval of KDEL-bearing chaperones from the Golgi to the ER"
    explanation: States the trafficking consequence that defines this node.

- name: Endoplasmic Reticulum Stress in Activated Lymphocytes
  description: >-
    Activated T and B cells accumulate ER stress. This is the point at which a
    housekeeping trafficking defect becomes an immune defect, because it is
    activation, not the resting state, that raises the folding load.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  cell_types:
  - preferred_term: activated T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: activated B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Increased Apoptosis of Activated T Cells
    causal_link_type: DIRECT
    description: >-
      In the knock-in mouse, T cells are present in normal numbers and
      proliferate normally but die on activation, which is the same conditional
      pattern as the ER stress.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "normal numbers of T cells that proliferated normally, but underwent increased apoptosis upon activation"
      explanation: Reports the activation-dependent apoptosis that this edge asserts.
  - target: Poor Antibody Responses
    causal_link_type: DIRECT
    description: >-
      Antibody responses are poor in the same animals in which activated B
      cells carry increased ER stress.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "increased ER stress in activated T and B cells, poor antibody responses"
      explanation: Reports the poor antibody response alongside the B cell ER stress in the same animals.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "increased ER stress in activated T and B cells"
    explanation: Locates the ER stress in activated lymphocytes of both lineages.

- name: Increased Apoptosis of Activated T Cells
  description: >-
    T cells die when activated rather than failing to develop. That distinction
    matters clinically: it predicts preserved or near-preserved resting T cell
    numbers with a functional defect that appears only under demand, which is
    the pattern of a non-severe combined immunodeficiency rather than of SCID.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  cell_types:
  - preferred_term: activated T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Defective Humoral and Cellular Immunity
    causal_link_type: DIRECT
    description: >-
      Loss of activated T cells is the cellular arm of the combined defect
      reported in the patients.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "defective humoral and cellular immunity"
      explanation: Names the cellular arm of the immune defect that this edge feeds.
  - target: Abnormal T cell proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired T cell proliferation is the laboratory reading of the same
      activation-dependent defect. The steps between the two are not
      established: in specific-pathogen-free mutant mice the T cells undergo
      increased apoptosis while proliferating normally, and the proliferation
      defect emerges only after microbial exposure, so the reported data do not
      show apoptosis producing the proliferation failure.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Exposure of the mutants to pet store mice caused weight loss, lymphopenia, and defective T cell proliferation that recapitulated the findings in the patients."
      explanation: Reports the proliferation defect and states that it reproduces the patients' finding.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "underwent increased apoptosis upon activation"
    explanation: States the activation-conditional apoptosis defining this node.

- name: Poor Antibody Responses
  description: >-
    The humoral arm of the defect. In the mouse it is measured as a poor
    antibody response; in the patients it appears as poor specific antibody
    responses.
  biological_scale: ORGANISM
  downstream:
  - target: Defective Humoral and Cellular Immunity
    causal_link_type: DIRECT
    description: >-
      Failure to mount antibody is the humoral arm of the combined defect.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "persistent bacterial and viral infections and defective humoral and cellular immunity"
      explanation: Names the humoral arm of the immune defect that this edge feeds.
  - target: Impaired specific antibody response
    causal_link_type: DIRECT
    description: >-
      The patients' poor specific antibody responses are the clinical
      expression of this node.
    evidence:
    - reference: PMID:41676145
      reference_title: Expanding the clinical and immunological phenotypes of COPB1 deficiency.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunological characteristics include severe CD4+ lymphopenia, poor specific antibody responses, and impaired T-cell proliferation"
      explanation: >-
        States the patients' poor specific antibody responses. Quoted from the
        introduction of a COPB1 report, where it restates the published COPG1
        clinical findings rather than presenting that paper's own results.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous Copg1K652E mice had increased ER stress in activated T and B cells, poor antibody responses"
    explanation: Reports the impaired antibody response in the knock-in mouse.

- name: Defective Humoral and Cellular Immunity
  description: >-
    The combined immune defect as it presents clinically: both the antibody and
    the T cell arms are affected, which is what makes this a combined rather
    than a predominantly antibody deficiency.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent bacterial infections
    causal_link_type: DIRECT
    description: Failure of both immune arms permits persistent bacterial infection.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five siblings with persistent bacterial and viral infections and defective humoral and cellular immunity"
      explanation: Reports persistent bacterial infection alongside the combined immune defect in the same patients.
  - target: Recurrent viral infections
    causal_link_type: DIRECT
    description: Failure of cellular immunity permits persistent viral infection.
    evidence:
    - reference: PMID:33529166
      reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "persistent bacterial and viral infections and defective humoral and cellular immunity"
      explanation: Reports persistent viral infection alongside the combined immune defect in the same patients.
  - target: Recurrent lower respiratory tract infections
    causal_link_type: DIRECT
    description: >-
      The lung is the dominant site of infection in the reported patients, who
      presented with recurrent pulmonary infection.
    evidence:
    - reference: PMID:41676145
      reference_title: Expanding the clinical and immunological phenotypes of COPB1 deficiency.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with COPG1 deficiency present with recurrent pulmonary infections, failure to thrive, and susceptibility to persistent EBV and CMV viremia"
      explanation: >-
        States the presenting infection pattern. Quoted from the introduction
        of a COPB1 report restating the published COPG1 findings.
  - target: Persistent CMV viremia
    causal_link_type: DIRECT
    description: Failure to clear CMV is a specific expression of the cellular defect.
    evidence:
    - reference: PMID:41676145
      reference_title: Expanding the clinical and immunological phenotypes of COPB1 deficiency.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "susceptibility to persistent EBV and CMV viremia"
      explanation: Names persistent CMV viremia among the reported COPG1 patient findings.
  - target: Persistent EBV viremia
    causal_link_type: DIRECT
    description: Failure to control EBV is a specific expression of the cellular defect.
    evidence:
    - reference: PMID:41676145
      reference_title: Expanding the clinical and immunological phenotypes of COPB1 deficiency.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "susceptibility to persistent EBV and CMV viremia"
      explanation: Names persistent EBV viremia among the reported COPG1 patient findings.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth failure accompanies the infection burden in the reported patients.
      The source lists it beside the infections without establishing the
      mechanism, so the intermediate steps are not recorded here.
    evidence:
    - reference: PMID:41676145
      reference_title: Expanding the clinical and immunological phenotypes of COPB1 deficiency.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "recurrent pulmonary infections, failure to thrive, and susceptibility to persistent EBV and CMV viremia"
      explanation: Lists failure to thrive among the reported COPG1 patient findings.
  - target: Decreased total CD4+ T cell count
    causal_link_type: DIRECT
    description: >-
      Severe CD4+ lymphopenia is the quantitative laboratory correlate of the
      cellular arm of the defect in the reported patients.
    evidence:
    - reference: PMID:41676145
      reference_title: Expanding the clinical and immunological phenotypes of COPB1 deficiency.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunological characteristics include severe CD4+ lymphopenia"
      explanation: States the CD4+ lymphopenia reported in the COPG1 patients.
  evidence:
  - reference: PMID:33529166
    reference_title: "Combined immunodeficiency due to a mutation in the γ1 subunit of the coat protein I complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "defective humoral and cellular immunity"
    explanation: States the combined nature of the immune defect in the patients.


  downstream:
  - target: Impaired Learning and Memory
    causal_link_type: DIRECT
    description: >-
      Hippocampal and cortical plasticity is the cellular substrate of learning,
      so a developmental plasticity deficit presents as a cognitive deficit.
- name: Impaired Learning and Memory
  description: >-
    The organism-level convergence point of the chain: degraded acquisition and
    retention, which in MRD6 presents as static, non-degenerative intellectual
    disability with prominent language impairment rather than as progressive
    cognitive loss.

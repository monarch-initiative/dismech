      supports: SUPPORT
      evidence_source: OTHER
      snippet: "various GluN2B mutants interfere with neuronal differentiation, dendrite morphogenesis, synaptogenesis, and synaptic plasticity"
      explanation: >-
        Places synaptic plasticity among the processes disrupted downstream of
        the GluN2B lesion, which is the claim this edge makes.
- name: Impaired Neuronal Differentiation
  description: >-
    Loss of the NMDA-receptor calcium signal shifts the developmental program of
    the neuron: transcriptional profiling of GRIN2B-null and patient-variant human
    cells shows genes of cell proliferation up and genes of neuron differentiation
    down. This progenitor-stage arm is what distinguishes the MRD6 mechanism from
    a purely synaptic account of the disorder.

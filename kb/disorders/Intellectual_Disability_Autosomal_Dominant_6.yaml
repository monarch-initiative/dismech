name: Intellectual Disability, Autosomal Dominant 6
creation_date: "2026-09-04T20:55:00Z"
category: Mendelian
synonyms:
- MRD6
- intellectual developmental disorder, autosomal dominant 6, with or without seizures
- mental retardation, autosomal dominant 6
- mental retardation, autosomal dominant 6, with or without seizures
- GRIN2B autosomal dominant non-syndromic intellectual disability
description: >-
  Intellectual disability, autosomal dominant 6 (MRD6; OMIM 613970) is a rare
  neurodevelopmental disorder caused by heterozygous, almost always de novo,
  variants in GRIN2B, which encodes the GluN2B subunit of the
  N-methyl-D-aspartate (NMDA) glutamate receptor. MRD6 is the
  non-encephalopathic arm of the GRIN2B allelic series: developmental delay and
  intellectual disability of variable severity, characteristically with a
  hyperactive, inattentive, stereotypy-prone behavioral profile, language
  impairment and hypotonia, with or without seizures — but without the severe
  early-onset epileptic encephalopathy that defines the allelic sibling entity
  GRIN2B-related developmental and epileptic encephalopathy (DEE27, OMIM
  616139, MONDO:0014505). The mechanistic center of gravity of MRD6 is NMDA
  receptor hypofunction: deletions, truncating variants and loss-of-function
  missense variants reduce the pool of functional GluN2B-containing receptors,
  lowering NMDA-receptor-mediated calcium entry in the developing forebrain
  during the window in which GluN2B is the dominant NR2 subunit. The resulting
  deficits in neuronal differentiation, dendrite morphogenesis and
  activity-dependent synaptic plasticity are the substrate of the cognitive
  phenotype. This directional leaning is what separates MRD6 from its
  epileptogenic sibling, where gain-of-function variants are enriched, and it
  sets the opposite therapeutic direction — receptor-potentiating strategies
  rather than receptor blockade.

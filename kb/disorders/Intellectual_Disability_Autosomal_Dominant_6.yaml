      label: neuron differentiation
    modifier: DECREASED
  - preferred_term: dendrite morphogenesis
    term:
      id: GO:0048813
      label: dendrite morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29937144
    reference_title: "Disruption of GRIN2B Impairs Differentiation in Human Neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcriptome analysis revealed extensive increases in genes associated with cell proliferation and decreases in genes associated with neuron differentiation"
    explanation: >-
      Direct transcriptomic measurement of the differentiation deficit in human
      cells carrying GRIN2B deletion and loss-of-function variants.
  - reference: PMID:36704660
    reference_title: "GRIN2B-related neurodevelopmental disorder: current understanding of pathophysiological mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These data provide compelling evidence that various GluN2B mutants interfere with neuronal differentiation, dendrite morphogenesis, synaptogenesis, and synaptic plasticity."
    explanation: >-
      A mechanism review synthesizing the differentiation and dendrite arms
      across multiple disease-associated GluN2B variants.
  downstream:
  - target: Impaired Activity-Dependent Synaptic Plasticity
    causal_link_type: DIRECT
    description: >-
      Neurons that differentiate abnormally and elaborate abnormal dendritic
      arbors present a degraded substrate for activity-dependent plasticity.
- name: Impaired Activity-Dependent Synaptic Plasticity
  description: >-
    Degraded activity-dependent modification of synaptic strength, evidenced in
    GRIN2B haploinsufficiency as impaired hippocampal long-term potentiation.
    Because the lesion is present throughout development, the deficit is built
    into the circuit as it forms rather than imposed on a mature one.
  role: effector
  biological_scale: CELLULAR
  conforms_to: "nmda_receptor_hypofunction#Impaired Activity-Dependent Synaptic Plasticity"

animal_models:
- name: Grin2b heterozygous null mouse
  species: Mouse
  genotype: Grin2b+/- (constitutive heterozygous null)
  publication: PMID:40024627
  description: >-
    A constitutive heterozygous Grin2b null mouse, the genetic counterpart of the
    haploinsufficiency mechanism that causes MRD6 through deletions and truncating
    variants. It is the model in which the plasticity deficit and its
    pharmacological rescue were demonstrated.
  modeled_mechanisms:
  - target: Impaired Activity-Dependent Synaptic Plasticity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The heterozygous null reproduces the hippocampal long-term potentiation
      deficit expected from reduced GluN2B dosage, and the deficit is partially
      reversed by a receptor-potentiating agent.
    limitations: >-
      A constitutive whole-gene null models the deletion and truncating alleles
      but not the loss-of-function missense alleles, which may act through
      dominant-negative co-assembly rather than dosage alone. Mouse cognitive
      readouts are behavioral proxies for human intellectual disability, and the
      developmental timing of the GluN2B-to-GluN2A subunit switch differs between
      species.
    readouts:
    - name: Hippocampal long-term potentiation in slices
      target: Impaired Activity-Dependent Synaptic Plasticity
      direction: RESTORED
      interpretation: >-
        LTP was deficient in Grin2b+/- slices and partially restored by chronic
        spermidine, which is the rescue arm of the plasticity claim.
      evidence:
      - reference: PMID:40024627
        reference_title: "Spermidine Treatment Improves GRIN2B Loss-Of-Function, A Primary Disorder of Glutamatergic Neurotransmission."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Chronic spermidine administration in young adult Grin2b+/- mice partially rescued hippocampal long-term potentiation deficits in hippocampal slices of Grin2b+/- mice"
        explanation: >-
          Reports the LTP measurement and its partial restoration in the
          haploinsufficient mouse.
    evidence:
    - reference: PMID:40024627
      reference_title: "Spermidine Treatment Improves GRIN2B Loss-Of-Function, A Primary Disorder of Glutamatergic Neurotransmission."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a GRIN2B-LoF genetic murine model recapitulating GRD-like synaptic, motor, and cognitive alterations"
      explanation: >-
        Supports treating the heterozygous null as informative for the synaptic
        and cognitive nodes of this entry.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis rests on identifying a heterozygous pathogenic GRIN2B variant or an
    exon or whole-gene deletion, in practice through trio exome or genome
    sequencing or a neurodevelopmental gene panel. Chromosomal microarray remains
    necessary to detect the deletion class, which sequence analysis alone can
    miss. Establishing that the variant is de novo supports pathogenicity.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29851452
    reference_title: "GRIN2B-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identification of either a heterozygous pathogenic variant or exon or whole-gene deletion of GRIN2B on molecular genetic testing."
    explanation: >-
      Defines the molecular diagnostic criteria, including the deletion class
      that requires copy-number-aware testing.
differential_diagnoses:
- name: GRIN2B-related developmental and epileptic encephalopathy (DEE27)
  disease_term:
    preferred_term: developmental and epileptic encephalopathy, 27
    term:
      id: MONDO:0014505
      label: developmental and epileptic encephalopathy, 27
  description: >-
    The allelic sibling entity at the same locus, and the single most important
    differential. Both are caused by heterozygous de novo GRIN2B variants and
    both feature developmental delay and intellectual disability, so the gene
    result does not discriminate them: only the clinical presentation and, where
    available, the functional class of the variant do. The two are poles of one
    allelic series rather than disjoint diseases, and intermediate presentations
    exist.
  distinguishing_features:
  - Defined by severe early-onset epileptic encephalopathy, in which frequent seizures and epileptiform activity themselves drive developmental impairment; MRD6 is named "with or without seizures" and lacks the encephalopathic course.
  - Enriched for gain-of-function variants, which are more likely to cause epilepsy and microcephaly, whereas MRD6 leans loss-of-function (deletions, truncating and hypomorphic missense alleles).
  - Gain-of-function variants cluster in the transmembrane domains, giving a structural correlate that partially predicts which arm a novel missense variant belongs to.
  - "Opposite mechanism-directed therapy: NMDA-receptor channel blockade (memantine, radiprodil) for the gain-of-function pole, receptor-potentiating strategies for the loss-of-function pole."
  evidence:
  - reference: PMID:41146259
    reference_title: "GRIN2B-related neurodevelopmental disorders: genotype-phenotype correlations and therapeutic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GOF variants were more likely to cause epilepsy and microcephaly than LOF variants."
    explanation: >-
      The variant-class comparison that separates the epileptic pole from the
      MRD6 pole.
  - reference: PMID:41146259
    reference_title: "GRIN2B-related neurodevelopmental disorders: genotype-phenotype correlations and therapeutic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants located in the transmembrane domain predominantly resulted in a GOF effect."
    explanation: >-
      Supports the structural correlate in the third distinguishing feature:
      transmembrane-domain location predicts the gain-of-function pole.
  - reference: PMID:28533163
    reference_title: "GRIN2B gain of function mutations are sensitive to radiprodil, a negative allosteric modulator of GluN2B-containing NMDA receptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The potency of radiprodil to block glutamate-evoked currents was not affected in any of the variants, while the effects by non-selective NMDA inhibitors were greatly reduced in some of the variants."
    explanation: >-
      Supports the fourth distinguishing feature, that receptor blockade is the
      gain-of-function pole's mechanism-directed therapy: the GluN2B-selective
      blocker retains potency against gain-of-function variants where
      non-selective antagonists lose it.
- name: Other GRIN-related neurodevelopmental disorders (GRIN1, GRIN2A, GRIN2D)
  description: >-
    Disorders of the other NMDA-receptor subunit genes produce overlapping
    developmental delay, intellectual disability and epilepsy phenotypes and are
    typically on the same diagnostic gene panel. They are separated by the gene
    result rather than clinically, which is why panel or exome testing rather
    than single-gene testing is the appropriate diagnostic route.
  distinguishing_features:
  - Distinguished by the causal gene on sequencing, not by clinical features.
  - GRIN2A disease is more strongly associated with epilepsy-aphasia spectrum presentations.
  evidence:
  - reference: PMID:20890276
    reference_title: "Mutations in GRIN2A and GRIN2B encoding regulatory subunits of NMDA receptors cause variable neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Either GRIN2B or GRIN2A, encoding the NMDA receptor subunits NR2B and NR2A, was found to be disrupted by chromosome translocation breakpoints in individuals with mental retardation and/or epilepsy."
    explanation: >-
      Both subunit genes produce overlapping intellectual-disability and epilepsy
      presentations, which is what makes them a differential for one another.
treatments:
- name: Developmental and Supportive Therapy
  description: >-
    Management is symptomatic and multidisciplinary: early intervention, physical
    and occupational therapy, speech and language therapy, feeding support where
    hypotonia causes difficulty, and behavioral intervention for the hyperactive,
    inattentive profile. No disease-modifying therapy is approved.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29851452
    reference_title: "GRIN2B-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DD/ID, muscle tone abnormalities (spasticity, hypotonia, and feeding difficulties), epilepsy, ASD/behavioral issues, movement disorders, and/or cortical visual impairment are treated as per standard practice."
    explanation: >-
      Establishes symptomatic, standard-practice management as the basis of care.
- name: Spermidine Supplementation
  description: >-
    An investigational mechanism-directed therapy aimed specifically at the
    loss-of-function arm. Spermidine is the precursor of spermine, a natural
    polyamine that acts as a positive allosteric modulator of GluN2B-containing
    NMDA receptors, so the strategy is to potentiate hypofunctional receptors
    rather than block them. Preclinical support comes from the haploinsufficient
    mouse; human experience is limited to two pediatric patients with mild
    loss-of-function variants followed for 18 months, so this is an early signal
    and not established therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: spermidine
      term:
        id: CHEBI:16610
        label: spermidine
  target_mechanisms:
  - target: GluN2B-Containing NMDA Receptor Hypofunction
    treatment_effect: RESTORES
    description: >-
      Polyamine positive allosteric modulation raises the deficient
      NMDAR-mediated current of loss-of-function receptors.
  evidence:

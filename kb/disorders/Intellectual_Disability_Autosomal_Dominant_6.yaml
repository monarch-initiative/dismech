inheritance:
- name: Autosomal dominant
  description: >-
    MRD6 is inherited in an autosomal dominant manner, but is in practice a
    sporadic disorder: essentially every molecularly confirmed proband whose
    parents have been tested carries a de novo GRIN2B variant or deletion, so
    affected individuals are typically simplex cases with unaffected parents.
    Residual recurrence risk to sibs reflects the possibility of parental
    germline mosaicism.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29851452
    reference_title: "GRIN2B-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All probands reported to date with a GRIN2B-related neurodevelopmental disorder whose parents have undergone molecular genetic testing have the disorder as a result of a de novo GRIN2B pathogenic variant or deletion."
    explanation: >-
      Establishes the de novo, autosomal dominant origin for the GRIN2B series
      that MRD6 belongs to.
  - reference: PMID:20890276
    reference_title: "Mutations in GRIN2A and GRIN2B encoding regulatory subunits of NMDA receptors cause variable neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of GRIN2B in 468 individuals with mental retardation revealed four de novo mutations: a frameshift, a missense and two splice-site mutations."
    explanation: >-
      The founding study identified the causal variants as de novo in an
      intellectual-disability cohort, which is the MRD6 ascertainment setting.
pathophysiology:
- name: GRIN2B Haploinsufficiency and Loss-of-Function Variation
  description: >-
    The initiating lesion is a heterozygous, typically de novo GRIN2B variant
    that reduces the amount or the function of the GluN2B subunit: whole-gene and
    exonic 12p13.1 deletions, frameshift, nonsense and splice-site variants
    acting through haploinsufficiency, and missense variants in the
    ligand-binding and transmembrane domains that reduce surface expression,
    agonist potency or channel open probability. This loss-of-function-leaning
    allelic class is the one enriched in the ID-without-encephalopathy
    presentation that defines MRD6.
  role: trigger
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: GRIN2B
      term:
        id: hgnc:4586
        label: GRIN2B
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Applies to the deletion, truncating and loss-of-function missense alleles
      that dominate the MRD6 presentation. GRIN2B is allelic for a
      gain-of-function class as well; those variants are enriched in the
      epileptic-encephalopathy sibling entity, so this entry does not claim a
      single functional mechanism across the whole GRIN2B allelic spectrum.
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:29937144
    reference_title: "Disruption of GRIN2B Impairs Differentiation in Human Neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterozygous loss-of-function mutations in GRIN2B, a subunit of the NMDA receptor, cause intellectual disability and language impairment."
    explanation: >-
      States the loss-of-function heterozygous lesion and the two core MRD6
      manifestations it causes.
  - reference: PMID:23918416
    reference_title: "Interstitial 12p13.1 deletion involving GRIN2B in three patients with intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Array-CGH studies revealed overlapping interstitial 12p13.1 microdeletions encompassing all or part of GRIN2B."
    explanation: >-
      Documents whole- or partial-gene deletion as a route to the lesion, the
      purest available form of GRIN2B haploinsufficiency.
  downstream:
  - target: GluN2B-Containing NMDA Receptor Hypofunction
    causal_link_type: DIRECT
    description: >-
      Reduced GluN2B dosage or function lowers the pool of functional
      GluN2B-containing NMDA receptors available at developing synapses.
    evidence:
    - reference: PMID:35741674
      reference_title: "Synaptic Dysfunction by Mutations in GRIN2B: Influence of Triheteromeric NMDA Receptors on Gain-of-Function and Loss-of-Function Mutant Classification"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In the absence of both native GluN2A and GluN2B subunits, functional incorporation into synaptic NMDA receptors was attenuated for GoF mutants, or almost eliminated for LoF GluN2B mutants."
      explanation: >-
        Measures the step directly: loss-of-function GluN2B mutants are nearly
        excluded from synaptic receptors, which is how the variant depletes the
        functional receptor pool.
- name: GluN2B-Containing NMDA Receptor Hypofunction
  description: >-
    Reduced NMDA-receptor channel activity at developing glutamatergic synapses,
    the functional state the loss-of-function allelic classes converge on. GluN2B
    is the dominant NR2 subunit of the prenatal and early postnatal forebrain, so
    the deficit falls in the window before the developmental GluN2B-to-GluN2A
    subunit switch, when the receptor pool cannot be compensated by the mature
    subunit.
  role: amplifier
  biological_scale: MOLECULAR
  conforms_to: "nmda_receptor_hypofunction#NMDA Receptor Hypofunction"
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron

    be sourced. A modelled birth-incidence estimate for de novo GRIN2B disorder
    (~5.91 per 100,000 live births) is often quoted from the López-Rivera 2020
    incidence catalogue, but that per-gene number lives in a supplementary table
    and does not appear in the retrievable text of PMID:32168371, so it is
    deliberately not asserted here. The two records below are diagnostic yields
    within ascertained clinical cohorts, not population rates, and must not be
    read as such.

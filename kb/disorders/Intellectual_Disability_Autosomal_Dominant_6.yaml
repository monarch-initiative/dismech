      evidence_source: OTHER
      snippet: "all mutants interfered with calcium influx through NMDARs"
      explanation: >-
        The review attributes the differentiation deficit to interference with
        NMDAR calcium influx shared across the variant panel.
  - target: Impaired Activity-Dependent Synaptic Plasticity
    causal_link_type: DIRECT
    description: >-
      The calcium transient is the trigger for the calcium-dependent cascades that
      implement activity-dependent changes in synaptic strength. Note this edge
      short-cuts the BDNF intermediate that the nmda_receptor_hypofunction module
      places between these two nodes; that step is not reproduced here because no
      GRIN2B-specific evidence for it was verified.
    evidence:
    - reference: PMID:36704660

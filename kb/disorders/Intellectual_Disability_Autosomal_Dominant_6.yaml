    reference_title: "Disruption of GRIN2B Impairs Differentiation in Human Neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that NMDA receptors are present on neural progenitor cells and that human mutations in GRIN2B can impair calcium influx and membrane depolarization even in a presumed undifferentiated cell state, highlighting an important role for non-synaptic NMDA receptors"
    explanation: >-
      Establishes the reduced-calcium node in human cells and locates it earlier
      in development than the synapse, which is the GRIN2B-specific feature of
      this node.
  downstream:
  - target: Impaired Neuronal Differentiation and Dendrite Morphogenesis
    causal_link_type: DIRECT
    description: >-
      NMDA-receptor-dependent calcium signalling in progenitors and immature
      neurons drives the transition out of proliferation and into differentiation.
    evidence:
    - reference: PMID:36704660
      reference_title: "GRIN2B-related neurodevelopmental disorder: current understanding of pathophysiological mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "all mutants interfered with calcium influx through NMDARs"
      explanation: >-
        The review attributes the differentiation deficit to interference with
        NMDAR calcium influx shared across the variant panel.
  - target: Impaired Activity-Dependent Synaptic Plasticity
    causal_link_type: DIRECT
    description: >-
      The calcium transient is the trigger for the calcium-dependent cascades that
      implement activity-dependent changes in synaptic strength.
- name: Impaired Neuronal Differentiation and Dendrite Morphogenesis
  description: >-
    Loss of the NMDA-receptor calcium signal shifts the developmental program of
    the neuron: transcriptional profiling of GRIN2B-null and patient-variant human
    cells shows genes of cell proliferation up and genes of neuron differentiation
    down, with dendrite and synapse formation impaired downstream. This
    progenitor-stage arm is the node that distinguishes the MRD6 mechanism from a
    purely synaptic account of the disorder.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:

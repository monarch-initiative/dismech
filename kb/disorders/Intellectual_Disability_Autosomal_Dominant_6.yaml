genetic:
- name: GRIN2B
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: GRIN2B
    term:
      id: hgnc:4586
      label: GRIN2B
  notes: >-
    GRIN2B (12p13.1) encodes the GluN2B subunit of the NMDA receptor. In MRD6 the
    causal alleles are heterozygous and typically de novo, and the mechanism
    leans loss-of-function: exonic and whole-gene deletions and truncating
    variants act through haploinsufficiency, while missense variants in the
    ligand-binding and transmembrane domains reduce surface expression, agonist
    potency or open probability. Gain-of-function missense alleles at the same
    locus are enriched in the allelic epileptic-encephalopathy entity rather than
    in MRD6. Variant-level functional classification is not available for most
    reported variants, so this entry records the functional impact at the
    allelic-class level rather than asserting it variant by variant.
  evidence:
  - reference: PMID:20890276
    reference_title: "Mutations in GRIN2A and GRIN2B encoding regulatory subunits of NMDA receptors cause variable neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of GRIN2B in 468 individuals with mental retardation revealed four de novo mutations: a frameshift, a missense and two splice-site mutations."
    explanation: >-
      The founding gene-discovery study, performed in an intellectual-disability
      cohort, establishing de novo GRIN2B variants as causal.
  - reference: PMID:41146259
    reference_title: "GRIN2B-related neurodevelopmental disorders: genotype-phenotype correlations and therapeutic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants located in the transmembrane domain predominantly resulted in a GOF effect."
    explanation: >-
      Locates the gain-of-function class structurally, which is the basis for
      treating the loss-of-function class as the MRD6-predominant one.

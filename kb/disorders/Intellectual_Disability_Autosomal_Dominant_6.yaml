    snippet: "GOF variants were more likely to cause epilepsy and microcephaly than LOF variants."
    explanation: >-
      Establishes that epilepsy is enriched in the gain-of-function class rather
      than the loss-of-function class that predominates in MRD6, which is why
      seizures are a variable rather than defining feature here.

notes: >-
  Scope and lump/split rationale. Much of the recent literature uses the single
  lumping label "GRIN2B-related neurodevelopmental disorder" for the whole
  allelic series, and the MRD6/DEE27 boundary is a spectrum rather than a clean
  partition — many individuals sit between the poles. This entry is nonetheless
  curated as a distinct disease rather than folded into the DEE sibling as a
  subtype, because the two arms are separable on four axes that a subtype record
  could not carry: distinct MONDO terms (MONDO:0013509 vs MONDO:0014505) and
  distinct OMIM phenotype numbers (613970 vs 616139); a distinct clinical
  presentation (ID with variable seizures, without epileptic encephalopathy); a
  directional mechanistic leaning documented by variant-class comparison, where
  gain-of-function variants are more likely to cause epilepsy and microcephaly
  than loss-of-function variants; and an opposite mechanism-directed therapeutic
  direction (receptor potentiation rather than channel blockade). The
  differential_diagnoses block states the boundary explicitly, and the
  grin2b_lof_gof_arm_separability discussion records that the separability itself
  is a recent and still-open claim rather than settled nosology.

  Module conformance is deliberately partial. Four nodes conform to
  nmda_receptor_hypofunction, which the module's own notes sanction ("Conformance
  may be partial"). The module's BDNF arm ("Reduced BDNF Expression and
  Secretion") is not reproduced here: it is evidenced for the toxicant conformers,
  and no GRIN2B-specific evidence for that step was verified during this curation,
  so the chain runs from the calcium node directly to plasticity rather than
  asserting an unsourced intermediate. The trigger node likewise does not declare
  conformance: the module's trigger node describes exogenous routes (toxicant
  antagonism, autoantibody-mediated receptor internalization), whereas the lesion
  here is a germline genetic one, and stretching that node to cover it would
  overstate what the module asserts.

  Where `frequency` is and is not assigned. Frequencies come from series that
  pool both poles of the GRIN2B allelic spectrum, so the question for each
  phenotype is whether the pooled figure transfers to this arm. Developmental
  delay/intellectual disability is set VERY_FREQUENT on the strength of sources
  reporting it in *all* affected individuals, which is pole-independent.
  Hypotonia and language impairment take the pooled figures because no source
  consulted reports them as differing by variant functional class. Seizures
  deliberately carry no `frequency`, because the same comparison that supports
  this entry's existence reports epilepsy as *more likely* in gain-of-function
  than in loss-of-function variants, so the pooled 53% is known not to transfer.
  The rule is "use the pooled figure unless a source shows the feature varies by
  functional class", not an inconsistency between phenotypes.

  Microcephaly and malformation of cortical development are deliberately not
  curated as MRD6 phenotypes. Both are reported in the broader GRIN2B series,
  but microcephaly is one of the two features explicitly reported as enriched in
  the gain-of-function class, and the cortical malformation is described in the
  cohort that defined the encephalopathy end of the spectrum. Asserting either
  as a feature of the loss-of-function arm would import the sibling entity's
  phenotype on a pooled denominator.

  On the "opposite therapeutic direction" axis. The split is real at the level of
  which mechanism a drug is aimed at, but it is not a clean partition of drugs
  across the two entries: the DEE27 sibling carries both the receptor-blocking
  arm and L-serine, because that entry spans both functional classes. What
  selects therapy is the variant's functional class, not the MRD6-versus-DEE27
  label, and a diagnosis of MRD6 does not by itself establish that class.
  Memantine and radiprodil are therefore left to the sibling and to the
  differential-diagnosis block rather than curated as MRD6 treatments: blocking
  an already-hypofunctional receptor is the wrong direction for the arm this
  entry describes.

  Several phenotypes are not wired into the pathograph. Hypotonia, spasticity,
  movement disorder, cerebral visual impairment, feeding difficulties and facial
  dysmorphism carry evidence but no incoming causal edge, because no source
  consulted here places them on a specific chain from the receptor lesion. An
  unconnected phenotype is honest; a fabricated edge is not.

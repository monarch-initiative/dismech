    term:
      id: GO:0004972
      label: NMDA glutamate receptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40024627
    reference_title: "Spermidine Treatment Improves GRIN2B Loss-Of-Function, A Primary Disorder of Glutamatergic Neurotransmission."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "administration of spermine potentiated wild-type and loss-of-function (LoF) NMDAR-mediated currents and attenuated synaptic density deficits"
    explanation: >-
      A positive allosteric modulator raises the deficient loss-of-function
      NMDAR current, which is a pharmacological demonstration that the receptor
      state in this allelic class is hypofunctional.
  downstream:
  - target: Reduced NMDA Receptor-Mediated Calcium Influx
    causal_link_type: DIRECT
    description: >-
      The NMDA receptor is the principal activity-gated calcium-permeable channel
      at the excitatory synapse, so reduced channel activity translates into
      reduced calcium entry.
    evidence:
    - reference: PMID:29937144
      reference_title: "Disruption of GRIN2B Impairs Differentiation in Human Neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "human mutations in GRIN2B can impair calcium influx and membrane depolarization even in a presumed undifferentiated cell state"
      explanation: >-
        Directly measures reduced calcium influx as the consequence of the
        GRIN2B lesion in human cells.
- name: Reduced NMDA Receptor-Mediated Calcium Influx
  description: >-
    Loss of GluN2B-containing receptor conductance removes the coincidence-detected
    calcium transient that couples synaptic and extrasynaptic activity to the
    calcium-dependent signalling machinery of the developing neuron. In GRIN2B
    disease this calcium deficit is not confined to the mature synapse: NMDA
    receptors are present on neural progenitor cells, so the signal is already
    degraded in cells that have not yet differentiated.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "nmda_receptor_hypofunction#Reduced NMDA Receptor-Mediated Calcium Influx"
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron

- name: L-Serine Supplementation
  description: >-
    The other receptor-potentiating strategy for the loss-of-function arm, and
    the one with the most human data. L-serine is the precursor of D-serine and
    glycine, the NMDA-receptor co-agonists, so supplying it aims to raise the
    occupancy of hypofunctional receptors. A phase 2A open-label trial in
    children with GRIN loss-of-function variants (NCT04646447) reported
    improvement across adaptive-behavior, motor and quality-of-life measures.
    The trial was single-arm and enrolled GRIN1 and GRIN2A alongside GRIN2B
    variants, so the GRIN2B-specific and placebo-controlled effect is not
    established.

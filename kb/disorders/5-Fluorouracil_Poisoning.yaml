genetic:
- name: DPYD
  notes: >-
    Loss-of-function and reduced-function DPYD variants lower DPD activity and are
    the principal pharmacogenomic risk factor for severe fluoropyrimidine
    toxicity. CPIC identifies four decreased-function variants of primary
    relevance (c.1905+1G>A/DPYD*2A, c.1679T>G, c.2846A>T, and the HapB3 intronic
    variant).
  relationship_type: RISK_FACTOR

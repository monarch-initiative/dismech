    snippet: "found to have hyperammonemia (84 mcmol/L), without hepatic failure"
    explanation: The absence of hepatic failure distinguishes 5-FU encephalopathy from hepatic causes.
- name: Acute coronary syndrome
  description: >-
    5-FU cardiotoxicity most often presents as myocardial ischaemia and can mimic a
    primary acute coronary syndrome.
  distinguishing_features:
  - 5-FU cardiotoxicity is temporally linked to the infusion and is typically vasospastic, often resolving on drug cessation, rather than fixed obstructive coronary disease.
  disease_term:
    preferred_term: acute coronary syndrome
    term:
      id: MONDO:0005542
      label: acute coronary syndrome
  evidence:
  - reference: PMID:25186061
    reference_title: "A systematic review of the pathophysiology of 5-fluorouracil-induced cardiotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A severe side effect to 5-FU and capecitabine-based treatment is cardiotoxicity, which often presents as myocardial ischemia, but to a lesser extent cardiac arrhythmias, hyper- and hypotension, left ventricular dysfunction, cardiac arrest and sudden death"
    explanation: Establishes that 5-FU cardiotoxicity presents as myocardial ischaemia, the overlap with acute coronary syndrome.

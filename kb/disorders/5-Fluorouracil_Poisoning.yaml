  evidence:
  - reference: PMID:32082663
    reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she later developed encephalopathy during day three of cycle five. During her evaluation, she was found to have hyperammonemia (84 mcmol/L), without hepatic failure"
    explanation: Documents 5-FU-associated hyperammonaemic encephalopathy without hepatic failure.
- name: Cerebellar ataxia
  description: Acute cerebellar syndrome with gait and limb ataxia, part of the central neurotoxicity of 5-FU.
  phenotype_term:
    preferred_term: Cerebellar ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:36160401

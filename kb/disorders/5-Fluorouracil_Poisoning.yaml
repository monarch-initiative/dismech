name: 5-Fluorouracil Poisoning
creation_date: "2026-10-05T00:00:00Z"
category: Complex
categories:
- Treatment Toxicity
- Toxic Exposure Disorder
parents:
- Drug Toxicity
- Poisoning
synonyms:
- 5-FU poisoning
- 5-FU toxicity
- fluorouracil toxicity
- fluoropyrimidine toxicity
- 5-fluorouracil overdose
- capecitabine toxicity
description: >-
  5-Fluorouracil poisoning is the systemic toxicity syndrome produced by excess
  exposure to the antimetabolite chemotherapeutic 5-fluorouracil (5-FU) or its
  oral prodrug capecitabine. Excess exposure arises in two broad settings:
  accidental overdose (most often an infusion-pump programming error delivering a
  multi-day dose in hours) and, at standard doses, deficient activity of
  dihydropyrimidine dehydrogenase (DPD, encoded by DPYD), the rate-limiting
  catabolic enzyme that clears the great majority of administered drug. 5-FU is a
  uracil analogue that is anabolically activated to cytotoxic nucleotides. FdUMP
  forms a stable ternary complex with thymidylate synthase and the folate
  cofactor, arresting de novo thymidylate synthesis and causing "thymineless"
  DNA damage; fluoronucleotides are also misincorporated into DNA and into RNA.
  The tissues with the highest proliferative turnover fail first, producing
  mucositis, diarrhoea and myelosuppression, while non-proliferative toxicities -
  cardiotoxicity (most often myocardial ischaemia), a cerebellar/encephalopathic
  neurotoxicity, and hyperammonaemia - are attributed to the drug and its
  catabolites. A specific antidote, uridine triacetate, floods the pathway with
  uridine and markedly improves survival when given within about 96 hours of
  overexposure. Pre-treatment DPYD genotyping and phenotyping identify patients at
  risk and are the principal preventive measure. No GeneReviews or StatPearls
  chapter indexes this entity; it is curated from pharmacogenetic guidelines,
  clinical reviews and case reports.
disease_term:
  preferred_term: 5-fluorouracil poisoning
  term:
    id: MONDO:0016312
    label: 5-fluorouracil poisoning
pathophysiology:
- name: Systemic 5-Fluorouracil Overexposure
  description: >-
    Excess circulating 5-FU accumulates either from an absolute overdose
    (classically an ambulatory-infusion-pump error compressing a multi-day dose
    into hours) or from a standard dose in a patient whose catabolic clearance is
    impaired. 5-FU and its oral prodrug capecitabine both converge on the same
    circulating active drug.
  biological_scale: ORGANISM
  downstream:
  - target: Anabolic Activation to Cytotoxic Nucleotides
    causal_link_type: DIRECT
  - target: Myocardial Toxicity
    causal_link_type: DIRECT
    description: >-
      The administered drug and its fluorinated catabolites drive the cardiac arm
      of the non-proliferative toxicity.
  - target: Central Neurotoxicity
    causal_link_type: DIRECT
    description: >-
      The administered drug and its fluorinated catabolites drive the neurologic
      arm of the non-proliferative toxicity.
- name: Deficient DPD-Mediated Catabolism
  description: >-
    Dihydropyrimidine dehydrogenase (DPD) is the initial and rate-limiting enzyme
    of pyrimidine catabolism and clears the large majority of administered 5-FU to
    inactive dihydrofluorouracil. Partial or complete DPD deficiency, usually from
    DPYD variants, markedly raises and prolongs 5-FU exposure so that a standard
    dose behaves as an overdose and shunts more drug into the anabolic pathway.
  biological_scale: MOLECULAR
  downstream:
  - target: Systemic 5-Fluorouracil Overexposure
    causal_link_type: DIRECT
    description: >-
      Reduced DPD activity is one of the two routes to overexposure, raising and
      prolonging circulating 5-FU for a given dose.
    evidence:
    - reference: PMID:36160401
      reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Dihydropyridine deaminase (DYPD) deficiency due to genetic variations predispose patients to the toxic effects of 5-FU and capecitabine by reducing deactivation which increases blood levels of the drug."
      explanation: >-
        States the causal step from impaired DPD-mediated deactivation to raised
        circulating drug levels.
  evidence:
  - reference: PMID:29152729
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Dihydropyrimidine Dehydrogenase Genotype and Fluoropyrimidine Dosing: 2017 Update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "DPYD, the gene encoding dihydropyrimidine dehydrogenase (DPD), the rate-limiting enzyme for fluoropyrimidine catabolism"
    explanation: >-
      Establishes DPD as the rate-limiting catabolic enzyme for fluoropyrimidines,
      the node's central claim.
  - reference: PMID:33283204
    reference_title: "Pharmacogenetic Variants in the DPYD and TYMS Genes are Clinically Significant Predictors of Fluoropyrimidine Toxicity: Are We Ready for Use in our Clinical Practice."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "DPYD gene encodes DPD, the rate-limiting enzyme responsible for catabolism of 5-FU and is responsible for >85% of 5-FU elimination."
    explanation: >-
      Quantifies the catabolic share DPD carries, so its deficiency produces the
      overexposure this node describes.
- name: Anabolic Activation to Cytotoxic Nucleotides
  description: >-
    5-FU is converted through phosphoribosylation and kinase steps to cytotoxic
    fluoronucleotides, principally FdUMP (which inhibits thymidylate synthase) and
    the fluoro-ribonucleotide FUTP (which is misincorporated into RNA). These
    metabolites mediate the drug's cytotoxicity and, in overexposure, its
    toxicity.
  biological_scale: MOLECULAR
  downstream:
  - target: Thymidylate Synthase Inhibition
    causal_link_type: DIRECT
  - target: RNA Misincorporation
    causal_link_type: DIRECT
- name: Thymidylate Synthase Inhibition
  description: >-
    FdUMP forms a stable ternary complex with thymidylate synthase and the folate
    cofactor 5,10-methylenetetrahydrofolate, blocking de novo synthesis of dTMP.
    The resulting dTTP depletion and nucleotide-pool imbalance drive uracil
    misincorporation, futile excision-repair cycling and DNA strand breaks
    ("thymineless death"). Thymidylate synthase is the sole de novo source of
    thymidylate and the principal target of 5-FU.
  biological_scale: MOLECULAR
  downstream:
  - target: Proliferating-Tissue Cytotoxicity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33283204
    reference_title: "Pharmacogenetic Variants in the DPYD and TYMS Genes are Clinically Significant Predictors of Fluoropyrimidine Toxicity: Are We Ready for Use in our Clinical Practice."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "TYMS catalyzes methylation of dUMP to dTMP. As the sole de novo source of thymidylate in the cell it is an important target for 5-flurouracil (5-FU) and capecitabine (CAP)."
    explanation: >-
      Identifies thymidylate synthase as the de novo thymidylate source and the
      5-FU target, the basis of this node.
- name: RNA Misincorporation
  description: >-
    FUTP is incorporated into cellular RNA in place of UTP, disrupting RNA
    processing and function. This RNA-directed toxicity is largely independent of
    the thymidylate pathway; that uridine triacetate, which delivers competing
    uridine, rescues toxicity is clinical evidence for an RNA-directed component,
    though the point is inferred from the antidote's effect rather than shown
    directly here.
  biological_scale: MOLECULAR
  downstream:
  - target: Proliferating-Tissue Cytotoxicity
    causal_link_type: DIRECT
- name: Proliferating-Tissue Cytotoxicity
  description: >-
    Tissues with the highest proliferative turnover - gastrointestinal mucosa and
    bone marrow - sustain the earliest and most severe injury, producing
    mucositis/stomatitis, diarrhoea and myelosuppression.
  biological_scale: TISSUE
  downstream:
  - target: Oral mucositis
  - target: Diarrhea
  - target: Bone marrow suppression
  evidence:
  - reference: PMID:33283204
    reference_title: "Pharmacogenetic Variants in the DPYD and TYMS Genes are Clinically Significant Predictors of Fluoropyrimidine Toxicity: Are We Ready for Use in our Clinical Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "manifests typically as severe or fatal diarrhea, mucositis/stomatitis, myelosuppression and even rare toxicities, such as hepatitis, encephalopathy and acute cardiac ischemia following first or second dose of 5-FU"
    explanation: >-
      Lists the proliferative-tissue toxicities (diarrhoea, mucositis/stomatitis,
      myelosuppression) that define this node.
- name: Myocardial Toxicity
  description: >-
    5-FU and its fluorinated catabolites injure the myocardium, producing
    myocardial ischaemia through proposed mechanisms including coronary artery
    spasm, endothelial injury with thrombosis, and oxidative energetic failure of
    cardiomyocytes. No single mechanism is established.
  biological_scale: TISSUE
  downstream:
  - target: Myocardial ischemia
  evidence:
  - reference: PMID:25186061
    reference_title: "A systematic review of the pathophysiology of 5-fluorouracil-induced cardiotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the proposed mechanisms are: endothelial injury followed by thrombosis, increased metabolism leading to energy depletion and ischemia, oxidative stress causing cellular damage, coronary artery spasm leading to myocardial ischemia and diminished ability of RBCs to transfer oxygen resulting in myocardial ischemia."
    explanation: >-
      A systematic review of the candidate mechanisms of 5-FU cardiotoxicity this
      node summarizes.
- name: Central Neurotoxicity
  description: >-
    5-FU produces a central neurotoxicity that includes a cerebellar syndrome and
    a hyperammonaemic encephalopathy occurring without hepatic failure. The
    hyperammonaemia is incompletely understood; a proposed route is catabolite
    (fluoroacetate/fluorocitrate) inhibition of the Krebs cycle driving ammonia
    accumulation.
  biological_scale: ORGANISM
  downstream:
  - target: Hyperammonemia
  - target: Hyperammonemic encephalopathy
  - target: Cerebellar ataxia
  evidence:
  - reference: PMID:32082663
    reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperammonemia is associated with fluorouracil though the mechanism is unclear."
    explanation: >-
      Supports the hyperammonaemic arm and that its mechanism is not settled.
  - reference: PMID:32082663
    reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Another possible etiology is inhibition of the Krebs cycle by fluoroacetate or fluorocitrate, metabolites of 5-FU, leading to excess urea and the subsequent accumulation of ammonia"
    explanation: >-
      Gives the postulated catabolite mechanism (Krebs-cycle inhibition) for the
      ammonia accumulation in this node.

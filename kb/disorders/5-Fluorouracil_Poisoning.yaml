- name: Palmar-plantar erythrodysesthesia
  description: Hand-foot syndrome - painful erythema and dysaesthesia of palms and soles, most associated with capecitabine.
  phenotype_term:
    preferred_term: Palmoplantar erythrodysesthesia
    term:
      id: HP:0025493
      label: Palmoplantar erythema
  evidence:
  - reference: PMID:36160401
    reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most patients experience adverse effects from these drugs, including fatigue, oral mucositis, abdominal pain, diarrhea, myelosuppression, palmoplantar erythrodysesthesia and rarely central nervous system toxicity or cardiomyopathy."
    explanation: Lists palmoplantar erythrodysesthesia among fluoropyrimidine adverse effects.
- name: Myocardial ischemia
  description: >-
    Myocardial ischaemia from coronary vasospasm is the dominant cardiotoxic
    presentation; the broader cardiotoxicity spectrum (arrhythmia, left
    ventricular dysfunction, cardiac arrest, sudden death) is described on the
    Myocardial Toxicity pathophysiology node.
  phenotype_term:
    preferred_term: Myocardial ischemia
    term:
      id: HP:0001681
      label: Angina pectoris
  evidence:
  - reference: PMID:25186061
    reference_title: "A systematic review of the pathophysiology of 5-fluorouracil-induced cardiotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A severe side effect to 5-FU and capecitabine-based treatment is cardiotoxicity, which often presents as myocardial ischemia, but to a lesser extent cardiac arrhythmias, hyper- and hypotension, left ventricular dysfunction, cardiac arrest and sudden death"
    explanation: >-
      Myocardial ischaemia (anginal presentation) is the dominant cardiotoxic
      phenotype; the term captures the ischaemic chest-pain presentation.
- name: Hyperammonemia
  description: Elevated serum ammonia without hepatic failure, the metabolic abnormality underlying 5-FU hyperammonaemic encephalopathy.
  phenotype_term:
    preferred_term: Hyperammonemia
    term:
      id: HP:0001987
      label: Hyperammonemia
  evidence:
  - reference: PMID:32082663
    reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "found to have hyperammonemia (84 mcmol/L), without hepatic failure"
    explanation: Documents the hyperammonaemia (without hepatic failure) that defines this node.
- name: Hyperammonemic encephalopathy
  description: Acute encephalopathy with hyperammonaemia in the absence of hepatic failure, typically within days of starting 5-FU.
  phenotype_term:

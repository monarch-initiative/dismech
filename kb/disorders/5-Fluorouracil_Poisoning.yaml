    explanation: Supports TYMS variation as a reported modifier of fluoropyrimidine toxicity.
experimental_models:
- name: H9c2 rat cardiocyte 5-FU apoptosis assay
  experimental_model_type: CELL_LINE
  description: >-
    Cultured H9c2 rat cardiocytes exposed to 5-FU, used to probe the oxidative,
    apoptotic mechanism of 5-FU cardiotoxicity.
  modeled_mechanisms:
  - target: Myocardial Toxicity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Reproduces a candidate cellular mechanism (oxidative-stress-driven
      apoptosis) of 5-FU cardiotoxicity in a rodent cardiomyocyte line.
    limitations: >-
      A rat-derived immortalized cell line at supratherapeutic concentrations
      cannot reproduce the coronary-spasm and endothelial components of the
      tissue-scale Myocardial Toxicity node, so it models only the cellular
      oxidative-injury arm one step below that node.
    evidence:
    - reference: PMID:22812382
      reference_title: "5-Fluorouracil induces apoptosis in rat cardiocytes through intracellular oxidative stress."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The apoptosis induced by 5-FU and LF in cardiocytes was paralleled by the activation of caspases 3, 9 and 7 and by the intracellular increase of O(2-) levels."
      explanation: >-
        Shows 5-FU drives caspase-mediated apoptosis with increased superoxide in
        cardiocytes, the oxidative arm of the cardiotoxicity node.
environmental:
- name: Therapeutic fluoropyrimidine administration
  exposure_term:
    preferred_term: exposure to 5-fluorouracil
    term:
      id: ECTO:9000261
      label: exposure to 5-fluorouracil
  description: >-
    The exposure is iatrogenic: 5-FU, or capecitabine (its oral prodrug), is given
    as cancer chemotherapy to large numbers of patients. Poisoning follows when
    that administration is excessive (an overdose or infusion-pump error) or when a
    standard dose is not cleared because of DPD deficiency.
  evidence:
  - reference: PMID:36160401
    reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "5-Fluorouracil (5FU) or capecitabine, a prodrug enzymatically converted to 5-FU, is prescribed to thousands of patients with gastrointestinal, breast, and other cancers in the United States (US) (Ison et al., 2016)."
    explanation: Establishes the iatrogenic chemotherapeutic exposure that underlies this entry.
  influences_mechanisms:
  - target: Systemic 5-Fluorouracil Overexposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Administered fluoropyrimidine is the source of the circulating drug that, in
      overdose or with deficient clearance, becomes the systemic overexposure that
      drives toxicity.
    evidence:
    - reference: PMID:36160401
      reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Uridine triacetate (UTA) is an emergency treatment for overdoses and early onset, severe or life-threatening toxicities from fluoropyrimidines."
      explanation: >-
        Names overdose and severe toxicity from administered fluoropyrimidines as
        the overexposure state this exposure triggers.
treatments:
- name: Uridine triacetate
  description: >-
    Specific antidote for 5-FU/capecitabine overdose or early-onset severe
    toxicity, approved for use within 96 hours of the last fluoropyrimidine dose;
    it delivers uridine that competes with the toxic fluoronucleotides. In pooled
    analysis survival was approximately 96% versus 16% in a historical cohort.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: uridine triacetate
      term:
        id: CHEBI:90914
        label: uridine triacetate
  evidence:
  - reference: PMID:36160401
    reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Uridine triacetate (UTA) is an emergency treatment for overdoses and early onset, severe or life-threatening toxicities from fluoropyrimidines. It is approved for use in adults and children within 96 h of last fluoropyrimidine administration."
    explanation: States the indication and 96-hour window for the antidote.
  - reference: PMID:36160401
    reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The use of the drug resulted in approximately 96% survival (compared to 16% survival in a historic cohort), and about half the patients resumed their chemotherapy regimens within 3 weeks of overexposure."
    explanation: Quantifies the survival benefit of timely uridine triacetate.
  target_mechanisms:
  - target: RNA Misincorporation
    description: >-
      Uridine triacetate is deacetylated to uridine, which competitively
      inhibits incorporation of fluorouridine triphosphate into cellular RNA.
    evidence:
    - reference: PMID:36160401
      reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The antidote drug, UTA is deacetylated into uridine in the body and work by competing with fluorouridine triphosphate, a 5-FU metabolite for incorporation into RNA of cells to reduce toxicity in normal tissues (Hidalgo et al., 2000)."
      explanation: Directly explains the competitive RNA-protective mechanism of uridine triacetate.
- name: DPYD genotype-guided dosing
  description: >-
    Pre-treatment DPYD genotyping/phenotyping to identify deficient metabolisers
    and reduce or avoid fluoropyrimidine dosing - the principal preventive measure.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29152729
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Dihydropyrimidine Dehydrogenase Genotype and Fluoropyrimidine Dosing: 2017 Update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prospective genotyping of c.1905+1G>A followed by a 50% dose reduction in heterozygous carriers resulted in a rate of severe toxicity comparable to non-carriers (30). This study thus demonstrated that DPYD genetic testing can reduce the occurrence of severe fluoropyrimidine-related toxicity, and that a dose reduction of 50% is suitable for heterozygous carriers of no function variants (DPYD-AS: 1)."
    explanation: Clinical trial evidence summarized by CPIC showing DPYD genotype-guided dose reduction lowers severe fluoropyrimidine toxicity.
  target_mechanisms:
  - target: Deficient DPD-Mediated Catabolism
    description: >-
      Identifies reduced-function DPYD carriers before exposure so dose can be
      lowered or the drug avoided, pre-empting the overexposure step.
    evidence:
    - reference: PMID:29152729
      reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Dihydropyrimidine Dehydrogenase Genotype and Fluoropyrimidine Dosing: 2017 Update."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "the results can be used to guide dosing of fluoropyrimidines (5-fluorouracil and capecitabine)"
      explanation: CPIC's stated purpose - using DPYD genotype to guide fluoropyrimidine dosing.
- name: Supportive care
  description: >-
    Management of febrile neutropenia, fluid/electrolyte support for diarrhoea,
    hydration and drug cessation for hyperammonaemic encephalopathy, and cardiac
    monitoring with drug cessation for cardiotoxicity.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32082663
    reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During her evaluation, she was found to have hyperammonemia (84 mcmol/L), without hepatic failure, that resolved with stopping chemotherapy and supportive care."
    explanation: Resolution of 5-FU hyperammonaemic encephalopathy with chemotherapy cessation and supportive care.
  target_mechanisms:
  - target: Central Neurotoxicity
    description: >-
      Drug cessation and intravenous hydration reverse 5-FU-associated
      hyperammonaemic encephalopathy.
    evidence:
    - reference: PMID:32082663
      reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "During both admissions, her symptoms resolved with IV hydration and cessation of chemotherapy."
      explanation: Demonstrates clinical reversal of 5-FU central neurotoxicity with hydration and drug cessation.
diagnosis:
- name: Clinical recognition from chemotherapy exposure and toxidrome
  description: >-
    Diagnosis rests on a recent fluoropyrimidine exposure together with a
    characteristic toxicity pattern - severe mucositis, diarrhoea and
    myelosuppression, and sometimes cardiac or neurologic involvement. An overdose
    or infusion-pump error may be evident from the administration record.
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:33283204
    reference_title: "Pharmacogenetic Variants in the DPYD and TYMS Genes are Clinically Significant Predictors of Fluoropyrimidine Toxicity: Are We Ready for Use in our Clinical Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "manifests typically as severe or fatal diarrhea, mucositis/stomatitis, myelosuppression and even rare toxicities, such as hepatitis, encephalopathy and acute cardiac ischemia following first or second dose of 5-FU"
    explanation: The toxidrome that, with an exposure history, establishes the clinical diagnosis.
- name: DPYD Pharmacogenetic Testing
  description: >-
    Targeted DPYD genotyping or sequencing identifies reduced-function or
    no-function alleles either prospectively to assess fluoropyrimidine toxicity
    risk or diagnostically in patients presenting with early-onset or severe
    5-FU toxicity.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29152729
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Dihydropyrimidine Dehydrogenase Genotype and Fluoropyrimidine Dosing: 2017 Update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Testing options for DPYD genotype range from targeted analysis of selected variants to resequencing of the complete coding regions. In the context of 5-fluorouracil toxicity, at present, most tests focus on the four most common and well-established risk variants (c.1905+1G>A, c.1679T>G, c.2846A>T, c.1129–5923C>G) or a subset thereof."
    explanation: Describes targeted DPYD variant testing and coding-region sequencing for 5-FU toxicity evaluation.
  - reference: PMID:36160401
    reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DPD deficiency testing later resulted as heterozygous for IVS14+1G>A allele indicating enzyme deficiency."
    explanation: Demonstrates diagnostic confirmation of underlying DPD deficiency in a patient with severe 5-FU neurotoxicity.
- name: Serum ammonia and lactate in acute neurotoxicity
  description: >-
    When a patient on 5-FU develops acute encephalopathy, serum ammonia (with
    lactate) identifies 5-FU hyperammonaemic encephalopathy, which occurs without
    hepatic failure, and separates it from other causes of altered mental status.
  diagnosis_term:
    preferred_term: Blood Chemistry Measurement
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  measurements:
  - preferred_term: Serum ammonia
    term:
      id: LOINC:1841-6
      label: Ammonia [Moles/volume] in Serum
  - preferred_term: Lactate
    term:
      id: LOINC:2524-7
      label: Lactate [Moles/volume] in Serum or Plasma
  notes: >-
    LOINC:1841-6 is bound specifically to Serum rather than Plasma: LOINC has
    no combined Serum-or-Plasma ammonia code (ammonia assays are frequently
    specimen-sensitive, which may be why), and this row's own name specifies
    serum ammonia. Lactate is bound to the method-less Serum-or-Plasma code.
  evidence:
  - reference: PMID:32082663
    reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "found to have hyperammonemia (84 mcmol/L), without hepatic failure"
    explanation: Supports measuring ammonia to identify 5-FU hyperammonaemic encephalopathy without hepatic failure.
differential_diagnoses:
- name: Hyperammonaemic encephalopathy from other causes
  description: >-
    Hepatic failure and inherited urea-cycle or hyperammonaemia disorders also
    cause hyperammonaemic encephalopathy and overlap with the neurologic
    presentation of 5-FU toxicity.
  distinguishing_features:
  - 5-FU hyperammonaemic encephalopathy occurs without hepatic failure and resolves on stopping the drug.
  - Onset within days of a fluoropyrimidine dose points to drug toxicity rather than a chronic metabolic cause.
  evidence:
  - reference: PMID:32082663
    reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "found to have hyperammonemia (84 mcmol/L), without hepatic failure"
    explanation: The absence of hepatic failure distinguishes 5-FU encephalopathy from hepatic causes.
- name: Acute coronary syndrome
  description: >-
    5-FU cardiotoxicity most often presents as myocardial ischaemia and can mimic a
    primary acute coronary syndrome.
  distinguishing_features:
  - 5-FU cardiotoxicity is temporally linked to the infusion and is typically vasospastic, often resolving on drug cessation, rather than fixed obstructive coronary disease.
  disease_term:
    preferred_term: acute coronary syndrome
    term:
      id: MONDO:0005542
      label: acute coronary syndrome
  evidence:
  - reference: PMID:25186061
    reference_title: "A systematic review of the pathophysiology of 5-fluorouracil-induced cardiotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A severe side effect to 5-FU and capecitabine-based treatment is cardiotoxicity, which often presents as myocardial ischemia, but to a lesser extent cardiac arrhythmias, hyper- and hypotension, left ventricular dysfunction, cardiac arrest and sudden death"
    explanation: Establishes that 5-FU cardiotoxicity presents as myocardial ischaemia, the overlap with acute coronary syndrome.

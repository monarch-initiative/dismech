    explanation: Supports measuring ammonia to identify 5-FU hyperammonaemic encephalopathy without hepatic failure.
differential_diagnoses:
- name: Hyperammonaemic encephalopathy from other causes
  description: >-
    Hepatic failure and inherited urea-cycle or hyperammonaemia disorders also
    cause hyperammonaemic encephalopathy and overlap with the neurologic
    presentation of 5-FU toxicity.
  distinguishing_features:
  - 5-FU hyperammonaemic encephalopathy occurs without hepatic failure and resolves on stopping the drug.
  - Onset within days of a fluoropyrimidine dose points to drug toxicity rather than a chronic metabolic cause.
  evidence:
  - reference: PMID:32082663
    reference_title: "A 5-Fluorouracil-Induced Hyperammonemic Encephalopathy Challenged with Capecitabine."
    supports: SUPPORT

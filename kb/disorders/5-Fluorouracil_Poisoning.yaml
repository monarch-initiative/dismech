    reference_title: "Pharmacogenetic Variants in the DPYD and TYMS Genes are Clinically Significant Predictors of Fluoropyrimidine Toxicity: Are We Ready for Use in our Clinical Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "DPYD mutations are found in 50% of severe 5-FU toxicity cases"
    explanation: Quantifies the share of severe toxicity attributable to DPYD variation.
- name: TYMS
  notes: >-

- name: Bone marrow suppression
  description: >-
    Myelosuppression, the dose-limiting haematologic toxicity, presenting as
    neutropenia (predisposing to febrile neutropenia) and other cytopenias.
  phenotype_term:
    preferred_term: Myelosuppression
    term:
      id: HP:0012145
      label: Abnormality of multiple cell lineages in the bone marrow
  evidence:
  - reference: PMID:33283204

    reference_title: "Pharmacogenetic Variants in the DPYD and TYMS Genes are Clinically Significant Predictors of Fluoropyrimidine Toxicity: Are We Ready for Use in our Clinical Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "manifests typically as severe or fatal diarrhea, mucositis/stomatitis, myelosuppression and even rare toxicities, such as hepatitis, encephalopathy and acute cardiac ischemia following first or second dose of 5-FU"
    explanation: >-
      Lists the proliferative-tissue toxicities (diarrhoea, mucositis/stomatitis,
      myelosuppression) that define this node.
  - reference: PMID:36160401
    reference_title: "Case report: Uridine triacetate in the management of delayed onset 5-fluorouracil toxicity: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most patients experience adverse effects from these drugs, including fatigue, oral mucositis, abdominal pain, diarrhea, myelosuppression, palmoplantar erythrodysesthesia and rarely central nervous system toxicity or cardiomyopathy."
    explanation: Includes palmoplantar erythrodysesthesia alongside mucositis, diarrhea, and myelosuppression among fluoropyrimidine proliferative-tissue toxicities.
- name: Myocardial Toxicity
  description: >-
    5-FU and its fluorinated catabolites injure the myocardium, producing
    myocardial ischaemia through proposed mechanisms including coronary artery
    spasm, endothelial injury with thrombosis, and oxidative energetic failure of
    cardiomyocytes. No single mechanism is established.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  downstream:
  - target: Myocardial ischemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25186061
    reference_title: "A systematic review of the pathophysiology of 5-fluorouracil-induced cardiotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the proposed mechanisms are: endothelial injury followed by thrombosis, increased metabolism leading to energy depletion and ischemia, oxidative stress causing cellular damage, coronary artery spasm leading to myocardial ischemia and diminished ability of RBCs to transfer oxygen resulting in myocardial ischemia."
    explanation: >-
      A systematic review of the candidate mechanisms of 5-FU cardiotoxicity this
      node summarizes.
- name: Central Neurotoxicity
  description: >-
    5-FU produces a central neurotoxicity that includes a cerebellar syndrome and
    a hyperammonaemic encephalopathy occurring without hepatic failure. The
    hyperammonaemia is incompletely understood; a proposed route is catabolite
    (fluoroacetate/fluorocitrate) inhibition of the Krebs cycle driving ammonia
    accumulation.
  biological_scale: ORGANISM
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:

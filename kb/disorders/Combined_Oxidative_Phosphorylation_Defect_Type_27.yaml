  evidence:
  - reference: PMID:25787132
    reference_title: Mutations in the mitochondrial cysteinyl-tRNA synthase gene, CARS2, lead to a severe epileptic encephalopathy and complex movement disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Incomplete assembly of complex V, using blue native polyacrylamide gel
      electrophoretic analysis and complex I, using western blotting, suggested

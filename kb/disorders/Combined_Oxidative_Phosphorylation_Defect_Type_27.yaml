pathophysiology:
- name: CARS2 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_translation_deficiency#Mitochondrial Translation Machinery Lesion"
  description: >-
    Biallelic CARS2 variants reduce mitochondrial cysteinyl-tRNA synthetase
    activity. The recurrent c.655G>A removes a loop that holds the acceptor end
    of tRNA-Cys, and the other reported variants alter conserved residues of
    the catalytic or anticodon-binding domains. CARS2 also synthesises cysteine
    persulfide from cysteine, a second activity whose contribution to the
    disease has not been studied.
  genes:
  - preferred_term: CARS2
    term:
      id: hgnc:25695
      label: CARS2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: cysteine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004817
      label: cysteine-tRNA ligase activity
  evidence:
  - reference: PMID:25787132
    reference_title: Mutations in the mitochondrial cysteinyl-tRNA synthase gene, CARS2, lead to a severe epileptic encephalopathy and complex movement disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both mutations affect highly conserved amino acids located within the
      functional ligase domain of the cysteinyl-tRNA synthase.
    explanation: The variants lie in the ligase domain.
  - reference: PMID:37151360
    reference_title: "Severe neonatal onset neuroregression with paroxysmal dystonia and apnoea: Expanding the phenotypic and genotypic spectrum of CARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The removal of these 28 amino acids is thus predicted to compromise
      acceptor hairpin stability and alter cysteine-tRNA binding, substantially
      reducing aminoacylation activity.
    explanation: The predicted effect of the recurrent exon 6 deletion on the enzyme.
  - reference: PMID:29079736
    reference_title: Cysteinyl-tRNA synthetase governs cysteine polysulfidation and mitochondrial bioenergetics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we demonstrate effective CysSSH synthesis from the substrate
      L-cysteine, a reaction catalyzed by prokaryotic and mammalian
      cysteinyl-tRNA synthetases (CARSs).
    explanation: The enzyme's second activity, cysteine persulfide synthesis.
  downstream:
  - target: Reduced Mitochondrial tRNA-Cys Aminoacylation
    causal_link_type: DIRECT
    description: Less synthetase activity leaves less cysteine-charged mitochondrial tRNA-Cys.
- name: Reduced Mitochondrial tRNA-Cys Aminoacylation
  biological_scale: MOLECULAR
  description: >-
    Charging of mitochondrial tRNA-Cys is reduced in patient fibroblasts, even

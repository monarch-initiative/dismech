name: Combined Oxidative Phosphorylation Defect Type 27
creation_date: "2026-11-27T14:02:56Z"
category: Mendelian
disease_term:
  preferred_term: combined oxidative phosphorylation defect type 27
  term:
    id: MONDO:0014728
    label: combined oxidative phosphorylation defect type 27
synonyms:
- COXPD27
- combined oxidative phosphorylation deficiency 27
- combined oxidative phosphorylation deficiency type 27
- CARS2 combined oxidative phosphorylation deficiency
- combined oxidative phosphorylation deficiency caused by mutation in CARS2
- CARS2-related mitochondrial disease
parents:
- Combined Oxidative Phosphorylation Deficiency
- Mitochondrial Disease
description: >-
  Combined oxidative phosphorylation defect type 27 (COXPD27) is an autosomal
  recessive mitochondrial disease caused by biallelic variants in CARS2, which
  encodes the mitochondrial cysteinyl-tRNA synthetase. The variants lower
  charging of mitochondrial tRNA-Cys with cysteine, impair mitochondrial
  translation and produce a combined respiratory chain deficiency, chiefly of
  complexes I and IV, that is found in muscle and liver while patient
  fibroblasts can be normal.

  Fewer than a dozen patients are reported. Onset ranges from the neonatal
  period to late childhood. The core picture is a progressive
  neurodegeneration: developmental regression or cognitive decline,
  treatment-refractory epilepsy that is often myoclonic and can take the form
  of an epileptic encephalopathy or status epilepticus, a complex movement
  disorder with dystonia, chorea, myoclonus or tremor, and progressive spastic
  tetraparesis; some patients lose vision and hearing, and brain atrophy is the
  most frequent imaging finding. Presentations have resembled MERRF and
  Alpers-Huttenlocher syndrome. Death has occurred between 16 weeks and 28
  years of age.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Patients carry biallelic CARS2 variants, homozygous (often in consanguineous
    families) or compound heterozygous.
  evidence:
  - reference: PMID:37151360
    reference_title: "Severe neonatal onset neuroregression with paroxysmal dystonia and apnoea: Expanding the phenotypic and genotypic spectrum of CARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Biallelic variants in the CARS2 gene (NM_024537.4), which encodes the
      mitochondrial aminoacyl-tRNA synthetase for cysteine (CARS2, mt-aaRScys;
      MIM*612800), result in childhood onset epileptic encephalopathy and
      complex movement disorder with combined oxidative phosphorylation
      deficiency (MIM#616672).
    explanation: States that biallelic variants cause the disease.
  - reference: PMID:25361775
    reference_title: A homozygous splice-site mutation in CARS2 is associated with progressive myoclonic epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a homozygous c.655G>A mutation in the CARS2 gene cosegregating in the family.
    explanation: A homozygous variant cosegregating in a consanguineous family.
genetic:
- name: CARS2
  gene_term:
    preferred_term: CARS2
    term:
      id: hgnc:25695
      label: CARS2
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  association: >-
    Biallelic CARS2 variants cause the disease. About eight families are
    reported, with cosegregation, reduced mitochondrial tRNA-Cys charging in
    patient fibroblasts in two of them, and correction of the complex V
    assembly defect by wild-type CARS2 in patient fibroblasts in one.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:25361775
      reference_title: A homozygous splice-site mutation in CARS2 is associated with progressive myoclonic epilepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified a homozygous c.655G>A mutation in the CARS2 gene cosegregating in the family.
      explanation: Recessive cosegregation of a homozygous variant.
  notes: >-
    The relationship is typed UNKNOWN rather than CAUSATIVE, which this schema
    reserves for Definitive or Strong gene-disease validity: ClinGen rates
    CARS2 Moderate (autosomal recessive) for mitochondrial disease
    (MONDO:0044970), a broader concept than this entry's MONDO:0014728, so no
    tier is recorded in gene_disease_validity, and the disease rests on about
    eight families. Half of the patients summarised in 2023 carried at least one
    c.655G>A allele, which removes exon 6 from the transcript; the other
    variants are missense changes in the catalytic and anticodon-binding
    domains or an in-frame deletion.
  variants:
  - name: c.655G>A, p.Ala219Thr
    description: >-
      The recurrent allele, homozygous in several families. It changes the last
      nucleotide of exon 6, so the transcript loses exon 6 and the protein loses
      28 amino acids from a loop that stabilises the acceptor end of tRNA-Cys.
    evidence:
    - reference: PMID:25361775
      reference_title: A homozygous splice-site mutation in CARS2 is associated with progressive myoclonic epilepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This leads to an in-frame deletion of 28 amino acids in a conserved
        sequence motif of the protein involved in stabilization of the acceptor
        end hairpin of tRNA(Cys).
      explanation: The consequence of exon 6 skipping for the enzyme.
    - reference: PMID:37151360
      reference_title: "Severe neonatal onset neuroregression with paroxysmal dystonia and apnoea: Expanding the phenotypic and genotypic spectrum of CARS2-related mitochondrial disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Interestingly, half of all reported individuals to date (four of eight)
        suffering from CARS2-related disease harbor at least one allele with
        this specific c.655G>A variant.
      explanation: The recurrence of the allele.
  - name: c.1478T>C, p.Phe493Ser
    description: >-
      An anticodon-binding domain variant, compound heterozygous with c.655G>A
      in an infant with neonatal dystonia and central apnoea.
    evidence:
    - reference: PMID:37151360
      reference_title: "Severe neonatal onset neuroregression with paroxysmal dystonia and apnoea: Expanding the phenotypic and genotypic spectrum of CARS2-related mitochondrial disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing identified biallelic variants in the CARS2 gene:
        one novel (c.1478T>C, p.Phe493Ser), and one previously reported
        (c.655G>A, p.Ala219Thr; rs727505361).
      explanation: The genotype of the neonatal case.
  evidence:
  - reference: PMID:25361775
    reference_title: A homozygous splice-site mutation in CARS2 is associated with progressive myoclonic epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CARS2 is a novel disease gene associated with a severe progressive

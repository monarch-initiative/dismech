diagnosis:
- name: Exome sequencing for biallelic CARS2 variants
  description: >-
    The diagnosis is molecular. Brain imaging is nonspecific and can be normal
    early, lactate is often normal, and fibroblast respiratory chain studies can
    be normal, so a respiratory chain defect is more likely to be found in
    muscle or liver; tRNA-Cys aminoacylation in fibroblasts supports a new
    variant.
  evidence:
  - reference: PMID:25787132
    reference_title: Mutations in the mitochondrial cysteinyl-tRNA synthase gene, CARS2, lead to a severe epileptic encephalopathy and complex movement disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified compound heterozygous mutations in CARS2, a
      mitochondrial aminoacyl-tRNA synthetase.
    explanation: Exome sequencing made the diagnosis.
  - reference: PMID:37151360
    reference_title: "Severe neonatal onset neuroregression with paroxysmal dystonia and apnoea: Expanding the phenotypic and genotypic spectrum of CARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      confirming that normal neuroimaging in the context of a severe
      neurological presentation does not exclude a mitochondrial disorder
    explanation: Normal imaging does not exclude the disease.
treatments:
- name: Antiseizure medication
  description: >-
    No disease-modifying therapy exists. The epilepsy has been refractory to
    antiseizure medication; one patient with focal status epilepticus also
    failed pharmacological coma and underwent occipital lobectomy, and in
    another levetiracetam and clobazam gave minimal clinical and
    electrophysiological improvement.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: clobazam
      term:
        id: CHEBI:31413
        label: clobazam
  target_mechanisms:
  - target: Epileptic encephalopathy
    description: Aims to control seizures; the seizures have usually been refractory.
  evidence:
  - reference: PMID:34704010
    reference_title: Expanding the electro-clinical phenotype of CARS2associated neuroregression.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He has also been receiving antiseizure medication (levetiracetam and
      clobazam) over the last 6 months but has shown minimal clinical and
      electrophysiological improvement
    explanation: Minimal benefit in one patient.
  - reference: PMID:30139652
    reference_title: Clinicopathologic Findings of CARS2 Mutation.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seizure was refractory to antiepileptic medications and pharmacologic
      coma.
    explanation: Refractory status epilepticus in another patient.
experimental_models:
- name: Patient fibroblasts complemented with wild-type CARS2
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:25787132
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  description: >-
    Skin fibroblasts from a patient compound heterozygous for CARS2 variants,
    which show reduced charged mitochondrial tRNA-Cys and incomplete assembly
    of complex V, transduced with a retrovirus expressing wild-type CARS2.
  modeled_mechanisms:
  - target: Impaired Mitochondrial Translation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Wild-type CARS2 corrects the complex V assembly defect.
    limitations: >-
      Fibroblasts are mildly affected in this disease, and rescue was shown for
      complex V assembly rather than for neuronal function.
    evidence:
    - reference: PMID:25787132
      reference_title: Mutations in the mitochondrial cysteinyl-tRNA synthase gene, CARS2, lead to a severe epileptic encephalopathy and complex movement disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Retroviral transfection of the wild-type CARS2 into patient skin
        fibroblasts led to the correction of the incomplete assembly of complex
        V, providing functional evidence for the role of CARS2 mutations in
        disease aetiology.
      explanation: Complementation rescues the defect.
notes: >-
  No GeneReviews chapter covers CARS2. The phenotypes come from the case
  reports (PMID:25361775, PMID:25787132, PMID:30139652, PMID:34704010,
  PMID:37151360), the last of which tabulates the eight patients reported to
  2023. A further homozygous c.655G>A family was reported from Pakistan in
  2023 (PMID:37359369). Feature frequencies are given only where a source
  states one.

    reference_title: "MMP13-related Metaphyseal anadysplasia type 1 presenting with rickets-like manifestations in a family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The family pedigree demonstrates multiple affected individuals with short stature and bowed femurs, consistent with autosomal dominant inheritance."
    explanation: >-
      Records dominant segregation across three generations of a family carrying a
      heterozygous MMP13 missense allele.
  - reference: PMID:30439533
    reference_title: "A de novo variant in MMP13 identified in a patient with dominant metaphyseal anadysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we reported the identification of a previously unreported pathogenic heterozygous de novo variant NM_002427.3:c.212T > C/p.Met71Thr in MMP13 in a Chinese male pediatric patient with metaphyseal anadysplasia 1"
    explanation: >-
      A de novo heterozygous allele in a sporadic patient, which is the genetic
      argument that one mutant copy suffices.
genetic:
- name: MMP13
  notes: >-
    MMP13 encodes collagenase-3, a secreted matrix metalloproteinase expressed in
    terminal hypertrophic chondrocytes of the growth plate and in osteoblasts. The
    dominant disease alleles are missense substitutions in the propeptide encoded by
    exon 2; the recessive MMP13 disease (Spahr type) instead carries variants in the
    catalytic domain, which is the observation behind the ISDS dyadic split.
  relationship_type: CAUSATIVE
  gene_term:

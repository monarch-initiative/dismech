    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24648384
    reference_title: "MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to give precise recurrence risks and prognosis"
    explanation: >-
      States that molecular confirmation of which MMP13 entity is present is what
      allows accurate recurrence-risk counselling.
discussions:
- discussion_id: mmp13_dominant_negative_or_haploinsufficient
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the dominant MMP13 missense product act purely by reducing the secreted active
    enzyme pool, or does it also suppress wild-type MMP13 and MMP9 as a dominant
    negative?
  attaches_to:
  - pathophysiology#Deficiency of Secreted Active Collagenase-3
  rationale: >-
    The two readings predict different things. Simple haploinsufficiency predicts about
    half-normal activity and a phenotype at the mild end; a dominant negative that also
    suppresses MMP9 removes the synergistic partner that the mouse work shows buffers
    partial MMP13 loss, and predicts a considerably more severe growth plate defect.

    The dominant-negative reading is in the literature and is attributed to the Lausch
    classification, but the papers in this entry state it as background rather than
    measure it, and the founding study's own cell-based experiment was not designed to
    test an effect on co-expressed wild-type protein - it compared wild-type and mutant
    constructs, and reported that the mutant's own secreted fragments are inactive.
    Nothing quoted here shows a mutant allele reducing activity below what losing one
    copy would give.

    This matters beyond mechanism. A heterozygous nonsense or whole-gene deletion allele
    should be benign under the dominant-negative model and mildly affected under the
    haploinsufficiency model, so the answer determines how an incidental truncating
    MMP13 variant is reported.
  proposed_experiments:
  - experiment_id: mmp13_coexpression_dominant_negative_assay
    name: Co-expression assay for suppression of wild-type MMP13 and MMP9
    description: >-
      Co-express a disease propeptide allele with wild-type MMP13 and, separately, with
      MMP9, and measure secreted active enzyme against the single-construct baseline and
      against a co-expressed null allele. Suppression below the null-allele baseline is
      the dominant-negative signature; equality with it is haploinsufficiency.
    perturbations:
    - name: Co-expression of a disease propeptide allele with wild-type MMP13
      target: pathophysiology#Premature Intracellular Autoactivation and Autodegradation of MMP13
    readouts:
    - name: Secreted active collagenase-3 activity
      target: pathophysiology#Deficiency of Secreted Active Collagenase-3
      direction: DECREASED
      interpretation: >-
        Activity below the co-expressed-null baseline would support a dominant-negative
        action; activity equal to it would support simple haploinsufficiency.
    would_support:
    - pathophysiology#Deficiency of Secreted Active Collagenase-3
    supporting_outcome:
    - >-
      Secreted active collagenase-3 falls below the level produced when a null allele is
      co-expressed with wild-type MMP13, and co-expression also lowers secreted active
      MMP9.
    refuting_outcome:
    - >-
      Secreted active collagenase-3 matches the co-expressed-null baseline and MMP9
      activity is unchanged.
notes: >-
  Ontology gaps recorded rather than worked around.

  No GO term names "growth plate cartilage matrix degradation" as such. The node
  "Failure of Growth-Plate Cartilage Matrix Degradation" therefore carries two broader
  process terms - collagen catabolic process (GO:0030574) and extracellular matrix
  disassembly (GO:0022617) - with the tissue restriction expressed through the
  anatomical structure (UBERON:0002516 epiphyseal plate) and cell type (CL:0000743
  hypertrophic chondrocyte) rather than through the process binding. Searched
  cache/go/terms.csv for "growth plate cartilage" (no rows) and for "cartilage" and
  "collagen catabolic"; the closest process terms are the two bound here.

  MMP13's specific enzymatic identity has no dedicated GO molecular function term in
  the term cache beyond metalloendopeptidase activity (GO:0004222), which is what both
  molecular nodes bind. The collagenase-3 identity is carried in preferred_term.

  MMP13 inhibitors are contraindicated in principle, and this is recorded as reasoning
  rather than as a treatment. SEMD Missouri type is a DEFICIENCY of secreted active
  collagenase-3. Selective MMP13 inhibitors and MMP13-lowering siRNA conjugates are in
  preclinical development for osteoarthritis, where the enzyme is in excess. Giving one
  to a patient whose disease is too little of the enzyme would be expected to worsen it.
  No publication cited here says this - it follows from the mechanism - so it appears in
  notes rather than as a treatment record with manufactured evidence.

  Splitting the vertebral node and rebinding the epiphyseal one left three skeletal
  phenotypes causally isolated, so the vertebral and epiphyseal nodes are now wired from
  Delayed Exit of Chondrocytes From the Growth Plate rather than from the metaphyseal
  node: the vertebral body grows from endplate growth plates and epiphyseal size comes
  from the secondary ossification centre, both cartilage cleared by the same collagenase
  step. Both edges are INDIRECT_UNKNOWN_INTERMEDIATES, because no source here shows
  either growth plate in this disorder and neither explains why the spine and epiphyses
  are affected so much more mildly than the long-bone metaphyses. Entry connectivity is
  7/8. Platyspondyly stays unconnected on purpose: its upstream is the childhood
  pear-shaped vertebra node, and that is a temporal evolution of one finding rather than
  one node causing another.

  The epiphyseal binding took two rounds and the second one overturned the first. Review
  offered HP:0010585 under the label "Abnormal epiphysis morphology"; the CURIE is real
  and that label is not its - HP:0010585 is Small epiphyses, and HP:0005930 is the
  general term the review meant. Because the only epiphyseal finding then in hand came
  from a recessive Spahr-type case reporting "mildly enlarged epiphyses", the entry
  bound HP:0010580 Enlarged epiphyses instead and recorded the label check here.

  That was the wrong finding, which the label check could not have caught. This
  disorder's own founding study, PMID:16167086, cited five times in this entry, says
  "The epiphyses are small and flat" and characterises the disorder as having "mild
  epiphyseal involvement" against moderate-to-severe metaphyseal change. So the entry
  asserted enlarged epiphyses while quoting a paper saying they are small. Reading a
  finding across from the recessive form is defensible where the dominant source is
  silent - Coxa vara is recorded that way on purpose - and not where it states the
  contrary. The node is now Small epiphyses, bound to HP:0010585 after all, evidenced
  from the founding study. The reviewer-CURIE rule in design decision 7 held, and the
  reason to re-read the source was independent of it.

  Deep-research reconciliation. The committed OpenScientist report independently reached
  this entry's recorded knowledge gap, listing "dominant-negative model not fully proven
  in vivo" among its own limitations, which is corroboration rather than a new fact.
  Two of its claims were NOT adopted:

  - Its mechanistic diagram attributes the transient course to "MMP14 (and other)
    compensation". The source it cites for compensation, PMID:42142773, states the
    opposite direction: MMP13 partly compensates for MMP14. The redundancy is real and
    is now cited on the matrix-degradation node with the direction stated correctly and
    the inference marked INDIRECT.
  - Its NCIT treatment-term suggestions are wrong. It offers NCIT:C15682 as "Physical
    Therapy" (NCIT calls it Dose-Rate), NCIT:C15277 as "Supportive Care" (Mastectomy)
    and NCIT:C15311 as "Genetic Counseling" (Quality Control). Its own Term Validation
    section catches all three. The treatments in this entry use codes taken from
    cache/ncit/terms.csv instead - NCIT:C16186 Orthopedic Surgical Procedure,
    NCIT:C15747 Supportive Care and NCIT:C15240 Genetic Counseling - which is why none
    of the three reached the file.

  No GeneReviews chapter exists for this disorder. Verified offline against
  cache/bookshelf/genereviews.csv, which indexes every PubMed-indexed chapter of the
  collection: grep for "missouri", "anadysplasia", "MMP13" and "metaphyseal dysplasia"
  returns no matching chapter. `just check-genereviews` on this file reports no
  GeneReviews gap.
review_notes: >-
  Lump/split. MONDO:0011198 carries both "spondyloepimetaphyseal dysplasia, Missouri
  type" and "metaphyseal anadysplasia 1" among its labels and synonyms, and this entry
  accepts that lumping rather than arguing it. The reason is that the 2026 case report
  states it directly - metaphyseal anadysplasia 1 "includes Spondyloepimetaphyseal
  dysplasia Missouri type" - and the ISDS 2023 Nosology's dyadic scheme divides
  MMP13-related metaphyseal dysplasia by inheritance pattern into two entities, not by
  these two historical names into three.

  The recessive MMP13 disease is deliberately NOT curated here, even though it shares
  the gene and much of the radiographic picture. It is a separate MONDO concept, its
  alleles sit in a different protein domain, and its short stature can persist into
  adulthood where the dominant form's improves. It is recorded as a differential
  diagnosis instead. If it is curated later it should be its own entry, not a subtype
  row here.

  One phenotype (Coxa vara) is evidenced from a recessive-form case report, and its
  evidence explanation says so. The alternative was to leave a real and reported
  feature of MMP13-related skeletal disease unrecorded, or to cite it to a paper that
  does not state it. Flagging the provenance in the explanation seemed the honest
  option, but a reviewer may prefer it removed.

  No treatment in this entry has trial evidence, because none exists. The orthopaedic
  management row deliberately carries no evidence block rather than a citation that
  would imply one.

pathophysiology:
- name: MMP13 Propeptide Misfolding
  description: >-
    A heterozygous missense substitution in the MMP13 proregion destabilizes the fold
    of the propeptide. For the founding F56S allele this was predicted from structural
    modelling as a hydrophobic cavity, then confirmed functionally. The disease alleles
    described since cluster in the same exon 2 region, which is the argument for a
    shared lesion rather than three unrelated ones.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: MMP13
    term:
      id: hgnc:7159
      label: MMP13
  biological_processes:
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  downstream:
  - target: Premature Intracellular Autoactivation and Autodegradation of MMP13
    causal_link_type: DIRECT
    description: >-
      The destabilized propeptide no longer holds the zymogen latent, so the enzyme
      activates before it leaves the cell.
    evidence:
    - reference: PMID:16167086
      reference_title: "MMP13 mutation causes spondyloepimetaphyseal dysplasia, Missouri type (SEMD(MO)."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "We predicted, by modeling MMP13 structure, that this F56S mutation would result in a hydrophobic cavity with misfolding, autoactivation, and degradation of mutant protein intracellularly."
      explanation: >-

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that a missense mutation of MMP13 causes the Missouri type of human spondyloepimetaphyseal dysplasia (SEMD(MO)), an autosomal dominant disorder characterized by defective growth and modeling of vertebrae and long bones."
    explanation: >-
      The gene-disease assertion, from the linkage and sequencing study that
      established it.
  - reference: PMID:40514045
    reference_title: "MMP13-related metaphyseal dysplasia: a differential diagnosis of rickets."
    supports: SUPPORT

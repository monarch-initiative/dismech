    snippet: "DNA sequence analysis revealed a missense mutation, F56S, that substituted an evolutionarily conserved phenylalanine residue for a serine in the proregion domain of MMP13."
    explanation: >-
      Places the founding lesion in the propeptide, which is what makes a folding
      defect the natural reading.
- name: Premature Intracellular Autoactivation and Autodegradation of MMP13
  description: >-
    Mutant MMP13 activates inside the cell instead of after secretion, and the
    activated enzyme then digests itself. Expression of wild-type and F56S MMP13 in
    human embryonic kidney cells showed that only enzymatically inactive small
    fragments are secreted. This is the step that converts a missense allele into an
    enzyme deficiency.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

  description: >-
    Correction of bowing, coxa vara and angular deformity where it is symptomatic or
    progressive. No disease-modifying therapy exists, and no trial evidence specific to
    MMP13-related metaphyseal dysplasia has been published; management is the general
    orthopaedic management of a metaphyseal dysplasia. This treatment is recorded
    because it is what patients receive, not because a study supports it in this
    disease, and it carries no evidence block for that reason.
  treatment_term:

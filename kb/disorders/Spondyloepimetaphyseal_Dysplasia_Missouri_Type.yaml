classifications:
  isds_skeletal_category:
  - classification_value: metaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger, Ferreira,
      Mortier et al., PMID:36779427), group 11 "Metaphyseal dysplasias", which lists
      MMP13-related metaphyseal dysplasia. The Nosology's 2023 dyadic scheme splits
      MMP13-related metaphyseal dysplasia by inheritance; this entry is the autosomal
      dominant member, historically named both SEMD Missouri type and metaphyseal
      anadysplasia 1. Note the entry name says "spondyloepimetaphyseal", which is the
      MONDO label, while the Nosology files the disorder under metaphyseal dysplasias
      - the vertebral involvement is variable and mild, and the group assignment
      follows the Nosology rather than the name.

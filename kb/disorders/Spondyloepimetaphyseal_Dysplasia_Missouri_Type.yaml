name: Spondyloepimetaphyseal Dysplasia Missouri Type
category: Mendelian
creation_date: "2026-09-22T13:00:00Z"
synonyms:
- SEMD Missouri type
- SEMD, Missouri type
- SEMDMO
- metaphyseal anadysplasia 1
- MANDP1
- MMP13-related autosomal dominant metaphyseal dysplasia
description: >-
  Spondyloepimetaphyseal dysplasia, Missouri type is an autosomal dominant skeletal
  dysplasia of the growth plate caused by heterozygous missense variants in MMP13,
  which encodes collagenase-3. Affected children have mild to moderate short stature,
  bowed femora, coxa vara, and wide, irregular metaphyses of the long tubular bones,
  with variable vertebral involvement. The metaphyseal changes are characteristically
  transient: they are most conspicuous in early childhood and regress with age, which
  is what the older name "metaphyseal anadysplasia" records.

  **The lesion is a folding defect in the prodomain, not a catalytic-site defect.**
  The disease-causing substitutions cluster in exon 2, in the MMP13 propeptide - F56S
  in the founding Missouri kindred, M71T and S73P in later families. Structural
  modelling of F56S predicted a hydrophobic cavity, and expression in human embryonic
  kidney cells confirmed the prediction: the mutant protein autoactivates and
  autodegrades inside the cell, so only enzymatically inactive small fragments ever
  reach the extracellular space. The net effect of a missense allele is therefore a
  deficiency of secreted active enzyme, reached by a route - premature intracellular
  activation - that a null allele does not take.

  **What the enzyme does is remove the cartilage template.** MMP13 is expressed by
  terminal hypertrophic chondrocytes and by osteoblasts, and type II collagen and
  aggrecan - the two major components of the cartilage extracellular matrix - are its
  in vivo substrates. When that degradation fails, chondrocytes still differentiate
  normally but their exit from the growth plate is delayed, so the hypertrophic zone
  persists and the metaphysis is remodelled abnormally. This makes the entry a case
  where the disease node is an *absent* process rather than a toxic one.

  **The transience has a mechanistic correlate in mouse.** In Mmp13-null mice the
  growth-plate phenotype worsens until about five weeks and then resolves completely
  by twelve weeks, while the increased trabecular bone persists for months. The
  time course parallels the human radiographic course closely enough to be worth
  recording, and the persistence of the trabecular change is a reminder that
  "resolves" describes the metaphyseal appearance rather than the whole skeletal
  consequence.

  **The nosological point.** MONDO:0011198 carries both "spondyloepimetaphyseal
  dysplasia, Missouri type" and "metaphyseal anadysplasia 1" as names for one concept.
  The 2026 literature endorses that lumping explicitly, and the ISDS 2023 dyadic
  naming scheme separates MMP13-related metaphyseal dysplasia into exactly two
  entities distinguished by inheritance rather than by these two historical names.
  The recessive counterpart - metaphyseal dysplasia, Spahr type - is a different
  disease with a different variant location and is not curated here.

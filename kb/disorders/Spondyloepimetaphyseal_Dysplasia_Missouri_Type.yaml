- name: Abnormal Metaphyseal Modelling of the Long Tubular Bones
  description: >-
    The clinical-radiographic node. Metaphyses of the long tubular bones are wide and
    irregular, with fraying, splaying and cupping; the femora bow, coxa vara develops,
    and vertebral modelling may be abnormal. Biochemistry is normal, which is what
    separates this from rickets at the bedside.

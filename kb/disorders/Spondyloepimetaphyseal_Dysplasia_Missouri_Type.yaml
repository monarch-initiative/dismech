    reference_title: "Altered endochondral bone development in matrix metalloproteinase 13-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Chondrocytes differentiated normally but their exit from the growth plate was delayed."
    explanation: >-
      The specific cellular abnormality in the Mmp13-null growth plate, and the basis
      for describing the lesion as a timing defect rather than a differentiation defect.
  - reference: PMID:15539485

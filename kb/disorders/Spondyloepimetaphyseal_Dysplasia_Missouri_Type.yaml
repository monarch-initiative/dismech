    explanation: >-
      The cell-based experiment that demonstrates the mechanism rather than predicting
      it, and that establishes the secreted product is inactive.
- name: Deficiency of Secreted Active Collagenase-3
  description: >-
    The extracellular pool of active MMP13 is reduced. The founding study states the
    conclusion in exactly these terms - the F56S substitution results in deficiency of
    MMP13. Note this is a deficiency reached through a gain of an aberrant behaviour
    inside the cell; the schema records the variant consequence as loss of function
    because that is the consequence for the enzyme's job.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

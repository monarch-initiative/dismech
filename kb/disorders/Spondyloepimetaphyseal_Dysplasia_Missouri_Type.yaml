- name: Failure of Growth-Plate Cartilage Matrix Degradation
  description: >-
    Type II collagen and aggrecan, the two major components of the cartilage
    extracellular matrix, are in vivo substrates of MMP13, and their degradation is a
    coordinated process in which MMP13 works synergistically with MMP9. With active
    MMP13 reduced, the hypertrophic-zone matrix is not cleared on schedule. Extracellular
    matrix remodelling is the rate-limiting step of endochondral bone formation, so a
    defect here is a defect in the pace of the whole process rather than in any one
    cell type's differentiation.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

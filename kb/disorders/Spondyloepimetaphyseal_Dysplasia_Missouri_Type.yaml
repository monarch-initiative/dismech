  - target: Pear-shaped vertebrae
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The vertebral body grows from endplate growth plates, so the same delayed exit of
      chondrocytes reaches the spine. Drawn with unknown intermediates: no source here
      shows the vertebral growth plate in this disorder, and the spine is affected far
      more mildly than the long-bone metaphyses, which the sources say without
      explaining.
  - target: Small epiphyses
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Epiphyseal size derives from growth at the secondary ossification centre, which is
      cartilage cleared by the same collagenase step. Unknown intermediates for the same
      reason as the vertebral edge, and epiphyseal involvement is likewise mild against
      moderate-to-severe metaphyseal change.

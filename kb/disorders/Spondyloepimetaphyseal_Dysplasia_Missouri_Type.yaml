inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous MMP13 missense variants segregate with the phenotype. The founding
    Missouri kindred was a multigenerational dominant pedigree; a later Swedish/Syrian
    family showed father-to-children transmission of p.Ser73Pro, and a de novo
    p.Met71Thr has been reported in a sporadic case.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

- name: Genetic counselling
  description: >-
    Autosomal dominant transmission with a 50 percent recurrence risk for an affected
    parent, and the possibility of a de novo allele in a sporadic case. Distinguishing
    the dominant from the recessive MMP13 entity changes the recurrence risk given to
    a family, which is the practical reason the dyadic split matters.
  treatment_term:

animal_models:
- name: Mmp13-null mouse
  species: Mouse
  genotype: Mmp13 homozygous null (homologous recombination)
  publication: PMID:15539485
  description: >-
    Germline inactivation of Mmp13. The model is informative for this entry in two
    ways at once: it identifies the in vivo substrates of the enzyme, and its growth
    plate phenotype has a rise-and-resolve time course that parallels the transience
    of the human radiographic findings.
  modeled_mechanisms:
  - target: Delayed Exit of Chondrocytes From the Growth Plate
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The null mouse reproduces the growth-plate abnormality and its self-limiting
      course.
    limitations: >-
      The allele is a null, while human dominant disease is caused by a heterozygous
      missense allele acting through premature intracellular autoactivation. The mouse
      therefore models the consequence of absent enzyme but not the route by which the
      human allele produces it, and it says nothing about whether the human missense
      product has any residual or aberrant activity.
    readouts:
    - name: Timing of chondrocyte exit from the growth plate
      target: Delayed Exit of Chondrocytes From the Growth Plate
      direction: ALTERED
      interpretation: >-
        Delayed exit with normal differentiation, which is the cellular signature of
        this node.
      evidence:
      - reference: PMID:15539485
        reference_title: "Altered endochondral bone development in matrix metalloproteinase 13-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Chondrocytes differentiated normally but their exit from the growth plate was delayed."
        explanation: >-
          The measured abnormality in the null growth plate.
  - target: Failure of Growth-Plate Cartilage Matrix Degradation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Identifies type II collagen and aggrecan as the in vivo substrates whose
      degradation fails, and the MMP9 synergy that buffers partial loss.
    readouts:
    - name: Trabecular bone mass
      target: Failure of Growth-Plate Cartilage Matrix Degradation
      direction: INCREASED
      interpretation: >-
        Increased trabecular bone that persists for months after the growth-plate
        abnormality has resolved. Conditional inactivation showed it arises
        independently of the cartilage matrix defect, so it is recorded as a separate
        consequence of Mmp13 loss rather than as a downstream effect of this node.
      evidence:
      - reference: PMID:15539485
        reference_title: "Altered endochondral bone development in matrix metalloproteinase 13-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mmp13-null mice had increased trabecular bone, which persisted for months."
        explanation: >-
          The persistent skeletal change, and the reason "resolves with age" should not
          be read as "leaves no trace".
  evidence:
  - reference: PMID:15539485
    reference_title: "Altered endochondral bone development in matrix metalloproteinase 13-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of Mmp13 in mice through homologous recombination led to abnormal skeletal growth plate development."
    explanation: >-
      Establishes that the mouse reproduces a growth-plate phenotype at all, which is
      the precondition for treating it as informative about this disease.
treatments:

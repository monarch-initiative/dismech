    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15539485
    reference_title: "Altered endochondral bone development in matrix metalloproteinase 13-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our studies identified the two major components of the cartilage ECM, collagen type II and aggrecan, as in vivo substrates for MMP13."
    explanation: >-
      Establishes what the missing enzyme was supposed to be degrading, in vivo rather
      than in a substrate assay.
  - reference: PMID:15539485
    reference_title: "Altered endochondral bone development in matrix metalloproteinase 13-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that degradation of cartilage collagen and aggrecan is a coordinated process in which MMP13 works synergistically with MMP9."
    explanation: >-
      Records that MMP13 does not act alone, which is why partial deficiency gives a
      mild and self-limiting phenotype rather than the severe one seen when both
      enzymes are absent.
  - reference: PMID:42142773
    reference_title: "The Interstitial Collagenases MMP13 and MMP14 Are Dispensable for the Early Onset of Skin Morphogenesis but Modulate Endochondral Ossification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "These findings indicate that MMP13 partly compensates for MMP14 during bone development, while both enzymes are unnecessary for postnatal dermal collagen remodeling."
    explanation: >-
      Read the DIRECTION of this sentence carefully. It says MMP13 compensates for
      MMP14, established by the double knockout being far worse than either single one.
      That is evidence that the collagenases of the growth plate are partly
      interchangeable, which is why a partial MMP13 deficiency is survivable and mild -
      but it is NOT evidence that MMP14 compensates for missing MMP13, which is the
      claim a reader wants here and which this paper does not make. Graded INDIRECT for
      that reason: the redundancy is demonstrated, its usefulness in the MMP13-deficient
      direction is an inference from it.
- name: Delayed Exit of Chondrocytes From the Growth Plate
  description: >-
    Chondrocytes differentiate normally - the lesion is not a differentiation block -
    but they leave the growth plate late. The hypertrophic zone is therefore retained
    and the ordered replacement of cartilage by bone at the metaphysis is desynchronized.
    In the Mmp13-null mouse this abnormality intensifies to about five weeks of age and
    then resolves completely by twelve weeks, a time course that parallels the transient
    metaphyseal changes seen radiographically in patients.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  cell_types:

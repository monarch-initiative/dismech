    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The severity of the Mmp13- null growth plate phenotype increased until about 5 weeks and completely resolved by 12 weeks of age."
    explanation: >-
      The time course that makes the mouse informative about why the human metaphyseal

    The assassination and self-harm route, delivered by pellet, needle or
    explosive device. It bypasses every absorption barrier, so the toxin
    distributes systemically and binds preferentially to the vasculature,
    producing the endothelial and coagulopathic picture rather than a mucosal
    one.

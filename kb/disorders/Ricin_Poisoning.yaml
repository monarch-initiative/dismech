animal_models:
- name: Murine intramuscular ricin intoxication
  species: Mouse
  publication: PMID:31208156
  description: >-
    Lethal intramuscular ricin in mice, used to characterise the systemic rather
    than the mucosal face of the disease. It reproduces the coagulopathy,
    thrombocytopenia and multi-organ haemorrhage of parenteral human poisoning
    and adds structural cardiac injury with measurable functional impairment.
  modeled_mechanisms:
  - target: Endothelial Glycocalyx Shedding and Microvascular Hyperpermeability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model is where the glycocalyx-shedding account of systemic ricin
      poisoning was established, alongside swine.
    limitations: >-
      Mouse, and a single lethal bolus dose by a route that in humans is
      documented in essentially one case. Whether human parenteral poisoning
      shows the same glycocalyx kinetics is untested.
    readouts:
    - name: Circulating heparan sulfate, hyaluronic acid and syndecan-1
      target: Endothelial Glycocalyx Shedding and Microvascular Hyperpermeability
      direction: INCREASED
      interpretation: Shed glycocalyx components measured in blood as the direct readout of the node.
      evidence:
      - reference: PMID:34830227
        reference_title: "Intramuscular Exposure to a Lethal Dose of Ricin Toxin Leads to Endothelial Glycocalyx Shedding and Microvascular Flow Abnormality in Mice and Swine."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Elevated levels of soluble heparan sulfate, hyaluronic acid and syndecan-1 were measured in blood samples following ricin intoxication"
        explanation: Reports the measurement in the direction this readout records.
    evidence:
    - reference: PMID:34830227
      reference_title: "Intramuscular Exposure to a Lethal Dose of Ricin Toxin Leads to Endothelial Glycocalyx Shedding and Microvascular Flow Abnormality in Mice and Swine."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ricin bound preferentially to the vasculature in both mice and swine, leading to coagulopathy and widespread hemorrhages"
      explanation: >-
        Supports the model as informative for this node, and notes the finding
        held in two species rather than one.
  evidence:
  - reference: PMID:31208156
    reference_title: "Intramuscular Ricin Poisoning of Mice Leads to Widespread Damage in the Heart, Spleen, and Bone Marrow."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The present study applies various biochemical, hematological, histopathological, molecular, and functional approaches to broadly investigate the systemic effects of parenteral intoxication by a lethal dose of ricin in a murine model."
    explanation: Describes the model and what it was built to measure.
  - reference: PMID:31208156
    reference_title: "Intramuscular Ricin Poisoning of Mice Leads to Widespread Damage in the Heart, Spleen, and Bone Marrow."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the heart, diffuse hemorrhages, myocyte necrosis, collagen deposition, and induction in fibrinogen were observed."
    explanation: >-
      The cardiac lesion of this model. Recorded here rather than under
      `histopathology:`, which holds human autopsy findings, so the species is
      not lost on a reader scanning that section. It matters because the one
      well-documented human parenteral case was read at autopsy as cardiac
      arrest from necrosis of the conducting tissue, which this lesion makes
      mechanistically plausible without confirming.
  - reference: PMID:31208156
    reference_title: "Intramuscular Ricin Poisoning of Mice Leads to Widespread Damage in the Heart, Spleen, and Bone Marrow."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Severe functional impairment was manifested by marked thickening of the left ventricular wall, decreased ventricular volume, and a significant reduction in stroke volume and cardiac output."
    explanation: The functional consequence measured alongside that histology.
  - reference: PMID:31208156
    reference_title: "Intramuscular Ricin Poisoning of Mice Leads to Widespread Damage in the Heart, Spleen, and Bone Marrow."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unexpectedly, the differential severity of the ricin-induced damage did not correlate with the respective ricin-dependent catalytic activity measured in the various organs."
    explanation: >-
      A caveat worth keeping with the model: organ damage did not track local
      enzymatic activity, so the simple "more depurination, more damage" reading
      of systemic poisoning is not what the data show.
- name: Murine pulmonary ricinosis
  species: Mouse
  publication: PMID:38773158
  description: >-
    Intranasal or aerosolised ricin in mice, at sublethal or lethal doses. This
    is the principal model for the inhalational syndrome, and essentially the
    only source of information about it, since human inhalational poisoning has
    no published case series.
  modeled_mechanisms:
  - target: Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the full lesion - interstitial pneumonia, local cytokine storm,
      neutrophil influx, oedema and epithelial death - with measurable loss of
      lung function.
    limitations: >-
      Fidelity to the human disease cannot be assessed, because there is no
      human inhalational case series to compare it against. The inhalation
      models also differ among themselves: exposure method, aerosol
      characteristics, ricin cultivar and purity, dose and species all vary, and
      the review of them says the resulting pathology is broadly similar rather
      than identical.
    readouts:
    - name: Lung histopathology and physiological function
      target: Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
      direction: ALTERED
      interpretation: Paired structural and functional readout of the acute lung injury node.
      evidence:
      - reference: PMID:38773158
        reference_title: Short- and long-term outcomes of pulmonary exposure to a sublethal dose of ricin in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This damage was manifested in reduced lung performance and physiological function."
        explanation: The functional half of the readout.
    evidence:
    - reference: PMID:38773158
      reference_title: Short- and long-term outcomes of pulmonary exposure to a sublethal dose of ricin in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "sublethal exposure of mice to ricin resulted in acute lung injury, including interstitial pneumonia, cytokine storm, neutrophil influx, edema and cellular death"
      explanation: Supports the model as informative for this node by naming every component it reproduces.
  - target: Residual Pulmonary Fibrosis in Survivors
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The only evidence anywhere that survivors of pulmonary ricin exposure carry
      long-term damage.
    limitations: >-
      Fidelity is marked LOW because susceptibility to pulmonary fibrosis, and
      the character of the fibrosis that develops, differ by species and strain
      - which the inhalation-model review names explicitly as a reason to choose
      the model carefully for chronic work. There is no human counterpart at all.
    evidence:
    - reference: PMID:37104219
      reference_title: Comparative Aspects of Ricin Toxicity by Inhalation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "these factors need to be considered when choosing a model for chronic ricin toxicity by inhalation, including species and strain susceptibility to fibrosis"
      explanation: The basis for the LOW fidelity grade on this link.
  evidence:
  - reference: PMID:38773158
    reference_title: Short- and long-term outcomes of pulmonary exposure to a sublethal dose of ricin in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the purpose of current study was to assess short- and long-term effects on physiological parameters and function following sublethal pulmonary exposure"
    explanation: States what the model was built to answer.
- name: Swine ricin intoxication by intratracheal and intramuscular routes
  species: Pig
  publication: PMID:32481526
  description: >-
    Swine were chosen over rodents for post-exposure countermeasure work because
    their cardiovascular and pulmonary systems resemble the human, and the model
    is where pulmonary ricin exposure was shown to produce genuine acute
    respiratory distress syndrome rather than a rodent approximation of it.
  modeled_mechanisms:
  - target: Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The large-animal demonstration that the pulmonary lesion meets ARDS
      criteria.
    limitations: >-
      Still an animal model of a syndrome with no human case series, so the
      resemblance argument rests on organ physiology rather than on any
      comparison with human ricin disease. Post-exposure protection experiments
      in this species also need far more antitoxin than the mouse, so efficacy
      figures do not transfer between the two models.
    evidence:
    - reference: PMID:32481526
      reference_title: Post-Exposure Anti-Ricin Treatment Protects Swine Against Lethal Systemic and Pulmonary Exposures.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the swine animal model served us in the past to determine that pulmonary exposure to ricin leads to the development of bona fide acute respiratory distress syndrome"
      explanation: Supports the model as informative for this node, at the level of the ARDS endpoint.
  evidence:
  - reference: PMID:32481526
    reference_title: Post-Exposure Anti-Ricin Treatment Protects Swine Against Lethal Systemic and Pulmonary Exposures.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Due to the high resemblance between the human and porcine cardiovascular and pulmonary systems"
    explanation: The stated reason for choosing this species, which is what its fidelity claim rests on.
discussions:
- discussion_id: host_genetic_modifiers_of_cellular_susceptibility
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do the host genetic factors that determine cellular susceptibility to ricin
    translate into any difference in human clinical susceptibility?
  attaches_to:
  - pathophysiology#RTB Lectin Binding to Cell-Surface Galactosylated Glycoconjugates
  - pathophysiology#Retrograde Transport from the Golgi to the Endoplasmic Reticulum
  rationale: >-
    Cellular susceptibility to ricin has a real, mapped genetic architecture.
    Fucosylation controls it: losing the Golgi GDP-fucose transporter SLC35C1 or
    the fucosyltransferase FUT9 makes diverse cell types resistant, and cells
    from a patient with inherited SLC35C1 deficiency are resistant too.
    Sialylation of Lewis X structures runs the same axis in the opposite
    direction - inactivating the responsible sialyltransferase sensitises cells,
    overexpressing it protects them. The retrograde-transport machinery is a
    second axis, with STX5 and its ER-targeting factor ASNA1 among the top hits
    conferring resistance in genome-wide screens.

    Every one of those results is a statement about cells. Whether any of it
    shifts the dose of ricin a person survives is untested, and probably
    untestable by design - human exposure is rare, accidental or deliberate, and
    the delivered dose is never known. The gap is worth recording precisely
    because the cell-level evidence is strong enough to be mistaken for a
    susceptibility claim. It is also the reason this entry has no `genetic:`
    section: these are modifiers of a toxicological process, not disease genes.
  notes: >-
    The SLC35C1-deficient patient result is the closest thing to human data in
    this area, and it is an ex vivo cellular phenotype from a person with a
    congenital disorder of glycosylation, not an observation of ricin exposure
    in a person.
  evidence:
  - reference: PMID:28925387
    reference_title: A vital sugar code for ricin toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genetic and pharmacological inhibition of fucosylation renders diverse cell types resistant to ricin via deregulated intracellular trafficking. Importantly, cells from a patient with SLC35C1 deficiency are also resistant to ricin."
    explanation: The fucosylation axis, including the one human-derived cellular result.
  - reference: PMID:28925387
    reference_title: A vital sugar code for ricin toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inactivation of the sialyltransferase responsible for modifications of Lewis X (St3Gal4) increases the sensitivity of cells to ricin, whereas its overexpression renders cells more resistant to the toxin."
    explanation: The sialylation axis, in both directions.
  - reference: PMID:31674906
    reference_title: Retro-2 protects cells from ricin toxicity by inhibiting ASNA1-mediated ER targeting and insertion of tail-anchored proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our previous genome-wide CRISPR/Cas9 deletions screens have identified STX5 and its ER targeting factor, ASNA1 (also known as TRC40) among the top hits that confer resistance to ricin"
    explanation: The trafficking-machinery axis, from genome-wide screens.
  - reference: PMID:28925387
    reference_title: A vital sugar code for ricin toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Although multiple cellular factors that are required for ricin toxicity have been identified, they often depend on cell type and organism of origin, as well as duration and amount of ricin exposure"
    explanation: >-
      Supports the caution in this gap - the host factors identified are
      themselves context-dependent, which is a further step away from an
      organismal susceptibility claim.
- discussion_id: inhalational_syndrome_known_only_from_animals
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the animal picture of inhalational ricinosis describe human
    inhalational ricin poisoning, given that no human case series exists to
    compare it against?
  attaches_to:
  - pathophysiology#Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
  - pathophysiology#Residual Pulmonary Fibrosis in Survivors
  rationale: >-
    Everything this entry records about the inhalational syndrome - the
    interstitial pneumonia, the neutrophil influx, the proteinaceous oedema, the
    progression to ARDS, the residual fibrosis in survivors - comes from mice,
    rabbits, rhesus macaques and swine. This is not the ordinary situation where
    an animal model stands in for a well-described human disease; there is no
    human description to stand in for.

    Two things make the mismatch substantive rather than formal. The models
    disagree among themselves: exposure method, breathing parameters, aerosol
    characteristics, ricin cultivar and purity, challenge dose and study
    duration all vary, and so do the species' anatomy, cell biology and
    immunology, which is why the comparative review calls the pathology broadly
    similar rather than the same. And the chronic endpoint is the one most
    exposed to species choice - susceptibility to pulmonary fibrosis and the
    character of the fibrosis that develops are themselves properties of the
    strain, so "survivors may be left with fibrosis" is a claim whose truth may
    depend on which animal was asked.
  notes: >-
    Recorded as `HUMAN_MODEL_MISMATCH` rather than `KNOWLEDGE_GAP` because the
    evidence is not absent - it is abundant, and its translational validity is
    the open question. Resolving it does not require a human challenge study:
    a harmonised multi-species protocol, or a documented human exposure with
    imaging and follow-up, would both narrow it.
  evidence:
  - reference: PMID:37104219
    reference_title: Comparative Aspects of Ricin Toxicity by Inhalation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "The toxicity and associated pathology described in animal models are broadly similar, but variation appears to exist."
    explanation: States the between-model variation that is half of this mismatch.
  - reference: PMID:37104219
    reference_title: Comparative Aspects of Ricin Toxicity by Inhalation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Methodological variation is evident, including method of exposure, breathing parameters during exposure, aerosol characteristics, sampling protocols, ricin cultivar, purity and challenge dose and study duration."
    explanation: Enumerates the methodological sources of that variation.
  - reference: PMID:37104219
    reference_title: Comparative Aspects of Ricin Toxicity by Inhalation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "The model species and strain used represent other significant sources of variation, including differences in macro- and microscopic anatomy, cell biology and function, and immunology."
    explanation: The species-biology sources, which are the ones that bear on translation to humans.
  - reference: PMID:37104219
    reference_title: Comparative Aspects of Ricin Toxicity by Inhalation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Chronic pathology of ricin toxicity by inhalation, associated with sublethal challenge or lethal challenge and treatment with medical countermeasures, has received less attention in the literature."
    explanation: >-
      Supports singling out the chronic endpoint as the weakest link, which is
      why the fibrosis node carries a LOW-fidelity model link.
- discussion_id: hypoglycemia_human_status
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is ricin-induced hypoglycaemia a feature of human poisoning, or an artefact
    of the murine parenteral model?
  attaches_to:
  - pathophysiology#Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase
  - phenotypes#Hypoglycemia
  rationale: >-
    In mice, parenteral ricin causes profound hypoglycaemia that is the only
    laboratory abnormality for hours, and the mechanism has been worked out to
    the level of hepatic glucose-6-phosphatase suppression with a
    streptozotocin control ruling out an insulin-mediated route. That is a more
    complete mechanistic account than most of this entry carries.

    The positive human evidence is one clinical report that mentions
    hypoglycaemia without indicating whether anything was done about it. If the
    finding is real in humans it would be a cheap early marker of systemic
    exposure in exactly the situation - suspected deliberate poisoning, no
    exposure history - where the diagnosis is hardest. If it is murine, the
    phenotype recorded here should eventually be retired. Retrospective review
    of glucose values in published human cases would settle it without any new
    exposure, and the authors report that their own follow-up with those
    papers' authors failed.

    The mouse result is not unopposed. The same authors did not see
    hypoglycaemia in macaques exposed to aerosolised ricin, and note that
    inflammatory responses in mice and humans broadly differ. That negative
    changes both species and route at once, so it isolates neither - but it is
    why this reads as an open question rather than as a human finding awaiting
    measurement.
  evidence:
  - reference: PMID:36548717
    reference_title: "Parenteral Exposure of Mice to Ricin Toxin Induces Fatal Hypoglycemia by Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase Expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we sought a humane endpoint to replace lethal challenge by searching for biomarkers of ricin toxicosis. We found that following intraperitoneal (ip) injection of ricin, the sole biochemical abnormality observed in the serum of mice was the rapid development of profound hypoglycemia"
    explanation: The murine finding, and the fact that it was sought as a biomarker rather than found incidentally.
  - reference: PMID:36548717
    reference_title: "Parenteral Exposure of Mice to Ricin Toxin Induces Fatal Hypoglycemia by Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase Expression."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "At least one clinical report of ricin toxicosis describes hypoglycemia, but does not indicate whether specific measures were taken to control the low blood glucose in this patient"
    explanation: >-
      The entirety of the positive non-murine evidence, and the reason this is
      filed as a gap rather than as a settled human phenotype.
  - reference: PMID:36548717
    reference_title: "Parenteral Exposure of Mice to Ricin Toxin Induces Fatal Hypoglycemia by Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase Expression."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "We did not observe hypoglycemia in macaques exposed to aerosolized ricin"
    explanation: >-
      The same authors' negative result, in a primate and by a different route.
      It cuts against the finding generalising, and is why this gap is open
      rather than merely unmeasured in humans.
  - reference: PMID:36548717
    reference_title: "Parenteral Exposure of Mice to Ricin Toxin Induces Fatal Hypoglycemia by Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase Expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Whether this path would occur in humans is not known. Inflammatory responses in mice and humans are known to broadly differ"
    explanation: >-
      The authors state the translational uncertainty themselves, and name the
      species difference that drives it.

    response, which is required for apoptosis in non-transformed epithelium.
    Death is not confined to intoxicated cells - dying cells release ricin, Fas
    ligand and HMGB1 that kill neighbouring epithelium by necroptosis, which is
    how a small delivered dose destroys a whole epithelial surface.

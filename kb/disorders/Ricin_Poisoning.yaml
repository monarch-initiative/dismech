- name: Endothelial Glycocalyx Shedding and Microvascular Hyperpermeability
  biological_scale: TISSUE
  description: >-
    After parenteral exposure ricin binds preferentially to the vasculature.
    Circulating heparan sulfate, hyaluronic acid and syndecan-1 rise, marking
    extensive degradation of the endothelial glycocalyx; VEGF rises and
    endothelial VE-cadherin falls, so interendothelial junctions fail and
    organs become hyperpermeable. Intravital imaging shows aberrant blood flow
    and a fall in the number of perfused microvessels. Clinically this is the
    capillary leak syndrome, coagulopathy and widespread hemorrhage of severe
    systemic poisoning.
  downstream:
  - target: Capillary leak
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  - target: Abnormality of coagulation
    causal_link_type: DIRECT
  - target: Abnormal bleeding
    causal_link_type: DIRECT
  - target: Distributive and Hypovolemic Shock with Multi-Organ Failure
    causal_link_type: DIRECT
    description: >-
      Loss of vascular barrier function and microvascular perfusion is the
      second, parenteral-dominant route into shock.
    evidence:
    - reference: PMID:34830227
      reference_title: "Intramuscular Exposure to a Lethal Dose of Ricin Toxin Leads to Endothelial Glycocalyx Shedding and Microvascular Flow Abnormality in Mice and Swine."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings, which suggest that glycocalyx shedding and microcirculation dysfunction play a major role in the pathology of systemic ricin poisoning"
      explanation: The authors' own statement that this node drives systemic pathology.
  cell_types:

clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The route of exposure, not the severity of the illness, is what this level
    records. Most ingestion cases recover fully with supportive care, and only
    six of fifty published cases died; inhalational and parenteral exposures
    have lethal doses roughly three orders of magnitude lower, and untreated
    severe exposure by any route reaches shock and multi-organ failure within
    one to three days with no antidote available. No single low, moderate or
    high level is representative of that spread, which is what `VARIABLE` is
    for.
  notes: >-
    `HIGH` is defensible on the strength of the mortality-risk clause in its own
    definition, and an earlier draft used it. It was changed because the
    route-dependence here is the clinically important fact rather than a
    complication of stating one, and because the rest of this entry works to
    preserve that distinction - three separately stratified `environmental:`
    entries and a `HUMAN_MODEL_MISMATCH` discussion about the inhalational
    syndrome being known only from animals. A single level would flatten the one
    thing the entry is most careful about.
  evidence:
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The available evidence suggests a relatively consistent clinical course, characterized by rapid progression from mild, nonspecific gastrointestinal symptoms to hypovolemic shock, multi-organ failure, and refractory cardiovascular collapse."
    explanation: States the course that this burden level reflects, from a systematic review of fatal cases.
  - reference: PMID:34830227
    reference_title: "Intramuscular Exposure to a Lethal Dose of Ricin Toxin Leads to Endothelial Glycocalyx Shedding and Microvascular Flow Abnormality in Mice and Swine."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "inhalatory and parenteral intoxications are associated with greater illness and mortality, and are characterized by lethal doses that are roughly three magnitudes lower than that of oral poisoning"
    explanation: Quantifies the route dependence that makes this burden level route-conditional rather than uniform.
pathophysiology:
- name: Ricin Delivery to Host Tissue
  biological_scale: ORGANISM
  description: >-
    The exposure event. Ricin-containing material reaches host tissue by one of
    four routes - ingestion of chewed or crushed castor seeds, inhalation of
    aerosolised toxin or seed dust, parenteral injection, and rarely ocular or
    abraded-skin contact. The molecular mechanism that follows is identical
    whichever route delivers the toxin; what differs is the dose that reaches
    the circulation and the tissue that receives the highest local burden, which
    is why lethal doses by inhalation and injection are roughly a thousandfold
    lower than by mouth.
  notes: >-
    Carries no ontology-bound process descriptor: the node denotes an exposure
    event rather than a host biological process. The exposures themselves are
    grounded in the `environmental:` block, which splits them by route.
  downstream:
  - target: RTB Lectin Binding to Cell-Surface Galactosylated Glycoconjugates
    causal_link_type: DIRECT
    description: >-
      Whatever the route, the first host-side event is the B chain engaging
      galactose-terminated glycoconjugates on the nearest cell surface.
    evidence:
    - reference: PMID:39453188
      reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "RTB acts as a galactose-specific lectin, binding to glycolipids and glycoproteins on the cell surface through their terminal galactose or N-acetylgalactosamine residues."
      explanation: Names the binding step that follows delivery, which is what this edge asserts.
  chemical_entities:
  - preferred_term: ricin holotoxin
    term:
      id: CHEBI:8852
      label: Ricin
  evidence:
  - reference: PMID:34830227
    reference_title: "Intramuscular Exposure to a Lethal Dose of Ricin Toxin Leads to Endothelial Glycocalyx Shedding and Microvascular Flow Abnormality in Mice and Swine."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Exposure to ricin can occur by oral ingestion, inhalation or parenteral intoxication, while the features and severity of ricin toxicity vary markedly with the route of exposure."
    explanation: States both halves of this node - the routes, and that route sets severity.
  - reference: PMID:34830227
    reference_title: "Intramuscular Exposure to a Lethal Dose of Ricin Toxin Leads to Endothelial Glycocalyx Shedding and Microvascular Flow Abnormality in Mice and Swine."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "inhalatory and parenteral intoxications are associated with greater illness and mortality, and are characterized by lethal doses that are roughly three magnitudes lower than that of oral poisoning"
    explanation: Quantifies the thousandfold route difference this description asserts.
- name: RTB Lectin Binding to Cell-Surface Galactosylated Glycoconjugates
  biological_scale: MOLECULAR
  description: >-
    The B chain is a galactose and N-acetylgalactosamine-specific lectin. It
    binds terminal galactose residues on both glycoproteins and glycolipids,
    which is why ricin has essentially no cell-type selectivity - every
    nucleated cell displays suitable ligands. The promiscuity of this step is
    what makes the toxin's organ distribution a function of delivery rather than
    of receptor expression.
  downstream:
  - target: Endocytic Internalization of the Ricin Holotoxin
    causal_link_type: DIRECT
    description: >-
      Surface binding commits the holotoxin to whichever endocytic routes the
      bound cell operates.
    evidence:
    - reference: PMID:11111920
      reference_title: "Ricin transport into cells: studies of endocytosis and intracellular transport."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "The plant toxin ricin binds to both glycoproteins and glycolipids with terminal galactose, and the toxin will therefore be endocytosed by the different mechanisms operating in a given cell."
      explanation: >-
        States the causal link directly - binding is what commits the toxin to
        endocytosis, by whichever mechanisms that cell happens to run.
  molecular_functions:
  - preferred_term: galactoside binding by the ricin B chain
    term:
      id: GO:0016936
      label: galactoside binding
  chemical_entities:
  - preferred_term: ricin holotoxin
    term:
      id: CHEBI:8852
      label: Ricin
  evidence:
  - reference: PMID:39453188
    reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "RTB acts as a galactose-specific lectin, binding to glycolipids and glycoproteins on the cell surface through their terminal galactose or N-acetylgalactosamine residues."
    explanation: Names the ligand class and both carrier types this node asserts.
  - reference: PMID:36548717
    reference_title: "Parenteral Exposure of Mice to Ricin Toxin Induces Fatal Hypoglycemia by Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase Expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "the B chain binds promiscuously to cell surface glycans via galactose-specific lectin binding"
    explanation: >-
      Source of the promiscuity claim, which is the part of this node that
      explains why ricin has no cell-type selectivity.
- name: Endocytic Internalization of the Ricin Holotoxin
  biological_scale: CELLULAR
  description: >-
    Bound holotoxin is taken into the cell by the endocytic mechanisms available
    to it, clathrin-dependent and clathrin-independent alike, and delivered to
    endosomes. Only a very small fraction of internalised toxin escapes the
    degradative route; most is destroyed, and the potency of the surviving
    minority is what makes the toxin lethal at microgram doses.
  downstream:
  - target: Retrograde Transport from the Golgi to the Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      From the endosome the toxin is carried onward to the Golgi apparatus by a
      route distinct from the one mannose-6-phosphate receptors use.
    evidence:
    - reference: PMID:11111920
      reference_title: "Ricin transport into cells: studies of endocytosis and intracellular transport."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "After endocytosis the toxin is transported to the Golgi apparatus by a process that differs from the Rab9-dependent transport of mannose-6-phosphate receptors."
      explanation: States the post-endocytic step this edge asserts, and that it is a distinct route.
  biological_processes:
  - preferred_term: endocytosis of the ricin holotoxin
    modifier: INCREASED
    term:
      id: GO:0006897
      label: endocytosis
  evidence:
  - reference: PMID:21527639
    reference_title: Dislocation of ricin toxin A chains in human cells utilizes selective cellular factors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Ricin enters cells via endocytosis, where only a minute number of ricin molecules reach the endoplasmic reticulum (ER) lumen."
    explanation: >-
      States both the entry mechanism and the small surviving fraction that this
      node records.
- name: Retrograde Transport from the Golgi to the Endoplasmic Reticulum
  biological_scale: CELLULAR
  description: >-
    The toxin travels backwards along the secretory pathway - endosome to
    trans-Golgi network to Golgi to endoplasmic reticulum - instead of being
    routed to the lysosome. This detour is not incidental: reaching the ER lumen
    is a precondition for the A chain to reach the cytosol, and blocking the
    early-endosome-to-TGN step alone protects animals from otherwise lethal
    ricin.
  downstream:
  - target: Disulfide Reduction of the Holotoxin in the ER Lumen
    causal_link_type: DIRECT
    description: >-
      Arrival in the ER lumen is what makes the subsequent reduction and
      dislocation into the cytosol possible.
    evidence:
    - reference: PMID:11111920
      reference_title: "Ricin transport into cells: studies of endocytosis and intracellular transport."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "Retrograde toxin transport from the Golgi apparatus to the endoplasmic reticulum (ER) seems to be a requirement for subsequent toxin translocation to the cytosol where the toxin inhibits protein synthesis enzymatically."
      explanation: States the requirement relation this edge asserts.
  biological_processes:
  - preferred_term: retrograde transport of ricin from the Golgi to the ER
    modifier: INCREASED
    term:
      id: GO:0006890
      label: "retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum"
  evidence:
  - reference: PMID:20403321
    reference_title: Inhibition of retrograde transport protects mice from lethal ricin challenge.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "To gain access to their cytosolic target, ribosomal RNA, these toxins follow the retrograde transport route from the plasma membrane to the endoplasmic reticulum, via endosomes and the Golgi apparatus."
    explanation: Names the full itinerary this node describes.
  - reference: PMID:20403321
    reference_title: Inhibition of retrograde transport protects mice from lethal ricin challenge.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, one compound clearly protects from lethal nasal exposure to ricin."
    explanation: >-
      Supports the claim that this step is required rather than incidental -
      blocking it alone rescued animals from a lethal challenge. Marked indirect
      because it is a therapeutic response cited as validation of the mechanism
      it targets, which is an inference rather than a direct measurement of the
      step.
- name: Disulfide Reduction of the Holotoxin in the ER Lumen
  biological_scale: MOLECULAR
  description: >-
    In the ER lumen the single disulfide bond joining the two chains is reduced,
    liberating the A chain from the lectin that carried it there. This is a
    separate step from the membrane crossing that follows, and is cited
    separately: the human-cell study that worked out the dislocation mechanism
    does not describe the reduction.
  downstream:
  - target: Retrotranslocation of the A Chain into the Cytosol
    causal_link_type: DIRECT
    description: >-
      A free A chain is what crosses the membrane; the reduction is what frees it.
    evidence:
    - reference: PMID:39453188
      reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "where the disulfide bond is reduced. The A chain is then translocated into the cytoplasm, where it exhibits its enzymatic activity."
      explanation: States the ordering this edge asserts - reduction, then translocation.
  evidence:
  - reference: PMID:39453188
    reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "ricin is internalized and transported retrogradely to the endoplasmic reticulum, where the disulfide bond is reduced."
    explanation: Places the reduction in the ER lumen, which is what this node asserts.
- name: Retrotranslocation of the A Chain into the Cytosol
  biological_scale: MOLECULAR
  description: >-
    The liberated A chain crosses the ER membrane into the cytosol by a
    dislocation process that co-opts the machinery the cell uses to dispose of
    misfolded proteins. It is not simply the canonical ERAD route: in human
    cells it proceeds through a membrane-integrated intermediate and depends on
    the ER protein SEL1L. Once in the cytosol the chain refolds into its active
    conformation rather than being degraded.
  downstream:
  - target: Depurination of the Sarcin-Ricin Loop of 28S rRNA
    causal_link_type: DIRECT
    description: >-
      A refolded cytosolic A chain immediately begins depurinating ribosomes, at
      a catalytic rate that makes very few molecules sufficient.
    evidence:
    - reference: PMID:23133670
      reference_title: Identification of small molecules that suppress ricin-induced stress-activated signaling pathways.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "Once in the cytoplasm, RTA refolds into its enzymatically active conformation and initiates ribosome depurination at a rate estimated to exceed 1500/min"
      explanation: States that cytosolic arrival initiates depurination, and gives the rate this entry quotes.
  biological_processes:
  - preferred_term: dislocation of the ricin A chain across the ER membrane
    modifier: INCREASED
    term:
      id: GO:0030970
      label: "retrograde protein transport, ER to cytosol"
  evidence:
  - reference: PMID:21527639
    reference_title: Dislocation of ricin toxin A chains in human cells utilizes selective cellular factors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Subsequently, the ricin A chain traverses the ER bilayer by a process referred to as dislocation or retrograde translocation to gain access to the cytosol."
    explanation: Names the process this node describes.
  - reference: PMID:21527639
    reference_title: Dislocation of ricin toxin A chains in human cells utilizes selective cellular factors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ricin A chain dislocation occurred via a membrane-integrated intermediate and utilized the ER protein SEL1L for transport across the ER bilayer to inhibit protein synthesis"
    explanation: >-
      The experimental result behind the claim that this is not the canonical
      ERAD route, measured in a human cell system.
- name: Depurination of the Sarcin-Ricin Loop of 28S rRNA
  biological_scale: MOLECULAR
  description: >-
    The catalytic lesion. The A chain is an rRNA N-glycosidase (EC 3.2.2.22)
    that hydrolyses the N-glycosidic bond of one universally conserved adenine -
    A4324 in the rat numbering - in the sarcin-ricin loop of 28S rRNA within the
    60S subunit. The phosphodiester backbone is left intact; a single base is
    removed. Because the enzyme turns over rather than being consumed, one
    molecule inactivates ribosomes at a rate estimated above 1,500 per minute,
    and the lesion is irreversible for the affected ribosome.
  downstream:
  - target: Arrest of Translational Elongation
    causal_link_type: DIRECT
    description: >-
      The sarcin-ricin loop is part of the GTPase centre that elongation factors
      engage, so removing its adenine abolishes elongation-factor binding.
    evidence:
    - reference: PMID:36828415
      reference_title: Medical Countermeasures against Ricin Intoxication.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "Ricin inhibits peptide chain elongation via disruption of the binding between elongation factors and ribosomes"
      explanation: States the mechanism by which the lesion arrests elongation, which is this edge.
    - reference: PMID:40987586
      reference_title: Depurination of sarcin/ricin loop 25S rRNA is signaled through the small ribosomal subunit during translation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "25S rRNA depurination inhibited translation elongation, as shown by reduced incorporation of a methionine analog and binding of eukaryotic elongation factor 2 (eEF2) to ribosomes."
      explanation: >-
        Direct measurement of the depurination-to-elongation-arrest step, but
        performed in yeast using pokeweed antiviral protein rather than ricin -
        a different N-glycosidase acting on the same loop - so the inference to
        ricin in human cells is one step removed.
  - target: Ribotoxic Stress Response and Stress-Activated Kinase Signaling
    causal_link_type: DIRECT
    description: >-
      The damaged loop is itself a signal. This branch runs in parallel with
      elongation arrest rather than downstream of it.
    evidence:
    - reference: PMID:23133670
      reference_title: Identification of small molecules that suppress ricin-induced stress-activated signaling pathways.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "As a direct consequence of rRNA depurination, RTA activates the so-called ribotoxic stress response (RSR)"
      explanation: States the depurination-to-RSR link, and that it is a direct consequence.
  molecular_functions:
  - preferred_term: rRNA N-glycosidase activity of the ricin A chain
    term:
      id: GO:0030598
      label: rRNA N-glycosylase activity
  evidence:
  - reference: PMID:27879643
    reference_title: Structures and Ribosomal Interaction of Ribosome-Inactivating Proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ribosome-inactivating proteins (RIPs) including ricin, Shiga toxin, and trichosanthin, are RNA N-glycosidases that depurinate a specific adenine residue (A-4324 in rat 28S ribosomal RNA, rRNA) in the conserved α-sarcin/ricin loop (α-SRL) of rRNA."
    explanation: Names the enzyme class, the specific adenine, and the loop this node is about.
  - reference: PMID:39453188
    reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "RTA functions as an rRNA N-glycosylase (EC 3.2.2.22), specifically cleaving an adenine residue from the 28S ribosomal RNA in the 60S ribosomal subunit"
    explanation: Gives the EC number and locates the target in the 60S subunit.
  - reference: PMID:32481526
    reference_title: Post-Exposure Anti-Ricin Treatment Protects Swine Against Lethal Systemic and Pulmonary Exposures.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The A chain possesses RNA N-glycosidase activity that irreversibly inactivates the 28S rRNA of the mammalian 60S ribosome subunit"

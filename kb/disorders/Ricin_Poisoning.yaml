diagnosis:
- name: Exposure history with a compatible acute syndrome
  description: >-
    The practical route to the diagnosis. Ricin has no bedside test - the
    confirmatory assays below are reference-laboratory mass spectrometry - so
    recognition rests on a history of castor seed or castor product exposure
    together with an otherwise unexplained acute gastroenteritis, acute
    respiratory illness or shock. Where no exposure history is available - which
    is the case in deliberate poisoning - early toxicological investigation is
    what makes the diagnosis at all.
  evidence:
  - reference: PMID:33711365
    reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The questioning of patients and family made it possible to retrieve an history of castor seeds or castor oil ingestion"
    explanation: States how the diagnosis was actually reached across the collected human cases.
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "emphasizing the importance of early toxicological investigations, particularly when no history of exposure is available"
    explanation: Names the case where history fails and analysis has to carry the diagnosis.
- name: Direct identification of ricin in serum or body fluid by LC-MS/MS
  description: >-
    Ricinine reports castor bean exposure; this reports the toxin itself. A
    lactose-agarose lectin capture followed by tryptic digestion and targeted
    LC-MS/MS identifies ricin down to 5 ng/mL in serum within about two and a
    half hours, without antibodies. It has been run on a real case, finding
    toxin in abdominal fluid 72 hours after self-injection of a castor bean
    extract - a wider window than previously documented. A faster,
    field-deployable ambient-MS screen detects the co-extracted small molecules
    ricinoleic acid and ricinine instead, in about two minutes, and so answers
    the same question as the ricinine assay rather than this one.
  evidence:
  - reference: PMID:33499033
    reference_title: "Rapid, Sensitive and Reliable Ricin Identification in Serum Samples Using LC-MS/MS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This enables ricin identification down to 5 ng/mL in serum samples in 2.5 h."
    explanation: The sensitivity and turnaround this method achieves.
  - reference: PMID:33499033
    reference_title: "Rapid, Sensitive and Reliable Ricin Identification in Serum Samples Using LC-MS/MS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the toxin was identified in an abdominal fluid sample taken 72 h post self-injection of castor beans extraction in an eventual suicide case"
    explanation: >-
      The real-case validation, and the source of the extended-window claim in
      this description.
  - reference: PMID:35173958
    reference_title: "A Proof-of-Concept, Two-Tiered Approach for Ricin Detection Using Ambient Mass Spectrometry."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we present an alternative, two-tiered approach to identify the presence of ricin by detecting ricinoleic acid and ricinine, which are co-extracted with the protein"
    explanation: >-
      The field-deployable alternative, and the reason it is grouped with the
      ricinine assay rather than with direct detection - it measures
      co-extracted small molecules, not the protein.
  - reference: PMID:35173958
    reference_title: "A Proof-of-Concept, Two-Tiered Approach for Ricin Detection Using Ambient Mass Spectrometry."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Difficulties with direct detection arise from large heterogeneities in ricin glycosylation, which leads to markedly different bioactivity"
    explanation: >-
      Why direct detection of the protein is hard, which is what the lectin
      capture above exists to solve.
  notes: >-
    A third confirmatory route is deliberately absent. A reverse
    transcription-ligase-PCR assay reads out the depurinated 28S rRNA itself
    (`DOI:10.1007/s11419-017-0377-6`, Forensic Toxicology 2018), which would be
    the one diagnostic that measures this entry's own central pathophysiology
    node rather than a surrogate. It is not curated because it cannot be:
    the paper has no PubMed record, and its cached entry carries
    `content_type: unavailable` with no retrievable abstract, so no exact quote
    exists to support an evidence item. Adding it with a paraphrased snippet
    would be the fabrication the evidence rules exist to prevent. It should be
    added the moment a quotable record becomes available.
- name: Ricinine measurement in blood, urine or postmortem tissue
  description: >-
    Ricinine is a minor pyridone alkaloid of the castor bean that is co-extracted
    with ricin and is measurable by LC-MS/MS. It is the workhorse confirmatory
    analyte, detected consistently in blood, urine and postmortem tissue in
    fatal cases. Two limits matter. It marks exposure to castor bean *product*,
    not to ricin, so a highly purified preparation may carry little or none; and
    its concentration does not track severity.
  evidence:
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ricinine was consistently detected in blood, urine, and postmortem tissues, supporting its role as a reliable biomarker of ricin exposure, although current evidence is insufficient to establish definitive correlations with poisoning severity or toxicokinetics."
    explanation: States both the reliability of the marker and the severity-correlation limit this entry records.
  - reference: PMID:32991682
    reference_title: "Non-Lethal Intoxication by Ingestion of 50 Castor Beans: Serial Measurement of Ricinine in Blood, Plasma and Urine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of ricinine in a patient's blood or plasma is a proof of castor bean and, hence, ricin exposure."
    explanation: States what a positive result establishes - castor bean exposure, and ricin exposure by inference from it.
  - reference: PMID:32991682
    reference_title: "Non-Lethal Intoxication by Ingestion of 50 Castor Beans: Serial Measurement of Ricinine in Blood, Plasma and Urine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no clear correlation can be established between ricinine blood, plasma or urine levels and the severity of the intoxication"
    explanation: >-
      The serial-measurement result behind the severity caveat, in a patient who
      ingested fifty beans and recovered fully.
  - reference: PMID:23471955
    reference_title: "Analysis of a ricin biomarker, ricinine, in 989 individual human urine samples."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this convenience sample set, only 1.2% of the urine specimens had detectable amounts of ricinine, randomly distributed between 0.186 and 4.15 ng/mL."
    explanation: >-
      Establishes the background rate in unexposed people, which is what makes a
      positive result interpretable. Castor oil is in many consumer products, so
      a non-zero background was not a given.
differential_diagnoses:
- name: Infectious gastroenteritis and sepsis
  description: >-
    The ingestion syndrome is an acute gastroenteritis progressing to shock,
    which is exactly how Salmonella or Shigella enteritis and septic shock of any
    cause present. Without an exposure history there is nothing in the early
    clinical picture to separate them.
  distinguishing_features:
  - >-
    Ricinine detectable in blood or urine establishes castor bean exposure and
    is not produced by any infection.
  - >-
    A history of chewing castor seeds, or of handling castor mash, has no
    counterpart in enteric infection.
  notes: >-
    Deliberately short, and covering the shock-like syndromes as one group
    rather than contrasting ricin with each named infection individually. The
    systematic review names the differential at that level of generality and no
    reference cited here makes the pairwise comparisons, so making them would be
    asserting clinical teaching without a source.

    The biothreat differential that toxicology references usually list
    alongside ricin - tularemia, Q fever, staphylococcal enterotoxin B,
    phosgene - is not recorded here for the same reason. It reaches this entry
    only through a StatPearls chapter, and PubMed searches for a peer-reviewed
    source that makes those comparisons for ricin specifically returned nothing
    usable. It is a genuine gap rather than a considered exclusion, and closing
    it needs a source, not a rewrite.
  evidence:
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the differential diagnosis with other septic shock-like syndromes"
    explanation: Names this differential as one of the medico-legal challenges the review identifies.
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "can mimic several common medical conditions, most notably septic shock"
    explanation: States which condition the mimicry most often points at.
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "as bacterial sepsis, particularly when no history of ricin exposure is available"
    explanation: >-
      Names the condition under which the confusion happens - no exposure
      history - which is exactly the deliberate-poisoning case where the
      diagnosis matters most. Quoted from mid-sentence because the review is a
      scanned PDF that hyphen-breaks the preceding words across lines.
  - reference: PMID:16168316
    reference_title: Ricin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ricin intoxication mimics a variety of disease states, thus a low threshold of suspicion must be maintained to recognize a potential epidemic."
    explanation: >-
      An independent statement of the mimicry and of its practical consequence -
      suspicion has to be maintained because no single feature discriminates.
  - reference: PMID:32991682
    reference_title: "Non-Lethal Intoxication by Ingestion of 50 Castor Beans: Serial Measurement of Ricinine in Blood, Plasma and Urine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of ricinine in a patient's blood or plasma is a proof of castor bean and, hence, ricin exposure."
    explanation: Supports the discriminating feature listed here.
- name: Toxin-induced wide-complex tachycardia
  description: >-
    A patient presenting with a wide-complex tachycardia and no structural heart
    disease will be worked up as a primary arrhythmia. Ricin belongs in that
    differential: the one reported case converted only after prolonged
    supportive care, having failed cardioversion and amiodarone, and the authors
    liken the mechanism to digitalis intoxication and catecholaminergic
    polymorphic ventricular tachycardia.
  distinguishing_features:
  - >-
    A preceding gastrointestinal prodrome - severe nausea, vomiting and
    diarrhoea - rather than an arrhythmia arising without warning.
  - >-
    Failure of electrical cardioversion and amiodarone, in a heart with no
    structural disease.
  evidence:
  - reference: PMID:41788434
    reference_title: "Bidirectional ventricular tachycardia following ricin intoxication: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case underscores the importance of recognizing rare toxin-induced arrhythmias in the differential diagnosis of wide-complex tachycardias"
    explanation: States this differential directly, as the authors' own conclusion.
  - reference: PMID:41788434
    reference_title: "Bidirectional ventricular tachycardia following ricin intoxication: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The arrhythmogenic mechanism in ricin poisoning may involve calcium dysregulation and triggered activity, similar to digitalis intoxication or catecholaminergic polymorphic ventricular tachycardia."
    explanation: Names the two conditions this most resembles mechanistically.
  - reference: PMID:41788434
    reference_title: "Bidirectional ventricular tachycardia following ricin intoxication: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Re-entry appears unlikely due to the absence of structural heart disease and the failure of electrical cardioversion."
    explanation: Supports the second distinguishing feature listed here.
histopathology:
- name: Hemorrhagic necrosis of the gastrointestinal tract with hepatic and renal tubular injury
  description: >-
    The postmortem picture of fatal human ricin poisoning, pooled across the
    published cases: hemolysis, hemorrhagic necrosis of the gut, hepatic injury,
    renal tubular necrosis, and findings consistent with capillary leak.
  diagnostic: false
  evidence:
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Reported autopsy findings commonly included hemolysis, hemorrhagic necrosis of the gastrointestinal tract, hepatic injury, renal tubular necrosis, and evidence supporting the presence of a capillary leak syndrome."
    explanation: The pooled autopsy findings this record describes.
treatments:
- name: Supportive and symptomatic care
  description: >-
    The mainstay, and in humans the only management with evidence behind it.
    Rehydration and electrolyte correction for gastrointestinal losses,
    vasopressor support for shock, respiratory support for inhalational injury,
    and correction of coagulopathy. There is no antidote, so everything else in
    this section is investigational. Across the published human series this was
    what patients received, and forty-four of fifty survived.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
  - preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  target_mechanisms:
  - target: Distributive and Hypovolemic Shock with Multi-Organ Failure
    treatment_effect: MODULATES
    description: >-
      Supportive care does nothing to the toxin; it addresses the circulatory
      failure that kills the patient.
    evidence:
    - reference: PMID:33711365
      reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Prompt treatment with supportive care was necessary to limit morbidity and mortality."
      explanation: States the target of supportive care as morbidity and mortality rather than the toxin.
  evidence:
  - reference: PMID:33711365
    reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients received symptomatic treatment consisting mostly to rehydration with intravenous fluids"
    explanation: >-
      Records what patients actually received across fifty collected cases.
      Quoted verbatim including the source's grammatical slip.
  - reference: PMID:33711365
    reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Currently, no antidote, vaccine, or other specific effective treatment is available for ricin poisoning or prevention."
    explanation: States the absence that makes supportive care the mainstay rather than an adjunct.
  - reference: PMID:39210364
    reference_title: "Ricin intoxication by lethal dose of castor seeds ingestion: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "admitted for observation, and received symptomatic treatment. She was discharged home after a complete recovery three days later."
    explanation: A worked case of supportive management and its outcome.
- name: Early gastrointestinal decontamination
  description: >-
    Activated charcoal and gastric lavage within a day of ingestion, to reduce
    the toxin that is absorbed. Restricted by definition to the oral route and
    to the latent interval before symptoms establish. In the collected human
    series this was reported as very effective when given early, which is the
    strongest treatment claim anywhere in the human ricin literature - though it
    comes from an uncontrolled case collection, not a trial.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: gastrointestinal decontamination with activated charcoal and gastric lavage
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  notes: >-
    Bound one level broader than the treatment on purpose. NCIT has no gastric
    lavage term at all, and `NCIT:C68769` Decontamination - the obvious
    candidate - is not reachable from `NCIT:C25218` Clinical Intervention or
    Procedure, so it fails the `TreatmentActionTerm` enum. `therapeutic_agent`
    is likewise left empty: `NCIT:C77524` Activated Charcoal is not under
    `NCIT:C1909` Pharmacologic Substance and so fails `ChemicalEntityTerm`, and
    CHEBI has no activated charcoal class. Both specifics are carried in
    `preferred_term` and the description instead, per the rule that
    `preferred_term` may be more specific than the best available term.
  target_mechanisms:
  - target: Ricin Delivery to Host Tissue
    treatment_effect: INHIBITS
    description: >-
      Decontamination acts on the delivery step itself - reducing how much toxin
      crosses the gut wall - which is why it only works before absorption is
      complete.
    evidence:
    - reference: PMID:33711365
      reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "digestive decontamination performed with activated charcoal and/or gastric lavage within one day after the ingestion, to reduce gastrointestinal absorption of ricin"
      explanation: States the target of the intervention as gastrointestinal absorption, which is this node.
  evidence:
  - reference: PMID:33711365
    reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This decontamination treatment administered early has been very effective."
    explanation: >-
      The efficacy claim, stated by the review of fifty collected cases. It is
      an uncontrolled observation across heterogeneous case reports, which is
      why the description says so rather than treating it as trial evidence.
- name: Anti-ricin antibody passive immunotherapy
  description: >-
    Investigational, and the only post-exposure approach with efficacy shown in
    a large animal model at clinically relevant times. Equine F(ab')2 antitoxin
    protected more than 80% of swine given it eighteen hours after lethal
    intratracheal or intramuscular exposure. High-affinity monoclonal antibodies
    against both ricin isoforms are the newer generation: RicE5 gave over 90%
    survival in mice treated six hours after an intranasal challenge and 35% at
    twenty-four hours. Nothing in this class is approved for human use.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: passive immunization with anti-ricin antibody
    term:
      id: NCIT:C15259
      label: Passive Immunization
    therapeutic_agent:
    - preferred_term: anti-ricin monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Ricin Delivery to Host Tissue
    treatment_effect: INHIBITS
    description: >-
      Neutralising antibody acts on toxin that has not yet entered a cell, which
      is why the window closes as toxin is internalised. It is deliberately not
      linked to the RTB lectin-binding node: the antibody that actually protects
      animals, RicE5, is an anti-RTA antibody, and the anti-RTB antibody from
      the same panel neutralised in culture but failed in vivo. The review of
      the field lists several neutralisation routes - blocking binding,
      disrupting retrograde transport, redirecting the toxin - without settling
      which one carries the protection.
    evidence:
    - reference: PMID:39453188
      reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "which bind and neutralize very efficiently both ricin isoforms D and E in vitro through cytotoxicity cell assays"
      explanation: >-
        Establishes neutralisation of the toxin itself as the mechanism, measured
        in cytotoxicity assays.
  evidence:
  - reference: PMID:32481526
    reference_title: Post-Exposure Anti-Ricin Treatment Protects Swine Against Lethal Systemic and Pulmonary Exposures.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While administration of the antitoxin at 18 h post-exposure protected more than 80% of both intratracheally and intramuscularly ricin-intoxicated swine, treatment at 24 h post-exposure protected 58% of the intramuscular-exposed swine, as opposed to 26% of the intratracheally exposed animals."
    explanation: The large-animal post-exposure efficacy data, including how fast it falls off with delay.
  - reference: PMID:39453188
    reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "one of these mAbs (RicE5) conferred over 90% survival in a murine model challenged intranasally with a 5 LD50 of ricin and treated by intravenous administration of the mAbs 6 h post-intoxication. Notably, a 35% survival rate was observed even when treatment was administered 24 h post-exposure."
    explanation: The monoclonal-antibody efficacy figures this description quotes.
  - reference: PMID:39453188
    reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We selected two antibodies: one targeting RTA (RicE5) and another targeting RTB (RicE8)."
    explanation: >-
      Identifies which chain each antibody binds, which is what makes the next
      item a dissociation rather than a dose effect.
  - reference: PMID:39453188
    reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although both antibodies exhibited strong neutralizing capabilities in cellular models, only RicE5 provided effective protection in an in vivo intoxication model."
    explanation: >-
      The negative result, recorded because it matters mechanistically: the
      anti-RTB antibody neutralised in culture and failed in animals, so in
      vitro neutralisation does not by itself predict protection, and the
      protective activity is not attributable to blocking the B chain.
  - reference: PMID:39453188
    reference_title: "A Monoclonal Antibody with a High Affinity for Ricin Isoforms D and E Provides Strong Protection against Ricin Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "there are currently no commercially available prophylaxis or treatments for ricin intoxication"
    explanation: Supports the statement that nothing in this class is approved.
- name: RVEc recombinant ricin A chain subunit vaccine
  description: >-
    The second investigational vaccine candidate, a truncated recombinant A
    chain (rRTA 1-33/44-198). In a phase 1 dose-escalating study it was safe and
    well tolerated at 20 and 50 micrograms; all recipients at those doses
    seroconverted by ELISA but only half produced measurable neutralising
    antibody, and a later 50-microgram booster raised both. The 100-microgram
    arm was stopped after two of ten subjects developed elevated creatine
    phosphokinase. Not approved.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Ricin Delivery to Host Tissue
    treatment_effect: INHIBITS
    description: >-
      As with RiVax, an anti-A-chain neutralising response acts on toxin that
      has not yet entered a cell.
    evidence:
    - reference: PMID:26546259
      reference_title: "Safety and immunogenicity of ricin vaccine, RVEc™, in a Phase 1 clinical trial."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "50% produced neutralizing anti-ricin antibodies measurable by TNA"
      explanation: >-
        Establishes that the vaccine raises toxin-neutralising antibody, which
        is the mechanism. Indirect because a neutralisation titre is not itself
        a demonstration of protection.
  evidence:
  - reference: PMID:26546259
    reference_title: "Safety and immunogenicity of ricin vaccine, RVEc™, in a Phase 1 clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RVEc™ was safe and well tolerated at the 20- and 50-μg doses."
    explanation: The safety result at the doses taken forward.
  - reference: PMID:26546259
    reference_title: "Safety and immunogenicity of ricin vaccine, RVEc™, in a Phase 1 clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 10 subjects who received a single 100-μg dose, two developed elevated creatine phosphokinase levels, which resolved without sequelae. No additional doses were administered to subjects in the 100-μg group."
    explanation: >-
      The dose-limiting finding, recorded because a stopped arm is part of what
      is known about this candidate.
  - reference: PMID:26546259
    reference_title: "Safety and immunogenicity of ricin vaccine, RVEc™, in a Phase 1 clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The single booster was safe and well tolerated, resulting in no serious adverse events, and significantly enhanced immunogenicity of the vaccine in human subjects."
    explanation: The booster result this description records.
  - reference: PMID:26546259
    reference_title: "Safety and immunogenicity of ricin vaccine, RVEc™, in a Phase 1 clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ricin is a potent toxin and potential bioterrorism weapon for which no specific licensed countermeasures are available."
    explanation: Supports the statement that this candidate is not approved.
- name: RiVax recombinant ricin A chain vaccine
  description: >-
    Investigational pre-exposure prophylaxis, not a treatment. RiVax is a
    recombinant ricin A chain subunit vaccine, safe and immunogenic in mice,
    rabbits and humans without adjuvant, and taken through a pilot phase 1B
    adsorbed to Alhydrogel. No ricin vaccine is approved. The molecular detail
    frequently quoted for it - that it carries point mutations inactivating
    both the N-glycosidase site and the vascular-leak epitope - is not stated
    by any reference cited here and is deliberately left out rather than
    asserted.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Ricin Delivery to Host Tissue
    treatment_effect: INHIBITS
    description: >-
      An induced neutralising response acts on toxin in the extracellular space
      before it enters a cell. RiVax is a recombinant A chain, so the antibody
      it raises is anti-RTA and cannot act on the B chain's lectin binding;
      this edge deliberately targets the delivery node rather than that one.
    evidence:
    - reference: PMID:36526642
      reference_title: Serum antibody profiling identifies vaccine-induced correlates of protection against aerosolized ricin toxin in rhesus macaques.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "survival correlated with pre-challenge, epitope-specific serum IgG levels, derived from a competitive sandwich ELISA using a panel of toxin-neutralizing monoclonal antibodies directed against distinct epitopes on RiVax"
      explanation: >-
        Establishes that epitope-specific, toxin-neutralising serum IgG is what
        tracks survival in vaccinated macaques, which supports a neutralising
        mechanism without directly demonstrating the binding step.
  evidence:
  - reference: PMID:22914366
    reference_title: Pilot phase IB clinical trial of an alhydrogel-adsorbed recombinant ricin vaccine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have developed a recombinant ricin vaccine, RiVax. Without adjuvant it is safe and immunogenic in mice, rabbits, and humans."
    explanation: Establishes the candidate and its human safety and immunogenicity without adjuvant.
  - reference: PMID:22914366

- name: Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
  biological_scale: TISSUE
  description: >-
    The inhalational lesion. Airway and alveolar epithelium and alveolar
    macrophages die, a local cytokine storm recruits neutrophils in large
    numbers, the vasculature becomes hyperpermeable, and proteinaceous fluid
    fills the alveoli and pleural space. The picture is acute lung injury and
    can progress to acute respiratory distress syndrome; in lethal animal
    exposures the damage stays largely confined to the lung and death is from
    respiratory insufficiency rather than from distant organ failure.
  notes: >-
    Human inhalational ricin poisoning has essentially no clinical literature -
    no case series exists - so this node is supported entirely by rodent,
    non-human-primate and swine work and is graded `MODEL_ORGANISM` throughout.
    That is a real limitation of the evidence, not a curation shortcut.

- name: Ingestion of chewed or crushed castor seeds
  description: >-
    The commonest route in the published record, and the only one with a real
    human clinical literature. Castor is a widely grown ornamental and
    industrial crop, so seeds are freely available; toxicity requires the seed
    coat to be broken, because intact seeds resist digestion and can pass
    through unchanged. Exposure is usually accidental, sometimes self-harm.
  exposure_term:
    preferred_term: ingestion of ricin in castor seed
    term:

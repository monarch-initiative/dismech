- name: Arrest of Translational Elongation
  biological_scale: CELLULAR
  description: >-
    With the sarcin-ricin loop depurinated, elongation factor 1-dependent
    aminoacyl-tRNA delivery and elongation factor 2-dependent translocation can
    no longer occur on that ribosome. Protein synthesis halts at the elongation
    step. As successive ribosomes are hit the cell's entire translational output
    collapses, and because the lesion is per-ribosome and irreversible there is
    no recovery short of ribosome biogenesis outpacing the toxin.
  downstream:
  - target: Apoptotic Death of Intoxicated Cells
    causal_link_type: DIRECT
    description: >-
      Sustained loss of protein synthesis is itself lethal to the cell, and
      ricin-treated cells die predominantly by apoptosis.
    evidence:
    - reference: PMID:36548717
      reference_title: "Parenteral Exposure of Mice to Ricin Toxin Induces Fatal Hypoglycemia by Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase Expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "the A chain enzymatically inactivates the large ribosomal unit, halting protein synthesis, and causing cell death, primarily by apoptosis"
      explanation: States the arrest-to-apoptosis link and that apoptosis is the dominant death mode.
    - reference: PMID:17101666
      reference_title: Ribosome depurination is not sufficient for ricin-mediated cell death in Saccharomyces cerevisiae.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "Several nontoxic RTA mutants depurinated ribosomes and inhibited translation to the same extent as wild-type RTA in vivo."
      explanation: >-
        The dissociation that qualifies this edge. A-chain mutants that
        depurinated and arrested translation as fully as wild type still failed
        to kill, so translational arrest is necessary but not sufficient. The
        edge is real; it is not the whole account, which is why the parallel
        ribotoxic-stress branch carries weight rather than being decorative.
    - reference: PMID:17101666

- name: Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase
  biological_scale: MOLECULAR
  description: >-
    A separate lethal mechanism layered on top of direct cytotoxicity, described
    only in parenterally exposed mice. Hepatic glucose-6-phosphatase RNA and
    protein fall rapidly and persistently, glucose-6-phosphate drops and
    glycogen accumulates - the biochemical signature of blocked glucose output -
    and the animals become profoundly hypoglycaemic before any other laboratory
    abnormality appears. Blood glucose fell even in animals whose beta cells had
    been destroyed with streptozotocin, which argues against an insulin-driven
    explanation.
  notes: >-
    Model-organism only, and deliberately not promoted to a human phenotype. The
    paper notes hypoglycaemia has been observed but not commented on in porcine
    and human intoxication, which is an observation about the literature rather
    than a human finding, so the phenotype below is graded `MODEL_ORGANISM` and
    carries no human frequency.
  downstream:
  - target: Hypoglycemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36548717
    reference_title: "Parenteral Exposure of Mice to Ricin Toxin Induces Fatal Hypoglycemia by Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase Expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the liver, we observed a rapid and persistent decrease in the expression of glucose-6-phosphatase (G6Pase) RNA and protein levels, accompanied by a drop in glucose-6-phosphate and increase in glycogen."
    explanation: The measured enzyme and metabolite changes this node records.
  - reference: PMID:36548717
    reference_title: "Parenteral Exposure of Mice to Ricin Toxin Induces Fatal Hypoglycemia by Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase Expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Drops in blood glucose were observed even after destruction of β-cells with streptozotocin."
    explanation: The control experiment behind the claim that this is not an insulin-mediated hypoglycaemia.
- name: Distributive and Hypovolemic Shock with Multi-Organ Failure
  biological_scale: ORGANISM
  description: >-
    The terminal common pathway. Volume lost through the injured gut, plasma
    lost through a leaking microvasculature, and vasodilatation together produce
    circulatory collapse; hepatic, renal, splenic, cardiac and bone-marrow
    injury accumulate, and death follows from refractory cardiovascular collapse
    typically between ten and seventy-two hours after exposure. This convergence
    is what makes the route of exposure matter for dose and tempo but not for
    the way severe poisoning ends.
  downstream:
  - target: Hypotension
    causal_link_type: DIRECT
  - target: Hypovolemic shock
    causal_link_type: DIRECT
  - target: Bidirectional ventricular tachycardia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ventricular arrhythmia on a background of toxin-induced myocardial injury.
      Drawn as indirect because the one human case proposing this mechanism
      offers it as a hypothesis, having excluded re-entry rather than
      demonstrated triggered activity.
    evidence:
    - reference: PMID:41788434
      reference_title: "Bidirectional ventricular tachycardia following ricin intoxication: a case report."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "A likely mechanism involves toxin-induced myocardial injury resulting in increased automaticity or triggered activity."
      explanation: >-
        The proposed mechanism, stated by the authors as likely rather than
        shown, which is what makes this edge indirect.
  evidence:
  - reference: PMID:33711365
    reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mechanism of death was peripheral vascular collapse and progressing multiple organ failure occurring 10h-72h after intoxication."
    explanation: Names the mechanism of death and its timing, from fifty collected human cases.
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "characterized by rapid progression from mild, nonspecific gastrointestinal symptoms to hypovolemic shock, multi-organ failure, and refractory cardiovascular collapse"
    explanation: Independent statement of the same terminal sequence, from a systematic review of fatal cases.
  - reference: PMID:31208156

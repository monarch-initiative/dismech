      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We identified two compounds that selectively block retrograde toxin trafficking at the early endosome-TGN interface, without affecting compartment morphology, endogenous retrograde cargos, or other trafficking steps, demonstrating an unexpected degree of selectivity and lack of toxicity."
      explanation: Locates the drug's action at this step and establishes its selectivity for it.
  evidence:
  - reference: PMID:20403321
    reference_title: Inhibition of retrograde transport protects mice from lethal ricin challenge.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

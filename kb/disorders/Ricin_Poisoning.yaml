progression:
- phase: Latent interval
  duration: hours
  incubation_days: "1"
  notes: >-
    Symptoms do not begin at once. Reported latency after ingestion ranges from
    minutes to about a day; after inhalation it is a few hours; after injection
    local pain is immediate but systemic illness is delayed. `incubation_days:
    1` is the coarse day-granularity encoding of a sub-day latency. The interval
    matters clinically because it is the window in which gastrointestinal
    decontamination still works and in which an exposed person looks well.
  evidence:
  - reference: PMID:33711365
    reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "digestive decontamination performed with activated charcoal and/or gastric lavage within one day after the ingestion, to reduce gastrointestinal absorption of ricin"
    explanation: >-
      Establishes the decontamination window that defines this phase clinically.
      It does not itself tabulate symptom onset times, which is why it is marked
      indirect.
- phase: Acute toxidrome
  duration: 1-3 days
  duration_days: "3"
  notes: >-
    The syndrome that defines the disease, and the phase whose content is set by
    route: hemorrhagic gastroenteritis after ingestion, acute lung injury after
    inhalation, local necrosis with systemic vascular injury after injection.
  evidence:
  - reference: PMID:33711365
    reference_title: "Ricin poisoning: A review on contamination source, diagnosis, treatment, prevention and reporting of ricin poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mechanism of death was peripheral vascular collapse and progressing multiple organ failure occurring 10h-72h after intoxication."
    explanation: Bounds this phase in the fatal cases - death between ten and seventy-two hours.
- phase: Resolution or multi-organ failure
  duration: days
  notes: >-
    Monophasic. There is no relapsing-remitting course: the poisoning either
    resolves over days with supportive care or progresses to refractory
    cardiovascular collapse. Survivors of ingestion generally recover fully;
    whether survivors of inhalation do is unknown in humans, and the animal data
    say they may not.
  evidence:
  - reference: PMID:39210364
    reference_title: "Ricin intoxication by lethal dose of castor seeds ingestion: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was discharged home after a complete recovery three days later."
    explanation: The resolution arm, in a documented ingestion case managed supportively.
  - reference: PMID:42560523
    reference_title: "Medico-legal aspects of fatal ricin poisoning: a systematic review of clinical manifestations, toxicological findings and autopsy results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "hypovolemic shock, multi-organ failure, and refractory cardiovascular collapse"
    explanation: The other arm, from a systematic review of the fatal cases.
prevalence:
- population: Worldwide, published human cases 1980-2020
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Fifty published cases over four decades, with six deaths. This is a
    literature count, not an incidence: ricin exposure is an intentional or
    accidental event rather than an endemic process, no population-based rate
    exists, and the case count is bounded by what gets published as much as by
    what happens. `prevalence_class: NOT_YET_DOCUMENTED` records that honestly
    rather than inventing a band.
  evidence:

name: Ricin Poisoning
creation_date: "2026-09-17T23:40:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Plant Poisoning
- Biological Toxin Exposure
parents:
- poisoning
synonyms:
- ricin intoxication
- ricin toxicosis
- castor bean poisoning
- castor seed poisoning
- Ricinus communis poisoning
- ricinosis
description: >-
  Ricin poisoning is an acute intoxication caused by ricin, the type 2
  ribosome-inactivating protein of the castor bean, the seed of Ricinus
  communis. Ricin is a disulfide-linked heterodimer: the B chain (RTB) is a
  galactose and N-acetylgalactosamine-specific lectin that binds terminal
  galactose residues on essentially any cell surface, and the A chain (RTA) is
  an rRNA N-glycosidase. After RTB-mediated binding the holotoxin is
  endocytosed and carried retrogradely through the Golgi to the endoplasmic
  reticulum, where the interchain disulfide is reduced and the A chain
  dislocates across the ER membrane into the cytosol. There it removes a single
  adenine from the universally conserved sarcin-ricin loop of 28S rRNA in the
  60S subunit, which abolishes elongation-factor binding and arrests protein
  synthesis. The reaction is catalytic - an estimated 1,500 ribosomes per
  minute - so very few cytosolic A chains suffice to kill a cell. Depurination
  is not only a lesion but a signal: the damaged loop triggers the ribotoxic
  stress response, activating the p38 MAPK and JNK stress kinases, which drive
  both apoptosis and pro-inflammatory cytokine release.

  The clinical syndrome is set by the route of exposure rather than by any
  difference in mechanism. Ingestion of chewed castor seeds produces a
  hemorrhagic gastroenteritis with fluid and electrolyte loss, usually survivable
  with prompt supportive care because intact seed coats resist digestion and
  gastrointestinal absorption is poor. Inhalation of aerosolised toxin produces
  acute lung injury with interstitial pneumonia, neutrophil influx and
  proteinaceous alveolar edema that can progress to acute respiratory distress
  syndrome - a picture established entirely in rodents, rabbits, macaques and
  swine, since no human inhalational case has been documented. Parenteral
  injection - the route of the 1978 Georgi Markov assassination - causes local
  necrosis followed by endothelial glycocalyx shedding, coagulopathy,
  widespread hemorrhage and distributive shock, known from a handful of human
  cases and worked out mechanistically in mice and swine. Severe
  poisoning by any route converges on hypovolemic and distributive shock with
  multi-organ failure, typically within 10 to 72 hours. There is no approved
  antidote or vaccine; management is supportive, with early gastrointestinal
  decontamination for ingestion. Ricin's availability as a byproduct of castor
  oil production makes it a recurrent agent of assassination, self-harm and
  attempted bioterrorism, and it is listed as a CDC Category B agent and a
  Schedule 1 chemical under the Chemical Weapons Convention.
notes: >-
  Curated from a `claude_code` deep-research report
  (`research/Ricin_Poisoning-deep-research-claude_code.md`). That report was
  generated before the recipes emitted an in-line validation block, so
  `just validate-research-reference` and `just validate-research-terms` were run
  over it afterwards; the retro-fitted sections record 31/31 references resolved
  with no unresolved identifiers, and 46/47 CURIEs resolved with one obsolete
  (`GO:0030433`, which is not used here). Every ontology binding written into
  this entry was nevertheless re-derived by a fresh lookup rather than copied
  from the report, per the repository's term contract. That was not a formality:
  the report proposed `HP:0001395` for hepatic necrosis, which is a different
  term - the HPO term for *Hepatic necrosis* is `HP:0002605` - and most of its
  other suggestions were explicit "verify" placeholders rather than bindings.

  The report cited overwhelmingly by URL rather than by PMID, so its PMC and DOI
  links were run through the PMC ID Converter and the PMIDs cited here; a
  handful of its sources are Wikipedia pages, FBI press releases and news
  articles and are not cited at all.

  This is an acquired toxicosis with no Mendelian basis, so there is no
  GeneReviews chapter and no OMIM entry, and the `genetic:` section is
  deliberately absent rather than empty. `just check-genereviews` returns
  `NO_CHAPTER` for both Bookshelf collections. The deep-research report leaned
  heavily on a StatPearls chapter; nothing from it is cited here, because
  StatPearls is never a baseline in this repository. Its distinctive content -
  the routine-laboratory panel, chest imaging, the clustered-presentation
  epidemiologic heuristic, and the infectious and chemical differential list -
  was therefore not carried over at all rather than re-sourced. That is a real
  gap in `diagnosis:` and `differential_diagnoses:`, not a difference in
  citation.

  Host genetic modifiers of *cellular* susceptibility are real and
  well studied - the fucosylation and sialylation "sugar code" that controls how
  much toxin binds, and the retrograde-transport machinery that carries it in -
  but none is an organismal susceptibility locus for human disease, so they are
  recorded in `discussions` rather than curated as `genetic:` rows.

  `prevalence:` carries only a literature case count rather than a rate. No
  population-based incidence for ricin poisoning exists, because exposure is an
  intentional or accidental event rather than an endemic process;
  `measure_type: CASES_IN_LITERATURE` is used for exactly this reason.

  The evidence base is deliberately uneven and is graded to show it. The
  molecular chain from lectin binding through depurination to the ribotoxic
  stress response rests on `IN_VITRO` work; the organ-level consequences of
  inhalation rest entirely on `MODEL_ORGANISM` studies in mice, rabbits,
  macaques and swine, because no human inhalational case has ever been
  documented; injection is known from a handful of human cases plus mouse and
  swine work; and only the ingestion syndrome has a substantial human clinical
  literature. The hypoglycemia node is model-organism-only, and the same authors
  report a negative in aerosol-exposed macaques, so it is carried as an open
  question rather than promoted to a human phenotype.

  Two causal edges are deliberately left uncited. Apoptotic cell death is drawn
  to the gastrointestinal and to the hepatic/renal lesions because that is the
  mechanism, but the human autopsy series that establishes those lesions says
  nothing about how the cells died, and no cited study tests epithelial death
  against the mucosal lesion in gut the way PMID:36695077 does in lung. Reusing
  the autopsy sentence as edge evidence would have been node-level evidence
  papering over an unsourced edge, so it was removed rather than kept.

  Splenic necrosis is not curated as a phenotype although it appears inside
  quoted evidence. The murine intramuscular model shows spleen damage, but the
  systematic review of fatal human cases never mentions the spleen at all -
  "splen" does not occur in its text - so there is no human source for it. It is
  carried where it belongs, on the murine model, rather than promoted into the
  human clinical picture.

  `clinical_trials:` holds the two registered RVEc phase 1 studies and nothing
  else. The RiVax phase 1B publication registers no NCT identifier, and no
  interventional trial of a ricin *treatment* exists to register - every
  post-exposure countermeasure in `treatments:` is preclinical.

  Three bindings are deliberately broader than the thing they describe, each
  with its reason recorded beside it: `HP:0001928` for the coagulopathy (no
  cited source reports a clotting time), `HP:0031865` for the liver derangement
  (no source names an analyte), and `HP:0001878` for the haemolysis (the
  sources report haemolysis at autopsy, not an anaemia). Earlier drafts used
  narrower terms in all three places and in a fourth - an `Oliguria` phenotype
  inferred from "multi-organ failure" - which was removed outright because no
  source mentions it. A `Cough` phenotype went the same way: its only support
  was a vigilance recommendation that never uses the word.

    snippet: "There is no FDA-approved vaccine for the potent plant toxin ricin."
    explanation: Supports the statement that no ricin vaccine is approved.
- name: Retro-2 and other retrograde transport inhibitors
  description: >-
    Preclinical only. Retro-2 blocks toxin trafficking at the early
    endosome-to-trans-Golgi interface without disturbing compartment morphology
    or other trafficking, and protected mice from an otherwise lethal nasal
    ricin challenge - the first small molecule shown to work against ricin in an
    animal. Its interest here is as much mechanistic as therapeutic: it is the
    experiment that shows the retrograde step is required rather than incidental.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

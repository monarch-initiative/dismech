    snippet: "We identified a c.3521C>G missense heterozygous variant in SCN1A carried only by the affected sister."
    explanation: "Documents a heterozygous SCN1A missense variant in a single patient with MRS, facial palsy, and familial migraine."
environmental:
- name: Immune and allergic triggers
  notes: >
    Episodes of facial edema may be triggered by stress, infection, allergic exposures,
    or food ingestion with individual patient triggers varying.
    Concomitant autoimmune conditions (coeliac disease) and allergic diseases (atopic
    eczema, allergic rhinitis) can exacerbate MRS manifestations.
  evidence:
  - reference: PMID:31466978
    reference_title: "Melkersson-Rosenthal syndrome with coeliac and allergic diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he exhibited recurrent facial nerve palsy since the age of 10 years, coeliac disease since the age of 12 years, atopic eczema, allergic rhinitis and asthma."
    explanation: "Demonstrates associations between MRS and autoimmune/allergic conditions as potential environmental/triggering factors"
  - reference: PMID:40255708
    reference_title: "Cheilitis Granulomatosa: A Case Report of a Sarcoid Mimic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings were significant for Saccharomyces and Lyme disease, while other autoimmune biomarkers remained negative"
    explanation: "Suggests potential infectious triggers (yeast, Borrelia burgdorferi) in CG/MRS pathogenesis"
treatments:
- name: Intralesional corticosteroid injection
  description: >
    Direct injection of corticosteroids (triamcinolone) into affected facial tissues
    reduces inflammatory response and edema,
    providing temporary relief lasting weeks to months during acute exacerbations.
  treatment_term:
    preferred_term: corticosteroid injection
    term:
      id: NCIT:C121367
      label: Localized Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: triamcinolone
      term:
        id: CHEBI:9667
        label: triamcinolone
  evidence:
  - reference: PMID:32782477
    reference_title: "Recurrent granulomatous cheilitis associated with Crohn's disease successfully treated with ustekinumab: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral or locally injected corticosteroids (triamcinolone) are the initial therapeutic option."
    explanation: "Establishes locally injected triamcinolone as an initial therapeutic option for granulomatous cheilitis/MRS."
  - reference: PMID:22836908
    reference_title: "The Melkersson-Rosenthal syndrome: a retrospective study of biopsied cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The medication treatments attempted in the nine patients with the full triad of symptoms included non-steroidal anti-inflammatory drugs, oral and intra-lesional steroids, metronidazole, dapsone, acyclovir, methotrexate, and thalidomide with no consistent treatment responses."
    explanation: "Notes that oral and intralesional steroids were among the treatments attempted in a biopsy-confirmed MRS series, with inconsistent responses across the full-triad subgroup."
- name: Systemic corticosteroids
  description: >
    Oral corticosteroids used during acute exacerbations of facial edema and paralysis
    to suppress inflammatory response.
  treatment_term:
    preferred_term: corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  evidence:
  - reference: PMID:32782477
    reference_title: "Recurrent granulomatous cheilitis associated with Crohn's disease successfully treated with ustekinumab: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral or locally injected corticosteroids (triamcinolone) are the initial therapeutic option."
    explanation: "Identifies oral corticosteroids as a first-line therapeutic option for granulomatous cheilitis/MRS."
  - reference: PMID:39135018
    reference_title: "A case of Melkersson-Rosenthal syndrome with temporomandibular joint osteoarthritis: multidisciplinary treatment and autoimmune etiological hypothesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A comprehensive diagnosis and multidisciplinary treatment approach including surgery, local injections, and oral medication were implemented, resulting in a favorable prognosis."
    explanation: "Supports the use of systemic medication (oral corticosteroids) as part of multidisciplinary MRS management"
  - reference: PMID:22836908
    reference_title: "The Melkersson-Rosenthal syndrome: a retrospective study of biopsied cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologists who observe a combination of facial edema and facial palsy in a patient should consider the diagnosis of MRS and proceed to a diagnostic skin biopsy and a trial of steroid treatment for their patient."
    explanation: "Recommends a trial of systemic steroid treatment for patients diagnosed with MRS."
- name: Anti-TNF therapy (infliximab)
  description: >
    TNF-α antagonist effective in refractory MRS cases when conventional therapies
    fail. Infliximab targets TNF-α-driven granulomatous inflammation,
    though response may vary and some patients progress to IL-12/23 blockade.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
  evidence:
  - reference: PMID:32782477
    reference_title: "Recurrent granulomatous cheilitis associated with Crohn's disease successfully treated with ustekinumab: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reported evidence indicates treatment with an anti-TNF agent (mainly infliximab) is the most recommended therapeutic option after failure of conventional treatments."
    explanation: "Establishes infliximab as a validated TNF-α blockade strategy for refractory granulomatous cheilitis"
- name: Anti-IL-12/23 therapy (ustekinumab)
  description: >
    Biologic monoclonal antibody targeting IL-12/23 pathway, effective in severe refractory
    cases unresponsive to anti-TNF therapy.
    Suppresses the underlying Th1/Th17 cytokine-driven granulomatous inflammation
    and has demonstrated sustained remission in MRS-associated orofacial granulomas.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  evidence:
  - reference: PMID:32782477
    reference_title: "Recurrent granulomatous cheilitis associated with Crohn's disease successfully treated with ustekinumab: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical case reported the effectiveness of ustekinumab, a monoclonal antibody against interleukins 12/23, to induce the remission of severe and recurrent granulomatous cheilitis in a patient with Crohn's disease."
    explanation: "Demonstrates efficacy of IL-12/23 blockade in treating refractory MRS-associated granulomatous cheilitis"
- name: Supportive care
  description: >
    Eye care for facial paralysis to prevent corneal damage, speech and swallowing
    management for lingual involvement,
    and psychological support for cosmetic and functional impacts.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39135018
    reference_title: "A case of Melkersson-Rosenthal syndrome with temporomandibular joint osteoarthritis: multidisciplinary treatment and autoimmune etiological hypothesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A comprehensive diagnosis and multidisciplinary treatment approach including surgery, local injections, and oral medication were implemented, resulting in a favorable prognosis."
    explanation: "Emphasizes the importance of multidisciplinary supportive care in MRS management"
differential_diagnoses:
- name: Crohn's disease with orofacial manifestations
  description: >
    Oral Crohn disease (OCD) and orofacial granulomatosis (OFG) present with non-caseating
    granulomatous inflammation
    histologically indistinguishable from MRS. However, Crohn's disease has significant
    gastrointestinal involvement (terminal ileum, colon)
    whereas MRS is primarily limited to orofacial structures.
  disease_term:
    preferred_term: Crohn disease
    term:
      id: MONDO:0005011
      label: Crohn disease
  distinguishing_features:
  - Crohn's disease has significant gastrointestinal involvement; MRS is primarily orofacial
  - Histologic overlap but clinical differentiation via systemic evaluation and GI symptoms
  evidence:
  - reference: PMID:30627963
    reference_title: "Non-infectious Granulomatous Lesions of the Orofacial Region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary causes of granulomas include infectious agents, sarcoid, and Crohn disease."
    explanation: "Establishes Crohn disease as a key differential diagnosis for orofacial granulomatosis including MRS"
  - reference: PMID:32782477
    reference_title: "Recurrent granulomatous cheilitis associated with Crohn's disease successfully treated with ustekinumab: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Granulomatous cheilitis, characterized by persistent inflammation of the lips and a granulomatous histology, is sometimes associated with Crohn's disease and is a therapeutic challenge."
    explanation: "Highlights the relationship between granulomatous cheilitis and Crohn disease, and the need for clinical/histologic differentiation"
- name: Sarcoidosis
  description: >
    Sarcoidosis can cause facial swelling and non-caseating granulomatous inflammation
    but presents as a systemic multiorgan disease
    with pulmonary and lymph node involvement, distinct from the primarily orofacial
    involvement in MRS. Sarcoidosis typically lacks
    recurrent facial nerve paralysis as a primary manifestation.
  disease_term:
    preferred_term: sarcoidosis
    term:
      id: MONDO:0019338
      label: sarcoidosis
  distinguishing_features:
  - Sarcoidosis is systemic with pulmonary and hilar lymphadenopathy involvement; MRS is primarily orofacial
  - Sarcoidosis lacks recurrent facial nerve paralysis as primary feature
  - Sarcoidosis has systemic symptoms and elevated ACE levels
  evidence:
  - reference: PMID:40255708
    reference_title: "Cheilitis Granulomatosa: A Case Report of a Sarcoid Mimic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cheilitis granulomatosa (CG) is a persistent and progressive swelling of the lips that can be non-tender and soft or firm to touch, with noncaseating granulomas that are perilymphatic and may show intralymphatic histiocytosis and lymphatic dilatation."
    explanation: "Describes CG/MRS distinguishing features including intralymphatic histiocytosis that helps differentiate from systemic sarcoidosis"
- name: Bell's palsy
  description: >
    Bell's palsy presents with acute facial paralysis but lacks the chronic recurrent
    orofacial edema and granulomatous histopathology
    characteristic of MRS. Bell's palsy typically resolves within weeks whereas MRS
    has chronic relapsing course with persistent
    granulomatous changes between episodes.
  disease_term:
    preferred_term: Bell's palsy
    term:
      id: MONDO:0005665
      label: Bell's palsy
  distinguishing_features:
  - Bell's palsy is acute/subacute with resolution within weeks; MRS has chronic relapsing course
  - Bell's palsy lacks orofacial edema and granulomatous inflammation on biopsy
  - MRS presents with the classic triad (edema, facial paralysis, fissured tongue)
  evidence:
  - reference: PMID:31466978
    reference_title: "Melkersson-Rosenthal syndrome with coeliac and allergic diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he presented the classic triad of Melkersson-Rosenthal syndrome which includes recurrent orofacial oedema, facial nerve palsy and fissured tongue. A lip biopsy confirmed our clinical diagnosis."
    explanation: "Highlights that histopathologic confirmation (non-caseating granulomas) and presence of all three triad features differentiate MRS from isolated Bell's palsy"

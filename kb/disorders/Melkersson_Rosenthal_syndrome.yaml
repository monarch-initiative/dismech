- name: Frequency of Complete Triad
  description: Percentage of MRS patients presenting with all three features of the classic triad
  minimum_value: 8
  maximum_value: 25
  unit: percent
  notes: >
    Only 8–25% of MRS cases present with the complete classic triad (recurrent orofacial
    edema, facial nerve paralysis, fissured tongue).
    Many patients present with monosymptomatic or oligosymptomatic variants, particularly
    isolated granulomatous cheilitis, leading to diagnostic delays.
  evidence:
  - reference: PMID:31466978
    reference_title: "Melkersson-Rosenthal syndrome with coeliac and allergic diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case is particularly rare, as the classic triad is seen only in a minority of the cases."
    explanation: "Confirms that the complete triad occurs in only a minority of MRS cases"
  - reference: PMID:22657098
    reference_title: "Granulomatous cheilitis: a report of 6 cases and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Granulomatous cheilitis (Miescher cheilitis), a condition characterized by recurrent swelling of the lips, is the most common monosymptomatic form of the Melkersson-Rosenthal syndrome."
    explanation: "Demonstrates that monosymptomatic presentations (isolated cheilitis) are common, with only a minority presenting with the complete triad"
pathophysiology:
- name: Dysregulated Th1/Th17 cytokine signaling with IL-12/23 and TNF-α involvement
  description: >
    The granulomatous inflammation in MRS is driven by dysregulated Th1/Th17 cytokine
    axes involving TNF-α, IFN-γ, and IL-12/23 signaling.
    These cytokines promote macrophage activation and granuloma formation and maintenance,
    with therapeutic response to IL-12/23 blockade and
    anti-TNF agents supporting this mechanistic pathway in orofacial tissue inflammation.
  evidence:
  - reference: PMID:32782477
    reference_title: "Recurrent granulomatous cheilitis associated with Crohn's disease successfully treated with ustekinumab: case report and literature review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical case reported the effectiveness of ustekinumab, a monoclonal antibody against interleukins 12/23, to induce the remission of severe and recurrent granulomatous cheilitis in a patient with Crohn's disease."
    explanation: "Therapeutic remission with anti-IL-12/23 blockade indirectly supports the role of IL-12/23 signaling in driving orofacial granulomatous inflammation."
  - reference: PMID:31466978
    reference_title: "Melkersson-Rosenthal syndrome with coeliac and allergic diseases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This paper illustrates a potential pathophysiological interconnection between these pathologies in which interferon gamma could play a key role."
    explanation: "Proposes a pathophysiological role for interferon-gamma signaling in the immunopathogenesis of Melkersson-Rosenthal syndrome."

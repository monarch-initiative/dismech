      label: Sporadic
  description: >-
    Most cases of Melkersson-Rosenthal syndrome occur sporadically with clinical
    and genetic heterogeneity and no established causative gene or Mendelian mode
    of inheritance, although rare familial clustering has been described.
  evidence:

  - reference: PMID:36532829
    reference_title: "Peripheral facial nerve palsy in children: clinical manifestations, treatment and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 57 patients were diagnosed with peripheral facial nerve palsy and categorized into many groups by etiology: idiopathic Bell's palsy in 27 (47.5%), infectious in 11 (19.2%), traumatic in 6 (10.5%), and others (due to congenital, immune, neoplastic, Melkersson-Rosenthal syndrome, drug toxicity, and iatrogenic causes) in 13 (22.8%)."
    explanation: "Identifies Melkersson-Rosenthal syndrome as a recognized cause of facial palsy in children, establishing pediatric presentation"

name: Melkersson-Rosenthal syndrome
creation_date: '2026-01-20T22:43:10Z'
description: >-
  Melkersson-Rosenthal syndrome is a rare neuro-mucocutaneous disorder defined by
  the classic triad of recurrent orofacial swelling, relapsing peripheral facial
  nerve palsy, and a fissured tongue (lingua plicata), although incomplete forms
  are common. The underlying process is a noncaseating granulomatous
  inflammation (orofacial granulomatosis) with lymphedema of the orofacial soft
  tissues; granulomatous infiltration and edema within the facial canal are
  thought to compress the facial nerve and produce the recurrent palsy. The cause
  is unknown, with proposed contributions from genetic susceptibility, infection,
  and delayed hypersensitivity, and repeated attacks can leave persistent facial
  swelling and residual nerve deficits.

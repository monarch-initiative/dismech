progression:
- phase: Onset
  age_range: Childhood to young adulthood; typically second to third decade
  notes: >-
    Presentation and diagnosis most frequently occur in the second and third
    decades of life, though onset in childhood or adolescence (e.g., age 10
    years) with a chronic relapsing-remitting course of facial nerve palsy and
    orofacial swelling is also well recognized.
  evidence:

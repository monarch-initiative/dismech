    explanation: "Documents onset of recurrent facial nerve palsy at age 10 years in a patient with MRS."
  - reference: PMID:33422123
    reference_title: "Melkersson-Rosenthal syndrome misdiagnosed as recurrent Bell's palsy: a case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is frequently seen in females in their second and third decades of life."
    explanation: "Confirms typical presentation and diagnosis during the second and third decades of life."
epidemiology:
- name: Age of Onset
  description: Typical age range for Melkersson-Rosenthal syndrome presentation
  minimum_value: 14
  maximum_value: 39
  mean_range: Second decade of life (10-20 years)
  unit: years
  notes: >
    Mean onset frequently in the second decade. However, cases have been reported
    across a wide age range from childhood to adulthood.
    The classic triad may not be fully apparent at disease onset, leading to delayed
    diagnosis.
  evidence:
  - reference: PMID:31466978

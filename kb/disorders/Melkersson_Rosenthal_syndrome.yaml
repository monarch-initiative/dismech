    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRS is a disorder with variable expressivity and clinical as well as genetic heterogeneity; however, the causative gene remains to be identified."
    explanation: "Confirms that MRS exhibits clinical and genetic heterogeneity without an established causative gene."

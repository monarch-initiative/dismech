- name: Candidate SCN1A missense variant (single family)
  role: trigger
  description: >-
    A heterozygous missense variant (c.3521C>G) in the voltage-gated sodium
    channel alpha-1 subunit gene SCN1A was identified in one sister with
    Melkersson-Rosenthal syndrome and recurrent facial palsy from a family in
    which two sisters had recurrent migraines, representing a provisional
    single-family candidate genetic association.
  evidence:
  - reference: PMID:37510386
    reference_title: "Melkersson-Rosenthal Syndrome and Migraine: A New Phenotype Associated with SCN1A Variants?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a c.3521C>G missense heterozygous variant in SCN1A carried only by the affected sister."
    explanation: "Identifies a heterozygous missense SCN1A variant in a patient presenting with familial migraine and MRS with recurrent facial palsy."

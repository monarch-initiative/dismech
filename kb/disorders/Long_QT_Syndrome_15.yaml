inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ClinGen curated CALM2 for long QT syndrome under an autosomal dominant mode
    of inheritance; a single heterozygous variant, one of six calmodulin
    alleles, is sufficient.
  evidence:
  - reference: CGGV:assertion_86e4b783-3b60-4a1d-ab34-e61d27751ca6-2018-09-25T160000.000Z
    reference_title: "CALM2 / long QT syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CALM2 | HGNC:1445 | long QT syndrome | MONDO:0002442 | AD | Definitive"
    explanation: >-
      The ClinGen validity row records AD as the mode of inheritance under which
      the CALM2-long QT syndrome relationship was curated.
  - reference: PMID:41294816
    reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Enhanced IQ binding is rare and may explain the dominant inheritance of D133H-associated LQTS, where disease phenotype is observed despite only one CaM-encoding allele out of six being affected"
    explanation: >-
      The CALM2 D133H study describes dominant LQTS from one affected allele of
      six and proposes enhanced Cav1.2 IQ binding as the reason.
- name: Sporadic (de novo)
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Long QT presentations of the calmodulin genes are typically sporadic: the
    variant arises de novo, and no other family member is affected. The
    founding CALM2 D96V variant was de novo, as were all five CALM2 variants of
    Makita et al. In the pooled CALM1-3 registry the culprit variant was de
    novo in 93% of genetically screened CALM-LQTS families.
  evidence:
  - reference: PMID:24917665
    reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 5 novel de novo missense mutations in CALM2 in 3 subjects with LQTS (p.N98S, p.N98I, p.D134H) and 2 subjects with clinical features of both LQTS and CPVT (p.D132E, p.Q136P)."
    explanation: Five de novo CALM2 variants, each absent from both parents.
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In proband 2, a missense mutation in CALM2 (chr 2p21) predicted replacement of another highly conserved aspartic acid residue at position 96 with valine (D96V)."
    explanation: >-
      The founding CALM2 D96V variant, found de novo by parent-child trio
      sequencing.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 27/29 (93%) CALM-LQTS and in 7/9 CALM-CPVT (78%) patients whose family members were genetically screened, the culprit variant was de novo. In the remaining two CALM-LQTS cases and in one IVF case, germline mosaicism was present in one of the parents."
    explanation: Pooled CALM1-3 registry figure for de novo origin in CALM-LQTS.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases identified, no other family members were found to be phenotype-positive and were thus concordant with de novo variants"
    explanation: >-
      The reappraisal's account of the calmodulin-gene LQTS cases, CALM2
      included: affected individuals are sporadic, consistent with de novo
      variants.
pathophysiology:
- name: CALM2 Heterozygous Missense Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant in CALM2, usually de novo, alters a
    calmodulin calcium-binding EF-hand. The worked example is D133H, which
    changes a calcium-coordinating residue of the fourth EF-hand and
    destabilises calcium binding by the C-terminal lobe. Because CALM1, CALM2
    and CALM3 encode an identical protein, the variant protein is one of six
    calmodulin alleles' products, yet it acts dominantly.
  genes:
  - preferred_term: CALM2
    term:
      id: hgnc:1445
      label: CALM2
  genetic_context:
    gene:
      preferred_term: CALM2
      term:
        id: hgnc:1445
        label: CALM2
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: De novo in the long QT and CPVT presentations cited here.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: calcium ion binding
    term:
      id: GO:0005509
      label: calcium ion binding
    modifier: DECREASED
  evidence:
  - reference: PMID:41294816
    reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biophysical analysis revealed that D133H destabilises Ca2+ binding at the C-terminal lobe of CaM, altering its Ca2+-dependent conformational changes."
    explanation: The CALM2 D133H variant reduces calmodulin calcium binding.
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The data revealed that all three mutations have reduced Ca2+ affinity in the C-domain (5–53 fold)"
    explanation: >-
      Recombinant CALM2 D96V (with CALM1 D130G and F142L) binds calcium less
      avidly at the C-terminal lobe.
  - reference: PMID:24917665
    reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations affect conserved residues located within Ca(2+)-binding loops III (p.N98S, p.N98I) or IV (p.D132E, p.D134H, p.Q136P) and caused reduced Ca(2+)-binding affinity."
    explanation: The five Makita CALM2 variants reduce C-domain calcium binding.
  - reference: PMID:41294816
    reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "It is encoded by three independent genes (CALM1–3), which produce identical proteins"
    explanation: >-
      Why a CALM2 variant acts on the same protein as CALM1 and CALM3 variants,
      and so why shared calmodulin mechanism evidence applies here.
  - reference: CGGV:assertion_42d280da-accc-46f2-8832-47d5a3eeeba7-2021-06-17T160000.000Z
    reference_title: "CALM2 / catecholaminergic polymorphic ventricular tachycardia (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the de novo variant p.Asp130Gly has been shown in all 3 CALM genes to provoke LQTS in children"
    explanation: >-
      The same de novo calmodulin substitution causes childhood LQTS from CALM2
      as from CALM1 or CALM3, showing the functional equivalence of the three
      genes.
  downstream:
  - target: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
    causal_link_type: DIRECT
    description: >-
      CALM2 D133H impairs calcium-dependent inactivation of Cav1.2.
    evidence:
    - reference: PMID:41294816
      reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we have shown that D133H impaired Cav1.2 CDI"
      explanation: Direct electrophysiological finding for the CALM2 variant.
    - reference: PMID:24816216
      reference_title: Calmodulin mutations associated with long QT syndrome prevent inactivation of cardiac L-type Ca(2+) currents and promote proarrhythmic behavior in ventricular myocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Importantly, expression of mutant CaMD96V essentially abolished CDI in this native setting"
      explanation: >-
        The founding CALM2 D96V variant abolishes calcium-dependent
        inactivation of native L-type channels in ventricular myocytes.
    - reference: PMID:27765793
      reference_title: A Precision Medicine Approach to the Rescue of Function on Malignant Calmodulinopathic Long-QT Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We therefore examined the effect of the D130G mutation on LTCC CDI in patient-derived iPSC-CMs."
      explanation: >-
        CALM2 D130G patient-derived cardiomyocytes show diminished
        calcium-dependent inactivation of the L-type current.
  - target: Reduced Kv7.1 Activation
    causal_link_type: DIRECT
    description: >-
      CALM2 D133H reduces activation of the Kv7.1 (IKs) channel.
    evidence:
    - reference: PMID:41294816
      reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Electrophysiological recordings demonstrated that CaM D133H impairs Ca2+-dependent inactivation (CDI) of Cav1.2, prolonging Ca2+ influx, while also reducing activation of Kv7.1, thereby limiting repolarising K+ currents. Together, these dual defects converge to prolong action potential duration, providing a mechanistic basis for arrhythmogenesis in LQTS."
      explanation: The CALM2 variant reduces Kv7.1 activation as well as Cav1.2 inactivation.
  - target: Ryanodine Receptor 2 Dysregulation
    causal_link_type: DIRECT
    description: >-
      CPVT-associated calmodulin variants lose normal inhibition of RyR2; D133H
      itself causes only mild reductions in RyR2 binding and inhibition in
      vitro.
    evidence:
    - reference: PMID:41294816
      reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: "mild reductions in RyR2 binding and inhibition"
      explanation: >-
        The study's summary of earlier in vitro work on the CALM2 D133H variant
        and RyR2.
- name: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Calmodulin pre-associates with the IQ motif of the Cav1.2 pore-forming
    alpha-1C subunit and, on binding calcium, inactivates the channel. A
    long-QT-associated calmodulin variant leaves the channel conducting for
    longer, so calcium influx during the action potential plateau is
    excessive.

        label: CALM2
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: De novo in the long QT and CPVT presentations cited here.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: calcium ion binding
    term:
      id: GO:0005509
      label: calcium ion binding
    modifier: DECREASED
  evidence:
  - reference: PMID:41294816
    reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biophysical analysis revealed that D133H destabilises Ca2+ binding at the C-terminal lobe of CaM, altering its Ca2+-dependent conformational changes."
    explanation: The CALM2 D133H variant reduces calmodulin calcium binding.
  - reference: PMID:41294816
    reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "It is encoded by three independent genes (CALM1–3), which produce identical proteins"
    explanation: >-
      Why a CALM2 variant acts on the same protein as CALM1 and CALM3 variants,
      and so why shared calmodulin mechanism evidence applies here.
  - reference: CGGV:assertion_42d280da-accc-46f2-8832-47d5a3eeeba7-2021-06-17T160000.000Z
    reference_title: "CALM2 / catecholaminergic polymorphic ventricular tachycardia (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the de novo variant p.Asp130Gly has been shown in all 3 CALM genes to provoke LQTS in children"
    explanation: >-
      The same de novo calmodulin substitution causes childhood LQTS from CALM2
      as from CALM1 or CALM3, showing the functional equivalence of the three
      genes.
  downstream:
  - target: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
    causal_link_type: DIRECT
    description: >-
      CALM2 D133H impairs calcium-dependent inactivation of Cav1.2.
    evidence:
    - reference: PMID:41294816
      reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we have shown that D133H impaired Cav1.2 CDI"
      explanation: Direct electrophysiological finding for the CALM2 variant.
  - target: Reduced Kv7.1 Activation
    causal_link_type: DIRECT
    description: >-
      CALM2 D133H reduces activation of the Kv7.1 (IKs) channel.
    evidence:
    - reference: PMID:41294816
      reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Electrophysiological recordings demonstrated that CaM D133H impairs Ca2+-dependent inactivation (CDI) of Cav1.2, prolonging Ca2+ influx, while also reducing activation of Kv7.1, thereby limiting repolarising K+ currents. Together, these dual defects converge to prolong action potential duration, providing a mechanistic basis for arrhythmogenesis in LQTS."
      explanation: The CALM2 variant reduces Kv7.1 activation as well as Cav1.2 inactivation.
  - target: Ryanodine Receptor 2 Dysregulation
    causal_link_type: DIRECT
    description: >-
      CPVT-associated calmodulin variants lose normal inhibition of RyR2; D133H

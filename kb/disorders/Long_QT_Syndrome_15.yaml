notes: >-
  Scope. This is a gene-specific child of the familial long QT syndrome entry
  (Long_QT_Syndrome, has_subtypes Type 15). Its sibling Long_QT_Syndrome_14
  covers CALM1 (LQT14); CALM3-related long QT syndrome has no numbered MONDO
  subtype and stays with the familial long QT syndrome entry. The three
  calmodulin genes encode an identical protein, so the calcium-dependent
  inactivation and RyR2 mechanisms here are shared with LQT14. The
  CALM2-specific evidence is the founding D96V proband of Crotti et al. 2013
  (PMID:23388215), the five de novo CALM2 variants of Makita et al. 2014
  (PMID:24917665), the D133H variant and its functional study (PMID:41294816;
  the same patient as Makita's D134H, the difference being whether the start
  methionine is counted), the CALM2 D96V guinea-pig myocyte study
  (PMID:24816216), the CALM2 D130G patient-derived iPSC cardiomyocytes
  (PMID:27765793), the CALM2 rows of the International Calmodulinopathy Registry
  (PMID:37528649), the ClinGen CALM2 records, and the Adler et al. 2020
  reappraisal. The Kv7.1 node is drawn only from the D133H study and is not
  asserted for every CALM2 variant. Registry figures that are not broken down
  by gene (PMID:31170290, and most of PMID:37528649) pool CALM1, CALM2 and
  CALM3 carriers and are labelled as pooled wherever they are cited.

  Variant numbering. Makita's D134H and the functional study's D133H are the
  same substitution in the same patient; Makita counts the initiator
  methionine as residue 1 (NP_001734) and the functional study does not. The
  entry's variant is recorded as p.Asp133His with the Makita clinical source
  attached and the equivalence noted.

  Why gene_disease_validity is not filled. The two cached ClinGen assertions for
  CALM2 are made against MONDO:0002442 long QT syndrome (Definitive, AD) and
  MONDO:0017990 catecholaminergic polymorphic ventricular tachycardia (Moderate,
  AD), not against MONDO:0014550, so under the rule that a copied tier must be
  for the entry's own disease term both are cited as evidence on the genetic
  record rather than recorded in gene_disease_validity.

  Neurological features. The founding CALM2 D96V proband developed seizures
  that the report attributed to a cerebral infarction after her first cardiac
  arrest, so they and her developmental delay are drawn as sequelae of cardiac
  arrest rather than primary features. Makita's five CALM2 carriers had no significant
  neurological findings beyond syncope-associated seizures. The 2023 registry
  separately lists CALM2 carriers with arrest-independent autism, ADHD or
  seizures (E46K, N98I, N138K); those are recorded as primary features with no
  established mechanism, so the autism node has no upstream edge.

  Atrioventricular block. The 2:1 block is drawn from the prolonged action
  potential node through ventricular refractoriness. That edge rests on
  general long QT syndrome studies (PMID:1918714, PMID:1889452) and on the
  registry's description of the block as functional; no calmodulin study
  measured refractoriness, so the edge evidence is INDIRECT. The general
  atrioventricular block and bradycardia nodes keep no upstream edge.

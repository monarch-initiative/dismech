- name: Reduced Kv7.1 Activation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Calmodulin is an auxiliary subunit of the Kv7.1 (KCNQ1) channel that carries
    the repolarizing IKs current. CALM2 D133H weakens apo-calmodulin binding to
    the Kv7.1 helix B domain and reduces channel activation, limiting
    repolarizing potassium current. Shown for D133H in murine myocytes and
    peptide-binding assays; not established for other CALM2 variants.

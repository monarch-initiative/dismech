    snippet: "CALM2 | HGNC:1445 | long QT syndrome | MONDO:0002442 | AD | Definitive"
    explanation: >-
      ClinGen classifies the CALM2-long QT syndrome relationship as definitive
      with autosomal dominant inheritance, against the broader long QT syndrome
      term.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the Working Group concluded a classification of Definitive for the calmodulin genes (CALM1-3) for disease causation of LQTS with atypical features presenting in childhood"
    explanation: The published account of the ClinGen definitive classification, scoped to atypical childhood LQTS.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132

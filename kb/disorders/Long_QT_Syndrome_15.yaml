genetic:
- name: CALM2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: CALM2
    term:
      id: hgnc:1445
      label: CALM2
  association: Pathogenic Variants
  notes: >-
    CALM2 carries the LQT15 designation. ClinGen classifies CALM2 as Definitive
    for long QT syndrome (assertion against MONDO:0002442) and Moderate for CPVT
    (assertion against MONDO:0017990); neither is against MONDO:0014550, so both
    are cited as evidence here rather than recorded in gene_disease_validity.
  variants:
  - name: p.Asp133His
    description: >-
      CALM2 missense variant (D133H) at a calcium-coordinating residue of the
      fourth EF-hand, found in a 19-month-old girl with LQTS, fetal
      bradycardia, recurrent syncope, QTc 579 ms and multiple cardiac arrests.
      It impairs Cav1.2 calcium-dependent inactivation and reduces Kv7.1
      activation.
    evidence:
    - reference: PMID:41294816
      reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "One example is a CALM2 missense mutation encoding Asp133His (D133H), which alters a Ca2+-coordinating residue in the fourth EF-hand."
      explanation: Identifies the CALM2 variant and its EF-hand location.
  - name: p.Asp132Glu
    description: >-
      De novo CALM2 variant (D132E) in a patient with mixed CPVT and LQTS
      features; the same substitution occurred de novo in CALM3 in a CPVT
      patient.
    evidence:
    - reference: CGGV:assertion_42d280da-accc-46f2-8832-47d5a3eeeba7-2021-06-17T160000.000Z
      reference_title: "CALM2 / catecholaminergic polymorphic ventricular tachycardia (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Asp132Glu variant was detected in a patient with mixed features of CPVT and LQTS"
      explanation: ClinGen's record of the mixed-phenotype de novo CALM2 case.
  evidence:
  - reference: CGGV:assertion_86e4b783-3b60-4a1d-ab34-e61d27751ca6-2018-09-25T160000.000Z
    reference_title: "CALM2 / long QT syndrome (Definitive)"

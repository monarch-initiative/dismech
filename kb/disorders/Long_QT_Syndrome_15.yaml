name: Long QT Syndrome 15
creation_date: '2026-10-14T16:47:58Z'
description: >-
  Long QT syndrome 15 (LQT15) is the numbered long QT syndrome designation for
  CALM2, one of three genes (CALM1, CALM2, CALM3) that encode the identical
  calcium-sensing protein calmodulin. It is one of the calmodulinopathies:
  heterozygous missense variants, in long QT presentations usually de novo, act
  dominantly although five of the six calmodulin alleles are normal. Calmodulin
  normally drives calcium-dependent inactivation of the Cav1.2 L-type calcium
  channel; the LQTS-associated CALM2 variant D133H impairs that inactivation
  and also reduces Kv7.1 activation, and the two defects together prolong the
  ventricular action potential. ClinGen's long QT expert panel classes CALM2 as
  definitive for long QT syndrome with atypical features: presentation in
  infancy or early childhood, marked bradycardia or atrioventricular block, and
  severe QT prolongation. CALM2 variants also cause a catecholaminergic
  polymorphic ventricular tachycardia (CPVT) phenotype and mixed CPVT/LQTS
  presentations, through dysregulation of the ryanodine receptor RyR2.
category: Genetic
disease_term:
  preferred_term: long QT syndrome 15
  term:
    id: MONDO:0014550
    label: long QT syndrome 15
synonyms:
- LQT15
- LQTS15
- CALM2-related long QT syndrome
- CALM2 calmodulinopathy
parents:
- Familial Long QT Syndrome
- Channelopathy
notes: >-
  Scope. This is a gene-specific child of the familial long QT syndrome entry
  (Long_QT_Syndrome, has_subtypes Type 15). Its sibling Long_QT_Syndrome_14
  covers CALM1 (LQT14); CALM3-related long QT syndrome has no numbered MONDO
  subtype and stays with the familial long QT syndrome entry. The three
  calmodulin genes encode an identical protein, so the calcium-dependent
  inactivation and RyR2 mechanisms here are shared with LQT14. The
  CALM2-specific evidence is the D133H variant (an infant with fetal
  bradycardia, severe QT prolongation and multiple cardiac arrests, and the
  functional study PMID:41294816), the ClinGen CALM2 records, and the Adler et
  al. 2020 reappraisal. The Kv7.1 node is drawn only from the D133H study and is
  not asserted for every CALM2 variant.

  Why gene_disease_validity is not filled. The two cached ClinGen assertions for
  CALM2 are made against MONDO:0002442 long QT syndrome (Definitive, AD) and
  MONDO:0017990 catecholaminergic polymorphic ventricular tachycardia (Moderate,
  AD), not against MONDO:0014550, so under the rule that a copied tier must be
  for the entry's own disease term both are cited as evidence on the genetic
  record rather than recorded in gene_disease_validity.

  Not curated. Neurodevelopmental features (developmental delay, seizures)
  reported in some calmodulinopathy patients are not recorded, because no
  cached source states them for calmodulin variants. Atrioventricular block and
  bradycardia are recorded without an upstream causal edge: the cited sources
  report them with severe QT prolongation but do not state the mechanism. No
  frequencies are given; the cached sources report no per-phenotype
  proportions for CALM2 carriers.

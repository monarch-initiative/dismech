    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The binding of calmodulin to RyR2 inhibits calcium release from the SR during diastole"
    explanation: The normal calmodulin-RyR2 regulation this node describes.
  - reference: PMID:32115705

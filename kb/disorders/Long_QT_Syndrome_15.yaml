- name: Ryanodine Receptor 2 Dysregulation
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Calmodulin bound to RyR2 normally inhibits sarcoplasmic reticulum calcium
    release during diastole. CPVT-associated calmodulin variants fail to
    inhibit, or even activate, RyR2, producing calcium leak and a propensity to
    delayed-afterdepolarization-triggered activity. This is the mechanism of
    the CPVT and mixed CPVT/LQTS phenotypes of CALM2 carriers.
  genes:

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "While the precise mechanism underlying APD lengthening may vary depending on species, reduced CDI resulting from D133H confers a pro-arrhythmic phenotype."
      explanation: Reduced inactivation from the CALM2 variant underlies the action potential lengthening.
    - reference: PMID:24816216

name: Long QT Syndrome 15
creation_date: '2026-10-14T16:47:58Z'
description: >-
  Long QT syndrome 15 (LQT15) is the numbered long QT syndrome designation for
  CALM2, one of three genes (CALM1, CALM2, CALM3) that encode the identical
  calcium-sensing protein calmodulin. It is one of the calmodulinopathies:
  heterozygous missense variants, in long QT presentations usually de novo, act
  dominantly although five of the six calmodulin alleles are normal. Calmodulin
  normally drives calcium-dependent inactivation of the Cav1.2 L-type calcium
  channel; the LQTS-associated CALM2 variant D133H impairs that inactivation
  and also reduces Kv7.1 activation, and the two defects together prolong the
  ventricular action potential. ClinGen's long QT expert panel classes CALM2 as
  definitive for long QT syndrome with atypical features: presentation in
  infancy or early childhood, marked bradycardia or atrioventricular block, and
  severe QT prolongation. CALM2 variants also cause a catecholaminergic
  polymorphic ventricular tachycardia (CPVT) phenotype and mixed CPVT/LQTS
  presentations, through dysregulation of the ryanodine receptor RyR2. CALM2
  D96V was one of the two founding calmodulinopathy variants (Crotti et al.
  2013): a girl with fetal bradycardia from 21 weeks, 2:1 atrioventricular
  block in utero, QTc 690 ms at birth and cardiac arrest at three weeks.
  Makita et al. 2014 added five de novo CALM2 variants spanning long QT and
  LQTS/CPVT overlap, with generally milder disease and mostly beta-blocker
  responsive, although one Q136P carrier died suddenly on therapy. Cell models
  of CALM2 D96V and D130G confirm abolished calcium-dependent inactivation of
  Cav1.2 and action potential prolongation.
category: Genetic

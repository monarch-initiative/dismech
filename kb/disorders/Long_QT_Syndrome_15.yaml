- name: CALM2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: CALM2
    term:
      id: hgnc:1445
      label: CALM2
  association: Pathogenic Variants
  notes: >-
    CALM2 carries the LQT15 designation. ClinGen classifies CALM2 as Definitive
    for long QT syndrome (assertion against MONDO:0002442) and Moderate for CPVT
    (assertion against MONDO:0017990); neither is against MONDO:0014550, so both
    are cited as evidence here rather than recorded in gene_disease_validity.
    In the 2023 registry CALM2 carriers had an intermediate cardiac event rate
    (70%, against 88% for CALM1 and 57% for CALM3), counted over all phenotypes.
  variants:
  - name: p.Asp96Val
    description: >-
      CALM2 missense variant (D96V) at a calcium-coordinating aspartate of the
      third EF-hand, de novo in a founding calmodulinopathy proband with fetal
      bradycardia, in-utero 2:1 block, QTc 690 ms, T-wave alternans and cardiac
      arrest at three weeks. In guinea-pig ventricular myocytes it abolishes
      calcium-dependent inactivation of the L-type current.
    evidence:
    - reference: PMID:23388215
      reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In proband 2, a missense mutation in CALM2 (chr 2p21) predicted replacement of another highly conserved aspartic acid residue at position 96 with valine (D96V)."
      explanation: Identifies the de novo CALM2 D96V variant in the founding proband.
    - reference: PMID:24816216
      reference_title: Calmodulin mutations associated with long QT syndrome prevent inactivation of cardiac L-type Ca(2+) currents and promote proarrhythmic behavior in ventricular myocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Importantly, expression of mutant CaMD96V essentially abolished CDI in this native setting"
      explanation: CALM2 D96V abolishes native L-type channel inactivation.
  - name: p.Asp130Gly
    description: >-
      CALM2 missense variant (D130G) at a fourth-EF-hand aspartate.
      Patient-derived iPSC cardiomyocytes carrying it show prolonged action potentials
      and diminished calcium-dependent inactivation, rescued by CRISPR
      interference silencing of the mutant allele. The same substitution is a
      recurrent long-QT variant in CALM1 and CALM3.
    evidence:
    - reference: PMID:27765793
      reference_title: A Precision Medicine Approach to the Rescue of Function on Malignant Calmodulinopathic Long-QT Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Next-generation whole exome sequencing followed by CALM1, CALM2, and CALM3 gene-specific analysis identified a p.D130G-CaM mutation (c.389 A>G, CALM2) within the patient"
      explanation: Identifies the CALM2 D130G variant in the iPSC-model patient.
    - reference: PMID:27765793
      reference_title: A Precision Medicine Approach to the Rescue of Function on Malignant Calmodulinopathic Long-QT Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Indeed, suppression of CALM2 expression produced a functional rescue in induced pluripotent stem cell-derived cardiomyocytes with D130G-CALM2, as shown by the normalization of action potential duration and Ca2+/CaM-dependent inactivation after treatment."
      explanation: Selective silencing of the CALM2 allele normalized the cellular phenotype.
  - name: p.Asn98Ser
    description: >-
      CALM2 missense variant (N98S) in the third EF-hand, de novo in a
      Japanese boy with long QT. The identical substitution in CALM1 was first
      reported in CPVT, so the same amino acid change gives different
      phenotypes from different calmodulin genes.
    evidence:
    - reference: PMID:24917665
      reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whereas CALM1-p.N98S was originally found in an Iraqi female with CPVT,13 we identified CALM2-p.N98S in a Japanese male with an unambiguous LQTS phenotype (Case 2)."
      explanation: Identifies the de novo CALM2 N98S long QT variant and the gene-dependent phenotype difference.
  - name: p.Asn98Ile
    description: >-
      CALM2 missense variant (N98I) in the third EF-hand, de novo in an English
      boy who had cardiac arrest at 17 months with bradycardia and QTc 555 ms.
    evidence:
    - reference: PMID:24917665
      reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the proband was found to have de novo nonsynonymous variants in 4 protein-coding genes (CALM2, OBSCN, DLG1, GOLGA3)"
      explanation: Identifies the de novo CALM2 N98I variant in the 17-month cardiac-arrest case.
  - name: p.Asp133His
    description: >-
      CALM2 missense variant at a calcium-coordinating residue of the fourth
      EF-hand, found in a girl with LQTS, fetal bradycardia, recurrent syncope,
      QTc 579 ms and multiple cardiac arrests. It impairs Cav1.2
      calcium-dependent inactivation and reduces Kv7.1 activation. Makita et
      al. call the same substitution in the same patient D134H, counting the
      initiator methionine as residue 1.
    evidence:
    - reference: PMID:24917665
      reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The nucleotide change predicts the substitution of a conserved aspartic acid residue with histidine (p.D134H) within the fourth EF-hand calcium-binding motif in the C-terminal domain of the encoded calmodulin protein."
      explanation: >-
        Identifies the variant (Makita's D134H numbering) and its EF-hand
        location in the long QT patient.
    - reference: PMID:41294816
      reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "One example is a CALM2 missense mutation encoding Asp133His (D133H), which alters a Ca2+-coordinating residue in the fourth EF-hand."
      explanation: The functional study's name (D133H) for the same substitution.
  - name: p.Gln136Pro
    description: >-
      CALM2 missense variant (Q136P) in the fourth EF-hand, de novo in a girl
      with mixed LQTS and CPVT features who died suddenly during exertion at age
      11 despite beta-blocker therapy.
    evidence:
    - reference: PMID:24917665
      reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant (c.A407>C, Fig. 5A) predicted the replacement of glutamine at position 136 with proline (p.Q136P) in the fourth EF-hand calcium-binding motif (Fig. 5B,C)."
      explanation: Identifies the de novo CALM2 Q136P variant in the mixed-phenotype fatal case.
  - name: p.Asp132Glu
    description: >-
      De novo CALM2 variant (D132E) in a patient with mixed CPVT and LQTS
      features; the same substitution occurred de novo in CALM3 in a CPVT
      patient.
    evidence:
    - reference: CGGV:assertion_42d280da-accc-46f2-8832-47d5a3eeeba7-2021-06-17T160000.000Z
      reference_title: "CALM2 / catecholaminergic polymorphic ventricular tachycardia (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Asp132Glu variant was detected in a patient with mixed features of CPVT and LQTS"
      explanation: ClinGen's record of the mixed-phenotype de novo CALM2 case.
  evidence:
  - reference: CGGV:assertion_86e4b783-3b60-4a1d-ab34-e61d27751ca6-2018-09-25T160000.000Z
    reference_title: "CALM2 / long QT syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CALM2 | HGNC:1445 | long QT syndrome | MONDO:0002442 | AD | Definitive"
    explanation: >-
      ClinGen classifies the CALM2-long QT syndrome relationship as definitive
      with autosomal dominant inheritance, against the broader long QT syndrome
      term.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the Working Group concluded a classification of Definitive for the calmodulin genes (CALM1-3) for disease causation of LQTS with atypical features presenting in childhood"
    explanation: The published account of the ClinGen definitive classification, scoped to atypical childhood LQTS.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CALM1 and CALM2 were first associated with LQTS by exome sequencing of 2 unrelated infants with QT prolongation where de novo variants were identified."
    explanation: The founding CALM2-LQTS observation was a de novo variant in an infant.
  - reference: CGGV:assertion_42d280da-accc-46f2-8832-47d5a3eeeba7-2021-06-17T160000.000Z
    reference_title: "CALM2 / catecholaminergic polymorphic ventricular tachycardia (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CALM2 | HGNC:1445 | catecholaminergic polymorphic ventricular tachycardia | MONDO:0017990 | AD | Moderate"
    explanation: ClinGen also classifies CALM2 for CPVT, the overlap phenotype.
  - reference: PMID:37528649
    reference_title: "Clinical presentation of calmodulin mutations: the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, cardiac events decreased from CALM1 [46/52, 88% (95% CI 77%–96%)], to CALM2 [37/53, 70% (95% CI 56%–82%)], to CALM3 [20/35, 57% (95% CI 39%–74%)] (P = .004)."
    explanation: >-
      Per-gene registry figure: 37 of 53 CALM2 carriers (70%, all phenotypes)
      had a cardiac event, intermediate between CALM1 and CALM3.
  - reference: PMID:24917665
    reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical severity among subjects in this series was generally less than that originally reported for CALM1 and CALM2 associated with recurrent cardiac arrest during infancy."
    explanation: >-
      The five later CALM2 carriers had milder, later-onset disease than the
      founding CALM2 D96V infant.
treatments:
- name: Beta-Blocker Therapy
  description: >-
    Anti-adrenergic first-line therapy; cardiac events in calmodulinopathy are
    mostly adrenergically triggered. Response is variable and often
    insufficient. In the founding CALM2 D96V proband esmolol and propranolol
    restored 1:1 atrioventricular conduction. Four of Makita's five CALM2
    carriers responded to beta-blockers, but the Q136P carrier died suddenly on
    therapy. The Spanish paediatric registry pools calmodulinopathies with other
    high-risk genotypes.
  treatment_term:
    preferred_term: beta-blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:42466893
    reference_title: "Paediatric long QT syndrome: clinical outcomes and therapy in the Spanish National Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "These data support the current genotype and QTc-guided management strategy, with beta-blockers as the cornerstone therapy and selective use of left cardiac sympathetic denervation and ICDs in high-risk profiles."
    explanation: >-
      Paediatric LQTS registry in which calmodulinopathies are among the
      high-risk genotypes; the management conclusion is not calmodulin-specific.
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postnatally, esmolol and propranolol treatment restored 1:1 AV conduction, but lidocaine did not shorten the QTc interval."
    explanation: Beta-blockade restored conduction in the founding CALM2 D96V proband.
  - reference: PMID:24917665
    reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of 5 probands responded to β-blocker therapy, whereas 1 subject with mutation p.Q136P died suddenly during exertion despite this treatment."
    explanation: >-
      Most of Makita's CALM2 carriers responded to beta-blockade; one died
      suddenly despite it.
- name: Mexiletine
  description: >-
    Sodium channel blocker added to beta-blockade. In Makita's CALM2 D134H
    carrier mexiletine shortened the QTc, and ventricular arrhythmias were
    prevented while she took it. In the pooled CALM1-3 registry mexiletine
    suppressed arrhythmias in 4 of 11 assessable CALM-LQTS patients but seldom
    shortened QTc.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mexiletine
      term:
        id: CHEBI:6916
        label: mexiletine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:24917665
    reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas mexiletine shortened QTc from 596 ms to 550 ms (Fig. 1B)"
    explanation: Mexiletine shortened the QT interval in Makita's CALM2 D134H carrier.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The effect of mexiletine could be assessed in 11 CALM-LQTS patients, and among them arrhythmia suppression was reported in 4 (36%)."
    explanation: Pooled CALM1-3 registry; arrhythmia suppression in a minority of patients.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, at variance with LQT3,25 only in one of the six CALM-LQTS cases acute oral mexiletine significantly shortened QTc."
    explanation: Pooled CALM1-3 registry; mexiletine seldom shortens QTc in CALM-LQTS.
- name: Left Cardiac Sympathetic Denervation
  description: >-
    Surgical anti-adrenergic escalation, used mainly in high-risk paediatric LQTS
    patients, a group that includes calmodulinopathies.
  treatment_term:
    preferred_term: left cardiac sympathetic denervation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:42466893
    reference_title: "Paediatric long QT syndrome: clinical outcomes and therapy in the Spanish National Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Left cardiac sympathetic denervation was performed in 33 (8.9%), mainly high-risk patients, and was associated with >80% arrhythmia-free survival without major complications."
    explanation: Outcome in mainly high-risk paediatric LQTS patients; not reported separately for calmodulinopathies.
- name: Implantable Cardioverter-Defibrillator Placement
  description: >-
    Device therapy for high-risk patients; in the cited paediatric registry a
    third of implanted children received appropriate therapies and a quarter
    had complications.
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  therapeutic_modality: DEVICE
  evidence:
  - reference: PMID:42466893
    reference_title: "Paediatric long QT syndrome: clinical outcomes and therapy in the Spanish National Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "ICDs were implanted in 33 children (8.9%); 10 (30%) received appropriate therapies, and 8 (24%) experienced complications."
    explanation: Benefit and complication burden of ICDs in paediatric LQTS, not calmodulin-specific.
diagnosis:
- name: Genetic testing of the calmodulin genes
  description: >-
    Genetic testing for CALM1, CALM2 and CALM3 is recommended in LQTS with
    atypical features (infant or early-childhood onset, bradycardia or
    atrioventricular block, severe QT prolongation). These genes were the least
    often included on commercial LQTS panels at the time of the reappraisal.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing for genes (CALM1, CALM2, CALM3, TRDN) in LQTS with atypical features should be considered in patients with clinical observations concordant with the specific phenotypic expression demonstrated in reported cases."
    explanation: Recommendation to test the calmodulin genes in atypical LQTS.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "were least likely to be included and were found in only 39% to 75% of panels"
    explanation: The calmodulin genes were often missing from commercial LQTS panels.
prevalence:
- population: International Calmodulinopathy Registry, 2023 update (CALM2 carriers)
  measure_type: CASES_IN_LITERATURE
  notes: >-
    No population prevalence or incidence has been estimated. The 2023 registry
    update enrolled 140 calmodulin variant carriers; the per-gene denominators
    of its cardiac-event comparison (52 CALM1, 53 CALM2, 35 CALM3) sum to that
    total, so 53 registry patients carried a CALM2 variant. They span the long
    QT, CPVT, overlap and idiopathic ventricular fibrillation presentations, so
    the count is not of long QT syndrome alone.
  evidence:
  - reference: PMID:37528649
    reference_title: "Clinical presentation of calmodulin mutations: the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, the ICalmR has enrolled 140 patients with 62 genetic variants (notably, all missense variants) in the CALM1, CALM2, and CALM3 genes"
    explanation: Size of the pooled CALM1-3 registry.
  - reference: PMID:37528649
    reference_title: "Clinical presentation of calmodulin mutations: the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, cardiac events decreased from CALM1 [46/52, 88% (95% CI 77%–96%)], to CALM2 [37/53, 70% (95% CI 56%–82%)], to CALM3 [20/35, 57% (95% CI 39%–74%)] (P = .004)."
    explanation: Gives 53 CALM2 carriers among the registry's patients.
environmental:
- name: Exertion and Adrenergic Stimulation
  description: >-
    Physical exertion and other adrenergic stimuli trigger arrhythmic events.
    Makita's CALM2 carriers had exertion-induced arrhythmias, including a
    sudden death during exertion on beta-blockers. In the pooled CALM1-3
    registry most cardiac events were adrenergically triggered, mostly by
    exertion.
  exposure_term:
    preferred_term: physical exertion
    term:
      id: ECTO:6000002
      label: exposure to exercise
  evidence:
  - reference: PMID:24917665
    reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we report discovery of five novel de novo CALM2 mutations in association with LQTS and exertion-induced arrhythmias."
    explanation: Exertion-induced arrhythmias in five CALM2 carriers.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Triggers of cardiac events were adrenergic stimuli in 81% of patients, irrespective of the phenotype and mostly (62%) associated with exertion."
    explanation: Pooled CALM1-3 registry figure, not broken down by gene.
  influences_mechanisms:
  - target: Polymorphic Ventricular Tachycardia
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Exertion precipitates the ventricular arrhythmias. Emotional stress,
      the other adrenergic trigger reported, has no comparably specific ECTO
      term and is named only here.
    evidence:
    - reference: PMID:24917665
      reference_title: Novel calmodulin mutations associated with congenital arrhythmia susceptibility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Four of 5 probands responded to β-blocker therapy, whereas 1 subject with mutation p.Q136P died suddenly during exertion despite this treatment."
      explanation: A fatal arrhythmia during exertion in a CALM2 Q136P carrier.
    - reference: PMID:31170290
      reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Triggers of cardiac events were adrenergic stimuli in 81% of patients, irrespective of the phenotype and mostly (62%) associated with exertion."
      explanation: Pooled CALM1-3 registry figure for exertion-triggered events.
animal_models:
- name: Calm2 N98S heterozygous knock-in mouse
  species: Mouse
  genotype: Calm2 c.293A>G (p.N98S) heterozygous (Calm2N98S/+)
  background: C57BL/6J
  publication: PMID:37589122
  description: >-
    CRISPR/Cas9 knock-in of the recurrent human N98S calmodulin variant into
    mouse Calm2. Heterozygous mice have sinus bradycardia and develop
    arrhythmias after epinephrine and caffeine, but no QTc prolongation at
    baseline. The Calm2 model is milder than the matching Calm1 model, and
    flecainide did not prevent the induced arrhythmias.
  evidence:
  - reference: PMID:37589122
    reference_title: Sex and Gene Influence Arrhythmia Susceptibility in Murine Models of Calmodulinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Calm2 S/+ mice exhibited a less severe phenotype, with female Calm2 S/+ mice having the least severe arrhythmia susceptibility."
    explanation: The Calm2 N98S model is milder than the Calm1 N98S model.
  modeled_mechanisms:
  - target: Bradycardia
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Sinus bradycardia in heterozygous Calm2 N98S mice of both sexes.
    limitations: >-
      Mouse heart rate and pacemaker physiology differ from human; the human
      bradycardia is often fetal and accompanied by 2:1 block, which the model
      does not show.
    evidence:
    - reference: PMID:37589122
      reference_title: Sex and Gene Influence Arrhythmia Susceptibility in Murine Models of Calmodulinopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Calm1N98S/+ (Calm1S/+) or Calm2N98S/+ (Calm2S/+) mice exhibited sinus bradycardia and were more susceptible to arrhythmias after exposure to epinephrine and caffeine."
      explanation: Sinus bradycardia in the Calm2 knock-in.
  - target: Polymorphic Ventricular Tachycardia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ventricular arrhythmias, including sustained events in most males, appear
      only after epinephrine and caffeine challenge.
    limitations: >-
      Arrhythmias are pharmacologically provoked rather than spontaneous, and
      fewer male Calm2 mice than male Calm1 mice had sustained arrhythmias.
    evidence:
    - reference: PMID:37589122
      reference_title: Sex and Gene Influence Arrhythmia Susceptibility in Murine Models of Calmodulinopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Calm1N98S/+ (Calm1S/+) or Calm2N98S/+ (Calm2S/+) mice exhibited sinus bradycardia and were more susceptible to arrhythmias after exposure to epinephrine and caffeine."
      explanation: Catecholamine-provoked arrhythmia susceptibility in the Calm2 knock-in.
  - target: Prolonged QT Interval
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Baseline QTc is not prolonged; after epinephrine and caffeine, QTc
      prolongation was seen only in male Calm1 N98S mice.
    limitations: >-
      The model does not show the QT prolongation that defines LQT15, so it
      informs the adrenergic arrhythmia arm rather than the long QT arm. The
      human N98S variant itself is reported with long QT, CPVT and idiopathic
      ventricular fibrillation presentations.
    evidence:
    - reference: PMID:37589122
      reference_title: Sex and Gene Influence Arrhythmia Susceptibility in Murine Models of Calmodulinopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At baseline, the QTc interval and QRS duration between male and female WT and N98S littermate mice were not significantly different"
      explanation: No baseline QTc prolongation in either N98S knock-in.
    - reference: PMID:37589122
      reference_title: Sex and Gene Influence Arrhythmia Susceptibility in Murine Models of Calmodulinopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By contrast, QTc and QRS were significantly prolonged after epi/caf in male Calm1S/+ mice compared to male Calm1+/+ littermates"
      explanation: Provoked QTc prolongation was reported for the Calm1 model, not the Calm2 model.

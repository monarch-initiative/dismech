      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:35018708
    reference_title: "Clinical and molecular characterization of five new individuals with WAC-related intellectual disability: Evidence of pathogenicity for a novel splicing variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WAC-related intellectual disability (ID) is a rare genetic condition characterized by a spectrum of neurodevelopmental disorders of varying severity, including global developmental delay (GDD), ID, and autism spectrum disorder.
    explanation: >-
      This supports WAC-related haploinsufficiency as the basis of the
      neurodevelopmental syndrome.
  - reference: PMID:26264232
    reference_title: "WAC loss-of-function mutations cause a recognisable syndrome characterised by dysmorphic features, developmental delay and hypotonia and recapitulate 10p11.23 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data highly suggest that WAC haploinsufficiency is responsible for most of the phenotypic features associated with deletions encompassing 10p11.23.
    explanation: >-
      Directly establishes WAC haploinsufficiency as the core dosage-sensitive
      disease mechanism.
  downstream:
  - target: Disrupted Transcription-Coupled Histone H2B Ubiquitination
    description: >-
      Reduced WAC adaptor dosage impairs RNF20/40-mediated histone H2B
      ubiquitination and downstream neuronal transcriptional regulation.
  - target: Impaired ULK activation and autophagy
    description: Loss of WAC disrupts one of its established cellular functions in autophagy regulation
  - target: Cardiac malformation
    description: >-
      Contiguous 10p12p11 deletions spanning WAC and neighboring loci are
      associated with congenital heart malformations.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormality of vision
    description: >-
      WAC dosage loss and 10p12p11 microdeletions are associated with visual
      abnormalities through an unestablished developmental pathway.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ventricular septal defect
    description: >-
      Congenital cardiac malformation reported with WAC loss of function; the
      developmental route from WAC dosage to the septal defect is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Bicuspid aortic valve
    description: >-
      Congenital outflow-tract valve malformation reported with WAC loss of
      function; the developmental route is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Constipation
    description: >-
      Gastrointestinal dysmotility and constipation occur frequently in
      WAC-related haploinsufficiency via an unestablished enteric or autonomic
      mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

pathophysiology:
- name: WAC haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    DeSanto-Shinawi syndrome results from heterozygous loss-of-function variants
    or 10p12p11 microdeletions reducing functional dosage of WAC, a WW-domain
    and coiled-coil molecular adaptor that partners with the RNF20/40 ubiquitin
    ligase complex in the nucleus and regulates GM130-GABARAP interactions at
    the centrosome.

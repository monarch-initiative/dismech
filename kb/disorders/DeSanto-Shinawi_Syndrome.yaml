  - reference: PMID:29190062
    reference_title: "WAC-Related Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WAC-related ID is inherited in an autosomal dominant manner. With the exception of one family with presumed parental germline mosaicism, all individuals diagnosed to date have the disorder as the result of a de novo pathogenic variant.
    explanation: >-
      GeneReviews confirms autosomal dominant inheritance, predominantly from
      de novo pathogenic variants with rare parental germline mosaicism.

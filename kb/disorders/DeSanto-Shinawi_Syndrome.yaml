- name: Cardiac malformation
  category: Cardiovascular
  subtype: 10p11.21p12.31 microdeletion
  description: >-
    Cardiac malformation was reported in six of seven patients in the series that
    defined the 10p12p11 deletion syndrome. It is scoped to the deletion subtype:
    the intragenic-variant series did not report cardiac malformation, and no
    frequency for the intragenic form has been established, so this phenotype
    makes no claim about that subtype. Whether the cardiac finding is attributable
    to WAC dosage or to neighbouring genes lost in the larger deletions is not
    settled.

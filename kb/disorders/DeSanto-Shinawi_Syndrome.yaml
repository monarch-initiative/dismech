has_subtypes:
- name: WAC point mutation
  display_name: DeSanto-Shinawi syndrome due to WAC point mutation
  description: >-
    The form caused by a heterozygous intragenic WAC sequence variant — in
    reported series most often de novo nonsense, frameshift, or splice-site
    changes predicted to cause loss of function, alongside occasional missense
    variants. MONDO and Orphanet name this branch "point mutation" to contrast
    it with the contiguous-gene deletion form; the label should be read as
    "intragenic sequence variant" rather than as a restriction to single
    nucleotide substitutions. The published pathophysiology and phenotype of
    this entry are drawn almost entirely from cohorts of this kind.
  subtype_term:
    preferred_term: DeSanto-Shinawi syndrome due to WAC point mutation
    term:
      id: MONDO:0014741
      label: DeSanto-Shinawi syndrome due to WAC point mutation
  genes:
  - preferred_term: WAC
    term:
      id: hgnc:17327
      label: WAC
  evidence:
  - reference: PMID:26264232
    reference_title: "WAC loss-of-function mutations cause a recognisable syndrome characterised by dysmorphic features, developmental delay and hypotonia and recapitulate 10p11.23 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five heterozygous de novo WAC mutations were identified in six patients. Three of the mutations were nonsense, and two were frameshift; all are predicted to cause loss of function either through nonsense-mediated mRNA decay or protein truncation.
    explanation: >-
      Defines the intragenic-variant form of the syndrome and its variant
      classes, which is what this MONDO subtype denotes.
  - reference: PMID:26757981
    reference_title: "De novo loss-of-function mutations in WAC cause a recognizable intellectual disability syndrome and learning deficits in Drosophila."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we report on 10 individuals with de novo WAC mutations which we identified through routine (diagnostic) exome sequencing and targeted resequencing of WAC in 2326 individuals with unexplained ID.
    explanation: >-
      A second independent cohort ascertained by sequencing rather than by array,
      confirming the intragenic-variant form as a recognizable entity.
- name: 10p11.21p12.31 microdeletion
  display_name: DeSanto-Shinawi syndrome due to 10p11.21p12.31 microdeletion
  description: >-
    The form caused by an interstitial deletion of 10p spanning WAC, first
    delineated as the 10p12p11 contiguous gene deletion syndrome. Reported
    deletions range from about 1 Mb to over 10 Mb, so genes other than WAC are
    lost in most patients and the phenotype is not necessarily reducible to WAC
    dosage alone; the smallest region of overlap nonetheless contains WAC, and
    the intragenic-variant cohorts recapitulate the core neurodevelopmental and
    craniofacial features. Cardiac malformation was reported in six of seven
    patients in the defining deletion series, a frequency not established for
    the intragenic form and not carried over to this entry's phenotype section.
  subtype_term:
    preferred_term: DeSanto-Shinawi syndrome due to 10p11.21p12.31 microdeletion
    term:
      id: MONDO:0017283
      label: DeSanto-Shinawi Syndrome due to 10p11.21p12.31 microdeletion
  genes:
  - preferred_term: WAC
    term:
      id: hgnc:17327
      label: WAC
  evidence:
  - reference: PMID:21522184
    reference_title: "Genomic and clinical characteristics of six patients with partially overlapping interstitial deletions at 10p12p11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the molecular karyotyping and phenotypic description of six new unrelated patients with partially overlapping microdeletions at 10p12.31p11.21 ranging from 1.0 to 10.6 Mb.
    explanation: >-
      The defining series for the deletion subtype, establishing the interval and
      its size range.
  - reference: PMID:26264232
    reference_title: "WAC loss-of-function mutations cause a recognisable syndrome characterised by dysmorphic features, developmental delay and hypotonia and recapitulate 10p11.23 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data highly suggest that WAC haploinsufficiency is responsible for most of the phenotypic features associated with deletions encompassing 10p11.23.
    explanation: >-
      Argues that WAC haploinsufficiency accounts for most of the deletion
      phenotype, which is the basis for placing the deletion form under the same
      disease as the intragenic form rather than curating it separately. Note the
      claim is "most", not all.

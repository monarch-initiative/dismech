  title: "Cutaneous bacillary angiomatosis in renal transplant recipients: report of three new cases and literature review."
infectious_agent:
- name: Bartonella henselae
  description: >-
    Cat-associated Gram-negative Bartonella species that causes bacillary
    angiomatosis-peliosis and is epidemiologically linked to cat and flea
    exposure.
  infectious_agent_term:
    preferred_term: Bartonella henselae
    term:
      id: NCBITaxon:38323
      label: Bartonella henselae
  evidence:
  - reference: PMID:21285862
    reference_title: "Bacillary angiomatosis in an immunocompetent child: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bacillary angiomatosis is an infectious disease caused by 2 gram-negative
      bacilli, Bartonella henselae and Bartonella quintana.
    explanation: >-
      The case-report review directly identifies B. henselae as one of the two
      recognized bacillary angiomatosis etiologic agents.
- name: Bartonella quintana
  description: >-
    Human-louse-associated Gram-negative Bartonella species that causes bacillary
    angiomatosis-peliosis and is epidemiologically linked to low income,
    homelessness, and louse exposure.
  infectious_agent_term:
    preferred_term: Bartonella quintana
    term:
      id: NCBITaxon:803
      label: Bartonella quintana
  evidence:
  - reference: PMID:21285862
    reference_title: "Bacillary angiomatosis in an immunocompetent child: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bacillary angiomatosis is an infectious disease caused by 2 gram-negative
      bacilli, Bartonella henselae and Bartonella quintana.
    explanation: >-
      The case-report review directly identifies B. quintana as one of the two
      recognized bacillary angiomatosis etiologic agents.
transmission:
- name: Cat scratch, cat bite, and cat flea exposure
  description: >-
    Bartonella henselae reaches people from its feline reservoir. Contact with a
    cat, through a scratch or a bite, and the cat flea that keeps the organism
    circulating in cat populations are the exposures that distinguish B.
    henselae bacillary angiomatosis from the B. quintana form.
  evidence:
  - reference: PMID:9407154
    reference_title: "Molecular epidemiology of bartonella infections in patients with bacillary angiomatosis-peliosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with B. henselae infection were identified throughout the study period and were epidemiologically linked to cat and flea exposure (P< or =0.004)"
    explanation: >-
      A molecular-epidemiology series of bacillary angiomatosis-peliosis
      patients links the B. henselae cases specifically to cat and flea
      exposure.
  - reference: PMID:22316326
    reference_title: "Cutaneous bacillary angiomatosis in renal transplant recipients: report of three new cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A history of cat exposure exists in most cases and pediatric OTR are at higher risk."
    explanation: >-
      Establishes cat exposure as the usual reported history in bacillary
      angiomatosis cases.
  - reference: PMID:22316326
    reference_title: "Cutaneous bacillary angiomatosis in renal transplant recipients: report of three new cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prevention consists of regular use of a flea-control product in cats and prompt cleaning of scratches."
    explanation: >-
      Names the cat flea and the cat scratch as the two exposures prevention is
      aimed at, which is the route stated from the other direction.
- name: Human body louse transmission
  description: >-
    Bartonella quintana has no animal reservoir and is carried between people by
    the human body louse, so the B. quintana form of bacillary angiomatosis
    clusters in populations where louse infestation is common.
  evidence:
  - reference: PMID:9895398
    reference_title: "Chronic Bartonella quintana bacteremia in homeless patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tests of lice from 3 of the 15 patients from whom they were collected were positive for B. quintana."
    explanation: >-
      Recovers B. quintana from body lice taken from the bacteraemic patients
      themselves, documenting the louse as the carrier in this population.
  - reference: PMID:9407154
    reference_title: "Molecular epidemiology of bartonella infections in patients with bacillary angiomatosis-peliosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas those with B. quintana were clustered and were characterized by low income (P=0.003), homelessness (P = 0.004), and exposure to lice (P= 0.03)"
    explanation: >-
      The same patient series associates the B. quintana cases with louse
      exposure rather than with cat contact.
progression:
- phase: Bartonella-associated vasoproliferation
  notes: >-
    B. henselae or B. quintana infection establishes Bartonella endothelial
    virulence signaling in a host whose impaired immunity permits proliferative
    angiomatous lesions instead of contained infection.
  evidence:
  - reference: PMID:9407154
    reference_title: Molecular epidemiology of bartonella infections in patients with bacillary angiomatosis-peliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 49 patients with bacillary angiomatosis-peliosis, 26 (53 percent)
      were infected with B. henselae and 23 (47 percent) with B. quintana.
    explanation: >-
      Molecular epidemiology in bacillary angiomatosis-peliosis tissue
      implicates both Bartonella species in human vasoproliferative disease.
- phase: Cutaneous and disseminated lesion formation
  notes: >-
    Angiomatous papules, nodules, and plaques may remain cutaneous or involve
    liver, spleen, bone, blood, endocardium, and nearly any organ in advanced
    infection.
  evidence:
  - reference: PMID:11362939
    reference_title: Bartonella-associated infections in HIV-infected patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients may have osseus BA lesions (frequently affecting the long bones);
      hepatic and/or splenic lesions; bacteremia; or endocarditis.
    explanation: >-
      The review summarizes the disseminated skeletal, hepatosplenic,
      bloodstream, and endocardial extension of bacillary angiomatosis in
      HIV-associated Bartonella infection.
pathophysiology:
- name: Bartonella Infection in Immunocompromised Host
  description: >-
    B. henselae or B. quintana reaches tissue in a host whose immune suppression
    permits Bartonella infection to progress into bacillary angiomatosis rather
    than remaining a contained lymphadenitic infection.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:24933445
    reference_title: Pathogenicity and treatment of Bartonella infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical manifestations can range from benign and self-limited to severe
      and life-threatening disease.
    explanation: >-
      The Bartonella pathogenicity review supports a host-context-dependent
      clinical spectrum from benign to severe disease.
  downstream:
  - target: Bartonella Angiogenic VEGFR2 Signaling
    description: >-
      Infected tissue exposes endothelial cells to Bartonella angiogenic factors.
  - target: Bartonella Intracellular Persistence
    description: >-
      Bartonella infection includes host-cell-associated bacterial niches that
      motivate intracellularly active antibacterial therapy.
  - target: Bartonella Ribosomal Translation
    description: >-
      Bacillary angiomatosis depends on living Bartonella with active bacterial
      ribosomal protein synthesis.
  - target: Fever
    description: Systemic Bartonella infection can present with fever.
  - target: Lymphadenopathy
    description: Systemic Bartonella disease may include lymph-node enlargement.
  - target: Anemia
    description: Disseminated B. henselae disease can include anemia in advanced HIV.
  - target: BadA-Mediated Endothelial Adhesion and VEGF Secretion
    description: >-
      B. henselae BadA supports endothelial adhesion and proangiogenic VEGF
      secretion.
  - target: VirB/D4 Bep Endothelial Survival Signaling
    description: >-
      VirB/D4-secreted Bep effectors separately inhibit endothelial apoptosis
      and induce angiogenic reprogramming.
- name: Bartonella Angiogenic VEGFR2 Signaling
  description: >-
    Bartonella BafA acts as a pro-angiogenic autotransporter whose passenger
    domain activates VEGF receptor 2 signaling, stimulating endothelial
    proliferation and angiogenesis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: vascular endothelial growth factor receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0048010
      label: vascular endothelial growth factor receptor signaling pathway
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  evidence:
  - reference: PMID:32678094
    reference_title: The Bartonella autotransporter BafA activates the host VEGF pathway to drive angiogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      BafA interacts with vascular endothelial growth factor (VEGF) receptor-2
      and activates the downstream signaling pathway, suggesting that BafA
      functions as a VEGF analog.
    explanation: >-
      Identifies BafA as a Bartonella VEGFR2-activating ligand, the upstream
      signal driving endothelial angiogenesis in this node.
  downstream:
  - target: Lobular Capillary Proliferation
    causal_link_type: DIRECT
    description: >-
      VEGFR2-dependent angiogenic signaling drives capillary endothelial
      proliferation.
    evidence:
    - reference: PMID:32678094
      reference_title: The Bartonella autotransporter BafA activates the host VEGF pathway to drive angiogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we use functional transposon-mutant screening in Bartonella
        henselae to identify such factor as a pro-angiogenic autotransporter,
        called BafA.
      explanation: >-
        Functional screening links BafA to Bartonella-induced pro-angiogenic
        endothelial behavior.
- name: BadA-Mediated Endothelial Adhesion and VEGF Secretion
  description: >-
    Bartonella henselae BadA supports endothelial adhesion, extracellular-matrix
    binding, and HIF-1-dependent VEGF secretion that separately prime infected
    endothelium for angioproliferation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  evidence:
  - reference: PMID:18627378
    reference_title: The head of Bartonella adhesin A is crucial for host cell interaction of Bartonella henselae.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of Bartonella adhesin A (BadA) is crucial for bacterial
      autoagglutination, adhesion to host cells, binding to extracellular matrix
      proteins and proangiogenic reprogramming via activation of hypoxia
      inducible factor (HIF)-1.
    explanation: >-
      B. henselae endothelial-cell experiments link BadA itself to host-cell
      adhesion and HIF-1-mediated angiogenic reprogramming.
  downstream:
  - target: Lobular Capillary Proliferation
    description: >-
      BadA-dependent adhesion and VEGF secretion promote the endothelial
      proliferation that forms bacillary angiomas.
- name: VirB/D4 Bep Endothelial Survival Signaling
  description: >-
    Bartonella henselae VirB/D4 translocates Bep effector proteins that drive
    invasome uptake, inhibit endothelial apoptosis, and activate an angiogenic
    phenotype independently of dense BadA expression.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: negative regulation of apoptotic process
    modifier: INCREASED
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  evidence:
  - reference: PMID:23163798
    reference_title: Bartonella henselae trimeric autotransporter adhesin BadA expression interferes with effector translocation by the VirB/D4 type IV secretion system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      VirB/D4 translocates several Bartonella effector proteins (Beps) into the
      cytoplasm of infected ECs, resulting, e.g. in uptake of bacterial
      aggregates via the invasome structure, inhibition of apoptosis and
      activation of a proangiogenic phenotype.
    explanation: >-
      The paper's opening summary of prior endothelial-cell work supports
      modelling VirB/D4 Bep translocation as a pro-survival angiogenic branch;
      the node is separated from BadA because this study found that dense BadA
      interferes with VirB/D4-dependent effector translocation.
  downstream:
  - target: Lobular Capillary Proliferation
    description: >-
      VirB/D4-dependent endothelial survival and angiogenic reprogramming
      amplify capillary proliferation in bacillary angiomas.
- name: Lobular Capillary Proliferation
  description: >-
    Bartonella-driven endothelial signaling expands irregular dermal and
    visceral capillaries into nodular lobular proliferations with a mixed
    inflammatory stromal infiltrate and extracellular bacterial aggregates.
  biological_scale: TISSUE
  locations:

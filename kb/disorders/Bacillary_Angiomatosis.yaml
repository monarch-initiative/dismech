    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an outbreak of urban trench fever among homeless people in Marseilles,
      B. quintana infections were associated with body lice in patients with
      nonspecific symptoms or no symptoms.
    explanation: >-
      Establishes body lice as the B. quintana vector in the same

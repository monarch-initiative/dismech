treatments:
- name: Prolonged Macrolide or Tetracycline Therapy
  description: >-
    Prolonged macrolide or tetracycline therapy treats angioproliferative
    Bartonella lesions, with erythromycin as a first-line agent, doxycycline as
    an alternative, and azithromycin or clarithromycin as reported macrolide
    options.

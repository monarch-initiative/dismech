name: Bacillary Angiomatosis
creation_date: "2026-09-26T07:38:50Z"
category: Infectious Disease
description: >-
  Bacillary angiomatosis is a Bartonella-driven vasoproliferative infection
  characterized by tumor-like capillary lesions of the skin, subcutaneous
  tissue, liver, spleen, bone, and other viscera, chiefly in immunocompromised
  hosts.
disease_term:
  preferred_term: bacillary angiomatosis
  term:
    id: MONDO:0000758
    label: bacillary angiomatosis
parents:
- bartonellosis
- angiomatosis
- skin disease caused by bacterial infection
synonyms:
- Bartonella angiomatosis
- bacillary epithelioid angiomatosis
- epithelioid angiomatosis
infectious_agent:
- name: Bartonella henselae
  description: >-
    Cat-associated Gram-negative Bartonella species that causes bacillary
    angiomatosis-peliosis and is epidemiologically linked to cat and flea
    exposure.
  infectious_agent_term:
    preferred_term: Bartonella henselae
    term:
      id: NCBITaxon:38323
      label: Bartonella henselae
  evidence:
  - reference: PMID:21285862
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bacillary angiomatosis is an infectious disease caused by 2 gram-negative
      bacilli, Bartonella henselae and Bartonella quintana.
    explanation: >-
      The case-report review directly identifies B. henselae as one of the two
      recognized bacillary angiomatosis etiologic agents.
- name: Bartonella quintana
  description: >-
    Human-louse-associated Gram-negative Bartonella species that causes bacillary
    angiomatosis-peliosis and is epidemiologically linked to low income,
    homelessness, and louse exposure.
  infectious_agent_term:
    preferred_term: Bartonella quintana
    term:
      id: NCBITaxon:803
      label: Bartonella quintana
  evidence:
  - reference: PMID:21285862
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bacillary angiomatosis is an infectious disease caused by 2 gram-negative
      bacilli, Bartonella henselae and Bartonella quintana.
    explanation: >-
      The case-report review directly identifies B. quintana as one of the two
      recognized bacillary angiomatosis etiologic agents.
progression:
- phase: Bartonella-associated vasoproliferation
  notes: >-
    B. henselae or B. quintana infection establishes Bartonella endothelial
    virulence signaling in a host whose impaired immunity permits proliferative
    angiomatous lesions instead of contained infection.
  evidence:
  - reference: PMID:9407154
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 49 patients with bacillary angiomatosis-peliosis, 26 (53 percent)
      were infected with B. henselae and 23 (47 percent) with B. quintana.
    explanation: >-
      Molecular epidemiology in bacillary angiomatosis-peliosis tissue
      implicates both Bartonella species in human vasoproliferative disease.
- phase: Cutaneous and disseminated lesion formation
  notes: >-
    Angiomatous papules, nodules, and plaques may remain cutaneous or involve
    liver, spleen, bone, blood, endocardium, and nearly any organ in advanced
    infection.
  evidence:
  - reference: PMID:11362939
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients may have osseus BA lesions (frequently affecting the long bones);
      hepatic and/or splenic lesions; bacteremia; or endocarditis.
    explanation: >-
      The review summarizes the disseminated skeletal, hepatosplenic,
      bloodstream, and endocardial extension of bacillary angiomatosis in
      HIV-associated Bartonella infection.
pathophysiology:
- name: Bartonella Infection in Immunocompromised Host
  description: >-
    B. henselae or B. quintana reaches tissue in a host whose immune suppression
    permits Bartonella infection to progress into bacillary angiomatosis rather
    than remaining a contained lymphadenitic infection.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:24933445
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical manifestations can range from benign and self-limited to severe
      and life-threatening disease.
    explanation: >-
      The Bartonella pathogenicity review supports a host-context-dependent
      clinical spectrum from benign to severe disease.
  downstream:
  - target: Bartonella Angiogenic VEGFR2 Signaling
    description: >-
      Infected tissue exposes endothelial cells to Bartonella angiogenic factors.
  - target: BadA-VirB Endothelial Survival Signaling
    description: >-
      Infection also delivers adhesin and type IV secretion activities that
      favor endothelial adhesion, VEGF secretion, and survival.
- name: Bartonella Angiogenic VEGFR2 Signaling
  description: >-
    Bartonella BafA acts as a pro-angiogenic autotransporter whose passenger
    domain activates VEGF receptor 2 signaling, stimulating endothelial
    proliferation and angiogenesis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: vascular endothelial growth factor receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0048010
      label: vascular endothelial growth factor receptor signaling pathway
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  evidence:
  - reference: PMID:32678094
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      BafA interacts with vascular endothelial growth factor (VEGF) receptor-2
      and activates the downstream signaling pathway, suggesting that BafA
      functions as a VEGF analog.
    explanation: >-
      Identifies BafA as a Bartonella VEGFR2-activating ligand, the upstream
      signal driving endothelial angiogenesis in this node.
  downstream:
  - target: Lobular Capillary Proliferation
    causal_link_type: DIRECT
    description: >-
      VEGFR2-dependent angiogenic signaling drives capillary endothelial
      proliferation.
    evidence:
    - reference: PMID:32678094
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we use functional transposon-mutant screening in Bartonella
        henselae to identify such factor as a pro-angiogenic autotransporter,
        called BafA.
      explanation: >-
        Functional screening links BafA to Bartonella-induced pro-angiogenic
        endothelial behavior.
- name: BadA-VirB Endothelial Survival Signaling
  description: >-
    Bartonella henselae BadA supports fibronectin binding, endothelial
    adherence, and VEGF secretion, while VirB/D4 translocates Bep effector
    proteins that drive invasome uptake, inhibit endothelial apoptosis, and
    reinforce the pro-angiogenic phenotype.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: negative regulation of apoptotic process
    modifier: INCREASED
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  evidence:
  - reference: PMID:23163798
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      VirB/D4 translocates several Bartonella effector proteins (Beps) into the
      cytoplasm of infected ECs, resulting, e.g. in uptake of bacterial
      aggregates via the invasome structure, inhibition of apoptosis and
      activation of a proangiogenic phenotype.
    explanation: >-
      Bartonella henselae endothelial-cell experiments connect VirB/D4 Bep
      translocation to endothelial uptake, apoptosis blockade, and the
      pro-angiogenic state.
  downstream:
  - target: Lobular Capillary Proliferation
    description: >-
      Endothelial survival and pro-angiogenic reprogramming amplify the
      capillary proliferation that forms bacillary angiomas.
- name: Lobular Capillary Proliferation
  description: >-
    Bartonella-driven endothelial signaling expands irregular dermal and
    visceral capillaries into nodular lobular proliferations with a mixed
    inflammatory stromal infiltrate and extracellular bacterial aggregates.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:24718378
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologic examination by dermatopathologists in the United States revealed
      nodular dermal proliferations of irregular capillaries lined by spindled to
      epithelioid endothelial cells.
    explanation: >-
      Histopathology from clinically suspected Kaposi sarcoma cases establishes
      the capillary endothelial proliferation that defines bacillary
      angiomatosis lesions.
  downstream:
  - target: Cutaneous Vascular Papules and Nodules
    description: >-
      Lobular vascular growth in the skin presents as angiomatous papules and
      subcutaneous nodules.
  - target: Hepatosplenic Involvement
    description: >-
      Lesion dissemination to liver and spleen produces hepatosplenic bacillary
      disease.
  - target: Lytic Bone Lesions
    description: >-
      Disseminated bacillary angiomatosis can produce long-bone destructive
      lesions.
- name: Bartonella Intracellular Persistence
  description: >-
    Bartonella species can occupy host-cell niches, so treatment of
    angioproliferative Bartonella infection favors agents such as macrolides and
    doxycycline that penetrate eukaryotic cells.
  biological_scale: CELLULAR
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
- name: Bartonella Ribosomal Translation
  description: >-
    B. henselae and B. quintana require bacterial 70S ribosomal translation;
    erythromycin and doxycycline act on bacterial protein synthesis during
    prolonged therapy for bacillary angiomatosis.
  biological_scale: MOLECULAR
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
phenotypes:
- name: Cutaneous Vascular Papules and Nodules
  category: Dermatologic
  description: >-
    Skin lesions are vascular, friable, trauma-sensitive angiomatous papules,
    scaling plaques, subcutaneous nodules, or deeper soft-tissue masses.
  phenotype_term:
    preferred_term: Vascular skin abnormality
    term:
      id: HP:0011276
      label: Vascular skin abnormality
  evidence:
  - reference: PMID:11362939
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lesions may affect almost any organ, and appear as angiomatous papules,
      dry scaling lesions, subcutaneous nodules, cellulitic plaques or deep,
      highly vascularized, soft tissue masses.
    explanation: >-
      Review evidence for the core angiomatous papules, subcutaneous nodules,
      plaques, and soft-tissue masses that define cutaneous bacillary
      angiomatosis.
- name: Papules
  category: Dermatologic
  description: Papular vascular lesions are one cutaneous presentation.
  phenotype_term:
    preferred_term: Papule
    term:
      id: HP:0200034
      label: Papule
  evidence:
  - reference: PMID:11362939
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lesions may affect almost any organ, and appear as angiomatous papules,
      dry scaling lesions, subcutaneous nodules, cellulitic plaques or deep,
      highly vascularized, soft tissue masses.
    explanation: The review specifically lists angiomatous papules as a lesion morphology.
- name: Subcutaneous Nodules
  category: Dermatologic
  description: Subcutaneous nodules are another cutaneous or soft-tissue presentation.
  phenotype_term:
    preferred_term: Skin nodule
    term:
      id: HP:0200036
      label: Skin nodule
  evidence:
  - reference: PMID:11362939
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lesions may affect almost any organ, and appear as angiomatous papules,
      dry scaling lesions, subcutaneous nodules, cellulitic plaques or deep,
      highly vascularized, soft tissue masses.
    explanation: The review specifically lists subcutaneous nodules as a lesion morphology.
- name: Hepatosplenic Involvement
  category: Abdominal
  description: >-
    Bacillary angiomatosis-peliosis can involve the liver or spleen, especially
    in disseminated immunocompromised-host disease.
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: PMID:11362939
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients may have osseus BA lesions (frequently affecting the long bones);
      hepatic and/or splenic lesions; bacteremia; or endocarditis.
    explanation: The review supports hepatic and splenic bacillary angiomatosis lesions.
- name: Splenic Lesions
  category: Abdominal
  description: Disseminated bacillary angiomatosis can affect the spleen.
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly
  evidence:
  - reference: PMID:11362939
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients may have osseus BA lesions (frequently affecting the long bones);
      hepatic and/or splenic lesions; bacteremia; or endocarditis.
    explanation: The review supports splenic involvement in bacillary angiomatosis.
- name: Lytic Bone Lesions
  category: Musculoskeletal
  description: >-
    B. quintana-associated bacillary angiomatosis-peliosis can produce lytic
    bone lesions, especially in subcutaneous or disseminated disease.
  evidence:
  - reference: PMID:9407154
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subcutaneous and lytic bone lesions were strongly associated with B.
      quintana, whereas peliosis hepatis was associated exclusively with B.
      henselae.
    explanation: >-
      Molecularly speciated case-control data link lytic bone lesions with
      B. quintana bacillary angiomatosis-peliosis.
diagnosis:
- name: Histopathology With Warthin-Starry Stain
  presence: Positive
  description: >-
    Biopsy of vascular lesions with hematoxylin-eosin morphology plus
    Warthin-Starry staining can distinguish bacillary angiomatosis from Kaposi
    sarcoma and other vascular mimics.
  evidence:
  - reference: PMID:24718378
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A Warthin-Starry stain highlighted clumps of bacilli, confirming the
      diagnosis of BA.
    explanation: >-
      Human biopsy review documents Warthin-Starry-positive bacilli as the
      confirmatory diagnostic finding in bacillary angiomatosis lesions.
- name: Bartonella PCR on Lesional Tissue
  presence: Positive
  description: >-
    PCR-based amplification from tissue can confirm Bartonella infection and
    speciate the organism when culture is slow or insensitive.
  evidence:
  - reference: PMID:9407154
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The infecting bartonella species were determined by molecular techniques.
    explanation: >-
      Molecular techniques speciated Bartonella organisms from
      bacillary-angiomatosis-peliosis cases in the landmark case-control study.
treatments:
- name: Prolonged Erythromycin or Doxycycline
  description: >-
    Prolonged macrolide or tetracycline therapy treats angioproliferative
    Bartonella lesions; severe disseminated disease may require combination
    therapy with gentamicin or rifampin.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Bartonella Intracellular Persistence
    description: >-
      Macrolides and tetracyclines reach the host-cell compartment where
      Bartonella can persist.
  - target: Bartonella Ribosomal Translation
    description: >-
      Erythromycin and doxycycline suppress Bartonella protein synthesis through
      the bacterial ribosome.
  evidence:
  - reference: PMID:11362939
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment with erythromycin for at least three months is recommended, or
      with doxycycline if erythromycin is not well-tolerated.
    explanation: >-
      Review guidance supports prolonged erythromycin, or doxycycline as an
      alternative, for Bartonella-associated bacillary angiomatosis.
  - reference: PMID:24933445
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      erythromycin is the first-line antibiotic therapy for the treatment of
      angioproliferative lesions.
    explanation: >-
      The Bartonella pathogenicity and treatment review identifies erythromycin
      as first-line therapy for Bartonella angioproliferative disease.

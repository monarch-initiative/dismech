diagnosis:
- name: Histopathology With Warthin-Starry Stain
  presence: Positive
  description: >-
    Biopsy of vascular lesions with hematoxylin-eosin morphology plus
    Warthin-Starry staining can distinguish bacillary angiomatosis from Kaposi
    sarcoma and other vascular mimics.
  evidence:
  - reference: PMID:24718378
    reference_title: "Bacillary angiomatosis masquerading as Kaposi's sarcoma in East Africa."
    supports: SUPPORT

name: Bacillary Angiomatosis
creation_date: "2026-09-26T07:38:50Z"
category: Infectious Disease
description: >-
  Bacillary angiomatosis is a Bartonella-driven vasoproliferative infection
  characterized by tumor-like capillary lesions of the skin, subcutaneous
  tissue, liver, spleen, bone, and other viscera, chiefly in immunocompromised
  hosts.
disease_term:
  preferred_term: bacillary angiomatosis
  term:
    id: MONDO:0000758
    label: bacillary angiomatosis
parents:
- bartonellosis
- angiomatosis
- skin disease caused by bacterial infection
synonyms:
- Bartonella angiomatosis
- bacillary epithelioid angiomatosis
- epithelioid angiomatosis
references:
- reference: PMID:9407154
  title: Molecular epidemiology of bartonella infections in patients with bacillary angiomatosis-peliosis.
- reference: PMID:21285862

pathophysiology:
- name: Ingestion of Iron in Excess of Absorptive and Binding Capacity
  biological_scale: ORGANISM
  description: >-
    Ingestion of a supratherapeutic dose of an iron salt delivers elemental iron
    to the gastrointestinal lumen in amounts that exceed the tightly regulated
    physiological control of iron entry. Under normal conditions systemic iron is
    held within narrow limits by the hepcidin-ferroportin axis acting on
    absorptive enterocytes; an overdose bypasses that control both by sheer mass
    and by corroding the mucosal barrier that enforces it.
  triggers:
  - preferred_term: exposure to iron via ingestion
    term:
      id: ECTO:0900035
      label: exposure to iron via ingestion
  chemical_entities:
  - preferred_term: iron(2+)
    term:
      id: CHEBI:29033
      label: iron(2+)
  evidence:
  - reference: PMID:31949017
    reference_title: "Iron metabolism and iron disorders revisited in the hepcidin era."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Iron is biologically essential, but also potentially toxic; as such it is tightly controlled at cell and systemic levels to prevent both deficiency and overload.
    explanation: >-
      Establishes that iron's safety depends on tight homeostatic control, which
      is the control an overdose defeats.
  - reference: PMID:31949017
    reference_title: "Iron metabolism and iron disorders revisited in the hepcidin era."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The master regulator of systemic iron homeostasis is the liver peptide hepcidin, which controls serum iron through degradation of ferroportin in iron-absorptive enterocytes and iron-recycling macrophages.
    explanation: >-
      Identifies the enterocyte hepcidin-ferroportin checkpoint that normally sets
      systemic iron entry.
  downstream:
  - target: Direct Corrosive Injury to Gastrointestinal Mucosa
    causal_link_type: DIRECT
    description: >-
      Iron salts in the lumen are directly toxic to the gastrointestinal mucosa
      they contact.
    evidence:
    - reference: PMID:3784842
      reference_title: "Management of acute iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Iron salts are directly toxic to the gastrointestinal tract causing vomiting, diarrhoea, abdominal pain and occasionally significant blood loss.
      explanation: >-
        States the direct mucosal toxicity of ingested iron salts and the
        symptoms it produces.
  - target: Non-Transferrin-Bound Iron in Plasma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - absorption of iron across the injured mucosa into portal blood
    description: >-
      Iron absorbed in excess of what transferrin can bind circulates in an
      unbound, redox-active form.
    evidence:
    - reference: PMID:6421970
      reference_title: "Blood coagulation and acute iron toxicity. Reversible iron-induced inactivation of serine proteases in vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Although nontransferrin-bound Fe3+ is thought to initiate the disorder, little is known about how it interferes with blood coagulation.
      explanation: >-
        Identifies non-transferrin-bound iron as the circulating species held
        responsible for systemic toxicity in acute iron poisoning.

- name: Direct Corrosive Injury to Gastrointestinal Mucosa
  biological_scale: TISSUE
  description: >-
    Iron salts in contact with gastric and small-intestinal mucosa produce
    erosion, ulceration, haemorrhage and, at the severe end, mucosal necrosis and
    infarction. Injury is typically greatest in the stomach and proximal small
    bowel, but enteric-coated preparations can carry the injury distally and
    spare the proximal gut entirely — evidence that the lesion tracks where the
    preparation dissolves rather than following a fixed anatomical distribution.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  - preferred_term: gastric mucosal epithelial cell
    term:
      id: CL:0002178
      label: epithelial cell of stomach
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:2231830
    reference_title: "Gastrointestinal pathology in adult iron overdose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They may occur acutely, ranging in severity from mucosal injury to complete infarction, or several weeks later, as obstruction due to stricture formation.
    explanation: >-
      Describes the severity range of the acute corrosive lesion and its delayed
      stricturing sequel.
  - reference: PMID:2231830
    reference_title: "Gastrointestinal pathology in adult iron overdose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Damage to distal areas of the bowel can occur with complete sparing of proximal portions particularly if the iron is an enteric-coated preparation.
    explanation: >-
      Shows the injury follows where the iron preparation dissolves, supporting a
      direct contact-corrosive mechanism rather than a fixed anatomical
      susceptibility.
  downstream:
  - target: Hypovolaemia and Circulatory Shock
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - gastrointestinal fluid and blood loss into the lumen
    description: >-
      Blood and fluid lost through the corroded mucosa can by itself depress the
      circulation.
    evidence:
    - reference: PMID:3784842
      reference_title: "Management of acute iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Rarely, blood loss may be sufficient to cause hypotension.
      explanation: >-
        Attributes hypotension in the early phase to gastrointestinal blood loss,
        establishing this corrosive route to circulatory compromise.
  - target: Fibrotic Healing of Corrosive Injury and Gastric Outlet Obstruction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - healing of iron-induced mucosal ulcers by fibrous scarring
    description: >-
      The acute ulcers heal by scarring, and the scar contracts the lumen weeks
      after the poisoning has otherwise resolved.
    evidence:
    - reference: PMID:3784842
      reference_title: "Management of acute iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The last (fourth) phase, 2 to 6 weeks after ingestion, is only likely to develop in young children and is characterised by recurrence of vomiting due to gastric or duodenal stenosis caused by healing of iron-induced mucosal ulcers.
      explanation: >-
        States explicitly that the late stenosis is produced by the healing of the
        earlier iron-induced ulceration.

- name: Non-Transferrin-Bound Iron in Plasma
  biological_scale: MOLECULAR
  description: >-
    Once absorbed iron exceeds the binding capacity of transferrin, iron
    circulates unbound to its physiological carrier. This non-transferrin-bound
    fraction is redox-active and enters cells outside transferrin-receptor
    control, so the cellular iron-handling machinery that would normally throttle
    uptake is bypassed. It is the species to which the systemic, as opposed to
    corrosive, manifestations of iron poisoning are attributed.
  chemical_entities:
  - preferred_term: iron(3+)
    term:
      id: CHEBI:29034
      label: iron(3+)
  biological_processes:
  - preferred_term: iron ion transport
    term:
      id: GO:0006826
      label: iron ion transport
    modifier: INCREASED
  evidence:
  - reference: PMID:6421970
    reference_title: "Blood coagulation and acute iron toxicity. Reversible iron-induced inactivation of serine proteases in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although nontransferrin-bound Fe3+ is thought to initiate the disorder, little is known about how it interferes with blood coagulation.
    explanation: >-
      Names non-transferrin-bound Fe3+ as the initiating circulating species in
      acute iron toxicity.
  - reference: PMID:40650208
    reference_title: "The Relationship Between Non-Transferrin-Bound Iron (NTBI), Labile Plasma Iron (LPI), and Iron Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiological significance of NTBI and LPI lies in their ability to enter cells via alternative transport pathways that are not regulated by the transferrin receptor system or by cellular iron levels.
    explanation: >-
      States the transferrin-receptor bypass that this node's description
      asserts, and why it matters pathophysiologically.
  - reference: PMID:40650208
    reference_title: "The Relationship Between Non-Transferrin-Bound Iron (NTBI), Labile Plasma Iron (LPI), and Iron Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The redox-active and chelatable fraction of NTBI is referred to as labile plasma iron (LPI).
    explanation: >-
      Identifies the redox-active fraction, and — being by definition chelatable —
      the fraction the antidote acts on.
  downstream:
  - target: Iron-Catalysed Oxidative Organelle Injury
    causal_link_type: DIRECT
    description: >-
      Redox-active unbound iron catalyses free-radical chemistry inside the cells
      it enters.
    evidence:
    - reference: PMID:40650208
      reference_title: "The Relationship Between Non-Transferrin-Bound Iron (NTBI), Labile Plasma Iron (LPI), and Iron Toxicity."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Both NTBI and LPI contribute to oxidative stress by participating in free-radical-generating reactions.
      explanation: >-
        States the step this edge asserts: the unbound plasma iron of the source
        node drives free-radical generation and oxidative stress.
    - reference: PMID:40650208
      reference_title: "The Relationship Between Non-Transferrin-Bound Iron (NTBI), Labile Plasma Iron (LPI), and Iron Toxicity."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        NTBI and LPI bypassing normal cellular control mechanisms can rapidly exceed the cell's capacity to safely store excess iron, leading to toxicity.
      explanation: >-
        Gives the reason the unbound fraction becomes injurious once inside the
        cell, completing this edge.
  - target: Reversible Iron Inhibition of Coagulation Serine Proteases
    causal_link_type: DIRECT
    description: >-
      Non-transferrin-bound iron acts directly on the serine proteases of the
      coagulation cascade.
    evidence:
    - reference: PMID:6421970
      reference_title: "Blood coagulation and acute iron toxicity. Reversible iron-induced inactivation of serine proteases in vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Instead, thrombin was markedly inhibited by iron in its clotting effect on fibrinogen and, specifically, in its fibrinopeptide A-generating capacity, the inhibitory effect being reversible upon iron removal by EDTA chelation and gel filtration.
      explanation: >-
        Demonstrates direct, chelation-reversible inhibition of thrombin by iron,
        establishing this as a direct edge.

- name: Iron-Catalysed Oxidative Organelle Injury
  biological_scale: CELLULAR
  description: >-
    Redox-active iron entering cells catalyses Fenton-type generation of reactive
    oxygen species, peroxidising membrane lipids and damaging intracellular
    organelles. The affected cells are those exposed to the highest iron flux —
    the mucosa in contact with the ingested salt and, through the portal
    circulation, the hepatocyte. Two organelles are proposed as the proximate
    targets: mitochondria, which may make cells with high mitochondrial activity
    preferentially vulnerable, and lysosomes, whose iron-catalysed oxidative
    destabilisation releases digestive enzymes into the cytoplasm. Both routes
    are described in the cellular iron-toxicity literature rather than
    demonstrated in acute poisoning — see this node's notes.
  biological_processes:
  - preferred_term: iron-catalysed reactive oxygen species generation
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They also cause metabolic acidosis by interfering with intermediary metabolism and producing shock and reduced tissue perfusion.
    explanation: >-
      Attributes the metabolic derangement of iron poisoning to interference with
      intermediary metabolism, the clinical expression of this node.
  - reference: PMID:37629109
    reference_title: "Iron Load Toxicity in Medicine: From Molecular and Cellular Aspects to Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Based on its role as the major biological catalyst of free radical reactions and the Fenton reaction, iron has also been implicated in all diseases associated with free radical pathology and tissue damage.
    explanation: >-
      Identifies iron as the catalyst of Fenton free-radical chemistry, which is
      the molecular event this node asserts.
  - reference: PMID:40650208
    reference_title: "The Relationship Between Non-Transferrin-Bound Iron (NTBI), Labile Plasma Iron (LPI), and Iron Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This unregulated uptake can lead to iron accumulation in vulnerable tissues such as the liver and the heart.
    explanation: >-
      Names the liver as a tissue in which unregulated iron uptake accumulates,
      supporting the organ selectivity this node describes.
  - reference: PMID:11978485
    reference_title: "Molecular bases of cellular iron toxicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      These latter likely involve toxic effects of iron on intracellular organelles, in particular, mitochondria and lysosomes.
    explanation: >-
      Names mitochondria and lysosomes as the intracellular targets of iron
      toxicity. PARTIAL because this review is framed on chronic iron overload,
      not acute ingestion; see this node's notes on the extrapolation.
  - reference: PMID:11978485
    reference_title: "Molecular bases of cellular iron toxicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      This suggests the general concept that iron may be preferentially toxic to cells with high mitochondrial activity.
    explanation: >-
      Offers a selectivity principle — mitochondrial activity predicts
      vulnerability — that would predict hepatocyte susceptibility here. Stated
      by the authors as a general concept, and derived from chronic-overload
      tissue tropism, so it is curated as PARTIAL rather than as established for
      acute poisoning.
  - reference: PMID:11978485
    reference_title: "Molecular bases of cellular iron toxicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      An alternative-and not mutually exclusive-mechanism for cellular iron toxicity involves iron-catalyzed oxidative destabilization of lysosomes, leading to leak of digestive enzymes into the cell cytoplasm and eventuating in apoptotic or necrotic cell death.
    explanation: >-
      Supplies a second, lysosomal route from iron to cell death, explicitly
      offered as non-exclusive with the mitochondrial route. PARTIAL for the same
      chronic-overload provenance.
  notes: >-
    The organelle-level detail on this node comes from PMID:11978485, a review
    whose clinical frame is hereditary and secondary haemochromatosis, not acute
    ingestion. It is used here because the mitochondrial and lysosomal routes it
    describes are cell-level mechanisms that do not depend on how the iron
    arrived, and because acute iron poisoning has no comparable mechanistic
    literature of its own. That extrapolation is the reason all three items are
    PARTIAL. One arm of the same review is deliberately NOT curated: its
    proposal that iron-mediated damage to the mitochondrial genome accumulates
    mutational events is explicitly about long-term toxicity, and cannot apply
    to a poisoning that kills within about 48 hours. This is the trap the
    entry's top-level notes warn about — literature reached through the "iron
    overload" synonym is usually about the chronic disorders — and it is
    recorded here rather than resolved silently.
  downstream:
  - target: Metabolic Acidosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired aerobic ATP generation with a shift to anaerobic metabolism
    description: >-
      Interference with intermediary metabolism, compounded by reduced tissue
      perfusion, generates an acidosis.
    evidence:
    - reference: PMID:3784842
      reference_title: "Management of acute iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They also cause metabolic acidosis by interfering with intermediary metabolism and producing shock and reduced tissue perfusion.
      explanation: >-
        States both routes to the acidosis — metabolic interference and
        perfusion failure.
  - target: Periportal Hepatocellular Necrosis
    causal_link_type: DIRECT
    description: >-
      The hepatocyte, receiving absorbed iron first through the portal vein,
      sustains the oxidative injury at the highest local concentration.
    evidence:
    - reference: PMID:11778670
      reference_title: "Hepatotoxicity in acute iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Unlike most other hepatotoxins, the periportal areas of the hepatic lobule are the primary sites of injury.
      explanation: >-
        The periportal localisation is the anatomical signature of injury by an
        agent arriving in portal blood, supporting this edge.

- name: Reversible Iron Inhibition of Coagulation Serine Proteases
  biological_scale: MOLECULAR
  description: >-
    Non-transferrin-bound iron reversibly inactivates the serine proteases of the
    coagulation cascade — thrombin, factor Xa and kallikrein — without damaging
    the zymogens or fibrinogen itself. This produces a coagulopathy that is
    mechanistically distinct from the coagulopathy of hepatic synthetic failure,
    an attribution the authors state as likely rather than established; the two
    may coexist in severe poisoning. Because the
    inhibition is relieved by removing the iron, it is in principle correctable
    by chelation rather than only by factor replacement.
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity of the coagulation cascade
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:6421970
    reference_title: "Blood coagulation and acute iron toxicity. Reversible iron-induced inactivation of serine proteases in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Studies of the mechanism by which iron prevents a normal plasma coagulation revealed that the proenzymes of the coagulation cascade and fibrinogen were not damaged by iron.
    explanation: >-
      Excludes zymogen and fibrinogen damage, localising the defect to the active
      proteases.
  - reference: PMID:6421970
    reference_title: "Blood coagulation and acute iron toxicity. Reversible iron-induced inactivation of serine proteases in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Because the amidolytic activity of human thrombin as well as factor Xa, kallikrein, and bovine trypsin was also reversibly suppressed by ferrous sulfate as well as ferric citrate, we consider it likely that the coagulopathy occurring in iron poisoning is the consequence of a general, physiologically important phenomenon: the susceptibility of serine proteases to nontransferrin-bound Fe3+.
    explanation: >-
      Identifies the general susceptibility of coagulation serine proteases to
      non-transferrin-bound iron as the mechanism of the coagulopathy.
  - reference: PMID:6421970
    reference_title: "Blood coagulation and acute iron toxicity. Reversible iron-induced inactivation of serine proteases in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      At iron concentrations comparable to those of previous animal investigations, we reproduced the coagulopathy, in other words, the dose-related prolongation of the prothrombin, thrombin, and partial thromboplastin time, in human plasma in vitro.
    explanation: >-
      Shows the clotting-time prolongation is reproduced in human plasma by iron
      alone, without any hepatic contribution.

- name: Metabolic Acidosis
  biological_scale: ORGANISM
  description: >-
    A metabolic acidosis develops from impaired intermediary metabolism together
    with the reduced tissue perfusion of evolving shock. With coma and shock it
    is one of the three features conventionally accepted as marking severe
    poisoning.
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The commonly encountered clinical features are also unreliable although it is generally accepted that coma, shock and metabolic acidosis indicate severe poisoning.
    explanation: >-
      Establishes metabolic acidosis as one of the accepted markers of severe
      iron poisoning.
  downstream:
  - target: Hypovolaemia and Circulatory Shock
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - acidaemia-associated depression of myocardial and vascular function
    description: >-
      Acidosis and circulatory failure reinforce each other in the decompensated
      phase.
    evidence:
    - reference: PMID:3784842
      reference_title: "Management of acute iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Recurrence or development of shock, and metabolic acidosis are usual and renal failure and features of extensive hepatocellular necrosis may develop.
      explanation: >-
        Describes shock and acidosis as the paired features of the decompensated
        phase.

- name: Periportal Hepatocellular Necrosis
  biological_scale: TISSUE
  description: >-
    Extensive hepatocellular necrosis develops early in severe poisoning and
    carries a high mortality. Its periportal distribution is unusual among
    hepatotoxins and matters prognostically: the periportal zone is the principal
    site of hepatic regeneration, so injury concentrated there removes the liver's
    own capacity to recover. Hepatotoxicity appears to be dose-related, the lowest
    associated acute serum iron concentration reported greatly exceeding the
    reference range.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:11778670
    reference_title: "Hepatotoxicity in acute iron poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Review of this literature and of experimental animal studies demonstrates that it occurs early in the clinical course and has a relatively high mortality.
    explanation: >-
      Establishes the early onset and high mortality of the hepatic injury.
  - reference: PMID:11778670
    reference_title: "Hepatotoxicity in acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As this is the principle sitefor hepatic regeneration, this accountsfor the relatively high mortality rate.
    explanation: >-
      Gives the mechanistic reason the periportal localisation is prognostically
      important. Quoted verbatim, including the source's spacing errors.
  - reference: PMID:11778670
    reference_title: "Hepatotoxicity in acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lowest acute serum iron concentration associated with hepatotoxicity was 1700 microg/dL (304 micromol/L). Since this greatly exceeds the reference range of 50-150 microg/dL (9-27 micromol/L), it supports a dose-related etiology.
    explanation: >-
      Supports a dose-related aetiology for the hepatotoxicity and gives the
      lowest reported associated serum iron concentration.

- name: Hypovolaemia and Circulatory Shock
  biological_scale: ORGANISM
  description: >-
    Circulatory failure in iron poisoning is multifactorial: gastrointestinal
    fluid and blood loss through the corroded mucosa, acidosis, and reduced
    tissue perfusion reinforce one another. Shock recurring or developing in the
    later phase, together with acidosis, marks the decompensation in which most
    deaths occur, and maintaining the intravascular volume is correspondingly
    central to management.
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrence or development of shock, and metabolic acidosis are usual and renal failure and features of extensive hepatocellular necrosis may develop.
    explanation: >-

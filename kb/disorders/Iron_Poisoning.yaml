diagnosis:
- name: Serum iron concentration
  description: >-
    How much weight the serum iron concentration should carry is contested, and
    this entry does not settle it. On one account it is one of three inputs to
    the chelation decision, alongside an estimate of the ingested body iron
    burden and the clinical features, and the ingested dose is unusable as a
    severity measure because it is rarely known accurately and absorption is
    unpredictable once vomiting and diarrhoea have removed some of it. A
    paediatric cohort reports the reverse on both counts: the dose and the
    clinical signs guided management and the serum iron did not. A third series
    reports the strongest quantitative result on this question in either
    direction, and reports it within a severity stratum rather than pooled: among
    patients whose symptoms stayed minor, an early concentration at or below 300
    microg/dL was followed by no later toxic concentration at all. All three
    positions are curated below, together with the conventional toxicity
    thresholds and the reason a concentration drawn too soon can under-read the
    exposure rather than measure it. The one use not in dispute is discriminating
    this disease
    from the chronic iron-overload states that share a MONDO synonym with it.
  evidence:
  - reference: PMID:2870463
    reference_title: "Iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using estimates of the total body burden of iron, clinical symptoms, and the serum iron concentration, an appropriate decision can be made to initiate aggressive chelation therapy with deferoxamine.
    explanation: >-
      Establishes the serum iron concentration as one of the three inputs to the
      chelation decision.
  - reference: PMID:33729557
    reference_title: "Suicidal iron overdose: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peak serum iron levels may be helpful in differentiating acute toxicity from chronic iron overload states.
    explanation: >-
      Supports the use of peak serum iron to distinguish acute poisoning from
      chronic iron overload.
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amount of elemental iron ingested is unacceptable since it is seldom known with accuracy and absorption is unpredictable because of vomiting and diarrhoea.
    explanation: >-
      Refutes the ingested dose as a severity measure, which is why a measured
      serum concentration is relied on; it does not itself validate the serum
      measurement.
  - reference: PMID:14722368
    reference_title: "Acute iron poisoning: clinical picture, intensive care needs and outcome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dose of ingested iron and clinical signs were most useful guide to iron toxicity and management decisions; serum iron did not help.
    explanation: >-
      Directly contradicts the framing of the two items above. In this
      21-patient paediatric cohort the ingested dose and the clinical signs
      guided management and the serum iron did not, the reverse of the
      dose-is-unreliable / serum-is-relied-on ordering asserted by PMID:3784842
      and PMID:2870463. Curated as REFUTE rather than reconciled away.
  - reference: PMID:34121325
    reference_title: "Unintentional paediatric iron poisoning: A retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic children had a significantly higher median peak serum iron concentration of 66 μmol/L (IQR 54-68 μmol/L) compared to 12 μmol/L (IQR 9-15 μmol/L) in asymptomatic children (P < 0.001).
    explanation: >-
      The other side of that disagreement, and the only quantitative evidence in
      this entry bearing on it. In 54 unintentional paediatric exposures the peak
      serum iron separated symptomatic from asymptomatic children with a large
      margin and P < 0.001, which is a discriminating measurement rather than an
      unhelpful one. Approximate conversions to the units used in this entry's
      reference range, derived rather than quoted: 66 micromol/L is about 369
      microg/dL and 12 micromol/L about 67 microg/dL, using the same factor
      implied by PMID:11778670 giving its reference interval as both 50-150
      microg/dL and 9-27 micromol/L.
  - reference: PMID:34121325
    reference_title: "Unintentional paediatric iron poisoning: A retrospective case series."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children symptomatic with gastrointestinal toxicity had a median suspected dose ingested of 60 mg/kg (IQR 38-150 mg/kg) that was similar to asymptomatic children
    explanation: >-
      Refutes the ingested dose as the alternative to serum iron: symptomatic and
      asymptomatic children had similar suspected doses, so in this cohort the
      quantity PMID:14722368 found most useful is the one that did not
      discriminate. PARTIAL rather than REFUTE, on the same reasoning the
      PMID:3784842 item above already applies to the same kind of claim:
      knocking down the rival predictor does not contradict this entry's thesis
      that the serum iron is informative, and it does not validate the serum
      measurement either. It was tagged REFUTE when first curated, which made a
      finding that corroborates this entry by elimination read as one that
      opposes it. The quote stops before the asymptomatic group's interquartile
      range because that span is square-bracketed in the source and the reference
      validator strips square-bracketed spans before matching; the source reports
      that comparison as P = 0.809, i.e. not significant.
  - reference: PMID:39509998
    reference_title: "Utility of iron concentration two to four hours post ingestion in predicting toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Traditionally, a concentration of 350 μg/dL with symptoms, or 500 μg/dL without symptoms, is considered toxic and will likely need treatment to prevent decompensation.
    explanation: >-
      The first quotable statement in this entry of the conventional serum-iron
      toxicity thresholds. Note what the sentence is and is not: background,
      offered as the premise of the study rather than as a finding of it, and
      phrased as what is traditionally considered toxic. It is curated as
      evidence that the convention exists and takes this conditional form, not
      as evidence that either figure has been validated. Tagged OTHER for that
      reason, while this paper's own retrospective results below are tagged
      HUMAN_CLINICAL.
  - reference: PMID:39509998
    reference_title: "Utility of iron concentration two to four hours post ingestion in predicting toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is generally recommended that an iron concentration is obtained at least 4 h after exposure to provide adequate absorption time and avoid falsely low iron concentrations.
    explanation: >-
      Adds the timing dimension the other sources cited here leave implicit, and
      gives it an absorption-kinetics reason: a sample drawn before absorption is
      complete can be falsely low, so an early concentration may under-read the
      exposure rather than measure it. That is what makes the 2-to-4-hour
      question this study asks a real one. Tagged OTHER because the sentence
      states a general recommendation rather than a result of this study.
  - reference: PMID:39509998
    reference_title: "Utility of iron concentration two to four hours post ingestion in predicting toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patients who developed at most minor symptoms (abdominal discomfort, nausea, vomiting, or diarrhea without evidence of systemic toxicity) and had a 2-4 h concentration ≤ 300 μg/dL symptoms had a subsequent concentration ≥ 350 μg/dL (negative predictive value [NPV] 100 %).
    explanation: >-
      The strongest quantitative support in this entry for the serum iron
      concentration being informative, and it is stratum-specific: within the
      minor-symptom group an early concentration at or below 300 microg/dL was
      followed by no subsequent toxic concentration. Read as a rule-out inside a
      defined stratum, not as a general predictor. Limits worth carrying: 75
      patients, single centre, retrospective, and the abstract does not report
      the age distribution, so this is not a third paediatric cohort alongside
      PMID:14722368 and PMID:34121325. The sentence carries a stray repeated
      word in the source and is quoted as printed.
  - reference: PMID:39509998
    reference_title: "Utility of iron concentration two to four hours post ingestion in predicting toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this case series, a concentration of 300 μg/dL or less between 2 and 4 h was the ideal cutoff to predicting subsequent potentially toxic concentrations, with a sensitivity of 100 % and a specificity of 54 %.
    explanation: >-
      Gives the operating characteristics behind that rule-out, and the
      specificity is the half a curator should not drop: 54% means roughly half
      the patients the cutoff flags do not go on to a toxic concentration. A
      sensitive rule-out with poor specificity is useful for deciding whom to
      stop watching and close to useless for deciding whom to chelate, which is
      the distinction the contested-threshold discussion in this entry turns on.
  notes: >-
    The value of the serum iron concentration is genuinely contested in the cited
    literature and this entry does not resolve it; see the
    serum_iron_versus_ingested_dose CONTROVERSY discussion, which states the
    disagreement and what would settle it. Both positions are curated here with
    their evidence rather than one being chosen. A curator adding a numeric
    decision threshold should treat that disagreement as the context for the
    threshold, not curate the threshold as settled. The conventional thresholds
    are now curated on the biochemical entry on exactly that footing.
- name: Abdominal radiography for retained iron tablets
  description: >-
    Iron tablets are visible on abdominal radiography, so a film both supports
    the diagnosis and shows how much unabsorbed tablet burden remains. That is
    what gates whole bowel irrigation and tells the clinician when to stop it —
    the rectal effluent can run clear while radiography still shows iron in the
    gut, so the effluent alone is not a reliable endpoint.
  evidence:
  - reference: PMID:8629765
    reference_title: "Five days of whole-bowel irrigation in a case of pediatric iron ingestion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rectal effluent cleared within 2 days of the start of PEG-ELS therapy despite the persistence of iron in the gastrointestinal tract as shown on radiography.
    explanation: >-
      Shows radiography visualising retained gastrointestinal iron, and that it
      disagreed with — and outlasted — the effluent endpoint.
  - reference: PMID:8629765
    reference_title: "Five days of whole-bowel irrigation in a case of pediatric iron ingestion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case of a 33-month-old boy who ingested at least 160 mg/kg elemental iron and received 44.3 L of PEG-ELS (2,953 ml/kg) over 5 days because of the persistence of iron tablets in teh gastrointestinal tract.
    explanation: >-
      The radiographic tablet burden is what drove the duration of decontamination
      in this case. Quoted verbatim, including the source's "teh" typo.
  notes: >-
    A single case report, so it establishes that radiography shows retained iron
    and that effluent clearing is an unreliable endpoint, not the test's
    sensitivity or specificity. A negative film does not exclude a significant
    ingestion; that limitation was not sourced to a cached reference and is
    deliberately not asserted here.
- name: Gastric iron encrustation at autopsy
  description: >-
    Gross iron encrustation over the gastric rugae is reported as specific for
    acute ingestion when it is present, making it a post-mortem discriminator
    between acute poisoning and chronic iron overload.
  evidence:
  - reference: PMID:33729557
    reference_title: "Suicidal iron overdose: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gross findings of gastric iron encrustation are specific for acute ingestion when present.
    explanation: >-
      States the specificity of gastric iron encrustation for acute ingestion.
  - reference: PMID:33729557
    reference_title: "Suicidal iron overdose: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At autopsy, iron encrustations were present over the gastric rugae.
    explanation: >-
      The autopsy observation on which the specificity claim is grounded.
  notes: >-
    Reported from a single autopsy case with literature review, so the
    specificity claim rests on a narrow base. The same source cautions that the
    clinical course and laboratory testing of severe acute iron overdose is
    fairly non-specific.

biochemical:
- name: Serum iron concentration
  reference_ranges:
  - lower_bound: 50.0
    upper_bound: 150.0
    unit: microg/dL
    population: general reference interval cited for acute-poisoning comparison
    notes: >-
      Quoted as the reference range against which acute poisoning concentrations
      are judged in a review of iron-poisoning hepatotoxicity, not derived from a
      laboratory reference-interval study. Equivalent to 9-27 micromol/L in the
      same source.
    evidence:
    - reference: PMID:11778670
      reference_title: "Hepatotoxicity in acute iron poisoning."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Since this greatly exceeds the reference range of 50-150 microg/dL (9-27 micromol/L), it supports a dose-related etiology.
      explanation: >-
        States the reference interval used, in both unit systems.
    interpretation_bands:
    - name: Reference interval
      lower_bound: 50.0
      upper_bound: 150.0
      unit: microg/dL
      abnormal_flag: NORMAL
    - name: At or above the conventional toxic threshold when symptomatic
      lower_bound: 350.0
      upper_bound: 500.0
      unit: microg/dL
      abnormal_flag: HIGH
      interpretation: >-
        By long-standing convention a concentration of 350 microg/dL is
        considered toxic in a patient who has symptoms, and likely to need
        treatment to prevent decompensation. Below 500 microg/dL the convention
        is conditional on the presence of symptoms, which is why this band is
        separated from the one below it. Curated as the tradition its source
        describes it as, not as a validated decision threshold; the
        serum_iron_versus_ingested_dose discussion is the context to read it in.
    - name: At or above the conventional toxic threshold regardless of symptoms
      lower_bound: 500.0
      upper_bound: 1700.0
      unit: microg/dL
      abnormal_flag: HIGH
      interpretation: >-
        At or above 500 microg/dL the conventional threshold no longer depends on
        whether the patient has symptoms. The upper bound of this band is not a
        second threshold: it is simply where the band reporting the lowest
        concentration ever observed with hepatotoxicity begins.
    - name: At or above the lowest concentration reported with hepatotoxicity
      lower_bound: 1700.0
      unit: microg/dL
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
      interpretation: >-
        1700 microg/dL is the lowest acute serum iron concentration reported in
        association with hepatotoxicity, not a validated decision threshold.
        Hepatotoxicity has not been shown to be excluded below it.
      phenotype_term:
        preferred_term: Hepatic necrosis
        term:
          id: HP:0002605
          label: Hepatic necrosis
  evidence:
  - reference: PMID:11778670
    reference_title: "Hepatotoxicity in acute iron poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The lowest acute serum iron concentration associated with hepatotoxicity was 1700 microg/dL (304 micromol/L).
    explanation: >-
      Gives the lowest serum iron concentration reported in association with
      hepatotoxicity, the basis for the upper interpretation band.
  - reference: PMID:2870463
    reference_title: "Iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using estimates of the total body burden of iron, clinical symptoms, and the serum iron concentration, an appropriate decision can be made to initiate aggressive chelation therapy with deferoxamine.
    explanation: >-
      Establishes the serum iron concentration as an input to the chelation
      decision.
  - reference: PMID:39509998
    reference_title: "Utility of iron concentration two to four hours post ingestion in predicting toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Traditionally, a concentration of 350 μg/dL with symptoms, or 500 μg/dL without symptoms, is considered toxic and will likely need treatment to prevent decompensation.
    explanation: >-
      Source for the two conventional-threshold interpretation bands above.
      Quoted from the study's background, where it states established practice
      rather than a result, so it attests that the convention exists and takes
      this conditional form and not that either figure has been validated.
  notes: >-
    The measured serum iron concentration is the central laboratory quantity in
    iron poisoning: it feeds the chelation decision, separates acute poisoning
    from chronic overload, and in severe poisoning runs an order of magnitude
    above the normal interval. That said, its clinical usefulness is contested:
    PMID:14722368 reports that in a 21-patient paediatric cohort the ingested
    dose and clinical signs guided management while the serum iron did not, and
    that vin-rose urine was absent in 31% of chelated patients even with a high
    serum iron. The reference interval and the hepatotoxicity-associated
    concentration below are curated as measurements, not as decision rules. The
    conventional toxicity thresholds are curated in the interpretation bands
    above, as a tradition rather than as validated cutoffs. They were previously
    left out of this entry for want of a quotable source, the consensus guideline
    that states them having cached with an empty body; PMID:39509998 states them
    in its own background and so supplies the quotation. What that fixes is
    attribution, not validation, and the serum_iron_versus_ingested_dose
    discussion is the context a curator should read them in.

    The 150 to 350 microg/dL range is deliberately unbanded. It sits above the
    reference interval and below the lower conventional toxicity threshold, and
    no source this entry can quote says what a concentration there means. That
    gap is the honest state of the evidence rather than an oversight to patch; a
    band invented to fill it would assert an interpretation nobody has published.

histopathology:
- name: Gastric mucosal necrosis with superficial stainable iron
  description: >-
    At autopsy after fatal acute ingestion, stainable iron lies superficially
    over areas of mucosal necrosis, with fibrin thrombi in the submucosa beneath
    — the histological form of the corrosive injury, with the iron sitting where
    it was in contact rather than distributed through the tissue.
  evidence:
  - reference: PMID:33729557
    reference_title: "Suicidal iron overdose: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Superficial deposits of stainable iron were present overlying areas of mucosal necrosis with underlying submucosal fibrin thrombi.
    explanation: >-
      Describes the histology of the corrosive gastric lesion and the
      superficial, contact distribution of the iron.
- name: Absent significant hepatic stainable iron despite fatal poisoning
  description: >-
    In the same fatal case, no significant stainable iron was found in the liver,
    even though the clinical course showed hepatic compromise with markedly
    elevated serum iron. Stainable hepatic iron is therefore not a reliable
    post-mortem marker of acute iron poisoning, and its absence does not exclude
    the diagnosis.
  evidence:
  - reference: PMID:33729557
    reference_title: "Suicidal iron overdose: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No significant stainable iron was present in the liver.
    explanation: >-
      Reports the negative hepatic iron stain in a fatal acute iron poisoning.
  - reference: PMID:33729557
    reference_title: "Suicidal iron overdose: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His clinical course and laboratory findings demonstrated hepatic and renal compromise with markedly elevated serum iron levels.
    explanation: >-
      Establishes that hepatic compromise and high serum iron were present in the
      same patient whose liver showed no significant stainable iron.
  notes: >-
    This sits in tension with the entry's Periportal Hepatocellular Necrosis
    node, which argues the hepatocyte takes the highest iron flux by way of the
    portal circulation. The tension is real but not necessarily a contradiction:
    the patient died 65.5 hours after ingestion and had been treated, so
    redistribution, chelation and clearance all intervene between the toxic
    exposure and the section. It is recorded here rather than omitted because a
    single autopsy is the whole of the cited histological evidence, and the
    negative is part of it.

environmental:
- name: Unintentional ingestion of iron supplements by young children
  description: >-
    The classic exposure: a child under five swallows adult-strength iron tablets
    or prenatal vitamins from a household supply. Acute iron poisoning is most
    common in this age group, and the exposure is determined by product
    availability and packaging rather than by any host factor.
  exposure_term:
    preferred_term: exposure to iron via ingestion
    term:
      id: ECTO:0900035
      label: exposure to iron via ingestion
  effect: Establishes the ingested iron burden that initiates poisoning.
  notes: >-
    The packaging story is more equivocal than it is usually told. Deaths in
    children under six fell from 29 to 1 across the 1997 unit-dose packaging
    regulation (PMID:15939855), but that mandate was vacated in 2003 after
    Nutritional Health Alliance v. FDA, and a 2000-2017 National Poison Data
    System cohort found severe exposures continued to decline anyway
    (DOI:10.1177/0009922819901010). A third strand cuts the same way from the
    other end of the timeline: PMID:10798501, published before the mandate could
    have had an effect, reports paediatric iron fatalities already falling from a
    peak of 10 in 1991 to 2 by 1995. All three results are curated here; none is
    a controlled comparison, and the entry does not assert that packaging alone
    caused the fall.

    The same source undercuts a simpler reading of the exposure itself.
    Child-resistant containers were already in use, and children were getting
    the iron out of them anyway, or out of ones an adult had left open. That is
    why the regulatory move was to unit-dose blistering rather than to more child
    resistance, and it is part of why this exposure is described above as set by
    product form rather than by any host factor.
  evidence:
  - reference: PMID:21975503
    reference_title: "Iron poisoning: a literature-based review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Multiple factors-including legal and manufacturing practices-have changed the landscape of iron poisoning over the decades.
    explanation: >-
      Supports the framing of this exposure as one whose incidence is set by
      legal and manufacturing practice rather than by host biology, which is
      what the packaging notes below record.
  - reference: PMID:10798501
    reference_title: "Pediatric iron poisonings in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The children often obtained the iron from a child-resistant container opened by themselves or another child or left open or improperly closed by an adult.
    explanation: >-
      The exposure route in detail, and the finding that makes the packaging
      story one about product form rather than about container closures:
      child-resistant containers were already in use and were being defeated,
      either by a child or by an adult who left one open. National Consumer
      Product Safety Commission and poison-centre data, 1980 to 1996.
  - reference: PMID:10798501
    reference_title: "Pediatric iron poisonings in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pediatric iron-related fatalities increased in 1986, peaked at 10 in 1991, and declined to 2 by 1995.
    explanation: >-
      Independent support for the equivocation recorded in the notes, arriving
      from the pre-mandate side of it: paediatric iron fatalities were already
      falling before the 1997 unit-dose regulation, having peaked in 1991. This
      is a different data source and a different case definition from the
      29-to-1 figure of PMID:15939855, so the two are curated separately rather
      than merged into one series.
  - reference: PMID:10798501
    reference_title: "Pediatric iron poisonings in the United States."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unit-dose packaging of potent iron supplements is expected to reduce the frequency of severe pediatric iron overdose incidents.
    explanation: >-
      The prediction, published in 2000, that unit-dose packaging would reduce
      severe paediatric poisoning. Curated as PARTIAL because it is an
      expectation rather than a result. It is worth having on the record
      precisely because this entry also curates what happened next: the mandate
      was vacated in 2003 and severe exposures fell either way.
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute iron poisoning is most common in children below the age of 5 years.
    explanation: >-
      Establishes young children as the population in which this exposure
      predominantly occurs.
  - reference: PMID:15939855
    reference_title: "Unit-dose packaging of iron supplements and reduction of iron poisoning in young children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iron poisoning is a major cause of unintentional poisoning death in young children.
    explanation: >-
      Establishes the public-health weight of this unintentional exposure route.
  influences_mechanisms:
  - target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Swallowing the tablets is the route by which the toxic iron burden is
      established. That an intervention acting only on access to the tablets,
      with no change to host biology, was followed by fewer ingestions and fewer
      deaths is consistent with the exposure being what initiates the disease —
      though the study is a before-and-after comparison, so secular trend is not
      excluded (see this exposure's notes).
    evidence:
    - reference: PMID:15939855
      reference_title: "Unit-dose packaging of iron supplements and reduction of iron poisoning in young children."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The average number of iron ingestion calls per 1000 of all calls to poison control centers regarding children younger than 6 years decreased from 2.99 per 1000 to 1.91 per 1000 (odds ratio, 1.29 [95% confidence interval, 1.27-1.32]; P<.001). The number of deaths decreased from 29 to 1 (odds ratio, 13.56 [95% confidence interval, 1.85-99.52]; P = .03).
      explanation: >-
        Both ingestions and deaths fell after an intervention that changed only
        access to the tablets. This is an uncontrolled before-and-after
        comparison, not a dose-response design, so it is consistent with — rather
        than proof of — ingestion being what triggers the disease.
    - reference: DOI:10.1177/0009922819901010
      reference_title: "Iron Packaging Regulations in the United States and Pediatric Morbidity: A Retrospective Cohort Study"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Despite removal of iron packaging regulations in the United States, there continues to be a decrease in the incidence of severe iron exposures in children.
      explanation: >-
        Complicates the attribution rather than the edge: severity kept falling
        after the packaging mandate was withdrawn in 2003, so the earlier
        before-and-after result is confounded by a secular trend. The exposure
        route itself is unaffected.

- name: Deliberate self-poisoning with iron tablets
  description: >-
    Intentional ingestion of iron, typically by adolescents and adults, accounts
    for the larger ingested doses and is the route behind most severe and fatal
    adult cases.
  exposure_term:
    preferred_term: exposure to iron via ingestion
    term:
      id: ECTO:0900035
      label: exposure to iron via ingestion
  effect: Establishes a high ingested iron burden associated with severe poisoning.
  evidence:
  - reference: PMID:33729557
    reference_title: "Suicidal iron overdose: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute iron toxicity in adults is rare, usually occurring due to intentional ingestion in suicide attempts.
    explanation: >-
      Establishes intentional ingestion as the usual route of acute iron toxicity
      in adults.
  - reference: PMID:33729557
    reference_title: "Suicidal iron overdose: A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ingestion of large amounts of iron salts can lead to hemorrhagic shock, multi-system organ failure, coagulopathy, and death.
    explanation: >-
      Gives the severe outcomes associated with the large ingested doses typical
      of this exposure route.
  - reference: PMID:30598567
    reference_title: "Fatal Iron Toxicity in an Adult: Clinical Profile and Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute iron toxicity is usually seen in children with accidental ingestion of iron-containing syrups.
    explanation: >-
      The clinical-epidemiologic half of this entry's scope problem: the disease
      as usually encountered is paediatric and accidental, which is the
      population nearly every cohort cited here describes. HUMAN_CLINICAL
      because this is a generalization about patients rather than about the
      literature; the companion item below makes the separate claim about the
      literature and is tagged OTHER accordingly.

      PARTIAL rather than SUPPORT, because of what splitting this quote cost.
      In the source it is the first half of a contrastive pair, and the
      "However" that followed it did the work of making it relevant here. Read
      alone it describes paediatric accidental poisoning, which is the opposite
      of the adult deliberate exposure it now sits under: it supports this entry
      only by establishing the contrast that makes this route the uncommon one.
      That is a partial relationship to the claim, not a direct one, and the
      companion item below carries the half that bears on it directly.
  - reference: PMID:30598567
    reference_title: "Fatal Iron Toxicity in an Adult: Clinical Profile and Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the literature on acute iron toxicity with suicidal intent in adults is scant.
    explanation: >-
      The bibliographic half, and the reason the adult intentional exposure
      curated here rests on case reports rather than on cohorts. OTHER because
      the sentence describes the state of the literature and presents no patient
      data, which is the convention this entry already applies to the
      PMID:21975503 item above. Previously this and the sentence before it were
      one evidence item tagged HUMAN_CLINICAL throughout, which left two
      different kinds of claim under a single classification.
  - reference: PMID:30598567
    reference_title: "Fatal Iron Toxicity in an Adult: Clinical Profile and Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delay in treatment was there due to misdiagnosis of the intoxicating agent. She developed fulminant hepatic failure with rapid clinical deterioration.
    explanation: >-
      A fatal adult case, and the only cited source in which the diagnosis itself
      was the delay: the ingested agent was misidentified before iron was
      recognised. That is the practical cost of the adult route being
      under-described, and it is a different failure from any the diagnosis
      section models, which assume iron is already suspected. Single case
      report.
  influences_mechanisms:
  - target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Deliberate ingestion establishes the iron burden, generally at higher doses
      than unintentional paediatric exposure.
    evidence:
    - reference: PMID:33729557
      reference_title: "Suicidal iron overdose: A case report and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Acute iron toxicity in adults is rare, usually occurring due to intentional ingestion in suicide attempts.
      explanation: >-
        Names intentional ingestion as the route by which the adult iron burden is
        established, which is what this edge asserts.

treatments:
- name: Deferoxamine Chelation
  description: >-
    Intravenous deferoxamine is the specific antidote, indicated in severe
    intoxication on the basis of estimated body iron burden, clinical features and
    serum iron concentration. It binds circulating iron so that it can be
    excreted, and is given alongside supportive care with particular attention to
    intravascular volume.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deferoxamine
      term:
        id: CHEBI:4356
        label: desferrioxamine B
  target_mechanisms:
  - target: Non-Transferrin-Bound Iron in Plasma
    treatment_effect: INHIBITS
    description: >-
      Chelation removes the unbound circulating iron that drives the systemic arm
      of the poisoning.
    evidence:
    - reference: PMID:2870463
      reference_title: "Iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By using estimates of the total body burden of iron, clinical symptoms, and the serum iron concentration, an appropriate decision can be made to initiate aggressive chelation therapy with deferoxamine.
      explanation: >-
        Establishes that chelation is directed at the body iron burden, i.e. at
        the circulating iron this node represents.
  evidence:
  - reference: PMID:2870463
    reference_title: "Iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In severe intoxication, the use of intravenous deferoxamine is indicated, along with supportive care, with particular attention to maintaining the intravascular volume.
    explanation: >-
      States the indication and route for deferoxamine in severe iron poisoning.
  - reference: PMID:12503657
    reference_title: "Acute iron ingestion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole bowel irrigation in addition to gastric lavage with an iron dose of over 50 mg/kg as well as deferoxamine treatment for patients in whom clinical and laboratory indications are present.
    explanation: >-
      Reports deferoxamine given on clinical and laboratory indications in a
      paediatric case series.
  - reference: PMID:14722368
    reference_title: "Acute iron poisoning: clinical picture, intensive care needs and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Desferrioxamine infusion and supportive care of shock was the mainstay.
    explanation: >-
      Confirms deferoxamine infusion, with shock support, as the mainstay of
      management in a real paediatric cohort.
  - reference: PMID:14722368
    reference_title: "Acute iron poisoning: clinical picture, intensive care needs and outcome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On desferrioxamine infusion Vin-rose colour urine was not seen in 31% even in presence of high serum iron.
    explanation: >-
      A caution rather than support for the treatment: the classically taught
      vin-rose urine was absent in nearly a third of chelated patients despite a
      high serum iron, so its absence must not be read as evidence that
      chelation is unnecessary or ineffective.

- name: Whole Bowel Irrigation
  description: >-
    Whole bowel irrigation with polyethylene glycol solution is used to clear
    unabsorbed iron tablets from the gut. It is specifically endorsed for
    substantial iron ingestions because the morbidity is high and other
    decontamination options are lacking — activated charcoal does not absorb iron
    and gastric lavage is a questionable intervention.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: gastrointestinal decontamination by whole bowel irrigation
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
    treatment_effect: INHIBITS
    description: >-
      Removing unabsorbed tablets from the lumen limits the iron burden still
      available for absorption and for continued mucosal corrosion.
    evidence:
    - reference: PMID:15533024
      reference_title: "Position paper: whole bowel irrigation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        WBI should be considered for patients who have ingested substantial amounts of iron as the morbidity is high and there is a lack of other options for gastrointestinal decontamination.
      explanation: >-
        Endorses whole bowel irrigation specifically for iron ingestion, acting on
        the unabsorbed luminal burden.
  evidence:
  - reference: PMID:15533024
    reference_title: "Position paper: whole bowel irrigation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although some volunteer studies have shown substantial decreases in the bioavailability of ingested drugs, no controlled clinical trials have been performed and there is no conclusive evidence that WBI improves the outcome of the poisoned patient.
    explanation: >-
      Records the honest limit of the evidence base: whole bowel irrigation is
      recommended for iron on grounds of high morbidity and absent alternatives,
      not on demonstrated outcome benefit.
  - reference: PMID:1754488
    reference_title: "Gastrotomy and whole bowel irrigation in iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ipecac and gastric lavage are questionable interventions for the overdose patient, and activated charcoal does not absorb iron.
    explanation: >-
      Sources the claim that the usual decontamination alternatives do not work
      for iron, which is why whole bowel irrigation is reached for.
  - reference: PMID:1754488
    reference_title: "Gastrotomy and whole bowel irrigation in iron poisoning."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because less than half of the iron was removed during surgery, and because the chelation requirement was modest, it is likely that whole bowel irrigation removed a significant amount of iron.
    explanation: >-
      A single-case inference that irrigation removed substantial iron; suggestive
      of the mechanism, not a demonstration of outcome benefit.
  notes: >-
    Contraindicated in bowel obstruction, perforation, ileus, haemodynamic
    instability, or a compromised unprotected airway — relevant in iron poisoning,
    where shock and late obstruction both occur.

- name: Fluid Resuscitation and Supportive Care
  description: >-
    Maintenance of intravascular volume, correction of acidosis and of coagulation
    disorders, and replacement of blood components when there is gastrointestinal
    haemorrhage. Prompt recognition and initiation of management is the single
    most critical element in reducing morbidity and mortality.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fluid therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Hypovolaemia and Circulatory Shock
    treatment_effect: INHIBITS
    description: >-
      Volume replacement counters the hypovolaemia produced by gastrointestinal
      fluid and blood loss.
    evidence:
    - reference: PMID:2870463
      reference_title: "Iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In severe intoxication, the use of intravenous deferoxamine is indicated, along with supportive care, with particular attention to maintaining the intravascular volume.
      explanation: >-
        Identifies maintenance of intravascular volume as a specific supportive
        care target in severe iron poisoning.
  evidence:
  - reference: PMID:2870463
    reference_title: "Iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other important measures include correction of acidosis and disorders of coagulation and replacement of blood components when there is evidence of gastrointestinal hemorrhage.
    explanation: >-
      Lists the supportive measures beyond chelation in iron poisoning.
  - reference: PMID:2870463
    reference_title: "Iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prompt recognition and initiation of management of children with acute iron poisoning is the single most critical element in decreasing the morbidity and mortality associated with these products.
    explanation: >-
      Establishes timeliness of management as the dominant determinant of outcome.
  - reference: PMID:14722368
    reference_title: "Acute iron poisoning: clinical picture, intensive care needs and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Shock responded to normal saline (33 +/- 15 mL/kg) and dopamine (10 +/- 4 microg/kg/min) within 4-24 hours in 7 of 9 patients.
    explanation: >-
      Shock in iron poisoning responded to volume replacement plus an inotrope in
      7 of 9 affected children, direct support for fluid resuscitation acting on
      the hypovolaemia node.

- name: Surgical Removal of Retained Iron and Correction of Stricture
  description: >-
    Surgical removal of iron may be indicated when large numbers of tablets remain
    in the gastrointestinal tract and cannot be cleared, and surgical correction is
    required for the late gastric or duodenal stenosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Fibrotic Healing of Corrosive Injury and Gastric Outlet Obstruction
    treatment_effect: INHIBITS
    description: >-
      Operative correction relieves the mechanical obstruction produced by the
      healed corrosive injury.
    evidence:
    - reference: PMID:2231830
      reference_title: "Gastrointestinal pathology in adult iron overdose."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They may occur acutely, ranging in severity from mucosal injury to complete infarction, or several weeks later, as obstruction due to stricture formation.
      explanation: >-
        Establishes the obstructing stricture that surgery addresses; the cited
        cases were managed surgically, but this abstract does not itself report
        operative outcomes.
  evidence:
  - reference: PMID:2870463
    reference_title: "Iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Under rare circumstances in which large numbers of iron tablets are present in the gastrointestinal tract, surgical removal may be indicated.
    explanation: >-
      States the indication for surgical removal of retained iron tablets.

- name: Liver Transplantation
  description: >-
    Considered earlier in iron poisoning than in many other hepatotoxic
    exposures, because the hepatic injury is periportal — striking the zone on
    which regeneration depends — and carries a relatively high mortality.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Periportal Hepatocellular Necrosis
    treatment_effect: INHIBITS
    description: >-
      Transplantation replaces the liver whose regenerative zone the poisoning has
      destroyed.
    evidence:
    - reference: PMID:11778670
      reference_title: "Hepatotoxicity in acute iron poisoning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        From the clinical perspective, the relatively high mortality rate of iron poisoning-induced hepatotoxicity requires vigilance for its onset and earlier consideration of liver transplantation.
      explanation: >-
        Links transplantation directly to the hepatotoxicity of iron poisoning.
  evidence:
  - reference: PMID:38060750
    reference_title: "Liver Transplantation for Acute Hepatic Failure Following Intentional Iron Overdose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a case of a severe iron tablet overdose with suicidal intent that progressed to fulminant hepatic failure despite medical treatment, ultimately treated with liver transplantation.
    explanation: >-
      Documents transplantation actually performed for iron-induced fulminant
      hepatic failure after medical treatment failed.
  - reference: PMID:38060750
    reference_title: "Liver Transplantation for Acute Hepatic Failure Following Intentional Iron Overdose."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe acute hepatotoxicity treated with liver transplantation is rare in adults, with very limited published literature.
    explanation: >-
      Records how thin the evidence base is: transplantation for this indication
      is reported, but rarely, so this treatment rests on case-level evidence.
  - reference: PMID:11778670
    reference_title: "Hepatotoxicity in acute iron poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      From the clinical perspective, the relatively high mortality rate of iron poisoning-induced hepatotoxicity requires vigilance for its onset and earlier consideration of liver transplantation.
    explanation: >-
      States the indication for earlier transplant consideration in iron-induced
      hepatotoxicity.

- name: Oral Deferiprone (investigational for acute poisoning)
  description: >-
    An orally active iron chelator established for chronic transfusional iron
    overload and proposed for acute poisoning where parenteral deferoxamine is
    unaffordable or unavailable. The supporting efficacy data in the acute setting
    are from a rat model, not from humans; this is not established therapy for
    acute iron poisoning and should not be curated as such.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deferiprone
      term:
        id: CHEBI:68554
        label: deferiprone
  target_mechanisms:
  - target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
    treatment_effect: INHIBITS
    description: >-
      Oral chelation of the ingested iron burden, with a dose-dependent reduction
      of gastrointestinal iron accumulation demonstrated histologically in rats.
      The edge is drawn to the ingested burden rather than to plasma
      non-transferrin-bound iron because the supporting measurement is
      gastrointestinal tissue iron, not a plasma iron species.
    evidence:
    - reference: PMID:10674529
      reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histologically, there was a dose-dependent decrease in iron accumulation in the gastrointestinal tract.
      explanation: >-
        Demonstrates dose-dependent removal of iron by oral deferiprone in the rat
        acute-overdose model.
  evidence:
  - reference: PMID:10674529
    reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Coadministration of 800 mg/kg deferiprone with the iron decreased mortality from 30% to 6.6% after 2 hours (P = .02), from 40% to 16.6% after 12 hours (P = .04), and from 53.3% to 20% after 24 hours (P = 0.007).
    explanation: >-
      Reports the mortality reduction in the rat model that motivates interest in
      oral deferiprone for acute poisoning.
  - reference: PMID:10674529
    reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Its efficacy, by oral administration, in acute iron poisoning has not been tested.
    explanation: >-
      The authors' own statement that human efficacy in acute poisoning was
      untested, which is why this treatment is curated as investigational.
  notes: >-
    The motivation is access rather than superiority: deferoxamine's cost and
    parenteral route limit its use worldwide.

animal_models:
- name: Rat oral iron LD50 model of acute iron overdose
  species: Rat
  genotype: wild type
  background: Wistar
  category: Chemically induced
  description: >-
    Wistar rats given 612 mg/kg elemental iron orally, a dose corresponding to the
    LD50 in that species, used to test whether an orally administered chelator can
    reduce mortality after acute iron ingestion.
  publication: PMID:10674529
  evidence:
  - reference: PMID:10674529
    reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rats were administered 612 mg/kg elemental iron orally, corresponding to LD50 in the species tested.
    explanation: >-
      Defines the model: the species, route, and the dose at which it was
      calibrated.
  modeled_mechanisms:
  - target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the defining exposure of human iron poisoning — a single acute
      oral iron load large enough to kill — and the gastrointestinal iron
      accumulation that follows it.
    limitations: >-
      The dose is set at the rodent LD50 rather than scaled from human ingestions,
      and rodent gastrointestinal anatomy and dosing pharmacokinetics differ from
      the human paediatric case; LD50 estimates for iron salts vary widely between
      studies and strains, so this model supports relative comparisons (chelated
      versus unchelated) far better than absolute human dose extrapolation.
    readouts:
    - name: Mortality after acute oral iron load
      target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
      direction: DECREASED
      interpretation: >-
        Direction is stated relative to the unchelated model arm: the model itself
        is lethal at this iron dose, and mortality fell when oral chelation was
        added, showing the lethality is iron-dependent and chelation-modifiable.
      evidence:
      - reference: PMID:10674529
        reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Coadministration of 800 mg/kg deferiprone with the iron decreased mortality from 30% to 6.6% after 2 hours (P = .02), from 40% to 16.6% after 12 hours (P = .04), and from 53.3% to 20% after 24 hours (P = 0.007).
        explanation: >-
          Quantifies the mortality readout and its response to chelation.
    - name: Gastrointestinal tissue iron accumulation
      target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
      direction: DECREASED
      interpretation: >-
        Direction is stated relative to the unchelated model arm: the model
        accumulates gastrointestinal tissue iron, and that accumulation fell
        dose-dependently with chelation, tying the readout to the iron burden.
      evidence:
      - reference: PMID:10674529
        reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Histologically, there was a dose-dependent decrease in iron accumulation in the gastrointestinal tract.
        explanation: >-
          Reports the histological iron-accumulation readout and its dose response.
    evidence:
    - reference: PMID:10674529
      reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our objective was to determine whether orally administered deferiprone can reduce the mortality of rats following acute, toxic, oral doses of iron.
      explanation: >-
        States the model's design — acute toxic oral iron dosing in rats — and its
        use as a testbed for acute-poisoning therapy.


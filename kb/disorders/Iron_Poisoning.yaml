name: Iron Poisoning
creation_date: "2026-08-23T00:00:00Z"
category: Environmental
parents:
- heavy metal poisoning
categories:
- Toxic Exposure Disorder
- Heavy Metal Poisoning
- Environmental Health Disorder
synonyms:
- acute iron poisoning
- acute iron toxicity
- acute iron overdose
- ferrous sulfate poisoning
description: >-
  Iron poisoning is an acute toxic syndrome caused by ingestion of iron salts in
  quantities that overwhelm regulated intestinal absorption and the iron-binding
  capacity of plasma transferrin. It is classically a poisoning of young children
  who swallow adult-strength ferrous sulfate tablets or prenatal vitamins, and of
  adolescents and adults who take iron in deliberate self-harm. Toxicity has two
  arms. A corrosive arm, in which iron salts injure the gastrointestinal mucosa
  directly, produces vomiting, diarrhoea, abdominal pain and blood loss within
  hours, and — weeks later, as those ulcers heal by scarring — gastric or duodenal
  stenosis. A cellular arm, in which iron absorbed beyond transferrin's binding
  capacity circulates as non-transferrin-bound iron, disturbs intermediary
  metabolism and mitochondrial function, producing metabolic acidosis, shock,
  periportal hepatocellular necrosis, and a distinctive coagulopathy attributed
  to reversible iron inhibition of the coagulation serine proteases rather than
  to hepatic synthetic failure. The clinical course is conventionally divided into
  phases separated by a deceptive period of apparent remission. Deferoxamine
  chelation is the specific antidote; the introduction of unit-dose packaging of
  iron supplements was followed by a sharp fall in paediatric deaths, though
  severity continued to fall after that packaging mandate was withdrawn.

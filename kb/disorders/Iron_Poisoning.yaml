discussions:
- discussion_id: evidence_base_quality_for_diagnosis_and_management
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    The diagnostic and management claims in this entry rest on case series,
    expert consensus, animal studies and adult volunteer studies rather than on
    controlled human trials in acute iron poisoning. Which of them would survive
    a trial-grade evidence base, and which are conventions that have persisted
    for want of better data?
  attaches_to:
  - diagnosis#Serum iron concentration
  - diagnosis#Abdominal radiography for retained iron tablets
  - treatments#Whole Bowel Irrigation
  - treatments#Oral Deferiprone (investigational for acute poisoning)
  rationale: >-
    This is a standing limitation on the entry rather than a gap in one
    mechanism, and it is stated by a review of the field rather than inferred
    here: diagnosis and management of iron poisoning have minimally evolved, and
    the evidence for them remains principally case series, expert consensus,
    animal studies and adult volunteer studies. That is visible throughout this
    entry, and recording it once in sourced form is more honest than repeating
    the caveat at every node. It is why the serum iron concentration is curated
    with a REFUTE beside its SUPPORT items rather than resolved; why oral
    deferiprone is investigational on rat data with its own
    HUMAN_MODEL_MISMATCH; why abdominal radiography rests on a single case
    report; why the Phase 3 mortality association is noted as a four-death
    series and not a prognostic rule; and why the commonly taught serum-iron
    chelation threshold and elemental-iron dose bands are curated nowhere in
    this entry at all. A curator who finds any of those thin should read this
    first: the thinness is the field's, not an artefact of what was reachable
    here.
  proposed_experiments:
  - experiment_id: prospective_registry_of_acute_iron_ingestion
    name: Prospective multicentre registry of acute iron ingestion
    description: >-
      Enrol consecutive acute iron ingestions across multiple poison centres
      with a common dataset — ingested preparation and estimated elemental dose,
      timed serum iron, abdominal radiograph findings, decontamination given,
      chelation timing and dose, and outcome. That is the design that would let
      the conventions in this entry be tested rather than inherited: whether
      serum iron predicts outcome once dose and clinical signs are accounted for
      (the disagreement between PMID:2870463 and PMID:14722368), whether
      radiographic tablet burden changes management, and what elemental-iron
      dose actually separates benign from severe. A registry rather than a trial
      because withholding chelation from a severely poisoned child is not
      randomisable.
  evidence:
  - reference: PMID:21975503
    reference_title: "Iron poisoning: a literature-based review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite these changes, diagnosis and management of iron poisoning have minimally evolved, and the current evidence for iron poisoning is yet based principally on case series, expert consensus, animal studies, and adult volunteer studies.
    explanation: >-
      States the evidence base of the field directly, which is what makes this a
      sourced limitation rather than a curator's impression of one.
  - reference: PMID:21975503
    reference_title: "Iron poisoning: a literature-based review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although seen less frequently than acetaminophen or salicylate poisoning, acute iron poisoning remains a dangerous threat, particularly to pediatric patients.
    explanation: >-
      Establishes that the thin evidence base attaches to a disease that is
      still dangerous, which is why the gap matters rather than being merely
      academic.
- discussion_id: ferroptosis_in_acute_iron_poisoning
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which route carries the hepatocellular and mucosal cell death of acute iron
    poisoning: ferroptosis (iron-dependent, GPX4-restrained lethal lipid
    peroxidation), lysosomal destabilisation ending in apoptotic or necrotic
    death, or unregulated oxidative organelle damage requiring no death
    programme at all? The three are not mutually exclusive, and none has been
    demonstrated in this disease.
  attaches_to:
  - pathophysiology#Iron-Catalysed Oxidative Organelle Injury
  - pathophysiology#Periportal Hepatocellular Necrosis
  rationale: >-
    Ferroptosis is a well-characterised, iron-dependent regulated cell-death
    pathway, and acute iron poisoning is the most extreme iron load a human
    tissue encounters — so the pathway is an obvious candidate for the cell death
    in this disease. But that inference runs from the general mechanism to this
    disease, not from evidence in it: the acute-iron-poisoning literature is a
    clinical toxicology literature of case series and poison-centre surveillance,
    and it predates the description of ferroptosis. No ferroptosis marker has been
    demonstrated in human acute iron poisoning tissue. The distinction is not
    academic, because a regulated pathway is druggable in ways that
    Fenton-chemistry damage is not: if ferroptosis carries a meaningful share of
    the hepatocyte death, a ferroptosis inhibitor becomes a candidate adjunct to
    chelation. This entry therefore curates the oxidative organelle injury it has
    evidence for, and records ferroptosis as an untested possibility rather than
    annotating GO:0097707 on the pathograph.

    The gap is wider than ferroptosis alone. PMID:11978485 proposes a separate,
    explicitly non-exclusive route in which iron-catalysed oxidative
    destabilisation of lysosomes spills digestive enzymes into the cytoplasm and
    ends in apoptotic or necrotic death. So there are at least two mechanistically
    distinct candidate death routes on offer — lipid-peroxidative ferroptosis and
    lysosomal rupture — and the acute iron poisoning literature demonstrates
    neither. Both are drawn from chronic iron-overload and general
    iron-toxicity biology. Establishing which, if either, carries the hepatocyte
    death in acute poisoning is the question; the experiments below should
    discriminate between them rather than test ferroptosis in isolation.
  proposed_experiments:
  - experiment_id: death_route_discrimination_in_poisoning_liver
    name: Discriminate the ferroptotic and lysosomal death routes in poisoned liver
    description: >-
      In explanted or post-mortem liver from acute iron poisoning, benchmarked
      against liver injured by a non-iron hepatotoxin, assay both candidate
      routes in the same tissue: lipid-peroxidation products and
      ferroptosis-associated transcriptional signatures for the ferroptotic
      route, and lysosomal membrane permeabilisation — cathepsin release into
      the cytosol, LAMP staining — for the lysosomal route. The point is to
      discriminate between them, so a design that assays only one cannot answer
      the question. The non-iron comparator is what separates an
      iron-specific death signature from generic oxidative necrosis.
  - experiment_id: gpx4_readout_validation_against_selenium_status
    name: Validate GPX4 abundance as a ferroptosis readout against selenium status
    description: >-
      Before GPX4 abundance is used as an index of ferroptotic pressure in
      poisoned tissue, establish what it is measuring. GPX4 is a selenoprotein
      whose expression tracks intracellular selenium utilisation and
      selenoprotein-synthesis capacity, so a low GPX4 in poisoned liver may
      reflect selenium status rather than iron-driven consumption. Measure
      selenium status and selenoprotein-synthesis capacity alongside GPX4 in the
      same specimens and test whether GPX4 varies with iron exposure once
      selenium status is accounted for. If it does not, the lipid hydroperoxide
      products should be the primary ferroptosis readout in the discrimination
      experiment above.
  - experiment_id: ferroptosis_inhibition_rat_acute_iron_model
    name: Ferroptosis inhibition in the rat acute oral iron model
    description: >-
      Add a ferroptosis inhibitor to the established rat acute oral iron LD50
      model, alone and with chelation, and measure mortality, transaminases and
      hepatic histology. A survival benefit beyond chelation alone would establish
      a regulated-death contribution and a therapeutic target.
  evidence:
  - reference: PMID:32165281
    reference_title: "Lipid peroxidation and ferroptosis: The role of GSH and GPx4."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ferroptosis (FPT) is a form of cell death due to missed control of membrane lipid peroxidation (LPO).
    explanation: >-
      Defines the candidate pathway and situates it as a failure of control over
      lipid peroxidation — the process iron catalyses — which is why it is a
      plausible but as yet untested contributor here.
  - reference: PMID:11978485
    reference_title: "Molecular bases of cellular iron toxicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      An alternative-and not mutually exclusive-mechanism for cellular iron toxicity involves iron-catalyzed oxidative destabilization of lysosomes, leading to leak of digestive enzymes into the cell cytoplasm and eventuating in apoptotic or necrotic cell death.
    explanation: >-
      Supplies the competing lysosomal death route that widens this gap. PARTIAL
      because, like the ferroptosis proposal, it is drawn from chronic
      iron-overload biology and has not been shown in acute iron poisoning.
  - reference: PMID:38867112
    reference_title: "PRDX6 augments selenium utilization to limit iron toxicity and ferroptosis."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      Loss of PRDX6 decreases the expression of selenoproteins and induces ferroptosis via a reduction in GPX4.
    explanation: >-
      Cited ONLY as a caveat on how this gap should be tested, not as evidence
      about acute iron poisoning. It is cell-line selenium biology with no
      ingestion, no human subject and no poisoning, and the "iron toxicity" of
      its title means ferroptotic death in culture rather than the clinical
      syndrome. What it contributes is that GPX4 abundance is set by
      selenoprotein-synthesis capacity, which makes a low GPX4 an ambiguous
      readout in the proposed post-mortem experiment above. It does nothing to
      close this gap; if anything it shows how far the ferroptosis literature
      sits from the disease.
  - reference: PMID:37629109
    reference_title: "Iron Load Toxicity in Medicine: From Molecular and Cellular Aspects to Clinical Implications."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Furthermore, the recent discovery of ferroptosis, which is a cell death program based on free radical generation by iron and cell membrane lipid oxidation, sparked thousands of investigations and the association of iron with cardiac, kidney, liver, and many other diseases, including cancer and infections.
    explanation: >-
      Shows ferroptosis being associated with iron and with liver disease in the
      general iron-toxicity literature. It is PARTIAL precisely because that is
      the inference this gap questions: the association is drawn across iron
      diseases at large, not demonstrated in acute iron poisoning.

- discussion_id: deferiprone_human_translation_acute_poisoning
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the mortality benefit of oral deferiprone seen in the rat acute
    oral-iron model translate to human acute iron poisoning, where the chelator
    must be given after ingestion rather than coadministered with the iron?
  attaches_to:
  - treatments#Oral Deferiprone (investigational for acute poisoning)
  - pathophysiology#Ingestion of Iron in Excess of Absorptive and Binding Capacity
  rationale: >-
    The rat result is a real, dose-responsive survival benefit, but its design
    limits what it can say about the clinical problem: deferiprone was
    coadministered with the iron or given two hours later, whereas a poisoned
    child presents hours after an ingestion of unknown size, often already
    vomiting — which is both the reason an oral agent is attractive and the reason
    it may not be retained. The authors state plainly that oral efficacy in acute
    poisoning had not been tested in humans. The stakes are access rather than
    superiority: deferoxamine's cost and parenteral route put it out of reach in
    much of the world, so an oral alternative would change who can be treated at
    all. Until human data exist, deferiprone is curated here as investigational
    and deferoxamine remains the antidote.

    This discussion attaches to the ingested-burden node rather than to plasma
    non-transferrin-bound iron, matching where this treatment's
    target_mechanisms edge points and for the same reason: the only measurement
    supporting oral deferiprone in the acute setting is gastrointestinal tissue
    iron, not a plasma iron species. A systemically absorbed chelator plausibly
    also acts on plasma NTBI, but nothing in the cited evidence measures that,
    so both links are drawn where the evidence is rather than where the
    pharmacology is assumed to reach.
  proposed_experiments:
  - experiment_id: delayed_oral_chelation_rat_model
    name: Delayed-administration oral chelation in the rat model
    description: >-
      Repeat the rat acute oral iron model with deferiprone given at intervals
      matching realistic human presentation delays, and in animals made to vomit
      or with delayed gastric emptying, to test whether the benefit survives the
      timing and retention conditions of a real poisoning.
  - experiment_id: deferiprone_registry_human_cohort
    name: Registry-based human comparative cohort
    description: >-
      In settings where parenteral deferoxamine is unavailable and oral
      deferiprone is used, assemble a poison-centre registry cohort comparing
      chelated and unchelated acute iron poisonings on mortality, peak serum iron
      and hepatic injury, with severity adjustment.
  evidence:
  - reference: PMID:10674529
    reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Its efficacy, by oral administration, in acute iron poisoning has not been tested.
    explanation: >-
      The authors state that human oral efficacy in acute poisoning is untested,
      which is precisely the translational gap recorded here.

  - reference: PMID:2870463
    reference_title: "Iron poisoning."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In severe intoxication, the use of intravenous deferoxamine is indicated, along with supportive care, with particular attention to maintaining the intravascular volume.
    explanation: >-
      Indirect: a management statement about maintaining intravascular volume,
      from which the hypovolaemia is inferred rather than reported.
  - reference: PMID:2870463
    reference_title: "Iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iron poisoning continues to be a major toxicologic problem, with major impact on the gastrointestinal and circulatory systems.
    explanation: >-

notes: >-
  MONDO:0800385 carries "iron overload" as an EXACT synonym. That synonym is a
  hazard rather than a guide for this entry: the chronic iron-overload disorders
  (hereditary haemochromatosis, transfusional haemosiderosis) are separate
  diseases with a different route to tissue iron, a different tempo, and a
  different therapeutic logic, and this entry deliberately curates only the acute
  ingestion syndrome that the MONDO textual definition describes ("Ingested iron
  can cause direct caustic injury to the gastrointestinal mucosa"). Literature
  retrieved under the phrase "iron overload" is very often about the chronic
  disorders and should not be curated here without checking which entity it
  concerns. The two are separable clinically as well as conceptually: peak serum
  iron is reported as helpful in telling acute toxicity from chronic overload,
  and gastric iron encrustation at autopsy is specific for acute ingestion.


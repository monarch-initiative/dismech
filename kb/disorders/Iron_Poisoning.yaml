- name: Acute Kidney Injury
  biological_scale: ORGANISM
  description: >-
    Renal failure develops in the decompensated phase of severe poisoning,
    alongside recurrent shock, acidosis and hepatocellular necrosis.
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrence or development of shock, and metabolic acidosis are usual and renal failure and features of extensive hepatocellular necrosis may develop.
    explanation: >-
      Reports renal failure as a feature of the third phase of severe iron
      poisoning.

- name: Fibrotic Healing of Corrosive Injury and Gastric Outlet Obstruction
  biological_scale: TISSUE
  description: >-
    Weeks after the acute event, the iron-induced mucosal ulcers heal by fibrous
    scarring that narrows the lumen, most often at the gastric outlet or duodenum,
    and the patient returns with recurrent vomiting. This delayed structural
    complication is unusual among acute poisonings and is the reason iron
    ingestion requires follow-up well beyond the acute admission. In adults, and
    particularly after enteric-coated preparations, the stricture may instead form
    in the distal small bowel.
  locations:
  - preferred_term: pyloric antrum
    term:
      id: UBERON:0001165
      label: pyloric antrum
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The last (fourth) phase, 2 to 6 weeks after ingestion, is only likely to develop in young children and is characterised by recurrence of vomiting due to gastric or duodenal stenosis caused by healing of iron-induced mucosal ulcers.
    explanation: >-
      Establishes the timing, mechanism and presentation of the late stenosis.
  - reference: PMID:2231830
    reference_title: "Gastrointestinal pathology in adult iron overdose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe an adult example of both, each occurring in the distal portion of the small intestine.
    explanation: >-
      Documents that the acute injury and the late stricture can both occur
      distally in adults, extending the lesion beyond the classical gastric and
      proximal small-bowel sites.

stages:
- name: Phase 1 - Acute gastrointestinal irritation (up to 6 hours)
  description: >-
    Features of acute gastrointestinal irritation dominate the first six hours,
    and most patients do not progress beyond this stage. Severe poisoning declares
    itself here through impaired consciousness, convulsions and metabolic acidosis.
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Features of acute gastrointestinal irritation dominate the period up to 6 hours after ingestion and most patients do not develop other features or progress beyond this stage.
    explanation: >-
      Defines the timing and dominant features of the first phase and notes that
      most patients stop here.
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe poisoning is characterised by impairment of consciousness, convulsions and metabolic acidosis.
    explanation: >-
      Gives the features that mark severe poisoning within the first phase.
- name: Phase 2 - Remission (6 to 12 hours)
  description: >-
    A period of apparent improvement in which the gastrointestinal features remit
    while cellular toxicity continues. It is the deceptive interval of iron
    poisoning and the reason apparent recovery does not license discharge.
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second phase, 6 to 12 hours after ingestion, is one of remission of features.
    explanation: >-
      Defines the timing and nature of the remission phase.
- name: Phase 3 - Shock, acidosis and organ failure (12 to 48 hours)
  description: >-
    Reached by only a small minority of patients. Shock and metabolic acidosis
    recur or develop, and renal failure and extensive hepatocellular necrosis may
    appear.
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phase 3 comprises the period 12 to 48 hours from ingestion and is reached only by a small minority of patients.
    explanation: >-
      Defines the timing of the third phase and that few patients reach it.
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrence or development of shock, and metabolic acidosis are usual and renal failure and features of extensive hepatocellular necrosis may develop.
    explanation: >-
      Gives the organ failures that characterise the third phase.
  - reference: PMID:14722368
    reference_title: "Acute iron poisoning: clinical picture, intensive care needs and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presence of shock or acute liver failure with coagulopathy and/or severe acidosis predicted all the four deaths.
    explanation: >-
      The feature combination defining this phase is what preceded every death in
      a 21-patient paediatric cohort, which is why this is the phase in which
      most deaths occur.
  notes: >-
    The mortality association above comes from a single-centre retrospective
    series with four deaths. It describes which features accompanied the fatal
    cases; it is not a validated prognostic rule.
- name: Phase 4 - Gastric or duodenal stenosis (2 to 6 weeks)
  description: >-
    A late phase seen mainly in young children, in which vomiting recurs because
    the healed iron-induced ulcers have narrowed the gastric outlet or duodenum.
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The last (fourth) phase, 2 to 6 weeks after ingestion, is only likely to develop in young children and is characterised by recurrence of vomiting due to gastric or duodenal stenosis caused by healing of iron-induced mucosal ulcers.
    explanation: >-
      Defines the timing, population and mechanism of the fourth phase.
  notes: >-
    Emergency-medicine sources commonly teach a five-stage scheme that splits the
    hepatotoxicity of days 2-5 into a stage of its own between shock and late
    stenosis. The four-phase scheme curated here is the one stated in the cited
    source; the two describe the same course at different granularity, and the
    hepatic injury is carried in this entry by the Periportal Hepatocellular
    Necrosis pathophysiology node.


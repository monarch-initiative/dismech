discussions:
- discussion_id: serum_iron_versus_ingested_dose
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    In acute iron poisoning, which better identifies the patient who will develop
    toxicity — the serum iron concentration, or the suspected ingested dose of
    elemental iron? The cited literature does not agree. Two paediatric cohorts
    answer in opposite directions, and a third series finds a timed serum-iron
    cutoff with complete negative predictive value inside the mild-symptom
    stratum.
  attaches_to:
  - diagnosis#Serum iron concentration
  - biochemical#Serum iron concentration
  - pathophysiology#Ingestion of Iron in Excess of Absorptive and Binding Capacity
  rationale: >-
    How to read the enums here, first, because they are counter-intuitive. Every
    evidence item on this discussion is marked SUPPORT, including items on
    opposite sides of the question, because what each supports is the claim that
    the literature disagrees, and that is this discussion's only claim. There is
    no schema slot for which side a source is on; the explanations carry it. The
    polarity that takes a side lives on the serum-iron diagnosis entry instead,
    where the claim being supported or refuted is that the serum iron is
    informative.

    This is a live disagreement between published positions rather than a gap,
    and both positions are curated on the serum-iron diagnosis entry with their
    own evidence. PMID:14722368, a 21-patient Indian cohort with four deaths,
    found the ingested dose and clinical signs guided management while the serum
    iron did not help. PMID:34121325, a 54-patient Australian cohort of
    unintentional exposures with no severe toxicity, found the reverse on both
    counts: peak serum iron separated symptomatic from asymptomatic children at
    P < 0.001, while suspected dose did not differ between them.

    The cohorts are not interchangeable and the difference may be the answer
    rather than a contradiction. One is a referral series containing deaths; the
    other is a poisons-information-service series of unintentional exposures in
    which nobody became severely toxic. A measurement can discriminate mild
    toxicity from none and still fail to guide management once a child is
    already shocked, and an ingested dose reported by a parent may be estimated
    very differently in the two settings. Nothing cited here resolves which
    explanation holds.

    A third series, PMID:39509998, narrows the disagreement without settling it,
    and narrows it along the axis the proposed experiment below names. It
    analysed the serum iron inside a severity stratum rather than pooled and
    found it discriminating in the mild one: among patients whose symptoms
    stayed minor, a concentration at or below 300 microg/dL drawn 2 to 4 hours
    after ingestion was followed by no subsequent toxic concentration, giving
    complete negative predictive value. That is the mild-range half of the
    stratified prediction below, arriving from a study that was run without
    reference to it. It is not the whole of that prediction: no severe stratum
    was analysed, the ingested dose was not compared against the concentration,
    and the abstract does not report the age distribution of its 75 patients, so
    it does not stand as a third paediatric cohort. Its specificity of 54% also
    bounds what it licenses, since a rule for whom to stop watching is not a rule
    for whom to chelate.

    The practical consequence has changed in one respect and not in the other.
    This entry now curates the conventional serum-iron thresholds, on the
    biochemical entry, because PMID:39509998 states them quotably and they are
    curated as what its own sentence calls them, a tradition, rather than as
    validated cutoffs. The elemental-iron dose bands remain curated nowhere: no
    source this entry can quote states them, and unlike the serum concentration
    the ingested dose has now failed to discriminate outright in one cohort.
  proposed_experiments:
  - experiment_id: serum_iron_versus_dose_discrimination_by_severity_stratum
    name: Test both predictors against outcome, stratified by severity stratum
    description: >-
      In a cohort spanning both settings - unintentional exposures and referred
      severe poisonings - record suspected ingested dose and timed serum iron
      against a hard outcome, and analyse within severity strata rather than
      pooled. The specific question is whether serum iron discriminates in the
      mild range while dose discriminates in the severe range, which would make
      both cited findings correct in their own populations and would explain the
      disagreement without either being wrong. Report how the ingested dose was
      ascertained, since parental estimate and pharmacy reconciliation are not
      the same measurement. PMID:39509998 is a partial instance of this design
      and is the reason it is worth running in full: it stratified by symptom
      severity and found the serum iron discriminating in the mild stratum, but
      analysed no severe stratum and did not put the ingested dose alongside the
      concentration in the same comparison.
  evidence:
  - reference: PMID:34121325
    reference_title: "Unintentional paediatric iron poisoning: A retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Suspected dose ingested is a poor predictor of toxicity.
    explanation: >-
      The Australian cohort's own conclusion, and one half of the disagreement
      this discussion records.
  - reference: PMID:34121325
    reference_title: "Unintentional paediatric iron poisoning: A retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median suspected dose of elemental iron ingested was 72 mg/kg (IQR 41-140 mg/kg). Seventeen (31%) children were symptomatic. There were no cases of severe toxicity.
    explanation: >-
      Characterises that cohort as unintentional exposures without severe
      toxicity, which is the population difference that may explain why its
      finding diverges from the referral series with four deaths.
  - reference: PMID:14722368
    reference_title: "Acute iron poisoning: clinical picture, intensive care needs and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dose of ingested iron and clinical signs were most useful guide to iron toxicity and management decisions; serum iron did not help.
    explanation: >-
      The opposing position, from the referral cohort, and the reason there is a
      controversy to record at all. It was previously marked REFUTE relative to
      the prompt's serum-iron arm, which made one side of a two-sided question
      read as this discussion's thesis and the other as its refutation. Marked
      SUPPORT now, like every other item here, because what it supports is the
      disagreement itself. Curated alongside the other cohorts rather than
      beneath them.
  - reference: PMID:39509998
    reference_title: "Utility of iron concentration two to four hours post ingestion in predicting toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with only minor GI symptoms and an iron concentration of ≤ 300 μg/dL between 2 and 4 h post-ingestion are unlikely to develop further toxicity.
    explanation: >-
      The third position, and the closest thing cited anywhere in this entry to a
      test of this discussion's own proposed experiment: it asks what the serum
      iron is worth inside a severity stratum rather than pooled, and finds it
      discriminating in the mild one. That is the direction the stratified
      analysis predicts, but only one arm of it, so it narrows the disagreement
      rather than resolving it.
  - reference: PMID:39509998
    reference_title: "Utility of iron concentration two to four hours post ingestion in predicting toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patients who developed at most minor symptoms (abdominal discomfort, nausea, vomiting, or diarrhea without evidence of systemic toxicity) and had a 2-4 h concentration ≤ 300 μg/dL symptoms had a subsequent concentration ≥ 350 μg/dL (negative predictive value [NPV] 100 %).
    explanation: >-
      The quantitative form of that finding, and the basis for calling the
      discrimination complete within its stratum rather than merely significant.
      Its limits are curated with it on the serum-iron diagnosis entry: 75
      patients, single centre, retrospective, specificity 54%, and an age
      distribution the abstract does not report.
- discussion_id: iron_effects_on_fibrinogen_versus_proteases
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    This entry models the coagulopathy of acute iron poisoning as reversible iron
    inhibition of the coagulation serine proteases, leaving fibrinogen itself
    undamaged. A separate literature reports the opposite kind of effect, in
    which ferric iron generates hydroxyl radicals that convert fibrinogen into
    fibrinolysis-resistant fibrin. Do both happen in acute iron poisoning, and if
    the second does, is the coagulopathy still correctable by removing the iron?
  attaches_to:
  - pathophysiology#Reversible Iron Inhibition of Coagulation Serine Proteases
  rationale: >-
    The two reported effects are not variants of one another. PMID:6421970, the
    source this entry's coagulation node is built on, found iron inactivating
    thrombin, factor Xa and kallikrein reversibly while leaving the zymogens and
    fibrinogen intact, which is an anticoagulant effect and matches the bleeding
    seen clinically. PMID:23170793 reports ferric ions generating hydroxyl
    radicals that convert fibrinogen into dense matted deposits with permanent
    resistance to enzymatic degradation, which is a prothrombotic effect on the
    substrate the first paper found undamaged.

    Three things keep this a gap rather than a contradiction to resolve. The
    second finding comes from a chronic degenerative disease frame, atherosclerosis
    and diabetes, where the iron burden and its time course are nothing like an
    overdose. The two describe different iron species and different targets, so
    they can both be true without meeting. And no cited source looks for
    fibrinogen structural change in acute iron poisoning at all.

    What makes it worth recording is that the entry's node carries a therapeutic
    implication which the second mechanism would not share. Protease inhibition is
    reversible, so the node states the coagulopathy is in principle correctable by
    chelation rather than only by factor replacement. A structural conversion of
    fibrinogen described as permanently resistant to degradation would not be
    undone by removing the iron. If both operate, chelation would correct one arm
    of the coagulopathy and not the other, and the node's framing is incomplete
    rather than wrong.
  proposed_experiments:
  - experiment_id: fibrinogen_structure_in_acute_iron_poisoning_plasma
    name: Look for fibrinogen structural change in acute iron poisoning plasma
    description: >-
      In plasma from patients with acute iron poisoning, sampled before and after
      chelation, assay both arms in the same specimens: protease activity for the
      reversible inhibition arm, and clot ultrastructure with fibrinolytic
      susceptibility for the fibrinogen arm. The discriminating result is what
      chelation does to each. Recovery of protease activity without recovery of
      clot architecture would show the two arms coming apart and would qualify the
      claim that this coagulopathy is correctable by removing the iron. Benchmark
      against plasma from a non-iron coagulopathy so that any change is
      attributable to iron rather than to critical illness.
  evidence:
  - reference: PMID:23170793
    reference_title: "Oxidation inhibits iron-induced blood coagulation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We have recently shown that trivalent iron (ferric ions) generates hydroxyl radicals, which subsequently convert FBG into abnormal fibrin clots in the form of DMDs.
    explanation: >-
      The competing effect, on the molecule PMID:6421970 reported as undamaged.
      PARTIAL because the work is framed on chronic degenerative disease rather
      than acute poisoning, so it establishes that ferric iron can do this to
      fibrinogen and not that it does so in this disease.
  - reference: PMID:23170793
    reference_title: "Oxidation inhibits iron-induced blood coagulation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      A characteristic feature of DMDs is their remarkable and permanent resistance to the enzymatic degradation.
    explanation: >-
      The property that gives this gap its therapeutic edge. The node's claim that
      the coagulopathy is correctable by removing the iron rests on the inhibition
      being reversible; a fibrin deposit described as permanently resistant to
      enzymatic degradation would not be reversed by chelation. PARTIAL on the
      same disease-frame grounds.
- discussion_id: evidence_base_quality_for_diagnosis_and_management
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    The diagnostic and management claims in this entry rest on case series,
    expert consensus, animal studies and adult volunteer studies rather than on
    controlled human trials in acute iron poisoning. Which of them would survive
    a trial-grade evidence base, and which are conventions that have persisted
    for want of better data?
  attaches_to:
  - diagnosis#Serum iron concentration
  - diagnosis#Abdominal radiography for retained iron tablets
  - treatments#Whole Bowel Irrigation
  - treatments#Oral Deferiprone (investigational for acute poisoning)
  rationale: >-
    This is a standing limitation on the entry rather than a gap in one
    mechanism, and it is stated by a review of the field rather than inferred
    here: diagnosis and management of iron poisoning have minimally evolved, and
    the evidence for them remains principally case series, expert consensus,
    animal studies and adult volunteer studies. That is visible throughout this
    entry, and recording it once in sourced form is more honest than repeating
    the caveat at every node. It is why the serum iron concentration is curated
    with a REFUTE beside its SUPPORT items rather than resolved; why oral
    deferiprone is investigational on rat data with its own
    HUMAN_MODEL_MISMATCH; why abdominal radiography rests on a single case
    report; why the Phase 3 mortality association is noted as a four-death
    series and not a prognostic rule; and why the commonly taught serum-iron
    chelation threshold and elemental-iron dose bands are curated nowhere in
    this entry at all. A curator who finds any of those thin should read this
    first: the thinness is the field's, not an artefact of what was reachable
    here.
  proposed_experiments:
  - experiment_id: prospective_registry_of_acute_iron_ingestion
    name: Prospective multicentre registry of acute iron ingestion
    description: >-
      Enrol consecutive acute iron ingestions across multiple poison centres
      with a common dataset — ingested preparation and estimated elemental dose,
      timed serum iron, abdominal radiograph findings, decontamination given,
      chelation timing and dose, and outcome. That is the design that would let
      the conventions in this entry be tested rather than inherited: whether
      serum iron predicts outcome once dose and clinical signs are accounted for
      (the disagreement between PMID:2870463 and PMID:14722368), whether
      radiographic tablet burden changes management, and what elemental-iron
      dose actually separates benign from severe. A registry rather than a trial
      because withholding chelation from a severely poisoned child is not
      randomisable.
  evidence:
  - reference: PMID:21975503
    reference_title: "Iron poisoning: a literature-based review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite these changes, diagnosis and management of iron poisoning have minimally evolved, and the current evidence for iron poisoning is yet based principally on case series, expert consensus, animal studies, and adult volunteer studies.
    explanation: >-
      States the evidence base of the field directly, which is what makes this a
      sourced limitation rather than a curator's impression of one.
  - reference: PMID:21975503
    reference_title: "Iron poisoning: a literature-based review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although seen less frequently than acetaminophen or salicylate poisoning, acute iron poisoning remains a dangerous threat, particularly to pediatric patients.
    explanation: >-
      Establishes that the thin evidence base attaches to a disease that is
      still dangerous, which is why the gap matters rather than being merely
      academic.
- discussion_id: ferroptosis_in_acute_iron_poisoning
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which route carries the hepatocellular and mucosal cell death of acute iron
    poisoning: ferroptosis (iron-dependent, GPX4-restrained lethal lipid
    peroxidation), lysosomal destabilisation ending in apoptotic or necrotic
    death, or unregulated oxidative organelle damage requiring no death
    programme at all? The three are not mutually exclusive, and none has been
    demonstrated in this disease.
  attaches_to:
  - pathophysiology#Iron-Catalysed Oxidative Organelle Injury
  - pathophysiology#Periportal Hepatocellular Necrosis
  rationale: >-
    Ferroptosis is a well-characterised, iron-dependent regulated cell-death
    pathway, and acute iron poisoning is the most extreme iron load a human
    tissue encounters — so the pathway is an obvious candidate for the cell death
    in this disease. But that inference runs from the general mechanism to this
    disease, not from evidence in it: the acute-iron-poisoning literature is a
    clinical toxicology literature of case series and poison-centre surveillance,
    and it predates the description of ferroptosis. No ferroptosis marker has been
    demonstrated in human acute iron poisoning tissue. The distinction is not
    academic, because a regulated pathway is druggable in ways that
    Fenton-chemistry damage is not: if ferroptosis carries a meaningful share of
    the hepatocyte death, a ferroptosis inhibitor becomes a candidate adjunct to
    chelation. This entry therefore curates the oxidative organelle injury it has
    evidence for, and records ferroptosis as an untested possibility rather than
    annotating GO:0097707 on the pathograph.

    The gap is wider than ferroptosis alone. PMID:11978485 proposes a separate,
    explicitly non-exclusive route in which iron-catalysed oxidative
    destabilisation of lysosomes spills digestive enzymes into the cytoplasm and
    ends in apoptotic or necrotic death. So there are at least two mechanistically
    distinct candidate death routes on offer — lipid-peroxidative ferroptosis and
    lysosomal rupture — and the acute iron poisoning literature demonstrates
    neither. Both are drawn from chronic iron-overload and general
    iron-toxicity biology. Establishing which, if either, carries the hepatocyte
    death in acute poisoning is the question; the experiments below should
    discriminate between them rather than test ferroptosis in isolation.

    A third literature bears on this without being about it, and it argues for
    restraint rather than for ferroptosis. Acetaminophen hepatotoxicity is the
    best-studied iron-dependent drug-induced liver injury, and a critical review
    of it warns in general terms against applying death mechanisms across cell
    types and disease states without validation, then concludes from the
    published data that hepatic antioxidant defences normally hold lipid
    peroxidation below pathophysiological relevance, so that ferroptosis becomes
    a significant mode of drug-induced cell death only where those defences are
    severely compromised. Acute iron poisoning is a plausible candidate for
    exactly that compromised state, which is the argument for testing it, not a
    demonstration that it holds. The same literature also supplies a specific
    route that would connect the two organelles this entry annotates on one node:
    lysosomal damage releasing iron that the mitochondrial calcium uniporter then
    takes up, making the lysosome the source and the mitochondrion the site.
    Whether that relay operates in iron poisoning, where the iron arrives from
    outside the cell rather than from a damaged lysosome, is untested and is
    worth distinguishing in the experiments below.
  proposed_experiments:
  - experiment_id: death_route_discrimination_in_poisoning_liver
    name: Discriminate the ferroptotic and lysosomal death routes in poisoned liver
    description: >-
      In explanted or post-mortem liver from acute iron poisoning, benchmarked
      against liver injured by a non-iron hepatotoxin, assay both candidate
      routes in the same tissue: lipid-peroxidation products and
      ferroptosis-associated transcriptional signatures for the ferroptotic
      route, and lysosomal membrane permeabilisation — cathepsin release into
      the cytosol, LAMP staining — for the lysosomal route. The point is to
      discriminate between them, so a design that assays only one cannot answer
      the question. The non-iron comparator is what separates an
      iron-specific death signature from generic oxidative necrosis.
  - experiment_id: gpx4_readout_validation_against_selenium_status
    name: Validate GPX4 abundance as a ferroptosis readout against selenium status
    description: >-
      Before GPX4 abundance is used as an index of ferroptotic pressure in
      poisoned tissue, establish what it is measuring. GPX4 is a selenoprotein
      whose expression tracks intracellular selenium utilisation and
      selenoprotein-synthesis capacity, so a low GPX4 in poisoned liver may
      reflect selenium status rather than iron-driven consumption. Measure
      selenium status and selenoprotein-synthesis capacity alongside GPX4 in the
      same specimens and test whether GPX4 varies with iron exposure once
      selenium status is accounted for. If it does not, the lipid hydroperoxide
      products should be the primary ferroptosis readout in the discrimination
      experiment above.
  - experiment_id: ferroptosis_inhibition_rat_acute_iron_model
    name: Ferroptosis inhibition in the rat acute oral iron model
    description: >-
      Add a ferroptosis inhibitor to the established rat acute oral iron LD50
      model, alone and with chelation, and measure mortality, transaminases and
      hepatic histology. A survival benefit beyond chelation alone would establish
      a regulated-death contribution and a therapeutic target.
  evidence:
  - reference: PMID:32165281
    reference_title: "Lipid peroxidation and ferroptosis: The role of GSH and GPx4."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ferroptosis (FPT) is a form of cell death due to missed control of membrane lipid peroxidation (LPO).
    explanation: >-
      Defines the candidate pathway and situates it as a failure of control over
      lipid peroxidation — the process iron catalyses — which is why it is a
      plausible but as yet untested contributor here.
  - reference: PMID:11978485
    reference_title: "Molecular bases of cellular iron toxicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      An alternative-and not mutually exclusive-mechanism for cellular iron toxicity involves iron-catalyzed oxidative destabilization of lysosomes, leading to leak of digestive enzymes into the cell cytoplasm and eventuating in apoptotic or necrotic cell death.
    explanation: >-
      Supplies the competing lysosomal death route that widens this gap. PARTIAL
      because, like the ferroptosis proposal, it is drawn from chronic
      iron-overload biology and has not been shown in acute iron poisoning.
  - reference: PMID:39649034
    reference_title: "Ferroptosis and Intrinsic Drug-induced Liver Injury by Acetaminophen and Other Drugs: A Critical Evaluation and Historical Perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, concerns arise when such mechanisms are applied across different cell types and disease states without sufficient validation.
    explanation: >-
      Makes this discussion's central caution a sourced one rather than a
      curator's assertion. The gap recorded here is precisely that ferroptosis is
      being carried into acute iron poisoning from other cell types and disease
      states, and a critical review of the ferroptosis literature in
      drug-induced liver injury names that move as the thing to be wary of.
  - reference: PMID:39649034
    reference_title: "Ferroptosis and Intrinsic Drug-induced Liver Injury by Acetaminophen and Other Drugs: A Critical Evaluation and Historical Perspective."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Overall, the published data support the idea that multi-layered endogenous antioxidant defense mechanisms in the liver limit the occurrence of pathophysiologically relevant LPO under normal conditions. Only when these defense mechanisms are severely compromised does ferroptosis become a significant mode of drug-induced cell death.
    explanation: >-
      Sets the condition under which ferroptosis would be expected to matter,
      which is what makes it testable here rather than merely plausible: hepatic
      antioxidant defences ordinarily keep lipid peroxidation below
      pathophysiological relevance, and ferroptosis becomes significant only when
      they are severely compromised. PARTIAL because the finding is about
      drug-induced liver injury, chiefly acetaminophen, and not about iron
      poisoning; whether an acute iron load compromises those defences to that
      degree is the open question, not something this establishes.
  - reference: PMID:39554796
    reference_title: "Role of Mitochondrial Iron Uptake in Acetaminophen Hepatotoxicity."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      After APAP overdose, the toxic metabolite, NAPQI, damages lysosomes, causing excess iron release and the mitochondrial uptake of Fe2+ by the mitochondrial calcium uniporter (MCU).
    explanation: >-
      Supplies a specific lysosome-to-mitochondrion iron relay, which is
      mechanistically interesting here because this entry annotates both
      organelles on one node without asserting a route between them. PARTIAL, and
      with an important disanalogy stated rather than glossed: in acetaminophen
      injury the lysosome is the iron source because a reactive metabolite damages
      it, whereas in iron poisoning the iron arrives from plasma. The relay is
      a hypothesis to discriminate, not a mechanism to import.
  - reference: PMID:38867112
    reference_title: "PRDX6 augments selenium utilization to limit iron toxicity and ferroptosis."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      Loss of PRDX6 decreases the expression of selenoproteins and induces ferroptosis via a reduction in GPX4.
    explanation: >-
      Cited ONLY as a caveat on how this gap should be tested, not as evidence
      about acute iron poisoning. It is cell-line selenium biology with no
      ingestion, no human subject and no poisoning, and the "iron toxicity" of
      its title means ferroptotic death in culture rather than the clinical
      syndrome. What it contributes is that GPX4 abundance is set by
      selenoprotein-synthesis capacity, which makes a low GPX4 an ambiguous
      readout in the proposed post-mortem experiment above. It does nothing to
      close this gap; if anything it shows how far the ferroptosis literature
      sits from the disease.
  - reference: PMID:37629109
    reference_title: "Iron Load Toxicity in Medicine: From Molecular and Cellular Aspects to Clinical Implications."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Furthermore, the recent discovery of ferroptosis, which is a cell death program based on free radical generation by iron and cell membrane lipid oxidation, sparked thousands of investigations and the association of iron with cardiac, kidney, liver, and many other diseases, including cancer and infections.
    explanation: >-
      Shows ferroptosis being associated with iron and with liver disease in the
      general iron-toxicity literature. It is PARTIAL precisely because that is
      the inference this gap questions: the association is drawn across iron
      diseases at large, not demonstrated in acute iron poisoning.

- discussion_id: deferiprone_human_translation_acute_poisoning
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the mortality benefit of oral deferiprone seen in the rat acute
    oral-iron model translate to human acute iron poisoning, where the chelator
    must be given after ingestion rather than coadministered with the iron?
  attaches_to:
  - treatments#Oral Deferiprone (investigational for acute poisoning)
  - pathophysiology#Ingestion of Iron in Excess of Absorptive and Binding Capacity
  rationale: >-
    The rat result is a real, dose-responsive survival benefit, but its design
    limits what it can say about the clinical problem: deferiprone was
    coadministered with the iron or given two hours later, whereas a poisoned
    child presents hours after an ingestion of unknown size, often already
    vomiting — which is both the reason an oral agent is attractive and the reason
    it may not be retained. The authors state plainly that oral efficacy in acute
    poisoning had not been tested in humans. The stakes are access rather than
    superiority: deferoxamine's cost and parenteral route put it out of reach in
    much of the world, so an oral alternative would change who can be treated at
    all. Until human data exist, deferiprone is curated here as investigational
    and deferoxamine remains the antidote.

    This discussion attaches to the ingested-burden node rather than to plasma
    non-transferrin-bound iron, matching where this treatment's
    target_mechanisms edge points and for the same reason: the only measurement
    supporting oral deferiprone in the acute setting is gastrointestinal tissue
    iron, not a plasma iron species. A systemically absorbed chelator plausibly
    also acts on plasma NTBI, but nothing in the cited evidence measures that,
    so both links are drawn where the evidence is rather than where the
    pharmacology is assumed to reach.
  proposed_experiments:
  - experiment_id: delayed_oral_chelation_rat_model
    name: Delayed-administration oral chelation in the rat model
    description: >-
      Repeat the rat acute oral iron model with deferiprone given at intervals
      matching realistic human presentation delays, and in animals made to vomit
      or with delayed gastric emptying, to test whether the benefit survives the
      timing and retention conditions of a real poisoning.
  - experiment_id: deferiprone_registry_human_cohort
    name: Registry-based human comparative cohort
    description: >-
      In settings where parenteral deferoxamine is unavailable and oral
      deferiprone is used, assemble a poison-centre registry cohort comparing
      chelated and unchelated acute iron poisonings on mortality, peak serum iron
      and hepatic injury, with severity adjustment.
  evidence:
  - reference: PMID:10674529
    reference_title: "The efficacy of oral deferiprone in acute iron poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Its efficacy, by oral administration, in acute iron poisoning has not been tested.
    explanation: >-
      The authors state that human oral efficacy in acute poisoning is untested,
      which is precisely the translational gap recorded here.

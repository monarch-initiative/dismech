- name: Acute Kidney Injury
  biological_scale: ORGANISM
  description: >-
    Renal failure develops in the decompensated phase of severe poisoning,
    alongside recurrent shock, acidosis and hepatocellular necrosis.
  evidence:
  - reference: PMID:3784842
    reference_title: "Management of acute iron poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

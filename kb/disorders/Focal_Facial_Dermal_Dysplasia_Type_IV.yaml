      reference_title: "Focal preauricular dermal dysplasia: distinctive congenital lesions with a bilateral and symmetric distribution."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        If an embryonic fusion defect of the mandibular and maxillary prominences
        underlies the anomaly, the cleft lip and palate seen in one of our
        patients may be non-coincidental.
      explanation: >-
        The authors raise, without establishing, a shared fusion-defect origin

name: Focal Facial Dermal Dysplasia Type IV
creation_date: "2026-10-24T01:30:00Z"
category: Mendelian
synonyms:
- FFDD4
- FFDD type IV
- focal facial dermal dysplasia 4
- focal facial preauricular dysplasia
- focal preauricular dermal dysplasia
description: >-
  Focal facial dermal dysplasia type IV (FFDD4) is a rare autosomal recessive
  developmental skin disorder in which infants are born with round or oval
  aplasia cutis-like lesions in the preauricular region and on the cheeks,
  arranged along an oblique line from the ear toward the corner of the mouth.
  This line corresponds to the embryonic fusion line of the maxillary and
  mandibular prominences of the first pharyngeal arch. Lesions can present as
  vesicles at birth and evolve into hypopigmented atrophic scar-like macules,
  sometimes ringed by a collar of hair. Unlike FFDD types I to III, which
  affect the temples, FFDD4 usually occurs without other facial dysmorphism, and
  development is typically normal. It is caused by biallelic loss-of-function
  variants in CYP26C1, which encodes a cytochrome P450 enzyme that hydroxylates
  and inactivates retinoic acid. Impaired retinoic acid clearance along the
  facial fusion line during embryogenesis is the proposed mechanism.
disease_term:
  preferred_term: focal facial dermal dysplasia type IV
  term:
    id: MONDO:0013997
    label: focal facial dermal dysplasia type IV
parents:
- focal facial dermal dysplasia
- ectodermal dysplasia syndrome
notes: >-
  Nosology. The focal facial dermal dysplasias were first grouped into three types
  by inheritance and associated facial features (PMID:1401310). A 2011 review
  reclassified them and created type IV for patients with preauricular lesions
  (PMID:21931173), and the four-type scheme separates the bitemporal types I to
  III from the preauricular type IV (PMID:28663233). Type III (Setleis syndrome)
  is caused by biallelic TWIST2 variants or by 1p36.22p36.21 duplication or
  triplication (PMID:25728400) and is curated only as a differential diagnosis
  here; types I and II have no known gene. No GeneReviews chapter names this
  disorder or its synonyms (`just check-genereviews --online` returned
  NO_CHAPTER against the 2026-09-10 Bookshelf index). Earlier dermatology reports describe the same lesion
  as focal preauricular dermal dysplasia or preauricular aplasia cutis congenita
  (PMID:9420540, PMID:16530710, PMID:18577040); those cases were diagnosed
  clinically, before CYP26C1 was identified.


  Associated findings. Orphanet (ORPHA:398189) annotates hydrocephalus,
  microcephaly, hemiparesis, focal-onset seizures, intracranial hemorrhage, short
  chin and nevus as frequent. Among the published reports located for this entry,
  these findings come from single clinically diagnosed children (for example, one
  child with a perinatal intracerebral hemorrhage and one with a small chin and a
  nevus in PMID:16530710), so they are not curated here as disease phenotypes.
  The HPO annotation file maps OMIM:614974 to HP:0011336 Bitemporal forceps marks,
  a bitemporal lesion characteristic of types I to III rather than the
  preauricular lesion of type IV; that term is not used here.


  CYP26C1 beyond FFDD4. Heterozygous damaging CYP26C1 missense variants have been
  reported as a modifier of SHOX deficiency and in idiopathic short stature
  (PMID:27861128, PMID:29706635). Those are separate phenotypes and are not
  curated in this entry. No mechanism module currently fits this disorder:
  pharyngeal_arch_patterning_serial_homology describes skeletal arch malformation
  bundles, which FFDD4 does not show.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry homozygous or compound heterozygous CYP26C1
    variants, with compound heterozygosity confirmed by parental testing. The
    recurrent seven-base-pair duplication was found in 0.3% of healthy controls,
    which the discovery study interpreted as non-penetrance or under-ascertainment
    of the mild skin phenotype.
  evidence:
  - reference: PMID:29263414
    reference_title: "Focal facial dermal dysplasia type 4: identification of novel CYP26C1 mutations in unrelated patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FFDD4 is an autosomal-recessive trait characterized by preauricular skin
      defects without additional dysmorphic findings.
    explanation: States the recessive inheritance of FFDD4.
  - reference: PMID:29263414
    reference_title: "Focal facial dermal dysplasia type 4: identification of novel CYP26C1 mutations in unrelated patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compound heterozygosity was validated through parental studies.
    explanation: Parental segregation confirms biallelic, in trans inheritance.
  - reference: PMID:23161670
    reference_title: "Focal facial dermal dysplasia, type IV, is caused by mutations in CYP26C1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seven base pairs duplication was present in 0.3% of healthy controls
      and 0.3% of patients with other birth defects. These findings suggest that
      the phenotypic manifestations of FFDD Type IV can be non-penetrant or
      underascertained.
    explanation: >-
      Carrier frequency of the recurrent allele in controls, and the authors'
      interpretation that penetrance may be incomplete or that mild cases go
      unrecognized.

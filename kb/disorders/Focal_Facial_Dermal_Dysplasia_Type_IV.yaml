genetic:
- name: CYP26C1
  gene_term:
    preferred_term: CYP26C1
    term:
      id: hgnc:20577
      label: CYP26C1
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic loss-of-function variants. The discovery family carried a
    maternally inherited seven-base-pair duplication c.844_851dupCCATGCA
    (p.Glu284fsX128) and a paternally inherited missense variant c.1433G>A
    (p.Arg478His); three of four further patients were homozygous for the
    duplication. Later reports added p.Arg77Pro and two splice-site variants at
    the intron 5 donor site, and a Belgian founder haplotype carrying a
    recurrent frameshift allele. The reference transcript is not stated in the
    abstracts cited here.
  evidence:
  - reference: PMID:23161670
    reference_title: "Focal facial dermal dysplasia, type IV, is caused by mutations in CYP26C1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of four additional, unrelated Type IV FFDD patients and eight
      Type II or III TWIST2-negative FFDD patients revealed that three of the
      Type IV patients were homozygous for the duplication, whereas none of the
      Type II or III patients had CYP26C1 mutations.
    explanation: >-
      Replication in unrelated FFDD4 patients and absence of CYP26C1 variants
      in other FFDD types.
  - reference: PMID:29263414
    reference_title: "Focal facial dermal dysplasia type 4: identification of novel CYP26C1 mutations in unrelated patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results provide further evidence that CYP26C1 mutations are the
      molecular genetic basis of FFDD4.
    explanation: Independent confirmation in two further families.
  - reference: PMID:39828664
    reference_title: Unexpected High Prevalence of Focal Facial Dermal Dysplasia (FFDD) Type IV Is Linked to a Founder Effect in the Belgian Population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study reports two novel Belgian FFDD type IV cases, both homozygous
      for a recurrent CYP26C1 frameshift variant, with a common 700 kb
      haplotype, indicating a founder effect.
    explanation: Founder frameshift allele in Belgian patients.
  notes: >-
    No ClinGen gene-disease validity record for CYP26C1 was found: no CGGV
    file in references_cache names CYP26C1, and the committed ClinGen export
    (cache/clingen/gene_validity.csv) has no CYP26C1 row. gene_disease_validity
    is therefore left absent.

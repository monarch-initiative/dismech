phenotypes:
- category: Dermatologic
  name: Preauricular aplasia cutis-like lesions
  description: >-
    Congenital, usually bilateral and symmetric, round or oval skin defects
    about 0.5 to 2 cm across in the preauricular region and on the cheeks,
    typically two or three per side, arranged along an arc from the ear toward
    the corner of the mouth. This is the defining feature of FFDD4 and usually
    occurs without other facial dysmorphism.
  diagnostic: true
  phenotype_term:
    preferred_term: Preauricular aplasia cutis-like skin lesions
    term:
      id: HP:0001057
      label: Aplasia cutis congenita
    onset:
      onset_category: CONGENITAL
  evidence:
  - reference: PMID:23161670
    reference_title: "Focal facial dermal dysplasia, type IV, is caused by mutations in CYP26C1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal facial dermal dysplasia (FFDD) Type IV is a rare syndrome
      characterized by facial lesions resembling aplasia cutis in a preauricular
      distribution along the line of fusion of the maxillary and mandibular
      prominences.
    explanation: Defining lesion and its distribution in the gene-discovery study.
  - reference: PMID:16530710
    reference_title: "Focal preauricular dermal dysplasia: distinctive congenital lesions with a bilateral and symmetric distribution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lesions were located along an arc from the top of the ear to the
      corner of the mouth.
    explanation: Lesion distribution in three unrelated children.
  - reference: PMID:18577040
    reference_title: "Focal preauricular dermal dysplasia: report of two cases and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal preauricular dermal dysplasia is a form of aplasia cutis congenita
      in which atrophic skin lesions occur in a stereotypical bilateral
      distribution in the preauricular region.
    explanation: Characterizes the lesion as a form of aplasia cutis congenita.
  - reference: ORPHA:398189

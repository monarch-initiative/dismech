diagnosis:
- name: Clinical Diagnosis From Lesion Distribution
  description: >-
    Diagnosis is clinical, based on congenital round or oval aplasia cutis-like
    lesions on the preauricular line without other facial dysmorphism. A
    physical examination looks for associated malformations, and the parents
    should be examined as well.
  evidence:
  - reference: PMID:40231353
    reference_title: "Focal facial dermal dysplasia type IV: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When FFDD is suspected, a thorough physical examination of the child is
      essential, as the diagnosis is based on clinical manifestations.
    explanation: Diagnosis rests on the clinical presentation.
- name: CYP26C1 Sequencing With Parental Testing
  description: >-
    Sequencing CYP26C1 confirms the diagnosis, and testing both parents shows
    whether two variants lie in trans.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29263414
    reference_title: "Focal facial dermal dysplasia type 4: identification of novel CYP26C1 mutations in unrelated patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compound heterozygosity was validated through parental studies.
    explanation: Parental testing establishes phase of the two variants.
differential_diagnoses:
- name: Aplasia cutis congenita
  description: >-
    Congenital localized absence of skin, most often on the scalp. Histology of
    FFDD lesions resembles membranous aplasia cutis congenita; FFDD4 is
    distinguished by its bilateral preauricular location on the
    maxillary-mandibular fusion line. A hair collar around scalp aplasia cutis
    suggests a neuroectodermal defect, whereas in FFDD4 it is usually seen
    without neurological involvement.
  disease_term:
    preferred_term: aplasia cutis congenita
    term:
      id: MONDO:0007145
      label: aplasia cutis congenita
  evidence:
  - reference: PMID:30561078
    reference_title: A case of focal facial dermal dysplasia type 4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of a hair collar supports the hypothesis that FFDD is caused
      by abnormal closure at facial embryonic fusion lines, but unlike midline
      scalp defects is not associated with neurological compromise.
    explanation: Contrasts the FFDD4 hair collar with the scalp aplasia cutis sign.
- name: Setleis syndrome (focal facial dermal dysplasia type III)
  description: >-
    FFDD with bitemporal rather than preauricular scar-like lesions and
    additional facial features, caused by biallelic TWIST2 variants or, with
    dominant transmission, by 1p36.22p36.21 duplication or triplication.
    CYP26C1 variants were not found in TWIST2-negative type II or III patients.
  disease_term:
    preferred_term: Setleis syndrome
    term:
      id: MONDO:0009203
      label: focal facial dermal dysplasia type III
  evidence:
  - reference: PMID:28663233
    reference_title: "The focal facial dermal dysplasias: phenotypic spectrum and molecular genetic heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Four subtypes are classified by the bitemporal (FFDD1-3) or preauricular
      (FFDD4) lesion location.
    explanation: Lesion location separates FFDD4 from types I to III.
  - reference: PMID:21931173
    reference_title: "Setleis syndrome in Mexican-Nahua sibs due to a homozygous TWIST2 frameshift mutation and partial expression in heterozygotes: review of the focal facial dermal dysplasias and subtype reclassification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, different homozygous TWIST2 nonsense mutations were reported in
      unrelated Setleis syndrome (FFDD Type III) patients from consanguineous
      families, consistent with autosomal recessive inheritance.
    explanation: TWIST2 genetics of the type III differential.
  - reference: PMID:25728400
    reference_title: Chromosome 1p36.22p36.21 duplications/triplication causes Setleis syndrome (focal facial dermal dysplasia type III).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosomal microarray analyses revealed unique copy number variants of
      1p36 in two individuals with duplications at 1p36.22p36.21 and one with a
      triplication at 1p36.22p36.21.
    explanation: Copy-number cause of TWIST2-negative Setleis syndrome.
- name: Focal facial dermal dysplasia type II (Brauer-Setleis phenotype)
  description: >-
    Bitemporal FFDD with autosomal dominant inheritance and variable
    expressivity; no causative gene is known, and TWIST2-negative type II
    patients did not carry CYP26C1 variants.
  disease_term:
    preferred_term: focal facial dermal dysplasia type II
    term:
      id: MONDO:0013996
      label: focal facial dermal dysplasia type II
  evidence:
  - reference: PMID:21931173
    reference_title: "Setleis syndrome in Mexican-Nahua sibs due to a homozygous TWIST2 frameshift mutation and partial expression in heterozygotes: review of the focal facial dermal dysplasias and subtype reclassification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The FFDD subtypes were reclassified: the 'Brauer-Setleis' phenotype
      (autosomal dominant with variable expressivity) as FFDD type II; and
      patients with preauricular lesions as a new subtype, FFDD type IV.
    explanation: Defines type II and separates the preauricular type IV.
- name: Focal facial dermal dysplasia type I (Brauer syndrome)
  description: >-
    Autosomal dominant FFDD with bitemporal scar-like lesions; no causative gene
    is known.
  disease_term:
    preferred_term: Brauer syndrome
    term:
      id: MONDO:0007627
      label: focal facial dermal dysplasia type I
  evidence:
  - reference: PMID:29263414
    reference_title: "Focal facial dermal dysplasia type 4: identification of novel CYP26C1 mutations in unrelated patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      characterized by congenital scar-like atrophic lesions in the bitemporal

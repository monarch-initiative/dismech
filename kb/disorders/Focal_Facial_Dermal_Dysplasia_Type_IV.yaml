pathophysiology:
- name: Biallelic CYP26C1 Loss of Function
  description: >-
    Homozygous or compound heterozygous CYP26C1 variants (frameshift, missense
    and splice-site) abolish the retinoic acid hydroxylase activity of the
    enzyme. In the discovery family one allele was a frameshift predicting
    premature termination and the other a missense variant that was inactive
    when expressed in mammalian cells.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic germline CYP26C1 variants, homozygous or compound heterozygous.
  genes:
  - preferred_term: CYP26C1
    term:
      id: hgnc:20577
      label: CYP26C1
  molecular_functions:
  - preferred_term: retinoic acid 4-hydroxylase activity
    term:
      id: GO:0008401
      label: retinoic acid 4-hydroxylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:23161670
    reference_title: "Focal facial dermal dysplasia, type IV, is caused by mutations in CYP26C1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thus, FFDD Type IV results from the loss of function mutations in CYP26C1.
    explanation: Discovery study concluding that FFDD4 is caused by CYP26C1 loss of function.
  - reference: PMID:23161670
    reference_title: "Focal facial dermal dysplasia, type IV, is caused by mutations in CYP26C1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The duplication predicted a frameshift mutation that led to a premature
      stop codon and premature chain termination, whereas the missense mutation
      was not functional based on its in vitro expression in mammalian cells.
    explanation: >-
      Expression of the p.Arg478His allele in mammalian cells showed no activity,
      and the other allele is a truncating frameshift.
  - reference: ORPHA:398189
    reference_title: Focal facial dermal dysplasia type IV
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CYP26C1 | cytochrome P450 family 26 subfamily C member 1 | hgnc:20577 |
      Disease-causing germline mutation(s) (loss of function) in
    explanation: Orphanet records CYP26C1 loss of function as disease-causing.
  downstream:
  - target: Impaired Retinoic Acid Catabolism
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14532297
      reference_title: "A novel human cytochrome P450, CYP26C1, involved in metabolism of 9-cis and all-trans isomers of retinoic acid."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transiently transfected cells expressing CYP26C1 convert atRA to polar
        water-soluble metabolites similar to those generated by CYP26A1 and -B1.
      explanation: >-
        CYP26C1 catabolizes all-trans retinoic acid in cells, so loss of the
        enzyme removes this route of retinoic acid clearance.
- name: Impaired Retinoic Acid Catabolism
  description: >-
    CYP26C1 hydroxylates all-trans, 9-cis and 13-cis retinoic acid and the active
    metabolite 4-oxo-all-trans retinoic acid, converting them to polar products.
    Loss of CYP26C1 activity is expected to reduce clearance of these active
    retinoids in the tissues where it is expressed. Retinoic acid levels have not
    been measured in FFDD4 patients or tissue.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: retinoic acid catabolic process
    term:
      id: GO:0034653
      label: retinoic acid catabolic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: all-trans-retinoic acid
    term:
      id: CHEBI:15367
      label: all-trans-retinoic acid
  - preferred_term: 9-cis-retinoic acid
    term:
      id: CHEBI:50648
      label: 9-cis-retinoic acid
  - preferred_term: all-trans-4-oxoretinoic acid
    term:
      id: CHEBI:80656
      label: all-trans-4-oxoretinoic acid
  evidence:
  - reference: PMID:14532297
    reference_title: "A novel human cytochrome P450, CYP26C1, involved in metabolism of 9-cis and all-trans isomers of retinoic acid."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This third CYP26 member may play a specific role in catabolizing both
      all-trans and 9-cis isomers of RA.
    explanation: Characterizes CYP26C1 as a retinoic acid catabolizing enzyme.
  - reference: PMID:29476041
    reference_title: CYP26C1 Is a Hydroxylase of Multiple Active Retinoids and Interacts with Cellular Retinoic Acid Binding Proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CYP26C1 was found to effectively metabolize all-trans retinoic acid
      (atRA), 9-cis-retinoic acid (9-cis-RA), 13-cis-retinoic acid, and
      4-oxo-atRA with the highest intrinsic clearance toward 9-cis-RA.
    explanation: Defines the substrate range of the enzyme lost in FFDD4.
  downstream:
  - target: Excess Retinoic Acid Exposure at the Maxillary-Mandibular Fusion Line
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40231353
      reference_title: "Focal facial dermal dysplasia type IV: a case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Specifically, CYP26C1 is tasked with converting all-trans retinoic acid
        into an inactive metabolite; thus, mutations in this gene could result
        in the substrate's accumulation.
      explanation: >-
        Discussion in a clinical case series proposing retinoic acid accumulation
        as the consequence of CYP26C1 loss; a hypothesis, not a measurement.
- name: Excess Retinoic Acid Exposure at the Maxillary-Mandibular Fusion Line
  description: >-
    In the mouse embryo Cyp26c1 is expressed in the maxillary and mandibular
    components of the first pharyngeal arch and along the line where these
    prominences fuse, the site of the FFDD4 skin lesions. Its proposed role is
    to shield these tissues from retinoic acid during facial development, so
    loss of CYP26C1 is thought to expose the fusion line to excess retinoic acid
    signaling. This step is inferred from expression data and enzyme function;
    it has not been demonstrated in a model that reproduces the human lesion.
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  locations:
  - preferred_term: pharyngeal arch 1
    term:
      id: UBERON:0004362
      label: pharyngeal arch 1
  - preferred_term: maxillary prominence
    term:
      id: UBERON:0005868
      label: maxillary prominence
  - preferred_term: mandibular prominence
    term:
      id: UBERON:0005867
      label: mandibular prominence
  biological_processes:
  - preferred_term: retinoic acid receptor signaling pathway
    term:
      id: GO:0048384
      label: retinoic acid receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:23161670
    reference_title: "Focal facial dermal dysplasia, type IV, is caused by mutations in CYP26C1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The FFDD skin lesions arise along the sites of fusion of the maxillary and
      mandibular prominences early in facial development, and Cyp26c1 was
      expressed exactly along the fusion line for these facial prominences in
      the first branchial arch in mice.
    explanation: >-
      Mouse expression places Cyp26c1 at the embryonic site of the human
      lesions.
  - reference: PMID:12915310
    reference_title: "Cyp26C1 encodes a novel retinoic acid-metabolizing enzyme expressed in the hindbrain, inner ear, first branchial arch and tooth buds during murine development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This pattern of expression suggests that mCYP26C1 may play an important
      role in protecting the hindbrain, first branchial arch, otocyst and tooth
      buds against RA exposure during embryonic development.
    explanation: >-
      Proposes, from mouse embryonic expression, that CYP26C1 protects the
      first branchial arch from retinoic acid.
  - reference: PMID:12915310
    reference_title: "Cyp26C1 encodes a novel retinoic acid-metabolizing enzyme expressed in the hindbrain, inner ear, first branchial arch and tooth buds during murine development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At E9.5, mCyp26C1 expression persists in rhombomere 2 and in the maxillary
      and mandibular components of the first branchial arch
    explanation: Expression in both prominences whose fusion line carries the lesions.
  downstream:
  - target: Defective Ectodermal Fusion of the Maxillary and Mandibular Prominences
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Defective Ectodermal Fusion of the Maxillary and Mandibular Prominences
  description: >-
    The lesions consistently lie on an oblique line from the preauricular region
    to the angle of the mouth, matching the embryonic fusion line between the
    maxillary and mandibular prominences. Incomplete ectodermal fusion along
    this line has been proposed as the developmental defect, by analogy with
    membranous aplasia cutis congenita. The proposal rests on lesion
    distribution and histology; no developmental study has observed it.
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  locations:
  - preferred_term: maxillary prominence
    term:
      id: UBERON:0005868
      label: maxillary prominence
  - preferred_term: mandibular prominence
    term:
      id: UBERON:0005867
      label: mandibular prominence
  biological_processes:
  - preferred_term: face morphogenesis
    term:
      id: GO:0060325
      label: face morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9420540
    reference_title: Preauricular skin defects. A consequence of a persistent ectodermal groove.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This type of facial aplasia cutis may be the result of incomplete fusion of
      the ectodermal groove between the maxillary and mandibular facial
      prominences.
    explanation: >-
      Ten-patient series proposing incomplete fusion of the ectodermal groove as
      the origin of preauricular lesions; patients were clinically diagnosed.
  - reference: PMID:30561078
    reference_title: A case of focal facial dermal dysplasia type 4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of a hair collar supports the hypothesis that FFDD is caused
      by abnormal closure at facial embryonic fusion lines
    explanation: Case report arguing that the hair collar points to a fusion-line defect.
  downstream:

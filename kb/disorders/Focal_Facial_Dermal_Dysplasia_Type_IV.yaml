  - target: Unilateral cleft lip
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Focal Dermal Hypoplasia of Preauricular Skin
  description: >-
    Lesional skin in the focal facial dermal dysplasias shows a thin, flattened
    epidermis, replacement of the dermis by loose connective tissue, reduced and
    fragmented elastic fibers, and absence of adnexal structures and
    subcutaneous tissue, resembling membranous aplasia cutis congenita. These
    descriptions come mostly from clinically diagnosed cases across the FFDD
    types.
  biological_scale: TISSUE
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: skin of cheek
    term:
      id: UBERON:0008803
      label: skin of cheek
  evidence:
  - reference: PMID:40231353
    reference_title: "Focal facial dermal dysplasia type IV: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Consistent histologic abnormalities have been observed: atrophy and
      flattening of the epidermis, replacement of the dermis by loose connective
      tissue, reduced elastic tissue with fragmented fibers, and absence of the
      subcutaneous tissues and adnexal structures.
    explanation: >-
      Summary of reported FFDD lesion histology, restated from earlier reports
      in the introduction of a case series.
  downstream:

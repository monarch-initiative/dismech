    explanation: Bitemporal versus preauricular location distinguishes the types.
animal_models:
- name: Cyp26c1 knockout mouse
  species: Mouse
  genotype: Cyp26c1-/-
  publication: PMID:17067568
  description: >-
    Mice lacking CYP26C1 develop without an evident embryonic phenotype;
    combined loss of CYP26A1 and CYP26C1 causes anterior brain truncation and
    loss of migratory cranial neural crest cells. Facial skin is not described
    in the cited abstract.
  modeled_mechanisms:
  - target: Defective Ectodermal Fusion of the Maxillary and Mandibular Prominences
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    limitations: >-
      The single knockout shows no reported developmental defect, consistent
      with redundancy with CYP26A1 in the mouse; whether preauricular skin was
      examined is not stated in the abstract.
    evidence:
    - reference: PMID:17067568
      reference_title: CYP26A1 and CYP26C1 cooperatively regulate anterior-posterior patterning of the developing brain and the production of migratory cranial neural crest cells in the mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Loss of CYP26C1 did not appear to affect embryonic development,
        suggesting that CYP26A1 and CYP26C1 are functionally redundant.
      explanation: The mouse knockout does not show the human fusion-line lesion.
  evidence:
  - reference: PMID:17067568
    reference_title: CYP26A1 and CYP26C1 cooperatively regulate anterior-posterior patterning of the developing brain and the production of migratory cranial neural crest cells in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, Cyp26a1-/-Cyp26c1-/- mice fail to produce migratory cranial
      neural crest cells in the forebrain and midbrain.
    explanation: CYP26C1 function is unmasked only on a Cyp26a1-null background.
- name: Hereford cattle CYP26C1 p.L188P mandibulofacial dysostosis
  species: Cattle
  genotype: CYP26C1 p.L188P homozygous
  publication: PMID:33105751
  description: >-
    A naturally occurring recessive missense CYP26C1 variant in Hereford calves
    causes a shortened or asymmetric mandible with bilateral skin tags caudal to
    the commissure of the lips, along the maxillary-mandibular fusion site.
  modeled_mechanisms:
  - target: Defective Ectodermal Fusion of the Maxillary and Mandibular Prominences
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      The calves have skin tags rather than aplastic scar-like lesions, and a
      mandibular skeletal defect that FFDD4 patients do not show. The catalytic
      effect of p.L188P was predicted, not measured.
    evidence:
    - reference: PMID:33105751
      reference_title: Mandibulofacial Dysostosis Attributed to a Recessive Mutation of CYP26C1 in Hereford Cattle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Affected calves shared hallmark features of a variably shortened and/or
        asymmetric lower mandible and bilateral skin tags present 2-10 cm caudal
        to the commissure of the lips.
      explanation: Skin lesions on the first-arch fusion region in a recessive CYP26C1 model.
  evidence:
  - reference: PMID:33105751
    reference_title: Mandibulofacial Dysostosis Attributed to a Recessive Mutation of CYP26C1 in Hereford Cattle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We postulate that this recessive missense mutation in CYP26C1 impacts the
      catalytic activity of the encoded enzyme, leading to excess RA resulting
      in the observed MD phenotype.
    explanation: The authors attribute the cattle phenotype to excess retinoic acid.
discussions:
- discussion_id: ffdd4_retinoic_acid_mechanism_unverified
  prompt: >-
    Does loss of CYP26C1 cause FFDD4 through excess retinoic acid signaling at
    the maxillary-mandibular fusion line, and why does the Cyp26c1 knockout
    mouse not show the human lesion?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Excess Retinoic Acid Exposure at the Maxillary-Mandibular Fusion Line
  - pathophysiology#Defective Ectodermal Fusion of the Maxillary and Mandibular Prominences
  - animal_models#Cyp26c1 knockout mouse
  rationale: >-
    The chain from CYP26C1 loss to the skin lesion rests on enzyme assays, mouse
    embryonic expression at the fusion line and lesion distribution. Retinoic
    acid levels or signaling have not been measured in patient tissue, and the
    Cyp26c1 single knockout mouse has no reported phenotype, which the authors
    attribute to redundancy with CYP26A1. The only animal with a recessive
    CYP26C1 variant and fusion-line skin lesions is a cattle line whose lesions
    and jaw defect differ from FFDD4. Without a model that reproduces the
    lesion, the retinoic acid excess and fusion-defect steps remain hypotheses.
  evidence:
  - reference: PMID:17067568
    reference_title: CYP26A1 and CYP26C1 cooperatively regulate anterior-posterior patterning of the developing brain and the production of migratory cranial neural crest cells in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of CYP26C1 did not appear to affect embryonic development,
      suggesting that CYP26A1 and CYP26C1 are functionally redundant.
    explanation: The mouse knockout lacks the human phenotype.
histopathology:
- name: Epidermal Atrophy With Loss of Dermal Elastic Tissue and Adnexa
  description: >-
    Atrophic, flattened epidermis; dermis replaced by loose connective tissue;
    reduced, fragmented elastic fibers; absent adnexa and subcutaneous tissue.
    Reported across the FFDD types and resembling membranous aplasia cutis
    congenita.
  evidence:
  - reference: PMID:40231353
    reference_title: "Focal facial dermal dysplasia type IV: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Consistent histologic abnormalities have been observed: atrophy and
      flattening of the epidermis, replacement of the dermis by loose connective
      tissue, reduced elastic tissue with fragmented fibers, and absence of the
      subcutaneous tissues and adnexal structures.
    explanation: Summary of reported FFDD histology in a case-series introduction.
  - reference: ORPHA:398189
    reference_title: Focal facial dermal dysplasia type IV
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0025167 | Fragmented elastic fibers in the dermis | Frequent (79-30%)"
    explanation: Orphanet annotates fragmented dermal elastic fibers.
  notes: >-
    No finding_term is bound: HP:0025167 Fragmented elastic fibers in the dermis
    is outside the HistopathologyFindingTerm enum, and the NCIT term found for
    atrophy (NCIT:C79748 Atrophy) sits under Pathologic Process rather than the
    histopathology result branches the enum allows.

name: Marginal Zone Lymphoma
creation_date: '2026-08-19T12:00:00Z'
category: Neoplastic
description: >
  Marginal zone lymphoma (MZL) is a family of indolent mature B-cell non-Hodgkin
  lymphomas derived from B cells of the marginal zone, the outer compartment of the
  splenic white pulp and of secondary lymphoid follicles. Current classifications
  recognise three distinct entities separated by the anatomical compartment involved:
  extranodal MZL of mucosa-associated lymphoid tissue (MALT lymphoma), splenic MZL,
  and nodal MZL.

  The unifying pathogenic theme is chronic antigenic drive. Sustained stimulation by
  a persistent infection or an autoimmune process selects and expands marginal-zone
  B cells, and the expanded clone subsequently acquires genetic lesions that lock the
  NF-kB pathway into constitutive activity, rendering growth independent of the
  original antigen. Trisomies 3 and 18 and NF-kB deregulation are shared across all
  three entities; the entity-defining lesions are not. Extranodal disease is
  characterised by recurrent translocations that fuse or deregulate the BCL10-MALT1
  axis, whereas splenic and nodal disease instead carry KLF2 and NOTCH2 mutations,
  with deletions of chromosome 7q largely confined to splenic disease. Because that
  antigenic drive is often removable, MZL is one of the few lymphomas in which
  eradicating an infection can itself be the treatment.

  This root entry deliberately carries only what holds for MZL as a family — the
  three-entity axis, the shared antigen-driven and NF-kB-dependent mechanism, the
  aetiological heterogeneity across anatomical sites, and the shared risk of
  histologic transformation to diffuse large B-cell lymphoma. The entity-specific
  genetics, presentation and management are not re-derived here: see
  `MALT_Lymphoma.yaml` and `Splenic_Marginal_Zone_Lymphoma.yaml`, which both already
  declare `marginal zone lymphoma` as a parent. Nodal MZL has no entry yet.
disease_term:
  preferred_term: marginal zone lymphoma
  term:
    id: MONDO:0017604
    label: marginal zone lymphoma
synonyms:
- MZL
- marginal zone B-cell lymphoma
categories:
- Hematologic Malignancy
- B-cell Neoplasm
- Non-Hodgkin Lymphoma
parents:
- B-cell non-Hodgkin lymphoma
- mature B-cell neoplasm

has_subtypes:
- name: Extranodal MZL
  display_name: Extranodal Marginal Zone Lymphoma of MALT Type (MALT Lymphoma)
  classification: anatomic
  description: >-
    The most common of the three entities. Arises at extranodal mucosal and glandular
    sites that have acquired lymphoid tissue in response to chronic infection or
    autoimmune inflammation — stomach (Helicobacter pylori), ocular adnexa, lung,
    salivary gland, thyroid, skin and small intestine. Defined among the MZLs by
    recurrent translocations that activate NF-kB, most notably
    t(11;18)(q21;q21)/BIRC3::MALT1. Fully curated in `MALT_Lymphoma.yaml`.
  subtype_term:
    preferred_term: MALT lymphoma
    term:
      id: MONDO:0007650
      label: MALT lymphoma
- name: Splenic MZL
  display_name: Splenic Marginal Zone Lymphoma
  classification: anatomic
  description: >-
    Arises in the marginal zone of the splenic white pulp and presents with
    splenomegaly, circulating villous lymphocytes, cytopenias and bone marrow
    involvement rather than lymphadenopathy. Lacks the MALT translocations and instead
    carries NOTCH2 and KLF2 mutations and deletions of 7q. Associated with chronic
    hepatitis C virus infection in a subset. Fully curated in
    `Splenic_Marginal_Zone_Lymphoma.yaml`.
  subtype_term:
    preferred_term: splenic marginal zone lymphoma
    term:
      id: MONDO:0019462
      label: splenic marginal zone lymphoma
- name: Nodal MZL
  display_name: Nodal Marginal Zone B-Cell Lymphoma
  classification: anatomic
  description: >-
    Primary nodal disease without extranodal or splenic involvement, and the least
    well characterised of the three. Shares the KLF2/NOTCH2 mutational profile with
    splenic MZL but not the 7q deletions, and occurs at a slightly older median age
    than extranodal disease. No dismech entry yet; it is a candidate member of the
    `B-Cell_Non-Hodgkin_Lymphoma` grouping once curated.
  subtype_term:
    preferred_term: nodal marginal zone B-cell lymphoma
    term:
      id: MONDO:0019465
      label: nodal marginal zone B-cell lymphoma


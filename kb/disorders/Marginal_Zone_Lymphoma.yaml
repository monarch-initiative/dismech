    explanation: >-
      Same population-based series; nodal MZL accounted for the smaller share of cases.

pathophysiology:
- name: Chronic Antigenic Stimulation of Marginal Zone B Cells
  conforms_to: "tumor_promoting_inflammation#Chronic Inflammatory Stimulus"
  biological_scale: TISSUE
  role: trigger
  description: >-
    The initiating step across the MZL family is sustained, non-resolving antigenic
    drive rather than a germline lesion. A persistent infection (Helicobacter pylori
    in the stomach, hepatitis C virus in splenic disease, Chlamydia psittaci in the
    ocular adnexa) or a chronic autoimmune process (Sjogren syndrome, Hashimoto
    thyroiditis) maintains a reactive marginal-zone B-cell population at the affected
    site. This is the step that makes MZL aetiologically heterogeneous by anatomical
    location: which organism or autoimmune process supplies the drive differs by site,
    while the resulting selection pressure on marginal-zone B cells does not.
  cell_types:
  - preferred_term: marginal zone B cell
    term:
      id: CL:0000845
      label: marginal zone B cell of spleen
  biological_processes:
  - preferred_term: B cell activation
    term:
      id: GO:0042113
      label: B cell activation
    modifier: INCREASED
    temporality: CHRONIC
  evidence:
  - reference: PMID:41026919
    reference_title: >-
      The biology of marginal zone lymphoma subtypes: challenge and relevance of
      classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Etiopathogenesis is strongly linked to chronic antigenic stimulation and specific infections or autoimmune disorders for extranodal disease."
    explanation: >-
      States the antigen-driven aetiology directly, and scopes the infection/autoimmune
      link to extranodal disease rather than asserting it uniformly across all three
      entities.
  - reference: PMID:24417667
    reference_title: >-
      Incidence of marginal zone lymphoma in the United States, 2001-2009 with a focus
      on primary anatomic site.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common extranodal sites were stomach (IR\u00a0=\u00a03\u00b78), spleen (IR\u00a0=\u00a01\u00b76), eye/adnexa (IR\u00a0=\u00a01\u00b74), and lung, skin, and salivary glands (IRs\u00a0=\u00a00\u00b79-1\u00b70)."
    explanation: >-
      The site distribution is the epidemiological footprint of site-specific antigenic
      drive — the stomach leads, consistent with H. pylori being the best-characterised
      driver.
  downstream:
  - target: Deregulation of Marginal Zone B-Cell Differentiation Signalling
    causal_link_type: DIRECT
    description: >-
      Sustained antigen and toll-like-receptor engagement acts on the same signalling
      pathways that physiologically specify marginal-zone B-cell identity, so the
      pathways under chronic load are precisely the ones later found mutated.
    evidence:
    - reference: PMID:28288716
      reference_title: Molecular pathogenesis of splenic and nodal marginal zone lymphoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Consistent with the physiological involvement of NOTCH, NF-\u03baB, B-cell receptor and toll-like receptor signaling in mature B-cells differentiation into the marginal zone B-cells, many oncogenic mutations of genes involved in these pathways have been identified in SMZL and NMZL."
      explanation: >-
        Makes the link explicit: the oncogenic mutations fall in the NOTCH, NF-kB, BCR
        and TLR pathways that normally drive marginal-zone B-cell differentiation.

- name: Deregulation of Marginal Zone B-Cell Differentiation Signalling
  biological_scale: MOLECULAR
  role: intermediate
  description: >-
    The expanded clone acquires lesions in the NOTCH, B-cell-receptor and Toll-like
    receptor pathways that normally specify marginal-zone B-cell identity. This is
    where the three entities diverge: extranodal disease acquires translocations
    engaging the BCL10-MALT1 axis, while splenic and nodal disease acquire KLF2 and
    NOTCH2 mutations, with 7q deletion largely restricted to splenic disease. The
    entity-specific detail is held in the member entries; what belongs at the root is
    that all three routes converge on the next node.
  genes:
  - preferred_term: NOTCH2
    term:
      id: hgnc:7882
      label: NOTCH2
  - preferred_term: KLF2
    term:
      id: hgnc:6347
      label: KLF2
  - preferred_term: MALT1
    term:
      id: hgnc:6819
      label: MALT1
  - preferred_term: BCL10
    term:
      id: hgnc:989
      label: BCL10
  evidence:
  - reference: PMID:29657712
    reference_title: Recent advances in understanding the biology of marginal zone lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although trisomies of chromosomes 3 and 18, deletions at 6q23, deregulation of nuclear factor kappa B, and chromatin remodeling genes are frequent events in all of them, the three MZLs differ in the presence of recurrent translocations, mutations affecting the NOTCH pathway, and the transcription factor Kruppel like factor 2 ( KLF2) or the receptor-type protein tyrosine phosphatase delta ( PTPRD)."
    explanation: >-
      The load-bearing shared-versus-distinct statement for this entry: trisomies 3/18,
      6q23 deletion and NF-kB deregulation are common to all three, while
      translocations, NOTCH-pathway mutations, KLF2 and PTPRD separate them.
  - reference: PMID:28288716
    reference_title: Molecular pathogenesis of splenic and nodal marginal zone lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with the physiological involvement of NOTCH, NF-\u03baB, B-cell receptor and toll-like receptor signaling in mature B-cells differentiation into the marginal zone B-cells, many oncogenic mutations of genes involved in these pathways have been identified in SMZL and NMZL."
    explanation: >-
      Independent statement that the mutated pathways are the physiological
      marginal-zone differentiation pathways.
  downstream:
  - target: Constitutive NF-kB Pathway Activation
    causal_link_type: DIRECT
    description: >-
      Each of the entity-specific lesion classes converges on constitutive NF-kB
      signalling, which is why NF-kB activation is a hallmark of the family rather than
      of any one entity.
    evidence:
    - reference: PMID:41026919
      reference_title: >-
        The biology of marginal zone lymphoma subtypes: challenge and relevance of
        classification.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic hallmarks include constitutive NF-\u03baB activation and common trisomies 3 and 18, alongside subtype-specific lesions such as translocations in extranodal MZL, recurrent KLF2/NOTCH2 mutations in both nodal and splenic MZL, and deletions involving chromosome 7q, predominantly observed in splenic MZL."
      explanation: >-
        Names constitutive NF-kB activation as a genetic hallmark shared across MZL,
        alongside the subtype-specific lesions that produce it.

- name: Constitutive NF-kB Pathway Activation
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    The convergent, rate-limiting node of the family. Once NF-kB signalling is
    constitutively active, survival and proliferation of the marginal-zone-derived
    clone no longer require the original antigenic stimulus. This is the mechanistic
    reason antimicrobial eradication works only in antigen-dependent disease and fails
    once a translocation such as t(11;18) has been acquired.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:41026919
    reference_title: >-
      The biology of marginal zone lymphoma subtypes: challenge and relevance of
      classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic hallmarks include constitutive NF-\u03baB activation and common trisomies 3 and 18, alongside subtype-specific lesions such as translocations in extranodal MZL, recurrent KLF2/NOTCH2 mutations in both nodal and splenic MZL, and deletions involving chromosome 7q, predominantly observed in splenic MZL."
    explanation: >-
      Establishes constitutive NF-kB activation as a shared genetic hallmark of MZL.
  - reference: PMID:29657712
    reference_title: Recent advances in understanding the biology of marginal zone lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although trisomies of chromosomes 3 and 18, deletions at 6q23, deregulation of nuclear factor kappa B, and chromatin remodeling genes are frequent events in all of them, the three MZLs differ in the presence of recurrent translocations, mutations affecting the NOTCH pathway, and the transcription factor Kruppel like factor 2 ( KLF2) or the receptor-type protein tyrosine phosphatase delta ( PTPRD)."
    explanation: >-
      Independently lists NF-kB deregulation among the events frequent in all three
      MZL entities.
  downstream:
  - target: Histologic Transformation to Diffuse Large B-Cell Lymphoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A minority of cases accumulate further lesions in cell-cycle, NF-kB and
      epigenetic regulators and transform to an aggressive large-cell lymphoma. The
      edge is indirect: constitutive NF-kB signalling sustains the clone in which those
      additional lesions accumulate, but is not by itself sufficient for transformation.
    evidence:
    - reference: PMID:41026919
      reference_title: >-
        The biology of marginal zone lymphoma subtypes: challenge and relevance of
        classification.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transformation to aggressive diffuse large B-cell lymphoma occurs in 3% to 15% of cases and is associated with the accumulation of genetic lesions, particularly in cell cycle, NF-\u03baB, and epigenetic regulators, with subtype-specific drivers including TNFAIP3, TP53, and CDKN2A/B alterations."
      explanation: >-
        Quantifies transformation risk across MZL and attributes it to accumulated
        lesions in cell-cycle, NF-kB and epigenetic regulators.

- name: Histologic Transformation to Diffuse Large B-Cell Lymphoma
  biological_scale: TISSUE
  role: consequence
  description: >-
    Transformation of indolent MZL to diffuse large B-cell lymphoma occurs in a
    minority of patients and is the main route by which an otherwise indolent disease
    becomes rapidly life-threatening. Reported drivers include TNFAIP3, TP53 and
    CDKN2A/B alterations, which differ by entity.
  genes:
  - preferred_term: TNFAIP3
    term:
      id: hgnc:11896
      label: TNFAIP3
  evidence:
  - reference: PMID:41026919
    reference_title: >-
      The biology of marginal zone lymphoma subtypes: challenge and relevance of
      classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transformation to aggressive diffuse large B-cell lymphoma occurs in 3% to 15% of cases and is associated with the accumulation of genetic lesions, particularly in cell cycle, NF-\u03baB, and epigenetic regulators, with subtype-specific drivers including TNFAIP3, TP53, and CDKN2A/B alterations."
    explanation: >-
      Gives both the frequency range and the lesion classes associated with
      transformation.

phenotypes:
- category: Clinical
  name: Splenomegaly
  description: >-
    Enlargement of the spleen, the dominant presenting finding in splenic MZL and a
    variable finding in the other entities.
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly
- category: Clinical
  name: Lymphadenopathy
  description: >-
    Lymph node enlargement, definitional for nodal MZL and characteristically absent or
    minimal in splenic MZL.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy

treatments:
- name: Helicobacter pylori Eradication Therapy
  description: >-
    Antibiotic eradication of Helicobacter pylori in gastric MALT lymphoma. Removing
    the organism removes the antigenic drive, and early-stage disease commonly
    regresses without cytotoxic therapy. Effective only while the clone remains
    antigen-dependent: t(11;18)/BIRC3::MALT1-positive disease has already escaped
    antigen dependence and does not respond, which is why the translocation is
    tested for before relying on eradication alone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Chronic Antigenic Stimulation of Marginal Zone B Cells
    treatment_effect: INHIBITS
    description: >-
      Eradicating the organism removes the antigenic stimulus at the trigger node,
      so the intervention acts upstream of the tumour clone rather than on it.
    evidence:
    - reference: PMID:39891871
      reference_title: "Advances in the Pathogenesis, Diagnosis, Treatment, and Prognosis of Marginal Zone Lymphoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Testing for infectious agents like Helicobacter pylori or Hepatitis C virus should be standard practice, as eradication therapy offers a targeted, less toxic, and effective option in select patients."
      explanation: >-
        States that testing for H. pylori is standard practice precisely because
        eradication is itself a targeted and effective treatment in selected
        patients.
  evidence:
  - reference: PMID:39891871
    reference_title: "Advances in the Pathogenesis, Diagnosis, Treatment, and Prognosis of Marginal Zone Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing for infectious agents like Helicobacter pylori or Hepatitis C virus should be standard practice, as eradication therapy offers a targeted, less toxic, and effective option in select patients."
    explanation: >-
      Supports H. pylori eradication as a targeted, less toxic first-line option
      in infection-associated MZL.
- name: Hepatitis C Virus Antiviral Therapy
  description: >-
    Direct-acting antiviral treatment of chronic hepatitis C virus infection in
    HCV-associated splenic MZL. Clearing the virus can induce lymphoma regression
    by the same logic as H. pylori eradication in gastric MALT lymphoma:
    withdrawal of the chronic antigenic drive rather than cytotoxicity against
    the clone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
  target_mechanisms:
  - target: Chronic Antigenic Stimulation of Marginal Zone B Cells
    treatment_effect: INHIBITS
    description: >-
      Viral clearance removes the sustained antigenic stimulus maintaining the
      marginal-zone B-cell population, acting at the trigger node.
    evidence:
    - reference: PMID:39891871
      reference_title: "Advances in the Pathogenesis, Diagnosis, Treatment, and Prognosis of Marginal Zone Lymphoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Testing for infectious agents like Helicobacter pylori or Hepatitis C virus should be standard practice, as eradication therapy offers a targeted, less toxic, and effective option in select patients."
      explanation: >-
        States that testing for hepatitis C virus is standard practice because
        eradication therapy is an effective targeted option in selected
        patients.
  evidence:
  - reference: PMID:39891871
    reference_title: "Advances in the Pathogenesis, Diagnosis, Treatment, and Prognosis of Marginal Zone Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing for infectious agents like Helicobacter pylori or Hepatitis C virus should be standard practice, as eradication therapy offers a targeted, less toxic, and effective option in select patients."
    explanation: >-
      Supports antiviral eradication as a targeted, less toxic first-line option
      in HCV-associated MZL.

discussions:
- discussion_id: mzl_three_entity_lump_split
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Deregulation of Marginal Zone B-Cell Differentiation Signalling"
  prompt: >-
    Is the three-entity division of marginal zone lymphoma a division of distinct
    diseases, or three anatomical presentations of one antigen-driven process that
    differ mainly in which secondary lesion the clone happens to acquire?
  rationale: >-
    The entities share a cell of origin, a shared aetiological mechanism (chronic
    antigenic drive), a shared convergent effector (constitutive NF-kB activation), and
    a shared set of background lesions (trisomies 3 and 18, 6q23 deletion). They are
    separated by secondary lesions and by anatomical compartment. This is exactly the
    configuration in which the dismech lump/split question is undecided, and the
    classification literature itself frames it as an open challenge rather than a
    settled nosology. The practical consequence is not cosmetic: it determines whether
    a shared pathograph at this root, or three independent pathographs, is the honest
    representation.
  evidence:
  - reference: PMID:41026919
    reference_title: >-
      The biology of marginal zone lymphoma subtypes: challenge and relevance of
      classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They share some features, but differ significantly in clinical presentation, associated inflammatory conditions, anatomic sites of involvement, and molecular alterations."
    explanation: >-
      The review's own framing — a heterogeneous group that shares features but differs
      significantly — is the statement of the open question, not its resolution.

notes: >
  Scope. This is a thin root entry over an already-populated subtree. `MALT_Lymphoma.yaml`
  and `Splenic_Marginal_Zone_Lymphoma.yaml` both already declare `marginal zone lymphoma`
  as a parent but had nothing to point at; this entry binds MONDO:0017604 and carries the
  family-level mechanism once. Entity-specific genetics, staging and management stay in the
  member entries.

  Relationship to the B-Cell NHL grouping. `kb/groupings/B-Cell_Non-Hodgkin_Lymphoma.yaml`
  lists MALT lymphoma and splenic MZL as flat DISEASE members and names nodal MZL as a
  candidate member. That grouping and this root are complementary, not redundant: the
  grouping is an auditable union over curated entries, while this entry is the disease
  concept MONDO:0017604 itself, carrying the shared pathograph. No attempt has been made
  here to restructure the grouping.

  Nodal MZL has no dismech entry. It is modelled here only as a `has_subtypes` entry bound
  to MONDO:0019465; the KLF2/NOTCH2 statement about it rests on the cited reviews rather
  than on a curated entry of its own.

  Deliberately omitted. Splenic diffuse red pulp small B-cell lymphoma (MONDO:0017599) is a
  MONDO child of marginal zone lymphoma but is a separate provisional entity in the WHO
  classification and is not curated as a subtype here. Primary cutaneous MZL is likewise
  left to the extranodal entry.

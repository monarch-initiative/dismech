discussions:
- discussion_id: gap_unc13a_movement_vs_seizure_circuits
  prompt: >-
    Which neural circuits (basal ganglia motor loops versus cortical networks) and
    which component of the presynaptic release deficit (evoked phasic release,
    spontaneous/tonic release, or short-term plasticity) drive the prominent
    hyperkinetic movement disorder versus the seizures in dominant UNC13A syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Synaptic Circuit Dysregulation
  rationale: >-
    UNC13A syndrome couples a hyperkinetic movement disorder (tremor and
    dyskinetic movements) with seizures, yet Munc13-1 sets neurotransmitter release
    probability and short-term plasticity broadly across synapse types. It is
    unresolved why the phenotype partitions into a motor/basal-ganglia component and
    a cortical seizure component, and whether gain-of-function (type B) and
    dysregulatory (type C) variants weight excitatory versus inhibitory circuits
    differently. Resolving this would clarify why movement abnormalities are so
    prominent rather than a purely epileptic presentation.
  evidence:
  - reference: PMID:41125872
    reference_title: "Pathogenic UNC13A variants cause a neurodevelopmental syndrome by impairing synaptic function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      seizures of different types, tremor and dyskinetic movements
    explanation: >-
      Establishes that the movement disorder and seizures co-occur in the same
      syndrome, which is the phenomenon whose circuit basis remains open.
  proposed_experiments:
  - experiment_id: exp_unc13a_circuit_resolved_release_mapping
    name: Circuit-resolved presynaptic release mapping for UNC13A variants
    description: >-
      In cortical and striatal (basal ganglia) neuronal preparations expressing
      type B gain-of-function and type C dysregulatory UNC13A variants, measure
      evoked phasic release, spontaneous release, and short-term plasticity at
      excitatory and inhibitory synapses, and correlate release changes with
      network-level excitability and motor-circuit output.
    experiment_type:
      preferred_term: circuit-resolved synaptic physiology experiment
    perturbations:
    - name: UNC13A variant expression by circuit
      target: pathophysiology#Synaptic Circuit Dysregulation
      genes:
      - preferred_term: UNC13A
        term:
          id: hgnc:23150
          label: UNC13A
      description: >-
        Express matched type B and type C UNC13A variants in cortical versus
        striatal neuronal populations against wild-type controls.
    readouts:
    - name: Evoked and spontaneous release with short-term plasticity
      target: pathophysiology#Synaptic Circuit Dysregulation
      biological_processes:
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: ABNORMAL

- discussion_id: gap_unc13a_entity_delineation_type_bc
  prompt: >-
    Are the dominant movement-predominant UNC13A disorder (types B/C) and the
    separately curated congenital UNC13A NDD with epilepsy one nosological entity,
    and do Munc13-1 functional domain (C2/MUN) and variant functional class
    (gain-of-function, dysregulation, or loss-of-function) segregate
    movement-predominant from epilepsy-predominant presentations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Gain-of-Function Neurotransmission
  - pathophysiology#Impaired Second Messenger Regulation of Neurotransmission
  rationale: >-
    This entry captures the dominant type B (gain-of-function) and type C
    (dysregulatory) UNC13A subtypes, while the biallelic loss-of-function congenital
    presentation is curated separately. The three-subtype (A-C) genotype-function
    classification is recent, and it remains open whether types B and C are truly
    distinct disorders, whether they should be lumped, and where the boundary with
    the congenital loss-of-function entity lies. Whether variant location in
    specific Munc13-1 domains predicts a movement-predominant versus
    epilepsy-predominant course is not established and bears directly on how these
    entries should be split or merged.
  evidence:
  - reference: PMID:41125872
    reference_title: "Pathogenic UNC13A variants cause a neurodevelopmental syndrome by impairing synaptic function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on a strong genotype-phenotype-functional correlation, we classify three
      UNC13A syndrome subtypes (types A-C).
    explanation: >-
      The A-C subtype scheme is the basis for splitting the dominant (B/C) from the
      congenital (A) entities; whether these are truly separate disorders is the
      open nosological question.
  proposed_experiments:
  - experiment_id: exp_unc13a_domain_phenotype_correlation
    name: Munc13-1 domain-resolved variant-function-phenotype correlation
    description: >-
      Assemble reported pathogenic UNC13A variants annotated by Munc13-1 domain
      (C2A, calmodulin-binding, C1, C2B, MUN, C2C) and functional class, measure
      each variant's effect on regulated release in a shared assay, and test whether
      domain and functional class predict movement-predominant versus
      epilepsy-predominant clinical course across the type A/B/C spectrum.
    experiment_type:
      preferred_term: genotype-phenotype correlation experiment
    perturbations:
    - name: Domain-annotated UNC13A variant panel
      target: pathophysiology#Impaired Second Messenger Regulation of Neurotransmission
      genes:
      - preferred_term: UNC13A
        term:
          id: hgnc:23150
          label: UNC13A
      description: >-
        Express a panel of UNC13A variants stratified by Munc13-1 domain and
        functional class against wild-type controls.
    readouts:
    - name: Regulated release phenotype by variant class
      target: pathophysiology#Impaired Second Messenger Regulation of Neurotransmission
      biological_processes:
      - preferred_term: regulation of synaptic vesicle exocytosis
        term:
          id: GO:2000300
          label: regulation of synaptic vesicle exocytosis
        modifier: ABNORMAL
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL
      assays:
      - preferred_term: patch-clamp electrophysiology
      direction: POSITIVE
    controls:
    - name: Wild-type UNC13A
      description: Wild-type UNC13A in the same assay background.
    - name: Benign population variants

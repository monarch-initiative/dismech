- discussion_id: gap_unc13a_human_model_fidelity
  prompt: >-
    Do heterologous mouse-hippocampal-neuron and C. elegans variant-expression
    assays faithfully model the human movement-and-seizure phenotype of dominant
    UNC13A syndrome, given that constitutive Munc13-1 loss abolishes neurotransmitter
    release and precludes a viable whole-animal behavioral model?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Gain-of-Function Neurotransmission
  - pathophysiology#Synaptic Circuit Dysregulation
  rationale: >-
    The mechanistic evidence for gain-of-function and dysregulatory UNC13A variants
    comes from expressing the variants in mouse hippocampal neurons and in C.
    elegans, which measure single-synapse release changes in reduced heterologous
    systems rather than human motor and cortical circuit behavior. Constitutive
    Munc13-1 null animals are perinatally lethal with abolished glutamatergic
    transmission, so a complete-loss whole-animal model cannot recapitulate a viable
    movement-and-seizure disorder. Whether these assays translate to the
    human-specific circuit phenotype is therefore open, and patient iPSC-derived
    neurons/assembloids and humanized knock-in or hypomorphic models are needed to
    test fidelity.
  evidence:
  - reference: PMID:41125872
    reference_title: "Pathogenic UNC13A variants cause a neurodevelopmental syndrome by impairing synaptic function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using assays with expression of UNC13A variants in mouse hippocampal neurons
      and in Caenorhabditis elegans, we identify three mechanisms of pathogenicity
    explanation: >-
      Documents that the causal mechanism was established in mouse-neuron and
      C. elegans expression assays, the reduced systems whose fidelity to the human
      movement-and-seizure phenotype is the open question.
  proposed_experiments:
  - experiment_id: exp_unc13a_patient_ipsc_neuron_release
    name: Patient iPSC-derived neuron and assembloid release/network experiment
    description: >-
      Generate patient-derived or CRISPR-engineered isogenic human iPSC neurons and
      cortico-striatal assembloids carrying type B and type C UNC13A variants and
      corrected alleles, and compare regulated neurotransmitter release, short-term
      plasticity, and network activity against the mouse and C. elegans assay
      results to test whether the heterologous findings reproduce in human tissue.
    experiment_type:
      preferred_term: patient iPSC-derived neuron functional experiment
    model_systems:
    - name: UNC13A human iPSC-derived neuron and cortico-striatal assembloid
      description: >-

review_notes: Grange syndrome is an extremely rare autosomal recessive disorder with fewer than two dozen molecularly confirmed cases reported internationally. The phenotype demonstrates marked variability, particularly regarding cognitive/developmental involvement and the penetrance of congenital cardiac anomalies. Early-onset renovascular hypertension due to fibromuscular dysplasia-like renal artery stenosis is characteristic. Biallelic YY1AP1 loss-of-function variants include nonsense, frameshift, splice-altering, missense, and intragenic deletion alleles that disrupt INO80 chromatin remodeling and vascular smooth muscle homeostasis.

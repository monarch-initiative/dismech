name: Grange syndrome
creation_date: '2026-01-06T15:20:41Z'
description: >-
  A rare autosomal recessive disorder caused by biallelic loss-of-function
  mutations in YY1AP1, characterized by early-onset fibromuscular
  dysplasia-like panvascular disease with multifocal stenosis or occlusion of
  cerebral, renal, abdominal, and coronary arteries, variable learning
  difficulties or developmental delay, mild facial dysmorphism, and acral
  anomalies (brachydactyly, syndactyly). Renovascular hypertension is common,
  and congenital cardiac defects (such as patent ductus arteriosus), aortic
  regurgitation, and bone fragility occur with variable penetrance. YY1AP1
  deficiency disrupts the INO80 chromatin-remodeling complex, leading to
  p21/CDKN1A-mediated cell-cycle arrest and impaired TGF-beta-driven
  differentiation of vascular smooth muscle cells.
category: Genetic
parents:
- Vascular disease
synonyms:
- Grange-Brouzès syndrome
- grange occlusive arterial syndrome
- progressive arterial occlusive disease-hypertension-heart defects-bone fragility-brachysyndactyly syndrome
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      Grange syndrome presents primarily with severe early-onset multifocal
      non-atherosclerotic arterial stenosis/occlusion (resembling fibromuscular
      dysplasia) and renovascular hypertension.
    evidence:
    - reference: PMID:27939641
      reference_title: "Loss-of-Function Mutations in YY1AP1 Lead to Grange Syndrome and a Fibromuscular Dysplasia-Like Vascular Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Grange syndrome is an autosomal-recessive condition characterized by
        severe and early-onset vascular disease similar to FMD and variable
        penetrance of brachydactyly, syndactyly, bone fragility, and learning
        disabilities.
      explanation: >-
        Establishes early-onset fibromuscular dysplasia-like arterial disease as
        the defining clinical manifestation of Grange syndrome.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Monogenic autosomal recessive multisystem malformation and vasculopathy
      syndrome caused by biallelic germline loss-of-function variants in YY1AP1.
    evidence:
    - reference: PMID:27939641
      reference_title: "Loss-of-Function Mutations in YY1AP1 Lead to Grange Syndrome and a Fibromuscular Dysplasia-Like Vascular Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Exome-sequencing analysis of DNA from three affected siblings with
        Grange syndrome identified compound heterozygous nonsense variants in
        YY1AP1, and homozygous nonsense or frameshift YY1AP1 variants were
        subsequently identified in additional unrelated probands with Grange
        syndrome.
      explanation: >-
        Confirms autosomal recessive monogenic etiology due to biallelic YY1AP1
        loss-of-function variants.

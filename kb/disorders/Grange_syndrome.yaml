pathophysiology:
- name: YY1AP1 Loss-of-Function and INO80 Chromatin Remodeling Complex Disruption
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function mutations in YY1AP1 abrogate nuclear YY1
    coactivator activity and disrupt the INO80 ATP-dependent chromatin-remodeling
    complex, impairing transcriptional regulation and DNA maintenance programs
    essential for vascular smooth muscle homeostasis.
  gene:
    preferred_term: YY1AP1
    term:
      id: hgnc:30935
      label: YY1AP1
  molecular_functions:
  - preferred_term: YY1 transcription coactivator activity
    term:
      id: GO:0003713
      label: transcription coactivator activity
    modifier: DECREASED
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: DECREASED
  - preferred_term: transcriptional regulation
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  evidence:
  - reference: PMID:27939641
    reference_title: "Loss-of-Function Mutations in YY1AP1 Lead to Grange Syndrome and a Fibromuscular Dysplasia-Like Vascular Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      YY1AP1 encodes yin yang 1 (YY1)-associated protein 1 and is an activator
      of the YY1 transcription factor. We determined that YY1AP1 localizes to
      the nucleus and is a component of the INO80 chromatin remodeling complex,
      which is responsible for transcriptional regulation, DNA repair, and
      replication.
    explanation: >-
      Establishes YY1AP1 as a nuclear YY1 transcriptional activator and
      subunit of the INO80 chromatin-remodeling complex.
  downstream:
  - target: Vascular Smooth Muscle p21 Upregulation and Cell-Cycle Arrest
    description: >-
      Loss of YY1AP1-INO80 function induces p21/WAF/CDKN1A upregulation and
      cell-cycle arrest in vascular smooth muscle cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27939641
      reference_title: "Loss-of-Function Mutations in YY1AP1 Lead to Grange Syndrome and a Fibromuscular Dysplasia-Like Vascular Disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of YY1AP1 in vascular smooth muscle cells leads to cell cycle arrest with decreased proliferation and increased levels of the cell cycle regulator p21/WAF/CDKN1A and disrupts TGF-β-driven differentiation of smooth muscle cells."
      explanation: >-
        Demonstrates that YY1AP1 loss directly induces p21/CDKN1A elevation and
        cell-cycle arrest in cultured vascular smooth muscle cells.
  - target: Impaired TGF-Beta-Driven Smooth Muscle Differentiation
    description: >-
      Loss of YY1AP1 disrupts TGF-beta-mediated contractile differentiation of
      vascular smooth muscle cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27939641
      reference_title: "Loss-of-Function Mutations in YY1AP1 Lead to Grange Syndrome and a Fibromuscular Dysplasia-Like Vascular Disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of YY1AP1 in vascular smooth muscle cells leads to cell cycle arrest with decreased proliferation and increased levels of the cell cycle regulator p21/WAF/CDKN1A and disrupts TGF-β-driven differentiation of smooth muscle cells."
      explanation: >-
        Demonstrates that YY1AP1 loss directly impairs TGF-beta-driven smooth
        muscle differentiation.

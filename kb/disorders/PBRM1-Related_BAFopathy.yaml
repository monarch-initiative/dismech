discussions:
- discussion_id: hmm_pbrm1_mouse_mechanism_without_human_disease
  prompt: >-
    Does the microglial PBRM1 to CCL5 to CCR1/5 to beta-catenin mechanism worked out in mice operate
    in any human, given that PBRM1 is not yet established as a human disease gene?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Derepression of CCL5 in Microglia
  - pathophysiology#CCR1 and CCR5 Signalling to Beta-Catenin in Neural Progenitors
  - pathophysiology#Excessive Neurogenesis
  - genetic#PBRM1
  rationale: >-
    This entry is unusual in that its mechanism is better evidenced than its disease. The mouse chain
    is detailed, internally consistent and supported by a pharmacological rescue. The human side runs
    both ways and is thin in both directions. For it: the reported patient's splice variant arose de
    novo, PBRM1 was selected on predicted loss-of-function intolerance, and further de novo PBRM1
    variants are recorded in DDD and denovo-db. Against it: that variant was never tested by RNA
    study, a 31,058-trio analysis did not find PBRM1 significantly associated, and predicted
    loss-of-function variants were no more abundant in the patient cohort than in gnomAD, while the
    reporting study calls PBRM1 a candidate rather than a confirmed gene. So the question is not
    whether the mouse mechanism is real but whether it has a human counterpart at all. Resolving it
    needs more patients with unambiguous PBRM1 loss-of-function alleles, and an RNA study of the
    reported splice variant.
  evidence:
  - reference: PMID:34906496
    reference_title: Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further mechanistic and phenotypic characterization of additional patients are warranted to
      confirm their roles in human disease and to delineate their associated phenotypic spectrums.
    explanation: The authors themselves state that the candidacy is not yet confirmed.
  - reference: PMID:34906496
    reference_title: Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, the lack of RNA studies for the predicted splicing altering variant in PBRM1 obscured
      a clear understanding of the biological significance of this variation.
    explanation: >-
      Names the specific human experiment that would move this question, which is what this
      discussion says is missing. On the gene row the same sentence read as support for the
      gene-disease claim while actually describing a gap in it.
notes: >-
  This entry records a proposed disease, not an established one, and is written so that the state of
  the evidence is readable off the entry rather than having to be reconstructed. The genetic row is
  DISPUTED with both the supporting and the opposing evidence attached, the single variant is
  UNCERTAIN_SIGNIFICANCE, and every model link carries fidelity UNKNOWN rather than a tier that would
  imply a known relationship to human disease.

  No phenotype is recorded from a described patient. The exome reanalysis that proposed PBRM1 does
  not give a phenotype for its single PBRM1 patient in the text consulted, so the one phenotype here
  is bound from the model and the ASD risk-factor literature and marked INDIRECT.

  A germline PBRM1 loss-of-function family with renal cell carcinoma predisposition is described in
  the deep-research report and is deliberately not used here. That is a different disease from the
  proposed neurodevelopmental one, and folding it in would merge two gene-disease claims with
  different evidence into one record.

  No GeneReviews chapter covers PBRM1 or this disease. No ClinGen gene-disease validity record
  exists for the pair, so gene_disease_validity is absent rather than empty.

  PBRM1 is far better known as a somatic tumour suppressor in clear cell renal cell carcinoma, and a
  PubMed search for the gene returns mostly that literature. Nothing from the renal cancer work is
  used here: somatic driver biology in a tumour is a different claim from a germline
  neurodevelopmental mechanism, and conflating them is how a thin gene-disease pair acquires borrowed
  support it has not earned.

  The mouse gene identifier was read from the Ensembl cross-reference for ENSMUSG00000042323, which
  returns MGI:1923998 with symbol Pbrm1.

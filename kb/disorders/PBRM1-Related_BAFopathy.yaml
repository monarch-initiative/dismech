    further characterisation, and note that the lack of significance may reflect the methods and the
    cohort, which is why the opposing results do not make this REFUTED. No ClinGen gene-disease validity record exists for this pair. A
    DISPUTED row emits no gene-to-disease edge in the KGX export, which is the intended behaviour
    here.

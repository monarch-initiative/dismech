    reference_title: PBRM1 Deficiency in Microglia Leads to Excessive Neurogenesis and Autism-Like Behaviors via the CCL5-CCR1/5-β-catenin Signaling Axis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Missense mutations in Polybromo 1 (Pbrm1), a core component of the SWI/SNF (switch/sucrose

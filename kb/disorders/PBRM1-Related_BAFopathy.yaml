name: PBRM1-Related BAFopathy
creation_date: "2026-11-18T11:48:17Z"
category: Mendelian
description: >-
  PBRM1-related BAFopathy is a proposed, not established, neurodevelopmental disorder. PBRM1 encodes
  BAF180, the defining subunit of the PBAF form of the BAF chromatin-remodelling complex, and other
  BAF subunits cause well-characterised BAFopathies such as Coffin-Siris and Nicolaides-Baraitser
  syndromes. The human evidence runs both ways and is thin in both
  directions. For: one patient carrying a de novo heterozygous predicted splice-altering variant,
  selection of PBRM1 on its intolerance to loss of function, and further de novo PBRM1 variants
  recorded in DDD and denovo-db. Against: that variant was never tested by RNA study, a 31,058-trio
  developmental disorder study did not find PBRM1 significantly associated, and predicted
  loss-of-function variants were no more abundant in the patient cohort than in gnomAD. The
  reporting authors call PBRM1 a candidate gene rather than a confirmed one, and add that the lack
  of significance may reflect the methods and cohort used. Against that, a conditional knockout of
  Pbrm1 in mouse microglia produces a detailed and internally consistent mechanism: loss of PBRM1
  derepresses Ccl5, the released CCL5 drives neural stem and progenitor cells through CCR1 and CCR5
  to beta-catenin signalling, neurogenesis becomes excessive, and the mice show autism-like
  behaviour that blocking CCR1 and CCR5 reverses. This entry records both: a mechanism worked out in
  mice, and a human gene-disease relationship that is still open.

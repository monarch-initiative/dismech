pathophysiology:
- name: Reduced PBRM1 Function in the PBAF Complex
  biological_scale: MOLECULAR
  description: >-
    PBRM1 encodes BAF180, the subunit that defines the PBAF form of the BAF chromatin-remodelling
    complex. The BAF complex regulates gene expression during neural development, and defects in
    other subunits cause the BAFopathies. In the mouse work this node is a conditional knockout; in
    the single human patient it is a predicted splice variant of undemonstrated effect.
  genes:
  - preferred_term: PBRM1
    term:
      id: hgnc:30064
      label: PBRM1
  biological_processes:
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: DECREASED
  genetic_context:
    description: >-
      The single reported human variant arose de novo and heterozygous. The mouse work this entry's
      mechanism comes from uses a homozygous conditional knockout restricted to microglia instead,
      which is recorded as a divergence on the model links.
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:34906496
    reference_title: Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The BRG1/BRM-associated factor (BAF) complex, the mammalian form of SWItch/Sucrose
      Non-Fermentable (SWI/SNF) complex, is a highly conserved chromatin remodeling complex playing a
      critical role in gene regulation, tumor suppression, and neural development.
    explanation: >-
      Establishes the complex PBRM1 belongs to and its role in neural development. Quoted from the
      introduction, so it is background rather than this paper's own finding.

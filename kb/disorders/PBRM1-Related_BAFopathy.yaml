  notes: >-
    Graded DISPUTED rather than CAUSATIVE because the claim is open rather than established. It rests
    on a single patient with a predicted splice-altering variant for which no RNA study was done, the
    reporting authors call PBRM1 a candidate gene and ask for further characterisation, and they also
    record that a 31,058 parent-offspring trio study of developmental disorders did not find PBRM1
    statistically associated. Nothing has replicated or formally refuted the claim since, so it is
    DISPUTED rather than REFUTED. No ClinGen gene-disease validity record exists for this pair. A
    DISPUTED row emits no gene-to-disease edge in the KGX export, which is the intended behaviour
    here.
  evidence:
  - reference: PMID:34906496
    reference_title: Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identified compelling genetic evidence to propose disease candidacy for three other
      genes involved in the BAF complex, including BICRA, PBRM1, and SMARCC1.
    explanation: The proposal of PBRM1 as a candidate BAFopathy gene, stated as candidacy.
  - reference: PMID:34906496
    reference_title: Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the recent publication using 31,058 parent–offspring trios of individuals with developmental
      disorders, a patient cohort resembling the BG ES cohort, did not suggest ACTL6A, BICRA, PBRM1,
      and SMARCC1 to be significantly associated with developmental disorders statistically
    explanation: >-
      A large trio study did not find PBRM1 significantly associated with developmental disorders,
      which is the evidence against the claim and the reason the row is DISPUTED.
  - reference: PMID:34906496
    reference_title: Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, the lack of RNA studies for the predicted splicing altering variant in PBRM1 obscured
      a clear understanding of the biological significance of this variation.
    explanation: >-
      The single human variant's effect on splicing was never demonstrated, which is the main gap in
      the human evidence.
  variants:

has_subtypes:
- name: Rabin-Pappas syndrome
  display_name: Rabin-Pappas syndrome (RAPAS, p.Arg1740Trp)
  description: >-
    The p.(Arg1740Trp) (c.5218C>T) disorder: microcephaly, profound intellectual
    disability, and congenital anomalies affecting several organ systems
    (ophthalmic, hearing, cardiac, genitourinary, skeletal). The most severe end
    of the SETD2 spectrum.
- name: MRD70
  display_name: Intellectual developmental disorder, autosomal dominant 70 (MRD70, p.Arg1740Gln)
  description: >-
    The p.(Arg1740Gln) (c.5219G>A) disorder: moderate-to-severe intellectual
    disability with low-normal head circumference and absence of additional major
    congenital anomalies.

animal_models:
- name: Forebrain-specific Setd2 conditional knockout mouse
  species: Mouse
  genotype: Setd2 conditional knockout (dorsal forebrain)
  publication: PMID:33523829
  description: >-
    Dorsal-forebrain Setd2 deletion disrupts cortical arealization and
    cortico-thalamo-cortical circuits and produces Sotos-like behavioural
    deficits.
  modeled_mechanisms:
  - target: Dysregulated Cortical Arealization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the cPcdh-dependent cortical-arealization defect and behavioural phenotype.
    limitations: >-
      A conditional complete knockout models SETD2 loss, whereas the human
      codon-1740 disorders are caused by a specific missense allele with an
      inferred gain/altered function; the model captures the H3K36me3-dependent
      cortical mechanism, not the allele-specific severity.
    evidence:
    - reference: PMID:33523829
      reference_title: "Abnormal neocortex arealization and Sotos-like syndrome-associated behavior in Setd2 mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Setd2 is required for proper cortical arealization and the formation of cortico-thalamo-cortical circuits."
      explanation: Establishes the requirement for Setd2 in cortical arealization.
- name: Setd2 SRI-domain microtubule-methylation-deficient mouse
  species: Mouse
  genotype: Setd2(SRI/wt) heterozygous CRISPR knock-in
  publication: PMID:34014281
  description: >-
    A heterozygous SRI-domain variant disabling alpha-tubulin methylation;
    produces an anxiety-like phenotype with neuronal process deficits but no
    chromatin/expression changes.
  modeled_mechanisms:
  - target: Impaired Neuronal Microtubule Methylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Isolates the microtubule-methylation arm of SETD2 function.
    limitations: >-
      Models the microtubule-methylation defect specifically (SRI-domain allele),
      not the human codon-1740 variant; demonstrates an autism-associated
      phenotype can arise from microtubule methylation loss alone.
    evidence:
    - reference: PMID:34014281
      reference_title: "Neuronal SETD2 activity links microtubule methylation to an anxiety-like phenotype in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a heterozygous chromatin remodeller defect that specifically disables microtubule methylation is sufficient to drive an autism-associated phenotype."
      explanation: Microtubule-methylation loss alone drives an autism-associated phenotype.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is by exome or genome sequencing identifying a de novo
    heterozygous SETD2 codon-1740 variant (c.5218C>T or c.5219G>A).
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32710489
    reference_title: "Genotype-phenotype correlation at codon 1740 of SETD2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified 15 individuals with de novo variants in codon 1740 of SETD2 whose features differ from those with LLS."
    explanation: Molecular identification of codon-1740 variants defines the diagnosis.
treatments:
- name: Supportive and developmental care
  description: >-
    No disease-specific therapy exists. Management is supportive and
    multidisciplinary: developmental and educational support, and
    organ-system-directed care for the congenital anomalies, seizures, feeding
    and sensory problems seen in RAPAS.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32710489
    reference_title: "Genotype-phenotype correlation at codon 1740 of SETD2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The phenotype of Group 1 includes microcephaly, profound intellectual disability, congenital anomalies affecting several organ systems, and similar facial features."
    explanation: The severe multi-system features define the supportive-care needs; no disease-modifying therapy exists.

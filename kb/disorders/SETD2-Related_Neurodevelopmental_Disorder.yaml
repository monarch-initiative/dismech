name: SETD2-Related Neurodevelopmental Disorder
creation_date: "2026-11-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: SETD2-related neurodevelopmental disorder without or with macrocephaly/overgrowth
  term:
    id: MONDO:0800477
    label: SETD2-related neurodevelopmental disorder without or with macrocephaly/overgrowth
synonyms:
- Rabin-Pappas syndrome
- RAPAS
- "Intellectual developmental disorder, autosomal dominant 70"
- MRD70
description: >-
  An autosomal dominant neurodevelopmental disorder caused by de novo
  heterozygous variants in SETD2, the sole methyltransferase for histone H3
  lysine-36 trimethylation (H3K36me3), which also methylates alpha-tubulin at
  lysine 40. This entry covers the two disorders defined by missense variants at
  SETD2 codon 1740, which produce a phenotype distinct from and more severe than
  the loss-of-function overgrowth syndrome Luscan-Lumish (MONDO:0014791, curated
  separately): Rabin-Pappas syndrome (RAPAS; p.Arg1740Trp) - profound
  developmental impairment with progressive microcephaly and multi-organ
  congenital anomalies - and autosomal dominant intellectual developmental
  disorder 70 (MRD70; p.Arg1740Gln) - moderate-to-severe intellectual disability
  without major congenital anomalies. The codon-1740 variants are inferred to act
  by a gain- or altered-function mechanism rather than haploinsufficiency.
notes: >-
  Scope: this entry is the SETD2 codon-1740 disorder pair (RAPAS MONDO:0035706
  and MRD70 MONDO:0859333, the two MONDO descendants of MONDO:0800477). The
  loss-of-function overgrowth presentation, Luscan-Lumish syndrome
  (MONDO:0014791), is curated separately; that entry records the allelic series
  as a discussion and states RAPAS and MRD70 should be separate entries, which
  this is. The mechanism differs by allele class (haploinsufficiency for
  Luscan-Lumish; inferred gain/altered function at codon 1740 here).
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Caused by de novo heterozygous SETD2 codon-1740 missense variants.
  evidence:
  - reference: PMID:32710489
    reference_title: "Genotype-phenotype correlation at codon 1740 of SETD2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified 15 individuals with de novo variants in codon 1740 of SETD2 whose features differ from those with LLS."
    explanation: De novo heterozygous codon-1740 variants in the defining cohort.
has_subtypes:
- name: Rabin-Pappas syndrome
  display_name: Rabin-Pappas syndrome (RAPAS, p.Arg1740Trp)
  description: >-
    The p.(Arg1740Trp) (c.5218C>T) disorder: microcephaly, profound intellectual
    disability, and congenital anomalies affecting several organ systems
    (ophthalmic, hearing, cardiac, genitourinary, skeletal). The most severe end
    of the SETD2 spectrum.
- name: MRD70
  display_name: Intellectual developmental disorder, autosomal dominant 70 (MRD70, p.Arg1740Gln)
  description: >-
    The p.(Arg1740Gln) (c.5219G>A) disorder: moderate-to-severe intellectual
    disability with low-normal head circumference and absence of additional major
    congenital anomalies.
genetic:
- name: SETD2 variants
  gene_term:
    preferred_term: SETD2
    term:
      id: hgnc:18420
      label: SETD2
  relationship_type: CAUSATIVE
  notes: >-
    De novo heterozygous missense variants at codon 1740 - c.5218C>T
    p.(Arg1740Trp) in RAPAS and c.5219G>A p.(Arg1740Gln) in MRD70 - cause the two
    disorders in this entry. Both are absent from gnomAD. The codon-1740 variants
    give more severe disease than SETD2 loss of function (Luscan-Lumish),
    implicating a gain- or altered-function mechanism rather than
    haploinsufficiency.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_c8d0235a-b48e-4609-8c61-09586a83d1f2-2023-10-03T220000.000Z
    evidence:
    - reference: CGGV:assertion_c8d0235a-b48e-4609-8c61-09586a83d1f2-2023-10-03T220000.000Z
      reference_title: "SETD2 / SETD2-related neurodevelopmental disorder without or with macrocephaly/overgrowth (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SETD2 | HGNC:18420 | SETD2-related neurodevelopmental disorder without or with macrocephaly/overgrowth | MONDO:0800477 | AD | Definitive | SOP9 | Intellectual Disability and Autism Gene Curation Expert Panel | 2023-10-03T22:00:00.000Z"
      explanation: ClinGen classifies the SETD2-NDD (macrocephaly/overgrowth) relationship as Definitive (AD).
  - validity_classification: STRONG
    classified_by: CLINGEN
    external_id: CGGV:assertion_12443e12-a359-40fb-afbf-b334e9b87b1d-2023-10-03T220000.000Z
    subtype: Rabin-Pappas syndrome
    evidence:
    - reference: CGGV:assertion_12443e12-a359-40fb-afbf-b334e9b87b1d-2023-10-03T220000.000Z
      reference_title: "SETD2 / SETD2-related microcephaly-severe intellectual disability-multiple congenital anomalies syndrome (Strong)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SETD2 | HGNC:18420 | SETD2-related microcephaly-severe intellectual disability-multiple congenital anomalies syndrome | MONDO:0035706 | AD | Strong | SOP9 | Intellectual Disability and Autism Gene Curation Expert Panel | 2023-10-03T22:00:00.000Z"
      explanation: ClinGen classifies the RAPAS (microcephaly/severe-ID/MCA) relationship as Strong (AD).
  variants:
  - name: c.5218C>T p.(Arg1740Trp)
    description: Recurrent de novo RAPAS variant in 12 unrelated individuals; absent from gnomAD.
    clinical_significance: PATHOGENIC
  - name: c.5219G>A p.(Arg1740Gln)
    description: Recurrent de novo MRD70 variant in 3 unrelated individuals; absent from gnomAD.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:32710489
    reference_title: "Genotype-phenotype correlation at codon 1740 of SETD2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Group 1 consists of 12 individuals with heterozygous variant c.5218C>T p.(Arg1740Trp) and Group 2 consists of 3 individuals with heterozygous variant c.5219G>A p.(Arg1740Gln)."
    explanation: Defines the two codon-1740 variants and their cohorts.
  - reference: PMID:32710489
    reference_title: "Genotype-phenotype correlation at codon 1740 of SETD2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "While LLS is likely due to loss of function of SETD2, the clinical features seen in individuals with variants affecting codon 1740 are more severe suggesting an alternative mechanism, such as gain of function, effects on epigenetic regulation, or posttranslational modification of the cytoskeleton."
    explanation: Codon-1740 variants are inferred to act by gain/altered function, not haploinsufficiency.
pathophysiology:
- name: SETD2 Codon-1740 Dysfunction
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
  description: >-
    De novo missense variants at SETD2 codon 1740 alter the activity of SETD2, a
    dual-function methyltransferase for histone H3K36 (trimethylation, H3K36me3)
    and for alpha-tubulin lysine 40. The altered function is more deleterious
    than simple loss of function.
  molecular_functions:
  - preferred_term: histone H3K36 trimethyltransferase activity
    modifier: ABNORMAL
    term:
      id: GO:0140955
      label: histone H3K36 trimethyltransferase activity
  downstream:
  - target: Dysregulated Cortical Arealization
    description: Altered H3K36me3 changes expression of developmental genes in cortex.
  - target: Impaired Neuronal Microtubule Methylation
    description: Loss of alpha-tubulin K40 methylation affects the neuronal cytoskeleton.
  evidence:
  - reference: PMID:32710489
    reference_title: "Genotype-phenotype correlation at codon 1740 of SETD2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SETD2 is associated with trimethylation of histone H3 at lysine 36 (H3K36me3) and methylation of α-tubulin at lysine 40."
    explanation: SETD2 is a dual-function H3K36me3 and alpha-tubulin methyltransferase.
  - reference: PMID:16118227
    reference_title: "Identification and characterization of a novel human histone H3 lysine 36-specific methyltransferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The triplicate AWS-SET-PostSET domains mediate a histone H3 lysine 36 specific HMTase activity."
    explanation: Establishes SETD2 (HYPB) as the H3K36-specific methyltransferase.
- name: Dysregulated Cortical Arealization
  biological_scale: TISSUE
  description: >-
    SETD2-dependent H3K36me3 maintains expression of clustered protocadherin
    (cPcdh) genes; loss disrupts neocortical arealization and cortico-thalamo-
    cortical circuit formation, modelled by forebrain-specific Setd2 deletion in
    mice that also reproduces Sotos-like behavioural deficits. The link to the
    human disorder is inferred from the mouse model.
  biological_processes:
  - preferred_term: cerebral cortex development
    modifier: ABNORMAL
    term:
      id: GO:0021987
      label: cerebral cortex development
  cell_types:
  - preferred_term: cortical neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Profound intellectual disability
    description: Abnormal cortical development underlies the severe cognitive impairment.
  evidence:
  - reference: PMID:33523829
    reference_title: "Abnormal neocortex arealization and Sotos-like syndrome-associated behavior in Setd2 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SETD2 maintains the expression of clustered protocadherin (cPcdh) genes in an H3K36me3 methyltransferase-dependent manner."
    explanation: Links SETD2/H3K36me3 to cPcdh expression governing cortical arealization.
  - reference: PMID:33523829
    reference_title: "Abnormal neocortex arealization and Sotos-like syndrome-associated behavior in Setd2 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Setd2 conditional knockout mice exhibit defects in social interaction, motor learning, and spatial memory, reminiscent of patients with the Sotos-like syndrome bearing SETD2 mutations."
    explanation: Forebrain Setd2 loss reproduces neurodevelopmental/behavioural deficits in mouse.
- name: Impaired Neuronal Microtubule Methylation
  biological_scale: CELLULAR
  description: >-
    SETD2 methylates alpha-tubulin K40 on neuronal microtubules via its SRI
    domain; a heterozygous SRI-domain variant that disables microtubule
    methylation shortens axons and reduces dendritic arborization and produces an
    anxiety-like phenotype in mice, without chromatin or expression changes.
    Human relevance is inferred from the mouse model.
  biological_processes:
  - preferred_term: neuron projection development
    modifier: DECREASED
    term:
      id: GO:0031175
      label: neuron projection development
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:34014281
    reference_title: "Neuronal SETD2 activity links microtubule methylation to an anxiety-like phenotype in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "primary neurons exhibited structural deficits in axon length and dendritic arborization."
    explanation: Disabled microtubule methylation impairs neuronal process development.

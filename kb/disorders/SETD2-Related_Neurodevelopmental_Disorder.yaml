pathophysiology:
- name: SETD2 Codon-1740 Dysfunction
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
  description: >-
    De novo missense variants at SETD2 codon 1740 alter the activity of SETD2, a
    dual-function methyltransferase for histone H3K36 (trimethylation, H3K36me3)
    and for alpha-tubulin lysine 40. These alleles are more deleterious than typical loss of function, with an
    inferred gain- or altered-function effect superimposed on reduced H3K36me3.
  molecular_functions:
  - preferred_term: histone H3K36 trimethyltransferase activity
    modifier: ABNORMAL
    term:
      id: GO:0140955
      label: histone H3K36 trimethyltransferase activity
  downstream:
  - target: Dysregulated Cortical Arealization
    description: Altered H3K36me3 changes expression of developmental genes in cortex.
  - target: Impaired Neuronal Microtubule Methylation
    description: Altered alpha-tubulin K40 methylation affects the neuronal cytoskeleton.
  - target: Congenital heart malformation
    description: The codon-1740 genotype is associated with congenital heart malformation; the intermediate mechanism is not established.
  - target: Failure to thrive
    description: The codon-1740 genotype is associated with severe failure to thrive; the intermediate mechanism is not established.
  - target: Hyponatremia
    description: The codon-1740 genotype is associated with hyponatremia; the intermediate mechanism is not established.
  - target: Hypotonia
    description: The codon-1740 genotype is associated with hypotonia; the intermediate mechanism is not established.
  - target: Facial dysmorphism
    description: The codon-1740 genotype is associated with the distinctive craniofacial features; the intermediate mechanism is not established.
  - target: Hearing impairment
    description: The codon-1740 genotype is associated with hearing loss; the intermediate mechanism is not established.
  - target: Cryptorchidism
    description: The codon-1740 genotype is associated with cryptorchidism; the intermediate mechanism is not established.
  - target: Retinal involvement (Coats disease)
    description: The codon-1740 genotype is associated with the retinal (Coats-like) findings; the intermediate mechanism is not established.
  - target: Respiratory compromise (tracheomalacia)
    description: The codon-1740 genotype is associated with tracheomalacia and respiratory issues; the intermediate mechanism is not established.
  evidence:
  - reference: PMID:32710489
    reference_title: "Genotype-phenotype correlation at codon 1740 of SETD2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SETD2 is associated with trimethylation of histone H3 at lysine 36 (H3K36me3) and methylation of α-tubulin at lysine 40."
    explanation: SETD2 is a dual-function H3K36me3 and alpha-tubulin methyltransferase.
  - reference: PMID:16118227
    reference_title: "Identification and characterization of a novel human histone H3 lysine 36-specific methyltransferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The triplicate AWS-SET-PostSET domains mediate a histone H3 lysine 36 specific HMTase activity."
    explanation: Establishes SETD2 (HYPB) as the H3K36-specific methyltransferase.
- name: Dysregulated Cortical Arealization
  biological_scale: TISSUE
  description: >-
    SETD2-dependent H3K36me3 maintains expression of clustered protocadherin
    (cPcdh) genes; loss disrupts neocortical arealization and the formation of
    cortico-thalamo-cortical circuits, modelled by forebrain-specific Setd2 deletion in
    mice that also reproduces Sotos-like behavioural deficits. The link to the
    human disorder is inferred from the mouse model.
  biological_processes:
  - preferred_term: cerebral cortex development
    modifier: ABNORMAL
    term:
      id: GO:0021987
      label: cerebral cortex development
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  downstream:
  - target: Profound intellectual disability
    description: Abnormal cortical development underlies the severe cognitive impairment.
  - target: Seizures
    description: Disrupted cortical development predisposes to epilepsy.
  - target: Autistic behavior
    description: Abnormal cortical arealization and connectivity underlie autism-spectrum behaviour.
  - target: Progressive microcephaly
    description: Abnormal cortical development reduces brain growth (microcephaly in RAPAS).
  - target: Intellectual disability (moderate to severe)
    description: Abnormal cortical development underlies the MRD70 intellectual disability.
  - target: Absent speech
    description: Abnormal cortical development underlies the limited-to-no speech in RAPAS.
  evidence:
  - reference: PMID:33523829
    reference_title: "Abnormal neocortex arealization and Sotos-like syndrome-associated behavior in Setd2 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SETD2 maintains the expression of clustered protocadherin (cPcdh) genes in an H3K36me3 methyltransferase-dependent manner."
    explanation: Links SETD2/H3K36me3 to cPcdh expression governing cortical arealization.
  - reference: PMID:33523829
    reference_title: "Abnormal neocortex arealization and Sotos-like syndrome-associated behavior in Setd2 mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Setd2 conditional knockout mice exhibit defects in social interaction, motor learning, and spatial memory, reminiscent of patients with the Sotos-like syndrome bearing SETD2 mutations."
    explanation: Forebrain Setd2 loss reproduces neurodevelopmental/behavioural deficits in mouse.
- name: Impaired Neuronal Microtubule Methylation
  biological_scale: CELLULAR
  description: >-
    SETD2 methylates alpha-tubulin K40 on neuronal microtubules via its SRI
    domain; a heterozygous SRI-domain variant that disables microtubule
    methylation shortens axons and reduces dendritic arborization and produces an
    anxiety-like phenotype in mice, without chromatin or expression changes.
    Human relevance is inferred from the mouse model.
  biological_processes:
  - preferred_term: neuron projection development
    modifier: DECREASED
    term:
      id: GO:0031175
      label: neuron projection development
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Autistic behavior
    description: Loss of neuronal microtubule methylation drives an autism-associated phenotype (mouse).
  evidence:
  - reference: PMID:34014281
    reference_title: "Neuronal SETD2 activity links microtubule methylation to an anxiety-like phenotype in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "primary neurons exhibited structural deficits in axon length and dendritic arborization."
    explanation: Disabled microtubule methylation impairs neuronal process development.

environmental: []
treatments:
- name: Symptomatic pharmacotherapy
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  description: >-
    Standard of care. In the absence of a disease-modifying therapy, treatment
    is symptomatic and targeted to the dominant movement disorder. The movement
    disorder is particularly resistant to conventional therapy, but partial
    responses have been recorded with agents such as levodopa, tetrabenazine,
    orphenadrine, sulpiride, and clonazepam, and botulinum toxin may help
    painful focal dystonia.
  notes: >-
    Iron supplements should be avoided. Because serum ferritin can be low,
    empiric iron replacement risks aggravating brain iron accumulation.
  evidence:
  - reference: DOI:10.7916/D8KK9BHF
    reference_title: "Neuroferritinopathy: Pathophysiology, Presentation, Differential Diagnoses and Management"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the absence of a disease-specific treatment, symptomatic drug therapy for specific movement disorders may be used, although with variable success.
    explanation: >-
      This directly supports symptomatic pharmacologic management as the
      current treatment approach.
  - reference: PMID:20301320
    reference_title: Neuroferritinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the movement disorder is particularly resistant to conventional
      therapy, some response has been recorded with levodopa, tetrabenazine,
      orphenadrine, benzhexol, sulpiride, diazepam, clonazepam, and deanol in
      standard doses. Botulinum toxin may be helpful for painful focal dystonia.
    explanation: >-
      GeneReviews enumerates the symptomatic agents used and notes the disorder's
      resistance to conventional therapy.
- name: Physical therapy
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  description: >-
    Supportive standard of care recommended to maintain mobility and prevent
    contractures as motor disability progresses.
  evidence:
  - reference: PMID:20301320
    reference_title: Neuroferritinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physical therapy is recommended to maintain mobility and prevent
      contractures.
    explanation: >-
      GeneReviews recommends physical therapy as supportive management.
- name: Iron chelation therapy
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deferiprone
      term:
        id: CHEBI:68554
        label: deferiprone
  description: >-
    Investigational and of uncertain benefit. Iron chelation (e.g., the
    brain-penetrant chelator deferiprone) is mechanistically motivated by the
    goal of reversing ferritin aggregation and limiting oxidative injury, but
    clinical evidence in neuroferritinopathy is limited to anecdotal reports and
    no formal treatment trials have established meaningful benefit. It is not
    established disease-modifying therapy and is not part of standard care.
  notes: >-
    Framed as investigational rather than standard: the supporting evidence is a
    preclinical/mechanistic rationale plus anecdotal clinical reports, with mixed
    and unproven clinical efficacy.
  evidence:
  - reference: PMID:23908629
    reference_title: Abnormal iron homeostasis and neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, the finding that ferritin aggregation can be reversed by
      iron chelators and oxidative damage can be inhibited by radical trapping
      may be used for clinical investigation.
    explanation: >-
      Supports iron-chelation pharmacotherapy as a mechanistically motivated
      investigational treatment concept rather than established
      disease-modifying therapy.
diagnosis:
- name: Clinical and family-history assessment
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  description: >-
    Diagnosis is suggested by an adult-onset progressive movement disorder
    (chorea and/or dystonia, often focal and asymmetric at onset) with a family
    history compatible with autosomal dominant inheritance. The diagnosis is
    established by typical clinical findings together with, or confirmed by, an
    FTL pathogenic variant; low or low-normal serum ferritin and MRI evidence of
    basal-ganglia iron are supportive clues rather than standalone criteria.
  results: >-
    Adult-onset progressive chorea/dystonia with a dominant family history
    supports neuroferritinopathy pending molecular confirmation.
  evidence:
  - reference: PMID:20301320
    reference_title: Neuroferritinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of neuroferritinopathy is established in a proband with
      typical clinical findings and/or identification of a heterozygous
      pathogenic variant in FTL by molecular testing.
    explanation: >-
      GeneReviews defines the combined clinical-plus-molecular diagnostic
      approach.
  - reference: DOI:10.7916/D8KK9BHF
    reference_title: "Neuroferritinopathy: Pathophysiology, Presentation, Differential Diagnoses and Management"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF must be considered in patients presenting clinically as a progressive movement disorder with variable phenotype and imaging evidence of iron deposition within the brain, decreased serum ferritin, and negative genetic testing for other more common movement disorders such as Huntington’s disease.
    explanation: >-
      Frames the clinical diagnostic reasoning, including supportive imaging and
      ferritin clues and differential exclusion.
- name: FTL genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Molecular confirmation relies on identifying a pathogenic FTL variant,
    typically the common exon 4 duplication (e.g., 460InsA) or another
    heterozygous FTL variant.
  results: Pathogenic FTL variant supports the diagnosis of neuroferritinopathy.
- name: Brain MRI
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Brain imaging demonstrates basal-ganglia iron. Iron-sensitive sequences
    (T2*, susceptibility-weighted imaging) show signal loss in the globus
    pallidus and putamen even in early or presymptomatic stages, while T2
    hyperintensity and progressive cystic cavitation of the putamen, caudate,
    and globus pallidus develop with advancing disease; sub-clinical cerebellar
    atrophy is also seen.
  results: >-
    Basal-ganglia iron deposition with putaminal/pallidal cavitation supports
    neuroferritinopathy.
  evidence:
  - reference: PMID:26142024
    reference_title: Voxel-based analysis in neuroferritinopathy expands the phenotype and determines radiological correlates of disease severity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data show that progressive iron accumulation in the caudate nucleus,
      and cavitation of the globus pallidus correlate with disease severity in
      neuroferritinopathy. We also confirm sub-clinical cerebellar atrophy as a
      feature of the disease.
    explanation: >-
      MRI study localizes progressive iron accumulation and cavitation and adds
      cerebellar atrophy as an imaging feature.
differential_diagnoses:
- name: Huntington disease
  disease_term:
    preferred_term: Huntington disease
    term:
      id: MONDO:0007739
      label: Huntington disease
  description: >-
    Huntington disease is a key differential because both disorders can present
    with progressive choreiform movement abnormalities.
  distinguishing_features:
  - HTT CAG-repeat expansion
  - Early and prominent cognitive/psychiatric decline
  - No basal-ganglia iron cavitation on iron-sensitive MRI
  - Serum ferritin normal
  evidence:
  - reference: DOI:10.7916/D8KK9BHF
    reference_title: "Neuroferritinopathy: Pathophysiology, Presentation, Differential Diagnoses and Management"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NF must be considered in patients presenting clinically as a progressive movement disorder with variable phenotype and imaging evidence of iron deposition within the brain, decreased serum ferritin, and negative genetic testing for other more common movement disorders such as Huntington’s disease.
    explanation: >-
      This directly identifies Huntington disease as a major differential
      diagnosis.
- name: Wilson disease
  disease_term:
    preferred_term: Wilson disease
    term:
      id: MONDO:0010200
      label: Wilson disease
  description: >-
    A treatable copper-overload disorder that can present with dystonia,
    parkinsonism, tremor, and psychiatric features overlapping
    neuroferritinopathy, and must be excluded as a reversible cause of a
    basal-ganglia movement disorder.
  distinguishing_features:
  - Autosomal recessive ATP7B disease
  - Younger onset
  - Low serum ceruloplasmin, elevated urinary copper, Kayser-Fleischer rings
  - Hepatic involvement; responds to copper chelation/zinc
  evidence:
  - reference: PMID:20301685
    reference_title: Wilson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Wilson disease is established in most instances by a
      combination of biochemical findings (low serum ceruloplasmin
      concentration, low serum concentration of total copper, and increased
      urinary copper excretion) and/or detection of biallelic pathogenic (or
      likely pathogenic) variants in ATP7B identified by molecular genetic
      testing
    explanation: >-
      GeneReviews establishes the copper-metabolism biochemistry and ATP7B
      genetics that distinguish Wilson disease from neuroferritinopathy.
- name: Aceruloplasminemia
  disease_term:
    preferred_term: aceruloplasminemia
    term:
      id: MONDO:0011426
      label: aceruloplasminemia
  description: >-
    Another NBIA-spectrum disorder in which iron dyshomeostasis is a primary
    driver, presenting with a movement disorder and brain iron accumulation that
    overlaps neuroferritinopathy.
  distinguishing_features:
  - Autosomal recessive ceruloplasmin (CP) deficiency
  - Absent serum ceruloplasmin with low serum iron and high ferritin
  - Systemic iron overload (diabetes mellitus, retinal degeneration, anemia)
  - Widespread rather than cavitating basal-ganglia iron
  evidence:
  - reference: PMID:20301666
    reference_title: Aceruloplasminemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aceruloplasminemia, a disorder of iron metabolism caused by the complete
      absence of ceruloplasmin ferroxidase activity, is associated with very low
      to absent serum ceruloplasmin and some combination of the following: Low
      serum copper concentration. Low serum iron concentration. High serum
      ferritin concentration.
    explanation: >-
      GeneReviews establishes the absent-ceruloplasmin, high-ferritin
      biochemistry that distinguishes aceruloplasminemia from
      neuroferritinopathy.
- name: Pantothenate kinase-associated neurodegeneration
  disease_term:
    preferred_term: pantothenate kinase-associated neurodegeneration
    term:
      id: MONDO:0009319
      label: pantothenate kinase-associated neurodegeneration
  description: >-
    The most common NBIA disorder; both cause dystonia with basal-ganglia iron
    and are distinguished chiefly by genetics, age of onset, and MRI pattern.
  distinguishing_features:
  - Autosomal recessive PANK2 disease
  - Typically childhood/adolescent onset
  - '"Eye-of-the-tiger" sign in the globus pallidus on T2/T2*'
  - Normal serum ferritin
  evidence:
  - reference: PMID:20301663
    reference_title: Pantothenate Kinase-Associated Neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PKAN is established in a proband with the characteristic
      clinical features and the "eye of the tiger" sign identified on brain MRI
      (a central region of hyperintensity surrounded by a rim of hypointensity
      on coronal or transverse T2-weighted images of the globus pallidus).
      Identification of biallelic PANK2 pathogenic variants on molecular genetic
      testing confirms the diagnosis.
    explanation: >-
      GeneReviews establishes the eye-of-the-tiger MRI sign and PANK2 genetics
      that distinguish PKAN from neuroferritinopathy.

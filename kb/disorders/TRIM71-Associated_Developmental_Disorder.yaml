- name: Premature Cochlear Prosensory Cell Differentiation
  description: >-
    In the developing cochlea TRIM71 holds hair cell progenitors in a
    proliferative, undifferentiated state by restricting TGF-beta-type signaling
    (Inhba, Tgfbr2). Without it, hair cells form and are innervated too early, and
    in adult mice presynaptic terminals are reduced and neurons degenerate in the
    outer hair cell region.
  biological_scale: CELLULAR
  cell_types:

    reference_title: The RNA-binding protein TRIM71 is essential for hearing in humans and mice and times auditory sensory organ development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TRIM71 maintains hair cell progenitors in a proliferative and
      undifferentiated state by restricting TGFβ-type signaling
    explanation: Gives the cochlear mechanism.
  downstream:
  - target: Hearing Loss
    description: Mistimed cochlear development leaves the adult organ with synaptic loss and neuronal degeneration.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40892928
      reference_title: The RNA-binding protein TRIM71 is essential for hearing in humans and mice and times auditory sensory organ development.

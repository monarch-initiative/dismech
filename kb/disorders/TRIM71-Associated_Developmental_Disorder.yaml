      evidence_source: MODEL_ORGANISM
      snippet: >-
        Characterization of hair cells and their associated neurons in adult
        Trim71 knockout mice revealed reduced presynaptic terminals and neuronal
        degeneration in the outer hair cell region, providing a basis for the
        observed hearing deficits in Trim71 knockout mice.
      explanation: Links the cochlear developmental defect to hearing loss in the mouse.

- name: Hypercompliant Cortex
  description: >-
    The hypoplastic brain is mechanically softer (more compliant) and resists
    strain less, so it accommodates more CSF at a given CSF pressure. CSF
    secretion markers, cilia-driven CSF flow and aqueduct patency are normal in
    the mouse model, so the ventricular enlargement downstream is secondary.
  biological_scale: TISSUE
  evidence:

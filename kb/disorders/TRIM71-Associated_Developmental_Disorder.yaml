- name: TRIM71
  gene_term:
    preferred_term: TRIM71
    term:
      id: hgnc:32669
      label: TRIM71
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous, mostly de novo missense variants, concentrated in the NHL
    repeats; R608H and R796H recur.
  evidence:
  - reference: PMID:38833623
    reference_title: TRIM71 mutations cause a neurodevelopmental syndrome featuring ventriculomegaly and hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data show TRIM71 is essential for human brain morphogenesis and that
      TRIM71 mutations cause a novel neurodevelopmental syndrome
    explanation: Establishes TRIM71 as the causal gene.
  - reference: PMID:29983323
    reference_title: De Novo Mutation in Genes Regulating Neural Stem Cell Fate in Human Congenital Hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing of 125 CH trios and 52 additional probands identified three
      genes with significant burden of rare damaging de novo or transmitted
      mutations: TRIM71 (p = 2.15 × 10-7)
    explanation: First gene-level association of TRIM71 with congenital hydrocephalus.
treatments:
- name: CSF Shunting
  description: >-
    Neurosurgical CSF diversion is the standard treatment for congenital
    hydrocephalus. In the mouse model the ventricles enlarge because the
    hypoplastic brain is compliant, not because CSF is over-produced or blocked,
    which is why shunting is not expected to correct the underlying defect.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ventriculoperitoneal shunt placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_mechanisms:
  - target: Hydrocephalus
    treatment_effect: INHIBITS
    description: Diverting CSF reduces ventricular volume and pressure; it acts on nothing upstream.
  evidence:
  - reference: PMID:29983323
    reference_title: De Novo Mutation in Genes Regulating Neural Stem Cell Fate in Human Congenital Hydrocephalus.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: is treated with lifelong surgical CSF shunting with substantial morbidity
    explanation: States that congenital hydrocephalus, including the cohort that defined TRIM71, is treated by CSF shunting.
- name: Genetic Counseling
  description: Most variants are de novo, but transmitted variants have been reported.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40892928
    reference_title: The RNA-binding protein TRIM71 is essential for hearing in humans and mice and times auditory sensory organ development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identifying a heterozygous pathogenic variant in TRIM71 has allowed for the
      invalidation of this clinical diagnosis, leading to improved prognostic and
      genetic counseling for the patient.
    explanation: A molecular diagnosis of TRIM71 disease changed counseling for a patient first diagnosed with CHARGE syndrome.
animal_models:
- name: Trim71 R595H knock-in mouse
  species: Mouse
  genotype: Trim71 R595H/+ (homolog of human R608H)
  category: KNOCKIN
  publication: PMID:35379995
  description: >-
    Heterozygous knock-in of the patient-equivalent variant. About 16% of
    heterozygotes have severe ventriculomegaly at birth with cortical hypoplasia,
    progressing by P21. Homozygotes have fully penetrant exencephaly and die as
    embryos.
  evidence:
  - reference: PMID:35379995
    reference_title: Impaired neurogenesis alters brain biomechanics in a neuroprogenitor-based genetic subtype of congenital hydrocephalus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mice harboring neuroepithelial cell-specific Trim71 deletion or CH-specific Trim71 mutation exhibit prenatal hydrocephalus.
    explanation: The patient-variant knock-in mouse develops prenatal hydrocephalus.
  modeled_mechanisms:
  - target: Hypercompliant Cortex
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Hydrocephalic heterozygotes have mechanically softer brain tissue, with CSF flow left intact.
    limitations: >-
      Penetrance is incomplete (about 16% at birth), and brain tissue mechanics
      have not been measured in patients.
    readouts:
    - name: Brain tissue compliance by atomic force microscopy at P7
      target: Hypercompliant Cortex
      direction: INCREASED
      evidence:
      - reference: PMID:35379995
        reference_title: Impaired neurogenesis alters brain biomechanics in a neuroprogenitor-based genetic subtype of congenital hydrocephalus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          AFM indentations on dissected brain tissues from WT and hydrocephalic
          Trim71R595H/+ mice revealed a significant reduction in stiffness and
          relaxation modulus in P7 Trim71R595H/+ hydrocephalic brain tissues
          compared to WT tissues, whereas mutant compliance was significantly
          increased
        explanation: Direct measurement of the increased compliance this node describes.
    - name: Cilia-generated CSF flow at P7
      target: Hypercompliant Cortex
      direction: UNCHANGED
      evidence:
      - reference: PMID:35379995
        reference_title: Impaired neurogenesis alters brain biomechanics in a neuroprogenitor-based genetic subtype of congenital hydrocephalus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Cilia-generated CSF flow was unaffected in P7 hydrocephalic Trim71R595H/+ mice
        explanation: A negative result separating this mechanism from a primary CSF flow defect.
  - target: Cortical Hypoplasia with Reduced Neurogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The patient-equivalent variant produces a smaller cortex with fewer neurons at birth.
    limitations: >-
      Penetrance is incomplete (about 16% at birth), and the human syndrome's
      corpus callosum, white matter and facial features are not reported in the
      model.
    readouts:
    - name: Cortical volume at P0 by MRI
      target: Cortical Hypoplasia with Reduced Neurogenesis
      direction: DECREASED
      evidence:
      - reference: PMID:35379995
        reference_title: Impaired neurogenesis alters brain biomechanics in a neuroprogenitor-based genetic subtype of congenital hydrocephalus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Quantitative magnetic resonance imaging (MRI) analysis of brain anatomical
          development in P0 hydrocephalic Trim71R595H/+ mice revealed ventriculomegaly
          with decreased cerebral cortex volume (cortical hypoplasia) despite normal
          intracranial volume
        explanation: MRI shows reduced cortical volume with ventriculomegaly.
- name: Nestin-Cre Trim71 conditional knockout mouse
  species: Mouse
  genotype: Nestin-Cre; Trim71 fl/fl
  category: CONDITIONAL_KNOCKOUT
  publication: PMID:35379995
  description: >-
    Deletion of Trim71 from embryonic neural stem cells produces ventriculomegaly
    in about 16% of mice, with fewer cortical neurons at birth.
  evidence:
  - reference: PMID:35379995
    reference_title: Impaired neurogenesis alters brain biomechanics in a neuroprogenitor-based genetic subtype of congenital hydrocephalus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Trim71 conditional KO mice from either Cre drivers exhibited ventriculomegaly
      in a significant percentage of animals (~16% of Nestin-Trim71fl/fl mice and
      ~25% of Emx1-Trim71fl/− mice)
    explanation: Neural stem cell deletion of Trim71 produces ventriculomegaly.
  modeled_mechanisms:
  - target: Cortical Hypoplasia with Reduced Neurogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Loss of Trim71 from neural progenitors reduces cortical neurogenesis.
    limitations: >-
      A deletion does not model the patient missense variants, which may also
      bind new targets.

name: TRIM71-Associated_Developmental_Disorder
creation_date: '2026-10-31T00:00:00Z'
category: Mendelian
description: >-
  TRIM71-associated developmental disorder (TADD; OMIM 618667, congenital
  communicating hydrocephalus 1) is an autosomal dominant neurodevelopmental
  disorder caused mostly by de novo missense variants in TRIM71, the RNA-binding
  protein encoded by the let-7 microRNA target lin-41. Affected children have
  variable ventriculomegaly or congenital hydrocephalus, developmental delay,
  dysmorphic features and other structural brain defects, including corpus
  callosum dysgenesis and white matter hypoplasia; some also have hearing loss
  with middle and inner ear malformations. Recurrent arginine substitutions sit at
  homologous positions of the NHL repeats that bind target mRNAs. In mouse models
  the patient variant reduces binding to normal targets, neuroepithelial stem cells
  differentiate too early, the cortex is hypoplastic and mechanically
  hypercompliant, and the ventricles enlarge secondarily, without a primary defect
  in cerebrospinal fluid (CSF) production, flow or absorption.
disease_term:
  preferred_term: hydrocephalus, congenital communicating, 1
  term:
    id: MONDO:0032862
    label: hydrocephalus, congenital communicating, 1
parents:
- Congenital Hydrocephalus
synonyms:
- hydrocephalus, congenital communicating, 1
- HYDCC1
- TRIM71-associated developmental disorders
- TADD
notes: >-
  Named for the term Duy et al. (PMID:38833623) proposed when they defined the
  syndrome in a cohort of 2697 trios: "TRIM71-associated developmental disorders
  (TADD)". The MONDO and OMIM label, congenital communicating hydrocephalus 1, is
  kept as a synonym. It names one feature, and in that cohort ventriculomegaly
  ranged from mild to neurosurgically treated hydrocephalus. The broad
  Congenital_Hydrocephalus entry (MONDO:0016349) lists TRIM71 within its neural
  stem cell fate arm. This entry is the single-gene disease with its own MONDO
  term and its own mouse models. The two mechanistic accounts of the NHL-domain
  variants, loss of binding to normal targets and gain of binding to new ones,
  come from different laboratories using different variants and cell systems, and
  are recorded as alternative hypotheses rather than reconciled. Only the abstract
  of PMID:38833623 is cached, so per-patient frequencies are not recorded.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous (monoallelic) variants, most arising de novo; a few transmitted
    variants of uncertain significance have also been reported.
  evidence:
  - reference: PMID:36573342
    reference_title: A congenital hydrocephalus-causing mutation in Trim71 induces stem cell defects via inhibiting Lsd1 mRNA translation.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Mono-allelic mutations in Trim71, a conserved stem-cell-specific RNA-binding protein, cause CH
    explanation: States that a single mutant TRIM71 allele causes congenital hydrocephalus.
  - reference: PMID:38833623
    reference_title: TRIM71 mutations cause a neurodevelopmental syndrome featuring ventriculomegaly and hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified 13 protein-altering de novo variants (DNVs) in TRIM71 in unrelated children
    explanation: De novo heterozygous variants in unrelated probands are consistent with dominant inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    13 de novo protein-altering variants in unrelated children, from 2697
    parent-proband trios with cerebral ventriculomegaly.
  evidence:
  - reference: PMID:38833623
    reference_title: TRIM71 mutations cause a neurodevelopmental syndrome featuring ventriculomegaly and hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including neurosurgically-treated congenital hydrocephalus (totalling 2697
      parent-proband trios and 8091 total exomes), we identified 13
      protein-altering de novo variants (DNVs) in TRIM71
    explanation: Gives the number of reported cases and the cohort they came from.
mechanistic_hypotheses:
- hypothesis_group_id: loss_of_target_binding
  hypothesis_label: Loss of binding to normal TRIM71 target mRNAs
  status: CANONICAL
  description: >-
    NHL-domain variants weaken TRIM71 binding to its normal target mRNAs (such as
    CDKN1A and EGR1), releasing them from repression, so neuroepithelial stem
    cells differentiate too early and cortical neurogenesis falls.
  evidence:
  - reference: PMID:35379995
    reference_title: Impaired neurogenesis alters brain biomechanics in a neuroprogenitor-based genetic subtype of congenital hydrocephalus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: CH mutations disrupt TRIM71 binding to its RNA targets, causing premature neuroepithelial cell differentiation and reduced neurogenesis.
    explanation: Mouse and stem cell work linking reduced target binding to premature differentiation.
- hypothesis_group_id: neomorphic_target_binding
  hypothesis_label: Gain of binding to new target mRNAs
  status: ALTERNATIVE
  description: >-
    Each mutant TRIM71 also binds a new, variant-specific set of mRNAs and
    represses them: R595H binds the beta-catenin (Ctnnb1) mRNA and R783H binds
    the Lsd1 (Kdm1a) mRNA. Restoring either target rescues differentiation in
    mutant mouse embryonic stem cells.
  evidence:
  - reference: PMID:36757932
    reference_title: Different congenital hydrocephalus-associated mutations in Trim71 impair stem cell differentiation via distinct gain-of-function mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results suggest that Trim71 mutations give rise to unique gain-of-function pathological mechanisms in CH.
    explanation: Proposes variant-specific gain of function as the disease mechanism.
pathophysiology:
- name: TRIM71 NHL Domain Missense Variant
  description: >-
    Most pathogenic variants are de novo missense changes, and recurrent arginine
    substitutions (for example R608H and R796H) fall at homologous positions in the
    RPXGV motifs of different NHL repeats, the domain that binds target mRNAs.
    Some other patient variants instead fail to direct TRIM71 to processing
    bodies (P-bodies), so not every variant is shown to act by weakening RNA
    binding.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: DE_NOVO
  molecular_functions:
  - preferred_term: TRIM71 binding to target mRNA 3' UTRs
    term:
      id: GO:0003730
      label: mRNA 3'-UTR binding
    modifier: DECREASED
  genes:
  - preferred_term: TRIM71
    term:
      id: hgnc:32669
      label: TRIM71
  evidence:
  - reference: PMID:38833623
    reference_title: TRIM71 mutations cause a neurodevelopmental syndrome featuring ventriculomegaly and hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight unrelated patients were found to harbour arginine variants, including
      two recurrent missense DNVs, at homologous positions in RPXGV motifs of
      different NHL domains.
    explanation: Places the recurrent patient variants in the RNA-binding NHL repeats.
  - reference: PMID:38833623
    reference_title: TRIM71 mutations cause a neurodevelopmental syndrome featuring ventriculomegaly and hydrocephalus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: other variants failed to direct the subcellular localization of TRIM71 to processing bodies
    explanation: A second functional class of patient variant, defective in P-body localization rather than target binding.
  downstream:

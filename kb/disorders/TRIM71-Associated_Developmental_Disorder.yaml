      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: NHL-domain variants of TRIM71 exhibited impaired binding to the canonical TRIM71 target CDKN1A
      explanation: Patient NHL-domain variants bind a canonical target mRNA less well.
    - reference: PMID:35379995
      reference_title: Impaired neurogenesis alters brain biomechanics in a neuroprogenitor-based genetic subtype of congenital hydrocephalus.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Luciferase assays corroborated reduced repression of the CDKN1A 3′
        untranslated region (UTR) by TRIM71-R608H, TRIM71-R796H, and
        TRIM71-ΔNHL6
      explanation: The two recurrent patient variants repress a target 3' UTR less than wild type.
  - target: Ectopic Target mRNA Repression by Mutant TRIM71
    description: The mutant protein binds and represses mRNAs that wild-type TRIM71 does not.
    causal_link_type: DIRECT
    hypothesis_groups:
    - neomorphic_target_binding
    evidence:
    - reference: PMID:36757932
      reference_title: Different congenital hydrocephalus-associated mutations in Trim71 impair stem cell differentiation via distinct gain-of-function mechanisms.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Unexpectedly, however, each mutant binds an ectopic and distinct repertoire of target mRNAs.
      explanation: Each hydrocephalus-associated Trim71 variant acquires its own new mRNA targets.
  - target: Premature Cochlear Prosensory Cell Differentiation
    description: >-
      Loss of TRIM71 function in the early otic epithelium releases
      TGF-beta-type signaling and advances cochlear differentiation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40892928
      reference_title: The RNA-binding protein TRIM71 is essential for hearing in humans and mice and times auditory sensory organ development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        early otic loss of TRIM71 function disrupts the highly stereotyped timing
        of cell cycle exit and differentiation within the inner ear auditory
        sensory organ (cochlea), resulting in the premature formation and
        innervation of mechanosensory hair cells
      explanation: Conditional Trim71 loss in the otic epithelium advances hair cell differentiation.
- name: Loss of TRIM71 Target mRNA Repression
  description: >-
    Target mRNAs that wild-type TRIM71 represses, including CDKN1A and EGR1, are

experimental_models:
- name: WBP4-null patient-derived primary dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary dermal fibroblasts obtained by skin biopsy from two unrelated
    affected individuals (one homozygous frameshift, one homozygous multi-exon
    deletion) and from their heterozygous parents, with an independent
    wild-type fibroblast line as control. Used for immunoblotting of WBP4 and
    for RNA sequencing with differential-expression (DESeq2) and
    differential-splicing (rMATS) analysis. This is the only experimental
    system in which the disease mechanism has been studied; no animal or
    stem-cell-derived model of WBP4 loss exists.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  publication: PMID:37425688
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For this, we took a skin biopsy from affected individuals F1-II:1 and
      F2-II:1 and their parents.
    explanation: >-
      Documents how the model system was established - skin biopsy from two
      affected individuals and their heterozygous parents, giving the
      within-family comparison used for both the immunoblot and the RNA-seq.
  modeled_mechanisms:
  - target: Complete Loss of WBP4 Protein
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Immunoblot of patient versus parental versus wild-type fibroblasts
      directly measures the WBP4 protein null state and the intermediate
      heterozygous level.
    evidence:
    - reference: PMID:37425688
      reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results show that in both cases the heterozygote parents show half
        of WBP4 protein amount relative to the WT control and that probands with
        homozygous WBP4 mutations have total ablation of WBP4 protein
      explanation: >-
        The immunoblot readout in these fibroblasts is the direct measurement of
        the protein-null node.
  - target: Transcriptome-Wide Aberrant Pre-mRNA Splicing
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      RNA sequencing of these fibroblasts is the assay that establishes the
      genome-wide mis-splicing phenotype, replicated across two probands with
      different alleles.
    evidence:
    - reference: PMID:37425688
      reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our analysis identified 5,675 differential splicing events in 2,859
        genes in proband F1-II:1 compared to his parents
      explanation: >-
        Quantifies the mis-splicing measured in this model system.
  - target: Mis-splicing of Neurodevelopmental and Musculoskeletal Gene Sets
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Fibroblasts are a mesenchymal skin-derived cell type, not a neural one.
      Splice-site usage is cell-type dependent, so a nervous-system phenotype
      enrichment computed on the fibroblast transcriptome is an indirect proxy
      for what happens in developing brain. The probands' fibroblasts were also
      compared against adult parental fibroblasts, and the authors themselves
      attribute an unexplained skin-phenotype enrichment in the
      differential-expression analysis to that age mismatch rather than to
      disease biology.
    description: >-
      The nervous-system and musculoskeletal enrichment of the shared
      aberrantly spliced gene set is measured in fibroblasts and only inferred
      for the affected tissues.
    evidence:
    - reference: PMID:37425688
      reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        We hypothesis that skin diseases enrichment which is not part of the
        probands' phenotypes could suggest a difference in gene expression of
        skin-related genes between the young probands and their adult parents'
        fibroblasts.
      explanation: >-
        The authors' own caveat that part of the fibroblast signal reflects the
        cell type and donor-age mismatch rather than disease mechanism, which is
        why fidelity for the tissue-specific claim is rated LOW.
diagnosis:
- name: Exome or genome sequencing with parental segregation
  description: >-
    Diagnosis is molecular. Every reported individual was ascertained by
    duo, trio or quad exome sequencing, or by genome sequencing, performed for
    unexplained developmental delay, intellectual disability or multiple
    congenital anomalies, with Sanger confirmation and parental segregation.
    Because the phenotype is not specific enough for targeted single-gene
    testing and the gene is newly described, broad sequencing with trio
    analysis is the practical diagnostic route. Confirming homozygosity or
    compound heterozygosity and demonstrating carrier status in both parents is
    required.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For Family 2, trio exome sequencing was performed in clinical diagnostic
      settings at Tartu University Hospital.
    explanation: >-
      Documents trio exome sequencing in a clinical diagnostic setting as the
      route to diagnosis.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation study by Sanger sequencing revealed that the parents were
      heterozygous carriers, affected individuals were homozygous for the
      variant, and two unaffected siblings were either heterozygous or
      homozygous wild type (WT)
    explanation: >-
      Documents Sanger confirmation and parental segregation as part of the
      diagnostic workup.
- name: RNA sequencing to resolve an exome-negative case
  description: >-
    A practically important diagnostic lesson from the defining cohort: in one
    family, trio exome analysis was non-diagnostic and the causal homozygous
    multi-exon deletion was found only after RNA sequencing of patient
    fibroblasts showed markedly reduced WBP4 expression, prompting reanalysis
    of genome data. Where a WBP4-consistent phenotype is exome-negative,
    transcriptome sequencing and explicit copy-number analysis of the locus
    should be pursued rather than stopping at the exome.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trio exome analysis was performed, but no pathogenic variants could be
      associated with the patient's phenotype.
    explanation: >-
      Establishes that exome sequencing was non-diagnostic in this family.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNA sequencing revealed a very low expression of the WBP4 gene (Figure
      S3), and reanalysis of genome data indicated a homozygous deletion in
      this region (Figure S4).
    explanation: >-
      Documents transcriptome sequencing as the step that resolved the
      exome-negative case.
- name: Brain MRI
  description: >-
    Neuroimaging is used to characterize the structural central nervous system
    abnormalities that are part of the disease definition. It is supportive and
    phenotype-defining rather than independently diagnostic; findings reported
    include agenesis of the corpus callosum and frontotemporal widening of the
    subarachnoid space, and electroencephalography in the same individual
    showed altered electrical activity without epileptiform abnormalities.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electroencephalogram showed altered electrical activity without
      epileptiform abnormalities, and brain Magnetic resonance imaging (MRI)
      confirmed the CCA and frontotemporal widening of subarachnoidal space
    explanation: >-
      Documents the neuroimaging and EEG findings that characterize the brain
      abnormality component.
differential_diagnoses:
- name: WBP11-related multiple congenital anomalies
  description: >-
    The closest gene-family and mechanism differential. WBP11, like WBP4,
    encodes a spliceosome component able to activate pre-mRNA splicing, and
    heterozygous loss of WBP11 function causes overlapping cardiac, vertebral,
    tracheo-esophageal, renal and limb defects, i.e. a VACTERL-like picture.
    The authors of the WBP4 report explicitly draw this parallel and endorse
    considering loss-of-function alleles of either gene as a cause of VACTERL
    association. The two are nevertheless distinct entities and must not be
    merged.
  distinguishing_features:
  - "WBP11-related disease is caused by heterozygous (haploinsufficient) alleles, whereas NEDHFDB requires biallelic complete loss of WBP4."
  - "The WBP11 phenotype is dominated by structural congenital malformations; severe global developmental delay, hypotonia and intellectual disability are the consistent core of NEDHFDB."
  - "The causal gene differs - WBP11 (hgnc:16461) versus WBP4 (hgnc:12739)."
  evidence:
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report novel heterozygous predicted loss-of-function (LoF) and
      predicted damaging missense variants in the WW domain binding protein 11
      (WBP11) gene in seven unrelated families with a variety of overlapping
      congenital malformations, including cardiac, vertebral, tracheo-esophageal,
      renal and limb defects.
    explanation: >-
      Defines the WBP11 human phenotype and its dominant, heterozygous
      inheritance, the principal contrast with NEDHFDB.
  - reference: PMID:33276377
    reference_title: Heterozygous loss of WBP11 function causes multiple congenital defects in humans and mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Wbp11 heterozygous null mice are small and exhibit defects in axial
      skeleton, kidneys and esophagus, similar to the affected individuals,
      supporting the role of WBP11 haploinsufficiency in the development of
      congenital malformations in humans.
    explanation: >-
      Mouse evidence supporting WBP11 haploinsufficiency as the mechanism of the
      differential entity. Tagged MODEL_ORGANISM because it reports whole-animal
      data.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      loss-of function WBP11 and WBP4 variants should be considered as a
      possible cause of VACTERL association.
    explanation: >-
      The WBP4 authors explicitly align their findings with the WBP11 report
      and endorse considering either gene in VACTERL association, which is why
      this is the primary mechanistic differential. Tagged OTHER because it is
      an interpretive discussion statement rather than clinical data.
- name: VACTERL association
  description: >-
    The most severely affected individual in the defining cohort met clinical
    criteria for VACTERL association, and the authors propose that biallelic
    WBP4 loss of function should be considered among its causes. VACTERL
    association is therefore both a differential and, in this individual, the
    presenting clinical label. A VACTERL presentation with global developmental
    delay, hypotonia and severe intellectual disability in a consanguineous
    family should prompt WBP4 analysis.
  distinguishing_features:
  - "Idiopathic VACTERL association is defined by the malformation pattern alone and is not typically accompanied by severe global developmental delay and intellectual disability."
  - "NEDHFDB is confirmed by biallelic WBP4 loss-of-function alleles with parental carrier segregation."
  disease_term:
    preferred_term: VACTERL association
    term:
      id: MONDO:0008642
      label: VACTERL/vater association
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One individual F2-II:1 presented the VACTERL association that comprises
      patients with at least three of the following characteristic features
    explanation: >-
      Documents that one affected individual met VACTERL criteria, making
      VACTERL association a genuine differential for this entity.
- name: Mandibulofacial dysostosis with microcephaly (EFTUD2-related)
  description: >-
    A mechanistically adjacent spliceosomopathy. EFTUD2 encodes a
    U5 snRNP GTPase and its haploinsufficiency causes mandibulofacial
    dysostosis with microcephaly, combining craniofacial dysmorphism,
    developmental delay and intellectual disability. It is a differential
    because a spliceosome-component defect presenting with dysmorphism plus
    neurodevelopmental impairment is the shared surface pattern.
  distinguishing_features:
  - "EFTUD2-related disease is autosomal dominant and usually de novo; NEDHFDB is autosomal recessive."
  - "Malar and mandibular hypoplasia with ear malformations and conductive hearing loss is the defining craniofacial signature of the EFTUD2 disorder; no such recurrent mandibulofacial gestalt has been defined for NEDHFDB."
  - "Microcephaly is a defining feature of the EFTUD2 disorder and is not part of the NEDHFDB definition."
  disease_term:
    preferred_term: mandibulofacial dysostosis-microcephaly syndrome
    term:
      id: MONDO:0012516
      label: mandibulofacial dysostosis-microcephaly syndrome
  evidence:
  - reference: PMID:37963460
    reference_title: Bi-allelic loss-of-function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Over two dozen spliceosome proteins are involved in human diseases, also
      referred to as spliceosomopathies.
    explanation: >-
      Establishes the spliceosomopathy differential class to which the EFTUD2
      disorder belongs. The comparison is a curator-drawn class-level
      differential, so the evidence is marked PARTIAL.
  notes: >-
    Included because it is one of the recurrently confused spliceosomopathies
    for this entity. The distinguishing features are drawn from the MONDO/
    Orphanet definition of the EFTUD2 disorder rather than from a head-to-head
    comparison in the literature; no publication compares the two directly.
- name: Nager acrofacial dysostosis (SF3B4-related)
  description: >-
    Another mechanistically adjacent spliceosomopathy, and a particularly
    relevant one because SF3B4 is a documented direct interaction partner of
    WBP4 within the early spliceosomal complex. Nager syndrome combines
    mandibulofacial dysostosis with preaxial limb defects.

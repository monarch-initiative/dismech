- name: Loss of WBP4 Restraint on SNRNP200 in the Spliceosomal B Complex
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    WBP4 (FBP21) is a 376-amino-acid protein with a zinc finger motif and two
    tandem WW domains that is present exclusively in the spliceosomal B
    complex, acting immediately before catalytic activation. Biochemical and
    biophysical work on the protein shows that an intrinsically disordered
    region binds the C-terminal Sec63 unit of the RNA helicase Brr2
    (SNRNP200) and allosterically inhibits its helicase activity, and that
    direct binding of the protein to the U4/U6 di-snRNA reduces the pool of
    unwound U4/U6. Because SNRNP200-driven U4/U6 unwinding is the irreversible
    commitment step of the B-to-Bact transition, losing this brake is expected
    to alter the kinetics of catalytic activation and hence splice-site
    selection. The node is marked PROVISIONAL because the biochemical
    inhibition was characterized in reconstituted systems, and de-repression of
    SNRNP200 has not been measured directly in WBP4-null patient cells. The
    biochemical evidence is therefore curated as PARTIAL for this
    disease-state node rather than as direct support.

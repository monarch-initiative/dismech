inheritance:
- name: Autosomal recessive
  description: >-
    All reported affected individuals are homozygous for a loss-of-function
    WBP4 allele, with heterozygous carrier parents and unaffected heterozygous
    or wild-type siblings. Several families are consanguineous. No affected
    heterozygote has been reported, and heterozygous parents retain
    approximately half the normal WBP4 protein level without a clinical
    phenotype, consistent with a recessive, complete-loss-of-function
    mechanism.
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37963460
    reference_title: Bi-allelic loss-of-function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis revealed five different homozygous loss-of-function
      variants in WBP4.
    explanation: >-
      Every reported proband is homozygous for a loss-of-function allele,
      establishing biallelic (autosomal recessive) inheritance.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation study by Sanger sequencing revealed that the parents were
      heterozygous carriers, affected individuals were homozygous for the
      variant, and two unaffected siblings were either heterozygous or
      homozygous wild type (WT)
    explanation: >-
      Explicit segregation data in the index family: homozygous affected,
      heterozygous unaffected carriers, consistent with autosomal recessive
      inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The defining 2023 report describes ten individuals from eight families in
    the peer-reviewed version and eleven individuals from the same eight
    families in the preprint; the count reflects reported cases ascertained
    through GeneMatcher, not an estimated population rate. No prevalence,
    incidence or carrier-frequency estimate has been published, so no
    rate_per_100000 is asserted.
  evidence:
  - reference: PMID:37963460
    reference_title: Bi-allelic loss-of-function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through GeneMatcher, we identified ten individuals from eight families
      with a severe neurodevelopmental syndrome featuring variable
      manifestations.
    explanation: >-
      Establishes the size of the only reported cohort, supporting an
      ultra-rare, cases-in-literature prevalence record.
progression:
- phase: Prenatal and perinatal
  age_range: Pregnancy through the neonatal period
  notes: >-
    The earliest manifestations are prenatal in the severely affected end of
    the spectrum: intrauterine growth restriction, oligohydramnios and
    ultrasound-detected structural anomalies, followed by preterm delivery and
    birth growth parameters below the third percentile. Congenital
    malformations, where present, are established by this point.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral hydronephrosis, intrauterine growth retardation (IUGR) and mild
      oligohydramnios were seen during pregnancy in ultrasound.
    explanation: >-
      Documents that the earliest detectable manifestations are prenatal in
      severely affected individuals.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At birth, all his growth parameters were below the 3rd percentile
    explanation: >-
      Documents that growth failure is already established at birth in the
      severely affected proband.
- phase: Infancy and childhood
  age_range: Infancy onward
  notes: >-
    Hypotonia, feeding difficulty and failure to thrive dominate infancy;
    developmental delay becomes apparent as milestones are missed, and
    intellectual disability and atypical behavior are recognized later in
    childhood. The disorder is a static-lesion developmental condition rather
    than a documented progressive neurodegeneration - no regression has been
    reported - although the published follow-up is too short and too small to
    exclude progression.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common clinical features among the affected individuals in eight
      families were global developmental delay, muscular hypotonia, dysmorphic
      facial features and feeding difficulties or failure to thrive
    explanation: >-
      Establishes the features that dominate the infantile and early childhood
      course.
- phase: Outcome
  age_range: Highly variable
  notes: >-
    Outcome spans the full width of the reported spectrum. At the mild end an
    affected individual has intellectual disability and motor delay; at the
    severe end an affected individual had multiple malformations and died
    prematurely. No survival data, life-expectancy estimate or validated
    prognostic marker exists, and severity cannot currently be predicted from
    the genotype - both extremes share complete absence of WBP4 protein.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals F1-II:1 and F2-II:1 presented the two sides of the spectrum,
      with one displaying a severe phenotype leading to multiple malformations
      and premature death (F2-II:1) and one only showing much less severe
      phenotype, with mainly intellectual disability and motor delay.
    explanation: >-
      Documents both the lethal outcome at the severe end and the comparatively
      mild outcome at the other, which is the entire basis of the prognostic
      statement.
pathophysiology:
- name: Biallelic WBP4 Loss-of-Function Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Five different homozygous loss-of-function alleles have been reported
    across eight families, comprising frameshift and other truncating variants
    plus a multi-exon deletion. The index allele is
    NM_007187.5:c.499delA p.(Thr167fs) (chr13:g.41072793 GA>G, hg38), predicted
    to introduce a premature stop codon. A second family carries a homozygous
    deletion of the last three exons of WBP4 within a ~6.2 Mb region of loss of
    heterozygosity. All alleles are absent or present at extremely low
    frequency in population databases.

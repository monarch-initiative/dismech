- name: Burn-McKeown syndrome (TXNL4A-related)
  description: >-
    A third spliceosomopathy differential. TXNL4A encodes a U5 snRNP protein
    and biallelic hypomorphic promoter deletions cause Burn-McKeown syndrome, a

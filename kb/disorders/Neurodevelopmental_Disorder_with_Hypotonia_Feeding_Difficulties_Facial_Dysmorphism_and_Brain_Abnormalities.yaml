    for carrier couples. Counseling should cover carrier testing of at-risk
    relatives, prenatal diagnosis and preimplantation genetic testing once the
    familial alleles are known, and should note the striking intrafamilial and
    interfamilial variability in severity - which extends from intellectual
    disability with motor delay to a lethal multiple-malformation presentation
    - so that prognosis is not over-specified from the genotype alone.

- name: WBP4 homozygous deletion of the last three exons
  description: >-
    Homozygous deletion removing the three terminal exons of WBP4
    (chr13:41,074,140-41,090,168, hg38), located within a ~6.2 Mb region of
    loss of heterozygosity. Initially missed by trio exome analysis and
    detected only after RNA sequencing showed very low WBP4 expression,
    prompting reanalysis of genome data; confirmed by Sanger sequencing. The
    residual transcript terminates at exon 7 of 10 and no protein is
    detectable. Carried by the most severely affected individual, who had
    VACTERL association and died prematurely.

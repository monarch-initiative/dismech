- name: Transcriptome-Wide Aberrant Pre-mRNA Splicing
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    RNA sequencing of primary fibroblasts from two unrelated WBP4-null probands
    versus their heterozygous parents identified 5,675 differential splicing
    events in 2,859 genes in the first proband and 2,868 events in 1,555 genes
    in the second. All splicing-event classes were affected - skipped exons,
    alternative 5' and 3' splice sites, mutually exclusive exons and intron
    retention - consistent with a general loss of splice-site fidelity rather
    than a single mis-spliced target. 619 genes were differentially spliced in
    both probands despite different alleles and different ethnic backgrounds,
    and principal-component analysis separated each proband from his parents
    and from healthy WBP4-wild-type children.

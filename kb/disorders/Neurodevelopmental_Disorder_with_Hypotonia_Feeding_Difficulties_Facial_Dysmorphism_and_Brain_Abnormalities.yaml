genetic:
- name: WBP4
  gene_term:
    preferred_term: WBP4
    term:
      id: hgnc:12739
      label: WBP4
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Homozygous loss-of-function variants in WBP4 cause this disorder. Five
    distinct alleles were identified across eight unrelated families
    ascertained through GeneMatcher, with segregation consistent with
    autosomal recessive inheritance in the families tested, and all alleles
    absent or present at extremely low frequency in population databases.
    Functional support is direct: complete absence of WBP4 protein in patient
    fibroblasts and a shared aberrant splicing signature in two unrelated
    probands carrying different alleles. WBP4 had not previously been
    associated with any human phenotype in OMIM.
  evidence:
  - reference: PMID:37963460
    reference_title: Bi-allelic loss-of-function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that bi-allelic variants in WBP4 cause a developmental
      disorder with variable presentations, adding to the growing list of human
      spliceosomopathies.
    explanation: The authors' own statement of the gene-disease causal claim.
  - reference: PMID:37963460
    reference_title: Bi-allelic loss-of-function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WW domain-binding protein 4 (WBP4) is part of the early spliceosomal
      complex and has not been previously associated with human pathologies in
      the Online Mendelian Inheritance in Man (OMIM) database.
    explanation: >-
      Establishes that this is a novel gene-disease relationship at the time of
      the defining report.
variants:
- name: WBP4 NM_007187.5:c.499delA p.(Thr167fs)
  description: >-
    Homozygous frameshift variant identified in two affected siblings from a
    consanguineous family (chr13:g.41072793 GA>G, hg38), predicted to result in
    a premature stop codon. Absent from gnomAD. WBP4 mRNA was reduced in this
    proband, consistent with nonsense-mediated decay, and WBP4 protein was
    undetectable on immunoblot of his fibroblasts.
  gene:
    preferred_term: WBP4
    term:
      id: hgnc:12739
      label: WBP4
  clinical_significance: PATHOGENIC

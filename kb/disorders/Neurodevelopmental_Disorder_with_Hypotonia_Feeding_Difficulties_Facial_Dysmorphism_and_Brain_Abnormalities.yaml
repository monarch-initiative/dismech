discussions:
- discussion_id: nedhfdb_missplicing_to_phenotype_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which specific mis-splicing events in WBP4-null cells are functionally
    responsible for the neurodevelopmental phenotype, and does transcriptome-wide
    loss of splice-site fidelity act through a small number of dosage-sensitive
    neurodevelopmental regulators or through cumulative proteome-wide burden?
  attaches_to:
  - pathophysiology#Mis-splicing of Neurodevelopmental and Musculoskeletal Gene Sets
  - pathophysiology#Disrupted Brain Development
  rationale: >-
    The load-bearing step of this pathograph is unproven. What has been shown is
    a statistical association: thousands of splicing changes in patient
    fibroblasts, of which 619 genes are shared between two probands, and a
    human-phenotype enrichment for nervous-system and musculoskeletal terms. No
    individual mis-splicing event has been shown to produce a functional protein
    deficit, no rescue experiment establishes specificity, and the analysis was
    performed in fibroblasts rather than neural tissue. The authors close the
    paper by explicitly calling for further functional work. Until this is
    resolved, the causal edges from mis-splicing to the clinical phenotype are
    curated as INDIRECT_UNKNOWN_INTERMEDIATES and the downstream nodes as
    PROVISIONAL.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Larger cohort of affected individuals is necessary to recapitulate the
      entire spectrum of the WBP4-related disorder, and further functional
      studies are called for better understanding of the mechanism of
      pathogenicity.
    explanation: >-
      The authors explicitly identify the mechanism of pathogenicity as
      unresolved and call for further functional studies.
  proposed_experiments:
  - experiment_id: nedhfdb_exp_neural_splicing
    name: Splicing analysis in WBP4-null human neural cells
    description: >-
      Generate isogenic WBP4-null human iPSC lines, differentiate to neural
      progenitors, cortical neurons and cerebral organoids, and perform
      long-read and short-read RNA sequencing to define the neural mis-splicing
      landscape, then intersect it with the fibroblast signature.
    decision_criterion: >-
      A defined set of neurodevelopmental transcripts is aberrantly spliced in
      WBP4-null neural cells with a measurable reduction in functional protein
      isoform, and that set overlaps the fibroblast signature significantly.
    would_support:
    - pathophysiology#Mis-splicing of Neurodevelopmental and Musculoskeletal Gene Sets
    would_refute:
    - pathophysiology#Mis-splicing of Neurodevelopmental and Musculoskeletal Gene Sets
  - experiment_id: nedhfdb_exp_rescue
    name: Wild-type WBP4 rescue for specificity
    description: >-
      Re-express wild-type WBP4 in patient-derived fibroblasts and in isogenic
      null neural cells and test whether the shared aberrant splicing events
      normalize, establishing that they are caused by WBP4 loss rather than by
      background genetic or culture differences.
    decision_criterion: >-
      Normalization of a substantial fraction of the shared differential
      splicing events on wild-type WBP4 re-expression.
    would_support:
    - pathophysiology#Transcriptome-Wide Aberrant Pre-mRNA Splicing
    would_refute:
    - pathophysiology#Transcriptome-Wide Aberrant Pre-mRNA Splicing
  - experiment_id: nedhfdb_exp_snrnp200_derepression
    name: Direct test of SNRNP200 de-repression in WBP4-null cells
    description: >-
      Measure U4/U6 unwinding kinetics and SNRNP200 helicase activity in
      spliceosomes purified from WBP4-null versus control cells, and test
      whether pharmacological or genetic attenuation of SNRNP200 partially
      normalizes the aberrant splicing signature.
    decision_criterion: >-
      Increased U4/U6 unwinding or accelerated B-to-Bact transition in
      WBP4-null cells, with partial rescue of mis-splicing on SNRNP200
      attenuation.
    would_support:
    - pathophysiology#Loss of WBP4 Restraint on SNRNP200 in the Spliceosomal B Complex
    would_refute:
    - pathophysiology#Loss of WBP4 Restraint on SNRNP200 in the Spliceosomal B Complex
- discussion_id: nedhfdb_fibroblast_to_brain_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the splicing changes measured in WBP4-null patient dermal fibroblasts
    faithfully represent the splicing changes occurring in the developing human
    brain, the tissue whose dysfunction defines this disorder?
  attaches_to:
  - pathophysiology#Transcriptome-Wide Aberrant Pre-mRNA Splicing
  - pathophysiology#Mis-splicing of Neurodevelopmental and Musculoskeletal Gene Sets
  rationale: >-
    This is a model-fidelity question rather than an absence of evidence. Robust
    experimental data do exist, but exclusively from a mesenchymal, skin-derived,
    postnatal cell type. Alternative splicing is strongly cell-type and
    developmental-stage specific, so a nervous-system phenotype enrichment
    derived from fibroblasts is a proxy, not a measurement of the affected
    tissue. Two concrete signals in the data support treating the mismatch as
    real rather than theoretical: the differential-expression analysis returned a
    skin-phenotype enrichment that the authors themselves attribute to comparing
    young probands against adult parental fibroblasts rather than to disease
    biology, and WBP4 expression is reported as highest in skeletal and cardiac
    muscle rather than in fibroblasts or brain. Resolving this requires the same
    measurements in human neural cells, which is why the proposed experiments in
    the companion knowledge gap are the route to closure.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We hypothesis that skin diseases enrichment which is not part of the
      probands' phenotypes could suggest a difference in gene expression of
      skin-related genes between the young probands and their adult parents'
      fibroblasts.
    explanation: >-
      The authors' own acknowledgement that part of the fibroblast signal is an
      artifact of cell type and donor age rather than disease biology, which is
      the concrete basis for the model-fidelity concern.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      While, WBP4 is expressed in all tissues it was found to be higher in the
      skeletal and heart muscles
    explanation: >-
      Tissue-expression asymmetry, cited by the authors from an external
      expression resource, means the fibroblast compartment is not where WBP4
      is most abundant, compounding the fidelity concern. Tagged OTHER because
      it reports an external expression database rather than data generated in
      this study.
- discussion_id: nedhfdb_variable_expressivity_unexplained
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does complete WBP4 protein loss produce a phenotype ranging from
    intellectual disability with motor delay to a lethal VACTERL-like multiple
    malformation syndrome, when both extremes share the same null protein state
    and overlapping splicing signatures?
  attaches_to:
  - pathophysiology#Complete Loss of WBP4 Protein
  - pathophysiology#Disrupted Craniofacial and Multisystem Morphogenesis
  rationale: >-
    Allele nature cannot readily explain the spectrum: both the mildest and the
    most severe probands have complete ablation of WBP4 protein on immunoblot
    and share 619 differentially spliced genes, yet one has a
    multiple-malformation lethal course and the other mainly intellectual
    disability and motor delay. The authors raise two non-exclusive
    possibilities - the different nature of the underlying lesion (large
    deletion versus frameshift, potentially affecting neighbouring sequence) and
    variable expressivity as an intrinsic property of spliceosomopathies, citing
    the CWC27 precedent. Genetic modifiers and stochastic developmental effects
    remain untested. This matters clinically because it is the principal barrier
    to genotype-based prognostication in counseling.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals F1-II:1 and F2-II:1 presented the two sides of the spectrum,
      with one displaying a severe phenotype leading to multiple malformations
      and premature death (F2-II:1) and one only showing much less severe
      phenotype, with mainly intellectual disability and motor delay.
    explanation: >-
      Documents the extremes of the phenotypic spectrum that the question asks
      about.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This is also supported by the fact that both patients were shown to have
      complete loss of WBP4 protein.
    explanation: >-
      Establishes that the severity difference is not explained by residual
      protein, which is what makes the variability a genuine open question.

- name: Complete Loss of WBP4 Protein
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Immunoblotting of primary fibroblasts from two affected individuals
    carrying different WBP4 alleles showed total ablation of WBP4 protein,
    while heterozygous parents retained approximately half the wild-type
    level. WBP4 mRNA was reduced in the frameshift proband, as expected for
    nonsense-mediated decay, and the transcript in the deletion proband
    terminated at exon 7 of 10. This is a true null state rather than a
    hypomorphic or dominant-negative one, and it explains why two distinct
    alleles converge on a shared molecular consequence.

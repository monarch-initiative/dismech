- name: Mis-splicing of Neurodevelopmental and Musculoskeletal Gene Sets
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Human-phenotype enrichment analysis of the 619 genes aberrantly spliced in
    both probands returned abnormalities of the nervous system and of the
    musculoskeletal system, matching the probands' shared clinical features.
    Aberrantly spliced genes with the strongest phenotype match include NFIX,
    TRIO, ANKRD11, SZT2, HUWE1, PIGT, SMARCC2, PEX1, QRICH1 and HRAS, together
    with SMARCA2, HNRNPH1 and TCF4 - all established neurodevelopmental-disease
    genes. Seven of the top ten are autosomal dominant genes, which the authors
    interpret as consistent with partial (dosage-like) mis-splicing mimicking a
    dominant effect. The node is PROVISIONAL because the enrichment is a
    statistical association computed in fibroblasts, not a demonstration that
    any individual transcript is functionally deficient in a patient's brain.

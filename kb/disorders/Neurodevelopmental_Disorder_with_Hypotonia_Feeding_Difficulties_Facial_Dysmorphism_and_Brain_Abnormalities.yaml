name: Neurodevelopmental Disorder with Hypotonia, Feeding Difficulties, Facial Dysmorphism, and Brain Abnormalities
creation_date: '2026-08-17T00:00:00Z'
category: Mendelian
synonyms:
- NEDHFDB
- WBP4-related neurodevelopmental disorder
- WBP4-related spliceosomopathy
description: >-
  Neurodevelopmental disorder with hypotonia, feeding difficulties, facial
  dysmorphism, and brain abnormalities (NEDHFDB; OMIM:620852) is an ultra-rare
  autosomal recessive spliceosomopathy caused by biallelic loss-of-function
  variants in WBP4, which encodes the B-complex-specific spliceosome protein
  WBP4 (formerly FBP21). The entity was delineated in 2023 in a GeneMatcher
  cohort of ten to eleven affected individuals from eight families carrying
  five different homozygous loss-of-function alleles. The most common
  manifestations are global developmental delay, muscular hypotonia, dysmorphic
  facial features and feeding difficulties or failure to thrive; morphological
  central nervous system abnormalities, atypical behavior and moderate to
  severe intellectual disability occur in almost half of affected individuals,
  and congenital cardiac, gastrointestinal, skeletal and urogenital anomalies
  occur in a subset. Expressivity is strikingly variable, ranging from
  intellectual disability with motor delay to a lethal multiple-malformation
  presentation meeting criteria for VACTERL association. Mechanistically, WBP4
  enters the precatalytic spliceosomal B complex immediately before catalytic
  activation, where it binds and allosterically inhibits the RNA helicase
  SNRNP200 (Brr2) and binds the U4/U6 di-snRNA; complete loss of the protein in
  patient fibroblasts produces thousands of aberrant splicing events enriched
  for nervous-system and musculoskeletal genes. The step linking that
  transcriptome-wide mis-splicing to the specific developmental phenotype
  remains unresolved and is recorded here as an open knowledge gap rather than
  asserted.

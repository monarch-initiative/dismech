  - target: Intrauterine growth retardation
    causal_link_type: UNKNOWN
    description: >-
      Prenatal growth restriction is grouped here as the earliest multisystem
      growth manifestation, preceding the postnatal failure to thrive. This is
      a temporal and organizational grouping, not a demonstrated causal step,
      hence UNKNOWN.
  - target: Recurrent infections

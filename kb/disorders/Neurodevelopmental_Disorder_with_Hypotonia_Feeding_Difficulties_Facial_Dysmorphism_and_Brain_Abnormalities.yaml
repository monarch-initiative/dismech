  - target: Musculoskeletal abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The musculoskeletal arm is the one with independent molecular corroboration:
      the shared aberrantly spliced gene set is enriched for musculoskeletal as
      well as nervous-system phenotype terms, and WBP4 is expressed most highly
      in skeletal and cardiac muscle.
  - target: Sensorineural hearing impairment
    causal_link_type: UNKNOWN
    description: >-
      Grouped with the craniofacial/multisystem arm because the inner ear is a
      craniofacial developmental derivative. Reported in one individual; the
      causal route is not established, hence UNKNOWN rather than an asserted

    causal_link_type: UNKNOWN
    description: >-
      Convergent strabismus is grouped with the brain-development arm as a
      neuro-ophthalmologic finding accompanying optic atrophy. Reported in one
      individual; the causal route is not established.
  - target: Optic atrophy
    causal_link_type: UNKNOWN
    description: >-
      The optic nerve is a central nervous system tract, so optic atrophy is
      grouped with the brain-development arm on anatomical grounds. Reported in
      one affected individual; the causal route is not established, hence
      UNKNOWN rather than an asserted indirect causal link.
  - target: Feeding difficulties
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Feeding difficulty and dysphagia in this disorder are attributed to the
      central hypotonia and bulbar dysfunction of the neurodevelopmental arm;
      no intrinsic gastrointestinal pathology has been established as their
      cause.
  - target: Dysphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Swallowing difficulty is attributed to the same central hypotonia and
      bulbar dysfunction as the feeding difficulty, rather than to a structural
      gastrointestinal lesion.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Postnatal growth failure is placed on this arm rather than the
      multisystem arm because its documented proximate cause in this disorder
      is the feeding difficulty and dysphagia arising from central hypotonia
      and bulbar dysfunction.
- name: Disrupted Craniofacial and Multisystem Morphogenesis
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    The non-neurological arm: dysmorphic facial features in most affected
    individuals, and, in a subset, congenital anomalies of the heart,
    gastrointestinal tract, skeleton and urogenital system. In the most
    severely affected individual these coalesced into a clinical diagnosis of
    VACTERL association with anal atresia, atrial septal defect, hypospadias,
    cryptorchidism and bilateral hydronephrosis. WBP4 is expressed
    ubiquitously but most highly in skeletal and cardiac muscle, which the
    authors relate to the musculoskeletal mis-splicing signature and the
    cardiac anomaly.
  evidence:
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In some cases congenital abnormalities of the heart, gastrointestinal,
      skeletal and/or urogenital system were evident.
    explanation: >-
      Establishes the multisystem congenital-anomaly arm as a recognized but
      inconsistent component of the syndrome.
  - reference: PMID:37425688
    reference_title: Biallelic loss of function variants in WBP4, encoding a spliceosome protein, result in a variable neurodevelopmental delay syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, the VACTERL association was diagnosed.
    explanation: >-
      Documents the extreme end of the multisystem arm in the most severely
      affected proband.
  downstream:

notes: >-
  Named-entity-confusion preflight. MONDO:0971043 was verified with OAK to carry
  xref OMIM:620852 and relationship RO:0004003 to HGNC:12739 (WBP4), matching the
  gene and OMIM identity asserted throughout this entry. This is one of a large
  series of near-identically named "neurodevelopmental disorder with ..." OMIM
  entities, so the check was run before any deep-research content was used. The
  falcon deep-research report was additionally checked with `just preflight-dr`
  and passed (WBP4 mentioned 23 times, top gene by a wide margin). Care was taken
  not to conflate WBP4 with the other WW-domain-binding-protein genes; WBP11 in
  particular has its own distinct congenital-malformation phenotype and is
  curated here only as a differential diagnosis.

  GeneReviews. No GeneReviews chapter exists for this disorder or for WBP4. A
  PubMed search for "WBP4 GeneReviews[All Fields]" run on 2026-08-17 returned
  zero results, as did a search for the disease name with GeneReviews[TI]. No
  GeneReviews phenotype baseline was therefore available, which is expected given
  that the entity was first described in 2023.

  Deep research. One provider was run: falcon (Edison), report at
  research/Neurodevelopmental_Disorder_with_Hypotonia_Feeding_Difficulties_Facial_Dysmorphism_and_Brain_Abnormalities-deep-research-falcon.md.
  The report is explicit that it could not retrieve the primary paper's
  patient-level content and that its only substantive source is an Open Targets
  query, so it supplied no citable snippets. It was used only for orientation
  (confirming the gene, the recessive mechanism, the absence of clinical trials
  and the absence of any animal or stem-cell model) and its suggested ontology
  terms were re-derived from OAK rather than trusted. All evidence in this entry
  comes from the four primary references, each fetched with `just
  fetch-reference` and snippet-verified.

  Cohort size discrepancy. The peer-reviewed AJHG report (PMID:37963460)
  describes ten individuals from eight families; the earlier medRxiv preprint
  (PMID:37425688) describes eleven individuals from the same eight families. The
  discrepancy is left visible rather than silently reconciled. The preprint is
  cited for detailed clinical and experimental content because it is the
  open-access full text and the peer-reviewed record is abstract-only in the
  cache; the peer-reviewed version is cited for all cohort-level summary claims.

  Frequency policy. No numerator/denominator table is available in either cached
  record, so no frequency band is derived arithmetically. Bands are mapped from
  the source's own qualitative language using the project's literature-term
  mapping: "most common clinical features" and "almost half of the patients" both
  fall in the FREQUENT band (30-79%). Features documented in a single individual
  carry no frequency at all. Group-level HP terms (Abnormal facial shape,
  Abnormal brain morphology, Abnormality of the musculoskeletal system) are bound
  where the source reports a category rather than a specific feature, so that a
  cohort-level frequency is never attached to a narrower term than the evidence
  supports.

  Evidence-tagging conventions. `evidence_source` is fixed per PMID+snippet
  across the whole entry: a given quotation always carries the same study-type
  tag wherever it appears. `supports` deliberately does vary for two
  quotations, because the same sentence bears differently on different claims:
  the cohort-level feature lists from PMID:37963460 and PMID:37425688 are
  SUPPORT where they document a phenotype, and PARTIAL where a treatment cites
  them only to establish an indication (the sentence documents the problem, not
  the efficacy of any intervention for it). Background sentences that summarize
  prior literature rather than reporting this study's own data are tagged
  OTHER; patient-fibroblast immunoblot and RNA-seq results are IN_VITRO; the
  Wbp11 mouse result is MODEL_ORGANISM.

  Treatment evidence. No disease-specific treatment study, clinical trial or
  outcome series exists; the falcon report independently confirmed that no
  relevant interventional trial was found. All treatments here are supportive and
  are curated with `supports: PARTIAL` evidence that documents the indication
  rather than any efficacy claim. No clinical_trials section is included, because
  there are none to record.

  Treatment-term ontology. All four treatment action terms are NCIT
  (NCIT:C15433 Nutritional Support, NCIT:C15302 Physical Therapy, NCIT:C121351
  Occupational Therapy, NCIT:C15240 Genetic Counseling), matching the
  TreatmentActionTerm enum, which is reachable only from NCIT:C25218
  (Intervention or Procedure). `therapeutic_modality: BEHAVIORAL` is set only
  on the two therapies CLAUDE.md's mechanical table covers (physical and
  occupational therapy); it is deliberately omitted on nutritional support,
  which spans behavioral and procedural components, and on genetic counseling,
  which CLAUDE.md excludes from mechanical inference as not
  platform-classifiable.

  Model systems. There is no animal model, iPSC model or organoid model of WBP4
  loss; the falcon report confirms this and the primary authors call for
  functional studies. The only experimental system is patient-derived primary
  fibroblasts, curated under `experimental_models` and linked to the pathograph
  via `modeled_mechanisms`. Its limitations for the neural claim are recorded
  both on the PARTIALLY_RECAPITULATES link, which carries an explicit
  `limitations` field and a LOW fidelity rating, and in the
  HUMAN_MODEL_MISMATCH discussion. The Wbp11 null mouse (PMID:33276377) is cited
  only as evidence for the WBP11 differential diagnosis and is deliberately NOT
  modelled as an animal model of this disorder, since it targets a different
  gene.

  Scope boundary. This entry covers the biallelic WBP4 loss-of-function
  neurodevelopmental syndrome only. The VACTERL association presentation in one
  affected individual is curated as a phenotypic extreme of this entity and as a
  differential diagnosis, not as a separate entry.

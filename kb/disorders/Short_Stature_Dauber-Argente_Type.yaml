    reference_title: Adult height and long-term outcomes after rhIGF-1 therapy in two patients with PAPP-A2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Free IGF-1 concentrations increased notably after rhIGF-1 administration
    explanation: >-
      Shows the analyte responds to therapy, confirming it as the operative
      deficit.
- name: Total IGF-1, IGFBP-3 and acid-labile subunit
  presence: INCREASED
  notes: >-
    Raised in every reported family, because the hormone and its carriers
    accumulate in an uncleavable complex. They stay elevated on rhIGF-1 even as
    growth improves, which is itself informative: total concentrations are not
    the treatment target and should not be used to titrate. These three are the
    reliable part of the signature - see the separate record for IGF-II and
    IGFBP-5, which are not.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      elevated circulating total IGF-I, IGFBP-3, and -5, acid labile subunit,
      and IGF-II concentrations
    explanation: >-
      Enumerates the elevated analytes constituting the paradoxical signature.
  - reference: PMID:27648969
    reference_title: Treatment With Recombinant Human Insulin-Like Growth Factor-1 Improves Growth in Patients With PAPP-A2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whereas serum total IGF-1 and IGFBP-3 levels remained elevated
    explanation: >-
      Shows the total analytes do not fall with successful treatment.
- name: Circulating IGF-II and IGFBP-5
  presence: VARIABLE
  notes: >-
    Split out from the main panel because the two index families and the third
    reported family disagree. IGF-II and IGFBP-5 were elevated in the original
    Spanish and second index kindreds, but explicitly not increased in the Saudi
    family, whose diagnosis was otherwise secure on genotype and on the other
    three analytes. This has a direct clinical consequence: a clinician
    requiring elevated IGF-II before considering PAPP-A2 deficiency would have
    missed that kindred. Total IGF-1, IGFBP-3 and ALS are the discriminating
    analytes; these two are supporting at best.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      elevated circulating total IGF-I, IGFBP-3, and -5, acid labile subunit,
      and IGF-II concentrations
    explanation: >-
      The index families, in which both analytes were raised.
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, circulating IGF2 and IGFBP5 were not increased.
    explanation: >-
      The third reported family, in which they were not. Graded REFUTE against
      treating elevated IGF-II and IGFBP-5 as part of the required diagnostic
      signature.
- name: Circulating PAPP-A2 protein
  presence: DECREASED
  notes: >-
    Very low or undetectable, and directly measurable as a targeted screening
    step in the short-stature workup.
  evidence:
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      very low or undetectable levels of this protein can help to focus the
      diagnosis and treatment
    explanation: >-
      States the analyte's level and its diagnostic use.
diagnosis:
- name: Circulating PAPP-A2 measurement
  description: >-
    A targeted screening step in the short-stature workup: PAPP-A2 is very low
    or undetectable, and measuring it directly narrows the differential before
    sequencing.
  evidence:
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pediatric endocrinologists should measure circulating PAPP-A2 levels in
      the study of short stature as very low or undetectable levels of this
      protein can help to focus the diagnosis and treatment
    explanation: >-
      The authors' explicit recommendation for the diagnostic pathway.
- name: Free versus total IGF-1 measurement
  description: >-
    The measurement that makes or breaks the diagnosis. Total IGF-1 is high and
    free IGF-1 is low, so a workup that measures only total IGF-1 - the routine
    assay - reads as reassuring in an affected child. Free IGF-1 or
    size-exclusion chromatography is what exposes the sequestration.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Size-exclusion chromatography showed a significant increase in IGF-I bound
      in its ternary complex. Free IGF-I concentrations were decreased.
    explanation: >-
      The assay and the result that distinguish this disease from IGF-1
      deficiency.
- name: PAPPA2 sequencing
  description: >-
    Definitive confirmation is molecular, demonstrating biallelic PAPPA2
    variants. Where available, in vitro demonstration of absent proteolytic
    activity supports pathogenicity of a novel missense allele - the p.Ala1033Val
    case shows a single substitution can abolish activity completely.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vitro analysis of IGFBP cleavage demonstrated that both mutations cause
      a complete absence of PAPP-A2 proteolytic activity.
    explanation: >-
      The functional assay that confirms pathogenicity of a candidate variant.
treatments:
- name: Recombinant Human IGF-1 (Mecasermin)
  description: >-
    rhIGF-1 given twice daily at escalating doses (40 to 120 micrograms/kg)
    supplies free hormone downstream of the blocked release step. In the two
    Spanish p.D643fs25* siblings, one-year data showed increased growth velocity
    and height with no hypoglycaemia or other adverse effects, and six-year data
    showed both reaching target height with progressive normalisation of bone
    mineral density and increased lean mass. Total IGF-1 and IGFBP-3 stay
    elevated throughout, so they cannot be used to monitor response.

    That clean safety record is specific to those two patients and should not be
    read as a property of the treatment. In a separately reported family the
    older brother developed severe headaches from raised intracranial
    hypertension, attributed to the rhIGF-1, and therapy was discontinued; the
    symptoms resolved on stopping. Intracranial hypertension is a recognised
    class effect of mecasermin, so it is the adverse event to monitor for
    rather than an isolated curiosity.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mecasermin
      term:
        id: NCIT:C2262
        label: Mecasermin
  target_mechanisms:
  - target: IGF-1 Sequestration in the Ternary Complex
    treatment_effect: BYPASSES
    description: >-
      Exogenous IGF-1 supplies free hormone directly rather than restoring the
      proteolytic release step. This is a bypass, not a repair: the sequestered
      pool remains sequestered, which is exactly why total IGF-1 stays high
      while free IGF-1 and growth improve.
    evidence:
    - reference: PMID:27648969
      reference_title: Treatment With Recombinant Human Insulin-Like Growth Factor-1 Improves Growth in Patients With PAPP-A2 Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bioactive IGF-1 was increased, and spontaneous GH secretion was
        diminished after acute administration of rhIGF-1, whereas serum total
        IGF-1 and IGFBP-3 levels remained elevated.
      explanation: >-
        The dissociation between rising bioactive IGF-1 and unchanged total
        IGF-1 is the signature of bypassing rather than correcting the block.
  evidence:
  - reference: PMID:27648969
    reference_title: Treatment With Recombinant Human Insulin-Like Growth Factor-1 Improves Growth in Patients With PAPP-A2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a clear increase in growth velocity and height in both siblings.
    explanation: >-
      The primary one-year efficacy observation.
  - reference: PMID:34358737
    reference_title: Adult height and long-term outcomes after rhIGF-1 therapy in two patients with PAPP-A2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth velocity continued to increase and both patients achieved their
      target height. Free IGF-1 concentrations increased notably after rhIGF-1
      administration, with serum IGFBP-3, IGFBP-5 and ALS levels also being
      higher during treatment. BMD was progressively normalized and an increase
      in lean mass was also noted during treatment.
    explanation: >-
      The long-term outcome data, including the height and bone-density
      endpoints.
  - reference: PMID:34358737
    reference_title: Adult height and long-term outcomes after rhIGF-1 therapy in two patients with PAPP-A2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An increase in the growth of kidney and spleen length was observed in one
      of the patients.
    explanation: >-
      Records an organ-growth observation on long-term therapy in the Spanish
      siblings. Reported without attributed harm, unlike the intracranial
      hypertension below.
  - reference: PMID:29280739
    reference_title: "Novel Modulators of the Growth Hormone - Insulin-Like Growth Factor Axis: Pregnancy-Associated Plasma Protein-A2 and Stanniocalcin-2."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unfortunately, the older brother developed severe headaches caused by
      increased intracranial hypertension, presumably due to the rhIGF-1
      treatment, leading to the discontinuation of therapy. After stopping the
      rhIGF-1 treatment, his symptoms completely resolved
    explanation: >-
      A treatment-limiting adverse event attributed to rhIGF-1, at the same dose
      ceiling this entry describes, in a patient who discontinued and then
      recovered. Graded REFUTE against the reading that rhIGF-1 has been
      uneventful in treated PAPP-A2 deficiency, which the two-sibling safety
      data alone would suggest.
differential_diagnoses:
- name: Acid-labile subunit (IGFALS) deficiency
  description: >-
    The closest mimic, and separated by the direction of the IGF-1 abnormality
    rather than by the clinical picture. Both are autosomal recessive ternary
    complex disorders with mild postnatal growth failure and insulin
    insensitivity. ALS deficiency has severely *reduced* IGF-1 and IGFBP-3 that
    stay low after GH treatment; PAPP-A2 deficiency has *elevated* total IGF-1,
    IGFBP-3 and ALS with low free IGF-1. Measuring total IGF-1 alone will
    separate them; measuring it alone will also miss PAPP-A2 deficiency
    entirely.
  evidence:
  - reference: PMID:20679994
    reference_title: Deficiency of the insulin-like growth factor-binding protein acid-labile subunit (ALS) of the circulating ternary complex in children with short stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complete ALS deficiency is characterized by severe reduction of IGF-I and
      IGFBP-3 that remain low after GH treatment, associated with mild growth
      retardation, much less pronounced than the IGF-I deficit.
    explanation: >-
      States the ALS-deficiency biochemical profile, which is the inverse of the
      PAPP-A2 profile in the discriminating analytes.
animal_models:
- name: Pappa2 constitutive knockout mouse
  species: Mouse
  genotype: Pappa2 homozygous null
  publication: PMID:21586553
  description: >-
    Normal size at birth with postnatal growth retardation and reduced adult
    femur and body length, reproducing the human postnatal-onset pattern.
    Notably, bone mineral density is not significantly affected in the mouse
    although it is reduced in patients.
  modeled_mechanisms:
  - target: Progressive Postnatal Growth Failure and Skeletal Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reproduces normal birth size followed by postnatal growth
      retardation and reduced long-bone length.
    limitations: >-
      Bone mineral density is explicitly unaffected in the knockout mouse but is
      reduced in patients, so the model does not cover the bone-density arm of
      this node. The growth deficit is also strongly sex-dimorphic in the mouse
      (10% in males versus 25-30% in females), a dimorphism not established in
      the small human series.
    readouts:
    - name: Adult body weight relative to wild-type littermates
      target: Progressive Postnatal Growth Failure and Skeletal Deficit
      direction: DECREASED
      interpretation: >-
        Quantifies the postnatal growth deficit, separately by sex.
      evidence:
      - reference: PMID:21586553
        reference_title: "Pregnancy-associated plasma protein-A2 (PAPP-A2): tissue expression and biological consequences of gene knockout in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Male and female PAPP-A2 KO mice had 10 and 25-30% lower body weight,
          respectively, than WT littermates.
        explanation: >-
          Reports the body-weight measurement behind this readout.
    - name: Adult femur and body length
      target: Progressive Postnatal Growth Failure and Skeletal Deficit
      direction: DECREASED
      interpretation: >-
        Skeletal correlate of the longitudinal growth deficit.
      evidence:
      - reference: PMID:21586553
        reference_title: "Pregnancy-associated plasma protein-A2 (PAPP-A2): tissue expression and biological consequences of gene knockout in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Adult femur and body length were also reduced in PAPP-A2 KO mice, but
          without significant effects on bone mineral density.
        explanation: >-
          Reports both the length measurement and the negative bone-density
          result that bounds this model's fidelity.
    evidence:
    - reference: PMID:21586553
      reference_title: "Pregnancy-associated plasma protein-A2 (PAPP-A2): tissue expression and biological consequences of gene knockout in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The most striking phenotype of the PAPP-A2 KO mouse was postnatal growth
        retardation.
      explanation: >-
        Establishes that the model's dominant phenotype is the same one that
        defines the human disease.
discussions:
- discussion_id: rhpappa2_sex_specific_efficacy
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Recombinant PAPP-A2 would correct the actual lesion rather than bypass it,
    but its efficacy in Pappa2-deficient mice appears female-specific. Does that
    sex-dependence reflect mouse biology or a real constraint on the human
    therapy?
  attaches_to:
  - pathophysiology#Loss of PAPP-A2 Proteolytic Activity
  rationale: >-
    rhIGF-1 works, but it is a bypass: it leaves the sequestered pool sequestered
    and the release step blocked. rhPAPP-A2 is the mechanistically direct
    alternative, and in Pappa2-deficient mice it modulates growth-related IGF-1
    signalling — but the authors report the effect as female-specific. The mouse
    knockout is itself strongly sex-dimorphic in growth deficit (10% versus
    25-30% weight reduction), so the therapeutic dimorphism may simply track the
    larger deficit available to rescue in females rather than a sex-specific
    drug mechanism. The reported human families are too small to establish
    whether any sex difference exists at all, and the two long-term-treated index
    patients are one female and one male sibling. Distinguishing "the drug works
    differently by sex" from "the model has more to rescue in females" matters
    before this reaches a trial design.
  evidence:
  - reference: PMID:38589872
    reference_title: "Sex-based differences in growth-related IGF1 signaling in response to PAPP-A2 deficiency: comparative effects of rhGH, rhIGF1 and rhPAPP-A2 treatments."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      pointing to rhPAPP-A2 as a promising drug to alleviate postnatal growth
      retardation underlying low IGF1 bioavailability in a female-specific manner
    explanation: >-
      States the sex-specific efficacy finding that this discussion is about.
  - reference: PMID:21586553
    reference_title: "Pregnancy-associated plasma protein-A2 (PAPP-A2): tissue expression and biological consequences of gene knockout in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Male and female PAPP-A2 KO mice had 10 and 25-30% lower body weight,
      respectively, than WT littermates.
    explanation: >-
      The baseline sex dimorphism in the untreated model, which is the
      alternative explanation for the treatment dimorphism.
references:
- reference: PMID:26902202
  title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
- reference: PMID:34358737
  title: Adult height and long-term outcomes after rhIGF-1 therapy in two patients with PAPP-A2 deficiency.
- reference: PMID:34272725
  title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
notes: >-
  Why this is a Disease entry. MONDO:0859182 is a leaf term with no descendants
  and one causal gene, and nothing in kb/disorders/ or kb/groupings/ carried the
  ID or the label. The disease has a single conserved pathograph running from
  PAPPA2 loss of function to reduced free IGF-1, so no subtype axis is
  defensible on current evidence.

  Deep research. One OpenScientist report was generated and is committed under
  research/. Its validation was unusually clean: 16/16 references verified with
  a 0.0 confabulation rate, 19/20 terms verified, and the single flagged
  "mislabelled" term was MONDO:0859182 itself, whose reported label was the
  column header "Disease (MONDO)" rather than a real mismatch — the CURIE is
  correct. Every claim taken from the report was nonetheless re-verified against
  the cached abstract it cites.

  Review round 1 (PR #10143) corrected two things that mattered. First, the
  rhIGF-1 safety claim was scoped to the treatment when it belonged to two
  patients: the older brother in a separately reported family developed
  intracranial hypertension attributed to rhIGF-1 and discontinued therapy,
  recovering on withdrawal. That is now a REFUTE evidence item and the
  description says which patients the clean record covers. Second, the
  biochemical panel bundled IGF-II and IGFBP-5 with the three reliable
  analytes; they were explicitly not increased in the Saudi kindred, so they
  are now a separate VARIABLE record carrying both observations. A clinician
  requiring elevated IGF-II would have missed that family.

  Deliberately not curated. No prevalence record: no population rate has been
  published for a disease known from three families, and inventing a
  prevalence_class from "ultra-rare" prose would assert more than the sources
  do. No datasets. The GC-MS metabolomics finding (PMID:30119035) that rhIGF-1
  most affects free fatty acid and amino acid pathways is real and interesting
  but is a treatment-response observation in two patients rather than a disease
  mechanism, so it is not made a pathophysiology node. The STC2 inhibitory arm
  of the IGFBP-STC2-PAPP-A axis is described in PMID:29280739 but no human STC2
  disease is established, so it is left out rather than modelled speculatively.

  Frequency bands are given only for postnatal growth retardation and short
  stature, which every reported patient has. With three families in total, the
  remaining features have no usable denominator and are left unbanded.

  Note on the treatment link type. rhIGF-1 is recorded as BYPASSES rather than
  RESTORES, deliberately. It supplies the product downstream of the blocked
  proteolytic step and does not restore PAPP-A2 activity; the evidence for that
  reading is that total IGF-1 and IGFBP-3 stay elevated on treatment while free
  IGF-1 and growth velocity rise.

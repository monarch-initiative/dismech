biochemical:
- name: Free (bioactive) IGF-1
  presence: DECREASED
  notes: >-
    The single discriminating analyte. Free IGF-1 is reduced despite elevated
    total IGF-1, and it rises notably on rhIGF-1 administration.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Free IGF-I concentrations were decreased.
    explanation: >-
      Direct measurement of the reduced free fraction.
  - reference: PMID:34358737
    reference_title: Adult height and long-term outcomes after rhIGF-1 therapy in two patients with PAPP-A2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Free IGF-1 concentrations increased notably after rhIGF-1 administration
    explanation: >-
      Shows the analyte responds to therapy, confirming it as the operative
      deficit.
- name: Total IGF-1, IGFBP-3, IGFBP-5, ALS and IGF-II
  presence: INCREASED
  notes: >-
    All raised, because the hormone and its carriers accumulate in an uncleavable
    complex. They stay elevated on rhIGF-1 even as growth improves, which is
    itself informative: total concentrations are not the treatment target and
    should not be used to titrate.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      elevated circulating total IGF-I, IGFBP-3, and -5, acid labile subunit,
      and IGF-II concentrations
    explanation: >-
      Enumerates the elevated analytes constituting the paradoxical signature.
  - reference: PMID:27648969
    reference_title: Treatment With Recombinant Human Insulin-Like Growth Factor-1 Improves Growth in Patients With PAPP-A2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whereas serum total IGF-1 and IGFBP-3 levels remained elevated
    explanation: >-
      Shows the total analytes do not fall with successful treatment.
- name: Circulating PAPP-A2 protein
  presence: DECREASED
  notes: >-
    Very low or undetectable, and directly measurable as a targeted screening
    step in the short-stature workup.
  evidence:
  - reference: PMID:34272725

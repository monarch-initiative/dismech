    explanation: >-
      States the analyte's level and its diagnostic use.
treatments:
- name: Recombinant Human IGF-1 (Mecasermin)
  description: >-
    rhIGF-1 given twice daily at escalating doses (40 to 120 micrograms/kg)
    supplies free hormone downstream of the blocked release step. One-year data
    showed increased growth velocity and height with no hypoglycaemia; six-year
    data showed both index siblings reaching target height, progressive
    normalisation of bone mineral density, and increased lean mass. Total IGF-1
    and IGFBP-3 stay elevated throughout, so they cannot be used to monitor
    response.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mecasermin
      term:
        id: NCIT:C2262
        label: Mecasermin
  target_mechanisms:
  - target: IGF-1 Sequestration in the Ternary Complex
    treatment_effect: BYPASSES
    description: >-
      Exogenous IGF-1 supplies free hormone directly rather than restoring the
      proteolytic release step. This is a bypass, not a repair: the sequestered
      pool remains sequestered, which is exactly why total IGF-1 stays high
      while free IGF-1 and growth improve.
    evidence:
    - reference: PMID:27648969
      reference_title: Treatment With Recombinant Human Insulin-Like Growth Factor-1 Improves Growth in Patients With PAPP-A2 Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bioactive IGF-1 was increased, and spontaneous GH secretion was
        diminished after acute administration of rhIGF-1, whereas serum total
        IGF-1 and IGFBP-3 levels remained elevated.
      explanation: >-
        The dissociation between rising bioactive IGF-1 and unchanged total
        IGF-1 is the signature of bypassing rather than correcting the block.
  evidence:
  - reference: PMID:27648969
    reference_title: Treatment With Recombinant Human Insulin-Like Growth Factor-1 Improves Growth in Patients With PAPP-A2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a clear increase in growth velocity and height in both siblings.
    explanation: >-
      The primary one-year efficacy observation.
  - reference: PMID:34358737
    reference_title: Adult height and long-term outcomes after rhIGF-1 therapy in two patients with PAPP-A2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth velocity continued to increase and both patients achieved their
      target height. Free IGF-1 concentrations increased notably after rhIGF-1
      administration, with serum IGFBP-3, IGFBP-5 and ALS levels also being
      higher during treatment. BMD was progressively normalized and an increase
      in lean mass was also noted during treatment.
    explanation: >-
      The long-term outcome data, including the height and bone-density
      endpoints.
  - reference: PMID:34358737
    reference_title: Adult height and long-term outcomes after rhIGF-1 therapy in two patients with PAPP-A2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An increase in the growth of kidney and spleen length was observed in one
      of the patients.
    explanation: >-
      Records the one organ-growth observation on long-term therapy, which is
      the safety signal to watch rather than a reported harm.
differential_diagnoses:
- name: Acid-labile subunit (IGFALS) deficiency
  description: >-
    The closest mimic, and separated by the direction of the IGF-1 abnormality
    rather than by the clinical picture. Both are autosomal recessive ternary
    complex disorders with mild postnatal growth failure and insulin
    insensitivity. ALS deficiency has severely *reduced* IGF-1 and IGFBP-3 that
    stay low after GH treatment; PAPP-A2 deficiency has *elevated* total IGF-1,
    IGFBP-3 and ALS with low free IGF-1. Measuring total IGF-1 alone will
    separate them; measuring it alone will also miss PAPP-A2 deficiency
    entirely.
  evidence:
  - reference: PMID:20679994
    reference_title: Human acid-labile subunit deficiency, clinical, endocrine and metabolic consequences.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complete ALS deficiency is characterized by severe reduction of IGF-I and
      IGFBP-3 that remain low after GH treatment, associated with mild growth
      retardation, much less pronounced than the IGF-I deficit.
    explanation: >-
      States the ALS-deficiency biochemical profile, which is the inverse of the
      PAPP-A2 profile in the discriminating analytes.
animal_models:
- name: Pappa2 constitutive knockout mouse
  species: Mouse
  genotype: Pappa2 homozygous null
  publication: PMID:21586553
  description: >-
    Normal size at birth with postnatal growth retardation and reduced adult
    femur and body length, reproducing the human postnatal-onset pattern.
    Notably, bone mineral density is not significantly affected in the mouse
    although it is reduced in patients.
  modeled_mechanisms:
  - target: Progressive Postnatal Growth Failure and Skeletal Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reproduces normal birth size followed by postnatal growth
      retardation and reduced long-bone length.
    limitations: >-
      Bone mineral density is explicitly unaffected in the knockout mouse but is
      reduced in patients, so the model does not cover the bone-density arm of
      this node. The growth deficit is also strongly sex-dimorphic in the mouse

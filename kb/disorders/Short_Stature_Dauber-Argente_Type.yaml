- name: Insulin Resistance
  biological_scale: ORGANISM
  description: >-
    Insulin resistance, with mild fasting hyperinsulinaemia on normal glucose
    tolerance testing in the index family, improving under rhIGF-1.
  downstream:
  - target: Insulin resistance
    causal_link_type: DIRECT
    description: >-

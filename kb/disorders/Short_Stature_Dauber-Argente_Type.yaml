discussions:
- discussion_id: rhpappa2_sex_specific_efficacy
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Recombinant PAPP-A2 would correct the actual lesion rather than bypass it,
    but its efficacy in Pappa2-deficient mice appears female-specific. Does that
    sex-dependence reflect mouse biology or a real constraint on the human
    therapy?
  attaches_to:
  - pathophysiology#Loss of PAPP-A2 Proteolytic Activity
  rationale: >-
    rhIGF-1 works, but it is a bypass: it leaves the sequestered pool sequestered
    and the release step blocked. rhPAPP-A2 is the mechanistically direct
    alternative, and in Pappa2-deficient mice it modulates growth-related IGF-1
    signalling — but the authors report the effect as female-specific. The mouse
    knockout is itself strongly sex-dimorphic in growth deficit (10% versus
    25-30% weight reduction), so the therapeutic dimorphism may simply track the
    larger deficit available to rescue in females rather than a sex-specific
    drug mechanism. The reported human families are too small to establish
    whether any sex difference exists at all, and the two long-term-treated index
    patients are one female and one male sibling. Distinguishing "the drug works
    differently by sex" from "the model has more to rescue in females" matters
    before this reaches a trial design.
  evidence:
  - reference: PMID:38589872
    reference_title: Recombinant PAPP-A2 treatment in Pappa2 deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      pointing to rhPAPP-A2 as a promising drug to alleviate postnatal growth
      retardation underlying low IGF1 bioavailability in a female-specific manner
    explanation: >-
      States the sex-specific efficacy finding that this discussion is about.
  - reference: PMID:21586553
    reference_title: Pregnancy-associated plasma protein-A2 (PAPP-A2), local regulator of IGF bioavailability through cleavage of IGFBPs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Male and female PAPP-A2 KO mice had 10 and 25-30% lower body weight,
      respectively, than WT littermates.
    explanation: >-
      The baseline sex dimorphism in the untreated model, which is the
      alternative explanation for the treatment dimorphism.

name: Short Stature, Dauber-Argente Type
creation_date: "2026-08-30T06:20:00Z"
category: Mendelian
parents:
- Growth Disorder
- Disorder of the GH-IGF-1 Axis
synonyms:
- SSDA
- PAPP-A2 deficiency
- pappalysin-2 deficiency
disease_term:
  preferred_term: Short stature, Dauber-Argente type
  term:
    id: MONDO:0859182
    label: Short stature, Dauber-Argente type
description: >-
  Short stature, Dauber-Argente type is an autosomal recessive growth disorder
  caused by biallelic loss-of-function variants in PAPPA2, which encodes
  pappalysin-2 (PAPP-A2), the metalloproteinase that cleaves IGFBP-3 and
  IGFBP-5. Its interest is mechanistic rather than merely nosological: this is
  growth failure from hormone *sequestration*, not hormone deficiency. IGF-1
  circulates in a ternary complex with IGFBP-3 or -5 and the acid-labile
  subunit; PAPP-A2 proteolysis is what releases it. Without that cleavage the
  reservoir cannot be opened, and patients show the paradoxical signature of
  raised total IGF-1, IGFBP-3, IGFBP-5 and ALS alongside *reduced free IGF-1*.
  Total-hormone measurement is therefore actively misleading here, which is the
  practical reason the disease was missed until 2016. Children are normal size
  at birth and develop progressive postnatal growth failure with moderate
  microcephaly, thin long bones, reduced bone mineral density and insulin
  resistance. Because the lesion is a blocked release step rather than absent
  ligand, recombinant human IGF-1 bypasses it, and six-year treatment data show
  both index siblings reaching target height with normalised bone density.
definitions:
- name: Biochemical case definition
  definition_type: CASE_DEFINITION
  description: >-
    Progressive postnatal short stature with high circulating total IGF-1,
    IGFBP-3 and IGFALS but decreased free IGF-1, confirmed by biallelic PAPPA2
    variants. Circulating PAPP-A2 itself is very low or undetectable and can be
    measured to focus the workup.
  scope: Disease-level ascertainment among children investigated for short stature.
  evidence:
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      high circulating levels of total IGF1, IGFBP3, and the IGF acid-labile
      subunit (IGFALS), with decreased free IGF1 concentrations
    explanation: >-
      States the discriminating biochemical pattern that defines the disease.
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pediatric endocrinologists should measure circulating PAPP-A2 levels in
      the study of short stature as very low or undetectable levels of this
      protein can help to focus the diagnosis and treatment
    explanation: >-
      Supports direct PAPP-A2 measurement as an ascertainment step.
epidemiology:
- name: Ultra-rare, reported in a small number of consanguineous kindreds
  description: >-
    The disease was defined in 2016 from two unrelated families and confirmed by
    a third, from Saudi Arabia, in 2021. No population frequency has been
    published.
  evidence:
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2016 a new syndrome with postnatal short stature and low IGF1
      bioavailability caused by biallelic loss-of-function mutations in the gene
      encoding the metalloproteinase pregnancy-associated plasma protein A2
      (PAPP-A2) was described in two families.
    explanation: >-
      Documents the number of families in which the syndrome was originally
      defined.
progression:
- phase: Normal birth size
  age_range: Birth
  notes: >-
    Birth lengths and weights of affected children were normal, though smaller
    than their unaffected sisters. The prenatal period is spared, which is what
    makes this a postnatal growth disorder.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their birth lengths and weights were normal, although smaller than their
      unaffected sisters
    explanation: >-
      Establishes normal size at birth in the index family.
- phase: Progressive postnatal growth deceleration
  age_range: Childhood, with severe short stature reported from around 8 years
  notes: >-
    Growth decelerates progressively with age rather than tracking a low
    centile. In the Saudi kindred the two affected males showed progressively
    severe short stature starting around 8 years.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their growth patterns revealed consistent short stature relative to target
      height, with more prominent growth deceleration as they age
    explanation: >-
      Documents the progressive rather than static nature of the growth failure.
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two affected males showed progressively severe short stature starting
      around 8 years of age, moderate microcephaly, decreased bone mineral
      density
    explanation: >-
      Gives the age at which growth failure became severe in the confirming
      family.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported families carry homozygous PAPPA2 variants; unaffected siblings
    had normal height and normal IGF-1.
  evidence:
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic loss-of-function mutations in the gene encoding the
      metalloproteinase pregnancy-associated plasma protein A2 (PAPP-A2)
    explanation: >-
      States that disease requires loss-of-function variants on both alleles.
genetic:
- name: PAPPA2
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PAPPA2
    term:
      id: hgnc:14615
      label: PAPPA2
  notes: >-
    Three homozygous alleles are reported across three families: the frameshift
    p.D643fs25* and the missense p.Ala1033Val in the two index families, and the
    nonsense p.Glu886* in exon 7 in the Saudi kindred. The missense allele is
    the informative one — in vitro IGFBP cleavage assays showed it abolishes
    proteolytic activity completely, which is what establishes loss of enzyme
    function, rather than reduced expression or altered substrate binding, as
    the disease mechanism.
  variants:
  - name: PAPPA2 p.D643fs25*
    description: >-
      Homozygous frameshift in the Spanish index family; carriers have
      undetectable PAPP-A2 activity and are the two siblings in whom rhIGF-1 was
      first trialled.
  - name: PAPPA2 p.Ala1033Val
    description: >-
      Homozygous missense in the second index family. Despite being a single
      amino-acid substitution it abolishes proteolytic activity entirely in
      vitro.
  - name: PAPPA2 p.Glu886*
    description: >-
      Homozygous nonsense variant in exon 7 reported in the Saudi confirming
      family.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two different homozygous mutations in PAPPA2, p.D643fs25* and
      p.Ala1033Val, were associated with this novel syndrome of growth failure.
      In vitro analysis of IGFBP cleavage demonstrated that both mutations cause
      a complete absence of PAPP-A2 proteolytic activity.
    explanation: >-
      Names the two founding alleles and establishes complete loss of proteolytic
      activity as their shared functional consequence.
  - reference: PMID:34272725
    reference_title: Short stature with low insulin-like growth factor 1 availability due to pregnancy-associated plasma protein A2 deficiency in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two siblings of a third family from Saudi Arabia with postnatal growth
      retardation and decreased IGF1 availability due to a new homozygous
      nonsense mutation (p.Glu886* in exon 7) in PAPPA2
    explanation: >-
      Adds the third reported allele and independently confirms the syndrome.
pathophysiology:
- name: Loss of PAPP-A2 Proteolytic Activity
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: PAPPA2
      term:
        id: hgnc:14615
        label: PAPPA2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous frameshift, nonsense or inactivating missense PAPPA2 variants
      abolish pappalysin-2 proteolytic activity. Loss is complete in vitro even
      for the single-residue p.Ala1033Val substitution.
  molecular_functions:
  - preferred_term: IGFBP-cleaving metalloendopeptidase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vitro analysis of IGFBP cleavage demonstrated that both mutations cause
      a complete absence of PAPP-A2 proteolytic activity.
    explanation: >-
      Direct functional demonstration that the disease alleles abolish the
      enzyme activity that defines this node.
  downstream:
  - target: Failure to Cleave IGFBP-3 and IGFBP-5
    causal_link_type: DIRECT
    description: >-
      PAPP-A2's physiological substrates, IGFBP-3 and IGFBP-5, go uncleaved.
    evidence:
    - reference: PMID:29280739
      reference_title: "Novel Modulators of the Growth Hormone - Insulin-Like Growth Factor Axis: Pregnancy-Associated Plasma Protein-A2 and Stanniocalcin-2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PAPP-A2 is a protease which cleaves IGFBP-3 and -5, while STC2 inhibits
        PAPP-A and PAPP-A2 activity.
      explanation: >-
        Names the specific substrates whose cleavage fails when the enzyme is
        lost.
- name: Failure to Cleave IGFBP-3 and IGFBP-5
  biological_scale: MOLECULAR
  description: >-
    Uncleaved high-affinity binding proteins accumulate. IGFBP-3 and IGFBP-5,
    once loaded with IGF, also bind the acid-labile subunit to form the
    approximately 150 kDa ternary complex that extends IGF-1's half-life. That
    complex is the reservoir, and cleaving its binding protein is how the
    reservoir is opened.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After binding IGF, IGFBP‐3, and ‐5 also bind with the IGF acid labile
      subunit (ALS) to form a ternary complex, which further increases IGF‐I's
      half‐life
    explanation: >-
      Establishes the ternary-complex biology that makes uncleaved binding
      proteins a sequestering species.
  downstream:
  - target: IGF-1 Sequestration in the Ternary Complex
    causal_link_type: DIRECT
    description: >-
      IGF-1 remains bound in the ternary complex rather than being released as
      free hormone.
    evidence:
    - reference: PMID:26902202
      reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Size-exclusion chromatography showed a significant increase in IGF-I
        bound in its ternary complex.
      explanation: >-
        Direct biophysical measurement of the sequestration this node describes.
- name: IGF-1 Sequestration in the Ternary Complex
  biological_scale: ORGANISM
  description: >-
    The disease's defining state, and the reason it is diagnostically
    counterintuitive: circulating total IGF-1, IGFBP-3, IGFBP-5, ALS and IGF-II
    are all elevated while free IGF-1 falls. A clinician measuring total IGF-1
    sees a value that looks reassuring or even high, in a child whose tissues are
    IGF-1 starved.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Free IGF-I concentrations were decreased. These patients provide important
      insights into the regulation of longitudinal growth in humans, documenting
      the critical role of PAPP-A2 in releasing IGF-I from its BPs.
    explanation: >-
      States both halves of the paradox and names PAPP-A2's release role.
  downstream:
  - target: Loss of IGF-1 Negative Feedback on GH Secretion
    causal_link_type: DIRECT
    description: >-
      Free IGF-1 restrains pituitary GH output; reducing it lifts that brake.
    evidence:
    - reference: PMID:27648969
      reference_title: Treatment With Recombinant Human Insulin-Like Growth Factor-1 Improves Growth in Patients With PAPP-A2 Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        spontaneous GH secretion was diminished after acute administration of
        rhIGF-1
      directness: INDIRECT
      explanation: >-
        Restoring free IGF-1 lowers GH, which supports reading the elevated GH
        as a consequence of the free-IGF-1 deficit.
  - target: Reduced IGF-1 Receptor Signaling at the Growth Plate
    causal_link_type: DIRECT
    description: >-
      Only free IGF-1 engages the receptor, so reduced free hormone means
      reduced signalling regardless of total concentration.
    evidence:
    - reference: PMID:26902202
      reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Free IGF‐I (fIGF‐I) binds its receptor, activating signaling cascades
        that up‐regulate multiple genes fundamental to growth
      explanation: >-
        Establishes that receptor engagement depends on the free fraction, which
        is the fraction that is reduced.
- name: Loss of IGF-1 Negative Feedback on GH Secretion
  biological_scale: ORGANISM
  description: >-
    Because pituitary GH secretion is restrained by free IGF-1, sequestration
    lifts that brake and spontaneous GH secretion rises. This node is what makes
    the drug choice obvious: the axis is already running GH at above-normal
    output against a blocked release step, so rhGH would add more of a signal
    that is not the limiting one. rhIGF-1 supplies the product instead, and the
    fall in spontaneous GH secretion after it is given is the confirmation that
    the feedback loop was intact all along and simply starved of ligand.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous GH secretion over eight hours (daytime) was elevated
    explanation: >-
      Direct measurement of the raised GH output in an index patient.
  - reference: PMID:27648969
    reference_title: Treatment With Recombinant Human Insulin-Like Growth Factor-1 Improves Growth in Patients With PAPP-A2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bioactive IGF-1 was increased, and spontaneous GH secretion was diminished
      after acute administration of rhIGF-1
    explanation: >-
      Supplying free IGF-1 restores the feedback and lowers GH, which is what
      establishes this node as a consequence of the sequestration rather than an
      independent pituitary abnormality.
- name: Reduced IGF-1 Receptor Signaling at the Growth Plate
  biological_scale: CELLULAR
  description: >-
    Diminished IGF-1 receptor signalling in growth-plate chondrocytes and bone,
    with systemic effects on lean mass and insulin sensitivity. That this node
    is the operative one is shown by therapy: supplying exogenous IGF-1, which
    changes nothing upstream, restores growth.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: insulin-like growth factor receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0048009
      label: insulin-like growth factor receptor signaling pathway
  evidence:
  - reference: PMID:29280739
    reference_title: "Novel Modulators of the Growth Hormone - Insulin-Like Growth Factor Axis: Pregnancy-Associated Plasma Protein-A2 and Stanniocalcin-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggested that the bioactive, free IGF-1 liberated from
      IGFBPs by PAPP-A2 is important for human growth.
    explanation: >-
      States the inference from the human cases that free IGF-1 liberation is
      what drives growth.
  downstream:
  - target: Progressive Postnatal Growth Failure and Skeletal Deficit
    causal_link_type: DIRECT
    description: >-
      Reduced growth-plate signalling produces progressive short stature, thin
      long bones and reduced bone mineral density.
    evidence:
    - reference: PMID:29280739
      reference_title: "Novel Modulators of the Growth Hormone - Insulin-Like Growth Factor Axis: Pregnancy-Associated Plasma Protein-A2 and Stanniocalcin-2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The PAPP-A2 deficient patients were treated with recombinant human
        IGF-1, resulting in improvements in growth velocity, insulin resistance,
        and BMD.
      directness: INDIRECT
      explanation: >-
        Restoring IGF-1 signalling improves all three downstream outcomes, which
        supports the inference that reduced signalling produces them.
  - target: Insulin Resistance
    causal_link_type: DIRECT
    description: >-
      Reduced IGF-1 bioactivity is accompanied by insulin resistance, which also
      improves on rhIGF-1.
    evidence:
    - reference: PMID:29280739
      reference_title: "Novel Modulators of the Growth Hormone - Insulin-Like Growth Factor Axis: Pregnancy-Associated Plasma Protein-A2 and Stanniocalcin-2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Additionally, the patients demonstrated insulin resistance and below
        average bone mineral density (BMD).
      directness: INDIRECT
      explanation: >-
        Reports the metabolic phenotype in the PAPP-A2-deficient patients; the
        causal attribution to reduced IGF-1 signalling rests on its reversal
        under rhIGF-1.
- name: Progressive Postnatal Growth Failure and Skeletal Deficit
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: progressive postnatal short stature with moderate
    microcephaly, thin long bones and mildly reduced bone mineral density.
  downstream:
  - target: Postnatal growth retardation
    causal_link_type: DIRECT
    description: >-
      This node is the mechanism behind the observed growth phenotype.
    evidence:
    - reference: PMID:26902202
      reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Multiple members of two unrelated families presented with progressive
        growth failure, moderate microcephaly, thin long bones, mildly decreased
        bone density
      explanation: >-
        Couples the mechanism node to the reported clinical growth failure.
  - target: Reduced bone mineral density
    causal_link_type: DIRECT
    description: >-
      Reduced IGF-1 signalling in bone produces the below-average bone mineral
      density, which normalises when signalling is restored.
    evidence:
    - reference: PMID:29280739
      reference_title: "Novel Modulators of the Growth Hormone - Insulin-Like Growth Factor Axis: Pregnancy-Associated Plasma Protein-A2 and Stanniocalcin-2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The PAPP-A2 deficient patients were treated with recombinant human
        IGF-1, resulting in improvements in growth velocity, insulin resistance,
        and BMD.
      directness: INDIRECT
      explanation: >-
        Bone density improves when IGF-1 signalling is restored, which supports
        the inference that its deficit produces the phenotype.
  evidence:
  - reference: PMID:26902202
    reference_title: Mutations in pregnancy-associated plasma protein A2 cause short stature due to low IGF-I availability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple members of two unrelated families presented with progressive
      growth failure, moderate microcephaly, thin long bones, mildly decreased
      bone density and elevated circulating total IGF-I, IGFBP-3, and -5, acid
      labile subunit, and IGF-II concentrations.
    explanation: >-
      The index report's phenotype description covering every element of this

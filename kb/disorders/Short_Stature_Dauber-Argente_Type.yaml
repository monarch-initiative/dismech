notes: >-
  Why this is a Disease entry. MONDO:0859182 is a leaf term with no descendants
  and one causal gene, and nothing in kb/disorders/ or kb/groupings/ carried the
  ID or the label. The disease has a single conserved pathograph running from
  PAPPA2 loss of function to reduced free IGF-1, so no subtype axis is
  defensible on current evidence.

  Deep research. One OpenScientist report was generated and is committed under
  research/. Its validation was unusually clean: 16/16 references verified with
  a 0.0 confabulation rate, 19/20 terms verified, and the single flagged
  "mislabelled" term was MONDO:0859182 itself, whose reported label was the
  column header "Disease (MONDO)" rather than a real mismatch — the CURIE is
  correct. Every claim taken from the report was nonetheless re-verified against
  the cached abstract it cites.

  Deliberately not curated. No prevalence record: no population rate has been
  published for a disease known from three families, and inventing a
  prevalence_class from "ultra-rare" prose would assert more than the sources
  do. No datasets. The GC-MS metabolomics finding (PMID:30119035) that rhIGF-1
  most affects free fatty acid and amino acid pathways is real and interesting
  but is a treatment-response observation in two patients rather than a disease
  mechanism, so it is not made a pathophysiology node. The STC2 inhibitory arm
  of the IGFBP-STC2-PAPP-A axis is described in PMID:29280739 but no human STC2
  disease is established, so it is left out rather than modelled speculatively.

  Frequency bands are given only for postnatal growth retardation and short
  stature, which every reported patient has. With three families in total, the
  remaining features have no usable denominator and are left unbanded.

  Note on the treatment link type. rhIGF-1 is recorded as BYPASSES rather than
  RESTORES, deliberately. It supplies the product downstream of the blocked
  proteolytic step and does not restore PAPP-A2 activity; the evidence for that
  reading is that total IGF-1 and IGFBP-3 stay elevated on treatment while free
  IGF-1 and growth velocity rise.

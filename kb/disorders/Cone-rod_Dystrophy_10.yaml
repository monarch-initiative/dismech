genetic:
- name: SEMA4A
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SEMA4A
    term:
      id: hgnc:10729
      label: SEMA4A
  notes: >-
    The causal claim rests on one 2006 screen; no second family with
    SEMA4A cone-rod dystrophy has been published, and ClinGen has no
    gene-disease validity record for SEMA4A in retinal disease (its only
    SEMA4A record is a Disputed classification for Lynch syndrome). The
    authors of the mouse knock-in study noted that the human screen sequenced
    only SEMA4A and did not exclude variants in other genes. A heterozygous
    SEMA4A frameshift was later reported in one 48-year-old German patient
    with an atrophic macular lesion and reduced scotopic and photopic ERG
    responses, without segregation data (PMID:29555955); a single
    heterozygous truncating allele does not fit the recessive model, so it is
    not counted as evidence for this disease.
  evidence:
  - reference: PMID:16199541
    reference_title: Identification of novel mutations in the SEMA4A gene associated with retinal degenerative diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two mutations, p.D345H and p.F350C, were observed only in affected patients; they were not observed in any of the normal members or the 100 control subjects.
    explanation: >-
      The variants defining the disease were found only in patients.
  - reference: PMID:23360997
    reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although compound D345H/F350C heterozygous mutations were reported to be associated with retinal degenerative diseases in humans11, knock-in mice carrying these mutations did not exhibit this phenotype
    explanation: >-
      The exact human genotype did not cause retinal degeneration in mice,
      which weakens, without refuting, the human attribution.
  variants:
  - name: p.Phe350Cys
    description: >-
      Sema-domain missense variant. The only one of the three originally
      reported variants that causes retinal degeneration when knocked in to
      mice, through misfolding and retention of the protein.
    evidence:
    - reference: PMID:23360997
      reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we generate a series of knock-in mouse lines with corresponding mutations (D345H, F350C or R713Q) in the Sema4A gene and find that Sema4A(F350C) causes retinal degeneration phenotypes.
      explanation: >-
        Functional support for Phe350Cys pathogenicity.
  - name: p.Asp345His
    description: >-
      Semi-conserved sema-domain missense variant reported in trans with
      Phe350Cys. Homozygous knock-in mice have normal retinas, and the protein
      reaches the RPE surface in vivo, so its contribution is uncertain.
    evidence:
    - reference: PMID:23360997
      reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        By contrast, Sema4AD345H/D345H and Sema4AR713Q/R713Q mice did not exhibit retinal degeneration
      explanation: >-
        No retinal phenotype for the Asp345His allele in mice.
  - name: p.Arg713Gln
    description: >-
      Cytoplasmic-tail variant originally reported as dominant. It does not
      segregate with retinal disease, occurs homozygous in an unaffected
      relative, and causes no phenotype in homozygous knock-in mice; it is
      not disease-causing and is listed only to record that.
    evidence:
    - reference: PMID:28805479
      reference_title: "On variants and disease-causing mutations: Case studies of a SEMA4A variant identified in inherited blindness."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The p.R713Q variant in SEMA4A is insufficient to cause either autosomal recessive or autosomal dominant retinitis pigmentosa and is unlikely to be pathogenic.
      explanation: >-
        Family studies show the variant is not sufficient to cause disease.
    - reference: PMID:28805479
      reference_title: "On variants and disease-causing mutations: Case studies of a SEMA4A variant identified in inherited blindness."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The fact that an unaffected family member is homozygous for the mutation indicates that this mutation is insufficient to cause disease.
      explanation: >-
        An unaffected homozygote rules out the variant as a recessive cause.

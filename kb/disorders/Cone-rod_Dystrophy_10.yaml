inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The original report attributed the retinal disease to compound
    heterozygosity for p.Asp345His and p.Phe350Cys in SEMA4A. Recessive
    inheritance rests on that one report; the mouse knock-in work found that
    Phe350Cys is not dominant-negative and that heterozygous knock-in mice
    have normal retinas, which is consistent with a recessive mechanism but
    does not establish one in humans.
  evidence:
  - reference: PMID:28805479
    reference_title: "On variants and disease-causing mutations: Case studies of a SEMA4A variant identified in inherited blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      p.R354H and p.F330C were reported to be recessive mutations while p.R713Q was reported to be a dominant mutation.
    explanation: >-
      Summarises the inheritance assigned to each variant in the original
      report. The residue numbers in the quoted sentence are misprinted in the
      source (the variants are p.D345H and p.F350C).
  - reference: PMID:23360997
    reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      In addition, the Sema4AF350C protein did not impair the cell surface expression of the Sema4AWT protein (Fig. 4a), indicating that the F350C mutation does not function in a dominant-negative manner.
    explanation: >-
      The absence of a dominant-negative effect in co-expression assays is
      consistent with a loss-of-function recessive mechanism.
pathophysiology:
- name: Biallelic SEMA4A Semaphorin-Domain Missense Variants
  biological_scale: MOLECULAR
  description: >-
    Missense variants in the conserved sema domain of SEMA4A. p.Phe350Cys is
    the variant with functional support; in a structural model F350 sits in a
    hydrophobic pocket, and replacing it with a small residue is predicted to
    destabilise the fold. p.Asp345His is
    semi-conserved and causes no retinal disease when knocked in to mice.
  genes:
  - preferred_term: SEMA4A
    term:
      id: hgnc:10729
      label: SEMA4A
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:16199541
    reference_title: Identification of novel mutations in the SEMA4A gene associated with retinal degenerative diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two mutations, p.D345H and p.F350C, were observed only in affected patients; they were not observed in any of the normal members or the 100 control subjects. Both mutations identified occur in the conserved semaphorin domain.
    explanation: >-
      The two variants on which the disease was defined, both in the sema
      domain and absent from controls.
  downstream:
  - target: SEMA4A Misfolding and Failure to Reach the RPE Cell Surface
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23360997
      reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The F350C mutation results in abnormal localization of the Sema4A protein, leading to impaired endosomal sorting of molecules indispensable for photoreceptor survival.
      explanation: >-
        The patient variant knocked in to mice mislocalises the protein.
- name: SEMA4A Misfolding and Failure to Reach the RPE Cell Surface
  biological_scale: CELLULAR
  description: >-
    Sema4A normally sits at the apical plasma membrane of RPE cells. The
    Phe350Cys protein forms high-molecular-weight aggregates and is retained
    intracellularly; one overexpression study placed the retained mutant
    protein in the endoplasmic reticulum. That study also found Asp345His
    retained in the ER of ARPE-19 cells, whereas in knock-in mouse RPE and in
    the knock-in study's own ARPE-19 and COS-7 assays Asp345His reached the
    cell surface, so the Asp345His localisation defect is assay-dependent.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    modifier: DECREASED
    term:

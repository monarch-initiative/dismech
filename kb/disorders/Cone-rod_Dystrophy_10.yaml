  - reference: PMID:22956603
    reference_title: SEMA4A mutations lead to susceptibility to light irradiation, oxidative stress, and ER stress in retinal pigment epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant SEMA4A was localized in the ER, whereas wild type (WT) SEMA4A was observed in cell membranes.
    explanation: >-
      Overexpressed patient variants are retained in the ER of a human RPE cell

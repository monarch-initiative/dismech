animal_models:
- name: Sema4a gene-trap mouse
  species: Mouse
  genotype: Sema4a retroviral gene-trap insertion, homozygous
  publication: PMID:15277503
  description: >-
    Mice lacking Sema4a from a gene-trap insertion have severe retinal
    degeneration with attenuated vessels and depigmentation by 14 weeks, an
    outer nuclear layer reduced to a single row, and impaired rod and cone
    function.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Null allele produces early severe loss of rods and cones.
    limitations: >-
      A null allele rather than the patient missense genotype, and an early,
      rapid degeneration in mice against a human course whose tempo is
      undocumented. Cone-first loss is not shown.
    evidence:
    - reference: PMID:15277503
      reference_title: Severe retinal degeneration associated with disruption of semaphorin 4A.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fundus photography performed at 14 weeks of age revealed severe retinal degeneration, attenuated retinal vessels, and depigmentation in mice lacking Sema4A.
      explanation: >-
        Sema4a loss causes retinal degeneration.
- name: Sema4a F350C knock-in mouse
  species: Mouse
  genotype: Sema4a p.F350C homozygous knock-in
  publication: PMID:23360997
  description: >-
    Knock-in of the patient Phe350Cys allele disrupts photoreceptor outer
    segments by two weeks of age and removes photoreceptors by four weeks,
    matching the null phenotype. Heterozygotes are normal.
  modeled_mechanisms:
  - target: SEMA4A Misfolding and Failure to Reach the RPE Cell Surface
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The patient allele mislocalises in mouse RPE in vivo.
    limitations: >-
      Localisation was read from EGFP-tagged knock-in alleles, and in
      homozygotes rather than the patients' compound heterozygous genotype.
    evidence:
    - reference: PMID:23360997
      reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The F350C mutation results in abnormal localization of the Sema4A protein, leading to impaired endosomal sorting of molecules indispensable for photoreceptor survival.
      explanation: >-
        Mislocalisation and sorting defect of the patient allele in vivo.
  - target: Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Homozygous patient allele causes photoreceptor loss.
    limitations: >-
      Homozygous Phe350Cys, whereas patients were reported compound
      heterozygous with Asp345His; the compound genotype has no phenotype in
      mice. Degeneration is complete within weeks of birth.
    evidence:
    - reference: PMID:23360997
      reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we generate a series of knock-in mouse lines with corresponding mutations (D345H, F350C or R713Q) in the Sema4A gene and find that Sema4A(F350C) causes retinal degeneration phenotypes.
      explanation: >-
        The patient allele causes degeneration in mice.
- name: Sema4a D345H/F350C compound heterozygous knock-in mouse
  species: Mouse
  genotype: Sema4a p.D345H / p.F350C compound heterozygous knock-in
  publication: PMID:23360997
  description: >-
    Mice carrying the genotype reported in patients do not develop retinal
    degeneration, nor do Asp345His or Arg713Gln homozygotes.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The human genotype does not reproduce retinal degeneration in mice.
    limitations: >-
      Mice live far shorter than humans and mouse and human Sema4A differ at
      a few residues, so a slowly progressive human disease or a
      species-specific effect of Asp345His could be missed.
    evidence:
    - reference: PMID:23360997
      reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although compound D345H/F350C heterozygous mutations were reported to be associated with retinal degenerative diseases in humans11, knock-in mice carrying these mutations did not exhibit this phenotype
      explanation: >-
        The patient genotype has no retinal phenotype in mice.
discussions:
- discussion_id: cord10_compound_genotype_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is SEMA4A p.Asp345His/p.Phe350Cys sufficient to cause cone-rod dystrophy
    in humans, when the same compound genotype causes no retinal degeneration
    in mice and no second family has been reported?
  attaches_to:
  - genetic#SEMA4A
  - animal_models#Sema4a D345H/F350C compound heterozygous knock-in mouse
  - pathophysiology#Biallelic SEMA4A Semaphorin-Domain Missense Variants
  rationale: >-
    The mouse work supports Sema4A loss of function as a cause of
    photoreceptor degeneration and supports Phe350Cys as a damaging allele,
    but the genotype actually reported in patients is benign in mice, and
    the human screen did not exclude variants in other retinal genes. Either
    Asp345His is damaging only in human Sema4A or over a human lifespan, or
    the patients' disease has another cause. A reanalysis of the original
    families with a retinal gene panel or genome sequencing, and functional
    testing of Asp345His in human RPE cells, would distinguish the two.
  evidence:
  - reference: PMID:23360997
    reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Second, we should carefully evaluate the findings of the human study because this report only sequenced the Sema4A gene but did not definitively exclude the possible involvement of other genetic factors.
    explanation: >-
      The model's authors raise the possibility that the human attribution is
      incomplete.
datasets: []
notes: >-
  The human evidence for this disease is one 2006 screen of 190 patients,
  whose abstract does not give per-patient clinical detail; ages at onset,
  ERG findings and progression for SEMA4A cone-rod dystrophy are therefore
  unknown, and the symptom phenotypes beyond the cone-rod dystrophy itself are
  cited from descriptions of the disease class and marked INDIRECT. No
  prevalence figure exists. The same screen reported SEMA4A variants in
  patients with retinitis pigmentosa; that allelic rod-cone presentation is
  catalogued separately as retinitis pigmentosa 35 and is not recorded as a
  phenotype of this entry. Cone-rod dystrophy 5,
  caused by PITPNM3, is a different disease. No GeneReviews chapter covers
  this disease.

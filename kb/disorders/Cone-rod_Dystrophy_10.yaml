    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sema4AF350C-EGFP remained in the cytosol, while Sema4AWT-EGFP, Sema4AD345H-EGFP and Sema4AR713Q-EGFP localized to the surface of RPE cells in the retinas of mutant knock-in mice
    explanation: >-
      Only the Phe350Cys protein fails to reach the RPE surface in vivo.
  - reference: PMID:23360997

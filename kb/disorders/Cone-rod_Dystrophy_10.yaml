- name: Subretinal Sema4a gene transfer (preclinical)
  description: >-
    Lentiviral delivery of wild-type Sema4a to the subretinal space of
    Sema4a-null and Phe350Cys knock-in mice preserved the photoreceptor layer
    for at least four months and partly restored ERG responses. This is a
    preclinical result only; no human trial was found.
  therapeutic_modality: GENE_THERAPY

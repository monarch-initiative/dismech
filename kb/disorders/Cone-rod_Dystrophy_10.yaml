name: Cone-rod dystrophy 10
creation_date: "2026-10-14T13:30:00Z"
category: Mendelian
synonyms:
- CORD10
- SEMA4A cone-rod dystrophy
- cone-rod dystrophy caused by mutation in SEMA4A
- cone-rod dystrophy type 10
description: >-
  Cone-rod dystrophy 10 is an inherited retinal dystrophy attributed to
  biallelic variants in SEMA4A, which encodes semaphorin 4A, a transmembrane
  semaphorin expressed in the retinal pigment epithelium. It was defined by a
  single 2006 screen of Pakistani patients with retinal degeneration, in which
  the semaphorin-domain missense variants p.Asp345His and p.Phe350Cys were
  found in patients with cone-rod dystrophy and with retinitis pigmentosa; the
  retinitis pigmentosa presentation is catalogued separately as retinitis
  pigmentosa 35. No independent family with SEMA4A cone-rod dystrophy has been
  reported since, so the human phenotype is thinly described and the
  gene-disease relationship is weak. The third variant from that screen,
  p.Arg713Gln, is unlikely to be pathogenic: it fails to segregate with
  disease and occurs homozygous in an unaffected relative. The mechanistic
  picture comes from mice. Sema4a-null and Phe350Cys knock-in mice lose their
  photoreceptors early in life. Sema4A loss, or misfolding of the Phe350Cys
  protein so that it never reaches the RPE cell surface, removes two
  Sema4A-dependent endosomal sorting steps: exosomal release of the anti-apoptotic factor prosaposin
  under oxidative stress, and delivery of retinoid-binding proteins for the
  visual cycle. Asp345His and Arg713Gln knock-in mice, by contrast, have
  normal retinas. There is no disease-specific treatment; subretinal Sema4a
  gene transfer rescues photoreceptors in mice.

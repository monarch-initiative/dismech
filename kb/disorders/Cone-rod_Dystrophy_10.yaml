      evidence_source: MODEL_ORGANISM
      snippet: >-
        RPE cells from Sema4AF350C/F350C retinas expressed lower levels of prosaposin in secreted H2O2-induced exosomes
      explanation: >-
        The patient variant reduces exosomal prosaposin, as Sema4a loss does.
  - target: Impaired Retinoid-Binding Protein Sorting for the Visual Cycle
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23360997
      reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CRALBP also failed to distribute to the surface of RPE cells
      explanation: >-
        The retinoid-binding protein CRALBP is missorted in Phe350Cys RPE.
- name: Reduced Exosomal Prosaposin Release from RPE
  biological_scale: CELLULAR
  description: >-
    Under light-induced oxidative stress, Sema4A switches prosaposin from the
    lysosomal route to exosomal release, and the secreted prosaposin protects
    photoreceptors from apoptosis. Without functional Sema4A this protective
    release falls.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: exosomal secretion
    modifier: DECREASED
    term:
      id: GO:1990182
      label: exosomal secretion
  evidence:
  - reference: PMID:22465952
    reference_title: Endosomal sorting by Semaphorin 4A in retinal pigment epithelium supports photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In response to oxidative stress, Sema4A switches the endosomal sorting of the lysosomal precursor protein prosaposin from the lysosome to the exosomal release, which prevents light-induced photoreceptor apoptosis.
    explanation: >-
      Defines the protective prosaposin pathway that Sema4A loss removes.
  downstream:
  - target: Photoreceptor Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22465952
      reference_title: Endosomal sorting by Semaphorin 4A in retinal pigment epithelium supports photoreceptor survival.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Owing to defects in these processes, Sema4A-deficient mice exhibit marked photoreceptor degeneration.
      explanation: >-
        Attributes the photoreceptor loss to the two sorting defects.
- name: Impaired Retinoid-Binding Protein Sorting for the Visual Cycle
  biological_scale: CELLULAR
  description: >-
    In darkness Sema4A shuttles retinoid-binding proteins with their retinoids
    between the RPE cell surface and the ER, where 11-cis-retinal is
    regenerated and returned to photoreceptors. Loss of this sorting impairs
    chromophore supply for phototransduction.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: retinoid metabolic process
    modifier: DECREASED
    term:
      id: GO:0001523
      label: retinoid metabolic process
  evidence:
  - reference: PMID:22465952
    reference_title: Endosomal sorting by Semaphorin 4A in retinal pigment epithelium supports photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the absence of oxidative stress, Sema4A sorts retinoid-binding proteins with retinoids between the cell surface and endoplasmic reticulum, by which 11-cis-retinal, a chromophore for phototransduction, is regenerated and transported back to photoreceptors.
    explanation: >-
      Defines the visual-cycle sorting role of Sema4A.
  downstream:
  - target: Photoreceptor Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22465952
      reference_title: Endosomal sorting by Semaphorin 4A in retinal pigment epithelium supports photoreceptor survival.

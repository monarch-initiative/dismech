        Owing to defects in these processes, Sema4A-deficient mice exhibit marked photoreceptor degeneration.
      explanation: >-
        Attributes the photoreceptor loss to the two sorting defects.
- name: RPE Susceptibility to ER and Oxidative Stress
  biological_scale: CELLULAR
  description: >-
    Overexpressed Asp345His and Phe350Cys proteins increase the ER stress
    marker GRP78 after light exposure, sensitise RPE cells to ER and oxidative
    stress, and suppress phagocytosis. This is an overexpression finding in a
    cell line; whether it contributes to photoreceptor loss in vivo has not
    been tested, so no edge to photoreceptor degeneration is asserted.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  evidence:
  - reference: PMID:22956603
    reference_title: SEMA4A mutations lead to susceptibility to light irradiation, oxidative stress, and ER stress in retinal pigment epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The expression of GRP78 was increased by mutant SEMA4A following light irradiation, and phagocytosis was suppressed in mutant SEMA4A-transfected cells. Mutant SEMA4A induced susceptibility to ER stress and oxidative stress.
    explanation: >-
      Patient variants raise ER stress, reduce phagocytosis and sensitise RPE
      cells to stress in vitro.
- name: Photoreceptor Degeneration
  biological_scale: TISSUE
  description: >-
    Loss of rod and cone photoreceptors and thinning of the outer nuclear
    layer. In mice it begins as abnormal outer segment formation during the
    period when outer segments meet the RPE microvilli and is severe within
    weeks. Whether cones are lost before rods in the human disease, as the
    disease name implies, has not been documented beyond the original
    clinical classification.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    modifier: DECREASED
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
  evidence:
  - reference: PMID:15277503
    reference_title: Severe retinal degeneration associated with disruption of semaphorin 4A.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Disruption of Sema4A also compromised the physiological function of both rod and cone photoreceptors.
    explanation: >-
      Both photoreceptor classes are affected in Sema4a-deficient mice.
  - reference: PMID:23360997
    reference_title: A point mutation in Semaphorin 4A associates with defective endosomal sorting and causes retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we generate a series of knock-in mouse lines with corresponding mutations (D345H, F350C or R713Q) in the Sema4A gene and find that Sema4A(F350C) causes retinal degeneration phenotypes.
    explanation: >-
      The patient allele Phe350Cys is sufficient to cause photoreceptor
      degeneration in mice.

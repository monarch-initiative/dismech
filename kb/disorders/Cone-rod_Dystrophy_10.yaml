- name: Impaired Sema4A-Dependent Endosomal Sorting in RPE
  biological_scale: CELLULAR
  description: >-
    In RPE cells Sema4A acts as an intracellular sorting factor in the
    Rab11/FIP2 endosomal pathway rather than as an extracellular guidance cue.
    It directs two cargoes: prosaposin, which it diverts from the lysosome to
    exosomal release under oxidative stress, and retinoid-binding proteins
    such as CRALBP, which it carries between the ER and the cell surface for
    the visual cycle.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: endosomal transport
    modifier: DECREASED
    term:
      id: GO:0016197
      label: endosomal transport
  evidence:
  - reference: PMID:22465952
    reference_title: Endosomal sorting by Semaphorin 4A in retinal pigment epithelium supports photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that Semaphorin 4A (Sema4A), a member of axonal guidance molecule semaphorin, plays a role in Rab11/FIP2-mediated endosomal sorting in retinal pigment epithelial cells to support photoreceptor function.
    explanation: >-
      Establishes the endosomal sorting role of Sema4A in RPE.
  downstream:
  - target: Reduced Exosomal Prosaposin Release from RPE
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23360997

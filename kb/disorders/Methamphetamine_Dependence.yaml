    term:
      id: UBERON:0002691
      label: ventral tegmental area
  evidence:
  - reference: PMID:2899326
    reference_title: Drugs abused by humans preferentially increase synaptic dopamine concentrations in the mesolimbic system of freely moving rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Drugs abused by humans (e.g., opiates, ethanol, nicotine, amphetamine,
      and cocaine) increased extracellular dopamine concentrations in both
      areas, but especially in the accumbens, and elicited hypermotility at low
      doses.
    explanation: >-
      Brain dialysis in freely moving rats with amphetamine among the drugs
      tested, giving the preferential accumbens rise this node asserts. The
      drug tested was amphetamine rather than methamphetamine.
  downstream:
  - target: Incentive Salience and Methamphetamine Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      Dopamine released alongside the cues and acts of use is the teaching
      signal that gives those cues motivational value.
  - target: Reward Deficit and Stress-System Recruitment in Methamphetamine Abstinence
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Repeated supraphysiological mesolimbic dopamine signalling
    description: >-
      Repetition of the acute signal recruits the opponent adaptation; a single
      exposure does not.
  - target: Striatal Dopamine Transporter Downregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Repeated supraphysiological mesolimbic dopamine signalling
    description: >-
      Transporter loss is measured in people who have used the drug
      repeatedly, so the exposure history rather than any single dose is the
      antecedent.
  - target: Psychosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Psychotic symptoms track the amount of drug used within the same person,
      which points at the dopaminergic action rather than at who uses the
      drug. The intermediates are marked unknown because the cited study
      measured use and symptoms, not dopamine, and because this entry does not
      model the mesolimbic-to-psychosis step.
    evidence:
    - reference: PMID:23303471
      reference_title: "Dose-related psychotic symptoms in chronic methamphetamine users: evidence from a prospective longitudinal study."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There was a large dose-dependent increase in the occurrence of
        psychotic symptoms during periods of methamphetamine use among users of
        the drug.
      explanation: >-
        Dose-dependence within individuals is what makes a pharmacological
        antecedent the right reading rather than selection into drug use.
        Indirect because the exposure measured is days of use, not dopamine
        release.
  - target: Hallucinations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      One of the three scored domains of the psychosis outcome above.
  - target: Paranoia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      One of the three scored domains of the psychosis outcome above.
- name: Striatal Dopamine Transporter Downregulation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    People who use methamphetamine have 20 to 30 per cent fewer striatal
    dopamine transporters than controls on positron emission tomography, and
    the deficit partly recovers over nine months of abstinence. What that loss
    means is unsettled, and this entry does not model it as terminal
    degeneration. In the same study, dopamine release was overall normal
    despite the transporter deficit, which is not what loss of dopamine
    terminals would predict, and the authors read it as transporter
    downregulation instead. The node is therefore scoped to the measurement
    and is marked provisional; the degeneration reading is carried as a
    hypothesis rather than as this node's claim.
  molecular_functions:
  - preferred_term: dopamine transporter availability
    term:
      id: GO:0005330
      label: dopamine:sodium symporter activity
    modifier: DECREASED
  genes:
  - preferred_term: SLC6A3
    term:
      id: hgnc:11049
      label: SLC6A3
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  evidence:
  - reference: PMID:26208874
    reference_title: Recovery of dopamine transporters with methamphetamine detoxification is not linked to changes in dopamine release.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      had lower DAT (20-30%) but overall normal DA release in striatum
    explanation: >-
      The measurement this node is scoped to, in 16 people tested during early
      detoxification against 15 controls. The same clause carries the reason
      the node is not modelled as terminal loss: release was normal.
  - reference: PMID:26208874
    reference_title: Recovery of dopamine transporters with methamphetamine detoxification is not linked to changes in dopamine release.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      consistent with reduced DA re-uptake following DAT downregulation
    explanation: >-
      The authors' own reading of the correlation they found, which is the
      interpretation this node adopts: fewer transporters because they are
      downregulated, not because the terminals carrying them are gone.
  - reference: PMID:26208874
    reference_title: Recovery of dopamine transporters with methamphetamine detoxification is not linked to changes in dopamine release.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MA who remained abstinent nine-months later (n=9) showed significant
      increases in DAT (20%) but methylphenidate-induced dopamine increases did
      not change.
    explanation: >-
      Partial recovery of the transporter deficit with sustained abstinence, in
      the nine participants who stayed abstinent. Recovery on this timescale is
      easier to reconcile with downregulation than with lost terminals, and the
      dissociation from dopamine release persists.
  - reference: PMID:20849327
    reference_title: The clinical toxicology of metamfetamine.
    supports: REFUTE
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      following long-term abuse, neuronal apoptosis and nerve terminal
      degeneration
    explanation: >-
      Refutes this node's downregulation reading by asserting that long-term
      use produces apoptosis and terminal degeneration, which is the
      alternative hypothesis this entry carries. Indirect and a review
      synthesis: the statement is made for the drug in general and the review's
      own subject is acute poisoning rather than the transporter measurement
      this node is scoped to, so it establishes the capability without
      bearing directly on what the PET deficit was.
  downstream:
  - target: Reward Deficit and Stress-System Recruitment in Methamphetamine Abstinence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A plausible contributor to the hypodopaminergic abstinent state, drawn
      as having unknown intermediates because the cited study found transporter
      loss and dopamine release dissociated, so the route from one to the
      other is not established.

- name: Methamphetamine Withdrawal Syndrome
  biological_scale: ORGANISM
  description: >-
    Stopping methamphetamine produces a withdrawal syndrome in two phases. An
    acute phase of 7 to 10 days begins within 24 hours of the last use at a
    high peak of severity and declines linearly to near the level of
    non-dependent controls by the end of the first week; a subacute phase of
    at least two further weeks follows, in which most symptoms stay low and
    stable. The acute phase is characterised by increased sleeping and eating
    and a cluster of depression-related symptoms, with anxiety and craving
    less severe. The sleep disturbance of this withdrawal is increased sleep,
    not insomnia, which is the opposite of the nicotine withdrawal pattern
    curated elsewhere in this knowledge base.
  evidence:
  - reference: PMID:16128721
    reference_title: The nature, time course and severity of methamphetamine withdrawal.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The acute phase of amphetamine withdrawal was characterized by increased
      sleeping and eating, a cluster of depression-related symptoms and less
      severely, anxiety and craving-related symptoms.
    explanation: >-
      The study's own finding, and the sentence every phenotype row below
      draws on. It is quoted here rather than the paper's aim, because an aim
      supports no claim about what the syndrome contains.
  - reference: PMID:16128721
    reference_title: The nature, time course and severity of methamphetamine withdrawal.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the acute phase lasting 7-10 days during which overall symptom severity
      declined in a linear pattern from a high initial peak, and a subacute
      phase lasting at least a further 2 weeks
    explanation: >-
      The two-phase structure and the duration of each phase, from the
      conclusions of a study that measured symptoms daily in 21 inpatients
      against 9 matched non-dependent controls.
  downstream:
  - target: Dysphoria
    causal_link_type: DIRECT
  - target: Excessive daytime somnolence
    causal_link_type: DIRECT
  - target: Polyphagia
    causal_link_type: DIRECT

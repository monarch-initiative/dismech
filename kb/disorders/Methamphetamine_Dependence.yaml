  - reference: PMID:23303471
    reference_title: "Dose-related psychotic symptoms in chronic methamphetamine users: evidence from a prospective longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 278 participants 16 years of age or older who met DSM-IV
      criteria for methamphetamine dependence on entry to the study but who did
      not meet DSM-IV criteria for lifetime schizophrenia or mania.
    explanation: >-
      Establishes a cohort diagnosed with methamphetamine dependence by DSM-IV
      criteria, which is the phenotype this row names and the population every
      psychosis row below is drawn from.
- category: Neurologic
  name: Psychosis
  description: >-
    Clinically significant psychotic symptoms, which are among the features
    that most distinguish this disorder clinically from the other stimulant
    use disorders. In a cohort of 278 dependent users who did not meet
    criteria for lifetime schizophrenia or mania, the likelihood of psychotic
    symptoms rose five-fold during periods of use relative to periods of no
    use, and the increase was strongly dose-dependent. The design is
    within-person over four one-month observation windows, so the association
    is not explained by which people use the drug.

mechanistic_hypotheses:
- hypothesis_group_id: md_non_exocytic_release
  hypothesis_label: Non-exocytic release through a reversed carrier is the reinforcing mechanism
  status: CANONICAL
  description: >-
    Methamphetamine reinforces by emptying vesicular stores into the cytosol
    and driving dopamine out through the reversed plasma-membrane carrier,
    rather than by blocking reuptake. This is the canonical account and the
    one that distinguishes the drug class; it is recorded as canonical because
    the mechanism review states it as established rather than as a proposal.
- hypothesis_group_id: md_dat_loss_is_downregulation
  hypothesis_label: The transporter deficit is downregulation, not terminal degeneration
  status: EMERGING
  description: >-
    The 20 to 30 per cent striatal transporter deficit in people who use
    methamphetamine reflects downregulation of the transporter rather than loss
    of the dopamine terminals carrying it. The evidence is that dopamine
    release was overall normal despite the deficit, that the correlation
    between transporter level and release ran opposite to controls, and that
    the deficit partly recovered over nine months while release did not change.
    All of it is from one PET study of sixteen participants.
- hypothesis_group_id: md_dopaminergic_neurotoxicity
  hypothesis_label: Methamphetamine degenerates dopamine terminals
  status: ALTERNATIVE
  description: >-
    The transporter deficit reflects genuine damage to dopamine neurons, which
    is the reading that motivated the concern that methamphetamine use raises
    Parkinson disease risk. Two reviews record that the drug produces neuronal
    apoptosis and nerve terminal degeneration after long-term use, so the
    capability is not in doubt. What the
    one human study cited here does not support is that degeneration explains
    the transporter deficit it measured, which is why this is carried as the
    alternative rather than as the entry's position.
phenotypes:

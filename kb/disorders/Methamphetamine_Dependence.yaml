treatments:
- name: Extended-release naltrexone with extended-release bupropion
  description: >-
    The only drug combination with a positive randomised trial in this
    disorder. In a 403-participant sequential parallel comparison design it
    beat placebo, and the absolute effect was small: 13.6 per cent of treated
    participants responded against 2.5 per cent on placebo, where a response
    meant at least three of four urine samples negative for methamphetamine.
    It is not an approved indication.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naltrexone
      term:
        id: CHEBI:7465
        label: naltrexone
    - preferred_term: bupropion
      term:
        id: CHEBI:3219
        label: bupropion
  target_mechanisms:
  - target: Reward Deficit and Stress-System Recruitment in Methamphetamine Abstinence
    description: >-
      Drawn to the abstinent-state node because that is the arm the component
      drugs plausibly act on, bupropion through dopamine and noradrenaline
      reuptake and naltrexone through opioid-receptor blockade of the
      reinforcing response. The trial tested the combination's effect on
      abstinence and did not establish which node it acts on, so this link
      records a target rather than a demonstrated one.
  evidence:
  - reference: PMID:33497547
    reference_title: Bupropion and Naltrexone in Methamphetamine Use Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The weighted average response across the two stages was 13.6% with
      naltrexone-bupropion and 2.5% with placebo, for an overall treatment
      effect of 11.1 percentage points
    explanation: >-
      The trial's primary outcome, giving both the effect and its size. Quoted
      in full rather than as the significance alone, because the absolute
      response rate is the clinically important part.
  - reference: PMID:33497547
    reference_title: Bupropion and Naltrexone in Methamphetamine Use Disorder.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      The use of naltrexone plus bupropion to treat methamphetamine use
      disorder has not been well studied.
    explanation: >-
      States the evidence base this trial was addressing, which is why a single
      trial carries the whole of this row. Quoted from the background
      statement rather than from the trial's own result.
- name: Contingency management with a community reinforcement approach
  description: >-
    The best-supported psychosocial intervention for stimulant use disorder.
    In the network meta-analysis of psychosocial treatments it was the only
    intervention that increased the number of abstinent patients against
    treatment as usual, at end of treatment and at follow-up.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Behavioral Counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  target_mechanisms:
  - target: Incentive Salience and Methamphetamine Cue Reactivity
    description: >-
      Puts a competing reinforcer against the drug's, acting on the
      incentive-learning arm rather than on the pharmacology.
  evidence:
  - reference: PMID:30586362
    reference_title: "Comparative efficacy and acceptability of psychosocial interventions for individuals with cocaine and amphetamine addiction: A systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to TAU, contingency management (CM) plus community reinforcement
      approach was the only intervention that increased the number of abstinent
      patients at the end of treatment (OR 2.84, 95% CI 1.24-6.51, P = 0.013),
      and also at 12 weeks (OR 7.60, 95% CI 2.03-28.37, P = 0.002) and at
      longest follow-up (OR 3.08, 95% CI 1.33-7.17, P = 0.008).
    explanation: >-
      The result that singles this intervention out, at three timepoints. The
      analysis pools cocaine with amphetamine addiction and reports no
      amphetamine-only estimate, so the effect sizes are for the combined
      population.
  notes: >-
    The source pools cocaine and amphetamine addiction. The same paper is
    cited on the cocaine entry for the same reason, and neither entry can
    report a drug-specific estimate from it.
discussions:
- discussion_id: md_what_the_transporter_deficit_means
  kind: CONTROVERSY
  prompt: >-
    Does the striatal dopamine transporter deficit in methamphetamine users
    reflect downregulation or loss of dopamine terminals?
  attaches_to:
  - pathophysiology#Striatal Dopamine Transporter Downregulation
  - mechanistic_hypotheses#md_dat_loss_is_downregulation
  - mechanistic_hypotheses#md_dopaminergic_neurotoxicity
  rationale: >-
    The question matters beyond nomenclature, because the degeneration reading
    is what underlies the concern that methamphetamine use raises Parkinson
    disease risk, and the two readings predict different things about
    recovery. The cited PET study argues against degeneration on three
    grounds: dopamine release was normal despite the deficit, the correlation
    between transporter level and release ran opposite to controls, and the
    deficit partly recovered over nine months. Against that, the mechanism
    review records that this drug class can produce neurodegeneration, so the
    capability is established even if it does not explain this measurement.
    The entry takes the downregulation reading for its node and carries
    degeneration as an alternative, on the strength of one study of sixteen
    participants, which is thin for a question this consequential.
- discussion_id: md_no_approved_pharmacotherapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the best pharmacotherapy result in this disorder leave 86 per
    cent of treated patients without a response?
  attaches_to:
  - treatments#Extended-release naltrexone with extended-release bupropion
  - pathophysiology#Reverse Transport of Dopamine Through the Plasma Membrane Carrier
  rationale: >-
    No drug is approved for methamphetamine use disorder, and the one
    combination with a positive trial produced a response in 13.6 per cent
    against 2.5 per cent on placebo. The gap is recorded because the entry's
    own mechanism suggests why a receptor- or transporter-directed drug is
    hard to design here: the drug's action is to reverse a carrier and empty a
    vesicular pool rather than to occupy a receptor, so there is no site an
    antagonist can block without also blocking normal dopamine handling.
    Neither the trial nor the mechanism review establishes that as the reason.

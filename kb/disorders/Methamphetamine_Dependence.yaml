name: Methamphetamine Dependence
creation_date: "2026-11-19T00:00:00Z"
category: Psychiatric
description: >-
  Methamphetamine dependence is a chronic, relapsing disorder of compulsive
  methamphetamine use. Its pharmacology is the thing that separates it from the
  other stimulant use disorders, and the separation is mechanistic rather than
  one of degree: amphetamines are the only widely used drug class that releases
  transmitter without exocytosis. Methamphetamine is carried into the neuron by
  the same transporters that would clear dopamine, empties the vesicular stores
  into the cytosol, and then drives dopamine out through the plasma-membrane
  carrier running backwards. Cocaine, by contrast, only blocks that carrier.
  What follows downstream is the shared addiction cycle. As with cocaine, no
  pharmacotherapy is approved, though one combination has a positive
  randomised trial with a small absolute effect.
disease_term:
  preferred_term: methamphetamine dependence
  term:
    id: MONDO:0005419
    label: methamphetamine dependence
synonyms:
- Methamphetamine addiction
- Methamphetamine use disorder
parents:
- Substance Use Disorder
- Mental Health Disorder
notes: >-
  The lump/split question the stub raises is whether to curate this as
  amphetamine-type stimulant use disorder, taking in amphetamine abuse
  (MONDO:0003969), or to keep the methamphetamine term and map the other. This
  entry keeps the methamphetamine term and deliberately does not map
  MONDO:0003969 at all, which is a different decision from the one the sibling
  cocaine entry made. There, cocaine abuse and cocaine dependence are the same
  drug at two severities, a pre-DSM-5 split that DSM-5 merged, so a
  skos:closeMatch records real overlap. Amphetamine and methamphetamine are
  two drugs: methamphetamine is more lipid-soluble, enters the brain faster and
  releases dopamine more potently, and prescription amphetamine use disorder
  arising from stimulant medication is a different clinical picture from
  illicit methamphetamine dependence. Asserting a close match would overstate
  what the two concepts share. DSM-5 does lump both under stimulant use
  disorder with a substance specifier, so an amphetamine-type grouping is a
  reasonable future addition; it is not this entry.
  The nodes below cite no reference for the claim that methamphetamine is more
  potent or faster-entering than amphetamine, because this entry sources only
  what its own pathograph asserts and that comparison appears solely in this
  note as the reason for a scoping decision.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based estimate of diagnosed methamphetamine dependence was
    located for this entry, so neither a rate nor a magnitude tier is
    recorded.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    The disorder has no approved pharmacotherapy, and the best randomised
    result for any drug combination leaves the great majority of treated
    patients without a response: 13.6 per cent responded on
    naltrexone-bupropion against 2.5 per cent on placebo. The burden is
    therefore carried less by a measured mortality figure, which this entry
    does not have, than by the absence of an effective treatment.
  evidence:
  - reference: PMID:33497547
    reference_title: Bupropion and Naltrexone in Methamphetamine Use Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The weighted average response across the two stages was 13.6% with
      naltrexone-bupropion and 2.5% with placebo, for an overall treatment
      effect of 11.1 percentage points
    explanation: >-
      The primary result of the largest randomised trial in this disorder,
      which establishes both that the combination works and how little of the
      treated population it helps.
pathophysiology:
- name: Vesicular Monoamine Store Depletion
  biological_scale: MOLECULAR
  description: >-
    Methamphetamine is a weak base and a substrate for the vesicular monoamine
    transporter, and it disrupts the proton gradient that transporter depends
    on. Catecholamines are redistributed out of synaptic vesicles into the
    cytosol, which is the step that makes a large, non-exocytic pool of
    dopamine available for release. This is the first of the two mechanisms
    that separate amphetamines from reuptake blockers.
  molecular_functions:
  - preferred_term: vesicular monoamine transporter activity
    term:
      id: GO:0015311
      label: monoamine:proton antiporter activity
    modifier: DECREASED
  genes:
  - preferred_term: SLC18A2
    term:
      id: hgnc:10935
      label: SLC18A2
  chemical_entities:
  - preferred_term: methamphetamine
    term:
      id: CHEBI:6809
      label: methamphetamine
  triggers:
  - preferred_term: exposure to methamphetamine
    term:
      id: ECTO:9000769
      label: exposure to methamphetamine
  evidence:
  - reference: PMID:15955613
    reference_title: "Mechanisms of neurotransmitter release by amphetamines: a review."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      the two apparent primary mechanisms--the redistribution of catecholamines
      from synaptic vesicles to the cytosol, and induction of reverse transport
      of transmitter through plasma membrane uptake carriers
    explanation: >-
      Names both mechanisms this node and the next one carry, and in the order
      they occur. A review of the mechanism literature rather than a single
      experiment, and not specific to methamphetamine among the substituted
      amphetamines.
  downstream:
  - target: Reverse Transport of Dopamine Through the Plasma Membrane Carrier
    causal_link_type: DIRECT
    description: >-
      A raised cytosolic dopamine pool is what the carrier running backwards
      has to export; without the vesicular redistribution there is little to
      reverse-transport.
- name: Reverse Transport of Dopamine Through the Plasma Membrane Carrier
  biological_scale: MOLECULAR
  description: >-
    Methamphetamine induces the plasma-membrane monoamine carriers to run
    backwards, exporting cytosolic dopamine into the synapse without a
    vesicle fusing. This is non-exocytic release, and it is the property that
    makes amphetamines a class of their own: the carrier that would normally
    clear dopamine becomes the route by which it is released. The same drug
    also inhibits uptake, so the two actions add rather than compete.
  molecular_functions:
  - preferred_term: reversed dopamine transporter activity
    term:
      id: GO:0005330
      label: dopamine:sodium symporter activity
    modifier: DYSREGULATED
  biological_processes:
  - preferred_term: non-exocytic dopamine release
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: INCREASED
  genes:
  - preferred_term: SLC6A3
    term:
      id: hgnc:11049
      label: SLC6A3
  - preferred_term: SLC6A2
    term:
      id: hgnc:11048
      label: SLC6A2
  - preferred_term: SLC6A4
    term:
      id: hgnc:11050
      label: SLC6A4
  evidence:
  - reference: PMID:15955613
    reference_title: "Mechanisms of neurotransmitter release by amphetamines: a review."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      encompass the only widely administered class of drugs that predominantly
      release neurotransmitter, in this case principally catecholamines, by a
      non-exocytic mechanism
    explanation: >-
      States the property this node asserts and marks it as distinctive of the
      whole drug class, which is what licenses modelling methamphetamine's
      upstream pharmacology differently from cocaine's rather than as a
      variation on it.
  downstream:
  - target: Elevated Synaptic Dopamine in the Nucleus Accumbens
    causal_link_type: DIRECT
    description: >-
      Export of cytosolic dopamine through the reversed carrier raises
      extracellular dopamine, and does so by addition rather than by blocking
      removal.
- name: Elevated Synaptic Dopamine in the Nucleus Accumbens
  conforms_to: "addiction_cycle#Acute Mesolimbic Dopamine Reinforcement"
  biological_scale: CELLULAR
  description: >-
    Extracellular dopamine rises in the nucleus accumbens, which is the step
    methamphetamine shares with every other drug of abuse and the step the
    addiction cycle module anchors. It is reached here by release rather than,
    as with cocaine, by blocked clearance, so this node binds increased
    dopamine secretion where the cocaine entry binds decreased uptake.
  biological_processes:
  - preferred_term: mesolimbic dopamine release
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: INCREASED
  cell_types:

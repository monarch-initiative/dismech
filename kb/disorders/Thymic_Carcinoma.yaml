  downstream:
  - target: CDKN2A and CDKN2B Tumor Suppressor Loss
    description: >-
      Transformed thymic epithelium frequently loses 9p21 CDKN2A/CDKN2B
      cell-cycle checkpoint control.
  - target: TP53 Tumor Suppressor Inactivation
    description: >-
      Transformed thymic epithelium recurrently acquires somatic TP53
      inactivating mutations.
  - target: Receptor tyrosine kinase pathway activation
    description: >-

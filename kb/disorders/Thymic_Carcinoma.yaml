datasets:
- accession: geo:GSE181815
  title: Molecular predictors of response to pembrolizumab in thymic carcinoma
  description: Thymic carcinoma is rare and has a poorer prognosis than thymomas. The treatment options are limited after failure of platinum-based chemotherapy. We previously performed a single center phase II study of pembrolizumab in patients with advanced thymic carcinoma, showing a 22.5% response rate. Here, we characterized the genomic and transcriptomic profile of thymic carcinoma samples from 10 patients (5 non-responders vs 5 responders) in this cohort, with the main aim of identifying potential predictors of response to immunotherapy.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 30
  publication: PMID:34622229
  notes: Identified by GEO DataSets index search for Thymic Carcinoma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001006408
  title: Genomic landscape and molecularly-informed therapy in thymic carcinoma and other advanced thymic epithelial tumors (H021, HIPO)
  description: The molecular landscape of malignant thymic epithelial tumors (TET) is largely unknown. To better understand and target these clinically challenging entities, we characterize 81 patients harboring 46 thymus carcinomas (TC), 8 neuroendocrine tumors of the thymus (NET) and 27 thymomas using WGS/WES, transcriptome and methylome analysis. TC harbor different molecular alterations compared to thymoma and NET and have higher tumor mutational burden than thymomas. 14/76 TET patients show (likely) pathogenic germline alterations. Composite biomarker analysis indicates homologous repair deficiency in a subset of patients. We identify immunologically hot and cold TC.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Thymic Carcinoma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

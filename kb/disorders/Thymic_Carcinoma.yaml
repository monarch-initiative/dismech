notes: >-
  Thymic carcinoma is modeled here as a single disease-level mechanism graph
  with histologic subtype facets grounded to NCIT, following the same approach
  used for the Thymoma entry. Thymic carcinoma is biologically and clinically
  distinct from thymoma: it shows overtly malignant epithelial cytology,
  CD5/CD117 positivity, a higher mutational burden, greater metastatic
  potential, and generally lacks thymoma's autoimmune/paraneoplastic
  associations. The synonyms "thymoma type C" and "type C thymoma" are
  historical designations from earlier Müller-Hermelink/Suster classifications
  retained for searchability and superseded by "thymic carcinoma" in current
  WHO nomenclature. Thymic neuroendocrine carcinoma is included as a subtype
  facet for completeness; many classifications treat thymic neuroendocrine
  tumors as a separate category, and this entry scopes it only at the subtype
  level.

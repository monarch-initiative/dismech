      Large real-world genomic dataset quantifies CDKN2A (39.9%) and CDKN2B
      (24.6%) as frequent alterations in thymic carcinoma compared with thymoma.
  downstream:
  - target: Aberrant cell-cycle progression and proliferation
    description: >-

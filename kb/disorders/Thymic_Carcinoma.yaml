    snippet: "These aggressive tumours are not typically associated with paraneoplastic autoimmune disorders, and strong PD-L1 expression has been reported in thymic epithelial tumours."
    explanation: Phase 2 trial background notes reported strong PD-L1 expression in thymic epithelial tumors as the rationale for anti-PD-1 checkpoint inhibition in thymic carcinoma.

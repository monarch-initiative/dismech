      antitumor T-cell responses.
  - target: Anterior mediastinal mass
    description: >-
      Clonal expansion of transformed thymic epithelial cells in the thymus
      produces a prevascular (anterior) mediastinal mass.
- name: CDKN2A and CDKN2B Tumor Suppressor Loss
  biological_scale: MOLECULAR
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Recurrent somatic loss or co-deletion of the 9p21 cyclin-dependent kinase
    inhibitors CDKN2A (p16INK4a) and CDKN2B (p15INK4b) is the single most
    common genomic alteration in thymic carcinoma (~40% and ~25% of cases,
    respectively), abrogating CDK4/6 inhibition at the G1/S cell-cycle
    checkpoint.
  genes:
  - preferred_term: CDKN2A
    description: >-
      CDKN2A (p16INK4a) loss, often by homozygous deletion, releases the
      G1/S checkpoint.
    modifier: DECREASED
    term:
      id: hgnc:1787
      label: CDKN2A
  - preferred_term: CDKN2B
    description: >-
      CDKN2B (p15INK4b) is frequently co-deleted with CDKN2A at 9p21, further
      impairing CDK4/6 inhibition at the G1/S checkpoint.
    modifier: DECREASED
    term:
      id: hgnc:1788
      label: CDKN2B

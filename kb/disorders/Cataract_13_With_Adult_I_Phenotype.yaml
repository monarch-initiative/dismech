diagnosis:
- name: Ophthalmic examination
  description: Examination including slit-lamp assessment establishes cataract morphology and visual significance; molecular testing distinguishes GCNT2-related disease from other causes.
  evidence:
  - reference: PMID:27936067
    reference_title: Deletion at the GCNT2 Locus Causes Autosomal Recessive Congenital Cataracts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ophthalmic examinations of the participating members of PKCC215, conducted with slit-lamp microscopy, detected bilateral nuclear cataracts in every affected individual.
    explanation: Documents the examination used in the family.
- name: GCNT2 sequence and copy-number analysis
  description: Molecular investigation needs to assess both small variants and exon-spanning deletions. Exome data can support copy-number calling; sequence-only interpretation may miss a deletion. Segregation and additional dosage or breakpoint assays can define candidate alleles. This is a reported diagnostic workflow, not formal established criteria.
  evidence:
  - reference: PMID:27609212
    reference_title: Case report of homozygous deletion involving the first coding exons of GCNT2 isoforms A and B and part of the upstream region of TFAP2A in congenital cataract.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Analysis of whole exome sequencing data in a patient affected with congenital cataracts identified a pathogenic deletion which was further defined by other techniques.
    explanation: Exome-based copy-number analysis flagged a deletion, followed by confirmation and breakpoint refinement.
  - reference: PMID:27936067
    reference_title: Deletion at the GCNT2 Locus Causes Autosomal Recessive Congenital Cataracts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PCR amplifications of the coding exons of GCNT2 failed in individuals with arCC, and whole-exome data analysis revealed a large deletion on chromosome 6p in the region harboring GCNT2.
    explanation: PCR failure and exome analysis supported a deletion. The associated insertion was suspected, not resolved.
- name: Age-aware I/i blood-group typing
  description: Anti-I and anti-i serology can establish the erythroid phenotype. Interpret it in the context of the normal postnatal i-to-I transition; a cataract genotype or infant i expression alone does not establish adult i.
  evidence:
  - reference: PMID:28224043
    reference_title: Pleiotropic effect of a novel mutation in GCNT2 causing congenital cataract and a rare adult i blood group phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Monoclonal anti-I (HIRO-245) from the Japanese Red Cross, and polyclonal anti-i (P.E.) from the in-house reference collection were tested by standard direct agglutination tube technique and scored according to Marsh.
    explanation: Reports actual adult patient serological testing.
  - reference: PMID:28224043
    reference_title: Pleiotropic effect of a novel mutation in GCNT2 causing congenital cataract and a rare adult i blood group phenotype.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: i antigens are predominant on fetal red blood cells, whereas adult human red blood cells fully express I antigens with a very low level of i antigens. The conversion of i to I occurs during the first 18 months after birth as a result of the expression of the I-branching enzyme
    explanation: Provides developmental context for interpreting persistent i expression.
    quote_role: BACKGROUND
animal_models:
- name: Gcnt2 common-exon knockout mouse
  species: Mus musculus
  genotype: Homozygous deletion of common exon III of Gcnt2
  background: 129Sv/J and C57BL/6J mixed background
  description: Deletion of a common exon disrupts all three Gcnt2 isoforms. Tissue enzyme activity was deficient, but cataracts did not develop earlier than in controls. Renal, immune and locomotor findings in these mice are not established human GCNT2-cataract manifestations.
  publication: PMID:16107727
  evidence:
  - reference: PMID:16107727
    reference_title: Abnormalities caused by carbohydrate alterations in Ibeta6-N-acetylglucosaminyltransferase-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: IGnT activity was abolished in the stomach, kidney, bone marrow, and cerebellum of the deficient mice, while a low level of the activity persisted in the small intestine.
    explanation: Direct tissue enzyme measurements establish a biochemical defect, with residual activity in intestine.
  - reference: PMID:16107727
    reference_title: Abnormalities caused by carbohydrate alterations in Ibeta6-N-acetylglucosaminyltransferase-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: However, cataracts did not develop earlier in the deficient mice.
    explanation: The knockout did not reproduce the human early cataract phenotype.

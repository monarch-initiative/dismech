genetic:
- name: GCNT2
  gene_term:
    preferred_term: GCNT2
    term:
      id: hgnc:4204
      label: GCNT2
  association: Causative
  relationship_type: CAUSATIVE
  notes: Reported variants include shared-exon missense and nonsense alleles, the four-base deletion c.1163_1166delATCA (a frameshift, not a point substitution), and exon-spanning deletions. The recurrent 93-kb deletion was attributed to Alu-mediated recombination or an old founder effect. A separate breakpoint-resolved 97.974-kb deletion removes GCNT2A/B first coding exons and upstream intergenic sequence while sparing GCNT2C and TFAP2A coding regions. Possible regulatory effects on intact genes were not measured; I/i serology was not reported for those siblings. A further family carries an approximately 190-kb deletion with an accompanying insertion only suspected. The 2026 exon-1B case supports lens involvement but has a discordant exon label for its deletion between abstract and poster. These reports do not establish a population proportion of structural alleles. The 2017 publisher correction to the 190-kb deletion report clarifies that flanking SNPs were identified outside the deleted region and corrects their coordinates; the original paragraph should not be used for breakpoint annotation.
  evidence:
  - reference: PMID:21761136
    reference_title: An Alu repeat-mediated genomic GCNT2 deletion underlies congenital cataracts and adult i blood group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The deletion is flanked by Alu repeats of the AluS family on both sides and microsatellite genotyping suggested that its occurrence in the two families was the product of recurrent Alu-Alu repeat-mediated nonhomologous recombinations or an old founder effect.
    explanation: The structural mechanism generating a recurrent large deletion at this locus.
  - reference: PMID:27609212
    reference_title: Case report of homozygous deletion involving the first coding exons of GCNT2 isoforms A and B and part of the upstream region of TFAP2A in congenital cataract.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although GCNT2C and TFAP2A were not included in the deletion, effects on their expression through possible interference with regulatory elements cannot be ruled out.
    explanation: Sequence sparing is distinct from demonstrated normal expression. No TFAP2A regulatory disease mechanism is asserted.
  - reference: PMID:28224043
    reference_title: Pleiotropic effect of a novel mutation in GCNT2 causing congenital cataract and a rare adult i blood group phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a novel homozygous frameshift mutation c.1163_1166delATCA, p.(Asn388Argfs*20) as the cause of congenital cataract in two affected siblings.
    explanation: A four-base deletion causing a frameshift in shared exon 3; the paper uses the GCNT2B transcript ENST00000316170.
  - reference: PMID:27936067
    reference_title: Deletion at the GCNT2 Locus Causes Autosomal Recessive Congenital Cataracts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Chromosome walking delineated the deletion to approximately 190 kb on chromosome 6p, encompassing GCNT2, which segregates with the cataractous phenotype in the family.
    explanation: Supports the approximate deletion extent. Failed junction PCR suggested, but did not characterize, an accompanying insertion.
  - reference: PMID:15161861
    reference_title: 'A nonsense mutation in the glucosaminyl (N-acetyl) transferase 2 gene (GCNT2): association with autosomal recessive congenital cataracts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: revealed in these families a homozygous G-->A substitution in base 58 of exon-2, resulting in the formation of premature stop codons W328X, W326X, and W328X, of the GCNT2A, -B, and -C isoforms, respectively
    explanation: Shared-exon nonsense variant in four families. Protein numbering is isoform-specific.
  - reference: DOI:10.1371/journal.pone.0173719
    reference_title: 'Correction: Deletion at the GCNT2 Locus Causes Autosomal Recessive Congenital Cataracts'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A search of variants in proximal and dis-

      tal regions of GCNT2 identified two SNP’s rs35318586 (chr6: 10,464,803bp) and rs3756954

      (chr6: 10,724,327bp) in exome data defining the proximal and distal boundaries of the

      deletion.'
    explanation: The publisher correction replaces the original erroneous flanking-SNP statement and coordinates. These flanking positions are not nucleotide-resolved deletion breakpoints.
mechanistic_hypotheses:
- hypothesis_group_id: isoform_partition_model
  hypothesis_label: Tissue-partitioned GCNT2 isoforms explain the partial coupling of cataract and adult i
  status: CANONICAL
  description: 'Different first exons and tissue expression partition GCNT2 function: GCNT2B was detected in adult lens epithelium and GCNT2C in reticulocytes. Shared-exon variants can affect both traits, while C-specific variants provide blood-group-only comparators. Human cataract with A/B deletions and the 2026 B-specific frameshift support a lens role for B. This is a supported explanatory model, not a deterministic rule for every allele or population; developmental expression and the lens injury pathway remain incompletely resolved.'
  evidence:
  - reference: PMID:432928
    reference_title: Phenotype i associated with congenital cataract in Japanese.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In Japan, 18 individuals of phenotype i, including our case, have been found in ten unrelated families. Seventeen of them had congenital cataract. Cataract was not found in any of the 45 phenotype I members in these families.
    explanation: 'Historical Japanese family ascertainment: 17 of 18 i individuals had cataract. No genotype-specific or population penetrance is established.'
  - reference: PMID:3799539
    reference_title: Reduced association between the Ii blood group and congenital cataracts in white patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: in comparison with the strong association in Japanese patients between congenital cataracts and the i phenotype, the overall incidence of cataracts in white people with the i phenotype (three of ten people have congenital cataracts) is much lower. In addition, the authors studied the blood of 31 white patients with congenital cataracts and found no patients with the i phenotype.
    explanation: Historical White-patient ascertainment demonstrates incomplete association; ancestry itself is not shown to cause the difference.
  - reference: PMID:17076854
    reference_title: A novel IGnT allele responsible for the adult i phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The presented adult i individual possesses wild-type IGnTA and IGnTB genes but a mutant IGnTC gene with a 243T>A nucleotide substitution, which predicts an amino acid alteration of Asn81Lys.
    explanation: 'The exon 1C arm of the dissociation: blood group affected, cataract absent, other isoforms intact.'
  - reference: PMID:17076854
    reference_title: A novel IGnT allele responsible for the adult i phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A novel IGnTC allele with a 243T>A missense mutation was demonstrated in our adult i Taiwanese without congenital cataracts.
    explanation: Directly states the cataract-negative comparison phenotype for the C-specific allele.
  - reference: PMID:41813616
    reference_title: Case Report With Biallelic Variants in GCNT2 Implicates Exon 1B in Congenital Cataracts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We report a proband with CC and a truncating variant in exon 1B (NM_001491.3: c.760dup p.H254Pfs*2) found in trans with a 75 kilobase (kb) copy-number deletion encompassing exon 1B and 1C.'
    explanation: 'The exon 1B arm: a truncating variant in the lens-relevant exon in a proband with cataract.'
  - reference: PMID:27609212
    reference_title: Case report of homozygous deletion involving the first coding exons of GCNT2 isoforms A and B and part of the upstream region of TFAP2A in congenital cataract.
    supports: SUPPORT

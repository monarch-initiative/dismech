  - target: Lens Opacification
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    limitations: Unanesthetized slit-lamp examination showed clear lenses at eight weeks (six mice per genotype), equal mild cortical opacity at forty weeks (four per genotype), and no greater progression through fifty-five weeks. A galactose challenge used only two mice per genotype. These conditions do not exclude all possible lens effects or establish a compensatory mechanism.
    evidence:
    - reference: PMID:16107727
      reference_title: Abnormalities caused by carbohydrate alterations in Ibeta6-N-acetylglucosaminyltransferase-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: However, cataracts did not develop earlier in the deficient mice.
      explanation: The knockout did not reproduce the human early cataract phenotype.
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC1190280/
      reference_title: Abnormalities Caused by Carbohydrate Alterations in Iβ6-N-Acetylglucosaminyltransferase-Deficient Mice - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Eight-week-old mice (8-W) exhibited no cataractous changes (score 0). Forty-week-old mice (40-W) showed mild cataracts in the cortical regions (score 1). However, there was no difference in the degree of lens opacity between wild-type and deficient mice. Although observations were continued till 55 weeks after birth, cataracts did not become more severe in mice of either genotype.
      explanation: Full-text results specify the ages and wild-type comparison underlying the negative lens phenotype.
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC1190280/
      reference_title: Abnormalities Caused by Carbohydrate Alterations in Iβ6-N-Acetylglucosaminyltransferase-Deficient Mice - PMC

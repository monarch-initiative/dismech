genetic:
- name: GCNT2
  gene_term:
    preferred_term: GCNT2
    term:
      id: hgnc:4204
      label: GCNT2
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants in GCNT2 at 6p24. Two features of the
    variant spectrum matter clinically. First, a large share of reported alleles
    are structural: Alu-mediated deletions of 75 to 98 kb removing one or more
    exons, arising by non-homologous recombination between flanking AluS elements.
    The same 93 kb deletion was found in two apparently unrelated Pakistani
    families, by recurrent Alu-Alu recombination or an old founder effect. A
    sequencing-only workup can therefore return negative on a patient who has a
    causal GCNT2 allele. Second, which exon is hit determines which traits appear:
    shared exons 2 and 3 truncate all isoforms, exon 1C alone gives blood group
    without cataract, and a truncating exon 1B variant has been reported with
    cataract.
  evidence:
  - reference: PMID:21761136
    reference_title: "An Alu repeat-mediated genomic GCNT2 deletion underlies congenital cataracts and adult i blood group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion is flanked by Alu repeats of the AluS family on both sides and microsatellite genotyping suggested that its occurrence in the two families was the product of recurrent Alu-Alu repeat-mediated nonhomologous recombinations or an old founder effect."
    explanation: "The structural mechanism generating a recurrent large deletion at this locus."
  - reference: PMID:21761136
    reference_title: "An Alu repeat-mediated genomic GCNT2 deletion underlies congenital cataracts and adult i blood group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because the GCNT2 locus is rich in Short INterspersed Elements (SINE repeats) and thus likely prone to genomic rearrangements, microdeletions or microduplications at this locus might cause a larger than currently anticipated fraction of apparently isolated autosomal-recessive cataracts."
    explanation: >-
      The authors' own inference that copy-number variation at this locus is
      probably under-ascertained, which is the practical reason a sequencing-only
      workup is insufficient.
  - reference: PMID:28224043
    reference_title: "Pleiotropic effect of a novel mutation in GCNT2 causing congenital cataract and a rare adult i blood group phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a novel homozygous frameshift mutation c.1163_1166delATCA, p.(Asn388Argfs*20) as the cause of congenital cataract in two affected siblings."
    explanation: "A point-variant allele, showing the spectrum is not exclusively structural."
mechanistic_hypotheses:
- hypothesis_group_id: isoform_partition_model
  hypothesis_label: Tissue-partitioned GCNT2 isoforms explain the partial coupling of cataract and adult i
  status: CANONICAL
  description: >-
    The three GCNT2 transcripts share exons 2 and 3 and differ in exon 1. GCNT2C
    is the erythroid transcript and sets the blood group; exon 1B-containing
    transcripts are the lens-relevant ones. Which exon a variant hits therefore
    predicts which traits appear, and this is what explains the long-standing
    clinical observation that the i-cataract association is strong in some
    populations and weak in others.

    This is marked CANONICAL rather than EMERGING because it has the strongest
    kind of support a genotype-phenotype model can have: a matched pair of
    dissociating observations in opposite directions. An exon 1C missense variant
    gives adult i without cataract, and an exon 1B truncating variant gives
    cataract, each in a person. Neither is a single-case fluke read in isolation;
    together they are a genetic experiment.
  evidence:
  - reference: PMID:432928
    reference_title: "Phenotype i associated with congenital cataract in Japanese."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Japan, 18 individuals of phenotype i, including our case, have been found in ten unrelated families. Seventeen of them had congenital cataract. Cataract was not found in any of the 45 phenotype I members in these families."
    explanation: >-
      The Japanese series that established the strong arm of the association: 17 of
      18 phenotype i individuals had cataract, and none of the 45 phenotype I family
      members did.
  - reference: PMID:3799539
    reference_title: "Reduced association between the Ii blood group and congenital cataracts in white patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in comparison with the strong association in Japanese patients between congenital cataracts and the i phenotype, the overall incidence of cataracts in white people with the i phenotype (three of ten people have congenital cataracts) is much lower. In addition, the authors studied the blood of 31 white patients with congenital cataracts and found no patients with the i phenotype."
    explanation: >-
      The weak arm, in a White cohort: 3 of 10 rather than 17 of 18, and no i
      phenotype among 31 patients ascertained through cataract. The contrast between
      these two series is the population difference the isoform model explains.
  - reference: PMID:17076854
    reference_title: "A novel IGnT allele responsible for the adult i phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presented adult i individual possesses wild-type IGnTA and IGnTB genes but a mutant IGnTC gene with a 243T>A nucleotide substitution, which predicts an amino acid alteration of Asn81Lys."
    explanation: >-
      The exon 1C arm of the dissociation: blood group affected, cataract absent,
      other isoforms intact.
  - reference: PMID:41813616
    reference_title: "Case Report With Biallelic Variants in GCNT2 Implicates Exon 1B in Congenital Cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a proband with CC and a truncating variant in exon 1B (NM_001491.3: c.760dup p.H254Pfs*2) found in trans with a 75 kilobase (kb) copy-number deletion encompassing exon 1B and 1C."
    explanation: >-
      The exon 1B arm: a truncating variant in the lens-relevant exon in a proband
      with cataract.
  - reference: PMID:27609212
    reference_title: "Case report of homozygous deletion involving the first coding exons of GCNT2 isoforms A and B and part of the upstream region of TFAP2A in congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "previously reported mutations/deletions have either affected all three isoforms (causing blood group and cataract phenotype) or the C isoform only (causing blood group phenotype only)"
    explanation: >-
      States the isoform-to-phenotype rule as it stood before the exon 1B case
      completed it.
  - reference: PMID:27936067
    reference_title: "Deletion at the GCNT2 Locus Causes Autosomal Recessive Congenital Cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expression of the I antigen in blood is regulated only by the IGnTC isoform of GCNT2"
    explanation: >-
      An independent statement of the erythroid half of the partition: the blood
      group is governed by the C isoform alone.
  notes: >-
    One caveat that the primary papers themselves raise. The exon 1B case is a
    single proband, and its second allele is a 75 kb deletion spanning both 1B and
    1C, so the cataract cannot be attributed to exon 1B alone with the certainty a
    homozygous 1B-only genotype would give. Separately, the 98 kb deletion case
    also removes part of the intergenic region upstream of TFAP2A, and those
    authors explicitly say an effect on TFAP2A cannot be ruled out.
treatments:
- name: Cataract Surgery
  description: >-
    Early lens extraction with subsequent refractive correction and amblyopia
    management. The treatment is the same as for congenital cataract of any cause,
    is not directed at the glycosylation defect, and the enzyme deficiency itself
    is untreated.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Developmental cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  notes: >-
    Deliberately carries no evidence item. Surgical management of congenital
    cataract is standard of care rather than a finding reported in the GCNT2
    literature, and no source cited by this entry states it in a form that could
    be quoted. No disease-modifying therapy targeting the branching defect exists.
definitions:
- name: Copy-number analysis is required alongside sequencing
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Because a large share of reported GCNT2 alleles are multi-kilobase
    Alu-mediated deletions, a molecular workup for congenital cataract that relies
    on sequence variants alone can return negative in a patient who has a causal
    GCNT2 allele. Copy-number analysis of 6p24, or breakpoint mapping by
    long-range PCR, is what closes that gap.
  evidence:
  - reference: PMID:27609212
    reference_title: "Case report of homozygous deletion involving the first coding exons of GCNT2 isoforms A and B and part of the upstream region of TFAP2A in congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of whole exome sequencing data in a patient affected with congenital cataracts identified a pathogenic deletion which was further defined by other techniques."
    explanation: >-
      A worked example of the workflow: exome data flagged a deletion that then
      needed other techniques to define, which is the practice this describes.
  - reference: PMID:27936067
    reference_title: "Deletion at the GCNT2 Locus Causes Autosomal Recessive Congenital Cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCR amplifications of the coding exons of GCNT2 failed in individuals with arCC, and whole-exome data analysis revealed a large deletion on chromosome 6p in the region harboring GCNT2."
    explanation: >-
      The strongest form of this point. In this pedigree the coding exons could not
      be amplified at all, so a sequencing-first workup returns nothing rather than a
      variant to interpret. The lesion was an approximately 190 kb insertion/deletion.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists for the GCNT2 form. Reported families number in
    the low tens, clustered in consanguineous Pakistani, Arab and East Asian
    kindreds. For context only, congenital cataract of all causes occurs at 3 to 6
    per 10,000 live births, and GCNT2 accounts for a small and unquantified share
    of that.
  evidence:
  - reference: PMID:27609212
    reference_title: "Case report of homozygous deletion involving the first coding exons of GCNT2 isoforms A and B and part of the upstream region of TFAP2A in congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital cataracts affect 3-6 per 10,000 live births"
    explanation: >-
      Supports only the all-cause context figure quoted in the notes, not a rate for
      this disease. The prevalence_class band is set qualitatively.
discussions:
- discussion_id: lens_glycan_step_unexplained
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what route does the loss of I-branching on lens glycans produce lens
    opacification?
  attaches_to:
  - pathophysiology#Disrupted Lens Glycan Branching
  rationale: >-
    The gene, the enzyme, the tissue expression and the co-segregation are all
    established, and the isoform partition explains which patients get cataract.
    What is missing is the step in between: no study has shown what the loss of a
    beta-1,6 branch does to the lens. Candidate routes include altered trafficking
    or stability of lens membrane glycoproteins, osmotic disturbance, and
    crystallin aggregation, and nothing in the literature currently distinguishes
    them. The node is marked PROVISIONAL for this reason, and the source paper
    itself says only that a defect at the locus "may lead directly" to cataract.

inheritance:
- name: Autosomal Recessive
  description: Biallelic GCNT2 variants segregate with congenital cataract in homozygous and compound heterozygous families. Both small sequence variants and exon-spanning deletions are reported; their population proportions are not established.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

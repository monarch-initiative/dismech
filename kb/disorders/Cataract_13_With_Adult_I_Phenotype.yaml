    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed homozygosity mapping in a consanguineous Pakistani family segregating autosomal-recessive congenital cataracts and identified linkage to a 3.03 Mb locus on chromosome 6p24 containing the GCNT2 gene.
    explanation: Establishes recessive inheritance and maps it to the GCNT2 locus.
pathophysiology:
- name: Loss of I-Branching Glycosyltransferase Activity
  biological_scale: MOLECULAR
  gene:
    preferred_term: GCNT2
    term:
      id: hgnc:4204
      label: GCNT2
  description: 'Pathogenic GCNT2 alleles impair I-branching glycosyltransferase function. Shared-exon missense alleles have direct functional evidence; nonsense, frameshift and deletion alleles provide additional genetic evidence. The isoforms affected depend on the allele: loss in lens-relevant GCNT2B and in erythroid GCNT2C must not be assumed identical for every genotype.'
  molecular_functions:
  - preferred_term: N-acetyllactosaminide beta-1,6-N-acetylglucosaminyltransferase activity
    term:
      id: GO:0008109
      label: N-acetyllactosaminide beta-1,6-N-acetylglucosaminyltransferase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:11739194
    reference_title: Molecular basis of the adult i phenotype and the gene responsible for the expression of the human blood group I antigen.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These amino acid changes abolished the original GlcNAc-transferase activity.
    explanation: Functional assays of Gly348Glu and Arg383His in the reported IGnTB numbering establish loss of enzyme activity; the corresponding A/C protein positions differ.
  - reference: PMID:12424189
    reference_title: The molecular genetics of the human I locus and molecular background explain the partial association of the adult i phenotype with congenital cataracts.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The human i and I antigens are characterized as linear and branched repeats of N-acetyllactosamine, respectively. Conversion of the i to the I structure requires I-branching beta-1,6-N-acetylglucosaminyltransferase activity.
    explanation: Defines the branching reaction; this introductory statement is not itself a new assay result.
    quote_role: BACKGROUND

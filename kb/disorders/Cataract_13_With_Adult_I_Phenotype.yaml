    description: Proposed tissue consequence when the lens-relevant isoform is impaired; patient lens glycan branching has not been directly measured in these reports.
- name: Persistence of Linear i Antigen on Red Cells
  biological_scale: CELLULAR
  description: Impaired erythroid I-branching leaves relatively high linear i and low branched I antigen on mature red cells. The normal postnatal transition makes serology age-dependent. This antigenic phenotype does not imply spontaneous haemolysis; however, clinically significant allo-anti-I can create transfusion incompatibility.

- name: COS-7 expression of mutant GCNT2 isoforms
  experimental_model_type: CELL_LINE
  cell_source: COS-7 cells expressing recombinant human GCNT2 constructs
  description: Secreted recombinant enzyme constructs were expressed in COS-7 cells and GlcNAc transfer to an acceptor substrate was assayed. Shared-exon missense variants abolished activity across isoforms; vector controls and wild-type constructs provide the comparator. This is an enzyme-function model, not a human lens-opacity model.
  publication: PMID:12424189
  evidence:

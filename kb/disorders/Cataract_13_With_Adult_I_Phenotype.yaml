name: Cataract 13 With Adult I Phenotype
creation_date: "2026-09-09T20:20:00Z"
category: Mendelian
synonyms:
- CTRCT13
- GCNT2-related cataract
- congenital cataract with adult i blood group
description: >-
  Cataract 13 with adult i phenotype is autosomal recessive congenital cataract
  caused by biallelic loss of GCNT2, which encodes the I-branching
  beta-1,6-N-acetylglucosaminyltransferase. That enzyme converts the linear
  poly-N-acetyllactosamine i antigen into the branched I antigen. Fetal red cells
  carry i; the conversion to I happens over roughly the first 18 months of life,
  so losing the enzyme leaves an adult with the rare i blood group. The same loss
  disrupts lens transparency and gives bilateral congenital cataract.

  What makes this entry more than a two-line gene-to-phenotype statement is that
  the two traits are only partially coupled, and the reason is known. The I locus
  transcribes three isoforms, GCNT2A, GCNT2B and GCNT2C, which differ only in
  exon 1 and share exons 2 and 3. GCNT2C is the isoform expressed in red cells
  and governs the blood group; exon 1B-containing transcripts are the ones
  implicated in the lens. A variant in a shared exon, or a deletion spanning the
  locus, truncates everything and produces both traits. A variant confined to
  exon 1C produces the adult i blood group with no cataract. That dissociation is
  a clean piece of genetics, and it is what settles whether these are one disease
  or two: they are one gene with tissue-partitioned transcripts, so this entry
  covers the cataract-bearing genotypes and treats isolated adult i as the
  same locus without the lens involvement rather than as a separate disease.

  The locus sits at 6p24 in a region dense with Alu and other SINE repeats, and a
  striking share of reported alleles are Alu-mediated deletions of tens of
  kilobases rather than point mutations. That has a practical consequence: exome
  sequencing alone can miss the causal allele.

    snippet: previously reported mutations/deletions have either affected all three isoforms (causing blood group and cataract phenotype) or the C isoform only (causing blood group phenotype only)
    explanation: Background summary of earlier genotypes, not direct evidence that the A/B-deletion siblings had normal I expression.
    quote_role: BACKGROUND
  - reference: PMID:27936067
    reference_title: Deletion at the GCNT2 Locus Causes Autosomal Recessive Congenital Cataracts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The expression of the I antigen in blood is regulated only by the IGnTC isoform of GCNT2
    explanation: Background attribution to the earlier expression study, not independent experimental replication.
    quote_role: BACKGROUND
  - reference: url:https://scholars.lib.ntu.edu.tw/bitstreams/32e5ec15-f755-4026-bee4-3e25e3ef4d33/download
    reference_title: https://scholars.lib.ntu.edu.tw/bitstreams/32e5ec15-f755-4026-bee4-3e25e3ef4d33/download
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'By contrast, RT-PCR analysis demonstrated only the expression

      of the IGnTB transcript in the RNA puri ﬁed from human lens-


    snippet: "We performed homozygosity mapping in a consanguineous Pakistani family segregating autosomal-recessive congenital cataracts and identified linkage to a 3.03 Mb locus on chromosome 6p24 containing the GCNT2 gene."
    explanation: "Establishes recessive inheritance and maps it to the GCNT2 locus."
pathophysiology:
- name: Loss of I-Branching Glycosyltransferase Activity
  biological_scale: MOLECULAR
  description: >-
    Biallelic GCNT2 variants abolish or greatly reduce I-branching
    beta-1,6-N-acetylglucosaminyltransferase activity. Reported alleles include
    nonsense variants in shared exon 2 that truncate all three isoforms at once,
    frameshifts, and large Alu-mediated deletions removing whole exons. A missense
    allele in exon 1C has been shown by direct enzyme assay to reduce rather than
    abolish activity, which is the finer-grained version of the same lesion.
  molecular_functions:
  - preferred_term: I-branching beta-1,6-N-acetylglucosaminyltransferase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008109
      label: N-acetyllactosaminide beta-1,6-N-acetylglucosaminyltransferase activity
  evidence:
  - reference: PMID:12424189
    reference_title: "The molecular genetics of the human I locus and molecular background explain the partial association of the adult i phenotype with congenital cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The human i and I antigens are characterized as linear and branched repeats of N-acetyllactosamine, respectively. Conversion of the i to the I structure requires I-branching beta-1,6-N-acetylglucosaminyltransferase activity."
    explanation: "Defines the enzymatic step whose loss this node describes."
  - reference: PMID:15161861
    reference_title: "A nonsense mutation in the glucosaminyl (N-acetyl) transferase 2 gene (GCNT2): association with autosomal recessive congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed in these families a homozygous G-->A substitution in base 58 of exon-2, resulting in the formation of premature stop codons W328X, W326X, and W328X, of the GCNT2A, -B, and -C isoforms, respectively"
    explanation: >-
      A nonsense variant in a shared exon, which is why it truncates all three
      isoforms simultaneously and produces both traits.
  - reference: PMID:17076854
    reference_title: "A novel IGnT allele responsible for the adult i phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The activity of the IGnT enzyme expressed from the mutant IGnTC*243A gene was significantly reduced when compared with that expressed from the wild-type IGnTC gene."
    explanation: >-
      Direct enzyme assay confirming a variant allele reduces catalytic activity,
      rather than the loss being inferred from the phenotype alone.
  downstream:
  - target: Persistence of Linear i Antigen on Red Cells
    causal_link_type: DIRECT
  - target: Disrupted Lens Glycan Branching
    causal_link_type: DIRECT
- name: Persistence of Linear i Antigen on Red Cells
  biological_scale: CELLULAR
  description: >-
    Without I-branching activity the erythrocyte surface keeps the fetal linear i
    structure into adult life instead of converting to branched I. This is the
    serologically detectable adult i blood group, and it is benign: it causes no
    haemolysis and no clinical consequence on its own. Its value here is as a
    marker of the enzymatic lesion, which is how the gene was found in the first
    place.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: branching of poly-N-acetyllactosamine chains
    modifier: DECREASED
    term:
      id: GO:0030311
      label: poly-N-acetyllactosamine biosynthetic process
  evidence:
  - reference: PMID:28224043
    reference_title: "Pleiotropic effect of a novel mutation in GCNT2 causing congenital cataract and a rare adult i blood group phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "i antigens are predominant on fetal red blood cells, whereas adult human red blood cells fully express I antigens with a very low level of i antigens. The conversion of i to I occurs during the first 18 months after birth as a result of the expression of the I-branching enzyme"
    explanation: >-
      Describes the developmental conversion this node says fails, and its timing.
  - reference: PMID:21761136
    reference_title: "An Alu repeat-mediated genomic GCNT2 deletion underlies congenital cataracts and adult i blood group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we showed that cataract-affected individuals in both families have the adult i blood group, whereas unaffected individuals have blood group I as the vast majority of the population"
    explanation: "Co-segregation of the blood group with the cataract within families."
  downstream:
  - target: Adult i blood group phenotype
    causal_link_type: DIRECT
- name: Disrupted Lens Glycan Branching
  biological_scale: TISSUE
  conforms_to: "cataract_lens_opacification#Lens Homeostasis Insult"
  description: >-
    The I antigen is present on lens epithelium as well as on red cells, and loss
    of branching there is what produces the cataract. The isoform expression data
    put the lens-relevant transcripts and the erythroid transcript on different
    exon 1 variants, which is what makes the two consequences separable.

    How the loss of a glycan branch actually causes lens opacification is not
    established. The published work demonstrates that GCNT2 is expressed in lens
    epithelium and that its loss co-segregates with cataract; it does not
    demonstrate the intervening step, whether that is altered membrane protein
    trafficking, osmotic change, or protein aggregation. This node therefore
    states the association and stops there rather than supplying a mechanism the
    literature does not.
  cell_types:
  - preferred_term: lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:12424189
    reference_title: "The molecular genetics of the human I locus and molecular background explain the partial association of the adult i phenotype with congenital cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enzyme function assays and expression patterns for the 3 IGnT transcripts in reticulocytes and lens-epithelium cells were analyzed"
    explanation: >-
      The isoform expression analysis in lens epithelium specifically, which is what
      grounds the lens as the affected tissue.
  - reference: PMID:12424189
    reference_title: "The molecular genetics of the human I locus and molecular background explain the partial association of the adult i phenotype with congenital cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results suggest a molecular genetic mechanism that may explain the partial association of the adult i phenotype with congenital cataracts and indicate that a defect in the I locus may lead directly to the development of congenital cataracts."
    explanation: >-
      Note the authors' own hedging: "suggest" and "may lead directly". This is why
      the node is marked PROVISIONAL rather than carrying a definite mechanism.
  notes: >-
    On the module conformance declared above: this node substitutes the
    disorder-specific insult, as cataract_lens_opacification's own notes direct,
    and two of that module node's expectations are deliberately not met. It does
    not carry the module node's response to oxidative stress process, because the
    GCNT2 lesion is a glycan-branching defect and asserting oxidative stress here
    would be inventing a mechanism. It binds only lens epithelial cell and not the
    module's lens fiber cell, because the sources locate the I antigen and GCNT2
    expression in lens epithelium.
  downstream:
  - target: Developmental cataract
    causal_link_type: DIRECT
  - target: Visual impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

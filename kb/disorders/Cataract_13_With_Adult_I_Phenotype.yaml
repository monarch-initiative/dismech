    explanation: The institutional full text of PMID:12424189 reports RT-PCR in four adult surgical lenses. This establishes expression in the sampled adult epithelium, not expression throughout embryonic lens development.
  - reference: url:https://ambrygen.com/wp-content/uploads/2026/04/69b2cded0bc84_ONeill-A-et-al_ACMG_Case-report-with-biallelic-variants-in-GCNT2-implicates-exon-1B-in-congenital-cataracts_Poster.pdf
    reference_title: https://ambrygen.com/wp-content/uploads/2026/04/69b2cded0bc84_ONeill-A-et-al_ACMG_Case-report-with-biallelic-variants-in-GCNT2-implicates-exon-1B-in-congenital-cataracts_Poster.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Paternal exon 1A and 1B deletion
    explanation: The authors' poster labels the same case's deletion A/B, whereas the PMID abstract says B/C. Both include B; the other exon is unresolved between sources.
  notes: The 2026 abstract (PMID:41813616) reports a 1B/1C deletion, whereas the same-case ACMG poster reports a paternal 1A/1B deletion. The maternal NM_001491.3:c.760dup p.H254Pfs*2 exon-1B variant is consistent between them. The poster is not independent replication. Its authors could not completely exclude an alternative syndromic cataract explanation for unexplained nonocular findings. The 2016 A/B-deletion family has no reported I/i serology; intact C coding sequence is not proof of normal erythroid expression.

    supports: SUPPORT
    evidence_source: OTHER
    snippet: i antigens are predominant on fetal red blood cells, whereas adult human red blood cells fully express I antigens with a very low level of i antigens. The conversion of i to I occurs during the first 18 months after birth as a result of the expression of the I-branching enzyme
    explanation: Provides developmental context for interpreting persistent i expression.
    quote_role: BACKGROUND

prevalence:
- population: Worldwide
  prevalence_class: UNKNOWN
  notes: The reviewed GCNT2 literature consists of ascertained families and case reports and does not provide a population-based disease prevalence. All-cause congenital cataract rates and historical i-blood-group series cannot supply that estimate.
discussions:
- discussion_id: lens_glycan_step_unexplained
  kind: KNOWLEDGE_GAP
  prompt: Which lens substrate and cellular process connect impaired GCNT2 branching to congenital opacity?
  attaches_to:
  - pathophysiology#Disrupted Lens Glycan Branching
  - pathophysiology#Lens Opacification
  rationale: Genetic association and adult lens isoform expression support involvement of GCNT2B, but the pathogenic lens glycan substrates and intervening cellular events remain unresolved. Trafficking, osmotic injury and aggregation should not be presented as demonstrated steps.
- discussion_id: mouse_lens_nonphenocopy
  kind: HUMAN_MODEL_MISMATCH
  prompt: Why does common-exon Gcnt2 deletion fail to reproduce early human cataract in mice?
  attaches_to:
  - pathophysiology#Lens Opacification
  rationale: The primary knockout study documents substantial tissue enzyme deficiency without earlier cataract. Alternative glycosyltransferase compensation remains a hypothesis and does not establish a therapeutic rescue.
  evidence:
  - reference: PMID:16107727
    reference_title: Abnormalities caused by carbohydrate alterations in Ibeta6-N-acetylglucosaminyltransferase-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: However, cataracts did not develop earlier in the deficient mice.
    explanation: The knockout did not reproduce the human early cataract phenotype.

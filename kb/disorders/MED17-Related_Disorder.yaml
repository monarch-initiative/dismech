prevalence:
- population: Caucasus Jewish
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare, clustering in Caucasus-Jewish founder families carrying the recurrent
    p.Leu371Pro allele. A later delineation study assembled 15 patients (10 males, 5 females)
    from 11 families carrying the same founder allele. No population-based prevalence
    estimate is available.
  evidence:
  - reference: PMID:20950787
    reference_title: "Infantile cerebral and cerebellar atrophy is associated with a mutation in the MED17 subunit of the transcription preinitiation mediator complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all homozygous for the p.L371P mutation and all originating from Caucasus Jewish families."
    explanation: Documents the founder-population structure of the defining cohort.
  - reference: PMID:33756211
    reference_title: "Delineation of the phenotype of MED17-related disease in Caucasus-Jewish families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study cohort, including the previously reported patients, comprised 10 males and 5 females from 11 families."
    explanation: Documents the expanded founder-allele cohort (15 patients from 11 families), supporting the statement that additional families have been reported.
pathophysiology:
- name: MED17 head-module Mediator dysfunction
  description: >
    MED17 is a subunit of the head module of the Mediator complex, required for RNA polymerase
    II preinitiation. The recurrent p.Leu371Pro variant is a loss-of-function allele (it
    inactivated the homologous yeast SRB4 gene in complementation assays), disrupting
    Mediator-dependent transcription. The resulting phenotype is a severe, postnatal-onset
    neurodegenerative process. MED17 belongs to the group of Mediator complex-associated
    disease genes.
  genes:
  - preferred_term: MED17
    term:
      id: hgnc:2375
      label: MED17
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20950787
    reference_title: "Infantile cerebral and cerebellar atrophy is associated with a mutation in the MED17 subunit of the transcription preinitiation mediator complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A corresponding mutation in the homologous S.cerevisiae gene SRB4 inactivated the protein, according to complementation assays."
    explanation: Yeast complementation establishes the MED17 founder allele as loss-of-function.
  downstream:
  - target: Postnatal neurodegeneration and brain atrophy
    description: >-
      MED17 loss of function disrupts Mediator-dependent transcription, producing postnatal
      progressive microcephaly with cerebral and cerebellar atrophy.
- name: Postnatal neurodegeneration and brain atrophy
  description: >
    Downstream of MED17 head-module dysfunction, a severe postnatal neurodegenerative process
    produces declining head-circumference percentiles (postnatal progressive microcephaly),
    marked cerebral and cerebellar atrophy with a severe myelination defect, spasticity,
    epilepsy, and profound psychomotor retardation.

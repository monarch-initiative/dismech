    explanation: Documents the expanded founder-allele cohort (15 patients from 11 families), supporting the statement that additional families have been reported.
pathophysiology:
- name: MED17 head-module Mediator dysfunction
  description: 'MED17 is a subunit of the head module of the Mediator complex, required for RNA polymerase II preinitiation. The recurrent p.Leu371Pro variant is a loss-of-function allele (it inactivated the homologous yeast SRB4 gene in complementation assays), disrupting Mediator-dependent transcription. The resulting phenotype is a severe, postnatal-onset neurodegenerative process. MED17 belongs to the group of Mediator complex-associated disease genes.

    '

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygosity for this mutation is associated with infantile cerebral and cerebellar atrophy with poor myelination."
    explanation: Documents the cerebral/cerebellar atrophy and myelination defect central to the disorder.
  downstream:
  - target: Progressive microcephaly
    description: A postnatal neurodegenerative process produces declining head circumference and progressive microcephaly.
  - target: Cerebral atrophy
    description: Neurodegeneration produces marked cerebral atrophy.
  - target: Cerebellar atrophy
    description: Neurodegeneration produces marked cerebellar atrophy.
  - target: Spasticity
    description: Disrupted motor pathways produce spasticity.
  - target: Seizures
    description: Cortical dysfunction produces epilepsy.
  - target: Global developmental delay
    description: The neurodegenerative process produces profound psychomotor retardation.

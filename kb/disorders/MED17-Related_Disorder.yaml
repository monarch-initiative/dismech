name: MED17-Related Disorder
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- Infantile cerebral and cerebellar atrophy with postnatal progressive microcephaly
- MCPHA
- Mental retardation, postnatal progressive microcephaly, and seizures
- MED17-related infantile cerebral and cerebellar atrophy
description: 'MED17-related disorder (MCPHA) is a rare autosomal recessive neurodevelopmental and neurodegenerative disorder caused by biallelic variants in MED17, a subunit of the head module of the Mediator transcriptional coactivator complex, with a recurrent homozygous founder allele (p.Leu371Pro) in Caucasus-Jewish families. Infants are normal at birth and then develop postnatal progressive microcephaly, spasticity, epilepsy, and profound psychomotor retardation; brain MRI shows marked cerebral and cerebellar atrophy with a severe myelination defect. Prognosis is grave. Because MED17 acts in the constitutive head module rather than the dissociable kinase module, MCPHA is one of the founding recessive "core-module" MEDopathies; the p.L371P allele inactivated the homologous yeast gene SRB4 in complementation assays, supporting loss of function.

  '

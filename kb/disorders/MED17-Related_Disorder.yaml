  prevalence_class: BELOW_1_IN_1000000
  notes: Ultra-rare, clustering in Caucasus-Jewish founder families carrying the recurrent p.Leu371Pro allele. A later delineation study assembled 15 patients (10 males, 5 females) from 11 families carrying the same founder allele. No population-based prevalence estimate is available.

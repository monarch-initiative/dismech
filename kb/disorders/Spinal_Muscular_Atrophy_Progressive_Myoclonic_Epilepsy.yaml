treatments:
- name: Antiseizure Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Broad-spectrum antiseizure medications including valproic acid,
    levetiracetam, and clonazepam are used for symptomatic control of myoclonus,
    myoclonic seizures, and generalized seizures, while sodium channel blockers
    and certain GABAergic drugs that aggravate myoclonus are avoided, though
    seizures frequently become treatment-refractory.
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: clonazepam
      term:
        id: CHEBI:3756
        label: clonazepam
  target_mechanisms:
  - target: Cortical Network Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      Broad-spectrum antiseizure agents attenuate cortical epileptiform
      hyperexcitability, myoclonus, and generalized seizures.
  evidence:
  - reference: PMID:41817056
    reference_title: Progressive Myoclonic Epilepsies - A Pragmatic Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Valproic acid is often the first-line ASM in treating PME due to its high
      effectiveness on myoclonus, seizures, and photosensitivity, except in
      MERRF. The first add-on treatments to be considered are levetiracetam and
      benzodiazepines (clonazepam and clobazam).
    explanation: >-
      Supports valproic acid, levetiracetam, and clonazepam as standard
      first-line and add-on antiseizure therapies across progressive myoclonic
      epilepsies including SMA-PME.
  - reference: ORPHA:2590
    reference_title: "Spinal muscular atrophy-progressive myoclonic epilepsy syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment with clonazepam results in complete and lasting improvement of
      the myoclonus.
    explanation: >-
      Orphanet summarizes the historical pre-molecular Jankovic-Rivera family
      report describing marked clonazepam responsiveness, whereas genetically
      confirmed ASAH1-related SMA-PME cohorts typically exhibit progressive
      drug-resistant myoclonic epilepsy.
- name: Multidisciplinary Neuromuscular, Respiratory, and Audiologic Supportive Care
  therapeutic_modality: OTHER
  description: >-
    Because no approved disease-modifying therapy currently exists for SMA-PME,
    multidisciplinary supportive care includes orthotics, wheelchairs, and
    assistive mobility devices for progressive weakness, standard management for
    sensorineural hearing loss and scoliosis, and pulmonary surveillance and
    nutritional support.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Spinal Anterior Horn Motor Neuron Degeneration
    treatment_effect: MODULATES
    description: >-
      Assistive devices, scoliosis care, and respiratory monitoring mitigate
      functional complications of progressive lower motor neuron loss.
  evidence:
  - reference: PMID:29595935
    reference_title: ASAH1-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For SMA-PME: Management may include standard treatment for hearing loss,
      scoliosis, seizures, and tremor. Weakness can be mitigated with the use of
      orthotics, wheelchairs, or other assistive devices.
    explanation: >-
      GeneReviews details standard multidisciplinary supportive management for
      SMA-PME.
progression:
- phase: Childhood motor onset followed by myoclonic epilepsy and adolescent respiratory mortality
  notes: >-
    Proximal lower-extremity weakness typically begins between ages 3 and 7
    years, followed in late childhood by progressive drug-resistant myoclonic
    and generalized seizures; survival from symptom onset to death from
    respiratory complications or status epilepticus is typically 5 to 15 years.
  evidence:
  - reference: PMID:29595935
    reference_title: ASAH1-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SMA-PME is characterized by early-childhood-onset progressive lower motor
      neuron disease manifest typically between ages three and seven years as
      proximal lower-extremity weakness, followed by progressive myoclonic and
      atonic seizures, tremulousness/tremor, and sensorineural hearing loss.
    explanation: >-
      Establishes typical onset of proximal lower-extremity weakness between
      ages 3 and 7 years followed by progressive myoclonic and atonic seizures.
  - reference: PMID:29595935
    reference_title: ASAH1-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The time from disease onset to death from respiratory complications is
      usually five to 15 years.
    explanation: >-
      Documents typical 5-to-15-year survival from disease onset to death from
      respiratory complications.
  - reference: PMID:40017560
    reference_title: "Acid Ceramidase Deficiency: New Insights on SMA-PME Natural History, Biomarkers, and In Cell Enzyme Activity Assay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Death usually results from respiratory complications or status epilepticus
      during adolescence.
    explanation: >-
      Confirms adolescent mortality primarily from respiratory failure or status
      epilepticus.

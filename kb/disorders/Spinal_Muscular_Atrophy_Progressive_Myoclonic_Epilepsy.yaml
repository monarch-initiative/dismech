pathophysiology:
- name: Acid Ceramidase Deficiency
  biological_scale: MOLECULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >-
    Biallelic hypomorphic pathogenic variants in ASAH1 reduce lysosomal acid
    ceramidase (N-acylsphingosine amidohydrolase) catalytic activity while
    retaining partial residual enzyme activity compared with classic infantile
    Farber disease, impairing hydrolytic cleavage of ceramides into sphingosine
    and free fatty acids.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Biallelic germline ASAH1 variants leaving residual acid ceramidase
      activity sufficient to avert classic infantile lipogranulomatosis.

biochemical:
- name: Reduced Acid Ceramidase Activity
  presence: DECREASED
  context: >-
    Decreased acid ceramidase catalytic activity in peripheral blood leukocytes
    or cultured skin fibroblasts, including living-fibroblast in-cell ceramide
    degradation assays showing higher residual activity than classic infantile
    Farber disease.
  notes: >-
    Dried-blood-spot C26-ceramide quantification has also been evaluated
    prospectively as a candidate biomarker in SMA-PME (PMID:40017560), though a
    reliable clinical follow-up biomarker has not yet been established.
  evidence:
  - reference: PMID:29595935
    reference_title: ASAH1-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of an ASAH1-related disorder is established in a proband
      with suggestive clinical findings by identification of biallelic
      pathogenic variants in ASAH1 and/or decreased activity of the enzyme acid
      ceramidase in peripheral blood leukocytes or cultured skin fibroblasts.
    explanation: >-
      Confirms decreased acid ceramidase enzyme activity in leukocytes or
      cultured skin fibroblasts as a diagnostic biochemical hallmark.
  - reference: PMID:22703880
    reference_title: Spinal muscular atrophy associated with progressive myoclonic epilepsy is caused by mutations in ASAH1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression studies of the c.125C>T mutant cDNA in Farber fibroblasts
      showed that acid-ceramidase activity was only 32% of that generated by
      normal cDNA.
    explanation: >-
      Demonstrates reduced (~32% residual) acid ceramidase activity for the
      recurrent SMA-PME p.Thr42Met variant in human fibroblasts.
  - reference: PMID:40017560
    reference_title: "Acid Ceramidase Deficiency: New Insights on SMA-PME Natural History, Biomarkers, and In Cell Enzyme Activity Assay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, an in cell assay could provide a more reliable level of the
      residual ceramidase activity.
    explanation: >-
      Supports living-fibroblast in-cell ceramide degradation assay for
      quantifying residual acid ceramidase activity in SMA-PME.
- name: Intracellular Ceramide Accumulation
  presence: INCREASED
  context: >-
    Intracellular accumulation of ceramides secondary to deficient lysosomal
    acid ceramidase hydrolysis.
  evidence:
  - reference: PMID:36830643
    reference_title: "Acid Ceramidase Deficiency: Bridging Gaps between Clinical Presentation, Mouse Models, and Future Therapeutic Interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These mutations lead to reduced ACDase activity and ceramide (Cer)
      accumulation in many tissues.
    explanation: >-
      Confirms increased tissue ceramide accumulation resulting from ASAH1
      acid ceramidase deficiency.
  - reference: PMID:41817056
    reference_title: Progressive Myoclonic Epilepsies - A Pragmatic Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in theASAH1gene lead to decreased activity of acid ceramidase,
      resulting in an accumulation of ceramides within cells.
    explanation: >-
      Confirms increased intracellular ceramide accumulation in SMA-PME.
genetic:
- name: ASAH1 Pathogenic Variants
  gene_term:
    preferred_term: ASAH1
    term:
      id: hgnc:735
      label: ASAH1
  association: Causative
  notes: >-
    Biallelic pathogenic variants in ASAH1 cause SMA-PME, with recurrent exon 2
    missense mutations including c.125C>T (p.Thr42Met) and c.109C>A (p.Pro37Thr)
    showing genotype-phenotype correlation with SMA-PME onset and higher
    residual enzyme activity (~32% for p.Thr42Met) than classic Farber disease.
  evidence:
  - reference: PMID:22703880
    reference_title: Spinal muscular atrophy associated with progressive myoclonic epilepsy is caused by mutations in ASAH1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ASAH1, located on chromosome 8, was the only gene carrying nonannotated
      variants shared by the three unrelated affected individuals.
    explanation: >-
      Landmark gene-discovery study identifying ASAH1 as the shared causal gene
      across three unrelated SMA-PME families.
  - reference: PMID:22703880
    reference_title: Spinal muscular atrophy associated with progressive myoclonic epilepsy is caused by mutations in ASAH1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous deletion was observed in both the affected child and her
      father, indicating that the affected child was compound heterozygous for
      the c.125C>T mutation inherited from the mother and for a whole-gene
      deletion inherited from her father (data not shown).
    explanation: >-
      Confirms compound heterozygosity for the recurrent exon 2 c.125C>T
      missense variant and whole-gene ASAH1 deletion in SMA-PME.
  - reference: PMID:37280710
    reference_title: "Spinal Muscular Atrophy with Progressive Myoclonic Epilepsy (SMA-PME): three new cases and review of the mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMA-PME is a clinically heterogeneous disorder that arises from biallelic
      pathogenic variants in ASAH1 gene.
    explanation: >-
      Confirms biallelic pathogenic variants in ASAH1 as causative of SMA-PME.
  - reference: PMID:40017560
    reference_title: "Acid Ceramidase Deficiency: New Insights on SMA-PME Natural History, Biomarkers, and In Cell Enzyme Activity Assay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on a comprehensive literature review, we provide a detailed
      description of the natural history of the 44 patients with SMA-PME
      diagnosed to date and show a genotype-phenotype correlation for the 2 main
      variants and the disease onset.
    explanation: >-
      Documents genotype-phenotype correlation for the two main recurrent ASAH1
      variants across 44 reported SMA-PME patients.

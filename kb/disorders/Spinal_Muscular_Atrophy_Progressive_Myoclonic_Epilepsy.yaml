differential_diagnoses:
- name: Farber disease
  description: >-
    Farber disease (Farber lipogranulomatosis) is the severe allelic ASAH1
    acid ceramidase deficiency disorder, distinguished from SMA-PME by
    infantile-onset painful deformed joints, subcutaneous lipogranulomatous
    nodules, and hoarse voice from laryngeal granulomas.
  disease_term:
    preferred_term: Farber lipogranulomatosis
    term:
      id: MONDO:0009218
      label: Farber lipogranulomatosis
  evidence:
  - reference: PMID:36830643
    reference_title: "Acid Ceramidase Deficiency: Bridging Gaps between Clinical Presentation, Mouse Models, and Future Therapeutic Interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Classic signs of FD include, but are not limited to, a hoarse voice,
      distended joints, and lipogranulomas found subcutaneously and in other
      tissues. Patients with SMA-PME lack the most prominent clinical signs seen
      in FD. Instead, they demonstrate muscle weakness, tremors, and myoclonic
      epilepsy.
    explanation: >-
      Directly contrasts the subcutaneous lipogranuloma, joint, and laryngeal
      triad of allelic Farber disease against the neuromuscular and myoclonic
      epilepsy presentation of SMA-PME.
- name: 5q spinal muscular atrophy
  description: >-
    Classic 5q spinal muscular atrophy caused by biallelic SMN1 deletions
    presents with proximal lower motor neuron weakness without progressive
    myoclonic epilepsy or sensorineural hearing loss and is excluded by SMN1/SMN2
    MLPA copy-number analysis.
  evidence:
  - reference: PMID:37280710
    reference_title: "Spinal Muscular Atrophy with Progressive Myoclonic Epilepsy (SMA-PME): three new cases and review of the mutational spectrum."

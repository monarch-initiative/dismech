name: Spinal Muscular Atrophy-Progressive Myoclonic Epilepsy Syndrome
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Spinal muscular atrophy with progressive myoclonic epilepsy (SMA-PME) is a
  rare autosomal recessive lysosomal sphingolipidosis caused by biallelic
  pathogenic variants in ASAH1 that reduce acid ceramidase activity. Impaired
  lysosomal ceramide catabolism causes intracellular ceramide accumulation,
  driving spinal anterior horn lower motor neuron degeneration followed by
  cortical and auditory neuronal dysfunction. Affected children typically
  present in early childhood with progressive proximal lower-limb muscle
  weakness and atrophy, subsequently developing drug-resistant myoclonic,
  atonic, and generalized seizures, action myoclonus, tremor, sensorineural
  hearing impairment, mild cognitive decline, and life-limiting respiratory
  insufficiency. SMA-PME is allelic with Farber disease, lacking the classic
  subcutaneous lipogranulomas and hoarse voice of severe acid ceramidase
  deficiency.
synonyms:
- SMA-PME
- SMAPME
- Jankovic-Rivera syndrome
- Jankovic syndrome
- hereditary myoclonus-progressive distal muscular atrophy syndrome
- spinal muscular atrophy with progressive myoclonic epilepsy
- ASAH1-related spinal muscular atrophy with progressive myoclonic epilepsy
- acid ceramidase deficiency, SMA-PME phenotype

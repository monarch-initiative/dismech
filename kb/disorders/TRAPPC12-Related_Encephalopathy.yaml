pathophysiology:
- name: Biallelic TRAPPC12 Loss of Function
  description: >-
    Biallelic pathogenic variants in TRAPPC12 (also known as TTC15) reduce the
    amount or activity of the TRAPPC12 protein, a subunit of the TRAPP
    (transport protein particle) membrane-tethering complex. Reported alleles
    include frameshift/null variants (c.145delG [p.Glu49Argfs], c.360dupC
    [p.Glu121Argfs]) and missense variants (c.1880C>T [p.Ala627Val], c.679T>G
    [p.Phe227Val]). Because complete loss is expected to be embryonic lethal,
    surviving individuals carry at least one hypomorphic allele; the most severe
    (compound-heterozygous) genotypes have been reported in fetuses with
    hydrocephaly and recurrent pregnancy loss. Beyond its membrane-trafficking
    role, TRAPPC12 (the alias TRAMM denotes "trafficking of membranes and
    mitosis") also participates in mitosis/kinetochore function and in
    ciliogenesis, but the human encephalopathy phenotype is most directly linked
    to the secretory-trafficking defect.

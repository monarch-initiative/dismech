- name: Golgi Fragmentation and Delayed ER-to-Golgi Transport
  description: >-
    Fibroblasts from affected individuals show a fragmented Golgi apparatus and
    delayed anterograde protein transport from the endoplasmic reticulum to and
    through the Golgi. Both abnormalities are rescued by re-expression of
    wild-type TRAPPC12, demonstrating that they are a direct cellular consequence
    of TRAPPC12 deficiency rather than a secondary change.

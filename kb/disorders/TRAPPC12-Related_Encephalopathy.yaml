- name: Progressive Brain Atrophy and Pontine Hypoplasia
  description: >-
    The neuropathological/imaging endpoint is a progressive loss of brain
    parenchyma: cerebral cortical atrophy and cerebellar atrophy that worsen on
    serial imaging, together with pontine (brainstem) hypoplasia, a thin corpus
    callosum and abnormal white matter. This structural regression underlies the
    clinical progression of the encephalopathy.

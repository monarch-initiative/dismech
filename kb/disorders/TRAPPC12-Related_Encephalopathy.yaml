diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Diagnosis is molecular. Because the clinical picture (progressive
    encephalopathy, brain atrophy, spasticity, hearing loss) is shared with many
    other early-onset neurodegenerative disorders and no biochemical marker is
    available, unbiased broad sequencing is the first-line test rather than
    single-gene analysis.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Biallelic (homozygous or compound heterozygous) pathogenic TRAPPC12 variants
    establish the diagnosis. Reported alleles include missense, frameshift, and
    splice-affecting changes.
  presence: Diagnostic when biallelic pathogenic TRAPPC12 variants are identified
  evidence:
  - reference: PMID:32369837
    reference_title: Two Cases with TRAPPC12 Variants with a Recognizable Phenotype
      of Progressive Encephalopathy with Brain Atrophy and Spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: whole-exome sequencing was performed, followed by Sanger sequencing
      for verification
    explanation: >-
      Documents the diagnostic route actually used to establish TRAPPC12
      genotypes in reported patients — exome sequencing with Sanger confirmation.
- name: Sanger Confirmation of the Candidate Variant
  description: >-
    Targeted Sanger sequencing is used to confirm the candidate TRAPPC12 variant
    identified on exome sequencing and, where samples are available, to
    demonstrate biallelic inheritance by parental segregation.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Confirms the exome call and, with parental samples, establishes that the two
    variants are in trans.
  evidence:
  - reference: PMID:32369837
    reference_title: Two Cases with TRAPPC12 Variants with a Recognizable Phenotype
      of Progressive Encephalopathy with Brain Atrophy and Spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: whole-exome sequencing was performed, followed by Sanger sequencing
      for verification
    explanation: Sanger verification of the exome-identified variant is the reported confirmatory step.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Cranial imaging is the principal phenotyping investigation and supplies the
    findings that make the disorder recognizable: progressive cortical atrophy,
    cerebellar atrophy, pontine hypoplasia, and abnormal white matter. It is
    supportive rather than diagnostic — the imaging findings direct sequencing,
    they do not replace it.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Progressive cerebral cortical and cerebellar atrophy with abnormal white
    matter; severity of the cortical versus cerebellar component varies between
    patients.
  notes: >-
    Imaging findings are more variable than the founding cohort suggested, so a
    single atypical scan does not exclude the diagnosis.
  evidence:
  - reference: PMID:32369837
    reference_title: Two Cases with TRAPPC12 Variants with a Recognizable Phenotype
      of Progressive Encephalopathy with Brain Atrophy and Spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Standard clinical examination and cranial imaging studies were performed
      in these two unrelated patients.
    explanation: Cranial imaging is part of the standard diagnostic workup in reported patients.
  - reference: PMID:32369837
    reference_title: Two Cases with TRAPPC12 Variants with a Recognizable Phenotype
      of Progressive Encephalopathy with Brain Atrophy and Spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings suggest that clinical and brain imaging findings might
      be more variable than previously anticipated
    explanation: Supports the caveat that imaging is supportive and variable rather than pathognomonic.

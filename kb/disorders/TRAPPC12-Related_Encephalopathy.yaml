genetic:
- name: TRAPPC12
  gene_term:
    preferred_term: TRAPPC12
    term:
      id: hgnc:24284
      label: TRAPPC12
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic pathogenic or likely pathogenic variants
  notes: >-
    TRAPPC12 (aliases TTC15, TRAMM, CGI-87) lies at 2p25.3 and encodes a
    TRAPPIII-specific subunit of the TRAPP membrane-tethering complex. Reported
    disease alleles include frameshift variants (c.145delG p.Glu49Argfs, c.360dupC
    p.Glu121Argfs), missense variants (c.1880C>T p.Ala627Val, c.679T>G
    p.Phe227Val), a premature-termination frameshift (c.954del), and a distinct
    splice-altering variant (c.1677+5G>A) in the fetal-hydrocephaly family. A
    deep-intronic variant was subsequently evaluated with RNA sequencing. Because
    database classifications and counts change over time, this entry does not
    present a fixed ClinVar pathogenic-variant count.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:28777934
      reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Three individuals from two unrelated families have either a homozygous
        deleterious variant...or compound-heterozygous variants
      explanation: >-
        The founding report documents both homozygous and compound-heterozygous
        disease genotypes, supporting autosomal recessive inheritance.
  evidence:
  - reference: PMID:28777934
    reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report that variants in TRAPPC12 result in progressive childhood encephalopathy.
    explanation: The founding gene-disease association.
  - reference: PMID:32369837
    reference_title: 'Expanding Clinical Phenotype of TRAPPC12-Related Childhood Encephalopathy: Two Cases and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Biallelic mutations in the TRAPPC12 gene are responsible for early-onset progressive encephalopathy with brain atrophy and spasticity (PEBAS).
    explanation: Independent confirmation of the biallelic gene-disease relationship.
  - reference: PMID:32347653
    reference_title: Hydrocephaly associated with compound heterozygous alterations in TRAPPC12.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The variant from the father (c.954del) leads to a premature termination of the transcript; the variant from the mother (c.1677+5G>A) affects a splice site which leads to aberrant splicing of the TRAPPC12 transcript.
    explanation: >-
      Distinguishes the c.954del premature-termination allele from the
      c.1677+5G>A splice-altering allele.
experimental_models:
- name: Affected-person fibroblast Golgi and secretory-transport model
  description: >-
    Primary fibroblasts from all three founding individuals lack full-length
    TRAPPC12, reproduce fragmented Golgi morphology and delayed ER-to-Golgi
    transport, and show prolonged prophase-to-anaphase timing. Re-expression of
    wild-type TRAPPC12 rescues Golgi fragmentation; rescue of the separate
    transport and mitotic readouts was not reported.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Primary dermal fibroblasts from affected individuals and controls
  culture_system: >-
    Fibroblast monolayer with immunoblotting, Golgi morphology,
    cargo-transport, complementation, and live-cell mitotic-timing assays
  publication: PMID:28777934
  modeled_mechanisms:
  - target: Biallelic TRAPPC12 Dysfunction
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The affected-person lines directly reproduce absence of full-length
      TRAPPC12 for both the homozygous and compound-heterozygous genotypes.
    limitations: >-
      Fibroblast protein abundance does not by itself define the consequences in
      neural lineages or the residual activity of every allele.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5544387/
      reference_title: "Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction - PMC"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        As expected for the homozygous truncating variant in 1:II-8, western blot
        analysis failed to detect any full-length...Unexpectedly, the full-length
        protein was also absent in 2:II-1 and 2:II-4
      explanation: >-
        Directly demonstrates the proximal protein-loss phenotype in all three
        founding fibroblast lines.
  - target: Golgi Fragmentation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Directly reproduces fragmented Golgi morphology, with genetic
      complementation tying that readout to TRAPPC12 deficiency.
    limitations: >-
      Fibroblasts do not reproduce neural cell-type vulnerability, progressive
      brain atrophy, or the clinical encephalopathy.
    evidence:
    - reference: PMID:28777934
      reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Fibroblasts derived from all three individuals showed a fragmented Golgi that could be rescued by expression of wild-type TRAPPC12.
      explanation: >-
        Patient-derived cells and wild-type rescue give this model high fidelity
        for the proximal Golgi morphology.
  - target: Delayed ER-to-Golgi Transport
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Directly reproduces delayed cargo movement from the ER to and through the
      Golgi in all three founding affected-person lines.
    limitations: >-
      The transport delay was measured in fibroblasts and was not shown to be
      rescued by wild-type TRAPPC12 or to mediate neural degeneration.
    evidence:
    - reference: PMID:28777934
      reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Protein transport from the endoplasmic reticulum to and through the Golgi was delayed.
      explanation: Directly reports the separate transport-delay readout.
  - target: Prolonged Mitotic Progression
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      All three affected-person fibroblast lines show significantly prolonged
      progression from prophase to anaphase.
    limitations: >-
      The readout is direct, but its contribution to human neural development
      and encephalopathy remains unknown.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5544387/
      reference_title: "Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction - PMC"
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        1:II-8, 2:II-1, and 2:II-4 showed a significant lengthening of the time
        from prophase until the onset of anaphase
      explanation: Directly reports prolonged mitotic timing in all three lines.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5544387/
    reference_title: "Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction - PMC"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As expected for the homozygous truncating variant in 1:II-8, western blot

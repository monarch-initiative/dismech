  prevalence_class: ULTRA_RARE
  notes: >-
    The founding report described three individuals from two unrelated families;
    subsequent publications added two unrelated children, a family with recurrent
    fetal hydrocephalus, and single-case molecular reports. No population-based
    prevalence study or disease-specific registry was identified, so a precise
    case count should not be inferred from this incomplete literature.

diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Diagnosis is molecular. Because the clinical picture (progressive
    encephalopathy, brain atrophy, spasticity, hearing loss) is shared with many
    other early-onset neurodegenerative disorders and no biochemical marker is
    available, exome sequencing has been used in reported cases. This is a
    reported diagnostic route rather than a disease-specific testing guideline;
    genome sequencing or a broad neurodevelopmental panel may also be considered
    according to local practice and prior results.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Biallelic (homozygous or compound heterozygous) pathogenic TRAPPC12 variants
    establish the diagnosis. Reported alleles include missense, frameshift, and
    splice-affecting changes.
  presence: Diagnostic when biallelic pathogenic TRAPPC12 variants are identified
  evidence:
  - reference: PMID:32369837
    reference_title: 'Expanding Clinical Phenotype of TRAPPC12-Related Childhood Encephalopathy: Two Cases and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: whole-exome sequencing was performed, followed by Sanger sequencing for verification
    explanation: >-
      Documents the diagnostic route actually used to establish TRAPPC12
      genotypes in reported patients — exome sequencing with Sanger confirmation.
- name: Sanger Confirmation of the Candidate Variant
  description: >-
    Targeted Sanger sequencing is used to confirm the candidate TRAPPC12 variant
    identified on exome sequencing and, where samples are available, to
    demonstrate biallelic inheritance by parental segregation.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Confirms the exome call and, with parental samples, establishes that the two
    variants are in trans.
  evidence:
  - reference: PMID:32369837
    reference_title: 'Expanding Clinical Phenotype of TRAPPC12-Related Childhood Encephalopathy: Two Cases and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: whole-exome sequencing was performed, followed by Sanger sequencing for verification
    explanation: Sanger verification of the exome-identified variant is the reported confirmatory step.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5544387/

- name: TRAPP Complex Membrane-Tethering and Rab GEF Deficiency
  description: >-
    The TRAPP complex is a multisubunit membrane-tethering complex conserved from
    yeast to humans that functions as a guanine-nucleotide-exchange factor (GEF)
    for Rab GTPases: metazoan TRAPPIII (which contains TRAPPC12) activates Rab1,
    the master regulator of the early secretory pathway and autophagy, while
    TRAPPII activates Rab11 at the late Golgi. Reduced TRAPPC12 impairs this
    shared machine, lowering Rab-dependent tethering and activation at ER-to-Golgi
    and intra-Golgi steps.
  biological_scale: MOLECULAR

- name: Oligodendrocyte Maturation Failure and Hypomyelination
  description: >-
    TRAPPC12 associates with COPII components at endoplasmic-reticulum exit sites
    and, together with MEA6/cTAGE5, supports cargo secretion required for
    oligodendrocyte development. In mouse/oligodendrocyte-progenitor models,
    Trappc12 deficiency impairs oligodendrocyte progenitor differentiation and
    maturation, contributing to the abnormal white matter and delayed myelination
    seen in patients.

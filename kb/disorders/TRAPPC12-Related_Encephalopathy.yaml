  title: Summary
review_notes: >-
  Identity review retained MONDO:0044696 and TRAPPC12 HGNC:24284. The disease
  OMIM identifier is 617669; 614139 is the TRAPPC12 gene MIM number and must not
  be used as the disease identifier. Literature was re-searched through
  2026-08-19. PMID:36995918 is a relevant RNA-sequencing case report, but its
  cached PubMed record contains no abstract and its title is not used as
  evidentiary text. The final 2025 Experimed article is represented by its
  sanctioned open-access PDF cache and directly informs the distinct Phe227Val
  fibroblast model. The founding n=3 report supplies cohort counts rather than
  population-frequency enums. Neonatal hypertension and vocal-cord paralysis
  occurred together in one individual, while hip subluxation and polyhydramnios
  were each reported in isolated individuals; presumed respiratory-insufficiency
  death was reported for one sibling but attribution was uncertain. These
  isolated or attribution-uncertain secondary observations remain documented
  here rather than promoted to recurring disease phenotypes. The 2026 Aspergillus
  autophagy study is current functional evidence but not human clinical evidence.
  No GeneReviews chapter, disease-specific public dataset, epidemiologic cohort,
  patient-derived neural model, or TRAPPC12 whole-animal disease model was
  identified. Rat CG4 knockout and primary mouse OPC knockdown cultures are
  represented as distinct low-fidelity systems. The Mea6 conditional-knockout
  mouse is retained only as a low-fidelity interacting-pathway model. Treatment
  entries are explicitly supportive extrapolations because no TRAPPC12-specific
  treatment-outcome study was found. Causal edges with unresolved intermediates
  are marked accordingly rather than upgraded from association.

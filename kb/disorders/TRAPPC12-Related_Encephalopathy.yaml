name: TRAPPC12-Related Encephalopathy
creation_date: '2026-08-05T00:00:00Z'
category: Mendelian
synonyms:
- PEBAS
- early-onset progressive encephalopathy-hearing loss-pons hypoplasia-brain atrophy
  syndrome
- early-onset progressive encephalopathy with brain atrophy and spasticity
- TRAPPC12-related childhood encephalopathy
- TRAPPC12-related disorder
- TTC15-related encephalopathy
description: >-
  TRAPPC12-related encephalopathy (PEBAS, "progressive encephalopathy with brain
  atrophy and spasticity") is an ultra-rare autosomal recessive
  neurodevelopmental disorder caused by biallelic loss-of-function variants in
  TRAPPC12. Affected children present in early infancy with severe global
  developmental delay that evolves into developmental regression, congenital or
  progressive (postnatal) microcephaly, sensorineural hearing loss, and a mixed
  movement disorder combining truncal hypotonia with appendicular spasticity,
  dystonia and/or myoclonus. Epilepsy is common but not universal. Serial brain
  imaging shows a characteristic and progressive pattern of cerebral cortical and
  cerebellar atrophy, pontine hypoplasia, a thin corpus callosum and abnormal
  (delayed/deficient) white-matter myelination. TRAPPC12 encodes a subunit of the
  multisubunit TRAPP (transport protein particle) membrane-tethering complex,
  which acts as a guanine-nucleotide-exchange factor for the Rab GTPases (Rab1
  via TRAPPIII, Rab11 via TRAPPII) that govern endoplasmic-reticulum-to-Golgi and
  intra-Golgi vesicular trafficking and autophagy. Patient fibroblasts show a
  fragmented Golgi apparatus and delayed ER-to-Golgi transport that are rescued
  by wild-type TRAPPC12, placing the disorder among the "TRAPPopathies" of
  membrane trafficking. Only a handful of individuals from a small number of
  consanguineous and non-consanguineous families have been reported. Management
  is entirely supportive.

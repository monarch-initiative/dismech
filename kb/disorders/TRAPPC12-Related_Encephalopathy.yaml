pathophysiology:
- name: Biallelic TRAPPC12 Dysfunction
  description: >-
    Biallelic pathogenic variants in TRAPPC12 (also known as TTC15 or TRAMM)
    perturb protein abundance or function. Full-length protein was absent from
    fibroblasts of all three founding individuals, who carried homozygous or
    compound-heterozygous frameshift/missense genotypes. A later homozygous
    Phe227Val fibroblast study likewise found absent or markedly reduced mature
    protein but only mild organelle abnormalities. Separately,
    compound-heterozygous c.954del and c.1677+5G>A variants were found in a
    family with recurrent fetal hydrocephalus; the former causes premature
    termination and the latter was shown to alter splicing. A surviving child
    with a homozygous frameshift means complete loss of detectable full-length
    protein should not be described as uniformly embryonic lethal.

name: TRAPPC12-Related Encephalopathy
creation_date: '2026-08-05T00:00:00Z'
category: Mendelian
synonyms:
- PEBAS
- early-onset progressive encephalopathy-hearing loss-pons hypoplasia-brain atrophy syndrome
- early-onset progressive encephalopathy with brain atrophy and spasticity
- TRAPPC12-related childhood encephalopathy
- TRAPPC12-related disorder
- TTC15-related encephalopathy
description: >-
  TRAPPC12-related encephalopathy (PEBAS, "progressive encephalopathy with brain
  atrophy and spasticity") is an ultra-rare autosomal recessive
  neurodevelopmental disorder caused by biallelic pathogenic variants in
  TRAPPC12. Founding frameshift/missense genotypes were associated with absent
  full-length TRAPPC12 in affected-person fibroblasts, while a later Phe227Val
  fibroblast study found absent or markedly reduced mature protein with milder
  organelle abnormalities. Affected children present in early infancy with
  severe global developmental delay that can evolve into developmental
  regression, congenital or progressive (postnatal) microcephaly, hearing loss,
  and a mixed
  movement disorder combining truncal hypotonia with appendicular spasticity,
  dystonia and/or myoclonus. Epilepsy is common but not universal. Serial brain
  imaging can show progressive supratentorial atrophy, pontine hypoplasia,
  callosal agenesis or severe thinning, simplified gyri, widened extra-axial
  spaces and deficient white-matter myelination; cerebellar hypoplasia or atrophy
  is variable. TRAPPC12 encodes a subunit of the
  multisubunit TRAPPIII membrane-trafficking complex. Biochemical studies show
  mammalian TRAPPIII GEF activity toward Rab1 and Rab43, while cell models place
  TRAPPC12 at ER exit sites and link it to COPII-coat assembly. Patient
  fibroblasts from the founding cohort show Golgi fragmentation that is rescued
  by wild-type TRAPPC12 and a separately measured delay in ER-to-Golgi transport.
  The Phe227Val fibroblast study instead found mild Golgi/ER abnormalities and
  persisting vesicle trafficking, showing genotype-dependent cellular severity.
  Published evidence remains limited to small case series, single-case reports,
  and experimental cell systems. No disease-modifying treatment has been
  established.

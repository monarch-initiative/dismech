        Sec31A protein than those budded form wildtype cytosol, while
        vesicle-bound Sec23A was similar between two groups
      explanation: >-
        The knockout budding assay directly isolates reduced outer-coat Sec31A
        recruitment while showing similar inner-coat Sec23A.

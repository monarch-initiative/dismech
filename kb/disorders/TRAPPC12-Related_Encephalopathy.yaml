discussions:
- discussion_id: gap_trappc12_trafficking_to_neural_selectivity
  prompt: Which neuronal or glial mechanisms connect the affected-person fibroblast organelle and transport abnormalities to selective progressive brain atrophy and encephalopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Golgi Fragmentation
  - pathophysiology#Delayed ER-to-Golgi Transport
  - pathophysiology#Progressive Brain Atrophy
  rationale: >-
    Human genetics and affected-person fibroblasts establish a proximal
    TRAPPC12-dependent secretory-pathway defect, but no patient-derived neural
    model defines the intervening cell-death, developmental, or circuit process.
  evidence:
  - reference: PMID:28777934
    reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Fibroblasts derived from all three individuals showed a fragmented Golgi that could be rescued by expression of wild-type TRAPPC12.
    explanation: >-
      Establishes rescue of the Golgi morphology specifically while leaving both
      the transport-to-neural bridge and transport rescue unresolved.
- discussion_id: mismatch_trappc12_opc_to_human_white_matter
  prompt: Does TRAPPC12-dependent oligodendrocyte differentiation failure cause the human white-matter imaging phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Oligodendrocyte Differentiation
  - phenotype#Hyperintensity of cerebral white matter on MRI
  - animal_model#Oligodendrocyte-lineage Mea6 conditional-knockout mouse
  rationale: >-
    A rat CG4 CRISPR-knockout line and primary mouse OPC shRNA culture support an
    oligodendroglial differentiation phenotype, but the in-vivo mouse has
    conditional Mea6—not Trappc12—ablation. No patient-derived oligodendrocyte
    or TRAPPC12 disease animal model currently connects those readouts to the
    increased cerebral white-matter T2 signal reported in affected people.
  proposed_experiments:
  - experiment_id: exp_trappc12_isogenic_human_oligodendrocytes
    name: Isogenic affected-person iPSC oligodendrocyte differentiation and trafficking study
    description: >-
      Generate oligodendrocytes from affected-person iPSCs and CRISPR-corrected
      isogenic controls, then measure lineage progression, MBP-positive cell
      fraction, myelin-sheath formation, Golgi morphology, synchronized
      ER-to-Golgi cargo transport, and cell survival across maturation.
    decision_criterion: >-
      Concordant rescue of oligodendrocyte differentiation and myelin formation
      by correction, with rescue tracking a specific TRAPPC12 cellular readout,
      would support the proposed human pathway; normal differentiation despite
      correction-sensitive fibroblast phenotypes would refute direct
      oligodendroglial mediation of the MRI signal.
  evidence:
  - reference: PMID:38439956
    reference_title: Mea6/cTAGE5 cooperates with TRAPPC12 to regulate PTN secretion and white matter development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we found that Trappc12 deficiency in CG4 and oligodendrocyte progenitor cells (OPCs) affects their differentiation and maturation.
    explanation: Directly supports the culture result that motivates the question.
  - reference: PMID:38439956
    reference_title: Mea6/cTAGE5 cooperates with TRAPPC12 to regulate PTN secretion and white matter development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Mea6/cTAGE5 ablation in OPCs affects their proliferation and differentiation, leading to marked hypomyelination, compromised synaptic functionality, and aberrant behaviors in mice.
    explanation: >-
      Identifies the gene mismatch in the only in-vivo model used to support the
      white-matter pathway.
- discussion_id: hypothesis_trappc12_mitosis_cilia_autophagy
  prompt: Does prolonged mitotic progression contribute to the human neural phenotype, and do ciliary or autophagic functions form additional disease branches?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic TRAPPC12 Dysfunction
  - pathophysiology#Prolonged Mitotic Progression
  rationale: >-
    All three founding fibroblast lines show prolonged prophase-to-anaphase
    timing, while TRAPPC12 depletion perturbs chromosome congression and cilium
    disassembly in human cell lines and a 2026 Aspergillus study places a
    TRAPPC11/12/13 subcomplex in autophagy. No experiment links these functions
    to affected-person neural tissue, so their disease contribution remains
    provisional.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5544387/
    reference_title: "Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction - PMC"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      1:II-8, 2:II-1, and 2:II-4 showed a significant lengthening of the time
      from prophase until the onset of anaphase
    explanation: >-
      Establishes the affected-person mitotic readout while leaving neural
      relevance unresolved.
  - reference: PMID:25918224
    reference_title: TRAMM/TrappC12 plays a role in chromosome congression, kinetochore stability, and CENP-E recruitment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Depletion of TRAMM resulted in noncongressed chromosomes and arrested cells in mitosis.
    explanation: Establishes the mitotic cell-line phenotype, not its disease relevance.
  - reference: PMID:32258032
    reference_title: Distinct Roles of TRAPPC8 and TRAPPC12 in Ciliogenesis via Their Interactions With OFD1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TRAPPC12 depletion causes increased ciliary length because TRAPPC12 is required for the disassembly of primary cilia.
    explanation: Establishes a cilium-disassembly phenotype in hTERT-RPE1 cells.
  - reference: PMID:42483769
    reference_title: A Tca17TRAPPC2L/TRAPPC11/12/13 subcomplex directs TRAPPIII to autophagy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: We studied TRAPPC11/12/13 in the related ascomycete Aspergillus nidulans, where TRAPPC11 and TRAPPC12 localize to pre-autophagosomes and their ablation impairs autophagy.
    explanation: >-
      Adds current model-organism evidence for autophagic targeting but does not
      establish a human disease mechanism.
- discussion_id: gap_trappc12_patient_variant_gef_activity
  prompt: Do disease-associated TRAPPC12 variants alter TRAPPIII Rab-GEF activity in affected human cells?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic TRAPPC12 Dysfunction
  - pathophysiology#Reduced COPII Outer-Coat Assembly
  rationale: >-
    Purified mammalian TRAPPIII has GEF activity toward Rab1 and Rab43, but no
    cited patient-cell experiment directly measures nucleotide-exchange activity
    or shows that altered GEF activity mediates the COPII, Golgi, or
    cargo-transport readouts. Normal complex function must therefore not be converted
    into a patient-specific mechanism without testing.
  evidence:
  - reference: PMID:34229011
    reference_title: Biochemical Insight into Novel Rab-GEF Activity of the Mammalian TRAPPIII Complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GEF assays revealed that TRAPPIII has GEF activity against Rab1 and Rab43,
      with no detectable activity against the other 18 Rabs tested.
    explanation: >-
      Defines the normal purified-complex activity that remains unmeasured for
      disease-associated variants in affected human cells.

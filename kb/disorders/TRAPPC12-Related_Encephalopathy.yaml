genetic:
- name: TRAPPC12
  gene_term:
    preferred_term: TRAPPC12
    term:
      id: hgnc:24284
      label: TRAPPC12
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic pathogenic or likely pathogenic variants
  notes: >-
    TRAPPC12 (aliases TTC15, TRAMM, CGI-87) lies at 2p25.3 and encodes a
    TRAPPIII-specific subunit of the TRAPP membrane-tethering complex. Reported
    disease alleles include frameshift variants (c.145delG p.Glu49Argfs, c.360dupC
    p.Glu121Argfs), missense variants (c.1880C>T p.Ala627Val, c.679T>G
    p.Phe227Val), and splice-site variants (c.954del and c.1677+5G>A in the
    fetal-hydrocephaly family); a deep-intronic splice-affecting variant has also
    been characterized by RNA sequencing. A 2024 review notes ClinVar lists on the
    order of 21 pathogenic/likely-pathogenic TRAPPC12 variants spanning frameshift,
    nonsense, and splicing classes.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28777934
    reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy
      and Golgi Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report that variants in TRAPPC12 result in progressive childhood
      encephalopathy.
    explanation: The founding gene-disease association.
  - reference: PMID:32369837
    reference_title: 'Expanding Clinical Phenotype of TRAPPC12-Related Childhood Encephalopathy:
      Two Cases and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Biallelic mutations in the TRAPPC12 gene are responsible for early-onset
      progressive encephalopathy with brain atrophy and spasticity (PEBAS).
    explanation: Independent confirmation of the biallelic gene-disease relationship.

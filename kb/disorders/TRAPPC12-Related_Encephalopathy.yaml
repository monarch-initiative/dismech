- category: Neurologic
  name: Global developmental delay
  description: >-
    Affected children show severe global or neurodevelopmental delay from infancy.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:32369837
    reference_title: 'Expanding Clinical Phenotype of TRAPPC12-Related Childhood Encephalopathy: Two Cases and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two patients carrying TRAPPC12 variants, one previously reported
      and one unknown mutation, with severe neurodevelopmental delay and brain atrophy.
    explanation: Directly reports severe neurodevelopmental delay in two affected children.
- category: Neurologic
  name: Microcephaly
  description: >-
    Microcephaly is a cardinal feature, present in all three individuals of the
    founding discovery cohort. Onset is heterogeneous — congenital in two of the
    three and acquired/postnatal in one — so the unqualified term is used for the
    general finding, with the progressive subset recorded separately below.
    Microcephaly is not fully penetrant: a later-reported patient with a novel
    TRAPPC12 variant lacked it.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  evidence:
  - reference: PMID:28777934
    reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The clinical phenotypes of the three individuals are strikingly similar: severe disability, microcephaly, hearing loss, spasticity, and characteristic brain imaging findings.'
    explanation: >-
      Microcephaly is named as a shared cardinal feature of all three individuals
      in the founding discovery cohort.
  - reference: PMID:32369837
    reference_title: 'Expanding Clinical Phenotype of TRAPPC12-Related Childhood Encephalopathy: Two Cases and Review of Literature.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: neither clinically manifest epilepsy nor microcephaly, which were previously considered typical findings in PEBAS with TRAPPC12 mutations
    explanation: >-
      Documents an affected individual without microcephaly, establishing that the
      feature is typical but not obligate.
- category: Neurologic
  name: Progressive microcephaly
  description: >-
    In one founding child, microcephaly was acquired/postnatal and the clinical
    course included arrested head growth. Recorded separately from the general
    Microcephaly entry because this serial-growth qualifier applies to only one
    of the three individuals in the founding cohort.
  phenotype_term:
    preferred_term: Progressive microcephaly
    term:

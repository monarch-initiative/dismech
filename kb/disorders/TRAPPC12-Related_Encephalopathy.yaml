- name: Neurodevelopmental disorder with epilepsy, spasticity, and brain atrophy
  description: >-
    Biallelic TRAPPC4 disease is a close molecular and clinical TRAPPopathy mimic,
    with early developmental impairment, microcephaly, spasticity, epilepsy, and
    progressive brain atrophy.
  disease_term:
    preferred_term: neurodevelopmental disorder with epilepsy, spasticity, and brain atrophy
    term:
      id: MONDO:0032894
      label: neurodevelopmental disorder with epilepsy, spasticity, and brain atrophy
  distinguishing_features:
  - Biallelic pathogenic TRAPPC12 variants establish TRAPPC12-related encephalopathy.
  - Biallelic pathogenic TRAPPC4 variants establish the TRAPPC4-related disorder.
  - Pontine hypoplasia and hearing impairment particularly support the TRAPPC12 phenotype, but clinical overlap prevents exclusion by examination alone.
  evidence:
  - reference: PMID:28777934
    reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy and Golgi Dysfunction.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Variants in several other genes encoding members of the TRAPP complex have been associated with overlapping clinical presentations, indicating shared and distinct functions for each complex member.
    explanation: >-
      Establishes the overlapping TRAPPopathy differential in general; molecular
      testing is required to distinguish the causal subunit.
- name: Pontocerebellar hypoplasia
  description: >-
    Genetic pontocerebellar hypoplasias can overlap through infantile developmental
    impairment, microcephaly, abnormal tone, seizures, and pontine/cerebellar
    abnormalities.
  disease_term:
    preferred_term: pontocerebellar hypoplasia
    term:
      id: MONDO:0020135
      label: pontocerebellar hypoplasia
  distinguishing_features:
  - The progressive cerebral cortical atrophy, hearing loss, and patient-cell Golgi phenotype support TRAPPC12 disease but are not individually pathognomonic.
  - Molecular identification of the causal gene is required because imaging patterns overlap.
  notes: >-
    This is a syndrome-level differential; individual pontocerebellar hypoplasia
    genes should be selected according to imaging, systemic findings, and ancestry.

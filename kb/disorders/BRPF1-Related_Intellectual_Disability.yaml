  description: >-
    Heterozygous BRPF1 variants act in a dominant, haploinsufficiency mode.
    Unlike many de-novo-dominant chromatinopathies, a large fraction of reported
    BRPF1 variants are inherited from a mildly affected or apparently unaffected
    parent, and recurrence in one reported sibship suggested parental gonadal mosaicism.
    Expressivity is wide even within a single family.

genetic:
- name: BRPF1 Pathogenic Variants
  gene_term:
    preferred_term: BRPF1
    term:
      id: hgnc:14255
      label: BRPF1
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: 'BRPF1 lies at 3p25.3 (GRCh38 chr3:9731735-9748015, per the ClinGen dosage record cited below). Reported pathogenic alleles are heterozygous and predominantly loss-of-function - nonsense, frameshift, and whole- or partial-gene deletions - with a minority of missense and stop-loss variants whose pathogenicity requires variant-specific functional support. Both de novo and inherited alleles are common, and recurrence in one sibship suggests parental gonadal mosaicism despite negative parental buccal testing. Gonadal tissue and parent-of-origin were not established. A contiguous 3p25 deletion may remove BRPF1 with the neighbouring SETD5; in that setting both genes contribute to severity, but ptosis and blepharophimosis were particularly associated with BRPF1 disruption in the founding comparison. No robust genotype-phenotype correlation by variant position has been established. The authoritative dosage-mechanism assertion is ClinGen''s: haploinsufficiency score 3 (Sufficient Evidence), triplosensitivity score 0 (No Evidence), curated 2023-08-23 against MONDO:0015022. gnomAD constraint (pLI/LOEUF) is deliberately not asserted: no cached, quotable source for the exact values was available,
    and per the project evidence SOP an unsourceable number is dropped rather than approximated. The p.Val352Leu case report explicitly classifies that missense variant as uncertain significance in its methods, despite stronger causal wording elsewhere; structural modeling alone does not establish pathogenicity.'
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: Heterozygous BRPF1 variants segregate in an autosomal dominant pattern with variable expressivity; in one multiplex family the variant segregated fully with disease across two generations.
    evidence:
    - reference: PMID:31020800
      reference_title: BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: the mutation fully segregated with the disease in the family
      explanation: The familial p.Gln186Ter allele segregated with the BRPF1 phenotype. A sibling with Leber hereditary optic neuropathy instead carried an MT-ND1 variant and did not share the BRPF1 phenotype.
  evidence:
  - reference: CGDS:HGNC_14255
    reference_title: BRPF1 dosage sensitivity
    supports: SUPPORT
    evidence_source: OTHER
    snippet: BRPF1 | HGNC:14255 | 7862 | 3p25.3 | chr3:9731735-9748015 | 3 - Sufficient Evidence for Haploinsufficiency | 0 - No Evidence for Triplosensitivity | 2023-08-23
    explanation: ClinGen's dosage sensitivity curation scores BRPF1 haploinsufficiency at 3 (Sufficient Evidence) and triplosensitivity at 0 (No Evidence), fixing the disease mechanism as loss of one functional copy and locating the gene at 3p25.3.
  - reference: CGDS:HGNC_14255
    reference_title: BRPF1 dosage sensitivity
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Numerous loss-of-function mutations have been reported in intellectual developmental disorder with dysmorphic facies and ptosis (IDDDFP) patients, and functional analyses support a haploinsufficiency of the BRPF1 gene.
    explanation: ClinGen's evidence summary states the haploinsufficiency conclusion explicitly and grounds it in both variant spectrum and functional assays.
  - reference: PMID:27939640
    reference_title: Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These data indicate that aberrations in the chromatin regulator gene BRPF1 cause histone H3 acetylation deficiency and a previously unrecognized intellectual disability syndrome.
    explanation: Establishes BRPF1 as the causative gene for a distinct intellectual disability syndrome.
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thirteen of the 17 unique variants were truncating variants leading to haploinsufficiency, including frameshift variants
    explanation: Quantifies the truncating predominance (13/17 unique alleles) that underpins the haploinsufficiency mechanism.
  - reference: PMID:32457794
    reference_title: Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Bioinformatics of WES data and candidate gene prioritization identified a novel variant in heterozygous state in the exon 3 of BRPF1 gene (ENST383829: c.1054G > C and p.Val352Leu).'
    explanation: Documents the reported p.Val352Leu missense allele, which the paper methods classify as uncertain significance. It is not confirmed functional loss of BRPF1.
  - reference: PMID:40752867
    reference_title: 'Ocular findings of BRPF1 variants: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genetic testing identified a maternally inherited stop-loss variant of the BRPF1 gene.
    explanation: Documents an inherited stop-loss allele, further widening the reported variant spectrum.
  - reference: PMID:37946714
    reference_title: 'Mosaicism in BRPF1-Related Neurodevelopmental Disorder: Report of Two Sisters and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The absence of the BRPF1 variant in parental buccal samples provides evidence of a de novo frameshift pathogenic variant, most likely as a result of parental gonadal mosaicism, which has not been previously reported.
    explanation: Recurrence in two sisters despite negative parental buccal samples suggests gonadal mosaicism; gonadal tissue was not tested and parent-of-origin was unresolved.
  - reference: PMID:32457794
    reference_title: Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The variant detected here was classified as variant with unclear significance according to the most recent ACMG guidelines.
    explanation: The methods explicitly give uncertain significance, despite stronger causal wording in the title and discussion. Structural effects were predicted, not experimentally measured.

diagnosis:
- name: Whole exome sequencing
  description: Exome sequencing can identify heterozygous BRPF1 sequence variants in patients with a suggestive neurodevelopmental phenotype. Testing has been performed in single individuals and trios, with segregation studies where available.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: A heterozygous pathogenic or likely pathogenic BRPF1 variant supports a molecular diagnosis in the appropriate clinical context. A variant of uncertain significance does not establish the diagnosis.
  evidence:
  - reference: PMID:31020800
    reference_title: BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Molecular analysis of the family was pursued using whole exome sequencing (WES) and subsequent Sanger sequencing.
    explanation: Whole exome sequencing with Sanger confirmation is the route to diagnosis.
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 17 patients, genotyping was conducted by exome sequencing (ES) or genome sequencing (GS) (single or trio) using routine techniques.
    explanation: The cohort documents both sequencing approaches; it does not separately report their diagnostic yields.
- name: Whole genome sequencing
  description: Genome sequencing is another documented route to identify BRPF1 variants. The 2025 cohort groups exome and genome sequencing together, without providing a genome-specific yield.
  diagnosis_term:
    preferred_term: Whole Genome Sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  results: A heterozygous pathogenic or likely pathogenic BRPF1 variant supports a molecular diagnosis in the appropriate clinical context. A variant of uncertain significance does not establish the diagnosis.
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 17 patients, genotyping was conducted by exome sequencing (ES) or genome sequencing (GS) (single or trio) using routine techniques.
    explanation: The cohort documents both sequencing approaches; it does not separately report their diagnostic yields.
- name: BRPF1 copy-number analysis
  description: Whole-gene BRPF1 deletions and larger 3p25.3 deletions are documented disease-associated variants. Array comparative genomic hybridization detected deletions in the 2025 cohort, with segregation assessed by qPCR. A molecular workup needs to account for copy-number variation and the detection limits of the chosen assay; the source does not establish that every patient requires a separate microarray in addition to copy-number-sensitive sequencing.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: A heterozygous whole-gene BRPF1 deletion, or a contiguous 3p25.3 deletion encompassing BRPF1 with or without SETD5, supports a molecular diagnosis. Deletions spanning SETD5 and other genes require interpretation as contiguous-gene disorders. Greater severity was observed in the small founding comparison, but it is not a deterministic individual prediction.
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two variants were detected by array CGH, with segregation analysis performed by qPCR in 4 related patients.
    explanation: In the largest cohort, array CGH - not sequencing - was the modality that found two of the pathogenic alleles, with qPCR used for family segregation.
  - reference: PMID:27939639
    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified BRPF1 deletions or point mutations in six additional individuals with a similar phenotype.
    explanation: The founding series already reported deletions alongside point mutations, establishing copy-number loss as part of the diagnostic yield.
  - reference: PMID:37190896
    reference_title: 'Anemia and thrombocytopenia due to a novel BRPF1 variant in a family from Çanakkale with intellectual disability and dysmorphic facies: Case report and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Apart from the variant in BRPF1, no additional genomic changes were detected by WES and chromosomal microarray analysis (CMA).
    explanation: Illustrates the paired sequencing-plus-CMA workup used to exclude additional or alternative copy-number causes.
- name: Comprehensive ophthalmological evaluation
  description: Detailed ophthalmological assessment can characterize ptosis, blepharophimosis, strabismus, amblyopia, refractive errors and coloboma. Optical coherence tomography identified subclinical optic nerve alterations in a two-case report. These sources support comprehensive assessment but do not establish a BRPF1-specific screening interval or routine OCT schedule.
  diagnosis_term:
    preferred_term: Eye Examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  results: Identifies treatable amblyogenic factors (ptosis, strabismus, refractive error) and otherwise occult optic nerve involvement.
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings highlight the diverse clinical manifestations of BRPF1-related disorders and suggest that comprehensive ophthalmological evaluation is essential for the management of these patients.
    explanation: The largest cohort explicitly recommends comprehensive ophthalmological evaluation.
  - reference: PMID:38590032
    reference_title: 'Broadening the ocular phenotypic spectrum of ultra-rare BRPF1 variants: report of two cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Since subclinical optic nerve alterations can go easily undetected, our experience highlights the importance of a more detailed ophthalmologic evaluation in patients with BRPF1 variant.
    explanation: Supports adding OCT-level detail to the ophthalmological workup.

treatments:
- name: Multidisciplinary Supportive and Developmental Care
  description: There is no disease-modifying therapy. Management is symptomatic and developmental, coordinating early intervention, physiotherapy and occupational therapy for hypotonia and motor delay, feeding support in infancy, educational support, and ophthalmological and behavioural care.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:

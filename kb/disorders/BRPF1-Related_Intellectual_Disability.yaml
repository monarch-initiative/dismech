    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that both genes contribute to the phenotypic severity of 3p25 deletion syndrome but that some specific features, such as ptosis and blepharophimosis, are mostly driven by BRPF1 haploinsufficiency.
    explanation: Attributes the discriminating periocular features specifically to BRPF1 dosage loss, separating it from the co-deleted SETD5.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_high: 0.1
  notes: >-
    Orphanet records a validated worldwide point-prevalence class of
    <1 / 1 000 000 for ORPHA:698090, i.e. fewer than 0.1 cases per 100,000.
    Only the upper bound is recorded (rate_high) because the source gives an
    open-below class, not a point estimate.
  evidence:
  - reference: ORPHA:698090
    reference_title: "Ophthalmological abnormalities-facial dysmorphism-intellectual disability syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | ORPHANET"
    explanation: >-
      Orphanet's epidemiology table gives a worldwide point-prevalence class of
      <1 / 1 000 000, which maps to PrevalenceClassEnum BELOW_1_IN_1000000.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Cumulative published case count rather than a population rate. BRPF1
    variants were present in 40 cases of syndromic intellectual disability as of
    2020; the 2025 cohort added 29 new patients from 20 families on top of its
    literature comparison group, bringing the reported total to roughly 100
    individuals. Orphanet also holds a validated worldwide "Cases/families"
    epidemiology record for ORPHA:698090, but the cached Orphadata release
    carries no count in that row, so no Orphanet case number is quoted here.
  evidence:
  - reference: PMID:32010779
    reference_title: "Deficient histone H3 propionylation by BRPF1-KAT6 complexes in neurodevelopmental disorders and cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BRPF1 variants are present in 40 cases of syndromic intellectual
      disability
    explanation: >-
      Gives a cumulative published case count of 40 as of 2020.
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study expands the clinical and molecular spectrum of IDDDFP by
      analysing 29 new patients from 20 families with confirmed BRPF1 variants.
    explanation: >-
      Adds 29 further published patients from 20 families to the cumulative
      count.

genetic:
- name: BRPF1 Pathogenic Variants
  gene_term:
    preferred_term: BRPF1
    term:
      id: hgnc:14255
      label: BRPF1
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    BRPF1 lies at 3p25.3 (GRCh38 chr3:9731735-9748015, per the ClinGen dosage
    record cited below). Reported pathogenic alleles are heterozygous and
    predominantly loss-of-function - nonsense, frameshift, and whole- or
    partial-gene deletions - with a minority of missense and stop-loss variants
    whose pathogenicity requires variant-specific functional support. Both de
    novo and inherited alleles are common, and one sibship is explained by
    parental gonadal mosaicism. A contiguous 3p25 deletion may remove BRPF1 with
    the neighbouring SETD5; in that setting both genes contribute to severity,
    but ptosis and blepharophimosis track with BRPF1 loss specifically. No
    robust genotype-phenotype correlation by variant position has been
    established. The authoritative dosage-mechanism assertion is ClinGen's:
    haploinsufficiency score 3 (Sufficient Evidence), triplosensitivity score 0
    (No Evidence), curated 2023-08-23 against MONDO:0015022. gnomAD constraint
    (pLI/LOEUF) is deliberately not asserted: no cached, quotable source for the
    exact values was available, and per the project evidence SOP an unsourceable
    number is dropped rather than approximated.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Heterozygous BRPF1 variants segregate in an autosomal dominant pattern with
      variable expressivity; in one multiplex family the variant segregated fully
      with disease across two generations.
    evidence:
    - reference: PMID:32457794
      reference_title: "Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Intellectual developmental disorder with dysmorphic facies and ptosis is
        an autosomal dominant condition characterized by delayed psychomotor
        development, intellectual disability, delayed speech, and dysmorphic
        facial features, mostly ptosis.
      explanation: >-
        States the autosomal dominant mode of inheritance for the entity.
  evidence:
  - reference: CGDS:HGNC_14255
    reference_title: "BRPF1 dosage sensitivity"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BRPF1 | HGNC:14255 | 7862 | 3p25.3 | chr3:9731735-9748015 | 3 - Sufficient Evidence for Haploinsufficiency | 0 - No Evidence for Triplosensitivity | 2023-08-23"
    explanation: >-
      ClinGen's dosage sensitivity curation scores BRPF1 haploinsufficiency at 3
      (Sufficient Evidence) and triplosensitivity at 0 (No Evidence), fixing the
      disease mechanism as loss of one functional copy and locating the gene at
      3p25.3.
  - reference: CGDS:HGNC_14255
    reference_title: "BRPF1 dosage sensitivity"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Numerous loss-of-function mutations have been reported in intellectual
      developmental disorder with dysmorphic facies and ptosis (IDDDFP)
      patients, and functional analyses support a haploinsufficiency of the
      BRPF1 gene.
    explanation: >-
      ClinGen's evidence summary states the haploinsufficiency conclusion
      explicitly and grounds it in both variant spectrum and functional assays.
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicate that aberrations in the chromatin regulator gene BRPF1
      cause histone H3 acetylation deficiency and a previously unrecognized
      intellectual disability syndrome.
    explanation: >-
      Establishes BRPF1 as the causative gene for a distinct intellectual
      disability syndrome.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen of the 17 unique variants were truncating variants leading to
      haploinsufficiency, including frameshift variants
    explanation: >-
      Quantifies the truncating predominance (13/17 unique alleles) that
      underpins the haploinsufficiency mechanism.
  - reference: PMID:32457794
    reference_title: "Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bioinformatics of WES data and candidate gene prioritization identified a
      novel variant in heterozygous state in the exon 3 of BRPF1 gene (ENST383829:
      c.1054G > C and p.Val352Leu).
    explanation: >-
      Documents a heterozygous missense allele, showing the spectrum extends
      beyond truncating variants.
  - reference: PMID:40752867
    reference_title: "Ocular findings of BRPF1 variants: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing identified a maternally inherited stop-loss variant of the
      BRPF1 gene.
    explanation: >-
      Documents an inherited stop-loss allele, further widening the reported
      variant spectrum.
  - reference: PMID:37946714
    reference_title: "Mosaicism in BRPF1-Related Neurodevelopmental Disorder: Report of Two Sisters and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of the BRPF1 variant in parental buccal samples provides
      evidence of a de novo frameshift pathogenic variant, most likely as a result
      of parental gonadal mosaicism, which has not been previously reported.
    explanation: >-
      Establishes parental gonadal mosaicism as a recurrence-risk mechanism
      relevant to counselling.

diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis is molecular. The facial gestalt is suggestive but not
    pathognomonic and the ID is often mild, so the disorder is typically
    identified by trio exome or genome sequencing rather than targeted testing.
    Chromosomal microarray identifies the 3p25 deletion subset.
  diagnosis_term:
    preferred_term: trio exome or genome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    A heterozygous pathogenic or likely pathogenic BRPF1 variant, or a 3p25
    deletion encompassing BRPF1, establishes the diagnosis.
  evidence:
  - reference: PMID:31020800
    reference_title: "BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis of the family was pursued using whole exome sequencing
      (WES) and subsequent Sanger sequencing.
    explanation: >-
      Whole exome sequencing with Sanger confirmation is the route to diagnosis.
  - reference: PMID:32457794
    reference_title: "Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, whole exome sequencing (WES) was performed as a molecular
      diagnostic test.
    explanation: >-
      Confirms exome sequencing as the diagnostic modality in an independent
      family.

- name: Chromosomal microarray or exome-based copy-number analysis
  description: >-
    Sequence-level analysis alone misses a real fraction of cases. Whole-gene
    BRPF1 deletions and contiguous 3p25.3 deletions spanning BRPF1 and the
    neighbouring SETD5 are an established route to the phenotype: two of the 17
    unique alleles in the largest cohort were complete gene deletions, detected
    by array CGH rather than by sequencing, and the founding series identified
    BRPF1 deletions alongside point mutations. Copy-number analysis is therefore
    required in parallel with sequencing - either as read-depth CNV calling on
    the exome or genome data, or as a chromosomal microarray when the sequencing
    pipeline does not call CNVs. Segregation of a detected deletion can be
    confirmed by qPCR.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: >-
    A heterozygous whole-gene BRPF1 deletion, or a contiguous 3p25.3 deletion
    encompassing BRPF1 with or without SETD5, establishes the diagnosis; a
    deletion spanning SETD5 as well predicts a more severe intellectual
    phenotype than BRPF1 loss alone.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two variants were detected by array CGH, with segregation analysis
      performed by qPCR in 4 related patients.
    explanation: >-
      In the largest cohort, array CGH - not sequencing - was the modality that
      found two of the pathogenic alleles, with qPCR used for family
      segregation.
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified BRPF1 deletions or point mutations in six additional
      individuals with a similar phenotype.
    explanation: >-
      The founding series already reported deletions alongside point mutations,
      establishing copy-number loss as part of the diagnostic yield.
  - reference: PMID:37190896
    reference_title: "Anemia and thrombocytopenia due to a novel BRPF1 variant in a family from Çanakkale with intellectual disability and dysmorphic facies: Case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Apart from the variant in BRPF1, no additional genomic changes were
      detected by WES and chromosomal microarray analysis (CMA).
    explanation: >-
      Illustrates the paired sequencing-plus-CMA workup used to exclude
      additional or alternative copy-number causes.

- name: Comprehensive ophthalmological evaluation including OCT
  description: >-
    Detailed ophthalmological assessment is recommended at diagnosis and
    periodically thereafter. Beyond ptosis and blepharophimosis, patients may
    have strabismus, amblyopia, refractive error, coloboma, and subclinical optic
    neuropathy that is detectable only on optical coherence tomography.
  diagnosis_term:
    preferred_term: ophthalmological evaluation including optical coherence tomography
    term:
      id: NCIT:C38060
      label: Eye Examination
  results: >-
    Identifies treatable amblyogenic factors (ptosis, strabismus, refractive
    error) and otherwise occult optic nerve involvement.
  evidence:
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings highlight the diverse clinical manifestations of BRPF1-related
      disorders and suggest that comprehensive ophthalmological evaluation is
      essential for the management of these patients.
    explanation: >-
      The largest cohort explicitly recommends comprehensive ophthalmological
      evaluation.
  - reference: PMID:38590032
    reference_title: "Broadening the ocular phenotypic spectrum of ultra-rare BRPF1 variants: report of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since subclinical optic nerve alterations can go easily undetected, our
      experience highlights the importance of a more detailed ophthalmologic
      evaluation in patients with BRPF1 variant.
    explanation: >-
      Supports adding OCT-level detail to the ophthalmological workup.

treatments:
- name: Multidisciplinary Supportive and Developmental Care
  description: >-
    There is no disease-modifying therapy. Management is symptomatic and
    developmental, coordinating early intervention, physiotherapy and
    occupational therapy for hypotonia and motor delay, feeding support in
    infancy, educational support, and ophthalmological and behavioural care.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings highlight the diverse clinical manifestations of BRPF1-related
      disorders and suggest that comprehensive ophthalmological evaluation is
      essential for the management of these patients.
    explanation: >-
      The cohort frames management as multi-domain surveillance and care rather
      than targeted therapy.
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay

- name: Speech and Language Therapy
  description: >-
    Speech and language therapy is the highest-yield intervention given the near
    universal speech and language disorder. Because childhood apraxia of speech
    is present in a substantial minority, therapy should be selected on the basis
    of a formal differential speech diagnosis rather than a generic "speech
    delay" label - the explicit message of the dedicated speech-pathology study.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have implicated BRPF1-related disorder as causative for speech and
      language disorder, including childhood apraxia of speech.
    explanation: >-
      Establishes the specific speech diagnoses that therapy must target.
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  - preferred_term: Speech apraxia
    term:
      id: HP:0011098
      label: Speech apraxia

- name: Ptosis Repair Surgery
  description: >-
    Surgical correction of ptosis addresses the syndrome's defining sign and,
    more importantly, removes an amblyogenic visual-axis obstruction. Because
    vision impairment is reported in the large majority of patients and
    amblyopia is documented, timing relative to visual development matters.
    Direct outcome data for ptosis surgery specifically in BRPF1 patients have
    not been published; the rationale is the documented ptosis plus amblyopia
    risk rather than a BRPF1-specific surgical series.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: ptosis repair surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants had vision impairment (13/15), fine (8/15) and gross motor
      delay (10/15) which often resolved in later childhood, infant feeding
      impairment (8/15), and infant hypotonia (9/15).
    explanation: >-
      Establishes the high burden of vision impairment that motivates timely
      eyelid surgery; the paper does not itself report surgical outcomes.
  target_phenotypes:
  - preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  - preferred_term: Amblyopia
    term:
      id: HP:0000646
      label: Amblyopia

- name: Physical and Occupational Therapy
  description: >-
    Physiotherapy and occupational therapy target infantile hypotonia, fine and
    gross motor delay, muscular weakness, and feeding and daily-living skills.
    The prognosis for the motor domain is comparatively good, since motor delays
    frequently resolve in later childhood.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fine (8/15) and gross motor delay (10/15) which often resolved in later
      childhood
    explanation: >-
      Documents the motor-domain targets and their favourable natural history.
  target_phenotypes:
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  - preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay

- name: Genetic Counseling
  description: >-
    Counselling must cover the autosomal dominant 50% recurrence risk for an
    affected parent, the wide intrafamilial variability (including mildly
    affected or apparently unaffected carriers, so parental testing and careful
    parental phenotyping are essential), and the possibility of gonadal mosaicism
    producing recurrence after an apparently de novo variant.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:37946714
    reference_title: "Mosaicism in BRPF1-Related Neurodevelopmental Disorder: Report of Two Sisters and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of the BRPF1 variant in parental buccal samples provides
      evidence of a de novo frameshift pathogenic variant, most likely as a result
      of parental gonadal mosaicism, which has not been previously reported.
    explanation: >-
      Gonadal mosaicism materially changes recurrence-risk counselling for a
      seemingly de novo variant.
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial analysis revealed variability in clinical expression."
    explanation: >-
      Intrafamilial variability is a key counselling point.

- name: Experimental Pharmacologic Restoration of H3K23 Acylation
  description: >-
    Preclinical only. Because the molecular lesion is a deficit of H3K23
    acetylation and propionylation, agents that raise histone acylation -
    propionate and butyrate as acyl-CoA precursors, and the histone deacetylase
    inhibitors valproate and vorinostat - were shown to promote H3K23 acylation
    in cell systems, and the authors proposed mutation-based therapy on that
    basis. There is no clinical trial, no in vivo efficacy data, and no evidence
    of benefit in BRPF1 patients; valproate in particular is a known human
    teratogen and neurodevelopmental risk and must not be inferred as a treatment
    for this disorder from these data.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: butyrate
      term:
        id: CHEBI:17968
        label: butyrate
    - preferred_term: propionate
      term:
        id: CHEBI:17272
        label: propionate
    - preferred_term: vorinostat
      term:
        id: CHEBI:45716
        label: vorinostat
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Deficient Histone H3K23 Acetylation
    treatment_effect: RESTORES
  - target: Deficient Histone H3K23 Propionylation
    treatment_effect: RESTORES
  evidence:
  - reference: PMID:32010779
    reference_title: "Deficient histone H3 propionylation by BRPF1-KAT6 complexes in neurodevelopmental disorders and cancer."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Valproate, vorinostat, propionate and butyrate promote H3K23 acylation."
    explanation: >-
      Cell-based demonstration that these agents raise H3K23 acylation; no
      patient-level efficacy is claimed.
  - reference: PMID:32010779
    reference_title: "Deficient histone H3 propionylation by BRPF1-KAT6 complexes in neurodevelopmental disorders and cancer."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      suggest mutation-based therapy for medical conditions with deficient
      histone acylation
    explanation: >-
      The therapeutic proposal is explicitly a suggestion arising from in vitro
      data.
  notes: >-
    Listed for mechanistic completeness and to document the rationale, not as a
    recommended intervention. Valproate is contraindicated in pregnancy and
    carries neurodevelopmental risk; nothing in the cited work supports its
    clinical use in BRPF1-related disorder.

- name: Behavioural and ADHD Management
  description: >-
    A behavioural disorder is present in 18/29 (62%) of the largest cohort and
    is a leading source of caregiver burden, yet it is the phenotype least
    served by the otherwise developmental focus of care. Management is
    symptom-directed and follows generic neurodevelopmental practice: behavioural
    assessment and counselling for the attention/hyperactivity, low frustration
    tolerance, anxiety and agitation components, sleep hygiene for the 31% with
    sleep disturbance, and standard ADHD pharmacotherapy where behavioural
    measures are insufficient. No BRPF1-specific behavioural intervention or
    drug-selection evidence exists, so nothing here is disorder-specific beyond
    the indication.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: behavioural counselling and ADHD management
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Behavioural disorder
    term:
      id: HP:0000708
      label: Atypical behavior
  - preferred_term: Attention deficit hyperactivity disorder
    term:
      id: HP:0007018
      label: Attention deficit hyperactivity disorder
  - preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      18 patients (62%) had behavioural disorders, including attention
      deficit/hyperactivity (33%), low frustration tolerance (29%),
      inappropriate laughter (14%), anxiety (21%), agitation (15%) and autistic
      behaviour (15%).
    explanation: >-
      Establishes the indication - a behavioural phenotype in the majority of
      patients, itemized into the targets this intervention addresses. The
      evidence supports the need for behavioural management, not the efficacy of
      any particular regimen in BRPF1 disease.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sleep disturbance was reported by nine patients (31%)."
    explanation: >-
      Quantifies the sleep component of the behavioural burden addressed by this
      intervention.
  notes: >-
    No BRPF1-specific efficacy data exist for any behavioural or
    pharmacological intervention; no clinical trial has been registered for this
    disorder. The entry records the indication and the standard-of-care
    response, not disorder-specific evidence of benefit.

differential_diagnoses:
- name: Arboleda-Tham syndrome (KAT6A)
  description: >-
    The closest mechanistic neighbour: KAT6A is one of the acetyltransferases
    BRPF1 scaffolds, and much of the "BRPF1-KAT6A complex" literature reports
    KAT6A patients rather than BRPF1 patients. Clinically the two are separable.
    Arboleda-Tham syndrome is almost always de novo, features near-universal
    intellectual disability with profound expressive speech delay, microcephaly,
    congenital cardiac septal defects, and gastrointestinal dysmotility.
    BRPF1-related disorder is frequently inherited, intellectual disability is
    milder and sometimes absent, and ptosis with blepharophimosis dominates the
    facial gestalt. The founding BRPF1 paper states the overlap is partial rather
    than identical.
  disease_term:
    preferred_term: KAT6A syndrome
    term:
      id: MONDO:0014558
      label: autosomal dominant intellectual disability-craniofacial anomalies-cardiac defects syndrome
  evidence:
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These clinical features overlap with but are not identical to those
      reported for persons with KAT6A or KAT6B mutations, suggesting that BRPF1
      targets these two acetyltransferases and additional partners in humans.
    explanation: >-
      Explicitly separates the BRPF1 entity from KAT6A/KAT6B disorders despite the
      shared complex.

- name: Say-Barber-Biesecker-Young-Simpson syndrome (KAT6B)
  description: >-
    SBBYS is the other blepharophimosis-plus-intellectual-disability
    chromatinopathy in the same complex and is the most confusable clinical
    neighbour, since it too features blepharophimosis, ptosis and hypotonia.
    Discriminators favouring SBBYS are a mask-like immobile face, long thumbs and
    great toes, patellar hypoplasia or agenesis, dental anomalies, hypothyroidism
    and lacrimal duct anomalies, with generally more severe intellectual
    disability; SBBYS variants are almost always de novo truncating KAT6B alleles.
  disease_term:
    preferred_term: Say-Barber-Biesecker-Young-Simpson syndrome
    term:
      id: MONDO:0011365
      label: blepharophimosis - intellectual disability syndrome, SBBYS type
  evidence:
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These clinical features overlap with but are not identical to those
      reported for persons with KAT6A or KAT6B mutations, suggesting that BRPF1
      targets these two acetyltransferases and additional partners in humans.
    explanation: >-
      The same source separates BRPF1 disease from the KAT6B disorders.

- name: Genitopatellar syndrome (KAT6B)
  description: >-
    The second, allelic KAT6B phenotype. Distinguished by patellar agenesis or
    hypoplasia, flexion contractures, genital anomalies, agenesis of the corpus
    callosum, microcephaly and renal cysts, with severe developmental delay -
    a much more severe and skeletally distinctive presentation than
    BRPF1-related disorder, which lacks the patellar and genital findings.
  disease_term:
    preferred_term: genitopatellar syndrome
    term:
      id: MONDO:0011640
      label: genitopatellar syndrome
  evidence:
  - reference: PMID:36077605
    reference_title: "BRPF1-KAT6A/KAT6B Complex: Molecular Structure, Biological Function and Human Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      BRPF1, KAT6A and KAT6B mutations were identified as the cause of
      neurodevelopmental disorders, leukemia, medulloblastoma and other types of
      cancer, with germline mutations associated with neurodevelopmental
      disorders displaying intellectual disability, and somatic variants
      associated with leukemia, medulloblastoma and other cancers.
    explanation: >-
      Establishes KAT6B as a separate cause of intellectual-disability syndromes
      within the same complex, making its phenotypes differentials rather than
      the same entity.

- name: SETD5 haploinsufficiency intellectual disability
  description: >-
    The critical co-located confounder. SETD5 is immediately adjacent to BRPF1 at
    3p25, and before BRPF1 was characterized most of the 3p25 deletion phenotype
    was attributed to SETD5. Isolated SETD5 haploinsufficiency causes intellectual
    disability with facial dysmorphism but does not preferentially produce ptosis
    and blepharophimosis; those features track with BRPF1 loss.
  disease_term:
    preferred_term: SETD5 haploinsufficiency
    term:
      id: MONDO:0014336
      label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
  evidence:
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletions of the 3p25 region, containing BRPF1 and SETD5, cause a defined
      ID syndrome where most of the clinical features are attributed to SETD5
      deficiency.
    explanation: >-
      States the historical attribution of the 3p25 phenotype to SETD5, the reason
      BRPF1 was recognized late.
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We compared the clinical symptoms of individuals carrying mutations or
      small deletions of BRPF1 alone or SETD5 alone with those of individuals with
      deletions encompassing both BRPF1 and SETD5.
    explanation: >-
      The direct comparison that separates the two adjacent genes' contributions.

- name: 3p25.3 microdeletion syndrome
  description: >-
    A contiguous gene deletion that can encompass both BRPF1 and SETD5. It should
    be considered whenever the phenotype is more severe than expected for an
    isolated BRPF1 variant; chromosomal microarray distinguishes it from a
    single-nucleotide BRPF1 variant.
  disease_term:
    preferred_term: 3p25.3 microdeletion syndrome
    term:
      id: MONDO:0018564
      label: 3p25.3 microdeletion syndrome
  evidence:
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that both genes contribute to the phenotypic severity of 3p25
      deletion syndrome
    explanation: >-
      Establishes the two-gene contiguous-deletion entity as distinct from
      single-gene BRPF1 disease.

- name: Noonan syndrome and other RASopathies
  description: >-
    A documented real-world confusion rather than a theoretical one. Facial
    dysmorphism, short stature and developmental delay can prompt a clinical
    Noonan diagnosis; in a series of clinically diagnosed Noonan patients who
    were RASopathy-panel negative, exome sequencing established BRPF1 among the
    alternative diagnoses. Ptosis is common to both, so the discriminators are
    the RASopathy-typical pulmonary valve stenosis, hypertrophic cardiomyopathy,
    webbed neck and lymphatic anomalies, which BRPF1 does not produce.
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  evidence:
  - reference: PMID:41137536
    reference_title: "Non-RASopathy Genetic Syndromes Identified as the Molecular Cause of Disease in Patients Previously Diagnosed With Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In six cases, alternative genetic diagnoses were established due to
      variants in SETD5, BRPF1, DPH1, ACTB, CREBBP, and GATA4, genes associated
      with syndromes presenting overlapping phenotypes with NS.
    explanation: >-
      Documents BRPF1 being found in patients carrying a clinical Noonan
      diagnosis, making Noonan a real differential.

- name: Blepharophimosis, ptosis, and epicanthus inversus syndrome
  description: >-
    BPES (FOXL2) is the primary non-syndromic-ID differential when ptosis and
    blepharophimosis are the presenting signs. BPES adds epicanthus inversus and,
    in type I, premature ovarian insufficiency, but does not cause intellectual
    disability or the wider neurodevelopmental phenotype - so cognitive and
    speech assessment is the discriminator.
  disease_term:
    preferred_term: blepharophimosis, ptosis, and epicanthus inversus syndrome
    term:
      id: MONDO:0007201
      label: blepharophimosis, ptosis, and epicanthus inversus syndrome
  distinguishing_features:
  - The eyelid malformation is present at birth in every affected individual in BPES, whereas ptosis is present in 20/29 (69%) of BRPF1 patients.
  - Age-related primary ovarian insufficiency in affected females is specific to BPES and has no BRPF1 counterpart.
  - Developmental delay and intellectual disability in BPES occur only with contiguous FOXL2 deletions that take in neighbouring genes, not with intragenic FOXL2 variants; in BRPF1 disease the neurodevelopmental phenotype is intrinsic.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1441/
    reference_title: "Blepharophimosis, Ptosis, and Epicanthus Inversus Syndrome - GeneReviews"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blepharophimosis, ptosis, and epicanthus inversus syndrome (BPES) is
      characterized by this eyelid malformation present at birth in all
      individuals and age-related primary ovarian insufficiency (POI) in
      affected females
    explanation: >-
      Gives the two BPES-defining features that separate it from BRPF1 disease -
      obligate congenital eyelid malformation and female primary ovarian
      insufficiency, neither of which characterizes IDDDFP.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1441/
    reference_title: "Blepharophimosis, Ptosis, and Epicanthus Inversus Syndrome - GeneReviews"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      intellectual disability, microcephaly, speech delay, ventricular septum
      defect, cleft palate, and subtle skeletal features
    explanation: >-
      In BPES these BRPF1-like features appear only in the contiguous-gene
      deletion setting and are attributed to neighbouring genes, so their
      presence with an intragenic FOXL2 variant argues against BPES and for an
      alternative diagnosis such as BRPF1-related disorder.

discussions:
- discussion_id: brpf1_zygosity_and_species_model_mismatch
  prompt: >-
    Do the mouse Brpf1 models, which are homozygous or conditional nulls with
    lethal phenotypes, validly model human heterozygous BRPF1 haploinsufficiency,
    in which life expectancy appears normal and some carriers have normal IQ?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Cortical Neurogenesis and Callosal Development
  - pathophysiology#Impaired Hematopoietic Stem and Progenitor Cell Maintenance
  - pathophysiology#Impaired Learning and Memory
  rationale: >-
    Most of the mechanistic BRPF1 literature uses complete loss of function:
    constitutive knockout is lethal around embryonic day 9.5, forebrain-specific
    inactivation causes early postnatal lethality with partial callosal agenesis,
    and blood-specific deletion causes fatal bone marrow failure. Human disease is
    heterozygous, non-lethal, and often mild - one reported carrier has normal
    intellectual development. Only the Brpf1 heterozygous mouse
    (PMID:31213987) matches human zygosity, and it is the model that yields the
    subtlest phenotype. Treating null-allele findings as the human mechanism risks
    systematically overstating severity, particularly for the callosal and
    hematopoietic arms where human evidence is a minority finding and a single
    family respectively.
  proposed_experiments:
  - experiment_id: exp_brpf1_human_allelic_series_organoid
    name: BRPF1 zygosity-matched allelic series in human iPSC-derived cortical neurons and organoids
    description: >-
      In an isogenic human iPSC background, build a BRPF1 allelic series
      (heterozygous null, heterozygous patient truncating and missense alleles,
      homozygous null) and differentiate to cortical neurons and forebrain
      organoids. Read out H3K23 acetylation and propionylation, chromatin
      accessibility, intermediate-progenitor (TBR2) abundance, dendritic
      arborization, and excitatory and inhibitory synaptic physiology. This
      directly tests whether the heterozygous human state reproduces the
      null-allele mouse phenotypes and, if so, at what magnitude.
    experiment_type:
      preferred_term: isogenic allelic-series loss-of-function experiment
  - experiment_id: exp_brpf1_episignature
    name: Test for a BRPF1 DNA methylation episignature in patient blood
    description: >-
      Episignatures are established for KAT6A and for the KAT6B disorders but not
      for BRPF1. Profile genome-wide DNA methylation in blood from a
      variant-confirmed BRPF1 cohort against matched controls and against KAT6A
      and KAT6B cases. A positive result would give the first human-tissue
      molecular readout of heterozygous BRPF1 dosage, would resolve BRPF1
      variants of uncertain significance, and would show whether the three
      complex members converge on one signature or separate.
    experiment_type:
      preferred_term: DNA methylation episignature study
  evidence:
  - reference: PMID:25568313
    reference_title: "Deficiency of the chromatin regulator BRPF1 causes abnormal brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that forebrain-specific inactivation of the mouse Brpf1
      gene caused early postnatal lethality, neocortical abnormalities, and
      partial callosal agenesis.
    explanation: >-
      The forebrain model is a conditional null with a lethal phenotype that has
      no human counterpart.
  - reference: PMID:24646517
    reference_title: "Expression atlas of the multivalent epigenetic regulator Brpf1 and its requirement for survival of mouse embryos."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In support of this, inactivation of the mouse Brpf1 gene causes lethality
      around embryonic day 9.5.
    explanation: >-
      Complete Brpf1 loss is embryonic-lethal in mouse, unlike human heterozygous
      disease.
  - reference: PMID:35243762
    reference_title: "BRPF1-associated syndrome: A patient with congenital ptosis, neurological findings, and normal intellectual development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a patient with normal intellectual development who had
      congenital ptosis, hypotonia, muscular weakness, atlanto-axial malformation,
      and pyramidal at the neurological examination.
    explanation: >-
      The human end of the spectrum includes normal cognition, which no mouse
      model reproduces.

notes: >-
  Named-entity-confusion discipline. BRPF1 is the non-catalytic scaffold of the
  KAT6A/KAT6B/KAT7 acetyltransferase complexes, so a large part of the
  "BRPF1 complex" literature reports patients carrying KAT6A or KAT6B variants,
  not BRPF1 variants. Every clinical citation in this entry was checked to
  confirm the described patients carry BRPF1 variants; KAT6A (Arboleda-Tham
  syndrome, curated separately as kb/disorders/Arboleda-Tham_Syndrome.yaml) and
  KAT6B (SBBYS, genitopatellar syndrome) appear only as differentials.
  PMID:32010779 is a partial exception handled deliberately: it is a
  KAT6A/KAT6B/BRPF1 biochemistry paper, but the clinical claims cited here
  ("12 previously unidentified cases", "Cardiac anomalies are present in a
  subset of the cases") refer explicitly to its BRPF1-variant cases.
  No GeneReviews chapter exists for BRPF1 or IDDDFP. PubMed searches for
  "BRPF1 GeneReviews[All Fields]", "BRPF1[All Fields] AND GeneReviews", and
  "intellectual developmental disorder with dysmorphic facies and ptosis AND
  GeneReviews[All Fields]" returned no BRPF1 chapter (the only hits were the
  unrelated Coffin-Siris, Noonan-with-multiple-lentigines and PPP2R1A
  chapters). The GeneReviews baseline step is therefore not applicable, and the
  phenotype baseline is instead anchored on the two 2017 founding series
  (PMID:27939639, PMID:27939640), the 29-patient 2025 cohort (PMID:39837771),
  and the dedicated speech-phenotyping study (PMID:38346666).
  Prevalence. An earlier version of this entry stated that prevalence was not
  curated because no population-level estimate had been published. That was
  wrong: Orphanet holds a validated worldwide point-prevalence class of
  <1 / 1 000 000 for ORPHA:698090, now curated with the Orphadata row quoted
  directly. Orphanet also holds a validated worldwide "Cases/families"
  epidemiology record, but the row carries no count in the cached Orphadata
  release, so the cumulative case total is instead sourced to the primary
  literature (40 published cases as of PMID:32010779, plus the 29 new patients
  of PMID:39837771).
  Full-text sourcing. The frequency denominators from the largest cohort
  (Colson et al. 2025) live in the article body, not the abstract. The
  PMID:39837771 reference cache is abstract-only because the NCBI PMC route
  returns a restricted record for this Wiley article, so body-text quotes are
  cited against the Europe PMC full-text endpoint
  (url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML),
  following the existing precedent in this repository. Both identifiers point at
  the same paper; the PMID is retained wherever the abstract suffices.
  Known gaps. No genotype-phenotype correlation is asserted because none is
  established. gnomAD constraint values (pLI, LOEUF) are not curated: no cached,
  quotable source for the exact figures was available, so the claim was dropped
  rather than approximated. Frequency bands are given only where a published
  numerator and denominator exist, and are deliberately omitted - with the
  reason recorded in each phenotype's notes - where the published denominators
  straddle two bands (feeding difficulties, short stature) or where no cohort
  tabulates the feature at all (downslanted palpebral fissures, wide nasal
  bridge, muscle weakness, subclinical optic neuropathy, facial nerve palsy,
  Chiari type I malformation). Bands sourced to the 15-participant,
  speech-ascertained cohort (PMID:38346666) are susceptible to ascertainment
  bias toward communication phenotypes and should be read as provisional.
  The Pitx2/Hmx1/Pax6 ocular-transcription-factor node is the authors'
  inference from animal and cell data, not a demonstration in human periocular
  tissue, and is marked HYPOTHETICAL accordingly.
  The entire cellular and synaptic arm of the pathophysiology graph
  (dendritic arborization, excitatory and inhibitory transmission, learning and
  memory) rests on mouse and cultured-neuron data; no human neuronal or iPSC
  evidence exists, and the human phenotype includes carriers with normal IQ,
  which the mouse models do not model. The GABAergic-interneuron node is left
  terminal for this reason: no behavioural testing accompanied that arm.

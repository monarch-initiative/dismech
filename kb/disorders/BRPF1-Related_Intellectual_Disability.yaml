- name: Genetic Counseling
  description: >-
    Counselling must cover the autosomal dominant 50% recurrence risk for an
    affected parent, the wide intrafamilial variability (including mildly
    affected or apparently unaffected carriers, so parental testing and careful
    parental phenotyping are essential), and the possibility of gonadal mosaicism
    producing recurrence after an apparently de novo variant.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:37946714
    reference_title: "Mosaicism in BRPF1-Related Neurodevelopmental Disorder: Report of Two Sisters and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of the BRPF1 variant in parental buccal samples provides
      evidence of a de novo frameshift pathogenic variant, most likely as a result
      of parental gonadal mosaicism, which has not been previously reported.
    explanation: >-
      Gonadal mosaicism materially changes recurrence-risk counselling for a
      seemingly de novo variant.
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial analysis revealed variability in clinical expression."
    explanation: >-
      Intrafamilial variability is a key counselling point.

- name: Experimental Pharmacologic Restoration of H3K23 Acylation
  description: >-
    Preclinical only. Because the molecular lesion is a deficit of H3K23
    acetylation and propionylation, agents that raise histone acylation -
    propionate and butyrate as acyl-CoA precursors, and the histone deacetylase
    inhibitors valproate and vorinostat - were shown to promote H3K23 acylation
    in cell systems, and the authors proposed mutation-based therapy on that
    basis. There is no clinical trial, no in vivo efficacy data, and no evidence
    of benefit in BRPF1 patients; valproate in particular is a known human
    teratogen and neurodevelopmental risk and must not be inferred as a treatment
    for this disorder from these data.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: butyrate
      term:
        id: CHEBI:17968
        label: butyrate
    - preferred_term: propionate
      term:
        id: CHEBI:17272
        label: propionate
    - preferred_term: vorinostat
      term:
        id: CHEBI:45716
        label: vorinostat
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Deficient Histone H3K23 Acetylation
    treatment_effect: RESTORES
  - target: Deficient Histone H3K23 Propionylation
    treatment_effect: RESTORES
  evidence:
  - reference: PMID:32010779
    reference_title: "Deficient histone H3 propionylation by BRPF1-KAT6 complexes in neurodevelopmental disorders and cancer."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Valproate, vorinostat, propionate and butyrate promote H3K23 acylation."
    explanation: >-
      Cell-based demonstration that these agents raise H3K23 acylation; no
      patient-level efficacy is claimed.
  - reference: PMID:32010779
    reference_title: "Deficient histone H3 propionylation by BRPF1-KAT6 complexes in neurodevelopmental disorders and cancer."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      suggest mutation-based therapy for medical conditions with deficient
      histone acylation
    explanation: >-
      The therapeutic proposal is explicitly a suggestion arising from in vitro
      data.
  notes: >-
    Listed for mechanistic completeness and to document the rationale, not as a
    recommended intervention. Valproate is contraindicated in pregnancy and
    carries neurodevelopmental risk; nothing in the cited work supports its
    clinical use in BRPF1-related disorder.

differential_diagnoses:
- name: Arboleda-Tham syndrome (KAT6A)
  description: >-
    The closest mechanistic neighbour: KAT6A is one of the acetyltransferases
    BRPF1 scaffolds, and much of the "BRPF1-KAT6A complex" literature reports
    KAT6A patients rather than BRPF1 patients. Clinically the two are separable.
    Arboleda-Tham syndrome is almost always de novo, features near-universal
    intellectual disability with profound expressive speech delay, microcephaly,
    congenital cardiac septal defects, and gastrointestinal dysmotility.
    BRPF1-related disorder is frequently inherited, intellectual disability is
    milder and sometimes absent, and ptosis with blepharophimosis dominates the
    facial gestalt. The founding BRPF1 paper states the overlap is partial rather
    than identical.
  disease_term:
    preferred_term: KAT6A syndrome
    term:
      id: MONDO:0014558
      label: autosomal dominant intellectual disability-craniofacial anomalies-cardiac defects syndrome
  evidence:
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These clinical features overlap with but are not identical to those
      reported for persons with KAT6A or KAT6B mutations, suggesting that BRPF1
      targets these two acetyltransferases and additional partners in humans.
    explanation: >-
      Explicitly separates the BRPF1 entity from KAT6A/KAT6B disorders despite the
      shared complex.

- name: Say-Barber-Biesecker-Young-Simpson syndrome (KAT6B)
  description: >-
    SBBYS is the other blepharophimosis-plus-intellectual-disability
    chromatinopathy in the same complex and is the most confusable clinical
    neighbour, since it too features blepharophimosis, ptosis and hypotonia.
    Discriminators favouring SBBYS are a mask-like immobile face, long thumbs and
    great toes, patellar hypoplasia or agenesis, dental anomalies, hypothyroidism
    and lacrimal duct anomalies, with generally more severe intellectual
    disability; SBBYS variants are almost always de novo truncating KAT6B alleles.
  disease_term:
    preferred_term: Say-Barber-Biesecker-Young-Simpson syndrome
    term:
      id: MONDO:0011365
      label: blepharophimosis - intellectual disability syndrome, SBBYS type
  evidence:
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These clinical features overlap with but are not identical to those
      reported for persons with KAT6A or KAT6B mutations, suggesting that BRPF1
      targets these two acetyltransferases and additional partners in humans.
    explanation: >-
      The same source separates BRPF1 disease from the KAT6B disorders.

- name: Genitopatellar syndrome (KAT6B)
  description: >-
    The second, allelic KAT6B phenotype. Distinguished by patellar agenesis or
    hypoplasia, flexion contractures, genital anomalies, agenesis of the corpus
    callosum, microcephaly and renal cysts, with severe developmental delay -
    a much more severe and skeletally distinctive presentation than
    BRPF1-related disorder, which lacks the patellar and genital findings.
  disease_term:
    preferred_term: genitopatellar syndrome
    term:
      id: MONDO:0011640
      label: genitopatellar syndrome
  evidence:
  - reference: PMID:36077605
    reference_title: "BRPF1-KAT6A/KAT6B Complex: Molecular Structure, Biological Function and Human Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      BRPF1, KAT6A and KAT6B mutations were identified as the cause of
      neurodevelopmental disorders, leukemia, medulloblastoma and other types of
      cancer, with germline mutations associated with neurodevelopmental
      disorders displaying intellectual disability, and somatic variants
      associated with leukemia, medulloblastoma and other cancers.
    explanation: >-
      Establishes KAT6B as a separate cause of intellectual-disability syndromes
      within the same complex, making its phenotypes differentials rather than
      the same entity.

- name: SETD5 haploinsufficiency intellectual disability
  description: >-
    The critical co-located confounder. SETD5 is immediately adjacent to BRPF1 at
    3p25, and before BRPF1 was characterized most of the 3p25 deletion phenotype
    was attributed to SETD5. Isolated SETD5 haploinsufficiency causes intellectual
    disability with facial dysmorphism but does not preferentially produce ptosis
    and blepharophimosis; those features track with BRPF1 loss.
  disease_term:
    preferred_term: SETD5 haploinsufficiency
    term:
      id: MONDO:0014336
      label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
  evidence:
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletions of the 3p25 region, containing BRPF1 and SETD5, cause a defined
      ID syndrome where most of the clinical features are attributed to SETD5
      deficiency.
    explanation: >-
      States the historical attribution of the 3p25 phenotype to SETD5, the reason
      BRPF1 was recognized late.
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We compared the clinical symptoms of individuals carrying mutations or
      small deletions of BRPF1 alone or SETD5 alone with those of individuals with
      deletions encompassing both BRPF1 and SETD5.
    explanation: >-
      The direct comparison that separates the two adjacent genes' contributions.

- name: 3p25.3 microdeletion syndrome
  description: >-
    A contiguous gene deletion that can encompass both BRPF1 and SETD5. It should
    be considered whenever the phenotype is more severe than expected for an
    isolated BRPF1 variant; chromosomal microarray distinguishes it from a
    single-nucleotide BRPF1 variant.
  disease_term:
    preferred_term: 3p25.3 microdeletion syndrome
    term:
      id: MONDO:0018564
      label: 3p25.3 microdeletion syndrome
  evidence:
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that both genes contribute to the phenotypic severity of 3p25
      deletion syndrome
    explanation: >-
      Establishes the two-gene contiguous-deletion entity as distinct from
      single-gene BRPF1 disease.

- name: Noonan syndrome and other RASopathies
  description: >-
    A documented real-world confusion rather than a theoretical one. Facial
    dysmorphism, short stature and developmental delay can prompt a clinical
    Noonan diagnosis; in a series of clinically diagnosed Noonan patients who
    were RASopathy-panel negative, exome sequencing established BRPF1 among the
    alternative diagnoses. Ptosis is common to both, so the discriminators are
    the RASopathy-typical pulmonary valve stenosis, hypertrophic cardiomyopathy,
    webbed neck and lymphatic anomalies, which BRPF1 does not produce.
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  evidence:
  - reference: PMID:41137536
    reference_title: "Non-RASopathy Genetic Syndromes Identified as the Molecular Cause of Disease in Patients Previously Diagnosed With Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In six cases, alternative genetic diagnoses were established due to
      variants in SETD5, BRPF1, DPH1, ACTB, CREBBP, and GATA4, genes associated
      with syndromes presenting overlapping phenotypes with NS.
    explanation: >-
      Documents BRPF1 being found in patients carrying a clinical Noonan
      diagnosis, making Noonan a real differential.

- name: Blepharophimosis, ptosis, and epicanthus inversus syndrome
  description: >-
    BPES (FOXL2) is the primary non-syndromic-ID differential when ptosis and
    blepharophimosis are the presenting signs. BPES adds epicanthus inversus and,
    in type I, premature ovarian insufficiency, but does not cause intellectual
    disability or the wider neurodevelopmental phenotype - so cognitive and
    speech assessment is the discriminator.
  disease_term:
    preferred_term: blepharophimosis, ptosis, and epicanthus inversus syndrome
    term:
      id: MONDO:0007201
      label: blepharophimosis, ptosis, and epicanthus inversus syndrome

discussions:
- discussion_id: brpf1_zygosity_and_species_model_mismatch
  prompt: >-
    Do the mouse Brpf1 models, which are homozygous or conditional nulls with
    lethal phenotypes, validly model human heterozygous BRPF1 haploinsufficiency,
    in which life expectancy appears normal and some carriers have normal IQ?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Cortical Neurogenesis and Callosal Development
  - pathophysiology#Impaired Hematopoietic Stem and Progenitor Cell Maintenance
  - pathophysiology#Impaired Learning and Memory
  rationale: >-
    Most of the mechanistic BRPF1 literature uses complete loss of function:
    constitutive knockout is lethal around embryonic day 9.5, forebrain-specific
    inactivation causes early postnatal lethality with partial callosal agenesis,
    and blood-specific deletion causes fatal bone marrow failure. Human disease is
    heterozygous, non-lethal, and often mild - one reported carrier has normal
    intellectual development. Only the Brpf1 heterozygous mouse
    (PMID:31213987) matches human zygosity, and it is the model that yields the
    subtlest phenotype. Treating null-allele findings as the human mechanism risks
    systematically overstating severity, particularly for the callosal and
    hematopoietic arms where human evidence is a minority finding and a single
    family respectively.
  proposed_experiments:
  - experiment_id: exp_brpf1_human_allelic_series_organoid
    name: BRPF1 zygosity-matched allelic series in human iPSC-derived cortical neurons and organoids
    description: >-
      In an isogenic human iPSC background, build a BRPF1 allelic series
      (heterozygous null, heterozygous patient truncating and missense alleles,
      homozygous null) and differentiate to cortical neurons and forebrain
      organoids. Read out H3K23 acetylation and propionylation, chromatin
      accessibility, intermediate-progenitor (TBR2) abundance, dendritic
      arborization, and excitatory and inhibitory synaptic physiology. This
      directly tests whether the heterozygous human state reproduces the
      null-allele mouse phenotypes and, if so, at what magnitude.
    experiment_type:
      preferred_term: isogenic allelic-series loss-of-function experiment
  - experiment_id: exp_brpf1_episignature
    name: Test for a BRPF1 DNA methylation episignature in patient blood
    description: >-
      Episignatures are established for KAT6A and for the KAT6B disorders but not
      for BRPF1. Profile genome-wide DNA methylation in blood from a
      variant-confirmed BRPF1 cohort against matched controls and against KAT6A
      and KAT6B cases. A positive result would give the first human-tissue
      molecular readout of heterozygous BRPF1 dosage, would resolve BRPF1
      variants of uncertain significance, and would show whether the three
      complex members converge on one signature or separate.
    experiment_type:
      preferred_term: DNA methylation episignature study
  evidence:
  - reference: PMID:25568313
    reference_title: "Deficiency of the chromatin regulator BRPF1 causes abnormal brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that forebrain-specific inactivation of the mouse Brpf1
      gene caused early postnatal lethality, neocortical abnormalities, and
      partial callosal agenesis.
    explanation: >-
      The forebrain model is a conditional null with a lethal phenotype that has
      no human counterpart.
  - reference: PMID:24646517
    reference_title: "Expression atlas of the multivalent epigenetic regulator Brpf1 and its requirement for survival of mouse embryos."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In support of this, inactivation of the mouse Brpf1 gene causes lethality
      around embryonic day 9.5.
    explanation: >-
      Complete Brpf1 loss is embryonic-lethal in mouse, unlike human heterozygous
      disease.
  - reference: PMID:35243762
    reference_title: "BRPF1-associated syndrome: A patient with congenital ptosis, neurological findings, and normal intellectual development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a patient with normal intellectual development who had
      congenital ptosis, hypotonia, muscular weakness, atlanto-axial malformation,
      and pyramidal at the neurological examination.
    explanation: >-
      The human end of the spectrum includes normal cognition, which no mouse
      model reproduces.

notes: >-
  Named-entity-confusion discipline. BRPF1 is the non-catalytic scaffold of the
  KAT6A/KAT6B/KAT7 acetyltransferase complexes, so a large part of the
  "BRPF1 complex" literature reports patients carrying KAT6A or KAT6B variants,
  not BRPF1 variants. Every clinical citation in this entry was checked to
  confirm the described patients carry BRPF1 variants; KAT6A (Arboleda-Tham
  syndrome, curated separately as kb/disorders/Arboleda-Tham_Syndrome.yaml) and
  KAT6B (SBBYS, genitopatellar syndrome) appear only as differentials.
  PMID:32010779 is a partial exception handled deliberately: it is a
  KAT6A/KAT6B/BRPF1 biochemistry paper, but the clinical claims cited here
  ("12 previously unidentified cases", "Cardiac anomalies are present in a
  subset of the cases") refer explicitly to its BRPF1-variant cases.
  No GeneReviews chapter exists for BRPF1 or IDDDFP. PubMed searches for
  "BRPF1 GeneReviews[All Fields]", "BRPF1[All Fields] AND GeneReviews", and
  "intellectual developmental disorder with dysmorphic facies and ptosis AND
  GeneReviews[All Fields]" returned no BRPF1 chapter (the only hits were the
  unrelated Coffin-Siris, Noonan-with-multiple-lentigines and PPP2R1A
  chapters). The GeneReviews baseline step is therefore not applicable, and the
  phenotype baseline is instead anchored on the two 2017 founding series
  (PMID:27939639, PMID:27939640), the 29-patient 2025 cohort (PMID:39837771),
  and the dedicated speech-phenotyping study (PMID:38346666).
  Known gaps. Prevalence is not curated: no population-level estimate has been
  published, and the disorder is known only from case series totalling roughly
  100 individuals. No genotype-phenotype correlation is asserted because none is
  established. Frequency bands are given only where a published numerator and
  denominator exist; most derive from a single 15-participant,
  speech-ascertained cohort (PMID:38346666) and are therefore susceptible to
  ascertainment bias toward communication phenotypes - they should be read as
  provisional. The entire cellular and synaptic arm of the pathophysiology graph
  (dendritic arborization, excitatory and inhibitory transmission, learning and
  memory) rests on mouse and cultured-neuron data; no human neuronal or iPSC
  evidence exists, and the human phenotype includes carriers with normal IQ,
  which the mouse models do not model. The GABAergic-interneuron node is left
  terminal for this reason: no behavioural testing accompanied that arm.

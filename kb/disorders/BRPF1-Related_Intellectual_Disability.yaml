differential_diagnoses:
- name: Arboleda-Tham syndrome (KAT6A)
  description: KAT6A encodes an acetyltransferase scaffolded by BRPF1, creating mechanistic and phenotypic overlap. Both disorders can include developmental and speech impairment, hypotonia and congenital anomalies. BRPF1 families show wide variation in intellectual function and often prominent ptosis or blepharophimosis. Phenotype can guide testing, but the overlap requires gene-level molecular distinction; KAT6A clinical findings should not be assigned to BRPF1 solely because the proteins share a complex.
  disease_term:
    preferred_term: KAT6A syndrome
    term:
      id: MONDO:0014558
      label: autosomal dominant intellectual disability-craniofacial anomalies-cardiac defects syndrome
  evidence:
  - reference: PMID:27939640
    reference_title: Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These clinical features overlap with but are not identical to those reported for persons with KAT6A or KAT6B mutations, suggesting that BRPF1 targets these two acetyltransferases and additional partners in humans.
    explanation: Explicitly separates the BRPF1 entity from KAT6A/KAT6B disorders despite the shared complex.
- name: Say-Barber-Biesecker-Young-Simpson syndrome (KAT6B)
  description: SBBYS is the other blepharophimosis-plus-intellectual-disability chromatinopathy in the same complex and is the most confusable clinical neighbour, since it too features blepharophimosis, ptosis and hypotonia. Discriminators favouring SBBYS are a mask-like immobile face, long thumbs and great toes, patellar hypoplasia or agenesis, dental anomalies, hypothyroidism and lacrimal duct anomalies, with generally more severe intellectual disability; SBBYS variants are almost always de novo truncating KAT6B alleles.
  disease_term:
    preferred_term: Say-Barber-Biesecker-Young-Simpson syndrome
    term:
      id: MONDO:0011365
      label: blepharophimosis - intellectual disability syndrome, SBBYS type
  evidence:
  - reference: PMID:27939640
    reference_title: Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These clinical features overlap with but are not identical to those reported for persons with KAT6A or KAT6B mutations, suggesting that BRPF1 targets these two acetyltransferases and additional partners in humans.
    explanation: The same source separates BRPF1 disease from the KAT6B disorders.
- name: Genitopatellar syndrome (KAT6B)
  description: An allelic KAT6B disorder with a characteristic combination of patellar agenesis or hypoplasia, contractures, genital abnormalities and other developmental findings. Genital abnormalities alone do not distinguish it from BRPF1-related disorder, because cryptorchidism is documented in BRPF1 cases. The combined phenotype and molecular diagnosis are more informative than an absolute absence claim.
  disease_term:
    preferred_term: genitopatellar syndrome
    term:
      id: MONDO:0011640
      label: genitopatellar syndrome
  evidence:
  - reference: PMID:36077605
    reference_title: 'BRPF1-KAT6A/KAT6B Complex: Molecular Structure, Biological Function and Human Disease.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: BRPF1, KAT6A and KAT6B mutations were identified as the cause of neurodevelopmental disorders, leukemia, medulloblastoma and other types of cancer, with germline mutations associated with neurodevelopmental disorders displaying intellectual disability, and somatic variants associated with leukemia, medulloblastoma and other cancers.
    explanation: Establishes KAT6B as a separate cause of intellectual-disability syndromes within the same complex, making its phenotypes differentials rather than the same entity.
  - reference: PMID:27939639
    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He had surgery for his ptosis and for cryptorchidism.
    explanation: The founding family already included cryptorchidism requiring surgery, contradicting the later claim of novelty.
- name: SETD5 haploinsufficiency intellectual disability
  description: The critical co-located confounder. SETD5 is immediately adjacent to BRPF1 at 3p25, and before BRPF1 was characterized most of the 3p25 deletion phenotype was attributed to SETD5. Isolated SETD5 haploinsufficiency causes intellectual disability with facial dysmorphism but does not preferentially produce ptosis and blepharophimosis; those features track with BRPF1 loss.
  disease_term:
    preferred_term: SETD5 haploinsufficiency
    term:
      id: MONDO:0014336
      label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
  evidence:
  - reference: PMID:27939639
    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Deletions of the 3p25 region, containing BRPF1 and SETD5, cause a defined ID syndrome where most of the clinical features are attributed to SETD5 deficiency.
    explanation: States the historical attribution of the 3p25 phenotype to SETD5, the reason BRPF1 was recognized late.
  - reference: PMID:27939639
    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We compared the clinical symptoms of individuals carrying mutations or small deletions of BRPF1 alone or SETD5 alone with those of individuals with deletions encompassing both BRPF1 and SETD5.
    explanation: The direct comparison that separates the two adjacent genes' contributions.
- name: 3p25.3 microdeletion syndrome
  description: A contiguous gene deletion that can encompass both BRPF1 and SETD5. It should be considered whenever the phenotype is more severe than expected for an isolated BRPF1 variant; chromosomal microarray distinguishes it from a single-nucleotide BRPF1 variant.
  disease_term:
    preferred_term: 3p25.3 microdeletion syndrome
    term:
      id: MONDO:0018564
      label: 3p25.3 microdeletion syndrome
  evidence:
  - reference: PMID:27939639
    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that both genes contribute to the phenotypic severity of 3p25 deletion syndrome
    explanation: Establishes the two-gene contiguous-deletion entity as distinct from single-gene BRPF1 disease.
- name: Noonan syndrome and other RASopathies
  description: Facial dysmorphism, short stature and developmental delay can prompt a clinical Noonan diagnosis. In a series of clinically diagnosed patients with negative RASopathy panels, exome sequencing established BRPF1 among the alternative diagnoses. The overlap supports molecular evaluation; the cited report does not establish absolute absence of individual RASopathy-associated features in BRPF1-related disease.
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  evidence:
  - reference: PMID:41137536
    reference_title: Non-RASopathy Genetic Syndromes Identified as the Molecular Cause of Disease in Patients Previously Diagnosed With Noonan Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In six cases, alternative genetic diagnoses were established due to variants in SETD5, BRPF1, DPH1, ACTB, CREBBP, and GATA4, genes associated with syndromes presenting overlapping phenotypes with NS.
    explanation: Documents BRPF1 being found in patients carrying a clinical Noonan diagnosis, making Noonan a real differential.
- name: Blepharophimosis, ptosis, and epicanthus inversus syndrome
  description: FOXL2-related BPES overlaps the eyelid phenotype of BRPF1-related disorder, including epicanthus inversus. Congenital eyelid malformation and age-related primary ovarian insufficiency characterize BPES, while the broader neurodevelopmental phenotype can favor BRPF1 or a contiguous-gene deletion. Molecular testing distinguishes these causes.
  disease_term:
    preferred_term: blepharophimosis, ptosis, and epicanthus inversus syndrome
    term:
      id: MONDO:0007201
      label: blepharophimosis, ptosis, and epicanthus inversus syndrome
  distinguishing_features:
  - The eyelid malformation is present at birth in every affected individual in BPES, whereas ptosis is present in 20/29 (69%) of BRPF1 patients.
  - Age-related primary ovarian insufficiency in affected females is a defining BPES feature in the cited GeneReviews chapter; the BRPF1 cohorts cited here do not establish a comparable association.
  - Additional neurodevelopmental findings in BPES warrant consideration of a contiguous deletion involving FOXL2 and neighboring genes. The cited chapter describes this context; it does not prove an absolute exclusion for every intragenic variant.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1441/
    reference_title: Blepharophimosis, Ptosis, and Epicanthus Inversus Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Blepharophimosis, ptosis, and epicanthus inversus syndrome (BPES) is characterized by this eyelid malformation present at birth in all individuals and age-related primary ovarian insufficiency (POI) in affected females
    explanation: Gives the two BPES-defining features that separate it from BRPF1 disease - obligate congenital eyelid malformation and female primary ovarian insufficiency, neither of which characterizes IDDDFP.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1441/
    reference_title: Blepharophimosis, Ptosis, and Epicanthus Inversus Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: intellectual disability, microcephaly, speech delay, ventricular septum defect, cleft palate, and subtle skeletal features
    explanation: The GeneReviews chapter describes additional neurodevelopmental and congenital findings with contiguous deletions involving FOXL2 and neighboring genes.

discussions:
- discussion_id: brpf1_zygosity_and_species_model_mismatch
  prompt: How do zygosity, affected cell lineage and deletion timing influence the relevance of mouse and stem-cell BRPF1 models to variable human heterozygous disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Cortical Neurogenesis
  - pathophysiology#Abnormal Corpus Callosum Development
  - pathophysiology#Impaired Hematopoietic Stem and Progenitor Cell Maintenance
  - pathophysiology#Impaired Learning and Memory
  rationale: Complete global, early forebrain and hematopoietic loss can cause lethal mouse phenotypes, whereas postnatal CaMKIIa-Cre conditional mice survive and have selective physiological and behavioral effects. Emx1-lineage conditional heterozygotes match human zygosity only within the targeted lineage, not throughout the organism. Human expressivity varies, including a reported individual with normal intellectual development; these observations do not establish normal life expectancy. Human callosal abnormalities are uncommon. Anemia and thrombocytopenia have been reported in a family and in additional individuals in the 2025 cohort, without demonstrating the severe stem-cell failure mechanism of the homozygous hematopoietic mouse model. Global null embryos also have placental and vascular defects with cranial neural tube failure. Zebrafish pharyngeal homeotic transformations establish a developmental role, but have no demonstrated equivalent in human heterozygous craniofacial dysmorphism.
  proposed_experiments:
  - experiment_id: exp_brpf1_human_allelic_series_organoid
    name: BRPF1 zygosity-matched allelic series in human iPSC-derived cortical neurons and organoids
    description: In an isogenic human iPSC background, build a BRPF1 allelic series (heterozygous null, heterozygous patient truncating and missense alleles, homozygous null) and differentiate to cortical neurons and forebrain organoids. Read out H3K23 acetylation and propionylation, chromatin accessibility, intermediate-progenitor (TBR2) abundance, dendritic arborization, and excitatory and inhibitory synaptic physiology. This directly tests whether the heterozygous human state reproduces the null-allele mouse phenotypes and, if so, at what magnitude.
    experiment_type:
      preferred_term: isogenic allelic-series loss-of-function experiment
  - experiment_id: exp_brpf1_episignature
    name: Test for a BRPF1 DNA methylation episignature in patient blood
    description: Profile genome-wide DNA methylation in blood from variant-confirmed BRPF1 cases, matched controls and KAT6A/KAT6B cases. A reproducible signature could complement existing patient-cell histone-acylation assays and could be evaluated for variant interpretation. Its diagnostic performance, specificity and sensitivity would require validation; a positive cohort-level result alone would not resolve every variant of uncertain significance.
    experiment_type:
      preferred_term: DNA methylation episignature study
  evidence:
  - reference: PMID:25568313
    reference_title: Deficiency of the chromatin regulator BRPF1 causes abnormal brain development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Here, we report that forebrain-specific inactivation of the mouse Brpf1 gene caused early postnatal lethality, neocortical abnormalities, and partial callosal agenesis.
    explanation: The forebrain model is a conditional null with a lethal phenotype that has no human counterpart.
  - reference: PMID:24646517
    reference_title: Expression atlas of the multivalent epigenetic regulator Brpf1 and its requirement for survival of mouse embryos.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In support of this, inactivation of the mouse Brpf1 gene causes lethality around embryonic day 9.5.
    explanation: Complete Brpf1 loss is embryonic-lethal in mouse, unlike human heterozygous disease.
  - reference: PMID:35243762
    reference_title: 'BRPF1-associated syndrome: A patient with congenital ptosis, neurological findings, and normal intellectual development.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we describe a patient with normal intellectual development who had congenital ptosis, hypotonia, muscular weakness, atlanto-axial malformation, and pyramidal at the neurological examination.
    explanation: Documents variable human cognitive expressivity. Mouse behavioral tasks are not equivalent to human intellectual assessment.
  - reference: PMID:25773539
    reference_title: The chromatin regulator Brpf1 regulates embryo development and cell proliferation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the ablation leads to vascular defects in the placenta, yolk sac, and embryo proper, as well as abnormal neural tube closure.
    explanation: Global null mouse embryos have severe developmental defects; these are not established clinical manifestations of heterozygous human BRPF1 disease.
  - reference: PMID:18469222
    reference_title: The multidomain protein Brpf1 binds histones and is required for Hox gene expression and segmental identity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We conclude that Brpf1 is specifically required for the maintenance, but not for the initiation, of anterior Hox gene expression.
    explanation: Zebrafish mutants lose maintenance of anterior Hox expression; initiation and neural crest migration were preserved. This is not a demonstrated human craniofacial pathway.

notes: Clinical expression varies widely, including within families, and a reliable genotype-phenotype correlation is not established. Cohort frequencies depend on ascertainment, assessment and missing data; speech-ascertained samples and imaging-only denominators should not be treated as population penetrance. Larger deletions require interpretation of additional genes, including SETD5. Cellular and animal studies identify plausible pathways but differ in zygosity, cell type and developmental timing from heterozygous human disease. Ocular transcription-factor and neuronal mechanism links remain model-based where direct human evidence is absent.


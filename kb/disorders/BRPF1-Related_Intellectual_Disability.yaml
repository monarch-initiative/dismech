- name: Deficient Histone H3K23 Propionylation
  description: 'BRPF1-KAT6 complexes propionylate H3K23. Several patient variants impair this activity, and the mark is reduced in Pro370Ser lymphoblastoid cells and Arg455Ter lymphoblastoid cells and fibroblasts. Complete Brpf1 deletion abolishes detectable H3K23 propionylation in mouse embryos and cultured fibroblasts. Effects are allele- and assay-dependent: Pro76Leu retained stimulation in the biochemical assay, and some truncating products also retained activity. The independent contribution of propionylation loss to the human phenotype is unresolved.'

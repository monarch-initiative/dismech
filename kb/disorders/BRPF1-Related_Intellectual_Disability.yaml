- name: Deregulated Ocular and Periocular Developmental Transcription Factor Programs
  description: >-
    The ocular and periocular arm of the phenotype - ptosis, blepharophimosis
    and strabismus, the features that discriminate BRPF1 from co-deleted SETD5 -
    has until now had no mechanistic route in this graph. The proposed route is
    that BRPF1 loss deregulates transcription of the ocular developmental
    transcription factors Pitx2, Hmx1 and Pax6, each independently implicated in
    ocular developmental malformation, and that the resulting disruption of
    periocular morphogenesis produces the eyelid and ocular-alignment
    phenotypes. This is an inference drawn by the authors of the largest cohort
    from the animal and cell-based BRPF1 literature, not a demonstration in
    human periocular tissue: no BRPF1 model reproduces ptosis or
    blepharophimosis, so the node is marked HYPOTHETICAL and is the subject of
    an open HUMAN_MODEL_MISMATCH discussion.

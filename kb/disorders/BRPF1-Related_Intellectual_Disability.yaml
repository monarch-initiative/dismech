mechanistic_hypotheses:
- hypothesis_group_id: h3k23_acetylation_loss
  hypothesis_label: H3K23 Acetylation Deficiency Branch
  status: CANONICAL
  description: >-
    The canonical molecular lesion is loss of BRPF1-dependent acetylation of
    histone H3 at lysine 23. Patient-derived BRPF1 variants impair H3K23
    acetylation in functional assays, and the same deficiency is reproduced in
    Brpf1-knockout mice, making this the best-supported route from gene to
    chromatin defect.
  evidence:
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional assays showed that the resulting BRPF1 variants are pathogenic
      and impair acetylation of histone H3 at lysine 23, an abundant but poorly
      characterized epigenetic mark.
    explanation: >-
      Directly establishes impaired H3K23 acetylation as the molecular
      consequence of patient BRPF1 variants.
- hypothesis_group_id: h3k23_propionylation_loss
  hypothesis_label: H3K23 Propionylation Deficiency Branch
  status: EMERGING
  description: >-
    A later-recognized, non-redundant arm: the same BRPF1-KAT6 complexes also
    catalyze H3K23 propionylation, and patient BRPF1 variants impair this
    acylation as well. Whether the propionylation deficit contributes to the
    clinical phenotype independently of the acetylation deficit is not
    established; the two marks are currently inseparable in patient material.
    This branch nonetheless motivates the pharmacologic acylation-restoration
    strategy (propionate, butyrate, valproate, vorinostat) that has so far been
    demonstrated only in cell systems.
  evidence:
  - reference: PMID:32010779
    reference_title: "Deficient histone H3 propionylation by BRPF1-KAT6 complexes in neurodevelopmental disorders and cancer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, we identify BRPF1 variants in 12 previously unidentified cases
      of syndromic intellectual disability and demonstrate that these cases and
      known BRPF1 variants impair H3K23 propionylation.
    explanation: >-
      Establishes propionylation loss as a distinct, patient-variant-associated
      acylation defect.

pathophysiology:
- name: Heterozygous BRPF1 Loss-of-Function Variation
  description: >-
    The initiating lesion is a heterozygous BRPF1 variant, either de novo or
    inherited. Reported alleles are predominantly protein-truncating (nonsense,
    frameshift) or whole-gene/partial deletions, with a smaller number of
    missense and stop-loss alleles; a single 3p25 contiguous deletion can remove
    BRPF1 together with SETD5.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: BRPF1
    term:
      id: hgnc:14255
      label: BRPF1
  evidence:
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed exome sequencing in a large family affected by an
      autosomal-dominant form of mild syndromic ID with ptosis, growth
      retardation, and hypotonia, and we identified an inherited 2 bp deletion
      causing a frameshift in BRPF1 (c.1052_1053del) in five affected family
      members.
    explanation: >-
      The founding family establishes a heterozygous frameshift BRPF1 allele
      segregating with the phenotype.
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified BRPF1 deletions or point mutations in six additional
      individuals with a similar phenotype.
    explanation: >-
      Documents the allelic spectrum as both deletions and point mutations.
  downstream:
  - target: BRPF1 Haploinsufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37946714
      reference_title: "Mosaicism in BRPF1-Related Neurodevelopmental Disorder: Report of Two Sisters and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The frameshift pathogenic variant reported here lends further support to
        haploinsufficiency as the underlying mechanism of disease.
      explanation: >-
        Truncating alleles are interpreted as producing haploinsufficiency
        rather than a dominant-negative product.

- name: BRPF1 Haploinsufficiency
  description: >-
    Loss of one functional BRPF1 allele halves the dose of the chromatin-reader
    scaffold. Haploinsufficiency, rather than a gain-of-function or
    dominant-negative product, is the accepted mechanism; the phenotypic
    contribution of BRPF1 dosage was isolated by comparing individuals with
    BRPF1-only lesions, SETD5-only lesions, and 3p25 deletions spanning both
    genes.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that both genes contribute to the phenotypic severity of 3p25
      deletion syndrome but that some specific features, such as ptosis and
      blepharophimosis, are mostly driven by BRPF1 haploinsufficiency.
    explanation: >-
      Attributes the discriminating periocular features specifically to BRPF1
      dosage loss, separating it from the co-deleted SETD5.
  downstream:
  - target: Impaired BRPF1-KAT6 Acetyltransferase Complex Function
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27939640
      reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Bromodomain and PHD finger-containing protein 1 (BRPF1) is a multivalent
        chromatin regulator possessing three histone-binding domains, one
        non-specific DNA-binding module, and several motifs for interacting with
        and activating three lysine acetyltransferases.
      explanation: >-
        BRPF1's function is to interact with and activate the acetyltransferases,
        so reduced BRPF1 dose directly reduces complex activation.
  - target: Ptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

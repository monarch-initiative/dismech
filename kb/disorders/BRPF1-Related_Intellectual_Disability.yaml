- name: Impaired Learning and Memory
  description: Behavioral effects vary across mouse preparations and tasks. Embryonic Emx1-lineage heterozygotes show water-maze learning and memory deficits and reduced contextual and cued freezing. Postnatal CaMKIIa-Cre conditional homozygotes show impaired spatial reference and contextual fear memory, with acquisition, cued fear memory and object recognition preserved at two months. Regional shRNA knockdown yielded only a behavioral tendency. These tests are not equivalent to human intellectual disability, which has variable expressivity.

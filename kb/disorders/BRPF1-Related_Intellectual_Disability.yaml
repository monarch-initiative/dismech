- category: Neurologic
  name: Microcephaly
  description: >-
    Microcephaly is part of the wider 3p25 deletion phenotype and was
    significantly enriched in individuals with BRPF1 disruption relative to
    SETD5-only deletions, but it is uncommon in BRPF1 point-variant cohorts.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  frequency: OCCASIONAL
  notes: >-
    Frequency derivation: two of 29 patients in Colson et al. 2025 had
    congenital microcephaly and none acquired it. 2/29 = 7%, which falls in the
    OCCASIONAL band (5-29%). Earlier reports give higher rates, which is
    consistent with the historical over-representation of contiguous 3p25
    deletions.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the exception of two patients with congenital microcephaly,
      microcephaly was not observed in the cohort.
    explanation: >-
      2/29 = 7%, which falls in the OCCASIONAL band (5-29%).
  - reference: PMID:31020800
    reference_title: "BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their data demonstrated that microcephaly and ptosis (either unilateral or
      bilateral) and/or blepharophimosis were significantly more common in those
      with BRPF1 disruptions
    explanation: >-
      Attributes microcephaly within the 3p25 deletion region specifically to
      BRPF1 dosage rather than to SETD5.

- category: Neurologic

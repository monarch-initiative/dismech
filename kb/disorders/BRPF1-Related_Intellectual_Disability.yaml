inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous BRPF1 variants act in a dominant, haploinsufficiency mode.
    Unlike many de-novo-dominant chromatinopathies, a large fraction of reported
    BRPF1 variants are inherited from a mildly affected or apparently unaffected
    parent, and one reported sibship arose through parental gonadal mosaicism.
    Expressivity is wide even within a single family.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe an intellectual disability disorder in ten individuals
      with inherited or de novo monoallelic BRPF1 mutations.
    explanation: >-
      Monoallelic (heterozygous) variants, both inherited and de novo, cause the
      disorder.
  - reference: PMID:37946714
    reference_title: "Mosaicism in BRPF1-Related Neurodevelopmental Disorder: Report of Two Sisters and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both de novo and inherited pathogenic variants have been previously
      reported in association with this disorder.
    explanation: >-
      Confirms the mixed de novo / inherited origin of pathogenic alleles.
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial analysis revealed variability in clinical expression."
    explanation: >-
      The largest cohort documents variable expressivity within families.


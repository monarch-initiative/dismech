- name: Aberrant Cortical Neurogenesis and Callosal Development
  description: >-
    Forebrain-specific Brpf1 inactivation in mouse produces neocortical
    abnormalities and partial callosal agenesis, with a reduced pool of
    Tbr2-positive intermediate neuronal progenitors and aberrant neurogenesis.

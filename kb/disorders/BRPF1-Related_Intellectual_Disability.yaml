  - reference: PMID:36077605
    reference_title: 'BRPF1-KAT6A/KAT6B Complex: Molecular Structure, Biological Function and Human Disease.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: It functions in the form of a tetrameric complex with a monocytic leukemia zinc finger protein (MOZ or KAT6A), MOZ-related factor (MORF or KAT6B) or HAT bound to ORC1 (HBO1 or KAT7) and two small non-catalytic proteins, the inhibitor of growth 5 (ING5) or the paralog ING4 and MYST/Esa1-associated factor 6 (MEAF6).
    explanation: Defines the composition of the complexes that BRPF1 scaffolds.
  - reference: PMID:27939640
    reference_title: Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These clinical features overlap with but are not identical to those reported for persons with KAT6A or KAT6B mutations, suggesting that BRPF1 targets these two acetyltransferases and additional partners in humans.

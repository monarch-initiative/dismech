- category: Gastrointestinal
  name: Feeding Difficulties
  description: >-
    Infant feeding impairment occurs and, with hypotonia and oromotor
    involvement, contributes to early failure to thrive in some individuals.
    No frequency band is assigned, and none of the evidence below is offered in
    support of one: the three published denominators straddle two bands - 3/26
    (12%, OCCASIONAL) in the prospectively phenotyped 2025 cohort, 24/42 (57%,
    FREQUENT) in that paper's literature comparison, and 8/15 (53%, FREQUENT) in
    the speech-ascertained cohort. Per docs/frequency-evidence-guidelines.md,
    omitting the band is preferred to picking between irreconcilable estimates.
  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  notes: >-
    Frequency deliberately omitted. Quotable denominators disagree across bands
    (12% versus 53-57%); the discrepancy most likely reflects ascertainment -
    earlier reports and the speech/feeding-focused cohort both enrich for
    oromotor involvement - but no source reconciles them, so no band is claimed.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Feeding problems were observed in 12% of our series (3/26) compared with
      57% of patients reported in the literature (24/42).
    explanation: >-
      Supports the disease-phenotype association and documents the cross-cohort
      disagreement (12% versus 57%) that is the stated reason no band is
      assigned.
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants had vision impairment (13/15), fine (8/15) and gross motor
      delay (10/15) which often resolved in later childhood, infant feeding
      impairment (8/15), and infant hypotonia (9/15).
    explanation: >-
      Supports the disease-phenotype association; infant feeding impairment in 8
      of 15 (53%) is one of the two irreconcilable estimates and is not used to
      assign a band.

- category: Ophthalmologic
  name: Ptosis
  description: >-
    Ptosis, frequently congenital and sometimes unilateral, is the single most
    discriminating physical sign and gives the disorder its OMIM name. It may be
    the presenting complaint that leads to genetic diagnosis, and it is the
    feature specifically attributed to BRPF1 rather than SETD5 dosage in 3p25
    deletions.
  phenotype_term:
    preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  frequency: FREQUENT
  notes: >-
    Frequency derivation: Colson et al. 2025 report ptosis in 20 of 29 patients.
    20/29 = 69%, which falls in the FREQUENT band (30-79%). This is the
    eponymous feature of IDDDFP and the highest-frequency craniofacial sign in
    the cohort, but it is not obligate.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common features associated with IDDDFP included blepharophimosis (10/29;
      34%), hypertelorism (14/29; 48%), ptosis (20/29; 69%), and a round face
      (17/27; 63%)
    explanation: >-
      Ptosis in 20/29 (69%) falls in the FREQUENT band (30-79%).
  - reference: PMID:37946714
    reference_title: "Mosaicism in BRPF1-Related Neurodevelopmental Disorder: Report of Two Sisters and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bromodomain and PHD finger containing 1 (BRPF1)-related neurodevelopmental
      disorder is characterized by intellectual disability, developmental delay,
      hypotonia, dysmorphic facial features, ptosis, and blepharophimosis.
    explanation: >-
      Ptosis is listed as a defining characteristic of the disorder.
  - reference: PMID:40752867
    reference_title: "Ocular findings of BRPF1 variants: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the case of a 2-year-old girl who presented with drooping of the
      left upper lid since birth and who was ultimately diagnosed with IDDDFP.
    explanation: >-
      Illustrates congenital, unilateral ptosis as the presenting feature leading
      to diagnosis.


- name: Zebrafish brpf1 pharyngeal-patterning mutants
  species: Danio rerio
  genotype: Homozygous brpf1 t20002, b943 or t25114
  publication: PMID:18469222
  description: Three alleles and a splice-blocking morpholino produce anterior transformations of pharyngeal arches 2–6. Anterior Hox expression initiates normally but is not maintained; neural crest migration and more posterior Hox expression are preserved. The PWWP-lacking t25114 allele is not detectably milder than severe truncation alleles. Mouse Brpf1 mRNA partly rescues Hox expression. Trichostatin A rescues Hox expression and alleviates skeletal abnormalities; hoxb1a injection can normalize the arch marker pattern or overcorrect it to a bihyoid pattern.
  modeled_mechanisms:
  - target: Altered Developmental Transcriptional Programs
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    fidelity: UNKNOWN
    limitations: Homozygous zebrafish truncation or splice alleles cause homeotic pharyngeal transformations. Human BRPF1-associated facial dysmorphism has not been shown to be a homeotic transformation, and these rescue experiments do not establish clinical treatment benefit.
    readouts:
    - name: Maintenance of anterior Hox expression in cranial neural crest
      target: Altered Developmental Transcriptional Programs
      direction: DECREASED
      description: hoxa2b and hoxb2a are lost after initially normal expression; posterior Hox genes are relatively preserved.
    evidence:
    - reference: PMID:18469222
      reference_title: The multidomain protein Brpf1 binds histones and is required for Hox gene expression and segmental identity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We conclude that Brpf1 is specifically required for the maintenance, but not for the initiation, of anterior Hox gene expression.
      explanation: Zebrafish mutants lose maintenance of anterior Hox expression; initiation and neural crest migration were preserved. This is not a demonstrated human craniofacial pathway.
  - target: Altered Developmental Transcriptional Programs
    relationship: RESCUES
    model_scale: CELLULAR
    fidelity: UNKNOWN
    limitations: Homozygous zebrafish truncation or splice alleles cause homeotic pharyngeal transformations. Human BRPF1-associated facial dysmorphism has not been shown to be a homeotic transformation, and these rescue experiments do not establish clinical treatment benefit.
    readouts:
    - name: Anterior Hox expression after mouse Brpf1 mRNA injection
      target: Altered Developmental Transcriptional Programs
      direction: INCREASED
      description: Partial significant rescue at 33 hours post-fertilization.
    - name: hoxa2b expression after trichostatin A exposure
      target: Altered Developmental Transcriptional Programs
      direction: RESTORED
      description: The reported 20–33-hour exposure restored the measured neural-crest transcriptional readout.
    evidence:
    - reference: PMID:18469222
      reference_title: The multidomain protein Brpf1 binds histones and is required for Hox gene expression and segmental identity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: zebrafish brpf1 mutants injected with mouse Brpf1 mRNA displayed a partial, but significant rescue of anterior Hox gene expression at 33 hpf
      explanation: Cross-species mRNA rescue supports a conserved developmental function without reproducing the human heterozygous genotype.
    - reference: PMID:18469222
      reference_title: The multidomain protein Brpf1 binds histones and is required for Hox gene expression and segmental identity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Treatment of mutants from 20–33 hpf rescued hoxa2b expression in CNC
      explanation: Trichostatin A restored the measured transcriptional readout in zebrafish; the experiment is preclinical.
  evidence:
  - reference: PMID:18469222
    reference_title: The multidomain protein Brpf1 binds histones and is required for Hox gene expression and segmental identity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We conclude that Brpf1 is specifically required for the maintenance, but not for the initiation, of anterior Hox gene expression.
    explanation: Zebrafish mutants lose maintenance of anterior Hox expression; initiation and neural crest migration were preserved. This is not a demonstrated human craniofacial pathway.
- name: Constitutive Brpf1-null mouse embryo
  species: Mus musculus
  genotype: Brpf1 homozygous inactive delta/delta or -/- alleles
  publication: PMID:25773539
  description: Global inactivation causes lethality around E9.5 with vascular disorganization in embryo, yolk sac and placenta, impaired placental labyrinth branching, and cranial neural tube closure defects. Reduced mitotic staining precedes conspicuous apoptosis, which appears at E10.5; gamma-H2AX staining is not detectably increased at E9.5. These severe complete-loss phenotypes should not be assigned to heterozygous human disease.
  modeled_mechanisms:
  - target: Altered Developmental Transcriptional Programs
    relationship: MEASURES
    model_scale: CELLULAR
    fidelity: UNKNOWN
    limitations: Whole-embryo expression after complete loss differs from heterozygous human neurons. Individual transcript changes were not rescued to establish mediation of vascular or neural tube defects.
    readouts:
    - name: Rpl10l transcript in E8.75 embryos
      target: Altered Developmental Transcriptional Programs
      direction: DECREASED
      description: Validated by RT-qPCR; the change is context-specific.
    - name: Scp3l transcript in E8.75 embryos
      target: Altered Developmental Transcriptional Programs
      direction: INCREASED
      description: Validated by RT-qPCR; pathogenic mediation remains hypothetical.
    evidence:
    - reference: PMID:25773539
      reference_title: The chromatin regulator Brpf1 regulates embryo development and cell proliferation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we confirmed that Rpl10l (ribosomal protein L10-like) mRNA decreased, whereas Scp3l (synaptonemal complex protein 3-like; or Gm773, for predicted gene 773) mRNA increased in Brpf1-null embryos
      explanation: Transcript changes were validated in E8.75 embryos; Rpl10l reduction was not reproduced in later embryonic fibroblasts.
  evidence:
  - reference: PMID:25773539
    reference_title: The chromatin regulator Brpf1 regulates embryo development and cell proliferation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the ablation leads to vascular defects in the placenta, yolk sac, and embryo proper, as well as abnormal neural tube closure.
    explanation: Global null mouse embryos have severe developmental defects; these are not established clinical manifestations of heterozygous human BRPF1 disease.
  - reference: PMID:25773539
    reference_title: The chromatin regulator Brpf1 regulates embryo development and cell proliferation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we confirmed that Rpl10l (ribosomal protein L10-like) mRNA decreased, whereas Scp3l (synaptonemal complex protein 3-like; or Gm773, for predicted gene 773) mRNA increased in Brpf1-null embryos
    explanation: Transcript changes were validated in E8.75 embryos; Rpl10l reduction was not reproduced in later embryonic fibroblasts.


- name: Altered Chromatin Accessibility and Developmental Transcriptional Programs
  description: >-
    Loss of the BRPF1-dependent H3K23 acyl marks closes chromatin at
    BRPF1-occupied loci and shifts developmental gene expression. In
    Brpf1-deficient mouse forebrain neurons the affected transcripts are
    enriched for neural development, synapse function and memory genes. This is
    the hub from which the multisystem phenotype diverges; the individual steps
    from chromatin state to each organ-level endpoint are not resolved in humans.

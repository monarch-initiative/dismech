  description: Brpf1 perturbation reduces mEPSC frequency in several mouse neuronal preparations. Emx1-lineage conditional heterozygotes also have lower mEPSC amplitude in acute CA1 slices, whereas mild shRNA knockdown in hippocampal cultures preserves amplitude and measured arbor morphology. These preparation-specific results do not establish a universal temporal sequence from dendritic change to synaptic dysfunction.

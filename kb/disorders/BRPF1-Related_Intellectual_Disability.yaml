- name: Reduced Inhibitory Neurotransmission in GABAergic Interneurons
  description: Partial Brpf1 knockdown in cultured mouse MGE-derived GABAergic interneurons reduced miniature inhibitory postsynaptic current amplitude without a significant change in frequency. This synaptic readout is distinct from the intrinsic excitability changes measured in the same cultures. Dendritic morphology and transplanted-cell cortical distribution were not significantly altered under the tested conditions. The findings do not establish a human circuit-level excitation/inhibition ratio or a causal route to seizures.

    individually reported case has no denominator.
  evidence:
  - reference: PMID:38590032
    reference_title: "Broadening the ocular phenotypic spectrum of ultra-rare BRPF1 variants: report of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      P1 had a Chiari Malformation type I and a subclinical optic neuropathy,
      which could not be explained by variations in other genes.
    explanation: >-
      Documents Chiari type I malformation in a BRPF1 variant carrier, with
      other genetic causes excluded.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebral malformations are commonly reported in the literature (13/26),
      including periventricular nodular heterotopia, Arnold-Chiari malformation
      and abnormalities of the corpus callosum
    explanation: >-
      Places Arnold-Chiari malformation within the reported spectrum of BRPF1

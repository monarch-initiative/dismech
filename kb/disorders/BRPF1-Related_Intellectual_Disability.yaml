    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed exome sequencing in a large family affected by an autosomal-dominant form of mild syndromic ID with ptosis, growth retardation, and hypotonia, and we identified an inherited 2 bp deletion causing a frameshift in BRPF1 (c.1052_1053del) in five affected family members.
    explanation: The founding family establishes a heterozygous frameshift BRPF1 allele segregating with the phenotype.
  - reference: PMID:27939639
    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified BRPF1 deletions or point mutations in six additional individuals with a similar phenotype.
    explanation: Documents the allelic spectrum as both deletions and point mutations.
  - reference: PMID:31020800
    reference_title: BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To conclude, BRPF1 haploinsufficiency is an underdiagnosed cause of intellectual disability of variable severity, ptosis and/or blepharophimosis and additional nonspecific features, and should be considered in relevant clinical circumstances.
    explanation: Multiplex-family study attributing the phenotype to BRPF1 haploinsufficiency.

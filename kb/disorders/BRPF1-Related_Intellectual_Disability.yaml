    (Robo3, Otx1) and de-represses Hox and other transcription factors, so BRPF1
    acts as both activator and silencer. This node supplies the developmental
    mechanism for the human corpus callosum anomalies, but the mouse model is a
    conditional homozygous null and is far more severe (early postnatal
    lethality) than human heterozygous disease.

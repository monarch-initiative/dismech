    explanation: 52% in the largest cohort, which falls in the FREQUENT band (30-79%).
  - reference: PMID:38346666
    reference_title: 'Beyond ''speech delay'': Expanding the phenotype of BRPF1-related disorder.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Participants had vision impairment (13/15), fine (8/15) and gross motor delay (10/15) which often resolved in later childhood, infant feeding impairment (8/15), and infant hypotonia (9/15).
    explanation: Gross motor delay in 10 of 15 (67%) and fine motor delay in 8 of 15 (53%) both fall in the FREQUENT band.
- category: Gastrointestinal
  name: Feeding Difficulties
  description: 'Infant feeding impairment occurs and, with hypotonia and oromotor involvement, contributes to early failure to thrive in some individuals. No frequency band is assigned, and none of the evidence below is offered in support of one: the three published denominators straddle two bands - 3/26 (12%, OCCASIONAL) in the prospectively phenotyped 2025 cohort, 24/42 (57%, FREQUENT) in that paper''s literature comparison, and 8/15 (53%, FREQUENT) in the speech-ascertained cohort. Per docs/frequency-evidence-guidelines.md, omitting the band is preferred to picking between irreconcilable estimates.'
  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  notes: Frequency deliberately omitted. Quotable denominators disagree across bands (12% versus 53-57%); the discrepancy most likely reflects ascertainment - earlier reports and the speech/feeding-focused cohort both enrich for oromotor involvement - but no source reconciles them, so no band is claimed.
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Feeding problems were observed in 12% of our series (3/26) compared with 57% of patients reported in the literature (24/42).
    explanation: Supports the disease-phenotype association and documents the cross-cohort disagreement (12% versus 57%) that is the stated reason no band is assigned.
  - reference: PMID:38346666
    reference_title: 'Beyond ''speech delay'': Expanding the phenotype of BRPF1-related disorder.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Participants had vision impairment (13/15), fine (8/15) and gross motor delay (10/15) which often resolved in later childhood, infant feeding impairment (8/15), and infant hypotonia (9/15).
    explanation: Supports the disease-phenotype association; infant feeding impairment in 8 of 15 (53%) is one of the two irreconcilable estimates and is not used to assign a band.
- category: Ophthalmologic
  name: Ptosis
  description: Ptosis, frequently congenital and sometimes unilateral, is the single most discriminating physical sign and gives the disorder its OMIM name. It may be the presenting complaint that leads to genetic diagnosis, and it is the feature specifically attributed to BRPF1 rather than SETD5 dosage in 3p25 deletions.
  phenotype_term:
    preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  frequency: FREQUENT
  notes: 'Frequency derivation: Colson et al. 2025 report ptosis in 20 of 29 patients. 20/29 = 69%, which falls in the FREQUENT band (30-79%). This is the eponymous feature of IDDDFP and the highest-frequency craniofacial sign in the cohort, but it is not obligate.'
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'

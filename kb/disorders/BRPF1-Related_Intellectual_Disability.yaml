genetic:
- name: BRPF1 Pathogenic Variants
  gene_term:
    preferred_term: BRPF1
    term:
      id: hgnc:14255
      label: BRPF1
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    BRPF1 lies at 3p26-p25. Reported pathogenic alleles are heterozygous and
    predominantly loss-of-function - nonsense, frameshift, and whole- or
    partial-gene deletions - with a minority of missense and stop-loss variants
    whose pathogenicity requires variant-specific functional support. Both de
    novo and inherited alleles are common, and one sibship is explained by
    parental gonadal mosaicism. A contiguous 3p25 deletion may remove BRPF1 with
    the neighbouring SETD5; in that setting both genes contribute to severity,
    but ptosis and blepharophimosis track with BRPF1 loss specifically. No
    robust genotype-phenotype correlation by variant position has been
    established.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Heterozygous BRPF1 variants segregate in an autosomal dominant pattern with
      variable expressivity; in one multiplex family the variant segregated fully
      with disease across two generations.
    evidence:
    - reference: PMID:32457794
      reference_title: "Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Intellectual developmental disorder with dysmorphic facies and ptosis is
        an autosomal dominant condition characterized by delayed psychomotor
        development, intellectual disability, delayed speech, and dysmorphic
        facial features, mostly ptosis.
      explanation: >-
        States the autosomal dominant mode of inheritance for the entity.
  evidence:
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicate that aberrations in the chromatin regulator gene BRPF1
      cause histone H3 acetylation deficiency and a previously unrecognized
      intellectual disability syndrome.
    explanation: >-
      Establishes BRPF1 as the causative gene for a distinct intellectual
      disability syndrome.
  - reference: PMID:32457794
    reference_title: "Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bioinformatics of WES data and candidate gene prioritization identified a
      novel variant in heterozygous state in the exon 3 of BRPF1 gene (ENST383829:
      c.1054G > C and p.Val352Leu).
    explanation: >-
      Documents a heterozygous missense allele, showing the spectrum extends
      beyond truncating variants.
  - reference: PMID:40752867
    reference_title: "Ocular findings of BRPF1 variants: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing identified a maternally inherited stop-loss variant of the
      BRPF1 gene.
    explanation: >-
      Documents an inherited stop-loss allele, further widening the reported
      variant spectrum.
  - reference: PMID:37946714
    reference_title: "Mosaicism in BRPF1-Related Neurodevelopmental Disorder: Report of Two Sisters and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of the BRPF1 variant in parental buccal samples provides
      evidence of a de novo frameshift pathogenic variant, most likely as a result
      of parental gonadal mosaicism, which has not been previously reported.
    explanation: >-
      Establishes parental gonadal mosaicism as a recurrence-risk mechanism
      relevant to counselling.

diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis is molecular. The facial gestalt is suggestive but not
    pathognomonic and the ID is often mild, so the disorder is typically
    identified by trio exome or genome sequencing rather than targeted testing.
    Chromosomal microarray identifies the 3p25 deletion subset.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    A heterozygous pathogenic or likely pathogenic BRPF1 variant, or a 3p25
    deletion encompassing BRPF1, establishes the diagnosis.
  evidence:
  - reference: PMID:31020800
    reference_title: "BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis of the family was pursued using whole exome sequencing
      (WES) and subsequent Sanger sequencing.
    explanation: >-
      Whole exome sequencing with Sanger confirmation is the route to diagnosis.
  - reference: PMID:32457794
    reference_title: "Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, whole exome sequencing (WES) was performed as a molecular
      diagnostic test.
    explanation: >-
      Confirms exome sequencing as the diagnostic modality in an independent
      family.

- name: Comprehensive ophthalmological evaluation including OCT
  description: >-
    Detailed ophthalmological assessment is recommended at diagnosis and
    periodically thereafter. Beyond ptosis and blepharophimosis, patients may
    have strabismus, amblyopia, refractive error, coloboma, and subclinical optic
    neuropathy that is detectable only on optical coherence tomography.
  diagnosis_term:
    preferred_term: ophthalmological evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Identifies treatable amblyogenic factors (ptosis, strabismus, refractive
    error) and otherwise occult optic nerve involvement.
  evidence:
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings highlight the diverse clinical manifestations of BRPF1-related
      disorders and suggest that comprehensive ophthalmological evaluation is
      essential for the management of these patients.
    explanation: >-
      The largest cohort explicitly recommends comprehensive ophthalmological
      evaluation.
  - reference: PMID:38590032
    reference_title: "Broadening the ocular phenotypic spectrum of ultra-rare BRPF1 variants: report of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since subclinical optic nerve alterations can go easily undetected, our
      experience highlights the importance of a more detailed ophthalmologic
      evaluation in patients with BRPF1 variant.
    explanation: >-
      Supports adding OCT-level detail to the ophthalmological workup.


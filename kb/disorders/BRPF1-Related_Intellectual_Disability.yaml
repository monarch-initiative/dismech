phenotypes:
- category: Neurodevelopmental
  name: Global Developmental Delay
  description: Global developmental delay affecting motor, language and adaptive domains is the presenting feature in most reported individuals, and was the reason for ascertainment in the founding series.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  frequency: FREQUENT
  notes: The two panels of Table 1 in Colson et al. 2025 record global developmental delay as present in 14 patients, absent in nine and unavailable in six. Among the 23 with recorded status, 14/23 is approximately 61%, supporting FREQUENT. This is a derived table count, distinct from the paper's 16/29 intellectual-disability count and its combined ID/DD wording.
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: '| Global developmental delay | N | Y | Y | Y | Y | Y | Y | N | Y | Y | N | Y | Y | N |'
    explanation: Table 1, panel 1, provides individual global developmental delay status. Across both panels there are 14 Y, nine N and six N/A entries; only the 23 patients with known status form the frequency denominator.
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: '| Global developmental delay | Y | N | N | Y | N | N | Y | Y | N/A | N | N/A | N/A | N/A | N/A | N/A |'
    explanation: Table 1, panel 2, provides individual global developmental delay status. Across both panels there are 14 Y, nine N and six N/A entries; only the 23 patients with known status form the frequency denominator.
  - reference: PMID:27939640
    reference_title: Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Symptoms include infantile hypotonia, global developmental delay, intellectual disability, expressive language impairment, and facial dysmorphisms.
    explanation: Lists global developmental delay among the core symptoms of the founding ten-individual series.
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our cohort presented with a wide range of clinical features including developmental delay, intellectual disability (ID) and characteristic dysmorphic facial features such as ptosis, blepharophimosis and a broad nasal bridge.
    explanation: The largest cohort (29 patients) confirms developmental delay as a core feature.
- category: Neurodevelopmental
  name: Intellectual Disability
  description: Intellectual disability is the defining feature of the OMIM entity but is not obligate. Where present it is predominantly mild to moderate, with variability between verbal and visual cognitive profiles. A speech-ascertained cohort found all four individuals formally tested had FSIQ at or above 70, and at least one reported individual with a pathogenic BRPF1 variant has normal intellectual development, so the band below describes a reported cohort frequency, not an obligate feature.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  frequency: FREQUENT
  notes: 'Frequency derivation: Colson et al. 2025 report ID in 16 of 29 patients with available data (55%), of whom six were mild and 10 moderate. 16/29 = 55%, which falls in the FREQUENT band (30-79%). The band is not OBLIGATE: a speech-ascertained cohort found FSIQ >= 70 in all four formally tested participants (PMID:38346666) and at least one carrier has normal intellect (PMID:35243762).'
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Of the 29 patients with available data, 16 (55%) presented with ID of varying severity: six patients had mild ID, while 10 patients had moderate ID.'
    explanation: 16/29 = 55%, which falls in the FREQUENT band (30-79%), and gives the mild/moderate severity split.
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neuropsychological assessment reveals a predominance of mild to moderate ID, with cognitive profiles showing variability in verbal and visual processing.
    explanation: Establishes the mild-to-moderate severity distribution in the largest cohort.
  - reference: PMID:38346666
    reference_title: 'Beyond ''speech delay'': Expanding the phenotype of BRPF1-related disorder.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All those tested for cognitive abilities had a FSIQ ≥70 (4/4).
    explanation: 'Qualifies the claim: in a speech-ascertained cohort, formally tested individuals were not in the intellectual disability range.'
  - reference: PMID:35243762
    reference_title: 'BRPF1-associated syndrome: A patient with congenital ptosis, neurological findings, and normal intellectual development.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we describe a patient with normal intellectual development who had congenital ptosis, hypotonia, muscular weakness, atlanto-axial malformation, and pyramidal at the neurological examination.
    explanation: Documents a BRPF1 variant carrier with normal intellect, showing ID is not obligate.
- category: Neurodevelopmental
  name: Speech and Language Disorder
  description: Speech and language difficulties are prominent but variably recorded. The dedicated speech-language study found mostly mild-to-moderate deficits across receptive, expressive, written and social-pragmatic domains; phonological delay and disorder were common speech diagnoses. Formal assessment of language disorder and a history of delayed speech milestones are related but distinct endpoints.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  notes: 'A single frequency band is not assigned across different endpoints and assessment methods: language disorder was found in 11/12 formally assessed participants in the dedicated study, while delayed speech and language development was reported in 13/28 (46%) in Table 2 of the 2025 cohort. Neither figure establishes universal impairment across all BRPF1 carriers.'
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Delayed speech and language development were noted in 13 patients (46%).
    explanation: 'Table 2 specifies the denominator as 28: 13/28 is 46%. This concerns delayed speech-language milestones and cannot be equated directly with the formal language-disorder assessment in the separate study.'
  - reference: PMID:38346666
    reference_title: 'Beyond ''speech delay'': Expanding the phenotype of BRPF1-related disorder.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Language disorders were common (11/12), and most had mild to moderate deficits across receptive, expressive, written, and social-pragmatic domains.
    explanation: Language disorder occurred in 11/12 assessed participants in this study; the frequency is specific to this assessment and cohort.
  - reference: PMID:38346666
    reference_title: 'Beyond ''speech delay'': Expanding the phenotype of BRPF1-related disorder.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The universal involvement of speech and language impairment ... relative to the high degree of phenotypic variability in BRPF1-related disorder.
    explanation: The speech-ascertained study describes widespread involvement; its wording does not establish universal penetrance in an unselected population.
- category: Neurodevelopmental
  name: Childhood Apraxia of Speech
  description: A motor-planning speech disorder (childhood apraxia of speech) occurs in a substantial minority, alongside phonological delay and phonological disorder. The speech-phenotyping study distinguishes apraxia from other speech diagnoses but does not compare treatment regimens.
  phenotype_term:
    preferred_term: Speech apraxia
    term:
      id: HP:0011098
      label: Speech apraxia
  frequency: FREQUENT
  notes: 'Frequency derivation: childhood apraxia of speech in 3 of 9 formally assessed participants (PMID:38346666). 3/9 = 33%, which falls in the FREQUENT band (30-79%). The denominator is small and speech-ascertained, so the estimate is provisional.'
  evidence:
  - reference: PMID:38346666
    reference_title: 'Beyond ''speech delay'': Expanding the phenotype of BRPF1-related disorder.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Speech disorders were frequent (7/9), including phonological delay (6/9) and disorder (3/9), and childhood apraxia of speech (3/9).
    explanation: Childhood apraxia of speech in 3 of 9 assessed (33%) falls in the FREQUENT band.
- category: Neurologic
  name: Infantile Hypotonia
  description: Hypotonia with infantile onset is a core feature, contributing to early motor delay and to feeding difficulty. The cited cohort documents improvement in motor delay, but does not separately establish the course of hypotonia.
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  frequency: FREQUENT
  notes: 'Frequency derivation: two independent cohorts agree on the band - infant hypotonia in 9/15 (60%) in the speech-phenotyping cohort (PMID:38346666) and hypotonia in 11/29 (approximately 38%; reported as 40%) in Colson et al. 2025. Both fall in the FREQUENT band (30-79%).'
  evidence:
  - reference: PMID:39837771
    reference_title: 'The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hypotonia was observed in 11 patients (40%), including one with neonatal hypotonia.
    explanation: The paper reports 11/29 with hypotonia and rounds this to 40%. The calculated proportion is approximately 38%; both are FREQUENT.
  - reference: PMID:38346666
    reference_title: 'Beyond ''speech delay'': Expanding the phenotype of BRPF1-related disorder.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Participants had vision impairment (13/15), fine (8/15) and gross motor delay (10/15) which often resolved in later childhood, infant feeding impairment (8/15), and infant hypotonia (9/15).
    explanation: Infant hypotonia in 9 of 15 (60%) supports the FREQUENT band.
  - reference: PMID:27939640
    reference_title: Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Symptoms include infantile hypotonia, global developmental delay, intellectual disability, expressive language impairment, and facial dysmorphisms.
    explanation: Independently lists infantile hypotonia as a core symptom.
- category: Neurologic
  name: Motor Delay
  description: Both fine and gross motor delay are common in early childhood and frequently resolve later, an important prognostic point for counselling.
  phenotype_term:
    preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
  frequency: FREQUENT
  notes: 'Frequency derivation: gross motor delay 10/15 (67%) and fine motor delay 8/15 (53%) in the speech-phenotyping cohort (PMID:38346666), and motor delay in 52% of Colson et al. 2025. All three figures fall in the FREQUENT band (30-79%).'
  evidence:

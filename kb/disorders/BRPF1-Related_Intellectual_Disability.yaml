- name: Impaired BRPF1-KAT6 Acetyltransferase Complex Function
  conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency
  description: BRPF1 is the scaffold subunit of tetrameric MYST acetyltransferase complexes built around KAT6A (MOZ) or KAT6B (MORF) plus ING4/ING5 and MEAF6. Association with KAT7 (HBO1) has also been demonstrated in vitro, but its in-vivo relevance is less clear; KAT7 preferentially associates with BRD1 or BRPF3 in vivo. Patient variants can impair partner recruitment and catalytic stimulation, with effects that depend on the allele. For example, p.Val351GlyfsTer8 retains KAT6A binding but fails to recruit ING5 and MEAF6 in transfected cells. BRPF1-, KAT6A- and KAT6B-related disorders overlap clinically, but their differences do not by themselves establish which additional partners or independent activities account for that overlap.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

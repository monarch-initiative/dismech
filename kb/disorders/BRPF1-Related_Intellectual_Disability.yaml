    explanation: Cultured hippocampal neurons showed reduced mEPSC frequency without significant measured arbor changes at the assessed time point.
  - reference: PMID:31213987
    reference_title: Brpf1 Haploinsufficiency Impairs Dendritic Arborization and Spine Formation, Leading to Cognitive Deficits.

      evidence_source: IN_VITRO
      snippet: BRPF1 deletion impairs H3K23ac in hESCs and leads to closed chromatin accessibility on stemness genes and hESC differentiation as well.
      explanation: BRPF1-null H1 embryonic stem cells lose H3K23ac and accessibility at stemness loci. Other lineage-associated regions gain accessibility; this is not uniform genome-wide closure.

name: BRPF1-Related Intellectual Disability
creation_date: "2026-07-31T00:00:00Z"
synonyms:
- Intellectual developmental disorder with dysmorphic facies and ptosis
- IDDDFP
- BRPF1-related disorder
- BRPF1-related neurodevelopmental disorder
- BRPF1-associated intellectual disability, ptosis, and facial dysmorphism
description: >-
  BRPF1-related intellectual disability (intellectual developmental disorder
  with dysmorphic facies and ptosis, IDDDFP; OMIM 617333) is an autosomal
  dominant neurodevelopmental disorder caused by heterozygous loss-of-function
  variants in BRPF1. BRPF1 is not itself an acetyltransferase: it is the
  multivalent chromatin-reader scaffold that assembles and activates the MYST
  lysine acetyltransferases KAT6A (MOZ), KAT6B (MORF), and KAT7 (HBO1) together
  with ING4/ING5 and MEAF6. Its signature catalytic output is acetylation - and,
  as later shown, propionylation - of histone H3 at lysine 23 (H3K23), and
  patient variants impair both acylations. The clinical core is developmental
  delay with a strikingly consistent speech and language disorder, variable
  (usually mild-to-moderate, occasionally absent) intellectual disability,
  infantile hypotonia and feeding difficulty, and a recognizable periocular
  facial gestalt dominated by ptosis and blepharophimosis with downslanted
  palpebral fissures and a broad nasal bridge. Ocular involvement beyond the
  eyelids (strabismus, amblyopia, refractive error, coloboma, subclinical optic
  neuropathy) and corpus callosum anomalies are frequent enough that dedicated
  ophthalmological and neuroimaging assessment is recommended. Expressivity
  within families is wide, extending to carriers with normal intellect.
category: Mendelian

      target: Deficient Histone H3K23 Acetylation
      direction: ABOLISHED
      description: H3K23ac was lost in knockout cells.
    evidence:
    - reference: PMID:36711238
      reference_title: BRPF1 bridges H3K4me3 and H3K23ac in human embryonic stem cells and is essential to pluripotency.

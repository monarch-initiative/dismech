      reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        some specific features, such as ptosis and blepharophimosis, are mostly
        driven by BRPF1 haploinsufficiency
      explanation: >-
        The BRPF1-versus-SETD5 comparison attributes ptosis specifically to BRPF1
        dosage; the developmental steps between chromatin and levator/eyelid
        development are unknown.
  - target: Blepharophimosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27939639
      reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
      supports: SUPPORT

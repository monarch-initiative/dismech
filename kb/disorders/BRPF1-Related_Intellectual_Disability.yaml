variants:
- name: c.1052_1053del (p.Val351GlyfsTer8)
  gene:
    preferred_term: BRPF1
    term:
      id: hgnc:14255
      label: BRPF1
  variant_type: deletion
  description: Founding familial frameshift with partial nonsense-mediated decay. In transfected cells, the truncated protein retains KAT6A interaction but fails to recruit ING5/MEAF6 and fails to stimulate H3K23 acetylation. The decrease in patient-fibroblast H3K23ac was not statistically significant; protein abundance and functional effect should not be generalized across assays.
  evidence:
  - reference: PMID:27939639
    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified an inherited 2 bp deletion causing a frameshift in BRPF1 (c.1052_1053del) in five affected family members.
    explanation: Identifies the segregating familial frameshift.
  - reference: PMID:27939639
    reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Whereas the wild-type was able to bind ING5 and MEAF6, the p.Val351Glyfs∗8 variant failed to do so.
    explanation: Partner-specific impairment was measured in transfected cells; KAT6A binding was retained.
- name: NM_004634:c.556C>T (p.Gln186Ter)
  gene:
    preferred_term: BRPF1
    term:
      id: hgnc:14255
      label: BRPF1
  variant_type: single nucleotide variant
  clinical_significance: PATHOGENIC
  description: Truncating allele reported as pathogenic in a multiplex family, inherited from the mother by three affected sons. Cognitive expressivity varied; the mother initially described herself as unaffected. No direct allele-specific RNA or protein assay was reported in this clinical study.
  evidence:
  - reference: PMID:31020800
    reference_title: BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the previously unreported c.556C>T (p.Q186*) truncating mutation on exon 2 of the BRPF1 gene (NM_004634), in the proband and his mother.
    explanation: Identifies the transcript and familial allele.
  - reference: PMID:31020800
    reference_title: BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the mutation fully segregated with the disease in the family
    explanation: The familial p.Gln186Ter allele segregated with the BRPF1 phenotype. A sibling with Leber hereditary optic neuropathy instead carried an MT-ND1 variant and did not share the BRPF1 phenotype.
- name: c.1054G>C (p.Val352Leu)
  gene:
    preferred_term: BRPF1
    term:
      id: hgnc:14255
      label: BRPF1
  variant_type: single nucleotide variant
  clinical_significance: UNCERTAIN_SIGNIFICANCE
  description: Reported in one child with a BRPF1-like phenotype and absent from tested parental and sibling blood samples. The paper classifies the allele as uncertain significance. Modeling predicts altered PZP-domain packing; no biochemical or cellular experiment establishes destabilization or acetylation loss.
  evidence:
  - reference: PMID:32457794
    reference_title: Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The variant detected here was classified as variant with unclear significance according to the most recent ACMG guidelines.
    explanation: The methods explicitly give uncertain significance, despite stronger causal wording in the title and discussion. Structural effects were predicted, not experimentally measured.
  - reference: PMID:32457794
    reference_title: Novel Missense Variant in Heterozygous State in the BRPF1 Gene Leading to Intellectual Developmental Disorder With Dysmorphic Facies and Ptosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the heterozygous mutation was detected only in the index patient II-3
    explanation: Sanger testing found the allele in the proband but not the tested parents or sisters.

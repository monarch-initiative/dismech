    snippet: >-
      Symptoms include infantile hypotonia, global developmental delay,
      intellectual disability, expressive language impairment, and facial
      dysmorphisms.
    explanation: >-
      Lists global developmental delay among the core symptoms of the founding
      ten-individual series.
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our cohort presented with a wide range of clinical features including
      developmental delay, intellectual disability (ID) and characteristic
      dysmorphic facial features such as ptosis, blepharophimosis and a broad
      nasal bridge.
    explanation: >-
      The largest cohort (29 patients) confirms developmental delay as a core
      feature.

- category: Neurodevelopmental
  name: Intellectual Disability
  description: >-
    Intellectual disability is the defining feature of the OMIM entity but is not
    obligate. Where present it is predominantly mild to moderate, with variability
    between verbal and visual cognitive profiles. A speech-ascertained cohort
    found all four individuals formally tested had FSIQ at or above 70, and at
    least one reported individual with a pathogenic BRPF1 variant has normal
    intellectual development, so the band below is a population frequency, not
    an obligate feature.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
    severity: MILD
  frequency: FREQUENT
  notes: >-
    Frequency derivation: Colson et al. 2025 report ID in 16 of 29 patients with
    available data (55%), of whom six were mild and 10 moderate. 16/29 = 55%,
    which falls in the FREQUENT band (30-79%). The band is not OBLIGATE: a
    speech-ascertained cohort found FSIQ >= 70 in all four formally tested
    participants (PMID:38346666) and at least one carrier has normal intellect
    (PMID:35243762).
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 29 patients with available data, 16 (55%) presented with ID of
      varying severity: six patients had mild ID, while 10 patients had moderate
      ID.
    explanation: >-
      16/29 = 55%, which falls in the FREQUENT band (30-79%), and gives the
      mild/moderate severity split.
  - reference: PMID:39837771
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuropsychological assessment reveals a predominance of mild to moderate
      ID, with cognitive profiles showing variability in verbal and visual
      processing.
    explanation: >-
      Establishes the mild-to-moderate severity distribution in the largest
      cohort.
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All those tested for cognitive abilities had a FSIQ ≥70 (4/4)."
    explanation: >-
      Qualifies the claim: in a speech-ascertained cohort, formally tested
      individuals were not in the intellectual disability range.
  - reference: PMID:35243762
    reference_title: "BRPF1-associated syndrome: A patient with congenital ptosis, neurological findings, and normal intellectual development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a patient with normal intellectual development who had
      congenital ptosis, hypotonia, muscular weakness, atlanto-axial
      malformation, and pyramidal at the neurological examination.
    explanation: >-
      Documents a BRPF1 variant carrier with normal intellect, showing ID is not
      obligate.

- category: Neurodevelopmental
  name: Speech and Language Disorder
  description: >-
    Speech and language impairment is the most consistent feature of the
    disorder, present essentially universally and often disproportionate to
    general cognition. Deficits span receptive, expressive, written and
    social-pragmatic domains and are usually mild to moderate. Phonological delay
    and disorder are the commonest speech diagnoses.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  frequency: VERY_FREQUENT
  notes: >-
    Frequency derivation: the dedicated speech-pathology cohort found language
    disorder in 11/12 assessed (92%), which falls in the VERY_FREQUENT band
    (80-99%), and describes involvement as universal. The band is retained
    against a lower figure in Colson et al. 2025, where "delayed speech and
    language development" was recorded as a reported developmental-milestone
    item in 13/29 (46%, FREQUENT band) rather than by formal speech-language
    assessment; the two numbers measure different things and only the former is
    a direct measurement of the phenotype.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Delayed speech and language development were noted in 13 patients (46%)."
    explanation: >-
      13/29 = 46% (FREQUENT band) in the largest cohort, lower than the 92%
      found on formal speech-language assessment; recorded here as a partial,
      band-lowering counterweight rather than as support for VERY_FREQUENT.
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Language disorders were common (11/12), and most had mild to moderate
      deficits across receptive, expressive, written, and social-pragmatic
      domains.
    explanation: >-
      11 of 12 assessed (92%) had language disorder, supporting the
      VERY_FREQUENT band.
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The universal involvement of speech and language impairment is noteable,
      relative to the high degree of phenotypic variability in BRPF1-related
      disorder.
    explanation: >-
      The dedicated speech-pathology study describes involvement as universal
      against an otherwise variable phenotype.

- category: Neurodevelopmental
  name: Childhood Apraxia of Speech
  description: >-
    A motor-planning speech disorder (childhood apraxia of speech) occurs in a
    substantial minority, alongside phonological delay and phonological disorder.
    Its recognition changes therapy targets, since apraxia requires
    motor-programming-focused intervention rather than generic language therapy.
  phenotype_term:
    preferred_term: Speech apraxia
    term:
      id: HP:0011098
      label: Speech apraxia
  frequency: FREQUENT
  notes: >-
    Frequency derivation: childhood apraxia of speech in 3 of 9 formally
    assessed participants (PMID:38346666). 3/9 = 33%, which falls in the
    FREQUENT band (30-79%). The denominator is small and speech-ascertained, so
    the estimate is provisional.
  evidence:
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Speech disorders were frequent (7/9), including phonological delay (6/9)
      and disorder (3/9), and childhood apraxia of speech (3/9).
    explanation: >-
      Childhood apraxia of speech in 3 of 9 assessed (33%) falls in the FREQUENT
      band.

- category: Neurologic
  name: Infantile Hypotonia
  description: >-
    Hypotonia with infantile onset is a core feature, contributing to early motor
    delay and to feeding difficulty. It is generally non-progressive and improves
    with age.
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  frequency: FREQUENT
  notes: >-
    Frequency derivation: two independent cohorts agree on the band - infant
    hypotonia in 9/15 (60%) in the speech-phenotyping cohort (PMID:38346666) and
    hypotonia in 11/29 (40%) in Colson et al. 2025. Both fall in the FREQUENT
    band (30-79%).
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML
    reference_title: "The Phenotypic and Genotypic Spectrum of BRPF1-Related Disorder: 29 New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypotonia was observed in 11 patients (40%), including one with neonatal
      hypotonia.
    explanation: >-
      11/29 = 40% in the largest cohort, which falls in the FREQUENT band
      (30-79%).
  - reference: PMID:38346666
    reference_title: "Beyond 'speech delay': Expanding the phenotype of BRPF1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants had vision impairment (13/15), fine (8/15) and gross motor
      delay (10/15) which often resolved in later childhood, infant feeding
      impairment (8/15), and infant hypotonia (9/15).
    explanation: >-
      Infant hypotonia in 9 of 15 (60%) supports the FREQUENT band.
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms include infantile hypotonia, global developmental delay,
      intellectual disability, expressive language impairment, and facial
      dysmorphisms.
    explanation: >-
      Independently lists infantile hypotonia as a core symptom.

- category: Neurologic

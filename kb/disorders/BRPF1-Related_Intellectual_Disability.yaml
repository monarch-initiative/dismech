- name: Impaired BRPF1-KAT6 Acetyltransferase Complex Function
  description: >-
    BRPF1 is the scaffold subunit of tetrameric MYST acetyltransferase complexes
    built around KAT6A (MOZ), KAT6B (MORF), or KAT7 (HBO1) plus ING4/ING5 and
    MEAF6. Reduced BRPF1 dose destabilizes assembly and activation of these
    complexes. This node is the mechanistic point at which BRPF1 disease
    converges with, but is not identical to, KAT6A- and KAT6B-related disorders:
    the enzymes have BRPF1-independent activities and BRPF1 has partners beyond
    KAT6A/KAT6B, which is the accepted explanation for the partial rather than
    complete clinical overlap.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: histone acetyltransferase activity
    term:
      id: GO:0004402
      label: histone acetyltransferase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: MOZ/MORF histone acetyltransferase complex
    term:
      id: GO:0070776
      label: MOZ/MORF histone acetyltransferase complex
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24646517
    reference_title: "Expression atlas of the multivalent epigenetic regulator Brpf1 and its requirement for survival of mouse embryos."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Within these complexes, BRPF1 serves as a scaffold for bridging subunit
      interaction, stimulating acetyltransferase activity, governing substrate
      specificity and stimulating gene expression.
    explanation: >-
      Defines the four scaffold functions that are lost when BRPF1 dose falls:
      subunit bridging, enzyme stimulation, substrate targeting, and
      transcriptional activation.
  - reference: PMID:36077605
    reference_title: "BRPF1-KAT6A/KAT6B Complex: Molecular Structure, Biological Function and Human Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It functions in the form of a tetrameric complex with a monocytic leukemia
      zinc finger protein (MOZ or KAT6A), MOZ-related factor (MORF or KAT6B) or
      HAT bound to ORC1 (HBO1 or KAT7) and two small non-catalytic proteins, the
      inhibitor of growth 5 (ING5) or the paralog ING4 and MYST/Esa1-associated
      factor 6 (MEAF6).
    explanation: >-
      Defines the composition of the complexes that BRPF1 scaffolds.
  - reference: PMID:27939640
    reference_title: "Mutations in the Chromatin Regulator Gene BRPF1 Cause Syndromic Intellectual Disability and Deficient Histone Acetylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These clinical features overlap with but are not identical to those
      reported for persons with KAT6A or KAT6B mutations, suggesting that BRPF1
      targets these two acetyltransferases and additional partners in humans.
    explanation: >-
      Explicitly establishes both the shared complex biology and the clinical
      non-identity with KAT6A/KAT6B disorders.
  - reference: PMID:27939639
    reference_title: "Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual Disability with Associated Ptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The protein variant shows an aberrant cellular location, loss of certain
      protein interactions, and decreased histone H3K23 acetylation.
    explanation: >-
      A patient allele mislocalizes and loses protein interactions, i.e. fails to
      scaffold the complex.
  downstream:
  - target: Deficient Histone H3K23 Acetylation
    causal_link_type: DIRECT
    hypothesis_groups:
    - h3k23_acetylation_loss
    evidence:
    - reference: PMID:32010779
      reference_title: "Deficient histone H3 propionylation by BRPF1-KAT6 complexes in neurodevelopmental disorders and cancer."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Lysine acetyltransferase 6A (KAT6A) and its paralog KAT6B form
        stoichiometric complexes with bromodomain- and PHD finger-containing
        protein 1 (BRPF1) for acetylation of histone H3 at lysine 23 (H3K23).
      explanation: >-
        The complex's defining catalytic output is H3K23 acetylation, so impaired
        complex function directly reduces that mark.
  - target: Deficient Histone H3K23 Propionylation
    causal_link_type: DIRECT
    hypothesis_groups:
    - h3k23_propionylation_loss
    evidence:
    - reference: PMID:32010779
      reference_title: "Deficient histone H3 propionylation by BRPF1-KAT6 complexes in neurodevelopmental disorders and cancer."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We report that these complexes also catalyze H3K23 propionylation in
        vitro and in vivo.
      explanation: >-
        The same complexes carry out H3K23 propionylation, so complex impairment
        also reduces this acylation.

- name: Deficient Histone H3K23 Acetylation
  description: >-
    Loss of BRPF1 scaffold activity lowers acetylation of histone H3 lysine 23,
    an abundant chromatin mark that BRPF1 itself also reads. In human embryonic
    stem cells, BRPF1, H3K4me3 and H3K23ac co-occupy open chromatin at stemness
    genes, so the deficit is coupled to a reader-writer circuit rather than being
    a bulk enzymatic loss.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

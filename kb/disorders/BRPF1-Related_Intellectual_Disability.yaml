- name: BRPF1 Haploinsufficiency
  description: Heterozygous loss-of-function variants reduce functional BRPF1 scaffold activity. Haploinsufficiency is supported by clinical genetics and dosage curation, but does not establish an exact halving of protein abundance. The c.1052_1053del transcript undergoes partial nonsense-mediated decay; its residual truncated product has allele-specific defects in stability, localization and partner recruitment in expression assays. Comparison of BRPF1 lesions, SETD5 lesions and deletions spanning both genes implicates BRPF1 dosage particularly in the periocular phenotype.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:

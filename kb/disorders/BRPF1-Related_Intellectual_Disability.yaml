- name: Deficient Histone H3K23 Acetylation
  conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance
  description: 'Loss of BRPF1 scaffold activity can lower acetylation of histone H3 lysine 23; the effect depends on the allele and experimental context. In human embryonic stem cells, BRPF1, H3K4me3 and H3K23ac co-occupy open chromatin at stemness genes, linking BRPF1 occupancy with local histone modification. Co-occupancy does not itself establish direct recognition of H3K23ac by BRPF1. Assay context matters: the founding p.Val351GlyfsTer8 study found failure to stimulate H3K23 acetylation in transfected cells, while its patient-fibroblast decrease was not significant. Global H3, H3K9 and H3K14 acetylation were not detectably changed there. In the hESC knockout study, H3K4me3 persisted and H3K14ac was initially preserved before declining with differentiation; direct H3K4me3 recognition by BRPF1 was not biochemically resolved.'

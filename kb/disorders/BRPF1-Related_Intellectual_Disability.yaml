  description: >-
    Chiari type I (Arnold-Chiari) malformation is one of the cerebral
    malformations reported in the BRPF1 literature and was found in one of two
    patients undergoing deep ocular and neurological phenotyping. It matters
    clinically because it can be symptomatic and surgically actionable.
  phenotype_term:
    preferred_term: Chiari type I malformation

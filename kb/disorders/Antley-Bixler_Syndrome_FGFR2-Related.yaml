    snippet: Infants &#x00026; children requiring tracheotomy may also need ventilator-delivered positive pressure to normalize gas exchange &#x00026; achieve normal sleep &#x00026; growth.
    explanation: General FGFR guidance for bypass and ventilatory support; literal HTML entities retain generated source wording.

- name: FGFR2/Neu chimeric-receptor transformation in NIH 3T3 cells
  experimental_model_type: CELL_LINE
  cell_source: Mouse NIH 3T3 fibroblast line
  description: Focus formation tested FGFR2 extracellular domains fused to the Neu transmembrane and kinase domains. Three to five experiments per construct used activated Neu as a normalization comparator. The transforming output belongs to this artificial reporter, not native FGFR2 kinase or an osteogenic differentiation assay. Removing both IgIII cysteines suppressed transformation by W290G/T341P constructs. No S351C, cranial suture or clinical rescue experiment was reported.
  evidence:
  - reference: PMID:9539778
    reference_title: Activating mutations in the extracellular domain of the fibroblast growth factor receptor 2 function by disruption of the disulfide bond in the third immunoglobulin-like domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Chimeric FGFR2/Neu receptors (Fig.1), containing the FGFR2 extracellular domain fused to the transmembrane and kinase domains of Neu, allow the extent of activation to be assayed through focus formation using the intracellular domain of Neu as a reporter
    explanation: Construct and reporter context.
  - reference: PMID:9539778
    reference_title: Activating mutations in the extracellular domain of the fibroblast growth factor receptor 2 function by disruption of the disulfide bond in the third immunoglobulin-like domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Whereas each of the single mutants W290G and T341P was transforming, as described above, transforming activity was completely lost when these single mutants were combined with the double mutant (C278A, C342A)
    explanation: Genetic perturbation of the reporter response.
  modeled_mechanisms:
  - target: Aberrant FGFR2 Disulfide Dimerization
    relationship: PERTURBS
    fidelity: LOW
    model_scale: CELLULAR
    description: Removing the two IgIII cysteines abolishes the transforming activity of related mutant extracellular domains in an artificial FGFR2/Neu reporter. This perturbation supports cysteine dependence, with dimer formation measured separately in full-length COS-1 receptors.
    limitations: Focus formation is a downstream reporter phenotype rather than a direct dimerization readout. The kinase/transmembrane domains are Neu, p.Ser351Cys was not tested, and no cranial differentiation or clinical rescue was measured.

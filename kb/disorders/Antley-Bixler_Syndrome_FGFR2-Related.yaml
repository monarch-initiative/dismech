    label: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
parents:
- FGFR2-related craniosynostosis
- Craniosynostosis syndrome
classifications:
  isds_skeletal_category:
  - classification_value: craniosynostosis_syndromes
    notes: >-
      ISDS Nosology of genetic skeletal disorders, 2023 revision (PMID:36779427), group
      "Craniosynostosis syndromes". Note the ISDS listing does not by itself settle
      whether the FGFR2 form is separable from the other FGFR craniosynostosis syndromes;
      see gap_abs_fgfr2_distinct_entity_status.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant, reported as a de novo variant. This is itself a point of
    historical interest: Antley-Bixler syndrome had been assumed autosomal recessive on
    the basis of sib recurrence and consanguineous parents, and the first FGFR2 case was
    explicitly reported as an apparent dominant de novo exception. That apparent
    contradiction is now understood as the two-disorder split — the recessive pedigrees
    belong to the POR form.
  evidence:
  - reference: PMID:9605588
    reference_title: "FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inheritance has been suggested to be autosomal recessive based on two families with sib recurrence with both sexes being affected, and two cases born to consanguineous parents. We report the first case of ABS associated with an apparent dominant de novo mutation in the fibroblast growth factor receptor 2 (FGFR2) gene."
    explanation: >-
      Records both the prior recessive assumption and the dominant de novo FGFR2 case
      that first separated the two forms.
prevalence:
- population: Worldwide, published-case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    No population estimate exists, and the case literature is additionally confounded by
    the two-disorder problem: many published "Antley-Bixler syndrome" cases are the POR
    form, so counts drawn from the name rather than the genotype overstate this entry.
    The FGFR2 form is described in single case reports and small series.
  evidence:
  - reference: PMID:20818252
    reference_title: "Spectrum of Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antley-Bixler syndrome (ABS) is an exceptionally rare craniosynostosis syndrome characterized by radiohumeral synostosis present from the perinatal period."
    explanation: Establishes rarity and the defining skeletal feature.
pathophysiology:
- name: FGFR2 IgIII Cysteine-Creating Activation
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation"
  description: >
    A de novo heterozygous FGFR2 p.Ser351Cys substitution in the third immunoglobulin-like
    (IgIII) domain. Introducing an unpaired cysteine into the extracellular domain permits
    intermolecular disulfide bonding between receptor monomers and hence
    ligand-independent constitutive activation — the same activation class as
    Beare-Stevenson p.Tyr375Cys and the extracellular-cysteine alleles of Crouzon syndrome
    and thanatophoric dysplasia type 1. This is what qualifies the disorder for the FGFR
    gain-of-function grouping, and it is the one thing about this entry that is not in
    dispute.
  gene:
    preferred_term: FGFR2
    description: >-
      Fibroblast growth factor receptor 2, constitutively activated by a cysteine-creating
      IgIII-domain substitution.
    modifier: GAIN_OF_FUNCTION
    term:
      id: hgnc:3689
      label: FGFR2
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:9605588
    reference_title: "FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was found to be heterozygous for a C-->G transversion at nucleotide 1064, which predicts a Ser351Cys amino acid substitution in the IgIII domain of FGFR2."
    explanation: The defining allele and its domain position.
  - reference: PMID:20818252
    reference_title: "Spectrum of Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the S351C mutation of the fibroblast growth factor receptor 2 gene has been reported predominantly in those patients with normal genitalia and steroidogenesis"
    explanation: >-
      Ties the FGFR2 allele specifically to the arm of the ABS spectrum without
      steroidogenic involvement, which is the concept this entry curates.
  - reference: PMID:29230096
    reference_title: "Fibroblast Growth Factor Receptor 2 (FGFR2) Mutation Related Syndromic Craniosynostosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The majority of these mutations are missense mutations that result in constitutive activation of the receptor and downstream molecular pathways."
    explanation: >-
      Places Antley-Bixler among the FGFR2 syndromic craniosynostoses whose alleles act
      by constitutive receptor activation.
  downstream:
  - target: Cranial Suture and Joint Osteogenic Dysregulation
    description: >
      Constitutive receptor signalling dysregulates osteogenic differentiation at both
      cranial sutures and developing limb joints.
    causal_link_type: DIRECT

- name: Cranial Suture and Joint Osteogenic Dysregulation
  biological_scale: TISSUE
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Cranial Suture Osteogenic Acceleration"
  description: >
    Accelerated osteogenic differentiation in suture mesenchyme, together with abnormal
    ossification at developing joints. The joint arm is what distinguishes this phenotype
    from the other FGFR2 craniosynostoses: the same receptor lesion that fuses cranial
    sutures also produces bony fusion across the elbow, so synostosis of cranial sutures
    and of the elbow joint were together the original minimal diagnostic criteria for the
    syndrome.
  cell_types:
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:9605588
    reference_title: "FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Antley-Bixler syndrome (ABS) is a rare syndrome with synostosis of cranial sutures and elbow joints as minimal diagnostic criteria."
    explanation: >-
      Establishes that suture and joint synostosis together define the syndrome, which is
      why this node covers both compartments.
  downstream:
  - target: Premature Cranial Suture Fusion
    causal_link_type: DIRECT
  - target: Humeroradial synostosis
  - target: Multiple joint contractures

- name: Premature Cranial Suture Fusion
  biological_scale: TISSUE
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Premature Suture Fusion and Craniosynostosis"
  description: >
    Craniosynostosis with the associated craniofacial consequences — midface hypoplasia,
    depressed nasal bridge, proptosis — and the upper-airway compromise that follows from
    a restricted midface together with choanal stenosis or atresia.
  biological_processes:
  - preferred_term: cranial suture morphogenesis
    term:
      id: GO:0060363
      label: cranial suture morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:20818252
    reference_title: "Spectrum of Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a wide spectrum of anomalies seen within ABS, and other features include midface hypoplasia; choanal stenosis or atresia; multiple joint contractures; visceral anomalies, particularly of the genitourinary system; and impaired steroidogenesis."
    explanation: >-
      The associated feature spectrum. Note the quoted sentence describes ABS as a whole
      and therefore includes impaired steroidogenesis, which belongs to the POR form and
      is deliberately not curated as a phenotype of this entry.
  downstream:
  - target: Craniosynostosis
  - target: Midface retrusion
  - target: Depressed nasal bridge
  - target: Choanal atresia

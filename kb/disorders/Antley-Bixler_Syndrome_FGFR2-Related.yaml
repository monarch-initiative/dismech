diagnosis:
- name: Molecular diagnosis with phenotype and variant interpretation
  description: Use craniofacial and limb examination, imaging and molecular testing to establish the FGFR2-related diagnosis. A craniosynostosis panel can address the overlapping FGFR spectrum and alternatives. Sequence-based testing detected p.Ser351Cys after older SSCP screening was negative in one case; that observation does not estimate present-day panel sensitivity.
  evidence:
  - reference: PMID:9714439
    reference_title: 'Phenotype of the fibroblast growth factor receptor 2 Ser351Cys mutation: Pfeiffer syndrome type III.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In our patient, previously performed single-strand conformation polymorphism analysis failed to detect a band shift; the mutation was identified only after independent sequence analysis.
    explanation: Actual method limitation in one historical case.
  - reference: PMID:34909104
    reference_title: 'Pfeiffer syndrome type 3 with FGR2 c.1052C>G (p.Ser351Cys) variant in West Africa: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: sequence analysis using Illumina technology and deletion/duplication testing of 65 genes for variants associated with craniosynostosis syndromes was performed
    explanation: Case-level panel approach, not universal diagnostic performance.

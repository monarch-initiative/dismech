classifications:
  isds_skeletal_category:
  - classification_value: craniosynostosis_syndromes
    notes: The 2023 skeletal nosology calls the group Syndromes featuring craniosynostosis. This classification does not resolve overlap between FGFR2-related Antley–Bixler and Pfeiffer/Crouzon phenotypes.
description: FGFR2-related Antley–Bixler syndrome is a rare presentation of FGFR2 craniosynostosis with elbow synostosis or contractures, midface hypoplasia and potentially severe airway and ocular complications. The recurrent p.Ser351Cys allele is also reported in patients labelled Pfeiffer or Crouzon syndrome; elbow fusion does not distinguish these labels. Other extracellular FGFR2 variants have been reported in patients initially diagnosed with Antley–Bixler syndrome. This entry retains the FGFR2-related disease concept while distinguishing it from recessive POR deficiency, which can produce overlapping skeletal abnormalities with disordered steroidogenesis. Normal external genitalia alone do not exclude POR deficiency. Phenotypes below emphasize molecularly confirmed FGFR2 cases, including the same-allele literature under alternative syndrome names; selected, overlapping case reports do not support population frequency estimates.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Heterozygous FGFR2 variants can occur de novo. The index p.Ser351Cys case was reported as an apparent de novo occurrence. General FGFR craniosynostosis counseling gives a 50% transmission risk for each child of a heterozygous affected individual; severity cannot be predicted reliably from transmission alone. Negative parental blood testing does not eliminate possible germline mosaicism. Historical recessive Antley–Bixler pedigrees should be reassessed for POR deficiency rather than presumed to establish recessive FGFR2 disease.
  evidence:
  - reference: PMID:9605588
    reference_title: FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We report the first case of ABS associated with an apparent dominant de novo mutation in the fibroblast growth factor receptor 2 (FGFR2) gene.
    explanation: Index clinical inheritance observation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/
    reference_title: FGFR Craniosynostosis Syndromes Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Each child of an individual with an <i>FGFR</i> craniosynostosis syndrome has a 50% chance of inheriting the <i>FGFR</i> <a class="def" href="/sites/books/n/gene/glossary/def-item/pathogenic-variant/">pathogenic variant</a>.
    explanation: Complete offspring-transmission sentence from GeneReviews. Literal inline HTML preserves the generated source and the FGFR pathogenic-variant endpoint.
    directness: INDIRECT
pathophysiology:
- name: Extracellular FGFR2 Pathogenic Variants
  description: Heterozygous extracellular FGFR2 variants are the initiating genetic lesion. p.Ser351Cys introduces a cysteine in IgIII; C342S and C342R were also reported in an ABS-ascertained cohort. Nucleotide numbering differs among older reports; the contemporary p.Ser351Cys coding designation is c.1052C>G. A syndrome label is not an allele-specific functional assay.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:9605588
    reference_title: FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The patient was found to be heterozygous for a C-->G transversion at nucleotide 1064, which predicts a Ser351Cys amino acid substitution in the IgIII domain of FGFR2.
    explanation: The index p.Ser351Cys variant; historical nucleotide numbering is quoted as published.

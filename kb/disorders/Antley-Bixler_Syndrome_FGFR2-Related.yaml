- name: Airway stabilization and treatment of obstruction
  description: Urgent respiratory support and specialist airway assessment are tailored to the obstruction level. Nasal stents, intubation or tracheotomy may be needed. Sleep-apnea interventions depend on severity, age and anatomy; residual obstruction is common. CPAP/BiPAP can be an interim option with craniofacial and ocular precautions. The older GeneReviews concern about prolonged mask pressure is not a ban on acute support.
  action_category: THERAPEUTIC
  evidence:

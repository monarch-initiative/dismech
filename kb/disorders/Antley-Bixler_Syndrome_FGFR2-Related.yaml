genetic:
- name: FGFR2 p.Ser351Cys
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The recurrent allele of the FGFR2 form, c.1052C>G p.Ser351Cys in the IgIII domain,
    reported predominantly in patients with normal genitalia and normal steroidogenesis.
    The same substitution has been reported in severe Pfeiffer syndrome, which is part of
    why the entity status of the FGFR2 form is disputed. Distinguishing this entry from
    the POR form is a genotype question, not a phenotype one: the two overlap
    substantially in skeletal features, and urinary steroid profiling is what separates
    them clinically.
  evidence:
  - reference: PMID:9605588
    reference_title: "FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was found to be heterozygous for a C-->G transversion at nucleotide 1064, which predicts a Ser351Cys amino acid substitution in the IgIII domain of FGFR2."
    explanation: The molecular definition of the allele.
  - reference: PMID:20818252
    reference_title: "Spectrum of Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations of the P450 oxidoreductase gene have been reported in those patients with genital anomalies and/or impaired steroidogenesis, and the S351C mutation of the fibroblast growth factor receptor 2 gene has been reported predominantly in those patients with normal genitalia and steroidogenesis."
    explanation: >-
      The genotype-phenotype split between the two disorders that share the name, and the
      basis on which this entry is scoped.
treatments:
- name: Staged craniofacial and airway management
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >
    No disease-modifying therapy exists. Management follows the pattern of the other
    severe FGFR2 craniosynostoses — airway securing in the neonate given the combination
    of midface hypoplasia and choanal narrowing, then staged cranial vault and midface
    procedures. The fused elbows and joint contractures add an orthopaedic and
    rehabilitation dimension the purely craniofacial FGFR2 syndromes do not have, and
    they are not correctable by the craniofacial pathway.
  treatment_term:
    preferred_term: Craniofacial surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  - preferred_term: Midface retrusion
    term:
      id: HP:0011800
      label: Midface retrusion
  evidence:
  - reference: PMID:20818252
    reference_title: "Spectrum of Antley-Bixler syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a series of 4 patients with ABS and review their main findings and management."
    explanation: >-
      Marked PARTIAL: the series reports management of ABS patients without separating
      outcomes by genotype, so it does not establish a management standard specific to
      the FGFR2 form.
discussions:
- discussion_id: gap_abs_fgfr2_distinct_entity_status
  prompt: >-
    Is FGFR2-related Antley-Bixler syndrome a distinct disease entity, or a severe variant
    of the FGFR2 craniosynostosis syndromes that happens to carry a separate eponym?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FGFR2 IgIII Cysteine-Creating Activation
  - pathophysiology#Cranial Suture and Joint Osteogenic Dysregulation
  rationale: >-
    The entity status is disputed in the published record and this entry does not resolve
    it. The first FGFR2 case (Chun et al. 1998) drew two rebuttals in the same journal
    arguing the patient did not have Antley-Bixler syndrome — "Patient described by Chun
    et al. may not present Antley-Bixler syndrome" (PMID:10076886) and "Not Antley-Bixler
    syndrome" (PMID:10076887); neither caches with an abstract, so neither can be quoted
    here, and both are cited in prose only. Cragun et al. (PMID:16145814) subsequently
    concluded that ABS without disordered steroidogenesis appears to be a variant of the
    FGFR-related craniosynostosis syndromes, and argued the ABS name should be reserved
    for the POR form — the opposite of the convention MONDO:0020667 encodes and that this
    entry follows. Compounding it, the same FGFR2 p.Ser351Cys allele is reported in severe
    Pfeiffer syndrome, so genotype does not discriminate. Three things would be needed to
    settle this and none exists: a genotype-stratified phenotype comparison of
    p.Ser351Cys carriers labelled Antley-Bixler against those labelled Pfeiffer; agreement
    on whether humeroradial synostosis is a discriminating feature or a severity marker
    within the FGFR2 spectrum; and a nomenclature decision that the field has not made.
    Note what is NOT in dispute: the receptor mechanism. A future decision that this is
    not a separate entity would be a lump into Pfeiffer syndrome or a broader FGFR2
    craniosynostosis concept — it would not remove the disorder from the FGFR
    gain-of-function grouping.
  evidence:
  - reference: PMID:16145814
    reference_title: 'Use of the term "Antley-Bixler syndrome": minimizing confusion.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in the scientific literature is genetically heterogeneous with at least two distinct disorders, (1) ABS without disordered steroidogenesis, which appears to be a variant of the autosomal dominant fibroblast growth factor receptor (FGFR)"
    explanation: >-
      The central claim against separate-entity status: the FGFR2 form is characterized as
      a variant of the FGFR craniosynostosis syndromes.
  - reference: PMID:16145814
    reference_title: "Use of the term \\\"Antley-Bixler syndrome\\\": minimizing confusion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We believe it would be better to reserve the use of the term \"ABS\" for patients with POR deficiency and clinically significant craniosynostosis and/or radiohumoral synostosis."
    explanation: >-
      The proposed nomenclature, which would assign the ABS name to the POR form and
      leave this entry's concept without one — directly contrary to the MONDO class
      curated here.
  proposed_experiments:
  - experiment_id: exp_abs_fgfr2_vs_pfeiffer_phenotype_comparison
    name: Genotype-stratified comparison of FGFR2 p.Ser351Cys carriers
    description: >-
      Assemble all reported p.Ser351Cys carriers regardless of the syndrome label applied
      and compare skeletal, craniofacial and joint features. If carriers labelled
      Antley-Bixler and carriers labelled severe Pfeiffer are phenotypically
      indistinguishable, the eponym is not tracking biology.
  - experiment_id: exp_abs_humeroradial_synostosis_specificity
    name: Frequency of humeroradial synostosis across FGFR2 craniosynostosis genotypes
    description: >-
      Determine how often elbow fusion occurs in FGFR2 craniosynostosis syndromes other
      than Antley-Bixler. If it is a severity marker rather than a discriminating feature,
      the case for a separate entity weakens further.
- discussion_id: gap_abs_two_disorders_one_name
  prompt: >-
    How should a knowledge base represent a disease name that denotes two mechanistically
    unrelated disorders, when the field has not agreed which one owns the name?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FGFR2 IgIII Cysteine-Creating Activation
  rationale: >-
    This is a curation-practice gap as much as a biological one, recorded because it will
    recur. "Antley-Bixler syndrome" covers this FGFR2 craniosynostosis and a distinct
    autosomal recessive POR (cytochrome P450 oxidoreductase) deficiency presenting with
    disordered steroidogenesis and ambiguous genitalia — a disorder of steroid synthesis
    with no FGFR involvement whatever. MONDO splits them (MONDO:0020667 here,
    MONDO:0008726 for the POR form), but the literature does not: a PubMed sweep on the
    syndrome name returns an overwhelmingly POR-dominated result set, so any automated
    literature harvest keyed on the name will import the wrong disorder into this entry.
    The published nomenclature proposals conflict, with at least one arguing the name
    should go to the POR form. Until the field settles, the practical protections are the
    ones applied here: scope by genotype rather than by name, quote only sources whose
    subject can be identified from the quoted text, and state the hazard in the entry so
    it is not re-inherited. The dismech NEC preflight (`just preflight-dr`) is the
    relevant tooling, and this disorder is a good test case for it.
  evidence:
  - reference: PMID:20818252
    reference_title: "Spectrum of Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition of ABS is curious in that mutations of 2 separate genes have been identified and that there seem to be subtle phenotypic differences between the 2 genotypes."
    explanation: States the two-gene problem and that the phenotypic separation is subtle.
  - reference: PMID:16145814
    reference_title: "Use of the term \\\"Antley-Bixler syndrome\\\": minimizing confusion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in the scientific literature is genetically heterogeneous with at least two distinct disorders, (1) ABS without disordered steroidogenesis, which appears to be a variant of the autosomal dominant fibroblast growth factor receptor (FGFR)"
    explanation: Confirms the name covers two distinct disorders in the literature.
  proposed_experiments:
  - experiment_id: exp_abs_name_keyed_literature_precision
    name: Measure precision of name-keyed literature retrieval for split eponyms
    description: >-
      Quantify what fraction of "Antley-Bixler syndrome" publications concern each
      genotype. A precision figure would let the NEC preflight flag name-keyed harvests
      for split eponyms generally, rather than relying on a curator recognizing the
      hazard case by case.
notes: >
  Curated de novo from primary literature under claim #9404, completing the FGFR-Related
  Skeletal Dysplasias grouping — this was its last unfilled seat after Beare-Stevenson
  (#9257) and the bent bone dysplasia retraction (#9384).

  Scope. This entry is scoped by GENOTYPE, not by the syndrome name. It covers only the
  FGFR2 form (MONDO:0020667). The POR form (MONDO:0008726) is a separate autosomal
  recessive disorder of steroidogenesis with no FGFR lesion, has its own stub, and must
  never be merged into this entry. Where a quoted snippet describes "ABS" as a whole and
  therefore mentions impaired steroidogenesis, the explanation says so explicitly and no
  steroidogenic phenotype is curated here.

  Grouping membership. Added as a member, unlike bent bone dysplasia syndrome. The
  distinction is mechanistic and was checked before asserting it: p.Ser351Cys creates an
  unpaired cysteine in the IgIII domain, giving ligand-independent disulfide-mediated
  dimerization and genuine constitutive activation — the grouping's criterion. Bent bone
  dysplasia's transmembrane alleles instead reduce membrane receptor and FGF
  responsiveness, which is why it is excluded. Same gene, opposite receptor behaviour,
  opposite membership.

  Entity status is deliberately left open rather than asserted; see
  gap_abs_fgfr2_distinct_entity_status. If the field later lumps this into Pfeiffer
  syndrome or a broader FGFR2 craniosynostosis concept, the correct response is a
  has_subtypes entry on that parent plus a superseded_by history record — not deletion,
  and not removal from the grouping, since the mechanism claim would survive the renaming.

  Three sources central to the nosology dispute cache with content_type unavailable and
  are therefore cited in attributed prose only, never quoted: PMID:10076886 ("Patient
  described by Chun et al. may not present Antley-Bixler syndrome"), PMID:10076887 ("Not
  Antley-Bixler syndrome") and PMID:11430730 ("Further evidence that fibroblast growth
  factor receptor 2 mutations cause Antley-Bixler syndrome"). If any is later cached with
  an abstract it should be added as evidence to gap_abs_fgfr2_distinct_entity_status,
  where the rebuttals in particular would strengthen the record considerably.

  No phenotype carries a frequency band. The case literature is small and additionally
  contaminated by the two-disorder problem, so name-derived counts would overstate this
  entry.

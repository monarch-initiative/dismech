name: Antley-Bixler Syndrome, FGFR2-Related
synonyms:
- ABS without genital anomalies or disordered steroidogenesis
- Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
- trapezoidocephaly-synostosis syndrome
- FGFR2-related Antley-Bixler syndrome
creation_date: "2026-08-24T00:00:00Z"
category: Mendelian
description: >
  Antley-Bixler syndrome is an exceptionally rare craniosynostosis syndrome defined by
  radiohumeral (humeroradial) synostosis present from the perinatal period, together with
  midface hypoplasia, choanal stenosis or atresia, multiple joint contractures, and
  visceral anomalies. This entry covers the FGFR2-related form specifically — the
  recurrent p.Ser351Cys substitution in the IgIII domain, reported predominantly in
  patients with normal genitalia and normal steroidogenesis.

  Two things about this entry need stating before anything else, because both are traps.

  First, the name denotes two mechanistically unrelated disorders. "Antley-Bixler
  syndrome" in the literature is genetically heterogeneous: the form curated here, and a
  distinct autosomal recessive disorder caused by severe mutations in POR (cytochrome
  P450 oxidoreductase), which presents with disordered steroidogenesis and ambiguous
  genitalia and is a disorder of steroid synthesis with no FGFR lesion at all. The POR
  form dominates the modern literature by a wide margin. The two must never be merged,
  and a source discussing "Antley-Bixler syndrome" cannot be assumed to be about this
  entry.

  Second, and less widely appreciated: whether the FGFR2 form is a distinct entity at all
  is contested. The original FGFR2 report drew two published rebuttals arguing the patient
  did not have Antley-Bixler syndrome; a subsequent analysis concluded that ABS without
  disordered steroidogenesis "appears to be a variant of the autosomal dominant fibroblast
  growth factor receptor (FGFR)-related craniosynostosis syndromes", and argued the ABS
  name should be reserved for the POR form — the opposite of the convention this MONDO
  class encodes. The same FGFR2 p.Ser351Cys allele is also reported in severe Pfeiffer
  syndrome, so genotype does not separate them either. The entry is curated because
  MONDO maintains the class and the mechanism is well defined, but its independence is
  recorded as an open question rather than asserted; see
  gap_abs_fgfr2_distinct_entity_status.

  Mechanistically it is unambiguous, and that is why it belongs to the FGFR-Related
  Skeletal Dysplasias grouping while bent bone dysplasia syndrome does not. p.Ser351Cys
  creates an unpaired cysteine in the IgIII domain — the same ligand-independent
  disulfide-dimerization activation class as Beare-Stevenson p.Tyr375Cys and the
  extracellular-cysteine alleles of Crouzon syndrome and thanatophoric dysplasia type 1.
  The contest here is over what to call the phenotype, not over how the receptor behaves.

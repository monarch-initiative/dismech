- name: Aberrant FGFR2 Disulfide Dimerization
  description: Aberrant intermolecular disulfide bonding is the proposed activating mechanism for p.Ser351Cys and a supported mechanism for the broader extracellular FGFR2 mutation class. Reducible dimers were demonstrated in heterologous assays of other FGFR2 variants; the cited study did not test p.Ser351Cys itself.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:10406670
    reference_title: Ocular anterior chamber dysgenesis in craniosynostosis syndromes with a fibroblast growth factor receptor 2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: All three cases were found to have the same FGFR2 Ser351Cys (1231C to G) mutation predicted to form an aberrant disulfide bond(s) and affect ligand binding.
    explanation: The human case report explicitly identifies a predicted, not measured, receptor mechanism.
    directness: INDIRECT
  - reference: PMID:9539778
    reference_title: Activating mutations in the extracellular domain of the fibroblast growth factor receptor 2 function by disruption of the disulfide bond in the third immunoglobulin-like domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Additionally, the dimerization observed for both of these mutants was reducible, indicating that the dimerization was accomplished by disulfide bond formation.
    explanation: Reducible dimers in COS-1 experiments with W290G/T341P and cysteine-loss controls support the molecular class mechanism, not a p.Ser351Cys assay.
    directness: INDIRECT
  mechanism_confidence: PROVISIONAL

progression:
- phase: Congenital and early childhood presentation
  notes: Craniofacial, joint and airway abnormalities can be apparent at birth; hydrocephalus and the full craniosynostosis phenotype may become evident later. Severe early morbidity and deaths are described in selected reports, but publication bias, overlapping patients and syndrome-label variation preclude a survival estimate. The 2021 infant died after discharge without autopsy, so a specific terminal mechanism was not established.
  evidence:
  - reference: PMID:16465081
    reference_title: Syndromic craniosynostosis with elbow joint contracture.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: At birth, a male infant had ocular proptosis, a pseudotail, and obstructed respiration. He developed craniosynostosis, craniofacial dysmorphism, hydrocephalus, and bilateral contracture of his elbow joints.
    explanation: Congenital findings and subsequent evolution.
  - reference: PMID:10406670
    reference_title: Ocular anterior chamber dysgenesis in craniosynostosis syndromes with a fibroblast growth factor receptor 2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: These patients had airway compromise, seizures, and two died by age 15 months.
    explanation: Selected-case outcomes, not a survival cohort.
  - reference: PMID:34909104
    reference_title: 'Pfeiffer syndrome type 3 with FGR2 c.1052C>G (p.Ser351Cys) variant in West Africa: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The child was reported to have become lethargic and died some hours after reporting to the district hospital. An autopsy was not done.
    explanation: Cause of death remains unverified.
treatments:
- name: Cranial vault expansion and reconstruction
  description: A specialist craniofacial team individualizes cranial surgery to suture anatomy, intracranial pressure and respiratory status. General FGFR guidance places multisuture repair in the first year, often with staged posterior expansion and later fronto-orbital procedures. The p.Ser351Cys literature documents treatment use, not comparative surgical efficacy.
  action_category: THERAPEUTIC
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1455/
    reference_title: FGFR Craniosynostosis Syndromes Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Cranioplasty involves release of fused sutures and repositioning and reconstruction of the calvaria, in order to prevent increased intracranial pressure and reduce progressive abnormal craniofacial development.
    explanation: General FGFR clinical baseline, extrapolated to the molecularly confirmed presentation.
    directness: INDIRECT
  - reference: PMID:16465081
    reference_title: Syndromic craniosynostosis with elbow joint contracture.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

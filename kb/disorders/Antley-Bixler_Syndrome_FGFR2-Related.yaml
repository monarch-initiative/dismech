  description: Ophthalmology assesses exposure, globe subluxation, vision and structural anterior segment abnormalities. Lubrication and, when necessary, tarsorrhaphy protect an inadequately covered cornea; they do not correct congenital Peters anomaly or establish reversal of globe protrusion.

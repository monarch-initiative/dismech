discussions:
- discussion_id: gap_abs_fgfr2_distinct_entity_status
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does the Antley–Bixler label identify a distinct FGFR2 phenotype?
  attaches_to:
  - genetic#FGFR2 extracellular variants
  rationale: The same S351C allele appears under Antley–Bixler, Pfeiffer and Crouzon labels. Elbow ankylosis is not unique to the ABS label, and contractures need not represent bony fusion. Nomenclature proposals differ over whether ABS should be reserved for POR deficiency. This entry retains the existing MONDO concept without treating the clinical labels as distinct molecular mechanisms. A genotype-stratified comparison should deduplicate re-reported patients and record radiographic joint anatomy.
  evidence:
  - reference: PMID:16145814
    reference_title: 'Use of the term "Antley-Bixler syndrome": minimizing confusion.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: We believe it would be better to reserve the use of the term “ABS” for patients with POR deficiency and clinically significant craniosynostosis and/or radiohumoral synostosis.
    explanation: Attributed nomenclature proposal, not a binding reclassification.
  - reference: PMID:9714439
    reference_title: 'Phenotype of the fibroblast growth factor receptor 2 Ser351Cys mutation: Pfeiffer syndrome type III.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The mutation identified in our patient, Ser351Cys in FGFR2, represents the first reported cause of Pfeiffer syndrome type III.
    explanation: Same allele under an alternative clinical label.
- discussion_id: gap_abs_allele_specific_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How directly does the disulfide-activation mechanism apply to S351C?
  attaches_to:
  - pathophysiology#Aberrant FGFR2 Disulfide Dimerization
  - pathophysiology#Increased FGFR2 Kinase Activity
  rationale: The human S351C report predicts aberrant disulfide bonding and altered ligand binding. The cited experiments directly demonstrate dimerization and kinase activation for other alleles, not S351C. Their telokin-based homology model is not a mutant FGFR2 crystal structure or direct bond map. Allele-specific dimerization, ligand dependence and kinase measurements, ideally with expression-matched controls, would strengthen the current class inference. Cranial osteogenic and joint-development effects require separate tissue-level testing.
  evidence:
  - reference: PMID:10406670
    reference_title: Ocular anterior chamber dysgenesis in craniosynostosis syndromes with a fibroblast growth factor receptor 2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: All three cases were found to have the same FGFR2 Ser351Cys (1231C to G) mutation predicted to form an aberrant disulfide bond(s) and affect ligand binding.
    explanation: Explicit predictive wording in the allele-specific report.
    directness: INDIRECT
  - reference: PMID:9539778
    reference_title: Activating mutations in the extracellular domain of the fibroblast growth factor receptor 2 function by disruption of the disulfide bond in the third immunoglobulin-like domain.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    snippet: We used molecular modeling to construct a three-dimensional representation of the Ig-3 domain of FGFR2 based on the crystallographic coordinates of telokin, a myosin light chain kinase homolog
    explanation: Homology-model provenance; not an experimental S351C structure.
notes: Clinical care is based on the broader FGFR craniosynostosis baseline plus genotype-matched case reports. Established steroidogenic disease belongs to the POR differential rather than an assumed FGFR2 mechanism. No allele-specific drug efficacy, clinical trial or whole-animal S351C model was established by the reviewed sources. Other FGFR2 model genotypes are not silently substituted for this allele.
review_notes: 'Comprehensive source review used all original cached abstracts and available full scientific bodies, the complete FGFR GeneReviews clinical chapter, regenerated 2005 cohort tables, and the relevant 2020 guideline methodology and respiratory recommendations. No matching deep-research report was found. Selected reports overlap: the 2005 cohort reuses earlier cases, including two from the 1999 ocular series. Clinical frequencies and a numeric prevalence class are therefore omitted. The 2005 article conflicts between F276V in its table and P276V in the narrative; that spelling is not resolved by assumption. Its joint column combines radiohumeral and radioulnar fusion; individual unspecific ankylosis is kept at the broader elbow term. Genital appearance does not exclude POR deficiency. The 2021 report has perinatal hypoxic/infectious confounding, a source-internal intron designation for a coding missense variant, and an unverified terminal event. The unavailable correspondence is bibliographic context only. The 1998 model cache contains the main scientific text and captions but omits Table 1 rows; no table-specific conclusion was inferred. The full GeneReviews HTML is genuinely
  available; a separate PDF route returned a challenge page and was quarantined, not cited. Literal HTML entities in a few chapter excerpts preserve the generated source text.'

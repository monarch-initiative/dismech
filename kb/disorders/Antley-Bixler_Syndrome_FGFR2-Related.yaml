genetic:
- name: FGFR2 extracellular variants
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: p.Ser351Cys is recurrent across Antley–Bixler, Pfeiffer and Crouzon labels. The 2005 selected cohort included five p.Ser351Cys cases, C342S and C342R, with earlier cases reanalyzed; this is not an independent population-frequency estimate. The article disagrees between F276V in Table4 and P276V in the narrative for another allele, so that uncertain spelling is not promoted here. A heterozygous variant must be interpreted with phenotype and appropriate classification, not merely the syndrome name.
  evidence:
  - reference: PMID:9605588
    reference_title: FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The patient was found to be heterozygous for a C-->G transversion at nucleotide 1064, which predicts a Ser351Cys amino acid substitution in the IgIII domain of FGFR2.
    explanation: Index variant.
  - reference: PMID:15793702
    reference_title: Diversity and function of mutations in p450 oxidoreductase in patients with Antley-Bixler syndrome and disordered steroidogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: FGFR2 mutation S351C was found in five patients, other FGFR2 mutations (C342S, C342R, and P276V) were found in three other patients
    explanation: Selected cohort supports multiple FGFR2 alleles; the source-internal P276V/F276V discrepancy is retained as a limitation.

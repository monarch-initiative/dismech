    directness: INDIRECT
- name: Genetic counseling and family evaluation
  description: Explain autosomal-dominant transmission, variable expression and the distinction from recessive POR deficiency. Confirm the familial variant before predictive, prenatal or preimplantation testing, and assess apparently unaffected relatives when appropriate. Negative parental blood testing cannot eliminate possible germline mosaicism.

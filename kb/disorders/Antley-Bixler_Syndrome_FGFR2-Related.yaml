- name: Midface advancement
  description: Midface or combined craniofacial advancement is considered when airway compromise or occlusion justifies it. Severe obstructive sleep apnea can prompt earlier surgery; timing and procedure require a multidisciplinary assessment rather than a fixed allele-based schedule.
  action_category: THERAPEUTIC
  evidence:
  - reference: PMID:33156164
    reference_title: Updated Guideline on Treatment and Management of Craniosynostosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Consider Le Fort III surgery or monobloc advancement in children with syndromic craniosynostosis and severe respiratory OSA to treat the respiratory problems. If necessary, combine this procedure with a mandibula advancement.
    explanation: Guideline recommendation for selected severe syndromic obstruction; evidence is not specific to FGFR2-related ABS.
    directness: INDIRECT

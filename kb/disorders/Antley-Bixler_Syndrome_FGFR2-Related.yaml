- name: Multidisciplinary surveillance
  description: Monitor head growth and symptoms of raised intracranial pressure, with frequent assessment in infancy and at least annual ophthalmological evaluation. Evaluate hearing, dentition, speech and development. The 2020 craniosynostosis guideline recommends annual type 1 polysomnography through at least age six for syndromic children, in addition to symptom-triggered assessment. Surgical and anesthetic planning should consider airway anatomy, possible cervical anomalies and eye protection.
  action_category: MONITORING
  evidence:
  - reference: PMID:33156164
    reference_title: Updated Guideline on Treatment and Management of Craniosynostosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Screen children with syndromic craniosynostosis annually by type 1 polysomnography at a center of expertise until at least the age of 6 years.
    explanation: Updated guideline surveillance; not restricted to a genotype.
    directness: INDIRECT

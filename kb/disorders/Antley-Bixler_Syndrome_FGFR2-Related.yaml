- name: Cranial and joint imaging
  description: Document the sutures and bones involved, and distinguish radiohumeral or radioulnar fusion from non-bony contracture. Evaluate hydrocephalus and other neurological complications as indicated. Neither elbow ankylosis nor a sacral appendage alone specifies the complete anatomical abnormality.
  evidence:
  - reference: PMID:15793702
    reference_title: Diversity and function of mutations in p450 oxidoreductase in patients with Antley-Bixler syndrome and disordered steroidogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: craniosynostosis and radioulnar or radiohumeral synostosis were confirmed radiographically.
    explanation: Method used in the mixed, genotype-stratified cohort.
- name: Steroid assessment when distinguishing POR deficiency
  description: An initial ABS phenotype warrants assessment for steroidogenic disease when the genetic diagnosis is unresolved or endocrine concerns persist. Urinary steroid profiling and specialist adrenal assessment can detect abnormalities missed by genital appearance or limited basal measurements. Established FGFR2 disease alone is not an indication for glucocorticoid replacement.
  evidence:
  - reference: PMID:16145814
    reference_title: 'Use of the term "Antley-Bixler syndrome": minimizing confusion.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Steroid abnormalities associated with POR deficiency and ABS are not always recognized without the use of urinary steroid profiling
    explanation: Review of the diagnostic distinction.
  - reference: PMID:16145814
    reference_title: 'Use of the term "Antley-Bixler syndrome": minimizing confusion.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The presence of ambiguous genitalia is not necessary for making a diagnosis of POR deficiency.
    explanation: Normal genital appearance does not exclude the alternative diagnosis.
differential_diagnoses:
- name: P450 oxidoreductase deficiency
  description: Recessive POR deficiency can share craniosynostosis, elbow synostosis and limb abnormalities, with variable steroidogenic and genital manifestations. Normal genitalia do not exclude it. Genotype and biochemical assessment are more discriminating than the ABS eponym.
  distinguishing_features:
  - Biallelic POR variants and characteristic steroid abnormalities support POR deficiency.
  - FGFR2-associated disease generally lacks the primary POR steroidogenic defect.
  evidence:
  - reference: PMID:16145814
    reference_title: 'Use of the term "Antley-Bixler syndrome": minimizing confusion.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The presence of ambiguous genitalia is not necessary for making a diagnosis of POR deficiency.
    explanation: Diagnostic caution from the nomenclature review.
- name: Pfeiffer and Crouzon syndromes
  description: These clinical labels overlap with the same p.Ser351Cys genotype, so they are alternative spectrum classifications rather than always genetically separable diagnoses. Normal thumbs do not exclude a severe Pfeiffer-labelled presentation.
  distinguishing_features:
  - Assess the complete cranial, limb and ocular phenotype without using elbow fusion as a unique discriminator.
  evidence:
  - reference: PMID:9714439
    reference_title: 'Phenotype of the fibroblast growth factor receptor 2 Ser351Cys mutation: Pfeiffer syndrome type III.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The phenotype of this patient is consistent with that previously reported in Pfeiffer syndrome type III, but is unusual for the lack of broad thumbs.
    explanation: Same-allele phenotypic overlap.
experimental_models:
- name: Full-length FGFR2 expression in COS-1 cells
  experimental_model_type: CELL_LINE
  cell_source: Immortalized simian COS-1 cells transiently transfected with human FGFR2 constructs
  description: Related extracellular FGFR2 variants formed reducible receptor dimers and showed increased autophosphorylation and phosphotyrosine signal. Combining W290G or T341P with C278A/C342A removed these effects. The assay supports a disulfide-dependent class mechanism, with low translational fidelity to the untested S351C allele and developing human cranial sutures.
  evidence:
  - reference: PMID:9539778
    reference_title: Activating mutations in the extracellular domain of the fibroblast growth factor receptor 2 function by disruption of the disulfide bond in the third immunoglobulin-like domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: COS-1 cells were transfected with full-length FGFR2 constructs described in Fig.1.
    explanation: Actual full-length receptor preparation.
  modeled_mechanisms:
  - target: Aberrant FGFR2 Disulfide Dimerization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: Related mutant constructs increased dimer formation under nonreducing conditions.
    limitations: Transient heterologous expression of W290G, T341P, C278F, C342Y and engineered cysteine controls; p.Ser351Cys was not tested. These assays do not measure cranial differentiation, joint fusion, patient tissue signaling or a disease rescue. Reducibility supports disulfide-mediated association without directly mapping individual intermolecular bonds.
    evidence:

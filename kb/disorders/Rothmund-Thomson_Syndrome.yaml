  subtype_term:
    preferred_term: Rothmund-Thomson syndrome type 3
    term:
      id: MONDO:0014347
      label: Rothmund-Thomson syndrome type 3
  description: >
    The CRIPT-related form. Affected individuals meet the clinical diagnostic
    criteria for RTS and additionally have neurodevelopmental delay and
    seizures, which is the feature that separates this subtype from the other
    three. Patient fibroblasts show raised senescence markers but are not
    unusually sensitive to genotoxic stress, so the reported cellular phenotype
    is one of premature senescence rather than of measurable genome instability.
    Note that the report establishing the gene describes the entity as
    "RTS-like" rather than as RTS itself; MONDO files it as Rothmund-Thomson
    syndrome type 3, and this row follows MONDO's placement while recording the
    distinction.

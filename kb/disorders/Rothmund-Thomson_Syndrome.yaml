    A shared deep intronic splicing variant in trans with a loss-of-function
    allele reduces DNA2 protein levels in the reported cohort, and patient cells
    show impaired DNA double-strand break repair. The same gene causes
    microcephalic osteodysplastic primordial dwarfism, and the sources state that
    the genotype-phenotype correlation separating the two DNA2 syndromes is not
    yet established.

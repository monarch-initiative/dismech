- name: Premature Cellular Senescence
  description: >
    Fibroblasts from individuals with either RECQL4 or CRIPT variants show raised
    senescence markers and raised senescence-associated beta-galactosidase
    activity. The same study found these cells were not unusually sensitive to
    genotoxic stress, so for CRIPT the senescent phenotype is reported without an
    accompanying measurable DNA-repair defect, and the authors offer senescence
    rather than genome instability as the mechanism the RTS genes share.
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Poikiloderma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The originating report proposes the shared senescent phenotype as the
      mechanism behind the clinical features that RECQL4- and CRIPT-related
      disease have in common, of which poikiloderma is the hallmark. The
      intermediate steps are not established.
    evidence:
    - reference: PMID:37013901
      reference_title: Biallelic variants in CRIPT cause a Rothmund-Thomson-like syndrome with increased cellular senescence.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "At the cellular level, RECQL4- and CRIPT-deficient cells display increased senescence, suggesting shared molecular mechanisms leading to the clinical phenotypes."
      explanation: Reports increased senescence in cells deficient for either gene, which is why both are wired to this node.
  evidence:
  - reference: PMID:37013901
    reference_title: Biallelic variants in CRIPT cause a Rothmund-Thomson-like syndrome with increased cellular senescence.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Skin biopsies revealed a high expression of senescence markers (p53/p16/p21) and the senescence-associated \u00df-galactosidase activity was elevated in CRIPT-deficient fibroblasts."
    explanation: Reports the senescence markers and the beta-galactosidase activity that define this node.
  - reference: PMID:37013901
    reference_title: Biallelic variants in CRIPT cause a Rothmund-Thomson-like syndrome with increased cellular senescence.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RECQL4- and CRIPT-deficient fibroblasts showed an unremarkable mitotic progression and unremarkable number of mitotic errors and no or only mild sensitivity to genotoxic stress by ionizing radiation, mitomycin C, hydroxyurea, etoposide, and potassium bromate."
    explanation: >-
      Supports this node's statement that the senescent phenotype is present without
      measurable genotoxic sensitivity or mitotic error in the same fibroblasts. It
      does not bear against increased senescence, which the two items above establish;
      it is the reason no edge is drawn from here to the genomic instability node,
      since the sources place the senescence upstream of, or independent of, measurable
      genome instability rather than downstream of it.

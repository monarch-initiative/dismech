notes: >
  RTS belongs to the RECQL4-spectrum of disorders, which also includes RAPADILINO
  syndrome and Baller-Gerold syndrome; these are allelic RECQL4-related
  conditions distinct from RTS. RTS is one of three human RecQ-helicase disorders
  alongside Werner syndrome (WRN) and Bloom syndrome (BLM).

  Nosological caveat on types 3 and 4. The two newer genes sit on the RTS
  spectrum with weaker nosological footing than ANAPC1 and RECQL4, and the
  entry records that rather than smoothing it over. The originating reports
  describe the CRIPT entity as a "Rothmund-Thomson-like syndrome" and the DNA2
  entity as "reminiscent of Rothmund-Thomson syndrome" in their own titles;
  the GeneReviews RTS chapter, last updated 2020 Jun 4 in the copy cached at
  references_cache/PMID_20301415.md, states that the diagnosis is established
  by clinical findings and/or biallelic variants in ANAPC1 or RECQL4 and does
  not name CRIPT or DNA2. MONDO nonetheless carries
  MONDO:0014347 (Rothmund-Thomson syndrome type 3, CRIPT) and
  MONDO:0970950 (Rothmund-Thomson syndrome type 4, DNA2), and those two
  identifiers are bound on the Type 3 and Type 4 rows of has_subtypes in this
  entry. The arguments for following MONDO are that CRIPT individuals meet the
  published RTS clinical criteria and score closest to RTS on facial gestalt
  analysis, and that the 2023 review PMID:38021400 treats all four genes as
  RTS genes. DNA2 additionally causes
  microcephalic osteodysplastic primordial dwarfism, and the report naming it
  in RTS states that the genotype-phenotype correlation separating the two
  DNA2 syndromes is not yet established.

  Senescence rather than measured genome instability is what the CRIPT report
  found. The same study that reports raised senescence markers in
  CRIPT-deficient fibroblasts also reports that RECQL4- and CRIPT-deficient
  fibroblasts had unremarkable mitotic progression and no more than mild
  sensitivity to five genotoxic agents. The Premature Cellular Senescence node
  therefore carries that result as a REFUTE item and has no edge to the
  genomic instability node.

name: Rothmund-Thomson Syndrome
creation_date: "2026-06-17T00:00:00Z"
category: Mendelian
description: >-
  Rothmund-Thomson syndrome (RTS) is a rare autosomal recessive genodermatosis
  characterized by a rash that progresses to poikiloderma; sparse hair,
  eyelashes, and eyebrows; small stature; skeletal and dental abnormalities;
  juvenile cataracts; and an increased risk for cancer, especially osteosarcoma.
  Four molecularly defined types are recognized. Type 1 is caused by biallelic
  ANAPC1 mutations affecting the anaphase-promoting complex and carries juvenile
  cataracts; type 2 is defined by biallelic RECQL4 mutations and carries skeletal
  anomalies and a high risk of osteosarcoma; type 3 is CRIPT-related and adds
  neurodevelopmental delay and seizures; type 4 is DNA2-related and presents with
  congenital ocular anomalies and severe growth failure. RECQL4 encodes a RecQ
  DNA helicase, and its deficiency causes genomic instability through impaired
  DNA replication and repair. Types 1 and 2 together account for more than 70%
  of cases.

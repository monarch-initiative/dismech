treatments:
- name: Testicular sperm extraction, withheld or not repeated
  description: >-
    The clinically actionable consequence of a TEX11 diagnosis is unusual in
    shape, because the intervention it supports is a negative one. Meiotic arrest
    predicts a poor yield from testicular sperm extraction, and TEX11 is one of
    only a small number of genes for which the evidence base linking genotype to
    negative retrieval outcomes is considered strong enough to act on. A molecular
    diagnosis can therefore spare a man a surgical procedure unlikely to recover
    usable sperm, or spare him a repeat of one that has already failed. Nothing
    restores endogenous fertility; there is no therapy directed at the meiotic
    lesion itself.
  therapeutic_modality: SURGERY
  notes: >-
    The therapeutic_modality here tags the intervention being withheld, not one
    being administered. What the diagnosis supports is a decision not to operate,
    or not to operate again.
  treatment_term:
    preferred_term: testicular sperm retrieval
    term:
      id: NCIT:C94427
      label: Sperm Retrieval
  evidence:
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sperm were not recovered in any patient carrying LP/P variants in TEX11 (n = 17), SYCE1 (n = 14), and MSH4 (n = 10), indicating that the likelihood of obtaining sperm in patients with LP/P variants in these genes is close to zero"
    explanation: >-
      Direct finding rather than a caveat: no sperm were recovered in any of 17
      men carrying pathogenic or likely pathogenic TEX11 variants, which is what
      makes withholding the procedure a defensible decision.
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caution is warranted for genes linked to negative TESE outcomes, except for TEX11, SYCE1, and MSH4, each of which have 10 or more reported TESE-negative cases"
    explanation: >-
      Places TEX11 among the small number of genes whose retrieval-negative
      evidence base the authors consider sufficient to act on.
- name: Genetic counselling for the patient and female relatives
  description: >-
    Counselling has a consequence beyond the proband. Because the allele is
    X-linked, a daughter conceived through assisted reproduction using the
    father's sperm is an obligate carrier, and can transmit it to her own sons.
    Where sperm are retrieved and used, that transmission is a foreseeable
    outcome of the treatment rather than an incidental family finding.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The burden is entirely reproductive and psychosocial. There is no systemic
    disease, no effect on virilisation, sexual function, general health or life
    expectancy, and carrier women are unaffected. What the diagnosis costs a
    patient is the prospect of biological parenthood without assisted
    reproduction, and often the outcome of a failed surgical retrieval.
discussions:
- discussion_id: tex11_missense_allele_adjudication
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Which human TEX11 missense alleles are actually pathogenic, and can a
    transgenic mouse adjudicate that question for a given variant?
  rationale: >-
    Missense TEX11 variants are found in fertile men as well as in azoospermic
    men, so gene identity does not settle pathogenicity and the variants cannot
    all be causal. The one direct test of the question modelled three human
    missense alleles in transgenic mice and found only one behaved as a candidate
    infertility allele, with the other two non-causative. That is a real result
    and it is why this entry declines to treat missense variants as a causal
    class. It also sets up the mismatch: a mouse carrying a humanised allele is
    the only functional assay currently applied to these variants, and its
    negative results are being used to reclassify human variants, but nothing
    establishes that murine spermatogenesis has the same tolerance for a given
    substitution as human spermatogenesis does. A negative mouse result may mean
    the allele is benign, or that the mouse is more permissive. Resolving this
    needs a human-cell or patient-tissue assay of TEX11 function, not more mouse
    alleles.
  attaches_to:
  - genetic#TEX11
  - pathophysiology#TEX11 Loss of Function

inheritance:
- name: X-linked recessive
  description: >-
    Affected men are hemizygous for a TEX11 loss-of-function allele on Xq13.
    Carrier women are fertile and unaffected. Because affected men are infertile
    without assisted reproduction, alleles reach probands by maternal
    transmission or arise de novo, and pedigrees rarely show the multigenerational
    segregation typical of dominant disease.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a 99-kb hemizygous loss on chromosome Xq13.2 that involved three TEX11 exons."
    explanation: >-
      A hemizygous lesion on the X chromosome in affected men establishes the
      X-linked pattern.
pathophysiology:
- name: TEX11 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Hemizygous TEX11 variants, including splice-site and missense changes and a
    recurrent 99 kb deletion removing three exons from the meiosis-specific SPO22
    sporulation domain, abolish functional TEX11 protein. In normal human testis
    TEX11 is expressed in late spermatocytes and in round and elongated
    spermatids; in testes of affected men that expression is absent.
  genetic_context:
    gene:
      preferred_term: TEX11
      term:
        id: hgnc:11733
        label: TEX11
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, testes of patients who had azoospermia with TEX11 mutations had meiotic arrest and lacked TEX11 expression."
    explanation: >-
      Establishes loss of TEX11 protein in the target tissue of affected men, and
      links it to the arrest phenotype in the same specimens.
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This loss, which was identical in 2 patients with azoospermia, predicts a deletion of 79 amino acids within the meiosis-specific sporulation domain SPO22."
    explanation: >-
      Locates the recurrent deletion allele within the functional domain, which
      is the basis for calling it loss of function.
  downstream:
  - target: Chromosomal Asynapsis and Reduced Crossover Formation
    description: >-
      Without TEX11 at recombination nodules, synapsis and crossover formation
      both fail.
- name: Chromosomal Asynapsis and Reduced Crossover Formation
  biological_scale: CELLULAR
  conforms_to: "meiotic_prophase_failure#Synaptonemal Complex Assembly"
  description: >-
    TEX11 forms foci on synapsed regions of meiotic chromosomes as a constituent
    of recombination nodules, and it binds SYCP2, an integral component of the
    synaptonemal complex lateral element. That interaction is the proposed
    physical link between synapsis and recombination. Losing TEX11 produces
    asynapsis of homologous chromosomes together with a genome-wide reduction in
    crossover formation, rather than either defect alone.
  cell_types:
  - preferred_term: spermatocyte
    term:
      id: CL:0000017
      label: spermatocyte
  cellular_components:
  - preferred_term: synaptonemal complex
    term:
      id: GO:0000795
      label: synaptonemal complex
  biological_processes:
  - preferred_term: synapsis
    term:
      id: GO:0007129
      label: homologous chromosome pairing at meiosis
    modifier: DECREASED
  - preferred_term: synaptonemal complex assembly
    term:
      id: GO:0007130
      label: synaptonemal complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:18316482
    reference_title: Meiotic failure in male mice lacking an X-linked factor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Loss of TEX11 function causes chromosomal asynapsis and reduced crossover formation, leading to elimination of spermatocytes, respectively, at the pachytene and anaphase I stages."
    explanation: >-
      States the asynapsis and crossover defect and the two stages at which cells
      are lost. INDIRECT because it is established in the mouse.
  - reference: PMID:18316482
    reference_title: Meiotic failure in male mice lacking an X-linked factor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "TEX11 interacts with SYCP2, which is an integral component of the synaptonemal complex lateral elements."
    explanation: >-
      Supplies the physical interaction that links TEX11 to the synaptonemal
      complex, and is the mechanistic bridge to the SYCP2-related entry.
  downstream:
  - target: Pachytene Checkpoint Elimination of Spermatocytes
    description: >-
      Asynapsed autosomes and unrepaired breaks activate the prophase checkpoint.
  - target: Meiosis I Nondisjunction in Escaping Spermatocytes
    description: >-
      Cells that pass the checkpoint still lack the chiasmata needed to segregate
      homologues.
- name: Pachytene Checkpoint Elimination of Spermatocytes
  biological_scale: CELLULAR
  conforms_to: "meiotic_prophase_failure#Pachytene Checkpoint Arrest and Germ Cell Apoptosis"
  description: >-
    Spermatocytes carrying asynapsed autosomes are removed by apoptosis at the
    pachytene stage. The selectivity matters: cells whose only asynapsed
    chromosomes are the sex chromosomes progress past this checkpoint, so the
    arrest is not a uniform block at one point but a filter that different cells
    fail at different stages.
  cell_types:
  - preferred_term: spermatocyte
    term:
      id: CL:0000017
      label: spermatocyte
  evidence:
  - reference: PMID:18316482
    reference_title: Meiotic failure in male mice lacking an X-linked factor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Specifically, TEX11-deficient spermatocytes with asynapsed autosomes undergo apoptosis at the pachytene stage, while those with only asynapsed sex chromosomes progress."
    explanation: >-
      Distinguishes which spermatocytes are eliminated at pachytene from those
      that escape, which is what makes the histology mixed rather than uniform.
  downstream:
  - target: Spermatogenic Arrest at Meiosis I
    description: >-
      Loss of the spermatocyte population prevents progression to spermatids.
- name: Meiosis I Nondisjunction in Escaping Spermatocytes
  biological_scale: CELLULAR
  description: >-
    Spermatocytes that survive the pachytene checkpoint carry too few crossovers
    to segregate their homologues, and undergo chromosome nondisjunction at the
    first meiotic division. These cells die too. This second, later loss is why
    TEX11 deficiency produces infertility rather than aneuploid offspring.
  evidence:
  - reference: PMID:18316482
    reference_title: Meiotic failure in male mice lacking an X-linked factor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "However, cells that survive the pachytene stage display chromosome nondisjunction at the first meiotic division, resulting in cell death and male infertility."
    explanation: >-
      Records the second point of cell loss and its consequence.
  downstream:
  - target: Spermatogenic Arrest at Meiosis I
    description: >-
      The escaping population is lost at the first division rather than maturing.
- name: Spermatogenic Arrest at Meiosis I
  biological_scale: TISSUE
  conforms_to: "meiotic_prophase_failure#Spermatogenic Arrest and Non-Obstructive Azoospermia"
  description: >-
    Germ cell loss at both points empties the seminiferous epithelium of
    post-meiotic cells. The histological diagnosis is meiotic arrest, and it is
    the pattern in which TEX11 variants are most concentrated: they were found in
    a substantially higher fraction of men whose biopsy showed meiotic arrest than
    of azoospermic men overall.
  evidence:
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, five of those TEX11 mutations were detected in 33 patients (15%) with azoospermia who received a diagnosis of azoospermia with meiotic arrest."
    explanation: >-
      Quantifies the concentration of TEX11 variants within the meiotic-arrest
      histologic subgroup, which is the tissue phenotype this node names.
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meiotic arrest in these patients resembled the phenotype of Tex11-deficient male mice."
    explanation: >-
      States the correspondence between the human tissue phenotype and the mouse
      model, which is what licenses the mouse-derived mechanism above.
  downstream:
  - target: Non-obstructive azoospermia
    description: >-
      No mature spermatozoa reach the ejaculate.
phenotypes:
- category: Reproductive
  name: Non-obstructive azoospermia
  description: >-
    Absence of spermatozoa in the ejaculate, with a testicular rather than
    obstructive cause. This is the presenting finding and is essentially
    universal in confirmed cases.
  phenotype_term:
    preferred_term: Azoospermia
    term:
      id: HP:0000027
      label: Azoospermia
  evidence:
  - reference: PMID:26136358
    reference_title: TEX11 is mutated in infertile men with azoospermia and regulates genome-wide recombination rates in mouse.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic screening of a large cohort of idiopathic infertile men reveals that TEX11 mutations, including frameshift and splicing acceptor site mutations, cause infertility in 1% of azoospermic men."
    explanation: >-
      Establishes azoospermia as the clinical phenotype and quantifies the
      TEX11 contribution to it.
- category: Reproductive
  name: Male infertility
  description: >-
    Infertility is the reason for presentation and the whole of the clinical
    burden. There is no systemic disease, no effect on virilisation, sexual
    function or life expectancy, and no phenotype in carrier women.
  phenotype_term:
    preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  evidence:
  - reference: PMID:18316482
    reference_title: Meiotic failure in male mice lacking an X-linked factor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "However, cells that survive the pachytene stage display chromosome nondisjunction at the first meiotic division, resulting in cell death and male infertility."
    explanation: >-
      Links the meiotic lesion to infertility as the outcome, in the model in
      which the mechanism was established.
genetic:
- name: TEX11
  notes: >-
    TEX11 sits at Xq13 and encodes a testis-restricted meiosis-specific protein,
    the mammalian orthologue of the yeast ZMM factor Zip4. The reported allele
    classes are splice-site and frameshift variants, missense variants, and a
    recurrent multi-exon deletion that removes 79 amino acids from the
    meiosis-specific SPO22 sporulation domain and was originally found by array
    comparative genomic hybridisation rather than by sequencing.

    Variant interpretation needs care here, and the field has published the
    reason. Missense TEX11 variants also occur in fertile men, so a missense
    change is not causal by virtue of being in this gene. The point has been
    tested directly rather than argued: of three human missense variants modelled
    in transgenic mice, only one behaved as a candidate infertility allele and
    two were non-causative. Truncating alleles are the class with consistent
    genotype-phenotype correspondence.
  gene_term:
    preferred_term: TEX11
    term:
      id: hgnc:11733
      label: TEX11
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  case_fractions:
  - population: Men with azoospermia, unselected
    case_fraction_percent: 2.4
    cohort_size: 289
    notes: >-
      Seven of 289 azoospermic men in the founding screen, against none of 384
      controls with normal sperm concentration.
    evidence:
    - reference: PMID:25970010
      reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These mutations, which occurred in 7 of 289 men with azoospermia (2.4%), were absent in 384 controls with normal sperm concentrations (P=0.003)."
      explanation: >-
        Gives the case fraction and its control comparison in the founding
        cohort.
  - population: Men with azoospermia and meiotic arrest on biopsy
    case_fraction_percent: 15.0
    cohort_size: 33
    notes: >-
      The histologic subgroup in which TEX11 variants concentrate, from the same
      screen.
    evidence:
    - reference: PMID:25970010
      reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notably, five of those TEX11 mutations were detected in 33 patients (15%) with azoospermia who received a diagnosis of azoospermia with meiotic arrest."
      explanation: >-
        Gives the case fraction within the meiotic-arrest histologic subgroup.
  - population: Men with idiopathic azoospermia, independent cohort
    case_fraction_percent: 1.0
    notes: >-
      An independent screen of a large idiopathic-infertility cohort.
    evidence:
    - reference: PMID:26136358
      reference_title: TEX11 is mutated in infertile men with azoospermia and regulates genome-wide recombination rates in mouse.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic screening of a large cohort of idiopathic infertile men reveals that TEX11 mutations, including frameshift and splicing acceptor site mutations, cause infertility in 1% of azoospermic men."
      explanation: >-
        Independent estimate of the TEX11 share of azoospermia.
  evidence:
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations, which occurred in 7 of 289 men with azoospermia (2.4%), were absent in 384 controls with normal sperm concentrations (P=0.003)."
    explanation: >-
      Case-control comparison establishing TEX11 variants as causal rather than
      incidental in azoospermia.
  - reference: PMID:26136358
    reference_title: TEX11 is mutated in infertile men with azoospermia and regulates genome-wide recombination rates in mouse.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Functional evaluation of three analogous human TEX11 missense mutations in transgenic mouse models identified one mutation (V748A) as a potential infertility allele and found two mutations non-causative."
    explanation: >-
      Refutes the general claim that a missense variant in TEX11 is pathogenic by
      virtue of being in this gene. Two of three tested were non-causative, which
      is why this entry states that variant classification cannot be assumed from
      gene identity alone.
histopathology:
- name: Meiotic arrest on testicular biopsy
  description: >-
    The discriminating histology is meiotic arrest with germ cells present, not
    germ cell aplasia. Spermatogenesis stops in meiosis I and post-meiotic cells
    are absent, while spermatogonia and early spermatocytes remain. In the
    founding series the human picture was explicitly matched to the arrest seen
    in Tex11-deficient mice, and TEX11 protein was absent from the same testes.
  evidence:
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, testes of patients who had azoospermia with TEX11 mutations had meiotic arrest and lacked TEX11 expression."
    explanation: >-
      Records the arrest histology together with absent TEX11 protein in the same
      specimens.
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meiotic arrest in these patients resembled the phenotype of Tex11-deficient male mice."
    explanation: >-
      Establishes the correspondence between the human histology and the mouse
      model.
  - reference: PMID:29661171
    reference_title: "A novel TEX11 mutation induces azoospermia: a case report of infertile brothers and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological analysis of testicular biopsy from both brothers revealed meiotic arrest and no post-meiotic round spermatids and mature spermatozoa were observed in the seminiferous tubules."
    explanation: >-
      Independent confirmation of the arrest histology in a second family, and
      states explicitly that post-meiotic cells are absent while germ cells
      themselves are not.
  notes: >-
    Focal Sertoli-cell-only tubules can coexist with arrested ones in the same
    biopsy, the pattern described as mixed testicular atrophy. A report naming
    Sertoli-cell-only tubules therefore does not exclude this diagnosis, and does
    not make the entity the same as the gene-less SPGFX1 concept discussed in
    notes. That mixed pattern follows from the mechanism rather than being an
    incidental observation: spermatocytes whose only asynapsed chromosomes are
    the sex chromosomes escape the pachytene checkpoint and are lost later, so
    different tubules arrest at different points.
diagnosis:
- name: Karyotype and Y-chromosome microdeletion analysis
  description: >-
    Both are exclusions and both come before gene-level testing. Karyotype rules
    out 47,XXY, the commonest chromosomal cause of non-obstructive azoospermia,
    and AZF microdeletion analysis rules out the Y-linked causes. A man with
    TEX11-related disease has a normal 46,XY karyotype and no AZF deletion, so
    the diagnosis is only reachable once these are clear.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  results: Normal 46,XY karyotype with no AZF microdeletion.
  evidence:
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "karyotyping and Y chromosome azoospermia factor (AZF) microdeletion analysis"
    explanation: >-
      Names the two exclusionary tests that precede gene-panel testing in the
      azoospermia workup.
- name: Testicular biopsy
  description: >-
    Biopsy establishes whether the histology is meiotic arrest, which is the
    pattern in which TEX11 variants concentrate. It is also where the
    interpretive trap sits, since focal Sertoli-cell-only tubules in a mixed
    picture can be mistaken for germ cell aplasia.
  diagnosis_term:
    preferred_term: testicular biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: Meiotic arrest, often with mixed testicular atrophy.
  evidence:
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, five of those TEX11 mutations were detected in 33 patients (15%) with azoospermia who received a diagnosis of azoospermia with meiotic arrest."
    explanation: >-
      Shows that the biopsy result is what concentrates the pre-test probability,
      since TEX11 variants are far commoner in the meiotic-arrest subgroup.
- name: TEX11 sequencing on a non-obstructive azoospermia gene panel
  description: >-
    Sequencing confirms the diagnosis, usually as part of a panel rather than as
    a single-gene test given the locus heterogeneity of meiotic-arrest
    azoospermia. Copy-number analysis matters here as well as sequencing, since
    the recurrent multi-exon deletion was originally found by array comparative
    genomic hybridisation and would be missed by exon sequencing alone.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: A hemizygous pathogenic TEX11 variant.
  evidence:
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnostic yield in our cohort was 6.1%"
    explanation: >-
      Gives the overall diagnostic yield of gene-panel testing in a large
      non-obstructive azoospermia cohort, which is the context in which a TEX11
      diagnosis is made.
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a 99-kb hemizygous loss on chromosome Xq13.2 that involved three TEX11 exons."
    explanation: >-
      The recurrent deletion allele, found by array comparative genomic
      hybridisation, which is why copy-number analysis belongs alongside
      sequencing.
animal_models:
- name: Tex11-deficient mouse
  species: Mouse
  genotype: Tex11 null
  publication: PMID:18316482
  description: >-
    The mouse in which the meiotic mechanism was established. It is the source of
    the asynapsis, crossover-reduction and two-stage cell-loss findings that this
    entry's pathophysiology chain rests on, and the founding human series
    explicitly matched patient histology to it.
  modeled_mechanisms:
  - target: Chromosomal Asynapsis and Reduced Crossover Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Establishes that TEX11 loss produces asynapsis together with reduced
      crossover formation, and the TEX11-SYCP2 interaction that links synapsis to
      recombination.
    limitations: >-
      The mechanism is established in mouse and inferred for human spermatocytes
      from cross-species conservation; no human cell assay of TEX11 function
      exists.
    evidence:
    - reference: PMID:18316482
      reference_title: Meiotic failure in male mice lacking an X-linked factor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of TEX11 function causes chromosomal asynapsis and reduced crossover formation, leading to elimination of spermatocytes, respectively, at the pachytene and anaphase I stages."
      explanation: >-
        Supports treating this model as informative for the asynapsis and
        crossover node.
  - target: Pachytene Checkpoint Elimination of Spermatocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Establishes which spermatocytes are eliminated at pachytene and which
      escape, which is what makes the human histology mixed rather than uniform.
    limitations: >-
      The stage-specific selectivity is a mouse observation; human biopsies show
      the mixed pattern it predicts but have not been used to test the
      chromosome-specific mechanism directly.
    evidence:
    - reference: PMID:18316482
      reference_title: Meiotic failure in male mice lacking an X-linked factor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM

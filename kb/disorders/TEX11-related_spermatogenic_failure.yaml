name: TEX11-related spermatogenic failure
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >-
  TEX11-related spermatogenic failure, X-linked spermatogenic failure 2, is an
  X-linked cause of non-obstructive azoospermia arising from hemizygous
  loss-of-function variants in TEX11. TEX11 is a meiosis-specific protein and the
  mammalian orthologue of the yeast ZMM factor Zip4. It forms discrete foci on
  synapsed meiotic chromosomes as a constituent of recombination nodules, and
  works within the ZZS complex alongside SHOC1 and SPO16 to couple synaptonemal
  complex assembly to the formation of class I crossovers. Losing it leaves
  programmed meiotic double-strand breaks unable to mature into crossovers, so
  homologous chromosomes fail to synapse fully; the affected spermatocytes are
  then eliminated at the pachytene stage, and those that escape undergo
  nondisjunction at the first meiotic division. Spermatogenesis therefore arrests
  in meiosis I, and the testicular histology is meiotic arrest rather than the
  uniform Sertoli-cell-only picture. Men present in adulthood at an infertility
  workup with azoospermia, a normal 46,XY karyotype and normal virilisation. The
  reported hormonal picture is that of primary testicular failure generally,
  isolated elevation of FSH with preserved testosterone and LH, but see notes:
  that profile is not curated as a phenotype here. TEX11 is among the most
  frequently identified single-gene causes of this histologic subtype, found in
  about 1 per cent of unselected azoospermic men and in a substantially larger
  fraction of those whose biopsy shows meiotic arrest.
notes: >-
  Nomenclature. This entry curates OMIM 309120 (SPGFX2), which is the
  TEX11-associated entity, and is bound to MONDO:0010647. It is not
  MONDO:0056795 (X-linked spermatogenic failure 1, OMIM 305700), which is a
  separate, pedigree-defined Sertoli-cell-only phenotype with no mapped causal
  gene, carrying the synonyms Del Castillo syndrome and germinal cell aplasia.
  The two are frequently conflated because the OMIM series numbers them
  consecutively and both are called X-linked spermatogenic failure. They are
  different diseases with different histology, and only this one has a molecular
  mechanism to curate.

  Histology, and a caution about the MONDO term one file over. The lesion here is
  meiotic arrest with germ cells present, not germ cell aplasia. Biopsies in
  reported TEX11 series often show mixed testicular atrophy, in which some
  tubules do look Sertoli-cell-only, so a report naming Sertoli-cell-only tubules
  does not exclude the diagnosis. It also does not make this entity the same as
  SPGFX1.

  Hormone profile, and why it is not curated. Elevated FSH with preserved
  testosterone and LH is the expected picture in primary testicular failure and
  is described for this disease in secondary literature. It is not modelled as a
  phenotype here because none of the sources cached for this entry states it for
  TEX11-related disease, and a targeted search for one returned nothing
  quotable. Binding HP:0008232 would need a reference fetched for that purpose;
  the claim is left in prose, attributed to the general pattern, rather than
  being given a binding it cannot support.

name: ACE-Related Renal Tubular Dysgenesis
creation_date: "2026-10-08T13:31:10Z"
category: Mendelian
synonyms:
- ACE related renal tubular dysgenesis
- RTD-ACE
- autosomal recessive renal tubular dysgenesis due to ACE deficiency
- renal tubular dysgenesis due to angiotensin-converting enzyme deficiency
description: >-
  ACE-related renal tubular dysgenesis is a severe, usually perinatally lethal
  autosomal recessive disorder of fetal kidney development caused by biallelic
  loss-of-function variants in ACE, which encodes angiotensin-converting enzyme.
  ACE is one of four components of the renin-angiotensin system whose biallelic
  inactivation causes renal tubular dysgenesis, the others being REN, AGT and
  AGTR1; across reported families ACE variants are the most frequent cause. The
  disorder is defined histologically by the absence or poor development of
  differentiated proximal tubules and clinically by early and persistent fetal
  anuria leading to oligohydramnios and the Potter sequence, skull ossification
  defects, and severe refractory arterial hypotension. The unifying mechanism is
  hemodynamic rather than morphogenetic: loss of ACE catalytic activity prevents
  conversion of angiotensin I to the vasopressor angiotensin II, producing
  chronically low fetal renal perfusion pressure that arrests proximal tubule
  differentiation, with a compensatory surge of renal renin. The same phenotype
  can be acquired through fetal exposure to renin-angiotensin blockers or through
  fetal hypoperfusion (twin-twin transfusion donor), which are differential
  diagnoses rather than causes of this genetic disease. Most affected fetuses die
  in utero or in the neonatal period, but intensive neonatal blood pressure
  support and renal replacement therapy have produced long-term survivors who
  develop chronic kidney disease and an anemia out of proportion to their renal
  failure.

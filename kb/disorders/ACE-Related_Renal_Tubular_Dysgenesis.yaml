    explanation: The diagnostic biochemical pattern.
- name: Clinical and imaging suspicion
  description: >-
    Renal tubular dysgenesis should be suspected in a neonate with renal failure,
    refractory hypotension, respiratory failure from pulmonary hypoplasia,
    noncystic echogenic kidneys with poor corticomedullary differentiation, and
    an antenatal history of oligohydramnios.

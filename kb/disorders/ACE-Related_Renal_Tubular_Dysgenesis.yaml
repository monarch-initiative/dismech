progression:
- phase: Fetal onset
  notes: >-
    Anuria and oligohydramnios are detectable from the second trimester; severe
    proximal tubule defects are present from 18 gestational weeks onward.
  evidence:
  - reference: PMID:16790508
    reference_title: "Renal tubular dysgenesis, a not uncommon autosomal recessive disorder leading to oligohydramnios: Role of the Renin-Angiotensin system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe defects in proximal tubules were observed in all fetuses from 18 gestational weeks onward, and lesions also involved other tubular segments."
    explanation: Establishes the fetal onset of the renal lesion.
- phase: Neonatal
  notes: >-
    Acute decompensation at birth with refractory hypotension, anuria and
    respiratory failure; most deaths occur in utero or within days of birth.
  evidence:
  - reference: PMID:23636579
    reference_title: Renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In most cases, early death occurs from pulmonary hypoplasia, anuria and refractory arterial hypotension."
    explanation: The lethal neonatal course.
- phase: Survivor chronic kidney disease
  notes: >-
    Survivors of the neonatal period develop progressive chronic kidney disease,
    often reaching end-stage disease at a young age, with disproportionate anemia
    and a urinary concentrating defect.
  evidence:
  - reference: PMID:32198635
    reference_title: "Bi-allelic mutations in renin-angiotensin system genes, associated with renal tubular dysgenesis, can also present as a progressive chronic kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic loss of function mutation of ACE can have atypical and sometimes late presentation with chronic renal failure, anemia (out of proportion with the level of renal failure), and polyuro-polydipsia."
    explanation: The survivor chronic kidney disease course.

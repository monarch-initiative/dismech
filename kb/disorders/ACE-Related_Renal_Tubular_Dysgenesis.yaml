animal_models:
- name: Ace-null mouse
  species: Mouse
  genotype: Ace knockout (homozygous for a targeted null allele lacking both ACE isozymes)
  description: >-
    Ace-null mice have markedly reduced blood pressure and severe renal disease
    with a reduced renal papilla and intrarenal arterial hyperplasia. They model
    the hypotension and renal vascular lesion of the disorder but not the full
    lethal human phenotype of persistent anuria, proximal tubule arrest and skull
    defects, a species difference attributed to differences in the timing of
    nephrogenesis and renin-angiotensin maturation.
  publication: PMID:8642790
  modeled_mechanisms:
  - target: Loss of Angiotensin II Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Recapitulates the hypotension and renal vascular lesion of renin-angiotensin loss.
    limitations: >-
      The mouse lesion is a reduced renal papilla with vascular hyperplasia
      rather than the human proximal tubule differentiation arrest; mice do not
      reproduce persistent anuria or skull ossification defects, attributed to
      differences between mice and humans in the timing of nephrogenesis and
      renin-angiotensin maturation.
    evidence:
    - reference: PMID:8642790
      reference_title: "Mice lacking angiotensin-converting enzyme have low blood pressure, renal pathology, and reduced male fertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous mutant mice also have severe renal disease. The renal papilla is markedly reduced, and the intrarenal arteries exhibit vascular hyperplasia associated with a perivascular inflammatory infiltrate."
      explanation: The renal and vascular phenotype of the Ace-null mouse.
  evidence:
  - reference: PMID:8642790
    reference_title: "Mice lacking angiotensin-converting enzyme have low blood pressure, renal pathology, and reduced male fertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for this mutant allele lack both ACE isozymes and have markedly reduced blood pressures."
    explanation: Establishes the Ace-null mouse as a hypotension model.
  - reference: PMID:19924102
    reference_title: "Renin-angiotensin system in kidney development: renal tubular dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The less severe phenotype in mice devoid of RAS may be linked to differences between mice and humans in the time of nephrogenesis and maturation of the RAS."
    explanation: Explains why mouse models under-recapitulate the human disease.
experimental_models:
- name: RAAS-deficient iPSC-derived kidney organoids
  experimental_model_type: ORGANOID
  description: >-
    ACE-null, AGTR1-null and patient-derived induced pluripotent stem cell kidney
    organoids generate proximal tubules indistinguishable from controls in vitro,
    and the proximal tubule dysgenesis emerges only after transplantation as a
    non-autonomous consequence of delayed angiogenesis. This supports the
    hemodynamic perfusion model and highlights that in vitro organoids do not
    reproduce the human lesion without a vascular context.
  modeled_mechanisms:
  - target: Arrest of Proximal Tubule Differentiation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Mutant organoids form normal proximal tubules in vitro, failing to
      reproduce the human proximal tubule arrest without a vascular compartment.
    limitations: >-
      In vitro organoids lack a vascular and perfusion compartment, so the
      proximal tubule defect does not appear until transplantation; the observed
      engraftment failure is an angiogenesis defect studied in AGTR1-null rather
      than ACE-null organoids.
    evidence:
    - reference: PMID:38071212
      reference_title: RAAS-deficient organoids indicate delayed angiogenesis as a possible cause for autosomal recessive renal tubular dysgenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "both mutant and control organoids generate indistinguishable PT in vitro under normoxic (21% O2) or hypoxic (2% O2) conditions"
      explanation: Mutant organoids do not reproduce the tubular lesion in vitro.
  evidence:
  - reference: PMID:38071212
    reference_title: RAAS-deficient organoids indicate delayed angiogenesis as a possible cause for autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose that PT dysgenesis in AR-RTD is primarily a non-autonomous consequence of delayed angiogenesis, starving PT at a critical time in their development."
    explanation: The organoid model supports a perfusion and angiogenesis mechanism for the tubular defect.
differential_diagnoses:
- name: Renal tubular dysgenesis due to REN, AGT or AGTR1 variants
  description: >-
    The same clinically indistinguishable disorder caused by biallelic variants
    in the other three renin-angiotensin genes. Severity is similar whichever
    gene is mutated. REN defects can show absent rather than elevated renal
    renin, whereas ACE, AGT and AGTR1 defects show markedly increased renin.
  disease_term:
    preferred_term: renal tubular dysgenesis of genetic origin
    term:
      id: MONDO:0009970
      label: renal tubular dysgenesis of genetic origin
  distinguishing_features:
  - Pattern of renal renin expression (absent in some REN defects, markedly increased in ACE, AGT and AGTR1 defects)
  - Identification of the causal gene by sequencing
  evidence:
  - reference: PMID:22095942
    reference_title: Spectrum of mutations in the renin-angiotensin system genes in autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of the clinical course was similar whatever the mutated gene"
    explanation: The gene-specific forms are clinically similar and so are differentials of one another.
- name: Drug-related (acquired) renal tubular dysgenesis
  description: >-
    An acquired phenocopy from fetal exposure to renin-angiotensin blockers
    (ACE inhibitors, angiotensin receptor blockers) or NSAIDs, distinguished by
    a maternal drug exposure history and the absence of biallelic
    renin-angiotensin gene variants.
  disease_term:
    preferred_term: drug-related renal tubular dysgenesis
    term:
      id: MONDO:0019985
      label: drug-related renal tubular dysgenesis
  distinguishing_features:
  - Maternal use of ACE inhibitors, angiotensin receptor blockers or NSAIDs in pregnancy
  - No biallelic renin-angiotensin gene variant
  evidence:
  - reference: PMID:35848000
    reference_title: Late Preterm Infant With Postnatal Diagnosis of Renal Tubular Dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired cases have been described in the setting of in utero exposure to medications such as nonsteroidal anti-inflammatory medications (NSAIDs) and ACE inhibitors."
    explanation: Defines the acquired drug-related phenocopy.
- name: Renal tubular dysgenesis due to twin-twin transfusion
  description: >-
    An acquired form in the donor twin of twin-twin transfusion syndrome, where
    fetal hypoperfusion produces the identical tubular lesion.
  disease_term:
    preferred_term: renal tubular dysgenesis due to twin-twin transfusion
    term:
      id: MONDO:0019984
      label: renal tubular dysgenesis due to twin-twin transfusion
  distinguishing_features:
  - Monochorionic twin pregnancy with the donor affected
  - No causal gene variant
  evidence:
  - reference: PMID:9841703
    reference_title: Renal tubular dysgenesis in twin-twin transfusion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest that hypoperfusion leading to decreased glomerular filtration is the underlying etiology, with the severity of RTD related to the degree of shunting."
    explanation: Twin-twin transfusion produces the same lesion through hypoperfusion.
- name: Autosomal recessive polycystic kidney disease
  description: >-
    A major differential for fetal oligohydramnios with enlarged echogenic
    kidneys, distinguished because its kidneys are cystic and more markedly
    enlarged, whereas renal tubular dysgenesis kidneys are noncystic with poor
    corticomedullary differentiation.
  disease_term:
    preferred_term: autosomal recessive polycystic kidney disease
    term:
      id: MONDO:0009889
      label: autosomal recessive polycystic kidney disease
  distinguishing_features:
  - Cystic, markedly enlarged hyperechogenic kidneys versus noncystic kidneys in RTD
  evidence:
  - reference: PMID:35848000
    reference_title: Late Preterm Infant With Postnatal Diagnosis of Renal Tubular Dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "large, cystic, hyperechogenic renal masses suggest ARPKD"
    explanation: ARPKD kidneys are cystic, unlike the noncystic kidneys of RTD.
- name: RMND1-related RTD-like mitochondrial disease
  description: >-
    A mitochondrial phenocopy from biallelic RMND1 variants presenting with an
    RTD-like fetal kidney failure but with low renin expression and an oxidative
    phosphorylation defect, rather than the high-renin biochemical signature of
    the renin-angiotensin gene forms.
  distinguishing_features:
  - Low renal renin expression rather than high renin
  - Mitochondrial oxidative phosphorylation defect, no renin-angiotensin gene variant
  evidence:
  - reference: PMID:40366408
    reference_title: Genome sequencing identifies RMND1 as a strong candidate gene for severe prenatal kidney failure mimicking renal tubular dysgenesis associated with hyporeninism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a case presenting with RTD-like phenotype with low renin expression but without identified RAS disease-causing variant"
    explanation: Distinguishes the RMND1 phenocopy by its low renin and mitochondrial basis.

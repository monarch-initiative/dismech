pathophysiology:
- name: Biallelic ACE Loss-of-Function Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Germline homozygous or compound heterozygous loss-of-function variants in
    ACE, including nonsense, frameshift, canonical splice-site and inactivating
    missense alleles distributed across the gene. The initiating lesion of the
    ACE subtype of renal tubular dysgenesis.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic, germline. Truncating alleles behave as biochemical nulls;
      some missense alleles retain partial function and are associated with
      milder courses and longer survival.
  downstream:
  - target: Loss of ACE Peptidyl-Dipeptidase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16116425
    reference_title: Mutations in genes in the renin-angiotensin system are associated with autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they had homozygous or compound heterozygous mutations in the genes encoding renin, angiotensinogen, angiotensin converting enzyme or angiotensin II receptor type 1"
    explanation: Establishes that biallelic ACE variants, among the four renin-angiotensin genes, cause the disorder.
  - reference: PMID:22095942
    reference_title: Spectrum of mutations in the renin-angiotensin system genes in autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACE mutations are the most frequent, observed in two-thirds of families (64.6%)"
    explanation: ACE is the most frequently mutated of the four causal genes.
- name: Loss of ACE Peptidyl-Dipeptidase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Angiotensin-converting enzyme is a zinc metallopeptidase (peptidyl-dipeptidase
    A) that removes the C-terminal dipeptide from angiotensin I. Biallelic
    loss-of-function abolishes this catalytic activity; the complete absence of
    cell-surface ACE is incompatible with postnatal life.
  genes:
  - preferred_term: ACE
    term:
      id: hgnc:2707
      label: ACE
  molecular_functions:
  - preferred_term: ACE peptidyl-dipeptidase activity
    modifier: DECREASED
    term:
      id: GO:0008241
      label: peptidyl-dipeptidase activity
  downstream:
  - target: Failure of Angiotensin II Generation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24163131
    reference_title: Absence of cell surface expression of human ACE leads to perinatal death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Angiotensin I-converting enzyme (ACE; peptidyl-dipeptidase A) is a metallopeptidase which belongs to the gluzincin family of metalloproteases."
    explanation: Identifies ACE as a peptidyl-dipeptidase, the molecular activity lost in this subtype.
  - reference: PMID:24163131
    reference_title: Absence of cell surface expression of human ACE leads to perinatal death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "ACE cleaves the C-terminal His-Leu dipeptide from angiotensin I (Ang I) to produce the potent vasopressor octapeptide, Ang II."
    explanation: Describes the catalytic reaction whose loss removes angiotensin II generation.
  - reference: PMID:24163131
    reference_title: Absence of cell surface expression of human ACE leads to perinatal death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the total absence of cell surface expression of ACE is incompatible with life"
    explanation: Cell-trafficking study showing that fully absent membrane ACE causes perinatal death.
- name: Failure of Angiotensin II Generation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Without ACE activity, angiotensin I is not converted to angiotensin II, so
    the active effector of the renin-angiotensin system is absent or markedly
    reduced.
  biological_processes:
  - preferred_term: angiotensin maturation
    modifier: DECREASED
    term:
      id: GO:0002003
      label: angiotensin maturation
  downstream:
  - target: Loss of Angiotensin II Signaling
    causal_link_type: DIRECT
  - target: Compensatory Renin Hypersecretion
    causal_link_type: DIRECT
  - target: Loss of Angiotensin II-Driven Erythropoietin Regulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23636579
    reference_title: Renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations result in either the absence of production or lack of efficacy of angiotensin II."
    explanation: The shared endpoint of all renin-angiotensin gene defects is absent or ineffective angiotensin II.
- name: Loss of Angiotensin II Signaling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Absent angiotensin II removes angiotensin II receptor type 1 signaling,
    abolishing the systemic vasopressor drive and the regulation of arterial
    blood pressure and renal blood flow normally supplied by the renin-angiotensin
    system. Aldosterone production falls because its angiotensin II stimulus is
    lost.
  biological_processes:
  - preferred_term: angiotensin-activated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038166
      label: angiotensin-activated signaling pathway
  - preferred_term: regulation of systemic arterial blood pressure by renin-angiotensin
    modifier: DECREASED
    term:
      id: GO:0003081
      label: regulation of systemic arterial blood pressure by renin-angiotensin
  downstream:
  - target: Chronic Fetal Renal Hypoperfusion
    causal_link_type: DIRECT
  - target: Refractory arterial hypotension
    causal_link_type: DIRECT
  - target: Decreased circulating aldosterone concentration
    causal_link_type: DIRECT
  - target: Microcolon
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30071301
      reference_title: "Renal tubular dysgenesis and microcolon, a novel association. Report of three cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The severe intestinal developmental abnormality culminating in microcolon and early terminal ileum perforation/necrotizing enterocolitis is a novel finding not previously associated with RTD, which points to a role of the renin-angiotensin system in gut development."
      explanation: Links loss of renin-angiotensin signaling to the intestinal developmental defect, an inferred role.
  evidence:
  - reference: PMID:35286024
    reference_title: "Expanding the clinical spectrum of autosomal-recessive renal tubular dysgenesis: Two siblings with neonatal survival and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Angiotensin II regulates blood pressure by increasing renal sodium reabsorption at the proximal tubule, by stimulating the production of aldosterone by the adrenal cortex, and by stimulating the release of vasopressin in the posterior pituitary"
    explanation: Describes the angiotensin II actions lost, including aldosterone and vasopressin release.
- name: Compensatory Renin Hypersecretion
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Absent angiotensin II removes the negative feedback on renin-producing
    juxtaglomerular granular cells, which are intensely stimulated. Renal renin
    expression is strikingly increased, producing the markedly elevated plasma
    renin that, with undetectable ACE, is the biochemical fingerprint of the ACE
    subtype.
  cell_types:
  - preferred_term: juxtaglomerular granular (renin-producing) cell
    term:
      id: CL:0000648
      label: kidney granular cell
  biological_processes:
  - preferred_term: renin secretion into blood stream
    modifier: INCREASED
    term:
      id: GO:0002001
      label: renin secretion into blood stream
  downstream:
  - target: Increased circulating renin concentration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16790508
    reference_title: "Renal tubular dysgenesis, a not uncommon autosomal recessive disorder leading to oligohydramnios: Role of the Renin-Angiotensin system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal renin expression was strikingly increased in 19 of 24 patients studied"
    explanation: Documents the compensatory increase in renal renin in affected patients.
- name: Chronic Fetal Renal Hypoperfusion
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Absent angiotensin II lowers fetal renal perfusion pressure and glomerular
    filtration. This hemodynamic failure, rather than a morphogenic property of
    the renin-angiotensin system, is proposed to be the proximate cause of the
    renal lesions, as shown by the identical lesions in acquired hypoperfusion
    states.
  biological_processes:
  - preferred_term: glomerular filtration
    modifier: DECREASED
    term:
      id: GO:0003094
      label: glomerular filtration
  downstream:
  - target: Arrest of Proximal Tubule Differentiation
    causal_link_type: DIRECT
  - target: Renal Arterial Wall Thickening
    causal_link_type: DIRECT
  - target: Persistent Fetal Anuria
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16116425
    reference_title: Mutations in genes in the renin-angiotensin system are associated with autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that renal lesions and early anuria result from chronic low perfusion pressure of the fetal kidney, a consequence of renin-angiotensin system inactivity"
    explanation: States the central hemodynamic mechanism linking renin-angiotensin inactivity to the renal lesions and anuria.
  - reference: PMID:19924102
    reference_title: "Renin-angiotensin system in kidney development: renal tubular dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The absence or poor development of proximal tubules, as well as renal vascular changes, may be attributable to renal hypoperfusion rather than to a morphogenic property of the RAS."
    explanation: Attributes both the tubular and vascular lesions to hypoperfusion.
- name: Arrest of Proximal Tubule Differentiation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Chronic low perfusion precludes the normal development and differentiation of

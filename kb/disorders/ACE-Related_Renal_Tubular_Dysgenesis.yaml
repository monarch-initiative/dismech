discussions:
- discussion_id: rtd_ace_skull_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Decreased calvarial ossification
  prompt: >-
    What is the molecular basis of the calvarial ossification defect, and is it a
    direct consequence of lost angiotensin II signaling or of chronic fetal
    hypoperfusion and hypoxia of membranous bone?
  rationale: >-
    The skull ossification defect is a cardinal feature across the
    renin-angiotensin gene forms and is shared with ACE-inhibitor fetopathy, but
    its molecular basis is inferred rather than demonstrated. The leading
    explanation is that membranous calvarial bone requires high oxygen tension and
    is damaged by the persistent fetal and neonatal hypotension, which parallels
    the drug-induced phenocopy; a direct developmental role of angiotensin
    signaling has not been excluded.
  evidence:
  - reference: PMID:26069751
    reference_title: Survival over 2 years of autosomal-recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hypocalvaria is also the consequence of low blood pressure because skull membranous bones require high oxygen tension for normal growth"
    explanation: States the leading, inferred mechanism for the skull defect.
- discussion_id: rtd_ace_organoid_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Arrest of Proximal Tubule Differentiation
  prompt: >-
    Why do ACE-null and patient iPSC kidney organoids form normal proximal
    tubules in vitro when the human disease is defined by proximal tubule arrest,
    and what model faithfully reproduces the human lesion?
  rationale: >-
    Mutant organoids generate proximal tubules indistinguishable from controls in
    vitro, and the defect appears only after transplantation, interpreted as a
    non-autonomous consequence of delayed angiogenesis. Mouse renin-angiotensin
    knockouts likewise under-recapitulate the lethal human phenotype. The lesion
    therefore appears to require the in vivo perfusion context that current in
    vitro and rodent models only partly provide.
  evidence:
  - reference: PMID:38071212
    reference_title: RAAS-deficient organoids indicate delayed angiogenesis as a possible cause for autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "both mutant and control organoids generate indistinguishable PT in vitro under normoxic (21% O2) or hypoxic (2% O2) conditions"
    explanation: The in vitro organoid does not reproduce the human tubular lesion.
notes: >-
  ACE-related renal tubular dysgenesis is the ACE subtype of a genetically
  heterogeneous disorder; the REN, AGT and AGTR1 forms are clinically
  indistinguishable and are listed as differentials rather than as separate
  mechanisms. The acquired forms (fetal renin-angiotensin blocker exposure,
  twin-twin transfusion) are phenocopies and are modeled as differential
  diagnoses, not as environmental causes of this genetic disease. The skull
  ossification defect and the survivor anemia are mechanistically inferred rather
  than demonstrated and are recorded as provisional edges and a knowledge gap.
  The ClinGen gene-disease validity record cited here was rebuilt from a ClinGen
  gene_validity CSV snapshot dated 2026-10-04, which is newer than the release
  pinned in the repository manifest (known issue dismech#13575). No GeneReviews
  chapter exists for this disease (check-genereviews returned NO_CHAPTER against
  the committed Bookshelf index and on a live PubMed title search).

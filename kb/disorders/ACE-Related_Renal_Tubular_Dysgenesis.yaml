genetic:
- name: ACE
  gene_term:
    preferred_term: ACE
    term:
      id: hgnc:2707
      label: ACE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic loss-of-function variants in ACE cause the ACE subtype of renal
    tubular dysgenesis and are the most frequent cause of the disorder overall.
    Reported alleles include nonsense, frameshift, canonical splice-site and
    inactivating missense variants across the gene. Biallelic truncating variants
    carry a lower survival rate than genotypes with at least one non-truncating
    allele, so genotype contributes to prognosis although it does not fully
    predict it.
  case_fractions:
  - population: Series of 48 unrelated autosomal recessive renal tubular dysgenesis families
    case_fraction_percent: 64.6
    cohort_size: 48
    notes: ACE is the most frequently mutated of the four renin-angiotensin genes causing RTD.
    evidence:
    - reference: PMID:22095942
      reference_title: Spectrum of mutations in the renin-angiotensin system genes in autosomal recessive renal tubular dysgenesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ACE mutations are the most frequent, observed in two-thirds of families (64.6%)"
      explanation: Quantifies the ACE share of causal families.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_14a5efd4-d71f-40b1-91ff-90f7f8d63ec7-2024-12-11T170000.000Z
    evidence:
    - reference: CGGV:assertion_14a5efd4-d71f-40b1-91ff-90f7f8d63ec7-2024-12-11T170000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ACE | HGNC:2707 | renal tubular dysgenesis - ACE | MONDO:0700337 | AR | Definitive"
      explanation: ClinGen Prenatal Gene Curation Expert Panel classifies the ACE-RTD relationship as Definitive.
  evidence:
  - reference: PMID:40709124
    reference_title: A Premature Infant With Renal Tubular Dysgenesis Who Survived 61 Days With Anuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival was significantly lower among patients with biallelic truncating mutations (8.6%) compared to those with at least one non-truncating allele."
    explanation: Supports a genotype contribution to prognosis.
  - reference: PMID:30058238
    reference_title: Exome sequencing identifies novel ACE splice-site variant in a fetus with renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous novel 3' splice-site variation in intron 17 of the ACE gene (NM_000789.3:c.2642-1G>A), confirming diagnosis of autosomal recessive renal tubular dysgenesis"
    explanation: A homozygous canonical splice-site ACE variant confirmed the diagnosis prenatally.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal tubular dysgenesis should be suspected in any neonate presenting with renal failure, refractory hypotension, ventilator requirement, hypoplastic lungs, renal ultrasound showing normal-sized echogenic noncystic kidneys with poor corticomedullary differentiation, and antenatal history significant for oligohydramnios."
    explanation: The clinical presentation prompting diagnostic work-up.

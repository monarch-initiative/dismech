classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The clinical burden is overwhelmingly neurodevelopmental: global developmental
      delay, severe to profound intellectual disability, absent or poor speech,
      hypotonia, epilepsy and microcephaly. The pigmentary, growth, ocular and
      skeletal findings are additional syndromic features rather than the dominant
      morbidity.
    evidence:
    - reference: PMID:34415064
      reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical picture was dominated by global developmental delay, epilepsy,
        hypotonia and microcephaly.
      explanation: >-
        The largest published cohort states directly that the phenotype is dominated
        by neurological features, supporting a neurologic chapter assignment.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A monogenic autosomal recessive Mendelian disorder recognised and diagnosed
      through exome or genome sequencing rather than through a clinical gestalt.
    evidence:
    - reference: PMID:34415064
      reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In conclusion, homozygous and compound heterozygous PUS3 variants lead to a
        rare neurodevelopmental disorder.
      explanation: >-
        States the monogenic biallelic genetic basis of the disorder.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires two damaging PUS3 alleles. Both homozygous genotypes, typically
    in consanguineous families, and compound heterozygous genotypes occur; carrier
    parents are unaffected. Recurrence risk for the sibling of an affected proband is
    25 percent, so carrier testing and genetic counselling are indicated for at-risk
    relatives.
  evidence:
  - reference: PMID:41971559
    reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic pathogenic variants cause a rare autosomal recessive
      neurodevelopmental disorder characterized by intellectual disability,
      microcephaly, hypotonia, and gray sclera.
    explanation: >-
      States the autosomal recessive mode and the biallelic requirement at the PUS3
      locus.
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, homozygous and compound heterozygous PUS3 variants lead to a
      rare neurodevelopmental disorder.
    explanation: >-
      Documents that both homozygous and compound heterozygous biallelic genotypes
      cause the disorder, the defining pattern of autosomal recessive inheritance.
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a multiplex consanguineous family, we applied autozygosity mapping and exome
      sequencing and identified a novel homozygous truncating mutation in PUS3 that
      fully segregates with the intellectual disability phenotype.
    explanation: >-
      Autozygosity mapping in a consanguineous multiplex family with full segregation
      of a homozygous allele is the classic demonstration of autosomal recessive
      inheritance.
prevalence:
- population: Worldwide reported literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence study exists for this disorder, and
    no Orphanet prevalence band is adopted here because the Orphadata bulk refresh is
    currently failing its manifest checksum and no ORPHA_488627 cache record exists to
    quote. The published case count is therefore the only defensible measure. The
    2021 multicentre delineation pooled 21 individuals; the 2026 Turkish case report
    states that fewer than thirty individuals have been reported in total. Cases have
    come from Saudi, Jordanian, Emirati, Brazilian, Chinese, Italian, Turkish,
    Ukrainian and other European families, so there is no established founder
    population.
  evidence:
  - reference: PMID:41971559
    reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fewer than thirty individuals have been reported, including only five carrying
      the recurrent c.212A>G (p.Tyr71Cys) variant.
    explanation: >-
      Gives the cumulative worldwide published case count as of 2026, which places
      the disorder in the ultra-rare band.
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present the clinical and genetic features of 21 individuals with
      biallelic PUS3 variants: seven new and 14 previously reported individuals,
      where clinical features of two were updated.
    explanation: >-
      Supplies the intermediate published case count from the largest pooled cohort.
pathophysiology:
- name: Biallelic PUS3 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    The disorder is initiated by inheritance of two damaging PUS3 alleles. The
    reported allelic spectrum is broad and includes nonsense alleles that truncate
    the protein (the founding p.Arg435* allele), frameshift alleles, a splice-region
    allele, an initiation-codon substitution, and missense alleles. Critically, the
    missense alleles are not a milder mechanistic class: p.Tyr71Cys retains
    essentially normal tRNA binding and catalytic activity when the purified protein
    is assayed, yet behaves as a functional null in cells, so the allelic spectrum
    converges on one outcome rather than producing a hypomorph gradient.
  genes:
  - preferred_term: PUS3
    term:
      id: hgnc:25461
      label: PUS3
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a homozygous nonsense variant in PUS3; Chr11(GRCh37):g.125763823G>A;
      NM_031307.3: c.1303C>T: p.(Arg435*) that fully segregated with the phenotype in
      the family as confirmed by Sanger sequencing
    explanation: >-
      Establishes the founding biallelic protein-truncating allele as the initiating
      lesion.
  - reference: PMID:36125428
    reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we utilize exome sequencing to identify genomic variants that lead to a
      homozygous amino acid substitution
    explanation: >-
      Documents the missense arm of the allelic spectrum, identified by exome
      sequencing in two homozygous individuals and one compound heterozygote. The
      quoted fragment stops before the HGVS allele strings because their square
      brackets are not preserved in the cached reference text.
  downstream:
  - target: Loss of PUS3 Pseudouridine Synthase Activity
    description: >-
      Truncating alleles remove the enzyme outright, while the studied missense
      alleles deplete it post-translationally, so both arms of the allelic spectrum
      converge on loss of available PUS3 activity in the cell.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36125428
      reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we observe that the PUS3 protein levels as well as the level of
        PUS3-dependent Ψ levels are strongly reduced in fibroblasts derived from all
        three patients.
      explanation: >-
        Directly links patient PUS3 alleles to depletion of the enzyme and of its
        catalytic product in patient-derived cells.
- name: Loss of PUS3 Pseudouridine Synthase Activity
  biological_scale: MOLECULAR
  description: >-
    PUS3 is a stand-alone, guide-RNA-independent pseudouridine synthase of the
    TruA/Pus3 family that isomerises uridine to pseudouridine in the anticodon stem
    loop of cytosolic tRNAs. Cryo-EM shows it acts as a symmetric homodimer that
    clamps the tRNA and presents the target uridine to its active site. Two distinct
    routes destroy that activity in patients: outright absence of the protein from
    truncating alleles, and post-translational depletion from missense alleles that
    impair thermostability (p.Tyr71Cys) or promote aggregation (p.Ile299Thr).
  molecular_functions:
  - preferred_term: tRNA pseudouridine synthase activity
    term:
      id: GO:0106029
      label: tRNA pseudouridine synthase activity
    modifier: DECREASED
  - preferred_term: pseudouridine synthase activity
    term:
      id: GO:0009982
      label: pseudouridine synthase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:38996458
    reference_title: "The molecular basis of tRNA selectivity by human pseudouridine synthase 3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human pseudouridine synthase 3 (PUS3) catalyzes pseudouridylation of position
      38/39 in tRNAs.
    explanation: >-
      Identifies the enzyme and the exact catalytic reaction whose loss defines this
      node.
  - reference: PMID:38996458
    reference_title: "The molecular basis of tRNA selectivity by human pseudouridine synthase 3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we determine single-particle cryo-EM structures of PUS3 in its apo form
      and bound to three tRNAs, showing how the symmetric PUS3 homodimer recognizes
      tRNAs and positions the target uridine next to its active site.
    explanation: >-
      Supplies the structural basis for how the enzyme engages its substrate, and
      therefore what patient alleles disrupt.
  - reference: PMID:36125428
    reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we find that the p.Tyr71Cys substitution neither affect tRNA binding nor
      pseudouridylation activity in vitro, but strongly impair the thermostability
      profile of PUS3, while the p.Ile299Thr mutation causes protein aggregation.
    explanation: >-
      Establishes protein destabilisation and aggregation, rather than direct
      catalytic impairment, as the route by which missense alleles abolish activity.
  - reference: PMID:34713961
    reference_title: "PUS3-related disorder: Report of a novel patient and delineation of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PUS3 encodes the pseudouridylate synthase 3, an enzyme catalyzing the formation
      of tRNA pseudouridine, which plays a critical role in tRNA structure, function,
      and stability.
    explanation: >-
      States the gene product's enzymatic role and why its loss matters for tRNA.
  downstream:
  - target: Depletion of tRNA Pseudouridine at Anticodon Positions 38 and 39
    description: >-
      Loss of the only enzyme that installs pseudouridine at these two positions
      leaves the corresponding uridines unmodified in patient tRNA.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27055666
      reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Consistent with the known role of Pus3 in isomerizing uracil to pseudouridine
        at positions 38 and 39 in tRNA, we found a significant reduction in this
        post-transcriptional modification of tRNA in patient cells.
      explanation: >-
        Measures the loss of the specific modification directly in patient-derived
        cells carrying the disease allele.
- name: Depletion of tRNA Pseudouridine at Anticodon Positions 38 and 39
  biological_scale: MOLECULAR
  description: >-
    Pseudouridine at positions 38 and 39 sits in the anticodon stem loop, the part of
    the tRNA that pairs with the codon. Its extra imino group provides additional
    hydrogen bonding and rigidifies the loop, so its absence is expected to
    destabilise anticodon stem loop architecture. In the founding family the deficit
    was quantified as almost exactly one missing mole of pseudouridine per mole of
    tRNA-Phe, while every other measured modification of the same tRNA was unchanged,
    establishing that the lesion is specific to the PUS3 site rather than a general
    collapse of tRNA modification.
  biological_processes:
  - preferred_term: tRNA pseudouridine synthesis
    term:
      id: GO:0031119
      label: tRNA pseudouridine synthesis
    modifier: DECREASED
  - preferred_term: tRNA modification
    term:
      id: GO:0006400
      label: tRNA modification
    modifier: DECREASED
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Since tRNAPhe from LCLs with the Arg435* allele of PUS3 had almost exactly 1
      mole/mole less Ψ than control LCLs, we infer that the Arg435* allele nearly
      completely knocks out PUS3 function due to truncation of the conserved domain
      and the last 45 amino acids
    explanation: >-
      Quantifies the stoichiometric loss of one pseudouridine per tRNA molecule in
      patient cells.
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, the levels of the other modifications of tRNAPhe (Cm, Gm, m2G,
      m1A, m7G, and m5C) were all very similar in all of the LCLs including WT
    explanation: >-
      Shows the deficit is specific to the PUS3-dependent modification, excluding a
      generalised tRNA-modification failure.
  - reference: PMID:36125428
    reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      our results directly illustrate the link between the identified PUS3 variants
      and reduced Ψ levels in the patient cells, providing a molecular explanation
      for the observed clinical phenotypes.
    explanation: >-
      Independent replication in a second patient set and with a different allele
      class, closing the loop from genotype to reduced pseudouridine.
  downstream:
  - target: Impaired Translational Fidelity and Efficiency
    description: >-
      An unmodified, less rigid anticodon stem loop is the proposed proximate cause of
      degraded decoding at the ribosome. This step is an inference from tRNA biology
      and from orthologue work rather than a direct measurement in patient neurons,
      and it is flagged as such in the discussions section.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41971559
      reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PUS3 encodes a transfer RNA (tRNA) pseudouridine synthase essential for
        translational fidelity.
      explanation: >-
        States the accepted functional role of the enzyme in translational fidelity;
        marked PARTIAL because the statement is a review assertion rather than a
        measurement of translation in patient cells.
- name: Impaired Translational Fidelity and Efficiency
  biological_scale: CELLULAR
  description: >-
    Reduced anticodon-loop pseudouridylation is expected to degrade the accuracy and
    efficiency of protein synthesis. In lower organisms loss of the orthologous
    enzyme is clearly consequential: bacterial truA mutants grow poorly and yeast
    pus3-delta mutants are slow-growing and temperature-sensitive with reduced
    frameshifting fidelity. The corresponding measurement has not been made in human
    patient neurons, so this node is the weakest link in the chain.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Bacterial truA mutants have significant growth defects (Chang et al. 1971; Tsui
      et al. 1991), while S. cerevisiae pus3Δ mutants are slow growing and
      temperature-sensitive
    explanation: >-
      Orthologue evidence that loss of this specific pseudouridylation is
      physiologically consequential; tagged MODEL_ORGANISM because it is bacterial
      and yeast data, not human.
  - reference: PMID:38996458
    reference_title: "The molecular basis of tRNA selectivity by human pseudouridine synthase 3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our work provides the molecular basis for PUS3-mediated tRNA modification in
      humans and explains how its tRNA modification activity is linked to
      intellectual disabilities.
    explanation: >-
      The structural study frames the disease link as running specifically through
      the tRNA modification activity.
  - reference: PMID:38996458
    reference_title: "The molecular basis of tRNA selectivity by human pseudouridine synthase 3."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Although PUS1-dependent sites were detectable in tRNA and mRNA, we found no
      evidence that human PUS3 modifies mRNAs.
    explanation: >-
      Refutes a direct mRNA-pseudouridylation arm of the mechanism, constraining the
      pathograph to the tRNA route and excluding an mRNA-substrate node.
  downstream:
  - target: Neurodevelopmental Impairment
    description: >-
      The developing brain is disproportionately affected, which is the pattern shared
      across the tRNA-modification intellectual disability disorders and is attributed
      to a higher sensitivity of neural tissue to reduced translational efficiency.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27055666
      reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        it is possible that brain-specific phenotype reflects a higher sensitivity to
        reduced translational efficiency by the brain compared to other organs
      explanation: >-
        States the proposed reason the phenotype is brain-predominant despite wide
        tissue expression of PUS3.
- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. Despite wide tissue expression of PUS3, the phenotype is
    largely brain-predominant: global developmental delay, severe to profound
    intellectual disability, poor or absent speech, hypotonia, epilepsy, microcephaly
    and variable structural or white-matter brain abnormalities. Growth failure,
    pigmentary and ocular features accompany the neurological core in a subset. This
    places PUS3 alongside ADAT3, WDR4, NSUN2 and FTSJ1 in the family of
    tRNA-modification intellectual disability disorders.
  biological_processes:
  - preferred_term: central nervous system development
    term:
      id: GO:0007417
      label: central nervous system development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype we observe in the context of PUS3 deficiency is largely
      brain-specific.
    explanation: >-
      States the brain-predominant character of the clinical endpoint.
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our finding adds to a growing list of intellectual disability disorders that are
      caused by perturbation of various tRNA modifications, which highlights the
      sensitivity of the brain to these highly conserved processes.
    explanation: >-
      Places the disorder within the wider class of tRNA-modification intellectual
      disability disorders.
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical picture was dominated by global developmental delay, epilepsy,

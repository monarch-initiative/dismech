- name: Grey Sclerae
  category: Ophthalmologic
  description: >-
    Grey discoloration of the sclerae is the feature that gives the OMIM disease its
    name (neurodevelopmental disorder with microcephaly and gray sclerae). It was
    present in all three sisters of the founding family and is a genuinely useful
    diagnostic pointer, but the pooled cohort showed it is far from obligatory.
  frequency: FREQUENT
  notes: >-
    Derivation: 7/21 individuals in the Nostvik pooled cohort (33 percent), which sits
    just inside the FREQUENT band 30-79 percent. This is the one phenotype here with a
    directly quotable numerator and denominator. The Nostvik abstract explicitly warns
    that the feature is less characteristic than previously suggested, so its absence
    must not be used to exclude the diagnosis. The HPO term used is Pigmentation of
    the sclera, NOT Blue sclerae (HP:0000592) as the deep-research report suggested;
    blue sclerae denote the thin collagen-deficient sclerae of osteogenesis imperfecta
    and related connective tissue disorders, which is a mechanistically different
    sign from the melanocytic grey discoloration seen here.
  phenotype_term:
    preferred_term: Grey sclerae
    term:
      id: HP:0007832
      label: Pigmentation of the sclera
  evidence:

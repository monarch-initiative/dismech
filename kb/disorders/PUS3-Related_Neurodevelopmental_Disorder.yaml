    "Congenital heart defect" and "Congenital heart defects" as EXACT synonyms
    (alongside "Heart defect" and "Cardiac anomaly"), so the congenital semantics
    are present in the term even though its primary label reads "Abnormal heart
    morphology". Assigning a septal or valvular child term would assert a lesion the
    paper does not report.
  phenotype_term:
    preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:34713961
    reference_title: "PUS3-related disorder: Report of a novel patient and delineation of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel homozygous PUS3 frameshift variant in a child with facial
      dysmorphisms, growth failure, microcephaly, retinal dystrophy, cerebellar
      hypoplasia, congenital heart defect, and right kidney hypoplasia.
    explanation: >-
      Documents a congenital heart defect as part of the expanded severe syndromic
      presentation.
- name: Delayed Speech and Language Development
  category: Neurologic
  description: >-
    Speech is poor or absent in every individual for whom it has been assessed, and
    is disproportionately affected even against the background of global
    developmental delay. One child spoke first single words only at age eight.
  notes: >-
    Frequency deliberately omitted despite a very high reported rate. Speech
    impairment is documented in 11/11 assessed individuals (100 percent) in the
    Nostvik 2021 full text, which on its face maps to VERY_FREQUENT. That
    denominator sits in full text that is not cached here, and the pooled-cohort
    abstract does not mention speech at all, so there is no quotable snippet for
    either the association or the band. Per the frequency-evidence guidelines the
    band is omitted rather than asserted from an unquotable source, and the
    derivation is recorded here instead. This phenotype therefore carries no
    evidence block by design - the entry would otherwise silently drop a
    near-universal feature that clears any reporting threshold.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
- name: Motor Delay
  category: Neurologic
  description: >-
    Gross and fine motor milestones are delayed, and many individuals never achieve
    independent ambulation or achieve it only with assistance. Motor delay is closely
    tied to the generalised hypotonia and is part of the global developmental delay
    rather than a separable regression.
  notes: >-
    Frequency omitted for the same reason as the speech phenotype: motor delay is
    reported in 16/18 assessed individuals (88 percent) in the Nostvik 2021 full
    text, but that denominator is not quotable from the cached abstract and the
    abstract does not name motor delay separately from global developmental delay.
    No evidence block by design.
  phenotype_term:
    preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
- name: Scoliosis
  category: Skeletal
  description: >-
    Scoliosis, ranging from mild to severe, is a frequent finding and is the main
    reason orthopaedic surveillance belongs in the management plan. Whether it is a
    primary skeletal feature or secondary to hypotonia, neurological impairment and
    limited mobility is unresolved.
  notes: >-
    Frequency omitted. Scoliosis is reported in 8/10 assessed individuals (80
    percent) in the Nostvik 2021 full text, the highest rate of any non-core feature,
    but the denominator is not quotable from the cached abstract and scoliosis is not
    mentioned in the abstract at all, so no snippet-backed evidence item is possible
    and no band is asserted. Recorded as a phenotype rather than left buried in
    treatment prose because at that rate it is a real, surveillance-relevant feature
    of the disorder. No evidence block by design.
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
- name: Behavioral Abnormality
  category: Behavioral
  description: >-
    Behavioural disturbance is common and heterogeneous, reported as anxiety,
    attention disorder or aggression; autistic features have been noted in a subset
    of those formally assessed. There is no single characteristic behavioural
    signature, which distinguishes this disorder from the very-early-onset aggression
    that characterises PUS7 deficiency.
  notes: >-
    Frequency omitted. Behavioural features are reported in 11 of 19 individuals and
    autism-spectrum features in 4/6 of those specifically assessed, per the Nostvik
    2021 full text; neither denominator is quotable from the cached abstract. The
    broad HPO parent Atypical behavior is used deliberately because the reported
    behaviours are heterogeneous and no single sub-phenotype dominates. No evidence
    block by design.
  phenotype_term:
    preferred_term: Behavioral abnormality
    term:
      id: HP:0000708
      label: Atypical behavior
genetic:
- name: PUS3
  gene_term:
    preferred_term: PUS3
    term:
      id: hgnc:25461
      label: PUS3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PUS3 (11q24.2, gene MIM 616283) encodes a 481-amino-acid, guide-RNA-independent
    pseudouridine synthase of the TruA/Pus3 family that isomerises uridine to
    pseudouridine at positions 38 and 39 of the tRNA anticodon stem loop. The
    orthologous enzyme acts at U38/U39/U40 in bacteria (TruA), at U38 and U39 in
    S. cerevisiae, and preferentially at U39 in mouse. The reference transcript used
    in the clinical literature is NM_031307.

    Gene identity was verified against the MONDO gene-association relation
    (`RO:0004003 HGNC:25461 ! PUS3`) and against the HGNC record `hgnc:25461`, whose
    definition "pseudouridine synthase 3" cites PMID:27055666. This is deliberately
    distinct from the family members PUS1 (hgnc:15508), which causes myopathy with
    lactic acidosis and sideroblastic anaemia, and PUS7 (hgnc:26033), which causes a
    separate intellectual disability syndrome already curated in this knowledge base;
    see differential_diagnoses. Note also that MIM 616283 is the PUS3 GENE entry
    whereas MIM 617051 is the DISEASE entry that MONDO:0014886 cross-references.

    Reported allelic spectrum comprises roughly 17 distinct variants across the
    published cohort: eight missense, seven protein-truncating (three nonsense, two
    single-base deletions, two single-base duplications), one splice-region variant
    and one initiation-codon substitution. Both homozygous and compound heterozygous
    genotypes occur in approximately equal numbers.
  evidence:
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic variants in PUS3 have recently been recognized as a rare cause of
      neurodevelopmental disorders. Pseudouridine synthase-3 encoded by PUS3 is an
      enzyme important for modification of various RNAs, including transfer RNA
      (tRNA).
    explanation: >-
      Establishes PUS3 as a recognised Mendelian disease gene and names its gene
      product and substrate class.
  - reference: PMID:32056211
    reference_title: "Genetic basis of neurodevelopmental disorders in 103 Jordanian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings provide additional evidence to establish loss of PUS3 function as a
      cause of intellectual disability.
    explanation: >-
      Independent replication in a second consanguineous population, cited by OMIM as
      one of the two summary sources for the disease entry.
  - reference: PMID:36125428
    reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genomic mutations in the human pseudouridine synthase 3 gene (PUS3) have been
      identified in patients with neurodevelopmental disorders.
    explanation: >-
      Confirms the gene-disease relationship from an independent group.
  variants:
  - name: c.1303C>T (p.Arg435*)
    type: NONSENSE
    clinical_significance: PATHOGENIC
    description: >-
      The founding allele, homozygous in three affected Saudi sisters. It truncates
      the final 46 residues plus the end of a conserved region and behaves as a
      near-complete null in patient lymphoblastoid cells.
    evidence:
    - reference: PMID:27055666
      reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified a homozygous nonsense variant in PUS3; Chr11(GRCh37):g.125763823G>A;
        NM_031307.3: c.1303C>T: p.(Arg435*) that fully segregated with the phenotype in
        the family as confirmed by Sanger sequencing
      explanation: >-
        Names the allele, its genomic and cDNA coordinates, and its full segregation
        with disease.
    - reference: PMID:27055666
      reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This variant is absent in 1,500 Saudi exomes as well as in the ExAC Browser.
      explanation: >-
        Population-frequency evidence supporting pathogenicity.
  - name: c.212A>G (p.Tyr71Cys)
    type: MISSENSE
    clinical_significance: LIKELY_PATHOGENIC
    description: >-
      A recurrent missense allele, found homozygous or in trans with p.Ile299Thr, and
      carried by five of the fewer than thirty reported individuals. Mechanistically
      instructive: the purified protein retains normal tRNA binding and
      pseudouridylation activity, but its thermostability is strongly impaired and it
      is nearly absent from patient fibroblasts, so it is a functional null despite
      normal in vitro catalysis.
    evidence:
    - reference: PMID:36125428
      reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we find that the p.Tyr71Cys substitution neither affect tRNA binding nor
        pseudouridylation activity in vitro, but strongly impair the thermostability
        profile of PUS3, while the p.Ile299Thr mutation causes protein aggregation.
      explanation: >-
        Establishes the destabilisation mechanism that makes this missense allele a
        functional null.
    - reference: PMID:41971559
      reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing identified a homozygous PUS3 c.212A>G (p.Tyr71Cys)
        variant, classified as likely pathogenic based on ACMG criteria (PM2, PM3, PP3,
        PP5).
      explanation: >-
        Supplies the ACMG classification and confirms recurrence of the allele in an
        unrelated population.
  - name: c.896T>C (p.Ile299Thr)
    type: MISSENSE
    clinical_significance: LIKELY_PATHOGENIC
    description: >-
      Found in trans with p.Tyr71Cys in a compound heterozygous patient. Unlike
      p.Tyr71Cys it acts by promoting aggregation of the recombinant protein, a second
      distinct route to loss of available enzyme.
    evidence:
    - reference: PMID:36125428
      reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we find that the p.Tyr71Cys substitution neither affect tRNA binding nor
        pseudouridylation activity in vitro, but strongly impair the thermostability
        profile of PUS3, while the p.Ile299Thr mutation causes protein aggregation.
      explanation: >-
        Names the aggregation mechanism specific to this allele.
diagnosis:
- name: Molecular diagnosis by exome or genome sequencing
  description: >-
    There is no pathognomonic clinical gestalt, so molecular testing establishes the
    diagnosis. Trio exome or genome sequencing, or a comprehensive intellectual
    disability / epilepsy panel that includes PUS3, is the appropriate route, followed
    by parental segregation testing to confirm that the two alleles are in trans.
    Grey sclerae and extensive dermal melanocytosis can raise suspicion but their
    absence does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:41971559
    reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing identified a homozygous PUS3 c.212A>G (p.Tyr71Cys)
      variant, classified as likely pathogenic based on ACMG criteria (PM2, PM3, PP3,
      PP5).
    explanation: >-
      Documents whole-exome sequencing as the diagnostic method actually used, with
      ACMG-based variant classification.
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals were characterized by the local clinicians and the gene variants
      were identified by next generation sequencing (NGS) based methodologies.
    explanation: >-
      Confirms next-generation sequencing as the diagnostic route across the whole
      published cohort.
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients had some dysmorphic facial features, but a recognizable gestalt was
      not observed.
    explanation: >-
      Supports the claim that molecular testing rather than clinical recognition
      establishes the diagnosis.
- name: tRNA pseudouridine assay for variant interpretation
  description: >-
    Measuring PUS3-dependent pseudouridine in patient-derived cells is the direct
    functional readout of the enzyme defect and is the assay that resolves a PUS3
    variant of uncertain significance. It is essential for missense alleles, because
    p.Tyr71Cys demonstrates that a variant can look catalytically normal in a purified
    enzyme assay while being a functional null in the cell - so protein-level and
    pseudouridine-level measurement in patient cells, not in vitro catalysis, is the
    informative test. This remains a research-level assay rather than routine
    diagnostics.
  diagnosis_term:
    preferred_term: molecular analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:36125428
    reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we observe that the PUS3 protein levels as well as the level of PUS3-dependent Ψ
      levels are strongly reduced in fibroblasts derived from all three patients.
    explanation: >-
      Establishes reduced PUS3 protein and pseudouridine in patient fibroblasts as the
      functional readout the assay measures.
  - reference: PMID:36125428
    reference_title: "Destabilization of mutated human PUS3 protein causes intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we find that the p.Tyr71Cys substitution neither affect tRNA binding nor
      pseudouridylation activity in vitro, but strongly impair the thermostability
      profile of PUS3
    explanation: >-
      Demonstrates why an in vitro catalytic assay alone is insufficient for variant
      interpretation and cell-based measurement is required.
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with the known role of Pus3 in isomerizing uracil to pseudouridine at
      positions 38 and 39 in tRNA, we found a significant reduction in this
      post-transcriptional modification of tRNA in patient cells.
    explanation: >-
      The original demonstration of the assay applied to patient-derived cells.
- name: Metabolic screening to exclude storage-disorder mimics
  description: >-
    Because extensive dermal melanocytosis with coarse facies and developmental delay
    is the classic presentation of GM1 gangliosidosis and the
    mucopolysaccharidoses/mucolipidoses, the diagnostic workup should include urine
    glycosaminoglycans and organic acids, tandem mass spectrometry, plasma lactate and
    congenital disorders of glycosylation screening. In the founding family all of
    these were negative, and that negative panel is what separated this disorder from
    the storage mimics before the gene was known.
  notes: >-
    Term choice. An earlier revision bound this to NCIT:C19770 Molecular Analysis,
    which is wrong: urine glycosaminoglycans and organic acids, tandem mass
    spectrometry and plasma lactate are biochemical assays on body fluids, not
    molecular-genetic analysis. NCIT:C25294 Laboratory Procedure, verified with OAK
    as "Any procedure that involves testing or manipulating a sample of blood,
    urine, or other body substance in a laboratory setting", is the correct action
    term. The genuinely molecular assay in this entry - the tRNA pseudouridine
    measurement - correctly keeps NCIT:C19770.
  diagnosis_term:
    preferred_term: biochemical laboratory screening
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Negative results include urine organic acids and GAGs, Tandem MS, plasma lactate,
      uric acid, lipid profile, CDG screening, and molecular karyotyping.
    explanation: >-
      Documents the exact exclusionary metabolic panel performed in the founding
      family and its negative result.
- name: Brain MRI
  description: >-
    Brain MRI is informative but neither sensitive nor specific. Findings range from
    entirely normal through subcortical white matter T2/FLAIR signal change, frontal
    volume loss, ventriculomegaly, arachnoid cysts and corpus callosum dysgenesis to
    cerebellar hypoplasia. A normal MRI does not exclude the diagnosis, and where
    white matter change is present it appears stable rather than progressive, which
    argues against a leukodystrophy.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:41971559
    reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI demonstrated stable, nonprogressive, linear-nodular T2 hyperintense
      lesions confined to the subcortical white matter with a normal corpus callosum,
      an imaging pattern rarely associated with PUS3 deficiency.
    explanation: >-
      Documents both the white-matter pattern and the explicit statement that it is
      only rarely associated with the disorder, supporting low specificity.
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI at 2 years was unremarkable apart from small arachnoid cyst seen along
      the anterolateral surface of the left cerebellar hemisphere in the posterior
      fossa.
    explanation: >-
      Shows that an affected individual can have essentially unremarkable imaging,
      supporting the low sensitivity of MRI.
treatments:
- name: Antiseizure Medication
  description: >-
    Epilepsy is managed with standard antiseizure medication chosen by seizure type.
    There is no PUS3-specific drug recommendation and no evidence favouring one agent;
    response is variable, with some individuals achieving seizure freedom on multiple
    agents and others retaining breakthrough seizures.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a history of seizures at 10 months of age but she has been seizure-free
      on multiple antiepileptic medications.
    explanation: >-
      Documents antiepileptic medication achieving seizure freedom in an affected
      individual.
- name: Developmental and Rehabilitative Therapy
  description: >-
    Management is entirely supportive. Early and sustained physical, occupational and
    speech or augmentative-communication therapy addresses the hypotonia, motor delay
    and severely limited expressive language that dominate function, and physiotherapy
    plus orthopaedic surveillance addresses the scoliosis and contracture risk that
    follow from hypotonia and limited mobility.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_phenotypes:
  - preferred_term: Generalized hypotonia
    term:
      id: HP:0001290
      label: Generalized hypotonia
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical picture was dominated by global developmental delay, epilepsy,
      hypotonia and microcephaly.
    explanation: >-
      Establishes the developmental and motor targets of rehabilitation. Marked PARTIAL
      because the cohort study characterises the deficits rather than evaluating any
      rehabilitative intervention; no trial evidence for efficacy exists in this
      disorder.
- name: Ophthalmological Surveillance
  description: >-
    Baseline and periodic ophthalmological review is warranted because strabismus is
    common, grey sclerae are part of the diagnostic picture, and retinal dystrophy,
    nystagmus, optic disc pallor and abnormal visual fixation have each been reported.
    Untreated strabismus in a child with severe developmental delay risks amblyopia
    that further limits an already constrained visual and communicative repertoire.
    Scoped and named as surveillance to match its NCIT action term: the entry asserts
    case detection through formal eye examination, not any specific corrective
    intervention, because no strabismus or retinal treatment outcome has been reported
    in this disorder.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  target_phenotypes:
  - preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
  - preferred_term: Retinal dystrophy
    term:
      id: HP:0000556
      label: Retinal dystrophy
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She has coarse facial features, bilateral strabismus, grey sclera and extensive
      Mongolian spots
    explanation: >-
      Documents the ocular findings that make ophthalmological surveillance
      appropriate. Marked PARTIAL because the paper reports the findings but does not
      evaluate a surveillance or treatment programme.
  - reference: PMID:34713961
    reference_title: "PUS3-related disorder: Report of a novel patient and delineation of the phenotypic spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel homozygous PUS3 frameshift variant in a child with facial
      dysmorphisms, growth failure, microcephaly, retinal dystrophy, cerebellar
      hypoplasia, congenital heart defect, and right kidney hypoplasia.
    explanation: >-
      Documents retinal dystrophy, the finding that makes formal retinal assessment
      rather than a simple squint check appropriate. PARTIAL because it is a single
      case observation, not an evaluated protocol.
- name: Genetic Counselling and Reproductive Risk Assessment
  description: >-
    Once the biallelic PUS3 genotype is established, counselling covers the 25 percent
    sibling recurrence risk, carrier testing of at-risk relatives, and the availability
    of prenatal diagnosis and preimplantation genetic testing. This is the only
    intervention with a preventive rather than symptomatic role, and it is
    particularly relevant because many reported families are consanguineous.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41971559
    reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a 17-year-old girl born to second-degree consanguineous parents
      presenting with lifelong global developmental delay, microcephaly, gray sclera,
      dysmorphic features, and intellectual disability.
    explanation: >-
      Documents the consanguineous family structure in which recurrence-risk
      counselling and carrier testing are most consequential.
- name: Long-Term Neurological Surveillance
  description: >-
    Because the natural history extends into adulthood and the white matter changes
    are stable rather than progressive, periodic rather than intensive neurological
    review is appropriate, with attention to emerging or evolving seizures, scoliosis
    and functional decline. The 2026 report makes this recommendation explicitly.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41971559
    reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her stable neurological course into late adolescence broadens the phenotypic
      spectrum of PUS3 deficiency and underscores the need for long-term clinical
      monitoring in disorders of tRNA modification.
    explanation: >-
      An explicit recommendation for long-term clinical monitoring in this disorder.
differential_diagnoses:
- name: GM1 Gangliosidosis Type 1
  disease_term:
    preferred_term: GM1 gangliosidosis type 1
    term:
      id: MONDO:0009260
      label: GM1 gangliosidosis type 1
  description: >-
    The most important mimic for anyone approaching this disorder through its
    descriptive MONDO/Orphanet label. Infantile GM1 gangliosidosis combines congenital
    dermal melanocytosis (Mongolian spots), coarse facial features, developmental
    delay and failure to thrive - the same four-feature cluster that gives
    MONDO:0014886 its name. A gene-agnostic literature search on "extensive dermal
    melanocytosis with intellectual disability" will land on GM1 rather than on PUS3.
  distinguishing_features:
  - >-
    Molecular: GLB1 beta-galactosidase deficiency versus PUS3 tRNA pseudouridine
    synthase deficiency. Different genes, different MONDO entities, different
    mechanisms entirely - lysosomal substrate storage versus a tRNA modification
    defect.
  - >-
    Biochemical: GM1 has a positive enzyme assay and abnormal urinary
    oligosaccharides/glycosaminoglycans. In PUS3 disease the entire metabolic panel is
    normal - urine organic acids and GAGs, tandem MS, plasma lactate and CDG screening
    were all negative in the founding family. The metabolic panel is the discriminator.
  - >-
    Course: infantile GM1 is a rapidly progressive neurodegenerative storage disease
    with hepatosplenomegaly, cherry-red spot and early death. PUS3 disease is a static
    encephalopathy - the white matter changes are explicitly stable and nonprogressive,
    individuals survive into adulthood, and there is no visceromegaly.
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Negative results include urine organic acids and GAGs, Tandem MS, plasma lactate,
      uric acid, lipid profile, CDG screening, and molecular karyotyping.
    explanation: >-
      The negative storage-disorder workup in the founding family is precisely what
      separates PUS3 disease from GM1 and the mucopolysaccharidoses.
  - reference: PMID:41971559
    reference_title: "Expanding the Phenotypic Spectrum of PUS3 Deficiency: A p.Tyr71Cys Case Demonstrating a Stable, Nonprogressive Leukoencephalopathy Pattern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her stable neurological course into late adolescence broadens the phenotypic
      spectrum of PUS3 deficiency and underscores the need for long-term clinical
      monitoring in disorders of tRNA modification.
    explanation: >-
      Documents the static, non-neurodegenerative course that separates PUS3 disease
      from a progressive storage disorder.
- name: PUS7-Related Neurodevelopmental Disorder
  disease_term:
    preferred_term: PUS7-related neurodevelopmental disorder (IDDABS)
    term:
      id: MONDO:0032687
      label: intellectual developmental disorder with abnormal behavior, microcephaly, and short stature
  description: >-
    The closest mechanistic relative and the sibling entry in this knowledge base.
    PUS7 (hgnc:26033) is another stand-alone pseudouridine synthase whose biallelic
    loss causes intellectual disability with microcephaly and short stature. Both
    disorders are described in the literature as caused by "impaired
    pseudouridylation", so a gene-agnostic reading of that phrase will merge them.
  distinguishing_features:
  - >-
    Molecular: PUS3 (hgnc:25461) versus PUS7 (hgnc:26033). Different genes, different
    MONDO entities, different OMIM numbers (617051 versus 618342).
  - >-
    Substrate position: PUS3 isomerises uridine at tRNA anticodon positions 38 and 39,
    whereas PUS7 acts at position 13 and at position 35 of pre-tRNA-Tyr. A tRNA
    modification assay distinguishes them biochemically and is the cleanest functional
    discriminator.
  - >-
    Clinical: grey sclerae and extensive dermal melanocytosis are part of the PUS3
    picture and have never been reported in PUS7 deficiency, while the PUS7
    behavioural signature of very-early-onset aggression is not part of the PUS3
    phenotype.
  evidence:
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with the known role of Pus3 in isomerizing uracil to pseudouridine at
      positions 38 and 39 in tRNA, we found a significant reduction in this
      post-transcriptional modification of tRNA in patient cells.
    explanation: >-
      Establishes the position-38/39 substrate specificity that biochemically separates
      PUS3 disease from the position-13 defect of PUS7 disease.
  - reference: PMID:38996458
    reference_title: "The molecular basis of tRNA selectivity by human pseudouridine synthase 3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human pseudouridine synthase 3 (PUS3) catalyzes pseudouridylation of position
      38/39 in tRNAs.
    explanation: >-
      Confirms the PUS3-specific substrate positions from an independent structural
      study.
- name: PUS1-Related Mitochondrial Myopathy and Sideroblastic Anemia
  disease_term:
    preferred_term: myopathy, lactic acidosis, and sideroblastic anemia 1
    term:
      id: MONDO:0024553
      label: myopathy, lactic acidosis, and sideroblastic anemia 1
  description: >-
    The third pseudouridine synthase disease. PUS1 (hgnc:15508) is also a tRNA
    pseudouridylase, but its loss produces a mitochondrial muscle and marrow disease
    rather than a neurodevelopmental one. It is included because the shared enzyme
    family and shared "impaired pseudouridylation" phrasing make it a search-level
    confusable, and because the 2024 structural study directly contrasts PUS1 and PUS3
    substrate scope.
  distinguishing_features:
  - >-
    Molecular: PUS1 (hgnc:15508) versus PUS3 (hgnc:25461); PUS1 modifies both tRNA and
    mRNA, whereas PUS3 acts on tRNA positions 38 and 39 and has no demonstrated mRNA
    substrates in human cells.
  - >-
    Clinical: PUS1 disease presents with exercise intolerance, lactic acidosis and
    sideroblastic anaemia, without the intellectual disability, microcephaly, grey
    sclerae or dermal melanocytosis of PUS3 disease.
  evidence:
  - reference: PMID:38996458
    reference_title: "The molecular basis of tRNA selectivity by human pseudouridine synthase 3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although PUS1-dependent sites were detectable in tRNA and mRNA, we found no
      evidence that human PUS3 modifies mRNAs.
    explanation: >-
      Directly contrasts the substrate scope of PUS1 and PUS3 in the same experimental
      system, the cleanest available molecular discriminator between the two.
discussions:
- discussion_id: pus3_translation_step_unmeasured
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of pseudouridine at tRNA positions 38 and 39 actually degrade
    translational fidelity or efficiency in human neural cells, and if so which
    transcripts or codons are most affected?
  attaches_to:
  - pathophysiology#Impaired Translational Fidelity and Efficiency
  rationale: >-
    This is the weakest link in the causal chain. Every step from the PUS3 genotype to
    depleted pseudouridine at positions 38 and 39 has been measured directly in patient
    cells by two independent groups. The step from there to impaired translation is
    inferred from tRNA structural chemistry and from bacterial truA and yeast pus3
    orthologue phenotypes, and the step from impaired translation to selective
    vulnerability of the developing brain is inferred from the pattern shared across
    the tRNA-modification intellectual disability disorders. No ribosome profiling,
    proteomics or reporter-fidelity measurement has been reported in a human
    PUS3-deficient neural cell. Until that measurement exists, the mechanistic
    explanation for why a housekeeping tRNA modification produces a brain-predominant
    phenotype remains a hypothesis rather than a finding.
  proposed_experiments:
  - experiment_id: exp_pus3_ribosome_profiling_neurons
    name: Ribosome profiling and proteomics in patient iPSC-derived neurons
    description: >-
      Perform ribosome profiling and quantitative proteomics in patient-derived iPSC
      neural progenitors and neurons versus isogenic corrected controls, testing for
      codon-specific ribosome pausing at codons decoded by the tRNAs that normally
      carry pseudouridine at positions 38 and 39.
  - experiment_id: exp_pus3_fidelity_reporters
    name: Translational fidelity reporter assays in patient cells
    description: >-
      Use dual-luciferase or fluorescent reporter assays of frameshifting and
      stop-codon readthrough in patient fibroblasts and iPSC-derived neurons, the
      human counterpart of the reduced minus-one frameshifting reported in yeast pus3
      mutants.
  - experiment_id: exp_pus3_cerebral_organoids
    name: Cerebral organoid model of PUS3 deficiency
    description: >-
      Differentiate cerebral organoids from patient and isogenic corrected iPSC lines
      and assess progenitor proliferation and cortical layer formation, to test
      whether the microcephaly and developmental delay are reproducible in a human
      neural model.
  evidence:
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further functional studies are necessary to understand involvement of PUS3 and
      tRNA biogenesis in normal and abnormal brain development.
    explanation: >-
      The largest cohort study states explicitly that the mechanistic link from PUS3 to
      brain development remains unresolved.
- discussion_id: pus3_dermal_melanocytosis_generalisability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is extensive dermal melanocytosis a real, mechanistically meaningful feature of
    PUS3 deficiency, or an ancestry-linked incidental finding in the single founding
    family that has been fossilised into the Orphanet and MONDO label?
  attaches_to:
  - phenotypes#Extensive Dermal Melanocytosis
  rationale: >-
    Extensive Mongolian spots appear in all three sisters of the founding Saudi family
    and are prominent enough to have named the disorder in Orphanet and MONDO. Yet the
    feature is absent from the abstract of the 21-individual pooled cohort, which
    enumerates gray sclera among pigmentary findings but not dermal melanocytosis, and
    it is not mentioned in the Italian, Polish or Turkish reports. Congenital dermal
    melanocytosis is also common in the general population of several ancestries,
    including the one the founding family belongs to, which makes a coincidental
    co-occurrence within one consanguineous sibship entirely plausible. Two things
    hinge on the answer. If the association is real, then PUS3 loss must perturb
    dermal melanocyte migration or retention and the pathograph is missing a node. If
    it is not, the MONDO label is actively misleading and steers curators and
    clinicians towards the lysosomal storage disorders. Grey sclerae, which is
    plausibly the ocular counterpart of the same melanocytic process, went from
    "characteristic" to 7/21 once a real cohort was assembled - the same deflation may
    await dermal melanocytosis.
  proposed_experiments:
  - experiment_id: exp_pus3_melanocytosis_rephenotyping
    name: Standardised re-phenotyping of the published cohort for dermal melanocytosis
    description: >-
      Systematically re-phenotype the existing molecularly confirmed cohort for dermal
      melanocytosis using standardised photographic documentation and HPO coding, with
      the extent and distribution recorded rather than a simple present/absent flag.
  - experiment_id: exp_pus3_melanocytosis_ancestry_control
    name: Ancestry-matched control comparison for dermal melanocytosis
    description: >-
      Compare dermal melanocytosis prevalence and extent between PUS3-affected
      individuals and ancestry-matched unaffected relatives or population controls,
      which is the only design that can separate a genuine disease association from an
      ancestry-linked background rate.
  - experiment_id: exp_pus3_melanocyte_biology
    name: PUS3 function in dermal melanocytes
    description: >-
      Assess PUS3 expression and pseudouridine levels in dermal melanocytes, and
      melanocyte migration in a PUS3-depleted model, to test whether a plausible
      cellular mechanism for the pigmentary phenotype exists at all.
  evidence:
  - reference: PMID:34415064
    reference_title: "Clinical and molecular delineation of PUS3-associated neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gray sclera, which has previously been suggested to be a characteristic feature
      of PUS3-associated phenotypes, was reported in only seven individuals.
    explanation: >-
      Demonstrates the precedent: a pigmentary feature considered characteristic from
      early reports deflated to a minority finding once a real cohort was assembled,
      which is the concern raised for dermal melanocytosis.
  - reference: PMID:27055666
    reference_title: "A homozygous truncating mutation in PUS3 expands the role of tRNA modification in normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She has coarse facial features, bilateral strabismus, grey sclera and extensive
      Mongolian spots
    explanation: >-
      The single-family observation on which the whole Orphanet label rests, and
      therefore the observation whose generalisability is in question.

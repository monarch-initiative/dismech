    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gray sclera, which has previously been suggested to be a characteristic feature
      of PUS3-associated phenotypes, was reported in only seven individuals.
    explanation: >-
      Supplies the 7/21 numerator underpinning the FREQUENT band and simultaneously
      qualifies the feature as non-obligatory, hence PARTIAL.

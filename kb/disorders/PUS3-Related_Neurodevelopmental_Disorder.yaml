- name: Leukoencephalopathy
  category: Neurologic
  description: >-
    Subcortical white matter signal abnormality on T2/FLAIR is a recurrent
    neuroimaging finding, seen in the founding sisters and forming the whole
    neuroimaging phenotype of the 2026 Turkish proband. Importantly the pattern
    appears stable and non-progressive on long-term follow-up rather than
    representing a leukodystrophy, and brain MRI can also be entirely normal.
  notes: >-
    Frequency omitted. White matter abnormalities were present in 5 individuals of the
    Nostvik cohort with any MRI abnormality in 11/15, but the specific white-matter
    subset denominator is not quotable from the cached abstract. The 2019 Brazilian
    report (PMID:30697592) put leukoencephalopathy in its title but is a Neurology
    Genetics clinical note with no PubMed abstract, so it supports this phenotype only
    as a listed reference, not as a snippet-backed evidence item.

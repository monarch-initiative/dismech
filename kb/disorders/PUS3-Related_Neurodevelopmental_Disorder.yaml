- name: Coarse Facial Features
  category: Craniofacial
  description: >-
    Coarse facial features were present in the founding sisters, varying in degree
    between them. Facial dysmorphism of some kind is near-universal across the wider
    cohort, but no recognisable gestalt exists, so the face supports rather than
    establishes the diagnosis.

- name: Global Developmental Delay
  category: Neurologic
  description: >-
    Global developmental delay from infancy is the presenting feature in essentially
    every reported individual, affecting motor, language and cognitive domains
    together. Independent ambulation is often not achieved, or is achieved only with
    assistance.
  frequency: FREQUENT
  notes: >-
    Derivation: the Nostvik pooled cohort abstract states the clinical picture was
    "dominated by" global developmental delay, and its full text reports intellectual
    disability or global developmental delay in 19/19 assessed individuals; all three
    sisters of the founding family and the Turkish proband are additionally
    documented individually. The conservative FREQUENT band (30-79 percent) is
    assigned because the only quotable statement is the qualitative "dominated by",
    and the 19/19 denominator sits in full text that is not cached here.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:

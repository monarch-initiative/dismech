    malformed but present structure. HP:0001274 Agenesis of corpus callosum was
    used in an earlier revision and is wrong: agenesis asserts complete absence,
    which is a strictly stronger and different claim than what the paper reports.
    HP:0001273 Abnormal corpus callosum morphology, verified with OAK as

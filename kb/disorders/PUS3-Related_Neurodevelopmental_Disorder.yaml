- name: Severe Intellectual Disability
  category: Neurologic
  description: >-
    Intellectual disability is severe to profound in most reported individuals, with
    poor or absent expressive language. Formal testing in the founding family gave an
    IQ of 30 in the eldest sister and a profound range score below 20 in the youngest.
  frequency: FREQUENT
  notes: >-
    Derivation: severe in 9, moderate-to-severe in 2, moderate in 4 and unspecified in
    4 of the pooled cohort per the Nostvik full text, with measured IQ from below 20
    to 58. The severe-to-profound end therefore covers roughly half of graded cases,
    supporting FREQUENT rather than VERY_FREQUENT. Milder moderate presentations
    exist, so the severity qualifier is not universal even though intellectual
    disability itself is.
  phenotype_term:
    preferred_term: Severe intellectual disability

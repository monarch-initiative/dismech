- name: Seizures
  category: Neurologic
  description: >-
    Epilepsy affects most but not all individuals. Onset ranges from early infancy to
    adolescence and the seizure semiology is heterogeneous, including tonic,
    generalised tonic-clonic, focal, atypical absence, infantile spasms, myoclonic and
    atonic seizures. Seizure control is variable; some individuals become seizure-free
    on antiseizure medication and others do not.
  frequency: FREQUENT
  notes: >-
    Derivation: epilepsy in 13/18 assessed (72 percent) in the Nostvik full text,
    within the FREQUENT band, and named among the dominant features in the abstract.
    Explicitly not universal - the eldest founding sister had seizures at 10 months
    but the two younger sisters had none, and the Turkish proband reached age 17
    without seizures.
  phenotype_term:
    preferred_term: Seizure

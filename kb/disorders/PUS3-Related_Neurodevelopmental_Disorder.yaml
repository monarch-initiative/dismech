name: PUS3-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T18:40:00Z"
category: Mendelian
description: >-
  PUS3-related neurodevelopmental disorder (neurodevelopmental disorder with
  microcephaly and gray sclerae, NEDMIGS, MIM 617051; formerly autosomal recessive
  intellectual disability 55, MRT55) is an ultra-rare autosomal recessive condition
  caused by biallelic loss-of-function variants in PUS3, which encodes the
  TruA/Pus3-family tRNA pseudouridine synthase 3. The core clinical picture is
  global developmental delay with severe to profound intellectual disability and
  poor or absent speech, generalised hypotonia, microcephaly and epilepsy. A
  distinctive ocular and cutaneous pigmentary signature - grey sclerae together
  with extensive, widespread Mongolian spots (dermal melanocytosis) - was present
  in the founding Saudi family and supplied the descriptive Orphanet/MONDO label,
  but grey sclerae were subsequently found in only a minority of the pooled cohort
  and dermal melanocytosis has not been systematically re-reported, so neither
  feature is obligatory. Poor somatic growth with severe short stature or failure
  to thrive, coarse facial features, strabismus and variable brain MRI
  abnormalities (subcortical white matter signal change, atrophy or hypoplasia,
  corpus callosum dysgenesis) complete the syndrome. Mechanistically, disease
  alleles either truncate PUS3 or destabilise/aggregate the protein in cells, and
  in every functionally studied patient the result is the same: depletion of
  PUS3-dependent pseudouridine at positions 38 and 39 of the tRNA anticodon stem
  loop, with the developing brain the tissue least able to tolerate the resulting
  perturbation of translation.
notes: >-
  Named-entity-confusion guardrail and label caveat. This entry is anchored strictly
  on MONDO:0014886 / OMIM:617051 / PUS3 (hgnc:25461). The anchor was established
  BEFORE any deep research by running `runoak -i sqlite:obo:mondo info MONDO:0014886
  -O obo`, which returns no textual definition but does carry an unambiguous gene
  association line, `relationship: RO:0004003 HGNC:25461 ! PUS3`, together with
  `xref: OMIM:617051` and `xref: Orphanet:488627`. The gene was independently
  confirmed against the NCBI MedGen record for the same concept (MEDGEN:934712 /
  UMLS:C4310745), whose OMIM-sourced definition reads "Neurodevelopmental disorder
  with microcephaly and gray sclerae (NEDMIGS) ... (summary by Shaheen et al., 2016
  and Froukh et al., 2020)" - the two PUS3 papers curated here as PMID:27055666 and
  PMID:32056211.

  The MONDO/Orphanet label is descriptive, not mechanistic. "Severe growth
  deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
  syndrome" is the ORDO (Orphanet:488627) preferred term and enumerates four
  features of the three affected sisters in the single founding family
  (PMID:27055666); OMIM instead names the same entity after two different features
  (microcephaly and gray sclerae). Because the ORDO label reads like a clinical
  gestalt rather than a gene-based name, and because extensive dermal melanocytosis
  plus coarse facies plus developmental delay is the classic presentation of the
  lysosomal storage disorders, this label is a high named-entity-confusion risk: a
  gene-agnostic literature search on the label alone will drift onto GM1
  gangliosidosis and the mucopolysaccharidoses/mucolipidoses. Those are recorded in
  `differential_diagnoses`. The entry `name` therefore uses the gene-anchored form
  used throughout the clinical literature ("PUS3-related disorder", "PUS3-associated
  neurodevelopmental disorders", "PUS3 deficiency"), and the full ORDO label is
  retained verbatim as the bound `disease_term.term.label` and as a synonym. Note
  that in the founding paper the sisters were explicitly negative for urine organic
  acids and GAGs, tandem MS, plasma lactate and CDG screening, which is exactly the
  workup that excludes the storage-disorder mimics.

  Deep-research provenance and NEC preflight outcome. One deep-research run was
  performed, Edison/Falcon (`just research-disorder falcon
  PUS3-Related_Neurodevelopmental_Disorder`), and it PASSED the NEC preflight: the
  report's dominant gene is PUS3, it asserts OMIM #617051 / NEDMIGS, and it did not
  drift onto any lysosomal storage disorder. It was nevertheless used only as a
  lead-generator. Its one genuinely new lead, the Fang et al. Chinese infant with
  severe epileptic encephalopathy (resolved to PMID:31444731 via the DOI it
  supplied), turned out to be a letter with no PubMed abstract and therefore carries
  no snippet-backed evidence item here; it is listed under `references:` only. The
  report's detailed per-feature denominators (ID 19/19, speech 11/11, motor delay
  16/18, hypotonia 10/13, epilepsy 13/18, microcephaly 13/18, facial dysmorphism
  17/18, short stature 10/17, scoliosis 8/10, MRI abnormal 11/15) come from the
  Nostvik 2021 full text, of which only the abstract is cached; those numbers are
  recorded in phenotype `notes` as derivation reasoning and are NOT quoted as
  evidence snippets. The report also stated it could not verify a MONDO identifier;
  that gap is closed here by the OAK lookup above.

  Two things the report asserted that are deliberately NOT carried into this entry.
  (1) It reports mitochondrial localisation of PUS3 and a possible mitochondrial
  contribution to pathogenesis; it flags this itself as "plausible but unproven",
  and the 2024 cryo-EM/Pseudo-seq study (PMID:38996458) found no evidence that human
  PUS3 modifies mRNAs, so no mitochondrial or mRNA-substrate node is asserted in the
  pathograph. (2) It suggests "Blue sclerae, HP:0000592" for grey sclerae; that term
  denotes the blue sclerae of collagen disorders such as osteogenesis imperfecta and
  is a different sign, so `HP:0007832 Pigmentation of the sclera` is used instead.

  No GeneReviews chapter exists for PUS3. This was checked with the PubMed
  E-utilities search `PUS3 GeneReviews[All Fields]`, which returns zero records, so
  the mandatory GeneReviews phenotype baseline does not apply. The largest available
  substitute baseline, the 21-individual multicentre delineation of Nostvik et al.
  2021 (PMID:34415064), was used in its place and every feature named in its
  abstract is represented in `phenotypes`.

  Orphanet epidemiology was not adopted. `just refresh-orphadata` currently fails a
  manifest checksum against upstream, no `references_cache/ORPHA_488627.md` exists,
  and the entry therefore records a qualitative `prevalence_class: ULTRA_RARE`
  backed by a published case-count quotation rather than an Orphanet prevalence
  band.

  Citation-string quirk. PubMed records the title of PMID:41971559 with a missing
  space ("Expandingthe Phenotypic Spectrum ..."). The top-level `references:` entry
  reproduces that string verbatim because the reference validator compares it
  against the cached record; the inline `reference_title:` fields use the corrected
  spacing for readability. This is an upstream PubMed typo, not a curation error.

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ablation of Rere in cranial neural crest (CNC) cells, mediated by a Wnt1-Cre, leads to delayed elevation of the palatal shelves and cleft palate and that proliferation of mesenchymal cells in the palatal shelves is significantly reduced"
    explanation: >-

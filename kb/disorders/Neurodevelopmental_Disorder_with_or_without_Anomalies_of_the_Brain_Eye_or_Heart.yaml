    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Feeding difficulties may require the use of feeding therapy and/or thickened liquids; in severe cases, a nasogastric or gastrostomy tube may be considered."
    explanation: >-
      GeneReviews management recommendation, quoted verbatim as the source for
      this treatment and its escalation ladder.
- name: Standard-of-Care Management of Individual Manifestations
  therapeutic_modality: OTHER
  description: >
    There is no disease-modifying or RERE-targeted therapy. Seizures, abnormal
    vision and strabismus, hearing loss, congenital heart defects,
    gastroesophageal reflux, genitourinary anomalies, scoliosis, congenital hip
    dysplasia, developmental delay, and behavioural problems are each treated in
    the standard manner for that manifestation. Management is therefore
    supportive and multidisciplinary rather than mechanism-directed.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30896913
    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizure disorders, abnormal vision and/or strabismus, hearing loss, congenital heart defects, gastroesophageal reflux, genitourinary anomalies, scoliosis, congenital hip dysplasia, developmental delay, and behavioral problems are treated in the standard manner."
    explanation: >-
      GeneReviews states directly that every manifestation is managed by
      standard-of-care rather than any disorder-specific intervention.
- name: Multidisciplinary Surveillance Program
  therapeutic_modality: OTHER
  description: >
    Scheduled surveillance is the substantive management contribution in this
    disorder, because the structural anomalies are congenital and the
    complications are anticipatable. GeneReviews recommends at least annual
    monitoring of developmental progress and educational needs and for scoliosis
    until growth is complete; annual (or as clinically indicated) ophthalmologic
    and audiologic evaluations; routine cardiology and urology follow-up for
    those with anomalies of those systems; and monitoring of seizure activity and
    behavioural issues as needed.
  treatment_term:
    preferred_term: multidisciplinary disease surveillance
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:30896913
    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least annual monitoring of developmental progress / educational needs and for scoliosis (until growth is complete). Annual (or as clinically indicated) ophthalmologic and audiologic evaluations."
    explanation: >-
      GeneReviews surveillance schedule for the developmental, skeletal, ocular,
      and auditory domains.
  - reference: PMID:30896913
    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Routine follow up with a cardiologist and a urologist, as indicated for those who have anomalies involving these organ systems."
    explanation: >-
      Source for the cardiology and urology arms of the surveillance program.
- name: Genetic Counseling
  therapeutic_modality: OTHER
  description: >
    Recurrence-risk counseling is central to management. When the proband's
    variant is not found in either parent the sibling recurrence risk is about
    1%, higher than the general population because of possible parental germline
    mosaicism. Once a familial variant is known, prenatal testing and
    preimplantation genetic testing are available. Counseling should now be
    variant-class-aware: the loss-of-function class is the one in which a mildly
    symptomatic or asymptomatic parent may carry the variant, so parental testing
    matters for accurate recurrence-risk estimation.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30896913
    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the RERE pathogenic variant has been identified in an affected family member, prenatal testing for a pregnancy at increased risk and preimplantation genetic testing are possible."
    explanation: >-
      GeneReviews statement of the reproductive options that genetic counseling
      makes available.
  - reference: PMID:41988794
    reference_title: "New genotype-phenotype correlations and management recommendations for individuals with RERE variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings expand the clinical spectrum of RERE-related disorders, refine genotype-phenotype correlations, and support variant-specific approaches to management and genetic counseling."
    explanation: >-
      Supports the recommendation that counseling be stratified by variant class
      rather than delivered uniformly.
animal_models:
- name: Rere allelic series mouse (om null / eyes3 hypomorph)
  species: Mouse
  genotype: Rere om (null) and Rere eyes3 (c.578T>C, p.Val193Ala hypomorph), compound heterozygous and other combinations
  background: ENU-derived eyes3 allele
  publication: PMID:23451234
  description: >
    Rere-null mice die of cardiac failure between E9.5 and E11.5, which prevents
    study of later development. To get past that lethality the authors built an
    allelic series combining the null om allele with a novel ENU-derived
    hypomorphic allele, eyes3. The resulting graded-dosage animals reproduce the
    multi-organ pattern of human NEDBEH in a single genotype series: microphthalmia,
    postnatal growth deficiency, brain hypoplasia with reduced NeuN-positive
    hippocampal neurons, hearing loss, cardiovascular malformations including
    perimembranous ventricular septal defects, spontaneous cardiac fibrosis, and
    renal agenesis. This is the model ClinGen cites as recapitulating the human
    phenotype.
  evidence:
  - reference: PMID:23451234
    reference_title: "An allelic series of mice reveals a role for RERE in the development of multiple organs affected in chromosome 1p36 deletions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we created an allelic series of RERE-deficient mice using an Rere-null allele, om, and a novel hypomorphic Rere allele, eyes3 (c.578T>C, p.Val193Ala), which we identified in an N-ethyl-N-nitrosourea (ENU)-based screen for autosomal recessive phenotypes"
    explanation: >-
      Defines the genotypes making up the allelic series and how the hypomorphic
      allele was obtained.
  modeled_mechanisms:
  - target: Multisystem Developmental Field Defect
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A single graded reduction in Rere dosage produces the coordinated
      eye/brain/ear/heart/kidney phenotype that defines the human disorder,
      which is the central claim of the convergence node.
    limitations: >-
      The series models reduced dosage (null and hypomorphic alleles), so it
      speaks to the human loss-of-function class. It does not knock in the human
      histidine-rich-region missense or in-frame duplication alleles, so the
      proposed gain-of-function/dominant-negative arm of the human disorder is
      not modeled here. Null homozygotes die at E9.5-E11.5, and some allelic
      combinations are perinatally lethal, limiting adult and behavioural
      phenotyping.
    readouts:
    - name: Multi-organ malformation spectrum
      target: Multisystem Developmental Field Defect
      direction: ALTERED
      interpretation: >-
        Coordinated structural anomalies across eye, brain, inner ear, heart, and
        kidney in one dosage series.
      evidence:
      - reference: PMID:23451234
        reference_title: "An allelic series of mice reveals a role for RERE in the development of multiple organs affected in chromosome 1p36 deletions."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Analyses of these mice revealed microphthalmia, postnatal growth deficiency, brain hypoplasia, decreased numbers of neuronal nuclear antigen (NeuN)-positive hippocampal neurons, hearing loss, cardiovascular malformations-aortic arch anomalies, double outlet right ventricle, and transposition of the great arteries, and perimembranous ventricular septal defects-spontaneous development of cardiac fibrosis and renal agenesis."
        explanation: >-
          The enumerated multi-organ phenotype of the allelic series, which is
          the measurement grounding this readout.
    evidence:
    - reference: PMID:23451234
      reference_title: "An allelic series of mice reveals a role for RERE in the development of multiple organs affected in chromosome 1p36 deletions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings suggest that RERE plays a critical role in the development and function of multiple organs including the eye, brain, inner ear, heart and kidney."
      explanation: >-
        Supports treating this model as informative for the multisystem
        convergence node.
  - target: Disrupted Ocular Morphogenesis and Retinal Cell Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      RERE-deficient mice develop retinal and optic nerve atrophy through
      apoptosis and progressive loss of retinal cells, with reduced retinal
      ganglion cell numbers — the cellular mechanism behind the human optic nerve
      findings.
    limitations: >-
      The degenerative retinal ganglion cell mechanism is characterised in mice;
      no human histopathology confirms that the same cellular process underlies
      the optic nerve hypoplasia and atrophy seen in patients.
    readouts:
    - name: Retinal ganglion cell number
      target: Disrupted Ocular Morphogenesis and Retinal Cell Loss
      direction: DECREASED
      interpretation: >-
        Loss of retinal ganglion cells is the proximate cause of the optic nerve
        atrophy in this model.
      evidence:
      - reference: PMID:33742727
        reference_title: "RERE deficiency causes retinal and optic nerve atrophy through degeneration of retinal cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The number of RGCs is also reduced in RERE-deficient embryos and mice."
        explanation: >-
          Direct measurement of reduced retinal ganglion cell number in the
          model.
    evidence:
    - reference: PMID:33742727
      reference_title: "RERE deficiency causes retinal and optic nerve atrophy through degeneration of retinal cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ophthalmological defects are seen in approximately one third of individuals with NEDBEH and in RERE-deficient mice which can serve as a useful animal model."
      explanation: >-
        The authors' own statement that the RERE-deficient mouse is a useful
        model for the human ocular phenotype.
- name: Endocardium-specific Rere conditional knockout mouse
  species: Mouse
  genotype: Rere flox/flox with endocardial Cre driver
  publication: PMID:30061196
  description: >
    Tissue-specific ablation of Rere in the endocardium produces hypocellular
    atrioventricular endocardial cushions, defective epithelial-to-mesenchymal
    transition, and ventricular septal defects — but does NOT reduce GATA4
    expression. This model is what separates the cell-autonomous endocardial
    requirement for RERE from the GATA4-mediated arm, and is the reason this
    entry does not present GATA4 as the sole effector.
  evidence:
  - reference: PMID:30061196
    reference_title: "RERE deficiency leads to decreased expression of GATA4 and the development of ventricular septal defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tissue-specific ablation of Rere in the endocardium leads to hypocellularity of the AV endocardial cushions, defective EMT and VSDs, but does not result in decreased GATA4 expression."
    explanation: >-
      Establishes both the endocardial phenotype and the dissociation from GATA4
      that this model contributes.
  modeled_mechanisms:
  - target: Impaired Endocardial EMT in the Atrioventricular Cushions
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Endocardium-restricted Rere loss is sufficient to produce the defective
      cushion EMT and ventricular septal defects modeled by this node.
    limitations: >-
      Conditional homozygous ablation in one tissue is a more severe and more
      spatially restricted perturbation than the heterozygous germline variants
      that cause human disease, so it demonstrates sufficiency of endocardial
      RERE loss rather than reproducing the human allelic state.
    readouts:
    - name: Atrioventricular endocardial cushion mesenchymal cellularity
      target: Impaired Endocardial EMT in the Atrioventricular Cushions
      direction: DECREASED
      interpretation: >-
        Hypocellular cushions are the structural readout of failed endocardial
        EMT in this model.
      evidence:
      - reference: PMID:30061196
        reference_title: "RERE deficiency leads to decreased expression of GATA4 and the development of ventricular septal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Tissue-specific ablation of Rere in the endocardium leads to hypocellularity of the AV endocardial cushions, defective EMT and VSDs"
        explanation: >-
          The measured cushion hypocellularity and EMT defect grounding this
          readout.
    evidence:
    - reference: PMID:30061196
      reference_title: "RERE deficiency leads to decreased expression of GATA4 and the development of ventricular septal defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the endocardium, RERE colocalizes with GATA4, a transcription factor required for normal levels of EMT and mesenchymal cell proliferation."
      explanation: >-
        Supports treating the endocardium as the relevant compartment for this
        mechanism node.
- name: Wnt1-Cre cranial neural crest Rere conditional knockout mouse
  species: Mouse
  genotype: Rere flox/flox; Wnt1-Cre
  background: C57BL/6
  publication: PMID:33772547
  description: >
    Ablation of Rere in cranial neural crest cells delays elevation of the palatal
    shelves and produces cleft palate, with significantly reduced proliferation of
    palatal shelf mesenchymal cells. Establishes that RERE expression in cranial
    neural crest and its derivatives is required for normal palatal development.
  evidence:
  - reference: PMID:33772547
    reference_title: "RERE deficiency contributes to the development of orofacial clefts in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RERE expression in CNC cells and their derivatives is required for normal palatal development"
    explanation: >-
      The authors' conclusion, establishing the cranial neural crest requirement
      that this model demonstrates.
  modeled_mechanisms:
  - target: Reduced Palatal Shelf Mesenchymal Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cranial-neural-crest-restricted Rere loss reproduces the delayed palatal
      shelf elevation and reduced mesenchymal proliferation modeled by this node.
    limitations: >-
      Fidelity is MODERATE rather than HIGH because orofacial clefting is common
      in RERE-deficient mice on this background but has been reported in only two
      individuals with NEDBEH (one cleft lip, one cleft palate). The mouse
      therefore over-represents the human penetrance of this feature, and the
      conditional homozygous ablation is again more severe than the human
      heterozygous state.
    readouts:
    - name: Palatal shelf mesenchymal cell proliferation
      target: Reduced Palatal Shelf Mesenchymal Proliferation
      direction: DECREASED
      interpretation: >-
        Reduced mesenchymal proliferation is the cellular defect underlying the
        delayed shelf elevation and cleft palate.
      evidence:
      - reference: PMID:33772547
        reference_title: "RERE deficiency contributes to the development of orofacial clefts in humans and mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "proliferation of mesenchymal cells in the palatal shelves is significantly reduced in Rereflox/flox; Wnt1-Cre embryos"
        explanation: >-
          The measured proliferation deficit grounding this readout.
    evidence:
    - reference: PMID:33772547
      reference_title: "RERE deficiency contributes to the development of orofacial clefts in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We confirm that RERE is broadly expressed in the palate during mouse embryonic development"
      explanation: >-
        Expression evidence supporting the palate as a RERE-dependent tissue and
        so the relevance of this model to the node.
- name: Zebrafish rerea (babyface) mutant
  species: Zebrafish
  genotype: rerea tb210/tb210 (babyface), Y361X nonsense in the SANT domain
  publication: PMID:36576487
  description: >
    The zebrafish rerea mutant recapitulates the optic fissure closure defect of
    human NEDBEH, with an enlarged optic stalk, coloboma, and disruption of the
    optic stalk/neuroretina boundary. Mechanistically the defect tracks with
    deregulated shh signaling: expanded fgf8 and pax2a domains, reduced vax1 in
    the optic stalk, and — the decisive experiment — pharmacological rescue of
    the coloboma by the shh inhibitor HPI-1. The same study tested
    NEDBEH-associated human RERE variants and found them hypomorphic for shh
    repression, which is what connects the fish phenotype to the human alleles.
  evidence:
  - reference: PMID:36576487
    reference_title: "Zebrafish model of RERE syndrome recapitulates key ophthalmic defects that are rescued by small molecule inhibitor of shh signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Zebrafish rerea mutants exhibit OS and optic fissure closure defects. The optic fissure closure defect was rescued by an shh signaling inhibitor"
    explanation: >-
      Establishes the phenotype and the pharmacological rescue that makes this
      model mechanistically informative.
  modeled_mechanisms:
  - target: Disrupted Ocular Morphogenesis and Retinal Cell Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mutant reproduces the failure of optic fissure closure that produces
      coloboma in humans, and identifies deregulated shh signaling as the
      responsible pathway by rescuing the defect pharmacologically.
    limitations: >-
      The mutant is a homozygous nonsense allele in a teleost, whereas human
      disease is heterozygous; the coloboma is only ~70% penetrant and variable
      between clutches; and microphthalmia present at 3 dpf is no longer
      detectable at 5 dpf. The model captures the patterning arm of the ocular
      phenotype, not the retinal ganglion cell degeneration arm shown in mice.
    readouts:
    - name: Optic fissure margin apposition and coloboma
      target: Disrupted Ocular Morphogenesis and Retinal Cell Loss
      direction: RESTORED
      interpretation: >-
        Coloboma is rescued by shh inhibition, establishing deregulated shh
        signaling as causal for the fissure closure defect in this model.
      evidence:
      - reference: PMID:36576487
        reference_title: "Zebrafish model of RERE syndrome recapitulates key ophthalmic defects that are rescued by small molecule inhibitor of shh signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Inhibiting shh signaling by the protein inhibitor HPI-1 rescues coloboma, confirming our observation that coloboma in rerea mutants is indeed due to deregulation of shh signaling."
        explanation: >-
          The rescue experiment grounding the RESTORED direction of this readout.
    evidence:
    - reference: PMID:36576487
      reference_title: "Zebrafish model of RERE syndrome recapitulates key ophthalmic defects that are rescued by small molecule inhibitor of shh signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that the zebrafish rerea mutant (babyface) robustly recapitulates optic fissure closure defects resulting from loss of RERE function, as observed in humans."
      explanation: >-
        Supports treating the fish mutant as informative for the human ocular
        morphogenesis node.
experimental_models:
- name: ReMut CRISPR/Cas9 RERE frameshift knock-in cell line
  experimental_model_type: CELL_LINE
  description: >
    A cell line carrying the patient's RERE frameshift variant
    (c.3732delC, p.Tyr1245Thrfs*12), generated by CRISPR/Cas9 genome editing and
    profiled by RNA sequencing and mass spectrometry. The line showed 3,790
    differentially expressed genes and 684 differentially expressed proteins,
    with SHH signaling downregulated and Hippo signaling upregulated, plus
    altered HDAC1 and HDAC2 — the two histone deacetylase members of the WHHERE
    complex through which RERE acts. It is the only patient-variant-matched
    cellular model in this entry.
  evidence:
  - reference: PMID:38018232
    reference_title: "A de novo variant in RERE causes autistic behavior by disrupting related genes and signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we generated an RERE point mutation cell line (ReMut) using CRISPR/Cas9 Targeted Genome Editing"
    explanation: >-
      Establishes the existence and construction of the patient-variant-matched
      cell line.
  modeled_mechanisms:
  - target: Deregulated Developmental Morphogen Signaling
    relationship: MEASURES
    fidelity: LOW
    description: >-
      The line measures transcriptomic and proteomic consequences of a patient
      RERE frameshift allele, including the direction of SHH pathway change and
      perturbation of the WHHERE complex deacetylases.
    limitations: >-
      Fidelity is LOW: a single edited cell line is not a developing embryo, and
      the direction of the SHH change (downregulated) is opposite to the
      de-repression inferred from the zebrafish variant assays. It also carries
      one frameshift allele, so it speaks only to the loss-of-function class. No
      independent replication of these omics findings has been reported.
    readouts:
    - name: HDAC1 and HDAC2 abundance
      target: Deregulated Developmental Morphogen Signaling
      direction: ALTERED
      interpretation: >-
        Perturbation of the two histone deacetylase subunits of the WHHERE
        complex, the complex through which RERE regulates retinoic acid targets.
      evidence:
      - reference: PMID:38018232
        reference_title: "A de novo variant in RERE causes autistic behavior by disrupting related genes and signaling pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we noted alterations in HDAC1 and HDAC2, which are members of the WHHERE complex, suggesting their role in the pathogenesis of this patient"
        explanation: >-
          The measured change in WHHERE complex components grounding this
          readout.
    evidence:
    - reference: PMID:38018232
      reference_title: "A de novo variant in RERE causes autistic behavior by disrupting related genes and signaling pathway."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "We identified 3790 differentially expressed genes and 684 differentially expressed proteins."
      explanation: >-
        Establishes that the line yields genome-wide molecular readouts. Marked
        PARTIAL because a differential-expression count supports that the model
        measures something, not that it faithfully represents the human
        mechanism — hence the LOW fidelity.
discussions:
- discussion_id: rere_hrr_mechanism_gof_vs_dominant_negative
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do histidine-rich-region missense and in-frame variants in RERE act by gain
    of function or by dominant negative interference, and is either mechanism
    reconcilable with ClinGen's loss-of-function classification?
  attaches_to:
  - pathophysiology#RERE Nuclear Receptor Co-regulator Dysfunction
  rationale: >-
    The 2026 cohort found HRR missense variants to be structurally stabilizing
    and proposed "a gain-of-function or dominant-negative mechanism" without
    distinguishing between them. The two make different predictions: a
    dominant-negative allele would poison RERE-containing complexes such as
    WHHERE and so behave worse than a null, whereas a gain-of-function allele
    would drive RA-target transcription inappropriately. The distinction is not
    academic — it determines whether dosage-restoration approaches would help or
    harm this variant class, and it is currently unresolved in the entry's
    causal graph, where the trigger node carries DECREASED co-regulator activity
    modifiers that fit the loss-of-function class better than the HRR class.
    ClinGen's 2023 expert-panel curation, which predates the protein modeling,
    records the mechanism as loss of function, so the KB currently holds two
    mechanistic accounts of the same gene that have not been reconciled.

    A paralog precedent is worth weighing. RERE's atrophin-family paralog ATN1
    carries a conserved 16-amino-acid "HX repeat" motif in which de novo missense
    and insertion variants cause CHEDDA — a congenital, NON-progressive
    neurocognitive syndrome distinct from the polyglutamine neurodegeneration of
    DRPLA. Those variants are proposed to act by perturbing the structural
    integrity of the HX motif rather than by loss of dosage, and the same paper
    identifies RERE as carrying a similar HX-repeat motif in which disruptive
    variants cause a separate congenital condition. That is a structurally
    analogous, non-haploinsufficient mechanism in the nearest paralog, which
    makes a structure-perturbing (dominant-negative or neomorphic) reading of the
    RERE HRR class more plausible than a dosage reading. It is a precedent, not
    proof: the ATN1 motif is an HX repeat and the RERE hotspot is described as a
    histidine-rich region, and no experiment has yet shown the two behave alike.
  evidence:
  - reference: PMID:30827498
    reference_title: "De Novo Variants Disrupting the HX Repeat Motif of ATN1 Cause a Recognizable Non-Progressive Neurocognitive Syndrome."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "We found several non-homologous human genes containing similar motifs of eight to 10 HX repeat sequences, including RERE, where disruptive variants in this motif have also been linked to a separate condition that causes neurocognitive and congenital anomalies."
    explanation: >-
      Establishes the paralog precedent explicitly naming RERE. Marked PARTIAL
      because it bears on the plausibility of a structure-perturbing mechanism in
      RERE without testing it — the question this discussion holds open.
      evidence_source is COMPUTATIONAL, not HUMAN_CLINICAL: although the paper's
      core is an eight-individual cohort, THIS quoted claim is a cross-gene
      sequence-motif search, and the SOP directs splitting a mixed-source paper
      so each item carries the source of the claim it is cited for.
  - reference: PMID:30827498
    reference_title: "De Novo Variants Disrupting the HX Repeat Motif of ATN1 Cause a Recognizable Non-Progressive Neurocognitive Syndrome."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "CHEDDA-related variants alter the particular structural features of the HX repeat motif, suggesting that CHEDDA results from perturbation of the structural and functional integrity of the HX repeat."
    explanation: >-
      States the structure-perturbation mechanism proposed for the paralog, the
      specific alternative to haploinsufficiency that this discussion weighs for
      the RERE HRR class. PARTIAL for the same reason: it is about ATN1.
      COMPUTATIONAL because the quoted claim is a structural inference about the
      motif rather than a clinical observation from the cohort.
  proposed_experiments:
  - experiment_id: hrr_knockin_mouse
    name: Allele-specific knock-in mouse for a recurrent HRR variant
    description: >-
      Knock the recurrent c.4313_4318dupTCCACC duplication into the mouse Rere
      locus and compare heterozygotes against Rere+/- heterozygotes on the same
      background. A dominant-negative allele should produce a phenotype more
      severe than the null heterozygote; a pure gain-of-function allele should
      produce a qualitatively different one. Every existing mouse model in this
      entry is a dosage-reduction model, so this comparison has never been made.
  - experiment_id: whhere_complex_assembly_assay
    name: Complex-composition assay for WHHERE assembly
    description: >-
      Compare co-immunoprecipitation of WDR5, HDAC1, HDAC2, and EHMT2 with
      wild-type versus HRR-variant RERE, and measure RA-response-element
      reporter output for each. Dominant negative predicts intact complex
      assembly with reduced transcriptional output; gain of function predicts
      increased output.
- discussion_id: rere_shh_direction_conflict
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is SHH signaling de-repressed or downregulated by pathogenic RERE variants in
    human tissue, given that the zebrafish and cell-line models disagree on the
    direction?
  attaches_to:
  - pathophysiology#Deregulated Developmental Morphogen Signaling
  rationale: >-
    Two model systems give opposite directions. In zebrafish, NEDBEH-associated
    human RERE variants are hypomorphic for shh repression — implying that losing
    RERE de-represses hedgehog signaling — and the coloboma is rescued by an shh
    inhibitor, which only makes sense if signaling is excessive. In the ReMut
    CRISPR cell line carrying a patient frameshift allele, the SHH pathway was
    instead found downregulated. Both cannot describe the same directional
    change in human developing tissue. Plausible reconciliations include
    tissue-specificity (optic stalk versus the edited cell type),
    developmental-stage dependence, or an allele-class difference between the
    missense variants assayed in fish and the frameshift carried by the cell
    line. Until this is resolved the entry deliberately carries a DYSREGULATED
    modifier on the smoothened signaling annotation rather than INCREASED or
    DECREASED, and the shh-inhibitor rescue must not be read as a therapeutic
    lead for human NEDBEH.
  proposed_experiments:
  - experiment_id: patient_organoid_shh_direction
    name: Directional SHH readout in patient-derived neural and retinal organoids
    description: >-
      Differentiate iPSC lines from individuals carrying an HRR missense variant
      and a loss-of-function variant into retinal organoids, and measure GLI1 and
      PTCH1 transcript levels against isogenic controls at matched
      developmental stages. This tests direction in human tissue, by allele
      class, at the stage when the optic fissure is closing.
- discussion_id: rere_gata4_independent_endocardial_effector
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which RERE-dependent transcriptional targets other than GATA4 mediate the
    cell-autonomous requirement for RERE in endocardial EMT?
  attaches_to:
  - pathophysiology#Impaired Endocardial EMT in the Atrioventricular Cushions
  rationale: >-
    RERE positively regulates Gata4 transcription and Gata4 levels fall in the AV
    canal of RERE-deficient embryos, which supplies a clean account of the septal
    defects. But endocardium-specific Rere ablation produces hypocellular
    cushions, defective EMT, and ventricular septal defects WITHOUT reducing
    GATA4 — so within the endocardium itself, GATA4 cannot be the effector. The
    authors state this limitation explicitly. The entry therefore keeps a node
    whose named mechanism is only partly sufficient, and the missing effector is
    a genuine gap rather than a curation omission.
  proposed_experiments:
  - experiment_id: endocardial_transcriptomics_gata4_independent
    name: Endocardial-restricted transcriptomics of Rere conditional knockouts
    description: >-
      RNA-seq of sorted endocardial cells from Rere-flox; endocardial-Cre AV
      canals versus controls at the stage of cushion EMT, filtering for
      EMT-regulatory genes that change while Gata4 does not. Candidate effectors
      can then be tested for rescue of cushion cellularity.
- discussion_id: rere_phenotype_frequency_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the frequency of each organ-system anomaly in NEDBEH, stratified by
    variant class?
  attaches_to:
  - pathophysiology#Multisystem Developmental Field Defect
  rationale: >-
    The disorder is named for anomalies that are explicitly optional ("with or
    without"), so per-organ frequency is the clinically decisive number — it
    drives which investigations a newly diagnosed child needs. It is also the
    number the literature is weakest on. GeneReviews describes features
    qualitatively ("common", "may include") without percentages; the largest
    cohort reports that the neurodevelopmental features are prevalent across all
    groups and that HRR variants carry more multisystem burden, but this entry
    could not extract per-organ percentages by class from the available
    abstract. Most phenotypes in this entry therefore deliberately carry no
    `frequency:` value rather than a guessed band, and several rest on single
    case reports. Closing this gap requires the full cohort tables, not another
    case report.
  proposed_experiments:
  - experiment_id: cohort_frequency_extraction
    name: Per-organ frequency extraction from the 54-individual cohort tables
    description: >-
      Extract the per-phenotype counts by variant subcohort from the full text
      and supplementary tables of PMID:41988794 and band each phenotype in this
      entry against them, recording the denominator for each. This is a curation
      task rather than a laboratory experiment, and is the single highest-yield
      improvement available to this entry.
notes: >
  Curation scope note. This entry is anchored on MONDO:0014857 (NEDBEH,
  OMIM:616975), the RERE entity. Two nearby entities were deliberately kept out
  and should not be merged in by later curation. First, proximal 1p36 deletion
  syndrome: RERE lies in its critical region and NEDBEH phenocopies much of it,
  but the deletion is a contiguous-gene disorder involving other genes, so its
  epidemiology is recorded here only as explicitly labelled context and its
  phenotypes are not imported. Second, CDK19-related developmental and epileptic
  encephalopathy (DEE87, OMIM:618916), which surfaced during deep research under
  a similar-sounding description; it is a separate gene-disease relationship and
  is not part of this entity.

  Both deep-research reports used for this entry passed the `just preflight-dr`
  Named Entity Confusion check against MONDO:0014857 (RERE mentioned 64 and 52
  times respectively, dominant over every rival gene, with report OMIM
  identifiers matching the MONDO xref).

  Frequency discipline: most phenotypes here carry no `frequency:` value. This is
  deliberate. The available sources describe features qualitatively rather than
  quantitatively, and several phenotypes (Chiari type I malformation, nocturnal
  enuresis, orofacial clefting, choanal atresia) rest on one or two reported
  individuals, which supports no FrequencyEnum band at all. See the
  `rere_phenotype_frequency_gap` discussion.

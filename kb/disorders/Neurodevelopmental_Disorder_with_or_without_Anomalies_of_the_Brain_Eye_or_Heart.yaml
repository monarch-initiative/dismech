prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence or incidence estimate has been published for
    NEDBEH, and none is asserted here. The published literature consists of
    successively larger genotype-first case series — ten individuals in the
    original 2016 report, nineteen by 2018, twenty-three by 2022, and 54 in the
    2026 expanded cohort. Ascertainment is by clinical/research exome sequencing
    and GeneMatcher, so these are cumulative case counts, not a population rate.
  evidence:
  - reference: PMID:41988794
    reference_title: "New genotype-phenotype correlations and management recommendations for individuals with RERE variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assembled a cohort of 54 individuals with heterozygous pathogenic, likely pathogenic, and variants of uncertain significance in RERE, including 30 previously unreported cases."
    explanation: >-
      Establishes the largest published case tally to date. This is a literature
      cohort assembled by genotype-first ascertainment, not a population rate,
      hence measure_type CASES_IN_LITERATURE and prevalence_class
      NOT_YET_DOCUMENTED.
- population: Newborns (proximal 1p36 deletion syndrome, contextual only)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 20.0
  notes: >-
    Contextual figure for the contiguous-gene deletion syndrome that encompasses
    RERE, NOT a prevalence for RERE-variant NEDBEH. Recorded because the two
    entities overlap phenotypically and this is the only occurrence figure
    available in the RERE literature. Only a fraction of 1p36 deletions produce
    the NEDBEH phenotype through RERE, and isolated RERE-variant NEDBEH is far
    rarer than this. Do not read this row as an estimate for this entry.
  evidence:
  - reference: PMID:27087320
    reference_title: "De Novo Mutations of RERE Cause a Genetic Syndrome with Features that Overlap Those Associated with Proximal 1p36 Deletions."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletions of chromosome 1p36 affect approximately 1 in 5,000 newborns and are associated with developmental delay, intellectual disability, and defects involving the brain, eye, ear, heart, and kidney."
    explanation: >-
      Supports the 1p36 deletion birth prevalence only. Marked PARTIAL because
      the quoted rate is for the deletion syndrome, not for NEDBEH caused by
      intragenic RERE variants, which has no published population rate.
inheritance:
- name: Autosomal dominant RERE-related disorder
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  de_novo_rate: >-
    The great majority of pathogenic RERE variants arise de novo; in the original
    cohorts every variant for which both parental samples were available was
    proven de novo. Transmission from a mildly symptomatic or asymptomatic parent
    is now documented, and is concentrated among loss-of-function alleles.
  description: >-
    Heterozygous RERE variants are sufficient to cause disease. GeneReviews
    quotes an empiric sibling recurrence risk of about 1% when the proband's
    variant is not found in either parent, reflecting the possibility of parental
    germline mosaicism.
  evidence:
  - reference: PMID:30896913
    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RERE-related disorders are inherited in an autosomal dominant manner and are typically caused by a de novo pathogenic variant."
    explanation: >-
      GeneReviews states the mode of inheritance and the predominance of de novo
      occurrence.
  - reference: PMID:30896913
    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the risk to sibs is low (~1%) but greater than that of the general population because of the possibility of parental germline mosaicism for the pathogenic variant"
    explanation: >-
      Source for the empiric sibling recurrence risk and the germline-mosaicism
      rationale behind it.
  - reference: PMID:41988794
    reference_title: "New genotype-phenotype correlations and management recommendations for individuals with RERE variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function variants are associated with fewer multisystem anomalies than missense variants and are more likely to be inherited from a mildly symptomatic or asymptomatic parent."
    explanation: >-
      Documents that inherited cases occur and that they are concentrated in the
      loss-of-function allelic class, which is the basis for the VARIABLE
      expressivity call.
  - reference: PMID:36053530
    reference_title: "Phenotypic variability in RERE-related disorders and the first report of an inherited variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also describe the first inherited variant in RERE, found in a patient (case 2) with developmental delay, autism, and hyperopia and his mother (case 3) with ADHD, myopia, and history of mild speech delay."
    explanation: >-
      First documented parent-to-child transmission, with a markedly milder
      maternal phenotype — the concrete instance of the variable expressivity
      recorded here.
pathophysiology:
- name: RERE Nuclear Receptor Co-regulator Dysfunction
  biological_scale: MOLECULAR
  description: >
    The initiating lesion is a heterozygous pathogenic variant in RERE at
    1p36.23. RERE encodes a large, widely expressed atrophin-family nuclear
    receptor co-regulator (atrophin-2) that scaffolds transcriptional complexes
    through its ELM2, SANT, and Atrophin-1 domains. Two mechanistically distinct
    allelic classes converge on this node. Nonsense, frameshift, canonical
    splice-site, and whole- or partial-gene deletion alleles reduce RERE dosage
    by haploinsufficiency, with nonsense-mediated decay demonstrated for at least
    one frameshift allele. Missense and in-frame variants clustering in a
    histidine-rich region (HRR) of the Atrophin-1 domain are instead
    structurally stabilizing, which is why they are proposed to act by a
    gain-of-function or dominant-negative mechanism rather than by simple loss of
    dosage — and why they carry a heavier multisystem burden.
  molecular_functions:
  - preferred_term: transcription coactivator activity
    term:
      id: GO:0003713
      label: transcription coactivator activity
    modifier: DECREASED
  - preferred_term: transcription corepressor activity
    term:
      id: GO:0003714
      label: transcription corepressor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27087320
    reference_title: "De Novo Mutations of RERE Cause a Genetic Syndrome with Features that Overlap Those Associated with Proximal 1p36 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings suggest that mutations in RERE cause a genetic syndrome and that haploinsufficiency of RERE might be sufficient to cause many of the phenotypes associated with proximal 1p36 deletions"
    explanation: >-
      Establishes RERE variants as the cause of the syndrome and haploinsufficiency
      as a sufficient mechanism for the loss-of-function allelic class.
  - reference: PMID:41988794
    reference_title: "New genotype-phenotype correlations and management recommendations for individuals with RERE variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HRR missense variants were structurally stabilizing, suggesting a gain-of-function or dominant-negative mechanism."
    explanation: >-
      Source for the second allelic class and for the claim that it does not act
      by simple loss of dosage. Protein modeling in the 54-individual cohort.
  - reference: PMID:29330883
    reference_title: "Genotype-phenotype correlations in individuals with pathogenic RERE variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A high percentage of RERE pathogenic variants affect a histidine-rich region in the Atrophin-1 domain."
    explanation: >-
      Locates the mutational hotspot in the Atrophin-1 histidine-rich region that
      defines the second allelic class.
  - reference: PMID:40890291
    reference_title: "A de novo variant of RERE was identified in a patient with neurodevelopmental disorder, enuresis and scoliosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Real-time PCR confirmed that the novel variant may reduce the mRNA levels of RERE due to nonsense-mediated mRNA decay."
    explanation: >-
      Direct patient-derived evidence that a frameshift allele lowers RERE
      transcript abundance, supporting the haploinsufficiency arm.
  downstream:
  - target: Impaired RERE-Dependent Retinoic Acid Signaling
    causal_link_type: DIRECT
    description: >-
      Reduced or functionally altered RERE compromises the retinoic-acid
      co-activator complexes it nucleates.
- name: Impaired RERE-Dependent Retinoic Acid Signaling
  biological_scale: MOLECULAR
  description: >
    RERE is a positive regulator of retinoic acid (RA) signaling. It forms a
    complex with NR2F2, p300, and a retinoic acid receptor that is recruited to
    the retinoic acid response elements of RA target genes such as the Rarb
    promoter, and knockdown of NR2F2 and/or RERE decreases RA signaling. RERE is
    also the co-repressor-recruiting subunit of the WHHERE complex (Wdr5, Hdac1,
    Hdac2, Rere), which together with the RERE-binding histone methyltransferase
    Ehmt2/G9a becomes enriched at RA target genes upon RA treatment to promote
    RNA polymerase II recruitment. Loss of this activity blunts the
    RA-dependent transcriptional programs that pattern the embryo. Because RA
    acts as a morphogen across hindbrain, eye, heart, otic, and renal
    development, a single lesion here propagates into anomalies of several
    organs at once.
  molecular_functions:
  - preferred_term: histone deacetylase binding
    term:
      id: GO:0042826
      label: histone deacetylase binding
  biological_processes:
  - preferred_term: retinoic acid receptor signaling pathway
    term:
      id: GO:0048384
      label: retinoic acid receptor signaling pathway
    modifier: DECREASED
  - preferred_term: somitogenesis
    term:
      id: GO:0001756
      label: somitogenesis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20164929
    reference_title: "Rere controls retinoic acid signalling and somite bilateral symmetry."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rere forms a complex with Nr2f2, p300 (also known as Ep300) and a retinoic acid receptor, which is recruited to the retinoic acid regulatory element of retinoic acid targets, such as the Rarb promoter."
    explanation: >-
      Defines the co-activator complex through which RERE positively regulates
      retinoic acid target-gene transcription.
  - reference: PMID:20164929
    reference_title: "Rere controls retinoic acid signalling and somite bilateral symmetry."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the knockdown of Nr2f2 and/or Rere decreases retinoic acid signalling, suggesting that this complex is required to promote transcriptional activation of retinoic acid targets"
    explanation: >-
      Demonstrates that loss of RERE lowers RA signaling output, the directional
      claim carried by the DECREASED modifier on this node.
  - reference: PMID:28959017
    reference_title: "The WHHERE coactivator complex is required for retinoic acid-dependent regulation of embryonic symmetry."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we identify a protein complex, containing Wdr5, Hdac1, Hdac2 and Rere (named WHHERE), which regulates RA signaling and controls embryonic symmetry"
    explanation: >-
      Identifies the WHHERE complex and RERE's membership in it, the basis for
      the histone deacetylase binding annotation.
  - reference: PMID:28959017
    reference_title: "The WHHERE coactivator complex is required for retinoic acid-dependent regulation of embryonic symmetry."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Upon RA treatment, WHHERE and Ehmt2 become enriched at RA target genes to promote RNA polymerase II recruitment."
    explanation: >-
      Gives the chromatin-level mechanism by which the RERE-containing complex
      activates RA targets.
  - reference: PMID:23451234
    reference_title: "An allelic series of mice reveals a role for RERE in the development of multiple organs affected in chromosome 1p36 deletions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "encodes a nuclear receptor coregulator that plays a critical role in embryonic development as a positive regulator of retinoic acid signaling"
    explanation: >-
      States RERE's function as a positive regulator of RA signaling in
      embryonic development.
  downstream:
  - target: Deregulated Developmental Morphogen Signaling
    causal_link_type: DIRECT
    description: >-
      RA-dependent transcriptional programs constrain SHH and FGF8 signaling
      during patterning; losing that constraint deregulates them.
  - target: Disrupted Ocular Morphogenesis and Retinal Cell Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Impaired Endocardial EMT in the Atrioventricular Cushions
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Impaired Brain Growth and Hindbrain Patterning
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Reduced Palatal Shelf Mesenchymal Proliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Deregulated Developmental Morphogen Signaling
  biological_scale: CELLULAR
  description: >
    RERE normally restrains sonic hedgehog (shh) and fgf8 signaling during
    patterning. NEDBEH-associated human RERE variants behave as hypomorphs in
    their ability to repress shh signaling, and some show abnormal nuclear
    localization. In the zebrafish rerea mutant this manifests as expanded fgf8
    and pax2a expression domains in the optic stalk with reduced vax1, and in a
    patient-derived CRISPR knock-in cell line as downregulated SHH signaling
    with reciprocal upregulation of the Hippo pathway. The direction of the shh
    change differs between these systems, which is recorded as an open question
    rather than resolved here.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:36576487
    reference_title: "Zebrafish model of RERE syndrome recapitulates key ophthalmic defects that are rescued by small molecule inhibitor of shh signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we determined that NEDBEH-associated human RERE variants function as hypomorphs in their ability to repress shh signaling and some exhibit abnormal nuclear localization"
    explanation: >-
      Directly tests human NEDBEH variants for shh repression and finds them
      hypomorphic, linking the human alleles to deregulated hedgehog signaling.
  - reference: PMID:38018232
    reference_title: "A de novo variant in RERE causes autistic behavior by disrupting related genes and signaling pathway."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The SHH signaling pathway was found to be downregulated, and the Hippo pathway was upregulated in ReMut."
    explanation: >-
      Independent evidence that a patient RERE frameshift allele perturbs SHH
      signaling in a CRISPR-engineered cell line. Marked PARTIAL because the
      direction of change is opposite to the de-repression inferred in the
      zebrafish model; the node's modifier is therefore DYSREGULATED rather than
      INCREASED or DECREASED.
  downstream:
  - target: Disrupted Ocular Morphogenesis and Retinal Cell Loss
    causal_link_type: DIRECT
    description: >-
      Deregulated shh/fgf8 signaling expands the optic stalk and prevents the
      optic fissure margins from apposing.
- name: Disrupted Ocular Morphogenesis and Retinal Cell Loss
  biological_scale: TISSUE
  description: >
    Two separable ocular mechanisms operate. First, a patterning defect: the
    zebrafish rerea (babyface) mutant recapitulates the optic fissure closure
    defect seen in humans, arising from expansion of the proximal retinal optic
    stalk and reduced expression of ventral retinal fate genes; inhibiting shh
    signaling with HPI-1 rescues the coloboma, establishing deregulated shh as
    causal in that model. Second, a cell-survival defect: RERE is expressed in a
    subset of retinal ganglion cells, the lens epithelium, and the ciliary body,
    and RERE-deficient mice show apoptosis of retinal cells in the ganglion cell
    layer from E17.5, reduced retinal ganglion cell numbers, and consequent
    retinal and optic nerve atrophy. Together these account for the coloboma,
    microphthalmia, and optic nerve findings of NEDBEH.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: closure of optic fissure
    term:
      id: GO:0061386
      label: closure of optic fissure
    modifier: DECREASED
  evidence:
  - reference: PMID:36576487
    reference_title: "Zebrafish model of RERE syndrome recapitulates key ophthalmic defects that are rescued by small molecule inhibitor of shh signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that the zebrafish rerea mutant (babyface) robustly recapitulates optic fissure closure defects resulting from loss of RERE function, as observed in humans."
    explanation: >-
      Establishes failure of optic fissure closure as the morphogenetic lesion
      behind coloboma in RERE deficiency.
  - reference: PMID:36576487
    reference_title: "Zebrafish model of RERE syndrome recapitulates key ophthalmic defects that are rescued by small molecule inhibitor of shh signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These defects result from expansion of proximal retinal optic stalk (OS) and reduced expression of some of the ventral retinal fate genes due to deregulated protein signaling."
    explanation: >-
      Gives the tissue-level patterning mechanism — optic stalk expansion at the
      expense of ventral retinal identity.
  - reference: PMID:33742727
    reference_title: "RERE deficiency causes retinal and optic nerve atrophy through degeneration of retinal cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that RERE deficiency causes progressive loss of retinal cells and apoptosis of retinal cells in the ganglion cell layer as early as E17.5."
    explanation: >-
      Documents the second, degenerative arm — retinal ganglion cell apoptosis
      beginning in late gestation.
  - reference: PMID:33742727
    reference_title: "RERE deficiency causes retinal and optic nerve atrophy through degeneration of retinal cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RERE is required to control the apoptosis of retinal cells in the developing retina, and that RERE deficiency results in the retina atrophy through degeneration of the retinal cells and optic nerve atrophy through the loss of RGCs"
    explanation: >-
      States the conclusion linking RERE loss to optic nerve atrophy via retinal
      ganglion cell loss, which is the mechanistic basis for the optic nerve
      phenotypes in this entry.
  downstream:
  - target: Multisystem Developmental Field Defect
    causal_link_type: DIRECT
- name: Impaired Endocardial EMT in the Atrioventricular Cushions
  biological_scale: CELLULAR
  description: >
    Atrioventricular septation depends on endocardial cells in the AV canal
    undergoing epithelial-to-mesenchymal transition and migrating into the
    cardiac jelly to populate the endocardial cushions. RERE-deficient mouse
    embryos have fewer mesenchymal cells in their AV endocardial cushions because
    both EMT and mesenchymal proliferation are reduced. In the endocardium RERE
    colocalizes with GATA4, positively regulates transcription from the Gata4
    promoter, and Gata4 levels fall in the AV canal of RERE-deficient embryos;
    Rere and Gata4 interact genetically in the development of congenital heart
    defects. Notably, endocardium-specific Rere ablation produces hypocellular
    cushions, defective EMT, and ventricular septal defects WITHOUT reducing
    GATA4, so the cell-autonomous endocardial role of RERE must be mediated by
    targets other than GATA4 — the entry keeps both arms rather than collapsing
    them.
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition involved in endocardial cushion formation
    term:
      id: GO:0003198
      label: epithelial to mesenchymal transition involved in endocardial cushion formation
    modifier: DECREASED
  - preferred_term: endocardial cushion development
    term:
      id: GO:0003197
      label: endocardial cushion development
    modifier: DECREASED
  evidence:
  - reference: PMID:30061196
    reference_title: "RERE deficiency leads to decreased expression of GATA4 and the development of ventricular septal defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RERE-deficient mouse embryos have reduced numbers of mesenchymal cells in their AV endocardial cushions owing to decreased levels of EMT and mesenchymal cell proliferation."
    explanation: >-
      Establishes the cellular lesion — reduced endocardial EMT and mesenchymal
      proliferation — behind the septal defects.
  - reference: PMID:30061196
    reference_title: "RERE deficiency leads to decreased expression of GATA4 and the development of ventricular septal defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RERE functions in the AV canal to positively regulate the expression of GATA4, and that deficiency of RERE leads to the development of VSDs through its effects on EMT and mesenchymal cell proliferation"
    explanation: >-
      Names GATA4 as the transcriptional target linking RERE loss to defective
      cushion EMT and ventricular septal defects.
  - reference: PMID:30061196
    reference_title: "RERE deficiency leads to decreased expression of GATA4 and the development of ventricular septal defects."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "the cell-autonomous role of RERE in promoting EMT in the endocardium must be mediated by its effects on the expression of proteins other than GATA4"
    explanation: >-
      The authors' own qualification: endocardium-specific ablation causes VSDs
      without lowering GATA4. Recorded as PARTIAL because it limits, rather than
      supports, a GATA4-only account of this node.
  downstream:
  - target: Multisystem Developmental Field Defect
    causal_link_type: DIRECT
- name: Impaired Brain Growth and Hindbrain Patterning
  biological_scale: TISSUE
  description: >
    Structural CNS anomalies are recurrent in NEDBEH and include hypoplasia or
    thinning of the corpus callosum, reduced white matter volume, ventriculomegaly,
    and a small or abnormal cerebellar vermis. RERE-deficient mice show brain
    hypoplasia with decreased numbers of NeuN-positive hippocampal neurons,
    giving a cellular correlate for reduced brain growth. Retinoic acid signaling
    is required for hindbrain segmentation and morphogenesis, which is the
    proposed route to the posterior fossa findings, including the Chiari type I
    malformation reported in one adult. The mechanistic account of the
    posterior-fossa phenotypes is inferential rather than directly demonstrated.
  biological_processes:
  - preferred_term: central nervous system development
    term:
      id: GO:0007417
      label: central nervous system development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:27087320
    reference_title: "De Novo Mutations of RERE Cause a Genetic Syndrome with Features that Overlap Those Associated with Proximal 1p36 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Associated features that were recurrently seen in these individuals included hypotonia, seizures, behavioral problems, structural CNS anomalies, ophthalmologic anomalies, congenital heart defects, and genitourinary abnormalities."
    explanation: >-
      Establishes structural CNS anomalies as a recurrent feature of the human
      disorder.
  - reference: PMID:23451234
    reference_title: "An allelic series of mice reveals a role for RERE in the development of multiple organs affected in chromosome 1p36 deletions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "brain hypoplasia, decreased numbers of neuronal nuclear antigen (NeuN)-positive hippocampal neurons"
    explanation: >-
      Provides the cellular correlate of impaired brain growth in RERE-deficient
      mice.
  - reference: PMID:41669386
    reference_title: "Expanding the Clinical Spectrum of RERE-Related Disorders: A Case Report of Neurodevelopmental Disorder with Brain Malformations Including Chiari Type I."
    supports: PARTIAL

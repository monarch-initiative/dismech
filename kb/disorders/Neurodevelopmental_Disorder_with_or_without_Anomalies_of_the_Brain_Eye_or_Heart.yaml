    causal_link_type: DIRECT
- name: Multisystem Developmental Field Defect
  biological_scale: ORGANISM
  description: >
    The convergent consequence: a single lesion in a retinoic-acid co-regulator
    expressed across the developing embryo produces coordinated anomalies of
    brain, eye, heart, inner ear, kidney and genitourinary tract rather than an
    isolated organ defect. The mouse allelic series makes this concrete — one
    graded reduction in Rere dosage yields microphthalmia, growth deficiency,
    brain hypoplasia, hearing loss, cardiovascular malformations, and renal
    agenesis together. The allelic class determines how much of this field is
    affected in a given individual: loss-of-function alleles produce fewer
    multisystem anomalies, whereas HRR missense variants and in-frame HRR
    duplications produce more.
  evidence:
  - reference: PMID:23451234
    reference_title: "An allelic series of mice reveals a role for RERE in the development of multiple organs affected in chromosome 1p36 deletions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings suggest that RERE plays a critical role in the development and function of multiple organs including the eye, brain, inner ear, heart and kidney."
    explanation: >-
      States the multi-organ requirement for RERE that this convergence node
      represents.
  - reference: PMID:30896913
    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RERE-related disorders are characterized by neurodevelopmental problems with or without structural anomalies of the eyes, heart, kidneys, and genitourinary tract and mild sensorineural hearing loss."
    explanation: >-
      GeneReviews definition of the disorder as a neurodevelopmental core with
      optional multisystem structural anomalies.
  - reference: PMID:41988794
    reference_title: "New genotype-phenotype correlations and management recommendations for individuals with RERE variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, HRR-associated missense variants and in-frame HRR duplications were associated with more multisystem phenotypes and usually arise de novo."
    explanation: >-
      Supports the claim that allelic class sets how much of the developmental
      field is involved.

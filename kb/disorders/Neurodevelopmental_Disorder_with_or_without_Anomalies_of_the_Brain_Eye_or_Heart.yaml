name: Neurodevelopmental Disorder with or without Anomalies of the Brain, Eye, or Heart
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
synonyms:
- NEDBEH
- RERE-related neurodevelopmental syndrome
- RERE-related disorders
- arginine-glutamic acid dipeptide repeats-related neurodevelopmental syndrome
description: >
  Neurodevelopmental disorder with or without anomalies of the brain, eye, or
  heart (NEDBEH) is a rare autosomal dominant condition caused by heterozygous,
  usually de novo, pathogenic variants in RERE (arginine-glutamic acid dipeptide
  repeats, also known as atrophin-2) at 1p36.23. RERE encodes a widely expressed
  nuclear receptor co-regulator of the atrophin family that positively regulates
  retinoic acid signaling; it does so as part of the WHHERE complex (Wdr5, Hdac1,
  Hdac2, Rere) together with the histone methyltransferase Ehmt2/G9a, and in a
  complex with NR2F2, p300, and a retinoic acid receptor recruited to retinoic
  acid response elements.

  The constant feature is a neurodevelopmental one: developmental delay,
  intellectual disability, and/or autism spectrum disorder, usually with
  hypotonia and infantile feeding problems. Roughly half of affected individuals
  additionally have structural anomalies referable to disturbed
  retinoic-acid-dependent organogenesis — of the eye (coloboma, optic nerve
  anomalies, microphthalmia, Peters anomaly), the heart (most often septal
  defects), the brain, the kidney and genitourinary tract — plus mild
  sensorineural hearing loss. The disorder therefore behaves as a developmental field defect rather
  than a single-organ lesion.

  RERE lies in the proximal critical region of 1p36, and NEDBEH phenocopies much
  of proximal 1p36 deletion syndrome; RERE haploinsufficiency is considered a
  major contributor to the neurodevelopmental and structural features of that
  contiguous-gene deletion. Two allelic classes are now distinguished: classic
  loss-of-function alleles acting by haploinsufficiency, which are milder and may
  be inherited from a mildly symptomatic or asymptomatic parent; and missense and
  in-frame variants clustering in a histidine-rich region (HRR) of the
  Atrophin-1 domain, which are structurally stabilizing, almost always de novo,
  and associated with more multisystem disease. A recurrent two-amino-acid HRR
  duplication produces a CHARGE-syndrome-like presentation.

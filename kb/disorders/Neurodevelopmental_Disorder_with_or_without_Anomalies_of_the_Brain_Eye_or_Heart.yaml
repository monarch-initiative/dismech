- name: Reduced Palatal Shelf Mesenchymal Proliferation
  biological_scale: TISSUE
  description: >
    RERE is broadly expressed in the palate during mouse embryonic development,
    and most RERE-deficient mouse embryos on a C57BL/6 background have cleft
    palate. Ablating Rere specifically in cranial neural crest cells with a
    Wnt1-Cre driver delays elevation of the palatal shelves and produces cleft
    palate, with significantly reduced proliferation of palatal shelf mesenchymal
    cells. This is the orofacial clefting arm of the disorder; cleft palate and
    cleft lip are each documented in single individuals with NEDBEH, so this node
    explains a rare rather than a core feature.
  cell_types:

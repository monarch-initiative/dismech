genetic:
- name: RERE
  notes: >
    RERE (arginine-glutamic acid dipeptide repeats; also known as atrophin-2) at
    1p36.23 encodes a nuclear receptor co-regulator and is the sole established
    cause of NEDBEH. The ClinGen Intellectual Disability and Autism Gene Curation
    Expert Panel classified the gene-disease relationship as Definitive in March
    2023. Two allelic classes are recognised. Loss-of-function alleles (nonsense,
    frameshift, canonical splice site, and whole- or partial-gene deletions) act
    by haploinsufficiency, produce fewer multisystem anomalies, and are the class
    in which inheritance from a mildly symptomatic or asymptomatic parent occurs.
    Missense variants and in-frame deletions/duplications in the histidine-rich
    region of the Atrophin-1 domain are structurally stabilizing, almost always
    arise de novo, and carry a heavier multisystem burden. Note that ClinGen's
    2023 curation recorded the mechanism as loss of function; the
    gain-of-function/dominant-negative interpretation of the HRR class comes from
    the later 2026 cohort and its protein modeling, and is not a correction
    ClinGen has adopted.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: RERE
    term:
      id: hgnc:9965
      label: RERE
  evidence:
  - reference: CGGV:assertion_bdf18409-7db7-4934-9bc7-99eea21d9058-2023-03-21T110000.000Z
    reference_title: "RERE / complex neurodevelopmental disorder with or without congenital anomalies (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RERE | HGNC:9965 | complex neurodevelopmental disorder with or without congenital anomalies | MONDO:0100465 | AD | Definitive | SOP9 | Intellectual Disability and Autism Gene Curation Expert Panel | 2023-03-21T11:00:00.000Z"
    explanation: >-
      ClinGen gene-disease validity row establishing a Definitive, autosomal
      dominant RERE gene-disease relationship curated by an expert panel.
  - reference: CGGV:assertion_bdf18409-7db7-4934-9bc7-99eea21d9058-2023-03-21T110000.000Z
    reference_title: "RERE / complex neurodevelopmental disorder with or without congenital anomalies (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is believed to be loss of function."
    explanation: >-
      ClinGen's stated mechanism as of the 2023 curation. Recorded verbatim
      because the later HRR gain-of-function/dominant-negative proposal is a
      subsequent and still-unsettled refinement.
  - reference: PMID:27087320
    reference_title: "De Novo Mutations of RERE Cause a Genetic Syndrome with Features that Overlap Those Associated with Proximal 1p36 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases in which both parental DNA samples were available, these changes were found to be de novo."
    explanation: >-
      Establishes the de novo origin of pathogenic RERE variants in the founding
      cohort.
  - reference: PMID:29330883
    reference_title: "Genotype-phenotype correlations in individuals with pathogenic RERE variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An analysis of data from individuals with NEDBEH suggests that point mutations affecting the Atrophin-1 domain of RERE are associated with an increased risk of structural eye defects, congenital heart defects, renal anomalies, and sensorineural hearing loss when compared with loss-of-function variants that are likely to lead to haploinsufficiency."
    explanation: >-
      The core genotype-phenotype correlation distinguishing the two allelic
      classes and their differing multisystem burden.
  variants:
  - name: Atrophin-1 histidine-rich region missense and in-frame variants
    type: missense and in-frame indel
    clinical_significance: PATHOGENIC
    description: >
      Missense variants and in-frame deletions/duplications clustering in the
      histidine-rich region (HRR) of the Atrophin-1 domain. Protein modeling in
      the 2026 cohort found these to be structurally stabilizing, which is why a
      gain-of-function or dominant-negative mechanism is proposed rather than
      loss of dosage. This class is associated with more multisystem phenotypes
      and usually arises de novo. Which of gain-of-function or dominant-negative
      applies is not resolved; that either/or is kept open in the discussions
      block rather than being decided here.
    evidence:
    - reference: PMID:41988794
      reference_title: "New genotype-phenotype correlations and management recommendations for individuals with RERE variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HRR missense variants were structurally stabilizing, suggesting a gain-of-function or dominant-negative mechanism."
      explanation: >-
        Source for the structural finding and the proposed non-haploinsufficient
        mechanism of this allelic class.
    - reference: PMID:41988794
      reference_title: "New genotype-phenotype correlations and management recommendations for individuals with RERE variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, HRR-associated missense variants and in-frame HRR duplications were associated with more multisystem phenotypes and usually arise de novo."
      explanation: >-
        Supports both the de novo origin and the greater multisystem burden of
        this class.
    - reference: PMID:29330883
      reference_title: "Genotype-phenotype correlations in individuals with pathogenic RERE variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A high percentage of RERE pathogenic variants affect a histidine-rich region in the Atrophin-1 domain."
      explanation: >-
        Establishes the histidine-rich region as the mutational hotspot defining
        this variant class.
  - name: Loss-of-function alleles causing haploinsufficiency
    type: nonsense, frameshift, splice-site, and gene deletion
    clinical_significance: PATHOGENIC
    description: >
      Nonsense, frameshift, canonical splice-site, and whole- or partial-gene
      deletion alleles. These reduce RERE dosage — nonsense-mediated decay has
      been demonstrated for at least one frameshift allele — and produce a milder
      phenotype with fewer multisystem anomalies. This is the class in which
      transmission from a mildly symptomatic or asymptomatic parent occurs, so
      unlike the HRR class it is not exclusively de novo.
    evidence:
    - reference: PMID:41988794
      reference_title: "New genotype-phenotype correlations and management recommendations for individuals with RERE variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Loss-of-function variants are associated with fewer multisystem anomalies than missense variants and are more likely to be inherited from a mildly symptomatic or asymptomatic parent."
      explanation: >-
        Establishes both the milder phenotype and the inherited-transmission
        pattern that distinguishes this class.
    - reference: PMID:40890291
      reference_title: "A de novo variant of RERE was identified in a patient with neurodevelopmental disorder, enuresis and scoliosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Real-time PCR confirmed that the novel variant may reduce the mRNA levels of RERE due to nonsense-mediated mRNA decay."
      explanation: >-
        Patient-derived transcript evidence for nonsense-mediated decay as the
        route to reduced dosage in a frameshift allele.
  - name: "Recurrent HRR duplication c.4313_4318dupTCCACC (CHARGE-like)"
    type: in-frame duplication
    clinical_significance: PATHOGENIC
    description: >
      A recurrent in-frame six-base-pair (two-amino-acid) duplication within the
      histidine-rich region. This specific allele is associated with a
      CHARGE-syndrome-like presentation including choanal atresia and coloboma,
      and is the basis for the recommendation to test RERE in CHD7-negative
      individuals meeting CHARGE criteria.
    evidence:
    - reference: PMID:29330883
      reference_title: "Genotype-phenotype correlations in individuals with pathogenic RERE variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We have also identified a recurrent two-amino-acid duplication in this region that is associated with the development of a CHARGE syndrome-like phenotype."
      explanation: >-
        Establishes the recurrent HRR duplication and its distinctive CHARGE-like
        phenotype.
    - reference: PMID:29300383
      reference_title: "Genetic analysis of CHARGE syndrome identifies overlapping molecular biology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic variants in CHD7 were present in 15 of 28 individuals (53.6%), whereas 4 (14.3%) individuals had pathogenic variants in other genes (RERE, KMT2D, EP300, or PUF60)."
      explanation: >-
        Independent confirmation from a CHARGE-ascertained exome cohort that RERE
        is among the genes accounting for CHD7-negative CHARGE presentations.
definitions:
- name: Molecular diagnosis of RERE-related disorder
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    The diagnosis is molecular, not clinical: it is established in a proband by
    identifying a heterozygous pathogenic variant in RERE. There is no
    clinical-criteria-based diagnosis, which is why the disorder is ascertained
    genotype-first through exome and genome sequencing rather than by phenotype
    pattern recognition. GeneReviews additionally recommends considering RERE
    testing in individuals who meet CHARGE syndrome criteria but are
    CHD7-negative.
  evidence:
  - reference: PMID:30896913
    reference_title: "RERE-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of RERE-related disorders is established in a proband by identification of a heterozygous pathogenic variant in RERE by molecular genetic testing."
    explanation: >-
      GeneReviews states the diagnostic criterion verbatim.
  - reference: PMID:29330883
    reference_title: "Genotype-phenotype correlations in individuals with pathogenic RERE variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consideration should also be given to screening for RERE variants in individuals who fulfill diagnostic criteria for CHARGE syndrome but do not carry pathogenic variants in CHD7."
    explanation: >-
      Supports the CHARGE-negative testing recommendation recorded in this
      definition.
treatments:
- name: Feeding Therapy and Enteral Feeding Support
  therapeutic_modality: BEHAVIORAL
  description: >
    Management of infantile feeding difficulty, escalating from feeding therapy
    and thickened liquids to nasogastric or gastrostomy tube feeding in severe
    cases. This is the one manifestation for which GeneReviews gives a specific
    treatment escalation rather than deferring to standard management.
  treatment_term:

    mapping_justification: >
      MONDO:0100465 is the ClinGen-minted, gene-agnostic disease-entity term that
      the Intellectual Disability and Autism Gene Curation Expert Panel used as
      the disease side of its Definitive RERE gene-disease validity assertion.
      It is a general "complex neurodevelopmental disorder with or without
      congenital anomalies" class rather than the RERE entity itself — other
      genes are curated against the same term — so it is recorded here as a
      broadMatch, not as this entry's anchor. This entry is deliberately anchored
      on MONDO:0014857, the OMIM:616975-xrefed NEDBEH term named in the curation
      request.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A mechanism-defined, multisystem Mendelian disorder of a nuclear receptor
      co-regulator. The dominant burden is neurodevelopmental, but the entry
      also spans ocular, cardiac, auditory, renal/genitourinary, and skeletal
      manifestations arising from one shared retinoic-acid-signaling lesion, so
      the cross-organ genetics chapter fits better than any single organ-system
      chapter.

- population: Greenlandic Inuit (311 individuals screened)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4500.0
  notes: >-
    Screening of 311 individuals in Greenland found the c.214C>A (p.Ser44Ter) allele in 4.5% heterozygous (A/a) and
    1% homozygous (a/a) individuals. Homozygosity does not equal disease: clinical hyperbiliverdinemia requires a
    superimposed cholestatic episode, and a homozygous sister of one proband never had it.
  evidence:
  - reference: PMID:27387768
    reference_title: Protective role of biliverdin against bile acid-induced oxidative stress in liver cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a screening of the mut-BLVRA allele (a) in 311 individuals in Greenland revealed that this SNP was relatively
      frequent in the Inuit population studied (1% a/a and 4.5% A/a)
    explanation: Population screening gives the heterozygous carrier and homozygous genotype frequencies in Greenland.
pathophysiology:
- name: Biallelic BLVRA Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic truncating BLVRA variants abolish biliverdin reductase A. The Inuit founder variant c.214C>A
    (p.Ser44Ter) produces a truncated protein with no catalytic activity when expressed in human hepatoma cells and
    Xenopus oocytes. BVR-A is ubiquitously expressed and is the predominant biliverdin reductase isoenzyme in adults.
  genes:
  - preferred_term: BLVRA
    term:
      id: hgnc:1062
      label: BLVRA
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    gene:
      preferred_term: BLVRA
      term:
        id: hgnc:1062
        label: BLVRA
  molecular_functions:
  - preferred_term: biliverdin reductase activity
    modifier: DECREASED
    term:
      id: GO:0004074
      label: biliverdin reductase [NAD(P)H] activity
  evidence:
  - reference: PMID:21278388
    reference_title: >-
      A homozygous nonsense mutation (c.214C->A) in the biliverdin reductase alpha gene (BLVRA) results in
      accumulation of biliverdin during episodes of cholestasis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting, immunofluorescence and functional assays of BVRα activity revealed that the mutated sequence
      generates a truncated protein with no catalytic activity.
    explanation: The patient variant abolishes BVR-A catalytic activity in cell and oocyte expression systems.
  - reference: PMID:39766828
    reference_title: Biliverdinuria Caused by Exonic BLVRA Deletions in Two Dogs with Green Urine.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Biliverdin reductase A has ubiquitous expression and is the predominant isoenzyme in the adult
    explanation: >-
      Background synthesis that BVR-A, not BVR-B, carries adult biliverdin reduction, so its loss is not compensated
      by the second isoenzyme.
  downstream:
  - target: Impaired Reduction of Biliverdin IXalpha to Bilirubin
    causal_link_type: DIRECT
    description: BVR-A catalyses the reduction of biliverdin IXalpha to bilirubin IXalpha; without it this step fails.
    evidence:
    - reference: PMID:27387768
      reference_title: Protective role of biliverdin against bile acid-induced oxidative stress in liver cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutation (c.214C>A) in BLVRA results in a non-functional enzyme (mutBVRα).
      explanation: The founder variant yields a non-functional reductase, removing the enzymatic step.
- name: Impaired Reduction of Biliverdin IXalpha to Bilirubin
  biological_scale: CELLULAR
  description: >-
    Heme oxygenase converts heme to iron, carbon monoxide and biliverdin IXalpha, which BVR-A then reduces to
    bilirubin IXalpha. With BVR-A absent, heme catabolism stops at biliverdin. In healthy individuals circulating
    biliverdin is very low to undetectable because this reduction is efficient.
  biological_processes:
  - preferred_term: heme catabolic process
    modifier: DECREASED
    term:
      id: GO:0042167
      label: heme catabolic process
  chemical_entities:
  - preferred_term: biliverdin IXalpha
    modifier: INCREASED
    term:
      id: CHEBI:17033
      label: biliverdin
  - preferred_term: bilirubin IXalpha
    modifier: DECREASED
    term:
      id: CHEBI:16990
      label: bilirubin IXalpha
  evidence:
  - reference: PMID:40002374
    reference_title: The Heme Oxygenase/Biliverdin Reductase System and Its Genetic Variants in Physiology and Diseases.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Heme oxygenase (HO) metabolizes heme into ferrous iron, carbon monoxide (CO), and biliverdin-IXα (BV), the
      latter being reduced into bilirubin-IXα (BR) by the biliverdin reductase-A (BVR).
    explanation: Places the BVR-A step in heme catabolism, biliverdin IXalpha to bilirubin IXalpha.
  - reference: PMID:39766828
    reference_title: Biliverdinuria Caused by Exonic BLVRA Deletions in Two Dogs with Green Urine.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In healthy mammals, serum and plasma concentrations of biliverdin are very low to undetectable because
      biliverdin reductase A efficiently reduces biliverdin to bilirubin
    explanation: Explains why loss of the reductase is what allows biliverdin to persist.
  downstream:
  - target: Systemic Biliverdin Accumulation
    causal_link_type: DIRECT
    description: >-
      Unreduced biliverdin builds up in blood and body fluids when it cannot be cleared in bile (see the cholestasis
      node); both lesions are needed for clinical disease.
    evidence:
    - reference: PMID:27387768
      reference_title: Protective role of biliverdin against bile acid-induced oxidative stress in liver cells.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Consequently, homozygous carriers suffering from cholestasis develop green jaundice.
      explanation: Homozygous loss of BVR-A activity leads to biliverdin accumulation (green jaundice) under cholestasis.
- name: Cholestatic Impairment of Biliary Biliverdin Clearance
  biological_scale: TISSUE
  description: >-
    Biliary obstruction (in the Inuit cases) or decompensated cirrhosis (in the Swedish case) is the precipitant. In
    the absence of cholestasis BVR-A deficiency is clinically silent: a homozygous sister of one proband never had
    hyperbiliverdinemia or cholestasis, and the green discoloration disappeared after surgical correction of the
    obstruction. The crises were accompanied by raised biochemical markers of cholestasis and hypercholanemia.
  role: trigger
  evidence:
  - reference: PMID:21278388
    reference_title: >-
      A homozygous nonsense mutation (c.214C->A) in the biliverdin reductase alpha gene (BLVRA) results in
      accumulation of biliverdin during episodes of cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two unrelated Inuit women from different geographical areas in Greenland who had episodes of green jaundice
      associated with biliary obstruction
    explanation: The clinical episodes in both homozygous probands occurred with biliary obstruction.
  - reference: PMID:21278388
    reference_title: >-
      A homozygous nonsense mutation (c.214C->A) in the biliverdin reductase alpha gene (BLVRA) results in
      accumulation of biliverdin during episodes of cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although her sister was also homozygous for the c.214C→A mutation, she had never had hyperbiliverdinaemia or
      cholestasis.
    explanation: A homozygote without cholestasis had no hyperbiliverdinemia, so cholestasis is required.
  downstream:
  - target: Systemic Biliverdin Accumulation
    causal_link_type: DIRECT
    description: >-
      Biliverdin that escapes reduction is retained in the circulation when bile flow fails; relief of the
      obstruction removed the hyperbiliverdinemia.
    evidence:
    - reference: PMID:21278388
      reference_title: >-
        A homozygous nonsense mutation (c.214C->A) in the biliverdin reductase alpha gene (BLVRA) results in
        accumulation of biliverdin during episodes of cholestasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hyperbiliverdinaemia disappeared after surgical correction of the cholestasis.
      explanation: Reversal on relieving the cholestasis shows that cholestasis drives the accumulation.
- name: Systemic Biliverdin Accumulation
  biological_scale: ORGANISM
  description: >-
    Biliverdin IXalpha accumulates in serum, urine, bile, breast milk and ascites. Biliverdin is green, so its
    accumulation produces green discoloration of the skin, sclerae, plasma and urine. Bilirubin is normal or only
    moderately raised despite the cholestasis.
  chemical_entities:
  - preferred_term: biliverdin IXalpha
    modifier: INCREASED
    term:
      id: CHEBI:17033
      label: biliverdin
  evidence:
  - reference: PMID:21278388
    reference_title: >-
      A homozygous nonsense mutation (c.214C->A) in the biliverdin reductase alpha gene (BLVRA) results in
      accumulation of biliverdin during episodes of cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      high concentrations of biliverdin IXα in serum, urine, bile and milk
    explanation: Biliverdin IXalpha was measured at high concentration in several body fluids of the homozygous patients.
  downstream:
  - target: Elevated Circulating Biliverdin
    causal_link_type: DIRECT
  - target: Biliverdinuria
    causal_link_type: DIRECT
  - target: Green Urine
    causal_link_type: DIRECT
  - target: Green Discoloration of Skin
    causal_link_type: DIRECT
    evidence:

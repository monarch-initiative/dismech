differential_diagnoses:
- name: Acquired green jaundice of end-stage liver disease
  description: >-
    Green jaundice without a BLVRA defect occurs in end-stage liver disease. Normal or only moderately raised
    bilirubin despite cholestasis, and BLVRA genotyping, point to the inherited form.
  evidence:
  - reference: PMID:21278388
    reference_title: >-
      A homozygous nonsense mutation (c.214C->A) in the biliverdin reductase alpha gene (BLVRA) results in
      accumulation of biliverdin during episodes of cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Green jaundice is a rare finding usually associated with end-stage liver disease.
    explanation: Green jaundice is usually an acquired sign of end-stage liver disease, the main differential.
- name: Exogenous or infectious green urine
  description: >-
    Transient green urine from food colouring, medications (propofol, amitriptyline, methylene blue) or Pseudomonas
    urinary infection, without biliverdinuria or green skin.
  evidence:
  - reference: PMID:39766828
    reference_title: Biliverdinuria Caused by Exonic BLVRA Deletions in Two Dogs with Green Urine.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      it is typically transient and acquired from food coloring, medications (e.g., propofol, amitriptyline,
      methylene blue), or Pseudomonas urinary tract infections
    explanation: Lists the acquired causes of green urine to exclude.

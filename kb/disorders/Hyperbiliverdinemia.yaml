name: Hyperbiliverdinemia
description: >-
  Rare inborn error of heme catabolism caused by loss of biliverdin reductase A (BVR-A, encoded by BLVRA), the
  enzyme that reduces biliverdin IXalpha to bilirubin IXalpha. Without BVR-A activity biliverdin is not converted
  to bilirubin, but it can still be cleared in bile, so affected individuals are usually asymptomatic. When bile
  flow fails, as in episodes of biliary obstruction or decompensated liver cirrhosis, biliverdin accumulates in
  the circulation and colours the skin, sclerae, plasma, urine and other body fluids green ("green jaundice"),
  typically with normal or only moderately raised bilirubin. The discoloration resolved when the cholestasis was
  corrected. The human literature consists of a few case reports: two unrelated Greenlandic Inuit women homozygous
  for the truncating founder variant c.214C>A (p.Ser44Ter), and a Swedish man with alcoholic cirrhosis who carried
  a single truncating allele (p.Arg18Ter). Complete absence of BVR-A activity is compatible with life, and no
  long-term health effect of the deficiency has been described.
category: Mendelian

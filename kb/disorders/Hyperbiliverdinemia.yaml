      reference_title: Biliverdinuria Caused by Exonic BLVRA Deletions in Two Dogs with Green Urine.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        These discolorations were the primary clinical phenotype of the BLVRA deficiency.
      explanation: >-
        The canine paper's summary of the human cases attributes the green discoloration of skin and body fluids to

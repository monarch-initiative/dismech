genetic:
- name: BLVRA
  gene_term:
    preferred_term: BLVRA
    term:
      id: hgnc:1062
      label: BLVRA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    BLVRA is the causal gene recorded by MONDO, OMIM (614156) and Orphanet for hyperbiliverdinemia. The human evidence
    is two families: homozygous c.214C>A (p.Ser44Ter) in two unrelated Inuit women, and a heterozygous p.Arg18Ter
    allele in a man with decompensated alcoholic cirrhosis.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_de6e575f-6a04-45fb-a9b5-0b21c9e6a7a8-2025-01-10T170000.000Z
    evidence:
    - reference: CGGV:assertion_de6e575f-6a04-45fb-a9b5-0b21c9e6a7a8-2025-01-10T170000.000Z
      reference_title: BLVRA / hyperbiliverdinemia (Moderate)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "BLVRA | HGNC:1062 | hyperbiliverdinemia | MONDO:0013595 | AR | Moderate"
      explanation: ClinGen General Inborn Errors of Metabolism GCEP classifies BLVRA-hyperbiliverdinemia (AR) as Moderate.
  evidence:
  - reference: ORPHA:276405
    reference_title: Hyperbiliverdinemia
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BLVRA | biliverdin reductase A | hgnc:1062 | Disease-causing germline mutation(s) in"
    explanation: Orphanet records BLVRA germline variants as disease-causing.
  variants:
  - name: c.214C>A (p.Ser44Ter)
    description: >-
      Nonsense variant producing a truncated, catalytically inactive BVR-A. Found homozygous in two unrelated
      Greenlandic Inuit women with green jaundice during biliary obstruction; frequent in the Greenlandic Inuit
      population (4.5% heterozygous, 1% homozygous among 311 screened individuals).
    evidence:
    - reference: PMID:21278388
      reference_title: >-
        A homozygous nonsense mutation (c.214C->A) in the biliverdin reductase alpha gene (BLVRA) results in
        accumulation of biliverdin during episodes of cholestasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        With the use of TaqMan probes, homozygosity for c.214C→A was found in both patients.
      explanation: Both probands were homozygous for the variant.
  - name: c.52C>T (p.Arg18Ter)
    description: >-
      Nonsense variant predicted to truncate BVR-A N-terminal to the active-site Tyr97. Reported heterozygous in a
      Swedish man with green jaundice and decompensated alcoholic cirrhosis; two heterozygous children without liver
      disease had normal biliverdin.
    evidence:
    - reference: PMID:19580635
      reference_title: >-
        A novel mutation in the biliverdin reductase-A gene combined with liver cirrhosis results in
        hyperbiliverdinaemia (green jaundice).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two children of the proband were heterozygous for the identical mutation in the BVR-A gene, but had no
        clinical signs of liver disease and had normal levels of biliverdin.
      explanation: Heterozygous relatives without liver disease are unaffected, so a single allele alone is silent.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Complete BVR-A deficiency follows autosomal recessive inheritance: the Inuit probands are homozygous and the
    tested parents are heterozygous. Disease expression additionally requires cholestasis. Orphanet also lists
    autosomal dominant inheritance, reflecting the single heterozygous carrier with cirrhosis; that case is better
    read as one allele plus severe liver failure than as dominant disease, since his heterozygous children are
    unaffected.
  evidence:
  - reference: PMID:21278388
    reference_title: >-
      A homozygous nonsense mutation (c.214C->A) in the biliverdin reductase alpha gene (BLVRA) results in
      accumulation of biliverdin during episodes of cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents of one of these patients were heterozygous for the inactivating mutation.
    explanation: Heterozygous parents of a homozygous affected proband fit autosomal recessive inheritance.
  - reference: CGGV:assertion_de6e575f-6a04-45fb-a9b5-0b21c9e6a7a8-2025-01-10T170000.000Z
    reference_title: BLVRA / hyperbiliverdinemia (Moderate)

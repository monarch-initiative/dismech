    the underlying biliary obstruction cleared the hyperbiliverdinemia in the reported Inuit cases.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical correction of biliary obstruction
    term:
      id: NCIT:C15329

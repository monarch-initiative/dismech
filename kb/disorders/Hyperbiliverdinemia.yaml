notes: >-
  Naming and scope. The entry keeps the MONDO, OMIM (614156) and Orphanet name "Hyperbiliverdinemia" because no
  BLVRA gene-related name is established: MONDO's synonyms are "green jaundice" and "HBLVD", no ClinGen label or
  GeneReviews chapter exists, and "BLVRA deficiency" appears in one canine paper rather than in recurring human
  literature. The name is broader than the entry: green jaundice also occurs without any BLVRA defect, usually in
  end-stage liver disease, and Orphanet's definition of the condition mentions associations with malnutrition,
  medication and biliary atresia. This entry covers only the BLVRA-related inborn error bound to MONDO:0013595; the
  acquired sign is listed as a differential.

  Green skin discoloration has no specific HPO term (`runoak -i ols:hp search "green"` returns only Green teeth,
  Green urine and unrelated terms), so it is bound to HP:0001000 with the specificity carried in preferred_term.
  That term's label is written as it stands in cache/hp/terms.csv, "Abnormality of skin pigmentation"; OLS now
  returns "Abnormal skin pigmentation", and the cache-first validator enforces the older label (dismech#11750).

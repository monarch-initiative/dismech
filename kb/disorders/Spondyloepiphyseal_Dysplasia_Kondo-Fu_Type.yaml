- name: Recombinant Human Growth Hormone Therapy
  description: >-
    Growth hormone given for the growth failure. The evidence is one three-year
    course in a single patient with a partial growth-hormone-secretion deficit
    and a normal IGF-1, whose height moved from -4.86 SD to -3.96 SD - a real
    gain that still leaves the child profoundly short. The founding patient
    received growth hormone and stopped it for limited response, so the two
    reported courses point in opposite directions.
  treatment_term:
    preferred_term: recombinant human growth hormone therapy
    term:
      id: NCIT:C15445
      label: Hormone Therapy
    therapeutic_agent:
    - preferred_term: recombinant human growth hormone
      term:
        id: CHEBI:749556
        label: somatropin
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:36816387
    reference_title: 'Case Report: Recombinant human growth hormone therapy in a patient with spondyloepiphyseal
      dysplasia, Kondo-Fu type.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'However, after treatment, the child’s height increased from −4.86SD to
      −3.96SD, indicating that the growth hormone had specific benefits in increasing the
      height of such patients.'
    explanation: The measured height gain in the only patient reported to have completed a course,
      and the authors' own reading of it.
  - reference: PMID:36816387
    reference_title: 'Case Report: Recombinant human growth hormone therapy in a patient with spondyloepiphyseal
      dysplasia, Kondo-Fu type.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'The patient with SEDKF, reported by Kondo et al. in 2018, received growth hormone
      replacement therapy for 1 year but discontinued it as a result of limited response.'
    explanation: The other reported course, which was stopped for lack of effect. Recorded as a
      REFUTE item against the same claim rather than as a caveat in prose, because a reader deciding
      whether to try this needs both outcomes and there are only two.
  notes: >-
    therapeutic_modality is left unset. Somatropin is a recombinant protein, but
    PROTEIN_REPLACEMENT would assert that this is replacement of a missing
    protein, and SEDKF short stature is a growth-plate disease rather than a
    growth-hormone deficiency - the one patient's stimulation test showed only a
    partial secretion deficit and a normal IGF-1. No value in the enum states
    "recombinant protein hormone given pharmacologically", so none is recorded.

    Both reported courses are quoted above and they disagree. dismech has no way
    to record that two evidence items are in conflict with each other rather than
    each independently graded against the claim, so the disagreement lives in
    this note and in the description (issue #11142).
diagnosis:
- name: Plasma or dried blood spot lysosomal enzyme panel
  description: >-
    Measurement of multiple lysosomal hydrolases in plasma or dried blood spots.
    Elevation of several enzymes together in a child with a skeletal dysplasia is
    the pattern that distinguishes this disease and should prompt MBTPS1 testing.
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Increased concentration of multiple lysosomal hydrolase enzymes can be identified in
      plasma and dried blood spots.'
    explanation: Names both acceptable specimen types for this test.
- name: Molecular genetic testing of MBTPS1
  description: >-
    Identification of biallelic pathogenic MBTPS1 variants, usually by exome
    sequencing. Note that variant interpretation is genuinely hard here: the Saudi
    patient's homozygous missense allele was returned as a variant of unknown
    significance and was upgraded to likely pathogenic only on the strength of the
    clinical and radiographic phenotype.
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The diagnosis of MBTPS1-SEMD is established in a proband with characteristic clinical
      and radiographic findings, elevated lysosomal hydrolase enzymes in plasma or dried blood spots,
      and biallelic pathogenic variants in MBTPS1 identified by molecular genetic testing.'
    explanation: The GeneReviews diagnostic criteria, which require all three components rather than
      the genotype alone.
  - reference: PMID:36330313
    reference_title: Identification of a New Variant of the MBTPS1 Gene of the Kondo-Fu Type of Spondyloepiphyseal
      Dysplasia (SEDKF) in a Saudi Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We are mindful that changing the classification of a variant of unknown significance is
      challenging.'
    explanation: The authors' own statement of the interpretive difficulty, which is why this entry
      records variant interpretation as a real diagnostic obstacle rather than a formality.
discussions:
- discussion_id: mbtps1_er_stress_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#ER Retention of Collagen in Chondrocytes
  prompt: >-
    Reducing ER stress mitigated the collagen-trafficking defect in the founding
    study's cellular system. Does pharmacological relief of ER stress improve the
    skeletal phenotype in vivo, and is there a window in which it would help?
  rationale: >-
    This is the only tractable therapeutic lead in the disease and the founding
    authors flag it as generalisable, noting that ER dysfunction is common across
    genetic skeletal disorders. Two things are unknown. First, the rescue was
    shown in cells, and no animal model of MBTPS1 deficiency has been reported
    with a treatment arm. Second, the skeletal damage is developmental, so even an
    effective agent might have to be given before a diagnosis is usually made -
    and this disease is typically diagnosed after postnatal growth failure is
    already apparent.
notes: >-
  Curated de novo. GeneReviews (PMID:38048414) exists for this disease and is the
  mandatory phenotype baseline. All four of its sections are now mined: Clinical
  Characteristics and the imaging list into phenotypes, Diagnosis/Testing into
  diagnosis, Management into treatments, and Genetic Counseling into inheritance.

  An earlier version of this note said prominent cheekbones and large prominent
  ears were "covered by the shared facial-gestalt quote without a separate entry".
  That rationale did not hold, because the same quote already backed three
  separately curated phenotypes (prominent forehead, retrognathia, wide mouth) and
  so could not distinguish the two groups. Both are now curated, along with the
  short metacarpals and metatarsals and the copper-beaten skull from the imaging
  list. The copper-beaten skull is deliberately NOT drawn as a downstream
  consequence of Defective Endochondral Skeletal Development: the calvaria
  ossifies intramembranously, so an endochondral growth-plate lesion is not the
  obvious cause of it, and no source states the connection.

  Two things GeneReviews states that this entry cannot hold in a structured slot.
  Its Surveillance recommendation - annual growth assessment, orthopedic
  evaluation, ophthalmological evaluation, assessment of developmental progress
  and educational needs, and clinical assessment for hernia as needed - has no
  surveillance or monitoring slot to go in; and its Pregnancy management note,
  that delivery by cesarean section may be necessary in a woman with significant
  short stature and skeletal dysplasia, has nowhere either. Both are recorded here
  so they are at least present in the entry.

  The mechanism comes from the founding paper (PMID:30046013), which is unusually
  complete for a single-patient report: it establishes the residual transcript
  level, the specific transducer that fails, both downstream arms, and a rescue.

  Two curation choices worth checking:

  First, Preserved Lipid Homeostasis is curated as a pathophysiology node even
  though it records a function that is NOT disrupted. S1P's best-known role is
  SREBP activation, so a reader coming to this entry expects a lipid disease; the
  node exists to say explicitly that the lipid arm is spared at this residual
  enzyme level, which is the finding that makes the skeletal phenotype
  interpretable. Review on PR #11642 confirmed this is the right shape: dismech
  treats negative results as first-class throughout (FAILS_TO_RECAPITULATE,
  supports: REFUTE, direction: UNCHANGED), and nothing requires a pathophysiology
  node to record a disruption. The edge into it is DIRECT, but the claim it makes
  is a non-effect - the residual S1P fails to disrupt the lipid arm - which is now
  said explicitly in the edge description so the direction cannot be misread.

  Second, the elevated lysosomal hydrolases are curated as a biochemical marker
  rather than a phenotype, and deliberately left unbound. HPO has terms for
  individual enzyme activities (for example beta-mannosidase) but none for a
  generic elevation of multiple lysosomal hydrolases, and binding a single-enzyme
  term would misstate a multi-enzyme finding. Per the ontology term contract, no
  term beats a bad one.

  Nomenclature: MONDO and OMIM call this spondyloepiphyseal dysplasia, Kondo-Fu
  type; GeneReviews calls it MBTPS1-related spondyloepimetaphyseal dysplasia with
  elevated lysosomal enzymes. The entry name follows MONDO, the phenotype binding
  follows the radiographic description (which includes metaphyseal involvement),
  and both names are in synonyms.

  Two references were checked and deliberately not used. PMID:32316092 was flagged
  by the deep-research report's own reference_validation as off-topic; it is a
  hepatocellular-carcinoma paper and does not bear on this disease. PMID:37454339
  was checked as a possible source for an ISDS skeletal-nosology classification
  and turns out to be an X-linked agammaglobulinemia transplant survey, so no
  classifications block is recorded - the disease may well sit in the 2023 ISDS
  revision, but not on the strength of an identifier that resolved to the wrong
  paper.

  mappings is absent because the schema's DiseaseMappings has slots only for
  ICD-10-CM, ICD-11-Foundation, MONDO and NCIT. The obvious external identifier
  for this disease is OMIM 618392, which has no slot; it is quoted inside the
  cached sources rather than recorded as a mapping.

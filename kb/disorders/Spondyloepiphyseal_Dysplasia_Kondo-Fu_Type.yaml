    explanation: Indicates the size and age span of the accumulated literature at the time of that
      review.
genetic:
- name: MBTPS1
  gene_term:
    preferred_term: MBTPS1
    term:
      id: hgnc:15456
      label: MBTPS1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic. The founding patient was compound heterozygous for a 1-bp
    duplication and a missense variant - one amorphic and one severely
    hypomorphic - and a later Saudi patient was homozygous for c.2634C>A
    p.(Ser878Arg). The founding genotype is mechanistically informative rather
    than incidental: because one allele retains a trace of function, the disease
    shows what happens at about 1% of normal S1P rather than at zero, and complete
    loss may not be viable.
  evidence:
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The unique combination of these mutations results in a frequency of functional MBTPS1
      transcripts of approximately 1%, a finding that is associated with skeletal dysplasia and
      elevated blood lysosomal enzymes.'
    explanation: Quantifies the residual transcript, which is the number the whole dose-sensitivity
      argument in this entry rests on.
  - reference: PMID:36330313
    reference_title: Identification of a New Variant of the MBTPS1 Gene of the Kondo-Fu Type of Spondyloepiphyseal
      Dysplasia (SEDKF) in a Saudi Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The first variant described was compound heterozygosity for mutations in the MBTPS1
      gene: a 1-bp duplication and a missense mutation.'
    explanation: Describes the founding genotype, and this second report is the source of the later
      homozygous missense allele.
pathophysiology:
- name: MBTPS1 Biallelic Deficiency
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Biallelic MBTPS1 variants leave only a small fraction
    of functional transcript - about 1% in the founding patient. S1P is the Golgi
    serine protease that performs the first of the two cleavages in regulated
    intramembrane proteolysis, releasing membrane-bound transcription factors.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: MBTPS1
    term:
      id: hgnc:15456
      label: MBTPS1
  evidence:
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Site-1 protease (S1P), encoded by MBTPS1, is a serine protease in the Golgi.'
    explanation: Identifies the gene product, its enzyme class and its compartment. A definitional
      statement rather than a study result, hence OTHER.
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'S1P regulates lipogenesis, endoplasmic reticulum (ER) function, and lysosome biogenesis
      in mice and in cultured cells.'
    explanation: Names the three functional arms whose differential dose sensitivity is what this
      entry is about. Graded MODEL_ORGANISM for the in vivo half of the sentence - it is a single
      claim resting on mouse AND cell-culture work at once, and evidence_source is single-valued, so
      the in vitro half cannot be co-recorded on this item. Splitting further is not possible without
      splitting the sentence, which would misquote it.
  - reference: PMID:36330313
    reference_title: Identification of a New Variant of the MBTPS1 Gene of the Kondo-Fu Type of Spondyloepiphyseal
      Dysplasia (SEDKF) in a Saudi Patient.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'The membrane-bound transcription factor peptidase, site 1 gene (MBTPS1, OMIM∗603355)
      encodes the Site 1 protease (S1P), which works in tandem with the Site 2 protease (S2P) as a
      proteolytic activator of membrane-bound latent transcription factors in the Golgi'
    explanation: Describes the two-protease mechanism S1P belongs to, which is the biochemistry the
      downstream nodes depend on.
  downstream:
  - target: Selective Failure of BBF2H7 Activation
    causal_link_type: DIRECT
    description: >-
      The residual S1P is insufficient for the ER-stress arm specifically, and the
      transducer that fails is BBF2H7.
    evidence:
    - reference: PMID:30046013
      reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
        protein trafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'The defective S1P function specifically impairs activation of the ER stress transducer
        BBF2H7, leading to ER retention of collagen in chondrocytes.'
      explanation: Names the specific transducer that fails and the immediate consequence, which is
        what makes this a specific edge rather than a general ER-stress claim.
  - target: Impaired Mannose-6-Phosphate-Dependent Lysosomal Delivery
    causal_link_type: DIRECT
    description: >-
      The second arm. Reduced S1P partially impairs the M6P route by which newly
      made hydrolases reach the lysosome.
    evidence:
    - reference: PMID:30046013
      reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
        protein trafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'S1P deficiency also causes abnormal secretion of lysosomal enzymes due to partial
        impairment of mannose-6-phosphate-dependent delivery to lysosomes.'
      explanation: States the cause of the mis-sorting and notes it is partial, which matters because
        the enzymes are made and mislocalised rather than absent.
  - target: Preserved Lipid Homeostasis
    causal_link_type: DIRECT
    description: >-
      The negative branch, and the reason this is a skeletal rather than a
      metabolic disease. Read as a non-effect, not as a causation: the claim is
      that the residual S1P FAILS TO DISRUPT the SREBP-driven lipid arm, not that
      the deficiency brings lipid homeostasis about. causal_link_type is DIRECT
      because the sparing is a direct consequence of the residual enzyme level
      measured in the same experiment, with no intermediate step.
    evidence:
    - reference: PMID:30046013
      reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
        protein trafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'We found that the residually expressed S1P is sufficient for lipid homeostasis but
        not for ER and lysosomal functions, especially in chondrocytes.'
      explanation: The dissociation on which the whole entry turns - one arm spared, two arms lost,
        at the same residual enzyme level.
- name: Preserved Lipid Homeostasis
  biological_scale: CELLULAR
  description: >-
    A deliberately curated negative node. S1P activates the SREBPs that drive
    cholesterol and fatty acid synthesis, so lipid disease is the expected
    consequence of losing it - and it does not happen at this residual enzyme
    level. Curating the spared arm is what makes the skeletal phenotype
    interpretable rather than arbitrary.
  evidence:
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'We found that the residually expressed S1P is sufficient for lipid homeostasis but not
      for ER and lysosomal functions, especially in chondrocytes.'
    explanation: The direct statement that the lipid arm is preserved. This node exists to record a
      function that is NOT disrupted, which the pathograph would otherwise leave a reader to assume.
- name: Selective Failure of BBF2H7 Activation
  biological_scale: MOLECULAR
  description: >-
    BBF2H7 (CREB3L2) is an ER-stress transducer of the CREB3 family that requires
    S1P cleavage for activation and that drives the secretory capacity
    chondrocytes need for collagen output. Its activation fails specifically,
    while other S1P substrates are handled adequately.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    modifier: DECREASED
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  evidence:
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The defective S1P function specifically impairs activation of the ER stress transducer
      BBF2H7, leading to ER retention of collagen in chondrocytes.'
    explanation: The word that matters is "specifically" - the failure is transducer-selective, which
      is why this node names BBF2H7 rather than ER stress signalling in general.
  downstream:
  - target: ER Retention of Collagen in Chondrocytes
    causal_link_type: DIRECT
    description: Without BBF2H7-driven secretory capacity, procollagen accumulates in the chondrocyte
      ER instead of being exported.
- name: ER Retention of Collagen in Chondrocytes
  biological_scale: CELLULAR
  description: >-
    Collagen is synthesised but not exported, accumulating in the endoplasmic
    reticulum of chondrocytes. That the defect is correctable is a substantive
    finding rather than a footnote: correcting the MBTPS1 variant or reducing ER
    stress mitigates the trafficking defect, which is the strongest hint in this
    literature that the disease has a druggable step.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: export of newly synthesised collagen from the endoplasmic reticulum
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  evidence:
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Correction of an MBTPS1 variant or reduction of ER stress mitigated collagen-trafficking
      defects.'
    explanation: A rescue in two independent directions - fixing the gene and relieving the stress -
      which establishes the collagen retention as a consequence of the lesion rather than a
      correlate.
  downstream:
  - target: Chondrocyte Apoptosis
    causal_link_type: DIRECT
    description: Sustained ER retention of a protein the cell is built to secrete drives the
      chondrocyte to apoptosis.
- name: Impaired Mannose-6-Phosphate-Dependent Lysosomal Delivery
  biological_scale: CELLULAR
  description: >-
    Newly synthesised lysosomal hydrolases carry a mannose-6-phosphate tag that
    routes them to the lysosome. With reduced S1P that routing is partly lost, so
    the enzymes are secreted into the circulation instead. This is the origin of
    both the diagnostic finding and the second route to bone damage.
  biological_processes:
  - preferred_term: protein targeting to lysosome
    modifier: DECREASED
    term:
      id: GO:0006622
      label: protein targeting to lysosome
  evidence:
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'S1P deficiency also causes abnormal secretion of lysosomal enzymes due to partial
      impairment of mannose-6-phosphate-dependent delivery to lysosomes.'
    explanation: Gives the mis-sorting and its molecular cause in one statement.
  downstream:
  - target: Extracellular Lysosomal Enzyme-Mediated Bone Matrix Degradation
    causal_link_type: DIRECT
    description: Hydrolases delivered to the extracellular space rather than the lysosome act on bone
      matrix.
- name: Chondrocyte Apoptosis
  biological_scale: CELLULAR
  description: >-
    Chondrocyte death, the cellular endpoint of the ER-stress arm. Because
    chondrocytes drive endochondral growth, their loss translates directly into
    the growth failure and epiphyseal dysplasia that define the disease.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Collectively, these abnormalities lead to apoptosis of chondrocytes and lysosomal
      enzyme-mediated degradation of the bone matrix.'
    explanation: The authors' summary of where both arms converge, quoted once and shared with the
      bone-matrix node below.
  downstream:
  - target: Defective Endochondral Skeletal Development
    causal_link_type: DIRECT
    description: Loss of chondrocytes from the growth plate impairs the endochondral ossification
      that lengthens bone and shapes epiphyses.
- name: Extracellular Lysosomal Enzyme-Mediated Bone Matrix Degradation
  biological_scale: TISSUE
  description: >-
    Mis-sorted hydrolases in the extracellular space degrade bone matrix. This is
    the second, independent route from the MBTPS1 lesion to the skeletal
    phenotype, and it is the one that plausibly accounts for the reduced bone
    mineral density rather than for the dysplastic shape.
  evidence:
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Collectively, these abnormalities lead to apoptosis of chondrocytes and lysosomal
      enzyme-mediated degradation of the bone matrix.'
    explanation: Names bone matrix degradation by lysosomal enzymes as one of the two convergent
      consequences.
  downstream:
  - target: Reduced bone mineral density
    causal_link_type: DIRECT
- name: Defective Endochondral Skeletal Development
  biological_scale: ORGANISM
  description: >-
    The skeletal syndrome. Chondrocyte loss at the growth plate produces
    postnatal-onset short stature, dysplastic vertebrae, small and irregular
    epiphyses with mildly enlarged irregular metaphyses, hip dysplasia and short
    metacarpals and metatarsals.
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Imaging findings include diffuse osteopenia, copper-beaten appearance of the skull,
      dysplasia of multiple thoracolumbar vertebrae, long bones with small and irregular epiphyses
      and mildly enlarged and irregular metaphyses, hip dysplasia with small fragmented sclerotic
      femoral heads, and short metacarpals and metatarsals with small epiphyses.'
    explanation: The GeneReviews radiographic description, which is the authoritative statement of
      what the skeletal phenotype looks like.
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'These results define a new congenital human skeletal disorder and, more importantly,
      reveal that S1P is particularly required for skeletal development in humans.'
    explanation: States the conclusion this node embodies - that the human requirement for S1P is
      specifically skeletal.
  downstream:
  - target: Short stature
    causal_link_type: DIRECT
  - target: Spondyloepimetaphyseal dysplasia
    causal_link_type: DIRECT
  - target: Hip dysplasia
    causal_link_type: DIRECT
  - target: Kyphosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Vertebral dysplasia produces the spinal curvature; GeneReviews lists
      kyphosis and scoliosis together as one feature and the intermediate steps
      are not resolved, so both edges are typed the same way.
  - target: Pectus carinatum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chest-wall deformity in a disease whose lesion is at the growth plate. The
      rib and sternal contribution has not been worked out, so the edge is typed
      as indirect with unknown intermediates rather than asserted as direct.
  - target: Pectus excavatum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The other pole of the same chest deformity. GeneReviews names them as
      alternatives in one patient population, so both are drawn from this node.
  - target: Short metacarpal
    causal_link_type: DIRECT
  - target: Short metatarsal
    causal_link_type: DIRECT
biochemical:
- name: Elevated plasma lysosomal hydrolase activity
  biomarker_term:
    preferred_term: elevated multiple lysosomal hydrolase enzymes in plasma
  presence: PRESENT
  notes: >-
    Increased concentration of multiple lysosomal hydrolases in plasma and dried
    blood spots, arising from the mis-sorting of newly made enzymes into the
    secretory route. It is the disease's diagnostic handle: a skeletal dysplasia
    with elevated blood lysosomal enzymes is the pattern that should prompt MBTPS1
    testing, and it is what the GeneReviews chapter names the disease after. No
    HPO term for a generic elevation of multiple lysosomal hydrolases was found,
    so the marker is recorded with a free-text preferred_term rather than bound to
    a single-enzyme near-miss term.
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Increased concentration of multiple lysosomal hydrolase enzymes can be identified in
      plasma and dried blood spots.'
    explanation: Names the analyte, the direction and both specimen types in which it is measurable.
  - reference: PMID:30046013
    reference_title: Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle
      protein trafficking.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'a finding that is associated with skeletal dysplasia and elevated blood lysosomal
      enzymes'
    explanation: Ties the biochemical finding to the genotype in the founding patient.
phenotypes:
- name: Short stature
  category: Growth
  description: >-
    Postnatal-onset short stature, often severe. Reported in 80% of previously
    published cases in one review's summary.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38337829
    reference_title: Exome Sequencing Reveals Biallelic Mutations in MBTPS1 Gene in a Girl with a Very
      Rare Skeletal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: '80% had low stature, 70% low weight, 80% had bilateral cataracts and 70% showed

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic MBTPS1 variants, either compound heterozygous or homozygous. In the
    Saudi consanguineous family the homozygous variant was heterozygous in both
    asymptomatic parents, which is the segregation evidence for recessiveness.
  evidence:
  - reference: PMID:38337829
    reference_title: Exome Sequencing Reveals Biallelic Mutations in MBTPS1 Gene in a Girl with a Very
      Rare Skeletal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The Kondo-Fu type of spondyloepiphyseal dysplasia (SEDKF) is a rare skeletal dysplasia
      caused by homozygous or compound heterozygous mutations in the MBTPS1 gene.'
    explanation: States both biallelic configurations under which the disease occurs.
  - reference: PMID:36330313
    reference_title: Identification of a New Variant of the MBTPS1 Gene of the Kondo-Fu Type of Spondyloepiphyseal
      Dysplasia (SEDKF) in a Saudi Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The whole exome sequence, which described a homozygous missense variant of unknown
      clinical significance (VUS, class 3 variant) in the MBTPS1 gene, was heterozygous in both
      asymptomatic parents.'
    explanation: Carrier parents unaffected, homozygous child affected - the direct segregation
      evidence for autosomal recessive inheritance.
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'If both parents are known to be heterozygous for an MBTPS1 pathogenic variant, each sib
      of an affected individual has at conception a 25% chance of being affected, a 50% chance of
      being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.'
    explanation: The GeneReviews recurrence risk, which is the number a family is actually counselled
      on and the quantitative content of the recessive mode.
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Once the MBTPS1 pathogenic variants have been identified in an affected family member,
      carrier testing for at-risk relatives and prenatal and preimplantation genetic testing are
      possible.'
    explanation: States what reproductive options follow from a molecular diagnosis, which is the
      other half of the GeneReviews genetic-counselling section.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists. The disease was defined in 2018 in one
    patient; a 2023 case report counted itself the third individual with SEDKF,
    and a 2024 review pooled features across previously reported cases spanning
    ages 4 to 24 years. Recorded as a literature case count rather than a rate,
    with no rate_per_100000, because no denominator has ever been published.
  evidence:
  - reference: PMID:36816387
    reference_title: 'Case Report: Recombinant human growth hormone therapy in a patient with spondyloepiphyseal
      dysplasia, Kondo-Fu type.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The number of human diseases with site-1 protease deficiency is extremely rare, and
      totally, only two cases of SEDKF, one case of Silver–Russell syndrome, two cases of CAOP
      syndrome, and one patient presenting with hyperCKemia and focal myoedema have been reported'
    explanation: An explicit count of the reported SEDKF literature at the time of writing, which is
      what a CASES_IN_LITERATURE record is for.
epidemiology:
- name: Reported case count
  description: >-
    Very rare. The disease was defined in 2018 in a single patient, and the
    literature since consists of individual case reports; a 2024 review of
    previously reported cases spanned ages 4 to 24 years.
  evidence:

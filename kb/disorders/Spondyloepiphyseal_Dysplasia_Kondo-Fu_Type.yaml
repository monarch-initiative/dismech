    explanation: The only source giving numeric frequencies for this disease. 80% places short
      stature in the VERY_FREQUENT band.
- name: Spondyloepimetaphyseal dysplasia
  category: Skeletal
  description: >-
    The defining radiographic pattern - dysplastic vertebrae with small irregular
    epiphyses and enlarged irregular metaphyses. Note the nomenclature
    discrepancy: MONDO and OMIM name the disease spondyloepiphyseal, while

name: Spondyloepiphyseal Dysplasia, Kondo-Fu Type
creation_date: '2026-09-10T19:20:00Z'
category: Mendelian
disease_term:
  preferred_term: spondyloepiphyseal dysplasia, Kondo-Fu type
  term:
    id: MONDO:0032721
    label: spondyloepiphyseal dysplasia, kondo-fu type
description: >-
  An autosomal recessive skeletal dysplasia caused by biallelic variants in
  MBTPS1, which encodes site-1 protease (S1P) - the Golgi serine protease that
  performs the first cleavage in regulated intramembrane proteolysis. S1P
  activates the SREBPs of lipid homeostasis and the ER-stress transducers of the
  ATF6/CREB3 family, so a priori one would expect its loss to be a lipid disease.
  It is not, and that is the point of the entry.

  The founding patient carried one amorphic and one severely hypomorphic allele,
  leaving roughly 1% of functional MBTPS1 transcript. That residue turned out to
  be enough for lipid homeostasis and not enough for ER and lysosomal function,
  particularly in chondrocytes - so the phenotype is skeletal rather than
  metabolic, and the disease is effectively a natural experiment in which arm of
  S1P's portfolio is most dose-sensitive in humans.

  Two mechanisms run downstream and both reach bone. Loss of S1P selectively
  fails to activate the ER-stress transducer BBF2H7, so collagen is retained in
  the chondrocyte ER and the cells die; and mannose-6-phosphate-dependent
  delivery to the lysosome is partly impaired, so lysosomal hydrolases are
  secreted rather than delivered and degrade bone matrix from outside. The
  secreted enzymes are also the disease's diagnostic handle: elevated plasma
  lysosomal hydrolases in a child with a skeletal dysplasia is what should prompt
  MBTPS1 testing.

  Nomenclature is inconsistent in the literature and worth knowing about. MONDO
  and OMIM call it spondyloepiphyseal dysplasia, Kondo-Fu type; GeneReviews calls
  it MBTPS1-related spondyloepimetaphyseal dysplasia with elevated lysosomal
  enzymes. They are the same disease.
synonyms:

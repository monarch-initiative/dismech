treatments:
- name: Orthopedic Management of Kyphoscoliosis, Scoliosis and Hip Dysplasia
  description: >-
    Specialist orthopedic management of the spinal curvature and the hip
    dysplasia. This is the largest single item of care in the disease and the
    only one directed at the skeletal syndrome itself rather than at one of its
    complications.
  treatment_term:
    preferred_term: orthopedic management of spinal and hip deformity
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Defective Endochondral Skeletal Development
    treatment_effect: MODULATES
    description: >-
      Symptomatic and structural management of the deformities the growth-plate
      lesion produces. It does not act on the lesion.
  target_phenotypes:
  - preferred_term: Kyphosis
    term:
      id: HP:0002808
      label: Kyphosis
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  - preferred_term: Hip dysplasia
    term:
      id: HP:0001385
      label: Hip dysplasia
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Management of kyphoscoliosis, scoliosis, and hip dysplasia per orthopedist'
    explanation: The GeneReviews management recommendation, which names the three deformities and
      the specialist responsible.
  notes: >-
    GeneReviews says "per orthopedist" without naming a modality, so the binding
    is the generic NCIT:C49236 (Therapeutic Procedure) rather than NCIT:C16186
    (Orthopedic Surgical Procedure), which would assert surgery the source does
    not. therapeutic_modality is left unset for the same reason.
- name: Vitamin D and Calcium Supplementation
  description: >-
    Supplementation directed at the reduced bone density, which in this disease
    is not a nutritional deficiency but the consequence of lysosomal hydrolases
    reaching the bone matrix instead of the lysosome.
  treatment_term:
    preferred_term: vitamin D and calcium supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: vitamin D
      term:
        id: CHEBI:27300
        label: vitamin D
    - preferred_term: calcium
      term:
        id: CHEBI:29108
        label: calcium(2+)
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Extracellular Lysosomal Enzyme-Mediated Bone Matrix Degradation
    treatment_effect: MODULATES
    description: >-
      Supports mineralization against the matrix degradation this node describes.
      It supplies substrate for bone mineral; it does not stop the mis-sorted
      enzymes from reaching the matrix, so it is symptomatic rather than
      mechanism-directed.
  target_phenotypes:
  - preferred_term: Reduced bone mineral density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'vitamin D and calcium for reduced bone density'
    explanation: Names both agents and the indication in the GeneReviews management list.
- name: Physical Therapy
  description: >-
    Physical therapy to maximize mobility and to reduce later orthopedic
    complications, given alongside the orthopedic management rather than instead
    of it.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Defective Endochondral Skeletal Development
    treatment_effect: MODULATES
    description: >-
      Preserves function against the skeletal syndrome and is stated to reduce
      the risk of later-onset complications of it.
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'physical therapy to maximize mobility and reduce the risk for later-onset orthopedic
      complications'
    explanation: States both the immediate and the preventive purpose of physical therapy here.
  notes: >-
    GeneReviews pairs this with an agents-to-avoid instruction that belongs with
    it: "In children with significant kyphoscoliosis, sports that place stress on
    the spine (e.g., heavy lifting, weight-bearing exercises) should be avoided."
    dismech has no contraindication slot on Treatment, so the restriction is
    recorded here rather than being lost.

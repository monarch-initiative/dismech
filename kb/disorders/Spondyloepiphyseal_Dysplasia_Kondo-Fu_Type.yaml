diagnosis:
- name: Plasma or dried blood spot lysosomal enzyme panel
  description: >-
    Measurement of multiple lysosomal hydrolases in plasma or dried blood spots.
    Elevation of several enzymes together in a child with a skeletal dysplasia is
    the pattern that distinguishes this disease and should prompt MBTPS1 testing.
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Increased concentration of multiple lysosomal hydrolase enzymes can be identified in
      plasma and dried blood spots.'
    explanation: Names both acceptable specimen types for this test.
- name: Molecular genetic testing of MBTPS1
  description: >-
    Identification of biallelic pathogenic MBTPS1 variants, usually by exome
    sequencing. Note that variant interpretation is genuinely hard here: the Saudi
    patient's homozygous missense allele was returned as a variant of unknown
    significance and was upgraded to likely pathogenic only on the strength of the
    clinical and radiographic phenotype.
  evidence:
  - reference: PMID:38048414
    reference_title: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The diagnosis of MBTPS1-SEMD is established in a proband with characteristic clinical
      and radiographic findings, elevated lysosomal hydrolase enzymes in plasma or dried blood spots,
      and biallelic pathogenic variants in MBTPS1 identified by molecular genetic testing.'
    explanation: The GeneReviews diagnostic criteria, which require all three components rather than
      the genotype alone.
  - reference: PMID:36330313
    reference_title: Identification of a New Variant of the MBTPS1 Gene of the Kondo-Fu Type of Spondyloepiphyseal
      Dysplasia (SEDKF) in a Saudi Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We are mindful that changing the classification of a variant of unknown significance is
      challenging.'
    explanation: The authors' own statement of the interpretive difficulty, which is why this entry
      records variant interpretation as a real diagnostic obstacle rather than a formality.
discussions:
- discussion_id: mbtps1_er_stress_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#ER Retention of Collagen in Chondrocytes
  prompt: >-
    Reducing ER stress mitigated the collagen-trafficking defect in the founding
    study's cellular system. Does pharmacological relief of ER stress improve the
    skeletal phenotype in vivo, and is there a window in which it would help?
  rationale: >-
    This is the only tractable therapeutic lead in the disease and the founding
    authors flag it as generalisable, noting that ER dysfunction is common across
    genetic skeletal disorders. Two things are unknown. First, the rescue was
    shown in cells, and no animal model of MBTPS1 deficiency has been reported
    with a treatment arm. Second, the skeletal damage is developmental, so even an
    effective agent might have to be given before a diagnosis is usually made -
    and this disease is typically diagnosed after postnatal growth failure is
    already apparent.
notes: >-
  Curated de novo. GeneReviews (PMID:38048414) exists for this disease and was
  used as the mandatory phenotype baseline; its Clinical Characteristics list is
  the source for most phenotypes here, and every feature it names is either
  curated or - in the case of prominent cheekbones and large prominent ears -
  covered by the shared facial-gestalt quote without a separate entry.

  The mechanism comes from the founding paper (PMID:30046013), which is unusually
  complete for a single-patient report: it establishes the residual transcript
  level, the specific transducer that fails, both downstream arms, and a rescue.

  Two curation choices worth checking:

  First, Preserved Lipid Homeostasis is curated as a pathophysiology node even
  though it records a function that is NOT disrupted. S1P's best-known role is
  SREBP activation, so a reader coming to this entry expects a lipid disease; the
  node exists to say explicitly that the lipid arm is spared at this residual
  enzyme level, which is the finding that makes the skeletal phenotype
  interpretable. If the convention is that pathophysiology nodes must be disrupted
  processes, this should become a note instead - flagging it rather than assuming.

  Second, the elevated lysosomal hydrolases are curated as a biochemical marker
  rather than a phenotype, and deliberately left unbound. HPO has terms for
  individual enzyme activities (for example beta-mannosidase) but none for a
  generic elevation of multiple lysosomal hydrolases, and binding a single-enzyme
  term would misstate a multi-enzyme finding. Per the ontology term contract, no
  term beats a bad one.

  Nomenclature: MONDO and OMIM call this spondyloepiphyseal dysplasia, Kondo-Fu
  type; GeneReviews calls it MBTPS1-related spondyloepimetaphyseal dysplasia with
  elevated lysosomal enzymes. The entry name follows MONDO, the phenotype binding
  follows the radiographic description (which includes metaphyseal involvement),
  and both names are in synonyms.

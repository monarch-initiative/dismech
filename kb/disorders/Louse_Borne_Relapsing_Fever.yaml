  rate_per_100000: 2500.0
  notes: >-
    Cross-sectional blood-film survey of 407 high-risk individuals; overall LBRF
    prevalence 2.5%, highest in religious-school students (6.1%) and street
    children (4.9%).
  evidence:
  - reference: PMID:25196787
    reference_title: Prevalence and risk factors of louse-borne relapsing fever in high risk populations in Bahir Dar city Northwest Ethiopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of LBRF was 2.5% and the positivity rate of LBRF was

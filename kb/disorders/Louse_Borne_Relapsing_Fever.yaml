- name: Forced migration and displacement
  description: >-
    Migrants, refugees and the displaced are at high risk; the 2015 European
    resurgence occurred in young male asylum seekers from the Horn of Africa,
    most likely infected during their journey through Sudan and Libya.
  effect: Increases risk of LBRF in displaced and refugee populations
  influences_mechanisms:
  - target: Body-Louse Borrelia recurrentis Acquisition
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Crowded transit and refugee conditions during forced migration promote
      body-louse infestation and B. recurrentis acquisition.
    evidence:
    - reference: PMID:26538532
      reference_title: "Louse-borne relapsing fever (Borrelia recurrentis) diagnosed in 15 refugees from northeast Africa: epidemiology and preventive control measures, Bavaria, Germany, July to October 2015."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The majority likely acquired their infection during migration.
      explanation: >-
        States that most 2015 imported European cases acquired LBRF during the
        migration journey.
  evidence:
  - reference: PMID:26538532
    reference_title: "Louse-borne relapsing fever (Borrelia recurrentis) diagnosed in 15 refugees from northeast Africa: epidemiology and preventive control measures, Bavaria, Germany, July to October 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epidemiological findings confirmed that all were young males from the
      Horn of Africa (12 from Somalia), who had similar migration routes
      converging in Sudan continuing through Libya and Italy.
    explanation: >-
      Documents the displaced-migrant risk population and the migration route
      of the 2015 imported European cases.

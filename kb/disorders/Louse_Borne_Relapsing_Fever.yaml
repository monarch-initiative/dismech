name: Louse-Borne Relapsing Fever
creation_date: "2026-11-26T18:24:10Z"
description: >-
  Louse-borne relapsing fever is an epidemic, human-to-human relapsing-fever
  borreliosis caused by Borrelia recurrentis and transmitted by the human body
  louse, in which variable major protein antigenic switching drives recurring
  spirochetemic febrile episodes and antibiotic-triggered spirochete lysis
  precipitates a severe Jarisch-Herxheimer reaction.
category: Infectious Disease
disease_term:
  preferred_term: louse-borne relapsing fever
  term:
    id: MONDO:0001620
    label: louse-borne relapsing fever
parents:
- Relapsing Fever
synonyms:
- Relapsing fever, louse-borne
- Epidemic relapsing fever
- LBRF
- Borrelia recurrentis infection
notes: >-
  The agent Borrelia recurrentis (NCBITaxon:44449) is the sole cause of
  louse-borne relapsing fever, and the body louse Pediculus humanus is the sole
  proven vector; humans are the only known reservoir. This separates the entry
  cleanly from its sibling tick-borne relapsing fever, which is a zoonotic
  Ornithodoros-borne union of species with a small-mammal reservoir. Petechial
  rash and jaundice frequencies vary widely between cohorts (rash 2-80%,
  jaundice 7->70%), so no frequency band is asserted for them; the cited
  per-cohort figures are given in each phenotype's evidence instead. Several
  cohorts report epistaxis at 24% (Asella) and 83.3% (Jimma prison outbreak),
  so epistaxis likewise carries no single band.
infectious_agent:
- name: Borrelia recurrentis
  infectious_agent_term:
    preferred_term: Borrelia recurrentis
    term:
      id: NCBITaxon:44449
      label: Borrelia recurrentis
  description: >-
    Borrelia recurrentis is the spirochete that causes louse-borne relapsing
    fever; it is confined to humans and transmitted by a single vector, the
    human body louse.
  evidence:
  - reference: PMID:33705384
    reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 1-Epidemiology and diagnostic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease's causative pathogen, the spirochete bacterium Borrelia
      recurrentis, is confined to humans and transmitted by a single vector,
      the human body louse Pediculus humanus.
    explanation: >-
      Identifies B. recurrentis as the LBRF agent, confined to humans and
      transmitted by the single body-louse vector.
agent_life_cycle:
  description: >-
    Borrelia recurrentis cycles exclusively between humans and the human body
    louse; there is no known animal reservoir. Lice are infected during a blood
    meal, cannot infect their progeny, and transmit the spirochete when their
    coelomic fluid or faeces is inoculated through broken skin by scratching.
  hosts:
  - preferred_term: Homo sapiens
    role: sole reservoir host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Pediculus humanus
    role: body-louse vector
    term:
      id: NCBITaxon:121225
      label: Pediculus humanus
  vectors:
  - Human body louse (Pediculus humanus)
  evidence:
  - reference: PMID:33705384
    reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 1-Epidemiology and diagnostic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The body louse is currently the only proven vector, and humans are the
      only known reservoir.
    explanation: >-
      Establishes the anthroponotic life cycle: body louse as the only proven
      vector and humans as the only known reservoir.
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since lice, unlike ticks, cannot infect their progeny, they do not act as
      reservoirs.
    explanation: >-
      Supports that the louse is a transmission vector only, not a reservoir,
      so maintenance depends on human infection.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:33705384
      reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 1-Epidemiology and diagnostic aspects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Louse-borne relapsing fever (LBRF) is a classical epidemic disease,
        which in the past was associated with war, famine, poverty, forced
        migration, and crowding under poor hygienic conditions around the world.
      explanation: >-
        Establishes LBRF as an epidemic vector-borne spirochetal infectious
        disease.
transmission:
- name: Human body louse transmission
  description: >-
    Borrelia recurrentis is transmitted from human to human by the body louse
    Pediculus humanus; infection occurs when a crushed louse's coelomic fluid
    or louse faeces is rubbed into broken skin or mucous membranes by
    scratching.
  evidence:
  - reference: PMID:27188655
    reference_title: "Louse-borne relapsing fever - report of four cases in Switzerland, June-December 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This neglected disease is exclusively transmitted from human to human via
      the human body louse Pediculus humanus humanus, which is linked to areas
      of overcrowding, war, and destitution
    explanation: >-
      Directly supports exclusive human-to-human body-louse transmission of
      B. recurrentis.
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Coelomic fluid from a crushed louse, or louse faeces infected with B.
      recurrentis, is inoculated through broken skin, or intact mucous
      membranes such as the conjunctiva, by scratching.
    explanation: >-
      Describes the mechanical route of inoculation from a crushed louse into
      broken skin by scratching.
pathophysiology:
- name: Body-Louse Borrelia recurrentis Acquisition
  role: trigger
  description: >-
    Borrelia recurrentis enters the human host when infective coelomic fluid or
    faeces from a body louse is inoculated through broken skin, establishing
    spirochetemia.
  biological_scale: ORGANISM
  downstream:
  - target: Complement and Innate Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Once in the blood the spirochete must evade innate complement killing to
      establish infection.
  - target: Spirochetemic Dissemination
    causal_link_type: DIRECT
    description: >-
      Inoculated spirochetes enter the bloodstream and disseminate as a
      high-density spirochetemia.
  evidence:
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Coelomic fluid from a crushed louse, or louse faeces infected with B.
      recurrentis, is inoculated through broken skin, or intact mucous
      membranes such as the conjunctiva, by scratching.
    explanation: >-
      Supports inoculation of the spirochete into the human host as the
      initiating event.
- name: Complement and Innate Immune Evasion
  description: >-
    Borrelia recurrentis expresses receptors that bind host complement
    regulators (C4bp, C1-inhibitor, factor H) and plasmin, blunting
    complement activation so the spirochete survives in blood.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: complement activation
    modifier: DECREASED
    term:
      id: GO:0006956
      label: complement activation
  downstream:
  - target: Spirochetemic Dissemination
    causal_link_type: DIRECT
    description: >-
      Complement evasion allows survival and expansion of bloodstream Borrelia.
  evidence:
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      B. recurrentis is protected from the host's innate immunity by expressing
      receptors that selectively bind C4bp and C1-Inh, the endogenous
      regulators of the classical and lectin complement pathway
    explanation: >-
      Supports complement-regulator recruitment as the innate-evasion mechanism
      used by B. recurrentis.
- name: Spirochetemic Dissemination
  description: >-
    Borrelia recurrentis proliferates to very high densities in blood, producing
    bacteremic waves that expose surface variable major proteins to the humoral
    immune response.
  biological_scale: ORGANISM
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: Vmp Antigenic Switching
    causal_link_type: DIRECT
    description: >-
      High-density bloodstream expansion creates the antigenic-variation
      dynamics that drive recurrent bacteremic waves.
  - target: Jarisch-Herxheimer Reaction
    causal_link_type: DIRECT
    description: >-
      The circulating spirochete burden sets the severity of the
      Jarisch-Herxheimer reaction precipitated when antibiotics lyse the
      organisms.
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      High-level bacteremia is accompanied by thrombocytopenia, which underlies
      the petechial rash and bleeding.
  - target: Jaundice
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Spirochete burden in the liver produces hepatocellular damage and
      jaundice.
  - target: Hepatosplenomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Spirochete burden in the reticuloendothelial system enlarges the liver
      and spleen.
  - target: Anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      High-level bacteremia is accompanied by a moderate normochromic anaemia.
  - target: Myocarditis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Spirochetes in the myocardium produce a perivascular interstitial
      myocarditis in severe and fatal disease.
  evidence:
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circulating spirochaete densities may exceed 500 000/mm3 of blood.
    explanation: >-
      Quantifies the high-density spirochetemia characteristic of human LBRF.
- name: Vmp Antigenic Switching
  description: >-
    Borrelia recurrentis switches expression of its variable major outer-membrane
    lipoprotein (vmp) to evade the serotype-specific antibody response and
    restart bacteremia after each immune clearance.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: antigenic variation
    modifier: INCREASED
    term:
      id: GO:0020033
      label: antigenic variation
  downstream:
  - target: Recurrent Spirochetemic Febrile Episodes
    causal_link_type: DIRECT
    description: >-
      Each new vmp serotype restarts bacteremia, producing the next febrile
      episode.
    evidence:
    - reference: PMID:30869050
      reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        explaining the sequential emergence of borreliae expressing different
        vmps during the course of an untreated infection.
      explanation: >-
        Supports vmp switching as the cause of the sequential bacteremic
        relapses that produce successive febrile episodes.
  evidence:
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The new external membrane allows borreliae to evade the host's humoral
      immune response until antibodies are generated against the new serotypic
      vmp antigen, explaining the sequential emergence of borreliae expressing
      different vmps during the course of an untreated infection.
    explanation: >-
      Supports sequential vmp switching as the molecular basis of recurrent
      bacteremic waves in LBRF.
- name: Antibody-Mediated Clearance of Bacteremic Waves
  description: >-
    Specific bactericidal IgM generated by the B1b-cell subset lyses the
    dominant spirochete serotype independently of complement and T cells,
    ending each bacteremic wave and selecting for the next vmp variant.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: B-1b B cell
    term:
      id: CL:0000821
      label: B-1b B cell
  biological_processes:
  - preferred_term: humoral immune response
    modifier: INCREASED
    term:
      id: GO:0006959
      label: humoral immune response
  downstream:
  - target: Vmp Antigenic Switching
    causal_link_type: DIRECT
    description: >-
      Antibody clearance of the dominant serotype selects for spirochetes that
      have switched to a new vmp, driving the next wave.
  evidence:
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Attacks of relapsing fever end abruptly when specific bactericidal
      immunoglobulin M antibodies generated by the B1b cell subset lyse
      spirochaetes in the blood, independently of complement and T cells.
    explanation: >-
      Supports B1b-cell T-independent IgM as the response that clears each
      bacteremic wave, the selection pressure behind antigenic switching.
- name: Recurrent Spirochetemic Febrile Episodes
  description: >-
    Successive vmp-defined bacteremic waves produce the recurring high-fever
    episodes separated by afebrile intervals that define relapsing fever; in
    LBRF the number of relapses is usually lower than in tick-borne disease.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent fever
    description: >-
      The waxing and waning bacteremic waves present clinically as recurrent
      fever.
  - target: Fever
    description: >-
      Each bacteremic wave drives an abrupt high fever at the onset of the
      attack.
  - target: Headache
    description: >-
      Headache is among the earliest symptoms accompanying the febrile wave.
  - target: Myalgia
    description: >-
      Generalized muscle pain accompanies the acute febrile episode.
  - target: Arthralgia
    description: >-
      Joint pain accompanies the acute febrile episode.
  - target: Abdominal pain
    description: >-
      Abdominal pain is a common symptom of the acute febrile attack.
  evidence:
  - reference: PMID:33705387
    reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 2-Mortality, Jarisch-Herxheimer reaction, impact on pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Untreated attacks resolve by crisis after 4 to 10 (average 5) days. This
      is followed by an afebrile remission of 5 to 9 days and succeeded by up
      to 5 relapses of diminishing severity
    explanation: >-
      Documents the attack-remission-relapse pattern of untreated LBRF.
  - reference: PMID:35171908
    reference_title: Tick borne relapsing fever - a systematic review and analysis of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the number of recurrent fever episodes is overall lower in LBRF (mostly
      less than 2) compared to TBRF (≥2), while the paroxysms last longer in
      LBRF (up to 10 days) compared to TBRF
    explanation: >-
      Supports the distinguishing clinical axis that LBRF typically has fewer,
      longer relapses than tick-borne relapsing fever.
- name: Jarisch-Herxheimer Reaction
  description: >-
    Antibiotic-induced spirochete lysis releases variable major protein that
    stimulates monocytes to produce TNF-alpha, IL-6 and IL-8, driving a
    tri-phasic reaction of rigors, surging fever and then hypotension within
    hours of the first dose.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Chills
    description: >-
      The chill phase of the reaction produces acute, intense rigors within
      hours of the first antibiotic dose.
  - target: Hypotension
    description: >-
      Cytokine-driven systemic vasodilatation during the flush phase causes a
      fall in blood pressure and potential collapse.
  evidence:
  - reference: PMID:9846580
    reference_title: Variable major lipoprotein is a principal TNF-inducing factor of louse-borne relapsing fever.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the predominant factor inducing tumor necrosis factor is a
      variable lipoprotein homologous to the variable major protein of B.
      hermsii.
    explanation: >-
      Identifies the variable major lipoprotein as the dominant TNF-inducing
      factor behind the Jarisch-Herxheimer reaction in LBRF.
  - reference: PMID:8663853
    reference_title: Prevention of Jarisch-Herxheimer reactions by treatment with antibodies against tumor necrosis factor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      antimicrobial treatment is often followed by sudden fever, rigors, and
      persistent hypotension (Jarisch-Herxheimer reactions) that are associated
      with increases in plasma concentrations of tumor necrosis factor alpha
      (TNF-alpha), interleukin-6, and interleukin-8
    explanation: >-
      Documents the TNF-alpha / IL-6 / IL-8 cytokine surge and the clinical
      fever-rigor-hypotension triad of the reaction after antibiotic treatment.

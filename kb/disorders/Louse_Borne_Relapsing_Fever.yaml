- name: Hypotension
  category: Cardiovascular
  description: >-
    Hypotension complicates the flush phase of the Jarisch-Herxheimer reaction
    and severe disease, and can progress to intractable shock.
  phenotype_term:
    preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension

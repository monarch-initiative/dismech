  evidence:
  - reference: PMID:8511813
    reference_title: "Louse-borne relapsing fever. A clinical and an epidemiological study of 389 patients in Asella Hospital, Ethiopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common clinical features of the disease were fever (99%), headache

    explanation: >-
      A cross-sectional survey of high-risk Ethiopian populations found an
      overall LBRF prevalence of 2.5%.
environmental:
- name: Overcrowding and poor personal hygiene
  description: >-
    Body-louse infestation thrives in overcrowded, unhygienic conditions, so
    war, famine, forced migration, poverty and cold weather that drive crowding
    are the classic epidemic drivers of LBRF.
  effect: Increases body-louse infestation and risk of LBRF transmission
  influences_mechanisms:
  - target: Body-Louse Borrelia recurrentis Acquisition
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Crowding and poor hygiene increase body-louse infestation, raising the
      probability of inoculation with B. recurrentis.
    evidence:
    - reference: PMID:33705384
      reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 1-Epidemiology and diagnostic aspects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Living in cramped and poor hygienic conditions provides favorable
        conditions for the transmission of LBRF
      explanation: >-
        Identifies crowding and poor hygiene as the conditions that drive LBRF
        transmission by promoting body-louse infestation.
  evidence:
  - reference: PMID:33705384
    reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 1-Epidemiology and diagnostic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Living in cramped and poor hygienic conditions provides favorable
      conditions for the transmission of LBRF
    explanation: >-
      Identifies crowding and poor hygiene as the conditions that drive LBRF

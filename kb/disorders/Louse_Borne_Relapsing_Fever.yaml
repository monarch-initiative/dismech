    reference_title: Prevention of Jarisch-Herxheimer reactions by treatment with antibodies against tumor necrosis factor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      antimicrobial treatment is often followed by sudden fever, rigors, and
      persistent hypotension (Jarisch-Herxheimer reactions)
    explanation: >-
      Documents persistent hypotension as a core feature of the
      Jarisch-Herxheimer reaction in LBRF.
- name: Myocarditis
  category: Cardiovascular
  description: >-
    A perivascular histiocytic interstitial myocarditis is found in most fatal
    cases and can cause acute myocardial failure during the flush phase.
  phenotype_term:
    preferred_term: Myocarditis
    term:
      id: HP:0012819
      label: Myocarditis
  evidence:
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A perivascular histiocytic interstitial myocarditis, found in the
      majority of fatal cases, may be responsible for conduction defects,
      arrhythmias and myocardial failure resulting in sudden death.
    explanation: >-
      Documents myocarditis in the majority of fatal LBRF cases as a cause of
      myocardial failure and sudden death.
- name: Premature birth
  category: Obstetric
  description: >-
    LBRF in pregnancy frequently precipitates premature labour; adverse
    pregnancy outcomes are reported in roughly three out of four pregnancies.
  phenotype_term:
    preferred_term: Premature birth
    term:
      id: HP:0001622
      label: Premature birth
  evidence:
  - reference: PMID:33705387
    reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 2-Mortality, Jarisch-Herxheimer reaction, impact on pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LBRF-related adverse outcomes are observed in 3 out of 4 pregnancies.
    explanation: >-
      A systematic review of LBRF pregnancy outcomes reports adverse outcomes
      (including premature delivery and stillbirth) in about 75% of
      pregnancies.
- name: Jarisch-Herxheimer reaction
  category: Systemic
  description: >-
    A sudden, potentially fatal fever-rigor-hypotension reaction follows the
    first antibiotic dose in a large proportion of treated patients, caused by
    massive cytokine release on spirochete lysis.
  evidence:
  - reference: PMID:33705387
    reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 2-Mortality, Jarisch-Herxheimer reaction, impact on pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, JHR was observed in 1,452 of the 2,618 reported cases,
      corresponding to an incidence rate of 55.8%.
    explanation: >-
      The systematic review's pooled estimate of Jarisch-Herxheimer reaction in
      reported LBRF cases is 55.8%, much higher than in tick-borne disease.
diagnosis:
- name: Blood-film microscopy
  description: >-
    LBRF is diagnosed in most settings by direct microscopic visualization of
    spirochetes on Giemsa- or Wright-stained thick and thin peripheral blood
    films taken during a febrile episode; microscopy remains the gold standard
    and most widely available method.
  diagnosis_term:
    preferred_term: Microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  evidence:
  - reference: PMID:33705384
    reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 1-Epidemiology and diagnostic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microscopy remains the most commonly used method to diagnose LBRF.
    explanation: >-
      Establishes blood-film microscopy as the standard diagnostic method for
      LBRF.
  - reference: PMID:27188655
    reference_title: "Louse-borne relapsing fever - report of four cases in Switzerland, June-December 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is established by demonstration of spirochetes in stained blood
      films during febrile episodes
    explanation: >-
      Confirms that diagnosis rests on visualizing spirochetes in stained blood
      films during febrile episodes.
- name: Molecular Borrelia recurrentis identification by PCR
  description: >-
    Polymerase chain reaction targeting the 16S rRNA gene (with sequencing)
    confirms B. recurrentis and is more sensitive than microscopy; because
    LBRF and tick-borne Borrelia are microscopically indistinguishable, PCR is
    needed for true species-level confirmation and has detected
    microscopy-negative cases.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:33705384
    reference_title: "Louse-borne relapsing fever-A systematic review and analysis of the literature: Part 1-Epidemiology and diagnostic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the introduction of PCR-based methods, the diagnostic sensitivity
      improved markedly, and species differentiation of relapsing fever
      Borrelia became available
    explanation: >-
      Supports PCR as the more sensitive, species-level confirmatory method for
      LBRF.
  - reference: PMID:27188655
    reference_title: "Louse-borne relapsing fever - report of four cases in Switzerland, June-December 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple spirochetes were visualized on stained blood films which were
      identified as Borrelia recurrentis by 16S rRNA gene sequencing.
    explanation: >-
      Worked example of 16S rRNA sequencing confirming B. recurrentis in
      imported European cases.
treatments:
- name: Single-dose antibiotic therapy
  description: >-
    LBRF is cured by a single dose of a tetracycline (tetracycline or
    doxycycline), erythromycin, chloramphenicol, or penicillin. Tetracycline
    clears spirochetes fastest and best prevents relapse but carries the
    highest Jarisch-Herxheimer risk; low-dose penicillin causes fewer reactions
    but more relapses. Patients must be closely monitored after the first dose
    for a potentially fatal Jarisch-Herxheimer reaction, and critically ill
    patients should be resuscitated before specific treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: tetracycline
      term:
        id: CHEBI:27902
        label: tetracycline
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
    - preferred_term: penicillin
      term:
        id: CHEBI:17334
        label: penicillin
    - preferred_term: chloramphenicol
      term:
        id: CHEBI:17698
        label: chloramphenicol
  target_mechanisms:
  - target: Spirochetemic Dissemination
    treatment_effect: INHIBITS
    description: >-
      Antibiotics clear spirochetes from the blood, aborting the attack and
      preventing relapse.
  - target: Jarisch-Herxheimer Reaction
    treatment_effect: ACTIVATES
    description: >-
      Rapid antibiotic-induced spirochete lysis releases variable major protein
      and precipitates the Jarisch-Herxheimer reaction.
  evidence:
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Complete cure with prevention of relapses is achievable with a single
      oral dose of 500 mg tetracycline or 500 mg erythromycin stearate.
    explanation: >-
      Supports single-dose tetracycline or erythromycin as curative treatment
      for LBRF.
  - reference: PMID:1396621
    reference_title: Tetracycline versus penicillin in the treatment of louse-borne relapsing fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, tetracycline is recommended as first choice therapy and a single
      dose is sufficient for treatment of LBRF patients.
    explanation: >-
      A randomized Ethiopian trial recommends single-dose tetracycline as
      first-choice therapy.
  - reference: PMID:7784810
    reference_title: "Treatment of louse-borne relapsing fever with low dose penicillin or tetracycline: a clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As mortality is linked to severe JHR, and most relapses are clinically
      mild and easily treated, these results speak in favour of using low-dose
      penicillin to initiate the treatment of relapsing fever.
    explanation: >-
      A clinical trial shows low-dose penicillin lowers Jarisch-Herxheimer risk
      at the cost of more relapses, the tradeoff versus tetracycline.
progression:
- phase: Incubation
  description: >-
    An incubation period of 4-18 days (average 7) follows infection before the
    abrupt onset of the first attack.
  evidence:
  - reference: PMID:30869050
    reference_title: Louse-borne relapsing fever (Borrelia recurrentis infection).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The incubation period is 4–18 (average 7) days.
    explanation: Gives the incubation period of LBRF.
- phase: First febrile episode
  description: >-
    The attack starts abruptly with fever rising to nearly 40 degrees Celsius,
    rigors, headache and generalized pains, lasting an average of 5 days before
    resolving by crisis.
- phase: Afebrile remission
  description: >-
    An afebrile remission of 5-9 days follows the crisis.
- phase: Relapses
  description: >-
    Up to five relapses of diminishing severity may follow, typically fewer than
    in tick-borne relapsing fever.

    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A study of infants and children in Arsi Region, Ethiopia, found that the
      common clinical features were fever (100%), headache (84.5%), chills
      (74%), abdominal pain (51%), epistaxis (20%), hepatomegaly (26%),
      splenomegaly (14%), petechial rash (34%) and jaundice (10%).
    explanation: >-
      An Arsi Region paediatric series reports chills in 74% of patients.

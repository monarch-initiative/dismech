      components of either the small 40S (RPS19, RPS17, RPS24) or large 60S
      (RPL35A, RPL5, RPL11) ribosomal subunits.
    explanation: >-
      Confirms RPS19 as a prototypical 40S ribosomal protein gene mutated in
      Diamond-Blackfan anemia.
- name: SBDS
  association: Ribosome assembly factor deficiency causes impaired 60S ribosomal subunit maturation
  gene_term:
    preferred_term: SBDS
    term:
      id: hgnc:19440
      label: SBDS
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variant_origin: GERMLINE
  subtype: Shwachman-Diamond Syndrome
  evidence:
  - reference: PMID:36542827
    reference_title: "Predisposition to myeloid malignancies in Shwachman-Diamond syndrome: biological insights and clinical advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathobiology of SDS results from impaired ribosomal maturation due
      to the deficiency of SBDS and the inability to evict the antiassociation
      factor eIF6 from the 60S ribosomal subunit
    explanation: >-
      Defines the molecular mechanism of SBDS deficiency in SDS.
- name: MPL
  association: Thrombopoietin receptor, biallelic mutations cause congenital amegakaryocytic thrombocytopenia
  gene_term:
    preferred_term: MPL
    term:
      id: hgnc:7217
      label: MPL
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variant_origin: GERMLINE
  subtype: Congenital Amegakaryocytic Thrombocytopenia
  evidence:
  - reference: PMID:34404532
    reference_title: "Congenital amegakaryocytic thrombocytopenia - Not a single disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CAMT in a narrow sense, which is primarily restricted to the
      hematopoietic system, is caused mainly by mutations in the gene for the
      thrombopoietin receptor (MPL), sometimes in the gene for its ligand (THPO)
    explanation: >-
      Confirms MPL mutations as the main cause of congenital amegakaryocytic
      thrombocytopenia.
diagnosis:
- name: Chromosome breakage testing (DEB/MMC)
  description: >-
    Chromosome breakage analysis in T lymphocytes cultured with
    diepoxybutane (DEB) or mitomycin C (MMC) is the gold-standard screening
    test for Fanconi anemia.
  results: >-
    Markedly increased chromosomal breaks and radial figures in response to
    DNA interstrand crosslinking agents.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:20417588
    reference_title: "Pathophysiology and management of inherited bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The suspected diagnosis is usually confirmed by demonstration of
      chromosomal aberrations in blood lymphocytes cultured with a
      DNA-crosslinking agent such as diepoxybutane (DEB) or mitomycin C (MMC)
    explanation: >-
      Establishes DEB/MMC chromosomal breakage testing as the diagnostic test
      for Fanconi anemia.
- name: Peripheral blood leukocyte telomere length measurement (flow-FISH)
  description: >-
    Measurement of telomere length in peripheral blood leukocyte subsets by
    multicolor flow cytometry fluorescence in situ hybridization (flow-FISH)
    screens for dyskeratosis congenita and other telomere biology disorders.
  results: >-
    Telomere length below the first percentile for age across leukocyte subsets.
  diagnosis_term:
    preferred_term: Flow Cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:31647584
    reference_title: "Comparison of flow-FISH and MM-qPCR telomere length assessment techniques for the screening of telomeropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assessment of telomere length (TL) in peripheral blood leukocytes is
      part of the diagnostic algorithm applied to patients with acquired bone
      marrow failure syndromes (BMFSs) and dyskeratosis congenita (DKC)
    explanation: >-
      Supports leukocyte telomere length testing by flow-FISH as part of the
      diagnostic algorithm for bone marrow failure syndromes and dyskeratosis
      congenita.
- name: Bone marrow aspiration and biopsy
  description: >-
    Bone marrow aspiration and trephine biopsy evaluate marrow cellularity,
    megakaryocyte/erythroid/myeloid maturation, and cytogenetic or somatic
    clonal evolution toward myelodysplastic syndrome or acute myeloid leukemia.
  results: >-
    Hypocellular bone marrow for age with lineage hypoplasia and detection of
    premalignant cytogenetic or TP53-mutated clones during surveillance.
  diagnosis_term:
    preferred_term: Bone Marrow Aspiration and Biopsy
    term:
      id: NCIT:C92958
      label: Bone Marrow Aspiration and Biopsy
  evidence:
  - reference: PMID:36542827
    reference_title: "Predisposition to myeloid malignancies in Shwachman-Diamond syndrome: biological insights and clinical advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single-cell DNA sequencing of SDS bone marrow samples can detect
      premalignant biallelic TP53-mutated clones before clinical diagnosis
    explanation: >-
      Supports bone marrow sampling and genomic surveillance in inherited bone
      marrow failure syndromes.
- name: Germline genetic testing (multigene panel or exome sequencing)
  description: >-
    Molecular genetic testing across Fanconi anemia, telomere biology,
    ribosomopathy, and thrombopoietin-signaling genes establishes the definitive
    subtype diagnosis and informs donor selection and conditioning regimens.
  results: >-
    Identification of pathogenic germline variants in IBMFS genes (e.g., FANCA,
    FANCC, TERT, TERC, DKC1, TINF2, RPS19, SBDS, MPL).
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:39371255
    reference_title: "Inherited Telomere Biology Disorders: Pathophysiology, Clinical Presentation, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In case of short TL below the 1% percentile, subsequent genetic testing is
      recommended to test for disease causing germline variants in so-far known
      TBD-related genes
    explanation: >-
      Supports germline genetic testing for disease-causing variants in
      inherited bone marrow failure / telomere biology disorder genes.
  - reference: PMID:20417588
    reference_title: "Pathophysiology and management of inherited bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The next step is determination of the complementation group by correction
      of the FA cellular phenotype by retroviral transfection of lymphoblasts or
      fibroblasts with one of the known FA genes; gene sequencing can then be
      performed to determine the relevant mutations.
    explanation: >-
      Supports molecular gene sequencing to identify causative germline
      mutations in Fanconi anemia and related inherited marrow failure
      syndromes.
differential_diagnoses:
- name: Acquired aplastic anemia
  disease_term:
    preferred_term: acquired aplastic anemia
    term:
      id: MONDO:0015610
      label: acquired aplastic anemia
  description: >-
    Immune-mediated bone marrow failure that can clinically mimic cryptic or
    adult-onset inherited bone marrow failure syndromes when congenital
    stigmata are absent.
  distinguishing_features:
  - Absence of pathogenic germline variants in IBMFS genes and normal DEB chromosomal breakage and flow-FISH telomere length (though mild telomere shortening can occur).
  - Cryptic FA or telomeropathies must be excluded before immunosuppressive therapy or standard-conditioning transplant.
  evidence:
  - reference: PMID:20417588
    reference_title: "Pathophysiology and management of inherited bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After examination of a bone marrow to confirm aplastic anemia and rule out
      acute leukemia or myelodysplastic syndrome (MDS), the pediatric approach
      usually begins with consideration of Fanconi anemia (FA) by physical
      examination and by testing for chromosome breakage, while the adult
      approach might be to rule out paroxysmal nocturnal hemoglobinuria (PNH)
      by flow cytometry for CD55 or CD59 negative clones.
    explanation: >-
      Demonstrates that inherited bone marrow failure syndromes such as Fanconi
      anemia must be distinguished from acquired aplastic anemia by physical
      examination and chromosome breakage testing.
- name: Paroxysmal nocturnal hemoglobinuria
  disease_term:
    preferred_term: paroxysmal nocturnal hemoglobinuria
    term:
      id: MONDO:0100244
      label: paroxysmal nocturnal hemoglobinuria
  description: >-
    Acquired clonal hematopoietic stem cell disorder (PIG-A mutation) closely
    linked to acquired aplastic anemia rather than inherited bone marrow
    failure syndromes.
  distinguishing_features:
  - GPI-anchored protein deficiency on flow cytometry and intravascular hemolysis, which are characteristic of acquired BMF/PNH rather than germline IBMFS.
  evidence:
  - reference: PMID:20417588
    reference_title: "Pathophysiology and management of inherited bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After examination of a bone marrow to confirm aplastic anemia and rule out
      acute leukemia or myelodysplastic syndrome (MDS), the pediatric approach
      usually begins with consideration of Fanconi anemia (FA) by physical
      examination and by testing for chromosome breakage, while the adult
      approach might be to rule out paroxysmal nocturnal hemoglobinuria (PNH)
      by flow cytometry for CD55 or CD59 negative clones.
    explanation: >-
      Notes that PNH clones are evaluated in the differential diagnosis of
      aplastic anemia alongside inherited marrow failure syndromes.
- name: Myelodysplastic syndrome
  disease_term:
    preferred_term: myelodysplastic syndrome
    term:
      id: MONDO:0018881
      label: myelodysplastic syndrome
  description: >-
    De novo or secondary clonal myeloid neoplasm that may be the initial
    presentation of an underlying cryptic inherited bone marrow failure
    syndrome.
  distinguishing_features:
  - Primary MDS lacks germline IBMFS variants, whereas IBMFS-associated MDS arises on a background of germline DNA repair, telomere, or ribosomal defects.
  evidence:
  - reference: PMID:20417588
    reference_title: "Pathophysiology and management of inherited bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, patients with an IBMFS may not present with aplastic anemia,
      but may have characteristic physical anomalies, MDS, acute myeloid
      leukemia (AML), or a solid tumor, or even pulmonary fibrosis or liver
      disease as their first sign of an IBMFS.
    explanation: >-
      Highlights that inherited marrow failure syndromes can initially present
      as MDS or AML and must be distinguished from sporadic MDS.
progression:
- phase: Progressive bone marrow failure
  age_range: Childhood to young adulthood
  notes: >-
    Hematologic cytopenias typically emerge in infancy or childhood (e.g.,
    birth onset in CAMT and DBA; median ~7 years in FA) and progress to
    multilineage aplastic anemia, with cumulative marrow failure incidence of
    roughly 50-90% depending on the syndrome.
  evidence:
  - reference: PMID:20417588
    reference_title: "Pathophysiology and management of inherited bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the cumulative incidences of these respective complications were around
      50, 25, and 10%
    explanation: >-
      Quantifies cumulative incidence of bone marrow failure (~50%), leukemia
      (~25%), and solid tumors (~10%) in FA.
- phase: Clonal evolution to MDS, AML, and solid tumors
  age_range: Childhood to adulthood
  notes: >-
    Patients across all major IBMFS subtypes carry a high cumulative risk of
    clonal evolution to myelodysplastic syndrome and acute myeloid leukemia, as
    well as squamous cell carcinomas and organ fibrosis (pulmonary and hepatic
    fibrosis in TBDs) in adolescence and adulthood.
  evidence:
  - reference: PMID:39371255
    reference_title: "Inherited Telomere Biology Disorders: Pathophysiology, Clinical Presentation, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      altered telomere maintenance as observed in TBDs typically results in
      premature replicative cellular exhaustion in the respective organ systems
      eventually leading to life-threatening complications such as bone marrow
      failure (BMF), pulmonary fibrosis, and liver cirrhosis
    explanation: >-
      Documents progression to bone marrow failure, pulmonary fibrosis, and
      liver cirrhosis in telomere biology disorders.
treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Only curative therapy for the bone marrow failure component. Reduced-intensity
    conditioning regimens have improved outcomes in FA and DC patients. In TBDs,
    toxicities of the conditioning regimen can be detrimental to other organs.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Bone Marrow Failure
    treatment_effect: RESTORES
    description: >-
      Allogeneic hematopoietic stem cell transplantation replaces the defective
      hematopoietic stem cell compartment and cures marrow aplasia.
  evidence:
  - reference: PMID:41859097
    reference_title: "Established and emerging non-cellular therapies in inherited bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allogeneic hematopoietic stem cell transplantation (HSCT) remains the
      only curative modality in eligible IBMF patients but the indications are
      individualized due to significant transplant-related morbidity, including
      secondary cancer
    explanation: >-
      Confirms HSCT as the only curative option for IBMFSs.
  - reference: PMID:41904107
    reference_title: "Bone marrow failure in telomere biology disorders: Current understanding and the emerging landscape of non-transplant therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While allogeneic hematopoietic cell transplant (HCT) is curative for
      BMF in TBD, toxicities of the conditioning regimen can be detrimental
      to other organs. Balancing the risk of malignant transformation with
      HCT toxicity is a core challenge for providers who care for patients
      with TBD-associated BMF
    explanation: >-
      Describes the transplant dilemma in TBDs where conditioning toxicity
      must be balanced against malignancy risk.
- name: Androgen Therapy
  description: >-
    Oxymetholone and other androgens can temporarily improve blood counts,
    particularly in FA and TBDs. Androgens may upregulate telomerase activity.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: oxymetholone
      term:
        id: CHEBI:7864
        label: oxymetholone
    - preferred_term: danazol
      term:
        id: CHEBI:4315
        label: danazol
  target_mechanisms:
  - target: Telomere Attrition
    treatment_effect: MODULATES
    description: >-
      Androgens stimulate hematopoiesis and can upregulate TERT expression in
      telomere biology disorders and Fanconi anemia.
  - target: Bone Marrow Failure
    treatment_effect: RESTORES
    description: >-
      Androgen therapy transiently improves peripheral blood counts in
      non-transplant candidates.
  evidence:
  - reference: PMID:41904107
    reference_title: "Bone marrow failure in telomere biology disorders: Current understanding and the emerging landscape of non-transplant therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we review the clinical presentation, pathophysiology, surveillance, and
      non-HCT treatment of BMF in TBD, including supportive care, androgens,
      thrombopoietin receptor agonists, and investigational approaches
    explanation: >-
      Lists androgens as a non-transplant treatment for BMF in TBDs.
- name: Corticosteroid Therapy
  description: >-
    First-line treatment for Diamond-Blackfan anemia. The 2024 international
    consensus recommends lowering the maintenance dose to a maximum of
    0.3 mg/kg per day.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Ribosome Biogenesis Defects
    treatment_effect: MODULATES
    description: >-
      Corticosteroids promote erythroid progenitor survival and erythropoiesis
      in Diamond-Blackfan anemia.
  evidence:
  - reference: PMID:38697731
    reference_title: "Diagnosis, treatment, and surveillance of Diamond-Blackfan anaemia syndrome: international consensus statement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These changes include lowering the prednisone maintenance dose to
      maximum 0·3 mg/kg per day, raising the pre-transfusion haemoglobin to
      9-10 g/dL independent of age, recommending early aggressive chelation,
      broadening indications for haematopoietic stem-cell transplantation
    explanation: >-
      International consensus for DBA recommending lowered corticosteroid
      maintenance dose.
- name: Supportive Care
  description: >-
    Transfusion support with iron chelation therapy for transfusion-dependent
    patients. Growth factor support (G-CSF, EPO) in selected cases.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Bone Marrow Failure
    treatment_effect: BYPASSES
    description: >-
      Red blood cell/platelet transfusions, iron chelation, and myeloid growth
      factors mitigate peripheral cytopenias and infection risk.
  evidence:
  - reference: PMID:20417588
    reference_title: "Pathophysiology and management of inherited bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with severe or symptomatic neutropenia may benefit from
      granulocyte-colony stimulating factor (G-CSF), particularly if they
      experience recurrent or life-threatening neutropenia-related infections.
    explanation: >-
      Supports use of hematopoietic growth factors and transfusion/chelation as
      supportive management in inherited bone marrow failure syndromes.
- name: Cancer Screening
  description: >-
    Regular screening for MDS/AML and solid tumors given elevated cancer risk
    across all subtypes. Bone marrow surveillance can detect premalignant clones
    in SDS and enable timely HSCT before overt malignancy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:36542827
    reference_title: "Predisposition to myeloid malignancies in Shwachman-Diamond syndrome: biological insights and clinical advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Registry data indicate that outcomes are improved for patients with SDS
      who undergo routine bone marrow surveillance and receive an HSCT before
      developing an overt malignancy
    explanation: >-
      Demonstrates clinical benefit of routine bone marrow surveillance in SDS.
  - reference: PMID:38697731
    reference_title: "Diagnosis, treatment, and surveillance of Diamond-Blackfan anaemia syndrome: international consensus statement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recommending systematic clinical surveillance including early colorectal
      cancer screening
    explanation: >-
      DBA consensus recommends systematic surveillance including early
      colorectal cancer screening.

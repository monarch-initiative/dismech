name: Taeniasis/cysticercosis
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
description: >-
  Taeniasis/cysticercosis is caused by Taenia solium, with intestinal
  taeniasis and tissue cysticercosis including neurocysticercosis, a major
  cause of seizures in endemic regions.
disease_term:
  term:
    id: MONDO:0015484
    label: cysticercosis
  preferred_term: Cysticercosis
parents:
- Helminth infection
- Neglected tropical disease
infectious_agent:
- name: Taenia solium
  infectious_agent_term:
    preferred_term: Taenia solium
    term:
      id: NCBITaxon:6204
      label: Taenia solium
  description: Pork tapeworm responsible for taeniasis and cysticercosis.
  evidence:
  - reference: PMID:12932389
    reference_title: "Taenia solium cysticercosis."
    supports: SUPPORT
    snippet: "The larval stage of the pork tapeworm (Taenia solium) infects the human nervous system, causing neurocysticercosis."
    explanation: The abstract identifies Taenia solium as the causative tapeworm.
agent_life_cycle:
  description: Taenia solium cycles between taeniasis and cysticercosis, including porcine and human stages.
  hosts:
  - preferred_term: human (definitive host, taeniasis)
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: definitive host
  - preferred_term: human (accidental intermediate host, cysticercosis)
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: intermediate host
  - preferred_term: domestic pig
    term:
      id: NCBITaxon:9825
      label: Sus scrofa domesticus
    role: intermediate host
  life_cycle_stages:
  - name: Adult parasitic worm stage (taeniasis)
    life_cycle_stage_term:
      preferred_term: adult parasitic worm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: Adult tapeworm stage corresponds to taeniasis in humans.
    evidence:
    - reference: PMID:32461308
      reference_title: "Taenia solium Cysticercosis and Its Impact in Neurological Disease."
      supports: SUPPORT
      snippet: "This paper reviews all aspects of its life cycle (taeniasis, porcine cysticercosis, human cysticercosis)"
      explanation: The life cycle includes taeniasis as the adult worm stage.
pathophysiology:
- name: Larval infection of the nervous system (neurocysticercosis)
  description: Larval Taenia solium infects the human nervous system.
  evidence:
  - reference: PMID:12932389
    reference_title: "Taenia solium cysticercosis."
    supports: SUPPORT
    snippet: "The larval stage of the pork tapeworm (Taenia solium) infects the human nervous system, causing neurocysticercosis."
    explanation: The abstract links larval infection to neurocysticercosis.
  downstream:
  - target: Cyst Degeneration and Perilesional Inflammation
    description: >-
      Parenchymal cysts are initially tolerated, then degenerate under a host inflammatory
      reaction that arises either by natural evolution or after antiparasitic treatment.
    evidence:
    - reference: PMID:38251334
      reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
        Radiological Characteristics of a Large Hospital-Based Patient Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Tapeworm larvae establish in the human brain initially as viable brain
        cysts causing only minimal or no inflammation"
      explanation: Establishes the quiescent viable-cyst stage that precedes the
        inflammatory degeneration node.
  - target: Extraparenchymal Cyst Burden with Impaired CSF Flow
    description: >-
      Cysts lodged in the ventricles and subarachnoid cisterns follow a different course
      from parenchymal cysts, remaining hidden from immune surveillance for years.
    evidence:
    - reference: PMID:38535559
      reference_title: "Current Role of Surgery in the Treatment of
        Neurocysticercosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The evolution of cysts in the CSF compartments (the brain ventricles and
        the subarachnoid space) is different."
      explanation: Separates the extraparenchymal compartment, whose cysts drive the
        hydrocephalus arm, from the parenchymal calcification arm.
- name: Cyst Degeneration and Perilesional Inflammation
  description: >-
    A strong host inflammatory reaction destroys the cyst, producing perilesional
    inflammation and granuloma formation in the brain parenchyma.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:38251334
    reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
      Radiological Characteristics of a Large Hospital-Based Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "either by natural evolution or as a result of antiparasitic treatment, a
      strong host inflammatory reaction leads to cyst degeneration and death"
    explanation: Names the inflammatory reaction and its two triggers, natural evolution
      and antiparasitic treatment.
  downstream:
  - target: Residual Parenchymal Calcification
    description: >-
      Degenerating cysts are walled off in a granuloma that finally calcifies, leaving
      residual calcifications rather than resolving completely.
    evidence:
    - reference: PMID:38251334
      reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
        Radiological Characteristics of a Large Hospital-Based Patient Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subsequently, some cysts disappear, whereas other become residual
        calcifications"
      explanation: Establishes residual calcification as the direct outcome of cyst
        degeneration.
- name: Residual Parenchymal Calcification
  description: >-
    Calcified granulomas persist in the brain parenchyma for life and act as chronic
    epileptogenic foci, with perilesional gliosis, oedema and blood-brain barrier
    disruption reported on human biopsy.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:38251334
    reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
      Radiological Characteristics of a Large Hospital-Based Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "calcifications persist in the host brain throughout life, remain as
      potential seizure foci, and may predispose hosts to a chronic epileptic state"
    explanation: Establishes persistence and epileptogenicity of the calcified lesions.
  downstream:
  - target: Cerebral Calcification
    description: The calcified granulomas are what appears as hyperdense lesions on brain CT.
    evidence:
    - reference: PMID:38251334
      reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
        Radiological Characteristics of a Large Hospital-Based Patient Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On computed tomography (CT), brain calcifications appear as small
        hyperdense lesions, with or without enhancement after the administration of
        contrast material"
      explanation: Links the pathological lesion to the radiological phenotype.
  - target: Seizures
    description: >-
      Calcified lesions act as chronic seizure foci; human biopsy shows perilesional
      gliosis, oedema and blood-brain barrier disruption at these sites.
    evidence:
    - reference: PMID:38251334
      reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
        Radiological Characteristics of a Large Hospital-Based Patient Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathological studies using human biopsies demonstrate perilesional
        gliosis and edema, abnormal vascular permeability, disruption of the
        blood-brain barrier (BBB), and axonal damage"
      explanation: Supplies the tissue-level changes at calcified lesions that underlie
        their epileptogenicity.
  - target: Headache
    description: >-
      Calcified NCC has been associated with headache, proposed to follow remodeling of
      the calcification and release of antigen remnants into the parenchyma.
    evidence:
    - reference: PMID:38251334
      reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
        Radiological Characteristics of a Large Hospital-Based Patient Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The association between the presence of calcified NCC and primary
        headache has also been suggested, likely as a consequence of the remodeling
        process of calcification and the release of antigen remnants in the brain
        parenchyma"
      explanation: >-
        The authors state the proposed mechanism as a suggestion, so this edge records a
        proposed rather than established causal link.
- name: Extraparenchymal Cyst Burden with Impaired CSF Flow
  description: >-
    In the ventricles and subarachnoid cisterns, two mechanisms impair CSF flow:
    inflammation once the immune system recognizes cyst antigens (arachnoiditis, basal
    fibrosis, ependymitis), and direct mechanical obstruction by the cysts themselves,
    which can cause hydrocephalus even without inflammation.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:38535559
    reference_title: "Current Role of Surgery in the Treatment of
      Neurocysticercosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inflammation and mechanical obstruction are the two mechanisms underlying
      hydrocephalus in NCC. Inflammation within the basal subarachnoid space impairs the
      normal CSF flow, resulting in the accumulation of CSF in the ventricles"
    explanation: States both mechanisms and spells out the inflammatory one.
  - reference: PMID:38535559
    reference_title: "Current Role of Surgery in the Treatment of
      Neurocysticercosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the cysts themselves may obstruct the CSF flow in the narrow spaces of the
      ventricles and manifest in hydrocephalus even in the absence of inflammation"
    explanation: Establishes mechanical obstruction as sufficient on its own, which is
      why this node carries both mechanisms rather than only the inflammatory one.
  downstream:
  - target: Hydrocephalus
    description: Impaired CSF flow accumulates CSF in the ventricles.
    evidence:
    - reference: PMID:38535559
      reference_title: "Current Role of Surgery in the Treatment of
        Neurocysticercosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "disturb the CSF flow (either by fibrosis in the subarachnoid cisterns or
        ependymitis within the ventricles), leading to hydrocephalus"
      explanation: Names the CSF-flow disturbance as the immediate cause of hydrocephalus.
phenotypes:
- name: Seizures
  category: Neurologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:41403530
    reference_title: "Clinical spectrum of neurocysticercosis: A hospital-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were reported in 97.7% of cases"
    explanation: Seizures are the predominant manifestation of symptomatic
      neurocysticercosis, reported in 97.7% of a hospital-based NCC cohort. The
      band is set to FREQUENT (rather than VERY_FREQUENT) as a conservative
      whole-disease estimate, since this entry spans taeniasis and cysticercosis
      and the 97.7% figure derives from a selected symptomatic-NCC population.
  - reference: PMID:12932389
    reference_title: "Taenia solium cysticercosis."
    supports: SUPPORT
    snippet: "This disease is one of the main causes of epileptic seizures in many less developed countries"
    explanation: Neurocysticercosis is a major cause of seizures in endemic regions.
- name: Cerebral Calcification
  category: Neurologic
  phenotype_term:
    preferred_term: Cerebral calcification
    term:
      id: HP:0002514
      label: Cerebral calcification
  evidence:
  - reference: PMID:38251334
    reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
      Radiological Characteristics of a Large Hospital-Based Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Calcified lesions are the most frequent finding on brain CT in NCC
      cases from endemic areas (between 10% and 20%), although many infected
      individuals are presumed to be asymptomatic"
    explanation: >-
      Establishes calcified lesions as the most frequent brain CT finding in NCC.
      `frequency` is deliberately left unset: the bracketed 10-20% is attributed to a
      population-based CT study of an endemic population, not to the fraction of NCC
      patients, and this cohort was selected for calcified NCC so it cannot supply that
      fraction either.
  - reference: PMID:38251334
    reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
      Radiological Characteristics of a Large Hospital-Based Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had a median number of three calcifications (IQR: 1-7),
      mostly located in the frontal lobes (79%)"
    explanation: Describes the radiological distribution of calcified NCC
      lesions in a 524-patient hospital cohort, supporting the cerebral (rather
      than extracerebral) localization of the calcification phenotype.
- name: Hydrocephalus
  category: Neurologic
  phenotype_term:
    preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  evidence:
  - reference: PMID:38535559
    reference_title: "Current Role of Surgery in the Treatment of
      Neurocysticercosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extraparenchymal NCC is commonly accompanied by raised
      intracranial hypertension due to hydrocephalus, which is an emergency
      requiring cyst extirpation by surgical intervention to relieve the
      symptoms"
    explanation: Establishes hydrocephalus as a common complication of
      extraparenchymal neurocysticercosis, distinct from the parenchymal
      disease captured by the Seizures and Cerebral Calcification phenotypes.
      No numeric frequency is quantified in this narrative review, so
      `frequency` is left unset rather than assigning an unsupported band.
  - reference: PMID:38535559
    reference_title: "Current Role of Surgery in the Treatment of
      Neurocysticercosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inflammation and mechanical obstruction are the two mechanisms
      underlying hydrocephalus in NCC"
    explanation: States the two proposed mechanisms (CSF-flow-impairing
      inflammation and direct cyst obstruction of the ventricles) underlying
      the hydrocephalus phenotype in neurocysticercosis. The mechanism itself is
      modeled in `pathophysiology#Extraparenchymal Cyst Burden with Impaired CSF Flow`.
- name: Headache
  category: Neurologic
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:38251334
    reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
      Radiological Characteristics of a Large Hospital-Based Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When classified by the type of first symptom, most patients reported
      headache (273, 52.1%), followed by seizures"
    explanation: >-
      Headache was the presenting symptom in 52.1% of this 524-patient cohort.
      `frequency` is left unset for the same reason as Cerebral Calcification: the
      cohort is hospital-based and selected for calcified NCC, so its symptom shares
      describe that subpopulation rather than taeniasis/cysticercosis as a whole.
  - reference: PMID:38251334
    reference_title: "Calcified Neurocysticercosis: Demographic, Clinical, and
      Radiological Characteristics of a Large Hospital-Based Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 345 patients who reported headache as the first symptom, 126
      received medical care, 60 received emergency care, and 18 were hospitalized."
    explanation: Records the care burden of the headache phenotype, establishing it as
      clinically consequential rather than incidental.
treatments:
- name: Antiparasitic therapy
  description: Antiparasitic drugs are used to kill brain parasites in neurocysticercosis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antimicrobial agent therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
    - preferred_term: praziquantel
      term:
        id: CHEBI:45267
        label: praziquantel
  evidence:
  - reference: PMID:12932389
    reference_title: "Taenia solium cysticercosis."
    supports: SUPPORT
    snippet: "Available therapeutic measures include steroids, treatments for symptoms, surgery, and, more controversially, antiparasitic drugs to kill brain parasites."
    explanation: The abstract lists antiparasitic drugs among available treatments.
  - reference: PMID:39149676
    reference_title: "Effectiveness of the Antiparasitic Combination of
      Albendazole and Praziquantel As Compared With Albendazole Monotherapy in
      the Treatment of Neurocysticercosis in Children: A Systematic Review and
      Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study demonstrates that the albendazole and praziquantel
      combination therapy is superior in lesion resolution in pediatric
      neurocysticercosis"
    explanation: Names albendazole and praziquantel as the specific antiparasitic
      agents used in neurocysticercosis, with a pediatric systematic review and
      meta-analysis finding the combination superior to albendazole monotherapy.
  target_mechanisms:
  - target: Extraparenchymal Cyst Burden with Impaired CSF Flow
    description: >-
      Albendazole and praziquantel kill the cysts, but both are markedly less active in
      the extraparenchymal compartment than in parenchymal disease.
    evidence:
    - reference: PMID:38535559
      reference_title: "Current Role of Surgery in the Treatment of
        Neurocysticercosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For medical treatment, two anthelmintics have proved effective since the
        1980s: albendazole and praziquantel. Their efficacy is similar, both being
        significantly more active in parenchymal disease than in extraparenchymal
        disease."
      explanation: Establishes both agents as acting on the cyst burden while recording
        the reduced activity against the extraparenchymal cysts this node represents.
  - target: Cyst Degeneration and Perilesional Inflammation
    description: >-
      Antiparasitic treatment is itself one of the two triggers of the inflammatory
      cyst-degeneration node, which is why corticosteroids are co-administered.
    evidence:
    - reference: PMID:38535559
      reference_title: "Current Role of Surgery in the Treatment of
        Neurocysticercosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The anthelminthic treatment may trigger the secretion of various
        antigens from the cysts, eliciting inflammatory responses that determine the
        symptoms and can be fatal"
      explanation: >-
        Records the edge as treatment-induced aggravation of this node rather than
        suppression of it, which is the reason the same source requires combining
        anthelminthics with corticosteroids.
- name: Niclosamide (Taeniasis Treatment)
  description: Intestinal anthelminthic used to treat adult tapeworm carriage
    (taeniasis) and interrupt Taenia solium transmission to new intermediate
    hosts, distinct from the antiparasitic agents used against tissue
    cysticercosis/neurocysticercosis above.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: niclosamide
      term:
        id: CHEBI:7553
        label: niclosamide
  evidence:
  - reference: PMID:39280880
    reference_title: "Mass chemotherapy with niclosamide for the control of
      Taenia solium: population-based safety profile and treatment
      effectiveness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 211 participants diagnosed with taeniasis, 188 provided a follow-up
      stool sample 30-days after treatment and 141 were cured (treatment effectiveness
      75.0%)"
    explanation: This study's own FINDINGS for single-dose niclosamide effectiveness
      against taeniasis, measured by post-treatment stool sampling.
  - reference: PMID:39280880
    reference_title: "Mass chemotherapy with niclosamide for the control of
      Taenia solium: population-based safety profile and treatment
      effectiveness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MDA with NSM is safe in Taenia solium endemic settings. However, the
      effectiveness following one dose is lower than expected, which suggests additional
      treatment may be necessary to enhance the infection control efforts."
    explanation: >-
      The authors' own INTERPRETATION. Recorded alongside the effectiveness figure
      because it qualifies it: niclosamide's safety in this setting is established,
      but a single dose underperforms prior selective-chemotherapy estimates.
  - reference: PMID:39280880
    reference_title: "Mass chemotherapy with niclosamide for the control of
      Taenia solium: population-based safety profile and treatment
      effectiveness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "988 (1.5%) reported experiencing at least one AE. Almost all AEs (99.2%)
      were of mild intensity, with no severe AEs recorded."
    explanation: Quantifies the safety profile across 65,551 treated residents,
      supporting niclosamide's suitability where undiagnosed NCC may be present.
- name: Surgical management
  description: Surgical interventions may be used in selected cases.
  treatment_term:
    preferred_term: Surgical Management
    term:
      id: NCIT:C16080
      label: Surgical Management
  evidence:
  - reference: PMID:12932389
    reference_title: "Taenia solium cysticercosis."
    supports: SUPPORT
    snippet: "Available therapeutic measures include steroids, treatments for symptoms, surgery, and, more controversially, antiparasitic drugs to kill brain parasites."
    explanation: The abstract includes surgery as a treatment option.

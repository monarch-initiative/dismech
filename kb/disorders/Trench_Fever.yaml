name: Trench Fever
creation_date: '2026-09-25T00:00:00Z'
category: Infectious Disease
description: >-
  Trench fever is a louse-borne Bartonella quintana infection transmitted when
  feces from infected human body lice contaminate broken skin. B. quintana
  colonizes erythrocytes to produce persistent bacteremia and a spectrum that
  includes endocarditis, chronic lymphadenopathy, and, especially in
  immunocompromised hosts, vasoproliferative bacillary angiomatosis.
disease_term:
  preferred_term: trench fever
  term:
    id: MONDO:0005991
    label: trench fever
parents:
- Bacterial Infection
- Vector-borne disease
synonyms:
- Five-day fever
- Quintan fever
- Shin bone fever
- His-Werner disease
- Wolhynia fever
- Urban trench fever
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
infectious_agent:
- name: Bartonella quintana
  description: >-
    Human-restricted, louse-vectored Gram-negative Bartonella species that causes
    trench fever, chronic bacteremia, endocarditis, and bacillary angiomatosis.
  infectious_agent_term:
    preferred_term: Bartonella quintana
    term:
      id: NCBITaxon:803
      label: Bartonella quintana
  evidence:
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bartonella quintana, a pathogen that is restricted to human hosts and louse
      vectors, was first characterized as the agent of trench fever.
    explanation: >-
      This review identifies B. quintana as the human- and louse-associated
      bacterial agent of trench fever.
transmission:
- name: Body louse fecal transmission
  description: >-
    The human body louse acquires B. quintana during blood feeding on a
    bacteremic person and passes infectious feces that can be scratched into
    broken skin of a new human host.
  evidence:
  - reference: PMID:35803580
    reference_title: >-
      Examination of vertical transmission of Bartonella quintana in body lice
      following multiple infectious blood meals.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Horizontal transmission from the body louse vector (Pediculus humanus
      humanus) to a human host occurs through contact with infectious louse feces
      containing a high concentration of the bacteria.
    explanation: >-
      Body-louse infection experiments describe feces-mediated horizontal
      transmission as the route to humans.
environmental:
- name: Body louse infestation and homelessness
  description: >-
    Human body louse infestation - associated with homelessness, poverty, and
    poor hygiene - is the environmental context that supplies
    the louse vector for B. quintana, and urban trench fever is a reemerging
    disease of homeless populations.
  influences_mechanisms:
  - target: Body-Louse Fecal Bartonella Inoculation
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Louse infestation in homeless, impoverished settings supplies the body-louse
      vector whose infectious feces inoculate B. quintana.
    evidence:
    - reference: PMID:16494745
      reference_title: Bartonella quintana characteristics and clinical management.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        It is now recognized as a reemerging pathogen among homeless populations
        in cities in the United States and Europe
      explanation: B. quintana is a reemerging pathogen of homeless populations, the louse-infested context.
  evidence:
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is now recognized as a reemerging pathogen among homeless populations
      in cities in the United States and Europe
    explanation: Establishes homelessness/louse infestation as the reemergence context for trench fever.
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      which lives in clothes (Figure 2) and is associated with poverty, lack of
      hygiene, and cold weather
    explanation: The body louse vector is associated with poverty, poor hygiene, and cold weather.
progression:
- phase: Body-louse exposure and fecal inoculation
  notes: >-
    Infectious louse feces contaminate abrasions or scratch excoriations after
    body-louse feeding, initiating human B. quintana infection.
  evidence:
  - reference: PMID:35803580
    reference_title: >-
      Examination of vertical transmission of Bartonella quintana in body lice
      following multiple infectious blood meals.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Horizontal transmission from the body louse vector (Pediculus humanus
      humanus) to a human host occurs through contact with infectious louse feces
      containing a high concentration of the bacteria.
    explanation: >-
      Supports infectious-feces exposure as the host-entry phase.
- phase: Persistent bacteremia and systemic complications
  notes: >-
    After host entry, B. quintana can establish intraerythrocytic bacteremia and
    cause chronic bacteremia, culture-negative endocarditis, and
    vasoproliferative bacillary angiomatosis.
  evidence:
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is now recognized as a reemerging pathogen among homeless populations in
      cities in the United States and Europe and is responsible for a wide
      spectrum of conditions, including chronic bacteremia, endocarditis, and
      bacillary angiomatosis.
    explanation: >-
      The review summarizes the principal chronic and vasoproliferative clinical
      complications of B. quintana infection.
pathophysiology:
- name: Body-Louse Fecal Bartonella Inoculation
  description: >-
    Infectious B. quintana shed in human-body-louse feces reaches a new host
    through contaminated bite scratches or other skin abrasions.
  role: trigger
  biological_processes:
  - preferred_term: symbiont entry into host
    modifier: INCREASED
    term:
      id: GO:0044409
      label: symbiont entry into host
  evidence:
  - reference: PMID:35803580
    reference_title: >-
      Examination of vertical transmission of Bartonella quintana in body lice
      following multiple infectious blood meals.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Horizontal transmission from the body louse vector (Pediculus humanus
      humanus) to a human host occurs through contact with infectious louse feces
      containing a high concentration of the bacteria.
    explanation: >-
      Supports fecal inoculation from the body louse as the initiating exposure.
  downstream:
  - target: Trw-Associated Erythrocyte Colonization
    description: >-
      Host entry gives B. quintana access to the bloodstream, where Bartonella
      Trw type IV secretion machinery supports erythrocyte tropism.
- name: Trw-Associated Erythrocyte Colonization
  description: >-
    The Bartonella Trw type IV secretion system contributes to host-specific
    adhesion to erythrocytes, supporting the long-lasting intraerythrocytic
    bacteremia that characterizes B. quintana infection.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: symbiont entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:20548954
    reference_title: >-
      The Trw type IV secretion system of Bartonella mediates host-specific
      adhesion to erythrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The corresponding genes encode components of the type IV secretion system
      (T4SS) Trw, demonstrating that this virulence factor laterally acquired by
      the Bartonella lineage is directly involved in adherence to erythrocytes.
    explanation: >-
      Bartonella mutagenesis and erythrocyte-assay data identify Trw as the
      lineage virulence factor that mediates erythrocyte adhesion, the red-cell
      colonization step curated here for B. quintana.
  downstream:
  - target: Acute Febrile Bacteremic Illness
    description: >-
      Intraerythrocytic bacteremia produces the acute, often relapsing febrile
      illness that is the cardinal trench-fever syndrome.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Chronic Bacteremia and Endocarditis
    description: >-
      Persistent B. quintana bacteremia can remain chronic and seed
      blood-culture-negative bacterial endocarditis.
- name: Acute Febrile Bacteremic Illness
  description: >-
    The classic trench-fever syndrome is an acute bacteremic illness with sudden
    headache, pain in the shins, and high fever; a relapsing form with a shorter
    initial period and frequent relapses (the "five-day"/quintan periodicity)
    was also described.
  role: consequence
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The first was characterized by a sudden onset of headache, dizziness, pain
      in the shins, and elevated temperature
    explanation: Describes the classic acute trench-fever syndrome of headache, shin pain, and fever.
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The second manifestation of the disease was characterized by a shorter
      initial period and frequent relapses.
    explanation: Describes the relapsing (five-day/quintan) form of trench fever.
  downstream:
  - target: Fever
    description: The acute bacteremic illness produces high fever.
  - target: Headache
    description: The acute syndrome produces headache.
  - target: Bone pain
    description: The acute syndrome produces characteristic shin (tibial) bone pain.
- name: Chronic Bacteremia and Endocarditis
  description: >-
    Long-lasting B. quintana bacteremia is the systemic reservoir that produces
    chronic bacteremia and can seed Bartonella blood-culture-negative
    endocarditis.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: INCREASED
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is now recognized as a reemerging pathogen among homeless populations in
      cities in the United States and Europe and is responsible for a wide
      spectrum of conditions, including chronic bacteremia, endocarditis, and
      bacillary angiomatosis.
    explanation: >-
      The review supports chronic bacteremia and endocarditis as core systemic
      B. quintana manifestations.
  downstream:
  - target: Chronic Bacteremia
    description: Persistent blood infection is the defining manifestation of this branch.
  - target: Bacterial Endocarditis
    description: Chronic bacteremia can seed bacterial endocarditis.
  - target: Chronic Lymphadenopathy
    description: Chronic B. quintana infection can produce chronic lymphadenopathy.
  - target: Vomp-Mediated Endothelial Adherence
    description: >-
      Circulating B. quintana adheres to vascular endothelium, the step that
      precedes the vasoproliferative branch.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Vomp-Mediated Endothelial Adherence
  description: >-
    Variably expressed outer membrane proteins (Vomps), the trimeric
    autotransporter adhesins of B. quintana, mediate adherence to extracellular
    matrix and endothelial cells, the adhesion step upstream of the
    pro-angiogenic endothelial response.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:21536788
    reference_title: "Trimeric autotransporter adhesin-dependent adherence of Bartonella henselae, Bartonella quintana, and Yersinia enterocolitica to matrix components and endothelial cells under static and dynamic flow conditions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Under static conditions, ECM adherence of B. henselae, B. quintana, and Y.
      enterocolitica was strongly dependent on the expression of their particular
      TAAs.
    explanation: >-
      B. quintana ECM adherence was strongly dependent on its trimeric
      autotransporter adhesins (Vomps), the adhesion step this node captures.
  - reference: PMID:21536788
    reference_title: "Trimeric autotransporter adhesin-dependent adherence of Bartonella henselae, Bartonella quintana, and Yersinia enterocolitica to matrix components and endothelial cells under static and dynamic flow conditions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Trimeric autotransporter adhesins (TAAs) are important virulence factors of
      Gram-negative bacteria responsible for adherence to extracellular matrix
      (ECM) and host cells.
    explanation: >-
      Background on the trimeric-autotransporter-adhesin class to which the B.
      quintana Vomps belong.
  downstream:
  - target: BafA-Driven Endothelial VEGF Signaling
    description: >-
      Endothelial adherence positions B. quintana to drive the BafA/VEGF
      pro-angiogenic response.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: BafA-Driven Endothelial VEGF Signaling
  description: >-
    Bartonella BafA acts as a VEGF receptor 2 ligand; the B. quintana BafA
    homolog is functional, supporting a homologous pro-angiogenic route into
    endothelial proliferation in B. quintana-associated bacillary angiomatosis.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: positive regulation of angiogenesis
    modifier: INCREASED
    term:
      id: GO:0045766
      label: positive regulation of angiogenesis
  evidence:
  - reference: PMID:32678094
    reference_title: >-
      The Bartonella autotransporter BafA activates the host VEGF pathway to
      drive angiogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      BafA interacts with vascular endothelial growth factor (VEGF) receptor-2
      and activates the downstream signaling pathway, suggesting that BafA
      functions as a VEGF analog.
    explanation: >-
      Identifies the Bartonella autotransporter mechanism that activates VEGFR2
      signaling and drives endothelial angiogenic responses.
  - reference: PMID:32678094
    reference_title: >-
      The Bartonella autotransporter BafA activates the host VEGF pathway to
      drive angiogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A BafA homolog from a related pathogen, Bartonella quintana, is also
      functional.
    explanation: >-
      Extends the BafA functional observation to the B. quintana homolog.
  downstream:
  - target: Bacillary Angiomatosis
    description: >-
      Pro-angiogenic endothelial signaling is a molecular route into
      vasoproliferative bacillary angiomatosis.
    evidence:
    - reference: PMID:9407154
      reference_title: >-
        Molecular epidemiology of bartonella infections in patients with
        bacillary angiomatosis-peliosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of the 49 patients with bacillary angiomatosis-peliosis, 26 (53 percent)
        were infected with B. henselae and 23 (47 percent) with B. quintana.
      explanation: >-
        Human molecular epidemiology connects B. quintana infection with
        bacillary angiomatosis-peliosis lesions.
- name: Bartonella Intracellular Persistence
  description: >-
    B. quintana is an intracellular Bartonella pathogen; residence inside host
    cells constrains treatment toward cell-penetrant antimicrobials such as
    doxycycline.
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  biological_processes:
  - preferred_term: Biological Process Involved in Interaction with Host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:18611821
    reference_title: Intracellular organisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such
      as the beta-lactam compounds.
    explanation: >-
      Review evidence for the intracellular-niche principle behind
      cell-penetrant antimicrobial selection.
- name: Bartonella Ribosomal Translation
  description: >-
    B. quintana depends on bacterial 70S ribosomal translation; doxycycline and
    gentamicin both act on the bacterial 30S ribosomal subunit.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review establishing the bacterial ribosome as the target of
      protein-synthesis inhibitors, the drug-target node represented here.
phenotypes:
- name: Fever
  description: >-
    High fever is the cardinal feature of the acute trench-fever syndrome,
    classically with a relapsing five-day (quintan) periodicity.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The first was characterized by a sudden onset of headache, dizziness, pain
      in the shins, and elevated temperature
    explanation: Elevated temperature (fever) is a cardinal acute trench-fever feature.
- name: Headache
  description: Sudden-onset headache is part of the acute trench-fever syndrome.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The first was characterized by a sudden onset of headache, dizziness, pain
      in the shins, and elevated temperature
    explanation: Sudden headache is part of the acute trench-fever syndrome.
- name: Bone pain
  description: >-
    Pain in the shins (tibial bone pain) is the classic musculoskeletal feature
    that gives trench fever the name "shin bone fever".
  phenotype_term:
    preferred_term: Shin (tibial) bone pain
    term:
      id: HP:0002653
      label: Bone pain
  evidence:
  - reference: PMID:16494745
    reference_title: Bartonella quintana characteristics and clinical management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The first was characterized by a sudden onset of headache, dizziness, pain
      in the shins, and elevated temperature
    explanation: Pain in the shins is the characteristic tibial bone pain of trench fever.
- name: Chronic Bacteremia
  description: B. quintana can cause persistent blood infection.
  phenotype_term:
    preferred_term: Bacteremia
    term:
      id: HP:0031864
      label: Bacteremia
  evidence:
  - reference: PMID:12821469
    reference_title: >-
      Randomized open trial of gentamicin and doxycycline for eradication of
      Bartonella quintana from blood in patients with chronic bacteremia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic Bartonella quintana bacteremia is known to occur in homeless
      people exposed to lice.
    explanation: >-
      Human trial report establishes chronic B. quintana bacteremia as a
      clinical manifestation after louse exposure.
- name: Bacterial Endocarditis
  description: >-
    B. quintana is an important cause of blood-culture-negative bacterial
    endocarditis.
  phenotype_term:
    preferred_term: Bacterial endocarditis
    term:
      id: HP:0006689
      label: Bacterial endocarditis
  evidence:
  - reference: PMID:15891120
    reference_title: High prevalence of Bartonella quintana endocarditis in Sfax, Tunisia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bartonella quintana is a fastidious microorganism associated with blood
      culture negative endocarditis.
    explanation: >-
      Human endocarditis serology/PCR study identifies B. quintana as a
      blood-culture-negative endocarditis organism.
- name: Chronic Lymphadenopathy
  description: >-
    Chronic adenomegaly or lymphadenopathy can occur with B. quintana infection,
    including in seronegative disease.
  phenotype_term:
    preferred_term: Lymphadenopathy
    temporality: CHRONIC
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:8727894
    reference_title: Bartonella (Rochalimaea) quintana infection in a seronegative hemodialyzed patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic adenomegaly in seronegative patients is a new clinical entity due
      to B. quintana.
    explanation: >-
      Human case evidence supports chronic adenomegaly as a lymphadenopathy
      presentation of B. quintana infection.
- name: Bacillary Angiomatosis
  description: >-
    B. quintana is one molecularly typed cause of bacillary
    angiomatosis-peliosis in immunocompromised patients. No HP term for
    bacillary angiomatosis exists (OLS HP search "l~angiomatosis" returns only
    cystic angiomatosis of bone and visceral angiomatosis, neither of which
    fits), so no phenotype_term is bound.
  evidence:
  - reference: PMID:9407154
    reference_title: >-
      Molecular epidemiology of bartonella infections in patients with bacillary
      angiomatosis-peliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 49 patients with bacillary angiomatosis-peliosis, 26 (53 percent)
      were infected with B. henselae and 23 (47 percent) with B. quintana.
    explanation: >-
      Human molecular epidemiology identifies B. quintana in nearly half of a
      bacillary angiomatosis-peliosis cohort.
diagnosis:
- name: Serology and PCR for blood-culture-negative endocarditis
  description: >-
    Because B. quintana is fastidious and blood-culture-negative, diagnosis
    relies on serology and molecular detection (nested PCR of target genes)
    rather than routine culture.
  diagnosis_term:
    preferred_term: serology and nested PCR for Bartonella
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:15891120
    reference_title: High prevalence of Bartonella quintana endocarditis in Sfax, Tunisia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These sera were also positive by LightCycler nested PCR amplification for
      the rnpb (7 of 13) and fur (11 of 13) genes.
    explanation: Nested PCR of the rnpB and fur genes on sera confirmed B. quintana in culture-negative endocarditis.
prevalence:
- population: Homeless people, Marseilles
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 5300.0
  notes: >-
    B. quintana bacteremia was detected in 5.3% of 930 homeless people in
    Marseilles; the disease is concentrated in, not rare within, this cohort.
  evidence:
  - reference: PMID:15643300
    reference_title: "Ectoparasitism and vector-borne diseases in 930 homeless people from Marseilles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bartonella quintana was isolated from blood culture in 50 patients (5.3%),
      36 of whom were treated effectively
    explanation: B. quintana bacteremia was found in 5.3% of a 930-person homeless cohort.
treatments:
- name: Doxycycline Plus Gentamicin
  description: >-
    Combination therapy with doxycycline and gentamicin eradicates chronic
    B. quintana bacteremia in randomized-trial data.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bartonella Intracellular Persistence
    description: >-
      Doxycycline has intracellular activity suited to Bartonella organisms in
      host-cell niches.
  - target: Bartonella Ribosomal Translation
    description: >-
      Doxycycline and gentamicin inhibit bacterial ribosomal protein synthesis.
  evidence:
  - reference: PMID:12821469
    reference_title: >-
      Randomized open trial of gentamicin and doxycycline for eradication of
      Bartonella quintana from blood in patients with chronic bacteremia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study demonstrates the efficiency of the combination of doxycycline
      and gentamicin in eradicating B. quintana bacteremia.
    explanation: >-
      Randomized trial evidence supports doxycycline plus gentamicin for chronic
      B. quintana bacteremia.
  - reference: PMID:23602630
    reference_title: "Treatment outcomes of human bartonellosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In chronic bacteremia, gentamicin and doxycycline significantly increased
      the resolution rate.
    explanation: >-
      Systematic-review evidence independently supports this combination for
      chronic Bartonella bacteremia.

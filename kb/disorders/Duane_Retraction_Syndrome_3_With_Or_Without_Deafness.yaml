      MAFB is indispensable for podocyte differentiation, foot process
      formation, and maintenance of the glomerular filtration barrier,
      underscoring its critical role in renal development and function
    explanation: >-
      Summarizes the requirement for MAFB in building and maintaining the
      glomerular filtration barrier.
phenotypes:
- category: Eye
  name: Duane Anomaly
  description: >-
    The defining feature: congenital, non-progressive limitation of horizontal
    eye movement with retraction of the globe and narrowing of the palpebral
    fissure on attempted adduction. Involvement may be unilateral or bilateral.
  phenotype_term:
    preferred_term: Duane anomaly
    term:
      id: HP:0009921
      label: Duane anomaly
  diagnostic: true
  evidence:
  - reference: PMID:27181683
    reference_title: "Loss of MAFB Function in Humans and Mice Causes Duane Syndrome, Aberrant Extraocular Muscle Innervation, and Inner-Ear Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duane retraction syndrome (DRS) is a congenital eye-movement disorder
      defined by limited outward gaze and retraction of the eye on attempted
      inward gaze.
    explanation: >-
      Defines the ocular phenotype in the report that established MAFB as a
      cause of it.
  - reference: PMID:29779709
    reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four affected individuals developed FSGS and Duane Retraction
      Syndrome in their first to second decade of life, manifested as restricted
      abduction together with globe retraction and narrowed palpebral fissure on
      attempted adduction.
    explanation: >-
      Documents the full Duane sign complex in MAFB p.Leu239Pro carriers from
      two unrelated families.
- category: Eye
  name: Abducens Nerve Hypoplasia or Aplasia
  description: >-
    Structural hypoplasia or absence of the sixth cranial nerve, the anatomical
    lesion underlying the motility pattern. It is demonstrable on dedicated
    high-resolution MRI of the cranial nerves and was documented in the more
    severely affected MAFB variant carriers.
  phenotype_term:
    preferred_term: Abducens nerve hypoplasia
    term:
      id: HP:0011348
      label: Abnormal sixth cranial nerve morphology
  evidence:
  - reference: PMID:29779709
    reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypoplasia of the abducens nerves and hearing impairment occurred in
      severely affected individuals.
    explanation: >-
      Reports abducens nerve hypoplasia directly in MAFB variant carriers.
- category: Eye
  name: Incomitant Strabismus in Primary Gaze
  description: >-
    Misalignment of the eyes in the straight-ahead position, most often
    esotropia. It is incomitant, meaning the angle changes with direction of
    gaze, which distinguishes it from common comitant childhood strabismus.
    Individuals who retain fusion typically adopt a compensatory head turn.
  phenotype_term:
    preferred_term: Incomitant strabismus
    term:
      id: HP:0025068
      label: Incomitant strabismus
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many individuals with Duane syndrome have strabismus in primary gaze but
      can use a compensatory head turn to align the eyes, and thus can preserve
      binocular vision and avoid diplopia.
    explanation: >-
      GeneReviews documents primary-gaze strabismus and the compensatory head
      turn in Duane syndrome, the clinical context in which the MAFB form
      presents.
- category: Ear
  name: Sensorineural Hearing Impairment
  description: >-
    Hearing loss is the feature named by the "with or without deafness" clause.
    It tracks the depth of the MAFB shortfall rather than the ocular severity:
    it was reported with the dominant-negative allele and in the more severely
    affected members of bZIP-variant families, and can be profound and
    pre-lingual. It is not present in every carrier.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:27181683
    reference_title: "Loss of MAFB Function in Humans and Mice Causes Duane Syndrome, Aberrant Extraocular Muscle Innervation, and Inner-Ear Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on three heterozygous loss-of-function MAFB mutations
      causing DRS and a dominant-negative MAFB mutation causing DRS and deafness.
    explanation: >-
      Establishes deafness as part of the MAFB phenotype, and specifically with
      the dominant-negative allele rather than with every allele.
  - reference: PMID:29779709
    reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypoplasia of the abducens nerves and hearing impairment occurred in
      severely affected individuals.
    explanation: >-
      Confirms hearing impairment in MAFB variant carriers and ties it to the
      severe end of the spectrum.
- category: Ear
  name: Cochlear Malformation
  description: >-
    Gross structural maldevelopment of the cochlea, the anatomical correlate of
    the hearing loss. Cochlear aplasia with a bilateral common cavity was
    demonstrated on MRI in one MAFB bZIP-variant carrier, who went on to receive
    bilateral cochlear implants.
  phenotype_term:
    preferred_term: Cochlear aplasia with common cavity
    term:
      id: HP:0008554
      label: Cochlear malformation
  evidence:
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging (MRI) at one year revealed cochlear
      aplasia with a bilateral common cavity configuration, without additional
      intracranial abnormalities.
    explanation: >-
      Directly documents the cochlear malformation in a carrier of the MAFB
      p.Leu266Pro bZIP-domain variant.
- category: Head and Neck
  name: Congenital Auricular Anomaly
  description: >-
    Malformation of the external ear, reported together with the cochlear and
    renal findings in a carrier of a MAFB bZIP-domain variant, and prominent
    enough that the report naming it put "auricular" in its title. Small ears
    were also noted on that individual's dysmorphology examination. It sits with
    the otic arm of the disease rather than with the ocular one.
  phenotype_term:
    preferred_term: Congenital auricular anomaly
    term:
      id: HP:0000356
      label: Abnormality of the outer ear
  evidence:
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband exhibited CKD accompanied by congenital auricular anomalies,
      hearing loss, and neurodevelopmental delay.
    explanation: >-
      Documents congenital auricular anomalies in a MAFB bZIP-variant carrier.
- category: Eye
  name: Compensatory Head Posture
  description: >-
    A turn of the head that brings the eyes into the field where they are
    aligned. It is an adaptation rather than a lesion, and it is why some
    affected people preserve binocular vision and never develop diplopia. It is
    also a surgical indication in its own right, and abandoning it in later life
    is what makes a previously compensated strabismus become manifest.
  phenotype_term:
    preferred_term: Compensatory head turn
    term:
      id: HP:0031705
      label: Compensatory head posture
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many individuals with Duane syndrome have strabismus in primary gaze but
      can use a compensatory head turn to align the eyes, and thus can preserve
      binocular vision and avoid diplopia.
    explanation: >-
      GeneReviews documents the compensatory head turn and what it achieves.
- category: Eye
  name: Amblyopia
  description: >-
    Failure of visual development in the affected eye. It is the one
    consequence of this disease that is preventable, which is why the
    surveillance schedule is built around detecting it, and the risk falls
    specifically on those who cannot achieve binocular alignment by turning
    their head.
  phenotype_term:
    preferred_term: Amblyopia
    term:
      id: HP:0000646
      label: Amblyopia
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with Duane syndrome who lack binocular vision are at risk for
      amblyopia.
    explanation: >-
      GeneReviews states the amblyopia risk and the subgroup it falls on.
- category: Eye
  name: Upshoot or Downshoot on Adduction
  description: >-
    A sudden vertical deviation of the eye as it is adducted, caused by the
    co-contracting lateral rectus slipping over or under the globe. It is a
    consequence of the same aberrant co-innervation that produces the
    retraction, and it is one of the specific things extraocular muscle surgery
    is done to address.
  notes: >-
    No ontology term is bound. HPO has no term for upshoot or downshoot on
    adduction, and the available alternatives searched (HP:0000496 Abnormality
    of eye movement, HP:0025586 Hypertropia) are respectively too broad to carry
    the meaning and describe a different sign. The finding is left as free text
    rather than annotated with a term that would be wrong in the export.
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      extraocular muscle surgery to address alignment in primary gaze,
      compensatory head posture, and upshoot or downshoot.
    explanation: >-
      GeneReviews names upshoot and downshoot as findings requiring surgical
      management in Duane syndrome.
- category: Genitourinary
  name: Focal Segmental Glomerulosclerosis
  description: >-
    Segmental scarring of the glomerular tuft on biopsy, the histological
    expression of the podocyte arm. All four affected individuals in the two
    families that defined the MAFB p.Leu239Pro phenotype had FSGS as well as
    the Duane anomaly. This feature is not named in the MONDO or OMIM label for
    this entity and is not present in every carrier.
  phenotype_term:
    preferred_term: Focal segmental glomerulosclerosis
    term:
      id: HP:0000097
      label: Focal segmental glomerulosclerosis
  evidence:
  - reference: PMID:29779709
    reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To help define these roles, we studied two unrelated families with FSGS
      associated with Duane Retraction Syndrome, characterized by impaired
      horizontal eye movement due to cranial nerve malformation.
    explanation: >-
      Establishes the co-occurrence of FSGS with the Duane anomaly in the
      MAFB families that define this arm.
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in MAF BZIP Transcription Factor B (MAFB) (OMIM
      608968) are primarily associated with two Mendelian phenotypes:
      multicentric carpotarsal osteolysis syndrome (MCTO; OMIM #166300),
      characterized by progressive skeletal osteolysis with possible renal
      involvement, and Duane retraction syndrome 3 (DRS3; OMIM #617041), a
      congenital ocular cranial dysinnervation disorder that may co-occur with
      proteinuric kidney disease.
    explanation: >-
      States explicitly that DRS3, the entity curated here, may co-occur with
      proteinuric kidney disease, which is why the renal arm is in scope.
- category: Genitourinary
  name: Nephrotic-Range Proteinuria
  description: >-
    Heavy protein loss in the urine, the functional readout of the failing
    filtration barrier. It can be the presenting feature in a carrier whose
    ocular involvement is mild or unrecognized, and it can progress to
    end-stage kidney disease.
  phenotype_term:
    preferred_term: Nephrotic range proteinuria
    term:
      id: HP:0012593
      label: Nephrotic range proteinuria
  evidence:
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An affected sibling presented with nephrotic-range proteinuria, Duane
      retraction syndrome (DRS) and neurodevelopmental involvement, while
      another family member had an isolated renal phenotype.
    explanation: >-
      Documents nephrotic-range proteinuria in a carrier who also had the Duane
      anomaly, and records that a relative had renal disease alone.
- category: Genitourinary
  name: Progression to End-Stage Kidney Disease
  description: >-
    The renal arm is not always indolent. In one reported family the proband
    progressed within months of the recognition of abnormal renal function to
    dialysis and then transplantation, and two of her relatives with the same
    variant also reached end-stage kidney disease.
  phenotype_term:
    preferred_term: End-stage kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  evidence:
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within months, the patient progressed to end-stage kidney disease (ESKD),
      requiring initiation of maintenance hemodialysis, followed by renal
      transplantation.
    explanation: >-
      Records progression to end-stage kidney disease in a MAFB bZIP-variant
      carrier.
- category: Nervous System
  name: Neurodevelopmental Involvement
  description: >-
    Developmental delay, cognitive impairment, and behavioural features have
    been described in carriers of a MAFB bZIP-domain variant. This is a recently
    reported extension of the phenotype rather than an established core feature,
    and it is confounded in at least one reported individual by profound
    pre-lingual deafness.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband exhibited CKD accompanied by congenital auricular anomalies,
      hearing loss, and neurodevelopmental delay.
    explanation: >-
      Reports neurodevelopmental delay in a MAFB bZIP-variant carrier, with the
      authors noting that several features had not previously been associated
      with MAFB.
genetic:
- name: MAFB
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MAFB (large-MAF bZIP transcription factor)
    term:
      id: hgnc:6408
      label: MAFB
  notes: >-
    MAFB is the sole gene attributed to this entity. It is intronless, so the
    coding sequence is a single exon, and the protein has two functionally
    separable parts: an N-terminal transactivation domain and a C-terminal
    basic leucine zipper that carries both the DNA-binding basic region and the
    dimerization zipper. Which domain a variant lands in predicts which MAFB
    disease results. Variants in or beside the bZIP DNA-binding region give the
    DURS3 ocular, otic, and renal phenotype; variants clustered in a short
    stretch of the N-terminal transactivation domain give multicentric
    carpotarsal osteolysis instead, without the ocular motility defect.
  evidence:
  - reference: PMID:27181683
    reference_title: "Loss of MAFB Function in Humans and Mice Causes Duane Syndrome, Aberrant Extraocular Muscle Innervation, and Inner-Ear Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on three heterozygous loss-of-function MAFB mutations
      causing DRS and a dominant-negative MAFB mutation causing DRS and deafness.
    explanation: >-
      The founding report establishing MAFB as causative for this entity.
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, all missense MAFB variants previously associated with FSGS and
      DRS cluster within or adjacent to the DNA-binding region of the bZIP
      domain, supporting the hypothesis that impaired transcriptional regulation
      underlies the combined renal and neuro-ocular phenotype
    explanation: >-
      States that the DURS3-spectrum missense alleles cluster in the bZIP
      DNA-binding region.
  - reference: PMID:24989131
    reference_title: "Multicentric carpotarsal osteolysis syndrome is caused by only a few domain-specific mutations in MAFB, a negative regulator of RANKL-induced osteoclastogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 5 mutations are within a 13 amino acid stretch of the transactivation
      domain.
    explanation: >-
      Establishes the contrasting location of the MCTO alleles, the other MAFB
      Mendelian disease, in the N-terminal transactivation domain.
  - reference: PMID:22387013
    reference_title: "Multicentric carpotarsal osteolysis is caused by mutations clustering in the amino-terminal transcriptional activation domain of MAFB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using exome capture and next-generation sequencing in five unrelated
      simplex cases of MCTO, we identified previously unreported missense
      mutations clustering within a 51 base pair region of the single exon of
      MAFB, validated by Sanger sequencing.
    explanation: >-
      The original report of the MCTO mutation cluster, independently
      establishing that the other MAFB disease occupies a different and very
      narrow part of the same single-exon gene.
  variants:
  - name: MAFB p.Leu239Pro
    description: >-
      A heterozygous leucine-to-proline substitution in the highly conserved
      DNA-binding region, found in two unrelated families whose four affected
      members all had both FSGS and the Duane anomaly. It reduces transactivation
      of a MARE-driven reporter, and structural modelling suggests it destabilizes
      the adjacent zinc finger. It is the allele modelled by the knock-in mouse.
    gene:
      preferred_term: MAFB
      term:
        id: hgnc:6408
        label: MAFB
    clinical_significance: PATHOGENIC
    type: missense
    evidence:
    - reference: PMID:29779709
      reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic analyses revealed that affected individuals harbor a rare
        heterozygous substitution (p.Leu239Pro) in MAFB, a leucine zipper
        transcription factor.
      explanation: >-
        Identifies the variant and its heterozygous state in the affected
        individuals.
    - reference: PMID:29779709
      reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Structural modeling suggested that the p.Leu239Pro substitution in the
        DNA-binding domain possibly interferes with the stability of the
        adjacent zinc finger.
      explanation: >-
        Structural prediction of how the substitution disrupts the DNA-binding
        module. The authors themselves hedge this as a possibility.
  - name: MAFB p.Leu266Pro (c.797T>C)
    description: >-
      A heterozygous bZIP-domain substitution segregating in an extended family
      with a strikingly variable phenotype spanning isolated renal disease,
      nephrotic-range proteinuria with the Duane anomaly, and end-stage kidney
      disease with cochlear aplasia, auricular anomalies, and neurodevelopmental
      delay.
    gene:
      preferred_term: MAFB
      term:
        id: hgnc:6408
        label: MAFB
    type: missense
    evidence:
    - reference: PMID:41898877
      reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using Exome Sequencing (ES), a heterozygous variant, c.797T>C;
        p.(Leu266Pro) in the MAFB gene was identified in multiple affected
        family members.
      explanation: >-
        Identifies the variant and its segregation across affected members of
        the family.
  - name: MAFB p.Glu223Lys
    description: >-
      A variant of uncertain significance recovered from sequencing of a large
      cohort with unsolved ocular congenital cranial dysinnervation disorders.
      Protein binding microarray showed it reduces or abolishes sequence-specific
      DNA binding, which supports but does not by itself establish pathogenicity.
    gene:
      preferred_term: MAFB
      term:
        id: hgnc:6408
        label: MAFB
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    type: missense
    evidence:
    - reference: PMID:40162949
      reference_title: "Gene Identification for Ocular Congenital Cranial Motor Neuron Disorders Using Human Sequencing, Zebrafish Screening, and Protein Binding Microarrays."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In addition, protein binding microarrays demonstrated reduced or
        abolished DNA binding of human variants of uncertain significance in
        known and novel sequence-derived transcription factors PHOX2A
        (p.(Trp137Cys)), MAFB (p.(Glu223Lys)), and OLIG2 (p.(Arg156Leu)).
      explanation: >-
        Reports the measured loss of DNA binding, and is explicit that the
        variant is one of uncertain significance.
animal_models:
- name: Mafb p.Leu239Pro homozygous knock-in mouse
  species: Mouse
  genotype: Mafb p.Leu239Pro homozygous knock-in (CRISPR-Cas9)
  publication: PMID:31882119
  description: >-
    A CRISPR-Cas9 knock-in mouse carrying the human DNA-binding-domain
    substitution. Homozygotes phenocopy the conventional Mafb-deficient mouse
    across the MAFB-dependent organs, which is what established that this
    leucine residue is required for MafB function rather than merely predicted
    to be.
  modeled_mechanisms:
  - target: MAFB Transcriptional Output Falls Below Its Developmental Threshold
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the molecular lesion itself, since it is the identical residue
      change found in affected people, and confirms that the substitution
      abolishes rather than merely alters MafB function.
    limitations: >-
      The functional equivalence to a null allele is demonstrated in the
      homozygote. Affected people are heterozygous, so the mouse establishes
      what the allele does to the protein rather than what one copy of it does
      to an organism.
    evidence:
    - reference: PMID:31882119
      reference_title: Phenotypic analysis of mice carrying human-type MAFB p.Leu239Pro mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        As a result, we found that the phenotype of Mafbmt/mt mouse was similar
        to that of the conventional Mafb deficient mouse.
      explanation: >-
        Shows the knock-in allele behaves as a loss of MafB function across
        tissues, supporting the molecular node.
  - target: Impaired Podocyte Differentiation and Glomerular Filtration Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Newborn homozygotes show defective podocyte differentiation with impaired
      foot processes, the cellular lesion behind the renal arm.
    limitations: >-
      Homozygotes die within 48 hours of birth, so the model captures the
      developmental defect but not the slow progression to glomerulosclerosis
      and end-stage kidney disease seen in affected people.
    evidence:
    - reference: PMID:37895232
      reference_title: "Exploring Large MAF Transcription Factors: Functions, Pathology, and Mouse Models with Point Mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mafb homozygous mutant mice died within 48 h after birth, and Mafb
        homozygous newborn mice showed defective differentiation of podocytes
        resulting from the impairment of foot processes.
      explanation: >-
        Reports both the podocyte defect this link claims and the perinatal
        lethality that bounds it.
- name: Mafb p.Leu239Pro heterozygous knock-in mouse
  species: Mouse
  genotype: Mafb p.Leu239Pro heterozygous knock-in (CRISPR-Cas9)
  publication: PMID:31882119
  description: >-
    The dose-matched mouse: it carries one copy of the same substitution that
    affected people carry. It stays healthy, which is a genuine negative result
    rather than a missing experiment.
  modeled_mechanisms:
  - target: Impaired Podocyte Differentiation and Glomerular Filtration Barrier Failure
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Heterozygous mice, the genotype equivalent to affected people, show no
      podocyte abnormality and normal kidney function, whereas heterozygous
      human carriers of the same substitution develop focal segmental
      glomerulosclerosis.
    limitations: >-
      A single copy of this allele is evidently below the threshold for disease
      in mouse but above it in human. Possible explanations include species
      differences in MafB dosage sensitivity, in the length of time the
      glomerulus must be maintained, or in modifier background, none of which
      have been tested. The practical consequence is that a null result in a
      heterozygous mouse cannot be used to argue against pathogenicity of a
      human MAFB allele.
    evidence:
    - reference: PMID:37895232
      reference_title: "Exploring Large MAF Transcription Factors: Functions, Pathology, and Mouse Models with Point Mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast, Mafb heterozygous mutant mice could stay healthy without
        any abnormal podocyte formation or kidney function.
      explanation: >-
        States the negative result directly: the dose-matched mouse does not
        develop the human phenotype.
- name: Mafb-null mouse
  species: Mouse
  genotype: Mafb homozygous null
  publication: PMID:40162949
  description: >-
    Complete loss of Mafb removes the abducens motor nuclei outright and the
    lateral rectus is instead innervated by the oculomotor nerve, reproducing
    the human dysinnervation pathology.
  modeled_mechanisms:
  - target: Failure of Rhombomere 5 Patterning and Abducens Motor Neuron Specification
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Absence of the sixth nerve motor nuclei, the cellular step this node
      asserts.
    limitations: >-
      A complete null is a deeper lesion than the heterozygous human alleles,
      and Mafb-null mice die soon after birth with hindbrain hypoplasia and
      respiratory failure, so the model cannot report on the postnatal course.
    evidence:
    - reference: PMID:40162949
      reference_title: "Gene Identification for Ocular Congenital Cranial Motor Neuron Disorders Using Human Sequencing, Zebrafish Screening, and Protein Binding Microarrays."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Monoallelic MAFB LOF causes DRS in humans and absence of CN6 motor
        nuclei in mice, with secondary aberrant innervation by CN3 of the
        lateral rectus muscle, which is normally innervated by CN6.
      explanation: >-
        States both the absent abducens nuclei and the secondary oculomotor
        misinnervation in the mouse.
- name: mafba-null zebrafish
  species: Zebrafish
  genotype: mafba loss of function (germline null and G0 CRISPR/Cas9 knockout)
  publication: PMID:40162949
  description: >-
    The zebrafish ortholog of MAFB. Loss of mafba severely malforms or abolishes
    the abducens motor nucleus, showing that the requirement is conserved well
    outside mammals and giving a tractable screening system for candidate
    cranial dysinnervation genes.
  modeled_mechanisms:
  - target: Failure of Rhombomere 5 Patterning and Abducens Motor Neuron Specification
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Absent or hypoplastic abducens motor nucleus on loss of the MAFB ortholog.
    limitations: >-
      Zebrafish carry duplicated MAFB paralogs and have two abducens motor
      nuclei per side rather than one, and the phenotype is scored in larvae
      rather than as an eye-movement disorder, so the anatomy maps onto human
      abducens development only approximately.
    evidence:
    - reference: PMID:40162949
      reference_title: "Gene Identification for Ocular Congenital Cranial Motor Neuron Disorders Using Human Sequencing, Zebrafish Screening, and Protein Binding Microarrays."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We first demonstrated the feasibility of the G0 screen by targeting known
        oCCDD genes phox2a and mafba. Approximately 70% to 90% of gene-targeted
        G0 zebrafish embryos recapitulated germline homozygous null-equivalent
        phenotypes.
      explanation: >-
        The primary zebrafish study, establishing that targeting mafba
        reproduces the germline null abducens phenotype in the great majority of
        embryos.
    - reference: PMID:41898877
      reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        showed that disruption of the zebrafish MAFB ortholog, mafba, results in
        severe malformation or absence of the abducens cranial nerve (CN6) motor
        nucleus, supporting its evolutionarily conserved role in cranial motor
        neuron specification
      explanation: >-
        A secondary description naming the specific abducens-nucleus outcome,
        which the primary report describes in its figures rather than in a
        single quotable sentence.
treatments:
- name: Extraocular Muscle (Strabismus) Surgery
  description: >-
    Recession or transposition of the extraocular muscles to improve alignment
    in the straight-ahead position, reduce a compensatory head turn, and address
    upshoot or downshoot. Surgery rebalances the eyes mechanically; it cannot
    restore abduction, because the abducens nerve that would drive it was never
    built. Management is the same as for Duane syndrome from any cause.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: strabismus surgery
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  target_phenotypes:
  - preferred_term: Incomitant strabismus
    term:
      id: HP:0025068
      label: Incomitant strabismus
  target_mechanisms:
  - target: Horizontal Rectus Co-contraction and Globe Retraction
    treatment_effect: MODULATES
    description: >-
      Recession or transposition mechanically rebalances the two horizontal
      recti that the aberrant oculomotor innervation makes fire together. It
      does not stop the co-contraction, because the miswiring is fixed from
      early development; it changes the forces the co-contraction produces,
      which is why it can improve alignment and the upshoot or downshoot while
      leaving abduction unrestored.
    evidence:
    - reference: PMID:20301369
      reference_title: "Duane Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        extraocular muscle surgery to address alignment in primary gaze,
        compensatory head posture, and upshoot or downshoot.
      explanation: >-
        Upshoot and downshoot are the direct expression of the co-contracting
        lateral rectus slipping over or under the globe, which is the node this
        link targets, and GeneReviews names them among the surgical
        indications.
    - reference: PMID:40212284
      reference_title: "Etiology and clinical features of Han Chinese patients with Duane retraction syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thirty-five patients who underwent strabismus surgery gained binocular
        vision and an improved appearance.
      explanation: >-
        Outcome evidence that the surgery achieves what this link claims.
        Graded PARTIAL because it reports the clinical result in a general Duane
        cohort without measuring the co-contraction itself.
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      extraocular muscle surgery to address alignment in primary gaze,
      compensatory head posture, and upshoot or downshoot.
    explanation: >-
      GeneReviews specifies the surgical indications in Duane syndrome, which
      includes the MAFB-related form.
- name: Amblyopia Therapy
  description: >-
    Occlusion or penalization of the better-seeing eye, to force use of the
    affected eye. This is the intervention with the narrowest window, because
    visual development cannot be recovered once it is over, and it is the reason
    the surveillance schedule is front-loaded into early childhood.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occlusion or penalization therapy for amblyopia
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Amblyopia
    term:
      id: HP:0000646
      label: Amblyopia
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      occlusion or penalization of the better-seeing eye for treatment of
      amblyopia
    explanation: >-
      GeneReviews specifies occlusion or penalization for amblyopia in Duane
      syndrome.
- name: Optical Correction with Spectacles and Prisms
  description: >-
    Spectacles or contact lenses to correct refractive error, and prism glasses
    to reduce the head turn in people with milder involvement. A device rather
    than a behavioural intervention, and separate from amblyopia therapy even
    though the two are usually prescribed together.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: optical correction
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Compensatory head posture
    term:
      id: HP:0031705
      label: Compensatory head posture
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spectacles or contact lenses for refractive error; occlusion or
      penalization of the better-seeing eye for treatment of amblyopia; prism
      glasses (usually in older individuals with mild involvement) to improve
      the compensatory head position
    explanation: >-
      GeneReviews lists refractive correction and prism glasses, and names the
      head position as what the prisms are for.
- name: Ophthalmologic Surveillance for Amblyopia
  description: >-
    Not a treatment of the mechanism but the schedule that makes the treatable
    part treatable: three-to-six-monthly examinations through the first years of
    life, then annual or biannual review until binocular vision is established
    and the amblyopia risk has passed, and none in adulthood beyond ordinary
    public health guidance.
  treatment_term:
    preferred_term: ophthalmologic surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ophthalmologic visits every three to six months during the first years of
      life to prevent, detect, and treat amblyopia; annual or biannual
      examinations once the presence of binocular vision and reduced risk for
      amblyopia is confirmed, and in all individuals older than age seven to 12;
      no surveillance in adulthood beyond public health guidelines.
    explanation: >-
      The GeneReviews surveillance schedule, quoted in full because the age
      thresholds are the operative content.
  notes: >-
    Deliberately carries no `target_mechanisms`. Surveillance is a monitoring
    action, not a therapeutic one acting on a pathophysiology node.
- name: Cochlear Implantation
  description: >-
    For the profound sensorineural hearing loss of the inner-ear arm. It was
    performed bilaterally in a MAFB bZIP-variant carrier whose imaging showed
    cochlear aplasia with a common cavity. Note that a common-cavity cochlea is
    an unfavourable implant anatomy, so this reflects what was done in one
    reported case rather than an established outcome for this genotype. Milder
    hearing loss in this disease would ordinarily be managed with amplification
    instead, but no MAFB carrier fitted with hearing aids has been reported, so
    that is not curated here as a separate treatment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  target_mechanisms:
  - target: Impaired MAFB-Dependent Inner Ear Morphogenesis
    treatment_effect: BYPASSES
    description: >-
      An implant does not correct otic development. It routes around the
      malformed cochlea by stimulating the auditory nerve directly, which is why
      it can help even where the cochlea is aplastic with a common cavity, and
      why it is the only intervention in this entry that addresses the otic arm
      at all.
    evidence:
    - reference: PMID:41898877
      reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She subsequently underwent bilateral cochlear implantation.
      explanation: >-
        The one reported instance of this intervention in a MAFB variant
        carrier, in an individual whose imaging showed cochlear aplasia with a
        common cavity. Graded PARTIAL because no outcome is reported, so it
        evidences that the route around the malformed cochlea was taken rather
        than that it succeeded.
  evidence:
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She subsequently underwent bilateral cochlear implantation.
    explanation: >-
      Records bilateral cochlear implantation in a MAFB variant carrier with
      profound pre-lingual hearing loss.
- name: Renin-Angiotensin System Blockade for Proteinuria
  description: >-
    Angiotensin-converting enzyme inhibition to reduce proteinuria and slow
    decline in kidney function in carriers with the renal arm. In one reported
    carrier, kidney function remained stable over several years of treatment.
    This is antiproteinuric supportive care rather than a therapy directed at
    MAFB, and the evidence is a single family's clinical course.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
  target_phenotypes:
  - preferred_term: Nephrotic range proteinuria
    term:
      id: HP:0012593
      label: Nephrotic range proteinuria
  target_mechanisms:
  - target: Impaired Podocyte Differentiation and Glomerular Filtration Barrier Failure
    treatment_effect: MODULATES
    description: >-
      ACE inhibition does not restore MAFB or repair the podocyte, but it lowers
      intraglomerular pressure across the damaged filtration barrier, which is
      what reduces protein loss and slows the decline in function. It acts on
      the consequences of the podocyte node rather than on its cause.
    evidence:
    - reference: PMID:41898877
      reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She was treated with angiotensin-converting enzyme (ACE) inhibitors for
        several years, during which her kidney function remained stable
      explanation: >-
        The only outcome evidence linking this treatment to the renal arm in a
        MAFB carrier. Graded PARTIAL because it is one uncontrolled patient
        course, not a demonstration that the mechanism node was modulated.
  evidence:
  - reference: PMID:41898877
    reference_title: "Broadening the Phenotypic Spectrum of MAFB-Related Disease: Renal, Auricular, Ocular, and Nervous System Involvement."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was treated with angiotensin-converting enzyme (ACE) inhibitors for
      several years, during which her kidney function remained stable
    explanation: >-
      Documents ACE-inhibitor treatment with stable kidney function in one MAFB
      variant carrier. An uncontrolled single-patient course, hence PARTIAL.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence or incidence figure exists for molecularly confirmed
    MAFB-related Duane retraction syndrome. Reported cases amount to a handful
    of families. The general Duane syndrome population figures cannot be
    borrowed, because the overwhelming majority of Duane syndrome has no genetic
    diagnosis at all and only a small fraction of the solved cases are MAFB.
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 98% of individuals with isolated Duane syndrome and no family
      history lack an identified genetic etiology.
    explanation: >-
      Establishes that the molecularly solved fraction of Duane syndrome, of
      which MAFB is one of three genes, is very small, so no population rate can
      be assigned to this entity.
clinical_trials:
- name: NCT03059420
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    A long-running observational cohort study at Boston Children's Hospital
    collecting genetic and phenotypic data on strabismus and congenital cranial
    dysinnervation disorders. It is a gene-discovery study, not an intervention
    trial; MAFB itself was identified through work of this kind. No
    interventional or disease-modifying trial exists for this entity.
  evidence:
  - reference: clinicaltrials:NCT03059420
    reference_title: "Genetic Studies of Strabismus, Congenital Cranial Dysinnervation Disorders (CCDDs), and Their Associated Anomalies"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of this study is to identify genes associated with impaired
      development and function of the cranial nerves and brainstem, which may
      result in misalignment of the eyes (strabismus) and related conditions
    explanation: >-
      The registry record states the gene-discovery aim covering the congenital
      cranial dysinnervation disorders, of which this entity is one.
diagnosis:
- name: High-Resolution Cranial Nerve MRI
  description: >-
    Dedicated thin-section MRI of the cranial nerves shows the abducens nerve to
    be absent or hypoplastic. This is what separates a congenital dysinnervation
    disorder from an acquired sixth-nerve palsy, where the nerve is present, and
    it is the imaging correlate of the founding lesion in this entry's
    pathograph. It does not distinguish the MAFB form from the other genetic or
    unsolved forms of Duane syndrome; only sequencing does that.
  evidence:
  - reference: PMID:40212284
    reference_title: "Etiology and clinical features of Han Chinese patients with Duane retraction syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 12 of the 14 patients with DRS1 and 9 of the 17 patients with DRS3, the
      abducens nerve was found to be absent in the MRI images, and in 4 of the
      patients with DRS2, the abducens nerve was detected as hypoplasia.
    explanation: >-
      Demonstrates absent or hypoplastic abducens nerves on MRI in living
      patients. Note that DRS1, DRS2 and DRS3 in this cohort are the Huber
      CLINICAL types, not the numbered genetic loci; the paper's "DRS3" is Huber
      type III and is not this entity. The finding is cited here as evidence
      that the imaging detects the lesion, not as a genotype-specific frequency.
- name: Ophthalmological Examination
  description: >-
    The diagnosis of the Duane anomaly itself is clinical: an ophthalmologist
    observes the limitation of horizontal movement together with globe
    retraction and palpebral fissure narrowing on attempted adduction.
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Duane syndrome is usually made by an ophthalmologist
      based on clinical findings.
    explanation: >-
      GeneReviews states that the Duane diagnosis is made clinically.
- name: MAFB Molecular Genetic Testing
  description: >-
    Sequencing MAFB, alongside CHN1 and SALL4, establishes the specific
    diagnosis. GeneReviews directs testing at those with a family history and at
    those whose motility pattern falls into Huber clinical type I or III.
    Because the MAFB-related form can carry hearing loss and proteinuric kidney
    disease, a molecular diagnosis here changes surveillance and not only
    counselling.
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular genetic testing for a pathogenic variant in CHN1, MAFB, or
      SALL4 is most appropriate for those with a positive family history of
      isolated Duane syndrome
    explanation: >-
      GeneReviews specifies when MAFB testing is indicated in Duane syndrome.
differential_diagnoses:
- name: Acquired Sixth Cranial Nerve Palsy
  description: >-
    The differential that matters most in practice, because it is the one with a
    treatable and sometimes dangerous cause behind it. An abduction deficit
    acquired later in life may signal raised intracranial pressure, a
    demyelinating lesion, microvascular ischaemia or a skull-base mass, none of
    which is compatible with a congenital dysinnervation disorder.
  distinguishing_features:
  - Onset is acquired, not congenital and non-progressive.
  - No globe retraction and no palpebral fissure narrowing on adduction, because
    there is no aberrant oculomotor co-innervation to co-contract the horizontal
    recti.
  - The abducens nerve is present on high-resolution MRI, whereas it is absent
    or hypoplastic in this entity.
  - No family history and no MAFB variant.
  evidence:
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duane syndrome is a strabismus condition clinically characterized by
      congenital non-progressive limited horizontal eye movement accompanied by
      globe retraction which results in narrowing of the palpebral fissure.
    explanation: >-
      Gives the two features that separate this entity from an acquired palsy:
      congenital non-progressive onset, and globe retraction from co-contraction.
- name: Congenital Fibrosis of the Extraocular Muscles
  description: >-
    The other major ocular congenital cranial dysinnervation disorder. It shares
    the congenital, non-progressive, miswiring-based mechanism but involves
    different cranial nerves and a different gene set.
  distinguishing_features:
  - Affects the oculomotor and trochlear nerves rather than the abducens, so the
    restriction is predominantly vertical with ptosis rather than horizontal.
  - Caused by KIF21A, PHOX2A, TUBB3 or other tubulin genes, not MAFB.
  - No associated deafness or proteinuric kidney disease.
  evidence:
  - reference: PMID:41870107
    reference_title: "Update on Congenital Cranial Dysinnervation Disorders (CCDDs)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital fibrosis of the extraocular muscles (CFEOM), results from
      variants in KIF21A, PHOX2A, TUBB3, or other tubulin genes, and affects the
      oculomotor and trochlear nerves.
    explanation: >-
      Gives the gene set and the affected nerves, which is what separates CFEOM
      from the abducens lesion of this entity.
- name: Moebius Syndrome
  description: >-
    Also involves the abducens nerve, which is what makes it a genuine
    differential rather than a distant one, but it adds a facial nerve palsy and
    has no established genetic cause.
  distinguishing_features:
  - Facial nerve palsy accompanies the abducens palsy, producing the
    characteristic mask-like facies absent from this entity.
  - No identified Mendelian cause; may be non-Mendelian, so a negative gene
    panel does not exclude it.
  - No deafness or renal involvement of the kind seen with MAFB bZIP variants.
  evidence:
  - reference: PMID:41870107
    reference_title: "Update on Congenital Cranial Dysinnervation Disorders (CCDDs)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moebius syndrome, defined by abducens and facial nerve palsies, has no
      identified genetic cause and may result from non-Mendelian causes.
    explanation: >-
      Gives the defining combination and the absence of a genetic cause, both of
      which separate it from this entity.
- name: Horizontal Gaze Palsy with Progressive Scoliosis
  description: >-
    A brainstem axon-guidance disorder rather than a cranial nerve one, but it
    presents with a horizontal gaze abnormality and so enters the differential.
  distinguishing_features:
  - Caused by ROBO3 loss of function, with failure of axonal midline crossing in
    the brainstem rather than failure of abducens nerve formation.
  - Progressive scoliosis accompanies the gaze palsy.
  - Horizontal gaze palsy is conjugate, not the unilateral or asymmetric
    abduction deficit with globe retraction seen here.
  evidence:
  - reference: PMID:41870107
    reference_title: "Update on Congenital Cranial Dysinnervation Disorders (CCDDs)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Horizontal gaze palsy with progressive scoliosis (HGPPS), caused by ROBO3
      loss of function, arises from failure of axonal midline crossing in the
      brainstem.
    explanation: >-
      Gives the gene and the distinct anatomical level of the lesion.
- name: CHN1- and SALL4-Related Duane Syndrome
  description: >-
    The genetic siblings, and the hardest differential of all, because the ocular
    phenotype can be indistinguishable. Only sequencing separates them, and the
    distinction matters because the extraocular surveillance differs.
  distinguishing_features:
  - CHN1 (DURS2) acts by gain of function in alpha2-chimaerin rather than loss of
    a transcription factor, and carries no deafness or renal involvement.
  - SALL4 produces the Duane-radial ray (Okihiro) spectrum, with radial ray limb
    anomalies absent from the MAFB form.
  - Neither carries the sensorineural hearing loss or proteinuric kidney disease
    that make a MAFB diagnosis change surveillance.
  evidence:
  - reference: PMID:41870107
    reference_title: "Update on Congenital Cranial Dysinnervation Disorders (CCDDs)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duane retraction syndrome, the most common CCDD, results from the absence
      of the abducens nerve and innervation of the lateral rectus by oculomotor
      nerve axons; causative genes include CHN1, MAFB, HOXA1, SALL4, and EBF3,
      although most cases do not have a genetic diagnosis.
    explanation: >-
      Lists the genetic siblings sharing the identical mechanism, and records
      that most Duane syndrome has no genetic diagnosis at all, which is why the
      differential usually cannot be closed.
discussions:
- discussion_id: mafb_het_mouse_dose_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does one copy of MAFB p.Leu239Pro cause focal segmental
    glomerulosclerosis and Duane retraction syndrome in a person, while the
    dose-matched heterozygous knock-in mouse stays healthy?
  attaches_to:
  - pathophysiology#Impaired Podocyte Differentiation and Glomerular Filtration Barrier Failure
  - pathophysiology#MAFB Transcriptional Output Falls Below Its Developmental Threshold
  rationale: >-
    The threshold model this entry is built on predicts that phenotype tracks
    the size of the shortfall in MAFB output. The mouse puts a number on where
    that threshold sits, and it is not in the same place in the two species: in
    the mouse, one mutant copy is tolerated and only the homozygote is affected,
    whereas in people one copy produces glomerulosclerosis and a cranial nerve
    that never formed. This is not a missing experiment; the heterozygote was
    examined and was normal. It matters for interpretation, because a negative
    result in a heterozygous mouse would otherwise look like evidence against a
    human MAFB allele being pathogenic, and it matters for the model, because it
    says the threshold is a property of the species and not of the protein.
    Candidate explanations include a difference in how much MafB the developing
    mouse glomerulus and hindbrain actually need, the far longer period over
    which a human glomerulus must be maintained, and modifier background. None
    has been tested.
  proposed_experiments:
  - experiment_id: mafb_het_dose_output_comparison
    name: Quantify MAFB target-gene output at matched heterozygous dose in both species
    description: >-
      Measure MARE-driven target-gene transcription in podocytes and in
      rhombomere-5-derived motor neurons from heterozygous mouse and from human
      induced pluripotent stem cell lines carrying the same substitution, to
      establish whether the two species differ in residual output or in
      sensitivity to the same residual output.
  evidence:
  - reference: PMID:37895232
    reference_title: "Exploring Large MAF Transcription Factors: Functions, Pathology, and Mouse Models with Point Mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, Mafb heterozygous mutant mice could stay healthy without any
      abnormal podocyte formation or kidney function.
    explanation: >-
      The negative result in the dose-matched mouse that creates the mismatch.
  - reference: PMID:29779709
    reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analyses revealed that affected individuals harbor a rare
      heterozygous substitution (p.Leu239Pro) in MAFB, a leucine zipper
      transcription factor.
    explanation: >-
      The human side of the mismatch: heterozygous carriers of the same
      substitution are affected.
- discussion_id: mafb_renal_arm_scope
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should proteinuric kidney disease be treated as part of Duane retraction
    syndrome 3, or as a separate MAFB-related renal disease that sometimes
    co-occurs with it?
  attaches_to:
  - pathophysiology#Impaired Podocyte Differentiation and Glomerular Filtration Barrier Failure
  rationale: >-
    The MONDO and OMIM labels for this entity name deafness and not kidney
    disease, yet every affected member of the two families that defined the
    p.Leu239Pro allele had focal segmental glomerulosclerosis, and a more
    recently reported family includes a carrier with an isolated renal
    phenotype and no ocular involvement at all. This entry curates the renal
    arm on the strength of a 2026 report stating that DRS3 may co-occur with
    proteinuric kidney disease, but the boundary is genuinely unsettled: the
    same bZIP alleles are also reported under headings such as
    MAFB-associated glomerulopathy. The practical question is whether a carrier
    with kidney disease alone should be recorded as having this entity. Until a
    nosological decision is made, this entry keeps the renal features and marks
    them as variable rather than defining.

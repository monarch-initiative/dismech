notes: >-
  Entry-type decision: DISEASE. MONDO:0014880 is a leaf with no descendants and
  a single causal gene, so it is a curatable disease rather than a grouping. It
  is kept separate from the existing `Duane_Retraction_Syndrome` entry
  (MONDO:0007473) rather than folded in as a subtype, because the MAFB form
  carries mechanism and management that the clinical umbrella does not: a
  transcription-factor dosage lesion with parallel otic and renal arms, and a
  reason to screen hearing and urine that a CHN1 or genetically unsolved case
  does not have. The parent entry is cross-referenced under
  `mappings.mondo_mappings` with `skos:broadMatch`.


  Named-entity check: `just preflight-dr` on the falcon report returned PASS
  (MAFB mentioned 56 times against CHN1 twice; MONDO OMIM xref 617041). The two
  identity traps for this entity are recorded in the description: DURS3 is not
  Huber clinical type 3, and MAFB's other Mendelian disease, multicentric
  carpotarsal osteolysis, is a different domain of the same single-exon gene.


  Frequency values are deliberately absent from every phenotype. The literature
  on molecularly confirmed MAFB-related disease is a handful of families, and
  no denominator exists from which to derive a band. The one quantitative claim
  made anywhere in this entry is about the fraction of Duane syndrome overall
  that lacks a genetic diagnosis, which is cited.


  Orphanet has no entry keyed to this concept, so no ORPHA reference is cited.
  `just refresh-orphadata` is currently failing on a checksum mismatch in this
  repository, so the cached Orphanet corpus was not re-derived for this entry.

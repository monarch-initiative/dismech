    snippet: >-
      Postmortem studies of DRS have reported abducens nerve hypoplasia and
      aberrant innervation of the lateral rectus muscle by the oculomotor nerve.
    explanation: >-
      Human postmortem pathology confirming that the lateral rectus receives
      oculomotor rather than abducens innervation.
  downstream:
  - target: Horizontal Rectus Co-contraction and Globe Retraction
    description: >-
      Shared oculomotor drive makes the lateral and medial recti contract
      together on attempted adduction.
- name: Horizontal Rectus Co-contraction and Globe Retraction
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Because the lateral rectus now fires on the oculomotor command that also
    drives the medial rectus, attempted adduction contracts both horizontal
    recti at once. The opposed forces pull the globe backwards into the orbit,
    narrowing the palpebral fissure, while abduction remains deficient because
    the muscle no longer receives an abduction command. This synkinetic
    miswiring, not weakness or fibrosis of the muscle, is what a clinician sees
    at the bedside.
  cell_types:
  - preferred_term: horizontal rectus muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  evidence:
  - reference: PMID:40162949
    reference_title: "Gene Identification for Ocular Congenital Cranial Motor Neuron Disorders Using Human Sequencing, Zebrafish Screening, and Protein Binding Microarrays."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In DRS, CN6 maldevelopment causes limited abduction and variably limited
      adduction, and the globe retracts on attempted adduction because of
      synkinetic miswiring by CN3.
    explanation: >-
      Attributes the globe retraction directly to synkinetic oculomotor
      miswiring, the step this node models.
  - reference: PMID:20301369
    reference_title: "Duane Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      globe retraction occurs as a result of abnormal innervation of the lateral
      rectus muscle by the oculomotor nerve (cranial nerve III)
    explanation: >-
      GeneReviews states the same causal link between the aberrant innervation
      and the retraction.

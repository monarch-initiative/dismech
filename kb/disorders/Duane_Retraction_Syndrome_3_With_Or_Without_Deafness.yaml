pathophysiology:
- name: MAFB Transcriptional Output Falls Below Its Developmental Threshold
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MAFB is a single-exon large-MAF basic leucine zipper transcription factor
    that homodimerizes and binds MAF recognition elements (MAREs) to drive
    transcription of nearby target genes. The DURS3 alleles reduce that output
    by two routes. Heterozygous truncating and other loss-of-function alleles
    halve the dose; missense alleles in or beside the C-terminal DNA-binding
    region, of which p.Leu239Pro is the best characterized, leave a protein that
    cannot engage the MARE and can additionally poison the wild-type partner in
    the dimer, giving a dominant-negative allele. Engle and colleagues framed
    the resulting allelic series as a threshold model, in which the depth of the
    shortfall determines how much of the MAFB-dependent developmental program is
    lost and therefore how far the phenotype extends beyond the eye.
  molecular_functions:
  - preferred_term: sequence-specific MARE binding by the MAFB bZIP domain
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: MAFB
      term:
        id: hgnc:6408
        label: MAFB
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline MAFB alleles. Three loss-of-function alleles and one
      dominant-negative missense allele were reported in the founding cohort;
      subsequently reported DURS3-spectrum missense alleles cluster in or beside
      the bZIP DNA-binding region.
  evidence:
  - reference: PMID:27181683
    reference_title: "Loss of MAFB Function in Humans and Mice Causes Duane Syndrome, Aberrant Extraocular Muscle Innervation, and Inner-Ear Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on three heterozygous loss-of-function MAFB mutations
      causing DRS and a dominant-negative MAFB mutation causing DRS and deafness.
    explanation: >-
      Establishes the two allelic classes, reduced dose and dominant-negative,
      that lower MAFB output in this disease.
  - reference: PMID:27181683
    reference_title: "Loss of MAFB Function in Humans and Mice Causes Duane Syndrome, Aberrant Extraocular Muscle Innervation, and Inner-Ear Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using genotype-phenotype correlations in humans and Mafb-knockout mice, we
      propose a threshold model for variable loss of MAFB function.
    explanation: >-
      States the threshold model that this node encodes, in which the size of the
      shortfall in MAFB function sets the extent of the phenotype. The quoted
      sentence spans two evidence types, human genotype-phenotype correlation
      and Mafb-knockout mice. It is graded HUMAN_CLINICAL because the claim
      being supported is an allelic-series inference across affected people,
      which the mouse work extends rather than establishes; the mouse arm of the
      same paper is graded MODEL_ORGANISM where it is quoted separately on the
      abducens and reinnervation nodes.
  - reference: PMID:37895232
    reference_title: "Exploring Large MAF Transcription Factors: Functions, Pathology, and Mouse Models with Point Mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These four transcription factors are thought to be involved in the
      formation of homodimers and binding to DNA sequences called Maf
      recognition elements (MAREs) to stimulate the transcriptional activity of
      nearby target genes.
    explanation: >-
      Describes the normal molecular function that the DURS3 alleles degrade:
      MARE binding and target-gene transactivation by a MAF homodimer.
  - reference: PMID:37895232
    reference_title: "Exploring Large MAF Transcription Factors: Functions, Pathology, and Mouse Models with Point Mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation is a highly preserved leucine-to-proline substitution in the
      DNA-binding region of MAFB, rendering it incapable of binding to the MARE
      sequence.
    explanation: >-
      Identifies the molecular defect of the p.Leu239Pro allele as loss of MARE
      binding by the DNA-binding region.
  - reference: PMID:29779709
    reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Luciferase assays with cultured monocytes indicated that the substitution
      significantly reduced transactivation of the F4/80 promoter, the known
      MAFB recognition element.
    explanation: >-
      Direct functional measurement that the DNA-binding-domain substitution
      lowers MAFB transactivation of a MARE-driven promoter.
  - reference: PMID:40162949
    reference_title: "Gene Identification for Ocular Congenital Cranial Motor Neuron Disorders Using Human Sequencing, Zebrafish Screening, and Protein Binding Microarrays."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, protein binding microarrays demonstrated reduced or abolished
      DNA binding of human variants of uncertain significance in known and novel
      sequence-derived transcription factors PHOX2A (p.(Trp137Cys)), MAFB
      (p.(Glu223Lys)), and OLIG2 (p.(Arg156Leu)).
    explanation: >-
      An independent biophysical assay showing that a further MAFB variant from
      a cranial dysinnervation cohort loses sequence-specific DNA binding.
  downstream:
  - target: Failure of Rhombomere 5 Patterning and Abducens Motor Neuron Specification
    description: >-
      Reduced MAFB-driven transcription removes the segmental identity signal
      that the hindbrain uses to build the abducens motor neuron pool.
  - target: Impaired MAFB-Dependent Inner Ear Morphogenesis
    description: >-
      The same shortfall in MAFB output disrupts otic development, the parallel
      arm that produces the deafness named in the disease label.
  - target: Impaired Podocyte Differentiation and Glomerular Filtration Barrier Failure
    description: >-
      MAFB is separately required in the developing glomerulus, so DNA-binding
      domain alleles can additionally compromise the podocyte program.
- name: Failure of Rhombomere 5 Patterning and Abducens Motor Neuron Specification
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The abducens motor neurons are born in hindbrain rhombomere 5, and the mouse
    MAFB ortholog kreisler is required for that segment to form at all. When
    MAFB function drops, rhombomere 5 identity is not established and the
    abducens motor neuron pool is not specified. Mafb-null mice lack the sixth
    nerve motor nuclei outright, and zebrafish lacking the mafba ortholog show
    absent or hypoplastic abducens nuclei, so the requirement is conserved
    across vertebrates.
  cell_types:
  - preferred_term: abducens motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: rhombomere 5 development
    term:
      id: GO:0021571
      label: rhombomere 5 development
    modifier: DECREASED
  - preferred_term: abducens motor neuron fate specification
    term:
      id: GO:0048665
      label: neuron fate specification
    modifier: DECREASED
  evidence:
  - reference: PMID:10395784
    reference_title: The role of kreisler in segmentation during hindbrain development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using Hox/lacZ transgenic mice as reporter lines and by analyzing
      Eph/ephrin expression, we have found that while r5 fails to form in these
      mice, r6 is present. This shows that kreisler has an early role in the
      formation of r5.
    explanation: >-
      Establishes that the mouse MAFB ortholog is required to form rhombomere 5,
      the hindbrain segment from which the abducens motor neurons arise.
  - reference: PMID:40162949
    reference_title: "Gene Identification for Ocular Congenital Cranial Motor Neuron Disorders Using Human Sequencing, Zebrafish Screening, and Protein Binding Microarrays."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Monoallelic MAFB LOF causes DRS in humans and absence of CN6 motor nuclei
      in mice, with secondary aberrant innervation by CN3 of the lateral rectus
      muscle, which is normally innervated by CN6.
    explanation: >-
      States that reduced MAFB function abolishes the abducens motor nuclei in
      mice, the cellular step this node models.
  - reference: PMID:37895232
    reference_title: "Exploring Large MAF Transcription Factors: Functions, Pathology, and Mouse Models with Point Mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, mutations of MAFB impair the generation and/or inhibit the
      sustenance of abducens neurons, the inner ear, and podocytes in the
      kidneys
    explanation: >-
      A review of the MAF family summarizing that MAFB variants compromise the
      generation or maintenance of abducens neurons.
  downstream:
  - target: Abducens Nerve Hypoplasia and Failure to Innervate the Lateral Rectus
    description: >-
      Without a specified abducens motor neuron pool, the sixth nerve is
      hypoplastic or absent and never reaches its target muscle.
- name: Abducens Nerve Hypoplasia and Failure to Innervate the Lateral Rectus
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The founding anatomical lesion is a hypoplastic or absent abducens nerve
    that fails to fully innervate the lateral rectus muscle. This is the
    dysinnervation event that defines the disease, and it is documented in
    affected people as well as in mice. The lateral rectus itself is a normal
    skeletal muscle at this point; what is missing is its motor supply.
  biological_processes:
  - preferred_term: abducens nerve development
    term:
      id: GO:0021560
      label: abducens nerve development
    modifier: DECREASED
  evidence:
  - reference: PMID:29779709
    reference_title: "A mutation in transcription factor MAFB causes Focal Segmental Glomerulosclerosis with Duane Retraction Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypoplasia of the abducens nerves and hearing impairment occurred in
      severely affected individuals.
    explanation: >-
      Documents abducens nerve hypoplasia in MAFB variant carriers, and does so
      in the individuals at the severe end of the threshold, who also had
      hearing impairment.
  - reference: PMID:27181683
    reference_title: "Loss of MAFB Function in Humans and Mice Causes Duane Syndrome, Aberrant Extraocular Muscle Innervation, and Inner-Ear Defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, we present evidence that the primary cause of DRS is failure of the
      abducens nerve to fully innervate the lateral rectus muscle in early
      development.
    explanation: >-
      Names failed abducens innervation of the lateral rectus as the primary
      developmental cause, which is why this node and not an extraocular muscle
      defect is the root of the ocular arm.
  - reference: PMID:41870107
    reference_title: "Update on Congenital Cranial Dysinnervation Disorders (CCDDs)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duane retraction syndrome, the most common CCDD, results from the absence
      of the abducens nerve and innervation of the lateral rectus by oculomotor
      nerve axons; causative genes include CHN1, MAFB, HOXA1, SALL4, and EBF3,
      although most cases do not have a genetic diagnosis.
    explanation: >-
      A current review placing MAFB among the causative genes and stating the
      absent-abducens-nerve mechanism this node encodes.
  downstream:
  - target: Aberrant Oculomotor Reinnervation of the Lateral Rectus
    description: >-
      The denervated lateral rectus is captured by a misrouted branch of the
      oculomotor nerve growing to nearby extraocular muscle targets.
- name: Aberrant Oculomotor Reinnervation of the Lateral Rectus
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    With no abducens input, the lateral rectus is secondarily innervated by
    aberrant branches of the oculomotor nerve that form at developmental
    decision regions close to the target extraocular muscles. This is a
    secondary consequence of the primary abducens failure rather than an
    independent guidance defect: selectively disrupting abducens development is
    by itself sufficient to produce the miswiring. The lateral rectus is
    thereafter yoked to the medial rectus rather than opposing it.

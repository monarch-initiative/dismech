creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
synonyms:
- DURS3
- DRS3
- Duane retraction syndrome 3
- MAFB Duane retraction syndrome
- Duane retraction syndrome caused by mutation in MAFB
disease_term:
  preferred_term: Duane retraction syndrome 3 with or without deafness
  term:
    id: MONDO:0014880
    label: Duane retraction syndrome 3 with or without deafness
description: >-
  Duane retraction syndrome 3 (DURS3, OMIM 617041) is the MAFB-attributed member
  of the Duane retraction syndrome series. It is a congenital cranial
  dysinnervation disorder, not a disease of the extraocular muscles: the primary
  lesion is that the abducens (sixth cranial) nerve never forms properly and
  never fully innervates the lateral rectus, and the denervated muscle is then
  captured by a misrouted branch of the oculomotor (third cranial) nerve. Because
  the lateral rectus is thereafter wired to fire with the medial rectus, attempted
  adduction co-contracts both horizontal recti and drags the globe back into the
  orbit, while abduction stays deficient. The muscle itself is intact; the wiring
  diagram is wrong.


  MAFB is a single-exon basic leucine zipper (bZIP) transcription factor whose
  mouse ortholog kreisler specifies hindbrain rhombomere 5, the segment that
  gives rise to the abducens motor neurons. The variants that cause DURS3 sit in
  or beside the C-terminal bZIP DNA-binding region and reduce sequence-specific
  transcription, either by haploinsufficiency (heterozygous loss of function) or
  by a dominant-negative missense allele. Engle and colleagues, who identified
  the gene, framed the resulting allelic series as a threshold model: how far
  MAFB output falls determines how much of the MAFB-dependent developmental
  program fails, which is why an isolated eye-movement defect, an eye-movement
  defect plus deafness, and a broader syndrome can all arise from the same locus.


  The disease name understates the spectrum. The MONDO and OMIM labels name only
  deafness, but MAFB is also required for inner-ear morphogenesis and for
  podocyte differentiation, and bZIP-domain variants have been reported with
  focal segmental glomerulosclerosis, proteinuric kidney disease progressing to
  end-stage kidney disease, cochlear malformation, and neurodevelopmental
  involvement alongside the Duane anomaly. Expressivity is strikingly variable
  within a single family: in one reported kindred the sibling with the Duane
  anomaly had normal hearing while his sister, who had cochlear aplasia and
  developmental delay, could not be assessed ophthalmologically at all.


  DURS3 must be kept apart from two nearby things. First, it is not Huber
  clinical type 3 Duane syndrome; the "3" numbers the genetic locus, and a
  MAFB carrier may show Huber type 1. Second, MAFB carries a second, distinct
  Mendelian disease: multicentric carpotarsal osteolysis, caused by missense
  variants clustering in a short stretch of the N-terminal transactivation
  domain, which produces skeletal osteolysis and nephropathy but not the ocular
  motility defect. The genotype-phenotype split is domain-specific, and it is
  the cleanest available handle on which MAFB disease a new variant belongs to.

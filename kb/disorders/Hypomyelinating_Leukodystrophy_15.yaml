    explanation: >-
      Demonstrates the deletion allele is degraded by nonsense-mediated decay,
      so the phenotype is driven by whatever residual function the surviving
      missense allele retains — a concrete instance of the reduced-EPRS1
      mechanism above.
experimental_models:
- name: FBD-102b oligodendroglial cells expressing EPRS1 R339X
  experimental_model_type: CELL_LINE
  description: >-
    Mouse FBD-102b cells, used by the authors as model oligodendrocytes,
    transfected with the HLD15-associated R339X nonsense variant.
  publication: PMID:33805425
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Mutant EPRS1 Aggregation in Rab7 Vesicles
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the aggregation phenotype and the resulting block on
      morphological differentiation.
    limitations: >-
      A mouse cell line described in its own source as "a mouse brain neuronal
      stem cell line" used as a model oligodendrocyte, not a human
      oligodendrocyte and not myelinating tissue. It is a transfection
      overexpression system, so aggregation may be favoured by expression level
      rather than by the variant alone, and no human EPRS1 aggregation has been
      shown.
    readouts:
    - name: Myelin web-like structure formation on differentiation
      target: Mutant EPRS1 Aggregation in Rab7 Vesicles
      direction: DECREASED
      interpretation: >-
        Cells expressing R339X fail to form the myelin web-like structures that
        wild-type-expressing cells form, the cellular correlate of the
        differentiation block.
      evidence:
      - reference: PMID:33805425
        reference_title: "Hypomyelinating Leukodystrophy 15 (HLD15)-Associated Mutation of EPRS1 Leads to Its Polymeric Aggregation in Rab7-Positive Vesicle Structures, Inhibiting Oligodendroglial Cell Morphological Differentiation."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Whereas cells expressing the wild-type proteins exhibited phenotypes with myelin web-like structures bearing processes following the induction of differentiation, cells expressing the R339X mutant proteins did not."
        explanation: >-
          Reports the measurement behind this readout.
    evidence:
    - reference: PMID:33805425
      reference_title: "Hypomyelinating Leukodystrophy 15 (HLD15)-Associated Mutation of EPRS1 Leads to Its Polymeric Aggregation in Rab7-Positive Vesicle Structures, Inhibiting Oligodendroglial Cell Morphological Differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we show that the HLD15-associated nonsense mutation of Arg339-to-Ter (R339X) localizes EPRS1 proteins as polymeric aggregates into Rab7-positive vesicle structures in mouse oligodendroglial FBD-102b cells."
      explanation: >-
        Establishes that this model is informative for the aggregation node.
- name: Patient lymphoblastoid cell lines (EPRS1 p.Pro1482Thr)
  experimental_model_type: CELL_LINE
  description: >-
    Immortalized lymphoblastoid lines from the two affected siblings homozygous
    for p.Pro1482Thr, used to measure the m6A-dependent expression defect and
    to test two rescue strategies.
  publication: PMID:38769304
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Impaired m6A-Dependent EPRS1 mRNA Export and Translation
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Patient-derived cells in which the export and translation defect and its
      m6A basis were measured directly.
    limitations: >-
      Lymphoblastoid cells are not oligodendrocytes and do not myelinate, so
      the measurement establishes the molecular lesion but not its consequence
      for myelination.
    readouts:
    - name: EPRS1 protein level
      target: Impaired m6A-Dependent EPRS1 mRNA Export and Translation
      direction: DECREASED
      interpretation: >-
        Markedly reduced EPRS1 protein in patient lines, attributable to the
        dual export/translation defect.
      evidence:
      - reference: PMID:38769304
        reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Patient lymphoblastoid cell lines express markedly reduced EPRS1 protein due to dual defects in nuclear export and cytoplasmic translation of variant EPRS1 mRNA."
        explanation: >-
          Reports the measurement and its stated cause.
  - target: Impaired m6A-Dependent EPRS1 mRNA Export and Translation
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Two independent rescue arms — antisense morpholinos exposing the m6A
      sites, and targeted RNA methylation with METTL3-dCas13b — restored
      expression, which is the therapeutic handle this entry records.
    limitations: >-
      Rescue of expression in a lymphoblastoid line is not rescue of
      myelination, and myelination is developmentally timed: the window may
      have closed before diagnosis. See the HUMAN_MODEL_MISMATCH discussion.
    readouts:
    - name: EPRS1 expression after m6A-directed rescue
      target: Impaired m6A-Dependent EPRS1 mRNA Export and Translation
      direction: RESTORED
      interpretation: >-
        Expression recovered under both rescue arms, supporting m6A site
        accessibility as the causal lesion.
      evidence:
      - reference: PMID:38769304
        reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The defect was rescued by antisense morpholinos predicted to expose m6A sites on target EPRS1 mRNA, or by m6A modification of the mRNA by METTL3-dCas13b, a targeted RNA methylation editor."
        explanation: >-
          Reports both rescue arms and their effect.
variants:
- name: EPRS1 p.Pro1115Arg
  description: >-
    Shared by two of the four originally reported individuals. Reduces EPRS1
    protein amount without disturbing assembly of the multi-tRNA synthetase
    complex, so this variant separates "less enzyme" from "broken complex".
  evidence:
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, immunoblot analyses on protein extracts from fibroblasts of the two affected individuals sharing the p.Pro1115Arg variant showed reduced EPRS amounts."
    explanation: >-
      Reduced protein in patient fibroblasts for this specific variant.
- name: EPRS1 p.Pro1482Thr
  description: >-
    Homozygous in two siblings. Acts at the RNA level, masking accessibility of
    variant-distal m6A sites and impairing nuclear export and translation of
    the EPRS1 transcript. The only HLD15 variant with a demonstrated rescue.
    Falls in the ProRS half of the bifunctional enzyme, the side the published
    series associates with the typical hypomyelinating imaging pattern.
  evidence:
  - reference: PMID:38769304
    reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to current models, the variant does not alter the sequence of m6A target sites, but instead reduces their accessibility for modification."
    explanation: >-
      Defines this variant's distinctive mechanism against the usual
      sequence-altering model.
- name: EPRS1 R339X
  description: >-
    A nonsense variant whose residual product forms polymeric aggregates in
    Rab7-positive vesicles and blocks oligodendroglial differentiation. Its
    source explicitly leaves open whether this is loss of function or toxic
    gain of function, which is why no blanket functional_impact_category is
    asserted for HLD15 as a whole.
  evidence:
  - reference: PMID:33805425
    reference_title: "Hypomyelinating Leukodystrophy 15 (HLD15)-Associated Mutation of EPRS1 Leads to Its Polymeric Aggregation in Rab7-Positive Vesicle Structures, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that the HLD15-associated nonsense mutation of Arg339-to-Ter (R339X) localizes EPRS1 proteins as polymeric aggregates into Rab7-positive vesicle structures in mouse oligodendroglial FBD-102b cells."
    explanation: >-
      Establishes the aggregation behaviour specific to this variant.
- name: EPRS1 c.1743-30_1932del (exon 15 deletion)
  description: >-
    A 220-bp deletion spanning exon 15, in trans with p.Leu1144Val. The first
    exonic deletion reported in EPRS1; the transcript is cleared by
    nonsense-mediated decay, leaving the missense allele to determine the
    phenotype.
  evidence:
  - reference: PMID:41721156
    reference_title: Compound heterozygosity of a novel missense variant and exonic deletion in hypomyelinating leukodystrophy 15.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RT-PCR from lymphoblastoid cells demonstrated exon-15 skipping leading to a frameshift (p.Asn582Serfs*10) and nonsense-mediated decay, leaving predominant expression of the paternally inherited missense allele."
    explanation: >-
      Documents the deletion's consequence and why the missense allele drives
      the phenotype.

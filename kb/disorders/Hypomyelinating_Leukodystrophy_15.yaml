discussions:
- discussion_id: hld15_one_mechanism_or_several
  kind: KNOWLEDGE_GAP
  attaches_to:
  - mechanistic_hypotheses#reduced_translation_capacity
  prompt: >-
    Do all HLD15 variants really converge on reduced translation capacity, or
    do the m6A-accessibility and protein-aggregation routes cause disease by
    mechanisms that are not simply "less EPRS1"?
  rationale: >-
    The R339X aggregation work describes mutant protein actively dysregulating
    Rab7 signalling and blocking oligodendroglial differentiation — a
    gain-of-toxic-function that a pure loss-of-capacity model does not predict.
    If that is right, variants may not be interchangeable, which matters
    directly for whether a translation-directed therapy would help every
    patient. Curated as three separate hypothesis groups rather than one so the
    distinction is not lost.
- discussion_id: hld15_m6a_rescue_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired m6A-Dependent EPRS1 mRNA Export and Translation
  prompt: >-
    Does restoring EPRS1 expression in patient lymphoblastoid cells predict any
    benefit for myelination in the human brain?
  rationale: >-
    PMID:38769304 rescued EPRS1 expression with morpholinos and with
    METTL3-dCas13b, but in lymphoblastoid cell lines — not in oligodendrocytes,
    and not in vivo. Myelination is a developmental window that may have closed
    by the time a patient is diagnosed, so a rescue of expression is not yet a
    rescue of disease. This is a model-fidelity question rather than an absence
    of evidence.
- discussion_id: hld15_no_curated_treatments
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there any disease-modifying treatment for HLD15?
  rationale: >-
    No treatments are curated. Management reported in the sources is
    symptomatic. The m6A-directed rescue above is a cell-culture result, not a
    therapy, and curating it as a treatment would misrepresent its stage.
notes: >-
  The entry name follows the dismech convention set by
  Hypomyelinating_Leukodystrophy_7 and _10 rather than the MONDO label ordering
  ("leukodystrophy, hypomyelinating, 15"); the MONDO label is used verbatim in
  disease_term and retained as a synonym.

  Evidence grading warrants attention. HLD15's clinical phenotype list here
  (optic atrophy, dysphagia, dystonia, ataxia, spasticity) comes from the
  introduction of PMID:33805425, a cell-biology paper reviewing the entity and
  citing other work for those features. Those items are graded OTHER rather
  than HUMAN_CLINICAL because the citing paper reports no patients of its own —
  it is a secondary statement. A curator with access to the primary clinical
  cohorts should regrade them and cite those directly.

  Two negative claims in earlier versions of this entry were too broad and are
  corrected here. There was no top-level references block and no OMIM
  assertion; OMIM 617951 was in the cached text of PMID:33805425 all along. And
  `parents:` named "Hypomyelinating Leukodystrophy", which matches no entry or
  grouping in kb/ — it now uses the descriptive parent the sibling HLD10 entry
  uses.

  Orphanet was not consulted for this entry. `just refresh-orphadata` currently
  fails: the checksums pinned in data/orphadata/MANIFEST.yaml are for the
  2025-12-09 snapshot and Orphadata now serves a 2026-06-23 release at the same
  URLs. Bumping that pin rebuilds all 345 committed ORPHA cache files, which is
  out of scope for a disease curation. Tracked separately.

  There is a second axis of variant non-interchangeability beyond the molecular
  routes modelled in the pathograph. The three hypothesis groups there
  distinguish *how* a variant reduces EPRS1 function; the fourth group
  (domain_dependent_phenotype) distinguishes *which of the enzyme's two
  functions* is lost, since EPRS1 carries separate GluRS and ProRS synthetase
  domains. The published series associates ProRS-domain variants with the
  typical hypomyelinating imaging pattern and GluRS-domain variants with
  seizures, deafness and less obvious hypomyelination. It is recorded as
  EMERGING and graded PARTIAL because the source hedges and rests on eight
  patients; do not read it as an established genotype-phenotype rule.

  The severity spectrum is wider than the original cohort suggested and the
  entry should not be read as describing a uniformly severe infantile disease.
  PMID:41721156 reports a woman whose only childhood signs were slightly
  below-average school performance and mild sports coordination difficulty, who
  worked in an office job and did not develop disabling symptoms until her
  thirties. That case also carries the first EPRS1 exonic deletion, so a single
  detected point variant in a suspected case does not exclude HLD15 without
  structural-variant analysis.

  Note also that PMID:33805425's own experiments are in a mouse oligodendroglial
  cell line (FBD-102b), so its mechanism evidence is IN_VITRO while its clinical
  statements are OTHER. Two different gradings from one paper is correct here
  and is exactly the case CLAUDE.md's "split evidence items so each gets a
  single evidence_source" rule is describing.

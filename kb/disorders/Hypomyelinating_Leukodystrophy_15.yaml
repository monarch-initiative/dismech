name: Hypomyelinating Leukodystrophy 15
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Hypomyelinating leukodystrophy 15 (HLD15) is an autosomal recessive
  hypomyelinating leukodystrophy caused by biallelic variants in EPRS1, which
  encodes the bifunctional cytoplasmic glutamyl-prolyl-aminoacyl-tRNA
  synthetase and is a subunit of the multi-tRNA synthetase complex (MSC).
  Affected children typically have severe global developmental delay with
  hypomyelination on MRI and a thin corpus callosum, commonly with optic
  atrophy, dysphagia, dystonia, ataxia and spasticity. The spectrum is wider
  than that classical presentation: a compound heterozygote reported in 2026
  had only mild intellectual disability and did not come to neurological
  attention until her thirties, so severity ranges from infantile-onset severe
  disease to an adult-onset mild phenotype. HLD15 is one of several leukodystrophies
  caused by cytoplasmic aminoacyl-tRNA synthetase genes — RARS1 causes HLD9 and
  DARS1 causes HBSL — and the field's working hypothesis is that they converge
  on reduced translation capacity in the developing brain. What makes HLD15
  mechanistically interesting is that the *route* to reduced EPRS1 protein
  differs between variants: one operates through impaired m6A-dependent mRNA
  export and translation, another through polymeric aggregation of the mutant
  protein. Both end in insufficient myelination, but they are not the same
  lesion, and one of them has been pharmacologically rescued in patient cells.

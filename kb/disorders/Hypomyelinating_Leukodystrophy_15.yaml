mechanistic_hypotheses:
- hypothesis_group_id: reduced_translation_capacity
  hypothesis_label: Shared reduced-translation-capacity mechanism across aaRS leukodystrophies
  status: EMERGING
  description: >-
    The unifying proposal that cytoplasmic aminoacyl-tRNA synthetase
    leukodystrophies, HLD15 among them, share a final common path of reduced
    translation capacity in the developing brain, whatever the proximate defect
    in the individual enzyme.
  evidence:
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore hypothesized that leukodystrophies caused by mutations in genes encoding cytoplasmic aminoacyl-tRNA synthetases share a common underlying mechanism, such as reduced protein availability, abnormal assembly of the multisynthetase complex, and/or abnormal aminoacylation, all resulting in reduced translation capacity and insufficient myelin deposition in the developing brain."
    explanation: >-
      The authors state this explicitly as a hypothesis, not a demonstrated
      result, which is why the status here is EMERGING.
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The p.Pro1115Arg variation did not affect the assembly of the multisynthetase complex (MSC) as monitored by affinity purification-mass spectrometry."
    explanation: >-
      A negative result against one of the three limbs this hypothesis
      proposes. For at least one variant, MSC assembly is intact, so
      "abnormal assembly of the multisynthetase complex" is not a general
      mechanism — which is why the hypothesis is curated as a three-part
      proposal rather than a settled pathway.
- hypothesis_group_id: m6a_accessibility_defect
  hypothesis_label: Variant-distal m6A site masking reduces EPRS1 expression
  status: EMERGING
  description: >-
    For the p.Pro1482Thr variant, reduced EPRS1 protein arises not from altered
    catalysis but from an RNA-level defect: the variant masks the accessibility
    of variant-distal m6A sites, impairing METTL3-mediated methylation and
    therefore nuclear export and translation of the EPRS1 mRNA.
  evidence:
  - reference: PMID:38769304
    reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to current models, the variant does not alter the sequence of m6A target sites, but instead reduces their accessibility for modification."
    explanation: >-
      States the distinguishing feature of this mechanism against the
      conventional sequence-altering model.
- hypothesis_group_id: mutant_protein_aggregation
  hypothesis_label: Mutant EPRS1 aggregation into Rab7 vesicles blocks oligodendrocyte differentiation
  status: EMERGING
  description: >-
    For the R339X nonsense variant, residual mutant protein forms polymeric
    aggregates in Rab7-positive vesicles, dysregulates Rab7 signalling and
    blocks the morphological differentiation of oligodendroglial cells — a
    gain-of-toxic-function route rather than simple loss of charging activity.
  evidence:
  - reference: PMID:33805425
    reference_title: "Hypomyelinating Leukodystrophy 15 (HLD15)-Associated Mutation of EPRS1 Leads to Its Polymeric Aggregation in Rab7-Positive Vesicle Structures, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that the HLD15-associated nonsense mutation of Arg339-to-Ter (R339X) localizes EPRS1 proteins as polymeric aggregates into Rab7-positive vesicle structures in mouse oligodendroglial FBD-102b cells."
    explanation: >-
      Establishes the aggregation phenotype in an oligodendroglial cell model.
- hypothesis_group_id: domain_dependent_phenotype
  hypothesis_label: Affected EPRS1 domain shapes the clinical phenotype
  status: EMERGING
  description: >-
    EPRS1 is bifunctional, carrying separate glutamyl-tRNA synthetase (GluRS)
    and prolyl-tRNA synthetase (ProRS) domains. The published series suggests
    the two are not clinically equivalent: ProRS-domain variants track with the
    typical hypomyelinating imaging pattern, while GluRS-domain variants track
    with seizures, deafness and less obvious hypomyelination. This is an axis of
    variant non-interchangeability independent of the molecular routes above —
    those distinguish how a variant lowers EPRS1 function, this distinguishes
    which of the enzyme's two functions is lost.
  evidence:
  - reference: PMID:41721156
    reference_title: Compound heterozygosity of a novel missense variant and exonic deletion in hypomyelinating leukodystrophy 15.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "ProRS-domain variants often show the typical HLD15 imaging pattern, whereas GluRS-domain variants may be associated with seizures, deafness, and less obvious hypomyelination, though the number of reported cases is limited."
    explanation: >-
      Graded PARTIAL and OTHER: the authors hedge explicitly ("may be
      associated", "though the number of reported cases is limited") and are
      summarizing eight published patients rather than testing the association.
      It is a pattern worth recording, not an established genotype-phenotype
      rule.
pathophysiology:
- name: Biallelic EPRS1 Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic variants in EPRS1. The variants are not equivalent: they act
    through different proximate routes, which is why this node branches rather
    than asserting a single consequence. No blanket functional_impact_category
    is set here — PMID:33805425 explicitly leaves open whether R339X acts by
    loss of function or by toxic gain of function, so the category is recorded
    per variant on the nodes below.
  genetic_context:
    gene:
      preferred_term: EPRS1
      term:
        id: hgnc:3418
        label: EPRS1
  downstream:
  - target: Impaired m6A-Dependent EPRS1 mRNA Export and Translation
    description: >-
      For p.Pro1482Thr, the variant masks m6A site accessibility — the
      proximate lesion is at the RNA level and is upstream of, not downstream
      of, the fall in protein.
    hypothesis_groups:
    - m6a_accessibility_defect
  - target: Mutant EPRS1 Aggregation in Rab7 Vesicles
    description: >-
      For R339X, residual mutant protein mislocalizes and aggregates — a
      separate branch from the loss-of-protein route, not a consequence of it.
    hypothesis_groups:
    - mutant_protein_aggregation
  evidence:
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, immunoblot analyses on protein extracts from fibroblasts of the two affected individuals sharing the p.Pro1115Arg variant showed reduced EPRS amounts."
    explanation: >-
      Direct measurement of reduced EPRS1 protein in patient fibroblasts.
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EPRS activity was reduced in one affected individual's lymphoblasts and in a purified recombinant protein model."
    explanation: >-
      Reduced enzymatic activity, measured in patient cells and in recombinant
      protein, complements the reduced protein amount.
- name: Impaired m6A-Dependent EPRS1 mRNA Export and Translation
  biological_scale: MOLECULAR
  description: >-
    The p.Pro1482Thr variant reduces METTL3-mediated m6A writing and reading by
    YTHDC1 and YTHDF1/3, producing dual defects in nuclear export and
    cytoplasmic translation of the EPRS1 transcript. This is a rescuable lesion:
    antisense morpholinos exposing the m6A sites, or targeted RNA methylation
    with METTL3-dCas13b, restored expression in patient cells.
  evidence:
  - reference: PMID:38769304
    reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient lymphoblastoid cell lines express markedly reduced EPRS1 protein due to dual defects in nuclear export and cytoplasmic translation of variant EPRS1 mRNA."
    explanation: >-
      Establishes the export and translation defect in patient-derived cells.
  - reference: PMID:38769304
    reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The defect was rescued by antisense morpholinos predicted to expose m6A sites on target EPRS1 mRNA, or by m6A modification of the mRNA by METTL3-dCas13b, a targeted RNA methylation editor."
    explanation: >-
      Rescue in both directions supports the causal role of m6A site
      accessibility, and identifies a therapeutic handle.
  downstream:
  - target: Reduced EPRS1 Protein
    description: >-
      Defective export and translation of the transcript is why the protein is
      reduced — the causal direction PMID:38769304 reports.
    hypothesis_groups:
    - m6a_accessibility_defect
- name: Reduced EPRS1 Protein
  biological_scale: MOLECULAR
  description: >-
    Reduced amount and reduced specific activity of the EPRS1 enzyme, measured
    in patient fibroblasts, lymphoblasts and recombinant protein. This is the
    convergence point of the loss-of-protein routes; the aggregation branch
    reaches myelination without passing through it.
  genetic_context:
    gene:
      preferred_term: EPRS1
      term:
        id: hgnc:3418
        label: EPRS1
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:38769304
    reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient lymphoblastoid cell lines express markedly reduced EPRS1 protein due to dual defects in nuclear export and cytoplasmic translation of variant EPRS1 mRNA."
    explanation: >-
      States both the reduction and its cause, in that order.
  - reference: PMID:38769304
    reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For nearly all EPRS1 and RARS1 variants, the relevant aminoacyl charging activity in patient fibroblasts is reduced by about 30–50% compared to healthy controls"
    explanation: >-
      Quantifies the functional deficit across the EPRS1 and RARS1 variant sets
      — roughly a 30-50% reduction in charging activity in patient fibroblasts,
      which is the magnitude this node asserts.
  downstream:
  - target: Reduced Translation Capacity in Developing Brain
    description: >-
      Less EPRS1 protein lowers aminoacylation capacity.
    hypothesis_groups:
    - reduced_translation_capacity
- name: Mutant EPRS1 Aggregation in Rab7 Vesicles
  biological_scale: CELLULAR
  description: >-
    R339X mutant EPRS1 forms polymeric aggregates in Rab7-positive late
    endosomal vesicles and upregulates Rab7 regulatory signalling, blocking the
    morphological differentiation that oligodendroglial cells require to form
    myelin sheets.
  cell_types:
  - preferred_term: Oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:33805425
    reference_title: "Hypomyelinating Leukodystrophy 15 (HLD15)-Associated Mutation of EPRS1 Leads to Its Polymeric Aggregation in Rab7-Positive Vesicle Structures, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whereas cells expressing the wild-type proteins exhibited phenotypes with myelin web-like structures bearing processes following the induction of differentiation, cells expressing the R339X mutant proteins did not."
    explanation: >-
      Links the aggregation phenotype to failed morphological differentiation,
      the cellular step that precedes myelination.
  downstream:
  - target: Insufficient CNS Myelination
    description: >-
      Oligodendroglial cells that fail to differentiate cannot deposit myelin.
- name: Reduced Translation Capacity in Developing Brain
  biological_scale: CELLULAR
  description: >-
    Lowered aminoacylation capacity is proposed to limit the high protein
    synthesis demand of active myelination. This node is the hypothesized
    convergence point of the aaRS leukodystrophies and has not been measured
    directly in HLD15 brain tissue.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  evidence:
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore hypothesized that leukodystrophies caused by mutations in genes encoding cytoplasmic aminoacyl-tRNA synthetases share a common underlying mechanism, such as reduced protein availability, abnormal assembly of the multisynthetase complex, and/or abnormal aminoacylation, all resulting in reduced translation capacity and insufficient myelin deposition in the developing brain."
    explanation: >-
      Graded PARTIAL because the sentence is explicitly framed as a hypothesis
      the authors advance, not as a result they demonstrate.
  downstream:
  - target: Insufficient CNS Myelination
    description: >-
      Reduced translational output during the myelination window yields
      insufficient myelin deposition.
  - target: phenotypes#Global Developmental Delay
    description: >-

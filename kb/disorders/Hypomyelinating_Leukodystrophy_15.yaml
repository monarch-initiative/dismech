inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic EPRS1 variants are required; reported families include compound
    heterozygotes and consanguineous pedigrees with homozygous variants whose
    unaffected parents are heterozygous carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on four unrelated affected individuals with hypomyelination and bi-allelic pathogenic variants in EPRS, the gene encoding cytoplasmic glutamyl-prolyl-aminoacyl-tRNA synthetase."
    explanation: >-
      Biallelic variants in four unrelated individuals establish recessive
      inheritance.
mechanistic_hypotheses:
- hypothesis_group_id: reduced_translation_capacity
  hypothesis_label: Shared reduced-translation-capacity mechanism across aaRS leukodystrophies
  status: EMERGING
  description: >-
    The unifying proposal that cytoplasmic aminoacyl-tRNA synthetase
    leukodystrophies, HLD15 among them, share a final common path of reduced
    translation capacity in the developing brain, whatever the proximate defect
    in the individual enzyme.
  evidence:
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore hypothesized that leukodystrophies caused by mutations in genes encoding cytoplasmic aminoacyl-tRNA synthetases share a common underlying mechanism, such as reduced protein availability, abnormal assembly of the multisynthetase complex, and/or abnormal aminoacylation, all resulting in reduced translation capacity and insufficient myelin deposition in the developing brain."
    explanation: >-
      The authors state this explicitly as a hypothesis, not a demonstrated
      result, which is why the status here is EMERGING.
- hypothesis_group_id: m6a_accessibility_defect
  hypothesis_label: Variant-distal m6A site masking reduces EPRS1 expression
  status: EMERGING
  description: >-
    For the p.Pro1482Thr variant, reduced EPRS1 protein arises not from altered
    catalysis but from an RNA-level defect: the variant masks the accessibility
    of variant-distal m6A sites, impairing METTL3-mediated methylation and
    therefore nuclear export and translation of the EPRS1 mRNA.
  evidence:
  - reference: PMID:38769304
    reference_title: "Homozygous EPRS1 missense variant causing hypomyelinating leukodystrophy-15 alters variant-distal mRNA m6A site accessibility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to current models, the variant does not alter the sequence of m6A target sites, but instead reduces their accessibility for modification."
    explanation: >-
      States the distinguishing feature of this mechanism against the
      conventional sequence-altering model.
- hypothesis_group_id: mutant_protein_aggregation
  hypothesis_label: Mutant EPRS1 aggregation into Rab7 vesicles blocks oligodendrocyte differentiation
  status: EMERGING
  description: >-
    For the R339X nonsense variant, residual mutant protein forms polymeric
    aggregates in Rab7-positive vesicles, dysregulates Rab7 signalling and
    blocks the morphological differentiation of oligodendroglial cells — a
    gain-of-toxic-function route rather than simple loss of charging activity.
  evidence:
  - reference: PMID:33805425
    reference_title: "Hypomyelinating Leukodystrophy 15 (HLD15)-Associated Mutation of EPRS1 Leads to Its Polymeric Aggregation in Rab7-Positive Vesicle Structures, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that the HLD15-associated nonsense mutation of Arg339-to-Ter (R339X) localizes EPRS1 proteins as polymeric aggregates into Rab7-positive vesicle structures in mouse oligodendroglial FBD-102b cells."
    explanation: >-
      Establishes the aggregation phenotype in an oligodendroglial cell model.
pathophysiology:
- name: Biallelic EPRS1 Variants Reduce EPRS1 Protein
  biological_scale: MOLECULAR
  description: >-
    All reported HLD15 variants converge on reduced functional EPRS1, but by
    different proximate routes — reduced protein amount, reduced specific
    charging activity, impaired m6A-dependent mRNA handling, or aggregation of
    residual mutant protein.

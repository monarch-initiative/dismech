- name: Secondary Cellular NAD+ Deficiency
  description: >-
    Patient fibroblasts, leukocytes and immortalized blood stem cells are
    NAD+ depleted. Supplementing glutamine, nicotinamide or nicotinate
    normalized NAD+ in fibroblasts, and four weeks of glutamine raised
    leukocyte NAD+ in the patient. The necrolytic, pellagra-like erythema seen
    during very low glutamine periods is the plausible clinical expression.

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients were homozygous, all of them born to consanguineous
    parents in the first series, and parents were heterozygous and unaffected.
    The dominant GLUL disease (DEE116) arises from a different allele class and
    is a separate entry.
  evidence:
  - reference: PMID:27775558
    reference_title: Minireview on Glutamine Synthetase Deficiency, an Ultra-Rare Inborn Error of Amino Acid Biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Parental heterozygosity suggested an autosomal recessive mode of inheritance"
    explanation: Unaffected heterozygous parents of homozygous patients support recessive inheritance.
  - reference: PMID:32888207
    reference_title: Homozygous GLUL deletion is embryonically viable and leads to glutamine synthetase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "GS deficiency, caused by pathogenic variants in the glutamate-ammonia ligase (GLUL) gene, is a rare autosomal recessive inborn error of metabolism"
    explanation: Restates the recessive mode of inheritance.
genetic:
- name: GLUL
  gene_term:
    preferred_term: GLUL
    term:
      id: hgnc:4341
      label: GLUL
  relationship_type: CAUSATIVE
  notes: >-
    Reported alleles are homozygous missense variants at catalytic-site
    arginines and one homozygous whole-gene deletion that also removed RNASEL.
    Severity tracks residual activity. Heterozygous start-loss and 5' UTR
    splice variants cause the separate dominant disorder DEE116 by stabilizing
    the enzyme, the opposite effect.
  variants:
  - name: p.Arg324Cys (c.970C>T)
    description: >-
      Homozygous in the first index patient, who died on day 2. The mutant
      retained about 12% of wild-type activity in immortalized lymphocytes. Arg324
      forms a salt bridge with the ATP-derived beta-phosphate, so its loss
      impairs ATP binding.
    evidence:
    - reference: PMID:27775558
      reference_title: Minireview on Glutamine Synthetase Deficiency, an Ultra-Rare Inborn Error of Amino Acid Biosynthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "mutant p.Arg324Cys exhibited 12% of the wild-type enzyme activity when measured in immortalized lymphocytes"
      explanation: Gives the measured residual activity of the R324C enzyme.
  - name: p.Arg341Cys (c.1021C>T)
    description: >-
      Homozygous in the second index patient, who died at four weeks. Activity
      in transfected COS7 cells was about 58% of wild type; Arg341 is thought to
      be needed for the helix closure that allows glutamate binding.
    evidence:
    - reference: PMID:27775558
      reference_title: Minireview on Glutamine Synthetase Deficiency, an Ultra-Rare Inborn Error of Amino Acid Biosynthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "its activity measured in transfected COS7 cells was significantly reduced (to ~58% of the wild-type)"
      explanation: Gives the measured residual activity of the R341C enzyme.
  - name: p.Arg324Ser (c.970C>A)
    description: >-
      Homozygous in the longest-surviving patient (six years). Molecular
      simulation suggests water-mediated contacts to ATP partially offset the
      lost salt bridge, consistent with higher residual activity than R324C.
    evidence:
    - reference: PMID:26836257
      reference_title: Molecular Mechanisms of Glutamine Synthetase Mutations that Lead to Clinically Relevant Pathologies.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "As to R324S, indirect, water-mediated interactions reduce this effect, which may explain the suggested higher GS residual activity."
      explanation: Simulation offers a structural reason for the milder R324S course.
  - name: p.Arg41Cys (c.121C>T)
    description: >-
      Homozygous in a girl with seizures from five months, microcephaly and
      hypotonia, mild hyperammonemia and plasma glutamine near the normal
      range.
    evidence:
    - reference: PMID:30440076
      reference_title: "A Very Rare Etiology of Hypotonia and Seizures: Congenital Glutamine Synthetase Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing (WES) revealed a homozygous c.121C > T (p.R41C) (p.Arg41Cys) pathogenic variant of the GLUL gene."
      explanation: Identifies the fourth reported allele.
  - name: Homozygous GLUL whole-gene deletion
    description: >-
      Diagnosed prenatally; the deletion also removed RNASEL and was associated
      with immune dysfunction in the fetus. It shows total absence of GLUL is
      compatible with development beyond the embryonic period in humans.
    evidence:
    - reference: PMID:32888207
      reference_title: Homozygous GLUL deletion is embryonically viable and leads to glutamine synthetase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This case demonstrates that total absence of the GLUL gene in humans is viable beyond the embryonic period, despite the early embryonic lethality found in GLUL animal models."
      explanation: Establishes the null allele and its viability in utero.
  evidence:
  - reference: PMID:16267323
    reference_title: Congenital glutamine deficiency with glutamine synthetase mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each infant had a homozygous mutation in the glutamine synthetase gene (R324C and R341C)."
    explanation: The founding report identifies homozygous GLUL variants in both index patients.
  - reference: PMID:16267323
    reference_title: Congenital glutamine deficiency with glutamine synthetase mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these mutations are associated with reduced glutamine synthetase activity"
    explanation: Cell expression studies link the variants to reduced enzyme activity.
mechanistic_hypotheses:
- hypothesis_group_id: glutamine_starvation_model
  hypothesis_label: Systemic and cerebral glutamine starvation
  status: CANONICAL
  description: >-
    Loss of the only glutamine-synthesizing enzyme leaves the fetus and infant
    short of glutamine. Fetal brain development is starved of a substrate it
    needs for proliferation and differentiation, and postnatally the
    astrocyte-neuron glutamine-glutamate-GABA cycle cannot be replenished.
    Astrocyte-specific Glul knockout mice die of a 14-fold fall in cortical
    glutamine with only a 1.6-fold rise in ammonia, which places glutamine
    lack rather than ammonia at the centre of the brain phenotype.
  evidence:
  - reference: PMID:20140959
    reference_title: Glutamine synthetase deficiency in murine astrocytes results in neonatal death.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings identify the dramatic decrease in (cortical) glutamine concentration as the primary cause of brain dysfunction in GS-KO/A mice."
    explanation: The astrocyte knockout separates glutamine loss from ammonia excess and implicates the former.
  - reference: PMID:22830360
    reference_title: Glutamine supplementation in a child with inherited GS deficiency improves the clinical status and partially corrects the peripheral and central amino acid imbalance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The EEG showed clear improvement and spectroscopy revealed increasing concentrations of glutamine and glutamate in brain tissue."
    explanation: Replacing the missing product improved brain function in a patient, consistent with product deficiency driving the encephalopathy.
- hypothesis_group_id: hyperammonemia_contribution_model
  hypothesis_label: Chronic hyperammonemia as a contributing neurotoxin
  status: ALTERNATIVE
  description: >-
    Loss of the high-affinity ammonia-clearing step causes chronic moderate
    hyperammonemia, which is neurotoxic through oxidative stress, energy
    failure and disturbed astrocytic potassium buffering. This arm is real but
    not sufficient: mice lacking only hepatic glutamine synthetase are
    hyperammonemic with behavioral and synaptic-plasticity deficits and no
    malformation. It is therefore treated as contributing to the postnatal
    encephalopathy rather than explaining the prenatal brain dysgenesis.
  evidence:
  - reference: PMID:28067279
    reference_title: Impaired novelty acquisition and synaptic plasticity in congenital hyperammonemia caused by hepatic glutamine synthetase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "inborn systemic hyperammonemia resulted in significant deficits in novelty acquisition and disturbed synaptic plasticity in corticostriatal and hippocampal pathways"
    explanation: Hyperammonemia from hepatic GS loss alone impairs brain function in mice.
  - reference: PMID:27775558
    reference_title: Minireview on Glutamine Synthetase Deficiency, an Ultra-Rare Inborn Error of Amino Acid Biosynthesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "a general impairment of astrocyte function due to glutamine deficiency and hyperammonemia in the patients may lead to a failure of the regulation of neuronal homeostasis and disturbance of the excitation-inhibition balance"
    explanation: The disease-specific review treats ammonia and glutamine lack as joint, not alternative, causes.
- hypothesis_group_id: secondary_nad_deficiency_model
  hypothesis_label: Secondary NAD+ deficiency from glutamine lack
  status: EMERGING
  description: >-
    Glutamine is the amide-nitrogen donor for NAD+ synthesis from nicotinate.
    Patient fibroblasts, leukocytes and immortalized blood stem cells are NAD+
    depleted and are rescued by glutamine or nicotinamide. The necrolytic,
    pellagra-like erythema seen in two patients during very low glutamine
    periods is the clinical sign this would predict. The contribution to the
    neurological phenotype is unmeasured.
  evidence:
  - reference: PMID:25896882
    reference_title: Secondary NAD+ deficiency in the inherited defect of glutamine synthetase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "congenital GS deficiency is associated with NAD(+) depletion in fibroblasts, leukocytes and PBSC, which may contribute to the severe clinical phenotype of the disease"
    explanation: Measures NAD+ depletion in patient cells and states its role as a possibility.
pathophysiology:
- name: Biallelic GLUL Loss of Function
  description: >-
    Biallelic GLUL variants reduce or abolish glutamine synthetase catalytic
    activity. Missense variants hit conserved arginines in the active site that
    bind ATP (Arg324) or are needed for glutamate binding (Arg341); residual
    activity differs between alleles and tracks survival. Mutant protein is
    over-expressed in patient cells, a compensatory response that does not
    restore glutamine.
  mechanism_confidence: ESTABLISHED
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GLUL
    term:
      id: hgnc:4341
      label: GLUL
  molecular_functions:
  - preferred_term: glutamine synthetase activity
    term:
      id: GO:0004356
      label: glutamine synthetase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:16763901
    reference_title: "Inborn error of amino acid synthesis: human glutamine synthetase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enzymatic investigations confirmed that these mutations lead to a severely reduced glutamine synthetase activity"
    explanation: Enzyme studies confirm loss of catalytic activity.
  - reference: PMID:26836257
    reference_title: Molecular Mechanisms of Glutamine Synthetase Mutations that Lead to Clinically Relevant Pathologies.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The R324S and R324C mutations deteriorate GS catalytic activity due to loss of direct interactions with ATP."
    explanation: Structural simulation explains the catalytic defect of the Arg324 alleles.
  downstream:
  - target: Deficient Endogenous Glutamine Synthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - glutamine_starvation_model
    - hyperammonemia_contribution_model
    description: Loss of enzyme activity directly lowers glutamine production from glutamate and ammonia.
    evidence:
    - reference: PMID:22830360
      reference_title: Glutamine supplementation in a child with inherited GS deficiency improves the clinical status and partially corrects the peripheral and central amino acid imbalance.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "The synthesis of glutamine from GS is the only known reaction for endogenous glutamine production in mammals"
      explanation: With no alternative pathway, GS loss directly lowers endogenous glutamine synthesis.
- name: Deficient Endogenous Glutamine Synthesis
  description: >-
    Without functional glutamine synthetase the body cannot condense glutamate
    with ammonia. Dietary glutamine does not make up the shortfall, because in
    healthy people it is consumed by enterocytes on absorption and does not
    reach the systemic pool. The same reaction is the high-affinity ammonia
    sink, so one lesion removes both a product and a detoxification step.
  mechanism_confidence: ESTABLISHED
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: L-glutamine biosynthetic process
    term:
      id: GO:1901704
      label: L-glutamine biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:27775558
    reference_title: Minireview on Glutamine Synthetase Deficiency, an Ultra-Rare Inborn Error of Amino Acid Biosynthesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Glutamine from nutritional sources does not contribute to the systemic glutamine pool in healthy individuals, as it is mainly metabolized directly upon absorption in the enterocytes of the small intestine"
    explanation: Explains why diet does not compensate for lost synthesis.
  downstream:
  - target: Systemic Glutamine Deficiency
    causal_link_type: DIRECT
    hypothesis_groups:
    - glutamine_starvation_model
    description: Reduced synthesis empties the systemic glutamine pool.
    evidence:
    - reference: PMID:27775558

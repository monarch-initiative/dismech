- name: Glutamine Starvation of the Developing Brain
  description: >-
    Brain malformation is visible before birth in the severe genotypes:
    enlarged ventricles, delayed or near-absent gyration, immature white matter
    and periventricular cysts. Glutamine is needed for proliferation of fetal
    cells and for neural differentiation, and GS is expressed in early fetal
    life. In mice, Glul knockout is lethal at embryonic day 3.5, and loss
    restricted to astrocytes is lethal three days after birth, so the human
    disease is viable only through residual activity or maternal and
    placental supply.
  mechanism_confidence: PROVISIONAL
  biological_scale: TISSUE

- name: Impaired High-Affinity Ammonia Clearance
  description: >-
    Ammonia escaping the periportal urea cycle is normally captured by
    glutamine synthetase in perivenous (centrilobular) hepatocytes, and
    ammonia reaching the brain is captured by astrocytic glutamine synthetase.
    Glutamine synthetase has a far lower Km for ammonia than the urea-cycle
    enzymes, so it is the high-affinity, low-capacity half of ammonia
    detoxification; its loss produces chronic moderate rather than
    catastrophic hyperammonemia.
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: perivenous hepatocyte
    term:
      id: CL:0019029
      label: centrilobular region hepatocyte
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte

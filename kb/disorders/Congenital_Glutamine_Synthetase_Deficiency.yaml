treatments:
- name: Enteral glutamine supplementation
  action_category: THERAPEUTIC
  description: >-
    Graded L-glutamine by gastrostomy or parenteral route, increased from 17
    to 1020 mg/kg/day over four weeks in one patient, normalized plasma
    glutamine, raised CSF and brain glutamine, improved alertness and the EEG
    and raised leukocyte NAD+, without worsening hyperammonemia. MRI did not
    change. Dosing should start low with ammonia monitoring.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

prevalence:
- population: Worldwide, published case reports
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five molecularly confirmed patients were found in the literature searched
    for this entry: three homozygous for missense variants (p.Arg324Cys,
    p.Arg341Cys, p.Arg324Ser), a fourth homozygous for p.Arg41Cys, and a fifth
    with a homozygous whole-gene deletion. The minireview argues the disorder
    is underdiagnosed because low amino acid values attract less attention than
    raised ones.
  evidence:
  - reference: PMID:30440076
    reference_title: "A Very Rare Etiology of Hypotonia and Seizures: Congenital Glutamine Synthetase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease was first described in 2005 and only three patients have been reported to date. We report a fourth patient"
    explanation: Gives the published case count at the time of the fourth report.
  - reference: PMID:32888207
    reference_title: Homozygous GLUL deletion is embryonically viable and leads to glutamine synthetase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The four cases reported thus far were caused by homozygous GLUL missense variants. We report a case of GS deficiency caused by homozygous GLUL gene deletion"
    explanation: Adds a fifth patient to the four earlier missense cases.
  - reference: PMID:27775558
    reference_title: Minireview on Glutamine Synthetase Deficiency, an Ultra-Rare Inborn Error of Amino Acid Biosynthesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "this disorder is possibly underdiagnosed, since decreased concentrations of metabolites do not receive the attention they deserve"
    explanation: The case count is likely an undercount of true occurrence.

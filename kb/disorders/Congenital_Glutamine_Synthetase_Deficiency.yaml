      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "the small amount of glutamine that is still produced by the mutant GS protein is probably immediately consumed by several metabolic pathways, resulting in chronic systemic glutamine depletion"
      explanation: Links residual synthesis to chronic systemic depletion.
  - target: Impaired High-Affinity Ammonia Clearance
    causal_link_type: DIRECT
    hypothesis_groups:
    - hyperammonemia_contribution_model
    description: The glutamine synthetase reaction is also the high-affinity ammonia-removal step, so its loss leaves ammonia uncleared.
    evidence:
    - reference: PMID:27775558
      reference_title: Minireview on Glutamine Synthetase Deficiency, an Ultra-Rare Inborn Error of Amino Acid Biosynthesis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "hyperammonemia in these patients results from the insufficient capacity of the perivenous cells to incorporate ammonia into glutamine"
      explanation: Attributes the patients' hyperammonemia to failure of the GS ammonia-incorporation step.
- name: Systemic Glutamine Deficiency

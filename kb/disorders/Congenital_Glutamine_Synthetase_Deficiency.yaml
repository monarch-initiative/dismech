- name: Astrocyte-Neuron Glutamine-Glutamate-GABA Cycle Failure
  description: >-
    Astrocytic glutamine synthetase converts glutamate taken up from synapses
    into glutamine, which neurons use to remake glutamate and GABA. With the
    enzyme impaired, brain glutamine is very low and the neurotransmitter
    pools cannot be replenished; glutamate is not raised in plasma or CSF and
    was slightly low on spectroscopy, so excitotoxic glutamate excess is not
    the documented mechanism. Cortex-specific Glul knockout mice show low
    glutamate, glutamine and GABA, astrogliosis and then spontaneous seizures.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  chemical_entities:
  - preferred_term: L-glutamine
    term:
      id: CHEBI:18050
      label: L-glutamine
    modifier: DECREASED
  - preferred_term: gamma-aminobutyric acid
    term:
      id: CHEBI:16865
      label: gamma-aminobutyric acid
    modifier: DECREASED
  evidence:
  - reference: PMID:30053506
    reference_title: Selective deletion of glutamine synthetase in the mouse cerebral cortex induces glial dysfunction and vascular impairment that precede epilepsy and neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There were reductions in tissue levels of aspartate, glutamate, glutamine and GABA"
    explanation: Cortical Glul loss lowers both glutamine and the neurotransmitter pools it feeds.
  - reference: PMID:27775558
    reference_title: Minireview on Glutamine Synthetase Deficiency, an Ultra-Rare Inborn Error of Amino Acid Biosynthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the concentrations of glutamate were not elevated in the plasma or CSF of patients with GS deficiency, and were even slightly decreased on MRS in patient 3"
    explanation: Patient data argue against glutamate excitotoxicity as the seizure mechanism.
  downstream:
  - target: Reduced brain glutamine level by MRS
    causal_link_type: DIRECT
    description: Low tissue glutamine is visible on brain spectroscopy.
    evidence:

animal_models:
- name: Glul null mouse
  species: Mouse
  genotype: Glul LacZ/LacZ (whole-body null)
  publication: PMID:17557305
  description: >-
    Homozygous null embryos die at embryonic day 3.5, so the model shows the
    developmental requirement for glutamine synthetase but cannot model the
    postnatal human disease.
  modeled_mechanisms:
  - target: Glutamine Starvation of the Developing Brain
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Lethality precedes brain development, so the model shows the requirement
      for GS in early embryogenesis but not the human cortical malformation.
      Human null fetuses survive to late gestation.
    evidence:
    - reference: PMID:17557305
      reference_title: Glutamine synthetase is essential in early mouse embryogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "GS(LacZ/LacZ) mice die at ED3.5, demonstrating GS is essential in early embryogenesis"
      explanation: Establishes the developmental requirement the human disease reflects.
- name: Astrocyte-specific Glul knockout mouse (GS-KO/A)
  species: Mouse
  genotype: hGFAP-Cre; Glul fl/fl or fl/lacZ
  publication: PMID:20140959
  description: >-
    Prenatal deletion in astrocytes gives mice born without malformation that
    fail to feed and die on postnatal day 3, with a 14-fold fall in cortical
    glutamine and only a 1.6-fold rise in cortical ammonia.
  modeled_mechanisms:
  - target: Astrocyte-Neuron Glutamine-Glutamate-GABA Cycle Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Deletion is late in fetal life and confined to astrocytes, so no
      malformation develops and peripheral hyperammonemia is absent.
    evidence:
    - reference: PMID:20140959
      reference_title: Glutamine synthetase deficiency in murine astrocytes results in neonatal death.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "GS deficiency caused a 14-fold decline in cortical glutamine and a sevenfold decline in cortical alanine concentration"
      explanation: Shows the cortical glutamine collapse from astrocytic GS loss.
- name: Cortex-specific Glul knockout mouse
  species: Mouse
  genotype: Glul deleted in hippocampus and neocortex
  publication: PMID:30053506
  description: >-
    Mice are normal until postnatal week 3, then develop astrogliosis,
    progressive neurodegeneration and spontaneous seizures that increase with
    age.
  modeled_mechanisms:
  - target: Excitation-Inhibition Imbalance from Astrocyte Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Regional and postnatal loss without systemic glutamine deficiency or
      hyperammonemia; seizures begin in adulthood rather than the neonatal
      period.
    evidence:
    - reference: PMID:30053506
      reference_title: Selective deletion of glutamine synthetase in the mouse cerebral cortex induces glial dysfunction and vascular impairment that precede epilepsy and neurodegeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Adult Glul-deficient mice developed progressive neurodegeneration and spontaneous seizures which increased in frequency with age."
      explanation: Cortical GS loss is sufficient for epilepsy.
- name: Liver-specific Glul knockout mouse (GS-KO/liver)
  species: Mouse
  genotype: Glul deleted in hepatocytes
  publication: PMID:27641632
  description: >-
    Isolates the hepatic ammonia-clearing arm: mild hyperammonemia and
    hypoglutaminemia, with deficits in novelty acquisition and synaptic
    plasticity but no brain malformation.
  modeled_mechanisms:
  - target: Impaired High-Affinity Ammonia Clearance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Only the hepatic arm is removed; astrocytic GS is intact, so the brain
      ammonia-clearing deficit of the human disease is not reproduced.
    evidence:
    - reference: PMID:27641632
      reference_title: Pivotal role of glutamine synthetase in ammonia detoxification.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Elimination of hepatic GS expression in mice causes only mild hyperammonemia and hypoglutaminemia"
      explanation: Hepatic GS loss reproduces the moderate hyperammonemia of the human disease.
discussions:
- discussion_id: glul_residual_activity_and_survival
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#GLUL
  - pathophysiology#Biallelic GLUL Loss of Function
  prompt: >-
    How much residual glutamine synthetase activity separates neonatal death
    from survival, and is there a threshold below which glutamine
    supplementation from birth cannot rescue brain development?
  rationale: >-
    The reported genotypes span a whole-gene deletion, R324C at about 12%
    activity (death on day 2), R341C at about 58% in COS7 cells (death at four
    weeks), R324S (six years) and R41C (milder). The R341C figure does not fit
    a simple activity-severity ranking, and the assays used different cell
    systems, so activity has never been measured on one scale.
- discussion_id: glul_ammonia_versus_glutamine_lack
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#hyperammonemia_contribution_model
  - pathophysiology#Astrocyte-Neuron Glutamine-Glutamate-GABA Cycle Failure
  prompt: >-
    Mouse models separate glutamine loss from ammonia excess, but no patient
    has; does the human encephalopathy follow the astrocyte-knockout pattern,
    where glutamine lack dominates, or does chronic hyperammonemia contribute
    materially?
  rationale: >-
    The astrocyte knockout points to glutamine lack and the liver knockout
    shows ammonia alone causes milder cognitive deficits. Patients carry both
    defects, and one trial showed supplementation improved the EEG without
    lowering ammonia, which favours glutamine but comes from one child.
review_notes: >-
  Recessive loss-of-function disease only. The dominant GLUL start-loss
  disorder is curated separately as
  Developmental_And_Epileptic_Encephalopathy_116 and the two must not be
  merged. No GeneReviews chapter was found. Orphanet (ORPHA:71278) is not
  cited because the Orphadata bulk file was not available to build its cache.
  The multiorgan failure that killed both index infants is described in prose
  only; an HPO search for "multiple organ" and "organ failure" returned no
  term.

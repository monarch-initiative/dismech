    snippet: "the most common intrinsic defects are being recognized in the interstitial cells of Cajal (ICC-opathy) and with immune infiltration and neuronal changes (intrinsic neuropathic gastroparesis)"
    explanation: Review framing idiopathic and diabetic gastroparesis as intrinsic ICC and neuropathic disorders of the gastric wall.
  downstream:

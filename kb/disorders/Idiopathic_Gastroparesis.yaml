- name: Delayed Gastric Emptying
  description: >-
    Objectively delayed emptying of a solid meal without mechanical
    obstruction, defined on 4-hour scintigraphy or a gastric emptying breath
    test. Retention at 4 hours is on average lower in idiopathic than in
    diabetic, postsurgical or connective tissue gastroparesis, and emptying
    status is labile on retesting.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: gastric emptying
    modifier: DECREASED
    term:
      id: GO:0035483
      label: gastric emptying
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  evidence:
  - reference: PMID:39674226
    reference_title: "Rome Foundation and international neurogastroenterology and motility societies' consensus on idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis requires the presence of these symptoms alongside delayed gastric emptying, measured by a 4 h scintigraphy or gastric emptying breath test of a mixed composition meal in the absence of mechanical obstruction."
    explanation: International consensus requires objectively delayed emptying for the diagnosis.
  - reference: PMID:36730846
    reference_title: "Atypical Causes of Gastroparesis: Prevalence, Gastric Emptying, and Clinical Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gastric retention at 4 hours was significantly greater in patients with diabetic (39.3±25.7% P <0.001), postsurgical (41.3±24.0% P =0.002), and connective tissue gastroparesis (37.8±20.0% P =0.049) compared with patients with idiopathic gastroparesis (25.5±17.6%)."
    explanation: The degree of emptying delay is on average milder in idiopathic gastroparesis.
  downstream:
  - target: Delayed gastric emptying on scintigraphy
    causal_link_type: DIRECT
    hypothesis_groups:
    - delayed_emptying_symptom_model
  - target: Vomiting
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - delayed_emptying_symptom_model
    description: >-
      Severe emptying delay is associated with worse vomiting in idiopathic
      gastroparesis; the association is modest and prokinetic acceleration of
      emptying does not predict symptom relief.
    evidence:
    - reference: PMID:20965184
      reference_title: "Clinical features of idiopathic gastroparesis vary with sex, body mass, symptom onset, delay in gastric emptying, and gastroparesis severity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with severely delayed gastric emptying had worse vomiting and more severe loss of appetite and overall gastroparesis symptoms."
      explanation: In 243 idiopathic gastroparesis patients, severe delay was associated with worse vomiting.
  - target: Poor appetite
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - delayed_emptying_symptom_model
    evidence:
    - reference: PMID:20965184
      reference_title: "Clinical features of idiopathic gastroparesis vary with sex, body mass, symptom onset, delay in gastric emptying, and gastroparesis severity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with severely delayed gastric emptying had worse vomiting and more severe loss of appetite and overall gastroparesis symptoms."
      explanation: Severe delay was associated with more severe loss of appetite.
  - target: Early satiety
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - delayed_emptying_symptom_model
    description: >-
      Early satiety is a classic symptom attributed to gastric retention;
      impaired accommodation may contribute independently of emptying rate.
  - target: Postprandial fullness
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - delayed_emptying_symptom_model
    description: >-
      Postprandial fullness is attributed to gastric retention, but correlates
      poorly with emptying rate.
  - target: Nausea
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - delayed_emptying_symptom_model
    description: >-
      Nausea is the most common symptom and is related to meals in most
      patients, but symptom relief does not track acceleration of emptying.
    evidence:
    - reference: PMID:24005344
      reference_title: "The relation between symptom improvement and gastric emptying in the treatment of diabetic and idiopathic gastroparesis."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Even though most drugs concomitantly improved symptoms and accelerated GE, no study reported a significant correlation between SI and GE."
      explanation: Across prokinetic trials, accelerating emptying did not correlate with symptom improvement, weakening a direct emptying-to-symptom link.

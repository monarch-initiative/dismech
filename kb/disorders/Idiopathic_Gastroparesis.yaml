      evidence_source: HUMAN_CLINICAL
      snippet: "Interstitial cells of Cajal counts inversely correlated with 4 h gastric retention in DG but not in IG"
      explanation: In the NIDDK biopsy cohort, ICC counts did not correlate with gastric retention in idiopathic gastroparesis.
- name: Nitrergic Enteric Neuron Loss
  description: >-
    Expression of neuronal nitric oxide synthase in gastric myenteric nerves is
    reduced, and was reduced in more idiopathic (40%) than diabetic (20%)
    patients in the NIDDK consortium biopsies. Nitrergic neurons mediate
    inhibitory relaxation of the pylorus and fundus.
  biological_scale: CELLULAR
  cell_types:

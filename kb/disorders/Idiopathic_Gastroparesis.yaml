name: Idiopathic Gastroparesis
creation_date: "2026-09-30T19:45:00Z"
category: Complex
disease_term:
  preferred_term: idiopathic gastroparesis
  term:
    id: MONDO:0034150
    label: idiopathic gastroparesis
description: >-
  Idiopathic gastroparesis is a chronic gastric neuromuscular disorder in which
  upper gastrointestinal symptoms (cardinally nausea and vomiting, with early
  satiation, postprandial fullness, bloating and abdominal pain) occur with
  objectively delayed gastric emptying of a solid meal, in the absence of
  mechanical obstruction and after exclusion of diabetes, prior gastric
  surgery, medications and other identifiable causes. It is the largest
  etiological category of gastroparesis in referral series and predominantly
  affects young and middle-aged women. Full-thickness gastric biopsies show loss
  and ultrastructural injury of interstitial cells of Cajal, reduced nitrergic
  (nNOS) innervation, loss of anti-inflammatory CD206+ muscularis macrophages
  with a pro-inflammatory immune signature, and altered smooth muscle
  contractile gene expression, although how consistently these lesions explain
  delayed emptying or symptoms in the idiopathic form is unsettled. A subgroup
  begins acutely after a viral-like illness and usually improves over months;
  most other cases run a chronic course. Clinical and pathological features
  overlap extensively with functional dyspepsia, and treatment is largely
  symptomatic (dietary modification, metoclopramide or erythromycin, antiemetics,
  and gastric electrical stimulation or pyloric interventions for refractory
  disease). Diabetic gastroparesis, which shares the ICC and macrophage lesions,
  is outside the scope of this entry.
synonyms:
- IG
- IGP
parents:
- Gastroparesis
categories:
- Gastrointestinal Motility Disorder
notes: >-
  MONDO:0034150 has no causal gene; idiopathic gastroparesis is not a Mendelian
  disorder, and no GeneReviews chapter names it. The Olmsted County prevalence
  and incidence figures recorded under prevalence are for definite gastroparesis
  of all etiologies; no population-based rate specific to the idiopathic form
  was found. In referral series the idiopathic form is the largest single
  etiology (149 of 256 patients, 58.2%, in PMID:36730846). Most of the
  mechanistic evidence linking macrophages, heme oxygenase-1 and oxidative
  stress to interstitial cell of Cajal loss comes from diabetic mouse models,
  and the human idiopathic tissue data are cross-sectional.
has_subtypes:
- name: Post-infectious
  display_name: Post-infectious (post-viral) gastroparesis
  description: >-
    Gastroparesis beginning acutely after a viral-like illness (fever, myalgia,
    gastroenteritis) in a previously healthy person, sometimes with a documented
    agent such as cytomegalovirus or Epstein-Barr virus. It is regarded as a
    subgroup of idiopathic gastroparesis, is often accompanied by autonomic
    dysfunction, and usually improves or resolves over weeks to months.
  evidence:
  - reference: PMID:17716347
    reference_title: "Post-infectious gastroparesis: clinical and electerogastrographic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-infectious gastroparesis (PIGP) is a subgroup of idiopathic gastroparesis."
    explanation: Case series establishing post-infectious gastroparesis as a subgroup of idiopathic gastroparesis.
  - reference: PMID:2348727
    reference_title: "Gastroparesis after a presumed viral illness: clinical and laboratory features and natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "postviral gastroparesis is uncommon, is frequently associated with autonomic dysfunction, and is associated with an apparently excellent prognosis"
    explanation: Retrospective series describing the autonomic dysfunction and favorable course that distinguish the post-viral subgroup.
- name: Chronic idiopathic
  display_name: Chronic (insidious-onset) idiopathic gastroparesis
  description: >-
    Idiopathic gastroparesis without an infectious prodrome, typically of
    insidious onset and running a slowly progressive or persistent course with
    greater symptom burden than the post-infectious subgroup.
  evidence:
  - reference: PMID:9317072
    reference_title: "Viral gastroparesis: a subgroup of idiopathic gastroparesis--clinical characteristics and long-term outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Idiopathic gastroparesis is a more slowly progressive illness, and patients remain significantly more symptomatic for a longer period of time."
    explanation: Comparison of viral and non-viral idiopathic gastroparesis showing the chronic, slowly progressive course of the non-viral group.

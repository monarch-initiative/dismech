    reference_title: "Idiopathic gastroparesis is associated with specific transcriptional changes in the gastric muscularis externa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Smooth muscle tissue from idiopathic gastroparesis patients had decreased expression of mRNAs encoding several contractile proteins, such as MYH11 and MYLK1."

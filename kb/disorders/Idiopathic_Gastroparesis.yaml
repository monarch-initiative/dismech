  - reference: PMID:21914127
    reference_title: "Ultrastructural differences between diabetic and idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A thickened basal lamina around smooth muscle cells and nerves was characteristic of diabetic gastroparesis whereas idiopathic gastroparetics had fibrosis, especially around the nerves."
    explanation: Ultrastructural fibrosis around nerves distinguishes idiopathic from diabetic gastroparesis.
  downstream:
  - target: Impaired Gastric Neuromuscular Function
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - delayed_emptying_symptom_model
    description: >-
      Reduced contractile protein expression is expected to weaken antral
      contraction. No study has shown that this change delays emptying in
      idiopathic gastroparesis; the transcript changes correlated only weakly
      with fullness and satiety scores.
- name: Impaired Gastric Neuromuscular Function
  description: >-
    Combined failure of slow-wave pacemaking, inhibitory nitrergic relaxation
    and smooth muscle contraction produces disordered gastric motility,
    including impaired antral contractility and antropyloric coordination.
  biological_scale: TISSUE
  biological_processes:

diagnosis:
- name: Four-hour solid-meal gastric emptying scintigraphy
  description: >-
    Gastric emptying scintigraphy of a standardized low-fat solid meal over 4
    hours is the reference test; 4-hour testing is recommended over 2-hour
    testing. A gastric emptying breath test of a mixed meal is an accepted
    alternative.
  diagnosis_term:
    preferred_term: gastric emptying scintigraphy
    term:
      id: NCIT:C62667
      label: Radionuclide Imaging
  evidence:
  - reference: PMID:40976635
    reference_title: "AGA Clinical Practice Guideline on Management of Gastroparesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A conditional recommendation was issued against using 2-hour gastric emptying testing and in favor of 4-hour testing in patients with suspected gastroparesis."
    explanation: AGA guideline recommendation for 4-hour gastric emptying testing.
- name: Upper endoscopy to exclude mechanical obstruction
  description: >-
    Mechanical gastric outlet obstruction must be excluded, usually by upper
    gastrointestinal endoscopy or radiology, before delayed emptying is
    attributed to gastroparesis.
  diagnosis_term:
    preferred_term: upper gastrointestinal endoscopy
    term:
      id: NCIT:C78144
      label: Esophagogastroduodenoscopy
  evidence:
  - reference: PMID:39674226
    reference_title: "Rome Foundation and international neurogastroenterology and motility societies' consensus on idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This consensus defined idiopathic gastroparesis as the presence of symptoms associated with delayed gastric emptying in the absence of mechanical obstruction."
    explanation: Absence of mechanical obstruction is part of the consensus definition, which requires it to be excluded.
treatments:
- name: Dietary Modification
  description: >-
    Small-particle, low-fat, small frequent meals, with nutritional support
    (enteral feeding) for substantial weight loss or intractable vomiting, and
    cessation of opioids. Recommended by consensus opinion rather than by
    trials in idiopathic gastroparesis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:39674226
    reference_title: "Rome Foundation and international neurogastroenterology and motility societies' consensus on idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dietary adjustments, nutritional support (per guidelines from the European Society for Clinical Nutrition and Metabolism for substantial weight loss or intractable vomiting), and opioid cessation were recommended by a consensus opinion."
    explanation: Consensus recommendation for dietary adjustment and nutritional support in idiopathic gastroparesis.
- name: Metoclopramide
  description: >-
    Dopamine D2 receptor antagonist with prokinetic and antiemetic effects; the
    only drug approved in the United States for gastroparesis, conditionally
    recommended as initial therapy, with a boxed warning for tardive
    dyskinesia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metoclopramide
      term:
        id: CHEBI:107736
        label: metoclopramide
  target_mechanisms:
  - target: Delayed Gastric Emptying
    treatment_effect: MODULATES
    description: >-
      Prokinetics, metoclopramide among them, generally accelerate gastric
      emptying, but symptom relief does not track the acceleration.

progression:
- phase: Acute post-infectious onset with spontaneous improvement
  subtype: Post-infectious
  duration: 4 weeks to 12 months in most reported cases
  evidence:
  - reference: PMID:17716347
    reference_title: "Post-infectious gastroparesis: clinical and electerogastrographic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In four out of seven patients, symptoms resolved spontaneously within 4 weeks to 12 months, three patients had improved but were still symptomatic at the time of the writing of this work."
    explanation: Documents the self-limiting course of most post-infectious cases.
- phase: Chronic fluctuating course
  subtype: Chronic idiopathic
  notes: >-
    In the NIDDK consortium registry only about a quarter of gastroparesis
    patients improved by at least one GCSI point over 48 weeks.
  evidence:
  - reference: PMID:41833524
    reference_title: "Predominant Symptom in Gastroparesis: Relationships to Quality of Life, Treatments, and Outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 555 patients followed over 48 weeks, GCSI improved by ≥ 1 in 26% overall"
    explanation: Registry follow-up (idiopathic and diabetic gastroparesis) showing that most patients remain symptomatic over a year.
environmental:
- name: Antecedent acute viral illness
  presence: risk factor
  description: >-
    An acute viral-like illness (fever, fatigue, myalgia, with or without
    diarrhea) precedes symptom onset in about one fifth of patients with
    idiopathic gastroparesis and defines the post-infectious subgroup.
    Cytomegalovirus, Epstein-Barr virus and gastric enterovirus infection have
    been reported in individual patients; no single agent is established.
  exposure_term:
    preferred_term: acute viral infection
    term:
      id: ECTO:3000001
      label: exposure to virus
  evidence:
  - reference: PMID:20965184
    reference_title: "Clinical features of idiopathic gastroparesis vary with sex, body mass, symptom onset, delay in gastric emptying, and gastroparesis severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of 243 patients with IG studied was 41 years; 88% were female, 46% were overweight, 50% had acute onset of symptoms, and 19% reported an initial infectious prodrome."
    explanation: In the NIDDK registry, 19% of idiopathic gastroparesis patients reported an infectious prodrome.
  - reference: PMID:17716347
    reference_title: "Post-infectious gastroparesis: clinical and electerogastrographic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A specific virus was identified in two patients (one cytomegalovirus [CMV] and one Epstein-Barr virus [EBV])."
    explanation: Identifies cytomegalovirus and Epstein-Barr virus as documented agents in individual post-infectious cases.
  influences_mechanisms:
  - target: Delayed Gastric Emptying
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Delayed gastric emptying develops within days of resolution of the viral
      illness. The intermediate cellular lesion is not established; autonomic
      neuropathy was documented in the patients tested.
    evidence:
    - reference: PMID:2348727
      reference_title: "Gastroparesis after a presumed viral illness: clinical and laboratory features and natural history."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A mean of 4.5 days after spontaneous resolution of the viral illness, persistent nausea, vomiting, and epigastric pain developed in these patients. In all seven patients, delayed emptying of the gastric contents was substantiated."
      explanation: Temporal association of a viral illness with the onset of objectively delayed gastric emptying.
mechanistic_hypotheses:
- hypothesis_group_id: macrophage_oxidative_icc_injury
  hypothesis_label: >-
    Loss of cytoprotective muscularis macrophages permits oxidative and
    inflammatory injury of interstitial cells of Cajal and nitrergic neurons
  status: EMERGING
  description: >-
    In diabetic mouse models, gastric muscularis macrophages that fail to
    sustain heme oxygenase-1 expression and shift to an inflammatory phenotype
    release reactive oxygen species and cytokines (IL-6, TNF) that injure
    interstitial cells of Cajal and reduce nNOS expression, producing delayed
    gastric emptying. Human idiopathic gastroparesis tissue shows the matching
    static lesions (CD206+ macrophage loss, ICC loss, reduced HMOX1 mRNA), so
    the same chain is proposed for the idiopathic form, but the causal steps
    have not been demonstrated in idiopathic disease.
  evidence:
  - reference: PMID:32718570
    reference_title: "Gastric Biopsies in Gastroparesis: Insights into Gastric Neuromuscular Disorders to Aid Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More recently, in animal models, macrophages have also been identified to play a central role in development of delayed gastric emptying. Activation of macrophages leads to loss of ICC. In human gastroparesis, loss of anti-inflammatory macrophages in gastric muscle has been shown."
    explanation: Review summarizing the animal-model macrophage mechanism and the corresponding human biopsy finding.
- hypothesis_group_id: delayed_emptying_symptom_model
  hypothesis_label: >-
    Neuromuscular injury delays gastric emptying, and retained gastric
    contents produce the symptoms
  status: CANONICAL
  description: >-
    The classical definition attributes nausea, vomiting, early satiety and
    fullness to delayed emptying of the stomach. It underlies the diagnostic
    requirement for a 4-hour gastric emptying test and the use of prokinetic
    and pyloric therapies.
  evidence:
  - reference: PMID:39674226
    reference_title: "Rome Foundation and international neurogastroenterology and motility societies' consensus on idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This consensus defined idiopathic gastroparesis as the presence of symptoms associated with delayed gastric emptying in the absence of mechanical obstruction."
    explanation: International consensus definition built on delayed emptying as the defining physiological abnormality.
- hypothesis_group_id: gastric_sensorimotor_spectrum
  hypothesis_label: >-
    Idiopathic gastroparesis is a gastric sensorimotor disorder on a spectrum
    with functional dyspepsia
  status: ALTERNATIVE
  description: >-
    Gastric emptying status is labile and correlates poorly with symptoms or
    with response to prokinetics, while idiopathic gastroparesis and functional
    dyspepsia share clinical features and the ICC and CD206+ macrophage lesions.
    This view places impaired accommodation, visceral hypersensitivity and
    gut-brain interaction alongside or in place of delayed emptying as the
    source of symptoms.
  evidence:
  - reference: PMID:33548234
    reference_title: "Functional Dyspepsia and Gastroparesis in Tertiary Care are Interchangeable Syndromes With Common Clinical and Pathologic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FD and gastroparesis are unified by characteristic pathologic features and should be considered as part of the same spectrum of truly \"organic\" gastric neuromuscular disorders."
    explanation: Consortium cohort showing that functional dyspepsia and gastroparesis are clinically and pathologically indistinguishable after a year.
  - reference: PMID:24005344
    reference_title: "The relation between symptom improvement and gastric emptying in the treatment of diabetic and idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In this review, no evidence of a relationship between SI and GE was identified for different drugs used for the treatment of gastroparesis."
    explanation: Meta-regression across prokinetic trials finds that symptom improvement does not track acceleration of gastric emptying.
pathophysiology:
- name: Muscularis Macrophage Phenotype Shift
  description: >-
    The gastric muscularis propria of patients with idiopathic gastroparesis
    shows loss of anti-inflammatory CD206+ macrophages in the circular muscle
    and myenteric plexus without a fall in total CD45+ immune cells, with an
    immune infiltrate containing macrophages and enrichment of transcripts
    associated with pro-inflammatory (M1) macrophages.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD206+ anti-inflammatory muscularis macrophage
    term:
      id: CL:0000890
      label: M2 macrophage
  - preferred_term: pro-inflammatory muscularis macrophage
    term:
      id: CL:0000863
      label: M1 macrophage
  biological_processes:
  - preferred_term: macrophage activation
    modifier: DYSREGULATED
    term:
      id: GO:0042116
      label: macrophage activation
  locations:
  - preferred_term: gastric antrum muscularis
    term:
      id: UBERON:0001165
      label: pyloric antrum
  - preferred_term: myenteric plexus
    term:
      id: UBERON:0002439
      label: myenteric nerve plexus
  evidence:
  - reference: PMID:28066953
    reference_title: "Diabetic and idiopathic gastroparesis is associated with loss of CD206-positive macrophages in the gastric antrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall immune cell population (CD45) was unchanged but there was a loss of anti-inflammatory macrophages (CD206) in circular muscle"
    explanation: Full-thickness antral biopsies from diabetic and idiopathic gastroparesis show loss of CD206+ macrophages with unchanged total immune cells.
  - reference: PMID:30086735
    reference_title: "Transcriptomic signatures reveal immune dysregulation in human diabetic and idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immune profile analysis revealed that genes associated with M1 (pro inflammatory) macrophages were enriched in tissues from idiopathic gastroparesis tissues compared to controls (p < 0.05)."
    explanation: RNA sequencing of gastric body biopsies shows a pro-inflammatory macrophage signature specifically in idiopathic gastroparesis.
  - reference: PMID:21300066
    reference_title: "Cellular changes in diabetic and idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common defects were loss of ICC with remaining ICC showing injury, an abnormal immune infiltrate containing macrophages, and decreased nerve fibers."
    explanation: NIDDK consortium biopsy study (20 idiopathic, 20 diabetic) reporting a macrophage-containing immune infiltrate.
  - reference: PMID:31482734
    reference_title: "Proteomics in gastroparesis: unique and overlapping protein signatures in diabetic and idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both DG and IG, \"Role of Macrophages, Fibroblasts and Endothelial Cells\" was the most statistically significant altered pathway"
    explanation: Tissue proteomics identifies macrophage-related signaling as the most altered pathway in idiopathic gastroparesis.
  downstream:
  - target: Loss of Heme Oxygenase-1 Cytoprotection and Oxidative Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - macrophage_oxidative_icc_injury
    description: >-
      Muscularis macrophages are the cells that upregulate heme oxygenase-1 in
      the diabetic stomach; loss of that upregulation raises reactive oxygen
      species. Shown in diabetic mice; inferred for idiopathic disease.
    evidence:
    - reference: PMID:18926825
      reference_title: "Heme oxygenase-1 protects interstitial cells of Cajal from oxidative stress and reverses diabetic gastroparesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In early stages of diabetes, HO-1 was up-regulated in gastric macrophages and remained up-regulated in all mice that were resistant to development of delayed gastric emptying."
      explanation: Places the protective heme oxygenase-1 response in gastric macrophages in the NOD diabetic mouse.
  - target: Interstitial Cell of Cajal Loss and Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - macrophage_oxidative_icc_injury
    description: >-
      Inflammatory macrophage products (IL-6, TNF) damage ICC in cultured
      mouse gastric muscularis, and restoring macrophages to
      macrophage-deficient diabetic Csf1op/op mice with CSF1 led to delayed
      emptying and damaged ICC in most of them. Human biopsies
      show a correlation between CD206+ cell and ICC numbers across patients
      and controls, but the correlation was not found within the idiopathic
      group in the gastric body.
    evidence:
    - reference: PMID:29501441
      reference_title: "Change in Populations of Macrophages Promotes Development of Delayed Gastric Emptying in Mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Medium conditioned by macrophages previously exposed to oxidative injury caused damage to ICC in cultured gastric muscularis propria from Csf1op/op mice; neutralizing antibodies against IL6R or TNF prevented this damage to ICC."
      explanation: Macrophage-derived IL-6 and TNF are sufficient to damage ICC ex vivo in cultured mouse gastric muscularis.
    - reference: PMID:29501441
      reference_title: "Change in Populations of Macrophages Promotes Development of Delayed Gastric Emptying in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "11 of 15 diabetic mice given CSF1 developed delayed gastric emptying and had damaged ICC."
      explanation: Restoring macrophages to macrophage-deficient diabetic Csf1op/op mice with CSF1 led to ICC damage and delayed emptying in vivo in most animals.
    - reference: PMID:28066953
      reference_title: "Diabetic and idiopathic gastroparesis is associated with loss of CD206-positive macrophages in the gastric antrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There was correlation between the number of ICC and CD206-positive cells (r=.55, P=.008)."
      explanation: In antral biopsies pooled across diabetic, idiopathic and control subjects, CD206+ macrophage and ICC counts correlate.
    - reference: PMID:25041465
      reference_title: "Association of low numbers of CD206-positive cells with loss of ICC in the gastric body of patients with diabetic gastroparesis."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "There was a significant correlation between the number of CD206+ cells and ICC in DG and DC patients, but not in C and IG"
      explanation: In gastric body biopsies the CD206-ICC correlation was absent within the idiopathic group, which argues against assuming the diabetic mechanism operates in idiopathic disease.
  - target: Nausea
    causal_link_type: UNKNOWN
    description: >-
      In idiopathic gastroparesis, patients with a myenteric immune infiltrate
      have more severe nausea and overall symptoms than those without one; the
      mechanism linking the infiltrate to nausea is unknown.
    evidence:
    - reference: PMID:22339929
      reference_title: "Clinical-histological associations in gastroparesis: results from the Gastroparesis Clinical Research Consortium."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall clinical severity and nausea in IG is associated with a myenteric immune infiltrate."
      explanation: NIDDK biopsy cohort associating the myenteric immune infiltrate with nausea severity in idiopathic gastroparesis.
- name: Loss of Heme Oxygenase-1 Cytoprotection and Oxidative Stress
  description: >-
    Failure to maintain heme oxygenase-1 expression in the gastric muscularis
    leaves the tissue exposed to reactive oxygen species. HMOX1 mRNA is reduced
    in the muscularis externa of idiopathic gastroparesis; the oxidative-stress
    consequence has been demonstrated in diabetic mice.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: DYSREGULATED
    term:
      id: GO:0006979
      label: response to oxidative stress
  genes:
  - preferred_term: HMOX1
    term:
      id: hgnc:5013
      label: HMOX1
  locations:
  - preferred_term: gastric muscularis externa
    term:
      id: UBERON:0008856
      label: stomach muscularis externa
  evidence:
  - reference: PMID:29052298
    reference_title: "Idiopathic gastroparesis is associated with specific transcriptional changes in the gastric muscularis externa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was also a significant decrease in mRNA-encoding platelet-derived growth factor receptor α (PDGFRα) and its ligand PDGFB and in Heme oxygenase 1 in idiopathic gastroparesis subjects."
    explanation: Reduced heme oxygenase-1 transcript in idiopathic gastroparesis muscularis externa.
  - reference: PMID:18926825
    reference_title: "Heme oxygenase-1 protects interstitial cells of Cajal from oxidative stress and reverses diabetic gastroparesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of HO-1 up-regulation increased levels of reactive oxygen species."
    explanation: In diabetic mice, loss of heme oxygenase-1 upregulation raises reactive oxygen species in the stomach.
  downstream:
  - target: Interstitial Cell of Cajal Loss and Injury
    causal_link_type: DIRECT
    hypothesis_groups:
    - macrophage_oxidative_icc_injury
    description: >-
      Inhibiting heme oxygenase-1 causes loss of Kit-positive ICC and delayed
      emptying, and inducing it restores Kit expression, in diabetic mice.
    evidence:
    - reference: PMID:18926825
      reference_title: "Heme oxygenase-1 protects interstitial cells of Cajal from oxidative stress and reverses diabetic gastroparesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inhibition of HO-1 activity in mice with normal gastric emptying caused a loss of Kit expression and development of diabetic gastroparesis."
      explanation: Loss-of-function experiment showing heme oxygenase-1 activity is required to preserve ICC.
  - target: Nitrergic Enteric Neuron Loss
    causal_link_type: DIRECT
    hypothesis_groups:
    - macrophage_oxidative_icc_injury
    description: >-
      Heme oxygenase-1 induction restores nNOS expression together with Kit in
      diabetic mice.
    evidence:
    - reference: PMID:18926825
      reference_title: "Heme oxygenase-1 protects interstitial cells of Cajal from oxidative stress and reverses diabetic gastroparesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Induction of HO-1 by hemin decreased reactive oxygen species, rapidly restored Kit and neuronal nitric oxide synthase expression, and completely normalized gastric emptying in all mice."
      explanation: Rescue experiment linking oxidative stress to loss of neuronal nitric oxide synthase expression.
- name: Interstitial Cell of Cajal Loss and Injury
  description: >-
    Kit-immunoreactive interstitial cells of Cajal, the pacemaker cells of the
    gastric slow wave, are reduced in number in gastric body and antral
    biopsies, and electron microscopy shows injury of the remaining ICC that is
    more severe in idiopathic than in diabetic gastroparesis. Not every study
    agrees: a muscularis externa transcript study found no reduction in KIT or
    ANO1 mRNA in idiopathic gastroparesis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: interstitial cell of Cajal
    term:
      id: CL:0002088
      label: interstitial cell of Cajal
  locations:
  - preferred_term: body of stomach
    term:
      id: UBERON:0001161
      label: body of stomach
  - preferred_term: gastric antrum
    term:
      id: UBERON:0001165
      label: pyloric antrum
  evidence:
  - reference: PMID:21300066
    reference_title: "Cellular changes in diabetic and idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common findings were loss of Kit expression, suggesting loss of ICC, and an increase in CD45 and CD68 immunoreactivity."
    explanation: Full-thickness gastric body biopsies from 20 idiopathic and 20 diabetic patients show loss of ICC.
  - reference: PMID:28066953
    reference_title: "Diabetic and idiopathic gastroparesis is associated with loss of CD206-positive macrophages in the gastric antrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both diabetic and idiopathic gastroparesis patients showed loss of ICC as compared to controls"
    explanation: Antral ICC counts are reduced in idiopathic gastroparesis.
  - reference: PMID:21914127
    reference_title: "Ultrastructural differences between diabetic and idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the ultrastructural changes in ICC and nerves differed between diabetic and idiopathic gastroparesis and were more severe in idiopathic gastroparesis."
    explanation: Transmission electron microscopy shows ICC injury that is more severe in idiopathic gastroparesis.
  - reference: PMID:29052298
    reference_title: "Idiopathic gastroparesis is associated with specific transcriptional changes in the gastric muscularis externa."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, there was no significant change in mRNAs characteristic of interstitial cells of Cajal (ICCs) such as KIT or ANO1."
    explanation: A transcript-level study found no overall reduction of ICC markers in idiopathic gastroparesis, contrasting with the immunohistochemical studies.
  downstream:

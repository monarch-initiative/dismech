      snippet: "Gastric emptying was significantly increased in mice that received NSCs as compared with vehicle-injected controls (49.67% vs 35.09%; P < .01 by Student t test)."
      explanation: Transplanted neural stem cells that become nNOS-expressing neurons improve gastric emptying in nNOS-deficient mice, a genetic model of gastroparesis.
- name: Smooth Muscle Contractile Protein and PDGFRA+ Cell Loss
  description: >-
    The gastric muscularis externa in idiopathic gastroparesis has reduced
    transcripts for smooth muscle contractile proteins (MYH11, MYLK1) and for
    PDGFRA and its ligand PDGFB, consistent with altered smooth muscle
    contractile capacity and loss of PDGFRA+ interstitial cells. Electron
    microscopy shows fibrosis, particularly around nerves, in idiopathic cases.
  biological_scale: CELLULAR

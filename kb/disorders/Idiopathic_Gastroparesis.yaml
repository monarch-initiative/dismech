    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On light microscopy, no significant differences were found between diabetic and idiopathic gastroparesis with the exception of nNOS expression, which was decreased in more patients with idiopathic gastroparesis (40%) compared with diabetic patients (20%) by visual grading."
    explanation: Reduced nNOS expression is more frequent in idiopathic than diabetic gastroparesis biopsies.
  downstream:
  - target: Impaired Gastric Neuromuscular Function
    causal_link_type: DIRECT
    hypothesis_groups:
    - delayed_emptying_symptom_model
    description: >-
      Loss of nitrergic input impairs pyloric relaxation and gastric emptying;
      shown in nNOS-deficient mice, where restoring nNOS-expressing neurons
      in the pylorus improves emptying.
    evidence:

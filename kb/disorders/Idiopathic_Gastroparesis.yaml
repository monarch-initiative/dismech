discussions:
- discussion_id: ig_cause_of_icc_loss
  prompt: >-
    What initiates the loss of interstitial cells of Cajal and the macrophage
    phenotype shift in idiopathic gastroparesis, where there is no
    hyperglycemia to drive oxidative stress?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Muscularis Macrophage Phenotype Shift
  - pathophysiology#Interstitial Cell of Cajal Loss and Injury
  rationale: >-
    The upstream trigger in diabetic gastroparesis is hyperglycemia-associated
    oxidative stress. No equivalent trigger is established for the idiopathic
    form. Candidates include antecedent viral infection (the post-infectious
    subgroup), autoimmunity (antinuclear antibodies in about 16% of idiopathic
    patients) and unrecognized neuropathic processes, none of which has been
    connected to the tissue lesion.
  evidence:
  - reference: PMID:34595805
    reference_title: "Prevalence and clinical correlates of antinuclear antibody in patients with gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Positive ANA was seen in 148 of 893 (17%) patients with gastroparesis, being similar in idiopathic (16% of 536 patients), T1DM (16% of 162), T2DM (18% of 147), and postfundoplication (19% of 48 patients) gastroparesis."
    explanation: Autoimmune serology is present in a minority of idiopathic patients but is not specific to that etiology.
  - reference: PMID:27344315
    reference_title: "Gastric Enterovirus Infection: A Possible Causative Etiology of Gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gastric EV infection was frequently detected (82 %) in patients undergoing investigation for IGP."
    explanation: Small uncontrolled series proposing gastric enterovirus infection as a trigger; it has not been replicated.
- discussion_id: ig_diabetic_model_extrapolation
  prompt: >-
    Does the macrophage, heme oxygenase-1 and oxidative-stress mechanism shown
    in diabetic mice operate in human idiopathic gastroparesis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Heme Oxygenase-1 Cytoprotection and Oxidative Stress
  - mechanistic_hypotheses#macrophage_oxidative_icc_injury
  rationale: >-
    Every causal step of the macrophage to ICC chain was demonstrated in
    streptozotocin or NOD diabetic mice. Human idiopathic tissue reproduces the
    static lesions only partly: CD206+ macrophages are reduced and HMOX1 mRNA is
    lower, but the CD206-ICC correlation seen in diabetic patients was absent in
    idiopathic patients, a transcript study found no loss of KIT or ANO1, and
    ICC counts did not track gastric retention in idiopathic disease. There is
    no model of idiopathic gastroparesis itself.
  evidence:
  - reference: PMID:25041465
    reference_title: "Association of low numbers of CD206-positive cells with loss of ICC in the gastric body of patients with diabetic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Depletion of ICC and correlation with changes in CD206+ cell numbers in DC and DG patients suggests that in humans, like mice, CD206+ macrophages may play a cytoprotective role in diabetes."
    explanation: The human evidence for macrophage cytoprotection of ICC is specific to diabetic patients.
  proposed_experiments:
  - experiment_id: ig_muscularis_single_cell
    name: Single-cell profiling of idiopathic gastroparesis muscularis
    description: >-
      Single-cell and spatial transcriptomics of full-thickness gastric
      biopsies from idiopathic gastroparesis, diabetic gastroparesis,
      functional dyspepsia and controls, measuring macrophage heme
      oxygenase-1 expression and oxidative-stress signatures next to ICC.
    would_support:
    - pathophysiology#Loss of Heme Oxygenase-1 Cytoprotection and Oxidative Stress
    supporting_outcome:
    - >-
      Idiopathic tissue shows HO-1-deficient, inflammatory macrophages adjacent
      to injured ICC, with oxidative-stress signatures, as in diabetic models.
    refuting_outcome:
    - >-
      Idiopathic tissue shows ICC injury without macrophage HO-1 loss or
      oxidative-stress signatures.
- discussion_id: ig_emptying_symptom_correlation
  prompt: >-
    Is delayed gastric emptying the cause of symptoms in idiopathic
    gastroparesis, or a labile marker of a broader gastric sensorimotor
    disorder shared with functional dyspepsia?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Delayed Gastric Emptying
  - mechanistic_hypotheses#gastric_sensorimotor_spectrum
  rationale: >-
    About 40% of patients change between the gastroparesis and functional
    dyspepsia categories on repeat emptying testing within a year without any
    change in symptoms, 86% of idiopathic gastroparesis patients meet
    functional dyspepsia criteria, and acceleration of emptying by prokinetics
    does not predict symptom relief.
  evidence:
  - reference: PMID:33548234
    reference_title: "Functional Dyspepsia and Gastroparesis in Tertiary Care are Interchangeable Syndromes With Common Clinical and Pathologic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 48-week clinical outcome was also similar but at this time 42% of patients with an initial diagnosis of gastroparesis were reclassified as FD based on gastric-emptying results at this time point; conversely, 37% of patients with FD were reclassified as having gastroparesis."
    explanation: Gastric emptying category is unstable on retesting.
  - reference: PMID:20965184
    reference_title: "Clinical features of idiopathic gastroparesis vary with sex, body mass, symptom onset, delay in gastric emptying, and gastroparesis severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 86% met criteria for functional dyspepsia, primarily postprandial distress syndrome."
    explanation: Most idiopathic gastroparesis patients also meet functional dyspepsia criteria.

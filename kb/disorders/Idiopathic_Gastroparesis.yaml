  - preferred_term: pylorus
    term:
      id: UBERON:0001166
      label: pylorus
  evidence:
  - reference: PMID:21914127
    reference_title: "Ultrastructural differences between diabetic and idiopathic gastroparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, in all the patients TEM showed abnormalities in ICC, nerves and smooth muscle consistent with the delay in gastric emptying."
    explanation: Ultrastructural abnormalities of all three neuromuscular components are present in every patient studied.

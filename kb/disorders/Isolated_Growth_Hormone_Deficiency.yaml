name: Isolated Growth Hormone Deficiency
creation_date: "2026-08-26T00:00:00Z"
category: Endocrine
disease_term:
  preferred_term: isolated congenital growth hormone deficiency
  term:
    id: MONDO:0000050
    label: isolated congenital growth hormone deficiency
description: >-
  Deficient pituitary growth hormone (GH) secretion in the absence of other
  anterior pituitary hormone deficiencies, producing proportionate short
  stature with normal body proportions and delayed bone age. Root umbrella
  entry over four Mendelian molecular-cause subtypes distinguished by mode of
  inheritance and by whether GH is completely absent or merely diminished:
  type IA (autosomal recessive, complete absence of endogenous GH from a
  severe GH1 loss-of-function lesion - curated at entity level as its own
  dismech entry and cross-referenced here), type IB (autosomal recessive,
  low but detectable GH, most often from a GHRHR loss-of-function variant
  and less often an intrinsic GH1 defect), type II (autosomal dominant, a
  GH1 intron-3 splice-site or splicing-enhancer variant that produces a
  dominant-negative 17.5-kDa GH isoform), and type III (X-linked, associated
  with the BTK region at Xq21.3-q22 or, in a separate route, with SOX3
  dosage at Xq26-27).

  Distinct from Growth_Hormone_Insensitivity_Syndrome (Laron syndrome and its
  molecular relatives), where GH secretion is normal or elevated but the
  receptor or a post-receptor signal is defective. Here the receptor is
  intact and it is the ligand itself - or, for type IB/III, the somatotroph's
  ability to make and release it - that is deficient. This is also why
  recombinant GH replacement is generally effective in types IB, II, and III,
  unlike in type IA, where treatment failure from anti-GH antibody formation
  is part of the disease itself (see the type IA entry).
parents:
- Growth Hormone Deficiency

has_subtypes:

- name: Type IA
  display_name: Type IA (GH1 severe loss-of-function; complete GH absence)
  description: >-
    The most severe Mendelian form: autosomal recessive, complete absence of
    endogenous GH from a severe GH1 loss-of-function lesion (most often a
    6.7-45 kb deletion, also frameshift and nonsense variants), with a
    distinctive treatment-failure mechanism (anti-GH antibody formation on
    replacement, because the immune system was never exposed to the
    hormone). Curated at entity level in
    kb/disorders/Isolated_Growth_Hormone_Deficiency_Type_IA.yaml
    (MONDO:0009876); it is cross-referenced here and not duplicated.
  subtype_term:
    preferred_term: isolated growth hormone deficiency type IA
    term:
      id: MONDO:0009876
      label: isolated growth hormone deficiency type IA
  genes:
  - preferred_term: GH1
    term:
      id: hgnc:4261
      label: GH1
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:12207163
    reference_title: "Molecular and cellular basis of isolated dominant-negative growth hormone deficiency, IGHD type II: insights on the secretory pathway of peptide hormones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two forms are autosomal recessively (IGHD type IA and IB), one is
      autosomal dominantly (IGHD type II) and one X-linked inherited.
    explanation: >-
      Places type IA within the four-way classification this root entry
      models, alongside the other three subtypes below.

- name: Type IB
  display_name: Type IB (GHRHR or GH1 partial loss-of-function; diminished but detectable GH)
  description: >-
    Autosomal recessive, with low but detectable GH (unlike type IA's
    complete absence), significantly retarded bone age, and - because some
    endogenous GH was always present - a positive growth response and
    immunologic tolerance to exogenous GH therapy. The best-characterized
    molecular cause is an inactivating mutation of the GH-releasing hormone
    receptor (GHRHR), which leaves somatotrophs present but unable to
    receive the hypothalamic signal that drives GH synthesis and secretion;
    the founding description is "Dwarfism of Sindh," a consanguineous
    Pakistani kindred with a GHRHR nonsense mutation. An intrinsic GH1 defect
    is a much rarer alternative cause: a systematic sequencing survey found
    GH1 alterations in only 1.7% of subjects with the type IB phenotype,
    versus two-thirds of type IA families, and concluded that most type IB
    cases are not explained by GH1 itself.
  subtype_term:
    preferred_term: isolated growth hormone deficiency type IB
    term:
      id: MONDO:0013006
      label: isolated growth hormone deficiency type IB
  genes:
  - preferred_term: GHRHR
    term:
      id: hgnc:4266
      label: GHRHR
  - preferred_term: GH1
    term:
      id: hgnc:4261
      label: GH1
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA sequencing revealed a nonsense mutation (Glu50-->Stop) in the
      extracellular domain of the GHRH-R.
    explanation: >-
      The founding molecular description of GHRHR-caused type IB, in a
      consanguineous Pakistani kindred (dwarfism of Sindh).
  - reference: PMID:9432120
    reference_title: "Prevalence of human GH-1 gene alterations in patients with isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the low frequency rate of 1.7% (2/119) of GH-1 gene mutations
      responsible for the most common phenotype of IGHD, namely type IB
    explanation: >-
      Quantifies how rarely GH1 itself, rather than GHRHR or another
      candidate gene, explains the type IB phenotype.

- name: Type II
  display_name: Type II (autosomal dominant GH1 intron-3 splice variant; dominant-negative 17.5-kDa isoform)
  description: >-
    Autosomal dominant, and the mechanistically richest subtype: a heterozygous
    variant at the GH1 intron-3 splice donor site (the recurrent "hot spot"
    IVS3+1G>A is the most frequently reported single lesion) or at a nearby
    exonic splicing enhancer causes skipping of exon 3, producing a
    truncated, dominant-negative 17.5-kDa GH isoform alongside normal 22-kDa
    GH from the other allele. The 17.5-kDa isoform disrupts GH secretory
    granules in a dose-dependent manner and separately triggers endoplasmic
    reticulum stress and caspase-mediated apoptosis in somatotrophs,
    destroying most of them in transgenic mouse models and causing anterior
    pituitary hypoplasia. Clinical severity is variable even among carriers
    of the same mutation, which splicing-enhancer-strength studies suggest
    may reflect how much 17.5-kDa isoform a given variant actually produces.
  subtype_term:
    preferred_term: isolated growth hormone deficiency type II
    term:
      id: MONDO:0008250
      label: isolated growth hormone deficiency type II
  genes:
  - preferred_term: GH1
    term:
      id: hgnc:4261
      label: GH1
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:17073157
    reference_title: "GH-1 gene splicing mutations: molecular basis of hereditary isolated growth hormone deficiency in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The "hot spot" of mutations is 5'-donor splicing site of GH-1 intron 3,
      while IVS3 +IG>A mutation can be regarded as the most incident in type
      II isolated growth hormone deficiency in the Russian population.
    explanation: >-
      Identifies the recurrent intron-3 donor-site hot spot underlying most
      type II cases in this cohort.
  - reference: PMID:12720086
    reference_title: "Disruption of exon definition produces a dominant-negative growth hormone isoform that causes somatotroph death and IGHD II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isolated growth hormone deficiency type II (IGHD II) is characterized
      by short stature due to dominant-negative mutations of the human
      growth hormone gene (GH1).
    explanation: >-
      Establishes the dominant-negative GH1 mechanism that defines this
      subtype, elaborated in the pathophysiology section below.

- name: Type III
  display_name: Type III (X-linked; BTK-region or SOX3)
  description: >-
    X-linked. The classic description (Fleisher syndrome) is a contiguous
    phenotype of X-linked hypogammaglobulinemia and isolated GH deficiency
    (XLA/GHD) mapping near the BTK gene at Xq21.3-q22, the same locus
    disrupted in Bruton's X-linked agammaglobulinemia
    (kb/disorders/X-linked_Agammaglobulinemia.yaml). The molecular basis of
    the GHD component is genuinely unresolved: in the kindred where it was
    originally described, BTK mRNA and protein were present at normal levels
    and the BTK coding sequence was normal, showing that XLA/GHD is not
    simply Bruton's XLA with an incidental growth phenotype, and a
    contiguous-deletion mechanism was explicitly excluded in three further
    XLA/GHD patients. A separate X-linked route is dosage alteration
    (duplication or deletion) of SOX3 at Xq26-27, which more typically
    produces infundibular hypoplasia with combined pituitary hormone
    deficiency rather than a strictly isolated GH deficit, though isolated
    GH deficiency has been reported as part of its phenotypic spectrum.
  subtype_term:
    preferred_term: isolated growth hormone deficiency type III
    term:
      id: MONDO:0010615
      label: isolated growth hormone deficiency type III
  genes:
  - preferred_term: BTK
    term:
      id: hgnc:1133
      label: BTK
  - preferred_term: SOX3
    term:
      id: hgnc:11199
      label: SOX3
  inheritance:
  - name: X-linked recessive
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
    description: >-
      Applies to the BTK-region (Fleisher syndrome) route, in which affected
      males have both agammaglobulinemia and GH deficiency. The SOX3-dosage
      route is X-linked but its dominance/recessiveness is less clearly
      established, since reported carrier females have ranged from
      unaffected to mildly affected.
  evidence:
  - reference: PMID:7650402
    reference_title: "Molecular genetic analysis of X-linked hypogammaglobulinemia and isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 1980 the clinical syndrome of X-linked hypogammaglobulinemia and
      isolated growth hormone deficiency (XLA/GHD) was described.
    explanation: >-
      Establishes the contiguous XLA/GHD phenotype this subtype is named
      for, distinct from Bruton's XLA alone.
  - reference: PMID:15800844
    reference_title: "Over- and underdosage of SOX3 is associated with infundibular hypoplasia and hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that both over- and underdosage of SOX3 are associated
      with similar phenotypes, consisting of infundibular hypoplasia and
      hypopituitarism but not necessarily MR.
    explanation: >-
      Establishes SOX3 dosage as a second, molecularly distinct X-linked
      route into this subtype's phenotype.

pathophysiology:

# --- Type IB arm ---
- name: GHRHR or GH1 Partial Loss-of-Function Variant
  role: trigger
  subtypes:
  - Type IB
  biological_scale: MOLECULAR
  description: >-
    Most commonly a biallelic inactivating GHRHR variant (the founding
    description is a nonsense mutation, Glu50Stop, in the receptor's
    extracellular domain, in a consanguineous Pakistani kindred); much less
    commonly an intrinsic GH1 variant, which a systematic sequencing survey
    found in only 1.7% of type IB subjects. Both converge on the same
    clinical picture - low but detectable GH, unlike type IA's complete
    absence.
  genetic_context:
    gene:
      preferred_term: GHRHR
      term:
        id: hgnc:4266
        label: GHRHR
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Modeled on the GHRHR route, the better-characterized of the two
      genetic causes; a rarer intrinsic GH1 defect can produce the same
      downstream state by a distinct mechanism not captured by this
      genetic_context block.
  molecular_functions:
  - preferred_term: growth hormone-releasing hormone receptor activity
    term:
      id: GO:0016520
      label: growth hormone-releasing hormone receptor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA sequencing revealed a nonsense mutation (Glu50-->Stop) in the
      extracellular domain of the GHRH-R.
    explanation: >-
      The variant defining the GHRHR route into this node.
  - reference: PMID:9432120
    reference_title: "Prevalence of human GH-1 gene alterations in patients with isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the low frequency rate of 1.7% (2/119) of GH-1 gene mutations
      responsible for the most common phenotype of IGHD, namely type IB
    explanation: >-
      Quantifies the much rarer GH1 route bundled into this same trigger
      node.
  downstream:
  - target: Reduced Somatotroph Growth Hormone Synthesis and Secretion
    causal_link_type: DIRECT
    description: >-
      Loss of GHRH receptor signalling removes the hypothalamic drive for GH
      synthesis and secretion by intact somatotrophs; a GH1 defect acts more
      directly on the hormone itself. Either way the result is reduced, not
      absent, GH.

- name: Reduced Somatotroph Growth Hormone Synthesis and Secretion
  role: consequence
  subtypes:
  - Type IB
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Somatotroph
    term:
      id: CL:0002312
      label: somatotroph
  biological_processes:
  - preferred_term: growth hormone secretion
    term:
      id: GO:0030252
      label: growth hormone secretion
    modifier: DECREASED
  description: >-
    Somatotrophs are present and capable of secretion, unlike the somatotroph
    loss modeled for type II below; without the GHRH signal (or with an
    intrinsic GH1 defect) they simply make and release less hormone.
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum GH did not respond to provocative stimuli (GHRH, L-dopa, or
      clonidine).
    explanation: >-
      Documents the functional consequence of GHRHR loss on somatotroph GH
      output in the founding kindred.
  downstream:
  - target: Insufficient Circulating Growth Hormone
    causal_link_type: DIRECT

# --- Type II arm ---
- name: GH1 Intron-3 Splice-Site or Splicing-Enhancer Variant
  role: trigger
  subtypes:
  - Type II
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: GH1
      term:
        id: hgnc:4261
        label: GH1
    functional_impact_category: DOMINANT_NEGATIVE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Most frequently the recurrent intron-3 donor splice-site variant
      IVS3+1G>A; other reported lesions weaken exon-3 splicing enhancers
      (dual enhancers are normally required for exon-3 definition) rather
      than disrupting the canonical splice site itself.
  description: >-
    A single mutant GH1 allele produces a mixture of normal transcript and
    an aberrantly spliced transcript lacking exon 3, while the other allele
    continues to produce normal transcript - the genetic basis of the
    dominant-negative phenotype elaborated in the nodes below.
  evidence:
  - reference: PMID:17073157
    reference_title: "GH-1 gene splicing mutations: molecular basis of hereditary isolated growth hormone deficiency in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The "hot spot" of mutations is 5'-donor splicing site of GH-1 intron 3,
      while IVS3 +IG>A mutation can be regarded as the most incident in type
      II isolated growth hormone deficiency in the Russian population.
    explanation: >-
      Identifies the recurrent hot-spot variant modeled on this node.
  - reference: PMID:12720086
    reference_title: "Disruption of exon definition produces a dominant-negative growth hormone isoform that causes somatotroph death and IGHD II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that dual splicing enhancers are required to ensure
      exon 3 definition to produce full-length 22-kDa hormone.
    explanation: >-
      Establishes the splicing-enhancer route into exon-3 skipping, distinct
      from a canonical splice-site variant but converging on the same
      downstream isoform. This is an in-vitro splicing-reporter finding, not
      a clinical observation.
  downstream:
  - target: Exon 3 Skipping and Dominant-Negative 17.5-kDa GH Isoform Production
    causal_link_type: DIRECT

- name: Exon 3 Skipping and Dominant-Negative 17.5-kDa GH Isoform Production
  role: central_effector
  subtypes:
  - Type II
  biological_scale: MOLECULAR
  description: >-
    The mutant allele's transcript skips exon 3, yielding a 17.5-kDa GH
    isoform lacking the residues exon 3 would have encoded (also described
    as del32-71 GH), co-expressed with normal 22-kDa GH from the wild-type
    allele. This isoform is not simply inactive - it actively interferes
    with the wild-type hormone's normal secretion, which is what makes the
    variant dominant-negative rather than a simple loss-of-function allele.
    Splicing-enhancer variants that only partially weaken exon-3 recognition
    produce variable amounts of the 17.5-kDa isoform, offering a candidate
    explanation for the clinical variability seen among type II patients.
  evidence:
  - reference: PMID:12720086
    reference_title: "Disruption of exon definition produces a dominant-negative growth hormone isoform that causes somatotroph death and IGHD II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      mutations that cause exon 3 skipping and produce a dominant-negative
      17.5-kDa isoform in humans also cause a dose-dependent disruption of
      GH secretory vesicles when expressed in GC cells
    explanation: >-
      Names the 17.5-kDa isoform and its dose-dependent effect on secretory
      vesicles, the basis for the two downstream consequence nodes below.
      Quote trimmed to the GC-cell (IN_VITRO) clause; the same source
      sentence continues "...and transgenic mice," and that in-vivo
      corroboration is evidenced separately, as MODEL_ORGANISM, on the
      downstream "Anterior Pituitary Somatotroph Loss" node below.
  - reference: PMID:23736291
    reference_title: "Endoplasmic reticulum stress and apoptosis contribute to the pathogenesis of dominantly inherited isolated GH deficiency due to GH1 gene splice site mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An exon 3 deletion in GH (del32-71 GH) is produced from a mutant
      allele, whereas wild-type GH is produced from the other allele.
      Several studies have demonstrated a dominant negative effect of
      del32-71 GH on wild-type GH secretion
    explanation: >-
      Confirms the same isoform under an alternative name (del32-71 GH) and
      its dominant-negative effect on the co-expressed wild-type hormone.
  downstream:
  - target: Disruption of GH Secretory Granules
    causal_link_type: DIRECT
  - target: Endoplasmic Reticulum Stress and Somatotroph Apoptosis
    causal_link_type: DIRECT

- name: Disruption of GH Secretory Granules
  role: consequence
  subtypes:
  - Type II
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: secretory granule
    term:
      id: GO:0030141
      label: secretory granule
  biological_processes:
  - preferred_term: growth hormone secretion
    term:
      id: GO:0030252
      label: growth hormone secretion
    modifier: DECREASED
  description: >-
    Expression of the 17.5-kDa isoform causes a dose-dependent disruption of
    GH secretory vesicles, directly impairing regulated release of the
    co-packaged normal hormone independent of the apoptotic arm below.
  evidence:
  - reference: PMID:12720086
    reference_title: "Disruption of exon definition produces a dominant-negative growth hormone isoform that causes somatotroph death and IGHD II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      mutations that cause exon 3 skipping and produce a dominant-negative
      17.5-kDa isoform in humans also cause a dose-dependent disruption of
      GH secretory vesicles when expressed in GC cells
    explanation: >-
      Direct evidence for the secretory-granule-disruption arm, observed in
      the GC cell line. The same source sentence also reports this in
      transgenic mice; that arm is evidenced separately, as MODEL_ORGANISM,
      on the "Anterior Pituitary Somatotroph Loss" node below rather than
      forced onto this quote.
  downstream:
  - target: Insufficient Circulating Growth Hormone
    causal_link_type: DIRECT

- name: Endoplasmic Reticulum Stress and Somatotroph Apoptosis
  role: consequence
  subtypes:
  - Type II
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Somatotroph
    term:
      id: CL:0002312
      label: somatotroph
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway in response to endoplasmic reticulum stress
    term:
      id: GO:0070059
      label: intrinsic apoptotic signaling pathway in response to endoplasmic reticulum stress
    modifier: INCREASED
  description: >-
    Unfolded 17.5-kDa isoform accumulates in the endoplasmic reticulum and
    activates all three canonical ER stress-response arms (PERK, ATF6, and
    IRE1), with downstream caspase-3/7 activation and, in a subset of cell
    models, DNA fragmentation - a second, apoptotic route to reduced GH
    output that is independent of the granule-disruption arm above.
    Overexpressing the IRE1-downstream transcription factor XBP1(S) reversed
    the caspase activation in this system, identifying IRE1 signalling as
    load-bearing for the apoptotic effect rather than merely correlated
    with it.
  evidence:
  - reference: PMID:23736291
    reference_title: "Endoplasmic reticulum stress and apoptosis contribute to the pathogenesis of dominantly inherited isolated GH deficiency due to GH1 gene splice site mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      del32-71 GH induction decreased cell viability, increased expression
      of 3 major ER stress response pathways
    explanation: >-
      Direct evidence for the ER-stress/apoptosis arm in a
      doxycycline-controlled cell model of the dominant-negative isoform.
      The three pathways named in the description (PERK, ATF6, IRE1) are the
      same sentence's parenthetical continuation in the source abstract.
  - reference: PMID:23736291
    reference_title: "Endoplasmic reticulum stress and apoptosis contribute to the pathogenesis of dominantly inherited isolated GH deficiency due to GH1 gene splice site mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      overexpression of XBP1(S), a nuclear transcription factor downstream
      of IRE1, completely reversed the observed caspase activation
    explanation: >-
      Shows IRE1/XBP1(S) signalling is mechanistically load-bearing for the
      apoptotic effect, not just co-occurring with it.
  downstream:
  - target: Anterior Pituitary Somatotroph Loss
    causal_link_type: DIRECT

- name: Anterior Pituitary Somatotroph Loss
  role: consequence
  subtypes:
  - Type II
  biological_scale: TISSUE
  description: >-
    In transgenic mice, overexpression of the dominant-negative 17.5-kDa
    isoform destroyed the majority of somatotrophs and produced anterior
    pituitary hypoplasia. This structural consequence has been demonstrated
    in the mouse model rather than directly imaged in human type II
    patients; see the discussion below.
  evidence:
  - reference: PMID:12720086
    reference_title: "Disruption of exon definition produces a dominant-negative growth hormone isoform that causes somatotroph death and IGHD II."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      overexpression of the dominant-negative 17.5-kDa isoform also destroys
      the majority of somatotrophs, leading to anterior pituitary hypoplasia
      in transgenic mice.
    explanation: >-
      The transgenic mouse evidence for somatotroph destruction and
      resulting pituitary hypoplasia.
  downstream:
  - target: Insufficient Circulating Growth Hormone
    causal_link_type: DIRECT

# --- Type III arm ---
- name: BTK-Region Xq21.3-q22 Genetic Lesion
  role: trigger
  subtypes:
  - Type III
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: BTK
      term:
        id: hgnc:1133
        label: BTK
    variant_origin: GERMLINE
    description: >-
      X-linked segregation of GH deficiency together with agammaglobulinemia
      is well established clinically in this region, but the specific
      genetic lesion responsible for the GHD component has not been
      identified: in the originally described kindred BTK mRNA and protein
      were both present at normal levels and the BTK coding sequence was
      normal, and a contiguous deletion spanning the region was explicitly
      excluded in three further XLA/GHD patients. This is a genuine
      knowledge gap (see discussions below), not a settled BTK mechanism.
  description: >-
    Named for the BTK locus because that is the established cause of the
    co-occurring agammaglobulinemia (Bruton's X-linked agammaglobulinemia,
    kb/disorders/X-linked_Agammaglobulinemia.yaml), not because BTK itself
    has been shown to cause the GH deficiency.
  evidence:
  - reference: PMID:7650402
    reference_title: "Molecular genetic analysis of X-linked hypogammaglobulinemia and isolated growth hormone deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BTK mRNA was normal in size and abundance, and the mRNA sequence was
      normal over the coding region, except for a single silent mutation.
      BTK protein was present in normal amounts in PBMC of this patient.
      Thus, at the molecular level, XLA/GHD is a different disease entity
      from Bruton's XLA.
    explanation: >-
      PARTIAL: it establishes the X-linked locus and the clinical entity but
      actively refutes BTK itself as the GHD-causing gene in this patient,
      which is exactly the mechanistic gap this node records.
  - reference: PMID:7959728
    reference_title: "Isolation of cosmid and cDNA clones in the region surrounding the BTK gene at Xq21.3-q22."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Southern blot analysis using cDNA clones isolated from this region
      permitted us to exclude a contiguous deletion syndrome as an
      underlying defect in three patients with XLA and associated growth
      hormone deficiency.
    explanation: >-
      PARTIAL: rules out the most obvious structural explanation
      (contiguous deletion) without identifying an alternative.
  downstream:
  - target: Insufficient Circulating Growth Hormone
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediate cellular mechanism connecting this X-linked locus to
      reduced somatotroph GH output is unknown; only the clinical
      segregation and the anatomic locus are established.

- name: SOX3 Dosage Alteration
  role: trigger
  subtypes:
  - Type III
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: SOX3
      term:
        id: hgnc:11199
        label: SOX3
    description: >-
      Duplication or deletion of the dosage-sensitive transcription factor
      SOX3 at Xq26-27; either direction of dosage change has been reported
      with infundibular hypoplasia and hypopituitarism, more typically
      combined pituitary hormone deficiency rather than a strictly isolated
      GH deficit.
  description: >-
    A molecularly distinct second route into the X-linked subtype, acting
    through hypothalamic-pituitary developmental patterning rather than
    through a locus linked to agammaglobulinemia.
  evidence:
  - reference: PMID:15800844
    reference_title: "Over- and underdosage of SOX3 is associated with infundibular hypoplasia and hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that both over- and underdosage of SOX3 are associated
      with similar phenotypes, consisting of infundibular hypoplasia and
      hypopituitarism but not necessarily MR.
    explanation: >-
      The dosage-sensitivity finding this node is built on.
  downstream:
  - target: Insufficient Circulating Growth Hormone
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acts via disrupted hypothalamic-pituitary axis development
      (infundibular hypoplasia); the isolated-GHD presentation is part of a
      broader spectrum that more often includes other pituitary hormone
      deficiencies.

# --- Shared convergent chain ---
- name: Insufficient Circulating Growth Hormone
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    The convergent state shared by types IB, II, and III: circulating GH is
    reduced by disruption of its synthesis, secretion, or the somatotroph
    population producing it - in contrast to type IA, where the GH1 gene
    product is absent altogether (curated separately). The route into this
    state differs by subtype (see the arms above), but the downstream
    consequence for growth is the same.
  evidence:
  - reference: PMID:17965963
    reference_title: "Isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a small number of children with IGHD, defects in the GH,
      GH-releasing hormone receptor (GHRH-R), and GH1 genes have been
      identified.
    explanation: >-
      Ties the distinct genetic triggers modeled above to the shared
      downstream state of GH insufficiency.
  downstream:
  - target: Loss of Growth Hormone Receptor Signalling
    causal_link_type: DIRECT

- name: Loss of Growth Hormone Receptor Signalling
  role: consequence
  biological_scale: CELLULAR
  description: >-
    With less ligand available, growth hormone receptor signalling in
    peripheral target tissues (chiefly liver, driving IGF-1 generation) is
    correspondingly reduced. The receptor itself is normal throughout this
    entry, which is what distinguishes it mechanistically from
    Growth_Hormone_Insensitivity_Syndrome.
  biological_processes:
  - preferred_term: growth hormone receptor signaling pathway
    term:
      id: GO:0060396
      label: growth hormone receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Insulin-like growth factor I (IGF-I) and IGF-binding protein 3 were
      low (5.2 +/- 2.0 ng/mL and 0.42 +/- 0.13 microg/mL, respectively;
      mean +/- SD) but rose normally with GH treatment.
    explanation: >-
      IGF-1/IGFBP-3 are the direct downstream readout of GH receptor
      signalling in the liver. Low IGF-1 in the untreated (ligand-deficient)
      state, rising normally once ligand is supplied, is direct evidence
      that receptor signalling tracks GH availability rather than being
      intrinsically impaired - exactly the claim this node makes.
  downstream:
  - target: Impaired Longitudinal Growth
    causal_link_type: DIRECT

- name: Impaired Longitudinal Growth
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Reduced GH-dependent IGF-1 generation slows linear growth, producing
    proportionate short stature with delayed skeletal maturation - milder
    and later-declaring than type IA's universal severe dwarfism by six
    months, consistent with GH being reduced rather than absent.
  downstream:
  - target: Short Stature
    causal_link_type: DIRECT
  - target: Delayed Skeletal Maturation
    causal_link_type: DIRECT

phenotypes:

- category: Growth
  name: Short Stature
  description: >-
    Proportionate short stature, the defining clinical presentation shared
    by types IB, II, and III (type IA's more severe, earlier-onset course is
    curated on its own entry).
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mean height was 7.2 SD below the norm, with mean adult heights of 130
      cm for males and 113.5 cm for females.
    explanation: >-
      Quantifies the severity of short stature in a GHRHR-null (type IB)
      cohort.

- category: Skeletal
  name: Delayed Skeletal Maturation
  description: >-
    Bone age lags behind chronological age, a standard finding across
    GH-deficiency subtypes generally, including MONDO's own definitional
    text for type IB ("significantly retarded bone age").
  phenotype_term:
    preferred_term: Delayed skeletal maturation
    term:
      id: HP:0002750
      label: Delayed skeletal maturation
  evidence:
  - reference: PMID:36960394
    reference_title: "A GHRHR founder mutation causes isolated growth hormone deficiency type IV in a consanguineous Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with IGHD type IV (IGHD4) have a short stature, reduced
      serum GH levels, and delayed bone age.
    explanation: >-
      A direct statement of delayed bone age in a closely related,
      GHRHR-caused IGHD entity (type IV, out of this entry's declared
      scope - see notes). No cached source among the type IB/II/III
      literature actually screened for this entry (PMID:9814493,
      PMID:9432120, PMID:10678654, PMID:8528260, PMID:8288694) supplies a
      quotable bone-age sentence, despite MONDO's own def: text for type IB
      asserting "significantly retarded bone age." This quote is the
      closest verifiable substitute rather than a direct type IB/II/III
      finding, and the gap is recorded rather than papered over.

- category: Endocrine
  name: Reduced Circulating Growth Hormone Concentration
  description: >-
    Detectable but subnormal GH, the laboratory finding that separates types
    IB, II, and III from type IA's complete absence.
  phenotype_term:
    preferred_term: Reduced circulating growth hormone concentration
    term:
      id: HP:0034323
      label: Reduced circulating growth hormone concentration
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum GH did not respond to provocative stimuli (GHRH, L-dopa, or
      clonidine).
    explanation: >-
      Documents blunted GH secretion in the type IB (GHRHR-null) cohort.

- category: Neurological
  name: Anterior Pituitary Hypoplasia
  description: >-
    Small anterior pituitary gland on MRI, present in a large majority of
    patients with idiopathic isolated GHD, not only in the combined
    (multi-hormone) deficiency forms - the human imaging counterpart of the
    somatotroph-loss pathophysiology modeled for type II (which is
    transgenic-mouse evidence; see the discussion on that node).
  phenotype_term:
    preferred_term: Anterior pituitary hypoplasia
    term:
      id: HP:0010627
      label: Anterior pituitary hypoplasia
  evidence:
  - reference: PMID:9802480
    reference_title: "MR imaging in idiopathic growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pituitary abnormalities were common in both groups (80% with isolated
      GHD, 93% with MPHD).
    explanation: >-
      Directly quantifies the pituitary-imaging abnormality rate in
      isolated GHD specifically (not just the combined-deficiency
      comparator group), from a 35-patient MRI series.

- category: Metabolic
  name: Neonatal Hypoglycemia
  description: >-
    Hypoglycemia presenting in the neonatal period, one of the few features
    that brings isolated GHD to clinical attention before growth failure
    becomes apparent.
  phenotype_term:
    preferred_term: Neonatal hypoglycemia
    term:
      id: HP:0001998
      label: Neonatal hypoglycemia
  evidence:
  - reference: PMID:9802480
    reference_title: "MR imaging in idiopathic growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Breech delivery, neonatal hypoglycemia, jaundice, micropenis, or
      single central incisor occurred equally with both isolated GHD and
      MPHD.
    explanation: >-
      States explicitly that neonatal hypoglycemia occurs in isolated GHD
      at a rate statistically indistinguishable from the combined-deficiency
      comparator group, i.e., it is not an artifact of pooling with MPHD
      cases.

- category: Gastrointestinal
  name: Prolonged Neonatal Jaundice
  description: >-
    Neonatal jaundice persisting beyond the physiologic window, reported at
    a similar rate in isolated GHD and in combined pituitary hormone
    deficiency.
  phenotype_term:
    preferred_term: Prolonged neonatal jaundice
    term:
      id: HP:0006579
      label: Prolonged neonatal jaundice
  evidence:
  - reference: PMID:9802480
    reference_title: "MR imaging in idiopathic growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Breech delivery, neonatal hypoglycemia, jaundice, micropenis, or
      single central incisor occurred equally with both isolated GHD and
      MPHD.
    explanation: >-
      Same source and same "occurred equally" statement as the neonatal
      hypoglycemia phenotype above, applied to jaundice.

- category: Genitourinary
  name: Micropenis
  description: >-
    Underdevelopment of the penis in affected males, reflecting the minor
    gonadotropin-independent role of GH in fetal genital growth; reported at
    a similar rate in isolated GHD and combined pituitary hormone
    deficiency.
  phenotype_term:
    preferred_term: Micropenis
    term:
      id: HP:0000054
      label: Micropenis
  evidence:
  - reference: PMID:9802480
    reference_title: "MR imaging in idiopathic growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Breech delivery, neonatal hypoglycemia, jaundice, micropenis, or
      single central incisor occurred equally with both isolated GHD and
      MPHD.
    explanation: >-
      Same source and same "occurred equally" statement, applied to
      micropenis; a separate, larger GH-registry study (PMID:15198294)
      found micropenis in 55/100 hypoglycemic males but in a cohort that
      was mostly combined pituitary hormone deficiency (148/169) rather
      than isolated GHD (12/169), so it is cited here only as corroboration,
      not as the primary support.

genetic:

- name: GH1
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GH1
    term:
      id: hgnc:4261
      label: GH1
  association: >-
    The gene most often implicated across this entry's subtypes: severe
    loss-of-function lesions cause type IA (curated separately), rare
    intrinsic variants are an uncommon cause of type IB, and heterozygous
    intron-3 splice or splicing-enhancer variants producing a
    dominant-negative 17.5-kDa isoform cause type II.
  evidence:
  - reference: PMID:9432120
    reference_title: "Prevalence of human GH-1 gene alterations in patients with isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial isolated growth hormone deficiency (IGHD) is associated with
      at least four Mendelian disorders. These include two forms that have
      autosomal recessive inheritance (IGHD types IA and IB) as well as
      autosomal dominant (IGHD type II) and X-linked (IGHD III) forms.
    explanation: >-
      The four-way classification GH1 (and the other genes below) sit
      within.

- name: GHRHR
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GHRHR
    term:
      id: hgnc:4266
      label: GHRHR
  association: >-
    Biallelic inactivating variants cause type IB; the founding description
    is a homozygous nonsense mutation (Glu50Stop) in a consanguineous
    Pakistani kindred ("Dwarfism of Sindh"), later shown to be shared by
    other affected families.
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation predicts a severely truncated GHRH-R; it is identical to
      that recently reported in four patients from two other families.
    explanation: >-
      Shows the founding variant recurs across independent families rather
      than being a single private mutation.

- name: BTK
  relationship_type: RISK_FACTOR
  gene_term:
    preferred_term: BTK
    term:
      id: hgnc:1133
      label: BTK
  association: >-
    The gene disrupted in the well-established co-occurring
    agammaglobulinemia at this X-linked locus. Curated as RISK_FACTOR rather
    than CAUSATIVE for the GH-deficiency component specifically, because BTK
    coding sequence and protein were normal in the originally described
    XLA/GHD kindred and a contiguous deletion was excluded in three further
    patients - the GHD-causing element at this locus has not been
    identified (see discussions below).
  evidence:
  - reference: PMID:7650402
    reference_title: "Molecular genetic analysis of X-linked hypogammaglobulinemia and isolated growth hormone deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, at the molecular level, XLA/GHD is a different disease entity
      from Bruton's XLA.
    explanation: >-
      PARTIAL: supports the X-linked locus and clinical entity while
      refuting BTK itself as the causal gene for the GHD component.

- name: SOX3
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SOX3
    term:
      id: hgnc:11199
      label: SOX3
  association: >-
    Dosage alteration (duplication or deletion) at Xq26-27 causes a second,
    molecularly distinct X-linked route into this subtype, more often
    presenting as combined pituitary hormone deficiency with infundibular
    hypoplasia than as isolated GH deficiency.
  evidence:
  - reference: PMID:15800844
    reference_title: "Over- and underdosage of SOX3 is associated with infundibular hypoplasia and hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that both over- and underdosage of SOX3 are associated
      with similar phenotypes, consisting of infundibular hypoplasia and
      hypopituitarism but not necessarily MR.
    explanation: >-
      The dosage-sensitivity finding underlying this gene's inclusion.

inheritance:

- name: Autosomal recessive (types IA, IB)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Applies to type IA (curated separately) and type IB, both requiring
    biallelic loss of function at GH1 or, for type IB, most often GHRHR.
  evidence:
  - reference: PMID:12207163
    reference_title: "Molecular and cellular basis of isolated dominant-negative growth hormone deficiency, IGHD type II: insights on the secretory pathway of peptide hormones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two forms are autosomal recessively (IGHD type IA and IB), one is
      autosomal dominantly (IGHD type II) and one X-linked inherited.
    explanation: >-
      States the inheritance pattern for all four subtypes in one sentence.

- name: Autosomal dominant (type II)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous GH1 splice-affecting variant is sufficient,
    because the resulting 17.5-kDa isoform acts as a dominant negative
    against the normal protein produced by the other allele.
  evidence:
  - reference: PMID:12720086
    reference_title: "Disruption of exon definition produces a dominant-negative growth hormone isoform that causes somatotroph death and IGHD II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isolated growth hormone deficiency type II (IGHD II) is characterized
      by short stature due to dominant-negative mutations of the human
      growth hormone gene (GH1).
    explanation: >-
      States the dominant-negative, autosomal dominant basis of type II.

- name: X-linked recessive (type III)
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Applies to the BTK-region (Fleisher syndrome) route, in which affected
    hemizygous males have both agammaglobulinemia and GH deficiency.
  evidence:
  - reference: PMID:7650402
    reference_title: "Molecular genetic analysis of X-linked hypogammaglobulinemia and isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 1980 the clinical syndrome of X-linked hypogammaglobulinemia and
      isolated growth hormone deficiency (XLA/GHD) was described.
    explanation: >-
      The clinical description this X-linked pattern is drawn from.

biochemical:

- name: Insulin-like growth factor 1 (IGF-1)
  context: >-
    The principal biochemical readout of GH receptor signalling and, with
    IGFBP-3, the first-line screening test recommended before a formal GH
    stimulation test. Low in the untreated state and rising normally with
    exogenous GH in the receptor-intact subtypes modeled here (types IB,
    II, III) - the opposite pattern to Growth_Hormone_Insensitivity_Syndrome,
    where IGF-1 stays low despite GH replacement because the receptor
    itself is defective.
  presence: Low; normalizes with GH replacement
  biomarker_term:
    preferred_term: insulin-like growth factor 1
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Insulin-like growth factor I (IGF-I) and IGF-binding protein 3 were
      low (5.2 +/- 2.0 ng/mL and 0.42 +/- 0.13 microg/mL, respectively;
      mean +/- SD) but rose normally with GH treatment.
    explanation: >-
      The IGF-1 value and its normal rise on treatment in the type IB
      (GHRHR-null) cohort - the same quote used to evidence the "Loss of
      Growth Hormone Receptor Signalling" node, since this is the direct
      biochemical readout of that node's claim.

- name: IGF-binding protein 3 (IGFBP-3)
  context: >-
    Measured alongside IGF-1 as a complementary GH-axis biomarker; less
    dependent on nutritional status than IGF-1 alone, which is why
    diagnostic guidelines recommend both together.
  presence: Low; normalizes with GH replacement
  biomarker_term:
    preferred_term: insulin-like growth factor binding protein 3
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Insulin-like growth factor I (IGF-I) and IGF-binding protein 3 were
      low (5.2 +/- 2.0 ng/mL and 0.42 +/- 0.13 microg/mL, respectively;
      mean +/- SD) but rose normally with GH treatment.
    explanation: >-
      The IGFBP-3 value from the same sentence as the IGF-1 measurement
      above.

diagnosis:

- name: Growth hormone provocative (stimulation) stimulation testing
  description: >-
    The diagnostic core of this entry: types IB, II, and III are defined by
    a subnormal peak GH response to pharmacologic stimulation (GHRH,
    L-dopa, clonidine, arginine, insulin, glucagon, or macimorelin), unlike
    type IA, which is instead defined molecularly by complete absence of
    the GH1 gene product (see the type IA sibling entry). Practice varies
    substantially across countries: preferred stimulation tests and their
    GH cutoffs differ, priming with sex steroids before testing in
    peripubertal children is now recommended in a majority of surveyed
    countries (with differing protocols), and the clinical pretest criteria
    that qualify a child for testing are inconsistently defined. Height,
    IGF-1, and bone age are used as additional diagnostic parameters in
    some countries' guidelines, on top of the stimulation test itself.
  diagnosis_term:
    preferred_term: growth hormone stimulation test
  evidence:
  - reference: PMID:31707392
    reference_title: "GHD Diagnostics in Europe and the US: An Audit of National Guidelines and Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preferred GH stimulation tests and chosen cutoffs vary substantially.
      Overall, a trend to lowering the GH cutoff was identified. Priming is
      becoming more popular and now recommended in 5 out of 9 countries;
      however, with different protocols.
    explanation: >-
      Documents the international heterogeneity in stimulation-test choice,
      cutoff, and priming protocol - the basis for this node's caution
      against citing a single universal numeric cutoff.
  - reference: PMID:31707392
    reference_title: "GHD Diagnostics in Europe and the US: An Audit of National Guidelines and Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Height, IGF-1, and bone age are additional parameters recommended in
      some countries.
    explanation: >-
      Names the three additional parameters that supplement (but, per the
      same source, do not uniformly replace) the stimulation test itself.
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum GH did not respond to provocative stimuli (GHRH, L-dopa, or
      clonidine).
    explanation: >-
      A worked example of the stimulation-test result (non-response to
      three separate agents) in a molecularly confirmed type IB patient.

treatments:

- name: Recombinant Human Growth Hormone Replacement
  description: >-
    Standard therapy for types IB, II, and III, where the receptor is intact
    and there is no analogue of type IA's antibody-mediated treatment
    failure (that mechanism depends specifically on the immune system never
    having encountered endogenous GH, which is not the case here). Type IB
    patients characteristically show a positive growth response and
    immunologic tolerance to exogenous GH, exactly because some endogenous
    hormone was always present.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: growth hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Insufficient Circulating Growth Hormone
    treatment_effect: RESTORES
    description: >-
      Supplies exogenous GH to a system where the receptor is intact and
      immune tolerance to the hormone is already established, unlike type
      IA.
    evidence:
    - reference: PMID:9814493
      reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Insulin-like growth factor I (IGF-I) and IGF-binding protein 3 were
        low (5.2 +/- 2.0 ng/mL and 0.42 +/- 0.13 microg/mL, respectively;
        mean +/- SD) but rose normally with GH treatment.
      explanation: >-
        Documents a normal IGF-1 response to exogenous GH in the type IB
        (GHRHR-null) cohort, evidence of an intact receptor pathway.
  evidence:
  - reference: PMID:9814493
    reference_title: "Phenotype and genetic analysis of a syndrome caused by an inactivating mutation in the growth hormone-releasing hormone receptor: Dwarfism of Sindh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Insulin-like growth factor I (IGF-I) and IGF-binding protein 3 were
      low (5.2 +/- 2.0 ng/mL and 0.42 +/- 0.13 microg/mL, respectively;
      mean +/- SD) but rose normally with GH treatment.
    explanation: >-
      Direct evidence of treatment response in type IB.
  - reference: DOI:10.3390/endocrines5030025
    reference_title: "Isolated Growth Hormone Deficiency"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with GHD receive replacement therapy with daily injections of
      recombinant human GH (rhGH). RhGH therapy is effective in increasing
      short-term height gain and adult height in patients with GHD.
    explanation: >-
      Current (2024) confirmation that daily rhGH replacement is standard,
      effective therapy for GHD generally, which applies to this entry's
      receptor-intact subtypes.

- name: Long-Acting Weekly Growth Hormone Replacement
  description: >-
    Once-weekly recombinant GH formulations (somatrogon, somapacitan,
    lonapegsomatropin) reduce injection frequency from daily to weekly by
    extending the molecule's half-life (Fc-fusion, albumin-binding, or a
    transient prodrug linker, respectively), without changing the
    mechanism this entry's target_mechanisms edge already models for daily
    rhGH - they still supply exogenous GH to a receptor-intact system.
    Comparative trials test non-inferiority of weekly dosing against daily
    Genotropin on growth outcomes and treatment burden, rather than a
    different indication.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: growth hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: somatrogon
      term:
        id: NCIT:C152396
        label: Somatrogon

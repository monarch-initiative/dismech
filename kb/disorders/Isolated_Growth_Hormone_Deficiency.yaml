discussions:

- discussion_id: gap_type3_btk_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the actual genetic lesion responsible for the growth hormone
    deficiency component of X-linked hypogammaglobulinemia and isolated
    growth hormone deficiency (XLA/GHD, "Fleisher syndrome"), if it is not
    BTK itself?
  attaches_to:
  - pathophysiology#BTK-Region Xq21.3-q22 Genetic Lesion
  - genetic#BTK
  rationale: >-
    The clinical entity is well established and clearly X-linked, but the
    two molecular studies available on the founding kindred and a further
    three XLA/GHD patients both point away from BTK as the GHD-causing
    gene: BTK mRNA, protein, and coding sequence were normal in the original
    patient, and a contiguous deletion spanning the flanking region was
    explicitly excluded in three more patients. Type III is therefore
    curated with BTK as a RISK_FACTOR / locus marker rather than a
    CAUSATIVE gene for the GHD arm specifically, and the causal_link_type on
    this node's downstream edge is INDIRECT_UNKNOWN_INTERMEDIATES rather
    than DIRECT. No later molecular candidate for the actual GHD gene at
    this locus was found in the literature searched for this entry.
  evidence:
  - reference: PMID:7650402
    reference_title: "Molecular genetic analysis of X-linked hypogammaglobulinemia and isolated growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest that undescribed genes critical for B cell
      development and growth hormone production exist on the X chromosome.
    explanation: >-
      The original authors' own framing of the open question, over two
      decades before this entry was curated.
  proposed_experiments:
  - experiment_id: xla_ghd_locus_fine_mapping
    name: Whole-genome sequencing and fine mapping of remaining XLA/GHD kindreds
    description: >-
      Apply modern long-read sequencing and RNA-seq to XLA/GHD families
      (rather than the Southern-blot and cDNA-clone methods available at the
      time of the founding studies) to identify structural variants,
      regulatory-region lesions, or a second gene at Xq21.3-q22 that
      segregates with the GHD component independent of BTK status.

- discussion_id: gap_type2_mouse_pituitary_hypoplasia_human_extrapolation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the anterior pituitary hypoplasia and majority somatotroph loss
    seen in transgenic mice overexpressing the dominant-negative 17.5-kDa GH
    isoform actually occur to the same degree in human type II patients, or
    is the human disease driven predominantly by the (also demonstrated)
    secretory-granule-disruption arm without comparable cell loss?
  attaches_to:
  - pathophysiology#Anterior Pituitary Somatotroph Loss
  rationale: >-
    The somatotroph-destruction and pituitary-hypoplasia finding comes from
    a transgenic mouse model overexpressing the isoform, not from pituitary
    histology or imaging in human type II patients, who are diagnosed and
    followed clinically and biochemically rather than by pituitary biopsy.
    Mouse overexpression systems can produce isoform levels and expression
    patterns that do not match the heterozygous dosage in human patients
    (one mutant allele plus one normal allele, rather than an overexpression
    transgene), so the degree of somatotroph loss - as opposed to reversible
    secretory dysfunction - in human disease is not established by this
    evidence alone.
  proposed_experiments:
  - experiment_id: type2_pituitary_mri_volumetry
    name: Pituitary MRI volumetry in molecularly confirmed type II patients
    description: >-
      Compare anterior pituitary volume by MRI between type II patients
      (stratified by the specific GH1 variant and its reported
      splicing-enhancer strength) and type IB/unaffected relatives, to test
      whether structural pituitary hypoplasia is present in humans and
      whether it
      scales with predicted 17.5-kDa isoform dose as the mouse and cell data
      suggest.

notes: >-
  Scope relative to MONDO. MONDO:0000050 has seven child terms in its OAK
  relationship closure: the four requested here (types IA, IB, II, III) plus
  MONDO:0032567/MONDO:0032569 (types 4 and 5) and MONDO:0009879 (short
  stature due to a GH qualitative anomaly - Kowarski syndrome, bioinactive
  GH with normal or elevated immunoassayable GH but reduced bioactivity, a
  mechanistically distinct entity from the four quantitative-deficiency
  subtypes modeled here). These three are deliberately out of scope for this
  entry and not modeled as subtypes; a future curator extending this entry
  to types 4/5 or to Kowarski syndrome does not need to rediscover this via
  OAK.

  Type IA is deliberately not duplicated. It is fully curated in
  kb/disorders/Isolated_Growth_Hormone_Deficiency_Type_IA.yaml, which
  already declares parents: [Isolated Growth Hormone Deficiency, Growth
  Hormone Deficiency] pointing back at this entry - so the parent-child link
  is bidirectional even though `has_subtypes` cannot itself point at an
  external file. The `Type IA` block above is a pointer only (`subtype_term`
  plus enough evidence to justify its place in the classification), matching
  the pattern already used for Appendiceal_Neoplasm.yaml /
  Appendiceal_Neuroendocrine_Tumor.yaml and
  Growth_Hormone_Insensitivity_Syndrome.yaml / IGF1_Deficiency.yaml.

  Contrast with Growth_Hormone_Insensitivity_Syndrome (Laron syndrome and
  its molecular relatives) is stated in the top-level description and
  repeated on the shared "Loss of Growth Hormone Receptor Signalling" node,
  since it is the single most important disambiguation for this entry: GHIS
  has normal-to-high GH and a broken receptor/post-receptor signal; this
  entry has an intact receptor and a deficient ligand (or, for type III, a
  deficient somatotroph population by an unknown mechanism).

  Type III genetics is curated honestly rather than simply repeating MONDO's
  RO:0004003 BTK relationship. MONDO:0010615 asserts `relationship: RO:0004003
  HGNC:1133 ! BTK`, but the two molecular papers available on this locus
  (Stewart et al. 1995, Vorechovsky et al. 1994) both argue against BTK
  itself as the GHD-causing gene - BTK sequence and protein were normal in
  the founding kindred, and a contiguous deletion was excluded in three
  further patients. Rather than silently following the MONDO relationship
  or silently contradicting it, this entry curates BTK as `RISK_FACTOR`
  (not `CAUSATIVE`) for the GHD component, uses `INDIRECT_UNKNOWN_INTERMEDIATES`
  on the corresponding causal edge, and records the gap as an open
  `KNOWLEDGE_GAP` discussion with its own PMIDs, per the instruction in
  CLAUDE.md's design-decisions guidance to surface a decision that looks
  wrong or stale rather than silently contradict it.

  GHRHR is modeled here under Type IB (MONDO:0013006), not a separate Type
  IV, and that choice is a documented departure from part of the current
  literature rather than an oversight. Three independent facts are in
  tension: (1) the source issue explicitly asked for "type IB (GH1/GHRHR
  splice and missense)"; (2) MONDO:0013006's own `def:` text names both
  "the GH1 or GHRHR genes" as the material basis of type IB, and its
  synonym list includes "dwarfism of Sindh" - the exact
  GHRHR-founder-mutation kindred this entry cites (PMID:9814493) - while
  its structured
  `relationship: RO:0004003` edge names only GH1 (HGNC:4261); (3) MONDO
  separately maintains MONDO:0032567 "isolated growth hormone deficiency,
  type 4" (OMIM:618157), whose own `relationship: RO:0004003` edge names
  GHRHR (HGNC:4266) specifically, and a 2023 primary source on a GHRHR
  founder mutation (PMID:36960394) explicitly assigns GHRHR-caused disease
  to "type IV" while stating type IB is caused by GH1 alone - directly
  contradicting MONDO:0013006's own def: text in the same breath its
  abstract also contradicts itself on the OMIM number for type IB (612781
  vs. 617281 within one paragraph). This is therefore a genuine,
  unresolved classification ambiguity in the field/OMIM/MONDO literature,
  not a single wrong fact this entry can silently correct. Given the
  issue's explicit instruction and MONDO:0013006's own def:/synonym
  support, this entry keeps GHRHR under Type IB and leaves MONDO:0032567
  (type 4/IV) out of scope alongside type 5 (see the scope note above) -
  but flags this for a future MONDO curation pass that might split IB into
  a GH1-only entity and reassign GHRHR cases to type IV. Verified via
  `uv run runoak -i sqlite:obo:mondo info MONDO:0013006 MONDO:0032567 -O obo`.

  GeneReviews baseline: checked, not found. PubMed searches for
  "isolated growth hormone deficiency[TI] GeneReviews[TI]" and several
  broader variants returned only false positives (Temple syndrome,
  sepiapterin reductase deficiency, GLI3-related Pallister-Hall syndrome,
  PIK3CA-related overgrowth spectrum, GNAS inactivation disorders, G6PC3
  deficiency, AIP familial isolated pituitary adenomas) - the same
  false-positive pattern already recorded on the type IA sibling entry, now
  confirmed independently for the root term as well. No GeneReviews chapter
  on isolated GH deficiency appears to exist.

  Orphanet structured citation not available for this session. `just
  refresh-orphadata` failed with a checksum mismatch against the pinned
  manifest (the live Orphadata en_product1.xml no longer matches the sha256
  recorded in data/orphadata/MANIFEST.yaml) - an upstream drift issue
  unrelated to this curation, not something this entry's author should paper
  over by re-pinning the manifest unreviewed. Prevalence is instead sourced
  from PMID:12207163's PubMed abstract, with the parent-category caveat
  spelled out in the prevalence `notes`.

  HP:0034323 (Reduced circulating growth hormone concentration) is the
  correct CURIE for this concept; the type IA sibling entry's `notes` prose
  cites it as "HP:0034331," which is a typo in that file's free text (not a
  bound `term:`, so it did not fail validation there). Recorded here so the
  correct ID is not mistakenly copied from the wrong source in a future
  edit; not fixed in the sibling file as part of this PR, since it is
  free-text prose in a file this task did not otherwise touch.

  Deep research. A falcon (Edison/FutureHouse) provider run completed
  (research/Isolated_Growth_Hormone_Deficiency-deep-research-falcon.md). Its
  own reference validation reports 11/12 identifiers resolved (one DOI,
  10.17458/per.vol16.2018.dd.geneticmutationsghigf, cited 9 times in the
  report as "domene2018geneticmutationsin," failed to resolve against
  Crossref and DataCite and is NOT used anywhere in this entry), and only
  5/11 resolved references scored on topic (0 off topic, so the remainder
  are undecided rather than cleared) - `needs_review: true`. Every PMID and
  DOI actually cited in this file was independently found via direct PubMed
  E-utilities / Crossref search and fetched with `just fetch-reference`, not
  taken on trust from the falcon narrative; the one exception is
  DOI:10.3390/endocrines5030025 (Ibba et al. 2024), which the falcon report
  also surfaced and which this entry independently verified and fetched
  before citing. The falcon report's own gene table corroborates this
  entry's modeling choice for type III ("IGHD III - SOX3 or BTK, X-linked
  ... biologically heterogeneous and may not remain strictly isolated") and
  additionally names RNPC3 (minor-spliceosome) and occasionally GHSR as
  further, more recently reported IGHD genes; both are outside the four
  subtypes the source issue asked for and are deliberately not modeled here,
  recorded so a future extension does not need to rediscover them.


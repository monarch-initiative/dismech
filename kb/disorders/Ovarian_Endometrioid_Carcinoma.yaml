inheritance:
- name: Sporadic Somatic Origin
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: Most ovarian endometrioid carcinomas arise sporadically through somatic driver mutations (such as CTNNB1, PTEN, PIK3CA, ARID1A, and KRAS) or somatic MLH1 promoter hypermethylation in endometriosis-associated precursor epithelium.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common molecular abnormalities identified in ovarian ECs are somatic mutations of CTNNB1, the gene encoding β-catenin, and PTEN.
    explanation: Establishes that ovarian endometrioid carcinomas predominantly arise via somatic driver mutations.
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In sporadic tumors, MMR protein deficiency is frequently caused by inactivation of MLH1 by promoter hypermethylation
    explanation: Documents sporadic tumorigenesis including epigenetic MLH1 inactivation in non-hereditary ovarian endometrioid carcinomas.
- name: Autosomal Dominant Lynch Syndrome Subset
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: A clinically important hereditary subset arises via autosomal dominant germline mismatch-repair gene mutations (MLH1, PMS2, MSH2, or MSH6) in Lynch syndrome followed by a somatic second hit.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These patients are characterized by an inherited germline mutation in the DNA mismatch repair (MMR) protein genes MLH1, PMS2, MSH2, or MSH6 (“first hit”), but EC develops only after the deletion or mutation of the second corresponding allele (“second hit”).
    explanation: Documents the inherited germline MMR mutation ("first hit") and somatic second-hit mechanism in Lynch syndrome-associated ovarian endometrioid carcinoma.
  - reference: PMID:41425725
    reference_title: 'Molecular Pathology of Ovarian Endometrioid Carcinoma: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: OEC is enriched for Lynch syndrome-associated tumors, supporting routine MMR testing.
    explanation: Confirms enrichment of hereditary Lynch syndrome-associated tumors in OEC.

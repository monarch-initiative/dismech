    explanation: Documents the median age at presentation (51 years) and predominance of early-stage (FIGO stage I or II) diagnosis.
mechanistic_hypotheses:
- hypothesis_group_id: endometriosis_associated_progression_model
  hypothesis_label: Endometriosis-Associated Progression Model
  status: CANONICAL
  description: OEC arises from endometriosis through stepwise malignant transformation. The detection of shared somatic driver mutations (ARID1A loss, PIK3CA, PTEN, KRAS) in morphologically benign and atypical endometriotic lesions adjacent to OEC supports a precursor-to-carcinoma sequence in which atypical endometriosis is the precursor lesion of roughly 40% of endometrioid carcinomas.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Atypical endometriosis represents the precursor lesion of about 40% of ECs.
    explanation: De Leo et al. directly support atypical endometriosis as the precursor lesion for a large fraction of ovarian endometrioid carcinomas.
pathophysiology:

  description: Most OECs are associated with endometriosis or arise from endometrioid adenofibroma/borderline tumor, with atypical endometriosis serving as the precursor lesion. A direct transition from atypical ovarian endometriosis to carcinoma is substantiated by shared molecular alterations in tumor and adjacent endometriosis.

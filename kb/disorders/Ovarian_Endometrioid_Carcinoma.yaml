histopathology:
- name: Endometrioid Adenocarcinoma
  finding_term:
    preferred_term: endometrioid adenocarcinoma
    term:
      id: NCIT:C3769
      label: Endometrioid Adenocarcinoma
  description: OEC microscopically resembles uterine endometrioid adenocarcinoma, with glandular, cribriform, and/or villoglandular patterns of tall stratified columnar cells. Most are low-grade.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most ECs are low-grade carcinomas characterized by glandular, cribriform, and/or villoglandular patterns.
    explanation: De Leo et al. describe the defining low-grade glandular architecture of the endometrioid histotype.
- name: Squamous Differentiation
  finding_term:
    preferred_term: squamous differentiation
    term:
      id: NCIT:C38770
      label: Squamous Differentiation
  description: Squamous differentiation is a hallmark of endometrioid neoplasms and is a useful diagnostic feature distinguishing OEC from other ovarian histotypes.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Squamous differentiation is a hallmark of endometrioid neoplasms and represents a useful diagnostic feature
    explanation: De Leo et al. identify squamous differentiation as a diagnostic hallmark of endometrioid carcinoma.

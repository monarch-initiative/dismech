biochemical:
- name: Microsatellite Instability
  biomarker_term:
    preferred_term: microsatellite instability
    term:
      id: NCIT:C36318
      label: Microsatellite Instability
  notes: MSI/mismatch-repair-deficiency status, assessed by MMR immunohistochemistry (MLH1/MSH2/MSH6/PMS2) or PCR-based MSI testing, defines the MMRd molecular subtype, triages for Lynch syndrome, and predicts immune-checkpoint sensitivity.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The reported frequency of MSI in ovarian ECs ranges from 10% to 20%.
    explanation: De Leo et al. quantify MSI frequency in ovarian endometrioid carcinoma.
  - reference: PMID:41425725
    reference_title: 'Molecular Pathology of Ovarian Endometrioid Carcinoma: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: routine MMR immunohistochemistry (IHC) with reflex germline testing improves Lynch detection
    explanation: Supports routine MMR immunohistochemistry as a key diagnostic and Lynch-screening biomarker in OEC.
genetic:
- name: CTNNB1
  association: Activating somatic mutation
  gene_term:
    preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  notes: The most common molecular abnormality in OEC (38-53%); activates Wnt/beta-catenin signaling and is associated with low-grade tumors and favorable outcome.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common molecular abnormalities identified in ovarian ECs are somatic mutations of CTNNB1, the gene encoding β-catenin, and PTEN.
    explanation: De Leo et al. identify CTNNB1 as the most common recurrent driver in OEC.
- name: PTEN
  association: Loss-of-function mutation
  gene_term:
    preferred_term: PTEN
    term:
      id: hgnc:9588
      label: PTEN
  notes: Mutated in ~20% of OEC, frequently with 10q23 loss of heterozygosity, activating PI3K/AKT.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PTEN is a tumor suppressor gene located on chromosome 10q23.3 and is mutated in approximately 20% of ovarian EC.
    explanation: De Leo et al. quantify PTEN loss in ovarian endometrioid carcinoma.
- name: PIK3CA
  association: Activating mutation
  gene_term:
    preferred_term: PIK3CA
    term:
      id: hgnc:8975
      label: PIK3CA
  notes: Activating PIK3CA mutations occur in roughly 20-40% of OEC and trigger PI3K signaling.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PIK3CA mutations in exons 9 and 20 have been identified in 20% of ovarian ECs
    explanation: De Leo et al. quantify activating PIK3CA mutation frequency in OEC.
- name: ARID1A
  association: Loss-of-function mutation
  gene_term:
    preferred_term: ARID1A
    term:
      id: hgnc:11110
      label: ARID1A
  notes: SWI/SNF subunit; mutated/lost in ~30% of OEC and detectable in adjacent endometriosis, supporting an early precursor-lesion event.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in ARID1A (AT-rich interactive domain 1A gene), and loss of expression of the encoded protein BAF250a, occur in approximately 30% of EC
    explanation: De Leo et al. quantify ARID1A loss in ovarian endometrioid carcinoma.
- name: KRAS
  association: Activating mutation
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  notes: Recurrent MAPK-pathway activating mutation, also detectable in benign endometriotic lesions, supporting the precursor model.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'molecular alterations involve: the WNT/β-catenin signaling pathway (CTNNB1 mutations, 53%), the PI3K pathway (PIK3CA, 40%; PTEN, 17%), the MAPK pathway (KRAS, 33%), and the SWI/SNF complex (ARID1A, 30%)'
    explanation: De Leo et al. quantify the recurrent driver landscape of ovarian EC including KRAS.
- name: POLE
  association: Exonuclease-domain ultramutation
  gene_term:
    preferred_term: POLE
    term:
      id: hgnc:9177
      label: POLE
  notes: POLE exonuclease-domain mutations define the ultramutated subtype (~5%), which carries an excellent prognosis.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Analogous to the molecular subtypes of endometrial endometrioid carcinoma defined by The Cancer Genome Atlas (TCGA), four molecular classes of ovarian EC have been proposed: “ultramutated” due to POLE exonuclease domain mutations (~5%), “hypermutated” due to mismatch repair deficiency (MMRd)/microsatellite instability (MSI) (~13%), “TP53-mutated” (9–13%), and “no specific molecular profile” (NSMP; 69–73%).'
    explanation: De Leo et al. establish that POLE exonuclease domain mutations define the ultramutated molecular class (~5%) of ovarian endometrioid carcinoma.
  - reference: PMID:41425725
    reference_title: 'Molecular Pathology of Ovarian Endometrioid Carcinoma: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: POLEmut/MMRd subsets generally have excellent outcomes and are candidates for de-escalation or immunotherapy
    explanation: Yoshida and Kato establish the POLE-ultramutated molecular subtype in OEC and its excellent prognosis.
- name: TP53
  association: Loss-of-function somatic mutation
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  notes: Somatic TP53 mutations define the TP53-mutated / p53-abnormal molecular subtype (9-13% of OEC), associated with high-grade histology, greater genomic complexity, advanced FIGO stage at diagnosis, and inferior survival.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Analogous to the molecular subtypes of endometrial endometrioid carcinoma defined by The Cancer Genome Atlas (TCGA), four molecular classes of ovarian EC have been proposed: “ultramutated” due to POLE exonuclease domain mutations (~5%), “hypermutated” due to mismatch repair deficiency (MMRd)/microsatellite instability (MSI) (~13%), “TP53-mutated” (9–13%), and “no specific molecular profile” (NSMP; 69–73%).'
    explanation: Establishes the TP53-mutated molecular subtype (9-13%) of ovarian endometrioid carcinoma.
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A recent study has identified clinically distinct EC subtypes: cases with TP53 mutation demonstrate greater genomic complexity, are commonly FIGO stage III/IV at diagnosis (48%), are frequently incompletely debulked (44%) and demonstrate inferior survival'
    explanation: Documents genomic complexity, advanced stage at diagnosis, and inferior survival in TP53-mutated ovarian endometrioid carcinoma.
diagnosis:
- name: Histopathologic and Immunohistochemical Biopsy Evaluation (PAX8/ER/PR Positive, WT1 Negative)
  diagnosis_term:
    preferred_term: biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  description: Histopathologic and immunohistochemical evaluation of ovarian tumor tissue shows diffuse positivity for PAX8, vimentin, estrogen receptor (ER), and progesterone receptor (PR) with negative or only focal WT1 expression, distinguishing OEC from high-grade and low-grade serous ovarian carcinomas.
  results: Diffuse PAX8, ER, and PR positivity with negative or only focal WT1 supports ovarian endometrioid carcinoma over serous carcinoma.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The immunohistochemical profile of EC includes diffuse positivity for PAX 8, Vimentin, Estrogen (ER), and Progesterone receptors (PR). Nuclear expression of β-catenin is present in a subset of ECs. Unlike HGSC, ECs are usually negative or only focal positive for WT1, p53, and p16.
    explanation: Defines the diagnostic immunohistochemical profile that separates ovarian endometrioid carcinoma from serous ovarian carcinomas.
- name: TCGA-Analogous Molecular Subtyping and Mismatch Repair Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Molecular classification into POLE-ultramutated (POLEmut), mismatch repair-deficient (MMRd), p53-abnormal (p53abn), and no specific molecular profile (NSMP) subgroups stratifies prognosis and guides therapeutic selection; routine MMR immunohistochemistry or MSI testing also screens for Lynch syndrome.
  results: Assignment to POLEmut, MMRd, p53abn, or NSMP molecular class and identification of mismatch repair deficiency.
  evidence:
  - reference: PMID:41425725
    reference_title: 'Molecular Pathology of Ovarian Endometrioid Carcinoma: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Integrating morphology with molecular classification refines diagnosis and prognostication: POLEmut/MMRd subsets generally have excellent outcomes and are candidates for de-escalation or immunotherapy, whereas p53abn/high-grade tumors carry a poorer prognosis'
    explanation: Supports molecular classification of ovarian endometrioid carcinoma for prognostic stratification and treatment selection.
  - reference: PMID:41425725
    reference_title: 'Molecular Pathology of Ovarian Endometrioid Carcinoma: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: OEC is enriched for Lynch syndrome-associated tumors, supporting routine MMR testing.
    explanation: Supports routine mismatch repair testing in ovarian endometrioid carcinoma.
differential_diagnoses:
- name: High-Grade Serous Ovarian Adenocarcinoma
  disease_term:
    preferred_term: ovarian serous adenocarcinoma
    term:
      id: MONDO:0005211
      label: ovarian serous adenocarcinoma
  description: High-grade ovarian endometrioid carcinoma can morphologically mimic high-grade serous carcinoma (particularly the solid, pseudo-endometrioid, and transitional SET variant); absence of diffuse WT1 expression and presence of squamous or endometrioid differentiation help distinguish OEC.
  distinguishing_features:
  - Negative or only focal WT1 immunostaining in ovarian endometrioid carcinoma versus diffuse WT1 positivity in serous carcinoma
  - Squamous differentiation and association with endometriosis in ovarian endometrioid carcinoma
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: High-grade ECs are poorly differentiated tumors characterized by solid growth, markedly atypical cells, and high mitotic activity. These tumors should be distinguished from SET variant of HGSC
    explanation: Documents the close morphologic overlap between high-grade ovarian endometrioid carcinoma and the SET variant of high-grade serous carcinoma.
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Unlike HGSC, ECs are usually negative or only focal positive for WT1, p53, and p16.
    explanation: Establishes WT1 negativity as a key immunohistochemical discriminator from high-grade serous ovarian carcinoma.
- name: Endometrial Endometrioid Adenocarcinoma
  disease_term:
    preferred_term: endometrial endometrioid adenocarcinoma
    term:
      id: MONDO:0006192
      label: endometrial endometrioid adenocarcinoma
  description: Synchronous endometrial endometrioid carcinoma occurs in 15-20% of ovarian endometrioid carcinoma cases, requiring clinicopathologic distinction between independent synchronous primaries and ovarian metastasis from an endometrial primary.
  distinguishing_features:
  - Endometriosis precursor lesion in the ovary supports primary ovarian endometrioid carcinoma
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The tumors are bilateral in 20% of cases and are associated in 15–20% of cases with a synchronous endometrial carcinoma.
    explanation: Documents the frequent co-occurrence of endometrial carcinoma that must be distinguished during diagnostic staging.
- name: Ovarian Clear Cell Adenocarcinoma
  disease_term:
    preferred_term: ovarian clear cell adenocarcinoma
    term:
      id: MONDO:0006045
      label: ovarian clear cell adenocarcinoma
  description: Ovarian clear cell adenocarcinoma shares an origin from endometriosis and recurrent ARID1A mutations with ovarian endometrioid carcinoma, and clear cytoplasm in ovarian endometrioid carcinoma can mimic clear cell histology.
  distinguishing_features:
  - Diffuse ER and PR positivity and CTNNB1/MSI alterations favor ovarian endometrioid carcinoma over clear cell carcinoma
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Remarkably, the presence of clear cytoplasm should not be used as the main diagnostic criterion of CCC since other ovarian tumor histotypes (i.e., EC and HGSC) may display clear cells.
    explanation: Documents the histologic overlap of clear cytoplasmic change between ovarian endometrioid carcinoma and ovarian clear cell carcinoma.
treatments:
- name: Cytoreductive Surgery
  description: Standard initial management includes total hysterectomy with bilateral salpingo-oophorectomy, omentectomy, and surgical staging. OEC is often diagnosed at an early stage, supporting surgery-centered management of localized disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:40690248
    reference_title: 'Ovarian Cancer: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: First-line treatment for early-stage ovarian cancer, defined as limited to the ovary or fallopian tube (stage I) or confined to the pelvis (stage II), is surgery (hysterectomy, bilateral salpingo-oophorectomy, omentectomy, and lymphadenectomy), followed by adjuvant chemotherapy (carboplatin and paclitaxel).
    explanation: Caruso et al. document total hysterectomy, bilateral salpingo-oophorectomy, omentectomy, and surgical staging as first-line surgical management for early-stage ovarian carcinoma.
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most ECs are found at an early stage (FIGO stage I or II) at diagnosis.
    explanation: De Leo et al. document early-stage presentation that supports surgery-centered management of OEC.
- name: Carboplatin/Paclitaxel Chemotherapy
  description: Adjuvant or neoadjuvant carboplatin and paclitaxel chemotherapy is the standard first-line systemic therapy backbone following surgical staging or cytoreduction in epithelial ovarian carcinoma, including ovarian endometrioid carcinoma.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: NCIT:C1282
        label: Carboplatin
    - preferred_term: paclitaxel
      term:
        id: NCIT:C1411
        label: Paclitaxel
  evidence:
  - reference: PMID:40690248
    reference_title: 'Ovarian Cancer: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: First-line treatment for early-stage ovarian cancer, defined as limited to the ovary or fallopian tube (stage I) or confined to the pelvis (stage II), is surgery (hysterectomy, bilateral salpingo-oophorectomy, omentectomy, and lymphadenectomy), followed by adjuvant chemotherapy (carboplatin and paclitaxel).
    explanation: Establishes adjuvant carboplatin and paclitaxel as the standard first-line chemotherapy regimen following surgical staging in early-stage ovarian cancer.
  - reference: PMID:40690248
    reference_title: 'Ovarian Cancer: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Advanced-stage ovarian cancer may be treated with primary cytoreductive surgery (removal of all visible cancer in the abdominal cavity) and adjuvant chemotherapy (carboplatin and paclitaxel) or with neoadjuvant chemotherapy followed by cytoreductive surgery and adjuvant chemotherapy.
    explanation: Establishes carboplatin and paclitaxel as the standard systemic chemotherapy backbone for advanced-stage ovarian cancer.
- name: Immune Checkpoint Blockade
  description: Immune checkpoint inhibitors such as pembrolizumab are most relevant for the mismatch-repair-deficient/MSI-high subset of OEC, which is enriched for Lynch syndrome-associated tumors and shows high neoantigen load. Robust tumor-agnostic and endometrial-cancer evidence supports activity in MMRd/MSI-high gynecologic tumors.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  evidence:
  - reference: PMID:41425725
    reference_title: 'Molecular Pathology of Ovarian Endometrioid Carcinoma: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: POLEmut/MMRd subsets generally have excellent outcomes and are candidates for de-escalation or immunotherapy
    explanation: Yoshida and Kato support immunotherapy in the MMRd subset of OEC.
- name: Hormonal (Progestin) Therapy
  description: Progestin-based endocrine therapy may be considered for selected low-grade, hormone-receptor-positive, indolent, recurrent, or fertility-sparing cases, by analogy to endometrioid gynecologic tumors that often retain ER/PR expression.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: progestin
      term:
        id: NCIT:C776
        label: Progestin
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: The immunohistochemical profile of EC includes diffuse positivity for PAX 8, Vimentin, Estrogen (ER), and Progesterone receptors (PR).
    explanation: De Leo et al. document diffuse ER/PR positivity that provides the indirect biologic rationale for progestin endocrine therapy in hormone-receptor-positive OEC.

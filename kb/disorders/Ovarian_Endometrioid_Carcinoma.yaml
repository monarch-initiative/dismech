notes: 'Part of the Ovarian Adenocarcinoma histotype refactor (issue #4452, PR #4468): the umbrella ovarian adenocarcinoma entry is being split into per-histotype disease entries plus a grouping. This entry curates the endometrioid histotype (distinct from uterine endometrial endometrioid adenocarcinoma). No dedicated GeneReviews article exists for ovarian endometrioid carcinoma (hereditary predisposition in the mismatch-repair-deficient subset overlaps with Lynch syndrome). All seven driver genes in genetic (CTNNB1, PTEN, PIK3CA, ARID1A, KRAS, POLE, TP53) are wired into the pathophysiology graph with GO molecular_functions grounding.'

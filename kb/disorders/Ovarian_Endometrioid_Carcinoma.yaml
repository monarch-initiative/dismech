    snippet: Atypical endometriosis represents the precursor lesion of about 40% of ECs.
    explanation: Establishes atypical endometriosis as the precursor stage for roughly 40% of OECs.
- phase: Clinical presentation
  age_range: 26-87 years (median 51 years)
  notes: Most patients present in perimenopausal or early postmenopausal adulthood (median age 51 years) with localized FIGO stage I or II disease.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'

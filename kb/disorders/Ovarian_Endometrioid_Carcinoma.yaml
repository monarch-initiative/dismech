progression:
- phase: Precursor transition
  notes: Stepwise malignant progression from ovarian endometriosis and atypical endometriosis, which serves as the direct precursor lesion in approximately 40% of cases.
  evidence:
  - reference: PMID:33919741
    reference_title: 'What Is New on Ovarian Carcinoma: Integrated Morphologic and Molecular Analysis Following the New 2020 World Health Organization Classification of Female Genital Tumors.'
    supports: SUPPORT

- name: Sar1b knockdown in developing mouse neocortex
  species: Mouse
  genotype: In-utero electroporation knockdown of Sar1b, and expression of the CRD-associated hSAR1B p.D137N allele
  description: >-
    A targeted developmental-neurobiology experiment rather than a disease
    model. Sar1b knockdown impairs radial migration and callosal axon formation
    of cortical neurons, and the human D137N allele does the same, suggesting a
    cell-autonomous neural role for SAR1B independent of intestinal lipid
    absorption. Whether this contributes to the neurological findings in
    patients is untested; the recognised neurological complications of CRD are
    attributed to vitamin E deficiency.
  publication: PMID:33002559
  genes:
  - preferred_term: SAR1B
    term:
      id: hgnc:10535
      label: SAR1B
  notes: >-
    Deliberately not linked to a pathophysiology node. Doing so would assert a
    cell-autonomous neural mechanism in human CRD that no patient study
    supports, and would compete with the well-evidenced vitamin E pathway
    already curated.
  evidence:
  - reference: PMID:33002559
    reference_title: "Inhibition of Sar1b, the Gene Implicated in Chylomicron Retention Disease, Impairs Migration and Morphogenesis of Developing Cortical Neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our study reveals a cell-autonomous action of Sar1b, which is unrelated to lipid absorption from the gut, on the development of the cerebral cortex."
    explanation: States the finding and its explicit independence from the intestinal mechanism.
  - reference: PMID:33002559

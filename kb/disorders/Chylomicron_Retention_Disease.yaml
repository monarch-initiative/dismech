    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hepatic cytolysis (ALT < 40 mmol/L) Infancy to late childhood - (60 ± 20) transient or permanent 95%"
    explanation: Cohort table records mildly raised ALT in 95% of patients.

name: Chylomicron Retention Disease
creation_date: '2026-09-05T18:20:00Z'
category: Mendelian
description: >
  Chylomicron retention disease (CRD, Anderson disease) is an ultra-rare
  autosomal recessive disorder of intestinal lipoprotein secretion caused by
  biallelic pathogenic variants in SAR1B. SAR1B encodes the small GTPase that
  nucleates assembly of the COPII coat at endoplasmic reticulum exit sites.
  Enterocytes of affected individuals lipidate apolipoprotein B-48 and build
  chylomicrons normally, but cannot bud the pre-chylomicron transport vesicles
  that carry them from the endoplasmic reticulum to the Golgi; chylomicrons
  therefore accumulate inside the enterocyte in cytoplasmic droplets and
  membrane-bound lipoprotein-sized compartments instead of being secreted into
  intestinal lymph. Infants present in the first six months with chronic
  malabsorptive diarrhoea, steatorrhoea, vomiting, abdominal distension and
  failure to thrive. The biochemical signature is marked hypocholesterolaemia
  with low LDL, low HDL and low apolipoprotein B but normal or near-normal
  fasting triglycerides, together with an absent postprandial chylomicron
  response and deficiency of the fat-soluble vitamins, most severely vitamin E.
  The normal fasting triglyceride level is the feature that most reliably
  separates CRD from abetalipoproteinemia and from homozygous
  APOB-related hypobetalipoproteinemia, in which hepatic VLDL secretion also
  fails. Endoscopy shows a white "gelee blanche" duodenal mucosa and biopsy
  shows lipid-laden enterocytes with preserved villus architecture. Untreated
  or late-treated disease is complicated by vitamin E-dependent neuromuscular
  and ophthalmological disease, poor bone mineralisation, coagulopathy,
  elevated creatine kinase and, in a minority of adults, cardiomyopathy.
  Treatment is lifelong restriction of long-chain dietary fat with adequate
  calories and essential fatty acids, plus high-dose fat-soluble vitamin
  supplementation; there is no therapy that restores COPII-dependent
  chylomicron export.
disease_term:
  preferred_term: chylomicron retention disease
  term:
    id: MONDO:0009528
    label: chylomicron retention disease
synonyms:
- Anderson disease
- Anderson's disease
- CRD
- CMRD
- FHBL-SD3
- hypobetalipoproteinemia with accumulation of apolipoprotein B-like protein in intestinal cells
parents:
- Hypobetalipoproteinemia
notes: >-
  This entry is restricted to SAR1B-related chylomicron retention disease. It is
  deliberately kept separate from the two sibling entries it is most often
  confused with. Abetalipoproteinemia (MTTP) abolishes lipidation of apoB in
  both enterocyte and hepatocyte, so triglycerides are very low and
  acanthocytosis is prominent; homozygous APOB-related hypobetalipoproteinemia
  removes the apoB scaffold itself. CRD leaves hepatic VLDL and apoB-100
  secretion largely intact, which is why fasting triglycerides stay normal and
  LDL remains detectable though reduced. No mechanism module in kb/modules/ was
  a genuine match: enterocyte_polarity_trafficking_failure scopes itself to the
  congenital enteropathies in which villus architecture is lost and diarrhoea
  does not remit on dietary elimination, and CRD has neither feature;
  hepatic_steatosis_lipotoxicity asserts progression through steatohepatitis to
  fibrosis, which the CRD guideline review explicitly did not observe. A COPII
  or ER-export trafficking module would be the natural conformance target and
  does not yet exist.

histopathology:
- name: Lipid-laden enterocytes with preserved villus architecture
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Duodenal or jejunal biopsy taken after dietary fat exposure shows
    enterocytes distended by large free cytoplasmic lipid droplets and by
    membrane-bound lipoprotein-sized particles. Villus architecture is normal,
    which separates CRD from the congenital enteropathies that destroy the
    absorptive surface. Because the finding is fat-load dependent, a biopsy
    taken on a fat-restricted diet can be falsely reassuring.
  finding_term:
    preferred_term: Cytoplasmic lipid accumulation in enterocytes
    term:
      id: NCIT:C36185
      label: Steatosis
  evidence:
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Upper endoscopy and histology reveal fat-laden enterocytes whereas vitamin E deficiency is invariably present."
    explanation: The guideline records fat-laden enterocytes as the constant histological finding.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enterocyte vacuolization, chylomicron-like Infancy (1 to 6 m) permanent? Fat load dependent 100%"
    explanation: >-
      Cohort table records the finding in 100% of patients and states that it is
      fat-load dependent, which is the caveat in the description.
  - reference: PMID:31253576

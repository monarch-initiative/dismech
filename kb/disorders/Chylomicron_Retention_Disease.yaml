    evidence:
    - reference: PMID:17945526
      reference_title: "Anderson or chylomicron retention disease: molecular impact of five mutations in the SAR1B gene on the structure and the functionality of Sar1b protein."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The 2 missense mutations found in the 5 French-Canadian families had already been described in the eight previously published mutations: c.409G>A (p.Asp137Asn) and c.537T>A (p.Ser179Arg)."
      explanation: Reports two of the recurrent missense alleles named in the description.
    - reference: PMID:31253576
      reference_title: Novel mutations of SAR1B gene in four children with chylomicron retention disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Case 2, a 4-year-old male, was found to be homozygous for a SAR1B missense variant"
      explanation: >-
        Documents a homozygous SAR1B missense allele, c.409 G>C p.(Asp137His),
        which the same sentence places at a highly conserved residue close to
        the Sar1b guanosine recognition site.
    - reference: PMID:17945526
      reference_title: "Anderson or chylomicron retention disease: molecular impact of five mutations in the SAR1B gene on the structure and the functionality of Sar1b protein."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL

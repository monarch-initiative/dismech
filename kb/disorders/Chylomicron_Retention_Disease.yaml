    - reference: PMID:31253576
      reference_title: Novel mutations of SAR1B gene in four children with chylomicron retention disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Case 3, a 6-year-old male, was found to be homozygous for an ∼6 kb deletion of the SAR1B gene, which eliminates exon 2; this deletion causes the loss of the ATG translation initiation codon in the SAR1B mRNA."
      explanation: Documents the exon 2 deletion and its effect on the initiation codon.
  - name: Missense SAR1B variants
    description: >
      Missense substitutions clustered around the guanine-nucleotide
      recognition site and the coat-interaction surfaces, including
      p.Asp137Asn, p.Ser179Arg and p.Gly185Val. Computational and structural

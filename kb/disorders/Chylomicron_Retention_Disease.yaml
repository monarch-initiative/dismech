genetic:
- name: SAR1B biallelic pathogenic variants
  gene_term:
    preferred_term: SAR1B
    term:
      id: hgnc:10535
      label: SAR1B
  association: Biallelic loss-of-function or function-disrupting germline variants
  relationship_type: CAUSATIVE

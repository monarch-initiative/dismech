- name: Sar1b morpholino knockdown zebrafish
  species: Zebrafish
  genotype: sar1b 5'UTR translation-blocking morpholino knockdown
  description: >-
    A developmental model. Sar1b-deficient larvae take dietary lipid into
    enterocytes normally but cannot clear it, reproducing the retention lesion,
    and they additionally show craniofacial cartilage, exocrine pancreas, liver
    and hindbrain deficits that are not part of the recognised human phenotype.
    Those extra phenotypes are the model's main caveat, and probably reflect
    global knockdown of a broadly expressed COPII component during development.
  publication: PMID:25559265

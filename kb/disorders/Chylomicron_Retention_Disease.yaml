differential_diagnoses:
- name: Abetalipoproteinemia
  description: >-
    MTTP-related abetalipoproteinemia abolishes lipidation of apoB in both the
    enterocyte and the hepatocyte, so hepatic VLDL secretion fails as well.
    Triglycerides are therefore very low rather than normal, apoB-containing
    lipoproteins are virtually absent rather than reduced, and acanthocytosis is
    prominent. Neurological and retinal disease is more severe. Both diseases
    show fat malabsorption, hypocholesterolaemia and fat-soluble vitamin
    deficiency, and both show lipid-laden enterocytes on biopsy, so the
    triglyceride level and the causal gene are what separate them.
  disease_term:
    preferred_term: abetalipoproteinemia
    term:
      id: MONDO:0008692
      label: abetalipoproteinemia
  distinguishing_features:
  - Fasting triglycerides are normal in chylomicron retention disease and very low in abetalipoproteinemia.
  - LDL and apoB-100 remain detectable in chylomicron retention disease because hepatic secretion is preserved.
  - Acanthocytosis is characteristically absent in chylomicron retention disease and prominent in abetalipoproteinemia.
  - Biallelic SAR1B variants establish chylomicron retention disease; biallelic MTTP variants establish abetalipoproteinemia.
  evidence:
  - reference: PMID:31253576
    reference_title: Novel mutations of SAR1B gene in four children with chylomicron retention disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "may be due to biallelic mutations in APOB (homozygous FHBL type-1), MTTP (abetalipoproteinemia), or SAR1B (chylomicron retention disease)"
    explanation: Separates the three phenocopies by causal gene.
  - reference: PMID:27266643
    reference_title: "Chylomicron retention disease: A rare cause of chronic diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is characterized by normal fasting serum triglyceride levels combined with the absence of apolipoprotein (apo) B48 and chylomicrons after a fat load."
    explanation: Gives the normal fasting triglyceride that is the key biochemical discriminator.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No acantocytosis Infancy (1 to 6 m) transit or permanent 90%"
    explanation: Records absence of acanthocytosis as a highly discriminative feature of chylomicron retention disease.
  - reference: PMID:36771214
    reference_title: Validation of Knock-Out Caco-2 TC7 Cells as Models of Enterocytes of Patients with Familial Genetic Hypobetalipoproteinemias.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MTTP silencing led to a more severe phenotype than SAR1B silencing, which is consistent with clinical observations."
    explanation: Supports the statement that abetalipoproteinemia is the more severe of the two.
- name: Familial hypobetalipoproteinemia
  description: >-
    Biallelic APOB variants remove the apoB scaffold itself and produce a
    clinical and biochemical picture close to abetalipoproteinemia, including
    very low triglycerides. Unlike either recessive disease, heterozygous
    APOB-related hypobetalipoproteinemia gives roughly half-normal apoB and LDL
    in the parents and rarely causes infantile malabsorption.
  disease_term:
    preferred_term: hypobetalipoproteinemia
    term:
      id: MONDO:0017774
      label: hypobetalipoproteinemia
  distinguishing_features:
  - Biallelic APOB variants establish familial hypobetalipoproteinemia; biallelic SAR1B variants establish chylomicron retention disease.
  - Parents of a chylomicron retention disease proband have an entirely normal fasting lipid profile, whereas APOB heterozygotes have reduced apoB and LDL.
  evidence:
  - reference: PMID:31253576
    reference_title: Novel mutations of SAR1B gene in four children with chylomicron retention disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "may be due to biallelic mutations in APOB (homozygous FHBL type-1), MTTP (abetalipoproteinemia), or SAR1B (chylomicron retention disease)"
    explanation: Separates the causal genes of the three severe hypobetalipoproteinaemias.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normal Fasting lipids in parents 100%"
    explanation: >-
      Normal parental lipids in every chylomicron retention disease family is
      the family-level discriminator from APOB-related disease.

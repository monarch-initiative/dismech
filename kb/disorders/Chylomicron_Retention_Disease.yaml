    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Larvae form enterocyte lipid droplets after feeding and then fail to clear
      them during fasting, which is the retention phenotype in a live animal.
    limitations: >-
      Global morpholino knockdown during development produces craniofacial,
      pancreatic, hepatic and neuronal deficits that are not features of human
      CRD, so the model over-reports the developmental consequences of SAR1B
      loss. Zebrafish lipoprotein physiology also differs from the human.
    readouts:

treatments:
- name: Low-long-chain-fat diet with adequate calories and essential fatty acids
  therapeutic_modality: BEHAVIORAL
  action_category: THERAPEUTIC
  description: >-
    The core of management. Long-chain fat is restricted enough to control
    diarrhoea, vomiting and abdominal distension, while total calories and
    essential fatty acid intake are kept sufficient for growth; medium-chain
    triglycerides may be used because they reach the portal circulation without
    chylomicron packaging. Over-restriction is a real hazard, because essential
    fatty acid deficiency is already severe early in life. The treatment
    controls the consequences of the trafficking defect and does not correct it,
    so symptoms recur when fat is reintroduced.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
    dietary_modifications:
    - action: RESTRICT
      description: Restriction of long-chain dietary fat, sufficient to control the gastrointestinal symptoms.
    - action: ADD
      description: >-
        Maintenance of essential fatty acid intake, with polyunsaturated fat as
        the fat source, and optional medium-chain triglycerides as a
        chylomicron-independent calorie source.
  target_mechanisms:
  - target: Intestinal Fat Malabsorption
    treatment_effect: MODULATES
    description: >-
      Reducing the long-chain fat load reduces the amount of lipid the
      enterocyte cannot export, so the malabsorptive symptoms remit. The
      transport defect itself is untouched.
    evidence:
    - reference: PMID:20920215
      reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Vomiting, diarrhea and abdominal distension improve on a low-long chain fat diet."
      explanation: Directly links the dietary intervention to remission of the malabsorptive symptoms.
  evidence:
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ensure adequate caloric intake with a low-fat diet (<30% of total calories from fat) enriched in essential fatty acids with or without medium-chain triglycerides"
    explanation: GeneReviews gives the dietary prescription including the essential fatty acid and medium-chain triglyceride components.
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Avoidance of fatty foods, particularly those rich in long-chain fatty acids."
    explanation: GeneReviews names long-chain-fat-rich foods as the exposure to avoid.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dietary counseling is needed not only to monitor fat intake and improve symptoms, but also to maintain sufficient caloric and EFA intake."
    explanation: Supports the warning that restriction must be balanced against calorie and essential fatty acid needs.
- name: High-dose oral vitamin E supplementation
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  description: >-
    Large oral doses of vitamin E, around 50 IU/kg/day, given lifelong. The
    important and slightly counter-intuitive point is that the oral route works
    for preventing neurological complications even though plasma tocopherol
    never normalises: the aim is tissue protection, not a normal blood level.
    Tocofersolan, a water-soluble tocopherol derivative, is better absorbed than
    tocopheryl acetate in CRD, though a four-month crossover study found no
    significant difference in plasma tocopherol between the two formulations.
  treatment_term:
    preferred_term: high-dose fat-soluble vitamin supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: alpha-tocopherol
      term:
        id: CHEBI:22470
        label: alpha-tocopherol
  target_mechanisms:
  - target: Fat-Soluble Vitamin Deficiency
    treatment_effect: MODULATES
    description: >-
      Oral replacement partially offsets the delivery failure. It does not
      restore a normal plasma concentration, because absorption still depends on
      the blocked chylomicron pathway.
    evidence:
    - reference: PMID:20920215
      reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Despite fat malabsorption and the absence of postprandial chylomicrons, the oral route can prevent neurological complications even though serum levels of vitamin E remain chronically low."
      explanation: States both that the intervention works and the limit on what it achieves biochemically.
  - target: Vitamin E-Dependent Neuroaxonal and Retinal Injury
    treatment_effect: INHIBITS
    description: >-
      Adequate vitamin E status is the determinant of whether the neurological
      complications occur.
    evidence:
    - reference: PMID:20920215
      reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "However, the vitamin E deficiency status plays a pivotal role in preventing neurological complications."
      explanation: Makes vitamin E status the pivotal variable for the neurological outcome.
  evidence:
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "high-dose oral fat-soluble vitamins, including vitamin E (hydrosoluble form) 50 IU/kg/d"
    explanation: GeneReviews gives the vitamin E dose and specifies the hydrosoluble form.
  - reference: PMID:30021760
    reference_title: Efficacy of two vitamin E formulations in patients with abetalipoproteinemia and chylomicron retention disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, bioavailabilities were higher in patients with CMRD (tocofersolan, 24.7%; α-tocopherol acetate, 11.4%)."
    explanation: Quantifies the better absorption of tocofersolan in CRD specifically.
  - reference: PMID:30021760
    reference_title: Efficacy of two vitamin E formulations in patients with abetalipoproteinemia and chylomicron retention disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma concentrations of α-tocopherol at 4 months were not significantly different by formulation type in ABL or CMRD."
    explanation: >-
      The crossover endpoint found no significant difference between
      formulations, which is the caveat stated in the description.
- name: Vitamin A, D and K supplementation
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  description: >-
    Vitamin A around 15,000 IU/day, vitamin D 800-1200 IU/day and vitamin K
    15 mg/week, adjusted against plasma concentrations, INR and toxicity risk.
    Unlike vitamin E, these three can usually be brought into the normal range
    by supplementation. Vitamin A dosing needs a specific pregnancy caveat.
  treatment_term:
    preferred_term: fat-soluble vitamin supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: vitamin A
      term:
        id: CHEBI:12777
        label: vitamin A
    - preferred_term: vitamin D
      term:
        id: CHEBI:27300
        label: vitamin D
    - preferred_term: phylloquinone
      term:
        id: CHEBI:18067
        label: phylloquinone
  target_mechanisms:
  - target: Fat-Soluble Vitamin Deficiency
    treatment_effect: MODULATES
    description: >-
      Replaces the vitamins whose chylomicron-dependent delivery has failed.
    evidence:
    - reference: PMID:20920215
      reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Vitamin A deficiency (N > 1.61 μmol/L) Infancy (1 to 6 m) - (0.8 ± 0.5) transit if supplementation 70%"
      explanation: >-
        The cohort table records vitamin A deficiency as transient with
        supplementation, which is the effect this link asserts.
  evidence:
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "vitamin A 15,000 IU/d, vitamin K 15 mg/week, and vitamin D 800-1200 IU/d"
    explanation: GeneReviews gives the three doses stated in the description.
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vitamin A excess can be harmful to the developing fetus."
    explanation: >-
      The pregnancy caveat: GeneReviews advises halving the vitamin A dose in
      women who are pregnant or planning pregnancy, with monitoring of levels.
  - reference: PMID:36243606
    reference_title: Guidance for the diagnosis and treatment of hypolipidemia disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We summarize the genetic basis of these disorders, provide guidance in their diagnosis and suggest treatment regimens including high dose fat-soluble vitamins as therapeutics."
    explanation: Contemporary multi-society guidance confirms high-dose fat-soluble vitamins as the treatment class.
- name: Lifelong multisystem surveillance
  therapeutic_modality: BEHAVIORAL
  action_category: MONITORING
  description: >-
    Annual growth, dietary, gastrointestinal and neurological assessment with
    lipid profile, liver function, blood count, INR and vitamins A, D and E.

review_notes: >-
  Created September 2026 from the GeneReviews chapter (PMID:35344313), the 2010
  two-centre diagnosis and management guideline (PMID:20920215), the two-cohort
  natural-history study (PMID:19285442) and the SAR1B molecular and model
  literature, with an Edison/falcon deep-research report as the survey layer
  (preflight PASS, 11/11 citations resolved). An Asta run was also performed but
  returned mostly off-topic papers and failed the Named Entity Confusion
  preflight (SAR1B mentioned twice, APOBEC1 six times); only its two genuinely
  on-topic Levy reviews were used, and no claim rests on Asta alone.

  Three modelling decisions a reviewer should check. First, no `conforms_to` was
  declared: the closest candidate modules each contradict a defining feature of
  CRD (see `notes`), and a COPII / ER-export trafficking module does not exist
  yet. Second, the hepatic and the oxidative/ER-stress branches are marked
  `mechanism_confidence: PROVISIONAL` because their human relevance is asserted
  by review and cell/animal work rather than demonstrated in patients. Third,
  the cortical-neuron knockdown study (PMID:33002559) is recorded as an animal
  model with no `modeled_mechanisms` link, deliberately: linking it would assert
  a cell-autonomous neural mechanism in human CRD that no patient study
  supports, alongside the well-evidenced vitamin E pathway.

  Known gaps. There is no population prevalence estimate, only a published case
  count, so the prevalence record uses CASES_IN_LITERATURE with a qualitative
  ULTRA_RARE band. Orphanet could not be cited because the Orphadata bulk XML is
  not present in this checkout and downloading it was out of scope. No
  interventional clinical trial specific to CRD was identified, so
  `clinical_trials` is empty. No CRD-specific dataset accession was identified,
  so `datasets` is empty. Genotype-phenotype correlation is explicitly absent in
  the largest series, which is why no allele-based subtypes were created.

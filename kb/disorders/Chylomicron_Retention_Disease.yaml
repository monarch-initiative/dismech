- name: SAR1A paralogue upregulation
  gene_term:
    preferred_term: SAR1A
    term:
      id: hgnc:10534
      label: SAR1A
  association: Compensatory intestinal upregulation that does not rescue the phenotype
  relationship_type: MODIFIER
  variant_origin: UNKNOWN
  notes: >-
    SAR1A is not a disease gene for CRD. It is recorded here because its
    behaviour explains two otherwise puzzling observations: patient duodenum
    upregulates SAR1A without clinical benefit, and in Caco-2 cells only the
    double SAR1A/SAR1B knockout abolishes chylomicron output. The residual
    export seen when SAR1B alone is lost is therefore paralogue-dependent.
  evidence:
  - reference: PMID:21235735
    reference_title: "Molecular analysis and intestinal expression of SAR1 genes and proteins in Anderson's disease (Chylomicron retention disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expression of the SAR1B gene in duodenal biopsies from an AD/CMRD patient was significantly decreased whereas the expression of the SAR1A gene was significantly increased, as compared to healthy individuals."
    explanation: Measures the paralogue upregulation in patient tissue.
  - reference: PMID:21235735
    reference_title: "Molecular analysis and intestinal expression of SAR1 genes and proteins in Anderson's disease (Chylomicron retention disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the increased expression of the SAR1A gene in AD/CMRD does not appear to compensate for the lack of the SAR1B protein"
    explanation: States that the upregulation is not compensatory in patients.
  - reference: PMID:28982670
    reference_title: "Understanding Chylomicron Retention Disease Through Sar1b Gtpase Gene Disruption: Insight From Cell Culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The absence of expected chylomicron production collapse may be because of the compensatory SAR1A elevation observed in our experiments."
    explanation: >-
      Attributes the residual chylomicron output after SAR1B deletion to SAR1A,
      which is the in-vitro counterpart of the patient observation.
diagnosis:
- name: Fasting lipid profile with apolipoprotein B
  diagnosis_term:
    preferred_term: blood chemistry measurement
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  description: >-
    The screening test in an infant with chronic diarrhoea and faltering
    growth. The pattern that should prompt SAR1B testing is a total and LDL
    cholesterol roughly half of normal, a low HDL cholesterol and a low
    apolipoprotein B, with a fasting triglyceride that is normal. A very low
    triglyceride points instead to abetalipoproteinemia or homozygous
    APOB-related hypobetalipoproteinemia.
  results: >-
    Low total, LDL and HDL cholesterol with low apolipoprotein B and a normal
    fasting triglyceride supports CRD but does not by itself distinguish it
    from the other monogenic hypocholesterolaemias.
  evidence:
  - reference: PMID:19285442
    reference_title: "Chylomicron retention disease: a long term study of two cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study provides new insights on the phenotypic expression of CRD over time and emphasizes the need to screen the lipid profile of infants with chronic diarrhea and failure to thrive."
    explanation: Explicitly recommends lipid screening in the presenting clinical context.
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected individuals typically have marked hypocholesterolemia, low plasma apolipoprotein B levels, normal-to-low plasma triglyceride levels, and low serum concentrations of fat-soluble vitamins (A, D, E, and K)."
    explanation: GeneReviews gives the biochemical pattern this test is looking for.
- name: Fat-soluble vitamin and creatine kinase measurement
  diagnosis_term:
    preferred_term: blood chemistry measurement
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  description: >-
    Plasma vitamins A, D and E, an INR as the functional readout of vitamin K
    status, and creatine kinase. Vitamin E deficiency is essentially invariable
    at diagnosis and creatine kinase is usually raised.
  results: >-
    A markedly low alpha-tocopherol with a raised creatine kinase in an infant
    with hypocholesterolaemia is strongly supportive.
  evidence:
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Creatine kinase (CK) is usually elevated and hepatic steatosis is common."
    explanation: Establishes creatine kinase as a routine part of the diagnostic laboratory set.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Upper endoscopy and histology reveal fat-laden enterocytes whereas vitamin E deficiency is invariably present."
    explanation: States that vitamin E deficiency is invariably present at diagnosis.
- name: Upper endoscopy with duodenal biopsy
  diagnosis_term:
    preferred_term: upper gastrointestinal endoscopy with duodenal biopsy
    term:
      id: NCIT:C78144
      label: Esophagogastroduodenoscopy
  description: >-
    Endoscopy performed after dietary fat exposure shows the white "gelee
    blanche" or hoar-frosting appearance of the duodenal mucosa, and biopsy
    shows lipid-laden enterocytes with normal villus architecture. Because both
    findings are fat-load dependent, an endoscopy done on a fat-restricted diet
    can be normal.
  results: >-
    A white duodenal mucosa with lipid-laden enterocytes on biopsy is highly
    supportive but is not a substitute for SAR1B sequencing.
  evidence:
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Endoscopy typically demonstrates a gelée blanche"
    explanation: GeneReviews names the characteristic endoscopic appearance.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "White duodenal mucosa Infancy (1 to 6 m) permanent? Fat load dependent 100%"
    explanation: >-
      The cohort table records the white mucosa in 100% of patients and states
      that it depends on fat load, which is the caveat in the description.

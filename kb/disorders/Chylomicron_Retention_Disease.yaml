animal_models:
- name: Sar1b CRISPR deletion and p.D137N knock-in mouse
  species: Mouse
  genotype: Sar1b exon 2 deletion or Sar1b p.D137N knock-in, heterozygous (homozygotes are lethal)
  background: C57BL/6N
  description: >-
    The only mammalian model of human SAR1B defects. Homozygous deletion or
    mutation is embryonic or perinatally lethal, so metabolic work has been done
    in heterozygotes even though human heterozygous carriers are asymptomatic.
    That genotype mismatch is the model's principal limitation. Heterozygotes
    nonetheless reproduce the gastrointestinal and lipid phenotype, and the
    homozygous embryos show intestinal lipid accumulation.
  publication: PMID:33964306
  genes:
  - preferred_term: SAR1B
    term:
      id: hgnc:10535
      label: SAR1B
  modeled_mechanisms:
  - target: Enterocyte Chylomicron Retention
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Homozygous embryos accumulate lipid in the intestine and heterozygotes
      fail to secrete chylomicrons after a lipid gavage.
    limitations: >-
      Homozygosity, the genotype that corresponds to human disease, is lethal in

inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic SAR1B pathogenic variants are required. Heterozygous parents are
    clinically and biochemically unremarkable, which is one reason a family
    history is usually absent and diagnosis is delayed.
  evidence:
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CMRD is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the mode of inheritance directly.
  - reference: PMID:17945526
    reference_title: "Anderson or chylomicron retention disease: molecular impact of five mutations in the SAR1B gene on the structure and the functionality of Sar1b protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anderson disease (and/or chylomicron retention disease-CMRD) is a rare, autosomic recessive disorder characterized by chronic diarrhea, failure to thrive, and hypocholesterolemia in childhood."
    explanation: A 15-patient case series describes the disorder as autosomal recessive.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normal Fasting lipids in parents 100%"
    explanation: >-
      In the two-centre cohort the fasting lipid profile of every parent was
      normal, consistent with clinically silent heterozygous carriage.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. Fewer than fifty cases had
    been published by 2011 and the literature has grown only slowly since;
    underdiagnosis is likely because the presenting symptoms are non-specific.
  evidence:
  - reference: PMID:21235735
    reference_title: "Molecular analysis and intestinal expression of SAR1 genes and proteins in Anderson's disease (Chylomicron retention disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "less than 50 cases having been reported in the literature"
    explanation: Gives the published case count as of 2011, the basis for the ultra-rare band.
  - reference: PMID:30021760
    reference_title: Efficacy of two vitamin E formulations in patients with abetalipoproteinemia and chylomicron retention disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abetalipoproteinemia (ABL) and chylomicron retention disease (CMRD) are extremely rare recessive forms of hypobetalipoproteinemia characterized by intestinal lipid malabsorption and severe vitamin E deficiency."
    explanation: Independently characterises CRD as extremely rare.
  - reference: PMID:38749523
    reference_title: "Chylomicron retention disease: a rare aetiology of failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CRD often presents with non-specific symptoms, resulting in delayed diagnosis which is established by genetic workup and histology from small intestinal biopsies."
    explanation: Supports the underdiagnosis note attached to this estimate.
progression:
- phase: Infancy
  age_range: First six months of life
  notes: >-
    Onset is in the first months of life with malabsorptive diarrhoea,
    steatorrhoea, vomiting, abdominal distension and faltering growth. The lipid
    profile is already abnormal at presentation.
  evidence:
  - reference: PMID:19285442
    reference_title: "Chylomicron retention disease: a long term study of two cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All CRD patients presented within the first few months of life with diarrhea and failure to thrive."
    explanation: Two independent cohorts place onset in the first months of life.
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "typically presents in infancy with failure to thrive, diarrhea, vomiting, abdominal distention, and malabsorption of fat"
    explanation: GeneReviews describes the infantile presenting syndrome.
- phase: Childhood on treatment
  age_range: After dietary treatment is started
  notes: >-
    Gastrointestinal symptoms remit on a low-long-chain-fat diet and recur if
    fat is reintroduced, so the response is dietary control rather than
    intestinal adaptation. Hypocholesterolaemia and low vitamin E persist
    despite supplementation.
  evidence:
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vomiting, diarrhea and abdominal distension improve on a low-long chain fat diet."
    explanation: Establishes the diet-responsive course of the gastrointestinal phase.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite fat malabsorption and the absence of postprandial chylomicrons, the oral route can prevent neurological complications even though serum levels of vitamin E remain chronically low."
    explanation: Records that vitamin E remains low even on effective oral treatment.
- phase: Late childhood to adulthood
  age_range: First to second decades onward
  notes: >-
    Complications of chronic fat-soluble-vitamin deficiency emerge in the first
    and second decades: neuromuscular signs, ophthalmological abnormalities,
    poor bone mineralisation and delayed bone maturation. Creatine kinase is
    commonly raised, and a minority of adults develop cardiomyopathy with a
    reduced ejection fraction. These complications are less severe than in
    abetalipoproteinemia, and early vitamin E replacement largely prevents them.
  evidence:
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "neuromuscular abnormalities (typically in the first or second decade of life) secondary to vitamin E deficiency"
    explanation: GeneReviews times the neuromuscular complications to the first two decades.
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "(in a small proportion of adults) cardiomyopathy with decreased ejection fraction"
    explanation: GeneReviews places cardiomyopathy in a minority of adults.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neurological and ophthalmologic complications in CRD are less severe than in other types of familial hypocholesterolemia."
    explanation: Contrasts the severity of late complications with the other monogenic hypocholesterolaemias.
pathophysiology:
- name: SAR1B Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic SAR1B variants remove or cripple the small Ras-superfamily GTPase
    that begins COPII coat assembly. Reported alleles include nonsense and
    frameshift changes and a whole-exon-2 deletion, all of which truncate the
    protein, and missense substitutions clustered around the guanine-nucleotide
    recognition and SEC23-interaction surfaces. The paralogue SAR1A, which
    differs at only twenty of 198 residues, is upregulated in patient duodenum
    but does not restore chylomicron export.
  genes:
  - preferred_term: SAR1B
    term:
      id: hgnc:10535
      label: SAR1B
  molecular_functions:
  - preferred_term: SAR1B GTPase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003924
      label: GTPase activity
  downstream:
  - target: Defective COPII Coat Assembly at Endoplasmic Reticulum Exit Sites
    causal_link_type: DIRECT
    description: >-
      SAR1B-GTP is the first coat component recruited to an ER exit site and is
      what brings SEC23-SEC24 to the membrane, so losing it disables coat
      nucleation.
    evidence:
    - reference: PMID:36594468
      reference_title: Cargo selection in endoplasmic reticulum-to-Golgi transport and relevant diseases.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SAR1 is a small GTPase that recruits other coat proteins to the ER membrane."
      explanation: States the step the mutated protein performs, which is the step this edge asserts is lost.
  - target: Impaired Intestinal HDL Biogenesis and Cholesterol Efflux
    causal_link_type: DIRECT
    description: >-
      A branch that does not run through chylomicron retention. SAR1B loss in
      enterocyte-like cells reduces cholesterol efflux and nascent HDL
      formation via reduced ABCA1 expression, which is the most likely
      explanation for the low HDL cholesterol seen in patients.
    evidence:
    - reference: PMID:28982670
      reference_title: "Understanding Chylomicron Retention Disease Through Sar1b Gtpase Gene Disruption: Insight From Cell Culture."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The decreased cholesterol efflux was associated with impaired expression of ABCA1 (ATP-binding cassette subfamily A member 1)."
      explanation: Links SAR1B deletion directly to the efflux and ABCA1 defect that underlies impaired HDL biogenesis.
  - target: Impaired Hepatic ApoB Lipoprotein Secretion
    causal_link_type: DIRECT
    description: >-
      A second extra-intestinal branch. Sar1B also promotes hepatic apoB
      lipoprotein secretion, which is the proposed explanation for the hepatic
      steatosis and the severity of the hypocholesterolaemia in a disease whose
      primary lesion is intestinal.
    evidence:
    - reference: PMID:24338480
      reference_title: The endoplasmic reticulum coat protein II transport machinery coordinates cellular lipid secretion and cholesterol biosynthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we show that Sar1B also promotes hepatic apolipoprotein (apo) B lipoprotein secretion and that this promoting activity is coordinated with the processes regulating apoB expression and the transfer of triglycerides/cholesterol moieties onto this large lipid transport protein."
      explanation: Demonstrates the hepatic arm of Sar1B function that this branch depends on.
  evidence:
  - reference: PMID:12692552
    reference_title: Mutations in a Sar1 GTPase of COPII vesicles are associated with lipid absorption disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we identify eight mutations in SARA2 that are associated with three severe disorders of fat malabsorption."
    explanation: The original identification of SAR1B (then SARA2) mutations as the cause of the fat-malabsorption phenotype.
  - reference: PMID:17945526
    reference_title: "Anderson or chylomicron retention disease: molecular impact of five mutations in the SAR1B gene on the structure and the functionality of Sar1b protein."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The nonsense mutation and the whole deletion of exon 2 produced truncated proteins, the missense mutations probably non-functional proteins."
    explanation: Structural and sequence analysis of five alleles supports loss of function as the shared consequence.
  - reference: PMID:36594468
    reference_title: Cargo selection in endoplasmic reticulum-to-Golgi transport and relevant diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The human SAR1A and SAR1B paralogs differ at only 20 of 198 amino acid residues."
    explanation: Quantifies the paralogue similarity that makes the failure of SAR1A compensation notable.
  - reference: PMID:21235735
    reference_title: "Molecular analysis and intestinal expression of SAR1 genes and proteins in Anderson's disease (Chylomicron retention disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the increased expression of the SAR1A gene in AD/CMRD does not appear to compensate for the lack of the SAR1B protein"
    explanation: Patient duodenal biopsies show that paralogue upregulation does not rescue the defect.
- name: Defective COPII Coat Assembly at Endoplasmic Reticulum Exit Sites
  biological_scale: MOLECULAR
  description: >
    At an ER exit site the transmembrane guanine-nucleotide exchange factor
    SEC12 loads SAR1B with GTP; SAR1B-GTP inserts an amphipathic helix into the
    ER membrane and recruits the SEC23-SEC24 inner coat, followed by the
    SEC13-SEC31 outer coat. SEC23 is also the GTPase-activating protein that
    triggers hydrolysis and coat turnover. A variant that blocks nucleotide
    exchange, hydrolysis, membrane insertion or SEC23 binding therefore
    disables coat assembly or coat cycling at this one step.
  biological_processes:
  - preferred_term: COPII coat assembly and vesicle budding at ER exit sites
    modifier: DECREASED
    term:
      id: GO:0090114
      label: COPII-coated vesicle budding
  cellular_components:
  - preferred_term: COPII vesicle coat
    term:
      id: GO:0030127
      label: COPII vesicle coat
  downstream:
  - target: Failed Pre-Chylomicron Transport Vesicle Export from the Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Without a functional coat, the carrier that would move pre-chylomicrons
      out of the ER is never formed.
    evidence:
    - reference: PMID:30640893
      reference_title: "Chylomicron retention disease: genetics, biochemistry, and clinical spectrum."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CRD patients present with SAR1B mutations, which disable the formation of coat protein complex II and thus blocks the transport of chylomicron cargo from the endoplasmic reticulum to the Golgi."
      explanation: States the causal step from failed COPII formation to blocked chylomicron cargo transport.
  evidence:
  - reference: PMID:36594468
    reference_title: Cargo selection in endoplasmic reticulum-to-Golgi transport and relevant diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GTP-bound SAR1 inserts its hydrophobic N-terminus into the ER membrane and recruits SEC23-SEC24 heterodimers to the ERES by directly interacting with SEC23"
    explanation: Describes the molecular step that SAR1B loss interrupts.
  - reference: PMID:36594468
    reference_title: Cargo selection in endoplasmic reticulum-to-Golgi transport and relevant diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SEC12 is a type II ER transmembrane protein that functions as a guanine nucleotide exchange factor (GEF) for SAR1 while also recruiting SAR1 to the ER membrane"
    explanation: Identifies the activation step upstream of coat nucleation.
  - reference: PMID:39062121
    reference_title: "Unraveling Chylomicron Retention Disease Enhances Insight into SAR1B GTPase Functions and Mechanisms of Actions, While Shedding Light of Intracellular Chylomicron Trafficking."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the essential role of coat protein complex II-coated vesicles and cargo receptors in chylomicron trafficking and endoplasmic reticulum (ER) exit sites"
    explanation: The most recent dedicated review places the lesion at COPII vesicles and ER exit sites.
- name: Failed Pre-Chylomicron Transport Vesicle Export from the Endoplasmic Reticulum
  biological_scale: CELLULAR
  description: >
    Newly assembled pre-chylomicrons are far larger than a conventional 60-90 nm
    COPII vesicle, so their export depends on COPII machinery being recruited to
    generate an enlarged carrier. In CRD that carrier is not produced, and the
    pre-chylomicron transport vesicle never reaches the Golgi. This is a
    trafficking failure and not an assembly failure: apoB-48 lipidation and
    chylomicron formation themselves are intact, which is what distinguishes CRD
    from abetalipoproteinemia at the cell-biological level.
  cell_types:
  - preferred_term: absorptive small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  locations:
  - preferred_term: duodenum
    term:
      id: UBERON:0002114
      label: duodenum
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi transport of pre-chylomicron vesicles
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  downstream:
  - target: Enterocyte Chylomicron Retention
    causal_link_type: DIRECT
    description: >-
      Cargo that cannot leave the endoplasmic reticulum compartment stays in the
      cell.
    evidence:
    - reference: PMID:25559265
      reference_title: Animal model of Sar1b deficiency presents lipid absorption deficits similar to Anderson disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistent with ANDD symptoms of chylomicron retention, we found that dietary lipids in Sar1b-deficient embryos accumulate in enterocytes."
      explanation: Sar1b depletion in vivo produces exactly the retention this edge asserts.
  evidence:
  - reference: PMID:12692552
    reference_title: Mutations in a Sar1 GTPase of COPII vesicles are associated with lipid absorption disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that chylomicrons, which vastly exceed the size of typical COPII vesicles, are selectively recruited by the COPII machinery for transport through the secretory pathways of the cell."
    explanation: Establishes that chylomicron export is a COPII-dependent process despite the size mismatch.
  - reference: PMID:28982670
    reference_title: "Understanding Chylomicron Retention Disease Through Sar1b Gtpase Gene Disruption: Insight From Cell Culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SAR1B deletion resulted in significantly decreased secretion of triglycerides (≈40%), apolipoprotein B-48 (≈57%), and chylomicron (≈34.5%)."
    explanation: Targeted SAR1B deletion in enterocyte-like cells reduces chylomicron output.
  - reference: PMID:28982670
    reference_title: "Understanding Chylomicron Retention Disease Through Sar1b Gtpase Gene Disruption: Insight From Cell Culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a double knockout of SAR1A and SAR1B was engineered in Caco-2/15 cells, which led to almost complete inhibition of triglycerides, apolipoprotein B-48, and chylomicron output"
    explanation: >-
      Only the double knockout abolishes output, showing the residual export in
      single SAR1B loss is paralogue-dependent rather than SAR1B-independent.
- name: Enterocyte Chylomicron Retention
  biological_scale: CELLULAR
  description: >
    Assembled chylomicrons and their triglyceride cargo accumulate inside the
    absorptive enterocyte, as free cytoplasmic lipid droplets and as
    membrane-bound lipoprotein-sized particles. This is the lesion the disease
    is named for and the finding a duodenal biopsy demonstrates. Villus
    architecture is preserved, so the malabsorption is a secretion defect and
    not mucosal destruction.
  cell_types:
  - preferred_term: absorptive small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: intestinal lipid transport into lymph
    modifier: DECREASED
    term:
      id: GO:0006869
      label: lipid transport
  downstream:
  - target: Absent Postprandial Chylomicronemia
    causal_link_type: DIRECT
    description: >-
      Lipid retained in the enterocyte is lipid that never enters intestinal
      lymph, so there is no chylomicron or apoB-48 rise after a fat meal.
    evidence:
    - reference: PMID:30640893
      reference_title: "Chylomicron retention disease: genetics, biochemistry, and clinical spectrum."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "there is a total absence of chylomicron and apolipoprotein B-48 in the blood circulation following a fat meal, accompanied by a deficiency in liposoluble vitamins and essential fatty acids"
      explanation: Connects the blocked export to the absent postprandial chylomicron response.
  - target: Intestinal Fat Malabsorption
    causal_link_type: DIRECT
    description: >-
      Dietary long-chain fat that the enterocyte cannot pass on is lost in the
      stool.
    evidence:
    - reference: PMID:33964306
      reference_title: Sar1b mutant mice recapitulate gastrointestinal abnormalities associated with chylomicron retention disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inefficient fat absorption in heterozygotes was confirmed via an increase in fecal lipid excretion."
      explanation: In the mouse model, blocked chylomicron secretion is accompanied by measured faecal fat loss.
  - target: Enterocyte Lipid Peroxidation and Endoplasmic Reticulum Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A proposed but not clinically validated branch: retained lipid is
      associated with oxidative and ER stress in cell and animal systems.
    evidence:
    - reference: PMID:39062121
      reference_title: "Unraveling Chylomicron Retention Disease Enhances Insight into SAR1B GTPase Functions and Mechanisms of Actions, While Shedding Light of Intracellular Chylomicron Trafficking."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "loss-of-function mutations not only predispose individuals to CRD but also exacerbate oxidative stress, inflammation, and ER stress, potentially contributing to clinical complications associated with CRD"
      explanation: >-
        The review asserts the association while marking the contribution to
        clinical complications as potential, which is why this edge is typed as
        indirect and the target node is flagged provisional.
  evidence:
  - reference: PMID:31253576
    reference_title: Novel mutations of SAR1B gene in four children with chylomicron retention disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated four children, each born from consanguineous parents, presenting with steatorrhea, malnutrition, accumulation of lipids in enterocytes, and severe hypocholesterolemia with an apparent recessive transmission."
    explanation: Records enterocyte lipid accumulation as the presenting histological finding in molecularly confirmed patients.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Upper endoscopy and histology reveal fat-laden enterocytes whereas vitamin E deficiency is invariably present."
    explanation: The diagnostic guideline records fat-laden enterocytes as the constant histological finding.
- name: Absent Postprandial Chylomicronemia
  biological_scale: ORGANISM
  description: >
    After an oral fat load there is no rise in plasma chylomicrons or apoB-48.
    Because chylomicrons are also the vehicle by which dietary cholesterol,
    essential fatty acids and the fat-soluble vitamins reach the circulation,
    this single transport failure accounts for the whole downstream biochemical
    phenotype. Hepatic VLDL and apoB-100 secretion continue, which is why LDL
    remains detectable and fasting triglycerides stay normal.
  downstream:
  - target: Fat-Soluble Vitamin Deficiency
    causal_link_type: DIRECT
    description: >-
      Vitamins A, D, E and K are absorbed with dietary fat and delivered in
      chylomicrons; with no chylomicron output their delivery fails.
    evidence:
    - reference: PMID:30640893
      reference_title: "Chylomicron retention disease: genetics, biochemistry, and clinical spectrum."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "there is a total absence of chylomicron and apolipoprotein B-48 in the blood circulation following a fat meal, accompanied by a deficiency in liposoluble vitamins and essential fatty acids"
      explanation: The same sentence links absent chylomicronaemia to liposoluble vitamin and essential fatty acid deficiency.
  - target: Essential Fatty Acid Deficiency
    causal_link_type: DIRECT
    description: >-

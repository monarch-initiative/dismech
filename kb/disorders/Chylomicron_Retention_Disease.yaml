  presence: ABSENT
  context: >-
    Acanthocytes are characteristically absent, in contrast with
    abetalipoproteinemia where acanthocytosis is a prominent clue. Their
    absence should not be used to exclude CRD.
  evidence:
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.

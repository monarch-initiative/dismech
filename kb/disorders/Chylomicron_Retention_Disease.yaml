        explanation: Reports the measured enterocyte lipid retention.
    evidence:
    - reference: PMID:25559265
      reference_title: Animal model of Sar1b deficiency presents lipid absorption deficits similar to Anderson disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sar1b depletion phenotype in zebrafish resembles Anderson disease deficits."

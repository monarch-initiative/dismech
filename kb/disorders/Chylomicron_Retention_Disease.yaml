  evidence:
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Every three years after age ten: liver ultrasound, neurologic exam with serum creatine kinase and electromyography, ophthalmologic evaluation, and DXA scan."
    explanation: GeneReviews gives the triennial surveillance schedule quoted in the description.
  - reference: PMID:35344313
    reference_title: Chylomicron Retention Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Every three to five years in adults: echocardiogram with assessment of ejection fraction."

biochemical:
- name: Absent postprandial chylomicrons and apolipoprotein B-48
  presence: ABSENT
  context: >-
    After an oral fat load there is no rise in plasma chylomicrons or apoB-48.
    This is the functional hallmark of the disease and was negative in every
    patient of the two-centre cohort.
  evidence:
  - reference: PMID:30640893
    reference_title: "Chylomicron retention disease: genetics, biochemistry, and clinical spectrum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "there is a total absence of chylomicron and apolipoprotein B-48 in the blood circulation following a fat meal"
    explanation: States the postprandial finding directly.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Negative Oral Fat Load Infancy (1 to 6 m) Permanent ? 100%"
    explanation: Every patient in the cohort had a negative oral fat load.
- name: Normal fasting triglyceride concentration
  presence: NORMAL
  context: >-
    Fasting triglycerides are normal or near-normal because hepatic VLDL
    secretion is preserved. This is the single most useful discriminator from
    abetalipoproteinemia and from homozygous APOB-related
    hypobetalipoproteinemia, in which the triglyceride is very low.
  evidence:
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normal TG § Infancy (1 to 6 m) transit or permanent 90%"
    explanation: Cohort table records a normal triglyceride in 90% of patients.
  - reference: PMID:27266643
    reference_title: "Chylomicron retention disease: A rare cause of chronic diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is characterized by normal fasting serum triglyceride levels combined with the absence of apolipoprotein (apo) B48 and chylomicrons after a fat load."
    explanation: Pairs the normal fasting triglyceride with the absent postprandial response as the defining combination.
  - reference: PMID:19285442
    reference_title: "Chylomicron retention disease: a long term study of two cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe hypocholesterolemia coupled with normal triglycerides"
    explanation: Independent cohort description of the same discriminating pattern.
- name: Low total, LDL and HDL cholesterol with low apolipoproteins A-I and B
  presence: DECREASED
  context: >-
    All three cholesterol fractions are reduced, together with apolipoprotein
    A-I and apolipoprotein B. The low HDL and low apoA-I are attributed to
    reduced intestinal HDL biogenesis rather than to the chylomicron block.
  evidence:
  - reference: PMID:19285442
    reference_title: "Chylomicron retention disease: a long term study of two cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe hypocholesterolemia coupled with normal triglycerides was associated with low LDL and HDL-cholesterol, as well as with low apolipoproteins A-I and B."
    explanation: Gives the complete lipoprotein and apolipoprotein pattern in two cohorts.
  - reference: PMID:30640893
    reference_title: "Chylomicron retention disease: genetics, biochemistry, and clinical spectrum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypocholesterolemia could be accounted for by a decrease in HDL cholesterol, likely a reflection of limited production of intestinal HDL in view of reduced ATP-binding cassette family A protein 1 and apolipoprotein A-I protein."
    explanation: Supplies the proposed mechanism for the HDL and apoA-I arm of the pattern.
- name: Low plasma alpha-tocopherol
  presence: DECREASED
  context: >-
    Plasma alpha-tocopherol is markedly reduced from infancy and, unlike
    vitamins A, D and K, is not normalised by supplementation. Measured mean
    concentration in the two-centre cohort was 2.7 micromol/L against a normal
    threshold above 18.4 micromol/L.
  evidence:
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vitamin E deficiency (N > 18.4 μmol/L) Infancy (1 to 6 m) - (2.7 ± 0.3) permanent 95%"
    explanation: Gives the normal threshold, the measured mean and the cohort frequency quoted in the context.
  - reference: PMID:20920215
    reference_title: Guidelines for the diagnosis and management of chylomicron retention disease based on a review of the literature and the experience of two centers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite fat malabsorption and the absence of postprandial chylomicrons, the oral route can prevent neurological complications even though serum levels of vitamin E remain chronically low."
    explanation: Supports the statement that supplementation does not normalise the plasma level.
- name: Hepatic cytolysis with elevated transaminases
  presence: INCREASED
  context: >-
    Mild elevation of alanine aminotransferase accompanies the hepatic
    steatosis and is common in the paediatric cohort.
  evidence:

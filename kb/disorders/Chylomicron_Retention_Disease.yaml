  variants:
  - name: Truncating SAR1B variants
    description: >
      Nonsense, frameshift and whole-exon deletion alleles predicted to produce
      an absent or severely truncated Sar1b protein. Reported examples include
      the exon 6 nonsense change p.Glu122X, the frameshifts p.Leu28ArgfsX7 and
      p.Asp48ThrfsX17, and a whole deletion of exon 2 that removes the

    snippet: "CMRD patients suffer from multiple neurological deficits, the etiologies of which remain unclear."
    explanation: >-
      The authors' framing of the open question, which is why this model is
      recorded without a mechanism link.
experimental_models:
- name: SAR1B knockout Caco-2/15 enterocyte model
  experimental_model_type: CELL_LINE
  description: >-
    Zinc-finger-nuclease deletion of SAR1B in Caco-2/15 cells, and a
    SAR1A/SAR1B double knockout. The single knockout reduces triglyceride,
    apoB-48 and chylomicron secretion by roughly a third to a half; only the
    double knockout abolishes output, which is how the residual export was
    traced to the SAR1A paralogue. The same system showed reduced HDL
    biogenesis and cholesterol efflux with impaired ABCA1 expression, which is
    the best available explanation for the low HDL of CRD.
  publication: PMID:28982670
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  modeled_mechanisms:
  - target: Failed Pre-Chylomicron Transport Vesicle Export from the Endoplasmic Reticulum
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Targeted SAR1B deletion in a differentiated enterocyte-like monolayer
      reduces chylomicron and apoB-48 output.
    limitations: >-
      Caco-2/15 is a transformed colonic adenocarcinoma line differentiated into
      an enterocyte-like phenotype, and the assay measures secretion into medium
      rather than into lymph, so it cannot report the systemic consequences.
    readouts:
    - name: Chylomicron and apolipoprotein B-48 secretion
      target: Failed Pre-Chylomicron Transport Vesicle Export from the Endoplasmic Reticulum
      direction: DECREASED
      interpretation: Direct measure of the export step lost in the disease.
      evidence:
      - reference: PMID:28982670
        reference_title: "Understanding Chylomicron Retention Disease Through Sar1b Gtpase Gene Disruption: Insight From Cell Culture."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "SAR1B deletion resulted in significantly decreased secretion of triglycerides (≈40%), apolipoprotein B-48 (≈57%), and chylomicron (≈34.5%)."
        explanation: Quantifies the secretion defect.
    evidence:

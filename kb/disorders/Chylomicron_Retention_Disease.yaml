    - function: COPII coat nucleation by the Sar1b GTPase
      description: Truncating alleles remove the protein, so no functional GTPase is available at ER exit sites.
      type: loss-of-function
    evidence:
    - reference: PMID:17945526
      reference_title: "Anderson or chylomicron retention disease: molecular impact of five mutations in the SAR1B gene on the structure and the functionality of Sar1b protein."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified three unique homozygous mutations of SAR1B gene in French families originated from Turkey, Algeria and Portugal: a stop codon in exon 6 (c.364G>T, p.Glu122X), a whole deletion of exon 2"
      explanation: Reports the nonsense and whole-exon-deletion alleles named in the description.
    - reference: PMID:21235735
      reference_title: "Molecular analysis and intestinal expression of SAR1 genes and proteins in Anderson's disease (Chylomicron retention disease)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two patients had a novel SAR1B mutation (p.Asp48ThrfsX17)."

genetic:
- name: LAMA5
  gene_term:
    preferred_term: LAMA5
    term:
      id: hgnc:6485
      label: LAMA5
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    Recorded as DISPUTED because the relationship rests on one unreplicated
    family: no second family with p.V3140M or this phenotype has been reported,
    and a later report by another group (PMID:33242826) states that the variant
    was also present in unaffected members of the family. The founding report
    is cached as an abstract only, so the segregation data could not be checked
    directly. Orphanet records LAMA5 as disease-causing for this entity
    (ORPHA:521450).

    No gene_disease_validity tier is recorded. ClinGen's Glomerulopathy GCEP
    classifies LAMA5 as Definitive for "LAMA5-related multisystemic syndrome"
    under this same MONDO identifier
    (CGGV:assertion_8afd69eb-1b10-4a25-b018-14cf0abf30af-2022-04-26T180000.000Z),
    but that assertion is autosomal recessive and is built on nine papers on
    biallelic LAMA5 variants with renal, neuromuscular, skeletal and
    developmental presentations; it does not include the dominant family
    described here. It classifies a different, recessive concept, so it is not
    this entry's classification.

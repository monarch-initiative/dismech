name: LAMA5-Related Multisystemic Syndrome
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- laminin subunit alpha 5-related multisystemic syndrome
description: >-
  An autosomal dominant multisystem disorder of the extracellular matrix
  described in a single three-generation family heterozygous for the LAMA5
  missense variant c.9418G>A (p.V3140M). LAMA5 encodes laminin alpha-5, the
  alpha chain of the laminin-511 and laminin-521 basement-membrane
  heterotrimers. The reported features span skin (delayed wound healing with
  atrophic scars, mild alopecia with dry and brittle hair), retina (rod
  degeneration with night blindness), skeletal muscle (degenerative myopathy
  with weakness, myalgia and cramps), joints (osteoarthritis and joint laxity),
  ligamentous support of internal organs (visceral prolapse, floating kidney),
  gut (malabsorption) and thyroid (hypothyroidism), with onset in infancy and a
  more severe phenotype reported in women than in men.

  The mechanistic evidence comes from the same family. In cells from affected
  individuals the variant changed the amount of LAMA5 peptides thought to arise
  from protein cleavage, Sonic hedgehog and GLI1 were upregulated, and COL1A1,
  MMP1 and MMP3 expression was strongly reduced. Skin biopsies showed an
  altered dermal papilla with a reduced germinative layer and early arrest of
  hair-follicle downgrowth, and a knock-in mouse made by the same group showed
  similar changes in the tissues examined. How these findings produce the
  retinal, muscular, intestinal and thyroid features has not been shown.
disease_term:
  preferred_term: LAMA5-related multisystemic syndrome
  term:
    id: MONDO:0033856
    label: LAMA5-related multisystemic syndrome
parents:
- hereditary disease
- Hereditary connective tissue disorder
notes: >-
  SCOPE: this entry is the entity MONDO:0033856 defines, which is Orphanet
  ORPHA:521450 (MONDO exactMatch): the autosomal dominant syndrome of the single
  family reported by Sampaolo et al. 2017 (PMID:28735299). MONDO marks the class
  as an n-of-one disease. Every clinical and mechanistic claim here is scoped to
  that family and its knock-in mouse; nothing is generalized from the recessive
  LAMA5 literature.

  The same MONDO identifier is also used by ClinGen for an autosomal recessive
  LAMA5 classification covering renal, neuromuscular, skeletal and
  developmental presentations (see the note on the genetic row). That is a
  different concept and is not curated here.

  ALLELIC LAMA5 DISORDERS curated elsewhere in dismech, not here: the recessive
  bent bone dysplasia (kb/disorders/LAMA5-Related_Bent_Bone_Dysplasia.yaml,
  MONDO:0859573) and LAMA5 presynaptic congenital myasthenic syndrome, which is
  covered inside kb/disorders/Congenital_Myasthenic_Syndrome.yaml (homozygous
  p.Arg2659Trp, PMID:28544784). Recessive LAMA5 nephrotic syndrome has no
  dismech entry. None of these shares the phenotype described here.

  The founding report is cached as its abstract only; the full text, which
  would give the pedigree, the number of affected and unaffected carriers, and
  the knock-in mouse details, was not retrievable. Phenotypes not named in the
  abstract (alopecia and hair changes, rod degeneration, myalgia, cramps,
  floating kidney) and the sex difference are taken from the Orphanet
  definition, which cites that paper.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, from a heterozygous variant in a three-generation
    family; Orphanet records the inheritance as autosomal dominant. A later
    paper by another group states that the variant was also found in
    unaffected family members, so penetrance in the family is not settled from
    the available sources.
  evidence:
  - reference: PMID:28735299
    reference_title: "Identification of the first dominant mutation of LAMA5 gene causing a complex multisystem syndrome due to dysfunction of the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The heterozygous LAMA5 mutation c.9418G>A (p.V3140M) was associated with skin anomalies, impaired scarring, night blindness, muscle weakness, osteoarthritis, joint and internal organs ligaments laxity, malabsorption syndrome and hypothyroidism."
    explanation: >-
      The founding report associates a heterozygous variant with the phenotype,
      which is the basis for dominant inheritance.

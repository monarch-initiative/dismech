pathophysiology:
- name: LAMA5 p.V3140M Alters Laminin Alpha-5 Peptide Processing
  biological_scale: MOLECULAR
  description: >-
    The heterozygous germline missense variant c.9418G>A (p.V3140M) changes the
    amount of LAMA5 peptides that the authors attribute to protein cleavage.
    Whether the variant acts by loss of function, dominant-negative interference
    or a new function has not been determined.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: MISSENSE
    description: >-
      Heterozygous germline missense variant in one three-generation family.
      Functional impact category left unset because the source does not
      establish one.
  genes:
  - preferred_term: LAMA5
    term:
      id: hgnc:6485
      label: LAMA5
  cellular_components:
  - preferred_term: basement membrane
    term:
      id: GO:0005604
      label: basement membrane
  evidence:
  - reference: PMID:28735299
    reference_title: "Identification of the first dominant mutation of LAMA5 gene causing a complex multisystem syndrome due to dysfunction of the extracellular matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that the mutation alters the amount of LAMA5 peptides likely derived from protein cleavage and perturbs the activation of the epithelial-mesenchymal signalling, producing an unbalanced expression of Sonic hedgehog and GLI1, which are upregulated in cells from affected individuals, and of ECM proteins (COL1A1, MMP1 and MMP3), which are strongly inhibited."
    explanation: >-
      Measurements in cells from affected family members show the variant
      changes the amount of LAMA5 cleavage-derived peptides.
  downstream:
  - target: Hedgehog-GLI1 Signaling Upregulation
    description: >-
      The authors report the peptide change and the signaling change together
      in the same cells; the order of events is their interpretation.
  - target: Reduced Extracellular Matrix Protein Expression
    description: >-
      Reported together with the peptide change in cells from affected
      individuals.
- name: Hedgehog-GLI1 Signaling Upregulation
  biological_scale: CELLULAR
  description: >-
    Sonic hedgehog and GLI1 expression is increased in cells from affected
    individuals, which the authors describe as perturbed epithelial-mesenchymal
    signaling.
  biological_processes:
  - preferred_term: Sonic hedgehog signaling
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:28735299
    reference_title: "Identification of the first dominant mutation of LAMA5 gene causing a complex multisystem syndrome due to dysfunction of the extracellular matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that the mutation alters the amount of LAMA5 peptides likely derived from protein cleavage and perturbs the activation of the epithelial-mesenchymal signalling, producing an unbalanced expression of Sonic hedgehog and GLI1, which are upregulated in cells from affected individuals, and of ECM proteins (COL1A1, MMP1 and MMP3), which are strongly inhibited."
    explanation: Reports upregulated Sonic hedgehog and GLI1 in cells from affected individuals.
  downstream:
  - target: Dermal Papilla Alteration and Early Hair Follicle Arrest
    description: >-
      The authors report the signaling change and the follicle findings
      together in the same family. The direction is unexplained: Hedgehog
      signaling normally promotes hair follicle downgrowth, so increased
      Sonic hedgehog and GLI1 would be expected to favour more downgrowth
      rather than an early arrest, and the abstract does not show the causal
      step.
- name: Reduced Extracellular Matrix Protein Expression
  biological_scale: CELLULAR
  description: >-
    Expression of the extracellular-matrix proteins COL1A1, MMP1 and MMP3 is
    strongly reduced in cells from affected individuals. The authors attribute
    the syndrome to extracellular-matrix dysfunction; the link from this
    expression change to each connective-tissue feature is their framing rather
    than a measured step. The GO term extracellular matrix organization is a
    coarse stand-in for the reported reduction in COL1A1, MMP1 and MMP3
    expression; MMP1 and MMP3 are matrix-remodelling enzymes rather than matrix
    components.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28735299
    reference_title: "Identification of the first dominant mutation of LAMA5 gene causing a complex multisystem syndrome due to dysfunction of the extracellular matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that the mutation alters the amount of LAMA5 peptides likely derived from protein cleavage and perturbs the activation of the epithelial-mesenchymal signalling, producing an unbalanced expression of Sonic hedgehog and GLI1, which are upregulated in cells from affected individuals, and of ECM proteins (COL1A1, MMP1 and MMP3), which are strongly inhibited."
    explanation: Reports strongly inhibited COL1A1, MMP1 and MMP3 expression in cells from affected individuals.
  downstream:
  - target: Poor Wound Healing
    description: Proposed by the authors' extracellular-matrix model; not separately tested.
  - target: Joint Hypermobility
    description: Proposed by the authors' extracellular-matrix model; not separately tested.

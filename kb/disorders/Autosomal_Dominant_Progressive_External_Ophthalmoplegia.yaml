phenotypes:
- category: Ocular
  name: Ptosis
  description: >
    Insidious, slowly progressive, usually bilateral and largely symmetric drooping
    of the eyelids from respiratory chain failure in the levator palpebrae superioris.
    Ptosis is the commonest presenting sign of adPEO, present in 92% of a genotyped
    25-patient TWNK cohort, and in advanced disease patients adopt a chin-up head
    posture and use frontalis contraction to clear the visual axis.
  phenotype_term:
    preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  diagnostic: true

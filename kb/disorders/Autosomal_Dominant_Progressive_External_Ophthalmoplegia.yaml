- category: Ocular
  name: Diplopia
  description: >
    Double vision may occur when extraocular-muscle involvement is sufficiently
    asymmetric, but it can remain absent despite marked ophthalmoparesis. A
    molecularly confirmed SLC25A4-related adPEO case explicitly reported no diplopia
    despite limitation of eye movement in all directions. No umbrella-wide frequency
    is assigned.
  phenotype_term:

- name: Selective Extraocular and Levator Muscle Failure
  biological_scale: TISSUE
  description: >
    Extraocular muscle and the levator palpebrae superioris fail earliest and most
    severely. These muscles are tonically active, have a mitochondrial content and
    oxidative demand far above limb muscle, and appear to have a lower heteroplasmy
    threshold for COX deficiency. The clinical result is bilateral, usually symmetric
    ptosis and slowly progressive multidirectional limitation of gaze. Because the
    weakness is symmetric, diplopia is less frequent than the degree of
    ophthalmoparesis would predict, and marked asymmetry or a cranial-nerve pattern
    should instead prompt reconsideration of the diagnosis. Slowed, hypometric
    saccades may precede fixed ophthalmoplegia.

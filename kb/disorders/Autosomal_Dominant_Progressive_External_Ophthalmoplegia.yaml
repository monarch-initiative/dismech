phenotypes:
- category: Ophthalmologic
  name: Ptosis
  description: >
    Bilateral, usually symmetric, slowly progressive drooping of the upper eyelids from
    mitochondrial failure of the levator palpebrae superioris, typically beginning
    between the second and fourth decades. Ptosis is the commonest presenting complaint
    and, when severe, obstructs the superior visual field and interferes with reading,
    driving and mobility, often driving a compensatory chin-up head posture.

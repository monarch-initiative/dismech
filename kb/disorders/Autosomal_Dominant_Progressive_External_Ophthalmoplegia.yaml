    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, causative mutations have been reported in several nuclear genes that encode proteins of the mtDNA replisome machinery (POLG, POLG2, and C10orf2) or that are involved in pathways for the synthesis of deoxyribonuclotides (ANT1 and RRM2B)."
    explanation: >
      States the two-module architecture (replisome versus deoxyribonucleotide
      synthesis) that organises this node.
  - reference: PMID:28324239

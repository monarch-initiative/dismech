biochemical:
- name: Serum Lactate
  biomarker_term:
    preferred_term: Increased circulating lactate concentration
    term:
      id: HP:0002151
      label: Increased circulating lactate concentration
  presence: VARIABLE
  evidence:
  - reference: PMID:28695364
    reference_title: "Revisiting mitochondrial ocular myopathies: a study from the Italian Network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased lactate was associated with central neurological involvement."
    explanation: >
      In a large genetically diagnosed mitochondrial cohort, raised lactate marked
      central neurological involvement rather than the ocular myopathy itself.
  notes: >
    Resting serum lactate is frequently normal in adPEO, particularly in the isolated
    ocular form, and is neither sensitive nor specific. A normal lactate does not
    exclude the diagnosis; an elevated lactate should prompt a search for
    encephalopathic or central neurological features. Creatine kinase is typically
    normal or only mildly elevated and is not curated separately because no quotable
    adPEO-specific figure was found. FGF21 and GDF15 are the better-performing serum
    adjuncts and are recommended as non-invasive first-line tests preceding genetic
    sequencing (PMID:38391710, quoted in the diagnosis section); they are not curated
    as a separate Biochemical record here because no HP or LOINC term for elevated
    serum FGF21 or GDF15 exists in the ontologies configured for this repository.
genetic:
- name: POLG
  gene_term:
    preferred_term: POLG
    term:
      id: hgnc:9179
      label: POLG
  relationship_type: CAUSATIVE
  subtype: PEOA1
  association: >-
    Heterozygous pathogenic variants in POLG, encoding the catalytic A subunit of
    mitochondrial DNA polymerase gamma, cause PEOA1. The archetypal dominant allele is
    p.Y955C in polymerase motif B, recurrent across European families. Its mechanism is
    NOT loss of catalytic rate but a 45-fold loss of affinity for the incoming dNTP with
    grossly error-prone synthesis (mismatch error rates elevated 10- to 100-fold) - a
    dominant-negative poisoning of the heterotrimeric holoenzyme rather than
    haploinsufficiency. POLG is the most frequent identified nuclear cause of familial
    PEO with multiple mtDNA deletions, accounting for roughly 45% of one dominant/
    recessive PEO family cohort and 48% of an unselected multiple-deletion cohort.
  variants:
  - name: p.Y955C
    description: >-
      Recurrent dominant allele in polymerase motif B; retains catalytic rate but loses
      dNTP-binding affinity 45-fold and is markedly error-prone.
  evidence:
  - reference: PMID:12210792
    reference_title: "Mutations of mitochondrial DNA polymerase gammaA are a frequent cause of autosomal dominant or recessive progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data show that mutations of POLG1 are the most frequent cause of familial progressive external ophthalmoplegia associated with accumulation of multiple mitochondrial DNA deletions, accounting for approximately 45% of our family cohort."
    explanation: >
      Quantifies POLG as the leading nuclear cause of familial PEO with multiple
      deletions.
  - reference: PMID:12673356
    reference_title: "Mutations in DNA polymerase gamma cause error prone DNA synthesis in human mitochondrial disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In particular, three autosomal dominant mutations alter amino acids located within polymerase motif B of polgamma."
    explanation: >
      Localises the dominant adPEO POLG alleles to polymerase motif B.
  - reference: PMID:12673356
    reference_title: "Mutations in DNA polymerase gamma cause error prone DNA synthesis in human mitochondrial disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Y955C derivative is also much less accurate than is wild-type polgamma, with error rates for certain mismatches elevated by 10- to 100-fold."
    explanation: >
      Quantifies the error-prone-synthesis mechanism of the archetypal dominant POLG
      allele.
  - reference: PMID:12673356
    reference_title: "Mutations in DNA polymerase gamma cause error prone DNA synthesis in human mitochondrial disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "One mutation in particular, Y955C, was found in several families throughout Europe, including one Belgian family and five unrelated Italian families."
    explanation: >
      Establishes p.Y955C as a recurrent dominant allele across multiple independent
      European families.
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Establishing the diagnosis of a POLG-related disorder relies on clinical findings and the identification of biallelic POLG pathogenic variants on molecular genetic testing for all phenotypes except autosomal dominant progressive external ophthalmoplegia (adPEO), for which identification of a heterozygous POLG pathogenic variant on molecular genetic testing is diagnostic."
    explanation: >
      GeneReviews explicitly separates dominant POLG adPEO (single heterozygous
      variant is diagnostic) from every other, recessive, POLG phenotype - the exact
      boundary this entry maintains.
  notes: >
    POLG is shared with the recessive POLG-related disorders (Alpers-Huttenlocher,
    MIRAS, SANDO, arPEO). Only the heterozygous dominant alleles belong to this entry.
    The valproate contraindication established for POLG-related disorders is a
    POLG-genotype property and is reflected in the treatments section.
- name: SLC25A4
  gene_term:
    preferred_term: SLC25A4
    term:
      id: hgnc:10990
      label: SLC25A4
  relationship_type: CAUSATIVE
  subtype: PEOA2
  association: >-
    Heterozygous missense variants in SLC25A4, encoding the heart/skeletal-muscle
    isoform of the adenine nucleotide translocator (ANT1), cause PEOA2. The familial
    allele substitutes proline for a highly conserved alanine at position 114. ANT1 is
    an inner-membrane carrier rather than a replisome component; the mtDNA-maintenance
    defect is indirect, arising from perturbed adenine-nucleotide exchange and
    consequent imbalance of the mitochondrial nucleotide pool available for mtDNA
    synthesis. The analogous substitution in yeast produces a respiratory defect,
    supporting a conserved mechanism. This was the first proof that a mitochondrial
    disease could be caused by a dominant mechanism.
  variants:
  - name: p.A114P
    description: >-
      The recurrent familial adPEO allele, substituting proline for a highly conserved
      alanine at position 114 of ANT1.
  evidence:
  - reference: PMID:10926541
    reference_title: "Role of adenine nucleotide translocator 1 in mtDNA maintenance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The familial mutation substitutes a proline for a highly conserved alanine at position 114 in the ANT1 protein."
    explanation: >
      Identifies the recurrent familial adPEO allele in ANT1.
  - reference: PMID:10926541
    reference_title: "Role of adenine nucleotide translocator 1 in mtDNA maintenance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that ANT has a role in mtDNA maintenance and that a mitochondrial disease can be caused by a dominant mechanism."
    explanation: >
      States both the mtDNA-maintenance role of ANT1 and the dominant mechanism that
      defines this entry.
  - reference: PMID:10926541
    reference_title: "Role of adenine nucleotide translocator 1 in mtDNA maintenance."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "The analogous mutation in yeast caused a respiratory defect."
    explanation: >
      Yeast complementation evidence for functional pathogenicity of the ANT1 allele.
      Cited as PARTIAL because it is a model-system readout of respiration, not of the
      human mtDNA-deletion phenotype.
  - reference: PMID:28215579
    reference_title: "Mitochondrial DNA maintenance defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genes encoding proteins that function in maintaining a balanced mitochondrial nucleotide pool (TK2, DGUOK, SUCLG1, SUCLA2, ABAT, RRM2B, TYMP, SLC25A4, AGK, and MPV17)"
    explanation: >
      Classifies SLC25A4 within the nucleotide-pool-balance module rather than the
      replisome, the mechanistic distinction asserted here.
- name: TWNK
  gene_term:
    preferred_term: TWNK
    term:
      id: hgnc:1160
      label: TWNK
  relationship_type: CAUSATIVE
  subtype: PEOA3
  association: >-
    Heterozygous variants in TWNK (formerly C10orf2 / PEO1), encoding the Twinkle
    mtDNA helicase, cause PEOA3. Eleven different coding-region variants cosegregated
    with adPEO across twelve pedigrees in the founding report, clustering in a region
    proposed to mediate subunit interactions. Structural work confirms that adPEO
    variants act on oligomerisation - destroying linker flexibility, inhibiting ring
    closure, or altering the number of subunits in the helicase ring - and abolish the
    NTP-driven conformational change of the wild-type hexamer. This is a
    dominant-negative mechanism: a mutant subunit poisons the assembled ring. Twinkle
    is structurally related to the bacteriophage T7 gene 4 primase/helicase. TWNK
    contribution to adPEO may be underestimated, and direct TWNK sequencing should be
    considered before muscle biopsy.
  variants:
  - name: p.R374Q
    description: >-
      Recurrent linker-region allele reported in at least three independent families,
      associated with myopathy, neuropathy, dysarthria/dysphagia, respiratory
      insufficiency and parkinsonism.
  evidence:
  - reference: PMID:11431692
    reference_title: "Human mitochondrial DNA deletions associated with mutations in the gene encoding Twinkle, a phage T7 gene 4-like protein localized in mitochondria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations cluster in a region of the protein proposed to be involved in subunit interactions."
    explanation: >
      Localises the adPEO TWNK variants to the subunit-interaction region, the basis
      of the dominant-negative oligomerisation mechanism.
  - reference: PMID:11431692
    reference_title: "Human mitochondrial DNA deletions associated with mutations in the gene encoding Twinkle, a phage T7 gene 4-like protein localized in mitochondria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The function of Twinkle is inferred to be critical for lifetime maintenance of human mtDNA integrity."
    explanation: >
      States the mtDNA-maintenance role of Twinkle that the dominant variants
      compromise.
  - reference: PMID:30496414
    reference_title: "Structural basis for adPEO-causing mutations in the mitochondrial TWINKLE helicase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The underlying molecular basis of adPEO-causing mutations remains unclear, but defects in TWINKLE oligomerization are thought to play a major role."
    explanation: >
      Frames the oligomerisation defect as the mechanism of adPEO TWNK alleles, while
      noting the residual uncertainty.
  - reference: PMID:30496414
    reference_title: "Structural basis for adPEO-causing mutations in the mitochondrial TWINKLE helicase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we demonstrate that wild-type TWINKLE undergoes large-scale conformational changes upon nucleoside triphosphate binding and that this ability is lost in the disease-causing variants."
    explanation: >
      Direct structural demonstration of the functional defect in the disease
      variants.
  - reference: PMID:20479361
    reference_title: "The clinical, histochemical, and molecular spectrum of PEO1 (Twinkle)-linked adPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest a shared clinical phenotype with variable mild multiorgan involvement, and that the contribution of PEO1 mutations as a cause of adPEO may well be underestimated."
    explanation: >
      Supports the claim that TWNK is an under-recognised contributor to adPEO.
  notes: >
    Naming trap: the historical GENE symbol PEO1 denotes TWNK/C10orf2, because it was
    the first adPEO locus mapped. The DISEASE designation PEOA1, by contrast, refers to
    the POLG subtype. TWNK is PEOA3.
- name: POLG2
  gene_term:
    preferred_term: POLG2
    term:
      id: hgnc:9180
      label: POLG2
  relationship_type: CAUSATIVE
  subtype: PEOA4
  association: >-
    Heterozygous variants in POLG2, encoding the p55 accessory subunit of polymerase
    gamma, cause PEOA4. The prototypical p.G451E substitution retains wild-type DNA
    binding but incompletely stimulates the p140 catalytic subunit because subunit
    interaction is compromised, and it fails to enhance the DNA-binding strength of
    the p140-p55 complex. Two dominance mechanisms are proposed and not fully
    resolved: haploinsufficiency, or heterodimerisation of mutant with wild-type
    protein. Either way the consequence is a stalled replication fork.
  variants:
  - name: p.G451E
    description: >-
      The prototypical dominant POLG2 allele (c.1352G>A); binds DNA normally but fails
      to stimulate the catalytic subunit or enhance holoenzyme DNA binding.
  evidence:
  - reference: PMID:16685652
    reference_title: "Mutant POLG2 disrupts DNA polymerase gamma subunits and causes progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical characterization of purified, recombinant G451E-substituted p55 protein in vitro revealed incomplete stimulation of the catalytic subunit due to compromised subunit interaction."
    explanation: >
      Direct biochemical characterisation of the dominant POLG2 allele's defect.
  - reference: PMID:16685652
    reference_title: "Mutant POLG2 disrupts DNA polymerase gamma subunits and causes progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although G451E p55 retains a wild-type ability to bind DNA, it fails to enhance the DNA-binding strength of the p140-p55 complex."
    explanation: >
      Pinpoints the functional deficit to holoenzyme DNA-binding enhancement rather
      than intrinsic DNA binding.
  - reference: PMID:16685652
    reference_title: "Mutant POLG2 disrupts DNA polymerase gamma subunits and causes progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In vivo, the disease most likely arises through haplotype insufficiency or heterodimerization of the mutated and wild-type proteins, which promote mtDNA deletions by stalling the DNA replication fork."
    explanation: >
      States the two candidate dominance mechanisms, both converging on fork stalling.
- name: RRM2B
  gene_term:
    preferred_term: RRM2B
    term:
      id: hgnc:17296
      label: RRM2B
  relationship_type: CAUSATIVE
  subtype: PEOA5
  association: >-
    Heterozygous RRM2B variants cause PEOA5. RRM2B encodes p53R2, the small subunit of
    ribonucleotide reductase that supplies deoxyribonucleotides for mtDNA synthesis in
    non-dividing cells and is essential for maintaining mtDNA copy number. The
    prototypical allele is the exon-9 nonsense variant c.979C>T (p.R327X), found
    segregating in two independent adPEO families and absent from 380 control
    chromosomes. The mutant mRNA escapes nonsense-mediated decay, producing a protein
    lacking 25 highly conserved C-terminal residues required to interact with the R1
    subunit - so the mechanism is dominant-negative or gain-of-function rather than
    simple haploinsufficiency.
  variants:
  - name: p.R327X
    description: >-
      Exon-9 nonsense allele (c.979C>T) whose transcript escapes nonsense-mediated
      decay, producing a C-terminally truncated p53R2 that cannot engage the R1
      subunit.
  evidence:
  - reference: PMID:19664747
    reference_title: "A heterozygous truncating mutation in RRM2B causes autosomal-dominant progressive external ophthalmoplegia with multiple mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The critical linkage region contained the RRM2B gene, which encodes the small subunit of the ribonucleotide reductase p53R2, which has previously been shown to be essential for the maintenance of mtDNA copy number."
    explanation: >
      Establishes the gene identity and the dNTP-supply function relevant to mtDNA
      maintenance.
  - reference: PMID:19664747
    reference_title: "A heterozygous truncating mutation in RRM2B causes autosomal-dominant progressive external ophthalmoplegia with multiple mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant mRNA escaped nonsense-mediated decay and resulted in a protein with truncation of 25 highly conserved C-terminal amino acids essential for the interaction with the ribonucleotide reductase subunit R1."
    explanation: >
      Explains why a nonsense allele acts dominantly rather than as a null.
  - reference: PMID:19664747
    reference_title: "A heterozygous truncating mutation in RRM2B causes autosomal-dominant progressive external ophthalmoplegia with multiple mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that dominant-negative or gain-of-function mutations in RRM2B are a cause of multiple mtDNA deletions and adPEO."
    explanation: >
      States the dominance mechanism explicitly.
  notes: >
    Biallelic RRM2B variants cause a severe infantile mtDNA depletion syndrome, a
    mechanistically related but clinically distinct entity that is out of scope for
    this dominant entry.
- name: DNA2
  gene_term:
    preferred_term: DNA2
    term:
      id: hgnc:2939
      label: DNA2
  relationship_type: CAUSATIVE
  subtype: PEOA6
  association: >-
    Heterozygous DNA2 variants cause the PEOA6 entity, curated by MONDO as
    "mitochondrial DNA deletion syndrome with progressive myopathy". DNA2 encodes a
    helicase/nuclease family member involved in mtDNA replication and in the long-patch
    base-excision repair pathway. Purified mutant proteins show severe impairment of
    nuclease, helicase and ATPase activities. DNA2 was identified by exome sequencing in
    adult-onset patients whose dominant feature was mitochondrial myopathy with muscle
    mtDNA instability rather than pure ophthalmoplegia. Its discovery implicated the
    LP-BER pathway, and not only replication, in adult mtDNA-maintenance disease.
  evidence:
  - reference: PMID:23352259
    reference_title: "Mutations in DNA2 link progressive myopathy to mitochondrial DNA instability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro biochemical analysis of purified mutant proteins revealed a severe impairment of nuclease, helicase, and ATPase activities."
    explanation: >
      Direct biochemical demonstration of loss of the three DNA2 catalytic activities.
  - reference: PMID:23352259
    reference_title: "Mutations in DNA2 link progressive myopathy to mitochondrial DNA instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA2 encodes a helicase/nuclease family member that is most likely involved in mtDNA replication, as well as in the long-patch base-excision repair (LP-BER) pathway."
    explanation: >
      Establishes the dual replication and repair role of DNA2 in mtDNA maintenance.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    adPEO is inherited in an autosomal dominant manner: a single heterozygous
    pathogenic variant in one of the nuclear mtDNA-maintenance genes is sufficient.
    Most affected individuals have an affected parent, and each child of an affected
    individual has a 50% chance of inheriting the variant. Male-to-male transmission
    occurs and is the observation that historically established nuclear rather than
    maternal mtDNA inheritance for this disorder. Age of onset and severity vary
    greatly within and between generations of the same family, so penetrance is
    age-dependent and expressivity is markedly variable. The DOMINANT requirement is
    what separates this entry from Autosomal Recessive Progressive External
    Ophthalmoplegia 1, in which two POLG alleles are required.
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals with PEO caused by a heterozygous POLG pathogenic variant (i.e., adPEO) have an affected parent, although age of onset and severity of presentation can vary greatly from generation to generation."
    explanation: >
      GeneReviews states the dominant transmission pattern and the marked variability
      in expressivity for adPEO.
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with POLG-related adPEO has a 50% chance of inheriting the pathogenic variant."
    explanation: >
      States the standard autosomal dominant recurrence risk for adPEO.
  - reference: PMID:10926541
    reference_title: "Role of adenine nucleotide translocator 1 in mtDNA maintenance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant progressive external ophthalmoplegia is a rare human disease that shows a Mendelian inheritance pattern, but is characterized by large-scale mitochondrial DNA (mtDNA) deletions."
    explanation: >
      States the Mendelian (nuclear, non-maternal) inheritance pattern that defines
      this entity despite the mtDNA lesion.
prevalence:
- population: North East England adults (all nuclear-gene adult mitochondrial disease)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.9
  notes: >-
    Upper-bound proxy. This is the population prevalence of ALL clinically overt adult
    mitochondrial disease caused by nuclear-gene mutations, the class to which adPEO
    belongs; adPEO specifically is a fraction of this figure. No adPEO-specific
    population prevalence estimate exists.
  evidence:
  - reference: PMID:25652200
    reference_title: "Prevalence of nuclear and mitochondrial DNA mutations related to adult mitochondrial disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In this population, nuclear mutations were responsible for clinically overt adult mitochondrial disease in 2.9 per 100,000 adults."
    explanation: >
      Population-based minimum prevalence of nuclear-gene adult mitochondrial disease.
      Cited as PARTIAL because it is a class-level rather than an adPEO-specific
      figure.
- population: Southwestern Finland (all clinically confirmed PEO, any molecular cause)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    A registry-based survey over an 18-year period in a defined southwestern Finnish
    population identified only 6 clinically confirmed PEO patients of any molecular
    cause, of whom 3 had single large-scale mtDNA deletions and 1 had a POLG1 variant.
    The abstract reports no population denominator, so BOTH `rate_per_100000` and a
    numeric `prevalence_class` band are deliberately omitted rather than
    back-calculated from an assumed catchment size; `prevalence_class: UNKNOWN` records
    that honestly. `measure_type` is PERIOD_PREVALENCE because ascertainment ran over an
    18-year window rather than at a point in time. Note this counts ALL PEO, not only
    the dominant nuclear form; the nuclear-gene share was 1 of 6.
  evidence:
  - reference: PMID:22377773
    reference_title: "Progressive external ophthalmoplegia in southwestern Finland: a clinical and genetic study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirmed the clinical diagnosis of PEO in 6 patients."
    explanation: >
      Population-based case ascertainment for PEO in a defined region. Cited as
      PARTIAL because it covers all PEO rather than the dominant nuclear form
      specifically.
  - reference: PMID:22377773
    reference_title: "Progressive external ophthalmoplegia in southwestern Finland: a clinical and genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Large-scale mtDNA deletions were detected in 3 out of 6 PEO patients and mutations in the POLG1 gene in 1 out of 6."
    explanation: >
      Shows the molecular composition of an unselected regional PEO population, in
      which the nuclear-gene (POLG) share was 1 of 6.
diagnosis:
- name: Genetic Testing for Nuclear mtDNA-Maintenance Genes
  description: >
    Genetic sequencing is the diagnostic gold standard. A nuclear mtDNA-maintenance /
    mitochondrial myopathy panel or exome/genome sequencing covering POLG, TWNK,
    SLC25A4, POLG2, DNA2 and RRM2B, run alongside full mtDNA sequencing and deletion
    analysis, both establishes the diagnosis and distinguishes dominant nuclear disease
    from primary mtDNA disease. For POLG specifically, a single heterozygous pathogenic
    variant is diagnostic of adPEO - unlike every other POLG phenotype, which requires
    biallelic variants. Direct TWNK sequencing should be considered before muscle
    biopsy in a dominant pedigree. Serum FGF21 and GDF15 are useful non-invasive
    adjuncts preceding sequencing.
  evidence:
  - reference: PMID:38391710
    reference_title: "Mitochondrial Chronic Progressive External Ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic sequencing is the gold standard for diagnosing mitochondrial encephalomyopathies, preceded by non-invasive tests such as fibroblast growth factor-21 and growth differentiation factor-15."
    explanation: >
      Establishes genetic sequencing as the diagnostic gold standard for mitochondrial
      CPEO, with FGF21/GDF15 as non-invasive precursors.
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Establishing the diagnosis of a POLG-related disorder relies on clinical findings and the identification of biallelic POLG pathogenic variants on molecular genetic testing for all phenotypes except autosomal dominant progressive external ophthalmoplegia (adPEO), for which identification of a heterozygous POLG pathogenic variant on molecular genetic testing is diagnostic."
    explanation: >
      States the specific molecular diagnostic criterion for POLG-related adPEO.
  - reference: PMID:20479361
    reference_title: "The clinical, histochemical, and molecular spectrum of PEO1 (Twinkle)-linked adPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of the PEO1 gene should be considered in adPEO patients prior to muscle biopsy."
    explanation: >
      Supports gene-first testing for TWNK ahead of invasive muscle biopsy.
- name: Muscle Biopsy with mtDNA Deletion Analysis
  description: >
    Reserved for cases where genetic testing is unresolved, or where a molecular
    demonstration of multiple deletions is needed to direct nuclear-gene sequencing.
    The biopsy is assessed with modified Gomori trichrome (ragged-red fibres),
    sequential COX-SDH histochemistry, respiratory-chain enzymology, mtDNA copy number
    and long-range PCR or deep sequencing for multiple deletions. Blood is frequently
    uninformative because the deletions are confined to post-mitotic tissue. A finding
    of MULTIPLE deletions should trigger POLG sequencing first, which resolves roughly
    one in two such cases.
  evidence:
  - reference: PMID:21550804
    reference_title: "Relative frequency of known causes of multiple mtDNA deletions: two novel POLG mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We showed that 10 cases (48%) display mutations in POLG, including eight previously reported variants and two novel mutations (namely, p.Trp585X and p.Arg1081Gln)."
    explanation: >
      Quantifies the diagnostic yield of POLG sequencing in patients found to have
      multiple mtDNA deletions in muscle.
  - reference: PMID:22377773
    reference_title: "Progressive external ophthalmoplegia in southwestern Finland: a clinical and genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that molecular investigation of patients with PEO, either sporadic or familial, should start with an analysis for mtDNA deletions, followed by an analysis of the POLG1 gene."
    explanation: >
      Establishes the recommended diagnostic sequence: deletion analysis first, then
      POLG.
- name: Serum FGF21 and GDF15 as Non-Invasive Adjuncts
  description: >
    FGF21 and GDF15 are circulating markers of the mitochondrial integrated stress
    response and outperform muscle histology as a screening test in mitochondrial
    disease: in a 194-sample study only 39% of genetically verified patients had
    mitochondrial pathology on muscle histology, whereas biomarkers were elevated in
    62%. In a myopathic patient with at least one elevated biomarker, an
    mtDNA-expression disorder - the class that includes adPEO - was the cause with 94%
    probability. They are best positioned as non-invasive first-line tests preceding
    genetic sequencing. Normal values do not exclude disease, and neither marker is
    specific for the dominant nuclear form.
  evidence:
  - reference: PMID:32857451
    reference_title: "Diagnostic value of serum biomarkers FGF21 and GDF15 compared to muscle sample in mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 39% of patients with genetically verified mitochondrial disease had mitochondrial pathology in their muscle histology. In contrast, biomarkers were elevated in 62% of patients with genetically verified mitochondrial disease."
    explanation: >
      Quantifies the diagnostic advantage of the serum biomarkers over muscle histology
      in a 194-sample cohort.
  - reference: PMID:32857451
    reference_title: "Diagnostic value of serum biomarkers FGF21 and GDF15 compared to muscle sample in mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If at least one of the biomarkers was induced and the patient had a myopathic disease, a mitochondrial DNA expression disease was the cause with 94% probability."
    explanation: >
      Gives the positive predictive value in exactly the clinical situation adPEO
      presents in - a myopathic patient with an mtDNA-expression defect.
  - reference: PMID:38391710
    reference_title: "Mitochondrial Chronic Progressive External Ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic sequencing is the gold standard for diagnosing mitochondrial encephalomyopathies, preceded by non-invasive tests such as fibroblast growth factor-21 and growth differentiation factor-15."
    explanation: >
      A CPEO-specific review positioning FGF21 and GDF15 ahead of sequencing in the
      diagnostic pathway.
differential_diagnoses:
- name: Sporadic CPEO / Kearns-Sayre Syndrome (single large-scale mtDNA deletion)
  disease_term:
    preferred_term: Kearns-Sayre syndrome
    term:
      id: MONDO:0010787
      label: Kearns-Sayre syndrome
  description: >
    The single most important differential. These are PRIMARY mtDNA disorders caused by
    ONE large-scale clonal deletion arising in the germline or early embryo, not by a
    nuclear gene defect. They are typically sporadic rather than familial, and
    Kearns-Sayre syndrome adds onset before age 20, pigmentary retinopathy and cardiac
    conduction disease. dismech curates Kearns-Sayre syndrome separately, and this
    entry is deliberately scoped away from it.
  distinguishing_features:
  - "Single clonal large-scale mtDNA deletion, not multiple heterogeneous deletions"
  - "Sporadic occurrence without a dominant pedigree"
  - "Kearns-Sayre adds onset before age 20, pigmentary retinopathy and cardiac conduction block"
  evidence:
  - reference: PMID:28324239
    reference_title: "MtDNA-maintenance defects: syndromes and genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These errors of nuclear-mitochondrial intergenomic signaling may lead to mtDNA depletion, accumulation of mtDNA multiple deletions, or both, in critical tissues."
    explanation: >
      Frames the nuclear-gene disorders as producing MULTIPLE deletions, the feature
      that separates them from single-deletion primary mtDNA disease.
- name: Autosomal Recessive Progressive External Ophthalmoplegia 1 (recessive POLG)
  disease_term:
    preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions,
      autosomal recessive 1
    term:
      id: MONDO:0009783
      label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
        recessive 1
  description: >
    The recessive sibling of PEOA1, caused by BIALLELIC POLG variants - typically
    compound heterozygosity for a European founder allele (p.A467T, p.W748S) plus a
    second variant. It shares the molecular lesion (multiple mtDNA deletions) and much
    of the clinical picture, but requires two alleles, shows a pedigree without
    affected parents, and more often has prominent sensory ataxic neuropathy. It is
    curated as a separate dismech entry; only heterozygous dominant POLG alleles belong
    in this entry.
  distinguishing_features:
  - "Biallelic POLG variants required; heterozygous carriers are typically asymptomatic"
  - "Sibling recurrence with unaffected parents, rather than parent-to-child transmission"
  - "Common European founder alleles p.A467T and p.W748S"
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early-onset and juvenile/adult-onset POLG-related disorders are typically caused by biallelic pathogenic variants and inherited in an autosomal recessive manner."
    explanation: >
      Establishes the recessive, biallelic requirement that distinguishes the recessive
      POLG disorders from dominant adPEO.
- name: OPA1-Related Dominant Optic Atrophy Plus
  disease_term:
    preferred_term: autosomal dominant optic atrophy plus syndrome
    term:
      id: MONDO:0014720
      label: autosomal dominant optic atrophy plus syndrome
  description: >
    Heterozygous OPA1 variants cause a dominant syndrome that can include CPEO and
    multiple mtDNA deletions, so it overlaps adPEO molecularly. It is distinguished by
    its cardinal feature - bilateral progressive optic atrophy with central and colour
    vision loss - and by acting through mitochondrial inner-membrane fusion and cristae
    architecture rather than the replisome or the nucleotide pool. dismech curates it
    separately as Autosomal Dominant Optic Atrophy Plus, and this entry excludes it.
  distinguishing_features:
  - "Bilateral optic atrophy with central and colour vision loss as the cardinal feature"
  - "Mechanism is mitochondrial fusion and cristae architecture, not the mtDNA replisome"
  evidence:
  - reference: PMID:19664747
    reference_title: "A heterozygous truncating mutation in RRM2B causes autosomal-dominant progressive external ophthalmoplegia with multiple mtDNA deletions."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is heterogeneous, with five known nuclear disease genes that encode the proteins ANT1, Twinkle, POLG, POLG2, and OPA1."
    explanation: >
      Confirms that OPA1 is counted among the dominant nuclear genes producing an
      adPEO-overlapping phenotype, which is why it must be actively differentiated
      rather than ignored.
- name: Myasthenia Gravis
  disease_term:
    preferred_term: myasthenia gravis
    term:
      id: MONDO:0009688
      label: myasthenia gravis
  description: >
    The most important NON-mitochondrial mimic and the one most often treatable.
    Autoimmune neuromuscular-junction failure also produces ptosis and ophthalmoparesis,
    but the weakness FLUCTUATES - worse with sustained effort and toward the end of the
    day, better after rest - whereas adPEO is slowly and monotonically progressive over
    years. Diplopia is common in myasthenia and comparatively uncommon in the symmetric
    adPEO ophthalmoparesis. Repetitive nerve stimulation, single-fibre EMG and AChR/MuSK
    antibodies discriminate. Because myasthenia is treatable and adPEO is not, it must
    be excluded first.
  distinguishing_features:
  - "Fluctuating, fatigable weakness rather than steady slow progression"
  - "Diplopia common; adPEO ophthalmoparesis is usually symmetric and diplopia-sparing"
  - "AChR or MuSK antibodies, decrement on repetitive nerve stimulation, jitter on single-fibre EMG"
  evidence:
  - reference: PMID:16760117
    reference_title: "Extraocular mitochondrial myopathies and their differential diagnoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To exclude myasthenia gravis, ocular myositis, thyroid associated orbitopathy, oculopharyngeal muscular dystrophy, and congenital fibrosis of the extraocular muscles in patients with an early onset or long-lasting very slowly progressive ptosis and external ophthalmoplegia, almost without any diplopia, and normal to mildly elevated serum creatine kinase and lactate, electromyography, nerve conduction studies and MRI of the orbits should be performed."
    explanation: >
      Names myasthenia gravis as a diagnosis that must be actively excluded in the
      slowly progressive, diplopia-sparing ptosis-plus-ophthalmoplegia presentation
      that defines PEO, and specifies the discriminating investigations.
- name: Oculopharyngeal Muscular Dystrophy
  disease_term:
    preferred_term: oculopharyngeal muscular dystrophy
    term:
      id: MONDO:0008116
      label: oculopharyngeal muscular dystrophy
  description: >
    A dominantly inherited late-onset dystrophy caused by a short GCN/polyalanine repeat
    expansion in PABPN1. Like adPEO it presents with progressive ptosis and
    ophthalmoparesis in an autosomal dominant pedigree, so pedigree structure alone does
    not separate them. The discriminators are the disproportionately prominent
    pharyngeal weakness and dysphagia relative to the ocular signs, the PABPN1 repeat
    expansion, and rimmed vacuoles with intranuclear filamentous inclusions rather than
    ragged-red and COX-negative fibres on biopsy.
  distinguishing_features:
  - "PABPN1 polyalanine repeat expansion rather than a nuclear mtDNA-maintenance gene variant"
  - "Prominent pharyngeal weakness and dysphagia out of proportion to the ocular signs"
  - "Rimmed vacuoles and intranuclear inclusions on biopsy, not ragged-red or COX-negative fibres"
  - "No multiple mtDNA deletions in muscle"
  evidence:
  - reference: PMID:16760117
    reference_title: "Extraocular mitochondrial myopathies and their differential diagnoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To exclude myasthenia gravis, ocular myositis, thyroid associated orbitopathy, oculopharyngeal muscular dystrophy, and congenital fibrosis of the extraocular muscles in patients with an early onset or long-lasting very slowly progressive ptosis and external ophthalmoplegia, almost without any diplopia, and normal to mildly elevated serum creatine kinase and lactate, electromyography, nerve conduction studies and MRI of the orbits should be performed."
    explanation: >
      Names oculopharyngeal muscular dystrophy among the diagnoses to exclude before
      settling on a mitochondrial extraocular myopathy.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >
    There is no approved disease-modifying or curative therapy for adPEO. Management is
    symptom-directed and multidisciplinary: physical and occupational therapy, mobility
    aids and fall prevention for the myopathy; speech and swallow therapy with dietetic
    support and aspiration precautions for bulbar involvement; pulmonary function
    testing and non-invasive ventilation for respiratory muscle weakness; hearing aids
    or cochlear implantation for hearing loss; and standard symptom-specific treatment
    of neuropathy, parkinsonism and endocrine complications. Mitochondrial "cocktail"
    supplements have uncertain efficacy and must not displace surveillance and
    rehabilitation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38391710
    reference_title: "Mitochondrial Chronic Progressive External Ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No definitive treatment option is available for mitochondrial diseases, and management is mainly focused on lifestyle risk modification and supplementation to reduce mitochondrial load and symptomatic relief, such as ptosis repair in the case of CPEO."
    explanation: >
      A 2024 review of mitochondrial CPEO states directly that no definitive treatment
      exists and that management is supportive and symptom-directed.
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical management is largely supportive and involves standard approaches for associated complications including occupational, physical, and speech therapy; nutritional support; respiratory support"
    explanation: >
      GeneReviews specifies the multidisciplinary supportive package for POLG-related
      disorders, which includes adPEO.
  - reference: PMID:34208592
    reference_title: "Therapy Prospects for Mitochondrial DNA Maintenance Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As is the case for many other mitochondrial diseases, the options for the treatment of these disorders are rather limited today."
    explanation: >
      A dedicated review of the mtDNA depletion and multiple-deletion syndromes - the
      exact disease class adPEO belongs to - confirming that treatment options remain
      very limited. Experimental strategies under investigation for this class (small
      molecule substrate enhancement, lentiviral and AAV gene therapy) are noted in the
      same review but none has reached approval for adPEO, so none is curated here as a
      treatment.
- name: Ptosis Surgery (Levator Advancement/Resection or Frontalis Suspension)
  description: >
    Surgical correction is the mainstay of symptomatic treatment for the ptosis of
    adPEO, chosen according to levator excursion: levator advancement or resection
    where levator function is preserved, frontalis suspension (fascia lata or silicone
    sling) where it is not. Eyelid crutches on spectacles are a non-surgical option but
    are often poorly tolerated. Myogenic ptosis is a particularly difficult surgical
    target because the ptosis continues to worsen and because the same mitochondrial
    myopathy impairs protective corneal mechanisms (Bell's phenomenon, orbicularis
    closure). Deliberate under-correction is therefore standard - enough to clear the
    visual axis without producing exposure keratopathy - at the cost of a high
    recurrence rate. Surgery does not slow the underlying mtDNA-deletion accumulation.
  treatment_term:
    preferred_term: Ophthalmologic Surgical Procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical techniques predominantly involved levator advancement, levator resection, frontalis sling, blepharoplasty, and Fasanella-Servat."
    explanation: >
      Enumerates the surgical options used for progressive myogenic ptosis, including
      the CPEO subgroup.
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, myogenic ptosis is especially challenging as it is characterized by worsening ptosis and the loss of protective corneal mechanisms."
    explanation: >
      Explains why myogenic (mitochondrial) ptosis carries a higher surgical risk than
      other ptosis aetiologies.
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The goals of care with myogenic ptosis involves repairing ptosis just sufficiently to alleviate visual obstruction while avoiding adverse post-operative complications."
    explanation: >
      Establishes the deliberate-under-correction principle that governs ptosis surgery
      in mitochondrial ocular myopathy.
  - reference: PMID:38391710
    reference_title: "Mitochondrial Chronic Progressive External Ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No definitive treatment option is available for mitochondrial diseases, and management is mainly focused on lifestyle risk modification and supplementation to reduce mitochondrial load and symptomatic relief, such as ptosis repair in the case of CPEO."
    explanation: >
      Positions ptosis repair as the principal symptomatic intervention in CPEO while
      making clear it is not disease-modifying.
- name: Strabismus Surgery and Prisms for Diplopia
  description: >
    Prisms are used for small deviations. Strabismus surgery is reserved for persistent
    symptomatic ocular misalignment: modest bilateral medial rectus resection with
    lateral rectus recession can control alignment in primary position and relieve
    diplopia and asthenopia durably (8-9 years in a reported series) even though the
    ophthalmoplegia continues to progress. Careful surgical planning is required
    because the underlying myopathy is progressive. The published experience is small
    (a two-patient case series), so the recommendation is for selected patients only.
  treatment_term:
    preferred_term: Ophthalmologic Surgical Procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Ophthalmoparesis
    term:
      id: HP:0000597
      label: Ophthalmoparesis
  evidence:
  - reference: PMID:29582258
    reference_title: "Strabismus surgery for diplopia in chronic progressive external ophthalmoplegia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical intervention was successful in controlling alignment in primary position and alleviating diplopia and asthenopia after 9 and 8 years of follow-up time, respectively, despite slow progression of ophthalmoplegia."
    explanation: >
      Documents durable symptomatic benefit of strabismus surgery in CPEO despite
      ongoing progression of the underlying myopathy. Cited as PARTIAL because it is a
      two-patient retrospective case series.
  - reference: PMID:29582258
    reference_title: "Strabismus surgery for diplopia in chronic progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Properly designed strabismus surgery may provide sustainable, in the midterm, control of alignment and symptomatic relief in selected patients with CPEO."
    explanation: >
      States the appropriately hedged conclusion - benefit in selected patients, in the
      midterm.
- name: Aerobic Exercise Training
  description: >
    Individualised aerobic training within tolerance is the best-supported
    non-pharmacological intervention for the myopathy. Aerobic training raises
    oxidative capacity in patients with mtDNA mutations and appears safe even at high
    muscle mutation load; it counteracts the deconditioning spiral created by exercise
    intolerance and a sedentary lifestyle. It is symptomatic and conditioning, NOT
    disease-modifying: it does not reduce the burden of mtDNA deletions.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:32508662
    reference_title: "Aerobic Exercise Training in Patients With mtDNA-Related Mitochondrial Myopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall studies investigating the effect of aerobic training in patients with mtDNA mutation have shown that aerobic training is an efficient way to improve oxidative capacity in this condition, and aerobic training seems to be safe even for patients with high mtDNA mutation in skeletal muscle."
    explanation: >
      Summarises the evidence that aerobic training improves oxidative capacity safely
      in mtDNA-mutation myopathy. Cited as PARTIAL because the reviewed trials enrolled
      patients with primary mtDNA mutations rather than nuclear-gene adPEO
      specifically.
- name: Genetic Counseling
  description: >
    Counseling should explain autosomal dominant transmission with a 50% transmission
    probability per child, age-dependent penetrance and markedly variable expressivity.
    For a known familial nuclear variant, reproductive options include natural
    conception with prenatal testing, preimplantation genetic testing for monogenic
    disease, donor gametes and adoption. These nuclear-gene options are fundamentally
    different from the mitochondrial-donation strategies applicable to maternally
    inherited primary mtDNA disease, and conflating the two is a common counseling
    error. Cascade testing of at-risk adult relatives is appropriate once the familial
    variant is known.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with POLG-related adPEO has a 50% chance of inheriting the pathogenic variant."
    explanation: >
      Provides the recurrence-risk figure that anchors dominant-inheritance
      counseling.
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals with PEO caused by a heterozygous POLG pathogenic variant (i.e., adPEO) have an affected parent, although age of onset and severity of presentation can vary greatly from generation to generation."
    explanation: >
      Supports the counseling caveat about variable age of onset and severity between
      generations.
- name: Avoidance of Valproic Acid in POLG-Related adPEO
  description: >
    GeneReviews lists valproic acid (Depakene) and sodium divalproate (Depakote) as
    agents to avoid in POLG-related disorders because of the risk of precipitating or
    accelerating liver disease. The hepatotoxicity risk is best characterised in
    recessive POLG disease, especially Alpers-Huttenlocher syndrome; the strength of the
    risk in a patient with a single heterozygous dominant POLG allele and pure adPEO is
    NOT established. It is recorded here as a genotype-directed caution that applies to
    the POLG (PEOA1) subtype, not as a demonstrated adPEO-specific contraindication,
    and it has no bearing on the non-POLG subtypes.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Valproic acid (Depakene®) and sodium divalproate (divalproex) (Depakote®) because of the risk of precipitating and/or accelerating liver disease."
    explanation: >
      GeneReviews Agents/Circumstances to Avoid section for POLG-related disorders, the
      genotype shared by the PEOA1 subtype. Cited as PARTIAL because the warning is
      written for the POLG class as a whole and the supporting hepatotoxicity evidence
      is dominated by biallelic disease, not dominant heterozygous adPEO.
  notes: >
    Deliberately hedged. Do not restate this as an established contraindication in
    dominant heterozygous adPEO without genotype-specific evidence, and note that it
    does not apply to the TWNK, SLC25A4, POLG2, RRM2B or DNA2 subtypes at all.
- name: Elamipretide (Investigational, Not Approved)
  description: >
    Elamipretide is a mitochondria-targeted tetrapeptide investigated for primary
    mitochondrial myopathy. IMPORTANT: the Phase 3 MMPOWER-3 trial was NEGATIVE in its
    genotypically diverse primary mitochondrial myopathy population. A POST HOC
    genotype-specific analysis found that participants with mtDNA replisome variants
    who also had CPEO - the adPEO population - improved on the six-minute walk test by
    37.3 +/- 9.5 m versus -8.0 +/- 10.7 m on placebo at week 24 (p=0.0024), and that the
    replisome cohort as a whole trended toward benefit (p=0.06). This is a
    hypothesis-generating post-hoc subgroup finding, NOT evidence of efficacy and NOT an
    approved therapy. It motivated the dedicated Phase 3 NuPOWER trial (NCT05162768) in
    nuclear-DNA primary mitochondrial disease; no efficacy conclusion can be drawn until
    those results are published.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: elamipretide
      term:
        id: NCIT:C171874
        label: Elamipretide
  therapeutic_modality: PEPTIDE
  target_phenotypes:
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:39574155
    reference_title: "Genotype-specific effects of elamipretide in patients with primary mitochondrial myopathy: a post hoc analysis of the MMPOWER-3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The 6MWT results at week 24 in subjects with replisome variants showed a significant change in the elamipretide group subjects who had chronic progressive external ophthalmoplegia (CPEO) (37.3 ± 9.5 m versus - 8.0 ± 10.7 m for the placebo group; p = 0.0024)."
    explanation: >
      The primary quantitative result for the replisome-plus-CPEO subgroup. Cited as
      PARTIAL because it is an exploratory post-hoc subgroup analysis of a trial that
      failed its primary endpoints, not confirmatory efficacy evidence.
  - reference: PMID:39574155
    reference_title: "Genotype-specific effects of elamipretide in patients with primary mitochondrial myopathy: a post hoc analysis of the MMPOWER-3 trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "As previously published, the MMPOWER-3 clinical trial did not demonstrate a significant benefit of elamipretide treatment in a genotypically diverse population of adults with primary mitochondrial myopathy (PMM)."
    explanation: >
      The negative primary result of the parent trial, recorded explicitly so that the
      post-hoc subgroup signal is not read as established efficacy.
  - reference: PMID:39574155
    reference_title: "Genotype-specific effects of elamipretide in patients with primary mitochondrial myopathy: a post hoc analysis of the MMPOWER-3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These data serve as the foundation for a follow-up Phase 3 clinical trial (NuPOWER) which has been designed as described in this paper to determine the efficacy of elamipretide in patients with mtDNA maintenance-related disorders."
    explanation: >
      Confirms that efficacy remains an open question to be resolved by a dedicated
      confirmatory trial.
  notes: >
    Not approved for adPEO or any mitochondrial myopathy indication at the time of
    curation. Do not present the post-hoc 6MWT figure as a treatment effect estimate.
clinical_trials:
- name: NCT05162768
  phase: PHASE_III
  status: COMPLETED
  description: >
    NuPOWER (SPIMD-301): a 48-week randomised, double-blind, parallel-group,
    placebo-controlled Phase 3 trial of daily subcutaneous elamipretide in subjects with
    primary mitochondrial myopathy caused by nuclear DNA mutations, the population that
    includes adPEO. Designed as the confirmatory follow-up to the post-hoc
    replisome/CPEO signal from MMPOWER-3. Listed as completed; results were not
    available in the registry record at the time of curation, so no efficacy conclusion
    can be drawn from completion status alone.
  target_phenotypes:
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: clinicaltrials:NCT05162768
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPIMD-301 is a 48-week, randomized, double-blind, parallel-group, placebo-controlled trial to assess efficacy and safety of single daily subcutaneous (SC) administration of elamipretide as a treatment for subjects with primary mitochondrial myopathy associated with nuclear DNA mutations (nPMD)."
    explanation: >
      The registry description of the confirmatory Phase 3 trial targeting the
      nuclear-DNA mitochondrial myopathy population to which adPEO belongs.
discussions:
- discussion_id: adpeo_extraocular_selectivity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Selective Extraocular and Levator Muscle Failure"
  prompt: >
    Why do extraocular muscle and the levator palpebrae superioris fail first and most
    severely in adPEO, when the nuclear mtDNA-maintenance defect is expressed in every
    tissue?
  rationale: >
    The selectivity is the single most characteristic feature of the disease and is
    routinely explained by appeal to the high tonic activity and mitochondrial content
    of extraocular muscle plus a putatively lower heteroplasmy threshold. None of these
    factors has been quantified in human adPEO extraocular muscle against a limb-muscle
    comparator from the same patients, so the explanation remains plausible rather than
    demonstrated. The gap matters because a threshold difference would predict a
    different therapeutic window from a deletion-accumulation-rate difference.
  proposed_experiments:
  - experiment_id: adpeo_single_fibre_threshold_mapping
    name: Single-fibre heteroplasmy threshold mapping across muscle groups
    description: >-
      Measure single-fibre mtDNA deletion load and copy number in extraocular, levator
      palpebrae and limb muscle from the same genetically confirmed adPEO donors, with
      matched COX-SDH histochemistry, to define the fibre-level heteroplasmy threshold
      in each tissue and test whether extraocular selectivity reflects a lower
      threshold or a faster accumulation rate.
  - experiment_id: adpeo_eom_mitochondrial_density
    name: Fibre-type-resolved mitochondrial density in human extraocular muscle
    description: >-
      Quantify mitochondrial volume density and oxidative demand by fibre type in human
      extraocular versus limb muscle, to test whether mitochondrial content or
      heteroplasmy threshold dominates the selectivity.
  status: OPEN
- discussion_id: adpeo_dominance_mechanism_per_allele
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Heterozygous Nuclear mtDNA-Maintenance Gene Defect"
  prompt: >
    For each adPEO allele, is dominance mediated by dominant-negative poisoning of a
    multimeric complex, by haploinsufficiency, or by gain of function - and does the
    mechanism predict phenotype severity or genotype-specific PEO-plus extension?
  rationale: >
    The mechanisms are only partially resolved and differ across the gene set: TWNK
    alleles disrupt hexamer assembly (dominant-negative), POLG p.Y955C is an error-prone
    polymerase that poisons the holoenzyme, RRM2B p.R327X is explicitly described as
    dominant-negative OR gain-of-function without discrimination between the two, and
    the POLG2 p.G451E paper offers haploinsufficiency and heterodimerisation as
    alternatives without resolving which operates in vivo. Mechanism therefore cannot be
    inferred from gene identity, which limits both variant interpretation and any
    allele-directed therapeutic strategy.
  proposed_experiments:
  - experiment_id: adpeo_allele_dosage_titration
    name: Allele-specific mutant-to-wild-type dosage titration
    description: >-
      Build allele-specific knock-in cellular models with titrated mutant-to-wild-type
      ratios for each prototypical adPEO allele, to distinguish dominant-negative dose
      behaviour from haploinsufficiency.
  - experiment_id: adpeo_null_versus_missense_comparison
    name: Heterozygous null versus missense allele comparison
    description: >-
      Systematically compare heterozygous null alleles with missense alleles in the same
      gene, to test whether true haploinsufficiency produces adPEO at all.
  status: OPEN
- discussion_id: adpeo_elamipretide_replisome_signal
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Mosaic Respiratory-Chain (OXPHOS) Deficiency"
  prompt: >
    Is the post-hoc MMPOWER-3 six-minute-walk benefit in the mtDNA-replisome-plus-CPEO
    subgroup a real, genotype-specific pharmacodynamic effect on residual respiratory
    chain function, or a subgroup artefact of a negative Phase 3 trial?
  rationale: >
    The parent trial was negative and the replisome/CPEO subgroup result (37.3 m versus
    -8.0 m, p=0.0024) is exploratory. If real, it would imply that cells with mosaic
    OXPHOS deficiency from nuclear-gene multiple deletions retain a recruitable
    bioenergetic reserve that a mitochondria-targeted peptide can mobilise - a
    mechanistically important claim about this pathophysiology node. If artefactual, the
    node has no current pharmacological handle. The dedicated NuPOWER trial
    (NCT05162768) is completed but unreported at the time of curation.
  proposed_experiments:
  - experiment_id: adpeo_nupower_readout
    name: Incorporate published NuPOWER results
    description: >-
      Await and incorporate the published NuPOWER (NCT05162768) results as confirmatory
      or refuting evidence for the replisome/CPEO elamipretide signal.
  - experiment_id: adpeo_pharmacodynamic_pairing
    name: Pair clinical endpoint with tissue pharmacodynamic readout
    description: >-
      Pair any clinical endpoint with a tissue-level pharmacodynamic readout - muscle
      respiratory-chain enzymology or 31P-MRS phosphocreatine recovery - to test whether
      functional benefit tracks with recruited OXPHOS capacity.
  status: OPEN
notes: >
  SCOPE. This entry covers the autosomal DOMINANT, nuclear-gene, MULTIPLE-mtDNA-deletion
  arm of progressive external ophthalmoplegia only. Adjacent dismech entries are
  cross-referenced rather than duplicated:
  Autosomal_Recessive_Progressive_External_Ophthalmoplegia_1 (biallelic POLG - shares
  POLG and the multiple-deletion lesion but requires two alleles);
  Kearns-Sayre_Syndrome and sporadic CPEO (a SINGLE clonal large-scale mtDNA deletion,
  a primary mtDNA rather than nuclear disorder); and
  Autosomal_Dominant_Optic_Atrophy_Plus (OPA1 - dominant and can carry multiple
  deletions, but acts through mitochondrial fusion/cristae and is defined by optic
  atrophy). Mitochondrial_DNA_Depletion_Syndrome_7 is the recessive TWNK
  (infantile-onset spinocerebellar ataxia / hepatocerebral) counterpart of PEOA3 and is
  likewise out of scope. The three most clinically consequential of these boundaries are
  modelled explicitly in `differential_diagnoses`.

  SUBTYPE-GENE MAPPING. The PEOA1-PEOA6 numbering was verified against MONDO and OMIM
  with OAK rather than taken from secondary sources, because the series is a known
  named-entity-confusion hazard. The authoritative mapping used here is PEOA1=POLG
  (OMIM 157640), PEOA2=SLC25A4/ANT1 (609283), PEOA3=TWNK/C10orf2 (609286), PEOA4=POLG2
  (610131), PEOA5=RRM2B (613077), PEOA6=DNA2 (615156, curated by MONDO under the label
  "mitochondrial DNA deletion syndrome with progressive myopathy"). Note the trap: the
  historical GENE symbol "PEO1" refers to TWNK/C10orf2 (the first adPEO locus mapped),
  whereas the DISEASE designation PEOA1 refers to POLG. Sources that conflate the two
  should not be trusted for the numbering.

  ONTOLOGY NOTE. MONDO:0008003 carries "PEOA1" as a RELATED synonym even though its
  primary label and definition describe the general dominant-PEO concept, and the
  gene-specific PEOA1 entity has its own term MONDO:0024528. This entry deliberately
  uses MONDO:0008003 as the umbrella `disease_term` and MONDO:0024528 as the PEOA1
  `subtype_term`.

  GENEREVIEWS BASELINE. Two GeneReviews articles are tagged in `references:`.
  PMID:20301791 (POLG-Related Disorders) is the substantive baseline and is mined
  throughout - Clinical Characteristics (ptosis, PEO, neuropathy, ataxia, muscle
  weakness), Diagnosis (heterozygous POLG variant is diagnostic for adPEO specifically),
  Management, Genetic Counseling, and Agents/Circumstances to Avoid. PMID:29517884
  (Mitochondrial DNA Maintenance Defects Overview) is tagged for completeness but is
  deliberately NOT cited in any evidence item: its PubMed record contains only the
  chapter's list of objectives, with no quotable clinical content. This is expected, not
  an oversight.

  NOT CURATED. No adPEO-specific population prevalence, penetrance figure, survival
  estimate or validated prognostic biomarker exists in the literature reviewed, so none
  is asserted. Quantitative phenotype frequencies are given only where a cohort figure
  was quotable, and every such figure comes from the SAME 33-patient TWNK-only series
  (Fratter 2010, PMID:20479361) - so the ptosis/PEO/fatigue/proximal-myopathy/cardiac
  bands are strictly TWNK-derived and may not generalise across the whole PEOA1-PEOA6
  series, which differs substantially in PEO-plus breadth. Elsewhere `frequency` is
  deliberately omitted rather than guessed. Hypogonadism, gastrointestinal dysmotility
  and facial weakness (surfaced by the Falcon deep-research report, the first two for
  RRM2B-dominant disease) are mentioned in prose but not curated as phenotype entries
  because no quotable primary-source snippet was verified for them.

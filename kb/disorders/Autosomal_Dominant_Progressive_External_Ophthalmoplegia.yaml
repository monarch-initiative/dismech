genetic:
- name: POLG
  gene_term:
    preferred_term: POLG
    term:
      id: hgnc:9179
      label: POLG
  relationship_type: CAUSATIVE
  subtype: PEOA1
  variant_origin: GERMLINE
  association: >-
    A single heterozygous pathogenic variant in POLG, encoding the catalytic A
    subunit of mitochondrial DNA polymerase gamma, causes PEOA1. The dominant alleles
    cluster in the polymerase domain (p.G923D, p.R943H, p.Y955C, p.A957S), where they
    reduce catalytic efficiency and nucleotide selectivity; p.Y955C in motif B is the
    prototype. POLG is the most frequent single cause of familial PEO with multiple
    mtDNA deletions, accounting for approximately 45% of one family cohort. The same
    gene causes a wide autosomal RECESSIVE spectrum (PEOB1, Alpers-Huttenlocher,
    MIRAS, SANDO), so the number of pathogenic alleles must be established explicitly.
  evidence:

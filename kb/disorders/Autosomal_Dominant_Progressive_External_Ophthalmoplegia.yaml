  downstream:
  - target: Clonal Expansion Above the Biochemical Threshold
    description: >-
      Individual deleted mtDNA genomes replicate preferentially within single
      post-mitotic cells until they exceed the heteroplasmy threshold for
      respiratory-chain failure.
    causal_link_type: DIRECT
- name: Clonal Expansion Above the Biochemical Threshold
  biological_scale: CELLULAR
  description: >
    Deleted mtDNA genomes are shorter than wild type and are amplified preferentially
    within individual long-lived post-mitotic cells - muscle fibre segments, neurons.
    Because mtDNA is polyploid, a cell remains biochemically normal until the mutant
    fraction crosses a threshold, beyond which mtDNA-encoded respiratory-chain
    subunits become limiting. This threshold behaviour, superimposed on stochastic
    clonal expansion, is why the resulting defect is mosaic from fibre to fibre rather
    than uniformly distributed across the tissue, and why the disease declares itself
    only in adulthood despite a lifelong genotype.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16301523
    reference_title: "Mutant mitochondrial helicase Twinkle causes multiple mtDNA deletions and a late-onset mitochondrial disease in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Multiple mtDNA deletions accumulate in the tissues of these mice, resulting in progressive respiratory dysfunction and chronic late-onset mitochondrial disease starting at 1 year of age."
    explanation: >
      The Deletor mouse shows the delayed, cumulative course predicted by progressive
      clonal expansion toward a biochemical threshold. Model-organism evidence offered
      as mechanistic support for the threshold step, not as proof in human tissue.
  downstream:
  - target: Mosaic Respiratory-Chain (OXPHOS) Deficiency
    description: >-
      Once the deleted-mtDNA load exceeds threshold in a cell, mtDNA-encoded subunits
      of complexes I, III, IV and V become insufficient and oxidative phosphorylation
      fails in that cell.
    causal_link_type: DIRECT
- name: Mosaic Respiratory-Chain (OXPHOS) Deficiency
  biological_scale: CELLULAR
  description: >
    Loss of intact mtDNA templates reduces the supply of the thirteen mtDNA-encoded
    respiratory-chain polypeptides. Complex IV (cytochrome c oxidase) is the most
    sensitive histochemical readout because three of its catalytic subunits are
    mtDNA-encoded and none are supplied by the nuclear genome, whereas complex II
    (succinate dehydrogenase) is entirely nuclear-encoded and is preserved or
    upregulated. Affected cells therefore appear COX-negative and SDH-hyperreactive
    while their neighbours react normally. The bioenergetic deficit is expressed first
    in the most oxidative, highest-demand post-mitotic cells.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: sensory neuron of dorsal root ganglion
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  biological_processes:

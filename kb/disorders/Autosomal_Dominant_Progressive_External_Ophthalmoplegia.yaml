inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    adPEO is inherited in an autosomal dominant manner at all six loci: a single
    heterozygous pathogenic variant in POLG, SLC25A4, TWNK, POLG2, RRM2B or DNA2 is
    sufficient. Each child of an affected individual has a 50% risk of inheriting the
    variant. Family history was positive in 22 of 25 patients in the genotyped TWNK
    cohort. Two caveats are important. First, germline mosaicism has been documented
    at the SLC25A4 locus in a parent who did not carry the variant in blood, so an
    apparently de novo case does not guarantee a negligible sibling recurrence risk.
    Second, both POLG and RRM2B also cause distinct autosomal RECESSIVE disorders, so
    the number of pathogenic alleles, not merely the gene, determines the inheritance
    mode and the counselling.
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late-onset PEO may be caused by a heterozygous POLG pathogenic variant and inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews states the dominant single-allele mechanism at the POLG locus.
  - reference: PMID:24741716
    reference_title: "RRM2B Mitochondrial DNA Maintenance Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If a parent of the proband is affected and/or is known to have the RRM2B pathogenic variant identified in the proband, the risk to sibs of inheriting the pathogenic variant is 50%."
    explanation: >-
      GeneReviews states the 50% transmission risk for the dominant RRM2B genotype.
  - reference: PMID:35011763
    reference_title: "Clinical, Histological, and Genetic Features of 25 Patients with Autosomal Dominant Progressive External Ophthalmoplegia (ad-PEO)/PEO-Plus Due to TWNK Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family history was positive in 22 patients."
    explanation: >-
      Documents the dominant pedigree pattern in a genotyped adPEO cohort.
  - reference: PMID:15792871
    reference_title: "A novel ANT1 gene mutation with probable germline mosaicism in autosomal dominant progressive external ophthalmoplegia."
    supports: SUPPORT

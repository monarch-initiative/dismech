    modifier: ABNORMAL
  evidence:
  - reference: PMID:19664747
    reference_title: "A heterozygous truncating mutation in RRM2B causes autosomal-dominant progressive external ophthalmoplegia with multiple mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is heterogeneous, with five known nuclear disease genes that encode the proteins ANT1, Twinkle, POLG, POLG2, and OPA1."
    explanation: >-
      States the locus heterogeneity of adPEO across nuclear mtDNA-maintenance genes.
  - reference: PMID:23352259
    reference_title: "Mutations in DNA2 link progressive myopathy to mitochondrial DNA instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, causative mutations have been reported in several nuclear genes that encode proteins of the mtDNA replisome machinery (POLG, POLG2, and C10orf2) or that are involved in pathways for the synthesis of deoxyribonuclotides (ANT1 and RRM2B)."
    explanation: >-
      Directly states the two functional classes - replisome machinery versus
      deoxyribonucleotide synthesis - into which the adPEO genes partition.
  - reference: PMID:28324239
    reference_title: "MtDNA-maintenance defects: syndromes and genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genes involved encode proteins belonging to at least three pathways: mtDNA replication and maintenance, nucleotide supply and balance, and mitochondrial dynamics and quality control."
    explanation: >-
      Review-level statement of the pathway classes underlying mtDNA maintenance
      defects, of which adPEO is the late-onset myopathic end.
  - reference: PMID:11431686
    reference_title: "Mutation of POLG is associated with progressive external ophthalmoplegia characterized by mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POLG is the only DNA polymerase responsible for mtDNA replication."
    explanation: >-
      Establishes the absence of a redundant backup polymerase, which is why a
      partial loss of polymerase gamma function is not buffered.
  downstream:
  - target: Reduced Functional mtDNA-Maintenance Capacity
    description: >-
      In the replisome-class genes the mutant polypeptide is incorporated into a
      multimeric complex alongside wild-type protein, so one mutant allele degrades
      the function of the whole assembly.
    causal_link_type: DIRECT
  - target: Mitochondrial Nucleotide and Energy Homeostasis Disruption
    description: >-
      In the nucleotide-supply-class genes (SLC25A4/ANT1 and RRM2B) the primary
      lesion is not in the replisome but in the provision of balanced
      deoxyribonucleotide precursors to the replicating mitochondrial genome.
    causal_link_type: DIRECT
- name: Reduced Functional mtDNA-Maintenance Capacity
  role: effector
  biological_scale: MOLECULAR
  description: >
    Heterozygous pathogenic variants reduce the effective capacity of the mtDNA
    maintenance system, but the molecular basis of dominance differs by locus and is
    not settled uniformly. POLG dominant alleles reduce catalytic efficiency and
    nucleotide selectivity; POLG2 p.G451E fails to stimulate the catalytic subunit;
    and the RRM2B p.R327X transcript escapes nonsense-mediated decay and produces a
    truncated protein unable to engage the R1 subunit. Dominant-negative assembly is a
    plausible model for multimeric proteins such as Twinkle, but it must not be treated
    as universal: heterozygous TWNK nonsense alleles are now also reported. The atomic
    event represented here is reduced functional maintenance capacity; the competing
    dominance mechanisms remain an explicit knowledge gap.
  molecular_functions:
  - preferred_term: DNA-directed DNA polymerase activity
    term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    modifier: DECREASED
  - preferred_term: DNA helicase activity
    term:
      id: GO:0003678
      label: DNA helicase activity
    modifier: DECREASED
  locations:
  - preferred_term: mitochondrial nucleoid
    term:
      id: GO:0042645
      label: mitochondrial nucleoid
  evidence:
  - reference: PMID:11431692
    reference_title: "Human mitochondrial DNA deletions associated with mutations in the gene encoding Twinkle, a phage T7 gene 4-like protein localized in mitochondria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations cluster in a region of the protein proposed to be involved in subunit interactions."
    explanation: >-
      The clustering of dominant TWNK variants at the subunit-interaction interface
      of a hexameric helicase is the structural basis for dominant-negative poisoning.
  - reference: PMID:16685652
    reference_title: "Mutant POLG2 disrupts DNA polymerase gamma subunits and causes progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although G451E p55 retains a wild-type ability to bind DNA, it fails to enhance the DNA-binding strength of the p140-p55 complex."
    explanation: >-
      Biochemical demonstration that the dominant POLG2 allele produces a subunit
      that assembles but does not function.
  - reference: PMID:16685652
    reference_title: "Mutant POLG2 disrupts DNA polymerase gamma subunits and causes progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vivo, the disease most likely arises through haplotype insufficiency or heterodimerization of the mutated and wild-type proteins, which promote mtDNA deletions by stalling the DNA replication fork."
    explanation: >-
      States the haploinsufficiency-or-heterodimerisation mechanism by which a single
      mutant allele stalls the fork.
  - reference: PMID:19664747
    reference_title: "A heterozygous truncating mutation in RRM2B causes autosomal-dominant progressive external ophthalmoplegia with multiple mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant mRNA escaped nonsense-mediated decay and resulted in a protein with truncation of 25 highly conserved C-terminal amino acids essential for the interaction with the ribonucleotide reductase subunit R1."
    explanation: >-
      Shows how a nonsense allele produces a dominant-negative rather than a null
      effect, explaining dominance at the RRM2B locus.
  - reference: PMID:15258572
    reference_title: "Structure-function defects of human mitochondrial DNA polymerase in autosomal dominant progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Polymerase mutants exhibit 0.03-30% wild-type polymerase activity and a 2- to 35-fold decrease in nucleotide selectivity in vitro."
    explanation: >-
      Quantifies the catalytic and fidelity defect of the dominant POLG alleles.
  - reference: PMID:15258572
    reference_title: "Structure-function defects of human mitochondrial DNA polymerase in autosomal dominant progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The reduced selectivity and catalytic efficiency of the autosomal dominant PEO mutants predict in vivo dysfunction, and the extent of biochemical defects correlates with the clinical severity of the disease."
    explanation: >-
      Links the magnitude of the biochemical lesion to clinical severity, supporting
      a dose-of-dysfunction model of dominance.
  - reference: PMID:41008644
    reference_title: "The First Heterozygous TWNK Nonsense Mutation Associated with Progressive External Ophthalmoplegia: Evidence for a New Piece in the Puzzle of Mitochondrial Diseases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, heterozygous nonsense variants in the gene have never been described in association with disease."
    explanation: >-
      The first report of a disease-associated heterozygous TWNK nonsense allele shows

- name: Multisystem PEO-Plus Extension
  biological_scale: ORGANISM
  description: >
    Because the nuclear lesion is expressed in every tissue, the same
    deletion-accumulation cascade produces a variable extension beyond the eye. The
    breadth of this extension is strongly genotype-dependent: it is widest in
    POLG-related adPEO, where parkinsonism from substantia nigra dopaminergic neuron
    loss (without Lewy bodies) and premature ovarian insufficiency cosegregate with the
    POLG allele; TWNK-related disease is comparatively narrow but can include myopathy,
    peripheral neuropathy, dysarthria, dysphagia, dysphonia, cataract, depression,
    parkinsonism, hearing loss and cardiac abnormalities; RRM2B-dominant disease is
    associated with bulbar dysfunction, hearing loss and gastrointestinal dysmotility.
    Severe psychiatric disease, historically severe retarded depression, was one of the
    earliest recognised non-ocular presentations of dominant PEO.

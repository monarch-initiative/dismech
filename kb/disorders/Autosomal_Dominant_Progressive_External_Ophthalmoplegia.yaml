    term:
      id: GO:0009394
      label: 2'-deoxyribonucleotide metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:10926541
    reference_title: "Role of adenine nucleotide translocator 1 in mtDNA maintenance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that ANT has a role in mtDNA maintenance and that a mitochondrial disease can be caused by a dominant mechanism."
    explanation: >-
      Establishes that the ADP/ATP carrier, though not a replisome component, is
      required for mtDNA maintenance and acts dominantly.
  - reference: PMID:23352259
    reference_title: "Mutations in DNA2 link progressive myopathy to mitochondrial DNA instability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "or that are involved in pathways for the synthesis of deoxyribonuclotides (ANT1 and RRM2B)"
    explanation: >-
      This older review groups ANT1 and RRM2B in a nucleotide-supply pathway, but it
      does not show that ANT1 transports dNTPs; the curated node preserves the
      distinction between RRM2B dNTP supply and ANT1 ADP/ATP exchange.
  - reference: PMID:28324239
    reference_title: "MtDNA-maintenance defects: syndromes and genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These errors of nuclear-mitochondrial intergenomic signaling may lead to mtDNA depletion, accumulation of mtDNA multiple deletions, or both, in critical tissues."

    snippet: "Mutations in the Twinkle (PEO1) gene are a recognized cause of autosomal dominant progressive external ophthalmoplegia (adPEO), resulting in the accumulation of multiple mitochondrial DNA (mtDNA) deletions and cytochrome c oxidase (COX)-deficient fibers in skeletal muscle secondary to a disorder of mtDNA maintenance."

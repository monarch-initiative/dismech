name: Autosomal Dominant Progressive External Ophthalmoplegia
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- adPEO
- adCPEO
- PEOA
- progressive external ophthalmoplegia, autosomal dominant
- progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant
description: >
  Autosomal dominant progressive external ophthalmoplegia (adPEO) is a genetically
  heterogeneous, nuclear-encoded disorder of mitochondrial DNA (mtDNA) maintenance.
  A single heterozygous pathogenic variant in one of at least six nuclear genes is
  sufficient to destabilise the mitochondrial genome, and the shared molecular
  signature of the group is the accumulation of MULTIPLE large-scale mtDNA deletions
  in post-mitotic tissue. The causative genes fall into two functional classes that
  converge on the same lesion: components of the mtDNA replisome itself (POLG, the
  catalytic polymerase gamma subunit, in PEOA1; POLG2, its p55 accessory subunit, in
  PEOA4; TWNK/C10orf2, the replicative Twinkle helicase, in PEOA3; and DNA2, a
  helicase/nuclease of mtDNA replication and long-patch base-excision repair, in
  PEOA6), and proteins that govern the mitochondrial deoxyribonucleotide (dNTP)
  supply (SLC25A4/ANT1, the heart and skeletal-muscle adenine nucleotide
  translocator, in PEOA2; and RRM2B/p53R2, the small subunit of ribonucleotide
  reductase that supplies dNTPs to non-dividing cells, in PEOA5).

  The molecular effect of heterozygosity is subtype-specific and is not fully resolved
  at every locus: biochemical loss of activity is established, while dominant-negative
  assembly, haploinsufficiency, and altered nucleotide or energy homeostasis have
  different levels of support for different genes. These defects converge on impaired
  mtDNA maintenance and the formation of deleted mtDNA species that accumulate and
  clonally expand within individual post-mitotic cells until they cross the biochemical
  threshold at which oxidative phosphorylation fails. The result is a mosaic
  respiratory-chain defect seen on muscle biopsy as ragged-red and cytochrome c
  oxidase (COX)-negative
  fibres. Extraocular muscle and the levator palpebrae superioris are the earliest
  and most severely affected tissues because they have a lower mutational threshold
  for COX deficiency than limb muscle, which explains the cardinal presentation of
  slowly progressive bilateral ptosis and symmetric ophthalmoparesis, typically with
  adult onset in the third to fifth decade.

  Beyond the eyes, adPEO is frequently a "PEO-plus" disorder with proximal and
  bulbar myopathy, exercise intolerance and fatigue, cardiac involvement, peripheral
  neuropathy, ataxia, hearing loss, cataract, parkinsonism and
  premature ovarian insufficiency. The breadth of extra-ocular involvement is
  strongly genotype-dependent: TWNK-related disease is comparatively restricted to
  the eyes, while POLG-related adPEO carries the highest burden of multisystem
  neurological extension. There is no disease-modifying therapy; management is
  supportive, centred on ptosis surgery, prism or strabismus correction,
  multidisciplinary rehabilitation, cardiac and respiratory surveillance, and
  genetic counselling for the 50% transmission risk. Valproic acid should be
  avoided.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple deletions, involving the same portion of muscle mtDNA, were identified in all patients."
    explanation: >-
      Founding demonstration of multiple mtDNA deletions in muscle in a dominantly
      inherited pedigree.

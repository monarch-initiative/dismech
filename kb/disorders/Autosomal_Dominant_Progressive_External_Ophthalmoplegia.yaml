- name: Multiple Large-Scale mtDNA Deletion Formation
  role: central_effector
  biological_scale: MOLECULAR
  description: >
    The molecular hallmark of adPEO is the accumulation of MULTIPLE, heterogeneous
    large-scale mtDNA deletions in clinically affected tissue - as distinct from the
    single, clonal large-scale deletion of sporadic Kearns-Sayre syndrome and
    sporadic CPEO. The deletions are somatic and arise over a lifetime on the
    background of the germline nuclear variant, so they are a secondary rather than
    a primary genetic lesion. The founding pedigree studied by Zeviani and colleagues
    showed that the deletions in affected relatives all began within a
    12-nucleotide stretch at the 5' end of the D-loop, establishing that a
    nuclear-coded protein defect can destroy mitochondrial genome integrity in a
    specific, heritable way.

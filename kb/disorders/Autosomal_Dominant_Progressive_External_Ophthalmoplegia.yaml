  - target: Multisystem PEO-Plus Extension
    description: >-
      Long, metabolically demanding post-mitotic cells elsewhere - dorsal root
      ganglion sensory neurons, cerebellar circuits, substantia nigra dopaminergic
      neurons, cochlear neurons, lens and oocytes - accumulate the same bioenergetic
      deficit.
    causal_link_type: DIRECT
- name: Ragged-Red and COX-Negative Fibre Pathology
  biological_scale: TISSUE
  description: >
    In respiratory-chain-deficient fibre segments a retrograde signalling response
    drives compensatory mitochondrial biogenesis. The resulting subsarcolemmal and
    intermyofibrillar accumulation of structurally abnormal mitochondria produces the
    ragged-red fibre on modified Gomori trichrome and the COX-negative /
    SDH-hyperreactive fibre on sequential COX-SDH histochemistry. The severity of
    these changes is variable in adPEO and can be mild even in genetically confirmed
    patients, so a bland biopsy does not exclude the diagnosis.

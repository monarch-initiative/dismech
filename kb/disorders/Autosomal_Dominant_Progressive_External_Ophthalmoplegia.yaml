- name: Multiple Large-Scale mtDNA Deletions in Muscle
  description: >
    Molecular analysis of the muscle biopsy - long-range PCR, Southern blot or deep
    sequencing of muscle-extracted mtDNA - demonstrates multiple heterogeneous
    large-scale mtDNA deletions. This is the finding that redirects the diagnostic
    workup from the mitochondrial to the nuclear genome. Importantly, some patients
    show deletions only on PCR-based assays and not on Southern blot, so a normal
    Southern blot does not exclude the diagnosis. Long-range PCR is the practical
    first-line assay.

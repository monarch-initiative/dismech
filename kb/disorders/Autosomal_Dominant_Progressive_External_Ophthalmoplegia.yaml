- category: Ophthalmologic
  name: Exotropia with Diplopia
  description: >
    Although symmetric ophthalmoparesis usually spares patients from diplopia, a subset
    develop symptomatic ocular misalignment. A characteristic pattern is bilateral
    profound impairment of adduction with relative preservation of abduction, producing
    intermittent exotropia whose control deteriorates over time even when the angle of
    deviation itself is stable. This is the subgroup for whom prisms or strabismus
    surgery are considered.

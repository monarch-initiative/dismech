- name: Replication Fork Stalling and Impaired mtDNA Synthesis
  biological_scale: MOLECULAR
  description: >
    The convergent proximal consequence of every adPEO allele is pausing or stalling
    of the mitochondrial replication fork. Expression of dominant Twinkle alleles
    causes replication intermediates to pile up in human cells and in the Deletor
    mouse, the direct signature of a stalled fork; the POLG2 p.G451E accessory subunit
    stalls the fork by failing to stimulate the catalytic subunit; the dominant POLG
    p.Y955C allele instead retains catalytic rate but suffers a 45-fold loss of
    affinity for the incoming dNTP and becomes markedly error-prone. Structural work
    on TWINKLE shows that adPEO variants act by destroying linker flexibility,
    inhibiting ring closure, or altering the subunit stoichiometry of the helicase
    ring, and abolish the nucleotide-triphosphate-driven conformational change of the
    wild-type enzyme.
  locations:

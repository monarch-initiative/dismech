- name: Multiple Large-Scale mtDNA Deletions
  biological_scale: MOLECULAR
  description: >
    The molecular hallmark of adPEO is the accumulation, in post-mitotic tissue and
    especially skeletal and extraocular muscle, of MULTIPLE different large-scale
    mtDNA deletions with heterogeneous breakpoints. Because the nuclear defect is
    constitutional and permanent, deletions are generated continuously throughout
    life - they are somatically acquired even though the predisposing variant is
    germline. This distinguishes adPEO from sporadic CPEO and Kearns-Sayre syndrome,
    in which a SINGLE clonal large-scale deletion arises once in the germline or early
    embryo. Detection uses long-range PCR, Southern blotting or deep sequencing of
    mtDNA extracted from muscle; in some patients the deletions are only visible by
    PCR-based assays and not by Southern blot, so a negative blot does not exclude the
    diagnosis. Blood is frequently uninformative.
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:

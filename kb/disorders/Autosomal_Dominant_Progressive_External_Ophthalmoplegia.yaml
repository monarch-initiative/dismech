    evidence_source: HUMAN_CLINICAL
    snippet: "Ptosis and ophthalmoparesis were almost universal clinical features among this cohort"
    explanation: >-
      Independent genotyped cohort describing ptosis as almost universal.
- category: Ocular
  name: Progressive external ophthalmoplegia
  description: >
    Slowly progressive, usually symmetric limitation of eye movement in all

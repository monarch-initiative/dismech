      that encompasses dominant POLG disease.
- category: Ophthalmologic
  name: Progressive External Ophthalmoplegia
  description: >
    Bilateral, usually symmetric, omnidirectional and slowly progressive limitation of
    eye movement from mitochondrial failure of the extraocular muscles, with typical
    adult onset. Slowed and hypometric saccades may precede fixed limitation of gaze.
    Because the restriction is symmetric, patients often do not report diplopia despite
    marked measurable ophthalmoparesis.
  phenotype_term:
    preferred_term: Progressive external ophthalmoplegia
    term:

histopathology:
- name: Mitochondrial Change on Skeletal Muscle Biopsy
  description: >
    Muscle biopsy in adPEO shows the composite mitochondrial signature: ragged-red
    fibres on modified Gomori trichrome, subsarcolemmal mitochondrial accumulation,
    and mosaic COX-negative fibre segments on sequential COX/SDH histochemistry.
    Mitochondrial change was present in all 19 available biopsies in the genotyped
    TWNK adPEO cohort and in 95% of a mixed-aetiology 89-case mitochondrial PEO
    series. The burden of change varies remarkably between patients, so a sparse or
    equivocal biopsy does not exclude the diagnosis.
  diagnostic: true
  evidence:
  - reference: PMID:35011763
    reference_title: "Clinical, Histological, and Genetic Features of 25 Patients with Autosomal Dominant Progressive External Ophthalmoplegia (ad-PEO)/PEO-Plus Due to TWNK Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 19 available muscle biopsies showed signs of mitochondrial dysfunction."
    explanation: >-
      Establishes mitochondrial histological change in every available biopsy from
      this genetically confirmed TWNK-related cohort.
  - reference: PMID:32161153
    reference_title: "Clinical, pathological and genetic spectrum in 89 cases of mitochondrial progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy was the most accurate test, showing mitochondrial changes in 95%."
    explanation: >-
      Quantifies the diagnostic yield of muscle biopsy in mitochondrial PEO.
  - reference: PMID:20479361
    reference_title: "The clinical, histochemical, and molecular spectrum of PEO1 (Twinkle)-linked adPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial histochemical changes observed in muscle showed remarkable variability"
    explanation: >-
      Documents the between-patient variability that limits the negative predictive
      value of biopsy.
- name: Multiple Large-Scale mtDNA Rearrangements in Muscle
  description: >
    Molecular analysis of the biopsy by long-range PCR, Southern blot or deep
    sequencing demonstrates multiple heterogeneous large-scale mtDNA deletions. This
    is the finding that redirects the diagnostic workup from the mitochondrial to the
    nuclear genome and is the discriminator against the single clonal deletion of
    sporadic CPEO and Kearns-Sayre syndrome. In the 89-case mitochondrial PEO series,
    multiple mtDNA deletions accounted for 26% of cases and were attributable to
    TWNK, POLG, TK2 or RRM2B.
  diagnostic: true
  evidence:
  - reference: PMID:32161153
    reference_title: "Clinical, pathological and genetic spectrum in 89 cases of mitochondrial progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single large-scale mitochondrial DNA (mtDNA) deletion was the most frequent finding (63%), followed by multiple mtDNA deletions (26%) due to mutations in TWNK (n=8), POLG (n=7), TK2 (n=6) or RRM2B (n=2) genes, and point mtDNA mutations (7%)."
    explanation: >-
      Quantifies the molecular architecture of mitochondrial PEO and the nuclear genes
      responsible for the multiple-deletion subset.

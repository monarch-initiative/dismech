    demonstrable in clinically affected tissue (usually skeletal muscle) by
    long-range PCR, Southern blot or deep sequencing. This is the defining molecular
    phenotype of the disease group and the finding that redirects the diagnostic
    workup from the mitochondrial to the nuclear genome. Sensitivity depends on
    method: in some patients the deletions are detectable only by PCR-based assays
    and not by Southern blotting.

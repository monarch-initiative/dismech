    description: >-
      Respiratory-chain-deficient fibre segments lose COX histochemical activity and
      undergo compensatory subsarcolemmal mitochondrial proliferation.
    causal_link_type: DIRECT
  - target: Selective Extraocular and Levator Muscle Failure
    description: >-

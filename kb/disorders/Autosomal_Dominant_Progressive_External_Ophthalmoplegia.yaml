    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal-dominant progressive external ophthalmoplegia (adPEO) is a mitochondrial disorder that is characterized by accumulation of multiple mitochondrial DNA (mtDNA) deletions in postmitotic tissues."

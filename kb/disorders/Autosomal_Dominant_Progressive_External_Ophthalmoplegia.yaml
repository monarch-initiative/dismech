    reference_title: "Mutant POLG2 disrupts DNA polymerase gamma subunits and causes progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The progressive accumulation of mtDNA deletions causes COX deficiency in muscle fibers and results in the clinical phenotype."
    explanation: >
      States the causal step from accumulating deletions to fibre COX deficiency to
      clinical disease in dominant POLG2 adPEO.
  - reference: PMID:1634620

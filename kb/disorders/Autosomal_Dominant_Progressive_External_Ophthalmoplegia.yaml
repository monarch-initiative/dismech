treatments:
- name: Supportive and Multidisciplinary Care
  description: >
    There is no approved disease-modifying therapy for adPEO. Management is
    supportive and multidisciplinary: occupational, physical and speech therapy for
    the myopathy and bulbar involvement; nutritional and swallowing support;
    respiratory support where needed; hearing and low-vision support; and periodic
    cardiac and respiratory surveillance. Coenzyme Q10, riboflavin and other
    "mitochondrial cocktail" supplements are widely used empirically, but no
    adPEO-specific efficacy evidence was identified.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38391710
    reference_title: "Mitochondrial Chronic Progressive External Ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No definitive treatment option is available for mitochondrial diseases, and management is mainly focused on lifestyle risk modification and supplementation to reduce mitochondrial load and symptomatic relief, such as ptosis repair in the case of CPEO."
    explanation: >-
      Contemporary review stating the absence of definitive therapy and the
      supportive, symptom-directed model of care for mitochondrial CPEO.
  - reference: PMID:24741716
    reference_title: "RRM2B Mitochondrial DNA Maintenance Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, there are no known cures and few effective treatments for any forms of mitochondrial disease, including the RRM2B-MDMDs."
    explanation: >-
      GeneReviews confirms the absence of curative or disease-modifying therapy for
      the mtDNA maintenance defects.
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical management is largely supportive and involves standard approaches for associated complications including occupational, physical, and speech therapy; nutritional support; respiratory support"
    explanation: >-
      GeneReviews specifies the components of supportive multidisciplinary management.
- name: Ptosis Surgery (Levator Advancement or Frontalis Suspension)
  description: >
    Surgical correction is the mainstay of symptomatic treatment for the ptosis of
    adPEO, chosen according to levator excursion: levator advancement or resection
    where levator function is preserved, frontalis suspension (sling) where it is
    not. Myogenic ptosis is a particularly difficult surgical target because the
    ptosis continues to worsen and because the same mitochondrial myopathy impairs
    protective corneal mechanisms (Bell phenomenon, orbicularis closure). Deliberate
    under-correction is therefore standard, at the cost of a high recurrence rate.
  treatment_term:
    preferred_term: Ophthalmologic Surgical Procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical techniques predominantly involved levator advancement, levator resection, frontalis sling, blepharoplasty, and Fasanella-Servat."
    explanation: >-
      Enumerates the surgical options used for progressive myogenic ptosis, of which
      CPEO is an explicitly analysed subgroup.
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, myogenic ptosis is especially challenging as it is characterized by worsening ptosis and the loss of protective corneal mechanisms."
    explanation: >-
      Explains why mitochondrial myogenic ptosis carries a higher surgical risk than
      other ptosis aetiologies.
  - reference: PMID:36178005
    reference_title: "A review of surgical management of progressive myogenic ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The goals of care with myogenic ptosis involves repairing ptosis just sufficiently to alleviate visual obstruction while avoiding adverse post-operative complications."
    explanation: >-
      Establishes the deliberate-under-correction principle governing ptosis surgery
      in mitochondrial ocular myopathy.
- name: Avoidance of Valproic Acid (Contraindicated)
  description: >
    Valproic acid and sodium divalproate must be avoided in POLG-related disease,
    including PEOA1, because they can precipitate or accelerate liver disease and
    fatal hepatic failure; POLG genotype prospectively identifies individuals at
    high risk. GeneReviews extends an equivalent caution to RRM2B-related disease,
    where valproate should be used only in exceptional circumstances. Because
    epilepsy can occur in POLG-related disease and valproate is a common
    anticonvulsant choice, this is the single most actionable prescribing fact in
    adPEO. This record is curated with negative valence: the intervention is
    withholding the drug, not administering it. SCOPE LIMIT: the caution is
    GENOTYPE-DIRECTED, not adPEO-wide. It is established for POLG (PEOA1) and extended
    by GeneReviews to RRM2B (PEOA5); no equivalent evidence exists for the SLC25A4
    (PEOA2), TWNK (PEOA3), POLG2 (PEOA4) or DNA2 (PEOA6) subtypes, and this entry does
    not assert one for them. Note also that the underlying hepatotoxicity literature is
    dominated by BIALLELIC POLG disease, so its transfer to heterozygous dominant adPEO
    is an extrapolation of prescribing caution rather than a directly demonstrated
    dominant-genotype risk.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "because of the risk of precipitating and/or accelerating liver disease"
    explanation: >-
      GeneReviews lists valproic acid and sodium divalproate under
      Agents/circumstances to avoid for POLG-related disorders.
  - reference: PMID:24741716
    reference_title: "RRM2B Mitochondrial DNA Maintenance Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Valproic acid should be used only in exceptional circumstances."
    explanation: >-
      GeneReviews extends the valproate caution to RRM2B mtDNA maintenance defects,
      which include the adPEO phenotype.
  - reference: PMID:21038416
    reference_title: "Polymerase γ gene POLG determines the risk of sodium valproate-induced liver toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings implicate impaired liver regeneration in VPA toxicity and show that prospective genetic testing of POLG will identify individuals at high risk of this potentially fatal consequence of treatment."
    explanation: >-
      Demonstrates that POLG genotype prospectively identifies valproate
      hepatotoxicity risk, making avoidance an actionable, genotype-driven decision.
- name: Genetic Counseling and Cascade Testing
  description: >
    Because adPEO is dominantly transmitted, each child of an affected individual
    has a 50% risk. Counselling should cover the transmission risk, the variable
    expressivity and late onset that make the phenotype easy to miss in relatives,
    the availability of prenatal and preimplantation genetic testing once the
    familial variant is known, and the germline-mosaicism caveat that an apparently
    de novo case does not guarantee negligible sibling recurrence risk. For POLG and
    RRM2B, counselling must establish whether the family carries a dominant
    (monoallelic) or a recessive (biallelic) genotype, since the recurrence risks
    differ fundamentally.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24741716
    reference_title: "RRM2B Mitochondrial DNA Maintenance Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the RRM2B pathogenic variant(s) have been identified in an affected family member, prenatal and preimplantation genetic testing for RRM2B-MDMD are possible."
    explanation: >-
      GeneReviews confirms the availability of prenatal and preimplantation testing
      once the familial variant is known.
  - reference: PMID:35011763
    reference_title: "Clinical, Histological, and Genetic Features of 25 Patients with Autosomal Dominant Progressive External Ophthalmoplegia (ad-PEO)/PEO-Plus Due to TWNK Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accurate differential diagnosis and early confirmation with appropriately chosen complementary studies allow genetic counseling and the avoidance of unnecessary treatments."
    explanation: >-
      States the dual value of early molecular confirmation: enabling counselling and
      preventing futile treatment.
- name: Physical Therapy and Paced Exercise
  description: >
    Individualised submaximal aerobic and resistance training, physiotherapy, activity
    pacing and fall prevention are offered for the myopathic component. Exercise is
    supportive rather than disease-modifying and should be prescribed at submaximal
    intensity given the limited oxidative reserve.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including occupational, physical, and speech therapy"
    explanation: >-
      GeneReviews includes physical therapy among the standard supportive measures.
- name: Elamipretide (Investigational, Not Approved)
  description: >
    Elamipretide is a mitochondria-targeted tetrapeptide investigated for primary
    mitochondrial myopathy. It is NOT approved for adPEO or for any mitochondrial
    myopathy indication, and the Phase 3 MMPOWER-3 trial was NEGATIVE in its
    genotypically diverse primary mitochondrial myopathy population. A POST HOC
    genotype-stratified analysis found that participants carrying mtDNA replisome
    variants who also had CPEO - broadly the adPEO population - improved on the
    six-minute walk test by 37.3 +/- 9.5 m versus -8.0 +/- 10.7 m on placebo at week
    24 (p=0.0024), with the replisome cohort as a whole only trending toward benefit
    (p=0.06). This is a hypothesis-generating exploratory subgroup finding from a
    trial that failed its primary endpoints; it is NOT evidence of efficacy. It
    motivated the dedicated Phase 3 NuPOWER trial (NCT05162768) in nuclear-DNA
    primary mitochondrial disease, and no efficacy conclusion can be drawn until
    those results are published. This treatment is curated so that the negative
    parent-trial result is on the record alongside the subgroup signal.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: elamipretide
      term:
        id: NCIT:C171874
        label: Elamipretide
  therapeutic_modality: PEPTIDE
  target_phenotypes:
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:39574155
    reference_title: "Genotype-specific effects of elamipretide in patients with primary mitochondrial myopathy: a post hoc analysis of the MMPOWER-3 trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "As previously published, the MMPOWER-3 clinical trial did not demonstrate a significant benefit of elamipretide treatment in a genotypically diverse population of adults with primary mitochondrial myopathy (PMM)."
    explanation: >-
      The negative primary result of the parent Phase 3 trial, recorded explicitly and
      first so that the post-hoc subgroup signal below cannot be read as established
      efficacy.
  - reference: PMID:39574155
    reference_title: "Genotype-specific effects of elamipretide in patients with primary mitochondrial myopathy: a post hoc analysis of the MMPOWER-3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The 6MWT results at week 24 in subjects with replisome variants showed a significant change in the elamipretide group subjects who had chronic progressive external ophthalmoplegia (CPEO) (37.3 ± 9.5 m versus - 8.0 ± 10.7 m for the placebo group; p = 0.0024)."
    explanation: >-
      The quantitative result for the replisome-plus-CPEO subgroup, which is the
      subgroup corresponding to adPEO. Cited as PARTIAL because it is an exploratory
      post-hoc subgroup analysis of a trial that failed its primary endpoints, not
      confirmatory efficacy evidence.
  - reference: PMID:39574155
    reference_title: "Genotype-specific effects of elamipretide in patients with primary mitochondrial myopathy: a post hoc analysis of the MMPOWER-3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These data serve as the foundation for a follow-up Phase 3 clinical trial (NuPOWER) which has been designed as described in this paper to determine the efficacy of elamipretide in patients with mtDNA maintenance-related disorders."
    explanation: >-
      Confirms that efficacy in exactly the adPEO population remains an open question
      to be resolved by a dedicated confirmatory trial.
  notes: >
    Not approved for adPEO or any mitochondrial myopathy indication at the time of
    curation. Do not present the post-hoc 6MWT figure as a treatment effect estimate.
diagnosis:
- name: Molecular Diagnosis by a Single Heterozygous Nuclear Variant
  description: >
    Diagnosis rests on the clinical picture of adult-onset progressive ptosis and
    external ophthalmoplegia, usually with a dominant family history, plus
    identification of a SINGLE heterozygous pathogenic variant in POLG, SLC25A4,
    TWNK, POLG2, RRM2B or DNA2. The monoallelic requirement is what distinguishes
    adPEO from its recessive counterparts at the shared POLG and RRM2B loci, and
    GeneReviews states it explicitly for POLG. Practice has shifted toward
    panel or exome-first testing: in TWNK-related adPEO, direct sequencing is
    recommended before muscle biopsy. Where genetics is inconclusive, muscle biopsy
    with COX/SDH histochemistry and mtDNA rearrangement analysis remains the most
    accurate single test, and analysis of a clinically affected tissue is required
    because the secondary deletions can be tissue-restricted.
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "for which identification of a heterozygous POLG pathogenic variant on molecular genetic testing is diagnostic"
    explanation: >-
      GeneReviews states that a single heterozygous POLG variant is diagnostic for
      adPEO, in explicit contrast to the biallelic requirement for the recessive
      phenotypes.
  - reference: PMID:20479361
    reference_title: "The clinical, histochemical, and molecular spectrum of PEO1 (Twinkle)-linked adPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of the PEO1 gene should be considered in adPEO patients prior to muscle biopsy."
    explanation: >-
      Supports a genetics-first diagnostic pathway in adPEO.
  - reference: PMID:32161153
    reference_title: "Clinical, pathological and genetic spectrum in 89 cases of mitochondrial progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy was the most accurate test, showing mitochondrial changes in 95%. Genetic diagnosis was achieved in 96% of the patients."
    explanation: >-
      Quantifies the yield of biopsy and of molecular testing in mitochondrial PEO.
  - reference: PMID:42366043
    reference_title: "A de novo TWNK Variant Mimicked Sporadic Chronic Progressive External Ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although TWNK pathogenic variants typically cause autosomal dominant CPEO, this case mimicked a sporadic form, thus highlighting the importance of a nuclear gene analysis in such cases."
    explanation: >-
      Shows that absence of family history does not exclude a dominant nuclear cause
      and directly supports nuclear-gene analysis in apparently sporadic CPEO.
- name: Demonstration of Multiple (Not Single) mtDNA Deletions in Muscle
  description: >
    The decisive molecular discriminator between adPEO and sporadic CPEO or
    Kearns-Sayre syndrome is whether muscle carries MULTIPLE heterogeneous deletions
    (nuclear-gene disease, dominant recurrence risk) or a SINGLE clonal large-scale
    deletion (sporadic, negligible recurrence risk). In an 89-case mitochondrial PEO
    series, a single deletion accounted for 63% and multiple deletions for 26%.
    Detection method matters: in some patients the multiple deletions are visible only
    on PCR-based assays and not on Southern blotting.
  evidence:
  - reference: PMID:32161153
    reference_title: "Clinical, pathological and genetic spectrum in 89 cases of mitochondrial progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If no mtDNA deletions are identified, whole mtDNA sequencing should be performed."
    explanation: >-
      States the escalation step in the diagnostic algorithm for mitochondrial PEO.
  - reference: PMID:20479361
    reference_title: "The clinical, histochemical, and molecular spectrum of PEO1 (Twinkle)-linked adPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which in some patients were only detected by PCR-based assays and not Southern blotting"
    explanation: >-
      Important methodological caveat: Southern blotting alone can miss the defining
      molecular finding.
- name: Serum FGF21 and GDF15 as Non-Invasive Adjuncts
  description: >
    FGF21 and GDF15 are circulating markers of the mitochondrial integrated stress
    response and outperform muscle histology as a screening test in mitochondrial
    disease: in a 194-sample study only 39% of genetically verified patients had
    mitochondrial pathology on muscle histology, whereas biomarkers were elevated in
    62%. In a myopathic patient with at least one elevated biomarker, an
    mtDNA-expression disorder - the class that includes adPEO - was the cause with 94%
    probability. They are best positioned as non-invasive first-line tests preceding
    genetic sequencing. Normal values do not exclude disease, and neither marker is
    specific for the dominant nuclear form or for adPEO in particular.
  evidence:
  - reference: PMID:32857451
    reference_title: "Diagnostic value of serum biomarkers FGF21 and GDF15 compared to muscle sample in mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 39% of patients with genetically verified mitochondrial disease had mitochondrial pathology in their muscle histology. In contrast, biomarkers were elevated in 62% of patients with genetically verified mitochondrial disease."
    explanation: >-
      Quantifies the diagnostic advantage of the serum biomarkers over muscle histology
      in a 194-sample cohort.
  - reference: PMID:32857451
    reference_title: "Diagnostic value of serum biomarkers FGF21 and GDF15 compared to muscle sample in mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If at least one of the biomarkers was induced and the patient had a myopathic disease, a mitochondrial DNA expression disease was the cause with 94% probability."
    explanation: >-
      Gives the positive predictive value in exactly the clinical situation adPEO
      presents in - a myopathic patient with an mtDNA-expression defect.
  - reference: PMID:38391710
    reference_title: "Mitochondrial Chronic Progressive External Ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic sequencing is the gold standard for diagnosing mitochondrial encephalomyopathies, preceded by non-invasive tests such as fibroblast growth factor-21 and growth differentiation factor-15."
    explanation: >-
      A CPEO-specific review positioning FGF21 and GDF15 ahead of sequencing in the
      diagnostic pathway.
  - reference: PMID:41822038
    reference_title: "Clinical Heterogeneity and Candidate Biomarkers in POLG-Related Mitochondrial Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "GDF15 was elevated in 87.5% of patients, with a mean level of 3,315 pg/mL (±1,559.79), showing no significant differences between myopathic and ANS phenotypes, supporting its role as a general biomarker of mitochondrial dysfunction."
    explanation: >-
      Current POLG-cohort evidence supports GDF15 as a general mitochondrial biomarker;
      PARTIAL reflects that the cohort includes dominant and recessive POLG disorders
      rather than adPEO alone.
clinical_trials:
- name: NCT05162768
  phase: PHASE_III
  status: COMPLETED
  description: >
    NuPOWER (SPIMD-301): a 48-week randomised, double-blind, parallel-group,
    placebo-controlled Phase 3 trial of daily subcutaneous elamipretide in subjects
    with primary mitochondrial myopathy caused by nuclear DNA mutations - the
    population that includes adPEO. Designed as the confirmatory follow-up to the
    post-hoc replisome/CPEO signal from MMPOWER-3. Listed as completed, but results
    were not available in the registry record at the time of curation, so no efficacy
    conclusion can be drawn from completion status alone.
  target_phenotypes:
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: clinicaltrials:NCT05162768
    reference_title: >-
      A Phase 3 Randomized, Double-Blind, Parallel-Group, Placebo-Controlled Trial to
      Evaluate the Efficacy and Safety of Daily Subcutaneous Injections of Elamipretide
      in Subjects With Primary Mitochondrial Disease Resulting From Pathogenic Nuclear

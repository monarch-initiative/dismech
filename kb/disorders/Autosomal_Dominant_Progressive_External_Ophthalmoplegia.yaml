name: Autosomal Dominant Progressive External Ophthalmoplegia
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- adPEO
- adCPEO
- autosomal dominant chronic progressive external ophthalmoplegia
- progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
  dominant
- dominant PEO
description: >
  Autosomal dominant progressive external ophthalmoplegia (adPEO) is a genetically
  heterogeneous, usually adult-onset nuclear-encoded disorder of mitochondrial DNA
  (mtDNA) maintenance. A single heterozygous pathogenic variant in one of the nuclear
  genes that build or supply the mtDNA replisome is sufficient to destabilise
  replication of the mitochondrial genome. Two functional modules are involved: the
  replisome itself - POLG (polymerase gamma catalytic subunit), POLG2 (its p55
  accessory subunit), TWNK/C10orf2 (the Twinkle hexameric ring helicase), and DNA2
  (a helicase/nuclease acting in primer and flap processing) - and the machinery that
  supplies and balances the mitochondrial deoxyribonucleotide pool, namely RRM2B (the
  p53-inducible small subunit of ribonucleotide reductase) and SLC25A4/ANT1 (the
  heart/skeletal-muscle adenine nucleotide translocator).

  Whatever the entry point, the shared consequence is replication-fork pausing or
  stalling, which resolves through illegitimate recombination or slipped-strand
  mispairing between the direct repeats of the mitochondrial major arc and generates
  a heterogeneous population of large-scale mtDNA deletions. Because the nuclear
  lesion is constitutional and permanent, these deletions are produced continuously
  through life and are somatically accumulated - the defining molecular signature is
  MULTIPLE mtDNA deletions in post-mitotic tissue, not one clonal deletion. Deleted
  genomes then clonally expand within individual long-lived cells until the mutant
  fraction crosses the heteroplasmy threshold at which mtDNA-encoded subunits of
  complexes I, III, IV and V become limiting. The result is a mosaic, fibre-by-fibre
  respiratory-chain deficiency seen histologically as ragged-red and cytochrome c
  oxidase (COX)-negative fibres.

  Clinically the disorder is defined by slowly progressive, usually symmetric
  bilateral ptosis and multidirectional limitation of eye movement, with typical
  onset between the second and fourth decades; the extraocular muscles and levator
  palpebrae superioris fail first because they are tonically active and exceptionally
  mitochondria-rich. Symmetry means diplopia is less common than the degree of
  ophthalmoparesis would predict. Most patients also have a proximal mitochondrial
  myopathy with exercise intolerance and fatigue. A variable "PEO-plus" extension -
  peripheral neuropathy, ataxia, dysphagia, dysarthria, dysphonia, sensorineural
  hearing loss, cataract, parkinsonism, depression and other psychiatric change,
  premature ovarian insufficiency and hypogonadism - reflects the same bioenergetic
  lesion expressed in other high-demand post-mitotic tissue, and is broadest in
  POLG-related disease and narrowest in TWNK-related disease.

  Scope boundary: this entry covers ONLY the autosomal dominant, nuclear-gene,
  multiple-mtDNA-deletion arm. The recessive POLG arm is curated separately as
  Autosomal Recessive Progressive External Ophthalmoplegia 1; sporadic
  single-large-scale-mtDNA-deletion CPEO and Kearns-Sayre syndrome are primary mtDNA
  disorders with a different molecular lesion and are curated separately; and the
  OPA1 dominant optic-atrophy-plus spectrum, which can also carry multiple mtDNA
  deletions, is covered by Autosomal Dominant Optic Atrophy Plus. There is no
  disease-modifying therapy; management is supportive.

    term:
      id: MONDO:0024528
      label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant 1
  description: >-
    adPEO caused by a heterozygous pathogenic variant in POLG, the catalytic A
    subunit of mitochondrial DNA polymerase gamma. The dominant alleles cluster in
    the polymerase domain (classically p.Y955C in motif B, plus p.G923D, p.R943H and
    p.A957S) and reduce both catalytic efficiency and nucleotide selectivity. PEOA1
    is the single commonest identified cause of familial PEO with multiple mtDNA
    deletions and carries the heaviest burden of multisystem extension, including
    parkinsonism and premature ovarian insufficiency. It must not be conflated with
    its recessive sibling PEOB1, which requires two POLG alleles.

- name: Nigrostriatal Dopaminergic Degeneration
  role: outcome
  biological_scale: TISSUE
  conforms_to: "parkinsonism_dopaminergic_degeneration#Nigrostriatal Dopaminergic Neurodegeneration"
  description: >
    In POLG-related adPEO, mtDNA deletions accumulate in substantia nigra pars
    compacta dopaminergic neurons, which are exceptionally vulnerable because of
    their long unmyelinated axons, high basal energy demand and pacemaking calcium
    load. Parkinsonism cosegregated highly significantly with POLG mutations across
    seven adPEO families, PET showed dopaminergic neuron loss, and post-mortem
    examination in two individuals showed loss of pigmented neurons and pigment
    phagocytosis in the substantia nigra WITHOUT Lewy bodies. The absence of Lewy
    pathology is mechanistically informative: this is a primary bioenergetic
    nigrostriatal degeneration rather than an alpha-synucleinopathy, which is why
    conformance is declared at the nigrostriatal-neurodegeneration node of the
    parkinsonism module and NOT at its alpha-synuclein aggregation node.

- category: Muscular
  name: Cytochrome C oxidase-negative muscle fibers
  description: >
    Mosaic loss of cytochrome c oxidase (complex IV) histochemical reactivity in
    scattered fibre segments, with preserved or increased succinate dehydrogenase
    (complex II) reactivity. Because three complex IV catalytic subunits are
    mtDNA-encoded while complex II is entirely nuclear-encoded, this
    COX-negative/SDH-positive pattern indicates impaired mtDNA expression, including
    secondary mtDNA defects caused by nuclear maintenance-gene variants.
  phenotype_term:
    preferred_term: Cytochrome C oxidase-negative muscle fibers
    term:

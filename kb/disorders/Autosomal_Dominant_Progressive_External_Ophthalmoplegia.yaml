      dominant TWNK genotype.
  downstream:
  - target: Replication Fork Stalling on mtDNA
    description: >-
      A poisoned or under-stimulated replisome cannot sustain processive synthesis
      around the 16.6 kb mitochondrial genome, so replication forks stall.
    causal_link_type: DIRECT
- name: Mitochondrial Nucleotide and Energy Homeostasis Disruption
  role: effector
  biological_scale: MOLECULAR
  description: >
    RRM2B supplies deoxyribonucleotides for mtDNA synthesis in non-dividing cells,
    whereas SLC25A4/ANT1 exchanges ADP and ATP across the inner mitochondrial membrane.
    Both influence mtDNA maintenance, but they do not license the same proximal claim:
    RRM2B variants directly perturb dNTP supply, while the route from defective ADP/ATP
    exchange to multiple mtDNA deletions remains incompletely defined. This node
    therefore records the shared disruption of nucleotide and energy homeostasis,
    with an indirect edge to replication-fork dysfunction rather than asserting that
    ANT1 itself transports dNTPs.
  locations:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  molecular_functions:
  - preferred_term: ATP:ADP antiporter activity
    term:
      id: GO:0005471
      label: ATP:ADP antiporter activity
    modifier: DECREASED
  - preferred_term: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor

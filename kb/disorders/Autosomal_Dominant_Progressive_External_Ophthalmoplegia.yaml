    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ptosis and PEO (92% and 80%) were the most common findings."
    explanation: >-
      Quantifies ptosis at 92% in a genotyped adPEO cohort, supporting the
      VERY_FREQUENT band.

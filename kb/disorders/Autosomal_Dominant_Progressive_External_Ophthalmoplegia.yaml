  description: >-
    adPEO caused by a heterozygous variant in TWNK (formerly C10orf2/PEO1), encoding
    Twinkle, the hexameric replicative 5'-3' DNA helicase that unwinds mtDNA ahead of
    polymerase gamma and colocalises with mtDNA in mitochondrial nucleoids. The
    dominant variants are often missense and cluster in functionally important
    regions, but pathogenic heterozygous nonsense and de novo alleles are also now
    documented. PEOA3 commonly presents as ocular-predominant mitochondrial myopathy,
    while longitudinal data show that CNS and multiorgan involvement can emerge over
    time.

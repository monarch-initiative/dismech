pathophysiology:
- name: Heterozygous Nuclear mtDNA-Maintenance Gene Defect
  biological_scale: MOLECULAR
  description: >
    A single heterozygous pathogenic variant in a nuclear gene required for mtDNA
    maintenance initiates the disease. The genes fall into two functional modules.
    (1) The mtDNA replisome and its processing enzymes: POLG (the catalytic
    polymerase-gamma subunit), POLG2 (the p55 accessory subunit that confers
    processivity), TWNK/Twinkle (the hexameric ring helicase that unwinds the
    template) and DNA2 (helicase/nuclease acting on primers and flaps). (2) The
    supply and balance of the mitochondrial deoxyribonucleotide pool: RRM2B (p53R2,
    the small subunit of ribonucleotide reductase that provides dNTPs to non-dividing
    cells) and SLC25A4/ANT1 (the adenine nucleotide translocator). Dominance arises
    by different routes depending on the allele - dominant-negative poisoning of a
    multimeric complex (Twinkle hexamers, polymerase-gamma heterotrimers, truncated
    p53R2 that cannot engage R1), or heterodimerisation/haploinsufficiency of the
    accessory subunit. The mechanism therefore cannot be inferred from the gene name
    alone and is properly assigned at the allele level.
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  - preferred_term: mitochondrial nucleoid
    term:
      id: GO:0042645
      label: mitochondrial nucleoid

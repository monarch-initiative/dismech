    explanation: >-
      The registry description of the confirmatory Phase 3 trial targeting the
      nuclear-DNA mitochondrial myopathy population to which adPEO belongs.
differential_diagnoses:
- name: Myasthenia Gravis
  disease_term:
    preferred_term: myasthenia gravis
    term:
      id: MONDO:0009688
      label: myasthenia gravis
  description: >
    The commonest misdiagnosis. Both cause ptosis and ophthalmoparesis, but
    myasthenic ptosis fluctuates and fatigues on sustained upgaze, whereas adPEO ptosis
    is fixed and slowly progressive over years. In the genotyped TWNK adPEO cohort,
    36% of patients had previously been misdiagnosed as myasthenia. Acetylcholine
    receptor antibodies, repetitive nerve stimulation and single-fibre EMG separate
    the two.
  distinguishing_features:
  - Fluctuating and fatigable weakness in myasthenia versus fixed slow progression in adPEO
  - Diplopia is common in myasthenia but can remain absent despite marked ophthalmoparesis in adPEO
  - Positive acetylcholine receptor antibodies and decrement on repetitive nerve stimulation in myasthenia
  - Response to anticholinesterase in myasthenia
  evidence:
  - reference: PMID:35011763
    reference_title: "Clinical, Histological, and Genetic Features of 25 Patients with Autosomal Dominant Progressive External Ophthalmoplegia (ad-PEO)/PEO-Plus Due to TWNK Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before definitive genetic confirmation, 56% of patients were misdiagnosed (36% with myasthenia, 20% with oculopharyngeal muscle dystrophy)."
    explanation: >-
      Quantifies myasthenia gravis as the leading misdiagnosis of adPEO, making it the
      most important differential.
- name: Oculopharyngeal Muscular Dystrophy
  disease_term:
    preferred_term: oculopharyngeal muscular dystrophy
    term:
      id: MONDO:0008116
      label: oculopharyngeal muscular dystrophy
  description: >
    An autosomal dominant late-onset myopathy caused by a short GCN trinucleotide
    repeat expansion in PABPN1, presenting with ptosis and dysphagia. It shares the
    dominant pedigree, the late onset and the ptosis-plus-bulbar phenotype with adPEO
    and accounted for 20% of prior misdiagnoses in the genotyped TWNK cohort. Extraocular
    motility is relatively spared in OPMD relative to the severity of the ptosis, and
    muscle biopsy shows rimmed vacuoles and intranuclear filamentous inclusions rather
    than ragged-red and COX-negative fibres.
  distinguishing_features:
  - PABPN1 GCN repeat expansion rather than a nuclear mtDNA maintenance gene variant
  - Rimmed vacuoles and intranuclear inclusions rather than ragged-red and COX-negative fibres
  - Ophthalmoparesis relatively mild for the degree of ptosis
  - No multiple mtDNA deletions in muscle
  evidence:
  - reference: PMID:35011763
    reference_title: "Clinical, Histological, and Genetic Features of 25 Patients with Autosomal Dominant Progressive External Ophthalmoplegia (ad-PEO)/PEO-Plus Due to TWNK Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "36% with myasthenia, 20% with oculopharyngeal muscle dystrophy"
    explanation: >-
      Quantifies oculopharyngeal muscular dystrophy as the second commonest
      misdiagnosis of adPEO.
- name: Single Large-Scale mtDNA Deletion Syndromes (Sporadic CPEO, Kearns-Sayre)
  disease_term:
    preferred_term: Kearns-Sayre syndrome
    term:
      id: MONDO:0010787
      label: Kearns-Sayre syndrome
  description: >
    Sporadic CPEO and Kearns-Sayre syndrome are caused by a SINGLE clonal large-scale
    mtDNA deletion arising in the germline or early embryogenesis, with no nuclear
    gene lesion and negligible recurrence risk. They are clinically almost
    indistinguishable from adPEO at the bedside, and are in fact the majority of
    mitochondrial PEO seen in clinic (63% of an 89-case series versus 26% with
    multiple deletions). Distinguishing single from multiple deletions on muscle mtDNA
    analysis is the decisive step and completely changes the genetic counselling.
  distinguishing_features:
  - Single clonal large-scale mtDNA deletion versus multiple heterogeneous deletions
  - Sporadic occurrence with negligible recurrence risk versus 50% dominant transmission
  - Kearns-Sayre adds retinopathy, cardiac conduction block and onset before age 20
  - No causative nuclear gene variant identified
  evidence:
  - reference: PMID:32161153
    reference_title: "Clinical, pathological and genetic spectrum in 89 cases of mitochondrial progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single large-scale mitochondrial DNA (mtDNA) deletion was the most frequent finding (63%), followed by multiple mtDNA deletions (26%)"
    explanation: >-
      Quantifies the relative frequency of the single-deletion and multiple-deletion
      classes, showing that the single-deletion syndromes are the larger group and the
      primary differential.
- name: Autosomal Recessive Progressive External Ophthalmoplegia (PEOB1 and Related)
  disease_term:
    preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive 1
    term:
      id: MONDO:0009783
      label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive 1
  description: >
    The recessive counterparts at the same loci: biallelic POLG variants cause PEOB1,
    and biallelic RRM2B variants cause a severe encephalomyopathic mtDNA depletion
    syndrome and an arPEO phenotype. The molecular endpoint (multiple mtDNA deletions)
    and much of the clinical picture are shared, so the distinction rests entirely on
    the NUMBER of pathogenic alleles and the pedigree, not on the gene or the
    phenotype. Recessive disease tends to earlier onset and heavier multisystem
    involvement.
  distinguishing_features:
  - Biallelic rather than monoallelic pathogenic variants
  - Typically earlier onset and heavier neurological extension
  - 25% sibling recurrence risk rather than 50% offspring transmission
  - Common European POLG founder alleles p.A467T and p.W748S in the recessive form
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Establishing the diagnosis of a POLG-related disorder relies on clinical findings and the identification of biallelic POLG pathogenic variants on molecular genetic testing for all phenotypes except autosomal dominant progressive external ophthalmoplegia (adPEO), for which identification of a heterozygous POLG pathogenic variant on molecular genetic testing is diagnostic."
    explanation: >-
      GeneReviews states the allele-count discriminator between the dominant and
      recessive POLG phenotypes.
  - reference: PMID:24741716
    reference_title: "RRM2B Mitochondrial DNA Maintenance Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RRM2B autosomal recessive progressive external ophthalmoplegia (arPEO), a typically childhood-onset predominantly myopathic phenotype of PEO, ptosis, proximal muscle weakness, and bulbar dysfunction."
    explanation: >-
      Defines the recessive RRM2B PEO phenotype that must be distinguished from
      dominant PEOA5.
- name: OPA1-Related Dominant Optic Atrophy Plus
  disease_term:
    preferred_term: autosomal dominant optic atrophy plus syndrome
    term:
      id: MONDO:0014720
      label: autosomal dominant optic atrophy plus syndrome
  description: >
    Heterozygous OPA1 variants cause a dominant syndrome that can include CPEO and
    multiple mtDNA deletions in muscle, so it overlaps adPEO both molecularly and
    clinically and is listed among the adPEO genes by some authors. It is excluded
    from the subtype list of this entry and modelled here as a differential instead,
    because its cardinal feature is bilateral progressive optic atrophy with central
    and colour vision loss, and because it acts through mitochondrial inner-membrane
    fusion and cristae architecture rather than through the mtDNA replisome or the
    nucleotide pool. dismech curates it separately as
    Autosomal_Dominant_Optic_Atrophy_Plus.
  distinguishing_features:
  - Bilateral optic atrophy with central and colour vision loss as the cardinal feature
  - Mechanism is mitochondrial inner-membrane fusion and cristae architecture, not the mtDNA replisome or dNTP supply
  - Distinct MONDO identity (MONDO:0014720) and a separate dismech entry
  evidence:
  - reference: PMID:19664747
    reference_title: "A heterozygous truncating mutation in RRM2B causes autosomal-dominant progressive external ophthalmoplegia with multiple mtDNA deletions."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is heterogeneous, with five known nuclear disease genes that encode the proteins ANT1, Twinkle, POLG, POLG2, and OPA1."
    explanation: >-
      Confirms that OPA1 is counted among the dominant nuclear genes producing an
      adPEO-overlapping phenotype, which is why it must be actively differentiated
      rather than ignored.
- name: Thyroid Eye Disease and Other Orbital Disease
  description: >
    Restrictive orbital myopathy from thyroid eye disease, orbital inflammatory
    disease or an orbital mass can mimic ophthalmoparesis. These are distinguished by
    proptosis, lid retraction rather than ptosis, orbital pain, forced-duction
    restriction and characteristic orbital imaging, and by the absence of a dominant
    family history or muscle mitochondrial pathology.
  distinguishing_features:
  - Proptosis and lid retraction rather than ptosis
  - Abnormal orbital imaging with extraocular muscle enlargement
  - Positive forced duction testing indicating a restrictive rather than myogenic process
  - Thyroid function and thyroid autoantibody abnormalities
  evidence:
  - reference: PMID:38391710
    reference_title: "Mitochondrial Chronic Progressive External Ophthalmoplegia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Understanding the varying presentations and genetic aspects of mitochondrial CPEO is crucial for accurate diagnosis and management."
    explanation: >-
      Review emphasising the diagnostic-accuracy problem in CPEO; cited as PARTIAL
      because the abstract does not itself enumerate the orbital differentials.
discussions:
- discussion_id: adpeo_dominance_mechanism_gap
  prompt: >-
    Why is a single heterozygous variant sufficient to destabilise the mitochondrial
    genome at six mechanistically different nuclear loci, when the recessive
    counterparts at two of those same loci (POLG, RRM2B) require two alleles?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dominant-Negative Subunit Poisoning and Haploinsufficiency
  rationale: >-
    Three distinct explanations are invoked in the literature and have never been
    discriminated head to head: dominant-negative poisoning of a multimer (Twinkle
    hexamer), haploinsufficiency or heterodimerisation within an obligate heterodimer
    (POLG2 p.G451E), and dominant-negative truncation of an interaction surface
    (RRM2B p.R327X). It is not established whether the SLC25A4/ANT1 alleles act by any
    of these routes or by a fourth, transport-based mechanism. This matters because
    the mechanism determines whether allele-specific silencing would be therapeutic
    (dominant-negative) or counterproductive (haploinsufficiency), and it is the axis
    on which any future gene-directed therapy would be designed.
  proposed_experiments:
  - experiment_id: adpeo_allelic_titration_replisome
    name: Allelic titration of mutant versus wild-type replisome subunits
    description: >-
      In an isogenic human cell system, titrate the mutant:wild-type ratio of Twinkle,
      POLG, POLG2 and RRM2B and measure mtDNA copy number, deletion burden and fork
      progression, to distinguish a haploinsufficiency dose-response (linear from 50%)
      from dominant-negative poisoning (worse than 50% function at 50% mutant).
  - experiment_id: adpeo_allele_specific_knockdown
    name: Allele-specific knockdown of the mutant transcript in patient cells
    description: >-
      Selectively silence the mutant allele in patient-derived myoblasts for each of
      the six genes and ask whether mtDNA deletion burden falls (supporting
      dominant-negative action) or worsens (supporting haploinsufficiency).
  evidence:
  - reference: PMID:16685652
    reference_title: "Mutant POLG2 disrupts DNA polymerase gamma subunits and causes progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vivo, the disease most likely arises through haplotype insufficiency or heterodimerization of the mutated and wild-type proteins, which promote mtDNA deletions by stalling the DNA replication fork."
    explanation: >-
      The authors themselves leave the choice between haploinsufficiency and
      heterodimerisation unresolved, which is exactly the open question.
- discussion_id: adpeo_extraocular_selectivity_gap
  prompt: >-
    Is the selective vulnerability of extraocular muscle in adPEO driven by a lower
    biochemical threshold, a faster rate of deletion generation, more permissive clonal
    expansion, or reduced mitochondrial quality control?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Extraocular Muscle Selective Vulnerability
  rationale: >-
    Extraocular muscle carries three times the COX-deficient fibre burden of limb
    muscle in CPEO and crosses into COX deficiency at a lower mutational load, and the
    authors of that study explicitly attribute the pattern to unspecified
    tissue-specific mechanisms in clonal expansion and expression. The candidate
    explanations have not been discriminated. This matters because tissue selectivity,
    not enzymology, is what makes PEO a distinct clinical entity from the other
    phenotypes produced by the same alleles.
  proposed_experiments:
  - experiment_id: adpeo_eom_single_fibre_threshold
    name: Single-fibre deletion load and threshold mapping across muscle allotypes
    description: >-
      Measure single-fibre mtDNA deletion load and the heteroplasmy threshold for COX
      negativity in extraocular, levator palpebrae and limb muscle from the same
      adPEO donor, to separate a lower threshold from a faster accumulation rate.
  - experiment_id: adpeo_eom_mitophagy_flux
    name: Allotype-resolved mitophagy and mitochondrial dynamics measurement
    description: >-
      Compare mitophagy flux and fusion/fission dynamics between human extraocular and
      limb muscle to test the quality-control-capacity explanation for selective
      vulnerability.
  evidence:
  - reference: PMID:20164463
    reference_title: "Mitochondrial DNA defects and selective extraocular muscle involvement in CPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data also suggest that tissue-specific mechanisms are involved in the clonal expansion and expression of secondary mtDNA deletions in CPEO patients with nuclear genetic defects."
    explanation: >-
      The source explicitly attributes the selectivity to unresolved tissue-specific
      mechanisms.
- discussion_id: adpeo_genotype_phenotype_breadth_gap
  prompt: >-
    What determines whether an adPEO genotype produces ocular-restricted disease or a
    broad PEO-plus phenotype with neuropathy, ataxia, parkinsonism and premature
    ovarian insufficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Multisystem PEO-Plus Extension
  rationale: >-
    The gene identity clearly matters - TWNK-related adPEO shows rare CNS involvement
    while POLG-related adPEO carries a heavy neurological burden - but gene identity
    alone does not predict the phenotype within a locus, and the reviewers of the
    largest mixed cohort concluded that phenotype-genotype correlations cannot be
    drawn in mitochondrial PEO. No modifier gene, deletion-burden threshold or
    epigenetic signature has been shown to explain the residual variance. This is the
    single largest obstacle to prognostic counselling at the time of molecular
    diagnosis.
  proposed_experiments:
  - experiment_id: adpeo_multilocus_deep_phenotyping
    name: Cross-locus deep-phenotyping cohort with matched tissue deletion burden
    description: >-
      Assemble a multi-centre adPEO cohort spanning all six loci with standardised
      neurological, cardiac, audiological and endocrine phenotyping plus quantified
      muscle deletion burden, and test whether burden, gene, allele class or age
      explains the breadth of extra-ocular involvement.
  - experiment_id: adpeo_modifier_gwas
    name: Modifier screen in genotype-matched discordant relatives
    description: >-
      Within families segregating a single adPEO allele, compare relatives who are
      ocular-restricted with those who have PEO-plus disease, to search for nuclear or
      mtDNA-haplogroup modifiers of phenotypic breadth.
  evidence:
  - reference: PMID:32161153
    reference_title: "Clinical, pathological and genetic spectrum in 89 cases of mitochondrial progressive external ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotype-genotype correlations cannot be brought in mitochondrial PEO."
    explanation: >-
      Explicit statement from a large mitochondrial PEO series that genotype does not
      predict phenotype, defining the gap.
  - reference: PMID:20479361
    reference_title: "The clinical, histochemical, and molecular spectrum of PEO1 (Twinkle)-linked adPEO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest a shared clinical phenotype with variable mild multiorgan involvement, and that the contribution of PEO1 mutations as a cause of adPEO may well be underestimated."
    explanation: >-
      Documents variable multiorgan involvement within a single locus, showing that
      gene identity alone is insufficient to predict breadth.
- discussion_id: adpeo_model_fidelity_mismatch
  prompt: >-
    Do the available mouse, cell and yeast models of adPEO genes actually reproduce
    the defining human disease features, given that no model organism has the human
    extraocular muscle allotype and that cultured cells cannot reproduce
    decades-long age-dependent clonal expansion?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Clonal Expansion of Deleted mtDNA in Post-Mitotic Cells
  - pathophysiology#Extraocular Muscle Selective Vulnerability
  rationale: >-
    Model evidence for adPEO is substantial and mechanistically informative - Twinkle
    and POLG catalytic mutants stall replication in human cells, and transgenic mice
    establish Twinkle as rate-limiting for mtDNA copy number - but the two features
    that define the human disease are precisely the ones the models cannot supply. The
    ocular phenotype depends on the extraocular muscle allotype, which no standard
    model recapitulates, and the adult onset depends on somatic clonal expansion over
    four decades, which no cell culture or short-lived rodent can span. Evidence
    therefore exists but its translational validity to the defining human features is
    the open question, which is why this is recorded as a human-model mismatch rather
    than a knowledge gap.
  proposed_experiments:
  - experiment_id: adpeo_long_lived_model_aging
    name: Long-duration ageing study in a knock-in adPEO model with ocular phenotyping
    description: >-
      Follow a heterozygous knock-in model carrying a human dominant allele across the
      full lifespan with serial extraocular and limb muscle single-fibre COX/SDH and
      deletion-burden quantification, to test whether age-dependent ocular-predominant
      pathology emerges at all.
  - experiment_id: adpeo_human_eom_organoid
    name: Human extraocular-allotype myotube model of clonal expansion
    description: >-
      Derive extraocular-allotype myotubes from patient iPSCs and apply an accelerated
      mtDNA turnover protocol, to test whether the lower COX threshold of extraocular
      muscle is cell-autonomous and reproducible outside the orbit.
  evidence:
  - reference: PMID:17452351
    reference_title: "Expression of catalytic mutants of the mtDNA helicase Twinkle and polymerase POLG causes distinct replication stalling phenotypes."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Both groups of mutants reduced mitochondrial DNA copy number by severe replication stalling."
    explanation: >-
      Cell-culture evidence establishes the fork-stalling mechanism but is measured
      over days and cannot address decades-long clonal expansion or ocular
      selectivity.
  - reference: PMID:15509589
    reference_title: "Twinkle helicase is essential for mtDNA maintenance and regulates mtDNA copy number."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "we generated two transgenic mouse lines overexpressing wild-type Twinkle"
    explanation: >-
      The available mouse evidence uses wild-type overexpression to establish copy
      number control, which is informative for Twinkle biology but is not a model of
      the heterozygous dominant human allele or of the ocular phenotype.
notes: >
  SUBTYPE-GENE MAPPING - READ BEFORE EDITING. The PEOA1-PEOA6 numbering used here was
  verified directly against MONDO and OMIM with OAK rather than taken from any
  secondary source, because this series is a known named-entity-confusion hazard. The
  authoritative mapping is PEOA1=POLG (OMIM 157640, MONDO:0024528), PEOA2=SLC25A4/ANT1
  (609283, MONDO:0012238), PEOA3=TWNK/C10orf2 (609286, MONDO:0012241), PEOA4=POLG2
  (610131, MONDO:0012415), PEOA5=RRM2B (613077, MONDO:0013117), PEOA6=DNA2 (615156,
  MONDO:0014062, curated by MONDO under the label "mitochondrial DNA deletion syndrome
  with progressive myopathy"). THE TRAP: the historical GENE symbol "PEO1" denotes
  TWNK/C10orf2 - the first adPEO locus mapped - whereas the DISEASE designation PEOA1
  denotes POLG. These are one apart and are frequently conflated; GitHub issue #7469,
  from which this entry was curated, originally listed the series as PEOA1=TWNK,
  PEOA2=POLG, PEOA3=SLC25A4, which is shifted by one and is wrong. Any source that
  equates PEO1 with PEOA1 must not be trusted for this numbering. Re-verify with OAK
  against MONDO/OMIM before changing any subtype-gene assignment in this entry.

  Scope and boundaries. This entry is the umbrella adPEO entity (MONDO:0008003,
  Orphanet:254892), curated as a single disease with six locus-specific subtypes
  (PEOA1-PEOA6) rather than as six separate entries, because the six genotypes share
  a single mechanism (heterozygous nuclear defect leading to multiple mtDNA
  deletions leading to threshold-dependent mosaic COX deficiency), a single cardinal
  phenotype, and a single management pathway, and because they are routinely tested
  as one gene panel. Note an ontology-level ambiguity worth flagging: MONDO:0008003
  carries "PEOA1" as a RELATED synonym even though PEOA1 has its own term
  (MONDO:0024528, defined by POLG). The label of MONDO:0008003 ("autosomal dominant
  progressive external ophthalmoplegia") and its Orphanet:254892 xref support its use
  as the umbrella term here, and each subtype is separately bound to its own
  gene-specific MONDO term.

  OPA1 is deliberately excluded. Tyynismaa and colleagues list OPA1 among the adPEO
  genes, and dominant OPA1 variants can produce PEO with multiple mtDNA deletions
  within a "DOA-plus" phenotype. It is excluded from the subtype list here because
  OPA1 disease is primarily an optic atrophy syndrome with a distinct MONDO identity,
  its mechanism is inner-membrane fusion and cristae organisation rather than
  replisome or nucleotide-supply failure, and dismech already carries a separate
  Autosomal Dominant Optic Atrophy Plus entry. It is modelled here as an explicit
  differential_diagnoses entry bound to MONDO:0014720 rather than being silently
  omitted. TK2 likewise causes multiple mtDNA
  deletions and PEO but is recessive and is out of scope for a dominant entry.

  Frequency bands are genotype-limited. Almost all quantitative frequencies in this
  entry come from two genotyped cohorts, both TWNK-predominant: Bermejo-Guerrero 2021
  (25 TWNK patients) and Fratter 2010 (33 PEO1/Twinkle patients). These are the best
  available adPEO-specific figures, but they systematically UNDERSTATE the
  neurological extension of POLG-related adPEO, where ataxia, neuropathy and
  parkinsonism are considerably more frequent than the 4-8% recorded here. Per-locus
  frequency bands could not be assigned because no comparable genotyped cohort exists
  for POLG-, POLG2-, SLC25A4-, RRM2B- or DNA2-related adPEO. Where no quotable
  frequency was found (hearing loss, depression, premature ovarian insufficiency),
  frequency has been omitted rather than estimated.

  Deep research provenance. This entry was curated with an Edison Scientific (falcon)
  deep-research report as a LEAD source only. The named entity confusion preflight was
  run against MONDO:0008003 and all six subtype terms with OAK before any deep-research
  content was used, and the report's primary disease identity, gene set and OMIM/Orphanet
  anchors matched. Every PMID cited here was independently fetched with
  just fetch-reference and every snippet verified as an exact substring of the cached
  abstract. Two claims surfaced by deep research could NOT be verified against a
  quotable abstract and are recorded as such rather than asserted: the cataract count
  in the TWNK cohort (two related subjects aged 48 and 50, reported in the paper body,
  not the abstract) and the clinical-trial records NCT02161848 and NCT04678115, which
  the report itself notes do not establish genotype-specific efficacy in adPEO and
  which are therefore not curated as clinical_trials entries. NCT05162768 (NuPOWER) IS
  curated, but only as an unreported confirmatory trial: it is recorded together with
  an explicit supports: REFUTE evidence item for the NEGATIVE primary result of the
  parent MMPOWER-3 Phase 3 trial (PMID:39574155), so that the post-hoc
  replisome/CPEO six-minute-walk subgroup signal cannot be misread as demonstrated
  efficacy. Elamipretide is not approved for adPEO or for any mitochondrial myopathy
  indication.

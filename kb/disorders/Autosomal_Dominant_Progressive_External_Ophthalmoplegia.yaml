  evidence:
  - reference: PMID:19664747
    reference_title: "A heterozygous truncating mutation in RRM2B causes autosomal-dominant progressive external ophthalmoplegia with multiple mtDNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is heterogeneous, with five known nuclear disease genes that encode the proteins ANT1, Twinkle, POLG, POLG2, and OPA1."
    explanation: >
      Quotes the five nuclear adPEO genes that were known BEFORE this paper; the same
      report then added RRM2B, and DNA2 followed in 2013 (PMID:23352259). Note that the
      quoted list also includes OPA1, which this entry deliberately scopes out because
      it acts through mitochondrial fusion rather than the replisome or nucleotide pool
      (see differential_diagnoses).

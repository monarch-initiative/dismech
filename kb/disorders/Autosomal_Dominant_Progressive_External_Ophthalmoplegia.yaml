      multiple mtDNA deletions.
- name: PEOA2
  display_name: PEOA2 (SLC25A4/ANT1, adenine nucleotide translocator 1)
  subtype_term:
    preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant 2
    term:
      id: MONDO:0012238
      label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant 2
  description: >-
    adPEO caused by a heterozygous missense variant in SLC25A4, encoding the
    heart/skeletal-muscle isoform of the adenine nucleotide translocator (ANT1), the
    inner-membrane ADP/ATP carrier. ANT1 is not part of the replisome; the dominant
    variants are thought to perturb the mitochondrial nucleotide and energy
    homeostasis on which faithful mtDNA replication depends. PEOA2 was the first
    demonstration that a mitochondrial disease could be produced by a dominant
    mechanism. The phenotype is usually myopathic, and germline mosaicism has been
    documented in at least one pedigree.

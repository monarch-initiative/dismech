name: Ochoa syndrome
category: Mendelian
creation_date: '2026-05-03T12:41:00Z'
synonyms:
- Urofacial syndrome
- Hydronephrosis-inverted smile syndrome
- Inverted smile-neurogenic bladder syndrome
- Partial facial palsy with urinary abnormalities
description: 'Ochoa syndrome, also called urofacial syndrome, is a rare autosomal recessive disorder caused by biallelic pathogenic variants in HPSE2 or LRIG2. It is characterized by childhood-onset urinary bladder voiding dysfunction, abnormal facial movement with expression, and frequent bowel dysfunction. Current evidence supports a peripheral neurodevelopmental mechanism in which HPSE2 or LRIG2 dysfunction disrupts autonomic nerve patterning in the urinary bladder and outflow tract, producing functional bladder outlet obstruction, incomplete emptying, urinary tract infection, vesicoureteral reflux, and risk of progressive renal injury.

  '

progression:
- phase: Prenatal and childhood onset
  age_range: Prenatal to childhood
  notes: Bladder voiding dysfunction can present before birth as megacystis or in infancy and childhood with poor urinary stream, dribbling incontinence, and characteristic inverted facial grimacing on smiling or crying.
  evidence:
  - reference: PMID:23967498
    reference_title: Urofacial Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In infancy and later childhood, UFS can present with a poor urinary stream and dribbling incontinence
    explanation: GeneReviews documents infantile and childhood onset of poor urinary stream and dribbling incontinence in UFS.
- phase: Progressive obstructive uropathy and renal injury
  age_range: Childhood to adulthood
  notes: Incomplete bladder emptying predisposes to recurrent urinary tract infections, vesicoureteral reflux, hydroureteronephrosis, and progressive kidney failure that may require long-term dialysis and kidney transplantation.
  evidence:
  - reference: PMID:23967498
    reference_title: Urofacial Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Management of kidney disease per nephrology; management of severe kidney failure may warrant long-term dialysis and kidney transplantation.
    explanation: GeneReviews documents progression to severe kidney failure requiring dialysis and kidney transplantation.

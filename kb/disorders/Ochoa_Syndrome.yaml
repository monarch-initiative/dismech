diagnosis:
- name: Clinical evaluation of voiding dysfunction and inverted facial expression
  presence: Positive
  description: Suspected in individuals with prenatal or childhood urinary bladder voiding dysfunction accompanied by characteristic inverted facial grimacing when smiling or crying, often with nocturnal lagophthalmos and constipation/encopresis.
  results: Incomplete bladder emptying, abnormal bladder contractility with vesicoureteral reflux, and characteristic facial movement with expression.
  evidence:
  - reference: PMID:23967498
    reference_title: Urofacial Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The clinical diagnosis of UFS can be established in an individual with urinary tract dysfunction and characteristic facial movement with expression, or the molecular diagnosis can be established in an individual with characteristic features and biallelic pathogenic variants in either HPSE2 or LRIG2 identified by molecular genetic testing.
    explanation: GeneReviews defines the clinical diagnostic criteria combining urinary tract dysfunction and characteristic facial movement.

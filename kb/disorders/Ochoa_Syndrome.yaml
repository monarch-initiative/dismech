differential_diagnoses:
- name: Primary vesicoureteral reflux
  disease_term:
    preferred_term: primary vesicoureteral reflux
  description: Congenital retrograde urine flow from the bladder into the ureters and kidneys that overlaps clinically with the reflux and recurrent urinary tract infections of Ochoa syndrome.
  distinguishing_features:
  - Normal facial movement on smiling and crying and absence of nocturnal lagophthalmos
  - Absence of functional bladder outlet obstruction from autonomic bladder neuropathy
  evidence:
  - reference: PMID:30885509
    reference_title: Lrig2 and Hpse2, mutated in urofacial syndrome, pattern nerves in the urinary bladder.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: They had familial primary nonsyndromic VUR, ureter malformations without anatomic bladder outlet obstruction, non-neurogenic neurogenic bladder, or extrarenal malformations.
    explanation: Identifies familial primary nonsyndromic vesicoureteral reflux as a clinical differential evaluated alongside non-neurogenic neurogenic bladder in cohorts screened for UFS gene variants.
- name: Hinman-Allen syndrome (non-neurogenic neurogenic bladder)
  description: Severe functional voiding dysfunction with detrusor-sphincter dyssynergia, urinary retention, vesicoureteral reflux, and constipation/encopresis in the absence of an overt anatomic or spinal cord lesion.
  distinguishing_features:
  - Normal facial expression without inverted grimacing on smiling or crying
  evidence:
  - reference: PMID:30885509
    reference_title: Lrig2 and Hpse2, mutated in urofacial syndrome, pattern nerves in the urinary bladder.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: The UFS bladder is a “non-neurogenic neurogenic bladder” resembling that caused by damaged bladder nerves, yet such gross lesions are absent in persons with UFS.5, 6
    explanation: Directly compares the UFS bladder phenotype to non-neurogenic neurogenic bladder (Hinman-Allen syndrome), distinguished clinically by the syndromic inverted facial expression of UFS.
  - reference: PMID:30885509
    reference_title: Lrig2 and Hpse2, mutated in urofacial syndrome, pattern nerves in the urinary bladder.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: They had familial primary nonsyndromic VUR, ureter malformations without anatomic bladder outlet obstruction, non-neurogenic neurogenic bladder, or extrarenal malformations.
    explanation: Documents isolated non-neurogenic neurogenic bladder as a clinical presentation overlapping UFS.
references:
- reference: ORPHA:2704
  title: Urofacial syndrome
  found_in:
  - Ochoa_Syndrome-deep-research-cyberian-codex.md
  findings:
  - statement: Urofacial syndrome is a rare autosomal recessive syndromic urinary tract malformation caused by germline mutations in HPSE2 or LRIG2 and characterized by severe voiding dysfunction and inversion of facial expression when smiling or crying.
    supporting_text: A rare syndromic urinary tract malformation characterized by the association of severe voiding dysfunction and inversion of facial expression when the child smiles or cries.
- reference: PMID:23967498
  title: Urofacial Syndrome.
  tags:
  - GeneReviews
  found_in:
  - Ochoa_Syndrome-deep-research-cyberian-codex.md
  findings:
  - statement: Urofacial syndrome presents prenatally or in childhood with urinary bladder voiding dysfunction, characteristic abnormal facial movement with expression, and frequent nocturnal lagophthalmos and bowel dysfunction.
    supporting_text: Urofacial syndrome (UFS; also known as Ochoa syndrome) is characterized by prenatal or childhood onset of urinary bladder voiding dysfunction, abnormal facial movement with expression (resulting from abnormal co-contraction of the corners of the mouth and eyes), and often bowel dysfunction (constipation and/or encopresis).
  - statement: Molecular genetic testing identifying biallelic pathogenic variants in HPSE2 or LRIG2 establishes the molecular diagnosis of autosomal recessive urofacial syndrome.
    supporting_text: The clinical diagnosis of UFS can be established in an individual with urinary tract dysfunction and characteristic facial movement with expression, or the molecular diagnosis can be established in an individual with characteristic features and biallelic pathogenic variants in either HPSE2 or LRIG2 identified by molecular genetic testing.

  - preferred_term: calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: INCREASED
  - preferred_term: glutamate receptor signaling
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:29365063
    reference_title: "De novo mutations in GRIN1 cause extensive bilateral polymicrogyria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Three of the mutations increased agonist potency while one reduced proton inhibition of the receptor."
    explanation: >-
      Polymicrogyria-associated GRIN1 variants increased agonist potency, a
      gain-of-function change in receptor activity.
  - reference: PMID:38538865
    reference_title: "De novo GRIN variants in M3 helix associated with neurological disorders control channel gating of NMDA receptor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All 48 variants in M3 for which comprehensive testing was completed produce a gain-of-function (28/48) compared to loss-of-function (9/48); 11 variants had an indeterminant phenotype."
    explanation: >-
      GRIN1/GRIN2 M3-helix variants predominantly enhance channel gating,
      a gain-of-function mechanism.
  downstream:
  - target: Disrupted Excitatory Neurotransmission and E/I Imbalance
    causal_link_type: DIRECT
    description: >-
      Excessive receptor current and calcium influx dysregulate excitatory
      signaling and network excitability.
  - target: Gain-of-Function Cortical Maldevelopment
    causal_link_type: DIRECT
    description: >-
      S2/M3-region gain-of-function variants perturb cortical neurodevelopment,
      producing extensive bilateral polymicrogyria.
- name: Gain-of-Function Cortical Maldevelopment
  description: >-
    A distinct subset of gain-of-function GRIN1 missense variants clustered in
    the S2 and M3 regions perturbs NMDA-receptor-dependent cortical
    neurodevelopment, producing a malformation of cortical development
    (extensive bilateral polymicrogyria); this is the opposite mechanistic
    direction from the classic loss-of-function route to the disorder.
  biological_scale: TISSUE

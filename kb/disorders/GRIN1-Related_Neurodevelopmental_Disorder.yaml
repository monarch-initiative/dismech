    modifier: DYSREGULATED
  - preferred_term: regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: ABNORMAL
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  evidence:
  - reference: PMID:27164704
    reference_title: "Delineating the GRIN1 phenotypic spectrum: A distinct genetic NMDA receptor encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures occurred in about two-thirds of cases."
    explanation: >-
      Epilepsy affects about two-thirds of individuals, reflecting the cortical
      excitation-inhibition imbalance produced by disrupted NMDAR signaling.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Frequent seizures and epileptiform activity further impair
      neurodevelopment at the developmental-and-epileptic-encephalopathy end of
      the spectrum.
- name: Impaired Neurodevelopment
  description: >-
    Dysregulated NMDA-receptor signaling impairs activity-dependent synaptic
    maturation, plasticity, and cortical development, producing the disorder's
    core neurodevelopmental phenotype: profound developmental delay / intellectual
    disability with absent speech, muscular hypotonia, hyperkinetic and
    stereotypic movement disorders, cortical visual impairment, and, in a subset,
    a malformation of cortical development (polymicrogyria).
  biological_scale: ORGANISM

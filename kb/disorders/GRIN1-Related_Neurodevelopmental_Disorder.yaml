name: GRIN1-Related Neurodevelopmental Disorder
creation_date: "2026-07-25T00:00:00Z"
category: Mendelian
synonyms:
- GRIN1-NDD
- GRIN1-related neurodevelopmental disorder
- GRIN1-related developmental and epileptic encephalopathy
- NMDA receptor (GluN1) encephalopathy
- Developmental and epileptic encephalopathy 101
description: >-
  GRIN1-related neurodevelopmental disorder (GRIN1-NDD) is a complex
  neurodevelopmental disorder caused by variants in GRIN1, which encodes GluN1,
  the obligatory subunit of the N-methyl-D-aspartate (NMDA)-type glutamate
  receptor, a glutamate-gated, calcium-permeable cation channel. Because two
  GluN1 subunits are present in every NMDA receptor, GRIN1 variants perturb
  NMDA-receptor signaling throughout the developing brain. Two inheritance modes
  and two functional directions converge on the same disorder: de novo
  heterozygous missense variants clustered in the transmembrane, pore, and
  ligand-binding domains act as a channelopathy, producing either
  gain-of-function (increased agonist potency, reduced voltage-dependent
  magnesium block, increased calcium permeability and current) or
  loss-of-function (reduced current, impaired surface expression, often with a
  dominant-negative effect), while biallelic (homozygous) missense or truncating
  variants cause loss of function. In both directions, disrupted excitatory
  neurotransmission impairs activity-dependent synaptic and cortical development
  and shifts the cortical excitation-inhibition balance, producing profound
  developmental delay / intellectual disability with absent speech, muscular
  hypotonia, hyperkinetic and stereotypic movement disorders, cortical visual
  impairment, and epilepsy; a subset of individuals show extensive bilateral
  polymicrogyria. GRIN1-NDD is the GluN1 counterpart of the GRIN2B and GRIN2A
  NMDA-receptor-subunit disorders.

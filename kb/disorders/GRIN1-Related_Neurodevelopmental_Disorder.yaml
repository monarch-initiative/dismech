    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRIN1-related neurodevelopmental disorder (GRIN1-NDD) is characterized by mild-to-profound developmental delay / intellectual disability (DD/ID) in all affected individuals."
    explanation: >-
      Developmental delay / intellectual disability occurs in all affected
      individuals, the core neurodevelopmental outcome.

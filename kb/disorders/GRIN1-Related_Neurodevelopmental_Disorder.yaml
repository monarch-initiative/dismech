differential_diagnoses:
- name: GRIN2B-related developmental and epileptic encephalopathy
  description: >-
    GRIN2B disorder shares the NMDA-receptor mechanism (GluN2B subunit) and a
    similar developmental-delay/epilepsy/movement-disorder spectrum with the same
    gain-/loss-of-function functional dichotomy.
  distinguishing_features:
  - Both are NMDA-receptor-subunit disorders; the causal gene distinguishes them
    (GRIN1/GluN1 obligatory subunit vs GRIN2B/GluN2B).
  - GRIN1-NDD more characteristically shows cortical visual impairment,
    oculogyric crises, and (in a subset) extensive bilateral polymicrogyria.
  - GRIN1-NDD occurs in both de novo autosomal dominant and biallelic autosomal
    recessive forms, whereas GRIN2B disorder is de novo autosomal dominant.
  disease_term:
    preferred_term: developmental and epileptic encephalopathy, 27
    term:
      id: MONDO:0014505
      label: developmental and epileptic encephalopathy, 27
- name: GRIN2A-related complex neurodevelopmental disorder
  description: >-
    GRIN2A disorder is the other core NMDA-receptor-subunit (GluN2A) disorder but
    typically presents with an epilepsy-aphasia spectrum rather than the profound,
    early, non-epilepsy-dominant phenotype of GRIN1-NDD.
  distinguishing_features:
  - GRIN2A disorder classically causes epilepsy-aphasia spectrum disorders
    (including epileptic encephalopathy with spike-wave activation in sleep).
  - GRIN1-NDD is dominated by profound global developmental delay with absent
    speech and hyperkinetic movements from early life.
- name: STXBP1 encephalopathy
  description: >-
    STXBP1-related developmental and epileptic encephalopathy overlaps through
    early-onset epilepsy, profound developmental delay, and movement disorder.
  distinguishing_features:
  - STXBP1 disorder is caused by heterozygous STXBP1 variants affecting synaptic
    vesicle release rather than NMDA-receptor function.
  - Identification of a GRIN1 variant, and the discriminating cortical visual
    impairment, favor GRIN1-NDD.
  disease_term:
    preferred_term: STXBP1 encephalopathy
    term:
      id: MONDO:0012812
      label: developmental and epileptic encephalopathy, 4
- name: SCN2A-related developmental and epileptic encephalopathy
  description: >-
    SCN2A encephalopathy is a sodium-channelopathy that can mimic GRIN1-NDD with
    early-onset epilepsy, developmental delay, and movement abnormalities.
  distinguishing_features:
  - SCN2A disorder arises from a voltage-gated sodium channel defect, not
    NMDA-receptor dysfunction, and has distinct sodium-channel-blocker treatment
    implications.
  - The GRIN1-NDD constellation of cortical visual impairment and hyperkinetic
    movements helps distinguish it.
  disease_term:
    preferred_term: developmental and epileptic encephalopathy, 11
    term:
      id: MONDO:0013388
      label: developmental and epileptic encephalopathy, 11
progression:
- phase: Neonatal to Early Childhood
  notes: >-
    Profound global developmental delay is usually apparent already in the
    neonatal period; affected individuals typically never acquire the ability to
    walk and have absent or extremely limited verbal communication, with
    hypotonia, movement disorders, cortical visual impairment, and (in most) an
    epilepsy that emerges without a single characteristic onset age or semiology.
  evidence:
  - reference: PMID:27164704
    reference_title: "Delineating the GRIN1 phenotypic spectrum: A distinct genetic NMDA receptor encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These 23 individuals presented with a distinct phenotype of profound developmental delay, severe intellectual disability with absent speech, muscular hypotonia, hyperkinetic movement disorder, oculogyric crises, cortical blindness, generalized cerebral atrophy, and epilepsy."
    explanation: >-
      Describes the characteristic early, severe, and persistent phenotype.
- phase: Severe Neonatal Encephalopathy in Biallelic Null Variants
  notes: >-
    The most severe end of the spectrum, seen with biallelic truncating variants
    that abolish the obligatory GluN1 subunit, presents as intractable neonatal
    epileptic encephalopathy that can be fatal in infancy.
  evidence:
  - reference: PMID:27164704
    reference_title: "Delineating the GRIN1 phenotypic spectrum: A distinct genetic NMDA receptor encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the NMDAR obligatorily contains 2 GluN1 subunits, truncation or lack of both GRIN1 alleles would result in a knock-out and complete deprivation of the NMDAR."
    explanation: >-
      Biallelic null variants abolish the receptor, producing the most severe,
      often fatal, neonatal presentation.

  - reference: PMID:29365063
    reference_title: "De novo mutations in GRIN1 cause extensive bilateral polymicrogyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Shared features in the patients were extensive bilateral polymicrogyria associated with severe developmental delay, postnatal microcephaly, cortical visual impairment and intractable epilepsy."
    explanation: >-
      Gain-of-function GRIN1 variants cause a distinct cortical malformation
      (extensive bilateral polymicrogyria).
  - reference: PMID:29365063
    reference_title: "De novo mutations in GRIN1 cause extensive bilateral polymicrogyria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Three of the mutations increased agonist potency while one reduced proton inhibition of the receptor."
    explanation: >-
      The polymicrogyria-associated variants are gain-of-function with increased
      agonist potency or reduced proton inhibition.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
    description: >-
      The cortical malformation is part of the impaired-neurodevelopment
      phenotype in the gain-of-function subset.
- name: NMDA Receptor Loss-of-Function
  description: >-
    Other GRIN1 variants reduce NMDA receptor function: de novo missense variants
    lower agonist potency and maximal current (frequently with a
    dominant-negative effect on hetero-oligomeric receptors), while biallelic
    truncating variants abolish receptor assembly. Because two GluN1 subunits are
    obligatory, loss of both alleles produces a functional NMDA-receptor
    knockout.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:
  - preferred_term: glutamate receptor signaling
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:27164704
    reference_title: "Delineating the GRIN1 phenotypic spectrum: A distinct genetic NMDA receptor encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our analyses of de novo mutations are consistent with a dominant-negative effect resulting in a significant loss of receptor function."
    explanation: >-
      Functional analysis of de novo GRIN1 variants demonstrated loss of receptor
      function with a dominant-negative effect.
  - reference: PMID:27164704
    reference_title: "Delineating the GRIN1 phenotypic spectrum: A distinct genetic NMDA receptor encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As the NMDAR obligatorily contains 2 GluN1 subunits, truncation or lack of both GRIN1 alleles would result in a knock-out and complete deprivation of the NMDAR."
    explanation: >-
      Biallelic loss of GluN1 abolishes the obligatory subunit and therefore the
      NMDA receptor.
  downstream:
  - target: Disrupted Excitatory Neurotransmission and E/I Imbalance
    causal_link_type: DIRECT
    description: >-
      Reduced NMDA-receptor-mediated current diminishes excitatory drive and
      destabilizes network excitability.
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
    description: >-
      Reduced NMDA-receptor signaling impairs activity-dependent synaptic and
      cortical development.
- name: Disrupted Excitatory Neurotransmission and E/I Imbalance
  description: >-
    Whether from excessive or deficient receptor activity, GRIN1 variants disrupt
    the tightly regulated NMDA-receptor-mediated glutamatergic transmission that
    developing cortical networks depend on, shifting the balance between
    excitation and inhibition and producing neuronal hyperexcitability that
    generates seizures. Seizures occur in roughly two-thirds of individuals with
    de novo variants.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of glutamatergic synaptic transmission
    term:

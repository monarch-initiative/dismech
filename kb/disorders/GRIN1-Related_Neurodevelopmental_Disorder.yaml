    evidence_source: HUMAN_CLINICAL
    snippet: "These 23 individuals presented with a distinct phenotype of profound developmental delay, severe intellectual disability with absent speech, muscular hypotonia, hyperkinetic movement disorder, oculogyric crises, cortical blindness, generalized cerebral atrophy, and epilepsy."
    explanation: >-
      The characteristic constellation of severe neurodevelopmental features

genetic:
- name: GRIN1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GRIN1
    term:
      id: hgnc:4584
      label: GRIN1
  notes: >-
    GRIN1 encodes GluN1, the obligatory subunit of the NMDA receptor. De novo
    heterozygous missense variants cluster in the transmembrane, pore, and
    ligand-binding domains and confer gain- or loss-of-function; biallelic
    (homozygous) missense or truncating variants cause loss of function.
    Heterozygous GRIN1 truncation/haploinsufficiency, in contrast, is tolerated
    and does not by itself cause the disorder.
  evidence:
  - reference: PMID:27164704
    reference_title: "Delineating the GRIN1 phenotypic spectrum: A distinct genetic NMDA receptor encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations cluster within transmembrane segments and result in loss of channel function of varying severity with a dominant-negative effect."
    explanation: >-
      De novo GRIN1 variants cluster in transmembrane segments and alter channel
      function.
  - reference: PMID:31219694
    reference_title: "GRIN1-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of GRIN1-NDD is established in a proband who has either a heterozygous de novo GRIN1 pathogenic missense variant (64 individuals reported) or biallelic GRIN1 pathogenic missense or truncating variants (8 individuals from 4 families reported)."
    explanation: >-
      Establishes the two genetic mechanisms (heterozygous de novo and biallelic).

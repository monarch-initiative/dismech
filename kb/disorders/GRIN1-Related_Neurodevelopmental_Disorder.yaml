    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      This entry is deliberately anchored on the gene-level MONDO umbrella
      MONDO:1060123 (GRIN1-related complex neurodevelopmental disorder), whose
      MONDO definition names GRIN1 (HGNC:4584) as the causal gene, rather than on
      a single clinical subtype. The umbrella subsumes the phenotypic and
      inheritance breadth of the disorder (de novo autosomal dominant and
      biallelic autosomal recessive; gain- and loss-of-function), matching the
      unified mechanism-based scope of this dismech entry.

inheritance:
- name: Autosomal dominant
  description: >-
    Most affected individuals have a heterozygous de novo GRIN1 pathogenic
    missense variant; inheritance is autosomal dominant and probands are
    typically simplex cases.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31219694
    reference_title: "GRIN1-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All probands with a heterozygous GRIN1 pathogenic variant reported to date whose parents have undergone molecular genetic testing have the disorder as a result of a de novo GRIN1 pathogenic missense variant."
    explanation: >-
      GeneReviews documents the de novo, autosomal dominant origin of the
      heterozygous form.
  - reference: PMID:27164704
    reference_title: "Delineating the GRIN1 phenotypic spectrum: A distinct genetic NMDA receptor encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified heterozygous de novo GRIN1 mutations in 14 individuals and reviewed the phenotypes of all 9 previously reported patients."
    explanation: >-
      The founding cohort established heterozygous de novo GRIN1 variants as the
      predominant cause.
- name: Autosomal recessive
  description: >-
    A minority of individuals have biallelic (homozygous) GRIN1 pathogenic
    missense or truncating variants, inherited in an autosomal recessive manner
    from unaffected heterozygous carrier parents; because two GluN1 subunits are
    obligatory, biallelic null variants abolish the receptor.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31219694
    reference_title: "GRIN1-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an individual with biallelic GRIN1 pathogenic variants has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews genetic-counseling recurrence-risk statement for the autosomal
      recessive (biallelic) form.
  - reference: PMID:28051072
    reference_title: "Novel homozygous missense variant of GRIN1 in two sibs with intellectual disability and autistic features without epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "support the existence of hypomorphic variants causing severe neurodevelopmental impairment with autosomal recessive inheritance."
    explanation: >-
      A consanguineous family with a homozygous hypomorphic GRIN1 variant
      demonstrates autosomal recessive inheritance.
pathophysiology:
- name: GRIN1 Variant and Altered GluN1/NMDA Receptor Function
  description: >-
    De novo heterozygous missense variants (clustered in the transmembrane,
    pore, and ligand-binding domains) or biallelic missense/truncating variants
    in GRIN1 alter GluN1, the obligatory subunit of the NMDA receptor. Because
    every NMDA receptor contains two GluN1 subunits, these variants perturb the
    glutamate-gated, calcium-permeable channel that mediates excitatory
    neurotransmission across the developing brain.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  molecular_functions:
  - preferred_term: NMDA glutamate receptor activity
    term:
      id: GO:0004972
      label: NMDA glutamate receptor activity
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: glutamate receptor signaling
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29365063
    reference_title: "De novo mutations in GRIN1 cause extensive bilateral polymicrogyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRIN1 encodes GluN1, the essential subunit of the N-methyl-d-aspartate receptor."
    explanation: >-
      GRIN1 encodes the essential (obligatory) GluN1 subunit of the NMDA
      receptor, so variants perturb the receptor directly.
  - reference: PMID:27164704
    reference_title: "Delineating the GRIN1 phenotypic spectrum: A distinct genetic NMDA receptor encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations cluster within transmembrane segments and result in loss of channel function of varying severity with a dominant-negative effect."
    explanation: >-
      De novo GRIN1 missense variants cluster in transmembrane segments and alter
      channel function.
  downstream:
  - target: NMDA Receptor Gain-of-Function
    causal_link_type: DIRECT
    description: >-
      A subset of missense variants (especially in the M3 helix and pore)
      increases receptor activity.
  - target: NMDA Receptor Loss-of-Function
    causal_link_type: DIRECT
    description: >-
      Other missense variants, and biallelic missense/truncating variants, reduce
      receptor function.
- name: NMDA Receptor Gain-of-Function
  description: >-
    A subset of GRIN1 missense variants increases NMDA receptor activity by
    enhancing agonist potency, increasing channel open probability and calcium
    permeability, or reducing voltage-dependent magnesium and proton inhibition,
    producing excessive NMDA-receptor-mediated current and calcium influx.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  molecular_functions:

differential_diagnoses:
- name: Denys-Drash syndrome
  description: Denys-Drash syndrome is a WT1-related disorder that overlaps with Meacham syndrome through disorders of sex development, but is distinguished by early-onset steroid-resistant nephrotic syndrome and Wilms tumor risk.
  distinguishing_features:
  - Infantile steroid-resistant nephrotic syndrome and diffuse mesangial sclerosis favor Denys-Drash syndrome over Meacham syndrome.
  - Congenital diaphragmatic and complex cardiac malformations without prominent nephropathy favor Meacham syndrome.
  disease_term:
    preferred_term: Denys-Drash syndrome
    term:
      id: MONDO:0008682
      label: Denys-Drash syndrome
  evidence:
  - reference: PMID:38326647
    reference_title: 'WT1-related disorders: more than Denys-Drash syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: DDS is classically defined by the triad of steroid-resistant nephrotic syndrome (SRNS) onset in the first year of life, disorders of sex development (DSD), and a predisposition to Wilms tumor (WT).
    explanation: This supports Denys-Drash syndrome as a key WT1-spectrum differential diagnosis distinguished by nephropathy and Wilms tumor predisposition.
- name: Frasier syndrome
  description: Frasier syndrome is another WT1-related disorder that overlaps with Meacham syndrome through 46,XY gonadal dysgenesis and phenotypic female presentation, but more often presents with progressive nephropathy and gonadoblastoma risk rather than congenital diaphragmatic and cardiac malformations.
  distinguishing_features:
  - Progressive nephropathy with gonadoblastoma surveillance concerns favors Frasier syndrome.
  - Congenital diaphragmatic hernia and complex congenital heart disease favor Meacham syndrome.
  disease_term:
    preferred_term: Frasier syndrome
    term:
      id: MONDO:0007635
      label: Frasier syndrome
  evidence:
  - reference: PMID:40426774
    reference_title: 'WT1-Related Nephropathy in a Phenotypically Female Child: A Case of Clinical and Genetic Discordance.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The identified genotype points toward a diagnosis of DDS. However, the clinical presentation is more consistent with features typically seen in FS.
    explanation: This case report highlights the clinically relevant diagnostic overlap between WT1-related syndromes and supports Frasier syndrome as a differential diagnosis when sex-development abnormalities occur with WT1 variants.
- name: WAGR syndrome
  description: WAGR syndrome is another WT1-region disorder with Wilms tumor and genitourinary involvement; aniridia, contiguous 11p deletion context, and the absence of the Meacham diaphragmatic-cardiopulmonary pattern help distinguish it.
  distinguishing_features:
  - Aniridia and 11p contiguous gene deletion context favor WAGR syndrome.
  - True double vagina, pulmonary hypoplasia, diaphragmatic defects, and complex congenital heart disease favor Meacham syndrome.
  disease_term:
    preferred_term: WAGR syndrome
    term:
      id: MONDO:0008681
      label: WAGR syndrome
  evidence:
  - reference: PMID:38326647
    reference_title: 'WT1-related disorders: more than Denys-Drash syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Historically, specific mutations in WT1 gene have been associated with distinct syndromes based on phenotypic characteristics, including Denys-Drash syndrome (DDS), Frasier syndrome (FS), Meacham syndrome, and WAGR syndrome.
    explanation: This WT1-spectrum review supports WAGR as a clinically relevant differential diagnosis.
- name: Complete androgen insensitivity syndrome
  description: Complete androgen insensitivity syndrome and other non-WT1 46,XY disorders of sex development can present with normal female external genitalia in a 46,XY infant, but lack the true double vagina, retained Müllerian structures, congenital diaphragmatic hernia, and complex congenital heart defects of Meacham syndrome.
  distinguishing_features:
  - True double or septate vagina, retained Müllerian structures, congenital diaphragmatic defects, complex congenital heart malformations, and heterozygous WT1 zinc-finger variants distinguish Meacham syndrome from isolated 46,XY androgen insensitivity.
  disease_term:
    preferred_term: complete androgen insensitivity syndrome
    term:
      id: MONDO:0021023
      label: complete androgen insensitivity syndrome
  evidence:
  - reference: PMID:11822701
    reference_title: Double vagina with sex reversal, congenital diaphragmatic hernia, pulmonary and cardiac malformations--another case of Meacham syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A true double vagina, absent uterus and abnormal male gonads were found in the presence of normal external female genitalia.
    explanation: Documents the combination of 46,XY female external genitalia with true double vagina and abnormal male gonads that distinguishes Meacham syndrome from other causes of 46,XY female external genitalia.
  - reference: PMID:17853480
    reference_title: WT1 mutations in Meacham syndrome suggest a coelomic mesothelial origin of the cardiac and diaphragmatic malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Meacham syndrome is a rare sporadically occurring multiple malformation syndrome characterized by male pseudohermaphroditism with abnormal internal female genitalia comprising a uterus and double or septate vagina, complex congenital heart defect and diaphragmatic abnormalities.
    explanation: Defines the full genital, diaphragmatic, and cardiac malformation tetrad that separates Meacham syndrome from isolated 46,XY DSD conditions.
- name: Fryns syndrome
  description: Fryns syndrome and other non-WT1 congenital diaphragmatic hernia syndromes share congenital diaphragmatic defects, pulmonary hypoplasia, and congenital heart malformations with Meacham syndrome, but are distinguished by the characteristic 46,XY gonadal dysgenesis, true double vagina, and WT1 zinc-finger missense variants of Meacham syndrome.
  distinguishing_features:
  - 46,XY sex reversal or male pseudohermaphroditism with a true double or septate vagina and heterozygous WT1 C-terminal zinc finger missense variants distinguish Meacham syndrome from non-WT1 syndromic congenital diaphragmatic hernia.
  disease_term:
    preferred_term: Fryns syndrome
    term:
      id: MONDO:0009253
      label: Fryns syndrome
  evidence:
  - reference: PMID:1844355
    reference_title: Double vagina, cardiac, pulmonary, and other genital malformations with 46,XY karyotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both infants had complex cyanotic congenital heart defects, hypoplastic right lungs, anomalous pulmonary venous return, and abnormalities of the diaphragm.
    explanation: Documents the combined diaphragmatic, pulmonary hypoplasia, and complex cardiac phenotype that overlaps with syndromic congenital diaphragmatic hernia presentations.
  - reference: PMID:17853480
    reference_title: WT1 mutations in Meacham syndrome suggest a coelomic mesothelial origin of the cardiac and diaphragmatic malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We report on eight new cases of this condition, two of whom were shown to have heterozygous missense mutations in the C-terminal zinc finger domains of WT1: Arg366Cys and Arg394Trp.'
    explanation: Identifies heterozygous WT1 zinc-finger missense variants as the molecular basis distinguishing Meacham syndrome from non-WT1 diaphragmatic hernia syndromes.

genetic:
- name: WT1
  gene_term:
    preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  association: Causal heterozygous missense mutation
  notes: Meacham syndrome is caused by heterozygous WT1 missense variants, especially in the C-terminal zinc finger DNA-binding domains. WT1-associated Meacham syndrome is now considered part of the broader WT1-related disorder continuum.
  evidence:
  - reference: PMID:17853480
    reference_title: WT1 mutations in Meacham syndrome suggest a coelomic mesothelial origin of the cardiac and diaphragmatic malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We report on eight new cases of this condition, two of whom were shown to have heterozygous missense mutations in the C-terminal zinc finger domains of WT1: Arg366Cys and Arg394Trp.'
    explanation: This is direct human genetic evidence that heterozygous WT1 missense variants cause Meacham syndrome in at least a subset of cases.
  - reference: PMID:38326647
    reference_title: 'WT1-related disorders: more than Denys-Drash syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Historically, specific mutations in WT1 gene have been associated with distinct syndromes based on phenotypic characteristics, including Denys-Drash syndrome (DDS), Frasier syndrome (FS), Meacham syndrome, and WAGR syndrome.
    explanation: This review supports placing Meacham syndrome within the broader WT1-related disorder spectrum.
diagnosis:
- name: Karyotype and DSD evaluation
  description: Cytogenetic testing and disorder-of-sex-development evaluation establish the 46,XY chromosomal sex in phenotypically female or undervirilized infants with duplicated vagina, retained Müllerian structures, or abnormal gonads.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  results: A 46,XY karyotype with undervirilization and Müllerian structures supports the Meacham diagnostic pattern.
  evidence:
  - reference: PMID:11822701
    reference_title: Double vagina with sex reversal, congenital diaphragmatic hernia, pulmonary and cardiac malformations--another case of Meacham syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Conventional G band karyotyping of skin samples revealed a normal male karyotype.
    explanation: This case report documents karyotyping as part of confirming the 46,XY sex-reversal presentation.
- name: WT1 molecular genetic testing
  description: WT1 sequencing or broader molecular testing is used to confirm the WT1 disorder spectrum diagnosis in a proband with Meacham-compatible DSD, diaphragmatic, cardiopulmonary, and gonadal findings.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Identification of a heterozygous pathogenic WT1 variant supports WT1-related Meacham syndrome.
  evidence:
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of WT1 disorder is established in a proband with suggestive clinical findings and a heterozygous pathogenic variant in WT1 identified by molecular genetic testing.
    explanation: GeneReviews defines molecular confirmation for the WT1 disorder continuum that includes Meacham syndrome.
- name: Renal and Wilms tumor risk assessment
  description: WT1-confirmed survivors should receive renal assessment, including proteinuria monitoring and renal or abdominal imaging for Wilms tumor surveillance, because nephropathy and tumor risk belong to the broader WT1 disorder spectrum even when they are not defining Meacham features.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Proteinuria, renal anomalies, or renal masses redirect management toward WT1-disorder renal and tumor surveillance.
  evidence:
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Surveillance: Monitor for first appearance of the following: proteinuria every six months until age ten years, yearly thereafter; Wilms tumor every three months until age seven years; early gonadal insufficiency yearly after puberty.'
    explanation: GeneReviews supports renal, Wilms tumor, and gonadal-insufficiency surveillance for individuals with WT1 disorder.
- name: Gonadal imaging and pathology review
  description: Gonadal imaging, surgical evaluation, and pathology review document dysgenetic gonadal tissue, guide gonadoblastoma-risk management, and distinguish Meacham syndrome from other 46,XY DSD diagnoses.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Abnormal male gonads or dysgenetic gonadal tissue support the WT1-related DSD diagnosis.
  evidence:
  - reference: PMID:11822701
    reference_title: Double vagina with sex reversal, congenital diaphragmatic hernia, pulmonary and cardiac malformations--another case of Meacham syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A true double vagina, absent uterus and abnormal male gonads were found in the presence of normal external female genitalia.
    explanation: The case report documents abnormal gonads and internal genital anatomy as key diagnostic findings.
- name: Cardiac, pulmonary, and diaphragm imaging
  description: Fetal or neonatal cardiopulmonary evaluation should include echocardiography for complex congenital heart disease and imaging of the lungs and diaphragm for hypoplastic lungs, pulmonary venous anomalies, and diaphragmatic defects.
  diagnosis_term:
    preferred_term: diagnostic imaging
  results: Complex heart disease with pulmonary and diaphragmatic malformations supports the Meacham syndrome pattern.
  evidence:
  - reference: PMID:1844355
    reference_title: Double vagina, cardiac, pulmonary, and other genital malformations with 46,XY karyotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The unusual occurrence of a true double vagina should lead to careful pulmonary and cardiac evaluation.
    explanation: The original report specifically recommends pulmonary and cardiac evaluation when the distinctive genital anomaly is seen.
- name: Differential diagnosis integration
  description: Diagnosis should distinguish Meacham syndrome from Denys-Drash syndrome, Frasier syndrome, WAGR and related WT1 presentations, isolated congenital diaphragmatic hernia, and other 46,XY DSD disorders by integrating WT1 molecular testing, karyotype, renal/tumor findings, and the combination of genital, diaphragm, pulmonary, and cardiac malformations.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: The full malformation pattern supports Meacham syndrome; prominent nephropathy or tumor predisposition may favor other WT1-spectrum diagnoses.
  evidence:
  - reference: PMID:38326647
    reference_title: 'WT1-related disorders: more than Denys-Drash syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Historically, specific mutations in WT1 gene have been associated with distinct syndromes based on phenotypic characteristics, including Denys-Drash syndrome (DDS), Frasier syndrome (FS), Meacham syndrome, and WAGR syndrome.
    explanation: This review supports a WT1-spectrum differential diagnosis that includes Meacham syndrome, DDS, FS, and WAGR.

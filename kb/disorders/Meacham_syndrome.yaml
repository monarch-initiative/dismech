    explanation: GeneReviews supports monitoring and management of gonadal insufficiency and puberty/fertility effects in WT1 disorder.
- name: Cardiac management and follow-up
  description: Affected infants with structural heart disease require cardiology-led assessment, supportive management, and congenital cardiac intervention when anatomically appropriate.

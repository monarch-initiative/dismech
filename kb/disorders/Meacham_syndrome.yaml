    explanation: This supports multidisciplinary specialty care as a treatment-relevant management approach for WT1-related sex development disorders including Meacham syndrome.
- name: Wilms tumor surveillance in WT1-confirmed survivors
  description: WT1-confirmed Meacham survivors should receive WT1-disorder tumor surveillance, including Wilms tumor screening every three months until age seven years, while recognizing that Wilms tumor is not a defining feature of the classic early-lethal Meacham presentation.
  treatment_term:
    preferred_term: supportive care

  evidence:
  - reference: PMID:17853480
    reference_title: WT1 mutations in Meacham syndrome suggest a coelomic mesothelial origin of the cardiac and diaphragmatic malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We report on eight new cases of this condition, two of whom were shown to have heterozygous missense mutations in the C-terminal zinc finger domains of WT1: Arg366Cys and Arg394Trp.'
    explanation: This Meacham syndrome case series directly links the disorder to heterozygous WT1 zinc finger missense variants.
  - reference: PMID:21959952
    reference_title: 'WT1 in disease: shifting the epithelial-mesenchymal balance.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: WT1 is a versatile gene that controls transitions between the mesenchymal and epithelial state of cells in a tissue-context dependent manner.
    explanation: This WT1 disease review supports the mechanistic inference that WT1 variants in Meacham syndrome disrupt developmental epithelial-mesenchymal state control.
  downstream:
  - target: Coelomic Mesothelial Patterning Defect
    causal_link_type: DIRECT
    description: WT1 dysfunction perturbs diaphragm and proepicardial tissue development
    evidence:
    - reference: PMID:17853480
      reference_title: WT1 mutations in Meacham syndrome suggest a coelomic mesothelial origin of the cardiac and diaphragmatic malformations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Identification of WT1 expression in the region of coelomic mesothelium which will form the proepicardium and diaphragm provides a plausible unifying patterning defect in these cases.
      explanation: This directly supports the causal link from WT1 dysfunction to a shared coelomic mesothelial developmental defect.
  - target: Gonadal and Müllerian Differentiation Defect
    causal_link_type: DIRECT
    description: WT1-related gonadal developmental disruption can impair fetal testicular differentiation and the testosterone/Müllerian-inhibitory-factor program needed for virilization and Müllerian regression.
    evidence:
    - reference: PMID:1844355
      reference_title: Double vagina, cardiac, pulmonary, and other genital malformations with 46,XY karyotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The retention of Müllerian structures and undervirilization of male genitalia in these cases could be the result of failure in production of adequate amounts of testosterone and Müllerian inhibitory factor at appropriate times in gestation.
      explanation: The original Meacham case report provides a phenotype-linked mechanism for retained Müllerian structures and undervirilization.
  - target: Abnormality of the kidney
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: WT1 pathogenic variants can also perturb renal and urinary tract development across the broader WT1 disorder continuum.
    evidence:
    - reference: PMID:32352694
      reference_title: WT1 Disorder.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Less common findings are congenital anomalies of the kidney and urinary tract (CAKUT), gonadoblastoma, and 46,XX gonadal dysgenesis.
      explanation: GeneReviews supports congenital anomalies of the kidney and urinary tract as part of the WT1 disorder spectrum.

    explanation: GeneReviews directly supports autosomal dominant inheritance for the WT1 disorder spectrum that includes Meacham syndrome.
pathophysiology:
- name: WT1 Zinc Finger Dysfunction
  review_notes: >-
    Logical rule waived: met-without-mesenchymal-substrate. The GO:0060231 annotation
    records what WT1 controls, not what the mesothelial cell does. This node's claim is
    transcriptional: the zinc-finger variants disrupt WT1-dependent control of embryonic
    mesenchymal-to-epithelial state transitions, which is how PMID:21959952 states it ("WT1
    is a versatile gene that controls transitions between the mesenchymal and epithelial
    state of cells in a tissue-context dependent manner"). CL:0000077 mesothelial cell is
    the lineage WT1 acts in and the product of the transition, which is why the rule sees an
    epithelial cell where it expects the mesenchyme that undergoes MET. The regulation term
    that would carry this exactly does not exist: searching GO for "regulation of
    mesenchymal to epithelial transition" returns only GO:0003339, GO:0003340 and
    GO:0072108, all scoped to metanephros morphogenesis, and the coelomic mesothelium this
    node describes is not metanephric, so binding one would assert the wrong anatomy.
    Dropping GO:0060231 instead would lose a sourced claim, since disrupted
    mesenchymal-epithelial state control is the mechanism the cited review attributes to
    WT1. A curator who obtains a general regulation-of-MET term from GO should bind it here
    and remove this waiver.
  description: Meacham syndrome is caused by heterozygous missense variants in the C-terminal zinc finger DNA-binding domains of WT1. These variants disrupt WT1-dependent transcriptional control of embryonic mesenchymal-epithelial state transitions and developmental patterning across the diaphragm, heart, and gonads.

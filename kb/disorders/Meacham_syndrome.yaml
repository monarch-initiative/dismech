    evidence_source: OTHER
    snippet: 'Surveillance: Monitor for first appearance of the following: proteinuria every six months until age ten years, yearly thereafter; Wilms tumor every three months until age seven years; early gonadal insufficiency yearly after puberty.'
    explanation: GeneReviews gives the WT1 disorder surveillance interval for Wilms tumor, supporting this survivor-specific management recommendation.
- name: Renal proteinuria monitoring
  description: WT1-confirmed survivors should be monitored for renal disease with proteinuria surveillance every six months until age ten years and yearly thereafter, because nephropathy belongs to the WT1 disorder spectrum even when it is not a core Meacham-defining feature.

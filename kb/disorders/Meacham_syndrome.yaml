    explanation: The severity of the reported congenital heart defects supports explicit cardiology management in affected infants.
- name: Genetic counseling
  description: Genetic counseling should cover autosomal dominant WT1 disorder inheritance, the frequent de novo origin of pathogenic variants, recurrence risk when a parent carries the familial variant, parental gonadal mosaicism, and prenatal or preimplantation testing once the familial WT1 variant is known.

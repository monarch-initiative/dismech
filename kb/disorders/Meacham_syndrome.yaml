    explanation: GeneReviews directly supports proteinuria surveillance for individuals with WT1 disorder.
- name: Endocrine puberty and gonadal insufficiency care
  description: Endocrinology follow-up should address early gonadal insufficiency after puberty and hormone replacement when clinically indicated after gonadectomy or severe gonadal dysgenesis.

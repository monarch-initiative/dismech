    explanation: >-
      Gives the agents actually used and their approximate response rates, which is
      what the therapeutic_agent bindings above record. Note these are proportions
      treated with each agent rather than a controlled efficacy comparison.

- name: Pyridoxal Phosphate
  description: >-
    Intravenous pyridoxal phosphate produced an initial seizure response in reported
    cases, and seizures recurred when treatment was switched to oral vitamin B6. That
    pairing is the clinically actionable part: it suggests responsiveness specific to
    the active cofactor rather than to pyridoxine, and it is worth a trial early in a
    neonatal-onset encephalopathy where the alternative is prolonged multi-agent
    empiricism. The evidence is a small number of reported cases, not a trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

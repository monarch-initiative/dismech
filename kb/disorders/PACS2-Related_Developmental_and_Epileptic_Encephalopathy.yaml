diagnosis:
- name: Molecular Genetic Testing for a PACS2 Variant
  description: >-
    Diagnosis rests on identifying the heterozygous PACS2 variant, in nearly all cases
    the recurrent c.625G>A p.(Glu209Lys). Exome or genome sequencing, or a
    developmental and epileptic encephalopathy gene panel including PACS2, is the
    route. Because the allele is absent from population databases and classified
    pathogenic in ClinVar, a single heterozygous finding is diagnostic in the right
    clinical context rather than requiring functional confirmation.

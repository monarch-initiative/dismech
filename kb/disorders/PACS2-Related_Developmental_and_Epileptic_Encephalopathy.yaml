discussions:
- discussion_id: mismatch_heterologous_cell_line_versus_neural_disease
  prompt: >-
    The entire molecular mechanism of DEE66 - altered proteostasis, 14-3-3-epsilon
    binding, apoptotic susceptibility - was measured in colorectal carcinoma and 293T
    cells. Does any of it hold in a neuron, a cerebellum, or a developing brain?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Susceptibility to Stress-Induced Apoptosis
  - pathophysiology#Altered PACS2 Proteostasis
  - pathophysiology#Cerebellar Dysgenesis
  rationale: >-
    This is the sharpest limitation in the entry, and it is structural rather than
    incidental. Every mechanistic measurement supporting the apoptosis arm comes from
    transfected transformed cell lines, and the apoptosis readout additionally
    requires an applied stressor rather than reporting spontaneous death. The disease
    phenotype, meanwhile, is a cerebellar malformation and a neonatal cortical
    epilepsy - neither of which is a cell-autonomous stress-death phenotype, and
    neither of which has been reproduced in any published in vivo model. A mouse
    carrying the variant has been reported to exist but no peer-reviewed phenotypic
    characterisation is available, and patient-derived iPSC neurons are in progress
    without published data. So the causal edge from apoptotic susceptibility to
    cerebellar dysgenesis is typed as having unknown intermediates for a reason: it is
    the field's working hypothesis, not a demonstrated route. The alternative
    possibility, that the developmental malformation arises from disturbed cargo
    trafficking during cerebellar morphogenesis with apoptosis playing little part, is
    equally consistent with everything currently published, and the same systematic
    review names candidate intermediates for it - neuronal migration, neurogenesis,
    cerebellum development and dendritic arborization - none of which requires cell
    death.
  evidence:
  - reference: PMID:36188273
    reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that PACS-2 E209K increased susceptibility to staurosporine-induced apoptosis in HCT 116 cells"
    explanation: >-
      Names both the effect and the cell line, which is precisely the mismatch: HCT116
      is a colorectal carcinoma line, not neural tissue.
  - reference: PMID:36188273
    reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Overall, our findings suggest PACS-2 E209K alters PACS-2 proteostasis and favors complex formation with 14-3-3ε, leading to increased cell death in the presence of environmental stressors."
    explanation: >-
      The authors' own conclusion is conditional on environmental stressors, which is
      a weaker claim than the constitutive developmental death the cerebellar
      phenotype would require.
  - reference: PMID:38540691
    reference_title: "Characteristics of Developmental and Epileptic Encephalopathy Associated with PACS2 p.Glu209Lys Pathogenic Variant-Our Experience and Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glu209Lys mutation alters the regulatory domain, reflected by difficulties in PACS2 binding cargo proteins, which negatively impacts neuronal migration, neurogenesis, interneural communication, cerebellum development, and dendritic arborization"
    explanation: >-
      Names the trafficking-centred alternative route to cerebellar dysgenesis, which
      is the competing account this mismatch cannot currently exclude.
  proposed_experiments:
  - experiment_id: exp_isogenic_ipsc_cerebellar_organoid_e209k
    name: Isogenic E209K cerebellar organoids with apoptosis and trafficking readouts
    description: >-
      Differentiate patient-derived and CRISPR-corrected isogenic iPSC lines into
      cerebellar organoids and measure, side by side, baseline and stressed apoptosis
      in Purkinje and granule lineages, foliation and vermis morphology, and cargo
      trafficking through the PACS2 furin-binding region. If dysgenesis appears
      without a baseline apoptosis difference, the trafficking route is implicated and
      the apoptosis arm is an artefact of the heterologous system.

- discussion_id: gap_why_the_epilepsy_improves_with_age
  prompt: >-
    Seizures in DEE66 are difficult to control in the first year and then frequently
    improve or remit in early childhood. What changes? And does the underlying
    mechanism remit with them, or does it persist and re-emerge?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neonatal-Onset Epilepsy with Age-Dependent Improvement
  - pathophysiology#Cortical Network Hyperexcitability
  rationale: >-
    Age-dependent improvement sets DEE66 apart from most developmental and epileptic
    encephalopathies, where drug resistance persists, and it is a clinically
    consequential difference: it changes what families are told and how aggressively
    early polytherapy is pursued. Yet nothing explains it. The cerebellar dysgenesis
    is a fixed malformation and cannot remit, so whatever improves is not the
    structural lesion. No electrophysiological work in any PACS2 system has
    characterised cortical excitability at any age, so there is no measurement of the
    thing that is supposed to be changing. The question is sharpened by the small
    adult literature, which describes progressive decline rather than continued
    improvement - only four adults have been reported, so this is a signal rather than
    an established biphasic course, but if real it would mean the early remission
    masks an ongoing process rather than reflecting a resolved one.
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mixed focal and generalized epilepsy occurred in the neonatal period, controlled with difficulty in the first year, but many improved in early childhood."
    explanation: >-
      The observation itself - difficult control followed by improvement - which is
      what has no mechanistic account.
  - reference: PMID:38540691
    reference_title: "Characteristics of Developmental and Epileptic Encephalopathy Associated with PACS2 p.Glu209Lys Pathogenic Variant-Our Experience and Systematic Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 4 cases have been reported in adults to date."
    explanation: >-
      Quantifies how thin the adult evidence is, which is why the possible later
      progressive phase is raised as a question rather than curated as a disease
      stage.
  proposed_experiments:
  - experiment_id: exp_longitudinal_excitability_across_development
    name: Developmental time course of cortical excitability in an E209K model
    description: >-
      In a validated in vivo or organoid E209K model, record cortical network
      excitability at neonatal, juvenile and adult equivalent stages, and ask whether
      excitability normalises on the same schedule as the clinical seizures. A model
      whose excitability normalises would locate the remission in the cortex; one
      whose excitability persists unchanged while seizures stop would point instead to
      a compensatory change elsewhere and would support the concern that the
      improvement is symptomatic rather than mechanistic.

- discussion_id: gap_mam_role_asserted_but_not_measured_for_e209k
  prompt: >-
    PACS2's role at mitochondria-associated ER membranes is routinely invoked to
    explain DEE66. Has any study actually measured a MAM defect for the E209K variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired PACS2 Autoregulatory Domain Function
  - pathophysiology#Increased Susceptibility to Stress-Induced Apoptosis
  rationale: >-
    PACS2 is well established in the general cell-biology literature as a regulator of
    ER-mitochondria contact sites, and reviews of this disorder frequently carry that
    role forward as the mechanism. The gap is that the step from "PACS2 does this" to
    "the E209K variant breaks this" was not evidenced in any source verified for this
    entry. This entry therefore curates only what was measured - autoregulatory-domain
    impairment, slowed turnover, increased 14-3-3-epsilon association, increased
    stress-induced apoptosis - and deliberately does not carry a MAM node, because
    doing so would import a plausible mechanism as though it were a finding. That
    matters beyond bookkeeping: a MAM-centred model predicts calcium-handling and
    mitochondrial-energetics phenotypes and suggests quite different therapeutic
    targets from a trafficking-centred or proteostasis-centred model, and the three
    are currently not distinguished by evidence.
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Functional studies demonstrated that the PACS2 recurrent variant reduces the ability of the predicted autoregulatory domain to modulate the interaction between the PACS2 FBR and client proteins, which may disturb cellular function."
    explanation: >-
      The most specific published functional consequence of the variant. Its own hedge
      - "may disturb cellular function" - marks how far short of a defined organelle
      phenotype the evidence currently stops.
  proposed_experiments:
  - experiment_id: exp_mam_integrity_in_e209k_neurons
    name: Direct measurement of ER-mitochondria contact in E209K neurons
    description: >-
      In isogenic patient-derived neurons, quantify ER-mitochondria contact site
      number and width by electron microscopy or split-fluorophore reporter, together
      with ER-to-mitochondria calcium transfer and mitochondrial membrane potential.
      This would either substantiate the MAM model in the correct cell type or exclude
      it, and in either case it would tell curators whether the widely repeated MAM
      account belongs in the pathograph.

genetic:
- name: PACS2
  gene_term:
    preferred_term: PACS2
    term:
      id: hgnc:23794
      label: PACS2
  relationship_type: CAUSATIVE
  association: >-
    A heterozygous de novo missense variant in PACS2, in nearly all reported
    individuals the recurrent c.625G>A p.(Glu209Lys) change, causes DEE66.
  notes: >-
    PACS2 encodes a multifunctional sorting protein that traffics cargo between the
    endoplasmic reticulum, Golgi, mitochondria, lysosomes and plasma membrane, working
    through an N-terminal furin-binding region that engages cargo together with
    adaptor proteins. Unlike most developmental and epileptic encephalopathy genes,
    the disorder is defined by one recurrent substitution rather than a spectrum of
    loss-of-function alleles, so the mechanism curated here is the consequence of a
    specific protein change and not of absent protein. Deliberate scope note: PACS2's
    role at mitochondria-associated ER membranes is well described in the general cell
    biology literature and is frequently invoked for this disorder, but no source
    verified for this entry measures a MAM-integrity defect for the E209K variant
    itself. The entry therefore curates what was measured - autoregulatory-domain
    impairment, slowed turnover, increased 14-3-3-epsilon association and increased
    stress-induced apoptosis - and does not assert a MAM defect. PACS1, the paralog,
    causes Schuurs-Hoeijmakers syndrome through its own recurrent variant, and the two
    disorders were explicitly compared when DEE66 was delineated. A second recurrent
    allele, p.(Glu211Lys), is reported in a single case and sits two residues from the
    main hotspot in the same regulatory region; the mechanism curated here is derived
    from E209K and this entry does not assume the two behave identically. The c.625G>A
    allele is absent from population databases and classified pathogenic or likely
    pathogenic in ClinVar, which is what makes a single heterozygous finding
    diagnostic in the right clinical context.
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PACS2 is an important PACS1 paralog and encodes a multifunctional sorting protein involved in nuclear gene expression and pathway traffic regulation."
    explanation: >-
      Gives the protein's function and its relationship to PACS1.
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both proteins harbor cargo(furin)-binding regions (FBRs) that bind cargo proteins, sorting adaptors, and cellular kinase."
    explanation: >-
      Describes the furin-binding region whose regulation the pathogenic variant
      impairs.
  - reference: PMID:38540691
    reference_title: "Characteristics of Developmental and Epileptic Encephalopathy Associated with PACS2 p.Glu209Lys Pathogenic Variant-Our Experience and Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glu209Lys and one case of the heterogenous missense variant PACS2 pGlu211Lys"
    explanation: >-
      Records the second recurrent allele and, importantly, that it rests on a single
      case - which is why the curated mechanism stays scoped to E209K.
  - reference: PMID:38540691
    reference_title: "Characteristics of Developmental and Epileptic Encephalopathy Associated with PACS2 p.Glu209Lys Pathogenic Variant-Our Experience and Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is not found in population databases, such as the Genome Aggregation Database (gnomAD)"
    explanation: >-
      Population-database absence, one half of the variant-interpretation evidence.
  - reference: PMID:38540691
    reference_title: "Characteristics of Developmental and Epileptic Encephalopathy Associated with PACS2 p.Glu209Lys Pathogenic Variant-Our Experience and Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to ClinVar, it is pathogenic/likely pathogenic"
    explanation: >-
      The clinical classification, the other half.

experimental_models:
- name: HCT116 cells expressing PACS-2 E209K
  experimental_model_type: CELL_LINE
  description: >-
    Human colorectal carcinoma cells transfected with wild-type or E209K PACS-2. This
    is currently the only published system in which the variant's molecular
    consequences have been measured, which is both why it carries most of this entry's
    mechanism and why its limitations are recorded prominently.
  modeled_mechanisms:
  - target: Increased Susceptibility to Stress-Induced Apoptosis
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Demonstrates that the variant increases apoptotic susceptibility under an
      applied stressor, and links that to increased 14-3-3-epsilon complex formation.
    limitations: >-
      A colorectal carcinoma line is not a neuron, a cerebellum, or a developing
      brain, and the readout requires an exogenous stressor - staurosporine - rather
      than reporting constitutive death. The system is also transfection-based rather
      than expressing the variant from its endogenous locus at physiological level, so
      stoichiometry with 14-3-3-epsilon and other partners is not that of a patient
      cell. The relationship is typed MEASURES rather than RECAPITULATES for that
      reason: it establishes a property of the mutant protein, not a disease model.
    readouts:
    - name: Staurosporine-induced apoptosis in E209K versus wild-type cells
      target: Increased Susceptibility to Stress-Induced Apoptosis
      direction: INCREASED
      interpretation: >-
        E209K-expressing cells die more readily than wild-type-expressing cells under
        staurosporine challenge.
      evidence:
      - reference: PMID:36188273
        reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we found that PACS-2 E209K increased susceptibility to staurosporine-induced apoptosis in HCT 116 cells"
        explanation: The apoptosis measurement behind this readout.
    evidence:
    - reference: PMID:36188273
      reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "As the PACS-2 E209K missense mutation has become a marker for neurodevelopmental disorders, we sought to characterize its biochemical properties."
      explanation: >-
        States the study's purpose as biochemical characterisation of the variant,
        which is the level at which this system is informative.
  - target: Altered PACS2 Proteostasis
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Provides the turnover measurement showing the variant protein is longer-lived
      than wild type.
    limitations: >-
      Turnover was measured by cycloheximide chase in 293T cells, another
      non-neuronal transformed line, so the half-life difference is a property of the
      protein in that context and may not hold in a post-mitotic neuron with different
      chaperone and degradation capacity.
    readouts:
    - name: PACS-2 protein turnover on cycloheximide chase
      target: Altered PACS2 Proteostasis
      direction: DECREASED
      interpretation: >-
        Turnover rate falls - equivalently, half-life rises - for E209K relative to
        wild type.
      evidence:
      - reference: PMID:36188273
        reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The longer half-life of PACS-2 E209K suggests a disruption in its proteostasis, with the potential for altered protein-protein interactions."
        explanation: The half-life result behind this readout.


treatments:
- name: Antiseizure Medication
  description: >-
    Seizures require multiple medication trials in the first year and are difficult to
    control, but frequently become easier to control or remit with age. This entry
    does not rank individual agents, because the cited sources describe the course
    rather than comparing drugs head to head.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Neonatal-Onset Epilepsy with Age-Dependent Improvement
    treatment_effect: INHIBITS
    description: >-
      Symptomatic seizure suppression. The link is to the seizure node only - no
      antiseizure medication addresses the trafficking or proteostasis arms.
    evidence:
    - reference: PMID:29656858
      reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Mixed focal and generalized epilepsy occurred in the neonatal period, controlled with difficulty in the first year, but many improved in early childhood."
      explanation: >-
        Typed PARTIAL deliberately: the source establishes that seizures are
        controlled with difficulty and later improve, but does not attribute the
        improvement to medication rather than to the natural course.
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to the defined PACS1 recurrent variant series, individuals with PACS2 variant have more consistently neonatal/early-infantile-onset epilepsy that can be challenging to control."
    explanation: >-
      Establishes the difficulty of control that motivates multi-agent management.

- name: Genetic Counseling
  description: >-
    Offered given the near-universal de novo occurrence and autosomal dominant
    inheritance once established, with recurrence risk limited to gonadal mosaicism.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

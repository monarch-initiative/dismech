name: PACS2-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-19T19:10:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 66
- DEE66
- EIEE66
- PACS2 syndrome
description: >-
  PACS2-related developmental and epileptic encephalopathy (DEE66) is an autosomal
  dominant disorder caused by a heterozygous, almost always de novo, missense variant
  in PACS2 - overwhelmingly the recurrent c.625G>A, p.(Glu209Lys) change. PACS2
  encodes a multifunctional sorting protein that traffics cargo between the
  endoplasmic reticulum, Golgi, mitochondria, lysosomes and plasma membrane. The
  clinical picture is neonatal- or early-infantile-onset epilepsy that is hard to
  control in the first year but often improves in early childhood, global
  developmental delay, hypotonia, facial dysmorphism, and cerebellar dysgenesis on
  MRI. The disorder is unusual among the developmental and epileptic encephalopathies
  for this partly remitting seizure course, and the small adult literature hints at a
  second, later phase of progressive decline.

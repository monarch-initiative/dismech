    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing and intensive data sharing identified a recurrent de novo PACS2 heterozygous missense variant in 14 unrelated individuals."
    explanation: >-
      Establishes the heterozygous de novo mechanism in the delineating cohort.

pathophysiology:
- name: De Novo PACS2 p.Glu209Lys Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous de novo missense variant, in nearly all reported individuals the
    recurrent c.625G>A p.(Glu209Lys) change. This node records the lesion only. Note
    the disorder is defined by one recurrent substitution rather than by a spectrum of
    loss-of-function alleles, which is why the downstream arms are all consequences of
    a single specific protein change rather than of absent protein.
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing and intensive data sharing identified a recurrent de novo PACS2 heterozygous missense variant in 14 unrelated individuals."
    explanation: >-
      The recurrent de novo variant in the founding cohort.
  downstream:
  - target: Impaired PACS2 Autoregulatory Domain Function
    causal_link_type: DIRECT
    description: >-
      The substitution sits in the predicted autoregulatory domain and degrades its
      function.
  - target: Altered PACS2 Proteostasis
    causal_link_type: DIRECT
    description: >-
      The variant protein turns over more slowly than wild type.

- name: Impaired PACS2 Autoregulatory Domain Function
  biological_scale: MOLECULAR
  description: >-
    The variant reduces the ability of the predicted autoregulatory domain to modulate
    the interaction between the PACS2 cargo/furin-binding region and its client
    proteins. This is the trafficking-control arm, and it is separate from the
    proteostasis arm below because the two were established by different experiments.
  biological_processes:
  - preferred_term: intracellular protein transport
    term:
      id: GO:0006886
      label: intracellular protein transport
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies demonstrated that the PACS2 recurrent variant reduces the ability of the predicted autoregulatory domain to modulate the interaction between the PACS2 FBR and client proteins, which may disturb cellular function."
    explanation: >-
      The functional measurement for this arm. Note the source's own hedge - "may
      disturb cellular function" - which is why no specific downstream cargo defect is
      asserted here.

- name: Altered PACS2 Proteostasis
  biological_scale: MOLECULAR
  description: >-
    The E209K protein has a slower turnover rate and longer half-life than wild type.
    Curated separately from the autoregulatory arm because it is a stability change
    rather than an interaction-control change, and because it is what the increased
    14-3-3-epsilon association was attributed to.
  evidence:
  - reference: PMID:36188273
    reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed that the PACS-2 E209K protein exhibited a slower turnover rate relative to PACS-2 wild type (WT) upon cycloheximide treatment in 293T cells"
    explanation: >-
      The turnover measurement, made by cycloheximide chase in 293T cells.
  downstream:
  - target: Increased 14-3-3-epsilon Association
    causal_link_type: DIRECT
    description: >-
      The stabilised variant protein forms more complex with 14-3-3-epsilon.

- name: Increased 14-3-3-epsilon Association
  biological_scale: MOLECULAR
  description: >-
    The variant protein shows increased association with 14-3-3-epsilon, a regulatory
    protein in neurodevelopment. This is the specific altered interaction that the
    proteostasis change produces, and the one the apoptosis phenotype is attributed
    to.
  evidence:
  - reference: PMID:36188273
    reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a regulatory protein in neurodevelopment known as 14-3-3ε was identified as having an increased association with PACS-2 E209K"
    explanation: >-
      The interaction measurement behind this node.
  downstream:
  - target: Increased Susceptibility to Stress-Induced Apoptosis
    causal_link_type: DIRECT
    description: >-
      The authors attribute the increased cell death to this complex formation.

- name: Increased Susceptibility to Stress-Induced Apoptosis
  biological_scale: CELLULAR
  description: >-
    Cells expressing E209K die more readily than wild-type-expressing cells when
    challenged with staurosporine. The conditional framing matters and is preserved
    here: this is increased susceptibility under an applied stressor, not constitutive
    cell death. The cell type in which it was measured is a serious limitation,
    recorded in the discussions.
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:36188273
    reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that PACS-2 E209K increased susceptibility to staurosporine-induced apoptosis in HCT 116 cells"
    explanation: >-
      The apoptosis measurement, together with the cell line it was made in.
  - reference: PMID:36188273
    reference_title: "The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible for PACS-2 Syndrome Increases Susceptibility to Apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, our findings suggest PACS-2 E209K alters PACS-2 proteostasis and favors complex formation with 14-3-3ε, leading to increased cell death in the presence of environmental stressors."
    explanation: >-
      The authors' summary chain, and the phrase "in the presence of environmental
      stressors" is the conditionality this node preserves.
  downstream:
  - target: Cerebellar Dysgenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed as the route to the cerebellar phenotype, but the link is untested in
      neural tissue - see the discussion on the heterologous cell system.

- name: Cerebellar Dysgenesis
  biological_scale: TISSUE
  description: >-
    Foliar distortion of the cerebellum with vermis hypoplasia and posterior fossa
    anomalies. This is the imaging finding that most distinguishes DEE66 from other
    developmental and epileptic encephalopathies, and it is a malformation rather than
    a degenerative change.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: granule cell
    term:
      id: CL:0000120
      label: granule cell
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebellar abnormalities may be similar but PACS2 individuals exhibit a pattern of clear dysgenesis ranging from mild to severe."
    explanation: >-
      Establishes dysgenesis as the characteristic pattern and its severity range,
      contrasted against the paralogous PACS1 disorder.
  - reference: PMID:38540691
    reference_title: "Characteristics of Developmental and Epileptic Encephalopathy Associated with PACS2 p.Glu209Lys Pathogenic Variant-Our Experience and Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRIs evidenced anomalies of the posterior cerebellar fossa, foliar distortion of the cerebellum, vermis hypoplasia, white matter reduction, and lateral ventricles enlargement."
    explanation: >-
      The imaging findings across the systematic review cohort.

- name: Cortical Network Hyperexcitability
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Cortical networks become seizure-prone in the neonatal period. This node is
    inferred from the clinical seizure phenotype: no electrophysiological
    characterisation of excitability has been published in any PACS2 model or in
    patient-derived neurons, which is a stated gap rather than an oversight.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mixed focal and generalized epilepsy occurred in the neonatal period, controlled with difficulty in the first year, but many improved in early childhood."
    explanation: >-
      Supports that a seizure-generating cortical state exists in the neonatal period.
      Typed PARTIAL because it evidences the seizures, not the excitability mechanism
      this node names.
  downstream:
  - target: Neonatal-Onset Epilepsy with Age-Dependent Improvement
    causal_link_type: DIRECT
    description: >-
      A hyperexcitable neonatal cortex generates the presenting seizures.

- name: Neonatal-Onset Epilepsy with Age-Dependent Improvement
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    Mixed focal and generalised seizures begin in the neonatal period and are
    difficult to control through the first year, but many patients improve in early
    childhood. The age-dependent improvement is curated as part of this node rather
    than as a separate outcome, because it is a property of the seizure disorder
    itself and distinguishes DEE66 from most developmental and epileptic
    encephalopathies.
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mixed focal and generalized epilepsy occurred in the neonatal period, controlled with difficulty in the first year, but many improved in early childhood."
    explanation: >-
      Gives both the onset and the characteristic later improvement.
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to the defined PACS1 recurrent variant series, individuals with PACS2 variant have more consistently neonatal/early-infantile-onset epilepsy that can be challenging to control."
    explanation: >-
      Contrasts the seizure course against the paralogous PACS1 disorder, which is
      what makes the neonatal onset a discriminating feature.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Early seizure burden plausibly compounds the developmental phenotype that the
      malformation arm also produces; the published data do not separate them.

- name: Global Developmental Delay
  biological_scale: ORGANISM
  description: >-
    Delayed motor and speech milestones with intellectual disability of variable
    degree. Two upstream routes converge here - the cerebellar and cortical
    malformation arm, and the neonatal seizure burden - and no published analysis
    separates their contributions.
  evidence:
  - reference: PMID:29656858
    reference_title: "A Recurrent De Novo PACS2 Heterozygous Missense Variant Causes Neonatal-Onset Developmental Epileptic Encephalopathy, Facial Dysmorphism, and Cerebellar Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their phenotype was characterized by epilepsy, global developmental delay with or without autism, common cerebellar dysgenesis, and facial dysmorphism."
    explanation: >-
      Names global developmental delay as a core feature of the syndrome.


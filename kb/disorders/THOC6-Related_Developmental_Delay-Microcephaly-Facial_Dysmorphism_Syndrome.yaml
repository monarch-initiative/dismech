name: THOC6-Related Developmental Delay-Microcephaly-Facial Dysmorphism Syndrome
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
synonyms:
- Beaulieu-Boycott-Innes syndrome
- BBIS
- THOC6 intellectual disability syndrome
- Microcephaly, mental retardation, and distinctive facies, with cardiac and genitourinary malformations
description: >
  THOC6-related developmental delay-microcephaly-facial dysmorphism syndrome
  (Beaulieu-Boycott-Innes syndrome, BBIS; THOC6 intellectual disability syndrome)
  is a rare autosomal recessive multiple congenital anomalies-intellectual
  disability syndrome caused by biallelic variants in THOC6. THOC6 encodes a
  WD40-repeat subunit of the THO complex, the core of the conserved TREX
  (TRanscription-EXport) complex that couples transcription and mRNA processing to
  the nuclear export of processed messenger RNA. Loss of functional THOC6
  mislocalizes the protein and disrupts assembly of the TREX tetramer; recent
  human neural-cell work indicates the primary molecular lesion is widespread
  mRNA mis-splicing (rather than a bulk nuclear-export defect), which derails the
  proliferative-to-neurogenic transition of corticogenesis. The disorder is characterized by moderate-to-severe
  intellectual disability and developmental delay, microcephaly, short stature, and
  a recognizable (though subtle) facial gestalt (tall forehead, deep-set eyes,
  short and upslanted palpebral fissures, long nose with low-hanging columella),
  together with variable structural malformations of the brain (agenesis/dysgenesis
  of the corpus callosum, ventriculomegaly, hydrocephalus), heart (atrial and
  ventricular septal defects), and genitourinary tract (renal anomalies,
  cryptorchidism), plus dental anomalies. It was first delineated in a Hutterite
  population by Beaulieu, Boycott, and Innes.

pathophysiology:
- name: Loss of THO/TREX Complex Stability and THO-Subunit Interaction
  description: >
    THOC6 is a WD40-repeat subunit of the THO complex, the multiprotein core of
    the TREX (TRanscription-EXport) complex, whose canonical function is to couple
    transcription and mRNA processing to the recruitment of the nuclear mRNA export
    machinery. Disease-associated biallelic THOC6 variants (missense and truncating)
    mislocalize the protein from the nucleus to the cytoplasm and weaken its
    interaction with other THO subunits (THOC1, THOC5), destabilizing the complex.
    Historically, BBIS was attributed to a bulk mRNA nuclear-export defect
    downstream of this destabilization; that classical model has since been
    superseded — human neural-cell data (see the mis-splicing node below) found no
    detectable bulk export defect and instead identify disrupted TREX tetramer
    assembly and aberrant mRNA processing as the primary lesion. This node captures
    the well-evidenced proximal event: complex destabilization and loss of
    THO-subunit interaction.
  cellular_components:
  - preferred_term: THO complex
    term:
      id: GO:0000445
      label: THO complex part of transcription export complex
  genes:
  - preferred_term: THOC6
    term:
      id: hgnc:28369
      label: THOC6
  downstream:
  - target: Impaired TREX Tetramer Assembly
    description: >
      Destabilization of the THO complex and loss of THOC6-THOC5/THOC1 interaction
      is the proximal cause of failed TREX tetramer assembly.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23621916
    reference_title: "Intellectual disability associated with a homozygous missense mutation in THOC6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "THOC6 is a member of the THO/TREX complex which is involved in coordinating mRNA processing with mRNA export from the nucleus."
    explanation: >
      Establishes THOC6 as a component of the THO/TREX complex whose canonical role
      is coupling mRNA processing to nuclear export (background on the complex).
  - reference: PMID:23621916
    reference_title: "Intellectual disability associated with a homozygous missense mutation in THOC6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutant THOC6 was predominantly localized to the cytoplasm, suggesting that the mutant protein is unable to carry out its normal function."
    explanation: >
      Demonstrates that the disease mutation mislocalizes THOC6 out of the nucleus,
      the compartment where the THO complex acts.
  - reference: PMID:30476144
    reference_title: "Clinical and functional characterization of recurrent missense variants implicated in THOC6-related intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the different THOC6 variants alter the physiological nuclear localizationof the protein and its interaction with at least two THO subunits, THOC1 and THOC5."
    explanation: >
      Functional characterization showing BBIS variants disrupt THOC6 nuclear
      localization and its interaction with THO complex partners THOC1 and THOC5.
- name: Impaired Progenitor Proliferation and Increased Apoptosis in Development
  biological_scale: CELLULAR
  description: >
    TREX is essential during embryogenesis, where it regulates post-transcriptional
    self-renewal and differentiation and thereby stem/progenitor cell fate. Loss of
    THOC6 function increases apoptosis in cultured cells, consistent with the reduced
    brain growth (microcephaly) and structural brain malformations (corpus callosum
    dysgenesis) seen in patients. The defect is attributed to disrupted
    TREX-tetramer-dependent mRNA processing (mis-splicing) and the consequent
    derailment of the proliferative-to-neurogenic signaling on which rapidly
    dividing progenitors (including radial glia) depend.
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  downstream:
  - target: phenotypes#Microcephaly
    description: >
      Reduced neural progenitor proliferation and increased apoptosis diminish
      cortical neuron output, producing microcephaly.
    causal_link_type: DIRECT
  - target: phenotypes#Intellectual disability
    description: >
      Impaired corticogenesis underlies the moderate-to-severe intellectual
      disability that is the defining feature of the syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: phenotypes#Global developmental delay
    description: >
      Impaired corticogenesis underlies the global developmental delay.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: phenotypes#Agenesis of corpus callosum
    description: >
      Impaired progenitor dynamics during corticogenesis contribute to corpus
      callosum dysgenesis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23621916
    reference_title: "Intellectual disability associated with a homozygous missense mutation in THOC6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "siRNA knockdown of THOC6 revealed increased apoptosis in cultured cells."
    explanation: >
      Loss of THOC6 increases apoptosis, a plausible mechanism for reduced brain
      growth and developmental malformation.
  - reference: PMID:30238602
    reference_title: "Novel CNS malformations and skeletal anomalies in a patient with Beaulieu-boycott-Innes syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In mammals, TREX is essential during embryogenesis, determining stem cell fate specification by regulating posttranscriptional self-renewal and differentiation in several tissues."
    explanation: >
      Links the TREX complex (of which THOC6 is a subunit) to embryonic stem cell
      fate specification (background review statement), supporting a developmental
      mechanism for BBIS malformations.
- name: Impaired TREX Tetramer Assembly
  biological_scale: MOLECULAR
  description: >
    THOC6 is required for assembly of the mammalian TREX tetramer (four six-subunit
    THO monomers), a metazoan-specific function beyond the yeast-conserved nuclear
    export role of the TREX dimer. Biallelic THOC6 loss-of-function reduces the
    binding affinity of the export adaptor ALYREF to THOC5 without lowering the
    expression of TREX members, implicating failed tetramer formation as the
    proximal molecular consequence of complex destabilization.
  cellular_components:
  - preferred_term: transcription export complex
    term:
      id: GO:0000346
      label: transcription export complex
  downstream:
  - target: Widespread mRNA Mis-Splicing
    description: >
      Loss of the TREX tetramer's mRNA-processing function leads to widespread
      aberrant splicing.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38388531
    reference_title: "TREX tetramer disruption alters RNA processing necessary for corticogenesis in THOC6 Intellectual Disability Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "THOC6 is critical for mammalian Transcription Export complex (TREX) tetramer formation, which is composed of four six-subunit THO monomers."
    explanation: >
      Establishes THOC6's specific role in TREX tetramer assembly.
  - reference: PMID:38388531
    reference_title: "TREX tetramer disruption alters RNA processing necessary for corticogenesis in THOC6 Intellectual Disability Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biallelic THOC6 LOF variants reduce the binding affinity of ALYREF to THOC5 without affecting the protein expression of TREX members, implicating impaired TREX tetramer formation."
    explanation: >
      Shows the molecular consequence of THOC6 loss is impaired tetramer formation
      (reduced ALYREF-THOC5 binding), not loss of TREX subunit expression.
- name: Widespread mRNA Mis-Splicing
  biological_scale: MOLECULAR
  description: >
    Rather than a bulk mRNA nuclear-export defect (which is not detectable in
    patient neural cells), loss of the TREX tetramer causes widespread mRNA
    mis-splicing — the primary molecular lesion of THOC6 intellectual disability
    syndrome, demonstrated concordantly in human iPSC-derived neural cells and in
    mouse neural tissue.
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
  downstream:
  - target: Disrupted Proliferative-to-Neurogenic Transition Signaling
    description: >
      Mis-splicing derails the signaling programs that control the switch from
      proliferative to neurogenic divisions in corticogenesis.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38388531
    reference_title: "TREX tetramer disruption alters RNA processing necessary for corticogenesis in THOC6 Intellectual Disability Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Defects in RNA nuclear export functions were not detected in biallelic THOC6 LOF human neural cells."
    explanation: >
      Refutes bulk nuclear-export failure as the primary lesion in human iPSC-derived
      neural cells, revising the classical model.
  - reference: PMID:38388531
    reference_title: "TREX tetramer disruption alters RNA processing necessary for corticogenesis in THOC6 Intellectual Disability Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Instead, mis-splicing was detected in human and mouse neural tissue, revealing novel THOC6-mediated TREX coordination of mRNA processing."
    explanation: >
      Identifies mRNA mis-splicing as the primary molecular defect, demonstrated in
      vivo in mouse neural tissue (concordant with the human iPSC finding).
- name: Disrupted Proliferative-to-Neurogenic Transition Signaling
  biological_scale: CELLULAR
  description: >
    The mis-splicing burden disrupts the key signaling pathways that regulate the
    transition from proliferative to neurogenic divisions during human
    corticogenesis, linking the molecular lesion to the downstream progenitor
    proliferation/apoptosis defect and, ultimately, to microcephaly and impaired
    cortical development.
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
  downstream:
  - target: Impaired Progenitor Proliferation and Increased Apoptosis in Development
    description: >
      Disrupted proliferative-to-neurogenic signaling impairs neural progenitor
      proliferation and increases apoptosis during corticogenesis.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38388531
    reference_title: "TREX tetramer disruption alters RNA processing necessary for corticogenesis in THOC6 Intellectual Disability Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that THOC6 is required for key signaling pathways known to regulate the transition from proliferative to neurogenic divisions during human corticogenesis."
    explanation: >
      Bridges the molecular lesion to the cellular phenotype: THOC6 is required for
      the signaling that governs the proliferative-to-neurogenic transition.
genetic:
- name: THOC6
  notes: >
    Biallelic (homozygous or compound heterozygous) loss-of-function and missense
    variants in THOC6 cause BBIS. A recurrent homozygous missense founder variant
    (c.136G>A, p.Gly46Arg) was identified in the Hutterite population; other families
    carry compound heterozygous missense/truncating variants, including a recurrent
    European three-variant missense haplotype.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: THOC6
    term:
      id: hgnc:28369
      label: THOC6
  evidence:
  - reference: PMID:23621916
    reference_title: "Intellectual disability associated with a homozygous missense mutation in THOC6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Candidate gene sequencing followed by exome sequencing identified a homozygous missense mutation p.Gly46Arg, in THOC6."
    explanation: >
      Identifies the founding homozygous THOC6 missense variant in the original
      Hutterite families.
  - reference: CGGV:assertion_db4039ce-b9e7-40ba-ac45-a622bb75b803-2024-03-15T160000.000Z
    reference_title: "THOC6 / THOC6-related developmental delay-microcephaly-facial dysmorphism syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "THOC6 | HGNC:28369 | THOC6-related developmental delay-microcephaly-facial dysmorphism syndrome | MONDO:0013362 | AR | Definitive"
    explanation: >
      ClinGen Syndromic Disorders GCEP classifies the THOC6-disease relationship as
      Definitive (autosomal recessive).
  - reference: PMID:27102954
    reference_title: "Autosomal recessive mutations in THOC6 cause intellectual disability: syndrome delineation requiring forward and reverse phenotyping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified three unrelated patients with bi-allelic mutations in THOC6 associated with intellectual disability and additional clinical features."

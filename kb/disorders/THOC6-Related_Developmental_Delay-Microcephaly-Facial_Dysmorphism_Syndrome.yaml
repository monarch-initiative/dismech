discussions:
- discussion_id: mismatch_thoc6_mouse_embryonic_lethality
  prompt: >-
    Why is germline biallelic Thoc6 loss-of-function embryonic lethal in mouse
    while biallelic THOC6 loss-of-function is compatible with survival to adulthood
    in humans, and what human-specific mechanism compensates for the resulting
    mRNA-processing burden?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Widespread mRNA Mis-Splicing
  - pathophysiology#Impaired Progenitor Proliferation and Increased Apoptosis in Development
  rationale: >-
    Germline biallelic Thoc6 loss-of-function variants cause mouse embryonic
    lethality, whereas affected humans with biallelic THOC6 loss-of-function
    survive into adulthood (oldest reported individuals in their 40s) with a
    microcephaly/intellectual-disability malformation syndrome. The mouse therefore
    does not reproduce human survivability, and the fidelity of murine
    proliferative/apoptotic severity to the comparatively milder, viable human
    phenotype is unresolved. This matters when interpreting the model: mouse data
    establish the essential developmental requirement for THOC6 and the mis-splicing
    mechanism, but a human-specific tolerance/compensation for the intron-retention
    and lncRNA-dysregulation burden is inferred and not yet identified, so
    conclusions about disease severity and candidate modifiers drawn from the mouse
    should be qualified.
  proposed_experiments:
  - experiment_id: exp_thoc6_cross_species_splicing_survival
    name: Cross-species comparison of THOC6-dependent mis-splicing and survival thresholds
    description: >-
      Systematically compare the mis-splicing landscape, intron-retention burden,
      and lncRNA dysregulation between THOC6-deficient human iPSC-derived cortical
      organoids/neural progenitors and Thoc6-mutant mouse neuroepithelium at matched
      developmental stages, and test candidate human-specific paralogs or
      compensatory RNA-processing factors for their ability to rescue mouse
      lethality, to identify what buffers the human phenotype.
  evidence:
  - reference: PMID:38388531
    reference_title: "TREX tetramer disruption alters RNA processing necessary for corticogenesis in THOC6 Intellectual Disability Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Germline biallelic Thoc6 loss-of-function (LOF) variants result in mouse embryonic lethality."
    explanation: >
      Establishes the mouse embryonic-lethal phenotype that is not observed in
      surviving human patients, defining the model mismatch.

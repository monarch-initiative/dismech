prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >
    Ultra-rare. As of the 2020 GeneReviews synthesis, ~19 affected individuals from
    ~15 families had been published, with sporadic case reports since; the total
    reported cohort remains well under 50 individuals. A recurrent founder variant
    elevates recurrence risk within specific endogamous Hutterite subpopulations
    (carrier frequency 2-3%).
  evidence:
  - reference: PMID:35426486
    reference_title: "Biallelic THOC6 pathogenic variants: Prenatal phenotype and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This condition was described in 17 patients and is characterized by a moderate to severe intellectual disability"
    explanation: >
      Documents the very small number of reported patients, consistent with an
      ultra-rare (<1/1,000,000) disorder.
- population: Hutterite (Dariusleut and Lehrerleut)
  measure_type: CARRIER_FREQUENCY
  rate_low: 2000.0
  rate_high: 3000.0
  notes: >
    Carrier frequency of the c.136G>A (p.Gly46Arg) founder variant in Hutterite
    control samples: 3% in Dariusleut and 2% in Lehrerleut (i.e. 2000-3000 carriers
    per 100,000).
  evidence:
  - reference: PMID:23621916
    reference_title: "Intellectual disability associated with a homozygous missense mutation in THOC6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant was seen at a frequency of 3% in 92 Dariusleut controls and at a frequency of 2% in 120 Lehrerleut controls"
    explanation: >
      Quantifies the founder-variant carrier frequency in the two Hutterite leut
      populations.

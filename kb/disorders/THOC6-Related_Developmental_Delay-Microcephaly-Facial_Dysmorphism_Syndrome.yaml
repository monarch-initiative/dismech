diagnosis:
- name: Molecular genetic testing for biallelic THOC6 variants
  description: >
    The diagnosis is established in a proband with biallelic pathogenic THOC6
    variants identified by molecular genetic testing (gene-targeted or
    comprehensive genomic testing). In individuals of Hutterite ancestry, targeted
    testing for the c.136G>A (p.Gly46Arg) founder variant can be considered first.

has_subtypes:
- name: Classic GLUT1 Deficiency Syndrome
  display_name: Classic (Severe, Infantile-Onset) GLUT1 Deficiency Syndrome
  subtype_term:
    preferred_term: encephalopathy due to GLUT1 deficiency
    term:
      id: MONDO:0011724
      label: encephalopathy due to GLUT1 deficiency
  description: >-
    The most common and severe presentation, with onset in infancy to early
    childhood. Predominant clinical findings are paroxysmal eye-head movements,
    pharmacoresistant seizures of varying types, deceleration of head growth,
    and developmental delay, followed by complex movement disorders and
    intellectual disability ranging from mild to severe.
  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When first diagnosed in infancy to early childhood, the predominant clinical findings of Glut1DS are paroxysmal eye-head movements, pharmacoresistant seizures of varying types, deceleration of head growth, and developmental delay."
    explanation: GeneReviews describes the classic infantile-onset presentation as the most common and severe form of Glut1DS.
- name: GLUT1 DS with Paroxysmal Exertion-Induced Dyskinesia
  display_name: GLUT1 Deficiency Syndrome 2 (DYT18 / Paroxysmal Exercise-Induced Dyskinesia,
    including DYT9 / episodic choreoathetosis with spasticity)
  subtype_term:
    preferred_term: childhood onset GLUT1 deficiency syndrome 2
    term:
      id: MONDO:0012805
      label: childhood onset GLUT1 deficiency syndrome 2
  description: >-
    A milder, later-onset (childhood) form dominated by paroxysmal dystonic
    attacks of the extremities triggered by prolonged physical exertion, with or
    without epilepsy or hemolytic anemia. Corresponds to OMIM PS612126 / MONDO
    childhood-onset GLUT1 deficiency syndrome 2 (DYT18). This subtype also
    covers the presentation formerly designated dystonia 9 (DYT9, OMIM 601042,
    MONDO:0010983, episodic choreoathetosis with spasticity), in which the same
    exertion-induced dyskinesia is accompanied by slowly progressive spastic
    paraparesis: the German/Dutch DYT9 pedigree was shown to carry a causative
    SLC2A1 mutation, making DYT9 and DYT18 allelic rather than distinct
    entities.
  evidence:
  - reference: PMID:21649651
    reference_title: "Milder phenotypes of glucose transporter type 1 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This paper also shows phenotypical parallels between GLUT1DS and paroxysmal exertion-induced dyskinesia."
    explanation: Directly documents the milder paroxysmal exertion-induced dyskinesia phenotype as part of the GLUT1DS spectrum.
  - reference: PMID:18577546
    reference_title: "Paroxysmal exercise-induced dyskinesia and epilepsy is due to mutations in SLC2A1, encoding the glucose transporter GLUT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "co-occurring PED and epilepsy can be due to autosomal dominant heterozygous SLC2A1 mutations, expanding the phenotypic spectrum associated with GLUT1 deficiency"
    explanation: Five-generation family plus three nuclear families establish PED with epilepsy as an SLC2A1 phenotype.
  - reference: PMID:18451999
    reference_title: "GLUT1 mutations are a cause of paroxysmal exertion-induced dyskinesias and induce hemolytic anemia by a cation leak."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their PED was accompanied by epilepsy, mild developmental delay, reduced CSF glucose levels, hemolytic anemia with echinocytosis, and altered erythrocyte ion concentrations."
    explanation: Three-generation PED family documents the hemolytic-anemia variant of the GLUT1DS2 presentation.
  - reference: PMID:21832227
    reference_title: "Paroxysmal choreoathetosis/spasticity (DYT9) is caused by a GLUT1 defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study shows that DYT9 and DYT18 are allelic disorders and enlarges the spectrum of GLUT1 phenotypes, now also including slowly progressive spastic paraparesis combined with PED."
    explanation: Establishes that the formerly separate DYT9 designation names the same SLC2A1 entity as DYT18, which is why the two are curated as one subtype rather than as siblings.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Glut1DS is most commonly caused by a heterozygous SLC2A1 pathogenic variant
    inherited in an autosomal dominant manner. About 90% of individuals have the
    disorder as the result of a de novo SLC2A1 pathogenic variant; about 10%
    have a variant inherited from a parent, whose degree of impairment may be
    mild or nonexistent (possible parental somatic mosaicism). Rare biallelic
    (autosomal recessive) inheritance has also been reported.
  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glut1DS is most commonly caused by a heterozygous SLC2A1 pathogenic variant and inherited in an autosomal dominant manner. About 90% of individuals with Glut1DS have the disorder as the result of a de novo SLC2A1 pathogenic variant; about 10% of individuals have the disorder as the result of a pathogenic variant inherited from a parent."
    explanation: GeneReviews genetic counseling section directly documents autosomal dominant inheritance, predominantly de novo, with a minority of inherited cases.
  - reference: PMID:11136715
    reference_title: "Autosomal dominant transmission of GLUT1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of autosomal dominant transmission of GLUT1 deficiency, confirming that this condition is the result of haploinsufficiency."
    explanation: Father-to-child transmission in two separate marriages established dominant inheritance and the haploinsufficiency mechanism.
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of impairment in the transmitting parent may be mild or nonexistent; parental somatic mosaicism for the SLC2A1 pathogenic variant may explain this observation."
    explanation: Supports incomplete penetrance / variable expressivity in transmitting parents.
  de_novo_rate: "About 90% de novo; about 10% inherited from a parent (GeneReviews)"
  penetrance: INCOMPLETE
  expressivity: VARIABLE
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Rarely, biallelic SLC2A1 variants (compound heterozygous or homozygous)
    inherited from asymptomatic heterozygous parents produce Glut1DS as an
    autosomal recessive trait. The clinical inheritance pattern is determined by
    the relative pathogenicity of each allele and the resulting degree of GLUT1
    haploinsufficiency, measured as residual erythrocyte glucose uptake.
  evidence:
  - reference: PMID:20687207
    reference_title: "Glut1 deficiency: inheritance pattern determined by haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These cases demonstrate that Glut1 DS may present as an autosomal recessive trait. The clinical pattern of inheritance is determined by the relative pathogenicity of the mutation and the resulting degree of haploinsufficiency."
    explanation: Two families with biallelic SLC2A1 variants and asymptomatic heterozygous parents define the recessive presentation.
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive inheritance has been reported in two families to date."
    explanation: GeneReviews confirms recessive inheritance is rare (two families).
pathophysiology:
- name: SLC2A1 Loss-of-Function Variant
  description: >-
    Heterozygous (rarely biallelic) pathogenic variants in SLC2A1 reduce the
    amount or function of the GLUT1 facilitative glucose transporter protein,
    typically through haploinsufficiency.
  gene:
    preferred_term: SLC2A1
    term:
      id: hgnc:11005
      label: SLC2A1
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: D-glucose transmembrane transporter activity
    term:
      id: GO:0055056
      label: D-glucose transmembrane transporter activity
    modifier: DECREASED
  notes: >-
    Variant classes span the whole loss-of-function spectrum. The founding
    molecular report identified hemizygosity (whole-gene deletion) and nonsense
    truncations; large series add missense, frameshift, splice-site,
    translation-initiation and multi-exon deletion alleles. Missense alleles can
    leave immunoreactive protein at the membrane while abolishing transport
    (Gly91Asp), and pore-region alleles (Q282_S285del) additionally create an
    erythrocyte cation leak. The degree of residual transport, not the variant
    class per se, sets clinical severity and even the apparent inheritance
    pattern.
  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Glut1DS is established in a proband with suggestive clinical findings, hypoglycorrhachia documented by lumbar puncture, and a (usually) heterozygous pathogenic variant in SLC2A1 identified by molecular genetic testing."
    explanation: GeneReviews establishes heterozygous SLC2A1 pathogenic variants as the molecular cause of Glut1DS.
  - reference: PMID:12029447
    reference_title: "Facilitated glucose transporter protein type 1 (GLUT1) deficiency syndrome: impaired glucose transport into brain-- a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several heterozygous mutations resulting in GLUT1 haploinsufficiency have been identified."
    explanation: Review paper documents the haploinsufficiency mechanism underlying heterozygous SLC2A1 mutations.
  - reference: PMID:9462754
    reference_title: "GLUT-1 deficiency syndrome caused by haploinsufficiency of the blood-brain barrier hexose carrier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now report two distinct classes of mutations as the molecular basis for the functional defect of glucose transport: hemizygosity of GLUT1 and nonsense mutations resulting in truncation of the GLUT-1 protein."
    explanation: The founding molecular study identifies whole-gene hemizygosity and truncating nonsense alleles as the first two classes of causal SLC2A1 lesion.
  - reference: PMID:11136715
    reference_title: "Autosomal dominant transmission of GLUT1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GLUT1 immunoreactivity was normal, but 3-O-methyl-D-glucose uptake into erythrocytes was significantly reduced, suggesting a quantitatively normal, but functionally impaired, GLUT1 protein at the cell membrane."
    explanation: A missense allele (Gly91Asp) shows that loss of transport function, not only loss of protein, produces the haploinsufficient state.
  - reference: PMID:18451999
    reference_title: "GLUT1 mutations are a cause of paroxysmal exertion-induced dyskinesias and induce hemolytic anemia by a cation leak."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies in Xenopus oocytes and human erythrocytes revealed that this mutation decreased glucose transport and caused a cation leak that alters intracellular concentrations of sodium, potassium, and calcium."
    explanation: Heterologous expression confirms that PED-associated SLC2A1 alleles are loss-of-function for glucose transport, with an additional cation-leak gain in the pore-region deletion.
  - reference: PMID:20687207
    reference_title: "Glut1 deficiency: inheritance pattern determined by haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Red blood cell glucose uptake residual activity, a surrogate of haploinsufficiency, correlated with the clinical severity."
    explanation: The degree of residual transporter activity, rather than the variant class, scales the clinical phenotype.
  downstream:
  - target: Reduced GLUT1 Transporter Function at the Blood-Brain Barrier
    causal_link_type: DIRECT
    description: >-
      Loss-of-function SLC2A1 variants reduce the density or activity of GLUT1
      transporters expressed on brain microvascular endothelial cells.
    hypothesis_groups:
    - canonical_glut1_energy_deficit
    evidence:
    - reference: PMID:12029447
      reference_title: "Facilitated glucose transporter protein type 1 (GLUT1) deficiency syndrome: impaired glucose transport into brain-- a review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is caused by a defect in glucose transport into brain, mediated by the facilitative glucose transporter GLUT1."
      explanation: Directly links the SLC2A1/GLUT1 defect to impaired glucose transport into the brain.
    - reference: PMID:9462754
      reference_title: "GLUT-1 deficiency syndrome caused by haploinsufficiency of the blood-brain barrier hexose carrier."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "GLUT-1, whose sequence was originally deduced from cDNAs cloned from human hepatoma and rat brain, is present at high levels in primate erythrocytes and brain endothelial cells."
      explanation: Places the mutated carrier at the brain endothelium, the site where the transport lesion acts.
  - target: Erythrocyte GLUT1 Dysfunction
    causal_link_type: DIRECT
    description: >-
      The same haploinsufficient transporter is expressed on erythrocytes, so
      red-cell hexose uptake falls in parallel with brain transport and serves
      as the accessible functional surrogate of the lesion.
    evidence:
    - reference: PMID:22190371
      reference_title: "Glut1 deficiency syndrome and erythrocyte glucose uptake assay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings validate the erythrocyte glucose uptake assay as a confirmatory functional test for Glut1 DS and as a surrogate marker for GLUT1 haploinsufficiency."
      explanation: Establishes reduced erythrocyte uptake as a direct read-out of the same haploinsufficient transporter.
- name: Reduced GLUT1 Transporter Function at the Blood-Brain Barrier
  description: >-
    GLUT1 is the transporter responsible for facilitated glucose diffusion
    across the endothelial cells that form the blood-brain barrier, as well as
    glucose uptake into erythrocytes. Reduced GLUT1 activity impairs the rate at
    which glucose can be delivered from blood to brain, independent of blood
    glucose concentration.

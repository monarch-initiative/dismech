    evidence:
    - reference: PMID:16497725
      reference_title: "A mouse model for Glut-1 haploinsufficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated a heterozygous haploinsufficient mouse model by targeted disruption of the promoter and exon 1 regions of the mouse GLUT-1 gene."
      explanation: Defines the allele as a haploinsufficiency model.
  - target: Reduced GLUT1 Transporter Function at the Blood-Brain Barrier
    relationship: RECAPITULATES
    fidelity: HIGH

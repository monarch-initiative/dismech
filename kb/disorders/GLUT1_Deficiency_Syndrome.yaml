- name: Glut1 Rgsc200 ENU missense mouse
  species: Mouse
  genotype: Slc2a1 Rgsc200 heterozygous missense at residue 324; homozygotes embryonic lethal
  category: Chemically induced by ENU mutagenesis
  genes:
  - preferred_term: SLC2A1
    term:
      id: hgnc:11005
      label: SLC2A1
  publication: PMID:31399478
  description: >-
    An ENU-induced missense allele at residue 324 of Glut1. Heterozygotes show
    decreased CSF glucose, contextual learning deficits, reduced body size,
    seizure-like behaviour, spontaneous EEG abnormalities and a longer wake and
    shorter NREM sleep pattern; FDG-PET kinetics show reduced glucose transport
    with enhanced hexokinase activity. Homozygotes die in utero, paralleling
    the presumed lethality of complete GLUT1 loss in humans.
  evidence:
  - reference: PMID:31399478
    reference_title: "A new mouse model of GLUT1 deficiency syndrome exhibits abnormal sleep-wake patterns and alterations of glucose kinetics in the brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results indicate that a Glut1Rgsc200 mutant is a useful tool for elucidating the molecular mechanisms of GLUT1DS."
    explanation: The authors' conclusion that this ENU allele is an informative model of GLUT1DS.
  associated_phenotypes:
  - Decreased cerebrospinal fluid glucose
  - Seizure-like behaviour and abnormal EEG
  - Contextual learning deficit
  - Reduced body size
  - Prolonged wake and shortened NREM sleep
  - Embryonic lethality of homozygotes
  modeled_mechanisms:
  - target: Cerebral Glucose Energy Deficit
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced brain glucose transport with compensatory hexokinase upregulation reproduces the supply-limited energy state.
    limitations: >-
      A missense allele of unknown residual transport, so the depth of the
      deficit is not calibrated against the human haploinsufficient range, and
      the enhanced hexokinase activity is a mouse observation not yet shown in
      patients.
    readouts:
    - name: Brain glucose transport by FDG-PET kinetics
      target: Cerebral Glucose Energy Deficit
      direction: DECREASED
      interpretation: The reduced transport constant reports the supply limitation.
    - name: Cerebrospinal fluid glucose
      target: Cerebral Glucose Energy Deficit
      direction: DECREASED
      interpretation: Hypoglycorrhachia in the mutant.
    evidence:
    - reference: PMID:31399478
      reference_title: "A new mouse model of GLUT1 deficiency syndrome exhibits abnormal sleep-wake patterns and alterations of glucose kinetics in the brain."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "revealed that glucose transportation was reduced, whereas hexokinase activity and glucose metabolism were enhanced"
      explanation: Reports the PET kinetic result.
  - target: Neuronal Hyperexcitability and Hypersynchrony
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Spontaneous EEG abnormalities and seizure-like behaviour both occur, but were not observed concurrently.
    limitations: >-
      EEG abnormality and seizure-like behaviour were dissociated in time, so
      electroclinical seizures were not demonstrated in this model.
    readouts:
    - name: Spontaneous EEG abnormality
      target: Neuronal Hyperexcitability and Hypersynchrony
      direction: INCREASED
      interpretation: Electrographic hyperexcitability without confirmed concurrent behavioural seizures.
    evidence:
    - reference: PMID:31399478
      reference_title: "A new mouse model of GLUT1 deficiency syndrome exhibits abnormal sleep-wake patterns and alterations of glucose kinetics in the brain."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "During EEG recording, the abnormality occurred spontaneously, whereas the seizure-like phenotypes were not observed at the same time."
      explanation: Reports the dissociation that limits fidelity.
- name: Glut1-deficient mouse with AAV9-mediated Glut1 repletion
  species: Mouse
  genotype: Slc2a1-deficient model mice, with or without AAV9-mediated Glut1 repletion at defined ages
  category: Genetically engineered with gene-replacement rescue
  genes:
  - preferred_term: SLC2A1
    term:
      id: hgnc:11005
      label: SLC2A1
  publication: PMID:28106060
  description: >-
    Glut1-deficient model mice used to show that low Glut1 arrests cerebral
    angiogenesis and diminishes the brain microvasculature without breaching

  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The needs of the brain for glucose increase rapidly after birth, peaking in early childhood, remaining high until about age 10 years, then gradually decreasing throughout adolescence and plateauing in early adulthood."
    explanation: GeneReviews explains why the cerebral energy deficit is most severe in infancy/early childhood when brain glucose demand peaks, framing the developmental basis of the classic phenotype.
  - reference: PMID:26536893
    reference_title: "Triheptanoin dramatically reduces paroxysmal motor disorder in patients with GLUT1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, brain energy metabolism normalised with triheptanoin, that is, increased Pi/PCr ratio during brain activation compared to the recovery phase (p = 0.021), and deteriorated when triheptanoin was withdrawn."
    explanation: 31P-NMR spectroscopy in patients shows an abnormal activation-dependent brain energy profile that normalises with substrate supplementation, a direct in vivo measure of the cerebral energy deficit.
  - reference: PMID:31399478
    reference_title: "A new mouse model of GLUT1 deficiency syndrome exhibits abnormal sleep-wake patterns and alterations of glucose kinetics in the brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "glucose transportation was reduced, whereas hexokinase activity and glucose metabolism were enhanced"
    explanation: FDG-PET kinetics in a missense mouse model separate the transport-limited supply step from a compensatory rise in downstream hexokinase flux.
  - reference: PMID:40405536
    reference_title: "Glut1 Deficiency Syndrome: Novel Pathomechanisms, Current Concepts, and Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Research reaches beyond the concept of brain energy depletion by impaired GLUT1-mediated glucose transfer across the blood-brain barrier. Novel concepts investigate alternative substrates, transport mechanisms, and metabolic interactions of different brain cell types."
    explanation: Recent review frames energy depletion as the canonical model while flagging that astrocyte-neuron metabolic interactions are an active refinement of it.
  downstream:

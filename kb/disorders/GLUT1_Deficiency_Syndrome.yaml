    causal_link_type: DIRECT
    description: >-
      When energy demand rises (sustained exertion) or substrate supply falls
      (fasting), the marginal glucose supply to metabolically expensive basal
      ganglia circuits is transiently exceeded.
    hypothesis_groups:

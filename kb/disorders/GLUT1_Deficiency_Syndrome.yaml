    snippet: "the predominant clinical findings of Glut1DS are paroxysmal eye-head movements, pharmacoresistant seizures of varying types, deceleration of head growth, and developmental delay."
    explanation: GeneReviews documents pharmacoresistant seizures as the predominant early clinical finding reflecting cortical hyperexcitability.
  downstream:

environmental:
- name: Prolonged or strenuous exercise
  description: >-
    Sustained physical exertion is the defining trigger of paroxysmal
    exercise-induced dyskinesia and also aggravates paroxysmal ataxia, weakness
    and seizures. A standardised 6-Minute Walk Test reproducibly provokes
    episodes in long-term follow-up, and exertion sensitivity discriminates
    SLC2A1-positive from SLC2A1-negative patients.
  effect: Triggers paroxysmal dyskinesia and aggravates other paroxysmal events
  exposure_term:
    preferred_term: exposure to prolonged or strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  evidence:
  - reference: PMID:24789115
    reference_title: "Long-term clinical course of Glut1 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 6-Minute Walk Test captured gait disturbances and triggered paroxysmal exertional dyskinesia."
    explanation: A standardised exertion protocol provokes the episodes.
  - reference: PMID:25487684
    reference_title: "Nationwide survey of glucose transporter-1 deficiency syndrome (GLUT-1DS) in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The factors that frequently aggravated these events were hunger, exercise, fever, and fatigue, in that order."
    explanation: Exercise ranked second among aggravating factors in the nationwide cohort.
  influences_mechanisms:
  - target: Exertion- and Fasting-Sensitive Basal Ganglia Energy Failure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Sustained muscular activity raises whole-body and cerebral glucose demand
      beyond what the haploinsufficient transporter can deliver to
      corticostriatal circuits.
    evidence:
    - reference: PMID:18451999
      reference_title: "GLUT1 mutations are a cause of paroxysmal exertion-induced dyskinesias and induce hemolytic anemia by a cation leak."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we propose that the dyskinesias result from an exertion-induced energy deficit that may cause episodic dysfunction of the basal ganglia"
      explanation: The proposed mechanism by which exertion acts on this node.
- name: Fasting and hunger
  description: >-
    Fasting or hunger lowers substrate supply to an already glucose-limited
    brain. Hunger was the most frequent aggravating factor for paroxysmal
    events in the Japanese nationwide cohort, fasting sensitivity discriminates
    SLC2A1-positive patients, and pre-prandial EEG abnormalities improve after
    feeding.
  effect: Exacerbates paroxysmal dyskinesia, seizures and EEG abnormalities
  exposure_term:
    preferred_term: fasting
  notes: >-
    Deliberately left unbound. An ECTO search for fasting, food deprivation and
    starvation returned no exposure term, and the XCO candidates are
    experimental-condition terms rather than exposure events, so no term beats
    a wrong one. Bind when ECTO adds a fasting exposure.
  evidence:
  - reference: PMID:25487684
    reference_title: "Nationwide survey of glucose transporter-1 deficiency syndrome (GLUT-1DS) in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The factors that frequently aggravated these events were hunger, exercise, fever, and fatigue, in that order."
    explanation: Hunger was the leading aggravating factor.
  - reference: PMID:26193382
    reference_title: "From splitting GLUT1 deficiency syndromes to overlapping phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sensitivity to fasting or exertion in combination with those 3 main symptoms were the main differences between mutated and negative patients (p < 0.001)."
    explanation: Fasting sensitivity is a discriminating clinical feature of SLC2A1-positive patients.
  influences_mechanisms:
  - target: Exertion- and Fasting-Sensitive Basal Ganglia Energy Failure
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: Reduced blood glucose availability lowers an already marginal cerebral supply.
    evidence:
    - reference: PMID:23443458
      reference_title: "Phenotypic spectrum of glucose transporter type 1 deficiency syndrome (Glut1 DS)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A clue to the diagnosis in patients with paroxysmal symptoms may be the triggering of episodes during fasting or exercise."
      explanation: Fasting as a trigger of the paroxysmal events produced by this node.
  - target: Neuronal Hyperexcitability and Hypersynchrony
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: Pre-prandial worsening and post-prandial improvement of spike-wave discharges tie network hyperexcitability to the fuel state.
    evidence:
    - reference: PMID:17718830
      reference_title: "GLUT1 deficiency syndrome--2007 update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Electroencephalography (EEG) may show 2.5-4Hz spike-waves improving on food intake."
      explanation: Feeding reverses the electrographic abnormality.
clinical_trials:
- name: NCT02014883
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Open-label phase II study of triheptanoin oil in eight patients with
    Glut1DS aged 7 to 47 years who declined or did not tolerate ketogenic
    diets, with baseline, treatment and withdrawal phases of two months each.
    It reported a 90% reduction in non-epileptic paroxysmal manifestations and
    a normalised brain bioenergetic profile on 31P-NMR. Completion is taken
    from the published results paper rather than from the registry summary.
  target_phenotypes:
  - preferred_term: Paroxysmal dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  evidence:
  - reference: clinicaltrials:NCT02014883
    reference_title: "Phase II Open Label Study Using Triheptanoin in Patients With Glucose Type 1 Transporter Deficiency GLUT1-DS"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this project is to study the efficacy of triheptanoin oil in patients with GLUT1 deficiency syndrome."
    explanation: Registry statement of the trial's objective.
  - reference: PMID:26536893
    reference_title: "Triheptanoin dramatically reduces paroxysmal motor disorder in patients with GLUT1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed an open-label pilot study with three phases of 2 months each (baseline, treatment and withdrawal) in eight patients with GLUT1-DS (7-47 years old) with non-epileptic paroxysmal manifestations."
    explanation: The results paper, which registers this NCT number, describes the trial design and population summarised here.
progression:
- phase: Infancy, epilepsy-dominant phase
  age_range: First months of life to early childhood
  notes: >-
    Seizures with a mean onset around 5 months, paroxysmal eye-head movements,
    developmental delay and deceleration of head growth dominate; 65% of
    classical patients present before 2 years. Seizures improve through
    childhood, particularly on ketogenic diet therapy.
  evidence:
  - reference: PMID:24789115
    reference_title: "Long-term clinical course of Glut1 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy dominated infancy and improved during childhood."
    explanation: Longitudinal cohort defines the infantile epilepsy-dominant phase.
  - reference: PMID:20129935
    reference_title: "Glucose transporter-1 deficiency syndrome: the expanding clinical and genetic spectrum of a treatable disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the classical phenotype (84%), subdivided into early-onset (<2 years) (65%) and late-onset (18%)"
    explanation: Quantifies early versus late onset within the classical phenotype.
- phase: Childhood to adulthood, movement-disorder-dominant phase
  age_range: Later childhood, adolescence and adult life
  notes: >-
    Dystonia and paroxysmal exertion-induced dyskinesia emerge and become the
    dominant manifestations, with ataxia, spasticity, speech difficulty and
    intellectual disability persisting. Longitudinal neurological and
    neuropsychological measures remain stable rather than deteriorating, so the
    condition is chronic but not degenerative, and some individuals shift from
    a classic childhood phenotype to a movement-disorder-predominant adult one.
  evidence:
  - reference: PMID:24789115
    reference_title: "Long-term clinical course of Glut1 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that Glut1 deficiency syndrome is a chronic condition, dominated by epilepsy in infancy and by movement disorders thereafter."
    explanation: Defines the biphasic natural history.
  - reference: PMID:24789115
    reference_title: "Long-term clinical course of Glut1 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All longitudinal outcomes remained stable over time."
    explanation: Stability across a mean of 14.2 years of follow-up.
  - reference: PMID:26193382
    reference_title: "From splitting GLUT1 deficiency syndromes to overlapping phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients evolved from a classic phenotype during early childhood to a movement disorder predominant phenotype at a late childhood/adulthood."
    explanation: Documents the phenotype shift occurring within individuals.
imaging_findings:
- name: Normal or nonspecific brain MRI
  modality: MRI
  description: >-
    Structural neuroimaging is uninformative in Glut1DS. MRI is used to exclude
    structural lesions and other neurometabolic encephalopathies rather than to
    establish the diagnosis.
  diagnostic: false
  evidence:
  - reference: PMID:17718830
    reference_title: "GLUT1 deficiency syndrome--2007 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging is uninformative. Most patients carry heterozygous de novo mutations in the GLUT1 gene"
    explanation: Review of 84 published cases states that neuroimaging does not contribute to diagnosis.
notes: >-
  Lump/split decision (2026-09-05 revision, claim issue #11080). This entry is
  the single Disease record for the SLC2A1 haploinsufficiency spectrum and is
  now anchored to the umbrella term MONDO:0000188, GLUT1 deficiency syndrome.
  Its two MONDO descendants, MONDO:0011724 (encephalopathy due to GLUT1
  deficiency, the classic infantile form) and MONDO:0012805 (childhood-onset
  GLUT1 deficiency syndrome 2, paroxysmal exercise-induced dyskinesia), are
  modelled as has_subtypes rather than as separate entries, because they share
  one molecular lesion and one mechanism chain and differ only in residual
  transporter activity and hence severity; the French national cohort documents
  individual patients crossing between them over time. The earlier version of
  this entry, created 2026-07-06, anchored disease_term to MONDO:0011724, which
  left the umbrella concept uncurated; the re-anchoring retires
  stubs/GLUT1_Deficiency_Syndrome.yaml. Dystonia 9 (DYT9, MONDO:0010983,
  OMIM 601042) was initially listed as a third subtype for completeness of the
  OMIM phenotypic series. It has been folded into the paroxysmal
  exertion-induced dyskinesia subtype instead, because Weber and colleagues
  sequenced SLC2A1 in the original German/Dutch DYT9 pedigree and concluded
  that DYT9 and DYT18 are allelic disorders; listing both as sibling subtypes
  would double-count one concept. MONDO:0010983 is therefore deliberately not
  bound as a subtype_term, and the DYT9 presentation is described within the
  DYT18 subtype, whose description records the additional spastic paraparesis.
  Evidence-policy notes for this pass. PMID:1714544, De Vivo 1991 in the New
  England Journal of Medicine, is the original clinical description but has no
  abstract in PubMed, so it cannot carry a snippet-verified evidence item and
  is acknowledged here rather than cited. PMID:20830593, an acetazolamide
  response letter, likewise has no cached content, so acetazolamide is not
  listed as a treatment; note that GeneReviews lists acetazolamide among the
  anti-seizure medications relatively contraindicated during ketogenic diet
  therapy. Orphanet ORPHA:71277 is not reachable through the structured-source
  cache, so no Orphanet frequency rows are cited. Two PMIDs supplied in the
  curation brief were wrong and were replaced after PubMed verification: Seidner
  1998 was given as 9620772, which is an EXT1 paper, and is actually
  PMID:9462754; Tang 2017 was given as 28211455, which is a physics paper, and
  is actually PMID:28106060. Five HP CURIEs offered by the Perplexity report
  were mislabelled and were not used, namely HP:0011610, HP:0007295, HP:0001942,
  HP:0002211 and HP:0001252 for paroxysmal dyskinesia, exercise-induced
  dyskinesia, hypoglycorrhachia, decreased CSF lactate and epileptic
  encephalopathy; the correct bindings used here are HP:0007166, HP:0011972 and
  HP:0030086. Caffeine avoidance, often mentioned clinically, is not in the
  GeneReviews abstract and is therefore not asserted. Evidence taken from the
  2020 international consensus statement and the 2025 narrative review is
  graded evidence_source OTHER rather than HUMAN_CLINICAL, because those
  documents report expert consensus and synthesis rather than a study cohort.

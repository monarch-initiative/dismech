    term:
      id: GO:1904659
      label: D-glucose transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucose, the essential metabolic fuel for the brain, is transported into the brain exclusively by the protein glucose transporter type 1 (Glut1) across the endothelial cells forming the blood-brain barrier (BBB). Glut1DS results from the inability of Glut1 to transfer sufficient glucose across the BBB to meet the glucose demands of the brain."
    explanation: GeneReviews defines the core defect as insufficient GLUT1-mediated glucose transfer across the blood-brain barrier.
  downstream:
  - target: Cerebral Glucose Energy Deficit
    causal_link_type: DIRECT
    description: >-
      Insufficient transendothelial glucose flux starves brain tissue of its
      principal metabolic substrate, independent of normal peripheral blood
      glucose levels.
    hypothesis_groups:
    - canonical_glut1_energy_deficit
    evidence:
    - reference: PMID:12029447
      reference_title: "Facilitated glucose transporter protein type 1 (GLUT1) deficiency syndrome: impaired glucose transport into brain-- a review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Facilitated glucose transporter protein type 1 (GLUT1) deficiency syndrome (MIM 138140) defines a prototype of a novel group of disorders resulting from impaired glucose transport across blood-tissue barriers."
      explanation: Review frames Glut1DS as the prototypic disorder of impaired glucose transport across blood-tissue barriers, i.e., a cerebral energy-deficit disease.
- name: Cerebral Glucose Energy Deficit
  description: >-
    Chronic under-supply of glucose to neurons and glia produces a state of
    cerebral energy insufficiency during the period of childhood brain
    development when glucose demand is highest, driving neuronal
    hyperexcitability, impaired neurodevelopment, and deceleration of brain (and
    hence head) growth.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Generation of Precursor Metabolites and Energy
    term:
      id: GO:0006091
      label: generation of precursor metabolites and energy
    modifier: DECREASED
  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The needs of the brain for glucose increase rapidly after birth, peaking in early childhood, remaining high until about age 10 years, then gradually decreasing throughout adolescence and plateauing in early adulthood."
    explanation: GeneReviews explains why the cerebral energy deficit is most severe in infancy/early childhood when brain glucose demand peaks, framing the developmental basis of the classic phenotype.
  downstream:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Energy-deficient neurons and cortical circuits become hyperexcitable and
      hypersynchronous, generating the pharmacoresistant seizures characteristic
      of Glut1DS.
    hypothesis_groups:
    - canonical_glut1_energy_deficit
    evidence:
    - reference: PMID:25487684
      reference_title: "Nationwide survey of glucose transporter-1 deficiency syndrome (GLUT-1DS) in Japan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thirty-two patients (97%) exhibited some type of epileptic seizure."
      explanation: Nationwide cohort documents near-universal seizure occurrence, the clinical readout of energy-deficit-driven cortical hyperexcitability.
  - target: Impaired Neurodevelopment and Movement Disorder
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained cerebral energy insufficiency during critical developmental
      windows impairs neurodevelopment and produces a complex movement disorder
      combining ataxia, dystonia, and spasticity, together with deceleration of
      head growth (acquired/progressive microcephaly).
    evidence:
    - reference: PMID:20301603
      reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subsequently children develop complex movement disorders and intellectual disability ranging from mild to severe."
      explanation: GeneReviews documents the progression from early seizures/developmental delay to complex movement disorder and intellectual disability.
- name: Neuronal Hyperexcitability and Hypersynchrony
  description: >-
    Cortical and subcortical neuronal networks deprived of adequate glucose fuel
    become hyperexcitable, producing hypersynchronous discharges that manifest
    as pharmacoresistant seizures of varying semiology. This node conforms to
    the shared epilepsy excitation-inhibition-imbalance final common pathway,
    substituting a metabolic (energy-deficit) upstream driver rather than a
    primary ion-channel lesion.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron

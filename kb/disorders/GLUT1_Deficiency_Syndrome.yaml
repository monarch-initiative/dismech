has_subtypes:
- name: Classic GLUT1 Deficiency Syndrome
  display_name: Classic (Severe, Infantile-Onset) GLUT1 Deficiency Syndrome
  description: >-
    The most common and severe presentation, with onset in infancy to early
    childhood. Predominant clinical findings are paroxysmal eye-head movements,
    pharmacoresistant seizures of varying types, deceleration of head growth,
    and developmental delay, followed by complex movement disorders and
    intellectual disability ranging from mild to severe.
  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When first diagnosed in infancy to early childhood, the predominant clinical findings of Glut1DS are paroxysmal eye-head movements, pharmacoresistant seizures of varying types, deceleration of head growth, and developmental delay."
    explanation: GeneReviews describes the classic infantile-onset presentation as the most common and severe form of Glut1DS.
- name: GLUT1 DS with Paroxysmal Exertion-Induced Dyskinesia
  display_name: GLUT1 Deficiency Syndrome 2 (DYT18 / Paroxysmal Exercise-Induced Dyskinesia)
  description: >-
    A milder, later-onset (childhood) form dominated by paroxysmal dystonic
    attacks of the extremities triggered by prolonged physical exertion, with or
    without epilepsy or hemolytic anemia. Corresponds to OMIM PS612126 / MONDO
    childhood-onset GLUT1 deficiency syndrome 2 (DYT18).
  evidence:
  - reference: PMID:21649651
    reference_title: "Milder phenotypes of glucose transporter type 1 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This paper also shows phenotypical parallels between GLUT1DS and paroxysmal exertion-induced dyskinesia."
    explanation: Directly documents the milder paroxysmal exertion-induced dyskinesia phenotype as part of the GLUT1DS spectrum.
- name: Dystonia 9
  display_name: Dystonia 9 (DYT9 / Episodic Choreoathetosis with Spasticity)
  description: >-
    An autosomal dominant SLC2A1-related dystonia characterized by paroxysmal
    choreoathetosis and progressive spastic paraplegia, with episodes often
    precipitated by alcohol, fatigue, or emotional stress. Corresponds to OMIM
    601042.
  review_notes: >-
    Mapped from MONDO:0010983 (dystonia 9, OMIM:601042), which the MONDO
    definition attributes to heterozygous SLC2A1 mutation. No independently
    quotable PubMed abstract snippet specific to this subtype's natural history
    was identified during curation beyond the MONDO/OMIM cross-reference itself;
    included here for completeness of the OMIM phenotypic series rather than
    with dedicated evidence.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Glut1DS is most commonly caused by a heterozygous SLC2A1 pathogenic variant
    inherited in an autosomal dominant manner. About 90% of individuals have the
    disorder as the result of a de novo SLC2A1 pathogenic variant; about 10%
    have a variant inherited from a parent, whose degree of impairment may be
    mild or nonexistent (possible parental somatic mosaicism). Rare biallelic
    (autosomal recessive) inheritance has also been reported.
  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glut1DS is most commonly caused by a heterozygous SLC2A1 pathogenic variant and inherited in an autosomal dominant manner. About 90% of individuals with Glut1DS have the disorder as the result of a de novo SLC2A1 pathogenic variant; about 10% of individuals have the disorder as the result of a pathogenic variant inherited from a parent."
    explanation: GeneReviews genetic counseling section directly documents autosomal dominant inheritance, predominantly de novo, with a minority of inherited cases.
pathophysiology:
- name: SLC2A1 Loss-of-Function Variant
  description: >-
    Heterozygous (rarely biallelic) pathogenic variants in SLC2A1 reduce the
    amount or function of the GLUT1 facilitative glucose transporter protein,
    typically through haploinsufficiency.
  gene:
    preferred_term: SLC2A1
    term:
      id: hgnc:11005
      label: SLC2A1
  role: trigger
  molecular_functions:
  - preferred_term: D-glucose transmembrane transporter activity
    term:
      id: GO:0055056
      label: D-glucose transmembrane transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:20301603
    reference_title: "Glucose Transporter Type 1 Deficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Glut1DS is established in a proband with suggestive clinical findings, hypoglycorrhachia documented by lumbar puncture, and a (usually) heterozygous pathogenic variant in SLC2A1 identified by molecular genetic testing."
    explanation: GeneReviews establishes heterozygous SLC2A1 pathogenic variants as the molecular cause of Glut1DS.
  - reference: PMID:12029447
    reference_title: "Facilitated glucose transporter protein type 1 (GLUT1) deficiency syndrome: impaired glucose transport into brain-- a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several heterozygous mutations resulting in GLUT1 haploinsufficiency have been identified."
    explanation: Review paper documents the haploinsufficiency mechanism underlying heterozygous SLC2A1 mutations.
  downstream:
  - target: Reduced GLUT1 Transporter Function at the Blood-Brain Barrier
    causal_link_type: DIRECT
    description: >-
      Loss-of-function SLC2A1 variants reduce the density or activity of GLUT1
      transporters expressed on brain microvascular endothelial cells.
    evidence:
    - reference: PMID:12029447
      reference_title: "Facilitated glucose transporter protein type 1 (GLUT1) deficiency syndrome: impaired glucose transport into brain-- a review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is caused by a defect in glucose transport into brain, mediated by the facilitative glucose transporter GLUT1."
      explanation: Directly links the SLC2A1/GLUT1 defect to impaired glucose transport into the brain.
- name: Reduced GLUT1 Transporter Function at the Blood-Brain Barrier
  description: >-
    GLUT1 is the transporter responsible for facilitated glucose diffusion
    across the endothelial cells that form the blood-brain barrier, as well as
    glucose uptake into erythrocytes. Reduced GLUT1 activity impairs the rate at
    which glucose can be delivered from blood to brain, independent of blood
    glucose concentration.
  role: mediator
  cell_types:

diagnosis:
- name: Whole exome sequencing
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: Whole exome sequencing detects biallelic pathogenic variants in SEPSECS to establish the
    molecular diagnosis.
  presence: Positive
  results: Bi-allelic pathogenic SEPSECS mutations.
  evidence:
  - reference: PMID:26888482
    reference_title: Milder progressive cerebellar atrophy caused by biallelic SEPSECS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identified two new families with progressive cerebellar atrophy, and by whole exome sequencing
      detected biallelic SEPSECS mutations: c.356A>G (p.Asn119Ser) and c.77delG (p.Arg26Profs*42) in family
      1, and c.356A>G (p.Asn119Ser) and c.467G>A (p.Arg156Gln) in family 2.'
    explanation: Demonstrates that whole exome sequencing identifies biallelic SEPSECS mutations in affected
      families.
- name: Brain magnetic resonance imaging
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: Brain MRI evaluates cerebellar and cerebral structure and demonstrates progressive cerebellar
    and cerebral atrophy.
  presence: Positive
  results: Progressive cerebellar and cerebral atrophy.
  evidence:
  - reference: PMID:26888482
    reference_title: Milder progressive cerebellar atrophy caused by biallelic SEPSECS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The progression of clinical symptoms in these families is evidently slower than in previously
      reported cases, and the cerebellar atrophy milder by brain MRI, indicating that SEPSECS mutations
      are also involved in milder late-onset cerebellar atrophy.
    explanation: Supports brain MRI for detecting and monitoring cerebellar atrophy in SEPSECS deficiency.

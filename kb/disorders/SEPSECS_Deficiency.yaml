name: SEPSECS Deficiency
creation_date: '2026-07-06T05:15:58Z'
category: Metabolic Disorder
parents:
- Selenoprotein Biosynthesis Disorder
- Trace Element Metabolism Disorder
description: SEPSECS deficiency is an autosomal recessive selenocysteine biosynthesis disorder caused
  by biallelic SEPSECS variants. SEPSECS (O-phosphoseryl-tRNA:selenocysteinyl-tRNA synthase) catalyzes
  the final conversion of Sep-tRNA(Sec) to Sec-tRNA(Sec), the only route to human selenoprotein generation.
  Disruption of this step produces a severe neurodevelopmental and neurodegenerative phenotype, classically
  progressive cerebello-cerebral atrophy or pontocerebellar hypoplasia type 2D, with profound developmental
  delay, microcephaly, hypotonia evolving to spasticity, and progressive cerebellar atrophy.
disease_term:
  preferred_term: SEPSECS deficiency
  term:
    id: MONDO:0013438
    label: pontocerebellar hypoplasia type 2D
synonyms:
- O-phosphoseryl-tRNA(Sec) selenium transferase deficiency
- O-phosphoseryl-tRNA:selenocysteinyl-tRNA synthase deficiency
- SEPSECS-related progressive cerebello-cerebral atrophy
- pontocerebellar hypoplasia type 2D
notes: 'WP-079 seed identifiers: OMIM:613811 and ORPHA:2524. The top-level disease_term is anchored to
  MONDO:0013438 ("pontocerebellar hypoplasia type 2D"), which is the MONDO class for the WP-079 seed record
  OMIM:613811 and is defined as "any non-syndromic pontocerebellar hypoplasia in which the cause of the
  disease is a mutation in the SEPSECS gene" — i.e. the same gene-anchored entity as this entry. The MONDO
  label is the classical imaging-based name; preferred_term keeps the mechanism-first "SEPSECS deficiency"
  wording used throughout this entry.'

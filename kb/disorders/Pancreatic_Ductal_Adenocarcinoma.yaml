    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Metaplastic ducts give rise to PanIN lesions, which accumulate CDKN2A, TP53 and
      SMAD4 loss as they progress from low to high grade. The PanIN stage itself is the
      known intervening step and is not a separate node in this entry.
    evidence:
    - reference: PMID:35176433
      reference_title: Ductal metaplasia in pancreas.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "The development of PDM to atypical hyperplasia is an important risk factor for pancreatic precursors, including intraepithelial neoplasia (PanIN), and pancreatic ductal adenocarcinoma (PDAC)."
      explanation: >-
        Places ductal metaplasia upstream of PanIN and PDAC. PARTIAL because the review
        reaches the precursor lesions rather than the tumour-suppressor losses this
        edge's target models.

  - target: Acinar-to-Ductal Metaplasia
    causal_link_type: DIRECT
    description: >-
      Inflammatory injury drives acinar cells out of their differentiated state and
      into a ductal-like phenotype, which is the metaplastic response this node's
      target models.
    evidence:
    - reference: PMID:17349585
      reference_title: Chronic pancreatitis is essential for induction of pancreatic ductal adenocarcinoma by K-Ras oncogenes in adult mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, if these mice are challenged with a mild form of chronic pancreatitis, they develop the full spectrum of PanINs and invasive PDA."
      explanation: >-
        Inflaming the adult pancreas is what releases the block on the metaplastic and
        neoplastic sequence in KRAS-mutant animals, which is the dependency this edge
        asserts.
  evidence:
  - reference: PMID:17349585
    reference_title: Chronic pancreatitis is essential for induction of pancreatic ductal adenocarcinoma by K-Ras oncogenes in adult mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These observations suggest that, during adulthood, PDA stems from a combination of genetic (e.g., somatic K-Ras mutations) and nongenetic (e.g., tissue damage) events."
    explanation: >-
      States the two-component model directly: the genetic lesion is modeled by the
      KRAS node and the nongenetic tissue-damage component is what this node is for.
  - reference: PMID:35142721
    reference_title: "Chronic Pancreatitis Is a Risk Factor for Pancreatic Cancer, and Incidence Increases With Duration of Disease: A Systematic Review and Meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There is an increased risk of PDAC in patients with CP, and incidence rates increase with CP disease duration."
    explanation: >-
      The human counterpart of the mouse result, with risk rising as the inflammation
      persists. PARTIAL because it measures cancer incidence in inflamed pancreata
      rather than anything at this node itself.
- name: Acinar-to-Ductal Metaplasia
  description: >-
    Differentiated acinar cells transdifferentiate into ductal-like cells. This is the
    predominant form of pancreatic ductal metaplasia and the cellular state in which
    PanIN lesions arise, which places the origin of PDAC in the acinar compartment
    rather than in pre-existing ducts despite the tumour's ductal histology.

review_notes: >-
  From the folded Metastatic_Pancreatic_Adenocarcinoma entry: its
  `environmental:` entry "Chronic pancreatitis" was removed and migrated to
  kb/comorbidities/com_Chronic_Pancreatitis__Pancreatic_Ductal_Adenocarcinoma.yaml
  (dismech#8296, dismech#8551). It is a disease in its own right rather than
  something external to the organism acting on it, so ECTO and XCO have no term
  that could bind it. All of its evidence was carried across.

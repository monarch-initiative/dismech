- name: KRAS Oncogene Activation
  conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation
  description: >-
    Activating KRAS variants favor persistent RAS-GTP signaling through RAF-MEK-ERK and additional
    effector networks, supporting proliferation, survival, metabolic rewiring and microenvironmental
    remodeling. G12D, G12V and G12R are common in PDAC, with allele-specific signaling and inhibitor
    responses. Most PDACs are KRAS-mutant; KRAS-wild-type cancers require separate driver characterization.
    KRAS signaling does not itself establish acquisition of a particular tumor-suppressor mutation
    or therapeutic inhibition.
  evidence:
  - reference: PMID:35302596
    reference_title: Molecular Characterization of KRAS Wild-type Tumors in Patients with Pancreatic Adenocarcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: KRAS mutation (MT) is a major oncogenic driver in pancreatic ductal adenocarcinoma (PDAC).
    explanation: This directly supports KRAS as the central driver pathway in PDAC.
  - reference: DOI:10.3389/fmed.2024.1369136
    reference_title: 'Targeting KRAS mutations in pancreatic cancer: opportunities for future strategies'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In the case of pancreatic ductal adenocarcinomas (PDAC), 90–92% harbor mutations in the oncogene KRAS, triggering canonical MAPK signaling.
    explanation: >-
      Review-level estimate and signaling background; precise frequencies vary by assay and cohort.
  - reference: DOI:10.1093/carcin/bgae064
    reference_title: 'From precursor to cancer: decoding the intrinsic and extrinsic pathways of pancreatic intraepithelial neoplasia progression'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PanIN development begins with Kirsten rat sarcoma viral oncogene (KRAS) mutations
      driving PanIN initiation. Key additional mutations in cyclin-dependent kinase
      inhibitor 2A (CDKN2A), tumor protein p53 (TP53), and mothers against decapentaplegic
      homolog 4 (SMAD4) disrupt cell cycle control and genomic stability, crucial for
      PanIN progression from low-grade to high-grade dysplasia.
    explanation: >-
      This review confirms KRAS mutations as the initiating event in PanIN development,
      with additional tumor suppressor losses driving progression to invasive carcinoma.

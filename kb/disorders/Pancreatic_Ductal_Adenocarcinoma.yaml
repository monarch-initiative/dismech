- name: Extracellular Vesicle-Mediated Immune Escape
  biological_scale: CELLULAR
  description: >-
    PDAC tumor cells secrete extracellular vesicles (exosomes and microvesicles) carrying
    immunomodulatory molecules and tumor-associated signals. The experimentally resolved
    arm of this mechanism is myeloid: PDAC-derived exosomes are taken up by resident
    tissue macrophages (Kupffer cells), which respond by secreting TGF-beta and
    establishing a fibrotic microenvironment that recruits further bone marrow-derived
    macrophages. The exosomal cargo protein macrophage migration inhibitory factor (MIF)
    is required for this reprogramming — blocking it prevents niche formation and
    metastasis — identifying EV cargo transfer as a causal, not merely correlative,
    route by which PDAC conditions host tissue in favor of tumor progression.
  notes: >-
    Deliberately scoped to the macrophage arm. EV-mediated suppression of dendritic cell
    antigen presentation, T cell exhaustion, and microRNA cargo transfer are widely
    proposed for PDAC but are not curated here because no PDAC-specific primary
    experimental evidence was found to support them; the sole EV reference originally
    cited (PPR:PPR1285314) states only the generic "immunomodulatory molecules" framing
    as background, and its own contribution is in-silico candidate prioritization.
  evidence:
  - reference: PMID:25985394
    reference_title: "Pancreatic cancer exosomes initiate pre-metastatic niche formation in the liver."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Uptake of PDAC-derived exosomes by Kupffer cells caused transforming growth factor
      β secretion and upregulation of fibronectin production by hepatic stellate cells.
      This fibrotic microenvironment enhanced recruitment of bone marrow-derived
      macrophages.
    explanation: >-
      Primary experimental evidence that PDAC-derived exosomes are taken up by resident
      macrophages and reprogram them, supporting the macrophage cell-type annotation and
      the TGF-beta production process on this node.
  - reference: PMID:25985394
    reference_title: "Pancreatic cancer exosomes initiate pre-metastatic niche formation in the liver."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that macrophage migration inhibitory factor (MIF) was highly expressed in
      PDAC-derived exosomes, and its blockade prevented liver pre-metastatic niche
      formation and metastasis.
    explanation: >-
      Loss-of-function evidence that a specific exosomal cargo protein is causally
      required, establishing EV cargo transfer rather than mere EV presence as the
      operative mechanism.
  - reference: PPR:PPR1285314
    reference_title: "A dual-layer computational framework for prioritising therapeutic candidates targeting extracellular vesicle-mediated immune escape in pancreatic ductal adenocarcinoma"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Tumour-derived extracellular vesicles (EVs) contribute to PDAC progression by
      transferring immunomodulatory molecules and tumour-associated signals, suggesting
      EV-associated processes as potential intervention opportunities.
    explanation: >-
      Cited only for the general framing that tumor-derived EVs transfer immunomodulatory
      cargo in PDAC. This is the preprint's background statement, not its finding — its
      own contribution is computational candidate prioritization — so it is retained as
      corroborating context alongside, not in place of, the primary evidence above.

    evidence_source: MODEL_ORGANISM
    snippet: These observations suggest that, during adulthood, PDA stems from a combination of genetic (e.g., somatic K-Ras mutations) and nongenetic (e.g., tissue damage) events.
    explanation: >-
      States the two-component model directly: the genetic lesion is modeled by the
      KRAS node and the nongenetic tissue-damage component is what this node is for.
  - reference: PMID:35142721

mechanistic_hypotheses:
- hypothesis_group_id: ras_on_inhibition_immune_tme_remodeling
  hypothesis_label: RAS(ON) Inhibition Remodels the Immunosuppressive Microenvironment
  status: EMERGING
  description: >-
    RAS(ON) multiselective inhibition directly remodels PDAC immunity in mouse models, including
    increased tumor MHC-I, altered myeloid states and T-cell/cDC-dependent responses. Checkpoint
    cotreatment can deepen control, but optimal partners, Treg behavior and durability vary by model.
    Neither universal Treg relief nor clinical daraxonrasib-checkpoint benefit is established. Autophagy
    and FAK are complementary antigen-presentation regulators rather than mutually exclusive alternatives.
  evidence:
  - reference: PMID:40057911
    reference_title: T-cell Dependency of Tumor Regressions and Complete Responses with RAS(ON) Multi-selective Inhibition in Preclinical Models of Pancreatic Ductal Adenocarcinoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In this study, we report that RAS(ON) multi-selective inhibition led to rapid and profound PDAC regressions in immunocompetent mice, decreasing myeloid cells and increasing T cells and macrophages in the tumor microenvironment.
    explanation: >-
      Direct PDAC evidence was omitted from the immune report despite being cited in the resistance
      report.
  - reference: PMID:40057911
    reference_title: T-cell Dependency of Tumor Regressions and Complete Responses with RAS(ON) Multi-selective Inhibition in Preclinical Models of Pancreatic Ductal Adenocarcinoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The depth and duration of tumor regression depended on T cells and conventional dendritic cells.
    explanation: >-
      Depletion/genetic experiments establish immune contribution in mouse PDAC.
  notes: >-
    Both July OpenScientist reports and their updated assessments remain under kb/hypotheses/Metastatic_Pancreatic_Adenocarcinoma
    after consolidation into this disease. PMID40057911 was already available when the immune report
    omitted it; the August 2026 CTLA-4/Treg study is subsequent evidence.
- hypothesis_group_id: ras_on_inhibitor_acquired_resistance
  hypothesis_label: Acquired Resistance to RAS(ON) Multiselective Inhibition
  status: EMERGING
  description: >-
    Daraxonrasib resistance includes clinical mutant-KRAS amplification and other RAS-pathway alterations,
    with preclinical and limited clinical support for RTK bypass, MYC-related programs and allele-specific
    cyclophilin-A or EGFR/wild-type-RAS routes. The 44-patient paired ctDNA study updates the July
    report: patient mechanisms are no longer wholly unknown, but selected-cohort frequencies, non-genomic
    routes, pre-existing versus newly selected clones and optimal salvage remain unresolved. Distinct
    inhibitor classes and combination regimens must be kept explicit.
  evidence:
  - reference: PMID:42581230
    reference_title: Acquired resistance to the RAS(ON) multi-selective inhibitor daraxonrasib guides rational combination therapy strategies in pancreatic cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report mechanisms of acquired resistance to daraxonrasib monotherapy observed through targeted sequencing of over 800 genes in paired pretreatment and end of treatment circulating tumor DNA samples from 44 patients in the phase 1/2 clinical trial.
    explanation: >-
      August 2026 paired clinical sequencing supersedes the July reports and earlier assessment claim
      that no longitudinal clinical characterization was available.
  - reference: PMID:42581230
    reference_title: Acquired resistance to the RAS(ON) multi-selective inhibitor daraxonrasib guides rational combination therapy strategies in pancreatic cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment-emergent genomic alterations in the RAS signaling pathway were observed in more than half (26 of 44; 59%) of these patients, including, most notably, mutant KRAS amplifications in one-third (16 of 44; 36%), as well as alterations in receptor tyrosine kinase (RTK) (4 of 44; 9%), MAPK (11 of 44; 25%) and PI3K (4 of 44; 9%) pathways.
    explanation: >-
      Frequencies apply to 44 profiled patients with prior disease control followed by progression,
      not all treated PDAC patients; categories overlap.
diagnosis:
- name: Pancreatic-Protocol Cross-Sectional Imaging
  description: >-
    Multiphasic contrast-enhanced CT establishes lesion anatomy, vascular involvement and metastatic
    extent. MRI is an alternative or problem-solving examination; resectability requires multidisciplinary
    interpretation.
  evidence:
  - reference: PMID:41067164
    reference_title: Pan-Asian adapted ESMO Clinical Practice Guidelines for the diagnosis, treatment and follow-up of patients with pancreatic cancer.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Multiphasic contrast-enhanced thoracic-abdominal and pelvic CT, including late arterial phase and portal venous phase, should be used as the first-line imaging modality for suspected pancreatic cancer
    explanation: >-
      Defines first-line diagnostic imaging.
- name: Tissue Diagnosis
  description: >-
    Cytology or biopsy, preferably by endoscopic-ultrasound guidance where appropriate, confirms
    malignancy before systemic therapy. Tissue morphology and clinical imaging must be reconciled
    with the differential diagnosis.
  evidence:
  - reference: PMID:41067164
    reference_title: Pan-Asian adapted ESMO Clinical Practice Guidelines for the diagnosis, treatment and follow-up of patients with pancreatic cancer.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cytology or biopsy proof of pancreatic cancer should be obtained before initiation of ChT in localised disease, preferably by EUS guidance
    explanation: >-
      Specifies tissue confirmation before chemotherapy.
- name: Germline and Tumor Molecular Testing
  description: >-
    Inherited susceptibility testing and tumor profiling identify clinically relevant BRCA, mismatch-repair
    and other actionable alterations. KRAS-wild-type tumors particularly warrant a search for alternative
    drivers, including fusions; the result must match the treatment-specific evidence.
  evidence:
  - reference: PMID:41067164
    reference_title: Pan-Asian adapted ESMO Clinical Practice Guidelines for the diagnosis, treatment and follow-up of patients with pancreatic cancer.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: BRCA genetic testing should be offered to all patients with metastatic pancreatic cancer
    explanation: >-
      Supports germline testing in metastatic disease.
animal_models:
- name: Immunocompetent Mouse PDAC RAS-Inhibition Models
  species: Mouse
  genotype: KRAS-driven autochthonous and syngeneic PDAC systems
  description: >-
    RMC-7977 and daraxonrasib experiments test tumor regression, immune-cell changes and immunotherapy
    combinations in immunocompetent PDAC. Results depend on regimen and tumor/host model and do not
    establish patient immune pharmacodynamics.
  publication: PMID:40057911
  modeled_mechanisms:
  - target: Immunosuppressive TME Reversibility under RAS(ON) Inhibition
    relationship: PERTURBS
    description: Measures immune remodeling and depletion-defined immune contribution.
    limitations: Mouse immune ecosystems and drug exposures differ from human metastatic disease.
  evidence:
  - reference: PMID:40057911
    reference_title: T-cell Dependency of Tumor Regressions and Complete Responses with RAS(ON) Multi-selective Inhibition in Preclinical Models of Pancreatic Ductal Adenocarcinoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In this study, we report that RAS(ON) multi-selective inhibition led to rapid and profound PDAC regressions in immunocompetent mice, decreasing myeloid cells and increasing T cells and macrophages in the tumor microenvironment.
    explanation: >-
      Direct PDAC evidence was omitted from the immune report despite being cited in the resistance
      report.
- name: KPC RMC-7977 Acquired-Resistance Models
  species: Mouse
  genotype: Kras/Trp53-driven genetically engineered pancreatic cancer
  description: >-
    Chronic RMC-7977 exposure produces initially responding and subsequently relapsing KPC tumors.
    MYC and YAP/TEAD programs were interrogated; tool-compound models and clinical daraxonrasib cohorts
    have different resistance distributions.
  publication: PMID:38588697
  modeled_mechanisms:
  - target: MYC Amplification-Driven RAS-Independent Proliferation
    relationship: PERTURBS
    description: Tracks relapse-associated MYC amplification and downstream bypass.
    limitations: Selected mouse tumors do not estimate patient route prevalence.
  evidence:
  - reference: PMID:38588697
    reference_title: Tumour-selective activity of RAS-GTP inhibition in pancreatic cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Analysis of relapsed tumours identified Myc copy number gain as a prevalent candidate resistance mechanism, which could be overcome by combinatorial TEAD inhibition in vitro.
    explanation: >-
      Primary 2024 RMC-7977 study supplies stronger support than the systematic review cited by OpenScientist.
experimental_models:
- name: Human PDAC Cell and Organoid RAS-Response Models
  experimental_model_type: ORGANOID
  description: >-
    Patient-derived PDAC organoids and established cell models permit driver-specific RMC-7977 sensitivity
    assays; engineered and selected cell models test bypass mechanisms. These isolated epithelial
    systems do not reproduce the complete immune or desmoplastic microenvironment.
  publication: PMID:38588697
  modeled_mechanisms:
  - target: KRAS Oncogene Activation
    relationship: PERTURBS
    description: Tests RAS-GTP-inhibitor signaling and growth response.
    limitations: Cell viability and target phosphorylation are not patient response or immune-remodeling endpoints.
  evidence:
  - reference: PMID:38588697
    reference_title: Tumour-selective activity of RAS-GTP inhibition in pancreatic cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: RMC-7977 exhibited low nanomolar potency on the viability of most human and mouse PDAC cell lines and human PDAC organoids
    explanation: >-
      Direct cell and organoid assays establish activity with subtype/driver variation, not whole-organism
      immunity.

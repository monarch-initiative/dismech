name: Pancreatic Ductal Adenocarcinoma
creation_date: '2026-03-06T00:00:00Z'
description: >-
  Pancreatic ductal adenocarcinoma (PDAC) is a malignant pancreatic epithelial neoplasm with ductal
  differentiation. Most tumors harbor an activating KRAS mutation together with alterations in tumor-suppressor
  pathways, but KRAS-wild-type tumors include distinct actionable drivers. Acinar reprogramming,
  ductal-origin models and several precursor lesions contribute to current initiation models; ductal
  morphology does not establish a unique human cell of origin. Desmoplastic fibroblast states, myeloid
  and lymphoid suppression, altered antigen presentation, nutrient scavenging and metabolic adaptation
  shape invasion and treatment response. Resectability and metastatic extent determine clinical management.
  Surgery with systemic therapy offers potential long-term control in selected localized disease;
  advanced disease is treated with systemic regimens and, in defined molecular subsets, targeted
  or immune therapies. Daraxonrasib has randomized clinical efficacy in previously treated metastatic
  PDAC. Its resistance mechanisms now have paired clinical ctDNA evidence, whereas immune-remodeling/checkpoint
  combinations remain preclinical.
categories:
- Solid Tumor
- Gastrointestinal Cancer
- Adenocarcinoma
parents:
- pancreatic cancer
has_subtypes:
- name: Classical Subtype
  description: >-
    An expression program enriched for epithelial differentiation. Classical and basal-like states
    can coexist within a tumor; bulk-expression assignments do not imply immutable, mutually exclusive
    diseases. The original virtual-microdissection cohorts associated classical tumors with better
    survival than basal-like tumors.
  evidence:
  - reference: PMID:26343385
    reference_title: Virtual microdissection identifies distinct tumor- and stroma-specific subtypes of pancreatic ductal adenocarcinoma.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      we have identified and validated two tumor subtypes, including a 'basal-like'
      subtype that has worse outcome and is molecularly similar to basal tumors in
      bladder and breast cancers.
    explanation: >-
      Moffitt et al. used virtual microdissection of gene expression data to identify
      classical and basal-like subtypes of PDAC, with classical having better prognosis.
- name: Basal-like Subtype
  description: >-
    A basal/squamous expression program associated with adverse outcome in the original profiling
    cohorts. State abundance and plasticity vary within tumors and under treatment. In autochthonous
    mouse PDAC, basal-state ablation or basal-cell GM-CSF loss disrupted an immunosuppressive circuit
    and reduced tumors; this is not yet a validated human state-selective treatment.
  evidence:
  - reference: PMID:26343385
    reference_title: Virtual microdissection identifies distinct tumor- and stroma-specific subtypes of pancreatic ductal adenocarcinoma.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      patients with basal-like subtype tumors had an overall worse median survival of
      11 months and 44% 1-year survival compared to 19 months and 70% 1-year survival
      for those with classical subtype tumors
    explanation: >-
      Moffitt et al. demonstrated basal-like subtype has significantly worse survival
      compared to classical subtype in PDAC.
  - reference: PMID:42523238
    reference_title: The basal cell state maintains pancreatic cancers by controlling an immunosuppressive circuit.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Knockout of a single cytokine, GM-CSF, specifically in basal cells recapitulated macrophage repolarization and lymphocyte recruitment observed upon basal state ablation and shrank tumors.
    explanation: >-
      Basal-cell-specific genetic perturbation establishes an immune-organizing GM-CSF role in mouse
      PDAC. Human prognostic association does not establish the same intervention effect.
stages:
- name: Resectable
  description: >-
    Localized disease judged technically resectable by multidisciplinary pancreatic-protocol imaging
    and clinical assessment. Pancreaticoduodenectomy or distal pancreatectomy is selected by location;
    postoperative systemic therapy is standard for suitable patients.
- name: Borderline Resectable
  description: >-
    Localized disease with a high risk of margin-positive resection, commonly related to vascular
    involvement. Induction therapy and reassessment guide consideration of surgery.
  evidence:
  - reference: PMID:41067164
    reference_title: Pan-Asian adapted ESMO Clinical Practice Guidelines for the diagnosis, treatment and follow-up of patients with pancreatic cancer.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Patients with borderline resectable pancreatic cancer have a high probability of an R1 resection and should be considered for induction treatment
    explanation: >-
      Consensus recommendation links borderline resectability to margin risk and induction treatment.
- name: Locally Advanced
  description: >-
    Nonmetastatic disease with local involvement precluding upfront resection. Systemic treatment,
    symptom care and reassessment for selected local approaches are appropriate.
- name: Metastatic
  description: >-
    Distant spread, commonly to liver, peritoneum or lung, requires systemic and supportive care.
    The metastasis, RAS-inhibitor resistance and immune-remodeling mechanisms belong to this PDAC
    model rather than a separate disease.
pathophysiology:
- name: Chronic Pancreatic Inflammation
  conforms_to: tumor_promoting_inflammation#Chronic Inflammatory Stimulus
  description: >-
    Inflammation and tissue injury can cooperate with oncogenic KRAS to enable acinar reprogramming
    and precursor formation. In one adult acinar/centroacinar KRAS-G12V mouse model, chronic pancreatitis
    was necessary for tumor induction. This is a model-specific requirement, not a claim that every
    human PDAC requires clinically recognized pancreatitis. Human chronic pancreatitis is a strong
    risk factor with risk estimates dependent on follow-up and case definition.

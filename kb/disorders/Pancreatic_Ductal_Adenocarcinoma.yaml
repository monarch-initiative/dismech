- name: PDAC CAF-Mediated Invasion PhysiCell Model
  description: >-
    Grammar-based PhysiCell agent-based model of pancreatic ductal adenocarcinoma neoplastic cells
    and cancer-associated fibroblasts. The model encodes fibroblast-mediated invasion, epithelial-mesenchymal
    state switching, and ECM-dependent motility tradeoffs using human-interpretable cell rules informed
    by PDAC spatial transcriptomics and coculture data.
  model_type: AGENT_BASED
  repository_url: https://github.com/PhysiCell-Models/grammar_samples/tree/v2.0.1/user_projects/epi_caf_invasion
  model_id: grammar_samples:v2.0.1/user_projects/epi_caf_invasion

biochemical:
- name: CA 19-9
  evidence:
  - reference: PMID:23331006
    reference_title: "The clinical utility of CA 19-9 in pancreatic adenocarcinoma: diagnostic and prognostic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 57 studies involving 3,285 pancreatic carcinoma cases, the combined
      sensitivity of CA 19-9 was 78.2% and in 37 studies involving 1,882 cases with
      benign pancreatic disease the specificity of CA 19-9 was 82.8%.
    explanation: >-
      Poruk et al. meta-analysis established CA 19-9 sensitivity of 78.2% and
      specificity of 82.8% for pancreatic carcinoma diagnosis.
  notes: >-
    Carbohydrate antigen 19-9 (CA 19-9) is the most widely used serum biomarker for
    PDAC. Elevated in approximately 80% of patients with PDAC. Used for monitoring
    treatment response and detecting recurrence, though not sufficiently sensitive
    or specific for screening.
- name: Carcinoembryonic Antigen (CEA)
  evidence:
  - reference: PMID:23331006
    reference_title: "The clinical utility of CA 19-9 in pancreatic adenocarcinoma: diagnostic and prognostic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From the combined analysis of studies reporting CEA, the sensitivity was
      44.2% (1,324 cases) and the specificity was 84.8% (656 cases).
    explanation: >-
      Poruk et al. meta-analysis showed CEA has lower sensitivity (44.2%) than
      CA 19-9 but comparable specificity (84.8%) for pancreatic carcinoma.
  notes: >-
    CEA may be elevated in PDAC and is sometimes used as an adjunct to CA 19-9 for
    monitoring, though it is less specific.
genetic:
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  association: Somatic Gain-of-Function Mutation
  inheritance:
  - name: Somatic
  evidence:
  - reference: PMID:33347393
    reference_title: 'Clinical Effect of Driver Mutations of KRAS, CDKN2A/P16, TP53, and SMAD4 in Pancreatic Cancer: A Meta-Analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This systematic review and meta-analysis supports the use of driver mutations in the P53, SMAD4, and KRAS genes as prognostic markers for pancreatic cancer.
    explanation: Directly supports KRAS as an established driver mutation and prognostic marker in pancreatic cancer.
  - reference: DOI:10.3389/fmed.2024.1369136
    reference_title: "Targeting KRAS mutations in pancreatic cancer: opportunities for future strategies"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the case of pancreatic ductal adenocarcinomas (PDAC), 90-92% harbor mutations
      in the oncogene KRAS, triggering canonical MAPK signaling. The smooth structure
      of the altered KRAS protein without a binding pocket and its affinity for GTP have,
      in the past, hampered drug development.
    explanation: >-
      Confirms KRAS mutations in 90-92% of PDAC and describes the structural challenges
      that have historically hampered therapeutic targeting of KRAS.
  notes: >-
    KRAS (12p12.1) activating mutations are present in approximately 90% of PDAC.
    The most common mutations are G12D (~40%), G12V (~30%), and G12R (~15%).
    KRAS mutations are considered the initiating oncogenic event and occur in
    pancreatic intraepithelial neoplasia (PanIN) precursor lesions.
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: Somatic Loss-of-Function Mutation
  inheritance:
  - name: Somatic
  evidence:
  - reference: PMID:37404765
    reference_title: "Genomic landscape of clinically advanced KRAS wild-type pancreatic ductal adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the KRAS mutated group had a significantly higher percentage of TP53
      (mutated vs wild-type: 80.2% vs 47.6%, p <0.0001)
    explanation: >-
      Foundation Medicine genomic profiling of 9,444 advanced PDAC cases showed TP53
      mutations in 80.2% of KRAS-mutated PDAC.
  notes: >-
    TP53 (17p13.1) is mutated in approximately 75% of PDAC. Loss of TP53
    function disables cell cycle checkpoints and apoptotic responses to DNA
    damage, cooperating with KRAS to drive malignant transformation.
- name: SMAD4
  gene_term:
    preferred_term: SMAD4
    term:
      id: hgnc:6770
      label: SMAD4
  association: Somatic Loss-of-Function Mutation
  inheritance:
  - name: Somatic
  evidence:
  - reference: PMID:37404765
    reference_title: "Genomic landscape of clinically advanced KRAS wild-type pancreatic ductal adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMAD4 (mutated vs wild-type: 26.8% vs 15.7%, p <0.0001)
    explanation: >-
      Foundation Medicine profiling showed SMAD4 mutations in 26.8% of KRAS-mutated
      PDAC. Higher rates reported in other studies reflect inclusion of homozygous
      deletions not captured by all assays.
  notes: >-
    SMAD4 (18q21.2) is inactivated in approximately 55% of PDAC through
    homozygous deletion or intragenic mutation. Loss of SMAD4 disrupts
    TGF-beta tumor-suppressive signaling and is associated with widespread
    metastatic disease.
- name: CDKN2A
  gene_term:
    preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  association: Somatic Loss-of-Function Mutation
  inheritance:
  - name: Somatic
  evidence:
  - reference: PMID:18772397
    reference_title: Core signaling pathways in human pancreatic cancers revealed by global genomic analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This list includes the classic tumor suppressor genes CDKN2A (p16), SMAD4, and TP53, as well as genes that had not previously been implicated in pancreatic cancer development.
    explanation: Directly identifies CDKN2A/p16 as a classic tumor suppressor gene affected by homozygous deletion in pancreatic cancers.
  - reference: PMID:37404765
    reference_title: "Genomic landscape of clinically advanced KRAS wild-type pancreatic ductal adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CDKN2A (mutated vs wild-type: 56.2% vs 34.4%, p <0.0001)
    explanation: >-
      Foundation Medicine profiling showed CDKN2A alterations in 56.2% of KRAS-mutated
      PDAC. Higher rates in other studies include epigenetic silencing.
  notes: >-
    CDKN2A (9p21.3) encoding p16INK4a is inactivated in up to 90% of PDAC
    through homozygous deletion, mutation, or promoter methylation. Loss of
    p16 removes CDK4/6-mediated cell cycle inhibition.
- name: BRCA2
  gene_term:
    preferred_term: BRCA2
    term:
      id: hgnc:1101
      label: BRCA2
  association: Germline and Somatic Mutation
  inheritance:
  - name: Somatic
  evidence:
  - reference: PMID:31157963
    reference_title: "Maintenance Olaparib for Germline BRCA-Mutated Metastatic Pancreatic Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with a germline BRCA1 or BRCA2 mutation make up a small subgroup of
      those with metastatic pancreatic cancer. The poly(adenosine diphosphate-ribose)
      polymerase (PARP) inhibitor olaparib has had antitumor activity in this population.
    explanation: >-
      The POLO trial confirmed that BRCA-mutated PDAC patients represent a distinct
      subgroup that responds to PARP inhibition, validating the clinical relevance
      of BRCA2 mutations in PDAC.
  notes: >-
    BRCA2 germline mutations confer increased risk of PDAC and are found in
    approximately 5-7% of familial cases. BRCA2-deficient tumors have
    homologous recombination deficiency and may respond to platinum-based
    chemotherapy and PARP inhibitors.
environmental:
- name: Tobacco Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: KRAS Oncogene Activation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pointed at the node this entry calls the initiating oncogenic event,
      because that is where a carcinogen exposure enters the graph. The route
      is left unknown deliberately: this entry's own description proposes that
      tobacco carcinogens promote KRAS mutations, but no cited sentence says
      so. The second item is carried precisely because it limits the first,
      and the limit is easy to miss: the headline relative risk is for
      pancreatic diseases as a class, and the same abstract reports that
      tobacco's effect on pancreatitis is larger than its effect on pancreatic
      cancer.
    evidence:
    - reference: PMID:24509242
      reference_title: "Factors that affect risk for pancreatic disease in the general population: a systematic review and meta-analysis of prospective cohort studies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Current tobacco use was the single most important risk factor for pancreatic diseases (RR, 1.87; 95% CI, 1.54-2.27), followed by obesity (RR, 1.48; 95% CI, 1.15-1.92) and heavy use of alcohol (RR, 1.37; 95% CI, 1.19-1.58)"
      explanation: >-
        Meta-analysis of 51 prospective cohorts giving tobacco the largest
        relative risk of the factors examined. Quoted whole so the comparison
        with obesity and alcohol travels with it. The outcome is pancreatic
        diseases, not this node.
    - reference: PMID:24509242
      reference_title: "Factors that affect risk for pancreatic disease in the general population: a systematic review and meta-analysis of prospective cohort studies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Tobacco and heavy use of alcohol had bigger effects on risk of acute pancreatitis and chronic pancreatitis than pancreatic cancer"
      explanation: >-
        The same abstract's own qualifier: the tobacco effect is larger for
        acute and chronic pancreatitis than for pancreatic cancer. Carried
        here so the headline figure is not read as a cancer-specific estimate.
  - target: Chronic Pancreatic Inflammation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The second link, added once the entry had an inflammation node to receive it.
      This is where the cited meta-analysis's evidence is actually strongest: the
      qualifier that limits the KRAS link above - that tobacco's effect on
      pancreatitis exceeds its effect on pancreatic cancer - is direct support here.
      The route from smoke constituents to pancreatic inflammation is not traced by
      the abstract, so the intermediates stay unknown.
    evidence:
    - reference: PMID:24509242
      reference_title: "Factors that affect risk for pancreatic disease in the general population: a systematic review and meta-analysis of prospective cohort studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Tobacco and heavy use of alcohol had bigger effects on risk of acute pancreatitis and chronic pancreatitis than pancreatic cancer"
      explanation: >-
        Names chronic pancreatitis as an outcome on which tobacco acts more strongly
        than on the cancer, which is the node this link targets.
  description: >-
    Cigarette smoking is the most well-established modifiable risk factor for PDAC,
    approximately doubling the risk. Tobacco carcinogens are metabolized in the
    pancreas and may promote KRAS mutations.
  evidence:
  - reference: PMID:34002083
    reference_title: 'Pancreatic cancer epidemiology: understanding the role of lifestyle and inherited risk factors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: there are key modifiable risk factors for pancreatic cancer such as cigarette smoking, obesity, diabetes and alcohol intake.
    explanation: Directly identifies cigarette smoking as a leading modifiable risk factor for pancreatic cancer.
  - reference: PMID:24509242
    reference_title: "Factors that affect risk for pancreatic disease in the general population: a systematic review and meta-analysis of prospective cohort studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current tobacco use was the single most important risk factor for pancreatic
      diseases (RR, 1.87; 95% CI, 1.54-2.27)
    explanation: >-
      Meta-analysis of 51 population-based prospective cohort studies
      identified tobacco use as the single most important modifiable risk
      factor for pancreatic diseases with an RR of 1.87. The outcome measured
      is pancreatic diseases as a class, and the same abstract reports that
      tobacco has a bigger effect on acute and chronic pancreatitis than on
      pancreatic cancer, so this figure is not a cancer-specific estimate.
- name: Chronic Pancreatitis
  influences_mechanisms:
  - target: Chronic Pancreatic Inflammation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Retargeted from KRAS Oncogene Activation once this entry modeled the
      inflammation it acts on. Nothing intervenes: sustained pancreatic inflammation
      is what chronic pancreatitis is, so this is the one link in the block where the
      exposure and the node it reaches are the same process rather than separated by
      an untraced route.
    evidence:
    - reference: PMID:35142721
      reference_title: "Chronic Pancreatitis Is a Risk Factor for Pancreatic Cancer, and Incidence Increases With Duration of Disease: A Systematic Review and Meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "There is an increased risk of PDAC in patients with CP, and incidence rates increase with CP disease duration."
      explanation: >-
        Cancer specific and dose-responsive, which is why it is the strongest of the
        three exposures here. PARTIAL because it measures cancer incidence rather
        than the inflammation this link targets.
    - reference: PMID:17349585
      reference_title: Chronic pancreatitis is essential for induction of pancreatic ductal adenocarcinoma by K-Ras oncogenes in adult mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, if these mice are challenged with a mild form of chronic pancreatitis, they develop the full spectrum of PanINs and invasive PDA."
      explanation: >-
        The experimental counterpart: inducing chronic pancreatitis is what supplies
        the inflammatory state this link targets, and doing so is sufficient to
        release the neoplastic sequence in KRAS-mutant animals.
  description: >-
    Long-standing chronic pancreatitis increases PDAC risk approximately 10-15 fold.
    Chronic inflammation promotes ductal cell proliferation and accumulation of
    oncogenic mutations.
  notes: >-
    Chronic pancreatitis is a disease state rather than an exposure, so this entry
    sits in the class of `environmental:` items discussed in issue #8185. The
    comorbidity now exists --
    `kb/comorbidities/com_Chronic_Pancreatitis__Pancreatic_Ductal_Adenocarcinoma.yaml`,
    added in dismech#8296 -- and this row is deliberately kept rather than folded
    into it, which resolves the open question this note previously recorded.

    The two divide the labour. This row carries the mechanistic route into the
    pathograph: the `influences_mechanisms` link onto Chronic Pancreatic
    Inflammation, with the KRAS-mutant mouse experiment that shows inducing
    pancreatitis is sufficient to release the neoplastic sequence. A comorbidity
    entry has no pathograph link to offer, so folding this row in would lose that.
    The comorbidity carries the disease-disease epidemiology as a directed,
    queryable A_BEFORE_B risk edge with a magnitude. Both cite PMID:35142721;
    the comorbidity additionally carries the 1993 cohort standardized incidence
    ratio, which this row does not need.
  evidence:
  - reference: PMID:35142721
    reference_title: "Chronic Pancreatitis Is a Risk Factor for Pancreatic Cancer, and Incidence Increases With Duration of Disease: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is an increased risk of PDAC in patients with CP, and incidence rates
      increase with CP disease duration.
    explanation: >-
      Gandhi et al. meta-analysis demonstrated a 22.6-fold increased risk of PDAC
      in chronic pancreatitis patients, with risk persisting after excluding
      surveillance bias.

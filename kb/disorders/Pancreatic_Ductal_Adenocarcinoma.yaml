- name: PDAC Immunotherapy PhysiCell Model
  description: >-
    Grammar-based PhysiCell agent-based PDAC tumor-immune model initialized from PDAC tissue compositions.
    The model simulates combination therapy with GVAX, nivolumab, and urelumab across heterogeneous
    baseline microenvironment states using explicit cell-state and interaction rules.

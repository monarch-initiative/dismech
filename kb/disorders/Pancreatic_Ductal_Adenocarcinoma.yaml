- name: Acinar-to-Ductal Metaplasia
  description: >-
    Acinar cells can lose differentiated identity and adopt ductal-like programs during injury and
    KRAS-driven transformation. ADM is reversible in regenerative settings and is not synonymous
    with cancer. Persistent oncogenic signaling can channel reprogrammed cells into PanIN. Adult
    ductal cells can also initiate PDAC with cooperating p53 alterations in mice; the relative contribution
    of these origins in humans remains unresolved.

- name: Calcineurin-NFAT and Akt Signaling Activation
  biological_scale: CELLULAR
  role: intermediate
  description: >-
    Chronically paced cardiomyocytes expressing dominant thin-filament DCM
    mutations, including TNNI3 K36Q, show dephosphorylation and nuclear
    translocation of NFAT with concordant Akt phosphorylation, and no change in ERK
    activation. This is the link between an altered myofilament and a transcriptional
    remodeling program: the mutant sarcomere does not merely contract badly, it
    changes the calcium-dependent signalling that instructs the cell to remodel.
    Note that NFAT activation is not specific to the dilated direction — it is also
    a hypertrophic cardiomyopathy hallmark — so this node is a shared remodeling
    entry point rather than a discriminating feature of CMD1FF.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Calcineurin-NFAT signaling cascade
    term:
      id: GO:0033173
      label: calcineurin-NFAT signaling cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:32618513
    reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also observe dephosphorylation and nuclear translocation of the nuclear
      factor of activated T cells (NFAT), with concordant RAC-α-serine/threonine
      protein kinase (Akt) phosphorylation but no change to extracellular
      signal-regulated kinase activation in chronically paced cardiomyocytes
      expressing DCM mutations.
    explanation: >-
      Supplies the specific signalling readout this node asserts, in cardiomyocytes
      carrying the CMD1FF allele among others.
  downstream:
  - target: Adverse Ventricular Remodeling
    causal_link_type: DIRECT
    hypothesis_groups:
    - tnni3_ad_altered_thin_filament_regulation

- name: Adverse Ventricular Remodeling
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  biological_scale: TISSUE
  role: central_effector
  description: >-
    Sustained contractile inefficiency and the remodeling signalling it drives
    convert a molecular lesion into a structurally altered ventricle: cardiomyocyte
    loss by apoptosis, interstitial fibrosis from activated cardiac fibroblasts,

genetic:
- name: TNNI3 Heterozygous Function-Altering Variants
  association: Heterozygous Missense and Truncating Variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TNNI3
    term:
      id: hgnc:11947
      label: TNNI3
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: CGGV:assertion_668087ea-0d2f-42c2-a291-f73400d34023-2025-04-18T160000.000Z
      reference_title: "TNNI3 / dilated cardiomyopathy (Strong)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong
      explanation: >-
        ClinGen records AD as the mode of inheritance for this TNNI3-DCM
        gene-disease relationship, separately from its AR assertion.
  features: >-
    CMD1FF genotypes are monoallelic. The founding alleles are missense (Lys36Gln
    in the N-terminal region, Asn185Lys in the C-terminal region), each segregating
    with severe early-onset familial disease and each shown to alter thin-filament
    calcium regulation on reconstitution. A heterozygous truncating allele
    (p.98trunc) has additionally been characterized in explanted human myocardium
    and behaves as pure haploinsufficiency rather than as an altered-function
    allele. A TNNI3 variant list cannot be interpreted without its zygosity and
    variant class: the same gene's heterozygous missense alleles more commonly
    cause hypertrophic (CMH7) and restrictive (RCM1) cardiomyopathy, and its
    biallelic null genotypes cause the recessive infantile entity CMD2A. Note that
    the p.Arg98* nonsense allele appears on both sides of that line — homozygous in
    reported CMD2A patients, and studied heterozygously as a haploinsufficient DCM
    allele — so allele identity alone does not assign an entity.
  variants:
  - name: TNNI3 p.Lys36Gln (K36Q)
    description: >-
      N-terminal missense allele, one of the two founding CMD1FF variants.
      Reconstituted troponin carrying it gives reduced maximum ATPase and reduced
      calcium sensitivity, and thin filaments containing it lose the normal
      coupling between calcium sensitivity and troponin I phosphorylation. It is
      also the allele carried into the isolated-cardiomyocyte studies that
      demonstrate reduced fractional shortening, suppressed systolic calcium, and
      NFAT activation, making it the best functionally characterized CMD1FF
      variant.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
    evidence:
    - reference: PMID:19590045
      reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report 2 novel TNNI3 missense mutations, Lys36Gln and Asn185Lys, each
        associated with severe and early onset familial DCM.
      explanation: >-
        Identifies this allele and its association with severe early-onset familial
        dilated cardiomyopathy.
  - name: TNNI3 p.Asn185Lys (N185K)
    description: >-
      C-terminal missense allele, the second founding CMD1FF variant, segregating
      with severe early-onset familial dilated cardiomyopathy and producing the
      same reduced-ATPase, reduced-calcium-sensitivity signature on reconstitution.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
    evidence:
    - reference: PMID:19590045
      reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analysis of Ca(2+) regulation of actin-tropomyosin-activated myosin ATPase
        by troponin revealed that troponin reconstituted with either mutant
        troponin I gave lower maximum ATPase rates and lower Ca(2+) sensitivity
        than wild type.
      explanation: >-
        Records the functional consequence measured for both founding alleles,
        including this one. Classified IN_VITRO because it is a reconstituted
        protein assay.
  - name: TNNI3 p.98trunc (heterozygous)
    description: >-
      Heterozygous truncating allele studied in explanted left ventricular tissue
      from a transplanted DCM patient. Troponin I fell to 39% of control with
      distorted subunit stoichiometry, and exchange with recombinant wild-type
      troponin restored protein levels and normalized the functional deficits. It
      is the evidence that haploinsufficiency, not only altered function, is a
      route to dominant TNNI3 dilated cardiomyopathy.
    gene:
      preferred_term: TNNI3
      term:
        id: hgnc:11947
        label: TNNI3
    evidence:
    - reference: DOI:10.1113/jp274145
      reference_title: Genotype-specific pathogenic effects in human dilated cardiomyopathy
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Exchange with wild‐type troponin complex corrected troponin protein
        levels to 83% of controls in the TNNI3p.98trunc sample.
      explanation: >-
        The exchange experiment establishing that the deficit in this heterozygous
        truncating genotype is a troponin-quantity problem correctable in vitro.
  evidence:
  - reference: CGGV:assertion_668087ea-0d2f-42c2-a291-f73400d34023-2025-04-18T160000.000Z
    reference_title: "TNNI3 / dilated cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong
    explanation: >-
      ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel classifies the
      autosomal dominant TNNI3-DCM gene-disease relationship as Strong under SOP10.
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One contractile protein gene well known as a hypertrophic cardiomyopathy
      disease gene, but with no reported mutation in autosomal dominant DCM, is
      TNNI3 which encodes cardiac troponin I.
    explanation: >-
      States the gene's prior standing as a hypertrophic cardiomyopathy gene, which
      is the background against which the dominant DCM relationship curated here

name: Dilated Cardiomyopathy 1FF
creation_date: "2026-09-02T18:30:00Z"
synonyms:
- CMD1FF
- DCM1FF
- cardiomyopathy, dilated, 1FF
- dilated cardiomyopathy type 1FF
- TNNI3-related autosomal dominant dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1FF (CMD1FF, OMIM 613286) is the autosomal dominant,
  TNNI3-related form of familial isolated dilated cardiomyopathy. TNNI3 encodes
  cardiac troponin I (cTnI), the inhibitory subunit of the sarcomeric troponin
  complex that holds the actin-tropomyosin thin filament in its "off" state until
  calcium binding to troponin C releases the inhibition. CMD1FF is caused by a
  single heterozygous TNNI3 allele — classically a missense variant that is
  incorporated into the troponin complex and alters thin-filament calcium
  regulation from within it, and in at least one studied family a truncating
  allele acting through haploinsufficiency.

  The entity exists as a separate dismech entry because it contrasts on mechanism,
  not merely on OMIM number, with Dilated_Cardiomyopathy_2A (CMD2A, OMIM 611880),
  the recessive TNNI3 dilated cardiomyopathy. In CMD2A both alleles are null, no
  cardiac troponin I is made, and the disease is timed by the perinatal troponin I
  isoform switch: a well neonate decompensates within the first year with
  refractory heart failure. In CMD1FF a normal allele is always present and a
  mutant cTnI protein is present in the thin filament, so there is no null state
  and no isoform-switch clock. The dominant missense alleles instead alter what the
  troponin complex does — reconstituted mutant troponin gives lower maximum
  actin-tropomyosin-activated myosin ATPase rates, lower calcium sensitivity, and
  reduced thin-filament calcium affinity — which is the thin-filament signature
  shared with dominant DCM alleles in TNNT2, TPM1, TNNC1 and ACTC1, and is
  directionally opposite to the calcium-sensitizing TNNI3 missense alleles that
  cause hypertrophic (CMH7) and restrictive (RCM1) cardiomyopathy. Onset is
  correspondingly different: variable and incompletely penetrant rather than
  obligate and neonatal, though severe early-onset disease is well documented —
  three of the five carriers in the founding families were transplanted at ages 6,
  15 and 24. Recurrence risk and cascade-screening practice differ for the same
  reason (50% per offspring with surveillance of first-degree relatives, versus
  25% per sibship with carrier testing in CMD2A). ClinGen's Dilated Cardiomyopathy
  Gene Curation Expert Panel classifies the autosomal dominant TNNI3-DCM
  relationship as Strong, curated separately from its Strong autosomal recessive
  classification.
category: Genetic

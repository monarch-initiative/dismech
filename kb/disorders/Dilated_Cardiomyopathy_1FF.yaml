  evidence:
  - reference: PMID:32618513
    reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study we set out to investigate the functional effect of DCM-causing
      mutations in three separate thin-filament regulatory proteins: TnT R131W, TnI
      K36Q, and α-TM E40K, using our established adult guinea pig left ventricular
      cardiomyocyte model (39).
    explanation: >-
      Describes the model system and confirms that the CMD1FF allele K36Q is among
      the mutations it carries, which is what makes it informative for this entry.
discussions:
- discussion_id: cmd1ff_versus_cmd2a_split
  prompt: >-
    Is dominant TNNI3 dilated cardiomyopathy (CMD1FF) a separate dismech entity
    from recessive TNNI3 dilated cardiomyopathy (CMD2A), or should it be a subtype
    of it?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - pathophysiology#Heterozygous TNNI3 Variant Altering Cardiac Troponin I
  rationale: >-
    The two share a gene and an organ-level phenotype, so the split needs a reason
    beyond having two OMIM numbers. Four independent axes support it. Mechanism:
    CMD2A abolishes cardiac troponin I, whereas CMD1FF always retains a wild-type
    allele and — for the founding missense alleles — puts an altered protein into
    the troponin complex, so the lesion is a change in what the thin filament does
    rather than an absence of it. Direction of functional effect: the CMD1FF alleles
    lower maximum ATPase and calcium sensitivity, whereas the troponin I-null heart
    is characterized by global regulatory failure timed by a developmental isoform
    switch, a clock that has no meaning when one allele is intact. Natural history:
    obligate neonatal-to-infantile and near-uniformly severe in CMD2A, versus
    variable, incompletely penetrant, childhood-to-adult onset in CMD1FF. Clinical
    action: 50% per-offspring recurrence with longitudinal surveillance of
    first-degree relatives, versus 25% per sibship with carrier testing and
    reproductive counselling. ClinGen's Dilated Cardiomyopathy GCEP reinforces this
    by issuing two separate TNNI3-DCM assertions differing only in mode of
    inheritance, both rated Strong. Recorded as RESOLVED in favour of a separate
    entry; if MONDO or ClinGen later collapses the two, this entry and CMD2A should
    be merged rather than left to duplicate each other.
  evidence:
  - reference: CGGV:assertion_668087ea-0d2f-42c2-a291-f73400d34023-2025-04-18T160000.000Z
    reference_title: "TNNI3 / dilated cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong
    explanation: >-
      The dominant assertion, curated separately from the recessive one on the same
      day by the same expert panel — the external evidence that the two
      relationships are treated as distinct curatable claims.
  - reference: PMID:36981019
    reference_title: "Homozygous TNNI3 Mutations and Severe Early Onset Dilated Cardiomyopathy: Patient Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In recent years, however, an increasing amount of evidence has validated the
      hypothesis that biallelic TNNI3 null mutations cause a severe form of neonatal
      dilated cardiomyopathy.
    explanation: >-
      Establishes the recessive entity's distinct genotype and neonatal course,
      which is the contrast this split rests on.
- discussion_id: cmd1ff_calcium_sensitivity_direction_conflict
  prompt: >-
    Do all dominant TNNI3 dilated-cardiomyopathy alleles decrease myofilament
    calcium sensitivity, given that the one heterozygous truncating allele studied
    in human myocardium increased it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Thin-Filament Calcium Regulation
  - mechanistic_hypotheses#tnni3_ad_haploinsufficiency
  rationale: >-
    The organising generalization for dominant thin-filament dilated cardiomyopathy
    is that its alleles desensitize the myofilament to calcium, opposite to the
    sensitizing hypertrophic and restrictive alleles — and the two founding CMD1FF
    missense alleles behave that way on reconstitution. But the single heterozygous
    TNNI3 truncating allele characterized in explanted human myocardium showed pure
    haploinsufficiency with *increased* calcium sensitivity and impaired
    length-dependent activation. Both results are credible and neither is a
    measurement error: they differ in allele class (altered-function missense versus
    reduced-quantity truncation), in preparation (reconstituted proteins versus
    permeabilized human cardiomyocytes), and in whether secondary remodeling of an
    end-stage explanted heart could contribute. Whether the two allele classes reach
    the same disease by opposite myofilament routes, or whether one of them belongs
    to a different mechanism entirely, is unresolved — and it matters, because a
    calcium-sensitizer or -desensitizer therapy would be predicted to help one group
    and harm the other.
  proposed_experiments:
  - experiment_id: exp_cmd1ff_allele_class_calcium_sensitivity_series
    name: Paired calcium-sensitivity measurement across CMD1FF missense and truncating alleles
    description: >-
      Measure myofilament calcium sensitivity and length-dependent activation in one
      preparation across a panel of heterozygous TNNI3 dilated-cardiomyopathy
      alleles spanning both classes, so the direction of effect is not confounded by
      differences in assay system.
  - experiment_id: exp_cmd1ff_isogenic_ipsc_allele_comparison
    name: Isogenic human iPSC-cardiomyocyte comparison of missense versus truncating TNNI3 alleles
    description: >-
      Introduce K36Q, N185K, and a truncating TNNI3 allele into a single isogenic
      human iPSC background and compare calcium sensitivity, contractility, and
      length-dependent activation, removing both the species and the end-stage
      remodeling confounds.
  evidence:
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of Ca(2+) regulation of actin-tropomyosin-activated myosin ATPase by
      troponin revealed that troponin reconstituted with either mutant troponin I
      gave lower maximum ATPase rates and lower Ca(2+) sensitivity than wild type.
    explanation: >-
      One side of the discrepancy: the founding missense alleles reduce calcium
      sensitivity.
  - reference: DOI:10.1113/jp274145
    reference_title: Genotype-specific pathogenic effects in human dilated cardiomyopathy
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      The TNNI3p.98trunc showed pure haploinsufficiency, increased Ca2+‐sensitivity
      and impaired length‐dependent activation.
    explanation: >-
      The other side: a heterozygous TNNI3 truncating allele in human myocardium
      raised calcium sensitivity. Graded REFUTE against the claim that all dominant
      TNNI3 dilated-cardiomyopathy alleles are calcium-desensitizing, which is the
      generalization this gap questions.
- discussion_id: cmd1ff_no_animal_model
  prompt: >-
    Does any whole-animal model of dominant TNNI3 dilated cardiomyopathy exist, and
    what does its absence cost the mechanistic account?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Adverse Ventricular Remodeling
  rationale: >-
    Every functional result behind this entry comes from reconstituted proteins,
    permeabilized human cardiomyocytes, or acutely transduced isolated myocytes. No
    knock-in animal carrying a CMD1FF allele has been reported, in contrast to the
    thin-filament DCM field generally, where knock-in mouse models exist for TNNT2
    and TPM1 alleles and where the Tnni3-null mouse anchors the recessive entity.
    Consequently the steps from myofilament defect through remodeling to a dilated
    ventricle are asserted here from dilated cardiomyopathy as a class rather than
    demonstrated for this genotype, and questions that need an intact circulation —
    penetrance, the trigger for conversion from latent to manifest disease, and
    whether beta-blockade acts differently when phosphorylation-sensitivity coupling
    is lost — cannot currently be addressed.
  proposed_experiments:
  - experiment_id: exp_cmd1ff_knockin_mouse
    name: Tnni3 K36Q or N185K knock-in mouse
    description: >-
      Generate a heterozygous knock-in carrying a CMD1FF allele at the endogenous
      locus and characterize penetrance, age of onset, ventricular geometry, fibrosis
      and response to beta-blockade, to test whether the in vitro myofilament defect
      is sufficient for the disease.
  evidence:
  - reference: PMID:32618513
    reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, five gene-targeted knock-in mouse models of DCM carrying
      thin-filament mutations have been characterized: TnT ΔK210 (10), R141W (36),
      and R134W (15); actin E99K (46); and αTM E54K (35).
    explanation: >-
      Enumerates the existing thin-filament DCM knock-in models — none of them a
      TNNI3 allele — which is the gap this discussion records. Evidence source is
      OTHER because the sentence surveys prior literature rather than reporting this
      paper's results.
references:
- reference: PMID:20301486
  title: Dilated Cardiomyopathy Overview.
  tags:
  - GeneReviews
notes: >-
  Scope. This entry covers the dominant, heterozygous TNNI3 dilated cardiomyopathy
  (OMIM 613286, MONDO:0013211). The recessive TNNI3 dilated entity is
  Dilated_Cardiomyopathy_2A; the dominant TNNI3 hypertrophic and restrictive
  diseases (CMH7, RCM1) appear here only as differential diagnoses. TNNI3 is the
  most heavily represented gene in this corner of the KB, so a TNNI3 citation must
  be checked for zygosity, variant class, and cardiomyopathy subtype before it is
  reused across these entries. In particular the p.Arg98* allele occurs on both
  sides of the dominant/recessive line and is not by itself diagnostic of either
  entity.

  Grouping. This entry was added as a member of the Familial_Dilated_Cardiomyopathy
  grouping, and that grouping's curation-gaps note — which previously read "TNNI3
  is represented by the recessive CMD2A entity" — was updated in the same change,
  since TNNI3 is now represented by both its dominant and its recessive entity.

  GeneReviews baseline: no CMD1FF- or TNNI3-specific GeneReviews chapter exists.
  The applicable chapter is the generic "Dilated Cardiomyopathy Overview"
  (PMID:20301486), tagged above; its PubMed record carries only the chapter's
  stated purpose and no Clinical Characteristics text, so it could not serve as a
  phenotype baseline. The phenotype set here is built from the founding Carballo
  families plus the dilated-cardiomyopathy class literature, and phenotypes taken
  from the class rather than from this entity say so in their explanations.

  Deliberately not curated. No prevalence figure is asserted for CMD1FF: the
  Chmielewski Polish genetic-DCM cohort attributing about 1% of gene findings to
  TNNI3 is cited in the deep-research report, but its cached reference file carries
  no abstract body, so no exact snippet could be verified and the claim was left
  out rather than paraphrased. No animal model is recorded because none carrying a
  CMD1FF allele has been reported (see the corresponding discussion). No
  environmental section is curated: the report's list of second hits (alcohol,
  anthracyclines, peripartum stress, myocarditis) is general genetic-DCM biology
  with no TNNI3-specific evidence, and asserting it here would attach an
  unevidenced exposure to a mechanism node. No clinical trials are recorded — none
  is registered for this entity — and no datasets block was added, as no
  CMD1FF-specific dataset was identified.

  Deep-research provenance: Edison/FutureHouse Falcon
  (research/Dilated_Cardiomyopathy_1FF-deep-research-falcon.md). `just preflight-dr`
  passed against MONDO:0013211 with TNNI3 mentioned 51 times and the report's OMIM
  set covering 613286. The report was used as a lead-generation source only. It
  correctly separates CMD1FF from CMD2A and correctly corrects a nomenclature error
  it found in the literature (OMIM 617047 is FLNC-related restrictive
  cardiomyopathy, not CMD1FF). Two of its claims were checked and not carried over:
  it reports being unable to establish a MONDO identifier for CMD1FF and suggests
  mapping to parent concepts, whereas MONDO:0013211 exists and was resolved
  directly with OAK; and its suggested HPO term "Left ventricular dilatation
  (HP:0001712)" is wrong — HP:0001712 is Left ventricular hypertrophy, and the
  correct term HP:4000141 was used instead. Its founding-literature coverage was
  incomplete: the Carballo 2009 Circulation Research report that defines this
  entity and is the OMIM 613286 anchor is not among its citations and was found
  independently, as were the Memo 2013 uncoupling study, the Robinson 2020
  cardiomyocyte study of the K36Q allele, and the Tadros 2020 troponin-variant
  meta-analysis.

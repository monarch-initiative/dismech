prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the dominant TNNI3 form of
    dilated cardiomyopathy specifically. The entity was defined from a screen of
    96 DCM probands that found two novel missense alleles, and the reported
    literature has remained at the level of individual families and cohort
    fractions. For scale: dilated cardiomyopathy as a whole affects roughly 1 in
    500 people with 30-40% of cases familial, and TNNI3 accounts for a small
    minority of gene-positive familial DCM. Any CMD1FF-specific rate quoted
    elsewhere should be treated as an extrapolation.
  evidence:
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To test TNNI3 as a candidate gene, a panel of 96 probands with DCM was
      analyzed.
    explanation: >-
      Establishes the ascertainment behind this entity — a 96-proband DCM panel
      screen yielding two families — which is why no population frequency is
      available.
  - reference: PMID:32618513
    reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DCM affects roughly 1 in 500 people globally (49). Approximately 30–40% of
      cases are found to be familial (19)
    explanation: >-
      Supplies the denominator this entity sits inside — dilated cardiomyopathy
      prevalence and its familial fraction. Evidence source is OTHER because the
      quoted sentences are background review statements in the paper's
      introduction rather than results of its own experiments, which are graded
      IN_VITRO elsewhere in this entry.
inheritance:
- name: Autosomal Dominant
  description: >-
    CMD1FF is transmitted as an autosomal dominant trait: a single heterozygous
    TNNI3 allele is sufficient, transmission follows the classic vertical pattern,
    and each offspring of a carrier has a 50% recurrence risk. Penetrance is
    incomplete and expressivity variable, so a genotype-positive relative may be
    phenotype-negative for years — which is what makes longitudinal cascade
    surveillance, rather than a single screening echocardiogram, the appropriate
    family strategy. This dominant mode is the axis on which CMD1FF separates from
    CMD2A, where two loss-of-function alleles are required and heterozygous
    parents are typically unaffected.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These are the first reported autosomal dominant DCM-causing mutations in
      TNNI3, and so the findings expand the spectrum of disease-causing genes that
      lead to either hypertrophic cardiomyopathy or DCM depending on the specific
      mutation.
    explanation: >-
      The founding CMD1FF report explicitly establishes TNNI3 as an autosomal
      dominant dilated cardiomyopathy gene, distinct from its long-known
      hypertrophic role.
  - reference: CGGV:assertion_668087ea-0d2f-42c2-a291-f73400d34023-2025-04-18T160000.000Z
    reference_title: "TNNI3 / dilated cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong
    explanation: >-
      ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel records an
      autosomal dominant TNNI3-DCM gene-disease relationship with Strong clinical
      validity, curated separately from the recessive relationship.
mechanistic_hypotheses:
- hypothesis_group_id: tnni3_ad_altered_thin_filament_regulation
  hypothesis_label: Altered thin-filament calcium regulation by mutant cTnI
  status: CANONICAL
  description: >-
    The canonical model holds that a heterozygous TNNI3 missense allele produces a
    full-length but functionally altered cardiac troponin I that is incorporated
    into the thin filament alongside the wild-type protein, and changes what the
    troponin complex does rather than how much of it there is. Reconstitution of
    troponin with either founding mutant (Lys36Gln, Asn185Lys) lowers the maximum
    actin-tropomyosin-activated myosin ATPase rate and lowers calcium sensitivity,
    and the resulting thin filaments have reduced calcium affinity. This is the
    same functional signature carried by proven dominant DCM alleles in the other
    thin-filament proteins, and it is directionally opposite to the
    calcium-sensitizing TNNI3 alleles that cause hypertrophic and restrictive
    cardiomyopathy — which is the mechanistic reason one gene produces three
    dominant cardiomyopathies. The consequence at the cell level is a weaker,
    slower contraction with a suppressed systolic calcium transient.
  evidence:
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of Ca(2+) regulation of actin-tropomyosin-activated myosin ATPase
      by troponin revealed that troponin reconstituted with either mutant troponin
      I gave lower maximum ATPase rates and lower Ca(2+) sensitivity than wild
      type.
    explanation: >-
      Supplies the direct functional measurement on which this model rests, for
      the two founding CMD1FF alleles. Classified IN_VITRO because it is a
      reconstituted-protein ATPase assay rather than a patient observation.
  - reference: PMID:32278834
    reference_title: Meta-analysis of cardiomyopathy-associated variants in troponin genes identifies loci and intragenic hot spots that are associated with worse clinical outcomes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HCM and RCM models tended to have increased calcium sensitivity and DCM
      decreased sensitivity (P < .001).
    explanation: >-
      Establishes across the pooled troponin-variant literature that the
      calcium-sensitivity direction separates dilated from hypertrophic and
      restrictive disease, which is the generalization this model places CMD1FF
      inside. Evidence source is OTHER because it is a meta-analysis of
      previously published functional models rather than a single study type.
- hypothesis_group_id: tnni3_ad_pka_uncoupling
  hypothesis_label: Uncoupling of myofilament calcium sensitivity from troponin I phosphorylation
  status: ALTERNATIVE
  description: >-
    A competing, more specific proposal is that the primary defect is not the
    change in baseline calcium sensitivity at all, but the loss of its regulation.
    In normal thin filaments, protein kinase A phosphorylation of troponin I
    desensitizes the myofilament two- to three-fold, which is how beta-adrenergic
    stimulation accelerates relaxation. In thin filaments containing any of a panel
    of dominant DCM alleles — including the CMD1FF allele K36Q — calcium
    sensitivity no longer moves with troponin I phosphorylation at all. On this
    model the heart's inotropic and lusitropic reserve is what is lost, and chronic
    failure follows from the blunted beta-adrenergic response rather than from the
    resting sensitivity shift. It is recorded as ALTERNATIVE rather than CANONICAL
    because it has been demonstrated in vitro across mutant thin filaments but not
    yet shown to be the rate-limiting lesion in a CMD1FF patient or animal.
  evidence:
  - reference: PMID:23539503
    reference_title: Familial dilated cardiomyopathy mutations uncouple troponin I phosphorylation from changes in myofibrillar Ca²⁺ sensitivity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that DCM-causing mutations in thin filament proteins abolish the
      relationship between myofilament Ca(2+) sensitivity and troponin I
      phosphorylation by PKA.
    explanation: >-
      States the uncoupling hypothesis as the paper's conclusion, from quantitative
      in vitro motility assays on native mutant thin filaments.
  - reference: PMID:23539503
    reference_title: Familial dilated cardiomyopathy mutations uncouple troponin I phosphorylation from changes in myofibrillar Ca²⁺ sensitivity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, Ca(2+) sensitivity did not change with the level of troponin I
      phosphorylation in any of the DCM-mutant containing thin filaments (E40K,
      E54K, and D230N in α-tropomyosin; R141W and ΔK210 in cardiac troponin T; K36Q
      in cardiac troponin I; G159D in cardiac troponin C, and E361G in cardiac
      α-actin).
    explanation: >-
      Names K36Q in cardiac troponin I — one of the two founding CMD1FF alleles —
      among the mutant thin filaments showing the uncoupling, which is what makes
      this model applicable to this entity rather than to DCM generally.
- hypothesis_group_id: tnni3_ad_haploinsufficiency
  hypothesis_label: Haploinsufficiency from a heterozygous truncating allele
  status: EMERGING
  description: >-
    A third route to dominant TNNI3 dilated cardiomyopathy has been described in
    human explanted myocardium: a heterozygous truncating allele (p.98trunc) that
    produces no altered protein but simply too little of the normal one. Troponin I
    fell to 39% of control with distorted stoichiometry across the three troponin
    subunits, and exchanging in recombinant wild-type troponin both restored
    protein levels and normalized every functional deficit — establishing the
    lesion as troponin-intrinsic rather than end-stage remodeling. Notably the
    functional consequence here ran in the opposite direction to the missense
    model: calcium sensitivity was increased, not decreased, with impaired
    length-dependent activation. Recorded as EMERGING because it rests on one
    studied heart, and because that directional discrepancy is unresolved (see the
    corresponding discussion).
  evidence:
  - reference: DOI:10.1113/jp274145
    reference_title: Genotype-specific pathogenic effects in human dilated cardiomyopathy
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The TNNI3p.98trunc and TNNT2p.K217del mutation showed reduced expression of
      troponin I to 39% and 51%, troponin T to 64% and 53%, and troponin C to 73%
      and 97% of controls, respectively, and altered stoichiometry between the
      three cardiac troponin subunits.
    explanation: >-
      Quantifies the reduced troponin I abundance and subunit stoichiometry
      imbalance that define the haploinsufficiency route. Classified IN_VITRO
      because the measurements are on membrane-permeabilized cardiomyocytes from
      explanted tissue.
  - reference: DOI:10.1113/jp274145
    reference_title: Genotype-specific pathogenic effects in human dilated cardiomyopathy
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, upon exchange all functional deficits in the TNNI3p.98trunc and
      TNNT2p.K217del samples were normalized to control values confirming the
      pathogenic effects of the troponin mutations.
    explanation: >-
      The troponin-exchange rescue is what establishes that the contractile defect
      is caused by the troponin lesion itself rather than by secondary end-stage
      remodeling in an explanted failing heart.
pathophysiology:
- name: Heterozygous TNNI3 Variant Altering Cardiac Troponin I
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    TNNI3 encodes cardiac troponin I, the inhibitory subunit of the troponin
    complex and one of the three regulatory proteins (with troponin C and troponin
    T) that confer calcium sensitivity on the sarcomeric thin filament. CMD1FF
    arises from a single heterozygous TNNI3 allele. The founding alleles are
    missense (Lys36Gln, Asn185Lys), which produce a full-length mutant cTnI that
    assembles into the troponin complex beside the wild-type protein; a
    heterozygous truncating allele acting by haploinsufficiency has also been
    documented in explanted human myocardium. Either way a wild-type allele
    remains, so — unlike the biallelic null genotype of CMD2A — the myocardium is
    never troponin I-free, and the disease is not gated by the perinatal troponin I
    isoform switch.

- name: Uncoupling of Calcium Sensitivity from Troponin I Phosphorylation
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    Beta-adrenergic stimulation normally accelerates cardiac relaxation by having
    protein kinase A phosphorylate troponin I, which desensitizes the myofilament
    to calcium two- to three-fold. In thin filaments carrying a dominant DCM
    allele — the CMD1FF allele K36Q among them — calcium sensitivity no longer
    tracks troponin I phosphorylation at all. The regulatory link is severed rather
    than the set point moved, so the myocardium loses the ability to change its
    calcium sensitivity on demand. This node is the substrate of the alternative
    mechanistic hypothesis: it predicts a blunted response to sympathetic drive as
    the operative deficit, which would show first as loss of contractile and
    relaxation reserve under stress rather than at rest.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of cardiac muscle cell contraction
    term:
      id: GO:0086004
      label: regulation of cardiac muscle cell contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23539503
    reference_title: Familial dilated cardiomyopathy mutations uncouple troponin I phosphorylation from changes in myofibrillar Ca²⁺ sensitivity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In thin filaments from normal human and mouse heart, protein kinase A (PKA)
      phosphorylation of troponin I caused a two- to three-fold decrease in
      myofibrillar Ca(2+) sensitivity.
    explanation: >-
      Establishes the normal phosphorylation-sensitivity relationship that this
      node asserts is lost.
  - reference: PMID:23539503
    reference_title: Familial dilated cardiomyopathy mutations uncouple troponin I phosphorylation from changes in myofibrillar Ca²⁺ sensitivity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that this blunts the response to β-adrenergic stimulation and
      could be the cause of DCM in the long term.
    explanation: >-
      States the proposed downstream consequence — loss of beta-adrenergic
      responsiveness — that this node contributes to the pathograph.
  downstream:
  - target: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tnni3_ad_pka_uncoupling
    description: >-
      Loss of phosphorylation-dependent desensitization is proposed to degrade
      contractile and relaxation reserve over time rather than instantaneously,
      hence an indirect link.

- name: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    At the level of the single myocyte the thin-filament lesion produces
    significantly reduced fractional shortening together with a reduced systolic
    calcium transient, with slowed contraction and slowed calcium reuptake.
    Sarcoplasmic reticulum calcium load rises while fractional release falls,
    reflecting reduced SERCA activity and increased sodium-calcium exchanger
    activity. These changes were shown for the CMD1FF allele K36Q alongside
    dominant DCM alleles in troponin T and tropomyosin, and were common to all
    three — evidence that this node is a shared convergence point of thin-filament
    dilated cardiomyopathy rather than an idiosyncrasy of one variant.
  cell_types:

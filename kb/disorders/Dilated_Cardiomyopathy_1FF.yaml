diagnosis:
- name: Echocardiography
  description: >-
    First-line and usually diagnostic: left ventricular internal dimensions and
    ejection fraction establish the dilated, hypocontractile phenotype. In a CMD1FF
    kindred echocardiography also carries the surveillance load, since a
    genotype-positive relative may convert from phenotype-negative to systolic
    dysfunction years after the first normal study.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: DOI:10.1093/ehjqcco/qcae109
    reference_title: "Diagnosis and management of dilated cardiomyopathy: a systematic review of clinical practice guidelines and recommendations"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our review revealed consensus on several key aspects: the definition of DCM,
      the use of B-type natriuretic peptides and high-sensitivity troponin in
      laboratory testing, the essential role of multimodality cardiovascular
      imaging for initial diagnosis, genetic counselling, and the management of
      advanced disease.
    explanation: >-
      Records cross-guideline consensus that multimodality cardiovascular imaging
      is essential for the initial diagnosis of dilated cardiomyopathy, of which
      CMD1FF is a genetic form. Evidence source is OTHER because this is a
      systematic review of guidelines rather than a primary study.
- name: Molecular Genetic Testing
  description: >-
    Cardiomyopathy-panel or exome sequencing establishes the diagnosis and, as
    importantly, its zygosity. A heterozygous TNNI3 variant in a proband with a
    dilated ventricle points at CMD1FF; two loss-of-function alleles point at
    CMD2A; and a heterozygous missense allele must still be weighed against the
    much larger TNNI3 hypertrophic and restrictive literature before a dilated
    entity is assigned. Segregation in the family is what converts a plausible
    variant into a diagnosis, which is why the founding report evaluated its
    candidates by segregation analysis and control screening rather than by
    computational prediction.
  diagnosis_term:
    preferred_term: cardiomyopathy gene panel or exome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genomic DNA was isolated and TNNI3 exons screened by heteroduplex analysis.
      Exons with aberrant profiles were sequenced and variants evaluated by
      segregation analysis and study of normal controls.
    explanation: >-
      Documents segregation analysis plus control screening as the evidence
      standard applied to candidate TNNI3 variants in this entity.
  - reference: DOI:10.1093/ehjqcco/qcae109
    reference_title: "Diagnosis and management of dilated cardiomyopathy: a systematic review of clinical practice guidelines and recommendations"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nonetheless, notable areas of variation included the formation of
      multidisciplinary management teams, the role of cascade genetic testing,
      pathways for arrhythmic risk stratification, and the criteria for prophylactic
      defibrillator implantation.
    explanation: >-
      Records that the role of cascade genetic testing is an area where DCM
      guidelines diverge — relevant because cascade testing is the practical
      consequence of a CMD1FF diagnosis. Evidence source is OTHER because this is a
      systematic review of guidelines.
- name: Family Screening of First-Degree Relatives
  description: >-
    Because the trait is dominant with incomplete and age-dependent penetrance, the
    diagnostic unit is the family rather than the proband. Longitudinal screening
    of first-degree relatives detects left ventricular systolic dysfunction before
    it declares itself clinically, and detection through a screening programme is
    associated with better outcomes than detection outside one. Carriage of a
    pathogenic variant is one of the main risk factors for developing dysfunction,
    so a CMD1FF genotype identifies precisely the relatives who need continuing
    rather than one-off evaluation.
  diagnosis_term:
    preferred_term: cascade family screening for dilated cardiomyopathy
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: DOI:10.1002/ejhf.3657
    reference_title: Prediction and Prognostic Role of Left Ventricular Systolic Dysfunction in Family Screening for Dilated Cardiomyopathy and Non-Dilated Left Ventricular Cardiomyopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Baseline and follow-up data of first-degree relatives of probands affected by
      DCM/NDLVC were collected.
    explanation: >-
      Establishes longitudinal evaluation of first-degree relatives as the design of
      DCM family screening, which is the practice a dominant CMD1FF genotype
      triggers. The cohort is DCM/NDLVC relatives generally rather than TNNI3
      carriers.
  - reference: DOI:10.1002/ejhf.3657
    reference_title: Prediction and Prognostic Role of Left Ventricular Systolic Dysfunction in Family Screening for Dilated Cardiomyopathy and Non-Dilated Left Ventricular Cardiomyopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      family history of arrhythmia and being carrier of a pathogenic/likely
      pathogenic variant are the main risk factors for LV systolic dysfunction
    explanation: >-
      Identifies pathogenic-variant carriage as a main risk factor for developing
      systolic dysfunction, which is what makes genotype-directed surveillance of
      CMD1FF relatives worthwhile.
differential_diagnoses:
- name: Dilated cardiomyopathy 2A (recessive TNNI3 disease)
  description: >-
    The same gene, the opposite zygosity, and a different mechanism. CMD2A requires
    two loss-of-function alleles, abolishes cardiac troponin I entirely, and
    presents in the neonatal period or first year with refractory heart failure
    once the perinatal troponin I isoform switch withdraws the substituting slow
    skeletal isoform. Heterozygous parents are typically unaffected. A biallelic
    truncating genotype in an infant is CMD2A, not CMD1FF, and the recurrence risk
    and reproductive counselling that follow are different (25% per sibship rather
    than 50% per offspring).
  evidence:
  - reference: PMID:36981019
    reference_title: "Homozygous TNNI3 Mutations and Severe Early Onset Dilated Cardiomyopathy: Patient Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In recent years, however, an increasing amount of evidence has validated the
      hypothesis that biallelic TNNI3 null mutations cause a severe form of neonatal
      dilated cardiomyopathy.
    explanation: >-
      States the recessive entity's defining genotype and its neonatal presentation,
      which is what distinguishes it from the entity curated here.
- name: TNNI3-related hypertrophic and restrictive cardiomyopathy (CMH7, RCM1)
  description: >-
    The other dominant TNNI3 diseases, and the harder differential because they
    share both gene and zygosity with CMD1FF. They are separated on phenotype and
    on the direction of the functional lesion: hypertrophic and restrictive TNNI3
    alleles increase myofilament calcium sensitivity, while dilated alleles decrease
    it. A heterozygous TNNI3 missense variant reported in a hypertrophic or
    restrictive family does not by itself establish CMD1FF causality in a dilated
    proband.
  evidence:
  - reference: PMID:32278834
    reference_title: Meta-analysis of cardiomyopathy-associated variants in troponin genes identifies loci and intragenic hot spots that are associated with worse clinical outcomes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HCM and RCM models tended to have increased calcium sensitivity and DCM
      decreased sensitivity (P < .001).
    explanation: >-
      Supplies the functional axis that separates dilated from hypertrophic and
      restrictive troponin disease. Evidence source is OTHER because it aggregates
      functional models from the published literature.
  - reference: PMID:32278834
    reference_title: Meta-analysis of cardiomyopathy-associated variants in troponin genes identifies loci and intragenic hot spots that are associated with worse clinical outcomes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The inhibitory region and C-terminal region in TNNI3 exhibited increased
      restrictive cardiomyopathy (P =.008).
    explanation: >-
      Identifies TNNI3 regions enriched for restrictive rather than dilated
      phenotypes, which is positional information a curator can use when triaging a
      heterozygous TNNI3 variant.
- name: Other genetic and acquired causes of dilated cardiomyopathy
  description: >-
    Dilated cardiomyopathy is genetically heterogeneous — titin, lamin A/C, MYH7,
    TNNT2, FLNC, RBM20, BAG3 and others — and roughly 30-40% of cases are familial,
    so a TNNI3 variant must compete with alternative genetic explanations in a
    gene-positive proband. Non-genetic causes (myocarditis, alcohol and other
    cardiotoxins, anthracyclines, peripartum, tachycardia-mediated, endocrine)
    must be excluded before a familial label is applied, and can also coexist with
    and unmask a genetic substrate.
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nongenetic forms of DCM can result from different aetiologies, including
      inflammation of the myocardium due to an infection (mostly viral); exposure to
      drugs, toxins or allergens; and systemic endocrine or autoimmune diseases.
    explanation: >-
      Enumerates the acquired differential that must be excluded before a familial
      DCM diagnosis. Evidence source is OTHER because this is a review.
  - reference: PMID:32618513
    reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Causative genes have substantial overlap with other cardiac conditions, such
      as arrhythmogenic right ventricular cardiomyopathy (ARVC) and hypertrophic
      cardiomyopathy (HCM); however, it is far more genetically heterogeneous than
      both of these, with over 30 potential disease genes characterized to date
      (53).
    explanation: >-
      Quantifies the genetic heterogeneity a TNNI3 variant must be weighed against.
      Evidence source is OTHER because the sentence is a review statement in the
      paper's introduction.
progression:
- phase: Genotype-positive, phenotype-negative
  notes: >-
    Because penetrance is incomplete and age-dependent, a carrier may have a
    structurally normal, normally contracting ventricle for years or decades. This
    phase has no counterpart in the recessive entity, where the null genotype
    declares itself in infancy. It is the phase that makes longitudinal cascade
    surveillance of first-degree relatives, rather than a single screening study,
    the appropriate family strategy, and it is why relatives found to carry a
    pathogenic variant are followed rather than discharged.
  evidence:
  - reference: DOI:10.1002/ejhf.3657
    reference_title: Prediction and Prognostic Role of Left Ventricular Systolic Dysfunction in Family Screening for Dilated Cardiomyopathy and Non-Dilated Left Ventricular Cardiomyopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During a median follow-up of 110 months (interquartile range 57–188 months),
      only subjects that previously developed LV systolic dysfunction had primary
      outcomes (19 vs. 0, p
    explanation: >-
      Documents a screened relative population followed for a median of nine years
      in which the emergence of systolic dysfunction, not carrier status alone,
      marks the transition to adverse outcomes — the latent-then-manifest pattern
      this phase describes. The cohort is DCM/NDLVC relatives generally.
- phase: Manifest left ventricular systolic dysfunction
  notes: >-
    Onset of measurable systolic dysfunction and chamber dilation, which may be
    detected on surveillance before symptoms. In the founding CMD1FF families this
    stage was reached in childhood or early adulthood in the severely affected
    carriers. Detection at this point is what family screening exists to achieve,
    because it opens the window for anti-remodeling therapy before symptomatic
    failure.
  evidence:
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 2 novel TNNI3 missense mutations, Lys36Gln and Asn185Lys, each
      associated with severe and early onset familial DCM.
    explanation: >-
      Characterizes the manifest disease in the founding families as severe and
      early in onset.
- phase: Advanced heart failure, transplantation, or death
  notes: >-
    In the severe end of the reported spectrum the disease progresses to end-stage
    heart failure requiring cardiac transplantation — three of the five carriers in
    the founding families, at ages 6, 15 and 24. There is no TNNI3-directed therapy,
    so progression is modified only by generic heart-failure management, and
    transplantation remains the definitive option.
  evidence:
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 5 mutation carriers, cardiac transplantation was required in 3, at
      ages 6, 15, and 24 years.
    explanation: >-
      Documents progression to transplantation and the ages at which it occurred in
      this entity.
treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard anti-remodeling heart-failure therapy — renin-angiotensin system
    blockade, a beta-blocker, and a mineralocorticoid receptor antagonist —
    targeting the neurohormonal and remodeling amplifier downstream of the
    myofilament lesion. There is no TNNI3-directed or myofilament-correcting
    therapy for CMD1FF, so management is the generic dilated-cardiomyopathy
    regimen. One caveat is worth recording: if the uncoupling hypothesis is
    correct, the myofilament in this disease no longer responds to
    phosphorylation-mediated calcium desensitization, which is the arm of
    beta-adrenergic signalling that beta-blockade modulates — a reason to expect
    generic therapy to work through remodeling rather than through restoring
    myofilament regulation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: mineralocorticoid receptor antagonist (spironolactone as the class exemplar)
      term:
        id: NCIT:C840
        label: Spironolactone
  target_mechanisms:
  - target: Adverse Ventricular Remodeling
    treatment_effect: INHIBITS
    description: >-
      Neurohormonal blockade slows the remodeling program that converts the
      myofilament lesion into a dilated ventricle; it does not correct the mutant
      troponin.
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As DCM eventually leads to impaired contractility, standard approaches to
      prevent or treat heart failure are the first-line treatment for patients with
      DCM.
    explanation: >-
      Establishes standard heart-failure therapy as first-line management for
      dilated cardiomyopathy, of which CMD1FF is a genetic form. Evidence source is
      OTHER because this is a Nature Reviews Disease Primers review.
- name: Heart Transplantation
  description: >-
    The definitive therapy for end-stage disease, and a documented outcome in this
    entity: three of the five carriers in the founding families were transplanted,
    the youngest at age 6. Because the lesion is a constitutional sarcomeric
    protein defect rather than a reversible insult, recovery of native ventricular
    function is not expected once end-stage failure is established.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Failure
    treatment_effect: INHIBITS
    description: >-
      Transplantation replaces the failing ventricle outright; it is the only
      intervention that removes the mutant myocardium.
  evidence:
  - reference: PMID:19590045
    reference_title: Identification and functional characterization of cardiac troponin I as a novel disease gene in autosomal dominant dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 5 mutation carriers, cardiac transplantation was required in 3, at
      ages 6, 15, and 24 years.
    explanation: >-
      Documents transplantation as the realized endpoint in the majority of
      reported CMD1FF carriers.
- name: Genetic Counseling and Cascade Screening
  description: >-
    Counseling for a 50% per-offspring recurrence risk, predictive testing of
    first-degree relatives, and enrolment of genotype-positive relatives in
    longitudinal cardiac surveillance. The counseling content differs materially
    from CMD2A's: there the conversation is about a 25% sibship risk and unaffected
    carrier parents, here it is about vertical transmission, incomplete penetrance,
    and the fact that a normal echocardiogram today does not discharge a carrier.
    Genetic counseling is one of the few points on which international DCM
    guidelines already agree.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: DOI:10.1093/ehjqcco/qcae109
    reference_title: "Diagnosis and management of dilated cardiomyopathy: a systematic review of clinical practice guidelines and recommendations"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our review revealed consensus on several key aspects: the definition of DCM,
      the use of B-type natriuretic peptides and high-sensitivity troponin in
      laboratory testing, the essential role of multimodality cardiovascular
      imaging for initial diagnosis, genetic counselling, and the management of
      advanced disease.
    explanation: >-
      Records genetic counselling as an area of cross-guideline consensus in
      dilated cardiomyopathy management. Evidence source is OTHER because this is a
      systematic review of guidelines.
  - reference: PMID:20301486
    reference_title: Dilated Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide a basic view of genetic risk assessment of at-risk asymptomatic
      relatives of a proband with DCM to inform cardiac surveillance and allow
      early detection and treatment of DCM to improve long-term outcome.
    explanation: >-
      The GeneReviews DCM overview frames genetic risk assessment of asymptomatic
      relatives as a route to earlier detection and better outcome, which is the
      rationale for cascade screening in a dominant entity. Evidence source is
      OTHER because GeneReviews is an expert-curated reference work. The quote is
      drawn from the chapter's stated purpose — the only prose in the PubMed
      record — rather than from a counseling section, and it is generic DCM
      guidance rather than CMD1FF-specific.
experimental_models:
- name: Adenovirally transduced adult guinea pig left ventricular cardiomyocytes expressing TNNI3 K36Q
  description: >-
    Isolated adult guinea pig left ventricular myocytes transduced with FLAG-tagged
    K36Q cardiac troponin I alongside wild-type controls, paced and assayed for
    sarcomere shortening, calcium transients, sarcoplasmic reticulum load, and
    signalling. Guinea pig was chosen because its calcium handling resembles the
    human more closely than the mouse does. The design isolates the primary effect
    of the mutant protein before secondary remodeling, which is exactly what a
    patient-derived explant cannot do — and it studies the actual CMD1FF allele
    rather than a proxy.
  experimental_model_type: OTHER
  organism:
    preferred_term: domestic guinea pig
    term:
      id: NCBITaxon:10141
      label: Cavia porcellus
  cell_types:
  - preferred_term: Cardiac ventricular myocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  publication: PMID:32618513
  modeled_mechanisms:
  - target: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model's central result is reduced fractional shortening with a suppressed
      systolic calcium transient in cells carrying the CMD1FF allele.
    limitations: >-
      Acute adenoviral overexpression in a non-human myocyte is not the same as
      lifelong heterozygous expression in a human heart: mutant and wild-type
      protein ratios are set by transduction rather than by allele dosage, and the
      48-hour timescale excludes chronic adaptation. Guinea pig calcium handling is
      closer to human than murine but is still not human.
    readouts:
    - name: Fractional sarcomere shortening
      target: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
      direction: DECREASED
      interpretation: Contractile output of the single myocyte carrying the mutant allele.
      evidence:
      - reference: PMID:32618513
        reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We find significantly reduced fractional shortening with reduced systolic
          Ca2+.
        explanation: >-
          Reports the shortening and systolic calcium measurements behind these
          readouts.
    - name: Systolic calcium transient amplitude
      target: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
      direction: DECREASED
      interpretation: >-
        Calcium available to activate the myofilament, measured by fura-2 ratiometry
        in the same cells.
      evidence:
      - reference: PMID:32618513
        reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We also observe increased sarcoplasmic reticulum (SR) Ca2+ load and
          smaller fractional SR Ca2+ release.
        explanation: >-
          Supplies the sarcoplasmic-reticulum handling result that accompanies the
          reduced systolic transient in this model.
  - target: Calcineurin-NFAT and Akt Signaling Activation
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The model supplies the signalling readouts linking the mutant myofilament to a
      remodeling transcriptional program.
    limitations: >-
      NFAT and Akt were assayed in chronically paced isolated cells over hours; no
      remodeling phenotype develops in this system, so the link from signalling to
      tissue remodeling is inferred rather than observed here.
    readouts:
    - name: NFAT nuclear translocation
      target: Calcineurin-NFAT and Akt Signaling Activation
      direction: INCREASED
      interpretation: Activation of calcium-dependent remodeling signalling.
      evidence:
      - reference: PMID:32618513
        reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We also observe dephosphorylation and nuclear translocation of the nuclear
          factor of activated T cells (NFAT), with concordant RAC-α-serine/threonine
          protein kinase (Akt) phosphorylation but no change to extracellular

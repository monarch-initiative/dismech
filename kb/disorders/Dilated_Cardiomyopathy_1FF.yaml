    reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this work we have studied the functional consequences of mutations in
      cardiac troponin T (R131W), cardiac troponin I (K36Q) and α-tropomyosin
      (E40K) using adenovirally transduced isolated guinea pig left ventricular
      cardiomyocytes. We find significantly reduced fractional shortening with
      reduced systolic Ca2+.
    explanation: >-
      Directly measures the two properties this node asserts — reduced shortening
      and reduced systolic calcium — in cardiomyocytes expressing the CMD1FF allele
      K36Q. Classified IN_VITRO because the system is isolated, adenovirally
      transduced cardiomyocytes.
  - reference: PMID:32618513
    reference_title: "Dilated cardiomyopathy mutations in thin-filament regulatory proteins reduce contractility, suppress systolic Ca(2+), and activate NFAT and Akt signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These changes in Ca2+ handling and signaling are common to all three
      mutations, indicating an analogous pathway of disease pathogenesis in
      thin-filament sarcomeric DCM.
    explanation: >-
      Establishes that the calcium-handling changes are shared across dominant
      thin-filament DCM alleles, which is why this node is modeled as a convergence
      point rather than an allele-specific finding.

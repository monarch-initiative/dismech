    explanation: The only worldwide frequency claim available, and it is ordinal rather than a rate.
genetic:
- name: ACTN1
  gene_term:
    preferred_term: ACTN1
    term:
      id: hgnc:163
      label: ACTN1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    ACTN1 (14q24.1) encodes alpha-actinin-1, one of the two non-muscle
    alpha-actinin isoforms, built from an N-terminal actin-binding domain, four
    spectrin-like repeats forming the antiparallel dimerisation rod, and a
    C-terminal calmodulin-like domain. Disease alleles are heterozygous missense
    substitutions and have now been found in all three regions: p.Arg46Gln in the
    actin-binding domain, p.Leu395Gln in spectrin-like repeat 2, and
    calmodulin-domain substitutions in the original Japanese series. Reported
    variants are largely private to families rather than recurrent, so there is
    no hotspot to screen and the whole coding sequence is sequenced. One
    homozygous variant, c.982G>A, has been described.
  evidence:
  - reference: PMID:25361813
    reference_title: "ACTN1-related thrombocytopenia: identification of novel families for phenotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To better characterize this disease, we screened ACTN1 in 128 probands and found 10 (8 novel) missense heterozygous variants in 11 families."
    explanation: Establishes the heterozygous missense allelic spectrum in an unselected referral cohort.
  - reference: PMID:25361813
    reference_title: "ACTN1-related thrombocytopenia: identification of novel families for phenotypic characterization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Combining bioinformatics, segregation, and functional studies, we demonstrated that all but 1 amino acid substitution had deleterious effects."
    explanation: >-
      The functional arm of the same study, split into its own item so the
      evidence_source describes the assay rather than the cohort. One of the ten
      substitutions was not shown to be deleterious.
  - reference: PMID:31237726
    reference_title: Novel ACTN1 variants in cases of thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 15 rare, monoallelic, nonsynonymous and likely pathogenic ACTN1 variants in 20 index cases from 20 unrelated families."
    explanation: The largest single sequencing series, confirming monoallelic nonsynonymous variants as the disease allele class.
  - reference: PMID:24069336
    reference_title: A missense mutation in the alpha-actinin 1 gene (ACTN1) is the cause of autosomal dominant macrothrombocytopenia in a large French family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The missense mutation occurred within actin-binding domain of alpha-actinin 1, a functionally critical domain that crosslinks actin filaments into bundles."
    explanation: Locates the classic p.Arg46Gln allele in the actin-binding domain and names the function it perturbs.
  - reference: PMID:26453073
    reference_title: ACTN1 rod domain mutation associated with congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we describe a mutation in SLR2 of α-actinin-1 (p.Leu395Gln) associated with familial macrothrombocytopenia."
    explanation: Extends the allelic spectrum into the spectrin-like rod, which earlier reports had not implicated.
pathophysiology:
- name: ACTN1 Missense Variant Altering Alpha-Actinin-1
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is a heterozygous germline missense substitution in
    ACTN1. Alpha-actinin-1 is an actin-crosslinking protein of the spectrin
    superfamily that organises the cytoskeleton, and it works as an antiparallel
    dimer whose two actin-binding domains hold neighbouring filaments together.
    Substitutions in the actin-binding domain, in the spectrin-like rod repeats
    and in the calmodulin-like domain all cause the same disease, which is the
    first clue that they share a downstream effect rather than each disabling a
    separate function.
  genes:
  - preferred_term: ACTN1
    term:
      id: hgnc:163
      label: ACTN1
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Heterozygous germline missense substitutions. Recorded as a gain of
      function because the measured biochemical effect of the disease alleles is
      an increase - higher affinity for F-actin for actin-binding-domain
      substitutions, and greater filament-bundling activity for calmodulin-like
      and rod-domain substitutions. This runs against the loss-of-crosslinking
      reading that the phenotype superficially suggests, and the disagreement is
      carried explicitly as a mechanistic hypothesis and an open discussion in
      this entry rather than settled here.
  cell_types:
  - preferred_term: Megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACTN1 encodes α-actinin-1, a member of the actin-crosslinking protein superfamily that participates in the organization of the cytoskeleton."
    explanation: Identifies the gene product and the molecular function the variants perturb.
  - reference: PMID:31237726
    reference_title: Novel ACTN1 variants in cases of thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine variants were located in the α-actinin-1 (ACTN1) rod domain and were predicted to hinder dimer formation."
    explanation: Documents the rod-domain arm of the allelic spectrum and its predicted structural consequence.
  downstream:
  - target: Increased Alpha-Actinin-1 Actin Cross-Linking Activity
    description: >-
      The substitution changes the protein's interaction with F-actin. Shown
      biochemically for nine calmodulin-like and rod-domain mutants and stated
      for actin-binding-domain mutants.
    causal_link_type: DIRECT
    hypothesis_groups:
    - actn1_increased_actin_association
    evidence:
    - reference: PMID:31365757
      reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Actinin-1 mutations cause dominantly inherited congenital macrothrombocytopenia (CMTP), with mutations in the actin-binding domain increasing actinin's affinity for F-actin."
      explanation: States the direct consequence of an actin-binding-domain substitution on actin affinity.
- name: Increased Alpha-Actinin-1 Actin Cross-Linking Activity
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Mutant alpha-actinin-1 binds and bundles actin filaments more avidly than
    wild type. Nine calmodulin-like and rod-domain mutants were shown to increase
    filament bundling in vitro to varying degrees, two of them measurably
    increased the cytoskeletal association of actinin inside cells, and the
    actin-binding-domain mutants raise affinity for F-actin directly. The authors
    of that work read the convergence as a common molecular mechanism for
    ACTN1-linked macrothrombocytopenia, which is why this node sits on the main
    chain rather than being treated as one of several parallel biochemical
    consequences.
  molecular_functions:
  - preferred_term: actin filament binding
    modifier: INCREASED
    term:
      id: GO:0051015
      label: actin filament binding
  biological_processes:
  - preferred_term: actin crosslink formation
    modifier: INCREASED
    term:
      id: GO:0051764
      label: actin crosslink formation
  - preferred_term: actin filament bundle assembly
    modifier: INCREASED

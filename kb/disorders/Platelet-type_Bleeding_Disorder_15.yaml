mechanistic_hypotheses:
- hypothesis_group_id: actn1_increased_actin_association
  hypothesis_label: Disease alleles increase alpha-actinin-1 association with actin
  status: CANONICAL
  description: >-
    The account with direct biochemical support. Actin-binding-domain
    substitutions raise the affinity of alpha-actinin-1 for F-actin, and
    calmodulin-like and rod-domain substitutions raise its filament-bundling
    activity, so alleles scattered across three structurally distinct domains
    converge on a single measurable change in the same direction. Under this
    model the megakaryocyte actin network is over-cross-linked rather than
    under-cross-linked, and the proplatelet defect follows from a cytoskeleton
    too rigidly bundled to remodel normally.
  evidence:
  - reference: PMID:31365757
    reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, CMTP-causing actinin-1 mutations outside the actin-binding domain also increase actin association, suggesting a common molecular mechanism underlying actinin-1 related CMTP."
    explanation: The primary statement of the hypothesis by the group that measured it.
- hypothesis_group_id: actn1_loss_of_function
  hypothesis_label: Disease alleles act by loss of alpha-actinin-1 function or dominant-negative interference
  status: ALTERNATIVE
  description: >-
    The reading that the phenotype invites and that much secondary literature
    still repeats: if cross-linking is lost, or if mutant subunits poison
    wild-type dimers, the megakaryocyte cytoskeleton fails and platelet
    production suffers. It is not baseless - megakaryocyte-specific deletion of
    Actn1 in the mouse also produces a low platelet count through defective
    thrombocytopoiesis, so simply removing the protein reproduces part of the
    human picture. What it does not explain is why the human alleles increase
    rather than decrease actin association in vitro, and the knockout mouse
    additionally shows a platelet-function defect and impaired haemostasis that
    ACTN1-RT patients do not have. Kept as ALTERNATIVE rather than deprecated
    because no experiment has yet tested the two models against each other in a
    megakaryocyte carrying a patient allele.
  evidence:
  - reference: PMID:39813624
    reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using megakaryocyte (MK)-specific α-actinin-1 knockout (KO; PF4-Actn1-/-) mice, we demonstrated that PF4-Actn1-/- mice exhibited reduced platelet counts."
    explanation: >-
      Shows that absence of the protein is sufficient for thrombocytopenia, which
      is the strongest evidence available for a loss-of-function reading.
  - reference: PMID:39813624
    reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Platelet spreading, clot retraction, aggregation, integrin αIIbβ3 activation, and CD62P exposure in response to various agonists were decreased in PF4-Actn1-/- platelets."
    explanation: >-
      Cuts against the loss-of-function model as an account of the human disease:
      losing the protein produces a broad platelet-function defect, whereas
      ACTN1-RT platelets function normally.
phenotypes:
- category: Hematologic
  name: Thrombocytopenia
  description: >-
    Mild in nearly all reported carriers and moderate in the two reported
    homozygotes. It is the less penetrant of the two laboratory abnormalities:
    fewer than 80% of affected subjects in the largest assembled series had a low
    platelet count, so a normal count does not exclude the diagnosis in a family
    where the variant segregates.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
    clinical_course: STABLE
  evidence:
  - reference: PMID:30351444
    reference_title: ACTN1 mutations lead to a benign form of platelet macrocytosis not always associated with thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We concluded that ACTN1-RT is the fourth most frequent form of IT worldwide and it is characterized by platelet macrocytosis in all affected subjects and mild thrombocytopenia in less than 80% of cases."
    explanation: >-
      Supports the FREQUENT band directly: present in fewer than 80% of the 49
      carriers in the largest series, which falls in the 30-79% range.
  - reference: PMID:25361813
    reference_title: "ACTN1-related thrombocytopenia: identification of novel families for phenotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical and laboratory findings of 31 affected individuals confirmed that ACTN1-RT is a mild macrothrombocytopenia with low risk for bleeding."
    explanation: Independent confirmation that the thrombocytopenia is mild in an unselected cohort of 31 affected individuals.
- category: Hematologic
  name: Platelet Macrocytosis
  description: >-
    Enlarged platelets with a raised mean platelet volume. This is the more
    penetrant abnormality and in some families the only one, which is why the
    disorder has been described as a benign platelet macrocytosis that is not
    always accompanied by thrombocytopenia. It is not universal across the whole
    allelic spectrum: rod-domain variants raise platelet size less than variants
    elsewhere in the gene, and most carriers of rod-domain variants have normal
    platelet size.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Increased mean platelet volume
    term:
      id: HP:0011877
      label: Increased mean platelet volume
  evidence:
  - reference: PMID:30351444
    reference_title: ACTN1 mutations lead to a benign form of platelet macrocytosis not always associated with thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We concluded that ACTN1-RT is the fourth most frequent form of IT worldwide and it is characterized by platelet macrocytosis in all affected subjects and mild thrombocytopenia in less than 80% of cases."
    explanation: >-
      Macrocytosis was present in every affected subject in the 49-carrier series.
      The band is set at VERY_FREQUENT rather than OBLIGATE because the refuting
      item below shows it is not universal across all variant classes.
  - reference: PMID:31237726
    reference_title: Novel ACTN1 variants in cases of thrombocytopenia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The rod domain, like other ACTN1 functional domains, may be mutated resulting in actin disorganization in vitro and thrombocytopenia with normal platelet size in most cases."
    explanation: >-
      Contradicts platelet macrocytosis being an obligate feature: carriers of
      rod-domain variants mostly have normal platelet size. This is why the
      frequency band is not OBLIGATE.
  - reference: PMID:26453073
    reference_title: ACTN1 rod domain mutation associated with congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They showed a mild form of thrombocytopenia without severe bleeding, accompanied by an elevated mean platelet volume."
    explanation: A measured raised mean platelet volume in an affected mother and son, which is the parameter this phenotype is bound to.
- category: Hematologic
  name: Macrothrombocytopenia
  description: >-
    The composite finding by which the disorder is recognised on a full blood
    count and film - a reduced platelet count together with enlarged platelets.
    It is present from birth and stable across life; carriers are commonly
    identified incidentally or during family study rather than through bleeding.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
    clinical_course: STABLE
  evidence:
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with ACTN1 variants presented with moderate macrothrombocytopenia with anisocytosis but were either asymptomatic or had only a modest bleeding tendency."
    explanation: States the presenting composite phenotype in the discovery cohort.
  - reference: PMID:24069336
    reference_title: A missense mutation in the alpha-actinin 1 gene (ACTN1) is the cause of autosomal dominant macrothrombocytopenia in a large French family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 55 subjects available for analysis, 26 were diagnosed with isolated macrothrombocytopenia."
    explanation: >-
      Documents the same composite phenotype in 26 members of one pedigree, and
      the word isolated carries the additional point that it occurs without
      syndromic features.
- category: Hematologic
  name: Platelet Anisocytosis
  description: >-
    Marked variation in platelet size on the blood film, reported alongside the
    macrothrombocytopenia in the discovery series. It reflects the underlying
    lesion fairly directly: if proplatelet tips vary abnormally in size, so will
    the platelets shed from them.
  phenotype_term:
    preferred_term: Platelet anisocytosis
    term:
      id: HP:0032438
      label: Platelet anisocytosis
  evidence:
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with ACTN1 variants presented with moderate macrothrombocytopenia with anisocytosis but were either asymptomatic or had only a modest bleeding tendency."
    explanation: Records anisocytosis as a feature of the presenting blood picture.
- category: Hematologic
  name: Giant Platelets in Homozygous Carriers
  description: >-
    Reported only in the two homozygous sisters, whose platelets were not merely
    large but giant, alongside moderate rather than mild thrombocytopenia. Kept
    as a separate phenotype from the ordinary macrocytosis because it is a
    dosage-dependent finding restricted to the biallelic state.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Giant platelets
    term:
      id: HP:0001902
      label: Giant platelets
  evidence:
  - reference: PMID:38594875
    reference_title: "ACTN1-related thrombocytopenia: Homozygosity for an ACTN1 variant results in a more severe phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the reported family, the homozygous sisters have moderate thrombocytopenia and marked platelet macrocytosis with giant platelets, revealing a more severe haematological phenotype compared to their heterozygous relatives and highlighting a significant effect of allelic burden on platelet size."
    explanation: The only report of giant platelets in this disorder, and it is confined to the homozygous state.
- category: Hematologic
  name: Mild Mucocutaneous Bleeding Tendency
  description: >-
    Most carriers bleed no more than anyone else. Where symptoms occur they are
    mild and mucocutaneous, and the largest series concluded that the risk of
    bleeding, spontaneous or on haemostatic challenge, is negligible. This is the
    clinically operative fact about the disorder: it drives the advice given to
    patients and the decision not to treat.

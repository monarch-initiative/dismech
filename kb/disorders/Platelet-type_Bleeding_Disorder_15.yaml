inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Heterozygous ACTN1 missense variants segregate with macrothrombocytopenia in
    dominant pedigrees, demonstrated first in six Japanese families and then in a
    six-generation French kindred with 26 affected subjects. Penetrance is
    recorded as incomplete because the two components of the phenotype behave
    differently: in the largest assembled cohort platelet macrocytosis was
    present in every affected subject while thrombocytopenia was present in fewer
    than 80%, so a carrier with a normal platelet count is expected rather than
    anomalous. A homozygous variant has been reported in two sisters whose
    haematological phenotype was more severe than that of their heterozygous
    relatives, which makes the inheritance semidominant with a gene-dosage effect
    rather than strictly dominant, but the heterozygous state is itself fully
    disease-causing.
  evidence:
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 13 Japanese CMTP-affected pedigrees, we identified six (46%) affected by ACTN1 variants cosegregating with CMTP."
    explanation: Cosegregation of heterozygous ACTN1 variants with disease in dominantly transmitting pedigrees.
  - reference: PMID:24069336
    reference_title: A missense mutation in the alpha-actinin 1 gene (ACTN1) is the cause of autosomal dominant macrothrombocytopenia in a large French family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Candidate gene analysis complemented by targeted next-generation sequencing identified a missense mutation (c.137GA; p.Arg46Gln) in the alpha-actinin 1 gene (ACTN1) that segregated with macrothrombocytopenia in this large pedigree."
    explanation: Independent segregation of a single heterozygous allele through a six-generation dominant pedigree.
  - reference: PMID:30351444
    reference_title: ACTN1 mutations lead to a benign form of platelet macrocytosis not always associated with thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We concluded that ACTN1-RT is the fourth most frequent form of IT worldwide and it is characterized by platelet macrocytosis in all affected subjects and mild thrombocytopenia in less than 80% of cases."
    explanation: >-
      Supports incomplete penetrance of the thrombocytopenia component
      specifically - fewer than 80% of carriers have a low platelet count - while
      the macrocytosis component was universal in this series.
prevalence:
- population: Japanese pedigrees with congenital macrothrombocytopenia
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Diagnostic yield within a disease-class cohort, not a population rate. ACTN1
    variants accounted for 5.5% of dominant congenital macrothrombocytopenia in
    the Japanese cohort of the discovery study and ranked as the fourth most
    common cause there. Recorded with measure_type UNKNOWN because none of the
    available measure types describes a share of a cohort of patients with a
    related disease, which is the only quantitative epidemiology this disorder
    has.
  evidence:
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

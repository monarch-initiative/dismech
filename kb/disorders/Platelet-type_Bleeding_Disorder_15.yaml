- name: Reduced Platelet Output with Increased Platelet Size
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The circulating result: a platelet population reduced in number, enlarged,
    and unusually variable in size. What does not follow is a functional defect.
    Aggregation and secretion responses are preserved in ACTN1-RT, so the
    mechanism ends at a quantitative and morphological abnormality, and the small
    bleeding tendency that follows is proportionate to the platelet count rather
    than amplified by a platelet-function defect. That is the single feature that
    most distinguishes this disorder from the rest of the OMIM platelet-type
    bleeding disorder series.

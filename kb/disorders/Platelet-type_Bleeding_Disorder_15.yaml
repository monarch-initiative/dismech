      label: actin filament bundle assembly
  evidence:
  - reference: PMID:31365757
    reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, we examined nine CMTP-causing mutations in the calmodulin-like and rod domains of actinin-1. These mutations increase, to varying degrees, actinin's ability to bundle actin filaments in vitro."
    explanation: Direct biochemical measurement of increased bundling activity for disease alleles outside the actin-binding domain.
  - reference: PMID:31365757
    reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, CMTP-causing actinin-1 mutations outside the actin-binding domain also increase actin association, suggesting a common molecular mechanism underlying actinin-1 related CMTP."
    explanation: The authors' own statement that increased actin association is the shared mechanism across domains.
  - reference: PMID:41153762
    reference_title: "α-Actinin-1 in Megakaryocytes: Its Structure, Interacting Proteins and Implications for Thrombopoiesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathophysiological mechanisms by which α-actinin-1 mutations lead to macrothrombocytopenia have been attributed to alterations in actin organization, increased binding affinity of α-actinin-1 to actin filaments, and modulation of integrin αIIbβ3 signaling."
    explanation: >-
      A review's summary of the field, cited to show that increased actin binding
      is an accepted account rather than a single group's result. Graded OTHER
      because the source is a narrative review, not primary data.
  downstream:
  - target: Disorganized Megakaryocyte Actin Cytoskeleton
    description: >-
      Excessive cross-linking distorts the actin network that mutant-expressing
      cells assemble.
    causal_link_type: DIRECT
- name: Disorganized Megakaryocyte Actin Cytoskeleton
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Expression of a disease-associated ACTN1 allele disorganises the actin
    cytoskeleton. The finding is unusually well replicated for a rare disorder:
    it has been reproduced in Chinese hamster ovary cells for actin-binding and
    calmodulin-domain alleles, in the same system for a rod-domain allele, in
    COS-7 cells and cultured megakaryocytes for the French p.Arg46Gln allele, and
    in the expression work accompanying the largest variant series, where the
    network was disorganised and the fibres themselves were thicker. Thickened
    fibres are the morphological counterpart of the increased bundling measured
    biochemically upstream.

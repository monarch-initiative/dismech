- name: Biallelic ACTN1 Variant Dosage Effect
  biological_scale: MOLECULAR
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    Two sisters homozygous for ACTN1 c.982G>A had moderate thrombocytopenia and
    marked platelet macrocytosis with giant platelets, a more severe
    haematological picture than their heterozygous relatives in the same family.
    Carrying twice the dose of mutant protein therefore worsens the phenotype
    quantitatively without changing its character, which is what a
    gain-of-actin-association mechanism predicts. It is curated as a PROVISIONAL
    modifier rather than a step in the chain because it rests on a single family
    with two homozygotes.
  genes:
  - preferred_term: ACTN1
    term:
      id: hgnc:163
      label: ACTN1
  genetic_context:
    variant_origin: GERMLINE
    description: >-
      A single reported homozygous missense allele, c.982G>A. Homozygosity for an
      ACTN1 disease allele is otherwise unreported, so nothing is known about
      whether the dosage effect generalises across alleles.
  evidence:
  - reference: PMID:38594875
    reference_title: "ACTN1-related thrombocytopenia: Homozygosity for an ACTN1 variant results in a more severe phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the reported family, the homozygous sisters have moderate thrombocytopenia and marked platelet macrocytosis with giant platelets, revealing a more severe haematological phenotype compared to their heterozygous relatives and highlighting a significant effect of allelic burden on platelet size."
    explanation: >-
      Within-family comparison of homozygotes against heterozygotes, which
      controls for genetic background better than a cross-cohort comparison would.
  downstream:
  - target: Reduced Platelet Output with Increased Platelet Size
    description: >-
      A larger dose of mutant protein produces a quantitatively larger version of
      the same output defect.
    causal_link_type: DIRECT
  - target: Giant Platelets in Homozygous Carriers
    causal_link_type: DIRECT
  - target: Mild Heart Valve Defects in Homozygous Carriers
    description: >-
      Advanced by the reporting authors as a hypothesis, not a demonstrated link -
      the association rests on two related patients in whom exome sequencing found
      no alternative explanation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38594875
      reference_title: "ACTN1-related thrombocytopenia: Homozygosity for an ACTN1 variant results in a more severe phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Moreover, we hypothesize that some ACTN1 variants, especially when present in the homozygous state, may also contribute to the cardiac abnormalities."

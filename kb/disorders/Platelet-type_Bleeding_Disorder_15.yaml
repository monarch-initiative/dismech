  phenotype_term:
    preferred_term: Mild mucocutaneous bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: PMID:31237726
    reference_title: Novel ACTN1 variants in cases of thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-eight of 32 cases with monoallelic ACTN1 variants had mild to no bleeding complications."
    explanation: >-
      The quantitative basis for the OCCASIONAL band - 4 of 32 carriers had more
      than mild bleeding, and the remainder had mild bleeding or none.
  - reference: PMID:30351444
    reference_title: ACTN1 mutations lead to a benign form of platelet macrocytosis not always associated with thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of bleeding, either spontaneous or upon haemostatic challenge, is negligible and there are no other associated defects, either congenital or acquired."
    explanation: >-
      The strongest statement of mildness available, and it also excludes
      associated congenital or acquired defects in the 49-carrier series.
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with ACTN1 variants presented with moderate macrothrombocytopenia with anisocytosis but were either asymptomatic or had only a modest bleeding tendency."
    explanation: Independent statement of the same mildness in the discovery cohort.
- category: Cardiovascular
  name: Mild Heart Valve Defects in Homozygous Carriers
  description: >-
    Two homozygous sisters had mild heart valve defects for which exome
    sequencing found no other genetic explanation, and the reporting authors
    raised the possibility that ACTN1 variants in the homozygous state contribute
    to them. This is curated because it is the only report of an
    extra-haematological feature in a disorder repeatedly described as having
    none, and it should be read as an open question rather than an established
    part of the phenotype - two related patients, an
    absence-of-alternative-explanation argument, and an explicitly hypothetical
    claim by the authors.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Mild heart valve defect
    term:
      id: HP:0001654
      label: Abnormal heart valve morphology
  evidence:
  - reference: PMID:38594875
    reference_title: "ACTN1-related thrombocytopenia: Homozygosity for an ACTN1 variant results in a more severe phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe for the first time two patients affected with ACTN1-RT caused by a homozygous variant in ACTN1 (c.982G>A) with mild heart valve defects unexplained by any other genetic variants investigated by WES."
    explanation: The observation itself, including its limits - two patients, and a negative-exome argument for attribution.
  - reference: PMID:30351444
    reference_title: ACTN1 mutations lead to a benign form of platelet macrocytosis not always associated with thrombocytopenia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of bleeding, either spontaneous or upon haemostatic challenge, is negligible and there are no other associated defects, either congenital or acquired."
    explanation: >-
      The 49-carrier series found no associated defects of any kind, which is
      evidence against valve disease being a feature of the disorder in the
      heterozygous state.
diagnosis:
- name: Full blood count with peripheral blood film
  description: >-
    The test that finds the disease. A persistently low platelet count with a
    raised mean platelet volume, enlarged platelets and marked size variation on
    the film, in someone without systemic illness, is the trigger for considering
    an inherited thrombocytopenia. A film matters as well as the count, because
    automated counters can under-report platelets large enough to fall outside
    the platelet gate.
  evidence:
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with ACTN1 variants presented with moderate macrothrombocytopenia with anisocytosis but were either asymptomatic or had only a modest bleeding tendency."
    explanation: Describes the blood-count and film picture that leads to the diagnosis, and the absence of symptoms to prompt it.
- name: ACTN1 sequencing
  description: >-
    The confirmatory test, done as a targeted gene panel for inherited
    thrombocytopenia, as single-gene sequencing, or as exome sequencing when the
    picture is unexplained. Because disease alleles are largely private missense
    variants scattered across the whole coding sequence rather than recurrent
    hotspots, the entire gene is sequenced. The yield in a referral population is
    high enough to justify including ACTN1 in any inherited-thrombocytopenia
    panel.
  evidence:
  - reference: PMID:31237726
    reference_title: Novel ACTN1 variants in cases of thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To decipher the spectrum of variants and phenotype of ACTN1-related thrombocytopenia, we sequenced the ACTN1 gene in 272 cases of unexplained chronic or familial thrombocytopenia."
    explanation: Establishes targeted ACTN1 sequencing of unexplained thrombocytopenia as the diagnostic approach in practice.
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We herein performed whole-exome sequencing and targeted Sanger sequencing to identify mutations that cause CMTP, in which a dominant mode of transmission had been suspected but for which no known responsible mutations have been documented."
    explanation: The exome route, which is what is used when the gene is not yet suspected.
- name: Reticulated platelet count and serum thrombopoietin
  description: >-
    Not required for diagnosis, but the pair of measurements that distinguishes a
    production defect from peripheral destruction. In ACTN1-RT the reticulated
    platelet count is low and thrombopoietin only slightly raised - the profile
    of impaired late platelet release, and the opposite of what immune
    thrombocytopenia would give.
  evidence:
  - reference: PMID:25361813
    reference_title: "ACTN1-related thrombocytopenia: identification of novel families for phenotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low reticulated platelet counts and only slightly increased serum thrombopoietin levels indicated that the latest phases of megakaryopoiesis were affected."
    explanation: The measurements and the inference the authors drew from them.
differential_diagnoses:
- name: MYH9-related disease
  description: >-
    The macrothrombocytopenia most often confused with this one, and the reason a
    film report of large platelets is not by itself a diagnosis. MYH9-related
    disease is also autosomal dominant and also presents with large platelets,
    but it carries leukocyte inclusions and a lifetime risk of nephropathy,
    sensorineural hearing loss and early-onset cataract - none of which occurs in
    ACTN1-RT. The distinction determines whether the patient needs lifelong renal
    and audiological surveillance or reassurance.
  distinguishing_features:
  - Leukocyte cytoplasmic inclusions on the blood film
  - Progressive nephropathy, sensorineural hearing loss and early-onset cataract
  - Absence of any extra-haematological feature in heterozygous ACTN1-RT
  evidence:
  - reference: PMID:30471777
    reference_title: MYH9 Associated nephropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is characterized by the presence of macrothrombocytopenia, leukocyte inclusions and a variable risk of developing renal failure, hearing loss and early-onset cataracts."
    explanation: Names both the shared feature that creates the confusion and the features that resolve it.
  - reference: PMID:30351444
    reference_title: ACTN1 mutations lead to a benign form of platelet macrocytosis not always associated with thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of bleeding, either spontaneous or upon haemostatic challenge, is negligible and there are no other associated defects, either congenital or acquired."
    explanation: The other half of the contrast - no associated defects in ACTN1-RT, where MYH9 disease accumulates them.
- name: Immune thrombocytopenia
  description: >-
    The misdiagnosis that matters, because it is treated. A lifelong stable
    macrothrombocytopenia mistaken for immune thrombocytopenia attracts
    corticosteroids, immunosuppression and occasionally splenectomy, none of
    which can help a defect of platelet production. Two findings separate them: a
    family history with the same blood picture, and a low reticulated platelet
    count with near-normal thrombopoietin, which is a production profile rather
    than a destruction profile.
  distinguishing_features:
  - Lifelong stable course with an affected first-degree relative
  - Low reticulated platelet count and only slightly increased serum thrombopoietin
  - Enlarged platelets with anisocytosis rather than a normal platelet size distribution
  evidence:
  - reference: PMID:30471777
    reference_title: MYH9 Associated nephropathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the case of a 27-year-old Caucasian woman, diagnosed initially with idiopathic thrombocytopenic purpura."
    explanation: >-
      Documents that an inherited macrothrombocytopenia is misdiagnosed as immune
      thrombocytopenia in practice. Marked INDIRECT because the reported patient
      had MYH9-related disease, not ACTN1-RT, so the quote supports the general
      diagnostic trap rather than a case of this disorder.
  - reference: PMID:25361813
    reference_title: "ACTN1-related thrombocytopenia: identification of novel families for phenotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low reticulated platelet counts and only slightly increased serum thrombopoietin levels indicated that the latest phases of megakaryopoiesis were affected."
    explanation: Provides the laboratory discriminator - a production defect, where immune thrombocytopenia is a destruction process.
- name: Other inherited thrombocytopenias
  description: >-
    ACTN1-RT sits inside a differential of dozens of inherited thrombocytopenias,
    and its practical significance is that it is common enough within that group
    to be worth testing for early. The others that most need excluding are
    Bernard-Soulier syndrome, which is recessive and bleeds far more severely,
    and ANKRD26- and ETV6-related thrombocytopenia, which carry a risk of myeloid
    malignancy that ACTN1-RT does not.
  distinguishing_features:
  - Severe mucocutaneous bleeding and absent ristocetin-induced agglutination in Bernard-Soulier syndrome
  - Predisposition to myeloid malignancy in ANKRD26- and ETV6-related thrombocytopenia
  - Normal platelet function testing in ACTN1-RT
  evidence:
  - reference: PMID:25361813
    reference_title: "ACTN1-related thrombocytopenia: identification of novel families for phenotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given its relatively high frequency in our cohort (4.2%), ACTN1-RT has to be taken into consideration in the differential diagnosis of ITs."
    explanation: >-
      States the disorder's place in the inherited-thrombocytopenia differential
      and the frequency argument for testing it early.
treatments:
- name: Genetic diagnosis and counselling
  description: >-
    The main intervention this disorder needs, and it is informational. Making
    the molecular diagnosis converts an unexplained low platelet count into a
    benign trait with a known prognosis, stops immunosuppression and splenectomy
    being considered, and lets first-degree relatives with the same blood picture
    be explained rather than investigated repeatedly. Autosomal dominant
    transmission means a 50% recurrence risk per pregnancy for a heterozygous
    carrier, which is what counselling covers.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  target_phenotypes:
  - preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
  evidence:
  - reference: PMID:30351444
    reference_title: ACTN1 mutations lead to a benign form of platelet macrocytosis not always associated with thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, ACTN1-RT is a benign form of IT, whose diagnosis provides affected individuals and their families with a good prognosis."
    explanation: >-
      States the benefit of diagnosis in exactly these terms - prognostic
      information for the individual and the family.
  - reference: PMID:25361813
    reference_title: "ACTN1-related thrombocytopenia: identification of novel families for phenotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given its relatively high frequency in our cohort (4.2%), ACTN1-RT has to be taken into consideration in the differential diagnosis of ITs."
    explanation: Supports testing for the disorder as part of the diagnostic pathway this intervention depends on.
- name: Observation without disease-specific therapy
  description: >-
    No treatment targets the mechanism, and in the great majority of carriers
    none is needed. The largest series found the bleeding risk negligible both
    spontaneously and under haemostatic challenge, so the default management is
    observation with advice about antiplatelet drugs and a plan for surgery
    rather than any ongoing therapy. Haemostatic support around procedures is
    discussed in this entry's notes; it is standard practice for inherited
    thrombocytopenia rather than an ACTN1-specific recommendation, and no
    published series reports its use in this disorder.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Mild mucocutaneous bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: PMID:30351444
    reference_title: ACTN1 mutations lead to a benign form of platelet macrocytosis not always associated with thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of bleeding, either spontaneous or upon haemostatic challenge, is negligible and there are no other associated defects, either congenital or acquired."
    explanation: >-
      The evidential basis for not treating: negligible bleeding risk even under
      haemostatic challenge, and no other defects to monitor for.
  - reference: PMID:25361813
    reference_title: "ACTN1-related thrombocytopenia: identification of novel families for phenotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical and laboratory findings of 31 affected individuals confirmed that ACTN1-RT is a mild macrothrombocytopenia with low risk for bleeding."
    explanation: Independent cohort evidence that the low bleeding risk is a property of the disorder rather than of one series.
experimental_models:
- name: Mouse fetal liver-derived megakaryocytes transduced with disease-associated ACTN1 variants
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:23434115
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_types:
  - preferred_term: Megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  description: >-
    Primary megakaryocytes cultured from mouse fetal liver and transduced with
    human disease-associated ACTN1 alleles. It remains the only system in which
    the disease alleles have been shown to change proplatelet architecture, and
    it is the source of the mechanistic claim at the centre of this entry.
  evidence:
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, transduction of mouse fetal liver-derived megakaryocytes with disease-associated ACTN1 variants caused a disorganized actin-based cytoskeleton in megakaryocytes, resulting in the production of abnormally large proplatelet tips, which were reduced in number."
    explanation: Establishes that this culture system exists and was used to express disease-associated ACTN1 alleles in megakaryocytes.
  modeled_mechanisms:
  - target: Impaired Proplatelet Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces both halves of the predicted output defect in a megakaryocyte -
      fewer proplatelet tips, and tips that are abnormally large.
    limitations: >-
      Mouse rather than human megakaryocytes, from fetal liver rather than adult
      marrow, and the human allele is introduced by transduction on top of two
      normal mouse Actn1 alleles, so the stoichiometry is not that of a
      heterozygous patient. Proplatelet tips are counted in culture without the
      marrow sinusoidal shear that shapes platelet release in vivo, and the size
      of the platelets actually shed was not measured.
    readouts:
    - name: Proplatelet tip number
      target: Impaired Proplatelet Formation
      direction: DECREASED
      interpretation: Fewer release sites per megakaryocyte, the cellular correlate of the low platelet count.
      evidence:
      - reference: PMID:23434115
        reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, transduction of mouse fetal liver-derived megakaryocytes with disease-associated ACTN1 variants caused a disorganized actin-based cytoskeleton in megakaryocytes, resulting in the production of abnormally large proplatelet tips, which were reduced in number."
        explanation: The measurement of reduced tip number.
    - name: Proplatelet tip size
      target: Impaired Proplatelet Formation
      direction: INCREASED
      interpretation: Larger release sites, the cellular correlate of the enlarged platelets.
      evidence:
      - reference: PMID:23434115
        reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, transduction of mouse fetal liver-derived megakaryocytes with disease-associated ACTN1 variants caused a disorganized actin-based cytoskeleton in megakaryocytes, resulting in the production of abnormally large proplatelet tips, which were reduced in number."
        explanation: The same sentence reports tip size; it is the only published measurement of this readout.
    evidence:
    - reference: PMID:23434115
      reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, transduction of mouse fetal liver-derived megakaryocytes with disease-associated ACTN1 variants caused a disorganized actin-based cytoskeleton in megakaryocytes, resulting in the production of abnormally large proplatelet tips, which were reduced in number."
      explanation: Establishes the model as informative for the proplatelet node - it carries a disease allele and reports the proplatelet phenotype.
- name: Chinese hamster ovary cells expressing mutant ACTN1
  experimental_model_type: CELL_LINE
  publication: PMID:23434115
  description: >-
    The workhorse assay of this field. Mutant alpha-actinin-1 is expressed in
    Chinese hamster ovary cells and the actin cytoskeleton is imaged. Its value
    is throughput and reproducibility across laboratories - the same readout has
    been applied to actin-binding-domain, calmodulin-domain and spectrin-repeat
    alleles and gives the same answer - rather than physiological fidelity.
  evidence:
  - reference: PMID:23434115
    reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro transfection experiments in Chinese hamster ovary cells demonstrated that altered α-actinin-1 disrupted the normal actin-based cytoskeletal structure."
    explanation: Establishes the assay system and the result that made it the standard test for a candidate ACTN1 variant.
  modeled_mechanisms:
  - target: Disorganized Megakaryocyte Actin Cytoskeleton
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Reproduces the actin disorganisation caused by disease alleles, and is the
      assay by which most reported variants have been called deleterious.
    limitations: >-
      Chinese hamster ovary cells are non-haematopoietic fibroblast-like cells
      with no megakaryocyte biology at all - no polyploidisation, no demarcation
      membrane system, no proplatelets - so the model shows that the mutant
      protein can disorganise an actin network, not that it disorganises the
      specific circumferential network a megakaryocyte uses to make platelets.
      Expression is heterologous and typically above endogenous levels.
    readouts:
    - name: Actin cytoskeletal organisation on immunofluorescence
      target: Disorganized Megakaryocyte Actin Cytoskeleton
      direction: ALTERED
      interpretation: Disorganised actin filament architecture in cells expressing a disease allele.
      evidence:
      - reference: PMID:26453073
        reference_title: ACTN1 rod domain mutation associated with congenital macrothrombocytopenia.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Consistent with the previous reports of mutations that reside in the ABD or the CaM domain, immunofluorescence examination revealed disorganization of the actin cytoskeleton in Gln395 mutant-transduced Chinese hamster ovary cells."
        explanation: The readout as applied to a rod-domain allele, and its agreement with earlier alleles.
    evidence:
    - reference: PMID:23434115
      reference_title: ACTN1 mutations cause congenital macrothrombocytopenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro transfection experiments in Chinese hamster ovary cells demonstrated that altered α-actinin-1 disrupted the normal actin-based cytoskeletal structure."
      explanation: Establishes the assay as informative for the actin-disorganisation node.
- name: In vitro actin bundling assays with recombinant mutant alpha-actinin-1
  experimental_model_type: OTHER
  publication: PMID:31365757
  description: >-
    Purified recombinant alpha-actinin-1 carrying disease substitutions, assayed
    for filament bundling and for actin association, plus imaging of mutant
    protein in cultured HeLa cells. This is the only system that measures the
    direction of the biochemical change rather than inferring it from morphology,
    and it is why this entry curates the lesion as increased rather than
    decreased actin association.
  evidence:
  - reference: PMID:31365757
    reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, CMTP-causing actinin-1 mutations outside the actin-binding domain also increase actin association, suggesting a common molecular mechanism underlying actinin-1 related CMTP."
    explanation: Establishes the cell-free assay system and the conclusion the authors drew from it.
  modeled_mechanisms:
  - target: Increased Alpha-Actinin-1 Actin Cross-Linking Activity
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Quantifies filament bundling by nine calmodulin-like and rod-domain mutants
      and the cytoskeletal association of mutant protein in cells.
    limitations: >-
      A cell-free system with purified protein and F-actin, so it reports the
      intrinsic property of the mutant protein rather than its behaviour in a
      megakaryocyte, where actin dynamics are shaped by many competing
      cross-linkers and by calcium signalling. The cellular arm uses HeLa cells,
      which are as remote from megakaryocytes as Chinese hamster ovary cells are.
    readouts:
    - name: Actin filament bundling activity
      target: Increased Alpha-Actinin-1 Actin Cross-Linking Activity
      direction: INCREASED
      interpretation: Disease alleles bundle actin filaments more effectively than wild-type protein.
      evidence:
      - reference: PMID:31365757
        reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In this study, we examined nine CMTP-causing mutations in the calmodulin-like and rod domains of actinin-1. These mutations increase, to varying degrees, actinin's ability to bundle actin filaments in vitro."
        explanation: The bundling measurement itself, across nine disease alleles.
    - name: Cytoskeletal association of mutant actinin in cells
      target: Increased Alpha-Actinin-1 Actin Cross-Linking Activity
      direction: INCREASED
      interpretation: Two mutants show increased association with the cellular cytoskeleton, extending the cell-free result into cells.
      evidence:
      - reference: PMID:31365757
        reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The G764S and E769K mutations increase cytoskeletal association of actinin in cells, and all mutant proteins colocalize with F-actin in cultured HeLa cells."
        explanation: >-
          Names the two alleles for which the increase was demonstrated in cells;
          the remaining seven were shown only to colocalise with F-actin.
    evidence:
    - reference: PMID:31365757
      reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, CMTP-causing actinin-1 mutations outside the actin-binding domain also increase actin association, suggesting a common molecular mechanism underlying actinin-1 related CMTP."
      explanation: Establishes the assay as informative for the cross-linking node and states the conclusion drawn from it.
animal_models:
- name: Megakaryocyte-specific alpha-actinin-1 knockout mouse (PF4-Actn1-/-)
  species: Mouse
  genotype: Actn1 conditional knockout crossed to PF4-Cre, giving megakaryocyte-lineage deletion
  publication: PMID:39813624
  genes:
  - preferred_term: ACTN1
    term:
      id: hgnc:163
      label: ACTN1
  description: >-
    The only in vivo model of altered megakaryocyte alpha-actinin-1. It deletes
    the protein in the megakaryocyte lineage, which is a different genetic lesion
    from the human disease: patients are heterozygous for missense alleles whose
    measured effect is increased actin association, not absence of protein. The
    model is therefore informative about what alpha-actinin-1 is needed for in
    thrombocytopoiesis, and only partly informative about ACTN1-RT.
  evidence:
  - reference: PMID:39813624
    reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using megakaryocyte (MK)-specific α-actinin-1 knockout (KO; PF4-Actn1-/-) mice, we demonstrated that PF4-Actn1-/- mice exhibited reduced platelet counts."
    explanation: Establishes that this mouse line exists and states its principal haematological phenotype.
  modeled_mechanisms:
  - target: Impaired Proplatelet Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Reproduces the low platelet count and traces it to defective
      thrombocytopoiesis, including a reduced proportion of megakaryocytes
      bearing proplatelets - the same cellular step this node names.
    limitations: >-
      A knockout, not a knock-in of a patient allele, so it models absence of
      alpha-actinin-1 rather than the gain of actin association the human alleles
      produce, and the two predict opposite effects on cross-linking. The
      knockout mice also have reduced megakaryocyte numbers and shifted
      megakaryocyte ploidy, which patients are not reported to have.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The human lesion is a heterozygous missense substitution that increases
        alpha-actinin-1 association with F-actin. The model removes the protein
        from the lineage entirely, so the specific molecular cause curated
        upstream in this entry is not present in the model at all.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse megakaryopoiesis differs from human in platelet size distribution
        and marrow kinetics, and mouse platelets are smaller, so a platelet-size
        phenotype measured in the mouse is not directly comparable with human
        mean platelet volume.
    readouts:
    - name: Proportion of megakaryocytes forming proplatelets
      target: Impaired Proplatelet Formation
      direction: DECREASED
      interpretation: Fewer megakaryocytes extend proplatelets when alpha-actinin-1 is absent.
      evidence:
      - reference: PMID:39813624
        reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Colony-forming unit-MK colony formation, the ratio of proplatelet formation-bearing MKs, and MK migration in response to stromal cell-derived factor-1 signaling were inhibited in PF4-Actn1-/- mice."
        explanation: The measurement of reduced proplatelet-forming megakaryocytes.
    - name: Peripheral platelet count
      target: Impaired Proplatelet Formation
      direction: DECREASED
      interpretation: The organism-level consequence of the thrombocytopoiesis defect.
      evidence:
      - reference: PMID:39813624
        reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The decreased platelet number in PF4-Actn1-/- mice was due to defects in thrombocytopoiesis."
        explanation: States both the platelet-count phenotype and its attribution to thrombocytopoiesis rather than to platelet destruction.
    evidence:
    - reference: PMID:39813624
      reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using megakaryocyte (MK)-specific α-actinin-1 knockout (KO; PF4-Actn1-/-) mice, we demonstrated that PF4-Actn1-/- mice exhibited reduced platelet counts."
      explanation: Establishes the model and the platelet phenotype that makes it relevant to this node.
  - target: Reduced Platelet Output with Increased Platelet Size
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The node asserts reduced platelet output with preserved platelet function.
      The knockout mouse has the reduced output but not the preserved function:
      spreading, clot retraction, aggregation, integrin activation and granule
      release are all impaired, and haemostasis is impaired in vivo. Human
      ACTN1-RT is defined partly by the absence of exactly those abnormalities.
    limitations: >-
      Complete absence of alpha-actinin-1 from the lineage removes a scaffold the
      mature platelet needs for integrin signalling and spreading, which a
      heterozygous missense allele does not. The discrepancy is therefore
      expected from the genetics and does not impugn the model; it means the
      model cannot be used to argue about bleeding risk or platelet function in
      patients.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: INVALIDATING
      description: >-
        Knockout of the gene versus a heterozygous gain-of-actin-association
        missense allele. For the claim that platelet function is preserved, this
        difference is not a caveat but a reversal - the model reports the
        opposite of the human finding, and cannot be cited for it.
    evidence:
    - reference: PMID:39813624
      reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Platelet spreading, clot retraction, aggregation, integrin αIIbβ3 activation, and CD62P exposure in response to various agonists were decreased in PF4-Actn1-/- platelets."
      explanation: >-
        The platelet-function defect that the human disorder lacks, which is what
        makes this a failure to recapitulate rather than a partial success.
    - reference: PMID:39813624
      reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, the PF4-Actn1-/- mice exhibited impaired hemostasis and thrombosis."
      explanation: >-
        The whole-animal consequence of that function defect, again absent from
        the human disorder, where bleeding risk is negligible.
discussions:
- discussion_id: bdplt15_gain_versus_loss_of_actin_association
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does ACTN1-related thrombocytopenia arise because mutant alpha-actinin-1
    binds and bundles actin too strongly, or because it fails to cross-link actin
    normally?
  attaches_to:
  - "pathophysiology#Increased Alpha-Actinin-1 Actin Cross-Linking Activity"
  - "mechanistic_hypotheses#actn1_increased_actin_association"
  rationale: >-
    Every biochemical measurement points one way and much of the descriptive
    literature points the other. Purified mutant proteins bind F-actin more
    avidly and bundle filaments more effectively, across substitutions in three
    different domains, and the authors of that work explicitly propose increased
    actin association as the common mechanism. Yet the disease is routinely
    summarised as a loss of actin cross-linking or a dominant-negative effect,
    including by the deep-research report that seeded this entry, presumably
    because a cytoskeleton that fails to make platelets reads intuitively as a
    cytoskeleton that has lost a function. The distinction is not cosmetic: an
    over-bundled network and an under-bundled network make opposite predictions
    about what a heterozygous knock-in should show relative to a heterozygous
    knockout, and would call for opposite interventions if any were ever wanted.
    No published experiment compares them in a megakaryocyte, and the one in vivo
    model is a complete knockout, which by construction cannot distinguish them.
  evidence:
  - reference: PMID:31365757
    reference_title: Investigation of calmodulin-like and rod domain mutations suggests common molecular mechanism for α-actinin-1-linked congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Actinin-1 mutations cause dominantly inherited congenital macrothrombocytopenia (CMTP), with mutations in the actin-binding domain increasing actinin's affinity for F-actin."
    explanation: The measured direction of the biochemical change, which is what puts it at odds with the loss-of-function reading this gap is about.
  proposed_experiments:
  - experiment_id: exp_bdplt15_knockin_versus_knockout_megakaryocytes
    name: Heterozygous knock-in versus heterozygous knockout megakaryocytes
    description: >-
      Generate isogenic human induced pluripotent stem cell lines carrying a
      patient ACTN1 missense allele heterozygously and, separately, a
      heterozygous ACTN1 null allele, differentiate both to megakaryocytes, and
      compare actin network architecture, proplatelet tip number and size, and
      released platelet size. A knock-in phenotype the null does not reproduce
      would establish that the allele acts by more than reduced dosage.
    would_support:
    - "mechanistic_hypotheses#actn1_increased_actin_association"
    supporting_outcome:
    - >-
        The missense knock-in shows thickened, over-bundled actin and fewer, larger
        proplatelet tips while the heterozygous null is close to wild type.
    would_refute:
    - "mechanistic_hypotheses#actn1_increased_actin_association"
    refuting_outcome:
    - >-
        The heterozygous null reproduces the knock-in phenotype, indicating that
        reduced functional alpha-actinin-1 dosage is sufficient.
- discussion_id: bdplt15_knockout_mouse_versus_human_disease
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can a megakaryocyte-specific Actn1 knockout mouse be used to reason about
    ACTN1-related thrombocytopenia, when it produces a platelet-function defect
    and impaired haemostasis that patients do not have?
  attaches_to:
  - "animal_models#Megakaryocyte-specific alpha-actinin-1 knockout mouse (PF4-Actn1-/-)"
  - "pathophysiology#Reduced Platelet Output with Increased Platelet Size"
  rationale: >-
    The knockout mouse is the only in vivo system available, and it does
    reproduce the low platelet count and locate the defect in thrombocytopoiesis.
    But it also shows impaired platelet spreading, clot retraction, aggregation,
    integrin alphaIIbbeta3 activation and granule release, plus impaired
    haemostasis and thrombosis and a mitochondrial phenotype - none of which is
    described in ACTN1-RT, whose defining clinical feature is that platelet
    function is normal and bleeding negligible. Two readings are possible and
    they have different consequences. Either the mismatch follows
    straightforwardly from the genetic difference, complete absence of protein
    versus one altered allele, in which case the mouse tells us about the gene's
    requirements and nothing about patients' bleeding risk. Or alpha-actinin-1
    also has a platelet-function role that is subtly impaired in patients and has
    not been looked for with sensitive enough assays, in which case the received
    statement that platelet function is normal in ACTN1-RT rests on aggregometry
    that would not detect it. Nobody has phenotyped patients' platelets with the
    assays used in the mouse.
  evidence:
  - reference: PMID:39813624
    reference_title: α-Actinin-1 deficiency in megakaryocytes causes low platelet count, platelet dysfunction, and mitochondrial impairment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Platelet spreading, clot retraction, aggregation, integrin αIIbβ3 activation, and CD62P exposure in response to various agonists were decreased in PF4-Actn1-/- platelets."
    explanation: The model finding that human patients are not reported to share, which is the mismatch this discussion is about.
  proposed_experiments:
  - experiment_id: exp_bdplt15_patient_platelet_deep_phenotyping
    name: Deep platelet phenotyping in ACTN1-RT carriers
    description: >-
      Apply the assays that were abnormal in the knockout mouse - spreading on
      fibrinogen, clot retraction, integrin alphaIIbbeta3 activation and
      P-selectin exposure by flow cytometry, and mitochondrial membrane
      potential - to platelets from genotyped ACTN1-RT carriers and matched
      controls, rather than relying on light transmission aggregometry alone.
    would_support:
    - "pathophysiology#Reduced Platelet Output with Increased Platelet Size"
    supporting_outcome:
    - >-
        Carrier platelets are indistinguishable from controls across the sensitive
        assays, confirming that the human defect is purely one of platelet
        production.
    refuting_outcome:
    - >-
        Carrier platelets show measurable spreading, integrin activation or granule
        release defects, indicating that ACTN1-RT has a subclinical qualitative
        component that routine testing misses.
- discussion_id: bdplt15_cardiac_valve_association
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do ACTN1 variants, in the homozygous state, cause heart valve defects, or is
    the reported association coincidental?
  attaches_to:
  - "phenotypes#Mild Heart Valve Defects in Homozygous Carriers"
  - "pathophysiology#Biallelic ACTN1 Variant Dosage Effect"
  rationale: >-
    ACTN1-RT is described in the largest series as having no associated defects,
    congenital or acquired. Against that, two homozygous sisters had mild heart
    valve defects with no alternative explanation on exome sequencing, and the
    reporting authors hypothesised an ACTN1 contribution. The evidence is two
    related individuals and a negative-exome argument, which cannot distinguish
    causation from coincidence within one family, and mild valve abnormalities
    are common enough in the general population that two cases are not a signal.
    The question is worth keeping open rather than dismissing because
    alpha-actinin-1 is expressed well beyond the megakaryocyte, and a
    dosage-dependent extra-haematological phenotype appearing only in homozygotes
    is what a mild gain-of-binding allele would be expected to produce if it
    produced one at all.
  evidence:
  - reference: PMID:38594875
    reference_title: "ACTN1-related thrombocytopenia: Homozygosity for an ACTN1 variant results in a more severe phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, we hypothesize that some ACTN1 variants, especially when present in the homozygous state, may also contribute to the cardiac abnormalities."
    explanation: The authors state the cardiac claim as a hypothesis, which is exactly the uncertainty recorded here.
  proposed_experiments:
  - experiment_id: exp_bdplt15_echocardiography_in_carriers
    name: Systematic echocardiography in ACTN1 variant carriers
    description: >-
      Echocardiograph an unselected cohort of heterozygous ACTN1-RT carriers and
      any further homozygotes identified, with age- and sex-matched controls, and
      compare valve abnormality rates against population estimates.
    would_support:
    - "phenotypes#Mild Heart Valve Defects in Homozygous Carriers"
    supporting_outcome:
    - >-
        Valve abnormalities are more frequent in carriers than in controls, with a
        dose relationship between the homozygous and heterozygous states.
    refuting_outcome:
    - >-
        Valve abnormality rates in carriers match population rates, indicating the
        reported association was coincidental.
notes: >-
  Lump/split. One Disease entry covering ACTN1-related thrombocytopenia in full.
  MONDO:0014078, OMIM 615193 and the clinical literature's ACTN1-related
  thrombocytopenia all name the same concept, and there is no basis for
  splitting: disease alleles in the actin-binding, rod and calmodulin-like
  domains produce the same phenotype through the same demonstrated cellular
  mechanism, and the domain-level differences that do exist - rod-domain variants
  raise platelet size less - are quantitative gradations within one entity rather
  than separate diseases. No has_subtypes block is curated for the same reason.
  The homozygous state is modelled as a dosage modifier in the pathograph, not as
  a subtype, because the two reported homozygotes have a more marked version of
  the same phenotype rather than a different one, and because a subtype backed by
  a single family would overstate what is known.

  Not conformed to primary_hemostatic_plug_failure, deliberately.
  kb/groupings/Inherited_Platelet_Function_Disorders.yaml lists ACTN1 (BDPLT15)
  among the entries it expects to gain as they are curated, and that grouping's
  membership criterion is a node conforming to that module. This entry does not
  declare one. The module models loss or dysfunction of a component of the
  platelet primary-haemostatic apparatus - an adhesion receptor, the aggregation
  receptor, the secretion machinery, the procoagulant membrane response - and
  ACTN1-RT has none of those. Its platelets are fewer and larger but functionally
  normal, the lesion is in megakaryocyte proplatelet formation rather than in the
  circulating platelet's haemostatic apparatus, and the mild bleeding is
  proportionate to the platelet count. Forcing a conformance would assert a
  platelet function defect the literature specifically denies. The right fix is a
  megakaryopoiesis and proplatelet-formation module, which does not yet exist in
  kb/modules/; other production-defect thrombocytopenias such as MYH9-related
  disease, TUBB1, DIAPH1 and TPM4 would conform to it alongside this entry. Until
  then the grouping's expectation is left unmet on purpose, and this paragraph is
  the reason.

  Direction of the molecular lesion. This entry curates the ACTN1 variants as
  increasing alpha-actinin-1 association with actin, which is what the
  biochemistry measures, and not as a loss of cross-linking, which is the
  intuitive reading and the one the seeding deep-research report asserted. Both
  are carried as mechanistic hypotheses with the canonical one marked, and an
  open discussion states what would separate them. A curator revising this entry
  should not quietly flip functional_impact_category back to LOSS_OF_FUNCTION
  without new data.

  Treatment evidence, and what is not curated. No trial, cohort or case series
  reports a treatment given for ACTN1-RT, because in the published series nobody
  needed one. Standard practice for inherited thrombocytopenia around surgery or
  major bleeding - tranexamic acid or another antifibrinolytic, and platelet
  transfusion if the count is low enough to matter - is what a haematologist
  would apply, but it is generic to the disease class and no source found in this
  curation states it for this disorder, so it is recorded here rather than as a
  treatments entry with a borrowed citation. Splenectomy and corticosteroids are
  actively inappropriate: the platelets are not being destroyed. There are no
  clinical trials to curate and no NCT identifiers.

  Phenotypes deliberately omitted. Epistaxis, easy bruising and menorrhagia are
  listed for this disorder by OMIM and repeated by the seeding report, and they
  are plausible - they are what mild mucocutaneous bleeding consists of. They are
  not curated as separate phenotypes because none of the primary sources read in
  this curation names them, and OMIM is not a citable reference type in this
  repository. They sit inside Mild Mucocutaneous Bleeding Tendency, which is
  evidenced. The report also proposed HP:0000425 for epistaxis, which does not
  exist in HPO, and HP:0000138 for menorrhagia, which HPO calls Ovarian cyst;
  neither was used.

  Evidence base. Five clinical series (a Japanese discovery cohort, a
  six-generation French pedigree, an Italian 128-proband screen, a French
  272-case screen, and a 49-carrier assembled cohort), one homozygous family, one
  biochemical study of purified mutant protein, one megakaryocyte-specific
  knockout mouse, and one narrative review. All human evidence is observational.
  The mouse is a knockout rather than a knock-in, which is the entry's main model
  limitation and is recorded as a HUMAN_MODEL_MISMATCH discussion rather than
  smoothed over.

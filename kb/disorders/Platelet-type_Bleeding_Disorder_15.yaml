- name: Impaired Proplatelet Formation
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Megakaryocytes expressing a disease allele extend fewer proplatelet
    processes, and the tips those processes end in are abnormally large. Because
    each tip is released as a platelet, that geometry predicts the clinical
    picture directly: fewer platelets, each bigger. Human data agree that the
    lesion is late rather than early in megakaryopoiesis - patients have low
    reticulated platelet counts with only slightly raised thrombopoietin, which
    is the profile of impaired platelet release rather than of failed
    megakaryocyte production or of peripheral platelet destruction.

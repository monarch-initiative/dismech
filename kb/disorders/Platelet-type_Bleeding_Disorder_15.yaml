name: Platelet-type Bleeding Disorder 15
creation_date: "2026-09-05T06:37:27Z"
category: Mendelian
description: >-
  Platelet-type bleeding disorder 15 (BDPLT15), usually called ACTN1-related
  thrombocytopenia in the haematology literature, is an autosomal dominant
  inherited thrombocytopenia caused by heterozygous missense variants in ACTN1,
  the gene for the non-muscle actin cross-linking protein alpha-actinin-1.
  Alpha-actinin-1 bundles actin filaments in the megakaryocyte, and the
  disease-associated substitutions - distributed across the N-terminal
  actin-binding domain, the spectrin-like rod repeats and the C-terminal
  calmodulin-like domain - converge on a single biochemical effect: they
  increase the protein's association with F-actin and its ability to bundle
  filaments. The megakaryocyte actin cytoskeleton is disorganised as a result,
  proplatelet formation is distorted so that fewer and abnormally large
  proplatelet tips are produced, and the circulating consequence is a reduced
  number of enlarged platelets with marked size variation. Unlike most entries
  in the OMIM platelet-type bleeding disorder series, the defect is quantitative
  and morphological rather than functional: platelet activation, secretion and
  aggregation are preserved, and the bleeding tendency is correspondingly mild
  or absent. Its clinical importance is diagnostic rather than therapeutic -
  recognising it prevents a benign lifelong trait being managed as immune
  thrombocytopenia.
parents:
- hereditary disease
synonyms:
- BDPLT15
- ACTN1-related thrombocytopenia
- ACTN1-related macrothrombocytopenia
- ACTN1-RT
- autosomal dominant macrothrombocytopenia ACTN1-related
- bleeding disorder, platelet-type, 15

        snippet: "This report is consistent with our findings that Idh3b-KO mice have normal vision up to P250, which is equivalent to 30 to 40 years of age in humans."
        explanation: Reports the visual function readout and the authors' age equivalence.
    evidence:
    - reference: PMID:35985423
      reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, the Idh3b-KO mice did not fully recapitulate the defects observed in humans."
      explanation: The authors state that the model does not reproduce the human retinal disease.
discussions:
- discussion_id: idh3b_mouse_retina_mismatch
  prompt: >-
    Why do two independent Idh3b-null mouse lines lose IDH3 activity and
    accumulate retinal isocitrate yet keep normal retinas, while humans homozygous
    for IDH3B loss-of-function variants develop retinitis pigmentosa?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Photoreceptor Mitochondrial Energy Insufficiency
  - pathophysiology#Rod and Cone Photoreceptor Degeneration
  - animal_models#Idh3b c.478_487del CRISPR mouse
  - animal_models#Idh3b exon 2-4 deletion knockout mouse
  rationale: >-
    The proposed mechanism, photoreceptor energy failure from a partial TCA-cycle
    block, rests on human genetics and on retinal energetics measured in other
    contexts. The only in vivo models reproduce the enzyme and metabolite defect
    but not the degeneration, and Idh3b-null cells keep normal respiration, so
    the step from enzyme deficiency to photoreceptor death is untested. The
    candidate explanations (insufficient ageing, species differences in
    isocitrate dehydrogenase redundancy, or a retina-specific role of the human
    beta subunit) predict different results in aged mice and in human
    photoreceptor models.
  evidence:
  - reference: PMID:30478029
    reference_title: "Mouse Idh3a mutations cause retinal degeneration and reduced mitochondrial function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The human patients with clear null mutations in IDH3B develop RP in adulthood; the mutant mice might not live long enough to develop retinal degeneration, or this might simply reflect species differences."
    explanation: States the mismatch and the two explanations offered by the model's authors.
  - reference: PMID:35985423
    reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Global deletion of Idh3b only causes male infertility but not retinal degeneration in mice."
    explanation: A second, independent null line confirms the absence of retinal degeneration.
- discussion_id: idh3b_male_fertility_in_patients
  prompt: >-
    Do men with biallelic IDH3B loss-of-function variants have impaired
    spermiogenesis or infertility, as Idh3b-null male mice do?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#
  rationale: >-
    The knockout mouse shows that the testis depends on IDH3 more than the retina
    does, but the human case reports cited here describe ocular findings and do
    not report fertility, so a possible extraocular phenotype of the human disease
    has not been assessed.
  evidence:
  - reference: PMID:35985423
    reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Global deletion of Idh3b only causes male infertility but not retinal degeneration in mice."
    explanation: Establishes the male fertility phenotype in the mouse null.

    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "At baseline, mitochondria respiration in the intact wild-type retina was close to maximal, with limited reserve capacity."
    explanation: >-
      Ex vivo mouse retina operates near maximal mitochondrial respiration, which
      is the proposed basis for photoreceptor vulnerability to a partial TCA-cycle
      defect. Indirect because IDH3 was not studied.
  - reference: PMID:41780638
    reference_title: "Photoreceptor deletion of pyruvate dehydrogenase E1 subunit α1 induces retinal degeneration and reprograms retinal metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Mice with rod- or cone-specific Pdha1 deletion exhibited retinal degeneration phenotype, manifested by impaired retinal morphology and light responses and significant retinal glial activation."
    explanation: >-
      Cutting mitochondrial pyruvate oxidation in rods or cones alone is enough to
      degenerate them, so photoreceptors depend on TCA-cycle input. Indirect
      because a different enzyme upstream of IDH3 was removed.
  - reference: PMID:41780638
    reference_title: "Photoreceptor deletion of pyruvate dehydrogenase E1 subunit α1 induces retinal degeneration and reprograms retinal metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "these retinas displayed profound metabolism reprogramming, evidenced by changes in key glycolysis and decreased tricarboxylic acid (TCA) cycle intermediates"
    explanation: >-
      The degeneration is accompanied by depletion of TCA-cycle intermediates,
      linking a photoreceptor TCA-cycle deficit to cell loss.
  - reference: PMID:32094231
    reference_title: "Fatty acid oxidation and photoreceptor metabolic needs."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Photoreceptors have high energy demands and a high density of mitochondria that produce ATP through oxidative phosphorylation (OXPHOS) of fuel substrates."
    explanation: >-
      Review summarising the mitochondrial energy demand of photoreceptors that
      underlies the proposed vulnerability.
  - reference: PMID:30478029
    reference_title: "Mouse Idh3a mutations cause retinal degeneration and reduced mitochondrial function."
    supports: REFUTE
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Extracellular flux analysis of fibroblasts produced from mutant embryos also showed that these mutant cell lines' mitochondria were not affected by the loss of Idh3b, with normal reserve capacity and maximum respiration levels"
    explanation: >-
      Loss of Idh3b does not reduce mitochondrial reserve or maximal respiration in
      mouse embryonic fibroblasts, unlike the Idh3a mutant cells in the same study.
      This argues against a general respiratory deficit, although photoreceptors
      themselves were not measured.
  downstream:
  - target: Rod and Cone Photoreceptor Degeneration
    causal_link_type: UNKNOWN
    description: >-
      Insufficient energy supply is the proposed cause of photoreceptor loss; the
      cell-death pathway in IDH3B-related retinopathy has not been studied.
- name: Rod and Cone Photoreceptor Degeneration
  description: >-
    Progressive loss of rod and cone photoreceptor function and structure produces
    the retinitis pigmentosa phenotype. Electroretinograms show substantial loss of
    both rod and cone responses by the fourth and fifth decades. The cell-death
    pathway has not been characterised in patients or in a faithful model.

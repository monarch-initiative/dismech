      label: isocitric acid
  evidence:
  - reference: PMID:35985423
    reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As expected, metabolites from upstream reactions of IDH3, including citrate, isocitrate, and aconitate, were accumulated about twofold in retinas from the KO mice"
    explanation: >-
      Retinal TCA intermediates upstream of IDH3 accumulate when Idh3b is deleted.
  - reference: PMID:35985423
    reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, αKG and its downstream metabolites, including glutamate, succinate, fumarate, malate, and aspartate, remained unchanged"
    explanation: >-
      The block is partial: metabolites downstream of the IDH3 step are maintained,
      which is why the TCA cycle is annotated as altered rather than decreased.
  - reference: PMID:18806796
    reference_title: "Insights from retinitis pigmentosa into the roles of isocitrate dehydrogenases in the Krebs cycle."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "NADP-IDH (IDH2) tags are more frequent than NAD-IDH (IDH3) tags across all human tissues except the retina and retinal pigment epithelium"
    explanation: >-
      An analysis of SAGE expression tags suggests that the retina relies more on
      IDH3 relative to IDH2 than other tissues do, a proposed reason why an IDH3
      defect would impair isocitrate oxidation chiefly in the retina. Indirect
      because SAGE tags only crudely reflect expression and no flux was measured.
  downstream:
  - target: Photoreceptor Mitochondrial Energy Insufficiency
    causal_link_type: UNKNOWN
    description: >-
      Proposed but unproven step: reduced IDH3-dependent NADH generation is
      thought to leave photoreceptors, which already operate near their maximal
      mitochondrial respiratory capacity, with too little energetic reserve.
    evidence:
    - reference: PMID:18806796
      reference_title: "Insights from retinitis pigmentosa into the roles of isocitrate dehydrogenases in the Krebs cycle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "These findings support the hypothesis that mitochondrial NADP-IDH, rather than NAD-IDH, serves as the main catalyst for this reaction in the citric acid cycle outside the retina, and that the retina has a particular requirement for NAD-IDH."
      explanation: >-
        The discovering authors infer a retina-specific requirement for NAD-IDH
        from patients who have retinal disease alone despite a systemic enzyme
        deficiency. This is an interpretation, not a measurement of retinal
        energetics.
- name: Photoreceptor Mitochondrial Energy Insufficiency
  description: >-
    Hypothesised link between the enzyme defect and cell loss. Photoreceptors are
    dependent on aerobic metabolism, and ex vivo mouse retina respires close to
    its maximal mitochondrial capacity with little reserve, so a partial TCA-cycle
    defect that other tissues tolerate could exhaust photoreceptor energy supply.
    Photoreceptor-specific deletion of Pdha1, which removes pyruvate entry into the
    TCA cycle, causes retinal degeneration in mice with decreased TCA-cycle
    intermediates, showing that photoreceptors need mitochondrial TCA-cycle input;
    that study did not involve IDH3.
    Direct evidence is lacking: Idh3b-null mouse fibroblasts show normal maximal
    and reserve respiration, Idh3b-null mouse retinas do not degenerate, and no
    measurement of respiration or ATP in IDH3B-deficient human photoreceptors has
    been reported.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL

name: IDH3B-Related Retinopathy
category: Mendelian
creation_date: "2026-11-04T12:00:00Z"
description: >-
  IDH3B-related retinopathy is an autosomal recessive, nonsyndromic retinitis
  pigmentosa (RP46) caused by biallelic loss-of-function variants in IDH3B, which
  encodes the beta subunit of mitochondrial NAD-dependent isocitrate dehydrogenase
  (IDH3, NAD-IDH). IDH3 is the tricarboxylic acid (TCA) cycle enzyme that oxidises
  isocitrate to alpha-ketoglutarate while reducing NAD+ to NADH. Patient
  lymphoblasts retain only a few percent of normal NAD-IDH activity, with a several
  hundred-fold rise in the Km for NAD, while the NADP-dependent mitochondrial
  isoenzyme IDH2 is normal. Affected individuals present in adulthood with rod-cone
  degeneration: subnormal visual acuity, impaired dark adaptation and night
  blindness, concentric visual field constriction, pale optic discs, attenuated
  arterioles, intraretinal pigment deposits and reduced rod and cone
  electroretinogram amplitudes, without signs of systemic mitochondrial disease.
  Why a deficiency of a ubiquitous TCA-cycle enzyme damages only the retina is not
  settled. The discovering authors proposed that IDH2 with the mitochondrial
  transhydrogenase substitutes for IDH3 in other tissues but not in the retina, and
  ex vivo mouse retina runs its mitochondria close to maximal capacity. Two
  independent Idh3b-null mouse lines lose IDH3 activity and accumulate isocitrate
  in the retina but do not develop retinal degeneration, so the human retinal
  vulnerability is not reproduced in mice. Only a handful of patients have been
  reported, and ClinGen rates the gene-disease relationship Moderate.
disease_term:
  preferred_term: IDH3B-related retinopathy
  term:
    id: MONDO:0800393
    label: IDH3B-related retinopathy
synonyms:
- retinitis pigmentosa 46
- RP46
- IDH3B retinitis pigmentosa
- retinitis pigmentosa caused by mutation in IDH3B
parents:
- Retinitis pigmentosa
- Inherited Retinal Dystrophy
notes: >-
  Scope and lumping. MONDO:0800393 is the ClinGen dyadic disease entity for
  biallelic IDH3B variants, and its only MONDO descendant is retinitis pigmentosa
  46 (MONDO:0012943, OMIM:612572). Every reported patient has nonsyndromic
  retinitis pigmentosa, so RP46 is the whole known content of this entry rather
  than a subtype distinct from a sibling, and it is recorded as a synonym and as a
  narrowMatch mapping instead of a has_subtypes row. The ClinGen record states that
  it lumps under MONDO:0800393 to allow for a wider retinal spectrum. The related
  IDH3 subunit diseases (IDH3A-related retinitis pigmentosa with macular
  pseudocoloboma, PMID:28412069; IDH3G as a candidate X-linked retinitis pigmentosa
  gene, PMID:40119724) involve separate genes and have no dismech entry at the time
  of writing; they are not curated here. ClinGen also counts a fourth affected
  individual from Jespersgaard et al. 2019 (PMID:30718709), whose cached text does
  not name IDH3B, so that case is not cited directly here.
  GeneReviews has no IDH3B-specific chapter; the Nonsyndromic Retinitis
  Pigmentosa Overview (PMID:20301590) is the applicable GeneReviews baseline and
  is tagged in references.
pathophysiology:
- name: IDH3B Biallelic Loss of Function
  description: >-
    Affected individuals are homozygous for IDH3B variants that remove or disable
    the beta subunit of NAD-IDH: a single-base deletion in codon 197 (c.589delA,
    p.Ile197fs) that produces a premature stop and low transcript levels, and the
    missense variants p.Leu132Pro and p.Gly286Glu. Both originally reported
    families were consanguineous.
  biological_scale: MOLECULAR
  conforms_to: "photoreceptor_degeneration#Photoreceptor Gene Defect"
  gene:
    preferred_term: IDH3B
    modifier: DECREASED
    term:
      id: hgnc:5385
      label: IDH3B
  molecular_functions:
  - preferred_term: isocitrate dehydrogenase (NAD+) activity
    modifier: DECREASED
    term:
      id: GO:0004449
      label: isocitrate dehydrogenase (NAD+) activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:18806796
    reference_title: "Insights from retinitis pigmentosa into the roles of isocitrate dehydrogenases in the Krebs cycle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected family members were homozygous for loss-of-function mutations in IDH3B, encoding the beta-subunit of NAD-specific isocitrate dehydrogenase (NAD-IDH, or IDH3)"
    explanation: >-
      Hartong et al. identify homozygous loss-of-function IDH3B variants in two
      retinitis pigmentosa families.
  - reference: PMID:18806796
    reference_title: "Insights from retinitis pigmentosa into the roles of isocitrate dehydrogenases in the Krebs cycle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both the index patient and her deceased, affected brother were homozygotes for a one-base-pair deletion in codon 197"
    explanation: >-
      The frameshift allele segregates in the first family; the paper reports that
      the frameshift creates a premature stop codon in all three IDH3B transcripts.
  downstream:
  - target: NAD-Dependent Isocitrate Dehydrogenase Deficiency
    causal_link_type: DIRECT
    description: >-
      Without a functional beta subunit the IDH3 heterotetramer loses most of its
      catalytic activity and its affinity for NAD.
    evidence:
    - reference: PMID:18806796
      reference_title: "Insights from retinitis pigmentosa into the roles of isocitrate dehydrogenases in the Krebs cycle."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The NAD-IDH activities of the homozygotes under standard assay conditions were only 4.8% (m.p.Ile163fs) and 2.4% (m.p.Leu98Pro) of the normal controls"
      explanation: >-
        Enzyme assays in lysates of patient-derived lymphoblast lines show that
        both homozygous IDH3B genotypes leave only a few percent of normal NAD-IDH
        activity.
    - reference: PMID:35985423
      reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "IDH3B ablation almost completely abolishes IDH3 activity in different tissues"
      explanation: >-
        In Idh3b-knockout mice, loss of the beta subunit abolishes IDH3 activity
        across tissues including retina, confirming in vivo that the beta subunit
        is required for holoenzyme activity. Indirect because it is a mouse null
        allele rather than the human variants.
- name: NAD-Dependent Isocitrate Dehydrogenase Deficiency
  description: >-
    NAD-IDH activity in homozygous patient lymphoblasts is 2.4 to 4.8 percent of
    control, and the Km for NAD is roughly 270 to 300 times normal, far above
    tissue NAD concentrations. The p.Leu132Pro (mature-protein Leu98Pro) enzyme
    also loses allosteric activation by ADP. NADP-dependent isocitrate
    dehydrogenase (IDH2) activity is normal in the same cells.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: isocitrate dehydrogenase (NAD+) activity
    modifier: DECREASED
    term:
      id: GO:0004449
      label: isocitrate dehydrogenase (NAD+) activity
  evidence:
  - reference: PMID:18806796
    reference_title: "Insights from retinitis pigmentosa into the roles of isocitrate dehydrogenases in the Krebs cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells from affected individuals had a substantial reduction of NAD-IDH activity, with about a 300-fold increase in the K(m) for NAD."
    explanation: >-
      Patient-derived lymphoblasts show markedly reduced NAD-IDH activity and a
      greatly raised Km for NAD.
  - reference: PMID:18806796
    reference_title: "Insights from retinitis pigmentosa into the roles of isocitrate dehydrogenases in the Krebs cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Km for NAD in the homozygotes was 267-298 times normal, while it was 4-8 times normal in the heterozygotes"
    explanation: >-
      Quantifies the kinetic defect in homozygotes and the milder change in
      unaffected heterozygous carriers.
  - reference: PMID:18806796
    reference_title: "Insights from retinitis pigmentosa into the roles of isocitrate dehydrogenases in the Krebs cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This allosteric effect was completely lost in the homozygote m.p.Leu98Pro mutant cells"
    explanation: >-
      The missense allele abolishes ADP activation of NAD-IDH, a second defect
      beyond reduced activity.
  - reference: PMID:37542909
    reference_title: "Molecular insights into the catalysis and regulation of mammalian NAD-dependent isocitrate dehydrogenases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Proper assembly of the component subunits is essential for the catalysis and regulation of the enzymes."
    explanation: >-
      Structural review of IDH3: the alpha, beta and gamma subunits must assemble
      into the heterooctamer for catalysis and regulation, which is why loss of
      the beta subunit reduces holoenzyme activity.
  downstream:
  - target: Impaired Isocitrate Oxidation in the TCA Cycle
    causal_link_type: DIRECT
    description: >-
      Loss of IDH3 activity slows the oxidation of isocitrate in mitochondria, so
      the metabolites upstream of the IDH3 step accumulate.
    evidence:
    - reference: PMID:35985423
      reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "As expected, metabolites from upstream reactions of IDH3, including citrate, isocitrate, and aconitate, were accumulated about twofold in retinas from the KO mice"
      explanation: >-
        In Idh3b-knockout mouse retina, the IDH3 substrates accumulate, showing
        that the enzyme deficiency slows isocitrate oxidation in retinal tissue.
        Indirect because it is measured in mouse, not in patients.
- name: Impaired Isocitrate Oxidation in the TCA Cycle
  description: >-
    In Idh3b-null mouse retina, citrate, isocitrate and aconitate roughly double
    while alpha-ketoglutarate and the metabolites downstream of it stay unchanged,
    consistent with partial compensation, for example by NADP-dependent isocitrate
    dehydrogenases. No patient tissue metabolite data have been reported. Hartong
    et al. proposed that IDH2 together with the mitochondrial transhydrogenase NNT
    can substitute for IDH3 outside the retina, and noted from EyeSAGE expression
    tags that IDH3 transcripts exceed IDH2 transcripts only in the retina and
    retinal pigment epithelium.
  biological_scale: CELLULAR
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina

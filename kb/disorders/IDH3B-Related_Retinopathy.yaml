animal_models:
- name: Idh3b c.478_487del CRISPR mouse
  species: Mouse
  genotype: Idh3b-/- (8 bp deletion in exon 5, backcrossed onto C57BL6/J)
  publication: PMID:30478029
  description: >-
    CRISPR/Cas9 Idh3b loss-of-function allele with no detectable protein.
    Homozygotes are born at Mendelian ratios and show no retinal stress, normal
    scotopic ERG and normal retinal structure to postnatal day 180, and their
    embryonic fibroblasts have normal mitochondrial respiration.
  evidence:
  - reference: PMID:30478029
    reference_title: "Mouse Idh3a mutations cause retinal degeneration and reduced mitochondrial function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss-of-function Idh3b mutants do not exhibit the same retinal degeneration phenotype, with no signs of retinal stress or reduction in mitochondrial respiration."
    explanation: Summarises the retinal and mitochondrial findings for the Idh3b mutant.
  modeled_mechanisms:
  - target: Rod and Cone Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Idh3b-null mice keep normal retinal structure and rod function to six months,
      whereas patients develop retinitis pigmentosa.
    limitations: >-
      Follow-up stopped at six months, and human IDH3B patients present in
      adulthood, so the model may simply not have been aged long enough; a species
      difference in isocitrate dehydrogenase redundancy is the alternative.
    readouts:
    - name: Scotopic ERG a-wave and retinal GFAP at P180
      target: Rod and Cone Photoreceptor Degeneration
      direction: UNCHANGED
      interpretation: No retinal stress and normal rod responses in homozygous mutants.
      evidence:
      - reference: PMID:30478029
        reference_title: "Mouse Idh3a mutations cause retinal degeneration and reduced mitochondrial function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "By P180, we observed no signs of retinal degeneration."
        explanation: Reports the retinal readouts behind this negative result.
    evidence:
    - reference: PMID:30478029
      reference_title: "Mouse Idh3a mutations cause retinal degeneration and reduced mitochondrial function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The human patients with clear null mutations in IDH3B develop RP in adulthood; the mutant mice might not live long enough to develop retinal degeneration, or this might simply reflect species differences."
      explanation: The authors' own statement of the mismatch and its two candidate explanations.
- name: Idh3b exon 2-4 deletion knockout mouse
  species: Mouse
  genotype: Idh3b-/- (343 bp CRISPR deletion spanning exons 2 to 4, Jackson Laboratory line)
  publication: PMID:35985423
  description: >-
    Global Idh3b knockout that abolishes IDH3 activity in retina, heart, brain and
    testis and raises retinal citrate, isocitrate and aconitate about twofold, but
    retains normal ERG and retinal morphology to postnatal day 250. Males are
    infertile because of arrested spermiogenesis.
  evidence:
  - reference: PMID:35985423
    reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Global deletion of Idh3b only causes male infertility but not retinal degeneration in mice."
    explanation: Summarises the phenotype of the knockout line.
  modeled_mechanisms:
  - target: NAD-Dependent Isocitrate Dehydrogenase Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Loss of Idh3b abolishes IDH3 activity in retina and other tissues.
    limitations: >-
      A complete null; the human missense alleles leave a few percent of activity
      and alter enzyme kinetics, which a null cannot model.
    evidence:
    - reference: PMID:35985423
      reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we generated Idh3b-KO mice and found that IDH3B is essential for IDH3 activity in multiple tissues."
      explanation: Shows the model reproduces the enzyme deficiency.
  - target: Impaired Isocitrate Oxidation in the TCA Cycle
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Retinal TCA intermediates upstream of IDH3 accumulate in the knockout.
    readouts:
    - name: Retinal citrate, isocitrate and aconitate by GC/MS
      target: Impaired Isocitrate Oxidation in the TCA Cycle
      direction: INCREASED
      interpretation: About twofold accumulation of IDH3 substrates in knockout retina.
      evidence:
      - reference: PMID:35985423
        reference_title: "Isocitrate dehydrogenase 3b is required for spermiogenesis but dispensable for retinal viability."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "As expected, metabolites from upstream reactions of IDH3, including citrate, isocitrate, and aconitate, were accumulated about twofold in retinas from the KO mice"
        explanation: Reports the metabolite measurement behind this readout.
  - target: Rod and Cone Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: Knockout mice retain normal vision and retinal structure to P250.
    limitations: >-
      P250 corresponds to roughly 30 to 40 human years by the authors' estimate,

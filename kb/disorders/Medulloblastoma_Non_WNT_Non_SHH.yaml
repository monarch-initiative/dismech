progression:
- phase: Group 3 and Group 4 outcome divergence
  notes: The two groups diverge substantially in outcome despite sharing one WHO type and one first-line
    therapy pathway. In the HIT2000 and HIT-MED cohorts Group 3 reached 41.4% five-year progression-free
    and 48.8% overall survival against 68.2% and 84.8% for Group 4. The overall-survival gap is wider
    than the progression-free gap, which means the difference is not only in how often the disease
    progresses but in what happens after it does.
  evidence:
  - reference: PMID:36459208
    reference_title: Identification of low and very high-risk patients with non-WNT/non-SHH medulloblastoma
      by improved clinico-molecular stratification of the HIT2000 and I-HIT-MED cohorts.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Group 3 MB (5y-PFS, survival estimation ± standard deviation: 41.4 ± 4.6%; 5y-OS: 48.8
      ± 5.0%) showed poorer survival compared to Group 4 (5y-PFS: 68.2 ± 3.7%; 5y-OS: 84.8 ± 2.8%).'
    explanation: Both groups' progression-free and overall survival from one cohort with standard
      deviations, which is what allows the divergence to be stated as a measured contrast.
- phase: Risk assignment at diagnosis
  notes: 'Once the tumour is typed, the presence of metastatic disease is what assigns it to a risk
    band: Group 4 with metastases is high-risk and Group 3 with metastases is very-high-risk.'

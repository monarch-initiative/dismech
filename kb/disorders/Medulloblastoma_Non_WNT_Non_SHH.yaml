diagnosis:
- name: DNA methylation-based classification
  description: >-
    Assignment to this type, and to the groups and subtypes within it, is made
    from a DNA methylation array rather than from histology. The classifier is
    the diagnostic substrate for the entity, not an adjunct to it.
  evidence:
  - reference: PMID:29539639
    reference_title: DNA methylation-based classification of central nervous system tumours.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We show that the availability of this method may have a substantial impact on diagnostic precision compared to standard methods, resulting in a change of diagnosis in up to 12% of prospective cases.
    explanation: >-
      Quantifies what methylation classification adds over standard diagnosis
      across CNS tumours. Indirect for this entry because the figure is for the
      whole classifier across all entities rather than for non-WNT/non-SHH
      medulloblastoma specifically, and this type is one of the entities whose
      definition depends on the method.
treatments:
- name: Craniospinal irradiation
  description: >-
    Upfront craniospinal irradiation. In the infant non-WNT/non-SHH setting,
    where it has historically been avoided because of its effect on the
    developing brain, it is nonetheless associated with substantially better
    progression-free survival than approaches that omit it.
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  therapeutic_modality: RADIOTHERAPY
  evidence:
  - reference: PMID:42150584
    reference_title: "Integrated biomarker and treatment correlates of prognosis in infant non-WNT/non-SHH medulloblastoma: a multinational retrospective cohort study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upfront craniospinal irradiation was associated with significantly better 5-year progression-free survival (62% [95% CI 55-70]) than non-craniospinal irradiation approaches (including focal radiotherapy or chemotherapy-only strategies; 33% ... p<0·0001)."
    explanation: >-
      Reports the comparison with both arms' survival and the test, in the
      population where the trade-off against late effects is sharpest. The
      design is a retrospective cohort rather than a randomised comparison, so
      the association is not a treatment-effect estimate.
- name: High-dose chemotherapy
  description: >-
    Where an upfront chemotherapy-only strategy is chosen, dose intensity
    matters: high-dose regimens outperform standard-dose ones, and one Group 3
    subgroup is chemosensitive enough to do well on chemotherapy alone.
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:42150584
    reference_title: "Integrated biomarker and treatment correlates of prognosis in infant non-WNT/non-SHH medulloblastoma: a multinational retrospective cohort study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with MBGroup3 subgroup 4 represented a novel chemosensitive group, with 5-year progression-free survival of 64% (95% CI 44-95) when treated upfront with high-dose chemotherapy only (n=14)
    explanation: >-
      Identifies a stratum that does well on chemotherapy alone, with its
      denominator and interval stated. The interval is wide because n is 14, so
      the finding is a basis for a trial rather than a settled indication.
progression:
- phase: Group 3 and Group 4 outcome divergence
  notes: >-
    The two groups diverge substantially in outcome despite sharing one WHO type
    and one first-line therapy pathway. In the HIT2000 and HIT-MED cohorts Group
    3 reached 41.4% five-year progression-free and 48.8% overall survival
    against 68.2% and 84.8% for Group 4. The overall-survival gap is wider than
    the progression-free gap, which means the difference is not only in how often
    the disease progresses but in what happens after it does.
  evidence:
  - reference: PMID:36459208
    reference_title: "Identification of low and very high-risk patients with non-WNT/non-SHH medulloblastoma by improved clinico-molecular stratification of the HIT2000 and I-HIT-MED cohorts."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Group 3 MB (5y-PFS, survival estimation ± standard deviation: 41.4 ± 4.6%; 5y-OS: 48.8 ± 5.0%) showed poorer survival compared to Group 4 (5y-PFS: 68.2 ± 3.7%; 5y-OS: 84.8 ± 2.8%)."
    explanation: >-
      Both groups' progression-free and overall survival from one cohort with
      standard deviations, which is what allows the divergence to be stated as a
      measured contrast.
mechanistic_hypotheses:
- hypothesis_group_id: group34_continuum
  hypothesis_label: Group 3 and Group 4 are poles of one continuum rather than two entities
  status: EMERGING
  description: >-
    Whether Group 3 and Group 4 are two discrete entities or two poles of a
    single transcriptional continuum bears directly on whether this entry should
    carry two subtype rows or be split into two entries. Transcriptional
    profiling places many tumours as intermediates between the archetypes and
    finds continuum position itself prognostic; methylation subgrouping
    independently resolves the combined set into eight subtypes that do not
    respect the Group 3/Group 4 boundary. Both results argue for one entry with
    strata, which is how this entry is built.
  evidence:
  - reference: PMID:35926460
    reference_title: Medulloblastoma group 3 and 4 tumors comprise a clinically and biologically significant expression continuum reflecting human cerebellar development.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: we show that transcriptionally group 3 and group 4 medulloblastomas exist as intermediates on a bipolar continuum between archetypal group 3 and group 4 entities
    explanation: >-
      States the continuum claim directly from RNA sequencing of large annotated
      cohorts, which is the hypothesis this group records.
  - reference: PMID:31076851
    reference_title: "Second-generation molecular subgrouping of medulloblastoma: an international meta-analysis of Group 3 and Group 4 subtypes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: our analysis most strongly supported a definition comprising eight robust Group 3/Group 4 subtypes (types I-VIII)
    explanation: >-
      An eight-subtype solution derived across a large meta-analysis is indirect
      support for the continuum reading: it is the structure recovered when the
      Group 3 and Group 4 dichotomy is not imposed in advance.
notes: >-
  This entry has no causal germline gene and that is its defining property, not
  a gap in curation. Every gene recorded here is a somatic driver of a tumour,
  which is why each genetic record carries variant_origin SOMATIC and none is
  typed CAUSATIVE. Gene-disease validity is deliberately absent throughout:
  ClinGen does not classify any of these genes against this disease, and a
  validity tier is copied from a source rather than assigned.

  A non-WNT/non-SHH assignment does not remove the indication for germline
  assessment, but the prior probability of a syndromic cause is low relative to
  SHH or WNT medulloblastoma, and none of the recognised high-yield
  medulloblastoma predisposition genes points at this type.

  Group 3 and Group 4 are curated as subtype rows rather than as separate
  entries because the field does not treat them as separable; the evidence
  behind that decision is recorded in the group34_continuum hypothesis group.
review_notes: >-
  Content fence (b) of the curating project excludes evidence on 1p36, 11q and
  17q chromosomal changes and on chromothripsis, and that omission is material
  for this disease rather than incidental. Arm-level and whole-chromosome
  copy-number change is among the most frequently reported cytogenetic features
  of these tumours, and two published risk-stratification schemes for this type
  are built on whole-chromosomal-aberration signatures defined by the identities
  of specific chromosome arms. Those schemes are therefore absent from this
  entry, as is isochromosome 17q. What is recorded instead is the group-level
  outcome divergence, which is measured without reference to arm identity. A
  later pass with the fence lifted should add the aberration signatures and the
  risk strata that depend on them.

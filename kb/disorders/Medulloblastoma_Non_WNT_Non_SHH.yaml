name: Medulloblastoma, Non-WNT/Non-SHH
creation_date: '2026-11-11T15:12:00Z'
description: >-
  The molecularly defined medulloblastoma type in which neither WNT-pathway nor
  SHH-pathway activation is demonstrable. It is defined negatively and
  subsumes the two transcriptional groups the research literature calls Group 3
  and Group 4, which together account for most paediatric medulloblastoma. It
  has no germline causal gene: its drivers are somatic, and the dominant
  mechanisms are copy-number change, structural-variant-mediated enhancer
  hijacking, and mutation of chromatin regulators rather than point mutation of
  a signalling pathway. Group 3 and Group 4 are retained here as subtype rows
  rather than separate entries because they are not cleanly separable: tumours
  exist as intermediates on a bipolar transcriptional continuum between the two
  archetypes, and second-generation methylation subgrouping resolves the
  combined set into eight subtypes that cut across the Group 3/Group 4 line.
  Both groups arise from the human rhombic lip, the germinal zone that produces
  the glutamatergic neuronal lineages of the cerebellum, and their anatomical
  origin localises to the nodulus.
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Molecularly Defined Tumor
- Embryonal Tumor
parents:
- medulloblastoma
has_subtypes:
- name: Group 3

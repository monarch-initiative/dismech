name: Medulloblastoma, Non-WNT/Non-SHH
creation_date: '2026-11-11T15:12:00Z'
description: 'The molecularly defined medulloblastoma type in which neither WNT-pathway nor SHH-pathway
  activation is demonstrable. It is defined negatively and subsumes the two transcriptional groups
  the research literature calls Group 3 and Group 4, which together account for most paediatric medulloblastoma.
  It has no germline causal gene: its drivers are somatic, and the dominant mechanisms are copy-number
  change, structural-variant-mediated enhancer hijacking, and mutation of chromatin regulators rather
  than point mutation of a signalling pathway. Group 3 and Group 4 are retained here as subtype rows
  rather than separate entries because they are not cleanly separable: tumours exist as intermediates
  on a bipolar transcriptional continuum between the two archetypes, and second-generation methylation
  subgrouping resolves the combined set into eight subtypes that cut across the Group 3/Group 4 line.
  Both groups arise from the human rhombic lip, the germinal zone that produces the glutamatergic
  neuronal lineages of the cerebellum, and their anatomical origin localises to the nodulus.'
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Molecularly Defined Tumor
- Embryonal Tumor
parents:
- medulloblastoma
has_subtypes:
- name: Group 3
  display_name: Medulloblastoma, Non-WNT/Non-SHH, Group 3
  classification: molecular
  subtype_term:
    preferred_term: medulloblastoma non-WNT/non-SHH group 3
    term:
      id: MONDO:0956966
      label: medulloblastoma non-WNT/non-SHH group 3
  description: The transcriptional group with the poorer outcome of the two, weighted towards infants
    and young children, enriched for MYC amplification and for a photoreceptor-like expression programme.
    It predominates among infants with non-WNT/non-SHH disease.
  genes:
  - preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  evidence:
  - reference: PMID:36459208
    reference_title: Identification of low and very high-risk patients with non-WNT/non-SHH medulloblastoma
      by improved clinico-molecular stratification of the HIT2000 and I-HIT-MED cohorts.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Group 3 MB (5y-PFS, survival estimation ± standard deviation: 41.4 ± 4.6%; 5y-OS: 48.8
      ± 5.0%) showed poorer survival compared to Group 4 (5y-PFS: 68.2 ± 3.7%; 5y-OS: 84.8 ± 2.8%).'
    explanation: Establishes Group 3 as the worse-outcome stratum of the two, with both progression-free
      and overall survival reported side by side in one cohort, which is what makes the contrast between
      the two subtype rows a measured one rather than an impression.
  - reference: PMID:42150584
    reference_title: 'Integrated biomarker and treatment correlates of prognosis in infant non-WNT/non-SHH
      medulloblastoma: a multinational retrospective cohort study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: MBGroup3 tumours predominated (246 [66%] of 375 patients)
    explanation: Gives the Group 3 share of an international infant non-WNT/non-SHH cohort with its
      denominator, supporting the statement that Group 3 predominates in infancy.
- name: Group 4
  display_name: Medulloblastoma, Non-WNT/Non-SHH, Group 4
  classification: molecular
  subtype_term:
    preferred_term: medulloblastoma non-WNT/non-SHH group 4
    term:
      id: MONDO:0956967
      label: medulloblastoma non-WNT/non-SHH group 4
  description: The larger of the two groups across the paediatric age range, with an intermediate
    outcome. Its somatic alterations converge on the core binding factor alpha complex and on chromatin
    regulators, and its transcriptome resembles rhombic lip subventricular zone progenitors of the
    unipolar brush cell lineage arrested in developmental time.
  genes:
  - preferred_term: PRDM6
    term:
      id: hgnc:9350
      label: PRDM6
  - preferred_term: KDM6A
    term:
      id: hgnc:12637
      label: KDM6A
  evidence:
  - reference: PMID:37014508
    reference_title: Molecular characterisation defines clinically-actionable heterogeneity within
      Group 4 medulloblastoma and improves disease risk-stratification.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Group 4 tumours (MBGrp4) represent the majority of non-WNT/non-SHH medulloblastomas.
    explanation: States the Group 4 share of this entry's scope directly, which is why Group 4 rather
      than Group 3 is the larger stratum across the whole paediatric age range even though Group 3
      predominates in infancy.
  - reference: PMID:36131014
    reference_title: Failure of human rhombic lip differentiation underlies medulloblastoma formation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: we demonstrate that somatic mutations that cause G4 MB converge on the core binding factor
      alpha (CBFA) complex and mutually exclusive alterations that affect CBFA2T2, CBFA2T3, PRDM6,
      UTX and OTX2
    explanation: Names the convergent somatic target set that defines the Group 4 stratum, and establishes
      that the alterations are mutually exclusive, which is why the row carries several genes rather
      than one.
pathophysiology:
- name: Human Rhombic Lip Progenitor Pool
  description: The rhombic lip is the germinal zone of the developing human cerebellum that produces
    all glutamatergic neuronal lineages before internalisation into the nodulus. Both groups of this
    tumour type derive from this compartment, which is what makes the two groups convergent rather
    than unrelated.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: rhombic lip progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cerebellum development
    term:
      id: GO:0021549
      label: cerebellum development
  evidence:
  - reference: PMID:36131015
    reference_title: Unified rhombic lip origins of group 3 and group 4 medulloblastoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Molecular signatures encoded within a human rhombic-lip-derived lineage trajectory aligned
      with photoreceptor and unipolar brush cell expression profiles that are maintained in group
      3 and group 4 medulloblastoma, suggesting a convergent basis.
    explanation: Multi-omic resolution of the developing human cerebellum places both groups' expression
      programmes on one rhombic-lip-derived lineage trajectory, which is the claim this node makes.
  notes: The cell type is bound to the generic neural progenitor cell class because the Cell Ontology
    has no rhombic lip progenitor term; a search for the label pattern "rhombic lip" in CL returns
    nothing. The lineage-specific identity is carried on the differentiation-failure node below, where
    CL does have the unipolar brush cell class.
  downstream:
  - target: Oncogenic Transformation of a Rhombic Lip Progenitor
    description: The progenitor pool supplies the cell in which the transforming event occurs
    evidence:
    - reference: PMID:38971152
      reference_title: Early rhombic lip Protogenin(+ve) stem cells in a human-specific neurovascular
        niche initiate and maintain group 3 medulloblastoma.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: Oncogenic transformation of early Prtg+ve rhombic lip stem cells initiates group 3
        medulloblastoma (Gr3-MB)-like tumors.
      explanation: Transforming this specific rhombic lip stem cell population generates Group 3-like
        tumours, which is the step this edge asserts. Graded as model-organism evidence because the
        initiation experiment was done in a model system, while the human stem-cell population itself
        is described in the same paper.
- name: Oncogenic Transformation of a Rhombic Lip Progenitor
  description: The transforming somatic event occurs in an early rhombic lip stem cell. In the Group
    3 lineage that cell is a Protogenin-positive, MYC-high, NESTIN-low stem cell of the rhombic lip
    ventricular zone, identifiable in the four-week human embryonic hindbrain.
  biological_scale: CELLULAR
  genetic_context:
    variant_origin: SOMATIC
  cell_types:
  - preferred_term: Protogenin-positive rhombic lip ventricular zone stem cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  genes:
  - preferred_term: PRTG
    term:
      id: hgnc:26373
      label: PRTG
  biological_processes:
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
  evidence:
  - reference: PMID:38971152
    reference_title: Early rhombic lip Protogenin(+ve) stem cells in a human-specific neurovascular
      niche initiate and maintain group 3 medulloblastoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We identify a population of Protogenin-positive (PRTG+ve) MYChigh NESTINlow stem cells
      in the four-week-old human embryonic hindbrain that subsequently localizes to the ventricular
      zone of the rhombic lip (RLVZ).
    explanation: Identifies the human cell population in which the Group 3 lineage originates, and
      the developmental window in which it exists, which is what makes this node the transforming
      step rather than a later one.
  downstream:
  - target: Failure of Rhombic Lip Differentiation
    description: The transformed progenitor does not complete its normal differentiation trajectory
    evidence:
    - reference: PMID:36131014
      reference_title: Failure of human rhombic lip differentiation underlies medulloblastoma formation.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: G4 MB transcriptionally resembles these progenitors but are stalled in developmental
        time
      explanation: The tumour's transcriptome is that of the normal progenitor arrested part-way along
        its trajectory, which is the differentiation failure this edge points at rather than a separate
        dedifferentiation event.
  - target: Perivascular Niche Maintenance of the Group 3 Stem Compartment
    description: The transformed stem cell sits in a human-specific perivascular niche that sustains
      it
    evidence:
    - reference: PMID:38971152
      reference_title: Early rhombic lip Protogenin(+ve) stem cells in a human-specific neurovascular
        niche initiate and maintain group 3 medulloblastoma.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: PRTG+ve stem cells grow adjacent to a human-specific interposed vascular plexus in
        the RLVZ, a phenotype that is recapitulated in Gr3-MB but not in other types of medulloblastoma.
      explanation: The niche relationship is reproduced in Group 3 tumours and in no other medulloblastoma
        type, which is what makes it a mechanism of this entry rather than a general feature of the
        disease.
- name: Failure of Rhombic Lip Differentiation
  description: The progenitor population persists in an undifferentiated, proliferative state beyond
    the developmental window in which it should have been consumed. In the Group 4 lineage the arrested
    population corresponds to unipolar brush cell progenitors of the rhombic lip subventricular zone.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: unipolar brush cell progenitor
    term:
      id: CL:4023161
      label: unipolar brush cell
  biological_processes:
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:36131014
    reference_title: Failure of human rhombic lip differentiation underlies medulloblastoma formation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: its high level of susceptible EOMES+KI67+ unipolar brush cell progenitor cells probably
      predisposes our species to the development of G4 MB
    explanation: Names the proliferating progenitor population that persists, and ties the susceptibility
      to the human-specific abundance of that population, which is the claim this node carries.
  downstream:
  - target: OTX2-Maintained Differentiation Block
    description: The arrest is actively held in place by a lineage transcription factor rather than
      being a passive failure
    evidence:
    - reference: PMID:36131014
      reference_title: Failure of human rhombic lip differentiation underlies medulloblastoma formation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: Knockdown of OTX2 in model systems relieves this differentiation blockade, which allows
        MB cells to spontaneously proceed along normal developmental differentiation trajectories.
      explanation: Removing OTX2 releases the block and the cells resume normal differentiation, which
        shows the arrest is actively maintained. Indirect for this edge because the experiment removes
        the maintaining factor and reads the consequence rather than measuring the block itself.

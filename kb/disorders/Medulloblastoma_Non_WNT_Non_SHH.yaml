mechanistic_hypotheses:
- hypothesis_group_id: group34_continuum
  hypothesis_label: Group 3 and Group 4 are poles of one continuum rather than two entities
  status: EMERGING
  description: Whether Group 3 and Group 4 are two discrete entities or two poles of a single transcriptional
    continuum bears directly on whether this entry should carry two subtype rows or be split into
    two entries. Transcriptional profiling places many tumours as intermediates between the archetypes
    and finds continuum position itself prognostic; methylation subgrouping independently resolves
    the combined set into eight subtypes that do not respect the Group 3/Group 4 boundary. Both results
    argue for one entry with strata, which is how this entry is built.
  evidence:
  - reference: PMID:35926460
    reference_title: Medulloblastoma group 3 and 4 tumors comprise a clinically and biologically significant
      expression continuum reflecting human cerebellar development.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: we show that transcriptionally group 3 and group 4 medulloblastomas exist as intermediates
      on a bipolar continuum between archetypal group 3 and group 4 entities
    explanation: States the continuum claim directly from RNA sequencing of large annotated cohorts,
      which is the hypothesis this group records.
  - reference: PMID:31076851
    reference_title: 'Second-generation molecular subgrouping of medulloblastoma: an international
      meta-analysis of Group 3 and Group 4 subtypes.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: our analysis most strongly supported a definition comprising eight robust Group 3/Group
      4 subtypes (types I-VIII)
    explanation: 'An eight-subtype solution derived across a large meta-analysis is indirect support
      for the continuum reading: it is the structure recovered when the Group 3 and Group 4 dichotomy
      is not imposed in advance.'
notes: 'This entry has no causal germline gene and that is its defining property, not a gap in curation.
  Every gene recorded here is a somatic driver of a tumour, which is why each genetic record carries
  variant_origin SOMATIC and none is typed CAUSATIVE. Gene-disease validity is deliberately absent
  throughout: ClinGen does not classify any of these genes against this disease, and a validity tier
  is copied from a source rather than assigned.

  A non-WNT/non-SHH assignment does not remove the indication for germline assessment, but the prior
  probability of a syndromic cause is low relative to SHH or WNT medulloblastoma, and none of the
  recognised high-yield medulloblastoma predisposition genes points at this type.

  Group 3 and Group 4 are curated as subtype rows rather than as separate entries because the field
  does not treat them as separable; the evidence behind that decision is recorded in the group34_continuum
  hypothesis group.'
review_notes: Content fence (b) of the curating project excludes evidence on 1p36, 11q and 17q chromosomal
  changes and on chromothripsis, and that omission is material for this disease rather than incidental.
  Arm-level and whole-chromosome copy-number change is among the most frequently reported cytogenetic
  features of these tumours, and two published risk-stratification schemes for this type are built
  on whole-chromosomal-aberration signatures defined by the identities of specific chromosome arms.
  Those schemes are therefore absent from this entry, as is isochromosome 17q. What is recorded instead
  is the group-level outcome divergence, which is measured without reference to arm identity. A later
  pass with the fence lifted should add the aberration signatures and the risk strata that depend
  on them.

- name: Proliferating Posterior Fossa Mass
  description: The accumulating arrested progenitors form an expanding mass in the cerebellum and
    fourth-ventricular region. Its position, rather than any property peculiar to this molecular type,
    is what produces the presenting syndrome.
  biological_scale: TISSUE
  downstream:
  - target: Fourth Ventricular Outflow Obstruction
    description: A mass in the fourth ventricle or adjacent cerebellum obstructs CSF outflow.
    evidence:
    - reference: PMID:23245832
      reference_title: Medulloblastoma.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: They arise infratentorially in the cerebellum or fourth ventricle and hence the most
        common presenting symptoms are those associated with raised intracranial pressure.
      explanation: States the anatomical position and draws the presenting syndrome from it, which
        is this edge.
  - target: Metastatic Dissemination at Diagnosis
    description: A proportion of tumours have already spread beyond the primary site when they are

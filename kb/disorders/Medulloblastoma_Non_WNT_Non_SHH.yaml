    evidence:
    - reference: PMID:28726821
      reference_title: The whole-genome landscape of medulloblastoma subtypes.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: New molecular subtypes were differentially enriched for specific driver events, including
        hotspot in-frame insertions that target KBTBD4 and 'enhancer hijacking' events that activate
        PRDM6.
      explanation: Names the enhancer-hijacking event that activates PRDM6 as a driver event of these
        subtypes, which is what this node asserts and why it reaches the arrest node.
  notes: No molecular function is bound, for two reasons. The cited source calls PRDM6 a poorly characterized

- name: Fourth Ventricular Outflow Obstruction
  description: Obstruction of cerebrospinal fluid outflow from the fourth ventricle. This is the step
    that converts a posterior fossa mass into the raised-pressure syndrome patients actually present
    with, and it is also what the first surgical goal addresses.
  biological_scale: TISSUE
  downstream:
  - target: Hydrocephalus
    description: Blocked outflow dilates the ventricular system upstream of the block.
    evidence:
    - reference: PMID:31494131
      reference_title: 'Medulloblastoma: Clinical presentation.'
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: 'We delineated two clusters: the "nodular" cluster, which associates young age, cerebello-pontine
        angle tumor, herniation, desmoplastic tumor, and tumor predisposition syndrome; and the "metastatic"
        cluster, which associates altered status, initial metastases, hydrocephalus, and diagnostic
        delay.'
      explanation: Places hydrocephalus in the cluster this entry's type falls into, alongside initial
        metastases.

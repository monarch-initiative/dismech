    evidence:
    - reference: PMID:36131014
      reference_title: Failure of human rhombic lip differentiation underlies medulloblastoma formation.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: we demonstrate that somatic mutations that cause G4 MB converge on the core binding
        factor alpha (CBFA) complex and mutually exclusive alterations that affect CBFA2T2, CBFA2T3,
        PRDM6, UTX and OTX2.
      explanation: The convergence of the driver mutations on one complex is the entry's basis for

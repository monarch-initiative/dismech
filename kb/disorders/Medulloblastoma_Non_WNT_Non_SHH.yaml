- name: Perivascular Niche Maintenance of the Group 3 Stem Compartment
  description: A human-specific interposed vascular plexus in the rhombic lip ventricular zone supports
    the tumour stem compartment. The relationship is reproduced in Group 3 tumours and not in other
    medulloblastoma types, and endothelial co-culture promotes tumour stem-cell growth.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: INCREASED
  evidence:
  - reference: PMID:38971152
    reference_title: Early rhombic lip Protogenin(+ve) stem cells in a human-specific neurovascular
      niche initiate and maintain group 3 medulloblastoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: Co-culture of Gr3-MB with endothelial cells promotes tumor stem cell growth, with the
      endothelial cells adopting an immature phenotype.
    explanation: The co-culture result is the functional demonstration that the vascular compartment
      sustains the tumour stem cells rather than merely sitting beside them.
  notes: No cell type is bound on this node. It is about an endothelial compartment, and the correct
    class would be an endothelial cell of the hindbrain vasculature; rather than bind the generic
    neural progenitor class used on the progenitor nodes, which would be wrong here, the slot is left
    empty for a pass that can search the Cell Ontology for the endothelial term.
  downstream:
  - target: Proliferating Posterior Fossa Mass
    description: The niche sustains the stem compartment that supplies the growing mass.
    evidence:
    - reference: PMID:38971152
      reference_title: Early rhombic lip Protogenin(+ve) stem cells in a human-specific neurovascular
        niche initiate and maintain group 3 medulloblastoma.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Human Gr3-MBs likely arise from early embryonic RLVZ PRTG+ve stem cells inhabiting
        a specific perivascular niche.
      explanation: Supports the niche being the compartment in which the initiating population is
        maintained, and so a supplier of the mass.
- name: Enhancer Hijacking Activating GFI1 or GFI1B
  description: Somatic structural variants move GFI1 or GFI1B next to active enhancers, including
    super-enhancers, placing a transcriptional repressor under inappropriate enhancer control. The
    two events are mutually exclusive and are restricted to Group 3 and Group 4. This is the disease
    in which enhancer hijacking was first defined.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GFI1
    term:
      id: hgnc:4237
      label: GFI1
  - preferred_term: GFI1B
    term:
      id: hgnc:4238
      label: GFI1B
  evidence:
  - reference: PMID:25043047
    reference_title: Enhancer hijacking activates GFI1 family oncogenes in medulloblastoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Somatic structural variants juxtapose GFI1 or GFI1B coding sequences proximal to active
      enhancer elements, including super-enhancers, instigating oncogenic activity.
    explanation: States the mechanism of this node exactly, including that the variants are somatic
      and that the oncogenic activity follows from the juxtaposition rather than from a coding change
      in the gene itself.
  downstream:
  - target: Failure of Rhombic Lip Differentiation
    description: The driver event acts on the rhombic lip differentiation programme; the entry records
      the convergence, not a measured step from this lesion to the arrest.
    evidence:
    - reference: PMID:25043047
      reference_title: Enhancer hijacking activates GFI1 family oncogenes in medulloblastoma.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Somatic structural variants juxtapose GFI1 or GFI1B coding sequences proximal to active
        enhancer elements, including super-enhancers, instigating oncogenic activity.
      explanation: The hijacking event is what puts the GFI1 family oncogene under an active enhancer,
        which is the step by which this node acts on the differentiation programme.
  notes: No molecular function is bound. The source that establishes this event calls GFI1 and GFI1B
    growth factor independent 1 family proto-oncogenes and does not state what the proteins do, and
    the node's claim is about where transcription is driven from rather than about an activity. Binding
    a repressor term here would assert a function this entry has not read in a source, so the node
    is grandfathered in tests/gene_activity_grounding_baseline.txt instead.
- name: Enhancer Hijacking Activating PRDM6
  description: A tandem duplication of SNCAIP places PRDM6 under enhancer control. SNCAIP lies upstream
    of PRDM6, so the duplication acts on a neighbouring gene rather than on the gene it contains.
    This is the characteristic Group 4 structural event.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PRDM6
    term:
      id: hgnc:9350
      label: PRDM6
  - preferred_term: SNCAIP
    term:
      id: hgnc:11139
      label: SNCAIP
  evidence:

      precision compared to standard methods, resulting in a change of diagnosis in up to 12% of prospective
      cases.
    explanation: Quantifies what methylation classification adds over standard diagnosis across CNS
      tumours. Indirect for this entry because the figure is for the whole classifier across all entities
      rather than for non-WNT/non-SHH medulloblastoma specifically, and this type is one of the entities
      whose definition depends on the method.

    reference_title: The whole-genome landscape of medulloblastoma subtypes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: New molecular subtypes were differentially enriched for specific driver events, including
      hotspot in-frame insertions that target KBTBD4 and 'enhancer hijacking' events that activate
      PRDM6.
    explanation: Names PRDM6 activation by enhancer hijacking as a driver event of these subtypes,
      in the whole-genome series that defined the driver landscape.
  downstream:
  - target: Failure of Rhombic Lip Differentiation
    description: The driver event acts on the rhombic lip differentiation programme; the entry records

- name: MYC amplification
  association: Oncogene amplification
  subtype: Group 3
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  evidence:
  - reference: PMID:42150584
    reference_title: "Integrated biomarker and treatment correlates of prognosis in infant non-WNT/non-SHH medulloblastoma: a multinational retrospective cohort study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with MBGroup3 subgroup 2 or 3 with MYC amplification (n=10) had 5-year progression-free and overall survival rates of 0% when treated with chemotherapy only.
    explanation: >-
      Quantifies the consequence of MYC amplification in the infant Group 3
      setting with its denominator stated, which is why the record is typed as a
      somatic driver with prognostic weight rather than as an incidental finding.
  notes: >-
    Focal high-level amplification of MYC, characteristic of Group 3 and a
    marker of poor outcome within it. The prognostic weight is not uniform
    across this entry: within Group 4 specifically, MYC and MYCN amplification
    have been reported to carry little prognostic relevance, so the adverse
    association above should not be generalised from Group 3 to the whole type.

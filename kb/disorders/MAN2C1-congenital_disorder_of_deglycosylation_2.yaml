    evidence_source: HUMAN_CLINICAL
    snippet: The MAN2C1 gene encodes an enzyme with alpha-mannosidase 2C1 activity, which is responsible
      for the degradation of defective glycoproteins in the cytoplasm.
    explanation: An independent second report restates the cytosolic alpha-mannosidase function whose
      loss defines the trigger node.

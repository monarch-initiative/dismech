discussions:
- discussion_id: gap_man2c1_fos_accumulation_causality
  prompt: >-
    Does free-oligosaccharide accumulation itself cause the CDDG2
    neurodevelopmental phenotype, or is it a marker of a MAN2C1 function that
    acts on neurodevelopment by some other route?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Free oligosaccharide processing delay and accumulation
  - pathophysiology#Neurodevelopmental malformation and cognitive phenotype
  rationale: >-
    The founding cohort establishes both ends of the chain independently -
    accumulated and delayed free oligosaccharides in proband-derived cells, and
    a malformation/cognitive phenotype in the same individuals - but nothing
    links them. The edge between the two nodes is curated as
    INDIRECT_UNKNOWN_INTERMEDIATES for exactly this reason. No cell type in
    which accumulation is measured is a neural cell type, no dose-response
    between free-oligosaccharide burden and phenotype severity is reported, and
    no model organism has been shown to develop the malformations. The
    independent recovery of MAN2C1 from a polymicrogyria cohort strengthens the
    gene-phenotype association without touching the mechanistic link.
  proposed_experiments:
  - experiment_id: exp_man2c1_neural_fos_dose_response
    name: Free-oligosaccharide burden versus cortical phenotype in neural models
    description: >-
      Quantify free-oligosaccharide species in MAN2C1-null human iPSC-derived
      neural progenitors and cortical organoids across an allelic series
      spanning the reported hypomorphic and null variants, and test whether
      burden tracks with migration and lamination defects. A rescue arm
      restoring cytosolic alpha-mannosidase activity without restoring MAN2C1
      protein would separate the catabolic function from any moonlighting role.
  - experiment_id: exp_man2c1_model_organism_cortical_phenotype
    name: Cortical phenotyping of a Man2c1-deficient model organism
    description: >-
      Determine whether a Man2c1 loss-of-function mouse or zebrafish
      reproduces polymicrogyria-like cortical disorganization and callosal
      anomalies, and whether free-oligosaccharide accumulation precedes them
      developmentally. A model that accumulates free oligosaccharides without
      the malformation would refute the direct-causation reading.
notes: >-
  Only two publications describe MAN2C1-related disease directly. The 2026
  second report (PMID:41623318) is a compound case: the pathogenic MAN2C1
  variant sits opposite a 15q24.1q24.3 microdeletion that itself removes
  MAN2C1, so the CDDG2 features are unmasked on the deleted background rather
  than arising from two conventional point alleles. Its phenotype should not be
  attributed wholly to MAN2C1 - the microdeletion spans other genes, and the
  authors present the case as clarifying which 15q24-deletion features are
  MAN2C1-attributable. MAN2C1 was independently recovered as a novel
  polymicrogyria gene in a 275-family exome cohort (PMID:37486637), which is
  the strongest corroboration of the gene-phenotype link that exists outside
  the founding series.

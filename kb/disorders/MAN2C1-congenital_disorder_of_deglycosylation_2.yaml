name: MAN2C1-congenital disorder of deglycosylation 2
creation_date: '2026-07-06T06:04:18Z'
description: MAN2C1-congenital disorder of deglycosylation 2 is an autosomal recessive free-oligosaccharide
  catabolism disorder caused by biallelic MAN2C1 variants. MAN2C1 encodes a cytosolic alpha-mannosidase
  that trims free oligosaccharides generated during N-glycosylation and glycoprotein degradation. Pathogenic
  variants cause accumulation and delayed processing of free oligosaccharides in patient-derived cells,
  producing a neurodevelopmental disorder with dysmorphic features, congenital anomalies including tongue
  hamartoma, intellectual disability, and brain anomalies such as polymicrogyria, interhemispheric cysts,
  hypothalamic hamartoma, callosal anomalies, and hypoplasia of the brainstem and cerebellar vermis.
category: Mendelian
disease_term:
  preferred_term: congenital disorder of deglycosylation 2
  term:
    id: MONDO:0030770
    label: congenital disorder of deglycosylation 2
synonyms:
- CDDG2
- MAN2C1 deficiency
parents:
- congenital disorder of deglycosylation
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Autosomal recessive congenital disorder of deglycosylation caused by biallelic MAN2C1 variants.
    evidence:
    - reference: PMID:35045343
      reference_title: Impaired catabolism of free oligosaccharides due to MAN2C1 variants causes a neurodevelopmental
        disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In this study, we report the clinical, biochemical, and molecular features of six individuals,
        including two fetuses, with bi-allelic pathogenic variants in MAN2C1; the individuals are from
        four different families.
      explanation: Establishes the autosomal recessive genetic etiology of MAN2C1-CDDG2.
  - classification_value: NEUROLOGIC
    notes: Primarily manifests as a neurodevelopmental disorder with intellectual disability, polymicrogyria,
      callosal anomalies, and brainstem/cerebellar vermis hypoplasia.
    evidence:
    - reference: PMID:35045343
      reference_title: Impaired catabolism of free oligosaccharides due to MAN2C1 variants causes a neurodevelopmental
        disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: These results emphasize the involvement of MAN2C1 in human neurodevelopmental disease and
        the importance of fOS catabolism.
      explanation: Demonstrates that MAN2C1 deficiency primarily causes a human neurodevelopmental and
        structural brain malformation disorder.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: Inborn error of cytosolic free-oligosaccharide catabolism and glycoprotein deglycosylation.
    evidence:
    - reference: PMID:35045343
      reference_title: Impaired catabolism of free oligosaccharides due to MAN2C1 variants causes a neurodevelopmental
        disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We further demonstrate that MAN2C1 variants lead to accumulation and delay in the processing
        of fOSs in proband-derived cells.
      explanation: Confirms the metabolic defect in free-oligosaccharide catabolism.
  icimd_category:

diagnosis:
- name: Brain Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: Cranial MRI to detect characteristic structural brain malformations including polymicrogyria,
    corpus callosum dysgenesis or agenesis, interhemispheric cysts, hypothalamic hamartoma, hydrocephalus/ventriculomegaly,
    and cerebellar vermis or brainstem hypoplasia.
  presence: Polymicrogyria, callosal anomalies, interhemispheric cysts, and/or cerebellar vermis hypoplasia.
  results: Structural malformations of cortical development and midline/posterior fossa structures.
  evidence:
  - reference: PMID:37486637
    reference_title: Exome Sequencing and the Identification of New Genes and Shared Mechanisms in Polymicrogyria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the criterion standard for polymicrogyria diagnosis is pathologic examination, in
      clinical practice, polymicrogyria is typically identified on magnetic resonance imaging (MRI) during
      workup of epilepsy or developmental delay, where irregular gyration with scalloping of the gray-white
      matter junction is observed.
    explanation: Establishes brain MRI as the standard clinical diagnostic modality for identifying polymicrogyria
      and associated brain malformations.
  - reference: PMID:41623318
    reference_title: Congenital disorder of deglycosylation 2. Report of a novel MAN2C1 pathogenic variant
      and additional phenotypic implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Stenosis of the Sylvian aqueduct was found, which caused an upward arching of the corpus
      callosum and displacement of the adjacent parenchyma.
    explanation: MRI findings in a CDDG2 proband, showing aqueductal stenosis and corpus callosum displacement.
- name: Whole Exome Sequencing
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: Exome sequencing (including copy-number variant analysis) to identify biallelic pathogenic
    single-nucleotide variants or trans microdeletions involving MAN2C1 at 15q24.2.
  presence: Biallelic pathogenic variants in MAN2C1.
  results: Compound heterozygous or homozygous pathogenic MAN2C1 variants, or a point variant in trans
    with a 15q24 microdeletion.
  evidence:
  - reference: PMID:41623318
    reference_title: Congenital disorder of deglycosylation 2. Report of a novel MAN2C1 pathogenic variant
      and additional phenotypic implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It was reported the variant c.76_80delTTTAC (p.Phe26Argfs*3) in the MAN2C1 gene located at
      the non-deleted allele of the proband. Consequently, our patient presented at the same time, the
      clinical diagnosis of congenital disorder of deglycosylation type 2 (CDD2).
    explanation: Reports the MAN2C1 frameshift on the non-deleted allele and the resulting CDDG2 diagnosis.
  - reference: PMID:41623318
    reference_title: Congenital disorder of deglycosylation 2. Report of a novel MAN2C1 pathogenic variant
      and additional phenotypic implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thus, exome sequencing was done where a subsequent result 46,XY,del(15q24.1q24.3) ... was
      detected.
    explanation: Shows that exome sequencing detected the 15q24 microdeletion in the proband, with the
      trans MAN2C1 frameshift reported from the same workup.

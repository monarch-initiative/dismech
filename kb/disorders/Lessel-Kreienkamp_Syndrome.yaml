    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AGO2 | HGNC:3263 | Lessel-Kreienkamp syndrome | MONDO:0030897 | AD | Definitive"
    explanation: ClinGen records the AGO2-LESKRES relationship with autosomal dominant mode of inheritance.

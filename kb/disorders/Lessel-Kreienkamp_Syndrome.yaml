name: Lessel-Kreienkamp Syndrome
creation_date: "2026-10-15T19:12:46Z"
category: Mendelian
synonyms:
- LESKRES
- AGO2-related neurodevelopmental disorder
description: >-
  Lessel-Kreienkamp syndrome (LESKRES) is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous germline variants in
  AGO2, which encodes Argonaute-2, the effector protein of the microRNA-loaded
  RNA-induced silencing complex (RISC). Variants are mostly de novo missense
  substitutions or single-residue in-frame deletions that cluster in the L1
  linker, helix-7 and loops of the PIWI domain; rarer alleles are a de novo
  multi-exon deletion and a splice-region deletion. Developmental delay is
  apparent from infancy or early childhood. Speech and language delay and
  intellectual disability (borderline to severe) are near-universal, with
  motor delay, hypotonia, autistic features, attention deficit hyperactivity
  disorder, gait abnormality, brain MRI anomalies (mainly of the corpus
  callosum), seizures, neonatal feeding difficulties and variable
  craniofacial, skeletal, cardiac and male urogenital anomalies. Functional
  studies divide the alleles into a minority with complete loss of function
  and a majority that keep a folded, miRNA-loaded AGO2 but release target
  mRNAs too slowly, alter the bound miRNA repertoire and over-repress miRNA
  targets; these gain-of-function alleles are associated with more severe
  clinical courses.
disease_term:
  preferred_term: Lessel-Kreienkamp syndrome
  term:
    id: MONDO:0030897
    label: Lessel-Kreienkamp syndrome
parents:
- hereditary disease
- syndromic neurodevelopmental disorder
notes: >-
  LESKRES is the endogenous microRNA-pathway counterpart of AGO1-related
  NEDLBAS (see differential_diagnoses). It shares the miRNA pathway with
  DICER1 tumor predisposition syndrome (kb entry
  DICER1_Tumor_Predisposition_Syndrome), but no tumor predisposition has been
  reported for AGO2 variants in the cohorts cited here, so no cancer
  surveillance claim is made. The rnai_gene_silencing module was considered
  for conformance and not used: it models therapeutic siRNA delivery and
  AGO2-mediated slicing of a target transcript, whereas the LESKRES
  mechanism is altered target release and miRNA loading in the endogenous
  miRNA pathway. No disease-specific treatment, management guideline or
  clinical trial was found; the treatments section is intentionally empty.
  MONDO:0030897 carries no Orphanet cross-reference (its xrefs are GARD,
  MedGen, OMIM:619149 and UMLS).
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous AGO2 variants act dominantly. Most arise de novo, but
    transmission from mildly or similarly affected parents and from mosaic
    parents has been documented, which is relevant to recurrence-risk
    counselling.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

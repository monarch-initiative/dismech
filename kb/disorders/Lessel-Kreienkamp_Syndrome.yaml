      id: hgnc:3263
      label: AGO2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous missense variants, single-residue in-frame deletions, a
    splice-region deletion and a multi-exon deletion. De novo occurrence
    predominates, but inherited cases (from mildly affected parents and from
    mosaic parents) are documented; variant_origin records the predominant
    origin.

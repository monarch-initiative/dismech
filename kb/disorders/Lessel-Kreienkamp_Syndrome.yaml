    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven missense mutations, one in-frame deletion (Fig. 1a) and a 235.3-kb deletion involving the first three exons occurred de novo (Fig. 1b)."
    explanation: In the founding cohort of 21 patients nearly all alleles arose de novo in the heterozygous state.
  - reference: PMID:42638108

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals 29 and 30 (siblings) inherited the p.(Gly604Arg) from mosaic mother, similar to individual 43 who inherited the p.(Ala801Val) from mosaic father."
    explanation: Documents parental mosaicism as a route of transmission in addition to de novo occurrence.
  - reference: PMID:40574801
    reference_title: Identification of a novel AGO2 variant causing LESKRES in a Chinese family with intellectual disability.

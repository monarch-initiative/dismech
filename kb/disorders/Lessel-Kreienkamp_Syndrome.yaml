animal_models:
- name: Ago2 p.Leu192Pro knock-in mouse (heterozygous)
  species: Mouse
  genotype: Ago2 p.L193P knock-in (orthologous to human p.Leu192Pro), heterozygous
  publication: PMID:41099708
  description: >-
    CRISPR knock-in mice carrying the mouse equivalent of the recurrent
    p.Leu192Pro allele. Heterozygotes are under-represented at birth and breed
    poorly, and their cortex shows transcriptome changes with over-repression
    of Ago2-bound mRNAs. Surviving animals appear healthy; no neurological or
    behavioural phenotype is reported. A knock-in line for the
    loss-of-function allele (human p.Gly733Arg) showed few transcriptome
    changes.
  evidence:
  - reference: PMID:41099708
    reference_title: Dysregulation of AGO2-miRNA dynamics underlies the AGO2-associated Lessel-Kreienkamp syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This observation suggests a possible defect in early embryogenesis; however, surviving animals appeared healthy and showed no obvious signs of disease."
    explanation: Records the absence of an overt disease phenotype in surviving heterozygotes.
  modeled_mechanisms:
  - target: Neuronal miRNA Target Over-Repression
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Heterozygous knock-in cortex shows over-repression of Ago2-bound miRNA targets.
    limitations: >-
      No overt neurodevelopmental or behavioural phenotype was reported in
      surviving heterozygotes, so the model captures the molecular step but
      not the clinical outcome; bulk cortical RNA-seq does not resolve which
      neuronal populations are affected.
    evidence:
    - reference: PMID:41099708
      reference_title: Dysregulation of AGO2-miRNA dynamics underlies the AGO2-associated Lessel-Kreienkamp syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings indicate that the L192P mutation leads to over-repression of miRNA-targeted mRNAs in the mouse cortex."
      explanation: The knock-in cortex shows the over-repression step.
differential_diagnoses:
- name: AGO1-related neurodevelopmental disorder (NEDLBAS)
  description: >-
    De novo AGO1 variants cause a highly similar neurodevelopmental disorder,
    and affect residues structurally equivalent to LESKRES hotspots (AGO1
    p.Leu190Pro corresponds to AGO2 p.Leu192Pro). Gene-level testing
    distinguishes them.
  disease_term:
    preferred_term: neurodevelopmental disorder with language delay and behavioral abnormalities, with or without seizures
    term:
      id: MONDO:0859531
      label: neurodevelopmental disorder with language delay and behavioral abnormalities, with or without seizures
  distinguishing_features:
  - Causal variant in AGO1 rather than AGO2 on exome or genome sequencing.
  evidence:
  - reference: PMID:34930816
    reference_title: De novo coding variants in the AGO1 gene cause a neurodevelopmental disorder with intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSION: Our study establishes that de novo coding variants in AGO1 are involved in a novel monogenic form of NDD, highly similar to the recently reported AGO2-related NDD."
    explanation: Establishes the clinical overlap between AGO1- and AGO2-related disorders.

    evidence_source: HUMAN_CLINICAL
    snippet: "RESULTS: All four intellectual disability individuals carried the novel AGO2 (NM_012154.5): c.2149T>C (p.Cys717Arg) variant, while the other individuals did not."
    explanation: Co-segregation of a heterozygous AGO2 variant with intellectual disability in a family supports dominant transmission.
pathophysiology:
- name: AGO2 Gain-of-Function Missense Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  role: trigger
  description: >-
    Most LESKRES missense and in-frame alleles (for example p.Leu192Pro,
    p.Ala367Pro, p.Thr357Met, p.Phe182del) produce a stably folded AGO2 that
    still binds and uses miRNA guides but has altered conformational dynamics
    around the L1 linker, helix-7 and PIWI loops. Kinetic, RNA Bind-n-Seq and
    knock-in mouse data led the authors to classify these alleles as gain of
    function, and they correlate with more severe clinical courses. The
    original 2020 cohort paper had described the tested alleles as loss of
    function, in the sense of excluding a dominant-negative effect; that
    earlier framing is recorded below as contrary evidence.
  genes:
  - preferred_term: AGO2
    term:
      id: hgnc:3263
      label: AGO2
  genetic_context:
    gene:
      preferred_term: AGO2
      term:
        id: hgnc:3263
        label: AGO2
    allele_type: missense
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous, mostly de novo missense variants and single-residue
      in-frame deletions clustering in the L1 linker, helix-7 and PIWI-domain
      loops.
  evidence:
  - reference: PMID:41099708
    reference_title: Dysregulation of AGO2-miRNA dynamics underlies the AGO2-associated Lessel-Kreienkamp syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The combined results suggest patient mutations impact AGO2 targeting dynamics in a gain-of-function manner, leading to deregulation of the neuronal transcriptome and the observed neurodevelopmental anomalies."
    explanation: The primary mechanistic study classifies the tested LESKRES missense alleles as gain of function.
  - reference: PMID:42638108
    reference_title: The clinical and molecular spectrum of AGO2-associated Lessel-Kreienkamp neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants clustered in defined regions of AGO2, including the L1 loop, helix-7, and multiple loops of the PIWI domain, highlight structural hotspots critical for RISC activity."
    explanation: The 45-individual cohort defines the structural hotspots in which the variants cluster.
  - reference: PMID:33199684
    reference_title: Germline AGO2 mutations impair RNA interference and human neurological development.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Currently, our characterization of selected mutations supports the view that they lead to a loss-of-function rather than a dominant-negative effect (see Fig. 2f)."
    explanation: >-
      The 2020 study framed the tested alleles (including p.Leu192Pro) as loss
      of function; this rested on excluding a dominant-negative effect in a

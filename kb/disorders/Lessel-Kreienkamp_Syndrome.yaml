- name: Dendritic P-body Accumulation of AGO2
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In cultured hippocampal neurons overexpressing p.Phe182del, p.Leu192Pro or
    p.Met364Thr AGO2, the density of AGO2-positive P-bodies in dendrites
    almost doubles, while somatic granules are unchanged. The authors infer
    impaired local dendritic translation and synaptic plasticity; this rests
    on overexpression in rodent neurons and has not been shown in patient
    neurons.

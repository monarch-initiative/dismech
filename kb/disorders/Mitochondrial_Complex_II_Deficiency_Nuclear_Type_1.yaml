    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now report a mutation in the nuclear-encoded flavoprotein (Fp) subunit gene of the succinate dehydrogenase (SDH) in two siblings with complex II deficiency presenting as Leigh syndrome."
    explanation: Documents SDHA (flavoprotein subunit) complex II deficiency presenting as Leigh syndrome (subacute necrotizing encephalopathy).
- category: Neurologic
  name: Developmental regression
  description: Progressive loss of acquired motor and cognitive milestones (psychomotor retardation), typically beginning in infancy or early childhood.

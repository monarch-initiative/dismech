  features: >-
    Biallelic pathogenic variants in SDHA, encoding the flavoprotein catalytic
    subunit of succinate dehydrogenase (complex II), cause nuclear-type
    mitochondrial complex II deficiency 1. Variant classes include nonsense,
    missense, and splice-disrupting alleles. Notably, some SDHA alleles (e.g.
    c.91C>T, p.Arg31*) reported in biallelic mitochondrial disease overlap with
    alleles reported in monoallelic SDHx tumor-predisposition (paraganglioma,
    pheochromocytoma, GIST), so tumor surveillance is recommended for carriers.
    ClinGen gene-disease validity curations exist for SDHA in Leigh syndrome
    (MONDO:0009723) and hereditary pheochromocytoma-paraganglioma
    (MONDO:0017366), but not specifically for MONDO:0100294.
discussions:
- discussion_id: mismatch_no_faithful_sdha_animal_model
  prompt: >-
    Do the available whole-organism complex II mouse models faithfully
    recapitulate SDHA nuclear type 1 disease, given that the principal inducible
    Leigh-like mouse model disrupts Sdhc (not SDHA) by abrupt systemic knockout
    rather than the hypomorphic biallelic SDHA alleles seen in patients?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#SDHA Loss and Complex II (Succinate Dehydrogenase) Deficiency
  - pathophysiology#Bioenergetic Failure and Multisystem Energy Deficit
  rationale: >-
    The best whole-organism complex II model - an inducible systemic SDH-loss
    mouse - produces a lethal Leigh-like syndrome and validates the general
    consequence of complex II failure, and chronic hypoxia rescues it. However,
    it disrupts Sdhc, not SDHA, and uses abrupt complete knockout rather than the
    partial-function hypomorphic biallelic SDHA alleles that cause human disease.
    It therefore models complex II failure in general but not the SDHA genotype,
    residual-activity biology, or the human neuroanatomy of Leigh lesions. This
    is a translational-validity gap (a model exists but does not phenocopy the
    SDHA genotype/tissue context), so it is flagged as HUMAN_MODEL_MISMATCH.
    Isogenic CRISPR-corrected SDHA patient iPSC-derived neurons and organoids are
    the emerging route to a faithful model.
  proposed_experiments:
  - experiment_id: exp_sdha_ipsc_neuron_complexII
    experiment_design: TARGETED_PERTURBATION
    name: SDHA patient iPSC-derived neuron complex II assembly and bioenergetics assay
    description: >-
      Generate isogenic CRISPR-corrected and SDHA-mutant human iPSC-derived
      neurons and quantify complex II assembly, succinate-supported respiration,
      ATP/phosphocreatine production, and susceptibility to metabolic stress,
      testing whether hypomorphic biallelic SDHA alleles reproduce the severe,
      cell-type-specific bioenergetic failure that the Sdhc mouse cannot capture.
    experiment_type:
      preferred_term: iPSC-derived neuron perturbation assay
    model_systems:
    - name: Human iPSC-derived neuron
      description: >-
        Neurons differentiated from SDHA-mutant patient iPSCs (with isogenic
        corrected controls), preserving the human SDHA genotype and neuronal
        context absent from the Sdhc mouse.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:24781757
    reference_title: "SDHA mutations causing a multisystem mitochondrial disease: novel mutations and genetic overlap with hereditary tumors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Its pathogenicity was confirmed by lentiviral complementation experiments on the fibroblasts of patients carrying this mutation."
    explanation: >-
      Patient fibroblast complementation is currently the strongest functional
      model of SDHA disease, underscoring the absence of a faithful SDHA
      whole-organism model.
treatments:
- name: Supportive and Metabolic Care
  description: >-
    No curative therapy exists; management is supportive, multidisciplinary, and
    phenotype-directed, including management of lactic acidosis, epilepsy, and
    cardiomyopathy, nutritional support, ophthalmologic and neurologic
    surveillance, and avoidance of catabolic stressors.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:16737791
    reference_title: "Effects of riboflavin in children with complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "No satisfactory treatment is currently available, and affected patients undergo a relentlessly progressive motor and mental deterioration."
    explanation: States that no curative disease-modifying treatment is established for isolated complex II deficiency, making multidisciplinary supportive care essential.
- name: Riboflavin (vitamin B2) supplementation
  description: >-
    Oral supplementation with riboflavin, the biosynthetic precursor of the
    covalently bound FAD cofactor of SDHA, is used empirically in isolated
    mitochondrial complex II deficiency; in biochemically diagnosed complex
    II-deficient children and fibroblasts whose molecular subunit genotype was
    not determined (Bugiani et al., 2006), riboflavin doubled residual fibroblast
    complex II activity and was associated with biochemical or neurological
    stabilization, though clinical efficacy has not been established in
    genetically confirmed SDHA cohorts.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: riboflavin supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
  target_mechanisms:
  - target: SDHA Loss and Complex II (Succinate Dehydrogenase) Deficiency
    treatment_effect: RESTORES
    description: >-
      Riboflavin supplies precursor for the FAD cofactor of SDHA and increased
      residual complex II activity 2-fold in cultured fibroblasts from
      complex II-deficient patients of undetermined genotype, providing an
      empirical cofactor-stabilization rationale for hypomorphic SDHA deficiency.
    evidence:
    - reference: PMID:16737791
      reference_title: "Effects of riboflavin in children with complex II deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Riboflavin supplementation to the growth medium of cultured fibroblasts resulted in a 2-fold increase of complex II activity in patients, but not in controls."
      explanation: Demonstrates a 2-fold increase in residual complex II activity upon riboflavin supplementation in complex II-deficient patient fibroblasts; marked INDIRECT because the patients' complex II subunit or assembly-factor genotype was not reported.
  evidence:
  - reference: PMID:16737791
    reference_title: "Effects of riboflavin in children with complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "In two patients with early-onset leukoencephalopathy, neurological condition remained stable or even moderately improved."
    explanation: Reports clinical stabilization or mild improvement during oral riboflavin supplementation in biochemically diagnosed complex II-deficient children; marked INDIRECT because molecular SDHA status was not determined.
  - reference: PMID:16737791
    reference_title: "Effects of riboflavin in children with complex II deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Riboflavin supplementation to the growth medium of cultured fibroblasts resulted in a 2-fold increase of complex II activity in patients, but not in controls."
    explanation: Provides biochemical rationale from complex II-deficient patient fibroblasts of undetermined molecular genotype.

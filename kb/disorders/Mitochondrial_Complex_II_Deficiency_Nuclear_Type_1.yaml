  - reference: PMID:22972948
    reference_title: "Recessive germline SDHA and SDHB mutations causing leukodystrophy and isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blotting and BN-PAGE studies confirmed decreased steady-state levels of the relevant SDH subunits and impairment of complex II assembly."
    explanation: Confirms that SDH gene defects reduce SDH subunit levels and impair complex II assembly.
  downstream:
  - target: Impaired Succinate Oxidation and Electron Transfer to Ubiquinone
    causal_link_type: DIRECT
    description: Reduced assembled and catalytically active complex II lowers succinate:ubiquinone oxidoreductase capacity.
    evidence:
    - reference: PMID:7550341
      reference_title: "Mutation of a nuclear succinate dehydrogenase gene results in mitochondrial respiratory chain deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The deleterious effect of the Arg to Trp substitution on the catalytic activity of SDH was observed in a SDH- yeast strain transformed with mutant Fp cDNA."
      explanation: Demonstrates directly that loss-of-function substitution in the SDHA flavoprotein subunit impairs succinate dehydrogenase catalytic activity.
- name: Impaired Succinate Oxidation and Electron Transfer to Ubiquinone
  description: >-
    Deficient complex II activity impairs FAD-dependent oxidation of succinate to
    fumarate and the transfer of electrons through the SDHB iron-sulfur clusters
    to ubiquinone, disrupting the direct junction between the TCA cycle and the
    respiratory electron transport chain.
  role: effector
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Complex Deficiency"
  biological_processes:

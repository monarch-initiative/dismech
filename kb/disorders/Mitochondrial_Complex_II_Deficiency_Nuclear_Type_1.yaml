inheritance:
- name: Autosomal Recessive
  description: >-
    Caused by homozygous or compound heterozygous loss-of-function variants in
    SDHA; heterozygous carrier relatives may carry increased risk for SDHx-related
    paraganglioma, pheochromocytoma, or gastrointestinal stromal tumor when the
    allele overlaps tumor-predisposition variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24781757
    reference_title: "SDHA mutations causing a multisystem mitochondrial disease: novel mutations and genetic overlap with hereditary tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Underlying autosomal-recessive genetic defects are found in most of the 'SDHx' genes encoding complex II (SDHA, SDHB, SDHC, and SDHD) and its assembly factors."
    explanation: Establishes autosomal-recessive inheritance of SDHA-related mitochondrial complex II deficiency.
  - reference: PMID:7550341
    reference_title: "Mutation of a nuclear succinate dehydrogenase gene results in mitochondrial respiratory chain deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were homozygous for an Arg554Trp substitution in the Fp subunit."
    explanation: Confirms biallelic inheritance in the index Leigh syndrome siblings with SDHA complex II deficiency.

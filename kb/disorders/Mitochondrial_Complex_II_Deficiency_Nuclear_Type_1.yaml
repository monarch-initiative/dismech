      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This is the first report of a nuclear gene mutation causing a mitochondrial respiratory chain deficiency in humans."
      explanation: Establishes nuclear-encoded Mendelian genetic etiology of SDHA mitochondrial complex II deficiency.
  mechanistic_category:
  - classification_value: mitochondrial disease
    evidence:
    - reference: PMID:24781757
      reference_title: "SDHA mutations causing a multisystem mitochondrial disease: novel mutations and genetic overlap with hereditary tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we characterize four patients with isolated complex II deficiency caused by mutations in SDHA presenting with multisystem mitochondrial disease including Leigh syndrome (LS) and/or leukodystrophy."
      explanation: Directly classifies biallelic SDHA deficiency as a multisystem mitochondrial respiratory-chain disease.
  icimd_category:
  - classification_value: complex_ii_subunits_and_assembly_factors
    notes: >-
      ICIMD nuclear-encoded oxidative phosphorylation category: complex II
      subunit and assembly-factor defects. SDHA encodes the flavoprotein
      catalytic subunit of complex II, so nuclear type 1 disease belongs to this
      category.
prevalence:
- measure_type: PERIOD_PREVALENCE
  prevalence_class: ULTRA_RARE
  notes: >-
    No disease-specific prevalence estimate exists. Isolated complex II
    deficiency accounts for roughly 2% of respiratory-chain deficiency
    diagnoses, and only a handful of SDHA cases have been reported (about 25
    patients with 11 recessive SDHA variants by 2015), so SDHA nuclear type 1 is
    ultra-rare.
  evidence:
  - reference: PMID:22972948
    reference_title: "Recessive germline SDHA and SDHB mutations causing leukodystrophy and isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Isolated complex II deficiency is a rare form of mitochondrial disease, accounting for approximately 2% of all respiratory chain deficiency diagnoses."
    explanation: Establishes the rarity of isolated complex II deficiency, of which SDHA nuclear type 1 is a subset.
pathophysiology:
- name: SDHA Loss and Complex II (Succinate Dehydrogenase) Deficiency
  description: >-
    Biallelic loss-of-function variants in SDHA reduce or destabilize the
    catalytic flavoprotein subunit of succinate dehydrogenase, lowering
    steady-state levels of assembled complex II and the amount of catalytically
    active succinate:ubiquinone oxidoreductase in the inner mitochondrial
    membrane.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Subunit or Assembly Factor Defect"

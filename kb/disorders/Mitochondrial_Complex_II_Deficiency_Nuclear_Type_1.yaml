  - reference: PMID:11692162
    reference_title: "Phenotypic dichotomy in mitochondrial complex II genetic disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Complex II oxidizes succinate to fumarate in the Krebs cycle and is involved in the mitochondrial electron transport chain."
    explanation: Defines the dual TCA-cycle and electron-transport role of complex II that is lost when SDHA is deficient. Evidence source is OTHER because this is a review.
  - reference: PMID:7550341
    reference_title: "Mutation of a nuclear succinate dehydrogenase gene results in mitochondrial respiratory chain deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The deleterious effect of the Arg to Trp substitution on the catalytic activity of SDH was observed in a SDH- yeast strain transformed with mutant Fp cDNA."
    explanation: Functional yeast complementation shows the flavoprotein-subunit mutation reduces SDH catalytic activity.
  downstream:
  - target: Bioenergetic Failure and Multisystem Energy Deficit
    causal_link_type: DIRECT
    description: Loss of succinate-driven electron flow reduces oxidative ATP synthesis.
- name: Bioenergetic Failure and Multisystem Energy Deficit
  description: >
    Reduced electron flux through the respiratory chain lowers oxidative
    phosphorylation and forces a shift to anaerobic glycolysis, elevating lactate
    and producing lactic acidosis. Energy-demanding post-mitotic tissues (brain,
    skeletal muscle, optic nerve, and sometimes heart) are preferentially
    affected, giving the characteristic Leigh-spectrum and multisystem phenotype.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:11692162
    reference_title: "Phenotypic dichotomy in mitochondrial complex II genetic disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Genetic disorders of the mitochondrial respiratory chain are often characterized by hypotonia, growth retardation, cardiomyopathy, myopathy, neuropathy, organ failure, and metabolic derangement."
    explanation: Describes the multisystem, high-energy-tissue phenotype produced by respiratory-chain bioenergetic failure. Evidence source is OTHER because this is a review.
  downstream:
  - target: Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Energy deficit in brainstem and basal ganglia produces the necrotizing Leigh lesions.
  - target: Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic bioenergetic failure in cardiomyocytes drives cardiomyopathy in a subset of patients.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical symptoms started at age five months and led to a severe progressive neurodegenerative disorder causing epilepsy, psychomotor retardation, and tetraspasticity."
    explanation: Describes progressive neurodegeneration with psychomotor retardation in an SDHA Leigh syndrome patient.
- category: Neurologic

name: Mitochondrial Complex II Deficiency, Nuclear Type 1
category: Mendelian
creation_date: "2026-07-24T00:00:00Z"
synonyms:
- MC2DN1
- SDHA-related mitochondrial complex II deficiency
- succinate dehydrogenase complex flavoprotein subunit A deficiency
- nuclear-type mitochondrial complex II deficiency 1
- isolated complex II deficiency due to SDHA
description: >
  Mitochondrial complex II deficiency, nuclear type 1 (MC2DN1) is an autosomal
  recessive mitochondrial respiratory-chain disorder caused by biallelic
  pathogenic variants in SDHA, the gene encoding the catalytic flavoprotein
  subunit of succinate dehydrogenase (complex II, succinate:ubiquinone
  oxidoreductase). Complex II uniquely couples the tricarboxylic acid (TCA)
  cycle to the electron transport chain: its FAD-containing SDHA subunit oxidizes
  succinate to fumarate and passes the resulting electrons through the SDHB
  iron-sulfur subunit to ubiquinone. Loss of SDHA function reduces assembled,
  catalytically active complex II, impairing succinate oxidation and electron
  transfer and collapsing oxidative ATP synthesis. Affected children most often
  present in infancy or early childhood with Leigh syndrome (subacute
  necrotizing encephalomyelopathy) and/or leukodystrophy, and less commonly with
  cardiomyopathy or a later-onset optic atrophy-ataxia-myopathy phenotype,
  accompanied by lactic acidosis, hypotonia, developmental regression, and
  seizures. SDHA was the first nuclear gene in which mutations were shown to
  cause a mitochondrial oxidative-phosphorylation disorder. The disorder is
  ultra-rare: as of a 2015 review only ~25 patients with 11 recessive SDHA
  variants had been reported.

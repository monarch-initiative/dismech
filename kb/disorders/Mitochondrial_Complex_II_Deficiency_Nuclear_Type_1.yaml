name: Mitochondrial Complex II Deficiency, Nuclear Type 1
category: Mendelian
creation_date: "2026-07-24T00:00:00Z"
updated_date: "2026-07-24T00:00:00Z"
synonyms:
- MC2DN1
- SDHA-related mitochondrial complex II deficiency
- succinate dehydrogenase complex flavoprotein subunit A deficiency
- nuclear-type mitochondrial complex II deficiency 1
description: >
  Mitochondrial complex II deficiency, nuclear type 1 (MC2DN1) is an autosomal
  recessive mitochondrial respiratory-chain disorder caused by biallelic
  pathogenic variants in SDHA, the gene encoding the catalytic flavoprotein
  subunit of succinate dehydrogenase (complex II, succinate:ubiquinone
  oxidoreductase). Complex II uniquely couples the tricarboxylic acid (TCA)
  cycle to the electron transport chain: it oxidizes succinate to fumarate and
  transfers the resulting electrons through FAD and iron-sulfur clusters to
  ubiquinone. Loss of SDHA function reduces assembled, catalytically active
  complex II, impairing succinate oxidation and electron transfer and collapsing
  oxidative ATP synthesis. Affected children most often present in infancy or
  early childhood with Leigh syndrome (subacute necrotizing encephalomyelopathy),
  leukoencephalopathy, and/or cardiomyopathy, accompanied by lactic acidosis,
  hypotonia, developmental regression, and failure to thrive. SDHA was the first
  nuclear gene in which mutations were shown to cause a mitochondrial
  oxidative-phosphorylation disorder.
disease_term:
  preferred_term: mitochondrial complex II deficiency, nuclear type 1
  term:
    id: MONDO:0100294
    label: mitochondrial complex II deficiency, nuclear type 1
parents:
- Mitochondrial Disease
pathophysiology:
- name: SDHA Loss and Complex II (Succinate Dehydrogenase) Deficiency
  description: >
    Biallelic loss-of-function variants in SDHA reduce the catalytic flavoprotein
    subunit of succinate dehydrogenase, destabilizing assembly of the complex II
    holoenzyme and lowering the amount of catalytically active enzyme in the
    inner mitochondrial membrane.
  biological_processes:
  - preferred_term: respiratory chain complex II assembly
    term:
      id: GO:0034552
      label: respiratory chain complex II assembly
    modifier: DECREASED
  downstream:
  - target: Impaired Succinate Oxidation and Electron Transfer to Ubiquinone
    causal_link_type: DIRECT
    description: Reduced active complex II lowers succinate:ubiquinone oxidoreductase capacity.
- name: Impaired Succinate Oxidation and Electron Transfer to Ubiquinone
  description: >
    Deficient complex II activity impairs oxidation of succinate to fumarate and
    the transfer of electrons to ubiquinone, disrupting the junction between the
    TCA cycle and the respiratory electron transport chain.
  biological_processes:
  - preferred_term: mitochondrial electron transport, succinate to ubiquinone
    term:
      id: GO:0006121
      label: mitochondrial electron transport, succinate to ubiquinone
    modifier: DECREASED
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  downstream:
  - target: Bioenergetic Failure and Lactic Acidosis
    causal_link_type: DIRECT
    description: Loss of succinate-driven electron flow reduces oxidative ATP synthesis.
- name: Bioenergetic Failure and Lactic Acidosis
  description: >
    Reduced electron flux through the respiratory chain lowers oxidative
    phosphorylation and forces a shift to anaerobic glycolysis, elevating lactate
    and producing lactic acidosis in blood and cerebrospinal fluid. Energy-demanding
    post-mitotic tissues (brain, heart, skeletal muscle) are preferentially affected.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  downstream:
  - target: Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Energy deficit in brainstem and basal ganglia produces necrotizing Leigh lesions.
  - target: Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic bioenergetic failure in cardiomyocytes drives cardiomyopathy.
phenotypes:
- name: Encephalopathy
  description: Subacute necrotizing encephalopathy (Leigh syndrome) with basal ganglia and brainstem involvement.
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
- name: Developmental regression
  description: Loss of previously acquired motor and cognitive milestones.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
- name: Lactic acidosis
  description: Elevated blood and CSF lactate from impaired oxidative metabolism.
  phenotype_term:
    preferred_term: Lactic acidosis
    term:
      id: HP:0003128
      label: Lactic acidosis
- name: Muscular hypotonia
  description: Generalized low muscle tone, common in infantile presentations.
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
- name: Cardiomyopathy
  description: Dilated or hypertrophic cardiomyopathy from cardiomyocyte energy failure.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
- name: Leukoencephalopathy
  description: White matter disease on neuroimaging.
  phenotype_term:
    preferred_term: Leukoencephalopathy
    term:
      id: HP:0002352
      label: Leukoencephalopathy
- name: Optic atrophy
  description: Optic nerve atrophy with visual impairment.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
- name: Seizures
  description: Epileptic seizures associated with the encephalopathy.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
- name: Failure to thrive
  description: Poor weight gain and growth in infancy.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
genetic:
- name: SDHA pathogenic variants causing complex II deficiency
  gene_term:
    preferred_term: SDHA
    term:
      id: hgnc:10680
      label: SDHA
  inheritance:
  - name: Autosomal recessive
  features: >
    Biallelic pathogenic variants in SDHA, encoding the flavoprotein catalytic
    subunit of succinate dehydrogenase (complex II), cause nuclear-type
    mitochondrial complex II deficiency 1.
treatments:
- name: Supportive and Metabolic Care
  description: >
    No curative therapy exists; management is supportive and includes treatment
    of lactic acidosis, anti-seizure medication, nutritional support, cardiac
    surveillance, and avoidance of metabolic decompensation. Riboflavin (a
    precursor of the FAD cofactor of complex II) has produced clinical
    improvement in some SDHA-deficient patients.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care

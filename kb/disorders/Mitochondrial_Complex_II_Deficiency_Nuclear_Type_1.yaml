- category: Metabolic
  name: Lactic acidosis
  description: >-
    Elevated blood or urinary lactate and ketotic/lactic-acidotic organic acid
    profiles from impaired oxidative metabolism; lactate elevation in SDHA
    deficiency is often mild or intermittent (for example 3.7 mmol/L in a
    neonatal cardiomyopathy cohort, or normal random plasma lactate alongside
    elevated urinary lactate and ketotic acylcarnitines).
  phenotype_term:

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Genetic disorders of the mitochondrial respiratory chain are often characterized by hypotonia, growth retardation, cardiomyopathy, myopathy, neuropathy, organ failure, and metabolic derangement."
    explanation: Describes the multisystem, high-energy-tissue phenotype produced by respiratory-chain bioenergetic failure, which PMID:11692162 explicitly notes SDHA mutations share.
  downstream:
  - target: Increased Glycolytic Lactate Production
    causal_link_type: DIRECT
    description: Impaired mitochondrial oxidative phosphorylation and TCA cycle flux force compensatory cytosolic glycolysis and NADH-driven pyruvate-to-lactate reduction.
  - target: Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Bioenergetic failure in brainstem and basal ganglia produces subacute necrotizing Leigh encephalopathy.
  - target: Leukoencephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Oligodendrocyte and white-matter bioenergetic failure produces symmetrical cerebral leukodystrophy with cystic degeneration.
  - target: Developmental regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Progressive central nervous system energy deficit causes loss of acquired motor and cognitive milestones.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cortical and subcortical neuronal ATP depletion destabilizes network excitability and causes epilepsy.
  - target: Spasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Corticospinal and central white-matter bioenergetic injury produces upper-motor-neuron tetraspasticity.
  - target: Muscular hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Combined central nervous system and skeletal muscle bioenergetic insufficiency leads to generalized hypotonia.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Systemic ATP deficiency and chronic metabolic derangement impair somatic growth in infancy.
  - target: Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic bioenergetic failure in cardiomyocytes drives neonatal or infantile dilated cardiomyopathy in a subset of patients.
  - target: Left ventricular noncompaction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Myocardial complex II deficiency during fetal and neonatal ventricular remodeling is associated with left ventricular myocardial noncompaction alongside dilated cardiomyopathy.
- name: Increased Glycolytic Lactate Production
  description: >-
    Deficient mitochondrial oxidative phosphorylation and tricarboxylic acid
    cycle block at succinate dehydrogenase shift cellular glucose metabolism
    toward anaerobic glycolysis and lactate biosynthesis, elevating systemic or
    urinary lactate and organic acid intermediates.
  role: consequence
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:22972948
    reference_title: "Recessive germline SDHA and SDHB mutations causing leukodystrophy and isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urinary amino acids were normal, while organic acids demonstrated raised lactate, ketones and 3-hydroxyisovalerate and elevated tricarboxylic acid cycle"
    explanation: Demonstrates elevated urinary lactate and TCA cycle organic acids in Patient 1 with compound heterozygous SDHA mutations.
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The laboratory indices were normal except for mildly increased lactate of 3.7 mmol/l. The electrocardiogram of all patients was sinus rhythm with LV hypertrophy and normal QTC interval."
    explanation: Confirms mildly elevated blood lactate in patients homozygous for the SDHA p.Gly555Glu mutation.
  downstream:
  - target: Lactic acidosis
    causal_link_type: DIRECT
    description: Excess glycolytic lactate production and impaired hepatic/renal oxidative lactate clearance elevate circulating and urinary lactate.
phenotypes:
- category: Neurologic

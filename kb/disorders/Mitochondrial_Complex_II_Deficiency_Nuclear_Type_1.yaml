biochemical:
- name: Reduced succinate dehydrogenase (complex II) enzyme activity
  presence: DECREASED
  context: >-
    Markedly reduced complex II (SDH) activity in patient skeletal muscle and
    fibroblasts is the defining biochemical feature; in one SDHA series residual
    fibroblast complex II activity was only ~8-26% of controls.
  evidence:
  - reference: PMID:16361598
    reference_title: "Leigh syndrome caused by mutations in the flavoprotein (Fp) subunit of succinate dehydrogenase (SDHA)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical measurement of skeletal muscle showed a severe decrease in mitochondrial complex II."
    explanation: Quantifies the severe reduction of complex II activity in SDHA-deficient patient muscle.
  - reference: PMID:24781757
    reference_title: "SDHA mutations causing a multisystem mitochondrial disease: novel mutations and genetic overlap with hereditary tumors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For the third new mutation, c.565T>G, we show that it severely affects enzyme activity."
    explanation: Shows an SDHA missense variant severely reduces complex II enzyme activity.

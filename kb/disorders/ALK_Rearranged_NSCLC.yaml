- name: Microenvironment-mediated ALK bypass resistance
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Cancer-associated fibroblasts and tumor-associated macrophages can supply
    paracrine or matrix-associated signals that maintain resistant-cell survival
    through MET-integrin or GAS6-AXL pathways.
  biological_processes:
  - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
    modifier: INCREASED

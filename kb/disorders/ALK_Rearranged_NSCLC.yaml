    snippet: The G1202R mutation in the EML4-ALK fusion was found to confer resistance to crizotinib in Ba/F3 cells.
    explanation: >-
      The accepted CIViC evidence item provides a bounded cell-model assertion
      for G1202R-mediated crizotinib resistance.
  - reference: PMID:28676215
    reference_title: "Identification of a novel T1151K ALK mutation in a patient with ALK-rearranged NSCLC with prior exposure to crizotinib and ceritinib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that the T1151K ALK mutation confers resistance to ceritinib,
      which may be rescued by alectinib or lorlatinib as evidenced by this
      clinical narrative.
    explanation: >-
      This patient report demonstrates drug-specific sensitivity rather than
      uniform class resistance.
- name: Adaptive kinase-bypass resistance
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Resistant tumor cells can restore survival output through alternate
    receptor or intracellular kinases, including EGFR and SRC. The attached
    perturbation evidence is preclinical, so proposed combination strategies
    are not represented as established care.
  biological_processes:

  - reference: CIVIC_ASSERTION:34
    reference_title: "v::ALK Fusion / Lung Non-small Cell Carcinoma (Predictive Sensitivity/Response)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ALK fusion positive NSCLC is sensitive to alectinib
    explanation: CIViC's accepted assertion directly supports alectinib sensitivity in ALK fusion-positive NSCLC.
- name: Lorlatinib
  description: >-
    A third-generation, brain-penetrant ALK inhibitor used for advanced
    ALK-positive NSCLC. Seven-year CROWN follow-up showed durable systemic and
    intracranial control relative to crizotinib. Preclinical data support
    activity across wild-type ALK and multiple single kinase-domain resistance
    mutations; this does not imply control of bypass signaling or every compound
    mutation.
  target_mechanisms:
  - target: Constitutive ALK mitogenic and survival signaling
    treatment_effect: INHIBITS
    description: >-
      Lorlatinib inhibits the ALK kinase program maintained by the fusion
      oncoprotein.
    evidence:

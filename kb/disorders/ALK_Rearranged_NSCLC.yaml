epidemiology:
- name: Cohort-dependent ALK-rearrangement frequency
  description: >-
    ALK rearrangements define a minority molecular subtype whose measured
    frequency varies with histology, stage, population, and testing strategy.
    A surgical NSCLC cohort found 3.8%, whereas a large Chinese advanced-NSCLC
    cohort found 6.7%; these selected-cohort proportions are not population
    point-prevalence estimates.
  evidence:
  - reference: PMID:22129856
    reference_title: "Clinicopathologic implication of ALK rearrangement in surgically resected lung cancer: a proposal of diagnostic algorithm for ALK-rearranged adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 735 NSCLC cases, 28 (3.8%) were ALK FISH-positive.
    explanation: >-
      This surgical cohort provides a directly measured ALK-positive fraction
      while defining the population and assay used.
  - reference: PMID:39016057
    reference_title: "Real-world data on ALK rearrangement test in Chinese advanced non-small cell lung cancer (RATICAL): a nationwide multicenter retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall ALK gene rearrangement rate was 6.7% in 23,689 patients with
      advanced NSCLC and 8.2% in 17,436 patients with advanced lung
      adenocarcinoma.
    explanation: >-
      This large advanced-disease cohort demonstrates that molecular-subtype
      fractions depend on the clinical and histologic denominator.
- name: Younger-age and never-smoker enrichment
  description: >-
    ALK-positive NSCLC is enriched among younger patients and never-smokers.
    These are epidemiologic associations, not downstream effects of ALK fusion
    signaling and not substitutes for tumor molecular testing.
  evidence:
  - reference: PMID:22129856
    reference_title: "Clinicopathologic implication of ALK rearrangement in surgically resected lung cancer: a proposal of diagnostic algorithm for ALK-rearranged adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALK rearrangement was significantly higher in adenocarcinomas (6.8%,
      p<0.001), younger age (p<0.0007), women (7.6%, p<0.001), and never-smokers
      (8.9%, p<0.001) with no gender difference in the adenocarcinoma or
      never-smoker subgroup.
    explanation: >-
      The cohort directly supports age and smoking-status enrichment without
      implying a causal molecular pathway.
  - reference: PMID:39016057
    reference_title: "Real-world data on ALK rearrangement test in Chinese advanced non-small cell lung cancer (RATICAL): a nationwide multicenter retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall ALK gene rearrangement rates were higher in females, patients
      of ≤ 35 years old, never smokers, tumor cellularity of > 50, and metastatic
      specimens used for testing in the total NSCLC population and adenocarcinoma
      subgroup (all P < 0.05).
    explanation: >-
      The nationwide cohort independently supports the demographic enrichment.
has_subtypes:
- name: EML4::ALK fusion-positive NSCLC
  description: >-
    EML4 is the dominant ALK fusion partner in NSCLC. Different EML4 breakpoints
    create molecular variants; variant 3 may be associated with poorer outcomes
    in pooled studies, but it is not an established treatment-selection marker
    and ALEX did not find variant-specific alectinib efficacy differences.
  evidence:
  - reference: PMID:17625570
    reference_title: Identification of the transforming EML4-ALK fusion gene in non-small-cell lung cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that a small inversion within chromosome 2p results in the
      formation of a fusion gene comprising portions of the echinoderm
      microtubule-associated protein-like 4 (EML4) gene and the anaplastic
      lymphoma kinase (ALK) gene in non-small-cell lung cancer (NSCLC) cells.
    explanation: >-
      The discovery study identifies the defining EML4::ALK inversion and also
      reports transforming activity in cell and mouse models.
  - reference: PMID:41959926
    reference_title: A meta-analysis of the impact of different ALK variants on targeted therapy efficacy in advanced non-small cell lung cancer.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: V3 was associated with shorter progression-free survival (PFS)
    explanation: >-
      The pooled association supports possible adverse prognostic value but
      does not establish a variant-directed treatment rule.
  - reference: PMID:30902613
    reference_title: "Updated Efficacy and Safety Data and Impact of the EML4-ALK Fusion Variant on the Efficacy of Alectinib in Untreated ALK-Positive Advanced Non-Small Cell Lung Cancer in the Global Phase III ALEX Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      variants 1, 2, and 3/ab did not affect PFS, objective response rate, or
      duration of response.
    explanation: >-
      ALEX bounds the meta-analytic signal by showing no efficacy difference
      across common variants in that alectinib trial.
- name: Other ALK fusion-partner NSCLC
  description: >-
    Less common ALK fusions use partners other than EML4. Published examples
    include KIF5B::ALK, TFG::ALK, and TNIP2::ALK; evidence for response and
    prognosis is partner-specific and much sparser than for EML4::ALK.
  evidence:
  - reference: PMID:31521978
    reference_title: The clinical responses of TNIP2-ALK fusion variants to crizotinib in ALK-rearranged lung adenocarcinoma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALK rearrangements have been previously identified in about 5.1% of lung
      adenocarcinoma, including EML4-ALK fusion variants, KIF5B-ALK and TFG-ALK.
    explanation: >-
      The report directly names non-EML4 partners but does not establish uniform
      behavior across all rare fusions.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_alk_fusion_mitogenic_signaling_model
  hypothesis_label: Canonical ALK Fusion Mitogenic Signaling Model
  status: CANONICAL
  description: >-
    A somatic ALK fusion creates a constitutively active kinase that assembles
    cytoplasmic signaling foci and sustains MAPK and PI3K-AKT output. The
    resulting ALK-dependent proliferation and survival program drives the
    predominantly adenocarcinoma NSCLC phenotype and creates a targetable
    oncogene dependence. Metastatic progression to the CNS uses additional
    general invasion, dissemination, and colonization steps rather than a
    demonstrated direct ALK-to-brain route.
  evidence:
  - reference: PMID:17625570
    reference_title: Identification of the transforming EML4-ALK fusion gene in non-small-cell lung cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mouse 3T3 fibroblasts forced to express this human fusion tyrosine kinase
      generated transformed foci in culture and subcutaneous tumours in nude
      mice.
    explanation: >-
      The discovery study demonstrates transforming activity of EML4::ALK in
      both cell culture and a mouse tumor model.
  - reference: PMID:20952506
    reference_title: Inhibition of ALK, PI3K/MEK, and HSP90 in murine lung adenocarcinoma induced by EML4-ALK fusion oncogene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To evaluate potential treatment strategies for lung cancers driven by an
      activated EML4-ALK chimeric oncogene, we generated a genetically engineered
      mouse model that phenocopies the human disease where this rearranged gene
      arises.
    explanation: >-
      The inducible mouse model supports an ALK-fusion-driven lung-tumor program
      while remaining preclinical evidence.
- hypothesis_group_id: acquired_alk_tki_resistance_model
  hypothesis_label: Acquired ALK TKI Resistance Model
  status: CANONICAL
  description: >-
    Exposure to ALK-directed therapy imposes selection pressure that can produce
    on-target ALK kinase-domain mutations or preserve tumor-cell survival through
    adaptive kinase signaling, microenvironmental bypass, and phenotypic state
    changes such as EMT. The existence of these resistance classes is
    established; many specific combination strategies remain preclinical, and no
    single later-generation ALK inhibitor suppresses every bypass or compound
    resistance state.
  evidence:
  - reference: PMID:37149843
    reference_title: "EML4-ALK biology and drug resistance in non-small cell lung cancer: a new phase of discoveries."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, resistance to ALK inhibitors can occur via point-mutations within
      the kinase domain of the EML4-ALK fusion, for example G1202R, reducing
      inhibitor effectiveness.
    explanation: >-
      This review supports the established on-target mutation class while not
      implying that all resistance is ALK-dependent.
  - reference: PMID:28676215
    reference_title: "Identification of a novel T1151K ALK mutation in a patient with ALK-rearranged NSCLC with prior exposure to crizotinib and ceritinib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that the T1151K ALK mutation confers resistance to ceritinib,
      which may be rescued by alectinib or lorlatinib as evidenced by this
      clinical narrative.
    explanation: >-
      The patient narrative directly connects sequential ALK-TKI exposure with
      an acquired on-target resistance mutation and differential drug response.

name: ALK-Rearranged Non-Small Cell Lung Cancer
creation_date: '2026-01-26T02:55:13Z'
description: >-
  ALK-rearranged non-small cell lung cancer (NSCLC) is a molecular subtype
  defined by a somatic ALK fusion oncoprotein, most commonly EML4::ALK from a
  chromosome 2 inversion. It accounts for a cohort-dependent minority of NSCLC
  and is enriched among younger people and never-smokers, but those demographic
  associations are neither causal mechanisms nor diagnostic criteria.
  Adenocarcinoma is the predominant histology, with rare ALK-rearranged squamous
  cancers reported. ALK tyrosine kinase inhibitors produce substantial systemic
  and intracranial disease control; CNS progression and acquired on-target or
  bypass resistance remain important disease-management challenges.
categories:
- Molecularly-Defined Cancer
- Lung Cancer Subtype
- Fusion Gene-Driven Cancer
- Solid Tumor
parents:
- non-small cell lung carcinoma
synonyms:
- ALK-positive NSCLC
- ALK fusion-positive non-small cell lung cancer
- ALK-rearranged lung cancer

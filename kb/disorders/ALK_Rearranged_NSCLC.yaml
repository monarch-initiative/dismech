treatments:
- name: Alectinib
  description: >-
    A second-generation ALK inhibitor used in advanced ALK-positive NSCLC and,
    in a distinct disease setting, as adjuvant therapy after complete resection.
    In ALEX it prolonged progression-free survival relative to crizotinib; in
    ALINA it improved disease-free survival relative to platinum chemotherapy
    for resected stage IB (tumors at least 4 cm), II, or IIIA disease. Overall
    survival data from ALINA were immature in the cited analysis.
  target_mechanisms:
  - target: Constitutive ALK mitogenic and survival signaling
    treatment_effect: INHIBITS
    description: >-
      Alectinib (CH5424802) inhibits ALK kinase activity and suppresses growth
      driven by EML4::ALK.
    evidence:
    - reference: PMID:21575866
      reference_title: "CH5424802, a selective ALK inhibitor capable of blocking the resistant gatekeeper mutant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        showing preferential antitumor activity against cancers with gene
        alterations of ALK, such as nonsmall cell lung cancer (NSCLC) cells
        expressing EML4-ALK fusion
      explanation: >-
        Preclinical data directly support inhibition of the ALK-dependent
        growth program represented by this target node.

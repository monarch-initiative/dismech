  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"
  role: trigger
  description: >-
    A somatic inversion or translocation preserves the ALK kinase domain and
    joins it to an N-terminal partner. EML4::ALK is the dominant exemplar in
    NSCLC; other partners can create the same disease-defining class without
    necessarily reproducing every EML4-specific assembly property.

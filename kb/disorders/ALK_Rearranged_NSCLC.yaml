histopathology:
- name: Adenocarcinoma-predominant morphology
  finding_term:
    preferred_term: lung adenocarcinoma
    term:
      id: NCIT:C3512
      label: Lung Adenocarcinoma
  description: >-
    ALK-rearranged NSCLC is enriched in adenocarcinoma and can show acinar,
    cribriform, or solid growth, mucin production, and signet-ring-cell elements.
    Rare molecularly confirmed ALK-rearranged squamous carcinomas prevent an
    exclusive-adenocarcinoma formulation.
  evidence:
  - reference: PMID:22129856
    reference_title: "Clinicopathologic implication of ALK rearrangement in surgically resected lung cancer: a proposal of diagnostic algorithm for ALK-rearranged adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar to EGFR-mutated lung cancer, ALK-rearranged lung cancer was
      enriched in adenocarcinoma, women, and never-smokers.
    explanation: >-
      This ALK-specific cohort supports adenocarcinoma enrichment without an
      unsupported universal frequency band.
  - reference: PMID:26095438
    reference_title: Analysis of Histologic Features Suspecting Anaplastic Lymphoma Kinase (ALK)-Expressing Pulmonary Adenocarcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acinar, cribriform, and solid growth patterns, extracellular and
      intracellular mucin production, and presence of signet-ring-cell element,
      and psammoma body were significantly more often present in ALK-positive
      cancer.
    explanation: >-
      Direct histologic comparison supports the morphology described for
      ALK-positive pulmonary adenocarcinoma.
  - reference: PMID:40783309
    reference_title: Clinical Outcomes of Patients With Advanced ALK-Rearranged Lung Squamous Cell Carcinoma Treated With ALK Tyrosine Kinase Inhibitors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA-based next-generation sequencing (NGS) has identified ALK
      rearrangements in lung squamous cell carcinoma (LUSC), a subset of
      nonsmall cell lung cancer traditionally lacking effective targeted
      therapies.
    explanation: >-
      This recent cohort establishes the rare squamous exception but does not
      quantify its frequency among all ALK-positive cancers.


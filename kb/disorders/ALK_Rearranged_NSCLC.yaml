    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that a small inversion within chromosome 2p results in the
      formation of a fusion gene comprising portions of the echinoderm
      microtubule-associated protein-like 4 (EML4) gene and the anaplastic

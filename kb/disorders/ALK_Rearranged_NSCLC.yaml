    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Concurrent targeting of MET and integrin signaling effectively abrogated
      ALK inhibitor resistance in EML4-ALK+ NSCLC cells cocultured with CAFs.
    explanation: >-
      The coculture perturbation directly supports a stromal MET-integrin rescue
      mechanism.
  - reference: PMID:39904499
    reference_title: AXL-Mediated Drug Resistance in ALK-Rearranged NSCLC Enhanced by GAS6 From Macrophages and MMP11 Positive Fibroblasts.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings suggest that AXL expression in resistant cancer cells,
      combined with increased Gas6 production in the TME, contributes to
      enhanced ALK-TKI resistance.
    explanation: >-
      The study combines tumor and microenvironment models to support a
      GAS6-AXL resistance axis.
- name: EMT-associated ALK TKI resistance
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    In an EML4::ALK G1202R cell model, STAT3-Slug activation induces an
    epithelial-to-mesenchymal state with increased migration and invasion and
    reduced ceritinib sensitivity. Its prevalence and treatment implications in
    patients remain unresolved.
  biological_processes:

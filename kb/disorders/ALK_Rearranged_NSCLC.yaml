    snippet: ALK-FUSIONS are found in 3-5% of non-small cell lung cancer and act as a targetable driver mutation.
    explanation: >-
      The accepted CIViC assertion independently classifies ALK fusions as
      targetable NSCLC driver alterations.
  downstream:
  - target: Constitutive ALK mitogenic and survival signaling
    causal_link_type: DIRECT
    description: >-
      Fusion-mediated ALK activation produces ligand-independent kinase output
      and constitutive downstream signaling.
    hypothesis_groups:
    - canonical_alk_fusion_mitogenic_signaling_model
    evidence:
    - reference: CIVIC_ASSERTION:34
      reference_title: "v::ALK Fusion / Lung Non-small Cell Carcinoma (Predictive Sensitivity/Response)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These fusions act as driver mutations through ligand-independent
        dimerization of ALK and constitutive downstream pathway activation.
      explanation: >-
        CIViC directly supports the causal link from ALK fusion to constitutive
        signaling while avoiding a universal claim about every partner's
        detailed oligomeric structure.
- name: Constitutive ALK mitogenic and survival signaling
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  role: central_effector
  description: >-
    Active EML4::ALK assembles cytoplasmic signaling foci containing MAPK and
    PI3K pathway components. Sustained kinase output engages MEK-ERK and
    PI3K-AKT survival programs; JAK-STAT is not asserted here as a universal
    disease-level branch because the attached evidence is variant- and
    context-dependent.
  biological_processes:
  - preferred_term: Ras protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  - preferred_term: phosphatidylinositol 3-kinase signaling
    modifier: INCREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence:
  - reference: PMID:34661367
    reference_title: Phase-separated foci of EML4-ALK facilitate signalling and depend upon an active kinase conformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that EML4-ALK V1 and V3 proteins form cytoplasmic foci that
      contain components of the MAPK, PLCγ and PI3K signalling pathways.
    explanation: >-
      Cell experiments directly localize core signaling components to
      EML4::ALK assemblies.
  downstream:
  - target: ALK-dependent tumor-cell proliferation and survival
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - PI3K-AKT survival signaling
    - MEK-ERK proliferative signaling
    description: >-
      Persistent ALK output maintains growth and survival through the PI3K-AKT
      and MEK-ERK pathways.
    hypothesis_groups:
    - canonical_alk_fusion_mitogenic_signaling_model
    evidence:
    - reference: PMID:20952506
      reference_title: Inhibition of ALK, PI3K/MEK, and HSP90 in murine lung adenocarcinoma induced by EML4-ALK fusion oncogene.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In H3122 cells, TAE684-mediated ALK inhibition results in downregulation
        of PI3K/AKT and MEK/ERK1/2 signaling, and apoptosis.
      explanation: >-
        Pharmacologic perturbation in EML4::ALK cells links ALK activity to both
        pathway output and cell survival.
- name: ALK-dependent tumor-cell proliferation and survival
  conforms_to: "sustaining_proliferative_signaling#Growth-Factor-Independent Proliferation"
  role: consequence
  description: >-
    ALK-rearranged tumor cells depend on continued fusion-kinase signaling for
    proliferation and survival. This is a targetable oncogene dependence, not a
    claim that ALK expression alone transforms every human lung-cell context.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:20952506
    reference_title: Inhibition of ALK, PI3K/MEK, and HSP90 in murine lung adenocarcinoma induced by EML4-ALK fusion oncogene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings suggest that EML4-ALK–driven cancers display features of
      oncogene dependence or addiction and that ALK inhibitors may be
      particularly effective for this lung cancer subset.
    explanation: >-
      The preclinical study explicitly frames the ALK-rearranged model as
      oncogene-dependent.
  downstream:
  - target: Lung Adenocarcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - clonal expansion
    - malignant transformation
    description: >-
      Sustained ALK-dependent proliferation and survival support malignant
      transformation into the predominantly adenocarcinoma NSCLC phenotype.
    hypothesis_groups:
    - canonical_alk_fusion_mitogenic_signaling_model
    evidence:
    - reference: PMID:17625570
      reference_title: Identification of the transforming EML4-ALK fusion gene in non-small-cell lung cancer.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mouse 3T3 fibroblasts forced to express this human fusion tyrosine kinase
        generated transformed foci in culture and subcutaneous tumours in nude
        mice.
      explanation: >-
        The experimental transformation result supports tumorigenic capacity
        while the indirect edge preserves the required intermediate steps.
  - target: Brain Metastases
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - local tumor progression and invasion
    - hematogenous dissemination
    - central nervous system colonization
    description: >-
      ALK-positive lung tumors can progress through the general metastatic
      cascade to clinically frequent brain metastases; an ALK-specific direct
      route to the brain is not asserted.
    hypothesis_groups:
    - canonical_alk_fusion_mitogenic_signaling_model
    evidence:
    - reference: PMID:34147645
      reference_title: "Treatment of brain metastases in ALK-positive non-small cell lung cancer."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: Brain metastases are quite frequent in patients with ALK-translocated non-small cell lung cancer (NSCLC)
      explanation: >-
        The review directly supports the clinical endpoint but not a unique
        ALK-specific metastatic mechanism, so support for the causal edge is
        partial.
- name: ALK TKI therapeutic selection pressure
  role: trigger
  description: >-
    ALK-directed therapy suppresses sensitive tumor cells while creating a
    treatment-conditioned selection environment in which resistant on-target
    clones, adaptive signaling programs, microenvironmental rescue, or altered
    cell states can persist and expand. Treatment exposure—not oncogene
    dependence by itself—is the proximal context for acquired resistance.
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    modifier: ABNORMAL
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - reference: PMID:28676215
    reference_title: "Identification of a novel T1151K ALK mutation in a patient with ALK-rearranged NSCLC with prior exposure to crizotinib and ceritinib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report for the first time a novel ALK T1151K mutation in a patient
      with metastatic ALK-rearranged NSCLC who progressed on crizotinib and then
      ceritinib.
    explanation: >-
      The clinical sequence directly establishes treatment exposure before the
      acquired mutation was detected.
  downstream:
  - target: ALK kinase-domain mutation-mediated resistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - survival of mutation-bearing tumor subclones
    - expansion during ALK inhibition
    description: >-
      ALK-TKI pressure can select kinase-domain substitutions that reduce
      inhibitor binding or alter drug-specific sensitivity.
    hypothesis_groups:
    - acquired_alk_tki_resistance_model
    evidence:
    - reference: PMID:28676215
      reference_title: "Identification of a novel T1151K ALK mutation in a patient with ALK-rearranged NSCLC with prior exposure to crizotinib and ceritinib."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here we report for the first time a novel ALK T1151K mutation in a
        patient with metastatic ALK-rearranged NSCLC who progressed on
        crizotinib and then ceritinib.
      explanation: >-
        This is direct patient evidence for an acquired on-target mutation after
        sequential ALK-TKI exposure.
  - target: Adaptive kinase-bypass resistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - compensatory receptor tyrosine kinase activation
    - restoration of downstream survival signaling
    description: >-
      Resistant cells can restore growth signaling through alternate kinase
      pathways despite continued ALK inhibition.
    hypothesis_groups:
    - acquired_alk_tki_resistance_model
    evidence:
    - reference: PMID:24199682
      reference_title: Dual ALK and EGFR inhibition targets a mechanism of acquired resistance to the tyrosine kinase inhibitor crizotinib in ALK rearranged lung cancer.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Crizotinib+erlotinib (reversible EGFR TKI) and crizotinib+afatinib
        (irreversible EGFR/ERBB2 TKI) were able to inhibit the growth of H3122 CR
        clones, confirming EGFR activation as a mechanism of resistance.
      explanation: >-
        Resistant-cell experiments demonstrate a compensatory EGFR bypass
        program; clinical benefit from dual inhibition is not inferred.
  - target: Microenvironment-mediated ALK bypass resistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - stromal growth-factor or matrix signaling
    - MET-integrin or GAS6-AXL survival output
    description: >-
      Fibroblast- and macrophage-derived signals can preserve resistant tumor
      cell survival through MET, integrin, or GAS6-AXL pathways.
    hypothesis_groups:
    - acquired_alk_tki_resistance_model
    evidence:
    - reference: PMID:41433419
      reference_title: Cancer-associated fibroblasts confer ALK inhibitor resistance in EML4-ALK-driven lung cancer by concurrent integrin and MET signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Concurrent targeting of MET and integrin signaling effectively abrogated
        ALK inhibitor resistance in EML4-ALK+ NSCLC cells cocultured with CAFs.
      explanation: >-
        The coculture experiment directly supports concurrent stromal MET and
        integrin rescue, while remaining preclinical.
  - target: EMT-associated ALK TKI resistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - STAT3-Slug activation
    - epithelial-to-mesenchymal state transition
    description: >-
      In a G1202R cell model, STAT3-Slug signaling accompanies an invasive EMT
      state and reduced ceritinib sensitivity.
    hypothesis_groups:
    - acquired_alk_tki_resistance_model
    evidence:
    - reference: PMID:35085771
      reference_title: EML4-ALK G1202R mutation induces EMT and confers resistance to ceritinib in NSCLC cells via activation of STAT3/Slug signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we demonstrated that the expression of EML4-ALK G1202R mutation in
        A549 cells induced an epithelial-mesenchymal transition (EMT) phenotype
        and significantly increased the migration and invasion abilities.
      explanation: >-
        The cell experiment directly links the G1202R context to EMT and invasive
        behavior without establishing a universal clinical route.
- name: ALK kinase-domain mutation-mediated resistance
  role: effector
  description: >-
    Secondary ALK kinase-domain substitutions can change inhibitor binding or
    ATP competition. G1202R is a solvent-front resistance mutation, while T1151K
    illustrates drug-specific resistance that may retain sensitivity to another
    ALK inhibitor. This node does not assert that a single agent covers all
    compound mutations.

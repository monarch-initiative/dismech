diagnosis:
- name: Tumor ALK fusion testing
  presence: REQUIRED_FOR_SUBTYPE_ASSIGNMENT
  description: >-
    Classification as ALK-rearranged NSCLC requires demonstration of ALK
    positivity in tumor material. Immunohistochemistry, break-apart FISH, and
    DNA- or RNA-based next-generation sequencing provide complementary protein,
    rearrangement, and expressed-fusion readouts. Discordant or complex results
    may require orthogonal confirmation; demographic enrichment is not an
    adequate substitute for testing.
  results: Detection of an oncogenic ALK rearrangement, fusion transcript, or fusion-protein expression
  markers: ALK rearrangement; expressed ALK fusion; ALK protein expression
  evidence:
  - reference: PMID:35624360
    reference_title: Detecting anaplastic lymphoma kinase (ALK) gene rearrangements with next-generation sequencing remains a reliable approach in patients with non-small-cell lung cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The concordance rates were 97.1% (34/35) for RNA-NGS, 94.7% (36/38) for
      IHC, and 97.4% (37/38) for FISH.
    explanation: >-
      Direct method comparison supports the complementary use and high, but not
      perfect, concordance of molecular and protein assays.
  - reference: PMID:37190044
    reference_title: "Gene Fusion Detection in NSCLC Routine Clinical Practice: Targeted-NGS or FISH?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: targeted RNA NGS was confirmed to be the most efficient technique for gene fusion identification in clinical practice
    explanation: >-
      The prospective multicenter comparison supports RNA-based fusion
      identification in routine practice.
  - reference: PMID:39016057
    reference_title: "Real-world data on ALK rearrangement test in Chinese advanced non-small cell lung cancer (RATICAL): a nationwide multicenter retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IHC-VENTANA-D5F3 was used in 53.6%, real-time polymerase chain reaction
      (RT-PCR) in 25.4%, next-generation sequencing (NGS) in 18.3%, and
      fluorescence in-situ hybridization (FISH) in 15.9% in the adenocarcinoma
      subgroup.
    explanation: >-
      The real-world cohort demonstrates multimodal ALK testing rather than a
      single universally sufficient assay workflow.
genetic:
- name: ALK
  gene_term:
    preferred_term: ALK
    term:
      id: hgnc:427
      label: ALK
  association: Somatic Rearrangement
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  notes: >-
    ALK (2p23.2) encodes anaplastic lymphoma kinase, a receptor tyrosine kinase.
    A somatic chromosome 2 inversion creates the common EML4::ALK fusion; other
    somatic partner rearrangements also retain the ALK kinase domain. Secondary
    ALK kinase-domain mutations can emerge under ALK-inhibitor selection.
  evidence:
  - reference: PMID:17625570
    reference_title: Identification of the transforming EML4-ALK fusion gene in non-small-cell lung cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a small inversion within chromosome 2p results in the formation of a
      fusion gene comprising portions of the echinoderm microtubule-associated
      protein-like 4 (EML4) gene and the anaplastic lymphoma kinase (ALK) gene
    explanation: >-
      The discovery study directly identifies the somatic chromosome 2 event
      joining EML4 and ALK in NSCLC cells.
  - reference: CIVIC_ASSERTION:3
    reference_title: "v::ALK Fusion / Lung Non-small Cell Carcinoma (Predictive Sensitivity/Response)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ALK-FUSIONS are found in 3-5% of non-small cell lung cancer and act as a targetable driver mutation.
    explanation: CIViC's accepted assertion supports ALK fusions as defining, targetable genetic drivers in NSCLC.
- name: EML4
  gene_term:
    preferred_term: EML4
    term:
      id: hgnc:1316
      label: EML4
  association: Fusion Partner
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  notes: >-
    EML4 (2p21) encodes echinoderm microtubule-associated protein-like 4.
    Its N-terminal portion joins the ALK kinase domain in the canonical
    EML4::ALK oncoprotein. Multiple transcript variants reflect different EML4
    breakpoints and should not be treated as established therapy-selection
    biomarkers.
  evidence:

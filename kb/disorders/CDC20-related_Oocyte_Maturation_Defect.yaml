name: CDC20-related Oocyte Maturation Defect
creation_date: "2026-10-15T12:00:00Z"
category: Mendelian
disease_term:
  preferred_term: oocyte maturation defect 14
  term:
    id: MONDO:0859521
    label: oocyte maturation defect 14
synonyms:
- oocyte maturation defect 14
- OOMD14
- oocyte/zygote/embryo maturation arrest 14
- OZEMA14
description: >-
  CDC20-related oocyte maturation defect (oocyte maturation defect 14) is an
  autosomal-recessive form of primary female infertility caused by biallelic
  variants in CDC20, the co-activator that switches on the anaphase-promoting
  complex/cyclosome (APC/C) at the metaphase-to-anaphase transition. Affected
  women have normal menstrual cycles and no reported somatic abnormality, but
  their IVF/ICSI cycles fail in one of several ways: oocytes arrest at
  metaphase I (or at a mixture of germinal-vesicle and metaphase-I stages),
  mature oocytes fail to fertilize, or fertilized embryos arrest early. These
  are alternative presentations of reduced CDC20 dosage rather than a fixed
  sequence. Patient variants reduce CDC20 mRNA or protein, truncating alleles
  fail to localize to kinetochores, and the variants impair CDC20-driven cyclin
  B1 degradation and the ability of CDC20 to rescue first-polar-body extrusion
  in Cdc20-depleted mouse oocytes. Hypomorphic Cdc20 mice show that female
  meiosis I has a higher CDC20 threshold than mitosis, which explains why the
  phenotype is restricted to the oocyte. Injection of wild-type CDC20 cRNA into
  patient oocytes restored fertilization and blastocyst formation in a small
  experimental series, but has no established clinical safety or efficacy.
parents:
- hereditary disease
- female reproductive system disease

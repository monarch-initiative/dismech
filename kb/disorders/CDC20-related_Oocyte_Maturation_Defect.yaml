diagnosis:
- name: Genetic testing after repeated IVF/ICSI failure
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome sequencing or a female-infertility gene panel including CDC20 can be
    considered for women with repeated IVF/ICSI failure from oocyte maturation
    arrest, fertilization failure, or early embryo arrest. Biallelic variants
    must be confirmed in trans by parental testing.
  evidence:
  - reference: PMID:34218387
    reference_title: "The homozygous p.Tyr228Cys variant in CDC20 causes oocyte maturation arrest: an additional evidence supporting the causality between CDC20 mutation and female infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings strongly support that the homozygous p.Tyr228Cys variant in
      CDC20 can cause OMA, and that CDC20 should be screened in patients with
      such phenotype.
    explanation: Authors recommend CDC20 screening in oocyte maturation arrest.
treatments:
- name: CDC20 cRNA injection into patient oocytes (experimental)
  action_category: THERAPEUTIC
  description: >-
    Experimental only. Wild-type CDC20 cRNA was injected into first-polar-body
    oocytes from two patients before ICSI. All seven injected oocytes
    fertilized, and two from one patient reached the blastocyst stage, one of
    them euploid on preimplantation screening. No pregnancy or live birth was
    reported, and the authors state that safety must be assessed before
    clinical use.
  therapeutic_modality: MRNA_THERAPY
  treatment_term:
    preferred_term: oocyte cRNA microinjection
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Biallelic CDC20 Variants Reducing APC/C Co-activator Function
    description: >-
      Supplies wild-type CDC20 to the oocyte, bypassing the deficient
      endogenous protein.
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For the proband in family 3, compared with control, all four oocytes
      injected with CDC20 cRNA were successfully fertilized as indicated by the
      formation of two pronuclei on day 1, and two of the oocytes developed
      into blastocysts on day 6 (Fig. 2C and 2D).
    explanation: Ex vivo rescue of fertilization and blastocyst formation.
  - reference: PMID:33898437
    reference_title: "Identification of Novel Mutations in CDC20: Expanding the Mutational Spectrum for Female Infertility."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the safety of such interventions needs to be assessed
      comprehensively and might be further explored by using transgenic mice
      or primates.
    explanation: >-
      A limitation, not efficacy evidence. It supports only this record's
      framing of cRNA injection as experimental: the authors state that its
      safety has not been assessed and that further animal work is needed
      before clinical use.
animal_models:
- name: Cdc20 hypomorphic mouse
  species: Mouse
  genotype: Cdc20 hypomorphic alleles with graded reduction of CDC20 protein
  genes:
  - preferred_term: Cdc20
    term:
      id: MGI:1859866
      label: Cdc20
  publication: PMID:20941357
  description: >-
    Mice expressing low amounts of Cdc20 are healthy with a normal lifespan,
    but females are infertile or subfertile despite normal folliculogenesis
    and fertilization. Their oocytes degrade cyclin B1 and securin
    inefficiently, enter anaphase I late, and missegregate chromosomes.
  modeled_mechanisms:
  - target: Impaired APC/C-CDC20-Mediated Cyclin B1 Degradation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows inefficient degradation of APC/C substrates in metaphase I oocytes
      with reduced Cdc20.
    limitations: >-
      Engineered dosage reduction rather than the patient missense or
      truncating alleles; the mouse oocyte may differ from the human in its
      CDC20 threshold.
    evidence:
    - reference: PMID:20941357
      reference_title: Cdc20 is critical for meiosis I and fertility of female mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, cyclin B1, cyclin A2, and securin are inefficiently
        degraded in metaphase I; and anaphase I onset is markedly delayed.
      explanation: Direct readout of the mechanism node in the model.
  - target: Meiosis I Chromosome Missegregation in Hypomorphic Oocytes
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: >-
      The model is the source of this node; whether patient oocytes missegregate
      chromosomes has not been tested.
    limitations: >-
      Hypomorphic females mostly produce fertilized but aneuploid embryos,
      whereas many patients show complete metaphase-I arrest, so the model
      covers the milder end of the human spectrum.
    evidence:
    - reference: PMID:20941357
      reference_title: Cdc20 is critical for meiosis I and fertility of female mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In exploring the underlying mechanism, we uncover that the vast
        majority of these embryos have abnormal chromosome numbers, primarily
        due to chromosome lagging and chromosome misalignment during meiosis I
        in the oocyte.
      explanation: Missegregation and aneuploidy in the model.
  evidence:
  - reference: PMID:20941357
    reference_title: Cdc20 is critical for meiosis I and fertility of female mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These mice are healthy and have a normal lifespan, but females produce
      either no or very few offspring, despite normal folliculogenesis and
      fertilization rates.
    explanation: Female-restricted infertility with normal somatic health, as in patients.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected women carry homozygous variants (two of them from consanguineous
    families) or compound-heterozygous variants; carrier parents are
    unaffected where tested. No penetrance value is assigned.
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By a recessive inheritance model, we identified two homozygous missense
      mutations (c.683A>G, p.Tyr228Cys and c.1316T>G, p.Leu439Arg) in CDC20,
      respectively (Fig. 1A).
    explanation: >-
      Homozygous variants found under a recessive model in two consanguineous
      families.
  - reference: PMID:39862142
    reference_title: Biallelic mutations in CDC20 cause female infertility due to oocyte maturation abnormality.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through rigorous validation using Sanger sequencing technology, both of
      her parents have been confirmed as genetic carriers of these specific
      mutations.
    explanation: >-
      Compound-heterozygous proband with carrier parents, consistent with
      recessive transmission.
pathophysiology:
- name: Biallelic CDC20 Variants Reducing APC/C Co-activator Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Homozygous missense variants and compound-heterozygous combinations of a
    missense variant with a nonsense, frameshift, or splice allele reduce CDC20
    mRNA or protein. Truncating alleles fail to localize to kinetochores, and
    every tested genotype rescued first-polar-body extrusion less well than
    wild-type CDC20. CDC20 normally binds the APC/C and activates its ubiquitin
    ligase activity toward cyclin B1 and securin. The genotypes are treated as
    partial rather than complete loss of function because Cdc20 knockout is
    embryonic lethal in mice, whereas affected women have no somatic phenotype.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Biallelic genotypes (homozygous missense, or a missense allele combined
      with a nonsense, frameshift, or canonical splice-site allele) that lower
      CDC20 dosage and activity; null alleles occur only in trans with a
      missense allele.
  genes:
  - preferred_term: CDC20
    term:
      id: hgnc:1723
      label: CDC20
  molecular_functions:
  - preferred_term: APC/C co-activator activity
    term:
      id: GO:0097027
      label: ubiquitin-protein transferase activator activity
    modifier: DECREASED
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All these results indicate that mutations in CDC20 lead to unstable
      protein and degraded RNA per se.
    explanation: >-
      Transfected-cell and patient lymphoblastoid-cell assays show reduced
      CDC20 mRNA and protein.
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, CDC20 failed to localize to the kinetochore for the other
      three nonsense or frameshift mutations (p.Arg182*, p.Gly272Serfs*24,
      p.Cys392*) (Fig. 2A), indicating these are loss-of-function mutations.
    explanation: >-
      Truncating alleles lose kinetochore localization when expressed in
      cultured mouse oocytes.
  - reference: PMID:33898437
    reference_title: "Identification of Novel Mutations in CDC20: Expanding the Mutational Spectrum for Female Infertility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      During the metaphase to anaphase transition, Cdc20 binds to and activates
      the ubiquitin ligase activity of APC/C and enables the ubiquitination and
      degradation of cyclin B1, thus promoting the onset of anaphase (Nasmyth
      and Haering, 2005).
    explanation: >-
      States the molecular function bound here, activation of APC/C ubiquitin
      ligase activity.
    quote_role: BACKGROUND
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, previous studies showed that Cdc20 knockout mice were
      embryonic lethal, while Cdc20 hypomorphic mice with graded reduction of
      CDC20 protein level from 60%–27% were healthy and had a normal lifespan
      compared to wild type mice, but only female hypomorphic mice with 27%
      CDC20 protein level were infertile or subfertile (Jin et al., 2010;
      Malureanu et al., 2010).
    explanation: >-
      Basis for treating the human genotypes as hypomorphic: complete loss is
      lethal, whereas reduced dosage gives isolated female infertility.
    quote_role: BACKGROUND
  downstream:
  - target: Impaired APC/C-CDC20-Mediated Cyclin B1 Degradation
    description: >-
      Less CDC20 activity means less APC/C-dependent ubiquitination and
      degradation of cyclin B1.
- name: Impaired APC/C-CDC20-Mediated Cyclin B1 Degradation
  biological_scale: MOLECULAR
  description: >-
    Wild-type CDC20 lowers cyclin B1 levels when overexpressed in CHO cells,
    and most patient variants lose this effect. In hypomorphic Cdc20 mouse
    oocytes, cyclin B1, cyclin A2, and securin are inefficiently degraded in
    metaphase I. Persistent cyclin B1 and securin keep separase inactive and
    hold the oocyte in metaphase.
  biological_processes:
  - preferred_term: APC/C-dependent cyclin B1 degradation
    term:
      id: GO:0031145
      label: anaphase-promoting complex-dependent catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As shown in Fig. 1D and 1E, overexpression of wild-type CDC20
      significantly decreased the endogenous protein level of cyclin B1, while
      most of mutations affected the degradation of cyclin B1.
    explanation: Patient variants impair CDC20-driven cyclin B1 degradation.
  - reference: PMID:33898437
    reference_title: "Identification of Novel Mutations in CDC20: Expanding the Mutational Spectrum for Female Infertility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Most of these mutations caused a decrease in CDC20 protein level and
      affected the degradation of cyclin B1 in CHO cells
    explanation: Replicates the cyclin B1 degradation defect for a second variant set.
  - reference: PMID:20941357
    reference_title: Cdc20 is critical for meiosis I and fertility of female mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, cyclin B1, cyclin A2, and securin are inefficiently degraded
      in metaphase I; and anaphase I onset is markedly delayed.
    explanation: >-
      In hypomorphic Cdc20 mouse oocytes, APC/C substrates persist in
      metaphase I.
  downstream:
  - target: Failed Metaphase I to Anaphase I Transition in Oocytes
    description: >-
      Cyclin B1 and securin must be degraded for homologues to separate and
      anaphase I to begin.
- name: Failed Metaphase I to Anaphase I Transition in Oocytes
  biological_scale: CELLULAR
  description: >-
    Oocytes with too little CDC20 cannot complete the metaphase I to anaphase I
    transition and do not extrude the first polar body. Cdc20 knockdown in
    mouse oocytes gives metaphase-I arrest that wild-type human CDC20 cRNA
    rescues and patient-variant cRNAs rescue poorly. Hypomorphic Cdc20 mouse
    oocytes show markedly delayed anaphase I. The cited studies attribute the
    oocyte-restricted phenotype to a higher CDC20 threshold in female meiosis I
    than in mitosis.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:
  - preferred_term: metaphase/anaphase transition of meiosis I
    term:
      id: GO:1990949
      label: metaphase/anaphase transition of meiosis I
    modifier: DECREASED
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with wild-type, all mutations significantly reduced the ability
      of CDC20 to rescue PB1 extrusion (Fig. 2B).
    explanation: >-
      In cultured Cdc20-knockdown mouse oocytes, patient variants fail to
      restore first-polar-body extrusion.
  - reference: PMID:20941357
    reference_title: Cdc20 is critical for meiosis I and fertility of female mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results demonstrate that the physiologically effective threshold
      level of Cdc20 is high for female meiosis I and identify Cdc20
      hypomorphism as a mechanism for chromosome missegregation and formation
      of aneuploid gametes.
    explanation: >-
      Establishes the high CDC20 dosage requirement of female meiosis I.
  downstream:
  - target: Metaphase I Oocyte Maturation Arrest
    description: >-
      Complete failure of the transition leaves oocytes arrested at metaphase I
      without a first polar body.
  - target: Mixed Oocyte Maturation Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Some cycles yield a mixture of germinal-vesicle and metaphase-I oocytes;
      why some oocytes stop before germinal-vesicle breakdown is not explained.
  - target: Meiosis I Chromosome Missegregation in Hypomorphic Oocytes
    description: >-
      Where the transition is delayed rather than blocked, homologues can
      segregate abnormally (shown in the mouse model).
- name: Meiosis I Chromosome Missegregation in Hypomorphic Oocytes
  biological_scale: CELLULAR
  description: >-
    Model-derived. In hypomorphic Cdc20 mouse oocytes that do complete meiosis
    I, chromosomes lag and misalign, and most resulting embryos are aneuploid,
    malformed, and rarely reach the blastocyst stage despite normal
    fertilization rates. Aneuploidy has not been measured in patient oocytes or
    embryos, so this node is the proposed route, not a demonstrated human
    mechanism, for the fertilization-failure and early-embryo-arrest
    presentations.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:
  - preferred_term: female meiosis chromosome segregation
    term:
      id: GO:0016321
      label: female meiosis chromosome segregation
    modifier: DECREASED
  evidence:
  - reference: PMID:20941357
    reference_title: Cdc20 is critical for meiosis I and fertility of female mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In exploring the underlying mechanism, we uncover that the vast majority
      of these embryos have abnormal chromosome numbers, primarily due to
      chromosome lagging and chromosome misalignment during meiosis I in the
      oocyte.
    explanation: Mouse evidence for meiosis I missegregation and embryo aneuploidy.
  - reference: PMID:20941357
    reference_title: Cdc20 is critical for meiosis I and fertility of female mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      When mated with wild-type males, hypomorphic females yield nearly normal
      numbers of fertilized eggs, but as these embryos develop, they become
      malformed and rarely reach the blastocyst stage.
    explanation: >-
      Links reduced maternal Cdc20 to early embryo failure in the mouse.
  downstream:
  - target: Embryo Developmental Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Aneuploid embryos arrest before the blastocyst stage in the mouse model;
      the same route is assumed, not shown, in patients.
  - target: Fertilization Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mature-appearing oocytes from patients often fail to fertilize; the
      intermediates between reduced CDC20 and fertilization failure are not
      established.
phenotypes:
- name: Female Infertility
  description: >-
    Primary infertility with normal menstrual cycles and normal male-partner
    semen, presenting as repeated IVF/ICSI failure. No somatic abnormality has
    been reported in affected women.
  phenotype_term:
    preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: PMID:33898437
    reference_title: "Identification of Novel Mutations in CDC20: Expanding the Mutational Spectrum for Female Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three probands had been diagnosed with primary infertility of unknown
      cause for several years despite having normal menstrual cycles, and their
      male partners all had normal sperm counts and normal sperm morphology and
      motility.
    explanation: Directly documents primary female infertility.
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all affected individuals in the study only exhibited the phenotype of
      female infertility without any abnormalities in somatic tissues or organs.
    explanation: Infertility is the only reported phenotype.
- name: Metaphase I Oocyte Maturation Arrest
  description: >-
    Retrieved oocytes stay at metaphase I and do not extrude the first polar
    body. This is the most frequently reported presentation, seen with
    homozygous missense and compound-heterozygous genotypes.
  phenotype_term:
    preferred_term: Metaphase I oocyte maturation arrest
    term:
      id: HP:0031516
      label: Metaphase I oocyte maturation arrest
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband in family 2 had undergone two failed ICSI cycles. All of the
      retrieved oocytes were arrested at the MI stage (Table S1).
    explanation: Complete metaphase-I arrest in a homozygous proband.
  - reference: PMID:39862142
    reference_title: Biallelic mutations in CDC20 cause female infertility due to oocyte maturation abnormality.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a case of infertile female for whom all oocytes fail
      to mature and are arrested at MI.
    explanation: Complete metaphase-I arrest in a compound-heterozygous proband.
  - reference: PMID:34218387
    reference_title: "The homozygous p.Tyr228Cys variant in CDC20 causes oocyte maturation arrest: an additional evidence supporting the causality between CDC20 mutation and female infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, 12 oocytes were arrested at MI stage; among the remaining 11 MII
      oocytes, only one was fertilized successfully but failed to form a usable
      embryo for transplant (Table 1).
    explanation: >-
      Partial metaphase-I arrest in a second p.Tyr228Cys homozygote, showing
      that arrest need not affect every oocyte.
  sequelae:
  - target: Female Infertility
    description: Oocytes that do not mature cannot be fertilized.
- name: Mixed Oocyte Maturation Arrest
  description: >-
    Some cycles yield a mixture of germinal-vesicle and metaphase-I oocytes
    rather than uniform metaphase-I arrest.
  phenotype_term:
    preferred_term: Mixed oocyte maturation arrest
    term:
      id: HP:6001356
      label: Mixed oocyte maturation arrest
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In her ICSI cycle, eleven oocytes were obtained, and ten oocytes were
      arrested at the germinal vesicle (GV) or metaphase I (MI) stage (Fig.
      1B), only one was matured and fertilized, but was arrested at three-cell
      stage (Table S1).
    explanation: Mixed GV/MI arrest in a homozygous proband.
  sequelae:
  - target: Female Infertility
    description: Few or no mature oocytes are available for fertilization.
- name: Fertilization Failure
  description: >-
    Oocytes that reach metaphase II, or extrude a first polar body after brief
    culture, fail to fertilize after IVF or ICSI. Seen mainly with
    compound-heterozygous genotypes carrying a truncating allele. No HPO term
    for fertilization failure was found (OLS search of HP for "fertilization
    failure" returned only cleavage, embryo-arrest, and multiple-pronuclei
    terms), so no term is bound.
  phenotype_term:
    preferred_term: Fertilization failure
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the proband in family 3 had a slight delay in oocyte
      maturation, the ultimate phenotype in family 3 and 4 was characterized by
      fertilization failure.
    explanation: Fertilization failure as the main presentation in two families.
  - reference: PMID:33898437
    reference_title: "Identification of Novel Mutations in CDC20: Expanding the Mutational Spectrum for Female Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In brief, both the two probands in families 2 and 3 showed a mixed
      phenotype of maturation arrest and fertilization failure.
    explanation: Fertilization failure alongside maturation arrest in a second cohort.
  sequelae:
  - target: Female Infertility
    description: Unfertilized oocytes give no embryos for transfer.
- name: Embryo Developmental Arrest
  description: >-
    Fertilized embryos arrest at early cleavage stages and do not yield usable
    embryos.
  phenotype_term:
    preferred_term: Embryo developmental arrest
    term:
      id: HP:0020003
      label: Embryo developmental arrest
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband in family 5 showed early embryonic arrest.
    explanation: Early embryonic arrest as the presentation in one family.
  - reference: PMID:33683667
    reference_title: Novel Mutations in CDC20 Are Associated with Female Infertility Due to Oocyte Maturation Abnormality and Early Embryonic Arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings further confirm that biallelic mutations in CDC20 occur in a
      proportion of infertile females with oocyte maturation abnormality and
      early embryonic arrest.
    explanation: Independent cohort reporting the same phenotype group.
  sequelae:
  - target: Female Infertility
    description: Arrested embryos cannot be transferred.
genetic:
- name: CDC20
  association: Causative
  gene_term:
    preferred_term: CDC20 (cell division cycle 20)
    term:
      id: hgnc:1723
      label: CDC20
  notes: >-
    About a dozen probands have been reported, nearly all from Chinese
    infertility cohorts. p.Arg322Gln recurs in trans with different truncating
    alleles, and p.Tyr228Cys homozygotes from two families share a haplotype,
    suggesting a founder allele. Phenotype varies between genotypes. CDC20 was
    found in 1 of 50 women in one oocyte-maturation and embryo-arrest cohort.
  evidence:
  - reference: PMID:32666501
    reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identified biallelic CDC20 mutations in five infertile
      individuals with oocyte maturation arrest, fertilization failure, and
      early embryonic arrest.
    explanation: Founding report establishing CDC20 as the causal gene.
  - reference: PMID:34218387
    reference_title: "The homozygous p.Tyr228Cys variant in CDC20 causes oocyte maturation arrest: an additional evidence supporting the causality between CDC20 mutation and female infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found the two patients carrying the homozygous c.683A>G variant have
      the same haplotype in the 1.4 Mb region, which provides the evidence that
      the c.683A>G variant might be a founder mutation in the Chinese
      population (Table S1).
    explanation: Independent replication with a shared founder haplotype.
  - reference: PMID:33683667
    reference_title: Novel Mutations in CDC20 Are Associated with Female Infertility Due to Oocyte Maturation Abnormality and Early Embryonic Arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two CDC20 variants, a nonsense mutation p.R262* and a missense mutation
      p.A211T, identified in one female of 50 unrelated affected individuals,
      accounting for a relative small proportion of this cohort (2%).
    explanation: Diagnostic yield in a selected infertility cohort.
  variants:
  - name: c.683A>G (p.Tyr228Cys)
    description: >-
      Missense variant found homozygous in two unrelated Chinese probands from
      consanguineous families who share a haplotype around it, suggesting a
      founder allele. Lowers CDC20 protein level in transfected cells.
    type: missense_variant
    evidence:
    - reference: PMID:32666501
      reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified two homozygous missense mutations (c.683A>G,
        p.Tyr228Cys and c.1316T>G, p.Leu439Arg) in CDC20
      explanation: First homozygous p.Tyr228Cys proband.
    - reference: PMID:34218387
      reference_title: "The homozygous p.Tyr228Cys variant in CDC20 causes oocyte maturation arrest: an additional evidence supporting the causality between CDC20 mutation and female infertility."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found the two patients carrying the homozygous c.683A>G variant have
        the same haplotype in the 1.4 Mb region, which provides the evidence
        that the c.683A>G variant might be a founder mutation in the Chinese
        population (Table S1).
      explanation: Second homozygous proband and the shared-haplotype observation.
  - name: c.1316T>G (p.Leu439Arg)
    description: >-
      Missense variant found homozygous in one proband from a consanguineous
      family with complete metaphase-I arrest.
    type: missense_variant
    evidence:
    - reference: PMID:32666501
      reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified two homozygous missense mutations (c.683A>G,
        p.Tyr228Cys and c.1316T>G, p.Leu439Arg) in CDC20
      explanation: Identifies the homozygous p.Leu439Arg proband.
  - name: c.965G>A (p.Arg322Gln)
    description: >-
      Recurrent missense variant, reported in trans with a different truncating
      allele in each of three families in the founding study and again in a
      later cohort. It did not lower CDC20 protein in transfected cells but did
      in patient lymphoblastoid cells. Carriers mostly reached first-polar-body
      extrusion and presented with fertilization failure or embryo arrest.
    type: missense_variant
    evidence:
    - reference: PMID:32666501
      reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The compound heterozygous mutations in CDC20 in the affected individual
        in family 3 consisted of a missense mutation c.965G>A (p. Arg322Gln)
        and a nonsense mutation c.544C>T (p. Arg182*).
      explanation: One of three families carrying p.Arg322Gln in trans with a truncating allele.
    - reference: PMID:33898437
      reference_title: "Identification of Novel Mutations in CDC20: Expanding the Mutational Spectrum for Female Infertility."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among these, mutation c.965G>A (p.Arg322Gln) was reported in our
        previous study (Zhao et al., 2020b)
      explanation: Recurrence of p.Arg322Gln in a second cohort.
  - name: c.544C>T (p.Arg182*)
    description: >-
      Nonsense variant in trans with p.Arg322Gln; the truncated protein fails
      to localize to kinetochores.
    type: stop_gained
    evidence:
    - reference: PMID:32666501
      reference_title: Biallelic mutations in CDC20 cause female infertility characterized by abnormalities in oocyte maturation and early embryonic development.
      supports: SUPPORT

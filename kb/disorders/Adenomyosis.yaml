genetic:
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  relationship_type: SOMATIC_DRIVER
  association: >-
    Activating somatic KRAS mutations are the characteristic genetic lesion of
    adenomyosis, confined to endometrial-type epithelial cells and shared with
    matched eutopic endometrium and with endometriosis, while absent from the
    driver landscape of uterine leiomyoma. They confer survival and
    proliferative advantage and are associated with progesterone resistance.
  evidence:
  - reference: PMID:36925057
    reference_title: "Endometriosis and adenomyosis: shared pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activating mutations of KRAS are the most commonly found genetic variant
      in endometriotic epithelial cells, whereas the adenomyotic epithelial
      cells almost exclusively bear KRAS mutations.
    explanation: >-
      Establishes KRAS as the near-exclusive somatic driver in adenomyotic
      epithelium.
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activating mutations of KRAS stimulate specific pathways to increase cell
      survival and proliferation and are associated with progesterone resistance
      in adenomyosis.
    explanation: >-
      Connects the KRAS driver to both the growth advantage and the
      progesterone-resistant treatment phenotype.
  - reference: PMID:31857578
    reference_title: Uterine adenomyosis is an oligoclonal disorder associated with KRAS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multi-regional sequencing reveals oligoclonality in adenomyosis, with some
      mutations also detected in normal endometrium and/or co-occurring
      endometriosis.
    explanation: >-
      Multi-regional sequencing establishes adenomyosis as oligoclonal and finds
      shared mutations in normal endometrium, independently reinforcing the
      invagination origin.
  - reference: PMID:31857578
    reference_title: Uterine adenomyosis is an oligoclonal disorder associated with KRAS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KRAS mutations are more frequent in cases of adenomyosis with co-occurring
      endometriosis, low progesterone receptor (PR) expression, or progestin
      (dienogest; DNG) pretreatment.
    explanation: >-
      Links the KRAS driver directly to low PR expression and to dienogest
      pretreatment — the clinical bridge between this genetic lesion and the
      progesterone-resistance node.
  case_fractions:
  - population: Japanese adenomyosis cohort, multi-regional NGS
    case_fraction_percent: 37.1
    cohort_size: 70
    notes: 26/70 individuals, 192 multi-regional samples.
    evidence:
    - reference: PMID:31857578
      reference_title: Uterine adenomyosis is an oligoclonal disorder associated with KRAS mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        find recurring KRAS mutations in 26/70 (37.1%) of adenomyosis cases
      explanation: >-
        Largest multi-regional sequencing series, giving the most-cited estimate
        of the KRAS-mutant share of adenomyosis cases.
  - population: Taiwanese adenomyosis cohort, 275-gene targeted NGS panel
    case_fraction_percent: 24.0
    cohort_size: 17
    notes: >-
      Smaller targeted-panel series; KRAS was the most frequently mutated gene,
      ARID1A second.
    evidence:
    - reference: PMID:36708516
      reference_title: Targeted next-generation sequencing for the detection of cancer-associated somatic mutations in adenomyosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The results revealed that KRAS and AT-rich interactive domain 1A
        (ARID1A) were the two most frequently mutated genes (mutation
        frequencies: 24% and 12%, respectively).
      explanation: >-
        Independent cohort confirming KRAS as the leading somatic driver, at a
        lower frequency than the Japanese series.
- name: ARID1A
  gene_term:
    preferred_term: ARID1A
    term:
      id: hgnc:11110
      label: ARID1A
  relationship_type: SOMATIC_DRIVER
  association: >-
    ARID1A, a SWI/SNF chromatin-remodelling subunit, is the second most
    frequently mutated gene in adenomyotic lesions after KRAS. Its loss is a
    recurrent event across endometriosis-associated lesions generally,
    consistent with the shared mutational signature between adenomyosis and
    deep infiltrating endometriosis.
  case_fractions:
  - population: Taiwanese adenomyosis cohort, 275-gene targeted NGS panel
    case_fraction_percent: 12.0
    cohort_size: 17
    evidence:
    - reference: PMID:36708516
      reference_title: Targeted next-generation sequencing for the detection of cancer-associated somatic mutations in adenomyosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The results revealed that KRAS and AT-rich interactive domain 1A
        (ARID1A) were the two most frequently mutated genes (mutation
        frequencies: 24% and 12%, respectively).
      explanation: >-
        Establishes ARID1A as the second most frequent somatic driver in
        adenomyosis at 12% of cases.
  evidence:
  - reference: PMID:36708516
    reference_title: Targeted next-generation sequencing for the detection of cancer-associated somatic mutations in adenomyosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that mutations in the KRAS, ARID1A, FBXW7 and

  downstream:
  - target: Basalis Invagination and Myometrial Infiltration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - invagination_tiar_model
    intermediate_mechanisms:
    - KRAS-driven survival and proliferation of displaced endometrial epithelium.
    description: >-
      Mutant clones possess the survival and growth capability needed to

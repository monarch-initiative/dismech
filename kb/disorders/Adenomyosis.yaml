- name: Basalis Invagination and Myometrial Infiltration
  biological_scale: TISSUE
  description: >-
    Endometrial basalis glands and stroma invaginate into and infiltrate the
    myometrial wall. Invasion is not driven by a single migratory program:
    epithelial-mesenchymal transition is implicated in the early stages of
    progression and spread, while collective cell migration appears to mediate
    the later invasive events, making invasiveness a time-dependent combination
    of two processes. Lesions develop predominantly in the median region of the
    upper two-thirds of the uterine wall.

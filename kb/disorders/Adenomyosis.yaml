name: Adenomyosis
creation_date: '2026-08-02T12:00:00Z'
category: Complex
synonyms:
- adenomyosis uteri
- endometriosis interna
- uterine adenomyosis
description: >-
  Adenomyosis is the presence of endometrial glands and stroma within the
  myometrium, surrounded by hypertrophic and hyperplastic smooth muscle. It
  presents with dysmenorrhea, heavy menstrual bleeding, chronic pelvic pain, and
  impaired fertility, and it is a common cause of hysterectomy. Two competing
  origin theories dominate: invagination of the endometrial basalis into the
  myometrium through a disrupted endometrial-myometrial junction, and metaplasia
  of displaced Müllerian remnants or resident stem cells. Next-generation
  sequencing has shifted the balance decisively toward invagination, showing
  that adenomyotic epithelium carries the same KRAS activating mutations found
  in the matched intracavitary endometrium and lacking the driver mutations of
  uterine leiomyoma. Downstream, epigenetic reprogramming of the stromal
  compartment produces local aromatase-driven estrogen biosynthesis, signaling
  through estrogen receptor beta, and deficient progesterone receptor expression
  with consequent progesterone resistance — the same steroid-response lesion
  shared with endometriosis, and the reason progestin monotherapy often
  underperforms. Adenomyosis and endometriosis are closely related disorders
  that frequently coexist and share this pathophysiology.

- name: Hysterectomy
  description: >-
    Hysterectomy is definitive treatment for adenomyosis and remains a common
    endpoint for women with severe symptoms who have completed childbearing. It
    was also historically the only route to a confirmed diagnosis, which is why
    older prevalence estimates are drawn from surgical series and are not
    generalizable.

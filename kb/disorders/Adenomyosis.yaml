      term:
        id: CHEBI:6427
        label: leuprolide
  target_mechanisms:
  - target: Aromatase-Driven Estrogen Signaling and Progesterone Resistance
    treatment_effect: INHIBITS
    description: >-
      Ovarian suppression removes the systemic estrogen supply that compounds
      local aromatase-derived estrogen at the lesion.
  evidence:
  - reference: PMID:28865548
    reference_title: "Effects of adenomyosis on in vitro fertilization treatment outcomes: a meta-analysis."

- name: Aromatase-Driven Estrogen Signaling and Progesterone Resistance
  biological_scale: MOLECULAR
  description: >-
    Epigenetic abnormalities in lesional stromal cells produce an abnormal
    nuclear receptor expression pattern. The consequences are excessive local
    estrogen biosynthesis by aromatase, abnormal estrogen action routed through
    estrogen receptor beta, and deficient progesterone receptor expression
    yielding progesterone resistance. This receptor lesion is shared with
    endometriosis and is clinically consequential: it is the mechanistic reason
    progestin-based therapy is variably effective, and the rationale for
    combining or substituting agents that lower estrogen exposure.

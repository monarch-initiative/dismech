diagnosis:
- name: Transvaginal sonography and MRI
  description: >-
    Adenomyosis is now diagnosed non-invasively. Transvaginal sonography is the
    first-line modality and MRI the adjunct, with junctional zone thickening the
    principal MRI criterion. This replaced the historical position in which
    diagnosis required a hysterectomy specimen — the single biggest reason older
    prevalence estimates are not comparable with modern ones.
  diagnosis_term:
    preferred_term: transvaginal sonography and MRI
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:37244746
    reference_title: "Guideline No. 437: Diagnosis and Management of Adenomyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic options include transvaginal sonography and magnetic resonance
      imaging.
    explanation: >-
      National guideline establishing the two accepted non-invasive diagnostic
      modalities for adenomyosis.
environmental:
- name: Ovulatory cycling and cumulative estrogen exposure
  description: >-
    Adenomyosis is estrogen-dependent and its severity tracks with ovarian
    steroid exposure and ovulatory cycles — a feature that distinguishes it from
    many other uterine disorders and underlies both its progression through the
    reproductive years and its regression after menopause or ovarian suppression.
  evidence:
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dependence on ovarian steroids and ovulatory cycles for disease severity
      is a unique feature of adenomyosis.
    explanation: >-
      States the steroid- and cycle-dependence of disease severity, the basis
      for hormonal and surgical treatment strategies.
treatments:
- name: Dienogest
  description: >-
    Dienogest, an oral progestin, ranked as the most effective hormonal option
    for adenomyosis-associated pelvic pain in a network meta-analysis of
    randomized trials, outperforming both placebo and the levonorgestrel
    intrauterine system at 3 months on visual analog scale pain scores.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dienogest
      term:
        id: CHEBI:70708
        label: dienogest
  target_mechanisms:
  - target: Local Estrogen Production and TIAR Self-Perpetuation
    treatment_effect: INHIBITS
    description: >-
      Progestin-induced decidualization and subsequent endometrial atrophy,
      together with suppression of ovulatory estrogen exposure, reduce the
      estrogen drive sustaining the lesion.
  evidence:
  - reference: PMID:40166680
    reference_title: "Efficacy and safety of hormone therapies for treating adenomyosis-associated pelvic pain: a systematic review and network meta-analysis of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 3 months, women who received a placebo or a levonorgestrel-based
      intrauterine system (LNG-IUS) experienced more AAPP than those who
      received dienogest
    explanation: >-
      Network meta-analysis of randomized trials ranking dienogest above both
      placebo and LNG-IUS for adenomyosis-associated pelvic pain at 3 months.
  - reference: PMID:31857578
    reference_title: Uterine adenomyosis is an oligoclonal disorder associated with KRAS mutations.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      DNG's anti-proliferative effect is diminished via epigenetic silencing of
      PR in immortalized cells with mutant KRAS.
    explanation: >-
      Qualifies the efficacy evidence above: KRAS-mutant lesions may respond
      less well to dienogest because mutant KRAS drives epigenetic PR silencing.
      Shown in immortalized cells, hence IN_VITRO, so this is a mechanistic
      caveat rather than established clinical stratification.
- name: Levonorgestrel-releasing intrauterine system
  description: >-
    The LNG-IUS delivers progestin locally to the endometrium, reducing
    menstrual blood loss and pain while preserving the uterus. It is a mainstay
    of conservative management, though the randomized evidence places it behind
    dienogest for pain control at 3 months.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levonorgestrel
      term:
        id: CHEBI:6443
        label: levonorgestrel
  target_mechanisms:
  - target: Local Estrogen Production and TIAR Self-Perpetuation
    treatment_effect: INHIBITS
    description: >-
      Local progestin exposure induces endometrial atrophy, opposing the
      estrogen-driven proliferative signal at the lesion.
  evidence:
  - reference: PMID:40166680
    reference_title: "Efficacy and safety of hormone therapies for treating adenomyosis-associated pelvic pain: a systematic review and network meta-analysis of randomized controlled trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 3 months, women who received a placebo or a levonorgestrel-based
      intrauterine system (LNG-IUS) experienced more AAPP than those who
      received dienogest
    explanation: >-
      Places LNG-IUS behind dienogest for pain control at 3 months in the
      randomized evidence, while remaining a widely used uterus-sparing option.
- name: GnRH agonist therapy
  description: >-
    GnRH agonists induce a hypoestrogenic state that suppresses the estrogen
    drive sustaining the lesion. Beyond symptom control, long-term GnRH agonist
    pretreatment before embryo transfer improves fertility outcomes in women
    with adenomyosis, and appears to increase spontaneous pregnancy rates.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

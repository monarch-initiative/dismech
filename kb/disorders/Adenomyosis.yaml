    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KRAS and other less frequent mutations are limited to endometrial-type
      epithelial cells.
    explanation: >-
      Localizes the somatic driver to the epithelial compartment, not the
      myometrial smooth muscle.
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activating mutations of KRAS stimulate specific pathways to increase cell

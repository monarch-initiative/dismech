- name: Endometrial ablation
  description: >-
    Destruction of the endometrial lining to control heavy menstrual bleeding.
    Because adenomyotic tissue lies within the myometrium beyond the reach of an
    ablation, it addresses the bleeding endpoint rather than the lesion, and
    outcomes are less durable than in bleeding without adenomyosis.

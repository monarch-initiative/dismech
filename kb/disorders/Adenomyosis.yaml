differential_diagnoses:
- name: Uterine leiomyoma
  description: >-
    Uterine fibroids are the principal clinical mimic, sharing heavy menstrual
    bleeding, pelvic pain, and uterine enlargement. The two are separable
    molecularly: the driver mutations of uterine fibroid smooth muscle are
    absent from adenomyosis, whose driver (KRAS) is confined to endometrial-type
    epithelium. Imaging distinguishes the diffuse, ill-defined junctional zone
    thickening of adenomyosis from the discrete, well-circumscribed leiomyoma.
  evidence:
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Driver mutations found in smooth muscle cells of uterine fibroids are
      absent in adenomyosis.
    explanation: >-
      Molecular basis for distinguishing adenomyosis from its principal
      differential diagnosis.
- name: Endometriosis
  description: >-
    Endometriosis is not so much a differential as a frequent co-diagnosis with
    shared pathophysiology; in one MRI series the prevalence of endometriosis in
    adenomyosis was 80.6% and of adenomyosis in endometriosis 91.1%. Both arise
    from eutopic endometrium, both carry KRAS-mutant epithelial clones, and both
    show the same stromal epigenetic lesion producing local estrogen excess and
    progesterone resistance. They differ in destination: peritoneal or ovarian
    surfaces via retrograde menstruation versus entrapment in the myometrium.
  evidence:
  - reference: PMID:36925057
    reference_title: "Endometriosis and adenomyosis: shared pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oligoclones of endometrial glandular epithelial cells with somatic
      mutations and attached stromal cells may give rise to endometriosis if
      they travel to peritoneal surfaces or the ovary via retrograde
      menstruation and/or may be entrapped in the myometrium to give rise to
      adenomyosis.
    explanation: >-
      States the common origin and the single branch point that separates
      endometriosis from adenomyosis.
  - reference: PMID:25241270
    reference_title: Adenomyosis and endometriosis. Re-visiting their association and further insights into the mechanisms of auto-traumatisation. An MRI study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of endometriosis in adenomyosis was 80.6% and the
      prevalence of adenomyosis in endometriosis was 91.1%.
    explanation: >-
      Quantifies the near-universal co-occurrence of the two conditions in an
      MRI-based series, supporting shared pathogenesis.
epidemiology:
- name: Diagnostic ascertainment and prevalence uncertainty
  description: >-
    Adenomyosis prevalence estimates vary widely because the diagnosis was
    historically confined to hysterectomy specimens, biasing series toward
    severe symptomatic disease in older parous women. Imaging-based diagnosis
    has broadened ascertainment but introduced its own variability, since
    junctional zone criteria differ between studies and transient peristaltic
    junctional zone enlargement can mimic disease. Adenomyosis remains, on the
    authors' assessment, among the most challenging uterine disorders to
    diagnose.
  evidence:
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is one of the most challenging uterine disorders in terms of diagnosis and
      management
    explanation: >-
      Characterizes the diagnostic difficulty that underlies the wide spread of
      published prevalence estimates.
  - reference: PMID:25241270
    reference_title: Adenomyosis and endometriosis. Re-visiting their association and further insights into the mechanisms of auto-traumatisation. An MRI study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this method allowed to lower the limit of detection in terms of thickness
      of the JZ for assured diagnosis of adenomyosis
    explanation: >-
      Shows that the detection threshold used for the junctional zone directly
      determines how many cases are ascertained, a methodological driver of
      prevalence variation.
discussions:
- discussion_id: adenomyosis_invagination_vs_metaplasia
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Basalis Invagination and Myometrial Infiltration
  prompt: >-
    Does adenomyosis arise by invagination of basalis endometrium through an
    injured junctional zone, or by metaplasia of Müllerian remnants and resident
    stem cells already within the myometrium?
  rationale: >-
    The two theories predict different origins for the lesional epithelium and
    therefore different prevention strategies: reducing junctional zone
    microtrauma versus targeting a resident progenitor population.
    Next-generation sequencing has moved the field substantially toward
    invagination, because KRAS mutations map to both adenomyotic lesions and the
    matched intracavitary endometrium — hard to reconcile with an independent
    in-situ origin. The debate is nonetheless recorded as live rather than
    settled: deep lesions without demonstrable continuity with the basalis, and
    adenomyosis in women without evident junctional zone disruption, are not
    fully explained by invagination alone. The two mechanisms are not mutually
    exclusive and may account for different lesion subsets.
  proposed_experiments:
  - experiment_id: exp_adenomyosis_clonal_lineage_mapping
    name: Spatially resolved clonal lineage mapping from cavity to deep lesion
    description: >-
      Perform spatially resolved single-cell sequencing along a continuous
      transect from intracavitary endometrium through the junctional zone into
      deep adenomyotic lesions in hysterectomy specimens, testing whether
      lesional clones form a contiguous mutational gradient with the eutopic
      endometrium (invagination) or constitute independent clones lacking shared
      ancestry (metaplasia). Deep lesions without junctional zone continuity are
      the informative cases.
  evidence:
  - reference: PMID:29566849
    reference_title: "Pathogenesis of uterine adenomyosis: invagination or metaplasia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two main theories have been proposed to explain the origin of adenomyosis.
    explanation: >-
      Frames the controversy as the central unresolved question in adenomyosis
      pathogenesis.
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations of KRAS map to both intracavitary endometrial tissue and
      proximally located adenomyotic samples, supporting the invagination theory
      of pathogenesis.
    explanation: >-
      The strongest current evidence favoring invagination over metaplasia.
- discussion_id: adenomyosis_two_phase_invasion
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Basalis Invagination and Myometrial Infiltration
  prompt: >-
    Are epithelial-mesenchymal transition and collective cell migration
    sequential phases of a single invasive program in adenomyosis, or
    alternative programs operating in different lesions?
  rationale: >-
    EMT evidence comes from human lesions with mouse corroboration and is
    assigned to early progression; collective migration evidence comes from a
    baboon model and is assigned to later invasion. The temporal assignment
    rests on comparing findings across different species and model systems
    rather than on a single longitudinal series, so the ordering is an inference
    rather than an observation. Whether invasiveness is genuinely
    time-dependent — and if so, when the switch occurs — matters for whether an
    anti-EMT strategy would help established disease or only prevent early
    spread.
  evidence:
  - reference: PMID:29566849
    reference_title: "Pathogenesis of uterine adenomyosis: invagination or metaplasia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that the invasiveness of this complex uterine disorder is
      not driven by a single mechanism of migration but by a time-dependent
      combination of two processes.
    explanation: >-
      States the two-process, time-dependent invasion model whose temporal
      structure remains to be demonstrated within a single system.
notes: >-
  Curated in response to the obstetric and benign-gynecology coverage gap
  documented in monarch-initiative/dismech#7837, which singled out adenomyosis
  as the conspicuous absence in benign gynecology given that both its siblings —
  Endometriosis and Uterine_Leiomyoma — are already curated. This entry is
  written to interlock with them: the shared-pathophysiology relationship with
  Endometriosis and the molecular separation from Uterine_Leiomyoma are both
  curated explicitly under differential_diagnoses.

  Terminology note: cell types are bound to the uterine/endometrial-specific CL
  classes — CL:0002255 stromal cell of endometrium, CL:0002601 uterine smooth
  muscle cell, and CL:0009084 glandular epithelial cell of endometrium. An
  earlier revision of this entry used their generic parents (CL:0000499,
  CL:0000192, CL:0002149) and asserted in this note that no dedicated
  endometrial stromal class existed. That was wrong: the search that produced it
  used the adjective form "endometrial stromal cell", whereas CL names these
  classes in the of-form ("stromal cell of endometrium"), so none of the three
  specific terms were found. Curators searching CL for a tissue-specific cell
  type should try both orderings before concluding a term is absent.

  A second search lesson, from the same review round: the modality-stratified
  prevalence figures (histopathology 35.1%, MRI 35.0%, ultrasound 30.7%) were
  initially reported as not quotable, on the grounds that they do not appear in
  the PMID:41257733 abstract. True but irrelevant — that cached reference holds
  the full text, and the figures sit well past the abstract. Before declaring a
  claim unquotable, search the whole cached file rather than the abstract
  section; many references_cache entries are full text and the reference
  validator matches against the entire body.

  Evidence note: two snippets quoted from PMID:28865548 contain a typographical
  error ("treatment withf GnRHa") that is present in the published abstract.
  The snippets are exact quotes and validate against the cached reference; the
  typo has been left uncorrected rather than silently repaired, since altering
  quoted text would break snippet verification.

  Deep research: a `claude_code` provider run was performed via
  `just research-disorder claude_code Adenomyosis`
  (research/Adenomyosis-deep-research-claude_code.md; 21 web searches, 24
  citations, 266 s). It corroborated the TIAR-invagination chain, the KRAS
  driver, and the aromatase/progesterone-resistance arm as curated, and drove
  three additions: the lesional-fibrosis node (which conforms to the
  `fibrotic_response` module — the entry previously had no fibrotic arm at all),
  the fibrosis-stiffness mechanism for heavy menstrual bleeding, and the EMID
  hypothesis group as a third, EMERGING pathogenesis model alongside
  invagination and metaplasia. A subsequent PR-review round closed several
  further gaps from the same run: prevalence, diagnosis, the ARID1A somatic
  driver, per-gene case fractions, dyspareunia, and the medical/interventional
  treatment options.

  Findings from the run still NOT curated: the detailed inflammatory cascade
  (TLR4/NF-kB, cGAS-STING, NLRP3-driven macrophage pyroptosis), the
  HIF-1alpha/VEGF neuroangiogenesis arm, hyperinnervation and central
  sensitization as pain mechanisms, and impaired decidualization (HOXA10/FOXO1)
  as the mechanism of subfertility — the last of these would give the currently
  mechanism-free infertility phenotype a pathophysiology anchor and is the most
  worthwhile remaining follow-up. High-intensity focused ultrasound is also
  omitted: it is an established uterus-sparing option, but the local NCIT
  adapter has no HIFU clinical-action term, so it was left out rather than bound
  to a term that does not fit.

  One DR-reported identifier was not used: the report cited "PMID:34252159
  (approx.)" for the Human Reproduction Update NGS paper, self-flagging the
  uncertainty. The correct identifier for that paper is PMID:34131719, which
  this entry already cited independently.

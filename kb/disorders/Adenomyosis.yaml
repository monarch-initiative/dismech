mechanistic_hypotheses:
- hypothesis_group_id: invagination_tiar_model
  hypothesis_label: Basalis invagination driven by tissue injury and repair at the endometrial-myometrial junction
  status: CANONICAL
  description: >-
    The dominant model holds that adenomyosis begins with microtrauma at the
    endometrial-myometrial interface, inflicted by chronic uterine peristalsis
    or hyperperistalsis. Injury activates the physiological tissue injury and
    repair (TIAR) response, including local estrogen production, which in an
    estrogen-sensitive organ feeds back to intensify peristalsis and perpetuate
    the injury. The basalis endometrium then invaginates into the myometrial
    wall. Molecular genetics supports this route: adenomyotic epithelium carries
    KRAS mutations shared with the matched eutopic endometrium, placing the
    origin of the lesion in intracavitary endometrial tissue rather than in situ
    within the myometrium.
  evidence:
  - reference: PMID:19644696
    reference_title: "The pathophysiology of endometriosis and adenomyosis: tissue injury and repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      chronic uterine peristaltic activity or phases of hyperperistalsis induce,
      at the endometrial-myometrial interface near the fundo-cornual raphe,
      microtraumatizations with the activation of the mechanism of 'tissue
      injury and repair' (TIAR)
    explanation: >-
      States the TIAR mechanism and localizes the initiating microtrauma to the
      endometrial-myometrial interface.
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations of KRAS map to both intracavitary endometrial tissue and
      proximally located adenomyotic samples, supporting the invagination theory
      of pathogenesis.
    explanation: >-
      Somatic mutation sharing between eutopic endometrium and adenomyotic
      lesions provides genetic evidence for an invagination origin.
- hypothesis_group_id: metaplasia_stem_cell_model
  hypothesis_label: Metaplasia of Müllerian remnants or resident stem/progenitor cells
  status: ALTERNATIVE
  description: >-
    The competing model holds that adenomyotic lesions arise de novo within the
    myometrium, by metaplastic differentiation of displaced embryonic
    pluripotent Müllerian remnants or of adult endometrial stem/progenitor cells
    resident in the myometrium, rather than by invasion from the uterine cavity.
    This model accounts more naturally for deep lesions with no demonstrable
    continuity with the basalis, but it is not supported by the somatic-mutation
    concordance between eutopic endometrium and adenomyotic epithelium.
  evidence:
  - reference: PMID:29566849
    reference_title: "Pathogenesis of uterine adenomyosis: invagination or metaplasia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An alternative theory maintains that adenomyotic lesions result from
      metaplasia of displaced embryonic pluripotent Müllerian remnants or
      differentiation of adult stem cells.
    explanation: >-
      States the metaplasia alternative that the review sets against the
      invagination theory.
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is continuing debate on the origins of adenomyosis; two competing
      theories describe the invagination of basal endometrium into the
      myometrium or the metaplastic differentiation of remnant endometrial
      stem/progenitor cells within the myometrium
    explanation: >-
      Confirms that the metaplasia model remains a live competing hypothesis
      even as sequencing data favor invagination.
- hypothesis_group_id: emid_model
  hypothesis_label: Endometrial-myometrial interface disruption (EMID)
  status: EMERGING
  description: >-
    A more recent reframing that shifts emphasis from how endometrial tissue
    gets into the myometrium to what breaches the interface in the first place.
    EMID holds that iatrogenic or obstetric disruption of the
    endometrial-myometrial interface is the initiating event, and is supported
    by epidemiologic data associating adenomyosis with uterine instrumentation
    and parturition, plus a mouse model. It also implicates Schwann cells in the
    interface region in lesion genesis, a cell type absent from both the
    invagination and metaplasia accounts. EMID is compatible with, rather than
    exclusive of, the TIAR-invagination model — it proposes a specific class of
    initiating injury for the same repair-driven cascade.
  evidence:
  - reference: PMID:36099328
    reference_title: "Cracking the enigma of adenomyosis: an update on its pathogenesis and pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a new hypothesis, called endometrial-myometrial interface disruption
      (EMID), which is backed by extensive epidemiologic data and demonstrated
      by a mouse model, is reviewed, along with recent data implicating the role
      of Schwann cells in the EMI area in the genesis of adenomyosis
    explanation: >-
      Introduces EMID as a distinct pathogenesis hypothesis with epidemiologic
      and mouse-model support, and flags the Schwann-cell involvement unique to
      it. Note the quoted sentence spans both human epidemiologic data and a
      mouse model; the epidemiologic arm is the primary basis for the
      HUMAN_CLINICAL classification.
pathophysiology:
- name: Uterine Hyperperistalsis and Junctional Zone Microtrauma
  biological_scale: TISSUE
  description: >-
    The endometrial-myometrial junction, visible on MRI as the junctional zone,
    is the site of initiating injury. Chronic uterine peristaltic activity, or
    episodic hyperperistalsis, inflicts repeated microtrauma at this interface,
    concentrated near the fundo-cornual raphe. Junctional zone thickening is the
    imaging correlate and the basis of non-invasive diagnosis. The model
    accommodates both early-onset disease, where an event early in reproductive
    life triggers hyperperistalsis, and late premenopausal adenomyosis, where
    cumulative normoperistalsis over decades produces equivalent
    microtraumatization.
  locations:
  - preferred_term: myometrium
    term:
      id: UBERON:0001296
      label: myometrium
  - preferred_term: endometrium
    term:
      id: UBERON:0001295
      label: endometrium

histopathology:
- name: Endometrial glands and stroma within the myometrium
  description: >-
    The defining histological finding is islands of endometrial glands and
    accompanying stroma located within the myometrium, beyond the normal
    endometrial-myometrial interface, encircled by hypertrophic and hyperplastic
    smooth muscle. Diagnosis was historically made only on hysterectomy
    specimens, which is the principal reason prevalence estimates vary so widely;
    MRI and transvaginal ultrasound now permit non-invasive diagnosis based on
    junctional zone thickening and myometrial architecture.
  evidence:
  - reference: PMID:34131719
    reference_title: "Adenomyosis pathogenesis: insights from next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adenomyosis, characterized by the presence of islands of endometrial
      tissue surrounded by hypertrophic smooth muscle cells within the
      myometrium
    explanation: >-
      States the defining histopathological criterion for adenomyosis.
imaging_findings:
- name: Junctional zone thickening on MRI
  description: >-
    Thickening of the junctional zone — the inner myometrium adjacent to the
    endometrium — is the principal MRI criterion for adenomyosis. Careful
    multiplanar visualization is required to distinguish true adenomyotic
    lesions from transient junctional zone enlargement caused by peristaltic
    waves or sporadic myometrial contractions, which otherwise mimic the
    diagnosis.
  evidence:
  - reference: PMID:25241270
    reference_title: Adenomyosis and endometriosis. Re-visiting their association and further insights into the mechanisms of auto-traumatisation. An MRI study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By this method of "visualization" all transient enlargement of the JZ,
      such as peristaltic waves of the archimyometrium and sporadic neometral
      contractions that might mimic adenomyotic lesions could be excluded.
    explanation: >-
      Documents the imaging pitfall — transient peristaltic junctional zone
      enlargement mimicking adenomyosis — and the visualization method used to
      avoid it.
  - reference: PMID:25241270
    reference_title: Adenomyosis and endometriosis. Re-visiting their association and further insights into the mechanisms of auto-traumatisation. An MRI study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As concluded from their localization within the uterine wall, the
      adenomyotic lesions predominantly developed in the median region of the
      upper two-thirds of the uterine wall.
    explanation: >-
      Establishes the characteristic anatomical distribution of adenomyotic
      lesions on MRI.
phenotypes:
- category: Clinical
  name: Dysmenorrhea
  description: >-
    Progressively severe menstrual pain is a cardinal symptom. In the MRI
    series, cystic cornual angle adenomyosis was observed only in patients with

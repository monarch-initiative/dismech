    reference_title: "The pathophysiology of endometriosis and adenomyosis: tissue injury and repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      chronic uterine peristaltic activity or phases of hyperperistalsis induce,
      at the endometrial-myometrial interface near the fundo-cornual raphe,
      microtraumatizations with the activation of the mechanism of 'tissue
      injury and repair' (TIAR)
    explanation: >-
      Identifies peristalsis-driven microtrauma at the junctional zone as the
      initiating lesion.
  - reference: PMID:19644696
    reference_title: "The pathophysiology of endometriosis and adenomyosis: tissue injury and repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      as indicated by the high prevalence of the disease, it appears to be
      unavoidable that, with time, chronic normoperistalsis throughout the
      reproductive period of life leads to the same extent of
      microtraumatization
    explanation: >-
      Explains late premenopausal adenomyosis as cumulative injury from normal
      peristalsis, unifying early- and late-onset disease under one mechanism.
  downstream:
  - target: Local Estrogen Production and TIAR Self-Perpetuation
    causal_link_type: DIRECT
    hypothesis_groups:
    - invagination_tiar_model
    description: >-
      Activation of the tissue injury and repair response at the injured
      interface induces local estrogen biosynthesis.
- name: Local Estrogen Production and TIAR Self-Perpetuation
  biological_scale: TISSUE
  description: >-
    The tissue injury and repair response includes local estrogen production at
    the site of injury. Because uterine peristalsis is itself under ovarian
    steroid control, locally produced estrogen acts in a paracrine fashion to
    override that control, driving further hyperperistalsis and further injury.
    This feed-forward loop is what converts a self-limited repair response into
    a self-perpetuating disease process, and it explains why adenomyosis
    progresses across the reproductive years and regresses after menopause.
  biological_processes:
  - preferred_term: estrogen biosynthetic process
    term:
      id: GO:0006703
      label: estrogen biosynthetic process
    modifier: INCREASED
  - preferred_term: cellular response to estrogen stimulus
    term:
      id: GO:0071391
      label: cellular response to estrogen stimulus
    modifier: INCREASED
  evidence:
  - reference: PMID:19644696
    reference_title: "The pathophysiology of endometriosis and adenomyosis: tissue injury and repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With ongoing peristaltic activity, such sites might increase and the
      increasingly produced estrogens interfere in a paracrine fashion with the
      ovarian control over uterine peristaltic activity, resulting in permanent
      hyperperistalsis and a self-perpetuation of the disease process.
    explanation: >-
      Describes the paracrine estrogen feed-forward loop that makes the injury
      process self-sustaining.
  downstream:
  - target: Basalis Invagination and Myometrial Infiltration
    causal_link_type: DIRECT
    hypothesis_groups:
    - invagination_tiar_model
    description: >-
      Sustained auto-traumatization permits infiltration of basal endometrium
      into the depth of the myometrial wall.
  - target: Aromatase-Driven Estrogen Signaling and Progesterone Resistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Epigenetic reprogramming of nuclear receptor expression in the stromal compartment.
    description: >-
      Local estrogen excess is reinforced at the molecular level by aberrant
      steroid receptor and aromatase expression in lesional stroma.
- name: Somatic KRAS Activation in Endometrial Epithelium
  biological_scale: MOLECULAR
  description: >-
    Adenomyotic epithelial cells carry activating KRAS mutations almost
    exclusively, and the same mutations map to matched intracavitary endometrial
    tissue — the genetic argument that the lesion originates from eutopic
    endometrium rather than arising in situ. Mutations are restricted to
    endometrial-type epithelial cells and are absent from the surrounding smooth
    muscle; conversely, the driver mutations characteristic of uterine fibroids
    are not found in adenomyosis, separating the two commonest myometrial
    disorders at the molecular level. Activated KRAS signaling increases cell
    survival and proliferation and is associated with progesterone resistance.
  cell_types:
  - preferred_term: glandular epithelial cell of endometrium
    term:

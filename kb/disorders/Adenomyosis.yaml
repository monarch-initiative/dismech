- name: Lesional Fibrosis and Myofibroblast Transdifferentiation
  biological_scale: TISSUE
  conforms_to: fibrotic_response#Mesenchymal Cell Activation
  description: >-
    Adenomyotic lesions behave as wounds undergoing repeated tissue injury and
    repair, and their natural history is progressive fibrosis via three linked
    routes: epithelial-mesenchymal transition, fibroblast-to-myofibroblast
    transdifferentiation, and smooth muscle metaplasia. This is the same
    central-effector step conserved across organs in the fibrotic_response
    module, with the uterine specialization that smooth muscle metaplasia
    contributes alongside classical myofibroblast conversion. Fibrosis is not
    confined to the lesion: it propagates into the neighbouring
    endometrial-myometrial interface and endometrium, which is what converts a
    focal lesion into the diffuse uterine phenotype and links the lesion
    directly to heavy menstrual bleeding.

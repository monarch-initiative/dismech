experimental_models:
- name: MORC2-mutant iPSC-derived motor neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human iPSC-derived motor neurons carrying p.Ser87Leu, associated with an SMA-like phenotype, and p.Gln400Arg
    or p.Asp466Asn, associated with CMT2Z, permit comparison of cellular effects across the MORC2 spectrum.
  publication: PMID:41548771
  modeled_mechanisms:
  - target: Axonal Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Patient-variant human motor neurons reproduce axonal abnormalities in culture; the p.Ser87Leu line
      was most severely affected among the variants tested.
    limitations: >-
      Cultured motor neurons do not reproduce an intact motor unit, peripheral nerve environment or decades
      of length-dependent disease progression. The readouts measure neurite pathology in vitro.
    readouts:
    - name: Neurite length
      target: Axonal Degeneration
      direction: DECREASED
      interpretation: >-
        Neurites were shorter in variant-bearing iPSC-derived motor neurons.
      evidence:
      - reference: PMID:41548771
        reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          axonal pathology, including shortened neurites, elevated axonal breakage, and increased axonal
          swellings, with the most severe phenotypes observed in iPSC-MNs harboring p.S87L
        explanation: The axonal measurements and their allele ordering.
    - name: Axonal breakage and swelling
      target: Axonal Degeneration
      direction: INCREASED
      interpretation: >-
        Axonal breaks and swellings increased, with the strongest abnormalities in p.Ser87Leu neurons.
      evidence:
      - reference: PMID:41548771
        reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          axonal pathology, including shortened neurites, elevated axonal breakage, and increased axonal
          swellings, with the most severe phenotypes observed in iPSC-MNs harboring p.S87L
        explanation: The axonal measurements and their allele ordering.
  - target: Impaired PARP1-Dependent DNA Repair
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Inhibiting PAR degradation restored PAR levels, reduced DNA damage and improved axonal pathology
      in p.Ser87Leu neurons, which is a rescue rather than a description.
    limitations: >-
      The cited rescue was shown in p.Ser87Leu cell culture. Clinical benefit, pharmacokinetics and in
      vivo efficacy of this PAR-restoring intervention were not established in this report.
    readouts:
    - name: Cellular PAR level
      target: Impaired PARP1-Dependent DNA Repair
      direction: RESTORED
      interpretation: >-
        PAR restoration is the proximate pharmacodynamic effect through which the axonal improvement is
        proposed to act.
      evidence:
      - reference: PMID:41548771
        reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Notably, inhibition of PAR degradation with PDD restored PAR levels, reduced DNA damage accumulation,
          and ameliorated axonal pathology in p.S87L-mutant iPSC-MNs.
        explanation: The rescue result in full.
  evidence:
  - reference: PMID:41548771
    reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we used iPSC-derived motor neurons (iPSC-MNs) carrying three distinct MORC2 mutations, p.S87L (SMA-like),
      p.Q400R, and p.D466N (CMT2Z), to examine their effects on cellular processes
    explanation: >-
      Defines the model and, importantly, that it spans both ends of the phenotypic spectrum.
- name: MORC2 overexpression in SH-EP neuroblastoma and primary cortical neurons
  experimental_model_type: OTHER
  description: >-
    MORC2 variants were expressed in SH-EP neuroblastoma cells and primary embryonic mouse cortical neurons.
    Survival, cleaved caspase-3 and neurite length supplied functional evidence alongside family and clinical
    findings.
  publication: PMID:35904125
  modeled_mechanisms:
  - target: Neuronal Apoptosis
    relationship: MEASURES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Scores the cellular toxicity of a MORC2 allele as a proxy for its pathogenicity.
    limitations: >-
      Overexpression does not reproduce heterozygous endogenous dosage. Cortical neurons are not peripheral
      sensory neurons, and these toxicity assays do not measure HUSH silencing.
  evidence:
  - reference: PMID:35904125
    reference_title: "Expanding the phenotypic variability of MORC2 gene mutations: From Charcot-Marie-Tooth disease to late-onset pure motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Likewise, we show that MORC2 mutants affect survival and trigger apoptosis over time in SH-EP cell
      line. Furthermore, overexpression in primary cortical neurons increases apoptotic cell death and
      decreases neurite outgrowth.
    explanation: The readouts the assay uses.
animal_models:
- name: Morc2a p.Ser87Leu heterozygous mouse
  species: Mouse
  genotype: Morc2a S87L/+
  publication: PMID:38227798
  description: >-
    The p.Ser87Leu mouse models neuropathy and muscular dysfunction associated with DNA damage and hydroxyl
    radical accumulation. AAV-PHP.eB delivery of Morc2a or its GHKL ATPase domain improved neuropathy
    and muscular dysfunction after one treatment.
  modeled_mechanisms:
  - target: Hydroxyl Radical Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The study links protein synthesis defects to elevated hydroxyl radicals and apoptosis.
    limitations: >-
      The severe p.Ser87Leu allele does not represent the full CMT2Z variant spectrum. Mouse gene-transfer
      efficacy does not establish human benefit or delivery safety.
  - target: Axonal Degeneration
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      AAV delivery improved the model neuropathy and muscular dysfunction.
    limitations: >-
      The cached abstract does not specify which individual histological endpoints were reversed; rescue
      of every axonal measure is not asserted.
  evidence:
  - reference: PMID:38227798
    reference_title: Morc2a variants cause hydroxyl radical-mediated neuropathy and are rescued by restoring GHKL ATPase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We used the adeno-associated virus (AAV)-PHP.eB serotype, which has a high CNS transduction efficiency,
      to express Morc2a or Morc2a GHKL ATPase domain protein in vivo. Notably, AAV gene therapy ameliorated
      neuropathy and muscular dysfunction with a single treatment.
    explanation: >-
      Direct preclinical intervention in the p.Ser87Leu mouse model; not a human trial.
discussions:
- discussion_id: gap_cmt2z_gain_of_silencing_to_axon
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which transcriptional changes drive peripheral axon loss, and how do they interact with PARP1 repair
    and oxidative injury?
  attaches_to:
  - "pathophysiology#Neuronal Transcriptional Dysregulation"
  rationale: >-
    HUSH target over-repression and promoter methylation are experimentally supported. The methylation
    study now identifies ERCC8, NDUFAF2 and FKTN as repressed targets in the broader MORC2 spectrum and
    finds intermediate respiration in one CMT fibroblast line. The contribution of each target to peripheral
    axon degeneration, and the ordering of transcriptional, PARP1-repair and oxidative pathways, remain
    unresolved. Direct perturbation in patient-allele peripheral neurons is needed rather than inferring
    causality from pathway co-occurrence.
  proposed_experiments:
  - experiment_id: exp_cmt2z_hush_target_profiling
    name: HUSH target profiling in patient-allele motor and sensory neurons
    description: >-
      Perform H3K9me3 ChIP and matched transcriptomics in iPSC-derived motor and sensory neurons carrying
      p.Arg252Trp and p.Ser87Leu against isogenic controls, and test whether the differentially silenced
      loci include genes with established axonal function.
    would_support:
    - "pathophysiology#Neuronal Transcriptional Dysregulation"
  - experiment_id: exp_cmt2z_hush_vs_parp_epistasis
    name: Epistasis between HUSH silencing and PARP1 repair in the same neurons
    description: >-
      In one iPSC motor neuron system, test whether relieving HUSH hyperactivation rescues the DNA repair
      defect and whether restoring PAR signalling normalises HUSH target silencing, to establish whether
      the two proposed mechanisms are ordered, parallel or the same thing.
- discussion_id: gap_cmt2z_spectrum_boundaries
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How should predominantly peripheral CMT2Z be distinguished within the overlapping MORC2 disease spectrum?
  attaches_to:
  - "genetic#MORC2"
  - "pathophysiology#Central Nervous System Involvement"
  rationale: >-
    Clinical presentations overlap, including across patients with the same variant. The methylation study
    argues for a shared MORC2 spectrum and finds that promoter methylation adds phenotypic information
    beyond genotype. In contrast, ATPase and HUSH assays show variant-specific, sometimes opposing, effects.
    CMT2Z remains a useful predominantly peripheral presentation; the current evidence does not define
    a universal variant or functional threshold separating it from SMA-like, DIGFAN or Leigh-like presentations.
  proposed_experiments:
  - experiment_id: exp_cmt2z_unified_genotype_phenotype
    name: Pooled genotype-phenotype analysis across all MORC2 presentations
    description: >-
      Analyze clinical features, genotype, methylation profiles and functional readouts jointly across
      MORC2 presentations, testing whether proposed groups are stable across independent cohorts.
notes: >-
  CMT2Z is the predominantly peripheral neuropathy presentation within an overlapping MORC2 spectrum.
  Severe SMA-like, DIGFAN and Leigh-like cases provide allelic and mechanistic comparisons and are not
  automatically CMT2Z subtypes. Disease-wide prevalence and penetrance are not determined by reported
  case counts. Phenotype frequency bands reflect the explicitly identified cohorts or qualitative source
  wording. ATP hydrolysis, HUSH repression, protein abundance and promoter methylation are distinct measurements
  and can change in different directions. Current evidence does not establish a single linear pathway
  from HUSH dysregulation through PARP1 to axonal loss. Supportive care and counseling use the full general
  CMT GeneReviews overview with indirect evidence; experimental PAR restoration and AAV rescue do not
  establish clinical efficacy. p.Arg252Trp and p.Arg190Trp name the same variant under different protein-isoform
  numbering.

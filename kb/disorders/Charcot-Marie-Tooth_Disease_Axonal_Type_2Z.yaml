  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mental retardation was identified in 4/13 patients (30.8%).
    explanation: >-
      The cognitive impairment rate within a CMT2Z cohort, which is what makes this a CMT2Z feature rather
      than only a feature of the developmental syndrome.
  - reference: PMID:26659848
    reference_title: MORC2 mutations cause axonal Charcot-Marie-Tooth disease with pyramidal signs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pyramidal features were usually increased muscle tone in the legs without frank spasticity,
      and 5 had extensor plantar reflexes.
    explanation: >-
      Direct findings in the CMT105 family. Variable presence across families does not refute the disease–phenotype
      association.
phenotypes:
- category: Neuromuscular
  name: Distal muscle weakness
  description: >-
    Distal weakness can progress proximally over years to decades. In the Spanish cohort, a scapuloperoneal
    asymmetric pattern with early proximal upper-limb involvement predominated over the classic length-dependent

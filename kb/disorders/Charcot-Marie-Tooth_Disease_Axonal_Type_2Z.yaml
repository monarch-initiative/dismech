inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous MORC2 variants are sufficient. A large proportion of cases are
    sporadic de novo rather than familial — 11 of 13 patients in the Japanese
    series — so an absent family history does not argue against the diagnosis.
  evidence:
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean age of onset was 10.3 ± 8.7 years, and the inheritance pattern was
      mostly sporadic (11/13 patients, 84.6%).
    explanation: >-
      Quantifies the sporadic fraction, which is the practically important part
      of the inheritance picture here.
  - reference: PMID:32693025
    reference_title: De Novo Variants in the ATPase Module of MORC2 Cause a Neurodevelopmental Disorder with Growth Retardation and Variable Craniofacial Dysmorphism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous variants in MORC2 have been reported in individuals with
      autosomal-dominant Charcot-Marie-Tooth disease type 2Z and spinal muscular
      atrophy, and the onset of symptoms ranges from infancy to the second decade
      of life.
    explanation: >-
      States dominant inheritance and the onset range across the MORC2 spectrum.
prevalence:
- population: Japan
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been published for CMT2Z. What exists is a
    diagnostic yield: MORC2 variants were found in 2.7% of patients already
    diagnosed with CMT type 2 in a Japanese series of 781 unrelated CMT
    patients, making it the second most common cause of CMT2 after MFN2 in that
    population. That share is a property of the gene's contribution rather than
    of the disease's occurrence, so it is curated under genetic[].case_fractions
    and no rate is given here. The numeric prevalence slots are deliberately
    left empty rather than filled with the yield, which would assert a
    population rate the source does not support.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The only worldwide figure located is a count of reported cases, not a rate.
  evidence:
  - reference: PMID:42656289
    reference_title: "Novel MORC2 variants in Charcot-Marie-Tooth disease type 2Z: genetic and functional insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      CMT2Z is a rare genetic disorder, with fewer than 100 reported cases
      worldwide.
    explanation: >-
      A published case count, which anchors the ULTRA_RARE band on something other
      than the absence of a figure. It is a background restatement, not this
      paper's own census.
- population: Spain, national retrospective collection
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fifteen CMT2Z patients were identified across Spain, seven of them from one
    kindred and the rest sporadic. The authors describe MORC2 as a rare cause of
    CMT in Spain, which sits against the 2.7% Japanese yield and suggests real
    population differences or ascertainment differences that have not been
    reconciled.
  evidence:
  - reference: PMID:34189813
    reference_title: Charcot-Marie-Tooth disease due to MORC2 mutations in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifteen patients with CMT2Z were identified throughout Spain, seven of them
      belonging to a single kindred, whilst the rest were sporadic.
    explanation: The Spanish national count and its family structure.
progression:
- phase: Childhood to adolescent onset
  notes: >-
    Mean age of onset around 10 years in the Japanese series, with a wide spread.
    Onset across the whole MORC2 spectrum ranges from infancy to the second
    decade, the earlier end corresponding to the more severe alleles.
  evidence:
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean age of onset was 10.3 ± 8.7 years
    explanation: Age at onset in the largest series.
- phase: Distal to proximal progression
  notes: >-
    Weakness begins distally and spreads proximally over decades. One reported
    patient was fit enough to be a Marine captain in his early twenties and had
    severe proximal and distal weakness by 61, which gives a sense of the
    timescale in the milder alleles.
  evidence:
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuropathy began in childhood to early adulthood, with distal weakness
      progressing to proximal weakness.
    explanation: The characteristic direction of progression.
pathophysiology:
- name: MORC2 Variant Dysregulation of HUSH Silencing
  biological_scale: MOLECULAR
  description: >-
    MORC2 is the ATPase recruited by the HUSH complex to H3K9me3-marked
    heterochromatin, where its ATPase activity is required for silencing. CMT2Z
    alleles are not nulls. The most common ATPase-domain variant, p.Arg252Trp,
    hyperactivates HUSH-mediated repression in neuronal cells, and the ATPase
    module variants that cause the developmental syndrome do the same. So the
    disease mechanism is gain of silencing, not loss of it — which is the
    opposite of what a loss-of-function reading of a chromatin gene would
    predict, and matters because it changes what a therapeutic strategy would
    have to do.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0006338
      label: chromatin remodeling
  - preferred_term: heterochromatin formation
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0031507
      label: heterochromatin formation
  cellular_components:
  - preferred_term: heterochromatin
    term:
      id: GO:0000792
      label: heterochromatin
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  downstream:
  - target: Neuronal Transcriptional Dysregulation
    causal_link_type: DIRECT
    description: >-
      Altered heterochromatin silencing changes the transcriptional programme of
      the cells that express mutant MORC2.
    evidence:
    - reference: PMID:30624633
      reference_title: Characterization of molecular mechanisms underlying the axonal Charcot-Marie-Tooth neuropathy caused by MORC2 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both mutations induced transcriptional changes in patient-derived
        fibroblasts and when expressed in rodent sensory neurons.
      explanation: >-
        Demonstrates the transcriptional consequence in patient cells and in the
        relevant neuronal cell type.
  - target: Impaired PARP1-Dependent DNA Repair
    causal_link_type: DIRECT
    description: >-
      MORC2 also functions in DNA double-strand break repair, and the mutants
      disrupt its interaction with PARP1.
  evidence:
  - reference: PMID:28581500
    reference_title: Hyperactivation of HUSH complex function by Charcot-Marie-Tooth disease mutation in MORC2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The ATPase activity of MORC2 is critical for HUSH-mediated silencing, and
      the most common alteration affecting the ATPase domain in CMT patients
      (p.Arg252Trp) hyperactivates HUSH-mediated repression in neuronal cells.
    explanation: >-
      The gain-of-silencing result for the commonest CMT2Z allele, measured in
      neuronal cells.
  - reference: PMID:28581500
    reference_title: Hyperactivation of HUSH complex function by Charcot-Marie-Tooth disease mutation in MORC2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we identified MORC2 as an essential gene required for epigenetic silencing
      by the HUSH complex
    explanation: >-
      Establishes MORC2's normal function, which is what the disease alleles
      distort.
  - reference: PMID:32693025
    reference_title: De Novo Variants in the ATPase Module of MORC2 Cause a Neurodevelopmental Disorder with Growth Retardation and Variable Craniofacial Dysmorphism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional assays revealed that these MORC2 variants result in
      hyperactivation of epigenetic silencing by the HUSH complex, supporting
      their pathogenicity.
    explanation: >-
      Independent confirmation of the gain-of-silencing mechanism, for a
      different set of ATPase-module variants.
- name: Neuronal Transcriptional Dysregulation
  biological_scale: CELLULAR
  description: >-
    Mutant MORC2 changes gene expression in patient fibroblasts and in neurons,
    and the magnitude of that change tracks clinical severity: the p.Ser87Leu
    allele, associated with the most severe phenotype, produced more pronounced
    transcriptional change and abnormal axonal morphology than p.Arg252Trp in
    the same experimental system. MORC2 is highly expressed in human embryonic
    and adult neural tissue and its murine orthologue is developmentally
    regulated, which is the proposed reason a ubiquitously expressed chromatin
    gene produces a neuron-selective disease.
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The identity of the mis-silenced transcripts that matter for the axon has
      not been established, so the step from transcriptional change to axonal
      loss is not resolved.
  - target: Central Nervous System Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      MORC2 is a broadly expressed chromatin regulator, so the central phenotype is
      placed downstream of the same transcriptional dysregulation as the peripheral
      one rather than as a separate lesion. The intermediates are unknown for the
      same reason they are unknown on the axonal branch: no mis-silenced transcript
      has been identified in any tissue. The edge is drawn rather than omitted
      because leaving the node unconnected renders it at the leftmost layer as an
      initiating step, which asserts a separate primary lesion — a stronger claim
      than an unresolved route.
  evidence:
  - reference: PMID:30624633
    reference_title: Characterization of molecular mechanisms underlying the axonal Charcot-Marie-Tooth neuropathy caused by MORC2 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These changes were more pronounced and accompanied by abnormal axonal
      morphology, in neurons expressing the MORC2 p.S87L mutation, which is
      associated with a more severe clinical phenotype.
    explanation: >-
      Ties the size of the cellular effect to the severity of the clinical
      phenotype across two alleles, which is the closest thing to a
      dose-response in this disease.
  - reference: PMID:30624633
    reference_title: Characterization of molecular mechanisms underlying the axonal Charcot-Marie-Tooth neuropathy caused by MORC2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that the full-length form of MORC2 is highly expressed in both
      embryonic and adult human neural tissues and that Morc2 expression is
      dynamically regulated in both the developing and the maturing murine
      nervous system.
    explanation: >-
      The expression argument for neuronal selectivity, measured in human tissue
      and in mouse.
- name: Impaired PARP1-Dependent DNA Repair
  biological_scale: CELLULAR
  description: >-
    MORC2 relaxes chromatin to facilitate double-strand break repair. In
    iPSC-derived motor neurons carrying three different MORC2 alleles, the
    mutants disrupt the MORC2-PARP1 interaction, reducing PARP1 activity and
    expression and the recruitment of downstream repair proteins, with
    accumulating DNA damage and apoptosis. This branch is a second, more recent
    account of how a chromatin gene kills axons, and it comes with a candidate
    intervention: blocking PAR degradation restored PAR levels and improved
    axonal pathology in the p.Ser87Leu neurons.
  biological_processes:
  - preferred_term: double-strand break repair
    modifier: DECREASED
    term:
      id: GO:0006302
      label: double-strand break repair
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: Axonal Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:41548771
    reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, these mutations impair DNA repair by disrupting the
      interaction between MORC2 and PARP1, leading to reduced PARP1 activity and
      expression, as well as diminished DNA repair protein expression and
      recruitment.
    explanation: >-
      The molecular mechanism, measured across three disease alleles in
      iPSC-derived motor neurons.
- name: Axonal Degeneration
  biological_scale: TISSUE
  description: >-
    Length-dependent axonal loss in motor and sensory nerves, with preserved
    conduction velocities and reduced amplitudes — the electrophysiological
    signature of an axonal rather than demyelinating neuropathy. Spontaneous
    motor-unit activity is frequent and is one of the features that makes the
    pattern recognisable. In iPSC-derived motor neurons the axonal pathology is
    directly visible as shortened neurites, breakage and swellings.
  cellular_components:
  - preferred_term: axon
    term:
      id: GO:0030424
      label: axon
  downstream:
  - target: Distal muscle weakness
    causal_link_type: DIRECT
  - target: Distal amyotrophy
    causal_link_type: DIRECT
  - target: Areflexia
    causal_link_type: DIRECT
  - target: Pes cavus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Fasciculations
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41548771
    reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that MORC2 mutations induce apoptosis, DNA damage, and
      axonal pathology, including shortened neurites, elevated axonal breakage,
      and increased axonal swellings, with the most severe phenotypes observed in
      iPSC-MNs harboring p.S87L.
    explanation: >-
      Direct observation of the axonal phenotype in human motor neurons, with the
      allele ordering preserved.
  - reference: PMID:34189813
    reference_title: Charcot-Marie-Tooth disease due to MORC2 mutations in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nerve conduction studies revealed an unequivocally axonal neuropathy with
      frequent spontaneous activity, and serum creatine kinase levels were
      increased in 50% of the patients.
    explanation: >-
      The electrophysiological characterisation in the Spanish national cohort,
      including the creatine kinase finding.
- name: Central Nervous System Involvement
  biological_scale: ORGANISM
  description: >-
    Cognitive impairment occurs in about a third of CMT2Z patients, which is not
    part of the classical CMT picture and is explicitly flagged by the Japanese
    series as under-recognised. At the ATPase-module end of the MORC2 spectrum
    the central involvement dominates: developmental delay, intellectual
    disability, microcephaly, Leigh-like brain lesions in five of eighteen
    imaged, and retinal pigmentary abnormalities in five of six examined. This
    node is curated as part of CMT2Z because the cognitive phenotype is reported
    within CMT2Z cohorts, not only in the separately-named developmental
    syndrome.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mental retardation was identified in 4/13 patients (30.8%).
    explanation: >-
      The cognitive impairment rate within a CMT2Z cohort, which is what makes
      this a CMT2Z feature rather than only a feature of the developmental
      syndrome.
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More attention should be paid to cognitive impairment, and the responsible
      mechanism requires further research for elucidation.
    explanation: >-
      The authors' own statement that the cognitive component is both real and
      unexplained.
phenotypes:
- category: Neuromuscular
  name: Distal muscle weakness
  description: >-
    Length-dependent distal weakness is the core presentation, progressing
    proximally over years to decades. In the Spanish cohort a scapuloperoneal,
    asymmetric pattern with early proximal upper-limb involvement was more common
    than the classic length-dependent one.

    The VERY_FREQUENT band here rests on this feature being definitional rather
    than on a published fraction. No source reports a distal-weakness denominator
    for CMT2Z, because distal weakness is how a patient is ascertained as having an
    axonal CMT in the first place — every reported patient has it by construction.
    Distal amyotrophy, by contrast, is graded FREQUENT: it is neither definitional
    nor given a denominator in any located source.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuropathy began in childhood to early adulthood, with distal weakness
      progressing to proximal weakness.
    explanation: The core motor phenotype and its evolution.
  - reference: PMID:34189813
    reference_title: Charcot-Marie-Tooth disease due to MORC2 mutations in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven patients were categorized as having a scapuloperoneal phenotype,
      with asymmetric muscle weakness, early proximal upper limb involvement and
      frequent spontaneous muscular activity with distal sensory impairment and
      pes cavus, whilst two presented with a more classic length dependent
      sensory motor phenotype.
    explanation: >-
      The distribution pattern, showing that the scapuloperoneal form outnumbered
      the classic one in this cohort.

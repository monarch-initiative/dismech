    explanation: >-
      The CMT105 family biopsy supports an axonal process.
- name: Central Nervous System Involvement
  biological_scale: ORGANISM
  description: >-
    Cognitive and pyramidal features occur in some CMT2Z families. Intellectual disability was reported
    in 4/13 patients in the Japanese series. The responsible CNS mechanism remains uncertain; Leigh-like
    brain lesions and the full DIGFAN syndrome are not automatically CMT2Z manifestations.

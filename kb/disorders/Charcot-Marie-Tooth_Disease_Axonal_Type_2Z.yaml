name: Charcot-Marie-Tooth Disease Axonal Type 2Z
creation_date: "2026-09-16T20:30:00Z"
description: >-
  Charcot-Marie-Tooth disease axonal type 2Z (CMT2Z) is an autosomal dominant motor and sensory axonal
  neuropathy caused by heterozygous pathogenic MORC2 variants. Onset ranges from childhood to adulthood,
  with distal weakness and sensory impairment, often progressing proximally. Some families show asymmetric
  scapuloperoneal weakness, pyramidal signs or cognitive impairment. Familial and confirmed de novo cases
  occur; a sporadic presentation alone does not establish de novo inheritance. MORC2 is a chromatin-regulating
  ATPase. Variant-specific studies implicate altered ATPase regulation and HUSH silencing, promoter methylation
  and transcriptional repression, impaired DNA repair, and oxidative injury. The cellular effects differ
  by variant and experimental system. This entry covers the predominantly peripheral CMT2Z presentation
  within the broader MORC2 spectrum, which also includes severe SMA-like and neurodevelopmental phenotypes.
synonyms:

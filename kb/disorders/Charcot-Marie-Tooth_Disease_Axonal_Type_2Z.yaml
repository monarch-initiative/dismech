progression:
- phase: Childhood to adult onset
  notes: >-
    Onset varies across CMT2Z families. The Japanese series reported a mean of 10.3 years, whereas the
    p.Gly444Arg family had young adult onset. Congenital and infantile neurodevelopmental or SMA-like
    MORC2 presentations overlap with, but are not synonymous with, CMT2Z.
  evidence:
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean age of onset was 10.3 ± 8.7 years
    explanation: >-
      Age at onset in the Japanese series; not a limit on the age range of CMT2Z.
  - reference: PMID:35904125
    reference_title: "Expanding the phenotypic variability of MORC2 gene mutations: From Charcot-Marie-Tooth disease to late-onset pure motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients from the first family presented a form of young adult‐onset, autosomal dominant sensorimotor
      axonal neuropathy with progressive weakness and mild sensory impairment.
    explanation: >-
      The p.Gly444Arg family establishes adult onset within the CMT phenotype, separately from the p.His446Gln
      pure motor phenotype.
- phase: Distal to proximal progression
  notes: >-
    Weakness begins distally and spreads proximally over decades. One reported patient was fit enough
    to be a Marine captain in his early twenties and had severe proximal and distal weakness by 61, which
    gives a sense of the timescale in the milder alleles.
  evidence:
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuropathy began in childhood to early adulthood, with distal weakness progressing to proximal
      weakness.
    explanation: The characteristic direction of progression.
pathophysiology:
- name: Reduced ATP Hydrolysis in p.Arg252Trp MORC2
  biological_scale: MOLECULAR
  description: >-
    Purified MORC2(1–603) carrying the CMT2Z p.Arg252Trp variant has modestly reduced ATP hydrolysis.
    Structural analysis proposes disruption of the regulatory ATPase–CW interface, with altered dimer
    dynamics explaining increased cellular silencing despite reduced hydrolysis. The molecular-function
    decrease is specific to this tested allele and construct.
  genes:
  - preferred_term: MORC2
    term:
      id: hgnc:23573
      label: MORC2
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  evidence:
  - reference: DOI:10.1038/s41467-018-03045-x
    reference_title: Neuropathic MORC2 mutations perturb GHKL ATPase dimerization dynamics and epigenetic silencing by multiple structural mechanisms
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The R252W MORC2 variant hyperactivates HUSH-mediated transgene silencing4, but has reduced ATPase
      activity in vitro.
    explanation: >-
      Purified MORC2(1–603) carrying p.Arg252Trp has reduced ATP hydrolysis despite increased reporter
      silencing; biochemical activity and cellular repression are distinct readouts.
  - reference: DOI:10.1038/s41467-018-03045-x
    reference_title: Neuropathic MORC2 mutations perturb GHKL ATPase dimerization dynamics and epigenetic silencing by multiple structural mechanisms
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      T424R, which hydrolyzes ATP more rapidly than wild- type, leads to less ef ﬁcient HUSH silencing,
      whereas S87L and R252W, which hydrolyze ATP more slowly than wild-type, match or hyperactivate wild-type
      HUSH silencing
    explanation: >-
      Allele-specific comparison in the same biochemical and reporter study; p.Thr424Arg is an SMA-spectrum
      comparator.
    directness: INDIRECT
  downstream:
  - target: Enhanced HUSH-Mediated Silencing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Altered ATPase–CW regulation and ATP-dependent dimer dynamics provide the structural model for p.Arg252Trp
      hyper-repression.
    evidence:
    - reference: DOI:10.1038/s41467-018-03045-x
      reference_title: Neuropathic MORC2 mutations perturb GHKL ATPase dimerization dynamics and epigenetic silencing by multiple structural mechanisms
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The R252W MORC2 variant hyperactivates HUSH-mediated transgene silencing4, but has reduced ATPase
        activity in vitro.
      explanation: >-
        Purified MORC2(1–603) carrying p.Arg252Trp has reduced ATP hydrolysis despite increased reporter
        silencing; biochemical activity and cellular repression are distinct readouts.
  notes: >-
    Across the wider MORC2 spectrum, p.Ser87Leu stabilizes ATP-bound dimers and lowers ATPase activity,
    whereas the SMA-associated p.Thr424Arg variant increases ATP hydrolysis and reduces reporter repression.
    These comparisons preclude generalizing a single functional direction to all alleles.
- name: Enhanced HUSH-Mediated Silencing
  biological_scale: MOLECULAR
  description: >-
    The recurrent p.Arg252Trp variant accelerates and increases HUSH-dependent repression in HeLa reporter
    assays and over-represses endogenous target genes in SK-N-SH neuroblastoma cells. MORC2 is recruited
    by HUSH to support chromatin compaction; SETDB1 deposits H3K9me3. This measured gain in cellular silencing
    does not mean that MORC2 ATP hydrolysis is increased, and it is not established for every MORC2 variant.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: INCREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  - preferred_term: heterochromatin formation
    modifier: INCREASED
    term:
      id: GO:0031507
      label: heterochromatin formation
  cellular_components:
  - preferred_term: heterochromatin
    term:
      id: GO:0000792
      label: heterochromatin
  downstream:
  - target: Neuronal Transcriptional Dysregulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28581500
      reference_title: Hyperactivation of HUSH complex function by Charcot-Marie-Tooth disease mutation in MORC2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Overall these data suggested that the R252W mutation in MORC2 can hyper-activate HUSH-mediated
        epigenetic repression, resulting in over-repression of HUSH target genes in neuronal cells.
      explanation: >-
        Endogenous transcriptional effects were measured in SK-N-SH cells expressing the variant; these
        are neuroblastoma cells, not patient peripheral neurons.
  evidence:
  - reference: PMID:28581500
    reference_title: Hyperactivation of HUSH complex function by Charcot-Marie-Tooth disease mutation in MORC2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The ATPase activity of MORC2 is critical for HUSH-mediated silencing, and the most common alteration
      affecting the ATPase domain in CMT patients (p.Arg252Trp) hyperactivates HUSH-mediated repression
      in neuronal cells.
    explanation: >-
      The gain-of-silencing result for the commonest CMT2Z allele, measured in neuronal cells.
  - reference: PMID:28581500
    reference_title: Hyperactivation of HUSH complex function by Charcot-Marie-Tooth disease mutation in MORC2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overall these data suggested that the R252W mutation in MORC2 can hyper-activate HUSH-mediated epigenetic
      repression, resulting in over-repression of HUSH target genes in neuronal cells.
    explanation: >-
      Endogenous transcriptional effects were measured in SK-N-SH cells expressing the variant; these
      are neuroblastoma cells, not patient peripheral neurons.
- name: Promoter Hypermethylation
  biological_scale: MOLECULAR
  description: >-
    Blood and fibroblast profiling across MORC2-related phenotypes identified an episignature dominated
    by promoter hypermethylation. CMT patients had elevated ERCC8–NDUFAF2 promoter methylation relative
    to controls, with a larger effect in mitochondrial disease. Binding-site overlap suggests that much
    of this signature is HUSH-independent; no direct HUSH-to-promoter-methylation edge is asserted.
  evidence:
  - reference: PMID:40302207
    reference_title: Pleiotropic effects of MORC2 derive from its epigenetic signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitochondrial disease patients exhibited significantly higher methylation levels than those with
      CMT, while CMT patients still demonstrated significantly elevated methylation levels relative to
      controls
    explanation: >-
      CMT-specific contrast within the broader MORC2 cohort.
  - reference: PMID:40302207
    reference_title: Pleiotropic effects of MORC2 derive from its epigenetic signature.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Overall, this suggests that although some of the effects of mutant MORC2 on DNA methylation are
      mediated through interactions with the HUSH complex, the majority are driven by the HUSH-independent
      function of MORC2.
    explanation: >-
      Interpretation of methylation-site overlap with previously measured HUSH and MORC2 binding sites,
      not direct experimental HUSH disruption.
  downstream:
  - target: Repression of Methylated Target Genes
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Promoter methylation and reduced expression are associated across patient-derived cell samples;
      direct perturbation of the methylated promoters was not performed.
- name: Repression of Methylated Target Genes
  biological_scale: CELLULAR
  description: >-
    Fibroblast transcriptomics across the MORC2 disease spectrum identified downregulation of ERCC8, NDUFAF2
    and FKTN, among other genes. NDUFAF2 protein reduction and respiratory-chain changes were demonstrated
    in the broader cohort; one CMT fibroblast line had respiration intermediate between a Leigh-syndrome
    line and control. These findings nominate contributors to phenotypic variability without establishing
    every target defect in every CMT2Z patient.
  evidence:
  - reference: PMID:40302207
    reference_title: Pleiotropic effects of MORC2 derive from its epigenetic signature.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Three of the four genes—ERCC8, NDUFAF2 and FKTN—were also identified as recurrent expression outliers
      in MORC2 patients, with reduced expression levels typical of monogenic disorders caused by primary
      mutations in these genes
    explanation: >-
      Named transcriptional targets in patient fibroblasts from the broader MORC2 cohort; not a CMT2Z-only
      expression estimate.
    directness: INDIRECT
  - reference: PMID:40302207
    reference_title: Pleiotropic effects of MORC2 derive from its epigenetic signature.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When comparing mitochondrial respiration, the fibroblast cell line from a CMT patient exhibited
      an intermediate phenotype, falling between that of a Leigh syndrome patient with CI deficiency and
      a healthy control
    explanation: >-
      Direct functional observation in one CMT patient fibroblast line; peripheral neuronal causality
      remains unresolved.
- name: Neuronal Transcriptional Dysregulation
  biological_scale: CELLULAR
  description: >-
    p.Arg252Trp and p.Ser87Leu alter transcription in patient-derived fibroblasts and rodent sensory-neuron
    expression models. Effects were greater for p.Ser87Leu in the compared system. HUSH-dependent target
    repression and promoter DNA hypermethylation provide distinct, potentially overlapping routes to altered
    gene expression. The transcripts responsible for peripheral axon loss remain incompletely resolved.
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Transcriptional alterations and axonal abnormalities coexist in variant-expressing neurons, but
      a causal chain through specific transcripts has not been established for CMT2Z.
  evidence:
  - reference: PMID:30624633
    reference_title: Characterization of molecular mechanisms underlying the axonal Charcot-Marie-Tooth neuropathy caused by MORC2 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These changes were more pronounced and accompanied by abnormal axonal morphology, in neurons expressing
      the MORC2 p.S87L mutation, which is associated with a more severe clinical phenotype.
    explanation: >-
      p.Ser87Leu produced greater changes and abnormal axonal morphology in this comparison; this is not
      a universal genotype-severity rule.
  - reference: PMID:30624633
    reference_title: Characterization of molecular mechanisms underlying the axonal Charcot-Marie-Tooth neuropathy caused by MORC2 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both mutations induced transcriptional changes in patient-derived fibroblasts and when expressed
      in rodent sensory neurons.
    explanation: >-
      Direct transcriptional effects in the two tested variants; this sentence alone does not identify
      HUSH as the mediator.
- name: Impaired PARP1-Dependent DNA Repair
  biological_scale: CELLULAR
  description: >-
    In human iPSC-derived motor neurons carrying p.Ser87Leu, p.Gln400Arg or p.Asp466Asn, mutant MORC2
    impairs its interaction with PARP1, reduces PARP1 activity and expression, and diminishes DNA-repair
    protein expression and recruitment. This cellular mechanism has not been established as a downstream
    consequence of HUSH hyper-repression.
  biological_processes:
  - preferred_term: double-strand break repair
    modifier: DECREASED
    term:
      id: GO:0006302
      label: double-strand break repair
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: Neuronal Apoptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Defective repair and accumulated DNA damage accompany apoptosis in the iPSC-derived motor-neuron
      model.
    evidence:
    - reference: PMID:41548771
      reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results show that MORC2 mutations induce apoptosis, DNA damage, and axonal pathology, including
        shortened neurites, elevated axonal breakage, and increased axonal swellings, with the most severe
        phenotypes observed in iPSC-MNs harboring p.S87L.
      explanation: >-
        DNA damage and apoptosis in the same model; intracellular steps linking them were not fully resolved
        in the cached abstract.
  - target: Axonal Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The authors link impaired DNA repair to axonal pathology; PAR restoration rescued these readouts
      in p.Ser87Leu neurons.
  evidence:
  - reference: PMID:41548771
    reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, these mutations impair DNA repair by disrupting the interaction between MORC2 and
      PARP1, leading to reduced PARP1 activity and expression, as well as diminished DNA repair protein
      expression and recruitment.
    explanation: >-
      The molecular mechanism, measured across three disease alleles in iPSC-derived motor neurons.
- name: Hydroxyl Radical Accumulation
  biological_scale: CELLULAR
  description: >-
    The Morc2a p.Ser87Leu mouse study linked reduced protein synthesis and loss of function to elevated
    hydroxyl radicals and apoptosis. It also examined mouse embryonic fibroblasts and human p.Arg252Trp
    fibroblasts. This model supports an oxidative-damage route, whose relationship to HUSH-mediated silencing
    and PARP1 repair remains unresolved.
  evidence:
  - reference: PMID:38227798
    reference_title: Morc2a variants cause hydroxyl radical-mediated neuropathy and are rescued by restoring GHKL ATPase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study revealed that Morc2a p.S87L causes a protein synthesis defect, resulting in the loss
      of function of Morc2a and high cellular apoptosis induced by high hydroxyl radical levels.
    explanation: >-
      Mechanism reported for the p.Ser87Leu model, not a universal biochemical effect of CMT2Z alleles.
    directness: INDIRECT
  downstream:
  - target: Neuronal Apoptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The model links excess hydroxyl radicals to increased cell death; its peripheral-neuron generalizability
      requires further testing.
- name: Neuronal Apoptosis
  biological_scale: CELLULAR
  description: >-
    MORC2-variant overexpression increases apoptotic cell death in primary mouse cortical neurons, and
    patient-variant iPSC motor-neuron models also show apoptosis. These are cellular findings across CMT
    and related MORC2 phenotypes.
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:35904125
    reference_title: "Expanding the phenotypic variability of MORC2 gene mutations: From Charcot-Marie-Tooth disease to late-onset pure motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, overexpression in primary cortical neurons increases apoptotic cell death and decreases
      neurite outgrowth.
    explanation: >-
      Primary mouse cortical-neuron overexpression results; this is not a measurement of HUSH silencing.
- name: Axonal Degeneration
  biological_scale: TISSUE
  description: >-
    Motor and sensory axon loss underlies the peripheral neuropathy. Patient nerve biopsies show depletion
    of myelinated fibers and regenerative clusters. iPSC-derived motor neurons carrying disease variants
    develop reduced neurite length, increased breakage and axonal swellings. These culture findings complement
    patient pathology but do not reproduce decades of length-dependent progression.
  cellular_components:
  - preferred_term: axon
    term:
      id: GO:0030424
      label: axon
  downstream:

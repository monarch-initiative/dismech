    most other axonal CMTs — the founding paper is titled for it — but it does not
    generalise across populations. The Spanish national series states explicitly
    that none of its patients had extensor plantar responses or spasticity, so the
    sign is curated with both the claim and its contradiction rather than as a
    uniform feature. Note this is the same population-dependence the entry records
    for the p.Arg252Trp and p.Arg190Trp hotspots, appearing on the clinical axis.
  phenotype_term:
    preferred_term: pyramidal signs
    term:
      id: HP:0002493
      label: Upper motor neuron dysfunction
  evidence:
  - reference: PMID:26659848
    reference_title: MORC2 mutations cause axonal Charcot-Marie-Tooth disease with pyramidal signs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a new locus in which MORC2 mutations are the likely
      pathogenic cause of CMT2 and pyramidal signs in these families.
    explanation: >-
      The founding report, which names pyramidal signs as part of the entity it
      establishes.
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Arg252Trp is the most common, with onset of distal weakness and sensory loss
      in the first or second decade progressing to proximal weakness, cramps, and
      extensor plantar responses but not frank spasticity
    explanation: >-
      Restates the phenotype attached to the commonest allele, including the
      specific sign and the absence of spasticity. It is this paper's summary of
      the prior literature rather than its own observation.
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had normal cognition, and did not have cerebellar findings,
      retinopathy, extensor plantar responses, or spasticity.
    explanation: >-
      The same paper's own cohort had none of these signs. Curated as REFUTE
      against the claim that pyramidal signs are a feature of CMT2Z generally,
      because a national series reporting their complete absence contradicts that
      claim rather than qualifying it.
genetic:
- name: MORC2
  gene_term:
    preferred_term: MORC2
    term:
      id: hgnc:23573
      label: MORC2
  relationship_type: CAUSATIVE
  notes: >-
    MORC2 (22q12.2) encodes a microrchidia-family CW-type zinc finger ATPase that
    acts as the effector of the HUSH complex and also participates in
    double-strand break repair. More than twenty pathogenic variants are
    reported. They cluster in the ATPase module and act by hyperactivating
    HUSH-mediated silencing rather than by abolishing MORC2 function.

    The commonest allele is population-dependent, which is worth knowing before
    reading any single cohort's genotype table: p.Arg252Trp is described as the
    most common variant in the Spanish and US literature, while the Japanese
    series found p.Arg190Trp as a hotspot in eight of thirteen unrelated
    families. Those are different residues, and treating either as "the" common
    allele would mislead.
  variants:
  - name: p.Arg252Trp
    description: >-
      The most frequently reported allele in the European and US literature, and
      the most common ATPase-domain alteration. Hyperactivates HUSH-mediated
      repression in neuronal cells. Onset of distal weakness and sensory loss in
      the first or second decade.
  - name: p.Arg190Trp
    description: >-
      A mutational hotspot in the Japanese series, present in eight unrelated
      families, and the commonest allele in that population.
  - name: p.Ser87Leu
    description: >-
      Associated with the most severe end of the spectrum, an infantile
      spinal muscular atrophy-like presentation. In cell models it produces the
      largest transcriptional change and the worst axonal pathology of the
      alleles tested, so the severity ordering is reproduced in vitro.
  - name: p.Ala406Val
    description: >-
      Reported in three individuals from two families with severe neuropathy
      progressing from distal to proximal weakness.
  - name: p.Gly444Arg and p.His446Gln
    description: >-
      Two variants established as pathogenic by a cell-based survival and
      apoptosis assay developed for variants of uncertain significance,
      associated respectively with dominant CMT and with adult late-onset
      proximal motor neuropathy.
  case_fractions:
  - population: Japanese CMT type 2 diagnostic cohort
    case_fraction_percent: 2.7
    notes: >-
      Share of CMT type 2 patients attributable to MORC2 in a Japanese
      diagnostic series, where MORC2 ranked second after MFN2. The series
      screened 781 unrelated CMT patients of all types; the CMT2 subset that is
      the actual denominator for this percentage is not separately stated, so
      cohort_size is left empty rather than given as 781. The Spanish national
      collection describes MORC2 as a rare cause of CMT without reporting a
      comparable fraction, so this figure should not be read as generalising
      beyond Japan.
    evidence:
    - reference: PMID:28771897
      reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        As the second most common causative gene of CMT type 2 after MFN2, MORC2
        variants were detected in 2.7% of patients with CMT type 2.
      explanation: >-
        The gene's share of CMT2 cases, with its rank, in the largest MORC2
        series published.
  evidence:
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      p.Arg190Trp, as a mutational hotspot, was observed in eight unrelated
      families.
    explanation: The Japanese hotspot allele.
  - reference: PMID:34189813
    reference_title: Charcot-Marie-Tooth disease due to MORC2 mutations in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common mutation was p.R252W, and four new mutations were
      identified.
    explanation: >-
      The commonest allele in the Spanish cohort, which is a different residue
      from the Japanese hotspot.
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      More than 20 different mutations in MORC2 cause Charcot-Marie-Tooth disease
      type 2Z (CMT2Z), a dominantly inherited axonal neuropathy
    explanation: >-
      The size of the allelic series and the inheritance mode, stated as
      established background in this case report's introduction.
diagnosis:
- name: Muscle MRI fatty infiltration pattern
  description: >-
    Muscle imaging distinguishes the scapuloperoneal phenotype from the classic
    length-dependent one by the distribution of fatty infiltration, corroborating
    a clinical distinction that would otherwise rest on examination alone.
  evidence:
  - reference: PMID:34189813
    reference_title: Charcot-Marie-Tooth disease due to MORC2 mutations in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This distinction was corroborated by the distribution of muscle fatty
      infiltration in muscle imaging.
    explanation: >-
      Imaging support for the two-phenotype division, which is what makes it more
      than a descriptive split.
- name: Cell-based pathogenicity assay for MORC2 variants of uncertain significance
  description: >-
    Overexpression of wild-type or mutant MORC2 in the SH-EP neuroblastoma line
    or in primary cortical neurons, scored by survival, apoptosis and neurite
    outgrowth. It was built because next-generation sequencing is producing
    MORC2 variants of uncertain significance faster than the clinical spectrum
    can classify them, and it has been used to establish two new alleles as
    pathogenic.
  evidence:
  - reference: PMID:35904125
    reference_title: "Expanding the phenotypic variability of MORC2 gene mutations: From Charcot-Marie-Tooth disease to late-onset pure motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altogether, these approaches establish the pathogenicity of two new
      variants p.Gly444Arg and p.His446Gln in three patients from two families.
    explanation: The assay's demonstrated use in variant classification.
treatments:
- name: Avoidance of vinca alkaloid chemotherapy
  description: >-
    Vinblastine acutely and severely worsened weakness in a CMT2Z patient treated
    for Hodgkin lymphoma, the first reported case of vinca alkaloid neurotoxicity
    in this disease. Vinca alkaloids are a recognised hazard in inherited
    neuropathy generally; this records that CMT2Z is not an exception. The
    practical consequence is that a CMT2Z diagnosis should reach the oncologist
    before a vinca-containing regimen is chosen.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vinblastine (for Hodgkin lymphoma) acutely worsened the weakness in one
      patient.
    explanation: The observed drug reaction in a genetically confirmed patient.
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we report the first case of vinblastine neurotoxicity in
      Charcot-Marie-Tooth disease type 2Z.
    explanation: >-
      Establishes this as the first such report, which is why the evidence base
      is a single case rather than a series.
- name: Rehabilitation and orthotic management
  description: >-
    Physiotherapy, ankle-foot orthoses for foot drop and management of pes cavus,
    as for axonal CMT generally. No disease-modifying therapy exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  notes: >-
    Deliberately uncited. No CMT2Z-specific rehabilitation study has been
    published, and quoting a general CMT management statement would attribute to
    CMT2Z a recommendation nobody has tested in it. It is recorded because
    omitting supportive care from a progressive neuropathy entry would be
    misleading in the other direction.
- name: Genetic counselling
  description: >-
    Autosomal dominant with a high de novo rate, so recurrence risk depends on
    whether the variant is inherited or de novo — which makes parental testing
    the counselling question rather than a formality.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      the inheritance pattern was mostly sporadic (11/13 patients, 84.6%)
    explanation: >-
      Supports the counselling point by establishing the de novo fraction. The
      step from "mostly sporadic" to "test the parents before quoting a
      recurrence risk" is an inference, hence INDIRECT.
experimental_models:
- name: MORC2-mutant iPSC-derived motor neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human iPSC-derived motor neurons carrying three MORC2 alleles spanning the
    clinical spectrum — p.Ser87Leu from the SMA-like end, p.Gln400Arg and
    p.Asp466Asn from the CMT2Z end. Having all three in one system is what makes
    the severity ordering interpretable rather than anecdotal.
  publication: PMID:41548771
  modeled_mechanisms:
  - target: Axonal Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Human motor neurons carrying patient alleles develop the axonal pathology
      directly, and the severity ordering matches the clinical ordering.
    limitations: >-
      Cultured neurons have no target muscle, no Schwann cells and no length
      dimension, so a length-dependent neuropathy cannot be modelled as such.
      The readouts are neurite measurements over weeks against a human disease
      that progresses over decades.
    readouts:
    - name: Neurite length and axonal swelling count
      target: Axonal Degeneration
      direction: DECREASED
      interpretation: >-
        Shortened neurites with increased breakage and swellings, worst in the
        allele with the worst clinical phenotype.
      evidence:
      - reference: PMID:41548771
        reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          axonal pathology, including shortened neurites, elevated axonal
          breakage, and increased axonal swellings, with the most severe
          phenotypes observed in iPSC-MNs harboring p.S87L
        explanation: The axonal measurements and their allele ordering.
  - target: Impaired PARP1-Dependent DNA Repair
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Inhibiting PAR degradation restored PAR levels, reduced DNA damage and
      improved axonal pathology in p.Ser87Leu neurons, which is a rescue rather
      than a description.
    limitations: >-
      Rescue was shown for one allele in cell culture. There is no animal
      efficacy data and no pharmacokinetic work, so this is a mechanistic
      demonstration, not a preclinical package.
    readouts:
    - name: Cellular PAR level
      target: Impaired PARP1-Dependent DNA Repair
      direction: RESTORED
      interpretation: >-
        PAR restoration is the proximate pharmacodynamic effect through which the
        axonal improvement is proposed to act.
      evidence:
      - reference: PMID:41548771
        reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Notably, inhibition of PAR degradation with PDD restored PAR levels,
          reduced DNA damage accumulation, and ameliorated axonal pathology in
          p.S87L-mutant iPSC-MNs.
        explanation: The rescue result in full.
  evidence:
  - reference: PMID:41548771
    reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we used iPSC-derived motor neurons (iPSC-MNs) carrying three distinct MORC2
      mutations, p.S87L (SMA-like), p.Q400R, and p.D466N (CMT2Z), to examine
      their effects on cellular processes
    explanation: >-
      Defines the model and, importantly, that it spans both ends of the
      phenotypic spectrum.
- name: MORC2 overexpression in SH-EP neuroblastoma and primary cortical neurons
  experimental_model_type: CELL_LINE
  description: >-
    A variant-classification system rather than a disease model: wild-type or
    mutant MORC2 is overexpressed and survival, apoptosis and neurite outgrowth
    are quantified over time, to separate pathogenic alleles from polymorphisms.
  publication: PMID:35904125
  modeled_mechanisms:
  - target: MORC2 Variant Dysregulation of HUSH Silencing
    relationship: MEASURES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Scores the cellular toxicity of a MORC2 allele as a proxy for its
      pathogenicity.
    limitations: >-
      Overexpression is not the heterozygous dose patients carry, and a cortical
      neuron is not a peripheral sensory or motor neuron. The readout is
      apoptosis, which is downstream of, and not specific to, the HUSH mechanism
      the node names.
  evidence:
  - reference: PMID:35904125
    reference_title: "Expanding the phenotypic variability of MORC2 gene mutations: From Charcot-Marie-Tooth disease to late-onset pure motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Likewise, we show that MORC2 mutants affect survival and trigger apoptosis
      over time in SH-EP cell line. Furthermore, overexpression in primary
      cortical neurons increases apoptotic cell death and decreases neurite
      outgrowth.
    explanation: The readouts the assay uses.
animal_models:
- name: Morc2a S87L heterozygous mouse
  species: Mouse
  genotype: Morc2a S87L/+ (knock-in, heterozygous)
  publication: PMID:42656289
  description: >-
    A knock-in carrying the mouse equivalent of a patient allele. It reproduces
    the peripheral neuropathy and, unusually for a CMT model, also the central
    features — cerebellar ataxia and motor neuron degeneration — which is the part
    that bears on this entry's central nervous system node.
  modeled_mechanisms:
  - target: Axonal Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Axonal neuropathy with motor and sensory involvement and skeletal muscle
      weakness, which is the human presentation.
    limitations: >-
      S87L is not among the alleles that dominate the human literature, where
      p.Arg252Trp and p.Arg190Trp are the hotspots, so allele-specific effects are
      not addressed by this model.
    evidence:
    - reference: PMID:42656289
      reference_title: "Novel MORC2 variants in Charcot-Marie-Tooth disease type 2Z: genetic and functional insights."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Morc2a S87L/+ mice exhibit peripheral motor and sensory neuropathy,
        locomotor dysfunction, skeletal muscle weakness, axonal neuropathy,
        cerebellar ataxia, and motor neuron degeneration.
      explanation: >-
        The model's phenotype, covering the peripheral axonal degeneration this
        link is made against.
  - target: Central Nervous System Involvement
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The mouse shows cerebellar ataxia and motor neuron degeneration. The human
      central phenotype in CMT2Z is cognitive impairment in about a third of
      patients, and the Spanish series reports no cerebellar findings at all, so
      the model's central involvement is not the same central involvement.
    limitations: >-
      Cerebellar ataxia is not a reported CMT2Z feature in the human series that
      looked for it. Treating this as a model of the human central phenotype would
      assert a correspondence the clinical literature contradicts.
    evidence:
    - reference: PMID:42656289
      reference_title: "Novel MORC2 variants in Charcot-Marie-Tooth disease type 2Z: genetic and functional insights."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Morc2a S87L/+ mice exhibit peripheral motor and sensory neuropathy,
        locomotor dysfunction, skeletal muscle weakness, axonal neuropathy,
        cerebellar ataxia, and motor neuron degeneration.
      explanation: >-
        Central nervous system involvement in the model. Graded INDIRECT because
        the signs reported are cerebellar and lower motor neuron, while the human
        central phenotype is cognitive.
  evidence:
  - reference: PMID:42656289
    reference_title: "Novel MORC2 variants in Charcot-Marie-Tooth disease type 2Z: genetic and functional insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, Morc2a mRNA and Morc2a protein expression in the quadriceps muscle
      and cerebellum were consistently decreased in Morc2a S87L/+ mice compared to
      wild-type mice
    explanation: >-
      A result that cuts against the gain-of-function reading this entry adopts:
      the variant reduces Morc2a at the protein-dosage level even where HUSH
      silencing is hyperactivated. Recorded on the model rather than on the
      mechanism node, because it is a measurement in this mouse and has not been
      shown in human tissue.
discussions:
- discussion_id: gap_cmt2z_gain_of_silencing_to_axon
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which genes are mis-silenced by hyperactive HUSH, and how does that kill a
    peripheral axon?
  attaches_to:
  - "pathophysiology#Neuronal Transcriptional Dysregulation"
  rationale: >-
    The two ends of the chain are solid and the middle is empty. At the top,
    p.Arg252Trp demonstrably hyperactivates HUSH-mediated repression in neuronal
    cells; at the bottom, human iPSC motor neurons carrying patient alleles show
    real axonal pathology. What is missing is any named transcript whose
    mis-silencing explains the axon. MORC2 is ubiquitously expressed and HUSH
    targets are repeat-rich loci and young retrotransposons genome-wide, so the
    obvious question — why peripheral neurons and not every cell — has only a
    partial answer in MORC2's high neural expression and developmental
    regulation. A competing account has since appeared in the PARP1/DNA-repair
    branch, and the two have not been reconciled: they could be the same
    mechanism seen from two sides, or the HUSH result could be a faithful
    description of MORC2 biology that is not what causes this disease.
  proposed_experiments:
  - experiment_id: exp_cmt2z_hush_target_profiling
    name: HUSH target profiling in patient-allele motor and sensory neurons
    description: >-
      Perform H3K9me3 ChIP and matched transcriptomics in iPSC-derived motor and
      sensory neurons carrying p.Arg252Trp and p.Ser87Leu against isogenic
      controls, and test whether the differentially silenced loci include genes
      with established axonal function.
    would_support:
    - "pathophysiology#Neuronal Transcriptional Dysregulation"
  - experiment_id: exp_cmt2z_hush_vs_parp_epistasis
    name: Epistasis between HUSH silencing and PARP1 repair in the same neurons
    description: >-
      In one iPSC motor neuron system, test whether relieving HUSH
      hyperactivation rescues the DNA repair defect and whether restoring PAR
      signalling normalises HUSH target silencing, to establish whether the two
      proposed mechanisms are ordered, parallel or the same thing.
- discussion_id: gap_cmt2z_spectrum_boundaries
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are CMT2Z, the MORC2 spinal muscular atrophy-like phenotype and the
    ATPase-module developmental syndrome one disease or three?
  attaches_to:
  - "genetic#MORC2"
  - "pathophysiology#Central Nervous System Involvement"
  rationale: >-
    The three have separate names and, for the developmental syndrome, a separate
    OMIM entry, which presents them as distinct entities. The evidence for that
    separation is weaker than the naming suggests. All three arise from
    heterozygous variants in the same ATPase module; all three hyperactivate HUSH
    silencing in the same assay; cognitive impairment appears in about a third of
    CMT2Z patients, and neuropathy appears in the developmental syndrome, so the
    features that supposedly distinguish them are present on both sides at
    different weights. The one clean ordering is severity, tracked by allele
    (p.Ser87Leu worst) and reproduced in cell models. Against a single-spectrum
    reading, one review states plainly that the variability cannot be correlated
    with specific mutated amino acids. This is the lump/split question for
    MORC2 in dismech, and it is recorded here rather than decided, since
    deciding it would create or dissolve entries this PR does not own.
  proposed_experiments:
  - experiment_id: exp_cmt2z_unified_genotype_phenotype
    name: Pooled genotype-phenotype analysis across all MORC2 presentations
    description: >-
      Assemble every published MORC2 case across CMT2Z, the SMA-like phenotype
      and the developmental syndrome with variant, onset age, motor
      distribution, cognitive status, growth and imaging, and test whether the
      presentations separate into clusters or form a continuum ordered by
      residual HUSH activity.
notes: >-
  Scope and lump/split. This entry covers the CMT2Z presentation of heterozygous
  MORC2 disease. Per-type CMT entries are the established shape here —
  Charcot-Marie-Tooth_Disease_Axonal_Type_2C, 2JJ, 2P, 2S, 2T and others already
  sit alongside the Charcot-Marie-Tooth_Disease_Type_2 umbrella — and
  MONDO:0014736 was bound nowhere in kb/. The SMA-like and neurodevelopmental
  MORC2 presentations are not curated as has_subtypes here: they have their own
  MONDO and OMIM identities, and whether the three are one disease is genuinely
  unsettled, so it is recorded as a KNOWLEDGE_GAP rather than resolved by a
  packaging decision. Note that MORC2 already appears in
  Adult-Onset_Proximal_Spinal_Muscular_Atrophy_Autosomal_Dominant and in the
  Charcot-Marie-Tooth_Disease_Type_2 umbrella's gene list.

  The gain-of-function reading is load-bearing. Both functional papers report
  hyperactivation of HUSH silencing, not loss, so genetic_context uses
  GAIN_OF_FUNCTION and the pathway node uses modifier: GAIN_OF_FUNCTION rather
  than INCREASED. That is the qualitative-versus-quantitative distinction
  CLAUDE.md draws: the claim is that silencing is driven outside its normal
  regulatory constraint, not that it is running somewhat high.

  Two mechanisms, deliberately not merged. The HUSH hyperactivation branch
  (2017, 2020) and the PARP1 DNA-repair branch (2026) are curated as separate
  nodes with separate evidence. They may well be connected, and the newer paper
  does not claim to replace the older one. Merging them would assert a
  reconciliation that nobody has published; the reconciliation is a proposed
  experiment instead.

  The founding paper is cited but not quoted. PMID:26497905, the 2016 Brain
  paper that established MORC2 as a CMT gene, is listed in references: because
  it is the origin of this disease entity, but no evidence item quotes it: its
  cached record contains the title, authors and affiliations with no abstract
  body, so there is no exact substring to quote. The claims it would support are
  sourced from later papers that restate them.

  Population-dependent hotspot. p.Arg252Trp and p.Arg190Trp are each described
  as "the most common" MORC2 allele, in European/US and Japanese cohorts
  respectively. Both statements are curated with their populations attached
  rather than one being chosen.

  What is deliberately absent. No datasets: block — a MORC2 search returns
  predominantly the cancer literature, where MORC2 was first characterised as a
  regulator of invasiveness and lipogenesis, which is the Named Entity Confusion
  risk for this gene. No CMT2Z-specific dataset was identified. No
  clinical_trials: block — the PAR degradation inhibitor is a cell-culture
  result with no trial. No environmental: block, although the vinblastine
  reaction is curated under treatments as an exposure to avoid rather than as an
  environmental entry, because it is a drug-safety finding about management and
  not an environmental contributor to disease causation.

  What came from the deep-research report, and what did not. Nothing. Two items a
  reviewer might expect to find here are deliberately absent for that reason: the
  AAV gene-therapy rescue of the Morc2a S87L mouse, and the DNA methylation
  episignature as a molecular classifier. Both are described in the research
  report and neither appears in any cached reference, so curating them would mean
  taking content from a report whose own term validation flagged 21 of 71 labels
  as naming a different concept. The mouse itself is curated, because its
  phenotype sentence is in a cached reference; the AAV arm of the same work is not.

  Pyramidal signs are not uniform. The founding paper is titled for them and the
  Spanish national series reports their complete absence, so the phenotype carries
  a REFUTE item alongside its support rather than being recorded as a settled
  feature. This is the clinical counterpart of the population-dependence the
  genetic: section records for the two hotspot alleles.

  GeneReviews. There is no CMT2Z-specific GeneReviews chapter. The relevant one

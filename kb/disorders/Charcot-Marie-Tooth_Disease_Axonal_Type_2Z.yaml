- name: Genetic counselling
  description: >-
    Counseling includes autosomal dominant transmission, parental evaluation for an apparently de novo
    variant, and reproductive options after identification of the familial variant. Each child of a heterozygous
    affected individual has a 50% chance of inheriting the variant. Absence of the variant from parental
    blood does not exclude germline mosaicism; the sporadic fraction is not a de novo rate.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with autosomal dominant CMT has a 50% chance of inheriting the pathogenic
      variant.
    explanation: >-
      Autosomal dominant CMT transmission risk, applied to heterozygous MORC2 disease.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular genetic testing is recommended for the parents of a proband with an apparent <i>de novo</i>
      pathogenic variant.
    explanation: >-
      General dominant CMT recommendation for parental testing.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the pathogenic variant found in the proband cannot be detected in the leukocyte DNA of either

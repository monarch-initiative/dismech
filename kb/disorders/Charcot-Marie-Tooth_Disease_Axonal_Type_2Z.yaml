name: Charcot-Marie-Tooth Disease Axonal Type 2Z
creation_date: "2026-09-16T20:30:00Z"
description: >-
  Charcot-Marie-Tooth disease axonal type 2Z (CMT2Z) is an autosomal dominant
  axonal sensorimotor neuropathy caused by heterozygous variants in MORC2. It
  sits unusually far upstream for a peripheral neuropathy: MORC2 is a
  chromatin-remodelling ATPase, the effector subunit of the Human Silencing Hub
  (HUSH) complex, which deposits and spreads H3K9me3 to keep repeat-rich
  heterochromatin silent. The primary lesion is therefore epigenetic rather than
  a defect of axonal transport, myelin or mitochondrial dynamics, and the disease
  alleles are not simple loss of function — the common p.Arg252Trp variant
  hyperactivates HUSH-mediated repression in neuronal cells rather than
  abolishing it.

  Clinically the core presentation is childhood- or adolescent-onset distal
  weakness and sensory loss progressing proximally, with an unequivocally axonal
  neurophysiology, frequent spontaneous motor-unit activity and a high rate of
  sporadic de novo occurrence. Two features distinguish it from generic CMT2: a
  scapuloperoneal, asymmetric, proximally-involving pattern that predominates in
  some cohorts, and cognitive impairment in roughly a third of patients, which is
  not part of the classical CMT phenotype.

  MORC2 is genotype-stratified rather than uniform. The most severe end,
  p.Ser87Leu, gives a spinal muscular atrophy-like presentation; variants in the
  ATPase module give a developmental syndrome with growth retardation,
  microcephaly and craniofacial dysmorphism in which neuropathy is present but
  not predominant. This entry covers the CMT2Z pole of that spectrum and records
  the rest as differential and as an open lump/split question, because no
  genotype-to-phenotype rule has been established.
synonyms:

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CMT2Z is caused by heterozygous pathogenic MORC2 variants and can be inherited in an autosomal dominant
    pattern or arise de novo. Eleven of 13 patients in a Japanese series were sporadic; that proportion
    describes family history and is not a confirmed de novo mutation rate.
  evidence:
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean age of onset was 10.3 ± 8.7 years, and the inheritance pattern was mostly sporadic (11/13
      patients, 84.6%).
    explanation: >-
      The 11/13 sporadic fraction does not establish parental variant status or a de novo rate.
  - reference: PMID:32693025
    reference_title: De Novo Variants in the ATPase Module of MORC2 Cause a Neurodevelopmental Disorder with Growth Retardation and Variable Craniofacial Dysmorphism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Heterozygous variants in MORC2 have been reported in individuals with autosomal-dominant Charcot-Marie-Tooth
      disease type 2Z and spinal muscular atrophy, and the onset of symptoms ranges from infancy to the
      second decade of life.
    explanation: >-
      States dominant inheritance and the onset range across the MORC2 spectrum.
  - reference: PMID:26659848
    reference_title: MORC2 mutations cause axonal Charcot-Marie-Tooth disease with pyramidal signs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We validated paternity (data not shown), and as the parents do not carry the mutation we can confirm
      this is a de novo mutation.
    explanation: >-
      Direct confirmation of de novo p.Arg252Trp in the CMT895 proband, distinct from merely sporadic
      presentation.

  - target: Distal sensory impairment
    causal_link_type: DIRECT
  - target: Peripheral axonal neuropathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41548771
    reference_title: Impaired PARP1-dependent DNA repair in MORC2 mutations drives axonal degeneration in Charcot-Marie-Tooth disease subtype 2Z and spinal muscular atrophy-like neuromotor disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that MORC2 mutations induce apoptosis, DNA damage, and axonal pathology, including
      shortened neurites, elevated axonal breakage, and increased axonal swellings, with the most severe
      phenotypes observed in iPSC-MNs harboring p.S87L.
    explanation: >-
      Direct observation of the axonal phenotype in human motor neurons, with the allele ordering preserved.
  - reference: PMID:34189813
    reference_title: Charcot-Marie-Tooth disease due to MORC2 mutations in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nerve conduction studies revealed an unequivocally axonal neuropathy with frequent spontaneous activity,
      and serum creatine kinase levels were increased in 50% of the patients.
    explanation: >-
      The electrophysiological characterisation in the Spanish national cohort, including the creatine
      kinase finding.
  - reference: PMID:26497905
    reference_title: Mutations in the MORC2 gene cause axonal Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sural nerve biopsy revealed pronounced multifocal depletion of myelinated fibres with some regenerative
      clusters and occasional small onion bulbs.
    explanation: >-
      Direct patient nerve histopathology establishes axon depletion and regeneration.
  - reference: PMID:26659848
    reference_title: MORC2 mutations cause axonal Charcot-Marie-Tooth disease with pyramidal signs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nerve biopsy showed a reduction of myelinated axons of all diameters, but teased fibers showed no

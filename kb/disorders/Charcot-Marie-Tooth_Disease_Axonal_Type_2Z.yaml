genetic:
- name: MORC2
  gene_term:
    preferred_term: MORC2
    term:
      id: hgnc:23573
      label: MORC2
  relationship_type: CAUSATIVE
  notes: >-
    CMT2Z is associated primarily with heterozygous missense variants in MORC2. Functional effects differ
    by allele and assay; increased HUSH repression is established for p.Arg252Trp but is not a universal
    molecular consequence. p.Arg252Trp and p.Arg190Trp are the same recurrent variant numbered using protein
    isoforms differing by 62 N-terminal amino acids. Quantitative penetrance has not been established
    by the cited small pedigrees and referral cohorts.
  variants:
  - name: p.Arg252Trp (p.Arg190Trp in the shorter isoform)
    description: >-
      Recurrent CMT2Z variant that hyperactivates HUSH-mediated repression in neuronal cell models. Early
      distal weakness and sensory loss can progress proximally. The same variant was reported as p.Arg190Trp
      in eight unrelated Japanese families using the shorter protein isoform.
  - name: p.Ser87Leu
    description: >-
      Associated with severe early-onset neuropathy with SMA-like features. It produced greater transcriptional
      changes and axonal abnormalities than p.Arg252Trp in the compared neuronal-expression system, and
      the most severe pathology among the variants tested in the cited iPSC motor-neuron study.
  - name: p.Ala406Val
    description: >-
      Reported in three individuals from two families with severe neuropathy progressing from distal to
      proximal weakness.
  - name: p.Gly444Arg and p.His446Gln
    description: >-
      p.Gly444Arg segregated in a family with adult-onset sensorimotor CMT, while p.His446Gln was found
      in a separate patient with adult pure motor neuropathy. Overexpression assays supported deleterious
      effects of both variants, alongside the clinical evidence; the pure motor presentation is an allelic
      comparison rather than a CMT2Z subtype.
  - name: p.Ala12Pro and p.Arg283His
    description: >-
      A 2026 Chinese family study classified both variants as likely pathogenic, reporting p.Ala12Pro
      protein instability and reduced p.Arg283His transcript abundance in transfected HEK293T cells. p.Arg283His
      failed segregation in an earlier family, so the newer segregating family and functional results
      should be considered alongside that conflicting evidence.
  case_fractions:
  - population: Japanese CMT type 2 diagnostic cohort
    case_fraction_percent: 2.7
    notes: >-
      Share of CMT type 2 patients attributable to MORC2 in a Japanese diagnostic series, where MORC2
      ranked second after MFN2. The series screened 781 unrelated CMT patients of all types; the CMT2
      subset that is the actual denominator for this percentage is not separately stated, so cohort_size
      is left empty rather than given as 781. The Spanish national collection describes MORC2 as a rare
      cause of CMT without reporting a comparable fraction, so this figure should not be read as generalising
      beyond Japan.
    evidence:
    - reference: PMID:28771897
      reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        As the second most common causative gene of CMT type 2 after MFN2, MORC2 variants were detected
        in 2.7% of patients with CMT type 2.
      explanation: >-
        MORC2 contribution to CMT2 in this Japanese diagnostic series; the total 781 all-CMT referrals
        are not the denominator for 2.7%.
  evidence:
  - reference: PMID:28771897
    reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused by MORC2 variants in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      p.Arg190Trp, as a mutational hotspot, was observed in eight unrelated families.
    explanation: >-
      The recurrent variant in the Japanese series, reported using the shorter isoform's p.Arg190Trp numbering
      rather than p.Arg252Trp.
  - reference: PMID:34189813
    reference_title: Charcot-Marie-Tooth disease due to MORC2 mutations in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common mutation was p.R252W, and four new mutations were identified.
    explanation: >-
      The commonest allele in the Spanish cohort; p.Arg252Trp and the Japanese report's p.Arg190Trp are
      alternative isoform numberings of the same variant.
  - reference: PMID:28581500
    reference_title: Hyperactivation of HUSH complex function by Charcot-Marie-Tooth disease mutation in MORC2.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      an arginine to tryptophan substitution at residue 252 (R252W or p.Arg252Trp in Uniprot: Q9Y6X9-1)
      ... This is the identical mutation to the reported R190W variant ... which refers to a putative
      alternative isoform of the protein (Uniprot: Q9Y6X9-2) that lacks 62 amino acids at the N-terminus.
    explanation: >-
      Explicitly reconciles the variant numbering used by the earlier clinical reports; the two protein
      names must not be counted as different alleles.
  - reference: PMID:33844363
    reference_title: A recurrent MORC2 mutation causes Charcot-Marie-Tooth disease type 2Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      More than 20 different mutations in MORC2 cause Charcot-Marie-Tooth disease type 2Z (CMT2Z), a dominantly
      inherited axonal neuropathy
    explanation: >-
      The size of the allelic series and the inheritance mode, stated as established background in this
      case report's introduction.
  - reference: PMID:42656289
    reference_title: "Novel MORC2 variants in Charcot-Marie-Tooth disease type 2Z: genetic and functional insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In each family, we identified a different heterozygous variant in the MORC2 gene, namely c.34G >
      C;p.A12P in family 1 and c.848G > A;p.R283H in family 2. ... Both variants were therefore classified
      as likely pathogenic.
    explanation: >-
      The study classification of p.Ala12Pro and p.Arg283His; functional effects were measured in HEK293T
      overexpression assays.
  - reference: PMID:42656289
    reference_title: "Novel MORC2 variants in Charcot-Marie-Tooth disease type 2Z: genetic and functional insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In their study, this variant did not co-segregate with the disease and was therefore not included
      in the HGMD database.
    explanation: >-
      The authors acknowledge prior non-segregation of p.Arg283His before presenting their newer family
      evidence.
    quote_role: BACKGROUND
diagnosis:
- name: MORC2 molecular genetic testing
  description: >-
    A heterozygous pathogenic or likely pathogenic MORC2 variant in a compatible neuropathy supports CMT2Z
    diagnosis. MORC2 can be assessed within a neuropathy panel or exome-based evaluation; family segregation
    and parental testing help interpret inheritance. A variant of uncertain significance alone does not
    establish the diagnosis.
  evidence:
  - reference: PMID:35904125
    reference_title: "Expanding the phenotypic variability of MORC2 gene mutations: From Charcot-Marie-Tooth disease to late-onset pure motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole‐exome sequencing was performed for both families. The two affected individuals of the first
      family bear the same heterozygous mutation c.1330G>A (p.Gly444Arg) in the MORC2 gene
    explanation: >-
      Exome sequencing identified the segregating variant in the sensorimotor CMT family.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular genetic testing approaches can include gene-targeted testing (single-gene testing, multigene
      panel) and comprehensive genomic testing (exome sequencing, exome array).
    explanation: >-
      General CMT diagnostic strategy, applied to MORC2-associated neuropathy.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Nerve conduction studies and needle electromyography
  description: >-
    Motor and sensory conduction studies establish an axonal neuropathy. Needle EMG may show fasciculations
    or myokymia; these findings support the phenotype but are not specific molecular tests for CMT2Z.
  evidence:
  - reference: PMID:26497905
    reference_title: Mutations in the MORC2 gene cause axonal Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiological studies were consistent with an asymmetric axonal motor and sensory neuropathy,
      while fasciculations and myokymia were recorded rather frequently by needle electromyography.
    explanation: >-
      Direct characterization of nerve conduction and needle EMG findings in MORC2 neuropathy.
- name: Muscle MRI fatty infiltration pattern
  description: >-
    Muscle imaging distinguishes the scapuloperoneal phenotype from the classic length-dependent one by
    the distribution of fatty infiltration, corroborating a clinical distinction that would otherwise
    rest on examination alone.
  evidence:
  - reference: PMID:34189813
    reference_title: Charcot-Marie-Tooth disease due to MORC2 mutations in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This distinction was corroborated by the distribution of muscle fatty infiltration in muscle imaging.
    explanation: >-
      Imaging support for the two-phenotype division, which is what makes it more than a descriptive split.
- name: Research functional assessment of MORC2 variants
  description: >-
    Overexpression in SH-EP neuroblastoma cells and primary mouse cortical neurons measured survival,
    apoptosis and neurite outgrowth. The assays supplied functional evidence for p.Gly444Arg and p.His446Gln
    alongside clinical and familial findings. They are research tools, not standalone validated clinical
    diagnostic tests.
  evidence:
  - reference: PMID:35904125
    reference_title: "Expanding the phenotypic variability of MORC2 gene mutations: From Charcot-Marie-Tooth disease to late-onset pure motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altogether, these approaches establish the pathogenicity of two new variants p.Gly444Arg and p.His446Gln
      in three patients from two families.
    explanation: >-
      The authors interpret their combined clinical and functional evidence as supporting pathogenicity.
      p.Gly444Arg occurred in the CMT family; p.His446Gln occurred in a separate pure motor neuropathy
      case.
- name: Research MORC2 DNA methylation episignature
  description: >-
    A 220-CpG classifier differentiated most MORC2-associated cases from controls in blood and fibroblasts.
    Three CMT patients were classified as controls, and the pathogenicity of their transducer-domain variants
    remained unresolved. The signature can provide functional support for variant interpretation; it is
    not a fully sensitive exclusion test for CMT2Z.
  evidence:
  - reference: PMID:40302207
    reference_title: Pleiotropic effects of MORC2 derive from its epigenetic signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All groups were correctly classified except for three MORC2 CMT patients that were falsely classified
      as controls (AUC = 0.988)
    explanation: >-
      Validation result including the CMT false-negative cases, which qualify the abstract claim of universality.
  - reference: PMID:40302207
    reference_title: Pleiotropic effects of MORC2 derive from its epigenetic signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further investigation is needed to clarify the pathogenicity of these variants.
    explanation: >-
      The authors leave the episignature-negative variants unresolved.

  The retired chapter is named by title with no identifier on purpose.
  check-genereviews matches chapter identifiers anywhere in the file, so writing
  its PMID here makes the check report CITED_UNTAGGED against a chapter this very
  sentence says is not cited — the check cannot distinguish a citation from a
  mention that denies citing. Searching the title finds it.

    Vinblastine-containing chemotherapy acutely worsened weakness in a p.Ala406Val CMT2Z patient. The
    case authors recommend careful monitoring when a vinca alkaloid is considered. General CMT guidance
    also identifies vincristine as particularly hazardous to peripheral nerves.

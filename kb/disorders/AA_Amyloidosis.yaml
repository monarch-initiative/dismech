    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Amyloid A (AA) amyloidosis is an organ- or life-threatening complication of
      chronic inflammatory disorders.
    explanation: >-
      Supports multi-organ, potentially life-threatening involvement as the
      clinical consequence of the deposition chain. Evidence source is OTHER
      because this is a review.

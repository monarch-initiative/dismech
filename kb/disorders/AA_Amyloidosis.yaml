  - target: Extrarenal Organ Dysfunction
    causal_link_type: DIRECT
    description: >-
      Amyloid infiltration of liver, spleen, gut, and endocrine organs disturbs
      their architecture and function.
- name: Glomerular Filtration Barrier Disruption
  description: >-
    Amyloid expanding the mesangium and infiltrating the glomerular capillary
    wall breaches the filtration barrier, producing non-selective proteinuria.
    Glomerular (rather than purely vascular) involvement is the histological
    determinant of the clinical picture and of renal outcome; a
    vascular-predominant pattern presents with less proteinuria. Tubular atrophy
    and the abundance and distribution of glomerular deposits predict renal
    survival.
  conforms_to: amyloidogenesis#Organ Dysfunction

  - reference: PMID:26176329
    reference_title: "Therapeutic Clearance of Amyloid by Antibodies to Serum Amyloid P Component."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amyloid fibril deposits that cause systemic amyloidosis always contain
      the nonfibrillar normal plasma protein, serum amyloid P component (SAP).
    explanation: >-
      Establishes SAP as an invariant component of the deposits, the second
      accessory molecule stabilizing them.
  downstream:
  - target: Progressive Multi-Organ Amyloid Accumulation
    causal_link_type: DIRECT
    description: >-
      Continued nucleation and elongation converts fibril formation into a
      growing tissue burden.
- name: Progressive Multi-Organ Amyloid Accumulation
  description: >-
    Fibrils accumulate as a growing extracellular amyloid burden. Because the
    precursor is circulating, deposition is systemic and bilateral, but the
    distribution is characteristic: kidney (glomerular mesangium and capillary
    walls, plus vascular deposits), liver, spleen, and adrenal gland are the
    dominant sites, with perivascular deposition common across organs. Unlike the
    deposits of AL and ATTR, this burden is genuinely dynamic - it regresses when
    the precursor supply is withdrawn, which is why this node is not a
    therapeutic dead end.
  conforms_to: amyloidogenesis#Progressive Tissue Amyloid Accumulation

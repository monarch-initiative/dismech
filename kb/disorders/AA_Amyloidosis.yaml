- name: Progressive Kidney Failure
  description: >-
    The dominant clinical consequence. Proteinuria progresses to nephrotic-range
    proteinuria and nephrotic syndrome, then to declining glomerular filtration
    rate and end-stage kidney disease requiring dialysis or transplantation.
    Renal dysfunction, not cardiac or neurological involvement, defines the
    course of AA amyloidosis - the principal clinical contrast with AL
    amyloidosis.
  conforms_to: amyloidogenesis#Organ Dysfunction
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:17554117
    reference_title: "Natural history and outcome in systemic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median survival after diagnosis was 133 months; renal dysfunction was the
      predominant disease manifestation.
    explanation: >-
      Establishes renal dysfunction as the dominant manifestation and provides
      the survival benchmark for this consequence node.
  - reference: PMID:17554116
    reference_title: "Eprodisate for the treatment of renal disease in AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amyloid deposition in the kidney causes progressive deterioration in renal
      function.
    explanation: >-
      States the deposition-to-renal-failure causal link this node represents.
- name: Extrarenal Organ Dysfunction
  description: >-
    Amyloid infiltration outside the kidney. Hepatic and splenic deposition is
    frequent and often functionally silent, detected radiologically or as raised
    alkaline phosphatase rather than as liver failure. Gastrointestinal
    deposition causes chronic diarrhoea and malabsorption. Adrenal and thyroid
    infiltration occurs. Cardiac involvement and peripheral neuropathy are
    comparatively uncommon in AA - a point of clinical contrast with AL
    amyloidosis rather than a feature of this disease.
  conforms_to: amyloidogenesis#Organ Dysfunction
  role: consequence
  biological_scale: ORGANISM
  evidence:

      directness: DIRECT
      quote_role: PRIMARY_RESULT
biochemical:
- name: Serum Amyloid A
  notes: >-
    SAA is the circulating fibril precursor and an important serial biomarker. In the 374-patient cohort,
    median SAA below 10 mg/L was associated with deposit regression in 60%, and persistent low-normal
    levels below 4 mg/L with favorable outcomes. These observational thresholds inform monitoring but
    are not a guarantee of individual response.
  presence: INCREASED
  evidence:
  - reference: PMID:17554117
    reference_title: Natural history and outcome in systemic AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The effects of renal dysfunction dominate the course of AA amyloidosis,
      which is associated with a relatively favorable outcome in patients with
      SAA concentrations that remain in the low-normal range (<4 mg per liter).
    explanation: >-
      Establishes the prognostic threshold that makes SAA an actionable treat-to-target biomarker.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:26120866
    reference_title: 'Therapeutic blockade of interleukin-6 by tocilizumab in the management of AA amyloidosis and chronic inflammatory disorders: a case series and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main aim of treatment is to suppress inflammation thereby inhibiting
      serum amyloid A protein (SAA), which is the precursor of AA amyloid
      fibrils, to prevent or halt amyloid deposition.
    explanation: >-
      States explicitly that SAA is both the fibril precursor and the treatment target, the dual role
      this biochemical entry records.
    directness: DIRECT
    quote_role: BACKGROUND
histopathology:
- name: Congo Red-Positive Amyloid Deposition
  description: >-
    Acellular Congo red-positive extracellular deposits showing apple-green birefringence under polarized
    light. This confirms amyloid but does not identify the precursor; typing is a separate and mandatory
    step.
  diagnostic: true
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  evidence:
  - reference: PMID:28828707
    reference_title: Pathology and diagnosis of renal non-AL amyloidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Renal amyloidosis is characterized by acellular Congo red positive deposits
      in the glomeruli, interstitium and/or arteries.
    explanation: >-
      Defines the Congo red-positive histological finding and its renal distribution.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Glomerular-Predominant Deposition Pattern
  description: >-
    The 68-case renal series identified mesangial segmental, mesangial nodular, mesangiocapillary and
    hilar patterns. Glomerular-predominant disease had more proteinuria than the vascular form.
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  evidence:
  - reference: PMID:17714761
    reference_title: 'Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The distribution pattern of glomerular amyloid deposits was mesangial
      segmental (14.7%), mesangial nodular (26.5%), mesangiocapillary (32.3%),
      and hilar (26.5%). Glomerular form was observed in 80.9% of cases and
      vascular form in 19.1%.
    explanation: >-
      Quantifies the glomerular deposition patterns and the glomerular-to-vascular ratio in a 68-case
      renal AA series.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Amyloid-Associated Giant Cell and Inflammatory Reaction
  description: >-
    The renal biopsy series found multinucleated giant cells or a glomerular inflammatory infiltrate in
    a subset, sometimes with crescents. An immune response contributing to amyloid resolution was proposed;
    the biopsy observation does not prove the same mechanism as experimental anti-SAP clearance.
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  evidence:
  - reference: PMID:17714761
    reference_title: 'Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AA amyloidosis-related inflammation was noted in 30 patients (44.1%) and
      appeared as a multinucleated giant cell reaction (27.9%) or a glomerular
      inflammatory infiltrate (25%), including glomerular crescents (17.6%).
    explanation: >-
      Quantifies the amyloid-associated inflammatory reaction and its giant-cell component in the same
      68-case series.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
diagnosis:
- name: Tissue Biopsy with Amyloid Typing
  description: >-
    Demonstrate amyloid in tissue and identify the fibril precursor. Congo red staining alone does not
    distinguish AA from AL or hereditary non-AA amyloidoses. Anti-AA immunohistochemistry is commonly
    used; laser microdissection/mass spectrometry helps when typing is uncertain. A negative less-invasive
    fat or salivary-gland sample does not exclude disease when suspicion remains high.
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Histopathological examination is the gold standard of diagnosis, but
      magnetic resonance imaging can be used to detect cardiac involvement.
    explanation: >-
      Establishes histopathology as the diagnostic gold standard. Evidence source is OTHER because this
      is a review.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:28828707
    reference_title: Pathology and diagnosis of renal non-AL amyloidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      accurate typing of non-AL amyloidosis then requires immunohistochemical or
      laser microdissection/mass spectrometry studies of the Congo red positive
      deposits
    explanation: >-
      States the requirement for immunohistochemical or mass-spectrometric typing beyond Congo red staining.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      If clinical suspicion is significantly high and these approaches render negative results, a sample
      should be retrieved from the affected organ.
    explanation: >-
      The review cautions against excluding amyloidosis after a negative less-invasive biopsy.
- name: Serum Amyloid A and C-Reactive Protein Monitoring
  description: >-
    Serial SAA, renal function and urinary protein measurements follow precursor suppression and organ
    disease. CRP can assess accompanying inflammation but is not the fibril precursor and can be normal
    in the hereditary promoter form. SAP scintigraphy, where available, estimates systemic burden and
    does not replace tissue typing.
  evidence:
  - reference: PMID:17554117
    reference_title: Natural history and outcome in systemic AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SAA concentration was measured serially, and the amyloid burden was
      estimated with the use of whole-body serum amyloid P component
      scintigraphy.
    explanation: >-
      Documents serial SAA and SAP scintigraphy in the longitudinal cohort.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Etiologic investigation and selected SAA1 promoter testing
  description: >-
    Investigate chronic infections, inflammatory and autoinflammatory disease. In AA without systemic
    inflammation, especially with a family history, consider SAA1 promoter analysis and genetic counseling.
    A standard coding-only panel may not address the reported regulatory variant.
  evidence:
  - reference: PMID:34560138
    reference_title: A mutation in the SAA1 promoter causes hereditary amyloid A amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Thus, genetic screening of the SAA1 promoter should be pursued in individuals with amyloid A amyloidosis
      and no systemic inflammation, especially if there is a positive family history.
    explanation: >-
      The family report specifically recommends promoter testing in this setting.
  - reference: PMID:20301405
    reference_title: Familial Mediterranean Fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      The diagnosis of FMF is established in a proband with suggestive clinical findings and biallelic
      pathogenic variants in MEFV identified by molecular genetic testing.
    explanation: >-
      GeneReviews informs assessment of FMF as one upstream cause; this is not a diagnostic definition
      for all AA.
differential_diagnoses:
- name: Systemic AL Amyloidosis
  description: >-
    AL amyloid derives from immunoglobulin light chains, whereas AA derives from SAA. Tissue precursor
    typing is essential because management differs. Renal-predominant presentation and an inflammatory
    history can suggest AA but do not establish its type.
  disease_term:
    preferred_term: primary systemic amyloidosis
    term:
      id: MONDO:0017816
      label: primary systemic amyloidosis
  distinguishing_features:
  - AA usually has dominant renal involvement; clinically important cardiac involvement is less typical but can occur.
  - Light-chain restriction supports AL, while negative immunofluorescence suggests a non-AL type; definitive typing remains necessary.
  evidence:
  - reference: PMID:28828707
    reference_title: Pathology and diagnosis of renal non-AL amyloidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The detection of Congo red positive deposits coupled with negative
      immunofluorescence studies is highly suggestive of non-AL amyloidosis.
    explanation: >-
      Provides the immunofluorescence-based discriminator between AL and non-AL (including AA) renal amyloidosis.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While cardiac infiltration is extensively documented in various amyloidosis
      types, it is a relatively rare cause of heart failure in AA amyloidosis
    explanation: >-
      The review describes cardiac heart failure as relatively rare in AA; this is a contextual clue,
      not a stand-alone classifier.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
progression:
- phase: Subclinical amyloid deposition
  notes: >-
    Inflammatory AA generally follows sustained precursor production before overt organ disease. Latency
    varies and cannot be assigned a universal number of years. Renal surveillance is important in at-risk
    inflammatory diseases; the hereditary promoter form has a distinct upstream cause.
  evidence:
  - reference: PMID:25387054
    reference_title: 'AA amyloidosis: pathogenesis and targeted therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, AA amyloidosis can be thought of as a consequence of
      long-standing inflammatory disease.
    explanation: >-
      Supports a prolonged latent phase driven by long-standing inflammation preceding clinical presentation.
      Evidence source is OTHER (review).
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- phase: Proteinuric and nephrotic phase
  notes: >-
    In the selected 68-case renal biopsy series, nephrotic syndrome occurred in 63.1% and renal insufficiency
    in 75%. These overlapping findings do not establish an obligatory sequential course.
  evidence:
  - reference: PMID:17714761
    reference_title: 'Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nephrotic syndrome and renal insufficiency were noted in 63.1% and 75% of
      patients, respectively.
    explanation: >-
      Quantifies the proteinuric and nephrotic phase in a renal AA amyloidosis series.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- phase: Amyloid storm (rare acute FMF-associated variant)
  notes: >-
    A minority of FMF patients depart from the indolent course entirely and present with an acute illness:
    heavy proteinuria, high inflammatory markers, and progression to kidney failure within weeks rather
    than years, typically precipitated by a superimposed infection. Curated as a distinct trajectory rather
    than a severity grade, because the timescale (weeks) and the infection trigger are qualitatively different
    from the usual course.
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While the majority of cases follow an indolent course, a subset of
      individuals with FMF might undergo acute illness, marked by substantial
      proteinuria, elevated inflammatory markers, and rapid progression to kidney
      failure within weeks.
    explanation: >-
      Defines the amyloid storm presentation and contrasts it with the indolent majority course. Evidence
      source is OTHER because this is a review.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These infrequent instances are named “amyloid storm,” which is thought to
      be precipitated by superimposed infections or other triggering events
    explanation: >-
      Names the entity and its precipitating trigger. Evidence source is OTHER because this is a review.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- phase: Progressive renal decline to end-stage kidney disease
  notes: >-
    Renal decline varies with underlying disease, baseline injury and treatment. In the initial eprodisate
    trial, the placebo group lost a mean 15.6 mL/min/1.73 m2 of creatinine clearance per year while receiving
    physician-managed treatment of underlying inflammation; this is a selected trial comparator, not untreated
    natural history. A separate 374-patient cohort reported median survival of 133 months after diagnosis.
  evidence:
  - reference: PMID:17554116
    reference_title: Eprodisate for the treatment of renal disease in AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean rates of decline in creatinine clearance were 10.9 and 15.6 ml per
      minute per 1.73 m(2) of body-surface area per year in the eprodisate and
      the placebo groups, respectively (P=0.02).
    explanation: >-
      Describes decline in a placebo-controlled trial whose participants also received usual treatment
      of underlying inflammation. It cannot define the untreated rate for all AA.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:17554117
    reference_title: Natural history and outcome in systemic AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median survival after diagnosis was 133 months
    explanation: >-
      Provides the median survival benchmark for the progressive phase.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: url:https://amyloid.nl/Files/Dember%20Eprodisate%20New%20England.pdf
    reference_title: https://amyloid.nl/Files/Dember%20Eprodisate%20New%20England.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Treatment of the underlying inflammatory disease was determined by the patient’s physician.
    explanation: >-
      The primary trial Methods establish that usual inflammatory-disease care accompanied both randomized
      arms, so placebo is not an untreated natural-history cohort.
treatments:
- name: Colchicine (Familial Mediterranean Fever)
  description: >-
    Colchicine controls FMF inflammation and reduces the risk of AA amyloidosis. In established FMF-associated
    renal AA, observational studies report stabilization or proteinuria regression in some patients, with
    worse outcomes when renal injury is advanced. The historical dose and creatinine associations are
    not universal modern prescribing thresholds; dosing requires individual assessment of renal function,
    tolerance and interactions.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: colchicine
      term:
        id: CHEBI:23359
        label: colchicine
  target_mechanisms:
  - target: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
    treatment_effect: INHIBITS
    description: >-
      Suppressing FMF inflammatory attacks removes the cytokine drive at the trigger node, preventing
      the downstream acute-phase SAA surge.
  evidence:
  - reference: PMID:7986228
    reference_title: Colchicine treatment of AA amyloidosis of familial Mediterranean fever. An analysis of factors affecting outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Deterioration was related to initial serum creatinine values > or = 1.5 mg/dl (P < 0.01) and to
      mean colchicine dosage < or = 1.5 mg/day (P < 0.001).
    explanation: >-
      Associations in a retrospective 1974–1992 cohort of 68 patients with baseline creatinine ≤2.5 mg/dL;
      this does not establish an absolute response boundary or a dose appropriate for every patient.
  - reference: PMID:7986228
    reference_title: Colchicine treatment of AA amyloidosis of familial Mediterranean fever. An analysis of factors affecting outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the end of the study period, kidney disease had worsened in 31 patients
      and remained stable in 22. Proteinuria had regressed in 15 patients.
    explanation: >-
      Documents stabilization or regression of proteinuria in a substantial share of colchicine-treated
      patients. The limitation is that this is an uncontrolled retrospective series without a comparator
      arm, and disease still worsened in the largest single group.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a study examining 960 patients with FMF without evidence of amyloidosis
      at baseline, the cumulative rate of proteinuria after 11 years was reported
      as 1.7% in colchicine-compliant patients while 48.9% in the non-compliants
    explanation: >-
      The review summarizes an observational association between colchicine adherence and less subsequent
      proteinuria; adherence groups were not randomized.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, evidence for its efficacy in AA amyloidosis due to causes other
      than FMF is still quite limited
    explanation: >-
      Records the scope limit deliberately encoded in this treatment's name: colchicine's evidence base
      is FMF-specific and should not be generalized to AA amyloidosis from other triggers. Evidence source
      is OTHER (review).
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Anti-TNF-alpha Therapy
  description: >-
    TNF blockade can control an appropriate underlying inflammatory disease, especially inflammatory arthritis,
    and may improve AA renal markers. Small observational series show variable outcomes. The retrospective
    tocilizumab comparison does not establish a universal ranking across AA etiologies. Infliximab and
    adalimumab are antibodies; etanercept is a soluble receptor fusion protein.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_mechanisms:
  - target: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
    treatment_effect: INHIBITS
    description: >-
      Neutralizing TNF-alpha suppresses the inflammatory arthropathy at the trigger node, reducing the
      cytokine drive to hepatic SAA production.
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a retrospective series including 15 patients treated with anti-TNF,
      amyloidosis progressed in seven patients (46.7%), stabilized in five
      (33.3%), and regression of proteinuria occurred in three (20%) in 10
      months
    explanation: >-
      Quantifies outcomes on anti-TNF therapy. The limitation is that amyloidosis still progressed in
      the largest single group, so this series does not establish efficacy. Evidence source is OTHER because
      the figures are reported in a review summarizing the primary series.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in a multicenter study in which 36 patients with AA amyloidosis treated
      with anti-TNF therapy were followed prospectively for 5 years, > 50%
      decrease in proteinuria was observed in more than half of the patients
    explanation: >-
      The stronger of the two datasets - prospective, multicentre, 5-year follow-up - showing a substantial
      proteinuria response in the majority. Evidence source is OTHER because the figures are reported
      in a review summarizing the primary study.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a retrospective analysis including 42 patients with AA amyloidosis
      demonstrated that tocilizumab was superior to anti-TNFs in terms of
      obtaining a decrease in SAA, improvement in kidney function, and
      suppression of the disease activity
    explanation: >-
      The review reports a 42-patient nonrandomized comparison. Differences in underlying disease and
      treatment selection limit causal superiority claims.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Interleukin-6 Receptor Blockade (Tocilizumab)
  description: >-
    Tocilizumab can suppress SAA in selected refractory inflammatory disorders with AA amyloidosis. A
    20-patient uncontrolled series included 14 AA cases and reported rapid SAA reduction with stable or
    regressing deposits; infections were the predominant adverse effect. A Still disease report also used
    glucocorticoids, preventing attribution to tocilizumab alone. Choice depends on the cause and clinical
    context.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: IL-6-Driven Hepatic Acute-Phase Response
    treatment_effect: INHIBITS
    description: >-
      IL-6 receptor blockade removes the principal signal inducing hepatocyte SAA transcription, collapsing
      precursor supply at the amplifier node.
  evidence:
  - reference: PMID:26120866
    reference_title: 'Therapeutic blockade of interleukin-6 by tocilizumab in the management of AA amyloidosis and chronic inflammatory disorders: a case series and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-cohort median pre-treatment SAA fell from 70 to 4 mg/L within 10 days
      of the first dose; this response has been maintained over an on-treatment
      follow-up period of 23 months (p<0.0001). AA amyloid deposits either
      regressed or remained stable.
    explanation: >-
      The whole-cohort SAA change covers 20 patients, 14 with AA; amyloid findings apply to the affected
      subset. This is an uncontrolled series.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:26120866
    reference_title: 'Therapeutic blockade of interleukin-6 by tocilizumab in the management of AA amyloidosis and chronic inflammatory disorders: a case series and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This small series shows that in patients with treatment-refractory chronic
      inflammatory conditions TCZ can be effective in suppressing inflammation,
      and in those with AA amyloidosis, can lead to regression of amyloid
      deposits.
    explanation: >-
      The authors' own conclusion, recorded with its stated limitation. The limitation is that this is
      an uncontrolled 20-patient case series, of whom 70% had AA amyloidosis, and the authors call for
      longer follow-up.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:41670232
    reference_title: Tocilizumab prevented the progression of AA amyloidosis derived from adult-onset Still's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Steroid pulse therapy, followed by tocilizumab, a IL-6 receptor inhibitor,
      in combination with oral glucocorticoids dramatically improved kidney and
      cardiac manifestations with reduction in systemic inflammation.
    explanation: >-
      Corroborates organ-level benefit of IL-6 blockade in biopsy-proven AA amyloidosis. The limitation
      is that it is a single case report with concomitant glucocorticoid therapy.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Interleukin-1 Blockade (Canakinumab, Anakinra)
  description: >-
    Canakinumab (an IL-1beta antibody) and anakinra (an IL-1 receptor antagonist) can control selected
    autoinflammatory causes of AA. The cited randomized trial demonstrated fewer flares in colchicine-resistant
    FMF, mevalonate kinase deficiency and TRAPS, not improved AA renal outcomes. Broader GeneReviews guidance
    supports IL-1 treatment and amyloidosis prevention in the relevant trigger disorders.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: canakinumab
      term:
        id: NCIT:C80971
        label: Canakinumab
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
    treatment_effect: INHIBITS
    description: >-
      IL-1 pathway inhibition reduces activity of a responsive underlying autoinflammatory disease; canakinumab
      neutralizes IL-1beta, whereas anakinra blocks its receptor.
  evidence:
  - reference: PMID:29768139
    reference_title: Canakinumab for the Treatment of Autoinflammatory Recurrent Fever Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this trial, canakinumab was effective in controlling and preventing
      flares in patients with colchicine-resistant familial Mediterranean fever,
      mevalonate kinase deficiency, and TRAPS.
    explanation: >-
      Randomized trial evidence that canakinumab controls the autoinflammatory trigger diseases. The limitation
      is that the trial endpoint was control of the trigger disease, not amyloid burden or renal outcome
      in AA amyloidosis.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:36375008
    reference_title: TNF Receptor-Associated Periodic Fever Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      IL-1 inhibitors and the TNF inhibitor etanercept control the severity of disease flares and are
      effective in preventing AA amyloidosis.
    explanation: >-
      TRAPS-specific GeneReviews guidance supports control of this upstream cause, not universal efficacy
      across AA etiologies.
- name: Kidney Transplantation
  description: >-
    Kidney transplantation is an option for suitable individuals with end-stage renal disease. In a contemporary
    French cohort of 86 recipients, five-year survival was 85.5% and histological recurrence 5.8%. This
    uncontrolled cohort cannot isolate the effect of biologics; infection requiring hospitalization occurred
    in 55.8%, and ongoing control of inflammation remains important.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:37741608
    reference_title: 'Kidney Transplantation in Patients With AA Amyloidosis: Outcomes in a French Multicenter Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient survival rates were 94.0% (95% CI, 89.1-99.2) at 1 year and 85.5%
      (77.8-94.0) at 5 years after transplantation.
    explanation: >-
      Provides contemporary patient-survival outcomes after kidney transplantation in 86 patients across
      26 French centres.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Kidney transplantation is preferred in patients with kidney failure, and
      the recurrence of amyloidosis in the allograft has become rare as
      transplant recipients have started to benefit from the new agents.
    explanation: >-
      States the preference for transplantation and the modern rarity of allograft recurrence. Evidence
      source is OTHER because this is a review.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37741608
    reference_title: 'Kidney Transplantation in Patients With AA Amyloidosis: Outcomes in a French Multicenter Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Histologically proven AA amyloidosis recurrence occurred in 5 transplants (5.8%). An infection requiring
      hospitalization developed in 55.8% of cases
    explanation: >-
      Reports recurrence and infection in the selected transplant cohort; neither outcome proves that
      biologics caused the observed survival.
- name: Dialysis
  description: >-
    Hemodialysis or peritoneal dialysis supports patients with established kidney failure. Hypotension
    and concurrent cardiac or systemic disease can complicate care. Observational differences from transplant
    recipients are affected by selection and should not be treated as a randomized survival comparison.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Dialysis
    term:
      id: NCIT:C15221
      label: Dialysis
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dialysis modalities and kidney transplantation are both suitable for
      patients suffering from AA amyloidosis and kidney failure
    explanation: >-
      Establishes dialysis as an accepted renal replacement modality in AA amyloidosis. Evidence source
      is OTHER because this is a review.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Still, survival is poor among patients on dialysis, especially when cardiac
      involvement is prevalent
    explanation: >-
      The review reports poor dialysis outcomes, especially with cardiac involvement; treatment selection
      and comorbidity limit comparisons with transplant recipients.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Eprodisate (Investigational)
  description: >-
    A small molecule intended to interfere with amyloid–glycosaminoglycan interactions. In the initial
    183-patient randomized trial, the 24-month worsening proportions were 27% versus 40% (P=.06), while
    the prespecified time-to-event analysis favored eprodisate (HR 0.58, P=.02). Neither end-stage kidney
    disease nor mortality improved significantly, and there was no proteinuria or amyloid-load benefit.
    The 261-patient confirmatory trial failed its different renal composite endpoint (HR 1.0, 95% CI 0.7–1.4;
    P=.882 in 260 treated participants). These findings do not establish a clinically effective AA therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: SAA-Glycosaminoglycan Binding
    treatment_effect: INHIBITS
    description: >-
      The intended target is SAA–GAG interaction; recent recombinant-protein assays show only partial
      binding inhibition, not complete blockade or demonstrated clinical deposit removal.
  evidence:
  - reference: PMID:17554116
    reference_title: Eprodisate for the treatment of renal disease in AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eprodisate is a member of a new class of compounds designed to interfere
      with interactions between amyloidogenic proteins and glycosaminoglycans and
      thereby inhibit polymerization of amyloid fibrils and deposition of the
      fibrils in tissues.
    explanation: >-
      States intended pharmacologic action, not a measured demonstration of tissue-deposition inhibition
      in the clinical trial.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:17554116
    reference_title: Eprodisate for the treatment of renal disease in AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The drug had no significant effect on progression to end-stage renal
      disease (hazard ratio, 0.54; P=0.20) or risk of death (hazard ratio, 0.95;
      P=0.94).
    explanation: >-
      The initial trial did not demonstrate benefit on either individual hard endpoint; the paper does
      not establish a regulatory reason for nonapproval.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:17554116
    reference_title: Eprodisate for the treatment of renal disease in AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      At 24 months, disease was worsened in 24 of 89 patients who received eprodisate (27%) and 38 of
      94 patients given placebo (40%, P=0.06); the hazard ratio for worsening disease with eprodisate
      treatment was 0.58 (95% confidence interval, 0.37 to 0.93; P=0.02).
    explanation: >-
      Two prespecified analyses gave different significance results; both are retained.
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      which was not confirmed in a randomized control trial (NCT01215747)
    explanation: >-
      The review reports failure of the confirmatory trial; primary EU registry analysis gives HR 1.0,
      95% CI 0.7–1.4 and P=.882.
  - reference: PMID:39954777
    reference_title: 'Serum Amyloid A Binding to Glycosaminoglycans is Synergistic with Amyloid Formation: Therapeutic Targeting in the Inflammation-linked Amyloidosis.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      eprodisate only partially blocked heparin binding.
    explanation: >-
      Direct cell-free binding result qualifies the proposed mechanism.
- name: Treat the underlying infection
  description: >-
    Use pathogen-appropriate antimicrobial and source-directed treatment for infection-associated AA.
    Immunomodulation is selected according to the actual cause, not prescribed uniformly for every AA
    presentation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Anti-Infective Agent
      term:
        id: NCIT:C254
        label: Anti-Infective Agent
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      treatment options are tailored accordingly, with infections treated promptly with antimicrobials,
      and rheumatological and genetic autoinflammatory conditions treated with the appropriate anti-inflammatory
      therapies.
    explanation: >-
      AA-specific management review supports this intervention; treatment is individualized to renal status
      and underlying cause.
  target_mechanisms:
  - target: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
    treatment_effect: INHIBITS
    description: >-
      Treating a documented infection reduces its sustained inflammatory stimulus.
    evidence:
    - reference: PMID:38568326
      reference_title: 'AA Amyloidosis: A Contemporary View.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: >-
        treatment options are tailored accordingly, with infections treated promptly with antimicrobials,
        and rheumatological and genetic autoinflammatory conditions treated with the appropriate anti-inflammatory
        therapies.
      explanation: >-
        AA-specific management review supports this intervention; treatment is individualized to renal
        status and underlying cause.
- name: Antiproteinuric renin–angiotensin system blockade
  description: >-
    ACE inhibitors or ARBs can reduce nephrotic-range proteinuria when clinically tolerated, with assessment
    of kidney function, potassium and perfusion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE Inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: Angiotensin II Receptor Antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      In nephrotic syndrome or nephrotic-range proteinuria, angiotensin-converting enzyme inhibitors or
      angiotensin receptor blockers are the first choice of drugs with antiproteinuric properties
    explanation: >-
      AA-specific management review supports this intervention; treatment is individualized to renal status
      and underlying cause.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Proteinuria
    treatment_effect: INHIBITS
    description: >-
      Reduces urinary protein loss without directly removing amyloid deposits.
    evidence:
    - reference: PMID:38568326
      reference_title: 'AA Amyloidosis: A Contemporary View.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: >-
        In nephrotic syndrome or nephrotic-range proteinuria, angiotensin-converting enzyme inhibitors
        or
        angiotensin receptor blockers are the first choice of drugs with antiproteinuric properties
      explanation: >-
        AA-specific management review supports this intervention; treatment is individualized to renal
        status and underlying cause.
- name: Edema and volume management
  description: >-
    Dietary sodium reduction and loop diuretics address edema and hypervolemia, with treatment individualized
    to blood pressure and renal function.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

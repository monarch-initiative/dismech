      term:
        id: NCIT:C49184
        label: Loop Diuretic
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Loop diuretics are generally required to manage hypervolemia
    explanation: >-
      AA-specific management review supports this intervention; treatment is individualized to renal status
      and underlying cause.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Peripheral Edema
    treatment_effect: INHIBITS
    description: >-
      Diuresis and sodium management reduce fluid retention.
    evidence:
    - reference: PMID:38568326
      reference_title: 'AA Amyloidosis: A Contemporary View.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: >-
        Loop diuretics are generally required to manage hypervolemia
      explanation: >-
        AA-specific management review supports this intervention; treatment is individualized to renal
        status and underlying cause.
- name: Renal protection and organ-directed supportive care
  description: >-
    Avoid additional hypoperfusion and nephrotoxic injury; assess nutritional, lipid, thrombotic and other
    organ complications according to their clinical indications.
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      It is imperative to prevent further insults such as hypoperfusion or nephrotoxic drug use.
    explanation: >-
      The review explicitly includes prevention of secondary kidney injury.
  target_mechanisms:
  - target: Progressive Renal Functional Decline
    treatment_effect: MODULATES
    description: >-
      Avoiding secondary kidney insults may limit additional loss of function; it does not establish deposit
      clearance.
    evidence:
    - reference: PMID:38568326
      reference_title: 'AA Amyloidosis: A Contemporary View.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: >-
        It is imperative to prevent further insults such as hypoperfusion or nephrotoxic drug use.
      explanation: >-
        The review explicitly includes prevention of secondary kidney injury.
- name: Genetic and family counseling for an identified hereditary cause
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Counsel recurrence and offer family evaluation according to the identified cause. The rare SAA1 promoter
    form segregates dominantly; FMF and TRAPS have their own inheritance and prevention strategies, so
    a single AA recurrence risk is inappropriate.
  evidence:
  - reference: PMID:34560138
    reference_title: A mutation in the SAA1 promoter causes hereditary amyloid A amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      sustained elevation of serum amyloid A levels that segregated in an autosomal dominant pattern in
      12 genetically affected and in none of six genetically unaffected relatives
    explanation: >-
      Supports family evaluation for the reported promoter-associated form.
  - reference: PMID:20301405
    reference_title: Familial Mediterranean Fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Offer molecular genetic testing for the familial MEFV pathogenic variants to apparently asymptomatic
      older and younger at-risk sibs of an individual with FMF
    explanation: >-
      FMF-specific GeneReviews guidance supports identification of relatives who can benefit from early
      preventive treatment.
- name: Miridesap followed by dezamizumab (Investigational)
  description: >-
    SAP depletion followed by anti-SAP antibody was tested in mixed systemic amyloidosis. The 23-person
    phase 1 extension included two AA participants, each receiving only one dose; one had lower renal
    amyloid burden on scintigraphy, without demonstrated renal-function or proteinuria improvement through
    day 42. Neither AA participant had liver deposits. Later cardiac studies enrolled no AA participants
    and were stopped for lack of efficacy and a serious vasculitis event. These data do not establish
    routine AA use or an AA-specific contraindication.
  target_mechanisms:
  - target: Progressive Multi-Organ Amyloid Accumulation
    treatment_effect: INHIBITS
    description: >-
      Experimental removal of SAP-bearing amyloid deposits; clinical benefit in AA remains unproven.
  evidence:
  - &id002
    reference: PMID:29298867
    reference_title: Repeat doses of antibody to serum amyloid P component clear amyloid deposits in patients with systemic amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-

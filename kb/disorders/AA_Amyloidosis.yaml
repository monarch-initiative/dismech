notes: >-
  AA amyloidosis has no disease-wide GeneReviews chapter. GeneReviews chapters for FMF and TRAPS address
  specific upstream causes and do not replace AA-specific diagnosis and management sources. The rare hereditary
  SAA1 promoter form is included separately from common coding susceptibility variants. Renal cohort percentages
  retain their selected population and follow-up context; gastrointestinal involvement is not used as
  a diarrhea denominator. The obesity report lists 146 patients but its reported subgroups sum to 148;
  no pooled proportion is computed. Thyroid/adrenal deposition alone does not establish endocrine failure.
  Full-text review distinguishes optional GAG amplification from indispensable nucleation, and deposit
  fragment composition from an obligatory cleavage-before-assembly sequence. The 2024 review inaccurately
  summarizes the anti-SAP stopping history; the primary 2018 and 2022 reports show no fatal arrhythmia
  and distinguish two single-dose AA participants from later ATTR/AL cardiac studies. The confirmatory
  eprodisate registry contains irregular event-time table cells; only its explicit endpoint and prespecified
  HR/log-rank analysis are used. No exact HPO term was selected for nonspecific gastric polyps or esophageal
  dysmotility; narrower polyposis or structural terms would overstate the source.

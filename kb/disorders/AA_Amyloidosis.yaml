genetic:
- name: SAA1
  notes: >-
    SAA1 encodes serum amyloid A1, the dominant fibril-forming precursor isoform
    in AA deposits. Its common coding polymorphisms (the SAA1.1/alpha, SAA1.3,
    and SAA1.5/gamma isoforms, differing at codons 52 and 57) are the strongest
    documented genetic modifier of amyloidosis risk among patients with an
    equivalent inflammatory burden. This is a susceptibility locus, not a causal
    gene: SAA1 genotype does not cause disease without a chronic inflammatory
    driver.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: SAA1
    term:
      id: hgnc:10513
      label: SAA1
  evidence:
  - reference: PMID:12687559
    reference_title: "The contribution of genotypes at the MEFV and SAA1 loci to amyloidosis and disease severity in patients with familial Mediterranean fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the presence of the SAAalpha/alpha genotype (OR 2.99, 95% CI 1.47-6.09)
    explanation: >-
      Quantifies the independent association of the amyloidogenic SAA1
      alpha/alpha genotype with renal amyloidosis in a 277-patient FMF cohort.
  - reference: PMID:29364741
    reference_title: "Obesity is a significant susceptibility factor for idiopathic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, the SAA1 polymorphism was confirmed as a susceptibility factor for
      AA amyloidosis irrespective of the type of the disease.
    explanation: >-
      Confirms SAA1 polymorphism as a susceptibility factor across trigger
      diseases, supporting the SUSCEPTIBILITY relationship type.
  - reference: PMID:18815155
    reference_title: "Increased susceptibility of serum amyloid A 1.1 to degradation by MMP-1: potential explanation for higher risk of type AA amyloidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results may explain the higher risk of amyloidosis in patients with a
      SAA1.1/1.1 genotype vs SAA1.5/1.5 or SAA1.1/1.5 genotype.
    explanation: >-
      Provides the mechanistic basis for the SAA1 risk association, namely
      isoform-dependent susceptibility to MMP-1 cleavage, linking the
      susceptibility locus to the proteolytic-processing pathophysiology node.
      Evidence source is IN_VITRO (immunoblotting and MALDI-TOF of recombinant
      isoforms).
- name: MEFV
  notes: >-
    MEFV encodes pyrin and is the causal gene of familial Mediterranean fever,
    the single most important monogenic upstream trigger of AA amyloidosis
    worldwide. It contributes to AA amyloidosis indirectly, by determining the
    severity and persistence of the inflammatory drive; homozygosity for
    p.Met694Val carries the highest amyloidosis risk (odds ratio 4.27, 95% CI
    2.01-9.07 in the cited FMF cohort). Colchicine adherence markedly modifies
    this genetic risk, making it one of the clearest gene-environment
    interactions in the disease.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: MEFV
    term:
      id: hgnc:6998
      label: MEFV
  evidence:
  - reference: PMID:12687559
    reference_title: "The contribution of genotypes at the MEFV and SAA1 loci to amyloidosis and disease severity in patients with familial Mediterranean fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Logistic regression analysis showed that homozygosity for the M694V allele
    explanation: >-
      Identifies M694V homozygosity as independently associated with renal
      amyloidosis in a 277-patient FMF cohort; the same sentence reports the
      odds ratio of 4.27 (95% CI 2.01-9.07), the strongest single MEFV genotype
      association.
  - reference: PMID:12687559
    reference_title: "The contribution of genotypes at the MEFV and SAA1 loci to amyloidosis and disease severity in patients with familial Mediterranean fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, disease severity and the development of amyloidosis in FMF are
      differentially affected by genetic variations within and outside the MEFV
      gene.
    explanation: >-
      The authors' conclusion that MEFV variation contributes to amyloidosis

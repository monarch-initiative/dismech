- name: Adipose Serum Amyloid A Production
  description: >-
    Human adipocytes express SAA1/SAA2 and adipose SAA secretion correlates with adiposity. This offers
    a plausible additional precursor source in obesity-associated idiopathic AA amyloidosis; the adipocyte
    study did not test amyloid deposition or establish adipose dominance during severe systemic inflammation.
  role: amplifier
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:16737350
    reference_title: 'Acute-phase serum amyloid A: an inflammatory adipokine and potential link between obesity and its metabolic complications.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      A-SAA mRNA levels and A-SAA secretion from adipose tissue were significantly correlated with body
      mass index (r = 0.47; p = 0.028 and r = 0.80; p = 0.0002, respectively).
    explanation: >-
      Human tissue expression and secretion measurements support adipose precursor production; the participants
      were not an AA amyloidosis cohort.
  cell_types:

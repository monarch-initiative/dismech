    explanation: >-
      Links the quantitative glomerular amyloid burden to renal prognosis,
      supporting a dose-dependent barrier-disruption mechanism.
  downstream:
  - target: Progressive Kidney Failure
    causal_link_type: DIRECT
    description: >-
      Sustained proteinuria and nephron loss drive progressive decline in

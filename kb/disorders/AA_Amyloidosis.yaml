name: AA Amyloidosis
creation_date: "2026-08-08T00:00:00Z"
category: Complex
disease_term:
  preferred_term: AA amyloidosis
  term:
    id: MONDO:0019439
    label: AA amyloidosis
parents:
- Amyloidosis
description: >-
  Systemic AA amyloidosis is an acquired systemic amyloidosis that complicates
  long-standing inflammatory, autoinflammatory, or chronic infectious disease. It
  is the one systemic amyloidosis whose amyloidogenic precursor is not a mutant
  or clonal protein but a normal acute-phase reactant present in excess:
  cytokine-driven (principally interleukin-6-driven) hepatic overproduction of
  serum amyloid A protein (SAA) sustains a chronically high plasma SAA
  concentration, from which proteolytically processed, C-terminally truncated
  fragments misfold into cross-beta amyloid fibrils and deposit extracellularly.
  Because the precursor is supplied by inflammation rather than by a genetic
  lesion in the precursor itself, the disease is both preventable and partly
  reversible: durable suppression of SAA halts deposition and can permit
  regression of existing deposits. The clinical picture is dominated by renal
  involvement - proteinuria progressing to nephrotic syndrome and end-stage
  kidney disease - with hepatic, splenic, adrenal, and gastrointestinal
  deposition also common. Cardiac involvement, peripheral neuropathy, and
  macroglossia, prominent in AL amyloidosis, are comparatively uncommon in AA and
  are useful discriminators.
synonyms:
- secondary amyloidosis
- reactive systemic amyloidosis
- inflammatory amyloidosis
- amyloid A amyloidosis
- serum amyloid A amyloidosis

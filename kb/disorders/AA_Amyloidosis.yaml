      In AA amyloidosis, the expression of cytokines, particularly interleukin 6,
      leads to overproduction of serum amyloid A (SAA) by the liver.
    explanation: >-
      Names IL-6 as the principal cytokine driving hepatic SAA overproduction,
      the amplifier step. Evidence source is OTHER because this is a review.
  - reference: PMID:16737350
    reference_title: "Acute-phase serum amyloid A: an inflammatory adipokine and potential link between obesity and its metabolic complications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that A-SAA was highly and selectively expressed in human
      adipocytes.
    explanation: >-
      Establishes adipose tissue as an additional, extrahepatic source of
      acute-phase SAA. Marked PARTIAL because the study characterizes SAA biology
      in obesity and does not itself study amyloidosis.
  downstream:
  - target: Sustained Elevation of Circulating Serum Amyloid A
    causal_link_type: DIRECT
    description: >-
      Unremitting hepatic (and adipose) SAA output raises and holds the plasma
      SAA concentration far above its physiological baseline.
- name: Sustained Elevation of Circulating Serum Amyloid A
  description: >-
    The amyloidogenic precursor of this disease. Unlike AL (a clonal light chain)
    or ATTR (a destabilized or wild-type transthyretin), the AA precursor is a
    structurally normal protein whose only abnormality is chronic excess.
    Prolonged rather than transient elevation is the rate-limiting requirement:
    the concentration-duration product, not any single peak, determines
    amyloidogenic risk. This node is the disease's therapeutic target, and the
    quantitative relationship between achieved SAA level and outcome is the
    best-documented dose-response in systemic amyloidosis.
  conforms_to: amyloidogenesis#Amyloidogenic Precursor Protein
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein folding

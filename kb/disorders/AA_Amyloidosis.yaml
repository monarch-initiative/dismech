- name: SAA2
  notes: >-
    SAA2 is the second inducible acute-phase SAA isoform, encoded adjacent to
    SAA1 on chromosome 11p15.1, and is likewise associated with AA amyloidosis -
    although SAA1 is the isoform that predominates in the deposits themselves.
    Curated here to make the locus explicit rather than leaving the SAA gene
    cluster represented by SAA1 alone; SAA3 is a pseudogene and SAA4 is
    constitutively expressed and non-acute-phase, so neither is curated.
  relationship_type: SUSCEPTIBILITY

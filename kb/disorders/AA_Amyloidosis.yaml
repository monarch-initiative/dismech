    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amyloid A (AA) amyloidosis is a complication of chronic inflammatory
      conditions that develops when proteolytic fragments of serum amyloid A
      protein (SAA) are deposited in tissues as amyloid fibrils.
    explanation: >-
      Establishes that it is proteolytic fragments of SAA, not the intact
      protein, that form the deposited fibrils.
  - reference: PMID:29288051
    reference_title: "Acceleration of amyloid fibril formation by carboxyl-terminal truncation of human serum amyloid A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although the full-length SAA is 104 amino acids long, the
      C-terminal-truncated SAA lacking mainly residues 77-104 is predominantly
      deposited in AA amyloidosis.
    explanation: >-
      Identifies the specific truncated species that predominates in deposits,
      defining the processed form that misfolds. Evidence source is IN_VITRO
      (recombinant peptide biophysics).
  - reference: PMID:29288051
    reference_title: "Acceleration of amyloid fibril formation by carboxyl-terminal truncation of human serum amyloid A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Circular dichroism (CD) measurements demonstrated that the C-terminal
      truncation induces a reduced α-helical structure of the SAA molecule.
    explanation: >-
      Direct biophysical evidence that truncation destabilizes the native fold,
      the conformational conversion this node describes.
  downstream:
  - target: Glycosaminoglycan-Assisted Fibril Nucleation and Extracellular Deposition
    causal_link_type: DIRECT
    description: >-
      Misfolded beta-sheet species are the monomeric input to nucleation and
      fibril elongation.
- name: Glycosaminoglycan-Assisted Fibril Nucleation and Extracellular Deposition
  description: >-
    The central effector and rate-limiting convergence step. Misfolded SAA
    fragments nucleate and elongate into insoluble cross-beta amyloid fibrils
    that deposit in the extracellular space. Heparan sulfate is a potent amyloid
    agonist here rather than a passive co-deposit: it remodels HDL-associated SAA
    at mildly acidic pH, induces non-native beta-sheet, and binds synergistically
    to forming amyloid. Serum amyloid P component binds and stabilizes the
    deposits against clearance. This accessory-molecule dependence is the
    rationale for eprodisate and for anti-SAP strategies, and it is the node that
    conforms to the shared amyloidogenesis module.
  conforms_to: amyloidogenesis#Amyloid Fibril Formation and Extracellular Deposition
  role: central_effector
  biological_scale: MOLECULAR

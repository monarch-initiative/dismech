- category: Constitutional
  name: Peripheral Edema
  description: >-
    Edema can accompany nephrotic protein loss and hypervolemia.
  phenotype_term:
    preferred_term: Edema
    term:
      id: HP:0000969
      label: Edema
  evidence:
  - reference: url:https://amyloid.nl/Files/Dember%20Eprodisate%20New%20England.pdf
    reference_title: https://amyloid.nl/Files/Dember%20Eprodisate%20New%20England.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Classification as nephrotic required a 24-hour urinary excretion of more than 3 g of protein, a
      serum albumin concentration of less than 3.4 g per deciliter, and either the presence of peripheral
      edema or the use of diuretics to treat peripheral edema.
    explanation: >-
      The AA trial explicitly defined the nephrotic stratum using low albumin and edema or its treatment.
      This supports the feature in that clinical context without a whole-disease frequency.

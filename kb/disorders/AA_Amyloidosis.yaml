has_subtypes:
- name: Inflammation-associated AA amyloidosis
  description: >-
    The common presentation complicates chronic infectious, inflammatory or autoinflammatory disease with
    persistent SAA production.
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Even though any disorder causing sustained inflammation may increase the risk of AA amyloidosis,
      chronic infections and inflammatory arthritis are the commonest causes
    explanation: >-
      Defines the common etiologic presentation.
- name: Idiopathic AA amyloidosis
  description: >-
    No overt inflammatory cause is identified after evaluation. This category can include unrecognized
    genetic or environmental contributors and should not be assumed to be uniformly obesity-driven.
  evidence:
  - reference: PMID:38568326
    reference_title: 'AA Amyloidosis: A Contemporary View.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      A substantial proportion of cases (up to 20%) appear to develop AA amyloidosis in the absence of
      overt inflammation and thus labeled idiopathic
    explanation: >-
      Describes an etiologic classification, not a distinct fibril precursor.
- name: Hereditary SAA1 promoter-associated AA amyloidosis
  description: >-
    A rare autosomal dominant promoter variant produces sustained SAA elevation and systemic AA deposition
    without the usual inflammatory cause.
  evidence:
  - reference: PMID:34560138
    reference_title: A mutation in the SAA1 promoter causes hereditary amyloid A amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Here we describe a family with primary amyloid A amyloidosis due to a chr11:18287683 T>C (human
      genome version19) mutation in the SAA1 promoter linked to the amyloidogenic SAA1.1 haplotype.
    explanation: >-
      Identifies the rare regulatory hereditary cause.
inheritance:
- name: Autosomal dominant in the rare SAA1 promoter-associated form
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    This inheritance applies to the reported promoter-associated family. Most AA amyloidosis is an acquired
    complication; inheritance of an upstream autoinflammatory disease must be counseled according to that
    disease.

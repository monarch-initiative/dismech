    reference_title: "AA amyloidosis: pathogenesis and targeted therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Central to amyloid formation is an increase in the frequency of the β-sheet
      structure, leading to hydrogen bonding between misfolded monomers and
      creating a fibril that is comparably resistant to degradation.
    explanation: >-
      Describes the beta-sheet fibril assembly and its protease resistance, the
      central effector step. Evidence source is OTHER because this is a review.
  - reference: PMID:19549924
    reference_title: "Heparan sulfate promotes the aggregation of HDL-associated serum amyloid A: evidence for a proamyloidogenic histidine molecular switch."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HS causes the remodeling of HDL-SAA at mildly acidic pH, producing SAA-rich
      aggregates.
    explanation: >-
      Direct evidence that heparan sulfate actively promotes conversion of
      HDL-borne SAA into aggregates, supporting the glycosaminoglycan-assisted
      mechanism. Evidence source is IN_VITRO (biochemical and cell-culture
      assays).
  - reference: PMID:39954777
    reference_title: "Serum Amyloid A Binding to Glycosaminoglycans is Synergistic with Amyloid Formation: Therapeutic Targeting in the Inflammation-linked Amyloidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HS/heparin can promote amyloidogenesis by inducing non-native β-sheet and
      apparently causing liquid droplet formation in SAA in solution.
    explanation: >-
      Contemporary biophysical evidence that heparan sulfate induces the
      non-native beta-sheet conformation feeding fibril formation. Evidence

- name: SAA Proteolytic Cleavage
  description: >-
    AA deposits contain truncated SAA species, and MMP-1 cleaves SAA isoforms differently in vitro. These
    observations do not establish that MMP-1 is the relevant human enzyme or that cleavage must precede
    fibril assembly.
  role: amplifier
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:18815155
    reference_title: 'Increased susceptibility of serum amyloid A 1.1 to degradation by MMP-1: potential explanation for higher risk of type AA amyloidosis.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      We found that SAA1.5 is more resistant to degradation by MMP-1 than SAA1.1. This difference is caused
      by the capacity of MMP-1 to cleave at the site of the polymorphism at position 57.
    explanation: >-
      Immunoblotting and mass spectrometry demonstrate isoform-dependent MMP-1 cleavage in vitro; this
      does not establish the rate-limiting protease or cleavage sequence in patients.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1087940/
    reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism - PMC'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      The MS analyses showed that SAA is C-terminally trimmed in the amyloid fibrils. Whether precleavage is
      necessary for recruitment of SAA to the fibril template or it occurs after its association to the amyloid
      is not known.
    explanation: >-
      Mass spectrometry of extracted mouse AA deposits supports truncation, while the authors explicitly leave
      the timing of cleavage unresolved. It does not identify MMP-1 as the tissue protease.

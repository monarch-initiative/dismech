environmental:
- name: Obesity and adipose-derived serum amyloid A
  description: >-
    Obesity is an independently identified susceptibility factor for idiopathic
    AA amyloidosis, meaning cases with no classical inflammatory trigger. The
    proposed mechanism is direct rather than merely correlative: adipocytes are
    themselves a major site of acute-phase SAA expression, so adipose mass
    supplies precursor and sustains low-grade systemic inflammation independently
    of the hepatic acute-phase response. This is the plausible explanation for a
    substantial share of idiopathic disease in an ageing, increasingly obese
    population.
  effect: Increases risk of idiopathic AA amyloidosis
  evidence:
  - reference: PMID:29364741
    reference_title: "Obesity is a significant susceptibility factor for idiopathic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Obesity, age and the SAA1 polymorphism are susceptibility factors for
      idiopathic AA amyloidosis.
    explanation: >-
      Directly states obesity as a susceptibility factor for idiopathic AA
      amyloidosis in a 146-patient study with two control groups.
  influences_mechanisms:
  - target: IL-6-Driven Hepatic Acute-Phase Response
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Adipose tissue contributes acute-phase SAA and pro-inflammatory cytokines,
      adding to the systemic precursor supply modelled at this node even without
      a classical inflammatory disease.
    evidence:
    - reference: PMID:16737350
      reference_title: "Acute-phase serum amyloid A: an inflammatory adipokine and potential link between obesity and its metabolic complications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A-SAA mRNA levels and A-SAA secretion from adipose tissue were
        significantly correlated with body mass index (r = 0.47; p = 0.028 and r
        = 0.80; p = 0.0002, respectively).
      explanation: >-
        Quantifies the correlation between adiposity and adipose SAA output,
        supporting the route by which obesity feeds the acute-phase precursor
        node.
biochemical:
- name: Serum Amyloid A
  notes: >-
    The circulating precursor protein, and the disease's single most important
    biomarker. It is unusual among biomarkers in being the pathogenic substrate
    itself rather than a downstream correlate, which is why treatment is titrated
    to SAA rather than to symptoms. Sustained suppression below roughly 10 mg/L
    is associated with amyloid regression; levels below 4 mg/L with a relatively
    favourable outcome.
  presence: INCREASED
  evidence:
  - reference: PMID:17554117
    reference_title: "Natural history and outcome in systemic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The effects of renal dysfunction dominate the course of AA amyloidosis,
      which is associated with a relatively favorable outcome in patients with
      SAA concentrations that remain in the low-normal range (<4 mg per liter).
    explanation: >-
      Establishes the prognostic threshold that makes SAA an actionable
      treat-to-target biomarker.
  - reference: PMID:26120866
    reference_title: "Therapeutic blockade of interleukin-6 by tocilizumab in the management of AA amyloidosis and chronic inflammatory disorders: a case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main aim of treatment is to suppress inflammation thereby inhibiting
      serum amyloid A protein (SAA), which is the precursor of AA amyloid
      fibrils, to prevent or halt amyloid deposition.
    explanation: >-
      States explicitly that SAA is both the fibril precursor and the treatment
      target, the dual role this biochemical entry records.
histopathology:
- name: Congo Red-Positive Amyloid Deposition
  description: >-
    Acellular Congo red-positive extracellular deposits showing apple-green
    birefringence under polarized light. This confirms amyloid but does not
    identify the precursor; typing is a separate and mandatory step.
  diagnostic: true
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  evidence:
  - reference: PMID:28828707
    reference_title: "Pathology and diagnosis of renal non-AL amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal amyloidosis is characterized by acellular Congo red positive deposits
      in the glomeruli, interstitium and/or arteries.
    explanation: >-
      Defines the Congo red-positive histological finding and its renal
      distribution.
- name: Glomerular-Predominant Deposition Pattern
  description: >-
    Amyloid deposits are distributed within the glomerulus in mesangial
    segmental, mesangial nodular, mesangiocapillary, or hilar patterns. A
    glomerular form predominates over a purely vascular form, and this
    distinction determines the clinical presentation, with proteinuria dominating
    the glomerular form.
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  evidence:
  - reference: PMID:17714761
    reference_title: "Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The distribution pattern of glomerular amyloid deposits was mesangial
      segmental (14.7%), mesangial nodular (26.5%), mesangiocapillary (32.3%),
      and hilar (26.5%). Glomerular form was observed in 80.9% of cases and
      vascular form in 19.1%.
    explanation: >-
      Quantifies the glomerular deposition patterns and the
      glomerular-to-vascular ratio in a 68-case renal AA series.
- name: Amyloid-Associated Giant Cell and Inflammatory Reaction
  description: >-
    A local inflammatory reaction to the deposits themselves - multinucleated
    giant cells and glomerular inflammatory infiltrate, sometimes with crescents
    - is present in a substantial minority of biopsies. The authors propose it
    reflects an immune response directed against AA fibrils that may contribute
    to amyloid resolution, which is mechanistically interesting because
    macrophage-mediated clearance is exactly the effector arm exploited by
    anti-SAP antibody therapy.
  finding_term:
    preferred_term: amyloid deposition
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  evidence:
  - reference: PMID:17714761
    reference_title: "Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AA amyloidosis-related inflammation was noted in 30 patients (44.1%) and
      appeared as a multinucleated giant cell reaction (27.9%) or a glomerular
      inflammatory infiltrate (25%), including glomerular crescents (17.6%).
    explanation: >-
      Quantifies the amyloid-associated inflammatory reaction and its giant-cell
      component in the same 68-case series.
diagnosis:
- name: Tissue Biopsy with Amyloid Typing
  description: >-
    Histopathological demonstration of amyloid is the diagnostic gold standard,
    but Congo red positivity alone is insufficient - the fibril protein must be
    typed. Immunohistochemistry with anti-AA antibody, or laser microdissection
    with mass spectrometry where available, distinguishes AA from AL, ATTR, and
    the rarer hereditary types. Getting this wrong has direct therapeutic
    consequences, since AL requires anti-plasma-cell therapy and AA requires
    suppression of inflammation.
  evidence:
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Histopathological examination is the gold standard of diagnosis, but
      magnetic resonance imaging can be used to detect cardiac involvement.
    explanation: >-
      Establishes histopathology as the diagnostic gold standard. Evidence source
      is OTHER because this is a review.
  - reference: PMID:28828707
    reference_title: "Pathology and diagnosis of renal non-AL amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      accurate typing of non-AL amyloidosis then requires immunohistochemical or
      laser microdissection/mass spectrometry studies of the Congo red positive
      deposits
    explanation: >-
      States the requirement for immunohistochemical or mass-spectrometric typing
      beyond Congo red staining.
- name: Serum Amyloid A and C-Reactive Protein Monitoring
  description: >-
    Serial measurement of SAA (with CRP as a widely available surrogate) is used
    both to stratify risk in patients with known inflammatory disease and to
    titrate therapy. Because the treat-to-target threshold is defined
    numerically, this is a monitoring test with a therapeutic decision attached
    rather than a purely diagnostic one.
  evidence:
  - reference: PMID:17554117
    reference_title: "Natural history and outcome in systemic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SAA concentration was measured serially, and the amyloid burden was
      estimated with the use of whole-body serum amyloid P component
      scintigraphy.
    explanation: >-
      Documents serial SAA measurement (alongside SAP scintigraphy) as the
      monitoring strategy in the definitive natural-history cohort.
differential_diagnoses:
- name: Systemic AL Amyloidosis
  description: >-
    The other major systemic amyloidosis and the principal differential. AL is a
    clonal plasma-cell disorder whose precursor is a monoclonal immunoglobulin
    light chain; AA's precursor is a normal acute-phase protein present in
    excess. The distinction is not academic - AL requires anti-plasma-cell
    therapy while AA requires suppression of inflammation - and it cannot be made
    on Congo red staining alone.
  disease_term:
    preferred_term: primary systemic amyloidosis
    term:
      id: MONDO:0017816
      label: primary systemic amyloidosis
  distinguishing_features:
  - Cardiac involvement, peripheral neuropathy, carpal tunnel syndrome, and
    macroglossia are common in AL and comparatively uncommon in AA.
  - Renal involvement dominates the clinical course of AA amyloidosis.
  - AL shows light-chain restriction on immunofluorescence, whereas Congo red
    positivity with negative immunofluorescence points to a non-AL type.
  - A detectable monoclonal protein does not by itself establish AL, since
    monoclonal gammopathy is common in the affected age group.
  evidence:
  - reference: PMID:28828707
    reference_title: "Pathology and diagnosis of renal non-AL amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The detection of Congo red positive deposits coupled with negative
      immunofluorescence studies is highly suggestive of non-AL amyloidosis.
    explanation: >-
      Provides the immunofluorescence-based discriminator between AL and non-AL
      (including AA) renal amyloidosis.
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While cardiac infiltration is extensively documented in various amyloidosis
      types, it is a relatively rare cause of heart failure in AA amyloidosis
    explanation: >-
      Supports the single most useful clinical discriminator recorded above: a
      patient with systemic amyloidosis and heart failure is far more likely to
      have AL or ATTR than AA. Evidence source is OTHER because this is a review.
progression:
- phase: Subclinical amyloid deposition
  notes: >-
    Amyloid accumulates during years to decades of uncontrolled inflammation
    before any renal abnormality is detectable. This is the window in which
    surveillance of at-risk patients (established FMF, other periodic fever
    syndromes, long-standing inflammatory arthritis) by urinalysis and SAA can
    change the outcome.
  evidence:
  - reference: PMID:25387054
    reference_title: "AA amyloidosis: pathogenesis and targeted therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, AA amyloidosis can be thought of as a consequence of
      long-standing inflammatory disease.
    explanation: >-
      Supports a prolonged latent phase driven by long-standing inflammation
      preceding clinical presentation. Evidence source is OTHER (review).
- phase: Proteinuric and nephrotic phase
  notes: >-
    Proteinuria appears and progresses to nephrotic-range, with nephrotic
    syndrome in roughly two-thirds and renal insufficiency in three-quarters of
    patients in biopsy-based series.
  evidence:
  - reference: PMID:17714761
    reference_title: "Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nephrotic syndrome and renal insufficiency were noted in 63.1% and 75% of
      patients, respectively.
    explanation: >-
      Quantifies the proteinuric and nephrotic phase in a renal AA amyloidosis
      series.
- phase: Amyloid storm (rare acute FMF-associated variant)
  notes: >-
    A minority of FMF patients depart from the indolent course entirely and
    present with an acute illness: heavy proteinuria, high inflammatory markers,
    and progression to kidney failure within weeks rather than years, typically
    precipitated by a superimposed infection. Curated as a distinct trajectory
    rather than a severity grade, because the timescale (weeks) and the
    infection trigger are qualitatively different from the usual course.
  evidence:
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While the majority of cases follow an indolent course, a subset of
      individuals with FMF might undergo acute illness, marked by substantial
      proteinuria, elevated inflammatory markers, and rapid progression to kidney
      failure within weeks.
    explanation: >-
      Defines the amyloid storm presentation and contrasts it with the indolent
      majority course. Evidence source is OTHER because this is a review.
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These infrequent instances are named “amyloid storm,” which is thought to
      be precipitated by superimposed infections or other triggering events
    explanation: >-
      Names the entity and its precipitating trigger. Evidence source is OTHER
      because this is a review.
- phase: Progressive renal decline to end-stage kidney disease
  notes: >-
    Untreated, creatinine clearance falls at roughly 15 mL/min/1.73 m2 per year -
    the placebo-arm rate in the eprodisate trial, which is the best available
    quantitative natural-history benchmark. Median survival after diagnosis in
    the era before widespread biologic therapy was 133 months.
  evidence:
  - reference: PMID:17554116
    reference_title: "Eprodisate for the treatment of renal disease in AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean rates of decline in creatinine clearance were 10.9 and 15.6 ml per
      minute per 1.73 m(2) of body-surface area per year in the eprodisate and
      the placebo groups, respectively (P=0.02).
    explanation: >-
      The placebo arm provides the quantitative rate of untreated renal decline
      cited for this phase.
  - reference: PMID:17554117
    reference_title: "Natural history and outcome in systemic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median survival after diagnosis was 133 months
    explanation: >-
      Provides the median survival benchmark for the progressive phase.
treatments:
- name: Colchicine (Familial Mediterranean Fever)
  description: >-
    First-line and foundational therapy for FMF, suppressing the inflammatory
    attacks that drive SAA production and thereby preventing amyloidosis. In
    patients who already have established amyloid nephropathy, the therapeutic
    dose is above 1.5 mg/day and efficacy depends critically on starting before
    renal function is lost - the effect is confined to patients whose serum
    creatinine is still below 1.5 mg/dL. This is the clearest demonstration in
    the disease that treatment timing, not just treatment choice, determines
    outcome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: colchicine
      term:
        id: CHEBI:23359
        label: colchicine
  target_mechanisms:
  - target: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
    treatment_effect: INHIBITS
    description: >-
      Suppressing FMF inflammatory attacks removes the cytokine drive at the
      trigger node, preventing the downstream acute-phase SAA surge.
  evidence:
  - reference: PMID:7986228
    reference_title: "Colchicine treatment of AA amyloidosis of familial Mediterranean fever. An analysis of factors affecting outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The therapeutic dosage of colchicine for amyloidosis of FMF is > 1.5
      mg/day. This dosage is effective only in patients with initial serum
      creatinine levels < 1.5 mg/dl.
    explanation: >-
      Defines both the effective colchicine dose and the renal-function window
      within which it works, in 68 FMF patients with amyloidosis followed at
      least 5 years.
  - reference: PMID:7986228
    reference_title: "Colchicine treatment of AA amyloidosis of familial Mediterranean fever. An analysis of factors affecting outcome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the end of the study period, kidney disease had worsened in 31 patients
      and remained stable in 22. Proteinuria had regressed in 15 patients.
    explanation: >-
      Documents stabilization or regression of proteinuria in a substantial share
      of colchicine-treated patients. Marked PARTIAL because this is an
      uncontrolled retrospective series without a comparator arm, and disease
      still worsened in the largest single group.
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a study examining 960 patients with FMF without evidence of amyloidosis
      at baseline, the cumulative rate of proteinuria after 11 years was reported
      as 1.7% in colchicine-compliant patients while 48.9% in the non-compliants
    explanation: >-
      The strongest available prevention signal in this disease: a roughly
      29-fold difference in 11-year cumulative proteinuria between
      colchicine-compliant and non-compliant FMF patients, which is what
      justifies colchicine as prophylaxis rather than only as rescue therapy.
      Evidence source is OTHER because the figures are reported in a review
      summarizing the primary cohort.
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, evidence for its efficacy in AA amyloidosis due to causes other
      than FMF is still quite limited
    explanation: >-
      Records the scope limit deliberately encoded in this treatment's name:
      colchicine's evidence base is FMF-specific and should not be generalized to
      AA amyloidosis from other triggers. Evidence source is OTHER (review).
- name: Anti-TNF-alpha Therapy
  description: >-
    TNF inhibitors (infliximab, etanercept, adalimumab) treat AA amyloidosis by
    controlling the underlying inflammatory arthropathy, and are the mainstay for
    the rheumatoid-arthritis and spondyloarthritis-driven disease that accounts
    for much of the Western caseload. Results are more mixed than with IL-6
    blockade - in a head-to-head retrospective comparison tocilizumab was
    superior for lowering SAA and improving kidney function - and, as with
    colchicine, benefit depends on starting before renal function is lost.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_mechanisms:
  - target: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
    treatment_effect: INHIBITS
    description: >-
      Neutralizing TNF-alpha suppresses the inflammatory arthropathy at the
      trigger node, reducing the cytokine drive to hepatic SAA production.
  evidence:
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      In a retrospective series including 15 patients treated with anti-TNF,
      amyloidosis progressed in seven patients (46.7%), stabilized in five
      (33.3%), and regression of proteinuria occurred in three (20%) in 10
      months
    explanation: >-
      Quantifies outcomes on anti-TNF therapy. Marked PARTIAL deliberately:
      amyloidosis still progressed in the largest single group, so this series
      does not establish efficacy. Evidence source is OTHER because the figures
      are reported in a review summarizing the primary series.
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in a multicenter study in which 36 patients with AA amyloidosis treated
      with anti-TNF therapy were followed prospectively for 5 years, > 50%
      decrease in proteinuria was observed in more than half of the patients
    explanation: >-
      The stronger of the two datasets - prospective, multicentre, 5-year
      follow-up - showing a substantial proteinuria response in the majority.
      Evidence source is OTHER because the figures are reported in a review
      summarizing the primary study.
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      a retrospective analysis including 42 patients with AA amyloidosis
      demonstrated that tocilizumab was superior to anti-TNFs in terms of
      obtaining a decrease in SAA, improvement in kidney function, and
      suppression of the disease activity
    explanation: >-
      Records the comparative result that places anti-TNF below IL-6 blockade on
      the biochemical and renal endpoints, which is why this entry does not
      present anti-TNF as first choice. Marked PARTIAL because it is a
      retrospective, non-randomized comparison. Evidence source is OTHER
      (review).
- name: Interleukin-6 Receptor Blockade (Tocilizumab)
  description: >-
    Tocilizumab blocks the IL-6 receptor and so acts directly on the cytokine
    that drives hepatic SAA production - mechanistically the most targeted of the
    available anti-inflammatory options, since it inhibits the exact signalling
    axis that supplies the precursor. SAA falls within days and amyloid deposits
    regress or stabilize. Infection is the predominant adverse effect.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: IL-6-Driven Hepatic Acute-Phase Response
    treatment_effect: INHIBITS
    description: >-
      IL-6 receptor blockade removes the principal signal inducing hepatocyte SAA
      transcription, collapsing precursor supply at the amplifier node.
  evidence:
  - reference: PMID:26120866
    reference_title: "Therapeutic blockade of interleukin-6 by tocilizumab in the management of AA amyloidosis and chronic inflammatory disorders: a case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-cohort median pre-treatment SAA fell from 70 to 4 mg/L within 10 days
      of the first dose; this response has been maintained over an on-treatment
      follow-up period of 23 months (p<0.0001). AA amyloid deposits either
      regressed or remained stable.
    explanation: >-
      Directly demonstrates rapid, sustained SAA suppression and amyloid
      regression or stabilization on IL-6 blockade, validating the acute-phase
      node as the drug target.
  - reference: PMID:26120866
    reference_title: "Therapeutic blockade of interleukin-6 by tocilizumab in the management of AA amyloidosis and chronic inflammatory disorders: a case series and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This small series shows that in patients with treatment-refractory chronic
      inflammatory conditions TCZ can be effective in suppressing inflammation,
      and in those with AA amyloidosis, can lead to regression of amyloid
      deposits.
    explanation: >-
      The authors' own conclusion, recorded with its stated limitation. Marked
      PARTIAL because this is an uncontrolled 20-patient case series, of whom 70%
      had AA amyloidosis, and the authors call for longer follow-up.
  - reference: PMID:41670232
    reference_title: "Tocilizumab prevented the progression of AA amyloidosis derived from adult-onset Still's disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Steroid pulse therapy, followed by tocilizumab, a IL-6 receptor inhibitor,
      in combination with oral glucocorticoids dramatically improved kidney and
      cardiac manifestations with reduction in systemic inflammation.
    explanation: >-
      Corroborates organ-level benefit of IL-6 blockade in biopsy-proven AA
      amyloidosis. Marked PARTIAL because it is a single case report with
      concomitant glucocorticoid therapy.
- name: Interleukin-1 Blockade (Canakinumab, Anakinra)
  description: >-
    IL-1 blockade targets the inflammasome-driven cytokine cascade upstream of
    IL-6, and is the principal option in colchicine-resistant or
    colchicine-intolerant FMF and in the other monogenic autoinflammatory
    syndromes (TRAPS, CAPS, mevalonate kinase deficiency) that drive AA
    amyloidosis. Note that the randomized evidence recorded here establishes
    control of the trigger diseases; randomized evidence for amyloid or renal
    outcomes on IL-1 blockade in established AA amyloidosis is not available.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: canakinumab
      term:
        id: NCIT:C80971
        label: Canakinumab
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
    treatment_effect: INHIBITS
    description: >-
      Neutralizing IL-1beta suppresses inflammasome-driven autoinflammatory
      disease activity at the trigger node, removing the drive to the hepatic
      acute-phase response.
  evidence:
  - reference: PMID:29768139
    reference_title: "Canakinumab for the Treatment of Autoinflammatory Recurrent Fever Syndromes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this trial, canakinumab was effective in controlling and preventing
      flares in patients with colchicine-resistant familial Mediterranean fever,
      mevalonate kinase deficiency, and TRAPS.
    explanation: >-
      Randomized trial evidence that canakinumab controls the autoinflammatory
      trigger diseases. Marked PARTIAL because the trial endpoint was control of
      the trigger disease, not amyloid burden or renal outcome in AA amyloidosis.
- name: Kidney Transplantation
  description: >-
    The preferred renal replacement modality for AA amyloidosis with kidney
    failure, and no longer the poor-prognosis option it once was: contemporary
    multicentre outcomes approach those of other causes of end-stage kidney
    disease. Amyloid recurrence in the allograft has become rare where the
    underlying inflammatory disease is controlled with modern agents. Because
    excess post-transplant mortality is driven by cardiovascular disease,
    pre-transplant cardiac assessment matters.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:37741608
    reference_title: "Kidney Transplantation in Patients With AA Amyloidosis: Outcomes in a French Multicenter Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient survival rates were 94.0% (95% CI, 89.1-99.2) at 1 year and 85.5%
      (77.8-94.0) at 5 years after transplantation.
    explanation: >-
      Provides contemporary patient-survival outcomes after kidney
      transplantation in 86 patients across 26 French centres.
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Kidney transplantation is preferred in patients with kidney failure, and
      the recurrence of amyloidosis in the allograft has become rare as
      transplant recipients have started to benefit from the new agents.
    explanation: >-
      States the preference for transplantation and the modern rarity of
      allograft recurrence. Evidence source is OTHER because this is a review.
- name: Dialysis
  description: >-
    Haemodialysis or peritoneal dialysis for established kidney failure. It is a
    suitable modality, but survival on dialysis is poor relative to
    transplantation, and worse where cardiac amyloid is present: cardiovascular
    deposition plus nephrotic syndrome makes these patients prone to
    intradialytic hypotension. This is the practical reason transplantation is
    preferred where the patient is a candidate.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Dialysis
    term:
      id: NCIT:C15221
      label: Dialysis
  evidence:
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dialysis modalities and kidney transplantation are both suitable for
      patients suffering from AA amyloidosis and kidney failure
    explanation: >-
      Establishes dialysis as an accepted renal replacement modality in AA
      amyloidosis. Evidence source is OTHER because this is a review.
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Still, survival is poor among patients on dialysis, especially when cardiac
      involvement is prevalent
    explanation: >-
      Records the poor survival on dialysis and its dependence on cardiac
      involvement, the caveat that makes transplantation preferred. Marked
      PARTIAL because it qualifies rather than supports the intervention.
      Evidence source is OTHER (review).
- name: Eprodisate (Investigational, Not Approved)
  description: >-
    A glycosaminoglycan mimetic designed to disrupt the SAA-glycosaminoglycan
    interaction that promotes fibril polymerization - the only agent to have been
    tested in a randomized trial against the deposition step itself rather than
    against the upstream inflammation. It slowed the decline in renal function
    but did not significantly affect progression to end-stage renal disease or
    mortality, and it was not approved. It is recorded here because it is the
    direct clinical test of the glycosaminoglycan-dependence mechanism curated in
    the pathophysiology, and because its failure is part of why no
    deposit-clearing therapy exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Glycosaminoglycan-Assisted Fibril Nucleation and Extracellular Deposition
    treatment_effect: INHIBITS
    description: >-
      Competes with glycosaminoglycan binding to amyloidogenic SAA, inhibiting
      fibril polymerization and tissue deposition at the central effector node.
  evidence:
  - reference: PMID:17554116
    reference_title: "Eprodisate for the treatment of renal disease in AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eprodisate is a member of a new class of compounds designed to interfere
      with interactions between amyloidogenic proteins and glycosaminoglycans and
      thereby inhibit polymerization of amyloid fibrils and deposition of the
      fibrils in tissues.
    explanation: >-
      States the drug's mechanism of action against the
      glycosaminoglycan-assisted fibril formation node.
  - reference: PMID:17554116
    reference_title: "Eprodisate for the treatment of renal disease in AA amyloidosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The drug had no significant effect on progression to end-stage renal
      disease (hazard ratio, 0.54; P=0.20) or risk of death (hazard ratio, 0.95;
      P=0.94).
    explanation: >-
      Records the negative results on the hard endpoints alongside the positive
      renal-function-slope result, which is why the drug was not approved. Marked
      PARTIAL to avoid overstating benefit.
clinical_trials:
- name: NCT00035334
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Multicenter, randomized, double-blind, placebo-controlled trial of eprodisate
    versus placebo for 24 months in 183 patients with AA amyloidosis and kidney
    involvement, with a composite renal-function-or-death primary endpoint.
  target_phenotypes:
  - preferred_term: Renal insufficiency
    term:
      id: HP:0000083
      label: Renal insufficiency
  - preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  evidence:
  - reference: PMID:17554116
    reference_title: "Eprodisate for the treatment of renal disease in AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We randomly assigned 183 patients from 27 centers to receive eprodisate or
      placebo for 24 months.
    explanation: >-
      Describes the trial design and enrolment registered as NCT00035334.
discussions:
- discussion_id: saa_threshold_vs_deposition_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do only a minority of patients with equivalently sustained, equivalently
    high SAA concentrations develop AA amyloidosis?
  rationale: >-
    Chronic SAA elevation is necessary but demonstrably not sufficient: most
    patients with long-standing rheumatoid arthritis or FMF never develop
    amyloidosis despite decades of raised SAA. SAA1 genotype explains part of the
    variance and nucleation-dependence supplies a plausible stochastic mechanism,
    but the field's own reviews state that the conversion step is not fully
    understood. Resolving this would determine whether risk stratification can
    ever go beyond measuring the precursor.
  attaches_to:
  - pathophysiology#Glycosaminoglycan-Assisted Fibril Nucleation and Extracellular Deposition
  status: OPEN
  proposed_experiments:
  - experiment_id: exp_aa_matched_saa_exposure_genotype_cohort
    name: Prospective cohort with matched cumulative SAA exposure stratified by SAA1 genotype
    description: >-
      Recruit patients with chronic inflammatory disease and serially quantified
      SAA, compute a cumulative SAA exposure integral for each, and stratify by
      SAA1 genotype. Screen prospectively for subclinical amyloid so that
      incidence can be regressed on cumulative exposure within genotype strata.
      The design isolates the question of whether genotype shifts the exposure
      threshold or instead changes the probability of conversion at a given
      exposure.
    supporting_outcome:
    - A genotype-dependent shift in the exposure-incidence curve would support
      SAA1 acting on the proteolysis and misfolding step rather than on precursor
      supply.
    refuting_outcome:
    - Superimposable exposure-incidence curves across genotypes would refute a
      genotype-dependent threshold model and point to an unmeasured host factor.
  - experiment_id: exp_aa_pre_clinical_seed_detection
    name: Detection of endogenous nucleating seed before clinically apparent deposition
    description: >-
      Apply high-sensitivity amyloid-seeding assays to accessible tissue (fat
      aspirate, minor salivary gland) from patients with sustained high SAA but
      no clinical amyloidosis, to test whether a subclinical nucleating seed
      precedes and predicts overt disease.
    supporting_outcome:
    - Seeding activity detectable before overt disease, and predictive of later
      amyloidosis, would support the nucleation-dependent seeding model as the
      rate-limiting stochastic step.
    refuting_outcome:
    - Absence of detectable seeding activity in patients who subsequently develop
      amyloidosis would argue against a detectable pre-clinical seed.
  evidence:
  - reference: PMID:25387054
    reference_title: "AA amyloidosis: pathogenesis and targeted therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A chronically high plasma concentration of SAA results in the aggregation
      of amyloid into cross-β-sheet fibrillar deposits by mechanisms not fully
      understood.
    explanation: >-
      The authoritative review explicitly states that the mechanism converting
      high SAA into deposits is incompletely understood, which is the gap
      recorded here. Evidence source is OTHER (review).
- discussion_id: no_deposit_clearing_therapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can established AA amyloid deposits be actively cleared, rather than merely
    allowed to regress by withdrawing the precursor?
  rationale: >-
    All available management works upstream, by lowering SAA; regression then
    depends on endogenous clearance, which is slow and incomplete once organ
    damage is established. The two direct attacks on the deposit - eprodisate
    against glycosaminoglycan-assisted polymerization, and SAP depletion plus
    anti-SAP antibody against existing deposits - both reached clinical trials
    and neither is available. This is the field's principal unmet need and the
    reason treatment timing dominates outcome.
  attaches_to:
  - pathophysiology#Progressive Multi-Organ Amyloid Accumulation
  status: OPEN
  evidence:
  - reference: PMID:38568326
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is yet no treatment option for the clearance of amyloid fibril
      deposits; therefore, the management strategy primarily aims to reduce serum
      amyloid A protein.
    explanation: >-
      States directly that no deposit-clearing therapy exists and that management
      is therefore confined to precursor reduction. Evidence source is OTHER
      because this is a review.
  - reference: PMID:26176329
    reference_title: "Therapeutic Clearance of Amyloid by Antibodies to Serum Amyloid P Component."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conducted an open-label, single-dose-escalation, phase 1 trial involving
      15 patients with systemic amyloidosis.
    explanation: >-
      The anti-SAP approach reached a 15-patient phase 1 trial in systemic
      amyloidosis, showing clearance is achievable in principle. Marked PARTIAL
      because the trial was small, open-label, not AA-specific, excluded patients
      with cardiac involvement, and the programme was subsequently discontinued.
- discussion_id: mica_not_a_modifier_locus
  kind: INTERPRETATION
  prompt: >-
    Is MICA a modifier locus for amyloidosis risk in familial Mediterranean
    fever, as sometimes summarized?
  rationale: >-
    Recorded to stop a specific error being reintroduced. The deep-research
    report for this entry stated that MICA polymorphisms have been reported as a
    modifying factor for amyloidosis risk in FMF alongside MEFV and SAA1, citing
    PMID:15018633. That paper reports the opposite: it tested the MICA exon 5
    polymorphism precisely because MICA modifies FMF attack frequency and age of
    onset, and found no association with renal amyloidosis, while confirming the
    SAA1 association in the same cohort. MICA is therefore deliberately absent
    from this entry's genetic section - not overlooked. The paper reports the
    amyloidosis null without proposing an explanation for it; the two
    explanations it does offer - a weak MICA effect masked by stronger MEFV and
    SAA1 effects, or a population-dependent effect - are given for its separate
    failure to replicate the earlier MICA associations with attack frequency and
    age of onset, and should not be transferred to the amyloidosis result.
  attaches_to:
  - pathophysiology#Sustained Elevation of Circulating Serum Amyloid A
  status: OPEN
  evidence:
  - reference: PMID:15018633
    reference_title: "Amyloidosis in familial Mediterranean fever patients: correlation with MEFV genotype and SAA1 and MICA polymorphisms effects."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, no specific MICA genotype or allele was significantly associated
      with the development of amyloidosis
    explanation: >-
      Directly refutes a MICA-amyloidosis association in the cohort that tested
      it, which is why MICA is not curated as a susceptibility or modifier locus
      here.
  - reference: PMID:15018633
    reference_title: "Amyloidosis in familial Mediterranean fever patients: correlation with MEFV genotype and SAA1 and MICA polymorphisms effects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no association was found between the MICA gene exon 5 polymorphism and the
      development of renal amyloidosis in FMF patients, whereas the alpha allele
      and the alpha/alpha genotype of the SAA1 gene were associated with this
      severe phenotype
    explanation: >-
      The authors' own conclusion, contrasting the null MICA result with the
      positive SAA1 result in the same patients - the asymmetry that justifies
      curating SAA1 but not MICA.
animal_models:
- species: Mus musculus
  genotype: Wild-type mice given an inflammatory stimulus, with or without amyloid-enhancing factor
  category: Induced (non-transgenic) AA amyloidosis model
  description: >-
    AA amyloidosis is unusual among systemic amyloidoses in having a reliable
    induced rodent model that needs no transgene: a chronic inflammatory stimulus
    (casein, silver nitrate) raises murine SAA and produces amyloid deposits,
    and co-administration of amyloid-enhancing factor - an extract of
    amyloid-laden tissue from a previously affected animal - collapses the
    induction lag phase to days. That lag-phase collapse is the direct
    experimental evidence for the nucleation-dependent seeding arm of this
    entry's mechanistic hypotheses, and the same system demonstrated
    cross-seeding by heterologous non-mammalian fibrils. Limitation: the model
    depends on an exogenous inflammatory stimulus and an exogenous seed rather
    than on spontaneous chronic autoimmune disease, so it does not reproduce the
    decades-long, SAA1-genotype-modulated human natural history.
  associated_phenotypes:
  - Splenic, hepatic, and renal amyloid deposition
  evidence:
  - reference: PMID:15829582
    reference_title: "Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Preformed amyloid-like fibrils act as nuclei in amyloid fibril formation in
      vitro, and AA amyloid fibrils and synthetic amyloid-like fibrils also may
      serve as seed for fibril formation in vivo.
    explanation: >-
      States the seeding principle the murine induction model is used to test,
      and that preformed fibrils act as nuclei in vivo.
  - reference: PMID:15829582
    reference_title: "Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We studied three such naturally occurring protein fibrils: silk from Bombyx
      mori, Sup35 from Saccharomyces cerevisiae, and curli from Escherichia coli.
    explanation: >-
      Describes the specific heterologous fibrils tested in the murine model,
      documenting the experimental design underlying the cross-seeding result.

      relationship type.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:18815155
    reference_title: 'Increased susceptibility of serum amyloid A 1.1 to degradation by MMP-1: potential explanation for higher risk of type AA amyloidosis.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results may explain the higher risk of amyloidosis in patients with a
      SAA1.1/1.1 genotype vs SAA1.5/1.5 or SAA1.1/1.5 genotype.
    explanation: >-
      The authors propose isoform-dependent MMP-1 cleavage as one explanation for the clinical association;

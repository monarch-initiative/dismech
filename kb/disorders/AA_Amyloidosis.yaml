    reference_title: "Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the glomerular involvement appeared as the determining histological factor
      for clinical manifestations and outcome of renal AA amyloidosis
    explanation: >-
      Identifies glomerular amyloid involvement as the histological determinant
      of the clinical syndrome, supporting this node as the effector linking
      deposition to renal disease.
  - reference: PMID:17714761
    reference_title: "Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tubular atrophy, abundance, and distribution pattern of glomerular amyloid

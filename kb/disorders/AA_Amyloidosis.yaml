    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AA amyloidosis shows vascular deposits in addition to the glomerular
      deposits
    explanation: >-
      Documents the characteristic combined glomerular-plus-vascular deposition
      pattern that distinguishes AA from other renal amyloid types.
  - reference: PMID:17554117
    reference_title: "Natural history and outcome in systemic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amyloid deposits regressed in 60% of patients who had a median SAA
      concentration of less than 10 mg per liter, and survival among these
      patients was superior to survival among those in whom amyloid deposits did
      not regress (P=0.04).
    explanation: >-
      Establishes that the accumulated amyloid burden is reversible when the
      precursor is suppressed, and that regression carries a survival benefit -
      the key clinical property of this node.

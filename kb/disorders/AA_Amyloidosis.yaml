mechanistic_hypotheses:
- hypothesis_group_id: canonical_saa_overproduction
  hypothesis_label: Canonical SAA Overproduction Model
  status: CANONICAL
  description: >-
    Chronic inflammation drives IL-6-dependent hepatic SAA overproduction; a
    sustained high plasma SAA concentration is the rate-limiting upstream lesion
    that permits proteolytic processing, misfolding, and cross-beta fibril
    deposition. The corollary - that lowering SAA arrests and can reverse the
    process - is the basis of all current therapy.
  evidence:
  - reference: PMID:25387054
    reference_title: "AA amyloidosis: pathogenesis and targeted therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In AA amyloidosis, the expression of cytokines, particularly interleukin 6,
      leads to overproduction of serum amyloid A (SAA) by the liver. A
      chronically high plasma concentration of SAA results in the aggregation of
      amyloid into cross-β-sheet fibrillar deposits by mechanisms not fully
      understood.
    explanation: >-
      States the cytokine-to-precursor-to-fibril chain that defines the canonical
      hypothesis group. Evidence source is OTHER because this is a review.
  - reference: PMID:17554117
    reference_title: "Natural history and outcome in systemic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality, amyloid burden, and renal prognosis all significantly correlated
      with the SAA concentration during follow-up.
    explanation: >-
      A 374-patient natural-history cohort provides the human dose-response
      evidence that circulating precursor concentration governs amyloid burden
      and outcome, the central prediction of this model.
- hypothesis_group_id: nucleation_seeding_model
  hypothesis_label: Nucleation-Dependent Seeding Model
  status: CANONICAL
  description: >-
    Fibril formation is nucleation dependent rather than simply concentration
    dependent: a preformed fibrillar nucleus recruits and templates conversion of
    further native molecules. This helps explain why only a minority of patients
    with equivalent chronic inflammation develop amyloidosis, and why
    amyloid-enhancing factor collapses the induction lag phase in animal models.
    The evidence for exogenous or heterologous seeds acting as a human risk
    factor is experimental, not clinical.
  evidence:
  - reference: PMID:25387054
    reference_title: "AA amyloidosis: pathogenesis and targeted therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Generation of amyloid fibrils is nucleation dependent, and once formed,
      fibrils recruit and catalyze the conversion of native molecules.
    explanation: >-
      States the nucleation-and-templating mechanism that distinguishes this
      model from simple mass-action aggregation. Evidence source is OTHER because
      this is a review.
  - reference: PMID:15829582
    reference_title: "Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results show that these protein fibrils exert amyloid-accelerating
      properties in the murine experimental AA amyloidosis, suggesting that such
      environment factors may be important risk factors in amyloidogenesis.
    explanation: >-
      Demonstrates cross-seeding by heterologous (silk, Sup35, curli) fibrils in
      the murine model, supporting seeding as a mechanism. Marked PARTIAL because
      the extension to human environmental risk is proposed by the authors, not
      demonstrated; evidence source is MODEL_ORGANISM (mouse).
pathophysiology:
- name: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
  description: >-
    The proximal trigger is a persistent inflammatory drive of any cause:
    inflammatory arthritis (rheumatoid arthritis, ankylosing spondylitis,
    juvenile idiopathic arthritis), a monogenic autoinflammatory syndrome
    (familial Mediterranean fever, TRAPS, CAPS, mevalonate kinase deficiency),
    chronic infection (tuberculosis, leprosy, osteomyelitis, bronchiectasis),
    inflammatory bowel disease, or vasculitis. The specific disease is
    interchangeable; what matters mechanistically is the duration and magnitude
    of the cytokine drive it sustains. A substantial minority of cases remain
    idiopathic, with no overt trigger identified.
  role: trigger
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
    temporality: CHRONIC
  evidence:
  - reference: PMID:25387054
    reference_title: "AA amyloidosis: pathogenesis and targeted therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, AA amyloidosis can be thought of as a consequence of
      long-standing inflammatory disease.
    explanation: >-
      Frames chronic inflammatory disease as the upstream trigger of the whole
      chain. Evidence source is OTHER because this is a review.
  - reference: PMID:17714761
    reference_title: "Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amyloidogenic disease was a chronic infection (40.8%), a chronic
      inflammation (38%), a tumor (9.9%), a hereditary disease (9.9%), or was
      undetermined in 1.4% of cases.
    explanation: >-
      Quantifies the heterogeneous trigger diseases in a renal AA amyloidosis
      series, supporting the trigger node as an aetiology-agnostic entry point.
  downstream:
  - target: IL-6-Driven Hepatic Acute-Phase Response
    causal_link_type: DIRECT
    description: >-
      Sustained cytokine release, principally IL-6, acts on hepatocytes to induce
      the acute-phase programme.
- name: IL-6-Driven Hepatic Acute-Phase Response
  description: >-
    Interleukin-6 (with contributions from IL-1beta and TNF) drives hepatocyte
    transcription and secretion of SAA1 and SAA2 as HDL-associated acute-phase
    apolipoproteins. In an ordinary self-limited acute-phase response this is
    physiological and transient; here it is unremitting. Adipose tissue is a
    second, non-hepatic source of SAA, which is how obesity feeds this node in
    the absence of a classical inflammatory disease.
  role: amplifier
  biological_scale: CELLULAR

environmental:
- name: Obesity and adipose-derived serum amyloid A
  description: >-
    Obesity and older age were associated with idiopathic AA amyloidosis in a retrospective clinical study.
    Human adipocytes produce SAA, providing a plausible contributing mechanism, but adipose-derived SAA
    was not traced into deposits and causality was not established.
  effect: Increases risk of idiopathic AA amyloidosis
  evidence:
  - reference: PMID:29364741
    reference_title: Obesity is a significant susceptibility factor for idiopathic AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Obesity, age and the SAA1 polymorphism are susceptibility factors for
      idiopathic AA amyloidosis.
    explanation: >-
      Directly states obesity as a susceptibility factor for idiopathic AA amyloidosis in a 146-patient
      study with two control groups.
    directness: DIRECT
    quote_role: PRIMARY_RESULT

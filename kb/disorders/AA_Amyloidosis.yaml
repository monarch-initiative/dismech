name: AA Amyloidosis
creation_date: '2026-08-08T00:00:00Z'
category: Complex
disease_term:
  preferred_term: AA amyloidosis
  term:
    id: MONDO:0019439
    label: AA amyloidosis
parents:
- Amyloidosis
description: >-
  Systemic AA amyloidosis results from extracellular deposition of fibrils derived from serum amyloid
  A (SAA). Most cases complicate chronic inflammatory, autoinflammatory or infectious disease through
  sustained SAA production; some remain idiopathic, and a rare autosomal dominant SAA1 promoter variant
  causes hereditary AA amyloidosis without systemic inflammation. Renal disease dominates, with proteinuria,
  nephrotic syndrome and progressive loss of kidney function. Hepatic, splenic and gastrointestinal involvement
  also occurs; cardiac failure is less typical. SAA concentration, protein processing, fibril nucleation
  and extracellular cofactors contribute to deposition, but their sequence in patients is incompletely
  resolved. Treating the underlying cause and reducing SAA can stabilize disease and permit regression
  of deposits; established organ damage may persist.
synonyms:
- secondary amyloidosis
- reactive systemic amyloidosis
- inflammatory amyloidosis
- amyloid A amyloidosis
- serum amyloid A amyloidosis
prevalence:
- population: Patients with rheumatoid arthritis, studies published before 2010
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 16700.0
  rate_high: 25200.0
  notes: >-
    The systematic review reports a 16.7–25.2% range across heterogeneous rheumatoid arthritis studies
    published before 2010. This is neither a pooled estimate nor a general-population rate; no midpoint
    estimate is assigned.
  evidence:
  - reference: PMID:40516176
    reference_title: 'AA amyloidosis in inflammatory joint diseases: A systematic review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AAA prevalence rates in rheumatoid arthritis ranged from 16.7 % to 25.2 %
      before 2010
    explanation: >-
      Systematic review reporting the historical prevalence range of AA amyloidosis within rheumatoid
      arthritis cohorts.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- population: Patients with rheumatoid arthritis, studies published after 2010
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 700.0
  notes: >-
    The review reports 0.7% in rheumatoid arthritis studies published after 2010. Cohorts and ascertainment
    differ across eras; the temporal association suggests, but does not establish, an effect of biologic
    therapy. The review found no clear incidence or mortality trend and calls for population-based data.
  evidence:
  - reference: PMID:40516176
    reference_title: 'AA amyloidosis in inflammatory joint diseases: A systematic review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      decreased to 0.7 % after 2010, which suggests a potential positive role of
      biologic therapies
    explanation: >-
      Reports the later-era estimate and a proposed contribution of biologic therapy, without a causal
      comparison across equivalent populations.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
mechanistic_hypotheses:
- hypothesis_group_id: canonical_saa_overproduction
  hypothesis_label: Canonical SAA Overproduction Model
  status: CANONICAL
  description: >-
    In the common inflammation-associated pathway, cytokines stimulate hepatic SAA production. Persistent
    circulating precursor supplies fibril assembly; lower serial SAA concentrations are associated with
    amyloid regression and better renal and survival outcomes. Adipose production and the rare hereditary
    SAA1 promoter mechanism provide additional routes to elevated SAA.
  evidence:
  - reference: PMID:25387054
    reference_title: 'AA amyloidosis: pathogenesis and targeted therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In AA amyloidosis, the expression of cytokines, particularly interleukin 6,
      leads to overproduction of serum amyloid A (SAA) by the liver. A
      chronically high plasma concentration of SAA results in the aggregation of
      amyloid into cross-β-sheet fibrillar deposits by mechanisms not fully
      understood.
    explanation: >-
      States the cytokine-to-precursor-to-fibril chain that defines the canonical hypothesis group. Evidence
      source is OTHER because this is a review.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:17554117
    reference_title: Natural history and outcome in systemic AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality, amyloid burden, and renal prognosis all significantly correlated
      with the SAA concentration during follow-up.
    explanation: >-
      The 374-patient longitudinal cohort links serial SAA to burden and outcomes; this observational
      relationship does not establish a universal concentration-duration threshold.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- hypothesis_group_id: nucleation_seeding_model
  hypothesis_label: Nucleation-Dependent Seeding Model
  status: CANONICAL
  description: >-
    Preformed fibrils can template further amyloid assembly. Experimental cross-seeding accelerates murine
    AA amyloidosis, but the contribution of environmental heterologous seeds to human disease has not
    been established.
  evidence:
  - reference: PMID:25387054
    reference_title: 'AA amyloidosis: pathogenesis and targeted therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Generation of amyloid fibrils is nucleation dependent, and once formed,
      fibrils recruit and catalyze the conversion of native molecules.
    explanation: >-
      States the nucleation-and-templating mechanism that distinguishes this model from simple mass-action
      aggregation. Evidence source is OTHER because this is a review.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:15829582
    reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results show that these protein fibrils exert amyloid-accelerating
      properties in the murine experimental AA amyloidosis, suggesting that such
      environment factors may be important risk factors in amyloidogenesis.
    explanation: >-
      Direct experimental support for murine cross-seeding; the authors propose, rather than demonstrate,
      an environmental risk in humans.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
pathophysiology:
- name: Chronic Inflammatory, Autoinflammatory, or Infectious Stimulus
  description: >-
    Persistent inflammation from infections, inflammatory arthritis or monogenic autoinflammatory disease
    can sustain SAA production. These are heterogeneous causes of the common acquired pathway; overt inflammation
    is not required in every idiopathic or hereditary case.
  role: trigger
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:25387054
    reference_title: 'AA amyloidosis: pathogenesis and targeted therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, AA amyloidosis can be thought of as a consequence of
      long-standing inflammatory disease.
    explanation: >-
      Frames chronic inflammatory disease as the upstream trigger of the whole chain. Evidence source
      is OTHER because this is a review.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:17714761
    reference_title: 'Clinical and histological characteristics of renal AA amyloidosis: a retrospective study of 68 cases with a special interest to amyloid-associated inflammatory response.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amyloidogenic disease was a chronic infection (40.8%), a chronic
      inflammation (38%), a tumor (9.9%), a hereditary disease (9.9%), or was
      undetermined in 1.4% of cases.
    explanation: >-
      Quantifies the heterogeneous trigger diseases in a renal AA amyloidosis series, supporting the trigger
      node as an aetiology-agnostic entry point.
    directness: DIRECT
    quote_role: PRIMARY_RESULT

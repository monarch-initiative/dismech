  evidence:
  - reference: PMID:17554117
    reference_title: "Natural history and outcome in systemic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deposition of amyloid fibrils derived from circulating acute-phase reactant
      serum amyloid A protein (SAA) causes systemic AA amyloidosis, a serious
      complication of many chronic inflammatory disorders.
    explanation: >-
      Identifies circulating SAA as the precursor from which the fibrils derive,
      the substituted precursor node of the amyloidogenesis module.
  - reference: PMID:17554117
    reference_title: "Natural history and outcome in systemic AA amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of death was 17.7 times as high among patients with SAA
      concentrations in the highest eighth, or octile, (>or=155 mg per liter) as
      among those with concentrations in the lowest octile (<4 mg per liter)
    explanation: >-
      Quantifies the precursor-concentration-to-outcome gradient in humans,
      establishing that the level of this node, not merely its presence, drives
      disease.
  downstream:
  - target: Proteolytic Processing and Beta-Sheet Misfolding of SAA
    causal_link_type: DIRECT
    description: >-
      Excess circulating precursor is the substrate on which proteolysis and
      conformational conversion act.
- name: Proteolytic Processing and Beta-Sheet Misfolding of SAA
  description: >-
    SAA is cleaved to an N-terminal fragment (predominantly residues 1-76, losing
    the C-terminal region) and converts from its native alpha-helical fold into
    beta-sheet-rich, aggregation-prone species. C-terminal truncation is not
    incidental: it destabilizes the alpha-helical structure and markedly
    accelerates fibril formation relative to the full-length protein. Genetic
    variation in SAA1 acts at exactly this step, by changing how readily the
    precursor is cleaved.
  conforms_to: amyloidogenesis#Protein Misfolding and Beta-Sheet Oligomerization
  role: amplifier
  biological_scale: MOLECULAR

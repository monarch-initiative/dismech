discussions:
- discussion_id: saa_threshold_vs_deposition_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do only a minority of patients with equivalently sustained, equivalently
    high SAA concentrations develop AA amyloidosis?
  rationale: >-
    Persistent SAA elevation, common coding alleles, inflammation and cofactors do not fully predict deposition.
    The rare promoter variant illustrates a supply mechanism, while cell-free cleavage and fibril assays
    suggest additional contributors. Their relative effects in patients remain unresolved.
  attaches_to:
  - pathophysiology#SAA Amyloid Fibril Assembly
  status: OPEN
  proposed_experiments:
  - experiment_id: exp_aa_matched_saa_exposure_genotype_cohort
    name: Prospective cohort with matched cumulative SAA exposure stratified by SAA1 genotype
    description: >-
      Follow inflammatory-disease patients with serial SAA, genotype and prospectively assessed amyloid
      outcomes. Model cumulative measured exposure and relevant confounders. A genotype association after
      adjustment would motivate direct functional studies but cannot by itself distinguish processing,
      tissue exposure, clearance or residual confounding.
    supporting_outcome:
    - A reproducible genotype association after measured-SAA adjustment supports additional genotype-linked risk, without locating its molecular mediator.
    refuting_outcome:
    - A sufficiently precise null limits the detectable genotype effect in this population, but does not exclude smaller effects or inadequately measured exposure.
  - experiment_id: exp_aa_pre_clinical_seed_detection
    name: Detection of endogenous nucleating seed before clinically apparent deposition
    description: >-
      Apply high-sensitivity amyloid-seeding assays to accessible tissue (fat aspirate, minor salivary
      gland) from patients with sustained high SAA but no clinical amyloidosis, to test whether a subclinical
      nucleating seed precedes and predicts overt disease.
    supporting_outcome:
    - Prediagnostic seeding activity associated with future disease supports its predictive relevance; it does not by itself establish that seeding is rate-limiting.
    refuting_outcome:
    - Absence of detectable seeding activity in patients who subsequently develop amyloidosis would argue against a detectable pre-clinical seed.
  evidence:
  - reference: PMID:25387054
    reference_title: 'AA amyloidosis: pathogenesis and targeted therapy.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A chronically high plasma concentration of SAA results in the aggregation
      of amyloid into cross-β-sheet fibrillar deposits by mechanisms not fully
      understood.
    explanation: >-
      The authoritative review explicitly states that the mechanism converting high SAA into deposits
      is incompletely understood, which is the gap recorded here. Evidence source is OTHER (review).
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- discussion_id: no_deposit_clearing_therapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can established AA amyloid deposits be actively cleared, rather than merely
    allowed to regress by withdrawing the precursor?
  rationale: >-
    Reducing precursor production can permit regression, but established organ damage may remain. Anti-SAP
    studies demonstrate amyloid-load reduction in one AA participant without proven functional benefit;
    later cardiac safety and efficacy limitations arose in other amyloid types. Safe deposit removal with
    clinical benefit remains an open therapeutic problem.
  attaches_to:
  - pathophysiology#Progressive Multi-Organ Amyloid Accumulation
  status: OPEN
  evidence:
  - *id002
  - *id003
  - *id004
- discussion_id: mica_not_a_modifier_locus
  kind: INTERPRETATION
  prompt: >-
    Is MICA a modifier locus for amyloidosis risk in familial Mediterranean
    fever, as sometimes summarized?
  rationale: >-
    The cited FMF study found no association of the tested MICA exon 5 polymorphism with renal amyloidosis,
    despite an SAA1 association. This is a cohort-specific null and does not prove absence of every MICA
    effect. MICA is not entered as an established AA susceptibility locus on this evidence.
  attaches_to:
  - pathophysiology#Sustained Elevation of Circulating Serum Amyloid A
  status: OPEN
  evidence:
  - reference: PMID:15018633
    reference_title: 'Amyloidosis in familial Mediterranean fever patients: correlation with MEFV genotype and SAA1 and MICA polymorphisms effects.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, no specific MICA genotype or allele was significantly associated
      with the development of amyloidosis
    explanation: >-
      Directly refutes a MICA-amyloidosis association in the cohort that tested it, which is why MICA
      is not curated as a susceptibility or modifier locus here.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:15018633
    reference_title: 'Amyloidosis in familial Mediterranean fever patients: correlation with MEFV genotype and SAA1 and MICA polymorphisms effects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no association was found between the MICA gene exon 5 polymorphism and the
      development of renal amyloidosis in FMF patients, whereas the alpha allele
      and the alpha/alpha genotype of the SAA1 gene were associated with this
      severe phenotype
    explanation: >-
      The authors' own conclusion, contrasting the null MICA result with the positive SAA1 result in the
      same patients - the asymmetry that justifies curating SAA1 but not MICA.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
animal_models:
- species: Mus musculus
  genotype: Non-transgenic NMRI and FVB mice
  category: Induced (non-transgenic) AA amyloidosis model
  description: >-
    Five- to ten-week-old female NMRI mice and age-matched FVB mice of both sexes were studied. Heterologous
    silk, Sup35 or curli preparations were injected with a silver-nitrate inflammatory challenge; matched
    vehicle and nonamyloid actin controls also received the challenge. Splenic AA deposition was evaluated after
    16 days using blinded Congo-red microscopy and immunohistochemistry. In the FVB Sup35 experiment, 10/12
    seeded mice had deposits versus 2/11 controls with minimal deposits; results varied across preparations and
    strains. This tests experimental cross-seeding, not live bacterial infection, oral transmission or
    environmental risk in humans.
  evidence:
  - reference: PMID:15829582
    reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      We studied three such naturally occurring protein fibrils: silk from Bombyx mori, Sup35 from Saccharomyces
      cerevisiae, and curli from Escherichia coli.
    explanation: >-
      Identifies the heterologous seed preparations.
  - reference: PMID:15829582
    reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Our results show that these protein fibrils exert amyloid-accelerating properties in the murine
      experimental AA amyloidosis
    explanation: >-
      Direct experimental result; environmental human risk is an extrapolation.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1087940/
    reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism - PMC'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Amyloid deposits were detected in the spleens of 10 of the 12 FVB mice treated with Sup35, whereas 2 of 11
      mice in a control group treated with 0.9% NaCl developed minimal amyloid deposits
    explanation: >-
      Direct seeded-versus-vehicle comparison in FVB mice under inflammatory challenge; the control group was not uniformly negative.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1087940/
    reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism - PMC'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      No amyloid was detected in 13 (9 NMRI and 4 FVB) mice treated with actin fibrils or in 14 (9 NMRI and 5
      FVB) mice treated with G-buffer.
    explanation: >-
      Actin and buffer groups provide a nonamyloid-fibril comparison under the same induction framework.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1087940/
    reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism - PMC'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      The slides were examined blindly in a polarization microscope (BX51, Olympus, Melville, NY) for bright
      green birefringence, typical of amyloid.
    explanation: >-
      Blinded histological detection supports the splenic amyloid readout. This is not a renal-function or survival endpoint.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1087940/
    reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism - PMC'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      No significant differences were found (amyloid occurred in three of nine mice treated with wild-type NM
      and one of eight mice treated with R2E2 NM).
    explanation: >-
      The NMRI Sup35-variant experiment did not demonstrate a significant difference; seeding results should not
      be generalized across all preparations.
  modeled_mechanisms:
  - target: SAA Amyloid Fibril Assembly
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Heterologous fibrils accelerate splenic AA deposition during an inflammatory challenge, supporting an in
      vivo seeding contribution to assembly.
    limitations: >-
      This induced model does not establish spontaneous clinical latency, human environmental transmission,
      systemic clinical organ failure or therapeutic rescue. Splenic deposits are an endpoint of assembly and
      accumulation, not a direct kinetic measurement of molecular nucleation. Separate Sup35-variant results
      were not significantly different.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1087940/
      reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism - PMC'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        Amyloid deposits were detected in the spleens of 10 of the 12 FVB mice treated with Sup35, whereas 2 of
        11 mice in a control group treated with 0.9% NaCl developed minimal amyloid deposits
      explanation: >-
        Mouse deposition is a direct experimental endpoint; its relationship to molecular fibril assembly is
        inferred from the seeding design.
    readouts:
    - name: Splenic AA deposition after Sup35 seeding
      target: SAA Amyloid Fibril Assembly
      direction: INCREASED
      interpretation: >-
        At day 16, deposits were found in 10/12 FVB mice given Sup35 versus minimal deposits in 2/11 vehicle
        controls; both groups received an inflammatory challenge. The study does not demonstrate clinical renal
        benefit or rescue.
      evidence:
      - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1087940/
        reference_title: 'Protein fibrils in nature can enhance amyloid protein A amyloidosis in mice: Cross-seeding as a disease mechanism - PMC'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: >-
          Amyloid deposits were detected in the spleens of 10 of the 12 FVB mice treated with Sup35, whereas 2
          of 11 mice in a control group treated with 0.9% NaCl developed minimal amyloid deposits
        explanation: >-
          The comparison quantifies splenic deposition, not human disease penetrance or direct molecular assembly flux.

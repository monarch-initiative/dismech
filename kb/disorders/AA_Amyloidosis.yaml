genetic:
- name: SAA1
  notes: >-
    Common SAA1 coding haplotypes modify AA risk in selected inflammatory-disease cohorts. SAAalpha/alpha
    was associated with renal amyloidosis in a 277-patient FMF cohort (OR 2.99, 95% CI 1.47–6.09). Isoform-dependent
    MMP-1 cleavage is a candidate biochemical explanation, not proof of the human causal pathway. A separate
    rare promoter variant is causal in hereditary AA amyloidosis and is recorded independently below.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: SAA1
    term:
      id: hgnc:10513
      label: SAA1
  evidence:
  - reference: PMID:12687559
    reference_title: The contribution of genotypes at the MEFV and SAA1 loci to amyloidosis and disease severity in patients with familial Mediterranean fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the presence of the SAAalpha/alpha genotype (OR 2.99, 95% CI 1.47-6.09)
    explanation: >-
      Quantifies the independent association of the amyloidogenic SAA1 alpha/alpha genotype with renal
      amyloidosis in a 277-patient FMF cohort.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:29364741
    reference_title: Obesity is a significant susceptibility factor for idiopathic AA amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

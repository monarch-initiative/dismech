notes: >-
  GeneReviews baseline (curation SOP step 3b) does not apply here. AA amyloidosis
  is an acquired complication of chronic inflammation, not a Mendelian disorder,
  and a PubMed search for a GeneReviews chapter returned only chapters for the
  monogenic trigger diseases (Familial Mediterranean Fever, PMID:20301405; TNF
  Receptor-Associated Periodic Fever Syndrome, PMID:36375008), which are curated
  as separate dismech entries. Cardiac amyloidosis, peripheral neuropathy, and
  macroglossia are deliberately NOT curated as phenotypes here; they are uncommon
  in AA and are recorded instead as discriminators under the AL differential
  diagnosis. Note the nuance on macroglossia: PMID:38568326 does list it among
  the presenting gastrointestinal symptoms of AA amyloidosis, in a sentence this
  entry quotes for malabsorption and weight loss, so it is not absent from AA -
  it is merely far less frequent than in AL, which is what makes it useful as a
  discriminator rather than as an AA phenotype.

  Thyroid and adrenal involvement are likewise uncurated. The only available
  statement ("Involvements of the thyroid, adrenals, and the nervous system might
  also be encountered") carries no frequency and no specific functional claim, so
  binding it to an HPO term would assert more precision than the source supports.

  `evidence_source` convention for PMID:38568326, which appears in this file with
  two different values: `HUMAN_CLINICAL` where the review makes a direct clinical
  observation about AA amyloidosis patients, and `OTHER` where it reports the
  numbers of a specific primary series it is summarizing (the colchicine 960-patient
  cohort, the anti-TNF 15- and 36-patient studies, the 42-patient tocilizumab
  comparison), and also where it makes a general narrative or background
  statement rather than a patient-level observation. Both of the latter cases are
  secondary reporting and are marked as such; every item states its reason
  inline.

  The rare autosomal-dominant SAA1-promoter form of hereditary AA
  amyloidosis reported in Kidney International (2021) is not curated, because the
  deep-research report supplied no verifiable PMID for it; it is a candidate
  subtype if a citable identifier is confirmed.

  Two evidence choices are worth stating explicitly. First, the anti-TNF
  treatment entry and several extrarenal phenotypes are cited to the full text of
  the PMID:38568326 review rather than to the primary series it summarizes,
  because the primary PMIDs for those series could not be independently resolved;
  quoting the review verbatim is preferred here over guessing an identifier.
  Second, Eprodisate carries no `therapeutic_agent`: both NCIT eprodisate terms
  (NCIT:C166957, NCIT:C65520) exist but are outside the `ChemicalEntityTerm`
  dynamic enum, and CHEBI has no eprodisate entry, so there is no valid
  ontology binding to give it.

  Nephroprotective supportive care (ACE inhibitors / ARBs) is deliberately not
  curated as a treatment: it is standard practice for proteinuric kidney disease
  generally, but no quotable AA-specific statement was found in the cached
  sources, and a treatment entry without evidence would be worse than its
  absence.

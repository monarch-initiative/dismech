  notes: Identified by GEO DataSets index search for Middle East Respiratory Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE56192
  title: Transcriptomic analysis of the Novel Middle East Respiratory Syndrome Coronavirus (Human, MRC5 cells)
  description: We will use the EMC/2012 strain of the novel beta Coronavirus called Middle East Respiratory Syndrome Coronavirus (MERS-CoV). It was initially passaged on Vero E6 cells in Saudi Arabia before being sequenced at the Erasmus Medical College in Rotterdam, Netherlands by Dr Ron Fouchier. We propose to perform a time course of infection of hCoV-EMC on MRC5 cells (Human Lung origin) and Vero cells (African Green Monkey Kidney cells). Both cell lines readily grow and replicate the virus.
  organism:

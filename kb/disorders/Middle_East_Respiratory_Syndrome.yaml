  - reference: PMID:26049252
    reference_title: Middle East respiratory syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Middle East respiratory syndrome (MERS) is a highly lethal respiratory
      disease caused by a novel single-stranded, positive-sense RNA
      betacoronavirus (MERS-CoV).
    explanation: >-
      Names MERS-CoV as the causative agent of the disease and places it

transmission:
- name: Zoonotic transmission from dromedary camels
  description: >-
    Dromedary camels are the reservoir from which MERS-CoV spills over into
    people; close contact with an infected camel has been shown to transmit the
    virus, although the precise mode of animal-to-human transfer is not settled.
  evidence:
  - reference: PMID:24896817
    reference_title: Evidence for camel-to-human transmission of MERS coronavirus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that this fatal case of human MERS-CoV infection was
      transmitted through close contact with an infected camel.
    explanation: >-
      Identical full genome sequences from a patient and his camel, with
      serological evidence of prior camel infection, document camel-to-human
      transmission.
  - reference: PMID:26049252
    reference_title: Middle East respiratory syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dromedary camels, hosts for MERS-CoV, are implicated in direct or indirect
      transmission to human beings, although the exact mode of transmission is
      unknown.
    explanation: >-
      Supports the camel reservoir as the source of human infection while
      recording that the precise route remains undetermined.
- name: Person-to-person transmission in health-care settings
  description: >-
    Human-to-human transmission occurs but is limited in the community; it is
    concentrated in hospitals, where MERS-CoV has spread between patients in
    dialysis units, intensive care units and inpatient wards, and to family
    members and health-care workers.
  evidence:
  - reference: PMID:23782161
    reference_title: Hospital outbreak of Middle East respiratory syndrome coronavirus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 21 of the 23 cases were acquired by person-to-person transmission
      in hemodialysis units, intensive care units, or in-patient units in three
      different health care facilities.
    explanation: >-
      Nearly all cases in this outbreak were health-care-acquired, establishing
      person-to-person transmission within hospitals.
  - reference: PMID:26049252
    reference_title: Middle East respiratory syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both community-acquired and hospital-acquired cases have been reported with
      little human-to-human transmission reported in the community.
    explanation: >-
      Bounds the route: person-to-person spread is documented but inefficient
      outside health-care settings.
pathophysiology:
- name: MERS-CoV Spike-Mediated Entry via DPP4
  conforms_to: "host_directed_antiviral_dependency#Host Receptor and Protease Engagement"
  description: >
    MERS-CoV enters host cells through its spike (S) glycoprotein, whose
    receptor-binding S1 domain engages the host cell-surface enzyme dipeptidyl
    peptidase 4 (DPP4, also known as CD26); host serine proteases then prime the
    spike for membrane fusion. DPP4 is expressed on respiratory epithelium and
    pneumocytes, defining the tropism for the lower respiratory tract, and is
    also expressed on renal and intestinal epithelium and liver — a tissue
    distribution consistent with the extrapulmonary (notably renal and
    gastrointestinal) manifestations of severe MERS. Receptor engagement is
    independent of DPP4 enzymatic activity: clinically used gliptin DPP4
    inhibitors do not block infection, so DPP4 serves as an attachment protein
    rather than through its peptidase catalysis. Because the receptor is a host
    protein, antibodies against DPP4 block infection — the host-directed-target
    logic shared with SARS-CoV-2/ACE2.

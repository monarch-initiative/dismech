treatments:
- name: Supportive Care
  description: >
    Management of MERS is primarily supportive, including supplemental oxygen and
    respiratory support (up to mechanical ventilation/ECMO for ARDS); no antiviral
    therapy is approved as standard of care, and management of severe disease is
    organ-supportive.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
notes: >-
  Created as part of the Respiratory Infections project (Intercept-aligned,
  pandemic-potential coronavirus backlog item). Conforms to the
  host_directed_antiviral_dependency module via the DPP4 receptor entry node,
  paralleling SARS-CoV-2/ACE2. The infectious_agent (NCBITaxon) block for
  MERS-CoV was omitted at creation and is described in the text; it can be added
  later.
datasets:
- accession: geo:GSE139516
  title: Transcriptomic Analysis Of circRNAs/miRNAs/mRNAs upon Middle East Respiratory Syndrome Coronavirus (MERS-CoV) infection
  description: Human circular RNAs can function in competing endogenous RNA (ceRNA) network by sponging miRNA and regulating gene expression. Viruses are evolved to regulate noncoding RNAs such as miRNAs and circRNAs to facilitate their propagation and pathogenesis. Studies on how host ceRNAs upon human coronavirus infection were scarce, and the functions of circRNAs during the infection of Middle East respiratory syndrome coronavirus (MERS-CoV) has not been deeply revealed. Therefore, we conducted a whole transcriptional profile (RNA-seq) analysis to compare the expression of circRNAs, miRNAs and mRNAs between the mock-infected and MERS-CoV-infected human lung adenocarcinoma (Calu-3) cells.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 27
  publication: PMID:32223537
  notes: Identified by GEO DataSets index search for Middle East Respiratory Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE56192
  title: Transcriptomic analysis of the Novel Middle East Respiratory Syndrome Coronavirus (Human, MRC5 cells)
  description: We will use the EMC/2012 strain of the novel beta Coronavirus called Middle East Respiratory Syndrome Coronavirus (MERS-CoV). It was initially passaged on Vero E6 cells in Saudi Arabia before being sequenced at the Erasmus Medical College in Rotterdam, Netherlands by Dr Ron Fouchier. We propose to perform a time course of infection of hCoV-EMC on MRC5 cells (Human Lung origin) and Vero cells (African Green Monkey Kidney cells). Both cell lines readily grow and replicate the virus.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens

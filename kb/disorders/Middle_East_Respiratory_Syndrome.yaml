    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      No specific drug treatment exists for MERS and supportive treatment is the
      mainstay of management.
    explanation: >-
      Confirms that supportive care is the mainstay of clinical management for
      MERS.
differential_diagnoses:
- name: Severe acute respiratory syndrome
  description: >-
    Severe acute respiratory syndrome (SARS), caused by the lineage B
    betacoronavirus SARS-CoV, presents with an overlapping initial febrile and
    nonproductive cough prodrome progressing to viral pneumonia and respiratory
    failure.
  distinguishing_features:
  - MERS-CoV uses DPP4 (CD26) as its entry receptor whereas SARS-CoV uses ACE2.
  - MERS shows a stronger association with underlying comorbidities, more frequent acute renal failure, higher hemoptysis frequency (17% vs 0-1%), and more rapid progression to mechanical ventilation (median 7 days vs mean 11 days) than SARS.
  evidence:
  - reference: PMID:23782161
    reference_title: Hospital outbreak of Middle East respiratory syndrome coronavirus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical syndrome is similar to SARS, with an initial phase of
      nonspecific fever and mild, nonproductive cough, which may last for several
      days before progressing to pneumonia.
    explanation: >-
      Highlights the clinical similarity between MERS and SARS in their initial
      febrile and respiratory phases.
  - reference: PMID:26049252
    reference_title: Middle East respiratory syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The few data available about viral dynamics and clinical course suggest that
      patients with MERS have a shorter time from illness onset to clinical
      presentation and to a requirement for ventilatory support than do patients
      with SARS (table), and higher respiratory tract viral loads during the first
      week of the illness.92
    explanation: >-
      Distinguishes MERS from SARS by its faster progression to ventilatory
      support and higher first-week lower respiratory viral loads.
notes: >-
  Created as part of the Respiratory Infections project (Intercept-aligned,
  pandemic-potential coronavirus backlog item). Conforms to the

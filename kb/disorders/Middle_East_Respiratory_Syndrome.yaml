    label: Middle East respiratory syndrome
progression:
- phase: Incubation period
  incubation_days: 2-13
  notes: >-
    Following exposure to MERS-CoV, the median incubation period is 5.2 days
    (95% CI 1.9 to 14.7 days; typical range 2 to 13 days), with a median serial
    interval of 7.6 days in human-to-human transmission clusters.
  evidence:
  - reference: PMID:23782161
    reference_title: Hospital outbreak of Middle East respiratory syndrome coronavirus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median incubation period was 5.2 days (95% confidence interval [CI],
      1.9 to 14.7), and the serial interval was 7.6 days (95% CI, 2.5 to 23.1).
    explanation: >-
      Establishes the median incubation period and serial interval of MERS-CoV
      from a hospital outbreak cohort.
- phase: Rapid progression to respiratory and multiorgan failure
  duration: first 1 to 2 weeks of symptomatic illness
  notes: >-
    After an initial febrile and cough prodrome, severe cases progress rapidly to
    pneumonia, ICU admission (median 5 days from symptom onset), mechanical
    ventilation (median 7 days), and death (median 11 days).
  evidence:
  - reference: PMID:23782161
    reference_title: Hospital outbreak of Middle East respiratory syndrome coronavirus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients in whom the illness progressed, the median time from the
      onset of symptoms to ICU admission was 5 days (range, 1 to 10), the median
      time to the need for mechanical ventilation was 7 days (range, 3 to 11),
      and the median time to death was 11 days (range, 5 to 27).
    explanation: >-
      Quantifies the rapid clinical trajectory from symptom onset to ICU
      admission, mechanical ventilation, and death in progressive MERS.

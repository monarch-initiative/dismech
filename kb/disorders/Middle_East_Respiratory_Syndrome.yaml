diagnosis:
- name: Real-time reverse transcription polymerase chain reaction
  description: >-
    Confirmation of MERS-CoV infection relies on real-time reverse transcription
    PCR (RT-PCR) targeting specific viral genomic regions (such as upE and ORF
    1a/1b), ideally performed on lower respiratory tract specimens where viral
    loads are highest.
  diagnosis_term:
    preferred_term: Real-time reverse transcription polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    Positive real-time RT-PCR on at least two specific MERS-CoV genomic targets
    (or a single positive target confirmed by sequencing) establishes laboratory
    confirmation.
  evidence:
  - reference: PMID:26049252
    reference_title: Middle East respiratory syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The presence of viral nucleic acid can be confirmed either by positive
      real-time reverse transcription PCR on at least two specific genomic targets
      or by a single positive target with sequencing of a second positive PCR
      product.97 Available real-time reverse transcription PCR tests include an
      assay targeting RNA upstream of the E gene (upE) and assays targeting open
      reading frames 1b (ORF 1b) and 1a (ORF 1a).
    explanation: >-
      Establishes real-time RT-PCR targeting upE and ORF 1a/1b as the reference
      molecular diagnostic method for MERS-CoV.
- name: Chest radiography
  description: >-
    Chest radiography and computed tomography evaluate pulmonary involvement and
    progression to viral pneumonitis or acute respiratory distress syndrome.
  diagnosis_term:
    preferred_term: Chest radiography
    term:
      id: NCIT:C38103
      label: Chest Radiography
  results: >-
    Bilateral hilar infiltration, patchy unilateral or bilateral infiltrates,
    lobar opacities, ground-glass opacities, and rapid lower-lobe-predominant
    radiographic progression.
  evidence:
  - reference: PMID:26049252
    reference_title: Middle East respiratory syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Chest radiography and tomography findings of MERS are consistent with viral
      pneumonitis and acute respiratory distress syndrome, with bilateral hilar
      infiltration, unilateral or bilateral patchy densities or infiltrates,
      segmented or lobar opacities, ground-glass opacities, and small pleural
      effusions in some cases.
    explanation: >-
      Documents the characteristic chest imaging abnormalities in MERS.
- name: Diagnostic serology testing
  description: >-
    Paired serum antibody testing (screening by ELISA or immunofluorescence
    followed by neutralization confirmation) supports confirmation of MERS-CoV
    infection and retrospective case identification.
  diagnosis_term:
    preferred_term: Diagnostic serology testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  results: >-
    Seroconversion in paired sera collected 14 to 21 days apart, or positive
    screening assay confirmed by virus neutralization assay.
  evidence:
  - reference: PMID:26049252
    reference_title: Middle East respiratory syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For confirmation of infection by antibody detection, paired serum samples
      should be collected 14–21 days apart with the first taken during the first
      week of illness. A positive screening assay (ELISA, immunofluorescence
      assay) should be followed by a confirmatory (neutralisation) assay.
    explanation: >-
      Establishes the two-step serological diagnostic protocol for MERS-CoV.
treatments:
- name: Supportive Care
  description: >
    Management of MERS is primarily supportive, including supplemental oxygen and
    respiratory support (up to mechanical ventilation/ECMO for ARDS); no antiviral
    therapy is approved as standard of care, and management of severe disease is
    organ-supportive.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:

- accession: geo:GSE188514
  title: The N-terminal Region of Middle East Respiratory Syndrome Coronavirus Accessory Protein 8b is Essential for Enhanced Virulence of an Attenuated Murine Coronavirus
  description: Middle East respiratory syndrome coronavirus (MERS-CoV) is a beta coronavirus that emerged in 2012, causing severe pneumonia and renal failure. MERS-CoV encodes five accessory proteins. Some of them have been shown to interfere with host antiviral immune response. However, the roles of protein 8b in innate immunity and viral virulence was rarely studied. Here, we introduced individual MERS-CoV accessory protein genes into the genome of an attenuated murine coronavirus (Mouse hepatitis virus, MHV), respectively and found accessory protein 8b could enhance viral replication in vivo and in vitro, and increase the lethality of infected mice.

- name: Restricted T Cell Receptor Repertoire
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    A repertoire that is both small and oligoclonal. In the Omenn patient the TCR V-beta
    repertoire was oligoclonal and TRB diversity was reduced to about a third of a healthy
    control, while B-cell IgH diversity was comparatively preserved — the same asymmetry seen in
    the POLD1 sibling disease. An oligoclonal, autoreactive T-cell expansion on a background of
    profound T-cell deficiency is the immunological basis of the Omenn presentation.

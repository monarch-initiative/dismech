genetic:
- name: POLD3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: POLD3
    term:
      id: hgnc:20932
      label: POLD3
  notes: >-
    The causal gene. POLD3 is an accessory subunit of DNA polymerase delta: it stabilises the
    POLD1-POLD2 interaction and, through a C-terminal PIP box, mediates the complex's interaction
    with PCNA. Both published alleles are homozygous missense. p.Ile10Thr abolishes expression of
    all three subunits (the destabilising route); p.Lys373Thr leaves expression intact but
    impairs function (the reduced-activity route). Unlike POLD1, no cancer-predisposition or
    progeroid allele class is described for POLD3 in humans.
  evidence:
  - reference: PMID:38099988
    reference_title: "Human Autosomal Recessive DNA Polymerase Delta 3 Deficiency Presenting as Omenn Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "POLD3, with POLD2 and POLD4, regulate the activity of POLD1, the activity and stability of PolD, and establish protein–protein interactions"
    explanation: >-
      POLD3's role in the complex, quoted from this paper's introduction (hence quote_role
      BACKGROUND) as the established biology a POLD3 lesion disrupts.

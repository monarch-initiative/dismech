  description: >-
    The only reported route to correcting the immune defect. The Omenn patient received HSCT at
    six months from a 10/10 matched unrelated donor after conditioning, with a stem-cell boost
    for low chimerism. It replaces the haematopoietic compartment with cells carrying two working
    POLD3 alleles, but does nothing for the non-haematopoietic features — this patient's
    neurological regression continued and he died at four. Whether a defect in the replicative
    polymerase raises conditioning-related toxicity, as it is feared to in the POLD1 sibling

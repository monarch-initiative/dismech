    notes: >-
      A monogenic inborn error of immunity presenting as a syndromic combined immunodeficiency,
      managed by immunology.
  iuis_category:
    classification_value: combined immunodeficiency with syndromic features
    notes: >-
      IUIS Table 2, combined immunodeficiencies with associated or syndromic features. Both
      published patients carry non-immune syndromic features — sensorineural hearing loss and
      neurodevelopmental delay in the Lebanese patient, growth retardation and facial dysmorphism
      in the Omenn patient — alongside the T-cell defect, which is what distinguishes this from
      the plain combined-immunodeficiency classification used for the POLD1 sibling entry.

discussions:
- discussion_id: imd122_omenn_vs_cid_spectrum
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does one POLD3 genotype present as florid Omenn syndrome with documented DNA damage while
    the other presents as a milder syndromic CID — is it the allele, the degree of residual
    function, or something else?
  rationale: >-
    The two patients differ along two axes at once, which is exactly what makes the question hard.
    The Omenn patient (p.Lys373Thr) has normal subunit expression but impaired function, a marked
    S-phase-entry defect and increased double-strand-break foci, and the full dysregulation
    picture. The Lebanese patient (p.Ile10Thr) has abolished subunit expression — a seemingly more
    severe molecular lesion — but a milder clinical picture of syndromic CID with preserved B-cell
    numbers and no reported Omenn features.

    So the more complete loss of protein does not map to the more severe clinical picture, which
    argues the phenotype is set by residual holoenzyme output and by which downstream processes it
    limits rather than by subunit abundance. Distinguishing the possibilities needs the missing
    measurements: cell-cycle and DNA-damage assays were done only in the Omenn patient, so there
    is no functional comparison of the two alleles in the same assay.
  attaches_to:
  - pathophysiology#Destabilisation of the Polymerase Delta Complex
  - pathophysiology#Impaired Polymerase Delta Function with Intact Complex
  - pathophysiology#Replication-Associated DNA Damage
  evidence:
  - reference: PMID:38099988
    reference_title: "Human Autosomal Recessive DNA Polymerase Delta 3 Deficiency Presenting as Omenn Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Patient fibroblasts showed a marked defect in S-phase entry and an enhanced number of double-stranded DNA break-associated foci despite normal expression levels of PolD components."
    explanation: >-
      The key asymmetry: the clinically more severe (Omenn) patient has normal subunit
      expression, so the severity cannot be read off protein abundance.
- discussion_id: imd122_syndromic_attribution
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Are the developmental and sensorineural features of POLD3 deficiency a direct consequence of
    reduced polymerase delta in dividing non-haematopoietic tissue, as the mouse replication-stress
    phenotype would suggest, or are they confounded by infection and transplant course in the two
    human patients?
  rationale: >-
    The mouse supplies a clean mechanistic prediction: Pold3 loss causes embryonic replication
    stress with brain-preferential phenotypes reminiscent of microcephaly syndromes, so a
    hypomorphic human should show developmental effects. The human data cannot confirm it. No
    non-haematopoietic tissue was examined in either patient; the Lebanese patient's hearing loss
    and developmental delay are reported without mechanism; and the Omenn patient's
    neurodevelopmental course is confounded by his transplant, conditioning and fatal neurological
    regression. The model predicts a direct developmental effect that the human evidence can
    neither establish nor exclude — classified HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP
    because the model evidence exists and the open question is its translational validity, not the
    absence of any evidence.
  attaches_to:
  - pathophysiology#Syndromic Developmental and Sensorineural Features
  - phenotypes#Sensorineural Hearing Loss
  - phenotypes#Global Developmental Delay
  evidence:
  - reference: PMID:27524497
    reference_title: "POLD3 Is Haploinsufficient for DNA Replication in Mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "POLD3 is essential for mouse development and is also required for viability in adult animals"
    explanation: >-
      The model evidence that a POLD3 deficit affects development, which is what makes this a
      model-to-human validity question rather than an absence of evidence.
notes: >-
  Scope and patient count. Two genetically confirmed POLD3 patients are published, each
  homozygous for a different missense variant in an unrelated consanguineous family: p.Ile10Thr
  (Mehawej, Lebanese) and p.Lys373Thr (Riestra, Omenn, Moroccan descent). Three siblings of the
  Lebanese patient died in early childhood of a comparable illness but were not genotyped and are
  not counted here.

  Source attribution. The Mehawej report (PMID:37030525) is abstract-only in the cache; the
  Riestra report (PMID:38099988) is full text and, in its "while this manuscript was in
  preparation" paragraph, summarises the Mehawej patient. Several Lebanese-patient phenotypes are
  therefore quoted from the Riestra paper's summary of that case rather than from the Mehawej
  abstract — the snippet names the patient ("The index case presented at 4y") so the attribution
  is checkable, and the explanation says which paper and which patient each quote belongs to.

  GeneReviews baseline: `just check-genereviews` reports NO_CHAPTER for both GeneReviews and
  StatPearls against the committed Bookshelf index.

  Relationship to the sibling entries. IMD120 (POLD1) and the POLD2 deficiency share this
  mechanism — reduced polymerase delta output causing a proliferation-limited T-cell defect — and
  the three are reported together in the literature as one emerging subgroup. This entry reuses
  that framing where the POLD3 evidence supports it, and notes where POLD3 differs: direct
  documentation of replicative DNA damage (double-strand-break foci), the Omenn presentation in
  one patient, and the absence of a described cancer-predisposition allele class, which POLD1
  has.

  What is not curated. The broader POLD3 literature is dominated by its roles in break-induced
  replication, translesion synthesis and telomere maintenance in cancer cells. That is not a
  mechanism of this inherited immunodeficiency and is left out rather than included with a caveat;
  the mouse haploinsufficiency paper (PMID:27524497) is cited only for the complex-destabilisation
  and developmental-requirement points that bear on the human disease.

name: Immunodeficiency 122
category: Mendelian
creation_date: "2026-10-01T20:28:15Z"
synonyms:
- IMD122
- POLD3 deficiency
- POLD3-associated combined immunodeficiency
- DNA polymerase delta 3 deficiency
- syndromic severe combined immunodeficiency due to POLD3 deficiency
disease_term:
  preferred_term: immunodeficiency 122
  term:
    id: MONDO:0971151
    label: immunodeficiency 122
description: >-
  IMD122 is the syndromic combined immunodeficiency caused by biallelic variants in POLD3, an
  accessory subunit of DNA polymerase delta. Two unrelated patients are published, each
  homozygous for a different missense variant: a Lebanese child of a consanguineous family with
  a syndromic SCID, neurodevelopmental delay and hearing loss, and a boy of Moroccan descent who
  presented as Omenn syndrome and died at four. Three further siblings of the first patient died
  in early childhood of a comparable illness but were not genotyped, so the genetically confirmed
  count is two.

  The mechanism is the same proliferation defect that underlies the sibling polymerase-delta
  immunodeficiencies POLD1 (IMD120) and POLD2. Polymerase delta is a heterotetramer: POLD1
  carries the catalytic activities, POLD2 is the scaffold, and POLD3 and POLD4 regulate the
  activity and stability of the complex and establish its contacts, with POLD3 in particular
  mediating the interaction with PCNA that the holoenzyme needs for processivity. A hypomorphic
  accessory subunit lowers the enzyme's output, which restricts how many cells can enter and
  complete S phase. Lymphocytes expand fastest on demand, so they fail first, and the disease
  presents as a T-cell deficiency.

  The two alleles reach that output by different routes, which is the useful part of having two
  patients. p.Ile10Thr sits in the POLD2-binding region and abolishes expression of POLD3 along
  with POLD1 and POLD2 — the destabilisation route, the same one the POLD1 CysB allele takes.
  p.Lys373Thr sits in a positively charged interdomain region thought to aid DNA binding, and
  leaves the expression of all three subunits intact while impairing function — the
  reduced-activity route. Different lesions, convergent phenotype, which is the argument that the
  disease follows from reduced polymerase delta output rather than from a property of one allele.

  Unlike the POLD1 patients, where DNA repair after genotoxic stress was reported normal, the
  Omenn patient's fibroblasts showed both a marked defect in S-phase entry and an increased
  number of double-strand-break-associated foci, so replicative stress and DNA damage are
  directly documented here. The cell-cycle defect was rescued by re-expressing wild-type POLD3,
  which establishes the direction of causation.

  Clinically it presents in infancy with recurrent infection, profound depletion of naive T
  cells, a restricted T-cell receptor repertoire and defective early TCR recombination. The
  Omenn patient had the full dysregulation picture — erythroderma, alopecia, eosinophilia,
  elevated IgE, lymphadenopathy, hepatosplenomegaly and an absent thymus — and received a
  haematopoietic stem cell transplant at six months. The Lebanese patient had low naive T cells
  with preserved B-cell numbers, sensorineural hearing loss and developmental delay. Both carry
  syndromic non-immune features, which is why the entry is classified as a combined
  immunodeficiency with syndromic features.

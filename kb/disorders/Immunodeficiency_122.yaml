- name: Destabilisation of the Polymerase Delta Complex
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    POLD3 stabilises the POLD1-POLD2 interaction, so a variant in its POLD2-binding region does
    not inactivate one subunit, it lowers the amount of assembled enzyme. In the mouse, deleting
    Pold3 destabilises every member of the complex, which is the model for why one subunit's loss
    drags the others down.

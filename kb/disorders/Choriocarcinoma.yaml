has_subtypes:
- name: Gestational
  display_name: Gestational Choriocarcinoma
  subtype_term:
    preferred_term: Gestational Choriocarcinoma
    term:
      id: NCIT:C4646
      label: Gestational Choriocarcinoma
  description: >-
    The common form, arising from the trophoblast of an antecedent gestation.
    Roughly half of cases follow a complete hydatidiform mole, a quarter follow a
    term pregnancy, and a quarter follow abortion, ectopic or other gestational
    events. Because the tumour genome derives wholly or partly from the paternal
    contribution to that gestation, it is genetically foreign to the patient — a
    partial or complete allograft — which underlies both its intrinsic
    immunogenicity and the STR-genotyping test that identifies it. Gestational
    choriocarcinoma is highly chemosensitive: low-risk disease is cured by
    single-agent methotrexate or dactinomycin, high-risk disease by EMA-CO.
  evidence:
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 50%, 25%, and 25% of gestational choriocarcinoma occur \nafter molar pregnancies, term pregnancies, and other gestational events, \nrespectively."
    explanation: >-
      An IGCS/ESGO Rare Tumor Working Group review quantifies the distribution of
      antecedent gestational events, defining the gestational subtype.
  - reference: PMID:22469506
    reference_title: "The genetics of gestational trophoblastic disease: a rare complication of pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a unique malignancy that is a \npartial or complete allograft with a genotype that is not the same as the host \ngenotype."
    explanation: >-
      Establishes the defining genetic feature of gestational choriocarcinoma —
      a tumour genome distinct from (and partly paternal relative to) the host.
- name: Non-Gestational
  display_name: Non-Gestational (Germ Cell) Choriocarcinoma
  subtype_term:
    preferred_term: Non-gestational (germ cell) choriocarcinoma
    term:
      id: NCIT:C2948
      label: Choriocarcinoma
  description: >-
    A malignant germ cell tumour showing choriocarcinomatous (trophoblastic)
    differentiation but arising from the patient's own genome rather than from a
    gestation. In females it typically occurs in children or young adults, involves
    the ovary, and may be one component of a mixed germ cell tumour; it also occurs
    in the testis and at extragonadal midline sites. Management follows germ cell
    tumour principles — surgical staging and cytoreduction followed by
    bleomycin-based (BEP-type) chemotherapy — rather than the methotrexate/EMA-CO
    algorithm used for gestational disease. It is generally reported as having a
    worse outcome, but the evidence cited here supports the different treatment
    pathway rather than a quantified survival comparison.
    Note on term choice: NCIT:C39991 (Non-Gestational Ovarian Choriocarcinoma) is
    site-restricted, so the generic NCIT:C2948 concept is bound here with a more
    specific preferred_term.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-gestational choriocarcinoma of germ cell origin in\nfemale patients usually occurs in children or in young\nadults, involves the ovary, and may contain other non-\nchoriocarcinomatous components as part of a mixed germ\ncell tumor"
    explanation: >-
      Defines the demographic, anatomic and histologic profile of the
      non-gestational germ cell subtype.
  - reference: PMID:32185550
    reference_title: "Clinicopathological factors and prognosis analysis of 39 cases of non-gestational ovarian choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-gestational ovarian choriocarcinoma (NGOC) is a rare malignant germ \ncell tumor."
    explanation: >-
      A pooled analysis of 39 published cases classifies non-gestational ovarian
      choriocarcinoma as a malignant germ cell tumour, distinct from gestational
      disease.
- name: Intraplacental
  display_name: Intraplacental (Early) Gestational Choriocarcinoma
  subtype_term:
    preferred_term: Gestational Choriocarcinoma
    term:
      id: NCIT:C4646
      label: Gestational Choriocarcinoma
  description: >-
    An exceptionally rare early form in which choriocarcinoma is recognised within
    a term placenta or within the villous tissue of a complete hydatidiform mole,
    before or at the time the antecedent gestation is delivered or evacuated.
    Recognising it matters because it may already have metastasised (classically to
    maternal lung) at a point when the diagnosis would otherwise not be suspected.
  evidence:
  - reference: PMID:41243514
    reference_title: "Early gestational choriocarcinoma: report of two cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, extremely rare cases of GCC diagnosed in molar and in placenta \nspecimens have been described and accepted as early forms of GCC."
    explanation: >-
      Documents intraplacental/intramolar choriocarcinoma as an accepted early
      form of gestational choriocarcinoma.

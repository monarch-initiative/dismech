- name: EMA-CO Multiagent Chemotherapy
  description: >-
    The standard first-line regimen for high-risk (FIGO score 7 or more, or stage
    IV) gestational choriocarcinoma: etoposide, methotrexate and dactinomycin
    alternating weekly with cyclophosphamide and vincristine. It is chosen for a
    favourable toxicity profile, high complete-response rate and high survival. In
    very-high-score disease gentle induction chemotherapy precedes EMA-CO to avoid
    catastrophic haemorrhage from rapid lysis of friable, vascular tumour.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: methotrexate

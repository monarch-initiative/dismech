histopathology:
- name: Biphasic/Triphasic Trophoblastic Proliferation without Chorionic Villi
  finding_term:
    preferred_term: Biphasic trophoblastic proliferation without chorionic villi
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    The defining microscopic pattern: intimately admixed mononuclear trophoblast
    (cytotrophoblast and intermediate trophoblast) and multinucleated
    syncytiotrophoblast, recapitulating the architecture of primitive villous
    trophoblast but without forming chorionic villi. Absence of villi is the
    feature that separates choriocarcinoma from invasive mole. Term note: NCIT
    has no concept for this composite trophoblastic architecture, so the branch
    root NCIT:C35867 Morphologic Finding is bound as the closest available term
    with a more specific `preferred_term`.
  evidence:
  - reference: PMID:41243514
    reference_title: "Early gestational choriocarcinoma: report of two cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its main diagnostic features are a trimorphic population of \ntrophoblast cells and an absence of chorionic villi."
    explanation: >-
      States the two cardinal diagnostic histologic features of gestational
      choriocarcinoma.
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the tumor consists of bi- or triphasic\narrangements of mononuclear trophoblastic cells and\nmultinucleated syncytiotrophoblast."
    explanation: >-
      Confirms the bi-/triphasic trophoblastic architecture is present regardless
      of gestational or germ cell pathogenetic origin.
- name: Extensive Haemorrhage and Necrosis in a Bulky Destructive Mass
  finding_term:
    preferred_term: Confluent tumour necrosis with haemorrhage
    term:
      id: NCIT:C41612
      label: Extensive Necrosis
  description: >-
    Choriocarcinoma grows as a bulky, friable, destructive mass with confluent
    haemorrhage and necrosis, so that viable tumour is often only a thin rim at the
    periphery. This reflects rapid growth outstripping a vasculature the tumour
    itself erodes, and explains the clinical tendency to catastrophic bleeding at
    metastatic sites. No `frequency` band is asserted: the source says the tumour
    "typically forms" such masses, which does not license a quantitative band.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choriocarcinoma typically forms bulky, destructive mass\nlesions with extensive hemorrhage and necrosis within the\ninvolved organ."
    explanation: >-
      Directly describes the gross and microscopic pattern of haemorrhagic,
      necrotic, destructive tumour masses.
- name: Marked Nuclear Atypia with Brisk and Atypical Mitotic Activity
  finding_term:
    preferred_term: Marked nuclear atypia with brisk mitotic activity
    term:
      id: NCIT:C51139
      label: Marked Nuclear Atypia Present
  description: >-
    Nuclei are markedly atypical, often bizarre, with a high mitotic rate including
    atypical mitotic figures and a very high Ki-67 proliferation index. This
    extreme proliferative fraction is the cytological correlate of the tumour's
    aggressiveness and, reciprocally, of its exceptional sensitivity to
    antimetabolite and antimitotic chemotherapy. No `frequency` band is asserted:
    the sources describe brisk mitotic activity qualitatively and report Ki-67
    above 90% in a single documented case, neither of which supports a
    quantitative band.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nuclear atypia is\nmarked, often with bizarre nuclei and there is brisk mitotic\nactivity"
    explanation: >-
      Describes the cytological grade of choriocarcinoma.
  - reference: PMID:41243514
    reference_title: "Early gestational choriocarcinoma: report of two cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "marked \ncytological atypia and high mitotic activity with Ki-67 \nimmunostaining\u00a0 >\u00a0 90%"
    explanation: >-
      A histologically documented case shows a Ki-67 proliferation index above
      90% alongside the marked atypia.
- name: SALL4 Expression in Both Gestational and Germ Cell Choriocarcinoma
  finding_term:
    preferred_term: SALL4 immunoreactivity
    term:
      id: NCIT:C40998
      label: Immunophenotypic Finding
  diagnostic: false
  description: >-
    Trophoblastic immunohistochemical markers confirm trophoblastic
    differentiation but do not distinguish gestational from non-gestational
    choriocarcinoma; SALL4, a germ cell marker, is expressed in choriocarcinoma of
    both origins. This immunohistochemical blind spot is precisely why DNA
    genotyping is required to separate the two.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SALL4 is expressed in\nchoriocarcinoma of both germ cell and gestational origin"
    explanation: >-
      Documents that SALL4 immunostaining cannot discriminate germ cell from
      gestational choriocarcinoma, motivating molecular genotyping.
pathophysiology:
- name: Paternal Genome Content and Semi-Allogeneic Tumour Identity
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Gestational choriocarcinoma derives from the trophoblast of a prior conceptus,
    so its genome contains a paternal allele complement that is absent from the
    patient's own tissues. In the most common precursor, the complete hydatidiform
    mole, the conceptus genome is entirely androgenetic. The tumour is therefore a
    partial or complete natural allograft. Two consequences follow and organise the
    rest of the pathograph: detection of that foreign paternal allele set by STR
    genotyping definitively separates gestational from non-gestational
    choriocarcinoma, which matters because the two are treated differently; and the
    allogeneic tumour is intrinsically immunogenic and must actively suppress host
    T cells to survive. Non-gestational (germ cell) choriocarcinoma, by contrast,
    carries only the patient's own genome and lacks this feature. The imprinting
    biology of the molar precursor itself (CDKN1C/p57 loss) is curated in
    Hydatidiform_Mole and Gestational_Trophoblastic_Neoplasm.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  notes: >-
    No `biological_processes` term is asserted on this node. The obvious
    candidate, GO:0071514 genomic imprinting, would over-claim: the evidence
    here concerns paternal genome *content* (an allele complement foreign to the
    host), not the imprinting *process*, and the imprinting mechanics of the
    molar precursor are deliberately curated in Hydatidiform_Mole and
    Gestational_Trophoblastic_Neoplasm rather than restated here.
  evidence:
  - reference: PMID:22469506
    reference_title: "The genetics of gestational trophoblastic disease: a rare complication of pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a unique malignancy that is a \npartial or complete allograft with a genotype that is not the same as the host \ngenotype."
    explanation: >-
      Establishes the allogeneic (partly paternal) genome of gestational
      choriocarcinoma as its defining molecular feature.
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotyping detection of a\ndistinct paternal genetic complement not present in the\npatient’s normal tissues"
    explanation: >-
      Confirms that a paternal allele complement absent from host tissue is the
      operational marker of gestational origin.
  downstream:
  - target: Neoplastic Trophoblastic Transformation without Villous Formation
    description: >-
      Malignant transformation of the (often androgenetic) trophoblast of the
      antecedent gestation gives rise to the tumour cell population.
    evidence:
    - reference: PMID:22469506
      reference_title: "The genetics of gestational trophoblastic disease: a rare complication of pregnancy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is most often preceded by an abnormal molar pregnancy."
      explanation: >-
        Links the antecedent (usually molar) gestation to the emergence of the
        choriocarcinoma cell population.
  - target: PD-L1-Mediated Adaptive Immune Resistance
    description: >-
      Allogeneic tumour identity makes the neoplasm immunogenic, creating the
      selective pressure for checkpoint-ligand-mediated immune evasion.
    evidence:
    - reference: PMID:22469506
      reference_title: "The genetics of gestational trophoblastic disease: a rare complication of pregnancy."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "It is a unique malignancy that is a \npartial or complete allograft with a genotype that is not the same as the host \ngenotype."
      explanation: >-
        The allograft identity of the tumour is what makes it a target for host
        immunity. The step from that to a selection pressure for PD-L1-mediated
        escape is an inference, not a statement in the source, hence PARTIAL.
- name: Neoplastic Trophoblastic Transformation without Villous Formation
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The transformed cell population reconstitutes the two differentiation states of
    early implanting trophoblast — a proliferative mononuclear cytotrophoblast
    compartment and a fused, hormonally active syncytiotrophoblast compartment —
    but does so as a solid, sheet-like proliferation that never organises chorionic
    villi. Loss of the villous scaffold is not a cosmetic difference: villous
    architecture normally constrains trophoblast to a defined invasive front, and
    its absence accompanies unconstrained, vessel-permeating growth. The
    proliferative fraction is extreme (Ki-67 often above 90%), with marked nuclear
    atypia and atypical mitoses.
  cell_types:
  - preferred_term: mononuclear cytotrophoblast cell
    term:
      id: CL:0000523
      label: mononuclear cytotrophoblast cell
  - preferred_term: syncytiotrophoblast cell
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the tumor consists of bi- or triphasic\narrangements of mononuclear trophoblastic cells and\nmultinucleated syncytiotrophoblast."
    explanation: >-
      Establishes the two-compartment neoplastic trophoblast population that
      defines the tumour.
  - reference: PMID:41243514
    reference_title: "Early gestational choriocarcinoma: report of two cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its main diagnostic features are a trimorphic population of \ntrophoblast cells and an absence of chorionic villi."
    explanation: >-
      Confirms the absence of chorionic villi as an intrinsic feature of the
      transformed trophoblast population.
  downstream:
  - target: hCG Hypersecretion by Neoplastic Syncytiotrophoblast
    description: >-
      The syncytiotrophoblast compartment retains and amplifies its endocrine
      program.
    evidence:
    - reference: PMID:34088998
      reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "the tumor consists of bi- or triphasic\narrangements of mononuclear trophoblastic cells and\nmultinucleated syncytiotrophoblast."
      explanation: >-
        The snippet establishes that a multinucleated syncytiotrophoblast
        compartment is present in the tumour, but says nothing about hormone
        output; the step to hCG secretion is inferred from normal
        syncytiotrophoblast biology, hence PARTIAL.
  - target: Deregulated Trophoblast Invasion and Vascular Permeation
    description: >-
      The mononuclear/intermediate trophoblast compartment retains its invasive
      program, now unconstrained by villous architecture.
    evidence:
    - reference: PMID:40588865
      reference_title: "Gestational Choriocarcinoma: A Timely Review of Diagnostic Pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is characterized by aggressive, destructive growth \nand a marked tendency for hematogenous spread"
      explanation: >-
        Couples the transformed trophoblast population directly to destructive,
        vessel-permeating growth.
  - target: VEGF-Driven Neoangiogenesis
    description: >-
      The transformed trophoblast population drives the VEGF-dependent
      neovascularisation that supplies the rapidly expanding mass.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: High Proliferative Fraction and Chemosensitivity
    description: >-
      The extreme proliferative index that drives aggressiveness simultaneously
      creates the therapeutic vulnerability.
    evidence:
    - reference: PMID:41243514
      reference_title: "Early gestational choriocarcinoma: report of two cases and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "high mitotic activity with Ki-67 \nimmunostaining\u00a0 >\u00a0 90%"
      explanation: >-
        Documents the near-maximal proliferative fraction of the transformed
        trophoblast population.
- name: hCG Hypersecretion by Neoplastic Syncytiotrophoblast
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Neoplastic syncytiotrophoblast retains the endocrine function of normal
    placental syncytiotrophoblast and secretes human chorionic gonadotropin in
    quantities proportional to viable tumour burden. Because hCG is essentially
    absent in the non-pregnant state, this converts an internal, often
    radiographically occult tumour into a continuously measurable quantity: hCG
    establishes the diagnosis (a plateauing or rising titre after evacuation),
    contributes a weighted term to the FIGO/WHO prognostic score, tracks response
    during chemotherapy, and detects relapse. It is the reason gestational
    trophoblastic neoplasia can be treated to a biochemical endpoint without tissue
    confirmation.
  cell_types:
  - preferred_term: syncytiotrophoblast cell
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:
  - preferred_term: gonadotropin secretion
    modifier: INCREASED
    term:
      id: GO:0032274
      label: gonadotropin secretion
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GTN is nowadays diagnosed primarily based on\nserum hCG measurement combined with imaging studies."
    explanation: >-
      Shows that tumour-derived hCG is sufficient in practice to diagnose and
      manage gestational trophoblastic neoplasia without tissue.
  - reference: PMID:20673583
    reference_title: "Gestational trophoblastic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the use of human chorionic gonadotropin as a biomarker"
    explanation: >-
      An authoritative Lancet review identifies tumour-secreted hCG as the
      central biomarker of trophoblastic neoplasia.
  downstream:
  - target: Paraneoplastic Consequences of Extreme hCG Elevation
    description: >-
      At very high circulating concentrations hCG cross-activates receptors for
      structurally related glycoprotein hormones and overstimulates the ovary.
    evidence:
    - reference: PMID:38008872
      reference_title: "Review of current literature on gestational trophoblastic neoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Raised levels of human chorionic gonadotrophin (hCG) (>100,000 m IU/ml) may cause symptoms of hyperthyroidism, hyperemesis, pre-eclampsia and rarely virilization by ovarian theca lutein cyst formation"
      explanation: >-
        Establishes the dose-dependent causal link between very high hCG and the
        paraneoplastic endocrine syndromes.
- name: Paraneoplastic Consequences of Extreme hCG Elevation
  biological_scale: ORGANISM
  role: consequence
  description: >-
    hCG shares an alpha subunit with TSH, LH and FSH and is a weak agonist at the
    thyrotropin receptor; when tumour-derived concentrations exceed roughly
    100,000 mIU/mL, that weak cross-reactivity becomes clinically significant and
    produces biochemical or overt hyperthyroidism. The same extreme
    gonadotropin-like signal overstimulates the ovaries, producing bilateral
    theca-lutein cysts (occasionally with virilisation), and is associated with
    hyperemesis and pre-eclampsia. These paraneoplastic features are a direct
    dose-dependent consequence of the biomarker itself rather than of tumour mass,
    and they resolve as hCG falls with treatment.
  cell_types:
  - preferred_term: syncytiotrophoblast cell
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:
  - preferred_term: gonadotropin secretion
    modifier: INCREASED
    term:
      id: GO:0032274
      label: gonadotropin secretion
  evidence:
  - reference: PMID:38008872
    reference_title: "Review of current literature on gestational trophoblastic neoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Raised levels of human chorionic gonadotrophin (hCG) (>100,000 m IU/ml) may cause symptoms of hyperthyroidism, hyperemesis, pre-eclampsia and rarely virilization by ovarian theca lutein cyst formation"
    explanation: >-
      Directly links hCG concentrations above 100,000 mIU/mL to hyperthyroidism,
      hyperemesis, pre-eclampsia and theca-lutein cyst formation, establishing
      these as dose-dependent paraneoplastic consequences of the hormone.
- name: Deregulated Trophoblast Invasion and Vascular Permeation
  biological_scale: CELLULAR
  role: effector
  conforms_to: "invasion_and_metastasis#Local Invasion and Intravasation"
  description: >-
    Normal extravillous trophoblast is physiologically one of the most invasive
    cell types in human biology: it penetrates decidua and myometrium and remodels
    spiral arteries, and it does so as a tightly regulated, self-limiting program.
    Choriocarcinoma is that program run without its brakes. Tumour trophoblast
    permeates myometrium and directly invades vascular channels, so intravasation
    is an early rather than a late event — this is the mechanistic reason
    choriocarcinoma metastasises hematogenously at small primary volumes and may
    present with a metastasis before any uterine lesion is apparent. Conformance
    note: the module's canonical upstream driver is EMT activation in a somatic
    epithelium; here the invasive phenotype is a retained developmental program of
    trophoblast rather than a de-differentiation event, so this node conforms at
    the invasion/intravasation step without asserting the module's EMT trigger node.

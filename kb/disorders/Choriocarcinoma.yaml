      haemorrhagic risk that dictates gentle induction chemotherapy.
- name: PD-L1-Mediated Adaptive Immune Resistance
  biological_scale: CELLULAR
  role: adaptive_escape
  conforms_to: "immune_checkpoint_blockade#Adaptive Immune Resistance"
  description: >-
    Gestational choriocarcinoma is an allograft growing in an immunocompetent host,
    which should be rejected — and occasionally is, since spontaneous regressions of
    metastatic disease are recorded. To survive, the tumour co-opts the same
    PD-1/PD-L1 axis that normal placental trophoblast uses to maintain fetomaternal
    tolerance: PD-L1 is expressed strongly and essentially uniformly by neoplastic
    trophoblast, engaging PD-1 on tumour-infiltrating T cells and shutting down the
    anti-tumour response. This is an unusually clean example of adaptive immune
    resistance, because the antigenic stimulus (a foreign paternal genome) is known
    rather than inferred, and it is directly druggable.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: syncytiotrophoblast cell
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:

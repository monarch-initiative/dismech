      extensive-burden disease.
- name: Surgical Staging with Bleomycin-Based Chemotherapy (Non-Gestational Disease)
  description: >-
    Non-gestational (germ cell) choriocarcinoma is not managed on the GTN
    algorithm. It requires surgical staging and cytoreduction — achieving an R0
    resection is a favourable prognostic factor — followed by bleomycin-based
    (BEP-type: bleomycin, etoposide, cisplatin) germ cell chemotherapy. Applying
    the methotrexate/EMA-CO pathway to a non-gestational tumour is a recognised
    treatment error, which is why STR genotyping precedes therapy when origin is
    uncertain.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germ cell choriocarcinoma requires surgical staging\nfollowed by bleomycin-based chemotherapy."
    explanation: >-
      States the distinct germ cell treatment pathway for non-gestational
      choriocarcinoma.
  - reference: PMID:32185550
    reference_title: "Clinicopathological factors and prognosis analysis of 39 cases of non-gestational ovarian choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians should try to achieve R0 resection to improve the \nprognosis for NGOC patients even among advanced patients."
    explanation: >-
      A pooled analysis of 39 cases identifies complete (R0) surgical resection
      as a favourable prognostic factor in non-gestational ovarian
      choriocarcinoma.
- name: Adjuvant Surgery (Hysterectomy or Resection of Resistant Foci)
  description: >-
    Surgery has a defined adjunctive role in gestational choriocarcinoma: excision
    of chemoresistant foci (uterine or pulmonary) in high-risk disease, and
    hysterectomy for localised drug-resistant uterine tumour or in women who have
    completed childbearing. It is not primary therapy for chemosensitive disease,
    where the goal is cure without surgery and preservation of fertility.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Hysterectomy
    term:
      id: NCIT:C15256
      label: Hysterectomy
  evidence:
  - reference: PMID:34669197
    reference_title: "Diagnosis and management of gestational trophoblastic disease: 2021 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with or without adjuvant \nsurgery for excision of resistant foci of disease"
    explanation: >-
      The FIGO 2021 update defines adjuvant surgery as excision of resistant
      disease foci in high-risk GTN.
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chemotherapy \nfor localized disease has a goal of eradication of disease without surgery and \nis associated with favorable prognosis and fertility preservation."
    explanation: >-
      Confirms that surgery is deliberately avoided in localised chemosensitive
      disease so that fertility is preserved.
- name: EMA-EP and Platinum/Taxane Salvage Chemotherapy
  description: >-
    Roughly 30-40% of patients develop a rising hCG after completing EMA-CO. The
    first-line cytotoxic salvage is EMA-EP (etoposide, methotrexate,
    dactinomycin alternating with etoposide and cisplatin), which achieves a
    response rate near 85%. Patients progressing on EMA-EP move to
    platinum/taxane doublets alternating as TP/TE, and thereafter to germ-cell
    regimens. This cytotoxic salvage ladder sits alongside, not instead of,
    checkpoint blockade for the multidrug-resistant population.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
    - preferred_term: actinomycin D
      term:
        id: CHEBI:27666
        label: actinomycin D
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: paclitaxel
      term:
        id: CHEBI:45863
        label: paclitaxel
  target_mechanisms:
  - target: Multidrug-Resistant Refractory Disease
    treatment_effect: INHIBITS
    description: >-
      Introducing platinum and taxane mechanisms not present in EMA-CO
      re-establishes cytotoxic pressure on clones that survived the first-line
      regimen.
    evidence:
    - reference: PMID:38008872
      reference_title: "Review of current literature on gestational trophoblastic neoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Such patients can be salvaged with EMA-EP, which shows a response rate of 84.9%"
      explanation: >-
        Quantifies the salvage response rate of EMA-EP in patients whose hCG
        rises after EMA-CO.
  evidence:
  - reference: PMID:38008872
    reference_title: "Review of current literature on gestational trophoblastic neoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 30 \u2013 40% of patients developed increased beta HCG levels post-completion of treatment with EMA-CO"
    explanation: >-
      Establishes both the size of the post-EMA-CO relapse population and the
      efficacy of EMA-EP salvage.
  - reference: PMID:38008872
    reference_title: "Review of current literature on gestational trophoblastic neoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who develop methotrexate resistance, i.e., have also progressed on EMA-EP, can be treated with a combination of paclitaxel and cisplatin weekly alternating with paclitaxel and etoposide (TP/TE)"
    explanation: >-
      Defines the next rung of the salvage ladder after EMA-EP failure.
- name: CNS-Penetrating High-Dose Methotrexate EMA-CO for Cerebral Metastases
  description: >-
    Contemporary first-line practice for brain metastases is CNS-penetrating
    systemic therapy rather than radiation by default: EMA-CO is given with a
    higher dose and slower infusion of methotrexate (1000 mg/m2 over 12-24
    hours) to achieve adequate cerebrospinal-fluid levels, which produces
    complete responses and can negate the need for whole-brain radiotherapy,
    with reported five-year survival of 81.5%.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  regimen_term:
    preferred_term: EMA-CO regimen
    term:
      id: NCIT:C67511
      label: EMA-CO Regimen
  target_mechanisms:
  - target: Hematogenous Dissemination and Pulmonary Colonisation
    treatment_effect: INHIBITS
    description: >-
      Dose-intensified methotrexate reaches the CNS compartment that standard
      EMA-CO dosing does not, and so acts on colonised brain deposits rather
      than only on the systemic tumour burden.
  evidence:
  - reference: PMID:38008872
    reference_title: "Review of current literature on gestational trophoblastic neoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the same regimen of EMA-CO but with a higher dose and infusion rate of methotrexate (1000mg/m2 given over 12 to 24 hours) is administered. This allows an adequate dose of methotrexate within the cerebrospinal fluid (CSF) which provides a complete response in patients negating the need for whole brain radiation"
    explanation: >-
      Establishes CNS-penetrating high-dose methotrexate within EMA-CO as the
      contemporary approach to brain metastases, displacing routine whole-brain
      radiotherapy.
- name: Adjunctive Cranial Radiotherapy for Cerebral Metastases
  description: >-
    Radiotherapy is retained as an adjunct to multiagent chemotherapy for brain
    metastases in high-risk disease, both for local control and to reduce the
    risk of intracranial haemorrhage. It is no longer the default CNS-directed
    modality; that role has passed to CNS-penetrating high-dose methotrexate.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Haemorrhagic Destruction of Colonised Organs
    treatment_effect: INHIBITS
    description: >-
      Cranial irradiation is given for local control of colonised brain deposits
      and specifically to reduce the risk of the intracranial haemorrhage that
      this node produces.
  evidence:
  - reference: PMID:34669197
    reference_title: "Diagnosis and management of gestational trophoblastic disease: 2021 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "or radiotherapy for brain \nmetastases"
    explanation: >-
      The FIGO 2021 update retains radiotherapy for brain metastases as an
      adjunct to multiagent chemotherapy in high-risk GTN.
- name: PD-1/PD-L1 Immune Checkpoint Blockade
  description: >-
    Anti-PD-1 (pembrolizumab) and anti-PD-L1 (avelumab) antibodies target the
    checkpoint axis that the allogeneic tumour uses to escape host T cells.
    Response rates of 50-70% are reported, and the principal role is in
    chemoresistant disease: in the TROPHIMMUN phase II trial avelumab was active in
    GTN resistant to single-agent chemotherapy, though not after multiagent
    failure. Checkpoint blockade is also being explored to de-escalate or replace
    cytotoxic therapy in young women for whom long-term chemotherapy toxicity
    matters, and in combination with VEGFR-2-directed agents.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: avelumab
      term:
        id: NCIT:C116870
        label: Avelumab
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  target_mechanisms:
  - target: PD-L1-Mediated Adaptive Immune Resistance
    treatment_effect: INHIBITS
    description: >-
      Blocking PD-1/PD-L1 engagement releases tumour-infiltrating T cells from
      inhibition and restores an immune response against the semi-allogeneic
      tumour.
    evidence:
    - reference: PMID:37703867
      reference_title: "Immunotherapy for Gestational Trophoblastic Neoplasia: A New Paradigm."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immune checkpoint immunotherapy (CPI) targeting programmed cell \ndeath 1 (PD-1)/ligand (PD-L1) has been shown to be an effective treatment for \ngestational trophoblastic neoplasia (GTN)."
      explanation: >-
        Demonstrates that blocking the PD-1/PD-L1 axis is therapeutically
        effective, confirming the axis as the operative treatment target.
  evidence:
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the treatment response with immunotherapy is high, ranging \nbetween 50-70%."
    explanation: >-
      Quantifies response to checkpoint immunotherapy in gestational
      choriocarcinoma.
  - reference: PMID:35681761
    reference_title: "Current Evidence on Immunotherapy for Gestational Trophoblastic Neoplasia (GTN)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In the TROPHIMMUN trial, Avelumab, a monoclonal antibody \ninhibiting PD-L1, showed promising results only in patients with GTN resistant \nto monochemotherapy."
    explanation: >-
      Delimits the efficacy of avelumab to GTN resistant to single-agent rather
      than multiagent chemotherapy; marked PARTIAL because the same review
      reports failure and toxicity after multiagent resistance.
clinical_trials:
- name: NCT03135769
  phase: PHASE_II
  status: COMPLETED
  description: >-
    TROPHIMMUN — a phase II trial of the anti-PD-L1 antibody avelumab in
    chemoresistant gestational trophoblastic neoplasia, built on the rationale that
    GTN hijacks placental PD-L1-mediated immune tolerance to escape rejection.
  target_phenotypes:
  - preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
  evidence:
  - reference: clinicaltrials:NCT03135769
    reference_title: "A Phase II Trial of Avelumab in Chemo-resistant Gestational Trophoblastic Neoplasias (GTN)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strong and constant overexpression of PDL1 and NK cells has been found in all subtypes and settings of GTN tumors from French reference gestational trophoblastic center."
    explanation: >-
      The trial's own rationale documents strong, constant PD-L1 overexpression
      across GTN subtypes, the mechanistic basis for checkpoint blockade in
      choriocarcinoma.
- name: NCT05139095
  phase: PHASE_II
  status: RECRUITING
  description: >-
    An open-label phase II cohort trial of the anti-PD-1 antibody camrelizumab
    combined with the VEGFR-2 inhibitor apatinib plus chemotherapy in ultra
    high-risk and in chemo-refractory or relapsed high-risk gestational
    trophoblastic neoplasia — the checkpoint-plus-antiangiogenic combination
    strategy for the multidrug-resistant population.
  target_phenotypes:
  - preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
  evidence:
  - reference: clinicaltrials:NCT05139095
    reference_title: "Camrelizumab Plus Apatinib in Patients With High-risk Gestational Trophoblastic Neoplasia: a Cohort, Open-label, Phase 2 Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "evaluate the efficacy and safety of camrelizumab and apatinib as combination therapy in patients with ultra high-risk (Cohort A) and high-risk chemo-refractory or relapsed (Cohort B) gestational trophoblastic neoplasia (GTN)"
    explanation: >-
      Documents an active trial of combined PD-1 blockade and VEGFR-2 inhibition
      targeting the multidrug-resistant population identified in the
      pathophysiology as the residual unmet need.
classifications:
  icdo_morphology:
    classification_value: Carcinoma
    evidence:
    - reference: PMID:40588865
      reference_title: "Gestational Choriocarcinoma: A Timely Review of Diagnostic Pathology."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Gestational choriocarcinoma is the most common form of gestational \ntrophoblastic neoplasm."
      explanation: >-
        Confirms choriocarcinoma as a trophoblastic (epithelial) neoplasm;
        marked PARTIAL because the source states the tumour class rather than
        the ICD-O morphology code itself, which is taken from the MONDO
        ICDO:9100/3 cross-reference.
    notes: >-
      Choriocarcinoma is ICD-O morphology code 9100/3, an epithelial
      (trophoblastic) malignancy. The dismech ICDOMorphologyEnum has no
      trophoblastic axis value, so the closest available parent, Carcinoma, is
      assigned; MONDO:0005207 carries the ICDO:9100/3 cross-reference.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:40588865
      reference_title: "Gestational Choriocarcinoma: A Timely Review of Diagnostic Pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gestational choriocarcinoma is the most common form of gestational \ntrophoblastic neoplasm."
      explanation: >-
        Choriocarcinoma is a malignant neoplasm, placing it in the
        oncology/haematology chapter of Harrison's.

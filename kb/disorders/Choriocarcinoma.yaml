    term:
      id: GO:0002841
      label: negative regulation of T cell mediated immune response to tumor cell
  evidence:
  - reference: PMID:30339966
    reference_title: "Analysis of PD-L1 expression in trophoblastic tissues and tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All gestational choriocarcinomas (CCs; n = \n63), epithelioid trophoblastic tumors (n = 12), and placental site trophoblastic \ntumors (n = 41) were PD-L1 positive, with most showing strong staining."
    explanation: >-
      An immunohistochemical series of 63 gestational choriocarcinomas found
      uniform, mostly strong PD-L1 positivity.
  - reference: PMID:37703867
    reference_title: "Immunotherapy for Gestational Trophoblastic Neoplasia: A New Paradigm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immune checkpoint immunotherapy (CPI) targeting programmed cell \ndeath 1 (PD-1)/ligand (PD-L1) has been shown to be an effective treatment for \ngestational trophoblastic neoplasia (GTN)."
    explanation: >-
      Clinical efficacy of PD-1/PD-L1 blockade demonstrates that this axis is an
      operative, load-bearing immune-resistance mechanism rather than a passive
      marker.
  downstream:
  - target: Multidrug-Resistant Refractory Disease
    description: >-
      Immune escape sustains a residual tumour population that can also evolve
      chemoresistance; conversely, checkpoint blockade can salvage it.
    evidence:
    - reference: PMID:37703867
      reference_title: "Immunotherapy for Gestational Trophoblastic Neoplasia: A New Paradigm."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This includes those with multidrug \nresistance, ultra-high-risk disease, and epithelioid trophoblastic \ntumour/placental site trophoblastic tumour subtypes that are inherently \nchemotherapy resistant"
      explanation: >-
        Checkpoint blockade is effective specifically in the multidrug-resistant
        population, linking the immune-escape node to refractory disease.
- name: High Proliferative Fraction and Chemosensitivity
  biological_scale: CELLULAR
  role: therapeutic_vulnerability
  description: >-
    The same feature that makes choriocarcinoma lethal untreated — a near-maximal
    proliferative fraction with Ki-67 frequently above 90% — makes it exceptionally
    vulnerable to cell-cycle-dependent cytotoxics. Antifolate (methotrexate),
    intercalating/transcription-blocking (dactinomycin), topoisomerase-II
    (etoposide), alkylating (cyclophosphamide) and antimitotic (vincristine) agents
    all act preferentially on rapidly cycling cells. Combined with a quantitative
    serum biomarker that permits treatment to a biochemical endpoint, this makes
    gestational choriocarcinoma one of the most curable of all solid malignancies —
    single-agent therapy cures low-risk disease and EMA-CO cures the great majority
    of high-risk disease. Non-gestational germ cell choriocarcinoma does not share
    this degree of sensitivity to the GTN regimens and is treated on germ cell lines.
    Modelling note: this node deliberately bundles a cellular property (near-maximal
    proliferative fraction) with the therapeutic-response property it produces,
    because the chemosensitivity is the clinically load-bearing consequence and
    three cytotoxic treatments attach to it via `target_mechanisms`. A future
    refactor could split it into a proliferation node and a drug-response node.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gestational choriocarcinoma is highly chemosensitive\nand responds well to single-agent methotrexate (low-risk\ndisease) or EMA-CO (etoposide, methotrexate, actinomycin\nD, cyclophosphamide, vincristine) combination che-\nmotherapy (high-risk disease) with an excellent prognosis"
    explanation: >-
      States the exceptional chemosensitivity of gestational choriocarcinoma and
      the risk-stratified regimens that exploit it.
  - reference: PMID:41243514
    reference_title: "Early gestational choriocarcinoma: report of two cases and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "high mitotic activity with Ki-67 \nimmunostaining\u00a0 >\u00a0 90%"
    explanation: >-
      Documents the very high proliferation index in a histologically confirmed
      case; this is the cellular substrate of the chemosensitivity claim, though
      a single case does not itself establish the causal link.
  downstream:
  - target: Multidrug-Resistant Refractory Disease
    description: >-
      A minority of tumours survive selection pressure from the standard regimens
      and become the dominant cause of death.
    evidence:
    - reference: PMID:37758451
      reference_title: "Gestational choriocarcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most patients \nwith gestational choriocarcinoma are cured with chemotherapy; however, some \n(<5.0%) will die as a result of multi-drug resistance"
      explanation: >-
        Quantifies the small fraction of tumours that escape the chemosensitivity
        of the disease and become refractory.
- name: Multidrug-Resistant Refractory Disease
  biological_scale: CELLULAR
  role: outcome
  description: >-
    Fewer than 5% of women with gestational choriocarcinoma die, and when they do
    it is overwhelmingly from disease that has become resistant to multiple
    cytotoxic agents rather than from untreated bulk. This small refractory
    population — together with the inherently less chemosensitive non-gestational
    and intermediate-trophoblast tumours — is the entire remaining unmet need in an
    otherwise near-curable disease, and is the population in which PD-1/PD-L1
    blockade has produced durable responses.
  evidence:
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients \nwith gestational choriocarcinoma are cured with chemotherapy; however, some \n(<5.0%) will die as a result of multi-drug resistance, underscoring the need for \nnovel approaches in this group of patients."
    explanation: >-
      Quantifies multidrug resistance as the residual cause of mortality and the
      driver of novel-therapy development.

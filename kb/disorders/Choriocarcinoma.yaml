        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
  regimen_term:
    preferred_term: EMA-CO regimen
    term:
      id: NCIT:C67511
      label: EMA-CO Regimen
  target_mechanisms:
  - target: High Proliferative Fraction and Chemosensitivity
    treatment_effect: INHIBITS
    description: >-
      Five agents with complementary cell-cycle-dependent mechanisms are combined
      to suppress emergence of resistant clones.
    evidence:
    - reference: PMID:34088998
      reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "EMA-CO (etoposide, methotrexate, actinomycin\nD, cyclophosphamide, vincristine) combination che-\nmotherapy (high-risk disease) with an excellent prognosis"
      explanation: >-
        The five-agent combination achieves an excellent prognosis in high-risk
        disease, evidencing the multi-mechanism attack on the proliferating
        tumour.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EMA-CO (etoposide, methotrexate, actinomycin\nD, cyclophosphamide, vincristine) combination che-\nmotherapy (high-risk disease) with an excellent prognosis"
    explanation: >-
      Names the EMA-CO components and its role in high-risk gestational
      choriocarcinoma.
  - reference: PMID:34669197

    reference_title: "Review of current literature on gestational trophoblastic neoplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "About 11% of GTN patients have brain metastasis on presentation"
    explanation: >-
      Quantifies brain metastasis at presentation at about 11%, which maps to the
      OCCASIONAL (5-29%) frequency band; marked PARTIAL because the figure is
      for gestational trophoblastic neoplasia as a whole rather than
      choriocarcinoma specifically.
- category: Hepatic
  name: Hepatic Metastases
  description: >-
    Liver deposits are uncommon but carry a poor prognosis and, like brain
    metastases, score the maximum 4 points on the FIGO metastatic-site axis. They
    are the source of the life-threatening intra-abdominal bleeding annotated
    separately as a distinct phenotype in this entry.
  phenotype_term:
    preferred_term: Neoplasm of the liver
    term:
      id: HP:0002896
      label: Neoplasm of the liver
  evidence:
  - reference: PMID:36286620
    reference_title: "Advances in diagnostics and management of gestational trophoblastic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver metastases are rare \nand often have a poor prognosis"
    explanation: >-
      States that liver metastases are uncommon and prognostically adverse. No
      `frequency` band is asserted: the prose word "rare" carries no numerator
      and reported liver involvement in high-risk disease is well above the
      VERY_RARE (1-4%) band.
biochemical:
- name: Serum Human Chorionic Gonadotropin (total hCG)
  presence: INCREASED
  biomarker_term:
    preferred_term: Human Chorionic Gonadotropin
    term:
      id: NCIT:C2275
      label: Human Chorionic Gonadotropin
  context: >-
    Markedly elevated and proportional to viable tumour burden; used for diagnosis,
    FIGO/WHO risk scoring, response monitoring and relapse detection.
  notes: >-
    hCG is the operational endpoint of therapy in gestational trophoblastic
    neoplasia: chemotherapy is continued to normalisation and then consolidated,
    and a plateauing or rising titre defines resistance. Pre-treatment hCG is one
    of eight weighted terms in the FIGO/WHO prognostic score. Assay caveats matter
    clinically — heterophile-antibody interference produces so-called phantom hCG
    and can prompt unnecessary chemotherapy, and the high-dose hook effect can
    spuriously lower very high results unless the sample is diluted. The analyte
    is deliberately bound to the TOTAL hCG LOINC code 19080-1 rather than the
    free beta-subunit code 21198-7: gestational trophoblastic neoplasia
    monitoring and the FIGO/WHO score both use a total-hCG assay, even though
    "beta-hCG" is the usual clinical shorthand.
  reference_ranges:
  - loinc_term:
      id: LOINC:19080-1
      label: Choriogonadotropin [Units/volume] in Serum or Plasma
    upper_bound: 5.0
    unit: IU/L
    population: non-pregnant women
    evidence:
    - reference: PMID:32761058
      reference_title: "Current Practices When Reporting Quantitative Human Chorionic Gonadotropin Test Results."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite a well-established reference limit of <5.0 IU/L for nonpregnant women"
      explanation: >-
        A survey of 3568 clinical laboratories states the well-established
        non-pregnant upper reference limit of 5.0 IU/L, which is also the
        threshold most commonly used when hCG is ordered as a tumour marker.
    notes: >-
      The interpretation bands above the normal range are the pre-treatment serum
      hCG tiers of the modified WHO prognostic scoring system as adapted by FIGO
      (scores 0, 1, 2 and 4). They are prognostic strata, not analytic decision
      limits, and apply only to the pre-treatment measurement.
    interpretation_bands:
    - name: Non-pregnant reference range
      upper_bound: 5.0
      unit: IU/L
      abnormal_flag: NORMAL
      interpretation: >-
        Below the non-pregnant upper reference limit; in a treated patient,
        normalisation of hCG is the endpoint that defines complete biochemical
        remission.
    - name: Elevated, FIGO pre-treatment hCG score 0
      lower_bound: 5.0
      upper_bound: 1000.0
      unit: IU/L
      abnormal_flag: HIGH
      interpretation: >-
        Elevated but within the lowest FIGO pre-treatment hCG tier (below 10^3
        IU/L), which contributes 0 points to the prognostic score.
    - name: FIGO pre-treatment hCG score 1
      lower_bound: 1000.0
      upper_bound: 10000.0
      unit: IU/L
      abnormal_flag: HIGH
      severity: MILD
      interpretation: >-
        10^3 to 10^4 IU/L; contributes 1 point to the FIGO/WHO prognostic score.
    - name: FIGO pre-treatment hCG score 2
      lower_bound: 10000.0
      upper_bound: 100000.0
      unit: IU/L
      abnormal_flag: HIGH
      severity: MODERATE
      interpretation: >-
        10^4 to 10^5 IU/L; contributes 2 points to the FIGO/WHO prognostic score.
    - name: FIGO pre-treatment hCG score 4
      lower_bound: 100000.0
      unit: IU/L
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
      interpretation: >-
        Above 10^5 IU/L; contributes the maximum 4 points on the hCG axis of the
        FIGO/WHO prognostic score and, with other adverse factors, drives the
        total into the high-risk (7 or more) category requiring multiagent
        chemotherapy.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GTN is nowadays diagnosed primarily based on\nserum hCG measurement combined with imaging studies."
    explanation: >-
      Establishes serum hCG as the primary diagnostic measurement in gestational
      trophoblastic neoplasia.
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pre-\n tr\neatment serum hCG (IU/L) <103 103 to 104 104 to 105 >105"
    explanation: >-
      The pre-treatment serum hCG row of the modified WHO/FIGO prognostic score
      table, giving the four risk tiers used for the interpretation bands above.
      The internal line breaks and the flattened exponents (103 for 10^3) are
      artefacts of PDF text extraction in the cached reference; the quoted string
      is an exact substring of that cache.
genetic:
- name: Paternal (Androgenetic) Allele Complement of Gestational Choriocarcinoma
  notes: >-
    Gestational choriocarcinoma carries the genome of the antecedent conceptus and
    therefore contains paternal alleles that are absent from the patient's own
    tissues; when the precursor is a complete hydatidiform mole the conceptus
    genome is entirely androgenetic. Short-tandem-repeat (STR) genotyping of tumour
    against patient normal tissue detects this foreign allele complement and is the
    definitive test separating gestational from non-gestational choriocarcinoma —
    a distinction with direct therapeutic consequences. Genotyping also identifies
    the index gestation and the interval since it, both of which are scored terms
    in the FIGO/WHO prognostic system. The imprinting mechanics of the molar
    precursor (CDKN1C/p57KIP2 loss on the absent maternal allele) are curated in
    Hydatidiform_Mole and Gestational_Trophoblastic_Neoplasm.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotyping detection of a\ndistinct paternal genetic complement not present in the\npatient’s normal tissues"
    explanation: >-
      Establishes the paternal allele complement as the genetic signature of
      gestational origin and the basis of the genotyping assay.
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FIGO/WHO prognostic scoring scheme requires ascertaining the \nprecise index gestational event and the time interval between the tumor and \nindex gestation, where DNA genotyping can provide highly relevant information."
    explanation: >-
      Shows that genotyping contributes directly to FIGO/WHO risk scoring by
      identifying the index gestation and interval.
- name: Host (Non-Paternal) Genome of Non-Gestational Choriocarcinoma
  notes: >-
    Non-gestational choriocarcinoma of germ cell origin carries only the patient's
    own alleles; the absence of a distinct paternal complement on STR genotyping is
    what identifies it. Somatic carcinomas with trophoblastic differentiation
    (which also lack paternal alleles) are the other member of this differential
    and are more aggressive and chemoresistant still. Because immunohistochemistry
    — including SALL4 — cannot discriminate these entities, genotyping rather than
    morphology drives the treatment decision.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA genotyping \nprovides a decisive tool in the separation of gestational trophoblastic \nneoplasia from non-gestational counterparts/mimics of either germ cell or \nsomatic origin."
    explanation: >-
      Establishes genotyping as the decisive discriminator between gestational
      choriocarcinoma and its non-gestational germ cell and somatic mimics.
  - reference: PMID:40588865
    reference_title: "Gestational Choriocarcinoma: A Timely Review of Diagnostic Pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "distinguishing gestational \nchoriocarcinoma from nongestational mimics of germ cell or somatic origin, which \nhave profound therapeutic and prognostic implications."
    explanation: >-
      Confirms that the gestational versus non-gestational distinction changes
      both therapy and prognosis.
diagnosis:
- name: Serum hCG Criteria for Post-Molar Gestational Trophoblastic Neoplasia
  description: >-
    Because hCG tracks viable trophoblast so tightly, gestational trophoblastic
    neoplasia is in practice diagnosed biochemically rather than histologically:
    a plateauing or rising hCG after evacuation of a mole establishes the
    diagnosis and triggers chemotherapy without a tissue confirmation. This is
    why choriocarcinoma has become a rare specimen in pathology laboratories even
    though the disease still occurs.
  diagnosis_term:
    preferred_term: Human Chorionic Gonadotropin Measurement
    term:
      id: NCIT:C75387
      label: Human Chorionic Gonadotropin Measurement
  markers: serum total hCG
  results: >-
    Plateauing or rising hCG after uterine evacuation, or persistence of a
    detectable level, defines persistent/malignant trophoblastic disease.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GTN is nowadays diagnosed primarily based on\nserum hCG measurement combined with imaging studies."
    explanation: >-
      States that serum hCG plus imaging, not histology, is the primary
      diagnostic route in contemporary practice.
  - reference: PMID:34669197
    reference_title: "Diagnosis and management of gestational trophoblastic disease: 2021 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up with \nhuman chorionic gonadotropin (hCG) is essential for early diagnosis of \ngestational trophoblastic neoplasia (GTN)."
    explanation: >-
      The FIGO 2021 update makes hCG follow-up the essential route to early GTN
      diagnosis.
- name: STR/DNA Genotyping for Gestational versus Non-Gestational Origin
  description: >-
    Short-tandem-repeat genotyping of tumour DNA against the patient's normal
    tissue looks for a paternal allele complement that the patient does not
    carry. Its presence proves gestational origin; its absence points to a germ
    cell tumour or a somatic carcinoma with trophoblastic differentiation. This
    is the only reliable discriminator - morphology and the trophoblastic
    immunohistochemical panel (including SALL4) cannot separate the entities -
    and it changes therapy, so it should precede treatment whenever origin is
    uncertain. Genotyping additionally identifies the index gestation and the
    interval since it, two scored terms in the FIGO/WHO prognostic system.
  diagnosis_term:
    preferred_term: Short tandem repeat genotyping of tumour versus normal tissue
    term:
      id: NCIT:C129889
      label: Short Tandem Repeat Profile
  markers: paternal (non-maternal) STR alleles in tumour DNA
  results: >-
    Presence of a distinct paternal allele complement absent from patient normal
    tissue confirms gestational choriocarcinoma; its absence indicates
    non-gestational germ cell or somatic origin.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotyping detection of a\ndistinct paternal genetic complement not present in the\npatient\u2019s normal tissues"
    explanation: >-
      Defines the analyte and the decision rule for the genotyping assay.
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA genotyping \nprovides a decisive tool in the separation of gestational trophoblastic \nneoplasia from non-gestational counterparts/mimics of either germ cell or \nsomatic origin."
    explanation: >-
      Establishes genotyping as the decisive test for the origin question that
      determines treatment.
- name: Staging Imaging for Metastatic Disease
  description: >-
    Once persistent trophoblastic disease is established, the metastatic survey
    drives both FIGO stage and the metastatic-site term of the prognostic score.
    Guideline-mandated studies are CT of thorax and abdomen, transvaginal
    ultrasound and MRI of the brain, with FDG-PET/CT reserved for equivocal
    findings. Brain imaging is not optional: cerebral deposits score the maximum
    4 points and change the regimen. Vascular metastases (notably vaginal
    deposits) should not be biopsied because of haemorrhage risk.
  diagnosis_term:
    preferred_term: Computed tomography and MRI staging survey
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: >-
    Distribution of metastases determines FIGO anatomical stage I-IV and the
    metastatic-site component of the FIGO/WHO prognostic score.
  evidence:
  - reference: PMID:37020431
    reference_title: "Gestational and Non-gestational Trophoblastic Neoplasia. Guideline of the DGGG, OEGGG and SGGG (S2k-Level, AWMF Registry No. 032/049, April 2022)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the following imaging examinations must be carried\nout: CT of the thorax and abdomen, transvaginal ultrasound, MRI of\nthe brain."
    explanation: >-
      A consensus-based guideline recommendation specifying the mandatory
      staging imaging once persistent villous trophoblastic disease is
      diagnosed.
- name: hCG-Defined Remission and Post-Treatment Surveillance
  description: >-
    Treatment is taken to a biochemical rather than a radiological endpoint.
    Chemotherapy continues until hCG is undetectable on at least three
    consecutive weekly measurements, followed by consolidation cycles, then
    prolonged monthly hCG surveillance under reliable contraception - because a
    subsequent pregnancy would itself raise hCG and mask relapse.
  diagnosis_term:
    preferred_term: Serial hCG measurement for remission and relapse surveillance
    term:
      id: NCIT:C75387
      label: Human Chorionic Gonadotropin Measurement
  markers: serum total hCG
  results: >-
    Three consecutive weekly undetectable hCG values define biochemical
    remission and trigger consolidation therapy; a subsequent rise indicates
    relapse.
  evidence:
  - reference: PMID:37020431
    reference_title: "Gestational and Non-gestational Trophoblastic Neoplasia. Guideline of the DGGG, OEGGG and SGGG (S2k-Level, AWMF Registry No. 032/049, April 2022)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3 consolidation cycles of mono-chemotherapy after hCG levels are\nno longer detectable (i.e., at least three consecutive weekly measure-\nments of hCG, with hCG levels below the detection limit)."
    explanation: >-
      Defines the hCG-based remission endpoint and the consolidation
      requirement that follows it.
environmental:
- name: Antecedent Complete Hydatidiform Mole
  influences_mechanisms:
  - target: Paternal Genome Content and Semi-Allogeneic Tumour Identity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      An unusually tight exposure-to-node fit: this node names the complete
      hydatidiform mole as the most common precursor and states that its
      conceptus genome is entirely androgenetic, which is the paternal genome
      content the node is built around. The exposure supplies the node's
      content rather than acting on it from outside. Both items are graded
      partial because each measures incidence, one the risk after a mole and
      one the fall in incidence once molar surveillance was introduced, rather
      than genome content.
    evidence:
    - reference: PMID:36286620
      reference_title: "Advances in diagnostics and management of gestational trophoblastic disease."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Choriocarcinoma affects approximately 1 in 40.000 pregnancies and 1 in 40 HMs."
      explanation: >-
        One in forty molar pregnancies against one in forty thousand
        pregnancies overall. The size of that gap is what makes the mole the
        dominant precursor, but it is an incidence figure.
    - reference: PMID:40588865
      reference_title: "Gestational Choriocarcinoma: A Timely Review of Diagnostic Pathology."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "gestational choriocarcinoma has become a rare encounter, largely owing to the implementation of postmolar surveillance programs and timely initiation of chemotherapy."
      explanation: >-
        Records that the disease became rare largely through postmolar
        surveillance. Removing the precursor reduces the disease, which is the
        strongest causal design available here.
  presence: PRESENT
  effect: Strongest single risk factor for gestational choriocarcinoma
  description: >-
    A prior complete hydatidiform mole raises the risk of choriocarcinoma roughly
    1000-fold over a background pregnancy, and about half of gestational
    choriocarcinomas follow a mole. This is the entire rationale for post-molar hCG
    surveillance programmes, and it is why widespread surveillance has made
    choriocarcinoma a progressively rarer diagnosis. The biology of the molar
    precursor lesion itself is curated in Hydatidiform_Mole.
  evidence:
  - reference: PMID:36286620
    reference_title: "Advances in diagnostics and management of gestational trophoblastic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choriocarcinoma affects approximately 1 in 40.000 \npregnancies and 1 in 40 HMs."
    explanation: >-
      The 1-in-40 risk after a hydatidiform mole versus 1-in-40,000 per pregnancy
      quantifies molar pregnancy as the dominant risk factor.
  - reference: PMID:40588865
    reference_title: "Gestational Choriocarcinoma: A Timely Review of Diagnostic Pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gestational choriocarcinoma has \nbecome a rare encounter, largely owing to the implementation of postmolar \nsurveillance programs and timely initiation of chemotherapy."
    explanation: >-
      Confirms that intervening on the molar precursor through surveillance has
      markedly reduced the incidence of clinically encountered choriocarcinoma.
- name: Extremes of Maternal Age
  presence: PRESENT
  effect: Increased incidence of gestational trophoblastic disease
  description: >-
    Gestational trophoblastic disease incidence is bimodally raised at the extremes
    of reproductive age - in adolescents and in women in their forties and early
    fifties. Age of at least 40 years additionally contributes a point to the
    FIGO/WHO prognostic score once disease has developed, so maternal age is both
    an incidence correlate and a prognostic term. Note that this is a
    disease-group-level (GTD) association rather than a choriocarcinoma-specific
    one.
  evidence:
  - reference: PMID:37020431
    reference_title: "Gestational and Non-gestational Trophoblastic Neoplasia. Guideline of the DGGG, OEGGG and SGGG (S2k-Level, AWMF Registry No. 032/049, April 2022)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "An increased incidence of\nGTD was found in younger (10 –19 years of age) and older (40 –\n54 years) women"
    explanation: >-
      A national guideline reports the bimodal age distribution; marked PARTIAL
      because the statistic covers gestational trophoblastic disease as a whole
      rather than choriocarcinoma specifically.
  - reference: PMID:38008872
    reference_title: "Review of current literature on gestational trophoblastic neoplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These include an increasing maternal age of around 40, previous history of molar pregnancy, blood group A and Asian ancestry"
    explanation: >-
      An independent review lists maternal age around 40 among the risk factors
      for GTN; PARTIAL for the same disease-group-level reason.
- name: Population and Host Correlates (Ancestry, Blood Group A)
  presence: PRESENT
  effect: Correlated with increased incidence of gestational trophoblastic disease
  description: >-
    Reported incidence is roughly double in Asian compared with Caucasian women,
    Black US-American women are over-represented in national registers, and blood
    group A has been reported as a correlate. These are population correlates, not
    established exposures or causal mechanisms: how much of the variation reflects
    reproductive patterns, nutrition, ascertainment and access to early ultrasound
    and hCG testing versus host genetics is unresolved, and the statistics are
    GTD-wide rather than choriocarcinoma-specific. Modelling note: ancestry and
    blood group are host attributes rather than environmental exposures, and are
    recorded here only because dismech has no dedicated population-correlate slot.
  evidence:
  - reference: PMID:38008872
    reference_title: "Review of current literature on gestational trophoblastic neoplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These include an increasing maternal age of around 40, previous history of molar pregnancy, blood group A and Asian ancestry"
    explanation: >-
      Lists blood group A and Asian ancestry among reported GTN risk correlates;
      PARTIAL because these are GTD/GTN-wide associations without a
      choriocarcinoma-specific effect estimate or a causal mechanism.
  - reference: PMID:37020431
    reference_title: "Gestational and Non-gestational Trophoblastic Neoplasia. Guideline of the DGGG, OEGGG and SGGG (S2k-Level, AWMF Registry No. 032/049, April 2022)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "and was also correlated with ethnicity. Black\nUS-American women are over-represented in national registers,"
    explanation: >-
      Confirms the ethnicity correlation and register over-representation;
      PARTIAL because it is a GTD-wide observation with no causal attribution.
differential_diagnoses:
- name: Placental site trophoblastic tumour
  disease_term:
    preferred_term: placental site trophoblastic tumor
    term:
      id: MONDO:0020552
      label: placental site trophoblastic tumor
  description: >-
    A gestational trophoblastic neoplasm of intermediate (implantation-site)
    trophoblast rather than of the biphasic cytotrophoblast/syncytiotrophoblast
    population that defines choriocarcinoma. It is the single most important
    GTN differential because it is relatively chemoresistant, so the
    distinction changes management from chemotherapy to hysterectomy.
  distinguishing_features:
  - >-
    Composed of mononuclear implantation-site intermediate trophoblast, without
    the biphasic/triphasic pattern and without the syncytiotrophoblastic
    component of choriocarcinoma.
  - >-
    Serum hCG is characteristically low relative to tumour burden, in contrast
    to the extreme hCG elevation of choriocarcinoma.
  - >-
    Relatively chemoresistant, so primary hysterectomy rather than
    methotrexate-based chemotherapy is the treatment of choice.
  evidence:
  - reference: PMID:36286620
    reference_title: "Advances in diagnostics and management of gestational trophoblastic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They consist of invasive mole, choriocarci-\nnoma, placental-site \ntrophoblastic tumour (PSTT) \nand epithelioid trophoblastic tumour (ETT)."
    explanation: >-
      Establishes PSTT as a separate malignant GTN entity from choriocarcinoma
      within the same disease family, which is what makes it the differential.
- name: Epithelioid trophoblastic tumour
  disease_term:
    preferred_term: epithelioid trophoblastic tumor
    term:
      id: MONDO:0016787
      label: epithelioid trophoblastic tumor
  description: >-
    A rare GTN of chorionic-type intermediate trophoblast that forms nodular,
    relatively circumscribed epithelioid nests and can mimic squamous carcinoma
    of the cervix. Like PSTT, it is relatively chemoresistant, so the boundary
    with choriocarcinoma is therapeutically consequential.
  distinguishing_features:
  - >-
    Chorionic-type intermediate trophoblast in nodular epithelioid nests rather
    than the biphasic trophoblastic proliferation of choriocarcinoma.
  - >-
    Lower serum hCG than choriocarcinoma and relative chemoresistance, favouring
    surgical management.
  evidence:
  - reference: PMID:36286620
    reference_title: "Advances in diagnostics and management of gestational trophoblastic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They consist of invasive mole, choriocarci-\nnoma, placental-site \ntrophoblastic tumour (PSTT) \nand epithelioid trophoblastic tumour (ETT)."
    explanation: >-
      Establishes ETT as a malignant GTN entity distinct from choriocarcinoma.
- name: Invasive hydatidiform mole
  disease_term:
    preferred_term: invasive hydatidiform mole
    term:
      id: MONDO:0020549
      label: invasive hydatidiform mole
  description: >-
    Molar tissue invading the myometrium. It is the commonest cause of a rising
    or plateaued post-molar hCG and is therefore the entity most often treated
    as "post-molar GTN" without histological confirmation - which is precisely
    why the boundary with choriocarcinoma matters: both are diagnosed on the
    same hCG criteria and treated on the same FIGO/WHO risk score, but only
    choriocarcinoma lacks chorionic villi.
  distinguishing_features:
  - >-
    Chorionic villi are retained, whereas the defining histological feature of
    choriocarcinoma is trophoblastic proliferation WITHOUT chorionic villi.
  - >-
    Generally a lower FIGO/WHO risk score and a better prognosis than
    choriocarcinoma.
  evidence:
  - reference: PMID:36286620
    reference_title: "Advances in diagnostics and management of gestational trophoblastic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They consist of invasive mole, choriocarci-\nnoma, placental-site \ntrophoblastic tumour (PSTT) \nand epithelioid trophoblastic tumour (ETT)."
    explanation: >-
      Establishes invasive mole as a separate GTN entity from choriocarcinoma.
- name: Complete hydatidiform mole
  disease_term:
    preferred_term: complete hydatidiform mole
    term:
      id: MONDO:0016785
      label: complete hydatidiform mole
  description: >-
    The commonest antecedent gestation of gestational choriocarcinoma and its
    main premalignant differential. A complete mole is androgenetic and shares
    the exclusively-paternal genome that this entry models as the trigger node,
    but it is a premalignant villous lesion rather than an invasive neoplasm.
  distinguishing_features:
  - >-
    Hydropic chorionic villi with circumferential trophoblastic hyperplasia are
    present; choriocarcinoma has no villi.
  - >-
    Premalignant rather than malignant: most complete moles resolve after
    evacuation, and only a minority progress to post-molar GTN.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotyping is now considered the gold standard in the con \ufb01rmation and subtyping of sporadic hydatidiform\nmoles."
    explanation: >-
      Supports genotyping as the confirmatory tool that separates mole subtypes.
      Marked PARTIAL because the snippet addresses mole subtyping rather than
      the mole-versus-choriocarcinoma boundary directly.
- name: Non-gestational choriocarcinoma
  disease_term:
    preferred_term: non-gestational ovarian choriocarcinoma
    term:
      id: MONDO:0004322
      label: non-gestational ovarian choriocarcinoma
  description: >-
    Choriocarcinoma arising from a germ cell tumour (or, rarely, as somatic
    dedifferentiation) rather than from a gestation. It is histologically
    indistinguishable from gestational choriocarcinoma, so the distinction rests
    entirely on DNA genotyping for paternal alleles. This is the most
    consequential differential in the entry: non-gestational disease lacks the
    semi-allogeneic paternal genome that the trigger node models, does not carry
    the same exquisite methotrexate sensitivity, and is treated on germ-cell
    (BEP-type) rather than GTN protocols with a worse prognosis. It is curated
    here both as a has_subtypes entry and as a differential for that reason.
  distinguishing_features:
  - >-
    Absence of paternal-specific alleles on short tandem repeat DNA genotyping;
    the tumour genome matches the patient.
  - >-
    Arises in the ovary or other germ-cell sites rather than following an
    identifiable index gestation.
  - >-
    Treated with platinum/bleomycin-based germ-cell chemotherapy and surgical
    staging rather than the methotrexate-based GTN protocols.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA genotyping provides a decisive tool in the separation of gestational\ntrophoblastic neoplasia from non-gestational counterparts/mimics of either germ cell or\nsomatic origin."
    explanation: >-
      States that DNA genotyping is the decisive test separating gestational
      from non-gestational choriocarcinoma, which is the discriminator this
      differential turns on.
stages:
- name: FIGO Stage I
  description: Disease confined to the uterus.
  evidence:
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "I Disease confined to the uterus"
    explanation: FIGO anatomical staging table, stage I.
- name: FIGO Stage II
  description: >-
    Disease extends outside the uterus but is limited to genital structures
    (adnexa, vagina, broad ligament).
  evidence:
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "II GTN extends outside of the uterus, but is limited \nto the genital structures (adnexae, vagina, broad \nligament)"
    explanation: FIGO anatomical staging table, stage II.
- name: FIGO Stage III
  description: >-
    Disease extends to the lungs, with or without known genital tract involvement.
  evidence:
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "III GTN extends to the lungs with or without known \ngenital tract involvement"
    explanation: FIGO anatomical staging table, stage III.
- name: FIGO Stage IV
  description: All other metastatic sites (notably liver and brain).
  evidence:
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IV All other metastatic sites"
    explanation: FIGO anatomical staging table, stage IV.
progression:
- phase: Low-risk course (FIGO/WHO score 0-6)
  notes: >-
    Treated with single-agent chemotherapy; overall survival approaches 100%.
    Scores of 5-6 are associated with more single-agent drug resistance and often
    require a change of agent or escalation to multiagent therapy, without loss of
    the near-universal cure rate.
  evidence:
  - reference: PMID:34669197
    reference_title: "Diagnosis and management of gestational trophoblastic disease: 2021 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although scores 5-6 are associated with more drug resistance, \noverall survival approaches 100%."
    explanation: >-
      Gives the low-risk trajectory, including the higher resistance rate at
      scores 5-6 despite near-universal survival.
- phase: High-risk course (FIGO/WHO score 7 or more, or stage IV)
  notes: >-
    Requires multiagent chemotherapy with adjuvant surgery for resistant foci or
    radiotherapy for brain metastases; survival is approximately 90%. Late
    mortality still occurs, almost entirely from recurrent treatment-resistant
    tumour.
  evidence:
  - reference: PMID:34669197
    reference_title: "Diagnosis and management of gestational trophoblastic disease: 2021 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-risk GTN (FIGO Stages II-III: score ≥7 \nand Stage IV) is treated with multiagent chemotherapy, with or without adjuvant \nsurgery for excision of resistant foci of disease or radiotherapy for brain \nmetastases, achieving a survival rate of approximately 90%."
    explanation: >-
      The FIGO 2021 update gives the high-risk treatment pathway and its
      approximate survival.
  - reference: PMID:34669197
    reference_title: "Diagnosis and management of gestational trophoblastic disease: 2021 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "late mortality still occurs from recurrent treatment-resistant tumors."
    explanation: >-
      Identifies recurrent treatment-resistant disease as the residual source of
      late mortality.
discussions:
- discussion_id: cc_nongestational_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Paternal Genome Content and Semi-Allogeneic Tumour Identity"
  prompt: >-
    Does non-gestational (germ cell) choriocarcinoma share the pathophysiology
    modelled here beyond the shared trophoblastic morphology, and how much worse
    is its outcome once stage and burden are matched?
  rationale: >-
    The non-gestational subtype is asserted as a mechanistically distinct arm of
    this entry, yet the entire arm rests on a handful of references, the largest
    of which is a pooled analysis of only 39 published cases. Nothing in the
    literature retrieved for this entry establishes whether the hCG-driven
    paraneoplastic axis, the PD-L1 immune-resistance mechanism, or the extreme
    chemosensitivity apply to the germ-cell form, and no matched comparative
    survival analysis against gestational disease exists. Because the
    gestational-versus-non-gestational call directly changes therapy, this is a
    consequential gap rather than an academic one.
  evidence:
  - reference: PMID:32185550
    reference_title: "Clinicopathological factors and prognosis analysis of 39 cases of non-gestational ovarian choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 39 patients were retrieved from 36 studies in total."
    explanation: >-
      The largest available synthesis of non-gestational ovarian choriocarcinoma
      is a pooled analysis of just 39 cases scraped from 36 separate reports,
      which is the direct measure of how thin the evidence base for this subtype
      is.
  - reference: PMID:40588865
    reference_title: "Gestational Choriocarcinoma: A Timely Review of Diagnostic Pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "distinguishing gestational \nchoriocarcinoma from nongestational mimics of germ cell or somatic origin, which \nhave profound therapeutic and prognostic implications."
    explanation: >-
      Establishes that the gestational versus non-gestational distinction carries
      profound therapeutic and prognostic consequences, which is what makes the
      thin non-gestational evidence base consequential rather than academic.
  proposed_experiments:
  - experiment_id: exp_cc_ngc_matched_outcome_cohort
    name: Matched-outcome cohort of genotype-confirmed non-gestational choriocarcinoma
    description: >-
      Assemble a multi-centre cohort of choriocarcinomas in which STR genotyping
      has confirmed the absence of a paternal allele complement, and compare
      stage- and burden-matched survival and chemotherapy response against
      genotype-confirmed gestational cases treated at the same centres. This
      would replace the current reliance on small pooled case series and test
      whether the worse outcome attributed to non-gestational disease survives
      adjustment for stage and tumour burden.
  - experiment_id: exp_cc_ngc_pdl1_immune_profiling
    name: PD-L1 and tumour-infiltrating lymphocyte profiling of non-gestational choriocarcinoma
    description: >-
      Apply the PD-L1 immunohistochemistry and immune-infiltrate profiling that
      established the adaptive immune-resistance mechanism in gestational
      choriocarcinoma to genotype-confirmed non-gestational cases. Because the
      non-gestational tumour is autologous rather than allogeneic, this directly
      tests whether the immune-evasion arm of this pathograph, and therefore the
      rationale for checkpoint blockade, generalises to the germ cell form.
- discussion_id: cc_no_validated_driver_gene
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Multidrug-Resistant Refractory Disease"
  prompt: >-
    What determines which choriocarcinomas become multidrug resistant, given that
    no validated somatic driver gene or resistance biomarker exists?
  rationale: >-
    Fewer than 5% of patients die, essentially all from multidrug-resistant
    disease, yet there is no recurrent somatic driver for choriocarcinoma and no
    validated predictor of resistance. Candidate resistance pathways surfaced in
    the deep-research sweep (DPP4/cholesterol synthesis, RSK2-SOX8, cfDNA signals
    involving BMPR1A and MAP3K1) are investigational and were deliberately not
    curated into the pathograph. Since the FIGO/WHO score is a clinical proxy
    rather than a biological one, a molecular predictor would change who is
    escalated up front.
  evidence:
  - reference: PMID:37758451
    reference_title: "Gestational choriocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some \n(<5.0%) will die as a result of multi-drug resistance, underscoring the need for \nnovel approaches in this group of patients."
    explanation: >-
      An expert review states that multidrug resistance is the residual cause of
      death and explicitly frames it as an unmet need requiring novel
      approaches, which is the gap this discussion records.
  proposed_experiments:
  - experiment_id: exp_cc_paired_resistance_multiomics
    name: Paired chemosensitive versus chemoresistant choriocarcinoma multi-omics
    description: >-
      Profile matched pre-treatment and post-relapse tumour material by
      whole-exome and transcriptome sequencing, with serial cell-free DNA
      sampling through treatment, to identify somatic or transcriptional changes
      that accompany the emergence of multidrug resistance in an otherwise
      near-curable disease.
  - experiment_id: exp_cc_resistance_biomarker_vs_figo
    name: Prospective comparison of candidate resistance biomarkers against the FIGO/WHO score
    description: >-
      Prospectively measure candidate resistance markers at diagnosis and test
      whether any adds predictive value over the FIGO/WHO prognostic score for
      single-agent failure, which would allow biologically rather than clinically
      driven up-front escalation.
treatments:
- name: Single-Agent Methotrexate
  description: >-
    First-line therapy for low-risk (FIGO score 0-6) gestational choriocarcinoma.
    Methotrexate, usually with folinic acid rescue, exploits the tumour's extreme
    proliferative fraction; treatment is continued to hCG normalisation plus
    consolidation courses. Overall survival approaches 100%, and fertility is
    preserved.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: High Proliferative Fraction and Chemosensitivity
    treatment_effect: INHIBITS
    description: >-
      Antifolate blockade of thymidylate and purine synthesis kills the rapidly
      cycling trophoblast population.
    evidence:
    - reference: PMID:34088998
      reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gestational choriocarcinoma is highly chemosensitive\nand responds well to single-agent methotrexate (low-risk\ndisease)"
      explanation: >-
        Links methotrexate response directly to the chemosensitivity of the
        tumour.
  evidence:
  - reference: PMID:34088998
    reference_title: "Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gestational choriocarcinoma is highly chemosensitive\nand responds well to single-agent methotrexate (low-risk\ndisease)"
    explanation: >-
      Establishes single-agent methotrexate as effective therapy for low-risk
      gestational choriocarcinoma.
  - reference: PMID:34669197
    reference_title: "Diagnosis and management of gestational trophoblastic disease: 2021 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low-risk GTN (FIGO Stages \nI-III: score <7) is treated with single-agent chemotherapy but may require \nadditional agents"
    explanation: >-
      The FIGO 2021 update specifies single-agent chemotherapy for low-risk
      disease.

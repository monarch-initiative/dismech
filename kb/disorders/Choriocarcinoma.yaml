- name: VEGF-Driven Neoangiogenesis
  biological_scale: CELLULAR
  role: effector
  conforms_to: "tumor_angiogenesis#Angiogenic Switch and VEGF-Driven Neovascularization"
  description: >-
    Neoplastic trophoblast drives VEGF-dependent neovascularisation, building the
    fragile, disorganised tumour vasculature that both sustains the rapidly
    expanding mass and creates the bleeding diathesis characteristic of
    choriocarcinoma deposits. This is the mechanistic anchor for the
    antiangiogenic arm of therapy: the VEGFR-2 inhibitor apatinib is combined
    with PD-1 blockade in multidrug-resistant disease, so the pathograph needs a
    node for that drug to target.
  notes: >-
    Evidence tier. The direct mechanistic demonstration that VEGF secretion
    drives angiogenic capacity in choriocarcinoma is IN_VITRO (choriocarcinoma
    cell lines), and no cited source quantifies VEGF expression or microvessel
    density in primary human gestational choriocarcinoma tissue. The clinical
    evidence is therapeutic-response evidence for VEGFR-2 inhibition rather than
    direct evidence of the mechanism, and is marked PARTIAL accordingly. This
    node is deliberately modelled at that honest strength rather than asserted
    as a settled human-tissue finding; a microvessel-density or VEGF-IHC series
    in gestational choriocarcinoma would upgrade it.
  cell_types:
  - preferred_term: syncytiotrophoblast cell

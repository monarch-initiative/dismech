- name: Hematogenous Dissemination and Pulmonary Colonisation
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "invasion_and_metastasis#Metastatic Colonization"
  description: >-
    Tumour emboli entering uterine veins arrive first at the pulmonary capillary
    bed, which is why the lung is by far the commonest metastatic site and why
    multiple rounded pulmonary nodules are a classic radiographic presentation.
    Onward arterial spread reaches vagina, liver, brain, spleen, kidney and bowel.
    Metastatic site is a weighted term in the FIGO/WHO prognostic score precisely
    because it stratifies risk: lung scores 0, spleen/kidney 1, gastrointestinal 2,
    and liver or brain 4. Colonisation can occur at very small primary tumour
    volume, so metastatic disease is a common first presentation.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  locations:
  - preferred_term: lung
    term:

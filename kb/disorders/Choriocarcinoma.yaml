name: Choriocarcinoma
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Choriocarcinoma is an aggressive malignant epithelial neoplasm of trophoblast,
  composed of a bi- or triphasic proliferation of mononuclear trophoblast
  (cytotrophoblast and intermediate trophoblast) and multinucleated
  syncytiotrophoblast, characteristically without chorionic villi. Neoplastic
  syncytiotrophoblast secretes large amounts of human chorionic gonadotropin
  (hCG), which serves as a highly sensitive diagnostic, risk-scoring and
  response-monitoring biomarker. The tumour retains and deregulates the
  physiologically invasive and angiogenic program of normal trophoblast, forming
  bulky, friable, haemorrhagic masses that permeate vessels early and disseminate
  hematogenously — most often to the lungs, and also to vagina, liver, brain,
  spleen, kidney and bowel.

  Two mechanistically distinct forms exist. Gestational choriocarcinoma arises
  from placental trophoblast of a prior gestation and therefore carries a genome
  that is wholly or partly paternal and foreign to the host — a natural
  allograft — most often following a complete hydatidiform mole, but also after
  term pregnancy, abortion or ectopic gestation. It is exquisitely chemosensitive
  and among the most curable of solid malignancies. Non-gestational
  choriocarcinoma is a germ-cell tumour that arises from the patient's own
  genome, typically in the ovary or testis of children and young adults, often as
  a component of a mixed germ cell tumour; it is treated as a germ cell malignancy
  (surgical staging plus bleomycin-based chemotherapy). It is generally regarded
  as having a worse prognosis, although no head-to-head comparative study is
  cited here for that claim. Because the two are histologically indistinguishable, DNA (STR)
  genotyping for a distinct paternal allele complement is the definitive
  discriminator, and it changes therapy.

  Scope note: this entry covers choriocarcinoma proper (both gestational and
  non-gestational). The broader gestational trophoblastic disease spectrum —
  invasive mole, placental-site trophoblastic tumour and epithelioid trophoblastic
  tumour — is curated in Gestational_Trophoblastic_Neoplasm, and the molar
  precursor lesions in Hydatidiform_Mole; those entries are cross-referenced
  rather than duplicated here.
categories:
- Trophoblastic Neoplasm
- Germ Cell Tumor
- Pregnancy-Associated Cancer

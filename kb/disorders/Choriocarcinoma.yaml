- name: Haemorrhagic Destruction of Colonised Organs
  biological_scale: TISSUE
  role: outcome
  description: >-
    Every choriocarcinoma deposit reproduces the vascular-erosive phenotype of the
    primary, so metastases behave less like space-occupying nodules and more like
    bleeding lesions. Pulmonary deposits cause haemoptysis and dyspnoea; vaginal
    deposits bleed and should not be biopsied; hepatic deposits bleed
    intra-abdominally; cerebral deposits may be silent or may cause fatal
    intracranial haemorrhage. This is also why induction chemotherapy is
    deliberately gentle in very-high-score disease — rapid lysis of a friable,
    highly vascular tumour risks catastrophic pulmonary, intraperitoneal or
    intracranial bleeding.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: brain
    term:
      id: UBERON:0000955

experimental_models:
- name: Immune-competent microvascularized lung-on-a-chip (IC-LOC) severe H1N1 model
  description: >-
    A microvascularized human small-airway chip carrying both tissue-resident
    (alveolar macrophage, dendritic cell, interstitial macrophage) and
    circulating immune populations alongside airway epithelium and stromal
    fibroblasts. Infection at high multiplicity reproduces the cytokine storm of
    severe influenza, and single-cell RNA sequencing plus targeted inhibition
    were used to separate the contributions of individual mediators. Its
    distinctive result is a dissociation that a cytokine panel alone would not
    reveal: IL-1beta and TNF-alpha, usually grouped together as pro-inflammatory
    drivers, act in opposite directions on the storm.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: epithelium of bronchiole
    term:
      id: UBERON:0002051
      label: epithelium of bronchiole
  cell_types:
  - preferred_term: Bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  - preferred_term: Alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: Lung fibroblast
    term:
      id: CL:0002553
      label: fibroblast of lung
  conditions:
  - influenza A H1N1 infection (MOI 10, severe)
  - IL-1beta inhibition (canakinumab)
  - TNF-alpha inhibition (infliximab)
  - CXCR4 inhibition (AMD3100)
  - oseltamivir
  culture_system: Microvascularized immune-competent lung-on-a-chip with airway and interstitial compartments
  publication: PMID:40987954
  modeled_mechanisms:
  - target: Inflammasome Activation and Cytokine Storm
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Severe H1N1 infection produced airway and interstitial cytokine profiles
      matching those measured in bronchoalveolar lavage fluid from patients with
      severe influenza. Selective inhibition then established directionality:
      blocking IL-1beta abolished the storm, whereas blocking TNF-alpha worsened
      it, identifying TNF-alpha as a regulator rather than a driver.
    limitations: >-
      The full immune response required adding circulating immune cells to the
      resident populations, so the model's fidelity depends on a reconstruction
      choice rather than on intrinsic tissue composition. It carries no adaptive
      memory, no systemic organ crosstalk, and a single donor genotype per

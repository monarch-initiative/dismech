    description: >
      Antipyretics, hydration, and rest for mild cases. Mechanical ventilation and
      intensive care for severe respiratory failure.
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
datasets:
- accession: geo:GSE319516
  title: Obesity-associated meta-inflammation alters influenza A antiviral responses in Göttingen minipigs
  description: Obesity is a well-recognized risk factor for increased severity following influenza A virus (IAV) infection, likely by promoting meta-inflammation and immune dysregulation, but its effects on antiviral and inflammatory responses remain poorly understood. Using a Göttingen minipig model of diet-induced obesity, we compared antiviral and inflammatory responses before and after IAV infection. Respiratory tract transcriptomics and histopathology revealed no clear obesity-associated immune or inflammatory changes in uninfected minipigs. In contrast, obese pigs showed reduced viral clearance in nasal mucosal tissue accompanied by altered antiviral gene expression pattern four days post infection.
  organism:
    preferred_term: pig
    term:
      id: NCBITaxon:9823
      label: Sus scrofa
  data_type: BULK_RNA_SEQ
  sample_count: 25
  notes: Identified by GEO DataSets index search for Influenza (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001005000
  title: single cell sequencing of resting and Influenza-stimulated mononcluear phagocytes of African and Europeans with varying degree of ex-vivo susceptibility to Influenza
  description: There is considerable inter-individual immunological and clinical variability upon influenza A virus (IAV) infection in humans; yet, the factors underlying such heterogeneity remain elusive. Here, using an ex vivo cellular model that captures natural variation in the transcriptional responses of monocytes to IAV, we find significant differences in viral mRNA levels between individuals of African and European ancestry. Using single cell analyses, we show that the overall number of cells that will ultimately become infected, rather than the amount of viral transcript expression per cell, is the main driver of the surprisingly higher IAV mRNA levels detected in European cells.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Influenza"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: massive:MSV000078740
  title: LC-MS/MS analyses of purified virions of influenza A and B viruses, grown in a range of hosts.
  description: LC-MS/MS analyses of purified virions of influenza A and B viruses, grown in a range of hosts. Described in Hutchinson et al. 'Conserved and host-specific features of influenza virion architecture.'
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Influenza"). Retrieved 2026-08-02.
- accession: massive:MSV000078741
  title: Interactome of the influenza A virus transcription/replication machinery
  description: Analyses of AP-MS experiments performed in HEK 293T cells infected with the influenza A/WSN/33 virus. In half of the experiments the virus was modified to contain a C-terminal Strep tag on the polymerase subunit PB2. Full details in York et al. 'Interactome analysis of the influenza A virus transcription/replication machinery identifies protein phosphatase 6 as a cellular factor required for efficient virus replication.'
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Influenza"). Retrieved 2026-08-02.
- accession: massive:MSV000086108
  title: Influenza vaccination in the elderly boosts antibodies against conserved viral proteins and egg-produced glycans
  description: Proteomic analysis of serum IgG antibody repertoire against influenza vaccine H1 (H1N1 A/California/7/2009) and H3 (H3N2 A/Texas/50/2012) in young, middle-aged, and elderly donors vaccinated with Fluzone 2013-14/14-15. Dataset consists of peak-response (days 21-28 post-vaccination) serum IgG samples eluted by affinity chromatography against H1 and H3 vaccine or hemagglutinin and the flow-throughs.

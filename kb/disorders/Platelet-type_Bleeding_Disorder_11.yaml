- name: Failure of Collagen-Induced Platelet Activation
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Adhesion to the Injured Vessel Wall"
  mechanism_confidence: ESTABLISHED
  description: >-
    GPVI is the activating, not the adhesive, collagen receptor: platelets
    lacking it still tether to collagen but do not switch on. Patient platelets
    show no aggregation and no secretion to collagen, convulxin or the
    collagen-related peptide, while responses to ADP and other agonists are
    preserved - the pharmacological signature of a single receptor loss.
    Spreading on collagen, and on von Willebrand factor, is abolished. The
    defect is agonist-specific, which is why a routine platelet count and most
    of a standard aggregometry panel are normal.
